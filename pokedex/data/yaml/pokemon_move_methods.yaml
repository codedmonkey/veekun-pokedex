level-up:
  description:
    en: 'Learned when a Pokémon reaches a certain level.'
    de: 'Wird gelernt, wenn ein Pokémon ein bestimmtes Level erreicht.'
    es: 'Se aprende cuando un pokemon alcanza un cierto nivel.'
    cs: 'Učení dosažením určité úrovně.'
  name:
    en: 'Level up'
    de: 'Level up'
    es: Nivel
    cs: Úrovní
egg:
  description:
    en: 'Appears on a newly-hatched Pokémon, if the father had the same move.'
    de: 'Erscheint bei einem frisch geschlüpften Pokémon, wenn der Vater die selbe Fähigkeit hatte.'
    es: 'Aparece en un Pokémon recién nacido, si el padre tuvo el mismo movimiento.'
    cs: 'Dědí se od otce.'
  name:
    en: Egg
    de: Ei
    es: Huevo
    cs: Vajíčkový
tutor:
  description:
    en: 'Can be taught at any time by an NPC.'
    de: 'Kann jederzeit von einem NPC erlernt werden.'
    es: ' Puede ser enseñado en cualquier momento por un NPC.'
    cs: 'Učené nějakou postavou ve hře.'
  name:
    en: Tutor
    de: Tutor
    es: Tutor
    cs: 'Od učitele'
machine:
  description:
    en: 'Can be taught at any time by using a TM or HM.'
    de: 'Kann jederzeit durch das benutzen eines TM oder VM erlernt werden.'
    es: 'Se puede enseñar en cualquier momento usando una MT o MO.'
    cs: 'Učené použitím TM nebo HM'
  name:
    en: Machine
    de: Maschine
    es: Máquina
    cs: Přístrojem
stadium-surfing-pikachu:
  description:
    en: 'Learned when a non-rental Pikachu helps beat Prime Cup Master Ball R-2.  It must participate in every battle, and you must win with no continues.'
    de: 'Wird gelernt, wenn ein Pikachu dabei hilft den Premium-Cup in der Kategorie Meisterball ohne unterbrechung zu besiegen.  Es muss in jedem Kampf teilnehmen.'
  name:
    en: 'Stadium: Surfing Pikachu'
    de: 'Stadium: Surfendes Pikachu'
    cs: 'Stadium: Surfující Pikachu'
light-ball-egg:
  description:
    en: 'Appears on a Pichu whose mother was holding a Light Ball.  The father cannot be Ditto.'
    de: 'Erscheint bei einem Pichu dessen Mutter einen Kugelblitz trug.  Der Vater darf nicht Ditto sein.'
    cs: 'Objeví se u Pichu, jehož matka držela Light Ball. Otec nesmí být Ditto.'
  name:
    en: 'Volt Tackle Pichu'
    de: 'Volttackle Pichu'
    cs: 'Light Ball'
colosseum-purification:
  description:
    en: 'Appears on a Shadow Pokémon as it becomes increasingly purified.'
    cs: 'Objeví se u „Shadow“ pokémona, jak se mu otevírá srdce.'
  name:
    en: 'Colosseum: Purification'
    cs: 'Colosseum: Purifikace'
xd-shadow:
  description:
    en: 'Appears on a Snatched Shadow Pokémon.'
    cs: 'U ukradených „Shadow“ pokémonů'
  name:
    en: 'XD: Shadow'
    cs: 'XD: Stínový útok'
xd-purification:
  description:
    en: 'Appears on a Shadow Pokémon as it becomes increasingly purified.'
    cs: 'Objeví se u „Shadow“ pokémona, jak se mu otevírá srdce.'
  name:
    en: 'XD: Purification'
    cs: 'XD: Purifikace'
form-change:
  description:
    en: 'Appears when Rotom or Cosplay Pikachu changes form.  Disappears if the Pokémon becomes another form and this move can only be learned by form change.'
    de: 'Erscheint, wenn Rotom seine Form wechselt.  Verschwindet wenn Rotom eine andere Form an nimmt. Diese Fähigkeit kann nur durch wechseln der Form erlernt werden.'
    cs: 'Objeví se u Rotoma, když se změní do určité formy.  Zmizí, když se Rotom změní do jiné formy, pokud se tento útok dá naučit jen změnou formy.'
  name:
    en: 'Form Change'
    de: 'Rotom Formen'
    cs: 'Forma Rotoma'
zygarde-cube:
  description:
    en: 'Can be taught using the Zygarde Cube.  Must find the corresponding Zygarde Core first in Sun/Moon.  All moves are available immediately in Ultra Sun/Ultra Moon.'
  name:
    en: 'Zygarde Cube'
