  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        はたけに　うえて　つかう　タネ。
        うえる　はたけに　よって　できる
        にんじんの　しゅるいが　かわる。
      ja: |-
        畑に　植えて　使う　タネ。
        植える　畑に　よって　できる
        にんじんの　種類が　変わる。
      ko: |-
        밭에 심을 수 있는 씨.
        심은 밭에 따라
        자라는 당근의 종류가 달라진다.
      zh-Hant: |-
        可以種在田地裡的種子。
        長出來的蘿蔔種類會根據
        種下它的田地而不同。
      zh-Hans: |-
        种在田地里使用的种子。
        出产的萝卜种类会根据
        种下的田地而有所不同。
      en: |-
        Seeds to plant in a field. The kind of carrot you’ll get is
        determined by which field you plant the seeds in.
      fr: |-
        Des graines à planter dans un champ. L’espèce
        de carotte obtenue varie selon le type de sol.
      de: |-
        Samen, die sich auf einem Feld einpflanzen lassen.
        Je nachdem, wie dieses beschaffen ist, wächst dort
        eine andere Karottenart.
      es: |-
        Semillas para plantar en un huerto. Permiten obtener
        un tipo u otro de zanahoria en función del lugar elegido
        para su cultivo.
      it: |-
        Dei semi da piantare in un campo. La varietà di carote
        ottenibili cambia in base al terreno.
