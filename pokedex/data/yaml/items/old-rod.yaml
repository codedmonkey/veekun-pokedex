        ふるくて　ボロい　つりざお。
        みずの　ある　ばしょで　つかうと
        ポケモンが　つれる。
      ja: |-
        ふるくて　ボロい　つりざお。
        水の　ある　場所で　使うと
        ポケモンが　つれる。
