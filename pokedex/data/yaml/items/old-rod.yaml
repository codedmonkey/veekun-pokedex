        Eine alte, abgenutzte Angel. Damit kannst du
        in jedem Gewässer nach Pokémon angeln.
      es: |-
        Fantástico medicamento vendido en la farmacia
        de Ciudad Orquídea. Cura completamente a un
        Pokémon.
      it: |-
        Amo vecchio e rovinato. Si usa per pescare
        Pokémon selvatici in qualsiasi specchio d’acqua.
