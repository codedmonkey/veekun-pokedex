        낡고 조잡한 낚싯대.
        물이 있는 장소에서 사용하면
        포켓몬을 낚을 수 있다.
      en: |-
        An old and beat-up fishing rod.
        Use it at any body of water to
        fish for wild aquatic Pokémon.
      fr: |-
        Une vieille canne usée.
        Utilisez-la pour pêcher des Pokémon sauvages
        dans les points d’eau.
