        技を　だせなくなったときに
        １度だけ　回復する。
      ko: |-
        지니게 한 포켓몬은
        헤롱헤롱 상태가 되었을 때
        한 번만 회복한다.
      zh-Hant: |-
        當攜帶它的寶可夢
        無法自由使出招式時，
        會僅回復１次。
      zh-Hans: |-
        当携带它的宝可梦
        无法自由使出招式时，
        仅会回复１次。
      en: |-
        An item to be held by a Pokémon. The holder
        shakes off move-binding effects to move freely.
        It can be used only once.
      fr: |-
        Objet à tenir. Guérit de certaines attaques
        limitant le choix des capacités.
        Ne peut être utilisé qu’une fois.
      de: |-
        Ein Item, das von einem Pokémon getragen werden
        kann. Befreit den Träger einmalig von Effekten, die
        ihn vom Einsatz von Attacken abhalten.
      es: |-
        El Pokémon que la lleva se libera del efecto de
        movimientos que restringen sus acciones. Solo
        puede usarse una vez.
      it: |-
        Strumento monouso che guarisce il Pokémon
        dalle condizioni che gli impediscono di usare
        le sue mosse.
