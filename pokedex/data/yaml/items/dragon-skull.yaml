        あれくるう　うみを　ものともせず
        じゆうに　とびまわっていたと　される
        ポケモンの　あたまの　ホネ。
      ja: |-
        荒れ狂う　海を　ものともせず
        自由に　とびまわっていたと　される
        ポケモンの　頭の　ホネ。
      ko: |-
        성난 바다 위를 개의치 않고
        자유롭게 날아다녔다는
        포켓몬의 머리뼈.
      en: |-
