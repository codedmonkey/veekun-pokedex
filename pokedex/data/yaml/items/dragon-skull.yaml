dragon-skull:
  category: plot-advancement
  cost: 0
  effect:
    en: 'Only used as a plot point; this item is given to the player and taken away in the same cutscene.'
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        A skull of a Pokémon which was said to
        have braved the angry waters to fly
        around the world.
      fr: |-
        Crâne d’un Pokémon qui
        aurait survolé librement
        la mer déchaînée.
    black-2-white-2:
      en: |-
        A skull of a Pokémon which was said to
        have braved the angry waters to fly
        around the world.
    x-y:
