        Der Schädel eines Pokémon, das einst
        wütendem Seegang zum Trotz frei um
        die Welt flog.
      es: |-
        Aumenta ligeramente la Precisión en combate.
        Al cambiar de Pokémon, el efecto desaparece.
      it: |-
        Teschio di un Pokémon che sorvolava libero i mari
        senza temere neanche le più forti tempeste.
