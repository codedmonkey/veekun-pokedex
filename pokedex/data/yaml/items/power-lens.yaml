        여느 때보다 포켓몬의 특수공격을
        올리면서 키우기가 쉽다.
      zh-Hant: |-
        雖然攜帶後速度會降低，
        但寶可夢的特攻
        會比平時培育得更高。
      zh-Hans: |-
        虽然携带后速度会降低，
        但宝可梦的特攻
        会比平时成长得更高。
      en: |-
