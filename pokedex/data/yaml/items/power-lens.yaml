power-lens:
  category: effort-training
  cost: 3000
  effect:
    en: "Held: Decreases the holder's Speed by 50%.  Whenever the holder gains Special Attack effort from battle, increases that effort by 4; this applies before the PokéRUS doubling effect."
  flags:
    - holdable
    - holdable-active
  flavor_text:
    diamond-pearl:
      en: |-
        A Pokémon hold item that promotes
        Sp. Atk gain on leveling, but reduces
        the Speed stat.
    platinum:
      en: |-
        A Pokémon hold item that promotes
        Sp. Atk gain on leveling, but reduces
        the Speed stat.
    heartgold-soulsilver:
      en: |-
        A Pokémon held item that promotes
        Sp. Atk gain on leveling, but reduces
        the Speed stat.
    black-white:
      en: |-
        A Pokémon held item that promotes
        Sp. Atk gain on leveling, but reduces
        the Speed stat.
      fr: |-
        Objet à tenir augmentant l’Attaque
        Spéciale lors des montées de niveau mais
        réduisant la Vitesse pendant le combat.
    black-2-white-2:
      en: |-
        A Pokémon held item that promotes
        Sp. Atk gain on leveling, but reduces
        the Speed stat.
    x-y:
      ja-Hrkt: |-
        もたせると　すばやさが　さがるが
        ふつうよりも　ポケモンの　とくこうが
        たかく　そだちやすい。
      ja: |-
        持たせると　素早さが　さがるが
        ふつうよりも　ポケモンの　特攻が
        高く　育ちやすい。
      ko: |-
        지니게 하면 스피드는 떨어지지만
        여느 때보다 포켓몬의 특수공격을
        올리면서 키우기가 쉽다.
      en: |-
        An item to be held by a Pokémon.
        It reduces Speed but allows the holder’s
        Sp. Atk stat to grow more after battling.
      fr: |-
        Objet à tenir. Permet à l’Attaque Spéciale de
        progresser plus vite, mais réduit la Vitesse
        pendant le combat.
      de: |-
        Ein Item zum Tragen. Erhöht bei Levelaufstieg
        den Spezial-Angriffs-Wert, senkt aber die
        Initiative.
      es: |-
        Tabla de piedra que potencia los movimientos de
        tipo Bicho. Debe llevarla un Pokémon.
      it: |-
        Strumento da dare a un Pokémon. Riduce la
        Velocità nella lotta ma permette ai punti base
        dell’Attacco Speciale di crescere più rapidamente.
    sun-moon:
      ja-Hrkt: |-
        もたせると　すばやさが　さがるが
        ふつうよりも　ポケモンの　とくこうが
        たかく　そだちやすい。
      ja: |-
