tm98:
  category: all-machines
  cost: 1000
  effect:
    en: 'Teaches a Pokémon TM98.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        くりかえし　うつことで
        だんだん　こぶしが　かたくなる。
        あいてに　あてると　こうげきが　あがる。
      ja: |-
        くり返し　打つことで
        だんだん　こぶしが　固くなる。
        相手に　あてると　攻撃が　あがる。
      ko: |-
        반복해서 쓰면
        점점 주먹이 단단해진다.
        상대에게 맞히면 공격이 올라간다.
      en: |-
        Striking opponents over and over
        makes the user’s fists harder.
        Hitting a target raises the Attack stat.
      fr: |-
        À force de frapper, les poings deviennent plus
        durs. Augmente l’Attaque du lanceur si l’ennemi
        est touché.
      de: |-
        Durch wiederholtes Zuschlagen werden die
        Fäuste des Anwenders allmählich härter.
        Trifft er den Gegner, steigt sein Angriffs-Wert.
      es: |-
        Fósil de un Pokémon prehistórico terrestre.
        Parece la impresión de una aleta.
      it: |-
        Rende i pugni più duri a ogni colpo inferto.
        Se i pugni vanno a segno, aumenta l’Attacco.
    sun-moon:
      ja-Hrkt: |-
        すごい　いきおいで　あいてに　つっこむ。
        あいてを　ひるませる　ことが　ある。
      ja: |-
        すごい　勢いで　相手に　つっこむ。
        相手を　ひるませることが　ある。
      ko: |-
        굉장한 기세로 상대에게 돌진한다.
        상대를 풀죽게 만들 때가 있다.
      zh-Hant: |-
        以驚人的氣勢撲向對手。
        有時會讓對手畏縮。
      zh-Hans: |-
        以惊人的气势扑向对手。
        有时会使对手畏缩。
      en: |-
        The user charges at the target and may make
        it flinch.
      fr: |-
        Le lanceur charge l’ennemi à une vitesse
        remarquable, ce qui peut l’apeurer.
      de: |-
        Eine mächtige Attacke, durch die das Ziel eventuell
        zurückschreckt.
      es: |-
        Embiste con un gran impulso que puede hacer
        retroceder.
      it: |-
        Carica il bersaglio a grande velocità e può farlo
        tentennare.
