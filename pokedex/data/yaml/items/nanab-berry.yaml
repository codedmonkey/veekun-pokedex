    generation-vi: 166
    generation-vii: 166
    generation-viii: 166
  name:
    ja-Hrkt: ナナのみ
    ja: ナナのみ
    ko: 나나열매
    zh-Hant: 蕉香果
    zh-Hans: 蕉香果
    en: 'Nanab Berry'
    fr: 'Baie Nanab'
    de: Nanabbeere
    es: 'Baya Latano'
    it: Baccabana
  short_effect:
    en: 'Used for creating PokéBlocks and Poffins.'
