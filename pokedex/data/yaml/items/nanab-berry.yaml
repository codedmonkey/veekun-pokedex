    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        ポケモンを　つかまえる　ときに
        あたえると　すこし　おちつく　きのみ。
      ja: |-
        ポケモンを　捕まえる　ときに
        あたえると　少し　落ち着く　きのみ。
      ko: |-
        포켓몬을 잡을 때 주면
        조금 얌전해지는 나무열매.
      zh-Hant: |-
        在捕捉時把這個樹果餵給寶可夢，
        就能稍微讓牠們的情緒穩定下來。
      zh-Hans: |-
        捕捉宝可梦时，
        把这树果交给宝可梦就能
        稍微平复一下对方的情绪。
      en: |-
        A Berry that calms wild Pokémon you’re trying to catch
        slightly when given to them.
      fr: |-
        Une Baie à donner à un Pokémon sauvage au moment
        de la capture pour le calmer un court instant.
      de: |-
        Gibst du diese Beere einem Pokémon zu essen,
        wird es während des Fangversuchs etwas ruhiger.
      es: |-
        Una baya que puedes lanzar a un Pokémon salvaje
        para tranquilizarlo un poco.
      it: |-
        Bacca che calma un po’ il Pokémon selvatico
        a cui viene data.
    sword-shield:
      ja-Hrkt: |-
