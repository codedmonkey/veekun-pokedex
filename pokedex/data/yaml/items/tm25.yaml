        연속으로 쓰면 실패하기 쉽다.
      zh-Hant: |-
        完全防住對手的所有攻擊。
        連續使用時容易失敗。
      zh-Hans: |-
        完全抵挡
        对手的攻击。
        连续使出则容易失败。
      en: |-
        This move enables the user to protect itself from
        all attacks. Its chance of failing rises if it is used
        in succession.
      fr: |-
        Le lanceur se protège de toutes les attaques.
        Peut échouer si utilisée plusieurs fois de suite.
      de: |-
