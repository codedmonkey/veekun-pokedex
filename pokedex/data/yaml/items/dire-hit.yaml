dire-hit:
  category: stat-boosts
  cost: 1000
  effect:
    en: |-
      Used on a party Pokémon in battle
      :   Increases the target's [critical hit chance]{mechanic:critical-hit-chance} by one stage until it leaves the field.  Increases happiness by 1/1/0.
  flags:
    - countable
    - consumable
    - usable-in-battle
    - holdable
  flavor_text:
    ruby-sapphire:
      en: |-
        Raises the
        critical-hit ratio
        during one battle.
    emerald:
      en: |-
        Raises the
        critical-hit ratio
        during one battle.
    firered-leafgreen:
      en: |-
        Raises the critical-hit ratio of
        POKéMON in battle. Wears off if the
        POKéMON is withdrawn.
    diamond-pearl:
      en: |-
        An item that raises the critical-hit
        ratio of a Pokémon in battle. It wears
        off if the Pokémon is withdrawn.
    platinum:
      en: |-
        An item that raises the critical-hit
        ratio of a Pokémon in battle. It wears
        off if the Pokémon is withdrawn.
    heartgold-soulsilver:
      en: |-
        An item that raises the critical-hit
        ratio of a Pokémon in battle. It wears
        off if the Pokémon is withdrawn.
    black-white:
      en: |-
        It raises the critical-hit ratio greatly.
        It can be used only once and wears off
        if the Pokémon is withdrawn.
      fr: |-
        Monte fortement le taux de critiques.
        Utilisable une seule fois. L’effet
        disparaît si le Pokémon se retire.
    black-2-white-2:
      en: |-
        It raises the critical-hit ratio greatly.
        It can be used only once and wears off
        if the Pokémon is withdrawn.
    x-y:
      ja-Hrkt: |-
        きゅうしょりつが　おおきく　あがる。
        いちどしか　つかうことが　できない。
        ひっこめると　もとに　もどる。
      ja: |-
        急所率が　大きく　あがる。
        １度しか　使うことが　できない。
        ひっこめると　元に　戻る。
      ko: |-
        급소 명중률이 크게 올라간다.
        한 번밖에 쓸 수 없다. 포켓몬을 볼에
        넣어버리면 원래대로 되돌아간다.
      en: |-
        An item that raises the critical-hit ratio
        greatly. It can be used only once and
        wears off if the Pokémon is withdrawn.
      fr: |-
        Augmente fortement le taux de critiques.
        Utilisable une seule fois. L’effet disparaît si
        le Pokémon se retire.
      de: |-
        Hebt einmalig die Volltrefferquote des Pokémon
        im Kampf stark an. Die Wirkung endet mit dem
        Austausch des Pokémon.
      es: |-
        Aumenta el índice de golpe crítico en combate.
        Al cambiar de Pokémon, el efecto desaparece.
      it: |-
        Aumenta la probabilità di sferrare brutti colpi.
        Si può usare una sola volta e l’effetto svanisce
        se il Pokémon è sostituito.
