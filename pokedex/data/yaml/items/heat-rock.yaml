heat-rock:
  category: held-items
  cost: 4000
  effect:
    en: "Held: The holder's Sunny Day will create sunshine lasting for eight turns rather than five.  As this item affects the move rather than the weather itself, the effect is not lost if the holder leaves battle or drops this item."
  flags:
    - holdable
    - holdable-active
    - underground
