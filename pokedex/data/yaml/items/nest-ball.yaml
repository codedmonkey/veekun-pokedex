nest-ball:
  category: special-balls
  cost: 1000
  effect:
    en: |-
      Used in battle
      :   Attempts to [catch]{mechanic:catch} a wild Pokémon.  Has a catch rate of given by `(40 - level) / 10`, where `level` is the wild Pokémon's level, to a maximum of 3.9× for level 1 Pokémon.  If the wild Pokémon's level is higher than 30, this ball has a catch rate of 1×.

          If used in a trainer battle, nothing happens and the ball is lost.
  flags:
    - countable
    - consumable
    - usable-in-battle
    - holdable
  flavor_text:
    ruby-sapphire:
      en: |-
        A BALL that works
        better on weaker
        POKéMON.
    emerald:
      en: |-
        A BALL that works
        better on weaker
        POKéMON.
    firered-leafgreen:
      en: |-
        A somewhat different BALL that
        works especially well on weaker
        POKéMON.
    diamond-pearl:
      en: |-
        A somewhat different Poké Ball that
        works especially well on weaker
        Pokémon in the wild.
    platinum:
      en: |-
