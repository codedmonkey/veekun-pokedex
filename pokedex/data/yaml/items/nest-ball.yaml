      en: |-
        A somewhat different Poké Ball that
        works especially well on weaker
        Pokémon in the wild.
    x-y:
      ja-Hrkt: |-
        つかまえる　やせいの　ポケモンが
        よわいほど　つかまえやすくなる
        ちょっと　かわった　ボール。
      ja: |-
        捕まえる　野生の　ポケモンが
        弱いほど　捕まえやすくなる
        ちょっと　変わった　ボール。
      ko: |-
        잡으려는 야생 포켓몬이
        약할수록 잡기 쉬운
        조금 특이한 볼.
      en: |-
        A somewhat different Poké Ball that
        becomes more effective the lower
        the level of the wild Pokémon.
      fr: |-
        Une Poké Ball un peu spéciale qui fonctionne
        particulièrement bien sur les Pokémon les plus
        faibles.
      de: |-
        Ein Ball, dessen Erfolgsquote besonders bei
        Pokémon mit niedrigem Level sehr hoch ist.
      es: |-
        Es algo distinta a las demás. Funciona
        especialmente bien con los Pokémon salvajes
        de nivel bajo.
      it: |-
        Poké Ball un po’ diversa. Risulta particolarmente
        efficace sui Pokémon selvatici più deboli.
