shiny-charm:
  category: gameplay
  cost: 0
  effect:
    en: ''
  flags: {  }
  flavor_text:
    black-2-white-2:
      en: |-
        A shiny charm said to increase
        the chance of finding a
        Shiny Pokémon.
    x-y:
      ja-Hrkt: |-
        もっていると　ひかる　ポケモンと
        であいやすくなる　といわれる
        ふしぎで　ひかりかがやく　おまもり。
      ja: |-
        持っていると　ひかる　ポケモンと
        出会いやすくなる　といわれる
        不思議で　ひかりかがやく　おまもり。
      ko: |-
        지니고 있으면 빛나는 포켓몬과
        만나기 쉬워진다고 전해지는
        이상하고 매우 반짝이는 부적.
      en: |-
        A shiny charm said to increase
        the chance of finding a Shiny
        Pokémon in the wild.
      fr: |-
        Un mystérieux charme scintillant qui facilite
        la rencontre avec les Pokémon chromatiques.
      de: |-
        Ein mysteriöser, schillernder Glücksbringer,
        der die Wahrscheinlichkeit erhöht,
        Schillernde Pokémon zu finden.
      es: |-
        Una flauta con un timbre tan dulce y hermoso que
        despierta hasta el Pokémon más profundamente
        dormido.
      it: |-
        Misterioso amuleto luminoso che aumenta
        la probabilità di incontrare Pokémon cromatici.
    sun-moon:
      ja-Hrkt: |-
