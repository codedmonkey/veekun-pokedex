        しんかさせる　ふしぎな　いし。
        たいようのように　あかい。
      ja: |-
        ある　特定の　ポケモンを
        進化させる　不思議な　石。
        太陽のように　赤い。
      ko: |-
        어느 특정 포켓몬을
        진화시키는 이상한 돌.
        태양처럼 빨갛다.
      en: |-
        A peculiar stone that can make
        certain species of Pokémon evolve.
        It burns as red as the evening sun.
      fr: |-
        Une pierre étrange qui fait évoluer certaines
        espèces de Pokémon. Elle est rouge comme
        le soleil couchant.
      de: |-
        Dieser spezielle Stein löst bei bestimmten
        Pokémon die Entwicklung aus. Er ist rot wie
        die Abendsonne.
      es: |-
        Curiosa piedra que hace evolucionar a
        determinadas especies de Pokémon. Es roja
        como el núcleo del sol.
      it: |-
        Pietra particolare che fa evolvere determinate
        specie di Pokémon. È rossa come il sole
        al tramonto.
