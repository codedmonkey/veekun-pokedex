gyaradosite:
  category: mega-stones
  cost: 0
  effect:
    en: 'Held: Allows Gyarados to Mega Evolve into Mega Gyarados.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        ギャラドスに　もたせておくと
        たたかいのとき　メガシンカが　できる
        ふしぎな　メガストーンの　いっしゅ。
      ja: |-
        ギャラドスに　持たせておくと
        戦いのとき　メガシンカが　できる
        不思議な　メガストーンの　一種。
      ko: |-
        갸라도스에게 지니게 하면
        배틀할 때 메가진화할 수 있는
        신비한 메가스톤의 일종.
      en: |-
        One variety of the mysterious Mega Stones.
        Have Gyarados hold it, and this stone will
        enable it to Mega Evolve during battle.
      fr: |-
        Une variété de Méga-Gemme.
        Tenue par un Léviator, elle lui permet de
        méga-évoluer durant un combat.
      de: |-
        Einer der mysteriösen Mega-Steine. Wird er von
        einem Garados getragen, kann es im Kampf eine
        Mega-Entwicklung durchführen.
      es: |-
        Documento de identificación necesario para
        acceder a la central eléctrica de la Ruta 13.
      it: |-
        Un esemplare delle misteriose Megapietre.
        Data a Gyarados, gli permette di megaevolversi
        durante la lotta.
