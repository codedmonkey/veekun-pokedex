pixie-plate:
  category: plates
  cost: 1000
  effect:
    en: "Held: Fairy-Type moves from holder do 20% more damage. Changes Arceus's and Judgment's type to Fairy."
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        フェアリーの　タイプの　せきばん。
        もたせると　フェアリータイプの
        わざの　いりょくが　つよまる。
      ja: |-
        フェアリーの　タイプの　石盤。
        持たせると　フェアリータイプの
        技の　威力が　強まる。
      ko: |-
        페어리타입의 석판.
        지니게 하면 페어리타입
        기술의 위력이 강해진다.
      en: |-
        An item to be held by a Pokémon.
        It is a stone tablet that boosts the
        power of Fairy-type moves.
      fr: |-
        Objet à tenir. Une tablette en pierre augmentant
        la puissance des capacités de type Fée.
      de: |-
        Ein Item zum Tragen. Diese Steintafel verstärkt
        Attacken vom Typ Fee.
      es: |-
        Una de las misteriosas Megapiedras. Permite
        megaevolucionar a Mewtwo en combate.
      it: |-
        Strumento da dare a un Pokémon.
        Lastra di pietra che potenzia le mosse
        di tipo Folletto.
