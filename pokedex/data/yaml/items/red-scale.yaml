  effect:
    en: 'May be traded to Mr. Pokémon for an []{item:exp-share}.'
  flags: {  }
  flavor_text:
    heartgold-soulsilver:
      en: |-
        A scale from the red GYARADOS. It glows
        red like a flame.
    black-white:
      en: |-
        A scale from the red Gyarados. It glows
        red like a flame.
      fr: |-
        Une écaille du Léviator apparu au Lac
        Colère. Elle rougeoie comme une flamme.
    black-2-white-2:
      en: |-
        A scale from the red Gyarados. It glows
        red like a flame.
    x-y:
      ja-Hrkt: |-
        いかりのみずうみに　あらわれた
        あかい　ギャラドスの　ウロコ。
        ほのおのように　あかく　かがやく。
      ja: |-
        怒りの湖に　あらわれた
        あかい　ギャラドスの　ウロコ。
        ほのおのように　あかく　かがやく。
      ko: |-
        분노의 호수에 나타난
        빨간 갸라도스의 비늘.
        불꽃처럼 빨갛게 빛난다.
      en: |-
        A scale from a red Gyarados.
        It glows red like a flame.
      fr: |-
        Une écaille du Léviator apparu au Lac Colère.
        Elle rougeoie comme une flamme.
      de: |-
        Eine Schuppe des roten Garados, das im See des
        Zorns erschienen ist. Sie glänzt rot wie Feuer.
      es: |-
        Poké Ball algo distinta que hace más amistosos a
        los Pokémon salvajes que se capturan con ella.
      it: |-
        Una squama del Gyarados rosso apparso
        al Lago d’Ira. È rossa come il fuoco.
