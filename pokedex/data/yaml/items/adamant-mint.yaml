  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        ポケモンに　かおりを　かがせると
        こうげきが　あがりやすく　なるが
        とくこうは　あがりにくくなる　ミント。
      ja: |-
        ポケモンに　香りを　かがせると
        攻撃が　上がりやすく　なるが
        特攻は　上がりにくくなる　ミント。
      ko: |-
        포켓몬에게 향기를 맡게 하면
        공격이 오르기 쉬워지지만
        특수공격이 오르기 어려워지는 민트.
      zh-Hant: |-
        讓寶可夢聞這種薄荷的氣味，
        會令攻擊變得容易提高，
        但特攻則難以提高。
      zh-Hans: |-
        宝可梦闻了这种薄荷之后，
        攻击会易于提高，
        而特攻则难以提高。
      en: |-
        When a Pokémon smells this mint, its Attack will grow
        more easily, but its Sp. Atk will grow more slowly.
      fr: |-
        Si un Pokémon hume cet aromate, son Attaque
        montera plus facilement, mais son Attaque Spéciale
        se développera plus lentement.
      de: |-
        Lässt man ein Pokémon an dieser Minze schnuppern,
        steigt sein Angriff schneller, aber sein Spezial-Angriff
        umso langsamer.
      es: |-
        Cuando un Pokémon percibe su aroma, aumenta con
        más facilidad su Ataque, en detrimento de su Ataque
        Especial.
      it: |-
        Quando un Pokémon ne sente il profumo, il suo Attacco
        aumenta più facilmente a scapito dell’Attacco Speciale.
