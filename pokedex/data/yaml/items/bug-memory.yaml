bug-memory:
  category: memories
  cost: 1000
  effect:
    en: "Held: Changes Silvally to its Bug form.  Changes Multi-Attack's type to Bug."
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        むしタイプの　データが　はいった
        メモリ。　とくていの　ポケモンが
        もつと　タイプが　かわる。
      ja: |-
        むしタイプの　データが　入った
        メモリ。　特定の　ポケモンが　持つと
        タイプが　変わる。
      ko: |-
        벌레타입의 데이터가 들어 있는
        메모리. 특정 포켓몬이
        지니면 타입이 바뀐다.
      zh-Hant: |-
        裝有蟲屬性資料的記憶碟。
        特定寶可夢攜帶後，
        就會產生屬性的變化。
      zh-Hans: |-
        装有虫属性数据的存储碟。
        特定宝可梦携带后，
        属性就会发生变化。
      en: |-
        A memory disc that contains Bug-type data.
        It changes the type of the holder if held by
        a certain species of Pokémon.
      fr: |-
        Une carte mémoire contenant des données sur
        le type Insecte. Un certain Pokémon peut changer
        de type en l’équipant.
      de: |-
        Eine Disc mit Daten zum Typ Käfer.
        Sie löst bei einem bestimmten Pokémon
        einen Typenwechsel aus.
      es: |-
        Disco de datos que contiene información relativa
        al tipo Bicho. Permite cambiar de tipo a cierto
        Pokémon.
      it: |-
        ROM contenente dati sul tipo Coleottero in formato
        digitale. Permette a un certo Pokémon di cambiare
        tipo.
