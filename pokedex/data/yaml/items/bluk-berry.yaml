bluk-berry:
  category: baking-only
  cost: 20
  effect:
    en: 'No effect; only useful for planting and cooking.'
  flags: {  }
  flavor_text:
    ruby-sapphire:
      en: |-
        POKéBLOCK ingredient.
        Plant in loamy soil
        to grow BLUK.
    emerald:
      en: |-
        POKéBLOCK ingredient.
        Plant in loamy soil
        to grow BLUK.
    firered-leafgreen:
      en: |-
        Can be ground up into a powder as
        an ingredient for medicine.
    diamond-pearl:
      en: |-
        A Poffin ingredient.
        Bury it in soft soil to grow a
        Bluk Plant.
    platinum:
      en: |-
        A Poffin ingredient.
        Bury it in soft soil to grow a
        Bluk Plant.
    heartgold-soulsilver:
      en: |-
        In the Sinnoh region, they like to make
        sweets known as Poffins with this Berry
        and feed them to their Pokémon.
    black-white:
      en: |-
        A Berry which is very rare in the
        Unova region.
        A maniac will buy it for a high price.
      fr: |-
        Baie très rare à Unys.
        Les amateurs en donnent un bon prix.
    black-2-white-2:
      en: |-
        A Berry which is very rare in the
        Unova region.
        A maniac will buy it for a high price.
    x-y:
      ja-Hrkt: |-
        イッシュちほうでは　とても
        めずらしい　きのみ。
      ja: |-
        イッシュ地方では　とても
        珍しい　きのみ。
      ko: |-
        하나지방에서는 매우
        희귀한 나무열매.
      en: |-
        A Berry to be used in cooking.
        This Berry is very rare and hard
        to obtain in the Unova region.
      fr: 'Une Baie très rare à Unys.'
      de: |-
        Eine Beerensorte, die in der Einall-Region
        ganz besonders selten ist.
      es: 'Una baya muy rara en la región de Teselia.'
      it: 'Bacca molto rara a Unima.'
    sun-moon:
      ja-Hrkt: |-
        うつくしさに　みがきを　かける　ための
        ポロックを　つくるとき　つかわれる。
        あおいろの　みは　たべると　しぶい。
      ja: |-
        うつくしさに　磨きを　かける　ための
        ポロックを　つくるとき　使われる。
        青色の実は　食べると　渋い。
      ko: |-
        아름다움을 연마하기 위한
        포켓몬스넥을 만들 때 사용된다.
        파란색 열매는 먹으면 떫다.
      zh-Hant: |-
        製作用於增進美麗的
        寶可方塊時使用。
        藍色的果實嘗起來是澀的。
      zh-Hans: |-
        用于制作宝可方块，
        制作出来的宝可方块可用来打磨美丽。
        蓝色的果实尝起来是涩的。
      en: |-
        Used to make Pokéblocks that will enhance your
        Beauty. Its blue flesh is sour when eaten.
      fr: |-
        Une Baie violette et sèche, utilisée pour préparer
        des Pokéblocs permettant d’augmenter la Beauté
        d’un Pokémon.
      de: |-
        Eine Beerensorte, die als Zutat für Pokériegel
        verwendet wird, welche die Schönheit erhöhen.
        Ihr bläuliches Fruchtfleisch schmeckt herb.
      es: |-
        Se utiliza en la producción de Pokécubos que
        potencian la belleza. Es de color azulado y sabor
        seco.
      it: |-
        Bacca viola dal sapore aspro usata per creare
        Pokémelle che aumentano la Bellezza del Pokémon.
