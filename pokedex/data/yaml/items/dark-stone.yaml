dark-stone:
  category: plot-advancement
  cost: 0
  effect:
    en: 'Summons []{pokemon:zekrom} for the final battle against N.'
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        Zekrom’s body was destroyed and
        changed into this stone. It is said to
        be waiting for the emergence of a hero.
      fr: |-
        Ce sont les derniers restes du corps
        de Zekrom. On dit qu’ils attendent
        l’apparition d’un héros.
    black-2-white-2:
      en: |-
        Zekrom’s body was destroyed and
        changed into this stone. It is said to
        be waiting for the emergence of a hero.
    x-y:
      ja-Hrkt: |-
        ゼクロムの　にくたいが　ほろび
        へんかした　すがた。えいゆうの
        とうじょうを　まっていると　される。
      ja: |-
        ゼクロムの　肉体が　滅び
        変化した　姿。　英雄の
        登場を　待っていると　される。
      ko: |-
        제크로무의 육체가 허물어져
        변화한 모습. 영웅의
        등장을 기다린다고 여겨진다.
      en: |-
        Zekrom’s body was destroyed and
        changed into this stone. It is said to
        be waiting for the emergence of a hero.
      fr: |-
        Ce sont les derniers restes du corps de Zekrom.
        On dit qu’ils attendent l’apparition d’un héros.
      de: |-
        Nach dem Zerfall seines Körpers nahm Zekrom
        diese Gestalt an. Man sagt, es warte auf die
        Ankunft eines Helden.
      es: |-
        Videomisor encontrado en el parque de
        atracciones de Ciudad Mayólica.
        Parece que pertenece a un chico.
      it: |-
        Pietra in cui si è tramutato Zekrom quando
        ha perso la sua forma corporea.
        Attende la venuta di un eroe.
