    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        じしんの　しょうげきで　じぶんの
        まわりに　いるものを　こうげきする。
      ja: |-
        地震の　衝撃で　自分の
        周りに　いるものを　攻撃する。
      ko: |-
        지진의 충격으로 자신의
        주위에 있는 포켓몬을 공격한다.
      zh-Hant: |-
        用地震的衝擊，
        攻擊自己周圍所有的寶可夢。
      zh-Hans: |-
        利用地震的冲击，
        攻击自己周围所有的宝可梦。
      en: |-
        The user sets off an earthquake that strikes every
        Pokémon around it.
      fr: |-
        Le lanceur provoque un tremblement de terre touchant
        tous les Pokémon autour de lui.
      de: |-
        Ein mächtiges Beben, das die anderen Pokémon in
        der Nähe des Anwenders trifft.
      es: |-
        Un terremoto que afecta a los Pokémon de alrededor 
        en combate.
      it: |-
        Chi la usa provoca un potente sisma che colpisce
        i Pokémon che ha intorno.
    sword-shield:
      ja-Hrkt: |-
        なかまを　たすける。
        てだすけ　された　ポケモンの　わざの
        いりょくは　いつもより　おおきく　なる。
      ja: |-
        仲間を　助ける。
        てだすけ　された　ポケモンの　技の
        威力は　いつもより　大きくなる。
      ko: |-
        동료를 돕는다.
        도움받은 포켓몬이 쓰는 기술의
        위력은 여느 때보다 커진다.
      zh-Hant: |-
        幫助夥伴。
        被幫助的寶可夢，
        招式的威力會比原來更大。
      zh-Hans: |-
        帮助伙伴。
        被帮助的宝可梦，
        其招式威力变得比平时大。
      en: |-
        The user assists an ally by boosting the power of
        that ally’s attack.
      fr: |-
        Une capacité qui augmente la puissance d’attaque
        d’un allié.
      de: |-
        Anwender steigert die Stärke der Attacke eines
        Mitstreiters.
      es: |-
        El usuario ayuda a un aliado reforzando la potencia de
        su ataque.
      it: |-
        Mossa che aumenta la potenza dell’attacco
        di un alleato.
