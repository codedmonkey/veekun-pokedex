  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        ジムオブカントーで　もらえる
        ノベルティの　バッジ。　どこかの
        ジムバッジを　まねているらしい。
      ja: |-
        ジムオブカントーで　もらえる
        ノベルティの　バッジ。　どこかの
        ジムバッジを　まねているらしい。
      ko: |-
        체육관오브관동에서 받을 수 있는
        노벨티 배지. 어딘가의
        체육관 배지를 흉내 낸듯하다.
      zh-Hant: |-
        可在關都之道館獲得的徽章贈品。
        聽說這好像是在模仿
        某個地方的道館徽章。
      zh-Hans: |-
        能从关都之道馆那里得到的徽章赠品。
        好像仿照了某个地区的道馆徽章。
      en: |-
        A novelty badge that you can receive at the
        Kantonian Gym. Rumor has it that it imitates
        the Badge of a Gym somewhere.
      fr: |-
        Un badge promotionnel que vous avez obtenu
        à l’Arène de Kanto. Il paraît que c’est une imitation
        du Badge d’une certaine Arène.
      de: |-
        Ein Werbegeschenk, das man in der Kanto-Arena
        erhält. Es scheint sich dabei um die Nachbildung
        eines Ordens einer bestimmten Arena zu handeln.
      es: |-
        Medalla conseguida en el Gimnasio de Kanto. Su
        aspecto guarda un sospechoso parecido con la
        medalla de otro Gimnasio.
      it: |-
        Medaglia souvenir ottenuta alla Palestra di Kanto.
        Sembra ispirata alla Medaglia di un’altra Palestra.
