      fr: |-
        Attaque l’ennemi avec la voix. Cette
        attaque devient plus efficace si à
        chaque tour quelqu’un l’utilise.
    black-2-white-2:
      en: |-
        The user attacks the target with an
        echoing voice. If this move is used
        every turn, it does greater damage.
    x-y:
      ja-Hrkt: |-
        こえで　あいてを　こうげきする。
        まいターン　だれかが　つかうと
        いりょくが　あがる。
      ja: |-
        響く　声で　相手を　攻撃する。
        毎ターン　だれかが　使い続けると
        威力が　あがる。
      ko: |-
        목소리로 상대를 공격한다.
        매 턴 누군가 기술을
        계속해서 쓰면 위력이 올라간다.
      en: |-
        The user attacks the target with an
        echoing voice. If this move is used
        every turn, it does greater damage.
      fr: |-
        Un cri retentissant blesse l’ennemi.
        Si le lanceur ou d’autres Pokémon l’utilisent
        à chaque tour, l’effet augmente.
      de: |-
        Angriff mit widerhallender Stimme. Wird dieser
        in jeder Runde von jemandem wiederholt, steigt
        die Stärke.
      es: |-
        Quien lo usa se carga de energía y luego ataca.
        Y, si ataca después del objetivo, dobla la
        potencia del ataque.
      it: |-
        Attacca il bersaglio con la propria voce
        echeggiante. Se usata a ripetizione da uno
        o più Pokémon il danno aumenta.
    sun-moon:
      ja-Hrkt: |-
        ひびく　こえで　あいてを　こうげきする。
        まいターン　だれかが　わざを
        つかい　つづけると　いりょくが　あがる。
      ja: |-
        響く　声で　相手を　攻撃する。
        毎ターン　だれかが　使い続けると
        威力が　あがる。
      ko: |-
        울리는 목소리로 상대를 공격한다.
        매 턴 누군가 이 기술을
        계속해서 쓰면 위력이 올라간다.
      zh-Hant: |-
        用回聲攻擊對手。
        每回合有寶可夢持續使用回聲時，
        招式的威力會提高。
      zh-Hans: |-
        用回声攻击对手。
        如果每回合都有宝可梦接着
        使用该招式，威力就会提高。
      en: |-
        The user attacks the target with an echoing voice.
        If this move is used every turn, its power
        is increased.
      fr: |-
        Un cri retentissant blesse l’ennemi.
        Si le lanceur ou d’autres Pokémon l’utilisent
        à chaque tour, l’effet augmente.
      de: |-
        Angriff mit widerhallender Stimme. Wird dieser in
        jeder Runde von jemandem wiederholt, steigt die
        Stärke.
      es: |-
        Ataca al objetivo con un susurro. Su fuerza
        aumenta si cualquiera de los Pokémon lo usa
        en cada turno.
      it: |-
        Attacca il bersaglio con la propria voce
        echeggiante. Se usata a ripetizione da uno
        o più Pokémon il danno aumenta.
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        ひびく　こえで　あいてを　こうげきする。
        まいターン　だれかが　わざを
        つかい　つづけると　いりょくが　あがる。
      ja: |-
        響く　声で　相手を　攻撃する。
        毎ターン　だれかが　使い続けると
        威力が　あがる。
      ko: |-
        울리는 목소리로 상대를 공격한다.
        매 턴 누군가 이 기술을
        계속해서 쓰면 위력이 올라간다.
      zh-Hant: |-
        用回聲攻擊對手。
        每回合有寶可夢持續使用回聲時，
        招式的威力會提高。
      zh-Hans: |-
        用回声攻击对手。
        如果每回合都有宝可梦接着
        使用该招式，威力就会提高。
      en: |-
        The user attacks the target with an echoing voice.
        If this move is used every turn, its power
        is increased.
      fr: |-
        Un cri retentissant blesse l’ennemi.
        Si le lanceur ou d’autres Pokémon l’utilisent
        à chaque tour, l’effet augmente.
      de: |-
        Angriff mit widerhallender Stimme. Wird dieser in
        jeder Runde von jemandem wiederholt, steigt die
        Stärke.
      es: |-
        Ataca al objetivo con un susurro. Su fuerza
        aumenta si cualquiera de los Pokémon lo usa
        en cada turno.
      it: |-
        Attacca il bersaglio con la propria voce
        echeggiante. Se usata a ripetizione da uno
        o più Pokémon il danno aumenta.
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        すごい　ちからを　はっきして
        あいてを　こうげきする。じぶんの
        こうげきと　ぼうぎょが　さがる。
      ja: |-
        すごい　力を　発揮して
        相手を　攻撃する。自分の
        攻撃と　防御が　さがる。
      ko: |-
        엄청난 힘을 발휘하여
        상대를 공격한다. 자신의
        공격과 방어가 떨어진다.
      zh-Hant: |-
        發揮驚人的力量攻擊對手。
        自己的攻擊和防禦會降低。
      zh-Hans: |-
        发挥惊人的力量攻击对手。
        自己的攻击和防御会降低。
      en: |-
        The user attacks the target with great power.
        However, this also lowers the user’s Attack and
        Defense stats.
      fr: |-
        Une attaque puissante, mais qui baisse l’Attaque
        et la Défense du lanceur.
      de: |-
        Starke Attacke, die jedoch auch den Angriff und die
        Verteidigung des Anwenders senkt.
      es: |-
        Ataque de gran potencia, pero que reduce el Ataque
        y la Defensa del agresor.
      it: |-
        Chi la usa attacca il bersaglio con grande forza,
        ma il suo Attacco e la sua Difesa diminuiscono.
    sword-shield:
      ja-Hrkt: |-
        はげしく　ふきあれる　すなあらしの
        なかに　４ー５ターンの　あいだ
        あいてを　とじこめて　こうげきする。
      ja: |-
        激しく　吹きあれる　砂あらしの
        中に　４ー５ターンの　間
        相手を　閉じこめて　攻撃する。
      ko: |-
        세차게 불어대는
        모래바람 속에 4-5턴 동안
        상대를 가두어 공격한다.
      zh-Hant: |-
        將對手困在
        鋪天蓋地的沙暴中，
        在４～５回合內進行攻擊。
      zh-Hans: |-
        将对手困在
        铺天盖地的沙暴中，
        在４～５回合内进行攻击。
      en: |-
        The user traps the target inside a harshly raging
        sandstorm for four to five turns.
      fr: |-
        Le lanceur emprisonne l’ennemi dans une tempête
        de sable terrifiante qui dure de quatre à cinq tours.
      de: |-
        Das Ziel leidet für vier bis fünf Runden in einer
        Sandhose.
      es: |-
        Enreda al objetivo en un remolino de arena de cuatro a
        cinco turnos.
      it: |-
        Chi la usa intrappola il bersaglio in una tempesta
        di sabbia per quattro o cinque turni.
