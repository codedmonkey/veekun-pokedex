tm59:
  category: all-machines
  cost: 100000
  effect:
    en: 'Teaches Dragon Pulse to a compatible Pokémon.'
  flags: {  }
  flavor_text:
    diamond-pearl:
      en: |-
        The foe is attacked with a shock
        wave generated by the user’s gaping
        mouth.
    platinum:
      en: |-
        The foe is attacked with a shock
        wave generated by the user’s gaping
        mouth.
    heartgold-soulsilver:
      en: |-
        The foe is attacked with a shock
        wave generated by the user’s gaping
        mouth.
    black-white:
      en: |-
        The user attacks the target with fire.
        If the target is holding a Berry, the
        Berry becomes burnt up and unusable.
      fr: |-
        Des flammes calcinent l’ennemi.
        S’il tient une Baie, elle est brûlée
        et devient inutilisable.
    black-2-white-2:
      en: |-
        The user attacks the target with fire.
        If the target is holding a Berry, the
        Berry becomes burnt up and unusable.
    x-y:
      ja-Hrkt: |-
        ほのおで　あいてを　こうげきする。
        あいてが　きのみを　もっている　とき
        もやして　つかえなく　する。
      ja: |-
        炎で　相手を　攻撃する。
        相手が　きのみを　持っているとき
        燃やして　使えなくする。
      ko: |-
        불꽃으로 상대를 공격한다.
        상대가 나무열매를 지니고 있을 때
        불태워서 쓸 수 없게 만든다.
      en: |-
        The user attacks opposing Pokémon with fire.
        If a Pokémon is holding a certain item, such as a
        Berry, the item becomes burned up and unusable.
      fr: |-
        Des flammes calcinent l’ennemi.
        S’il tient un objet, une Baie par exemple, celui-ci
        est brûlé et devient inutilisable.
      de: |-
        Eine Feuer-Attacke. Trägt das Ziel eine Beere
        oder ein ähnliches Item bei sich, wird dieses
        von den Flammen verzehrt und geht verloren.
      es: |
        El usuario opone resistencia y ataca a los
        oponentes. También reduce su Ataque Especial.
      it: |-
        Attacca il nemico con una fiammata. Il fuoco
        distruggerà le bacche o alcuni tipi di strumenti
        che il Pokémon ha con sé.
    sun-moon:
      ja-Hrkt: |-
        じぶんの　からだを
        ぶんまわして　あいてに
        ダメージを　あたえる。
      ja: |-
        自分の　体を
        ぶんまわして　相手に
        ダメージを　与える。
      ko: |-
        자신의 몸을
        세차게 휘둘러서
        상대에게 데미지를 준다.
      zh-Hant: |-
        用自己的身體狂舞揮打，
        給予對手傷害。
      zh-Hans: |-
        用自己的身体狂舞挥打，
        给予对手伤害。
      en: |-
        The user swings its body around violently to inflict
        damage on everything in its vicinity.
      fr: |-
        Le lanceur pivote pour prendre de l’élan
        et infliger des dégâts.
      de: |-
        Der Anwender dreht seinen Körper und fügt dem
        Ziel Schaden zu.
      es: 'Hace pivotar su cuerpo para infligir daño al rival.'
      it: |-
        Chi la usa infligge danni intorno a sé facendo
        ruotare una parte del suo corpo.
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        じぶんの　からだを
        ぶんまわして　あいてに
        ダメージを　あたえる。
      ja: |-
        自分の　体を
        ぶんまわして　相手に
        ダメージを　与える。
      ko: |-
        자신의 몸을
        세차게 휘둘러서
        상대에게 데미지를 준다.
      zh-Hant: |-
        用自己的身體狂舞揮打，
        給予對手傷害。
      zh-Hans: |-
        用自己的身体狂舞挥打，
        给予对手伤害。
      en: |-
        The user swings its body around violently to inflict
        damage on everything in its vicinity.
      fr: |-
        Le lanceur pivote pour prendre de l’élan
        et infliger des dégâts.
      de: |-
        Der Anwender dreht seinen Körper und fügt dem
        Ziel Schaden zu.
      es: 'Hace pivotar su cuerpo para infligir daño al rival.'
      it: |-
        Chi la usa infligge danni intorno a sé facendo
        ruotare una parte del suo corpo.
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        ねている　あいての　ゆめを　たべて
        こうげきする。　ダメージの　はんぶんの
        ＨＰを　かいふく　する。
      ja: |-
        寝ている　相手の　夢を　食べて
        攻撃する。　ダメージの　半分の
        ＨＰを　回復する。
      ko: |-
        잠자고 있는 상대의 꿈을 먹어
        공격한다. 데미지의 절반을
        HP로 회복한다.
      zh-Hant: |-
        吃掉熟睡中對手的夢
        進行攻擊。可以回復給予對手
        傷害的一半HP。
      zh-Hans: |-
        吃掉正在睡觉的对手的梦
        进行攻击。回复对手
        所受到伤害的一半HP。
      en: |-
        The user eats the dreams of a sleeping target. It
        absorbs half the damage caused to heal its own HP.
      fr: |-
        Le lanceur mange le rêve de l’ennemi endormi
        et récupère en PV la moitié des dégâts infligés.
      de: |-
        Frisst die Träume eines schlafenden Ziels. Anwender
        wird um die Hälfte des zugefügten Schadens geheilt.
      es: |-
        Restaura al usuario la mitad del daño causado a un 
        objetivo dormido.
      it: |-
        Attacco che funziona solo su un bersaglio
        che dorme. Chi lo usa riceve metà dei PS
        persi dal Pokémon colpito.
    sword-shield:
      ja-Hrkt: |-
        もたせた　どうぐを
        すばやく　なげつけて　こうげきする。
        どうぐで　いりょくと　こうかが　かわる。
      ja: |-
        持たせた　道具を
        素早く　投げつけて　攻撃する。
        道具で　威力と　効果が　変わる。
      ko: |-
        지니게 한 도구를
        재빠르게 내던져서 공격한다.
        도구에 따라 위력과 효과가 바뀐다.
      zh-Hant: |-
        快速投擲攜帶的道具進行攻擊。
        招式威力和效果會隨著
        道具不同而改變。
      zh-Hans: |-
        快速投掷携带的道具进行攻击。
        根据道具不同，
        威力和效果会改变。
      en: |-
        The user flings its held item at the target to attack.
        This move’s power and effects depend on the item.
      fr: |-
        Le lanceur envoie l’objet qu’il tient sur l’ennemi.
        La puissance et les effets dépendent de l’objet.
      de: |-
        Anwender schleudert sein Item auf das Ziel. Stärke und
        Effekt der Attacke hängen vom Item ab.
      es: |-
        El usuario lanza contra el objetivo el objeto que lleva.
        La fuerza del ataque y su efecto varían según el objeto.
      it: |-
        Chi la usa lancia il suo strumento addosso al bersaglio.
        La forza e l’effetto dipendono dallo strumento.
