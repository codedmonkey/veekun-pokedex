        ある　とくていの　ポケモンを
        しんかさせる　ふしぎな　いし。
        はっぱの　もようが　ある。
      ja: |-
        ある　特定の　ポケモンを
        進化させる　不思議な　石。
        はっぱの　模様が　ある。
      ko: |-
        어느 특정 포켓몬을
        진화시키는 이상한 돌.
        잎사귀 무늬가 있다.
      en: |-
