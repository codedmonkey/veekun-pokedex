  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        ロトムパワーの　ひとつ。
        たたかっている　じぶんの　ポケモンの
        のうりょくが　すべて　あがる。
      ja: |-
        ロトムパワーの　ひとつ。
        戦っている　自分の　ポケモンの
        能力が　すべて　あがる。
      ko: |-
        로토무파워 중 하나.
        싸우고 있는 자신의 포켓몬의
        능력이 모두 올라간다.
      zh-Hant: |-
        洛托姆之力的一種。
        可以提升戰鬥中的
        我方寶可夢的所有能力。
      zh-Hans: |-
        洛托姆之力的一种。
        正在战斗的我方宝可梦的
        所有能力都会提高。
      en: |-
        One of the Rotom Powers.
        It raises all stats of your battling Pokémon.
      fr: |-
        Une des Motism’Auras. Elle permet d’augmenter
        toutes les stats de vos Pokémon en combat.
      de: |-
        Diese Rotom-Kraft bewirkt, dass im Kampf die
        Statuswerte der eigenen Pokémon auf der
        Mitstreiterseite erhöht werden.
      es: |-
        Poder Rotom que hace aumentar las características
        de los Pokémon de tu equipo que estén
        combatiendo.
      it: |-
        Potere Rotom che fa aumentare tutte le statistiche
        dei propri Pokémon impegnati in una lotta.
