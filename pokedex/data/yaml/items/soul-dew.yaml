soul-dew:
  category: species-specific
  cost: 0
  effect:
    en: "Held by Latias or Latios: Increases the holder's Special Attack and Special Defense by 50%."
  flags:
    - holdable
  flavor_text:
    ruby-sapphire:
      en: |-
        Hold item: Raises
        SP. ATK & SP. DEF
        of LATIOS & LATIAS.
    emerald:
      en: |-
        Hold item: raises
        SP. ATK & SP. DEF of
        LATIOS & LATIAS.
    firered-leafgreen:
      en: |-
        An orb to be held by a LATIOS or
        LATIAS. It raises the SP. ATK
        and SP. DEF stats.
    diamond-pearl:
      en: |-
        A wondrous orb to be held by LATIOS or
        LATIAS. It raises both the Sp. Atk and
        Sp. Def stats.
    platinum:
      en: |-
        A wondrous orb to be held by LATIOS or
        LATIAS. It raises both the Sp. Atk and
        Sp. Def stats.
    heartgold-soulsilver:
      en: |-
        A wondrous orb to be held by LATIOS
        or LATIAS. It raises both the
        Sp. Atk and Sp. Def stats.
    black-white:
      en: |-
        A wondrous orb to be held by Latios
        or Latias. It raises both the
        Sp. Atk and Sp. Def stats.
      fr: |-
        Orbe prodigieux à faire tenir à Latios
        ou Latias qui monte leur Attaque
        Spéciale et leur Défense Spéciale.
    black-2-white-2:
      en: |-
        A wondrous orb to be held by Latios
        or Latias. It raises both the
        Sp. Atk and Sp. Def stats.
    x-y:
      ja-Hrkt: |-
        ラティオス　または　ラティアスに
        もたせると　とくこうと　とくぼうが
        あがる　ふしぎな　たま。
      ja: |-
        ラティオス　または　ラティアスに
        持たせると　特攻と　特防が
        あがる　不思議な　珠。
      ko: |-
        라티오스 혹은 라티아스에게
        지니게 하면 특수공격과 특수방어가
        올라가는 이상한 구슬.
      en: |-
        A wondrous orb to be held by either
        Latios or Latias. It raises both the
        Sp. Atk and Sp. Def stats.
      fr: |-
        Objet à faire tenir à Latios ou Latias.
        Un orbe prodigieux qui augmente leur Attaque
        Spéciale et leur Défense Spéciale.
      de: |-
        Ein Item, das von Latios oder Latias getragen
        werden kann. Es hebt Spezial-Angriff und
        Spezial-Verteidigung.
      es: |-
        Debe llevarlo un Pokémon. Su potente
        magnetismo fortalece los movimientos de tipo
        Eléctrico.
      it: |-
        Sfera miracolosa da dare a Latios o Latias.
        Aumenta l’Attacco Speciale e la Difesa Speciale.
    sun-moon:
      ja-Hrkt: |-
        ラティオスや　ラティアスに　もたせると
        エスパーと　ドラゴンタイプの　わざの
        いりょくが　あがる　ふしぎな　たま。
      ja: |-
        ラティオスや　ラティアスに　持たせると
        エスパーと　ドラゴンタイプの　技の
        威力が　あがる　不思議な　珠。
      ko: |-
        라티오스나 라티아스에게 지니게 하면
        에스퍼와 드래곤타입 기술의 위력이
        올라가는 이상한 구슬.
      zh-Hant: |-
        讓拉帝歐斯或拉帝亞斯攜帶後，
        超能力和龍屬性的招式威力
        就會提高的神奇珠子。
      zh-Hans: |-
        让拉帝欧斯或拉帝亚斯携带后，
        超能力和龙属性的招式威力
        就会提高的神奇珠子。
      en: |-
        A wondrous orb to be held by either Latios or
        Latias. It raises the power of Psychic- and
        Dragon-type moves.
      fr: |-
        Objet à faire tenir à Latios ou Latias.
        Un orbe prodigieux qui augmente la puissance
        de leurs capacités de type Psy ou Dragon.
      de: |-
        Ein Item, das von Latios oder Latias getragen
        werden kann. Es erhöht die Stärke von
        Psycho- und Drachen-Attacken.
      es: |-
        Un orbe fantástico que debe llevar Latios o Latias.
        Potencia los movimientos de tipo Psíquico y Dragón.
      it: |-
        Sfera miracolosa da dare a Latios o Latias.
        Aumenta la potenza delle mosse di tipo Psico
        e Drago.
