ganlon-berry:
  category: in-a-pinch
  cost: 80
  effect:
    en: |-
      Held in battle
      :   When the holder has 1/4 its max [HP]{mechanic:hp} remaining or less, it consumes this item to [raise]{mechanic:raise} its [Defense]{mechanic:defense} by one stage.
  flags:
    - holdable-active
  flavor_text:
    ruby-sapphire:
      en: |-
        A hold item that
        raises DEFENSE in
        a pinch.
    emerald:
      en: |-
        A hold item that
        raises DEFENSE in
        a pinch.
    firered-leafgreen:
      en: |-
        When held by a POKéMON, it raises
        the DEFENSE stat in a pinch.
    diamond-pearl:
      en: |-
        A Poffin ingredient.
        If held by a Pokémon, it raises its
        Defense stat in a pinch.
    platinum:
      en: |-
        A Poffin ingredient.
        If held by a Pokémon, it raises its
        Defense stat in a pinch.
    heartgold-soulsilver:
      en: |-
        If held by a Pokémon, it raises its
        Defense stat in a pinch.
    black-white:
      en: |-
        If held by a Pokémon, it raises its
        Defense stat in a pinch.
      fr: |-
        Tenue, cette Baie monte la Défense
        en cas de besoin.
    black-2-white-2:
      en: |-
        If held by a Pokémon, it raises its
        Defense stat in a pinch.
    x-y:
      ja-Hrkt: |-
        ポケモンに　もたせると
        ピンチのとき　じぶんの
        ぼうぎょが　あがる。
      ja: |-
        ポケモンに　持たせると
        ピンチのとき　自分の
        防御が　あがる。
      ko: |-
        포켓몬에게 지니게 하면
        위급할 때 자신의
        방어가 올라간다.
      en: |-
        A Berry to be consumed by Pokémon.
        If a Pokémon holds one, its Defense
        stat will increase when it’s in a pinch.
      fr: |-
        Tenue, cette Baie augmente la Défense en cas
        de besoin.
      de: |-
        Als getragenes Item erhöht diese Beere den
        Verteidigungs-Wert eines Pokémon, sobald es in
        einer Notlage steckt.
      es: |-
        El Pokémon que la lleva se libera del
        enamoramiento. Solo puede usarse una vez.
      it: |-
        Se il Pokémon che ha questa bacca si trova
        in difficoltà, la sua Difesa aumenta.
