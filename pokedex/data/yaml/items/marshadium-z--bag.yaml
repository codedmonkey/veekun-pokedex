  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        マーシャドーの　シャドースチールを
        とくべつな　Ｚワザに　グレードアップする
        Ｚパワーの　けっしょうを　つくりだす。
      ja: |-
        マーシャドーの　シャドースチールを
        特別な　Ｚワザに　グレードアップする
        Ｚパワーの　結晶を　作りだす。
      ko: |-
        마샤도의 섀도스틸을
        특별한 Z기술로 업그레이드하는
        Z파워의 결정을 만들어 낸다.
      zh-Hant: |-
        會製造出把瑪夏多的暗影偷盜
        升級為特殊Ｚ招式的Ｚ力量結晶。
      zh-Hans: |-
        可用它来制造用于对战
        并能将玛夏多的暗影偷盗
        升级成特殊Ｚ招式的Ｚ力量结晶。
      en: |-
        It converts Z-Power into crystals that upgrade
        Marshadow’s Spectral Thief to an
        exclusive Z-Move.
      fr: |-
        Permet de concentrer la Force Z en un cristal,
        qui autorise le Marshadow qui le tient à transformer
        son Clepto-Mânes en capacité Z.
      de: |-
        Kristallisierte Z-Kraft, die Marshadows Attacke
        Diebesschatten zu einer Z-Attacke aufstuft.
        Wird bei Bedarf automatisch vervielfacht.
      es: |-
        Concentra el Poder Z en cristales que permiten a
        Marshadow convertir su Robasombra en un
        movimiento Z.
      it: |-
        Permette di creare cristalli carichi di Potere Z che
        consentono a Marshadow di trasformare la mossa
        Ombrafurto in una mossa Z.
