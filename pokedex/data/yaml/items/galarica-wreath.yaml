  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        ガラナツのえだを　あみこんだ　かんむり。
        ガラルちほうの　ヤドンに
        かぶせてあげると　よろこぶ。
      ja: |-
        ガラナツのえだを　編み込んだ　冠。
        ガラル地方の　ヤドンに
        かぶせてあげると　喜ぶ。
      ko: |-
        가라두구가지를 엮어서 만든 머리 장식.
        가라르지방의 야돈에게 씌워주면 기뻐한다.
      zh-Hant: |-
        用伽勒荳蔻枝編成的花冠。
        給伽勒爾地區的呆呆獸戴上它，
        呆呆獸就會很開心。
      zh-Hans: |-
        用伽勒豆蔻枝编织的花环头饰。
        给伽勒尔地区的呆呆兽戴上这种头饰，
        它就会很开心。
      en: |-
        A wreath made from woven-together Galarica Twigs.
        Placing it on the head of a Galarian Slowpoke makes
        the Pokémon very happy.
      fr: |-
        Une couronne confectionnée à partir de Branches
        Galanoa. Les Ramoloss de Galar adorent en porter.
      de: |-
        Ein Kranz, der aus Galarnuss-Zweigen gewoben wurde.
        Galar-Flegmon freuen sich, wenn sie diesen tragen
        dürfen.
      es: |-
        Una corona hecha de Ramas de Galanuez trenzadas.
        Los Slowpoke de Galar se ponen contentísimos cuando
        la llevan puesta.
      it: |-
        Una corona ottenuta intrecciando Rami Galarnoce.
        Gli Slowpoke di Galar amano indossarla.
