silph-scope:
  category: plot-advancement
  cost: 0
  effect:
    en: 'Identifies ghosts in []{location:pokemon-tower}.'
  flags: {  }
  flavor_text:
    emerald:
      en: |-
        SILPH CO’s scope
        makes unseeable
        POKéMON visible.
    firered-leafgreen:
      en: |-
        A scope that makes unseeable
        POKéMON visible.
        It is made by SILPH CO.
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        ひとの　めに　みえない　ものを
        みることが　できる　スコープ。
        シルフカンパニーせい。
      ja: |-
        人の　目に　見えない　ものを
        見ることが　できる　スコープ。
        シルフカンパニー製。
      ko: |-
        사람의 눈에 보이지 않는 것을
        볼 수 있게 해 주는 스코프.
        실프주식회사 제품.
      zh-Hant: |-
        西爾佛公司製造的檢視鏡。
        能看見人類肉眼
        看不到的東西。
      zh-Hans: |-
        西尔佛公司制造的透视镜。
        可以看见人眼无法看见的东西。
      en: |-
        A scope that lets you see what cannot usually be seen.
        It is made by Silph Co.
      fr: |-
        Un appareil permettant de voir les Pokémon invisibles.
        Il est fabriqué par la Sylphe SARL.
      de: |-
        Dieses Gerät macht Dinge sichtbar, die dem
        menschlichen Auge sonst verborgen bleiben.
        Es wurde von der Silph Company entwickelt.
      es: |-
        Dispositivo que permite ver cosas que, de otra forma,
        resultarían invisibles para el ojo humano. Fabricado por
        Silph S. A.
      it: |-
        Sonda che rivela i Pokémon invisibili, prodotta
        dalla Silph S.p.A.
