        ゲノセクトに　もたせると
        テクノバスターという　わざが
        みずタイプになる　カセット。
      ja: |-
        ゲノセクトに　持たせると
        テクノバスターという　技が
        みずタイプになる　カセット。
      ko: |-
        게노세크트에게 지니게 하면
        테크노버스터라는 기술이
        물타입으로 바뀌는 카세트.
      en: |-
        A cassette to be held by Genesect.
        It changes Genesect’s Techno Blast
        move so it becomes Water type.
      fr: |-
        Tenu par Genesect, ce module change la
