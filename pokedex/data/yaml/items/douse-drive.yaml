douse-drive:
  category: species-specific
  cost: 0
  effect:
    en: |-
      Held by []{pokemon:genesect}
      :   Holder's buster is blue, and its []{move:techno-blast} is []{type:water}-type.
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        A cassette to be held by Genesect.
        It changes Techno Blast to a
        Water-type move.
      fr: |-
        Tenu par Genesect, ce module
        change la capacité TechnoBuster
        en une capacité de type Eau.
    black-2-white-2:
      en: |-
        A cassette to be held by Genesect.
        It changes Techno Blast to a
        Water-type move.
    x-y:
