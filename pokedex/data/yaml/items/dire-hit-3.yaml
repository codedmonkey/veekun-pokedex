dire-hit-3:
  category: miracle-shooter
  cost: 0
  effect:
    en: |-
      Used on a party Pokémon in battle
      :   Raises the target's [critical hit]{mechanic:critical-hit} rate by three [stages]{mechanic:stage}.
      This item can only be obtained or used via the Wonder Launcher.
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        It can be used many times to greatly
        raise a Pokémon’s critical-hit ratio. It
        wears off if the Pokémon is withdrawn.
      fr: |-
        Monte fortement le taux de critiques.
        Plus efficace à chaque utilisation.
        Effet estompé si le Pokémon se retire.
    black-2-white-2:
      en: |-
        It can be used many times to greatly
        raise a Pokémon’s critical-hit ratio. It
        wears off if the Pokémon is withdrawn.
    x-y:
      ja-Hrkt: |-
        きゅうしょりつが　おおきく　あがる。
        つかうたびに　こうかが　アップする。
        ひっこめると　もとに　もどる。
      ja: |-
        急所率が　大きく　あがる。
        使うたびに　効果が　アップする。
        ひっこめると　元に　戻る。
      ko: |-
        급소 명중률이 크게 올라간다. 사용할
        때마다 효과가 올라간다. 포켓몬을
        볼에 넣어버리면 원래대로 되돌아간다.
      en: |-
        It can be used many times to greatly
        raise a Pokémon’s critical-hit ratio. It
        wears off if the Pokémon is withdrawn.
      fr: |-
        Monte fortement le taux de critiques.
        Plus efficace à chaque utilisation.
        L’effet s’estompe si le Pokémon se retire.
      de: |-
        Erhöht die Volltrefferquote stark. Bei mehrfachem
        Gebrauch effektiver. Wirkt, bis das Pokémon
        ausgewechselt wird.
      es: |-
        Pañuelo perdido por un cliente habitual del Café
        Alma en Ciudad Esmalte. Desprende el olor de
        un Pokémon.
      it: |-
        Aumenta moltissimo la probabilità di sferrare
        brutti colpi. L’effetto si può sommare, ma
        svanisce se il Pokémon è sostituito.
    sun-moon:
      ja-Hrkt: |-
        きゅうしょりつが　おおきく　あがる。
