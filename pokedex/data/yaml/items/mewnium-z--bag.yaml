  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        ミュウの　サイコキネシスを
        とくべつな　Ｚワザに　グレードアップする
        Ｚパワーの　けっしょうを　つくりだす。
      ja: |-
        ミュウの　サイコキネシスを
        特別な　Ｚワザに　グレードアップする
        Ｚパワーの　結晶を　作りだす。
      ko: |-
        뮤의 사이코키네시스를
        특별한 Z기술로 업그레이드하는
        Z파워의 결정을 만들어 낸다.
      zh-Hant: |-
        會製造出把夢幻的精神強念
        升級為特殊Ｚ招式的Ｚ力量結晶。
      zh-Hans: |-
        可用它来制造用于对战
        并能将梦幻的精神强念
        升级成特殊Ｚ招式的Ｚ力量结晶。
      en: |-
        It converts Z-Power into crystals that upgrade
        Mew’s Psychic to an exclusive Z-Move.
      fr: |-
        Permet de concentrer la Force Z en un cristal,
        qui autorise le Mew qui le tient à transformer
        son Psyko en capacité Z.
      de: |-
        Kristallisierte Z-Kraft, die Mews Attacke
        Psychokinese zu einer Z-Attacke aufstuft.
        Wird bei Bedarf automatisch vervielfacht.
      es: |-
        Concentra el Poder Z en cristales que permiten a
        Mew convertir su Psíquico en un movimiento Z.
      it: |-
        Permette di creare cristalli carichi di Potere Z che
        consentono a Mew di trasformare la mossa
        Psichico in una mossa Z.
