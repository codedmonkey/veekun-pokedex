      ja-Hrkt: |-
        ポケモンの　ロトムを　くみあわせ
        ターボが　できるようになった　だけでなく
        すいじょうも　はしれる　じてんしゃ。
      ja: |-
        ポケモンの　ロトムを　組み合わせ
        ターボが　できるようになった　だけでなく
        水上も　走れる　じてんしゃ。
      ko: |-
        포켓몬 로토무와의 조합으로
        터보를 사용할 수 있을 뿐만 아니라
        물 위에서도 달릴 수 있는 자전거.
      zh-Hant: |-
        和寶可夢洛托姆結合的自行車。
        不僅可以進行渦輪加速，
        還能在水上移動。
      zh-Hans: |-
        自行车和宝可梦洛托姆组合后，
        不仅可以通过涡轮发动机加速，
        而且可以在水面上骑行。
      en: |-
        This bike can be combined with the Pokémon Rotom to
        not only do a turbo boost but also run on the water.
      fr: |-
        Sous l’influence de Motisma, cette bicyclette permet
        non seulement de mettre le turbo, mais également
        de se déplacer sur l’eau.
      de: |-
        Ein Fahrrad, in dem sich ein Rotom befindet. Es wurde
        nicht nur um den Rotom-Turbo erweitert, sondern kann
        sich jetzt auch auf dem Wasser fortbewegen.
      es: |-
        Combinada con el Pokémon Rotom, esta bicicleta te
        permite usar un turbo y también desplazarte por encima
        del agua.
      it: |-
        La presenza di Rotom non permette solo di usare
        il turbo, ma anche di correre sulla superficie dell’acqua.
