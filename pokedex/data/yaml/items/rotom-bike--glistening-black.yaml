  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        ロトムの　ちからで　ターボが　でき
        すいじょうも　はしれる　じてんしゃ。
        あかぐろく　ひかる　ギラギラブラック。
      ja: |-
        ロトムの　力で　ターボが　でき
        水上も　走れる　じてんしゃ。
        赤黒く　光る　ギラギラブラック。
      ko: |-
        로토무의 힘으로 터보를 사용할 수 있고
        물 위에서도 달릴 수 있는 자전거.
        검붉게 빛나는 글리터링 블랙 디자인이다.
      zh-Hant: |-
        能用洛托姆的力量進行渦輪加速，
        還能在水上移動的自行車。
        會閃閃發出赤黑亮光的炫耀黑。
      zh-Hans: |-
        能借助洛托姆的力量进行涡轮加速，
        且可在水面上骑行的自行车。
        闪烁着红黑色光泽的炫耀黑。
      en: |-
        This bike can do a turbo boost and run on the water
        using Rotom’s power. It’s a glistening black that
        shines reddish-black.
      fr: |-
        Une bicyclette qui permet de mettre le turbo
        et de se déplacer sur l’eau grâce à Motisma.
        Son noir crépusculaire brille d’une lueur rouge.
      de: |-
        Ein gleißend schwarzes Fahrrad, das dank Rotom über
        einen Turbo verfügt und auf dem Wasser gefahren
        werden kann. Versprüht schwarz-rote Funken.
      es: |-
        Gracias al poder de Rotom, esta bicicleta permite usar
        el turbo y desplazarse sobre el agua. De color negro y
        con una fulgurante estela rojinegra.
      it: |-
        Una bicicletta dotata del turbo che può anche spostarsi
        in acqua grazie ai poteri di Rotom. È di colore nero
        scintillante ed emana una luce rossastra.
