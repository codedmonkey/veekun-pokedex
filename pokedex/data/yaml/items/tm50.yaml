    heartgold-soulsilver:
      en: |-
        The user attacks the foe at full
        power using fiery energy. It also
        sharply reduces the user’s Sp. Atk.
    black-white:
      en: |-
        The user attacks the target at full
        power. The attack’s recoil harshly
        reduces the user’s Sp. Atk stat.
      fr: |-
        Attaque l’ennemi à pleine puissance.
        Le contrecoup baisse énormément
        l’Attaque Spéciale du lanceur.
    black-2-white-2:
      en: |-
        The user attacks the target at full
        power. The attack’s recoil harshly
        reduces the user’s Sp. Atk stat.
    x-y:
      ja-Hrkt: |-
        フルパワーで　ほのおの　こうげき。
        つかったあと　じぶんの　とくこうは
        がくっと　さがる。
      ja: |-
        フルパワーで　相手を　攻撃する。
        使うと　反動で
        自分の　特攻が　がくっと　さがる。
      ko: |-
        풀 파워로 불꽃 공격을 한다.
        사용한 뒤 자신의 특수공격이
        크게 떨어진다.
      en: |-
        The user attacks the target at full power.
        The attack’s recoil harshly lowers the
        user’s Sp. Atk stat.
      fr: |-
        Attaque l’ennemi à pleine puissance.
        Le contrecoup baisse énormément l’Attaque
        Spéciale du lanceur.
      de: |-
        Angriff mit maximaler Kraft und feuriger Energie,
        der gleichzeitig den Spezial-Angriff des Angreifers
        senkt.
      es: |-
        Quien lo usa puede vengar a sus amigos. El daño
        causado será mayor si en el turno anterior han
        debilitado a alguno.
      it: |-
        Chi la usa sferra un potente attacco, ma il
        contraccolpo riduce di molto il suo Attacco
        Speciale.
    sun-moon:
      ja-Hrkt: |-
        フルパワーで　あいてを　こうげきする。
        つかうと　はんどうで
        じぶんの　とくこうが　がくっと　さがる。
      ja: |-
        フルパワーで　相手を　攻撃する。
        使うと　反動で
        自分の　特攻が　がくっと　さがる。
      ko: |-
        풀 파워로 상대를 공격한다.
        쓰면 반동으로
        자신의 특수공격이 크게 떨어진다.
      zh-Hant: |-
        釋放全部能量攻擊對手。
        使用後因為反作用力，
        自己的特攻會大幅降低。
      zh-Hans: |-
        使出全部力量攻击对手。
        使用之后会因为反作用力，
        自己的特攻大幅降低。
      en: |-
        The user attacks the target at full power.
        The attack’s recoil harshly lowers the user’s
        Sp. Atk stat.
      fr: |-
        Attaque l’ennemi à pleine puissance.
        Le contrecoup baisse beaucoup l’Attaque Spéciale
        du lanceur.
      de: |-
        Angriff mit maximaler Kraft, der gleichzeitig den
        Spezial-Angriff des Angreifers stark senkt.
      es: |-
        Quien lo usa ataca con toda su fuerza, pero ve
        muy reducido su Ataque Especial.
      it: |-
        Chi la usa sferra un potente attacco, ma il
        contraccolpo riduce di molto il suo Attacco
        Speciale.
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        フルパワーで　あいてを　こうげきする。
        つかうと　はんどうで
        じぶんの　とくこうが　がくっと　さがる。
      ja: |-
        フルパワーで　相手を　攻撃する。
        使うと　反動で
        自分の　特攻が　がくっと　さがる。
      ko: |-
