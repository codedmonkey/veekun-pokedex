        쓰면 반동으로
        자신의 특수공격이 크게 떨어진다.
      zh-Hant: |-
        釋放全部能量攻擊對手。
        使用後因為反作用力，
        自己的特攻會大幅降低。
      zh-Hans: |-
        使出全部力量攻击对手。
        使用之后会因为反作用力，
        自己的特攻大幅降低。
      en: |-
        The user attacks the target at full power.
        The attack’s recoil harshly lowers the user’s
        Sp. Atk stat.
      fr: |-
        Attaque l’ennemi à pleine puissance.
        Le contrecoup baisse beaucoup l’Attaque Spéciale
        du lanceur.
      de: |-
        Angriff mit maximaler Kraft, der gleichzeitig den
        Spezial-Angriff des Angreifers stark senkt.
      es: |-
        Quien lo usa ataca con toda su fuerza, pero ve
        muy reducido su Ataque Especial.
      it: |-
        Chi la usa sferra un potente attacco, ma il
        contraccolpo riduce di molto il suo Attacco
        Speciale.
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        じめんに　おりて　からだを　やすめる。
        さいだい　ＨＰの　はんぶんの
        ＨＰを　かいふく　する。
      ja: |-
        地面に　降りて　体を　やすめる。
        最大ＨＰの　半分の
        ＨＰを　回復する。
      ko: |-
        땅에 내려와 몸을 쉬게 한다.
        최대 HP의 절반만큼
        HP를 회복한다.
      zh-Hant: |-
        降落到地面，讓身體休息。
        回復自己最大HP的一半。
      zh-Hans: |-
        降到地面，使身体休息。
        回复自己最大HP的一半。
      en: |-
        The user lands and rests its body. This move restores
        the user’s HP by up to half of its max HP.
      fr: |-
        Le lanceur atterrit et se repose.
        Restaure jusqu’à la moitié de ses PV max.
      de: |-
        Anwender landet und ruht sich aus. KP des
        Anwenders werden um 50 % der maximalen KP
        aufgefüllt.
      es: |-
        Aterriza sobre la superficie para descansar.
        Recupera hasta la mitad del total de sus PS.
      it: |-
        Chi la usa sta fermo e riposa, recuperando
        metà dei propri PS massimi.
    sword-shield:
      ja-Hrkt: |-
        タネを　いきおいよく
        あいてに　はっしゃして　こうげきする。
        ２ー５かいの　あいだ　れんぞくで　だす。
      ja: |-
        タネを　勢いよく
        相手に　発射して　攻撃する。
        ２ー５回の　間　連続で　だす。
      ko: |-
        씨앗을 기세 좋게
        상대에게 발사하여 공격한다.
        2-5회 동안 연속으로 쓴다.
      zh-Hant: |-
        向對手猛烈地
        發射種子進行攻擊。
        連續攻擊２～５次。
      zh-Hans: |-
        向对手猛烈地
        发射种子进行攻击。
        连续攻击２～５次。
      en: |-
        The user forcefully shoots seeds at the target two
        to five times in a row.
      fr: |-
        Le lanceur mitraille l’ennemi avec une rafale de graines.
        De deux à cinq rafales sont lancées à la suite.
      de: |-
        Der Anwender wirft zwei- bis fünfmal in rascher Folge
        Samen auf das Ziel.
      es: |-
        Dispara rápido de dos a cinco ráfagas de semillas de
        manera consecutiva.
      it: |-
        Chi la usa spara da due a cinque raffiche di semi
        contro il bersaglio in successione.
