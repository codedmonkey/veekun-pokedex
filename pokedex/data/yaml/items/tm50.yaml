  effect:
    en: 'Teaches Overheat to a compatible Pokémon.'
  flags: {  }
  flavor_text:
    ruby-sapphire:
      en: |-
        Enables full-power
        attack, but sharply
        lowers SP. ATK.
    emerald:
      en: |-
        Enables full-power
        attack, but sharply
        lowers SP. ATK.
    firered-leafgreen:
      en: |-
        An intense attack
        that also sharply
        reduces the user’s
        SP. ATK stat.
    diamond-pearl:
      en: |-
        The user attacks the foe at full
        power using fiery energy. It also
        sharply reduces the user’s Sp. Atk.
    platinum:
      en: |-
        The user attacks the foe at full
        power using fiery energy. It also
