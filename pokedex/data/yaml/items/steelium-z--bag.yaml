  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        はがねタイプの　わざを
        Ｚワザに　グレードアップする
        Ｚパワーの　けっしょうを　つくりだす。
      ja: |-
        はがねタイプの　技を
        Ｚワザに　グレードアップする
        Ｚパワーの　結晶を　作りだす。
      ko: |-
        강철타입 기술을
        Z기술로 업그레이드하는
        Z파워의 결정을 만들어 낸다.
      zh-Hant: |-
        會製造出把鋼屬性招式
        升級為Ｚ招式的Ｚ力量結晶。
      zh-Hans: |-
        可用它来制造用于对战
        并能将钢属性招式升级成
        Ｚ招式的Ｚ力量结晶。
      en: |-
        It converts Z-Power into crystals that upgrade
        Steel-type moves to Steel-type Z-Moves.
      fr: |-
        Permet de concentrer la Force Z en un cristal,
        qui autorise son porteur à transformer ses
        capacités de type Acier en capacité Z.
      de: |-
        Kristallisierte Z-Kraft, die Stahl-Attacken zu
        Z-Attacken aufstuft. Wird bei Bedarf automatisch
        vervielfacht.
      es: |-
        Concentra el Poder Z en cristales que permiten a
        los portadores convertir sus movimientos de tipo
        Acero en movimientos Z.
      it: |-
        Permette di creare cristalli carichi di Potere Z che
        consentono ai Pokémon di trasformare le mosse
        di tipo Acciaio in mosse Z.
