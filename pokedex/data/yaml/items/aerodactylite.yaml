  flavor_text:
    x-y:
      ja-Hrkt: |-
        プテラに　もたせておくと
        たたかいのとき　メガシンカが　できる
        ふしぎな　メガストーンの　いっしゅ。
      ja: |-
        プテラに　持たせておくと
        戦いのとき　メガシンカが　できる
        不思議な　メガストーンの　一種。
      ko: |-
        프테라에게 지니게 하면
        배틀할 때 메가진화할 수 있는
        신비한 메가스톤의 일종.
      en: |-
        One variety of the mysterious Mega Stones.
        Have Aerodactyl hold it, and this stone will
        enable it to Mega Evolve during battle.
      fr: |-
        Une variété de Méga-Gemme.
        Tenue par un Ptéra, elle lui permet de
        méga-évoluer durant un combat.
      de: |-
        Einer der mysteriösen Mega-Steine. Wird er von
        einem Aerodactyl getragen, kann es im Kampf
        eine Mega-Entwicklung durchführen.
      es: |-
        Libera una horrible aura llena de malos
        pensamientos y puede hacer retroceder al
        objetivo.
      it: |-
        Un esemplare delle misteriose Megapietre.
        Data ad Aerodactyl, gli permette di megaevolversi
        durante la lotta.
