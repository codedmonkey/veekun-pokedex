friend-ball:
  category: apricorn-balls
  cost: 0
  effect:
    en: |-
      Used by a trainer in battle
      :   Attempts to [catch]{mechanic:catch} a wild Pokémon.  If used in a trainer battle, nothing happens and the ball is lost.

          If caught, the wild Pokémon's [happiness]{mechanic:happiness} starts at 200.
  flags: {  }
  flavor_text:
    heartgold-soulsilver:
      en: |-
        A Poké Ball that makes caught Pokémon
        more friendly.
    black-white:
      en: |-
        A Poké Ball that makes caught Pokémon
        more friendly.
      fr: |-
        Une Poké Ball un peu spéciale qui
        permet de rendre rapidement amicaux
        les Pokémon sauvages attrapés avec.
    black-2-white-2:
      en: |-
        A Poké Ball that makes caught Pokémon
        more friendly.
    x-y:
      ja-Hrkt: |-
        つかまえた　やせいポケモンが
        すぐに　なついて　くれる
        ちょっと　かわった　ボール。
      ja: |-
        捕まえた　野生ポケモンが
        すぐに　なついて　くれる
        ちょっと　変わった　ボール。
      ko: |-
        잡은 야생 포켓몬이
        바로 친밀해지는
        조금 특이한 볼.
      en: |-
        A strange Poké Ball that will make
        the wild Pokémon caught with it more
        friendly toward you immediately.
      fr: |-
        Une Poké Ball un peu spéciale qui permet de
        rendre rapidement amicaux les Pokémon
        sauvages attrapés avec celle-ci.
      de: |-
        Ein besonderer Ball, der die Sympathie von
        gefangenen Pokémon schneller ansteigen lässt.
      es: |-
        Contiene los datos del Pokéathlon con el número
        de derrotas.
      it: |-
        Poké Ball un po’ diversa che fa sì che i Pokémon
        selvatici con essa catturati si affezionino
        più rapidamente.
