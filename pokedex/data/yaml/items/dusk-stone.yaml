dusk-stone:
  category: evolution
  cost: 3000
  effect:
    en: |-
      Used on a party Pokémon
      :   Evolves a []{pokemon:lampent} into []{pokemon:chandelure}, a []{pokemon:misdreavus} into []{pokemon:mismagius}, or a []{pokemon:murkrow} into []{pokemon:honchkrow}.
  flags: {  }
  flavor_text:
    diamond-pearl:
      en: |-
        A peculiar stone that makes certain
        species of Pokémon evolve.
        It is as dark as dark can be.
