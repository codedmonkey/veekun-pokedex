    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        Ｚパワーの　けっしょう。
        ジャラランガの　スケイルノイズを
        Ｚワザに　グレードアップする。
      ja: |-
        Ｚパワーの　結晶。
        ジャラランガの　スケイルノイズを
        Ｚワザに　グレードアップする。
      ko: |-
        Z파워의 결정.
        짜랑고우거의 스케일노이즈를
        Z기술로 업그레이드한다.
      zh-Hant: |-
        Ｚ力量的結晶。
        可將杖尾鱗甲龍的鱗片噪音
        升級為Ｚ招式。
      zh-Hans: |-
        Ｚ力量的结晶。
        会将杖尾鳞甲龙的鳞片噪音
        升级成Ｚ招式。
      en: |-
        This is a crystallized form of Z-Power.
        It upgrades Kommo-o’s Clanging Scales to
        a Z-Move.
      fr: |-
        Une cristallisation de la Force Z, permettant
        de transformer la capacité Vibrécaille d’un Ékaïser
        en capacité Z.
      de: |-
        Ein Kristall, dem Z-Kraft innewohnt.
        Er stuft Grandiras’ Attacke Schuppenrasseln
        zu einer Z-Attacke auf.
      es: |-
        Cristal que confiere el Poder Z al movimiento
        Fragor Escamas de Kommo-o.
      it: |-
        Cristallo in cui è immagazzinato il Potere Z.
        Consente di trasformare la mossa Clamorsquame
        di Kommo-o in una mossa Z.
