      ja-Hrkt: |-
        じかんを　かけて　みがきあげた
        ひょうめんが　ツルツルに　ひかる
        どろで　できた　だんご。
      ja: |-
        時間を　かけて　磨きあげた
        表面が　ツルツルに　光る
        泥で　できた　団子。
