        표면이 반질반질하게 빛나는
        진흙으로 만든 경단.
      zh-Hant: |-
        花了不少時間
        把表面磨得
        非常光滑的泥球。
      zh-Hans: |-
        用泥土制作的丸子。
        花了大把时间打磨，
        表面油光水滑。
      en: |-
        A ball made of mud. It had been polished for such
        a long time that the surface is very shiny.
      fr: |-
        Une boulette de boue si bien polie qu’elle brille
        de mille feux.
      de: |-
        Eine Kugel aus Schlamm, die so lange Zeit poliert
        wurde, dass ihre Oberfläche nun leuchtend glänzt.
      es: |-
        Bola de barro que ha sido pulida durante tanto tiempo
        que su superficie ha quedado lisa y brillante.
      it: |-
        Una pallina di fango levigata con cura, tanto che
        la sua superficie è liscia e lucida.
