intriguing-stone:
  category: plot-advancement
  cost: 0
  effect:
    en: 'Trade for a Sun Stone in X and Y, or Pidgeotite in Omega Ruby and Alpha Sapphire.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        みる　ひとに　よっては
        きちょう　かもしれない
        かなり　かわった　いし。
      ja: |-
        みる　人に　よっては
        貴重　かもしれない
        かなり　変わった　石。
      ko: |-
        보는 사람에 따라서는
        귀중할지도 모르는
        꽤 특이한 돌.
      en: |-
        A rather curious stone that might
        appear to be valuable to some.
        It’s all in the eye of the beholder.
      fr: |-
        Une pierre assez étrange qui pourrait avoir de la
        valeur pour certains.
      de: |-
        Ein ungewöhnlicher Stein, dessen Wert je nach
        Betrachter unterschiedlich eingeschätzt wird.
      es: |-
        Amuleto con un poder misterioso que permite
        megaevolucionar a Pokémon que lleven una
        Megapiedra adecuada.
      it: |-
        Un sasso piuttosto singolare che qualcuno
        potrebbe ritenere di valore.
