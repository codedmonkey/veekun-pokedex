    black-white:
      en: |-
        If held by a Pokémon, it raises its
        Sp. Atk stat in a pinch.
      fr: |-
        Tenue, cette Baie monte l’Atq. Spé.
        en cas de besoin.
    black-2-white-2:
      en: |-
        If held by a Pokémon, it raises its
        Sp. Atk stat in a pinch.
    x-y:
      ja-Hrkt: |-
        ポケモンに　もたせると
        ピンチのとき　じぶんの
        とくこうが　あがる。
      ja: |-
        ポケモンに　持たせると
        ピンチのとき　自分の
        特攻が　あがる。
      ko: |-
        포켓몬에게 지니게 하면
        위급할 때 자신의
        특수공격이 올라간다.
      en: |-
        A Berry to be consumed by Pokémon.
        If a Pokémon holds one, its Sp. Atk
        stat will increase when it’s in a pinch.
      fr: |-
        Tenue, cette Baie augmente l’Attaque Spéciale
        en cas de besoin.
      de: |-
        Als getragenes Item erhöht diese Beere den
        Spezial-Angriffs-Wert eines Pokémon,
        sobald es in einer Notlage steckt.
      es: |-
        El Pokémon que la lleva puede hacer retroceder
        al Pokémon al que le inflige daño.
      it: |-
        Se il Pokémon che ha questa bacca si trova
        in difficoltà, il suo Attacco Speciale aumenta.
