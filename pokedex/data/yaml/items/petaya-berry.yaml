petaya-berry:
  category: in-a-pinch
  cost: 80
  effect:
    en: |-
      Held in battle
      :   When the holder has 1/4 its max [HP]{mechanic:hp} remaining or less, it consumes this item to [raise]{mechanic:raise} its [Special Attack]{mechanic:special-attack} by one stage.
  flags:
    - holdable-active
  flavor_text:
    ruby-sapphire:
      en: |-
        A hold item that
        raises SP. ATK in
        a pinch.
    emerald:
      en: |-
        A hold item that
        raises SP. ATK in
        a pinch.
    firered-leafgreen:
      en: |-
        When held by a POKéMON, it raises
        the SP. ATK stat in a pinch.
    diamond-pearl:
      en: |-
        A Poffin ingredient.
        If held by a Pokémon, it raises its
        Sp. Atk stat in a pinch.
    platinum:
      en: |-
        A Poffin ingredient.
        If held by a Pokémon, it raises its
        Sp. Atk stat in a pinch.
    heartgold-soulsilver:
      en: |-
        If held by a Pokémon, it raises its
