        おもいほど　いりょくが　あがる。
      ja: |-
        燃える　体で　相手に　ぶつかって
        攻撃する。　自分が　相手より
        重いほど　威力が　あがる。
      ko: |-
        불타는 몸으로 상대에게 부딪쳐서
