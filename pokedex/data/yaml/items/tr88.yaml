        무거울수록 위력이 올라간다.
      zh-Hant: |-
        用燃燒的身體重壓對手
        進行攻擊。體重比對手
        重越多，威力越大。
      zh-Hans: |-
        用燃烧的身体
        撞向对手进行攻击。
        自己比对手越重，威力越大。
      en: |-
        The user slams its target with its flame-covered
        body. The more the user outweighs the target, the
        greater the move’s power.
      fr: |-
        Le lanceur projette son corps enflammé contre l’ennemi.
        S’il est plus lourd que l’ennemi, l’effet augmente
        en conséquence.
      de: |-
        Rempelattacke mit brennendem Körper. Je schwerer
        der Anwender im Vergleich zum Ziel ist, desto stärker
        die Attacke.
      es: |-
        El usuario ataca con su cuerpo ardiente. Cuanto mayor
        sea su peso comparado con el del objetivo, más daño
        causará.
      it: |-
        Chi la usa carica con il suo corpo rovente. Più è
        pesante rispetto al bersaglio, più danni causa.
