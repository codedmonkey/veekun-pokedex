        zerstört.
      es: |-
        Ataca con contundentes puñetazos. Puede destruir
        barreras como Pantalla de Luz y Reflejo.
      it: |-
        Colpisce il bersaglio con una mano e rompe
        barriere come Riflesso e Schermoluce.
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        しゅとうを　いきおいよく　ふりおろして
        こうげきする。　ひかりのかべや
