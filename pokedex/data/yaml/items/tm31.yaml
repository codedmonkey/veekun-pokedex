    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        ほのおを　こめた　パンチで
        あいてを　こうげきする。
        やけど　じょうたいに　することが　ある。
      ja: |-
        炎を　こめた　パンチで
        相手を　攻撃する。
        やけど状態に　することが　ある。
      ko: |-
        불꽃을 담은 펀치로
        상대를 공격한다.
        화상 상태로 만들 때가 있다.
      zh-Hant: |-
        用帶有火焰的拳頭
        攻擊對手。
        有時會讓對手陷入灼傷狀態。
      zh-Hans: |-
        用充满火焰的拳头攻击对手。
        有时会让对手陷入灼伤状态。
      en: |-
        The target is punched with a fiery fist. This may also
        leave the target with a burn.
      fr: |-
        Un coup de poing enflammé vient frapper l’ennemi.
        Peut le brûler.
      de: |-
        Feuriger Schlag, der dem Ziel eventuell
        Verbrennungen zufügt.
      es: 'Puñetazo ardiente. Puede quemar.'
      it: |-
        Colpisce il bersaglio con un pugno ardente
        che può scottarlo.
    sword-shield:
      ja-Hrkt: |-
        ♂なら♀を　♀なら♂を　ゆうわくして
        メロメロに　する。
        あいては　わざが　だしにくく　なる。
      ja: |-
        ♂なら♀を　♀なら♂を　誘惑して
        メロメロに　する。
        相手は　技が　だしにくくなる。
      ko: |-
        수컷은 암컷을 암컷은 수컷을 유혹하여
        헤롱헤롱하게 만든다.
        상대가 기술을 쓰기 어려워진다.
      zh-Hant: |-
        ♂誘惑♀而♀誘惑♂，
        讓對手著迷。
        對手將難以使用招式。
      zh-Hans: |-
        ♂诱惑♀或♀诱惑♂，
        让对手着迷。
        对手将很难使出招式。
      en: |-
        If it is the opposite gender of the user, the target
        becomes infatuated and less likely to attack.
      fr: |-
        Si l’ennemi est du sexe opposé, il tombe amoureux
        et rechigne alors à attaquer.
      de: |-
        Wenn das Ziel nicht dem Geschlecht des Anwenders
        angehört, fühlt es sich zu ihm hingezogen und greift
        eventuell nicht an.
      es: |-
        Si el objetivo es del sexo opuesto, se enamorará y
        bajará la posibilidad de que ataque.
      it: |-
        Se il bersaglio è del sesso opposto, s’infatua
        e diventa riluttante ad attaccare.
