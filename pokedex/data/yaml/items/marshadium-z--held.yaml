marshadium-z--held:
  category: z-crystals
  cost: 0
  effect:
    en: 'Held: Allows []{pokemon:marshadow} to upgrade []{move:spectral-thief} into []{move:soul-stealing-7-star-strike}.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        Ｚパワーの　けっしょう。
        マーシャドーの　シャドースチールを
        Ｚワザに　グレードアップする。
      ja: |-
        Ｚパワーの　結晶。
        マーシャドーの　シャドースチールを
        Ｚワザに　グレードアップする。
      ko: |-
        Z파워의 결정.
        마샤도의 섀도스틸을
        Z기술로 업그레이드한다.
      zh-Hant: |-
        Ｚ力量的結晶。
        會把瑪夏多的暗影偷盜
        升級為Ｚ招式。
      zh-Hans: |-
        Ｚ力量的结晶。
        会将玛夏多的暗影偷盗
        升级成Ｚ招式。
      en: |-
        This is a crystallized form of Z-Power.
        It upgrades Marshadow’s Spectral Thief to
        a Z-Move.
      fr: |-
        Une cristallisation de la Force Z, permettant
        de transformer le Clepto-Mânes de Marshadow
        en capacité Z.
      de: |-
        Ein Kristall, dem Z-Kraft innewohnt.
        Er stuft Marshadows Attacke Diebesschatten
        zu einer Z-Attacke auf.
      es: |-
        Cristal que confiere el Poder Z al movimiento
        Robasombra de Marshadow.
      it: |-
        Cristallo in cui è immagazzinato il Potere Z.
        Consente di trasformare la mossa Ombrafurto
        di Marshadow in una mossa Z.
