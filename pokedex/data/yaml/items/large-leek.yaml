  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        キャンプの　りょうりに　つかう
        しょくざいの　いっしゅ。ポケモン　カモネギが
        このむ　しょくぶつの　クキなのかは　なぞ。
      ja: |-
        キャンプの　料理に　使う
        食材の　一種。ポケモン　カモネギが
        好む　植物の　クキなのかは　謎。
      ko: |-
        캠프 요리에 사용되는
        식재료 중 하나. 포켓몬 파오리가
        좋아하는 식물의 줄기인지는 불명이다.
      zh-Hant: |-
        製作露營料理時使用的食材之一。
        不知道是不是寶可夢大蔥鴨
        所喜愛的那種植物的莖。
      zh-Hans: |-
        在露营营地制作料理时会使用的
        一种食材。不知是不是宝可梦
        大葱鸭最爱的那种植物的茎。
      en: |-
        One of the many ingredients that can be used for
        cooking at your camp. Whether this is the kind of
        vegetable stalk that Farfetch’d like is unknown.
      fr: |-
        Un ingrédient de cuisine pour le camping.
        On ne sait pas trop pourquoi les Canarticho
        les affectionnent tant.
      de: |-
        Eine Zutat für PokéCamping-Mahlzeiten. Es ist unklar,
        ob es dieselbe Sorte Lauch ist, die bei Porenta so hoch
        im Kurs steht.
      es: |-
        Un ingrediente para cocinar en el campamento. No se
        sabe si este es el tipo de verdura que le gusta a
        Farfetch’d.
      it: |-
        Uno degli ingredienti che puoi usare per cucinare
        in campeggio. Nessuno sa se questo sia lo stesso
        tipo di gambo che piace tanto ai Farfetch’d.
