kee-berry:
  category: other
  cost: 80
  effect:
    en: 'Held: When the holder is hit by a physical move, increases its Defense by one stage.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        ポケモンに　もたせると
        ぶつりわざを　うけたとき
        じぶんの　ぼうぎょが　あがる。
      ja: |-
        ポケモンに　持たせると
        物理技を　受けたとき
        自分の　防御が　あがる。
      ko: |-
        포켓몬에게 지니게 하면
        물리 기술을 당했을 때
        자신의 방어가 올라간다.
      en: |-
        If held by a Pokémon, this Berry
        will increase the holder’s Defense
        if it’s hit with a physical move.
      fr: |-
        Baie à tenir augmentant la Défense du Pokémon
        lorsqu’il est touché par une attaque physique.
      de: |-
        Als getragenes Item erhöht diese Beere die
        Verteidigung des Trägers, wenn dieser von
        physischen Attacken getroffen wird.
      es: |-
        Baúl ligero de increíble capacidad donde pueden
        guardarse todas las prendas de ropa adquiridas.
      it: |-
        Bacca da dare a un Pokémon.
        Se chi ce l’ha subisce una mossa fisica,
        la sua Difesa aumenta.
