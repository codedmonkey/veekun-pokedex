brittle-bones:
  category: curry-ingredients
  cost: 950
  effect: {  }
  flags: {  }
  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        キャンプの　りょうりに　つかう
        しょくざいの　いっしゅ。ホネから　ほんのり
        にじみだす　エキスが　うまみを　たす。
      ja: |-
        キャンプの　料理に　使う
        食材の　一種。ホネから　ほんのり
        にじみだす　エキスが　旨味を　足す。
      ko: |-
        캠프 요리에 사용되는
        식재료 중 하나. 뼈에서 은은하게
        배어 나오는 진액이 감칠맛을 더해준다.
      zh-Hant: |-
        製作露營料理時使用的食材之一。
        從骨頭裡滲出來的少量精華
        可以使料理更添美味。
      zh-Hans: |-
        在露营营地制作料理时会使用的
        一种食材。将骨头精心熬煮而得的
        一丝浓缩的精华加深了料理的美味。
      en: |-
        One of the many ingredients that can be used for
        cooking at your camp. The taste boiled off from the
        bones is sure to give a dish a light umami taste.
      fr: |-
        Un ingrédient de cuisine pour le camping.
        Les saveurs subtiles extraites de cet os
        donnent un goût exquis aux plats.
      de: |-
        Eine Zutat für PokéCamping-Mahlzeiten. Das Aroma,
        das diese Knochen auf andere Zutaten übertragen,
        verleiht jeder Speise einen vorzüglichen Geschmack.
      es: |-
        Un ingrediente para cocinar en el campamento. Los
        jugos del hueso dan un profundo sabor a la salsa.
      it: |-
        Uno degli ingredienti che puoi usare per cucinare
        in campeggio. Le sostanze rilasciate da questi
        ossi donano al piatto un gusto unico.
