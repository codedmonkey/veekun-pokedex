custap-berry:
  category: in-a-pinch
  cost: 80
  effect:
    en: |-
      Held in battle
      :   When the holder has 1/4 its max [HP]{mechanic:hp} remaining or less, it consumes this item.  On the following turn, the holder will act first among moves with the same [priority]{mechanic:priority}, regardless of [Speed]{mechanic:speed}.
  flags:
    - holdable-active
  flavor_text:
    diamond-pearl:
      en: |-
        A Poffin ingredient. If held by a
        Pokémon, it gets to move first just
        once in a pinch.
    platinum:
      en: |-
        A Poffin ingredient. If held by a
        Pokémon, it gets to move first just
        once in a pinch.
    heartgold-soulsilver:
      en: |-
        If held by a Pokémon, it gets to move
        first just once in a pinch.
    black-white:
      en: |-
        If held by a Pokémon, it gets to move
        first just once in a pinch.
      fr: |-
        Tenue, cette Baie permet d’attaquer
        en premier une fois en cas de besoin.
    black-2-white-2:
      en: |-
        If held by a Pokémon, it gets to move
        first just once in a pinch.
    x-y:
      ja-Hrkt: |-
        ポケモンに　もたせると
        ピンチのとき　いちどだけ
        こうどうが　はやくなる。
      ja: |-
        ポケモンに　持たせると
        ピンチのとき　１度だけ
        行動が　早くなる。
      ko: |-
        포켓몬에게 지니게 하면
        위급할 때 한 번만
        행동이 빨라진다.
      en: |-
        A Berry to be consumed by Pokémon.
        If a Pokémon holds one, it will be able to
        move first just once when it’s in a pinch.
      fr: |-
        Tenue, cette Baie permet d’attaquer en premier
        une fois en cas de besoin.
      de: |-
        Als getragenes Item ermöglicht diese Beere dem
        Träger in einer Notlage den Erstschlag.
      es: |-
        Tiene un débil brillo rosado y debe llevarla
        Clamperl. Sube la Defensa Especial.
      it: |-
        Se il Pokémon che ha questa bacca si trova
        in difficoltà, sferra la sua mossa per primo.
        Funziona una sola volta.
