tm23:
  category: all-machines
  cost: 10000
  effect:
    en: 'Teaches Iron Tail to a compatible Pokémon.'
  flags: {  }
  flavor_text:
    ruby-sapphire:
      en: |-
        Slams the foe with
        a hard tail. It may
        lower DEFENSE.
    emerald:
      en: |-
        Slams the foe with
        a hard tail. It may
        lower DEFENSE.
    firered-leafgreen:
      en: |-
        An attack with a
        steel-hard tail.
        It may lower the
        foe’s DEFENSE stat.
    diamond-pearl:
      en: |-
        The foe is slammed with a sturdy
        tail of steel. It may also lower the
        target’s Defense stat if it hits.
    platinum:
      en: |-
        The foe is slammed with a sturdy
        tail of steel. It may also lower the
        target’s Defense stat if it hits.
    heartgold-soulsilver:
      en: |-
        The foe is slammed with a sturdy
        tail of steel. It may also lower the
        target’s Defense stat if it hits.
    black-white:
      en: |-
        The user throws a stone or projectile
        to attack an opponent. A flying Pokémon
        will fall to the ground when it’s hit.
      fr: |-
        Le lanceur jette toutes sortes
        de projectiles à un ennemi. Si ce
        dernier vole, il tombe au sol.
    black-2-white-2:
      en: |-
        The user throws a stone or projectile
        to attack an opponent. A flying Pokémon
        will fall to the ground when it’s hit.
    x-y:
      ja-Hrkt: |-
        いしや　たまを　なげて　とんでいる
        あいてを　こうげきする。あいては
        うちおとされて　じめんに　おちる。
      ja: |-
        石や　弾を　投げて　飛んでいる
        相手を　攻撃する。相手は
        うちおとされて　地面に　おちる。
      ko: |-
        돌이나 구슬을 던져서 날고 있는
        상대를 공격한다.
        맞은 상대는 땅에 떨어진다.
      en: |-
        The user throws a stone or similar projectile
        to attack an opponent. A flying Pokémon
        will fall to the ground when it’s hit.
      fr: |-
        Le lanceur jette toutes sortes de projectiles à
        un ennemi. Si ce dernier vole, il tombe au sol.
      de: |-
        Greift das Ziel mit Steinen und Wurfgeschossen
        an. Fliegende Ziele fallen vom Himmel
        und landen auf dem Boden.
      es: |-
        Ataque que desconcierta por su rapidez y que no
        falla nunca.
      it: |-
        Chi la usa lancia una pietra o un proiettile. Può
        colpire anche un bersaglio in volo e farlo cadere.
    sun-moon:
      ja-Hrkt: |-
        いしや　たまを　なげて　とんでいる
        あいてを　こうげきする。　あいては
        うちおとされて　じめんに　おちる。
      ja: |-
        石や　弾を　投げて　飛んでいる
        相手を　攻撃する。　相手は
        うちおとされて　地面に　おちる。
      ko: |-
        돌이나 구슬을 던져서 날고 있는
        상대를 공격한다.
        맞은 상대는 땅에 떨어진다.
      zh-Hant: |-
        向空中的對手投擲石頭或炮彈等物體
        進行攻擊。對手會被擊落，掉到地面。
      zh-Hans: |-
        扔石头或炮弹，
        攻击飞行的对手。
        对手会被击落，掉到地面。
      en: |-
        The user throws a stone or similar projectile to
        attack an opponent. A flying Pokémon will fall to
        the ground when it’s hit.
      fr: |-
        Le lanceur jette toutes sortes de projectiles à
        un ennemi. Si ce dernier vole, il tombe au sol.
      de: |-
        Greift das Ziel mit Steinen und Wurfgeschossen an.
        Fliegende Ziele fallen vom Himmel und landen auf
        dem Boden.
      es: |-
        El usuario ataca lanzando una piedra o un proyectil.
        Puede estrellar contra el suelo al objetivo si vuela.
      it: |-
        Chi la usa lancia una pietra o un proiettile. Può
        colpire anche un bersaglio in volo e farlo cadere.
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        いしや　たまを　なげて　とんでいる
        あいてを　こうげきする。　あいては
        うちおとされて　じめんに　おちる。
      ja: |-
        石や　弾を　投げて　飛んでいる
        相手を　攻撃する。　相手は
        うちおとされて　地面に　おちる。
      ko: |-
