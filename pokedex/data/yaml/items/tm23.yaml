      it: |-
        Chi la usa lancia una pietra o un proiettile. Può
        colpire anche un bersaglio in volo e farlo cadere.
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        でんげきを　こめた　パンチで
        あいてを　こうげきする。
        まひ　じょうたいに　することが　ある。
      ja: |-
        電撃を　こめた　パンチで
        相手を　攻撃する。
        まひ状態に　することが　ある。
      ko: |-
        전격을 담은 펀치로
        상대를 공격한다.
        마비 상태로 만들 때가 있다.
      zh-Hant: |-
        用帶有電流的拳頭
        攻擊對手。
        有時會讓對手陷入麻痺狀態。
      zh-Hans: |-
        用充满电流的拳头攻击对手。
        有时会让对手陷入麻痹状态。
      en: |-
        The target is punched with an electrified fist.
        This may also leave the target with paralysis.
      fr: |-
        Un coup de poing électrique vient frapper l’ennemi.
        Peut le paralyser.
      de: |-
        Ein elektrischer Schlag, der das Ziel eventuell
        paralysiert.
      es: 'Puñetazo eléctrico. Puede paralizar.'
      it: |-
        Colpisce il bersaglio con un pugno elettrico
        che può paralizzarlo.
    sword-shield:
      ja-Hrkt: |-
        こうげきと　どうじに　どうぐを　ぬすむ。
        じぶんが　どうぐを　もっている　ばあいは
        ぬすめない。
      ja: |-
        攻撃と　同時に　道具を　盗む。
        自分が　道具を　持っている　場合は
        盗めない。
      ko: |-
        공격과 동시에 도구를 훔친다.
        자신이 도구를 지니고 있을 경우에는
        훔칠 수 없다.
      zh-Hant: |-
        在攻擊的同時偷取道具。
        當寶可夢自己有攜帶道具時，
        則無法偷取。
      zh-Hans: |-
        攻击的同时盗取道具。
        当自己携带道具时，
        不会去盗取。
      en: |-
        The user attacks and steals the target’s held item
        simultaneously. The user can’t steal anything if it
        already holds an item.
      fr: |-
        Le lanceur attaque la cible et vole son objet.
        Le lanceur ne peut rien voler s’il tient déjà un objet.
      de: |-
        Ermöglicht es, das Item des Zieles zu stehlen, solang
        der Anwender selbst keins bei sich trägt.
      es: |-
        El agresor ataca y le quita el objeto al objetivo siempre
        y cuando no lleve ninguno.
      it: |-
        Chi la usa attacca il bersaglio e può rubargli
        lo strumento, se non ne ha già uno.
