  flavor_text:
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        このはで　つくった　てがみ。
        ピカチュウの　あしあとで
        なにかが　かかれて　いる。
      ja: |-
        木の葉で　作った　手紙。
        ピカチュウの　足あとで
        なにかが　書かれて　いる。
      ko: |-
        나뭇잎으로 만든 편지.
        피카츄의 발자국으로
        무언가가 쓰여 있다.
      zh-Hant: |-
        用樹葉做的信。
        上面有皮卡丘的腳印。
        好像是想表達些什麼。
      zh-Hans: |-
        以树叶制作的信件。
        上面留有皮卡丘的足迹，
        好像是要表达些什么。
      en: |-
        A letter written on a leaf. Something is written using
        Pikachu’s footprints.
      fr: |-
        Une lettre rédigée sur une feuille d’arbre.
        Pikachu semble y avoir écrit quelque chose
        avec ses pattes.
      de: |-
        Ein Brief, der auf einem Blatt verfasst wurde.
        Pikachu scheint mit seinen Pfotenabdrücken
        etwas geschrieben zu haben.
      es: |-
        Una carta escrita en una hoja. Hay huellas de Pikachu
        estampadas en ella y parecen guardar algún significado.
      it: |-
        Una lettera scritta sulla foglia di un albero, dove le
        impronte di Pikachu sembrano formare delle frasi
        di senso compiuto.
