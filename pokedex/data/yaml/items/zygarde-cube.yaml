zygarde-cube:
  category: gameplay
  cost: 0
  effect:
    en: 'Contains collected Zygarde cells/cores.  Can teach Zygarde moves.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        ポケモン　ジガルデの　コアと　セルを
        あつめるための　どうぐ。　ジガルデに
        わざを　おしえることも　できる。
      ja: |-
        ポケモン　ジガルデの　コアと　セルを
        集めるための　道具。　ジガルデに
        技を　教えることも　できる。
      ko: |-
        포켓몬 지가르데의 코어와 셀을
        모으기 위한 도구. 지가르데에게
        기술을 가르칠 수도 있다.
      zh-Hant: |-
        用於收集寶可夢基格爾德的
        核心和細胞的道具。
        也可以教基格爾德招式。
      zh-Hans: |-
        用于收集宝可梦基格尔德的
        核心和细胞的道具。
        还可以教基格尔德招式。
      en: |-
        An item to store Zygarde Cores and Cells.
        You can also use it to teach Zygarde moves.
      fr: |-
        Un artefact permettant de rassembler les Cellules
        et Cœurs de Zygarde, ainsi que de lui apprendre
        des capacités particulières.
      de: |-
        Ein Gegenstand zum Sammeln der Kerne und Zellen
        des Pokémon Zygarde. Mit ihm können Zygarde
        auch Attacken beigebracht werden.
      es: |-
        Dispositivo para almacenar células y núcleos de
        Zygarde. También es posible usarlo para enseñarle
        movimientos.
      it: |-
        Strumento che permette di raccogliere i nuclei
        e le cellule di Zygarde. Grazie ad esso è anche
        possibile insegnare delle mosse a questo Pokémon.
