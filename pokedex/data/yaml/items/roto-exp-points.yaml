  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        ロトムパワーの　ひとつ。
        しょうぶの　あとに　もらえる
        けいけんちが　すこし　ふえる。
      ja: |-
        ロトムパワーの　ひとつ。
        勝負の　あとに　もらえる
        経験値が　少し　増える。
      ko: |-
        로토무파워 중 하나.
        승부 후에 얻는
        경험치가 조금 늘어난다.
      zh-Hant: |-
        洛托姆之力的一種。
        對戰後可獲得的
        經驗值將會稍微增加。
      zh-Hans: |-
        洛托姆之力的一种。
        对战后能得到的
        经验值会稍微增加。
      en: |-
        One of the Rotom Powers.
        It increases the Exp. Points your Pokémon receive
        after battle a little.
      fr: |-
        Une des Motism’Auras. Elle permet d’augmenter
        légèrement l’expérience gagnée par vos Pokémon
        en combat.
      de: |-
        Diese Rotom-Kraft bewirkt, dass Pokémon im
        Kampf mehr Erfahrungspunkte erhalten.
      es: |-
        Poder Rotom que incrementa ligeramente los Puntos
        de Experiencia obtenidos en combate.
      it: |-
        Potere Rotom che fa aumentare un po’
        i Punti Esperienza ottenuti dopo ogni lotta.
