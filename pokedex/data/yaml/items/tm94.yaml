tm94:
  category: all-machines
  cost: 10000
  effect:
    en: 'Teaches []{move:rock-smash} to a compatible Pokémon.'
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        The user attacks with a punch that can
        shatter a rock. It may also lower the
        target’s Defense stat.
      fr: |-
        Porte un coup dévastateur à l’ennemi.
        Peut briser des rochers fissurés.
        Peut baisser la Défense.
    black-2-white-2:
      en: |-
        The user attacks with a punch that can
        shatter a rock. It may also lower the
        target’s Defense stat.
    x-y:
      ja-Hrkt: |-
        パンチで　こうげき。　あいての
        ぼうぎょを　さげる　ことが　ある。
        いわを　くだくことも　できる。
      ja: |-
        パンチで　攻撃する。相手の
        防御を　さげる　ことが　ある。
        岩を　砕くことも　ある。
      ko: |-
        펀치로 공격한다.
        상대의 방어를 떨어뜨릴 때가 있으며
        바위를 깰 수도 있다.
      en: |-
        The user attacks with a punch. This may
        also lower the target’s Defense stat. This
        move can also shatter rocks in the field.
      fr: |-
        Porte un coup de poing à l’ennemi qui peut
        baisser sa Défense. Peut aussi briser des rochers
        fissurés.
      de: |-
        Der Anwender greift mit einem Hieb an, der den
        Verteidigungs-Wert des Zieles senken kann.
        Damit können auch Steine zerschlagen werden.
      es: |-
        Espejo misterioso que refleja la verdad y
        devuelve los Pokémon a su forma original.
      it: |-
        Chi la usa colpisce il nemico con un pugno
        in grado di frantumare anche la roccia.
        Può anche ridurne la Difesa.
    sun-moon:
      ja-Hrkt: |-
        おおきな　なみで　じぶんの
        まわりに　いるものを　こうげきする。
      ja: |-
        大きな　波で　自分の
        周りに　いるものを　攻撃する。
      ko: |-
        큰 파도로 자신의
        주위에 있는 포켓몬을 공격한다.
      zh-Hant: |-
        使用大浪
        攻擊自己周圍所有的寶可夢。
      zh-Hans: |-
        利用大浪
        攻击自己周围所有的宝可梦。
      en: |-
        The user attacks everything around it by swamping
        its surroundings with a giant wave.
      fr: |-
        Une énorme vague s’abat sur le champ de bataille
        et inflige des dégâts à tous les Pokémon autour
        du lanceur.
      de: |-
        Anwender greift mit einer gewaltigen Welle
        alle Pokémon in seiner Umgebung an.
      es: 'Inunda el terreno de combate con una ola gigante.'
      it: |-
        Un’onda enorme sommerge il campo di lotta,
        colpendo tutti i Pokémon intorno a chi la scatena.
