    sword-shield:
      ja-Hrkt: |-
        あいての　ＨＰが
        かならず　１だけ　のこる　ように
        てかげん　して　こうげきする。
      ja: |-
        相手の　ＨＰが
        必ず　１だけ　残るように
        手加減して　攻撃する。
      ko: |-
        상대의 HP가
        반드시 1만 남도록
        조절하여 공격한다.
      zh-Hant: |-
        手下留情地攻擊對手，
        一定會讓對手剩下１ＨＰ。
      zh-Hans: |-
        对手的ＨＰ
        至少会留下１ＨＰ，
        如此般手下留情地攻击。
      en: |-
        A restrained attack that prevents the target from
        fainting. The target is left with at least 1 HP.
      fr: |-
        Le lanceur retient ses coups pour que l’ennemi
        garde au moins 1 PV et ne tombe pas K.O.
      de: 'Ein Angriff, der dem Ziel zumindest 1 KP lässt.'
      es: |-
        Ataque moderado que no debilita al objetivo y le deja
        al menos 1 PS.
      it: |-
        Chi la usa trattiene il colpo per impedire al bersaglio
        di andare KO, lasciandolo con almeno un PS.
