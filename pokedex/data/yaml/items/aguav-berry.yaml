aguav-berry:
  category: picky-healing
  cost: 80
  effect:
    en: |-
      Held in battle
      :   When the holder has 1/2 its max [HP]{mechanic:hp} remaining or less, it consumes this item to restore 1/8 its max HP.  If the holder dislikes bitter flavors (i.e., has a nature that lowers [Special Defense]{mechanic:special-defense}), it will also become [confused]{mechanic:confusion}.
  flags:
    - holdable-active
  flavor_text:
    ruby-sapphire:
      en: |-
        A hold item that
        restores HP but
        may confuse.
    emerald:
      en: |-
        A hold item that
        restores HP but
        may confuse.
    firered-leafgreen:
      en: |-
        A hold item that restores HP but
        may cause confusion when used.
    diamond-pearl:
      en: |-
        A Poffin ingredient. If held by a
        Pokémon, it restores the user’s HP in
        a pinch, but may also cause confusion.
    platinum:
      en: |-
        A Poffin ingredient. If held by a
        Pokémon, it restores the user’s HP in
        a pinch, but may also cause confusion.
    heartgold-soulsilver:
      en: |-
        If held by a Pokémon, it restores the
        user’s HP in a pinch, but will cause
        confusion if it hates bitter food.
    black-white:
      en: |-
        If held by a Pokémon, it restores the
        user’s HP in a pinch, but will cause
        confusion if it hates the taste.
      fr: |-
        Tenue, cette Baie restaure des PV en
        cas de besoin, mais rend confus si
        le Pokémon n’aime pas son goût.
    black-2-white-2:
      en: |-
        If held by a Pokémon, it restores the
        user’s HP in a pinch, but will cause
        confusion if it hates the taste.
    x-y:
      ja-Hrkt: |-
        ポケモンに　もたせると
        ピンチのとき　ＨＰを　かいふくする。
        きらいな　あじだと　こんらん　する。
      ja: |-
        ポケモンに　持たせると
        ピンチのとき　ＨＰを　回復する。
        きらいな味だと　混乱する。
      ko: |-
        포켓몬에게 지니게 하면
        위급할 때 HP를 회복한다.
        싫어하는 맛이면 혼란에 빠진다.
      en: |-
        If held by a Pokémon, it restores the
        user’s HP in a pinch, but it will cause
        confusion if the user hates the taste.
      fr: |-
        Tenue, cette Baie restaure des PV en cas
        de besoin, mais rend le Pokémon confus si
        son goût lui déplaît.
      de: |-
        Als getragenes Item füllt die Beere die KP eines
        Pokémon auf, doch ihr Aroma verwirrt jene,
        die es nicht mögen.
      es: 'Una baya muy rara en la región de Teselia.'
      it: |-
        Se un Pokémon in difficoltà ha questa bacca,
        recupera dei PS. Se al Pokémon non piace
        il suo sapore, può causare confusione.
    sun-moon:
      ja-Hrkt: |-
