      ja-Hrkt: |-
        なかまを　たすける。
        てだすけ　された　ポケモンの　わざの
        いりょくは　いつもより　おおきく　なる。
      ja: |-
        仲間を　助ける。
        てだすけ　された　ポケモンの　技の
        威力は　いつもより　大きくなる。
      ko: |-
        동료를 돕는다.
        도움받은 포켓몬이 쓰는 기술의
        위력은 여느 때보다 커진다.
      zh-Hant: |-
        幫助夥伴。
        被幫助的寶可夢，
        招式的威力會比原來更大。
      zh-Hans: |-
        帮助伙伴。
        被帮助的宝可梦，
        其招式威力变得比平时大。
      en: |-
        The user assists an ally by boosting the power of
        that ally’s attack.
      fr: |-
        Une capacité qui augmente la puissance d’attaque
        d’un allié.
      de: |-
        Anwender steigert die Kraft eines Angriffes eines
        Mitstreiters.
      es: |-
        El usuario ayuda a un aliado reforzando la potencia
        de su ataque.
      it: |-
        Mossa che aumenta la potenza dell’attacco
        di un alleato.
