x-sp-atk-2:
  category: miracle-shooter
  cost: 0
  effect:
    en: |-
      Used on a party Pokémon in battle
      :   Raises the target's [Special Attack]{mechanic:special-attack} by two [stages]{mechanic:stage}.
      This item can only be obtained or used via the Wonder Launcher.
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        It sharply raises the Sp. Atk stat of a
        Pokémon in battle. It wears off if the
        Pokémon is withdrawn.
      fr: |-
        Monte un peu l’Atq. Spé. pendant
        un combat. L’effet s’estompe
        si le Pokémon se retire.
    black-2-white-2:
      en: |-
        It sharply raises the Sp. Atk stat of a
        Pokémon in battle. It wears off if the
        Pokémon is withdrawn.
    x-y:
      ja-Hrkt: |-
        せんとうちゅうの　ポケモンの
        とくこうを　それなりに　あげる。
        ひっこめると　もとに　もどる。
      ja: |-
        戦闘中の　ポケモンの
        特攻を　それなりに　あげる。
        ひっこめると　元に　戻る。
      ko: |-
        배틀 중인 포켓몬의 특수공격을
        그럭저럭 올린다. 포켓몬을 볼에
        넣어버리면 원래대로 되돌아간다.
      en: |-
        It sharply raises the Sp. Atk stat of a
        Pokémon in battle. It wears off if the
        Pokémon is withdrawn.
      fr: |-
        Augmente un peu l’Attaque Spéciale pendant
        un combat. L’effet s’estompe si le Pokémon
        se retire.
      de: |-
        Hebt den Spezial-Angriffs-Wert eines Pokémon
        im Kampf leicht an. Die Wirkung endet mit dem
        Austausch des Pokémon.
      es: |-
        Cuando se usa, un Pokémon de tu equipo utiliza
        su objeto inmediatamente.
      it: |-
        Aumenta molto l’Attacco Speciale di un Pokémon
        in una lotta. L’effetto svanisce se il Pokémon
        è sostituito.
