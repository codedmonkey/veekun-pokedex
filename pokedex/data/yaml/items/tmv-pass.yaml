tmv-pass:
  category: gameplay
  cost: 0
  effect:
    en: 'Permits access to Kiloude City.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        ミアレシティと　キナンシティを
        むすぶ　ちょうこうそくてつどうに
        いつでも　のれる　チケット。
      ja: |-
        ミアレシティと　キナンシティを
        結ぶ　超高速鉄道に
        いつでも　乗れる　チケット。
      ko: |-
        미르시티와 기남시티를 잇는
        초고속철도를 언제든지
        탈 수 있는 티켓.
      en: |-
        A commuter pass that allows the
        holder to ride the TMV between Lumiose
        City and Kiloude City at any time.
      fr: |-
        Un abonnement à vie à la ligne de TMV qui relie
        Illumis à Batisques.
      de: |-
        Mit dieser Fahrkarte kannst du jederzeit den
        Hochgeschwindigkeitszug nehmen, der zwischen
        Illumina City und Batika City verkehrt.
      es: ''
      it: |-
        Biglietto che permette di salire liberamente
        sul treno a megavelocità che collega
        Luminopoli e Batikopoli.
