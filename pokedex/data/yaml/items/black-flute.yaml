black-flute:
  category: spelunking
  cost: 20
  effect:
    en: |-
      Used outside of battle
      :   Decreases the wild Pokémon encounter rate by 50%.
  flags:
    - countable
    - consumable
    - usable-overworld
    - holdable
  flavor_text:
    ruby-sapphire:
      en: |-
        A glass flute that
        keeps away wild
        POKéMON.
    emerald:
      en: |-
        A glass flute that
        keeps away wild
        POKéMON.
    firered-leafgreen:
      en: |-
        A black glass flute.
        When blown, it makes wild POKéMON
        less likely to appear.
    diamond-pearl:
      en: |-
        A black flute made from blown glass.
        Its melody makes wild Pokémon less
        likely to appear.
    platinum:
      en: |-
        A black flute made from blown glass.
        Its melody makes wild Pokémon less
        likely to appear.
    heartgold-soulsilver:
      en: |-
        A black flute made from blown glass.
        Its melody makes wild Pokémon less
        likely to appear.
    black-white:
      en: |-
        A toy flute made from black glass.
        A maniac will buy it for a high price.
      fr: |-
        Jouet en forme de flûte en verre
        noir. Les amateurs en donnent
        un bon prix.
    black-2-white-2:
      en: |-
        A toy flute made from black glass.
        A maniac will buy it for a high price.
    x-y:
      ja-Hrkt: |-
        くろい　ガラスで　できている
        おもちゃの　ふえ。
      ja: |-
        黒い　ガラスで　できている
        おもちゃの　笛。
      ko: |-
        검은 유리로 만들어진
        장난감 피리.
      en: |-
        A lovely toy flute to admire.
        It’s made from black glass.
      fr: 'Un jouet en forme de flûte en verre noir.'
      de: 'Eine Spielzeugflöte aus schwarzem Glas.'
      es: 'Una flauta de juguete de cristal negro.'
      it: 'Flauto giocattolo fatto di vetro nero.'
    sun-moon:
      ja-Hrkt: |-
        くろいガラスで　できた　ふえ。
        つかった　ばしょで　つよいポケモンと
        そうぐう　しやすくなる。
      ja: |-
        黒いガラスで　できた　笛。
        使った　場所で　強いポケモンと
        遭遇　しやすくなる。
      ko: |-
        검은 유리로 만들어진 피리.
        사용한 장소에서 강한 포켓몬과
        만나기 쉬워진다.
      zh-Hant: |-
        以黑色玻璃製成的笛子。
        在使用的地方更容易
        遇到強大的寶可夢。
      zh-Hans: |-
        以黑色玻璃制成的哨子。
        在使用的地方更容易
        遇到强大的宝可梦。
      en: |-
        A flute made from black glass. It makes it easier to
        encounter strong Pokémon in the place you use it.
      fr: |-
        Un jouet en forme de flûte en verre noir.
        Augmente les chances de rencontrer des
        Pokémon sauvages forts là où l’on en joue.
      de: |-
        Eine Spielzeugflöte aus schwarzem Glas.
        Erhöht am Einsatzort die Wahrscheinlichkeit,
        starken wilden Pokémon zu begegnen.
      es: |-
        Una flauta de cristal negro cuyas notas atraen a
        Pokémon salvajes más fuertes al lugar en el que
        se usa.
      it: |-
        Flauto fatto di vetro nero. Aumenta le probabilità
        di incontrare Pokémon forti nell’area in cui viene
        usato.
