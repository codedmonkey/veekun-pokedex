normal-gem:
  category: jewels
  cost: 4000
  effect:
    en: |-
      Held
      :   When the holder uses a damaging []{type:normal}-type move, the move has 1.5× power and this item is consumed.
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        A gem with an ordinary essence. When
        held, it strengthens the power of a
        Normal-type move only once.
      fr: |-
        Objet à tenir. Joyau augmentant
        une fois la puissance des capacités
        de type Normal.
