  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        ポケモンに　かおりを　かがせると
        ぼうぎょが　あがりやすく　なるが
        すばやさは　あがりにくくなる　ミント。
      ja: |-
        ポケモンに　香りを　かがせると
        防御が　上がりやすく　なるが
        素早さは　上がりにくくなる　ミント。
      ko: |-
        포켓몬에게 향기를 맡게 하면
        방어가 오르기 쉬워지지만
        스피드가 오르기 어려워지는 민트.
      zh-Hant: |-
        讓寶可夢聞這種薄荷的氣味，
        會令防禦變得容易提高，
        但速度則難以提高。
      zh-Hans: |-
        宝可梦闻了这种薄荷之后，
        会令防御容易提高，
        而速度则难以提高。
      en: |-
        When a Pokémon smells this mint, its Defense will grow
        more easily, but its Speed will grow more slowly.
      fr: |-
        Si un Pokémon hume cet aromate, sa Défense
        montera plus facilement, mais sa Vitesse
        se développera plus lentement.
      de: |-
        Lässt man ein Pokémon an dieser Minze schnuppern,
        steigt seine Verteidigung schneller, aber seine Initiative
        umso langsamer.
      es: |-
        Cuando un Pokémon percibe su aroma, aumenta
        con más facilidad su Defensa, en detrimento de su
        Velocidad.
      it: |-
        Quando un Pokémon ne sente il profumo, la sua Difesa
        aumenta più facilmente a scapito della Velocità.
