tm14:
  category: all-machines
  cost: 1000
  effect:
    en: 'Teaches Blizzard to a compatible Pokémon.'
  flags: {  }
  flavor_text:
    ruby-sapphire:
      en: |-
        A vicious snow-and-
        wind attack that
        may freeze the foe.
    emerald:
      en: |-
        A brutal snow-and-
        wind attack that
        may freeze the foe.
    firered-leafgreen:
      en: |-
        The foe is blasted
        with a blizzard.
        It may freeze the
        foe solid.
    diamond-pearl:
      en: |-
        A howling blizzard is summoned to
        strike the foe. It may also freeze
        the target solid.
    platinum:
      en: |-
        A howling blizzard is summoned to
        strike the foe. It may also freeze
        the target solid.
    heartgold-soulsilver:
      en: |-
        A howling blizzard is summoned to
        strike the foe. It may also freeze
        the target solid.
    black-white:
      en: |-
        A howling blizzard is summoned to strike
        the opposing team. It may also freeze
        them solid.
      fr: |-
        Une violente tempête de neige est
        déclenchée sur l’ennemi. Peut aussi
        le geler.
    black-2-white-2:
      en: |-
        A howling blizzard is summoned to strike
        the opposing team. It may also freeze
        them solid.
    x-y:
      ja-Hrkt: |-
        はげしい　ふぶきを　ぶつけて
        こうげきする。　あいてを　こおりの
        じょうたいに　することが　ある。
      ja: |-
        激しい　吹雪を
        相手に　吹きつけて　攻撃する。
        こおり状態に　することが　ある。
      ko: |-
        세찬 눈보라를
        상대에게 내뿜어 공격한다.
        얼음 상태로 만들 때가 있다.
      en: |-
        A howling blizzard is summoned to strike
        opposing Pokémon. This may also leave
        the opposing Pokémon frozen.
      fr: |-
        Une violente tempête de neige est déclenchée
        sur l’ennemi. Peut aussi le geler.
      de: |-
        Eine ungnädige Eis-und-Schnee-Attacke, die
        Pokémon in der Nähe des Anwenders trifft
        und eventuell einfrieren kann.
      es: |-
        Ataca con contundentes puñetazos. Puede
        destruir barreras como Pantalla de Luz y Reflejo.
      it: |-
        Colpisce i nemici con una tremenda tempesta
        di ghiaccio che può anche congelarli.
    sun-moon:
      ja-Hrkt: |-
        はげしい　ふぶきを
        あいてに　ふきつけて　こうげきする。
        こおり　じょうたいに　することが　ある。
      ja: |-
        激しい　吹雪を
        相手に　吹きつけて　攻撃する。
        こおり状態に　することが　ある。
      ko: |-
        세찬 눈보라를
        상대에게 내뿜어 공격한다.
        얼음 상태로 만들 때가 있다.
      zh-Hant: |-
        將猛烈的暴風雪
        吹向對手進行攻擊。
        有時會讓對手陷入冰凍狀態。
      zh-Hans: |-
        将猛烈的暴风雪
        刮向对手进行攻击。
        有时会让对手陷入冰冻状态。
      en: |-
        A howling blizzard is summoned to strike opposing
        Pokémon. This may also leave the opposing
        Pokémon frozen.
      fr: |-
        Une violente tempête de neige s’abat sur l’ennemi.
        Peut aussi le geler.
      de: |-
        Eine ungnädige Eis- und Schnee-Attacke, die
        Pokémon in der Nähe des Anwenders trifft und
        eventuell einfrieren kann.
      es: |-
        Invoca una tormenta de viento y nieve que envuelve
        al objetivo y puede llegar a congelarlo.
      it: |-
        Colpisce i nemici intorno con una tremenda
        tempesta di ghiaccio che può anche congelarli.
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        はげしい　ふぶきを
        あいてに　ふきつけて　こうげきする。
        こおり　じょうたいに　することが　ある。
      ja: |-
        激しい　吹雪を
        相手に　吹きつけて　攻撃する。
        こおり状態に　することが　ある。
      ko: |-
        세찬 눈보라를
        상대에게 내뿜어 공격한다.
        얼음 상태로 만들 때가 있다.
      zh-Hant: |-
        將猛烈的暴風雪
        吹向對手進行攻擊。
        有時會讓對手陷入冰凍狀態。
      zh-Hans: |-
        将猛烈的暴风雪
        刮向对手进行攻击。
        有时会让对手陷入冰冻状态。
      en: |-
        A howling blizzard is summoned to strike opposing
        Pokémon. This may also leave the opposing
        Pokémon frozen.
      fr: |-
        Une violente tempête de neige s’abat sur l’ennemi.
        Peut aussi le geler.
      de: |-
        Eine ungnädige Eis- und Schnee-Attacke, die
        Pokémon in der Nähe des Anwenders trifft und
        eventuell einfrieren kann.
      es: |-
        Invoca una tormenta de viento y nieve que envuelve
        al objetivo y puede llegar a congelarlo.
      it: |-
        Colpisce i nemici intorno con una tremenda
        tempesta di ghiaccio che può anche congelarli.
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        １ターンめで　そらへ　とび
        ２ターンめに　あいてを　こうげきする。
      ja: |-
        １ターン目で　空へ　飛び
        ２ターン目に　相手を　攻撃する。
      ko: |-
        1턴째에 하늘을 날아
        2턴째에 상대를 공격한다.
      zh-Hant: |-
        使用後的第１回合飛上天空，
        並於第２回合攻擊對手。
      zh-Hans: |-
        第１回合飞上天空，
        第２回合攻击对手。
      en: |-
        The user flies up into the sky and then
        strikes its target on the next turn.
      fr: 'Le lanceur s’envole au premier tour et frappe au second.'
      de: |-
        Steigt in Runde 1 empor und trifft das Ziel in
        Runde 2.
      es: 'Vuela en el primer turno y ataca en el segundo.'
      it: |-
        Chi la usa si alza in volo per attaccare al turno
        seguente.
    sword-shield:
      ja-Hrkt: |-
        よわい　でんげきを　あびせる　ことで
        あいてを　まひ　じょうたいに　する。
      ja: |-
        弱い　電撃を　浴びせることで
        相手を　まひ状態に　する。
      ko: |-
        약한 전격을 날려서
        상대를 마비 상태로 만든다.
      zh-Hant: |-
        放出微弱的電流。
        讓對手陷入麻痺狀態。
      zh-Hans: |-
        向对手发出
        微弱的电击，
        从而让对手陷入麻痹状态。
      en: |-
        The user launches a weak jolt of electricity that
        paralyzes the target.
      fr: |-
        Un faible choc électrique frappe l’ennemi.
        Si l’attaque le touche, celui-ci est paralysé.
      de: 'Ein schwacher Stromstoß, der das Ziel paralysiert.'
      es: |-
        Una ligera descarga que paraliza al objetivo si lo
        alcanza.
      it: |-
        Colpisce il bersaglio con una debole scarica
        elettrica che lo paralizza.
