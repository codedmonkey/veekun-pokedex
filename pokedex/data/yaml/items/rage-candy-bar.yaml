rage-candy-bar:
  category: gameplay
  cost: 350
  effect:
    en: 'May be traded for a []{item:tm64} in the vertical Underground Path.'
  flags: {  }
  flavor_text:
    heartgold-soulsilver:
      en: |-
        A famous candy in Mahogany Town. Many
        tourists like to buy them to take home.
    black-white:
      en: |-
        A famous Mahogany Town candy tourists
        like to buy and take home. It restores
        the HP of one Pokémon by 20 points.
      fr: |-
        Un bonbon, spécialité d’Acajou.
        Il constitue un cadeau très réputé.
    black-2-white-2:
      en: |-
        A famous Mahogany Town candy tourists
        like to buy and take home. It restores
        the HP of one Pokémon by 20 points.
    x-y:
      ja-Hrkt: |
        チョウジめいぶつの　まんじゅう。
        おみやげひん　として　ゆうめい。
      ja: |-
        ジョウト地方　にある
        チョウジタウン名物の　まんじゅう。
        お土産品として　有名。
      ko: |-
        황토마을의 명물인 호두과자.
        선물로 아주 유명하다.
      en: |-
        Mahogany Town’s famous candy.
        When consumed, it restores
        20 HP to an injured Pokémon.
      fr: |-
        Un bonbon, spécialité d’Acajou.
        Il constitue un cadeau très réputé.
      de: |-
        Eine Spezialität aus Mahagonia City. Sie wird gern
        als Souvenir gekauft.
      es: |-
        Contiene los datos del Pokéathlon con el número
        de victorias en conexión.
      it: |-
        Caramella tipica di Mogania.
        Souvenir dall’ottima reputazione.
    sun-moon:
      ja-Hrkt: |-
        チョウジめいぶつの　まんじゅう。
        ポケモン　１ひきの　じょうたいの
        いじょうを　すべて　かいふくする。
      ja: |-
        チョウジタウン名物の　まんじゅう。
        ポケモン　１匹の　状態の
        異常を　すべて　回復する。
      ko: |-
        황토마을의 명물인 호두과자.
        포켓몬 1마리의 상태 이상을
        모두 회복한다.
      zh-Hant: |-
        卡吉鎮特產的饅頭。
        能治癒１隻寶可夢的
        所有異常狀態。
      zh-Hans: |-
        卡吉镇特产的馒头。
        能治愈１只宝可梦的
        所有异常状态。
      en: |-
        Mahogany Town’s famous candy. It can be used
        once to heal all the status conditions of a Pokémon.
      fr: |-
        Un bonbon, spécialité d’Acajou.
        Soigne tous les problèmes de statut d’un Pokémon.
      de: |-
        Eine Spezialität aus Mahagonia City, die alle
        Statusprobleme eines Pokémon heilt.
      es: |-
        Caramelo típico de Pueblo Caoba. Cura todos los
        problemas de estado de un Pokémon.
      it: |-
        Caramella tipica di Mogania.
        Cura tutti i problemi di stato di un Pokémon.
