        つくる。　あいてを　まどわせることで
        かいひりつを　あげる。
      ja: |-
        素早い　動きで　分身を　つくり
        相手を　まどわせて
        回避率を　あげる。
      ko: |-
        재빠른 움직임으로 분신을 만들어
