    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        きょうりょくな　ひかりを　はなち
        あいてに　ダメージを　あたえる。
      ja: |-
        強力な　光を　放ち
        相手に　ダメージを　与える。
      ko: |-
        강력한 빛을 내어
        상대에게 데미지를 준다.
      zh-Hant: |-
        發出強烈的閃光，
        給予對手傷害。
      zh-Hans: |-
        向对手发射强光，
        并给予伤害。
      en: |-
        The user damages opposing Pokémon by emitting a
        powerful flash.
      fr: |-
        Libère une puissante décharge lumineuse qui inflige
        des dégâts à l’ennemi.
      de: |-
        Der Anwender feuert einen mächtigen Lichtblitz ab,
        der dem Ziel Schaden zufügt.
      es: 'Inflige daño a los oponentes con una potente luz.'
      it: |-
        Chi la usa emette una luce potentissima che
        infligge danni ai nemici intorno.
    sword-shield:
      ja-Hrkt: |-
        ５ターンの　あいだ　すなあらしで　いわ
        じめん　はがねタイプ　いがいに　ダメージ。
        いわタイプの　とくぼうが　あがる。
      ja: |-
        ５ターンの　間　砂あらしで　いわ
        じめん　はがねタイプ　以外に　ダメージ。
        いわタイプの　特防が　あがる。
      ko: |-
        5턴 동안 모래바람을 일으켜 바위
        땅, 강철타입 이외의 상대에게 데미지를 준다.
        바위타입의 특수방어가 올라간다.
      zh-Hant: |-
        揚起沙暴，在５回合內給予
        岩石、地面和鋼屬性以外的寶可夢傷害。
        岩石屬性寶可夢的特防會提高。
      zh-Hans: |-
        在５回合内扬起沙暴，除岩石、地面和
        钢属性以外的宝可梦，都会受到伤害。
        岩石属性的特防还会提高。
      en: |-
        A five-turn sandstorm is summoned to hurt all
        combatants except Rock, Ground, and Steel types.
        It raises the Sp. Def stat of Rock types.
      fr: |-
        Une tempête de sable blesse tous les Pokémon pendant
        cinq tours, sauf ceux de type Roche, Sol ou Acier.
        Augmente la Défense Spéciale des Pokémon Roche.
      de: |-
        Sandsturm für fünf Runden. Schadet Pokémon aller
        Typen außer Gestein, Boden und Stahl. Erhöht die
        Spezial-Verteidigung von Gesteins-Pokémon.
      es: |-
        Tormenta de arena que dura cinco turnos y hiere a
        todos, excepto a los de tipo Roca, Tierra y Acero,
        y aumenta la Defensa Especial de los de tipo Roca.
      it: |-
        Causa una tempesta di sabbia per cinque turni che
        danneggia tutti i tipi esclusi Terra, Roccia e Acciaio.
        Aumenta la Dif. Speciale dei Pokémon di tipo Roccia.
