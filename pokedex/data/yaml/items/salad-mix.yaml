  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        キャンプの　りょうりに　つかう
        しょくざいの　いっしゅ。いろんな　やさいの
        つめあわせで　けんこうに　よさそう。
      ja: |-
        キャンプの　料理に　使う
        食材の　一種。いろんな　野菜の
        詰めあわせで　健康に　よさそう。
      ko: |-
        캠프 요리에 사용되는
        식재료 중 하나. 다양한 채소가
        들어 있어 건강에 좋아 보인다.
      zh-Hant: |-
        製作露營料理時使用的食材之一。
        裡面裝著什錦蔬菜，
        看起來十分有益健康。
      zh-Hans: |-
        在露营营地制作料理时会使用的
        一种食材。将各种蔬菜搭配到一起，
        看上去就非常有益健康。
      en: |-
        One of the many ingredients that can be used for
        cooking at your camp. The assortment of vegetables
        looks quite appealing and healthy.
      fr: |-
        Un ingrédient de cuisine pour le camping.
        Cet assortiment de légumes divers permet de préparer
        des plats équilibrés.
      de: |-
        Eine Zutat für PokéCamping-Mahlzeiten. Diese bunte
        Mischung aus verschiedenen Gemüsesorten sorgt für
        eine ausgewogene und gesunde Ernährung.
      es: |-
        Un ingrediente para cocinar en el campamento. Una
        mezcla muy sana de varios tipos de verduras.
      it: |-
        Uno degli ingredienti che puoi usare per cucinare
        in campeggio. Un assortimento di ortaggi dall’aria
        molto salutare.
