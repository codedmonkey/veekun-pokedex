dawn-stone:
  category: evolution
  cost: 3000
  effect:
    en: |-
      Used on a party Pokémon
      :   Evolves a male []{pokemon:kirlia} into []{pokemon:gallade} or a female []{pokemon:snorunt} into []{pokemon:froslass}.
  flags: {  }
