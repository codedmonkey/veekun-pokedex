liechi-berry:
  category: in-a-pinch
  cost: 80
  effect:
    en: |-
      Held in battle
      :   When the holder has 1/4 its max [HP]{mechanic:hp} remaining or less, it consumes this item to [raise]{mechanic:raise} its [Attack]{mechanic:attack} by one stage.
  flags:
    - holdable-active
  flavor_text:
    ruby-sapphire:
      en: |-
        A hold item that
        raises ATTACK in
        a pinch.
    emerald:
      en: |-
        A hold item that
        raises ATTACK in
        a pinch.
    firered-leafgreen:
      en: |-
        When held by a POKéMON, it raises
        the ATTACK stat in a pinch.
    diamond-pearl:
      en: |-
        A Poffin ingredient.
        If held by a Pokémon, it raises its
        Attack stat in a pinch.
    platinum:
      en: |-
        A Poffin ingredient.
        If held by a Pokémon, it raises its
        Attack stat in a pinch.
    heartgold-soulsilver:
      en: |-
        If held by a Pokémon, it raises its
        Attack stat in a pinch.
    black-white:
      en: |-
        If held by a Pokémon, it raises its
        Attack stat in a pinch.
      fr: |-
        Tenue, cette Baie monte l’Attaque
        en cas de besoin.
    black-2-white-2:
      en: |-
        If held by a Pokémon, it raises its
        Attack stat in a pinch.
    x-y:
      ja-Hrkt: |-
        ポケモンに　もたせると
        ピンチのとき　じぶんの
        こうげきが　あがる。
      ja: |-
        ポケモンに　持たせると
        ピンチのとき　自分の
        攻撃が　あがる。
      ko: |-
        포켓몬에게 지니게 하면
        위급할 때 자신의
        공격이 올라간다.
      en: |-
        A Berry to be consumed by Pokémon.
        If a Pokémon holds one, its Attack
        stat will increase when it’s in a pinch.
      fr: |-
        Tenue, cette Baie augmente l’Attaque en cas
        de besoin.
      de: |-
        Als getragenes Item erhöht diese Beere den
        Angriffs-Wert eines Pokémon, sobald es in
        einer Notlage steckt.
      es: |-
        Una campana con un tañido calmante que
        reconforta al Pokémon que la lleva y lo vuelve
        más amistoso.
      it: |-
        Se il Pokémon che ha questa bacca si trova
        in difficoltà, il suo Attacco aumenta.
