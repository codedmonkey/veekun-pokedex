ice-gem:
  category: jewels
  cost: 200
  effect:
    en: |-
      Held
      :   When the holder uses a damaging []{type:ice}-type move, the move has 1.5× power and this item is consumed.
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        A gem with an essence of ice. When held,
        it strengthens the power of an
        Ice-type move only once.
      fr: |-
        Objet à tenir. Joyau augmentant
        une fois la puissance des capacités
        de type Glace.
    black-2-white-2:
      en: |-
        A gem with an essence of ice. When held,
        it strengthens the power of an
        Ice-type move only once.
    x-y:
      ja-Hrkt: |-
        こおりの　タイプの　ジュエル。
        もたせると　いちどだけ　こおりの
        わざの　いりょくが　つよまる。
      ja: |-
        こおりの　タイプの　ジュエル。
        持たせると　１度だけ　こおりの
        技の　威力が　強まる。
      ko: |-
        얼음타입의 주얼.
        지니게 하면 한 번만 얼음
        기술의 위력이 강해진다.
      en: |-
        A gem with an essence of ice.
        When held, it strengthens the power
        of an Ice-type move one time.
      fr: |-
        Objet à tenir. Un joyau augmentant une fois
        la puissance des capacités de type Glace.
      de: |-
        Ein Juwel vom Typ Eis. Es erhöht einmalig
        die Stärke einer Attacke vom Typ Eis.
      es: |-
        Pluma normal y corriente. Muy bonita, pero no
        sirve para nada.
      it: |-
        Strumento da dare a un Pokémon.
        Gioiello che potenzia una sola volta le mosse
        di tipo Ghiaccio.
