        プリントされた　びんせん。
        ポケモンに　もたせて　つかう。
      ja: |-
        アーチを　描いた　橋の　絵柄が
        プリントされた　レターペーパー。
        ポケモンに　持たせて　使う。
      ko: |-
        아치가 그려진 다리의 무늬가
        프린트된 편지지.
        포켓몬에게 지니게 해서 쓴다.
