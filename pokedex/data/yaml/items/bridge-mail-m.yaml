        par un Pokémon.
      de: |-
        Das Briefpapier hat eine geschwungene Brücke
        als Hintergrundmotiv. Gib es einem Pokémon zum
        Tragen.
      es: 'Una baya muy rara en la región de Teselia.'
      it: |-
