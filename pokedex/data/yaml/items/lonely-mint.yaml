  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        ポケモンに　かおりを　かがせると
        こうげきが　あがりやすく　なるが
        ぼうぎょは　あがりにくくなる　ミント。
      ja: |-
        ポケモンに　香りを　かがせると
        攻撃が　上がりやすく　なるが
        防御は　上がりにくくなる　ミント。
      ko: |-
        포켓몬에게 향기를 맡게 하면
        공격이 오르기 쉬워지지만
        방어가 오르기 어려워지는 민트.
      zh-Hant: |-
        讓寶可夢聞這種薄荷的氣味，
        會令攻擊變得容易提高，
        但防禦則難以提高。
      zh-Hans: |-
        宝可梦闻了这种薄荷之后，
        攻击会易于提高，
        而防御则难以提高。
      en: |-
        When a Pokémon smells this mint, its Attack will grow
        more easily, but its Defense will grow more slowly.
      fr: |-
        Si un Pokémon hume cet aromate, son Attaque
        montera plus facilement, mais sa Défense
        se développera plus lentement.
      de: |-
        Lässt man ein Pokémon an dieser Minze schnuppern,
        steigt sein Angriff schneller, aber seine Verteidigung
        umso langsamer.
      es: |-
        Cuando un Pokémon percibe su aroma, aumenta con
        más facilidad su Ataque, en detrimento de su Defensa.
      it: |-
        Quando un Pokémon ne sente il profumo, il suo Attacco
        aumenta più facilmente a scapito della sua Difesa.
