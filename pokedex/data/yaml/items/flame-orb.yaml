        さわると　ねつをだす　ふしぎなたま。
        もたせると　せんとうちゅうに
        やけどの　じょうたいに　なる。
      ja: |-
        触ると　熱をだす　不思議な玉。
        持たせると　戦闘中に
        やけどの　状態に　なる。
      ko: |-
        만지면 열을 내는 이상한 구슬.
        지니게 하면 배틀 중에
        화상 상태가 된다.
      en: |-
        An item to be held by a Pokémon.
        It is a bizarre orb that will afflict the
        holder with a burn during battle.
      fr: |-
