        durant le combat.
      de: |-
        Ein Item zum Tragen. Dieser bizarre Orb fügt
        seinem Träger Verbrennungen zu.
      es: |-
        Potencia la Defensa de base, pero reduce la
        Velocidad en combate. Debe llevarlo un
        Pokémon.
      it: |-
        Strumento da dare a un Pokémon.
        Sfera bizzarra che procura una scottatura
        a chi l’ha con sé in una lotta.
