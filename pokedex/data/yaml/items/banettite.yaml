banettite:
  category: mega-stones
  cost: 0
  effect:
    en: 'Held: Allows Banette to Mega Evolve into Mega Banette.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        ジュペッタに　もたせておくと
        たたかいのとき　メガシンカが　できる
        ふしぎな　メガストーンの　いっしゅ。
      ja: |-
        ジュペッタに　持たせておくと
        戦いのとき　メガシンカが　できる
        不思議な　メガストーンの　一種。
      ko: |-
        다크펫에게 지니게 하면
        배틀할 때 메가진화할 수 있는
        신비한 메가스톤의 일종.
      en: |-
        One variety of the mysterious Mega Stones.
        Have Banette hold it, and this stone will
        enable it to Mega Evolve during battle.
      fr: |-
        Une variété de Méga-Gemme.
        Tenue par un Branette, elle lui permet de
        méga-évoluer durant un combat.
      de: |-
        Einer der mysteriösen Mega-Steine. Wird er von
        einem Banette getragen, kann es im Kampf eine
        Mega-Entwicklung durchführen.
      es: |-
        Si la lleva un Pokémon, aumenta su Defensa
        tras recibir un ataque físico.
      it: |-
        Un esemplare delle misteriose Megapietre.
        Data a Banette, gli permette di megaevolversi
        durante la lotta.
