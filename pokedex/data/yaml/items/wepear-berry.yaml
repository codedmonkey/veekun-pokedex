wepear-berry:
  category: baking-only
  cost: 20
  effect:
    en: 'No effect; only useful for planting and cooking.'
  flags: {  }
  flavor_text:
    ruby-sapphire:
      en: |-
        POKéBLOCK ingredient.
        Plant in loamy soil
        to grow WEPEAR.
    emerald:
      en: |-
        POKéBLOCK ingredient.
        Plant in loamy soil
        to grow WEPEAR.
    firered-leafgreen:
      en: |-
        Can be ground up into a powder as
        an ingredient for medicine.
    diamond-pearl:
      en: |-
        A Poffin ingredient.
        Bury it in soft soil to grow a
        Wepear Plant.
    platinum:
      en: |-
        A Poffin ingredient.
        Bury it in soft soil to grow a
        Wepear Plant.
    heartgold-soulsilver:
      en: |-
        In the Sinnoh region, they like to make
        sweets known as Poffins with this Berry
        and feed them to their Pokémon.
    black-white:
      en: |-
        A Berry which is very rare in the
        Unova region.
        A maniac will buy it for a high price.
      fr: |-
        Baie très rare à Unys.
        Les amateurs en donnent un bon prix.
    black-2-white-2:
      en: |-
        A Berry which is very rare in the
        Unova region.
        A maniac will buy it for a high price.
    x-y:
      ja-Hrkt: |-
        イッシュちほうでは　とても
        めずらしい　きのみ。
      ja: |-
        イッシュ地方では　とても
        珍しい　きのみ。
      ko: |-
        하나지방에서는 매우
        희귀한 나무열매.
      en: |-
        A Berry to be used in cooking.
        This Berry is very rare and hard
        to obtain in the Unova region.
      fr: 'Une Baie très rare à Unys.'
      de: |-
        Eine Beerensorte, die in der Einall-Region
        ganz besonders selten ist.
      es: |-
        Si la lleva un Pokémon, debilita un ataque
        supereficaz de tipo Fuego de un enemigo.
      it: 'Bacca molto rara a Unima.'
    sun-moon:
      ja-Hrkt: |-
        かしこさに　みがきを　かける　ための
        ポロックを　つくるとき　つかわれる。
        みどりいろの　みは　たべると　にがい。
      ja: |-
        かしこさに　磨きを　かける　ための
        ポロックを　つくるとき　使われる。
        緑色の実は　食べると　苦い。
      ko: |-
        슬기로움을 연마하기 위한
        포켓몬스넥을 만들 때 사용된다.
        초록색 열매는 먹으면 쓰다.
      zh-Hant: |-
        製作用於增進聰明的
        寶可方塊時使用。
        綠色的果實嘗起來是苦的。
      zh-Hans: |-
        用于制作宝可方块，
        制作出来的宝可方块可用来打磨聪明。
        绿色的果实尝起来是苦的。
      en: |-
        Used to make Pokéblocks that will enhance your
        Cleverness. Its green flesh is bitter when eaten.
      fr: |-
        Une Baie verte au goût amer, utilisée pour
        préparer des Pokéblocs permettant d’augmenter
        l’Intelligence d’un Pokémon.
      de: |-
        Eine Beerensorte, die als Zutat für Pokériegel
        verwendet wird, welche die Klugheit erhöhen.
        Ihr grünes Fruchtfleisch schmeckt bitter.
      es: |-
        Se utiliza en la producción de Pokécubos que
        potencian el ingenio. Es de color verde y sabor
        amargo.
      it: |-
        Bacca verde dal sapore amaro usata per creare
        Pokémelle che aumentano l’Acume del Pokémon.
