      de: |-
        Der Anwender schwingt heftig seinen robusten Schweif,
        um damit gegnerische Pokémon anzugreifen und ihren
        Angriffs-Wert zu senken.
      es: |-
        El usuario sacude violentamente su enorme cola para
        golpear a todos los rivales y reducir su Ataque a la par.
      it: |-
        Chi la usa attacca i nemici intorno con la sua robusta
        coda riducendone l’Attacco.
