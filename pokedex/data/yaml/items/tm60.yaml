      zh-Hans: |-
        利用超能力互换
        自己和对手的攻击
        以及特攻的能力变化。
      en: |-
        The user employs its psychic power to switch
        changes to its Attack and Sp. Atk stats with
        the target.
      fr: |-
        Pouvoir qui échange les modifications de l’Attaque
        Spéciale et de l’Attaque du lanceur avec la cible.
      de: |-
        Psychische Kräfte tauschen Änderungen an Angriff
        und Spezial-Angriff mit denen des Zieles.
      es: |-
        El usuario emplea su poder mental para intercambiar los
        cambios en el Ataque y Ataque Especial con el objetivo.
      it: |-
        Chi la usa sfrutta la sua forza psichica per scambiare
        le modifiche ad Attacco e Attacco Speciale
        con il bersaglio.
