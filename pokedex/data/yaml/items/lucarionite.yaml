lucarionite:
  category: mega-stones
  cost: 0
  effect:
    en: 'Held: Allows Lucario to Mega Evolve into Mega Lucario.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        ルカリオに　もたせておくと
        たたかいのとき　メガシンカが　できる
        ふしぎな　メガストーンの　いっしゅ。
      ja: |-
        ルカリオに　持たせておくと
        戦いのとき　メガシンカが　できる
        不思議な　メガストーンの　一種。
      ko: |-
        루카리오에게 지니게 하면
        배틀할 때 메가진화할 수 있는
        신비한 메가스톤의 일종.
      en: |-
        One variety of the mysterious Mega Stones.
        Have Lucario hold it, and this stone will
        enable it to Mega Evolve during battle.
      fr: |-
        Une variété de Méga-Gemme.
        Tenue par un Lucario, elle lui permet de
        méga-évoluer durant un combat.
      de: |-
        Einer der mysteriösen Mega-Steine. Wird er von
        einem Lucario getragen, kann es im Kampf eine
        Mega-Entwicklung durchführen.
      es: |-
        Cada vez que golpea a un oponente se
        endurecen sus puños. Si acierta al objetivo,
        el Ataque del usuario aumenta.
      it: |-
        Un esemplare delle misteriose Megapietre.
        Data a Lucario, gli permette di megaevolversi
        durante la lotta.
