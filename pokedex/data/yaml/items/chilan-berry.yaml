chilan-berry:
  category: type-protection
  cost: 80
  effect:
    en: |-
      Held in battle
      :   When the holder would take []{type:normal}-type damage, it consumes this item to halve the amount of damage taken.
  flags:
    - holdable-active
  flavor_text:
    diamond-pearl:
      en: |-
        A Poffin ingredient. If held by a
        Pokémon, it weakens a foe’s
        Normal-type attack.
    platinum:
      en: |-
        A Poffin ingredient. If held by a
        Pokémon, it weakens a foe’s
        Normal-type attack.
    heartgold-soulsilver:
      en: |-
        If held by a Pokémon, it weakens a foe’s
        Normal-type attack.
    black-white:
      en: |-
        Weakens a Normal-type attack against
        the Pokémon holding this berry.
      fr: |-
        Tenue, cette Baie affaiblit une attaque
        ennemie de type Normal.
    black-2-white-2:
      en: |-
        Weakens a Normal-type attack against
        the Pokémon holding this berry.
    x-y:
      ja-Hrkt: |-
        ポケモンに　もたせると
        ノーマル　わざを　うけたとき
        いりょくが　よわまる。
      ja: |-
        ポケモンに　持たせると
        ノーマル技を　受けたとき
        威力が　弱まる。
      ko: |-
        포켓몬에게 지니게 하면
        노말 기술을 당했을 때
        위력이 약해진다.
      en: |-
        If held by a Pokémon, this Berry
        will lessen the damage taken
        from one Normal-type attack.
      fr: |-
        Tenue, cette Baie affaiblit une attaque ennemie
        de type Normal.
      de: |-
        Als getragenes Item schwächt diese Beere
        Attacken des Angreifers vom Typ Normal.
      es: |-
        Garra ligera y afilada que permite que el Pokémon
        que la lleve ataque a veces el primero.
      it: |-
        Se un Pokémon ha questa bacca, l’attacco
        di tipo Normale del nemico viene indebolito.
