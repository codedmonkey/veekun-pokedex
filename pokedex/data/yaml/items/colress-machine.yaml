colress-machine:
  category: plot-advancement
  cost: 0
  effect:
    en: ''
  flags: {  }
  flavor_text:
    black-2-white-2:
      en: |-
        A special device that wrings out
        the potential of Pokémon.
        It is an imperfect prototype.
    x-y:
      ja-Hrkt: |-
        ポケモンの　のうりょくを　むりやり
        めざめさせる　とくしゅな　そうち。
        だが　しさくひんのため　ふかんぜん。
      ja: |-
        ポケモンの　能力を　無理やり
        目覚めさせる　特殊な　装置。
        だが　試作品のため　不完全。
      ko: |-
        포켓몬의 능력을 강제로
        눈뜨게 만드는 특수 장치.
        그러나 시작품이기에 불완전하다.
      en: |-
        A special device that wrings out
        the potential of Pokémon.
        It is an imperfect prototype.
      fr: |-
        Un appareil spécial qui permet d’éveiller de force
        la puissance des Pokémon. Mais il ne s’agit que
        d’un prototype.
      de: |-
        Eine Vorrichtung, die verborgene Kräfte in den
        Pokémon weckt. Es handelt sich dabei um einen
        unfertigen Prototyp.
      es: |-
        Al usarse en un huerto de bayas, aumenta la
        cosecha obtenida si se riega con frecuencia.
      it: |-
        Prototipo imperfetto di un dispositivo speciale
        ideato per risvegliare in modo forzato le capacità
        dei Pokémon.
