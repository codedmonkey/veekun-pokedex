jaw-fossil:
  category: dex-completion
  cost: 7000
  effect:
    en: 'Can be revived into a Tyrunt.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        おおむかし　ちじょうで　くらした
        こだい　ポケモンの　カセキ。
        おおきな　アゴの　いちぶ　らしい。
      ja: |-
        大昔　地上で　暮らした
        古代ポケモンの　カセキ。
        大きな　アゴの　一部らしい。
      ko: |-
        오랜 옛날 지상에서 살았던
        고대 포켓몬의 화석.
        커다란 턱의 일부인 듯하다.
      en: |-
        A fossil from a prehistoric Pokémon
        that once lived on the land. It looks as
        if it could be a piece of a large jaw.
      fr: |-
        Le fossile d’un Pokémon préhistorique terrestre.
        On dirait un fragment de mâchoire.
      de: |-
        Das Fossil eines uralten Pokémon, das an Land
        lebte. Es sieht wie ein Kieferknochen aus.
      es: ''
      it: |-
        Fossile di un Pokémon preistorico che viveva
        sulla terraferma. Sembra far parte di una grossa
        mascella.
