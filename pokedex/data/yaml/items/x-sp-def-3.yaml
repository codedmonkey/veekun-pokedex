x-sp-def-3:
  category: miracle-shooter
  cost: 0
  effect:
    en: |-
      Used on a party Pokémon in battle
      :   Raises the target's [Special Defense]{mechanic:special-defense} by three [stages]{mechanic:stage}.
      This item can only be obtained or used via the Wonder Launcher.
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        It drastically raises the Sp. Def stat
        of a Pokémon in battle. It wears off if
        the Pokémon is withdrawn.
      fr: |-
        Monte sensiblement la Déf. Spé.
        pendant un combat. L’effet s’estompe
        si le Pokémon se retire.
    black-2-white-2:
      en: |-
        It drastically raises the Sp. Def stat
        of a Pokémon in battle. It wears off if
        the Pokémon is withdrawn.
    x-y:
      ja-Hrkt: |-
        せんとうちゅうの　ポケモンの
        とくぼうを　かなり　あげる。
        ひっこめると　もとに　もどる。
      ja: |-
        戦闘中の　ポケモンの
        特防を　かなり　あげる。
        ひっこめると　元に　戻る。
      ko: |-
        배틀 중인 포켓몬의 특수방어를
        상당히 올린다. 포켓몬을 볼에
        넣어버리면 원래대로 되돌아간다.
      en: |-
        It drastically raises the Sp. Def stat
        of a Pokémon in battle. It wears off if
        the Pokémon is withdrawn.
      fr: |-
        Augmente sensiblement la Défense Spéciale
        pendant un combat. L’effet s’estompe si
        le Pokémon se retire.
      de: |-
        Hebt den Spezial-Verteidigungs-Wert eines
        Pokémon im Kampf stark an. Die Wirkung endet
        mit dem Austausch des Pokémon.
      es: |-
        Ataca con un chillido desagradable que baja el
        Ataque Especial del rival.
      it: |-
        Aumenta moltissimo la Difesa Speciale di un
        Pokémon in una lotta. L’effetto svanisce se il
        Pokémon è sostituito.
