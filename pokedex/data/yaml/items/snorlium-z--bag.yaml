  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        カビゴンの　ギガインパクトを
        とくべつな　Ｚワザに　グレードアップする
        Ｚパワーの　けっしょうを　つくりだす。
      ja: |-
        カビゴンの　ギガインパクトを
        特別な　Ｚワザに　グレードアップする
        Ｚパワーの　結晶を　作りだす。
      ko: |-
        잠만보의 기가임팩트를
        특별한 Z기술로 업그레이드하는
        Z파워의 결정을 만들어 낸다.
      zh-Hant: |-
        會製造出把卡比獸的終極衝擊
        升級為特殊Ｚ招式的Ｚ力量結晶。
      zh-Hans: |-
        可用它来制造用于对战
        并能将卡比兽的终极冲击
        升级成特殊Ｚ招式的Ｚ力量结晶。
      en: |-
        It converts Z-Power into crystals that upgrade
        Snorlax’s Giga Impact to an exclusive Z-Move.
      fr: |-
        Permet de concentrer la Force Z en un cristal,
        qui autorise le Ronflex qui le tient à transformer
        son Giga Impact en capacité Z.
      de: |-
        Kristallisierte Z-Kraft, die Relaxos Attacke
        Gigastoß zu einer Z-Attacke aufstuft.
        Wird bei Bedarf automatisch vervielfacht.
      es: |-
        Concentra el Poder Z en cristales que permiten a
        Snorlax convertir su Giga Impacto en un
        movimiento Z.
      it: |-
        Permette di creare cristalli carichi di Potere Z che
        consentono a Snorlax di trasformare la mossa
        Gigaimpatto in una mossa Z.
