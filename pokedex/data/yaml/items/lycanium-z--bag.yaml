  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        ルガルガンの　ストーンエッジを
        Ｚワザに　グレードアップする
        Ｚパワーの　けっしょうを　つくりだす。
      ja: |-
        ルガルガンの　ストーンエッジを
        Ｚワザに　グレードアップする
        Ｚパワーの　結晶を　つくりだす。
      ko: |-
        루가루암의 스톤에지를
        Z기술로 업그레이드하는
        Z파워의 결정을 만들어 낸다.
      zh-Hant: |-
        可用來製造將
        鬃岩狼人的尖石攻擊
        升級為Ｚ招式的Ｚ力量結晶。
      zh-Hans: |-
        可用它来制造用于对战
        并能将鬃岩狼人的尖石攻击
        升级成Ｚ招式的Ｚ力量结晶。
      en: |-
        It converts Z-Power into crystals that upgrade
        Lycanroc’s Stone Edge to an exclusive Z-Move.
      fr: |-
        Permet de concentrer la Force Z en un cristal,
        qui autorise le Lougaroc qui le tient à transformer
        sa capacité Lame de Roc en capacité Z.
      de: |-
        Kristallisierte Z-Kraft, die Wolwerocks Attacke
        Steinkante zu einer Z-Attacke aufstuft.
        Wird bei Bedarf automatisch vervielfacht.
      es: |-
        Concentra el Poder Z en cristales que permiten a
        Lycanroc convertir su Roca Afilada en un
        movimiento Z.
      it: |-
        Permette di creare cristalli carichi di Potere Z che
        consentono a Lycanroc di trasformare la mossa
        Pietrataglio in una mossa Z.
