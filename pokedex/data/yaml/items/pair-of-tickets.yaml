  cost: 0
  effect:
    en: 'Allows the player and their mother to see the star show in the Mossdeep Space Center.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        トクサネうちゅうセンターで
        ひらかれている　てんたいショーの
        ふたりぐみ　チケット。
      ja: |-
        トクサネ宇宙センターで　開かれている
        天体ショーの　２人組チケット。
      ko: |-
        이끼 우주센터에서
        열리고 있는 천체쇼의
        2인용 티켓이다.
      zh-Hant: |-
        在綠嶺宇宙中心舉辦的
        天體展覽的雙人票。
      zh-Hans: |-
        在绿岭宇宙中心举办的
        天体展览的双人票。
      en: |-
        Tickets for two to the astronomical show being
        held at the Mossdeep Space Center.
      fr: |-
        Un ticket pour deux personnes pour le spectacle
        d’astronomie se déroulant au Centre Spatial
        d’Algatia.
      de: |-
        Eine Eintrittskarte, mit der zwei Personen Zutritt
        zur Astronomie-Show des Raumfahrtzentrums
        von Moosbach City erhalten.
      es: |-
        Pase de dos personas para asistir al espectáculo
        de astronomía que se celebra en el Centro
        Espacial de Algaria.
      it: |-
        Biglietto per due persone per lo spettacolo
        astronomico del Centro Spaziale di Verdeazzupoli.
