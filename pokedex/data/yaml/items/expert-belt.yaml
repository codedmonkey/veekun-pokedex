    x-y:
      ja-Hrkt: |-
        つかいこまれた　くろい　おび。
        もたせると　こうかばつぐんの　とき
        わざの　いりょくが　すこし　あがる。
      ja: |-
        使いこまれた　黒い　帯。
        持たせると　効果バツグンの　とき
        技の　威力が　少し　あがる。
      ko: |-
        오래 사용한 까만 띠.
