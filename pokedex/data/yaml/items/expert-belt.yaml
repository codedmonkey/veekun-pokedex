      fr: |-
        Objet à tenir. Une ceinture usée augmentant
        légèrement la puissance des capacités super
        efficaces.
      de: |-
        Ein Item zum Tragen. Dieser alte Gürtel verstärkt
        sehr effektive Attacken.
      es: |-
        Prolonga la duración del movimiento Danza Lluvia
        que use el Pokémon que la lleva.
      it: |-
        Strumento da dare a un Pokémon.
        Cintura consumata che potenzia di poco
        le mosse superefficaci.
