    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        おおきな　なみで　じぶんの
        まわりに　いるものを　こうげきする。
      ja: |-
        大きな　波で　自分の
        周りに　いるものを　攻撃する。
      ko: |-
        큰 파도로 자신의
        주위에 있는 포켓몬을 공격한다.
      zh-Hant: |-
        使用大浪
        攻擊自己周圍所有的寶可夢。
      zh-Hans: |-
        利用大浪
        攻击自己周围所有的宝可梦。
      en: |-
        The user attacks everything around it by swamping
        its surroundings with a giant wave.
      fr: |-
        Une énorme vague s’abat sur le champ de bataille
        et inflige des dégâts à tous les Pokémon autour
        du lanceur.
      de: |-
        Anwender greift mit einer gewaltigen Welle
        alle Pokémon in seiner Umgebung an.
      es: 'Inunda el terreno de combate con una ola gigante.'
      it: |-
        Un’onda enorme sommerge il campo di lotta,
        colpendo tutti i Pokémon intorno a chi la scatena.
    sword-shield:
      ja-Hrkt: |-
        ないた　ふりをして　なみだを　ながす。
        こまらせる　ことで
        あいての　とくぼうを　がくっと　さげる。
      ja: |-
        ないた　ふりをして　涙を　流す。
        こまらせる　ことで
        相手の　特防を　がくっと　さげる。
      ko: |-
        우는 척을 하며 눈물을 흘린다.
        난처하게 만들어
        상대의 특수방어를 크게 떨어뜨린다.
      zh-Hant: |-
        裝哭掉眼淚。
        讓對手不知所措，
        大幅降低對手的特防。
      zh-Hans: |-
        装哭流泪。
        使对手不知所措，
        从而大幅降低对手的特防。
      en: |-
        The user feigns crying to fluster the target, harshly
        lowering its Sp. Def stat.
      fr: |-
        Le lanceur fait semblant de pleurer pour troubler
        l’ennemi et beaucoup baisser sa Défense Spéciale.
      de: |-
        Täuscht Weinen vor, um die Spezial-Verteidigung des
        Zieles stark zu senken.
      es: |-
        Lágrimas de cocodrilo que bajan mucho la Defensa
        Especial del objetivo.
      it: |-
        Chi la usa inscena un pianto teatrale per commuovere
        il bersaglio. Ne riduce di molto la Difesa Speciale.
