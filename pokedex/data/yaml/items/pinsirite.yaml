pinsirite:
  category: mega-stones
  cost: 0
  effect:
    en: 'Held: Allows Pinsir to Mega Evolve into Mega Pinsir.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        カイロスに　もたせておくと
        たたかいのとき　メガシンカが　できる
        ふしぎな　メガストーンの　いっしゅ。
      ja: |-
        カイロスに　持たせておくと
        戦いのとき　メガシンカが　できる
        不思議な　メガストーンの　一種。
      ko: |-
        쁘사이저에게 지니게 하면
        배틀할 때 메가진화할 수 있는
        신비한 메가스톤의 일종.
      en: |-
        One variety of the mysterious Mega Stones.
        Have Pinsir hold it, and this stone will
        enable it to Mega Evolve during battle.
      fr: |-
        Une variété de Méga-Gemme.
        Tenue par un Scarabrute, elle lui permet de
        méga-évoluer durant un combat.
      de: |-
        Einer der mysteriösen Mega-Steine. Wird er von
        einem Pinsir getragen, kann es im Kampf eine
        Mega-Entwicklung durchführen.
      es: |-
        Usa el poder de la naturaleza para atacar.
        Su efecto varía según el entorno de combate.
      it: |-
        Un esemplare delle misteriose Megapietre.
        Data a Pinsir, gli permette di megaevolversi
        durante la lotta.
