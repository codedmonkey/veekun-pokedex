  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        キャンプの　りょうりに　つかう
        しょくざいの　いっしゅ。たった　ひとつの
        ゆでタマゴが　クオリティを　あげてくれる。
      ja: |-
        キャンプの　料理に　使う
        食材の　一種。たった　一つの
        ゆでタマゴが　クオリティを　あげてくれる。
      ko: |-
        캠프 요리에 사용되는
        식재료 중 하나. 단 하나의 삶은알이
        요리의 퀄리티를 높여준다.
      zh-Hant: |-
        製作露營料理時使用的食材之一。
        只需一顆水煮蛋就能讓
        整道料理的水準向上提升。
      zh-Hans: |-
        在露营营地制作料理时会使用的
        一种食材。只需一个水煮蛋，
        整道料理的水准都能得到升华。
      en: |-
        One of the many ingredients that can be used for
        cooking at your camp. Even just one boiled egg can
        really enhance a dish.
      fr: |-
        Un ingrédient de cuisine pour le camping.
        Le simple ajout d’un œuf donne une touche
        de prestige à tous les plats.
      de: |-
        Eine Zutat für PokéCamping-Mahlzeiten. Ein einzelnes
        gekochtes Ei reicht aus, um die Qualität einer Speise
        deutlich anzuheben.
      es: |-
        Un ingrediente para cocinar en el campamento. Con tan
        solo uno de estos huevos se consigue un plato gourmet.
      it: |-
        Uno degli ingredienti che puoi usare per cucinare
        in campeggio. Basta una di queste Uova sode
        per creare un piatto d’alta qualità.
