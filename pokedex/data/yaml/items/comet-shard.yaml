comet-shard:
  category: loot
  cost: 25000
  effect:
    en: 'Cult vendor trash.'
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        A shard which fell to the ground when
        a comet approached.
        A maniac will buy it for a high price.
      fr: |-
        Un fragment de comète, tombé au sol
        quand elle traversait l’atmosphère.
        Les amateurs en donnent un bon prix.
    black-2-white-2:
      en: |-
        A shard which fell to the ground when
        a comet approached.
        A maniac will buy it for a high price.
    x-y:
      ja-Hrkt: |-
        すいせいが　ちかづいたとき
        ちひょうに　おちた　かけら。
        ショップで　たかく　うれる。
      ja: |-
        すい星が　近づいたとき
        地表に　落ちた　かけら。
        ショップで　高く　売れる。
      ko: |-
        혜성이 가까워졌을 때
        지표면에 떨어진 조각.
        상점에서 비싸게 팔린다.
      en: |-
        A shard that fell to the ground
        when a comet approached. It can
        be sold at a high price to shops.
      fr: |-
        Un fragment de comète, tombé au sol quand elle
        traversait l’atmosphère. Peut être vendu à bon
        prix aux magasins.
      de: |-
        Ein Kometensplitter, der aus dem All
        herabgefallen ist. Er ist von großem Wert.
      es: |-
        Aumenta bastante la Defensa en combate.
        Al cambiar de Pokémon, el efecto desaparece.
      it: |-
        Scheggia di cometa caduta al suolo. Si può
        vendere a un prezzo piuttosto alto nei negozi.
