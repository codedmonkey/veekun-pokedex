decidium-z--bag:
  category: unused
  cost: 0
  effect:
    en: 'XXX new effect for decidium-z--bag'
  flags: {  }
  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        ジュナイパーの　かげぬいを
        とくべつな　Ｚワザに　グレードアップする
        Ｚパワーの　けっしょうを　つくりだす。
      ja: |-
        ジュナイパーの　かげぬいを
        特別な　Ｚワザに　グレードアップする
        Ｚパワーの　結晶を　作りだす。
      ko: |-
        모크나이퍼의 그림자꿰매기를
        특별한 Z기술로 업그레이드하는
        Z파워의 결정을 만들어 낸다.
      zh-Hant: |-
        會製造出把狙射樹梟的縫影
        升級為特殊Ｚ招式的Ｚ力量結晶。
      zh-Hans: |-
        可用它来制造用于对战
        并能将狙射树枭的缝影
        升级成特殊Ｚ招式的Ｚ力量结晶。
      en: |-
        It converts Z-Power into crystals that upgrade
        Decidueye’s Spirit Shackle to an exclusive Z-Move.
      fr: |-
        Permet de concentrer la Force Z en un cristal,
        qui autorise l’Archéduc qui le tient à transformer
        son Tisse Ombre en capacité Z.
      de: |-
        Kristallisierte Z-Kraft, die Silvarros Attacke
        Schattenfessel zu einer Z-Attacke aufstuft.
        Wird bei Bedarf automatisch vervielfacht.
      es: |-
        Concentra el Poder Z en cristales que permiten a
        Decidueye convertir su Puntada Sombría en un
        movimiento Z.
      it: |-
        Permette di creare cristalli carichi di Potere Z che
        consentono a Decidueye di trasformare la mossa
        Cucitura d’Ombra in una mossa Z.
