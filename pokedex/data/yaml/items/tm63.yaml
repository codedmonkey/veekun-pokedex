tm63:
  category: all-machines
  cost: 50000
  effect:
    en: 'Teaches Embargo to a compatible Pokémon.'
  flags: {  }
  flavor_text:
    diamond-pearl:
      en: |-
        It prevents the foe from using its
        held item. Its Trainer is also
        prevented from using items on it.
    platinum:
      en: |-
        It prevents the foe from using its
        held item. Its Trainer is also
        prevented from using items on it.
    heartgold-soulsilver:
      en: |-
        It prevents the foe from using its
        held item. Its Trainer is also
        prevented from using items on it.
    black-white:
      en: |-
        It prevents the target from using its
        held item. Its Trainer is also prevented
        from using items on it.
      fr: |-
        Empêche l’ennemi d’utiliser un objet
        tenu et son Dresseur d’utiliser un
        objet sur lui.
    black-2-white-2:
      en: |-
        It prevents the target from using its
        held item. Its Trainer is also prevented
        from using items on it.
    x-y:
      ja-Hrkt: |-
        もたせた　どうぐを　つかえなくする。
        トレーナーも　その　ポケモンには
        どうぐを　つかうことが　できない。
      ja: |-
        持たせた　道具を　使えなくする。
        トレーナーも　その　ポケモンには
        道具を　使えない。
      ko: |-
        지니게 한 도구를 쓸 수 없게 한다.
        트레이너도 그 포켓몬에게는
        도구를 쓸 수 없다.
      en: |-
        This move prevents the target from
        using its held item. Its Trainer is
        also prevented from using items on it.
      fr: |-
        Empêche l’ennemi d’utiliser un objet tenu et
        son Dresseur d’utiliser un objet sur lui.
      de: |-
        Verhindert, dass auf das Ziel Items verwendet
        werden.
      es: |-
        Arroja grandes rocas para infligir daño. También
        puede hacer retroceder al objetivo.
      it: |-
        Impedisce al nemico di usare il suo strumento
        e al suo Allenatore di usarne altri sul Pokémon.
    sun-moon:
      ja-Hrkt: |-
        もたせた　どうぐを　５ターンの　あいだ
        つかえなくする。　トレーナーも　その
        ポケモンには　どうぐを　つかえない。
      ja: |-
        持たせた　どうぐを　５ターンの　あいだ
        使えなくする。　トレーナーも　その
        ポケモンには　道具を　使えない。
      ko: |-
        지니게 한 도구를 5턴 동안
        쓸 수 없게 한다. 트레이너도
        그 포켓몬에게는 도구를 쓸 수 없다.
      zh-Hant: |-
        讓對手在５回合內無法使用攜帶的道具。
        訓練家也不能對
        該寶可夢使用道具。
      zh-Hans: |-
        让对手在５回合内不能使用
        宝可梦携带的道具。训练家也
        不能给那只宝可梦使用道具。
      en: |-
        This move prevents the target from using its held
        item for five turns. Its Trainer is also prevented
        from using items on it.
      fr: |-
        Empêche la cible d’utiliser un objet tenu
        et son Dresseur d’utiliser un objet sur lui
        pendant cinq tours.
      de: |-
        Das Ziel kann 5 Runden lang sein getragenes Item
        nicht einsetzen und es können auch keine Items
        auf es angewendet werden.
      es: |-
        Impide durante cinco turnos que el objetivo utilice
        el objeto que lleve y que su Entrenador use objetos
        con él.
      it: |-
        Impedisce al bersaglio di usare il suo strumento
        e al suo Allenatore di usarne altri sul Pokémon
        per cinque turni.
