  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        キャップを　かぶった　ピカチュウの
        １０まんボルトを　Ｚワザに　かえる
        Ｚパワーの　けっしょうを　つくりだす。
      ja: |-
        キャップを　かぶった　ピカチュウの
        １０まんボルトを　Ｚワザに　変える
        Ｚパワーの　結晶を　作りだす。
      ko: |-
        모자를 쓴 피카츄의
        10만볼트를 Z기술로 바꾸는
        Z파워의 결정을 만들어 낸다.
      zh-Hant: |-
        會製造出把戴著帽子的皮卡丘的十萬伏特
        升級為特殊Ｚ招式的Ｚ力量結晶。
      zh-Hans: |-
        可用它来制造用于对战
        并能将戴着帽子的皮卡丘的十万伏特
        升级成特殊Ｚ招式的Ｚ力量结晶。
      en: |-
        It converts Z-Power into crystals that upgrade
        a Thunderbolt by Pikachu in a cap to an
        exclusive Z-Move.
      fr: |-
        Permet de concentrer la Force Z en un cristal,
        qui autorise le Pikachu à casquette qui le tient
        à transformer son Tonnerre en capacité Z.
      de: |-
        Kristallisierte Z-Kraft, die die Attacke Donnerblitz
        des Pikachus mit Kappe zu einer Z-Attacke
        aufstuft. Wird bei Bedarf automatisch vervielfacht.
      es: |-
        Concentra el Poder Z en cristales que permiten a
        los Pikachu que llevan gorra convertir su Rayo en
        un movimiento Z.
      it: |-
        Permette di creare cristalli carichi di Potere Z che
        consentono a Pikachu con il berretto di trasformare
        la mossa Fulmine in una mossa Z.
