    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        １ターンめに　ひかりを　いっぱいに
        あつめ　２ターンめに　ひかりの　たばを
        はっしゃして　こうげきする。
      ja: |-
        １ターン目に　光を　いっぱいに　集め
        ２ターン目に　光の　束を
        発射して　攻撃する。
      ko: |-
        1턴째에 빛을 가득 모아
        2턴째에 빛의 다발을
        발사하여 공격한다.
      zh-Hant: |-
        使用後的第１回合吸收大量日光，
        並於第２回合發射光束進行攻擊。
      zh-Hans: |-
        第１回合收集满满的日光，
        第２回合发射光束进行攻击。
      en: |-
        In this two-turn attack, the user gathers light, then
        blasts a bundled beam on the next turn.
      fr: |-
        Absorbe la lumière au premier tour et envoie un rayon
        puissant au tour suivant.
      de: |-
        Absorbiert Licht in Runde 1. In Runde 2 erfolgt der
        Angriff.
      es: |-
        Primer turno: absorbe luz. Segundo turno: lanza un
        potente rayo de energía. 
      it: |-
        Chi la usa assorbe luce al primo turno per
        proiettare un raggio intenso al turno successivo.
    sword-shield:
      ja-Hrkt: |-
        １ターンめで　もぐり　２ターンめに
        うきあがって　こうげきする。
      ja: |-
        １ターン目で　潜り　２ターン目に
        浮きあがって　攻撃する。
      ko: |-
        1턴째에 잠수했다가 2턴째에
        떠올라 공격한다.
      zh-Hant: |-
        使用後的第１回合潛入水中，
        並於第２回合浮上來進行攻擊。
      zh-Hans: |-
        第１回合潜入，
        第２回合浮上来进行攻击。
      en: |-
        Diving on the first turn, the user floats up and
        attacks on the next turn.
      fr: |-
        Le lanceur plonge sous l’eau au premier tour
        et frappe au second.
      de: |-
        Anwender taucht in Runde 1 ab und greift in Runde 2
        aus der Tiefe an.
      es: |-
        El usuario se sumerge en el primer turno y ataca en el
        segundo.
      it: |-
        Chi la usa si tuffa in acqua per emergere
        e attaccare al turno successivo.
