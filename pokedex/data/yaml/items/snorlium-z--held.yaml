snorlium-z--held:
  category: z-crystals
  cost: 0
  effect:
    en: 'Held: Allows []{pokemon:snorlax} to upgrade []{move:giga-impact} into []{move:pulverizing-pancake}.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        Ｚパワーの　けっしょう。
        カビゴンの　ギガインパクトを
        Ｚワザに　グレードアップする。
      ja: |-
        Ｚパワーの　結晶。
        カビゴンの　ギガインパクトを
        Ｚワザに　グレードアップする。
      ko: |-
        Z파워의 결정.
        잠만보의 기가임팩트를
        Z기술로 업그레이드한다.
      zh-Hant: |-
        Ｚ力量的結晶。
        會把卡比獸的終極衝擊
        升級為Ｚ招式。
      zh-Hans: |-
        Ｚ力量的结晶。
        会将卡比兽的终极冲击
        升级成Ｚ招式。
      en: |-
        This is a crystallized form of Z-Power.
        It upgrades Snorlax’s Giga Impact to a Z-Move.
      fr: |-
        Une cristallisation de la Force Z, permettant
        de transformer le Giga Impact d’un Ronflex
        en capacité Z.
      de: |-
        Ein Kristall, dem Z-Kraft innewohnt.
        Er stuft Relaxos Attacke Gigastoß
        zu einer Z-Attacke auf.
      es: |-
        Cristal que confiere el Poder Z al movimiento
        Giga Impacto de Snorlax.
      it: |-
        Cristallo in cui è immagazzinato il Potere Z.
        Consente di trasformare la mossa Gigaimpatto
        di Snorlax in una mossa Z.
