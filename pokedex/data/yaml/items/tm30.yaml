    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        からだに　ちからを　こめて　きんにくを
        ぶあつく　することで　じぶんの
        こうげきと　ぼうぎょを　あげる。
      ja: |-
        体に　力を　こめて
        筋肉を　ぶあつく　することで
        自分の　攻撃と　防御を　あげる。
      ko: |-
        몸에 힘을 담아
        근육을 두껍게 해서
        자신의 공격과 방어를 올린다.
      zh-Hant: |-
        將力量集中於體內，增厚肌肉，
        提高自己的攻擊和防禦。
      zh-Hans: |-
        使出全身力气绷紧肌肉，
        从而提高自己的攻击和防御。
      en: |-
        The user tenses its muscles to bulk up its body,
        raising both its Attack and Defense stats.
      fr: |-
        Le lanceur tend ses muscles pour se gonfler,
        ce qui booste son Attaque et sa Défense.
      de: |-
        Der Anwender spannt seine Muskeln an, um den
        Angriff und die Verteidigung zu erhöhen.
      es: 'Robustece el cuerpo para subir el Ataque y la Defensa.'
      it: |-
        Chi la usa tende i muscoli per gonfiare il corpo,
        aumentando Difesa e Attacco.
    sword-shield:
      ja-Hrkt: |-
        かたい　つばさを　あいてに　たたきつけて
        こうげきする。　じぶんの　ぼうぎょが
        あがることが　ある。
      ja: |-
        硬い　翼を　相手に　たたきつけて
        攻撃する。　自分の　防御が
        あがることが　ある。
      ko: |-
        단단한 날개를 상대에게 부딪쳐서
        공격한다. 자신의 방어가
        올라갈 때가 있다.
      zh-Hant: |-
        用堅硬的翅膀撞擊
        對手進行攻擊。
        有時會提高自己的防禦。
      zh-Hans: |-
        用坚硬的翅膀敲打
        对手进行攻击。
        有时会提高自己的防御。
      en: |-
        The target is hit with wings of steel. This may also
        raise the user’s Defense stat.
      fr: |-
        Le lanceur frappe l’ennemi avec des ailes d’acier.
        Peut aussi augmenter la Défense du lanceur.
      de: |-
        Trifft das Ziel mit Stahlflügeln. Verteidigungs-Wert des
        Anwenders steigt eventuell.
      es: |-
        Alas macizas que golpean al objetivo y pueden subir
        la Defensa del usuario.
      it: |-
        Colpisce il bersaglio con ali d’acciaio.
        Può anche aumentare la Difesa di chi la usa.
