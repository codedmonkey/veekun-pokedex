    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        エネルギーの　つまった　おおきい　アメ。
        レベル３０　いじょうの　ポケモンの
        とくぼうを　あげる。
      ja: |-
        エネルギーの　つまった　大きい　アメ。
        レベル３０　以上の　ポケモンの
        とくぼうを　上げる。
      ko: |-
        에너지가 가득한 큰 사탕.
        레벨 30 이상인 포켓몬의
        특수방어를 올린다.
      zh-Hant: |-
        充滿能量的大糖果。
        能提高等級在30以上的
        寶可夢的特防。
