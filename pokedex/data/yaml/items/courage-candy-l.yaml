        能让等级30以上的
        宝可梦的特防上升。
      en: |-
        A big candy that is packed with energy. When given to
        a Pokémon at Lv. 30 or higher, it will increase that
        Pokémon’s Sp. Def stat.
      fr: |-
        Un gros bonbon plein d’énergie.
        Il augmente la Défense Spéciale d’un Pokémon
        de niveau 30 ou supérieur.
      de: |-
        Ein großes Bonbon, das voller Energie steckt.
        Erhöht dauerhaft die Spezial-Verteidigung eines
        Pokémon ab Level 30.
      es: |-
        Caramelo energético grande que aumenta la Defensa
        Especial de un Pokémon de Nv. 30 o superior.
      it: |-
        Una caramella piena zeppa di energia.
        Aumenta la Difesa Speciale di un Pokémon
        di livello 30 o superiore.
