damp-mulch:
  category: mulch
  cost: 200
  effect:
    en: |-
      Used on a patch of soil
      :   Plant's growth stages will each last 25% more time.  Dries soil out more slowly.
  flags: {  }
  flavor_text:
    diamond-pearl:
      en: |-
        A plant fertilizer spread on soft soil.
        It slows the growth of Berries and
        causes the soil to dry slower.
    platinum:
      en: |-
        A plant fertilizer spread on soft soil.
        It slows the growth of Berries and
        causes the soil to dry slower.
    heartgold-soulsilver:
      en: |-
        A fertilizer to be spread on soft soil.
        It slows the growth of Berries and
        causes the soil to dry slower.
    black-white:
      en: |-
        A fertilizer to be spread on soft soil
        in regions where Berries are grown.
        A maniac will buy it for a high price.
      fr: |-
        Un engrais utilisé sur sol meuble.
        Les amateurs en donnent un bon prix.
    black-2-white-2:
      en: |-
        A fertilizer to be spread on soft soil
        in regions where Berries are grown.
        A maniac will buy it for a high price.
    x-y:
      ja-Hrkt: |-
        きのみを　そだてる　ちほうでは
        ふかふかのつちに　まいて　つかう。
      ja: |-
        きのみを　育てる　地方では
        ふかふかのつちに　まいて　使う。
      ko: |-
        나무열매를 키우는 지방에서는
        푹신푹신한 땅에 뿌려 쓴다.
      en: |-
        A fertilizer to be spread on soft soil
        in regions where Berries are grown.
      fr: 'Un engrais à utiliser sur un sol meuble.'
      de: |-
        In Regionen, wo man Beeren anbaut,
        mengt man ihn unter weiche Lehmerde.
      es: |-
        Un fertilizante usado en suelo fértil donde crecen
        las bayas.
      it: |-
        Viene usato nelle regioni in cui si coltivano
        le bacche per concimare il terreno soffice.
    sun-moon:
      ja-Hrkt: |-
        きのみを　そだてるときの　ひりょう。
        しかし　ホウエンちほうの　つちには
        まるで　なじまないので　こうかが　ない。
      ja: |-
        きのみを　育てるときの　肥料。
        しかし　ホウエン地方の　土には
        まるで　なじまないので　効果が　ない。
      ko: |-
        나무열매를 키울 때 사용하는 비료.
        그러나 호연지방의 흙에는
        전혀 맞지 않기에 효과가 없다.
      zh-Hant: |-
        培育樹果時的肥料。
        但完全不適合豐緣地區的土壤，
        所以沒什麼效果。
      zh-Hans: |-
        培育树果时的肥料。
        但完全不适合丰缘地区的土壤，
        所以没什么效果。
      en: |-
        A fertilizer for growing Berries. However, it appears
        to be unsuitable for the soil in the Hoenn region and
        has no effect.
      fr: |-
        Un engrais à utiliser sur un sol meuble.
        Il n’est cependant pas adapté aux terres
        de Hoenn et n’y a aucun effet.
      de: |-
        Mulch zur Nutzung auf Beerenfeldern. Durch seine
        Unverträglichkeit mit den Böden in Hoenn bleibt
        sein Einsatz dort ohne Wirkung.
      es: |-
        Un fertilizante usado para el cultivo de bayas.
        Parece que no se asienta bien en el suelo de
        Hoenn, por lo que no tiene efecto en esta región.
      it: |-
        Fertilizzante usato per coltivare le bacche.
        Tuttavia, non ha effetto a Hoenn, perché
        non è adatto al terreno della regione.
