mega-pendant:
  category: unused
  cost: 0
  effect:
    en: "Unused.  This is Wally's Key Stone in Omega Ruby and Alpha Sapphire, but it cannot be obtained by the player."
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        メガストーンを　もったまま　たたかう
        ポケモンを　メガシンカさせる
        みちのパワーを　ひめた　ネックレス。
      ja: |-
        メガストーンを　持ったまま　戦う
        ポケモンを　メガシンカさせる
        未知のパワーを　秘めた　ネックレス。
      ko: |-
        메가스톤을 지닌 채로 싸우는
        포켓몬을 메가진화시키는
        미지의 힘을 가진 목걸이.
      zh-Hant: |-
        隱藏著未知力量的吊墜。
        能讓攜帶著超級石戰鬥的
        寶可夢進行超級進化。
      zh-Hans: |-
        蕴藏着未知力量的吊坠。
        能让携带着超级石战斗的
        宝可梦进行超级进化。
      en: |-
        This necklace contains an untold power that
        somehow enables Pokémon carrying a Mega Stone
        to Mega Evolve in battle.
      fr: |-
        Un pendentif aux pouvoirs mystérieux permettant
        à un Pokémon de méga-évoluer au combat s’il
        tient la bonne Méga-Gemme.
      de: |-
        Ein Anhänger mit geheimnisvollen Kräften.
        Er ermöglicht Pokémon, die einen Mega-Stein
        tragen, eine Mega-Entwicklung durchzuführen.
      es: |-
        Collar con un poder misterioso que permite
        megaevolucionar a Pokémon que lleven la
        Megapiedra adecuada.
      it: |-
        Collana dotata di un misterioso potere.
        Permette a un Pokémon che ha una Megapietra
        di megaevolversi durante la lotta.
