prison-bottle:
  category: gameplay
  cost: 0
  effect:
    en: 'Transforms Hoopa into its Unbound form for up to three days.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        おおむかしに　とある　ポケモンの
        ちからを　ふうじこめたと　される　ツボ。
      ja: |-
        大昔に　とある　ポケモンの　力を
        封じ込めたと　される　ツボ。
      ko: |-
        먼 옛날 어떤 포켓몬의 힘을
        봉인했다고 여겨지는 항아리.
      zh-Hant: |-
        據說在很久以前封印著
        某隻寶可夢力量的壺。
      zh-Hans: |-
        据说在很久以前封印着
        某只宝可梦力量的壶。
      en: |-
        A bottle believed to have been used to seal away
        the power of a certain Pokémon long, long ago.
      fr: |-
        Récipient utilisé il y a fort longtemps pour sceller
        le pouvoir d’un certain Pokémon.
      de: |-
        Ein Gefäß, mit dem vor langer, langer Zeit die Macht
        eines gewissen Pokémon versiegelt wurde.
      es: |-
        Vasija en la que se halla confinado el poder de
        cierto Pokémon desde hace muchísimo tiempo.
      it: |-
        Vaso in cui si dice sia sigillata da tempo
        immemorabile la forza di un Pokémon.
