x-sp-atk-6:
  category: miracle-shooter
  cost: 0
  effect:
    en: |-
      Used on a party Pokémon in battle
      :   Raises the target's [Special Attack]{mechanic:special-attack} by six [stages]{mechanic:stage}.
      This item can only be obtained or used via the Wonder Launcher.
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        It raises the Sp. Atk stat of a Pokémon
        in battle immensely. It wears off if the
        Pokémon is withdrawn.
      fr: |-
        Monte fortement l’Atq. Spé. pendant
        un combat. L’effet s’estompe
        si le Pokémon se retire.
    black-2-white-2:
      en: |-
        It raises the Sp. Atk stat of a Pokémon
        in battle immensely. It wears off if the
        Pokémon is withdrawn.
    x-y:
      ja-Hrkt: |-
        せんとうちゅうの　ポケモンの
        とくこうを　ものすごく　あげる。
        ひっこめると　もとに　もどる。
      ja: |-
        戦闘中の　ポケモンの
        特攻を　ものすごく　あげる。
        ひっこめると　元に　戻る。
      ko: |-
        배틀 중인 포켓몬의 특수공격을
        엄청나게 올린다. 포켓몬을 볼에
        넣어버리면 원래대로 되돌아간다.
      en: |-
        It raises the Sp. Atk stat of a Pokémon
        in battle immensely. It wears off if the
        Pokémon is withdrawn.
      fr: |-
        Augmente fortement l’Attaque Spéciale pendant
        un combat. L’effet s’estompe si le Pokémon
        se retire.
      de: |-
        Hebt den Spezial-Angriffs-Wert eines Pokémon
        im Kampf enorm an. Die Wirkung endet mit dem
        Austausch des Pokémon.
      es: 'Carta importante que entrega Wingull.'
      it: |-
        Aumenta incredibilmente l’Attacco Speciale di un
        Pokémon in una lotta. L’effetto svanisce se il
        Pokémon è sostituito.
