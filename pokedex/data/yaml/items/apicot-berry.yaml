apicot-berry:
  category: in-a-pinch
  cost: 80
  effect:
    en: |-
      Held in battle
      :   When the holder has 1/4 its max [HP]{mechanic:hp} remaining or less, it consumes this item to [raise]{mechanic:raise} its [Special Defense]{mechanic:special-defense} by one stage.
  flags:
    - holdable-active
  flavor_text:
    ruby-sapphire:
      en: |-
        A hold item that
        raises SP. DEF in
        a pinch.
    emerald:
      en: |-
        A hold item that
        raises SP. DEF in
        a pinch.
    firered-leafgreen:
      en: |-
        When held by a POKéMON, it raises
        the SP. DEF stat in a pinch.
    diamond-pearl:
      en: |-
        A Poffin ingredient.
        If held by a Pokémon, it raises its
        Sp. Def stat in a pinch.
    platinum:
      en: |-
        A Poffin ingredient.
        If held by a Pokémon, it raises its
        Sp. Def stat in a pinch.
    heartgold-soulsilver:
      en: |-
        If held by a Pokémon, it raises its
        Sp. Def stat in a pinch.
    black-white:
      en: |-
        If held by a Pokémon, it raises its
        Sp. Def stat in a pinch.
      fr: |-
        Tenue, cette Baie monte la Déf. Spé.
        en cas de besoin.
    black-2-white-2:
      en: |-
        If held by a Pokémon, it raises its
        Sp. Def stat in a pinch.
    x-y:
      ja-Hrkt: |-
        ポケモンに　もたせると
        ピンチのとき　じぶんの
        とくぼうが　あがる。
      ja: |-
        ポケモンに　持たせると
        ピンチのとき　自分の
        特防が　あがる。
      ko: |-
        포켓몬에게 지니게 하면
        위급할 때 자신의
        특수방어가 올라간다.
      en: |-
        A Berry to be consumed by Pokémon.
        If a Pokémon holds one, its Sp. Def
        stat will increase when it’s in a pinch.
      fr: |-
        Tenue, cette Baie augmente la Défense Spéciale
        en cas de besoin.
      de: |-
        Als getragenes Item erhöht diese Beere den
        Spezial-Verteidigungs-Wert eines Pokémon,
        sobald es in einer Notlage steckt.
      es: |-
        Polvo de brillo argénteo que fortalece los ataques
        de tipo Bicho. Debe llevarlo un Pokémon.
      it: |-
        Se il Pokémon che ha questa bacca si trova
        in difficoltà, la sua Difesa Speciale aumenta.
