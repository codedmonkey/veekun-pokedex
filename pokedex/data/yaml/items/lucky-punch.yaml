        An item to be held by Chansey.
        This pair of lucky boxing gloves will
        boost Chansey’s critical-hit ratio.
      fr: |-
        Objet à faire tenir à Leveinard.
        Une paire de gants qui augmente son taux
        de critiques.
      de: |-
        Ein Item, das von Chaneira getragen werden kann.
        Diese Handschuhe erhöhen die Volltrefferquote
        des Trägers.
      es: |-
        Extraña esfera que causa quemaduras al Pokémon
        que la lleva en combate.
      it: |-
        Strumento da dare a Chansey.
        Guanti che aumentano molto la probabilità
        di sferrare brutti colpi.
