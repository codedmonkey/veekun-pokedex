kelpsy-berry:
  category: effort-drop
  cost: 80
  effect:
    en: |-
      Used on a party Pokémon
      :   Increases [happiness]{mechanic:happiness} by 10/5/2.  Lowers [Attack]{mechanic:attack} [effort]{mechanic:effort} by 10.
  flags: {  }
  flavor_text:
    ruby-sapphire:
      en: |-
        POKéBLOCK ingredient.
        Plant in loamy soil
        to grow KELPSY.
    emerald:
      en: |-
        Makes a POKéMON
        friendly but lowers
        base ATTACK.
    firered-leafgreen:
      en: |-
        Can be ground up into a powder as
        an ingredient for medicine.
    diamond-pearl:
      en: |-
        A Poffin ingredient. Using it on a
        Pokémon makes it more friendly, but
        it also lowers its base Attack stat.
    platinum:
      en: |-
        A Poffin ingredient. Using it on a
        Pokémon makes it more friendly, but
        it also lowers its base Attack stat.
    heartgold-soulsilver:
