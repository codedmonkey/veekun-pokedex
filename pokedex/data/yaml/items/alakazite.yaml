alakazite:
  category: mega-stones
  cost: 0
  effect:
    en: 'Held: Allows Alakazam to Mega Evolve into Mega Alakazam.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        フーディンに　もたせておくと
        たたかいのとき　メガシンカが　できる
        ふしぎな　メガストーンの　いっしゅ。
      ja: |-
        フーディンに　持たせておくと
        戦いのとき　メガシンカが　できる
        不思議な　メガストーンの　一種。
      ko: |-
        후딘에게 지니게 하면
        배틀할 때 메가진화할 수 있는
        신비한 메가스톤의 일종.
      en: |-
        One variety of the mysterious Mega Stones.
        Have Alakazam hold it, and this stone will
        enable it to Mega Evolve during battle.
      fr: |-
        Une variété de Méga-Gemme.
        Tenue par un Alakazam, elle lui permet de
        méga-évoluer durant un combat.
      de: |-
        Einer der mysteriösen Mega-Steine. Wird er von
        einem Simsala getragen, kann es im Kampf eine
        Mega-Entwicklung durchführen.
      es: |-
        Una piedra de aspecto normal que a algunos
        les puede parecer de gran valor.
      it: |-
        Un esemplare delle misteriose Megapietre.
        Data ad Alakazam, gli permette di megaevolversi
        durante la lotta.
