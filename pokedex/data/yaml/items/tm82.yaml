    sword-shield:
      ja-Hrkt: |-
        でんきの　ネットで
        あいてを　つかまえて　こうげきする。
        あいての　すばやさを　さげる。
      ja: |-
        電気の　ネットで
        相手を　捕まえて　攻撃する。
        相手の　素早さを　さげる。
      ko: |-
        전기 네트로
        상대를 붙잡아서 공격한다.
        상대의 스피드를 떨어뜨린다.
      zh-Hant: |-
        用電網捉住對手進行攻擊。
        可降低對手的速度。
      zh-Hans: |-
        用电网捉住对手进行攻击。
        降低对手的速度。
      en: |-
        The user attacks and captures opposing Pokémon
        using an electric net. This lowers their Speed stats.
      fr: |-
        Attrape l’ennemi dans un filet électrique.
        Baisse aussi la Vitesse de l’ennemi.
      de: |-
        Fängt gegnerische Pokémon mit einem elektrischen
        Netz und senkt deren Initiative.
      es: |-
        Atrapa y ataca a los objetivos con una telaraña
        eléctrica. También reduce su Velocidad.
      it: |-
        Chi la usa attacca i nemici intorno a sé catturandoli
        con una ragnatela elettrica e riducendone la Velocità.
