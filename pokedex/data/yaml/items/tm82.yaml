tm82:
  category: all-machines
  cost: 1000
  effect:
    en: 'Teaches Sleep Talk to a compatible Pokémon.'
  flags: {  }
  flavor_text:
    diamond-pearl:
      en: |-
        While it is asleep, the user
        randomly uses one of the moves
        it knows.
    platinum:
      en: |-
        While it is asleep, the user
        randomly uses one of the moves
        it knows.
    heartgold-soulsilver:
      en: |-
        While it is asleep, the user
        randomly uses one of the moves
        it knows.
    black-white:
      en: |-
        The user knocks away the target and
        drags out another Pokémon in its party.
        In the wild, the battle ends.
      fr: |-
        Un coup puissant qui blesse la cible
        et l’envoie balader. Dans la nature,
        met fin au combat.
    black-2-white-2:
      en: |-
        The user knocks away the target and
        drags out another Pokémon in its party.
        In the wild, the battle ends.
    x-y:
      ja-Hrkt: |-
        あいてを　はじきとばして
        ひかえの　ポケモンを　ひきずりだす。
        やせいなら　せんとうが　おわる。
      ja: |-
        相手を　はじきとばして
        控えの　ポケモンを　ひきずりだす。
        野生の　場合は　戦闘が　終わる。
      ko: |-
        상대를 튕겨내서
        교대할 포켓몬을 끌어낸다.
        야생의 경우에는 배틀이 끝난다.
      en: |-
        The target is knocked away, and a different
        Pokémon is dragged out. In the wild, this
        ends a battle against a single Pokémon.
      fr: |-
        Un coup puissant qui blesse la cible et l’envoie
        au loin. Dans la nature, met fin au combat.
      de: |-
        Fegt das Ziel vom Feld und wechselt es
        mit einem anderen Pokémon aus.
        Beendet Kämpfe gegen wilde Pokémon.
      es: |-
        Una saca donde guardar los objetos útiles para
        la exploración. Permite acceder al Subsuelo.
      it: |-
        Chi la usa fa volar via il bersaglio in modo che
        venga sostituito. Se il bersaglio è un singolo
        Pokémon selvatico, la lotta finisce.
    sun-moon:
      ja-Hrkt: |-
        あいてを　はじきとばして
        ひかえの　ポケモンを　ひきずりだす。
        やせいの　ばあいは　せんとうが　おわる。
      ja: |-
        相手を　はじきとばして
        控えの　ポケモンを　ひきずりだす。
        野生の　場合は　戦闘が　終わる。
      ko: |-
        상대를 튕겨내서
        교대할 포켓몬을 끌어낸다.
        야생의 경우에는 배틀이 끝난다.
      zh-Hant: |-
        彈飛對手，
        強制讓後備寶可夢上場。
        對手為野生寶可夢時，戰鬥將直接結束。
      zh-Hans: |-
        弹飞对手，强制拉后备宝可梦上场。
        如果对手为野生宝可梦，
        战斗将直接结束。
      en: |-
        The target is knocked away, and a different
        Pokémon is dragged out. In the wild, this ends
        a battle against a single Pokémon.
      fr: |-
        Un coup puissant qui blesse la cible et l’envoie
        au loin. Lors d’un combat contre un Pokémon
        sauvage seul, met fin au combat.
      de: |-
        Fegt das Ziel vom Feld und wechselt es gegen ein
        anderes Pokémon aus. Beendet Kämpfe gegen wilde
        Pokémon.
      es: |-
        Se lleva al objetivo, que es cambiado por otro
        Pokémon. Si es un Pokémon salvaje, acaba el
        combate.
      it: |-
        Chi la usa fa volar via il bersaglio in modo che
