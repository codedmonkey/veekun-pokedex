    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        からだから　あくいに
        みちた　おそろしい　オーラを　はっする。
        あいてを　ひるませる　ことが　ある。
      ja: |-
        体から　悪意に　みちた
        恐ろしい　オーラを　発する。
        相手を　ひるませることが　ある。
      ko: |-
        몸에서 악의로 가득한
        무서운 오라를 발한다.
        상대를 풀죽게 만들 때가 있다.
      zh-Hant: |-
        從身體散發出
        充滿惡意的恐怖氣場。
        有時會使對手畏縮。
      zh-Hans: |-
        从体内发出
        充满恶意的恐怖气场。
        有时会使对手畏缩。
      en: |-
        The user releases a horrible aura imbued with dark
        thoughts. This may also make the target flinch.
      fr: |-
        Le lanceur dégage une horrible aura chargée d’idées
        noires. Peut aussi apeurer l’ennemi.
      de: |-
        Anwender greift mit fürchterlicher Aura schlechter
        Gedanken an. Ziel schreckt eventuell zurück.
      es: |-
        Libera una horrible aura llena de malos pensamientos 
        y puede hacer retroceder al objetivo.
      it: |-
        Chi la usa emana un’aura impregnata di oscuri
        pensieri. Può anche far tentennare il Pokémon
        colpito.
    sword-shield:
      ja-Hrkt: |-
        ばくはつを　おこして　じぶんの
        まわりに　いるものを　こうげきする。
        つかった　あとに　ひんしに　なる。
      ja: |-
        爆発を　おこして　自分の
        周りに　いるものを　攻撃する。
        使ったあとに　ひんしに　なる。
      ko: |-
        폭발을 일으켜서 자신의
        주위에 있는 포켓몬을 공격한다.
        쓰고 나서 기절하게 된다.
      zh-Hant: |-
        引起爆炸，
        攻擊自己周圍所有的寶可夢。
        使用後自己會陷入瀕死。
      zh-Hans: |-
        引发爆炸，
        攻击自己周围所有的宝可梦。
        使用后陷入濒死。
      en: |-
        The user attacks everything around it by causing an
        explosion. The user faints upon using this move.
      fr: |-
        Le lanceur explose en blessant tous les Pokémon
        autour de lui. Le lanceur tombe K.O.
      de: |-
        Der Anwender verursacht eine Explosion, mit der er bei
        allen Pokémon im Umkreis Riesenschaden anrichtet und
        selbst kampfunfähig wird.
      es: |-
        El atacante explota y hiere a todos a su alrededor.
        El usuario se debilita de inmediato.
      it: |-
        Chi la usa esplode e infligge danni ai Pokémon
        che ha intorno, ma poi va KO.
