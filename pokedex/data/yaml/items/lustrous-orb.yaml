lustrous-orb:
  category: species-specific
  cost: 0
  effect:
    en: |-
      Held by []{pokemon:palkia}
      :   Holder's []{type:dragon}- and []{type:water}-type moves have 1.2× their usual power.
  flags:
    - holdable
  flavor_text:
    diamond-pearl:
      en: |-
        A beautifully glowing orb to be held by
        PALKIA. It boosts the power of Dragon-​
        and Water-type moves.
    platinum:
      en: |-
        A beautifully glowing orb to be held by
        PALKIA. It boosts the power of Dragon-​
        and Water-type moves.
    heartgold-soulsilver:
