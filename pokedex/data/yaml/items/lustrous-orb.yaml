        A beautifully glowing orb to be held by
        Palkia. It boosts the power of Dragon-​
        and Water-type moves.
    x-y:
      ja-Hrkt: |-
        パルキアに　もたせると　ドラゴンと
        みずタイプの　わざの　いりょくが
        あがる　うつくしく　かがやく　たま。
      ja: |-
        パルキアに　持たせると　ドラゴンと
        みずタイプの　技の　威力が
        あがる　美しく　輝く　珠。
      ko: |-
        펄기아에게 지니게 하면 드래곤과
        물타입 기술의 위력이 올라가는
        아름답게 반짝이는 구슬.
      en: |-
        A beautifully glowing orb to be held by
        Palkia. It boosts the power of Dragon-​
        and Water-type moves when it is held.
      fr: |-
        Un bel orbe luisant destiné à Palkia.
        Augmente la puissance des capacités de type
        Dragon et Eau.
      de: |-
        Ein hell leuchtender Orb. Verstärkt Attacken vom
        Typ Drache und Wasser, wenn Palkia ihn trägt.
      es: |-
        Los Pokémon pueden llevarla o usarla para
        descongelarse.
      it: |-
        Sfera splendente da dare a Palkia.
        Potenzia le mosse di tipo Drago e Acqua.
