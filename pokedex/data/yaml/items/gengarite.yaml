gengarite:
  category: mega-stones
  cost: 0
  effect:
    en: 'Held: Allows Gengar to Mega Evolve into Mega Gengar.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        ゲンガーに　もたせておくと
        たたかいのとき　メガシンカが　できる
        ふしぎな　メガストーンの　いっしゅ。
      ja: |-
        ゲンガーに　持たせておくと
        戦いのとき　メガシンカが　できる
        不思議な　メガストーンの　一種。
      ko: |-
        팬텀에게 지니게 하면
        배틀할 때 메가진화할 수 있는
        신비한 메가스톤의 일종.
      en: |-
        One variety of the mysterious Mega Stones.
        Have Gengar hold it, and this stone will
        enable it to Mega Evolve during battle.
      fr: |-
        Une variété de Méga-Gemme.
        Tenue par un Ectoplasma, elle lui permet de
        méga-évoluer durant un combat.
      de: |-
        Einer der mysteriösen Mega-Steine. Wird er von
        einem Gengar getragen, kann es im Kampf eine
        Mega-Entwicklung durchführen.
      es: |-
        Una de las misteriosas Megapiedras. Permite
        megaevolucionar a Kangaskhan en combate.
      it: |-
        Un esemplare delle misteriose Megapietre.
        Data a Gengar, gli permette di megaevolversi
        durante la lotta.
