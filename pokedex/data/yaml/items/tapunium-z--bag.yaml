  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        カプたちの　しぜんのいかりを
        とくべつな　Ｚワザに　グレードアップする
        Ｚパワーの　けっしょうを　つくりだす。
      ja: |-
        カプたちの　しぜんのいかりを
        特別な　Ｚワザに　グレードアップする
        Ｚパワーの　結晶を　作りだす。
      ko: |-
        카푸들의 자연의분노를
        특별한 Z기술로 업그레이드하는
        Z파워의 결정을 만들어 낸다.
      zh-Hant: |-
        會製造出把卡璞們的自然之怒
        升級為特殊Ｚ招式的Ｚ力量結晶。
      zh-Hans: |-
        可用它来制造用于对战
        并能将卡璞们的自然之怒
        升级成特殊Ｚ招式的Ｚ力量结晶。
      en: |-
        It converts Z-Power into crystals that upgrade the
        tapu’s Nature’s Madness to an exclusive Z-Move.
      fr: |-
        Permet de concentrer la Force Z en un cristal,
        qui autorise le Pokémon Tutélaire qui le tient à
        transformer son Ire de la Nature en capacité Z.
      de: |-
        Kristallisierte Z-Kraft, die die Kapu-Attacke
        Naturzorn zu einer Z-Attacke aufstuft.
        Wird bei Bedarf automatisch vervielfacht.
      es: |-
        Concentra el Poder Z en cristales que permiten a
        los Tapu convertir su Furia Natural en un
        movimiento Z.
      it: |-
        Permette di creare cristalli carichi di Potere Z che
        consentono ai Tapu di trasformare la mossa
        Ira della Natura in una mossa Z.
