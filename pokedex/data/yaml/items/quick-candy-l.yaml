  flavor_text:
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        エネルギーの　つまった　おおきい　アメ。
        レベル３０　いじょうの　ポケモンの
        すばやさを　あげる。
      ja: |-
        エネルギーの　つまった　大きい　アメ。
        レベル３０　以上の　ポケモンの
        すばやさを　上げる。
      ko: |-
        에너지가 가득한 큰 사탕.
        레벨 30 이상인 포켓몬의
        스피드를 올린다.
      zh-Hant: |-
        充滿能量的大糖果。
        能提高等級在30以上的
        寶可夢的速度。
      zh-Hans: |-
        充满能量的大糖果。
        能让等级30以上的
        宝可梦的速度上升。
      en: |-
        A big candy that is packed with energy. When given to
        a Pokémon at Lv. 30 or higher, it will increase that
        Pokémon’s Speed stat.
      fr: |-
        Un gros bonbon plein d’énergie.
        Il augmente la Vitesse d’un Pokémon de niveau 30
        ou supérieur.
      de: |-
        Ein großes Bonbon, das voller Energie steckt.
        Erhöht dauerhaft die Initiative eines Pokémon ab
        Level 30.
      es: |-
        Caramelo energético grande que aumenta la Velocidad
        de un Pokémon de Nv. 30 o superior.
      it: |-
        Una caramella piena zeppa di energia.
        Aumenta la Velocità di un Pokémon di livello 30
        o superiore.
