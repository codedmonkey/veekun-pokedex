x-attack-6:
  category: miracle-shooter
  cost: 0
  effect:
    en: |-
      Used on a party Pokémon in battle
      :   Raises the target's [Attack]{mechanic:attack} by six [stages]{mechanic:stage}.

      This item can only be obtained or used via the Wonder Launcher.
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        It raises the Attack stat of a Pokémon
        in battle immensely. It wears off if the
        Pokémon is withdrawn.
      fr: |-
        Monte fortement l’Attaque pendant
        un combat. L’effet s’estompe
        si le Pokémon se retire.
    black-2-white-2:
      en: |-
        It raises the Attack stat of a Pokémon
        in battle immensely. It wears off if the
        Pokémon is withdrawn.
    x-y:
      ja-Hrkt: |-
        せんとうちゅうの　ポケモンの
        こうげきを　ものすごく　あげる。
        ひっこめると　もとに　もどる。
      ja: |-
        戦闘中の　ポケモンの
        攻撃を　ものすごく　あげる。
        ひっこめると　元に　戻る。
      ko: |-
        배틀 중인 포켓몬의 공격을
        엄청나게 올린다. 포켓몬을 볼에
        넣어버리면 원래대로 되돌아간다.
      en: |-
        It raises the Attack stat of a Pokémon
        in battle immensely. It wears off if the
        Pokémon is withdrawn.
      fr: |-
        Augmente fortement l’Attaque pendant
        un combat. L’effet s’estompe si le Pokémon
        se retire.
      de: |-
        Hebt den Angriffs-Wert eines Pokémon im Kampf
        enorm an. Die Wirkung endet mit dem Austausch
        des Pokémon.
      es: |-
        Punta que permite fusionar a Kyurem con cierto
        Pokémon con el que, originariamente, formaba
        un solo ser.
      it: |-
        Aumenta incredibilmente l’Attacco di un Pokémon
        in una lotta. L’effetto svanisce se il Pokémon
        è sostituito.
