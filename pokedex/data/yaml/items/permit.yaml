  flavor_text:
    black-2-white-2:
      en: |-
        A permit needed
        to enter the Nature Preserve.
        Only a few know about this place.
    x-y:
      ja-Hrkt: |-
        わずかな　ひとしか　しらない
        しぜんほごくに　はいるために
        ひつような　ライセンスカード。
      ja: |-
        わずかな　人しか　知らない
        自然保護区に　入るために
        必要な　ライセンスカード。
      ko: |-
        소수의 사람밖에 모르는
        자연보호구역에 들어가기 위해
        필요한 라이선스 카드.
      en: |-
        A permit that is needed to
        enter the Nature Preserve.
        Not many know about it.
      fr: |-
        Un permis nécessaire pour pénétrer dans
        la Réserve Naturelle, lieu protégé des foules
        modernes.
      de: |-
        Eine Genehmigung in Form einer Karte, die
        den Zutritt ins Naturschutzgebiet ermöglicht.
        Nur wenige kennen den Ort.
      es: |-
        Objeto de un solo uso. Aumenta el Ataque del
        Pokémon que lo lleva si este recibe un ataque de
        tipo Hielo.
      it: |-
        Tessera che permette di accedere a una
        Riserva Naturale conosciuta da pochi.
