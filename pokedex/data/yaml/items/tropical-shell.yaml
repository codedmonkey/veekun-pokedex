  flavor_text:
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        あたたかい　ちほうの　うみから
        ながれついた　かも　しれない
        しろくて　きれいな　かいがら。
      ja: |-
        あたたかい　地方の　海から
        流れついた　かも　しれない
        白くて　きれいな　貝がら。
      ko: |-
        따뜻한 지방의 바다에서
        흘러들어 왔을지도 모르는
        하얗고 예쁜 조개껍질.
      zh-Hant: |-
        美麗的白色貝殼。
        可能是從溫暖的海域
        漂流過來的。
      zh-Hans: |-
        美丽的白色贝壳。
        或许是从温暖的海域那里
        漂流到这里的。
      en: |-
        A beautiful white shell that may have drifted from
        a sea in a warm region.
      fr: |-
        Un joli coquillage blanc. Il a peut-être été porté
        par les vagues depuis une région tropicale.
      de: |-
        Eine wunderschöne weiße Muschelschale. Vermutlich
        stammt sie aus dem Meer einer wärmeren Region und
        wurde von der Strömung angespült.
      es: |-
        Preciosa concha de color blanco que quizá haya sido
        arrastrada por las corrientes marinas desde mares de
        regiones más cálidas.
      it: |-
        Una bellissima conchiglia bianca, forse arrivata dalle
        regioni calde sulla scia delle correnti marine.
