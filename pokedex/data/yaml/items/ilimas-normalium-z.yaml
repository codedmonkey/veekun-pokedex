  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        イリマから　あずかった　ノーマルＺ。
        しげみのどうくつ　おくにある
        だいざに　おくよう　たのまれた。
      ja: |-
        イリマから　預かった　ノーマルＺ。
        茂みの洞窟　奥にある
        台座に　置くよう　頼まれた。
      ko: |-
        일리마에게 받은 노말Z.
        우거진 동굴 안쪽에 있는
        대좌에 두도록 부탁받았다.
      zh-Hant: |-
        伊利馬交給你的一般Ｚ。
        有人拜託你把它放到
        蔥鬱洞窟深處的台座上。
      zh-Hans: |-
        伊利马交给你保管的一般Ｚ。
        受人嘱托要把它放到
        葱郁洞窟深处的台座上。
      en: |-
        The Normalium Z you were entrusted with by Ilima.
        You were asked to place it on the pedestal at
        the back of Verdant Cavern.
      fr: |-
        Une Normazélite qu’Althéo vous a confiée. Il vous
        a demandé de la déposer sur le piédestal qui
        se trouve au fond de la Grotte Verdoyante.
      de: |-
        Das Normium Z, das Elima dir anvertraut hat.
        Er hat dich gebeten, es in den Sockel in der
        Vegetationshöhle zu legen.
      es: |-
        Normastal Z que te entrega Liam para que lo
        deposites sobre el altar situado al fondo de la
        Cueva Sotobosque.
      it: |-
        Normium Z ricevuto da Liam. Devi porlo
        sul piedistallo dentro la Grotta Sottobosco.
