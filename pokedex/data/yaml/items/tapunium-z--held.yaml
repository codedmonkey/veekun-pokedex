tapunium-z--held:
  category: z-crystals
  cost: 0
  effect:
    en: 'Held: Allows []{pokemon:tapu-koko}, []{pokemon:tapu-lele}, []{pokemon:tapu-bulu}, and []{pokemon:tapu-fini} to upgrade []{move:natures-madness} into []{move:guardian-of-alola}.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        Ｚパワーの　けっしょう。
        カプたちの　しぜんのいかりを
        Ｚワザに　グレードアップする。
      ja: |-
        Ｚパワーの　結晶。
        カプたちの　しぜんのいかりを
        Ｚワザに　グレードアップする。
      ko: |-
        Z파워의 결정.
        카푸들의 자연의분노를
        Z기술로 업그레이드한다.
      zh-Hant: |-
        Ｚ力量的結晶。
        會把卡璞們的自然之怒
        升級為Ｚ招式。
      zh-Hans: |-
        Ｚ力量的结晶。
        会将卡璞们的自然之怒
        升级成Ｚ招式。
      en: |-
        This is a crystallized form of Z-Power. It upgrades
        the tapu’s Nature’s Madness to a Z-Move.
      fr: |-
        Une cristallisation de la Force Z, permettant
        de transformer l’Ire de la Nature d’un Toko
        en capacité Z.
      de: |-
        Ein Kristall, dem Z-Kraft innewohnt.
        Er stuft die Kapu-Attacke Naturzorn
        zu einer Z-Attacke auf.
      es: |-
        Cristal que confiere el Poder Z al movimiento
        Furia Natural de los Tapu.
      it: |-
        Cristallo in cui è immagazzinato il Potere Z.
        Consente di trasformare la mossa Ira della Natura
        dei Tapu in una mossa Z.
