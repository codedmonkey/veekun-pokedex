      zh-Hant: |-
        結實堅硬的空殼。
        攜帶它的寶可夢必定可以
        和後備的寶可夢進行替換。
      zh-Hans: |-
        结实坚硬的空壳。
        携带它的宝可梦必定可以
        和后备的宝可梦进行替换。
      en: |-
