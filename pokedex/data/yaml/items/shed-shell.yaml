shed-shell:
  category: held-items
  cost: 4000
  effect:
    en: 'Held: The holder is unaffected by any moves or abilities that would prevent it from actively leaving battle.'
  flags:
    - holdable
    - holdable-active
  flavor_text:
    diamond-pearl:
      en: |-
        A tough, discarded carapace to be held
        by a Pokémon. It enables the holder to
        switch with a waiting Pokémon in battle.
    platinum:
      en: |-
        A tough, discarded carapace to be held
        by a Pokémon. It enables the holder to
        switch with a waiting Pokémon in battle.
    heartgold-soulsilver:
      en: |-
        A tough, discarded carapace to be held
        by a Pokémon. It enables the holder to
        switch with a waiting Pokémon in battle.
    black-white:
      en: |-
        A tough, discarded carapace to be held
        by a Pokémon. It enables the holder to
        switch with a waiting Pokémon in battle.
      fr: |-
        Objet à tenir. Carapace dure qui permet
        au porteur de se retirer même s’il est
        affecté par une attaque immobilisante.
    black-2-white-2:
      en: |-
        A tough, discarded carapace to be held
        by a Pokémon. It enables the holder to
        switch with a waiting Pokémon in battle.
    x-y:
      ja-Hrkt: |-
        じょうぶで　かたい　ぬけがら。
        もたせた　ポケモンは　ひかえの
        ポケモンと　かならず　いれかわれる。
      ja: |-
        丈夫で　硬い　ぬけがら。
        持たせた　ポケモンは　控えの
        ポケモンと　必ず　いれかわれる。
      ko: |-
        튼튼하고 단단한 허물.
        지니게 한 포켓몬은 교대
        포켓몬과 반드시 교체할 수 있다.
      en: |-
        An item to be held by a Pokémon.
        This discarded carapace enables the
        holder to switch out of battle without fail.
      fr: |-
        Objet à tenir. Une carapace dure qui permet au
        porteur de se retirer même s’il est affecté par
        une attaque immobilisante.
      de: |-
        Ein Item zum Tragen. Dieser harte Panzer
        ermöglicht den Austausch des Trägers gegen
        ein wartendes Pokémon.
      es: |-
        Tabla de piedra que potencia los movimientos de
        tipo Siniestro. Debe llevarla un Pokémon.
      it: |-
        Un Pokémon con questo robusto guscio può
        sfuggire al nemico anche se questi ha usato
        mosse o abilità intrappolanti.
