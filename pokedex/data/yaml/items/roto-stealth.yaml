  flags: {  }
  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        ロトムパワーの　ひとつ。
        いっていじかん　やせいポケモンと
        ぜんぜん　であわなくなる。
      ja: |-
        ロトムパワーの　ひとつ。
        一定時間　野生ポケモンと
        ぜんぜん　出会わなくなる。
      ko: |-
        로토무파워 중 하나.
        일정 시간 야생 포켓몬과
        전혀 만나지 않게 된다.
      zh-Hant: |-
        洛托姆之力的一種。
        在一定時間內會變得
        完全無法遇見寶可夢。
      zh-Hans: |-
        洛托姆之力的一种。
        一定时间内，会变得完全
        不会遇到野生宝可梦。
      en: |-
        One of the Rotom Powers.
        It prevents you from encountering wild Pokémon for
        a certain period of time.
      fr: |-
        Une des Motism’Auras. Elle permet de ne plus
        rencontrer de Pokémon sauvages durant une
        période déterminée.
      de: |-
        Diese Rotom-Kraft bewirkt, dass für eine
        bestimmte Zeit keine wilden Pokémon erscheinen.
      es: |-
        Poder Rotom que permite evitar por completo los
        encuentros con Pokémon salvajes durante un
        tiempo determinado.
      it: |-
        Potere Rotom che permette di evitare
        l’incontro con i Pokémon selvatici
        per un certo lasso di tempo.
