        Un orbe énigmatique qui augmente son Attaque
        et son Attaque Spéciale.
      de: |-
        Ein Item, das von Pikachu getragen werden
        kann. Es erhöht den Angriffs-Wert und
        Spezial-Angriffs-Wert.
      es: |-
        Debe llevarla un Pokémon. Cada vez que este
        inflige daño, recupera algunos PS.
      it: |-
        Strumento da dare a Pikachu.
        Sfera insolita che aumenta l’Attacco e l’Attacco
        Speciale.
