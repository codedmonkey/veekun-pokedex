tm55:
  category: all-machines
  cost: 10000
  effect:
    en: 'Teaches Brine to a compatible Pokémon.'
  flags: {  }
  flavor_text:
    diamond-pearl:
      en: |-
        If the foe’s HP is down to under half,
        this attack will hit with double the
        power.
    platinum:
      en: |-
        If the foe’s HP is down to under half,
        this attack will hit with double the
        power.
    heartgold-soulsilver:
      en: |-
        If the foe’s HP is down to under half,
        this attack will hit with double the
        power.
    black-white:
      en: |-
        The user shoots boiling hot water at
        its target. It may also leave the
        target with a burn.
      fr: |-
        Envoie un jet d’eau bouillante.
        Inflige des dégâts et peut
        parfois brûler.
    black-2-white-2:
      en: |-
        The user shoots boiling hot water at
        its target. It may also leave the
        target with a burn.
    x-y:
      ja-Hrkt: |-
        あつく　にえたぎる　みずを
        はっしゃして　こうげきする。
        やけどに　することが　ある。
      ja: |-
        熱く　煮えたぎる　水を
        相手に　発射して　攻撃する。
        やけど状態に　することが　ある。
      ko: |-
        뜨겁게 끓어오르는 물을
        상대에게 발사해서 공격한다.
        화상 상태로 만들 때가 있다.
      en: |-
        The user shoots boiling hot water at
        its target. This may also leave the
        target with a burn.
      fr: |-
        L’ennemi est attaqué par un jet d’eau bouillante.
        Peut aussi le brûler.
      de: |-
        Heizt dem Ziel mit einem Schwall siedend heißen
        Kochwassers ein. Dieses erleidet eventuell
        Verbrennungen.
      es: |-
        Tras atacar, vuelve a toda prisa para dar paso a
        otro Pokémon del equipo.
      it: |-
        Chi la usa attacca il bersaglio con un getto
        d’acqua bollente che può anche scottarlo.
    sun-moon:
      ja-Hrkt: |-
        あつく　にえたぎる　みずを
        あいてに　はっしゃして　こうげきする。
        やけど　じょうたいに　することが　ある。
      ja: |-
        熱く　煮えたぎる　水を
        相手に　発射して　攻撃する。
        やけど状態に　することが　ある。
      ko: |-
        뜨겁게 끓어오르는 물을
        상대에게 발사해서 공격한다.
        화상 상태로 만들 때가 있다.
      zh-Hant: |-
        向對手噴射
        滾燙的熱水進行攻擊。
        有時會讓對手陷入灼傷狀態。
      zh-Hans: |-
        向对手喷射
        煮得翻滚的开水进行攻击。
        有时会让对手陷入灼伤状态。
      en: |-
        The user shoots boiling hot water at its target.
        This may also leave the target with a burn.
      fr: |-
        L’ennemi est attaqué par un jet d’eau bouillante.
        Peut aussi le brûler.
      de: |-
        Heizt dem Ziel mit einem Schwall siedend heißen
        Kochwassers ein. Dieses erleidet eventuell
        Verbrennungen.
      es: |-
        Abrasa al objetivo con agua hirviendo y puede
        causarle quemaduras.
      it: |-
        Chi la usa attacca il bersaglio con un getto
        d’acqua bollente che può anche scottarlo.
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        あつく　にえたぎる　みずを
        あいてに　はっしゃして　こうげきする。
        やけど　じょうたいに　することが　ある。
      ja: |-
        熱く　煮えたぎる　水を
        相手に　発射して　攻撃する。
        やけど状態に　することが　ある。
      ko: |-
        뜨겁게 끓어오르는 물을
        상대에게 발사해서 공격한다.
        화상 상태로 만들 때가 있다.
      zh-Hant: |-
        向對手噴射
        滾燙的熱水進行攻擊。
        有時會讓對手陷入灼傷狀態。
      zh-Hans: |-
        向对手喷射
        煮得翻滚的开水进行攻击。
        有时会让对手陷入灼伤状态。
      en: |-
        The user shoots boiling hot water at its target.
        This may also leave the target with a burn.
      fr: |-
        L’ennemi est attaqué par un jet d’eau bouillante.
        Peut aussi le brûler.
      de: |-
        Heizt dem Ziel mit einem Schwall siedend heißen
        Kochwassers ein. Dieses erleidet eventuell
        Verbrennungen.
      es: |-
        Abrasa al objetivo con agua hirviendo y puede
        causarle quemaduras.
      it: |-
        Chi la usa attacca il bersaglio con un getto
        d’acqua bollente che può anche scottarlo.
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        こごえる　ビームを
        あいてに　はっしゃして　こうげきする。
        こおり　じょうたいに　することが　ある。
      ja: |-
        凍える　ビームを
        相手に　発射して　攻撃する。
        こおり状態に　することが　ある。
      ko: |-
        냉동빔을
        상대에게 발사하여 공격한다.
        얼음 상태로 만들 때가 있다.
      zh-Hant: |-
        向對手發射
        冰凍光束進行攻擊。
        有時會讓對手陷入冰凍狀態。
      zh-Hans: |-
        向对手发射
        冰冻光束进行攻击。
        有时会让对手陷入冰冻状态。
      en: |-
        The target is struck with an icy-cold beam of energy.
        This may also leave the target frozen.
      fr: |-
        Un rayon de glace frappe l’ennemi.
        Peut aussi le geler.
      de: |-
        Das Ziel wird von einem Eisstrahl getroffen und friert
        eventuell ein.
      es: 'Rayo de hielo que puede llegar a congelar.'
      it: |-
        Il bersaglio è colpito da un raggio di energia gelida
        che può anche congelarlo.
    sword-shield:
      ja-Hrkt: |-
        あいてが　ＨＰの　はんぶん　くらい
        きずを　おっていると　わざの　いりょくが
        ２ばいに　なる。
      ja: |-
        相手が　ＨＰの　半分くらい
        きずを　おっていると　技の　威力が
        ２倍に　なる。
      ko: |-
        상대가 HP의 절반 정도
        상처를 입고 있으면 기술의
        위력이 2배가 된다.
      zh-Hant: |-
        當對手負傷，
        ＨＰ剩一半左右時，
        招式威力會變成２倍。
      zh-Hans: |-
        当对手的ＨＰ
        负伤到一半左右时，
        招式威力会变成２倍。
      en: |-
        If the target’s HP is half or less, this attack will hit
        with double the power.
      fr: |-
        Cette attaque est deux fois plus puissante lorsque
        l’ennemi a moins de la moitié de ses PV.
      de: |-
        Hat das Ziel die Hälfte oder weniger seiner maximalen
        KP, trifft diese Attacke mit doppelter Kraft.
      es: |-
        Si al objetivo le queda la mitad o menos de sus PS, el
        ataque será el doble de fuerte.
      it: |-
        Se i PS del bersaglio sono scesi a metà o meno,
        questa mossa colpirà con il doppio della potenza.
