    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        まんまるの　ガラスだま。
        とうめいな　たまの　なかに
        いろガラスの　もようが　みえる。
      ja: |-
        まんまるの　ガラス玉。
        透明な　玉の　中に
        色ガラスの　模様が　見える。
