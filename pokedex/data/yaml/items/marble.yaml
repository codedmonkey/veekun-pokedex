        동글동글한 유리구슬.
        투명한 구슬 안에
        색유리의 무늬가 비친다.
      zh-Hant: |-
        圓滾滾的玻璃彈珠。
        在透明的彈珠中
        能看見彩色玻璃的花紋。
      zh-Hans: |-
        非常圆润的玻璃球。
        能在透明的球体中
        看见彩色玻璃的花纹。
      en: |-
        A round glass marble. You can see colored glass
        inside the transparent marble.
      fr: |-
        Une bille de verre transparente avec un motif coloré
        à l’intérieur.
      de: |-
        Eine runde, durchsichtige Kugel aus Glas. In ihrer Mitte
        befinden sich Muster in verschiedensten Farben.
      es: |-
        Esfera de cristal transparente en cuyo interior se pueden
        apreciar diferentes colores.
      it: |-
        Una biglia di vetro perfettamente rotonda. Al suo
        interno si vede in trasparenza del vetro colorato.
