mega-tiara:
  category: unused
  cost: 0
  effect:
    en: "Unused.  This is Lisia's Key Stone in Omega Ruby and Alpha Sapphire, but it cannot be obtained by the player."
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        メガストーンを　もったまま　たたかう
        ポケモンを　メガシンカさせる
        みちのパワーを　ひめた　ティアラ。
      ja: |-
        メガストーンを　持ったまま　戦う
        ポケモンを　メガシンカさせる
        未知のパワーを　秘めた　ティアラ。
      ko: |-
        메가스톤을 지닌 채로 싸우는
        포켓몬을 메가진화시키는
        미지의 힘을 가진 티아러.
      zh-Hant: |-
        隱藏著未知力量的頭冠。
        能讓攜帶著超級石戰鬥的
        寶可夢進行超級進化。
      zh-Hans: |-
        蕴藏着未知力量的头冠。
        能让携带着超级石战斗的
        宝可梦进行超级进化。
      en: |-
        This tiara contains an untold power that somehow
        enables Pokémon carrying a Mega Stone to
        Mega Evolve in battle.
      fr: |-
        Une tiare aux pouvoirs mystérieux permettant à
        un Pokémon de méga-évoluer au combat s’il tient
        la bonne Méga-Gemme.
      de: |-
        Ein Diadem mit geheimnisvollen Kräften.
        Es ermöglicht Pokémon, die einen Mega-Stein
        tragen, eine Mega-Entwicklung durchzuführen.
      es: |-
        Tiara con un poder misterioso que permite
        megaevolucionar a Pokémon que lleven la
        Megapiedra adecuada.
      it: |-
        Diadema dotato di un misterioso potere.
        Permette a un Pokémon che ha una Megapietra
        di megaevolversi durante la lotta.
