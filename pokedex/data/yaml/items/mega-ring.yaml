mega-ring:
  category: gameplay
  cost: 0
  effect:
    en: "Allows the player's Pokémon to Mega Evolve."
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        メガストーンを　もったまま　たたかう
        ポケモンを　メガシンカさせる
        みちのパワーを　ひめた　リング。
      ja: |-
        メガストーンを　持ったまま　戦う
        ポケモンを　メガシンカさせる
        未知のパワーを　秘めた　リング。
      ko: |-
        메가스톤을 지닌 채로 싸우는
        포켓몬을 메가진화시키는
        미지의 힘을 가진 링.
      en: |-
        This ring contains an untold power that
        somehow enables Pokémon carrying
        Mega Stones to Mega Evolve in battle.
      fr: |-
        Un anneau aux pouvoirs mystérieux permettant à
        un Pokémon de méga-évoluer au combat s’il tient
        la bonne Méga-Gemme.
      de: |-
        Ein Armband mit geheimnisvollen Kräften.
        Es erlaubt Pokémon, die einen Mega-Stein tragen,
        eine Mega-Entwicklung durchzuführen.
      es: |-
        Joya de un solo uso que potencia los
        movimientos de tipo Hada.
        Debe llevarla un Pokémon.
      it: |-
        Cerchio che nasconde un misterioso potere.
        Consente a un Pokémon che ha una
        Megapietra di megaevolversi durante la lotta.
