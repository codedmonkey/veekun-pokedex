sachet:
  category: evolution
  cost: 2000
  effect:
    en: 'Traded on a Spritzee: Holder evolves into Aromatisse.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        ちょっと　きつめの　かおりをだす
        こうりょうを　つめた　ふくろ。
        ある　ポケモンが　このんでいる。
      ja: |-
        ちょっと　きつめの　香りをだす
        香料を　詰めた　袋。
        ある　ポケモンが　好んでいる。
      ko: |-
        살짝 강렬한 향기가 나는
        향료를 채운 주머니.
        어떤 포켓몬이 좋아하는 물건이다.
      en: |-
        A sachet filled with fragrant perfumes
        that are just slightly too overwhelming.
        Yet it’s loved by a certain Pokémon.
      fr: |-
        Un sachet d’herbes et d’épices, au parfum trop
        marqué pour beaucoup, mais néanmoins apprécié
        d’un certain Pokémon.
      de: |-
        Ein mit Parfüm gefüllter Beutel, der einen
        penetranten Duft verströmt und bei einer
        bestimmten Pokémon-Art sehr beliebt ist.
      es: |-
        Una de las misteriosas Megapiedras. Permite
        megaevolucionar a Houndoom en combate.
      it: |-
        Una bustina che contiene aromi dal profumo
        piuttosto intenso.
        Piace a un Pokémon in particolare.
