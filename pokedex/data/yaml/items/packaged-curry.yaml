  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        キャンプの　りょうりに　つかう
        しょくざいの　いっしゅ。かんせい　された
        レトルトカレーを　つかって　ミスをふせぐ。
      ja: |-
        キャンプの　料理に　使う
        食材の　一種。完成　された
        レトルトカレーを　使って　ミスを防ぐ。
      ko: |-
        캠프 요리에 사용되는
        식재료 중 하나. 완성된 레토르트카레를
        사용해서 실패를 막는다.
      zh-Hant: |-
        製作露營料理時使用的食材之一。
        使用現成的即食咖哩，
        可以避免失敗。
      zh-Hans: |-
        在露营营地制作料理时会使用的
        一种食材。使用这种成品速食咖喱，
        可以有效预防失误。
      en: |-
        One of the many ingredients that can be used for
        cooking at your camp. Using packaged curry helps
        make sure there are no slipups when cooking.
      fr: |-
        Un ingrédient de cuisine pour le camping.
        À ajouter au curry pour corriger les erreurs
        de préparation.
      de: |-
        Eine Zutat für PokéCamping-Mahlzeiten. Da bei einem
        Fertigcurry der Name Programm ist, kann beim Kochen
        nichts schiefgehen.
      es: |-
        Un ingrediente para cocinar en el campamento. Este
        curri precocinado nunca falla.
      it: |-
        Uno degli ingredienti che puoi usare per cucinare
        in campeggio. Questo prodotto precotto permette
        di andare a colpo sicuro ed evitare brutte sorprese.
