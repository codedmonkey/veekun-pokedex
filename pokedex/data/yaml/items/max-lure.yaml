  flavor_text:
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        つかうと　めずらしい　ポケモンが
        でて　きやすく　なる　こうすい。
        シルバーコロンより　ながく　もつ。
      ja: |-
        使うと　珍しい　ポケモンが
        出て　きやすく　なる　香水。
        シルバーコロンより　長く　もつ。
      ko: |-
        사용하면 희귀한 포켓몬이
        나오기 쉬워지는 향수.
        실버코롱보다 효과가 오래간다.
      zh-Hant: |-
        使用後，讓稀有寶可夢
        變得容易出現的香水。
        效果比白銀香水更持久。
      zh-Hans: |-
        使用该香水后，
        稀有宝可梦会更容易出现。
        效果比白银香水更持久。
      en: |-
        A glass bottle of perfume that makes rare Pokémon
        more likely to appear. It lasts longer than a Super Lure.
      fr: |-
        Une substance qui fait apparaître les Pokémon rares
        plus facilement pendant une durée plus longue que
        le Super Parfum.
      de: |-
        Ein Parfüm, das für kurze Zeit vermehrt
        seltene Pokémon erscheinen lässt.
        Wirkt länger als das Item Super-Lockparfüm.
      es: |-
        Colonia que atrae a los Pokémon raros y cuyo efecto
        es algo más duradero que el de la Supercolonia.
      it: |-
        Profumo che attira Pokémon rari.
        Il suo effetto dura più a lungo di quello
        del Superprofumo.
