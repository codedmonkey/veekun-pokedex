tm48:
  category: all-machines
  cost: 1000
  effect:
    en: 'Teaches Skill Swap to a compatible Pokémon.'
  flags: {  }
  flavor_text:
    ruby-sapphire:
      en: |-
        Switches abilities
        with the foe on the
        turn this is used.
    emerald:
      en: |-
        Switches abilities
        with the foe on the
        turn this is used.
    firered-leafgreen:
      en: |-
        The user employs
        its psychic power
        to swap abilities
        with the foe.
    diamond-pearl:
      en: |
        The user employs its psychic power to
        exchange abilities with the foe.
    platinum:
      en: |
        The user employs its psychic power to
        exchange abilities with the foe.
    heartgold-soulsilver:
      en: |
        The user employs its psychic power to
        exchange abilities with the foe.
    black-white:
      en: |-
        The user attacks the target with a
        song. Others can join in the Round and
        make the attack do greater damage.
      fr: |-
        Le lanceur chante et attaque l’ennemi.
        Si plusieurs Pokémon déclenchent cette
        attaque à la suite, l’effet augmente.
    black-2-white-2:
      en: |-
        The user attacks the target with a
        song. Others can join in the Round and
        make the attack do greater damage.
    x-y:
      ja-Hrkt: |-
        うたで　あいてを　こうげきする。
        みんなで　つかうと　れんぞくで
        だせて　いりょくも　あがる。
      ja: |-
        歌で　相手を　攻撃する。
        みんなで　輪唱すると　続けて
        だすことが　でき　威力も　あがる。
      ko: |-
        노래로 상대를 공격한다.
        함께 돌림노래를 하면 계속해서
        쓸 수 있고 위력도 올라간다.
      en: |-
        The user attacks the target with a song.
        Others can join in the Round and make
        the attack do greater damage.
      fr: |-
        Le lanceur attaque l’ennemi en chantant.
        Si plusieurs Pokémon déclenchent cette attaque
        à la suite, l’effet augmente.
      de: |-
        Angriff mit Gesang. Singt der Anwender mit allen
        im Kanon, kann er die Attacke mehrfach auslösen
        und die Stärke steigt.
      es: |-
        Quien lo usa ataca con una afilada garra de
        sombras. Su índice de golpe crítico es muy alto.
      it: |-
        Attacca il bersaglio con una melodia. Se usata
        durante lo stesso turno da più Pokémon, i danni
        inflitti aumentano.
    sun-moon:
      ja-Hrkt: |-
        うたで　あいてを　こうげきする。
        みんなで　りんしょう　すると　つづけて
        だすことが　でき　いりょくも　あがる。
      ja: |-
        歌で　相手を　攻撃する。
        みんなで　輪唱すると　続けて
        だすことが　でき　威力も　あがる。
      ko: |-
        노래로 상대를 공격한다.
        함께 돌림노래를 하면 계속해서
        쓸 수 있고 위력도 올라간다.
      zh-Hant: |-
        用歌聲攻擊對手。
        大家一起輪唱便可以接連使出，
        威力也會提高。
      zh-Hans: |-
        用歌声攻击对手。
        同伴还可以接着使出轮唱招式，
        威力也会提高。
      en: |-
        The user attacks the target with a song. Others
        can join in the Round to increase the power of
        the attack.
      fr: |-
        Le lanceur attaque l’ennemi en chantant.
        Si plusieurs Pokémon déclenchent cette attaque
        à la suite, l’effet augmente.
      de: |-
        Angriff mit Gesang. Singt der Anwender mit allen im
        Kanon, kann er die Attacke mehrfach auslösen und
        die Stärke steigt.
      es: |-
        Canto que sirve de ataque. Su fuerza aumenta
        cuantos más Pokémon lo usan en cadena.
      it: |-
        Attacca il bersaglio con una melodia. Se usata
        durante lo stesso turno da più Pokémon, i danni
        inflitti aumentano.
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        うたで　あいてを　こうげきする。
        みんなで　りんしょう　すると　つづけて
        だすことが　でき　いりょくも　あがる。
      ja: |-
        歌で　相手を　攻撃する。
        みんなで　輪唱すると　続けて
        だすことが　でき　威力も　あがる。
      ko: |-
        노래로 상대를 공격한다.
        함께 돌림노래를 하면 계속해서
        쓸 수 있고 위력도 올라간다.
      zh-Hant: |-
        用歌聲攻擊對手。
        大家一起輪唱便可以接連使出，
        威力也會提高。
      zh-Hans: |-
        用歌声攻击对手。
        同伴还可以接着使出轮唱招式，
        威力也会提高。
      en: |-
        The user attacks the target with a song. Others
        can join in the Round to increase the power of
        the attack.
      fr: |-
        Le lanceur attaque l’ennemi en chantant.
        Si plusieurs Pokémon déclenchent cette attaque
        à la suite, l’effet augmente.
      de: |-
        Angriff mit Gesang. Singt der Anwender mit allen im
        Kanon, kann er die Attacke mehrfach auslösen und
        die Stärke steigt.
      es: |-
        Canto que sirve de ataque. Su fuerza aumenta
        cuantos más Pokémon lo usan en cadena.
      it: |-
        Attacca il bersaglio con una melodia. Se usata
        durante lo stesso turno da più Pokémon, i danni
        inflitti aumentano.
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        つよい　こうせんを
        あいてに　はっしゃして　こうげきする。
        つぎの　ターンは　うごけなく　なる。
      ja: |-
        強い　光線を
        相手に　発射して　攻撃する。
        次の　ターンは　動けなくなる。
      ko: |-
        강한 광선을
        상대에게 발사하여 공격한다.
        다음 턴은 움직일 수 없다.
      zh-Hant: |-
        向對手發射
        強烈的光線進行攻擊。
        下一回合自己將無法動彈。
      zh-Hans: |-
        向对手发射
        强烈的光线进行攻击。
        下一回合自己将无法动弹。
      en: |-
        The target is attacked with a powerful beam.
        The user can’t move on the next turn.
      fr: |-
        Projette un puissant rayon sur l’ennemi.
        Le lanceur doit se reposer au tour suivant.
      de: |-
        Starke Attacke, die den Anwender zwingt,
        eine Runde auszusetzen.
      es: |-
        Es eficaz, pero el atacante deberá descansar en el 
        siguiente turno.
      it: |-
        Colpisce il bersaglio con un potente raggio.
        Chi la usa salta il turno successivo per recuperare
        energia.
    sword-shield:
      ja-Hrkt: |-
        がんせきを　なげつけて　こうげきする。
        あいての　うごきを　ふうじることで
        すばやさを　さげる。
      ja: |-
        岩石を　投げつけて　攻撃する。
        相手の　動きを　封じることで
        素早さを　さげる。
      ko: |-
        암석을 내던져서 공격한다.
        상대의 움직임을 봉인함으로써
        스피드를 떨어뜨린다.
      zh-Hant: |-
        投擲岩石進行攻擊。
        封住對手的行動，
        進而降低其速度。
      zh-Hans: |-
        投掷岩石进行攻击。
        封住对手的行动，
        从而降低速度。
      en: |-
        Boulders are hurled at the target. This also lowers
        the target’s Speed stat by preventing its movement.
      fr: |-
        Des rochers frappent l’ennemi.
        Réduit aussi sa Vitesse.
      de: |-
        Angriff mit Felsen. Bei Erfolg wird der Initiative-Wert
        des Zieles gesenkt.
      es: |-
        Tira rocas que detienen al objetivo y bajan su
        Velocidad.
      it: |-
        Colpisce il bersaglio con rocce. Inoltre, lo rallenta
        riducendone la Velocità.
