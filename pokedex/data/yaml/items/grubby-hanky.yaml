  flavor_text:
    black-2-white-2:
      en: |-
        A handkerchief dropped by
        a regular at Café Warehouse.
        It smells faintly like a Pokémon.
    x-y:
      ja-Hrkt: |-
        シッポウシティにある　カフェソーコの
        じょうれんが　おとした　ハンカチ。
        ほのかに　ポケモンの　かおりがする。
      ja: |-
        シッポウシティにある　カフェソーコの
        常連が　落とした　ハンカチ。
        ほのかに　ポケモンの　香りがする。
      ko: |-
        칠보시티에 있는 카페 갤러지의
        단골손님이 떨어뜨린 손수건.
        희미하게 포켓몬의 냄새가 난다.
      en: |-
        A handkerchief dropped by
        a regular at Café Warehouse.
        It smells faintly like a Pokémon.
      fr: |-
        Un mouchoir égaré par un habitué du Café de
        la Grange. Il sent légèrement le Pokémon.
      de: |-
        Ein Taschentuch, das ein Stammkunde im
        Café Lagerhaus in Septerna City verloren hat.
        Riecht leicht nach Pokémon.
      es: |-
        Al usarse en un huerto de bayas, provoca
        extrañas mutaciones según la combinación de
        las mismas.
      it: |-
        Pezzo di stoffa perso al Bar Magazzino
        di Zefiropoli da un cliente abituale.
        Odora leggermente di Pokémon.
