sassy-mint:
  category: nature-mints
  cost: 20
  effect: {  }
  flags: {  }
  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        ポケモンに　かおりを　かがせると
        とくぼうが　あがりやすく　なるが
        すばやさは　あがりにくくなる　ミント。
      ja: |-
        ポケモンに　香りを　かがせると
        特防が　上がりやすく　なるが
        素早さは　上がりにくくなる　ミント。
      ko: |-
        포켓몬에게 향기를 맡게 하면
        특수방어가 오르기 쉬워지지만
        스피드가 오르기 어려워지는 민트.
      zh-Hant: |-
        讓寶可夢聞這種薄荷的氣味，
        會令特防變得容易提高，
        但速度則難以提高。
      zh-Hans: |-
        宝可梦闻了这种薄荷之后，
        会令特防容易提高，
        而速度则难以提高。
      en: |-
        When a Pokémon smells this mint, its Sp. Def will grow
        more easily, but its Speed will grow more slowly.
      fr: |-
        Si un Pokémon hume cet aromate, sa Défense Spéciale
        montera plus facilement, mais sa Vitesse
        se développera plus lentement.
      de: |-
        Lässt man ein Pokémon an dieser Minze schnuppern,
        steigt seine Spezial-Verteidigung schneller, aber seine
        Initiative umso langsamer.
      es: |-
        Cuando un Pokémon percibe su aroma, aumenta con
        más facilidad su Defensa Especial, en detrimento de su
        Velocidad.
      it: |-
        Quando un Pokémon ne sente il profumo,
        la sua Difesa Speciale aumenta più facilmente
        a scapito della Velocità.
