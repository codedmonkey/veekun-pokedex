    black-white:
      en: |-
        The user summons a heavy rain that
        falls for five turns, powering up
        Water-type moves.
      fr: |-
        Invoque de fortes pluies qui durent
        5 tours et améliorent les capacités
        de type Eau.
    black-2-white-2:
      en: |-
        The user summons a heavy rain that
        falls for five turns, powering up
        Water-type moves.
    x-y:
      ja-Hrkt: |-
        ５ターンの　あいだ　あめを　ふらして
        みずタイプの　わざの　いりょくを
        あげる。
      ja: |-
        ５ターンの　あいだ　雨を　降らして
        みずタイプの
        技の　威力を　あげる。
      ko: |-
        5턴 동안 비를 내려서
        물타입 기술의 위력을 올린다.
      en: |-
        The user summons a heavy rain
        that falls for five turns, powering
        up Water-type moves.
      fr: |-
        Invoque de fortes pluies qui durent cinq tours
        et augmentent la puissance des capacités de
        type Eau.
      de: |-
        Schwerer Niederschlag setzt für 5 Runden ein.
        Attacken vom Typ Wasser werden verstärkt.
      es: |-
        Abrasa al objetivo con una intensa llamarada que
        puede causarle quemaduras.
      it: |-
        Chi la usa provoca una forte pioggia per cinque
        turni, potenziando le mosse di tipo Acqua.
    sun-moon:
      ja-Hrkt: |-
        ５ターンの　あいだ　あめを　ふらせて
        みずタイプの　いりょくを　あげる。
        ほのおタイプの　いりょくは　さがる。
      ja: |-
        ５ターンの　あいだ　雨を　降らせて
        みずタイプの　威力を　あげる。
        ほのおタイプの　威力は　さがる。
      ko: |-
        5턴 동안 비를 내리게 하여
        물타입 기술의 위력을 올린다.
        불꽃타입의 위력은 떨어진다.
      zh-Hant: |-
        降下大雨，在５回合內
        提高水屬性招式的威力。
        火屬性招式的威力會降低。
      zh-Hans: |-
        在５回合内一直降雨，
        从而提高水属性的招式威力。
        火属性的招式威力则降低。
      en: |-
        The user summons a heavy rain that falls for five
        turns, powering up Water-type moves. It lowers
        the power of Fire-type moves.
      fr: |-
        Invoque de fortes pluies qui durent cinq tours,
        augmentant la puissance des capacités de type
        Eau et baissant celle des capacités de type Feu.
      de: |-
        Schwerer Niederschlag setzt für 5 Runden ein.
        Attacken vom Typ Wasser werden verstärkt und
        Attacken vom Typ Feuer geschwächt.
      es: |-
        Quien lo usa invoca una fuerte lluvia que dura cinco
        turnos. La potencia de los movimientos de tipo
        Agua aumenta y la de los de tipo Fuego disminuye.
      it: |-
        Chi la usa provoca una forte pioggia per cinque
        turni, potenziando le mosse di tipo Acqua e
        riducendo la potenza di quelle di tipo Fuoco.
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        ５ターンの　あいだ　あめを　ふらせて
        みずタイプの　いりょくを　あげる。
        ほのおタイプの　いりょくは　さがる。
      ja: |-
        ５ターンの　あいだ　雨を　降らせて
        みずタイプの　威力を　あげる。
        ほのおタイプの　威力は　さがる。
      ko: |-
        5턴 동안 비를 내리게 하여
        물타입 기술의 위력을 올린다.
        불꽃타입의 위력은 떨어진다.
      zh-Hant: |-
        降下大雨，在５回合內
        提高水屬性招式的威力。
        火屬性招式的威力會降低。
      zh-Hans: |-
        在５回合内一直降雨，
        从而提高水属性的招式威力。
        火属性的招式威力则降低。
      en: |-
        The user summons a heavy rain that falls for five
        turns, powering up Water-type moves. It lowers
        the power of Fire-type moves.
      fr: |-
        Invoque de fortes pluies qui durent cinq tours,
        augmentant la puissance des capacités de type
        Eau et baissant celle des capacités de type Feu.
      de: |-
        Schwerer Niederschlag setzt für 5 Runden ein.
        Attacken vom Typ Wasser werden verstärkt und
        Attacken vom Typ Feuer geschwächt.
      es: |-
        Quien lo usa invoca una fuerte lluvia que dura cinco
        turnos. La potencia de los movimientos de tipo
        Agua aumenta y la de los de tipo Fuego disminuye.
      it: |-
        Chi la usa provoca una forte pioggia per cinque
        turni, potenziando le mosse di tipo Acqua e
        riducendo la potenza di quelle di tipo Fuoco.
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        こうげき　したあと
        ものすごい　スピードで　もどってきて
        ひかえ　ポケモンと　いれかわる。
      ja: |-
        攻撃したあと
        ものすごい　スピードで　もどってきて
        控えの　ポケモンと　入れ替わる。
      ko: |-
        공격한 뒤
        굉장한 스피드로 돌아와서
        교대 포켓몬과 교체한다.
      zh-Hant: |-
        攻擊後迅速返回，
        和後備寶可夢進行替換。
      zh-Hans: |-
        在攻击之后急速返回，
        和后备宝可梦进行替换。
      en: |-
        After making its attack, the user rushes back to
        switch places with a party Pokémon in waiting.
      fr: |-
        Après son attaque, le lanceur revient à toute vitesse
        et change de place avec un Pokémon de l’équipe
        prêt au combat.
      de: |-
        Nach der Attacke eilt der Anwender zurück und
        tauscht den Platz mit einem anderen Pokémon.
      es: |-
        Tras atacar, vuelve a toda prisa para dar paso a 
        otro Pokémon del equipo.
      it: |-
        Chi usa questa mossa fa marcia indietro per farsi
        sostituire dopo aver sferrato l’attacco.
    sword-shield:
      ja-Hrkt: |-
        ５ターンの　あいだ　ふしぎな　かべで
        あいてから　うける　ぶつり　こうげきの
        ダメージを　よわめる。
      ja: |-
        ５ターンの　間　不思議な　かべで
        相手から　受ける　物理攻撃の
        ダメージを　弱める。
      ko: |-
        5턴 동안 이상한 장막을 쳐서
        상대로부터 받는 물리공격의
        데미지를 약하게 한다.
      zh-Hant: |-
        利用神奇的屏障，
        在５回合內減輕
        來自對手的物理攻擊傷害。
      zh-Hans: |-
        利用神奇的墙壁，
        在５回合内减弱从对手那里
        受到的物理攻击的伤害。
      en: |-
        A wondrous wall of light is put up to reduce damage
        from physical attacks for five turns.
      fr: |-
        Crée un fabuleux mur de lumière qui réduit les dégâts
        causés par les capacités physiques pendant cinq tours.
      de: |-
        Eine mysteriöse Wand, die für fünf Runden den Schaden
        von physischen gegnerischen Treffern reduziert.
      es: |-
        Pared de luz que reduce durante cinco turnos el daño
        producido por los ataques físicos.
      it: |-
        Innalza una barriera misteriosa che riduce i danni degli
        attacchi fisici per sé e gli alleati per cinque turni.
