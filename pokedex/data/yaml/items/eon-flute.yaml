eon-flute:
  category: gameplay
  cost: 0
  effect:
    en: 'Summons Latias or Latios for a ride.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        どこに　いても
        ラティオスや　ラティアスを
        よびよせることが　できる　ふえ。
      ja: |-
        どこに　いても
        ラティオスや　ラティアスを
        呼び寄せることが　できる　笛。
      ko: |-
        어디에 있든지
        라티오스나 라티아스를
        부를 수 있는 피리.
      zh-Hant: |-
        無論身在何處，
        都能召喚拉帝歐斯或
        拉帝亞斯的笛子。
      zh-Hans: |-
        无论身在何处，
        都能召唤拉帝欧斯或
        拉帝亚斯的笛子。
      en: |-
        A flute that can be used to summon Latios or Latias
        no matter where you are.
      fr: |-
        Une flûte capable d’appeler Latios ou Latias
        où que l’on soit.
      de: |-
        Eine Flöte, mit der man Latios oder Latias
        herbeirufen kann, egal wo sie sich gerade befinden.
      es: |-
        Flauta capaz de invocar a Latios o Latias en
        cualquier lugar.
      it: |-
        Suonando questo flauto è possibile richiamare
        Latios o Latias ovunque ci si trovi.
