        지니게 하면 자신이 헤롱헤롱해졌을 때
        상대도 헤롱헤롱해지게 된다.
      zh-Hant: |-
        長長的大紅色細線。
        攜帶後，陷入著迷狀態時，
        也能使對手陷入著迷狀態。
      zh-Hans: |-
        长长的鲜红色细线。
        携带后，在自己着迷时
        能让对手也着迷。
      en: |-
        An item to be held by a Pokémon. If the holder
