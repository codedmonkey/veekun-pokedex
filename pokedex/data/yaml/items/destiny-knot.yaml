destiny-knot:
  category: held-items
  cost: 4000
  effect:
    en: 'Held: When the holder becomes Attracted, the Pokémon it is Attracted to becomes Attracted back.'
  flags:
    - holdable
    - holdable-active
  flavor_text:
    diamond-pearl:
      en: |-
        A long, thin, bright red string to
        be held by a Pokémon. If the holder
        becomes infatuated, the foe does too.
    platinum:
      en: |-
        A long, thin, bright red string to
        be held by a Pokémon. If the holder
        becomes infatuated, the foe does too.
    heartgold-soulsilver:
      en: |-
        A long, thin, bright red string to
        be held by a Pokémon. If the holder
        becomes infatuated, the foe does too.
    black-white:
      en: |-
        A long, thin, bright-red string to
        be held by a Pokémon. If the holder
        becomes infatuated, the foe does too.
      fr: |-
        Un long fil rouge vif à faire tenir à un
        Pokémon. Si le porteur succombe à
        l’attirance, l’ennemi aussi.
    black-2-white-2:
      en: |-
        A long, thin, bright-red string to
        be held by a Pokémon. If the holder
        becomes infatuated, the foe does too.
    x-y:
      ja-Hrkt: |-
        ほそくて　ながい　まっかな　いと。
        もたせると　メロメロに　なったとき
        あいても　メロメロに　できる。
      ja: |-
        細くて　長い　真っ赤な　糸。
        持たせると　メロメロに　なったとき
        相手も　メロメロに　できる。
      ko: |-
        가늘고 긴 새빨간 실.
        지니게 하면 자신이 헤롱헤롱해졌을 때
        상대도 헤롱헤롱해지게 된다.
      en: |-
        An item to be held by a Pokémon.
        If the holder becomes infatuated,
        the opposing Pokémon will be, too.
      fr: |-
        Un long fil rouge vif à faire tenir à un Pokémon.
        Si le porteur tombe amoureux, l’ennemi
        aussi.
      de: |-
        Ein Item zum Tragen. Wird der Träger betört,
        gilt dies auch für den Angreifer.
      es: |-
        Potencian el Ataque Especial, pero solo permiten
        usar un movimiento. Debe llevarlas un Pokémon.
      it: |-
        Gomitolo di filo rosso sottile da dare a un
        Pokémon. Se il Pokémon rimane infatuato,
        contagia anche il nemico.
    sun-moon:
      ja-Hrkt: |-
        ほそくて　ながい　まっかな　いと。
        もたせると　メロメロに　なったとき
        あいても　メロメロに　できる。
      ja: |-
        細くて　長い　真っ赤な　糸。
        持たせると　メロメロに　なったとき
        相手も　メロメロに　できる。
      ko: |-
