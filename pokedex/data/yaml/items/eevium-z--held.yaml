eevium-z--held:
  category: z-crystals
  cost: 0
  effect:
    en: 'Held: Allows []{pokemon:eevee} to upgrade []{move:last-resort} into []{move:extreme-evoboost}.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        Ｚパワーの　けっしょう。
        イーブイの　とっておきを
        Ｚワザに　グレードアップする。
      ja: |-
        Ｚパワーの　結晶。
        イーブイの　とっておきを
        Ｚワザに　グレードアップする。
      ko: |-
        Z파워의 결정.
        이브이의 뒀다쓰기를
        Z기술로 업그레이드한다.
      zh-Hant: |-
        Ｚ力量的結晶。
        會把伊布的珍藏
        升級為Ｚ招式。
      zh-Hans: |-
        Ｚ力量的结晶。
        会将伊布的珍藏
        升级成Ｚ招式。
      en: |-
        This is a crystallized form of Z-Power.
        It upgrades Eevee’s Last Resort to a Z-Move.
      fr: |-
        Une cristallisation de la Force Z, permettant
        de transformer le Dernier Recours d’un Évoli
        en capacité Z.
      de: |-
        Ein Kristall, dem Z-Kraft innewohnt.
        Er stuft Evolis Attacke Zuflucht
        zu einer Z-Attacke auf.
      es: |-
        Cristal que confiere el Poder Z al movimiento
        Última Baza de Eevee.
      it: |-
        Cristallo in cui è immagazzinato il Potere Z.
        Consente di trasformare la mossa Ultimascelta
        di Eevee in una mossa Z.
