  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        さいだい　４にんで　つうわができる
        テレビカメラきのうつきの
        さいしんがた　トランシーバー。
      ja: |-
        最大４人で　通話ができる
        テレビカメラ機能つきの
        最新型トランシーバー。
      ko: |-
        영상 통화 기능이 내장된
        최신식 무전기.
        최대 4명이 동시에 통화할 수 있다.
      zh-Hant: |-
        附影像鏡頭功能，
        最多能讓４人進行通話的
        最新型對講機。
      zh-Hans: |-
        带摄像头功能，
        最多能让４人进行通话的
        最新型对讲机。
      en: |-
        A high-tech transceiver with a camera function.
        It allows up to four-way calls.
      fr: |-
        Un transmetteur high-tech permettant à quatre
        personnes de communiquer par le son et l’image.
      de: |-
        Ein hochmodernes Gerät, mit dem bis zu vier
        Personen miteinander kommunizieren können.
        Es ermöglicht sogar Video-Chat!
      es: |-
        Comunicador de alta tecnología con cámara que
        permite hablar a cuatro personas a la vez.
      it: |-
        Ricetrasmittente all’avanguardia che permette
        di fare videochiamate con un gruppo massimo
        di quattro persone.
