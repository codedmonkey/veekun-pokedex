        낮을수록 위력은 올라간다.
      zh-Hant: |-
        高速旋轉身體，撞擊對手。
        速度比對手越慢，威力越大。
      zh-Hans: |-
        让身体高速旋转并撞击对手。
        速度比对手越慢，威力越大。
      en: |-
