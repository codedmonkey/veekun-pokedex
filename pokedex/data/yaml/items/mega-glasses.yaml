mega-glasses:
  category: unused
  cost: 0
  effect:
    en: "Unused.  This is Maxie's Key Stone in Omega Ruby and Alpha Sapphire, but it cannot be obtained by the player."
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        メガストーンを　もったまま　たたかう
        ポケモンを　メガシンカさせる
        みちのパワーを　ひめた　メガネ。
      ja: |-
        メガストーンを　持ったまま　戦う
        ポケモンを　メガシンカさせる
        未知のパワーを　秘めた　メガネ。
      ko: |-
        메가스톤을 지닌 채로 싸우는
        포켓몬을 메가진화시키는
        미지의 힘을 가진 안경.
      zh-Hant: |-
        隱藏著未知力量的眼鏡。
        能讓攜帶著超級石戰鬥的
        寶可夢進行超級進化。
      zh-Hans: |-
        蕴藏着未知力量的眼镜。
        能让携带着超级石战斗的
        宝可梦进行超级进化。
      en: |-
        These glasses contain an untold power that
        somehow enables Pokémon carrying a Mega Stone
        to Mega Evolve in battle.
      fr: |-
        Des lunettes aux pouvoirs mystérieux permettant à
        un Pokémon de méga-évoluer au combat s’il tient
        la bonne Méga-Gemme.
      de: |-
        Eine Brille mit geheimnisvollen Kräften.
        Sie ermöglicht Pokémon, die einen Mega-Stein
        tragen, eine Mega-Entwicklung durchzuführen.
      es: |-
        Gafas con un poder misterioso que permiten
        megaevolucionar a Pokémon que lleven la
        Megapiedra adecuada.
      it: |-
        Occhiali dotati di un misterioso potere.
        Permettono a un Pokémon che ha una Megapietra
        di megaevolversi durante la lotta.
