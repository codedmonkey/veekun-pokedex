protective-pads:
  category: held-items
  cost: 4000
  effect:
    en: 'Held: Prevents side effects of contact moves used on the holder.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        こうげき　する　あいてに
        さわって　うける　こうかを
        うけないように　する。
      ja: |-
        攻撃　する　相手に
        さわって　受ける　効果を
        受けないように　する。
      ko: |-
        공격하는 상대와
        접촉해서 받게 되는
        효과를 받지 않게 한다.
      zh-Hant: |-
        觸碰要攻擊的對手時，
        不會受到本應受到的效果。
      zh-Hans: |-
        不会受到触碰攻击对手时
        本应受到的效果。
      en: |-
        An item to be held by a Pokémon. These pads
        protect the holder from effects caused by
        making direct contact with the target.
      fr: |-
        Annule les effets subis par le porteur quand il
        utilise une attaque directe sur un autre Pokémon.
      de: |-
        Greift der Träger ein Ziel an, ist er vor Effekten,
        die durch direkten Kontakt mit diesem ausgelöst
        werden, geschützt.
      es: |-
        Protege al Pokémon de los efectos que le produciría
        el contacto directo en combate.
      it: |-
        Elimina gli effetti causati da attacchi diretti subiti
        dal Pokémon.
