  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        もっていると　ポケモンが　えられる
        けいけんちが　ふえる　おまもり。
        きかいのような　ものが　はいっている。
      ja: |-
        持っていると　ポケモンが　得られる
        経験値が　増える　おまもり。
        機械のような　ものが　入っている。
      ko: |-
        지니고 있으면 포켓몬이 받는
        경험치가 늘어나는 부적.
        기계 같은 것이 들어 있다.
      zh-Hant: |-
        只要擁有這個護符，
        寶可夢能獲得的經驗值就會增加。
        內部有類似機械的東西。
      zh-Hans: |-
        训练家拥有这个护符后，
        宝可梦获得的经验值就会增加。
        里面装有类似于机器的部件。
      en: |-
        A charm that increases the Exp. Points that Pokémon
        can get. A machine-like object is inside the charm.
      fr: |-
        Un charme permettant aux Pokémon de gagner
        davantage de Points d’Expérience. Il renferme
        une espèce de mécanisme.
      de: |-
        Ein Glücksbringer, der Pokémon mehr Erfahrungspunkte
        erhalten lässt. Im Inneren scheint eine Art Maschine zu
        stecken.
      es: |-
        Amuleto que aumenta los Puntos de Experiencia que
        reciben los Pokémon. Su interior contiene una especie
        de mecanismo.
      it: |-
        Un amuleto che fa aumentare i Punti Esperienza
        che i Pokémon possono ottenere.
        Pare che contenga dei componenti meccanici.
