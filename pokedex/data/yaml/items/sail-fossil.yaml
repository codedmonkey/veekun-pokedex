sail-fossil:
  category: dex-completion
  cost: 7000
  effect:
    en: 'Can be revived into an Amaura.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        おおむかし　ちじょうで　くらした
        こだい　ポケモンの　カセキ。
        くびの　ヒレの　いちぶ　らしい。
      ja: |-
        大昔　地上で　暮らした
        古代ポケモンの　カセキ。
        首の　ヒレの　一部らしい。
      ko: |-
        오랜 옛날 지상에서 살았던
        고대 포켓몬의 화석.
        목지느러미의 일부인 듯하다.
      en: |-
        A fossil from a prehistoric Pokémon
        that once lived on the land. It looks
        like the impression from a skin sail.
      fr: |-
        Le fossile d’un Pokémon préhistorique terrestre.
        On dirait un fragment de nageoire.
      de: |-
        Das Fossil eines uralten Pokémon, das an Land
        lebte. Es sieht wie eine Flosse aus.
      es: ''
      it: |-
        Fossile di un Pokémon preistorico che viveva
        sulla terraferma. Sembra far parte di una pinna.
