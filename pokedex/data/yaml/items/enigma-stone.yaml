enigma-stone:
  category: event-items
  cost: 0
  effect:
    en: |-
      When taken to the []{location:pewter-city} museum, causes []{pokemon:latias} or []{pokemon:latios} to attack the trainer.

      The Pokémon to appear will be whicher can't be encountered roaming in the wild.
  flags: {  }
  flavor_text:
    heartgold-soulsilver:
      en: |-
        A crystal ball that was excavated from
        the ground. A very beautiful stone that
        is covered with bits of rock and earth.
    black-white:
      en: |-
        A crystal ball that was excavated from
        the ground. A very beautiful stone that
        is covered with bits of rock and earth.
      fr: |-
