        Speed stat.
    black-white:
      en: |-
        Using it on a Pokémon makes it more
        friendly, but it also lowers its base
        Speed stat.
      fr: |-
        Rend les Pokémon plus amicaux, mais
        baisse leur stat Vitesse de base.
    black-2-white-2:
      en: |-
        Using it on a Pokémon makes it more
        friendly, but it also lowers its base
        Speed stat.
    x-y:
      ja-Hrkt: |-
        ポケモンに　あげると
        とても　なつき　やすくなるが
        すばやさの　きそポイントは　さがる。
      ja: |-
        ポケモンに　あげると
        とても　なつき　やすくなるが
        素早さの　基礎ポイントは　さがる。
      ko: |-
        포켓몬에게 주면
        매우 친밀해지기 쉬워지지만
        스피드의 기초 포인트가 떨어진다.
      en: |-
        A Berry to be consumed by Pokémon.
        Using it on a Pokémon makes it more
        friendly but lowers its base Speed.
      fr: |-
        Une Baie qui rend les Pokémon plus amicaux,
        mais baisse leur Vitesse de base.
      de: |-
        Isst ein Pokémon diese Beere, stärkt dies
        eure Freundschaft, verringert aber seinen
        Initiative-Basiswert.
      es: |-
        Si la lleva un Pokémon, debilita un ataque
        supereficaz de tipo Tierra de un enemigo.
      it: |-
        Usata su un Pokémon, lo rende più amichevole,
        ma ne diminuisce i punti base della Velocità.
