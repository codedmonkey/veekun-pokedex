starf-berry:
  category: in-a-pinch
  cost: 80
  effect:
    en: |-
      Held in battle
      :   When the holder has 1/4 its max [HP]{mechanic:hp} remaining or less, it consumes this item to [raise]{mechanic:raise} a random stat by two stages.
  flags:
    - holdable-active
  flavor_text:
    ruby-sapphire:
      en: |-
        A hold item that
        sharply boosts a
        stat in a pinch.
    emerald:
      en: |-
        A hold item that
        sharply boosts a
        stat in a pinch.
    firered-leafgreen:
      en: |-
        When held by a POKéMON, it sharply
        raises one stat in a pinch.
    diamond-pearl:
