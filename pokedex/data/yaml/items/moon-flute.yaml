moon-flute:
  category: plot-advancement
  cost: 0
  effect:
    en: 'Evolves Nebby into Lunala when used at the Altar of the Moone.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        つきの　でんせつポケモンに
        かんしゃの　きもちを　あらわすため
        ねいろを　ささげていた　という。
      ja: |-
        月の　伝説ポケモンに
        感謝の　気持ちを　表すため
        音色を　捧げていた　という。
      ko: |-
        달의 전설포켓몬에게
        감사의 마음을 표현하기 위해
        음색을 바쳤다고 한다.
      zh-Hant: |-
        為了對月亮的
        傳說的寶可夢表達感激之情，
        據說會用牠來獻上美樂。
      zh-Hans: |-
        为了对月亮的
        传说的宝可梦表达感激之情，
        据说会用它来献上美乐。
      en: |-
        It is said that the tones it produces were offered
        up as an expression of gratitude to the Legendary
        Pokémon of the moon.
      fr: |-
        Une flûte dont le timbre permettait d’exprimer
        sa reconnaissance au Pokémon légendaire
        de la lune.
      de: |-
        Auf dieser Flöte soll eine Melodie gespielt worden
        sein, um dem Legendären Mond-Pokémon Dank zu
        sagen.
      es: |-
        Flauta que se hace sonar como muestra de
        gratitud hacia el Pokémon legendario de la luna.
      it: |-
        Flauto il cui dolce suono esprime la riconoscenza
        degli esseri umani verso il Pokémon leggendario
        della luna.
