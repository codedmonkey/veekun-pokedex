tm28:
  category: all-machines
  cost: 100000
  effect:
    en: 'Teaches Dig to a compatible Pokémon.'
  flags: {  }
  flavor_text:
    ruby-sapphire:
      en: |-
        Digs underground
        the 1st turn, then
        strikes next turn.
    emerald:
      en: |-
        Digs underground
        the 1st turn, then
        strikes next turn.
    firered-leafgreen:
      en: |-
        An attack that hits
        on the 2nd turn.
        Can also be used
        to exit dungeons.
    diamond-pearl:
      en: |-
        The user burrows, then attacks on the
        second turn. It can also be used to
        exit dungeons.
    platinum:
      en: |-
        The user burrows, then attacks on the
        second turn. It can also be used to
        exit dungeons.
    heartgold-soulsilver:
      en: |-
        The user burrows, then attacks on the
        second turn. It can also be used to
        exit dungeons.
    black-white:
      en: |-
        The user burrows, then attacks on the
        second turn. It can also be used to
        exit dungeons.
      fr: |-
        Le lanceur creuse au 1er tour et
        frappe au 2è. Permet aussi de
        s’échapper d’un donjon.
    black-2-white-2:
      en: |-
        The user burrows, then attacks on the
        second turn. It can also be used to
        exit dungeons.
    x-y:
      ja-Hrkt: |-
        １ターンめに　もぐり　２ターンめで
        こうげきする。　どうくつで　つかうと
        そとに　だっしゅつ　できる。
      ja: |-
        １ターン目に　潜り　２ターン目で
        相手を　攻撃する。
        どうくつからの　脱出も　できる。
      ko: |-
        1턴째에 파고들어 2턴째에
        상대를 공격한다.
        동굴에서 탈출할 수도 있다.
      en: |-
        The user burrows, then attacks
        on the next turn. It can also
        be used to exit dungeons.
      fr: |-
        Le lanceur creuse au premier tour et frappe au
        second. Permet aussi de sortir des grottes.
      de: |-
        Eine Attacke über 2 Runden. Zunächst gräbt sich
        der Angreifer ein, anschließend erfolgt der Angriff.
      es: |-
        Si el objetivo es del sexo opuesto, el
        enamoramiento reducirá las probabilidades
        de que ataque.
      it: |-
        Chi la usa scava al primo turno e attacca al
        successivo. Fuori dalla lotta fa uscire da alcuni
        luoghi.
    sun-moon:
      ja-Hrkt: |-
        ちを　すいとって　あいてを
        こうげきする。　あたえた　ダメージの
        はんぶんの　ＨＰを　かいふく　できる。
      ja: |-
        血を　吸い取って　相手を
        攻撃する。　与えた　ダメージの
        半分の　ＨＰを　回復できる。
      ko: |-
        피를 빨아서 상대를
        공격한다. 준 데미지의
        절반을 HP로 회복한다.
      zh-Hant: |-
        吸取對手的血液進行攻擊。
        可以回復給予對手
        傷害的一半ＨＰ。
      zh-Hans: |-
        吸取血液攻击对手。
        可以回复给予对手
        伤害的一半ＨＰ。
      en: |-
        The user drains the target’s blood. The user’s HP is
        restored by half the damage taken by the target.
      fr: |-
        Une attaque qui aspire le sang de l’ennemi.
        La moitié des dégâts sont convertis en PV
        pour le lanceur.
      de: |-
        Die Hälfte des zugefügten Schadens wird dem
        Anwender gutgeschrieben.
      es: |-
        El usuario recupera los PS equivalentes a la mitad
        del daño causado al objetivo.
      it: |-
        Mossa succhiasangue. Chi la usa recupera una
        quantità di PS pari alla metà del danno inferto.
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        ちを　すいとって　あいてを
        こうげきする。　あたえた　ダメージの
        はんぶんの　ＨＰを　かいふく　できる。
      ja: |-
        血を　吸い取って　相手を
        攻撃する。　与えた　ダメージの
        半分の　ＨＰを　回復できる。
      ko: |-
        피를 빨아서 상대를
        공격한다. 준 데미지의
        절반을 HP로 회복한다.
      zh-Hant: |-
        吸取對手的血液進行攻擊。
        可以回復給予對手
        傷害的一半ＨＰ。
      zh-Hans: |-
        吸取血液攻击对手。
        可以回复给予对手
        伤害的一半ＨＰ。
      en: |-
        The user drains the target’s blood. The user’s HP is
        restored by half the damage taken by the target.
      fr: |-
        Une attaque qui aspire le sang de l’ennemi.
        La moitié des dégâts sont convertis en PV
        pour le lanceur.
      de: |-
        Die Hälfte des zugefügten Schadens wird dem
        Anwender gutgeschrieben.
      es: |-
        El usuario recupera los PS equivalentes a la mitad
        del daño causado al objetivo.
      it: |-
        Mossa succhiasangue. Chi la usa recupera una
        quantità di PS pari alla metà del danno inferto.
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        ３つの　こうせんで　こうげきする。
        まひか　やけどか　こおりじょうたいの
        どれかに　することが　ある。
      ja: |-
        ３つの　光線で　攻撃する。
        まひか　やけどか　こおり状態の
        どれかに　することが　ある。
      ko: |-
        3개의 광선으로 공격한다.
        마비, 화상 또는 얼음 상태 중
        어느 하나로 만들 때가 있다.
      zh-Hant: |-
        用３種光線進行攻擊。
        有時會讓對手陷入
        麻痺、灼傷或冰凍的狀態。
      zh-Hans: |-
        用３种光线进行攻击。
        有时会让对手陷入
        麻痹、灼伤或冰冻的状态。
      en: |-
        The user strikes with a simultaneous three-beam attack.
        This may also burn, freeze, or paralyze the target.
      fr: |-
        Le lanceur envoie trois boules d’énergie simultanément.
        Peut aussi paralyser, brûler ou geler l’ennemi.
      de: |-
        Feuert drei Strahlen ab. Verursacht eventuell
        Paralyse, Verbrennung oder Einfrieren.
      es: |-
        Ataque triple que puede paralizar, quemar o congelar
        al objetivo.
      it: |-
        Colpisce il bersaglio con tre sfere simultanee che
        possono paralizzarlo, scottarlo o congelarlo.
    sword-shield:
      ja-Hrkt: |-
        ようぶんを　すいとり　こうげきする。
        あたえた　ダメージの
        はんぶんの　ＨＰを　かいふく　できる。
      ja: |-
        養分を　吸い取り　攻撃する。
        与えた　ダメージの
        半分の　ＨＰを　回復できる。
      ko: |-
        양분을 흡수하여 공격한다.
        입힌 데미지의 절반에 해당하는
        HP를 회복할 수 있다.
      zh-Hant: |-
        吸取對手的養分進行攻擊。
        可以回復給予對手
        傷害的一半ＨＰ。
      zh-Hans: |-
        吸取对手的养分进行攻击。
        可以回复给予对手
        伤害的一半ＨＰ。
      en: |-
        A nutrient-draining attack. The user’s HP is restored
        by half the damage taken by the target.
      fr: |-
        Une attaque qui convertit la moitié des dégâts
        infligés en PV pour le lanceur.
      de: |-
        Das Ziel wird angegriffen und die Hälfte des zugefügten
        Schadens dem Anwender als KP gutgeschrieben.
      es: |-
        Un ataque que absorbe nutrientes. Quien lo usa
        recupera la mitad de los PS del daño que produce.
      it: |-
        Mossa che assorbe PS. Chi la usa recupera una
        quantità di PS pari alla metà del danno inferto.
