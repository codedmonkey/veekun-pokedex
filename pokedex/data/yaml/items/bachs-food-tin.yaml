  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        キャンプの　りょうりに　つかう
        しょくざいの　いっしゅ。バックが　うる
        かんづめが　なぜか　ガラルで　にんきだ。
      ja: |-
        キャンプの　料理に　使う
        食材の　一種。バックが　売る
        缶詰が　なぜか　ガラルで　人気だ。
      ko: |-
        캠프 요리에 사용되는
        식재료 중 하나. 바크가 파는 통조림은
        어째선지 가라르에서 인기다.
      zh-Hant: |-
        製作露營料理時使用的食材之一。
        巴哈賣的罐頭不知為何
        在伽勒爾很受歡迎。
      zh-Hans: |-
        在露营营地制作料理时会使用的
        一种食材。不知是什么原因，
        巴哈卖的罐头在伽勒尔特别受欢迎。
      en: |-
        One of the many ingredients that can be used for
        cooking at your camp. The tinned food that Bach sells
        is curiously popular in Galar.
      fr: |-
        Un ingrédient de cuisine pour le camping.
        Cette conserve, vendue par Bach, connaît un succès
        surprenant à Galar.
      de: |-
        Eine Zutat für PokéCamping-Mahlzeiten. Diese von
        Bach vertriebene Dosennahrung erfreut sich in Galar
        überraschend hoher Beliebtheit.
      es: |-
        Un ingrediente para cocinar en el campamento. Las
        conservas de Bach son muy apreciadas por todo Galar.
      it: |-
        Uno degli ingredienti che puoi usare per cucinare
        in campeggio. Queste scatolette vendute da Bach
        sono particolarmente amate dagli abitanti di Galar.
