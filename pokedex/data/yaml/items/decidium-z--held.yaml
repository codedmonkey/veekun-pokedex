decidium-z--held:
  category: z-crystals
  cost: 0
  effect:
    en: 'Held: Allows []{pokemon:decidueye} to upgrade []{move:spirit-shackle} into []{move:sinister-arrow-raid}.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        Ｚパワーの　けっしょう。
        ジュナイパーの　かげぬいを
        Ｚワザに　グレードアップする。
      ja: |-
        Ｚパワーの　結晶。
        ジュナイパーの　かげぬいを
        Ｚワザに　グレードアップする。
      ko: |-
        Z파워의 결정.
        모크나이퍼의 그림자꿰매기를
        Z기술로 업그레이드한다.
      zh-Hant: |-
        Ｚ力量的結晶。
        會把狙射樹梟的縫影
        升級為Ｚ招式。
      zh-Hans: |-
        Ｚ力量的结晶。
        会将狙射树枭的缝影
        升级成Ｚ招式。
      en: |-
        This is a crystallized form of Z-Power.
        It upgrades Decidueye’s Spirit Shackle to a Z-Move.
      fr: |-
        Une cristallisation de la Force Z, permettant
        de transformer le Tisse Ombre d’un Archéduc
        en capacité Z.
      de: |-
        Ein Kristall, dem Z-Kraft innewohnt.
        Er stuft Silvarros Attacke Schattenfessel
        zu einer Z-Attacke auf.
      es: |-
        Cristal que confiere el Poder Z al movimiento
        Puntada Sombría de Decidueye.
      it: |-
        Cristallo in cui è immagazzinato il Potere Z.
        Consente di trasformare la mossa Cucitura d’Ombra
        di Decidueye in una mossa Z.
