        くさの　タイプの　ジュエル。
        もたせると　いちどだけ　くさの
        わざの　いりょくが　つよまる。
      ja: |-
        くさの　タイプの　ジュエル。
        持たせると　１度だけ　くさの
        技の　威力が　強まる。
      ko: |-
        풀타입의 주얼.
        지니게 하면 한 번만 풀
        기술의 위력이 강해진다.
      en: |-
        A gem with an essence of nature.
        When held, it strengthens the power
        of a Grass-type move one time.
      fr: |-
        Objet à tenir. Un joyau augmentant une fois
