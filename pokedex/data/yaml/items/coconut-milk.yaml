  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        キャンプの　りょうりに　つかう
        しょくざいの　いっしゅ。ココナッツの
        じょうひんな　あまさの　ミルクが　にんき。
      ja: |-
        キャンプの　料理に　使う
        食材の　一種。ココナッツの
        上品な　甘さの　ミルクが　人気。
      ko: |-
        캠프 요리에 사용되는
        식재료 중 하나. 고급스러운 단맛이 나는
        코코넛 밀크가 인기다.
      zh-Hant: |-
        製作露營料理時使用的食材之一。
        帶著椰子特有清甜滋味的
        椰奶很受歡迎。
      zh-Hans: |-
        在露营营地制作料理时会使用的
        一种食材。椰奶那种与众不同的
        清甜滋味非常受欢迎。
      en: |-
        One of the many ingredients that can be used for
        cooking at your camp. The refined sweetness of this
        coconut milk makes it quite popular.
      fr: |-
        Un ingrédient de cuisine pour le camping.
        La douceur incomparable de cette boisson
        à la noix de coco lui vaut un grand succès.
      de: |-
        Eine Zutat für PokéCamping-Mahlzeiten. Die feine Süße
        der Kokosnuss verhilft dieser Milch zu sehr großer
        Beliebtheit.
      es: |-
        Un ingrediente para cocinar en el campamento. Muy
        popular por el dulzor refinado que aporta al plato.
      it: |-
        Uno degli ingredienti che puoi usare per cucinare
        in campeggio. La sua raffinata dolcezza lo rende
        molto popolare.
