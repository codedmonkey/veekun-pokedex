    x-y:
      ja-Hrkt: |-
        ２ターンの　あいだ　ねむりつづける。
        ＨＰと　からだの　いじょうを
        すべて　かいふくする。
      ja: |-
        ２ターンの　あいだ　眠り続ける。
        自分の　ＨＰと　状態異常を
        すべて　回復する。
      ko: |-
        2턴 동안 계속 잠잔다.
        자신의 HP와 상태 이상을
        모두 회복한다.
      en: |-
        The user goes to sleep for two turns.
        This fully restores the user’s HP and
        heals any status conditions.
      fr: |-
        Le lanceur dort pendant deux tours.
        Il regagne tous ses PV et n’a plus de problèmes
        de statut.
      de: |-
        Anwender wird vollkommen geheilt und schläft
        die folgenden 2 Runden.
      es: |-
        Lanza una siniestra llamarada morada que
        provoca quemaduras al objetivo.
      it: |-
        Chi la usa dorme per due turni.
        Recupera però tutti i PS e guarisce da tutti i suoi
        problemi di stato.
    sun-moon:
      ja-Hrkt: |-
        ２ターンの　あいだ　ねむり　つづける。
        じぶんの　ＨＰと　じょうたいいじょうを
        すべて　かいふく　する。
      ja: |-
        ２ターンの　あいだ　眠り続ける。
        自分の　ＨＰと　状態異常を
        すべて　回復する。
      ko: |-
        2턴 동안 계속 잠잔다.
        자신의 HP와 상태 이상을
        모두 회복한다.
      zh-Hant: |-
        連續睡２回合。
        回復自己的全部ＨＰ
        以及治癒所有異常狀態。
      zh-Hans: |-
        连续睡上２回合。
        回复自己的全部ＨＰ
        以及治愈所有异常状态。
      en: |-
        The user goes to sleep for two turns. This fully
        restores the user’s HP and heals any
        status conditions.
      fr: |-
        Le lanceur regagne tous ses PV et soigne ses
        problèmes de statut, puis il dort pendant deux
        tours.
      de: |-
        Anwender wird vollkommen geheilt, von allen
        Statusproblemen befreit und schläft die folgenden
        2 Runden.
      es: |-
        Restaura todos los PS y cura todos los problemas
        de estado del usuario. Duerme los dos próximos
        turnos.
      it: |-
        Chi la usa recupera tutti i PS e guarisce da tutti
        i suoi problemi di stato, ma dorme per due turni.
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        ２ターンの　あいだ　ねむり　つづける。
