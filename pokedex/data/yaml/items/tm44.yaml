    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        あいてに　じゃれついて
        こうげきする。　あいての
        こうげきを　さげる　ことがある。
      ja: |-
        相手に　じゃれついて
        攻撃する。　相手の
        攻撃を　さげる　ことがある。
      ko: |-
        상대에게 치근거리며
        공격한다. 상대의
        공격을 떨어뜨릴 때가 있다.
      zh-Hant: |-
        在和對手嬉鬧的同時進行攻擊。
        有時會降低對手的攻擊。
      zh-Hans: |-
        与对手嬉闹并攻击。
        有时会降低对手的攻击。
      en: |-
        The user plays rough with the target and attacks it.
        This may also lower the target’s Attack stat.
      fr: |-
        Attaque l’ennemi avec un câlin. Peut diminuer
        son Attaque.
      de: |-
        Der Anwender knuddelt das Ziel und greift es an.
        Gelegentlich sinkt dabei auch dessen Angriffs-Wert.
      es: |-
        El Pokémon que lo usa le hace cucamonas al objetivo
        y lo ataca. Puede disminuir el Ataque del objetivo.
      it: |-
        Chi la usa attacca il bersaglio con delle carinerie.
        Può anche ridurne l’Attacco.
    sword-shield:
      ja-Hrkt: |-
        あいてが　じぶんと　おなじ　わざを
        おぼえていたら　あいてだけ
        そのわざを　つかえなく　する。
      ja: |-
        相手が　自分と　同じ　技を
        おぼえていたら　相手だけ
        その技を　使えなくする。
      ko: |-
        상대가 자신과 같은 기술을
        배웠다면 상대만 그 기술을
        사용할 수 없게 한다.
      zh-Hant: |-
        如果對手也學會了和自己
        相同的招式，則對手將
        不能使用該招式。
      zh-Hans: |-
        如果对手有和自己相同的招式，
        那么只有对手无法使用该招式。
      en: |-
        If opposing Pokémon know any move also known by
        the user, they are prevented from using it.
      fr: |-
        Si l’ennemi et le lanceur ont des capacités en commun,
        l’ennemi ne pourra pas les utiliser.
      de: |-
        Hindert Gegner am Einsatz von Attacken, die der
        Anwender selbst auch kennt.
      es: |-
        Impide a los contrincantes usar ataques conocidos por
        el usuario durante el combate.
      it: |-
        Chi la usa impedisce al nemico di usare mosse
        che conoscono entrambi.
