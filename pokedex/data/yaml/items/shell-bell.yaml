        des dégâts.
    black-2-white-2:
      en: |-
        An item to be held by a Pokémon.
        The holder’s HP is restored a little
        every time it inflicts damage.
    x-y:
      ja-Hrkt: |-
        もたせた　ポケモンが　こうげきして
        あいてに　ダメージを　あたえたとき
        ＨＰを　すこし　かいふく　できる。
      ja: |-
        持たせた　ポケモンが　攻撃して
        相手に　ダメージを　あたえたとき
        ＨＰを　少し　回復できる。
      ko: |-
        지니게 한 포켓몬이 공격하여
        상대에게 데미지를 줬을 때
        HP를 조금 회복할 수 있다.
      en: |-
        An item to be held by a Pokémon.
        The holder regains a little HP every
        time it inflicts damage on others.
      fr: |-
        Objet à tenir. Restaure un peu les PV du porteur
        à chaque fois qu’il inflige des dégâts.
      de: |-
        Ein Item zum Tragen. Es stellt einige KP des
        Trägers immer dann wieder her, wenn dieser
        dem Ziel Schaden zufügt.
      es: |-
        Potencia los movimientos, pero consume PS con
        cada ataque. Debe llevarla un Pokémon.
      it: |-
        Strumento da dare a un Pokémon.
        Chi ce l’ha recupera un po’ di PS ogni volta
        che infligge danni.
