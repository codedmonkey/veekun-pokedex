    ruby-sapphire:
      en: |-
        A hold item that
        restores HP upon
        striking the foe.
    emerald:
      en: |-
        A hold item that
        restores HP upon
        striking the foe.
    firered-leafgreen:
      en: |-
        An item to be held by a POKéMON.
        The holding POKéMON regains some
        HP upon striking the foe.
    diamond-pearl:
      en: |-
        An item to be held by a Pokémon.
        The holder’s HP is restored a little
        every time it inflicts damage.
    platinum:
      en: |-
        An item to be held by a Pokémon.
