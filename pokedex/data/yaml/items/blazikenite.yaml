blazikenite:
  category: mega-stones
  cost: 0
  effect:
    en: 'Held: Allows Blaziken to Mega Evolve into Mega Blaziken.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        バシャーモに　もたせておくと
        たたかいのとき　メガシンカが　できる
        ふしぎな　メガストーンの　いっしゅ。
      ja: |-
        バシャーモに　持たせておくと
        戦いのとき　メガシンカが　できる
        不思議な　メガストーンの　一種。
      ko: |-
        번치코에게 지니게 하면
        배틀할 때 메가진화할 수 있는
        신비한 메가스톤의 일종.
      en: |-
        One variety of the mysterious Mega Stones.
        Have Blaziken hold it, and this stone will
        enable it to Mega Evolve during battle.
      fr: |-
        Une variété de Méga-Gemme.
        Tenue par un Braségali, elle lui permet de
        méga-évoluer durant un combat.
      de: |-
        Einer der mysteriösen Mega-Steine. Wird er von
        einem Lohgock getragen, kann es im Kampf eine
        Mega-Entwicklung durchführen.
      es: |-
        Una de las misteriosas Megapiedras. Permite
        megaevolucionar a Garchomp en combate.
      it: |-
        Un esemplare delle misteriose Megapietre.
        Data a Blaziken, gli permette di megaevolversi
        durante la lotta.
