        싫은 소리를 내어
        상대의 방어를 크게 떨어뜨린다.
      zh-Hant: |-
        發出令人不由自主想要
        摀起耳朵的刺耳聲，
        大幅降低對手的防禦。
      zh-Hans: |-
        发出不由自主想要
        捂起耳朵的刺耳声，
        从而大幅降低对手的防御。
