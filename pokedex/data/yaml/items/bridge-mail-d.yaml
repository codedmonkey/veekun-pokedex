        まっかな　はねばしの　えがらが
        プリントされた　びんせん。
        ポケモンに　もたせて　つかう。
      ja: |-
        真っ赤な　跳ね橋の　絵柄が
        プリントされた　レターペーパー。
        ポケモンに　持たせて　使う。
      ko: |-
        새빨간 도개교의 무늬가
        프린트된 편지지.
        포켓몬에게 지니게 해서 쓴다.
      en: |-
        Stationery featuring an illustration of a bright-red
        drawbridge. Have a Pokémon hold it for delivery.
      fr: |-
