        un Pokémon.
      de: |-
        Das Briefpapier hat eine knallrote Zugbrücke als
        Hintergrund. Gib es einem Pokémon zum Tragen.
      es: |-
        Los Pokémon pueden llevarla o usarla para
        restaurar algunos PS. Su sabor puede causar
        confusión.
      it: |-
        Carta da lettere che riporta l’immagine
