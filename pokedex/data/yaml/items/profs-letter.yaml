profs-letter:
  category: plot-advancement
  cost: 0
  effect:
    en: "Traded to the player's mom for the Town Map and a Potion."
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        プラターヌはかせから
        ママあてに　かかれた　てがみ。
        ほんのり　いい　かおりがする。
      ja: |-
        プラターヌ博士から
        ママあてに　書かれた　手紙。
        ほんのり　いい　香りがする。
      ko: |-
        플라타느박사가
        엄마에게 쓴 편지.
        은은하게 좋은 향기가 난다.
      en: |-
        A letter that Professor Sycamore wrote
        to your mother. A faint but pleasant
        perfume seems to cling to the paper.
      fr: |-
        Une lettre du Professeur Platane à Maman.
        Elle dégage un parfum subtil.
      de: |-
        Ein an deine Mutter adressierter Brief von
        Professor Platan. Ihm haftet ein schwacher
        Parfümduft an.
      es: |-
        Una de las misteriosas Megapiedras. Permite
        megaevolucionar a Blastoise en combate.
      it: |-
        Lettera del Professor Platan per la mamma.
        Emana un delicato profumo.
