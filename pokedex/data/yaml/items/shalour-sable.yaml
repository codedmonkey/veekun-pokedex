shalour-sable:
  category: status-cures
  cost: 350
  effect:
    en: 'Cures any major status ailment and confusion.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        シャラシティ　めいぶつの　サブレ。
        ポケモン　１ひきの　じょうたいの
        いじょうを　すべて　かいふくする。
      ja: |-
        シャラシティ　名物の　サブレ。
        ポケモン　１匹の　状態の
        異常を　すべて　回復する。
      ko: |-
        사라시티의 명물 사블레.
        포켓몬 1마리의 상태 이상을
        모두 회복한다.
      zh-Hant: |-
        娑羅市特產的沙布蕾。
        能治癒１隻寶可夢的
        所有異常狀態。
      zh-Hans: |-
        娑罗市特产的沙布蕾。
        能治愈１只宝可梦的
        所有异常状态。
      en: |-
        Shalour City’s famous shortbread. It can be used
        once to heal all the status conditions of a Pokémon.
      fr: |-
        La spécialité de Yantreizh.
        Elle soigne tous les problèmes de statut
        d’un Pokémon.
      de: |-
        Dieser Butterkeks ist eine Spezialität aus
        Yantara City. Er behebt alle Statusprobleme
        eines Pokémon.
      es: |-
        Especialidad de Ciudad Yantra. Cura los problemas
        de estado de un Pokémon.
      it: |-
        Il famoso Yantafrollino di Yantaropoli.
        Cura tutti i problemi di stato di un Pokémon.
