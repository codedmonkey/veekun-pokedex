tm58:
  category: all-machines
  cost: 1000
  effect:
    en: 'Teaches Endure to a compatible Pokémon.'
  flags: {  }
  flavor_text:
    diamond-pearl:
      en: |-
        The user endures any attack, leaving
        1 HP. Its chance of failing rises if it
        is used in succession.
    platinum:
      en: |-
        The user endures any attack, leaving
        1 HP. Its chance of failing rises if it
        is used in succession.
    heartgold-soulsilver:
      en: |-
        The user endures any attack, leaving
        1 HP. Its chance of failing rises if it
        is used in succession.
    black-white:
      en: |-
        The user hurls the target into the air,
        then drops it on the second turn. The
        target cannot attack while in the air.
      fr: |-
        Le lanceur emmène l’ennemi dans les airs
        au 1er tour et le lâche dans le vide au
        2è. L’ennemi saisi ne peut pas attaquer.
    black-2-white-2:
      en: |-
        The user hurls the target into the air,
        then drops it on the second turn. The
        target cannot attack while in the air.
    x-y:
      ja-Hrkt: |-
        つれさった　あいてを　２ターンめに
        そらから　おとして　こうげきする。
        つれさられた　あいては　うごけない。
      ja: |-
        連れさった　相手を　２ターン目に
        空から　落として　攻撃する。
        連れさられた　相手は　動けない。
      ko: |-
        끌려온 상대를 2턴째에
        하늘에서 떨어뜨려 공격한다.
        끌려간 상대는 움직일 수 없다.
      en: |-
        The user takes the target into the sky,
        then drops it during the next turn.
        The target cannot attack while in the sky.
      fr: |-
        Le lanceur emmène l’ennemi dans les airs au
        premier tour et le lâche dans le vide au second.
        L’ennemi saisi ne peut pas attaquer.
      de: |-
        Das entführte Ziel wird in Runde 2 vom Himmel
        fallen gelassen. In der Luft kann das Ziel nicht
        attackieren.
      es: |-
        Danza frenética que eleva el espíritu combativo.
        Aumenta mucho el Ataque de quien lo usa.
      it: |-
        Porta il bersaglio in cielo e lo scaglia a terra
        al turno successivo. Il bersaglio catturato
        non può muoversi.
    sun-moon:
      ja-Hrkt: |-
        つれさった　あいてを　２ターンめに
        そらから　おとして　こうげきする。
        つれさられた　あいては　うごけない。
      ja: |-
        連れさった　相手を　２ターン目に
        空から　落として　攻撃する。
        連れさられた　相手は　動けない。
      ko: |-
        끌려온 상대를 2턴째에
        하늘에서 떨어뜨려 공격한다.
        끌려간 상대는 움직일 수 없다.
      zh-Hant: |-
        把帶到空中的對手於第２回合摔下
        進行攻擊。
        被帶到空中的對手將無法行動。
      zh-Hans: |-
        将带走的对手在第２回合
        从空中摔下进行攻击。
        被带到空中的对手不能动弹。
      en: |-
        The user takes the target into the sky, then drops
        it during the next turn. The target cannot attack
        while in the sky.
      fr: |-
        Le lanceur emmène l’ennemi dans les airs au
        premier tour et le lâche dans le vide au second.
        L’ennemi saisi ne peut pas attaquer.
      de: |-
        Der Anwender entführt das Ziel in Runde 1 in
        Richtung Himmel und lässt es in Runde 2 fallen.
        In der Luft kann das Ziel nicht attackieren.
      es: |-
        Arroja al objetivo por los aires y lo estrella contra
        el suelo en el siguiente turno, impidiéndole moverse
        en el aire.
      it: |-
        Porta il bersaglio in cielo e lo scaglia a terra al turno
        successivo. Il bersaglio catturato non può muoversi.
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        つれさった　あいてを　２ターンめに
        そらから　おとして　こうげきする。
        つれさられた　あいては　うごけない。
      ja: |-
        連れさった　相手を　２ターン目に
        空から　落として　攻撃する。
        連れさられた　相手は　動けない。
      ko: |-
        끌려온 상대를 2턴째에
        하늘에서 떨어뜨려 공격한다.
        끌려간 상대는 움직일 수 없다.
      zh-Hant: |-
        把帶到空中的對手於第２回合摔下
        進行攻擊。
        被帶到空中的對手將無法行動。
      zh-Hans: |-
        将带走的对手在第２回合
        从空中摔下进行攻击。
        被带到空中的对手不能动弹。
      en: |-
        The user takes the target into the sky, then drops
        it during the next turn. The target cannot attack
        while in the sky.
      fr: |-
        Le lanceur emmène l’ennemi dans les airs au
        premier tour et le lâche dans le vide au second.
        L’ennemi saisi ne peut pas attaquer.
      de: |-
        Der Anwender entführt das Ziel in Runde 1 in
        Richtung Himmel und lässt es in Runde 2 fallen.
        In der Luft kann das Ziel nicht attackieren.
      es: |-
        Arroja al objetivo por los aires y lo estrella contra
        el suelo en el siguiente turno, impidiéndole moverse
        en el aire.
      it: |-
        Porta il bersaglio in cielo e lo scaglia a terra al turno
        successivo. Il bersaglio catturato non può muoversi.
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        ドリルのように　からだを　かいてん
        しながら　あいてに　たいあたりする。
        きゅうしょに　あたりやすい。
      ja: |-
        ドリルのように　体を　回転しながら
        相手に　体当たりする。
        急所に　当たりやすい。
      ko: |-
        드릴처럼 몸을 회전시켜서
        상대에게 몸통박치기한다.
        급소에 맞기 쉽다.
      zh-Hant: |-
        像鑽頭一樣旋轉身體，
        猛烈地撞擊對手。
        容易擊中要害。
      zh-Hans: |-
        像钢钻一样，一边旋转身体
        一边撞击对手。
        容易击中要害。
      en: |-
        The user crashes into its target while rotating its
        body like a drill. Critical hits land more easily.
      fr: |-
        Le lanceur tourne sur lui-même comme une perceuse
        et se jette sur l’ennemi. Taux de critique élevé.
      de: |-
        Anwender rammt das Ziel, während er seinen Körper
        wie einen Bohrer dreht. Hohe Volltrefferquote.
      es: |-
        El usuario golpea usando su cuerpo como un taladro. 
        Suele ser crítico.
      it: |-
        Chi la usa si scaglia sul bersaglio ruotando su se
        stesso come un trapano perforante. Probabile
        brutto colpo.
    sword-shield:
      ja-Hrkt: |-
        そのターンに　あいてが
        すでに　ダメージを　うけて　いたら
        わざの　いりょくは　２ばいに　なる。
      ja: |-
        そのターンに　相手が
        すでに　ダメージを　受けていたら
        技の　威力は　２倍に　なる。
      ko: |-
        그 턴에 상대가
        이미 데미지를 입었다면
        기술의 위력은 2배가 된다.
      zh-Hant: |-
        如果此回合內對手
        已受到傷害，
        招式威力會變成２倍。
      zh-Hans: |-
        如果此回合内对手
        已经受到伤害的话，
        招式威力会变成２倍。
      en: |-
        If the target has already taken some damage in the
        same turn, this attack’s power is doubled.
      fr: |-
        Cette attaque est deux fois plus efficace si l’ennemi
        a déjà été blessé durant ce tour.
      de: |-
        Hat das Ziel während der Runde schon Schaden
        genommen, wird die Stärke der Attacke verdoppelt.
      es: |-
        Si el objetivo ya ha sufrido daño en ese turno, la fuerza
        del ataque se duplica.
      it: |-
        Se il bersaglio ha già subito dei danni nello stesso
        turno, la potenza di questa mossa raddoppia.
