iron-ball:
  category: bad-held-items
  cost: 4000
  effect:
    en: "Held: Decreases the holder's Speed by 50%.  If the holder is Flying or has Levitate, it takes regular damage from Ground attacks and is suspectible to Spikes and Toxic Spikes."
  flags:
    - holdable
    - holdable-active
    - underground
  flavor_text:
    diamond-pearl:
      en: |-
        A Pokémon hold item that cuts Speed.
        It makes Flying-type and levitating
        holders susceptible to Ground moves.
    platinum:
      en: |-
        A Pokémon hold item that cuts Speed.
        It makes Flying-type and levitating
        holders susceptible to Ground moves.
    heartgold-soulsilver:
      en: |-
        A Pokémon held item that cuts Speed.
        It makes Flying-type and levitating
        holders susceptible to Ground moves.
    black-white:
      en: |-
        A Pokémon held item that cuts Speed.
        It makes Flying-type and levitating
        holders susceptible to Ground moves.
      fr: |-
        Objet à tenir réduisant la Vitesse. Rend
        les porteurs de type Vol et lévitant
        sensibles aux capacités de type Sol.
    black-2-white-2:
      en: |-
        A Pokémon held item that cuts Speed.
        It makes Flying-type and levitating
        holders susceptible to Ground moves.
    x-y:
      ja-Hrkt: |-
        もたせると　すばやさが　さがる。
        ひこうタイプや　ふゆう　ポケモンは
        じめんわざが　あたって　しまう。
      ja: |-
        持たせると　素早さが　さがる。
        ひこうタイプや　ふゆう　ポケモンは
        じめん技が　当たってしまう。
      ko: |-
        지니게 하면 스피드가 떨어진다.
        비행타입이나 부유포켓몬은
        땅 기술에 맞아 버린다.
      en: |-
        An item to be held by a Pokémon.
        It lowers Speed and allows Ground-type
        moves to hit Flying-type and levitating holders.
      fr: |-
        Objet à tenir. Réduit la Vitesse. Rend les porteurs
        de type Vol, ainsi que ceux en lévitation,
        sensibles aux capacités de type Sol.
      de: |-
        Ein Item zum Tragen. Macht Pokémon des Typs
        Flug oder mit der Fähigkeit Schwebe anfällig für
        Boden-Attacken. Senkt den Initiative-Wert.
      es: |-
        En combate, esta concha desechada sirve para
        que un Pokémon se cambie por otro que no esté
        combatiendo.
      it: |-
        Riduce la Velocità e rende vulnerabili
        alle mosse di tipo Terra se chi ce l’ha è
        di tipo Volante o ha l’abilità Levitazione.
