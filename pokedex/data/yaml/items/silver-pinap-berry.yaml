silver-pinap-berry:
  category: catching-bonus
  cost: 1000
  effect: {  }
  flags: {  }
  flavor_text:
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        ポケモンに　あたえると
        つかまえた　ときに　どうぐが
        てにはいり　やすくなる　きのみ。
      ja: |-
        ポケモンに　あたえると
        捕まえた　ときに　道具が
        手にはいり　やすくなる　きのみ。
      ko: |-
        포켓몬에게 주면
        잡았을 때 도구를 손에 넣기
        쉬워지는 나무열매.
      zh-Hant: |-
        把這個樹果餵給寶可夢，
        在捕捉成功後，
        會更容易獲得道具。
      zh-Hans: |-
        如果把这树果交给宝可梦，
        那么接下来捉住该宝可梦时，
        会更容易获得道具。
      en: |-
        A Berry that makes you more likely to get an item when
        given to Pokémon you’re trying to catch.
      fr: |-
        Une Baie à donner à un Pokémon sauvage pour avoir
        plus de chances d’obtenir un objet après l’avoir capturé.
      de: |-
        Gibst du diese Beere einem Pokémon zu essen, wird die
        Chance, bei einem erfolgreichen Fangversuch ein Item
        zu erhalten, erhöht.
      es: |-
        Una baya que puedes lanzar a un Pokémon salvaje
        para aumentar bastante las probabilidades de conseguir
        un objeto tras capturarlo.
      it: |-
        Bacca che rende più facile ottenere strumenti
        quando catturi il Pokémon a cui l’hai data.
