power-plant-pass:
  category: plot-advancement
  cost: 0
  effect:
    en: 'Permits entry to the Kalos Power Plant.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        １３ばんどうろに　ある
        はつでんしょに　はいるための
        みぶんしょうとなる　パス。
      ja: |-
        １３番道路に　ある
        発電所に　入るための
        身分証となる　パス。
      ko: |-
        13번도로에 있는
        발전소에 들어가기 위한
        신분증이 되는 패스.
      en: |-
        This pass serves as an ID card
        for gaining access to the power
        plant that lies along Route 13.
      fr: |-
        Un passe de sécurité permettant d’accéder à la
        Centrale de Kalos, à proximité de la Route 13.
      de: |-
        Dieser Pass gewährt Zutritt zum Kraftwerk
        auf Route 13.
      es: |-
        Este aparato permite recibir vídeos holográficos
        y visualizarlos en cualquier momento.
      it: |-
        Tesserino di riconoscimento che consente
        l’accesso alla Centrale di Kalos che si trova
        nel Percorso 13.
