big-malasada:
  category: status-cures
  cost: 350
  effect:
    en: 'Cures major status ailments and confusion.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        アローラめいぶつの　あげパン。
        ポケモン　１ひきの　じょうたいの
        いじょうを　すべて　かいふくする。
      ja: |-
        アローラ名物の　あげパン。
        ポケモン　１匹の　状態の
        異常を　すべて　回復する。
      ko: |-
        알로라의 명물인 튀긴 빵.
        포켓몬 1마리의
        상태 이상을 모두 회복한다.
      zh-Hant: |-
        阿羅拉特產的油炸麵包。
        能治癒１隻寶可夢的
        所有異常狀態。
      zh-Hans: |-
        阿罗拉特产的油炸面包。
        能治愈１只宝可梦的
        所有异常状态。
      en: |-
        The Alola region’s local specialty—fried bread.
        It can be used once to heal all the status conditions
        of a Pokémon.
      fr: |-
        Une spécialité d’Alola. Elle soigne toutes
        les altérations de statut d’un Pokémon.
      de: |-
        Eine Spezialität aus Alola, die alle Statusprobleme
        eines Pokémon heilt.
      es: |-
        Fritura típica de Alola que cura todos los problemas
        de estado de un Pokémon.
      it: |-
        Frittella tipica di Alola.
        Cura tutti i problemi di stato di un Pokémon.
