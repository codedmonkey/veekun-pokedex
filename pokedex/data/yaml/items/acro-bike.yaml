acro-bike:
  category: gameplay
  cost: 0
  effect:
    en: 'Increases movement speed outside or in caves.  Slower than the []{item:mach-bike}.  Can perform various tricks, allowing the trainer to reach certain special areas.'
  flags: {  }
  flavor_text:
    ruby-sapphire:
      en: |-
        A folding bicycle
        capable of jumps
        and wheelies.
    emerald:
      en: |-
        A folding bicycle
        capable of jumps
        and wheelies.
    firered-leafgreen:
