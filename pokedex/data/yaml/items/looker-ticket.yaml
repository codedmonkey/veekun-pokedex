looker-ticket:
  category: plot-advancement
  cost: 0
  effect:
    en: 'Advances the Looker postgame plot.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        きらきら　かがやく
        とりょうが　ふきつけられた
        ハンサム　てづくりの　チケット。
      ja: |-
        きらきら　かがやく
        塗料が　吹きつけられた
        ハンサム　てづくりの　チケット。
      ko: |-
        번쩍번쩍 빛나는
        스프레이가 뿌려진
        핸섬이 직접 만든 티켓.
      en: |-
        A ticket that was handmade by
        Looker. It’s decorated with a
        liberal amount of glittery paint.
      fr: |-
        Un ticket brillant de mille feux, peint à la main
        par Beladonis.
      de: |-
        Ein von LeBelle persönlich gebasteltes Ticket.
        Es ist mit einer leuchtenden Farbschicht
        überzogen.
      es: ''
      it: |-
        Un biglietto realizzato a mano da Bellocchio,
        dipinto con colori brillanti.
