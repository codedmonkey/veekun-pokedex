    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        ２ー３ターンの　あいだ
        あばれまくって　こうげきする。
        あばれた　あとは　こんらん　する。
      ja: |-
        ２ー３ターンの　間
        暴れまくって　攻撃する。
        暴れたあとは　混乱する。
      ko: |-
        2-3턴 동안
        마구 난동 부려서 공격한다.
        난동 부린 뒤에는 혼란에 빠진다.
      zh-Hant: |-
        在２～３回合內
        瘋狂亂打對手進行攻擊。
        大鬧一番後自己會陷入混亂。
      zh-Hans: |-
        在２～３回合内，
        乱打一气地进行攻击。
        大闹一番后自己会陷入混乱。
      en: |-
        The Pokémon rampages and attacks for two to
        three turns. It then becomes confused.
      fr: |-
        Le lanceur enrage et attaque pendant deux ou trois
        tours avant de devenir confus.
      de: |-
        Attacke über zwei bis drei Runden, die den
        Anwender verwirrt.
      es: |-
        Ataca de dos a tres turnos y acaba confundiendo al 
        agresor.
      it: |-
        Chi la usa sfoga la sua ira e attacca il nemico
        per due o tre turni prima di essere lasciato
        in preda alla confusione.
    sword-shield:
      ja-Hrkt: |-
        じぶんが　どく　まひ　やけど
        じょうたいの　とき　あいてに　くりだすと
        わざの　いりょくが　２ばいに　なる。
      ja: |-
        自分が　毒　まひ　やけど
        状態のとき　相手に　くりだすと
        技の　威力が　２倍に　なる。
      ko: |-
        자신이 독, 마비, 화상
        상태일 때 날리면
        기술의 위력이 2배가 된다.
      zh-Hant: |-
        當自己陷入中毒、麻痺、灼傷等
        狀態時，向對手使用此招式，
        威力會變成２倍。
      zh-Hans: |-
        当自己处于中毒、麻痹、灼伤状态时，
        向对手使出此招式的话，
        威力会变成２倍。
      en: |-
        This attack move doubles its power if the user is
        poisoned, burned, or paralyzed.
      fr: |-
        Une attaque dont la puissance double lorsque
        le lanceur est empoisonné, paralysé ou brûlé.
      de: |-
        Ist der Anwender vergiftet, paralysiert oder leidet er
        unter Verbrennungen, verdoppelt sich die Kraft der
        Attacke.
      es: |-
        Si el usuario está quemado, paralizado o envenenado,
        ataca con el doble de potencia.
      it: |-
        Mossa d’attacco che raddoppia la potenza
        se chi la usa è scottato, avvelenato o paralizzato.
