        the cost of some HP on each hit.
      fr: |-
        Objet à tenir augmentant la puissance
        des capacités, mais qui dépense des
        PV à chaque coup.
    black-2-white-2:
      en: |-
        An item to be held by a Pokémon.
        It boosts the power of moves, but at
        the cost of some HP on each hit.
    x-y:
      ja-Hrkt: |-
        もたせると　こうげきする　たびに
        ＨＰが　すこし　へってしまうが
        わざの　いりょくが　あがる。
      ja: |-
        持たせると　攻撃する　たびに
        ＨＰが　少し　減ってしまうが
        技の　威力が　あがる。
      ko: |-
        지니게 하면 공격할 때마다
        HP가 조금씩 줄지만
        기술의 위력이 올라간다.
      en: |-
        An item to be held by a Pokémon.
        It boosts the power of moves, but
        at the cost of some HP on each hit.
      fr: |-
        Objet à tenir. Augmente la puissance des
        capacités, mais dépense des PV à chaque coup.
      de: |-
        Ein Item zum Tragen. Verstärkt Attacken,
        aber jede Attacke kostet den Träger KP.
      es: |-
        Debe llevarlo un Pokémon. Potencia la Velocidad,
        pero solo permite usar un movimiento.
      it: |-
        Strumento da dare a un Pokémon.
        Potenzia le mosse a scapito di alcuni PS
        per ogni colpo.
