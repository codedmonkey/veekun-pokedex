life-orb:
  category: held-items
  cost: 4000
  effect:
    en: "Held: Damage from the holder's moves is increased by 30%.  On each turn the holder uses a damage-inflicting move, it takes 10% its max HP in damage."
  flags:
    - holdable
    - holdable-active
  flavor_text:
    diamond-pearl:
      en: |-
        An item to be held by a Pokémon.
        It boosts the power of moves, but at
        the cost of some HP on each hit.
    platinum:
      en: |-
        An item to be held by a Pokémon.
        It boosts the power of moves, but at
        the cost of some HP on each hit.
