absolite:
  category: mega-stones
  cost: 0
  effect:
    en: 'Held: Allows Absol to Mega Evolve into Mega Absol.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        アブソルに　もたせておくと
        たたかいのとき　メガシンカが　できる
        ふしぎな　メガストーンの　いっしゅ。
      ja: |-
        アブソルに　持たせておくと
        戦いのとき　メガシンカが　できる
        不思議な　メガストーンの　一種。
      ko: |-
        앱솔에게 지니게 하면
        배틀할 때 메가진화할 수 있는
        신비한 메가스톤의 일종.
      en: |-
        One variety of the mysterious Mega Stones.
        Have Absol hold it, and this stone will
        enable it to Mega Evolve during battle.
      fr: |-
        Une variété de Méga-Gemme.
        Tenue par un Absol, elle lui permet de
        méga-évoluer durant un combat.
      de: |-
        Einer der mysteriösen Mega-Steine. Wird er von
        einem Absol getragen, kann es im Kampf eine
        Mega-Entwicklung durchführen.
      es: |-
        Accesorio con un poder misterioso que permite
        megaevolucionar a Pokémon que lleven una
        Megapiedra adecuada.
      it: |-
        Un esemplare delle misteriose Megapietre.
        Data ad Absol, gli permette di megaevolversi
        durante la lotta.
