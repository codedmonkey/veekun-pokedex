        Ｚ力量的结晶。
        会将索尔迦雷欧的流星闪冲
        升级成Ｚ招式。
      en: |-
        This is a crystallized form of Z-Power.
        It upgrades Solgaleo’s Sunsteel Strike to a Z-Move.
      fr: |-
        Une cristallisation de la Force Z, permettant
        de transformer le Choc Météore de Solgaleo
        en capacité Z.
