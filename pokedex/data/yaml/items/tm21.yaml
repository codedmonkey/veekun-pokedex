    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        あいての　ちからを　りようする。
        たたかっている　あいての　こうげきが
        たかいほど　ダメージが　あがる。
      ja: |-
        相手の　力を　利用する。
        戦っている　相手の　攻撃が
        高いほど　ダメージが　あがる。
      ko: |-
        상대의 힘을 이용한다.
        싸우고 있는 상대의 공격이
        높을수록 데미지가 올라간다.
      zh-Hant: |-
        利用對手的力量進行攻擊。
        對手的攻擊越高，
        給予對手的傷害越大。
      zh-Hans: |-
        利用对手的力量进行攻击。
        正和自己战斗的对手，
        其攻击越高，伤害越大。
      en: |-
        The user turns the target’s power against it.
        The higher the target’s Attack stat, the greater
        the damage it deals.
      fr: |-
        Le lanceur utilise la force de l’ennemi. Plus l’Attaque de
        l’ennemi est élevée, plus le lanceur inflige de dégâts.
      de: |-
        Anwender macht sich die Kraft des Zieles zunutze.
        Je höher dessen Angriff, desto mehr Schaden richtet
        die Attacke an.
      es: |-
        El usuario emplea la fuerza del objetivo para atacarlo.
        Cuanto mayor es el Ataque del objetivo, más daño
        provoca.
      it: |-
        Chi la usa sfrutta la forza del bersaglio. Il danno
        inflitto è proporzionale all’Attacco del nemico.
    sword-shield:
      ja-Hrkt: |-
        ２ターンの　あいだ　ねむり　つづける。
        じぶんの　ＨＰと　じょうたいいじょうを
        すべて　かいふく　する。
      ja: |-
        ２ターンの　間　眠り続ける。
        自分の　ＨＰと　状態異常を
        すべて　回復する。
      ko: |-
        2턴 동안 계속 잠잔다.
        자신의 HP와 상태 이상을
        모두 회복한다.
      zh-Hant: |-
        連續睡２回合。
        回復自己的全部ＨＰ
        以及治癒所有異常狀態。
      zh-Hans: |-
        连续睡上２回合。
        回复自己的全部ＨＰ
        以及治愈所有异常状态。
      en: |-
        The user goes to sleep for two turns. This fully
        restores the user’s HP and heals any
        status conditions.
      fr: |-
        Le lanceur regagne tous ses PV et soigne ses altérations
        de statut, puis il dort pendant deux tours.
      de: |-
        Anwender wird vollkommen geheilt, von allen
        Statusproblemen befreit und schläft die folgenden
        zwei Runden.
      es: |-
        Restaura todos los PS y cura todos los problemas de
        estado del usuario, que se duerme los dos turnos
        siguientes.
      it: |-
        Chi la usa recupera tutti i PS e guarisce da tutti
        i suoi problemi di stato, ma dorme per due turni.
