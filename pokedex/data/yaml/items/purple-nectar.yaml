purple-nectar:
  category: species-specific
  cost: 300
  effect:
    en: 'Changes Oricorio to Sensu Style.  Single-use and cannot be used in battle.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        ポニのはなぞので　てにいれた
        はなのミツ。　とくていの　ポケモンの
        すがたを　かえる。
      ja: |-
        ポニの花園で　手に入れた
        花のミツ。　特定の　ポケモンの
        姿を　変える。
      ko: |-
        포니 화원에서 손에 넣은
        꽃의 꿀. 특정 포켓몬의
        모습을 바꾼다.
      zh-Hant: |-
        在波尼花園裡獲得的花蜜。
        可以改變特定寶可夢的樣子。
      zh-Hans: |-
        在波尼花园里获得的花蜜。
        可以改变特定宝可梦的样子。
      en: |-
        A flower nectar obtained at Poni Meadow.
        It changes the form of certain species of Pokémon.
      fr: |-
        Un nectar obtenu au Jardin de Poni.
        Permet à un certain Pokémon de changer
        d’apparence.
      de: |-
        Blütennektar vom Poni-Blumenmeer.
        Ein bestimmtes Pokémon kann damit seine Form
        ändern.
      es: |-
        Néctar de ciertas flores de los Jardines de Poni,
        capaz de hacer cambiar de forma a una
        determinada especie de Pokémon.
      it: |-
        Nettare ottenuto dai fiori del Prato Poni.
        Fa cambiare forma a una determinata
        specie di Pokémon.
