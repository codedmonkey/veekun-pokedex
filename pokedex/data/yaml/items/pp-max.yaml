pp-max:
  category: vitamins
  cost: 10000
  effect:
    en: |-
      Used on a party Pokémon
      :   Increases a selected move's max [PP]{mechanic:pp} to 1.6× its original max PP.  Increases [happiness]{mechanic:happiness} by 5/3/2.
  flags:
    - countable
    - consumable
    - usable-overworld
    - usable-in-battle
    - holdable
  flavor_text:
    ruby-sapphire:
      en: |-
        Raises the PP of a
        move to its maximum
        points.
    emerald:
      en: |-
        Raises the PP of a
        move to its maximum
        points.
    firered-leafgreen:
      en: |-
        Raises the PP of a selected move
        to its maximum level for one
        POKéMON.
    diamond-pearl:
      en: |-
        It maximally raises the top PP of a
        selected move that has been learned
        by the target Pokémon.
