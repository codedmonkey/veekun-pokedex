        ぎんいろに　かがやく　こな。
        もたせると　むしタイプの
        わざの　いりょくが　あがる。
      ja: |-
        銀色に　輝く　粉。
        持たせると　むしタイプの
        技の　威力が　あがる。
      ko: |-
        은색으로 반짝이는 가루.
        지니게 하면 벌레타입
        기술의 위력이 올라간다.
      en: |-
        An item to be held by a Pokémon.
        It is a shiny, silver powder that will
        boost the power of Bug-type moves.
      fr: |-
        Objet à tenir. De la poudre d’argent brillante qui
        augmente la puissance des capacités de type
        Insecte.
      de: |-
        Ein Item, das einem Pokémon zum Tragen
        gegeben werden kann. Es verstärkt Attacken
        vom Typ Käfer.
      es: |-
        Debe llevarla un Pokémon. La vitalidad de la
        semilla fortalece los movimientos de tipo Planta.
      it: |-
        Strumento da dare a un Pokémon.
        Polvere argentea e brillante che potenzia
        le mosse di tipo Coleottero.
