        さわると　どくをだす　ふしぎなたま。
        もたせると　せんとうちゅうに
        もうどくの　じょうたいに　なる。
      ja: |-
        触ると　毒をだす　不思議な玉。
        持たせると　戦闘中に
        猛毒の　状態に　なる。
      ko: |-
        만지면 독을 발산하는 이상한 구슬.
        지니게 하면 배틀 중에
        맹독 상태가 된다.
      en: |-
