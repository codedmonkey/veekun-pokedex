honor-of-kalos:
  category: plot-advancement
  cost: 0
  effect:
    en: 'Does nothing, but signifies becoming Champion.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        カロスちほうで　すばらしい
        かつやくを　した　じんぶつに
        おくられる　きちょうな　シンボル。
      ja: |-
        カロス地方で　すばらしい
        活躍を　した　人物に
        贈られる　貴重な　シンボル。
      ko: |-
        칼로스지방에서
        훌륭한 활약을 한 인물에게
        주어지는 귀중한 심볼.
      en: |-
        A precious symbol that is awarded
        only to an individual who has done
        great things for the Kalos region.
      fr: |-
        Une récompense symbolique offerte à ceux qui
        ont contribué de manière exceptionnelle à
        la grandeur de Kalos.
      de: |-
        Ein wertvolles Emblem, das all jenen überreicht
        wird, die Großes für die Kalos-Region vollbracht
        haben.
      es: ''
      it: |-
        Prezioso riconoscimento conferito a coloro che
        si sono distinti per le gesta eccezionali nella
        regione di Kalos.
