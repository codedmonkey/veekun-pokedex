meteorite--3:
  category: unused
  cost: 0
  effect:
    en: 'XXX new effect for meteorite--3'
  flags: {  }
  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        えんとつやまで　てにいれた　いんせき。
        ほのかな　ひかりを　はなちつづけている。
        ふれると　じんわり　あたたかい。
      ja: |-
        えんとつ山で　手に入れた　いんせき。
        ほのかな　光を　放ち続けている。
        触れると　じんわり　暖かい。
      ko: |-
        굴뚝산에서 손에 넣은 운석.
        은은한 빛을 계속해서 발하고 있다.
        만지면 은근히 따뜻하다.
      zh-Hant: |-
        在煙囪山上獲得的隕石。
        持續散發著微微光芒。
        摸起來有點暖暖的。
      zh-Hans: |-
        在烟囱山上获得的陨石。
        持续散发着微光。
        摸上去隐约有点暖暖的。
      en: |-
        A Meteorite that you got at Mt. Chimney.
        It continues to give off a faint glow and is slightly
        warm to the touch.
      fr: |-
        Une météorite trouvée au Mont Chimnée.
        Elle émet une faible lueur de façon continue,
        et est légèrement tiède au toucher.
      de: |-
        Ein Meteorit, den du beim Schlotberg erhalten hast.
        Von ihm geht ein schwaches Licht aus. Wenn man
        ihn berührt, wird er warm.
      es: |-
        Meteorito obtenido en el Monte Cenizo. Sigue
        desprendiendo un tenue brillo y es ligeramente
        cálido al tacto.
      it: |-
        Meteorite ottenuto sul Monte Camino.
        Emette una debole luminescenza.
        Toccandolo, si avverte un certo calore.
