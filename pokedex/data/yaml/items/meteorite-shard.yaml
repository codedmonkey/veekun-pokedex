meteorite-shard:
  category: plot-advancement
  cost: 0
  effect:
    en: 'Causes the Meteorite to transform to its final form, allowing Rayquaza to Mega Evolve.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        いしのどうくつに　おちていた
        いんせきのかけらの　ひとつ。
        ふれると　ほのかに　あたたかい。
      ja: |-
        石の洞窟に　落ちていた
        いんせきのかけらの　ひとつ。
        触れると　ほのかに　暖かい。
      ko: |-
        바위 동굴에 떨어진
        운석조각 중의 하나.
        만지면 은근히 따뜻하다.
      zh-Hant: |-
        掉落在石之洞窟裡的
        隕石碎片之一。
        摸起來有點暖暖的。
      zh-Hans: |-
        掉落在石之洞窟里的
        陨石碎片之一。
        摸上去有一点点暖暖的。
      en: |-
        One of the fragments of a Meteorite from
        Granite Cave. It’s faintly warm to the touch.
      fr: |-
        L’un des fragments de météorite tombés dans
        la Grotte Granite. Il est légèrement tiède
        au toucher.
      de: |-
        Eines der Meteoritenstücke aus der Granithöhle.
        Wenn man es berührt, wird es ein bisschen warm.
      es: |-
        Trozo de meteorito encontrado en el suelo de la
        Cueva Granito. Es ligeramente cálido al tacto.
      it: |-
        Frammento di meteorite trovato nella Grotta
        Pietrosa. Toccandolo, si avverte un certo calore.
