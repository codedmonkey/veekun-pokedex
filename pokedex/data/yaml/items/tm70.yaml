        illuminate caves.
    black-white:
      en: |-
        The user flashes a bright light that
        cuts the target’s accuracy.
        It can also be used to illuminate caves.
      fr: |-
        Explosion lumineuse qui fait baisser
        la Précision de l’ennemi. Permet
        aussi d’éclairer les grottes.
    black-2-white-2:
      en: |-
        The user flashes a bright light that
        cuts the target’s accuracy.
        It can also be used to illuminate caves.
    x-y:
      ja-Hrkt: |
        まぶしい　ひかりで　あいての
        めいちゅうりつを　さげる。
      ja: |
        まぶしい　光で　相手の
        命中率を　さげる。
      ko: |-
        눈이 부신 빛으로
        상대의 명중률을 떨어뜨린다.
      en: |-
        The user flashes a bright light that cuts
        the target’s accuracy.
      fr: |-
        Explosion lumineuse qui fait baisser la Précision
        de l’ennemi.
      de: |-
        Ein blendendes Licht reduziert die Genauigkeit
        des Zieles.
      es: |-
        Envuelve al objetivo en confusión, pero también
        sube marcadamente su Ataque.
      it: |-
        Investe il nemico con una luce abbagliante
        che ne riduce la precisione.
    sun-moon:
      ja-Hrkt: |-
        ５ターンの　あいだ　ぶつりと
        とくしゅの　ダメージを　よわめる。
        あられの　ときしか　だせない。
      ja: |-
        ５ターンの　間　物理と
        特殊の　ダメージを　弱める。
        あられの　時しか　出せない。
      ko: |-
        5턴 동안 물리와 특수 기술의
        데미지를 약하게 한다.
        싸라기눈일 때만 쓸 수 있다.
      zh-Hant: |-
        在５回合內減弱
        物理和特殊的傷害。
        在下冰雹時才有效果。
      zh-Hans: |-
        在５回合内减弱
        物理和特殊的伤害。
        只有冰雹时才能使出。
      en: |-
        This move reduces damage from physical and
        special moves for five turns. This can be used only
        in a hailstorm.
      fr: |-
        Réduit les dégâts causés par les capacités
        physiques et spéciales durant cinq tours.
        Ne peut être utilisé que lorsqu’il grêle.
      de: |-
        Schwächt fünf Runden lang den Schaden durch
        physische sowie Spezial-Attacken ab. Diese
        Attacke kann nur bei Hagel eingesetzt werden.
      es: |-
        Reduce el daño de los ataques físicos y especiales
        durante 5 turnos. Solo puede usarse cuando está
        granizando.
      it: |-
        Riduce i danni subiti dalle mosse fisiche e dalle
        mosse speciali per cinque turni.
        Si può usare solo quando grandina.
