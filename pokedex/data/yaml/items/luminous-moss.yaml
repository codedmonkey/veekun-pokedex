luminous-moss:
  category: held-items
  cost: 4000
  effect:
    en: 'Held: If the holder is hit by a damaging Water move, it consumes this item and raises its Special Defense by one stage.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        つかいすての　ひかりごけ。
        もたせて　みずの　わざを　うけると
        とくぼうが　あがる。
      ja: |-
        使い捨ての　ひかりごけ。
        持たせて　みずの　技を　受けると
        特防が　あがる。
      ko: |-
        단 한 번 쓰면 없어지는 빛이끼.
        지니게 하고 물 기술을 받으면
        특수방어가 올라간다.
      en: |-
        An item to be held by a Pokémon.
        It boosts Sp. Def if hit with a Water-
        type attack. It can only be used once.
      fr: |-
        Du lichen à usage unique.
        Tenu, il augmente la Défense Spéciale lorsque
        le Pokémon subit une attaque de type Eau.
      de: |-
        Wird der Träger von einer Wasser-Attacke
        getroffen, steigt seine Spezial-Verteidigung
        und das Item verschwindet.
      es: |-
        Una de las misteriosas Megapiedras. Permite
        megaevolucionar a Aggron en combate.
      it: |-
        Muschio luminoso monouso. Se il Pokémon
        che ha questo strumento subisce una mossa
        di tipo Acqua, la sua Difesa Speciale aumenta.
