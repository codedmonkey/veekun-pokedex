gold-bottle-cap:
  category: loot
  cost: 10000
  effect:
    en: "Trade to Mr. Hyper to set all of a Pokémon's genes to 31."
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        きんいろの　きれいな　おうかん。
        ぎんのおうかんより　めずらしい。
        わたすと　よろこぶ　ひともいる。
      ja: |-
        金色の　きれいな　王冠。
        ぎんのおうかんより　珍しい。
        渡すと　よろこぶ　人もいる。
      ko: |-
        금색의 아름다운 왕관.
        은왕관보다 진귀하다.
        받으면 좋아하는 사람도 있다.
      zh-Hant: |-
        金色的美麗王冠。
        比銀色王冠更珍貴。
        有些人收到它會很高興。
      zh-Hans: |-
        金色的美丽王冠。
        比银色王冠珍贵。
        有些人收到它会很高兴。
      en: |-
        A beautiful bottle cap that gives off a golden gleam.
        Some people are happy to receive one.
      fr: |-
        Une jolie capsule en or, encore plus rare
        que la Capsule d’Argent.
        Certaines personnes adorent en recevoir.
      de: |-
        Ein hübscher goldener Kronkorken. Er ist noch
        seltener als ein Silberkronkorken. Es gibt Leute,
        die sich sehr darüber freuen würden!
      es: |-
        Una bonita chapa de color dorado, menos común
        que su equivalente plateada. Hay gente que las
        aprecia mucho.
      it: |-
        Un bel tappo a corona color oro, più raro del
        Tappo d’argento. Alcuni lo apprezzano molto.
