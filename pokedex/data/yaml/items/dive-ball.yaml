dive-ball:
  category: special-balls
  cost: 1000
  effect:
    en: |-
      Used in battle
      :   Attempts to [catch]{mechanic:catch} a wild Pokémon.  If the wild Pokémon was encountered by surfing or fishing, this ball has a catch rate of 3.5×.  Otherwise, it has a catch rate of 1×.

          If used in a trainer battle, nothing happens and the ball is lost.
  flags:
    - countable
    - consumable
    - usable-in-battle
    - holdable
  flavor_text:
    ruby-sapphire:
      en: |-
        A BALL that works
        better on POKéMON
        on the ocean floor.
    emerald:
      en: |-
        A BALL that works
        better on POKéMON
        on the ocean floor.
    firered-leafgreen:
      en: |-
        A somewhat different BALL that
        works especially well on POKéMON
        deep in the sea.
    diamond-pearl:
