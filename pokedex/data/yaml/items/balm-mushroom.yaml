        あたりいったいに　いい　かおりが
        ひろがる　めずらしい　キノコ。
        ショップで　たかく　うれる。
      ja: |-
        あたりいったいに　いい　香りが
        ひろがる　珍しい　キノコ。
        ショップで　高く　売れる。
      ko: |-
        주변 일대에 좋은 향기가
        퍼지는 희귀한 버섯.
        상점에서 비싸게 팔린다.
      en: |-
        A rare mushroom that gives off
        a nice fragrance. It can be sold at
        a high price to shops.
      fr: |-
        Un champignon rare qui répand un agréable
        parfum autour de lui. Peut être vendu à bon prix
        aux magasins.
      de: |-
        Ein seltener Pilz, der ein angenehmes Aroma
        verbreitet.
      es: |-
        Aumenta bastante la Velocidad en combate.
        Al cambiar de Pokémon, el efecto desaparece.
      it: |-
        Fungo raro che emana un profumo
        gradevolissimo. Si può vendere a un prezzo
        piuttosto alto nei negozi.
