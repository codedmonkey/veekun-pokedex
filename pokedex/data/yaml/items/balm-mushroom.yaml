balm-mushroom:
  category: loot
  cost: 15000
  effect:
    en: 'Cult vendor trash.'
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        A rare mushroom which gives off a nice
        fragrance.
        A maniac will buy it for a high price.
      fr: |-
        Champignon rare qui répand un
        agréable parfum autour de lui.
        Les amateurs en donnent un bon prix.
    black-2-white-2:
      en: |-
        A rare mushroom which gives off a nice
        fragrance.
        A maniac will buy it for a high price.
    x-y:
