lum-berry:
  category: medicine
  cost: 80
  effect:
    en: |-
      Held in battle
      :   When the holder is afflicted with a [major status ailment]{mechanic:major-status-ailment}, it consumes this item to cure the ailment.

      Used on a party Pokémon
      :   Cures any [major status ailment]{mechanic:major-status-ailment}.
  flags:
    - holdable-active
  flavor_text:
    ruby-sapphire:
      en: |-
        A hold item that
        heals status in
        battle.
    emerald:
      en: |-
        A hold item that
        heals any status
        problem in battle.
    firered-leafgreen:
      en: |-
        When held by a POKéMON, it will be
        used in battle to heal any problem.
    diamond-pearl:
      en: |-
        A Poffin ingredient. It may be used
        or held by a Pokémon to recover from
        any status problem.
    platinum:
      en: |-
        A Poffin ingredient. It may be used
        or held by a Pokémon to recover from
        any status problem.
    heartgold-soulsilver:
      en: |-
        It may be used or held by a Pokémon to
        recover from any status problem.
    black-white:
      en: |-
        If held by a Pokémon,
        it recovers from any status problem.
      fr: |-
