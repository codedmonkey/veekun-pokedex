dowsing-machine:
  category: gameplay
  cost: 0
  effect:
    en: |-
      Used by trainer outside of battle
      :   Searches for hidden items.
  flags: {  }
  flavor_text:
    ruby-sapphire:
      en: |-
        A device that
        signals an invisible
        item by sound.
    emerald:
      en: |-
        A device that
        signals an invisible
        item by sound.
    firered-leafgreen:
      en: |-
        A device used for finding items.
        If there is a hidden item nearby
        when it is used, it emits a signal.
    heartgold-soulsilver:
      en: |-
        It checks for unseen items in the area
        and makes noise and lights when it
        finds something.
    black-white:
      en: |-
        It checks for unseen items in the area
        and makes noise and lights when it
        finds something.
      fr: |-
        Un appareil high-tech qui indique
        l’emplacement des objets invisibles
        en émettant un son et en clignotant.
    black-2-white-2:
      en: |-
        It checks for unseen items in the area
        and makes noise and lights when it
        finds something.
    x-y:
      ja-Hrkt: |-
        みえない　どうぐに　はんのうして
        おとと　ひかりで　おしえてくれる
        さいしんの　きかい。
      ja: |-
        みえない　道具に　反応して
        音と　光で　教えてくれる
        最新の　機械。
      ko: |-
        보이지 않는 도구에 반응해서
        소리와 빛으로 가르쳐주는
        최신 기계.
      en: |-
        It searches for hidden items in the
        area and emits different lights and
        sounds when it detects something.
      fr: |-
        Un appareil high-tech qui indique l’emplacement
        des objets invisibles en émettant un son et en
        clignotant.
      de: |-
        Scannt die Umgebung nach unsichtbaren Items.
        Es blinkt und piept, sobald es etwas findet.
      es: |-
        Bonguri de color blanco que no desprende aroma
        alguno.
      it: |-
        Dispositivo ultramoderno che indica la direzione
        in cui si trovano gli strumenti invisibili
        emettendo dei suoni.
    sun-moon:
      ja-Hrkt: |-
        みえない　どうぐに　はんのうして
        ばしょを　おしえてくれる　さいしんの
        きかい。あたまに　つけて　つかう。
      ja: |-
        みえない　道具に　反応して
        場所を　教えてくれる　最新の　機械。
        頭に　つけて　使う。
      ko: |-
        보이지 않는 도구에 반응해서
        장소를 가르쳐주는 최신 기계.
        머리에 쓰고 사용한다.
      zh-Hant: |-
        會對看不見的道具起反應，
        並將它的位置告訴你的最尖端機器。
        戴在頭上使用。
      zh-Hans: |-
        会对看不见的道具起反应，
        并将它的位置告诉你的最尖端机器。
        戴在头上使用。
      en: |-
        This high-tech machine shows the location of
        invisible items. It’s attached to the head when
        in use.
      fr: |-
        Un appareil high-tech qui indique l’emplacement
        des objets invisibles. Il se porte sur la tête.
      de: |-
        Scannt die Umgebung nach unsichtbaren Items und
        zeigt an, wo diese sich befinden. Es wird auf dem
        Kopf getragen.
      es: |-
        Aparato de precisión que reacciona ante objetos
        que no se ven. Para usarlo, es necesario
        colocárselo en la cabeza.
      it: |-
        Dispositivo ultramoderno che rileva la presenza
        di strumenti non visibili a occhio nudo.
        Si indossa sulla testa.
