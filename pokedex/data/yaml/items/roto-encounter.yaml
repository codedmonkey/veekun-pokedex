  flags: {  }
  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        ロトムパワーの　ひとつ。
        いっていじかん　レベルの　たかい
        やせいポケモンと　であいやすくなる。
      ja: |-
        ロトムパワーの　ひとつ。
        一定時間　レベルの　高い
        野生ポケモンと　出会いやすくなる。
      ko: |-
        로토무파워 중 하나.
        일정 시간 레벨이 높은
        야생 포켓몬과 만나기 쉬워진다.
      zh-Hant: |-
        洛托姆之力的一種。
        在一定時間內可以變得
        容易遇見等級高的野生寶可夢。
      zh-Hans: |-
        洛托姆之力的一种。
        一定时间内，会变得容易
        遇到高等级的野生宝可梦。
      en: |-
        One of the Rotom Powers.
        It increases the chance of encountering high-level
        wild Pokémon a lot for a certain period of time.
      fr: |-
        Une des Motism’Auras. Elle permet de rencontrer
        plus de Pokémon sauvages de haut niveau durant
        une période déterminée.
      de: |-
        Diese Rotom-Kraft bewirkt, dass wilde Pokémon
        mit hohem Level für eine bestimmte Zeit viel
        häufiger erscheinen.
      es: |-
        Poder Rotom que aumenta la probabilidad de
        encontrar Pokémon salvajes de nivel alto durante
        un tiempo determinado.
      it: |-
        Potere Rotom che aumenta le probabilità
        di incontrare Pokémon selvatici di livello alto
        per un certo lasso di tempo.
