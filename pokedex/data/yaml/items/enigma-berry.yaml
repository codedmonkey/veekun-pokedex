enigma-berry:
  category: other
  cost: 80
  effect:
    en: |-
      Held in battle
      :   When the holder takes [super-effective]{mechanic:super-effective} damage, it consumes this item to restore 1/4 its max [HP]{mechanic:hp}.
  flags:
    - holdable-active
  flavor_text:
    ruby-sapphire:
      en: |-
        POKéBLOCK ingredient.
        Plant in loamy soil
        to grow a mystery.
    emerald:
      en: |-
        POKéBLOCK ingredient.
        Plant in loamy soil
        to grow a mystery.
    firered-leafgreen:
      en: |-
        Can be ground up into a powder as
        an ingredient for medicine.
    diamond-pearl:
      en: |-
        A Poffin ingredient. If held by a
        Pokémon, it restores its HP if it is
        hit by a foe’s supereffective attack.
    platinum:
      en: |-
        A Poffin ingredient. If held by a
        Pokémon, it restores its HP if it is
        hit by a foe’s supereffective attack.
    heartgold-soulsilver:
      en: |-
        If held by a Pokémon, it restores
        its HP if it is hit by a foe’s
        supereffective attack.
    black-white:
      en: |-
        If held by a Pokémon, it restores
        its HP if it is hit by any
        supereffective attack.
      fr: |-
        Tenue, cette Baie restaure les PV
        du Pokémon s’il subit une attaque
        super efficace.
    black-2-white-2:
      en: |-
        If held by a Pokémon, it restores
        its HP if it is hit by any
        supereffective attack.
    x-y:
      ja-Hrkt: |-
        ポケモンに　もたせると
        こうかばつぐんの　わざを
        うけたとき　ＨＰを　かいふくする。
      ja: |-
        ポケモンに　持たせると
        効果バツグンの　技を
        受けたとき　ＨＰを　回復する。
      ko: |-
        포켓몬에게 지니게 하면
        효과가 뛰어난 공격을
        받았을 때 HP를 회복한다.
      en: |-
        A Berry to be consumed by Pokémon.
        If a Pokémon holds one, being hit by a
        supereffective attack will restore its HP.
      fr: |-
        Tenue, cette Baie restaure les PV du Pokémon
        s’il subit une attaque super efficace.
      de: |-
        Als getragenes Item füllt diese Beere die KP
        eines Pokémon auf, wenn es von sehr effektiven
        Attacken getroffen wird.
      es: |-
        Un orbe fantástico que debe llevar Latios o Latias.
        Sube su Ataque Especial y su Defensa Especial.
      it: |-
        Se il Pokémon che ha questa bacca è colpito da
        un attacco superefficace, i suoi PS vengono
        ripristinati.
