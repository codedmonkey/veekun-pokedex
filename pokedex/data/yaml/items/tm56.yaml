tm56:
  category: all-machines
  cost: 1000
  effect:
    en: 'Teaches Fling to a compatible Pokémon.'
  flags: {  }
  flavor_text:
    diamond-pearl:
      en: |-
        The user flings its held item at the
        foe to attack. Its power and effects
        depend on the item.
    platinum:
      en: |-
        The user flings its held item at the
        foe to attack. Its power and effects
        depend on the item.
    heartgold-soulsilver:
      en: |-
        The user flings its held item at the
        foe to attack. Its power and effects
        depend on the item.
    black-white:
      en: |-
        The user flings its held item at the
        target as an attack. Its power and
        effects depend on the item.
      fr: |-
        Le lanceur envoie l’objet qu’il tient
        sur l’ennemi. La puissance et les
        effets dépendent de l’objet.
    black-2-white-2:
      en: |-
        The user flings its held item at the
        target as an attack. Its power and
        effects depend on the item.
    x-y:
      ja-Hrkt: |-
        どうぐを　なげつけて　こうげきする。
        なげる　もちものに　よって　わざの
        いりょくと　こうかは　かわる。
      ja: |-
        持たせた　道具を
        素早く　投げつけて　攻撃する。
        道具で　威力と　効果が　かわる。
      ko: |-
        도구를 내던져서 공격한다.
        던질 물건에 따라 기술의
        위력과 효과가 바뀐다.
      en: |-
        The user flings its held item at the target
        to attack. This move’s power and effects
        depend on the item.
      fr: |-
        Le lanceur envoie l’objet qu’il tient sur l’ennemi.
        La puissance et les effets dépendent de l’objet.
      de: |-
        Der Anwender wirft sein Item auf das Ziel.
        Die Kraft und die Wirkung hängen vom
        jeweiligen Item ab.
      es: |-
        Débil descarga eléctrica que se lanza contra el
        objetivo y causa parálisis si es certera.
      it: |-
        Chi la usa lancia il suo strumento addosso
        al nemico. La forza e l’effetto dipendono
        dallo strumento.
    sun-moon:
      ja-Hrkt: |-
        もたせた　どうぐを
        すばやく　なげつけて　こうげきする。
        どうぐで　いりょくと　こうかが　かわる。
      ja: |-
        持たせた　道具を
        素早く　投げつけて　攻撃する。
        道具で　威力と　効果が　変わる。
      ko: |-
        지니게 한 도구를
        재빠르게 내던져서 공격한다.
        도구에 따라 위력과 효과가 바뀐다.
      zh-Hant: |-
        快速投擲攜帶的道具進行攻擊。
        招式威力和效果會隨著
        道具不同而改變。
      zh-Hans: |-
        快速投掷携带的道具进行攻击。
        根据道具不同，
        威力和效果会改变。
      en: |-
        The user flings its held item at the target to attack.
        This move’s power and effects depend on the item.
      fr: |-
        Le lanceur envoie l’objet qu’il tient sur l’ennemi.
        La puissance et les effets dépendent de l’objet.
      de: |-
        Der Anwender wirft sein Item auf das Ziel. Die Kraft
        und die Wirkung hängen vom jeweiligen Item ab.
      es: |-
        El usuario ataca al objetivo arrojando el objeto
        que lleve. La potencia y los efectos dependen
        del objeto arrojado.
      it: |-
        Chi la usa lancia il suo strumento addosso
        al bersaglio. La forza e l’effetto dipendono
        dallo strumento.
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        もたせた　どうぐを
        すばやく　なげつけて　こうげきする。
        どうぐで　いりょくと　こうかが　かわる。
      ja: |-
        持たせた　道具を
        素早く　投げつけて　攻撃する。
        道具で　威力と　効果が　変わる。
      ko: |-
        지니게 한 도구를
        재빠르게 내던져서 공격한다.
        도구에 따라 위력과 효과가 바뀐다.
      zh-Hant: |-
        快速投擲攜帶的道具進行攻擊。
        招式威力和效果會隨著
        道具不同而改變。
      zh-Hans: |-
        快速投掷携带的道具进行攻击。
        根据道具不同，
        威力和效果会改变。
      en: |-
        The user flings its held item at the target to attack.
        This move’s power and effects depend on the item.
      fr: |-
        Le lanceur envoie l’objet qu’il tient sur l’ennemi.
        La puissance et les effets dépendent de l’objet.
      de: |-
        Der Anwender wirft sein Item auf das Ziel. Die Kraft
        und die Wirkung hängen vom jeweiligen Item ab.
      es: |-
        El usuario ataca al objetivo arrojando el objeto
        que lleve. La potencia y los efectos dependen
        del objeto arrojado.
      it: |-
        Chi la usa lancia il suo strumento addosso
        al bersaglio. La forza e l’effetto dipendono
        dallo strumento.
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        あいての　まわりに　むすうの　いわを
        うかべて　こうたいで　でてきた　あいての
        ポケモンに　ダメージを　あたえる。
      ja: |-
        相手の　周りに　無数の　岩を
        浮かべて　交代で　でてきた　相手の
        ポケモンに　ダメージを　与える。
      ko: |-
        상대의 주위에 무수한 바위를
        띄워 교체해서 나온 상대
        포켓몬에게 데미지를 준다.
      zh-Hant: |-
        在對手周圍撒下無數飄浮的岩石，
        讓對手替換出場的寶可夢受到傷害。
      zh-Hans: |-
        将无数岩石悬浮在对手的周围，
        从而对替换出场的对手的
        宝可梦给予伤害。
      en: |-
        The user lays a trap of levitating stones around the
        opposing team. The trap hurts opposing Pokémon
        that switch into battle.
      fr: |-
        Lance des pierres flottantes autour de l’ennemi,
        qui blessent tout adversaire entrant au combat.
      de: |-
        Falle mit schwebenden Steinen. In den Kampf
        eingewechselte Ziele nehmen Schaden.
      es: |-
        Una trampa de rocas que flota en el aire y daña a 
        los objetivos que entran en combate.
      it: |-
        Chi la usa piazza una trappola di rocce sospese
        che danneggia i nemici che entrano in campo.
    sword-shield:
      ja-Hrkt: |-
        こうげき　したあと
        ものすごい　スピードで　もどってきて
        ひかえ　ポケモンと　いれかわる。
      ja: |-
        攻撃したあと
        ものすごい　スピードで　もどってきて
        控えの　ポケモンと　入れ替わる。
      ko: |-
        공격한 뒤
        굉장한 스피드로 돌아와서
        교대 포켓몬과 교체한다.
      zh-Hant: |-
        攻擊後迅速返回，
        和後備寶可夢進行替換。
      zh-Hans: |-
        在攻击之后急速返回，
        和后备宝可梦进行替换。
      en: |-
        After making its attack, the user rushes back to
        switch places with a party Pokémon in waiting.
      fr: |-
        Après son attaque, le lanceur revient à toute vitesse
        et change de place avec un Pokémon de l’équipe
        prêt au combat.
      de: |-
        Nach der Attacke eilt der Anwender zurück und
        tauscht den Platz mit einem anderen Pokémon.
      es: |-
        Tras atacar, el usuario vuelve a toda prisa para dar paso
        a otro Pokémon del equipo.
      it: |-
        Chi usa questa mossa fa marcia indietro per farsi
        sostituire dopo aver sferrato l’attacco.
