        神奇的金色叶子。
        至今仍未发现能长出
        这种叶子的树木。
      en: |-
        A mysterious gold leaf. No trees with this leaf have
        been found yet.
      fr: |-
        Une feuille dorée mystérieuse. Elle ne semble
        appartenir à aucun arbre connu.
      de: |-
        Ein rätselhaftes Blatt mit goldener Färbung. Bisher hat
        man noch keinen Baum entdeckt, an dem solche Blätter
        wachsen.
      es: |-
        Extraña hoja de color dorado. Se desconoce de qué
        árbol procede.
      it: |-
        Una strana foglia dorata. Nessuno sa da che albero
        provenga.
