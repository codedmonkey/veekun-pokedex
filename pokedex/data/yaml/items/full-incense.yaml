full-incense:
  category: bad-held-items
  cost: 5000
  effect:
    en: "Held: The holder will go last within its move's priority bracket, regardless of Speed.  If multiple Pokémon within the same priority bracket are subject to this effect, the slower Pokémon will go first.  The holder will move after Pokémon with Stall.  If the holder has Stall, Stall is ignored.  This item ignores Trick Room."
  flags:
    - holdable
    - holdable-active
  flavor_text:
    diamond-pearl:
      en: |-
        An item to be held by a Pokémon. It is
        an exotic-smelling incense that makes
        the holder bloated and slow moving.
