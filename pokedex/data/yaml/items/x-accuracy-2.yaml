x-accuracy-2:
  category: miracle-shooter
  cost: 0
  effect:
    en: |-
      Used on a party Pokémon in battle
      :   Raises the target's [accuracy]{mechanic:accuracy} by two [stages]{mechanic:stage}.
      This item can only be obtained or used via the Wonder Launcher.
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        It sharply raises the accuracy of a
        Pokémon in battle. It wears off if the
        Pokémon is withdrawn.
      fr: |-
        Monte un peu la Précision pendant
        un combat. L’effet s’estompe
        si le Pokémon se retire.
    black-2-white-2:
      en: |-
        It sharply raises the accuracy of a
        Pokémon in battle. It wears off if the
        Pokémon is withdrawn.
    x-y:
      ja-Hrkt: |-
        せんとうちゅうの　ポケモンの
        めいちゅうを　それなりに　あげる。
        ひっこめると　もとに　もどる。
      ja: |-
        戦闘中の　ポケモンの
        命中を　それなりに　あげる。
        ひっこめると　元に　戻る。
      ko: |-
        배틀 중인 포켓몬의 명중률을
        그럭저럭 올린다. 포켓몬을 볼에
        넣어버리면 원래대로 되돌아간다.
      en: |-
        It sharply raises the accuracy of a
        Pokémon in battle. It wears off if the
        Pokémon is withdrawn.
      fr: |-
        Augmente un peu la Précision pendant un combat.
        L’effet s’estompe si le Pokémon se retire.
      de: |-
        Hebt die Genauigkeit eines Pokémon im Kampf
        leicht an. Die Wirkung endet mit dem Austausch
        des Pokémon.
      es: |-
        Forma que adoptó Zekrom al perder su cuerpo.
        Espera la llegada de un nuevo héroe.
      it: |-
        Aumenta molto la precisione di un Pokémon in
        una lotta. L’effetto svanisce se il Pokémon
        è sostituito.
