  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        ピカチュウの　ボルテッカーを
        とくべつな　Ｚワザに　グレードアップする
        Ｚパワーの　けっしょうを　つくりだす。
      ja: |-
        ピカチュウの　ボルテッカーを
        特別な　Ｚワザに　グレードアップする
        Ｚパワーの　結晶を　作りだす。
      ko: |-
        피카츄의 볼트태클을
        특별한 Z기술로 업그레이드하는
        Z파워의 결정을 만들어 낸다.
      zh-Hant: |-
        會製造出把皮卡丘的伏特攻擊
        升級為特殊Ｚ招式的Ｚ力量結晶。
      zh-Hans: |-
        可用它来制造用于对战
        并能将皮卡丘的伏特攻击
        升级成特殊Ｚ招式的Ｚ力量结晶。
      en: |-
        It converts Z-Power into crystals that upgrade
        Pikachu’s Volt Tackle to an exclusive Z-Move.
      fr: |-
        Permet de concentrer la Force Z en un cristal,
        qui autorise le Pikachu qui le tient à transformer
        son Électacle en capacité Z.
      de: |-
        Kristallisierte Z-Kraft, die Pikachus Attacke
        Volttackle zu einer Z-Attacke aufstuft.
        Wird bei Bedarf automatisch vervielfacht.
      es: |-
        Concentra el Poder Z en cristales que permiten a
        Pikachu convertir su Placaje Eléc en un
        movimiento Z.
      it: |-
        Permette di creare cristalli carichi di Potere Z che
        consentono a Pikachu di trasformare la mossa
        Locomovolt in una mossa Z.
