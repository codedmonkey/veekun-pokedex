pink-nectar:
  category: species-specific
  cost: 300
  effect:
    en: 'Changes Oricorio to Pa’u Style.  Single-use and cannot be used in battle.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        ロイヤルアベニューの　かだんで
        てにいれた　はなのミツ。　とくていの
        ポケモンの　すがたを　かえる。
      ja: |-
        ロイヤルアベニューの　花壇で
        手に入れた　花のミツ。　特定の
        ポケモンの　姿を　変える。
      ko: |-
        로열 애버뉴 화단에서 손에 넣은
        꽃의 꿀. 특정 포켓몬의
        모습을 바꾼다.
      zh-Hant: |-
        在皇家大道的花壇裡獲得的花蜜。
        可以改變特定寶可夢的樣子。
      zh-Hans: |-
        在皇家大道的花园里获得的花蜜。
        可以改变特定宝可梦的样子。
      en: |-
        The flower nectar obtained at the flowering shrubs
        on Royal Avenue.
        It changes the form of certain species of Pokémon.
      fr: |-
        Un nectar obtenu à partir des fleurs de la Rue
        du Dôme Royal. Permet à un certain Pokémon
        de changer d’apparence.
      de: |-
        Blütennektar von der Blumeninsel nahe der Avenue
        Royale. Ein bestimmtes Pokémon kann damit seine
        Form ändern.
      es: |-
        Néctar de ciertas flores de los parterres de la
        Avenida Royale, capaz de hacer cambiar de forma
        a una determinada especie de Pokémon.
      it: |-
        Nettare ottenuto dai fiori delle aiuole di Viale
        Royale. Fa cambiare forma a una determinata
        specie di Pokémon.
