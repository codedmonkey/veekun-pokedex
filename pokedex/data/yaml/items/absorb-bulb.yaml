absorb-bulb:
  category: held-items
  cost: 4000
  effect:
    en: |-
      Held
      :   When the holder takes []{type:water}-type damage from a move, its [Special Attack]{mechanic:special-attack} rises by one [stage]{mechanic:stage} and this item is consumed.
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        A consumable bulb. If the holder is hit
        by a Water-type move, its Sp. Atk
        will rise.
      fr: |-
        Bulbe jetable. Tenu, il augmente la
        Défense Spéciale lorsque le Pokémon
        subit une attaque de type Eau.
    black-2-white-2:
      en: |-
        A consumable bulb. If the holder is hit
        by a Water-type move, its Sp. Atk
        will rise.
    x-y:
      ja-Hrkt: |-
        つかいすての　きゅうこん。
        もたせて　みずの　わざを　うけると
        とくこうが　あがる。
      ja: |-
        使い捨ての　きゅうこん。
        持たせて　みずの　技を　受けると
        特攻が　あがる。
      ko: |-
        단 한 번 쓰면 없어지는 구근.
        지니게 하고 물 기술을 받으면
        특수공격이 올라간다.
      en: |-
        An item to be held by a Pokémon.
        It boosts Sp. Atk if hit with a Water-
        type attack. It can only be used once.
      fr: |-
        Un bulbe jetable.
        Tenu, il augmente l’Attaque Spéciale lorsque
        le Pokémon subit une attaque de type Eau.
      de: |-
        Eine einmalig einsetzbare Knolle. Erhöht den
        Spezial-Angriff des Trägers, wenn ihn eine
        Wasser-Attacke trifft.
      es: |-
        Joya de un solo uso que potencia los
        movimientos de tipo Normal. Debe llevarla
        un Pokémon.
      it: |-
        Bulbo monouso. Se il Pokémon che ha questo
        strumento subisce una mossa di tipo Acqua,
        il suo Attacco Speciale aumenta.
