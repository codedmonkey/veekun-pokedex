        おおむかし　ちじょうで　くらした
        こだい　ポケモンの　カセキ。
        えりかざりの　いちぶ　らしい。
      ja: |-
        大昔　地上で　暮らした
        古代ポケモンの　カセキ。
        襟飾りの　一部らしい。
