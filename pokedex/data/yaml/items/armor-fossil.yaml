armor-fossil:
  category: dex-completion
  cost: 7000
  effect:
    en: 'Give to a scientist in the []{location:mining-museum} in []{location:oreburgh-city} or the Museum of Science in []{location:pewter-city} to receive a []{pokemon:shieldon}.'
