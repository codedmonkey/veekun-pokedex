luck-incense:
  category: training
  cost: 11000
  effect:
    en: 'Held: Doubles the money the trainer receives after an in-game trainer battle.  This effect cannot apply more than once to the same battle.'
  flags:
    - holdable
    - holdable-active
  flavor_text:
    diamond-pearl:
      en: |-
        An item to be held by a Pokémon.
        It doubles a battle’s prize money if
        the holding Pokémon joins in.
    platinum:
      en: |-
        An item to be held by a Pokémon.
        It doubles a battle’s prize money if
        the holding Pokémon joins in.
    heartgold-soulsilver:
      en: |-
        An item to be held by a Pokémon.
        It doubles a battle’s prize money if
        the holding Pokémon joins in.
    black-white:
      en: |-
        An item to be held by a Pokémon.
        It doubles a battle’s prize money if
        the holding Pokémon joins in.
      fr: |-
        Objet à tenir. Double l’argent gagné
        si le porteur se joint au combat.
    black-2-white-2:
      en: |-
        An item to be held by a Pokémon.
        It doubles a battle’s prize money if
        the holding Pokémon joins in.
    x-y:
      ja-Hrkt: |-
        もたせた　ポケモンが　いちどでも
        せんとうに　かおを　だすと
        おかねが　２ばい　もらえる。
      ja: |-
        持たせた　ポケモンが　１度でも
        戦闘に　顔を　だすと
        お金が　２倍　もらえる。
      ko: |-
        지니게 한 포켓몬이
        한 번이라도 배틀에 나가면
        돈을 2배로 받을 수 있다.
      en: |-
        An item to be held by a Pokémon.
        It doubles any prize money received
        if the holding Pokémon joins a battle.
      fr: |-
        Objet à tenir. Double l’argent gagné si le porteur
        se joint au combat.
      de: |-
        Ein Item, das ein Pokémon trägt und das
        doppeltes Preisgeld bringt, wenn der Träger
        am Kampf teilnimmt.
      es: |-
        Un líquido venenoso que cubre al objetivo y
        provoca un daño doble si este ya estaba
        envenenado.
      it: |-
        Strumento da dare a un Pokémon.
        Se chi ce l’ha partecipa alla lotta,
        i guadagni raddoppiano.
