diancite:
  category: mega-stones
  cost: 0
  effect:
    en: 'Held: Allows Diancie to Mega Evolve into Mega Diancie.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        ディアンシーに　もたせておくと
        たたかいのとき　メガシンカが　できる
        ふしぎな　メガストーンの　いっしゅ。
      ja: |-
        ディアンシーに　持たせておくと
        戦いのとき　メガシンカが　できる
        不思議な　メガストーンの　一種。
      ko: |-
        디안시에게 지니게 하면
        배틀할 때 메가진화할 수 있는
        신비한 메가스톤의 일종.
      zh-Hant: |-
        讓蒂安希攜帶後，
        在戰鬥時就能進行超級進化的
        一種神奇超級石。
      zh-Hans: |-
        让蒂安希携带后，
        在战斗时就能进行超级进化的
        一种神奇超级石。
      en: |-
        One of a variety of mysterious Mega Stones.
        Have Diancie hold it, and this stone will enable it
        to Mega Evolve during battle.
      fr: |-
        Une variété de Méga-Gemme.
        Tenue par un Diancie, elle lui permet de
        méga-évoluer durant un combat.
      de: |-
        Einer der mysteriösen Mega-Steine. Wird er von
        einem Diancie getragen, kann es im Kampf eine
        Mega-Entwicklung durchführen.
      es: |-
        Una de las misteriosas Megapiedras. Permite
        megaevolucionar a Diancie en combate.
      it: |-
        Una delle misteriose Megapietre.
        Data a Diancie, gli permette di megaevolversi
        durante la lotta.
