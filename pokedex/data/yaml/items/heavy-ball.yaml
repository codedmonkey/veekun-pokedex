heavy-ball:
  category: apricorn-balls
  cost: 0
  effect:
    en: |-
      Used by a trainer in battle
      :   Attempts to [catch]{mechanic:catch} a wild Pokémon.  If used in a trainer battle, nothing happens and the ball is lost.

          If the wild Pokémon weighs:

          * 409.6 kg (903.0 lb) or more, its catch rate is 40 more than normal.
          * 307.2 kg (677.3 lb) or more, its catch rate is 30 more than normal.
          * 204.8 kg (451.5 lb) or more, its catch rate is 20 more than normal.
          * less than 204.8 kg (451.5 lb), its catch rate is 20 less than normal.
  flags: {  }
  flavor_text:
    heartgold-soulsilver:
      en: |-
        A Poké Ball for catching very heavy
        Pokémon.
    black-white:
      en: |-
        A Poké Ball for catching very heavy
        Pokémon.
      fr: |-
        Une Poké Ball un peu spéciale qui
        fonctionne particulièrement bien sur
        les Pokémon lourds.
    black-2-white-2:
      en: |-
        A Poké Ball for catching very heavy
        Pokémon.
    x-y:
      ja-Hrkt: |-
        たいじゅうの　おもい　ポケモンが
        つかまえやすくなる
        ちょっと　かわった　ボール。
      ja: |-
        体重の　重い　ポケモンが
        捕まえやすくなる
        ちょっと　変わった　ボール。
      ko: |-
        체중이 무거운 포켓몬이
        잡기 쉬워지는
        조금 특이한 볼.
      en: |-
        A Poké Ball that is better than usual
        at catching very heavy Pokémon.
      fr: |-
        Une Poké Ball un peu spéciale qui fonctionne
        particulièrement bien sur les Pokémon lourds.
      de: |-
        Ein Ball, der sich besonders gut eignet,
        um Pokémon mit hohem Körpergewicht
        zu fangen.
      es: |-
        Contiene los datos del Pokéathlon con el número
        de victorias en Nieve Cruzada.
      it: |-
        Poké Ball un po’ diversa che funziona
        particolarmente bene con i Pokémon pesanti.
