magost-berry:
  category: baking-only
  cost: 20
  effect:
    en: 'No effect; only useful for planting and cooking.'
  flags: {  }
  flavor_text:
    ruby-sapphire:
      en: |-
        POKéBLOCK ingredient.
        Plant in loamy soil
        to grow MAGOST.
    emerald:
      en: |-
        POKéBLOCK ingredient.
        Plant in loamy soil
        to grow MAGOST.
    firered-leafgreen:
      en: |-
        Can be ground up into a powder as
        an ingredient for medicine.
    diamond-pearl:
      en: |-
        A Poffin ingredient.
        Bury it in soft soil to grow a
        Magost Plant.
    platinum:
      en: |-
        A Poffin ingredient.
        Bury it in soft soil to grow a
        Magost Plant.
    heartgold-soulsilver:
      en: |-
        In the Sinnoh region, they like to make
        sweets known as Poffins with this Berry
        and feed them to their Pokémon.
    black-white:
      en: |-
        A Berry which is very rare in the
        Unova region.
        A maniac will buy it for a high price.
      fr: |-
        Baie très rare à Unys.
        Les amateurs en donnent un bon prix.
    black-2-white-2:
      en: |-
        A Berry which is very rare in the
        Unova region.
        A maniac will buy it for a high price.
    x-y:
      ja-Hrkt: |-
        イッシュちほうでは　とても
        めずらしい　きのみ。
      ja: |-
        イッシュ地方では　とても
        珍しい　きのみ。
      ko: |-
        하나지방에서는 매우
        희귀한 나무열매.
      en: |-
        A Berry to be used in cooking.
        This Berry is very rare and hard
        to obtain in the Unova region.
      fr: 'Une Baie très rare à Unys.'
      de: |-
        Eine Beerensorte, die in der Einall-Region
        ganz besonders selten ist.
      es: |-
        Si la lleva un Pokémon, debilita un ataque
        supereficaz de tipo Psíquico de un enemigo.
      it: 'Bacca molto rara a Unima.'
    sun-moon:
      ja-Hrkt: |-
        かわいさに　みがきを　かける　ための
        ポロックを　つくるとき　つかわれる。
        ほかの　ちほうでは　めずらしい　きのみ。
      ja: |-
        かわいさに　磨きを　かける　ための
        ポロックを　つくるとき　使われる。
        ほかの　地方では　めずらしい　きのみ。
      ko: |-
        귀여움을 연마하기 위한
        포켓몬스넥을 만들 때 사용된다.
        다른 지방에서는 희귀한 나무열매.
      zh-Hant: |-
        製作用於增進可愛的
        寶可方塊時使用。
        在其他地區很少見的樹果。
      zh-Hans: |-
        用于制作宝可方块，
        制作出来的宝可方块可用来打磨可爱。
        在其他地区很少见的树果。
      en: |-
        Used to make Pokéblocks that will enhance your
        Cuteness, this Berry is rare in other regions.
      fr: |-
        Une Baie très rare en dehors de cette région,
        utilisée pour préparer des Pokéblocs permettant
        d’augmenter la Grâce d’un Pokémon.
      de: |-
        Eine Beerensorte, die als Zutat für Pokériegel
        verwendet wird, welche die Putzigkeit erhöhen.
        In anderen Regionen ist sie eher selten zu finden.
      es: |-
        Se utiliza en la producción de Pokécubos que
        potencian la dulzura. Es una baya muy rara en
        otras regiones.
      it: |-
        Bacca difficile da trovare al di fuori di Hoenn
        usata per creare Pokémelle che aumentano
        la Grazia del Pokémon.
