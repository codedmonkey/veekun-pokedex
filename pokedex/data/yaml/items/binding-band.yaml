binding-band:
  category: held-items
  cost: 4000
  effect:
    en: |-
      Held
      :   Moves used by the holder that trap and damage a target for multiple turns (e.g. []{move:bind}, []{move:fire-spin}) inflict twice their usual per-turn damage.
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        A band that increases the power of
        binding moves when held.
      fr: |-
        Objet à tenir augmentant la puissance
        des attaques immobilisantes telles
        que Ligotage ou Étreinte.
    black-2-white-2:
      en: |-
        A band that increases the power of
        binding moves when held.
    x-y:
      ja-Hrkt: |-
        しめつけるわざを　ほじょする　バンド。
        もたせると　しめつけるわざの
        いりょくが　つよく　なる。
      ja: |-
        締めつける技を　補助する　バンド。
        持たせると　締めつける技の
        威力が　強くなる。
      ko: |-
        조이기 기술을 보조하는 밴드.
        지니게 하면 조이기 기술의
        위력이 강해진다.
      en: |-
        An item to be held by a Pokémon.
        A band that increases the power of
        binding moves used by the holder.
      fr: |-
        Objet à tenir. Augmente la puissance des
        attaques immobilisantes telles que Ligotage
        ou Étreinte.
      de: |-
        Ein Band, das die Stärke aller Klammerattacken
        des Trägers erhöht.
      es: |-
        Joya de un solo uso que potencia los
        movimientos de tipo Acero. Debe llevarla
        un Pokémon.
      it: |-
        Strumento da dare a un Pokémon che aumenta
        la potenza di mosse come Avvolgibotta e
        Legatutto.
