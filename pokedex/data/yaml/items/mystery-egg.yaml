mystery-egg:
  category: plot-advancement
  cost: 0
  effect:
    en: "Must be obtained to trigger the break-in at Professor Elm's lab, the first rival battle, and access to []{location:johto-route-31}."
  flags: {  }
  flavor_text:
    heartgold-soulsilver:
      en: |-
        A mysterious Egg obtained from Mr.
        Pokémon. What’s in the Egg is unknown.
    black-white:
      en: |-
        A mysterious Egg obtained from Mr.
        Pokémon. What’s in the Egg is unknown.
      fr: |-
        Un œuf étrange confié par M. Pokémon.
        Personne ne sait ce qu’il contient.
    black-2-white-2:
      en: |-
        A mysterious Egg obtained from Mr.
        Pokémon. What’s in the Egg is unknown.
    x-y:
      ja-Hrkt: |-
        ポケモンじいさんから　あずかった
        ふしぎな　もようの　タマゴ。
        なんの　タマゴか　わからない。
      ja: |-
        ポケモンじいさんから　あずかった
        不思議な　もようの　タマゴ。
        なんの　タマゴか　わからない。
      ko: |-
        포켓몬 할아버지로부터 받은
        이상한 모양의 알.
        어떤 알인지 모른다.
      en: |-
        A mysterious Egg obtained from Mr. Pokémon.
        What is in the Egg is unknown.
      fr: |-
        Un Œuf étrange confié par M. Pokémon.
        Personne ne sait ce qu’il contient.
      de: |-
        Ein seltsam gemustertes Ei, das du von
        Mr. Pokémon erhalten hast. Sein Inhalt
        liegt im Dunkeln.
      es: |-
        Campana de aspecto antiguo que emite un sonido
        que calma el espíritu.
      it: |-
        Uovo dai disegni bizzarri che si riceve da
        Mr. Pokémon. Non si sa che cosa contenga.
    sun-moon:
