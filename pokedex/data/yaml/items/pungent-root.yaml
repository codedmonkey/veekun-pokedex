pungent-root:
  category: curry-ingredients
  cost: 950
  effect: {  }
  flags: {  }
  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        キャンプの　りょうりに　つかう
        しょくざいの　いっしゅ。てきとうに　つんだ
        ハーブが　かおり　いろどりを　ついかする。
      ja: |-
        キャンプの　料理に　使う
        食材の　一種。適当に　摘んだ
        ハーブが　香り　彩りを　追加する。
      ko: |-
        캠프 요리에 사용되는
        식재료 중 하나. 알맞게 딴
        허브가 향과 색감을 더해준다.
      zh-Hant: |-
        製作露營料理時使用的食材之一。
        隨手摘取的香草能夠為料理
        增添香氣和色彩。
      zh-Hans: |-
        在露营营地制作料理时会使用的
        一种食材。将信手摘取的香草
        点缀在上面，使料理更加色香味俱全。
      en: |-
        One of the many ingredients that can be used for
        cooking at your camp. Though carelessly picked, these
        herbs can add a fragrant accent to a dish.
      fr: |-
        Un ingrédient de cuisine pour le camping.
        Cette racine permet d’ajouter du parfum
        et de la couleur aux plats.
      de: |-
        Eine Zutat für PokéCamping-Mahlzeiten. Dieses wahllos
        gepflückte Kraut verleiht Speisen ein spezielles Aroma
        und eine kräftige Farbe.
      es: |-
        Un ingrediente para cocinar en el campamento. Unas
        hierbas que aportan color y aroma a la salsa.
      it: |-
        Uno degli ingredienti che puoi usare per cucinare
        in campeggio. Queste erbe selezionate con grande
        cura aggiungono a ogni pietanza un aroma unico.
