        ひっこめると　もとに　もどる。
      ja: |-
        戦闘中の　ポケモンの
        防御を　かなり　あげる。
        ひっこめると　元に　戻る。
      ko: |-
        배틀 중인 포켓몬의 방어를
        상당히 올린다. 포켓몬을 볼에
        넣어버리면 원래대로 되돌아간다.
      en: |-
        It drastically raises the Defense stat
        of a Pokémon in battle. It wears off if
        the Pokémon is withdrawn.
      fr: |-
