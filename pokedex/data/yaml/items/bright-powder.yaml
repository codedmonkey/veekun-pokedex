        la Précision de l’ennemi.
    black-2-white-2:
      en: |-
        An item to be held by a Pokémon.
        It casts a tricky glare that lowers
        the opponent’s accuracy.
    x-y:
      ja-Hrkt: |-
        キラキラ　ひかるこな。　もたせると
        ひかりが　あいてを　まどわして
        わざが　めいちゅう　しにくくなる。
      ja: |-
        キラキラ　光る粉。　持たせると
        光が　相手を　惑わして
        技が　命中しにくくなる。
      ko: |-
        반짝반짝 빛나는 가루. 지니게 하면
        빛이 상대를 혼란시켜
        기술이 명중되기 어려워진다.
      en: |-
        An item to be held by a Pokémon.
        It casts a tricky glare that lowers
        the opposing Pokémon’s accuracy.
      fr: |-
        Objet à tenir. Intimide et baisse la Précision
        de l’ennemi.
      de: |-
        Ein Item, das einem Pokémon zum Tragen
        gegeben werden kann. Es senkt die Genauigkeit
        des Gegners.
      es: |-
        El Pokémon que la lleva puede resistir un golpe
        que potencialmente lo dejaría K.O. y se queda
        con 1 PS.
      it: |-
        Strumento da dare a un Pokémon.
        Emette un bagliore insidioso che riduce
        la precisione del nemico.
    sun-moon:
      ja-Hrkt: |-
