bright-powder:
  category: held-items
  cost: 4000
  effect:
    en: |-
      Held in battle
      :   Moves targeting the holder have 0.9× [chance to hit]{mechanic:chance-to-hit}.
  flags:
    - holdable
    - holdable-active
  flavor_text:
    ruby-sapphire:
      en: |-
        A hold item that
        casts a glare to
        reduce accuracy.
    emerald:
      en: |-
        A hold item that
        casts a glare to
        reduce accuracy.
    firered-leafgreen:
      en: |-
        An item to be held by a POKéMON.
        It casts a tricky glare that lowers
