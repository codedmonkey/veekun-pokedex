  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        Ｚパワーの　けっしょう。
        ネクロズマの　フォトンゲイザーを
        Ｚワザに　グレードアップする。
      ja: |-
        Ｚパワーの　結晶。
        ネクロズマの　フォトンゲイザーを
        Ｚワザに　グレードアップする。
      ko: |-
        Z파워의 결정.
        네크로즈마의 포톤가이저를
        Z기술로 업그레이드한다.
      zh-Hant: |-
        Ｚ力量的結晶。
        可將奈克洛茲瑪的光子噴湧
        升級為Ｚ招式。
      zh-Hans: |-
        Ｚ力量的结晶。
        会将奈克洛兹玛的光子喷涌
        升级成Ｚ招式。
      en: |-
        This is a crystallized form of Z-Power.
        It upgrades Necrozma’s Photon Geyser to
        a Z-Move.
      fr: |-
        Une cristallisation de la Force Z, permettant
        de transformer le Photo-Geyser de Necrozma
        en capacité Z.
      de: |-
        Ein Kristall, dem Z-Kraft innewohnt.
        Er stuft Necrozmas Attacke Photonen-Geysir
        zu einer Z-Attacke auf.
      es: |-
        Cristal que confiere el Poder Z al movimiento
        Géiser Fotónico de Necrozma.
      it: |-
        Cristallo in cui è immagazzinato il Potere Z.
        Consente di trasformare la mossa Geyser Fotonico
        di Necrozma in una mossa Z.
