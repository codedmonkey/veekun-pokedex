    sword-shield:
      ja-Hrkt: |-
        ５ターンのあいだ　エレキフィールドにする。
        じめんにいる　ポケモンは　ねむらない。
        でんきタイプの　いりょくが　あがる。
      ja: |-
        ５ターンの　間　エレキフィールドにする。
        地面にいる　ポケモンは　眠らない。
        でんきタイプの　威力が　あがる。
      ko: |-
        5턴 동안 일렉트릭필드로 만든다.
        땅에 있는 포켓몬은 잠들지 않는다.
        전기타입의 위력이 올라간다.
      zh-Hant: |-
        在５回合內將腳下變成電氣場地。
        地面上的寶可夢將不會陷入睡眠狀態。
        電屬性招式的威力會提高。
      zh-Hans: |-
        在５回合内变成电气场地。
        地面上的宝可梦将无法入眠。
        电属性的招式威力还会提高。
      en: |-
        The user electrifies the ground for five turns,
        powering up Electric-type moves. Pokémon on the
        ground no longer fall asleep.
      fr: |-
        Pendant cinq tours, le terrain se charge d’électricité.
        Les Pokémon au sol ne peuvent pas s’endormir
        et la puissance des capacités de type Électrik augmente.
      de: |-
        Hindert fünf Runden lang alle Pokémon, die den Boden
        berühren, am Einschlafen. Erhöht die Stärke von
        Elektro-Attacken.
      es: |-
        Durante cinco turnos, se potencian los movimientos de
        tipo Eléctrico y los Pokémon que están en contacto con
        el suelo no pueden quedarse dormidos.
      it: |-
        Per cinque turni il terreno entra nello stato di Campo
        Elettrico: i Pokémon a terra non si addormentano e
        la potenza delle mosse di tipo Elettro aumenta.
