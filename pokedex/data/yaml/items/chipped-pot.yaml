  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        ある　とくていの　ポケモンを
        しんかさせる　ふしぎな　ポット。
        かけているが　おちゃは　おいしくなる。
      ja: |-
        ある　特定の　ポケモンを
        進化させる　不思議な　ポット。
        欠けているが　お茶は　おいしくなる。
      ko: |-
        어느 특정 포켓몬을
        진화시키는 이상한 포트.
        이가 빠졌지만 차는 맛있어진다.
      zh-Hant: |-
        可以讓特定的寶可夢
        進化的神奇茶壺。
        雖然有缺口，但茶會變得美味。
      zh-Hans: |-
        这个神奇的茶壶
        可以使特定的宝可梦进化。
        虽然有缺陷，但泡出来的茶依旧清香。
      en: |-
        A peculiar teapot that can make a certain species of
        Pokémon evolve. It may be chipped, but tea poured
        from it is delicious.
      fr: |-
        Un récipient mystérieux pouvant faire évoluer un certain
        Pokémon. Il est ébréché, mais on y fait du bon thé.
      de: |-
        Diese spezielle Kanne löst bei einem bestimmten
        Pokémon die Entwicklung aus. Sie weist zwar Löcher auf,
        aber das wirkt sich nicht negativ auf den Tee aus.
      es: |-
        Curiosa tetera que hace evolucionar a determinadas
        especies de Pokémon. Pese a estar rota, sirve un té
        exquisito.
      it: |-
        Teiera particolare che fa evolvere determinate
        specie di Pokémon. È crepata, ma il tè che contiene
        è davvero ottimo.
