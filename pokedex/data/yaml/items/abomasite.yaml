abomasite:
  category: mega-stones
  cost: 0
  effect:
    en: 'Held: Allows Abomasnow to Mega Evolve into Mega Abomasnow.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        ユキノオーに　もたせておくと
        たたかいのとき　メガシンカが　できる
        ふしぎな　メガストーンの　いっしゅ。
      ja: |-
        ユキノオーに　持たせておくと
        戦いのとき　メガシンカが　できる
        不思議な　メガストーンの　一種。
      ko: |-
        눈설왕에게 지니게 하면
        배틀할 때 메가진화할 수 있는
        신비한 메가스톤의 일종.
      en: |-
        One variety of the mysterious Mega Stones.
        Have Abomasnow hold it, and this stone will
        enable it to Mega Evolve during battle.
      fr: |-
        Une variété de Méga-Gemme.
        Tenue par un Blizzaroi, elle lui permet de
        méga-évoluer durant un combat.
      de: |-
        Einer der mysteriösen Mega-Steine. Wird er von
        einem Rexblisar getragen, kann es im Kampf eine
        Mega-Entwicklung durchführen.
      es: 'Inflige daño a los oponentes con una potente luz.'
      it: |-
        Un esemplare delle misteriose Megapietre.
        Data ad Abomasnow, gli permette
        di megaevolversi durante la lotta.
