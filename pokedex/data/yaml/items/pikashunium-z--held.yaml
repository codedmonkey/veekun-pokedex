pikashunium-z--held:
  category: z-crystals
  cost: 0
  effect:
    en: 'Held: Allows cap-wearing []{pokemon:pikachu} to upgrade []{move:thunderbolt} into []{move:10-000-000-volt-thunderbolt}.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        Ｚパワーの　けっしょう。
        キャップを　かぶった　ピカチュウの
        １０まんボルトを　Ｚワザに　かえる。
      ja: |-
        Ｚパワーの　結晶。
        キャップを　かぶった　ピカチュウの
        １０まんボルトを　Ｚワザに　変える。
      ko: |-
        Z파워의 결정.
        모자를 쓴 피카츄의
        10만볼트를 Z기술로 바꾼다.
      zh-Hant: |-
        Ｚ力量的結晶。
        會把戴著帽子的皮卡丘的
        十萬伏特升級為Ｚ招式。
      zh-Hans: |-
        Ｚ力量的结晶。
        会将戴着帽子的皮卡丘的
        十万伏特升级成Ｚ招式。
      en: |-
        This is a crystallized form of Z-Power.
        It upgrades a Thunderbolt by Pikachu in a cap to
        a Z-Move.
      fr: |-
        Une cristallisation de la Force Z, permettant de
        transformer le Tonnerre du Pikachu à casquette
        en capacité Z.
      de: |-
        Ein Kristall, dem Z-Kraft innewohnt.
        Er stuft die Attacke Donnerblitz des Pikachus
        mit Kappe zu einer Z-Attacke auf.
      es: |-
        Cristal que confiere el Poder Z al movimiento Rayo
        de los Pikachu que llevan gorra.
      it: |-
        Cristallo in cui è immagazzinato il Potere Z.
        Consente di trasformare la mossa Fulmine
        di Pikachu con il berretto in una mossa Z.
