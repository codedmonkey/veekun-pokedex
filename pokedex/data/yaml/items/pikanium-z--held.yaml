pikanium-z--held:
  category: z-crystals
  cost: 0
  effect:
    en: 'Held: Allows []{pokemon:pikachu} to upgrade []{move:volt-tackle} into []{move:catastropika}.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        Ｚパワーの　けっしょう。
        ピカチュウの　ボルテッカーを
        Ｚワザに　グレードアップする。
      ja: |-
        Ｚパワーの　結晶。
        ピカチュウの　ボルテッカーを
        Ｚワザに　グレードアップする。
      ko: |-
        Z파워의 결정.
        피카츄의 볼트태클을
        Z기술로 업그레이드한다.
      zh-Hant: |-
        Ｚ力量的結晶。
        會把皮卡丘的伏特攻擊
        升級為Ｚ招式。
      zh-Hans: |-
        Ｚ力量的结晶。
        会将皮卡丘的伏特攻击
        升级成Ｚ招式。
      en: |-
        This is a crystallized form of Z-Power.
        It upgrades Pikachu’s Volt Tackle to a Z-Move.
      fr: |-
        Une cristallisation de la Force Z, permettant
        de transformer l’Électacle d’un Pikachu en
        capacité Z.
      de: |-
        Ein Kristall, dem Z-Kraft innewohnt.
        Er stuft Pikachus Attacke Volttackle
        zu einer Z-Attacke auf.
      es: |-
        Cristal que confiere el Poder Z al movimiento
        Placaje Eléc de Pikachu.
      it: |-
        Cristallo in cui è immagazzinato il Potere Z.
        Consente di trasformare la mossa Locomovolt
        di Pikachu in una mossa Z.
