  cost: 40000
  effect:
    en: 'Cult vendor trash.'
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        A big nugget of pure gold that gives off
        a lustrous gleam.
        A maniac will buy it for a high price.
      fr: |-
        Grosse pépite d’or pur qui brille
        magnifiquement.
        Les amateurs en donnent un bon prix.
    black-2-white-2:
      en: |-
        A big nugget of pure gold that gives off
        a lustrous gleam.
        A maniac will buy it for a high price.
    x-y:
      ja-Hrkt: |-
        キラキラと　きんいろに　ひかる
        じゅんきんせいの　おおきな　たま。
        ショップで　たかく　うれる。
      ja: |-
        キラキラと　金色に　光る
        純金製の　おおきな　玉。
        ショップで　高く　売れる。
      ko: |-
        금색으로 반짝반짝 빛나는
        순금으로 만들어진 큰 구슬.
        상점에서 비싸게 팔린다.
      en: |-
        A big nugget of pure gold that gives
        off a lustrous gleam. It can be sold
        at a high price to shops.
      fr: |-
        Une pépite d’or pur qui brille d’un éclat
        magnifique. Peut être vendue à bon prix
        aux magasins.
      de: |-
        Ein großes Nugget aus purem Gold, das
        einen schimmernden Glanz besitzt. Es ist
        von großem Wert.
      es: |-
        Aumenta bastante el Ataque Especial en combate.
        Al cambiar de Pokémon, el efecto desaparece.
      it: |-
        Grossa pepita d’oro puro dal luccichio sfavillante.
        Si può vendere a un prezzo piuttosto alto
        nei negozi.
