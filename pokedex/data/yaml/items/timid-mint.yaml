timid-mint:
  category: nature-mints
  cost: 20
  effect: {  }
  flags: {  }
  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        ポケモンに　かおりを　かがせると
        すばやさが　あがりやすく　なるが
        こうげきは　あがりにくくなる　ミント。
      ja: |-
        ポケモンに　香りを　かがせると
        素早さが　上がりやすく　なるが
        攻撃は　上がりにくくなる　ミント。
      ko: |-
        포켓몬에게 향기를 맡게 하면
        스피드가 오르기 쉬워지지만
        공격이 오르기 어려워지는 민트.
      zh-Hant: |-
        讓寶可夢聞這種薄荷的氣味，
        會令速度變得容易提高，
        但攻擊則難以提高。
      zh-Hans: |-
        宝可梦闻了这种薄荷之后，
        会令速度容易提高，
        而攻击则难以提高。
      en: |-
        When a Pokémon smells this mint, its Speed will grow
        more easily, but its Attack will grow more slowly.
      fr: |-
        Si un Pokémon hume cet aromate, sa Vitesse
        montera plus facilement, mais son Attaque
        se développera plus lentement.
      de: |-
        Lässt man ein Pokémon an dieser Minze schnuppern,
        steigt seine Initiative schneller, aber sein Angriff umso
        langsamer.
      es: |-
        Cuando un Pokémon percibe su aroma, aumenta
        con más facilidad su Velocidad, en detrimento de su
        Ataque.
      it: |-
        Quando un Pokémon ne sente il profumo,
        la sua Velocità aumenta più facilmente
        a scapito dell’Attacco.
