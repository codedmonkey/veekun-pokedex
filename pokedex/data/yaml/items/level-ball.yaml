level-ball:
  category: apricorn-balls
  cost: 0
  effect:
    en: |-
      Used by trainer in battle
      :   Attempts to [catch]{mechanic:catch} a wild Pokémon.  If used in a trainer battle, nothing happens and the ball is lost.

          If the trainer's Pokémon's level is higher than:

          * four times the wild Pokémon's, the wild Pokémon's catch rate is 8× normal.
          * than twice the wild Pokémon's, the wild Pokémon's catch rate is 4× normal.
          * the wild Pokémon's, the wild Pokémon's catch rate is 2× normal.
  flags: {  }
  flavor_text:
    heartgold-soulsilver:
      en: |-
        A Poké Ball for catching Pokémon that
        are a lower level than your own.
    black-white:
      en: |-
        A Poké Ball for catching Pokémon that
        are a lower level than your own.
      fr: |-
        Une Poké Ball un peu spéciale qui
        fonctionne particulièrement bien sur
        les Pokémon de niveau inférieur au sien.
    black-2-white-2:
      en: |-
        A Poké Ball for catching Pokémon that
        are a lower level than your own.
    x-y:
      ja-Hrkt: |-
        じぶんの　ポケモンより　レベルが
        ひくいほど　つかまえやすくなる
        ちょっと　かわった　ボール。
      ja: |-
        自分の　ポケモンより　レベルが
        低いほど　捕まえやすくなる
        ちょっと　変わった　ボール。
      ko: |-
        자신의 포켓몬보다 레벨이
        낮을수록 잡기 쉬워지는
        조금 특이한 볼.
      en: |-
        A Poké Ball that makes it easier to
        catch Pokémon that are at a lower
        level than your own Pokémon.
      fr: |-
        Une Poké Ball un peu spéciale qui fonctionne
        particulièrement bien sur les Pokémon de niveau
        inférieur au sien.
      de: |-
        Ein Ball, mit dem sich Pokémon umso leichter
        fangen lassen, je niedriger ihr Level im Vergleich
        zu deinem Team ist.
      es: |-
        Contiene los datos del Pokéathlon con el número
        de victorias en Rompelosas.
      it: |-
        Poké Ball un po’ diversa che funziona
        particolarmente bene con i Pokémon di livello
        inferiore a quello del proprio.
    sun-moon:
      ja-Hrkt: |-
