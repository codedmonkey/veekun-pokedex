roto-catch:
  category: unused
  cost: 0
  effect:
    en: 'XXX new effect for roto-catch'
  flags: {  }
  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        ロトムパワーの　ひとつ。　つかうと
        めのまえにいる　やせいポケモンが
        とても　つかまえやすくなる。
      ja: |-
        ロトムパワーの　ひとつ。　使うと
        目の前にいる　野生ポケモンが
        とても　捕まえやすくなる。
      ko: |-
        로토무파워 중 하나. 사용하면
        눈앞에 있는 야생 포켓몬을
        매우 잡기 쉬워진다.
      zh-Hant: |-
        洛托姆之力的一種。
        使用後，可以讓眼前的
        寶可夢變得非常容易捕捉。
      zh-Hans: |-
        洛托姆之力的一种。
        使用后，眼前的野生宝可梦
        会变得非常容易捕捉。
      en: |-
        One of the Rotom Powers.
        It increases the chance to catch Pokémon
        a lot.
      fr: |-
        Une des Motism’Auras. Elle permet d’attraper
        beaucoup plus facilement le Pokémon sauvage
        que vous affrontez.
      de: |-
        Diese Rotom-Kraft bewirkt, dass wilde Pokémon
        mit höherer Wahrscheinlichkeit gefangen werden.
      es: |-
        Poder Rotom que aumenta mucho la probabilidad
        de capturar al Pokémon salvaje al que te estés
        enfrentando.
      it: |-
        Potere Rotom che rende considerevolmente
        più facile catturare i Pokémon selvatici.
