fashion-case:
  category: gameplay
  cost: 0
  effect:
    en: 'Contains Pokémon Accessories.'
  flags: {  }
  flavor_text:
    diamond-pearl:
      en: |-
        A fancy case for the tidy and
        organized storage of colorful Pokémon
        Accessories.
    platinum:
      en: |-
        A fancy case for the tidy and
        organized storage of colorful Pokémon
        Accessories.
    heartgold-soulsilver:
      en: |-
        A fancy case for the tidy arrangement
        and storage of whimsical Pokémon
        Accessories.
    black-white:
      en: |-
        A lovely case to store colorful Props
        for your Pokémon to wear in a musical.
      fr: |-
        Boîte permettant de ranger
        les Parures pour habiller les
        Pokémon au Music-Hall.
    black-2-white-2:
      en: |-
        A lovely case to store colorful Props
        for your Pokémon to wear in a musical.
    x-y:
      ja-Hrkt: |-
        ミュージカルで　ポケモンに　つける
        いろとりどりの　グッズを　たくさん
        しまえる　きれいで　すてきなケース。
      ja: |-
        ミュージカルで　ポケモンに　つける
        いろとりどりの　グッズを　たくさん
        しまえる　きれいで　すてきなケース。
      ko: |-
        뮤지컬에서 포켓몬에게 다는
        각양각색의 굿즈를 많이
        넣을 수 있는 아름답고 멋진 케이스.
      en: |-
        A lovely case to store colorful Props
        for your Pokémon to wear in a musical.
      fr: |-
        Une boîte permettant de ranger les Parures pour
        habiller les Pokémon au Music-Hall.
      de: |-
        Ein schicker Koffer mit Platz für alle
        im Musical benötigten Deko-Artikel
        deiner Pokémon. Da knittert nichts.
      es: |-
        Necesario para entrar en la posada de Ciudad
        Canal. Es extraño, pero la última fecha registrada
        es de hace 50 años.
      it: |-
        Scatola bella ed elegante per conservare i gadget
        usati per agghindare i Pokémon durante
        il Pokémon Musical.
