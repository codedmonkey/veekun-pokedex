    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        あつく　にえたぎる　みずを
        あいてに　はっしゃして　こうげきする。
        やけど　じょうたいに　することが　ある。
      ja: |-
        熱く　煮えたぎる　水を
        相手に　発射して　攻撃する。
        やけど状態に　することが　ある。
      ko: |-
        뜨겁게 끓어오르는 물을
        상대에게 발사해서 공격한다.
        화상 상태로 만들 때가 있다.
      zh-Hant: |-
        向對手噴射
        滾燙的熱水進行攻擊。
        有時會讓對手陷入灼傷狀態。
      zh-Hans: |-
        向对手喷射
        煮得翻滚的开水进行攻击。
        有时会让对手陷入灼伤状态。
      en: |-
        The user shoots boiling hot water at its target.
        This may also leave the target with a burn.
      fr: |-
        L’ennemi est attaqué par un jet d’eau bouillante.
        Peut aussi le brûler.
      de: |-
        Heizt dem Ziel mit einem Schwall siedend heißen
        Kochwassers ein. Das Ziel erleidet dabei eventuell
        Verbrennungen.
      es: |-
        Ataca arrojando agua hirviendo al objetivo.
        Puede causar quemaduras.
      it: |-
        Chi la usa attacca il bersaglio con un getto
        d’acqua bollente che può anche scottarlo.
    sword-shield:
      ja-Hrkt: |-
        かわいく　みつめて　ゆだんを　さそい
        あいての　こうげきを　がくっと　さげる。
      ja: |-
        かわいく　みつめて　油断を　誘い
        相手の　攻撃を　がくっと　さげる。
      ko: |-
        귀엽게 바라보고 방심을 유도하여
        상대의 공격을 크게 떨어뜨린다.
      zh-Hant: |-
        用撒嬌的眼神
        誘使對手疏忽大意，
        大幅降低對手的攻擊。
      zh-Hans: |-
        可爱地凝视，
        诱使对手疏忽大意，
        从而大幅降低对手的攻击。
      en: |-
        The user gazes at the target rather charmingly,
        making it less wary. This harshly lowers the target’s
        Attack stat.
      fr: |-
        Le lanceur fait les yeux doux pour berner l’ennemi
        et beaucoup réduire son Attaque.
      de: 'Betört das Ziel und reduziert dessen Angriffs-Wert stark.'
      es: 'Engatusa al objetivo y reduce mucho su Ataque.'
      it: |-
        Ammalia il bersaglio con lo sguardo per renderlo
        meno cauto. Ne riduce molto l’Attacco.
