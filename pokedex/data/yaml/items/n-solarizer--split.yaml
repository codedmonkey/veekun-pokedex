        用来让曾需求过光的奈克洛兹玛和
        索尔迦雷欧分离的机器。
      en: |-
        A machine to separate Necrozma, which needed
        light, from Solgaleo.
      fr: |-
        Un appareil permettant d’annuler la fusion d’un
        Necrozma assoiffé de lumière avec Solgaleo.
      de: |-
        Necrozma, das Licht benötigte, kann mithilfe dieser
        Maschine wieder von Solgaleo getrennt werden.
      es: |-
        Artefacto que permite separar a Necrozma, ávido
        de luz, tras su fusión con Solgaleo.
      it: |-
        Dispositivo che permette a Necrozma di separarsi
        da Solgaleo quando non necessita più di luce.
