  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        ロトムが　すきな　かでんが　のっている。
        カタログを　つかうことで　ロトムを
        かでんに　いれたり　だすことが　できる。
      ja: |-
        ロトムが　好きな　家電が　載っている。
        カタログを　使うことで　ロトムを
        家電に　いれたり　だすことが　できる。
      ko: |-
        로토무가 좋아하는 가전제품이 실려 있다.
        카탈로그를 사용하면 로토무를
        가전제품에 넣거나 꺼낼 수 있다.
      zh-Hant: |-
        記載著洛托姆喜歡的電器。
        透過使用這本型錄，可以讓
        洛托姆進入或離開電器。
      zh-Hans: |-
        上面记载着洛托姆喜欢的家电。
        通过使用这本指南，可以
        让洛托姆潜入或脱离家电。
      en: |-
        A catalog of devices that Rotom like. Use the catalog
        to have Rotom hop in and out of the various devices
        listed within.
      fr: |-
        Un catalogue présentant divers appareils ménagers
        que Motisma apprécie. À utiliser pour faire entrer
        Motisma dans ces appareils ou l’en faire sortir.
      de: |-
        Ein Katalog, der Rotoms Lieblingsgeräte auflistet.
        Mit diesem Katalog kann Rotom in Geräte schlüpfen
        und sie wieder verlassen.
      es: |-
        Un catálogo de los artilugios favoritos de Rotom que le
        permite introducirse o salir fácilmente de los mismos.
      it: |-
        Contiene una lista degli apparecchi che piacciono
        a Rotom. Può essere usato per far entrare Rotom
        nel motore degli elettrodomestici o per farlo uscire.
