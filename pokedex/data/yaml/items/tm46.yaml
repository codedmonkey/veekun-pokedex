tm46:
  category: all-machines
  cost: 30000
  effect:
    en: 'Teaches Thief to a compatible Pokémon.'
  flags: {  }
  flavor_text:
    ruby-sapphire:
      en: |-
        While attacking,
        it may steal the
        foe’s held item.
    emerald:
      en: |-
        While attacking,
        it may steal the
        foe’s held item.
    firered-leafgreen:
      en: |-
        An attack that may
        take the foe’s held
        item if the user
        isn’t holding one.
    diamond-pearl:
      en: |-
        The user attacks and steals the foe’s
        held item simultaneously. It can’t
        steal if the user holds an item.
    platinum:
      en: |-
        The user attacks and steals the foe’s
        held item simultaneously. It can’t
        steal if the user holds an item.
    heartgold-soulsilver:
      en: |-
        The user attacks and steals the foe’s
        held item simultaneously. It can’t
        steal if the user holds an item.
    black-white:
      en: |-
        The user attacks and steals the
        target’s held item simultaneously. It
        can’t steal if the user holds an item.
      fr: |-
        Le lanceur attaque la cible et vole
        son objet. Le lanceur ne peut rien
        voler s’il tient déjà un objet.
    black-2-white-2:
      en: |-
        The user attacks and steals the
        target’s held item simultaneously. It
        can’t steal if the user holds an item.
    x-y:
      ja-Hrkt: |-
        こうげきと　どうじに　もちものを
        ぬすむ。　じぶんに　もちものが
        あると　しっぱいする。
      ja: |-
        攻撃と　同時に　道具を　盗む。
        自分が　道具を　持っている　場合は
        盗めない。
      ko: |-
        공격과 동시에 도구를 훔친다.
        자신이 도구를 지니고 있을 경우에는
        훔칠 수 없다.
      en: |-
        The user attacks and steals the target’s
        held item simultaneously. The user can’t
        steal anything if it already holds an item.
      fr: |-
        Le lanceur attaque la cible et vole son objet.
        Le lanceur ne peut rien voler s’il tient déjà
        un objet.
      de: |-
        Der Anwender greift an und stiehlt dem Ziel
        gleichzeitig ein Item, sofern er selbst gerade
        kein Item trägt.
      es: |-
        Impide que el objetivo utilice el objeto que lleve
        y que su Entrenador use objetos sobre él.
      it: |-
        Chi la usa attacca il bersaglio e può rubargli
        lo strumento, se non ne ha già uno.
    sun-moon:
      ja-Hrkt: |-
        こうげきと　どうじに　どうぐを　ぬすむ。
        じぶんが　どうぐを　もっている　ばあいは
        ぬすめない。
      ja: |-
        攻撃と　同時に　道具を　盗む。
        自分が　道具を　持っている　場合は
        盗めない。
      ko: |-
        공격과 동시에 도구를 훔친다.
        자신이 도구를 지니고 있을 경우에는
        훔칠 수 없다.
      zh-Hant: |-
        在攻擊的同時偷取道具。
        當寶可夢自己有攜帶道具時，
        則無法偷取。
      zh-Hans: |-
        攻击的同时盗取道具。
        当自己携带道具时，
        不会去盗取。
      en: |-
        The user attacks and steals the target’s held item
        simultaneously. The user can’t steal anything if it
        already holds an item.
      fr: |-
        Le lanceur attaque la cible et vole son objet.
        Le lanceur ne peut rien voler s’il tient déjà
        un objet.
      de: |-
        Der Anwender greift an und stiehlt dem Ziel
        gleichzeitig ein Item, sofern er selbst gerade
        kein Item trägt.
      es: |-
        Quien lo usa ataca y roba el objeto que lleva su
        objetivo simultáneamente. Si ya lleva un objeto,
        no podrá robar ninguno.
      it: |-
        Chi la usa attacca il bersaglio e può rubargli
        lo strumento, se non ne ha già uno.
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        こうげきと　どうじに　どうぐを　ぬすむ。
        じぶんが　どうぐを　もっている　ばあいは
        ぬすめない。
      ja: |-
        攻撃と　同時に　道具を　盗む。
        自分が　道具を　持っている　場合は
        盗めない。
      ko: |-
        공격과 동시에 도구를 훔친다.
        자신이 도구를 지니고 있을 경우에는
        훔칠 수 없다.
      zh-Hant: |-
        在攻擊的同時偷取道具。
        當寶可夢自己有攜帶道具時，
        則無法偷取。
      zh-Hans: |-
        攻击的同时盗取道具。
        当自己携带道具时，
        不会去盗取。
      en: |-
        The user attacks and steals the target’s held item
        simultaneously. The user can’t steal anything if it
        already holds an item.
      fr: |-
        Le lanceur attaque la cible et vole son objet.
        Le lanceur ne peut rien voler s’il tient déjà
        un objet.
      de: |-
        Der Anwender greift an und stiehlt dem Ziel
        gleichzeitig ein Item, sofern er selbst gerade
        kein Item trägt.
      es: |-
        Quien lo usa ataca y roba el objeto que lleva su
        objetivo simultáneamente. Si ya lleva un objeto,
        no podrá robar ninguno.
      it: |-
        Chi la usa attacca il bersaglio e può rubargli
        lo strumento, se non ne ha già uno.
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        だいのじの　ほのおで
        あいてを　やきつくす。
        やけど　じょうたいに　することが　ある。
      ja: |-
        大の字の　炎で
        相手を　焼きつくす。
        やけど状態に　することが　ある。
      ko: |-
        큰 대자의 불꽃으로
        상대를 불태운다.
        화상 상태로 만들 때가 있다.
      zh-Hant: |-
        用大字形狀的火焰燒盡對手。
        有時會讓對手陷入灼傷狀態。
      zh-Hans: |-
        用大字形状的火焰烧尽对手。
        有时会让对手陷入灼伤状态。
      en: |-
        The target is attacked with an intense blast of
        all-consuming fire. This may also leave the target
        with a burn.
      fr: |-
        Un déluge de flammes ardentes submerge l’ennemi.
        Peut aussi le brûler.
      de: |-
        Feuersbrunst, die das Ziel versengt und ihm
        eventuell eine Verbrennung zufügt.
      es: |-
        Llama intensa que chamusca y puede causar 
        quemaduras.
      it: |-
        Investe il bersaglio con un’intensa fiammata
        che fa terra bruciata. Può anche scottarlo.
    sword-shield:
      ja-Hrkt: |-
        つかった　ときの　てんきに　よって
        わざの　タイプと　いりょくが　かわる。
      ja: |-
        使ったときの　天気に　よって
        技の　タイプと　威力が　変わる。
      ko: |-
        사용했을 때의 날씨에 따라서
        기술 타입과 위력이 바뀐다.
      zh-Hant: |-
        招式屬性和威力會隨著
        使用時天氣的不同而改變。
      zh-Hans: |-
        根据使用时的天气，
        招式属性和威力会改变。
      en: |-
        This attack move varies in power and type
        depending on the weather.
      fr: |-
        Une attaque dont la puissance et le type varient
        en fonction du temps qu’il fait.
      de: |-
        Typ und Stärke der Attacke sind vom Wetter zum
        Zeitpunkt der Anwendung abhängig.
      es: |-
        El tipo y fuerza del ataque varían según el tiempo que
        haga.
      it: |-
        Mossa d’attacco il cui tipo e la cui potenza variano
        in base alle condizioni atmosferiche.
