  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        みずを　かける　どうぐ。
        ふかふかのつちに　うめた
        きのみを　すくすく　そだてる。
      ja: |-
        水を　かける　道具。
        ふかふかのつちに　埋めた
        きのみを　すくすく　育てる。
      ko: |-
        물을 주는 도구.
        푹신푹신한 땅에 심은
        나무열매를 쑥쑥 키운다.
      en: |-
        A watering can shaped like a Lotad.
        It helps promote the healthy growth of
        any Berries planted in good, soft soil.
      fr: |-
        Un arrosoir en forme de Nénupiot
        qui aide à la croissance des Baies
        plantées dans les sols meubles.
      de: |-
        Eine Gießkanne in Form von Loturzel. Gieße
        gepflanzte Beeren, damit sie besser wachsen.
      es: |-
        El dulce estrella de Ciudad Luminalia. Cura los
        problemas de estado de un Pokémon.
      it: |-
        Strumento per annaffiare a forma di Lotad.
        Favorisce la crescita delle bacche piantate
        nel terreno soffice.
