eon-ticket:
  category: event-items
  cost: 0
  effect:
    en: 'Provides access to []{location:southern-island} and either []{pokemon:latias} or []{pokemon:latios}, whichever is not available roaming around Hoenn.'
  flags: {  }
  flavor_text:
    ruby-sapphire:
      en: |-
        The ticket for a
        ferry to a distant
        southern island.
    emerald:
      en: |-
        The ticket for a
        ferry to a distant
        southern island.
    firered-leafgreen:
      en: |-
        The ticket required for sailing on a
        ferry to a distant southern island.
        It features a drawing of an island.
    sun-moon:
      ja-Hrkt: |-
        みなみのことうへ　いく　ふねの
        チケット。トウカジムの　ジムリーダー
        センリが　ひみつを　しっている！？
      ja: |-
        南の孤島へ　行く　船の
        チケット。トウカジムの　ジムリーダー
        センリが　秘密を　知っている！？
      ko: |-
        남쪽의 외딴섬으로 가는 배의
        승선티켓. 등화체육관 관장
        종길이 비밀을 알고 있다!?
      zh-Hant: |-
        前往南方孤島的船票。
        橙華道館的館主千里
        知道其中的秘密！？
      zh-Hans: |-
        前往南方孤岛的船票。
        橙华道馆的馆主千里
        知道其中的秘密！？
      en: |-
        The ticket required for sailing on a ferry to the
        Southern Island. Does Norman, the Petalburg Gym
        Leader, know a secret?!
      fr: |-
        Un billet de ferry pour l’Île du Sud.
        Norman, le Champion de l’Arène de Clémenti-Ville,
        semble savoir quelque chose à son sujet.
      de: |-
        Ein Bootsticket, mit dem du zu einer fernen Insel im
        Süden schippern kannst. Kennt der Arenaleiter von
        Blütenburg, Norman, ein Geheimnis?!
      es: |-
        Billete de barco para viajar a Isla del Sur.
        Es posible que Norman, Líder del Gimnasio de
        Ciudad Petalia, sepa algo al respecto.
      it: |-
        Biglietto per il traghetto che porta all’Isola Remota.
        Norman, il Capopalestra di Petalipoli, dovrebbe
        sapere come usarlo.
