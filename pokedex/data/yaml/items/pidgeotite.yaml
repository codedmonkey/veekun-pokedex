pidgeotite:
  category: mega-stones
  cost: 0
  effect:
    en: 'Held: Allows Pidgeot to Mega Evolve into Mega Pidgeot.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        ピジョットに　もたせておくと
        たたかいのとき　メガシンカが　できる
        ふしぎな　メガストーンの　いっしゅ。
      ja: |-
        ピジョットに　持たせておくと
        戦いのとき　メガシンカが　できる
        不思議な　メガストーンの　一種。
      ko: |-
        피죤투에게 지니게 하면
        배틀할 때 메가진화할 수 있는
        신비한 메가스톤의 일종.
      zh-Hant: |-
        讓大比鳥攜帶後，
        在戰鬥時就能進行超級進化的
        一種神奇超級石。
      zh-Hans: |-
        让大比鸟携带后，
        在战斗时就能进行超级进化的
        一种神奇超级石。
      en: |-
        One of a variety of mysterious Mega Stones.
        Have Pidgeot hold it, and this stone will enable it
        to Mega Evolve during battle.
      fr: |-
        Une variété de Méga-Gemme.
        Tenue par un Roucarnage, elle lui permet de
        méga-évoluer durant un combat.
      de: |-
        Einer der mysteriösen Mega-Steine. Wird er von
        einem Tauboss getragen, kann es im Kampf eine
        Mega-Entwicklung durchführen.
      es: |-
        Una de las misteriosas Megapiedras. Permite
        megaevolucionar a Pidgeot en combate.
      it: |-
        Una delle misteriose Megapietre.
        Data a Pidgeot, gli permette di megaevolversi
        durante la lotta.
    ultra-sun-ultra-moon:
