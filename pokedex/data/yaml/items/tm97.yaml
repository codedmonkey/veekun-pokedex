  flavor_text:
    x-y:
      ja-Hrkt: |-
        からだから　あくいに
        みちた　おそろしい　オーラを　はっする。
        あいてを　ひるませる　ことが　ある。
      ja: |-
        体から　悪意に　みちた
        恐ろしい　オーラを　発する。
        相手を　ひるませることが　ある。
      ko: |-
        몸에서 악의로 가득한
        무서운 오라를 발한다.
        상대를 풀죽게 만들 때가 있다.
      en: |-
        The user releases a horrible aura
        imbued with dark thoughts. This
        may also make the target flinch.
      fr: |-
        Le lanceur dégage une horrible aura chargée
        d’idées noires. Peut aussi apeurer l’ennemi.
      de: |-
        Anwender greift mit fürchterlicher Aura schlechter
        Gedanken an. Ziel schreckt eventuell zurück.
      es: |-
        Fósil de un Pokémon prehistórico terrestre.
        Parece ser parte de una mandíbula.
      it: |-
        Chi la usa emana un’aura impregnata di oscuri
        pensieri. Può anche far tentennare il Pokémon
        colpito.
