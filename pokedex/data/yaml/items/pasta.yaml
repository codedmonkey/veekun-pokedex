  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        キャンプの　りょうりに　つかう
        しょくざいの　いっしゅ。こむぎこを　こねて
        つくった　めん。いがいと　カレーにあう。
      ja: |-
        キャンプの　料理に　使う
        食材の　一種。小麦粉を　こねて
        作った　麺。意外と　カレーに合う。
      ko: |-
        캠프 요리에 사용되는
        식재료 중 하나. 밀가루를 반죽해서
        만든 면이다. 의외로 카레와 잘 어울린다.
      zh-Hant: |-
        製作露營料理時使用的食材之一。
        用麵粉揉成的麵條，
        意外地和咖哩很配。
      zh-Hans: |-
        在露营营地制作料理时会使用的
        一种食材。是由小麦粉揉制的面条。
        搭配咖喱出乎意料地美味。
      en: |-
        One of the many ingredients that can be used for
        cooking at your camp. These flour noodles make
        for a surprisingly good match with curry.
      fr: |-
        Un ingrédient de cuisine pour le camping.
        Fabriquées avec de la farine de blé, ces pâtes
        se marient étonnamment bien avec le curry.
      de: |-
        Eine Zutat für PokéCamping-Mahlzeiten. Diese aus
        Weizenmehl hergestellten Nudeln passen überraschend
        gut zu Currygerichten aller Art.
      es: |-
        Un ingrediente para cocinar en el campamento. Estos
        fideos de harina de trigo combinan inesperadamente
        bien con el curri.
      it: |-
        Uno degli ingredienti che puoi usare per cucinare
        in campeggio. Questi spaghetti di grano duro
        si sposano sorprendentemente bene con il curry.
