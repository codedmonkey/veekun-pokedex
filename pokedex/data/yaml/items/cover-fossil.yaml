        おおむかし　うみに　すんでいた
        こだい　ポケモンの　カセキ。
        せなかの　いちぶ　らしい。
      ja: |-
        大昔　海に　すんでいた
        古代ポケモンの　カセキ。
        せなかの　一部らしい。
      ko: |-
        오랜 옛날 바다에 살았던
        고대 포켓몬의 화석.
        등의 일부인 듯하다.
      en: |-
        A fossil from a prehistoric Pokémon
        that once lived in the sea. It appears
        as though it could be part of its back.
      fr: |-
        Le fossile d’un ancien Pokémon aquatique.
        Il semble que ce soit une partie de son dos.
      de: |-
        Das Fossil eines uralten Pokémon, das in der
