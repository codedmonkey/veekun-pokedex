kasib-berry:
  category: type-protection
  cost: 80
  effect:
    en: |-
      Held in battle
      :   When the holder would take [super-effective]{mechanic:super-effective} []{type:ghost}-type damage, it consumes this item to halve the amount of damage taken.
  flags:
    - holdable-active
  flavor_text:
    diamond-pearl:
      en: |-
        A Poffin ingredient. If held by a
        Pokémon, it weakens a foe’s
        supereffective Ghost-type attack.
    platinum:
      en: |-
        A Poffin ingredient. If held by a
        Pokémon, it weakens a foe’s
        supereffective Ghost-type attack.
    heartgold-soulsilver:
      en: |-
        If held by a Pokémon, it weakens a foe’s
        supereffective Ghost-type attack.
    black-white:
      en: |-
        Weakens a supereffective Ghost-type
        attack against the holding Pokémon.
      fr: |-
        Tenue, cette Baie affaiblit une attaque
        ennemie super efficace de type Spectre.
    black-2-white-2:
      en: |-
        Weakens a supereffective Ghost-type
        attack against the holding Pokémon.
    x-y:
      ja-Hrkt: |-
        ポケモンに　もたせると
        こうかばつぐんの　ゴースト　わざを
        うけたとき　いりょくが　よわまる。
      ja: |-
        ポケモンに　持たせると
        効果バツグンの　ゴースト技を
        受けたとき　威力が　弱まる。
      ko: |-
        포켓몬에게 지니게 하면
        효과가 뛰어난 고스트 기술을
        당했을 때 위력이 약해진다.
      en: |-
        If held by a Pokémon, this Berry will
        lessen the damage taken from one
        supereffective Ghost-type attack.
      fr: |-
        Tenue, cette Baie affaiblit une attaque ennemie
        super efficace de type Spectre.
      de: |-
        Als getragenes Item schwächt diese Beere
        sehr effektive Attacken des Angreifers
        vom Typ Geist.
      es: |-
        Lanza un destello que baja la Precisión del
        enemigo. Debe llevarlo un Pokémon.
      it: |-
        Se un Pokémon ha questa bacca, l’attacco
        superefficace di tipo Spettro del nemico
        viene indebolito.
