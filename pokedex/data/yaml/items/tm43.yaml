    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        くろいかげの　かたまりを　なげつけて
        こうげきする。　あいての　とくぼうを
        さげることが　ある。
      ja: |-
        黒い影の　塊を　投げつけて
        攻撃する。　相手の　特防を
        さげることが　ある。
      ko: |-
        까만 그림자의 덩어리를 내던져서
        공격한다. 상대의 특수방어를
        떨어뜨릴 때가 있다.
      zh-Hant: |-
        投擲一團黑影進行攻擊。
        有時會降低對手的特防。
      zh-Hans: |-
        投掷一团黑影进行攻击。
        有时会降低对手的特防。
      en: |-
        The user hurls a shadowy blob at the target.
        This may also lower the target’s Sp. Def stat.
      fr: |-
        Projette une grande ombre sur l’ennemi.
        Peut aussi faire baisser sa Défense Spéciale.
      de: |-
        Bewirft das Ziel mit gruseligem Ball und senkt
        eventuell die Spezial-Verteidigung.
      es: |-
        Lanza una bola oscura que puede bajar la Defensa 
        Especial del objetivo.
      it: |-
        Lancia sul bersaglio una sfera nera.
        Può anche ridurne la Difesa Speciale.
    sword-shield:
      ja-Hrkt: |-
        しゅとうを　いきおいよく　ふりおろして
        あいてを　こうげきする。　ひかりのかべや
        リフレクター　なども　はかいできる。
      ja: |-
        手刀を　勢いよく　振りおろして
        相手を　攻撃する。　ひかりのかべや
        リフレクター　なども　破壊できる。
      ko: |-
        수도로 기세 좋게 내려쳐서
        상대를 공격한다. 빛의장막이나
        리플렉터 등도 파괴할 수 있다.
      zh-Hant: |-
        猛烈地揮下手刀
        攻擊對手。還可以破壞
        光牆和反射壁等。
      zh-Hans: |-
        将手刀猛烈地挥下攻击对手。
        还可以破坏光墙和反射壁等。
      en: |-
        The user attacks with a swift chop. It can also break
        barriers, such as Light Screen and Reflect.
      fr: |-
        Le lanceur attaque avec le tranchant de la main.
        Permet aussi de briser les barrières
        comme Mur Lumière et Protection.
      de: |-
        Ein beherzter Handkantenschlag. Durchbricht Barrieren
        wie Lichtschild und Reflektor.
      es: |-
        Potente ataque que también es capaz de destruir
        barreras como Pantalla de Luz y Reflejo.
      it: |-
        Colpisce il bersaglio con una mano e rompe
        barriere come Riflesso e Schermoluce.
