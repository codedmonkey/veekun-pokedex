x-sp-atk:
  category: stat-boosts
  cost: 1000
  effect:
    en: |-
      Used on a party Pokémon in battle
      :   [Raises]{mechanic:raise} the target's [Special Attack]{mechanic:special-attack} by one stage.  Increases happiness by 1/1/0.
  flags:
    - countable
    - consumable
    - usable-in-battle
    - holdable
  flavor_text:
    ruby-sapphire:
      en: |-
        Raises the stat
        SP. ATK during one
        battle.
    emerald:
      en: |-
        Raises the stat
        SP. ATK during one
        battle.
    firered-leafgreen:
      en: |-
        Raises the SP. ATK stat of
        POKéMON in battle. Wears off if the
        POKéMON is withdrawn.
    diamond-pearl:
      en: |-
        An item that raises the Sp. Atk stat
        of a Pokémon in battle. It wears off if
        the Pokémon is withdrawn.
    platinum:
      en: |-
        An item that raises the Sp. Atk stat
        of a Pokémon in battle. It wears off if
        the Pokémon is withdrawn.
    heartgold-soulsilver:
      en: |-
        An item that raises the Sp. Atk stat
        of a Pokémon in battle. It wears off if
        the Pokémon is withdrawn.
    black-white:
      en: |-
        An item that raises the Sp. Atk stat
        of a Pokémon in battle. It wears off if
        the Pokémon is withdrawn.
      fr: |-
        Monte l’Attaque Spéciale pendant
        un combat. L’effet s’estompe si
        le Pokémon se retire.
    black-2-white-2:
      en: |-
        An item that raises the Sp. Atk stat
        of a Pokémon in battle. It wears off if
        the Pokémon is withdrawn.
    x-y:
      ja-Hrkt: |-
        せんとうちゅうの　ポケモンの
        とくこうを　あげる　どうぐ。
        ひっこめると　もとに　もどる。
      ja: |-
        戦闘中の　ポケモンの
        特攻を　あげる　道具。
        ひっこめると　元に　戻る。
      ko: |-
        배틀 중인 포켓몬의 특수공격을 올리는
        도구. 포켓몬을 볼에 넣어버리면
        원래대로 되돌아간다.
      en: |-
        An item that boosts the Sp. Atk stat
        of a Pokémon during a battle. It wears
        off once the Pokémon is withdrawn.
      fr: |-
        Augmente l’Attaque Spéciale pendant un combat.
        L’effet disparaît si le Pokémon se retire.
      de: |-
        Hebt den Spezial-Angriff eines Pokémon im
        Kampf. Die Wirkung wird mit dem Austausch
        des Pokémon beendet.
      es: |-
        Aumenta el Ataque Especial en combate.
        Al cambiar de Pokémon, el efecto desaparece.
      it: |-
        Aumenta l’Attacco Speciale di un Pokémon
        in una lotta. L’effetto svanisce se il Pokémon
        è sostituito.
    sun-moon:
      ja-Hrkt: |-
        せんとうちゅうの　ポケモンの
        とくこうを　おおきく　あげる　どうぐ。
        ひっこめると　もとに　もどる。
      ja: |-
        戦闘中の　ポケモンの
        特攻を　大きく　あげる　道具。
        ひっこめると　元に　戻る。
      ko: |-
        배틀 중인 포켓몬의 특수공격을 크게 올리는
        도구. 포켓몬을 볼에 넣어버리면
        원래대로 되돌아간다.
      zh-Hant: |-
        大大提高戰鬥中
        寶可夢特攻的道具。
        離場後，效果便會消失。
      zh-Hans: |-
        大幅提高战斗中
        宝可梦特攻的道具。
        离场后，效果便会消失。
      en: |-
        An item that sharply boosts the Sp. Atk stat of a
        Pokémon during a battle. It wears off once the
        Pokémon is withdrawn.
      fr: |-
        Augmente beaucoup l’Attaque Spéciale pendant
        un combat. L’effet disparaît si le Pokémon est
        retiré.
      de: |-
        Hebt den Spezial-Angriff eines Pokémon im Kampf
        stark an. Die Wirkung wird mit dem Austausch des
        Pokémon beendet.
      es: |-
        Aumenta mucho el Ataque Especial en combate. Al
        cambiar de Pokémon, el efecto desaparece.
      it: |-
        Aumenta di molto l’Attacco Speciale di un Pokémon
        in una lotta. L’effetto svanisce se il Pokémon
