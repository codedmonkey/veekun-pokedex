        고대 포켓몬의 화석.
        날개의 일부인 듯하다.
      zh-Hant: |-
        據說是鳥寶可夢祖先的
        古代寶可夢的化石。
        好像是翅膀的一部分。
      zh-Hans: |-
        据说是鸟宝可梦的祖先，
        古代宝可梦的化石。
        好像是翅膀的一部分。
      en: |-
