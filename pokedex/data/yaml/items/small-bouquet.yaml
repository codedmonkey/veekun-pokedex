        竭尽心力制作的素雅花束。
        里面满满都是对训练家的心意。
      en: |-
        A small bouquet that was made with heart and soul
        for a single Trainer.
      fr: |-
        Un petit bouquet arrangé avec amour pour
        un[VAR (00FF,0B09)] Dresseure Dresseuse vraiment unique.
      de: |-
        Ein Blumenstrauß, der sorgfältig und mit viel Mühe
        für einen ganz besonderen Trainer gesteckt wurde.
      es: |-
        Pequeño ramo de flores confeccionado con dedicación
        y esmero solo para ti.
      it: |-
        Un piccolo mazzo di fiori composto con cura
        e amore per un[VAR (00FF,0B0A)] Allenator’Allenatrice unic[VAR (00FF,0101)]oa al mondo.
