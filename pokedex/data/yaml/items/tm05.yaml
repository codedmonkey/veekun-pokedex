tm05:
  category: all-machines
  cost: 50000
  effect:
    en: 'Teaches Roar to a compatible Pokémon.'
  flags: {  }
  flavor_text:
    ruby-sapphire:
      en: |-
        A savage roar that
        makes the foe flee 
        to end the battle.
    emerald:
      en: |-
        A savage roar that
        makes the foe flee 
        to end the battle.
    firered-leafgreen:
      en: |-
        The foe is made to
        switch out with an
        ally. In the wild,
        the battle ends.
    diamond-pearl:
      en: |-
        The foe is scared off, to be replaced
        by another Pokémon in its party.
        In the wild, the battle ends.
    platinum:
      en: |-
        The foe is scared off, to be replaced
        by another Pokémon in its party.
        In the wild, the battle ends.
    heartgold-soulsilver:
      en: |-
        The foe is scared off, to be replaced
        by another Pokémon in its party.
        In the wild, the battle ends.
    black-white:
      en: |-
        The target is scared off and replaced
        by another Pokémon in its party.
        In the wild, the battle ends.
      fr: |-
        Effraie le Pokémon visé et le
        remplace par un autre. Dans
        la nature, met fin au combat.
    black-2-white-2:
      en: |-
        The target is scared off and replaced
        by another Pokémon in its party.
        In the wild, the battle ends.
    x-y:
      ja-Hrkt: |-
        あいてを　にがして　ひかえポケモンを
        ひきずりだす。　やせいポケモンなら
        せんとうは　おわる。
      ja: |-
        相手を　逃がして
        控えの　ポケモンを　ひきずりだす。
        野生の　場合は　戦闘が　終わる。
      ko: |-
        상대를 도망가게 해서
        교대할 포켓몬을 끌어낸다.
        야생의 경우에는 배틀이 끝난다.
      en: |-
        The target is scared off and a different
        Pokémon is dragged out. In the wild,
        this ends a battle against a single Pokémon.
      fr: |-
        Effraie le Pokémon ennemi et le remplace par
        un autre. Dans la nature, met fin au combat.
      de: |-
        Der Brüller schlägt das Ziel in die Flucht. Ein
        Kampf gegen ein wildes Pokémon wird beendet.
      es: |-
        Ataque de dos turnos. En el primer turno se
        concentra luz, y en el segundo se canaliza en
        un rayo para atacar.
      it: |-
        Il bersaglio lascia il campo e viene sostituito.
        Mette fine alle lotte contro singoli Pokémon
        selvatici.
    sun-moon:
      ja-Hrkt: |-
        あいてを　にがして
        ひかえの　ポケモンを　ひきずりだす。
        やせいの　ばあいは　せんとうが　おわる。
      ja: |-
        相手を　逃がして
        控えの　ポケモンを　ひきずりだす。
        野生の　場合は　戦闘が　終わる。
      ko: |-
        상대를 도망가게 해서
        교대할 포켓몬을 끌어낸다.
        야생의 경우에는 배틀이 끝난다.
      zh-Hant: |-
        趕走對手，強制讓後備寶可夢上場。
        對手為野生寶可夢時，戰鬥將直接結束。
      zh-Hans: |-
        放走对手，强制拉后备宝可梦上场。
        如果对手为野生宝可梦，
        战斗将直接结束。
      en: |-
        The target is scared off, and a different Pokémon is
        dragged out. In the wild, this ends a battle against
        a single Pokémon.
      fr: |-
        Effraie le Pokémon ennemi et le remplace par
        un autre. Lors d’un combat contre un Pokémon
        sauvage seul, met fin au combat.
      de: |-
        Das Ziel wird in die Flucht geschlagen und durch
        ein anderes Pokémon ersetzt. Ein Kampf gegen ein
        wildes Pokémon wird beendet.
      es: |-
        Asusta tanto al objetivo que tiene que cambiarse
        por otro de su grupo. Si es un Pokémon salvaje,
        el combate acaba.
      it: |-
        Il bersaglio lascia il campo e viene sostituito.
        Mette fine alle lotte contro singoli Pokémon
        selvatici.
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        あいてを　にがして
        ひかえの　ポケモンを　ひきずりだす。
        やせいの　ばあいは　せんとうが　おわる。
      ja: |-
        相手を　逃がして
        控えの　ポケモンを　ひきずりだす。
        野生の　場合は　戦闘が　終わる。
      ko: |-
        상대를 도망가게 해서
        교대할 포켓몬을 끌어낸다.
        야생의 경우에는 배틀이 끝난다.
      zh-Hant: |-
        趕走對手，強制讓後備寶可夢上場。
        對手為野生寶可夢時，戰鬥將直接結束。
      zh-Hans: |-
        放走对手，强制拉后备宝可梦上场。
        如果对手为野生宝可梦，
        战斗将直接结束。
      en: |-
        The target is scared off, and a different Pokémon is
        dragged out. In the wild, this ends a battle against
        a single Pokémon.
      fr: |-
        Effraie le Pokémon ennemi et le remplace par
        un autre. Lors d’un combat contre un Pokémon
        sauvage seul, met fin au combat.
      de: |-
        Das Ziel wird in die Flucht geschlagen und durch
        ein anderes Pokémon ersetzt. Ein Kampf gegen ein
        wildes Pokémon wird beendet.
      es: |-
        Asusta tanto al objetivo que tiene que cambiarse
        por otro de su grupo. Si es un Pokémon salvaje,
        el combate acaba.
      it: |-
        Il bersaglio lascia il campo e viene sostituito.
        Mette fine alle lotte contro singoli Pokémon
        selvatici.
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        ２ターンの　あいだ　ねむり　つづける。
        じぶんの　ＨＰと　じょうたいいじょうを
        すべて　かいふく　する。
      ja: |-
        ２ターンの　間　眠り続ける。
        自分の　ＨＰと　状態異常を
        すべて　回復する。
      ko: |-
        2턴 동안 계속 잠잔다.
        자신의 HP와 상태 이상을
        모두 회복한다.
      zh-Hant: |-
        連續睡２回合。
        回復自己的全部HP
        以及治癒所有異常狀態。
      zh-Hans: |-
        连续睡上２回合。
        回复自己的全部HP
        以及治愈所有异常状态。
      en: |-
        The user goes to sleep for two turns. This fully restores
        the user’s HP and heals any status conditions.
      fr: |-
        Le lanceur regagne tous ses PV et soigne ses altérations
        de statut, puis il dort pendant deux tours.
      de: |-
        Anwender wird vollkommen geheilt, von allen
        Statusproblemen befreit und schläft die folgenden
        zwei Runden.
      es: |-
        Restaura todos los PS y cura todos los problemas de 
        estado del usuario. Duerme los dos próximos turnos. 
      it: |-
        Chi la usa recupera tutti i PS e guarisce da tutti
        i suoi problemi di stato, ma dorme per due turni.
    sword-shield:
      ja-Hrkt: |-
        でんげきを　こめた　パンチで
        あいてを　こうげきする。
        まひ　じょうたいに　することが　ある。
      ja: |-
        電撃を　こめた　パンチで
        相手を　攻撃する。
        まひ状態に　することが　ある。
      ko: |-
        전격을 담은 펀치로
        상대를 공격한다.
        마비 상태로 만들 때가 있다.
      zh-Hant: |-
        用帶有電流的拳頭攻擊對手。
        有時會讓對手陷入麻痺狀態。
      zh-Hans: |-
        用充满电流的拳头攻击对手。
        有时会让对手陷入麻痹状态。
      en: |-
        The target is punched with an electrified fist.
        This may also leave the target with paralysis.
      fr: |-
        Un coup de poing électrique vient frapper l’ennemi.
        Peut le paralyser.
      de: |-
        Ein elektrischer Schlag, der das Ziel eventuell
        paralysiert.
      es: 'Puñetazo eléctrico que puede paralizar al adversario.'
      it: |-
        Colpisce il bersaglio con un pugno elettrico
        che può paralizzarlo.
