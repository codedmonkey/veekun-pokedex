whipped-dream:
  category: evolution
  cost: 2000
  effect:
    en: 'Traded on a Swirlix: Holder evolves into Slurpuff.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        ふんわり　ふわふわに　あわだてた
        ほんのり　あまい　クリーム。
        ある　ポケモンが　このんでいる。
      ja: |-
        ふんわり　ふわふわに　泡立てた
        ほんのり　甘い　クリーム。
        ある　ポケモンが　好んでいる。
      ko: |-
        풍성하게 거품을 낸
        살짝 달콤한 크림.
        어떤 포켓몬이 좋아한다.
      en: |-
        A soft and sweet treat made of fluffy,
        puffy, whipped and whirled cream.
        It’s loved by a certain Pokémon.
      fr: |-
        Une crème sucrée qui fond dans la bouche,
        légère comme un nuage. Elle est appréciée
        d’un certain Pokémon.
      de: |-
        Ein lockeres, leicht süßliches Häubchen
        aus Schlagsahne, das bei einer bestimmten
        Pokémon-Art sehr beliebt ist.
      es: |-
        Una de las misteriosas Megapiedras. Permite
        megaevolucionar a Medicham en combate.
      it: |-
        Una spuma soffice, delicata e leggermente dolce.
        Piace a un Pokémon in particolare.
