poke-flute:
  category: plot-advancement
  cost: 0
  effect:
    en: 'Wakes up [sleeping]{mechanic:sleep} Pokémon.  Required to wake up sleeping []{pokemon:snorlax} on the overworld.'
  flags: {  }
  flavor_text:
    emerald:
      en: |-
        A sweet-sounding
        flute that awakens
        POKéMON.
    firered-leafgreen:
      en: |-
        A flute that is said to instantly
        awaken any POKéMON. It has a
        lovely tone.
    x-y:
      ja-Hrkt: |-
        ねむっている　ポケモンも
        おもわず　めざめるほど　すばらしい
        ねいろを　かなでる　ふえ。
      ja: |-
        眠っている　ポケモンも
        思わず　めざめるほど　すばらしい
        音色を　奏でる　ふえ。
      ko: |-
        잠자고 있는 포켓몬도
        무심코 잠에서 깨어날 정도로
        멋진 음색을 내는 피리.
      en: |-
        A flute which can play with such a
        beautiful tone that even sleeping
        Pokémon find themselves roused.
      fr: |-
        Une flûte au son si particulier qu’elle permet de
        réveiller les Pokémon les plus profondément
        endormis.
      de: |-
        Eine Flöte, die so wundervolle Töne spielen kann,
        dass selbst schlafende Pokémon aufwachen.
      es: |-
        Una de las misteriosas Megapiedras. Permite
        megaevolucionar a Scizor en combate.
      it: |-
        Flauto dal suono meraviglioso che risveglia
        anche i Pokémon profondamente addormentati.
