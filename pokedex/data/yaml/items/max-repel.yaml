    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        つかうと　やせいの　ポケモンが
        にげていき　であわなく　なる。
        シルバースプレーより　ながく　もつ。
      ja: |-
        使うと　野生の　ポケモンが
        逃げていき　出会わなく　なる。
        シルバースプレーより　長く　もつ。
      ko: |-
        사용하면 야생 포켓몬이
        도망가서 만나지 않게 된다.
        실버스프레이보다 효과가 오래간다.
      zh-Hant: |-
        使用後，野生寶可夢會跑掉，
        變得完全不會出現。
        效果比白銀噴霧更持久。
      zh-Hans: |-
        使用后，野生宝可梦就会逃走，
        接下来不会再遇到它们。
        效果比白银喷雾更持久。
      en: |-
        An item that drives away wild Pokémon so you won’t
        encounter them. It lasts longer than a Super Repel.
      fr: |-
        Repousse les Pokémon sauvages pendant une durée
        plus longue que celle du Super Repousse.
      de: |-
        Hält wilde Pokémon vom Anwender fern und
        bewirkt so, dass du keinen mehr begegnest.
        Wirkt länger als das Item Superschutz.
      es: |-
        Evita encuentros con Pokémon salvajes durante más
        tiempo que un Superrepelente.
      it: |-
        Strumento che mette in fuga i Pokémon selvatici,
        permettendo a chi lo usa di evitarli. Il suo effetto
        dura più a lungo di quello del Superrepellente.
