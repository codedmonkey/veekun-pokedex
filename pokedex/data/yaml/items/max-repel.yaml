max-repel:
  category: spelunking
  cost: 900
  effect:
    en: |-
      Used outside of battle
      :   Trainer will skip encounters with wild Pokémon of a lower level than the lead party Pokémon.  This effect wears off after the trainer takes 250 steps.
  flags: {  }
  flavor_text:
    ruby-sapphire:
      en: |-
        Repels weak wild
        POKéMON for 250
        steps.
    emerald:
      en: |-
        Repels weak wild
        POKéMON for 250
        steps.
    firered-leafgreen:
      en: |-
        Prevents weak wild POKéMON from
        appearing for 250 steps.
    diamond-pearl:
      en: |-
        An item that prevents weak wild
        Pokémon from appearing for 250 steps
        after its use.
    platinum:
      en: |-
        An item that prevents weak wild
        Pokémon from appearing for 250 steps
        after its use.
    heartgold-soulsilver:
      en: |-
        An item that prevents weak wild
        Pokémon from appearing for 250 steps
        after its use.
    black-white:
      en: |-
        An item that prevents weak wild
        Pokémon from appearing for 250 steps
        after its use.
      fr: |-
        Repousse les Pokémon sauvages
        faibles pendant 250 pas.
    black-2-white-2:
      en: |-
        An item that prevents weak wild
        Pokémon from appearing for 250 steps
        after its use.
    x-y:
      ja-Hrkt: |-
        ２５０ぽ　すすむ　あいだ
        よわい　やせいの　ポケモンが
        まったく　でて　こなくなる。
      ja: |-
        ２５０歩　進む　あいだ
        弱い　野生の　ポケモンが
        まったく　でて　こなくなる。
      ko: |-
        250보 걸어가는 동안
        약한 야생 포켓몬이
        전혀 나오지 않게 된다.
      en: |-
        An item that prevents any low-level
        wild Pokémon from jumping out at
        you for 250 steps after its use.
      fr: |-
        Repousse les Pokémon sauvages faibles pendant
        250 pas.
      de: |-
        Hält 250 Schritte lang schwache, wilde
        Pokémon ab.
      es: |-
        Repele Pokémon salvajes débiles en un recorrido
        de 250 pasos.
      it: |-
        Strumento che evita l’incontro con i Pokémon
        selvatici deboli per 250 passi dopo l’utilizzo.
    sun-moon:
      ja-Hrkt: |-
        よわい　やせいの　ポケモンが
        まったく　でて　こなくなる。
        シルバースプレーより　ながく　きく。
      ja: |-
        弱い　野生の　ポケモンが
        まったく　でて　こなくなる。
        シルバースプレーより　長く　効く。
      ko: |-
        약한 야생 포켓몬이
        전혀 나오지 않게 된다.
        실버스프레이보다 효과가 오래간다.
      zh-Hant: |-
        弱小的野生寶可夢
        變得完全不會出現。
        效果比白銀噴霧更持久。
      zh-Hans: |-
        弱小的野生宝可梦
        将完全不会出现。
        效果比白银喷雾更持久。
      en: |-
        An item that prevents any low-level wild Pokémon
        from jumping out at you for a while. It lasts longer
        than Super Repel.
      fr: |-
        Repousse les Pokémon sauvages faibles
        pendant une durée plus longue que celle
        du Super Repousse.
      de: |-
        Hält schwache wilde Pokémon ab.
        Wirkt länger als das Item Superschutz.
      es: |-
        Evita encuentros con Pokémon salvajes débiles
        durante más tiempo que un Superrepelente.
      it: |-
        Strumento che evita a chi lo usa di incontrare
        Pokémon selvatici deboli. Il suo effetto dura più
        a lungo di quello del Superrepellente.
    ultra-sun-ultra-moon:
