heal-ball:
  category: special-balls
  cost: 300
  effect:
    en: |-
      Used in battle
      :   Attempts to [catch]{mechanic:catch} a wild Pokémon, using a catch rate of 1×.  The caught Pokémon's [HP]{mechanic:hp} is immediately restored, [PP]{mechanic:pp} for all its moves is restored, and any [status ailment]{mechanic:status-ailment} is cured.

          If used in a trainer battle, nothing happens and the ball is lost.
  flags:
    - countable
    - consumable
    - usable-in-battle
    - holdable
  flavor_text:
    diamond-pearl:
      en: |-
        A remedial Poké Ball that restores the
        caught Pokémon’s HP and eliminates
        any status problem.
    platinum:
      en: |-
        A remedial Poké Ball that restores the
        caught Pokémon’s HP and eliminates
        any status problem.
    heartgold-soulsilver:
      en: |-
        A remedial Poké Ball that restores the
        caught Pokémon’s HP and eliminates
        any status problem.
    black-white:
      en: |-
        A remedial Poké Ball that restores the
        caught Pokémon’s HP and eliminates
        any status problem.
      fr: |-
        Une Poké Ball de soin qui rend tous les
        PV du Pokémon attrapé et qui soigne
        tous les changements de statut.
    black-2-white-2:
      en: |-
        A remedial Poké Ball that restores the
        caught Pokémon’s HP and eliminates
        any status problem.
    x-y:
      ja-Hrkt: |-
        つかまえた　ポケモンの　ＨＰと
        じょうたい　いじょうを　かいふくする
        ちょっと　やさしい　ボール。
      ja: |-
        捕まえた　ポケモンの　ＨＰと
        状態異常を　回復する
        ちょっと　やさしい　ボール。
      ko: |-
        잡은 포켓몬의 HP와
        상태 이상을 회복시키는
        조금 다정한 볼.
      en: |-
        A remedial Poké Ball that restores
        the HP of a Pokémon caught with it
        and eliminates any status conditions.
      fr: |-
        Une Poké Ball de soin qui rend tous les PV
        du Pokémon attrapé et qui soigne tous les
        changements de statut.
      de: |-
        Ein wohltuender Ball. Er füllt alle KP des
        gefangenen Pokémon auf und behebt alle
        Statusprobleme.
      es: |-
        Poké Ball curativa que restaura los PS y cura
        todos los problemas de estado de un Pokémon
        después de capturarlo.
      it: |-
        Poké Ball curativa che ridà PS al Pokémon
        catturato e cura tutti i problemi di stato.
