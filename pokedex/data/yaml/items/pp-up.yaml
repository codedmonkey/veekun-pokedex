pp-up:
  category: vitamins
  cost: 10000
  effect:
    en: |-
      Used on a party Pokémon
      :   Increases a selected move's max [PP]{mechanic:pp} by 20% its original max PP, to a maximum of 1.6×.  Increases [happiness]{mechanic:happiness} by 5/3/2.
  flags:
    - countable
    - consumable
    - usable-overworld
    - usable-in-battle
    - holdable
  flavor_text:
    ruby-sapphire:
      en: |-
        Raises the maximum
        PP of a selected
        move.
    emerald:
      en: |-
        Raises the maximum
        PP of a selected
        move.
    firered-leafgreen:
      en: |-
        Slightly raises the maximum PP of
        a selected move for one POKéMON.
    diamond-pearl:
      en: |-
        It slightly raises the maximum PP of
        a selected move that has been learned
        by the target Pokémon.
    platinum:
