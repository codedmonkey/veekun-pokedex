        わざのうち　１つの　ＰＰの
        さいだいちを　すこし　あげる。
      ja: |-
        ポケモンが　覚えている
        技のうち　１つの　ＰＰの
        最大値を　少し　あげる。
      ko: |-
        포켓몬이 기억하고 있는
        기술 중 1개의 PP
        최대치를 조금 올린다.
      en: |-
        A medicine that can slightly raise the
        maximum PP of a single move that has
        been learned by the target Pokémon.
      fr: |-
        Augmente un peu les PP max d’une capacité
        sélectionnée.
      de: |-
        Erhöht die maximale Anzahl der AP einer Attacke
        eines Pokémon.
      es: |-
        Aumenta ligeramente los PP máximos del
        movimiento elegido de un Pokémon.
      it: |-
        Aumenta di poco i PP massimi di una mossa
        a scelta tra quelle conosciute dal Pokémon.
