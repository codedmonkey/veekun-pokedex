grassy-seed:
  category: held-items
  cost: 4000
  effect:
    en: "Held: If the holder enters battle during Grassy Terrain, or if Grassy Terrain is activated while the holder is in battle, this item is consumed and the holder's Defense raises by one stage."
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        ポケモンに　もたせると
        グラスフィールドのときに　つかって
        ぼうぎょが　あがる。
      ja: |-
        ポケモンに　持たせると
        グラスフィールドのときに　使って
        防御が　あがる。
      ko: |-
        포켓몬에게 지니게 하면
        그래스필드일 때 사용하여
        방어가 올라간다.
      zh-Hant: |-
        讓寶可夢攜帶後，
        在青草場地上使用，
        就會提高防禦。
      zh-Hans: |-
        让宝可梦携带后，
        在青草场地上使用，
        防御就会提高。
      en: |-
        An item to be held by a Pokémon. It boosts Defense
        on Grassy Terrain. It can only be used once.
      fr: |-
        Objet à tenir. Augmente la Défense Spéciale lorsque
        le terrain est couvert d’un Champ Herbu.
      de: |-
        Gibst du den Samen einem Pokémon zum Tragen,
        setzt es ihn ein, wenn ein Grasfeld aktiv ist, und
        erhöht dadurch seine Verteidigung.
      es: |-
        Aumenta la Defensa del portador si se usa cuando
        el terreno está cubierto por un campo de hierba.
      it: |-
        Strumento da dare a un Pokémon.
        Fa aumentare la Difesa quando il terreno
        di lotta è nello stato di Campo Erboso.
