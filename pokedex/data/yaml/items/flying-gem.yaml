        ひこうの　タイプの　ジュエル。
        もたせると　いちどだけ　ひこうの
        わざの　いりょくが　つよまる。
      ja: |-
        ひこうの　タイプの　ジュエル。
        持たせると　１度だけ　ひこうの
        技の　威力が　強まる。
      ko: |-
        비행타입의 주얼.
        지니게 하면 한 번만 비행
        기술의 위력이 강해진다.
      en: |-
        A gem with an essence of air.
        When held, it strengthens the power
