  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        ロトムパワーの　ひとつ。
        つかうと　フレンドリィショップの
        しょうひんが　はんがくに　なる。
      ja: |-
        ロトムパワーの　ひとつ。
        使うと　フレンドリィショップの
        商品が　半額に　なる。
      ko: |-
        로토무파워 중 하나.
        사용하면 프렌들리숍의
        상품이 반값이 된다.
      zh-Hant: |-
        洛托姆之力的一種。
        使用後，友好商店的
        商品就會變成半價。
      zh-Hans: |-
        洛托姆之力的一种。
        使用后，友好商店的
        商品就会变成半价。
      en: |-
        One of the Rotom Powers.
        It reduces the prices of products at Poké Marts
        by half.
      fr: |-
        Une des Motism’Auras. Elle permet de réduire
        de moitié le coût des objets vendus dans
        les Boutiques Pokémon.
      de: |-
        Diese Rotom-Kraft bewirkt, dass die Preise im
        Pokémon-Supermarkt halbiert werden.
      es: |-
        Poder Rotom que reduce a la mitad el coste de los
        artículos en las Tiendas Pokémon.
      it: |-
        Potere Rotom che consente di acquistare
        i prodotti del Pokémon-Market a metà prezzo.
