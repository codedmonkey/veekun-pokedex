    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        つかうと　やせいの　ポケモンが
        にげていき　であわなく　なる。
        むしよけスプレーより　ながく　もつ。
      ja: |-
        使うと　野生の　ポケモンが
        逃げていき　出会わなく　なる。
        むしよけスプレーより　長く　もつ。
      ko: |-
        사용하면 야생 포켓몬이
        도망가서 만나지 않게 된다.
        벌레회피스프레이보다 효과가 오래간다.
      zh-Hant: |-
        使用後，野生寶可夢會跑掉，
        變得完全不會出現。
        效果比除蟲噴霧更持久。
      zh-Hans: |-
        使用后，野生宝可梦就会逃走，
        接下来不会再遇到它们。
        效果比除虫喷雾更持久。
      en: |-
        An item that drives away wild Pokémon so you won’t
        encounter them. It lasts longer than a Repel.
      fr: |-
        Repousse les Pokémon sauvages pendant une durée
        plus longue que celle du Repousse.
      de: |-
        Hält wilde Pokémon vom Anwender fern und
        bewirkt so, dass du keinen mehr begegnest.
        Wirkt länger als das Item Schutz.
      es: |-
        Evita encuentros con Pokémon salvajes durante más
        tiempo que un Repelente normal.
      it: |-
        Strumento che mette in fuga i Pokémon selvatici,
        permettendo a chi lo usa di evitarli. Il suo effetto
        dura più a lungo di quello del Repellente.
