adamant-orb:
  category: species-specific
  cost: 0
  effect:
    en: |-
      Held by []{pokemon:dialga}
      :   Holder's []{type:dragon}- and []{type:steel}-type moves have 1.2× their usual power.
  flags:
    - holdable
  flavor_text:
    diamond-pearl:
      en: |-
        A brightly gleaming orb to be held by
        DIALGA. It boosts the power of Dragon-​
        and Steel-type moves.
    platinum:
      en: |-
        A brightly gleaming orb to be held by
        DIALGA. It boosts the power of Dragon-​
