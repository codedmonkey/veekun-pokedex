    x-y:
      ja-Hrkt: |-
        ディアルガに　もたせると　ドラゴンと
        はがねタイプの　わざの　いりょくが
        あがる　ひかり　かがやく　たま。
      ja: |-
        ディアルガに　持たせると　ドラゴンと
        はがねタイプの　技の　威力が
        あがる　光り　輝く　珠。
      ko: |-
        디아루가에게 지니게 하면 드래곤과
        강철타입 기술의 위력이 올라가는
        반짝반짝 빛나는 구슬.
      en: |-
        A brightly gleaming orb to be held by
        Dialga. It boosts the power of Dragon-​
        and Steel-type moves when it is held.
      fr: |-
        Un orbe très brillant destiné à Dialga.
        Augmente la puissance des capacités de type
        Dragon et Acier.
      de: |-
        Ein hell leuchtender Orb. Verstärkt Attacken vom
        Typ Drache und Stahl, wenn Dialga ihn trägt.
      es: |-
        Los Pokémon pueden llevarla o usarla para
        curarse las quemaduras.
      it: |-
        Sfera molto luminosa da dare a Dialga.
        Potenzia le mosse di tipo Drago e Acciaio.
