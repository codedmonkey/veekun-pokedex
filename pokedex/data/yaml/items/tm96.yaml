    x-y:
      ja-Hrkt: |-
        しぜんの　ちからで　こうげきする。
        つかう　ばしょで
        でてくる　わざが　へんかする。
      ja: |-
        自然の　力で　攻撃する。
        使う　場所で
        でてくる　技が　変化する。
      ko: |-
        자연의 힘으로 공격한다.
        사용하는 장소에 따라
        나오는 기술이 변화한다.
      en: |-
        An attack that makes use of nature’s
        power. Its effects vary depending on
        the user’s environment.
      fr: |-
        Une attaque qui tire sa force de la nature.
        Son type varie selon le terrain.
      de: |-
        Angriff mit der Kraft der Natur, dessen Typ
        vom Ort abhängt, wo er durchgeführt wird.
      es: |-
        Especialidad de Ciudad Yantra. Cura los
        problemas de estado de un Pokémon.
      it: |-
        Mossa che fa uso della forza della natura.
        Il suo effetto varia in base all’ambiente.
