hm06:
  category: all-machines
  cost: 0
  effect:
    en: 'Teaches Rock Smash to a compatible Pokémon.'
  flags: {  }
  flavor_text:
    ruby-sapphire:
      en: |-
        A rock-crushingly
        tough attack that
        may lower DEFENSE.
    emerald:
      en: |-
        A rock-crushingly
        tough attack that
        may lower DEFENSE.
    firered-leafgreen:
      en: |-
        An attack that may
        also cut DEFENSE.
        It can also smash
        cracked boulders.
    diamond-pearl:
      en: |-
        The user slugs the foe with a
        shattering punch. It can also smash
        cracked boulders.
    platinum:
      en: |-
        The user slugs the foe with a
        shattering punch. It can also smash
        cracked boulders.
    heartgold-soulsilver:
      en: |-
        The user slugs the foe with a
        shattering punch. It can also smash
        cracked boulders.
    black-white:
      en: |-
        Diving on the first turn, the user
        floats up and attacks on the second.
        It can be used for diving in the ocean.
      fr: |-
        Le lanceur plonge sous l’eau au
        1er tour et frappe au 2è. Permet
        aussi de plonger au fond de l’eau.
    black-2-white-2:
      en: |-
        Diving on the first turn, the user
        floats up and attacks on the second.
        It can be used for diving in the ocean.
    x-y:
      ja-Hrkt: |-
        １ターンめで　もぐり　２ターンめに
        うきあがって　こうげきする。うみの
        なかに　もぐる　ことも　できる。
      ja: |-
        １ターン目で　潜り　２ターン目に
        浮きあがって　攻撃する。
        海の　奥深くに　潜ることも　できる。
      ko: |-
        1턴째에 잠수했다가 2턴째에
        떠올라 공격한다.
        바닷속 깊숙이 잠수할 수도 있다.
      en: |-
        Diving on the first turn, the user floats
        up and attacks on the next turn.
      fr: |-
        Le lanceur plonge sous l’eau au premier tour et
        frappe au second.
      de: |-
        Taucht in Runde 1 ab und greift in Runde 2
        aus der Tiefe an. Ermöglicht Tauchgänge zum
        Meeresgrund.
      es: |-
        Puedes obtenerlo en el Casino. Tiene capacidad
        para 50 000 Fichas.
      it: |-
        Chi la usa si tuffa in acqua per emergere e
        attaccare al turno seguente.
    sun-moon:
      ja-Hrkt: |-
        パンチで　こうげき。　あいての
        ぼうぎょを　さげる　ことが　ある。
        いわを　くだくことも　できる。
      ja: |-
        パンチで　攻撃する。相手の
        防御を　さげる　ことが　ある。
        岩を　砕くことも　できる。
      ko: |-
        펀치로 공격한다.
        상대의 방어를 떨어뜨릴 때가 있으며
        바위를 깰 수도 있다.
      zh-Hant: |-
        用拳頭進行攻擊。
        有時會降低對手的防禦。
        也可以擊碎岩石。
      zh-Hans: |-
        用拳头进行攻击。
        有时会降低对手的防御。
        还可以击碎岩石。
      en: |-
        The user attacks with a punch. This may also lower
        the target’s Defense stat. This move can also
        shatter rocks in the field.
      fr: |-
        Porte un coup de poing à l’ennemi qui peut
        baisser sa Défense. Peut aussi briser des rochers
        fissurés.
      de: |-
        Der Anwender greift mit einem Hieb an, der den
        Verteidigungs-Wert des Zieles senken kann.
        Damit können auch Steine zerschlagen werden.
      es: |-
        Ataca con los puños. Puede bajar la Defensa del
        objetivo y romper rocas fuera del combate.
      it: |-
        Chi la usa colpisce il bersaglio con un pugno
        che può anche ridurne la Difesa. Fuori dalla lotta
        permette di frantumare le rocce.
