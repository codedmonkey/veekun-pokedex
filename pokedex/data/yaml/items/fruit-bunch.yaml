  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        キャンプの　りょうりに　つかう
        しょくざいの　いっしゅ。トロトロに　なった
        フサが　トロピカルきぶんに　させてくれる。
      ja: |-
        キャンプの　料理に　使う
        食材の　一種。トロトロに　なった
        フサが　トロピカル気分に　させてくれる。
      ko: |-
        캠프 요리에 사용되는
        식재료 중 하나. 걸쭉해진 송이가
        열대지방의 기분을 느끼게 해준다.
      zh-Hant: |-
        製作露營料理時使用的食材之一。
        煮得黏糊糊的果實能為料理
        帶來一份熱帶風情。
      zh-Hans: |-
        在露营营地制作料理时会使用的
        一种食材。煮得粘稠浓厚的水果，
        能为料理增添一份热带风情。
      en: |-
        One of the many ingredients that can be used for
        cooking at your camp. The syrupy fruits give off a strong
        tropical feel.
      fr: |-
        Un ingrédient de cuisine pour le camping.
        Les fruits écrasés donnent un parfum tropical
        à toute préparation.
      de: |-
        Eine Zutat für PokéCamping-Mahlzeiten. Die weichen
        Früchte verleihen dem Essen eine tropische Note.
      es: |-
        Un ingrediente para cocinar en el campamento. La
        jugosa fruta aporta un toque tropical al plato.
      it: |-
        Uno degli ingredienti che puoi usare per cucinare
        in campeggio. La loro polpa conferisce alle pietanze
        un sapore tropicale.
