dire-hit-2:
  category: miracle-shooter
  cost: 0
  effect:
    en: |-
      Used on a party Pokémon in battle
      :   Raises the target's [critical hit]{mechanic:critical-hit} rate by two [stages]{mechanic:stage}.
      This item can only be obtained or used via the Wonder Launcher.
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        It can be used many times to raise the
        critical-hit ratio of one Pokémon. It
        wears off if the Pokémon is withdrawn.
      fr: |-
        Augmente le taux de critiques. Plus
        efficace à chaque utilisation. L’effet
        s’estompe si le Pokémon se retire.
    black-2-white-2:
      en: |-
        It can be used many times to raise the
        critical-hit ratio of one Pokémon. It
        wears off if the Pokémon is withdrawn.
    x-y:
      ja-Hrkt: |-
        きゅうしょりつが　あがる。
        つかうたびに　こうかが　アップする。
        ひっこめると　もとに　もどる。
      ja: |-
        急所率が　あがる。
        使うたびに　効果が　アップする。
        ひっこめると　元に　戻る。
      ko: |-
        급소 명중률이 올라간다. 사용할 때마다
        효과가 올라간다. 포켓몬을 볼에
        넣어버리면 원래대로 되돌아간다.
      en: |-
        It can be used many times to raise the
        critical-hit ratio of one Pokémon. It
        wears off if the Pokémon is withdrawn.
      fr: |-
        Augmente le taux de critiques.
        Plus efficace à chaque utilisation.
        L’effet s’estompe si le Pokémon se retire.
      de: |-
        Erhöht die Volltrefferquote. Effektiver bei
        mehrfacher Anwendung. Wirksam, bis das
        Pokémon ausgewechselt wird.
      es: |-
        Al usarlo, activa la habilidad de un Pokémon de
        tu equipo.
      it: |-
        Aumenta la probabilità di sferrare brutti colpi.
        Se usato più volte, l’effetto si somma,
        ma svanisce se il Pokémon è sostituito.
