        带上这个神奇的
        可增强稳定性的护身符，
        就能更容易触发会心捕捉。
      en: |-
        Holding it is said to increase the chance of getting a
        critical catch. Curiously, the charm doesn’t shake much.
      fr: |-
        Ce porte-bonheur permet de stabiliser les Poké Balls
        et augmente les chances de réaliser une capture
        critique.
      de: |-
        Ein mysteriöser Glücksbringer, der nur wenig wackelt
        und die Wahrscheinlichkeit erhöht, einen Superfang
        hinzulegen.
      es: |-
        Aumenta la probabilidad de lograr una captura crítica
        al llevarlo equipado. Curiosamente, apenas vibra.
      it: |-
        Misterioso amuleto che non oscilla molto.
        Aumenta la probabilità che si verifichi una
        cattura critica.
