    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        あいてを　おこらせる。　３ターンの
        あいだ　あいては　ダメージを
        あたえる　わざしか　だせなく　なる。
      ja: |-
        相手を　怒らせる。　３ターンの
        間　相手は　ダメージを
        与える　技しか　だせなくなる。
      ko: |-
        상대를 화나게 한다.
        3턴 동안 상대는 데미지를
        주는 기술밖에 쓸 수 없게 된다.
      zh-Hant: |-
        激怒對手。
        在３回合內讓對手
        只能使出給予傷害的招式。
      zh-Hans: |-
        使对手愤怒。
        在３回合内让对手
        只能使出给予伤害的招式。
      en: |-
        The target is taunted into a rage that allows it to use
        only attack moves for three turns.
      fr: |-
        Provoque l’ennemi. L’oblige à n’utiliser que des
        attaques pendant trois tours.
      de: |-
        Bringt das Ziel in Rage. Dieses kann über drei Runden
        hinweg nur noch angreifen.
      es: |-
        Enfurece al objetivo para que solo use movimientos
        de ataque durante tres turnos.
      it: |-
        Provoca il bersaglio inducendolo a usare
        solo mosse d’attacco per tre turni.
    sword-shield:
      ja-Hrkt: |-
        あいての　からだに
        こばんを　なげつけて　こうげきする。
        せんとうの　あとで　おかねが　もらえる。
      ja: |-
        相手の　体に
        小判を　投げつけて　攻撃する。
        戦闘の　あとで　お金が　もらえる。
      ko: |-
        상대의 몸에
        돈을 세게 던져서 공격한다.
        배틀 후에 돈을 받을 수 있다.
      zh-Hant: |-
        往對手身上
        投擲金幣進行攻擊。
        戰鬥後可以得到錢。
      zh-Hans: |-
        向对手的身体
        投掷小金币进行攻击。
        战斗后可以拿到钱。
      en: |-
        Numerous coins are hurled at the target to inflict
        damage. Money is earned after the battle.
      fr: |-
        Des pièces sont lancées sur l’ennemi.
        Permet d’obtenir de l’argent à la fin du combat.
      de: |-
        Das Ziel wird mit Münzen beworfen. Das Geld wird
        nach dem Kampf aufgesammelt.
      es: |-
        Arroja monedas al objetivo y las recupera al final del
        combate.
      it: |-
        Colpisce il bersaglio con una gran quantità
        di monete recuperabili dopo la lotta.
