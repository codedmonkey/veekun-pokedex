  flavor_text:
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        このはで　つくった　てがみ。
        イーブイの　あしあとで
        なにかが　かかれて　いる。
      ja: |-
        木の葉で　作った　手紙。
        イーブイの　足あとで
        なにかが　書かれて　いる。
      ko: |-
        나뭇잎으로 만든 편지.
        이브이의 발자국으로
        무언가가 쓰여 있다.
      zh-Hant: |-
        用樹葉做的信。
        上面有伊布的腳印。
        好像是想表達些什麼。
      zh-Hans: |-
        以树叶制作的信件。
        上面留有伊布的足迹，
        好像是要表达些什么。
      en: |-
        A letter written on a leaf. Something is written using
        Eevee’s footprints.
      fr: |-
        Une lettre rédigée sur une feuille d’arbre.
        Évoli semble y avoir écrit quelque chose avec ses pattes.
      de: |-
        Ein Brief, der auf einem Blatt verfasst wurde.
        Evoli scheint mit seinen Pfotenabdrücken
        etwas geschrieben zu haben.
      es: |-
        Una carta escrita en una hoja. Hay huellas de Eevee
        estampadas en ella y parecen guardar algún significado.
      it: |-
        Una lettera scritta sulla foglia di un albero, dove le
        impronte di Eevee sembrano formare delle frasi
        di senso compiuto.
