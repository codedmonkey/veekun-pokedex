naughty-mint:
  category: nature-mints
  cost: 20
  effect: {  }
  flags: {  }
  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        ポケモンに　かおりを　かがせると
        こうげきが　あがりやすく　なるが
        とくぼうは　あがりにくくなる　ミント。
      ja: |-
        ポケモンに　香りを　かがせると
        攻撃が　上がりやすく　なるが
        特防は　上がりにくくなる　ミント。
      ko: |-
        포켓몬에게 향기를 맡게 하면
        공격이 오르기 쉬워지지만
        특수방어가 오르기 어려워지는 민트.
      zh-Hant: |-
        讓寶可夢聞這種薄荷的氣味，
        會令攻擊變得容易提高，
        但特防則難以提高。
      zh-Hans: |-
        宝可梦闻了这种薄荷之后，
        会令攻击容易提高，
        而特防则难以提高。
      en: |-
        When a Pokémon smells this mint, its Attack will grow
        more easily, but its Sp. Def will grow more slowly.
      fr: |-
        Si un Pokémon hume cet aromate, son Attaque
        montera plus facilement, mais sa Défense Spéciale
        se développera plus lentement.
      de: |-
        Lässt man ein Pokémon an dieser Minze schnuppern,
        steigt sein Angriff schneller, aber seine
        Spezial-Verteidigung umso langsamer.
      es: |-
        Cuando un Pokémon percibe su aroma, aumenta con
        más facilidad su Ataque, en detrimento de su Defensa
        Especial.
      it: |-
        Quando un Pokémon ne sente il profumo, il suo Attacco
        aumenta più facilmente a scapito della Difesa Speciale.
