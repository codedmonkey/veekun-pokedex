love-ball:
  category: apricorn-balls
  cost: 0
  effect:
    en: |-
      Used by a trainer in battle
      :   Attempts to [catch]{mechanic:catch} a wild Pokémon.  If used in a trainer battle, nothing happens and the ball is lost.

          If the trainer's Pokémon and wild Pokémon are of the same species but opposite genders, the wild Pokémon's catch rate is 8× normal.
  flags: {  }
  flavor_text:
    heartgold-soulsilver:
      en: |-
        Poké Ball for catching Pokémon that are
        the opposite gender of your Pokémon.
    black-white:
      en: |-
        Poké Ball for catching Pokémon that are
        the opposite gender of your Pokémon.
      fr: |-
        Une Poké Ball un peu spéciale qui
        fonctionne mieux sur un Pokémon de
        la même espèce mais de sexe opposé.
    black-2-white-2:
      en: |-
        Poké Ball for catching Pokémon that are
        the opposite gender of your Pokémon.
    x-y:
      ja-Hrkt: |-
        じぶんの　ポケモンと　せいべつが
        ちがうと　つかまえやすくなる
        ちょっと　かわった　ボール。
      ja: |-
        自分の　ポケモンと　性別が
        違うと　捕まえやすくなる
        ちょっと　変わった　ボール。
      ko: |-
        자신의 포켓몬과 성별이
        다르면 잡기 쉬워지는
        조금 특이한 볼.
      en: |-
        A Poké Ball that works best when
        catching a Pokémon that is of the
        opposite gender of your Pokémon.
      fr: |-
        Une Poké Ball un peu spéciale qui fonctionne
        mieux sur un Pokémon de sexe opposé.
      de: |-
        Ein Ball, der sich besonders gut eignet,
        um Pokémon zu fangen, die ein anderes
        Geschlecht haben als dein Pokémon.
      es: |-
        Contiene los datos del Pokéathlon con el número
        de puntos conseguidos.
      it: |-
        Poké Ball speciale che funziona meglio con i
        Pokémon di sesso opposto a quello del proprio
        e della stessa specie.
