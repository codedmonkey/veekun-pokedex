macho-brace:
  category: effort-training
  cost: 3000
  effect:
    en: |-
      Held
      :   When the holder would gain [effort]{mechanic:effort} due to battle, it gains double that effort instead.

      Held in battle
      :   Holder has half its [Speed]{mechanic:speed}.
  flags:
    - holdable
    - holdable-active
  flavor_text:
    ruby-sapphire:
      en: |-
        A hold item that
        promotes growth,
        but reduces SPEED.
    emerald:
      en: |-
        A hold item that
        promotes growth,
        but reduces SPEED.
    firered-leafgreen:
      en: |-
        An item to be held by a POKéMON.
        It promotes strong growth but
        lowers SPEED while it is held.
    diamond-pearl:
      en: |-
        An item to be held by a Pokémon. It is
        a stiff and heavy brace that promotes
        strong growth but lowers Speed.
    platinum:
      en: |-
        An item to be held by a Pokémon. It is
        a stiff and heavy brace that promotes
        strong growth but lowers Speed.
    heartgold-soulsilver:
      en: |-
        An item to be held by a Pokémon. It is
        a stiff and heavy brace that promotes
        strong growth but lowers Speed.
    black-white:
      en: |-
        An item to be held by a Pokémon. It is
        a stiff and heavy brace that promotes
        strong growth but lowers Speed.
      fr: |-
        Objet à tenir. C’est un bracelet dur
        et lourd qui rend le porteur plus fort,
        mais baisse sa Vitesse.
    black-2-white-2:
      en: |-
        An item to be held by a Pokémon. It is
        a stiff and heavy brace that promotes
        strong growth but lowers Speed.
    x-y:
      ja-Hrkt: |-
        かたくて　おもい　ギプス。
        もたせると　すばやさは　さがるが
        ふつうより　つよく　そだちやすい。
      ja: |-
        硬くて　重い　ギプス。
        持たせると　素早さは　さがるが
        ふつうより　強く　育ちやすい。
      ko: |-
        단단하고 무거운 깁스.
        지니게 하면 스피드는 떨어지지만
        여느 때보다 강하게 키우기 쉽다.
      en: |-
        An item to be held by a Pokémon.
        This stiff, heavy brace helps Pokémon
        grow strong but cuts Speed in battle.
      fr: |-
        Objet à tenir. Un bracelet dur et lourd qui rend
        le porteur plus fort, mais baisse sa Vitesse.
      de: |-
        Ein Item, das ein Pokémon tragen kann.
        Der Initiative-Wert sinkt zwar, aber es wird
        dafür umso stärker.
      es: |-
        Su lente aumenta la probabilidad que tiene el
        Pokémon que lo lleva de conseguir un golpe
        crítico.
      it: |-
        Strumento da dare a un Pokémon.
        Attrezzo pesante che riduce la Velocità ma aiuta
        la crescita delle statistiche.
    sun-moon:
      ja-Hrkt: |-
        かたくて　おもい　ギプス。
        もたせると　すばやさは　さがるが
        ふつうより　つよく　そだちやすい。
      ja: |-
        硬くて　重い　ギプス。
        持たせると　素早さは　さがるが
        ふつうより　強く　育ちやすい。
      ko: |-
        단단하고 무거운 깁스.
        지니게 하면 스피드는 떨어지지만
        여느 때보다 강하게 키우기 쉽다.
      zh-Hant: |-
        又硬又重的鍛鍊器。
        雖然攜帶後速度會降低，
        但會比平時更容易茁壯成長。
      zh-Hans: |-
        又硬又重的锻炼器。
        虽然携带后速度会降低，
        但会比平时更容易茁壮成长。
      en: |-
