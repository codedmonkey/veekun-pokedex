metronome:
  category: held-items
  cost: 4000
  effect:
    en: 'Held: Each time the holder uses the same move consecutively, its power is increased by another 10% of its original, to a maximum of 100%.'
  flags:
    - holdable
    - holdable-active
  flavor_text:
    diamond-pearl:
      en: |-
        A Pokémon hold item that boosts a move
        used consecutively. Its effect is
        reset if another move is used.
    platinum:
      en: |-
        A Pokémon hold item that boosts a move
        used consecutively. Its effect is
        reset if another move is used.
    heartgold-soulsilver:
      en: |-
        A Pokémon held item that boosts a move
        used consecutively. Its effect is
        reset if another move is used.
    black-white:
      en: |-
        A Pokémon held item that boosts a move
        used consecutively. Its effect is
        reset if another move is used.
      fr: |-
        Objet à tenir boostant une capacité
        utilisée à répétition. L’effet s’annule
        si une autre capacité est utilisée.
    black-2-white-2:
      en: |-
        A Pokémon held item that boosts a move
        used consecutively. Its effect is
        reset if another move is used.
    x-y:
      ja-Hrkt: |-
        もたせると　おなじわざを　れんぞくで
        つかったとき　いりょくが　あがる。
        やめると　いりょくは　もどる。
      ja: |-
        持たせると　同じ技を　連続で
        使ったとき　威力が　あがる。
        やめると　威力は　もどる。
      ko: |-
        지니게 하면 똑같은 기술을 연속으로
        사용했을 때 위력이 올라간다.
        그만두면 위력이 되돌아간다.
      en: |-
        An item to be held by a Pokémon.
        It boosts moves used consecutively,
        but only until a different move is used.
      fr: |-
        Objet à tenir. Booste une capacité utilisée
        à répétition. L’effet s’annule si une autre
        capacité est utilisée.
      de: |-
        Ein Item zum Tragen. Verstärkt eine Attacke,
        je öfter sie in Folge ausgeführt wird.
      es: |-
        Mejora los PS de base, pero reduce la
        Velocidad en combate. Debe llevarla un
        Pokémon.
      it: |-
        Strumento da dare a un Pokémon.
        Potenzia una mossa usata più volte di seguito.
        Il potenziamento svanisce al cambio di mossa.
    sun-moon:
      ja-Hrkt: |-
        もたせると　おなじわざを　れんぞくで
        つかったとき　いりょくが　あがる。
        やめると　いりょくは　もどる。
      ja: |-
