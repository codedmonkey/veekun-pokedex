        사용했을 때 위력이 올라간다.
        그만두면 위력이 되돌아간다.
      zh-Hant: |-
        攜帶後，連續使出相同招式時，
        威力就會提高。停止時，
        威力就會復原。
      zh-Hans: |-
        携带后，连续使出相同招式时，
