safety-goggles:
  category: held-items
  cost: 4000
  effect:
    en: 'Held: Prevents damage from powder moves and the damage from Hail and Sandstorm.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        てんこうの　ダメージだけでなく
        こなを　だす　わざの
        こうかも　ふせげる　ゴーグル。
      ja: |-
        天候の　ダメージだけでなく
        粉を　だす　技の
        効果も　防げる　ゴーグル。
      ko: |-
        날씨로 인한 데미지뿐만 아니라
        가루를 내보내는 기술의
        효과도 막을 수 있는 고글.
      en: |-
        An item to be held by a Pokémon.
        These goggles protect the holder from
        both weather-related damage and powder.
      fr: |-
        Objet à tenir. Protège le Pokémon contre les
        dégâts dus à la météo et la plupart des
        capacités utilisant de la poudre.
      de: |-
        Diese Brille schützt ihren Träger nicht nur vor
        wetterbedingtem Schaden, sondern auch vor
        vielen Attacken, bei denen Puder eingesetzt wird.
      es: |-
        Una de las misteriosas Megapiedras. Permite
        megaevolucionar a Tyranitar en combate.
      it: |-
        Visiera che protegge dai danni legati alle
        condizioni atmosferiche e dalla maggior parte
        delle mosse che rilasciano polvere.
