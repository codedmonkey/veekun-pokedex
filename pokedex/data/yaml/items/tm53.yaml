    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        ようぶんを　すいとり　こうげきする。
        あいてに　あたえた　ダメージの
        はんぶんの　ＨＰを　かいふくできる。
      ja: |-
        養分を　吸い取り　攻撃する。
        相手に　与えた　ダメージの
        半分の　ＨＰを　回復できる。
      ko: |-
        양분을 흡수하여 공격한다.
        상대에게 입힌 데미지의
        절반에 해당하는 HP를 회복할 수 있다.
      zh-Hant: |-
        吸取對手的養分進行攻擊。
        可以回復給予對手
        傷害的一半HP。
      zh-Hans: |-
        吸取对手的养分进行攻击。
        可以回复给予对手
        伤害的一半HP。
      en: |-
        A nutrient-draining attack. The user’s HP is restored
        by half the damage taken by the target.
      fr: |-
        Une attaque qui convertit la moitié des dégâts
        infligés en PV pour le lanceur.
      de: 'Attacke, die die Hälfte des Schadens absorbiert.'
      es: |-
        Absorbe la mitad del daño producido en el objetivo 
        para restaurar los PS del usuario.
      it: |-
        Mossa che assorbe PS. Chi la usa recupera una
        quantità di PS pari alla metà del danno inferto.
    sword-shield:
      ja-Hrkt: |-
        どろの　かたまりを
        あいてに　なげつけて　こうげきする。
        どうじに　あいての　すばやさを　さげる。
      ja: |-
        泥の　塊を
        相手に　投げつけて　攻撃する。
        同時に　相手の　素早さを　さげる。
      ko: |-
        진흙 덩어리를
        상대에게 내던져서 공격한다.
        동시에 상대의 스피드를 떨어뜨린다.
      zh-Hant: |-
        向對手投擲
        泥塊進行攻擊。
        同時降低對手的速度。
      zh-Hans: |-
        向对手投掷
        泥块进行攻击。
        同时降低对手的速度。
      en: |-
        The user attacks by hurling a blob of mud at the
        target. This also lowers the target’s Speed stat.
      fr: |-
        Le lanceur attaque en projetant de la boue sur l’ennemi.
        Réduit aussi la Vitesse de la cible.
      de: |-
        Angriff mit Lehm, der den Initiative-Wert des Zieles
        senkt.
      es: 'El usuario lanza lodo al objetivo y reduce su Velocidad.'
      it: |-
        Chi la usa attacca lanciando fango sul bersaglio,
        riducendone anche la Velocità.
