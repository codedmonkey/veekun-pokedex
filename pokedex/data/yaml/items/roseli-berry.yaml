roseli-berry:
  category: type-protection
  cost: 80
  effect:
    en: 'Held: Consumed when struck by a super-effective Fairy-type attack to halve the damage.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        ポケモンに　もたせると
        こうかばつぐんの　フェアリー　わざを
        うけたとき　いりょくが　よわまる。
      ja: |-
        ポケモンに　持たせると
        効果バツグンの　フェアリー技を
        受けたとき　威力が　弱まる。
      ko: |-
        포켓몬에게 지니게 하면
        효과가 뛰어난 페어리 기술을
        당했을 때 위력이 약해진다.
      en: |-
        If held by a Pokémon, this Berry will
        lessen the damage taken from one
        supereffective Fairy-type attack.
      fr: |-
        Tenue, cette Baie affaiblit une attaque ennemie
        super efficace de type Fée.
      de: |-
        Als getragenes Item schwächt diese Beere
        sehr effektive Feen-Attacken von Angreifern.
      es: |-
        Estuche de aspecto sofisticado para llevar las
        lentes de contacto.
      it: |-
        Se data a un Pokémon, indebolisce l’attacco
        superefficace di tipo Folletto del nemico.
    sun-moon:
      ja-Hrkt: |-
        ポケモンに　もたせると
