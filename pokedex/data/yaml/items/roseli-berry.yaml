        당했을 때 위력이 약해진다.
      zh-Hant: |-
        讓寶可夢攜帶後，
        在受到效果絕佳的妖精屬性招式
        攻擊時，能使其威力減弱。
      zh-Hans: |-
        让宝可梦携带后，
        在受到效果绝佳的妖精属性招式
        攻击时，能令其威力减弱。
      en: |-
