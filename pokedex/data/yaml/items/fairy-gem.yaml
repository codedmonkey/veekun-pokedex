fairy-gem:
  category: jewels
  cost: 200
  effect:
    en: 'Held: When the holder uses a damaging Fairy move, the move has 1.5× power and this item is consumed.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        フェアリーの　タイプの　ジュエル。
        もたせると　いちどだけ　フェアリーの
        わざの　いりょくが　つよまる。
      ja: |-
        フェアリーの　タイプの　ジュエル。
        持たせると　１度だけ　フェアリーの
        技の　威力が　強まる。
      ko: |-
        페어리타입의 주얼.
        지니게 하면 한 번만 페어리
        기술의 위력이 강해진다.
      en: |-
        A gem with an essence of the fey.
        When held, it strengthens the power
        of a Fairy-type move one time.
      fr: |-
        Objet à tenir. Un joyau augmentant une fois
        la puissance des capacités de type Fée.
      de: |-
        Ein Juwel vom Typ Fee. Es erhöht einmalig
        die Stärke einer Attacke vom Typ Fee.
      es: ''
      it: |-
        Strumento da dare a un Pokémon.
        Gioiello che potenzia una sola volta le mosse
        di tipo Folletto.
