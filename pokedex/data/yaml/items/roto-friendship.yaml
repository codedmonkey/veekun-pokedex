  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        ロトムパワーの　ひとつ。
        つれている　ポケモンが
        かなり　なつきやすくなる。
      ja: |-
        ロトムパワーの　ひとつ。
        連れている　ポケモンが
        かなり　なつきやすくなる。
      ko: |-
        로토무파워 중 하나.
        데리고 있는 포켓몬과
        상당히 친밀해지기 쉬워진다.
      zh-Hant: |-
        洛托姆之力的一種。
        帶在身邊的寶可夢
        會變得非常容易親近。
      zh-Hans: |-
        洛托姆之力的一种。
        带在身边的宝可梦
        会变得非常容易亲近。
      en: |-
        One of the Rotom Powers.
        It helps Pokémon in your party grow
        friendly faster.
      fr: |-
        Une des Motism’Auras. Elle permet d’augmenter
        plus rapidement l’Amitié que vous portent les
        Pokémon de votre équipe.
      de: |-
        Diese Rotom-Kraft bewirkt, dass sich die im Team
        mitgeführten Pokémon viel schneller mit dir
        anfreunden.
      es: |-
        Poder Rotom que hace que el grado de amistad de
        los Pokémon de tu equipo aumente más rápido.
      it: |-
        Potere Rotom che fa sì che i Pokémon in squadra
        ti si affezionino molto più facilmente.
