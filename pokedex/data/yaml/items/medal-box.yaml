  flavor_text:
    black-2-white-2:
      en: |-
        A box-shaped machine
        that stores Medals and
        Medal information.
    x-y:
      ja-Hrkt: |-
        かくとくした　メダルを　しゅうのうし
        メダルについての　じょうほうを
        きろくする　はこがたの　きかい。
      ja: |-
        獲得した　メダルを　収納し
        メダルについての　情報を
        記録する　箱型の　機械。
      ko: |-
        획득한 메달을 수납하고
        메달에 대한 정보를
        기록하는 상자 모양의 기계.
      en: |-
        A box-shaped machine
        that stores Medals and
        Medal information.
      fr: |-
        Une boîte qui permet de ranger les Médailles et
        d’enregistrer des informations à leur sujet.
      de: |-
        Ein Gerät in Form einer Box, in der Medaillen
        aufbewahrt und Informationen dazu gespeichert
        werden.
      es: |-
        Un dulce a base de suave y esponjosa nata
        montada. A algunos Pokémon les encanta.
      it: |-
        Apparecchio rettangolare usato per custodire
        i Premi ottenuti e tutte le informazioni che li
        riguardano.
