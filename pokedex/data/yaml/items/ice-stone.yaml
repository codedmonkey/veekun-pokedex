ice-stone:
  category: evolution
  cost: 3000
  effect:
    en: |-
      Used on a party Pokémon
      :   Evolves an Alola []{pokemon:sandshrew} into Alola []{pokemon:sandslash} or an Alola []{pokemon:vulpix} into Alola []{pokemon:ninetales}.
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        ある　とくていの　ポケモンを
        しんかさせる　ふしぎな　いし。
        ゆきの　もようが　ある。
      ja: |-
        ある　特定の　ポケモンを
        進化させる　不思議な　石。
        雪の　模様が　ある。
      ko: |-
        어느 특정 포켓몬을
        진화시키는 이상한 돌.
        눈송이 무늬가 있다.
      zh-Hant: |-
        能讓特定寶可夢
        進化的神奇石頭。
        有著雪花般的花紋。
      zh-Hans: |-
        能让某些特定宝可梦
        进化的神奇石头。
        有着雪花般的花纹。
      en: |-
        A peculiar stone that can make certain species of
        Pokémon evolve. It has an unmistakable
        snowflake pattern.
      fr: |-
        Une pierre étrange qui fait évoluer certaines
        espèces de Pokémon. Un flocon de neige
        semble dessiné dessus.
      de: |-
        Dieser spezielle Stein löst bei bestimmten
        Pokémon die Entwicklung aus. Er hat ein
        Schneeflockenmuster.
      es: |-
        Una piedra peculiar que hace evolucionar a algunos
        Pokémon. Presenta motivos que recuerdan a los
        cristales de hielo.
      it: |-
        Pietra particolare che fa evolvere determinate
        specie di Pokémon. Si intravede l’immagine di
        un fiocco di neve.
