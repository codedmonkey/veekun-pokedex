        もたせた　ポケモンが　いちどでも
        せんとうに　かおを　だすと
        おかねが　２ばい　もらえる。
      ja: |-
        持たせた　ポケモンが　１度でも
        戦闘に　顔を　だすと
        お金が　２倍　もらえる。
      ko: |-
        지니게 한 포켓몬이
        한 번이라도 배틀에 나가면
        돈을 2배로 받을 수 있다.
      en: |-
        An item to be held by a Pokémon.
        It doubles any prize money received
        if the holding Pokémon joins a battle.
      fr: |-
