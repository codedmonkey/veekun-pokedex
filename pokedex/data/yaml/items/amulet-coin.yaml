amulet-coin:
  category: training
  cost: 10000
  effect:
    en: |-
      Held
      :   If the holder participated in a trainer battle, the trainer earns twice the usual prize money.  This effect applies even if the holder [fainted]{mechanic:fainted}.

          This effect does not stack with any other similar effect.
  flags:
    - holdable
    - holdable-active
  flavor_text:
    ruby-sapphire:
      en: |-
        Doubles money in
        battle if the holder
        takes part.
    emerald:
      en: |-
        Doubles money in
        battle if the
        holder takes part.
    firered-leafgreen:
      en: |-
        An item to be held by a POKéMON.
        It doubles the battle money if the
        holding POKéMON takes part.
    diamond-pearl:
      en: |-
        An item to be held by a Pokémon.
        It doubles a battle’s prize money if
        the holding Pokémon joins in.
    platinum:
      en: |-
        An item to be held by a Pokémon.
        It doubles a battle’s prize money if
