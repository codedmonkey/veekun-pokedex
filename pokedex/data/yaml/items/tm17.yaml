      de: |-
        Erzeugt eine Lichtwand und senkt den Schaden durch
        Spezial-Attacken für fünf Runden.
      es: |-
        Pared de luz que reduce durante cinco turnos el daño
        producido por los ataques especiales.
      it: |-
        Innalza una barriera misteriosa che riduce i danni degli
        attacchi speciali per sé e gli alleati per cinque turni.
