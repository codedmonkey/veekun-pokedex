    emerald:
      en: |-
        An elevator key
        used in TEAM
        ROCKET’s HIDEOUT.
    firered-leafgreen:
      en: |-
        A key that operates the elevator
        in TEAM ROCKET’s HIDEOUT.
        It bears the TEAM ROCKET logo.
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        ロケットだん　アジトに　ある
        エレベータを　うごかす　カギ。
        ロケットだんの　マークいり。
      ja: |-
        ロケット団　アジトに　ある
        エレベータを　動かす　カギ。
        ロケット団の　マーク入り。
      ko: |-
        로켓단아지트에 있는
