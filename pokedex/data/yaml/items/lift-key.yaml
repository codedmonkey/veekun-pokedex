        로켓단의 마크가 새겨져 있다.
      zh-Hant: |-
        能啟動火箭隊基地
        電梯的鑰匙。
        上面有火箭隊的標誌。
      zh-Hans: |-
        带有火箭队标志的钥匙。
        能启动位于火箭队基地的电梯。
      en: |-
        A key that operates the elevator in the Team Rocket
        Hideout. It bears the Team Rocket logo.
      fr: |-
        Une clé activant l’ascenseur du Repaire de la Team
        Rocket. Elle porte la marque de l’organisation.
      de: |-
        Ein Schlüssel, mit dessen Hilfe der Aufzug im
        Rocket-Versteck in Gang gesetzt werden kann.
        Das Logo von Team Rocket ist darauf abgebildet.
      es: |-
        Llave que permite acceder al ascensor de la Guarida
        del Team Rocket. Lleva grabado el símbolo del
        Team Rocket.
      it: |-
        Chiave per l’ascensore nel Rifugio del Team Rocket.
        Presenta il logo del Team Rocket.
