gold-teeth:
  category: plot-advancement
  cost: 0
  effect:
    en: "The Safari Zone warden's teeth, to be returned to him for []{item:hm04}."
  flags: {  }
  flavor_text:
    emerald:
      en: |-
        Gold dentures lost
        by the SAFARI
        ZONE’s WARDEN.
    firered-leafgreen:
      en: |-
        A set of false teeth lost by the
        SAFARI ZONE’S WARDEN. It makes his
        smile sparkle.
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        サファリゾーンの　えんちょうが
        おとした　きんいろの　いれば。
        わらうと　とても　まぶしい。
      ja: |-
        サファリゾーンの　園長が
        落とした　金色の　入れ歯。
        笑うと　とても　まぶしい。
      ko: |-
        사파리존의 원장이
        떨어뜨린 금색 틀니.
        웃으면 매우 눈부시다.
      zh-Hant: |-
        狩獵地帶的園長
        遺失的金色假牙。
        裝上它之後笑起來非常耀眼。
      zh-Hans: |-
        狩猎地带的园长遗失的金假牙。
        装上它后，笑起来十分耀眼。
      en: |-
        A set of golden false teeth lost by the Safari Zone’s
        warden. They make his smile sparkle.
      fr: |-
        Un dentier en or perdu par le directeur du Parc Safari.
        Il lui donne un sourire étincelant.
      de: |-
        Ein vergoldeter Zahnersatz, den der Direktor der
        Safari-Zone verlegt hat. Setzt er ihn ein, verleiht
        er ihm buchstäblich ein goldiges Lächeln.
      es: |-
        Unos dientes de oro que perdió el Guarda de la Zona
        Safari con los que tiene una sonrisa deslumbrante.
      it: |-
        Dentiera dorata persa dal guardiano della Zona Safari.
        Rende il suo sorriso davvero scintillante.
