bug-gem:
  category: jewels
  cost: 200
  effect:
    en: |-
      Held
      :   When the holder uses a damaging []{type:bug}-type move, the move has 1.5× power and this item is consumed.
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        A gem with an insect-like essence.
        When held, it strengthens the power of
        a Bug-type move only once.
      fr: |-
        Objet à tenir. Joyau augmentant
        une fois la puissance des capacités
        de type Insecte.
    black-2-white-2:
      en: |-
        A gem with an insect-like essence.
        When held, it strengthens the power of
        a Bug-type move only once.
    x-y:
