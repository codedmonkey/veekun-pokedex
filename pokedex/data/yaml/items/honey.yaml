honey:
  category: dex-completion
  cost: 900
  effect:
    en: |-
      Used outside of battle
      :   Immediately triggers a wild Pokémon battle, as long as the trainer is somewhere with wild Pokémon—i.e., in tall grass, in a cave, or surfing.

      Can be smeared on sweet-smelling trees to attract tree-dwelling Pokémon after six hours.
  flags: {  }
  flavor_text:
    diamond-pearl:
      en: |-
        A sweet honey with a lush aroma that
        attracts wild Pokémon when it is used
        in grass, caves, or on special trees.
    platinum:
      en: |-
        A sweet honey with a lush aroma that
        attracts wild Pokémon when it is used
        in grass, caves, or on special trees.
    heartgold-soulsilver:
      en: |-
        A sweet honey with a lush aroma that
        attracts wild Pokémon when it is used
        in grass, caves, or on special trees.
    black-white:
      en: |-
        A sweet honey with a lush aroma that
        attracts wild Pokémon when it is used
        in grass, caves, or on special trees.
      fr: |-
        Un miel au parfum riche qui, utilisé dans
        l’herbe, une grotte ou sur des arbres
        spéciaux, attire les Pokémon sauvages.
    black-2-white-2:
      en: |-
        A sweet honey with a lush aroma that
        attracts wild Pokémon when it is used
        in grass, caves, or on special trees.
    x-y:
      ja-Hrkt: |-
        くさむらや　どうくつ　などで
        つかうと　あまいにおいに　さそわれて
        やせいポケモンが　あらわれる。
      ja: |-
        草むらや　洞窟などで
        使うと　あまいにおいに　誘われて
        野生ポケモンが　あらわれる。
      ko: |-
        풀밭이나 동굴 등에서 사용하면
        달콤한 냄새에 이끌려서
        야생 포켓몬이 나타난다.
      en: |-
        A sweet honey with a lush aroma that
        attracts wild Pokémon when it is used
        in tall grass, in caves, or on special trees.
      fr: |-
        Un miel au parfum riche qui, utilisé dans l’herbe,
        une grotte ou sur des arbres spéciaux, attire les
        Pokémon sauvages.
      de: |-
        Der Duft dieses Honigs lockt wilde Pokémon an.
        Verwende ihn in hohem Gras, Höhlen oder an
        besonderen Bäumen.
      es: |-
        Su delicioso aroma atrae a Pokémon salvajes si
        se usa en zonas de hierba alta, cuevas o árboles
        especiales.
      it: |-
        Miele dolce dall’aroma intenso che attrae
        i Pokémon selvatici. Si può usare nelle grotte,
        nell’erba o su alberi speciali.
