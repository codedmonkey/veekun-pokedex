        可以在商店低價出售。
      zh-Hans: |-
        宝可梦采集的清甜芬芳的花蜜。
        可在商店里廉价出售。
      en: |-
        A sweet honey collected by Pokémon. It has a lush
        aroma and can be sold at a low price to shops.
      fr: |-
        Du miel au parfum riche rassemblé par des Pokémon.
        Peut être vendu à bas prix en magasin.
      de: |-
        Süß duftender Honig, den Pokémon gesammelt haben.
        Er ist von geringem Wert.
      es: |-
        Miel de dulce aroma recolectada por los Pokémon, que
        no alcanza un buen precio en las tiendas.
      it: |-
        Miele dal dolce aroma, frutto dell’attività di determinati
        Pokémon. Si può vendere a un prezzo piuttosto basso
        nei negozi.
