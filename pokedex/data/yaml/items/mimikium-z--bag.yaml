  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        ミミッキュの　じゃれつくを
        Ｚワザに　グレードアップする
        Ｚパワーの　けっしょうを　つくりだす。
      ja: |-
        ミミッキュの　じゃれつくを
        Ｚワザに　グレードアップする
        Ｚパワーの　結晶を　つくりだす。
      ko: |-
        따라큐의 치근거리기를
        Z기술로 업그레이드하는
        Z파워의 결정을 만들어 낸다.
      zh-Hant: |-
        可用來製造將
        謎擬Ｑ的嬉鬧
        升級為Ｚ招式的Ｚ力量結晶。
      zh-Hans: |-
        可用它来制造用于对战
        并能将谜拟Ｑ的嬉闹
        升级成Ｚ招式的Ｚ力量结晶。
      en: |-
        It converts Z-Power into crystals that upgrade
        Mimikyu’s Play Rough to an exclusive Z-Move.
      fr: |-
        Permet de concentrer la Force Z en un cristal,
        qui autorise le Mimiqui qui le tient à transformer
        sa capacité Câlinerie en capacité Z.
      de: |-
        Kristallisierte Z-Kraft, die Mimigmas Attacke
        Knuddler zu einer Z-Attacke aufstuft.
        Wird bei Bedarf automatisch vervielfacht.
      es: |-
        Concentra el Poder Z en cristales que permiten a
        Mimikyu convertir su Carantoña en un movimiento Z.
      it: |-
        Permette di creare cristalli carichi di Potere Z che
        consentono a Mimikyu di trasformare la mossa
        Carineria in una mossa Z.
