        이상한 힘의 보호를 받아
        상태 이상이 되지 않는다.
      zh-Hant: |-
        在５回合內
        被神奇的力量守護，
        不會陷入異常狀態。
      zh-Hans: |-
        在５回合内
        被神奇的力量守护，
        从而不会陷入异常状态。
      en: |-
