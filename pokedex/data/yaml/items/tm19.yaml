        かたい　しっぽで　あいてを　たたきつけて
        こうげきする。　あいての　ぼうぎょを
        さげることが　ある。
      ja: |-
        硬い　しっぽで
        相手を　たたきつけて　攻撃する。
        相手の　防御を　さげることが　ある。
      ko: |-
        단단한 꼬리로
        상대를 힘껏 쳐서 공격한다.
        상대의 방어를 떨어뜨릴 때가 있다.
