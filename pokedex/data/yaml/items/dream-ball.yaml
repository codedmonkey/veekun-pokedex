dream-ball:
  category: special-balls
  cost: 0
  effect:
    en: |-
      Can only be used in Entree Forest, to catch Pokémon encountered in the Dream World.

      Used in battle
      :   [Catches]{mechanic:catch} a wild Pokémon without fail.
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        A special Poké Ball that appears out of
        nowhere in a bag at the Entree Forest.
        It can catch any Pokémon.
      fr: |-
        Poké Ball du rêve. Apparue dans le
        Sac à la Forêt du Heylink. Permet
        d’attraper n’importe quel Pokémon.
    black-2-white-2:
      en: |-
        A special Poké Ball that appears out of
        nowhere in a bag at the Entree Forest.
        It can catch any Pokémon.
    x-y:
      ja-Hrkt: |-
        ハイリンクのもりで　いつのまにか
        バッグに　あらわれる　ゆめのボール。
        どんな　ポケモンも　つかまえられる。
      ja: |-
        ハイリンクの森で　いつのまにか
        バッグに　現れる　夢のボール。
        どんな　ポケモンも　捕まえられる。
      ko: |-
        하일링크의 숲에서 어느 사이엔지
        가방 속에 나타나는 꿈의 볼.
        어떤 포켓몬이라도 잡을 수 있다.
      en: |-
        A special Poké Ball that appears in your
        Bag out of nowhere in the Entree Forest.
        It can catch any Pokémon.
      fr: |-
        Une Poké Ball du rêve.
        Apparue dans le Sac à la Forêt du Heylink.
        Permet d’attraper n’importe quel Pokémon.
      de: |-
        Ein Ball wie aus einem Traum, der im
        Kontaktebenenhain plötzlich im Beutel
        auftaucht. Fängt jedes Pokémon.
      es: |-
        Aumenta ligeramente la Defensa Especial en
        combate. Al cambiar de Pokémon, el efecto
        desaparece.
      it: |-
        Poké Ball onirica. Appare all’improvviso nella
        Borsa quando si è nel Bosco Intramondo.
        Può acchiappare qualsiasi Pokémon.
