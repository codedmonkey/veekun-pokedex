      ja-Hrkt: |-
        ねむり　じょうたいの
        ポケモンが　つかまえやすくなる
        ちょっと　かわった　ボール。
      ja: |-
        ねむり　状態の
        ポケモンが　捕まえやすくなる
        ちょっと　変わった　ボール。
      ko: |-
        잠듦 상태의
        포켓몬을 잡기 쉬운
        조금 특이한 볼.
      zh-Hant: |-
        有點與眾不同的球。
        能更容易地捉到
        睡眠狀態的寶可夢。
      zh-Hans: |-
        有点与众不同的球。
        能很容易地捕捉
        睡眠状态的宝可梦。
      en: |-
        A somewhat different Poké Ball that makes it easier to
        catch wild Pokémon while they’re asleep.
      fr: |-
        Une Poké Ball un peu spéciale qui fonctionne
        particulièrement bien sur les Pokémon endormis.
      de: |-
        Ein Ball, mit dem sich schlafende Pokémon leichter
        fangen lassen.
      es: |-
        Es algo distinta a las demás. Funciona especialmente
        bien con los Pokémon dormidos.
      it: |-
        Poké Ball speciale che funziona particolarmente
        bene con i Pokémon addormentati.
  fling_effect: ~
  fling_power: ~
  game_index:
    generation-v: 576
