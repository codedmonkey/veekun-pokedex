        Powerful, but makes
        the user flinch if
        hit by the foe.
    firered-leafgreen:
      en: |-
        An attack that is
        executed last.
        The user flinches
        if hit beforehand.
    diamond-pearl:
      en: |-
        The user focuses its mind before
        launching this attack. It will fail if
        the user is hit before it is used.
    platinum:
      en: |-
        The user focuses its mind before
        launching this attack. It will fail if
        the user is hit before it is used.
    heartgold-soulsilver:
      en: |-
        The user focuses its mind before
        launching this attack. It will fail if
        the user is hit before it is used.
    black-white:
      en: |-
        The user sharpens its claws to
        boost its Attack stat and accuracy.
      fr: |-
        Le lanceur s’aiguise les griffes.
        Augmente l’Attaque et la Précision.
    black-2-white-2:
      en: |-
        The user sharpens its claws to
        boost its Attack stat and accuracy.
    x-y:
      ja-Hrkt: |-
        つめを　みがいて　するどく　する。
        じぶんの　こうげきと
        めいちゅうりつを　あげる。
      ja: |-
        つめを　磨いて　鋭く　する。
        自分の　攻撃と
        命中率を　あげる。
      ko: |-
        손톱을 갈아 날카롭게 만든다.
        자신의 공격과
        명중률을 올린다.
      en: |-
        The user sharpens its claws to
        boost its Attack stat and accuracy.
      fr: |-
        Le lanceur s’aiguise les griffes.
        Augmente l’Attaque et la Précision.
      de: |-
        Der Anwender wetzt seine Klauen, um sie zu
        schärfen. Angriff und Genauigkeit werden erhöht.
      es: |-
        Quien lo usa invoca una fuerte lluvia que dura
        cinco turnos y fortalece los movimientos de tipo
        Agua.
      it: |-
        Chi la usa affila i propri artigli, aumentando
        Attacco e precisione.
    sun-moon:
      ja-Hrkt: |
        じぶんを　ふるいたてて
        こうげきと　とくこうを　あげる。
      ja: |
        自分を　奮いたてて
        攻撃と　特攻を　あげる。
      ko: |-
        스스로 분발해서
        공격과 특수공격을 올린다.
      zh-Hant: |-
        激勵自己，
        進而提高攻擊和特攻。
      zh-Hans: |-
        激励自己，
        从而提高攻击和特攻。
      en: |-
        The user is roused, and its Attack and Sp. Atk
        stats increase.
      fr: |-
        Le lanceur se rengorge.
        Augmente l’Attaque et l’Attaque Spéciale.
      de: |-
        Anwender erhält einen Kraftschub, der seinen
        Angriff und Spezial-Angriff erhöht.
      es: |-
        Lima y afila las garras. Aumenta el Ataque y la
        Precisión.
      it: |-
        Chi la usa si tira su di morale, aumentando
        il proprio Attacco e l’Attacco Speciale.
    ultra-sun-ultra-moon:
      ja-Hrkt: |
        じぶんを　ふるいたてて
        こうげきと　とくこうを　あげる。
      ja: |
        自分を　奮いたてて
        攻撃と　特攻を　あげる。
      ko: |-
        스스로 분발해서
        공격과 특수공격을 올린다.
      zh-Hant: |-
        激勵自己，
        進而提高攻擊和特攻。
      zh-Hans: |-
        激励自己，
        从而提高攻击和特攻。
      en: |-
        The user is roused, and its Attack and Sp. Atk
        stats increase.
      fr: |-
        Le lanceur se rengorge.
        Augmente l’Attaque et l’Attaque Spéciale.
      de: |-
        Anwender erhält einen Kraftschub, der seinen
        Angriff und Spezial-Angriff erhöht.
      es: |-
        Quien lo usa se concentra y potencia su Ataque
        y su Ataque Especial.
      it: |-
        Chi la usa si tira su di morale, aumentando
        il proprio Attacco e l’Attacco Speciale.
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        あたまを　つきだして
        まっすぐ　つっこんで　こうげきする。
        あいてを　ひるませる　ことが　ある。
      ja: |-
        頭を　突きだして
        まっすぐ　つっこんで　攻撃する。
        相手を　ひるませることが　ある。
      ko: |-
        머리를 내밀어
        곧장 돌진하여 공격한다.
        상대를 풀죽게 만들 때가 있다.
      zh-Hant: |-
        將頭伸出，
        直直衝向對手進行攻擊。
        有時會讓對手畏縮。
      zh-Hans: |-
        将头伸出，
        笔直地扑向对手进行攻击。
        有时会使对手畏缩。
      en: |-
        The user sticks out its head and attacks by charging
        straight into the target. This may also make the
        target flinch.
      fr: |-
        Le lanceur donne un coup de tête.
        Peut apeurer l’ennemi.
      de: |-
        Rammt das Ziel mit einer Kopfnuss. Ziel schreckt
        eventuell zurück.
      es: |-
        Lanza un potente cabezazo que puede hacer 
        retroceder al objetivo.
      it: |-
        Chi la usa si lancia diritto di testa contro
        il bersaglio. Può anche farlo tentennare.
    sword-shield:
      ja-Hrkt: |-
        ものすごい　ちからを　こめた　キックで
        あいてを　けとばして　こうげきする。
      ja: |-
        ものすごい　力を　こめた　キックで
        相手を　けとばして　攻撃する。
      ko: |-
        굉장한 힘을 담은 킥으로
        상대를 걷어차서 공격한다.
      zh-Hant: |-
        用灌注了巨大力量的重踢
        踢飛對手進行攻擊。
      zh-Hans: |-
        使出力大无穷的重踢
        踢飞对手进行攻击。
      en: |-
        The target is attacked by a kick launched with
        muscle-packed power.
      fr: 'Un coup de pied surpuissant qui frappe l’ennemi.'
      de: |-
        Das Ziel wird mit einem extrem heftigen Tritt
        angegriffen.
      es: 'Patada de extrema fuerza.'
      it: |-
        Colpisce il bersaglio con un calcio sferrato
        con la forza di muscoli poderosi.
