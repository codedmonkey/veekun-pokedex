eviolite:
  category: held-items
  cost: 4000
  effect:
    en: |-
      Held by a Pokémon that is not fully evolved
      :   Holder has 1.5× [Defense]{mechanic:defense} and [Special Defense]{mechanic:special-defense}.
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        A mysterious evolutionary lump. When
        held, it raises the Defense and Sp. Def
        of a Pokémon that can still evolve.
      fr: |-
        Un étrange concentré d’évolution qui
        augmente la Défense et la Déf. Spé.
        d’un Pokémon pouvant évoluer.
    black-2-white-2:
      en: |-
        A mysterious evolutionary lump. When
        held, it raises the Defense and Sp. Def
        of a Pokémon that can still evolve.
    x-y:
      ja-Hrkt: |-
        しんかの　ふしぎな　かたまり。
        もたせると　しんかまえ　ポケモンの
        ぼうぎょと　とくぼうが　あがる。
      ja: |-
        進化の　不思議な　かたまり。
        持たせると　進化前　ポケモンの
        防御と　特防が　あがる。
      ko: |-
        진화의 이상한 덩어리.
        지니게 하면 진화 전 포켓몬의
        방어와 특수방어가 올라간다.
      en: |-
        A mysterious Evolutionary lump. When
        held by a Pokémon that can still evolve,
        it raises both Defense and Sp. Def.
      fr: |-
        Un étrange concentré d’évolution qui augmente
        la Défense et la Défense Spéciale d’un Pokémon
        pouvant évoluer.
      de: |-
        Ein mysteriöser Klumpen, der die Verteidigung
        und Spezial-Verteidigung von Pokémon erhöht,
        die sich noch entwickeln können.
      es: |-
        Joya de un solo uso que potencia los
        movimientos de tipo Psíquico. Debe llevarla
        un Pokémon.
      it: |-
        Misteriosa sfera evolutiva. Aumenta la Difesa
        e la Difesa Speciale di un Pokémon che può
        ancora evolversi.
