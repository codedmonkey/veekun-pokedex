    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        ポケモンに　あたえると
        すこし　つかまえ　やすくなる　きのみ。
      ja: |-
        ポケモンに　あたえると
        少し　捕まえ　やすくなる　きのみ。
      ko: |-
        포켓몬에게 주면
        조금 잡기 쉬워지는 나무열매.
      zh-Hant: |-
        把這個樹果餵給寶可夢，
        就能讓牠們變得比較容易捕捉。
      zh-Hans: |-
        把这树果交给宝可梦后，
        宝可梦就会变得
        稍微容易捕捉一点。
      en: |-
        A Berry that makes it slightly easier to catch Pokémon
        when given to them.
      fr: |-
        Une Baie à donner à un Pokémon sauvage pour pouvoir
        l’attraper un peu plus facilement.
      de: |-
        Gibst du diese Beere einem Pokémon zu essen,
        lässt es sich ein bisschen leichter fangen.
      es: |-
        Una baya que puedes lanzar a un Pokémon salvaje
        para que resulte un poco más fácil capturarlo.
      it: |-
        Bacca che facilita un po’ la cattura del Pokémon
        selvatico a cui viene data.
    sword-shield:
      ja-Hrkt: |-
