razz-berry:
  category: baking-only
  cost: 200
  effect:
    en: 'No effect; only useful for planting and cooking.'
  flags: {  }
  flavor_text:
    ruby-sapphire:
      en: |-
        POKéBLOCK ingredient.
        Plant in loamy soil
        to grow RAZZ.
    emerald:
      en: |-
        POKéBLOCK ingredient.
        Plant in loamy soil
        to grow RAZZ.
    firered-leafgreen:
      en: |-
        Can be ground up into a powder as
        an ingredient for medicine.
    diamond-pearl:
      en: |-
        A Poffin ingredient.
        Bury it in soft soil to grow a
        Razz Plant.
    platinum:
      en: |-
        A Poffin ingredient.
        Bury it in soft soil to grow a
        Razz Plant.
    heartgold-soulsilver:
      en: |-
        In the Sinnoh region, they like to make
        sweets known as Poffins with this Berry
        and feed them to their Pokémon.
    black-white:
      en: |-
        A Berry which is very rare in the
        Unova region.
        A maniac will buy it for a high price.
      fr: |-
        Baie très rare à Unys.
        Les amateurs en donnent un bon prix.
    black-2-white-2:
      en: |-
        A Berry which is very rare in the
        Unova region.
        A maniac will buy it for a high price.
    x-y:
      ja-Hrkt: |-
        イッシュちほうでは　とても
        めずらしい　きのみ。
      ja: |-
        イッシュ地方では　とても
        珍しい　きのみ。
      ko: |-
        하나지방에서는 매우
        희귀한 나무열매.
      en: |-
        A Berry to be used in cooking.
        This Berry is very rare and hard
        to obtain in the Unova region.
      fr: 'Une Baie très rare à Unys.'
      de: |-
        Eine Beerensorte, die in der Einall-Region
        ganz besonders selten ist.
      es: 'Una baya muy rara en la región de Teselia.'
      it: 'Bacca molto rara a Unima.'
    sun-moon:
      ja-Hrkt: |-
        かっこよさに　みがきを　かける　ための
        ポロックを　つくるとき　つかわれる。
        あかいろの　みは　たべると　からい。
      ja: |-
        かっこよさに　磨きを　かける　ための
        ポロックを　つくるとき　使われる。
        赤色の実は　食べると　辛い。
      ko: |-
        근사함을 연마하기 위한
        포켓몬스넥을 만들 때 사용된다.
        빨간색 열매는 먹으면 맵다.
      zh-Hant: |-
        製作用於增進帥氣的
        寶可方塊時使用。
        紅色的果實嘗起來是辣的。
      zh-Hans: |-
        用于制作宝可方块，
        制作出来的宝可方块可用来打磨帅气。
        红色的果实尝起来是辣的。
      en: |-
        Used to make Pokéblocks that will enhance your
        Coolness. Its red flesh is spicy when eaten.
      fr: |-
        Une Baie orange au goût épicé, utilisée pour
        préparer des Pokéblocs permettant d’augmenter
        le Sang-froid d’un Pokémon.
      de: |-
        Eine Beerensorte, die als Zutat für Pokériegel
        verwendet wird, welche die Coolness erhöhen.
        Ihr rötliches Fruchtfleisch schmeckt scharf.
      es: |-
        Se utiliza en la producción de Pokécubos que
        potencian el carisma. Es de color rojizo y sabor
        picante.
      it: |-
        Bacca arancione dal sapore piccante usata
        per creare Pokémelle che aumentano la Classe
        del Pokémon.
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        かっこよさに　みがきを　かける　ための
        ポロックを　つくるとき　つかわれる。
        あかいろの　みは　たべると　からい。
      ja: |-
