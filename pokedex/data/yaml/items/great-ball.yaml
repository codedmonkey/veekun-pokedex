great-ball:
  category: standard-balls
  cost: 600
  effect:
    en: |-
      Used in battle
      :   Attempts to [catch]{mechanic:catch} a wild Pokémon, using a catch rate of 1.5×.

          If used in a trainer battle, nothing happens and the ball is lost.
  flags:
    - countable
    - consumable
    - usable-in-battle
    - holdable
