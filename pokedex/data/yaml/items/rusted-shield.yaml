  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        おおむかしの　えいゆうが　さいやくを
        うちはらったと　つたえられる　たて　だが
        いまは　さびて　ボロボロに　なっている。
      ja: |-
        大昔の　英雄が　災厄を
        討ち払ったと　伝えられる　盾　だが
        いまは　さびて　ボロボロに　なっている。
      ko: |-
        먼 옛날의 영웅이 재앙을 막는 데
        사용했다고 전해지는 방패지만
        지금은 녹이 슬고 닳아버렸다.
      zh-Hant: |-
        據說在很久以前，英雄就是
        用這面盾來擊退災厄。
        但現在已經生鏽，變得破爛不堪。
      zh-Hans: |-
        据说很久以前，英雄就是
        拿着这面盾驱走了灾厄。
        而现在早已变得锈迹斑斑。
      en: |-
        It is said that a hero used this shield to halt a terrible
        disaster in ancient times. But it’s grown rusty and worn.
      fr: |-
        On raconte que ce bouclier fut jadis utilisé
        par un héros pour vaincre une calamité.
        À présent, il est tout usé et rouillé.
      de: |-
        Mit diesem Schild soll ein Held einstmals großes Unheil
        abgewendet haben. Rost sowie der Zahn der Zeit haben
        jedoch ihre Spuren hinterlassen.
      es: |-
        Cuenta una antigua leyenda que un valiente héroe
        asió este escudo para hacer frente a un cataclismo,
        pero ahora está oxidado y en un estado lamentable.
      it: |-
        Si racconta che in passato un eroe riuscì a respingere
        la calamità servendosi di questo scudo. Ora è tutto
        arrugginito e rovinato.
