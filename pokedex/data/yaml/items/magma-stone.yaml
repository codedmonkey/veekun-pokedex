        A stone formed when boulders melted in
        intensely hot magma, then hardened.
        Magma remains sealed inside.
      fr: |-
        Pierre formée à partir de roche en
        fusion solidifiée. Elle contient du
        magma.
    black-2-white-2:
      en: |-
        A stone formed when boulders melted in
        intensely hot magma, then hardened.
        Magma remains sealed inside.
    x-y:
      ja-Hrkt: |-
        しゃくねつの　マグマの　ねつでとけた
        がんせきが　かたまって　できたもの。
        なかに　マグマが　のこっている。
      ja: |-
        しゃくねつの　マグマの　熱でとけた
        岩石が　固まって　できたもの。
        中に　マグマが　残っている。
      ko: |-
        이글거리는 마그마의 열로 녹은
        암석이 굳어져 생긴 것.
        안에는 마그마가 남아 있다.
      en: |-
        A stone formed by boulders melting in
        intensely hot magma, then hardening.
        Magma remains sealed inside it.
      fr: |-
        Une pierre formée à partir de roche en fusion
        solidifiée. Elle contient du magma.
      de: |-
        Ein Stein aus gehärtetem Magma.
        Sein Kern ist noch flüssig und heiß.
      es: |-
        Objeto que contiene agua y se usa para regar las
        bayas del Plantabayas.
      it: |-
        Pietra che si è formata a seguito di un’intensa
        colata lavica. Il magma è rimasto intrappolato
        al suo interno.
