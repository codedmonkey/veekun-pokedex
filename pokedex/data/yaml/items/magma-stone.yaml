magma-stone:
  category: plot-advancement
  cost: 0
  effect:
    en: |-
      Causes Heatran to appear at Reversal Mountain.

      Unused prior to Black and White 2.
  flags: {  }
  flavor_text:
    diamond-pearl:
      en: |-
        A stone formed when boulders melted in
        intensely hot magma, then hardened.
        Magma remains sealed inside.
    platinum:
      en: |-
        A stone formed when boulders melted in
        intensely hot magma, then hardened.
        Magma remains sealed inside.
