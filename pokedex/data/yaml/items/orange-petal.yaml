  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        マツリカのしれんで　イリマから
        もらえる　はなびらの　おしばな。
        ７しゅるい　あつめるのが　もくてき。
      ja: |-
        マツリカの試練で　イリマから
        もらえる　はなびらの　押し花。
        ７種類　集めるのが　目的。
      ko: |-
        말리화의 시련에서 일리마에게
        받을 수 있는 꽃잎의 압화.
        7종류 모으는 것이 목적.
      zh-Hant: |-
        在茉莉的考驗中，
        從伊利馬那裡得到的壓花花瓣。
        目標是集滿７種花瓣。
      zh-Hans: |-
        在茉莉的考验中，
        能从伊利马那里得到的干花花瓣。
        目标是集齐７种。
      en: |-
        A pressed flower petal you receive from Ilima
        during Mina’s trial. The goal is to collect seven
        different kinds of petals.
      fr: |-
        Un pétale pressé qu’Althéo vous a remis lors de
        l’Épreuve d’Oléa. Il y en a sept à collectionner.
      de: |-
        Ein gepresstes Blütenblatt, das man im Rahmen von
        Matsurikas Prüfung von Elima erhält. Ziel ist es,
        sieben verschiedene Blütenblätter zu sammeln.
      es: |-
        Pétalo prensado recibido de manos de Liam durante
        la prueba de Rika. El objetivo es reunir siete
        distintos.
      it: |-
        Petalo di fiore pressato ottenuto da Liam durante
        la prova di Rika. L’obiettivo è ricevere sette petali
        diversi.
