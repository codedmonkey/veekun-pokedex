  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        ソルガレオか　ルナアーラと
        がったいした　ネクロズマを
        あらたな　すがたにする　けっしょう。
      ja: |-
        ソルガレオか　ルナアーラと
        合体した　ネクロズマを
        新たな　姿にする　結晶。
      ko: |-
        솔가레오나 루나아라와
        합체한 네크로즈마를
        새로운 모습으로 만드는 결정.
      zh-Hant: |-
        可讓和索爾迦雷歐或露奈雅拉
        合體後的奈克洛茲瑪
        展現出全新樣子的結晶。
      zh-Hans: |-
        能让和索尔迦雷欧或
        露奈雅拉合体的奈克洛兹玛
        变成崭新样子的结晶。
      en: |-
        It’s a crystal that turns Necrozma fused with
        Solgaleo or Lunala into a new form.
      fr: |-
        Un cristal permettant de donner une nouvelle forme
        à Necrozma quand il a fusionné avec Solgaleo ou
        Lunala.
      de: |-
        Kristallisierte Z-Kraft, die bei Necrozma nach der
        Fusion mit Solgaleo oder Lunala bewirkt, dass es
        eine neue Form annimmt.
      es: |-
        Cristal que permite a Necrozma, una vez fusionado
        con Solgaleo o Lunala, adoptar una nueva forma.
      it: |-
        Cristallo che permette a Necrozma di assumere una
        nuova forma quando è fuso con Lunala o Solgaleo.
