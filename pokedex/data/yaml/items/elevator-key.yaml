elevator-key:
  category: plot-advancement
  cost: 0
  effect:
    en: 'Unlocks the elevator in Lysandre Labs.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        フラダリラボに　ある
        エレベータを　うごかす　カードキー。
        フレアだんの マークいり。
      ja: |-
        フラダリラボに　ある
        エレベータを　動かす　カードキー。
        フレア団の マークいり。
      ko: |-
        플라드리 래버러토리에 있는
        엘리베이터를 작동시키는 카드키.
        플레어단의 마크가 새겨져 있다.
      en: |-
        A card key that activates the elevator
        in Lysandre Labs.
        It is emblazoned with Team Flare’s logo.
      fr: |-
        Un passe de sécurité permettant d’accéder à
        l’ascenseur des Laboratoires Lysandre.
        Il est décoré du logo de la Team Flare.
      de: |-
        Eine Schlüsselkarte mit dem Logo von
        Team Flare. Sie aktiviert den Fahrstuhl
        im Labor von Flordelis.
      es: ''
      it: |-
        Tessera magnetica con il simbolo del Team Flare
        che attiva l’ascensore dei Laboratori Elisio.
