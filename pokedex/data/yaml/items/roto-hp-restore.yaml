  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        ロトムパワーの　ひとつ。
        たたかっている　じぶんの　ポケモンの
        ＨＰが　すべて　かいふくする。
      ja: |-
        ロトムパワーの　ひとつ。
        戦っている　自分の　ポケモンの
        ＨＰが　すべて　回復する。
      ko: |-
        로토무파워 중 하나.
        싸우고 있는 자신의 포켓몬의
        HP가 모두 회복한다.
      zh-Hant: |-
        洛托姆之力的一種。
        可以回復戰鬥中的
        我方寶可夢所有的ＨＰ。
      zh-Hans: |-
        洛托姆之力的一种。
        正在战斗的我方宝可梦的
        ＨＰ会全部回复。
      en: |-
        One of the Rotom Powers.
        It fully restores the HP of your battling Pokémon.
      fr: |-
        Une des Motism’Auras. Elle permet à vos Pokémon
        en combat de récupérer la totalité de leurs PV.
      de: |-
        Diese Rotom-Kraft bewirkt, dass im Kampf die KP
        der eigenen Pokémon auf der Mitstreiterseite
        vollständig wiederaufgefüllt werden.
      es: |-
        Poder Rotom que restaura todos los PS de los
        Pokémon de tu equipo que estén combatiendo.
      it: |-
        Potere Rotom che permette ai propri Pokémon
        impegnati in una lotta di recuperare tutti i PS.
