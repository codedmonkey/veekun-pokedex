    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        からだの　ひかりを　いってんに　あつめて
        ちからを　はなつ。あいての　とくぼうを
        さげることが　ある。
      ja: |-
        体の　光を　一点に　集めて
        力を　放つ。
        相手の　特防を　さげることが　ある。
      ko: |-
        몸의 빛을 한곳에 모아서
        힘을 쏜다. 상대의
        특수방어를 떨어뜨릴 때가 있다.
      zh-Hant: |-
