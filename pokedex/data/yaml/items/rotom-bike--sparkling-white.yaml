  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        ロトムの　ちからで　ターボが　でき
        すいじょうも　はしれる　じてんしゃ。
        しろく　かがやく　ぴかぴかホワイト。
      ja: |-
        ロトムの　力で　ターボが　でき
        水上も　走れる　じてんしゃ。
        白く　輝く　ぴかぴかホワイト。
      ko: |-
        로토무의 힘으로 터보를 사용할 수 있고
        물 위에서도 달릴 수 있는 자전거.
        하얗게 빛나는 스파클링 화이트 디자인이다.
      zh-Hant: |-
        能用洛托姆的力量進行渦輪加速，
        還能在水上移動的自行車。
        潔白耀眼的閃亮白。
      zh-Hans: |-
        能借助洛托姆的力量进行涡轮加速，
        且可在水面上骑行的自行车。
        洁白耀眼的闪亮白。
      en: |-
        This bike can do a turbo boost and run on the water
        using Rotom’s power. It’s a sparkling white that
        shines brilliantly.
      fr: |-
        Une bicyclette qui permet de mettre le turbo et de
        se déplacer sur l’eau grâce à Motisma. D’une blancheur
        éclatante, elle projette des étincelles sur son passage.
      de: |-
        Ein glitzernd weißes Fahrrad, das dank Rotom über
        einen Turbo verfügt und auf dem Wasser gefahren
        werden kann. Versprüht weiße Funken.
      es: |-
        Gracias al poder de Rotom, esta bicicleta permite usar
        el turbo y desplazarse sobre el agua. Tiene un color
        blanco centelleante.
      it: |-
        Una bicicletta dotata del turbo che può anche spostarsi
        in acqua grazie ai poteri di Rotom. È di un bianco
        sfavillante.
