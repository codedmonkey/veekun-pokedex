wailmer-pail:
  category: gameplay
  cost: 0
  effect:
    en: 'Waters Berry plants.'
  flags: {  }
  flavor_text:
    ruby-sapphire:
      en: |-
        A tool used for
        watering BERRIES
        and plants.
    emerald:
      en: |-
        A tool used for
        watering BERRIES
        and plants.
    firered-leafgreen:
      en: |-
        A nifty watering pail.
        Use it to promote strong growth in
        BERRIES planted in soft soil.
    sun-moon:
      ja-Hrkt: |-
        みずを　かける　どうぐ。
        つちに　うめた　きのみを
        すくすく　そだてる。
      ja: |-
        みずを　かける　道具。
        土に　うめた　きのみを
        すくすく　育てる。
      ko: |-
        물을 주는 도구.
        땅에 심은 나무열매를
        쑥쑥 키운다.
      zh-Hant: |-
        澆水的器具。
        能讓埋在土壤裡的
        樹果快快長大。
      zh-Hans: |-
        浇水的道具。
        能让埋在土壤里的
        树果快快长大。
      en: |-
        This is a tool for watering Berries you planted to
        make them grow more quickly.
      fr: 'Sert à arroser les Baies plantées dans le sol.'
      de: |-
        Eine Gießkanne. Gießt du mit ihr im Boden
        angepflanzte Beeren, wachsen sie schneller.
      es: |-
        Regadera con forma de Wailmer. Muy útil para que
        crezcan las bayas plantadas.
      it: |-
        Annaffiatoio a forma di Wailmer che aiuta a far
        crescere rigogliose le piantine di bacche.
