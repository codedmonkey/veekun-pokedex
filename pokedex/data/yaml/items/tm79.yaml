        为倒下的同伴报仇。
        如果上一回合有同伴倒下，
        威力就会提高。
      en: |-
        The user gets revenge for a fainted ally. If an ally
        fainted in the previous turn, this move’s power
        is increased.
      fr: |-
        Venge un Pokémon de l’équipe mis K.O.
        Si un Pokémon de l’équipe a été mis K.O.
        au tour d’avant, l’effet augmente.
      de: |-
        Anwender nimmt Rache für einen besiegten Mitstreiter.
        Wurde in der vorigen Runde ein Mitstreiter besiegt,
        steigt die Stärke.
      es: |-
        Venga a los amigos caídos. Si en el turno anterior han
        derrotado a alguno, la potencia del ataque aumentará.
      it: |-
        Vendica un alleato messo KO. Se ciò è accaduto
        al turno precedente, il danno è maggiore.
