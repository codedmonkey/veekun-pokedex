aqua-suit:
  category: plot-advancement
  cost: 0
  effect:
    en: 'Allows the player to ride Kyogre in the Cave of Origin.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        アクアだんの　かがくぎじゅつを
        けっしゅうして　つくられた　スーツ。
        どんな　しょうげき　にも　たえられる。
      ja: |-
        アクア団の　科学技術を
        結集して　つくられた　スーツ。
        どんな　衝撃にも　耐えられる。
      ko: |-
        아쿠아단이 과학기술을
        결집하여 만든 슈트다.
        어떠한 충격에도 견딜 수 있다.
      zh-Hant: |-
        集結了海洋隊的
        科學技術製造的服裝。
        能承受任何衝擊。
      zh-Hans: |-
        集海洋队科学技术于一身的服装。
        能承受任何冲击。
      en: |-
        A suit made with the collective technological
        know-how of Team Aqua. It can withstand
        any impact.
      fr: |-
        Une combinaison créée à partir des méthodes
        scientifiques de la Team Aqua.
        Elle résiste à tous les chocs.
      de: |-
        Ein Anzug, der unter Einsatz des gesamten
        technischen Wissens von Team Aqua entstand.
        Hält jeder Art von Erschütterung stand.
      es: |-
        Este traje es el resultado de las arduas
        investigaciones científicas del Equipo Aqua.
        Es capaz de soportar cualquier impacto.
      it: |-
        Tuta altamente tecnologica costruita dal
        Team Idro in grado di resistere a qualunque
        shock.
