        독 상태의 상대에게는
        위력이 2배가 된다.
      zh-Hant: |-
        將特殊的毒液潑向對手。
        攻擊陷入中毒狀態的對手時，
        威力會變成２倍。
      zh-Hans: |-
        将特殊的毒液泼向对手。
        对处于中毒状态的对手，
        威力会变成２倍。
      en: |-
