      it: |-
        Lancia uno speciale liquido tossico sul bersaglio.
        Se questi è avvelenato, il danno provocato
        raddoppia.
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        ５ターンの　あいだ　ふしぎな　かべで
        あいてから　うける　ぶつり　こうげきの
        ダメージを　よわめる。
      ja: |-
        ５ターンの　間　不思議な　かべで
        相手から　受ける　物理攻撃の
        ダメージを　弱める。
      ko: |-
        5턴 동안 이상한 장막으로
        상대로부터 받는 물리공격의
        데미지를 약하게 한다.
      zh-Hant: |-
        利用神奇的屏障，
        在５回合內減輕
        來自對手的物理攻擊傷害。
      zh-Hans: |-
        利用神奇的墙壁，
        在５回合内减弱从对手那里
        受到的物理攻击的伤害。
      en: |-
        A wondrous wall of light is put up to reduce damage
        from physical attacks for five turns.
      fr: |-
        Un fabuleux mur de lumière qui réduit les dégâts
        causés par les capacités physiques durant cinq tours.
      de: |-
        Eine mysteriöse Wand, die fünf Runden den Schaden
        von physischen gegnerischen Treffern reduziert.
      es: |-
        Pared de luz que reduce durante cinco turnos el daño
        producido por los ataques físicos.
      it: |-
        Innalza una barriera di luce fantastica che riduce
        i danni degli attacchi fisici per sé e gli alleati
        per cinque turni.
    sword-shield:
      ja-Hrkt: |-
        もてる　ちからを　すべて　つかって
        あいてに　とつげきする。
        つぎの　ターンは　うごけなく　なる。
      ja: |-
        持てる　力を　すべて　使って
        相手に　突撃する。
        次の　ターンは　動けなくなる。
      ko: |-
        가진 힘을 모두 사용해서
        상대에게 돌격한다.
        다음 턴은 움직일 수 없다.
      zh-Hant: |-
        使出全身上下所有力量突擊對手。
        下一回合自己將無法動彈。
      zh-Hans: |-
        使出自己浑身力量突击对手。
        下一回合自己将无法动弹。
      en: |-
        The user charges at the target using every bit of its
        power. The user can’t move on the next turn.
      fr: |-
        Le lanceur charge l’ennemi de toute sa puissance
        et doit ensuite se reposer au tour suivant.
      de: |-
        Anwender rennt mit seiner ganzen Kraft gegen das
        Ziel an und muss dann eine Runde ruhen.
      es: |-
        El usuario carga contra el objetivo con toda la fuerza
        que tiene y descansa durante el siguiente turno.
      it: |-
        Chi la usa carica il bersaglio usando tutta la sua
        forza, ma al turno successivo deve riposarsi.
