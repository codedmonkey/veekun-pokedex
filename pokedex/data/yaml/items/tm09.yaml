tm09:
  category: all-machines
  cost: 50000
  effect:
    en: 'Teaches Bullet Seed to a compatible Pokémon.'
  flags: {  }
  flavor_text:
    ruby-sapphire:
      en: |-
        Shoots 2 to 5 seeds
        in a row to strike
        the foe.
    emerald:
      en: |-
        Shoots 2 to 5 seeds
        in a row to strike
        the foe.
    firered-leafgreen:
      en: |-
        The user shoots
        seeds at the foe.
        Two to five seeds
        are shot at once.
    diamond-pearl:
      en: |-
        The user forcefully shoots seeds at
        the foe. Two to five seeds are shot in
        rapid succession.
    platinum:
      en: |-
        The user forcefully shoots seeds at
        the foe. Two to five seeds are shot in
        rapid succession.
    heartgold-soulsilver:
      en: |-
        The user forcefully shoots seeds at
        the foe. Two to five seeds are shot in
