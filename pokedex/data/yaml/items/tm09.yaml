    black-white:
      en: |-
        The user drenches the target in a
        special poisonous liquid. Its power
        is doubled if the target is poisoned.
      fr: |-
        Le lanceur inocule un poison spécial
        à l’ennemi. L’effet est doublé si
        l’ennemi est déjà empoisonné.
    black-2-white-2:
      en: |-
        The user drenches the target in a
        special poisonous liquid. Its power
        is doubled if the target is poisoned.
    x-y:
      ja-Hrkt: |-
        とくしゅな　どくえきを　あびせる。
        どく　じょうたいの　あいてには
        いりょくが　２ばいに　なる。
      ja: |-
        特殊な　毒液を　浴びせかける。
        毒状態の　相手には
        威力が　２倍に　なる。
      ko: |-
        특수한 독액을 날린다.
        독 상태의 상대에게는
        위력이 2배가 된다.
      en: |-
        The user drenches the target in a special
        poisonous liquid. This move’s power is
        doubled if the target is poisoned.
      fr: |-
        Le lanceur inocule un poison spécial à l’ennemi.
        L’effet est doublé si l’ennemi est déjà
        empoisonné.
      de: |-
        Überschüttet das Ziel mit einer speziellen
        toxischen Flüssigkeit. Doppelt so stark gegen
        bereits vergiftete Ziele.
      es: |-
        Quien lo usa genera un terremoto que afecta a
        los Pokémon de alrededor en combate.
      it: |-
        Lancia uno speciale liquido tossico sul bersaglio.
        Se questi è avvelenato, il danno provocato
        raddoppia.
    sun-moon:
      ja-Hrkt: |-
        とくしゅな　どくえきを　あびせかける。
        どく　じょうたいの　あいてには
        いりょくが　２ばいに　なる。
      ja: |-
        特殊な　毒液を　浴びせかける。
        毒状態の　相手には
        威力が　２倍に　なる。
      ko: |-
        특수한 독액을 끼얹는다.
        독 상태의 상대에게는
        위력이 2배가 된다.
      zh-Hant: |-
        將特殊的毒液潑向對手。
        攻擊陷入中毒狀態的對手時，
        威力會變成２倍。
      zh-Hans: |-
        将特殊的毒液泼向对手。
        对处于中毒状态的对手，
        威力会变成２倍。
      en: |-
        The user drenches the target in a special
        poisonous liquid. This move’s power is doubled
        if the target is poisoned.
      fr: |-
        Le lanceur inocule un poison spécial à l’ennemi.
        L’effet est doublé si l’ennemi est déjà empoisonné.
      de: |-
        Überschüttet das Ziel mit einer speziellen
        toxischen Flüssigkeit. Doppelt so stark gegen
        bereits vergiftete Ziele.
      es: |-
        Ataca cubriendo al objetivo con un líquido
        venenoso. El daño será doble si este ya está
        envenenado.
      it: |-
        Lancia uno speciale liquido tossico sul bersaglio.
        Se questi è avvelenato, il danno provocato
        raddoppia.
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        とくしゅな　どくえきを　あびせかける。
        どく　じょうたいの　あいてには
        いりょくが　２ばいに　なる。
      ja: |-
