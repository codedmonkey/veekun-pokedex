  flavor_text:
    x-y:
      ja-Hrkt: |-
        ないしょばなしを　することで　あいての
        しゅうちゅうりょくを　うしなわせ
        あいての　とくこうを　さげる。
      ja: |-
        ないしょばなしを　することで　相手の
        集中力を　失わせ
        相手の　特攻を　さげる。
      ko: |-
        비밀 이야기를 함으로써
        상대의 집중력을 잃게 하여
        특수공격을 떨어뜨린다.
      en: |-
        The user tells the target a secret, and
        the target loses its ability to concentrate.
        This lowers the target’s Sp. Atk stat.
      fr: |-
        Dévoile des secrets à l’ennemi qui perd sa
        concentration et voit son Attaque Spéciale
        diminuer.
      de: |-
        Der Anwender vertraut dem Ziel ein Geheimnis an.
        Dadurch stört er dessen Konzentration und senkt
        dessen Spezial-Angriff.
      es: |-
        Bicicleta plegable con la que se va más rápido
        que corriendo.
      it: |-
        Chi la usa svela dei segreti al bersaglio,
        distraendolo e riducendone l’Attacco Speciale.
