mewnium-z--held:
  category: z-crystals
  cost: 0
  effect:
    en: 'Held: Allows []{pokemon:mew} to upgrade []{move:psychic} into []{move:genesis-supernova}.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        Ｚパワーの　けっしょう。
        ミュウの　サイコキネシスを
        Ｚワザに　グレードアップする。
      ja: |-
        Ｚパワーの　結晶。
        ミュウの　サイコキネシスを
        Ｚワザに　グレードアップする。
      ko: |-
        Z파워의 결정.
        뮤의 사이코키네시스를
        Z기술로 업그레이드한다.
      zh-Hant: |-
        Ｚ力量的結晶。
        會把夢幻的精神強念
        升級為Ｚ招式。
      zh-Hans: |-
        Ｚ力量的结晶。
        会将梦幻的精神强念
        升级成Ｚ招式。
      en: |-
        This is a crystallized form of Z-Power.
        It upgrades Mew’s Psychic to a Z-Move.
      fr: |-
        Une cristallisation de la Force Z, permettant
        de transformer le Psyko de Mew en capacité Z.
      de: |-
        Ein Kristall, dem Z-Kraft innewohnt.
        Er stuft Mews Attacke Psychokinese
        zu einer Z-Attacke auf.
      es: |-
        Cristal que confiere el Poder Z al movimiento
        Psíquico de Mew.
      it: |-
        Cristallo in cui è immagazzinato il Potere Z.
        Consente di trasformare la mossa Psichico
        di Mew in una mossa Z.
