pure-incense:
  category: training
  cost: 6000
  effect:
    en: 'Held by lead Pokémon: Prevents wild battles with Pokémon that are lower level than the holder.'
  flags:
    - holdable
  flavor_text:
    diamond-pearl:
      en: |-
        An item to be held by a Pokémon.
        It helps keep wild Pokémon away if the
        holder is the first one in the party.
    platinum:
      en: |-
        An item to be held by a Pokémon.
        It helps keep wild Pokémon away if the
        holder is the first one in the party.
    heartgold-soulsilver:
      en: |-
        An item to be held by a Pokémon.
