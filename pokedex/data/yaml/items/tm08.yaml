    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        じぶんの　ＨＰを　すこし　けずって
        ぶんしんを　だす。
        ぶんしんは　じぶんの　みがわりに　なる。
      ja: |-
        自分の　ＨＰを　少し　削って
        分身を　だす。
        分身は　自分の　身代わりに　なる。
      ko: |-
        자신의 HP를 조금 깎아서
        분신을 만든다.
        분신은 자신의 대타가 된다.
      zh-Hant: |-
        消耗一些自己的HP，
        製造分身。
        分身將成為自己的替身。
      zh-Hans: |-
        削减少许自己的HP，
        制造分身。
        分身将成为自己的替身。
      en: |-
        The user makes a copy of itself using some of its HP.
        The copy serves as the user’s decoy.
      fr: |-
        Le lanceur fait une copie de lui-même en sacrifiant
        quelques PV. La copie sert de leurre.
      de: |-
        Anwender setzt eine kleine Menge an KP ein, um
        einen Doppelgänger zu erzeugen, der für ihn Schläge
        einsteckt.
      es: |-
        Utiliza parte de los PS propios para crear un sustituto
        que actúa como señuelo.
      it: |-
        Chi la usa crea una copia di se stesso usando
        alcuni PS. La copia serve come esca per il nemico.
    sword-shield:
      ja-Hrkt: |-
        つよい　こうせんを
        あいてに　はっしゃして　こうげきする。
        つぎの　ターンは　うごけなく　なる。
      ja: |-
        強い　光線を
        相手に　発射して　攻撃する。
        次の　ターンは　動けなくなる。
      ko: |-
        강한 광선을
        상대에게 발사하여 공격한다.
        다음 턴은 움직일 수 없다.
      zh-Hant: |-
        向對手發射
        強烈的光線進行攻擊。
        下一回合自己將無法動彈。
      zh-Hans: |-
        向对手发射
        强烈的光线进行攻击。
        下一回合自己将无法动弹。
      en: |-
        The target is attacked with a powerful beam.
        The user can’t move on the next turn.
      fr: |-
        Projette un puissant rayon sur l’ennemi.
        Le lanceur doit se reposer au tour suivant.
      de: |-
        Starke Attacke, die den Anwender zwingt, eine Runde
        auszusetzen.
      es: |-
        Es eficaz, pero el atacante deberá descansar en el
        siguiente turno.
      it: |-
        Colpisce il bersaglio con un potente raggio.
        Chi la usa salta il turno successivo per recuperare
        energia.
