  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        ジャラランガの　スケイルノイズを
        Ｚワザに　グレードアップする
        Ｚパワーの　けっしょうを　つくりだす。
      ja: |-
        ジャラランガの　スケイルノイズを
        Ｚワザに　グレードアップする
        Ｚパワーの　結晶を　つくりだす。
      ko: |-
        짜랑고우거의 스케일노이즈를
        Z기술로 업그레이드하는
        Z파워의 결정을 만들어 낸다.
      zh-Hant: |-
        可用來製造將
        杖尾鱗甲龍的鱗片噪音
        升級為Ｚ招式的Ｚ力量結晶。
      zh-Hans: |-
        可用它来制造用于对战
        并能将杖尾鳞甲龙的鳞片噪音
        升级成Ｚ招式的Ｚ力量结晶。
      en: |-
        It converts Z-Power into crystals that upgrade
        Kommo-o’s Clanging Scales to an exclusive Z-Move.
      fr: |-
        Permet de concentrer la Force Z en un cristal,
        qui autorise l’Ékaïser qui le tient à transformer
        sa capacité Vibrécaille en capacité Z.
      de: |-
        Kristallisierte Z-Kraft, die Grandiras’ Attacke
        Schuppenrasseln zu einer Z-Attacke aufstuft.
        Wird bei Bedarf automatisch vervielfacht.
      es: |-
        Concentra el Poder Z en cristales que permiten a
        Kommo-o convertir su Fragor Escamas en un
        movimiento Z.
      it: |-
        Permette di creare cristalli carichi di Potere Z che
        consentono a Kommo-o di trasformare la mossa
        Clamorsquame in una mossa Z.
