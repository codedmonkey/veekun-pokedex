rowap-berry:
  category: other
  cost: 80
  effect:
    en: |-
      Held in battle
      :   When the holder takes [special]{mechanic:special} damage, it consumes this item to damage the attacking Pokémon for 1/8 its max [HP]{mechanic:hp}.
  flags:
    - holdable-active
  flavor_text:
    diamond-pearl:
      en: |-
        A Poffin ingredient. If held by a
        Pokémon, and if a foe’s special attack
        lands, the foe also takes damage.
    platinum:
      en: |-
        A Poffin ingredient. If held by a
        Pokémon, and if a foe’s special attack
        lands, the foe also takes damage.
    heartgold-soulsilver:
      en: |-
        If held by a Pokémon and a foe’s
        special attack lands, the foe also
        takes damage.
    black-white:
      en: |-
        If held by a Pokémon and a special
        attack lands, the attacker also
        takes damage.
      fr: |-
        Tenue, cette Baie inflige des dégâts
        à l’ennemi s’il utilise une attaque
        spéciale qui atteint son but.
    black-2-white-2:
      en: |-
        If held by a Pokémon and a special
        attack lands, the attacker also
        takes damage.
    x-y:
      ja-Hrkt: |-
        ポケモンに　もたせると
        とくしゅわざを　うけたとき
        あいてにも　ダメージを　あたえる。
      ja: |-
        ポケモンに　持たせると
        特殊技を　受けたとき
        相手にも　ダメージを　あたえる。
      ko: |-
        포켓몬에게 지니게 하면
        특수 기술을 당했을 때
        상대에게도 데미지를 준다.
      en: |-
        A Berry to be consumed by Pokémon.
        If a special attack hits the Pokémon
        holding it, the attacker will also be hurt.
      fr: |-
        Tenue, cette Baie inflige des dégâts à
        l’attaquant s’il utilise une attaque spéciale
        qui atteint son but.
      de: |-
        Als getragenes Item bewirkt diese Beere
        Schaden bei jenen, die den Träger mit einer
        Spezial-Attacke treffen.
      es: |-
        El Pokémon que lleva esta piedra mágica no
        evoluciona.
      it: |-
        Se un Pokémon ha questa bacca, chi attacca
        subirà danni se la sua mossa speciale va a segno.
