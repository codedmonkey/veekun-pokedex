        전기타입으로 바뀌는 카세트.
      zh-Hant: |-
        讓蓋諾賽克特攜帶的卡帶。
        攜帶後，招式高科技光炮
        會變為電屬性。
      zh-Hans: |-
        这是让盖诺赛克特携带的卡带。
