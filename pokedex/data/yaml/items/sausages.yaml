        소시지의 한 종류다. 삶아서 먹는다.
      zh-Hant: |-
        製作露營料理時使用的食材之一。
        是香腸的一種，
        水煮後方可食用。
      zh-Hans: |-
        在露营营地制作料理时会使用的
        一种食材。白香肠是香肠的一种。
        需要先煮过之后再食用。
      en: |-
        One of the many ingredients that can be used for
        cooking at your camp. These sausages should be
        boiled before eating.
      fr: |-
        Un ingrédient de cuisine pour le camping.
        À faire bouillir avant de déguster.
      de: |-
        Eine Zutat für PokéCamping-Mahlzeiten. Die kleinen
        groben Würstchen werden vor dem Verzehr gekocht.
      es: |-
        Un ingrediente para cocinar en el campamento.
        Si te apetece disfrutar de su delicioso sabor, basta
        con hervirlas.
      it: |-
        Uno degli ingredienti che puoi usare per cucinare
        in campeggio. Questo tipo di salsiccia va mangiato
        bollito.
