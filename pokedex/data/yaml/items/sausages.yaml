        キャンプの　りょうりに　つかう
        しょくざいの　いっしゅ。ヴルストとは
        ソーセージの　しゅるい。ボイルしてたべる。
      ja: |-
        キャンプの　料理に　使う
        食材の　一種。ヴルストとは
        ソーセージの　種類。ボイルして食べる。
