sparkling-stone:
  category: plot-advancement
  cost: 0
  effect:
    en: 'Required to obtain a Z-Ring.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        アローラの　まもりがみと　される
        ポケモンから　もらった　いし。
        かがやきに　ひみつが　あるという。
      ja: |-
        アローラの　守り神と　される
        ポケモンから　もらった　石。
        かがやきに　秘密が　あるという。
      ko: |-
        알로라의 수호신으로 여겨지는
        포켓몬으로부터 받은 돌.
        빛에 비밀이 있다고 한다.
      zh-Hant: |-
        從被認為是阿羅拉守護神的
        寶可夢處得到的石頭。
        據說其光輝包含著某種秘密。
      zh-Hans: |-
        从被认为是阿罗拉守护神的
        宝可梦那里得到的石头。
        据说其光辉下有着某种秘密。
      en: |-
        A stone entrusted by a Pokémon that has been
        venerated as a guardian deity in the Alola region.
        There is said to be some secret in how it sparkles.
      fr: |-
        Une pierre donnée par un Pokémon gardien d’Alola.
        Son éclat cache un secret.
      de: |-
        Ein Stein, den du von einem der Schutzpatrone
        Alolas erhalten hast. Es heißt, dass sich hinter
        dem Glitzern ein Geheimnis verberge.
      es: |-
        Piedra con un misterioso brillo entregada por un
        Pokémon considerado como uno de los espíritus
        guardianes de Alola.
      it: |-
        Pietra ricevuta dal Pokémon protettore di Alola.
        Dietro la sua lucentezza si nasconde un segreto.
