pokeblock-kit:
  category: gameplay
  cost: 0
  effect:
    en: 'Creates and stores Pokéblocks.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        きのみから　ポロックを　つくる
        きのみブレンダーと　できたポロックを
        ほぞんする　ポロックケースの　セット。
      ja: |-
        きのみから　ポロックを　作る
        きのみブレンダーと　できたポロックを
        保存する　ポロックケースの　セット。
      ko: |-
        나무열매로 포켓몬스넥을 만드는
        나무열매블렌더와 만들어진 포켓몬스넥을
        저장하는 포켓몬스넥케이스 세트.
      zh-Hant: |-
        可由樹果製作寶可方塊的樹果混合器
        與存放用的寶可方塊盒之套裝。
      zh-Hans: |-
        这是树果混合器和宝可方块盒的套装。
        树果混合器可利用树果制作宝可方块，
        而做好的宝可方块可用宝可方块盒来保存。
      en: |-
        A set containing a Berry Blender for making
        Pokéblocks and a Pokéblock Case for
        storing Pokéblocks.
      fr: |-
        Boîte pour ranger le Mixeur à Baies
        et les Pokéblocs.
      de: |-
        Ein Set, das aus einem Beerenmixer für die
        Herstellung von Pokériegeln und einer Pokériegelbox
        für deren Lagerung besteht.
      es: |-
        Kit consistente en una Licuabayas para preparar
        Pokécubos a partir de bayas y un Tubo
        Pokécubos para guardarlos.
      it: |-
        Kit composto da un Mixer bacche, usato per
        preparare le Pokémelle, e da un Portapokémelle,
        usato per conservarle.
