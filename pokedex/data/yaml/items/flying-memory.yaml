flying-memory:
  category: memories
  cost: 1000
  effect:
    en: "Held: Changes Silvally to its Flying form.  Changes Multi-Attack's type to Flying."
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        ひこうタイプの　データが　はいった
        メモリ。　とくていの　ポケモンが
        もつと　タイプが　かわる。
      ja: |-
        ひこうタイプの　データが　入った
        メモリ。　特定の　ポケモンが　持つと
        タイプが　変わる。
      ko: |-
        비행타입의 데이터가 들어 있는
        메모리. 특정 포켓몬이
        지니면 타입이 바뀐다.
      zh-Hant: |-
        裝有飛行屬性資料的記憶碟。
        特定寶可夢攜帶後，
        就會產生屬性的變化。
      zh-Hans: |-
        装有飞行属性数据的存储碟。
        特定宝可梦携带后，
        属性就会发生变化。
      en: |-
        A memory disc that contains Flying-type data.
        It changes the type of the holder if held by
        a certain species of Pokémon.
      fr: |-
        Une carte mémoire contenant des données sur
        le type Vol. Un certain Pokémon peut changer
        de type en l’équipant.
      de: |-
        Eine Disc mit Daten zum Typ Flug.
        Sie löst bei einem bestimmten Pokémon
        einen Typenwechsel aus.
      es: |-
        Disco de datos que contiene información relativa
        al tipo Volador. Permite cambiar de tipo a cierto
        Pokémon.
      it: |-
        ROM contenente dati sul tipo Volante in formato
        digitale. Permette a un certo Pokémon di cambiare
        tipo.
