  flavor_text:
    black-2-white-2:
      en: |-
        A splicer that fuses Kyurem and a
        certain Pokémon. They are said to
        have been one in the beginning.
    x-y:
      ja-Hrkt: |-
        もとは　ひとつだったと　いわれる
        キュレムと　あるポケモンを
        がったいさせる　いっついの　くさび。
      ja: |-
        元は　ひとつだったと　いわれる
        キュレムと　あるポケモンを
        合体させる　一対の　くさび。
      ko: |-
        원래는 하나였다고 전해지는
        큐레무와 어떤 포켓몬을
        합체시키는 한 쌍의 쐐기.
      en: |-
        A splicer that fuses Kyurem and a
        certain Pokémon. They are said to
        have been one in the beginning.
      fr: |-
        Un outil qui permet la fusiorption de Kyurem
        et d’un autre Pokémon avec lequel il ne faisait
        qu’un à l’origine.
      de: |-
        Ein Keil, der Kyurem und ein gewisses anderes
        Pokémon, die vermeintlich einst eins gewesen
        sind, vereinigt.
      es: |-
        Un saquito lleno de sustancias aromáticas cuyo
        perfume resulta abrumador, pero que a ciertos
        Pokémon les encanta.
      it: |-
        Cuneo che permette di fondere Kyurem
        con il Pokémon al quale era unito in origine.
    sword-shield:
      ja-Hrkt: |-
        もとは　ひとつだったと　いわれる
