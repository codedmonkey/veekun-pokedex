        합체시키는 한 쌍의 쐐기.
      zh-Hant: |-
        能讓據說原是一體的酋雷姆和
        某寶可夢合體的一對楔子。
      zh-Hans: |-
        据说是能让原本为一体的
        酋雷姆和某宝可梦
        合体的一对楔子。
      en: |-
        A splicer that fuses Kyurem and a certain Pokémon.
