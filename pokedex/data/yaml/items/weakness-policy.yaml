weakness-policy:
  category: held-items
  cost: 1000
  effect:
    en: 'Held: When the holder is hit by a super effective move, its Attack and Special Attack raise by two stages.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        じゃくてんを　つかれたとき
        こうげきと　とくこうが
        それぞれ　ぐーんと　あがる。
      ja: |-
        弱点を　つかれたとき
        攻撃と　特攻が
        それぞれ　ぐーんと　あがる。
      ko: |-
        약점을 공격당했을 때
        공격과 특수공격이
        각각 크게 올라간다.
      en: |-
        An item to be held by a Pokémon.
        Attack and Sp. Atk sharply increase
        if the holder is hit with a move it’s weak to.
      fr: |-
        Objet à tenir. Augmente beaucoup l’Attaque et
        l’Attaque Spéciale du Pokémon lorsqu’il reçoit
        un coup d’un type auquel il est vulnérable.
      de: |-
        Erhöht den Angriff und den Spezial-Angriff des
        Trägers stark, wenn er von einer sehr effektiven
        Attacke getroffen wird.
      es: |-
        Una de las misteriosas Megapiedras. Permite
        megaevolucionar a Ampharos en combate.
      it: |-
        Se il Pokémon viene colpito da una mossa contro
        cui è debole, l’Attacco e l’Attacco Speciale
        aumentano considerevolmente.
