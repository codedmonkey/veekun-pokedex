  effect:
    en: 'Teaches Payback to a compatible Pokémon.'
  flags: {  }
  flavor_text:
    diamond-pearl:
      en: |-
        The user stores power, then attacks.
        If the user can use this attack after
        the foe, its power is doubled.
    platinum:
      en: |-
        The user stores power, then attacks.
        If the user can use this attack after
        the foe, its power is doubled.
    heartgold-soulsilver:
      en: |-
        The user stores power, then attacks.
        If the user can use this attack after
        the foe, its power is doubled.
    black-white:
      en: |-
        The user stores power, then attacks.
        If the user can use this attack after
        the target, its power is doubled.
      fr: |-
        Le lanceur charge son énergie, puis
        attaque. La puissance est doublée
        si le lanceur agit après l’ennemi.
    black-2-white-2:
      en: |-
        The user stores power, then attacks.
        If the user can use this attack after
        the target, its power is doubled.
    x-y:
      ja-Hrkt: |-
        ちからを　ためこみ　こうげきする。
        あいてより　あとに　だせると
        わざの　いりょくは　２ばいに　なる。
      ja: |-
        ためこんで　攻撃する。
        相手より　後に　攻撃できると
        技の　威力は　２倍に　なる。
      ko: |-
        힘을 모아 공격한다.
        상대보다 나중에 쓰면
        기술의 위력은 2배가 된다.
      en: |-
        The user stores power, then attacks.
        If the user moves after the target,
        this attack’s power will be doubled.
      fr: |-
        Le lanceur charge son énergie, puis attaque.
        La puissance est doublée si le lanceur agit
        après l’ennemi.
      de: |-
        Der Anwender lädt die Attacke auf. Handelt das
        Ziel vor dem Anwender, verdoppelt sich die Kraft
        der Attacke.
      es: |-
        Oprime al enemigo de cuatro a cinco turnos,
        durante los cuales no podrá huir.
      it: |-
        Chi la usa accumula forza, poi attacca.
        La potenza raddoppia se agisce dopo il Pokémon
        nemico.
    sun-moon:
      ja-Hrkt: |-
        ためこんで　こうげきする。
        あいてより　あとに　こうげき　できると
        わざの　いりょくは　２ばいに　なる。
      ja: |-
        ためこんで　攻撃する。
        相手より　後に　攻撃できると
        技の　威力は　２倍に　なる。
      ko: |-
        모아서 공격한다.
        상대보다 뒤에 공격할 수 있으면
        기술의 위력은 2배가 된다.
      zh-Hant: |-
        累積力量進行攻擊。
        若在對手之後進行攻擊，
        招式的威力會變成２倍。
      zh-Hans: |-
        蓄力攻击。
        如果能在对手之后攻击，
        招式的威力会变成２倍。
      en: |-
        The user stores power, then attacks. If the user
        moves after the target, this attack’s power will
        be doubled.
      fr: |-
        Le lanceur charge son énergie, puis attaque.
        La puissance est doublée si le lanceur agit
        après l’ennemi.
      de: |-
        Der Anwender lädt die Attacke auf. Handelt das
        Ziel vor dem Anwender, verdoppelt sich die Stärke
        der Attacke.
      es: |-
        Quien lo usa se carga de energía y luego ataca. Y,
        si ataca después del objetivo, dobla la potencia
        del ataque.
      it: |-
        Chi la usa accumula forza, poi attacca. La potenza
        raddoppia se il Pokémon agisce dopo il bersaglio.
