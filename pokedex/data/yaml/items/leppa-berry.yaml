leppa-berry:
  category: medicine
  cost: 80
  effect:
    en: |-
      Held in battle
      :   When the holder is out of [PP]{mechanic:pp} for one of its moves, it consumes this item to restore 10 of that move's PP.

      Used on a party Pokémon
      :   Restores 10 [PP]{mechanic:pp} for a selected move.
  flags:
    - holdable-active
  flavor_text:
    ruby-sapphire:
      en: |-
        A hold item that
        restores 10 PP in
        battle.
    emerald:
      en: |-
        A hold item that
        restores 10 PP in
        battle.
    firered-leafgreen:
      en: |-
        When held by a POKéMON, it will be
        used in battle to restore 10 PP.
    diamond-pearl:
      en: |-
        A Poffin ingredient. It may be used
        or held by a Pokémon to restore a
        move’s PP by 10.
    platinum:
      en: |-
        A Poffin ingredient. It may be used
        or held by a Pokémon to restore a
        move’s PP by 10.
    heartgold-soulsilver:
      en: |-
        It may be used or held by a Pokémon to
        restore a move’s PP by 10.
    black-white:
      en: |-
        If held by a Pokémon,
        it restores a move’s PP by 10.
