    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        しずかに　せいしんを　とういつし
        こころを　しずめる　ことで　じぶんの
        とくこうと　とくぼうを　あげる。
      ja: |-
        静かに　精神を　統一し
        心を　鎮めることで　自分の
        特攻と　特防を　あげる。
      ko: |-
        조용히 정신을 통일하고
        마음을 가라앉혀서 자신의
        특수공격과 특수방어를 올린다.
      zh-Hant: |-
        屏氣凝神，
        提高自己的特攻和特防。
      zh-Hans: |-
        静心凝神，
        从而提高自己的特攻和特防。
      en: |-
        The user quietly focuses its mind and calms its
        spirit to raise its Sp. Atk and Sp. Def stats.
      fr: |-
        Le lanceur se concentre et fait le vide dans son
        esprit pour augmenter son Attaque Spéciale et
        sa Défense Spéciale.
      de: |-
        Erhöht Spezial-Angriff und Spezial-Verteidigung
        durch Konzentration.
      es: |-
        Aumenta la concentración y calma el espíritu para 
        subir el Ataque Especial y la Defensa Especial. 
      it: |-
        Chi la usa placa il proprio spirito meditando per
        aumentare l’Attacco Speciale e la Difesa Speciale.
    sword-shield:
      ja-Hrkt: |-
        ５ターンの　あいだ　あめを　ふらせて
        みずタイプの　いりょくを　あげる。
        ほのおタイプの　いりょくは　さがる。
      ja: |-
        ５ターンの　間　雨を　降らせて
        みずタイプの　威力を　あげる。
        ほのおタイプの　威力は　さがる。
      ko: |-
        5턴 동안 비를 내리게 해서
        물타입 기술의 위력을 올린다.
        불꽃타입의 위력은 떨어진다.
      zh-Hant: |-
        降下大雨，在５回合內
        提高水屬性招式的威力。
        火屬性招式的威力會降低。
      zh-Hans: |-
        在５回合内一直降雨，
        从而提高水属性的招式威力。
        火属性的招式威力则降低。
      en: |-
        The user summons a heavy rain that falls for five
        turns, powering up Water-type moves. It lowers
        the power of Fire-type moves.
      fr: |-
        Invoque de fortes pluies qui durent cinq tours,
        augmentant la puissance des capacités de type Eau
        et baissant celle des capacités de type Feu.
      de: |-
        Anwender erzeugt starken Regen. Die Stärke von
        Wasser-Attacken erhöht sich fünf Runden lang,
        während die Stärke von Feuer-Attacken sinkt.
      es: |-
        Genera una fuerte lluvia que refuerza los movimientos
        de tipo Agua durante cinco turnos y debilita los de tipo
        Fuego.
      it: |-
        Chi la usa provoca una forte pioggia per cinque turni,
        potenziando le mosse di tipo Acqua e riducendo
        la potenza di quelle di tipo Fuoco.
