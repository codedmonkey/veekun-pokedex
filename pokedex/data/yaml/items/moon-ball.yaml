moon-ball:
  category: apricorn-balls
  cost: 0
  effect:
    en: |-
      Used by trainer in battle
      :   Attempts to [catch]{mechanic:catch} a wild Pokémon.  If used in a trainer battle, nothing happens and the ball is lost.

          If the wild Pokémon is a []{pokemon:clefairy}, []{pokemon:nidoran-m}, []{pokemon:nidoran-f}, []{pokemon:jigglypuff}, []{pokemon:skitty}, or any evolution thereof, the wild Pokémon has 4× its catch rate.
  flags: {  }
  flavor_text:
    heartgold-soulsilver:
      en: |-
        A Poké Ball for catching Pokémon that
        evolve using the Moon Stone.
    black-white:
      en: |-
        A Poké Ball for catching Pokémon that
        evolve using the Moon Stone.
      fr: |-
        Une Poké Ball un peu spéciale qui
        fonctionne particulièrement bien sur les
        Pokémon évoluant avec une Pierre Lune.
    black-2-white-2:
      en: |-
        A Poké Ball for catching Pokémon that
        evolve using the Moon Stone.
    x-y:
      ja-Hrkt: |-
        つきのいしで　しんかする　ポケモンが
        つかまえやすくなる
        ちょっと　かわった　ボール。
      ja: |-
        つきのいしで　進化する　ポケモンが
        捕まえやすくなる
        ちょっと　変わった　ボール。
      ko: |-
        달의돌로 진화하는 포켓몬이
        잡기 쉬워지는
        조금 특이한 볼.
      en: |-
        A Poké Ball that will make it easier
        to catch Pokémon that can evolve
        using a Moon Stone.
      fr: |-
        Une Poké Ball un peu spéciale qui fonctionne
        particulièrement bien sur les Pokémon évoluant
        avec une Pierre Lune.
      de: |-
        Ein Ball, der sich besonders gut eignet,
        um Pokémon zu fangen, die sich durch
        einen Mondstein weiterentwickeln.
      es: |-
        Contiene los datos del Pokéathlon con el número
        de puntos perdidos por tus Pokémon.
      it: |-
        Poké Ball un po’ diversa che funziona
        particolarmente bene con i Pokémon
        che si evolvono con una Pietralunare.
