repel:
  category: spelunking
  cost: 400
  effect:
    en: |-
      Used outside of battle
      :   Trainer will skip encounters with wild Pokémon of a lower level than the lead party Pokémon.  This effect wears off after the trainer takes 100 steps.
  flags: {  }
  flavor_text:
    ruby-sapphire:
      en: |-
        Repels weak wild
        POKéMON for 100
        steps.
    emerald:
      en: |-
        Repels weak wild
        POKéMON for 100
        steps.
    firered-leafgreen:
      en: |-
        Prevents weak wild POKéMON from
        appearing for 100 steps.
    diamond-pearl:
      en: |-
        An item that prevents weak wild
        Pokémon from appearing for 100 steps
        after its use.
    platinum:
      en: |-
        An item that prevents weak wild
        Pokémon from appearing for 100 steps
        after its use.
    heartgold-soulsilver:
      en: |-
        An item that prevents weak wild
        Pokémon from appearing for 100 steps
        after its use.
    black-white:
      en: |-
        An item that prevents weak wild
        Pokémon from appearing for 100 steps
        after its use.
      fr: |-
        Repousse les Pokémon sauvages
        faibles pendant 100 pas.
    black-2-white-2:
      en: |-
        An item that prevents weak wild
        Pokémon from appearing for 100 steps
        after its use.
    x-y:
      ja-Hrkt: |-
        １００ぽ　すすむ　あいだ
        よわい　やせいの　ポケモンが
        まったく　でて　こなくなる。
      ja: |-
        １００歩　進む　あいだ
        弱い　野生の　ポケモンが
        まったく　でて　こなくなる。
      ko: |-
        100보 걸어가는 동안
        약한 야생 포켓몬이
        전혀 나오지 않게 된다.
      en: |-
        An item that prevents any low-level
        wild Pokémon from jumping out at
        you for 100 steps after its use.
      fr: |-
        Repousse les Pokémon sauvages faibles pendant
        100 pas.
      de: |-
        Hält 100 Schritte lang schwache, wilde
        Pokémon ab.
      es: |-
        Repele Pokémon salvajes débiles en un recorrido
        de 100 pasos.
      it: |-
        Strumento che evita l’incontro con i Pokémon
        selvatici deboli per 100 passi dopo l’utilizzo.
    sun-moon:
      ja-Hrkt: |-
        つかうと　すこしの　あいだ
        よわい　やせいの　ポケモンが
        まったく　でて　こなくなる。
      ja: |-
        使うと　少しの　あいだ
        弱い　野生の　ポケモンが
        まったく　でて　こなくなる。
      ko: |-
        사용하면 잠시 동안
        약한 야생 포켓몬이
        전혀 나오지 않게 된다.
      zh-Hant: |-
        使用後的短暫期間，
        弱小的野生寶可夢變得
        完全不會出現。
      zh-Hans: |-
        使用后，在较短的一段时间内，
        弱小的野生宝可梦将完全不会出现。
      en: |-
        An item that prevents any low-level wild Pokémon
        from jumping out at you for a while.
      fr: |-
        Repousse les Pokémon sauvages faibles
        pendant un court moment.
      de: 'Hält für kurze Zeit schwache wilde Pokémon ab.'
      es: |-
        Evita encuentros con Pokémon salvajes débiles
        durante un corto período de tiempo.
      it: |-
        Strumento che evita a chi lo usa di incontrare
        Pokémon selvatici deboli per un po’ di tempo.
