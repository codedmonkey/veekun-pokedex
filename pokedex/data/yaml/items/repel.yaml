    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        つかうと　やせいの　ポケモンが
        にげていく。　すこしの　あいだ
        ポケモンと　であわなく　なる。
      ja: |-
        使うと　野生の　ポケモンが
        逃げていく。　少しの　あいだ
        ポケモンと　出会わなく　なる。
      ko: |-
        사용하면 야생 포켓몬이
        도망간다. 잠시 동안
        포켓몬을 만나지 않게 된다.
      zh-Hant: |-
        使用後，野生寶可夢會跑掉，
        在接下來一小段時間內，
        變得完全不會出現。
      zh-Hans: |-
        使用后，野生宝可梦就会逃走。
        接下来在较短的一段时间内，
        将不会再遇到宝可梦。
      en: |-
        An item that drives away wild Pokémon so you won’t
        encounter them for a short time.
      fr: |-
        Repousse les Pokémon sauvages pendant un court
        moment.
      de: |-
        Hält für kurze Zeit wilde Pokémon vom Anwender
        fern und bewirkt so, dass du keinen mehr begegnest.
      es: |-
        Evita encuentros con Pokémon salvajes durante un corto
        período de tiempo.
      it: |-
        Strumento che mette in fuga i Pokémon selvatici per
        un po’ di tempo, permettendo a chi lo usa di evitarli.
