prism-scale:
  category: evolution
  cost: 2000
  effect:
    en: |-
      Held by []{pokemon:feebas}
      :   Holder evolves into []{pokemon:milotic} when traded.
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        A mysterious scale that evolves
        certain Pokémon.
        It shines in rainbow colors.
      fr: |-
        Une écaille étrange qui fait évoluer
        certaines espèces de Pokémon.
        Elle a une couleur arc-en-ciel.
    black-2-white-2:
      en: |-
        A mysterious scale that evolves
        certain Pokémon.
        It shines in rainbow colors.
    x-y:
      ja-Hrkt: |-
        ある　とくていの　ポケモンを
        しんかさせる　ふしぎな　ウロコ。
        にじいろに　かがやいている。
      ja: |-
        ある　特定の　ポケモンを
        進化させる　不思議な　ウロコ。
        にじ色に　輝いている。
      ko: |-
        어느 특정 포켓몬을
        진화시키는 이상한 비늘.
        무지갯빛으로 빛나고 있다.
      en: |-
        A mysterious scale that causes
        a certain Pokémon to evolve.
        It shines in rainbow colors.
      fr: |-
        Une écaille étrange qui fait évoluer certaines
        espèces de Pokémon. Elle a une couleur
        arc-en-ciel.
      de: |-
        Eine seltsame Schuppe, durch die sich bestimmte
        Pokémon entwickeln. Sie funkelt in den Farben
        des Regenbogens.
      es: |-
        Joya de un solo uso que potencia los
        movimientos de tipo Volador. Debe llevarla
        un Pokémon.
      it: |-
        Squama misteriosa che fa evolvere determinate
        specie di Pokémon.
        Riflette i colori dell’arcobaleno.
