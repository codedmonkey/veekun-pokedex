dragon-gem:
  category: jewels
  cost: 200
  effect:
    en: |-
      Held
      :   When the holder uses a damaging []{type:dragon}-type move, the move has 1.5× power and this item is consumed.
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        A gem with a draconic essence. 
        When held, it strengthens the power
        of a Dragon-type move only once.
      fr: |-
        Objet à tenir. Joyau augmentant 
        une fois la puissance des capacités
        de type Dragon.
    black-2-white-2:
      en: |-
        A gem with a draconic essence.
        When held, it strengthens the power
        of a Dragon-type move only once.
