        ドラゴンの　タイプの　ジュエル。
        もたせると　いちどだけ　ドラゴンの
        わざの　いりょくが　つよまる。
      ja: |-
        ドラゴンの　タイプの　ジュエル。
        持たせると　１度だけ　ドラゴンの
        技の　威力が　強まる。
      ko: |-
