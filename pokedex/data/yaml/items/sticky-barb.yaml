sticky-barb:
  category: bad-held-items
  cost: 4000
  effect:
    en: 'Held: Damaged the holder for 1/8 its max HP.  When the holder is struck by a contact move, damages the attacker for 1/8 its max HP; if the attacker is not holding an item, it will take this item.'
  flags:
    - holdable
    - holdable-active
  flavor_text:
    diamond-pearl:
      en: |-
        A hold item that damages the holder on
        every turn. It may latch on to foes
        that touch the holder.
    platinum:
      en: |-
        A hold item that damages the holder on
        every turn. It may latch on to foes
        that touch the holder.
    heartgold-soulsilver:
      en: |-
        A held item that damages the holder on
        every turn. It may latch on to foes
        that touch the holder.
    black-white:
      en: |-
        A held item that damages the holder on
        every turn. It may latch on to foes and
        allies that touch the holder.
      fr: |-
        Objet à tenir blessant le porteur à
        chaque tour. Peut s’accrocher aux
        ennemis qui attaquent le porteur.
    black-2-white-2:
      en: |-
        A held item that damages the holder on
        every turn. It may latch on to foes and
        allies that touch the holder.
    x-y:
      ja-Hrkt: |-
        もたせると　まいターン　ダメージを
        うける。　じぶんに　ふれてきた
        あいてに　くっつくことも　ある。
      ja: |-
        持たせると　毎ターン　ダメージを
        受ける。　自分に　ふれてきた
        相手に　くっつくことも　ある。
      ko: |-
        지니게 하면 매 턴 데미지를 입는다.
        자신에게 접촉해온 상대에게
        들러붙기도 한다.
      en: |-
        An item to be held by a Pokémon.
        It damages the holder every turn and may
        latch on to Pokémon that touch the holder.
      fr: |-
        Objet à tenir. Blesse le porteur à chaque tour.
        Peut s’accrocher aux ennemis qui attaquent
        le porteur.
      de: |-
        Schadet dem Träger in jeder Runde, kann aber
        an Angreifern haften bleiben, die ihn berühren.
      es: |-
        Tabla de piedra que potencia los movimientos de
        tipo Tierra. Debe llevarla un Pokémon.
      it: |-
        Strumento che danneggia chi ce l’ha a ogni
        turno. Può attaccarsi al nemico che lancia
        un attacco fisico.
    sun-moon:
      ja-Hrkt: |-
        もたせると　まいターン　ダメージを
        うける。　じぶんに　ふれてきた
        あいてに　くっつくことも　ある。
      ja: |-
        持たせると　毎ターン　ダメージを
        受ける。　自分に　ふれてきた
        相手に　くっつくことも　ある。
      ko: |-
        지니게 하면 매 턴 데미지를 입는다.
        자신에게 접촉해온 상대에게
        들러붙기도 한다.
      zh-Hant: |-
        攜帶後，每回合都會受到傷害。
        有時也會附著到
        碰到自己的對手身上。
      zh-Hans: |-
        携带后，每回合都会受到伤害。
        有时也会附着到
        碰到自己的对手身上。
      en: |-
        An item to be held by a Pokémon. It damages the
        holder every turn and may latch on to Pokémon
        that touch the holder.
      fr: |-
        Objet à tenir. Blesse le porteur à chaque tour.
        Peut s’accrocher aux ennemis qui attaquent
        le porteur.
      de: |-
        Ein Item zum Tragen. Schadet dem Träger in jeder
        Runde, kann aber an Angreifern haften bleiben,
        die ihn berühren.
      es: |-
        Daña en cada turno al Pokémon que la lleva. Puede
        adherirse al Pokémon que alcance con su ataque
        al portador.
      it: |-
        Strumento che danneggia chi ce l’ha a ogni turno.
        Può attaccarsi a un Pokémon che entra in contatto
        con chi ce l’ha a causa di un attacco.
