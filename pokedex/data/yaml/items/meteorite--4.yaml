meteorite--4:
  category: unused
  cost: 0
  effect:
    en: 'XXX new effect for meteorite--4'
  flags: {  }
  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        えんとつやまで　てにいれた　いんせき。
        なにかの　もんようが　うかびあがり
        なないろの　ひかりが　あふれだす。
      ja: |-
        えんとつ山で　手に入れた　いんせき。
        なにかの　文様が　浮かび上がり
        七色の　光が　あふれだす。
      ko: |-
        굴뚝산에서 손에 넣은 운석.
        어떤 문양이 드러나며
        일곱 색깔의 빛이 넘쳐난다.
      zh-Hant: |-
        在煙囪山上獲得的隕石。
        上面浮現出某種花紋，
        並流瀉著七色光芒。
      zh-Hans: |-
        在烟囱山上获得的陨石。
        上面浮现着某些花纹，
        并散发着七色光芒。
      en: |-
        A Meteorite that you got at Mt. Chimney.
        Some sort of pattern has risen to the surface,
        and it’s shining with seven colors of light.
      fr: |-
        Une météorite trouvée au Mont Chimnée.
        Un étrange symbole est gravé à sa surface,
        et luit des sept couleurs de l’arc-en-ciel.
      de: |-
        Ein Meteorit, den du beim Schlotberg erhalten hast.
        Er ist seltsam gemustert und aus seinem Inneren
        strahlt ein regenbogenfarbenes Licht.
      es: |-
        Meteorito obtenido en el Monte Cenizo. Presenta
        unos peculiares grabados e irradia una luz con los
        siete colores del arcoíris.
      it: |-
        Meteorite ottenuto sul Monte Camino.
        Sulla superficie è visibile un motivo in rilievo
        che brilla dei colori dell’arcobaleno.
