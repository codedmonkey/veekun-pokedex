  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        キャンプの　りょうりに　つかう
        しょくざいの　いっしゅ。えらびぬかれた
        リンゴは　かたちもよく　ひかりかがやく。
      ja: |-
        キャンプの　料理に　使う
        食材の　一種。選び抜かれた
        リンゴは　形もよく　光り輝く。
      ko: |-
        캠프 요리에 사용되는
        식재료 중 하나. 엄선된 사과는
        모양도 예쁘고 윤기가 돈다.
      zh-Hant: |-
        製作露營料理時使用的食材之一。
        經過嚴格挑選的蘋果，
        不但形狀漂亮，而且充滿光澤。
      zh-Hans: |-
        在露营营地制作料理时会使用的
        一种食材。历经千挑万选的苹果
        不仅形状饱满，表皮更是亮泽鲜艳。
      en: |-
        One of the many ingredients that can be used for
        cooking at your camp. An apple chosen above others.
        It has spectacular form and a brilliant sheen.
      fr: |-
        Un ingrédient de cuisine pour le camping.
        Cette pomme a été spécialement sélectionnée
        pour sa forme et sa peau brillante.
      de: |-
        Eine Zutat für PokéCamping-Mahlzeiten. Diese
        handverlesenen Exemplare sind formschön und
        glänzen wunderbar.
      es: |-
        Un ingrediente para cocinar en el campamento. Es
        brillante y tiene una forma perfecta.
      it: |-
        Uno degli ingredienti che puoi usare per cucinare
        in campeggio. Queste mele sono selezionate
        con cura in base alla forma e alla lucentezza.
