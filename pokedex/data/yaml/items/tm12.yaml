    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        じぶんが　どく　まひ　やけど
        じょうたいの　とき　あいてに　くりだすと
        わざの　いりょくが　２ばいに　なる。
      ja: |-
        自分が　毒　まひ　やけど
        状態のとき　相手に　くりだすと
        技の　威力が　２倍に　なる。
      ko: |-
        자신이 독, 마비, 화상
        상태일 때 날리면
        기술의 위력이 2배가 된다.
      zh-Hant: |-
        當自己陷入中毒、麻痺、灼傷等
        狀態時，向對手使用此招式，
        威力會變成２倍。
      zh-Hans: |-
        当自己处于中毒、麻痹、灼伤状态时，
        向对手使出此招式的话，
        威力会变成２倍。
      en: |-
        This attack move doubles its power if the user is
        poisoned, burned, or paralyzed.
      fr: |-
        Une attaque dont la puissance double lorsque
        le lanceur est empoisonné, paralysé ou brûlé.
      de: |-
        Ist der Anwender vergiftet, paralysiert oder leidet er
        unter Verbrennungen, verdoppelt sich die Kraft der
        Attacke.
      es: |-
        Ataca con el doble de potencia si el usuario está 
        quemado, paralizado o envenenado.
      it: |-
        Mossa d’attacco che raddoppia la potenza
        se chi la usa è scottato, avvelenato o paralizzato.
    sword-shield:
      ja-Hrkt: |-
        １ターンめに　ひかりを　いっぱいに
        あつめ　２ターンめに　そのちからを
        けんに　こめて　こうげきする。
      ja: |-
        １ターン目に　光を　いっぱいに　集め
        ２ターン目に　その　力を
        剣に　込めて　攻撃する。
      ko: |-
        1턴째에 빛을 가득 모아
        2턴째에 그 힘을
        검에 담아 공격한다.
      zh-Hant: |-
        使用後的第１回合吸收大量日光，
        並於第２回合把力量
        注入劍裡進行攻擊。
      zh-Hans: |-
        第１回合收集满满的日光，
        第２回合将此力量
        集中在剑上进行攻击。
      en: |-
        In this two-turn attack, the user gathers light and fills a
        blade with the light’s energy, attacking the target on the
        next turn.
      fr: |-
        Le lanceur absorbe la lumière au premier tour
        et attaque au second tour en libérant cette énergie
        sous forme de lames.
      de: |-
        In Runde 1 absorbiert der Anwender Licht, das er in
        Runde 2 zu einem Schwert formt, mit dem er dann
        angreift.
      es: |-
        El usuario dedica un turno a absorber energía lumínica
        y concentrarla en forma de cuchilla con la que ataca al
        rival en el siguiente turno.
      it: |-
        Chi la usa assorbe la luce condensandola in una lama
        al primo turno per poi attaccare al turno successivo.
