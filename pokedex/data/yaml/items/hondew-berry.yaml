    x-y:
      ja-Hrkt: |-
        ポケモンに　あげると
        とても　なつき　やすくなるが
        とくこうの　きそポイントは　さがる。
      ja: |-
        ポケモンに　あげると
        とても　なつき　やすくなるが
        特攻の　基礎ポイントは　さがる。
      ko: |-
        포켓몬에게 주면
        매우 친밀해지기 쉬워지지만
        특수공격의 기초 포인트가 떨어진다.
      en: |-
        A Berry to be consumed by Pokémon.
        Using it on a Pokémon makes it more
        friendly but lowers its base Sp. Atk.
      fr: |-
        Une Baie qui rend les Pokémon plus amicaux,
        mais baisse leur Attaque Spéciale de base.
      de: |-
        Isst ein Pokémon diese Beere, stärkt dies
        eure Freundschaft, verringert aber seinen
        Spezial-Angriffs-Basiswert.
      es: |-
        Si la lleva un Pokémon, debilita un ataque
        supereficaz de tipo Lucha de un enemigo.
      it: |-
        Usata su un Pokémon, lo rende più amichevole,
        ma ne diminuisce i punti base dell’Attacco
        Speciale.
