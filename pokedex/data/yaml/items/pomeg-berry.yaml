        Using it on a Pokémon makes it more
        friendly, but it also lowers its base HP.
    black-white:
      en: |-
        Using it on a Pokémon makes it more
        friendly, but it also lowers its base HP.
      fr: |-
        Rend les Pokémon plus amicaux, mais
        baisse leurs PV de base.
    black-2-white-2:
      en: |-
        Using it on a Pokémon makes it more
        friendly, but it also lowers its base HP.
    x-y:
      ja-Hrkt: |-
        ポケモンに　あげると
        とても　なつき　やすくなるが
        ＨＰの　きそポイントは　さがる。
      ja: |-
        ポケモンに　あげると
        とても　なつき　やすくなるが
        ＨＰの　基礎ポイントは　さがる。
      ko: |-
        포켓몬에게 주면
        매우 친밀해지기 쉬워지지만
        HP의 기초 포인트가 떨어진다.
      en: |-
        A Berry to be consumed by Pokémon.
        Using it on a Pokémon makes it more
        friendly but lowers its base HP.
      fr: |-
        Une Baie qui rend les Pokémon plus amicaux,
        mais baisse leurs PV de base.
      de: |-
        Isst ein Pokémon diese Beere, stärkt dies eure
        Freundschaft, verringert aber seinen KP-Basiswert.
      es: |-
        Si la lleva un Pokémon, debilita un ataque
        supereficaz de tipo Eléctrico de un enemigo.
      it: |-
        Usata su un Pokémon, lo rende più amichevole,
        ma ne riduce i punti base dei PS.
