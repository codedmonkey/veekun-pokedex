aloraichium-z--held:
  category: z-crystals
  cost: 0
  effect:
    en: 'Held: Allows Alola []{pokemon:raichu} to upgrade []{move:thunderbolt} into []{move:stoked-sparksurfer}.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        Ｚパワーの　けっしょう。
        アローラちほうの　ライチュウの
        １０まんボルトを　Ｚワザに　かえる。
      ja: |-
        Ｚパワーの　結晶。
        アローラ地方の　ライチュウの
        １０まんボルトを　Ｚワザに　変える。
      ko: |-
        Z파워의 결정.
        알로라지방의 라이츄의
        10만볼트를 Z기술로 바꾼다.
      zh-Hant: |-
        Ｚ力量的結晶。
        會把阿羅拉地區雷丘的
        十萬伏特升級為Ｚ招式。
      zh-Hans: |-
        Ｚ力量的结晶。
        会将阿罗拉地区雷丘的
        十万伏特升级成Ｚ招式。
      en: |-
        This is a crystallized form of Z-Power. It upgrades
        Alolan Raichu’s Thunderbolt to a Z-Move.
      fr: |-
        Une cristallisation de la Force Z, permettant
        de transformer le Tonnerre d’un Raichu de
        la région d’Alola en capacité Z.
      de: |-
        Ein Kristall, dem Z-Kraft innewohnt.
        Er stuft Alola-Raichus Attacke Donnerblitz
        zu einer Z-Attacke auf.
      es: |-
        Cristal que confiere el Poder Z al movimiento Rayo
        de los Raichu de Alola.
      it: |-
        Cristallo in cui è immagazzinato il Potere Z.
        Consente di trasformare la mossa Fulmine
        del Raichu di Alola in una mossa Z.
