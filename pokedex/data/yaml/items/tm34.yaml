        vergiftet.
      es: |-
        Una onda tóxica que daña a los Pokémon de
        alrededor. Puede envenenar.
      it: |-
        Lancia un’onda di fango che attacca tutti i Pokémon
        nelle vicinanze. Può anche avvelenarli.
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
