    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        おおきな　くちから　しょうげきはを
        まきおこして　あいてを　こうげきする。
      ja: |-
        大きな　口から　衝撃波を
        まきおこして　相手を　攻撃する。
      ko: |-
        큰 입으로 충격파를
        일으켜서 상대를 공격한다.
      zh-Hant: |-
        從張大的口中
        發射衝擊波攻擊對手。
      zh-Hans: |-
        从大大的口中
        掀起冲击波攻击对手。
      en: |-
        The target is attacked with a shock wave generated
        by the user’s gaping mouth.
      fr: |-
        Le lanceur ouvre la bouche pour envoyer une onde
        de choc qui frappe l’ennemi.
      de: |-
        Das Ziel wird mit einer Schockwelle angegriffen,
        die aus dem offenen Maul des Anwenders kommt.
      es: |-
        Abre mucho la boca y libera una onda de choque 
        que ataca al objetivo.
      it: |-
        Chi la usa spalanca la bocca e genera un’onda
        d’urto che colpisce il bersaglio.
    sword-shield:
      ja-Hrkt: |-
        ５ターンの　あいだ　ひざしを　つよくして
        ほのおタイプの　いりょくを　あげる。
        みずタイプの　いりょくは　さがる。
      ja: |-
        ５ターンの　間　日差しを　強くして
        ほのおタイプの　威力を　あげる。
        みずタイプの　威力は　さがる。
      ko: |-
        5턴 동안 햇살을 강하게 해서
        불꽃타입 기술의 위력을 올린다.
        물타입의 위력은 떨어진다.
      zh-Hant: |-
        讓日照增強，在５回合內
        提高火屬性招式的威力。
        水屬性招式的威力會降低。
      zh-Hans: |-
        在５回合内让日照变得强烈，
        从而提高火属性的招式威力。
        水属性的招式威力则降低。
      en: |-
        The user intensifies the sun for five turns, powering
        up Fire-type moves. It lowers the power of
        Water-type moves.
      fr: |-
        Fait briller le soleil pendant cinq tours, augmentant
        la puissance des capacités de type Feu et baissant
        celle des capacités de type Eau.
      de: |-
        Die Sonne brennt unbarmherzig fünf Runden lang.
        Dadurch werden Attacken vom Typ Feuer verstärkt,
        während Wasser-Attacken abgeschwächt werden.
      es: |-
        Hace que se intensifique el efecto del sol durante
        cinco turnos, lo que potencia los movimientos de tipo
        Fuego y debilita los de tipo Agua.
      it: |-
        Chi la usa intensifica i raggi solari per cinque turni,
        potenziando le mosse di tipo Fuoco e riducendo
        la potenza di quelle di tipo Acqua.
