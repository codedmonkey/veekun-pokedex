        있는 포켓몬을 공격한다.
        독 상태로 만들기도 한다.
      zh-Hant: |-
        用污泥波攻擊
        自己周圍所有的寶可夢。
        有時會讓對手陷入中毒狀態。
      zh-Hans: |-
        用污泥波攻击
        自己周围所有的宝可梦。
