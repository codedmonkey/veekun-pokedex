        相手の　素早さを　がくっと　さげる。
      ko: |-
        무서운 얼굴로 노려보고 겁주어
        상대의 스피드를 크게 떨어뜨린다.
      zh-Hant: |-
        用恐怖的表情瞪著對手，
        讓對手害怕，
        大幅降低對手的速度。
      zh-Hans: |-
        用恐怖的表情瞪着对手，
        使其害怕，
        从而大幅降低对手的速度。
      en: |-
        The user frightens the target with a scary face to
        harshly lower its Speed stat.
      fr: |-
        Le lanceur fait une grimace qui effraie l’ennemi
        et réduit beaucoup sa Vitesse.
      de: |-
        Jagt dem Ziel mit einer Grimasse Angst ein.
        Dessen Initiative-Wert sinkt stark.
      es: 'Asusta al objetivo para reducir mucho su Velocidad.'
      it: |-
        Chi la usa spaventa il bersaglio con una faccia
        terribile e ne riduce di molto la Velocità.
