poke-toy:
  category: spelunking
  cost: 100
  effect:
    en: |-
      Used in battle
      :   Ends a wild battle.  Cannot be used in trainer battles.
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        An item that attracts Pokémon.
        Use it to flee from any battle with a
        wild Pokémon.
      fr: |-
        Objet qui attire les Pokémon. Permet
        de s’enfuir d’un combat contre un
        Pokémon sauvage.
    black-2-white-2:
      en: |-
        An item that attracts Pokémon.
        Use it to flee from any battle with a
        wild Pokémon.
    x-y:
      ja-Hrkt: |-
        ポケモンの　きを　ひかせる　どうぐ。
        やせいポケモンとの　せんとうから
        ぜったいに　にげられる。
      ja: |-
        ポケモンの　気を　ひかせる　道具。
        野生ポケモンとの　戦闘から
        絶対に　逃げられる。
      ko: |-
        포켓몬의 관심을 끄는 도구.
        야생 포켓몬과의 배틀에서
        반드시 도망칠 수 있다.
      en: |-
        A toy that attracts the attention of a
        Pokémon. It guarantees escape from
        any battle with a wild Pokémon.
      fr: |-
        Un objet qui attire les Pokémon.
        Permet de s’enfuir d’un combat contre
        un Pokémon sauvage.
      de: |-
        Ein Item, das wilde Pokémon vom
        Kampfgeschehen ablenkt und
        garantiert die Flucht ermöglicht.
      es: |-
        Aumenta ligeramente la Defensa en combate.
        Al cambiar de Pokémon, el efecto desaparece.
      it: |-
        Strumento che attrae i Pokémon. È utile per
        fuggire dalla lotta con Pokémon selvatici.
