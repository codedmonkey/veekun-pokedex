garchompite:
  category: mega-stones
  cost: 0
  effect:
    en: 'Held: Allows Garchomp to Mega Evolve into Mega Garchomp.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        ガブリアスに　もたせておくと
        たたかいのとき　メガシンカが　できる
        ふしぎな　メガストーンの　いっしゅ。
      ja: |-
        ガブリアスに　持たせておくと
        戦いのとき　メガシンカが　できる
        不思議な　メガストーンの　一種。
      ko: |-
        한카리아스에게 지니게 하면
        배틀할 때 메가진화할 수 있는
        신비한 메가스톤의 일종.
      en: |-
        One variety of the mysterious Mega Stones.
        Have Garchomp hold it, and this stone will
        enable it to Mega Evolve during battle.
      fr: |-
        Une variété de Méga-Gemme.
        Tenue par un Carchacrok, elle lui permet de
        méga-évoluer durant un combat.
      de: |-
        Einer der mysteriösen Mega-Steine. Wird er von
        einem Knakrack getragen, kann es im Kampf eine
        Mega-Entwicklung durchführen.
      es: |-
        Símbolo otorgado en reconocimiento a quienes
        han realizado gestas excepcionales en la región
        de Kalos.
      it: |-
        Un esemplare delle misteriose Megapietre.
        Data a Garchomp, gli permette di megaevolversi
        durante la lotta.
