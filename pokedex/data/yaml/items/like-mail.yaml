like-mail:
  category: all-mail
  cost: 50
  effect:
    en: |-
      Used to send short messages to other players via Pokémon trading.  Trainer may compose a message from a finite list of words when giving this item to a Pokémon.  Once taken and read, a message may be erased and this item can be reused, or the message may be stored in the trainer's PC.

      Held
      :   Holder cannot be placed in the PC.  Any move attempting to remove this item from the holder will fail.
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        Stationery designed for
        writing recommendations.
        Let a Pokémon hold it for delivery.
      fr: |-
        Un papier à lettres idéal pour
        donner des conseils. Peut être
        tenu et livré par un Pokémon.
    black-2-white-2:
      en: |-
        Stationery designed for
        writing recommendations.
        Let a Pokémon hold it for delivery.
    x-y:
      ja-Hrkt: |-
        なにかを　おすすめする　メールが
        かきやすい　びんせん。
        ポケモンに　もたせて　つかう。
      ja: |-
        なにかを　おすすめする　メールが
        書きやすい　レターペーパー。
        ポケモンに　持たせて　使う。
      ko: |-
        뭔가 추천하는 메일을
        쉽게 쓸 수 있는 편지지.
        포켓몬에게 지니게 해서 쓴다.
      en: |-
        Stationery designed to allow you to
        recommend something to the reader.
        Have a Pokémon hold it for delivery.
      fr: |-
        Un papier à lettres idéal pour donner des
        conseils. Peut être tenu et livré par un Pokémon.
      de: |-
        Briefpapier, mit dem man jemandem einen Tipp
        geben kann. Gib es einem Pokémon zum Tragen.
      es: |-
        Los Pokémon pueden llevarla o usarla para
        restaurar algunos PS. Su sabor puede causar
        confusión.
      it: |-
        Carta da lettere ideale per scrivere un consiglio.
        Si può dare a un Pokémon affinché la consegni.
