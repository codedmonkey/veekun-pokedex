snowball:
  category: held-items
  cost: 4000
  effect:
    en: 'Held: If the holder is hit by a damaging Ice move, raises its Attack by one stage.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        つかいすての　ゆきだま。
        もたせて　こおりの　わざを　うけると
        こうげきが　あがる。
      ja: |-
        使い捨ての　ゆきだま。
        持たせて　こおりの　技を　受けると
        攻撃が　あがる。
      ko: |-
        단 한 번 쓰면 없어지는 눈덩이.
        지니게 하고 얼음 기술을 받으면
        공격이 올라간다.
      en: |-
        An item to be held by a Pokémon.
        It boosts Attack if hit with an Ice-type
        attack. It can only be used once.
      fr: |-
        Objet à usage unique. Tenue, elle augmente
        l’Attaque du Pokémon lorsqu’il est touché par
        une capacité de type Glace.
      de: |-
        Wird der Träger von einer Eis-Attacke getroffen,
        steigt sein Angriff und das Item verschwindet.
      es: |-
        Una de las misteriosas Megapiedras. Permite
        megaevolucionar a Banette en combate.
      it: |-
        Palla di neve monouso.
        Se il Pokémon che ce l’ha subisce una mossa
        di tipo Ghiaccio, il suo Attacco aumenta.
