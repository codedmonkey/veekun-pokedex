    sun-moon:
      ja-Hrkt: |-
        Ｚパワーの　けっしょう。
        フェアリータイプの　わざを
        Ｚワザに　グレードアップする。
      ja: |-
        Ｚパワーの　結晶。
        フェアリータイプの　技を
        Ｚワザに　グレードアップする。
