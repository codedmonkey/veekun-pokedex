        Z파워의 결정.
        페어리타입 기술을
        Z기술로 업그레이드한다.
      zh-Hant: |-
        Ｚ力量的結晶。
        會把妖精屬性的招式
        升級為Ｚ招式。
      zh-Hans: |-
        Ｚ力量的结晶。
        会将妖精属性的招式
        升级成Ｚ招式。
      en: |-
        This is a crystallized form of Z-Power.
        It upgrades Fairy-type moves to Z-Moves.
      fr: |-
        Une cristallisation de la Force Z, permettant
        de transformer les capacités de type Fée
        en capacité Z.
      de: |-
        Ein Kristall, dem Z-Kraft innewohnt.
        Er stuft Feen-Attacken zu Z-Attacken auf.
      es: |-
        Cristal que confiere el Poder Z a los movimientos
        de tipo Hada.
      it: |-
        Cristallo in cui è immagazzinato il Potere Z.
        Consente di trasformare le mosse di tipo Folletto
        in mosse Z.
