        おおむかし　うみに　すんでいた
        こだい　ポケモンの　カセキ。
        こうらの　いちぶ　らしい。
      ja: |-
        大昔　海に　すんでいた
        古代ポケモンの　カセキ。
        こうらの　一部らしい。
      ko: |-
        오랜 옛날 바다에 살았던
        고대 포켓몬의 화석.
        등껍질의 일부인 듯하다.
      en: |-
        A fossil from a prehistoric Pokémon
        that once lived in the sea. It could
        be a shell or carapace.
      fr: |-
        Le fossile d’un ancien Pokémon aquatique.
        On dirait un morceau de carapace.
      de: |-
        Das Fossil eines uralten Pokémon, das in der
        Tiefsee lebte. Es sieht wie eine Muschelschale
        oder ein Rückenschild aus.
      es: |-
        Fósil de un Pokémon ancestral que vivió en el
        fondo del mar. Parece ser un fragmento de
        concha.
      it: |-
        Fossile di un Pokémon preistorico che viveva in
        mare. Sembra essere parte di una corazza.
