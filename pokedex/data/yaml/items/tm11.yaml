tm11:
  category: all-machines
  cost: 1000
  effect:
    en: 'Teaches Sunny Day to a compatible Pokémon.'
  flags: {  }
  flavor_text:
    ruby-sapphire:
      en: |-
        Raises the power of
        FIRE-type moves
        for 5 turns.
    emerald:
      en: |-
        Raises the power of
        FIRE-type moves
        for 5 turns.
    firered-leafgreen:
      en: |-
        The sun blazes for
        five turns, powering
        up FIRE-type
        moves.
    diamond-pearl:
      en: |-
        The user intensifies the sun for
        five turns, powering up Fire-type
        moves.
    platinum:
      en: |-
        The user intensifies the sun for
        five turns, powering up Fire-type
        moves.
    heartgold-soulsilver:
      en: |-
        The user intensifies the sun for
        five turns, powering up Fire-type
        moves.
    black-white:
      en: |-
        The user intensifies the sun for
        five turns, powering up Fire-type
        moves.
      fr: |-
        Fait briller le soleil pendant 5 tours et
        améliore les capacités de type Feu.
    black-2-white-2:
      en: |-
        The user intensifies the sun for
        five turns, powering up Fire-type
        moves.
    x-y:
      ja-Hrkt: |-
        ５ターンの　あいだ　ひざしを
        つよくして　ほのおタイプの
        わざの　いりょくを　あげる。
      ja: |-
        ５ターンの　あいだ　日差しを
        つよくして　ほのおタイプの
        技の　威力を　あげる。
      ko: |-
        5턴 동안 햇살을 강하게 해서
        불꽃타입 기술의 위력을 올린다.
      en: |-
        The user intensifies the sun
        for five turns, powering up
        Fire-type moves.
      fr: |-
        Fait briller le soleil pendant cinq tours, augmentant
        la puissance des capacités de type Feu.
      de: |-
        Die Sonne brennt unbarmherzig 5 Runden
        lang. Dadurch werden Attacken vom
        Typ Feuer verstärkt.
      es: |-
        Quien lo usa cava en el primer turno y ataca en
        el segundo. También se puede usar para escapar
        de lugares cerrados.
      it: |-
        Chi la usa intensifica i raggi solari per cinque
        turni, potenziando le mosse di tipo Fuoco.
    sun-moon:
      ja-Hrkt: |-
        ５ターンの　あいだ　ひざしを　つよめて
        ほのおタイプの　いりょくを　あげる。
        みずタイプの　いりょくは　さがる。
      ja: |-
        ５ターンの　あいだ　日差しを　強めて
        ほのおタイプの　威力を　あげる。
        みずタイプの　威力は　さがる。
      ko: |-
        5턴 동안 햇살을 강하게 해서
        불꽃타입 기술의 위력을 올린다.
        물타입의 위력은 떨어진다.
      zh-Hant: |-
        讓陽光增強，在５回合內
        提高火屬性招式的威力。
        水屬性招式的威力會降低。
      zh-Hans: |-
        在５回合内阳光变得强烈，
        从而提高火属性的招式威力。
        水属性的招式威力则降低。
      en: |-
        The user intensifies the sun for five turns, powering
        up Fire-type moves. This also weakens the power
        of Water-type moves.
      fr: |-
        Fait briller le soleil pendant cinq tours, augmentant
        la puissance des capacités de type Feu et baissant
        celle des capacités de type Eau.
      de: |-
        Die Sonne brennt unbarmherzig 5 Runden lang.
        Dadurch werden Attacken vom Typ Feuer verstärkt
        und Attacken vom Typ Wasser geschwächt.
      es: |-
        Intensifica el efecto del sol durante cinco turnos,
        lo que aumenta la potencia de los movimientos de
        tipo Fuego y disminuye la de los de tipo Agua.
      it: |-
        Chi la usa intensifica i raggi solari per cinque
        turni, potenziando le mosse di tipo Fuoco e
        riducendo la potenza di quelle di tipo Acqua.
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        ５ターンの　あいだ　ひざしを　つよめて
        ほのおタイプの　いりょくを　あげる。
        みずタイプの　いりょくは　さがる。
      ja: |-
        ５ターンの　あいだ　日差しを　強めて
        ほのおタイプの　威力を　あげる。
        みずタイプの　威力は　さがる。
      ko: |-
        5턴 동안 햇살을 강하게 해서
        불꽃타입 기술의 위력을 올린다.
        물타입의 위력은 떨어진다.
      zh-Hant: |-
        讓陽光增強，在５回合內
        提高火屬性招式的威力。
        水屬性招式的威力會降低。
      zh-Hans: |-
        在５回合内阳光变得强烈，
        从而提高火属性的招式威力。
        水属性的招式威力则降低。
      en: |-
        The user intensifies the sun for five turns, powering
        up Fire-type moves. This also weakens the power
        of Water-type moves.
      fr: |-
        Fait briller le soleil pendant cinq tours, augmentant
        la puissance des capacités de type Feu et baissant
        celle des capacités de type Eau.
      de: |-
        Die Sonne brennt unbarmherzig 5 Runden lang.
        Dadurch werden Attacken vom Typ Feuer verstärkt
        und Attacken vom Typ Wasser geschwächt.
      es: |-
        Intensifica el efecto del sol durante cinco turnos,
        lo que aumenta la potencia de los movimientos de
        tipo Fuego y disminuye la de los de tipo Agua.
      it: |-
        Chi la usa intensifica i raggi solari per cinque
        turni, potenziando le mosse di tipo Fuoco e
        riducendo la potenza di quelle di tipo Acqua.
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        ぶきみで　あやしい　ほのおを　はなって
        あいてを　やけどの　じょうたいに　する。
      ja: |-
        不気味で　怪しい　炎を　放って
        相手を　やけどの　状態に　する。
      ko: |-
        으스스하고 괴상한 불꽃을 쏘아
        상대를 화상 상태로 만든다.
      zh-Hant: |-
        放出詭異的火焰，
        讓對手陷入灼傷狀態。
      zh-Hans: |-
        放出怪异的火焰，
        从而让对手陷入灼伤状态。
      en: |-
        The user shoots a sinister flame at the target to inflict
        a burn.
      fr: |-
        Lance un bouquet de flammes maléfiques à l’ennemi
        pour lui infliger une brûlure.
      de: |-
        Angriff mit unheimlicher Flamme, die beim Ziel
        Verbrennungen verursacht.
      es: 'Siniestra llama morada que produce quemaduras. '
      it: |-
        Fiamme intense di colore viola causano
        una scottatura al bersaglio.
    sword-shield:
      ja-Hrkt: |-
        １ターンめに　ひかりを　いっぱいに
        あつめ　２ターンめに　ひかりの　たばを
        はっしゃして　こうげきする。
      ja: |-
        １ターン目に　光を　いっぱいに　集め
        ２ターン目に　光の　束を
        発射して　攻撃する。
      ko: |-
        1턴째에 빛을 가득 모아
        2턴째에 빛의 다발을
        발사하여 공격한다.
      zh-Hant: |-
        使用後的第１回合吸收大量日光，
        並於第２回合發射光束進行攻擊。
      zh-Hans: |-
        第１回合收集满满的日光，
        第２回合发射光束进行攻击。
      en: |-
        In this two-turn attack, the user gathers light, then
        blasts a bundled beam on the next turn.
      fr: |-
        Absorbe la lumière au premier tour et envoie un rayon
        puissant au tour suivant.
      de: |-
        Absorbiert Licht in Runde 1. In Runde 2 erfolgt der
        Angriff.
      es: |-
        El usuario absorbe luz en el primer turno y en el
        segundo lanza un potente rayo de energía.
      it: |-
        Chi la usa assorbe luce al primo turno per proiettare
        un raggio intenso al turno successivo.
