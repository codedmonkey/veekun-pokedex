    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        あいての　こうげきを
        まったく　うけない。
        れんぞくで　だすと　しっぱい　しやすい。
      ja: |-
        相手の　攻撃を
        まったく　受けない。
        連続で　だすと　失敗しやすい。
      ko: |-
        상대의 공격을
        전혀 받지 않는다.
        연속으로 쓰면 실패하기 쉽다.
      zh-Hant: |-
        完全防住對手的所有攻擊。
        連續使用時容易失敗。
      zh-Hans: |-
        完全抵挡
        对手的攻击。
        连续使出则容易失败。
      en: |-
        Enables the user to protect itself from all attacks.
        Its chance of failing rises if it is used in succession.
      fr: |-
        Le lanceur esquive toutes les attaques.
        Le risque d’échec augmente lorsque la capacité
        est utilisée plusieurs fois de suite.
      de: |-
        Anwender wehrt jede Attacke ab.
        Scheitert eventuell bei Wiederholung.
      es: |-
        Frena todos los ataques, pero puede fallar si se usa 
        repetidamente.
      it: |-
        Permette di eludere tutti gli attacchi.
        Se usata in successione può fallire.
    sword-shield:
      ja-Hrkt: |-
        するどい　ハリを
        あいてに　はっしゃして　こうげきする。
        ２ー５かいの　あいだ　れんぞくで　だす。
      ja: |-
        鋭い　ハリを
        相手に　発射して　攻撃する。
        ２ー５回の　間　連続で　だす。
      ko: |-
        날카로운 침을
        상대에게 발사해서 공격한다.
        2-5회 동안 연속으로 쓴다.
      zh-Hant: |-
        向對手發射
        銳利的針進行攻擊。
        可連續攻擊２～５次。
      zh-Hans: |-
        向对手发射
        锐针进行攻击。
        连续攻击２～５次。
      en: |-
        Sharp spikes are shot at the target in rapid
        succession. They hit two to five times in a row.
      fr: |-
        Envoie une rafale de dards.
        Peut toucher de deux à cinq fois.
      de: |-
        Spitze Nadeln treffen das Ziel zwei- bis fünfmal
        hintereinander.
      es: 'Lanza finas púas que hieren de dos a cinco veces.'
      it: |-
        Il bersaglio viene colpito da due a cinque volte
        in rapida successione con delle spine.
