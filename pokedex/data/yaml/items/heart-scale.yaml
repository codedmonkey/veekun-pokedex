heart-scale:
  category: collectibles
  cost: 100
  effect:
    en: 'Trade one to the Move Relearner near the shore in []{location:pastoria-city} or with the Move Deleter in []{location:blackthorn-city} to teach one party Pokémon a prior level-up move.'
  flags:
    - underground
  flavor_text:
    ruby-sapphire:
      en: |-
        A lovely scale.
        It is coveted by
        collectors.
    emerald:
      en: |-
        A lovely scale.
        It is coveted by
        collectors.
    firered-leafgreen:
      en: |-
        A pretty, heart-shaped scale that
        is extremely rare. It glows faintly
        in the colors of a rainbow.
    diamond-pearl:
      en: |-
        A pretty, heart-shaped scale that is
        extremely rare. It glows faintly in the
