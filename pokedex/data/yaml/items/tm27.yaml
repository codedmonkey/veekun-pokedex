      ja-Hrkt: |-
        あいてを　もうどくの
        じょうたいに　する。　ターンが　すすむほど
        どくの　ダメージが　ふえていく。
      ja: |-
        相手を　猛毒の　状態に　する。
        ターンが　すすむほど
        毒の　ダメージが　増えていく。
