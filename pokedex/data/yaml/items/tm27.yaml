        Réduit aussi sa Vitesse.
      de: |-
        Eis-Attacke, die gegnerischen Pokémon Schaden zufügt
        und ihren Initiative-Wert senkt.
      es: |-
        Ataque con aire helado que baja la Velocidad de los
        rivales.
      it: |-
        Chi la usa attacca i nemici intorno con una folata
        di aria gelida e ne riduce anche la Velocità.
