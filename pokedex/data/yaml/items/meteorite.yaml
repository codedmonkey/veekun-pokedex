meteorite:
  category: plot-advancement
  cost: 0
  effect:
    en: |-
      RSE: May be traded to Professor Cozmo for []{item:tm27}.

      FRLG: A meteorite to be delivered to Lostelle's father.
  flags: {  }
  flavor_text:
    ruby-sapphire:
      en: |-
        A meteorite found
        at METEOR FALLS.
    emerald:
      en: |-
        A meteorite found
        at METEOR FALLS.
    firered-leafgreen:
      en: |-
        A meteorite that fell from space
        onto MT. MOON long ago.
        It is very lumpy and hard.
    sun-moon:
      ja-Hrkt: |-
        もともとは　りゅうせいのたきに
        おちていた　いんせき。
        えんとつやまで　てにいれた。
      ja: |-
        元々は　流星の滝に
        落ちていた　いんせき。
        えんとつ山で　手に入れた。
      ko: |-
        원래는 유성의 폭포에
        떨어져 있던 운석이다.
        굴뚝산에서 손에 넣었다.
      zh-Hant: |-
        原為墜落在
        流星瀑布裡的隕石。
        在煙囪山得到了它。
      zh-Hans: |-
        原本是落入流星瀑布里的陨石。
        是在烟囱山获得的。
      en: |-
        A Meteorite originally found at Meteor Falls.
        You got it at Mt. Chimney.
      fr: |-
        Une météorite qui s’est écrasée sur le Site
        Météore, trouvée au Mont Chimnée.
      de: |-
        Ein Meteorit, der ursprünglich bei den Meteorfällen
        eingeschlagen ist. Du hast ihn beim Schlotberg
        erhalten.
      es: |-
        Meteorito obtenido en el Monte Cenizo que antes
        se encontraba en la Cascada Meteoro.
      it: |-
        Meteorite proveniente dalle Cascate Meteora.
        Puoi ottenerlo sul Monte Camino.
