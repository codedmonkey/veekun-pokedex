  flavor_text:
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        ポケモンを　つかまえる　ときに
        あたえると　かなり　おちつく　きのみ。
      ja: |-
        ポケモンを　捕まえる　ときに
        あたえると　かなり　落ち着く　きのみ。
      ko: |-
        포켓몬을 잡을 때 주면
        상당히 얌전해지는 나무열매.
      zh-Hant: |-
        在捕捉時把這個樹果餵給寶可夢，
        就能讓牠們的情緒大幅穩定下來。
      zh-Hans: |-
        捕捉宝可梦时，
        把这树果交给宝可梦
        就能有效地平复对方的情绪。
      en: |-
        A Berry that calms wild Pokémon you’re trying to catch
        drastically when given to them.
      fr: |-
        Une Baie à donner à un Pokémon sauvage au moment
        de la capture pour le calmer durablement.
      de: |-
        Gibst du diese Beere einem Pokémon zu essen,
        wird es während des Fangversuchs viel ruhiger.
      es: |-
        Una baya que puedes lanzar a un Pokémon salvaje
        para tranquilizarlo mucho.
      it: |-
        Bacca che calma molto il Pokémon selvatico
        a cui viene data.
