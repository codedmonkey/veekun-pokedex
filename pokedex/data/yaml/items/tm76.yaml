        ていこう　して
        あいてを　こうげきする。
        あいての　とくこうを　さげる。
      ja: |
        抵抗して　相手を　攻撃する。
        相手の　特攻を　さげる。
      ko: |-
        저항하여 상대를 공격한다.
        상대의 특수공격을 떨어뜨린다.
      en: |-
        While resisting, the user attacks the
        opposing Pokémon. This lowers the
        Sp. Atk stat of those hit.
      fr: |-
        Le lanceur se débat de toutes ses forces, et
        baisse l’Attaque Spéciale de l’ennemi.
      de: |-
        Anwender leistet Widerstand und greift an.
        Der Spezial-Angriff der Ziele sinkt.
      es: |-
        Corta al objetivo con una cuchilla o garra.
        También puede usarse para cortar árboles
        delgados.
      it: |-
        Colpisce i nemici opponendo resistenza
        e riducendo il loro Attacco Speciale.
    sun-moon:
      ja-Hrkt: |-
        １ターンめで　そらへ　とび
        ２ターンめに　あいてを　こうげきする。
      ja: |-
        １ターン目で　空へ　飛び
        ２ターン目に　相手を　攻撃する。
      ko: |-
        1턴째에 하늘을 날아
        2턴째에 상대를 공격한다.
      zh-Hant: |-
        使用後的第１回合飛上天空，
        並於第２回合攻擊對手。
      zh-Hans: |-
        第１回合飞上天空，
        第２回合攻击对手。
      en: |-
        The user soars and then strikes its target on the
        next turn.
      fr: |-
        Le lanceur s’envole au premier tour et frappe au
        second.
      de: |-
        Steigt in Runde 1 empor und trifft das Ziel in
        Runde 2.
      es: 'Vuela en el primer turno y ataca en el segundo.'
      it: |-
        Chi la usa si alza in volo per attaccare al turno
        seguente.
