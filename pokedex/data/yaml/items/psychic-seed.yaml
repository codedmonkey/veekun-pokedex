psychic-seed:
  category: held-items
  cost: 4000
  effect:
    en: "Held: If the holder enters battle during Psychic Terrain, or if Psychic Terrain is activated while the holder is in battle, this item is consumed and the holder's Special Defense raises by one stage."
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        ポケモンに　もたせると
        サイコフィールドのときに　つかって
        とくぼうが　あがる。
      ja: |-
        ポケモンに　持たせると
        サイコフィールドのときに　使って
        特防が　あがる。
      ko: |-
        포켓몬에게 지니게 하면
        사이코필드일 때 사용하여
        특수방어가 올라간다.
      zh-Hant: |-
        讓寶可夢攜帶後，
        在精神場地上使用，
        就會提高特防。
      zh-Hans: |-
        让宝可梦携带后，
        在精神场地上使用，
        特防就会提高。
      en: |-
        An item to be held by a Pokémon. It boosts Sp. Def
        on Psychic Terrain. It can only be used once.
      fr: |-
        Objet à tenir. Augmente la Défense Spéciale lorsque
        le terrain est couvert d’un Champ Psychique.
      de: |-
        Gibst du den Samen einem Pokémon zum Tragen,
        setzt es ihn ein, wenn ein Psychofeld aktiv ist,
        und erhöht dadurch seine Spezial-Verteidigung.
      es: |-
        Aumenta la Defensa Especial del portador si se usa
        cuando el terreno está cubierto por un campo
        psíquico.
      it: |-
        Strumento da dare a un Pokémon.
        Fa aumentare la Difesa Speciale quando il terreno
        di lotta è nello stato di Campo Psichico.
