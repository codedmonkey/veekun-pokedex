  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        つうじょうの　とくせいを　もつ
        ポケモンに　つかうと　めずらしい
        とくせいに　かえられる　パッチ。
      ja: |-
        通常の　特性を　持つ
        ポケモンに　使うと　珍しい
        特性に　変えられる　パッチ。
      ko: |-
        일반적인 특성을 가진 포켓몬에게 사용하면
        희귀한 특성으로 바꿀 수 있는 패치.
      zh-Hant: |-
        使用於擁有常見特性的寶可夢，
        就能把寶可夢的特性改變成
        稀有特性的膏藥。
      zh-Hans: |-
        可以改变宝可梦特性的膏药。
        给拥有常见特性的宝可梦使用后，
        其特性会转变为稀有特性。
      en: |-
        A patch that allows a Pokémon with a regular Ability
        to have a rare Ability.
      fr: |-
        Un objet qui permet de remplacer le talent ordinaire
        d’un Pokémon par un talent rare.
      de: |-
        Ein Pflaster, das es ermöglicht, die reguläre Fähigkeit
        eines Pokémon zu einer seltenen Fähigkeit zu ändern.
      es: |-
        Parche que permite cambiar la habilidad normal de un
        Pokémon a otra menos común.
      it: |-
        Cerotto che permette a un Pokémon dotato
        di un’abilità comune di cambiarla in una più rara.
