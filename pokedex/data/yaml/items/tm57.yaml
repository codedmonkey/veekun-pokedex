    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        あいての　からだに
        こばんを　なげつけて　こうげきする。
        せんとうの　あとで　おかねが　もらえる。
      ja: |-
        相手の　体に
        小判を　投げつけて　攻撃する。
        戦闘の　あとで　お金が　もらえる。
      ko: |-
        상대의 몸에
        돈을 세게 던져서 공격한다.
        배틀 후에 돈을 받을 수 있다.
      zh-Hant: |-
        往對手身上
        投擲金幣進行攻擊。
        戰鬥後可以得到錢。
      zh-Hans: |-
        向对手的身体
        投掷小金币进行攻击。
        战斗后可以拿到钱。
      en: |-
        Numerous coins are hurled at the target to inflict
        damage. Money is earned after the battle.
      fr: |-
        Des pièces sont lancées sur l’ennemi.
        Permet d’obtenir de l’argent à la fin du combat.
      de: |-
        Das Ziel wird mit Münzen beworfen. Das Geld wird
        nach dem Kampf aufgesammelt.
      es: |-
        Arroja monedas al objetivo.
        Las recupera al final del combate.
      it: |-
        Colpisce il bersaglio con una gran quantità
        di monete recuperabili dopo la lotta.
    sword-shield:
      ja-Hrkt: |-
        ためこんで　こうげきする。
        あいてより　あとに　こうげき　できると
        わざの　いりょくは　２ばいに　なる。
      ja: |-
        ためこんで　攻撃する。
        相手より　あとに　攻撃できると
        技の　威力は　２倍に　なる。
      ko: |-
        모아서 공격한다.
        상대보다 나중에 공격할 수 있으면
        기술의 위력은 2배가 된다.
      zh-Hant: |-
        累積力量進行攻擊。
        若在對手之後進行攻擊，
        招式的威力會變成２倍。
      zh-Hans: |-
        蓄力攻击。
        如果能在对手之后攻击，
        招式的威力会变成２倍。
      en: |-
        The user stores power, then attacks. If the user
        moves after the target, this attack’s power will
        be doubled.
      fr: |-
        Le lanceur charge son énergie, puis attaque.
        La puissance est doublée si le lanceur agit
        après l’ennemi.
      de: |-
        Der Anwender lädt die Attacke auf. Handelt das Ziel vor
        dem Anwender, verdoppelt sich die Stärke der Attacke.
      es: |-
        El usuario contraataca con el doble de fuerza si el
        objetivo usa un movimiento antes.
      it: |-
        Chi la usa accumula forza, poi attacca. La potenza
        raddoppia se il Pokémon agisce dopo il bersaglio.
