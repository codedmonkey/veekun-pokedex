x-defense:
  category: stat-boosts
  cost: 2000
  effect:
    en: |-
      Used on a party Pokémon in battle
      :   [Raises]{mechanic:raise} the target's [Defense]{mechanic:defense} by one stage.  Increases happiness by 1/1/0.
  flags:
    - countable
    - consumable
    - usable-in-battle
    - holdable
  flavor_text:
    ruby-sapphire:
      en: |-
        Raises the stat
        DEFENSE during one
        battle.
    emerald:
      en: |-
        Raises the stat
        DEFENSE during one
        battle.
    firered-leafgreen:
      en: |-
        Raises the DEFENSE stat of POKéMON
        in battle. Wears off if the POKéMON
        is withdrawn.
    diamond-pearl:
      en: |-
        An item that raises the Defense stat
        of a Pokémon in battle. It wears off if
        the Pokémon is withdrawn.
    platinum:
      en: |-
        An item that raises the Defense stat
        of a Pokémon in battle. It wears off if
        the Pokémon is withdrawn.
    heartgold-soulsilver:
      en: |-
        An item that raises the Defense stat
        of a Pokémon in battle. It wears off if
        the Pokémon is withdrawn.
    black-white:
      en: |-
        An item that raises the Defense stat
        of a Pokémon in battle. It wears off if
        the Pokémon is withdrawn.
      fr: |-
        Monte la Défense pendant un combat.
        L’effet s’estompe si le Pokémon se
        retire.
    black-2-white-2:
      en: |-
        An item that raises the Defense stat
        of a Pokémon in battle. It wears off if
        the Pokémon is withdrawn.
    x-y:
      ja-Hrkt: |-
        せんとうちゅうの　ポケモンの
        ぼうぎょを　あげる　どうぐ。
        ひっこめると　もとに　もどる。
      ja: |-
        戦闘中の　ポケモンの
        防御を　あげる　道具。
        ひっこめると　元に　戻る。
      ko: |-
        배틀 중인 포켓몬의 방어를 올리는
        도구. 포켓몬을 볼에 넣어버리면
        원래대로 되돌아간다.
      en: |-
        An item that boosts the Defense stat
        of a Pokémon during a battle. It wears
        off once the Pokémon is withdrawn.
      fr: |-
        Augmente la Défense pendant un combat.
        L’effet disparaît si le Pokémon se retire.
      de: |-
        Hebt den Verteidigungs-Wert eines Pokémon im
        Kampf. Die Wirkung wird mit dem Austausch des
        Pokémon beendet.
      es: |-
        Aumenta la Defensa en combate. Al cambiar de
        Pokémon, el efecto desaparece.
      it: |-
        Aumenta la Difesa di un Pokémon in una lotta.
        L’effetto svanisce se il Pokémon è sostituito.
    sun-moon:
      ja-Hrkt: |-
        せんとうちゅうの　ポケモンの
        ぼうぎょを　おおきく　あげる　どうぐ。
        ひっこめると　もとに　もどる。
      ja: |-
        戦闘中の　ポケモンの
        防御を　大きく　あげる　道具。
        ひっこめると　元に　戻る。
      ko: |-
        배틀 중인 포켓몬의 방어를 크게 올리는
        도구. 포켓몬을 볼에 넣어버리면
        원래대로 되돌아간다.
      zh-Hant: |-
        大大提高戰鬥中
        寶可夢防禦的道具。
        離場後，效果便會消失。
      zh-Hans: |-
        大幅提高战斗中
        宝可梦防御的道具。
        离场后，效果便会消失。
      en: |-
        An item that sharply boosts the Defense stat of a
        Pokémon during a battle. It wears off once the
        Pokémon is withdrawn.
      fr: |-
        Augmente beaucoup la Défense pendant un combat.
        L’effet disparaît si le Pokémon est retiré.
      de: |-
        Hebt den Verteidigungs-Wert eines Pokémon
        im Kampf stark an. Die Wirkung wird mit dem
        Austausch des Pokémon beendet.
      es: |-
        Aumenta mucho la Defensa en combate. Al cambiar
        de Pokémon, el efecto desaparece.
      it: |-
        Aumenta di molto la Difesa di un Pokémon in una
        lotta. L’effetto svanisce se il Pokémon è sostituito.
