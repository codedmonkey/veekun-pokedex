smoke-poke-tail:
  category: curry-ingredients
  cost: 2200
  effect: {  }
  flags: {  }
  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        キャンプの　りょうりに　つかう
        しょくざいの　いっしゅ。ポケモン　ヤドンの
        しっぽは　ぬけても　すぐ　はえかわる。
      ja: |-
        キャンプの　料理に　使う
        食材の　一種。ポケモン　ヤドンの
        しっぽは　抜けても　すぐ　生えかわる。
      ko: |-
        캠프 요리에 사용되는
        식재료 중 하나. 포켓몬 야돈의
        꼬리는 떨어져도 금방 새로 자란다.
      zh-Hant: |-
        製作露營料理時使用的食材之一。
        寶可夢呆呆獸的尾巴，
        就算掉了也會馬上長回來。
      zh-Hans: |-
        在露营营地制作料理时会使用的
        一种食材。宝可梦呆呆兽的尾巴
        就算断掉也会很快长出新的。
      en: |-
        One of the many ingredients that can be used for
        cooking at your camp. When a Slowpoke’s tail falls off,
        it grows back quickly.
      fr: |-
        Un ingrédient de cuisine pour le camping.
        Lorsque la queue d’un Ramoloss tombe,
        elle repousse tout de suite.
      de: |-
        Eine Zutat für PokéCamping-Mahlzeiten. Flegmon-Ruten
        wachsen sofort wieder nach, wenn sie abfallen.
      es: |-
        Un ingrediente para cocinar en el campamento. Las
        colas de Slowpoke siempre vuelven a crecer al poco
        de desprenderse.
      it: |-
        Uno degli ingredienti che puoi usare per cucinare
        in campeggio. Quando la coda degli Slowpoke
        si stacca, ricresce subito dopo.
