micle-berry:
  category: in-a-pinch
  cost: 80
  effect:
    en: |-
      Held in battle
      :   When the holder has 1/4 its max [HP]{mechanic:hp} remaining or less, it consumes this item, and its next used move has 1.2× its normal accuracy.
  flags:
    - holdable-active
  flavor_text:
    diamond-pearl:
      en: |-
        A Poffin ingredient. If held by a
        Pokémon, it raises the accuracy of a
        move just once in a pinch.
