        A thin small spring. It’s totally stretched out, and
        what it’s used for is unknown.
      fr: |-
        Un petit ressort fin et complètement distendu.
        Nul ne sait à quoi il peut bien servir.
      de: |-
        Eine kleine, dünne Feder, die bis zum Äußersten
