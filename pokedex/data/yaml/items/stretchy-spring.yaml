        wofür sie ursprünglich verwendet wurde.
      es: |-
        Muelle fino y pequeño. Está algo elongado y se
        desconoce cuál puede ser su uso.
      it: |-
        Una molla piccola e sottile.
        È deformata e ormai inutilizzabile.
