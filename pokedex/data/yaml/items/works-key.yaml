        갤럭시단이 지니고 있었다.
      zh-Hant: |-
        用來打開或關閉
        山谷發電廠大門的大鑰匙。
        不知為何它在銀河隊手中。
      zh-Hans: |-
        用来打开或关闭
        山谷发电厂大门的大钥匙。
        不知为何，它落入了银河队的手中。
      en: |-
