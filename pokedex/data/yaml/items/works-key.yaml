works-key:
  category: plot-advancement
  cost: 0
  effect:
    en: 'Opens the front door of the Valley Windworks.  Reusable.'
  flags: {  }
  flavor_text:
    diamond-pearl:
      en: |-
        A large key for operating the doors of
        the Valley Windworks in the canyon.
        It was held by a Team Galactic Grunt.
    platinum:
      en: |-
        A large key for operating the doors of
        the Valley Windworks in the canyon.
        It was held by a Team Galactic Grunt.
    heartgold-soulsilver:
      en: |-
        A large key for operating the doors of
        the Valley Windworks in the canyon.
        It was held by a Team Galactic Grunt.
    black-white:
      en: |-
        A large key for operating the doors of
        the Valley Windworks in the canyon.
        It was held by a Team Galactic Grunt.
      fr: |-
        Grande clé servant à ouvrir la porte
        de la centrale Les Éoliennes du canyon.
        Un sbire de la Team Galaxie la détenait.
    black-2-white-2:
      en: |-
        A large key for operating the doors of
        the Valley Windworks in the canyon.
        It was held by a Team Galactic Grunt.
    x-y:
      ja-Hrkt: |-
        たにまのはつでんしょの　とびらを
        あけしめする　おおきな　カギ。
        なぜか　ギンガだんが　もっていた。
      ja: |-
        谷間の発電所の　扉を
        あけしめする　おおきな　カギ。
        なぜか　ギンガ団が　持っていた。
      ko: |-
        골짜기발전소의 문을 여닫는 큰 열쇠.
        어찌된 영문인지
        갤럭시단이 지니고 있었다.
      en: |-
        A large key for operating the doors of
        the Valley Windworks in the canyon.
        It was held by a Team Galactic Grunt.
      fr: |-
        Une grande clé servant à ouvrir la porte de la
        centrale Les Éoliennes du canyon.
        Un sbire de la Team Galaxie la détenait.
      de: |-
        Ein großer Schlüssel, der zum Windkraftwerk
        gehört. Einer der Rüpel von Team Galaktik
        hatte ihn im Besitz.
      es: |-
        Es necesario para participar en Concursos
        Pokémon. Tiene una Cinta de ganador dibujada.
      it: |-
        Grande chiave usata per azionare la porta
        dell’Impianto Turbine. L’aveva con sé una
        Recluta del Team Galassia.
    sun-moon:
      ja-Hrkt: |-
        たにまのはつでんしょの　とびらを
        あけしめする　おおきな　カギ。
        なぜか　ギンガだんが　もっていた。
      ja: |-
