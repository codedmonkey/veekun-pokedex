devon-scuba-gear:
  category: plot-advancement
  cost: 0
  effect:
    en: 'Worn by the player while underwater via Dive in Omega Ruby and Alpha Sapphire.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        ダイビング　ちゅうに　みにつける
        さんそ　ほきゅうよう　マスク。
        デボンで　つくられた。
      ja: |-
        ダイビング中に　身につける
        酸素補給用の　マスク。
        デボンで　つくられた。
      ko: |-
        다이빙할 때 몸에 착용하는
        산소 호흡용 마스크.
        데봉에서 만들어졌다.
      zh-Hant: |-
        潛水時裝備在身上
        用來呼吸氧氣的面罩。
        得文製造。
      zh-Hans: |-
        潜水时装备在身上
        用来呼吸氧气的面罩。
        得文制造。
      en: |-
        A device made by Devon Corporation that provides
        oxygen to users during the use of Dive.
      fr: |-
        Un masque à oxygène fabriqué par la société
        Devon et utilisé pour la plongée sous-marine.
      de: |-
        Eine von der Devon Corporation hergestellte Maske,
        die Taucher unter Wasser mit ausreichend
        Sauerstoff versorgt.
      es: |-
        Máscara que surte de oxígeno durante las
        inmersiones en el agua. Producto de Devon S. A.
      it: |-
        Maschera di ossigeno prodotta dalla Devon,
        utile durante le immersioni.
