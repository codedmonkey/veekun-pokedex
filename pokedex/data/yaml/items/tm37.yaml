tm37:
  category: all-machines
  cost: 1000
  effect:
    en: 'Teaches Sandstorm to a compatible Pokémon.'
  flags: {  }
  flavor_text:
    ruby-sapphire:
      en: |-
        Causes a sandstorm
        that hits the foe
        over several turns.
    emerald:
      en: |-
        Causes a sandstorm
        that hits the foe
        over several turns.
    firered-leafgreen:
      en: |-
        A 5-turn sandstorm
        that damages all
        types except ROCK,
        GROUND, and STEEL.
    diamond-pearl:
      en: |-
        A five-turn sandstorm is summoned
        to hurt all combatants except the
        Rock, Ground, and Steel types.
    platinum:
      en: |-
        A five-turn sandstorm is summoned
        to hurt all combatants except the
        Rock, Ground, and Steel types.
    heartgold-soulsilver:
      en: |-
        A five-turn sandstorm is summoned
        to hurt all combatants except the
        Rock, Ground, and Steel types.
    black-white:
      en: |-
        A five-turn sandstorm is summoned
        to hurt all combatants except the
        Rock, Ground, and Steel types.
      fr: |-
        Une tempête de sable de 5 tours
        qui blesse tous les Pokémon sauf
        les types Roche, Sol et Acier.
    black-2-white-2:
      en: |-
        A five-turn sandstorm is summoned
        to hurt all combatants except the
        Rock, Ground, and Steel types.
    x-y:
      ja-Hrkt: |-
        ５ターンの　あいだ　すなあらしで
        じめん　いわ　はがね　タイプいがいに
        ダメージを　あたえる。
      ja: |-
        ５ターンの　あいだ　砂あらしで
        いわ　じめん　はがねタイプ　以外の
        ポケモンに　ダメージを　与える。
      ko: |-
        5턴 동안 모래바람으로
        바위, 땅, 강철타입 이외의
        포켓몬에게 데미지를 준다.
      en: |-
        A five-turn sandstorm is summoned
        to hurt all combatants except for
        Rock, Ground, and Steel types.
      fr: |-
        Une tempête de sable qui blesse tous les
        Pokémon durant cinq tours, sauf ceux de types
        Roche, Sol et Acier.
      de: |-
        Ein Sandsturm trifft für 5 Runden alle Pokémon,
        außer die vom Typ Boden, Gestein und Stahl.
      es: |-
        Ataque controlado que impide que el objetivo se
        debilite al dejarle con un mínimo de 1 PS.
      it: |-
        Causa una tempesta di sabbia per cinque turni
        che danneggia tutti i tipi in campo esclusi
        Terra, Roccia e Acciaio.
    sun-moon:
      ja-Hrkt: |-
        ５ターンの　あいだ　いわ　じめん
        はがねタイプ　いがいに　ダメージ。
        いわタイプの　とくぼうが　あがる。
      ja: |-
        ５ターンの　あいだ　いわ　じめん
        はがねタイプ　以外に　ダメージ。
        いわタイプの　特防が　あがる。
      ko: |-
        5턴 동안 바위, 땅, 강철타입
        이외에 데미지를 준다.
        바위타입의 특수방어가 올라간다.
      zh-Hant: |-
        在５回合內給予
        岩石、地面和鋼屬性以外的寶可夢傷害。
        岩石屬性寶可夢的特防會提高。
      zh-Hans: |-
        在５回合内，除岩石、地面和
        钢属性以外的宝可梦，都会受到伤害。
        岩石属性的特防还会提高。
      en: |-
        A five-turn sandstorm is summoned to hurt all
        combatants except the Rock, Ground, and
        Steel types. Raises the Sp. Def of Rock types.
      fr: |-
        Une tempête de sable qui blesse tous les Pokémon
        durant cinq tours, sauf ceux de type Roche, Sol ou
        Acier. Augmente la Déf. Spé. des Pokémon Roche.
      de: |-
        Ein Sandsturm trifft für 5 Runden alle Pokémon,
        bis auf jene vom Typ Boden, Gestein und Stahl.
        Erhöht die Sp.-Vert. von Gesteins-Pokémon.
      es: |-
        Daña durante cinco turnos a todos los Pokémon
        excepto a los de tipo Roca, Tierra y Acero. Aumenta
        la Defensa Especial de los Pokémon de tipo Roca.
      it: |-
        Causa una tempesta di sabbia per cinque turni che
        danneggia tutti i tipi esclusi Terra, Roccia e Acciaio.
        Aumenta la Dif. Speciale dei Pokémon di tipo Roccia.
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        ５ターンの　あいだ　いわ　じめん
        はがねタイプ　いがいに　ダメージ。
        いわタイプの　とくぼうが　あがる。
      ja: |-
        ５ターンの　あいだ　いわ　じめん
        はがねタイプ　以外に　ダメージ。
        いわタイプの　特防が　あがる。
      ko: |-
        5턴 동안 바위, 땅, 강철타입
        이외에 데미지를 준다.
        바위타입의 특수방어가 올라간다.
      zh-Hant: |-
        在５回合內給予
        岩石、地面和鋼屬性以外的寶可夢傷害。
        岩石屬性寶可夢的特防會提高。
      zh-Hans: |-
        在５回合内，除岩石、地面和
        钢属性以外的宝可梦，都会受到伤害。
        岩石属性的特防还会提高。
      en: |-
        A five-turn sandstorm is summoned to hurt all
        combatants except the Rock, Ground, and
        Steel types. Raises the Sp. Def of Rock types.
      fr: |-
        Une tempête de sable qui blesse tous les Pokémon
        durant cinq tours, sauf ceux de type Roche, Sol ou
        Acier. Augmente la Déf. Spé. des Pokémon Roche.
      de: |-
        Ein Sandsturm trifft für 5 Runden alle Pokémon,
        bis auf jene vom Typ Boden, Gestein und Stahl.
        Erhöht die Sp.-Vert. von Gesteins-Pokémon.
      es: |-
        Daña durante cinco turnos a todos los Pokémon
        excepto a los de tipo Roca, Tierra y Acero. Aumenta
        la Defensa Especial de los Pokémon de tipo Roca.
      it: |-
        Causa una tempesta di sabbia per cinque turni che
        danneggia tutti i tipi esclusi Terra, Roccia e Acciaio.
        Aumenta la Dif. Speciale dei Pokémon di tipo Roccia.
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        はげしい　ほのおを
        あいてに　はっしゃして　こうげきする。
        やけど　じょうたいに　することが　ある。
      ja: |-
        激しい　炎を
        相手に　発射して　攻撃する。
        やけど状態に　することが　ある。
      ko: |-
        세찬 불꽃을
        상대에게 발사하여 공격한다.
        화상 상태로 만들 때가 있다.
      zh-Hant: |-
        向對手發射
        強烈火焰進行攻擊。
        有時會讓對手陷入灼傷狀態。
      zh-Hans: |-
        向对手发射
        烈焰进行攻击。
        有时会让对手陷入灼伤状态。
      en: |-
        The target is scorched with an intense blast of fire.
        This may also leave the target with a burn.
      fr: |-
        L’ennemi reçoit un torrent de flammes.
        Peut aussi le brûler.
      de: |-
        Starke Feuer-Attacke, durch die das Ziel eventuell
        Verbrennungen erleidet.
      es: |-
        Ataca con una gran ráfaga de fuego que puede causar
        quemaduras.
      it: |-
        Il bersaglio viene colpito da intense fiammate
        che possono anche scottarlo.
    sword-shield:
      ja-Hrkt: |-
        みかた　ぜんいんで　こうげきする。
        なかまの　ポケモンが　おおいほど
        わざの　こうげきかいすうが　ふえる。
      ja: |-
        味方　全員で　攻撃する。
        仲間の　ポケモンが　多いほど
        技の　攻撃回数が　増える。
      ko: |-
        같은 편 전원이 공격한다.
        동료 포켓몬이 많을수록
        기술의 공격 횟수가 증가한다.
      zh-Hant: |-
        讓我方所有寶可夢進行攻擊。
        同行的寶可夢越多，
        招式的攻擊次數越多。
      zh-Hans: |-
        我方全员进行攻击。
        同行的宝可梦越多，
        招式的攻击次数越多。
      en: |-
        The user gets all party Pokémon to attack the target.
        The more party Pokémon, the greater the number
        of attacks.
      fr: |-
        Le lanceur appelle tous les Pokémon de son équipe
        à attaquer. Plus ils sont nombreux, plus il y a d’attaques.
      de: |-
        Der Anwender greift zusammen mit allen Mitgliedern
        seines Teams das Ziel an. Je mehr Pokémon sich im
        Team befinden, desto höher die Anzahl der Angriffe.
      es: |-
        Ataque de todo el equipo Pokémon. Cuantos más haya,
        más veces se atacará.
      it: |-
        Chi la usa chiama in aiuto i Pokémon della squadra:
        più ce ne sono, maggiore è il numero di attacchi.
