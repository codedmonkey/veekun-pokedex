    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        きたない　ヘドロを
        あいてに　なげつけて　こうげきする。
        どく　じょうたいに　することが　ある。
      ja: |-
        汚い　ヘドロを
        相手に　投げつけて　攻撃する。
        毒状態に　することが　ある。
      ko: |-
        더러운 오물을
        상대에게 내던져서 공격한다.
        독 상태로 만들 때가 있다.
      zh-Hant: |-
        向對手投擲污泥進行攻擊。
        有時會讓對手陷入中毒狀態。
      zh-Hans: |-
        用污泥投掷对手进行攻击。
        有时会让对手陷入中毒状态。
      en: |-
        Unsanitary sludge is hurled at the target. This may
        also poison the target.
      fr: |-
        Des détritus toxiques sont projetés sur l’ennemi.
        Peut aussi l’empoisonner.
      de: |-
        Wirft Schlamm auf das Ziel. Dieses wird eventuell
        vergiftet.
      es: 'Arroja residuos al objetivo. Puede llegar a envenenar.'
      it: |-
        Chi la usa lancia fango malsano sul bersaglio.
        Può anche avvelenarlo.
    sword-shield:
      ja-Hrkt: |-
        そらたかく　とびはねて
        ２ターンめに　あいてを　こうげきする。
        まひ　じょうたいに　することが　ある。
      ja: |-
        空高く　飛び跳ねて
        ２ターン目に　相手を　攻撃する。
        まひ状態に　することが　ある。
      ko: |-
        하늘 높이 뛰어올라
        2턴째에 상대를 공격한다.
        마비 상태로 만들 때가 있다.
      zh-Hant: |-
        彈跳到高空中，
        在下一回合攻擊對手。
        有時會讓對手陷入麻痺狀態。
      zh-Hans: |-
        弹跳到高高的空中，
        第２回合攻击对手。
        有时会让对手陷入麻痹状态。
      en: |-
        The user bounces up high, then drops on the target
        on the second turn. This may also leave the target
        with paralysis.
      fr: |-
        Le lanceur bondit très haut et plonge sur l’ennemi
        au second tour. Peut aussi le paralyser.
      de: |-
        Anwender springt und landet in der nächsten Runde
        auf dem Ziel. Das Ziel wird eventuell paralysiert.
      es: |-
        El usuario bota en el primer turno y golpea al objetivo
        en el segundo y puede llegar a paralizarlo.
      it: |-
        Chi la usa balza in alto e ricade sul bersaglio dopo
        un turno. Può anche paralizzarlo.
