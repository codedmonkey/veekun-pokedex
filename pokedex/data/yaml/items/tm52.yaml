  effect:
    en: 'Teaches Focus Blast to a compatible Pokémon.'
  flags: {  }
  flavor_text:
    diamond-pearl:
      en: |-
        The user attacks at full power.
        It may also lower the foe’s Sp. Def
        stat if it hits.
    platinum:
      en: |-
        The user attacks at full power.
        It may also lower the foe’s Sp. Def
        stat if it hits.
    heartgold-soulsilver:
      en: |-
        The user attacks at full power.
        It may also lower the foe’s Sp. Def
        stat if it hits.
    black-white:
      en: |-
        The user heightens its mental focus and
        unleashes its power.
        It may also lower the target’s Sp. Def.
      fr: |-
        Le lanceur rassemble ses forces et
        laisse éclater son pouvoir. Peut aussi
        baisser la Défense Spéciale de l’ennemi.
    black-2-white-2:
      en: |-
        The user heightens its mental focus and
        unleashes its power.
        It may also lower the target’s Sp. Def.
    x-y:
      ja-Hrkt: |-
        こんしんの　ちからで　こうげきする。
        あたった　あいての　とくぼうを
        さげることが　ある。
      ja: |-
        気合を　高めて
        ありったけの　力を　放出する。
        相手の　特防を　さげることが　ある。
      ko: |-
        기합을 높여서
        혼신의 힘을 방출한다. 상대의
        특수방어를 떨어뜨릴 때가 있다.
      en: |-
        The user heightens its mental focus and
        unleashes its power.
        This may also lower the target’s Sp. Def.
      fr: |-
        Le lanceur rassemble ses forces et laisse éclater
        son pouvoir. Peut aussi baisser la Défense
        Spéciale de l’ennemi.
      de: |-
        Ein Angriff mit aller Macht. Die Spezial-
        Verteidigung des Zieles sinkt eventuell.
      es: |-
        Quien lo usa reduce la resistencia que ofrece su
        cuerpo y gana mucho en Velocidad.
      it: |-
        Chi la usa si concentra e rilascia la sua forza.
        Può ridurre la Difesa Speciale del Pokémon
        colpito.
    sun-moon:
      ja-Hrkt: |-
        きあいを　たかめて　ありったけの
        ちからを　ほうしゅつする。　あいての
        とくぼうを　さげることが　ある。
      ja: |-
        気合を　高めて
        ありったけの　力を　放出する。
        相手の　特防を　さげることが　ある。
      ko: |-
        기합을 높여서
        혼신의 힘을 방출한다. 상대의
        특수방어를 떨어뜨릴 때가 있다.
      zh-Hant: |-
        提高氣勢，
        釋放全身所有力量。
        有時會降低對手的特防。
      zh-Hans: |-
        提高气势，
        释放出全部力量。
        有时会降低对手的特防。
      en: |-
        The user heightens its mental focus and unleashes
        its power. This may also lower the target’s Sp. Def.
      fr: |-
        Le lanceur rassemble ses forces et déchaîne
        son pouvoir. Peut aussi baisser la Défense
        Spéciale de l’ennemi.
      de: |-
        Ein Angriff mit aller Macht. Die Spezial-Verteidigung
        des Zieles sinkt eventuell.
      es: |-
        Quien lo usa ataca con toda su energía. También
        puede bajar la Defensa Especial del objetivo si lo
        alcanza.
      it: |-
        Chi la usa si concentra e rilascia la sua forza.
        Può ridurre la Difesa Speciale del Pokémon colpito.
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        きあいを　たかめて　ありったけの
        ちからを　ほうしゅつする。　あいての
        とくぼうを　さげることが　ある。
      ja: |-
        気合を　高めて
        ありったけの　力を　放出する。
        相手の　特防を　さげることが　ある。
      ko: |-
        기합을 높여서
        혼신의 힘을 방출한다. 상대의
        특수방어를 떨어뜨릴 때가 있다.
      zh-Hant: |-
        提高氣勢，
        釋放全身所有力量。
