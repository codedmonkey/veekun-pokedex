light-clay:
  category: held-items
  cost: 4000
  effect:
    en: "Held: The holder's Reflect and Light Screen will create effects lasting for eight turns rather than five.  As this item affects the move rather than the barrier itself, the effect is not lost if the holder leaves battle or drops this item."
  flags:
    - holdable
    - holdable-active
    - underground
  flavor_text:
    diamond-pearl:
      en: |-
        A Pokémon hold item that extends the
        duration of barrier moves like Light
        Screen and Reflect used by the holder.
    platinum:
      en: |-
        A Pokémon hold item that extends the
        duration of barrier moves like Light
        Screen and Reflect used by the holder.
