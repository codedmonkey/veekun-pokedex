        duration of barrier moves like Light
        Screen and Reflect used by the holder.
      fr: |-
        Objet à tenir augmentant la durée
        de capacités barrières telles que
        Mur Lumière et Protection.
    black-2-white-2:
      en: |-
        A Pokémon held item that extends the
        duration of barrier moves like Light
        Screen and Reflect used by the holder.
    x-y:
      ja-Hrkt: |-
        もたせた　ポケモンが　ひかりのかべや
        リフレクターを　つかったとき
        いつもよりも　ながく　のこる。
      ja: |-
        持たせた　ポケモンが　ひかりのかべや
        リフレクターを　使ったとき
        いつもよりも　長く　残る。
      ko: |-
        지니게 한 포켓몬이 빛의장막이나
        리플렉터를 사용했을 때
        여느 때보다 긴 시간 동안 지속된다.
      en: |-
        An item to be held by a Pokémon.
        Protective moves like Light Screen
        and Reflect will be effective longer.
      fr: |-
        Objet à tenir. Augmente la durée des capacités
        barrières telles que Mur Lumière et Protection.
      de: |-
        Ein Item zum Tragen. Verlängert die Dauer von
        Lichtschild, Reflektor etc.
      es: |-
        Prolonga la duración de ataques multiturno como
        Atadura y Constricción si la lleva un Pokémon.
      it: |-
        Strumento da dare a un Pokémon.
        Allunga la durata delle mosse barriera come
        Schermoluce e Riflesso.
