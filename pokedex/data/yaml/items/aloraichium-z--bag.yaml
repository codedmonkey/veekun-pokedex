  cost: 0
  effect:
    en: 'XXX new effect for aloraichium-z--bag'
  flags: {  }
  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        アローラちほうに　いる　ライチュウの
        １０まんボルトを　Ｚワザに　かえる
        Ｚパワーの　けっしょうを　つくりだす。
      ja: |-
        アローラ地方に　いる　ライチュウの
        １０まんボルトを　Ｚワザに　変える
        Ｚパワーの　結晶を　作りだす。
      ko: |-
        알로라지방에 있는 라이츄의
        10만볼트를 Z기술로 바꾸는
        Z파워의 결정을 만들어 낸다.
      zh-Hant: |-
        會製造出把阿羅拉地區雷丘的十萬伏特
        升級為特殊Ｚ招式的Ｚ力量結晶。
      zh-Hans: |-
        可用它来制造用于对战
        并能将阿罗拉地区雷丘的十万伏特
        升级成特殊Ｚ招式的Ｚ力量结晶。
      en: |-
        It converts Z-Power into crystals that upgrade
        Alolan Raichu’s Thunderbolt to an exclusive Z-Move.
      fr: |-
        Permet de concentrer la Force Z en un cristal,
        qui autorise le Raichu de la région d’Alola qui le
        tient à transformer son Tonnerre en capacité Z.
      de: |-
        Kristallisierte Z-Kraft, die Alola-Raichus Attacke
        Donnerblitz zu einer Z-Attacke aufstuft.
        Wird bei Bedarf automatisch vervielfacht.
      es: |-
        Concentra el Poder Z en cristales que permiten a
        los Raichu de Alola convertir su Rayo en un
        movimiento Z.
      it: |-
        Permette di creare cristalli carichi di Potere Z che
        consentono al Raichu di Alola di trasformare la
        mossa Fulmine in una mossa Z.
