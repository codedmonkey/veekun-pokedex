        かくとうの　タイプの　ジュエル。
        もたせると　いちどだけ　かくとうの
        わざの　いりょくが　つよまる。
      ja: |-
        かくとうの　タイプの　ジュエル。
        持たせると　１度だけ　かくとうの
        技の　威力が　強まる。
      ko: |-
        격투타입의 주얼.
        지니게 하면 한 번만 격투
        기술의 위력이 강해진다.
      en: |-
        A gem with an essence of combat.
        When held, it strengthens the power
        of a Fighting-type move one time.
      fr: |-
        Objet à tenir. Un joyau augmentant une fois
        la puissance des capacités de type Combat.
      de: |-
        Ein Juwel vom Typ Kampf. Es erhöht einmalig
        die Stärke einer Attacke vom Typ Kampf.
      es: |-
