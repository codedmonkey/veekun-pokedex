roller-skates:
  category: gameplay
  cost: 0
  effect:
    en: 'Allows the player to move quickly and off the grid.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        クツぞこに　ローラーが　ついている。
        じめんを　かっそう　したり
        トリックプレイを　きめたりできる。
      ja: |-
        クツ底に　ローラーが　ついている。
        地面を　滑走　したり
        トリックプレイを　決めたりできる。
      ko: |-
        신발 바닥에 롤러가 달려 있다.
        지면을 활주하거나
        트릭플레이를 할 수 있다.
      en: |-
        Attaches roller skates to the bottom
        of your shoes, allowing you to glide
        quickly around and perform tricks.
      fr: |-
        Aussi connus sous le nom de patins à roulettes,
        ils permettent de se déplacer rapidement
        et éventuellement de réaliser des figures.
      de: |-
        Schuhe mit Rädern an der Sohle. Mit ihnen kannst
        du über den Boden rollen und Tricks ausführen.
      es: |-
        Una de las misteriosas Megapiedras. Permite
        megaevolucionar a Mewtwo en combate.
      it: |-
        Pattini applicati alla suola delle scarpe.
        Permettono di pattinare e di eseguire figure.
