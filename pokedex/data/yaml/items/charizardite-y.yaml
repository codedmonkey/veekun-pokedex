charizardite-y:
  category: mega-stones
  cost: 0
  effect:
    en: 'Held: Allows Charizard to Mega Evolve into Mega Charizard Y.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        リザードンに　もたせておくと
        たたかいのとき　メガシンカが　できる
        ふしぎな　メガストーンの　いっしゅ。
      ja: |-
        リザードンに　持たせておくと
        戦いのとき　メガシンカが　できる
        不思議な　メガストーンの　一種。
      ko: |-
        리자몽에게 지니게 하면
        배틀할 때 메가진화할 수 있는
        신비한 메가스톤의 일종.
      en: |-
        One variety of the mysterious Mega Stones.
        Have Charizard hold it, and this stone will
        enable it to Mega Evolve during battle.
      fr: |-
        Une variété de Méga-Gemme.
        Tenue par un Dracaufeu, elle lui permet de
        méga-évoluer durant un combat.
      de: |-
        Einer der mysteriösen Mega-Steine. Wird er von
        einem Glurak getragen, kann es im Kampf eine
        Mega-Entwicklung durchführen.
      es: |-
        Una curiosa piedra que a algunos les puede
        parecer de gran valor.
      it: |-
        Un esemplare delle misteriose Megapietre.
        Data a Charizard, gli permette di megaevolversi
        durante la lotta.
