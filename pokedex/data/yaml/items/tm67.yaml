        be used again.
    black-white:
      en: |-
        The user gets revenge for a fainted
        ally. If an ally fainted in the previous
        turn, this attack’s damage increases.
      fr: |-
        Venge un Pokémon de l’équipe mis K.O.
        Si un Pokémon de l’équipe a été mis
        K.O. au tour d’avant, l’effet augmente.
    black-2-white-2:
      en: |-
        The user gets revenge for a fainted
        ally. If an ally fainted in the previous
        turn, this attack’s damage increases.
    x-y:
      ja-Hrkt: |-
        たおれた　みかたの　かたきを　うつ。
        まえの　ターンに　たおされて
        いると　いりょくが　あがる。
      ja: |-
        倒れた　味方の　かたきを　討つ。
        前の　ターンに　味方が
        倒されていると　威力が　あがる。
      ko: |-
        쓰러진 같은 편의 원수를 갚는다.
        앞 턴에서 같은 편이
        쓰러졌다면 위력이 올라간다.
      en: |-
        The user gets revenge for a fainted ally.
        If an ally fainted in the previous turn,
        this move becomes more powerful.
      fr: |-
        Venge un Pokémon de l’équipe mis K.O.
        Si un Pokémon de l’équipe a été mis K.O.
        au tour d’avant, l’effet augmente.
      de: |-
        Anwender rächt einen besiegten Mitstreiter.
        Wurde in der vorherigen Runde ein Mitstreiter
        besiegt, steigt die Kraft.
      es: |-
        Ataca con un tentáculo o brazo impregnado de
        veneno que puede llegar a envenenar al objetivo.
      it: |-
        Vendica un alleato messo KO. Se ciò è accaduto
        al turno precedente, il danno è maggiore.
    sun-moon:
      ja-Hrkt: |-
        とがった　つので　あいてを
        つきさして　こうげきする。
        こうげきは　かならず　あたる。
      ja: |-
        とがった　つので　相手を
        突き刺して　攻撃する。
        攻撃は　必ず　当たる。
      ko: |-
        뾰족한 뿔로 상대를
        꿰찔러서 공격한다.
        공격은 반드시 맞는다.
      zh-Hant: |-
        用尖尖的角刺進對手進行攻擊。
        攻擊必定會命中。
      zh-Hans: |-
        用尖尖的角刺入对手进行攻击。
        攻击必定会命中。
      en: |-
        The user stabs the target with a sharp horn.
        The attack never misses.
      fr: |-
        Le lanceur transperce la cible avec sa corne effilée.
        Touche toujours l’ennemi.
      de: |-
        Der Anwender durchbohrt das Ziel mit seinem
        spitzen Horn. Diese Attacke trifft immer.
      es: |-
        Ensarta al adversario con su afilada cornamenta.
        Este movimiento acierta siempre.
      it: |-
        Chi la usa colpisce il bersaglio con un corno
        appuntito. Questa mossa va sempre a segno.
