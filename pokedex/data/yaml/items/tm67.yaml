  flavor_text:
    diamond-pearl:
      en: |-
        The user recycles a single-use item
        that has been used in battle so it can
        be used again.
    platinum:
      en: |-
        The user recycles a single-use item
        that has been used in battle so it can
        be used again.
    heartgold-soulsilver:
      en: |-
        The user recycles a single-use item
