air-balloon:
  category: held-items
  cost: 4000
  effect:
    en: |-
      Held
      :   Holder is immune to []{type:ground}-type moves, []{move:spikes}, []{move:toxic-spikes}, and []{ability:arena-trap}.

          This effect does not apply during []{move:gravity} or []{move:ingrain}.

          When the holder takes damage from a move, this item is consumed.
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        When held by a Pokémon, the Pokémon
        will float into the air. When the holder
        is attacked, this item will burst.
      fr: |-
        Tenu par un Pokémon, cet objet lui
        permet de flotter dans les airs.
        Il éclate en cas d’attaque.
    black-2-white-2:
      en: |-
        When held by a Pokémon, the Pokémon
        will float into the air. When the holder
        is attacked, this item will burst.
    x-y:
      ja-Hrkt: |-
        ポケモンに　もたせると
        ポケモンが　ちゅうに　うく。
        こうげきを　うけると　われてしまう。
      ja: |-
        ポケモンに　持たせると
        ポケモンが　宙に　浮く。
        攻撃を　受けると　割れてしまう。
      ko: |-
        포켓몬에게 지니게 하면
        포켓몬이 허공에 뜬다.
        공격을 받으면 터져버린다.
      en: |-
        An item to be held by a Pokémon.
        The holder will float in the air until hit.
        Once hit, this item will burst.
      fr: |-
        Tenu par un Pokémon, cet objet lui permet de
        flotter dans les airs. Il éclate en cas d’attaque.
      de: |-
        Gibt man ihn einem Pokémon zum Tragen,
        fängt es an zu schweben. Wird es getroffen,
        platzt der Luftballon.
      es: |-
        Joya de un solo uso que potencia los
        movimientos de tipo Fantasma. Debe llevarla
        un Pokémon.
      it: |-
        Permette al Pokémon che ha questo strumento
        di fluttuare in aria. Scoppia se il Pokémon
        è colpito da un attacco.
