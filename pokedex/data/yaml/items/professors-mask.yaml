professors-mask:
  category: plot-advancement
  cost: 0
  effect:
    en: 'Lost by Professor Kukui.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        ロイヤルマスクの　ふくめん。
        プロレスラー　みずから
        ミシンで　ぬっているらしい。
      ja: |-
        ロイヤルマスクの　覆面。
        プロレスラー　自ら
        ミシンで　縫っているらしい。
      ko: |-
        로열마스크의 복면.
        프로레슬러 스스로
        재봉틀로 누빈 듯하다.
      zh-Hant: |-
        皇家蒙面人的面罩。
        好像是職業摔角手
        自己用縫紉機縫製的。
      zh-Hans: |-
        皇家蒙面人的面罩。
        好像是职业摔角手
        自己用缝纫机缝制的。
      en: |-
        The mask that belongs to The Masked Royal. 
        This pro wrestler apparently sews his mask on a
        machine himself.
      fr: |-
        Le masque de Royal Mask !
        On raconte que ce catcheur professionnel
        aurait cousu son costume lui-même.
      de: |-
        Die Maske von Mask Royale. Der Profi-Wrestler
        hat sie selbst mit der Nähmaschine genäht.
      es: |-
        La máscara de luchador de Royale, el Enmascarado.
        Muy probablemente de factura propia.
      it: |-
        Maschera di Mister Royale.
        Sembra che il famoso lottatore l’abbia realizzata
        personalmente.
