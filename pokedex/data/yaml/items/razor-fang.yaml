razor-fang:
  category: held-items
  cost: 5000
  effect:
    en: |-
      Held: When the holder attacks with most damaging moves, provides an extra 11.7% (30/256) chance for the target to flinch.
      Held by Gligar: Evolves the holder into Gliscor when it levels up.
  flags:
    - holdable
    - holdable-active
  flavor_text:
    diamond-pearl:
      en: |-
        An item to be held by a Pokémon.
        It may cause the foe to flinch when
        the holder inflicts damage.
    platinum:
      en: |-
        An item to be held by a Pokémon.
        It may cause the foe to flinch when
        the holder inflicts damage.
    heartgold-soulsilver:
      en: |-
        An item to be held by a Pokémon.
        It may cause the foe to flinch when
        the holder inflicts damage.
    black-white:
      en: |-
        An item to be held by a Pokémon.
        It may make foes and allies flinch
        when the holder inflicts damage.
      fr: |-
        Objet à tenir pouvant apeurer l’ennemi
        quand le porteur lui inflige des dégâts.
    black-2-white-2:
      en: |-
        An item to be held by a Pokémon.
        It may make foes and allies flinch
        when the holder inflicts damage.
    x-y:
      ja-Hrkt: |-
        するどく　とがった　キバ。
        もたせると　ダメージを　あたえたとき
        ひるませることが　ある。
      ja: |-
        鋭く　とがった　キバ。
        持たせると　ダメージを　与えたとき
        ひるませることが　ある。
      ko: |-
        날카롭고 뾰족한 이빨.
        지니게 하면 데미지를 줬을 때
        풀죽게 하기도 한다.
      en: |-
        An item to be held by a Pokémon.
        When the holder successfully inflicts
        damage, the target may also flinch.
      fr: |-
        Objet à tenir. Peut apeurer l’ennemi quand
        le porteur lui inflige des dégâts.
      de: |-
        Ein Item zum Tragen. Verursacht der Träger
        Schaden, schreckt das Ziel eventuell zurück.
      es: |-
        Bloquea todos los ataques. Puede fallar si se usa
        repetidamente.
      it: |-
        Strumento da dare a un Pokémon.
        Chi ce l’ha può far tentennare il nemico colpito.
