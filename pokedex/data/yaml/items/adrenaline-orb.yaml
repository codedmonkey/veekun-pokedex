adrenaline-orb:
  category: held-items
  cost: 4000
  effect:
    en: "Makes wild Pokémon more likely to summon allies.  Held: increases the holder's Speed by one stage when affected by Intimidate."
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        つかうと　なかまを　よびやすくなる。
        もたせると　いかくを　うけたとき
        すばやさが　あがる。　つかうとなくなる。
      ja: |-
        使うと　仲間を　呼びやすくなる。
        持たせると　いかくを　受けた時
        すばやさが　上がる。　使うとなくなる。
      ko: |-
        사용하면 동료를 부르기 쉬워진다.
        지니게 하면 위협을 받았을 때
        스피드가 올라간다. 사용하면 없어진다.
      zh-Hant: |-
        使用後，野生寶可夢會較常呼喚夥伴。
        攜帶後，受到威嚇時速度會提高。
        效果發動後會消失。
      zh-Hans: |-
        使用后会容易呼唤伙伴，
        但使用后会消失。
        携带后，在受到威吓时速度会提高。
      en: |-
        Using it makes wild Pokémon more likely to call for
        help. If held by a Pokémon, it boosts Speed when
        intimidated. It can be used only once.
      fr: |-
        Utilisé, augmente les chances qu’un Pokémon
        appelle du renfort, et disparaît. Équipé, augmente la
        Vitesse du porteur s’il est affecté par Intimidation.
      de: |-
        Einweg-Item, das das Rufen von Pokémon einfacher
        macht. Getragen erhöht es bei Pokémon, die unter
        dem Einfluss von Bedroher stehen, die Initiative.
      es: |-
        Aumenta la Velocidad del portador al sufrir
        Intimidación. Si se usa, hará más probable que el
        Pokémon rival pida ayuda. Desaparece tras usarla.
      it: |-
        Data a un Pokémon, aumenta la Velocità se subisce
        Prepotenza. Se usata, aumenta la probabilità che i
        Pokémon selvatici chiamino rinforzi, quindi sparisce.
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        つかうと　なかまを　なんどでも　よぶ。
        もたせると　いかくを　うけたとき
        すばやさが　あがる。　つかうとなくなる。
      ja: |-
        使うと　仲間を　何度でも　呼ぶ。
        持たせると　いかくを　受けた時
        すばやさが　上がる。　使うとなくなる。
      ko: |-
        사용하면 동료를 몇 번이고 부른다.
        지니게 하면 위협을 받았을 때
        스피드가 올라간다. 사용하면 없어진다.
      zh-Hant: |-
        使用後對手將不斷呼喚夥伴，
        但使用後就會消失。
        攜帶後，受到威嚇時速度會提高。
      zh-Hans: |-
        使用后可以一直呼唤伙伴，
        但使用后会消失。
        携带后，在受到威吓时速度会提高。
      en: |-
        Using it makes wild Pokémon call for help a number
        of times. If held by a Pokémon, it boosts Speed
        when intimidated. It can be used only once.
      fr: |-
        Utilisé, force un Pokémon à appeler du renfort
        plusieurs fois, et disparaît. Équipé, augmente la
        Vitesse du porteur s’il est affecté par Intimidation.
      de: |-
        Einweg-Item, durch das Pokémon mehrfach um Hilfe
        rufen. Getragen erhöht es bei Pokémon, die unter
        dem Einfluss von Bedroher stehen, die Initiative.
      es: |-
        Aumenta la Velocidad del portador al sufrir
        Intimidación. Si se utiliza, hará más probable que el
        Pokémon rival pida ayuda. Desaparece tras usarla.
      it: |-
        Data a un Pokémon, aumenta la Velocità se subisce
        Prepotenza. Se usata, fa sì che i Pokémon selvatici
        chiamino rinforzi a oltranza, quindi sparisce.
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        つかうと　なかまを　なんどでも　よぶ。
        もたせると　いかくを　うけたとき
        すばやさが　あがる。　つかうとなくなる。
      ja: |-
        使うと　仲間を　何度でも　呼ぶ。
        持たせると　いかくを　受けた時
        すばやさが　上がる。　使うとなくなる。
      ko: |-
        사용하면 동료를 몇 번이고 부른다.
        지니게 하면 위협을 받았을 때
        스피드가 올라간다. 사용하면 없어진다.
      zh-Hant: |-
        使用後對手將不斷呼喚夥伴，
        但使用後就會消失。
        攜帶後，受到威嚇時速度會提高。
      zh-Hans: |-
        使用后可以一直呼唤伙伴，
        但使用后会消失。
        携带后，在受到威吓时速度会提高。
      en: |-
        Using it makes wild Pokémon call for help a number
        of times. If held by a Pokémon, it boosts Speed
        when intimidated. It can be used only once.
      fr: |-
        Utilisé, force un Pokémon à appeler du renfort plusieurs
        fois, et disparaît. Équipé, augmente la Vitesse
        du porteur s’il est affecté par Intimidation.
      de: |-
        Einweg-Item, durch das Pokémon mehrfach um Hilfe
        rufen. Getragen erhöht es bei Pokémon, die unter
        dem Einfluss von Bedroher stehen, die Initiative.
      es: |-
        Aumenta la Velocidad del portador al sufrir
        Intimidación. Si se utiliza, hará más probable que el
        Pokémon rival pida ayuda. Desaparece tras usarla.
      it: |-
        Data a un Pokémon, aumenta la Velocità se subisce
        Prepotenza. Se usata, fa sì che i Pokémon selvatici
        chiamino rinforzi a oltranza, quindi sparisce.
    sword-shield:
      ja-Hrkt: |-
        ポケモンに　もたせると
        いかくを　うけたとき
        すばやさが　あがる。
      ja: |-
        ポケモンに　持たせると
        いかくを　受けた時
        すばやさが　上がる。
      ko: |-
        포켓몬에게 지니게 하면
        위협을 받았을 때
        스피드가 올라간다.
      zh-Hant: |-
        讓寶可夢攜帶後，
        受到威嚇時速度就會提高。
      zh-Hans: |-
        让宝可梦携带后，
        在受到威吓时速度会提高。
      en: |-
        If held by a Pokémon, it boosts Speed
        when intimidated.
      fr: |-
        Objet à tenir. Si le porteur subit une Intimidation,
        sa Vitesse augmente.
      de: |-
        Als getragenes Item erhöht er bei Pokémon, die unter
        dem Einfluss von Bedroher stehen, die Initiative.
      es: |-
        Aumenta la Velocidad del portador si se siente
        intimidado.
      it: |-
        Data a un Pokémon, aumenta la Velocità se subisce
        Prepotenza.
  fling_effect: ~
  fling_power: 30
