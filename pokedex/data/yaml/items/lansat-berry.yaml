    black-2-white-2:
      en: |-
        If held by a Pokémon, it raises its
        critical-hit ratio in a pinch.
    x-y:
      ja-Hrkt: |-
        ポケモンに　もたせると
        ピンチのとき　こうげきが
        きゅうしょに　あたりやすくなる。
      ja: |-
        ポケモンに　持たせると
        ピンチのとき　攻撃が
        急所に　当たりやすくなる。
      ko: |-
        포켓몬에게 지니게 하면
        위급할 때 공격이
        급소를 맞히기 쉬워진다.
      en: |-
        A Berry to be consumed by Pokémon.
        If a Pokémon holds one, its critical-hit
        ratio will increase when it’s in a pinch.
      fr: |-
        Tenue, cette Baie augmente le taux de critiques
        en cas de besoin.
      de: |-
        Als getragenes Item erhöht diese Beere die
        Volltrefferquote eines Pokémon, sobald es in
        einer Notlage steckt.
      es: |-
        Si el Pokémon que la lleva lucha en un combate,
        duplica las ganancias.
      it: |-
        Se il Pokémon che ha questa bacca si trova
        in difficoltà, la probabilità di sferrare brutti colpi
        aumenta.
