lansat-berry:
  category: in-a-pinch
  cost: 80
  effect:
    en: |-
      Held in battle
      :   When the holder has 1/4 its max [HP]{mechanic:hp} remaining or less, it consumes this item to [raise]{mechanic:raise} its [critical hit chance]{mechanic:critical-hit-chance} by one stage.
  flags:
    - holdable-active
  flavor_text:
    ruby-sapphire:
      en: |-
        A hold item that
        ups the critical-
        hit rate in a pinch.
    emerald:
      en: |-
        A hold item that
        ups the critical-
        hit rate in a pinch.
    firered-leafgreen:
      en: |-
        When held by a POKéMON, it raises
        the critical-hit ratio in a pinch.
    diamond-pearl:
      en: |-
        A Poffin ingredient.
        If held by a Pokémon, it raises its
        critical-hit ratio in a pinch.
    platinum:
      en: |-
        A Poffin ingredient.
        If held by a Pokémon, it raises its
        critical-hit ratio in a pinch.
    heartgold-soulsilver:
