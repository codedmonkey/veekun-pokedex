  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        おおむかし　うみに　すんでいた
        こだい　ポケモンの　カセキの　いちぶ。
        どんな　すがた　だったのかは　なぞ。
      ja: |-
        大昔　海に　すんでいた
        古代　ポケモンの　カセキの一部。
        どんな　姿　だったのかは　謎。
      ko: |-
        오랜 옛날 바다에 살았던
        고대 포켓몬 화석의 일부.
        어떤 모습이었는지는 수수께끼다.
      zh-Hant: |-
        很久以前棲息在海裡的
        古代寶可夢的化石碎片。
        本來面目至今仍是個謎。
      zh-Hans: |-
        远古时代的宝可梦化石残片。
        它曾栖息于大海，
        本来面目至今仍是未解之谜。
      en: |-
        The fossil of an ancient Pokémon that once lived in the
        sea. What it looked like is a mystery.
      fr: |-
        Un morceau du fossile d’un ancien Pokémon aquatique.
        Nul ne sait à quoi il ressemblait.
      de: |-
        Teilstück des Fossils eines urzeitlichen Pokémon,
        das in grauer Vorzeit im Meer lebte. Wie es zu
        Lebzeiten aussah, ist ein Rätsel.
      es: |-
        Parte del fósil de un Pokémon prehistórico que habitaba
        en el mar. Su apariencia sigue siendo una incógnita.
      it: |-
        Parte del fossile di un Pokémon preistorico che viveva
        in mare. Nessuno sa quale fosse il suo aspetto.
