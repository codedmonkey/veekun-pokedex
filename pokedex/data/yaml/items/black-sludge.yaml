black-sludge:
  category: held-items
  cost: 4000
  effect:
    en: 'Held: If the holder is Poison-type, restores 1/16 max HP at the end of each turn.  Otherwise, damages the holder by 1/16 its max HP at the end of each turn.'
  flags:
    - holdable
    - holdable-active
  flavor_text:
    diamond-pearl:
      en: |-
        A hold item that gradually restores
        the HP of Poison-type Pokémon.
        It inflicts damage on all other types.
    platinum:
      en: |-
        A hold item that gradually restores
        the HP of Poison-type Pokémon.
        It inflicts damage on all other types.
    heartgold-soulsilver:
      en: |-
        A held item that gradually restores
        the HP of Poison-type Pokémon.
        It inflicts damage on all other types.
    black-white:
      en: |-
        A held item that gradually restores
        the HP of Poison-type Pokémon.
        It inflicts damage on all other types.
      fr: |-
        Objet à tenir restaurant peu à peu les
        PV des Pokémon de type Poison. Inflige
        des dégâts à tous les autres types.
    black-2-white-2:
      en: |-
        A held item that gradually restores
        the HP of Poison-type Pokémon.
        It inflicts damage on all other types.
    x-y:
      ja-Hrkt: |-
        もたせると　どくタイプの　ポケモンは
        すこしずつ　ＨＰを　かいふくする。
        それいがいは　ＨＰが　へってしまう。
      ja: |-
        持たせると　どくタイプの　ポケモンは
        少しずつ　ＨＰを　回復する。
        それ以外は　ＨＰが　減ってしまう。
      ko: |-
        지니게 하면 독타입의 포켓몬은
        조금씩 HP를 회복한다.
        그 이외의 타입은 HP가 줄어 버린다.
      en: |-
        An item to be held by a Pokémon.
        It gradually restores HP to Poison-type
        Pokémon. It damages any other type.
      fr: |-
        Objet à tenir. Restaure peu à peu les PV des
        Pokémon de type Poison. Inflige des dégâts
        à tous les autres types.
      de: |-
        Ein Item zum Tragen, das einem Gift-Pokémon
        KP zurückgibt, anderen Pokémon aber Schaden
        zufügt.
      es: |-
        Tabla de piedra que potencia los movimientos de
        tipo Fuego. Debe llevarla un Pokémon.
      it: |-
        Strumento da dare a un Pokémon.
        Restituisce gradualmente PS ai Pokémon di tipo
        Veleno, ma danneggia tutti gli altri.
