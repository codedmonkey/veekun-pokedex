        ギラティナに　もたせると　ドラゴンと
        ゴーストタイプの　わざの　いりょくが
        あがる　ひかり　かがやく　たま。
      ja: |-
        ギラティナに　持たせると　ドラゴンと
        ゴーストタイプの　技の　威力が
        あがる　光り　輝く　珠。
      ko: |-
        기라티나에게 지니게 하면 드래곤과
        고스트타입 기술의 위력이 올라가는
        반짝반짝 빛나는 구슬.
      en: |-
        A glowing orb to be held by Giratina.
        It boosts the power of Dragon- and
        Ghost-type moves when it is held.
      fr: |-
