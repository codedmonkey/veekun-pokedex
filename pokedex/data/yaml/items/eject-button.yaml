        배틀에서 탈출하여
        지닌 포켓몬과 교체할 수 있다.
      zh-Hant: |-
        攜帶它的寶可夢如果受到招式攻擊，
        就能從戰鬥中逃脫，並和同行的
        其他寶可夢進行替換。
      zh-Hans: |-
        携带它的宝可梦如果受到招式攻击，
        就能逃脱战斗，并和同行的
        其他宝可梦进行替换。
      en: |-
