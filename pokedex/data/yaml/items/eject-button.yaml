eject-button:
  category: held-items
  cost: 4000
  effect:
    en: |-
      Held
      :   When the holder takes damage directly from a move and does not faint, it [switches out]{mechanic:switching-out} for another non-fainted Pokémon in its party, as chosen by the Trainer.
      This effect does not activate if another effect prevents the holder from switching out.
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        If the holder is hit by an attack, it will
        switch with another Pokémon in
        your party.
      fr: |-
        Si le Pokémon qui le tient subit une
        attaque, il s’enfuit pour être remplacé
        par un autre membre de l’équipe.
    black-2-white-2:
      en: |-
        If the holder is hit by an attack, it will
        switch with another Pokémon in
        your party.
    x-y:
      ja-Hrkt: |-
        もたせて　わざを　うけると
        せんとうから　だっしゅつして
        てもちと　いれかわる　ことができる。
      ja: |-
        持たせて　技を　受けると
        戦闘から　脱出して
        手持ちと　入れ替わる　ことができる。
      ko: |-
        지니게 하고 기술을 받으면
        배틀에서 탈출하여
        지닌 포켓몬과 교체할 수 있다.
      en: |-
        An item to be held by a Pokémon.
        If the holder is hit by an attack, it
        will be switched out of battle.
      fr: |-
        Si le Pokémon qui le tient subit une attaque,
        il s’enfuit pour être remplacé par un autre
        membre de l’équipe.
      de: |-
        Wird der Träger getroffen, flieht er aus dem Kampf
        und wird mit einem Team-Pokémon ausgetauscht.
      es: |-
        Pluma que aumenta un poco el Ataque de base
        de un Pokémon.
      it: |-
        Se il Pokémon che ha questo strumento è colpito
        da un attacco, viene immediatamente sostituito
        da un compagno.
    sun-moon:
      ja-Hrkt: |-
        もたせて　わざを　うけると
