tm51:
  category: all-machines
  cost: 1000
  effect:
    en: 'Teaches Roost to a compatible Pokémon.'
  flags: {  }
  flavor_text:
    diamond-pearl:
      en: |-
        The user lands and rests its body.
        It restores the user’s HP by up to
        half of its top HP.
    platinum:
      en: |-
        The user lands and rests its body.
        It restores the user’s HP by up to
        half of its max HP.
    heartgold-soulsilver:
      en: |-
        The user lands and rests its body.
        It restores the user’s HP by up to
        half of its max HP.
    black-white:
      en: |-
        The user teleports using a strange
        power and switches its place with one of
        its allies.
      fr: |-
        Le lanceur se téléporte à l’aide d’un
        pouvoir mystérieux. Il échange sa place
        avec celle d’un allié sur le terrain.
    black-2-white-2:
      en: |-
        The user teleports using a strange
        power and switches its place with one of
        its allies.
    x-y:
      ja-Hrkt: |-
        かたい　つばさを　あいてに　たたきつけて
        こうげきする。じぶんの　ぼうぎょが
        あがることが　ある。
      ja: |-
        硬い　翼を　相手に　たたきつけて
        攻撃する。自分の　防御が
        あがることが　ある。
      ko: |-
        단단한 날개를 상대에게 부딪쳐서
        공격한다. 자신의 방어가
        올라갈 때가 있다.
      en: |-
        The target is hit with wings of steel.
        This may also raise the user’s Defense stat.
      fr: |-
        Le lanceur frappe l’ennemi avec des ailes d’acier.
        Peut aussi augmenter la Défense du lanceur.
      de: |-
        Trifft das Ziel mit Stahlflügeln. Verteidigungs-Wert
        des Anwenders steigt eventuell.
      es: |-
        Quien lo usa carga contra el objetivo usando toda
        su energía y en el turno siguiente tiene que
        descansar.
      it: |-
        Colpisce il nemico con ali d’acciaio.
        Può anche aumentare la Difesa di chi la usa.
    sun-moon:
      ja-Hrkt: |-
        かたい　つばさを　あいてに　たたきつけて
        こうげきする。　じぶんの　ぼうぎょが
        あがることが　ある。
      ja: |-
        硬い　翼を　相手に　たたきつけて
        攻撃する。　自分の　防御が
        あがることが　ある。
      ko: |-
        단단한 날개를 상대에게 부딪쳐서
        공격한다. 자신의 방어가
        올라갈 때가 있다.
      zh-Hant: |-
        用堅硬的翅膀撞擊
        對手進行攻擊。
        有時會提高自己的防禦。
      zh-Hans: |-
        用坚硬的翅膀敲打
        对手进行攻击。
        有时会提高自己的防御。
      en: |-
        The target is hit with wings of steel. This may also
        raise the user’s Defense stat.
      fr: |-
        Le lanceur frappe l’ennemi avec des ailes d’acier.
        Peut aussi augmenter la Défense du lanceur.
      de: |-
        Trifft das Ziel mit Stahlflügeln. Verteidigungs-Wert
        des Anwenders steigt eventuell.
      es: |-
        Alas macizas que golpean al objetivo y pueden
        subir la Defensa del usuario.
      it: |-
        Colpisce il bersaglio con ali d’acciaio.
        Può anche aumentare la Difesa di chi la usa.
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        かたい　つばさを　あいてに　たたきつけて
        こうげきする。　じぶんの　ぼうぎょが
        あがることが　ある。
      ja: |-
        硬い　翼を　相手に　たたきつけて
        攻撃する。　自分の　防御が
        あがることが　ある。
      ko: |-
        단단한 날개를 상대에게 부딪쳐서
        공격한다. 자신의 방어가
        올라갈 때가 있다.
      zh-Hant: |-
        用堅硬的翅膀撞擊
        對手進行攻擊。
        有時會提高自己的防禦。
      zh-Hans: |-
        用坚硬的翅膀敲打
        对手进行攻击。
        有时会提高自己的防御。
      en: |-
        The target is hit with wings of steel. This may also
        raise the user’s Defense stat.
      fr: |-
        Le lanceur frappe l’ennemi avec des ailes d’acier.
        Peut aussi augmenter la Défense du lanceur.
      de: |-
        Trifft das Ziel mit Stahlflügeln. Verteidigungs-Wert
        des Anwenders steigt eventuell.
      es: |-
        Alas macizas que golpean al objetivo y pueden
        subir la Defensa del usuario.
      it: |-
        Colpisce il bersaglio con ali d’acciaio.
        Può anche aumentare la Difesa di chi la usa.
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        はげしい　ふぶきを
        あいてに　ふきつけて　こうげきする。
        こおり　じょうたいに　することが　ある。
      ja: |-
        激しい　吹雪を
        相手に　吹きつけて　攻撃する。
        こおり状態に　することが　ある。
      ko: |-
        세찬 눈보라를
        상대에게 내뿜어 공격한다.
        얼음 상태로 만들 때가 있다.
      zh-Hant: |-
        將猛烈的暴風雪
        吹向對手進行攻擊。
        有時會讓對手陷入冰凍狀態。
      zh-Hans: |-
        将猛烈的暴风雪
        刮向对手进行攻击。
        有时会让对手陷入冰冻状态。
      en: |-
        A howling blizzard is summoned to strike opposing
        Pokémon. This may also leave the opposing
        Pokémon frozen.
      fr: |-
        Une violente tempête de neige s’abat sur l’ennemi.
        Peut aussi le geler.
      de: 'Ein Schneesturm wütet, der das Ziel einfrieren kann.'
      es: 'Tormenta de hielo que puede llegar a congelar. '
      it: |-
        Colpisce i nemici intorno con una tremenda
        tempesta di ghiaccio che può anche congelarli.
    sword-shield:
      ja-Hrkt: |-
        するどい　つららを
        あいてに　はっしゃして　こうげきする。
        ２ー５かいの　あいだ　れんぞくで　だす。
      ja: |-
        鋭い　氷柱を
        相手に　発射して　攻撃する。
        ２ー５回の　間　連続で　だす。
      ko: |-
        날카로운 고드름을
        상대에게 발사하여 공격한다.
        2-5회 동안 연속으로 쓴다.
      zh-Hant: |-
        向對手發射
        尖銳的冰柱進行攻擊。
        可連續攻擊２～５次。
      zh-Hans: |-
        向对手发射
        锋利的冰柱进行攻击。
        连续攻击２～５次。
      en: |-
        The user launches sharp icicles at the target two to
        five times in a row.
      fr: |-
        Le lanceur jette des pics de glace sur l’ennemi,
        de deux à cinq fois de suite.
      de: 'Feuert zwei bis fünf Eiszapfen auf das Ziel.'
      es: |-
        Ataca lanzando de dos a cinco ráfagas consecutivas de
        carámbanos.
      it: |-
        Chi la usa spara ghiaccioli affilati contro il bersaglio
        da due a cinque volte di fila.
