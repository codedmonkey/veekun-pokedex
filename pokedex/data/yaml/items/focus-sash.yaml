focus-sash:
  category: held-items
  cost: 4000
  effect:
    en: "Held: If the holder has full HP and is attacked for regular damage that would faint it, this item is consumed and prevents the holder's HP from lowering below 1.  This effect works against multi-hit attacks, but does not work against the effects of Doom Desire or Future Sight."
  flags:
    - holdable
    - holdable-active
  flavor_text:
    diamond-pearl:
      en: |-
        An item to be held by a Pokémon. If it
        has full HP, the holder will endure one
        potential KO attack, leaving 1 HP.
    platinum:
      en: |-
        An item to be held by a Pokémon. If it
        has full HP, the holder will endure one
        potential KO attack, leaving 1 HP.
    heartgold-soulsilver:
      en: |-
        An item to be held by a Pokémon. If it
        has full HP, the holder will endure one
        potential KO attack, leaving 1 HP.
    black-white:
      en: |-
        An item to be held by a Pokémon. If it
        has full HP, the holder will endure one
        potential KO attack, leaving 1 HP.
      fr: |-
        Objet à tenir permettant au porteur,
        s’il a ses PV pleins, d’éviter un
        potentiel K.O. en conservant un PV.
    black-2-white-2:
      en: |-
        An item to be held by a Pokémon. If it
        has full HP, the holder will endure one
        potential KO attack, leaving 1 HP.
    x-y:
      ja-Hrkt: |-
        もたせると　ＨＰが　まんたんのとき
        ひんしになりそうな　わざを　うけても
        ＨＰ１で　いちどだけ　たえる。
      ja: |-
        持たせると　ＨＰが　満タンのとき
        ひんしになりそうな　技を　受けても
        ＨＰ１で　１度だけ　耐える。
      ko: |-
        지니게 하면 HP가 꽉 찼을 때
        기절할 듯한 기술을 당해도
        HP 1로 한 번은 버틴다.
      en: |-
        An item to be held by a Pokémon. If the holder
        has full HP, it will endure a potential KO
        attack with 1 HP. The item then disappears.
      fr: |-
        Objet à tenir. S’il a encore tous ses PV,
        le porteur pourra éviter d’être mis K.O. en
        un coup. Il ne conserva alors qu’un seul PV.
      de: |-
        Ein Item zum Tragen. Bei vollen KP bleibt
        der Träger nach einer K.O.-Attacke einmalig
        mit 1 KP im Kampf.
      es: |-
        Potencia la Defensa Especial de base, pero
        reduce la Velocidad en combate. Debe llevarla
        un Pokémon.
      it: |-
        Strumento da dare a un Pokémon.
        Se il Pokémon ha tutti i PS, eviterà un
        potenziale KO, rimanendo con un PS.
    sun-moon:
      ja-Hrkt: |-
        もたせると　ＨＰが　まんたんのとき
        ひんしになりそうな　わざを　うけても
        ＨＰ１で　いちどだけ　たえる。
      ja: |-
        持たせると　ＨＰが　満タンのとき
        ひんしになりそうな　技を　受けても
        ＨＰ１で　１度だけ　耐える。
      ko: |-
        지니게 하면 HP가 꽉 찼을 때
        기절할 듯한 기술을 당해도
        HP 1로 한 번은 버틴다.
      zh-Hant: |-
        攜帶後，在ＨＰ全滿時，
        即使受到可能導致瀕死的招式攻擊，
        也能以１ＨＰ僅撐過１次。
      zh-Hans: |-
        携带后，在ＨＰ全满时，
        即便受到可能会导致濒死的招式，
        也能仅以１ＨＰ撑过去１次。
      en: |-
