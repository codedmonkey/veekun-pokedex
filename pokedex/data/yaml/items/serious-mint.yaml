serious-mint:
  category: nature-mints
  cost: 20
  effect: {  }
  flags: {  }
  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        ポケモンに　かおりを　かがせると
        こうげき　ぼうぎょ　すばやさ　とくぼう
        とくこうが　まんべんなく　そだつ　ミント。
      ja: |-
        ポケモンに　香りを　かがせると
        攻撃　防御　素早さ　特防
        特攻が　万遍なく　育つ　ミント。
      ko: |-
        포켓몬에게 향기를 맡게 하면
        공격, 방어, 스피드, 특수방어
        특수공격이 골고루 오르게 되는 민트.
      zh-Hant: |-
        讓寶可夢聞這種薄荷的氣味，
        會令攻擊、防禦、速度、
        特防和特攻均衡地成長。
      zh-Hans: |-
        宝可梦闻了这种薄荷之后，
        攻击、防御、速度、
        特防、特攻能全方位提高。
      en: |-
        When a Pokémon smells this mint, all of its stats will
        grow at an equal rate.
      fr: |-
        Si un Pokémon hume cet aromate, son Attaque,
        sa Défense, sa Vitesse, son Attaque Spéciale
        et sa Défense Spéciale se développeront uniformément.
      de: |-
        Lässt man ein Pokémon an dieser Minze schnuppern,
        steigen Angriff, Verteidigung, Spezial-Angriff,
        Spezial-Verteidigung und Initiative gleichmäßig.
      es: |-
        Cuando un Pokémon percibe su aroma, su Ataque,
        Defensa, Velocidad, Defensa Especial y Ataque Especial
        crecen de forma uniforme.
      it: |-
        Quando un Pokémon ne sente il profumo, le sue
        statistiche di Attacco, Difesa, Velocità, Difesa Speciale
        e Attacco Speciale aumentano uniformemente.
