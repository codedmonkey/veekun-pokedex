red-card:
  category: held-items
  cost: 4000
  effect:
    en: |-
      Held
      :   When the holder takes damage directly from a move and does not faint, it [switches out]{mechanic:switching-out} for another random, non-fainted Pokémon in its party.
      This effect does not activate if another effect prevents the holder from switching out.
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        A card with a mysterious power. When
        the holder is struck by a foe, the
        attacker is removed from battle.
      fr: |-
        Carte au pouvoir mystérieux.
        Tenue, elle force un Pokémon touchant
        le porteur à se retirer du combat.
    black-2-white-2:
      en: |-
        A card with a mysterious power. When
        the holder is struck by a foe, the
        attacker is removed from battle.
    x-y:
      ja-Hrkt: |-
        ふしぎな　ちからのある　カード。
        もたせると　わざをうけた　あいてを
        たいじょう　させることが　できる。
      ja: |-
        不思議な　ちからのある　カード。
        持たせると　技を受けた　相手を
        退場させることが　できる。
      ko: |-
        이상한 힘이 있는 카드.
        지니게 하면 기술을 당한 상대를
        퇴장시킬 수 있다.
      en: |-
        An item to be held by a Pokémon.
        When the holder is hit by an attack,
        the attacker is removed from battle.
      fr: |-
        Une carte au pouvoir mystérieux.
        Si son porteur est touché par l’attaquant,
        ce dernier doit se retirer du combat.
      de: |-
        Eine Karte mit mysteriösen Kräften. Wird der
        Träger getroffen, wird der Angreifer des
        Platzes verwiesen.
      es: |-
        Joya de un solo uso que potencia los
        movimientos de tipo Dragón. Debe llevarla
        un Pokémon.
      it: |-
        Cartellino dal potere misterioso. Chi ce l’ha
        fa ritirare dalla lotta il Pokémon che lo ha colpito.
