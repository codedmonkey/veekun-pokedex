lumiose-galette:
  category: status-cures
  cost: 350
  effect:
    en: 'Cures all major status ailments and confusion.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        ミアレシティで　にんきの　おかし。
        ポケモン　１ひきの　じょうたいの
        いじょうを　すべて　かいふくする。
      ja: |-
        ミアレシティで　人気の　お菓子。
        ポケモン　１匹の　状態の
        異常を　すべて　回復する。
      ko: |-
        미르시티에서 인기 있는 과자.
        포켓몬 1마리의 상태 이상을
        모두 회복한다.
      en: |-
        A popular treat in Lumiose City.
        It can be used once to heal all the
        status conditions of a Pokémon.
      fr: |-
        La spécialité d’Illumis.
        Elle soigne tous les problèmes de statut
        d’un Pokémon.
      de: |-
        Eine beliebte Süßigkeit in Illumina City, die alle
        Statusprobleme eines Pokémon behebt.
      es: ''
      it: |-
        Un famoso dolce di Luminopoli.
        Può guarire un Pokémon da tutti i problemi
        di stato.
