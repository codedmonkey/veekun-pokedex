    x-y:
      ja-Hrkt: |-
        このよの　ものとは　おもえない
        ねいろが　なりひびく　ふえ。　いつ
        だれが　つくったのか　わからない。
      ja: |-
        この世の　ものとは　おもえない
        音色が　なりひびく　ふえ。　いつ
        だれが　つくったのか　わからない。
      ko: |-
        이 세상의 것이라고는 생각할 수 없는
        음색이 울려 퍼지는 피리. 언제
        누가 만들었는지 모른다.
      en: |-
        A flute that puts out echoing sounds
        that do not seem to be of this world.
        No one knows who made it.
      fr: |-
        Une flûte produisant des sons qui semblent
        provenir d’un autre monde. On ne sait pas qui
        l’a fabriquée.
      de: |-
        Eine Flöte, deren Töne nicht von dieser Welt zu
        sein scheinen. Ihr Erschaffer ist nicht bekannt.
      es: |-
        Campana de aspecto antiguo que emite un sonido
        que calma el espíritu.
      it: |-
        Flauto che emette una melodia che sembra
        appartenere a un altro mondo. Non si sa
        chi l’abbia creato.
