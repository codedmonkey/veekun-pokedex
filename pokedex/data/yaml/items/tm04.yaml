    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        ねんりきを　つかい　いっしゅんで
        ひかえの　ポケモンと　いれかわる。
      ja: |-
        念力を　使い　一瞬で
        控えの　ポケモンと　入れかわる。
      ko: |-
        염동력을 사용해서 순식간에
        교대 포켓몬과 교체한다.
      zh-Hant: |-
        使用念力，
        瞬間與後備寶可夢替換。
      zh-Hans: |-
        使用念力，
        瞬间与后备宝可梦进行替换。
      en: |-
        The user switches places with a different Pokémon
        instantly, using telekinetic power.
      fr: |-
        Le lanceur utilise sa force psychique pour se téléporter
        et échanger sa place avec un autre Pokémon de l’équipe.
      de: |-
        Anwender nutzt telekinetische Energie, um sich sofort
        gegen ein anderes Pokémon auszutauschen.
      es: |-
        El usuario emplea sus poderes telequinéticos para
        cambiar al instante el puesto con otro miembro del
        equipo.
      it: |-
        Chi la usa sfrutta la psicocinesi per farsi sostituire
        da un Pokémon della squadra.
    sword-shield:
      ja-Hrkt: |-
        れいきを　こめた　パンチで
        あいてを　こうげきする。
        こおり　じょうたいに　することが　ある。
      ja: |-
        冷気を　こめた　パンチで
        相手を　攻撃する。
        こおり状態に　することが　ある。
      ko: |-
        냉기를 담은 펀치로
        상대를 공격한다.
        얼음 상태로 만들 때가 있다.
      zh-Hant: |-
        用帶有寒氣的拳頭攻擊對手。
        有時會讓對手陷入冰凍狀態。
      zh-Hans: |-
        用充满寒气的拳头攻击对手。
        有时会让对手陷入冰冻状态。
      en: |-
        The target is punched with an icy fist. This may also
        leave the target frozen.
      fr: |-
        Un coup de poing glacé vient frapper l’ennemi.
        Peut le geler.
      de: 'Ein eisiger Schlag, der das Ziel eventuell einfriert.'
      es: 'Puñetazo helado que puede llegar a congelar.'
      it: |-
        Colpisce il bersaglio con un pugno di ghiaccio
        che può congelarlo.
