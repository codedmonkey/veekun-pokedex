    x-y:
      ja-Hrkt: |-
        しずかに　せいしんを　とういつして
        こころを　しずめることで　じぶんの
        とくこうと　とくぼうを　あげる。
      ja: |-
        静かに　精神を　統一し
        心を　鎮めることで　自分の
        特攻と　特防を　あげる。
      ko: |-
        조용히 정신을 통일해서
        마음을 가라앉혀 자신의
        특수공격과 특수방어를 올린다.
      en: |-
        The user quietly focuses its mind and
        calms its spirit to raise its Sp. Atk and
        Sp. Def stats.
      fr: |-
        Le lanceur se concentre et fait le vide dans son
        esprit pour augmenter son Attaque Spéciale et
        sa Défense Spéciale.
      de: |-
        Der Anwender konzentriert und beruhigt sich.
        So werden Spezial-Angriff und
        Spezial-Verteidigung verstärkt.
      es: |-
        Un ataque de gran potencia que resulta más
        fuerte cuanto menos le guste el Entrenador al
        Pokémon que lo usa.
      it: |-
        Chi la usa, meditando, placa il proprio spirito
        per aumentare l’Attacco Speciale e
        la Difesa Speciale.
