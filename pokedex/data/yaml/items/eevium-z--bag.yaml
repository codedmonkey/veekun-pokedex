  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        イーブイの　とっておきを
        とくべつな　Ｚワザに　グレードアップする
        Ｚパワーの　けっしょうを　つくりだす。
      ja: |-
        イーブイの　とっておきを
        特別な　Ｚワザに　グレードアップする
        Ｚパワーの　結晶を　作りだす。
      ko: |-
        이브이의 뒀다쓰기를
        특별한 Z기술로 업그레이드하는
        Z파워의 결정을 만들어 낸다.
      zh-Hant: |-
        會製造出把伊布的珍藏
        升級為特殊Ｚ招式的Ｚ力量結晶。
      zh-Hans: |-
        可用它来制造用于对战
        并能将伊布的珍藏
        升级成特殊Ｚ招式的Ｚ力量结晶。
      en: |-
        It converts Z-Power into crystals that upgrade
        Eevee’s Last Resort to an exclusive Z-Move.
      fr: |-
        Permet de concentrer la Force Z en un cristal,
        qui autorise l’Évoli qui le tient à transformer
        son Dernier Recours en capacité Z.
      de: |-
        Kristallisierte Z-Kraft, die Evolis Attacke
        Zuflucht zu einer Z-Attacke aufstuft.
        Wird bei Bedarf automatisch vervielfacht.
      es: |-
        Concentra el Poder Z en cristales que permiten a
        Eevee convertir su Última Baza en un movimiento Z.
      it: |-
        Permette di creare cristalli carichi di Potere Z che
        consentono a Eevee di trasformare la mossa
        Ultimascelta in una mossa Z.
