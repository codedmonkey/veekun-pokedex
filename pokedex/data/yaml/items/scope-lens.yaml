        じゃくてんが　みえる　レンズ。
        もたせた　ポケモンの　わざが
        きゅうしょに　あたりやすくなる。
      ja: |-
        弱点が　みえる　レンズ。
        持たせた　ポケモンの　技が
        急所に　当たりやすくなる。
      ko: |-
        약점이 보이는 렌즈.
        지니게 한 포켓몬의 기술이
        급소에 맞기 쉬워진다.
      en: |-
        An item to be held by a Pokémon.
        It’s a lens for scoping out weak points.
        It boosts the holder’s critical-hit ratio.
      fr: |-
