  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        がったいした　キュレムと
        あるポケモンを　もとどおりに
        ぶんりさせる　いっついの　くさび。
      ja: |-
        合体した　キュレムと
        あるポケモンを　元通りに
        分離させる　一対の　くさび。
      ko: |-
        합체한 큐레무와
        어떤 포켓몬을 원래대로
        분리시키는 한 쌍의 쐐기.
      zh-Hant: |-
        能讓合體後的
        酋雷姆和某寶可夢
        分離至原狀的一對楔子。
      zh-Hans: |-
        能让合体后的
        酋雷姆和某宝可梦
        分离成原状的一对楔子。
      en: |-
        A splicer that separates Kyurem and a certain
        Pokémon when they have been fused.
      fr: |-
        Un outil qui permet de séparer Kyurem et
        le Pokémon avec lequel il a fusiorbé.
      de: |-
        Ein Keil, der Kyurem und ein gewisses anderes
        Pokémon, die vereinigt wurden, voneinander trennt.
      es: |-
        Punta que permite separar a Kyurem del Pokémon
        con el que se ha fusionado.
      it: |-
        Cuneo che permette di separare Kyurem
        dal Pokémon con cui era fuso.
