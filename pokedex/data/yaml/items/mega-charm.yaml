mega-charm:
  category: unused
  cost: 0
  effect:
    en: "Unused.  This appears as the girlplayer's Mega Bracelet in Pokémon Contests, but it cannot actually be obtained."
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        メガストーンを　もったまま　たたかう
        ポケモンを　メガシンカさせる
        みちのパワーを　ひめた　チャーム。
      ja: |-
        メガストーンを　持ったまま　戦う
        ポケモンを　メガシンカさせる
        未知のパワーを　秘めた　チャーム。
      ko: |-
        메가스톤을 지닌 채로 싸우는
        포켓몬을 메가진화시키는
        미지의 힘을 가진 참.
      zh-Hant: |-
        隱藏著未知力量的墜飾。
        能讓攜帶著超級石戰鬥的
        寶可夢進行超級進化。
      zh-Hans: |-
        蕴藏着未知力量的坠饰。
        能让携带着超级石战斗的
        宝可梦进行超级进化。
      en: |-
        This charm contains an untold power that somehow
        enables Pokémon carrying Mega Stones to
        Mega Evolve in battle.
      fr: |-
        Un charme aux pouvoirs mystérieux permettant à
        un Pokémon de méga-évoluer au combat s’il tient
        la bonne Méga-Gemme.
      de: |-
        Ein Amulett mit geheimnisvollen Kräften.
        Es ermöglicht Pokémon, die einen Mega-Stein
        tragen, eine Mega-Entwicklung durchzuführen.
      es: |-
        Amuleto con un poder misterioso que permite
        megaevolucionar a Pokémon que lleven la
        Megapiedra adecuada.
      it: |-
        Ciondolo dotato di un misterioso potere.
        Consente a un Pokémon che ha una Megapietra
        di megaevolversi durante la lotta.
