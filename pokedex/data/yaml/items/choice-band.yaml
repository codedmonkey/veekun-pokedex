choice-band:
  category: choice
  cost: 4000
  effect:
    en: |-
      Held in battle
      :   Holder has 1.5× its [Attack]{mechanic:attack}.  When the holder attempts to use a move, all its other moves are disabled until it leaves battle or loses this item.

          The restriction ends even if this item is swapped for another Choice item
      via []{move:trick} or []{move:switcheroo}.
  flags:
    - holdable
    - holdable-active
  flavor_text:
    ruby-sapphire:
      en: |-
        Raises a move’s
        power, but permits
        only that move.
    emerald:
      en: |-
        Raises a move’s
        power, but permits
        only that move.
    firered-leafgreen:
      en: |-
        An item to be held by a POKéMON.
        It powers up one move, which
        becomes the only usable one.
    diamond-pearl:
      en: |-
        An item to be held by a Pokémon.
        This headband ups Attack, but allows
        the use of only one kind of move.
    platinum:
      en: |-
        An item to be held by a Pokémon.
        This headband ups Attack, but allows
        the use of only one kind of move.
    heartgold-soulsilver:
      en: |-
        An item to be held by a Pokémon.
        This headband ups Attack, but allows
        the use of only one kind of move.
    black-white:
      en: |-
        An item to be held by a Pokémon.
        This headband ups Attack, but allows
        the use of only one of its moves.
      fr: |-
        Objet à tenir. Ce bandeau monte
        l’Attaque, mais ne permet d’utiliser
        qu’une seule capacité par combat.
    black-2-white-2:
      en: |-
        An item to be held by a Pokémon.
        This headband ups Attack, but allows
        the use of only one of its moves.
    x-y:
      ja-Hrkt: |-
        ちょっと　こだわった　ハチマキ。
        もたせると　こうげきは　あがるが
        おなじ　わざしか　だせなくなる。
      ja: |-
        ちょっと　こだわった　ハチマキ。
        持たせると　攻撃は　あがるが
        同じ　技しか　だせなくなる。
      ko: |-
        기술을 구애받는 머리띠.
        지니게 하면 공격은 올라가지만
        똑같은 기술밖에 쓰지 못한다.
      en: |-
        An item to be held by a Pokémon.
        This curious headband boosts Attack
        but only allows the use of one move.
      fr: |-
        Objet à tenir. Ce bandeau augmente l’Attaque,
        mais ne permet d’utiliser qu’une seule capacité
        par combat.
      de: |-
        Ein Item, das von einem Pokémon getragen
        werden kann. Es stärkt den Angriffs-Wert,
        aber nur eine Attacke ist einsetzbar.
      es: |-
        Debe llevarla un Pokémon. La suavidad de la
        arena fortalece los movimientos de tipo Tierra.
      it: |-
        Strumento da dare a un Pokémon.
        Questa benda aumenta l’Attacco, ma permette
        l’uso di una sola mossa.
