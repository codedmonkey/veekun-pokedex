        담긴 이상한 구슬.
      zh-Hant: |-
        在這塊神奇的玉石裡，
        封存著用於產生
        釋出之力的合眾之力。
      zh-Hans: |-
        在这块神奇的玉石里，
        封存着用于产生
        释出之力的合众之力。
      en: |-
