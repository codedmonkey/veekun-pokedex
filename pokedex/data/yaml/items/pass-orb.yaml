pass-orb:
  category: held-items
  cost: 200
  effect:
    en: 'Acts as currency to activate Pass Powers in the Entralink.'
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        A mysterious orb containing the power
        of the Unova region, to be used when
        generating Pass Power.
      fr: |-
        Sphère mystérieuse contenant
        l’Aura d’Unys et utilisable
        avec l’Offri-Aura.
    black-2-white-2:
      en: |-
        A mysterious orb containing the power
        of the Unova region, to be used when
        generating Pass Power.
    x-y:
      ja-Hrkt: |-
        デルパワーを　はっせいさせる
        ときにつかう　イッシュの　パワーが
        とじこめられた　ふしぎな　たま。
      ja: |-
        デルパワーを　発生させる
        ときに使う　イッシュの　パワーが
        とじこめられた　不思議な　玉。
      ko: |-
        딜파워를 발생시킬 때
        사용하는 하나지방의 파워가
        담긴 이상한 구슬.
      en: |-
        A mysterious orb containing the power
        of the Unova region, to be used when
        generating Pass Power.
      fr: |-
        Une sphère mystérieuse contenant l’Aura d’Unys
        et permettant l’utilisation des Offri-Auras.
      de: |-
        Ein mysteriöser Orb, der die Kraft der
        Einall-Region enthält und zur Erzeugung
        von Transferkraft dient.
      es: |-
        Aumenta ligeramente el Ataque Especial en
        combate. Al cambiar de Pokémon, el efecto
        desaparece.
      it: |-
        Bilia misteriosa che racchiude l’energia di Unima
        ed è in grado di lanciare il Passapotere.
    sun-moon:
      ja-Hrkt: |-
