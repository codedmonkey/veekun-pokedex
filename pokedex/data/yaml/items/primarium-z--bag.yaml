primarium-z--bag:
  category: unused
  cost: 0
  effect:
    en: 'XXX new effect for primarium-z--bag'
  flags: {  }
  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        アシレーヌの　うたかたのアリアを
        とくべつな　Ｚワザに　グレードアップする
        Ｚパワーの　けっしょうを　つくりだす。
      ja: |-
        アシレーヌの　うたかたのアリアを
        特別な　Ｚワザに　グレードアップする
        Ｚパワーの　結晶を　作りだす。
      ko: |-
        누리레느의 물거품아리아를
        특별한 Z기술로 업그레이드하는
        Z파워의 결정을 만들어 낸다.
      zh-Hant: |-
        會製造出把西獅海壬的泡影的詠歎調
        升級為特殊Ｚ招式的Ｚ力量結晶。
      zh-Hans: |-
        可用它来制造用于对战
        并能将西狮海壬的泡影的咏叹调
        升级成特殊Ｚ招式的Ｚ力量结晶。
      en: |-
        It converts Z-Power into crystals that upgrade
        Primarina’s Sparkling Aria to an exclusive Z-Move.
      fr: |-
        Permet de concentrer la Force Z en un cristal,
        qui autorise l’Oratoria qui le tient à transformer
        son Aria de l’Écume en capacité Z.
      de: |-
        Kristallisierte Z-Kraft, die Primarenes Attacke
        Schaumserenade zu einer Z-Attacke aufstuft.
        Wird bei Bedarf automatisch vervielfacht.
      es: |-
        Concentra el Poder Z en cristales que permiten a
        Primarina convertir su Aria Burbuja en un
        movimiento Z.
      it: |-
        Permette di creare cristalli carichi di Potere Z che
        consentono a Primarina di trasformare la mossa
        Canto Effimero in una mossa Z.
