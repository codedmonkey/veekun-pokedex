gracidea:
  category: event-items
  cost: 0
  effect:
    en: |-
      Used by trainer on a []{pokemon:shaymin}
      :   Changes the target Shaymin from Land Forme to Sky Forme.

          This item cannot be used on a [frozen]{mechanic:freezing} Shaymin or at night.  Sky Forme Shaymin will revert to Land Forme overnight, when frozen, and upon entering a link battle.  This item must be used again to change it back.
  flags: {  }
  flavor_text:
    platinum:
      en: |-
        A flower sometimes bundled in bouquets
        to convey gratitude on special
        occasions like birthdays.
    heartgold-soulsilver:
      en: |-
        A flower sometimes bundled in bouquets
        to convey gratitude on special
        occasions like birthdays.
    black-white:
      en: |-
        A flower sometimes bundled in bouquets
        to convey gratitude on special
        occasions like birthdays.
      fr: |-
        Fleur que l’on offre en gage de
        reconnaissance, notamment à
        l’occasion d’un anniversaire.
    black-2-white-2:
      en: |-
        A flower sometimes bundled in bouquets
        to convey gratitude on special
        occasions like birthdays.
    x-y:
      ja-Hrkt: |-
        たんじょうびや　きねんび　などに
        かんしゃの　きもちを　つたえるため
        ブーケにして　おくることが　ある。
      ja: |-
        誕生日や　記念日などに
        感謝の　気持ちを　伝えるため
        ブーケにして　贈ることが　ある。
      ko: |-
        생일이나 기념일 등에
        감사의 마음을 전하기 위해
        부케로 만들어 보내는 일이 있다.
      en: |-
        A flower sometimes bundled in
        bouquets to convey gratitude on
        special occasions like birthdays.
      fr: |-
        Une fleur que l’on offre en gage de
        reconnaissance, notamment à l’occasion
        d’un anniversaire.
      de: |-
        Mit dieser Blume, manchmal auch als Teil eines
        Bouquets, kann man an speziellen Tagen seine
        Dankbarkeit ausdrücken.
      es: 'Bonguri de color rojo y aroma muy penetrante.'
      it: |-
        Un fiore, a volte offerto in bouquet, che
        esprime gratitudine in occasioni particolari,
        come i compleanni.
