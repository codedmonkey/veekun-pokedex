maranga-berry:
  category: other
  cost: 80
  effect:
    en: 'Held: When the holder is hit by a special move, increases its Special Defense by one stage.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        ポケモンに　もたせると
        とくしゅわざを　うけたとき
        じぶんの　とくぼうが　あがる。
      ja: |-
        ポケモンに　持たせると
        特殊技を　受けたとき
        自分の　特防が　あがる。
      ko: |-
        포켓몬에게 지니게 하면
        특수 기술을 당했을 때
        자신의 특수방어가 올라간다.
      en: |-
        If held by a Pokémon, this Berry will
        increase the holder’s Sp. Def
        if it’s hit with a special move.
      fr: |-
        Baie à tenir augmentant la Défense Spéciale
        du Pokémon lorsqu’il est touché par une attaque
        spéciale.
      de: |-
        Als getragenes Item erhöht diese Beere die
        Spezial-Verteidigung des Trägers, wenn dieser
        von Spezial-Attacken getroffen wird.
      es: |-
        Baúl ligero de increíble capacidad donde pueden
        guardarse todas las prendas de ropa adquiridas.
      it: |-
        Bacca da dare a un Pokémon.
        Se chi ce l’ha subisce una mossa speciale,
        la sua Difesa Speciale aumenta.
