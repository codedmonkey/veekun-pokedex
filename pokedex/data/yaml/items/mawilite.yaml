mawilite:
  category: mega-stones
  cost: 0
  effect:
    en: 'Held: Allows Mawile to Mega Evolve into Mega Mawile.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        クチートに　もたせておくと
        たたかいのとき　メガシンカが　できる
        ふしぎな　メガストーンの　いっしゅ。
      ja: |-
        クチートに　持たせておくと
        戦いのとき　メガシンカが　できる
        不思議な　メガストーンの　一種。
      ko: |-
        입치트에게 지니게 하면
        배틀할 때 메가진화할 수 있는
        신비한 메가스톤의 일종.
      en: |-
        One variety of the mysterious Mega Stones.
        Have Mawile hold it, and this stone will
        enable it to Mega Evolve during battle.
      fr: |-
        Une variété de Méga-Gemme.
        Tenue par un Mysdibule, elle lui permet de
        méga-évoluer durant un combat.
      de: |-
        Einer der mysteriösen Mega-Steine. Wird er von
        einem Flunkifer getragen, kann es im Kampf eine
        Mega-Entwicklung durchführen.
      es: |-
        Tarjeta con el logotipo del Team Flare que activa
        el ascensor de los Laboratorios Lysson.
      it: |-
        Un esemplare delle misteriose Megapietre.
        Data a Mawile, gli permette di megaevolversi
        durante la lotta.
    sun-moon:
