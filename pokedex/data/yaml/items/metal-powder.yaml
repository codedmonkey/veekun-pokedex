        매우 잘고 단단하다.
      en: |-
        An item to be held by Ditto.
        Extremely fine yet hard, this odd
        powder boosts the Defense stat.
      fr: |-
        Objet à faire tenir à Métamorph.
        Cette poudre étrange, très fine mais résistante,
        augmente sa Défense.
      de: |-
        Ein Item, das von Ditto getragen werden kann.
