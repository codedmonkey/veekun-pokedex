        歩くと　電池が　たまる。
      ko: |-
        풀밭에 숨어 있는 포켓몬을
        찾아내는 도구.
        걸으면 전지가 충전된다.
      en: |-
        A tool that can search out Pokémon
        that are hiding in the tall grass. Its
        battery is recharged as you walk.
      fr: |-
        Un objet permettant de trouver les Pokémon qui
        se cachent dans l’herbe. Se recharge quand vous
        marchez.
      de: |-
        Spürt Pokémon im hohen Gras auf.
        Die Batterie wird beim Reisen aufgeladen.
      es: |-
        Bicicleta plegable con la que se va más rápido
        que corriendo.
      it: |-
        Strumento con cui individuare i Pokémon
        nascosti nell’erba. La batteria si ricarica
        mentre cammini.
