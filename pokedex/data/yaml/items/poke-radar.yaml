poke-radar:
  category: gameplay
  cost: 0
  effect:
    en: 'Designates several nearby patches of grass as containing Pokémon, some of which may be special radar-only Pokémon.  Successive uses in a certain way create chains of encounters with the same species; longer chains increase the chance that a shiny Pokémon of that species will appear.'
  flags: {  }
  flavor_text:
    diamond-pearl:
      en: |-
        A tool that can search out Pokémon
        that are hiding in grass. Its battery is
        recharged as you walk.
    platinum:
      en: |-
        A tool that can search out Pokémon
        that are hiding in grass. Its battery is
