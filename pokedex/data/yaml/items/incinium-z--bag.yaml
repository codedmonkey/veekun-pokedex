  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        ガオガエンの　ＤＤラリアットを
        とくべつな　Ｚワザに　グレードアップする
        Ｚパワーの　けっしょうを　つくりだす。
      ja: |-
        ガオガエンの　ＤＤラリアットを
        特別な　Ｚワザに　グレードアップする
        Ｚパワーの　結晶を　作りだす。
      ko: |-
        어흥염의 DD래리어트를
        특별한 Z기술로 업그레이드하는
        Z파워의 결정을 만들어 낸다.
      zh-Hant: |-
        會製造出把熾焰咆哮虎的ＤＤ金勾臂
        升級為特殊Ｚ招式的Ｚ力量結晶。
      zh-Hans: |-
        可用它来制造用于对战
        并能将炽焰咆哮虎的ＤＤ金勾臂
        升级成特殊Ｚ招式的Ｚ力量结晶。
      en: |-
        It converts Z-Power into crystals that upgrade
        Incineroar’s Darkest Lariat to an exclusive Z-Move.
      fr: |-
        Permet de concentrer la Force Z en un cristal,
        qui autorise le Félinferno qui le tient à transformer
        son Dark Lariat en capacité Z.
      de: |-
        Kristallisierte Z-Kraft, die Fuegros Attacke
        Dark Lariat zu einer Z-Attacke aufstuft.
        Wird bei Bedarf automatisch vervielfacht.
      es: |-
        Concentra el Poder Z en cristales que permiten a
        Incineroar convertir su Lariat Oscuro en un
        movimiento Z.
      it: |-
        Permette di creare cristalli carichi di Potere Z che
        consentono a Incineroar di trasformare la mossa
        Braccioteso in una mossa Z.
