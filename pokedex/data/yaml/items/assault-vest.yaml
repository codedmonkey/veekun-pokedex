assault-vest:
  category: held-items
  cost: 1000
  effect:
    en: "Raises the holder's Special Defense to 1.5×.  Prevents the holder from selecting a status move."
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        こうげきてきに　なる　チョッキ。
        もたせると　とくぼうが　あがるが
        へんかわざを　だせなくなる。
      ja: |-
        攻撃的に　なる　チョッキ。
        持たせると　特防が　あがるが
        変化技を　だせなくなる。
      ko: |-
        공격적으로 변하는 조끼.
        지니게 하면 특수방어가 올라가지만
        변화 기술을 쓸 수 없게 된다.
      en: |-
        An item to be held by a Pokémon.
        This offensive vest raises Sp. Def
        but prevents the use of status moves.
      fr: |-
        Objet à tenir. Une veste augmentant la Défense
        Spéciale, mais empêchant d’utiliser des attaques
        de statut.
      de: |-
        Trägt ein Pokémon diese Weste, erhöht sich
        seine Spezial-Verteidigung, aber es kann keine
        Status-Attacken mehr einsetzen.
      es: |-
        Una de las misteriosas Megapiedras. Permite
        megaevolucionar a Venusaur en combate.
      it: |-
        Strumento da dare a un Pokémon.
        Questo corpetto aumenta la Difesa Speciale
        ma impedisce l’uso di mosse di stato.
