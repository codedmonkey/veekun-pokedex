white-herb:
  category: held-items
  cost: 4000
  effect:
    en: |-
      Held in battle
      :   At the end of each turn, if any of the holder's stats have a negative [stat modifier]{mechanic:stat-modifier}, the holder consumes this item to remove the modifiers from those stats.
  flags:
    - holdable
    - holdable-active
