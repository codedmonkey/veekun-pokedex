      ja-Hrkt: |-
        ピオニーが　おとした　ふしぎなメモ。
        マックスダイすあなに　ひかる　あなが
        ひらかれた　しゃしんが　はりつけてある。
      ja: |-
        ピオニーが　落とした　不思議なメモ。
        マックスダイ巣穴に　光の穴が
        開かれた　写真が　貼り付けてある。
      ko: |-
        피오니가 떨어뜨린 수상한 메모.
        맥스다이맥스굴에 빛나는 구멍이 열린
        사진이 붙어 있다.
      zh-Hant: |-
        皮歐尼掉落的神秘筆記。
        上面貼的照片裡可以看見
        極巨巢穴有個發光的大洞。
      zh-Hans: |-
        皮欧尼掉落的神秘笔记。
        上面贴有极巨巢穴
        出现光洞的照片。
      en: |-
        A mysterious clue that Peony seems to have dropped.
        There’s a photo attached to it showing a shining hole
        opening above the Max Lair.
      fr: |-
        Une note mystérieuse que Dhilan a égarée.
        On peut y voir la photo d’un trou de lumière,
        dans le Grand Antre Dynamax.
      de: |-
        Eine rätselhafte Notiz, die Peony verloren hat.
        Darin klebt ein Foto eines leuchtenden Lochs,
        das sich über dem Dyna-Riesennest geöffnet hat.
      es: |-
        Una extraña nota que se le cayó a Peony. Tiene pegada
        una foto del Supernido Dinamax en la que se ve una
        cavidad luminosa.
      it: |-
        Appunti misteriosi perduti da Peony.
        Vi è incollata una foto di uno squarcio luminoso
        apertosi in una dynatana max.
