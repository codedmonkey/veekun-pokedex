tyranitarite:
  category: mega-stones
  cost: 0
  effect:
    en: 'Held: Allows Tyranitar to Mega Evolve into Mega Tyranitar.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        バンギラスに　もたせておくと
        たたかいのとき　メガシンカが　できる
        ふしぎな　メガストーンの　いっしゅ。
      ja: |-
        バンギラスに　持たせておくと
        戦いのとき　メガシンカが　できる
        不思議な　メガストーンの　一種。
      ko: |-
        마기라스에게 지니게 하면
        배틀할 때 메가진화할 수 있는
        신비한 메가스톤의 일종.
      en: |-
        One variety of the mysterious Mega Stones.
        Have Tyranitar hold it, and this stone will
        enable it to Mega Evolve during battle.
      fr: |-
        Une variété de Méga-Gemme.
        Tenue par un Tyranocif, elle lui permet de
        méga-évoluer durant un combat.
      de: |-
        Einer der mysteriösen Mega-Steine. Wird er von
        einem Despotar getragen, kann es im Kampf eine
        Mega-Entwicklung durchführen.
      es: |-
        Si la lleva un Pokémon, aumenta su Defensa
        Especial tras recibir un ataque especial.
      it: |-
        Un esemplare delle misteriose Megapietre.
        Data a Tyranitar, gli permette di megaevolversi
        durante la lotta.
