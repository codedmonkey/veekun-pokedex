beast-ball:
  category: special-balls
  cost: 0
  effect:
    en: |-
      Used in battle
      :   Attempts to [catch]{mechanic:catch} a wild Pokémon.  If the wild Pokémon is an Ultra Beast, this ball has a catch rate of 5×.  Otherwise, it has a catch rate of 0.1×.

          If used in a trainer battle, nothing happens and the ball is lost.
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        ウルトラビーストを　つかまえるために
        つくられた　とくべつな　ボール
        ビースト　いがいは　つかまえにくい。
      ja: |-
        ウルトラビーストを　捕まえるために
        作られた　特別な　ボール
        ビースト　以外は　捕まえにくい。
      ko: |-
        울트라비스트를 잡기 위해
        만들어진 특별한 볼.
        비스트 이외는 잡기 어렵다.
      zh-Hant: |-
        為捕捉究極異獸而製作的特殊精靈球。
        很難捕捉究極異獸之外的寶可夢。
      zh-Hans: |-
        为捕捉究极异兽而制作的特殊精灵球。
        很难捕捉究极异兽之外的宝可梦。
      en: |-
        A special Poké Ball designed to catch Ultra Beasts.
        It has a low success rate for catching others.
      fr: |-
        Une Poké Ball spéciale créée pour pouvoir capturer
        des Ultra-Chimères. Elle n’est pas du tout efficace
        sur les autres créatures.
      de: |-
        Ein besonderer Ball zum Fangen von Ultrabestien.
        Andere Lebewesen lassen sich damit nur schwer
        fangen.
      es: |-
        Un tipo especial de Poké Ball diseñada para
        capturar de forma específica y exclusiva a los
        misteriosos seres conocidos como Ultraentes.
      it: |-
        Poké Ball speciale creata appositamente per
        catturare le Ultracreature. Non funziona bene
        con altre forme di vita.
