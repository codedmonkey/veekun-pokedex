kangaskhanite:
  category: mega-stones
  cost: 0
  effect:
    en: 'Held: Allows Kangaskhan to Mega Evolve into Mega Kangaskhan.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        ガルーラに　もたせておくと
        たたかいのとき　メガシンカが　できる
        ふしぎな　メガストーンの　いっしゅ。
      ja: |-
        ガルーラに　持たせておくと
        戦いのとき　メガシンカが　できる
        不思議な　メガストーンの　一種。
      ko: |-
        캥카에게 지니게 하면
        배틀할 때 메가진화할 수 있는
        신비한 메가스톤의 일종.
      en: |-
        One variety of the mysterious Mega Stones.
        Have Kangaskhan hold it, and this stone will
        enable it to Mega Evolve during battle.
      fr: |-
        Une variété de Méga-Gemme.
        Tenue par un Kangourex, elle lui permet de
        méga-évoluer durant un combat.
      de: |-
        Einer der mysteriösen Mega-Steine. Wird er von
        einem Kangama getragen, kann es im Kampf eine
        Mega-Entwicklung durchführen.
      es: |-
        Hace que el objetivo pierda la concentración
        contándole un secreto. Disminuye el Ataque
        Especial del oponente.
      it: |-
        Un esemplare delle misteriose Megapietre.
        Data a Kangaskhan, gli permette di megaevolversi
        durante la lotta.
