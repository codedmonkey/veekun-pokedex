rocky-helmet:
  category: held-items
  cost: 4000
  effect:
    en: |-
      Held
      :   When the holder is hit by a [contact]{mechanic:contact} move, the attacking Pokémon takes 1/6 its max [HP]{mechanic:hp} in damage.
  flags: {  }
  flavor_text:
    black-white:
      en: |-
        If the holder of this item takes damage,
        the attacker will also be damaged
        upon contact.
      fr: |-
        Tenu, cet objet inflige des dégâts
        à l’attaquant si ce dernier utilise une
        attaque physique qui atteint son but.
    black-2-white-2:
      en: |-
        If the holder of this item takes damage,
        the attacker will also be damaged
        upon contact.
    x-y:
      ja-Hrkt: |-
        ポケモンに　もたせると
        だげきわざを　うけたとき
        あいてにも　ダメージを　あたえる。
      ja: |-
        ポケモンに　持たせると
        打撃技を　受けたとき
        相手にも　ダメージを　与える。
      ko: |-
        포켓몬에게 지니게 하면
        타격 기술을 당했을 때
        상대에게도 데미지를 준다.
      en: |-
        An item to be held by a Pokémon.
        If the holder is hit, the attacker will
        also be damaged upon contact.
      fr: |-
        Tenu, cet objet inflige des dégâts à l’attaquant
        si ce dernier utilise une attaque physique qui
        atteint son but.
      de: |-
        Wird der Träger von einer physischen
        Attacke getroffen, erleidet der Angreifer
        ebenfalls Schaden.
      es: |-
        Joya de un solo uso que potencia los
        movimientos de tipo Roca. Debe llevarla
        un Pokémon.
      it: |-
        Se il Pokémon che ha questo strumento è colpito
        da una mossa fisica, anche il nemico subisce
        dei danni.
