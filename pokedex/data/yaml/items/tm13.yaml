  effect:
    en: 'Teaches Ice Beam to a compatible Pokémon.'
  flags: {  }
  flavor_text:
    ruby-sapphire:
      en: |-
        Fires an icy cold
        beam that may
        freeze the foe.
    emerald:
      en: |-
        Fires an icy cold
        beam that may
        freeze the foe.
    firered-leafgreen:
      en: |-
        The foe is struck
        with an icy beam.
        It may freeze the
        foe solid.
    diamond-pearl:
      en: |-
        The foe is struck with an icy-cold
        beam of energy. It may also freeze
        the target solid.
    platinum:
      en: |-
        The foe is struck with an icy-cold
        beam of energy. It may also freeze
        the target solid.
    heartgold-soulsilver:
      en: |-
        The foe is struck with an icy-cold
        beam of energy. It may also freeze
        the target solid.
    black-white:
      en: |-
        The target is struck with an icy-cold
        beam of energy.
        It may also freeze the target solid.
      fr: |-
        Un rayon de glace frappe l’ennemi.
        Peut aussi le geler.
    black-2-white-2:
      en: |-
        The target is struck with an icy-cold
        beam of energy.
        It may also freeze the target solid.
    x-y:
      ja-Hrkt: |-
        れいきの　ビームを　はっしゃして
        こうげきする。　あいてを　こおりの
        じょうたいに　することが　ある。
      ja: |-
        凍える　ビームを
        相手に　発射して　攻撃する。
        こおり状態に　することが　ある。
      ko: |-
        냉동빔을
        상대에게 발사하여 공격한다.
        얼음 상태로 만들 때가 있다.
      en: |-
        The target is struck with an icy-
        cold beam of energy. This may
        also leave the target frozen.
      fr: |-
        Un rayon de glace frappe l’ennemi.
        Peut aussi le geler.
      de: |-
        Das Ziel wird von einem eiskalten Energiestrahl
        getroffen. Dieser friert es eventuell ein.
      es: |-
        Lanza una bola oscura que puede bajar la
        Defensa Especial del objetivo.
      it: |-
        Il nemico è colpito da un raggio di energia gelida
        che può anche congelarlo.
    sun-moon:
      ja-Hrkt: |-
        こごえる　ビームを
        あいてに　はっしゃして　こうげきする。
        こおり　じょうたいに　することが　ある。
      ja: |-
        凍える　ビームを
        相手に　発射して　攻撃する。
        こおり状態に　することが　ある。
      ko: |-
        냉동빔을
        상대에게 발사하여 공격한다.
        얼음 상태로 만들 때가 있다.
      zh-Hant: |-
        向對手發射
        冰凍光束進行攻擊。
        有時會讓對手陷入冰凍狀態。
      zh-Hans: |-
        向对手发射
        冰冻光束进行攻击。
        有时会让对手陷入冰冻状态。
      en: |-
        The target is struck with an icy-cold beam of
        energy. This may also leave the target frozen.
      fr: |-
        Un rayon de glace frappe l’ennemi.
        Peut aussi le geler.
      de: |-
        Das Ziel wird von einem eiskalten Energiestrahl
        getroffen. Dieser friert es eventuell ein.
      es: |-
        Ataca al objetivo con un rayo de hielo que puede
        llegar a congelarlo.
      it: |-
        Il bersaglio è colpito da un raggio di energia gelida
        che può anche congelarlo.
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        こごえる　ビームを
        あいてに　はっしゃして　こうげきする。
        こおり　じょうたいに　することが　ある。
      ja: |-
        凍える　ビームを
        相手に　発射して　攻撃する。
        こおり状態に　することが　ある。
      ko: |-
        냉동빔을
        상대에게 발사하여 공격한다.
        얼음 상태로 만들 때가 있다.
      zh-Hant: |-
        向對手發射
        冰凍光束進行攻擊。
        有時會讓對手陷入冰凍狀態。
      zh-Hans: |-
        向对手发射
        冰冻光束进行攻击。
        有时会让对手陷入冰冻状态。
      en: |-
        The target is struck with an icy-cold beam of
        energy. This may also leave the target frozen.
      fr: |-
        Un rayon de glace frappe l’ennemi.
        Peut aussi le geler.
      de: |-
        Das Ziel wird von einem eiskalten Energiestrahl
        getroffen. Dieser friert es eventuell ein.
      es: |-
        Ataca al objetivo con un rayo de hielo que puede
        llegar a congelarlo.
      it: |-
        Il bersaglio è colpito da un raggio di energia gelida
        che può anche congelarlo.
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        しゅとうを　いきおいよく　ふりおろして
        あいてを　こうげきする。　ひかりのかべや
        リフレクター　なども　はかいできる。
      ja: |-
        手刀を　勢いよく　振りおろして
        相手を　攻撃する。　ひかりのかべや
        リフレクター　なども　破壊できる。
      ko: |-
        수도로 기세 좋게 내려쳐서
        상대를 공격한다. 빛의장막이나
        리플렉터 등도 파괴할 수 있다.
      zh-Hant: |-
        猛烈地揮下手刀
        攻擊對手。還可以破壞
        光牆和反射壁等。
      zh-Hans: |-
        将手刀猛烈地挥下攻击对手。
        还可以破坏光墙和反射壁等。
      en: |-
        The user attacks with a swift chop. It can also break
        barriers, such as Light Screen and Reflect.
      fr: |-
        Une attaque avec le tranchant de la main.
        Permet aussi de briser les barrières comme Mur Lumière
        et Protection.
      de: |-
        Ein beherzter Handkantenschlag.
        Durchbricht Barrieren wie Lichtschild und Reflektor.
      es: |-
        Potente ataque que también es capaz de destruir 
        barreras como Pantalla de Luz y Reflejo.
      it: |-
        Colpisce il bersaglio con una mano e rompe
        barriere come Riflesso e Schermoluce.
    sword-shield:
      ja-Hrkt: |-
        はげしく　うずをまく　ほのおの　なかに
        ４ー５ターンの　あいだ
        あいてを　とじこめて　こうげきする。
      ja: |-
        激しく　渦をまく　炎の中に
        ４ー５ターンの　間
        相手を　閉じこめて　攻撃する。
      ko: |-
        세차게 소용돌이치는 불꽃 속에
        4-5턴 동안
        상대를 가두어 공격한다.
      zh-Hant: |-
        將對手困在
        熊熊燃燒的火焰旋渦中，
        在４～５回合內進行攻擊。
      zh-Hans: |-
        将对手困在
        激烈的火焰旋涡中，
        在４～５回合内进行攻击。
      en: |-
        The target becomes trapped within a fierce vortex
        of fire that rages for four to five turns.
      fr: |-
        Un tourbillon de flammes emprisonne l’ennemi
        pendant quatre à cinq tours.
      de: |-
        Das Ziel wird für vier bis fünf Runden in einem
        Feuerkreis gefangen.
      es: |-
        Un aro de fuego que atrapa al objetivo de cuatro a
        cinco turnos.
      it: |-
        Intrappola il bersaglio in un turbine di fuoco
        che dura per quattro o cinque turni.
