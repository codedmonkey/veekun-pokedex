z-power-ring:
  category: unused
  cost: 0
  effect:
    en: 'XXX new effect for z-power-ring'
  flags: {  }
  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        トレーナーの　きりょく　たいりょくを
        つかって　ポケモンが　Ｚパワーを
        はなてるようにする　ふしぎなうでわ。
      ja: |-
        トレーナーの　気力　体力を
        使って　ポケモンが　Ｚパワーを
        放てるようにする　不思議な腕輪。
      ko: |-
        트레이너의 기력과 체력을
        사용해서 포켓몬이 Z파워를
        발산할 수 있게 하는 신비한 팔찌.
      zh-Hant: |-
        用訓練家的精力和體力
        來讓寶可夢釋放出
        Ｚ力量的神奇手環。
      zh-Hans: |-
        通过使用训练家的
        气力和体力来让宝可梦
        释放出Ｚ力量的神奇手环。
      en: |-
        A mysterious ring that enables Pokémon to use
        Z-Power. It requires both the willpower and the
        physical power of the Trainer wearing it.
      fr: |-
        Un bracelet mystérieux utilisant la force vitale
        du Dresseur pour permettre à ses Pokémon
        d’utiliser la Force Z.
      de: |-
        Ein wundersames Armband, das die geistige und
        körperliche Kraft eines Trainers nutzt, um bei
        einem Pokémon die Z-Kraft freizusetzen.
      es: |-
        Misteriosa pulsera que transmite la fuerza física y
        mental del Entrenador a sus Pokémon, lo que les
        permite usar movimientos Z.
      it: |-
        Bracciale misterioso che trasmette le energie
        mentali e fisiche dell’Allenatore ai suoi Pokémon,
        permettendo loro di sfruttare il Potere Z.
