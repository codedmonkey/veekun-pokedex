        フタバタウンから　たびだった
        おさななじみに　わたすように
        たのまれた　おとどけもの。
      ja: |-
        フタバタウンから　旅立った
        幼なじみに　渡すように
        頼まれた　おとどけもの。
      ko: |-
        떡잎마을에서 여행을 떠난
        소꿉친구에게 건네주도록
        부탁받은 물건.
      en: |-
        A parcel entrusted into your care.
