  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        おおむかし　そらを　とんでいた
        こだい　ポケモンの　カセキの　いちぶ。
        どんな　すがた　だったのかは　なぞ。
      ja: |-
        大昔　空を　飛んでいた
        古代　ポケモンの　カセキの一部。
        どんな　姿　だったのかは　謎。
      ko: |-
        오랜 옛날 하늘을 날던
        고대 포켓몬 화석의 일부.
        어떤 모습이었는지는 수수께끼다.
      zh-Hant: |-
        很久以前曾翱翔天際的
        古代寶可夢的化石碎片。
        本來面目至今仍是個謎。
      zh-Hans: |-
        远古时代的宝可梦化石残片。
        它曾翱翔于天空，
        本来面目至今仍是未解之谜。
      en: |-
        The fossil of an ancient Pokémon that once soared
        through the sky. What it looked like is a mystery.
      fr: |-
        Un morceau du fossile d’un ancien Pokémon volant.
        Nul ne sait à quoi il ressemblait.
      de: |-
        Teilstück des Fossils eines urzeitlichen Pokémon,
        das in grauer Vorzeit durch die Lüfte flog. Wie es
        zu Lebzeiten aussah, ist ein Rätsel.
      es: |-
        Parte del fósil de un Pokémon prehistórico que surcaba
        los cielos. Su apariencia sigue siendo una incógnita.
      it: |-
        Parte del fossile di un Pokémon preistorico che solcava
        i cieli. Nessuno sa quale fosse il suo aspetto.
