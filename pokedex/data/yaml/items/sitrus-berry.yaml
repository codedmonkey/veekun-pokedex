sitrus-berry:
  category: medicine
  cost: 80
  effect:
    en: |-
      Held in battle
      :   When the holder has 1/2 its max [HP]{mechanic:hp} remaining or less, it consumes this item to restore 1/4 its max HP.

      Used on a party Pokémon
      :   Restores 1/4 the Pokémon's max [HP]{mechanic:hp}.
  flags:
    - holdable-active
  flavor_text:
    ruby-sapphire:
      en: |-
        A hold item that
        restores 30 HP in
        battle.
    emerald:
      en: |-
        A hold item that
        restores 30 HP in
        battle.
    firered-leafgreen:
      en: |-
        When held by a POKéMON, it will be
        used in battle to restore 30 HP.
    diamond-pearl:
      en: |-
        A Poffin ingredient. It may be used
        or held by a Pokémon to heal the
        user’s HP a little.
    platinum:
