  flavor_text:
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        ルナアーラの　シャドーレイを
        Ｚワザに　グレードアップする
        Ｚパワーの　けっしょうを　つくりだす。
      ja: |-
        ルナアーラの　シャドーレイを
        Ｚワザに　グレードアップする
        Ｚパワーの　結晶を　つくりだす。
      ko: |-
        루나아라의 섀도레이를
        Z기술로 업그레이드하는
        Z파워의 결정을 만들어 낸다.
      zh-Hant: |-
        可用來製造將
        露奈雅拉的暗影之光
        升級為Ｚ招式的Ｚ力量結晶。
      zh-Hans: |-
        可用它来制造用于对战
        并能将露奈雅拉的暗影之光
        升级成Ｚ招式的Ｚ力量结晶。
      en: |-
        It converts Z-Power into crystals that upgrade
        Lunala’s Moongeist Beam to an exclusive Z-Move.
      fr: |-
        Permet de concentrer la Force Z en un cristal
        qui, tenu, autorise Lunala à transformer son
        Rayon Spectral en capacité Z.
      de: |-
        Kristallisierte Z-Kraft, die Lunalas Attacke
        Schattenstrahl zu einer Z-Attacke aufstuft.
        Wird bei Bedarf automatisch vervielfacht.
      es: |-
        Concentra el Poder Z en cristales que permiten a
        Lunala convertir su Rayo Umbrío en un
        movimiento Z.
      it: |-
        Permette di creare cristalli carichi di Potere Z che
        consentono a Lunala di trasformare la mossa
        Raggio d’Ombra in una mossa Z.
