    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        カマや　ツメを　ハサミのように
        こうさ　させながら　あいてを　きりさく。
      ja: |-
        カマや　ツメを　ハサミのように
        交差させながら　相手を　切り裂く。
      ko: |-
        낫이나 발톱을 가위처럼
        교차시키면서 상대를 베어 가른다.
      zh-Hant: |-
        將鐮刀或爪子像剪刀般地交叉，
        順勢劈開對手。
      zh-Hans: |-
        将镰刀或爪子像剪刀般地交叉，
        顺势劈开对手。
      en: |-
        The user slashes at the target by crossing its
        scythes or claws as if they were a pair of scissors.
      fr: |-
        Le lanceur taillade l’ennemi en utilisant ses faux
        ou ses griffes comme une paire de ciseaux.
      de: |-
        Der Anwender führt eine Attacke aus, die einer
        Scherenbewegung ähnelt.
      es: |-
        Cruza las guadañas o las garras para atacar al objetivo
        como si fueran unas tijeras.
      it: |-
        Chi la usa colpisce il bersaglio con un attacco
        che ricorda un colpo di forbici.
    sword-shield:
      ja-Hrkt: |-
        じぶんが　ねている　ときに
        ざつおんを　だして　こうげきする。
        あいてを　ひるませる　ことが　ある。
      ja: |-
        自分が　寝ているときに
        雑音を　だして　攻撃する。
        相手を　ひるませることが　ある。
      ko: |-
        자신이 잠들어 있을 때
        소음을 내어 공격한다.
        상대를 풀죽게 만들 때가 있다.
      zh-Hant: |-
        在自己睡著時，
        發出噪音進行攻擊。
        有時會讓對手畏縮。
      zh-Hans: |-
        在自己睡觉时，
        发出噪音进行攻击。
        有时会使对手畏缩。
      en: |-
        This attack can be used only if the user is asleep.
        The harsh noise may also make the target flinch.
      fr: |-
        Une attaque qui ne fonctionne que si le lanceur
        est endormi. Le boucan peut aussi apeurer l’ennemi.
      de: |-
        Attacke nur im Schlaf möglich. Ziel schreckt
        eventuell zurück.
      es: |-
        Fuerte ronquido que solo puede usarse dormido.
        Puede amedrentar al objetivo.
      it: |-
        Mossa che può essere usata solo mentre si dorme.
        Il chiasso assordante può anche far tentennare il
        bersaglio.
