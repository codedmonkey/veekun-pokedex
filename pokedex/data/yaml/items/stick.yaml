stick:
  category: species-specific
  cost: 1000
  effect:
    en: "Held by Farfetch'd: Raises the holder's critical hit counter by 2."
  flags:
    - holdable
  flavor_text:
    ruby-sapphire:
      en: |-
        A stick of leek.
        It can be sold
        cheaply.
    emerald:
      en: |-
        A hold item that
        raises FARFETCH’D’s
        critical-hit ratio.
    firered-leafgreen:
      en: |-
        A stick of leek to be held by a
        FARFETCH’D. It raises FARFETCH’D’s
        critical-hit ratio.
    diamond-pearl:
      en: |-
        An item to be held by FARFETCH’D. It is
