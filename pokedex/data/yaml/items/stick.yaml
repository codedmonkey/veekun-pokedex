    black-2-white-2:
      en: |-
        An item to be held by Farfetch’d. It is
        a very long and stiff stalk of leek
        that boosts the critical-hit ratio.
    x-y:
      ja-Hrkt: |-
        とても　ながくて　かたい　クキ。
        カモネギに　もたせると　わざが
        きゅうしょに　あたりやすくなる。
      ja: |-
        とても　長くて　硬い　クキ。
        カモネギに　持たせると　技が
        急所に　当たりやすくなる。
      ko: |-
        매우 길고 단단한 줄기.
        파오리에게 지니게 하면 기술이
        급소에 맞기 쉬워진다.
      en: |-
        An item to be held by Farfetch’d.
        This very long and stiff stalk of
        leek boosts its critical-hit ratio.
      fr: |-
        Objet à faire tenir à Canarticho.
        Un poireau très long et solide qui augmente
        son taux de critiques.
      de: |-
        Ein Item, das von Porenta getragen werden
        kann. Diese lange Lauchstange erhöht die
        Volltrefferquote stark.
      es: |-
        Debe llevarlo un Pokémon. Si se mueve después
        del enemigo, aumenta la Precisión del Pokémon.
      it: |-
        Strumento da dare a Farfetch’d.
        Lungo gambo di porro che aumenta molto
        la probabilità di sferrare brutti colpi.
    sun-moon:
      ja-Hrkt: |-
