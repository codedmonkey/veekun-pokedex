        la usa è scottato, avvelenato o paralizzato.
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        ばくはつを　おこして　じぶんの
        まわりに　いるものを　こうげきする。
        つかった　あとに　ひんしに　なる。
      ja: |-
        爆発を　おこして　自分の
        周りに　いるものを　攻撃する。
        使ったあとに　ひんしに　なる。
      ko: |-
        폭발을 일으켜서 자신의
        주위에 있는 포켓몬을 공격한다.
        쓰고 나서 기절하게 된다.
      zh-Hant: |-
        引起爆炸，
        攻擊自己周圍所有的寶可夢。
        使用後自己會陷入瀕死。
      zh-Hans: |-
        引发爆炸，
        攻击自己周围所有的宝可梦。
        使用后陷入濒死。
      en: |-
        The user attacks everything around it by causing an
        explosion. The user faints upon using this move.
      fr: |-
        Le lanceur explose en blessant tous les Pokémon
        autour de lui. Le lanceur tombe K.O.
      de: |-
        Anwender verursacht eine Explosion, mit der er
        rundum Riesenschaden anrichtet und selbst
        kampfunfähig wird.
      es: |-
        El atacante explota y hiere a todos a su alrededor. 
        El usuario se debilita de inmediato.
      it: |-
        Chi la usa esplode e infligge danni ai Pokémon
        che ha intorno, ma poi va KO.
    sword-shield:
      ja-Hrkt: |-
        あいてから　わざを　うけていると
        その　あいてに　たいして
        あたえる　ダメージが　２ばいに　なる。
      ja: |-
        相手から　技を　受けていると
        その相手に　対して
        与える　ダメージが　２倍に　なる。
      ko: |-
        상대에게 기술을 받으면
        그 상대에게 주는 데미지가
        2배가 된다.
      zh-Hant: |-
        如果受到對手的招式攻擊，
        給予該對手的傷害就會變成２倍。
      zh-Hans: |-
        如果受到对手的招式攻击，
        就能给予对手２倍的伤害。
      en: |-
        This attack move’s power is doubled if the user has
        been hurt by the opponent in the same turn.
      fr: |-
        Une attaque deux fois plus puissante si le lanceur
        a été blessé par l’ennemi durant ce tour.
      de: |-
        Schaden verdoppelt sich, wenn der Anwender in der
        Runde bereits Schaden durch das Ziel erlitten hat.
      es: |-
        Ataque que produce el doble de daño si el usuario
        resulta herido en el mismo turno.
      it: |-
        Mossa d’attacco che infligge un danno doppio
        se si è stati colpiti dal Pokémon bersaglio nello
        stesso turno.
