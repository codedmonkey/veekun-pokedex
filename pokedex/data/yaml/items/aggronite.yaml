aggronite:
  category: mega-stones
  cost: 0
  effect:
    en: 'Held: Allows Aggron to Mega Evolve into Mega Aggron.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        ボスゴドラに　もたせておくと
        たたかいのとき　メガシンカが　できる
        ふしぎな　メガストーンの　いっしゅ。
      ja: |-
        ボスゴドラに　持たせておくと
        戦いのとき　メガシンカが　できる
        不思議な　メガストーンの　一種。
      ko: |-
        보스로라에게 지니게 하면
        배틀할 때 메가진화할 수 있는
        신비한 메가스톤의 일종.
      en: |-
        One variety of the mysterious Mega Stones.
        Have Aggron hold it, and this stone will
        enable it to Mega Evolve during battle.
      fr: |-
        Une variété de Méga-Gemme.
        Tenue par un Galeking, elle lui permet de
        méga-évoluer durant un combat.
      de: |-
        Einer der mysteriösen Mega-Steine. Wird er von
        einem Stolloss getragen, kann es im Kampf eine
        Mega-Entwicklung durchführen.
      es: |-
        Si la lleva un Pokémon, debilita un ataque
        supereficaz de tipo Hada de un enemigo.
      it: |-
        Un esemplare delle misteriose Megapietre.
        Data ad Aggron, gli permette di megaevolversi
        durante la lotta.
    sun-moon:
      ja-Hrkt: |-
