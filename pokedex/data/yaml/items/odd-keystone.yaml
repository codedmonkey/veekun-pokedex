odd-keystone:
  category: dex-completion
  cost: 2100
  effect:
    en: "Place in the tower on []{location:sinnoh-route-209}.  Check the stone to encounter a []{pokemon:spiritomb}, as long as the trainer's Underground status card counts at least 32 greetings."
  flags:
    - underground
  flavor_text:
    diamond-pearl:
      en: |-
        A vital item that is needed to keep a
        stone tower from collapsing. Voices
        can be heard from it occasionally.
