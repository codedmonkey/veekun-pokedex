        Ein wichtiges Item, mit dem ein Steinturm
        repariert werden kann.
      es: |-
        Vital para impedir que una torre de piedra se
        derrumbe. A veces se oyen voces en su interior.
      it: |-
        Strumento importante che impedisce il crollo
        di un pozzo di pietra. A volte dal suo interno
        provengono delle voci.
