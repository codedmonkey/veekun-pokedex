        A vital item that is needed to keep a
        stone tower from collapsing. Voices
        can be heard from it occasionally.
      fr: |-
        Objet très important qui empêche une
        tour en pierre de s’écrouler. Des
        bruits de voix en sortent parfois.
    black-2-white-2:
      en: |-
        A vital item that is needed to keep a
        stone tower from collapsing. Voices
        can be heard from it occasionally.
    x-y:
      ja-Hrkt: |-
        これがないと　いしのとうが
        くずれてしまう　だいじないし。
        ときどき　いしから　こえがきこえる。
      ja: |-
        これがないと　石の塔が
        崩れてしまう　大事な石。
        ときどき　石から　声が聞こえる。
      ko: |-
        이것이 없으면 돌탑이
        무너져버리는 중요한 돌.
        가끔 돌에서 목소리가 들린다.
      en: |-
        A vital item that is needed to keep a
        stone tower from collapsing. Voices
        can be heard from it occasionally.
