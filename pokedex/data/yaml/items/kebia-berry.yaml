kebia-berry:
  category: type-protection
  cost: 80
  effect:
    en: |-
      Held in battle
      :   When the holder would take [super-effective]{mechanic:super-effective} []{type:poison}-type damage, it consumes this item to halve the amount of damage taken.
  flags:
    - holdable-active
  flavor_text:
    diamond-pearl:
      en: |-
        A Poffin ingredient. If held by a
        Pokémon, it weakens a foe’s
        supereffective Poison-type attack.
    platinum:
      en: |-
        A Poffin ingredient. If held by a
        Pokémon, it weakens a foe’s
        supereffective Poison-type attack.
    heartgold-soulsilver:
      en: |-
        If held by a Pokémon, it weakens a foe’s
        supereffective Poison-type attack.
    black-white:
      en: |-
        Weakens a supereffective Poison-type
        attack against the holding Pokémon.
      fr: |-
        Tenue, cette Baie affaiblit une attaque
        ennemie super efficace de type Poison.
    black-2-white-2:
      en: |-
        Weakens a supereffective Poison-type
        attack against the holding Pokémon.
    x-y:
      ja-Hrkt: |-
        ポケモンに　もたせると
        こうかばつぐんの　どく　わざを
        うけたとき　いりょくが　よわまる。
      ja: |-
        ポケモンに　持たせると
        効果バツグンの　どく技を
        受けたとき　威力が　弱まる。
      ko: |-
        포켓몬에게 지니게 하면
        효과가 뛰어난 독 기술을
        당했을 때 위력이 약해진다.
      en: |-
        If held by a Pokémon, this Berry will
        lessen the damage taken from one
        supereffective Poison-type attack.
      fr: |-
        Tenue, cette Baie affaiblit une attaque ennemie
        super efficace de type Poison.
      de: |-
        Als getragenes Item schwächt diese Beere
        sehr effektive Attacken des Angreifers
        vom Typ Gift.
      es: |-
        Si la lleva un Pokémon, aumenta mucho una
        característica en un momento de apuro.
      it: |-
        Se un Pokémon ha questa bacca, l’attacco
        superefficace di tipo Veleno del nemico
        viene indebolito.
