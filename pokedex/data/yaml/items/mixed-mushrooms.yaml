mixed-mushrooms:
  category: curry-ingredients
  cost: 400
  effect: {  }
  flags: {  }
  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        キャンプの　りょうりに　つかう
        しょくざいの　いっしゅ。いろんな　キノコの
        はごたえが　しょっかんを　かえてくれる。
      ja: |-
        キャンプの　料理に　使う
        食材の　一種。いろんな　キノコの
        歯応えが　食感を　変えてくれる。
      ko: |-
        캠프 요리에 사용되는
        식재료 중 하나. 다양한 버섯의
        질감이 식감을 바꿔준다.
      zh-Hant: |-
        製作露營料理時使用的食材之一。
        各種菇類的嚼勁
        會改變料理的口感。
      zh-Hans: |-
        在露营营地制作料理时会使用的
        一种食材。各种菌菇混在一起的嚼劲
        会为口感带来变化。
      en: |-
        One of the many ingredients that can be used for
        cooking at your camp. The chewy texture of the
        mushrooms transforms any dish they’re added to.
      fr: |-
        Un ingrédient de cuisine pour le camping.
        La texture unique de chaque champignon
        influence la sensation en bouche du curry.
      de: |-
        Eine Zutat für PokéCamping-Mahlzeiten. Die Konsistenz
        der verschiedenen Pilzsorten verleiht dem Curry eine
        besondere Note.
      es: |-
        Un ingrediente para cocinar en el campamento. Los
        distintos tipos de setas aportan diferentes texturas al
        curri.
      it: |-
        Uno degli ingredienti che puoi usare per cucinare
        in campeggio. La diversa consistenza dei vari tipi
        di funghi dona al piatto un sapore ancora più ricco.
