x-accuracy:
  category: stat-boosts
  cost: 1000
  effect:
    en: |-
      Used on a party Pokémon in battle
      :   [Raises]{mechanic:raise} the target's [accuracy]{mechanic:accuracy} by one stage.  Increases happiness by 1/1/0.
  flags:
    - countable
    - consumable
    - usable-in-battle
    - holdable
  flavor_text:
    ruby-sapphire:
      en: |-
        Raises accuracy
        of attack moves
        during one battle.
    emerald:
      en: |-
        Raises accuracy
        of attack moves
        during one battle.
    firered-leafgreen:
      en: |-
        Raises the accuracy stat of
        POKéMON in battle. Wears off if the
        POKéMON is withdrawn.
    diamond-pearl:
      en: |-
        An item that raises the accuracy
        of a Pokémon in battle. It wears off if
        the Pokémon is withdrawn.
    platinum:
      en: |-
        An item that raises the accuracy
        of a Pokémon in battle. It wears off if
        the Pokémon is withdrawn.
    heartgold-soulsilver:
      en: |-
        An item that raises the accuracy
        of a Pokémon in battle. It wears off if
        the Pokémon is withdrawn.
    black-white:
      en: |-
        An item that raises the accuracy
        of a Pokémon in battle. It wears off if
        the Pokémon is withdrawn.
      fr: |-
        Monte la Précision pendant un combat.
        L’effet s’estompe si le Pokémon se
        retire.
    black-2-white-2:
      en: |-
        An item that raises the accuracy
        of a Pokémon in battle. It wears off if
        the Pokémon is withdrawn.
    x-y:
      ja-Hrkt: |-
        せんとうちゅうの　ポケモンの
        めいちゅうを　あげる　どうぐ。
        ひっこめると　もとに　もどる。
      ja: |-
        戦闘中の　ポケモンの
        命中を　あげる　道具。
        ひっこめると　元に　戻る。
      ko: |-
        배틀 중인 포켓몬의 명중률을 올리는
        도구. 포켓몬을 볼에 넣어버리면
        원래대로 되돌아간다.
      en: |-
        An item that boosts the accuracy of
        a Pokémon during a battle. It wears
        off once the Pokémon is withdrawn.
      fr: |-
        Augmente la Précision pendant un combat.
        L’effet disparaît si le Pokémon se retire.
      de: |-
        Hebt die Genauigkeit eines Pokémon im Kampf.
        Die Wirkung wird mit dem Austausch des
        Pokémon beendet.
      es: |-
        Aumenta la Precisión de los ataques en combate.
        Al cambiar de Pokémon, el efecto desaparece.
      it: |-
        Aumenta la precisione di un Pokémon in una
        lotta. L’effetto svanisce se il Pokémon
        è sostituito.
    sun-moon:
      ja-Hrkt: |-
        せんとうちゅうの　ポケモンの
