        원래대로 되돌아간다.
      zh-Hant: |-
        大大提高戰鬥中
        寶可夢命中的道具。
        離場後，效果便會消失。
      zh-Hans: |-
        大幅提高战斗中
        宝可梦命中的道具。
        离场后，效果便会消失。
      en: |-
