ride-pager:
  category: unused
  cost: 0
  effect:
    en: 'Allows the player to summon a Ride Pokémon.  Unused, as this can be done simply by pressing Y.'
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        ナンバーを　うちこむことで
        たいおうした　ライドポケモンを
        しゅんじに　よびだす　どうぐ。
      ja: |-
        ナンバーを　うちこむことで
        対応した　ライドポケモンを
        瞬時に　呼びだす　道具。
      ko: |-
        넘버를 입력하는 것으로
        대응하는 라이드포켓몬을
        순식간에 불러내는 도구.
      zh-Hant: |-
        透過輸入編號，瞬間叫出
        與編號對應的坐騎寶可夢的道具。
      zh-Hans: |-
        通过输入编号，瞬间召唤
        与编号对应的坐骑宝可梦的道具。
      en: |-
        By entering certain numbers on this pager,
        you can summon Ride Pokémon in an instant.
      fr: |-
        Un appareil permettant d’appeler une Poké Monture
        instantanément en tapant le bon numéro.
      de: |-
        Ein Gerät, mit dem durch die Eingabe einer Nummer
        das entsprechende Pokémon für PokéMobil gerufen
        wird.
      es: |-
        Dispositivo dotado de un teclado numérico con
        el que llamar a diversas Pokémonturas.
      it: |-
        Dispositivo che permette di chiamare i Pokémon
        del Poképassaggio digitando il numero
        corrispondente.
