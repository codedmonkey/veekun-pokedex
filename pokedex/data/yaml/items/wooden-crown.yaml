  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        き　で　ほられた　なぞの　かたまり。
        かけているような　あとが　あり
        なにかの　いちぶ　なのかもしれない。
      ja: |-
        木で　彫られた　謎の　かたまり。
        欠けているような　跡が　あり
        なにかの一部　なのかもしれない。
      ko: |-
        나무로 만들어진 수수께끼의 덩어리.
        뭔가가 빠진 듯한 흔적이 있는 것으로 보아
        무엇인가의 일부일지도 모른다.
      zh-Hant: |-
        神秘的木頭雕刻。
        上面有著像是缺損的痕跡，
        很可能是某種東西的一部分。
      zh-Hans: |-
        用木头雕制而成的神秘物体。
        上面有看起来缺了什么的痕迹。
        可能是其他物品的一部分。
      en: |-
        A mysterious object made of wood. Part of it seems to
        be chipped. Maybe it’s meant to be part of something.
      fr: |-
        Une mystérieuse sculpture en bois.
        On dirait qu’il lui manque un morceau, comme
        s’il s’agissait d’un fragment de quelque chose.
      de: |-
        Eine rätselhafte Holzschnitzerei, die aussieht, als sei
        etwas von ihr abgebrochen. Vielleicht ist sie Teil von
        etwas anderem.
      es: |-
        Un misterioso objeto hecho de madera. Las marcas que
        presenta parecen indicar que no está completo, como si
        formase parte de algo.
      it: |-
        Un misterioso pezzo di legno intagliato. Ha dei segni
        che fanno pensare a una parte mancante.
