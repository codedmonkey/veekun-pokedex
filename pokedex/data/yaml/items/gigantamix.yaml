  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        キャンプ　りょうりの　しょくざい。
        ひとふりで　カレーを　きょだいに　する
        ふしぎな　スパイス。
      ja: |-
        キャンプ　料理の　食材。
        一振りで　カレーを　巨大に　する
        不思議な　スパイス。
      ko: |-
        캠프 요리의 식재료.
        조금만 넣어도 카레를 거대하게 만드는
        신기한 향신료.
      zh-Hant: |-
        製作露營料理時使用的食材。
        神奇的香料，輕輕一撒就能
        讓咖哩變得巨大無比。
      zh-Hans: |-
        在露营营地制作料理时会使用的食材。
        只要把这种神奇的香辛料往咖喱上
        轻轻一撒，咖喱就会变得巨大无比。
      en: |-
        One of the many ingredients that can be used for
        cooking at your camp. A mysterious spice. Even a tiny
        sprinkle is sure to make a curry gigantic.
      fr: |-
        Un ingrédient de cuisine pour le camping.
        Une simple pincée de cette épice mystérieuse
        permet de donner une taille démesurée au curry.
      de: |-
        Eine Zutat für PokéCamping-Mahlzeiten. Dieses
        geheimnisvolle Gewürz macht Currygerichte auf
        einen Schlag gigantisch.
      es: |-
        Un ingrediente para cocinar en el campamento. Una
        pizca de esta extraña especia basta para elaborar un
        curri gigantesco.
      it: |-
        Uno degli ingredienti per cucinare in campeggio.
        Basta un pizzico di questa spezia misteriosa per
        ingigantire qualsiasi curry.
