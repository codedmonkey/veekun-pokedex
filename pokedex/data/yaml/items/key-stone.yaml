key-stone:
  category: gameplay
  cost: 0
  effect:
    en: "Allows the player's Pokémon to Mega Evolve."
  flags: {  }
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        メガストーンを　もったまま　たたかう
        ポケモンを　メガシンカさせる
        みちのパワーを　ひめた　いし。
      ja: |-
        メガストーンを　持ったまま　戦う
        ポケモンを　メガシンカさせる
        未知のパワーを　秘めた　石。
      ko: |-
        메가스톤을 지닌 채로 싸우는
        포켓몬을 메가진화시키는
        미지의 힘을 가진 돌.
      zh-Hant: |-
        隱藏著未知力量的石頭。
        能讓攜帶著超級石戰鬥的
        寶可夢進行超級進化。
      zh-Hans: |-
        蕴藏着未知力量的石头。
        能让携带着超级石战斗的
        宝可梦进行超级进化。
      en: |-
        A stone filled with an unexplained power. It makes
        Pokémon that battle with a Mega Stone
        Mega Evolve.
      fr: |-
        Une pierre aux pouvoirs mystérieux permettant à
        un Pokémon tenant la Méga-Gemme adéquate
        de méga-évoluer.
      de: |-
        Ein Stein mit unbekannten Kräften. Er kann im
        Kampf bei Pokémon, die einen Mega-Stein tragen,
        eine Mega-Entwicklung auslösen.
      es: |-
        Piedra de singulares poderes que permite
        megaevolucionar en combate a un Pokémon que
        lleve consigo una Megapiedra.
      it: |-
        Pietra dotata di un misterioso potere.
        Durante la lotta, può innescare la megaevoluzione
        dei Pokémon che hanno una Megapietra.
    ultra-sun-ultra-moon:
