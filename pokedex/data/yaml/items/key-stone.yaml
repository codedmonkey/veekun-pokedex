    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        メガストーンと　はんのう　して
        ポケモンを　メガシンカ　させる
        みちのパワーを　ひめた　いし。
      ja: |-
        メガストーンと　反応　して
        ポケモンを　メガシンカ　させる
        未知のパワーを　秘めた　石。
      ko: |-
        메가스톤과 반응하여
        포켓몬을 메가진화시키는
        미지의 힘을 가진 돌.
      zh-Hant: |-
        蘊藏著未知力量的石頭。
        能與超級石產生反應，
        讓寶可夢進行超級進化。
      zh-Hans: |-
        蕴藏着未知力量的石头。
        能与超级石产生反应,
        让宝可梦进行超级进化。
      en: |-
        A stone filled with an unexplained power. It reacts to
        Mega Stones and makes Pokémon Mega Evolve.
      fr: |-
        Une pierre aux pouvoirs mystérieux permettant
        à un Pokémon de méga-évoluer sous l’effet de
        la Méga-Gemme adéquate.
      de: |-
        Ein Stein mit geheimnisvollen Kräften. Er reagiert
        auf Mega-Steine und ermöglicht es Pokémon,
        im Kampf die Mega-Entwicklung auszulösen.
      es: |-
        Piedra de singulares poderes que permite
        megaevolucionar en combate a un Pokémon
        al reaccionar ante una Megapiedra.
      it: |-
        Pietra dotata di un misterioso potere.
        Durante la lotta reagisce alle Megapietre e può
        innescare la megaevoluzione dei Pokémon.
