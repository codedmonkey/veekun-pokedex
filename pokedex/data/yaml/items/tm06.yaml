    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        ５ターンの　あいだ　ふしぎな　かべで
        あいてから　うける　とくしゅ　こうげきの
        ダメージを　よわめる。
      ja: |-
        ５ターンの　間　不思議な　かべで
        相手から　受ける　特殊攻撃の
        ダメージを　弱める。
      ko: |-
        5턴 동안 이상한 장막으로
        상대로부터 받는 특수공격의
        데미지를 약하게 한다.
      zh-Hant: |-
        利用神奇的屏障，
        在５回合內減輕
        來自對手的特殊攻擊傷害。
      zh-Hans: |-
        利用神奇的墙壁，
        在５回合内减弱从对手那里
        受到的特殊攻击的伤害。
      en: |-
        A wondrous wall of light is put up to reduce damage
        from special attacks for five turns.
      fr: |-
        Un fabuleux mur de lumière qui réduit les dégâts
        causés par les capacités spéciales durant cinq tours.
      de: |-
        Erzeugt eine Lichtwand und senkt den Schaden
        durch Spezial-Angriffe für fünf Runden.
      es: |-
        Pared de luz que reduce durante cinco turnos el daño
        producido por los ataques especiales.
      it: |-
        Innalza una barriera di luce fantastica che riduce
        i danni degli attacchi speciali per sé e gli alleati
        per cinque turni.
    sword-shield:
      ja-Hrkt: |-
        １ターンめで　そらへ　とび
