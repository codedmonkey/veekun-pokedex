white-flute:
  category: spelunking
  cost: 20
  effect:
    en: |-
      Used outside of battle
      :   Doubles the wild Pokémon encounter rate.
  flags:
    - countable
    - consumable
    - usable-overworld
    - holdable
  flavor_text:
    ruby-sapphire:
      en: |-
        A glass flute that
        lures wild POKéMON.
    emerald:
      en: |-
        A glass flute that
        lures wild POKéMON.
    firered-leafgreen:
      en: |-
        A white glass flute.
        When blown, it makes wild POKéMON
        more likely to appear.
    diamond-pearl:
      en: |-
        A white flute made from blown glass.
        Its melody makes wild Pokémon more
        likely to appear.
    platinum:
      en: |-
        A white flute made from blown glass.
        Its melody makes wild Pokémon more
        likely to appear.
    heartgold-soulsilver:
      en: |-
        A white flute made from blown glass.
        Its melody makes wild Pokémon more
        likely to appear.
    black-white:
      en: |-
        A toy flute made from white glass.
        A maniac will buy it for a high price.
      fr: |-
        Jouet en forme de flûte en verre
        blanc. Les amateurs en donnent
        un bon prix.
    black-2-white-2:
      en: |-
        A toy flute made from white glass.
        A maniac will buy it for a high price.
    x-y:
      ja-Hrkt: |-
        しろい　ガラスで　できている
        おもちゃの　ふえ。
      ja: |-
        白い　ガラスで　できている
        おもちゃの　笛。
      ko: |-
        하얀 유리로 만들어진
        장난감 피리.
      en: |-
        A lovely toy flute to admire.
        It’s made from white glass.
      fr: 'Un jouet en forme de flûte en verre blanc.'
      de: 'Eine Spielzeugflöte aus weißem Glas.'
      es: 'Una flauta de juguete de cristal blanco.'
      it: 'Flauto giocattolo fatto di vetro bianco.'
    sun-moon:
      ja-Hrkt: |-
        しろいガラスで　できた　ふえ。
        つかった　ばしょで　よわいポケモンと
        そうぐう　しやすくなる。
      ja: |-
        白いガラスで　できた　笛。
        使った　場所で　弱いポケモンと
        遭遇　しやすくなる。
      ko: |-
        하얀 유리로 만들어진 피리.
        사용한 장소에서 약한 포켓몬과
        만나기 쉬워진다.
      zh-Hant: |-
        以白色玻璃製成的笛子。
        在使用的地方更容易
        遇到弱小的寶可夢。
      zh-Hans: |-
        以白色玻璃制成的哨子。
        在使用的地方更容易
        遇到弱小的宝可梦。
      en: |-
        A flute made from white glass. It makes it easier to
        encounter weak Pokémon in the place you use it.
      fr: |-
        Un jouet en forme de flûte en verre blanc.
        Augmente les chances de rencontrer des
        Pokémon sauvages faibles là où l’on en joue.
      de: |-
        Eine Spielzeugflöte aus weißem Glas. Erhöht am
        Einsatzort die Wahrscheinlichkeit, schwachen
        wilden Pokémon zu begegnen.
      es: |-
        Una flauta de cristal blanco cuyas notas atraen a
        Pokémon salvajes más débiles al lugar en el que
        se usa.
      it: |-
        Flauto fatto di vetro bianco. Aumenta le probabilità
        di incontrare Pokémon deboli nell’area in cui viene
        usato.
