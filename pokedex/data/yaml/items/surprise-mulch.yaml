surprise-mulch:
  category: mulch
  cost: 200
  effect:
    en: 'Increases the chance of Berry mutation.'
  flags: {  }
  flavor_text:
    x-y:
      ja-Hrkt: |-
        きのみばたけで　つかえる。
        きのみの　くみあわせに　よっては
        とつぜんへんいが　はっせい　する。
      ja: |-
        きのみ畑で　使える。
        きのみの　組み合わせに　よっては
        突然変異が　発生　する。
      ko: |-
        나무열매 밭에서 쓸 수 있다.
        나무열매의 조합에 따라
        돌연변이가 발생한다.
      en: |-
        Mulch to be used in a Berry field.
        It causes strange, sudden mutations
        based on the combination of Berries.
      fr: |-
        Un engrais servant à faire pousser des Baies.
        Il provoque des mutations soudaines en fonction
        de la combinaison de Baies plantées.
      de: |-
        Mulch zur Nutzung auf Beerenfeldern.
        Je nach Anordnung der Beeren kann er
        bei der Ernte Mutationen hervorrufen.
      es: |-
        Una de las misteriosas Megapiedras. Permite
        megaevolucionar a Aerodactyl en combate.
      it: |-
        Fertilizzante usato nell’orto delle bacche.
        Produce delle mutazioni inaspettate in base alla
        combinazione di bacche.
    sun-moon:
      ja-Hrkt: |-
        きのみを　そだてるときの　ひりょう。
        しかし　ホウエンちほうの　つちには
        まるで　なじまないので　こうかが　ない。
      ja: |-
        きのみを　育てるときの　肥料。
        しかし　ホウエン地方の　土には
        まるで　なじまないので　効果が　ない。
      ko: |-
        나무열매를 키울 때 사용하는 비료.
        그러나 호연지방의 흙에는
        전혀 맞지 않기에 효과가 없다.
      zh-Hant: |-
        培育樹果時的肥料。
        但完全不適合豐緣地區的土壤，
        所以沒什麼效果。
      zh-Hans: |-
        培育树果时的肥料。
        但完全不适合丰缘地区的土壤，
        所以没什么效果。
      en: |-
        A fertilizer for growing Berries. However, it appears
        to be unsuitable for the soil in the Hoenn region and
        has no effect.
      fr: |-
        Un engrais à utiliser sur un sol meuble.
        Il n’est cependant pas adapté aux terres
        de Hoenn et n’y a aucun effet.
      de: |-
        Mulch zur Nutzung auf Beerenfeldern. Durch seine
        Unverträglichkeit mit den Böden in Hoenn bleibt
        sein Einsatz dort ohne Wirkung.
      es: |-
        Un fertilizante usado para el cultivo de bayas.
        Parece que no se asienta bien en el suelo de
        Hoenn, por lo que no tiene efecto en esta región.
      it: |-
        Fertilizzante usato per coltivare le bacche.
        Tuttavia, non ha effetto a Hoenn, perché
        non è adatto al terreno della regione.
