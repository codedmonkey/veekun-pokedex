    x-y:
      ja-Hrkt: |-
        もたせると　おこうの　ふしぎな
        かおりが　あいてを　まどわせて
        わざが　めいちゅう　しにくくなる。
      ja: |-
        持たせると　御香の　不思議な
        香りが　相手を　まどわせて
        技が　命中　しにくくなる。
      ko: |-
        지니게 하면 향로의 이상한
        향기가 상대를 혼란시켜
        기술이 명중하기 어려워진다.
      en: |-
        An item to be held by a Pokémon.
        The beguiling aroma of this incense
        may cause attacks to miss its holder.
      fr: |-
        Objet à tenir. Le parfum trompeur de cet encens
        baisse la Précision de l’ennemi.
      de: |-
        Ein Item zum Tragen. Das verwirrende Aroma
        senkt die Genauigkeit des Gegners.
      es: |-
        Extraña esfera que envenena gravemente al
        Pokémon que la lleva en combate.
      it: |-
        Strumento da dare a un Pokémon.
        Il suo aroma intenso riduce la precisione
        del nemico.
