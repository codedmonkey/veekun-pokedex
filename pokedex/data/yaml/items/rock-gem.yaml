        いわの　タイプの　ジュエル。
        持たせると　１度だけ　いわの
        技の　威力が　強まる。
      ko: |-
        바위타입의 주얼.
        지니게 하면 한 번만 바위
        기술의 위력이 강해진다.
      en: |-
        A gem with an essence of rock.
        When held, it strengthens the power
