draining-kiss:
  accuracy: 100
  changelog: {  }
  contest_effect: ~
  contest_type: ~
  damage_class: special
  effect: move-effect-349
  effect_chance: ~
  flags:
    - contact
    - protect
    - mirror
    - heal
  flavor_text:
    x-y:
      ja-Hrkt: |-
        キッスによって　あいてから　ＨＰを
        すいとる。あたえた　ダメージの
        はんぶんいじょう　ＨＰを　かいふくする。
      ja: |-
        キッスによって　相手から　ＨＰを
        吸い取る。与えた　ダメージの
        半分以上　ＨＰを　回復する。
      ko: |-
        키스로 상대로부터 HP를
        흡수한다. 준 데미지의
        반 이상 HP를 회복한다.
      en: |-
        The user steals the target’s energy with a kiss.
        The user’s HP is restored by over half
        of the damage taken by the target.
      fr: |-
        Aspire la force vitale de l’ennemi par un baiser.
        Rend au lanceur un nombre de PV supérieur ou
        égal à la moitié des dégâts infligés.
      de: |-
        Der Anwender stiehlt dem Ziel mit einem Kuss KP.
        Die Höhe der Heilung beträgt mehr als die Hälfte
        des beim Ziel angerichteten Schadens.
      es: |-
        Absorbe PS del objetivo con un beso y restaura
        su propia energía en una cantidad igual o superior
        a la mitad del daño infligido.
      it: |-
        Chi la usa assorbe energia dal bersaglio con
        un bacio, recuperando così PS in quantità pari
        a più della metà del danno inferto.
