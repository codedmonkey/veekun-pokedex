    black-white:
      en: |-
        The user attacks using a sound wave
        based on words it has learned.
        It may also confuse the target.
      fr: |-
        Le lanceur envoie une onde musicale en
        récitant des mots. Peut aussi rendre
        l’ennemi confus.
    black-2-white-2:
      en: |-
        The user attacks using a sound wave
        based on words it has learned.
        It may also confuse the target.
    x-y:
      ja-Hrkt: |-
        おぼえた　ことばで
        おんぱを　おこして　こうげきする。
        あいてを　こんらん　させる。
      ja: |-
        おぼえた　言葉で
        音波を　おこして　攻撃する。
        相手を　混乱させる。
      ko: |-
        기억한 말로
        음파를 일으켜서 공격한다.
        상대를 혼란시킨다.
      en: |-
        The user attacks using a sound wave
        based on words it has learned.
        This confuses the target.
      fr: |-
        Le lanceur envoie une onde musicale en récitant
        des mots. Rend l’ennemi confus.
      de: 'Attacke mit Schallwellen. Verwirrt das Ziel.'
      es: |-
        Ataca con una onda sónica compuesta por
        palabras que ha aprendido y confunde al objetivo.
      it: |-
        Chi la usa attacca creando un’onda sonora
        con le parole imparate e confonde il bersaglio.
    omega-ruby-alpha-sapphire:
      ja-Hrkt: |-
        とても　うるさい　おしゃべりの
        おんぱで　あいてを　こうげきする。
        あいてを　こんらん　させる。
      ja: |-
        とても　うるさい　おしゃべりの
        音波で　相手を　攻撃する。
        相手を　混乱させる。
      ko: |-
        매우 시끄럽고 수다스러운
        음파로 상대를 공격한다.
        상대를 혼란시킨다.
      en: |-
        The user attacks the target with
        sound waves of deafening chatter.
        This confuses the target.
      fr: |-
        Attaque avec les ondes sonores assourdissantes
        qu’il émet en prononçant des mots au hasard.
        Rend l’ennemi confus.
      de: |-
        Der Anwender labert das Ziel zu und greift es
        mit den dadurch entstehenden Schallwellen an,
        wodurch das Ziel verwirrt wird.
      es: |-
        Ataca con una onda de sonido muy ruidosa
        compuesta  por palabras y confunde al objetivo. 
      it: |-
        Chi la usa attacca creando un’onda sonora
        di parole a vanvera e confonde il bersaglio.
