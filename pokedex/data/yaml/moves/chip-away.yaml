        あいての　のうりょく　へんかに
        かんけいなく　ダメージを　あたえる。
      ja: |-
        すきを　みて　堅実に　攻撃する。
        相手の　能力変化に
        関係なく　ダメージを　与える。
      ko: |-
        틈을 보며 착실하게 공격한다.
        상대의 능력 변화에
        관계없이 데미지를 준다.
      en: |-
