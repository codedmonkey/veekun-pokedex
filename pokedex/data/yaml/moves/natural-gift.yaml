      ko: |-
        나무열매에서 힘을 얻어
        공격한다. 지니게 한 나무열매에 따라
        기술의 타입과 위력이 바뀐다.
      en: |-
        The user draws power to attack by using
        its held Berry.
        The Berry determines the move’s type and power.
      fr: |-
        Avant d’attaquer, le lanceur rassemble ses forces
