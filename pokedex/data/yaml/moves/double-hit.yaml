        The user slams the target with a long tail,
        vines, or tentacle.
        The target is hit twice in a row.
    x-y:
      ja-Hrkt: |-
        しっぽなどを　つかい　あいてを　たたいて
        こうげきする。２かい　れんぞくで
        ダメージを　あたえる。
      ja: |-
        しっぽなどを　使い
        相手を　たたいて　攻撃する。
        ２回連続で　ダメージを　与える。
      ko: |-
        꼬리 등을 써서
        상대를 때려 공격한다.
        2회 연속으로 데미지를 준다.
      en: |-
        The user slams the target with a long tail,
        vines, or a tentacle.
        The target is hit twice in a row.
      fr: |-
        Un coup de queue ou de liane qui frappe l’ennemi
        deux fois d’affilée.
      de: |-
        Anwender trifft das Ziel mit dem Schweif
        oder Ähnlichem. Ziel wird doppelt getroffen.
      es: |-
        Golpea al objetivo dos veces seguidas con la cola
        u otras partes de su cuerpo.
      it: |-
        Chi la usa colpisce il bersaglio due volte di fila
        con la coda, una liana o simili.
