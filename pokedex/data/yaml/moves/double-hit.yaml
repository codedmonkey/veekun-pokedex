    black-white:
      en: |-
        The user slams the target with a long tail,
        vines, or tentacle.
        The target is hit twice in a row.
      fr: |-
        Un coup de queue ou de liane qui frappe
        l’ennemi deux fois d’affilée.
    black-2-white-2:
