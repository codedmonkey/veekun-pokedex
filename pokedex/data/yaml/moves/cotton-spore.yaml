    x-y:
      ja-Hrkt: |-
        わたのような　フワフワの　ほうしを
        まとわり　つかせて
        あいての　すばやさを　がくっと　さげる。
      ja: |-
        綿のような　フワフワの　胞子を
        まとわり　つかせて
        相手の　素早さを　がくっと　さげる。
      ko: |-
        솜처럼 폭신폭신한 포자를
        착 달라붙게 해서
        상대의 스피드를 크게 떨어뜨린다.
      en: |-
        The user releases cotton-like spores
        that cling to the opposing Pokémon,
        which harshly lowers their Speed stats.
      fr: |-
        Le lanceur libère des spores cotonneuses qui
        collent à l’ennemi et baissent fortement sa Vitesse.
      de: |-
        Wattebäusche heften sich an das Ziel.
        Der Initiative-Wert sinkt stark.
      es: |-
        Adhiere esporas a los rivales para reducir mucho
        su Velocidad.
      it: |-
        Rilascia spore simili al cotone che si attaccano
        ai nemici nei paraggi e ne riducono di molto
        la Velocità.
