        The user pins the target with a dark,
        arresting look.
        The target becomes unable to flee.
    x-y:
      ja-Hrkt: |-
        すいこまれる　ような　くろい　まなざしで
        じっと　みつめて　あいてを
        せんとうから　にげられなく　する。
      ja: |-
        吸いこまれるような　黒い　まなざしで
        じっと　みつめて　相手を
        戦闘から　逃げられなくする。
      ko: |-
        빨려 들어갈 것 같은 까만 눈빛으로
        가만히 응시하여 상대를
        배틀에서 도망갈 수 없게 한다.
      en: |-
        The user pins the target with a dark,
        arresting look.
        The target becomes unable to flee.
      fr: |-
        Le lanceur pétrifie l’ennemi en lui lançant un
        regard noir. Il devient incapable de s’enfuir.
      de: 'Böser Blick, der die Flucht des Zieles vereitelt.'
      es: |-
        Mal de ojo que impide al objetivo huir de la
        batalla.
      it: |-
        Chi la usa blocca il bersaglio con uno sguardo
        oscuro e ammaliante, impedendogli la fuga.
