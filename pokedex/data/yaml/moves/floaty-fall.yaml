    stat_chance: 0
    meta_ailment: none
    meta_category: damage
    stat_changes: {  }
  name:
    ja-Hrkt: ふわふわフォール
    ja: ふわふわフォール
    ko: 둥실둥실폴
    zh-Hant: 飄飄墜落
    zh-Hans: 飘飘坠落
    en: 'Floaty Fall'
    fr: Pika-Piqué
    de: Schwebesturz
    es: Pikapicado
    it: Piombaflap
  power: 90
  pp: 15
  priority: 0
  super_contest_effect: ~
  target: selected-pokemon
  type: flying
