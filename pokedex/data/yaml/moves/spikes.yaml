    black-2-white-2:
      en: |-
        The user lays a trap of spikes at the
        opposing team’s feet. The trap hurts
        Pokémon that switch into battle.
    x-y:
      ja-Hrkt: |-
        あいての　あしもとに　まきびしを
        しかける。こうたいで　でてきた　あいての
        ポケモンに　ダメージを　あたえる。
      ja: |-
        相手の　足下に　まきびしを
        しかける。交代で　でてきた　相手の
        ポケモンに　ダメージを　与える。
      ko: |-
        상대의 발밑에 압정을
        뿌린다. 교체된 상대
        포켓몬에게 데미지를 준다.
      en: |-
        The user lays a trap of spikes at the
        opposing team’s feet. The trap hurts
        Pokémon that switch into battle.
      fr: |-
        Le lanceur disperse des piquants sur le sol pour
        blesser tout ennemi qui entre au combat.
      de: |-
        Der Anwender verteilt Stacheln,
        die gegnerische Pokémon verletzen,
        die in den Kampf gerufen werden.
      es: |-
        Esparce púas en el equipo rival. Las púas hieren
        a los Pokémon rivales que entran en combate.
      it: |-
        Chi la usa piazza sul terreno una trappola
        di punte che danneggia i nemici quando
        scendono in campo.
