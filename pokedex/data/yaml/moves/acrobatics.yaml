  flavor_text:
    black-white:
      en: |-
        The user nimbly strikes the target.
        If the user is not holding an item,
        this attack inflicts massive damage.
      fr: |-
        Attaque agile. Si le lanceur ne tient
        pas d’objet, l’attaque inflige
        davantage de dégâts.
    black-2-white-2:
      en: |-
        The user nimbly strikes the target.
        If the user is not holding an item,
        this attack inflicts massive damage.
    x-y:
      ja-Hrkt: |-
        かろやかに　あいてを　こうげきする。
        じぶんが　どうぐを　もっていない　とき
        おおきな　ダメージを　あたえる。
      ja: |-
        軽やかに　相手を　攻撃する。
        自分が　道具を　持っていないとき
        大きな　ダメージを　与える。
      ko: |-
        경쾌하게 상대를 공격한다.
        자신이 도구를 지니고 있지 않을 때
        큰 데미지를 준다.
      en: |-
        The user nimbly strikes the target.
        If the user is not holding an item,
        this attack inflicts massive damage.
      fr: |-
        Attaque agile. Si le lanceur ne tient pas d’objet,
        l’attaque inflige davantage de dégâts.
      de: |-
        Ein graziler Angriff auf das Ziel.
        Trägt der Anwender kein Item bei sich,
        richtet die Attacke großen Schaden an.
      es: |-
        Golpea ágilmente. Si el usuario no porta ningún
        objeto, el objetivo resulta seriamente dañado.
      it: |-
        Attacca rapidamente il bersaglio. Se chi la usa non
        ha uno strumento, infligge al nemico grossi danni.
