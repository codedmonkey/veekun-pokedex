  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        おたがい　ひんしに　なるまで
        こうたいが　できなくなる。　どちらかの
        ポケモンが　いなくなると　こうかはきえる。
      ja: |-
        お互い　ひんしに　なるまで
        交代が　できなくなる。　どちらかの
        ポケモンが　いなくなると　効果は消える。
      ko: |-
        어느 한쪽이 기절할 때까지
        교체할 수 없게 된다. 한쪽의
        포켓몬이 없어지면 효과가 사라진다.
      zh-Hant: |-
        使攻擊對象及自己在陷入瀕死前
        都無法進行替換。當兩隻寶可夢
        其中一方退場時，效果就會消失。
      zh-Hans: |-
        使双方直到一方濒死为止
        无法替换宝可梦。
        其中一方退场则可以解除效果。
      en: |-
        This move prevents the user and the target from
        switching out until either of them faints. The effect goes
        away if either of the Pokémon leaves the field.
      fr: |-
        Le lanceur et sa cible ne peuvent plus quitter le terrain
        jusqu’à ce que l’un d’entre eux tombe K.O.
        L’effet est annulé si l’un des deux Pokémon disparaît.
      de: |-
        Anwender und Ziel können nicht ausgetauscht werden,
        bis einer von ihnen kampfunfähig wird. Der Effekt
        endet, wenn eines der Pokémon das Kampffeld verlässt.
      es: |-
        Impide que tanto el atacante como el defensor puedan
        ser intercambiados hasta que uno de ellos se debilite o
        abandone el terreno de combate.
      it: |-
        Impedisce a chi la usa e al bersaglio di essere sostituiti
        finché non vanno KO. L’effetto svanisce se uno dei due
        lascia il campo.
