        The target is blown away, to be replaced
        by another Pokémon in its party. In the
        wild, the battle ends.
      fr: |-
        Éjecte le Pokémon ennemi
        et le remplace par un autre.
        Dans la nature, met fin au combat.
    black-2-white-2:
      en: |-
        The target is blown away and switched.
        In the wild, a battle against a single
        Pokémon ends.
    x-y:
      ja-Hrkt: |-
        あいてを　ふきとばして
        ひかえの　ポケモンを　ひきずりだす。
        やせいの　ばあいは　せんとうが　おわる。
      ja: |-
        相手を　吹きとばして
        控えの　ポケモンを　ひきずりだす。
        野生の　場合は　戦闘が　終わる。
      ko: |-
        상대를 날려버려서
        교대할 포켓몬을 끌어낸다.
        야생의 경우에는 배틀이 끝난다.
      en: |-
        The target is blown away, and a different
        Pokémon is dragged out. In the wild,
        this ends a battle against a single Pokémon.
      fr: |-
        Éjecte le Pokémon ennemi et le remplace par
        un autre. Dans la nature, met fin au combat.
      de: |-
        Weht das Ziel weg und ersetzt es durch ein
        anderes Pokémon. In der Wildnis endet der Kampf.
      es: |-
        Se lleva al objetivo, que es cambiado por otro
        Pokémon. Si es un Pokémon salvaje, acaba el
        combate.
      it: |-
        Il bersaglio lascia il campo e viene sostituito.
        Mette fine alle lotte contro singoli Pokémon
        selvatici.
