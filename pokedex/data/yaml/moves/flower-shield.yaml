  flavor_text:
    x-y:
      ja-Hrkt: |-
        ふしぎな　ちからを　つかって
        ばにいる　くさタイプの　ポケモン
        ぜんいんの　ぼうぎょを　あげる。
      ja: |-
        不思議な　力を　使って
        場にいる　くさタイプの　ポケモン
        全員の　防御を　あげる。
      ko: |-
        이상한 힘을 사용하여
        배틀에 나와있는 모든
        풀타입 포켓몬의 방어를 올린다.
      en: |-
        The user raises the Defense stat
        of all Grass-type Pokémon in battle
        with a mysterious power.
      fr: |-
        Grâce à une force mystérieuse, la Défense de tous
        les Pokémon Plante au combat augmente.
      de: |-
        Erhöht mit einer mysteriösen Macht die
        Verteidigung aller am Kampf beteiligten
        Pflanzen-Pokémon.
      es: |-
        Aumenta la Defensa de todos los Pokémon de tipo
        Planta que hay en el combate usando unos
        misteriosos poderes.
      it: |-
        Grazie a un misterioso potere, aumenta la Difesa
        di tutti i Pokémon di tipo Erba presenti in campo.
