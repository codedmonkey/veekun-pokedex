      ja-Hrkt: |-
        かいてんして　あいてを　こうげきする。
        しめつける　まきつく　やどりぎのタネ
        まきびし　なども　ふきとばせる。
      ja: |-
        回転して　相手を　攻撃する。
        しめつける　まきつく　やどりぎのタネ
        まきびし　なども　吹きとばせる。
      ko: |-
        회전해서 상대를 공격한다.
        조이기, 김밥말이, 씨뿌리기,
        압정뿌리기 등도 날려버린다.
      en: |-
        A spin attack that can also eliminate
        such moves as Bind, Wrap, Leech Seed,
        and Spikes.
      fr: |-
        Une attaque tournoyante pouvant aussi annuler
        par exemple Étreinte, Ligotage, Vampigraine ou
        Picots.
      de: |-
        Trifft das Ziel mit einer Dreh-Attacke.
        Befreit sich unter anderem von Wickel,
        Klammergriff, Egelsamen und Stachler.
      es: |-
        Ataque giratorio que puede eliminar movimientos
        como Atadura, Constricción, Drenadoras y Púas.
      it: |-
        Attacco rotante che elimina gli effetti di
        mosse come Legatutto, Avvolgibotta, Punte
        e Parassiseme.
