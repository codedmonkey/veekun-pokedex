        しめつける　まきつく　やどりぎのタネ　など
        ふきとばす。じぶんの　すばやさも　あがる。
      ja: |-
        回転して　相手を　攻撃する。
        しめつける　まきつく　やどりぎのタネ　など
        吹きとばす。自分の　素早さも　あがる。
      ko: |-
        회전해서 상대를 공격한다.
        조이기, 김밥말이, 씨뿌리기 등을
        날려버린다. 자신의 스피드도 오른다.
      zh-Hant: |-
        藉由旋轉來攻擊對手。
        也可以擺脫綁緊、緊束、寄生種子等招式。
        自己的速度也會提高。
      zh-Hans: |-
        通过旋转来攻击对手。
        可以摆脱绑紧、紧束、寄生种子
        等招式。还能提高自己的速度。
      en: |-
        A spin attack that can also eliminate such moves as
        Bind, Wrap, and Leech Seed. This also raises the user’s
        Speed stat.
      fr: |-
        Une attaque tournoyante pouvant aussi annuler,
        par exemple, Étreinte, Ligotage ou Vampigraine.
        Augmente également la Vitesse du lanceur.
      de: |-
        Trifft das Ziel mit einer Dreh-Attacke. Befreit den
        Anwender unter anderem von Wickel, Klammergriff
        und Egelsamen. Erhöht die Initiative des Anwenders.
      es: |-
        Ataque giratorio que puede eliminar movimientos como
        Atadura, Constricción y Drenadoras. También aumenta
        la Velocidad del usuario.
      it: |-
        Attacco rotante che elimina gli effetti di mosse come
        Legatutto, Avvolgibotta e Parassiseme. Aumenta anche
        la Velocità di chi la usa.
