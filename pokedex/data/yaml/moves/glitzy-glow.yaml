  flavor_text:
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        ねんりきを　これでもかと　あびせる。
        あいての　とくしゅこうげきを　よわめる
        ふしぎな　かべを　つくりだす。
      ja: |-
        念力を　これでもかと　あびせる。
        相手の　特殊攻撃を　弱める
        不思議な　かべを　つくりだす。
      ko: |-
        염동력을 한가득 날린다.
        상대의 특수공격을 약하게 만드는
        이상한 장막을 만든다.
      zh-Hant: |-
        用極大量的念力攻擊對手，
        造出一道能夠減弱對手
        特殊攻擊的神奇牆壁。
      zh-Hans: |-
        利用念力强攻，粉碎对方信心。
        制造一道能减弱对手
        特殊攻击的神奇墙壁。
      en: |-
        The user bombards the target with telekinetic force.
        A wondrous wall of light is put up to weaken the power
        of the opposing Pokémon’s special moves.
      fr: |-
        Évoli submerge l’adversaire sous un flot d’ondes
        psychiques et crée un mur fabuleux qui réduit les
        dégâts causés par les attaques spéciales de l’ennemi.
      de: |-
        Evoli greift das Ziel gnadenlos mit telekinetischer
        Energie an. Dabei wird eine geheimnisvolle Wand
        erzeugt, die Spezial-Attacken des Ziels abschwächt.
      es: |-
        Envuelve al rival con ondas psíquicas y alza un extraño
        muro que debilita los ataques especiales del adversario.
      it: |-
        Colpisce il bersaglio ripetutamente con onde di forza
        psicocinetica e innalza una barriera fantastica che
        riduce i danni degli attacchi speciali nemici.
    sword-shield:
      ja-Hrkt: |-
        このわざは　つかえません
        おもいだすことが　できなくなりますが
        わざを　わすれることを　おすすめします
      ja: |-
        この技は　使えません
        思い出すことが　できなくなりますが
        技を　忘れることを　おすすめします
      ko: |-
        사용할 수 없는 기술입니다.
        다시 배우게 할 수 없지만
        기술을 잊게 하는 것을 권장합니다.
      zh-Hant: |-
        無法使用此招式。
        雖然忘記後將無法再想起來，
        但還是建議忘記此招式。
      zh-Hans: |-
        无法使用这个招式。
        虽然忘记之后就再也想不起来了，
        但还是建议忘记这个招式。
      en: |-
        This move can’t be used.
        It’s recommended that this move is forgotten.
        Once forgotten, this move can’t be remembered.
      fr: |-
        Cette capacité ne peut pas être utilisée.
        Il est recommandé de l’oublier, même s’il sera
        impossible de se la remémorer une fois oubliée.
      de: |-
        Diese Attacke kann nicht eingesetzt werden. Du solltest
        dein Pokémon sie vergessen lassen. Beachte aber,
        dass es sich danach nicht wieder an sie erinnern kann.
      es: |-
        Este movimiento no se puede usar, por lo que sería
        mejor olvidarlo, aunque eso implique que no se pueda
        recordar posteriormente.
      it: |-
        Questa mossa non può essere usata.
        È consigliabile farla dimenticare al Pokémon. Tuttavia,
        una volta dimenticata, non potrà più essere ricordata.
