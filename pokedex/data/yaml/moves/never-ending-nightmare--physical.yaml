  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        Ｚパワーで　よびよせた　つよい　おんねんが
        ぜんりょくで　あいてに　ふりかかる。
        もとになった　わざで　いりょくが　かわる。
      ja: |-
        Ｚパワーで　呼びよせた　強い　怨念が
        全力で　相手に　降りかかる。
        元になった　技で　威力が　変わる。
      ko: |-
        Z파워로 불러낸 강한 원념이
        전력으로 상대에게 쏟아진다.
        원래 기술에 따라 위력이 변한다.
      zh-Hant: |-
        透過Ｚ力量召喚強烈的怨念，
        全力降禍到對手身上。
        威力會隨原本的招式而改變。
      zh-Hans: |-
        通过Ｚ力量召唤强烈的怨念，
        全力降临到对手身上。
        威力会根据原来的招式而改变。
      en: |-
        Deep-seated grudges summoned by the user’s
        Z-Power trap the target. The power varies,
        depending on the original move.
      fr: |-
        Le Pokémon utilise la Force Z pour invoquer des
        esprits rancuniers qui s’abattent sur l’adversaire. La
        puissance varie selon celle de la capacité originale.
      de: |-
        Der Anwender beschwört mit Z-Kraft tiefen Groll
        herbei und lässt diesen auf das Ziel los. Die Stärke
        variiert je nach zugrunde liegender Attacke.
      es: |-
        El usuario emplea el Poder Z para invocar a unos
        espectros encolerizados que apresan al objetivo. 
        Su potencia depende de la del movimiento original.
      it: |-
        Grazie al Potere Z, chi la usa intrappola il bersaglio
        in una morsa generata dal proprio rancore. La
        potenza varia a seconda della mossa su cui si basa.
