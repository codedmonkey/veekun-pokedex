    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        わるさを　アピールして　こうげき。
        あいての　ぶつりこうげきを　よわめる
        ふしぎな　かべを　つくりだす。
      ja: |-
        わるさを　アピールして　攻撃。
        相手の　物理攻撃を　弱める
        不思議な　かべを　つくりだす。
      ko: |-
        악함을 어필해서 공격한다.
        상대의 물리공격을 약하게 만드는
        이상한 장막을 만든다.
      zh-Hant: |-
        惡形惡狀地進行攻擊，
        造出一道能夠減弱對手
        物理攻擊的神奇牆壁。
      zh-Hans: |-
        恶行恶相地进行攻击。
        制造一道能减弱对手
        物理攻击的神奇墙壁。
      en: |-
        The user acts bad and attacks the target.
        A wondrous wall of light is put up to weaken the power
        of the opposing Pokémon’s physical moves.
      fr: |-
        Évoli fait appel à son côté sombre pour attaquer
        l’adversaire et créer un mur fabuleux qui réduit les
        dégâts causés par les attaques physiques de l’ennemi.
      de: |-
        Evoli zeigt sich von seiner dunklen Seite und greift an.
        Dabei wird eine geheimnisvolle Wand erzeugt, die
        physische Attacken des Ziels abschwächt.
      es: |-
        Lanza un ataque haciendo gala de su faceta más umbría
        y alza un extraño muro que mitiga los ataques físicos
        del adversario.
      it: |-
        Chi la usa scatena l’oscurità che ha dentro, colpendo
        il bersaglio e innalzando una barriera fantastica che
        riduce i danni degli attacchi fisici nemici.
    sword-shield:
      ja-Hrkt: |-
        このわざは　つかえません
        おもいだすことが　できなくなりますが
        わざを　わすれることを　おすすめします
      ja: |-
        この技は　使えません
        思い出すことが　できなくなりますが
        技を　忘れることを　おすすめします
      ko: |-
        사용할 수 없는 기술입니다.
        다시 배우게 할 수 없지만
        기술을 잊게 하는 것을 권장합니다.
      zh-Hant: |-
        無法使用此招式。
        雖然忘記後將無法再想起來，
        但還是建議忘記此招式。
      zh-Hans: |-
        无法使用这个招式。
        虽然忘记之后就再也想不起来了，
        但还是建议忘记这个招式。
      en: |-
        This move can’t be used.
        It’s recommended that this move is forgotten.
        Once forgotten, this move can’t be remembered.
      fr: |-
        Cette capacité ne peut pas être utilisée.
        Il est recommandé de l’oublier, même s’il sera
        impossible de se la remémorer une fois oubliée.
      de: |-
        Diese Attacke kann nicht eingesetzt werden. Du solltest
        dein Pokémon sie vergessen lassen. Beachte aber,
        dass es sich danach nicht wieder an sie erinnern kann.
      es: |-
        Este movimiento no se puede usar, por lo que sería
        mejor olvidarlo, aunque eso implique que no se pueda
        recordar posteriormente.
      it: |-
        Questa mossa non può essere usata.
        È consigliabile farla dimenticare al Pokémon. Tuttavia,
        una volta dimenticata, non potrà più essere ricordata.
