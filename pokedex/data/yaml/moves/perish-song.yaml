        out of battle.
      fr: |-
        Tout Pokémon qui entend ce requiem
        est K.O. dans 3 tours à moins qu’il
        ne quitte le combat.
    black-2-white-2:
      en: |-
        Any Pokémon that hears this song
        faints in three turns, unless it switches
        out of battle.
    x-y:
      ja-Hrkt: |-
        うたを　きいた　ポケモンは
        ３ターン　たつと　ひんしに　なる。
        こうたいすると　こうかは　なくなる。
      ja: |-
        歌を　聴いた　ポケモンは
        ３ターン　たつと　ひんしに　なる。
        交代すると　効果は　なくなる。
      ko: |-
        노래를 들은 포켓몬은
        3턴이 지나면 기절한다.
        교체되면 효과가 없어진다.
      en: |-
        Any Pokémon that hears this song
        faints in three turns, unless it switches
        out of battle.
      fr: |-
        Tout Pokémon qui entend ce requiem est K.O.
        dans trois tours à moins qu’il ne quitte le combat.
      de: |-
        Wer diese Musik hört, wird nach drei Runden
        besiegt. Rettung ist durch den Eintausch
        eines neuen Pokémon möglich.
      es: |-
        Si un Pokémon escucha este canto y no es
        cambiado por otro en tres turnos, acaba
        debilitándose.
      it: |-
        Qualunque Pokémon che senta questo canto va
        KO in tre turni, se non lo si sostituisce.
