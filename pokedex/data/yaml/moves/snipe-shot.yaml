        能无视具有吸引对手招式效果的
        特性或招式的影响。
        可以向选定的对手进行攻击。
      en: |-
        The user ignores the effects of opposing Pokémon’s
        moves and Abilities that draw in moves, allowing this
        move to hit the chosen target.
      fr: |-
        Le lanceur parvient toujours à viser la cible voulue,
        en ignorant l’effet des talents et des capacités capables
        de détourner les attaques.
      de: |-
        Die Attacke richtet sich gegen das ausgewählte Ziel,
