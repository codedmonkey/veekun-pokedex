        hit also faints.
    x-y:
      ja-Hrkt: |-
        わざを　だしたあと　こうげきを　うけて
        ひんしに　なったとき
        こうげき　あいても　ひんしに　する。
      ja: |-
        技を　だしたあと　攻撃を　受けて
        ひんしに　なったとき
        攻撃　相手も　ひんしに　する。
      ko: |-
        기술을 쓴 뒤 공격을 받아
        기절했을 때
        길동무의 대상도 기절하게 한다.
      en: |-
        When this move is used, if the user faints,
        the Pokémon that landed the knockout
        hit also faints.
      fr: |-
        Quand cette capacité est activée, elle met K.O.
        un ennemi qui porte un coup fatal au lanceur.
      de: |-
        Wird der Anwender nach Einsatz dieser Attacke
        besiegt, führt dies auch beim Ziel zum K.O.
      es: |-
        Si el usuario se debilita por un ataque rival antes
        de usar otro movimiento, el Pokémon rival se
        debilitará también.
      it: |-
        Se chi la usa va KO prima del turno successivo,
        chi ha sferrato il colpo da KO fa la stessa fine.
    omega-ruby-alpha-sapphire:
      ja-Hrkt: |-
        わざを　だしたあと　こうげきを　うけて
        ひんしに　なったとき
        こうげき　あいても　ひんしに　する。
      ja: |-
        技を　だしたあと　攻撃を　受けて
        ひんしに　なったとき
        攻撃　相手も　ひんしに　する。
      ko: |-
        기술을 쓴 뒤 공격을 받아
        기절했을 때
        공격 상대도 기절하게 한다.
      en: |-
        When this move is used, if the user faints,
        the Pokémon that landed the knockout
        hit also faints.
      fr: |-
        Quand cette capacité est activée, elle met K.O.
        un ennemi qui porte un coup fatal au lanceur.
      de: |-
        Wird der Anwender nach Einsatz dieser Attacke
        kampfunfähig, führt dies auch beim Gegner,
        der ihn besiegt hat, zum K.O.
      es: |-
        Si el usuario se debilita por un ataque rival antes de 
        usar otro movimiento, el Pokémon rival se debilitará 
        también.
      it: |-
        Se chi la usa va KO prima del turno successivo,
        chi ha sferrato il colpo da KO fa la stessa fine.
    sun-moon:
      ja-Hrkt: |-
        わざのあと　あいての　こうげきで　ひんしに
        なると　こうげき　あいても　ひんしにする。
        れんぞくして　だすと　しっぱいする。
      ja: |-
        技のあと　相手の　攻撃で　ひんしに
        なると　攻撃　相手も　ひんしにする。
        連続して　出すと　失敗する。
      ko: |-
        기술을 쓴 뒤 상대의 공격으로 기절했을 때
        공격 상대도 기절하게 한다.
        연속으로 쓰면 실패한다.
      zh-Hant: |-
        使出招式後，當受到對手攻擊
        陷入瀕死時，對手也會一同陷入瀕死。
        連續使用時會失敗。
      zh-Hans: |-
        使出招式后，当受到对手攻击
        陷入濒死时，对手也会一同濒死。
        连续使出则会失败。
      en: |-
        After using this move, if the user faints, the
        Pokémon that landed the knockout hit also faints.
        Its chance of failing rises if it is used in succession.
      fr: |-
        Quand cette capacité est activée, elle met K.O.
        un ennemi qui porte un coup fatal au lanceur.
        Elle échoue si elle est réutilisée après activation.
      de: |-
        Wird der Anwender nach Einsatz dieser Attacke
        kampfunfähig, führt dies auch beim Pokémon, das
        ihn besiegt hat, zum K.O. Scheitert bei Wiederholung.
      es: |-
        Si el usuario se debilita por un ataque rival antes de
        usar otro movimiento, el Pokémon rival se debilitará
        también. Puede fallar si se usa repetidamente.
      it: |-
        Se chi la usa va KO prima del turno successivo,
        chi ha sferrato il colpo da KO fa la stessa fine.
        Se usata in successione fallisce.
