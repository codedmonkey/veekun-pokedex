    x-y:
      ja-Hrkt: |-
        するどい　つららを
        あいてに　はっしゃして　こうげきする。
        ２ー５かいの　あいだ　れんぞくで　だす。
      ja: |-
        鋭い　氷柱を
        相手に　発射して　攻撃する。
        ２ー５回の　あいだ　連続で　だす。
      ko: |-
        날카로운 고드름을
        상대에게 발사하여 공격한다.
        2-5회 동안 연속으로 쓴다.
      en: |-
        The user launches sharp icicles at the
        target two to five times in a row.
      fr: |-
        Le lanceur jette des pics de glace sur l’ennemi,
        de deux à cinq fois de suite.
      de: 'Feuert zwei bis fünf Eiszapfen auf das Ziel.'
      es: |-
        Ataca lanzando de dos a cinco ráfagas
        consecutivas de carámbanos.
      it: |-
        Chi la usa spara ghiaccioli affilati contro il bersaglio
        da due a cinque volte di fila.
