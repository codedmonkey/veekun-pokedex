      en: |-
        The user takes the target into the sky,
        then drops it during the next turn.
        The target cannot attack while in the sky.
    x-y:
      ja-Hrkt: |-
        １ターンめで　あいてを　そらへ　つれさり
        ２ターンめに　おとして　こうげきする。
        つれさられた　あいては　うごけない。
      ja: |-
        １ターン目で　相手を　空へ　連れさり
        ２ターン目に　落として　攻撃する。
        連れさられた　相手は　動けない。
      ko: |-
        1턴째에 상대를 하늘로 끌고 가서
        2턴째에 떨어뜨려 공격한다.
        끌려간 상대는 움직일 수 없다.
      en: |-
        The user takes the target into the sky,
        then drops it during the next turn.
        The target cannot attack while in the sky.
      fr: |-
        Le lanceur emmène l’ennemi dans les airs au
        premier tour et le lâche dans le vide au second.
        L’ennemi saisi ne peut pas attaquer.
      de: |-
        Steigt in Runde 1 mit dem Ziel in die Luft auf
        und lässt es in Runde 2 fallen. Das Ziel kann
        dabei nicht angreifen.
      es: |-
        Primer turno: lanza al objetivo al aire. Segundo
        turno: lo hace caer. Mientras está en el aire, no lo
        deja moverse.
      it: |-
        Porta il bersaglio in cielo e lo scaglia a terra
        al turno successivo. Il bersaglio catturato non può
        muoversi.
