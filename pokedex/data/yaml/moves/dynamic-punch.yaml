    x-y:
      ja-Hrkt: |-
        こんしんの　ちからで
        パンチを　くりだして　こうげきする。
        あいてを　かならず　こんらん　させる。
      ja: |-
        こん身の　力で
        パンチを　くりだして　攻撃する。
        相手を　必ず　混乱させる。
      ko: |-
        혼신의 힘으로
        펀치를 날려서 공격한다.
        상대를 반드시 혼란시킨다.
      en: |-
        The user punches the target with full,
        concentrated power.
        This confuses the target if it hits.
      fr: |-
        Le lanceur rassemble ses forces et envoie un coup
        de poing à l’ennemi. Rend ce dernier confus.
      de: 'Kräftiger Schlag, der das Ziel bei Erfolg verwirrt.'
      es: |-
        Puñetazo con toda la fuerza concentrada. Causa
        confusión si atina.
      it: |-
        Colpisce il bersaglio con un pugno davvero forte.
        Se va a segno, lo confonde.
