    black-white:
      en: |-
        The user passes its held item to the
        target when the target isn’t holding
        an item.
      fr: |-
        Si la cible ne tient pas d’objet, le
        lanceur lui donne l’objet qu’il tient.
    black-2-white-2:
      en: |-
        The user passes its held item to the
        target when the target isn’t holding
        an item.
    x-y:
      ja-Hrkt: |-
        あいてが　どうぐを　もっていない　とき
        じぶんが　もっている　どうぐを
        あいてに　わたす。
      ja: |-
        相手が　道具を　持っていないとき
        自分が　持っている　道具を
        相手に　わたす。
      ko: |-
        상대가 도구를 지니고 있지 않을 때
        자신이 지니고 있는 도구를
        상대에게 건넨다.
      en: |-
        The user passes its held item to the
        target when the target isn’t holding
        an item.
      fr: |-
        Si la cible ne tient pas d’objet, le lanceur lui
        donne l’objet qu’il tient.
      de: |-
        Trägt das Ziel gerade kein Item bei sich,
        erhält es das Item, das sich aktuell im Besitz
        des Anwenders befindet.
      es: |-
        Entrega el objeto que lleva al objetivo en caso de
        que este no tenga ninguno.
      it: |-
        Chi la usa consegna il proprio strumento
        al bersaglio, se questi ne è sprovvisto.
