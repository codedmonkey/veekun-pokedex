    x-y:
      ja-Hrkt: |-
        まばゆい　でんげきで　じぶんの
        まわりに　いるものを　こうげきする。
        まひ　じょうたいに　することが　ある。
      ja: |-
        まばゆい　電撃で　自分の
        周りに　いるものを　攻撃する。
        まひ状態に　することが　ある。
      ko: |-
        눈부신 전격으로 자신의
        주위에 있는 포켓몬을 공격한다.
        마비 상태로 만들 때가 있다.
      en: |-
        The user strikes everything around it
        by letting loose a flare of electricity.
        This may also cause paralysis.
      fr: |-
        Un flamboiement d’électricité frappe tous les
        Pokémon autour du lanceur. Peut aussi les paralyser.
      de: |-
        Anwender greift die Pokémon in seiner Umgebung
        mit Elektrizität an. Paralysiert eventuell.
      es: |-
        Una deslumbradora onda eléctrica afecta a los
        Pokémon que hay combatiendo alrededor. Puede
        paralizar.
      it: |-
        Chi la usa colpisce i Pokémon che ha intorno
        con un bagliore elettrico. Può anche paralizzarli.
