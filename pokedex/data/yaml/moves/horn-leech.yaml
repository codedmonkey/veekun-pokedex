horn-leech:
  accuracy: 100
  changelog: {  }
  contest_effect: ~
  contest_type: ~
  damage_class: physical
  effect: move-effect-4
  effect_chance: ~
  flags:
    - contact
    - protect
    - mirror
    - heal
  flavor_text:
    black-white:
      en: |-
        The user drains the target’s energy with
        its horns. The user’s HP is restored
        by half the damage taken by the target.
      fr: |-
        Un coup de corne qui draine l’énergie
        de l’ennemi. Convertit la moitié des dégâts
        infligés en PV pour le lanceur.
    black-2-white-2:
      en: |-
        The user drains the target’s energy with
        its horns. The user’s HP is restored
        by half the damage taken by the target.
    x-y:
      ja-Hrkt: |-
        つのを　つきさして　あいての　ようぶんを
        すいとる。あたえた　ダメージの
        はんぶんの　ＨＰを　かいふく　できる。
      ja: |-
        つのを　突き刺して　相手の　養分を
        吸い取る。与えた　ダメージの
        半分の　ＨＰを　回復できる。
      ko: |-
        뿔을 꿰찔러서 상대의 양분을
        흡수한다. 입힌 데미지의 절반에
        해당하는 HP를 회복할 수 있다.
      en: |-
        The user drains the target’s energy with
        its horns. The user’s HP is restored
        by half the damage taken by the target.
      fr: |-
        Un coup de corne qui draine l’énergie de l’ennemi.
        Convertit la moitié des dégâts infligés en PV pour
        le lanceur.
      de: |-
        Greift Ziel mit Astgeweih an und zapft diesem
        Nährstoffe ab. Anwender wird um die Hälfte
        des zugefügten Schadens geheilt.
      es: |-
        Un golpe que drena energía. El Pokémon recupera
        la mitad de los PS arrebatados al objetivo.
      it: |-
        Chi la usa infilza il bersaglio con le corna e
        assorbe una quantità di PS pari a metà
        del danno inferto.
