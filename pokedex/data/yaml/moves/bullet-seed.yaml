    x-y:
      ja-Hrkt: |-
        タネを　いきおいよく
        あいてに　はっしゃして　こうげきする。
        ２ー５かいの　あいだ　れんぞくで　だす。
      ja: |-
        タネを　勢いよく
        相手に　発射して　攻撃する。
        ２ー５回の　あいだ　連続で　だす。
      ko: |-
        씨앗을 기세 좋게
        상대에게 발사하여 공격한다.
        2-5회 동안 연속으로 쓴다.
      en: |-
        The user forcefully shoots seeds at the
        target two to five times in a row.
      fr: |-
        Le lanceur mitraille l’ennemi avec une rafale de
        graines. De deux à cinq rafales sont lancées à
        la suite.
      de: |-
        Der Anwender wirft zwei- bis fünfmal
        in rascher Folge Samen auf das Ziel.
      es: |-
        Dispara rápido de dos a cinco ráfagas de semillas
        de manera consecutiva.
      it: |-
        Chi la usa spara da due a cinque raffiche di semi
        contro il bersaglio in successione.
