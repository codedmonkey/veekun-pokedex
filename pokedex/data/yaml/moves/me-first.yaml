    x-y:
      ja-Hrkt: |-
        いりょくを　あげて　あいてが
        だそうとする　わざを　さきにだす。
        さきに　だせないと　しっぱい　する。
      ja: |-
        威力を　あげて　相手が
        だそうとする　技を　先にだす。
        先に　だせないと　失敗する。
      ko: |-
        위력을 올려 상대가
        쓰려고 하는 기술을 먼저 쓴다.
        먼저 쓰지 않으면 실패한다.
      en: |-
        The user cuts ahead of the target to steal and
        use the target’s intended move with greater power.
        This move fails if it isn’t used first.
      fr: |-
        Le lanceur vole la capacité prévue par l’ennemi et
        l’utilise en faisant plus de dégâts. Il doit frapper en
        premier.
      de: |-
        Anwender stiehlt und führt die Attacke eines
        langsameren Zieles zuerst und mit größerer
        Kraft aus.
      es: |-
        Se adelanta al movimiento que pretende usar el
        objetivo y lo lanza antes con más fuerza. Si el
        usuario es más lento, falla.
      it: |-
        Se chi la usa è più veloce del nemico, gli ruba
        la mossa e gliela ritorce contro con potenza
        persino maggiore.
