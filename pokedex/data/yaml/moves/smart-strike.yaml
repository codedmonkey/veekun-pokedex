    sun-moon:
      ja-Hrkt: |-
        とがった　つので　あいてを
        つきさして　こうげきする。
        こうげきは　かならず　めいちゅう　する。
      ja: |-
        とがった　つので　相手を
        突き刺して　攻撃する。
        攻撃は　必ず　命中する。
      ko: |-
        뾰족한 뿔로 상대를
        꿰찔러서 공격한다.
        공격은 반드시 명중한다.
      zh-Hant: |-
        用尖尖的角刺進對手進行攻擊。
        攻擊必定會命中。
      zh-Hans: |-
        用尖尖的角刺入对手进行攻击。
        攻击必定会命中。
      en: |-
        The user stabs the target with a sharp horn. This
        attack never misses.
      fr: |-
        Le lanceur transperce la cible avec sa corne effilée.
        Touche toujours l’ennemi.
      de: |-
        Der Anwender durchbohrt das Ziel mit seinem
        spitzen Horn. Diese Attacke trifft immer.
      es: |-
