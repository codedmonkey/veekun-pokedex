    x-y:
      ja-Hrkt: |-
        パンチで　こうげき。　あいての
        ぼうぎょを　さげる　ことが　ある。
        いわを　くだくことも　できる。
      ja: |-
        パンチで　攻撃する。相手の
        防御を　さげる　ことが　ある。
        岩を　砕くことも　ある。
      ko: |-
        펀치로 공격한다. 상대의
        방어를 떨어뜨릴 때가 있다.
        바위를 깰 수도 있다.
      en: |-
        The user attacks with a punch.
        This may also lower the target’s Defense stat.
        This move can also shatter rocks in the field.
      fr: |-
        Porte un coup de poing à l’ennemi qui peut
        baisser sa Défense. Peut aussi briser des rochers
        fissurés.
      de: |-
        Diese steinbrechende Attacke kann den
        Verteidigungs-Wert des Zieles senken und
        außerhalb von Kämpfen rissige Felsen zertrümmern.
      es: |-
        Ataque con los puños. Puede bajar la Defensa del
        objetivo. Puede romper rocas fuera del combate.
      it: |-
        Chi la usa colpisce il bersaglio con un pugno
        in grado di frantumare anche la roccia.
        Può anche ridurne la Difesa.
