    black-white:
      en: |-
        The user creates a bizarre area in which
        Pokémon’s Defense and Sp. Def
        stats are swapped for five turns.
      fr: |-
        Crée une zone étrange où pendant 5 tours,
        la Défense et la Défense Spéciale de tous
        les Pokémon sont inversées.
    black-2-white-2:
      en: |-
        The user creates a bizarre area in which
        Pokémon’s Defense and Sp. Def
        stats are swapped for five turns.
    x-y:
      ja-Hrkt: |-
        まかふしぎな　くうかんを　つくる。
        ５ターンのあいだ　すべてのポケモンの
        ぼうぎょと　とくぼうが　いれかわる。
      ja: |-
        まか不思議な　空間を　つくる。
        ５ターンのあいだ　すべてのポケモンの
        防御と　特防が　入れ替わる。
      ko: |-
        이상한 공간을 만든다.
        5턴 동안 모든 포켓몬의
        방어와 특수방어가 바뀐다.
      en: |-
        The user creates a bizarre area in which
        Pokémon’s Defense and Sp. Def
        stats are swapped for five turns.
      fr: |-
        Crée une zone étrange où pendant cinq tours,
        la Défense et la Défense Spéciale de tous les
        Pokémon sont inversées.
      de: |-
        Anwender erzeugt bizarren Raum, in dem über
        fünf Runden die Verteidigung aller Pokémon
        mit ihrer Spezial-Verteidigung getauscht wird.
      es: |-
        Crea una zona misteriosa donde se intercambian
        la Defensa y la Defensa Especial de todos los
        Pokémon durante cinco turnos.
      it: |-
        Chi la usa crea una dimensione in cui Difesa
        e Difesa Speciale di tutti i Pokémon vengono
        scambiate per cinque turni.
