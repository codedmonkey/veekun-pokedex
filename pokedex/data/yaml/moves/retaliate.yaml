  flavor_text:
    black-white:
      en: |-
        The user gets revenge for a fainted ally.
        If an ally fainted in the previous turn,
        this attack’s damage increases.
      fr: |-
        Venge un Pokémon de l’équipe mis K.O.
        Si un Pokémon de l’équipe a été mis
        K.O. au tour d’avant, l’effet augmente.
    black-2-white-2:
      en: |-
        The user gets revenge for a fainted ally.
        If an ally fainted in the previous turn,
        this attack’s damage increases.
    x-y:
      ja-Hrkt: |-
        たおれた　みかたの　かたきを　うつ。
        まえの　ターンに　みかたが　たおされて
        いると　いりょくが　あがる。
      ja: |-
        倒れた　味方の　かたきを　討つ。
        前の　ターンに　味方が
        倒されていると　威力が　あがる。
      ko: |-
        쓰러진 같은 편의 원수를 갚는다.
        앞 턴에서 같은 편이
        쓰러졌다면 위력이 올라간다.
      en: |-
        The user gets revenge for a fainted ally.
        If an ally fainted in the previous turn,
        this move becomes more powerful.
      fr: |-
        Venge un Pokémon de l’équipe mis K.O.
        Si un Pokémon de l’équipe a été mis K.O. au tour
        d’avant, l’effet augmente.
      de: |-
        Anwender nimmt Rache für einen besiegten
        Mitstreiter. Wurde in der vorigen Runde ein
        Mitstreiter besiegt, steigt die Kraft.
      es: |-
        Venga a los amigos derrotados. Si en el turno
        anterior han derrotado a uno, la potencia del
        ataque aumentará.
      it: |-
        Vendica un alleato messo KO. Se ciò è
        accaduto al turno precedente, il danno è
        maggiore.
