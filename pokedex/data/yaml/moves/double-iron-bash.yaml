  flavor_text:
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        むねの　ナットを　じくに　かいてんして
        ２かい　つづけて　うでを　たたきつける。
        あいてを　ひるませる　ことが　ある。
      ja: |-
        胸の　ナットを　軸に　回転して
        ２回　続けて　うでを　たたきつける。
        相手を　ひるませる　ことが　ある。
      ko: |-
        가슴의 너트를 축으로 회전시켜
        2번 연속 팔로 힘껏 친다.
        상대를 풀죽게 만들 때가 있다.
      zh-Hant: |-
        以胸口的螺帽為軸心旋轉，
        連續２次揮動手臂痛擊對手。
        有時會使對手畏縮。
      zh-Hans: |-
        以胸口的螺帽为中心旋转，
        并连续２次挥动手臂打击对手。
        有时会使对手畏缩。
      en: |-
        The user rotates, centering the hex nut in its chest,
        and then strikes with its arms twice in a row. This may
        also make the target flinch.
      fr: |-
        Le lanceur fait pivoter l’écrou de sa poitrine deux fois
        d’affilée pour frapper l’adversaire avec ses bras.
        Peut apeurer l’ennemi.
      de: |-
        Der Anwender rotiert um die Schraubenmutter in seinem
        Brustkorb und schlägt zweimal hintereinander mit den
        Armen zu. Das Ziel schreckt eventuell zurück.
      es: |-
        Usando la tuerca del pecho como eje, el usuario gira
        sobre sí mismo y golpea con los brazos dos veces
        seguidas. Puede hacer retroceder al rival.
      it: |-
        Chi la usa attacca il bersaglio due volte ruotando su se
        stesso e colpendolo con le braccia. Può anche farlo
        tentennare.
