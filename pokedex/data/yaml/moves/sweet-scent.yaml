    x-y:
      ja-Hrkt: |-
        かおりで　あいての　かいひりつを
        がくっと　さげる。くさむら　などで
        つかうと　ポケモンが　よってくる。
      ja: |-
        香りで　相手の　回避率を
        がくっと　さげる。草むら　などで
        使うと　ポケモンが　よってくる。
      ko: |-
        향기로 상대의 회피율을
        크게 떨어뜨린다. 풀밭 등에서
        쓰면 포켓몬이 다가온다.
      en: |-
        A sweet scent that harshly lowers opposing
        Pokémon’s evasiveness. This also lures wild
        Pokémon if used in places such as tall grass.
      fr: |-
        Un doux parfum qui réduit sensiblement l’Esquive
        de l’ennemi. Utilisé hors d’un combat, attire aussi
        les Pokémon sauvages.
      de: |-
        Lockt Ziele an und senkt deren Fluchtwert.
        Lockt im Gras auch wilde Pokémon an.
      es: |-
        Un dulce aroma engatusa al objetivo, por lo que
        se reduce mucho su Evasión. En la hierba
        alta sirve para atraer a Pokémon salvajes.
      it: |-
        Un dolce profumo che riduce di molto l’elusione
        dei nemici intorno a chi la usa. Fuori dalla lotta
        attira i Pokémon selvatici.
