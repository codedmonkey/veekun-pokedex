  flavor_text:
    x-y:
      ja-Hrkt: |
        ようせいのかぜを　おこし
        あいてに　ふきつけて　こうげきする。
      ja: |
        ようせいのかぜを　起こし
        相手に　吹きつけて　攻撃する。
      ko: |-
        요정의 바람을 일으켜
        상대에게 몰아쳐서 공격한다.
      en: |-
        The user stirs up a fairy wind
        and strikes the target with it.
      fr: 'Déchaîne un vent magique qui cingle l’ennemi.'
      de: |-
        Lässt eine Feenbrise aufkommen, die das Ziel
        erfasst und ihm Schaden zufügt.
      es: |-
        El Pokémon que lo usa desata un vendaval feérico
        que arremete contra el objetivo.
      it: |-
        Chi la usa solleva un vento fatato che investe
        il bersaglio.
