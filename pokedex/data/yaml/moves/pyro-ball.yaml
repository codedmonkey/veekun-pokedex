    sword-shield:
      ja-Hrkt: |-
        こいしを　もやした　ほのおの　ボールで
        あいてを　こうげきする。
        やけど　じょうたいに　することが　ある。
      ja: |-
        小石を　燃やした　炎の　ボールで
        相手を　攻撃する。
        やけど　状態に　することが　ある。
      ko: |-
        작은 돌을 태운 불꽃의 공으로
        상대를 공격한다.
        화상 상태로 만들 때가 있다.
      zh-Hant: |-
        燃燒小石子，
        形成火球攻擊對手。
        有時會讓對手陷入灼傷狀態。
      zh-Hans: |-
        点燃小石子，形成火球攻击对手。
        有时会使对手陷入灼伤状态。
      en: |-
        The user attacks by igniting a small stone and launching
        it as a fiery ball at the target. This may also leave the
        target with a burn.
      fr: |-
        Le lanceur attaque avec un ballon fait à partir
        d’un caillou enflammé. Peut aussi brûler la cible.
      de: |-
        Der Anwender greift mit einem Ball aus Feuer an,
        den er durch Anzünden eines kleinen Steins erzeugt.
        Fügt dem Ziel eventuell Verbrennungen zu.
      es: |-
        El usuario prende una pequeña piedra para crear una
        bola de fuego con la que ataca al rival. Puede causar
        quemaduras.
      it: |-
        Chi la usa attacca con una palla creata incendiando
        una piccola pietra. Può anche scottare il bersaglio.
