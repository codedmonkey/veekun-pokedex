    x-y:
      ja-Hrkt: |-
        てんくうから　いんせきを
        あいてに　おとす。つかうと　はんどうで
        じぶんの　とくこうが　がくっと　さがる。
      ja: |-
        天空から　隕石を
        相手に　落とす。使うと　反動で
        自分の　特攻が　がくっと　さがる。
      ko: |-
        천공에서 운석을 상대에게
        떨어뜨린다. 사용하면 반동으로
        자신의 특수공격이 크게 떨어진다.
      en: |-
