    black-white:
      en: |-
        A column of grass hits opposing Pokémon.
        When used with its water equivalent, its
        damage increases into a vast swamp.
      fr: |-
        Une masse végétale s’abat sur l’ennemi.
        En l’utilisant avec Aire d’Eau, l’effet
        augmente et un marécage apparaît.
    black-2-white-2:
      en: |-
        A column of grass hits opposing Pokémon.
        When used with its water equivalent, its
        damage increases into a vast swamp.
    x-y:
      ja-Hrkt: |-
        くさの　はしらで　こうげきする。
        みずと　くみあわせると　いりょくが
        あがって　あたりが　しつげんに　なる。
      ja: |-
        草の柱で　攻撃する。
        みずと　組みあわせると　威力が
        あがって　あたりが　湿原に　なる。
      ko: |-
        풀기둥으로 공격한다.
        물과 조합하면 위력이
        올라가고 주변이 습지초원이 된다.
      en: |-
        A column of grass hits the target. When used with
        its water equivalent, its damage increases and
        a vast swamp appears.
      fr: |-
        Une masse végétale s’abat sur l’ennemi.
        En l’utilisant avec Aire d’Eau, l’effet augmente
        et un marécage apparaît.
      de: |-
        Ein Angriff mit Pflanzsäulen. Mit Wassersäulen
        kombiniert steigt die Wirkung und die Umgebung
        wird zu einem Sumpf.
      es: |-
        Ataca con columnas de hojas. Combinado con
        Voto Agua, crea un pantano y aumenta su
        potencia.
      it: |-
        Attacca il bersaglio con una colonna d’erba.
        Se usata con Acquapatto, gli effetti aumentano
        e il campo diventa una palude.
