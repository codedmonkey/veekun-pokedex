  flavor_text:
    black-white:
      en: |-
        The user hurls an electric orb
        at the target. The faster the user is
        than the target, the greater the damage.
      fr: |-
        Le lanceur envoie une boule d’électricité.
        Si sa Vitesse est plus grande que celle de
        l’ennemi, les dégâts augmentent d’autant.
    black-2-white-2:
      en: |-
        The user hurls an electric orb
        at the target. The faster the user is
        than the target, the greater the damage.
    x-y:
      ja-Hrkt: |-
        でんきの　かたまりを　あいてに
        ぶつける。あいてより　すばやさが
        はやいほど　いりょくが　あがる。
      ja: |-
        電気の　塊を　相手に
        ぶつける。相手より　素早さが
        速いほど　威力が　あがる。
      ko: |-
        전기 덩어리를 상대에게 부딪쳐서
        공격한다. 상대보다 스피드가
        빠를수록 위력이 올라간다.
      en: |-
        The user hurls an electric orb
        at the target. The faster the user is
        than the target, the greater the move’s power.
      fr: |-
        Le lanceur envoie une boule d’électricité.
        Si sa Vitesse est plus grande que celle de
        l’ennemi, les dégâts augmentent d’autant.
      de: |-
        Je höher die Initiative des Anwenders im Vergleich
        zum Ziel ist, desto stärker trifft dieses eine
        geballte Ladung Strom.
      es: |-
        Lanza una bola eléctrica. Cuanto mayor sea la
        Velocidad del usuario en comparación con la del
        objetivo, mayor será el daño causado.
      it: |-
        Chi la usa attacca con una sfera d’energia elettrica.
        Più è rapido rispetto al bersaglio, più danni arreca.
