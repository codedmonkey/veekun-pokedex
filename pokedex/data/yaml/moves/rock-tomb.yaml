    x-y:
      ja-Hrkt: |-
        がんせきを　なげつけて　こうげきする。
        あいての　うごきを　ふうじることで
        すばやさを　さげる。
      ja: |-
        岩石を　投げつけて　攻撃する。
        相手の　動きを　封じることで
        素早さを　さげる。
      ko: |-
        암석을 내던져서 공격한다.
        상대의 움직임을 봉인함으로써
        스피드를 떨어뜨린다.
      en: |-
