    x-y:
      ja-Hrkt: |-
        わざを　だすまえに
        さいごに　うけた　わざの　ダメージを
        おおきくして　だした　あいてに　かえす。
      ja: |-
        技を　だす前に
        最後に　受けた　技の　ダメージを
        大きくして　だした　相手に　返す。
      ko: |-
        기술을 쓰기 전에
        마지막으로 받은 기술의 데미지를
        늘려서 기술을 쓴 상대에게 돌려준다.
      en: |-
        The user retaliates with much greater
        power against the target
        that last inflicted damage on it.
      fr: |-
        Le lanceur attaque le dernier ennemi l’ayant blessé
        durant le même tour en frappant plus fort.
      de: |-
        Attacke mit großer Kraft gegen das Ziel,
        das dem Anwender in derselben Runde
        zuletzt Schaden zufügte.
      es: |-
        Devuelve al objetivo el último ataque recibido,
        pero con mucha más fuerza.
      it: |-
        Chi la usa si vendica sul nemico che l’ha appena
        ferito con una mossa anche più potente.
