  flavor_text:
    x-y:
      ja-Hrkt: |-
        みわくの　なきごえを　だして　あいてに
        せいしんてきな　ダメージを　あたえる。
        こうげきは　かならず　めいちゅう　する。
      ja: |-
        魅惑の　鳴き声を　だして　相手に
        精神的な　ダメージを　与える。
        攻撃は　必ず　命中　する。
      ko: |-
        매혹적인 울음소리를 내어
        상대에게 정신적 데미지를 준다.
        공격은 반드시 명중한다.
      en: |-
        Letting out a charming cry, the user does
        emotional damage to opposing Pokémon.
        This attack never misses.
      fr: |-
        Laisse s’échapper une voix enchanteresse qui
        inflige des dégâts psychiques à l’ennemi.
        Touche à coup sûr.
      de: |-
        Der Anwender stößt einen bezirzenden Ruf aus,
        mit dem er das Ziel in seinen Bann schlägt und
        ihm immer mentalen Schaden zufügt.
      es: |-
        Obnubila a los oponentes con su fascinante voz y
        les provoca daños emocionales. Siempre acierta
        al objetivo.
      it: |-
        Chi la usa infligge un danno spirituale ai nemici nei
        paraggi con una voce suadente. L’attacco andrà
        immancabilmente a segno.
