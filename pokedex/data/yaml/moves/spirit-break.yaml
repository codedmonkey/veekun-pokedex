        The user attacks the target with so much force that it
        could break the target’s spirit. This also lowers the
        target’s Sp. Atk stat.
      fr: |-
        Le lanceur attaque son adversaire avec une telle force
        que ce dernier peut s’en retrouver profondément
        troublé. Baisse l’Attaque Spéciale de la cible.
      de: |-
        Die Attacke trifft das Ziel mit so viel Wucht, dass es
        den Mut verliert. Dabei wird sein Spezial-Angriff
        gesenkt.
      es: |-
        El usuario ataca al objetivo con tal ímpetu que acaba
        minando su moral y, en consecuencia, reduce su Ataque
        Especial.
      it: |-
        Chi la usa attacca il bersaglio con un tale impeto
        da fargli perdere la voglia di lottare e ne riduce
        l’Attacco Speciale.
