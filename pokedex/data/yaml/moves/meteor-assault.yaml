      ja-Hrkt: |-
        ふとい　クキを　ふりまわして　こうげき。
        ただし　じぶんも　よろめいてしまうため
        つぎの　ターンは　うごけなくなる。
      ja: |-
        太い　クキを　ふりまわして　攻撃。
        ただし　自分も　よろめいてしまうため
        次の　ターンは　動けなくなる。
      ko: |-
        굵은 줄기를 휘둘러서 공격한다.
        단 자신도 비틀거리기 때문에
        다음 턴은 움직일 수 없다.
      zh-Hant: |-
        揮舞粗壯的莖進行攻擊。
        但同時自己也會站不穩，
        下一回合將無法動彈。
      zh-Hans: |-
        大力挥舞粗壮的茎进行攻击。
        但同时自己也会被晃晕，
        下一回合自己将无法动弹。
      en: |-
        The user attacks wildly with its thick leek.
        The user can’t move on the next turn, because the
        force of this move makes it stagger.
      fr: |-
        Le lanceur attaque son adversaire avec son poireau.
        Toutefois, cette action le fait vaciller et il doit
        se reposer au tour suivant.
      de: |-
        Der Anwender greift mit seiner Lauchstange an. Von der
        Wucht der Attacke wird ihm jedoch so schwindelig,
        dass er in der nächsten Runde nicht handeln kann.
      es: |-
        El usuario agita violentamente su grueso puerro para
        atacar, pero el mareo que le provocan las sacudidas le
        impide moverse en el turno siguiente.
      it: |-
        Chi la usa attacca il bersaglio brandendo un grosso
        gambo, ma perde l’equilibrio e nel turno successivo
        non può agire.
