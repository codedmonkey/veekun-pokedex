      fr: |-
        Le lanceur taillade l’ennemi en utilisant ses faux ou
        ses griffes comme une paire de ciseaux.
      de: |-
        Der Anwender führt eine Attacke aus,
        die einer Scherenbewegung ähnelt.
      es: |-
        Cruza las guadañas o las garras para atacar al
        objetivo como si fueran unas tijeras.
      it: |-
        Chi la usa colpisce il bersaglio usando le sue falci
        o i suoi artigli come se fossero delle forbici.
