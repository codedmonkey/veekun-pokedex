  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        じめんから　たちのぼる　でんげきで　こうげき。
        あいてが　エレキフィールドに　いるとき
        わざの　いりょくが　２ばいに　なる。
      ja: |-
        地面から　立ちのぼる　電撃で　攻撃。
        相手が　エレキフィールドに　いる時
        技の　威力が　２倍に　なる。
      ko: |-
        지면에서 올라오는 전격으로 공격한다.
        상대가 일렉트릭필드 위에 있을 때
        기술의 위력이 2배가 된다.
      zh-Hant: |-
        用從地面升騰的電擊攻擊。
        當對手在電氣場地時，
        招式威力會變成２倍。
      zh-Hans: |-
        用从地面升腾而起的电击进行攻击。
        当对手处于电气场地上时，
        招式威力会变成２倍。
      en: |-
        The user attacks with electric voltage rising from
        the ground. This move’s power doubles when the target
        is on Electric Terrain.
      fr: |-
        Des éclairs surgissent du sol et frappent l’ennemi.
        La puissance de cette attaque est doublée si la cible
        est sur un Champ Électrifié.
      de: |-
        Der Anwender greift mit aus dem Boden aufsteigender
        Elektrizität an. Die Stärke der Attacke wird verdoppelt,
        wenn beim Gegner ein Elektrofeld aktiv ist.
      es: |-
        Ataca con una descarga eléctrica que surge del terreno
        de combate. La potencia del movimiento se duplica si
        el rival se ve afectado por un campo eléctrico.
      it: |-
        Chi la usa attacca con dell’elettricità che si alza
        dal suolo. La potenza della mossa raddoppia quando
        l’avversario si trova in un Campo Elettrico.
