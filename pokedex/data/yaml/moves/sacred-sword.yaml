    black-white:
      en: |-
        The user attacks by slicing with its long
        horns. The target’s stat changes
        don’t affect this attack’s damage.
      fr: |-
        Un coup de lame violent qui lacère
        l’ennemi et lui inflige des dégâts quels
        que soient ses changements de stats.
    black-2-white-2:
      en: |-
        The user attacks by slicing with its long
        horns. The target’s stat changes
        don’t affect this attack’s damage.
    x-y:
      ja-Hrkt: |-
        ながい　つので　きりつけ　こうげきする。
        あいての　のうりょく　へんかに
        かんけいなく　ダメージを　あたえる。
      ja: |-
        長い　つので　切りつけ　攻撃する。
        相手の　能力変化に
        関係なく　ダメージを　与える。
      ko: |-
        긴 뿔로 베어 공격한다.
        상대의 능력 변화에
        관계없이 데미지를 준다.
      en: |-
        The user attacks by slicing with a long
        horn. The target’s stat changes
        don’t affect this attack’s damage.
      fr: |-
        Un coup de corne violent qui lacère l’ennemi
        et lui inflige des dégâts quels que soient ses
        changements de stats.
      de: |-
        Schneideangriff mit langem Horn.
        Richtet Schaden unabhängig von
        Statusveränderungen des Zieles an.
      es: |-
        El usuario ataca con una espada, ignorando
        cualquier cambio en las características del
        objetivo.
      it: |-
        Chi la usa taglia il bersaglio con una spada magica.
        Il danno inflitto ignora le modifiche alle statistiche
        del Pokémon colpito.
