    x-y:
      ja-Hrkt: |-
        ツメや　カマなどで
        あいてを　ひっかいて　こうげきする。
        ２ー５かいの　あいだ　れんぞくで　だす。
      ja: |-
        ツメや　カマなどで
        相手を　ひっかいて　攻撃する。
        ２ー５回の　あいだ　連続で　だす。
      ko: |-
        손톱이나 낫 등으로
        상대를 할퀴어서 공격한다.
        2-5회 동안 연속으로 쓴다.
      en: |-
        The target is raked with sharp claws or
        scythes quickly two to five times in a row.
      fr: |-
        L’ennemi est lacéré par des faux ou des griffes
        de deux à cinq fois d’affilée.
      de: |-
        Beharkt das Ziel zwei- bis fünfmal
        mit scharfen Klauen oder Sicheln.
      es: 'Araña rápidamente de dos a cinco veces.'
      it: |-
        Colpisce il bersaglio con artigli o falci affilate
        da due a cinque volte in rapida successione.
