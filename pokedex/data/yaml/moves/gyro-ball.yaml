    x-y:
      ja-Hrkt: |-
        からだを　こうそくに　かいてん　させて
        たいあたりする。あいてより　すばやさが
        ひくいほど　つよい。
      ja: |-
        体を　高速に　回転させて
        体当たりする。相手より　素早さが
        低いほど　強い。
      ko: |-
        몸을 고속으로 회전시켜
        몸통박치기한다. 상대보다 스피드가
        낮을수록 위력은 올라간다.
      en: |-
        The user tackles the target with a high-speed
        spin. The slower the user compared to the
        target, the greater the move’s power.
      fr: |-
        Le lanceur effectue une rotation et frappe l’ennemi.
        Plus la Vitesse du lanceur est basse, plus il fait
        de dégâts.
      de: |-
        Angriff mit hoher Geschwindigkeit. Je niedriger
        die Initiative des Anwenders, desto höher
        der Schaden.
      es: |-
        Embiste al objetivo con un potente ataque giratorio.
        Cuanto más lento es el usuario, más daño causa.
      it: |-
        Chi la usa colpisce il bersaglio con un vortice
        rapidissimo. Più lento è chi la usa, maggiore
        è il danno.
