parting-shot:
  accuracy: 100
  changelog: {  }
  contest_effect: ~
  contest_type: ~
  damage_class: status
  effect: move-effect-347
  effect_chance: 100
  flags:
    - protect
    - reflectable
    - mirror
    - sound
    - authentic
  flavor_text:
    x-y:
      ja-Hrkt: |-
        すてゼリフで　あいてを　いかくし
        こうげきと　とくこうを　さげたのち
        ひかえの　ポケモンと　いれかわる。
      ja: |-
        すてゼリフで　相手を　いかくし
        攻撃と　特攻を　さげたのち
        控えの　ポケモンと　入れ替わる。
      ko: |-
        막말을 내뱉어 상대를 위협하여
        공격과 특수공격을 떨어뜨린 후
        교대 포켓몬과 교체한다.
      en: |-
        With a parting threat, the user lowers
        the target’s Attack and Sp. Atk stats.
        Then it switches with a party Pokémon.
      fr: |-
        Menace l’ennemi dans une ultime tirade avant
        de changer de place avec un autre Pokémon.
        Réduit l’Attaque et l’Attaque Spéciale de l’ennemi.
      de: |-
        Schüchtert das Ziel mit einer Abgangstirade ein,
        sodass dessen Angriffs- und Spezial-Angriffs-Wert
        sinken. Danach wird der Anwender ausgewechselt.
      es: |-
        El usuario se cambia por otro Pokémon de su
        equipo, pero antes amedrenta a su oponente y
        hace que disminuyan su Ataque y Ataque Especial.
      it: |-
        Chi la usa lancia un monito intimidatorio al bersaglio,
        riducendone l’Attacco e l’Attacco Speciale, e si fa
        sostituire da un altro Pokémon della squadra.
