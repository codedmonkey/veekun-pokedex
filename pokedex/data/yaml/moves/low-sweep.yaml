        The user attacks the target’s legs
        swiftly, reducing the target’s
        Speed stat.
      fr: |-
        Un coup rapide qui vise les pieds
        de l’ennemi et diminue sa Vitesse.
    black-2-white-2:
      en: |-
        The user attacks the target’s legs
        swiftly, reducing the target’s
        Speed stat.
    x-y:
      ja-Hrkt: |-
        すばやい　うごきで　あいての　あしを
        ねらって　こうげきする。
        あいての　すばやさを　さげる。
      ja: |-
        素早い　動きで　相手の　足を
        ねらって　攻撃する。
        相手の　素早さを　さげる。
      ko: |-
        재빠른 움직임으로 상대의 다리를
        노려 공격한다.
        상대의 스피드를 떨어뜨린다.
      en: |-
        The user makes a swift attack on the target’s legs,
        which lowers the target’s Speed stat.
      fr: |-
        Un coup rapide qui vise les pieds de l’ennemi
        et diminue sa Vitesse.
      de: |-
        Anwender greift mit blitzschnellen Bewegungen
        die Beine des Zieles an und senkt dessen Initiative.
      es: |-
        Ataque rápido dirigido a los pies del objetivo que
        le hace perder Velocidad.
      it: |-
        Chi la usa colpisce con un attacco fulmineo
        la parte inferiore del corpo del bersaglio,
        riducendone la Velocità.
