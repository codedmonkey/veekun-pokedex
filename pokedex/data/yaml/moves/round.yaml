  flavor_text:
    black-white:
      en: |-
        The user attacks the target with a song.
        Others can join in the Round and make
        the attack do greater damage.
      fr: |-
        Le lanceur attaque l’ennemi en chantant.
        Si plusieurs Pokémon déclenchent cette
        attaque à la suite, l’effet augmente.
    black-2-white-2:
      en: |-
        The user attacks the target with a song.
        Others can join in the Round and make
        the attack do greater damage.
    x-y:
      ja-Hrkt: |-
        うたで　あいてを　こうげきする。
        みんなで　りんしょう　すると　つづけて
        だすことが　でき　いりょくも　あがる。
      ja: |-
        歌で　相手を　攻撃する。
        みんなで　輪唱すると　続けて
        だすことが　でき　威力も　あがる。
      ko: |-
        노래로 상대를 공격한다.
        함께 돌림노래를 하면 계속해서
        쓸 수 있고 위력도 올라간다.
      en: |-
        The user attacks the target with a song.
        Others can join in the Round and make
        the attack do greater damage.
      fr: |-
        Le lanceur attaque l’ennemi en chantant.
        Si plusieurs Pokémon déclenchent cette attaque à
        la suite, l’effet augmente.
      de: |-
        Angriff mit Gesang. Singt der Anwender mit allen
        im Kanon, steigt die Stärke.
      es: |-
        Un canto que ataca al objetivo. Cuantos más
        Pokémon lo usan, más aumenta de potencia.
      it: |-
        Attacca il bersaglio con una melodia. Se usata
        durante lo stesso turno da più Pokémon, i danni
        inflitti aumentano.
