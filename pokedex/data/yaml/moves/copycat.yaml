    diamond-pearl:
      en: |-
        The user mimics the
        move used immediately
        before it. The move
        fails if no other move
        has been used yet.
    platinum:
      en: |-
        The user mimics the
        move used immediately
        before it. The move
        fails if no other move
        has been used yet.
    heartgold-soulsilver:
      en: |-
        The user mimics the
        move used immediately
        before it. The move
        fails if no other move
        has been used yet.
    black-white:
      en: |-
        The user mimics the move used immediately
        before it. The move fails if no other move
        has been used yet.
      fr: |-
        Le lanceur imite la dernière capacité
        employée. Échoue si aucune capacité
        n’a été utilisée.
    black-2-white-2:
      en: |-
        The user mimics the move used immediately
        before it. The move fails if no other move
        has been used yet.
    x-y:
      ja-Hrkt: |-
        ちょくぜんに　でた　わざを　まねして
        おなじ　わざを　だす。
        わざが　でていないと　しっぱい　する。
      ja: |-
        直前に　でた　技を　まねして
        同じ　技を　だす。
        技が　でていないと　失敗する。
      ko: |-
        직전에 나온 기술을 흉내 내어
        같은 기술을 쓴다.
        기술이 나오지 않았으면 실패한다.
      en: |-
        The user mimics the move used immediately
        before it. The move fails if no other move
        has been used yet.
      fr: |-
        Le lanceur imite la dernière capacité employée.
        Échoue si aucune capacité n’a été utilisée.
      de: |-
        Anwender imitiert gerade verwendete Attacke.
        Dies schlägt fehl, falls zuvor keine Attacke
        verwendet wurde.
      es: |-
        Imita el movimiento usado justo antes.
        El movimiento falla si no se ha usado aún ninguno.
      it: |-
        Chi la usa mima l’ultima mossa eseguita.
        Fallisce se non è stata ancora usata alcuna
        mossa.
