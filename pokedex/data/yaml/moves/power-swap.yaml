        ちょうのうりょくで　じぶんと　あいての
        こうげきと　とくこうの
        のうりょく　へんかを　いれかえる。
      ja: |-
        超能力で　自分と　相手の
        攻撃と　特攻の
        能力変化を　入れ替える。
      ko: |-
        초능력으로 자신과 상대의
        공격과 특수공격의
        능력 변화를 교체한다.
