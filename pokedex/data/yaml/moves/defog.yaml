  flavor_text:
    diamond-pearl:
      en: |-
        Obstacles are moved,
        reducing the foe’s
        evasion stat. It can
        also be used to
        clear deep fog, etc.
    platinum:
      en: |-
        Obstacles are moved,
        reducing the foe’s
        evasion stat. It can
        also be used to
        clear deep fog, etc.
    heartgold-soulsilver:
      en: |-
        It reduces the foe’s
        evasion stat. It also
        removes spikes,
        light screens, etc.
    black-white:
      en: |-
        A strong wind blows away the target’s
        obstacles such as Reflect or Light Screen.
        It also lowers the target’s evasiveness.
      fr: |-
        Un grand coup de vent qui disperse la
        Protection ou le Mur Lumière de l’ennemi.
        Diminue aussi son Esquive.
    black-2-white-2:
      en: |-
        A strong wind blows away the target’s
        obstacles such as Reflect or Light Screen.
        It also lowers the target’s evasiveness.
    x-y:
      ja-Hrkt: |-
        つよいかぜで　あいての　リフレクターや
        ひかりのかべ　などを　はらいのける。
        かいひりつも　さげる。
      ja: |-
        強い風で　相手の　リフレクターや
        ひかりのかべ　などを　はらいのける。
        回避率も　さげる。
      ko: |-
        강한 바람으로 상대의 리플렉터나
        빛의장막 등을 제거한다.
        회피율도 떨어뜨린다.
      en: |-
        A strong wind blows away the target’s
        barriers such as Reflect or Light Screen.
        This also lowers the target’s evasiveness.
      fr: |-
        Un grand coup de vent qui disperse la Protection
        ou le Mur Lumière de l’ennemi. Diminue aussi
        son Esquive.
      de: |-
        Starker Wind hebt Attacken wie Reflektor und
        Lichtschild des Zieles auf. Senkt außerdem
        den Fluchtwert.
      es: |-
        Potente viento que barre el Reflejo o Pantalla de
        Luz del objetivo y puede reducir su Evasión.
      it: |-
        Chi la usa spazza via barriere come Riflesso e
        Schermoluce con un forte vento e riduce
        la capacità d’elusione del bersaglio.
