  flavor_text:
    diamond-pearl:
      en: |-
        The user disappears,
        then strikes the foe
        on the second turn.
        It hits even if the
        foe used Protect.
    platinum:
      en: |-
        The user disappears,
        then strikes the foe
        on the second turn.
        It hits even if the
        foe used Protect.
    heartgold-soulsilver:
      en: |-
        The user disappears,
        then strikes the foe
        on the second turn.
        It hits even if the
        foe protects itself.
    black-white:
      en: |-
        The user disappears, then strikes the
        target on the second turn.
        It hits even if the target protects itself.
      fr: |-
        Le lanceur disparaît et frappe l’ennemi
        au second tour. Fonctionne même si
        l’ennemi se protège.
    black-2-white-2:
      en: |-
        The user disappears, then strikes the
        target on the second turn.
        It hits even if the target protects itself.
    x-y:
      ja-Hrkt: |-
        １ターンめで　すがたを　けして
        ２ターンめに　あいてを　こうげきする。
        まもっていても　こうげきは　あたる。
      ja: |-
        １ターン目で　姿を　消して
        ２ターン目に　相手を　攻撃する。
        守っていても　攻撃は　当たる。
      ko: |-
        1턴째에 모습을 감춰
        2턴째에 상대를 공격한다.
        방어하고 있어도 공격은 맞는다.
      en: |-
        The user disappears, then strikes the
        target on the next turn.
        This move hits even if the target protects itself.
      fr: |-
        Le lanceur disparaît et frappe l’ennemi au second
        tour. Fonctionne même si l’ennemi se protège.
      de: |-
        Anwender verschwindet in Runde 1
        und attackiert in Runde 2. Trifft auch,
        wenn sich das Ziel selbst schützt.
      es: |-
        En el primer turno, desaparece. En el segundo,
        golpea al objetivo aunque se esté protegiendo.
      it: |-
        Chi la usa sparisce e poi colpisce il bersaglio
        al turno successivo. Colpisce anche un Pokémon
        che ha usato Protezione o Individua.
