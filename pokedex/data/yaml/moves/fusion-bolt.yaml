  flavor_text:
    black-white:
      en: |-
        The user throws down a giant thunderbolt.
        This attack does greater damage
        when influenced by an enormous flame.
      fr: |-
        Projette un orbe électrique
        gigantesque. L’effet augmente
        sous l’influence de Flamme Croix.
    black-2-white-2:
      en: |-
        The user throws down a giant thunderbolt.
        This attack does greater damage
        when influenced by an enormous flame.
    x-y:
      ja-Hrkt: |-
        きょだいな　いかずちを　たたきつける。
        きょだいな　ほのおの　えいきょうをうけ
        わざの　いりょくが　あがる。
      ja: |-
        巨大な　雷を　たたきつける。
        巨大な　炎の　影響を受け
        技の　威力が　あがる。
      ko: |-
        거대한 천둥을 내리친다.
        거대한 불꽃의 영향을 받아
        기술의 위력이 올라간다.
      en: |-
        The user throws down a giant thunderbolt.
        This move is more powerful when
        influenced by an enormous flame.
      fr: |-
        Projette un orbe électrique gigantesque.
        L’effet augmente sous l’influence de Flamme Croix.
      de: |-
        Feuert einen monströsen Blitz ab.
        Wird die Attacke durch eine gigantische
        Flamme modifiziert, steigt die Stärke.
      es: |-
        Ataca con una enorme descarga eléctrica.
        Aumenta su potencia si es influenciada por
        una gigantesca llamarada.
      it: |-
        Chi la usa lancia un fulmine enorme. Se usata in
        combinazione con Incrofiamma, il danno provocato
        dalla mossa aumenta.
