        Versprüht Blasen, die eventuell den Initiative-Wert
        des Zieles senken.
      es: 'Diluvio de burbujas que puede bajar la Velocidad.'
      it: |-
        Colpisce il bersaglio con una forte scarica di bolle.
        Può anche ridurne la Velocità.
