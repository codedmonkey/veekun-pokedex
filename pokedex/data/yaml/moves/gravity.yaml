        making moves involving flying unusable
        and negating Levitate.
      fr: |-
        La gravité augmente pendant 5 tours,
        ce qui empêche les capacités volantes
        et annule Lévitation.
    black-2-white-2:
      en: |-
        Gravity is intensified for five turns,
        making moves involving flying unusable
        and negating Levitate.
    x-y:
      ja-Hrkt: |-
        ５ターンの　あいだ
        じゅうりょくを　つよくして　ふゆうや
        そらへ　とぶ　わざを　つかえなく　する。
      ja: |-
        ５ターンの　あいだ
        重力を　強くして　ふゆうや
        空へ　飛ぶ　技を　使えなくする。
      ko: |-
        5턴 동안 중력을
        강하게 해서 부유나 하늘을 나는
        기술을 사용할 수 없게 한다.
      en: |-
        Gravity is intensified for five turns,
        making moves involving flying unusable
        and negating Levitate.
      fr: |-
        La gravité augmente pendant cinq tours, ce qui
        empêche les capacités volantes et annule
        Lévitation.
      de: |-
        Die Gravitation wird für fünf Runden erhöht.
        Macht Fliegen unmöglich und verhindert Schwebe.
      es: |-
        La gravedad aumenta durante cinco turnos, lo que
        impide acciones que impliquen volar o levitar.
      it: |-
        Intensifica la gravità per cinque turni. Le mosse
        che fanno volare sono inutilizzabili e l’abilità
        Levitazione non ha effetto.
