  flavor_text:
    x-y:
      ja-Hrkt: |-
        ういている　ポケモンにも　あたる。
        ういていた　あいては
        うちおとされて　じめんに　おちる。
      ja: |-
        浮いている　ポケモンにも　当たる。
        浮いていた　相手は
        撃ち落とされて　地面に　落ちる。
      ko: |-
        떠 있는 포켓몬도 맞힐 수 있다.
        떠 있던 상대는
        맞아서 땅에 떨어진다.
      en: |-
        This move also hits opposing Pokémon
        that are in the air. Those Pokémon are
        knocked down to the ground.
      fr: |-
        Touche même les Pokémon dans les airs.
        Dans ce cas, la cible retombe au sol.
      de: |-
        Die Attacke erfasst auch schwebende Pokémon.
        Erfasst sie ein Pokémon im Schwebe-Zustand,
        fällt es zu Boden.
      es: |-
        Acierta incluso a Pokémon que estén en el aire
        y los hace caer al suelo.
      it: |-
        Colpisce anche i Pokémon che fluttuano in aria.
        I nemici nei paraggi vengono scaraventati a terra.
