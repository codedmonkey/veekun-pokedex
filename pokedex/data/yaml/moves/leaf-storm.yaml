    x-y:
      ja-Hrkt: |-
        とがった　はっぱで　あいてに　あらしを
        おこす。つかうと　はんどうで
        じぶんの　とくこうが　がくっと　さがる。
      ja: |-
        とがった　はっぱで　相手に　あらしを
        おこす。使うと　反動で
        自分の　特攻が　がくっと　さがる。
      ko: |-
        뾰족한 잎사귀로 상대에게 바람을
        일으킨다. 사용하면 반동으로
        자신의 특수공격이 크게 떨어진다.
      en: |-
        The user whips up a storm of leaves around
        the target. The attack’s recoil harshly
        lowers the user’s Sp. Atk stat.
      fr: |-
        Invoque une tempête de feuilles acérées.
        Le contrecoup réduit fortement l’Attaque Spéciale
        du lanceur.
      de: |-
        Anwender erzeugt einen Sturm aus scharfen
        Blättern. Rückstoß senkt Spezial-Angriff des
        Anwenders stark.
      es: |-
        Cae una lluvia de hojas afiladas. Baja mucho el
        Ataque Especial de quien lo usa.
      it: |-
        Si forma una tempesta di foglie affilate.
        Il contraccolpo riduce di molto l’Attacco Speciale
        di chi la usa.
