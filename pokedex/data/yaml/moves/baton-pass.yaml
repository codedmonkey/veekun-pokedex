    x-y:
      ja-Hrkt: |-
        ひかえの　ポケモンと　いれかわる。
        のうりょく　へんかは　かわった
        ポケモンが　そのまま　うけつぐ。
      ja: |-
        控えの　ポケモンと　入れ替わる。
        能力変化は　替わった
        ポケモンが　そのまま　受けつぐ。
      ko: |-
        교대 포켓몬과 바뀐다.
        능력 변화는 바뀐 포켓몬이
        그대로 이어받는다.
      en: |-
        The user switches places with a party
        Pokémon in waiting and passes along
        any stat changes.
      fr: |-
        Le lanceur échange sa place et tout changement
        de stat avec un Pokémon de l’équipe.
      de: |-
        Tauscht das eigene Pokémon aus.
        Alle Statusveränderungen bleiben bestehen.
      es: |-
        Cambia el puesto con un compañero y le pasa los
        cambios de características.
      it: |-
        Chi la usa è sostituito da un Pokémon della
        squadra, che eredita anche ogni modifica
        alle statistiche.
