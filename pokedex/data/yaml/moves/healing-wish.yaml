  flavor_text:
    diamond-pearl:
      en: |-
        The user faints. In
        return, the Pokémon
        taking its place will
        have its HP restored
        and status cured.
    platinum:
      en: |-
        The user faints. In
        return, the Pokémon
        taking its place will
        have its HP restored
        and status cured.
    heartgold-soulsilver:
      en: |-
        The user faints. In
        return, the Pokémon
        taking its place will
        have its HP restored
        and status cured.
    black-white:
      en: |-
        The user faints. In return, the Pokémon
        taking its place will have its HP restored
        and status cured.
      fr: |-
        Le lanceur tombe K.O. pour soigner les
        PV et le statut du Pokémon qui passe
        après lui.
    black-2-white-2:
      en: |-
        The user faints. In return, the Pokémon
        taking its place will have its HP restored
        and status cured.
    x-y:
      ja-Hrkt: |-
        じぶんは　ひんしに　なるが　ひかえから
        でてくる　ポケモンの　じょうたい
        いじょうと　ＨＰを　かいふく　する。
      ja: |-
        自分は　ひんしに　なるが
        控えから　でてくる　ポケモンの
        状態異常と　ＨＰを　回復する。
      ko: |-
        자신은 기절하지만
        교대하여 나오는 포켓몬의
        상태 이상과 HP를 회복한다.
      en: |-
        The user faints. In return, the Pokémon
        taking its place will have its HP restored
        and status conditions cured.
      fr: |-
        Le lanceur tombe K.O. pour soigner les PV et le
        statut du Pokémon qui passe après lui.
      de: |-
        Anwender geht K.O. Das an seine Stelle tretende
        Pokémon hat volle KP. Statusprobleme werden
        geheilt.
      es: |-
        El Pokémon cae debilitado, pero su sustituto
        recupera su estado y los PS.
      it: |-
        Chi la usa va KO, ma il Pokémon che lo sostituisce
        recupera tutti i PS e guarisce dai problemi di stato.
