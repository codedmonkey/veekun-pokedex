  flavor_text:
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        ピカチュウの　トレーナーへの　だいすきな
        きもちが　つよいほど　いりょくが　あがる
        でんげき。　かならず　めいちゅうする。
      ja: |-
        ピカチュウの　トレーナーへの　大好きな
        気持ちが　強いほど　威力が
        あがる　電撃。　必ず　命中する。
      ko: |-
        트레이너를 좋아하는 피카츄의
        마음이 강할수록 위력이 올라가는
        전격. 반드시 명중한다.
      zh-Hant: |-
        皮卡丘越喜歡訓練家，
        威力就越強大的電擊。
        攻擊必定會命中。
      zh-Hans: |-
        皮卡丘越喜欢训练家，
        电击的威力就越强。
        攻击必定会命中。
      en: |-
        The more Pikachu loves its Trainer, the greater the
        move’s power. It never misses.
      fr: |-
        Une attaque électrique dont la puissance est
        proportionnelle à l’amour que Pikachu vous porte.
        Touche à coup sûr.
      de: |-
        Je größer Pikachus Vertrauen zu seinem Trainer ist,
        desto stärker fällt dieser Angriff aus. Diese Attacke
        trifft immer.
      es: |-
        Lanza una descarga eléctrica infalible que resulta más
        potente cuanto mayor es el cariño que siente Pikachu
        hacia su Entrenador.
      it: |-
        Questa mossa infallibile diventa più potente
        con il rafforzarsi del rapporto tra Pikachu e l’Allenatore.
    sword-shield:
      ja-Hrkt: |-
        このわざは　つかえません
        おもいだすことが　できなくなりますが
        わざを　わすれることを　おすすめします
      ja: |-
        この技は　使えません
        思い出すことが　できなくなりますが
        技を　忘れることを　おすすめします
      ko: |-
        사용할 수 없는 기술입니다.
        다시 배우게 할 수 없지만
        기술을 잊게 하는 것을 권장합니다.
      zh-Hant: |-
        無法使用此招式。
        雖然忘記後將無法再想起來，
        但還是建議忘記此招式。
      zh-Hans: |-
        无法使用这个招式。
        虽然忘记之后就再也想不起来了，
        但还是建议忘记这个招式。
      en: |-
        This move can’t be used.
        It’s recommended that this move is forgotten.
        Once forgotten, this move can’t be remembered.
      fr: |-
        Cette capacité ne peut pas être utilisée.
        Il est recommandé de l’oublier, même s’il sera
        impossible de se la remémorer une fois oubliée.
      de: |-
        Diese Attacke kann nicht eingesetzt werden. Du solltest
        dein Pokémon sie vergessen lassen. Beachte aber,
        dass es sich danach nicht wieder an sie erinnern kann.
      es: |-
        Este movimiento no se puede usar, por lo que sería
        mejor olvidarlo, aunque eso implique que no se pueda
        recordar posteriormente.
      it: |-
        Questa mossa non può essere usata.
        È consigliabile farla dimenticare al Pokémon. Tuttavia,
        una volta dimenticata, non potrà più essere ricordata.
