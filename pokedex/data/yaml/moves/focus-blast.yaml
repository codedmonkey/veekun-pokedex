    x-y:
      ja-Hrkt: |-
        きあいを　たかめて　こんしんの　ちからを
        ほうしゅつする。あいての　とくぼうを
        さげることが　ある。
      ja: |-
        気合を　高めて
        ありったけの　力を　放出する。
        相手の　特防を　さげることが　ある。
      ko: |-
        기합을 높여서
        혼신의 힘을 방출한다. 상대의
        특수방어를 떨어뜨릴 때가 있다.
      en: |-
        The user heightens its mental focus and
        unleashes its power.
        This may also lower the target’s Sp. Def.
      fr: |-
        Le lanceur rassemble ses forces et laisse éclater
        son pouvoir. Peut aussi baisser la Défense Spéciale
        de l’ennemi.
      de: |-
        Anwender erhöht seinen mentalen Fokus
        und greift dann an. Senkt eventuell
        Spezial-Verteidigung des Zieles.
      es: |-
        Agudiza la concentración mental y libera su poder.
        Puede disminuir la Defensa Especial del objetivo.
      it: |-
        Chi la usa si concentra e rilascia la sua forza.
        Può ridurre la Difesa Speciale del Pokémon
        colpito.
