    black-white:
      en: |-
        The user lets loose a pitch-black shock
        wave at its target. It may also lower the
        target’s accuracy.
      fr: |-
        Le lanceur attaque l’ennemi avec une onde
        de choc ténébreuse. Peut aussi baisser la
        Précision de l’ennemi.
