    black-white:
      en: |-
        The user attacks by throwing a clump of
        special mud. All status changes are
        returned to normal.
      fr: |-
        Le lanceur jette un tas de détritus
        spéciaux sur la cible. Les changements
        de stats de la cible sont annulés.
    black-2-white-2:
      en: |-
        The user attacks by throwing a clump of
        special mud. All status changes are
        returned to normal.
