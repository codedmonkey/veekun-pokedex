  flavor_text:
    black-white:
      en: |-
        The user knocks away the target and
        drags out another Pokémon in its party.
        In the wild, the battle ends.
      fr: |-
        Un coup puissant qui blesse la cible
        et l’envoie balader. Dans la nature,
        met fin au combat.
    black-2-white-2:
      en: |-
        The target is knocked away and switched.
        In the wild, a battle against a single
        Pokémon ends.
    x-y:
      ja-Hrkt: |-
        あいてを　はじきとばして
        ひかえの　ポケモンを　ひきずりだす。
        やせいの　ばあいは　せんとうが　おわる。
      ja: |-
        相手を　はじきとばして
        控えの　ポケモンを　ひきずりだす。
        野生の　場合は　戦闘が　終わる。
      ko: |-
        상대를 튕겨내서
        교대할 포켓몬을 끌어낸다.
        야생의 경우에는 배틀이 끝난다.
      en: |-
        The target is knocked away, and a different
        Pokémon is dragged out. In the wild,
        this ends a battle against a single Pokémon.
      fr: |-
        Un coup puissant qui blesse la cible et l’envoie
        au loin. Dans la nature, met fin au combat.
      de: |-
        Putzt das Ziel vom Feld und wechselt
        es mit einem anderen Pokémon aus.
        Beendet Kämpfe gegen wilde Pokémon.
      es: |-
        Ataca al objetivo y lo obliga a cambiarse por otro
        Pokémon. Si es uno salvaje, acaba el combate.
      it: |-
        Chi la usa fa volar via il bersaglio in modo che
        venga sostituito. Se il bersaglio è un singolo
        Pokémon selvatico, la lotta finisce.
