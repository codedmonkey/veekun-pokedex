    x-y:
      ja-Hrkt: |-
        じかんが　ゆがむほどの　ちからを
        うちだして　あいてを　こうげきする。
        つぎの　ターンは　うごけなく　なる。
      ja: |-
        時間が　ゆがむほどの　力を
        うちだして　相手を　攻撃する。
        次の　ターンは　動けなくなる。
      ko: |-
        시간이 뒤틀릴 정도의 힘을
        사용해서 상대를 공격한다.
        다음 턴은 움직일 수 없다.
      en: |-
        The user blasts the target with power
        that distorts even time.
        The user can’t move on the next turn.
      fr: |-
        Le lanceur frappe si fort qu’il affecte le cours du
        temps. Il se repose au tour suivant.
      de: |-
        Anwender attackiert mit einer Kraft, die selbst
        die Zeit verzerrt. In der nächsten Runde muss er
        ruhen.
      es: |-
        Ataca al objetivo usando tal energía que el tiempo
        se distorsiona. El usuario descansa el siguiente
        turno.
      it: |-
        Chi la usa colpisce il bersaglio con una forza
        capace di alterare il tempo, ma deve stare fermo
        al turno successivo.
