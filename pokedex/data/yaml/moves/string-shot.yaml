        糸を　まきつけて　相手の
        素早さを　がくっと　さげる。
      ko: |-
        입에서 뿜어낸
        실을 휘감아서 상대의
        스피드를 크게 떨어뜨린다.
      en: |-
        The opposing Pokémon are bound
        with silk blown from the user’s mouth
        that harshly lowers the Speed stat.
      fr: |-
        Le lanceur crache de la soie pour ligoter l’ennemi
        et baisser sensiblement sa Vitesse.
      de: |-
        Umwickelt Ziele in der Nähe mit Fäden aus
        dem Mund und senkt den Initiative-Wert.
      es: |-
        Lanza seda a los rivales y reduce mucho su
        Velocidad.
      it: |-
        Chi la usa produce della seta che avvolge
        i nemici intorno e ne riduce di molto la Velocità.
