bolt-strike:
  accuracy: 85
  changelog: {  }
  contest_effect: ~
  contest_type: ~
  damage_class: physical
  effect: move-effect-7
  effect_chance: 20
  flags:
    - contact
    - protect
    - mirror
  flavor_text:
    black-white:
      en: |-
        The user charges its target, surrounding
        itself with a great amount of electricity.
        It may leave the target with paralysis.
      fr: |-
        S’enveloppe d’une charge électrique
        surpuissante et se jette sur l’ennemi.
        Peut aussi le paralyser.
    black-2-white-2:
      en: |-
        The user charges its target, surrounding
        itself with a great amount of electricity.
        It may leave the target with paralysis.
    x-y:
      ja-Hrkt: |-
        ぼうだいな　でんきを　みに　まとって
        あいてに　とっしんして　こうげきする。
        まひ　じょうたいに　することが　ある。
      ja: |-
        ぼうだいな　電気を　身に　まとって
        相手に　突進して　攻撃する。
        まひ状態に　することが　ある。
      ko: |-
        방대한 전기를 몸에 둘러
        상대에게 돌진해서 공격한다.
        마비 상태로 만들 때가 있다.
      en: |-
        The user surrounds itself with a great amount
        of electricity and charges its target.
        This may also leave the target with paralysis.
      fr: |-
        Le lanceur s’enveloppe d’une charge électrique
        surpuissante et se jette sur l’ennemi. Peut aussi
        le paralyser.
      de: |-
        Lädt seinen Körper mit einer gewaltigen Menge
        an Elektrizität auf und rammt damit das Ziel.
        Ziel wird eventuell paralysiert.
      es: |-
        Ataca envolviéndose de una gran carga eléctrica y
        embistiendo al objetivo con ella. Puede paralizar.
      it: |-
        Colpisce il bersaglio con una possente carica
        elettrica e può anche paralizzarlo.
