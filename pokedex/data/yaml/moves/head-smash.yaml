    x-y:
      ja-Hrkt: |-
        いのちを　かけて　こんしんの　ちからで
        あいてに　ずつきを　する。じぶんも
        ものすごい　ダメージを　うける。
      ja: |-
        命を　懸けて　こん身の　力で
        相手に　ずつきを　する。自分も
        ものすごい　ダメージを　受ける。
      ko: |-
        목숨을 걸고 혼신의 힘으로
        상대에게 박치기를 한다.
        자신도 굉장한 데미지를 입는다.
      en: |-
        The user attacks the target with a
        hazardous, full-power headbutt.
        This also damages the user terribly.
      fr: |-
        Le lanceur assène un coup de tête désespéré.
        Blesse aussi gravement le lanceur.
      de: |-
        Anwender greift unter Einsatz seines Lebens
        mit einem Kopfstoß an und nimmt dabei selbst
        jede Menge Schaden.
      es: |-
        El usuario arriesga su vida y lanza un cabezazo
        con toda su fuerza. El agresor resulta seriamente
        dañado.
      it: |-
        Chi la usa attacca con tutta la potenza di cui
        dispone, ma subisce danni considerevoli.
