  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        Ｚパワーで　はきだした　いとが
        ぜんりょくで　あいてを　しばりつける。
        もとになった　わざで　いりょくが　かわる。
      ja: |-
        Ｚパワーで　吐きだした　糸が
        全力で　相手を　縛りつける。
        元になった　技で　威力が　変わる。
      ko: |-
        Z파워로 뱉어낸 실이
        전력으로 상대를 붙들어 맨다.
        원래 기술에 따라 위력이 변한다.
      zh-Hant: |-
        透過Ｚ力量用吐出的絲線
        全力束縛對手。
        威力會隨原本的招式而改變。
      zh-Hans: |-
        通过Ｚ力量将吐出的丝线
        全力束缚对手。
        威力会根据原来的招式而改变。
      en: |-
        The user binds the target with full force with
        threads of silk that the user spits using its Z-Power.
        The power varies, depending on the original move.
      fr: |-
        Le Pokémon utilise la Force Z pour cracher de longs
        fils de soie et enserrer l’adversaire. La puissance
        varie selon celle de la capacité originale.
      de: |-
        Mithilfe von Z-Kraft umwickelt der Anwender das
        Ziel mit Fäden. Die Stärke variiert je nach zugrunde
        liegender Attacke.
      es: |-
        Emplea el Poder Z para encerrar a su oponente en
        un capullo contra el que arremete con fuerza. 
        Su potencia depende de la del movimiento original.
      it: |-
        Chi la usa sfrutta il Potere Z per creare dei
        filamenti che intrappolano il bersaglio. La potenza
        varia a seconda della mossa su cui si basa.
