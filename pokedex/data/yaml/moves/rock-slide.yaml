        おおきな　いわを
        はげしく　ぶつけて　こうげきする。
        あいてを　ひるませる　ことが　ある。
      ja: |-
        大きな　岩を
        激しく　ぶつけて　攻撃する。
        相手を　ひるませることが　ある。
      ko: |-
        큰 바위를
        세차게 부딪쳐서 공격한다.
        상대를 풀죽게 만들 때가 있다.
      en: |-
        Large boulders are hurled at the opposing
        Pokémon to inflict damage. This may also make
        the opposing Pokémon flinch.
      fr: |-
        Envoie de gros rochers sur l’ennemi pour infliger
        des dégâts. Peut aussi l’apeurer.
      de: |-
        Schleudert riesige Felsen auf Ziele in der
        Umgebung, die eventuell zurückschrecken.
      es: |-
        Lanza grandes pedruscos. Puede hacer retroceder
        a los rivales.
      it: |-
        I nemici intorno a chi la usa vengono colpiti da
        grandi massi che possono anche farli tentennare.
