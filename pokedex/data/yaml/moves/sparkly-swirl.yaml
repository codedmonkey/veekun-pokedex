  flavor_text:
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        むせかえる　ような　かおりの　たつまきで
        あいてを　つつんで　こうげき。　みかたの
        じょうたい　いじょうを　かいふくする。
      ja: |-
        むせかえる　ような　香りの　竜巻で
        相手を　つつんで　攻撃。　味方の
        状態異常を　回復する。
      ko: |-
        숨 막힐 듯 진한 향기의 회오리로
        상대를 휘감아 공격한다.
        같은 편의 상태 이상을 회복한다.
      zh-Hant: |-
        用帶著嗆鼻香氣的龍捲風
        包圍對手，進行攻擊，
        並治癒我方寶可夢的異常狀態。
      zh-Hans: |-
        利用芬芳刺鼻的龙卷风吞噬对方。
        能治愈我方宝可梦的异常状态。
      en: |-
        The user attacks the target by wrapping it with
        a whirlwind of an overpowering scent. This also
        heals all status conditions of the user’s party.
      fr: |-
        Une attaque qui enserre l’adversaire dans un tourbillon
        de senteurs oppressantes. Guérit toutes les altérations
        de statut de l’équipe.
      de: |-
        Evoli greift an, indem es das Ziel in einen nahezu
        erstickend wohlriechenden Wirbelwind hüllt. Das Team
        des Anwenders wird von Statusproblemen geheilt.
      es: |-
        Ataca al rival envolviéndolo en un remolino de aroma
        asfixiante. Cura a los aliados de cualquier problema de
        estado.
      it: |-
        Chi la usa attacca il bersaglio avvolgendolo in
        un turbine di profumi soffocanti e cura
        i problemi di stato propri e degli alleati.
    sword-shield:
      ja-Hrkt: |-
        このわざは　つかえません
        おもいだすことが　できなくなりますが
        わざを　わすれることを　おすすめします
      ja: |-
        この技は　使えません
        思い出すことが　できなくなりますが
        技を　忘れることを　おすすめします
      ko: |-
        사용할 수 없는 기술입니다.
        다시 배우게 할 수 없지만
        기술을 잊게 하는 것을 권장합니다.
      zh-Hant: |-
        無法使用此招式。
        雖然忘記後將無法再想起來，
        但還是建議忘記此招式。
      zh-Hans: |-
        无法使用这个招式。
        虽然忘记之后就再也想不起来了，
        但还是建议忘记这个招式。
      en: |-
        This move can’t be used.
        It’s recommended that this move is forgotten.
        Once forgotten, this move can’t be remembered.
      fr: |-
        Cette capacité ne peut pas être utilisée.
        Il est recommandé de l’oublier, même s’il sera
        impossible de se la remémorer une fois oubliée.
      de: |-
        Diese Attacke kann nicht eingesetzt werden. Du solltest
        dein Pokémon sie vergessen lassen. Beachte aber,
        dass es sich danach nicht wieder an sie erinnern kann.
      es: |-
        Este movimiento no se puede usar, por lo que sería
        mejor olvidarlo, aunque eso implique que no se pueda
        recordar posteriormente.
      it: |-
        Questa mossa non può essere usata.
        È consigliabile farla dimenticare al Pokémon. Tuttavia,
        una volta dimenticata, non potrà più essere ricordata.
