    - reflectable
    - mirror
  flavor_text:
    x-y:
      ja-Hrkt: |-
        あいてに　かかっている
        すべての　のうりょくへんかを
        ひっくりかえして　ぎゃくにする。
      ja: |-
        相手に　かかっている
        すべての　能力変化を
        ひっくり返して　逆にする。
      ko: |-
        상대에게 걸려 있는
        모든 능력 변화를
        뒤집어서 반대로 만든다.
      en: |-
        All stat changes affecting the target
        turn topsy-turvy and become the
        opposite of what they were.
      fr: |-
        Inverse tous les changements de stats de
        la cible.
      de: 'Invertiert alle Statusveränderungen des Zieles.'
      es: |-
        Invierte por completo los cambios en las
        características del Pokémon objetivo.
      it: |-
        Inverte tutte le modifiche alle statistiche
        del Pokémon bersaglio.
