    black-white:
      en: |-
        The user attacks by blowing freezing cold
        air at opposing Pokémon. This attack
        reduces the targets’ Speed stat.
      fr: |-
        Un souffle de vent qui congèle tout
        sur son passage s’abat sur l’ennemi.
        Réduit aussi sa Vitesse.
