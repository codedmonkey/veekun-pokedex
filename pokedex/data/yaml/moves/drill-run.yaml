  flavor_text:
    black-white:
      en: |-
        The user crashes into its target while
        rotating its body like a drill.
        Critical hits land more easily.
      fr: |-
        Le lanceur tourne sur lui-même comme
        une perceuse et se jette sur l’ennemi.
        Taux de critiques élevé.
    black-2-white-2:
      en: |-
        The user crashes into its target while
        rotating its body like a drill.
        Critical hits land more easily.
    x-y:
      ja-Hrkt: |-
        ドリルのように　からだを　かいてん
        しながら　あいてに　たいあたりする。
        きゅうしょに　あたりやすい。
      ja: |-
        ドリルのように　体を　回転しながら
        相手に　体当たりする。
        急所に　当たりやすい。
      ko: |-
        드릴처럼 몸을 회전시켜서
        상대에게 몸통박치기한다.
        급소에 맞기 쉽다.
      en: |-
        The user crashes into its target while
        rotating its body like a drill.
        Critical hits land more easily.
      fr: |-
        Le lanceur tourne sur lui-même comme une
        perceuse et se jette sur l’ennemi.
        Taux de critiques élevé.
      de: |-
        Anwender rammt das Ziel, während er
        seinen Körper wie einen Bohrer dreht.
        Hohe Volltrefferquote.
      es: |-
        El usuario golpea usando su cuerpo como un
        taladro. Suele ser crítico.
      it: |-
        Chi la usa si scaglia sul bersaglio ruotando su se
        stesso come un trapano perforante. Probabile
        brutto colpo.
