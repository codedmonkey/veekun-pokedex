  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        Ｚパワーで　さいだい　でんりょくを
        みに　まとった　ピカチュウが
        ぜんりょくで　あいてに　とびかかる。
      ja: |-
        Ｚパワーで　最大　電力を
        身に　まとったピカチュウが
        全力で　相手に　飛び掛る。
      ko: |-
        Z파워로 최대 전력을
        몸에 두른 피카츄가
        전력으로 상대에게 덤벼든다.
      zh-Hant: |-
        透過Ｚ力量，
        全身覆蓋最大電力的
        皮卡丘全力猛撲對手。
      zh-Hans: |-
        通过Ｚ力量，
        皮卡丘全身覆盖最强电力，
        全力猛扑对手。
      en: |-
        The user, Pikachu, surrounds itself with the
        maximum amount of electricity using its Z-Power
        and pounces on its target with full force.
      fr: |-
        Pikachu utilise la Force Z pour concentrer toute
        son électricité avant de se jeter à toute vitesse
        sur l’adversaire.
      de: |-
        Pikachu umhüllt sich durch Z-Kraft mit gewaltiger
        elektrischer Energie und stürzt sich mit voller Kraft
        auf das Ziel.
      es: |-
        Pikachu emplea el Poder Z para acumular una gran
        cantidad de electricidad en su cuerpo y arremeter
        contra el objetivo.
      it: |-
        Grazie al Potere Z, Pikachu accumula un’enorme
        quantità di energia elettrica e si lancia contro
        il bersaglio a tutta forza.
