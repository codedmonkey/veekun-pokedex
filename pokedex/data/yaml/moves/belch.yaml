belch:
  accuracy: 90
  changelog: {  }
  contest_effect: ~
  contest_type: ~
  damage_class: special
  effect: move-effect-339
  effect_chance: ~
  flags:
    - protect
  flavor_text:
    x-y:
      ja-Hrkt: |-
        あいてに　むかって　ゲップを
        あびせて　ダメージを　あたえる。
        きのみを　たべないと　だせない。
      ja: |-
        相手に　向かって　ゲップを
        浴びせて　ダメージを　与える。
        きのみを　食べないと　だせない。
      ko: |-
        상대를 향해 트림을 하여
        데미지를 준다.
        나무열매를 먹지 않으면 쓸 수 없다.
      en: |-
        The user lets out a damaging belch
        at the target. The user must eat a held
        Berry to use this move.
      fr: |-
        Le lanceur se tourne vers l’ennemi et lui éructe
        dessus, infligeant des dégâts. Ne fonctionne
        que si le lanceur consomme la Baie qu’il tient.
      de: |-
        Der Anwender fügt dem Ziel Schaden zu,
        indem er es anrülpst. Diese Attacke gelingt
        nur nach dem Konsum einer getragenen Beere.
      es: |-
        El Pokémon causa daño a su oponente lanzándole
        un eructo. Para poder utilizar este movimiento
        tiene que llevar una baya y comérsela.
      it: |-
        Chi la usa attacca il bersaglio con un rutto potente.
        Per utilizzare questa mossa, il Pokémon deve
        mangiare la bacca che possiede.
