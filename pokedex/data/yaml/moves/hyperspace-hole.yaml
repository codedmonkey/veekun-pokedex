hyperspace-hole:
  accuracy: ~
  changelog: {  }
  contest_effect: ~
  contest_type: ~
  damage_class: special
  effect: move-effect-360
  effect_chance: ~
  flags:
    - mirror
    - authentic
  flavor_text:
    x-y:
      ja-Hrkt: |-
        いじげんホールで　とつぜん　あいての
        まよこに　あらわれ　こうげきする。
        まもるや　みきりも　むし　できる。
      ja: |-
        異次元ホールで　突然　相手の
        真横に　現れ　攻撃する。
        まもるや　みきりも　無視　できる。
      ko: |-
        다른차원홀로 갑자기 상대
        바로 옆에 나타나 공격한다.
        방어나 판별도 무시할 수 있다.
      en: |-
        Using a hyperspace hole, the user appears
        right next to the target and strikes. This
        also hits a target using Protect or Detect.
      fr: |-
        Crée une faille dimensionnelle pour attaquer
        soudainement l’ennemi de côté. Ignore même
        Abri ou Détection.
      de: |-
        Der Anwender positioniert sich mithilfe eines
        Dimensionslochs direkt neben dem Ziel und
        durchbricht selbst Schutzschild und Scanner.
      es: |-
        El usuario aparece junto a su objetivo usando un
        agujero interdimensional y le asesta un golpe que
        no puede esquivarse con Protección ni Detección.
      it: |-
        Chi la usa, sfrutta un passaggio interdimensionale
        per comparire a fianco del bersaglio e colpirlo,
        eludendo mosse come Protezione e Individua.
