        바로 옆에 나타나 공격한다.
        방어나 판별 등도 무시할 수 있다.
      zh-Hant: |-
        利用異次元洞，
        突然出現在對手的側面進行攻擊。
        可避開對手的守住和看穿等招式。
      zh-Hans: |-
        通过异次元洞，
        突然出现在对手的侧面进行攻击。
        还可以无视守住和看穿等招式。
      en: |-
        Using a hyperspace hole, the user appears right
        next to the target and strikes. This also hits a target
