  flavor_text:
    black-white:
      en: |-
        The user slams into the target with its
        heavy body. The more the user outweighs
        the target, the greater its damage.
      fr: |-
        Le lanceur se jette sur l’ennemi de tout
        son poids. S’il est plus lourd que l’ennemi,
        l’effet augmente en conséquence.
    black-2-white-2:
      en: |-
        The user slams into the target with its
        heavy body. The more the user outweighs
        the target, the greater its damage.
    x-y:
      ja-Hrkt: |-
        おもたい　からだで　あいてに　ぶつかって
        こうげきする。じぶんが　あいてより
        おもいほど　いりょくが　あがる。
      ja: |-
        重たい　体で　相手に　ぶつかって
        攻撃する。自分が　相手より
        重いほど　威力が　あがる。
      ko: |-
        무거운 몸으로 상대에게 부딪쳐
        공격한다. 자신이 상대보다
        무거울수록 위력이 올라간다.
      en: |-
        The user slams into the target with its
        heavy body. The more the user outweighs
        the target, the greater the move’s power.
      fr: |-
        Le lanceur se jette sur l’ennemi de tout son poids.
        S’il est plus lourd que l’ennemi, l’effet augmente
        en conséquence.
      de: |-
        Anwender rammt das Ziel mit massivem Körper.
        Je schwerer er im Vergleich zum Ziel ist,
        desto stärker die Attacke.
      es: |-
        El usuario golpea con todo su cuerpo. Cuanto
        mayor sea su peso comparado con el del objetivo,
        más daño causará.
      it: |-
        Chi la usa si lancia contro il bersaglio con tutto
        il proprio peso. Più è pesante rispetto ad esso,
        più danni causa.
