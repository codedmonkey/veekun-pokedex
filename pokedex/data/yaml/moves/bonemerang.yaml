    x-y:
      ja-Hrkt: |-
        てに　もった　ホネを　あいてに　なげつけ
        いきと　かえりで　２かい　れんぞくで
        ダメージを　あたえる。
      ja: |-
        手に　持った　ホネを　相手に　投げつけ
        行きと　帰りの　２回連続で
        ダメージを　与える。
      ko: |-
        손에 들고 있는 뼈를 상대에게 날려서
        날아갈 때와 돌아올 때 2회 연속
        데미지를 준다.
      en: |-
        The user throws the bone it holds. The
        bone loops to hit the target twice,
        coming and going.
      fr: |-
        Le lanceur projette son os comme un boomerang.
        Cette attaque frappe à l’aller et au retour.
      de: 'Ein Bumerang aus Knochen, der zweimal trifft.'
      es: |-
        Lanza un hueso a modo de bumerán que golpea
        dos veces.
      it: |-
        Chi la usa lancia l’osso che tiene. L’osso
        colpisce due volte e ritorna come un vero
        e proprio boomerang.
