  flavor_text:
    black-white:
      en: |-
        The user throws a stone or projectile to
        attack an opponent. A flying Pokémon will
        fall to the ground when hit.
      fr: |-
        Le lanceur jette toutes sortes
        de projectiles à un ennemi. Si ce
        dernier vole, il tombe au sol.
    black-2-white-2:
      en: |-
        The user throws a stone or projectile to
        attack an opponent. A flying Pokémon will
        fall to the ground when hit.
    x-y:
      ja-Hrkt: |-
        いしや　たまを　なげて　とんでいる
        あいてを　こうげきする。あいては
        うちおとされて　じめんに　おちる。
      ja: |-
        石や　弾を　投げて　飛んでいる
        相手を　攻撃する。相手は
        うち落とされて　地面に　落ちる。
      ko: |-
        돌이나 구슬을 던져서 날고 있는
        상대를 공격한다.
        맞은 상대는 땅에 떨어진다.
      en: |-
        The user throws a stone or similar projectile
        to attack an opponent. A flying Pokémon
        will fall to the ground when it’s hit.
      fr: |-
        Le lanceur jette toutes sortes de projectiles à
        un ennemi. Si ce dernier vole, il tombe au sol.
      de: |-
        Greift das Ziel mit Steinen und Wurfgeschossen an.
        Fliegende Ziele fallen dabei vom Himmel und
        landen auf dem Boden.
      es: |-
        El usuario ataca lanzando una piedra o un proyectil.
        Puede estrellar contra el suelo al objetivo si vuela.
      it: |-
        Chi la usa lancia una pietra o un proiettile.
        Può colpire anche un bersaglio in volo
        e farlo cadere.
