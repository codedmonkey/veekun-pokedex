        Eine Bombe als Geschenk. Kann auch KP
        des Zieles wiederherstellen.
      es: |-
        Quien lo usa ataca al objetivo dándole un regalo
        con bomba trampa. Sin embargo, a veces restaura
        sus PS.
      it: |-
        Chi la usa dà un regalo bomba al bersaglio.
