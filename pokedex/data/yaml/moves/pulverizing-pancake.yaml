      ja-Hrkt: |-
        このわざは　つかえません
        おもいだすことが　できなくなりますが
        わざを　わすれることを　おすすめします
      ja: |-
        この技は　使えません
        思い出すことが　できなくなりますが
        技を　忘れることを　おすすめします
      ko: |-
        사용할 수 없는 기술입니다.
        다시 배우게 할 수 없지만
        기술을 잊게 하는 것을 권장합니다.
      zh-Hant: |-
