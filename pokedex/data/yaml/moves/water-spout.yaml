      ja: |-
        潮を　吹きつけて　攻撃する。
        自分の　ＨＰが　少ないほど
        技の　威力は　さがる。
      ko: |-
        바닷물을 내뿜어 공격한다.
        자신의 HP가 적을수록
        기술의 위력이 떨어진다.
      en: |-
        The user spouts water to damage opposing
        Pokémon. The lower the user’s HP,
        the lower the move’s power.
      fr: |-
        Le lanceur attaque avec un jet d’eau.
        Moins il a de PV et moins l’attaque est puissante.
      de: |-
        Wasser-Attacke, die wirkungsvoller ist,
        wenn KP des Anwenders hoch sind.
      es: |-
        Chorro de agua. Cuantos menos PS tenga el
        usuario, menos dañino será.
      it: |-
        Lancia un getto d’acqua contro il nemico che ha
        davanti e quelli adiacenti. La potenza è
        proporzionale al numero di PS di chi la usa.
