    x-y:
      ja-Hrkt: |-
        だいちに　ねを　はり　まいターン
        じぶんの　ＨＰを　かいふく　する。
        ねを　はっているので　いれかえられない。
      ja: |-
        大地に　根を　張り
        毎ターン　自分の　ＨＰを　回復する。
        根を　張っているので　入れ替えられない。
      ko: |-
        대지에 뿌리를 박아
        매 턴마다 자신의 HP를 회복한다.
        뿌리 박고 있으므로 교체할 수 없다.
      en: |-
        The user lays roots that restore
        its HP on every turn. Because it is
        rooted, it can’t switch out.
      fr: |-
        Le lanceur plante ses racines et récupère des
        PV à chaque tour. Une fois enraciné, il ne peut
        plus fuir.
      de: |-
        Verwurzelung füllt jede Runde KP auf.
        Austausch ist unmöglich.
      es: |-
        Echa raíces para recuperar PS en cada turno, pero
        impide el relevo.
      it: |-
        Chi la usa mette delle radici che gli fanno
        recuperare PS a ogni turno. Non può
        essere sostituito.
