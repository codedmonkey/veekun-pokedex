      en: |-
        Gliding on the ground, the user attacks the target.
        This move always goes first on Grassy Terrain.
      fr: |-
        Le lanceur attaque l’ennemi en glissant sur le terrain.
        Frappe toujours en priorité si un Champ Herbu est actif.
      de: |-
        Der Anwender rutscht über den Boden und greift das
        Ziel an. Ermöglicht den Erstschlag, wenn ein Grasfeld
