  flavor_text:
    black-white:
      en: |-
        The user scatters a cloud of irritating
        powder to draw attention to itself.
        Opponents aim only at the user.
      fr: |-
        Le lanceur s’asperge d’une poudre
        irritante pour attirer l’attention. Il
        attire toutes les attaques ennemies.
    black-2-white-2:
      en: |-
        The user scatters a cloud of irritating
        powder to draw attention to itself.
        Opponents aim only at the user.
    x-y:
      ja-Hrkt: |-
        イライラさせる　こなを　じぶんに
        ふりかけて　ちゅういを　ひく。あいての
        こうげきを　すべて　じぶんに　むける。
      ja: |-
        イライラさせる　粉を　自分に
        ふりかけて　注意を　ひく。相手の
        攻撃を　すべて　自分に　むける。
      ko: |-
        안절부절못하게 하는 가루를
        자신에게 뿌려서 주의를 끈다.
        상대의 공격은 모두 자신에게 향한다.
      en: |-
        The user scatters a cloud of irritating
        powder to draw attention to itself.
        Opponents aim only at the user.
      fr: |-
        Le lanceur s’asperge d’une poudre irritante pour
        attirer l’attention. Il attire toutes les attaques
        ennemies.
      de: |-
        Anwender zieht gegnerische Aufmerksamkeit und
        Angriffe auf sich, indem er ein Wut erzeugendes
        Pulver über sich streut.
      es: |-
        Usa un polvo que irrita y centra en el usuario la
        atención y los ataques de los rivales.
      it: |-
        Chi la usa attira l’attenzione dei nemici
        cospargendosi di una polvere irritante e diventando
        bersaglio di tutti gli attacchi.
