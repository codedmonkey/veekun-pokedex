        あしを　つよく　けり　あいてを
        ころばせて　こうげきする。あいてが
        おもいほど　いりょくが　あがる。
      ja: |-
        足を　強く　けり
        相手を　転ばせて　攻撃する。
        相手が　重いほど　威力が　あがる。
      ko: |-
        발을 강하게 걸고
        상대를 넘어뜨려 공격한다.
        상대가 무거울수록 위력이 올라간다.
      en: |-
        A powerful low kick that makes the target
        fall over. The heavier the target,
        the greater the move’s power.
      fr: |-
        Un puissant coup de pied bas qui fauche l’ennemi.
        Il est plus efficace contre les ennemis lourds.
      de: |-
        Ein Tritt, der das Ziel umwirft. Je schwerer das Ziel
        ist, desto mehr Schaden fügt ihm die Attacke zu.
      es: |-
        Patada baja. Cuanto más pesa el objetivo, más
        daño causa.
      it: |-
        Un calcio basso e potente che fa cadere il bersaglio.
        Danneggia maggiormente i Pokémon più pesanti.
