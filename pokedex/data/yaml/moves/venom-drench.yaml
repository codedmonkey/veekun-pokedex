venom-drench:
  accuracy: 100
  changelog: {  }
  contest_effect: ~
  contest_type: ~
  damage_class: status
  effect: move-effect-364
  effect_chance: 100
  flags:
    - protect
    - reflectable
    - mirror
  flavor_text:
    x-y:
      ja-Hrkt: |-
        とくしゅな　どくえきを　あびせかける。
        どく　じょうたいの　あいては
        こうげき　とくこう　すばやさが　さがる。
      ja: |-
        特殊な　毒液を　浴びせかける。
        毒状態の　相手は
        攻撃　特攻　素早さが　さがる。
      ko: |-
        특수한 독액을 끼얹는다.
        독 상태인 상대는
        공격, 특수공격, 스피드가 떨어진다.
      en: |-
        Opposing Pokémon are drenched in an odd
        poisonous liquid. This lowers the Attack,
        Sp. Atk, and Speed stats of a poisoned target.
      fr: |-
        Sécrète un liquide empoisonné.
        Diminue l’Attaque, l’Attaque Spéciale et la Vitesse
        de l’ennemi empoisonné.
      de: |-
        Anwender bespritzt das Ziel mit einer speziellen
        Giftflüssigkeit. Senkt den Angriff, den Spezial-
        Angriff und die Initiative von vergifteten Zielen.
      es: |-
        Impregna a su objetivo con un líquido venenoso
        que disminuye el Ataque, el At. Esp. y la Velocidad.
        Solo afecta a Pokémon ya envenenados.
      it: |-
        Emette un liquido particolare che riduce
        l’Attacco, l’Attacco Speciale e la Velocità
        dei nemici avvelenati intorno a chi la usa.
