  flavor_text:
    x-y:
      ja-Hrkt: |
        ふしぎな　アロマの　かおりによって
        みかたの　とくぼうを　あげる。
      ja: |
        不思議な　アロマの　香りによって
        味方の　特防を　あげる。
      ko: |
        신비한 아로마 향으로
        같은 편의 특수방어를 올린다.
      en: |-
        The user raises the Sp. Def stat of an ally
        Pokémon by using a mysterious aroma.
      fr: |-
        Grâce à un parfum mystérieux, augmente la
        Défense Spéciale d’un allié.
      de: |-
        Der Anwender erhöht mithilfe eines mysteriösen
        Duftes die Spezial-Verteidigung eines Mitstreiters.
      es: |-
        Consigue aumentar la Defensa Especial de
        un Pokémon de su equipo con una fragancia
        misteriosa.
      it: |-
        Aumenta la Difesa Speciale di un alleato
        tramite un misterioso aroma.
