    heartgold-soulsilver:
      en: |-
        The user slaps down
        the foe’s held item,
        preventing the item
        from being used
        during the battle.
    black-white:
      en: |-
        The user slaps down the target’s
        held item, preventing that item
        from being used in the battle.
      fr: |-
        Le lanceur fait tomber l’objet tenu
        par l’ennemi pour le rendre inutilisable
        durant le combat.
    black-2-white-2:
      en: |-
        The user slaps down the target’s
        held item, preventing that item
        from being used in the battle.
    x-y:
      ja-Hrkt: |-
        あいての　もちものを　はたき　おとして
        せんとうが　おわるまで　つかえなくする。
        ものをもつ　あいてには　ダメージがます。
      ja: |-
        相手の　持ち物を　はたき　落として
        戦闘が　終わるまで　使えなくする。
        物を持つ　相手には　ダメージが増す。
      ko: |-
        상대의 지닌 물건을 탁 쳐서 떨어뜨려
        배틀이 끝날 때까지 사용할 수 없게 한다.
        물건을 가진 상대에게는 데미지를 더 준다.
      en: |-
        The user slaps down the target’s held item, and
        that item can’t be used in that battle. The move
        does more damage if the target has a held item.
      fr: |-
        Fait plus de dégâts aux cibles qui tiennent un
        objet. De plus, fait tomber cet objet et empêche
        la cible de l’utiliser jusqu’à la fin du combat.
      de: |-
        Schlägt das Item des Zieles weg und vereitelt so
        dessen Gebrauch während des Kampfes. Mehr
        Schaden gegen Ziele, die ein Item bei sich tragen.
      es: |-
        Impide al objetivo usar el objeto que lleva durante
        el combate. La potencia del movimiento se
        multiplica si el objetivo lleva un objeto.
      it: |-
        Attacco che blocca lo strumento del bersaglio,
        impedendone l’uso nella lotta. La sua potenza
        aumenta se il Pokémon colpito ha uno strumento.
