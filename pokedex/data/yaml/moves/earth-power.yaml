    x-y:
      ja-Hrkt: |-
        あいての　あしもとへ　だいちの　ちからを
        ほうしゅつする。あいての　とくぼうを
        さげることが　ある。
      ja: |-
        相手の　足下へ　大地の力を
        放出する。相手の　特防を
        さげることが　ある。
      ko: |-
        상대의 발밑에 대지의 힘을
        방출한다. 상대의 특수방어를
        떨어뜨릴 때가 있다.
      en: |-
        The user makes the ground under
        the target erupt with power.
        This may also lower the target’s Sp. Def.
      fr: |-
        Des éruptions volcaniques ont lieu sous l’ennemi.
        Peut aussi baisser sa Défense Spéciale.
      de: |-
        Der Boden unter dem Ziel erzittert durch die Kraft
        der Erde. Senkt eventuell Spezial-Verteidigung.
      es: |-
        La tierra a los pies del objetivo erupciona
        violentamente. Puede disminuir la Defensa Especial
        del objetivo.
      it: |-
        Dal terreno sotto il bersaglio si sprigiona una forza
        devastante. Può anche ridurne la Difesa Speciale.
