        ４ー５ターンの　あいだ
        あいてに　まきついて　こうげきする。
      ja: |-
        長い　体や　つるなどを　つかって
        ４ー５ターンの　あいだ
        相手に　まきついて　攻撃する。
      ko: |-
        긴 몸이나 덩굴 등을 사용해
        4-5턴 동안
        상대를 휘감아 공격한다.
      en: |-
