misty-terrain:
  accuracy: ~
  changelog: {  }
  contest_effect: ~
  contest_type: ~
  damage_class: status
  effect: move-effect-353
  effect_chance: ~
  flags:
    - non-sky-battle
  flavor_text:
    x-y:
      ja-Hrkt: |-
        ５ターンの　あいだ　あしもとを
        ミストフィールドにする。　じめんにいると
        じょうたいいじょうに　ならない。
      ja: |-
        ５ターンの　あいだ　足元を
        ミストフィールドにする。地面にいると
        状態異常に　ならない。
      ko: |-
        5턴 동안 발밑을
        미스트필드로 만든다. 땅에 있으면
        상태 이상이 되지 않는다.
      en: |-
        The user covers the ground under everyone’s feet
        with mist for five turns. This protects Pokémon
        on the ground from status conditions.
      fr: |-
        Pendant cinq tours, le terrain aux pieds du lanceur
        se couvre de brume. Les Pokémon au sol ne
        peuvent pas subir d’altération de statut.
      de: |-
        Verwandelt den Untergrund fünf Runden lang
        in ein Nebelfeld und schützt alle Pokémon,
        die den Boden berühren, vor Statusproblemen.
      es: |-
        Cubre de niebla el terreno de combate durante
        cinco turnos. Los Pokémon que estén en el suelo
        no se ven afectados por cambios de estado.
      it: |-
        Per cinque turni trasforma il terreno di lotta
        in un campo nebbioso, impedendo ai Pokémon
        a terra di essere colpiti da problemi di stato.
    omega-ruby-alpha-sapphire:
      ja-Hrkt: |-
