        미스트필드로 만든다. 땅에 있으면
        상태 이상이 되지 않는다.
      en: |-
        The user covers the ground under everyone’s feet
        with mist for five turns. This protects Pokémon
        on the ground from status conditions.
      fr: |-
        Pendant cinq tours, le terrain aux pieds du lanceur
        se couvre de brume. Les Pokémon au sol ne
        peuvent pas subir d’altération de statut.
      de: |-
        Verwandelt den Untergrund fünf Runden lang
        in ein Nebelfeld und schützt alle Pokémon,
        die den Boden berühren, vor Statusproblemen.
      es: |-
        Cubre de niebla el terreno de combate durante
        cinco turnos. Los Pokémon que estén en el suelo 
        no se ven afectados por cambios de estado.
      it: |-
        Per cinque turni trasforma il terreno di lotta
        in un campo nebbioso, impedendo ai Pokémon
        a terra di essere colpiti da problemi di stato.
    sun-moon:
      ja-Hrkt: |-
        ５ターンのあいだ　じめんにいると
        じょうたいいじょうに　ならず　ドラゴン
        わざの　ダメージも　はんぶんになる。
      ja: |-
        ５ターンの　間　地面にいると
        状態異常に　ならず　ドラゴン技の
        ダメージも　半分になる。
      ko: |-
        5턴 동안 땅에 있으면
        상태 이상이 되지 않고
        드래곤타입 기술의 데미지도 절반이 된다.
      zh-Hant: |-
        在５回合內，
        地面上的寶可夢不會陷入異常狀態。
        龍屬性招式的傷害也會減半。
      zh-Hans: |-
        在５回合内，
        地面上的宝可梦不会陷入异常状态。
        龙属性招式的伤害也会减半。
      en: |-
        This protects Pokémon on the ground from status
        conditions and halves damage from Dragon-type
        moves for five turns.
      fr: |-
        Pendant cinq tours, les Pokémon au sol ne peuvent
        pas subir d’altération de statut et la puissance
        des capacités de type Dragon est divisée par deux.
      de: |-
        Schützt fünf Runden lang alle Pokémon, die den
        Boden berühren, vor Statusproblemen. Der erlittene
        Schaden durch Drachen-Attacken wird halbiert.
      es: |-
        Durante cinco turnos, los Pokémon que están en el
        suelo no sufren cambios de estado y se reduce a la
        mitad el daño de los movimientos de tipo Dragón.
      it: |-
        Per cinque turni il terreno entra nello stato di Campo
        Nebbioso: i Pokémon a terra sono immuni ai problemi
        di stato e la potenza delle mosse Drago è dimezzata.
