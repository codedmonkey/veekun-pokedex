  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        Ｚパワーで　つくった　エネルギーの　たまを
        ぜんりょくで　あいてに　ぶつける。
        もとになった　わざで　いりょくが　かわる。
      ja: |-
        Ｚパワーで　作った　エネルギーの　弾を
        全力で　相手に　ぶつける。
        元になった　技で　威力が　変わる。
      ko: |-
        Z파워로 만든 에너지 구슬을
        전력으로 상대에게 부딪친다.
        원래 기술에 따라 위력이 변한다.
      zh-Hant: |-
        將透過Ｚ力量製造的
        能量彈全力撞向對手。
        威力會隨原本的招式而改變。
      zh-Hans: |-
        通过Ｚ力量制造出能量弹，
        全力撞向对手。
        威力会根据原来的招式而改变。
      en: |-
        The user rams an energy orb created by its Z-Power
        into the target with full force. The power varies,
        depending on the original move.
      fr: |-
        Le Pokémon utilise la Force Z pour créer une boule
        d’énergie qu’il projette sur l’adversaire. La puissance
        varie selon celle de la capacité originale.
      de: |-
        Aus Z-Kraft hergestellte Energiebälle prallen mit
        voller Wucht auf das Ziel. Die Stärke variiert je nach
        zugrunde liegender Attacke.
      es: |-
        Emplea el Poder Z para lanzar una sarta de golpes
        demoledores contra el objetivo. Su potencia depende
        de la del movimiento original.
      it: |-
        Chi la usa scaglia sul bersaglio una scarica di colpi
        carichi di Potere Z. La potenza varia a seconda
        della mossa su cui si basa.
