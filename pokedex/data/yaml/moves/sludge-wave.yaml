  flavor_text:
    black-white:
      en: |-
        It swamps the area around the user with a
        giant sludge wave.
        It may also poison those hit.
      fr: |-
        Une vague de détritus attaque tous
        les Pokémon autour du lanceur.
        Peut aussi empoisonner.
    black-2-white-2:
      en: |-
        It swamps the area around the user with a
        giant sludge wave.
        It may also poison those hit.
    x-y:
      ja-Hrkt: |-
        ヘドロの　なみで　じぶんの
        まわりに　いるものを　こうげきする。
        どく　じょうたいに　することが　ある。
      ja: |-
        ヘドロの　波で　自分の
        周りに　いるものを　攻撃する。
        毒状態に　することが　ある。
      ko: |-
        오물 파도로 자신의
        주위에 있는 포켓몬을 공격한다.
        독 상태로 만들 때가 있다.
      en: |-
        The user strikes everything around it
        by swamping the area with a giant sludge wave.
        This may also poison those hit.
      fr: |-
        Une vague de détritus attaque tous les Pokémon
        autour du lanceur. Peut aussi empoisonner.
      de: |-
        Greift Pokémon in der Nähe des Anwenders mit
        einer Schlammwelle an. Diese werden eventuell
        vergiftet.
      es: |-
        Una onda tóxica que daña a los Pokémon de
        alrededor. Puede envenenar.
      it: |-
        Lancia un’onda di fango che attacca tutti
        i Pokémon nelle vicinanze. Può anche avvelenarli.
