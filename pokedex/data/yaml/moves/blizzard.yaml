      ja: |-
        激しい　吹雪を
        相手に　吹きつけて　攻撃する。
        こおり状態に　することが　ある。
      ko: |-
        세찬 눈보라를
        상대에게 내뿜어 공격한다.
        얼음 상태로 만들 때가 있다.
      en: |-
