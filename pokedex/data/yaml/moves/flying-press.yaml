  flavor_text:
    x-y:
      ja-Hrkt: |-
        くうちゅうから　あいてに　ダイブする。
        このわざは　かくとうタイプと　どうじに
        ひこうタイプでも　ある。
      ja: |-
        空中から　相手に　ダイブする。
        この技は　かくとうタイプと　同時に
        ひこうタイプでも　ある。
      ko: |-
        공중에서 상대에게 다이브한다.
        이 기술은 격투타입임과 동시에
        비행타입이기도 하다.
      en: |-
        The user dives down onto the target
        from the sky. This move is Fighting
        and Flying type simultaneously.
      fr: |-
        Une attaque en piqué depuis le ciel, à la fois de
        type Combat et de type Vol.
      de: |-
        Der Anwender stürzt sich aus der Luft auf
        das Ziel. Die Attacke gehört sowohl dem Typ
        Kampf als auch dem Typ Flug an.
      es: |-
        El Pokémon que lo usa se lanza sobre su
        oponente. Este movimiento es de tipo Lucha y
        tipo Volador al mismo tiempo.
      it: |-
        Chi la usa si tuffa sul bersaglio dall’alto. È una
        mossa di tipo Lotta e Volante allo stesso tempo.
