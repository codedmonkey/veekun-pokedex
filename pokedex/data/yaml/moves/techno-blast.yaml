        こうだんを　あいてに
        ほうしゅつする。じぶんの　もつ
        カセットに　より　タイプが　かわる。
      ja: |-
        光弾を　相手に　放出する。
        自分の　持つ
        カセットにより　タイプが　変わる。
      ko: |-
        광탄을 상대에게 방출한다.
        자신이 지니고 있는
        카세트에 의해 타입이 바뀐다.
      en: |-
