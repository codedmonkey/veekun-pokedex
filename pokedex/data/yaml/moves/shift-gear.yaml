  flavor_text:
    black-white:
      en: |-
        The user rotates its gears, raising its
        Attack and sharply raising its Speed.
      fr: |-
        Le lanceur fait tourner ses engrenages.
        Ceci augmente son Attaque et augmente
        fortement sa Vitesse.
    black-2-white-2:
      en: |-
        The user rotates its gears, raising its
        Attack and sharply raising its Speed.
    x-y:
      ja-Hrkt: |-
        はぐるまを　まわして
        じぶんの　こうげきを　あげる　だけでなく
        すばやさも　ぐーんと　あげる。
      ja: |-
        歯車を　回して
        自分の　攻撃を　あげる　だけでなく
        素早さも　ぐーんと　あげる。
      ko: |-
        톱니바퀴를 돌려서 자신의
        공격을 올리는 것뿐만 아니라
        스피드도 크게 올린다.
      en: |-
        The user rotates its gears, raising its
        Attack and sharply raising its Speed.
      fr: |-
        Le lanceur fait tourner ses engrenages.
        Ceci augmente son Attaque et augmente fortement
        sa Vitesse.
      de: |-
        Durch Drehen der Zahnräder erhöht sich nicht nur
        der Angriffs-Wert, sondern auch die Initiative
        des Anwenders stark.
      es: |-
        Al hacer girar los engranajes, el usuario
        mejora su Ataque y aumenta su Velocidad
        espectacularmente.
      it: |-
        Facendo ruotare gli ingranaggi, chi la usa aumenta
        non solo il proprio Attacco, ma anche di molto
        la propria Velocità.
