    x-y:
      ja-Hrkt: |-
        じぶんの　ＰＰが　なくなると
        あがいて　あいてを　こうげきする。
        じぶんも　すこし　ダメージを　うける。
      ja: |-
        自分の　ＰＰが　なくなると
        あがいて　相手を　攻撃する。
        自分も　少し　ダメージを　受ける。
      ko: |-
        자신의 PP가 떨어지면
        발버둥 쳐 상대를 공격한다.
        자신도 조금 데미지를 입는다.
      en: |-
        An attack that is used in desperation
        only if the user has no PP. This also
        damages the user a little.
      fr: |-
        Une attaque désespérée, utilisée quand le lanceur
        n’a plus de PP. Le blesse aussi légèrement.
      de: |-
        Angriff nur bei verbrauchten AP.
        Anwender verletzt sich selbst leicht.
      es: |-
        Solo se usa como último recurso al acabarse los
        PP. Hiere un poco al agresor.
      it: |-
        Mossa da usare solo in caso estremo, quando
        non si hanno più PP. Danneggia anche chi la usa.
