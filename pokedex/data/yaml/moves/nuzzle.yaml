  flavor_text:
    x-y:
      ja-Hrkt: |-
        でんきを　おびた　ほっぺを
        すりつけて　こうげき。
        あいてを　まひ　じょうたいに　する。
      ja: |-
        電気を　帯びた　ほっぺを
        すりつけて　攻撃。
        相手を　まひ状態に　する。
      ko: |-
        전기가 흐르는 볼을
        비벼서 공격한다.
        상대를 마비 상태로 만든다.
      en: |-
        The user attacks by nuzzling its electrified
        cheeks against the target. This also leaves
        the target with paralysis.
      fr: |-
        Le lanceur attaque en frottant ses bajoues
        chargées d’électricité. Paralyse l’ennemi.
      de: |-
        Der Anwender lädt seine Wangen elektrisch auf
        und greift an, indem er sich damit am Ziel reibt.
        Das Ziel wird paralysiert.
      es: |-
        Quien lo usa frota sus mofletes cargados de
        electricidad contra el Pokémon objetivo y
        consigue paralizarlo.
      it: |-
        Chi la usa strofina le guance elettrizzate contro
        il bersaglio, paralizzandolo.
