        The user pecks the
        foe. If the foe is
        holding a Berry, the
        user plucks it and
        gains its effect.
    black-white:
      en: |-
        The user pecks the target. If the target
        is holding a Berry, the user eats it and
        gains its effect.
      fr: |-
        Le lanceur picore la cible. Si cette
        dernière tient une Baie, le lanceur
        la mange et profite de ses effets.
    black-2-white-2:
      en: |-
        The user pecks the target. If the target
        is holding a Berry, the user eats it and
        gains its effect.
    x-y:
      ja-Hrkt: |-
        くちばしで　こうげき。
        あいてが　きのみを　もっている　とき
        たべて　きのみの　こうかを　うけられる。
      ja: |-
        くちばしで　攻撃。
        相手が　きのみを　持っているとき
        食べて　きのみの　効果を　受けられる。
      ko: |-
        부리로 공격한다.
        상대가 나무열매를 지니고 있을 때
        먹어서 나무열매의 효과를 받을 수 있다.
      en: |-
        The user pecks the target. If the target
        is holding a Berry, the user eats it and
        gains its effect.
      fr: |-
        Le lanceur picore la cible.
        Si cette dernière tient une Baie, le lanceur la mange
        et profite de ses effets.
      de: |-
        Anwender pickt das Ziel, nimmt die Beere,
        falls das Ziel eine trägt, und erhält ihren Effekt.
      es: |-
        Picotea al objetivo. Si este sostiene una baya, la
        picotea también y obtiene sus efectos.
      it: |-
        Chi la usa becca il bersaglio. Inoltre, se questi ha
        una bacca, gliela ruba e ne sfrutta gli effetti.
