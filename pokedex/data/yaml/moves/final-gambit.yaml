final-gambit:
  accuracy: 100
  changelog: {  }
  contest_effect: ~
  contest_type: ~
  damage_class: special
  effect: move-effect-321
  effect_chance: ~
  flags:
    - protect
  flavor_text:
    black-white:
      en: |-
        The user risks everything to attack its
        target. The user faints but does damage
        equal to the user’s HP.
      fr: |-
        Une attaque très risquée. Le lanceur perd
        tous ses PV restants et inflige autant de
        dégâts à l’ennemi.
    black-2-white-2:
      en: |-
        The user risks everything to attack its
        target. The user faints but does damage
        equal to the user’s HP.
    x-y:
      ja-Hrkt: |-
        いのちがけで　あいてを　こうげきする。
        じぶんは　ひんしに　なるが　あいてに
        ＨＰぶんの　ダメージを　あたえる。
      ja: |-
        命懸けで　相手を　攻撃する。
        自分は　ひんしに　なるが　相手に
        ＨＰ分の　ダメージを　与える。
      ko: |-
        목숨을 걸고 상대를 공격한다.
        자신은 기절하게 되지만 상대에게
        HP만큼의 데미지를 준다.
      en: |-
        The user risks everything to attack its
        target. The user faints but does damage
        equal to its HP.
      fr: |-
        Une attaque très risquée.
        Le lanceur perd tous ses PV restants et inflige
        autant de dégâts à l’ennemi.
      de: |-
        Ein Angriff, der dem Ziel Schaden in Höhe
        der aktuellen KP des Anwenders zufügt.
        Letzterer wird dadurch selbst besiegt.
      es: |-
        El usuario se sacrifica causándole un daño al
        objetivo equivalente a sus propios PS perdidos.
      it: |-
        Chi la usa attacca con tutta la potenza di cui
        dispone e va KO, ma infligge al bersaglio un danno
        pari ai PS che ha perso.
