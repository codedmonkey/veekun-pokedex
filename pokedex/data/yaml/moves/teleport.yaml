    sun-moon:
      ja-Hrkt: |-
        やせい　ポケモン　との
        せんとうを　やめて　にげる。
      ja: |-
        野生　ポケモンとの
        戦闘を　やめて　逃げる。
      ko: |-
        야생 포켓몬과 배틀을
        그만두고 도망간다.
      zh-Hant: 停止和野生寶可夢戰鬥並逃走。
      zh-Hans: 停止和野生宝可梦战斗并逃走。
      en: 'Use it to flee from any wild Pokémon.'
      fr: |-
        Permet de fuir une rencontre avec un Pokémon
        sauvage.
      de: 'Ermöglicht die sofortige Flucht vor wilden Pokémon.'
      es: |-
        Permite huir al instante de combates contra
        Pokémon salvajes.
      it: 'Fa fuggire dai Pokémon selvatici.'
    ultra-sun-ultra-moon:
      ja-Hrkt: |-
        やせい　ポケモン　との
        せんとうを　やめて　にげる。
      ja: |-
        野生　ポケモンとの
        戦闘を　やめて　逃げる。
      ko: |-
        야생 포켓몬과 배틀을
        그만두고 도망간다.
      zh-Hant: 停止和野生寶可夢戰鬥並逃走。
      zh-Hans: 停止和野生宝可梦战斗并逃走。
      en: 'Use it to flee from any wild Pokémon.'
      fr: |-
        Permet de fuir une rencontre avec un Pokémon
        sauvage.
      de: 'Ermöglicht die sofortige Flucht vor wilden Pokémon.'
      es: |-
        Permite huir al instante de combates contra
        Pokémon salvajes.
      it: 'Fa fuggire dai Pokémon selvatici.'
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        ねんりきを　つかい　いっしゅんで
        ひかえの　ポケモンと　いれかわる。
      ja: |-
        念力を　使い　一瞬で
        控えの　ポケモンと　入れかわる。
      ko: |-
        염동력을 사용해서 순식간에
        교대 포켓몬과 교체한다.
      zh-Hant: |-
        使用念力，
        瞬間與後備寶可夢替換。
      zh-Hans: |-
        使用念力，
        瞬间与后备宝可梦进行替换。
      en: |-
        The user switches places with a different Pokémon
        instantly, using telekinetic power.
      fr: |-
        Le lanceur utilise sa force psychique pour se téléporter
        et échanger sa place avec un autre Pokémon de l’équipe.
      de: |-
        Anwender nutzt telekinetische Energie, um sich sofort
        gegen ein anderes Pokémon auszutauschen.
      es: |-
        El usuario emplea sus poderes telequinéticos para
        cambiar al instante el puesto con otro miembro del
        equipo.
      it: |-
        Chi la usa sfrutta la psicocinesi per farsi sostituire
        da un Pokémon della squadra.
    sword-shield:
      ja-Hrkt: |-
        ひかえの　ポケモンが　いるときに
        つかうと　いれかわる。
        やせいの　ポケモンは　にげてしまう。
      ja: |-
        ひかえの　ポケモンが　いるときに
        使うと　入れ替わる。
        野生の　ポケモンは　逃げてしまう。
      ko: |-
        교대할 포켓몬이 있을 때
        사용하면 교체한다.
        야생 포켓몬은 도망가 버린다.
      zh-Hant: |-
        在有後備寶可夢時使用，
        可進行替換。
        野生寶可夢則會逃走。
      zh-Hans: |-
        当有后备宝可梦在时，
        如果使用就可以进行替换。
        野生的宝可梦会逃走。
      en: |-
        The user switches places with a party Pokémon in
        waiting, if any. If a wild Pokémon uses this move,
        it flees.
      fr: |-
        Permet de changer de place avec un autre Pokémon
        de l’équipe s’il y en a. Quand cette capacité est utilisée
        par un Pokémon sauvage, celui-ci fuit le combat.
      de: |-
        Der Anwender tauscht den Platz mit einem anderen
        Team-Mitglied, sofern vorhanden. Setzen wilde
        Pokémon die Attacke ein, ergreifen diese die Flucht.
      es: |-
        Permite al usuario cambiarse por otro Pokémon del
        equipo, si es posible. Si un Pokémon salvaje usa este
        movimiento, huye del combate.
      it: |-
        Chi la usa viene sostituito se ci sono altri Pokémon in
        squadra. Se un Pokémon selvatico usa questa mossa,
        fugge dalla lotta.
