    x-y:
      ja-Hrkt: |-
        やせい　ポケモンとの　せんとうを
        やめる。さいごに　はいった
        ポケセンの　ある　まちにも　いける。
      ja: |-
        野生ポケモンとの　戦闘を　やめる。
        最後に　はいった
        ポケセンの　ある　街にも　行ける。
      ko: |-
        야생 포켓몬과 배틀을 그만둔다.
        마지막에 들어갔던
        포켓몬센터가 있는 도시에도 갈 수 있다.
      en: |-
        Use it to flee from any wild Pokémon.
        It can also warp to the last Pokémon
        Center visited.
      fr: |-
        Permet de fuir un Pokémon sauvage.
        Permet aussi de revenir au dernier Centre
        Pokémon visité.
      de: |-
        Ermöglicht die sofortige Flucht vor wilden
        Pokémon. Kann den Anwender außerdem zum
        zuletzt besuchten Pokémon-Center teleportieren.
      es: |-
        Permite huir al instante de combates contra
        Pokémon salvajes o viajar al último Centro
        Pokémon visitado.
      it: |-
        Fa fuggire dai Pokémon selvatici. Fuori dalla lotta
        porta all’ultimo Centro Pokémon visitato.
    omega-ruby-alpha-sapphire:
      ja-Hrkt: |-
