      ja: |-
        あくタイプに　効果がない　技や
        回避率の　高い　相手に
        攻撃が　当たるように　なる。
      ko: |-
        악타입에 효과가 없는 기술이나
        회피율이 높은 상대라 할지라도
        공격이 맞게 된다.
      en: |-
        Enables a Dark-type target to be hit by
        Psychic-type attacks. This also enables
        an evasive target to be hit.
      fr: |-
        Permet de toucher un Pokémon Ténèbres avec
        les capacités de type Psy ou de toucher un ennemi
        insaisissable.
      de: |-
        Erlaubt es, Unlicht-Pokémon mit Psycho-Attacken
        anzugreifen. Ignoriert den Fluchtwert des Zieles.
      es: |-
        Permite atacar con cualquier movimiento a
        objetivos de tipo Siniestro y golpear a Pokémon
        evasivos.
      it: |-
        Chi la usa rende i Pokémon di tipo Buio vulnerabili
        a qualsiasi tipo di mossa e può, inoltre, colpire
        i nemici sfuggenti.
