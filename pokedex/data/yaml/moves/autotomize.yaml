  flavor_text:
    black-white:
      en: |-
        The user sheds part of its body
        to make itself lighter and sharply
        raise its Speed stat.
      fr: |-
        Le lanceur se débarrasse des parties
        inutiles de son corps. Son poids diminue
        et sa Vitesse augmente fortement.
    black-2-white-2:
      en: |-
        The user sheds part of its body
        to make itself lighter and sharply
        raise its Speed stat.
    x-y:
      ja-Hrkt: |-
        からだの　ムダな　ぶぶんを　けずる。
        じぶんの　すばやさを　ぐーんと　あげて
        たいじゅうも　かるく　なる。
      ja: |-
        体の　ムダな　部分を　削る。
        自分の　素早さを　ぐーんと　あげて
        体重も　軽くなる。
      ko: |-
        몸의 쓸모없는 부분을 깎는다.
        자신의 스피드를 크게 올리고
        체중도 가벼워진다.
      en: |-
        The user sheds part of its body
        to make itself lighter and sharply
        raise its Speed stat.
      fr: |-
        Le lanceur se débarrasse des parties inutiles de
        son corps. Son poids diminue et sa Vitesse
        augmente fortement.
      de: |-
        Anwender trennt sich von überflüssigen
        Körperteilen und steigert seine Initiative
        stark. Sein Gewicht nimmt deutlich ab.
      es: |-
        El usuario se sacude para hacerse más ligero y
        aumentar mucho su Velocidad.
      it: |-
        Chi la usa si libera di tutti i pesi in eccesso,
        alleggerendosi e aumentando di molto la propria
        Velocità.
