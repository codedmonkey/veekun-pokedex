    ruby-sapphire:
      en: |-
        A chilling attack that
        causes fainting if it hits.
    emerald:
      en: |-
        A chilling attack that
        causes fainting if it hits.
    firered-leafgreen:
      en: |-
        The foe is attacked
        with ultimate cold
        that causes fainting
        if it hits.
    diamond-pearl:
      en: |-
        The foe is attacked
        with a blast of
        absolute-zero cold.
        The foe instantly
        faints if it hits.
    platinum:
      en: |-
        The foe is attacked
        with a blast of
        absolute-zero cold.
        The foe instantly
        faints if it hits.
    heartgold-soulsilver:
      en: |-
        The foe is attacked
        with a blast of
        absolute-zero cold.
        The foe instantly
        faints if it hits.
    black-white:
      en: |-
        The target is attacked with a blast of
        absolute-zero cold.
        The target instantly faints if it hits.
      fr: |-
        Une vague de froid glacial frappe
        l’ennemi. S’il est touché, il est mis
        K.O. sur le coup.
    black-2-white-2:
      en: |-
        The target is attacked with a blast of
        absolute-zero cold.
        The target instantly faints if it hits.
    x-y:
      ja-Hrkt: |-
        ぜったいれいどの　つめたさで
        あいてを　こうげきする。
        あたれば　いちげきで　ひんしに　する。
      ja: |-
        絶対零度の　冷たさで
        相手を　攻撃する。
        当たれば　一撃で　ひんしに　する。
      ko: |-
        절대영도의 추위로
        상대를 공격한다.
        맞으면 일격에 기절한다.
      en: |-
        The target is attacked with a blast of
        absolute-zero cold. The target faints
        instantly if this attack hits.
      fr: |-
        Une vague de froid glacial frappe l’ennemi.
        S’il est touché, il est mis K.O. sur le coup.
      de: 'Angriff mit Kälte, die das Ziel bei Erfolg besiegt.'
      es: |-
        Ataque de frío polar que debilita al objetivo si le
        alcanza.
      it: |-
        Ondata di freddo penetrante che, se va a segno,
        fa andare KO il bersaglio.
    omega-ruby-alpha-sapphire:
      ja-Hrkt: |-
        ぜったいれいどの　つめたさで
        あいてを　こうげきする。
        あたれば　いちげきで　ひんしに　する。
      ja: |-
        絶対零度の　冷たさで
        相手を　攻撃する。
        当たれば　一撃で　ひんしに　する。
      ko: |-
        절대영도의 추위로
        상대를 공격한다.
        맞으면 일격에 기절한다.
      en: |-
        The target is attacked with a blast of
        absolute-zero cold. The target faints
        instantly if this attack hits.
      fr: |-
        Une vague de froid glacial frappe l’ennemi.
        S’il est touché, il est mis K.O. sur le coup.
      de: 'Angriff mit Kälte, die das Ziel bei Erfolg besiegt.'
      es: |-
        Ataque de frío polar que debilita al objetivo si le 
        alcanza.
      it: |-
        Ondata di freddo penetrante che, se va a segno,
        fa andare KO il bersaglio.
    sun-moon:
      ja-Hrkt: |-
        あいてを　いちげきで　ひんしに　する。
        こおりタイプ　いがいの　ポケモンが
        つかうと　あたりにくい。
      ja: |-
        相手を　一撃で　瀕死に　する。
        こおりタイプ　以外の　ポケモンが
        使うと　当たりにくい。
      ko: |-
        상대를 일격에 기절시킨다.
        얼음타입 이외의 포켓몬이
        사용하면 잘 맞지 않는다.
      zh-Hant: |-
        一擊讓對手陷入瀕死。
        冰屬性以外的寶可夢使用時，
        會比較不易命中對手。
      zh-Hans: |-
        给对手一击濒死。
        如果是冰属性以外的宝可梦使用，
        就会难以打中。
      en: |-
        The target faints instantly. It’s less likely to hit the
        target if it’s used by Pokémon other than Ice types.
      fr: |-
        Une vague de froid glacial frappe l’ennemi pour le
        mettre K.O. en un coup. A peu de chances de réussir
        si le lanceur ne possède pas le type Glace.
      de: |-
        Diese Attacke führt beim Ziel sofort zum K.O. Wird
        sie von einem Pokémon eingesetzt, das nicht dem
        Typ Eis angehört, trifft sie seltener.
      es: |-
        Debilita al objetivo de un solo golpe. Si lo usa un
        Pokémon que no sea de tipo Hielo, es difícil que
        acierte.
      it: |-
        Il bersaglio esaurisce i PS in un colpo solo.
        Se viene usata da Pokémon che non sono di tipo
        Ghiaccio, difficilmente va a segno.
