  flavor_text:
    x-y:
      ja-Hrkt: |-
        だいちの　パワーを　あつめ
        ちからを　あいてに　しゅうちゅう
        させて　ダメージを　あたえる。
      ja: |-
        大地の　パワーを　集め
        力を　相手に　集中させて
        ダメージを　与える。
      ko: |-
        대지의 힘을 모으고
        그 힘을 상대에게 집중시켜서
        데미지를 준다.
      en: |-
        The user gathers the energy of the land
        and focuses that power on opposing
        Pokémon to damage them.
      fr: |-
        Utilise la puissance du sol et la concentre sur
        l’ennemi pour infliger des dégâts.
      de: |-
        Der Anwender sammelt die Kraft des weiten
        Landes und greift an, indem er sie gebündelt
        auf das Ziel lenkt.
      es: |-
        Acumula energía de la corteza terrestre y la
        concentra contra los oponentes, dañándolos.
      it: |-
        Chi la usa raccoglie energia tellurica e ne
        concentra il potere sui nemici che ha intorno,
        danneggiandoli.
