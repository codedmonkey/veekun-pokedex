        可連續攻擊２～５次。
        速度會提高但防禦會降低。
      zh-Hans: |-
        发射鳞片进行攻击。
        连续攻击２～５次。
        速度会提高但防御会降低。
      en: |-
        The user attacks by shooting scales two to five times
        in a row. This move boosts the user’s Speed stat but
        lowers its Defense stat.
      fr: |-
        Le lanceur projette des écailles sur la cible de deux à
        cinq fois d’affilée. Augmente la Vitesse, mais diminue
        la Défense.
      de: |-
        Der Anwender greift das Ziel zwei- bis fünfmal
        hintereinander mit Schuppen-Geschossen an. Erhöht
        die eigene Initiative, aber senkt die Verteidigung.
      es: |-
        Lanza escamas al objetivo de dos a cinco veces
        seguidas. Aumenta la Velocidad del usuario, pero
        reduce su Defensa.
      it: |-
        Il Pokémon attacca lanciando delle squame da due
        a cinque volte di fila. Aumenta la Velocità di chi la usa,
        ma ne riduce la Difesa.
