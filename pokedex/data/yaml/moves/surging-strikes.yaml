      zh-Hans: |-
        将水之流派修炼至大成的
        仿若行云流水般的３次连击。
        必定会击中要害。
      en: |-
        The user, having mastered the Water style, strikes the
        target with a flowing motion three times in a row. This
        attack always results in a critical hit.
      fr: |-
        Le lanceur assène trois coups fluides à l’ennemi.
        Cette technique qui inflige toujours un coup critique
        est réservée à ceux qui maîtrisent la puissance de l’Eau.
      de: |-
        Der Anwender hat den Stil des Wassers gemeistert und
        führt mit fließenden Bewegungen drei Angriffe in Folge
        mit Volltreffergarantie aus.
      es: |-
        El usuario, dominador absoluto del líquido elemento,
        golpea hasta tres veces con movimientos fluidos.
        Siempre asesta un golpe crítico.
      it: |-
        Il Pokémon sferra una fluida serie di tre attacchi,
        massima espressione dello stile di tipo Acqua.
        Brutto colpo assicurato.
