    x-y:
      ja-Hrkt: |-
        ちょうのうりょくで　あんじを　かけて
        じぶんの　うけている　じょうたい
        いじょうを　あいてに　うつす。
      ja: |-
        超能力で　暗示を　かけて
        自分の　受けている　状態異常を
        相手に　うつす。
      ko: |-
        초능력으로 암시를 걸어서
        자신에게 걸려 있는 상태 이상을
        상대에게 옮긴다.
      en: |-
        Using its psychic power of suggestion,
        the user transfers its status conditions
        to the target.
      fr: |-
        Le lanceur transfère ses problèmes de statut à
        l’ennemi grâce à son pouvoir de suggestion.
      de: |-
        Anwender nutzt seine Suggestivkräfte, um eigene
        Statusprobleme auf das Ziel zu transferieren.
      es: |-
        Usa su poder mental para transferir al objetivo sus
        problemas de estado.
      it: |-
        Con la forza psichica e la suggestione, chi la usa
        può trasferire i suoi problemi di stato al Pokémon
        colpito.
