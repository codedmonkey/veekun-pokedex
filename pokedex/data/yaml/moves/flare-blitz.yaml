  flavor_text:
    diamond-pearl:
      en: |-
        The user cloaks
        itself in fire and
        charges at the foe.
        The user sustains
        serious damage, too.
    platinum:
      en: |-
        The user cloaks
        itself in fire and
        charges at the foe.
        The user sustains
        serious damage, too.
    heartgold-soulsilver:
      en: |-
        The user cloaks
        itself in fire and
        charges at the foe.
        The user sustains
        serious damage, too.
    black-white:
      en: |-
        The user cloaks itself in fire and charges
        at the target. The user sustains serious
        damage and may leave the target burned.
      fr: |-
        Le lanceur s’embrase avant de charger
        l’ennemi. Le choc blesse aussi gravement
        le lanceur. Peut brûler l’ennemi.
    black-2-white-2:
      en: |-
        The user cloaks itself in fire and charges
        at the target. The user sustains serious
        damage and may leave the target burned.
    x-y:
      ja-Hrkt: |-
        ほのおを　まとって　とっしんする。
        じぶんも　かなり　ダメージを　うける。
        やけど　じょうたいに　することが　ある。
      ja: |-
        炎を　まとって　突進する。
        自分も　かなり　ダメージを　受ける。
        やけど状態に　することが　ある。
      ko: |-
        불꽃을 두르고 돌진한다.
        자신도 상당한 데미지를 입는다.
        화상 상태로 만들 때가 있다.
      en: |-
        The user cloaks itself in fire and charges the target.
        This also damages the user quite a lot.
        This may leave the target with a burn.
      fr: |-
        Le lanceur s’embrase avant de charger l’ennemi.
        Le choc blesse aussi gravement le lanceur.
        Peut brûler l’ennemi.
      de: |-
        Anwender hüllt sich in Flammen und stürmt
        auf das Ziel zu, das sich eventuell verbrennt.
        Anwender nimmt selbst großen Schaden.
      es: |-
        El Pokémon se cubre de llamas y carga contra el
        objetivo, aunque él también recibe daños. Puede
        quemar.
      it: |-
        Chi la usa si ricopre di fuoco e carica il bersaglio,
        ma subisce il contraccolpo. Può anche scottare
        il Pokémon colpito.
