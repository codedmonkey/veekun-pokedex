        あいての　あしもとに　どくびしを
        しかける。こうたいで　でてきた　あいての
        ポケモンに　どくを　おわせる。
      ja: |-
        相手の　足下に　どくびしを
        しかける。交代で　でてきた　相手の
        ポケモンに　毒を　おわせる。
      ko: |-
        상대의 발밑에 독압정을
        뿌린다. 교체로 나온 상대
        포켓몬에 독을 덮어씌운다.
      en: |-
        The user lays a trap of poison spikes at the
        opposing team’s feet. They poison
        opposing Pokémon that switch into battle.
      fr: |-
        Lance des pics autour de l’ennemi.
        Ils empoisonnent les ennemis qui entrent au
        combat.
      de: |-
        Anwender legt eine Falle mit Giftdornen aus.
        In den Kampf eingewechselte gegnerische
        Pokémon werden vergiftet.
      es: |-
        Lanza una trampa de púas tóxicas a los pies del
        objetivo. El veneno afecta a los Pokémon que
        entran en combate.
      it: |-
        Chi la usa piazza una trappola di punte che
        avvelenano i nemici che scendono in campo.
