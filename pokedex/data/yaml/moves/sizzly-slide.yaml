    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        ほのおを　まとった　からだで
        いきおいよく　あいてに　ぶつかる。
        あいてを　やけど　じょうたいに　する。
      ja: |-
        炎を　まとった　体で
        勢いよく　相手に　ぶつかる。
        相手を　やけど状態に　する。
      ko: |-
        불꽃을 두른 몸으로
        기세 좋게 상대에게 부딪친다.
        상대를 화상 상태로 만든다.
      zh-Hant: |-
        用纏繞著火焰的身體
        猛烈地衝撞對手，
        讓對手陷入灼傷狀態。
      zh-Hans: |-
        用燃起大火的身体
        猛烈地冲撞对手。
        让对手陷入灼伤状态。
      en: |-
        The user cloaks itself in fire and charges at the target.
        This also leaves the target with a burn.
      fr: |-
        Évoli s’embrase et percute violemment l’adversaire.
        Brûle aussi l’ennemi.
      de: |-
        Evoli hüllt sich in Flammen und stürzt sich beherzt auf
        das Ziel, welches dadurch Verbrennungen erleidet.
      es: |-
        Tras envolver su cuerpo en llamas, el usuario arrolla con
        fuerza al rival y le provoca quemaduras.
      it: |-
        Chi la usa viene avvolto dalle fiamme e colpisce
        il bersaglio con forza, scottandolo.
    sword-shield:
      ja-Hrkt: |-
        このわざは　つかえません
        おもいだすことが　できなくなりますが
        わざを　わすれることを　おすすめします
      ja: |-
        この技は　使えません
        思い出すことが　できなくなりますが
        技を　忘れることを　おすすめします
      ko: |-
        사용할 수 없는 기술입니다.
        다시 배우게 할 수 없지만
        기술을 잊게 하는 것을 권장합니다.
      zh-Hant: |-
        無法使用此招式。
        雖然忘記後將無法再想起來，
        但還是建議忘記此招式。
      zh-Hans: |-
        无法使用这个招式。
        虽然忘记之后就再也想不起来了，
        但还是建议忘记这个招式。
      en: |-
        This move can’t be used.
        It’s recommended that this move is forgotten.
        Once forgotten, this move can’t be remembered.
      fr: |-
        Cette capacité ne peut pas être utilisée.
        Il est recommandé de l’oublier, même s’il sera
        impossible de se la remémorer une fois oubliée.
      de: |-
        Diese Attacke kann nicht eingesetzt werden. Du solltest
        dein Pokémon sie vergessen lassen. Beachte aber,
        dass es sich danach nicht wieder an sie erinnern kann.
      es: |-
        Este movimiento no se puede usar, por lo que sería
        mejor olvidarlo, aunque eso implique que no se pueda
        recordar posteriormente.
      it: |-
        Questa mossa non può essere usata.
        È consigliabile farla dimenticare al Pokémon. Tuttavia,
        una volta dimenticata, non potrà più essere ricordata.
