    x-y:
      ja-Hrkt: |-
        しぜんから　あつめた
        いのちの　ちからを　はっしゃする。
        あいての　とくぼうを　さげることがある。
      ja: |-
        自然から　集めた
        命の力を　発射する。
        相手の　特防を　さげることがある。
      ko: |-
        자연으로부터 모은
        생명의 힘을 발사한다.
        상대의 특수방어를 떨어뜨릴 때가 있다.
      en: |-
        The user draws power from nature and
        fires it at the target.
        This may also lower the target’s Sp. Def.
      fr: |-
        Utilise les pouvoirs de la nature pour attaquer
        l’ennemi. Peut aussi baisser sa Défense Spéciale.
      de: |-
        Anwender zieht Kraft aus der Natur
        und feuert sie auf das Ziel. Senkt eventuell
        Spezial-Verteidigung des Zieles.
      es: |-
        Aúna fuerzas de la naturaleza y libera su ataque.
        Puede disminuir la Defensa Especial del objetivo.
      it: |-
        Chi la usa attinge energia dalla natura e la
        scaglia contro il bersaglio. Può anche ridurne
        la Difesa Speciale.
