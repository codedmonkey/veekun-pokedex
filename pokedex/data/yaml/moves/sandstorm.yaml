    x-y:
      ja-Hrkt: |-
        ５ターンの　あいだ　すなあらしで
        いわ　じめん　はがねタイプ　いがいの
        ポケモンに　ダメージを　あたえる。
      ja: |-
        ５ターンの　あいだ　砂あらしで
        いわ　じめん　はがねタイプ　以外の
        ポケモンに　ダメージを　与える。
      ko: |-
        5턴 동안 모래바람으로
        바위, 땅, 강철타입 이외의
        포켓몬에게 데미지를 준다.
      en: |-
        A five-turn sandstorm is summoned
        to hurt all combatants except the
        Rock, Ground, and Steel types.
      fr: |-
        Une tempête de sable qui blesse tous les
        Pokémon durant cinq tours, sauf ceux de types
        Roche, Sol et Acier.
      de: |-
        Sandsturm für fünf Runden. Fügt Pokémon
        von jedem Typ außer Gestein, Boden und Stahl
        Schaden zu.
      es: |-
        Tormenta de arena que dura cinco turnos y hiere a
        todos, excepto a los de tipo Roca, Tierra y Acero.
      it: |-
        Causa una tempesta di sabbia per cinque turni
        che danneggia tutti i tipi in campo esclusi
        Terra, Roccia e Acciaio.
