relic-song:
  accuracy: 100
  changelog: {  }
  contest_effect: ~
  contest_type: ~
  damage_class: special
  effect: move-effect-330
  effect_chance: 10
  flags:
    - protect
    - mirror
    - sound
    - authentic
  flavor_text:
    black-white:
      en: |-
        The user sings an ancient song and attacks
        by appealing to the hearts of those
        listening. It may also induce sleep.
      fr: |-
        Le lanceur attaque l’ennemi en lui
        chantant une chanson d’un autre temps.
        Peut endormir l’ennemi.
    black-2-white-2:
      en: |-
        The user sings an ancient song and attacks
        by appealing to the hearts of those
        listening. It may also induce sleep.
    x-y:
      ja-Hrkt: |-
        いにしえのうたを　あいてに　きかせて
        こころに　うったえて　こうげきする。
        ねむり　じょうたいに　することが　ある。
      ja: |-
        いにしえのうたを　相手に　聞かせて
        心に　うったえて　攻撃する。
        眠り状態に　することが　ある。
      ko: |-
        옛노래를 상대에게 들려주고
        마음에 호소하여 공격한다.
        잠듦 상태로 만들 때가 있다.
      en: |-
        The user sings an ancient song and attacks
        by appealing to the hearts of the listening
        opposing Pokémon. This may also induce sleep.
      fr: |-
        Le lanceur attaque l’ennemi en lui chantant une
        chanson d’un autre temps. Peut l’endormir.
      de: |-
        Anwender greift mit Urgesang an, der Ziele
        in der Nähe im tiefsten Inneren anspricht.
        Diese schlafen eventuell ein.
      es: |-
        Ataca conmoviendo a los rivales de alrededor con
        un antiguo canto. Puede dormirlos.
      it: |-
        Chi la usa attacca i nemici intorno a sé
        intonando un’antica melodia che colpisce
        il loro spirito. Può anche farli addormentare.
