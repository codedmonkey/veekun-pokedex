        きょだいな　ほのおを　たたきつける。
        きょだいな　いかずちの　えいきょうをうけ
        わざの　いりょくが　あがる。
      ja: |-
        巨大な　炎を　たたきつける。
        巨大な　雷の　影響を受け
        技の　威力が　あがる。
