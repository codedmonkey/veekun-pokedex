oblivion-wing:
  accuracy: 100
  changelog: {  }
  contest_effect: ~
  contest_type: ~
  damage_class: special
  effect: move-effect-349
  effect_chance: ~
  flags:
    - protect
    - mirror
    - distance
    - heal
  flavor_text:
    x-y:
      ja-Hrkt: |-
        ねらいを　さだめた　あいてから　ＨＰを
        すいとる。あたえた　ダメージの
        はんぶんいじょう　ＨＰを　かいふくする。
      ja: |-
        ねらいを　定めた　相手から　ＨＰを
        吸い取る。与えた　ダメージの
        半分以上　ＨＰを　回復する。
      ko: |-
        조준한 상대로부터 HP를
        흡수한다. 준 데미지의
        반 이상 HP를 회복한다.
      en: |-
        The user absorbs its target’s HP.
        The user’s HP is restored by over half
        of the damage taken by the target.
      fr: |-
        Vole l’énergie de la cible.
        Rend au lanceur un nombre de PV supérieur ou
        égal à la moitié des dégâts infligés.
      de: |-
        Der Anwender raubt dem Ziel KP.
        Die Höhe der Heilung beträgt mehr als die Hälfte
        des beim Ziel angerichteten Schadens.
      es: |-
        El usuario absorbe energía del Pokémon
        objetivo y aumenta sus PS en una cantidad
        igual o superior a la mitad del daño infligido.
      it: |-
        Chi la usa assorbe energia dal bersaglio
        recuperando una quantità di PS pari a più
        della metà del danno inferto.
