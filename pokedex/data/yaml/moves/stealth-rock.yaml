  flavor_text:
    diamond-pearl:
      en: |-
        The user lays a trap
        of levitating stones
        around the foe. The
        trap hurts foes that
        switch into battle.
    platinum:
      en: |-
        The user lays a trap
        of levitating stones
        around the foe. The
        trap hurts foes that
        switch into battle.
    heartgold-soulsilver:
      en: |-
        The user lays a trap
        of levitating stones
        around the foe. The
        trap hurts foes that
        switch into battle.
    black-white:
      en: |-
        The user lays a trap of levitating stones
        around the opponent’s team. The trap
        hurts opponents that switch into battle.
      fr: |-
        Lance des pierres flottantes autour
        de l’ennemi, qui blessent tout ennemi
        entrant au combat.
    black-2-white-2:
      en: |-
        The user lays a trap of levitating stones
        around the opponent’s team. The trap
        hurts opponents that switch into battle.
    x-y:
      ja-Hrkt: |-
        あいての　まわりに　むすうの　いわを
        うかべて　こうたいで　でてきた　あいての
        ポケモンに　ダメージを　あたえる。
      ja: |-
        相手の　周りに　無数の　岩を
        浮かべて　交代で　でてきた　相手の
        ポケモンに　ダメージを　与える。
      ko: |-
        상대의 주위에 무수한 바위를
        띄워 교체해서 나온 상대
        포켓몬에게 데미지를 준다.
      en: |-
        The user lays a trap of levitating stones
        around the opposing team. The trap hurts
        opposing Pokémon that switch into battle.
      fr: |-
        Lance des pierres flottantes autour de l’ennemi,
        qui blessent tout adversaire entrant au combat.
      de: |-
        Falle mit schwebenden Steinen. In den Kampf
        eingewechselte Ziele nehmen Schaden.
      es: |-
        Una trampa de rocas que flota en el aire y daña a
        los objetivos que entran en combate.
      it: |-
        Chi la usa piazza una trappola di rocce sospese
        che danneggia i nemici che entrano in campo.
