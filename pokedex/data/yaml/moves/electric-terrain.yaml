  flavor_text:
    x-y:
      ja-Hrkt: |-
        ５ターンの　あいだ　あしもとを
        エレキフィールドにする。　じめんにいる
        ポケモンは　ねむらなくなる。
      ja: |-
        ５ターンの　あいだ　足元を
        エレキフィールドにする。地面にいる
        ポケモンは　眠らなくなる。
      ko: |-
        5턴 동안 발밑을
        일렉트릭필드로 만든다. 땅에 있는
        포켓몬은 잠들지 않게 된다.
      en: |-
        The user electrifies the ground under
        everyone’s feet for five turns.
        Pokémon on the ground no longer fall asleep.
      fr: |-
        Pendant cinq tours, le terrain aux pieds du lanceur
        se charge d’électricité. Les Pokémon au sol ne
        peuvent pas s’endormir.
      de: |-
        Verwandelt den Untergrund fünf Runden lang
        in ein Elektrofeld und hindert alle Pokémon,
        die den Boden berühren, am Einschlafen.
      es: |-
        Durante cinco turnos, crea un campo eléctrico en
        el terreno de combate que impide dormirse a los
        Pokémon que estén en contacto con el suelo.
      it: |-
        Per cinque turni trasforma il terreno di lotta
        in un campo elettrico, impedendo ai Pokémon
        a terra di addormentarsi.
