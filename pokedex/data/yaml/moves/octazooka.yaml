        명중률을 떨어뜨릴 때가 있다.
      en: |-
        The user attacks by spraying ink in the
        target’s face or eyes.
        This may also lower the target’s accuracy.
      fr: |-
        Le lanceur attaque en projetant de l’encre au
        visage de l’ennemi. Peut aussi baisser sa Précision.
      de: |-
        Schießt mit Tinte, um Schaden anzurichten
        und die Genauigkeit zu senken.
      es: 'Dispara tinta a la cara. Puede bajar la Precisión.'
      it: |-
        Chi la usa spruzza inchiostro in faccia al bersaglio.
        Può anche ridurne la precisione.
