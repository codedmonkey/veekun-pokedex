    x-y:
      ja-Hrkt: |-
        ほのおを　まとった　キバで　かみつく。
        あいてを　ひるませたり
        やけど　じょうたいに　することが　ある。
      ja: |-
        炎を　まとった　キバで　かみつく。
        相手を　ひるませたり
        やけど状態に　することが　ある。
      ko: |-
        불꽃을 두른 이빨로 문다.
        상대를 풀죽게 하거나
        화상 상태로 만들 때가 있다.
      en: |-
        The user bites with flame-cloaked fangs.
        This may also make the target flinch or leave
        it with a burn.
      fr: |-
        Le lanceur utilise une morsure enflammée.
        Peut aussi brûler ou apeurer l’ennemi.
      de: |-
        Anwender beißt mit flammenden Reißzähnen zu.
        Ziel schreckt eventuell zurück oder verbrennt sich.
      es: |-
        Usa colmillos en llamas para morder. Puede hacer
        que el objetivo retroceda o reciba quemaduras.
      it: |-
        Chi la usa morde con denti infuocati. Può anche
        scottare o far tentennare il bersaglio.
