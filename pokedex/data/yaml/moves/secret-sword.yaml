  flavor_text:
    black-white:
      en: |-
        The user cuts with its long horn. The odd
        power contained in the horn does physical
        damage to the target.
      fr: |-
        L’ennemi est lacéré par une longue lame.
        Le pouvoir mystérieux de la lame inflige
        des dégâts physiques.
    black-2-white-2:
      en: |-
        The user cuts with its long horn. The odd
        power contained in the horn does physical
        damage to the target.
    x-y:
      ja-Hrkt: |-
        ながい　つので　きりつけ　こうげきする。
        つのが　まとった　ふしぎな　ちからは
        ぶつりてきな　ダメージを　あたえる。
      ja: |-
        長い　つので　切りつけ　攻撃する。
        つのが　まとった　不思議な　力は
        物理的な　ダメージを　与える。
      ko: |-
        긴 뿔로 베어 공격한다.
        뿔이 머금은 이상한 힘은
        물리적인 데미지를 준다.
      en: |-
        The user cuts with its long horn. The odd
        power contained in the horn does physical
        damage to the target.
      fr: |-
        L’ennemi est lacéré par une longue corne.
        Son pouvoir mystérieux inflige des dégâts
        physiques.
      de: |-
        Schneideangriff mit dem langen Schwert
        des Anwenders. Die mysteriöse Kraft aus
        dem Horn erzeugt physischen Schaden.
      es: |-
        Ensarta al objetivo con un sable, hiriéndolo con su
        místico poder. Produce daño físico.
      it: |-
        Chi la usa attacca il bersaglio tagliandolo con una
        spada mistica. La misteriosa energia sprigionata
        provoca danni fisici.
