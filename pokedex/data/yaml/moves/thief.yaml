    x-y:
      ja-Hrkt: |-
        こうげきと　どうじに　どうぐを　ぬすむ。
        じぶんが　どうぐを　もっている　ばあいは
        ぬすめない。
      ja: |-
        攻撃と　同時に　道具を　盗む。
        自分が　道具を　持っている　場合は
        盗めない。
      ko: |-
        공격과 동시에 도구를 훔친다.
        자신이 도구를 지니고 있을 경우에는
        훔칠 수 없다.
      en: |-
        The user attacks and steals the target’s
        held item simultaneously. The user can’t
        steal anything if it already holds an item.
      fr: |-
        Le lanceur attaque la cible et vole son objet.
        Le lanceur ne peut rien voler s’il tient déjà
        un objet.
      de: |-
        Erlaubt es, das Item des Zieles zu stehlen,
        solang der Anwender selbst keins bei sich trägt.
      es: |-
        Ataca y le quita al objetivo el objeto que lleve.
        Si el agresor lleva un objeto, no robará el del
        objetivo.
      it: |-
        Chi la usa attacca il bersaglio e può rubargli
        lo strumento, se non ne ha già uno.
