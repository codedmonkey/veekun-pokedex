    black-white:
      en: |-
        The user electrifies itself, then charges. 
        It causes considerable damage to the user
        and may leave the target with paralysis.
      fr: |-
        Le lanceur électrifie son corps avant de
        charger. Le choc blesse aussi beaucoup
        le lanceur et peut paralyser l’ennemi.
    black-2-white-2:
      en: |-
        The user electrifies itself, then charges.
        It causes considerable damage to the user
        and may leave the target with paralysis.
    x-y:
      ja-Hrkt: |-
        でんきを　まとって　とっしんする。
        じぶんも　かなり ダメージを　うける。
        まひ　じょうたいに　することが　ある。
      ja: |-
        電気を　まとって　突進する。
        自分も　かなり　ダメージを　受ける。
        まひ状態に　することが　ある。
      ko: |-
        전기를 한데 모아 돌진한다.
        자신도 상당한 데미지를 입는다.
        마비 상태로 만들 때가 있다.
      en: |-
        The user electrifies itself, then charges.
        This also damages the user quite a lot.
        This may leave the target with paralysis.
      fr: |-
        Le lanceur électrifie son corps avant de charger.
        Le choc blesse aussi gravement le lanceur et peut
        paralyser l’ennemi.
      de: |-
        Angriff mit Elektro-Tackle. Der Anwender verletzt
        sich dabei. Das Ziel wird eventuell paralysiert.
      es: |-
        Quien lo usa electrifica su cuerpo para luego atacar.
        Se hiere mucho a sí mismo, pero puede paralizar al
        objetivo.
      it: |-
        Chi la usa si carica di elettricità e poi attacca.
        Può paralizzare il bersaglio. Il contraccolpo causa
        seri danni.
