  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        でんきを　まとった　くちばしで　さす。
        あいてより　さきに　こうげきできると
        わざの　いりょくは　２ばいに　なる。
      ja: |-
        電気を　まとった　くちばしで　刺す。
        相手より　先に　攻撃できると
        技の　威力は　２倍に　なる。
      ko: |-
        전기를 두른 부리로 찌른다.
        상대보다 먼저 공격하면
        기술의 위력은 2배가 된다.
      zh-Hant: |-
        用帶有電流的鳥嘴刺向對手。
        若在對手之前進行攻擊，
        招式的威力會變成２倍。
      zh-Hans: |-
        用带电的喙啄刺对手。
        如果比对手先出手攻击，
        招式的威力会变成２倍。
      en: |-
        The user stabs the target with its electrified beak.
        If the user attacks before the target, the power of this
        move is doubled.
      fr: |-
        Le lanceur transperce sa cible avec son bec chargé
        d’électricité. Si cette attaque est lancée avant que
        la cible n’attaque, elle infligera deux fois plus de dégâts.
      de: |-
        Der Anwender sticht mit einem elektrisch aufgeladenen
        Schnabel zu. Kommt er vor dem Ziel zum Zug,
        verdoppelt sich die Stärke der Attacke.
      es: |-
        El usuario ensarta al objetivo con su pico cargado de
        electricidad. Si ataca en primer lugar, la potencia del
        movimiento se duplica.
      it: |-
        Chi la usa attacca il bersaglio con il becco appuntito
        carico d’elettricità. Se attacca per primo, la potenza
        della mossa raddoppia.
