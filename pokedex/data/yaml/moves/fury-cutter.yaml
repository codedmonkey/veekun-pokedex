    x-y:
      ja-Hrkt: |-
        カマや　ツメ　などで　あいてを
        きりつけて　こうげきする。れんぞくで
        あてると　いりょくが　あがる。
      ja: |-
        カマや　ツメなどで　相手を
        切りつけて　攻撃する。
        連続で　当てると　威力が　あがる。
      ko: |-
        낫이나 발톱 등으로 상대를
        베어 공격한다.
        연속으로 맞히면 위력이 올라간다.
      en: |-
        The target is slashed with scythes or
        claws. This attack becomes more powerful
        if it hits in succession.
      fr: |-
        Un coup de faux ou de griffe dont la force
        augmente quand il touche plusieurs fois d’affilée.
      de: |-
        Eine Attacke mit Scheren oder Klauen, deren Härte
        bei aufeinanderfolgenden Treffern zunimmt.
      es: |-
        Ataque con garras o guadaña que crece en
        intensidad si se usa repetidas veces.
      it: |-
        Colpisce il bersaglio con falci o artigli. Se usata
        in successione aumenta di potenza ogni volta
        che va a segno.
