  flavor_text:
    black-white:
      en: |-
        The user protects itself by wrapping
        its body in soft cotton, drastically
        raising the user’s Defense stat.
      fr: |-
        Le lanceur se protège en s’emmitouflant
        dans du coton. Sa Défense augmente
        fortement.
    black-2-white-2:
      en: |-
        The user protects itself by wrapping
        its body in soft cotton, drastically
        raising the user’s Defense stat.
    x-y:
