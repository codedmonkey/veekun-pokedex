        フワフワの　わたげで　じぶんの
        からだを　つつみこんで　まもる。
        ぼうぎょを　ぐぐーんと　あげる。
      ja: |-
        フワフワの　綿毛で　自分の
        体を　包みこんで　守る。
        防御を　ぐぐーんと　あげる。
      ko: |-
        푹신푹신한 솜털로 자신의
        몸을 둘러싸서 지킨다.
        방어를 매우 크게 올린다.
      en: |-
        The user protects itself by wrapping
