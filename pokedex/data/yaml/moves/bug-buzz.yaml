    black-2-white-2:
      en: |-
        The user vibrates its wings to generate a
        damaging sound wave. It may also lower
        the target’s Sp. Def stat.
    x-y:
      ja-Hrkt: |-
        はねの　しんどうで　おんぱを　おこして
        こうげきする。あいての　とくぼうを
        さげることが　ある。
      ja: |-
        はねの　振動で　音波を　おこして
        攻撃する。相手の　特防を
        さげることが　ある。
      ko: |-
        날개의 진동으로 음파를 일으켜서
        공격한다. 상대의 특수방어를
        떨어뜨릴 때가 있다.
      en: |-
        The user vibrates its wings to generate a
        damaging sound wave. This may also lower
        the target’s Sp. Def stat.
      fr: |-
        Le lanceur fait vibrer ses ailes pour lancer une
        vague sonique. Peut aussi baisser la Défense
        Spéciale de l’ennemi.
      de: |-
        Anwender schlägt mit den Flügeln und
        erzeugt eine Schockwelle. Senkt eventuell
        Spezial-Verteidigung des Zieles.
      es: |-
        El movimiento de las alas crea una onda sónica
        dañina. También puede disminuir la Defensa
        Especial del objetivo.
      it: |-
        Chi la usa fa vibrare le ali creando un’onda sonora
        pericolosa. Può anche ridurre la Difesa Speciale
        del bersaglio.
