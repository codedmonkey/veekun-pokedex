hyperspace-fury:
  accuracy: ~
  changelog: {  }
  contest_effect: ~
  contest_type: ~
  damage_class: physical
  effect: move-effect-360
  effect_chance: 100
  flags:
    - mirror
    - authentic
  flavor_text:
    omega-ruby-alpha-sapphire:
      ja-Hrkt: |-
        たくさんの　うでを　つかって　まもるや
         きりを　むしした　れんぞくこうげき。
        じぶんの　ぼうぎょが　さがる。
      ja: |-
        たくさんの　腕を　つかって　まもるや
         きりを　無視した　連続攻撃
        自分の　防御が　さがる。
      ko: |-
        많은 팔을 사용하여 방어와
        판별을 무시하는 연속 공격이다.
        자신의 방어가 떨어진다.
      en: |-
        Using its many arms, the user unleashes a barrage of
        attacks that ignore the effects of moves like Protect
        and Detect. This attack lowers the user’s Defense.
      fr: |-
        Le Pokémon utilise sa multitude de bras pour infliger 
        une nuée de coups qui ignorent les capacités telles 
        qu’Abri ou Détection. Baisse la Défense du lanceur. 
      de: |-
        Eine Angriffsserie mit vielen Armen, die die Wirkung
        von Schutzschild und Scanner durchbricht.
        Dabei sinkt die Verteidigung des Anwenders.
      es: |-
        Ataca al objetivo con una ráfaga de golpes que pasan 
        por alto los efectos de movimientos como Protección
        o Detección. Hace que baje la Defensa del usuario.
      it: |-
        Permette di attaccare ripetutamente grazie ai molti
        arti, ignorando mosse come Protezione o Individua. 
        Riduce la Difesa di chi la usa.
