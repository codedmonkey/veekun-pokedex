        the target’s HP is restored by
        half the user’s max HP.
      fr: |-
        Un vœu qui permet de récupérer la moitié des
        PV max au tour suivant.
      de: |-
        Ein Wunsch füllt in der nächsten Runde
        50 % der KP des Anwenders bei diesem
        oder einem eingewechselten Pokémon auf.
      es: |-
        Restaura la mitad de los PS máximos en el
        siguiente turno.
      it: |-
        Permette di recuperare metà dei PS massimi
        al turno successivo.
