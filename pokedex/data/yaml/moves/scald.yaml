  flavor_text:
    black-white:
      en: |-
        The user shoots boiling hot water at
        its target. It may also leave the target
        with a burn.
      fr: |-
        L’ennemi est attaqué par un jet d’eau
        bouillante. Peut aussi le brûler.
    black-2-white-2:
      en: |-
        The user shoots boiling hot water at
        its target. It may also leave the target
        with a burn.
    x-y:
      ja-Hrkt: |-
        あつく　にえたぎる　みずを
        あいてに　はっしゃして　こうげきする。
        やけど　じょうたいに　することが　ある。
      ja: |-
        熱く　煮えたぎる　水を
        相手に　発射して　攻撃する。
        やけど状態に　することが　ある。
      ko: |-
        뜨겁게 끓어오르는 물을
        상대에게 발사해서 공격한다.
        화상 상태로 만들 때가 있다.
      en: |-
        The user shoots boiling hot water at
        its target. This may also leave the target
        with a burn.
      fr: |-
        L’ennemi est attaqué par un jet d’eau bouillante.
        Peut aussi le brûler.
      de: |-
        Heizt dem Ziel mit einem Schwall siedend heißen
        Kochwassers ein. Das Ziel erleidet dabei eventuell
        Verbrennungen.
      es: |-
        Ataca arrojando agua hirviendo al objetivo.
        Puede causar quemaduras.
      it: |-
        Chi la usa attacca il bersaglio con un getto
        d’acqua bollente che può anche scottarlo.
