  flavor_text:
    black-white:
      en: |-
        The user stomps down on the ground
        and attacks everything in the area. Hit
        Pokémon’s Speed stat is reduced.
      fr: |-
        Le lanceur piétine le sol et inflige des
        dégâts à tous les Pokémon autour
        de lui. Baisse aussi la Vitesse.
    black-2-white-2:
      en: |-
        The user stomps down on the ground
        and attacks everything in the area. Hit
        Pokémon’s Speed stat is reduced.
    x-y:
      ja-Hrkt: |-
        じめんを　ふみならして　じぶんの
        まわりに　いるものを　こうげきする。
        あいての　すばやさを　さげる。
      ja: |-
        地面を　踏みならして　自分の
        周りに　いるものを　攻撃する。
        相手の　素早さを　さげる。
      ko: |-
        땅을 힘껏 밟아 자신의
        주위에 있는 포켓몬을 공격한다.
        상대의 스피드를 떨어뜨린다.
      en: |-
        The user strikes everything around it
        by stomping down on the ground.
        This lowers the Speed stat of those hit.
      fr: |-
        Le lanceur piétine le sol et inflige des dégâts à
        tous les Pokémon autour de lui. Baisse aussi leur
        Vitesse.
      de: |-
        Anwender greift an, indem er den Boden
        um sich herum plattwalzt. Die Initiative aller
        betroffenen Pokémon sinkt.
      es: |-
        Sacudida sísmica que afecta a los demás Pokémon
        adyacentes y también reduce su Velocidad.
      it: |-
        Chi la usa calpesta il terreno e scatena un
        terremoto che danneggia i Pokémon nei paraggi,
        riducendone la Velocità.
