    black-white:
      en: |-
        A seed that causes worry is planted on
        the target. It prevents sleep by making
        its Ability Insomnia.
      fr: |-
        Plante sur la cible une graine qui la rend
        soucieuse et remplace sa capacité spéciale
        par Insomnia, l’empêchant ainsi de dormir.
    black-2-white-2:
      en: |-
        A seed that causes worry is planted on
        the target. It prevents sleep by making
        its Ability Insomnia.
    x-y:
      ja-Hrkt: |-
        こころを　なやませる　タネを
        うえつける。あいてを　ねむれなく　して
        とくせいを　ふみんに　する。
      ja: |-
        心を　なやませる　タネを
        植えつける。相手を　眠れなくして
        特性を　ふみんに　する。
      ko: |-
        마음을 괴롭히는 씨앗을
        심는다. 상대를 잠잘 수 없게 해서
        특성을 불면으로 만든다.
      en: |-
        A seed that causes worry is planted on
        the target. It prevents sleep by making
        the target’s Ability Insomnia.
      fr: |-
        Plante sur la cible une graine qui la rend soucieuse
        et remplace son talent par Insomnia, l’empêchant
        ainsi de dormir.
      de: |-
        Ziel wird bepflanzt. Wandelt Fähigkeit
        in Insomnia um. Verhindert so Schlaf.
      es: |-
        Se planta una semilla en el objetivo que le causa
        pesar. Evita el sueño gracias a la habilidad
        Insomnio.
      it: |-
        Un seme che causa ansia viene piantato
        sul bersaglio. Ne muta l’abilità in Insonnia
        e ne previene o rimuove il sonno.
