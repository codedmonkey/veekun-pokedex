  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        ほほぶくろに　ためた　エネルギーで
        こうげきし　じぶんの　すばやさを　あげる。
        モルペコの　すがたで　タイプが　かわる。
      ja: |-
        ほほぶくろに　溜めた　エネルギーで
        攻撃し　自分の　素早さを　あげる。
        モルペコの　姿で　タイプが　変わる。
      ko: |-
        볼주머니에 저장해둔 에너지로
        공격하고 자신의 스피드를 올린다.
        모르페코의 모습에 따라 타입이 바뀐다.
      zh-Hant: |-
        用儲存在頰囊中的能量進行攻擊，
        並提高自己的速度。招式屬性
        會隨著莫魯貝可的樣子而改變。
      zh-Hans: |-
        用储存在颊囊里的能量
        进行攻击，并提高自己的速度。
        其属性会随着莫鲁贝可的样子而改变。
      en: |-
        Morpeko attacks and raises its Speed with the energy
        stored in its cheeks. This move’s type changes
        depending on the user’s form.
      fr: |-
        Morpeko libère l’énergie stockée dans ses joues
        pour attaquer et augmenter sa Vitesse. Le type de cette
        capacité change en fonction de la forme de Morpeko.
      de: |-
        Mithilfe der in den Backentaschen gespeicherten Energie
        greift der Anwender an und erhöht seine Initiative.
        Der Typ der Attacke hängt von Morpekos Form ab.
      es: |-
        La energía que acumula en las mejillas le sirve para
        atacar y aumentar su Velocidad. Este movimiento
        cambia de tipo según la forma que adopte Morpeko.
      it: |-
        Chi la usa emette l’energia accumulata nelle guance per
        attaccare e aumentare la propria Velocità. Il tipo della
        mossa cambia in base alla forma assunta da Morpeko.
