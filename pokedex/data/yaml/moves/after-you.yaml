  flavor_text:
    black-white:
      en: |-
        The user helps the target and makes it
        use its move right after the user.
      fr: |-
        S’il est le premier à agir, le lanceur
        permet à sa cible d’utiliser une
        capacité juste après lui.
    black-2-white-2:
      en: |-
        The user helps the target and makes it
        use its move right after the user.
    x-y:
      ja-Hrkt: |-
        あいての　こうどうを　サポートして
        じぶんの　こうどうの　あとに
        つづけて　うごけるように　する。
      ja: |-
        相手の　行動を　サポートして
        自分の　行動の　あとに
        続けて　動けるように　する。
      ko: |-
        상대의 행동을 도와서
        자신이 행동한 뒤에 바로
        움직일 수 있도록 한다.
      en: |-
        The user helps the target and makes it
        use its move right after the user.
      fr: |-
        S’il est le premier à agir, le lanceur permet à sa
        cible d’utiliser une capacité juste après lui.
      de: |-
        Anwender ermöglicht dem Ziel direkt nach ihm
        zu handeln, solange der Anwender als Erstes
        zum Zug kommt.
      es: |-
        Si el usuario es el más rápido, permite al objetivo
        usar un movimiento justo tras él, adelantándose a
        Pokémon más rápidos.
      it: |-
        Chi la usa aiuta un bersaglio più lento
        permettendogli di agire subito dopo.
