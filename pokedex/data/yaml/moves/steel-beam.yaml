  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        ぜんしんから　あつめた　はがねを
        ビームとして　はげしく　うちだす。
        じぶんも　ダメージを　うけてしまう。
      ja: |-
        全身から　集めた　はがねを
        ビームとして　激しく　撃ちだす。
        自分も　ダメージを　受けてしまう。
      ko: |-
        전신에서 끌어모은 강철을
        빔으로 바꿔 세차게 발사한다.
        자신도 데미지를 받는다.
      zh-Hant: |-
        將從全身匯聚起來的鋼鐵
        化為光束激烈地發射出去。
        自己也會受到傷害。
      zh-Hans: |-
        将从全身聚集的钢铁
        化为光束，激烈地发射出去。
        自己也会受到伤害。
      en: |-
        The user fires a beam of steel that it collected from its
        entire body. This also damages the user.
      fr: |-
        Le lanceur concentre du métal issu de tout son corps
        en un rayon qu’il projette violemment sur sa cible.
        Il subit aussi des dégâts.
      de: |-
        Der Anwender schießt Stahl, den er in seinem ganzen
        Körper angesammelt hat, in Form eines mächtigen
        Strahls ab. Dabei verletzt er sich auch selbst.
      es: |-
        Utiliza el acero de su cuerpo para disparar un potente
        rayo. También hiere al agresor.
      it: |-
        Chi la usa utilizza l’acciaio del proprio corpo per
        sparare un violento raggio, ma subisce danni.
