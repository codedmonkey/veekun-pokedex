    x-y:
      ja-Hrkt: |-
        ５ターンの　あいだ　あめを　ふらせて
        みずタイプの
        わざの　いりょくを　あげる。
      ja: |-
        ５ターンの　あいだ　雨を　降らせて
        みずタイプの
        技の　威力を　あげる。
      ko: |-
        5턴 동안 비를 내리게 하여
        물타입 기술의
        위력을 올린다.
      en: |-
        The user summons a heavy rain
        that falls for five turns,
        powering up Water-type moves.
      fr: |-
        Invoque de fortes pluies qui durent cinq tours et
        augmentent la puissance des capacités de type
        Eau.
      de: |-
        Anwender erzeugt starken Regen. Die Stärke von
        Wasser-Attacken erhöht sich fünf Runden lang.
      es: |-
        Genera una fuerte lluvia que refuerza los
        movimientos de tipo Agua durante cinco turnos.
      it: |-
        Chi la usa provoca una forte pioggia per
        cinque turni, potenziando le mosse di tipo Acqua.
    omega-ruby-alpha-sapphire:
      ja-Hrkt: |-
        ５ターンの　あいだ　あめを　ふらせて
