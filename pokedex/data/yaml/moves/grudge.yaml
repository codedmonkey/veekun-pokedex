        the user’s grudge
        fully depletes the PP
        of the foe’s move
        that knocked it out.
    black-white:
      en: |-
        If the user faints, the user’s grudge
        fully depletes the PP of the opponent’s
        move that knocked it out.
      fr: |-
        Si le lanceur est mis K.O., sa rancune
        épuise les PP de la capacité utilisée
        pour le mettre K.O.
    black-2-white-2:
      en: |-
        If the user faints, the user’s grudge
        fully depletes the PP of the opponent’s
        move that knocked it out.
    x-y:
      ja-Hrkt: |-
        あいての　わざで　ひんしに　されたとき
        おんねんを　かけて
        そのわざの　ＰＰを　０に　する。
      ja: |-
        相手の　技で　ひんしに　されたとき
        おんねんを　かけて
        その技の　ＰＰを　０に　する。
      ko: |-
        상대의 기술로 기절하면
        원념을 담아
        그 기술의 PP를 0으로 만든다.
      en: |-
        If the user faints, the user’s grudge
        fully depletes the PP of the opponent’s
        move that knocked it out.
      fr: |-
        Si le lanceur est mis K.O., sa rancune épuise les
        PP de la capacité utilisée par l’ennemi pour le
        mettre K.O.
      de: |-
        Bei K.O. des Anwenders werden die AP
        der Attacke, durch die er besiegt wurde,
        auf 0 herabgesetzt.
      es: |-
        Si el usuario se debilita al recibir un ataque, todos
        los PP de este último ataque serán eliminados.
      it: |-
        Se chi la usa va KO, i PP della mossa nemica
        che lo ha messo fuori gioco si azzerano.
