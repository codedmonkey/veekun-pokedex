  flavor_text:
    ruby-sapphire:
      en: |-
        If the user faints, deletes
        the PP of the final move.
    emerald:
      en: |-
        If the user faints, deletes
        all PP of foe’s last move.
    firered-leafgreen:
      en: |-
        If the user faints,
        this move deletes
        the PP of the move
        that finished it.
    diamond-pearl:
      en: |-
        If the user faints,
        the user’s grudge
        fully depletes the PP
        of the foe’s move
        that knocked it out.
    platinum:
      en: |-
        If the user faints,
        the user’s grudge
        fully depletes the PP
        of the foe’s move
        that knocked it out.
    heartgold-soulsilver:
