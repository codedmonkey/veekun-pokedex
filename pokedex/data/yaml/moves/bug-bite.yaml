  flavor_text:
    diamond-pearl:
      en: |-
        The user bites the
        foe. If the foe is
        holding a Berry, the
        user eats it and
        gains its effect.
    platinum:
      en: |-
        The user bites the
        foe. If the foe is
        holding a Berry, the
        user eats it and
        gains its effect.
    heartgold-soulsilver:
      en: |-
        The user bites the
        foe. If the foe is
        holding a Berry, the
        user eats it and
        gains its effect.
    black-white:
      en: |-
        The user bites the target. If the target
        is holding a Berry, the user eats it and
        gains its effect.
      fr: |-
        Le lanceur pique l’ennemi. Si ce dernier
        tient une Baie, le lanceur la dévore et
        obtient son effet.
    black-2-white-2:
      en: |-
        The user bites the target. If the target
        is holding a Berry, the user eats it and
        gains its effect.
    x-y:
      ja-Hrkt: |-
        かみついて　こうげきする。
        あいてが　きのみを　もっている　とき
        たべて　きのみの　こうかを　うけられる。
      ja: |-
        かみついて　攻撃する。
        相手が　きのみを　持っているとき
        食べて　きのみの　効果を　受けられる。
      ko: |-
        물어서 공격한다.
        상대가 나무열매를 지니고 있을 때
        먹어서 나무열매의 효과를 받을 수 있다.
      en: |-
        The user bites the target. If the target
        is holding a Berry, the user eats it and
        gains its effect.
      fr: |-
        Le lanceur pique l’ennemi.
        Si ce dernier tient une Baie, le lanceur la dévore
        et obtient son effet.
      de: |-
        Anwender beißt das Ziel. Trägt dieses eine Beere,
        isst der Anwender sie und erhält ihren Effekt.
      es: |-
        Pica al objetivo. Si el objetivo lleva una baya, el
        usuario se la come y se beneficia de su efecto.
      it: |-
        Chi la usa morde il bersaglio. Inoltre, se questi ha
        una bacca, gliela ruba e ne sfrutta gli effetti.
