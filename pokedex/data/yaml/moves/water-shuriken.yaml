  flavor_text:
    x-y:
      ja-Hrkt: |-
        ねんえきで　できた　しゅりけんを
        ２ー５かいの　あいだ　れんぞくで　だす。
        かならず　せんせい　こうげき　できる。
      ja: |-
        粘液で　できた　手裏剣を
        ２ー５回の　あいだ　連続で　だす。
        必ず　先制攻撃　できる。
      ko: |-
        점액으로 만든 수리검을
        2-5회 동안 연속으로 던진다.
        반드시 선제공격할 수 있다.
      en: |-
        The user hits the target with throwing
        stars two to five times in a row.
        This move always goes first.
      fr: |-
        Attaque l’ennemi avec des shuriken de mucus.
        Frappe deux à cinq fois d’affilée en un tour, et
        toujours en premier.
      de: |-
        Der Anwender schleudert dem Ziel Wurfsterne
        aus einem verdickten Sekret entgegen.
        Eine Serien-Attacke, die zwei- bis fünfmal trifft.
      es: |-
        Golpea al oponente de 2 a 5 veces con estrellas
        arrojadizas hechas de mucosidad. El que lo usa
        siempre ataca primero.
      it: |-
        Chi la usa attacca sempre per primo, colpendo
        il bersaglio con uno shuriken di muco da due
        a cinque volte di fila.
