    black-white:
      en: |-
        The user faints. In return, the Pokémon
        taking its place will have its status and
        HP fully restored.
      fr: |-
        Le lanceur tombe K.O. pour soigner le
        statut et les PV du Pokémon qui prendra
        sa place au combat.
    black-2-white-2:
      en: |-
        The user faints. In return, the Pokémon
        taking its place will have its status and
        HP fully restored.
    x-y:
      ja-Hrkt: |-
        じぶんは　ひんしに　なるが
        ひかえから　でてくる　ポケモンの
        すべての　じょうたいを　かいふく　する。
      ja: |-
        自分は　ひんしに　なるが
        控えから　でてくる　ポケモンの
        すべての　状態を　回復する。
      ko: |-
        자신은 기절하지만
        교대하여 나오는 포켓몬의
        모든 상태를 회복한다.
      en: |-
        The user faints. In return, the Pokémon
        taking its place will have its status and
        HP fully restored.
      fr: |-
        Le lanceur tombe K.O. pour soigner le statut et les
        PV du Pokémon qui prendra sa place au combat.
      de: |-
        Anwender geht K.O. Das an seine Stelle
        tretende Pokémon hat dafür volle KP und AP.
        Statusprobleme werden geheilt.
      es: |-
        El usuario se debilita, pero el Pokémon que lo
        sustituye recupera su estado, los PS y los PP.
      it: |-
        Chi la usa va KO. Il Pokémon che lo sostituisce
        guarisce dai propri problemi di stato e recupera
        PS e PP.
