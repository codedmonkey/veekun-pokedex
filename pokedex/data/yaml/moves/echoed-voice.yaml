  effect_chance: ~
  flags:
    - protect
    - mirror
    - sound
    - authentic
  flavor_text:
    black-white:
      en: |-
        The user attacks the target with an
        echoing voice. If this move is used
        every turn, it does greater damage.
      fr: |-
        Un cri retentissant blesse l’ennemi. Si le
        lanceur ou d’autres Pokémon l’utilisent
        à chaque tour, l’effet augmente.
    black-2-white-2:
      en: |-
        The user attacks the target with an
        echoing voice. If this move is used
        every turn, it does greater damage.
    x-y:
      ja-Hrkt: |-
        ひびく　こえで　あいてを　こうげきする。
        まいターン　だれかが　わざを
        つかい　つづけると　いりょくが　あがる。
      ja: |-
        響く　声で　相手を　攻撃する。
        毎ターン　だれかが　技を
        使い続けると　威力が　あがる。
      ko: |-
        울리는 목소리로 상대를 공격한다.
        매 턴 누군가 기술을
        계속해서 쓰면 위력이 올라간다.
      en: |-
        The user attacks the target with an
        echoing voice. If this move is used
        every turn, it does greater damage.
      fr: |-
        Un cri retentissant blesse l’ennemi.
        Si le lanceur ou d’autres Pokémon l’utilisent à
        chaque tour, l’effet augmente.
      de: |-
        Angriff mit widerhallender Stimme. Wenn in
        jeder Runde ein Teilnehmer wiederholt
        die Attacke einsetzt, steigt die Stärke.
      es: |-
        Un susurro que aumenta de potencia conforme el
        usuario y otros Pokémon lo van utilizando.
      it: |-
        Attacca il bersaglio con la propria voce
        echeggiante. Se usata a ripetizione da uno
        o più Pokémon il danno aumenta.
