        たたみかける　ように　こうげきする。
        じょうたい　いじょうの　あいてに
        おおきな　ダメージを　あたえる。
      ja: |-
        たたみかける　ように　攻撃する。
        状態異常の　相手に
        大きな　ダメージを　与える。
      ko: |-
        엎친 데 덮친 격으로 공격한다.
        상태 이상인 상대에게
        큰 데미지를 준다.
      en: |-
        This relentless attack does massive
        damage to a target affected
        by status conditions.
      fr: |-
        Attaque acharnée qui cause davantage de dégâts
        à l’ennemi s’il a un problème de statut.
      de: |-
        Eine Attacke, bei der der Anwender das Ziel
        bedrängt. Fügt Zielen mit Statusproblemen
        hohen Schaden zu.
      es: |-
        Ataque que causa un gran daño a los objetivos
        que sufren problemas de estado.
      it: |-
        Attacco che causa un danno enorme se il bersaglio
        ha problemi di stato.
