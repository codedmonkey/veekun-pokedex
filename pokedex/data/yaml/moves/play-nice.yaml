play-nice:
  accuracy: ~
  changelog: {  }
  contest_effect: ~
  contest_type: ~
  damage_class: status
  effect: move-effect-357
  effect_chance: 100
  flags:
    - reflectable
    - mirror
    - authentic
  flavor_text:
    x-y:
      ja-Hrkt: |-
        あいてと　なかよくなって
        たたかう　きりょくを　うしなわせ
        あいての　こうげきを　さげる。
      ja: |-
        相手と　仲良くなって
        戦う　気力を　失わせ
        相手の　攻撃を　さげる。
      ko: |-
        상대와 친해져서
        싸울 마음을 잃게 하여
        상대의 공격을 떨어뜨린다.
      en: |-
        The user and the target become friends,
        and the target loses its will to fight.
        This lowers the target’s Attack stat.
      fr: |-
        L’ennemi se lie d’amitié avec le lanceur et perd
        sa combativité, diminuant son Attaque.
      de: |-
        Der Anwender schließt mit dem Ziel Freundschaft
        und nimmt ihm seine Angriffslust. Der Angriffs-Wert
        des Zieles sinkt.
      es: |-
        Se hace amigo de su oponente y consigue que a
        este se le quiten las ganas de combatir. Además,
        reduce su Ataque.
      it: |-
        Chi la usa diventa amico del bersaglio,
        rabbonendolo e riducendone così l’Attacco.
