        in which Pokémon’s held items
        lose their effects for five turns.
    x-y:
      ja-Hrkt: |-
        まかふしぎな　くうかんを　つくる。
        ５ターンのあいだ　すべてのポケモンの
        どうぐの　こうかが　なくなる。
      ja: |-
        まか不思議な　空間を　つくる。
        ５ターンのあいだ　すべてのポケモンの
