  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        Ｚパワーで　あくの　エネルギーを　あつめ
        ぜんりょくで　あいてを　すいよせる。
        もとになった　わざで　いりょくが　かわる。
      ja: |-
        Ｚパワーで　悪の　エネルギーを　集め
        全力で　相手を　吸いよせる。
        元になった　技で　威力が　変わる。
      ko: |-
        Z파워로 어둠의 에너지를 모아
        전력으로 상대를 끌어당긴다.
        원래 기술에 따라 위력이 변한다.
      zh-Hant: |-
        透過Ｚ力量收集惡能量，
        全力將對手吸入。
        威力會隨原本的招式而改變。
      zh-Hans: |-
        通过Ｚ力量收集恶能量，
        全力将对手吸入。
        威力会根据原来的招式而改变。
      en: |-
        The user gathers dark energy using its Z-Power
        and sucks the target into it. The power varies,
        depending on the original move.
      fr: |-
        Le Pokémon utilise la Force Z pour rassembler
        l’énergie négative et y aspirer l’adversaire. La
        puissance varie selon celle de la capacité originale.
      de: |-
        Der Anwender sammelt mit Z-Kraft dunkle Energie
        an, die das Ziel verschlingt. Die Stärke variiert je
        nach zugrunde liegender Attacke.
      es: |-
        El usuario emplea el Poder Z para generar un agujero
        negro que absorbe al objetivo. Su potencia depende
        de la del movimiento original.
      it: |-
        Chi la usa si serve del Potere Z per concentrare
        energia negativa con cui inghiotte il bersaglio. La
        potenza varia a seconda della mossa su cui si basa.
