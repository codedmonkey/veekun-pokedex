    sword-shield:
      ja-Hrkt: |-
        あたまを　さげる　ふりを　しながら
        ふりみだした　かみのけを　つきさす。
        こうげきは　かならず　めいちゅうする。
      ja: |-
        頭を　下げる　ふりを　しながら
        振りみだした　髪の毛を　突き刺す。
        攻撃は　必ず　命中する。
      ko: |-
        고개를 숙이는 척하면서
        흐트러진 머리카락으로 찌른다.
        공격은 반드시 명중한다.
      zh-Hant: |-
        假裝低頭道歉，
        用凌亂的頭髮刺向對手。
        攻擊必定會命中。
      zh-Hans: |-
        装作低头认错的样子，
        用凌乱的头发进行突刺。
        攻击必定会命中。
      en: |-
        The user pretends to bow its head, but then it stabs the
        target with its disheveled hair. This attack never misses.
      fr: |-
        Le lanceur fait semblant de se prosterner et utilise
        ses cheveux pour poignarder sa cible.
        Touche à tous les coups.
      de: |-
        Der Anwender tut so, als würde er sich verneigen, und
        sticht dann mit seinem zerzausten Fell zu. Diese Attacke
        trifft immer.
      es: |-
        El usuario finge hacer una reverencia y aprovecha la
        ocasión para ensartar al objetivo con su cabello
        alborotado. Siempre acierta.
      it: |-
        Chi la usa finge di abbassare la testa a mo’ di supplica
        e attacca il bersaglio con i suoi capelli scarmigliati.
        Questa mossa va sempre a segno.
