  flavor_text:
    x-y:
      ja-Hrkt: |-
        おたけびを　あげて
        あいてを　いかくし　あいての
        こうげきと　とくこうを　さげる。
      ja: |-
        おたけびを　あげて
        相手を　威嚇し　相手の
        攻撃と　特攻を　さげる。
      ko: |-
        우렁차게 부르짖어서
        상대를 위협하여 상대의 공격과
        특수공격을 떨어뜨린다.
      en: |-
        Letting out a noble roar, the user
        intimidates the target and lowers
        its Attack and Sp. Atk stats.
      fr: |-
        Le lanceur pousse un rugissement qui intimide
        l’ennemi et diminue son Attaque et son Attaque
        Spéciale.
      de: |-
        Der Anwender stößt ein Kampfgebrüll aus,
        das das Ziel einschüchtert und zugleich seinen
        Angriffs- und Spezial-Angriffs-Wert senkt.
      es: |-
        Intimida a su oponente con un rugido de guerra,
        haciendo que disminuyan tanto su Ataque como
        su Ataque Especial.
      it: |-
        Chi la usa emette un urlo potente che intimidisce
        il bersaglio, riducendone l’Attacco e l’Attacco
        Speciale.
