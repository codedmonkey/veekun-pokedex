    x-y:
      ja-Hrkt: |-
        あいての　うごきを　こころで　かんじて
        つぎの　こうげきが　かならず
        あいてに　あたるように　する。
      ja: |-
        相手の　動きを　心で　感じて
        次の　攻撃が　必ず
        相手に　当たるように　する。
      ko: |-
        상대의 움직임을 마음으로 읽고
        다음 공격이 반드시
        상대에게 명중되게 한다.
      en: |-
        The user senses the target’s movements
        with its mind to ensure its next
        attack does not miss the target.
      fr: |-
        Le lanceur analyse les mouvements de l’ennemi
        pour être sûr de toucher au coup suivant.
      de: |-
        Ahnt Bewegungen des Zieles voraus,
        um zu gewährleisten, dass die nächste
        eigene Attacke trifft.
      es: |-
        El usuario adivina los movimientos del objetivo
        para hacer que su siguiente ataque no falle.
      it: |-
        Chi la usa prevede i movimenti del bersaglio
        per mandare a segno l’attacco successivo.
