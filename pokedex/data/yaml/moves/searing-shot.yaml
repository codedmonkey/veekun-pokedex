  flavor_text:
    black-white:
      en: |-
        An inferno of scarlet flames torches
        everything around the user. It may
        leave targets with a burn.
      fr: |-
        Des flammes rougeoyantes s’abattent
        sur tous les Pokémon autour du lanceur.
        Peut aussi brûler.
    black-2-white-2:
      en: |-
        An inferno of scarlet flames torches
        everything around the user. It may
        leave targets with a burn.
    x-y:
      ja-Hrkt: |-
        まっかな　ほのおで　じぶんの
        まわりに　いるものを　こうげきする。
        やけど　じょうたいに　することが　ある。
      ja: |-
        真っ赤な　炎で　自分の
        周りに　いるものを　攻撃する。
        やけど状態に　することが　ある。
      ko: |-
        새빨간 불꽃으로 자신의
        주위에 있는 포켓몬을 공격한다.
        화상 상태로 만들 때가 있다.
      en: |-
        The user torches everything around it
        with an inferno of scarlet flames.
        This may also leave those hit with a burn.
      fr: |-
        Des boules de feu s’abattent sur tous les Pokémon
        autour du lanceur. Peut aussi les brûler.
      de: |-
        Greift alles in seiner Umgebung mit tiefroten
        Flammen an. Ziel kann Verbrennungen erleiden.
      es: |-
        Un infierno de llamas daña a los Pokémon
        adyacentes en combate. Puede quemar.
      it: |-
        Chi la usa lancia fiamme scarlatte su tutti i Pokémon
        nelle vicinanze, danneggiandoli. Può anche scottarli.
