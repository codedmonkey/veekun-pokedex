        いやな　おとを　きかせる。
        あいての　とくぼうを　がくっと　さげる。
      ja: |-
        金属を　こすって　でるような
        いやな　音を　聞かせる。
        相手の　特防を　がくっと　さげる。
      ko: |-
        금속을 긁을 때 나는 듯한
        싫은 소리를 들려준다.
        상대의 특수방어를 크게 떨어뜨린다.
      en: |-
