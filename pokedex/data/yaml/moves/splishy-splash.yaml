splishy-splash:
  accuracy: 100
  changelog: {  }
  contest_effect: ~
  contest_type: ~
  damage_class: special
  effect: move-effect-1
  effect_chance: 30
  flags:
    - protect
    - mirror
  flavor_text:
    lets-go-pikachu-lets-go-eevee:
      ja-Hrkt: |-
        おおきな　なみに　でんきを　あびせ
        あいてに　ぶつけて　こうげきする。
        まひ　じょうたいに　することが　ある。
      ja: |-
        大きな　波に　電気を　あびせ
        相手に　ぶつけて　攻撃する。
        まひ状態に　することが　ある。
      ko: |-
        커다란 파도에 전기를 날리고
        상대에게 부딪쳐서 공격한다.
        마비 상태로 만들 때가 있다.
      zh-Hant: |-
        在巨浪中注入電力，
        撞向對手進行攻擊。
        有時會讓對手陷入麻痺狀態。
      zh-Hans: |-
        往巨浪中注入电能后
        冲撞对手进行攻击。
        有时会让对手陷入麻痹状态。
      en: |-
        The user charges a huge wave with electricity and
        hits the opposing Pokémon with the wave. This may
        also leave the opposing Pokémon with paralysis.
      fr: |-
        Pikachu frappe l’adversaire avec une vague géante
        chargée d’électricité. Peut aussi paralyser l’ennemi.
      de: |-
        Pikachu greift das Ziel mit einer großen, elektrisch
        aufgeladenen Welle an. Das Ziel wird eventuell
        paralysiert.
      es: |-
        Golpea al adversario con una ola gigante electrificada,
        que también puede paralizarlo.
      it: |-
        Colpisce il bersaglio con un’enorme onda caricata
        di elettricità che può anche paralizzarlo.
    sword-shield:
      ja-Hrkt: |-
        このわざは　つかえません
        おもいだすことが　できなくなりますが
        わざを　わすれることを　おすすめします
      ja: |-
        この技は　使えません
        思い出すことが　できなくなりますが
        技を　忘れることを　おすすめします
      ko: |-
        사용할 수 없는 기술입니다.
        다시 배우게 할 수 없지만
        기술을 잊게 하는 것을 권장합니다.
      zh-Hant: |-
        無法使用此招式。
        雖然忘記後將無法再想起來，
        但還是建議忘記此招式。
      zh-Hans: |-
        无法使用这个招式。
        虽然忘记之后就再也想不起来了，
        但还是建议忘记这个招式。
      en: |-
        This move can’t be used.
        It’s recommended that this move is forgotten.
        Once forgotten, this move can’t be remembered.
      fr: |-
        Cette capacité ne peut pas être utilisée.
        Il est recommandé de l’oublier, même s’il sera
        impossible de se la remémorer une fois oubliée.
      de: |-
        Diese Attacke kann nicht eingesetzt werden. Du solltest
        dein Pokémon sie vergessen lassen. Beachte aber,
        dass es sich danach nicht wieder an sie erinnern kann.
      es: |-
        Este movimiento no se puede usar, por lo que sería
        mejor olvidarlo, aunque eso implique que no se pueda
        recordar posteriormente.
      it: |-
        Questa mossa non può essere usata.
        È consigliabile farla dimenticare al Pokémon. Tuttavia,
        una volta dimenticata, non potrà più essere ricordata.
  generation: generation-vii
  meta:
    min_hits: ~
    max_hits: ~
    min_turns: ~
    max_turns: ~
    drain: 0
    healing: 0
    crit_rate: 0
    ailment_chance: 30
    flinch_chance: 0
    stat_chance: 0
    meta_ailment: paralysis
    meta_category: damage+ailment
    stat_changes: {  }
  name:
    ja-Hrkt: ざぶざぶサーフ
    ja: ざぶざぶサーフ
    ko: 참방참방서핑
    zh-Hant: 滔滔衝浪
    zh-Hans: 滔滔冲浪
    en: 'Splishy Splash'
    fr: Pika-Splash
    de: Plätschersurfer
    es: Salpikasurf
    it: Surfasplash
  power: 90
  pp: 15
  priority: 0
  super_contest_effect: ~
  target: all-opponents
  type: water
