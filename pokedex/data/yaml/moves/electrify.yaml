  flavor_text:
    x-y:
      ja-Hrkt: |-
        あいてが　わざを　だすまえに
        そうでん　すると　そのターン
        あいての　わざは　でんきタイプになる。
      ja: |-
        相手が　技を　だす前に
        そうでん　すると　そのターン
        相手の　技は　でんきタイプになる。
      ko: |-
        상대가 기술을 쓰기 전에
        송전하면 그 턴에 상대가
        사용하는 기술은 전기타입이 된다.
      en: |-
        If the target is electrified before it uses
        a move during that turn, the target’s
        move becomes Electric type.
      fr: |-
        Si le lanceur attaque avant l’ennemi, les capacités
        de ce dernier seront de type Électrik jusqu’à la fin
        du tour.
      de: |-
        Kommt die Attacke zum Einsatz, bevor das Ziel
        seine Attacke ausführt, nimmt diese für die Dauer
        dieser Runde den Typ Elektro an.
      es: |-
        Si el Pokémon objetivo queda electrificado antes
        de usar un movimiento, este será de tipo Eléctrico.
      it: |-
        Se si contagia il bersaglio prima che usi la sua mossa,
        per quel turno le sue mosse saranno di tipo Elettro.
