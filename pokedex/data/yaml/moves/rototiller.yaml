rototiller:
  accuracy: ~
  changelog: {  }
  contest_effect: ~
  contest_type: ~
  damage_class: status
  effect: move-effect-340
  effect_chance: 100
  flags:
    - distance
    - non-sky-battle
  flavor_text:
    x-y:
      ja-Hrkt: |-
        じめんを　たがやして　くさきが
        そだちやすいようにする。くさタイプの
        こうげきと　とくこうが　あがる。
      ja: |-
        地面を　耕して　草木が
        育ちやすいようにする。くさタイプの
        攻撃と　特攻が　あがる。
      ko: |-
        땅을 일구어 초목이
        자라기 쉽게 한다. 풀타입의
        공격과 특수공격이 오른다.
      en: |-
        Tilling the soil, the user makes it easier
        for plants to grow. This raises the Attack
        and Sp. Atk stats of Grass-type Pokémon.
      fr: |-
        Laboure le sol et le rend plus fertile.
        Augmente l’Attaque et l’Attaque Spéciale des
        Pokémon de type Plante.
      de: |-
        Der Anwender pflügt den Boden und macht
        die Erde fruchtbarer. Erhöht den Angriff und
        den Spezial-Angriff von Pflanzen-Pokémon.
      es: |-
        Labra la tierra haciendo que sea más fácil cultivarla
        y consigue que aumente el Ataque y el Ataque
        Especial de los Pokémon de tipo Planta.
      it: |-
        Chi la usa dissoda la terra per far crescere meglio
        l’erba. Questa mossa aumenta l’Attacco e
        l’Attacco Speciale dei Pokémon di tipo Erba.
