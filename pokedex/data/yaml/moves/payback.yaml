    black-2-white-2:
      en: |-
        If the user moves after the target,
        this attack’s power will be doubled.
    x-y:
      ja-Hrkt: |-
        ためこんで　こうげきする。
        あいてより　あとに　こうげき　できると
        わざの　いりょくは　２ばいに　なる。
      ja: |-
        ためこんで　攻撃する。
        相手より　あとに　攻撃できると
        技の　威力は　２倍に　なる。
      ko: |-
        모아서 공격한다.
        상대보다 뒤에 공격할 수 있으면
        기술의 위력은 2배가 된다.
      en: |-
        The user stores power, then attacks.
        If the user moves after the target,
        this attack’s power will be doubled.
      fr: |-
        Le lanceur charge son énergie, puis attaque.
        La puissance est doublée si le lanceur agit après
        l’ennemi.
      de: |-
        Der Anwender lädt die Attacke auf.
        Handelt das Ziel vor dem Anwender,
        verdoppelt sich die Kraft der Attacke.
      es: |-
        El usuario contraataca con el doble de fuerza si el
        objetivo usa un movimiento antes.
      it: |-
        Chi la usa accumula forza, poi attacca. La potenza
        raddoppia se agisce dopo il Pokémon colpito.
