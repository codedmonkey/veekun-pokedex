        じぶんの　ＨＰが　すくないほど
        わざの　いりょくは　あがる。
      ja: |-
        じたばた　暴れて　攻撃する。
        自分の　ＨＰが　少ないほど
        技の　威力は　あがる。
      ko: |-
        바둥바둥 난동 부려서 공격한다.
        자신의 HP가 적을수록
        기술의 위력이 올라간다.
      en: |-
        The user flails about aimlessly to attack.
        The less HP the user has,
        the greater the move’s power.
      fr: |-
        Le lanceur fait tournoyer son fléau.
        Plus ses PV sont bas, plus l’attaque est puissante.
      de: |-
        Attacke richtet mehr Schaden an,
        wenn eigene KP niedrig sind.
      es: |-
        Ataque frenético. Cuantos menos PS tenga el
        usuario, más daño producirá.
      it: |-
        Chi la usa si dimena per attaccare. È più efficace
        se i suoi PS sono bassi.
