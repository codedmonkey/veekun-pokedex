super-luck:
  changelog: {  }
  effect:
    en: "This Pokémon's moves have [critical hit]{mechanic:critical-hit} rates one stage higher than normal."
    de: 'Die [kritische Treffer]{mechanic:critical-hit}rate von Attacken von Pokémon mit dieser Fähigkeit sind eine Stufe höher als normal.'
  flavor_text:
    diamond-pearl:
      en: |-
        Heightens the critical-hit
        ratios of moves.
    platinum:
      en: |-
        Heightens the critical-hit
        ratios of moves.
    heartgold-soulsilver:
