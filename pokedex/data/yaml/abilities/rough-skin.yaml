rough-skin:
  changelog:
    diamond-pearl:
      effect:
        en: "Inflicts only 1/16 of the attacker's maximum [HP]{mechanic:hp} in damage."
        de: 'Verursacht nur 1/16 der maximalen []{mechanic:hp} des Angreifers Schaden.'
  effect:
    en: |-
      Whenever a move makes contact with this Pokémon, the move's user takes 1/8 of its maximum [HP]{mechanic:hp} in damage.

      This ability functions identically to []{ability:iron-barbs}.
    de: |-
      Wenn eine gegnerische Attacke Kontakt mit einem Pokémon mit dieser Fähigkeit hat, erleidet der Angreifer 1/8 seiner maximalen []{mechanic:hp} Schaden.

      Diese Fähigkeit ist identisch mit []{ability:iron-barbs}.
  flavor_text:
    ruby-sapphire:
      en: 'Hurts to touch.'
    emerald:
      en: 'Hurts to touch.'
    firered-leafgreen:
      en: 'Hurts to touch.'
    diamond-pearl:
      en: |-
        Inflicts damage to the
        foe on contact.
    platinum:
      en: |-
        Inflicts damage to the
        foe on contact.
    heartgold-soulsilver:
      en: |-
        Inflicts damage to the
        foe on contact.
    black-white:
      en: |-
        Inflicts damage to the
        attacker on contact.
      fr: |-
        Le Pokémon blesse
        l’ennemi qui le touche.
    black-2-white-2:
      en: |-
        Inflicts damage to the
        attacker on contact.
    x-y:
      ja-Hrkt: |-
        ふれた　あいてを
        キズつける。
      ja: |-
        触れた　相手を
        キズつける。
      ko: |-
        접촉한 상대에게
        상처를 입힌다.
      en: |-
        Inflicts damage to the
        attacker on contact.
      fr: |-
        Blesse l’attaquant au
        moindre contact.
      de: 'Verletzt Angreifer bei Berührung.'
      es: 'Hiere al tacto.'
      it: |-
        Il nemico che manda a segno una
        mossa fisica viene danneggiato.
    omega-ruby-alpha-sapphire:
      ja-Hrkt: |-
        ふれた　あいてを
        キズつける。
      ja: |-
        触れた　相手を
        キズつける。
      ko: |-
        접촉한 상대에게
        상처를 입힌다.
      en: |-
        Inflicts damage to the
        attacker on contact.
      fr: |-
        Blesse l’attaquant au moindre
        contact.
      de: 'Verletzt Angreifer bei Berührung.'
      es: 'Hiere al hacer contacto.'
      it: |-
        Se chi attacca mette a segno una    
        mossa fisica, viene danneggiato.
    sun-moon:
      ja-Hrkt: |-
        こうげきを　うけたとき
        じぶんに　ふれた　あいてを
        ざらざらの　はだで　キズつける。
      ja: |-
        攻撃を　受けたとき
        自分に　触れた　相手を
        ざらざらの　肌で　キズつける。
      ko: |-
        공격을 받았을 때
        자신에게 접촉한 상대를
        까칠까칠한 피부로 상처를 입힌다.
      zh-Hant: |-
        受到攻擊時，
        用粗糙的皮膚弄傷
        接觸到自己的對手。
      zh-Hans: |-
        受到攻击时，
        用粗糙的皮肤弄伤
        接触到自己的对手。
      en: |-
        This Pokémon inflicts damage with its rough skin
        to the attacker on contact.
      fr: |-
        Blesse l’attaquant lorsque le Pokémon subit
        une attaque directe.
      de: |-
        Angreifer werden durch die raue Haut des Pokémon
        bei direkten Attacken verletzt.
      es: |-
        Hiere con su piel áspera al rival que lo ataque con un
        movimiento de contacto.
      it: |-
        Se il Pokémon è colpito da un attacco diretto, grazie
        alla sua pelle ruvida infligge danni a sua volta.
