sap-sipper:
  changelog: {  }
  effect:
    en: 'Whenever a []{type:grass}-type move hits this Pokémon, its [Attack]{mechanic:attack} rises one [stage]{mechanic:stat-modifier}, negating any other effect on it.'
    de: 'Wenn ein Pokémon mit dieser Fähigkeit von einer []{type:grass} Attacke getroffen wird, steigt sein []{mechanic:attack} um 1 [Stufe]{mechanic:stat-modifier}, wobei jeder andere Effekt entfernt wird.'
  flavor_text:
    black-white:
      en: |-
        Boosts Attack when hit by
        a Grass-type move.
      fr: |-
        Augmente l’Attaque après
        une attaque Plante.
    black-2-white-2:
      en: |-
        Boosts Attack when hit by
        a Grass-type move.
    x-y:
      ja-Hrkt: |-
        くさの　わざを　うけると
        こうげきが　あがる。
      ja: |-
        くさの　技を　受けると
        攻撃が　あがる。
      ko: |-
        풀 기술을 받으면
        공격이 올라간다.
      en: |-
        Boosts the Attack stat when hit
        by a Grass-type move.
      fr: |-
        Neutralise les attaques Plante et
        augmente l’Attaque.
      de: |-
        Absorbiert Pflanzen-Attacken
        und steigert den Angriff.
      es: |-
        Neutraliza los movimientos de
        tipo Planta y sube el Ataque.
      it: |-
        Neutralizza le mosse di tipo Erba
        subite per aumentare l’Attacco.
