rivalry:
  changelog: {  }
  effect:
    en: |-
      This Pokémon inflicts 1.25× as much [regular damage]{mechanic:regular-damage} against Pokémon of the same gender and 0.75× as much regular damage against Pokémon of the opposite gender.

      If either Pokémon is genderless, damage is unaffected.
    de: |-
      Ein Pokémon mit dieser Fähigkeit verurascht gegen Gegner vom gleichen Geschlecht 25% mehr [Schaden]{mechanic:regular-damage} und gegen Pokémon vom anderen Geschlecht 25% weniger Schaden.

      Wenn eins der Pokémon geschlechtslos ist, wird der Schaden nicht beeinflusst.
