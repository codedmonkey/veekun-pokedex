dry-skin:
  changelog: {  }
  effect:
    en: 'This Pokémon takes 1/8 of its maximum HP in damage after each turn during [strong sunlight]{mechanic:strong-sunlight}, but it heals for 1/8 of its HP each turn during [rain]{mechanic:rain}.  This Pokémon takes 1.25× as much damage from []{type:fire}-type moves, but whenever a []{type:water} move hits it, it heals for 1/4 its maximum HP instead.'
    de: 'Pokémon mit dieser Fähigkeit nehmen 1/8 ihrer maximalen []{mechanic:hp} Schaden nach jeder Runde mit [starkem Sonnenlicht]{mechanic:strong-sunlight}, aber sie heilen 1/8 ihrer maximalen []{mechanic:hp} nach jeder Runde in der es [regnet]{mechanic:rain}. Sie nehmen außerdem 1,25× so viel Schaden von []{type:fire} Attacken, absorbieren aber dafür []{type:water} Attacken und heilen dabei 1/4 ihrer maximalen []{mechanic:hp}.'
  flavor_text:
    diamond-pearl:
      en: |-
        Reduces HP if it is hot.
        Water restores HP.
    platinum:
      en: |-
        Reduces HP if it is hot.
        Water restores HP.
    heartgold-soulsilver:
      en: |-
        Reduces HP if it is hot.
        Water restores HP.
    black-white:
      en: |-
        Reduces HP if it is hot.
        Water restores HP.
      fr: |-
        Perd des PV à la chaleur.
        L’eau les restaure.
    black-2-white-2:
      en: |-
        Reduces HP if it is hot.
        Water restores HP.
    x-y:
      ja-Hrkt: |-
        あついと　ＨＰが　へる。
        みずで　ＨＰを　かいふく。
      ja: |-
        あついと　ＨＰが　減る。
        みずで　ＨＰを　回復。
      ko: |-
        더우면 HP가 줄어든다.
        물로 HP를 회복한다.
      en: |-
        Reduces HP if it’s hot.
        Water restores HP.
      fr: |-
        Perd des PV à la chaleur.
        L’eau les restaure.
      de: |-
        Bei heißem Wetter verliert das
        Pokémon KP. Wasser heilt KP.
      es: |-
        Pierde PS si hace calor. Los
        recupera con agua.
      it: |-
        Riduce i PS se fa caldo.
        In presenza di acqua, ridà PS.
    omega-ruby-alpha-sapphire:
      ja-Hrkt: |-
        あついと　ＨＰが　へる。
         ずで　ＨＰを　かいふく。
      ja: |-
        あついと　ＨＰが　減る。
         ずで　ＨＰを　回復。
      ko: |-
        더우면 HP가 줄어든다.
        물로 HP를 회복한다.
      en: |-
        Reduces HP if it’s hot.
        Water restores HP.
      fr: |-
        Perd des PV à la chaleur.
        L’eau les restaure.
      de: |-
        Bei heißem Wetter verliert das
        Pokémon KP. Wasser heilt KP.
      es: |-
        Pierde PS si hace calor. Los
        recupera con agua.
      it: |-
        Riduce i PS se fa caldo.
        In presenza di acqua, ridà PS.
    sun-moon:
      ja-Hrkt: |-
        てんきが　あめのときや　みずタイプの
        わざで　ＨＰが　かいふくし　はれのときや
        ほのおタイプの　わざで　へってしまう。
      ja: |-
        天気が　雨の時や　みずタイプの
        技で　ＨＰが　回復し　はれの時や
        ほのおタイプの　技で　減ってしまう。
      ko: |-
        비가 오는 날씨나 물타입의
        기술로 HP가 회복되고
        맑을 때나 불꽃타입의 기술로는 줄어든다.
      zh-Hant: |-
        下雨天氣時和受到水屬性的招式攻擊時，
        HP會回復。晴朗天氣時和受到火屬性的
        招式攻擊時，ＨＰ會減少。
      zh-Hans: |-
        下雨天气时和受到水属性的招式时，
        ＨＰ会回复。晴朗天气时和受到火属性的
        招式时，ＨＰ会减少。
      en: |-
        Restores HP in rain or when hit by Water-type
        moves. Reduces HP in sunshine, and increases the
        damage received from Fire-type moves.
      fr: |-
        Le Pokémon regagne des PV sous la pluie ou s’il
        est touché par une capacité Eau, mais il déteste
        les capacités Feu ou quand le soleil brille.
      de: |-
        Bei Sonnenschein verliert das Pokémon KP und der
        Schaden durch Feuer-Attacken steigt. Bei Regen und
        Treffern durch Wasser-Attacken regeneriert es KP.
      es: |-
        Pierde PS si hace sol y los recupera si llueve o recibe
        un movimiento de tipo Agua. Los movimientos de tipo
        Fuego, por su parte, le hacen más daño de lo normal.
      it: |-
        Il Pokémon recupera PS se piove o se subisce
        mosse di tipo Acqua, ma con la luce solare intensa
        perde PS. Subisce più danni da mosse di tipo Fuoco.
