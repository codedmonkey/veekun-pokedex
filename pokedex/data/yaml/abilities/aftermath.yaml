    black-2-white-2:
      en: |-
        Damages the attacker
        landing the finishing hit.
    x-y:
      ja-Hrkt: |-
        ひんしの　ときに　ふれた
        あいてに　ダメージ。
      ja: |-
        ひんしの　ときに　触れた
        相手に　ダメージ。
      ko: |-
        기절할 때 스친
        상대에게 데미지를 준다.
      en: |-
        Damages the attacker
        landing the finishing hit.
      fr: |-
        Blesse l’attaquant qui porte
        le coup de grâce.
      de: |-
        Fügt einem Angreifer, der das
        Pokémon besiegt, Schaden zu.
      es: |-
        Daña al agresor que le ha dado el
        golpe de gracia.
      it: |-
        Arreca danni al Pokémon che
        sferra il colpo finale.
