aftermath:
  changelog: {  }
  effect:
    en: "When this Pokémon is knocked out by a move that makes contact, the move's user takes 1/4 its maximum [HP]{mechanic:hp} in damage."
    de: 'Wenn ein Pokémon mit dieser Fähigkeit von einer Attacke mit Kontakt besiegt wird, erleidet der Anwender 1/4 seiner maximalen []{mechanic:hp} Schaden.'
  flavor_text:
    diamond-pearl:
      en: |-
        Damages the foe landing
        the finishing hit.
    platinum:
      en: |-
        Damages the foe landing
        the finishing hit.
    heartgold-soulsilver:
      en: |-
        Damages the foe landing
        the finishing hit.
    black-white:
      en: |-
        Damages the attacker
        landing the finishing hit.
      fr: |-
