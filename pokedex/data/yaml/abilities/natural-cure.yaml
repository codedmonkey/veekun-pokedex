natural-cure:
  changelog: {  }
  effect:
    en: |-
      This Pokémon is cured of any [major status ailment]{mechanic:major-status-ailment} when it is switched out for another Pokémon.

      If this ability is acquired during battle, the Pokémon is cured upon leaving battle before losing the temporary ability.
    de: |-
      Wenn ein Pokémon mit dieser Fähigkeit ausgewechselt wird, wird es von einer etwaigen []{mechanic:major-status-ailment} geheilt.

      Wenn diese Fähigkeit während des Kampfes erlangt wird, wird das Pokémon beim Auswechseln geheilt, bevor es die Fähigkeit wieder verliert.
