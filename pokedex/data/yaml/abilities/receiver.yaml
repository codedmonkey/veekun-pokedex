receiver:
  changelog: {  }
  effect:
    en: 'When an ally faints, this Pokémon gains its Ability.'
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        たおされた　みかたの　とくせいを
        うけついで　おなじ　とくせいに　なる。
      ja: |-
        倒された　味方の　特性を
        受け継いで　同じ　特性に　なる。
      ko: |-
        쓰러진 같은 편의 특성을
        이어받아 같은 특성이 된다.
      zh-Hant: |-
        繼承被打倒的同伴的特性，
        變為相同的特性。
      zh-Hans: |-
        继承被打倒的同伴的特性，
        变为相同的特性。
      en: 'The Pokémon copies the Ability of a defeated ally.'
      fr: 'Le Pokémon reçoit le talent d’un allié mis K.O.'
      de: |-
        Wird einer seiner Mitstreiter besiegt, erhält es
        dessen Fähigkeit.
      es: 'Adquiere la habilidad de un aliado debilitado.'
      it: |-
        Il Pokémon acquisisce l’abilità di un alleato
        andato KO.
