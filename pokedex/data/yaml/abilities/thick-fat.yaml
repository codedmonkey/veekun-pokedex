thick-fat:
  changelog: {  }
  effect:
    en: 'This Pokémon takes half as much damage from []{type:fire}- and []{type:ice}-type moves.'
    de: 'Pokémon mit dieser Fähigkeit erhält von []{type:fire} und []{type:ice} Attacken nur halben Schaden.'
  flavor_text:
    ruby-sapphire:
      en: 'Heat-and-cold protection.'
    emerald:
      en: 'Heat-and-cold protection.'
    firered-leafgreen:
      en: 'Heat-and-cold protection.'
    diamond-pearl:
      en: |-
        Raises resistance to Fire-​
        and Ice-type moves.
    platinum:
      en: |-
        Raises resistance to Fire-​
        and Ice-type moves.
    heartgold-soulsilver:
      en: |-
        Ups resistance to Fire-​
        and Ice-type moves.
    black-white:
      en: |-
        Ups resistance to Fire-​
        and Ice-type moves.
      fr: |-
        Augmente la résistance
        aux cap. Feu et Glace.
    black-2-white-2:
      en: |-
        Ups resistance to Fire-​
        and Ice-type moves.
    x-y:
      ja-Hrkt: |-
        ほのおと　こおりタイプの
        わざに　つよい。
      ja: |-
        ほのおと　こおりタイプの
        技に　強い。
      ko: |-
        불꽃과 얼음타입의
        기술에 강하다.
      en: |-
        Boosts resistance to Fire-​
        and Ice-type moves.
      fr: |-
        Augmente la résistance aux
        capacités Feu et Glace.
      de: |-
        Stark gegen Attacken der Typen
        Feuer und Eis.
      es: |-
        Atenúa los ataques de tipo Fuego
        y Hielo.
      it: |-
        Aumenta la resistenza alle mosse
        di tipo Fuoco e Ghiaccio.
    omega-ruby-alpha-sapphire:
      ja-Hrkt: |-
        ほのおと　こおりタイプの
        わざに　つよい。
      ja: |-
        ほのおと　こおりタイプの
        技に　強い。
      ko: |-
        불꽃과 얼음타입의
        기술에 강하다.
      en: |-
        Boosts resistance to Fire-
        and Ice-type moves.
      fr: |-
        Augmente la résistance aux
        capacités Feu et Glace.
      de: |-
        Stark gegen Attacken der Typen
        Feuer und Eis.
      es: |-
        Atenúa los ataques de tipo Fuego
        y Hielo.
      it: |-
        Aumenta la resistenza alle mosse
        di tipo Fuoco e Ghiaccio.
    sun-moon:
      ja-Hrkt: |-
        あつい　しぼうで　まもられているので
        ほのおタイプと　こおりタイプの
        わざの　ダメージを　はんげんさせる。
      ja: |-
        厚い　脂肪で　守られているので
        ほのおタイプと　こおりタイプの
        技の　ダメージを　半減させる。
      ko: |-
        두꺼운 지방으로 보호되고 있어
        불꽃타입과 얼음타입의
        기술의 데미지를 반감시킨다.
      zh-Hant: |-
        被厚厚的脂肪保護著，
        能夠讓火屬性和冰屬性
        招式的傷害減半。
      zh-Hans: |-
        因为被厚厚的脂肪保护着，
        会让火属性和冰属性的招式伤害减半。
      en: |-
        The Pokémon is protected by a layer of thick fat,
        which halves the damage taken from Fire- and
        Ice-type moves.
      fr: |-
        Le Pokémon est protégé par une épaisse couche
        de graisse qui diminue de moitié les dégâts qu’il
        subit des capacités de types Feu et Glace.
      de: |-
        Das Pokémon wird von einer dicken Fettschicht
        geschützt, was den durch Feuer- und Eis-Attacken
        erlittenen Schaden halbiert.
      es: |-
        Gracias a la gruesa capa de grasa que lo protege,
        reduce a la mitad el daño recibido por ataques de
        tipo Fuego y Hielo.
      it: |-
        Il Pokémon è protetto da uno spesso strato
        di grasso che dimezza il danno causato da
        mosse di tipo Fuoco e Ghiaccio.
