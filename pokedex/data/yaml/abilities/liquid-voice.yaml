liquid-voice:
  changelog: {  }
  effect:
    en: "When this Pokémon uses a move that is sound-based, that move's type is Water."
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        すべての　おとわざが
        みずタイプに　なる。
      ja: |-
        すべての　音技が
        みずタイプに　なる。
      ko: |-
        모든 소리 기술이
        물타입이 된다.
      zh-Hant: |-
        所有的聲音招式
        都變為水屬性。
      zh-Hans: |-
        所有的声音招式
        都变为水属性。
      en: 'All sound-based moves become Water-type moves.'
      fr: |-
        Toutes les attaques sonores du Pokémon prennent
        le type Eau.
      de: |-
        Bewirkt, dass alle Lärm-Attacken des Pokémon den
        Typ Wasser annehmen.
      es: |-
        Hace que todos los movimientos del Pokémon
        basados en sonido pasen a ser de tipo Agua.
      it: |-
        Le mosse basate sul suono del Pokémon con questa
        abilità diventano di tipo Acqua.
