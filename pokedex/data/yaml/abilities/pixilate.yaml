pixilate:
  changelog: {  }
  effect:
    en: "Turns the bearer's []{type:normal}-type moves into []{type:fairy} moves.  Moves changed by this ability have 1.3× their power."
    de: 'Die []{type:normal} Attacken von Pokémon mit dieser Fäigkeit werden zu []{type:fairy} Attacken. Attacken die durch diese Fähigkeit beeinflusst werden, haben 1,3× so viel Basisstärke wie sonst.'
  flavor_text:
    x-y:
      ja-Hrkt: |-
        ノーマルタイプの　わざが
        フェアリータイプになる。
      ja: |-
        ノーマルタイプの　技が
        フェアリータイプになる。
      ko: |-
        노말타입의 기술이
        페어리타입이 된다.
      en: |-
        Normal-type moves become
        Fairy-type moves.
      fr: |-
        Les capacités de type Normal
        deviennent de type Fée.
      de: |-
        Attacken vom Typ Normal
        nehmen den Typ Fee an.
      es: |-
        Convierte movimientos de tipo
        Normal en tipo Hada.
      it: |-
        Le mosse di tipo Normale
        diventano di tipo Folletto.
