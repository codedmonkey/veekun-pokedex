    sun-moon:
      ja-Hrkt: |-
        こうかばつぐんに　なってしまう
        こうげきの　いりょくを
        よわめる　ことが　できる。
      ja: |-
        効果バツグンに　なってしまう
        攻撃の　威力を
        弱める　ことが　できる。
      ko: |-
        효과가 굉장한
        공격의 위력을
        약하게 만든다.
      zh-Hant: |-
        受到效果絕佳的攻擊時，
        可減弱其威力。
      zh-Hans: |-
        受到效果绝佳的攻击时，
        可以减弱其威力。
      en: 'Reduces the power of supereffective attacks taken.'
      fr: |-
        Réduit les dégâts subis lorsque le Pokémon
        est touché par une capacité super efficace.
      de: |-
        Reduziert die Stärke von sehr effektiven Attacken
        und verringert damit den Schaden, den das Pokémon
        durch sie erleidet.
      es: |-
        Mitiga el daño que le infligen los movimientos
        supereficaces.
      it: 'Riduce la potenza delle mosse superefficaci subite.'
