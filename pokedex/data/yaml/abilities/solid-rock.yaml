solid-rock:
  changelog: {  }
  effect:
    en: |-
      This Pokémon takes 0.75× as much damage from moves that are [super effective]{mechanic:super-effective} against it.

      This ability functions identically to []{ability:filter}.
    de: |-
      Pokémon mit dieser Fähigkeit erleiden nur 75% des Schadens, der durch Attacken die []{mechanic:super-effective} sind verursacht wurde.

      Die Fähigkeit ist identisch mit []{ability:filter}.
  flavor_text:
    diamond-pearl:
      en: |-
        Powers down super­
        effective moves.
    platinum:
      en: |-
        Powers down super­
        effective moves.
    heartgold-soulsilver:
      en: |-
        Reduces damage from
        supereffective attacks
    black-white:
      en: |-
        Reduces damage from
        supereffective attacks.
      fr: |-
        Affaiblit les capacités
        “super efficaces”.
    black-2-white-2:
      en: |-
        Reduces damage from
        supereffective attacks.
    x-y:
      ja-Hrkt: |-
        こうかばつぐん　のとき
        いりょくを　よわめる。
      ja: |-
        効果バツグン　のとき
        威力を　弱める。
      ko: |-
        효과가 굉장한 기술의
        위력을 약하게 한다.
      en: |-
        Reduces damage from
        supereffective attacks.
      fr: |-
        Réduit les dégâts des capacités
        « super efficaces » subies.
      de: |-
        Senkt die Stärke sehr effektiver
        Attacken.
      es: |-
        Mitiga los movimientos
        supereficaces.
      it: |-
        Riduce la potenza delle mosse
        superefficaci.
