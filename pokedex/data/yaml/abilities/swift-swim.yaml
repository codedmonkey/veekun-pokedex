  effect:
    en: |-
      This Pokémon's [Speed]{mechanic:speed} is doubled during [rain]{mechanic:rain}.

      This bonus does not count as a [stat modifier]{mechanic:stat-modifier}.
    de: |-
      Die []{mechanic:speed} eines Pokémon mit dieser Fähigkeit ist doppelt so hoch wie normal, solange es [regnet]{mechanic:rain}.

      Dieser Bonus zählt nicht als []{mechanic:stat-modifier}.
