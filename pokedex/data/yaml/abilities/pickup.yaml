pickup:
  changelog:
    black-white:
      effect:
        en: 'Has no effect in battle.'
        de: 'Hat im Kampf keinen Effekt.'
        cs: 'Nemá žádný účinek při zápasu.'
  effect:
    en: |-
      At the end of each turn, if another Pokémon consumed or [Flung]{move:fling} a held item that turn, this Pokémon picks up the item if it is not already holding one.  After each battle, this Pokémon has a 10% chance of picking up an item if it is not already holding one.

      The []{item:air-balloon} and []{item:eject-button} cannot be picked up.

      The items that may be found vary by game, and, since Pokémon Emerald, by the Pokémon's level.  This ability is checked after the battle ends, at which point any temporary ability changes have worn off.
    de: |-
      Wenn ein Pokémon mit dieser Fähigkeit nicht bereits ein Item hält und ein anderes Pokémon ein getragenes Item verbraucht oder [wegschleudert]{move:fling}, hebt es das Item am Ende der Runde auf. Nach jedem Kampf besteht eine 10% Chance, dass das Pokémon ein Item aufhebt wenn es nicht bereits eines trägt.

      []{item:air-balloon} und []{item:eject-button} können nicht aufgehoben werden.

      Die gefundenen Items variieren je nach Spiel und, seit Smaragd, dem Level des Pokémons mit dieser Fähigkeit. Die Fähigkeit wird überprüft wenn der Kampf endet und temporär erlangte Fähigkeiten wieder weg sind.
