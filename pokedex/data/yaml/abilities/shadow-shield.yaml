shadow-shield:
  changelog: {  }
  effect:
    en: |-
      When this Pokémon has full HP, regular damage (not fixed damage!) from moves is halved.

      This ability cannot be nullified.
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        ＨＰが　まんたんの　ときに
        うける　ダメージが　すくなくなる。
      ja: |-
        ＨＰが　満タンの　ときに
        受ける　ダメージが　少なくなる。
      ko: |-
        HP가 꽉 찼을 때
        받는 데미지가 줄어든다.
      zh-Hant: |-
        ＨＰ全滿時，
        受到的傷害會變少。
      zh-Hans: |-
        ＨＰ全满时，
        受到的伤害会变少。
      en: |-
        Reduces the amount of damage the Pokémon takes
        while its HP is full.
      fr: |-
        Le Pokémon reçoit moins de dégâts quand ses PV
        sont au maximum.
      de: 'Verringert den erlittenen Schaden bei vollen KP.'
      es: 'Reduce el daño sufrido si los PS están al máximo.'
      it: 'Se i PS sono al massimo, riduce il danno subito.'
