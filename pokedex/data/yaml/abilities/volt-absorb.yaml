volt-absorb:
  changelog:
    diamond-pearl:
      effect:
        en: 'Does not absorb non-damaging []{type:electric} moves, i.e. []{move:thunder-wave}.'
        de: '[]{type:electric}-Attacken die keinen Schaden anrichten, wie []{move:thunder-wave}, werden nicht absorbiert.'
        cs: 'Neabsorbuje nezraňující [elektrické]{type:electric} útoky, např. []{move:thunder-wave}.'
  effect:
    en: |-
      Whenever an []{type:electric}-type move hits this Pokémon, it heals for 1/4 of its maximum [HP]{mechanic:hp}, negating any other effect on it.

      This ability will not take effect if this Pokémon is []{type:ground}-type and thus immune to Electric moves.  Electric moves will ignore this Pokémon's []{move:substitute}.

      This effect includes non-damaging moves, i.e. []{move:thunder-wave}.
    de: |-
      Wenn ein Pokémon mit dieser Fähigkeit von einer []{type:electric} Attacke getroffen wird, wird es um 1/4 seiner maximalen []{mechanic:hp} geheilt. Jeder andere Effekt der Attacke wird ignoriert.

      Die Fähigkeit wirkt nicht, wenn das Pokémon vom Typ []{type:ground} ist. []{type:electric} Attacken ignorieren den []{move:substitute} dieses Pokémons.

      Der Effekt gilt auch für Attacken die keinen Schaden verursachen, wie z.B. []{move:thunder-wave}.
