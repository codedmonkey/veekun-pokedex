        はどうの　わざの
        いりょくが　たかい。
      ja: |-
        はどうの　技の
        威力が　高い。
      ko: |-
        파동 기술의
        위력이 크다.
      en: 'Powers up aura and pulse moves.'
      fr: |-
        Augmente la puissance de
        certaines capacités de type aura.
      de: |-
        Erhöht die Stärke einiger Wellen-,
        Aura- und Puls-Attacken.
      es: |-
        Aumenta la potencia de algunos
        movimientos de pulsos y auras.
      it: |-
        Potenzia le mosse “pulsar”
        e altre come Ondasana.
