gluttony:
  changelog: {  }
  effect:
    en: "This Pokémon eats any held Berry triggered by low [HP]{mechanic:hp} when it falls below 50% of its HP, regardless of the Berry's usual threshold."
    de: 'Pokémon mit dieser Fähigkeit essen eine getragene Beere, wenn sie weniger als die Hälfte ihrer maximalen []{mechanic:hp} haben, unabhängig von der Auslöseschwelle der Beere.'
  flavor_text:
    diamond-pearl:
      en: |-
        Encourages the early use
        of a held Berry.
    platinum:
      en: |-
        Encourages the early use
        of a held Berry.
    heartgold-soulsilver:
      en: |-
        Encourages the early use
        of a held Berry.
    black-white:
      en: |-
        Encourages the early use
        of a held Berry.
      fr: |-
        Encourage l’utilisation
        d’une Baie tenue.
    black-2-white-2:
      en: |-
        Encourages the early use
        of a held Berry.
    x-y:
      ja-Hrkt: |-
        きのみを　いつもより
        はやく　つかう。
      ja: |-
        きのみを　いつもより
        早く　使う。
      ko: |-
        나무열매를 여느 때보다
        빨리 사용한다.
      en: |-
        Makes the Pokémon use a held
        Berry earlier than usual.
      fr: |-
        Permet d’utiliser plus rapidement
        une Baie tenue.
      de: |-
        Ermutigt zum frühzeitigen Einsatz
        von Beeren.
      es: |-
        Fomenta el uso rápido de la baya
        que porte.
      it: |-
        Favorisce l’uso anticipato di
        una bacca tenuta dal Pokémon.
    omega-ruby-alpha-sapphire:
      ja-Hrkt: |-
        きの を　いつもより
        はやく　つかう。
      ja: |-
