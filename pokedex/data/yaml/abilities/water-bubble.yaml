water-bubble:
  changelog: {  }
  effect:
    en: 'When this Pokémon is hit by a Fire move, the damage is halved.  When this Pokémon uses a Water move, the power is doubled. This Pokémon cannot be burned, and if it becomes burned, the burn is immediately cured.'
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        じぶんに　たいする　ほのおタイプの
        わざの　いりょくを　さげる。
        やけど　しない。
      ja: |-
        自分に　対する　ほのおタイプの
        技の　威力を　下げる。
        やけど　しない。
      ko: |-
        자신을 향하는 불꽃타입
        기술의 위력을 떨어뜨린다.
        화상을 입지 않는다.
      zh-Hant: |-
        降低與自己相對的火屬性
        招式的威力，不會灼傷。
      zh-Hans: |-
        降低与自己相对的火属性
        招式的威力，不会灼伤。
      en: |-
        Lowers the power of Fire-type moves done to the
        Pokémon and prevents the Pokémon from getting
        a burn.
      fr: |-
        Réduit les dégâts des capacités de type Feu
        subies par le Pokémon. Il est également immunisé
        contre les brûlures.
      de: |-
        Feuer-Attacken fügen dem Pokémon weniger
        Schaden zu. Verhindert Verbrennungen.
      es: |-
        Reduce el daño que le provocan los movimientos de
        tipo Fuego e impide que sufra quemaduras.
      it: |-
        Riduce la potenza delle mosse di tipo Fuoco
        subite e rende immuni alle scottature.
