stench:
  changelog:
    black-white:
      effect:
        en: 'Has no effect in battle.'
        de: 'Hat im Kampf keinen Effekt.'
        cs: 'Nemá žádný účinek při zápasu.'
  effect:
    en: |-
      This Pokémon's damaging moves have a 10% chance to make the target [flinch]{mechanic:flinch} with each hit if they do not already cause flinching as a secondary effect.

      This ability does not stack with a held item.

      Overworld: The wild encounter rate is halved while this Pokémon is first in the party.
    de: |-
      Attacken die Schaden verursachen haben mit jedem Treffer eine 10% Chance das Ziel [zurückschrecken]{mechanic:flinch} zu lassen, wenn die Attacke dies nicht bereits als Nebeneffekt hat.

      Der Effekt stapelt nicht mit dem von getragenen Items.

      Außerhalb vom Kampf: Wenn ein Pokémon mit dieser Fähigkeit an erster Stelle im Team steht, tauchen wilde Pokémon nur halb so oft auf.
  flavor_text:
