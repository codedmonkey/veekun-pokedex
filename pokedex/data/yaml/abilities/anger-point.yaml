anger-point:
  changelog: {  }
  effect:
    en: |-
      Whenever this Pokémon receives a [critical hit]{mechanic:critical-hit}, its [Attack]{mechanic:attack} rises to the maximum of 6 [stages]{mechanic:stat-modifier}.

      This ability will still take effect if the critical hit is received by a []{move:substitute}.
    de: |-
      Wenn ein Pokémon mit dieser Fähigkeit von einem [kritischen Treffer]{mechanic:critical-hit} getroffen wird, erhöht sich sein []{mechanic:attack} auf die höchste [Stufe]{mechanic:stat-modifier} von 6.

      Die Fähigkeit löst auch aus, wenn der [kritische Treffer]{mechanic:critical-hit} vom []{move:substitute} abgefangen wird.
