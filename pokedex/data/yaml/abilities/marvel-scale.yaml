marvel-scale:
  changelog: {  }
  effect:
    en: |-
      Whenever this Pokémon has a [major status ailment]{mechanic:major-status-ailment}, it has 1.5× its [Defense]{mechanic:defense}.

      This bonus does not count as a [stat modifier]{mechanic:stat-modifier}.
    de: |-
      Wenn ein Pokémon mit dieser Fähigkeit unter einer []{mechanic:major-status-ailment} leidet, hat es eine 1,5× höhere []{mechanic:defense}.

      Der Bonus zählt nicht als [Statuswerte Änderung]{mechanic:stat-modifier}.
