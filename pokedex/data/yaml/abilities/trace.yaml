trace:
  changelog:
    black-white:
      effect:
        en: 'Can copy []{ability:flower-gift} and []{ability:wonder-guard}.'
        de: 'Kann []{ability:flower-gift} und []{ability:wonder-guard} kopieren.'
    diamond-pearl:
      effect:
        en: 'Can copy []{ability:forecast} and []{ability:trace}.'
        de: 'Kann []{ability:forecast} und []{ability:trace} kopieren.'
  effect:
    en: |-
      When this Pokémon enters battle, it copies a random opponent's ability.

      This ability cannot copy []{ability:flower-gift}, []{ability:forecast}, []{ability:illusion}, []{ability:imposter}, []{ability:multitype}, []{ability:trace}, []{ability:wonder-guard}, or []{ability:zen-mode}.
    de: |-
      Wenn ein Pokémon mit dieser Fähigkeit den Kampf betritt, kopiert es die Fähigkeit eines zufällig ausgewählten Gegners.

      []{ability:flower-gift}, []{ability:forecast}, []{ability:illusion}, []{ability:imposter}, []{ability:multitype}, []{ability:trace}, []{ability:wonder-guard} und []{ability:zen-mode} können nicht kopiert werden.
