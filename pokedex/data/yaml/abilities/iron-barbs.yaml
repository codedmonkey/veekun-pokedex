iron-barbs:
  changelog: {  }
  effect:
    en: |-
      Whenever a move makes contact with this Pokémon, the move's user takes 1/8 of its maximum [HP]{mechanic:hp} in damage.

      This ability functions identically to []{ability:rough-skin}.
    de: |-
      Wenn ein Pokémon mit dieser Fähigkeit von einer Attacke mit Kontakt getroffen wird, erleidet der Angreifer 1/8 seiner maximalen []{mechanic:hp} Schaden.

      Diese Fähigkeit ist identisch mit []{ability:rough-skin}.
  flavor_text:
    black-white:
      en: |-
        Inflicts damage to the
        Pokémon on contact.
      fr: |-
        Blesse l’ennemi au moindre
        contact.
    black-2-white-2:
      en: |-
        Inflicts damage to the
        Pokémon on contact.
    x-y:
