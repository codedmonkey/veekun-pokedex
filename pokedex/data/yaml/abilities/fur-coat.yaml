fur-coat:
  changelog: {  }
  effect:
    en: 'Halves damage from physical attacks.'
    de: 'Pokémon mit dieser Fähigkeit erhalten nur den halben Schaden von physischen Attacken.'
  flavor_text:
    x-y:
      ja-Hrkt: |-
        ぶつりわざの　ダメージが
        はんぶんになる。
      ja: |-
        物理技の　ダメージが
        半分になる。
      ko: |-
        물리 기술의 데미지가
        절반이 된다.
      en: |-
        Halves damage from
        physical moves.
      fr: |-
        Divise les dégâts des attaques
        physiques par deux.
      de: |-
        Halbiert den Schaden durch
        physische Attacken.
      es: |-
        Reduce a la mitad el daño
        recibido por ataques físicos.
      it: |-
        Dimezza il danno degli attacchi
        fisici subiti.
