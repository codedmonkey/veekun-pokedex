        威力が　あがる。
      ko: |-
        화상 상태일 때 특수공격의
        위력이 올라간다.
      en: |-
        Powers up special attacks when
        the Pokémon is burned.
      fr: |-
        Booste les attaques spéciales si
        le statut est brûlure.
      de: |-
        Verstärkt bei Verbrennungen
