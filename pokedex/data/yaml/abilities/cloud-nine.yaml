cloud-nine:
  changelog: {  }
  effect:
    en: |-
      While this Pokémon is in battle, [weather]{mechanic:weather} can still be in play, but will not have any of its effects.

      This ability functions identically to []{ability:air-lock}.
    de: |-
      Während ein Pokémon mit dieser Fähigkeit im Kampf ist, kann das []{mechanic:weather} zwar geändert werden, hat aber keinen Effekt.

      Diese Fähigkeit ist identisch mit []{ability:air-lock}.
