gooey:
  changelog: {  }
  effect:
    en: "Lowers attacking Pokémon's Speed by one stage on contact."
    de: 'Wenn ein Pokémon mit dieser Fähigkeit von einer Attacke die Kontakt herstellt getroffen wird, wird die []{mechanic:speed} des Angreifers um 1 [Stufe]{mechanic:stat-modifier} gesenkt.'
  flavor_text:
    x-y:
      ja-Hrkt: |-
        ふれた　あいての
        すばやさを　さげる。
      ja: |-
        触れた　相手の
        素早さを　さげる。
      ko: |-
        접촉한 상대의
        스피드를 떨어뜨린다.
      en: |-
        Contact with the Pokémon
        lowers the attacker’s Speed stat.
      fr: |-
        Diminue la Vitesse de l’attaquant
        qui le touche.
      de: |-
        Die Initiative von Angreifern sinkt
        durch bloßes Berühren.
      es: |-
        Baja la Velocidad del Pokémon
        con el que entra en contacto.
      it: |-
        Riduce la Velocità del Pokémon
        con cui entra in contatto.
    omega-ruby-alpha-sapphire:
