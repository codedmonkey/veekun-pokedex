damp:
  changelog: {  }
  effect:
    en: 'While this Pokémon is in battle, []{move:self-destruct} and []{move:explosion} will fail and []{ability:aftermath} will not take effect.'
    de: 'Wenn sich ein Pokémon mit dieser Fähigkeit im Kampf befindet, schlagen die Attacken []{move:self-destruct} und []{move:explosion} fehl und []{ability:aftermath} hat keinen Effekt.'
  flavor_text:
    ruby-sapphire:
      en: 'Prevents self-destruction.'
    emerald:
      en: 'Prevents self-destruction.'
    firered-leafgreen:
      en: 'Prevents self-destruction.'
    diamond-pearl:
      en: |-
        Prevents combatants from
        self destructing.
    platinum:
      en: |-
        Prevents combatants from
        self destructing.
    heartgold-soulsilver:
      en: |-
        Prevents combatants
        from self-destructing.
    black-white:
      en: |-
        Prevents the use of
        self-destructing moves.
      fr: |-
        Empêche les combattants
        de s’autodétruire.
    black-2-white-2:
      en: |-
        Prevents the use of
        self-destructing moves.
    x-y:
      ja-Hrkt: |-
        だれも　ばくはつが
        できなくなる。
      ja: |-
        だれも　爆発が
        できなくなる。
      ko: |-
        누구도 폭발
        할 수 없게 된다.
      en: |-
        Prevents the use of
        self-destructing moves.
      fr: |-
        Empêche les combattants de
        s’autodétruire.
      de: |-
        Hält alle Pokémon davon ab,
        zu explodieren.
      es: |-
        Evita que un Pokémon pueda
        autodestruirse.
      it: |-
        Impedisce le mosse
        autodistruttive.
