justified:
  changelog: {  }
  effect:
    en: |-
      Whenever a []{type:dark}-type move hits this Pokémon, its [Attack]{mechanic:attack} rises one [stage]{mechanic:stat-modifier}.

      The move is not negated in any way.
    de: |-
      Wenn ein Pokémon mit dieser Fähigkeit von einer []{type:dark} Attacke getroffen wird, wird sein []{mechanic:attack} um 1 [Stufe]{mechanic:stat-modifier} erhöht.

      Die Attacke wird nicht beeinflusst.
  flavor_text:
    black-white:
      en: |-
        Raises Attack when hit by
        a Dark-type move.
      fr: |-
        Monte l’Attaque si une
        att. Ténèbres le touche.
    black-2-white-2:
      en: |-
        Raises Attack when hit by
        a Dark-type move.
    x-y:
      ja-Hrkt: |-
        あくを　うけると
        こうげきが　あがる。
      ja: |-
        あくを　受けると
        攻撃が　あがる。
      ko: |-
        악 기술을 받으면
        공격이 올라간다.
      en: |-
        Boosts the Attack stat when
        it’s hit by a Dark-type move.
      fr: |-
        Monte l’Attaque si une attaque
        Ténèbres le touche.
      de: |-
        Angriff steigt nach Einstecken
        einer Unlicht-Attacke.
      es: |-
        Sube el Ataque al recibir uno de
        tipo Siniestro.
      it: |-
        L’Attacco aumenta se si è
        colpiti da una mossa di tipo Buio.
