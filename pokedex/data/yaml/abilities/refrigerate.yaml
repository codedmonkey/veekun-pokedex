refrigerate:
  changelog: {  }
  effect:
    en: "Turns the bearer's []{type:normal}-type moves into []{type:ice}-type moves.  Moves changed by this ability have 1.3× their power."
    de: 'Die []{type:normal} Attacken von Pokémon mit dieser Fäigkeit werden zu []{type:ice} Attacken. Attacken die durch diese Fähigkeit beeinflusst werden, haben 1,3× so viel Basisstärke wie sonst.'
  flavor_text:
    x-y:
      ja-Hrkt: |-
        ノーマルタイプの　わざが
        こおりタイプになる。
      ja: |-
        ノーマルタイプの　技が
        こおりタイプに　なる。
      ko: |-
        노말타입의 기술이
        얼음타입이 된다.
      en: |-
        Normal-type moves become
        Ice-type moves.
      fr: |-
        Les capacités de type Normal
        deviennent de type Glace.
      de: |-
        Attacken vom Typ Normal
        nehmen den Typ Eis an.
      es: |-
        Convierte movimientos de tipo
        Normal en tipo Hielo.
      it: |-
        Le mosse di tipo Normale
        diventano di tipo Ghiaccio.
    omega-ruby-alpha-sapphire:
      ja-Hrkt: |-
