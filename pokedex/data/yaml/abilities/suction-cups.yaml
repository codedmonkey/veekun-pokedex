suction-cups:
  changelog:
    emerald:
      effect:
        en: 'Has no overworld effect.'
        de: 'Hat außerhalb vom Kampf keinen Effekt.'
        cs: 'Nemá žádný účinek v poli.'
  effect:
    en: |-
      This Pokémon cannot be forced out of battle by moves such as []{move:whirlwind}.

      []{move:dragon-tail} and []{move:circle-throw} still inflict damage against this Pokémon.

      Overworld: If the lead Pokémon has this ability, the success rate while fishing is increased.
    de: |-
      Ein Pokémon mit dieser Fähigkeit kann nicht mit Attacken wie []{move:whirlwind} ausgetauscht werden.

      []{move:dragon-tail} und []{move:circle-throw} verursachen trotzdem Schaden.

      Außerhalb vom Kampf: Wenn ein Pokémon mit dieser Fähigkeit an erster Stelle im Team steht, erhöht sich die Erfolgsrate beim Angeln.
  flavor_text:
    ruby-sapphire:
      en: 'Firmly anchors the body.'
    emerald:
      en: 'Firmly anchors the body.'
    firered-leafgreen:
      en: 'Firmly anchors the body.'
    diamond-pearl:
      en: |-
        Negates moves that
        force switching out.
    platinum:
      en: |-
        Negates moves that
        force switching out.
    heartgold-soulsilver:
      en: |-
        Negates foes’ moves that
        force switching out.
    black-white:
      en: |-
        Negates all moves that
        force switching out.
      fr: |-
        Annule les cap. et obj. qui
        font changer de Pokémon.
    black-2-white-2:
      en: |-
        Negates all moves that
        force switching out.
    x-y:
      ja-Hrkt: |-
        いれかえさせる　わざや
        どうぐが　きかない。
      ja: |-
        入れ替えさせる　技や
        道具が　効かない。
      ko: |-
        교체시키는 기술이나 도구의
        효과를 받지 않는다.
      en: |-
        Negates all moves and items
        that force switching out.
      fr: |-
        Annule les capacités ou objets
        qui font changer de Pokémon.
      de: |-
        Blockt Attacken und Items,
        die Pokémon austauschen.
      es: |-
        Anula movimientos y objetos que
        fuerzan el relevo.
      it: |-
        Resiste a strumenti e mosse
        di sostituzione.
