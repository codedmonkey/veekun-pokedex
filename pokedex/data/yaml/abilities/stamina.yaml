stamina:
  changelog: {  }
  effect:
    en: "Raises this Pokémon's Defense by one stage when it takes damage from a move."
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        こうげきを　うけると
        ぼうぎょが　あがる。
      ja: |-
        攻撃を　受けると
        防御が　上がる。
      ko: |-
        공격을 받으면
        방어가 올라간다.
      zh-Hant: |-
        受到攻擊時，
        防禦會提高。
      zh-Hans: |-
        受到攻击时，
        防御会提高。
      en: 'Boosts the Defense stat when hit by an attack.'
      fr: |-
        Augmente la Défense du Pokémon lorsqu’il subit
        une attaque.
      de: |-
        Wird es von einer Attacke getroffen, steigt seine
        Verteidigung.
      es: 'Aumenta la Defensa al recibir un ataque físico.'
      it: |-
        Se il Pokémon subisce un attacco, la sua Difesa
        aumenta.
