swarm:
  changelog:
    emerald:
      effect:
        en: 'Has no overworld effect.'
        de: 'Hat außerhalb vom Kampf keinen Effekt.'
        cs: 'Nemá žádný účinek v poli.'
    diamond-pearl:
      effect:
        en: 'Increases the frequency of cries heard on the overworld if any party Pokémon has this ability.'
        de: 'Erhöht die Anzahl an Rufen die man außerhalb vom Kampf hört, wenn irgendein Pokémon im Team diese Fähigkeit hat.'
  effect:
    en: |-
      When this Pokémon has 1/3 or less of its [HP]{mechanic:hp} remaining, its []{type:bug}-type moves inflict 1.5× as much [regular damage]{mechanic:regular-damage}.

      Overworld: If the lead Pokémon has this ability, the wild encounter rate is increased.
    de: |-
      Wenn ein Pokémon mit dieser Fähigkeit nur noch 1/3 seiner maximalen []{mechanic:hp} oder weniger hat, werden all seine []{type:bug} Attacken verstärkt, so dass sie 1,5× so viel []{mechanic:regular-damage} anrichten wie sonst.

      Außerhalb vom Kampf: Wenn ein Pokémon mit dieser Fähigkeit an erster Stelle im Team steht, ist die Wahrscheinlichkeit einem wilden Pokémon zu begegnen doppelt so hoch wie normal.
