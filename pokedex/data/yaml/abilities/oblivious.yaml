oblivious:
  changelog: {  }
  effect:
    en: |-
      This Pokémon cannot be [infatuated]{mechanic:infatuation} and is immune to []{move:captivate}.

      If a Pokémon is infatuated and acquires this ability, its infatuation is cleared.
    de: |-
      Dieses Pokémon kann sich nicht [verlieben]{mechanic:infatuation} und ist immun gegen []{move:captivate}.

      Wenn ein Pokémon [verliebt]{mechanic:infatuation} ist und diese Fähigkeit erhält, wird es von der []{mechanic:infatuation} geheilt.
