rattled:
  changelog: {  }
  effect:
    en: "This Pokémon's [Speed]{mechanic:speed} rises one stage with each hit from a damaging []{type:dark}-, []{type:ghost}-, or []{type:bug}-type move."
    de: 'Die []{mechanic:speed} erhöht sich mit jedem Treffer einer []{type:dark}, []{type:ghost} oder []{type:bug} Attacke um 1 [Stufe]{mechanic:stat-modifier}.'
  flavor_text:
    black-white:
      en: |-
        Some move types scare
        it and boost its Speed.
      fr: |-
        Sa peur de certains types
        augmente sa Vitesse.
    black-2-white-2:
      en: |-
        Some move types scare
        it and boost its Speed.
    x-y:
      ja-Hrkt: |-
        びびって　すばやさが
        あがる　タイプがある。
      ja: |-
        びびって　素早さが
        あがる　タイプがある。
      ko: |-
        주눅이 들어 스피드가
        올라가는 타입이 있다.
      en: |-
        Some move types scare
        it and boost its Speed stat.
      fr: |-
        Sa peur de certains types
        augmente sa Vitesse.
      de: |-
        Aus Angst vor manchen Attacken
        steigt die Initiative.
      es: |-
        El miedo a algunos ataques sube
        su Velocidad.
      it: |-
        Per paura di certi tipi di mosse,
        la Velocità sale.
    omega-ruby-alpha-sapphire:
      ja-Hrkt: |-
        びびって　すばやさが
        あがる　タイプがある。
      ja: |-
        びびって　素早さが
        あがる　タイプがある。
      ko: |-
        주눅이 들어 스피드가
        올라가는 타입이 있다.
      en: |-
