gale-wings:
  changelog: {  }
  effect:
    en: "Raises []{type:flying} moves' priority by one stage."
    de: 'Wenn ein Pokémon diese Fähigkeit hat, erhöht sich die []{mechanic:priority} seiner []{type:flying} Attacken um 1 Stufe.'
  flavor_text:
    x-y:
      ja-Hrkt: |-
        ひこうタイプの　わざが
        せんせいで　だせる。
      ja: |-
        ひこうタイプの　技が
        先制で　だせる。
      ko: |-
        비행타입의 기술이
        먼저 나오게 된다.
      en: |-
        Gives priority to Flying-type
        moves.
      fr: |-
        Les attaques de type Vol sont
        prioritaires.
      de: |-
        Ermöglicht es dem Pokémon, mit
        Flug-Attacken zuerst anzugreifen.
      es: |-
        Da prioridad a los movimientos de
        tipo Volador.
      it: |-
        Dà priorità alle mosse di tipo
        Volante.
    omega-ruby-alpha-sapphire:
      ja-Hrkt: |-
        ひこうタイプの　わざが
        せんせいで　だせる。
      ja: |-
        ひこうタイプの　技が
        先制で　だせる。
      ko: |-
