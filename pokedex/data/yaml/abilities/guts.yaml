guts:
  changelog:
    diamond-pearl:
      effect:
        en: 'Does not take effect during [sleep]{mechanic:sleep}.'
        de: 'Hat keinen Effekt während das Pokémon [schläft]{mechanic:sleep}.'
  effect:
    en: |-
      Whenever this Pokémon is [asleep]{mechanic:sleep}, [burned]{mechanic:burn}, [paralyzed]{mechanic:paralysis}, or [poisoned]{mechanic:poison}, it has 1.5× its [Attack]{mechanic:attack}.  This Pokémon is not affected by the usual Attack cut from a burn.

      This bonus does not count as a [stat modifier]{mechanic:stat-modifier}.
    de: |-
      Wenn ein Pokémon mit dieser Fähigkeit [schläft]{mechanic:sleep}, [brennt]{mechanic:burn}, [paralysiert]{mechanic:paralysis} oder [vergiftet]{mechanic:poison} ist, ist sein []{mechanic:attack} 1,5× so hoch wie sonst. Bei Verbrennung gibt es keine Halbierung des [Angriffs]{mechanic:attack}.

      Der Bonus zählt nicht als [Statuswerte Änderung]{mechanic:stat-modifier}.
  flavor_text:
    ruby-sapphire:
      en: 'Ups ATTACK if suffering.'
    emerald:
      en: 'Ups ATTACK if suffering.'
    firered-leafgreen:
