minus:
  changelog:
    black-white:
      effect:
        en: 'Powers up only when paired with []{ability:plus}.'
        de: 'Funktioniert nur wenn es mit []{ability:plus} kombiniert wird.'
  effect:
    en: |-
      This Pokémon has 1.5× its [Special Attack]{mechanic:special-attack} if any friendly Pokémon has []{ability:plus} or []{ability:minus}.

      This bonus does not count as a [stat modifier]{mechanic:stat-modifier}.  If either ability is disabled by []{move:gastro-acid}, both lose their effect.
    de: |-
      Pokémon mit dieser Fähigkeit haben einen 1,5× so hohen []{mechanic:special-attack} wenn ein Team-Pokémon die Fähigkeit []{ability:plus} oder []{ability:minus} hat.

      Der Bonus zählt nicht als []{mechanic:stat-modifier}. Wenn eine der Fähigkeiten deaktiviert wird, z.B. von []{move:gastro-acid}, verlieren beide ihren Effekt.
  flavor_text:
    ruby-sapphire:
      en: 'Powers up with PLUS.'
    emerald:
      en: 'Powers up with PLUS.'
    firered-leafgreen:
      en: 'Powers up with PLUS.'
    diamond-pearl:
      en: |-
        Boosts Sp. Atk if another
        Pokémon has Plus.
    platinum:
      en: |-
        Boosts Sp. Atk if another
        Pokémon has Plus.
    heartgold-soulsilver:
      en: |-
        Ups Sp. Atk if another
        Pokémon has Plus.
    black-white:
      en: |-
        Ups Sp. Atk if another
        Pokémon has Plus or Minus.
      fr: |-
        Augmente l’Atq. Spé. si un
        Pokémon a Minus ou Plus.
    black-2-white-2:
      en: |-
        Ups Sp. Atk if another
        Pokémon has Plus or Minus.
    x-y:
      ja-Hrkt: |-
        プラスかマイナスがいると
        とくこうが　あがる。
      ja: |-
        プラスかマイナスがいると
        特攻が　あがる。
      ko: |-
        플러스나 마이너스가 있으면
        특수공격이 올라간다.
      en: |-
        Boosts the Sp. Atk stat if another
        Pokémon has Plus or Minus.
      fr: |-
        Augmente l’Attaque Spéciale si
        un Pokémon a Minus ou Plus.
      de: |-
        Erhöht den Spezial-Angriff, wenn
        Plus oder Minus vertreten sind.
      es: |-
        Potencia el At. Esp. si algún otro
        Pokémon tiene Más o Menos.
      it: |-
        Aumenta l’Attacco Speciale se ci
        sono Pokémon con Meno o Più.
