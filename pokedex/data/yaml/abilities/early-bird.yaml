early-bird:
  changelog: {  }
  effect:
    en: |-
      This Pokémon's remaining sleep turn count falls by 2 rather than 1.

      If this Pokémon's sleep counter is at 1, it will fall to 0 and then the Pokémon will wake up.
    de: |-
      Bei Pokémon mit dieser Fähigkeit sinkt die Anzahl der Verbleibenden Runden im [Schlaf]{mechanic:sleep} pro Runde um 2 statt um 1.

      Wenn der Zähler bei 1 ist fällt er auf 0 und das Pokémon [wacht auf]{mechanic:sleep}.
