sturdy:
  changelog:
    black-white:
      effect:
        en: 'Does not prevent regular KOs from full [HP]{mechanic:hp}.'
        de: 'Verhindert keine regulären K.O. bei vollen []{mechanic:hp}.'
        cs: 'Funguje jen proti útokům, které vždy omráčí na jeden úder. (Ne proti těm, které jsou prostě příliš silné.)'
  effect:
    en: |-
      When this Pokémon is at full [HP]{mechanic:hp}, any hit that would knock it out will instead leave it with 1 HP.  Regardless of its current HP, it is also immune to the one-hit KO moves: []{move:fissure}, []{move:guillotine}, []{move:horn-drill}, and []{move:sheer-cold}.

      If this Pokémon is holding a []{item:focus-sash}, this ability takes precedence and the item will not be consumed.
    de: |-
      Wenn das Pokémon volle []{mechanic:hp} hat, lässt jeder Treffer der das Pokémon besiegt hätte ein []{mechanic:hp} übrig. Das Pokémon ist immun gegen die K.O.-Attacken []{move:fissure}, []{move:guillotine}, []{move:horn-drill} und []{move:sheer-cold}.

      Hält das Pokémon ein []{item:focus-sash}, hat die Fähigkeit Vorrang und das Item wird nicht verbraucht.
