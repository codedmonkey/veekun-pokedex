strong-jaw:
  changelog: {  }
  effect:
    en: 'Strengthens biting moves to 1.5× their power.'
    de: 'Die Bissattacken von Pokémon mit dieser Fähigkeit sind 1,5× so stark wie sonst. Zu Bissattacken zählen auch []{move:crunch} und "Zahn"-Attacken.'
  flavor_text:
    x-y:
      ja-Hrkt: |-
        あごが　がんじょうで
        かむ　ちからが　つよい。
      ja: |-
        あごが　頑丈で
        かむ　力が　強い。
      ko: |-
        턱이 튼튼하여
        무는 힘이 강하다.
      en: |-
        The Pokémon’s strong jaw gives
        it tremendous biting power.
      fr: |-
        Grâce à une puissante mâchoire,
        les morsures sont plus fortes.
      de: |-
        Der kräftige Kiefer des Pokémon
        verleiht ihm einen starken Biss.
      es: |-
        Su robusta mandíbula le confiere
        una potente mordedura.
      it: |-
        La robusta mascella del Pokémon
        permette morsi molto potenti.
