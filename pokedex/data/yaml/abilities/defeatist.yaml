defeatist:
  changelog: {  }
  effect:
    en: "This Pokémon's [Attack]{mechanic:attack} and [Special Attack]{mechanic:special-attack} are halved when it has half its [HP]{mechanic:hp} or less."
    de: 'Der []{mechanic:attack} und die []{mechanic:special-attack} eines Pokémon mit dieser Fähigkeit werden halbiert, wenn es nur noch 50% oder weniger seiner maximalen []{mechanic:hp} hat.'
  flavor_text:
    black-white:
      en: |-
        Lowers stats when HP
        becomes half or less.
      fr: |-
        Baisse les stats quand les
        PV tombent à la moitié.
    black-2-white-2:
      en: |-
        Lowers stats when HP
        becomes half or less.
    x-y:
      ja-Hrkt: |-
        ＨＰが　はんぶんになると
        のうりょくが　さがる。
      ja: |-
        ＨＰが　半分になると
        能力が　さがる。
      ko: |-
        HP가 절반이 되면
        능력이 떨어진다.
      en: |-
        Lowers stats when HP
        becomes half or less.
      fr: |-
        Baisse les stats quand les PV
        tombent à la moitié.
      de: |-
        Bei halbierter KP-Anzahl
        sinken die Statuswerte.
      es: |-
        Baja las características al llegar a
        la mitad los PS.
      it: |-
        Le statistiche scendono se i PS
        calano a metà o meno.
    omega-ruby-alpha-sapphire:
      ja-Hrkt: |-
