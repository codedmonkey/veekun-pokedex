arena-trap:
  changelog:
    emerald:
      effect:
        en: 'Has no overworld effect.'
        de: 'Hat außerhalb vom Kampf keinen Effekt.'
        cs: 'Nemá žádný účinek v poli.'
  effect:
    en: |-
      While this Pokémon is in battle, opposing Pokémon cannot flee or switch out.  []{type:flying}-type Pokémon and Pokémon in the air, e.g. due to []{ability:levitate} or []{move:magnet-rise}, are unaffected.

      Pokémon with []{ability:run-away} can still flee.  Pokémon can still switch out with the use of a move or item.

      Overworld: If the lead Pokémon has this ability, the wild encounter rate is doubled.
    de: |-
      Wenn ein Pokémon mit dieser Fähigkeit im Kampf ist, kann der Gegner nicht fliehen oder ausgetauscht werden. []{type:flying} Pokémon und schwebende, z.B. durch []{ability:levitate} oder []{move:magnet-rise} sind nicht betroffen.

      Pokémon mit []{ability:run-away} können trotzdem fliehen. Pokémon können mit bestimmten Items oder Attacken ausgetauscht werden.

      Außerhalb vom Kampf: Wenn ein Pokémon mit dieser Fähigkeit an erster Stelle im Team steht, ist die Wahrscheinlichkeit einem wilden Pokémon zu begegnen doppelt so hoch wie normal.
