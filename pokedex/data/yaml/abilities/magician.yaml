      ja-Hrkt: |-
        わざを　あてた　あいての
        どうぐを　うばってしまう。
      ja: |-
        技を　当てた　相手の
        道具を　奪ってしまう。
      ko: |-
        기술을 맞은 상대의
        도구를 빼앗아 버린다.
      en: |-
        The Pokémon steals the held item
        of a Pokémon it hits with a move.
      fr: |-
        Les capacités volent aussi l’objet
        tenu par la cible.
      de: |-
        Stiehlt Items von Pokémon, die
        durch Attacken getroffen wurden.
      es: |-
        Roba el objeto del Pokémon al
        que alcance con un movimiento.
      it: |-
