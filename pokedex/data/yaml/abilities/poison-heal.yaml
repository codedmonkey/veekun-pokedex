        HP를 회복한다.
      en: |-
        Restores HP if the
        Pokémon is poisoned.
      fr: |-
        Restaure des PV si le Pokémon
        est empoisonné.
      de: 'Heilt bei Vergiftungen KP.'
      es: |-
        Recupera PS si el Pokémon ha
        sido envenenado.
      it: |-
        Ridà PS se il Pokémon
        è avvelenato.
