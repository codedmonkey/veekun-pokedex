poison-heal:
  changelog:
    black-white:
      effect:
        en: '[Poison]{mechanic:poison} still damages the Pokémon outside of battle.'
        de: '[]{mechanic:poison} schadet dem Pokémon außerhalb vom Kampf.'
  effect:
    en: 'If this Pokémon is [poisoned]{mechanic:poison}, it will heal for 1/8 of its maximum [HP]{mechanic:hp} after each turn rather than taking damage.  This includes bad poison.'
    de: 'Wenn ein Pokémon mit dieser Fähigkeit [vergiftet]{mechanic:poison} ist, erhält es anstatt Schaden zu erleiden 1/8 seiner maximalen []{mechanic:hp} nach jeder Runde. Das gilt auch für schwere []{mechanic:poison}.'
  flavor_text:
    diamond-pearl:
      en: |-
        Restores HP if the
        Pokémon is poisoned.
    platinum:
      en: |-
        Restores HP if the
        Pokémon is poisoned.
    heartgold-soulsilver:
      en: |-
        Restores HP if the
        Pokémon is poisoned.
    black-white:
