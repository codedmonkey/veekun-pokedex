gulp-missile:
  changelog: {  }
  effect: {  }
  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        なみのりか　ダイビングを　すると
        えものを　くわえてくる。　ダメージを
        うけると　えものを　はきだして　こうげき。
      ja: |-
        なみのりか　ダイビングを　すると
        獲物を　くわえてくる。　ダメージを
        受けると　獲物を　吐きだして　攻撃。
      ko: |-
        파도타기나 다이빙을 쓰면
        먹이를 물어온다. 데미지를
        받으면 먹이를 토해내서 공격한다.
      zh-Hant: |-
        衝浪或潛水時會叼來獵物。
        當受到傷害時，
        會吐出獵物攻擊對手。
      zh-Hans: |-
        冲浪或潜水时会叼来猎物。
        受到伤害时，
        会吐出猎物进行攻击。
      en: |-
        When the Pokémon uses Surf or Dive, it will come back
        with prey. When it takes damage, it will spit out the prey
        to attack.
      fr: |-
        Quand le Pokémon utilise Surf ou Plongée, il revient
        avec une proie. Lorsqu’il subit des dégâts par la suite,
        il attaque en recrachant sa proie.
      de: |-
        Wenn das Pokémon Surfer oder Taucher einsetzt, fängt
        es sich dabei Beute. Erleidet es anschließend Schaden,
        greift es an, indem es die Beute wieder ausspuckt.
      es: |-
        Tras usar Surf o Buceo, emerge con una presa en la
        boca. Al recibir daño, ataca escupiéndola al rival.
      it: |-
        Quando usa Surf o Sub, il Pokémon cattura una preda.
        Se subisce dei danni, la sputa fuori per attaccare.
  generation: generation-viii
  is_main_series: true
  name:
    ja-Hrkt: うのミサイル
    ja: うのミサイル
    ko: 그대로꿀꺽미사일
    zh-Hant: 一口飛彈
    zh-Hans: 一口导弹
    en: 'Gulp Missile'
    fr: Dégobage
    de: Würggeschoss
    es: Tragamisil
    it: Inghiottimissile
