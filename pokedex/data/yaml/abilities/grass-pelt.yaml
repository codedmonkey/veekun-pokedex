  effect:
    en: 'Boosts Defense while []{move:grassy-terrain} is in effect.'
    de: 'Während der Effekt von []{move:grassy-terrain} aktiv ist, haben Pokémon mit dieser Fähigkeit eine 1,5× so hohe []{mechanic:defense} wie sonst.'
  flavor_text:
    x-y:
      ja-Hrkt: |-
        グラスフィールドのとき
        ぼうぎょが　あがる。
      ja: |-
        グラスフィールドの時
        防御が　あがる。
      ko: |-
        그래스필드일 때
        방어가 올라간다.
      en: |-
        Boosts the Defense stat
        in Grassy Terrain.
      fr: |-
        Augmente la Défense si
        Champ Herbu est actif.
      de: |-
        Erhöht die Verteidigung,
        wenn Grasfeld aktiv ist.
      es: |-
        Aumenta la Defensa mientras dura
        el efecto de Campo de Hierba.
      it: |-
        Aumenta la Difesa durante
        l’effetto di Campo Erboso.
