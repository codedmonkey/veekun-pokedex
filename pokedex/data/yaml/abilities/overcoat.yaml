overcoat:
  changelog: {  }
  effect:
    en: 'This Pokémon does not take damage from [weather]{mechanic:weather}.'
    de: 'Pokémon mit dieser Fähigkeit erhalten keinen Schaden durch [Wettereffekte]{mechanic:weather}.'
  flavor_text:
    black-white:
      en: |-
        Protects the Pokémon from
        damage from weather.
      fr: |-
        Neutralise les dégâts dus
        à la météo.
    black-2-white-2:
      en: |-
        Protects the Pokémon from
        damage from weather.
    x-y:
      ja-Hrkt: |-
        ちりや　こなを
        ふせぐ。
      ja: |-
        ちりや　粉を
        防ぐ。
      ko: |-
        먼지나 가루를
        막는다.
      en: |-
        Protects the Pokémon from things
        like sand, hail, and powder.
      fr: |-
        Protège du sable, de la grêle
        ou de la poudre.
      de: |-
        Nimmt keinen Schaden
        durch Wetterbedingungen.
      es: |-
        Protege del polvo, la arena y
        el granizo.
      it: |-
        Protegge il Pokémon da polvere,
        sabbia e grandine.
    omega-ruby-alpha-sapphire:
