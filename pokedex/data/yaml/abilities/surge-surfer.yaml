surge-surfer:
  changelog: {  }
  effect:
    en: "Doubles this Pokémon's Speed on Electric Terrain."
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        エレキフィールド　のとき
        すばやさが　２ばいに　なる。
      ja: |-
        エレキフィールド　のとき
        素早さが　２倍に　なる。
      ko: |-
        일렉트릭필드일 때
        스피드가 2배가 된다.
      zh-Hant: |-
        電氣場地時，
        速度會變為２倍。
      zh-Hans: |-
        电气场地时，
        速度会变为２倍。
      en: |-
        Doubles the Pokémon’s Speed stat on
        Electric Terrain.
      fr: |-
        La Vitesse du Pokémon est doublée sur
        un Champ Électrifié.
      de: |-
        Verdoppelt die Initiative, wenn zuvor ein Elektrofeld
        erzeugt wurde.
      es: |-
        Duplica la Velocidad si hay un campo eléctrico en el
        terreno de combate.
      it: |-
        In presenza di un Campo Elettrico, la Velocità
        raddoppia.
