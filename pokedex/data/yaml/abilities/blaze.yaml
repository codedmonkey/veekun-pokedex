        불꽃타입 기술의
        위력이 올라간다.
      zh-Hant: |-
        ＨＰ減少的時候，
        火屬性的招式威力會提高。
      zh-Hans: |-
        ＨＰ减少的时候，
        火属性的招式威力会提高。
      en: |-
