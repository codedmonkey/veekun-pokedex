steadfast:
  changelog: {  }
  effect:
    en: 'Whenever this Pokémon [flinches]{mechanic:flinching}, its [Speed]{mechanic:speed} rises one [stage]{mechanic:stat-modifier}.'
    de: 'Wenn ein Pokémon mit dieser Fähigkeit [zurückschreckt]{mechanic:flinching}, wird seine []{mechanic:speed} um 1 [Stufe]{mechanic:stat-modifier} erhöht.'
  flavor_text:
    diamond-pearl:
      en: |-
        Raises Speed each time
        the Pokémon flinches.
    platinum:
      en: |-
        Raises Speed each time
