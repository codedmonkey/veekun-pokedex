    x-y:
      ja-Hrkt: |-
        ひるむ　たびに
        すばやさが　あがる。
      ja: |-
        ひるむ　たびに
        素早さが　あがる。
      ko: |-
        풀죽을 때마다
        스피드가 올라간다.
      en: |-
        Boosts the Speed stat each time
        the Pokémon flinches.
      fr: |-
        Augmente la Vitesse quand le
        Pokémon a peur.
      de: |-
        Erhöht die Initiative, sobald
        das Pokémon zurückschreckt.
      es: |-
        Cada vez que retrocede sube su
        Velocidad.
      it: |-
        Aumenta la Velocità se
        il Pokémon tentenna.
