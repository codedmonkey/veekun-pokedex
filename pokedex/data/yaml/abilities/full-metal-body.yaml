full-metal-body:
  changelog: {  }
  effect:
    en: |-
      This Pokémon's stats cannot be lowered by other Pokémon's moves or abilities.  This effect only applies to normal stat modifications and not more exotic effects such as []{move:topsy-turvy} or []{move:power-swap}.

      This Ability is not bypassed by []{ability:mold-breaker}, []{ability:teravolt}, or []{ability:turboblaze}.
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        あいての　わざや　とくせいで
        のうりょくを　さげられない。
      ja: |-
        相手の　技や　特性で
        能力を　下げられない。
      ko: |-
        상대 기술이나 특성으로
        능력을 떨어뜨릴 수 없다.
      zh-Hant: |-
        不會因對手的招式或特性
        而被降低能力。
      zh-Hans: |-
        不会因为对手的招式或特性
        而被降低能力。
      en: |-
        Prevents other Pokémon’s moves or Abilities from
        lowering the Pokémon’s stats.
      fr: |-
        Empêche les stats du Pokémon de baisser à cause
        d’une capacité ou d’un talent.
      de: |-
        Verhindert das Senken der Statuswerte durch
        Attacken und Fähigkeiten von Angreifern.
      es: |-
        Evita que bajen sus características a causa de
        movimientos o habilidades de otros Pokémon.
      it: |-
        Rende immuni alla diminuzione delle statistiche
        causata da abilità o mosse di altri Pokémon.
