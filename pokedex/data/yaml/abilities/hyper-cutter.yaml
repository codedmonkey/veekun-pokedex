hyper-cutter:
  changelog:
    emerald:
      effect:
        en: 'Has no overworld effect.'
        de: 'Hat außerhalb vom Kampf keinen Effekt.'
        cs: 'Nemá žádný účinek v poli.'
    diamond-pearl:
      effect:
        en: "Doubles []{move:cut}'s grass-cutting radius on the overworld if any party Pokémon has this ability."
        de: 'Verdoppelt den Radius in dem []{move:cut} Gras entfernt, wenn irgendein Pokémon im Team diese Fähigkeit hat.'
  effect:
    en: |-
      This Pokémon's [Attack]{mechanic:attack} cannot be [lowered]{mechanic:stat-modifier} by other Pokémon.

      This ability does not prevent any Attack losses other than [stat modifiers]{mechanic:stat-modifiers}, such as the Attack cut from a [burn]{mechanic:burn}.  This Pokémon can still be passed negative Attack modifiers through []{move:heart-swap} or []{move:power-swap}.
    de: |-
      Pokémon mit dieser Fähigkeit kann der []{mechanic:attack} nicht [gesenkt]{mechanic:stat-modifier} werden.

      Die Fähigkeit verhindert nur [Statuswertveränderungen]{mechanic:stat-modifier}, der [verminderte]{mechanic:stat-modifier} []{mechanic:attack} durch []{mechanic:burn} wird nicht verhindert. Pokémon mit dieser Fähigkeit können trotzdem negative []{mechanic:accuracy} durch []{move:heart-swap} oder []{move:power-swap} übertragen werden.
  flavor_text:
