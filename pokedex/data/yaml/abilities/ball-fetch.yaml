ball-fetch:
  changelog: {  }
  effect: {  }
  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        どうぐを　もっていない　ばあい
        １かいめに　なげて　しっぱい　した
        モンスターボールを　ひろってくる。
      ja: |-
        道具を　持っていない　場合
        １回目に　投げて　失敗　した
        モンスターボールを　拾ってくる。
      ko: |-
        도구를 지니고 있지 않은 경우
        첫 번째로 던져서 실패한
        몬스터볼을 주워온다.
      zh-Hant: |-
        當寶可夢沒有攜帶道具時，
        會撿回第１個投出後
        捕捉失敗的精靈球。
      zh-Hans: |-
        没有携带道具时，
        会拾取第１个投出后
        捕捉失败的精灵球。
      en: |-
        If the Pokémon is not holding an item, it will fetch
        the Poké Ball from the first failed throw
        of the battle.
      fr: |-
        Si le Pokémon ne tient aucun objet, il ramassera
        la Poké Ball lors du premier lancer raté du combat.
      de: |-
        Trägt das Pokémon kein Item bei sich, hebt es den Ball
        aus dem ersten gescheiterten Fangversuch des Kampfes
        wieder auf.
      es: |-
        Si no lleva equipado ningún objeto, recupera la
        Poké Ball del primer intento de captura fallido.
      it: |-
        Se il Pokémon non ha uno strumento con sé,
        raccoglie la Poké Ball del primo tentativo
        di cattura fallito.
  generation: generation-viii
  is_main_series: true
  name:
    ja-Hrkt: たまひろい
    ja: たまひろい
    ko: 볼줍기
    zh-Hant: 撿球
    zh-Hans: 捡球
    en: 'Ball Fetch'
    fr: 'Ramasse Ball'
    de: Apport
    es: Recogebolas
    it: Raccattapalle
  short_effect: {  }
