download:
  changelog: {  }
  effect:
    en: |-
      When this Pokémon enters battle, its [Attack]{mechanic:attack} or [Special Attack]{mechanic:special-attack}, whichever corresponds to its opponents' weaker total defensive stat, rises one [stage]{mechanic:stat-modifier}.  In the event of a tie, Special Attack is raised.

      This ability also takes effect when acquired during a battle.
    de: |-
      Wenn ein Pokémon mit dieser Fähigkeit den Kampf betritt, wird sein []{mechanic:attack} oder []{mechanic:special-attack} um 1 [Stufe]{mechanic:stat-modifier} erhöht, je nachdem, welcher Verteidigungswert des Gegners niedriger ist. Bei Gleichstand wird der []{mechanic:special-attack} erhöht.

      Die Fähigkeit löst auch aus, wenn sie während des Kampfes erlangt wird.
  flavor_text:
