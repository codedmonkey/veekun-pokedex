shadow-tag:
  changelog:
    diamond-pearl:
      effect:
        en: 'Affects other Pokémon with this ability.'
        de: 'Betrifft andere Pokémon mit dieser Fähigkeit.'
        cs: 'Nemá žádný účinek v poli.'
  effect:
    en: |-
      While this Pokémon is in battle, opposing Pokémon cannot flee or switch out.

      Other Pokémon with this ability are unaffected.  Pokémon with []{ability:run-away} can still flee.  Pokémon can still switch out with the use of a move or item.
    de: |-
      Während ein Pokémon mit dieser Fähigkeit im Kampf ist, kann der Gegner nicht fliehen oder ausgetauscht werden.

      Andere Pokémon mit derselben Fähigkeit sind nicht betroffen. Pokémon mit []{ability:run-away} können trotzdem fliehen. Pokémon können mit bestimmten Items oder Attacken ausgetauscht werden.
