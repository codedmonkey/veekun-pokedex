scrappy:
  changelog: {  }
  effect:
    en: |-
      This Pokémon ignores []{type:ghost}-type Pokémon's immunity to []{type:normal}- and []{type:fighting}-type moves.

      Ghost Pokémon's other types affect damage as usual.
    de: |-
      Pokémon mit dieser Fähigkeit ignorieren die Immunität von []{type:ghost} Pokémon gegen []{type:normal} und []{type:fighting} Attacken.

      Der zweite Typ des []{type:ghost} Pokémons beeinflusst den Schaden wie sonst auch.
  flavor_text:
