heatproof:
  changelog: {  }
  effect:
    en: 'This Pokémon takes half as much damage from []{type:fire}-type moves and [burns]{mechanic:burn}.'
    de: 'Pokémon mit dieser Fähigkeit erhalten nur halben Schaden von []{type:fire} Attacken und [Verbrennungen]{mechanic:burn}.'
  flavor_text:
    diamond-pearl:
      en: |-
        Weakens the power of
        Fire-type moves.
    platinum:
      en: |-
        Weakens the power of
        Fire-type moves.
    heartgold-soulsilver:
      en: |-
        Weakens the power of
