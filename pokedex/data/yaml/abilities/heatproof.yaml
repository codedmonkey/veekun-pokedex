        capacités de type Feu.
      de: |-
        Senkt die Stärke von
        Feuer-Attacken.
      es: |-
        Atenúa los movimientos de tipo
        Fuego.
      it: |-
        Indebolisce l’effetto di mosse
        di tipo Fuoco.
    omega-ruby-alpha-sapphire:
      ja-Hrkt: |-
        ほのおタイプの　こうげきの
        いりょくを　よわめる。
      ja: |-
        ほのおタイプの　攻撃の
        威力を　弱める。
      ko: |-
        불꽃타입 공격의
        위력을 약하게 한다.
      en: |-
