        いりょくを　よわめる。
      ja: |-
        ほのお技の
        威力を　弱める。
      ko: |-
        불꽃 기술의
        위력을 약하게 한다.
      en: |-
        Weakens the power of
        Fire-type moves.
      fr: |-
