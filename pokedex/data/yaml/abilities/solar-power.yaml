    x-y:
      ja-Hrkt: |-
        はれると　ＨＰが　へるが
        とくこうが　あがる。
      ja: |-
        晴れると　ＨＰが　減るが
        特攻が　あがる。
      ko: |-
        맑으면 HP가 줄지만
        특수공격이 올라간다.
      en: |-
        Boosts the Sp. Atk stat in sunny
        weather, but HP decreases.
      fr: |-
        Augmente l’Attaque Spéciale
        mais baisse les PV au soleil.
      de: |-
        Führt bei Sonne zu KP-Verlusten,
        erhöht aber den Spezial-Angriff.
      es: |-
        Si hace sol, baja los PS, pero
        potencia el At. Esp.
      it: |-
        Se c’è il sole aumenta l’Attacco
        Speciale, ma riduce i PS.
