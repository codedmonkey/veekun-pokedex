solar-power:
  changelog: {  }
  effect:
    en: 'During [strong sunlight]{mechanic:strong-sunlight}, this Pokémon has 1.5× its [Special Attack]{mechanic:special-attack} but takes 1/8 of its maximum [HP]{mechanic:hp} in damage after each turn.'
    de: 'Während [starkem Sonnenlicht]{mechanic:strong-sunlight}, wird der []{mechanic:special-attack} von Pokémon mit dieser Fähigkeit um 50% erhöht, dafür erleidet es 1/8 seiner maximalen []{mechanic:hp} Schaden am Ende der Runde.'
  flavor_text:
    diamond-pearl:
      en: |-
        Boosts Sp. Atk, but
        lowers HP in sunshine.
    platinum:
      en: |-
        Boosts Sp. Atk, but
        lowers HP in sunshine.
    heartgold-soulsilver:
      en: |-
