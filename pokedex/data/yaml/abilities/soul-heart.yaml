soul-heart:
  changelog: {  }
  effect:
    en: "This Pokémon's Special Attack rises by one stage every time any Pokémon faints."
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        ポケモンが　ひんしに　なるたびに
        とくこうが　あがる。
      ja: |-
        ポケモンが　ひんしに　なるたびに
        特攻が　上がる。
      ko: |-
        포켓몬이 기절할 때마다
        특수공격이 올라간다.
      zh-Hant: |-
        每當場上有寶可夢
        陷入瀕死狀態時，
        特攻就會提高。
      zh-Hans: |-
        宝可梦每次变为濒死状态时，
        特攻会提高。
      en: 'Boosts its Sp. Atk stat every time a Pokémon faints.'
      fr: |-
        Augmente l’Attaque Spéciale du Pokémon
        lorsqu’un autre Pokémon est mis K.O.
      de: |-
        Erhöht jedes Mal, wenn ein Pokémon besiegt wird,
        den eigenen Spezial-Angriff.
      es: |-
        Aumenta el Ataque Especial cada vez que un
        Pokémon cae debilitado.
      it: |-
        Aumenta l’Attacco Speciale ogni volta che
        un Pokémon va KO.
