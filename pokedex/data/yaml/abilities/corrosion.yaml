corrosion:
  changelog: {  }
  effect:
    en: "This Pokémon's moves and item ignore the usual immunity of Poison and Steel Pokémon when attempting to inflict poison."
  flavor_text:
    sun-moon:
      ja-Hrkt: |-
        はがねタイプや　どくタイプも
        どく　じょうたいに　することが　できる。
      ja: |-
        はがねタイプや　どくタイプも
        どく状態に　することが　できる。
      ko: |-
        강철타입이나 독타입도
        독 상태로 만들 수 있다.
      zh-Hant: |-
        就算對方是鋼屬性或毒屬性寶可夢，
        也可讓對方陷入中毒狀態。
      zh-Hans: |-
        可以使钢属性和毒属性的宝可梦
        也陷入中毒状态。
      en: |-
        The Pokémon can poison the target even if it’s
        a Steel or Poison type.
      fr: |-
        Permet d’empoisonner les Pokémon de type Acier
        ou Poison.
      de: |-
        Kann selbst Pokémon vom Typ Stahl oder Gift
        vergiften.
      es: |-
        Permite envenenar incluso a rivales de tipo Acero o
        Veneno.
      it: |-
        Il Pokémon è in grado di avvelenare il bersaglio
        anche se questo è di tipo Acciaio o Veleno.
