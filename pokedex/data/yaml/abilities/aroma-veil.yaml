aroma-veil:
  changelog: {  }
  effect:
    en: 'Protects allies against moves that affect their mental state.'
    de: 'Pokémon sind vor mentalen Attacken wie []{move:attract}, []{move:disable}, []{move:taunt} oder []{move:encore} geschützt, solange sich ein Pokémon mit dieser Fähigkeit im Team befindet. Das gilt auch, für das Pokémon selbst.'
  flavor_text:
    x-y:
      ja-Hrkt: |-
        みかたへの　メンタル
        こうげきを　ふせぐ。
      ja: |-
        味方への　メンタル
        攻撃を　防ぐ。
      ko: |-
        같은 편으로 향하는
        멘탈 공격을 막는다.
      en: |-
        Protects allies from attacks that
        limit their move choices.
      fr: |-
        Protège l’équipe des attaques
        limitant le choix des capacités.
      de: |-
        Schützt alle Pokémon im Team
        vor manchen mentalen Angriffen.
      es: |-
        Protege al equipo de ataques
        que impiden elegir movimientos.
      it: |-
        Protegge sé e gli alleati da mosse
        che limitano la scelta di attacchi.
