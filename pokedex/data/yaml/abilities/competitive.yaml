competitive:
  changelog: {  }
  effect:
    en: 'Raises Special Attack by two stages upon having any stat lowered.'
    de: |-
      Wenn ein Statuswert eines Pokémon mit dieser Fähigkeit [gesenkt]{mechanic:stat-modifier} wird, wird sein []{mechanic:special-attack} um 2 [Stufen]{mechanic:stat-modifier} erhöht.

      Wenn mehrere Statuswerte [gesenkt]{mechanic:stat-modifier} löst die Fähigkeit für jeden Statuswert aus.
  flavor_text:
    x-y:
      ja-Hrkt: |-
        のうりょくが　さがると
        とくこうが　あがる。
      ja: |-
        能力が　さがると
        特攻が　あがる。
      ko: |-
        능력이 떨어지면
        특수공격이 올라간다.
      en: |-
        Boosts the Sp. Atk stat when
        a stat is lowered.
      fr: |-
        Monte l’Attaque quand une stat
        est baissée par l’adversaire.
      de: |-
        Erhöht den Spezial-Angriff, wenn
        ein Statuswert gesenkt wurde.
      es: |-
        Aumenta su At. Esp. cuando
        disminuyen otras características.
      it: |-
        L’Attacco aumenta quando un
        nemico fa calare le statistiche.
