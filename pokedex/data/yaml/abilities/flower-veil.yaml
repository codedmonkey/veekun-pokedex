flower-veil:
  changelog: {  }
  effect:
    en: 'Protects friendly []{type:grass} Pokémon from having their stats lowered by other Pokémon.'
    de: |-
      []{type:grass} Pokémon können durch Gegner keine negativen []{mechanic:stat-modifier} erleiden, solange sich ein Pokémon mit dieser Fähigkeit im Team befindet.

      Das betrifft nur direkte [Statuswerteänderungenen]{mechanic:stat-modifier}, der []{mechanic:speed} Malus von []{mechanic:paralysis} wird nicht verhindert, genauso wie selbstverursachte [Statuswerteänderungenen]{mechanic:stat-modifier} wie z.B. durch []{move:leaf-storm}.
  flavor_text:
    x-y:
      ja-Hrkt: |-
        みかたの　くさポケモンは
        のうりょくが　さがらない。
      ja: |-
        味方の　草ポケモンは
        能力が　さがらない。
      ko: |-
        같은 편의 풀타입 포켓몬은
        능력이 떨어지지 않는다.
      en: |-
        Prevents lowering of ally
        Grass-type Pokémon’s stats.
      fr: |-
        Empêche les alliés de type Plante
        de subir des diminutions de stats.
      de: |-
        Schützt Pflanzen-Pokémon
        vor gesenkten Statuswerten.
      es: |-
        Evita que bajen las características
        de Pokémon tipo Planta aliados.
      it: |-
        Evita il calo delle statistiche
        degli alleati di tipo Erba.
