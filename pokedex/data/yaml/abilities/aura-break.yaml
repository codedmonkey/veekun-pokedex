        are reversed.
      fr: 'L’effet des auras est inversé.'
      de: 'Kehrt die Wirkung von Auren um.'
      es: |-
        Invierte los efectos que causan
        las auras.
      it: |-
        Inverte gli effetti di tutte
        le aure.
    sun-moon:
      ja-Hrkt: |-
        オーラの　こうかを　ぎゃくてんさせて
        いりょくを　さげる。
      ja: |-
        オーラの　効果を　逆転させて
        威力を　下げる。
      ko: |-
        오라의 효과를 역전시켜
        위력을 떨어뜨린다.
      zh-Hant: |-
        讓氣場的效果逆轉，
        並降低威力。
      zh-Hans: |-
        让气场的效果发生逆转，
        降低威力。
      en: |-
        The effects of “Aura” Abilities are reversed
        to lower the power of affected moves.
      fr: 'Inverse l’effet des auras en baissant leur puissance.'
      de: |-
        Kehrt die Wirkung von Auren um und senkt so die
        Stärke bestimmter Attacken, anstatt sie zu erhöhen.
      es: |-
        Invierte los efectos de las auras, por lo que baja la
        potencia de ciertos movimientos en vez de subirla.
      it: |-
        Inverte gli effetti di tutte le aure riducendone
        la potenza.
