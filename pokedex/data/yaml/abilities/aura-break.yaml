aura-break:
  changelog: {  }
  effect:
    en: 'While this Pokémon is on the field, []{ability:dark-aura} and []{ability:fairy-aura} weaken moves of their respective types to 2/3 their power, rather than strengthening them.'
    de: 'Wenn sich ein Pokémon mit dieser Fähigkeit im Kampf befindet, werden die Attacken die normalerweise durch []{ability:dark-aura} und []{ability:fairy-aura} verstärkt werden, stattdessen um 2/3 Basisstärke gesenkt.'
  flavor_text:
    x-y:
      ja-Hrkt: |-
        オーラの　こうかが
        ぎゃくに　なる。
      ja: |-
        オーラの　効果が
        逆に　なる。
      ko: |-
        오라의 효과가
        반대가 된다.
      en: |-
        The effects of “Aura” Abilities
        are reversed.
      fr: 'L’effet des auras est inversé.'
      de: 'Kehrt die Wirkung von Auren um.'
      es: |-
        Invierte los efectos que causan
        las auras.
      it: |-
        Inverte gli effetti di tutte
        le aure.
    omega-ruby-alpha-sapphire:
      ja-Hrkt: |-
        オーラの　こうかが
        ぎゃくに　なる。
      ja: |-
