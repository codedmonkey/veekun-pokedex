stance-change:
  changelog: {  }
  effect:
    en: 'Changes []{pokemon:aegislash} to Blade Forme before using a damaging move, or Shield Forme before using []{move:kings-shield}.'
    de: |-
      Lässt []{pokemon:aegislash} zur Klingenform wechseln, wenn es einen Attacke einsetzt die Schaden verursacht, oder zur Schildform, wenn []{move:kings-shield} eingesetzt wird.

      Die Fähigkeit löst auch aus, wenn die Ausführung der Attacke verhindert wird, z.B. durch []{mechanic:sleep} oder []{mechanic:confusion}. Die Fähigkeit löst nicht aus bei Attacken die andere Attacken aufrufen, so wie []{move:sleep-talk}, selbst wenn dabei []{move:kings-shield} oder eine Attacke die Schaden verursacht aufgerufen wird.

      Die Fähigkeit hat keinen Effekt für Pokémon außer []{pokemon:aegislash}.
  flavor_text:
    x-y:
      ja-Hrkt: |-
        せんとうモードで
        すがたが　かわる。
      ja: |-
        戦闘モードで
        姿が　変わる。
      ko: |-
        배틀모드에서
        모습이 바뀐다.
      en: |-
        The Pokémon changes form
        depending on how it battles.
      fr: |-
        Change de forme selon la façon
        dont le Pokémon se bat.
      de: |-
        Das Pokémon nimmt je nach
        Kampftaktik eine andere Form an.
      es: |-
        Cambia de forma según su estilo
        de combate.
      it: |-
        L’aspetto del Pokémon cambia
        in base alla modalità di lotta.
