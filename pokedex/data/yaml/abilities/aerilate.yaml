aerilate:
  changelog: {  }
  effect:
    en: "Turns the bearer's []{type:normal}-type moves into []{type:flying}-type moves.  Moves changed by this ability have 1.3× their power."
    de: 'Die []{type:normal} Attacken von Pokémon mit dieser Fäigkeit werden zu []{type:flying} Attacken. Attacken die durch diese Fähigkeit beeinflusst werden, haben 1,3× so viel Basisstärke wie sonst.'
  flavor_text:
    x-y:
      ja-Hrkt: |-
        ノーマルタイプの　わざが
        ひこうタイプになる。
      ja: |-
        ノーマルタイプの　技が
        ひこうタイプになる。
      ko: |-
        노말타입의 기술이
        비행타입이 된다.
      en: |-
        Normal-type moves become
        Flying-type moves.
      fr: |-
        Les capacités de type Normal
        deviennent de type Vol.
      de: |-
        Attacken vom Typ Normal
        nehmen den Typ Flug an.
      es: |-
        Convierte movimientos de tipo
        Normal en tipo Volador.
      it: |-
        Le mosse di tipo Normale
        diventano di tipo Volante.
