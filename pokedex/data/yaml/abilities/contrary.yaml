contrary:
  changelog: {  }
  effect:
    en: "Whenever this Pokémon's stats would be [raised]{mechanic:stat-modifiers}, they are instead lowered by the same amount, and vice versa."
    de: 'Wenn ein Statuswert eines Pokémons mit dieser Fähigkeit [erhöht]{mechanic:stat-modifier} werden würde, wird er stattdessen um die selbe Anzahl Stufen [gesenkt]{mechanic:stat-modifier}'
  flavor_text:
    black-white:
      en: |-
        Makes stat changes have
        an opposite effect.
      fr: |-
        Inverse les variations
        de stats.
    black-2-white-2:
      en: |-
        Makes stat changes have
        an opposite effect.
    x-y:
      ja-Hrkt: |-
        のうりょくの　へんかが
        ぎゃくてんする。
      ja: |-
        能力の　変化が
        逆転する。
      ko: |-
        능력의 변화가
        역전된다.
      en: |-
        Makes stat changes have
        an opposite effect.
      fr: 'Inverse les variations de stats.'
      de: |-
        Statusveränderungen werden
        umgekehrt.
      es: |-
        Invierte los cambios en las
        características.
      it: |-
        Le modifiche alle statistiche
        hanno effetto inverso.
