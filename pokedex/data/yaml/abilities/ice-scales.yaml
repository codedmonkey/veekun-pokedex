  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        こおりのりんぷんに　まもられて
        とくしゅこうげきで　うける
        ダメージが　はんげん　する。
      ja: |-
        こおりのりんぷんに　守られて
        特殊攻撃で　受ける
        ダメージが　半減　する。
      ko: |-
        얼음인분의 보호를 받아
        특수공격으로 받는
        데미지가 절반이 된다.
      zh-Hant: |-
        得到冰鱗粉的守護，
        受到的特殊攻擊傷害會減半。
      zh-Hans: |-
        由于有冰鳞粉的守护，
        受到的特殊攻击伤害会减半。
      en: |-
        The Pokémon is protected by ice scales, which halve
        the damage taken from special moves.
      fr: |-
        Le Pokémon est protégé par des écailles de glace.
        Les dégâts qu’il subit par des capacités spéciales
        sont divisés par deux.
      de: |-
        Halbiert mithilfe von schützendem Eisflügelstaub den
        Schaden, den das Pokémon durch Spezial-Attacken
        erleidet.
      es: |-
        Las gélidas escamas que protegen su cuerpo reducen a
        la mitad el daño que le infligen los ataques especiales.
      it: |-
        Scaglie di ghiaccio proteggono il Pokémon dalle mosse
        speciali, dimezzandone i danni subiti.
