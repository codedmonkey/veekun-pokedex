water-absorb:
  changelog: {  }
  effect:
    en: |-
      Whenever a []{type:water}-type move hits this Pokémon, it heals for 1/4 of its maximum [HP]{mechanic:hp}, negating any other effect on it.

      Water moves will ignore this Pokémon's []{move:substitute}.
    de: |-
      Wenn ein Pokémon mit dieser Fähigkeit von einer []{type:water} Attacke getroffen wird, wird es um 1/4 seiner maximalen []{mechanic:hp} geheilt. Jeder andere Effekt der Attacke wird ignoriert.

      []{type:water} Attacken ignorieren den []{move:substitute} dieses Pokémons.
