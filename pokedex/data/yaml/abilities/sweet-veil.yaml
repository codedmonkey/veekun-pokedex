sweet-veil:
  changelog: {  }
  effect:
    en: 'Prevents friendly Pokémon from sleeping.'
    de: 'Pokémon können nicht [einschlafen]{mechanic:sleep} solange sich ein Pokémon mit dieser Fähigkeit im Team befindet.'
  flavor_text:
    x-y:
      ja-Hrkt: |-
        みかたの　ポケモンは
        ねむらなくなる。
      ja: |-
        味方の　ポケモンは
        眠らなくなる。
      ko: |-
        같은 편의 포켓몬이
        잠들지 않게 된다.
      en: |-
        Prevents itself and ally Pokémon
        from falling asleep.
      fr: |-
        Les Pokémon de l’équipe ne
        peuvent pas s’endormir.
      de: |-
        Alle Pokémon im Team können
        nicht einschlafen.
      es: |-
        Evita que tu equipo Pokémon
        se duerma.
      it: |-
        Impedisce a sé e agli alleati
        di addormentarsi.
