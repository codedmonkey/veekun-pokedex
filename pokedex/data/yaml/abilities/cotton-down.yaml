cotton-down:
  changelog: {  }
  effect: {  }
  flavor_text:
    sword-shield:
      ja-Hrkt: |-
        こうげきを　うけると　わたげを　ばらまいて
        じぶんいがいの　ポケモン　すべての
        すばやさを　さげる。
      ja: |-
        攻撃を　受けると　わたげを　ばらまいて
        自分以外の　ポケモン　すべての
        素早さを　下げる。
      ko: |-
        공격을 받으면 솜털을 흩뿌려서
        자신을 제외한 모든 포켓몬의
        스피드를 떨어뜨린다.
      zh-Hant: |-
        受到攻擊時會撒下棉絮，
        降低除自己以外的
        所有寶可夢的速度。
      zh-Hans: |-
        受到攻击后撒下棉絮，
        降低除自己以外的
        所有宝可梦的速度。
      en: |-
        When the Pokémon is hit by an attack, it scatters
        cotton fluff around and lowers the Speed stat of
        all Pokémon except itself.
      fr: |-
        Quand le Pokémon est touché par une attaque,
        il dissémine des aigrettes qui diminuent la Vitesse
        de tout le monde, sauf la sienne.
      de: |-
        Wird es von einem Angriff getroffen, verstreut es Teile
        seines Wollflaums, wodurch die Initiative aller anderen
        Pokémon sinkt.
      es: |-
        Al ser alcanzado por un ataque, suelta una pelusa de
        algodón que reduce la Velocidad de todos los demás
        Pokémon.
      it: |-
        Se il Pokémon subisce un attacco, sparge della lanugine
        che diminuisce la Velocità di tutti i Pokémon in campo
        tranne la sua.
  generation: generation-viii
  is_main_series: true
  name:
    ja-Hrkt: わたげ
    ja: わたげ
    ko: 솜털
    zh-Hant: 棉絮
    zh-Hans: 棉絮
    en: 'Cotton Down'
    fr: Effilochage
    de: Wollflaum
    es: Pelusa
    it: Lanugine
  short_effect: {  }
