liquid-ooze:
  changelog: {  }
  effect:
    en: |-
      Whenever a Pokémon would heal after hitting this Pokémon with a leeching move like []{move:absorb}, it instead loses as many [HP]{mechanic:hp} as it would usually gain.

      []{move:dream-eater} is unaffected.
    de: |-
      Wenn ein Pokémon mit dieser Fähigkeit von einer absorbierenden Attacke wie []{move:absorb} getroffen wird, erleidet der Gegner so viele []{mechanic:hp} Schaden wie ihn die Attacke geheilt hätte.

      []{move:dream-eater} ist davon nicht betroffen.
