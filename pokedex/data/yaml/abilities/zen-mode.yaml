zen-mode:
  changelog: {  }
  effect:
    en: |-
      This Pokémon switches between Standard Mode and Zen Mode after each turn depending on its [HP]{mechanic:hp}.  Below 50% of its maximum HP, it switches to Zen Mode, and at 50% or above, it switches to Standard Mode.

      This Pokémon returns to Standard Mode upon leaving battle or losing this ability.  This ability has no effect if this Pokémon is not a []{pokemon:darmanitan}.
    de: |-
      []{pokemon:darmanitan} wechselt am Ende jeder Runde zwischen dem Standard Modus und dem Zen Modus, abhängig von seinen []{mechanic:hp}. Wenn es weniger als 50% seiner maximalen []{mechanic:hp} hat, wechselt es zum Zen Modus, bei 50% oder mehr zum Standard Modus.

      []{pokemon:darmanitan} wechselt zum Standard Modus beim Beenden des Kampfes oder wenn es die Fähigkeit verliert. Die Fähigkeit hat keinen Effekt für Pokémon außer []{pokemon:darmanitan}.
