        ＨＰも　回復する。
      ko: |-
        나무열매를 먹으면
        HP도 회복한다.
      en: |-
        Restores HP as well when
        the Pokémon eats a Berry.
      fr: |-
        Rend des PV lorsque le Pokémon
        consomme une Baie.
      de: |-
        Heilt beim Konsum
        von Beeren KP.
      es: 'Recupera PS al comer bayas.'
      it: |-
        Fa recuperare PS quando
        il Pokémon mangia una bacca.
