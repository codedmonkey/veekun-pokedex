cheek-pouch:
  changelog: {  }
  effect:
    en: "Restores HP upon eating a Berry, in addition to the Berry's effect."
    de: |-
      Wenn ein Pokémon mit dieser Fähigkeit eine Beere isst, stellt es 1/3 seiner maximalen []{mechanic:hp} wieder her, zusätzlich zum eigentlichen Effekt der Beere.

      Die Fähigkeit wirkt auch, wenn das Pokémon die Beere durch []{move:fling}, []{move:bug-bite} oder []{move:pluck} erhalten hat, solange es von der Beere profitiert.

      Die Fähigkeit wirkt nicht, wenn die Beere mit []{move:natural-gift} verbraucht wird.
  flavor_text:
