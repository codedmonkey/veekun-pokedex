specific-move:
  description:
    en: 'One specific move.  How this move is chosen depends upon on the move being used.'
    de: 'Eine spezifische Fähigkeit.  Wie diese Fähigkeit genutzt wird hängt von den genutzten Fähigkeiten ab.'
  name:
    en: 'Specific move'
    de: 'Spezifische Fähigkeit'
selected-pokemon-me-first:
  description:
    en: 'One other Pokémon on the field, selected by the trainer.  Stolen moves reuse the same target.'
    de: 'Ein anderes vom Trainer ausgewähltes Pokémon auf dem Feld.  Gestohlene Fähigkeiten nutzen das selbe Ziel.'
    cs: |-
      Druhý Pokémon na bojišti, vybraný trenérem.

      Ukradené útoky použijí stejný cíl.
  name:
    en: 'Selected Pokémon'
    de: 'Ausgewähltes Pokémon'
    cs: 'Vybraný Pokémon'
ally:
  description:
    en: "The user's ally (if any)."
    de: 'Die Partner des Anwenders (wenn vorhanden).'
    cs: 'Spolubojovník uživatele (je-li nějaký).'
  name:
    en: Ally
    de: Partner
    cs: Spolubojovník
users-field:
  description:
    en: "The user's side of the field.  Affects the user and its ally (if any)."
    de: 'Die Seite des Anwenders auf dem Feld.  Betrifft den Anwender und seine Partner (wenn vorhanden).'
    cs: |-
      Uživatelova strana bojiště.

      Působí na uživatele i jeho spolubojovníky (jsou-li nějací)
  name:
    en: "User's field"
    de: 'Seite des Anwenders'
    cs: 'Strana uživatele'
user-or-ally:
  description:
    en: 'Either the user or its ally, selected by the trainer.'
    de: 'Entweder der Anwender oder seine Partner. Der Trainer kann es aussuchen.'
    cs: 'Buď uživatel nebo jeho spolubojovník, podle trenéra.'
  name:
    en: 'User or ally'
    de: 'Anwender oder Partner'
    cs: 'Uživatel nebo spolubojovník'
opponents-field:
  description:
    en: 'The opposing side of the field.  Affects opposing Pokémon.'
    de: 'Die andere Seite des Feldes.  Betrifft gegnerische Pokémon.'
    cs: |-
      Opačná strana bojiště.

      Působí na protivníky.
  name:
    en: "Opponent's field"
    de: 'Gegnerisches Feld'
    cs: 'Strana protivnika'
user:
  description:
    en: 'The user.'
    de: 'Der Anwender.'
    cs: 'Působí na uživatele.'
  name:
    en: User
    de: Anwender
    cs: Uživatel
random-opponent:
  description:
    en: 'One opposing Pokémon, selected at random.'
    de: 'Ein zufälliges gegnerische Pokémon.'
    cs: 'Jeden protivník, vybraný náhodně.'
  name:
    en: 'Random opponent'
    de: 'Zufälliger Gegner'
    cs: 'Náhodný protivník'
all-other-pokemon:
  description:
    en: 'Every other Pokémon on the field.'
    de: 'Jedes andere Pokémon auf dem Feld.'
    cs: 'Každý pokémon na poli, kromě uživatele.'
  name:
    en: 'All other Pokémon'
    de: 'Alle anderen Pokémon'
    cs: 'Všichni ostatní pokémoni'
selected-pokemon:
  description:
    en: 'One other Pokémon on the field, selected by the trainer.'
    de: 'Ein anderes Pokémon auf dem Feld, welches vom Trainer ausgewählt wird.'
    cs: 'Jeden pokémon na poli kromě uživatele, vybraný trenérem. '
  name:
    en: 'Selected Pokémon'
    de: 'Ausgewähltes Pokémon'
    cs: 'Vybraný Pokémon'
all-opponents:
  description:
    en: 'All opposing Pokémon.'
    de: 'Alle gegnerischen Pokémon.'
    cs: 'Všichni protivníci.'
  name:
    en: 'All opponents'
    de: 'Alle Gegner'
    cs: 'Všichni protivníci'
entire-field:
  description:
    en: 'The entire field.  Affects all Pokémon.'
    de: 'Das komplette Feld.  Betrifft alle Pokémon.'
  name:
    en: 'Entire field'
    de: 'Komplette Feld'
user-and-allies:
  description:
    en: 'The user and its allies.'
    de: 'Der Anwender und seine Partner.'
  name:
    en: 'User and allies'
    de: 'Anwender und Partner'
all-pokemon:
  description:
    en: 'Every Pokémon on the field.'
    de: 'Jedes Pokémon auf dem Feld.'
  name:
    en: 'All Pokémon'
    de: 'Jedes Pokémon'
