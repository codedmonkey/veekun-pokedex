    cs: 'Tím silnější, čím je uživatel méně ochočený. Maximální síla je 102.'
move-effect-125:
  changelog: {  }
  effect:
    en: |-
      Protects Pokémon on the user's side of the [field]{mechanic:field} from [major status]{mechanic:major-status} effects and [confusion]{mechanic:confusion} for five turns.  Does not cancel existing ailments.  This effect remains even if the user leaves the [field]{mechanic:field}.

      If []{move:yawn} is used while this move is in effect, it will immediately [fail]{mechanic:fail}.

      []{move:defog} used by an opponent will end this effect.

      This effect does not prevent the [confusion]{mechanic:confusion} caused by []{move:outrage}, []{move:petal-dance}, or []{move:thrash}.
  short_effect:
    en: "Protects the user's field from major status ailments and confusion for five turns."
    cs: 'Po pět kol chrání pokémony uživatelově straně proti změnám stavu a zmatení.'
move-effect-126:
  changelog: {  }
  effect:
    en: 'Inflicts [regular damage]{mechanic:regular-damage}.  Has a $effect_chance% chance to [burn]{mechanic:burn} the target.  [Frozen]{mechanic:frozen} Pokémon may use this move, in which case they will thaw.'
  short_effect:
    en: 'Has a $effect_chance% chance to [burn]{mechanic:burn} the target.  Lets frozen Pokémon thaw themselves.'
move-effect-127:
  changelog: {  }
  effect:
    en: |-
      Inflicts [regular damage]{mechanic:regular-damage}.  Power is selected at random between 10 and 150, with an average of 71:

      Magnitude | Power | Chance
      --------: | ----: | -----:
              4 |    10 |     5%
              5 |    30 |    10%
              6 |    50 |    20%
              7 |    70 |    30%
              8 |    90 |    20%
              9 |   110 |    10%
             10 |   150 |     5%

      This move has double power against Pokémon currently underground due to []{move:dig}.
  short_effect:
    en: 'Power varies randomly from 10 to 150.'
move-effect-128:
  changelog: {  }
  effect:
    en: |-
      User [switches out]{mechanic:switches-out}, and the trainer selects a replacement Pokémon from the party.  [Stat]{mechanic:stat} changes, [confusion]{mechanic:confusion}, and persistent move effects are passed along to the replacement Pokémon.

      The following move effects are passed:

      * []{move:aqua-ring}
      * both the user's and target's effect of []{move:block}, []{move:mean-look}, and []{move:spider-web}
      * the curse effect of []{move:curse}
      * []{move:embargo}
      * []{move:focus-energy} or an activated []{item:lansat-berry}
      * []{move:gastro-acid}
      * []{move:ingrain}
      * being sapped by []{move:leech-seed}
      * being targeted by []{move:lock-on} or []{move:mind-reader}
      * []{move:magnet-rise}
      * []{move:perish-song}'s counter
      * []{move:power-trick}
      * []{move:substitute}; the doll's HP is unchanged

      The replacement Pokémon does not trigger effects that respond to Pokémon switching in.
  short_effect:
    en: 'Allows the trainer to switch out the user and pass effects along to its replacement.'
move-effect-129:
  changelog: {  }
  effect:
    en: |-
      Inflicts [regular damage]{mechanic:regular-damage}.  If the target attempts to [switch out]{mechanic:switch-out} this turn before the user acts, this move hits the target before it leaves and has double power.

      This effect can still hit a Pokémon that [switches out]{mechanic:switches-out} when it has a []{move:substitute} up or when an ally has used []{move:follow-me}.
  short_effect:
    en: 'Has double power against, and can hit, Pokémon attempting to switch out.'
move-effect-130:
  changelog: {  }
  effect:
    en: "Inflicts [regular damage]{mechanic:regular-damage}.  Removes []{move:leech-seed} from the user, frees the user from []{move:bind}, []{move:clamp}, []{move:fire-spin}, []{move:magma-storm}, []{move:sand-tomb}, []{move:whirlpool}, and []{move:wrap}, and clears []{move:spikes}, []{move:stealth-rock}, and []{move:toxic-spikes} from the user's side of the [field]{mechanic:field}.  If this move misses or has [no effect]{mechanic:no-effect}, its effect doesn't activate."
  short_effect:
    en: 'Frees the user from binding moves, removes Leech Seed, and blows away Spikes.'
move-effect-131:
  changelog: {  }
  effect:
    en: 'Inflicts exactly 20 damage.'
  short_effect:
    en: 'Inflicts 20 points of damage.'
move-effect-133:
  changelog: {  }
  effect:
    en: |-
      Heals the user for half its max [HP]{mechanic:hp}.

      During []{move:sunny-day}, the healing is increased to 2/3 max [HP]{mechanic:hp}.

      During []{move:hail}, []{move:rain-dance}, or []{move:sandstorm}, the healing is decreased to 1/4 max [HP]{mechanic:hp}.
  short_effect:
    en: 'Heals the user by half its max HP.  Affected by weather.'
    cs: 'Uzdraví uživatele za 1/2 max. HP. Ovlivněno počasím.'
move-effect-136:
  changelog: {  }
  effect:
    en: |-
      Inflicts [regular damage]{mechanic:regular-damage}.  Power and type are determined by the user's [IV]{mechanic:iv}s.

      Power is given by `x * 40 / 63 + 30`.  `x` is obtained by arranging bit 1 from the [IV]{mechanic:iv} for each of [Special Defense]{mechanic:special-defense}, [Special Attack]{mechanic:special-attack}, [Speed]{mechanic:speed}, [Defense]{mechanic:defense}, [Attack]{mechanic:attack}, and [HP]{mechanic:hp} in that order.  (Bit 1 is 1 if the [IV]{mechanic:iv} is of the form `4n + 2` or `4n + 3`.  `x` is then 64 * [Special Defense]{mechanic:special-defense} [IV]{mechanic:iv} bit 1, plus 32 * [Special Attack]{mechanic:special-attack} [IV]{mechanic:iv} bit 1, etc.)

      Power is always between 30 and 70, inclusive.  Average power is 49.5.

      Type is given by `y * 15 / 63`, where `y` is similar to `x` above, except constructed from bit 0.  (Bit 0 is 1 if the [IV]{mechanic:iv} is odd.)  The result is looked up in the following table.

      Value | Type
      ----: | --------
          0 | []{type:fighting}
          1 | []{type:flying}
          2 | []{type:poison}
          3 | []{type:ground}
          4 | []{type:rock}
          5 | []{type:bug}
          6 | []{type:ghost}
          7 | []{type:steel}
          8 | []{type:fire}
          9 | []{type:water}
         10 | []{type:grass}
         11 | []{type:electric}
         12 | []{type:psychic}
         13 | []{type:ice}
         14 | []{type:dragon}
         15 | []{type:dark}

      This move thus cannot be []{type:normal}.  Most other types have an equal 1/16 chance to be selected, given random [IV]{mechanic:iv}s.  However, due to the flooring used here, []{type:bug}, []{type:fighting}, and []{type:grass} appear 5/64 of the time, and []{type:dark} only 1/64 of the time.
  short_effect:
    en: "Power and type depend upon user's IVs.  Power can range from 30 to 70."
    cs: 'Síla a typ závisí na uživatelových genech. Síla může být od 30 do 70.'
move-effect-137:
  changelog: {  }
  effect:
    en: |-
      Changes the weather to rain for five turns, during which []{type:water} moves inflict 50% extra damage, and []{type:fire} moves inflict half damage.

      If the user is holding []{item:damp-rock}, this effect lasts for eight turns.

      []{move:thunder} has 100% accuracy.  If the target has used []{move:detect} or []{move:protect}, []{move:thunder} has a (100 - accuracy)% chance to break through the protection.

      []{move:solar-beam} has half power.

      []{move:moonlight}, []{move:morning-sun}, and []{move:synthesis} heal only 1/4 of the user's max [HP]{mechanic:hp}.

      Pokémon with []{ability:swift-swim} have doubled original [Speed]{mechanic:speed}.

      Pokémon with []{ability:forecast} become []{type:water}.

      Pokémon with []{ability:dry-skin} heal 1/8 max [HP]{mechanic:hp}, Pokémon with []{ability:hydration} are cured of [major status effects]{mechanic:major-status-effects}, and Pokémon with []{ability:rain-dish} heal 1/16 max [HP]{mechanic:hp} at the end of each turn.
  short_effect:
    en: 'Changes the weather to rain for five turns.'
    cs: 'Na pět kol způsobí déšť.'
move-effect-138:
  changelog: {  }
  effect:
    en: |-
      Changes the weather to sunshine for five turns, during which []{type:fire} moves inflict 50% extra damage, and []{type:water} moves inflict half damage.

      If the user is holding []{item:heat-rock}, this effect lasts for eight turns.

      Pokémon cannot become [frozen]{mechanic:frozen}.

      []{move:thunder} has 50% accuracy.

      []{move:solar-beam} skips its charge turn.

      []{move:moonlight}, []{move:morning-sun}, and []{move:synthesis} heal 2/3 of the user's max [HP]{mechanic:hp}.

      Pokémon with []{ability:chlorophyll} have doubled original [Speed]{mechanic:speed}.

      Pokémon with []{ability:forecast} become []{type:fire}.

      Pokémon with []{ability:leaf-guard} are not affected by [major status effects]{mechanic:major-status-effects}.

      Pokémon with []{ability:flower-gift} change form; every Pokémon on their side of the [field]{mechanic:field} have their original [Attack]{mechanic:attack} and [Special Attack]{mechanic:special-attack} increased by 50%.

      Pokémon with []{ability:dry-skin} lose 1/8 max [HP]{mechanic:hp} at the end of each turn.

      Pokémon with []{ability:solar-power} have their original [Special Attack]{mechanic:special-attack} raised by 50% but lose 1/8 their max [HP]{mechanic:hp} at the end of each turn.
  short_effect:
    en: 'Changes the weather to sunny for five turns.'
    cs: 'Na pět kol způsobí, že slunce svítí jasněji než normálně.'
move-effect-139:
  changelog: {  }
  effect:
    en: "Inflicts [regular damage]{mechanic:regular-damage}. Has a $effect_chance% chance to raise the user's [Defense]{mechanic:defense} one [stage]{mechanic:stage}."
