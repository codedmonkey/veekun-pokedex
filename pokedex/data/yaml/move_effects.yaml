      Randomly uses one of the following effects.

      Effect                                             | Chance
      -------------------------------------------------- | -----:
      Inflicts [regular damage]{mechanic:regular-damage} with 40 power  |    40%
      Inflicts [regular damage]{mechanic:regular-damage} with 80 power  |    30%
