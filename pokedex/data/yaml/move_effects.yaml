      effect:
        en: 'Does not raise [Defense]{mechanic:defense}.'
  effect:
    en: |-
      Inflicts [regular damage]{mechanic:regular-damage}.  Raises the user's [Defense]{mechanic:defense} by one [stage]{mechanic:stage}.  User then charges for one turn before attacking.

      This move cannot be selected by []{move:sleep-talk}.
  short_effect:
    en: "Raises the user's Defense by one stage.  User charges for one turn before attacking."
    cs: 'Zvýší uživateli Obranu o jeden stupeň. Zaútočí až v následujícím kole.'
move-effect-147:
  changelog: {  }
  effect:
    en: |-
      Inflicts [regular damage]{mechanic:regular-damage}.  Has a $effect_chance% chance to make each target [flinch]{mechanic:flinch}.

      If the target is under the effect of []{move:bounce}, []{move:fly}, or []{move:sky-drop}, this move will hit with double power.
  short_effect:
    en: 'Has a $effect_chance% chance to make the target flinch.'
    cs: 'Má $effect_chance% šanci, že se protivník zalekne.'
move-effect-148:
  changelog:
    gold-silver:
      effect:
        en: 'Does not hit Pokémon under the effects of []{move:dig}.'
  effect:
    en: |-
      Inflicts [regular damage]{mechanic:regular-damage}.

      If the target is in the first turn of []{move:dig}, this move will hit with double power.
  short_effect:
    en: 'Inflicts regular damage and can hit Dig users.'
    cs: 'Normálně zraňuje; zasáhne i pokémony pod zemí.'
move-effect-149:
  changelog: {  }
  effect:
    en: |-
      Inflicts [typeless]{mechanic:typeless} [regular damage]{mechanic:regular-damage} at the end of the third turn, starting with this one.  This move cannot score a [critical hit]{mechanic:critical-hit}.  If the target [switches out]{mechanic:switches-out}, its replacement will be hit instead.  Damage is calculated at the time this move is used; [stat changes]{mechanic:stat-changes} and [switching out]{mechanic:switching-out} during the delay won't change the damage inflicted.  No move with this effect can be used against the same target again until after the end of the third turn.

      This effect breaks through []{ability:wonder-guard}.

      If the target is protected by []{move:protect} or []{move:detect} on the turn this move is used, this move will [fail]{mechanic:fail}.  However, the damage on the third turn will break through protection.

      The damage is applied at the end of the turn, so it ignores []{move:endure} and []{item:focus-sash}.

      This move cannot be copied by []{move:mirror-move}.
  short_effect:
    en: 'Hits the target two turns later.'
move-effect-150:
  changelog:
    gold-silver:
      effect:
        en: 'Does not hit Pokémon under the effects of []{move:fly}.'
  effect:
    en: |-
      Inflicts [regular damage]{mechanic:regular-damage}.

      If the target is under the effect of []{move:bounce}, []{move:fly}, or []{move:sky-drop}, this move will hit with double power.
  short_effect:
    en: 'Inflicts regular damage and can hit Pokémon in the air.'
move-effect-151:
  changelog:
    gold-silver:
      effect:
        en: 'Does not interact with []{move:minimize}.'
  effect:
    en: |-
      Inflicts [regular damage]{mechanic:regular-damage}.  Has a $effect_chance% chance to make the target [flinch]{mechanic:flinch}.

      Power is doubled against Pokémon that have used []{move:minimize} since entering the [field]{mechanic:field}.
  short_effect:
    en: 'Has a $effect_chance% chance to make the target flinch.'
    cs: 'Má $effect_chance% šanci, že se protivník zalekne.'
move-effect-152:
  changelog: {  }
  effect:
    en: |-
      Inflicts [regular damage]{mechanic:regular-damage}.  User charges for one turn before attacking.

      During []{move:sunny-day}, the charge turn is skipped.

      During []{move:hail}, []{move:rain-dance}, or []{move:sandstorm}, power is halved.

      This move cannot be selected by []{move:sleep-talk}.
  short_effect:
    en: 'Requires a turn to charge before attacking.'
    cs: 'První kolo se nabíjí, zaútočí až v druhém.'
move-effect-153:
  changelog:
    gold-silver:
      effect:
        en: 'Does not hit Pokémon under the effects of []{move:fly}.'
  effect:
    en: |-
      Inflicts [regular damage]{mechanic:regular-damage}.  Has a $effect_chance% chance to [paralyze]{mechanic:paralyze} the target.

      During []{move:rain-dance}, this move has 100% accuracy.  It also has a (100 - accuracy)% chance to break through the protection of []{move:protect} and []{move:detect}.

      During []{move:sunny-day}, this move has 50% accuracy.
  short_effect:
    en: 'Has a $effect_chance% chance to paralyze the target.'
    cs: 'Má $effect_chance% šanci paralyzovat protivníka.'
move-effect-154:
  changelog: {  }
  effect:
    en: 'Does nothing.  Wild battles end immediately.'
  short_effect:
    en: 'Immediately ends wild battles.  No effect otherwise.'
move-effect-155:
  changelog:
    black-white:
      effect:
        en: "Determines damage using each participant's base [Attack]{mechanic:attack} and the opponent's base [Defense]{mechanic:defense} in place of calculated stats."
  effect:
    en: |-
      Inflicts [typeless]{mechanic:typeless} [regular damage]{mechanic:regular-damage}.  Every Pokémon in the user's party, excepting those that have fainted or have a [major status effect]{mechanic:major-status-effect}, attacks the target.  Calculated stats are ignored; the base stats for the target and assorted attackers are used instead.  The random factor in the damage formula is not used.  []{type:dark} Pokémon still get [STAB]{mechanic:stab}.

      This effect breaks through []{ability:wonder-guard}.
  short_effect:
    en: 'Hits once for every conscious Pokémon the trainer has.'
move-effect-156:
  changelog:
    gold-silver:
      effect:
        en: "[]{move:swift} can hit the user while in the air, and no other moves can.  Due to a bug, if the user fails to carry out the move's second turn, e.g. due to [paralysis]{mechanic:paralysis}, it remains in the air until it switches out or uses Fly again successfully.  It can act as if it were on the ground in the meantime, but moves still miss it."
  effect:
    en: |-
      Inflicts [regular damage]{mechanic:regular-damage}.  User flies high into the air for one turn, becoming immune to attack, and hits on the second turn.

      During the immune turn, []{move:gust}, []{move:hurricane}, []{move:sky-uppercut}, []{move:smack-down}, []{move:thunder}, []{move:twister}, and []{move:whirlwind} still hit the user normally.  []{move:gust} and []{move:twister} also have double power against the user.

      The damage from []{move:hail} and []{move:sandstorm} still applies during the immune turn.

      The user may be hit during its immune turn if under the effect of []{move:lock-on}, []{move:mind-reader}, or []{ability:no-guard}.

      This move cannot be used while []{move:gravity} is in effect.

      This move cannot be selected by []{move:sleep-talk}.
  short_effect:
    en: 'User flies high into the air, dodging all attacks, and hits next turn.'
move-effect-157:
  changelog: {  }
  effect:
    en: |-
      Raises user's [Defense]{mechanic:defense} by one [stage]{mechanic:stage}.

      After this move is used, the power of []{move:ice-ball} and []{move:rollout} are doubled until the user leaves the [field]{mechanic:field}.
  short_effect:
    en: "Raises user's Defense by one stage."
    cs: 'Zvýší uživatelovu Obranu o jeden stupeň.'
move-effect-159:
  changelog: {  }
  effect:
    en: "Inflicts [regular damage]{mechanic:regular-damage}.  Causes the target to []{mechanic:flinch}.  Can only be used on the user's first turn after entering the [field]{mechanic:field}."
  short_effect:
    en: 'Can only be used as the first move after the user enters battle.  Causes the target to flinch.'
move-effect-160:
  changelog: {  }
  effect:
    en: |-
      Inflicts [regular damage]{mechanic:regular-damage}.  User is forced to use this move for 2–5 turns, selected at random.  All Pokémon on the [field]{mechanic:field} wake up, and none can fall to [sleep]{mechanic:sleep} until the lock-in ends.

      Pokémon cannot use []{move:rest} during this effect.

      This move cannot be selected by []{move:sleep-talk}.
  short_effect:
    en: 'Forced to use this move for several turns.  Pokémon cannot fall asleep in that time.'
    cs: 'Používá se po několik kol stále dokola. Mezitím pokémoni nemohou usnout.'
move-effect-161:
  changelog:
    diamond-pearl:
      effect:
        en: 'Does not raise [Defense]{mechanic:defense} or [Special Defense]{mechanic:special-defense}.'
  effect:
    en: |-
      Raises the user's [Defense]{mechanic:defense} and [Special Defense]{mechanic:special-defense} by one [stage]{mechanic:stage} each.  Stores energy for use with []{move:spit-up} and []{move:swallow}.  Up to three levels of energy can be stored, and all are lost if the user leaves the [field]{mechanic:field}.  Energy is still stored even if the stat boosts cannot be applied.

      If the user uses []{move:baton-pass}, the stat boosts are passed as normal, but the stored energy is not.
  short_effect:
    en: 'Stores energy up to three times for use with Spit Up and Swallow.'
move-effect-162:
  changelog: {  }
  effect:
    en: |-
      Inflicts [regular damage]{mechanic:regular-damage}.  Power is equal to 100 times the amount of energy stored by []{move:stockpile}.  Ignores the random factor in the damage formula.  Stored energy is consumed, and the user's [Defense]{mechanic:defense} and [Special Defense]{mechanic:special-defense} are reset to what they would be if []{move:stockpile} had not been used.  If the user has no energy stored, this move will [fail]{mechanic:fail}.

      This move cannot be copied by []{move:mirror-move}.
  short_effect:
    en: 'Power is 100 times the amount of energy Stockpiled.'
move-effect-163:
  changelog: {  }
  effect:
    en: "Heals the user depending on the amount of energy stored by []{move:stockpile}: 1/4 its max [HP]{mechanic:hp} after one use, 1/2 its max [HP]{mechanic:hp} after two uses, or fully after three uses.  Stored energy is consumed, and the user's [Defense]{mechanic:defense} and [Special Defense]{mechanic:special-defense} are reset to what they would be if []{move:stockpile} had not been used.  If the user has no energy stored, this move will [fail]{mechanic:fail}."
  short_effect:
    en: 'Recovers 1/4 HP after one Stockpile, 1/2 HP after two Stockpiles, or full HP after three Stockpiles.'
move-effect-165:
  changelog: {  }
  effect:
    en: |-
      Changes the weather to hail for five turns, during which non-[]{type:ice} Pokémon are damaged for 1/16 their max [HP]{mechanic:hp} at the end of every turn.

      If the user is holding []{item:icy-rock}, this effect lasts for eight turns.

      []{move:blizzard} has 100% accuracy.  If the target has used []{move:detect} or []{move:protect}, []{move:blizzard} has a (100 - accuracy)% chance to break through the protection.

      []{move:moonlight}, []{move:morning-sun}, and []{move:synthesis} heal only 1/4 of the user's max [HP]{mechanic:hp}.

      Pokémon with []{ability:snow-cloak} are exempt from this effect's damage.
  short_effect:
    en: 'Changes the weather to a hailstorm for five turns.'
    cs: 'Na pět kol přivolá padající kroupy.'
move-effect-166:
  changelog: {  }
  effect:
    en: |-
      Prevents the target from attempting to use the same move twice in a row.  When the target leaves the [field]{mechanic:field}, this effect ends.

      If the target is forced to attempt a repeated move due to []{item:choice-band}, []{item:choice-scarf}, []{item:choice-specs}, []{move:disable}, []{move:encore}, []{move:taunt}, only having [PP]{mechanic:pp} remaining for one move, or any other effect, the target will use []{move:struggle} instead.  The target is then free to use the forced move next turn, as it didn't use that move this turn.
  short_effect:
    en: 'Prevents the target from using the same move twice in a row.'
move-effect-167:
  changelog: {  }
  effect:
    en: "Raises the target's [Special Attack]{mechanic:special-attack} by one [stage]{mechanic:stage}, then [confuses]{mechanic:confuses} it."
  short_effect:
    en: "Raises the target's Special Attack by one stage and confuses the target."
move-effect-168:
  changelog: {  }
  effect:
    en: '[Burns]{mechanic:burns} the target.'
  short_effect:
    en: 'Burns the target.'
move-effect-169:
  changelog: {  }
  effect:
    en: "Lowers the target's [Attack]{mechanic:attack} and [Special Attack]{mechanic:special-attack} by two [stages]{mechanic:stage}.  User faints."
  short_effect:
    en: "Lowers the target's Attack and Special Attack by two stages.  User faints."
    cs: 'Sníží protivníkův Útok a Speciální útok o dva stupně. Uživatel omdlí.'
move-effect-170:
  changelog: {  }
  effect:
    en: 'Inflicts [regular damage]{mechanic:regular-damage}.  If the user is [burned]{mechanic:burned}, [paralyzed]{mechanic:paralyzed}, or [poisoned]{mechanic:poisoned}, this move has double power.'
  short_effect:
    en: 'Power doubles if user is burned, paralyzed, or poisoned.'
    cs: 'Při popálení, paralýze nebo otravě má dvojnásobnou sílu.'
move-effect-171:
  changelog: {  }
  effect:
    en: |-
      Inflicts [regular damage]{mechanic:regular-damage}.  If the user takes damage this turn before hitting, this move will [fail]{mechanic:fail}.

      This move cannot be copied by []{move:mirror-move}, nor selected by []{move:assist}, []{move:metronome}, or []{move:sleep-talk}.
  short_effect:
    en: 'If the user takes damage before attacking, the attack is canceled.'
    cs: 'Pokud uživatel před zaútočením utrží zranění, tento útok se nepovede.'
move-effect-172:
  changelog: {  }
  effect:
    en: 'Inflicts [regular damage]{mechanic:regular-damage}.  If the target is [paralyzed]{mechanic:paralyzed}, this move has double power, and the target is cured of its [paralysis]{mechanic:paralysis}.'
  short_effect:
    en: 'If the target is paralyzed, inflicts double damage and cures the paralysis.'
move-effect-173:
  changelog: {  }
  effect:
    en: |-
      Until the end of this turn, any moves that opposing Pokémon target solely at the user's ally will instead target the user.  If both Pokémon on the same side of the [field]{mechanic:field} use this move on the same turn, the Pokémon that uses it last will become the target.

      This effect takes priority over []{ability:lightning-rod} and []{ability:storm-drain}.

      If the user's ally [switches out]{mechanic:switches-out}, opposing Pokémon may still hit it with []{move:pursuit}.

      This move cannot be selected by []{move:assist} or []{move:metronome}.
  short_effect:
    en: "Redirects the target's single-target effects to the user for this turn."
move-effect-174:
  changelog: {  }
  effect:
    en: |-
      Uses another move chosen according to the terrain.

      Terrain                   | Selected move
      ------------------------- | ------------------
      Building                  | []{move:tri-attack}
      Cave                      | []{move:rock-slide}
      Deep water                | []{move:hydro-pump}
      Desert                    | []{move:earthquake}
      Grass                     | []{move:seed-bomb}
      Mountain                  | []{move:rock-slide}
      Road                      | []{move:earthquake}
      Shallow water             | []{move:hydro-pump}
      Snow                      | []{move:blizzard}
      Tall grass                | []{move:seed-bomb}
      []{move:electric-terrain} | []{move:thunderbolt}
      []{move:grassy-terrain}   | []{move:energy-ball}
      []{move:misty-terrain}    | []{move:moonblast}

      In Pokémon Battle Revolution:

      Terrain        | Selected move
      -------------- | ------------------
      Courtyard      | []{move:tri-attack}
      Crystal        | []{move:rock-slide}
      Gateway        | []{move:hydro-pump}
      Magma          | []{move:rock-slide}
      Main Street    | []{move:tri-attack}
      Neon           | []{move:tri-attack}
      Stargazer      | []{move:rock-slide}
      Sunny Park     | []{move:seed-bomb}
      Sunset         | []{move:earthquake}
      Waterfall      | []{move:seed-bomb}

      This move cannot be copied by []{move:mirror-move}.
  short_effect:
    en: 'Uses a move which depends upon the terrain.'
    cs: 'Použije útok závislý na okolním prostředí.'
move-effect-175:
  changelog:
    diamond-pearl:
      effect:
        en: "Does not raise the user's [Special Defense]{mechanic:special-defense}."
  effect:
    en: "Raises the user's [Special Defense]{mechanic:special-defense} by one [stage]{mechanic:stage}.  If the user uses an []{type:electric} move next turn, its power will be doubled."
  short_effect:
    en: "Raises the user's Special Defense by one stage.  User's Electric moves have doubled power next turn."
    cs: 'Zvýší uživatelovu Speciální obranu o jeden stupeň. Jeho Elektrické útoky mají v příštím kole dvojnásobnou sílu.'
move-effect-176:
  changelog: {  }
  effect:
    en: |-
      Target is forced to only use damaging moves for the next 3–5 turns, selected at random.  Moves that select other moves not known in advance do not count as damaging.

      []{move:assist}, []{move:copycat}, []{move:me-first}, []{move:metronome}, []{move:mirror-move}, and []{move:sleep-talk} do not directly inflict damage and thus may not be used.

      []{move:bide}, []{move:counter}, []{move:endeavor}, []{move:metal-burst}, and []{move:mirror-coat} are allowed.
  short_effect:
    en: 'For the next few turns, the target can only use damaging moves.'
move-effect-177:
  changelog: {  }
  effect:
    en: |-
      Boosts the power of the target's moves by 50% until the end of this turn.

      This move cannot be copied by []{move:mirror-move}, nor selected by []{move:assist} or []{move:metronome}.
  short_effect:
    en: "Ally's next move inflicts half more damage."
move-effect-178:
  changelog: {  }
  effect:
    en: |-
      User and target permanently swap [held item]{mechanic:held-item}s.  Works even if one of the Pokémon isn't holding anything.  If either Pokémon is holding mail, this move will [fail]{mechanic:fail}.

      If either Pokémon has []{ability:multitype} or []{ability:sticky-hold}, this move will [fail]{mechanic:fail}.

      If this move results in a Pokémon obtaining []{item:choice-band}, []{item:choice-scarf}, or []{item:choice-specs}, and that Pokémon was the latter of the pair to move this turn, then the move it used this turn becomes its chosen forced move.  This applies even if both Pokémon had a choice item before this move was used.  If the first of the two Pokémon gains a choice item, it may select whatever choice move it wishes next turn.

      Neither the user nor the target can recover its item with []{move:recycle}.

      This move cannot be selected by []{move:assist} or []{move:metronome}.
  short_effect:
    en: 'User and target swap items.'
move-effect-179:
  changelog: {  }
  effect:
    en: |-
      User's ability is replaced with the target's until the user leaves the [field]{mechanic:field}.  Ignores [accuracy]{mechanic:accuracy} and [evasion]{mechanic:evasion} modifiers.

      If the target has []{ability:flower-gift}, []{ability:forecast}, []{ability:illusion}, []{ability:imposter}, []{ability:multitype}, []{ability:stance-change}, []{ability:trace}, []{ability:wonder-guard}, or []{ability:zen-mode}, this move will [fail]{mechanic:fail}.

      This move cannot be copied by []{move:mirror-move}.
  short_effect:
    en: "Copies the target's ability."
move-effect-180:
  changelog:
    black-white:
      effect:
        en: 'Heals replacement Pokémon by half of their max HP.'
  effect:
    en: "At the end of the next turn, user will be healed for half its max [HP]{mechanic:hp}.  If the user is [switched out]{mechanic:switched-out}, its replacement will be healed instead for half of the user's max HP.  If the user [faint]{mechanic:faint}s or is forcefully switched by []{move:roar} or []{move:whirlwind}, this effect will not activate."
  short_effect:
    en: 'User will recover half its max HP at the end of the next turn.'
move-effect-181:
  changelog: {  }
  effect:
    en: |-
      Uses a move from another Pokémon in the user's party, both selected at random.  Moves from fainted Pokémon can be used.  If there are no eligible Pokémon or moves, this move will [fail]{mechanic:fail}.

      This move will not select []{move:assist}, []{move:chatter}, []{move:circle-throw}, []{move:copycat}, []{move:counter}, []{move:covet}, []{move:destiny-bond}, []{move:detect}, []{move:dig}, []{move:dive}, []{move:dragon-tail}, []{move:endure}, []{move:feint}, []{move:fly} []{move:focus-punch}, []{move:follow-me}, []{move:helping-hand}, []{move:me-first}, []{move:metronome}, []{move:mimic}, []{move:mirror-coat}, []{move:mirror-move}, []{move:phantom-force} []{move:protect}, []{move:quick-guard}, []{move:roar} []{move:shadow-force}, []{move:sketch}, []{move:sleep-talk}, []{move:snatch}, []{move:struggle}, []{move:switcheroo}, []{move:thief}, []{move:trick}, []{move:whirlwind}, or []{move:wide-guard}.

      This move cannot be copied by []{move:mirror-move}, nor selected by []{move:metronome} or []{move:sleep-talk}.
  short_effect:
    en: "Randomly selects and uses one of the trainer's other Pokémon's moves."
move-effect-182:
  changelog: {  }
  effect:
    en: |-
      Prevents the user from [switching out]{mechanic:switching-out}.  User regains 1/16 of its max [HP]{mechanic:hp} at the end of every turn.  If the user was immune to []{type:ground} attacks, it will now take normal damage from them.

      []{move:roar} and []{move:whirlwind} will not affect the user.  The user cannot use []{move:magnet-rise}.

      The user may still use []{move:u-turn} to leave the [field]{mechanic:field}.

      This effect can be passed with []{move:baton-pass}.
  short_effect:
    en: 'Prevents the user from leaving battle.  User regains 1/16 of its max HP every turn.'
    cs: 'Nedovolí uživateli opustit zápas a léčí ho za 1/16 max. HP za kolo.'
move-effect-183:
  changelog: {  }
  effect:
    en: "Inflicts [regular damage]{mechanic:regular-damage}, then lowers the user's [Attack]{mechanic:attack} and [Defense]{mechanic:defense} by one [stage]{mechanic:stage} each."
  short_effect:
    en: "Lowers the user's Attack and Defense by one stage after inflicting damage."
    cs: 'Po zranění sníží uživateli Útok a Obranu o jeden stupeň.'
move-effect-184:
  changelog: {  }
  effect:
    en: |-
      The first non-damaging move targeting the user this turn that inflicts [major status effect]{mechanic:major-status-effect}s, [stat change]{mechanic:stat-change}s, or [trap]{mechanic:trap}ping effects will be reflected at its user.

      []{move:defog}, []{move:memento}, and []{move:teeter-dance} are not reflected.

      []{move:attract}, []{move:flatter}, []{move:gastro-acid}, []{move:leech-seed}, []{move:swagger}, []{move:worry-seed}, and []{move:yawn} are reflected.

      This move cannot be copied by []{move:mirror-move}.
  short_effect:
    en: 'Reflects back the first effect move used on the user this turn.'
move-effect-185:
  changelog: {  }
  effect:
    en: |-
      User recovers the last item consumed by the user or a Pokémon in its position on the [field]{mechanic:field}.  The item must be used again before it can be recovered by this move again.  If the user is holding an item, this move [fail]{mechanic:fail}s.

      Items taken or given away by []{move:covet}, []{move:knock-off}, []{move:switcheroo}, []{move:thief}, or []{move:trick} may not be recovered.
  short_effect:
    en: 'User recovers the item it last used up.'
move-effect-186:
  changelog: {  }
  effect:
    en: |-
      Inflicts [regular damage]{mechanic:regular-damage}.  If the target damaged the user this turn and was the last to do so, this move has double power.

      []{move:pain-split} does not count as damaging the user.
  short_effect:
    en: 'Inflicts double damage if the user takes damage before attacking this turn.'
    cs: 'Způsobí dvojnásobné zranění, pokud uživatel už byl toto kolo zraněn.'
move-effect-187:
  changelog:
    black-white:
      effect:
        en: 'The barriers are destroyed even if this move has [no effect]{mechanic:no-effect}.'
  effect:
    en: "Destroys any []{move:light-screen} or []{move:reflect} on the target's side of the [field]{mechanic:field}, then inflicts [regular damage]{mechanic:regular-damage}."
  short_effect:
    en: 'Destroys Reflect and Light Screen.'
    cs: 'Zruší Reflect a Light Screen.'
move-effect-188:
  changelog: {  }
  effect:
    en: |-
      Puts the target to [sleep]{mechanic:sleep} at the end of the next turn.  Ignores [accuracy]{mechanic:accuracy} and [evasion]{mechanic:evasion} modifiers.  If the target leaves the [field]{mechanic:field}, this effect is canceled.  If the target has a status effect when this move is used, this move will [fail]{mechanic:fail}.

      If the target is protected by []{move:safeguard} when this move is used, this move will [fail]{mechanic:fail}.

      []{ability:insomnia} and []{ability:vital-spirit} prevent the [sleep]{mechanic:sleep} if the target has either at the end of the next turn, but will not cause this move to [fail]{mechanic:fail} on use.
  short_effect:
    en: 'Target sleeps at the end of the next turn.'
move-effect-189:
  changelog: {  }
  effect:
    en: |-
      Inflicts [regular damage]{mechanic:regular-damage}.  Target loses its [held item]{mechanic:held-item}.

      Neither the user nor the target can recover its item with []{move:recycle}.

      If the target has []{ability:multitype} or []{ability:sticky-hold}, it will take damage but not lose its item.
  short_effect:
    en: 'Target drops its held item.'
    cs: 'Přinutí protivníka pustit drženou věc.'
move-effect-190:
  changelog: {  }
  effect:
    en: "Inflicts exactly enough damage to lower the target's [HP]{mechanic:hp} to equal the user's.  If the target's HP is not higher than the user's, this move has no effect.  Type immunity applies, but other type effects are ignored.  This effect counts as damage for moves that respond to damage."
  short_effect:
    en: "Lowers the target's HP to equal the user's."
    cs: 'Sníží protivníkovo HP na tolik, kolik má uživatel.'
move-effect-191:
  changelog: {  }
  effect:
    en: "Inflicts [regular damage]{mechanic:regular-damage}.  Power increases with the user's remaining [HP]{mechanic:hp} and is given by `150 * HP / max HP`, to a maximum of 150 when the user has full HP."
  short_effect:
    en: 'Inflicts more damage when the user has more HP remaining, with a maximum of 150 power.'
move-effect-192:
  changelog: {  }
  effect:
    en: |-
      User and target switch abilities.  Ignores [accuracy]{mechanic:accuracy} and [evasion]{mechanic:evasion} modifiers.

      If either Pokémon has []{ability:multitype} or []{ability:wonder-guard}, this move will [fail]{mechanic:fail}.
  short_effect:
    en: 'User and target swap abilities.'
move-effect-193:
