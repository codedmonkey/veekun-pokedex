    en: 'Only works on [sleep]{mechanic:sleep}ing Pokémon.  Gives the target a nightmare, damaging it for 1/4 its max [HP]{mechanic:hp} every turn.  If the target wakes up or leaves the [field]{mechanic:field}, this effect ends.'
  short_effect:
    en: "Target loses 1/4 its max HP every turn as long as it's asleep."
move-effect-109:
  changelog:
    gold-silver:
      effect:
        en: 'Does not interact with []{move:stomp}.'
    black-white:
      effect:
        en: 'Raises [evasion]{mechanic:evasion} by one stage.'
  effect:
    en: |-
      Raises the user's [evasion]{mechanic:evasion} by two [stages]{mechanic:stage}.

      []{move:stomp} and []{move:steamroller} have double power against Pokémon that have used this move since entering the [field]{mechanic:field}.
  short_effect:
    en: "Raises the user's evasion by two stages."
    cs: 'Zvýší uživatelovu Mrštnost obranu o dva stupně.'
move-effect-110:
  changelog: {  }
  effect:
    en: |-
      If the user is a []{type:ghost}: user pays half its max [HP]{mechanic:hp} to place a curse on the target, damaging it for 1/4 its max [HP]{mechanic:hp} every turn.
      Otherwise: Lowers the user's [Speed]{mechanic:speed} by one [stage]{mechanic:stage}, and raises its [Attack]{mechanic:attack} and [Defense]{mechanic:defense} by one [stage]{mechanic:stage} each.

      The curse effect is passed on by []{move:baton-pass}.

      This move cannot be copied by []{move:mirror-move}.
  short_effect:
    en: 'Ghosts pay half their max HP to hurt the target every turn.  Others decrease Speed but raise Attack and Defense.'
    cs: 'Duchové obětují 1/2 max. HP na kletbu, která protivníka zraňuje každé kolo. Ostatním sníží Rychlost a zvýší Útok a Obranu.'
move-effect-112:
  changelog: {  }
  effect:
    en: |-
      No moves will hit the user for the remainder of this turn.  If the user is last to act this turn, this move will [fail]{mechanic:fail}.

      If the user successfully used []{move:detect}, []{move:endure}, []{move:protect}, []{move:quick-guard}, or []{move:wide-guard} on the last turn, this move has a 50% chance to [fail]{mechanic:fail}.

      []{move:lock-on}, []{move:mind-reader}, and []{ability:no-guard} provide a (100 – accuracy)% chance for moves to break through this move.  This does not apply to one-hit KO moves ([]{move:fissure}, []{move:guillotine}, []{move:horn-drill}, and []{move:sheer-cold}); those are always blocked by this move.

      []{move:thunder} during []{move:rain-dance} and []{move:blizzard} during []{move:hail} have a 30% chance to break through this move.

      The following effects are not prevented by this move:

      * []{move:acupressure} from an ally
      * []{move:curse}'s curse effect
      * Delayed damage from []{move:doom-desire} and []{move:future-sight}; however, these moves will be prevented if they are used this turn
      * []{move:feint}, which will also end this move's protection after it hits
      * []{move:imprison}
      * []{move:perish-song}
      * []{move:shadow-force}
      * Moves that merely copy the user, such as []{move:transform} or []{move:psych-up}

      This move cannot be selected by []{move:assist} or []{move:metronome}.
  short_effect:
    en: 'Prevents any moves from hitting the user this turn.'
    cs: 'Znemožní jakémukoli útoku trefit toto kolo uživatele.'
move-effect-113:
  changelog: {  }
  effect:
    en: |-
      Scatters spikes around the opposing [field]{mechanic:field}, which damage opposing Pokémon that enter the [field]{mechanic:field} for 1/8 of their max [HP]{mechanic:hp}.  Pokémon immune to []{type:ground} moves are immune to this damage, except during []{move:gravity}.  Up to three layers of spikes may be laid down, adding 1/16 to the damage done: two layers of spikes damage for 3/16 max [HP]{mechanic:hp}, and three layers damage for 1/4 max [HP]{mechanic:hp}.

      []{ability:wonder-guard} does not block damage from this effect.

      []{move:rapid-spin} removes this effect from its user's side of the [field]{mechanic:field}.  []{move:defog} removes this effect from its target's side of the [field]{mechanic:field}.
  short_effect:
    en: 'Scatters Spikes, hurting opposing Pokémon that switch in.'
move-effect-114:
  changelog: {  }
  effect:
    en: "Resets the target's [evasion]{mechanic:evasion} to normal and prevents any further boosting until the target leaves the [field]{mechanic:field}.  A []{type:ghost} under this effect takes normal damage from []{type:normal} and []{type:fighting} moves.  This move itself ignores [accuracy]{mechanic:accuracy} and [evasion]{mechanic:evasion} modifiers."
  short_effect:
    en: "Forces the target to have no Evade, and allows it to be hit by Normal and Fighting moves even if it's a Ghost."
move-effect-115:
  changelog: {  }
  effect:
    en: |-
      Every Pokémon is given a counter that starts at 3 and decreases by 1 at the end of every turn, including this one.  When a Pokémon's counter reaches zero, that Pokémon [faint]{mechanic:faint}s.  A Pokémon that leaves the [field]{mechanic:field} will lose its counter; its replacement does not inherit the effect, and other Pokémon's counters remain.

      This effect is passed on by []{move:baton-pass}.

      This move cannot be copied by []{move:mirror-move}.
  short_effect:
    en: 'User and target both faint after three turns.'
move-effect-116:
  changelog: {  }
  effect:
    en: |-
      Changes the weather to a sandstorm for five turns.  Pokémon that are not []{type:ground}, []{type:rock}, or []{type:steel} take 1/16 their max [HP]{mechanic:hp} at the end of every turn.  Every []{type:rock} Pokémon's original [Special Defense]{mechanic:special-defense} is raised by 50% for the duration of this effect.

      []{move:solar-beam}'s power is halved.

      []{move:moonlight}, []{move:morning-sun}, and []{move:synthesis} only heal 1/4 the user's max [HP]{mechanic:hp}.
  short_effect:
    en: 'Changes the weather to a sandstorm for five turns.'
    cs: 'Na pět kol způsobí písečnou bouři.'
move-effect-117:
  changelog: {  }
  effect:
    en: |-
      The user's [HP]{mechanic:hp} cannot be lowered below 1 by any means for the remainder of this turn.

      If the user successfully used []{move:detect}, []{move:endure}, []{move:protect}, []{move:quick-guard}, or []{move:wide-guard} on the last turn, this move has a 50% chance to [fail]{mechanic:fail}.

      This move cannot be selected by []{move:assist} or []{move:metronome}.
  short_effect:
    en: "Prevents the user's HP from lowering below 1 this turn."
    cs: 'Uživateli toto kolo zůstane aspoň 1 HP.'
move-effect-118:
  changelog: {  }
  effect:
    en: |-
      Inflicts [regular damage]{mechanic:regular-damage}.  User is forced to use this move for five turns.  Power doubles every time this move is used in succession to a maximum of 16x, and resets to normal after the lock-in ends.  If this move misses or becomes unusable, the lock-in ends.

      If the user has used []{move:defense-curl} since entering the field, this move has double power.
  short_effect:
    en: 'Power doubles every turn this move is used in succession after the first, resetting after five turns.'
    cs: 'Kdy je tento útok používán stále dokola, jeho síla se prvních 5 kol vždy zdvojnásobí.'
move-effect-119:
  changelog: {  }
  effect:
    en: "Raises the target's [Attack]{mechanic:attack} by two [stages]{mechanic:stage}, then [confuses]{mechanic:confuses} it.  If the target's [Attack]{mechanic:attack} cannot be [raised]{mechanic:raised} by two [stages]{mechanic:stage}, the [confusion]{mechanic:confusion} is not applied."
  short_effect:
    en: "Raises the target's Attack by two stages and confuses the target."
    cs: 'Zvýší protivníkův Útok o dva stupně, a zmate ho.'
move-effect-120:
  changelog: {  }
  effect:
    en: 'Inflicts [regular damage]{mechanic:regular-damage}.  Power doubles after every time this move is used, whether consecutively or not, maxing out at 16x.  If this move misses or the user leaves the [field]{mechanic:field}, power resets.'
  short_effect:
