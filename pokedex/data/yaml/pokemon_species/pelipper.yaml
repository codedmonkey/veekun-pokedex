pelipper:
  base_happiness: 50
  capture_rate: 45
  color: yellow
  egg_groups:
    - water1
    - flying
  evolution_chain: wingull
  evolves_from: wingull
  flavor_text:
    ruby:
      en: |-
        PELIPPER is a flying transporter that
        carries small POKéMON and eggs inside
        its massive bill.This POKéMON builds its nest on steep
        cliffs facing the sea.
    sapphire:
      en: |-
        PELIPPER searches for food while in
        flight by skimming the wave tops.
        This POKéMON dips its large bill in thesea to scoop up food, then swallows
        everything in one big gulp.
    emerald:
      en: |-
        It skims the tops of waves as it flies.
        When it spots prey, it uses its large beak
        to scoop up the victim with water.
        It protects its eggs in its beak.
    firered:
      en: |-
        It is a flying transporter that carries
        small POKéMON in its beak. It bobs on the
        waves to rest its wings.
    leafgreen:
      en: |-
        It is a flying transporter that carries
        small POKéMON in its beak. It bobs on the
        waves to rest its wings.
    diamond:
      en: |-
        It dips its large bill in the sea,
        then scoops up numerous prey
        along with water.
    pearl:
      en: |-
        It acts as a delivery service by
        carrying small Pokémon in its bill.
        It bobs on the waves to rest.
    platinum:
      en: |-
        It is a messenger of the skies,
        carrying small Pokémon and
        eggs to safety in its bill.
    heartgold:
      en: |-
        It protects its young in its beak.
        It bobs on waves, resting on them
        on days when the waters are calm.
    soulsilver:
      en: |-
        It protects its young in its beak.
        It bobs on waves, resting on them
        on days when the waters are calm.
    black:
      en: |-
        It is a messenger of the skies,
        carrying small Pokémon and
        eggs to safety in its bill.
      fr: |-
        Ce messager du ciel transporte
        petits Pokémon et œufs dans son
        bec en toute sécurité.
    white:
      en: |-
        It is a messenger of the skies,
        carrying small Pokémon and
        eggs to safety in its bill.
      fr: |-
        Ce messager du ciel transporte
        petits Pokémon et œufs dans son
        bec en toute sécurité.
    black-2:
      en: |-
        Skimming the water’s surface, it dips
        its large bill in the sea, scoops up food
        and water, and carries it.
    white-2:
      en: |-
        Skimming the water’s surface, it dips
        its large bill in the sea, scoops up food
        and water, and carries it.
    x:
      ja-Hrkt: |-
        おおきな　クチバシを　うみに　いれて
        ひとすくいすると　エサが　たくさん
        はいっているという　すんぽうだ。
      ja: |-
        大きな　クチバシを　海に　入れて
        ひとすくいすると　エサが　たくさん
        入っているという　寸法だ。
      ko: |-
        큰 부리를 바다에 넣고 먹이를
        한 번에 많이 건져 올리려는
        속셈이다.
      en: |-
        It dips its large bill in the sea, then scoops up
        numerous prey along with water.
      fr: |-
        Il trempe son grand bec dans la mer pour charrier
        de l’eau et de nombreuses proies.
      de: |-
        Es taucht seinen großen Schnabel ins Wasser
        und fängt so eine Menge Beute.
      es: |-
        Hunde su gran pico en el mar para sacar numerosas
        presas junto con mucha agua.
      it: |-
        Immerge il suo enorme becco nel mare, raccogliendo
        acqua e numerose prede.
    'y':
      ja-Hrkt: |-
        くちのなかに　ちいさなポケモンや
        タマゴをいれて　あんぜんな　ばしょに
        とどけてくれる　そらの　はこびや。
      ja: |-
        口の中に　小さなポケモンや
        タマゴを入れて　安全な　場所に
        届けてくれる　空の　運び屋。
      ko: |-
        입속에 작은 포켓몬이나
        알을 넣고 안전한 장소로
        전해주는 하늘의 운반자.
      en: |-
        It is a messenger of the skies, carrying small
        Pokémon and eggs to safety in its bill.
      fr: |-
        Ce messager du ciel transporte petits Pokémon et
        Œufs dans son bec en toute sécurité.
      de: |-
        Ein Bote der Lüfte. Bringt Eier und kleine Pokémon
        in seinem Schnabel in Sicherheit.
      es: |-
        Transporta a pequeños Pokémon y Huevos en su pico
        hasta lugares seguros.
      it: |-
        È un corriere dei cieli e porta uova e piccoli Pokémon
        nel suo enorme becco.
    omega-ruby:
      ja-Hrkt: |-
        ちいさな　ポケモンや　タマゴを　クチバシに
        いれて　はこぶ　そらの　はこびやだ。
        うみべの　けわしい　がけに　すを　つくる。
      ja: |-
        小さな　ポケモンや　タマゴを　クチバシに
        入れて　運ぶ　空の　運び屋だ。
        海辺の　険しい　崖に　巣を　つくる。
      ko: |-
        작은 포켓몬이나 알을 부리에
        넣고 나르는 하늘의 운반자다.
        바닷가의 험한 절벽에 둥지를 만든다.
      en: |-
        Pelipper is a flying transporter that carries small Pokémon and
        eggs inside its massive bill. This Pokémon builds its nest on
        steep cliffs facing the sea.
      fr: |-
        Bekipan est un transporteur volant chargeant des petits
        Pokémon et des œufs dans son énorme bec. Ce Pokémon
        construit son nid sur les falaises, face à la mer.
      de: |-
        Pelipper transportiert kleine Pokémon und Eier in seinem
        riesigen Schnabel durch die Lüfte. Dieses Pokémon baut
        sein Nest auf steilen Klippen am Meer.
      es: |-
        Pelipper vuela transportando pequeños huevos y Pokémon
        dentro del descomunal pico que tiene. Este Pokémon
        construye su nido en escarpados acantilados frente al mar.
      it: |-
        Pelipper fa le veci di un aereo cargo poiché trasporta piccoli
        Pokémon e uova all’interno del suo becco enorme.
        Questo Pokémon crea il proprio nido sulle scogliere a picco
        sul mare.
    alpha-sapphire:
      ja-Hrkt: |-
        かいめん　すれすれを　とび　エサを　さがす。
        おおきな　クチバシを　うみの　なかへ　いれて
        エサを　すくいとり　ひとのみで　たべるぞ。
      ja: |-
        海面　すれすれを　飛び　エサを　探す。
        大きな　クチバシを　海の　中へ　入れて
        エサを　すくい取り　一飲みで　食べるぞ。
      ko: |-
        해수면을 스칠 듯이 날며 먹이를 찾는다.
        큰 부리를 바닷속에 넣고
        먹이를 퍼 올려 한입에 먹는다.
      en: |-
        Pelipper searches for food while in flight by skimming the wave
        tops. This Pokémon dips its large bill in the sea to scoop up
        food, then swallows everything in one big gulp.
      fr: |-
        Bekipan récupère sa nourriture en vol, en rasant l’écume
        des vagues. Ce Pokémon trempe son énorme bec dans l’eau,
        puis avale tout en une bouchée.
      de: |-
        Pelipper sucht nach Nahrung, während es über die Wellen
        fliegt. Dieses Pokémon taucht seinen großen Schnabel ins
        Meer, um seine Beute abzuschöpfen. Dann schluckt es alles
        auf einmal herunter.
      es: |-
        Pelipper busca su comida mientras vuela y esquiva las crestas
        de las olas. Cuando localiza una presa, sumerge el largo pico
        en el agua para pescarla y se la traga de una vez.
      it: |-
        Pelipper si avventura in cerca di cibo volando radente
        sulla cresta delle onde. Immerge il suo becco enorme
        nell’acqua del mare per catturare la preda e poi inghiotte
        tutto in un sol boccone.
    sun:
      ja-Hrkt: |-
        おおきく　ふくらんだ　クチバシは
        ようちえんじ　くらいの　こどもなら
        すっぽり　はいる　おおきさだ。
      ja: |-
        大きく　膨らんだ　クチバシは
        幼稚園児　くらいの　子どもなら
        すっぽり　入る　大きさだ。
      ko: |-
        크게 부풀어 오른 부리는
        유치원생 정도의 어린아이라면
        쏙 들어갈 수 있는 크기이다.
      zh-Hant: |-
        鼓脹得大大的鳥嘴
        是連幼稚園生那麼大的
        孩子都能裝進去的大小。
      zh-Hans: |-
        鸟嘴鼓得大大的，
        幼儿园小朋友这么大的孩子
        正好能完全进入。
      en: |-
        Its spacious beak is large enough for a
        small child to fit right inside.
      fr: |-
        Le bec de ce Pokémon est énorme, tellement
        énorme qu’un petit enfant pourrait grimper
        dedans et s’y cacher sans problème.
      de: |-
        Sein riesiger Schnabel ist so groß, dass sogar
        ein kleines Kind problemlos hineinpassen würde.
      es: |-
        Su pico es tan grande que podría acomodar a un
        niño pequeño sin ningún problema.
      it: |-
        Il suo becco è talmente grande che potrebbe
        contenere senza problemi un bambino piccolo.
    moon:
      ja-Hrkt: |-
        エサあつめは　わかい　♂の　しごと。
        おおきなクチバシに　エサを　ためて
        なかまが　まつ　すまで　はこぶ。
      ja: |-
        餌集めは　若い　♂の　仕事。
        大きなクチバシに　餌を　溜めて
        仲間が　待つ　巣まで　運ぶ。
      ko: |-
        먹이를 모으는 일은 젊은 수컷의 일이다.
        커다란 부리에 먹이를 저장해서
        동료가 기다리는 둥지까지 운반한다.
      zh-Hant: |-
        收集食物是年輕♂的工作。
        會在大大的鳥嘴裡儲藏食物，
        運送到夥伴等待的巢穴中。
      zh-Hans: |-
        收集食物是年轻♂的活儿。
        在大大的鸟嘴里储藏食物，
        运送到伙伴等待的巢穴中。
      en: |-
        Gathering food is the work of young males.
        They store food in their capacious beaks and
        carry it back to others waiting in the nest.
      fr: |-
        Les Bekipan mâles ramènent la nourriture, qu’ils
        transportent dans leur énorme bec jusqu’au nid
        où les attendent leurs congénères.
      de: |-
        Die jungen Männchen beschaffen die Nahrung.
        Sie sammeln die Beute in ihrem großen Schnabel
        und bringen sie zurück ins Nest zu den anderen.
      es: |-
        Los machos jóvenes se encargan de reunir
        comida. La acumulan en sus grandes picos para
        luego llevarla a sus compañeros en los nidos.
      it: |-
        I giovani maschi hanno il compito di procurare
        il cibo. Catturano le prede col loro becco enorme
        e le portano al nido dai loro compagni.
    ultra-sun:
      ja-Hrkt: |-
        ふくらんだ　クチバシの　なかに
        ちいさなポケモンを　いれて　はこぶ。
        どこに　つれていくのかは　わからない。
      ja: |-
        膨らんだ　クチバシの　中に
        小さなポケモンを　入れて　運ぶ。
        どこに　連れていくのかは　わからない。
      ko: |-
        부풀린 부리 안에
        작은 포켓몬을 넣어 운반한다.
        어디로 데려가는지는 알 수 없다.
      zh-Hant: |-
        會把小型寶可夢裝進牠那
        脹鼓鼓的鳥嘴中運送，
        但沒人知道會被牠帶到哪裡去。
      zh-Hans: |-
        会将小型宝可梦放入它那鼓得
        大大的鸟嘴中运送。但是要把它
        带到哪儿去就不得而知了。
      en: |-
        It places small Pokémon into its spacious beak
        and carries them around. No one knows where
        it’s taking them.
      fr: |-
        Il se sert de son énorme bec pour transporter
        de petits Pokémon, mais nul ne sait où il les
        emporte...
      de: |-
        In seinem riesigen Schnabel transportiert es
        kleine Pokémon. Niemand weiß, wohin es sie
        bringt.
      es: |-
        Transporta Pokémon pequeños en su enorme
        pico, aunque nadie sabe a dónde los lleva.
      it: |-
        Trasporta piccoli Pokémon tenendoli nel suo
        enorme becco, ma non si sa dove li porti.
    ultra-moon:
      ja-Hrkt: |-
        おおきな　クチバシで　ヨワシを
        すくって　まるのみに　する。　１どで
        ３０ぴき　いじょうを　たいらげるぞ。
      ja: |-
        大きな　クチバシで　ヨワシを
        すくって　丸呑みに　する。　１度で
        ３０匹　以上を　平らげるぞ。
      ko: |-
        커다란 부리로 약어리를
        건져 올려 통째로 삼킨다.
        한 번에 30마리 이상 먹어 치운다.
      zh-Hant: |-
        會用大大的鳥嘴
        撈起弱丁魚然後吞下。
        一次可以吃下３０隻以上。
      zh-Hans: |-
        会用大大的鸟嘴捞起
        弱丁鱼后整个吞下。
        一次可吃下３０只以上。
      en: |-
        It scoops up Wishiwashi in its huge beak and
        swallows them whole. It can devour more than
        30 at one go!
      fr: |-
        Il pêche les Froussardine à l’aide de son large
        bec et les avale d’un trait. Il peut en ingurgiter
        jusqu’à trente d’un coup.
      de: |-
        Mit seinem großen Schnabel schöpft es Lusardin
        aus dem Wasser und schluckt sie im Ganzen.
        Es kann über 30 Stück auf einmal verspeisen.
      es: |-
        Atrapa Wishiwashi con su enorme pico para
        luego engullirlos enteros, llegando a comer más
        de 30 ejemplares de una sentada.
      it: |-
        Pesca i Wishiwashi con l’enorme becco e li
        inghiotte in un sol boccone. Può mangiarne
        anche 30 per volta.
    sword:
      ja-Hrkt: |-
        くちのなかに　ちいさなポケモンや
        タマゴをいれて　あんぜんな　ばしょに
        とどけてくれる　そらの　はこびや。
      ja: |-
        口の中に　小さなポケモンや
        タマゴを入れて　安全な　場所に
        届けてくれる　空の　運び屋。
      ko: |-
        입속에 작은 포켓몬이나
        알을 넣고 안전한 장소로
        운반해주는 하늘의 배달꾼.
      zh-Hant: |-
        把小型寶可夢和蛋
        放進嘴裡，並運送到
        安全地方的空中送貨員。
      zh-Hans: |-
        把小型宝可梦和蛋放进嘴里，
        并运送到安全地方的空中运送员。
      en: |-
        It is a messenger of the skies, carrying small
        Pokémon and eggs to safety in its bill.
      fr: |-
        Ce messager du ciel transporte les petits
        Pokémon et les Œufs dans son bec pour
        les conduire en lieu sûr.
      de: |-
        Ein Bote der Lüfte. Es bringt Eier und kleine
        Pokémon in seinem Schnabel in Sicherheit.
      es: |-
        Transporta a pequeños Pokémon y Huevos en su
        pico hasta lugares seguros.
      it: |-
        È un corriere dei cieli che trasporta Uova e
        piccoli Pokémon nel suo enorme becco per
        condurli in un luogo sicuro.
    shield:
      ja-Hrkt: |-
        かいめん　すれすれを　とんで
        おおきな　くちばしで　かいすいごと
        エサを　すくいとって　はこぶのだ。
      ja: |-
        海面　すれすれを　飛んで
        大きな　くちばしで　海水ごと
        エサを　すくい取って　運ぶのだ。
      ko: |-
        해면 아주 가까이 날아
        큰 부리로 해수와 함께
        먹이를 건져 나른다.
      zh-Hant: |-
        會貼著海面飛行，
        用大大的鳥嘴連著海水一起
        把食物撈起來帶走。
      zh-Hans: |-
        会贴着海面飞行，
        用大大的鸟嘴连着海水一起
        把食物捞起来带走。
      en: |-
        Skimming the water’s surface, it dips its large bill
        in the sea, scoops up food and water, and
        carries it.
      fr: |-
        Avec son grand bec, il transporte de la nourriture
        qu’il a récoltée en volant la bouche ouverte
        au ras de la mer, gobant de l’eau au passage.
      de: |-
        Es schnappt sich seine Beute, indem es beim
        Fliegen mit seinem großen Schnabel das Wasser
        streift.
      es: |-
        Vuela a ras de la superficie marina para llenar
        su inmenso pico de agua y comida, que se lleva
        consigo.
      it: |-
        Si libra a pelo dell’acqua del mare pescando
        il suo cibo e trasportandolo via con il suo grande
        becco.
