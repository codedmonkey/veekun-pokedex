      de: |-
        Schillok hat einen langen, buschigen Schweif, dessen Farbe
        intensiver wird, wenn es altert. Die Kratzer auf seinem Panzer
        zeugen von seiner Kampfkraft.
      es: |-
        Tiene una cola larga y cubierta de un pelo abundante y
        grueso que se torna más oscuro a medida que crece.
        Los arañazos que tiene en el caparazón dan fe de lo buen
        guerrero que es.
      it: |-
        La grande coda di Wartortle è coperta da una folta
        pelliccia, che diventa sempre più scura con l’avanzare
        dell’età. I graffi sulla corazza indicano la potenza di questo
        Pokémon come lottatore.
    lets-go-pikachu:
      ja-Hrkt: |-
        ポカンと　あたまを　たたかれるとき
        こうらに　ひっこんで　よける。でも
        ちょっとだけ　シッポが　でているよ。
      ja: |-
        ポカンと　頭を　たたかれるとき
        こうらに　引っこんで　よける。でも
        ちょっとだけ　シッポが　出ているよ。
      ko: |-
        딱 하고 머리를 맞을 때
        등껍질로 숨어서 피한다. 하지만
        꼬리가 살짝 삐져나와 있다.
      zh-Hant: |-
        如果有人打牠的頭，
        牠會縮進殼裡來躲避，
        但會留下一小截尾巴在外面。
      zh-Hans: |-
        如果拍打它的头部，它会
        把头缩进壳里，但尾巴
        还是会露出来一点点。
      en: |-
        When tapped on its head, this Pokémon will pull
        it in, but its tail will still stick out a little bit.
      fr: |-
        Quand on lui tapote la tête, il se cache dans
        sa carapace, mais son corps ne peut pas y tenir
        en entier.
      de: |-
        Wenn es einen Schlag auf den Kopf bekommt,
        zieht es sich in seinen Panzer zurück. Seine
        Schwanzspitze ragt jedoch ein wenig heraus.
      es: |-
        Si alguien le golpea la cabeza, se protege
        escondiéndose en su caparazón, aunque parte
        de la cola queda al descubierto.
      it: |-
        Quando viene colpito sulla testa si ritira nella
        corazza. La coda, però, sporge sempre un po’.
