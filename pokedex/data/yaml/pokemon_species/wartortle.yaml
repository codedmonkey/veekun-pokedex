    sword:
      ja-Hrkt: |-
        ながいきの　シンボルと　されている。
        こうらに　コケが　ついているのは
        とくに　ながいきの　カメールだ。
      ja: |-
        長生きの　シンボルと　されている。
        甲羅に　苔が　ついているのは
        とくに　長生きの　カメールだ。
      ko: |-
        장수의 상징으로 여겨진다.
        등껍질에 이끼가 붙어 있는 것은
        특히 장수한 어니부기다.
      zh-Hant: |-
        被視為長壽的象徵。
        如果卡咪龜的殼上長著苔蘚，
        那就代表牠已經活了非常久。
      zh-Hans: |-
        被视为长寿的象征。
        如果卡咪龟的壳上长着苔藓，
        代表它已经活了非常久了。
      en: |-
        It is recognized as a symbol of longevity. If its
        shell has algae on it, that Wartortle is very old.
      fr: |-
        Il est considéré comme un symbole de longévité.
        On reconnaît les spécimens les plus âgés
        à la mousse qui pousse sur leur carapace.
      de: |-
        Es gilt als Symbol für Langlebigkeit. Sehr alte
        Exemplare erkennt man daran, dass ihr Panzer
        mit Algen übersät ist.
      es: |-
        Se lo considera un símbolo de longevidad. Los
        ejemplares más ancianos tienen musgo sobre el
        caparazón.
      it: |-
        È considerato un simbolo di longevità.
        Se c’è del muschio sul suo guscio, significa
        che è molto anziano.
    shield:
      ja-Hrkt: |-
        ふさふさの　みみと　しっぽを
        たくみに　あやつって　すいちゅうでの
        バランスを　たもつ。
      ja: |-
        ふさふさの　耳と　しっぽを
        たくみに　操って　水中での
        バランスを　たもつ。
      ko: |-
        탐스러운 귀와 꼬리를
        능숙하게 다뤄서 수중에서의
        밸런스를 유지한다.
      zh-Hant: |-
        會靈巧地擺動自己
        毛茸茸的耳朵和尾巴，
        藉此在水中保持平衡。
      zh-Hans: |-
        会灵巧地摆动自己
        毛茸茸的耳朵和尾巴，
        借此在水中保持平衡。
      en: |-
        It cleverly controls its furry ears and tail to
        maintain its balance while swimming.
      fr: |-
        Il se sert habilement de sa queue et de ses
        oreilles touffues pour garder son équilibre
        sous l’eau.
      de: |-
        Es balanciert geschickt mit seinen buschigen
        Ohren und dem Schweif, während es im Wasser
        schwimmt.
      es: |-
        Utiliza hábilmente sus peludas orejas y la cola
        para mantener el equilibrio al nadar.
      it: |-
        Controlla abilmente le orecchie e la coda
        coperte di pelo, mantenendo l’assetto
        mentre nuota.
