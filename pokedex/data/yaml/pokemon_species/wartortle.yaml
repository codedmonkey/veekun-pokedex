    white-2:
      en: |-
        It is said to live 10,000 years.
        Its furry tail is popular as a
        symbol of longevity.
    x:
      ja-Hrkt: |-
        ポカンと　あたまを　たたかれるとき
        こうらに　ひっこんで　よける。でも
        ちょっとだけ　しっぽが　でているよ。
      ja: |-
        ポカンと　頭を　たたかれるとき
        甲羅に　引っこんで　避ける。でも
        ちょっとだけ　尻尾が　出ているよ。
      ko: |-
        딱 하고 머리를 맞을 때
        등껍질로 숨어서 피한다. 하지만
        꼬리가 살짝 삐져나와 있다.
      en: |-
        When tapped, this Pokémon will pull in its head,
        but its tail will still stick out a little bit.
      fr: |-
        Attaqué, il cache sa tête dans sa carapace, mais
        son corps trop gros ne peut y tenir en entier.
      de: |-
        Bei Gefahr zieht dieses Pokémon seinen Kopf ein.
        Die Schwanzspitze ragt jedoch aus dem Panzer
        heraus.
      es: |-
        Si es golpeado, esconderá su cabeza. Aun así, su cola
        puede seguir golpeando.
      it: |-
        Quando si sente minacciato ritira la testa nella
        corazza, mentre la coda sporge sempre un po’.
    'y':
      ja-Hrkt: |-
        いちまんねんの　じゅみょうを　もつと
        いわれている。ふさふさの　しっぽは
        ながいきの　シンボルとして　にんき。
      ja: |-
        １万年の　寿命を　持つと
        言われている。ふさふさの　尻尾は
        長生きの　シンボルとして　人気。
      ko: |-
        만 년의 수명을 가지고 있다고들
        말한다. 치렁치렁한 꼬리는
        장수의 상징으로서 인기가 있다.
      en: |-
        It is said to live 10,000 years. Its furry tail is
        popular as a symbol of longevity.
      fr: |-
        On prétend qu’il vit 10 000 ans. Sa queue duveteuse
        est un symbole de longévité populaire.
      de: |-
        Man sagt, es werde 10 000 Jahre alt. Sein buschiger
        Schweif ist ein Symbol für langes Leben.
      es: |-
        Se dice que vive 10 000 años. Su peluda cola es un
        símbolo de longevidad.
      it: |-
        Pare che viva 10.000 anni. Ha la coda ricoperta da
        una folta pelliccia, indice di longevità.
    omega-ruby:
      ja-Hrkt: |-
        ふさふさの　けで　おおわれた　おおきな　しっぽは
        ながいき　するほど　ふかい　いろあいに　かわる。
        こうらの　キズは　つわものの　あかし。
      ja: |-
        ふさふさの　毛で　覆われた　大きな　尻尾は
        長生き　するほど　深い　色合いに　変わる。
        甲羅の　キズは　強者の　証。
      ko: |-
        푹신한 털로 덮인 큰 꼬리는
        오래 살수록 깊은 색으로 변한다.
        등껍질의 상처는 강자임을 증명한다.
      en: |-
        Its tail is large and covered with a rich, thick fur. The tail
        becomes increasingly deeper in color as Wartortle ages.
        The scratches on its shell are evidence of this Pokémon’s
        toughness as a battler.
      fr: |-
        Carabaffe a une large queue recouverte d’une épaisse
        fourrure. Elle devient de plus en plus foncée avec l’âge.
        Les éraflures sur la carapace de ce Pokémon témoignent
        de son expérience au combat.
      de: |-
        Schillok hat einen langen, buschigen Schweif, dessen Farbe
        intensiver wird, wenn es altert. Die Kratzer auf seinem Panzer
        zeugen von seiner Kampfkraft.
      es: |-
        Tiene una cola larga y cubierta de un pelo abundante y
        grueso que se torna más oscuro a medida que crece.
        Los arañazos que tiene en el caparazón dan fe de lo buen
        guerrero que es.
      it: |-
        La grande coda di Wartortle è coperta da una folta
        pelliccia, che diventa sempre più scura con l’avanzare
        dell’età. I graffi sulla corazza indicano la potenza di questo
        Pokémon come lottatore.
    alpha-sapphire:
      ja-Hrkt: |-
        ふさふさの　けで　おおわれた　おおきな　しっぽは
        ながいき　するほど　ふかい　いろあいに　かわる。
        こうらの　キズは　つわものの　あかし。
      ja: |-
