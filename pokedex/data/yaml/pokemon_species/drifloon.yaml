drifloon:
  base_happiness: 50
  capture_rate: 125
  color: purple
  egg_groups:
    - indeterminate
  evolution_chain: drifloon
  evolves_from: ~
  flavor_text:
    diamond:
      en: |-
        A Pokémon formed by the spirits
        of people and Pokémon. It loves
        damp, humid seasons.
    pearl:
      en: |-
        It tugs on the hands of children
        to steal them away. However, it
        gets pulled around instead.
    platinum:
      en: |-
        Because of the way it floats
        aimlessly, an old folktale calls it a
        “Signpost for Wandering Spirits.”
    heartgold:
      en: |-
        It is whispered that any child who
        mistakes DRIFLOON for a balloon and
        holds on to it could wind up missing.
    soulsilver:
      en: |-
        It is whispered that any child who
        mistakes DRIFLOON for a balloon and
        holds on to it could wind up missing.
    black:
      en: |-
        Because of the way it floats
        aimlessly, an old folktale calls it a
        “Signpost for Wandering Spirits.”
      fr: |-
        Sa façon de flotter sans but au
        gré du vent lui a valu le surnom
        de “bouée des esprits égarés”.
    white:
      en: |-
        Because of the way it floats
        aimlessly, an old folktale calls it a
        “Signpost for Wandering Spirits.”
      fr: |-
        Sa façon de flotter sans but au
        gré du vent lui a valu le surnom
        de “bouée des esprits égarés”.
    black-2:
      en: |-
        These Pokémon are called the
        “Signpost for Wandering Spirits.”
        Children holding them sometimes vanish.
    white-2:
      en: |-
        These Pokémon are called the
        “Signpost for Wandering Spirits.”
        Children holding them sometimes vanish.
    x:
      ja-Hrkt: |-
        ひとや　ポケモンの　たましいが
        かたまって　うまれた　ポケモン。
        ジメジメした　きせつが　だいすき。
      ja: |-
        人や　ポケモンの　魂が
        固まって　生まれた　ポケモン。
        ジメジメした　季節が　大好き。
      ko: |-
        사람이나 포켓몬의 영혼이
        한데 모여 태어난 포켓몬이다.
        습기 많은 계절을 매우 좋아한다.
      en: |-
        A Pokémon formed by the spirits of people and
        Pokémon. It loves damp, humid seasons.
      fr: |-
        Un Pokémon né de l’esprit des gens et des Pokémon.
        Il aime les saisons chaudes et humides.
      de: |-
        Ein Pokémon, entstanden aus den Gefühlen von
        Menschen und Pokémon. Es mag feuchte Jahreszeiten.
      es: |-
        Está formado por los espíritus de personas y Pokémon.
        Le encantan las estaciones húmedas.
      it: |-
        Pokémon formato dalle anime di persone e Pokémon.
        Ama le stagioni umide.
    'y':
      ja-Hrkt: |-
        たましいの　みちしるべと　いわれる。
        フワンテを　もっていた　こどもは
        とつぜん　きえて　いなくなる。
      ja: |-
        魂の　道標と　いわれる。
        フワンテを　持っていた　子供は
        突然　消えて　いなくなる。
      ko: |-
        영혼의 이정표라고 전해진다.
        흔들풍손을 가지고 있는 아이는
        갑자기 사라져버린다.
      en: |-
        These Pokémon are called the “Signpost for
        Wandering Spirits.” Children holding them
        sometimes vanish.
      fr: |-
        Les enfants qui attrapent des Baudrive disparaissent
        parfois. On lui donne le surnom de « bouée des esprits
        égarés ».
      de: |-
        Auch bekannt als „Wegweiser für umherstreifende
        Geister“. Kinder, die sie halten, verschwinden
        manchmal.
      es: |-
        Se dice que es como un hito que guía a las almas.
        Los niños que sostienen un Drifloon a veces
        desaparecen sin más.
      it: |-
        Anche detto “Guida degli spiriti vaganti”. A volte
        i bambini che ne hanno uno svaniscono
        improvvisamente nel nulla.
    omega-ruby:
      ja-Hrkt: |-
        ひとや　ポケモンの　たましいが
        かたまって　うまれた　ポケモン。
        ジメジメした　きせつが　だいすき。
      ja: |-
        人や　ポケモンの　魂が
        固まって　生まれた　ポケモン。
        ジメジメした　季節が　大好き。
      ko: |-
        사람이나 포켓몬의 영혼이
        한데 모여 태어난 포켓몬이다.
        습기 많은 계절을 매우 좋아한다.
      en: |-
        A Pokémon formed by the spirits of people and Pokémon.
        It loves damp, humid seasons.
      fr: |-
        Un Pokémon né de l’esprit des gens et des Pokémon.
        Il aime les saisons chaudes et humides.
      de: |-
        Ein Pokémon, entstanden aus den Gefühlen von Menschen
        und Pokémon. Es mag feuchte Jahreszeiten.
      es: |-
        Está formado por los espíritus de personas y Pokémon. Le
        encantan las estaciones húmedas.
      it: |-
        Pokémon formato dalle anime di persone e Pokémon.
        Ama le stagioni umide.
    alpha-sapphire:
      ja-Hrkt: |-
        たましいの　みちしるべと　いわれる。
        フワンテを　もっていた　こどもは
        とつぜん　きえて　いなくなる。
      ja: |-
        魂の　道標と　いわれる。
        フワンテを　持っていた　子供は
        突然　消えて　いなくなる。
      ko: |-
        영혼의 이정표라고 전해진다.
        흔들풍손을 가지고 있는 아이는
        갑자기 사라져버린다.
      en: |-
        These Pokémon are called the “Signpost for
        Wandering Spirits.” Children holding them
        sometimes vanish.
      fr: |-
        Les enfants qui attrapent des Baudrive disparaissent parfois.
        On lui donne le surnom de « bouée des esprits égarés ».
      de: |-
        Auch bekannt als „Wegweiser für umherstreifende Geister“.
        Kinder, die sie halten, verschwinden manchmal.
      es: |-
        Se dice que es como un hito que guía a las almas. Los niños
        que sostienen un Drifloon a veces desaparecen sin más.
      it: |-
        Anche detto “Guida degli spiriti vaganti”. A volte i bambini
        che ne hanno uno svaniscono improvvisamente nel nulla.
    sun:
      ja-Hrkt: |-
        おさないこどもの　てを　にぎり
        あのよへと　つれさる　という。
        おもたい　こどもは　キライ。
      ja: |-
        幼い子どもの　手を　握り
        あの世へと　連れ去る　という。
        重たい　子どもは　キライ。
      ko: |-
        어린아이의 손을 잡고
        저세상으로 데려간다고 한다.
        무거운 아이를 싫어한다.
      zh-Hant: |-
        據說會牽著年幼孩子的手，
        將其帶去另一個世界。
        不喜歡身體重的孩子。
      zh-Hans: |-
        据说会牵着年幼孩子的手，
        将其带去另一个世界。
        不喜欢身体重的孩子。
      en: |-
        Stories go that it grabs the hands of small
        children and drags them away to the afterlife.
        It dislikes heavy children.
      fr: |-
        Il guide les petits enfants par la main vers
        l’autre monde. Mais seulement les plus jeunes,
        car après, ils sont trop lourds pour lui.
      de: |-
        Es heißt, dass es kleine Kinder an die
        Hand nehme und ins Jenseits zerre.
        Schwere Kinder sind ihm eine Last.
      es: |-
        Se dice que coge a niños pequeños de la mano
        y se los lleva al otro mundo. Prefiere a los niños
        que no pesan mucho.
      it: |-
        Si dice che prenda per mano i bambini e li
        accompagni nell’aldilà. Preferisce quelli piccoli
        e leggeri.
    moon:
      ja-Hrkt: |-
        なにかの　ひょうしで　からだが
        われると　さけびのような　おとと
        ともに　たましいが　あふれだす。
      ja: |-
        なにかの　拍子で　身体が
        割れると　叫びのような　音と
        ともに　魂が　あふれだす。
      ko: |-
        어떤 박자에 몸이
        터지면 비명 같은 소리와
        함께 영혼이 흘러나온다
      zh-Hant: |-
        身體因某種原因破掉的話，
        就會伴隨著呼喊一樣的聲音
        溢出魂魄來。
      zh-Hans: |-
        身体因某种原因弄破的话，
        就会伴随着呼喊一样的声音
        溢出魂魄来。
      en: |-
        If for some reason its body bursts, its soul spills
        out with a screaming sound.
      fr: |-
        Si par malheur il éclate, le Baudrive émet alors
        un bruit terrible, comme un cri déchirant.
        C’est à vous fendre le cœur.
      de: |-
        Wenn aus irgendeinem Grund sein Körper platzt,
        entweicht seine Seele mit einem Geräusch, das
        wie ein Schrei klingt.
      es: |-
        Si por alguna razón su cuerpo llega a reventar,
        emite un sonido parecido al de un grito al tiempo
        que se escapa su energía vital.
      it: |-
        Se il suo corpo si buca accidentalmente, la sua
        essenza vitale fuoriesce con un suono simile
        a un lamento.
    ultra-sun:
      ja-Hrkt: |-
        まるい　からだの　なかに　たくさんの
        たましいが　つまっている。　だれかを
        みちづれにするたび　ふくらんでいく。
      ja: |-
        丸い　身体の　中に　たくさんの
        魂が　詰まっている。　誰かを
        道連れにするたび　膨らんでいく。
      ko: |-
        둥근 몸 안에는 많은 혼으로
        가득 차 있다. 누군가를 길동무로
        삼을 때마다 부풀어 오른다.
      zh-Hant: |-
        圓滾滾的身體裡塞滿了靈魂，
        每當牠把誰給帶走時，
        身體就會更加膨脹。
      zh-Hans: |-
        圆圆的身体里塞满了许多魂魄。
        每次带着谁一起走的时候，
        身体就会鼓起来。
      en: |-
        Its round body is stuffed with souls and
        expands each time it leads someone away.
      fr: |-
        Son corps rond contient une quantité d’âmes
        impressionnante. Plus il entraîne de personnes
        avec lui, plus son corps gonfle.
      de: |-
        Sein runder Körper ist mit vielen Seelen gefüllt.
        Jedes Mal, wenn es jemanden entführt, wird es
        größer.
      es: |-
        En el interior de su cuerpo redondo almacena
        gran número de almas. Aumenta de tamaño con
        cada persona que se lleva.
      it: |-
        Il suo corpo rotondo contiene molte anime.
        Più tempo passa in compagnia, più il suo
        corpo si gonfia.
    ultra-moon:
      ja-Hrkt: |-
        みちばたで　さまよう　たましいたちが
        かたまって　うまれる。　こどもを
        なかまに　しようと　てを　ひっぱる。
      ja: |-
        道端で　さまよう　魂たちが
        かたまって　生まれる。　子どもを
        仲間に　しようと　手を　引っ張る。
      ko: |-
        길가를 헤매는 영혼들이
        한데 모여 태어난다. 아이를
        동료로 만들려고 손을 잡아당긴다.
      zh-Hant: |-
        在路上遊蕩的靈魂聚集起來
        而誕生的寶可夢。為了讓孩子成為
        自己的夥伴，飄飄球會去拉他們的手。
      zh-Hans: |-
        在路上游荡的魂魄们聚积诞生而成。
        想让孩子成为自己的伙伴
        而去拉他们的手。
      en: |-
        Wandering souls gathered together to form this
        Pokémon. When trying to make friends with
        children, Drifloon grabs them by the hand.
      fr: |-
        Né d’une agglomération d’âmes errantes,
        il entraîne les enfants par la main pour s’en
        faire des amis.
      de: |-
        Es entstand aus verirrten Seelen, die sich
        zusammengefunden hatten. Kinder zerrt es an
        der Hand mit, um sich mit ihnen anzufreunden.
      es: |-
        Está formado por espíritus errantes que vagan
        por los caminos. Se lleva a los niños de la mano
        para entablar amistad con ellos.
      it: |-
        È formato dalle anime che vagano sul ciglio
        della strada. Prende con sé i bambini
        tenendoli per mano.
    sword:
      ja-Hrkt: |-
        なかまが　ほしいのか　こどもに
        ちかづくが　いいように　あそばれ
        にげていくことも　すくなくない。
      ja: |-
        仲間が　欲しいのか　子どもに
        近づくが　いいように　遊ばれ
        逃げていくことも　少なくない。
      ko: |-
        동료가 필요한지 아이에게
        다가가지만 거칠게 다뤄져서
        도망가 버리는 경우도 적지 않다.
      zh-Hant: |-
        也許是因為渴望擁有夥伴，
        牠會去接近小孩子。但也經常
        因為被孩子們戲耍而逃跑。
      zh-Hans: |-
        也许是因为渴望拥有伙伴，
        它会去接近孩子们。但也经常
        因为被孩子们戏耍而逃跑。
      en: |-
        Perhaps seeking company, it approaches children.
        However, it often quickly runs away again when
        the children play too roughly with it.
      fr: |-
        Pour se faire des amis, il s’approche des enfants,
        mais ces derniers le malmènent souvent,
        ce qui le pousse à s’enfuir.
      de: |-
        Es nähert sich oft Kindern, womöglich auf der
        Suche nach Freunden. Wenn diese zu wild
        spielen, ergreift es aber die Flucht.
      es: |-
        Se acerca a los niños en busca de compañía,
        pero lo tratan como un juguete y a menudo
        tiene que salir huyendo.
      it: |-
        Si avvicina ai bambini in cerca di compagnia,
        ma spesso è costretto a fuggire perché viene
        trattato senza troppi riguardi.
    shield:
      ja-Hrkt: |-
        たましいが　あつまり　うまれた。
        しっけの　おおい　きせつには
        たいりょうに　あらわれることも。
      ja: |-
        魂が　集まり　生まれた。
        湿気の　多い　季節には
        大量に　現れることも。
      ko: |-
        영혼들이 모여 탄생했다.
        습기가 많은 계절에는
        대량으로 나타나기도 한다.
      zh-Hant: |-
        因魂魄聚集在一起而誕生。
        到了濕氣重的季節
        就有可能大量出現。
      zh-Hans: |-
        因魂魄聚集在一起而诞生。
        到了湿气大的季节
        就有可能大量出现。
      en: |-
        The gathering of many souls gave rise to this
        Pokémon. During humid seasons, they seem to
        appear in abundance.
      fr: |-
        Nés d’une concentration d’âmes, ces Pokémon
        peuvent apparaître en grand nombre les jours
        où le taux d’humidité est élevé.
      de: |-
        Sie sind aus einer Ansammlung an Seelen
        entstanden. In feuchten Jahreszeiten erscheinen
        sie in rauen Mengen.
      es: |-
        Está formado por una aglomeración de espíritus.
        Suele aparecer en grandes números durante las
        estaciones húmedas.
      it: |-
        È nato dall’aggregazione di diverse anime.
        Nelle stagioni umide possono apparirne
        numerosi esemplari.
