    black-2:
      en: |-
        As each tail grows, its fur becomes
        more lustrous. When held, it feels
        slightly warm.
    white-2:
      en: |-
        As each tail grows, its fur becomes
        more lustrous. When held, it feels
        slightly warm.
    x:
      ja-Hrkt: |-
        うまれたとき　しっぽは　まっしろで
        １ぽんしかない。そだつと　やがて
        さきが　わかれて　しっぽが　ふえる。
      ja: |-
        生まれたとき　尻尾は　真っ白で
        １本しかない。育つと　やがて
        先が　分かれて　尻尾が　増える。
      ko: |-
        태어났을 때는 꼬리가 새하얗고
        하나밖에 없다. 성장하면
        끝이 갈라지며 꼬리 수가 늘어난다.
      en: |-
        When it is born, it has just one snow-white tail.
        The tail splits from its tip as it grows older.
      fr: |-
        Il n’a qu’une seule queue à la naissance. Sa queue
        se divise à la pointe au fil des ans.
      de: |-
        Dieses Pokémon hat bei seiner Geburt nur einen
        Schweif, der sich mit zunehmendem Alter aufspaltet.
      es: |-
        Cuando nace solo tiene una cola, pero a medida que
        crece, esta se va dividiendo desde la punta.
      it: |-
        Alla nascita ha solo una coda, che con il passare
        del tempo sviluppa diverse diramazioni.
    'y':
      ja-Hrkt: |-
        こどもだが　６ほんの　しっぽが
        うつくしい。せいちょうすると
        さらに　しっぽが　ふえる。
      ja: |-
        子供だが　６本の　尻尾が
        美しい。成長すると　さらに
        尻尾が　増える。
      ko: |-
        어리지만 6개의 꼬리가
        아름답다. 성장하면
        한층 꼬리 수가 늘어난다.
      en: |-
        While young, it has six gorgeous tails. When it
        grows, several new tails are sprouted.
      fr: |-
        Quand il est jeune, ce Pokémon a six queues
        magnifiques. De nouvelles queues apparaissent tout
        au long de sa croissance.
      de: |-
        In seiner Jugend hat es sechs hinreißende Schweife.
        Während es wächst, kommen noch weitere neue
        Schweife hinzu.
      es: |-
        De pequeño, tiene seis colas increíbles. A medida que
        crece, le van saliendo más.
      it: |-
        Quando è giovane ha sei meravigliose code, che si
        moltiplicano durante la sua crescita.
    omega-ruby:
      ja-Hrkt: |-
        うまれた　ときは　しろい　１ぽんの　しっぽ。
        あいじょうを　たっぷり　うけると　しっぽは
        ６ぽんに　わかれて　みごとな　まきげになる。
      ja: |-
        生まれた　ときは　白い　１本の　尻尾。
        愛情を　たっぷり　受けると　尻尾は
        ６本に　別れて　見事な　巻き毛になる。
      ko: |-
        태어났을 때는 하얀 꼬리가 한 개다.
        애정을 많이 받으면 꼬리가
        6개로 나뉘며 멋지게 말린다.
      en: |-
        At the time of its birth, Vulpix has one white tail. The tail
        separates into six if this Pokémon receives plenty of love
        from its Trainer. The six tails become magnificently curled.
      fr: |-
        À sa naissance, Goupix a une queue blanche. Cette queue se
        divise en six si le Pokémon reçoit de l’amitié de la part de
        son Dresseur. Les six queues sont courbées et magnifiques.
      de: |-
        Vulpix kommt mit einem weißen Schweif zur Welt.
        Dieser teilt sich sechsfach, wenn das Pokémon
        von seinem Trainer viel Zuneigung bekommt.
        Seine sechs Schweife kräuseln sich schließlich.
      es: |-
        Al nacer, Vulpix tiene una cola blanca que se divide en seis si
        recibe cariño por parte de su Entrenador. Las seis colas se le
        rizan de forma majestuosa.
      it: |-
        Al momento della nascita Vulpix ha una sola coda bianca.
        Se il Pokémon riceve molto amore dal proprio Allenatore
        la coda si divide in sei diramazioni che poi si arricciano
        elegantemente.
    alpha-sapphire:
      ja-Hrkt: |-
        からだの　なかで　ほのおが　いつも　もえている。
        ひるま　きおんが　あがると　たいおんも　たかく
        なってしまうので　くちから　ほのおを　にがす。
      ja: |-
        体の　中で　炎が　いつも　燃えている。
        昼間　気温が　あがると　体温も　高く
        なってしまうので　口から　炎を　逃がす。
      ko: |-
        몸 안에서 항상 불꽃이 타고 있다.
        낮에 기온이 올라가면 체온도 올라가기
        때문에 입으로 불꽃을 빼낸다.
      en: |-
        Inside Vulpix’s body burns a flame that never goes out.
        During the daytime, when the temperatures rise, this
        Pokémon releases flames from its mouth to prevent its
        body from growing too hot.
      fr: |-
        À l’intérieur du corps de Goupix se trouve une flamme
        qui ne s’éteint jamais. Pendant la journée, lorsque
        la température augmente, ce Pokémon crache des flammes
        pour éviter que son corps ne devienne trop chaud.
      de: |-
        In Vulpix’ Körper brennt eine Flamme, die niemals erlischt.
        Am Tage, wenn die Temperaturen steigen, stößt dieses
        Pokémon Flammen aus seinem Mund aus. So schützt es
        sich davor, dass sein Körper zu heiß wird.
      es: |-
        En el interior del cuerpo de Vulpix arde una llama que nunca
        se extingue. Durante el día, cuando suben las temperaturas,
        este Pokémon libera llamas por la boca para evitar
        recalentarse.
      it: |-
        All’interno del corpo di Vulpix brucia una fiamma inestinguibile.
        Di giorno, quando sale la temperatura, questo Pokémon
        emette fiamme dalla bocca per evitare il surriscaldamento
        del proprio corpo.
    sun:
      ja-Hrkt: |-
        けなみや　シッポが　うつくしいので
        だいにんき。　せいちょうに　つれ
        シッポは　わかれて　ふえていく。
      ja: |-
        毛並みや　シッポが　美しいので
        大人気。　成長に　連れ
        シッポは　わかれて　増えていく。
      ko: |-
        털과 꼬리가 아름다워서
        인기가 많다. 성장함에 따라
        꼬리가 나뉘면서 늘어난다.
      zh-Hant: |-
        因為毛色和尾巴非常漂亮，
        所以很受歡迎。伴隨著成長，
        尾巴會分開，長得越來越多。
      zh-Hans: |-
        因为毛色和尾巴非常漂亮，
        所以很有人气。伴随着成长，
        尾巴会分开，长得越来越多。
      en: |-
        Its beautiful fur and tails have made it very
        popular. As it grows, its tails split to form
        more tails.
      fr: |-
        Un Pokémon très populaire de par son pelage
        et ses superbes queues. Au fur et à mesure de
        sa croissance, elles se multiplient en se divisant.
      de: |-
        Sein Fell und seine Schweife sind so hübsch,
        dass es sich großer Beliebtheit erfreut. Letztere
        spalten sich mit zunehmendem Alter weiter auf.
      es: |-
        Es muy popular por su pelaje y sus colas. A
        medida que crece, las colas se dividen y
        aumentan en número.
      it: |-
        È molto amato per il suo manto e le sue code.
        Man mano che cresce, la sua coda sviluppa
        diverse diramazioni.
    moon:
      ja-Hrkt: |-
        くちから　ひとだまの　ような
        ほのおを　はきだすので　おばけと
        みまちがえる　ひとも　いる。
      ja: |-
        口から　人魂の　ような
        炎を　吐きだすので　お化けと
        見間違える　人も　いる。
      ko: |-
        입에서 도깨비불 같은
        불꽃을 내뱉어서 유령으로
        착각하는 사람도 있다.
      zh-Hant: |-
        因為會從口中噴出好像
        人的靈魂一樣的火焰，
        所以也有人把牠錯看成鬼怪。
      zh-Hans: |-
        因为会从口中喷出好像
        人的灵魂一样的火焰，
        所以也有人把它错看成妖怪。
      en: |-
        From its mouth spew flames that seem to
        resemble the spirits of the deceased. Some
        people mistakenly think this fire is a ghost.
      fr: |-
        Certaines personnes prennent ce Pokémon pour
        un fantôme à cause des flammes qui sortent de
        sa bouche, similaires à des âmes de défunts.
      de: |-
        Es kann Feuerbälle speien, die Irrlichtern ähneln.
        Aus diesem Grund wird es gelegentlich für ein
        Gespenst gehalten.
      es: |-
        Lanza llamas por la boca que se asemejan
        a fuegos fatuos, por lo que algunos las
        confunden con fantasmas.
      it: |-
        Emette dalla bocca fiamme simili a fuochi fatui,
        e per questo motivo a volte viene preso
        per un fantasma.
    ultra-sun:
      ja-Hrkt: |-
        うつくしい　シッポで　だいにんき。
        ただし　まめに　ブラッシングしないと
        あっというまに　けだまだらけになる。
      ja: |-
        美しい　シッポで　大人気。
        ただし　まめに　ブラッシングしないと
        あっという間に　毛玉だらけになる。
      ko: |-
        아름다운 꼬리 때문에 인기가 많다.
        단 바지런히 빗질을 하지 않으면
        순식간에 헝클어진다.
      zh-Hant: |-
        牠美麗的尾巴深受人們喜愛。
        但如果沒有經常幫牠梳理，
        很快就會變得滿是毛球。
      zh-Hans: |-
        因漂亮的尾巴而深受人们喜爱。
        但是，如果不经常给其梳理毛发，
        很快就会变得全是毛球。
      en: |-
        Its beautiful tails have made it very popular.
        However, if it’s not brushed diligently, it will
        be a mass of tangles before you know it.
      fr: |-
        Ses queues magnifiques en font un Pokémon
        très populaire. Il faut toutefois les lui brosser
        fréquemment pour éviter les nœuds.
      de: |-
        Dank seiner hübschen Schweife erfreut es sich
        großer Beliebtheit. Wird es aber nicht regelmäßig
        gebürstet, ist es sofort voller Fellknäuel.
      es: |-
        Es muy popular por sus hermosas colas. Hay
        que cepillárselas a menudo o, de lo contrario,
        se le hacen enredos todo el rato.
      it: |-
        Le sue code lo rendono un Pokémon molto
        amato. Vanno spazzolate con cura per
        evitare che si riempiano subito di nodi.
    ultra-moon:
      ja-Hrkt: |-
        ひの　たまを　あやつり　えものを
        とらえる。　こどもから　そだてると
        こいぬポケモンの　ように　なつくよ。
      ja: |-
        火の玉を　操り　獲物を
        捕らえる。　子どもから　育てると
        こいぬポケモンの　ように　懐くよ。
      ko: |-
        불구슬을 조종하여 먹이를
        잡는다. 어릴 때부터 키우면
        강아지포켓몬처럼 따른다.
      zh-Hant: |-
        會操縱火球捕捉獵物。
        如果從小就開始養育的話，
        牠就會像小狗寶可夢那樣親近人。
      zh-Hans: |-
        会操纵火球捕捉猎物。
        如果从小就开始培育的话，
        它就会像小狗宝可梦那样亲近人哦。
      en: |-
        It manipulates balls of fire to catch its prey.
        If you raise one from when it’s young, it will
        grow close to you like a puppy Pokémon.
      fr: |-
        Il attrape ses proies en manipulant des boules
        de feu. Élevé depuis son plus jeune âge, il se
        révélera aussi affectueux qu’un Pokémon Chiot.
      de: |-
        Bei der Beutejagd speit es Feuerbälle. Zieht man
        ein Vulpix von Kindesbeinen an auf, entwickelt
        es eine Anhänglichkeit wie ein Hund-Pokémon.
      es: |-
        Es capaz de controlar bolas de fuego con las
        que atrapa a sus presas. Le coge apego a quien
        lo críe desde cachorro, cual Pokémon Perrito.
      it: |-
        Crea palle infuocate che usa con maestria per
        catturare le prede. Se allenato fin da cucciolo,
        si affeziona come un Pokémon Cagnolino.
    lets-go-pikachu:
      ja-Hrkt: |-
        けなみや　シッポが　うつくしい。
        おおきくなると　シッポの　さきが
        わかれて　ふえていく。
      ja: |-
        毛並みや　シッポが　美しい。
        大きくなると　シッポの　先が
        分かれて　増えていく。
      ko: |-
        털과 꼬리가 아름답다.
        성장하면 꼬리 끝이 갈라져서
        갈래가 많아진다.
      zh-Hant: |-
        有著美麗的毛皮和尾巴。
        尾巴會隨著年齡增長而分開，
        逐漸形成多條尾巴。
      zh-Hans: |-
        皮毛和尾巴都非常美丽。
        随着自身的成长，尾巴的末端
        会渐渐分开，数量也会增加。
      en: |-
        Both its fur and its tails are beautiful.
        As it grows, the tails split and form more tails.
      fr: |-
        Sa fourrure et sa queue sont magnifiques.
        Cette dernière se divise lors de la croissance.
      de: |-
        Sein Fell und sein Schweif sind wunderschön.
        Beim Heranwachsen spaltet sich sein Schweif
        in mehrere Teile auf.
      es: |-
        Sus colas y pelaje son preciosos. A medida que
        crece, las colas se dividen y forman otras
        nuevas.
      it: |-
        Il suo manto e le sue code sono meravigliosi.
        Crescendo, la sua coda sviluppa diverse
        diramazioni.
    lets-go-eevee:
      ja-Hrkt: |-
        けなみや　シッポが　うつくしい。
        おおきくなると　シッポの　さきが
        わかれて　ふえていく。
      ja: |-
        毛並みや　シッポが　美しい。
        大きくなると　シッポの　先が
        分かれて　増えていく。
      ko: |-
        털과 꼬리가 아름답다.
        성장하면 꼬리 끝이 갈라져서
        갈래가 많아진다.
      zh-Hant: |-
        有著美麗的毛皮和尾巴。
        尾巴會隨著年齡增長而分開，
        逐漸形成多條尾巴。
      zh-Hans: |-
        皮毛和尾巴都非常美丽。
        随着自身的成长，尾巴的末端
        会渐渐分开，数量也会增加。
      en: |-
        Both its fur and its tails are beautiful.
        As it grows, the tails split and form more tails.
      fr: |-
        Sa fourrure et sa queue sont magnifiques.
        Cette dernière se divise lors de la croissance.
      de: |-
        Sein Fell und sein Schweif sind wunderschön.
        Beim Heranwachsen spaltet sich sein Schweif
        in mehrere Teile auf.
      es: |-
        Sus colas y pelaje son preciosos. A medida que
        crece, las colas se dividen y forman otras
        nuevas.
      it: |-
        Il suo manto e le sue code sono meravigliosi.
        Crescendo, la sua coda sviluppa diverse
        diramazioni.
    sword:
      ja-Hrkt: |-
        こどもだが　６ぽんの　しっぽが
        うつくしい。　せいちょうすると
        さらに　しっぽが　ふえる。
      ja: |-
        子どもだが　６本の　しっぽが
        美しい。　成長すると　さらに
        しっぽが　増える。
      ko: |-
        어리지만 6개의 꼬리가
        아름답다. 성장하면
        한층 꼬리 수가 늘어난다.
      zh-Hant: |-
        雖然還是孩子，
        但已擁有美麗的６根尾巴。
        長大後尾巴會變得更多。
      zh-Hans: |-
        虽然还是幼崽，
        却有着６根美丽的尾巴。
        长大后，尾巴会变得更多。
      en: |-
        While young, it has six gorgeous tails. When it
        grows, several new tails are sprouted.
      fr: |-
        Quand il est jeune, ce Pokémon a six queues
        magnifiques. De nouvelles queues apparaissent
        tout au long de sa croissance.
      de: |-
        In seiner Jugend hat es sechs hinreißende
        Schweife. Während es wächst, kommen noch
        weitere neue Schweife hinzu.
      es: |-
        De pequeño, tiene seis colas de gran belleza.
        A medida que crece, le van saliendo más.
      it: |-
        Quando è giovane ha sei meravigliose code,
        che si moltiplicano durante la sua crescita.
    shield:
      ja-Hrkt: |-
        ６ぽんの　しっぽは　そだつごとに
        けなみが　よくなり　うつくしくなる。
        だきしめると　ほんのり　あたたかい。
      ja: |-
        ６本の　しっぽは　育つごとに
        毛並みが　良くなり　美しくなる。
        抱きしめると　ほんのり　温かい。
      ko: |-
        6개의 꼬리는 자라면서
        털의 결이 좋아지며 아름다워진다.
        안으면 살짝 따듯하다.
      zh-Hant: |-
        隨著身體的成長，
        ６根尾巴的毛髮也會變得更漂亮。
        緊緊抱著牠時能感到微微的溫暖。
      zh-Hans: |-
        随着身体的成长，
        ６根尾巴的毛发也会变得更漂亮。
        紧紧抱着它时能感到微微的温暖。
      en: |-
        As each tail grows, its fur becomes more lustrous.
        When held, it feels slightly warm.
      fr: |-
        Avec l’âge, la fourrure de ses six queues devient
        de plus en plus belle et soyeuse.
        Elle est chaude au toucher.
      de: |-
        Sein Fell wird geschmeidiger, wenn seine sechs
        Schweife wachsen. Wenn man das Fell berührt,
        fühlt es sich leicht warm an.
      es: |-
        Su pelaje se va volviendo más suave, lustroso
        y bello a medida que le crecen las seis colas.
        Al abrazarlo, emana una ligera calidez.
      it: |-
        Man mano che cresce, le sue sei code diventano
