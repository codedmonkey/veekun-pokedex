roggenrola:
  base_happiness: 50
  capture_rate: 255
  color: blue
  egg_groups:
    - mineral
  evolution_chain: roggenrola
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        Its ear is hexagonal in shape.
        Compressed underground,
        its body is as hard as steel.
      fr: |-
        Il a une oreille hexagonale. Son
        corps, compressé dans des strates
        profondes, est dur comme de l’acier.
    white:
      en: |-
        They were discovered a hundred years
        ago in an earthquake fissure. Inside
        each one is an energy core.
      fr: |-
        On l’a découvert dans une fissure après
        un grand tremblement de terre il y a
        100 ans. Il possède un noyau d’énergie.
    black-2:
      en: |-
        The hexagonal-shaped hole is its ear.
        It has a tendency to walk in the
        direction the sound is coming from.
    white-2:
      en: |-
        The hexagonal-shaped hole is its ear.
        It has a tendency to walk in the
        direction the sound is coming from.
    x:
      ja-Hrkt: |-
        ６かくけいの　みみを　もつ。
        ちていで　あっしゅくされた　からだは
        てつに　まけないくらい　かたい。
      ja: |-
        ６角形の　耳を　持つ。
        地底で　圧縮された　体は
        鉄に　負けないくらい　硬い。
      ko: |-
        육각형 귀를 가지고 있다.
        땅속 깊은 곳에서 압축된 몸은
        철 못지않게 단단하다.
      en: |-
        Its ear is hexagonal in shape. Compressed
        underground, its body is as hard as steel.
      fr: |-
        Il a une oreille hexagonale. Son corps, compressé
        dans des strates profondes, est dur comme de l’acier.
      de: |-
        Hat ein sechseckiges Ohr. Sein durch das Erdreich
        gepresster Körper steht Stahl in Sachen Härte
        in nichts nach.
      es: |-
        Su oreja tiene forma hexagonal. Su cuerpo fue
        comprimido bajo tierra. Por eso, es duro como el
        acero.
      it: |-
        Ha un solo orecchio di forma esagonale. Essendo
        stato compresso sotto terra, il suo corpo è duro
        quasi come l’acciaio.
    'y':
      ja-Hrkt: |-
        １００ねんまえの　だいじしんのとき
        じわれから　はっけんされた。
        たいないに　エネルギーコアを　もつ。
      ja: |-
        １００年前の　大地震のときに
        地割れから　発見された。
        体内に　エネルギーコアを　持つ。
      ko: |-
        100년 전 대지진 때
        갈라진 땅에서 발견되었다.
        체내에 에너지 코어를 가지고 있다.
      en: |-
        They were discovered a hundred years ago in an
        earthquake fissure. Inside each one is an
        energy core.
      fr: |-
        On l’a découvert dans une fissure après un grand
        tremblement de terre il y a 100 ans. Il possède
        un noyau d’énergie.
      de: |-
        Wurde vor 100 Jahren nach einem großen Erdbeben in
        einer Erdspalte entdeckt. Es trägt eine Energiesphäre
        in sich.
      es: |-
        Descubierto en unas grietas generadas por un
        terremoto hace 100 años. Tiene un núcleo energético
        en su cuerpo.
      it: |-
        Scoperto nelle spaccature del terreno dopo il grande
        terremoto di 100 anni fa. Ha all’interno un nucleo di
        energia.
    omega-ruby:
      ja-Hrkt: |-
        ６かくけいの　みみを　もつ。
        ちていで　あっしゅくされた　からだは
        てつに　まけないくらい　かたい。
      ja: |-
        ６角形の　耳を　持つ。
        地底で　圧縮された　体は
        鉄に　負けないくらい　硬い。
      ko: |-
        육각형 귀를 가지고 있다.
        땅속 깊은 곳에서 압축된 몸은
        철 못지않게 단단하다.
      en: |-
        Its ear is hexagonal in shape. Compressed
        underground, its body is as hard as steel.
      fr: |-
        Il a une oreille hexagonale. Son corps, compressé
        dans des strates profondes, est dur comme de l’acier.
      de: |-
        Hat ein sechseckiges Ohr. Sein durch das Erdreich gepresster
        Körper steht Stahl in Sachen Härte in nichts nach.
      es: |-
        Su oreja tiene forma hexagonal. Su cuerpo fue comprimido
        bajo tierra. Por eso, es duro como el acero.
      it: |-
        Ha un solo orecchio di forma esagonale. Essendo stato
        compresso sotto terra, il suo corpo è duro quasi come
        l’acciaio.
    alpha-sapphire:
      ja-Hrkt: |-
        １００ねんまえの　だいじしんのとき
        じわれから　はっけんされた。
        たいないに　エネルギーコアを　もつ。
      ja: |-
        １００年前の　大地震のときに
        地割れから　発見された。
        体内に　エネルギーコアを　持つ。
      ko: |-
        100년 전 대지진 때
        갈라진 땅에서 발견되었다.
        체내에 에너지 코어를 가지고 있다.
      en: |-
        They were discovered a hundred years ago in an
        earthquake fissure. Inside each one is an
        energy core.
      fr: |-
        On l’a découvert dans une fissure après un grand tremblement
        de terre il y a 100 ans. Il possède un noyau d’énergie.
      de: |-
        Wurde vor 100 Jahren nach einem großen Erdbeben in einer
        Erdspalte entdeckt. Es trägt eine Energiesphäre in sich.
      es: |-
        Descubierto en unas grietas generadas por un terremoto hace
        100 años. Tiene un núcleo energético en su cuerpo.
      it: |-
        Scoperto nelle spaccature del terreno dopo il grande
        terremoto di 100 anni fa. Ha all’interno un nucleo di energia.
    sun:
      ja-Hrkt: |-
        ちちゅうの　おくふかくで　うまれた。
        ちかい　なかまの　イシツブテや
        メレシーと　かたさくらべをする。
      ja: |-
        地中の　奥深くで　生まれた。
        近い　仲間の　イシツブテや
        メレシーと　硬さ比べをする。
      ko: |-
        땅속 깊은 곳에서 태어났다.
        가까운 친구인 꼬마돌이나
        멜리시와 딱딱함을 비교한다.
      zh-Hant: |-
        在地下的最深處誕生。
        會和血緣相近的小拳石
        還有小碎鑽互相較量硬度。
      zh-Hans: |-
        在地下的最深处诞生。
        会与亲缘相近的小拳石
        和小碎钻较量硬度。
      en: |-
        Born deep within the ground, it compares itself
        with similar species, such as Geodude and
        Carbink, to settle which has the hardest body.
      fr: |-
        Ce Pokémon est né dans les entrailles de
        la terre. Il adore comparer sa solidité à celle
        de ses amis, Racaillou et Strassie.
      de: |-
        Es wurde tief unter der Erde geboren.
        Mit befreundeten Kleinstein und Rocara stellt es
        Vergleiche an, wessen Körper am härtesten sei.
      es: |-
        Nació en las profundidades subterráneas.
        Siempre se compara con sus compañeros
        Geodude y Carbink para ver quién es más duro.
      it: |-
        Questo Pokémon è nato sottoterra.
        Si diverte a fare gare di durezza con i suoi amici
        Geodude e Carbink.
    moon:
      ja-Hrkt: |-
        ろっかくけいの　くうどうは　みみ。
        おとが　なるほうへ　あるいていくが
        おとが　やむと　こまって　ころぶ。
      ja: |-
        六角形の　空洞は　耳。
        音が　鳴るほうへ　歩いていくが
        音が　止むと　困って　転ぶ。
      ko: |-
        육각형의 구멍은 귀다.
        소리가 나는 쪽으로 걸어가지만
        소리가 그치면 당황해서 넘어진다.
      zh-Hant: |-
        六角形的空洞是耳朵。
        會朝著聲音響起的方向走過去，
        但聲音一旦停止便會迷惘地跌倒。
      zh-Hans: |-
        六角形的空洞是耳朵。
        会朝着声音响起的方向走过去，
        但声音一旦停止就迷惘地跌倒。
      en: |-
        The hexagonal cavity is its ear. It walks in the
        direction of sounds it hears, but if the sounds
        cease, it panics and topples over.
      fr: |-
        La cavité hexagonale qu’il arbore est son oreille.
        Il se précipite vers tout ce qu’il entend, mais
        perd l’équilibre et chute dès que le son s’arrête.
      de: |-
        Die sechseckige Aushöhlung dient ihm als Ohr.
        Es bewegt sich immer auf Geräusche zu, fällt
        jedoch ratlos um, sobald diese verstummen.
      es: |-
        La cavidad hexagonal es su oído. Camina hacia
        donde se emite cualquier sonido, pero si este
        cesa pierde el equilibrio y cae al suelo.
      it: |-
        La conca esagonale è il suo orecchio. Ha
        l’abitudine di camminare in direzione dei rumori,
        ma se questi cessano, si confonde e cade.
    ultra-sun:
      ja-Hrkt: |-
        ６かくけいの　あなは　みみ。　みみの
        おくには　エネルギーコアが　あるので
        てを　つっこむと　おこりだすぞ。
      ja: |-
        六角形の　穴は　耳。　耳の
        奥には　エネルギーコアが　あるので
        手を　突っ込むと　怒りだすぞ。
      ko: |-
        육각형의 구멍은 귀다. 
        귀 안에 에너지 코어가 있어서
        손을 넣으면 화를 낸다.
      zh-Hant: |-
        六角形的洞是耳朵。
        耳朵裡面有能量核心，
        如果把手伸進去就會惹牠生氣。
      zh-Hans: |-
        六角形的洞是它的耳朵。
        耳朵里面有能量核心，
        所以如果把手伸进去就会发怒。
      en: |-
        The hexagonal hole is its ear. Deep in that ear is
        an energy core, so if you stick your hand in
        there, Roggenrola will be very angry!
      fr: |-
        Sa cavité hexagonale est une oreille. Il se met
        en colère si l’on tente d’y plonger la main, car
        c’est là que se trouve son noyau d’énergie.
      de: |-
        Das sechseckige Loch dient ihm als Ohr. Tief
        darin liegt sein Energiekern versteckt. Wenn
        jemand hineingreift, wird es wütend.
      es: |-
        El agujero con forma de hexágono es su oído, y
        en su interior cuenta con un núcleo de energía,
        por lo que se enfurece si meten la mano dentro.
      it: |-
        La conca esagonale è il suo orecchio, al cui
        interno si trova un nucleo di energia. Per questo
        si arrabbia se qualcuno ci infila una mano.
    ultra-moon:
      ja-Hrkt: |-
        じわれの　だんそうから　みつかった。
        からだを　こうせいする　せいぶんは
        なんびゃくねんも　まえの　つちだ。
      ja: |-
        地割れの　断層から　見つかった。
        身体を　構成する　成分は
        何百年も　前の　土だ。
      ko: |-
        땅이 갈라진 곳의 단층에서 발견되었다.
        몸을 구성하는 성분은
        수백 년도 전의 흙이다.
      zh-Hant: |-
        在地裂的斷層中被發現。
        構成身體的成分是
        好幾百年前的泥土。
      zh-Hans: |-
        是从地裂的断层中被发现的。
        构成身体的成分是好几百年前的土。
      en: |-
        It was found in a fissure in a layer of exposed
        rock. The material that makes up its body is
        dirt from several hundred years ago.
      fr: |-
        Ce Pokémon a été découvert dans une faille
        rocheuse. La terre qui constitue son corps
        remonte à plusieurs centaines d’années.
      de: |-
        Dieses Pokémon wurde in den Klüften einer
        Erdspalte entdeckt. Sein Körper setzt sich aus
        jahrhundertealter Erde zusammen.
      es: |-
        Fue descubierto entre las grietas de una falla.
        Su cuerpo está compuesto por una tierra que
        data de cientos de años.
      it: |-
        È stato trovato nelle spaccature del terreno.
        Il suo corpo è composto da terra risalente a
        centinaia di anni fa.
    sword:
      ja-Hrkt: |-
        てつと　おんなじくらい　かたいが
        ながく　みずに　つかっていると
        ちょっと　やわらかくなるらしい。
      ja: |-
        鉄と　同じくらい　硬いが
        長く　水に　浸かっていると
        ちょっと　軟らかくなるらしい。
      ko: |-
        철과 비슷하게 단단하지만
        오랫동안 물에 담가두면
        조금 부드러워진다고 한다.
      zh-Hant: |-
        幾乎和鐵一樣堅硬，
        但要是長時間浸在水裡，
        似乎就會稍微變軟一些。
      zh-Hans: |-
        几乎和铁一样硬，
        但要是长时间浸在水里，
        似乎就会稍微变软一些。
      en: |-
        It’s as hard as steel, but apparently a long soak in
        water will cause it to soften a bit.
      fr: |-
        Son corps est aussi dur que le fer,
        mais si on le laisse longtemps dans l’eau,
        il paraît qu’il ramollit légèrement.
      de: |-
        Sein Körper ist hart wie Stahl, aber nach einem
        längeren Aufenthalt im Wasser weicht er wohl
        ein wenig auf.
      es: |-
        Su cuerpo es casi tan duro como el acero, pero
        al parecer puede reblandecerse levemente si
        permanece sumergido en agua mucho tiempo.
      it: |-
        È duro quasi quanto l’acciaio, ma sembra che
        si ammorbidisca leggermente se viene immerso
        a lungo in acqua.
    shield:
      ja-Hrkt: |-
        おとに　はんのうし　うごきだす。
        エネルギーコアの　えいきょうで
        さわると　すこし　あったかい。
      ja: |-
        音に　反応し　動きだす。
        エネルギーコアの　影響で
        触ると　すこし　温かい。
      ko: |-
        소리에 반응해 움직인다.
        에너지 코어의 영향으로
        만지면 조금 따듯하다.
      zh-Hant: |-
        會對聲音產生反應而動起來。
        在能量核心的影響下，
        牠摸起來暖暖的。
      zh-Hans: |-
        会对声音产生反应而动起来。
        在能量核心的影响下，
        它摸起来暖暖的。
      en: |-
        When it detects a noise, it starts to move.
        The energy core inside it makes this Pokémon
        slightly warm to the touch.
      fr: |-
        Il se déplace en réagissant aux sons environnants.
        Son noyau d’énergie rend son corps légèrement
        chaud au toucher.
      de: |-
        Es bewegt sich stets auf Geräuschquellen zu.
        Dank seines Energiekerns fühlt es sich immer
        leicht warm an, wenn man es berührt.
      es: |-
        Se dirige hacia cualquier sonido que perciba.
        Es ligeramente cálido al tacto, debido al efecto
        de su núcleo energético.
      it: |-
        Si muove reagendo ai rumori. È tiepido al tatto
        per via del nucleo di energia al suo interno.
