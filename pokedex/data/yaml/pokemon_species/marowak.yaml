        per la perdita della madre ed essersi fatto forte. Questo
        Pokémon dall’animo forgiato e temprato non si fa prendere
        facilmente dallo sconforto.
    sun:
      ja-Hrkt: |-
        もともとは　ひよわで　おくびょう。
        しんかで　ホネを　ふりまわす
        きょうぼうな　せいしつに　なる。
      ja: |-
        元々は　ひ弱で　おくびょう。
        進化で　骨を　振り回す
        乱暴な　性質に　なる。
      ko: |-
        원래는 약하고 겁이 많다.
        진화로 뼈다귀를 휘두르는
        난폭한 성질이 된다.
      zh-Hant: |-
        原本因體弱而很膽小。
        進化後變成了揮舞著骨頭的粗暴性格。
      zh-Hans: |-
        原本因体弱而很胆小。
        进化后变成了挥舞着骨头的粗暴性格。
      en: |-
        Originally, it was weak and timid. After evolution,
        its temperament becomes violent, and it begins
        to wield bones as weapons.
      fr: |-
        Il était faible et peureux, mais après avoir
        évolué, il a appris à manier son os avec férocité
        et est devenu plus violent et agressif.
      de: |-
        Vor der Entwicklung war es schwach und
        ängstlich. Jetzt ist es hitzköpfig und schlägt
        wild mit einem Knochen um sich.
      es: |-
        Cuando Cubone evoluciona a Marowak, deja de
        ser débil y cobarde, se vuelve más agresivo y
        usa el hueso como arma.
      it: |-
        Prima era timido e pauroso, ma dopo
        l’evoluzione è diventato aggressivo, come
        dimostra l’osso che brandisce.
    moon:
      ja-Hrkt: |-
        ホネを　ブーメランのように　なげつけ
        てんてきだった　バルジーナを
        うちおとし　ふくしゅう　するのだ。
      ja: |-
        骨を　ブーメランのように　投げつけ
        天敵だった　バルジーナを
        撃ち落とし　復しゅう　するのだ。
      ko: |-
        뼈다귀를 부메랑처럼 내던져서
        천적이었던 버랜지나를
        떨어뜨려 복수한다.
      zh-Hant: |-
        將骨頭像回力鏢一樣扔出去，
        擊落天敵禿鷹娜來復仇。
      zh-Hans: |-
        将骨头像回力镖一样扔出去，
        击落天敌秃鹰娜来复仇。
      en: |-
        This Pokémon is out for vengeance on its natural
        enemy, Mandibuzz. It throws bones like
        boomerangs to try to take it down.
      fr: |-
        Il lance le grand os comme un boomerang pour
        abattre son ancien prédateur, les Vaututrice,
        pour se venger.
      de: |-
        Es wirft seinen Knochen bumeranggleich nach
        Grypheldis, dem Erzfeind seiner Vorstufe, um es
        vom Himmel zu holen und sich an ihm zu rächen.
      es: |-
        Utiliza su hueso como si fuese un bumerán para
        derribar a Mandibuzz, su enemigo natural, a
        modo de venganza.
      it: |-
        Scaglia il suo osso come un boomerang per
        abbattere i Mandibuzz, suoi antichi predatori,
        e vendicarsi.
    ultra-sun:
      ja-Hrkt: |-
        ホネを　なげつけ　バルジーナを
        うちおとす。　おやの　かたきを
        うっていると　かんがえられている。
      ja: |-
        ホネを　投げつけ　バルジーナを
        撃ち落す。　親の　かたきを
        討っていると　考えられている。
      ko: |-
        뼈를 던져 버랜지나를
        떨어뜨린다. 부모의 원한을
        갚기 위한 것으로 추측된다.
      zh-Hant: |-
        會投擲骨頭擊落禿鷹娜。
        人們認為牠這麼做是
        為了幫母親報仇。
      zh-Hans: |-
        会用力扔骨头击落秃鹰娜。
        人们认为它这是在给亲人报仇。
      en: |-
        It throws bones at Mandibuzz to knock it down.
        It’s thought that Marowak is trying to avenge
        its parent.
      fr: |-
        Il lance son os pour abattre les Vaututrice.
        On pense qu’il agit ainsi pour venger sa mère.
      de: |-
        Es wirft seinen Knochen nach Grypheldis, um es
        vom Himmel zu holen. Man nimmt an, dass es
        sich für seine Mutter an ihm rächen will.
      es: |-
        Lanza su hueso para abatir a los Mandibuzz.
        Según cuentan, es su forma de vengar a su
        madre.
      it: |-
        Scaglia il suo osso per abbattere i Mandibuzz.
        Si dice che in questo modo voglia vendicare
        la morte di sua madre.
    ultra-moon:
      ja-Hrkt: |-
        リズミカルに　ホネを　うちならし
        なかまと　れんらくを　とりあっている。
        そのパターンは　５０ちかく　あるのだ。
      ja: |-
        リズミカルに　ホネを　打ち鳴らし
        仲間と　連絡を　取りあっている。
        そのパターンは　５０近く　あるのだ。
      ko: |-
        리드미컬하게 뼈다귀를 두들겨서
        동료와 연락을 주고받는다.
        그 패턴은 50개 가까이 존재한다.
      zh-Hant: |-
        會節奏性地敲響骨頭，
        藉此與夥伴進行聯絡。
        節奏有著將近５０種不同變化。
      zh-Hans: |-
        会有节奏地敲响骨头，
        并以此和伙伴进行联络。
        节奏有着近５０种变化。
      en: |-
        They thump their bones rhythmically to
        communicate among themselves. There are
        nearly 50 different rhythmic patterns.
      fr: |-
        Il joue des percussions avec son os afin de
        communiquer avec ses congénères. Il existe
        une cinquantaine de mélodies différentes.
      de: |-
        Es kommuniziert mit seinen Kameraden durch
        rhythmisches Knochenklappern. Fast 50 Muster
        sind bisher bekannt.
      es: |-
        Se comunica con los suyos golpeando su hueso
        rítmicamente. Se han llegado a contabilizar
        hasta cincuenta patrones distintos.
      it: |-
        Comunica con i propri simili sbattendo
        ritmicamente il suo osso. Sono stati contati
        circa 50 ritmi diversi.
    lets-go-pikachu:
      ja-Hrkt: |-
        からだは　ちいさく　よわかったが
        ホネを　うまく　つかって　たたかう
        きょうぼうな　せいかくに　なった。
      ja: |-
        体は　小さく　弱かったが
        ホネを　うまく　使って　戦う
        凶暴な　性格に　なった。
      ko: |-
        몸집은 작고 약했지만
        뼈를 능숙하게 사용해서 싸우는
        흉포한 성격이 되었다.
      zh-Hant: |-
        原本身體十分弱小，但如今
        已能靈活運用骨頭來戰鬥，
        性格也變得很兇暴。
      zh-Hans: |-
        身体曾经又小又弱，在
        习惯了使用骨头战斗后
        才变成了粗暴的性格。
      en: |-
        Small and weak, this Pokémon is adept
        with its bone club. It has grown more vicious
        over the ages.
      fr: |-
        Ce Pokémon, autrefois si petit et si faible,
        est devenu très féroce. Il se bat habilement,
        armé de son os.
      de: |-
        Einst war es klein und schwach, doch jetzt ist es
        geschickt im Umgang mit seinem Knochen und
        verhält sich äußerst brutal.
      es: |-
        Este Pokémon ha dejado atrás su debilidad y
        se ha vuelto más feroz con el paso del tiempo.
        Blande su hueso con destreza.
      it: |-
        Questo Pokémon era piccolo e debole, ma
        si è fatto aggressivo e ha imparato a usare
        abilmente il suo osso nella lotta.
    lets-go-eevee:
      ja-Hrkt: |-
        からだは　ちいさく　よわかったが
