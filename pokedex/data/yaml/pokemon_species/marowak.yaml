    sword:
      ja-Hrkt: |-
        かなしみを　のりこえて　たくましく
        しんかした。　ホネを　ぶきにして
        ゆうかんに　てきと　わたりあう。
      ja: |-
        悲しみを　乗りこえて　たくましく
        進化した。　骨を　武器にして
        勇敢に　敵と　渡り合う。
      ko: |-
        슬픔을 극복하고 늠름하게
        진화했다. 뼈를 무기 삼아
        용감하게 적과 맞서 싸운다.
      zh-Hant: |-
        克服了傷痛後進化得
        更強更壯。會把骨頭當作
        武器，勇敢地與敵人交鋒。
      zh-Hans: |-
        摆脱悲伤后，进化得
        更加强壮。以骨头为武器，
        勇敢地与敌人进行交锋。
      en: |-
        This Pokémon overcame its sorrow to evolve a
        sturdy new body. Marowak faces its opponents
        bravely, using a bone as a weapon.
      fr: |-
        Il s’est endurci et a évolué depuis qu’il a réussi
        à surmonter sa peine. Il utilise son os en guise
        d’arme et affronte ses ennemis avec bravoure.
      de: |-
        Als es seine Trauer überwand, entwickelte es sich
        und wurde stärker. Mit seinem Knochen als Waffe
        stellt sich Knogga mutig seinen Feinden.
      es: |-
        Ha evolucionado tras fortalecerse y superar
        su pena. Ahora lucha con arrojo blandiendo
        su hueso a modo de arma.
      it: |-
        Si è evoluto dopo essersi temprato e aver
        superato il lutto. Usa l’osso come un’arma
        e lotta valorosamente contro i nemici.
    shield:
      ja-Hrkt: |-
        しんかして　かぶっていた　ははおやの
        ホネが　いったいかして　そのうえ
        きょうぼうな　せいかくに　かわった。
      ja: |-
        進化して　被っていた　母親の　骨が
        一体化して　そのうえ
        凶暴な　性格に　変わった。
      ko: |-
        진화로 인해 쓰고 있던
        어미의 뼈는 일체화되었고
        성격은 더욱 난폭해졌다.
      zh-Hant: |-
        進化時，原本戴在頭上的母親
        頭骨化為了牠身體的一部份。
        不但如此，性格也變得很凶暴。
      zh-Hans: |-
        进化后，与原本戴在头上的
        母亲头骨完全融为一体，
        而且性格也变得十分凶暴。
      en: |-
        When this Pokémon evolved, the skull of its
        mother fused to it. Marowak’s temperament also
        turned vicious at the same time.
      fr: |-
        En évoluant, il est devenu violent, et le crâne
        de sa mère qu’il portait a fusionné avec sa tête.
      de: |-
        Durch die Entwicklung wurde der Schädel seiner
