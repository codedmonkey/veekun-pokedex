    x:
      ja-Hrkt: |-
        はなの　ミツが　だいすき。
        ミツハニーの　あつめた　ミツを
        よこどりして　たべてしまう。
      ja: |-
        花の　ミツが　大好き。
        ミツハニーの　集めた　ミツを
        横取りして　食べてしまう。
      ko: |-
        꽃의 꿀을 매우 좋아한다.
        세꿀버리가 모아둔 꿀을
        가로채어 먹어 버린다.
      en: |-
        It loves the honey of flowers and steals honey
        collected by Combee.
      fr: |-
        Il aime le nectar des fleurs et n’hésite pas à voler
        celui que récupère Apitrini.
      de: |-
        Es liebt Honig und stiehlt den Honig,
        der von Wadribie gesammelt wurde.
      es: |-
        Le encanta la miel de las flores y roba la que recoge
        Combee.
      it: |-
        Ama il nettare dei fiori. Ruba e mangia il nettare
        raccolto da Combee.
    'y':
      ja-Hrkt: |-
        よなか　かっぱつに　とびまわり
        ねむっている　ミツハニーの　す　から
        ミツを　うばって　にげる。
      ja: |-
        夜中　活発に　飛び回り
        眠っている　ミツハニーの　巣から
        ミツを　奪って　逃げる。
      ko: |-
        한밤중에 활발하게 날아다니며
        잠든 세꿀버리의 둥지에서
        꿀을 훔쳐 달아난다.
      en: |-
        It flutters around at night and steals honey from
        the Combee hive.
      fr: |-
        Ce Pokémon s’active à la nuit tombée pour voler
        le miel des Apitrini pendant leur sommeil.
      de: |-
        Nachts fliegt es emsig umher und stiehlt,
        während Wadribie schläft, Honig aus dessen Nest.
      es: |-
        Hace vida nocturna. Revolotea y roba la miel de las
        colmenas de Combee cuando duermen.
      it: |-
        Vola qua e là di notte per derubare i Combee del
        loro nettare mentre dormono, e poi fuggire.
    omega-ruby:
      ja-Hrkt: |-
        はなの　ミツが　だいすき。
        ミツハニーの　あつめた　ミツを
        よこどりして　たべてしまう。
