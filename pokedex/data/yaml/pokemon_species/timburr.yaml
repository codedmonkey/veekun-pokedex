timburr:
  base_happiness: 70
  capture_rate: 180
  color: gray
  egg_groups:
    - humanshape
  evolution_chain: timburr
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        It fights by swinging a piece of lumber
        around. It is close to evolving when it
        can handle the lumber without difficulty.
      fr: |-
        Il combat avec une poutre. Quand il en
        arrive à transporter de lourds madriers
        sans problème, l’évolution est proche.
    white:
      en: |-
        These Pokémon appear at building
        sites and help out with construction.
        They always carry squared logs.
      fr: |-
        Il porte toujours une poutre.
        Il apparaît sur les chantiers
        pour aider aux travaux.
    black-2:
      en: |-
        Always carrying squared logs,
        they help out with construction.
        As they grow, they carry bigger logs.
    white-2:
      en: |-
        Always carrying squared logs,
        they help out with construction.
        As they grow, they carry bigger logs.
    x:
      ja-Hrkt: |-
        いつも　かくざいを　かかえている。
        けんちく　げんばに　あらわれて
        こうじを　てつだう　ポケモン。
      ja: |-
        いつも　角材を　抱えている。
        建築　現場に　現れて
        工事を　手伝う　ポケモン。
      ko: |-
        항상 각목을 끼고 있다.
        건설 현장에 나타나
        공사를 도와주는 포켓몬이다.
      en: |-
        These Pokémon appear at building sites and help
        out with construction. They always carry
        squared logs.
      fr: |-
        Il porte toujours une poutre. Il apparaît sur les
        chantiers pour aider aux travaux.
      de: |-
        Trägt stets einen Holzbalken bei sich. Es taucht
        hier und da auf Baustellen auf und hilft dort den
        Arbeitern aus.
      es: |-
        Siempre lleva vigas de madera. Normalmente ayuda
        en obras de construcción.
      it: |-
        Porta sempre con sé una tavola di legno. Appare
        nei cantieri dove aiuta nei lavori.
    'y':
      ja-Hrkt: |-
        つねに　かくざいを　もちあるき
        どぼくこうじを　てつだう。そだつと
        おおきな　かくざいに　もちかえる。
      ja: |-
        常に　角材を　持ち歩き
        土木工事を　手伝う。育つと
        大きな　角材に　持ち替える。
      ko: |-
        항상 각재를 들고 다니며
        토목공사를 도와준다. 자라면
        큰 각재로 바꿔 든다.
      en: |-
        Always carrying squared logs, they help out with
        construction. As they grow, they carry bigger logs.
      fr: |-
        Il porte toujours une poutre en bois et aime aider aux
        travaux. Il passe à un lourd madrier quand il grandit.
      de: |-
        Trägt stets einen Holzbalken bei sich und hilft auf
        Baustellen aus. Nach einer Weile sucht es sich
        einen größeren Balken.
      es: |-
        Siempre lleva una viga de madera y ayuda en las
        construcciones. Se busca una viga más grande cuando
        se hace más fuerte.
      it: |-
        Porta sempre con sé una tavola di legno e aiuta nei
        lavori edilizi. Quando cresce si sceglie una tavola
        più grande.
    omega-ruby:
      ja-Hrkt: |-
        いつも　かくざいを　かかえている。
        けんちく　げんばに　あらわれて
        こうじを　てつだう　ポケモン。
      ja: |-
        いつも　角材を　抱えている。
        建築　現場に　現れて
        工事を　手伝う　ポケモン。
      ko: |-
        항상 각목을 끼고 있다.
        건설 현장에 나타나
        공사를 도와주는 포켓몬이다.
      en: |-
        These Pokémon appear at building sites and help
        out with construction. They always carry
        squared logs.
      fr: |-
        Il porte toujours une poutre. Il apparaît sur les chantiers
        pour aider aux travaux.
      de: |-
        Trägt stets einen Holzbalken bei sich. Es taucht hier und da
        auf Baustellen auf und hilft dort den Arbeitern aus.
      es: |-
        Siempre lleva vigas de madera. Normalmente ayuda en obras
        de construcción.
      it: |-
        Porta sempre con sé una tavola di legno. Appare nei cantieri
        dove aiuta nei lavori.
    alpha-sapphire:
      ja-Hrkt: |-
        つねに　かくざいを　もちあるき
        どぼくこうじを　てつだう。そだつと
        おおきな　かくざいに　もちかえる。
      ja: |-
        常に　角材を　持ち歩き
        土木工事を　手伝う。育つと
        大きな　角材に　持ち替える。
      ko: |-
        항상 각재를 들고 다니며
        토목공사를 도와준다. 자라면
        큰 각재로 바꿔 든다.
      en: |-
        Always carrying squared logs, they help out with
        construction. As they grow, they carry bigger logs.
      fr: |-
        Il porte toujours une poutre en bois et aime aider aux travaux.
        Il passe à un lourd madrier quand il grandit.
      de: |-
        Trägt stets einen Holzbalken bei sich und hilft auf Baustellen
        aus. Nach einer Weile sucht es sich einen größeren Balken.
      es: |-
        Siempre lleva una viga de madera y ayuda en las
        construcciones. Se busca una viga más grande cuando
        se hace más fuerte.
      it: |-
        Porta sempre con sé una tavola di legno e aiuta nei lavori
        edilizi. Quando cresce si sceglie una tavola più grande.
    sword:
      ja-Hrkt: |-
        けんちくの　てつだいが　すき。
        あめで　こうじが　やすみの　ひは
        かくざいを　ふりまわし　あばれる。
      ja: |-
        建築の　手伝いが　好き。
        雨で　工事が　休みの　日は
        角材を　振りまわし　暴れる。
      ko: |-
        건축 일을 돕는 것을 좋아한다.
        비가 내려서 공사를 쉬는 날에는
        각목을 휘두르며 날뛴다.
      zh-Hant: |-
        喜歡幫忙做建築的工作。
        因為下雨而停工時，
        會亂揮木材大鬧一番。
      zh-Hans: |-
        喜欢帮忙做建筑的工作。
        因为下雨而停工时，
        会乱挥木材大闹一番。
      en: |-
        It loves helping out with construction projects.
        It loves it so much that if rain causes work to halt,
        it swings its log around and throws a tantrum.
      fr: |-
        Il aime donner un coup de main sur les chantiers.
        Lorsque le travail cesse à cause de la pluie,
        il brandit sa poutre de colère.
      de: |-
        Es hilft gern auf Baustellen aus. Bleiben diese
        bei Regen geschlossen, macht es seinem Ärger
        Luft, indem es seinen Holzbalken schwingt.
      es: |-
        Le gusta ayudar en labores de construcción.
        Cuando la lluvia obliga a interrumpir las obras,
        blande con furia su viga de madera.
      it: |-
        Gli piace dare una mano nei lavori edili, e
        quando vengono interrotti per la pioggia,
        si sfoga facendo roteare la sua trave.
    shield:
      ja-Hrkt: |-
        じぶんの　３ばいくらいの　かくざいを
        もつように　なった　ドッコラーは
        しんかの　ひが　ちかい。
      ja: |-
        自分の　３倍くらいの　角材を
        持つように　なった　ドッコラーは
        進化の　日が　近い。
      ko: |-
        자신의 3배 정도의 각목을
        들 수 있게 된 으랏차는
        머지않아 진화하게 된다.
      zh-Hant: |-
        如果搬運小匠可以搬起
        自己體重３倍左右的木材，
        就代表牠進化的日子要到了。
      zh-Hans: |-
        如果搬运小匠可以搬起
        自己体重３倍左右的方材，
        就代表它进化的日子要到了。
      en: |-
        Timburr that have started carrying logs that are
        about three times their size are nearly ready
        to evolve.
      fr: |-
        Lorsque Charpenti est capable de soulever
        une poutre faisant trois fois son poids,
        le jour de son évolution est proche.
      de: |-
        Man sagt, seine Entwicklung stehe dann kurz
        bevor, wenn es einen Holzbalken heben kann,
        der dreimal so groß und schwer ist wie es selbst.
      es: |-
        Cuando logra transportar una viga de madera
        que triplica su altura y peso, es señal de que va
        a evolucionar.
      it: |-
        Quando diventa capace di reggere travi di legno
        tre volte più grandi di lui, l’evoluzione è vicina.
