gossifleur:
  base_happiness: 50
  capture_rate: 190
  color: green
  egg_groups:
    - plant
  evolution_chain: gossifleur
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        いっぽんあしを　じめんに　さして
        ひのひかりを　たっぷり　あびると
        はなびらが　あざやかに　いろづく。
      ja: |-
        一本足を　地面に　刺して
        陽の光を　たっぷり　浴びると
        花びらが　鮮やかに　色づく。
      ko: |-
        다리 하나를 땅에 꽂은 채
        햇빛을 잔뜩 받으면
        꽃잎이 선명한 색을 띠게 된다.
      zh-Hant: |-
        當牠把單腳紮進地面裡，
        並且沐浴充分的陽光，
        花瓣就會染上鮮豔的顏色。
      zh-Hans: |-
        当它把单脚扎进地面里，
        并且沐浴充分的阳光，
        花瓣就会染上鲜艳的颜色。
      en: |-
        It anchors itself in the ground with its single leg,
        then basks in the sun. After absorbing enough
        sunlight, its petals spread as it blooms brilliantly.
      fr: |-
        Quand il plante son unique pied pour absorber
        la lumière du soleil, ses pétales prennent
        une couleur éclatante.
      de: |-
        Steckt es sein Beinchen fest in den Boden und
        badet dann ausgiebig im Sonnenlicht, nimmt
        seine Blüte eine kräftigere Farbe an.
      es: |-
        Si planta su única extremidad inferior en la tierra
        y se expone a abundante luz solar, sus pétalos
        cobran un color vivo.
      it: |-
        Quando conficca il suo piede nel terreno e
        assorbe luce solare in abbondanza, il colore
        dei suoi petali diventa più intenso.
    shield:
      ja-Hrkt: |-
        そよかぜで　くるくる　まわりながら
        たのしそうに　うたう　あいらしさに
        みせられ　そだてる　ひとが　おおい。
      ja: |-
        そよ風で　くるくる　回りながら
        楽しそうに　歌う　愛らしさに
        魅せられ　育てる　人が　多い。
      ko: |-
        산들바람에 빙글빙글 돌면서
        즐겁게 노래하는 귀여운 모습에
        반해서 키우는 사람이 많다.
      zh-Hant: |-
        會隨著微風一邊轉圈圈一邊
        愉快地唱歌。許多人因為喜歡
        這可愛的模樣而培育牠。
      zh-Hans: |-
        会随着微风一边转圈圈一边
        愉快地唱歌。许多人因为喜欢
        这可爱的模样而培育它。
      en: |-
        It whirls around in the wind while singing a joyous
        song. This delightful display has charmed many
        into raising this Pokémon.
      fr: |-
        Nombreux sont ceux qui ont décidé d’en élever
        un après avoir été charmés par sa manière
        de chanter en virevoltant au gré de la brise.
      de: |-
        Viele Leute werden ihre Trainer, weil sie es
        niedlich finden, wie diese Pokémon in sanften
        Brisen herumwirbeln und voller Freude singen.
      es: |-
        Muchos los crían tras quedar prendados de lo
        adorables que resultan cuando cantan dando
        vueltas empujados por la brisa.
      it: |-
        Canta felice girando su se stesso mentre si lascia
        trasportare dal vento. Molti ne allenano uno
        semplicemente perché lo trovano adorabile.
