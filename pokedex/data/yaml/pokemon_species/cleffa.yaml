cleffa:
  base_happiness: 140
  capture_rate: 150
  color: pink
  egg_groups:
    - no-eggs
  evolution_chain: clefairy
  evolves_from: ~
  flavor_text:
    gold:
      en: |-
        Because of its
        unusual, star-like
        silhouette, peoplebelieve that it
        came here on
        a meteor.
    silver:
      en: |-
        When numerous me­
        teors illuminate
        the night sky,sightings of
        CLEFFA strangely
        increase.
    crystal:
      en: |-
        If the impact site
        of a meteorite is
        found, thisPOKéMON is certain
        to be within the
        immediate area.
    ruby:
      en: |-
        On nights with many shooting stars,
        CLEFFA can be seen dancing in a ring.
        They dance through the night and stoponly at the break of day, when these
        POKéMON quench their thirst with the
        morning dew.
    sapphire:
      en: |-
