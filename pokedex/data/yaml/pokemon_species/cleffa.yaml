        CLEFFA can be seen dancing in a ring.
        They dance through the night and stoponly at the break of day, when these
        POKéMON quench their thirst with the
        morning dew.
    emerald:
      en: |-
        On nights with many shooting stars,
        CLEFFA can be seen dancing in a ring.
        They dance until daybreak, when they
        quench their thirst with the morning dew.
    firered:
      en: |-
        When numerous meteors illuminate the
        night sky, sightings of CLEFFA strangely
        increase.
    leafgreen:
      en: |-
        Because of its unusual, starlike
        silhouette, people believe that it came
        here on a meteor.
    diamond:
      en: |-
        Its silhouette is like a star.
        It is believed to arrive riding on
        shooting stars.
    pearl:
      en: |-
        Many appear when the night skies
        are filled with shooting stars.
        They disappear with sunrise.
    platinum:
      en: |-
        It is often seen when shooting
        stars fill the night skies. It’s said
        to arrive riding on a shooting star.
    heartgold:
      en: |-
        Because of its unusual, starlike
        silhouette, people believe that
        it came here on a meteor.
    soulsilver:
      en: |-
        When numerous meteors illuminate
        the night sky, sightings of
        CLEFFA strangely increase.
    black:
      en: |-
        It is often seen when shooting
        stars fill the night skies. It’s said
        to arrive riding on a shooting star.
      fr: |-
        On dit qu’il se déplace à dos
        d’étoile filante. Il se montre
        souvent quand on en voit.
    white:
      en: |-
        It is often seen when shooting
        stars fill the night skies. It’s said
        to arrive riding on a shooting star.
      fr: |-
        On dit qu’il se déplace à dos
        d’étoile filante. Il se montre
        souvent quand on en voit.
    black-2:
      en: |-
        According to local rumors, Cleffa
        are often seen in places where
        shooting stars have fallen.
    white-2:
      en: |-
        According to local rumors, Cleffa
        are often seen in places where
        shooting stars have fallen.
    x:
      ja-Hrkt: |-
        おほしさまのような　シルエット。
        そのすがたから　ながれぼしにのって
        やってくると　しんじられている。
      ja: |-
        お星さまのような　シルエット。
        その姿から　流れ星に乗って
        やって来ると　信じられている。
      ko: |-
        별님 같은 실루엣이다.
        그 모습 때문에 별똥별을 타고
        온다고 여겨진다.
      en: |-
        Because of its unusual, starlike silhouette, people
        believe that it came here on a meteor.
      fr: |-
        Il ressemble un peu à une étoile. On suppose qu’il est
        venu sur terre accroché à une météorite.
      de: |-
        Aufgrund seiner ungewöhnlichen Sternform sagt
        man, es sei auf einem Meteor hierhergereist.
      es: |-
        Por su inusual forma estrellada, la gente cree que
        procede de un meteorito que cayó a la tierra.
      it: |-
        Per il suo aspetto bizzarro, a forma di stella, c’è chi
        crede che provenga da una meteora.
    'y':
      ja-Hrkt: |-
        ながれぼしの　おおい　よるは
        ピィが　たくさん　すがたを　みせる。
        あさひが　のぼると　いなくなる。
      ja: |-
        流れ星の　多い　夜は
        ピィが　たくさん　姿を　見せる。
        朝日が　昇ると　いなくなる。
      ko: |-
        별똥별이 많은 밤에는
        삐가 많이 모습을 드러낸다.
        아침 해가 떠오르면 사라지게 된다.
      en: |-
        Many appear when the night skies are filled with
        shooting stars. They disappear with sunrise.
      fr: |-
        On en voit beaucoup lorsque le ciel se remplit
        d’étoiles filantes. Ils s’éclipsent au lever du soleil.
      de: |-
        In Nächten mit vielen Sternschnuppen sieht man diese
        Pokémon. Am Morgen sind sie verschwunden.
      es: |-
        Muchos aparecen cuando hay estrellas fugaces en el
        cielo nocturno. Se esfuman al amanecer.
      it: |-
        Se ne vedono molti nelle notti in cui il cielo è pieno
        di stelle cadenti. Spariscono all’alba.
    omega-ruby:
      ja-Hrkt: |-
        ながれぼしの　おおい　よるは　わ　に　なって
        おどる　ピィの　すがたを　みることが　できる。
        ひのでまで　おどり　よつゆで　のどを　うるおす。
      ja: |-
        流れ星の　多い　夜は　輪に　なって
        踊る　ピィの　姿を　みることが　できる。
        日の出まで　踊り　夜露で　のどを　潤す。
      ko: |-
        별똥별이 많은 밤에는 둥글게 모여
        춤추는 삐의 모습을 볼 수 있다.
        일출 때까지 춤추며 밤이슬로 목을 축인다.
      en: |-
        On nights with many shooting stars, Cleffa can be seen
        dancing in a ring. They dance through the night and stop only
        at the break of day, when these Pokémon quench their thirst
        with the morning dew.
      fr: |-
        Les nuits où il y a des étoiles filantes, on peut voir des Mélo
        danser en cercle. Ils dansent toute la nuit et ne s’arrêtent
        qu’à l’aube. Ces Pokémon se désaltèrent alors avec la rosée
        du matin.
      de: |-
        In Nächten mit vielen Sternschnuppen kann man Pii im Kreis
        tanzen sehen. Es tanzt die ganze Nacht hindurch und hört
        erst bei Sonnenaufgang auf, um seinen Durst mit Morgentau
        zu stillen.
      es: |-
        Cuando hay lluvia de estrellas, a los Cleffa se les puede
        ver danzando en círculos durante toda la noche. Solo paran
        cuando rompe el día; entonces, dejan de bailar y calman su
        sed con el rocío de la mañana.
      it: |-
        In notti con molte stelle cadenti, è facile vedere molti Cleffa
        danzare in cerchio. Ballano per tutta la notte fermandosi
        soltanto alle prime luci dell’alba per dissetarsi bevendo
        le gocce di rugiada.
    alpha-sapphire:
      ja-Hrkt: |-
        ながれぼしの　おおい　よるは　わ　に　なって
        おどる　ピィの　すがたを　みることが　できる。
        ひのでまで　おどり　よつゆで　のどを　うるおす。
      ja: |-
        流れ星の　多い　夜は　輪に　なって
        踊る　ピィの　姿を　みることが　できる。
        日の出まで　踊り　夜露で　のどを　潤す。
      ko: |-
        별똥별이 많은 밤에는 둥글게 모여
        춤추는 삐의 모습을 볼 수 있다.
        일출 때까지 춤추며 밤이슬로 목을 축인다.
      en: |-
        On nights with many shooting stars, Cleffa can be seen
        dancing in a ring. They dance through the night and stop only
        at the break of day, when these Pokémon quench their thirst
        with the morning dew.
      fr: |-
        Les nuits où il y a des étoiles filantes, on peut voir des Mélo
        danser en cercle. Ils dansent toute la nuit et ne s’arrêtent
        qu’à l’aube. Ces Pokémon se désaltèrent alors avec la rosée
        du matin.
      de: |-
        In Nächten mit vielen Sternschnuppen kann man Pii im Kreis
        tanzen sehen. Es tanzt die ganze Nacht hindurch und hört
        erst bei Sonnenaufgang auf, um seinen Durst mit Morgentau
        zu stillen.
      es: |-
        Cuando hay lluvia de estrellas, a los Cleffa se les puede
        ver danzando en círculos durante toda la noche. Solo paran
        cuando rompe el día; entonces, dejan de bailar y calman su
        sed con el rocío de la mañana.
      it: |-
        In notti con molte stelle cadenti, è facile vedere molti Cleffa
        danzare in cerchio. Ballano per tutta la notte fermandosi
        soltanto alle prime luci dell’alba per dissetarsi bevendo
        le gocce di rugiada.
    sun:
      ja-Hrkt: |-
        りゅうせいの　きらめく　しんやに
        じっと　そらを　ながめる　すがたは
        こきょうに　おもいを　はせているよう。
      ja: |-
        流星の　煌めく　深夜に
        じっと　空を　眺める　姿は
        故郷に　思いを　馳せているよう。
      ko: |-
        유성이 반짝거리는 심야에
        지그시 하늘을 바라보는 모습은
        고향의 기억을 떠올리는 것 같다.
      zh-Hant: |-
        在流星閃耀的深夜裡
        凝望著天空的樣子，
        似乎是在緬懷故鄉。
      zh-Hans: |-
        在流星闪耀的深夜里
        凝望着天空的样子，
        似乎是在怀念故乡。
      en: |-
        On late nights illuminated by shooting stars,
        it gazes intently skyward, as if thinking of
        its home.
      fr: |-
        On dit que s’il contemple fixement le ciel
        lorsque des étoiles filantes passent, c’est
        parce que cela lui rappelle son bercail.
      de: |-
        Sieht man es tief in der Nacht gebannt das
        Funkeln von Sternschnuppen beobachten,
        schwelgt es wohl in Gedanken an seine Heimat.
      es: |-
        Se dice que este Pokémon se acuerda de su
        hogar cuando observa el cielo durante una lluvia
        de estrellas.
      it: |-
        Nel cuore della notte rimane a guardare le stelle
        cadenti pensando alla sua terra natale.
    moon:
      ja-Hrkt: |-
        そのシルエットから　おほしさまの
        うまれかわりと　しんじられている。
        なぜか　メテノが　だいすき。
      ja: |-
        そのシルエットから　お星様の
        生まれ変わりと　信じられている。
        なぜか　メテノが　大好き。
      ko: |-
        실루엣 때문에 별님이
        다시 태어난 것이라고 여겨지고 있다.
        왜인지 메테노를 매우 좋아한다.
      zh-Hant: |-
        因為外表輪廓的關係，
        被認為是星星的轉世。
        不知為何很喜歡小隕星。
      zh-Hans: |-
        从它的轮廓判断，
        被认为是星星的转世。
        不知为何很喜欢小陨星。
      en: |-
        Because of its silhouette, it’s believed to be a
        star reborn. For some reason, it loves Minior.
      fr: |-
        Selon certaines croyances, sa forme prouve
        qu’il s’agit de la réincarnation d’une étoile.
        Étrangement, il aime beaucoup les Météno.
      de: |-
        Aufgrund seines Aussehens wird es oft für
        einen Stern gehalten. Aus unbekannten Gründen
        liebt es Meteno über alles.
      es: |-
        Algunos creen que su forma es un indicio de que
        Cleffa es, en realidad, la reencarnación de una
        estrella. Por algún motivo, adora a los Minior.
      it: |-
        Il suo strano aspetto fa pensare che sia la
        reincarnazione di una stella. Per qualche motivo
        sconosciuto, gli piacciono molto i Minior.
    ultra-sun:
      ja-Hrkt: |-
        ながれぼしの　おおい　よるに　むれ
        わになって　ダンス。　その　すがたを
        みると　ちょっと　いいことが　あるよ。
      ja: |-
        流れ星の　多い　夜に　群れ
        輪になって　ダンス。　その　姿を
        見ると　ちょっと　いいことが　あるよ。
      ko: |-
        별똥별이 많은 밤에 둥글게
        무리 지어 춤을 춘다. 그 모습을
        보면 조금 좋은 일이 생긴다.
      zh-Hant: |-
        會在流星多的夜裡聚集起來，
        圍成一圈跳舞。如果能看見牠們
        跳舞的樣子，就會遇上好事。
      zh-Hans: |-
        在流星众多的晚上，它们会聚集起来
        并围成一圈跳舞．如果能在那时
        看到它们，就会遇到一些好事情哦。
      en: |-
        On nights with many shooting stars,
        they gather in packs and dance in circles. If you
        should see them, something good will happen!
      fr: |-
        Les nuits où les étoiles filantes inondent le
        ciel, il danse en cercle avec ses congénères.
        On dit qu’admirer ce spectacle porte bonheur.
      de: |-
        In Nächten mit vielen Sternschnuppen bilden
        Pii einen Kreis und tanzen. Der Anblick dieses
        Spektakels soll Glück bringen.
      es: |-
        Las noches de lluvia de estrellas, se congregan
        y bailan en círculo. Se cree que presenciar este
        espectáculo trae buena suerte.
      it: |-
        Nelle notti con molte stelle cadenti, i Cleffa si
        riuniscono per danzare in cerchio. Si dice che
        assistere alla loro danza sia di buon augurio.
    ultra-moon:
      ja-Hrkt: |-
        ながれぼしに　のってきたと　いわれる。
        ピィが　あらわれるのは　むかし
        いんせきが　おちた　ばしょ　らしい。
      ja: |-
        流れ星に　乗ってきたと　いわれる。
        ピィが　現れるのは　昔
        隕石が　落ちた　場所　らしい。
      ko: |-
        별똥별을 타고 왔다고 전해진다.
        삐가 나타나는 곳은 옛날에
        운석이 떨어졌던 장소라는 듯하다.
      zh-Hant: |-
        據說是乘著流星而來。
        皮寶寶似乎會出現在
        過去有過隕石墜落的地方。
      zh-Hans: |-
        据说是乘着流星而来。
        皮宝宝好像会出现在
        以前有陨石坠落过的地方。
      en: |-
        Said to have ridden here on a shooting star,
        Cleffa seem to appear in places where
        meteorites have struck in the past.
      fr: |-
        Il serait parvenu jusqu’à nous en chevauchant
        une étoile filante. On le trouve dans les endroits
        où des météorites sont tombées.
      de: |-
        Es heißt, Pii sei auf einem Meteor hierhergereist.
        An Orten, wo diese Pokémon anzutreffen sind,
        soll früher mal ein Meteorit eingeschlagen sein.
      es: |-
        Se dice que llegó en una estrella fugaz. Este
        Pokémon suele encontrarse en lugares donde
        han caído meteoritos.
      it: |-
        Si dice che sia arrivato in groppa a una stella
        cadente. Sembra che appaia principalmente in
        luoghi in cui in passato è caduto un meteorite.
    sword:
      ja-Hrkt: |-
        ピィを　よく　みかける　ばしょは
        ながれぼしが　おちた　ばしょと
        じもとでは　うわさ　されている。
      ja: |-
        ピィを　よく　見かける　場所は
        流れ星が　落ちた　場所と
        地元では　うわさ　されている。
      ko: |-
        삐가 자주 보이는 장소는
        별똥별이 떨어진 장소라고
        그 고장에서 소문이 돈다.
      zh-Hant: |-
        根據當地的傳說，
        皮寶寶經常出沒的地方
        就是流星隕落之處。
      zh-Hans: |-
        根据当地的传说，
        皮宝宝经常出没的地方
        就是流星陨落之处。
      en: |-
        According to local rumors, Cleffa are often seen
        in places where shooting stars have fallen.
      fr: |-
        On dit qu’il apparaît souvent là où se sont
        écrasées des météorites.
      de: |-
        Man erzählt sich, dass überall dort besonders
        häufig Pii anzutreffen seien, wo einst eine
        Sternschnuppe eingeschlagen ist.
      es: |-
        Los lugareños rumorean que suele encontrarse
        en lugares donde han caído estrellas fugaces.
      it: |-
        Si dice che sia facile incontrarlo dove sono
        precipitate delle stelle cadenti.
    shield:
      ja-Hrkt: |-
        おほしさまのような　シルエット。
        そのすがたから　ながれぼしにのって
        やってくると　しんじられている。
      ja: |-
        お星さまのような　シルエット。
        その姿から　流れ星に乗って
        やって来ると　信じられている。
      ko: |-
        실루엣이 별 모양이다.
        그 때문에 별똥별을 타고
        온다고 여겨진다.
      zh-Hant: |-
        有著如同星星一般的輪廓。
        因為這樣的外型，人們相信
        牠是乘著流星而來的。
      zh-Hans: |-
        有着星星一样的轮廓。
        由于那外形，人们相信
        它是乘着流星而来的。
      en: |-
        Because of its unusual, starlike silhouette, people
        believe that it came here on a meteor.
      fr: |-
        Il ressemble un peu à une étoile. On suppose
        qu’il est venu sur terre accroché à une météorite.
      de: |-
        Aufgrund seiner ungewöhnlichen Sternform sagt
        man, es sei auf einem Meteor hierhergereist.
      es: |-
        Por su inusual forma estrellada, la gente cree que
        procede de un meteorito que cayó a la tierra.
      it: |-
        Per il suo aspetto bizzarro, che ricorda una stella,
        c’è chi crede che provenga da una stella cadente.
