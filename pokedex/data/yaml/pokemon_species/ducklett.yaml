ducklett:
  base_happiness: 70
  capture_rate: 190
  color: blue
  egg_groups:
    - water1
    - flying
  evolution_chain: ducklett
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        These bird Pokémon are excellent divers.
        They swim around in the water eating
        their favorite food--peat moss.
      fr: |-
        Un Pokémon Oiseau doué pour la plongée.
        Il nage sous l’eau à la recherche de
        sphaigne, son plat préféré.
    white:
      en: |-
        When attacked, it uses its feathers
        to splash water, escaping under cover
        of the spray.
      fr: |-
        Quand on l’attaque, il s’ébroue et fait
        jaillir de la vapeur d’eau de tout son
        corps. Il se cache dedans pour s’enfuir.
    black-2:
      en: |-
        They are better at swimming than flying,
        and they happily eat their favorite food,
        peat moss, as they dive underwater.
    white-2:
      en: |-
        They are better at swimming than flying,
        and they happily eat their favorite food,
        peat moss, as they dive underwater.
    x:
      ja-Hrkt: |-
        てきに　おそわれると　ぜんしんの
        うもうから　みずしぶきを　だす。
        みずけむりに　まぎれて　にげるのだ。
      ja: |-
        敵に　襲われると　全身の　羽毛から
        水しぶきを　出す。
        水煙に　紛れて　逃げるのだ。
      ko: |-
        상대에게 공격당하면 전신의
        깃털에서 물보라를 내뿜는다.
        물안개에 숨어들어 도망친다.
      en: |-
        When attacked, it uses its feathers to splash water,
        escaping under cover of the spray.
      fr: |-
        Quand on l’attaque, il s’ébroue et fait jaillir de la
        vapeur d’eau de tout son corps. Il se cache dedans
        pour s’enfuir.
      de: |-
        Gerät es in Gefahr, versprüht es Wasser aus seinem
        Federkleid und nutzt den Sprühregen, um Reißaus
        zu nehmen.
      es: |-
        Cuando se ve atacado, las plumas que lo recubren
        despiden ráfagas de agua que lo ayudan a escapar.
      it: |-
        Quando viene attaccato schizza acqua da tutte le
        piume del corpo. Fugge dileguandosi in una nuvola
        di spruzzi.
    'y':
      ja-Hrkt: |-
        とぶよりも　およぐのが　とくいで
        すいちゅうに　もぐっては　だいすきな
        みずゴケを　うれしそうに　たべる。
      ja: |-
        飛ぶよりも　泳ぐのが　得意で
        水中に　潜っては　大好きな
        水ゴケを　うれしそうに　食べる。
      ko: |-
        나는 것보다 헤엄치는 것이 특기로
        수중에 잠수해서는 제일 좋아하는
        물이끼를 기쁘게 먹는다.
      en: |-
        They are better at swimming than flying, and they
        happily eat their favorite food, peat moss, as they
        dive underwater.
      fr: |-
        Un Pokémon doué pour la plongée qui passe son
        temps sous l’eau à chercher des sphaignes, son plat
        préféré.
      de: |-
        Es schwimmt besser, als es fliegen kann. Am liebsten
        taucht es ins kühle Nass ab, um Torfmoos, seine
        Leibspeise, zu essen.
      es: |-
        Nada a mayor velocidad de la que puede volar. Se
        sumerge en el agua para buscar musgo acuático, su
        comida favorita.
      it: |-
        È più ferrato nel nuoto che nel volo. Si immerge
        nell’acqua per mangiare i licheni marini di cui va matto.
    omega-ruby:
      ja-Hrkt: |-
        てきに　おそわれると　ぜんしんの
        うもうから　みずしぶきを　だす。
        みずけむりに　まぎれて　にげるのだ。
      ja: |-
