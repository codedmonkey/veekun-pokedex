        みずゴケを　うれしそうに　たべる。
      ja: |-
        飛ぶよりも　泳ぐのが　得意で
        水中に　潜っては　大好きな
        水ゴケを　うれしそうに　食べる。
      ko: |-
        나는 것보다 헤엄치는 것이 특기로
        수중에 잠수해서는 제일 좋아하는
        물이끼를 기쁘게 먹는다.
      en: |-
        They are better at swimming than flying, and they
