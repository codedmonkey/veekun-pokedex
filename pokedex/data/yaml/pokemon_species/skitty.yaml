        chassant sa propre queue.
    white:
      en: |-
        It can’t stop itself from chasing
        moving things, and it runs in a
        circle, chasing its own tail.
      fr: |-
        Il poursuit tout ce qui bouge. On
        le voit parfois courir en cercle,
        chassant sa propre queue.
    black-2:
      en: |-
        It shows its cute side
        by chasing its own tail
        until it gets dizzy.
    white-2:
      en: |-
        It shows its cute side
        by chasing its own tail
        until it gets dizzy.
    x:
      ja-Hrkt: |-
        うごくものを　つい　おってしまう。
        じぶんの　しっぽを　おいかけて
        おなじ　ばしょを　グルグル　まわる。
      ja: |-
        動くものを　つい　追ってしまう。
        自分の　尻尾を　追いかけて
        同じ　場所を　グルグル　回る。
      ko: |-
        움직이는 것을 무심코 쫓아간다.
        자신의 꼬리를 쫓아서
        똑같은 장소를 빙글빙글 돈다.
      en: |-
        It can’t stop itself from chasing moving things,
        and it runs in a circle, chasing its own tail.
      fr: |-
        Il poursuit tout ce qui bouge. On le voit parfois courir
        en cercle, chassant sa propre queue.
      de: |-
        Es muss Dinge, die sich bewegen, einfach jagen.
        Es rennt oft im Kreis und jagt seinen eigenen Schweif.
      es: |-
        No puede evitar ir tras las cosas que se mueven.
        Hasta corre en círculos persiguiéndose la cola.
      it: |-
        Non riesce a evitare di inseguire tutto ciò che si
        muove e corre in tondo a caccia della propria coda.
    'y':
      ja-Hrkt: |-
        じぶんの　しっぽを　おいかけて
        あそんでいると　めを　まわすといった
        かわいらしい　いちめんを　みせる。
      ja: |-
        自分の　尻尾を　追いかけて
        遊んでいると　目を　回すといった
        可愛らしい　一面を　みせる。
      ko: |-
        자신의 꼬리를 쫓아서
        놀고 있으면 눈이 핑 돌고 마는
        귀여운 일면을 보인다.
      en: |-
        It shows its cute side by chasing its own tail
        until it gets dizzy.
      fr: |-
        Un Pokémon très mignon qui aime parfois courir
        en cercle en chassant sa propre queue.
      de: |-
        Es zeigt gerne seine niedliche Seite, indem es seinen
        eigenen Schweif jagt, bis ihm schwindlig wird.
      es: |-
        Le gusta jugar persiguiéndose la cola hasta que se
        marea, mostrando así su lado más mono.
      it: |-
        È davvero carino quando barcolla per i giramenti di
        testa, dopo aver cercato di mordersi la coda.
    omega-ruby:
      ja-Hrkt: |-
        うごく　ものを　みつけると　むちゅうに　なって
        おいかけまわす　しゅうせいを　もつ　ポケモン。
        じぶんの　シッポを　おいかけて　めを　まわす。
      ja: |-
        動く　ものを　見つけると　夢中に　なって
        追いかけ回す　習性を　持つ　ポケモン。
        自分の　シッポを　追いかけて　目を　回す。
      ko: |-
        움직이는 것을 발견하면 푹 빠져서
        뒤쫓아 가는 습성을 지닌 포켓몬이다.
        자기 꼬리를 쫓다 현기증을 일으킨다.
      en: |-
        Skitty has the habit of becoming fascinated by moving objects
        and chasing them around. This Pokémon is known to chase
        after its own tail and become dizzy.
      fr: |-
        Skitty a pris l’habitude de pourchasser les objets mobiles
        qui le fascinent. On sait que ce Pokémon court souvent
        après sa queue, jusqu’à ce qu’il ait la tête qui tourne.
      de: |-
        Eneco ist fasziniert von Dingen, die sich bewegen, und jagt
        ihnen hinterher. Dieses Pokémon jagt häufig seinen eigenen
        Schweif, sodass ihm schwindlig wird.
      es: |-
        A Skitty le encanta mover cosas e ir detrás de ellas. Es de
        todos sabido que se dedica a ir detrás de su propia cola y
        que, al final, acaba mareándose.
      it: |-
        Skitty ha l’abitudine di lasciarsi ammaliare dagli oggetti
        in movimento e seguirli dando loro la caccia. Questo
        Pokémon è noto anche per rincorrere la sua stessa
        coda fino a rimanere stordito.
    alpha-sapphire:
      ja-Hrkt: |-
        じぶんの　シッポを　おいかけまわす　ポケモン。
        やせいは　もりの　じゅもくの　あなで　くらす。
        あいくるしい　かおで　ペットとして　だいにんき。
      ja: |-
        自分の　シッポを　追いかけ回す　ポケモン。
        野生は　森の　樹木の　穴で　暮らす。
        愛くるしい　顔で　ペットとして　大人気。
      ko: |-
        자신의 꼬리를 쫓아다니는 포켓몬이다.
        야생에서는 숲의 나무 구멍에서 산다.
        귀염성 있는 얼굴 때문에 애완동물로 인기가 높다.
      en: |-
        Skitty is known to chase around playfully after its own tail.
        In the wild, this Pokémon lives in holes in the trees of forests.
        It is very popular as a pet because of its adorable looks.
      fr: |-
        On sait que Skitty court souvent après sa queue.
        À l’état sauvage, ce Pokémon vit dans les cavités des arbres
        de la forêt. Il est tellement adorable qu’il a un grand succès
        comme animal de compagnie.
      de: |-
        Eneco jagt spielerisch seinen eigenen Schweif. In der Wildnis
        lebt dieses Pokémon in den Löchern von Bäumen. Es ist als
        Haustier sehr beliebt, da es bezaubernd aussieht.
      es: |-
        Skitty es conocido por la costumbre que tiene de juguetear y
        de intentar pillarse la cola. En estado salvaje, habita en las
        cavidades de los troncos de los árboles del bosque. Es la
        mascota de muchos por lo dulce que parece.
      it: |-
        Skitty è noto per il suo movimento rotatorio inteso a mordere
        la propria coda. Allo stato brado, vive all’interno di tronchi
        cavi nella foresta. È molto amato come animale domestico
        grazie all’aspetto estremamente dolce.
