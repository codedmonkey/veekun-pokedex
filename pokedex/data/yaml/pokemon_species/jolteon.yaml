    sword:
      ja-Hrkt: |-
        おこったり　おどろいたりすると
        ぜんしんの　けが　はりの　ように
        さかだって　あいてを　つらぬく。
      ja: |-
        怒ったり　驚いたりすると
        全身の　毛が　針の　ように
        逆立って　相手を　つらぬく。
      ko: |-
        화가 나거나 놀라면
        전신의 털이 바늘처럼
        곤두서서 상대를 꿰뚫는다.
      zh-Hant: |-
        當雷伊布生氣或是吃驚時，
        牠全身的體毛會像針一樣
        豎起來刺穿對手。
      zh-Hans: |-
        当雷伊布生气或是吃惊时，
        它全身的体毛会像针一样
        竖起来刺穿对手。
      en: |-
        If it is angered or startled, the fur all over its
        body bristles like sharp needles that pierce foes.
      fr: |-
        S’il est irrité ou surpris, toute la fourrure
        de son corps se dresse comme des aiguilles
        pour percer ses ennemis.
      de: |-
        Wenn es erschrickt oder wütend wird, stellt sich
        sein Fell auf wie scharfe Nadeln und sticht den
        Gegner.
      es: |-
        Si se enfada o asusta, se le eriza el pelaje. Cada
        uno de sus pelos se convierte en una afilada púa
        que hace trizas al rival.
      it: |-
        Se si arrabbia o è sorpreso, tutti i peli del corpo
        gli si rizzano trasformandosi in aghi che infilzano
        il nemico.
    shield:
      ja-Hrkt: |-
        くうきちゅうの　マイナスイオンを
        すいこんで　やく１００００ボルトの
        でんきを　はきだすことができる。
      ja: |-
        空気中の　マイナスイオンを
        吸いこんで　約１００００ボルトの
        電気を　吐き出すことがある。
      ko: |-
        공기 중의 마이너스 이온을
        빨아들여 약 10000볼트의
        전기를 내뱉을 수 있다.
      zh-Hant: |-
        有時會吸入空氣中
        的負離子，吐出大約
        １００００伏特的高壓電。
      zh-Hans: |-
        能够吸入空气中的负离子，
        有时会吐出大约有
        １００００伏特的高压电。
      en: |-
        It accumulates negative ions in the atmosphere to
        blast out 10,000-volt lightning bolts.
      fr: |-
        Il se charge d’ions négatifs contenus dans l’air
        pour envoyer des décharges d’environ
        10 000 volts.
      de: |-
        Dieses Pokémon entzieht der Atmosphäre Ionen
