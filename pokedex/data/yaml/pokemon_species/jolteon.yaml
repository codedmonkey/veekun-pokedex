        acumula en un pelaje formado por agujas cargadas de
        electricidad. Esta característica le permite lanzar rayos.
      it: |-
        Le cellule di Jolteon generano un basso potenziale elettrico,
        che viene tuttavia amplificato dall’elettricità statica della sua
        pelliccia, da cui scatena fulmini. La pelliccia arruffata è fatta
        di aghi caricati elettricamente.
    sun:
      ja-Hrkt: |-
        やく１００００ボルトの　でんきを
        はきだす。　かなり　しんけいしつで
        なつかせるのは　たいへんだ。
      ja: |-
        約１００００ボルトの　電気を
        吐き出す。　かなり　神経質で
        なつかせるのは　大変だ。
      ko: |-
        약 10000볼트의 전기를
        토해낸다. 꽤 신경질적이어서
        길들이는 것은 힘들다.
      zh-Hant: |-
        能噴出大約１００００伏特的電力。
        因為相當神經質，所以要與牠
        變得親密是非常困難的。
      zh-Hans: |-
        喷出大约１００００伏特的电力。
        因为相当神经质，所以要与它
        变得亲密是非常困难的。
      en: |-
        They send out electrical charges of about
        10,000 volts. Because they are high-strung,
        it can be difficult to grow close to them.
      fr: |-
        Il peut projeter des décharges de 10 000 volts.
        Il est très nerveux, ce qui le rend difficile à
        apprivoiser.
      de: |-
        Es feuert Blitze von 10 000 V Stärke aus seinem
        Mund ab. Es ist sehr nervös, daher haben es
        Trainer schwer, seine Zuneigung zu gewinnen.
      es: |-
        Lanza rayos de 10 000 voltios de potencia. Es
        difícil congeniar con este Pokémon debido a su
        naturaleza nerviosa.
      it: |-
        Lancia scariche da 10.000 volt.
        È piuttosto nervoso e non è facile conquistarsi
        il suo affetto.
    moon:
      ja-Hrkt: |-
        たいもうが　さかだったら　でんきを
        はく　サイン。　そばに　かみなりが
        おちることも　あるので　ちゅうい。
      ja: |-
        体毛が　逆立ったら　電気を
        吐く　サイン。　側に　雷が
        落ちることも　あるので　注意。
      ko: |-
        털이 곤두서면 전기를
        뿜는다는 신호다. 근처에 번개가
        떨어질 때도 있으므로 주의.
      zh-Hant: |-
        體毛豎立就是要噴出電流的信號。
        旁邊可能會有落雷，
        所以要多加注意。
      zh-Hans: |-
        体毛竖起来的话，是要喷出电的信号。
        因为旁边也可能会有雷落下，
        所以要注意。
      en: |-
        When its fur stands on end, that’s a sign it’s
        about to give off a jolt of electricity. Take care,
        as sometimes lightning strikes next to it, too.
      fr: |-
        Quand son pelage se hérisse, c’est signe qu’il
        va projeter de l’électricité. Attention, car il
        arrive que la foudre tombe près de lui.
      de: |-
        Steht ihm das Fell zu Berge, ist das ein Zeichen,
        dass es gleich aus seinem Mund einen Blitz
        abfeuert. In seiner Nähe schlagen oft Blitze ein.
      es: |-
        Cuando su pelaje se pone de punta, es señal de
        que va a soltar una descarga. Hay que tener
        cuidado porque pueden caer rayos cerca.
      it: |-
        Quando rizza il pelo, è segno che sta per
        lanciare una scarica elettrica. A volte attira
        i fulmini, quindi è meglio stare attenti.
    ultra-sun:
      ja-Hrkt: |-
        はいの　なかに　でんきを　うみだす
        きかんが　ある。　といきに　まざって
        でんきの　おとが　バチバチきこえる。
      ja: |-
        肺の　中に　電気を　生み出す
        器官が　ある。　吐息に　混ざって
        電気の　音が　バチバチ聞こえる。
      ko: |-
        폐 안에 전기를 만드는
        기관이 있다. 날숨에 섞여
        탁탁하는 전기 소리가 들린다.
      zh-Hant: |-
        肺中有著能產生電力的器官，
        可以聽見牠吐氣的聲音裡
        混雜著劈哩啪啦的電流聲。
      zh-Hans: |-
        肺中有能产生电力的器官。
        从它的吐息中，能听到里面
        混杂着噼里啪啦的电流声。
      en: |-
        Its lungs contain an organ that creates
        electricity. The crackling sound of electricity
        can be heard when it exhales.
      fr: |-
        Un organe situé à l’intérieur de ses poumons
        produit de l’électricité. On entend une sorte
        de crépitement chaque fois qu’il expire.
      de: |-
        Blitza verfügt über ein Organ in der Lunge,
        das Elektrizität erzeugt. Wenn dieses Pokémon
        ausatmet, hört man ein elektrisches Knistern.
      es: |-
        Posee un órgano en los pulmones que genera
        electricidad. Cuando respira se puede oír un
        crepitar eléctrico.
      it: |-
        I suoi polmoni contengono un organo che
        produce elettricità. Quando respira, si può
        udire un crepitio.
    ultra-moon:
      ja-Hrkt: |-
        さかだてた　けを　はりの　ように
        とばす。　てきが　よわった　ところを
        １まんボルトの　でんげきで　しとめる。
      ja: |-
        逆立てた　毛を　針の　ように
        飛ばす。　敵が　弱った　ところを
        １万ボルトの　電撃で　仕留める。
      ko: |-
        곤두세운 털을 바늘처럼
        날린다. 적이 약해진 순간
        1만 볼트의 전격으로 처리한다.
      zh-Hant: |-
        能將豎起來的毛像針一樣
        發射出去。會趁敵人衰弱的時候
        用１萬伏特的電擊解決對手。
      zh-Hans: |-
        能将竖起来的毛发像针一样射出去。
        会趁着敌人虚弱的时候，
        用１万伏特的电击解决它。
      en: |-
        Its fur stands on end, becoming like needles
        it fires at enemies. Once they’re weakened, it
        finishes them off with a 10,000 volt shock.
      fr: |-
        Il projette ses poils hérissés comme si c’étaient
        des aiguilles, avant d’achever ses ennemis ainsi
        affaiblis avec des décharges de 10 000 volts.
      de: |-
        Es stellt seine Haare auf und feuert sie ab wie
        Nadeln. Dann gibt es dem geschwächten Gegner
        mit einem 10 000 V starken Blitz den Rest.
      es: |-
        Lanza sus pelos erizados a modo de púas. Tras
        debilitar a su rival, lo remata con una descarga
        de 10 000 voltios.
      it: |-
        Rizza i peli e li scaglia come se fossero aghi.
        Finisce gli avversari indeboliti con scariche da
        10.000 volt.
    lets-go-pikachu:
      ja-Hrkt: |-
        ちょっとした　しげきで　ないたり
        おこったりする。また　かんじょうが
        かわるたびに　でんきがたまる。
      ja: |-
        ちょっとした　刺激で　泣いたり
        怒ったりする。また　感情が
        変わるたびに　電気がたまる。
      ko: |-
        약간의 자극으로 울거나
        화를 낸다. 또한 감정이
        변할 때마다 전기가 모인다.
      zh-Hant: |-
        稍微受點刺激就會哭叫或生氣。
        每當牠的情緒發生變化時，
        體內就會累積一些電力。
      zh-Hans: |-
        稍微受点刺激就会
        大叫或生气，每当
        心情变化时都会蓄电。
      en: |-
        A sensitive Pokémon that easily becomes sad
        or angry. Every time its mood changes, it
        charges power.
      fr: |-
        Un Pokémon très sensible et lunatique.
        Il se charge en électricité chaque fois
        que son humeur change.
      de: |-
        Schon geringste Reize lösen bei Blitza Wut oder
        Trauer aus. Wenn seine Gefühlslage umschlägt,
        baut sich stets Elektrizität auf.
      es: |-
        Un Pokémon muy sensible que se entristece
        o enfada con mucha facilidad. Se carga de
        electricidad cada vez que cambia de humor.
      it: |-
        Passa dalla tristezza all’ira in un soffio.
        Ogni volta che ha uno sbalzo di umore
        si carica di elettricità.
    lets-go-eevee:
      ja-Hrkt: |-
        ちょっとした　しげきで　ないたり
        おこったりする。また　かんじょうが
        かわるたびに　でんきがたまる。
      ja: |-
