    x:
      ja-Hrkt: |-
        ポケモンの　せんぞの　いっしゅ。
        かいていの　いわばに　かくれた
        えものを　のびる　ツメで　とらえる。
      ja: |-
        ポケモンの　先祖の　一種。
        海底の　岩場に　隠れた　獲物を
        伸びる　ツノで　捕らえる。
      ko: |-
        포켓몬의 조상 중 하나다.
        해저의 바위 지대에 숨어 있는
        먹잇감을 늘어나는 발톱으로 잡는다.
      en: |-
        It is a kind of Pokémon progenitor. It uses its
        extending claws to catch prey hiding among rocks
        on the seafloor.
      fr: |-
        C’est un Pokémon préhistorique. Caché derrière
        les rochers, il utilise ses pinces extensibles pour
        attraper ses proies.
      de: |-
        Es ist eine Art Vorfahre der Pokémon. Mit seinen
        erweiterten Scheren geht es zwischen den Felsen
        am Meeresgrund auf Beutefang.
      es: |-
        Es una especie de Pokémon predecesor. Estira las
        pinzas para cazar a sus presas, que se esconden en
        las rocas del mar.
      it: |-
        Pokémon di tipo primitivo, usa i lunghi artigli per
        catturare prede nascoste tra le rocce in fondo al mare.
    'y':
      ja-Hrkt: |-
        かせきから　ふっかつした　ポケモンの
        せんぞの　いっしゅ。うみで　くらし
        ツメで　えものを　つかまえる。
      ja: |-
        化石から　復活した　ポケモンの
        先祖の　一種。海で　暮らし
        ツメで　獲物を　捕まえる。
      ko: |-
        화석에서 부활한 포켓몬의
        조상 중 하나. 바다에서 살고
        발톱으로 먹이를 잡는다.
      en: |-
        A Pokémon ancestor that was reanimated from a
        fossil. It lived in the sea and hunted with claws.
      fr: |-
        Un ancêtre Pokémon réanimé à partir d’un fossile.
        Il vivait en mer et chassait avec ses pinces.
      de: |-
        Ein Vorfahre der Pokémon, der aus einem Fossil neu
        belebt wurde. Es lebte im Meer und jagte mit Klauen.
      es: |-
        Este Pokémon fue recreado a partir de restos fósiles.
        Vivía en el mar y cazaba con sus pinzas.
      it: |-
        Un antico Pokémon rigenerato da un fossile. Viveva
        nel mare e catturava le prede con gli artigli.
    omega-ruby:
      ja-Hrkt: |-
        たいこの　かせきから　よみがえった　ポケモン。
        あたたかい　うみに　せいそくし　はったつした
        ２ほんの　ツメで　えものを　がっちり　つかむ。
      ja: |-
        太古の　化石から　蘇った　ポケモン。
        暖かい　海に　生息し　発達した
        ２本の　ツメで　獲物を　がっちり　つかむ。
      ko: |-
        태고의 화석에서 되살아난 포켓몬이다.
        따뜻한 바다에 서식하며 발달한
        2개의 발톱으로 먹이를 꽉 잡는다.
      en: |-
        Anorith was regenerated from a prehistoric fossil. This primitive
        Pokémon once lived in warm seas. It grips its prey firmly
        between its two large claws.
      fr: |-
        Anorith fut ressuscité à partir d’un fossile préhistorique.
        Ce Pokémon primitif vivait à l’époque dans les eaux tropicales.
        Il attrape fermement sa proie avec ses deux grandes pinces.
      de: |-
        Anorith wurde aus einem prähistorischen Fossil erzeugt. Dieses
        primitive Pokémon lebte einst in warmen Gewässern. Es klemmt
        seine Beute fest zwischen seine beiden riesigen Klauen ein.
      es: |-
        Anorith se regeneró a partir de un fósil prehistórico. Este
        Pokémon primitivo vivía en mares cálidos. Gracias a sus
        enormes pinzas puede agarrar a su presa con firmeza.
      it: |-
        Anorith è stato rigenerato da un fossile preistorico. Un tempo
        viveva nei mari caldi. Questo Pokémon afferra saldamente
        la preda con i suoi due artigli.
    alpha-sapphire:
      ja-Hrkt: |-
        ポケモンの　せんぞの　いっしゅと　いわれている。
        からだの　よこに　ついた　８まいの　はねを
        くねらせて　たいこの　うみを　およいでいた。
      ja: |-
        ポケモンの　先祖の　一種と　いわれている。
        体の　横に　ついた　８枚の　羽を
        くねらせて　太古の　海を　泳いでいた。
      ko: |-
        포켓몬의 조상 중 하나라고 전해지고 있다.
        몸의 측면에 붙어 있는 8개의 날개를
        구부려 태고의 바다를 헤엄쳤다.
      en: |-
        Anorith is said to be a type of Pokémon predecessor, with
        eight wings at the sides of its body. This Pokémon swam in the
        primordial sea by undulating these eight wings.
      fr: |-
        On raconte qu’Anorith est l’un des ancêtres des Pokémon.
        Il nageait dans la mer originelle en faisant onduler les huit
        ailes placées sur les côtés de son corps.
      de: |-
        Anorith soll ein Pokémon-Vorgänger sein, es hat acht Flügel
        an seinem Körper. Dieses Pokémon schwamm im Urmeer,
        indem es seine acht Flügel schwang.
      es: |-
        De Anorith dicen que es una especie de Pokémon predecesor.
        Tiene ocho alas a ambos lados del cuerpo. Gracias a ellas,
        pudo nadar por las primeras aguas que hubo.
      it: |-
        Si dice che Anorith sia un Pokémon antenato, con otto ali
        sui fianchi. Il Pokémon nuotava nei mari primordiali remando
        con le otto ali.
    ultra-sun:
      ja-Hrkt: |-
        かせきから　ふくげんした　アノプスを
        うみに　はなっても　げんきが　ない。
        とうじと　すいしつが　ちがうからだ。
      ja: |-
        化石から　復元した　アノプスを
        海に　放っても　元気が　ない。
        当時と　水質が　違うからだ。
      ko: |-
        화석에서 복원한 아노딥스를
        바다에 놓아줘도 기운이 없다.
        당시와 수질이 다르기 때문이다.
      zh-Hant: |-
        從化石復原而來的太古羽蟲
        就算放進海裡也不會有活力，
        因為現在的水質和當年是不同的。
      zh-Hans: |-
        从化石复原而来的太古羽虫
        即使放到海里，也不会有精神。
        因为现在的水质已和当时不同了。
      en: |-
        When restored Anorith are released into the
        ocean, they don’t thrive, because the water
        composition has changed since their era.
      fr: |-
        Ce Pokémon ranimé à partir d’un fossile
        vivait dans des eaux très pures. Il ne pourrait
        donc pas s’acclimater aux océans actuels.
      de: |-
        Wenn man es aus einem Fossil wiederherstellt
        und ins Meer entlässt, geht es ihm dort nicht
        gut, da die Wasserqualität sich verändert hat.
      es: |-
        Si este Pokémon, regenerado a partir de un fósil,
        se libera en el mar, no se aclimata bien debido a
        la notable diferencia en la calidad del agua.
      it: |-
        Questo Pokémon rigenerato da un fossile non è
        a suo agio se rilasciato nel mare, a causa del
        peggioramento nella qualità delle acque odierne.
    ultra-moon:
      ja-Hrkt: |-
        こだいの　むしポケモンの　いっしゅ。
        ８まいの　ハネを　つかって　いがいに
        すばやく　およいでいた　らしい。
      ja: |-
        古代の　むしポケモンの　１種。
        ８枚の　ハネを　使って　意外に
        素早く　泳いでいた　らしい。
      ko: |-
        고대 벌레포켓몬의 일종.
        8장의 날개를 사용해서 제법
        빠르게 헤엄쳤다고 한다.
      zh-Hant: |-
        是古代的蟲寶可夢的一種。
        會用８片翅膀游動，
        速度出乎意料地快。
      zh-Hans: |-
        古代虫宝可梦中的一种。
        好像会使用８根翅膀游泳，
        速度意外的快。
      en: |-
        This is one kind of primeval bug Pokémon.
        With eight wings, it could apparently swim
        a lot faster than you’d expect.
      fr: |-
        Ce Pokémon Insecte préhistorique nageait
        apparemment à une vitesse surprenante
        grâce à ses huit « ailes ».
      de: |-
        Dieses urzeitliche Käfer-Pokémon konnte mit
        seinen acht Flügeln ungewöhnlich schnell
        schwimmen.
      es: |-
        Un Pokémon insecto ancestral. Según parece,
        era capaz de nadar sorprendentemente rápido
        gracias a sus ocho alas.
      it: |-
        È un antico Pokémon Coleottero. Pare che
        nuotasse in modo sorprendentemente rapido
        usando le sue otto ali.
    sword:
      ja-Hrkt: |-
        かせきから　ふくげんした　ポケモン。
        １おくねんほどまえの　うみで　くらし
        ２ほんの　ツメで　かりをしていた。
      ja: |-
        化石から　復元した　ポケモン。
        １億年ほど前の　海で　暮らし
        ２本の　ツメで　狩りをしていた。
      ko: |-
        화석에서 복원된 포켓몬.
        1억 년 전의 바다에 살며
        2개의 발톱으로 사냥을 했었다.
      zh-Hant: |-
        從化石復原而來的寶可夢。
        曾經生活在大約１億年前的
        大海，用２隻爪子捕捉獵物。
      zh-Hans: |-
        从化石复原而来的宝可梦。
        曾经生活在大约１亿年前的
        大海，用２只爪子捕捉猎物。
      en: |-
        This Pokémon was restored from a fossil.
        Anorith lived in the ocean about 100,000,000
        years ago, hunting with its pair of claws.
      fr: |-
        Restauré à partir d’un fossile, ce Pokémon vivait
        dans l’océan il y a environ 100 millions d’années
        et chassait ses proies avec ses deux pinces.
      de: |-
        Es wurde aus einem Fossil wiederbelebt. Vor circa
        100 Millionen Jahren war es im Meer zu Hause,
        wo es mit seinen beiden Klauen auf Jagd ging.
      es: |-
        Este Pokémon se regeneró a partir de un fósil.
        Habitaba en los mares de hace cien millones de
        años. Atrapaba a sus presas con sus dos pinzas.
      it: |-
        Questo Pokémon è stato rigenerato da un fossile.
        Viveva nei mari circa 100 milioni di anni fa e
        usava i suoi due artigli per cacciare.
    shield:
      ja-Hrkt: |-
        ８まいの　ハネを　ボートの　オールの
        ように　うごかし　はやく　およげる。
        むしポケモンの　そせんの　いっしゅ。
      ja: |-
        ８枚の　ハネを　ボートの　オールの
        ように　動かし　速く　泳げる。
        虫ポケモンの　祖先の　一種。
      ko: |-
        8장의 날개를 배의 노처럼
        움직여 빠르게 헤엄친다.
        벌레포켓몬 선조의 일종이다.
      zh-Hant: |-
        會像船槳般划動８片
        翅膀在水中快速游動。
        是蟲寶可夢祖先的一種。
      zh-Hans: |-
        会把８根翅膀当做船桨划水，
        并且游泳的速度相当快。
        是虫宝可梦的一种祖先。
      en: |-
        Anorith can swim swiftly by pulling its eight wings
        through the water like oars on a boat. This
        Pokémon is an ancestor of modern bug Pokémon.
      fr: |-
        Ce Pokémon peut nager très vite en agitant
        ses huit ailes comme des rames de bateau.
        Il fait partie des ancêtres des Pokémon Insecte.
      de: |-
        Anorith schwimmt sehr schnell, indem es seine
        acht Flügel wie die Ruder eines Bootes bewegt.
        Es ist einer der Vorfahren von Käfer-Pokémon.
      es: |-
        Puede nadar rápidamente gracias a sus ocho
        alas que usa a modo de remo. Es uno de los
        antepasados de los Pokémon insecto.
      it: |-
        Nuota rapidamente utilizzando le sue otto ali
        come fossero remi di una barca. È uno degli
        antenati dei Pokémon di tipo Coleottero.
