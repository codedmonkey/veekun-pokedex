    sun:
      ja-Hrkt: |-
        ひるまは　だらだら　ねてすごし
        ひが　くれるころに　かつどうかいし。
        よるのまちで　コインを　さがす。
      ja: |-
        昼間は　だらだら　寝て過ごし
        日が　暮れるころに　活動開始。
        夜の街で　コインを　探す。
      ko: |-
        낮에는 느긋하게 자면서 지내고
        해가 떨어지면 활동을 시작한다.
        밤이 되면 거리에서 동전을 찾는다.
      zh-Hant: |-
        總是懶懶地睡著度過白天，
        太陽下山時才開始活動。
        會在夜晚的街道上搜尋硬幣。
      zh-Hans: |-
        白天就一直睡啊睡地度过，
        太阳落山时才开始活动。
        在夜晚的街道上搜寻硬币。
      en: |-
        It lies around all day, becoming active near dusk.
        At night, it wanders the city in search of
        loose change.
      fr: |-
        Il fait la sieste pendant la journée et devient
        actif quand le soir tombe. Il passe sa nuit à
        chercher des pièces perdues dans les rues.
      de: |-
        Tagsüber ist es faul und schläft ständig.
        Erst nach Sonnenuntergang wird es aktiv
        und durchstöbert die Stadt nach Münzen.
      es: |-
        Se pasa casi todo el día durmiendo y se vuelve
        más activo al caer el sol. Por la noche merodea
        por la ciudad buscando monedas.
      it: |-
        Dorme tutto il giorno e si attiva verso
        il tramonto. Durante la notte gira per la città
        in cerca di monetine.
    moon:
      ja-Hrkt: |-
        キラキラした　ものが　だいすき。
        よく　ヤミカラスと　えものを
        うばいあって　ケンカを　している。
      ja: |-
        キラキラした　ものが　大好き。
        よく　ヤミカラスと　獲物を
        奪い合って　ケンカを　している。
      ko: |-
        반짝이는 물건을 매우 좋아한다.
        자주 니로우와 먹이를
        서로 빼앗으며 싸우고 있다.
      zh-Hant: |-
        非常喜歡亮晶晶的東西。
        經常和黑暗鴉為了爭奪獵物而打架。
      zh-Hans: |-
        非常喜欢闪闪亮亮的东西。
        经常和黑暗鸦为了争夺猎物而打架。
      en: |-
        It loves shiny things. It often fights with
        Murkrow over prey they’re both trying to catch.
      fr: |-
        Il adore tout ce qui brille et doit souvent
        affronter des Cornèbre qui convoitent
        le même trophée que lui.
      de: |-
        Es liebt glänzende Objekte. Mauzi und Kramurx
        nehmen sich oft gegenseitig die Beute weg,
        was regelmäßig zu heftigem Streit führt.
      es: |-
        Le fascinan los objetos brillantes, por lo que a
        menudo se disputa el botín con algún Murkrow.
      it: |-
        Ama gli oggetti luccicanti.
        Spesso se li contende con Murkrow.
    ultra-sun:
      ja-Hrkt: |-
        ゴミすてばに　いくと　ひかりものを
        めぐって　ヤミカラスと　はげしく
        ケンカする　こうけいが　みられる。
      ja: |-
        ゴミ捨て場に　いくと　ひかりものを
        巡って　ヤミカラスと　激しく
        ケンカする　光景が　見られる。
      ko: |-
        쓰레기장에 가면 빛이 나는 물건을
        두고 니로우와 격렬하게
        싸우는 광경을 볼 수 있다.
      zh-Hant: |-
        只要去垃圾場就能看見
        牠和黑暗鴉為了爭奪發亮的東西
        而激烈互鬥的景象。
      zh-Hans: |-
        如果去垃圾场的话，
        就能看到它和黑暗鸦为争夺
        发光的东西而激烈打斗的景象。
      en: |-
        When visiting a junkyard, you may catch sight
        of it having an intense fight with Murkrow over
        shiny objects.
      fr: |-
        Il n’est pas rare de l’apercevoir dans les
        décharges, où il se dispute souvent quelque
        objet brillant avec un Cornèbre.
      de: |-
        Auf Müllhalden wird man oft Zeuge davon, wie
        es sich einen heftigen Streit mit Kramurx um
        glänzende Gegenstände liefert.
      es: |-
        No es extraño encontrarlos en los vertederos,
        donde suelen pelearse con los Murkrow por
        cualquier objeto reluciente.
      it: |-
        Nelle discariche capita di vederlo lottare
        furiosamente con Murkrow per gli oggetti
        luccicanti.
    ultra-moon:
      ja-Hrkt: |-
        コインが　だいすき。　あげれば
        かんたんに　なつくが　きまぐれなので
        あんまり　あてには　ならないよ。
      ja: |-
        コインが　大好き。　あげれば
        簡単に　懐くが　気まぐれなので
        あんまり　当てには　ならないよ。
      ko: |-
        동전을 매우 좋아한다. 동전을 주면
        쉽게 친해지지만 변덕스럽기 때문에
        그다지 믿을 게 못 된다.
      zh-Hant: |-
        非常喜歡硬幣，只要給牠硬幣就能
        輕易和牠親近。但因為牠性情善變，
        所以這招也不是一定有效。
      zh-Hans: |-
        非常喜欢硬币。只要给它硬币就能
        轻易和它亲近，但因为它性情多变，
        所以不怎么靠得住哦。
      en: |-
        It loves coins, so if you give it one, you can
        make friends with Meowth easily. But it’s fickle,
        so you can’t count on that friendship lasting.
      fr: |-
        Il raffole des pièces de monnaie. Il suffit de lui
        en donner une pour acheter son affection, mais
        vu son caractère, cela ne dure jamais longtemps.
      de: |-
        Es hat eine Vorliebe für Münzen. Gibt man ihm
        eine, gewinnt man leicht sein Zutrauen, doch das
        währt dank des launischen Wesens nicht lange.
      es: |-
        Adora las monedas y basta con darle una para
        ganarse su afecto, que no suele durar mucho
        debido a su carácter caprichoso.
      it: |-
        Adora le monetine. Basta dargliene un po’
        perché si affezioni, ma a causa del suo
        carattere volubile non è affidabile.
    lets-go-pikachu:
      ja-Hrkt: |-
        よるのほうが　げんきがあるようだ。
        まるくて　ひかるものが　すきで
        みつけると　ひろわずに　いられない。
      ja: |-
        夜のほうが　元気があるようだ。
        丸くて　光るものが　好きで
        見つけると　拾わずに　いられない。
      ko: |-
        밤에 더 기운이 넘치는 것 같다.
        둥글고 빛나는 것을 좋아해서
        발견하면 줍지 않고는 못 배긴다.
      zh-Hant: |-
        夜裡比白天更有活力。
        喜歡圓滾滾又會發亮的東西，
        一看到就會忍不住去撿起來。
      zh-Hans: |-
        貌似一到晚上就精力充沛。
        喜欢又圆又亮的东西，
        发现了就一定要捡走。
      en: |-
        Appears to be more active at night. It loves
        round and shiny things. It can’t stop itself from
        picking them up.
      fr: |-
        Il est surtout actif la nuit. Il aime ramasser
        les objets ronds et brillants.
      de: |-
        Dieses Pokémon ist offenbar nachtaktiv. Es liebt
        glitzernde, runde Gegenstände und stiehlt diese
        bei jeder Gelegenheit.
      es: |-
        Al parecer, es más activo por la noche. Adora de
        tal manera los objetos redondos y brillantes que
        no puede evitar recogerlos si se los encuentra.
      it: |-
        Pare che sia più attivo durante la notte. Ama
        gli oggetti lucenti e rotondi, e quando ne vede
        non può fare a meno di raccoglierli.
    lets-go-eevee:
      ja-Hrkt: |-
