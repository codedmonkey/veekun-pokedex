    sword:
      ja-Hrkt: |-
        ひかりものを　あつめるのが　すき。
        きげんが　いいときは　トレーナーにも
        コレクションを　みせてくれるぞ。
      ja: |-
        光り物を　集めるのが　好き。
        機嫌が　いいときは　トレーナーにも
        コレクションを　見せてくれるぞ。
      ko: |-
        빛나는 물건을 모으는 것을 좋아한다.
        기분이 좋을 때는 트레이너에게도
        컬렉션을 보여준다.
      zh-Hant: |-
        喜歡收集亮晶晶的東西。
        當牠心情好的時候，會讓
        訓練家一起欣賞自己的收藏。
      zh-Hans: |-
        喜欢收集亮晶晶的东西。
        当它心情好的时候，会让
        训练家一起欣赏自己的收藏。
      en: |-
        It loves to collect shiny things. If it’s in a good
        mood, it might even let its Trainer have a look
        at its hoard of treasures.
      fr: |-
        Il aime rassembler des objets brillants.
        S’il est de bonne humeur, il montre sa collection
        à son Dresseur.
      de: |-
        Es sammelt mit Vorliebe glänzende Gegenstände.
        Ist es gut gelaunt, lässt es seinen Trainer einen
        Blick auf seine Sammlung werfen.
      es: |-
        Le encanta reunir objetos brillantes. Cuando está
        de buen humor, hasta le muestra la colección a
        su Entrenador.
      it: |-
        Ama raccogliere oggetti luccicanti.
        Quando è di buon umore mostra la sua
        collezione anche al suo Allenatore.
    shield:
      ja-Hrkt: |-
        ひたいの　こばんが　よごれないよう
        まめに　かおを　あらう。　ガラルの
        ニャースとは　なかが　わるい。
      ja: |-
        額の　小判が　汚れないよう
        まめに　顔を　洗う。　ガラルの
        ニャースとは　仲が　悪い。
      ko: |-
        이마의 금화가 더러워지지 않도록
        바지런히 얼굴을 씻는다.
        가라르의 나옹과는 사이가 나쁘다.
      zh-Hant: |-
        為了不弄髒額頭上的
        金幣，會常常洗臉。
        和伽勒爾的喵喵關係不好。
      zh-Hans: |-
        为了不弄脏额头上的
        金币，会常常洗脸。
        和伽勒尔的喵喵关系不好。
      en: |-
        It washes its face regularly to keep the coin on
        its forehead spotless. It doesn’t get along with
