    black-2:
      en: |-
        It is nocturnal in nature. If it
        spots something shiny, its eyes
        glitter brightly.
    white-2:
      en: |-
        It is nocturnal in nature. If it
        spots something shiny, its eyes
        glitter brightly.
    x:
      ja-Hrkt: |-
        よなかに　こうどうする　しゅうせい。
        きらきら　ひかるものを　みつけると
        まけないくらい　ひとみが　かがやく。
      ja: |-
        夜中に　行動する　習性。
        キラキラ　光るものを　見つけると
        負けないくらい　瞳が　輝く。
      ko: |-
        한밤중에 움직이는 습성이 있다.
        반짝반짝 빛나는 것을 발견하면
        그에 못지않게 눈동자가 반짝인다.
      en: |-
        It is nocturnal in nature. If it spots something shiny,
        its eyes glitter brightly.
      fr: |-
        Son regard s’anime à la vue d’un objet brillant.
        C’est un Pokémon nocturne.
      de: |-
        Ein nachtaktives Pokémon. Sieht es etwas
        Schimmerndes, fangen seine Augen an zu glänzen.
      es: |-
        Es de naturaleza nocturna. Le atraen los objetos
        brillantes.
      it: |-
        È un Pokémon attivo di notte. Se nota qualcosa
        di luccicante, i suoi occhi cominciano a brillare.
    'y':
      ja-Hrkt: |-
        まるいものが　だいすき。よなよな
        でかけては　おちている　コインを
        ひろい　あつめて　かえってくる。
      ja: |-
        まるいものが　大好き。夜な夜な
        出かけては　落ちている　コインを
        拾い　集めて　帰ってくる。
      ko: |-
        둥근 물건을 정말 좋아한다.
        밤마다 나가서는 떨어진 동전을
        주워 모아서 돌아온다.
      en: |-
        Adores round objects. It wanders the streets on a
        nightly basis to look for dropped loose change.
      fr: |-
        Il adore les pièces de monnaie. Il hante les rues à
        la recherche de pièces oubliées par les passants.
      de: |-
        Dieses Pokémon bewundert runde Objekte. Es sucht
        nachts auf den Straßen nach verlorenen Münzen.
      es: |-
        Adora los objetos redondos. De noche, camina por las
        calles en busca de monedas perdidas.
      it: |-
        Ama gli oggetti rotondi. Di notte vaga per le vie
        in cerca di monetine perdute.
    omega-ruby:
      ja-Hrkt: |-
        するどい　ツメを　ひっこめて　ぬきあし　さしあし
        あしおとを　たてずに　あるくことが　できる。
        キラキラ　ひかる　コインが　なぜか　だいすきだ。
      ja: |-
        鋭い　ツメを　引っ込めて　抜き足　差し足
        足音を　立てずに　歩くことが　できる。
        キラキラ　光る　コインが　なぜか　大好きだ。
      ko: |-
        날카로운 발톱을 집어넣고 살금살금
        발소리를 내지 않고 걸을 수 있다.
        반짝반짝 빛나는 동전을 왠지 모르지만 매우 좋아한다.
      en: |-
        Meowth withdraws its sharp claws into its paws to slinkily sneak
        about without making any incriminating footsteps.
        For some reason, this Pokémon loves shiny coins that
        glitter with light.
      fr: |-
        Miaouss peut rentrer ses griffes dans ses pattes pour rôder
        gracieusement sans laisser de traces. Étrangement,
        ce Pokémon raffole des pièces d’or qui brillent à la lumière.
      de: |-
        Mauzi zieht seine scharfen Krallen ein, um umherschleichen
        zu können, ohne verräterische Spuren zu hinterlassen.
        Dieses Pokémon hat eine Vorliebe für Münzen, die im
        Licht glitzern.
      es: |-
        Meowth retrae las afiladas uñas de sus zarpas para caminar a
        hurtadillas, dando sigilosos pasos para pasar inadvertido.
        No se sabe muy bien por qué, pero este Pokémon adora las
        monedas brillantes que resplandecen con la luz.
      it: |-
        Meowth ritira i suoi artigli affilati all’interno delle zampe
        per poter aggirarsi furtivo camuffando le tracce.
        Per qualche oscura ragione questo Pokémon è attratto
        dalle monetine che splendono alla luce.
    alpha-sapphire:
      ja-Hrkt: |-
        するどい　ツメを　ひっこめて　ぬきあし　さしあし
