rillaboom:
  base_happiness: 50
  capture_rate: 45
  color: green
  egg_groups:
    - ground
    - plant
  evolution_chain: grookey
  evolves_from: thwackey
  flavor_text:
    sword:
      ja-Hrkt: |-
        とくべつな　きりかぶの　パワーを
        ドラミングで　コントロール。
        ねっこを　あやつって　たたかう。
      ja: |-
        特別な　切り株の　パワーを
        ドラミングで　コントロール。
        根っこを　操って　戦う。
      ko: |-
        특별한 그루터기의 파워를
        드럼 연주로 컨트롤한다.
        뿌리를 조종해서 싸운다.
      zh-Hant: |-
        能夠透過打鼓來控制
        特別的樹樁中的力量，
        操縱樹根進行戰鬥。
      zh-Hans: |-
        能够通过打鼓来控制
        特别的树桩中的力量，
        操纵树根进行战斗。
      en: |-
        By drumming, it taps into the power of its special
        tree stump. The roots of the stump follow its
        direction in battle.
      fr: |-
        Il contrôle le pouvoir de sa souche singulière
        en tapant en rythme dessus.
        Il se bat en manipulant des racines.
      de: |-
        Es kontrolliert die Macht seines speziellen
        Baumstumpfes durch Trommeln. Im Kampf
        manipuliert es damit Wurzeln.
      es: |-
        Controla los poderes y las raíces de su singular
        tocón en combate golpeándolo como si fuera
        un tambor.
      it: |-
        Controlla il potere del suo ceppo speciale
        usandolo come un tamburo e lotta servendosi
        delle radici.
    shield:
      ja-Hrkt: |-
        ドラムテクニックに　すぐれた　ものが
        ボスになる。　おだやかな　きしょうで
        グループの　ちょうわを　おもんじる。
      ja: |-
        ドラムテクニックに　優れた　ものが
        ボスになる。　穏やかな　気性で
        グループの　調和を　重んじる。
      ko: |-
        드럼 테크닉이 가장 뛰어난 자가
        보스가 된다. 천성이 온화해서
        그룹의 조화를 중히 여긴다.
      zh-Hant: |-
        打鼓技巧最高超的那一隻
        會成為首領。性情溫和，
        重視族群的和諧相處。
      zh-Hans: |-
        打鼓技巧最高超的那一只
        会成为首领。性情温和，
        重视族群的和谐相处。
      en: |-
        The one with the best drumming techniques
        becomes the boss of the troop. It has a gentle
        disposition and values harmony among its group.
      fr: |-
        Celui qui possède les meilleures techniques
        de percussion devient le chef. De nature calme,
        il privilégie l’harmonie du groupe.
      de: |-
        Wer die beste Trommeltechnik hat, wird zum
        Anführer. Da es ein ruhiges Gemüt hat, legt es
        viel Wert auf Harmonie in der Gruppe.
      es: |-
        El percusionista con la técnica más depurada se
        convierte en líder. Son de carácter tranquilo y
        dan mucha importancia a la armonía del grupo.
      it: |-
        Colui che ha una migliore tecnica di percussione
        diventa il capo. Ha un carattere tranquillo e
        dà molta importanza all’armonia del gruppo.
  form_description: {  }
  forms_switchable: false
  gender_rate: '1'
  generation: generation-viii
  genus:
    ja-Hrkt: ドラマーポケモン
    ja: ドラマーポケモン
    ko: 드러머포켓몬
    zh-Hant: 鼓手寶可夢
    zh-Hans: 鼓手宝可梦
    en: 'Drummer Pokémon'
    fr: 'Pokémon Batteur'
    de: Drummer-Pokémon
    es: 'Pokémon Percusión'
    it: 'Pokémon Percussione'
  growth_rate: medium-slow
