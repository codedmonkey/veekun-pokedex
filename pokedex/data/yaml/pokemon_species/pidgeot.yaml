    lets-go-pikachu:
      ja-Hrkt: |-
        マッハ２で　ひこうし　エサをさがす。
        その　おおきな　ツメは　ぶきと
        しても　おそれられている。
      ja: |-
        マッハ２で　飛行し　エサを探す。
        その　大きな　ツメは　武器と
        しても　恐れられている。
      ko: |-
        마하2의 속도로 비행하여 먹이를 찾는다.
        그 커다란 발톱은 무기로서도
        두려움의 대상이다.
      zh-Hant: |-
        會以２馬赫的速度飛行
        來尋找食物。巨大的爪子
        是很可怕的武器。
      zh-Hans: |-
        以２马赫的飞行速度来
        觅食。它巨大的爪子是
        非常令人惧怕的武器。
      en: |-
        This Pokémon flies at Mach 2 speed,
        seeking prey. Its large talons are feared
        as wicked weapons.
      fr: |-
        Ce Pokémon vole à Mach 2 quand il chasse.
        Ses grandes serres sont des armes redoutables.
      de: |-
        Auf der Jagd nach Beute fliegt es mit einer
        Geschwindigkeit von bis zu Mach 2. Seine
        mächtigen Klauen gelten als gefürchtete Waffen.
      es: |-
        Este Pokémon vuela a una velocidad de 2 mach
        en busca de presas. Sus grandes garras son armas
        muy peligrosas.
      it: |-
        Può volare a una velocità di Mach 2 in cerca
        di prede. I suoi artigli sono armi micidiali.
