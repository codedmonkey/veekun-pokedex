lickilicky:
  base_happiness: 50
  capture_rate: 30
  color: pink
  egg_groups:
    - monster
  evolution_chain: lickitung
  evolves_from: lickitung
  flavor_text:
    diamond:
      en: |-
        It wraps things with its extensible
        tongue. Getting too close to it
        will leave you soaked with drool.
    pearl:
      en: |-
        It wraps things with its extensible
        tongue. Getting too close to it
        will leave you soaked with drool.
    platinum:
      en: |-
        The long tongue is always soggy
        with slobber. The saliva contains
        a solvent that causes numbness.
    heartgold:
      en: |-
        Its saliva can decompose anything.
        It wraps its long tongue around things
        to coat them with its sticky saliva.
    soulsilver:
      en: |-
        It has space in its throat to store
        saliva. It can also roll up its tongue
        and store it in the same spot.
    black:
      en: |-
        The long tongue is always soggy
        with slobber. The saliva contains
        a solvent that causes numbness.
      fr: |-
        Sa longue langue est couverte en
        permanence d’une épaisse couche
        de bave anesthésiante.
    white:
      en: |-
        The long tongue is always soggy
        with slobber. The saliva contains
        a solvent that causes numbness.
      fr: |-
        Sa longue langue est couverte en
        permanence d’une épaisse couche
        de bave anesthésiante.
    black-2:
      en: |-
        Their saliva contains lots of components
        that can dissolve anything. The numbness
        caused by their lick does not dissipate.
    white-2:
      en: |-
        Their saliva contains lots of components
        that can dissolve anything. The numbness
        caused by their lick does not dissipate.
    x:
      ja-Hrkt: |-
        ぐんぐん　のびる　ベロを　なんにでも
        まきつける。うかつに　ちかよると
        だえきで　べとべとに　されてしまう。
      ja: |-
        ぐんぐん　伸びる　ベロを　なんにでも
        巻きつける。うかつに　近寄ると
        だえきで　べとべとに　されてしまう。
      ko: |-
        쭉쭉 늘어나는 혓바닥으로 무엇이든
        휘감는다. 함부로 다가가면
        타액으로 끈적끈적거리게 된다.
      en: |-
        It wraps things with its extensible tongue. Getting
        too close to it will leave you soaked with drool.
      fr: |-
        Il enroule tout dans sa langue extensible. Ceux qui
        l’approchent finissent couverts de bave.
      de: |-
        Es umklammert Dinge mit seiner dehnbaren Zunge.
        Kommt man ihm zu nahe, wird man eingespeichelt.
      es: |-
        Agarra cosas con su lengua extensible. Si te acercas
        mucho, te deja lleno de babas.
      it: |-
        Avvolge ogni cosa con la sua lingua allungabile. Chi
        si avvicina troppo, si ritroverà tutto bagnato di bava.
    'y':
      ja-Hrkt: |-
        だえきには　どんな　ものも　とかす
        せいぶんが　たっぷり　ふくまれており
        なめられると　いつまでも　しびれる。
      ja: |-
        だえきには　どんな　物も　溶かす
        成分が　たっぷり　含まれており
        なめられると　いつまでも　しびれる。
      ko: |-
        타액에는 어떤 것도 녹이는
        성분이 충분히 포함되어 있어
        핥으면 언제까지나 마비된다.
      en: |-
        Their saliva contains lots of components that can
        dissolve anything. The numbness caused by their
        lick does not dissipate.
      fr: |-
        Sa bave anesthésiante est chargée d’une substance
        capable de faire fondre n’importe quelle matière.
      de: |-
        Ihr Speichel enthält eine ätzende Substanz, die bei
        Kontakt mit der Haut anhaltende Taubheit erzeugt.
      es: |-
        La alta concentración de sustancias en su saliva lo
        disuelve todo. Un lametón provoca un entumecimiento
        permanente.
      it: |-
        La sua saliva contiene una sostanza che scioglie
        qualsiasi cosa e causa la paralisi se si viene leccati.
    omega-ruby:
      ja-Hrkt: |-
        ぐんぐん　のびる　ベロを　なんにでも
        まきつける。うかつに　ちかよると
        だえきで　べとべとに　されてしまう。
      ja: |-
        ぐんぐん　伸びる　ベロを　なんにでも
        巻きつける。うかつに　近寄ると
        だえきで　べとべとに　されてしまう。
      ko: |-
        쭉쭉 늘어나는 혓바닥으로 무엇이든
        휘감는다. 함부로 다가가면
        타액으로 끈적끈적거리게 된다.
      en: |-
        It wraps things with its extensible tongue. Getting
        too close to it will leave you soaked with drool.
      fr: |-
        Il enroule tout dans sa langue extensible. Ceux qui
        l’approchent finissent couverts de bave.
      de: |-
        Es umklammert Dinge mit seiner dehnbaren Zunge.
        Kommt man ihm zu nahe, wird man eingespeichelt.
      es: |-
        Agarra cosas con su lengua extensible. Si te acercas mucho,
        te deja lleno de babas.
      it: |-
        Avvolge ogni cosa con la sua lingua allungabile. Chi si avvicina
        troppo, si ritroverà tutto bagnato di bava.
    alpha-sapphire:
      ja-Hrkt: |-
        だえきには　どんな　ものも　とかす
        せいぶんが　たっぷり　ふくまれており
        なめられると　いつまでも　しびれる。
      ja: |-
        だえきには　どんな　物も　溶かす
        成分が　たっぷり　含まれており
        なめられると　いつまでも　しびれる。
      ko: |-
        타액에는 어떤 것도 녹이는
        성분이 충분히 포함되어 있어
        핥으면 언제까지나 마비된다.
      en: |-
        Their saliva contains lots of components that can
        dissolve anything. The numbness caused by their
        lick does not dissipate.
      fr: |-
        Sa bave anesthésiante est chargée d’une substance
        capable de faire fondre n’importe quelle matière.
      de: |-
        Ihr Speichel enthält eine ätzende Substanz, die bei Kontakt
        mit der Haut anhaltende Taubheit erzeugt.
      es: |-
        La alta concentración de sustancias en su saliva lo disuelve
        todo. Un lametón provoca un entumecimiento permanente.
      it: |-
        La sua saliva contiene una sostanza che scioglie qualsiasi cosa
        e causa la paralisi se si viene leccati.
    ultra-sun:
      ja-Hrkt: |-
        したが　どこまで　のびるのかの
        コンテストが　かいさい　されている。
        げんざいの　さいこうきろくは２５ｍ。
      ja: |-
        舌が　どこまで　伸びるのかの
        コンテストが　開催　されている。
        現在の　最高記録は２５ｍ。
      ko: |-
        혀가 어디까지 늘어나는지
        콘테스트가 열린다.
        현재 최고 기록은 25m다.
      zh-Hant: |-
        會舉行比賽誰的舌頭
        伸得最遠的大會。
        目前的最高紀錄是２５公尺。
      zh-Hans: |-
        会举行看谁舌头伸得远的大赛。
        目前的最高纪录是２５米。
      en: |-
        A contest is under way to determine which one
        can stick its tongue out the farthest. The
        current record is...more than 82 feet.
      fr: |-
        Il existe un concours visant à déterminer lequel
        d’entre eux a la langue la plus longue. Le record
        actuel est de 25 m.
      de: |-
        Es gibt Wettbewerbe dazu, welches Schlurplek
        seine Zunge am weitesten herausstrecken kann.
        Der Rekord liegt bei 25 m.
      es: |-
        Se celebra una competición para comprobar qué
        Lickilicky logra extender más lejos la lengua. El
        récord actual es de 25 metros.
      it: |-
        Esiste una competizione per stabilire qual è
        il Lickilicky che riesce ad allungare di più la
        lingua. Il record attuale è di 25 metri.
    ultra-moon:
      ja-Hrkt: |-
        てあし　より　ベロを　つかうほうが
        ずっと　とくい。　ちいさな　マメの
        １つぶだけを　きように　つまめる。
      ja: |-
        手足　より　ベロを　使うほうが
        ずっと　得意。　小さな　マメの
        １粒だけを　器用に　摘める。
      ko: |-
        손발보다 혀를 사용하는 것이
        훨씬 능숙하다. 작은 콩 1알도
        능숙하게 집을 수 있다.
      zh-Hant: |-
        比起手腳，牠更加擅長使用舌頭。
        就算是１粒小小的豆子，
        牠也能靈巧地用舌頭撿起來。
      zh-Hans: |-
        比起手脚，它更擅长使用舌头。
        哪怕是１粒小小的豆子也能灵活地摘下。
      en: |-
        It uses its tongue much more skillfully than its
        hands or its feet. It can deftly pick up a
        single small bean with its tongue.
      fr: |-
        Il est bien plus adroit avec sa langue qu’avec
        ses autres membres, au point qu’elle peut même
        lui servir à ramasser un grain de riz minuscule.
      de: |-
        Es kann mit seiner Zunge geschickter umgehen
        als mit seinen Armen und Beinen. Selbst winzige
        Böhnchen hebt es mit ihrer Hilfe problemlos auf.
      es: |-
        Es mucho más hábil usando la lengua que sus
        extremidades, hasta el punto de poder coger
        con gran maña una minúscula habichuela.
      it: |-
        È molto più bravo a usare la lingua che gli arti,
        tanto che con essa riesce ad afferrare perfino
        un piccolo fagiolo.
    sword:
      ja-Hrkt: |-
        からだの　なんばいもの　ながさまで
        のびる　ふしぎな　ベロを　もつ。
        その　ふしぎは　みかいめいのまま。
      ja: |-
        体の　何倍もの　長さまで
        伸びる　不思議な　ベロを　もつ。
        その　不思議は　未解明のまま。
      ko: |-
        몸의 몇 배의 길이로 늘어나는
        신비한 혀를 가졌다.
        그 비밀은 아직 밝혀지지 않았다.
      zh-Hant: |-
        神奇的舌頭能夠伸到身高的
        好幾倍遠。至今沒人能解開
        為什麼它會這麼神奇。
      zh-Hans: |-
        拥有不可思议的舌头，
        全伸出来能有身体的数倍之长。
        其不可思议之谜至今仍未解开。
      en: |-
        Lickilicky’s strange tongue can stretch to many
        times the length of its body. No one has figured
        out how Lickilicky’s tongue can stretch so far.
      fr: |-
        Sa langue a l’incroyable faculté de s’allonger et
        d’atteindre plusieurs fois la taille de son corps.
        Ce mystère de la nature reste entier.
      de: |-
        Seine sonderbare Zunge kann sich bis auf ein
        Vielfaches seiner Körpergröße ausdehnen.
        Niemand weiß, wie das möglich ist.
      es: |-
        Su lengua es un misterio sin resolver: no se sabe
        cómo puede extenderla hasta alcanzar longitudes
        que superan varias veces la de su propio cuerpo.
      it: |-
        La sua lingua può misteriosamente allungarsi
        fino a molte volte la lunghezza del corpo.
        Ancora non si è capito come faccia.
    shield:
      ja-Hrkt: |-
        にんげんの　てさきにも　まけないほど
        きような　ベロで　なんでも　できる。
        はんたいに　ゆびさきは　ぶきようだ。
      ja: |-
        人間の　手先にも　負けないほど
        器用な　ベロで　なんでも　できる。
        反対に　指先は　不器用だ。
      ko: |-
        사람의 팔과 견줄 수 있을 정도의
        활용도 높은 혀로 뭐든지 한다.
        반대로 손은 무디다.
      zh-Hant: |-
        舌頭靈巧得不輸人類的手，
        什麼事情都能用它來完成。
        相對地，手指倒是很笨拙。
      zh-Hans: |-
        舌头的灵巧程度甚至不输给
        人手，没有它做不到的事。
        相反，手指却相当笨拙，
      en: |-
        Lickilicky can do just about anything with its
        tongue, which is as dexterous as the human hand.
        In contrast, Lickilicky’s use of its fingers is clumsy.
      fr: |-
        Il est aussi habile avec sa langue que les êtres
        humains le sont avec leurs mains. En revanche,
        il est maladroit quand il utilise ses doigts.
      de: |-
        Mit seiner Zunge kann es alles tun und ist damit
        so geschickt wie Menschen mit ihren Händen.
        Diese verwendet Schlurplek nur sehr unbeholfen.
      es: |-
        Es tan diestro con la lengua como un ser humano
        con las manos. Por el contrario, muestra escasa
        maña con los dedos.
      it: |-
        Può fare qualsiasi cosa con la sua lingua,
        agile quanto le mani di un essere umano.
        In compenso, è maldestro nell’uso delle dita.
    legends-arceus:
      en: |-
        Its tongue can extend and contract freely, and it is capable of
        reaching lengths over 10 times Lickilicky's height. Beware of the
        saliva, as it contains corrosive elements.
