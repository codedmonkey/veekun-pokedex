yamask:
  base_happiness: 50
  capture_rate: 190
  color: black
  egg_groups:
    - mineral
    - indeterminate
  evolution_chain: yamask
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        Each of them carries a mask that used
        to be its face when it was human.
        Sometimes they look at it and cry.
      fr: |-
        Le motif de son masque est son visage
        quand il était humain. Parfois, il le
        regarde et se met à pleurer.
    white:
      en: |-
        These Pokémon arose from the spirits of
        people interred in graves in past ages.
        Each retains memories of its former life.
      fr: |-
        Il est né de l’âme d’un défunt inhumé
        dans une tombe antique. Il a conservé
        ses anciens souvenirs.
    black-2:
      en: |-
        These Pokémon arose from the spirits of
        people interred in graves. Each retains
        memories of its former life.
    white-2:
      en: |-
        These Pokémon arose from the spirits of
        people interred in graves. Each retains
        memories of its former life.
    x:
      ja-Hrkt: |-
        おはかに　まいそうされた　ひとの
        たましいが　ポケモンに　へんかした。
        しぬまえの　きおくが　のこっている。
      ja: |-
        お墓に　埋葬された　人の
        魂が　ポケモンに　変化した。
        死ぬ前の　記憶が　残っている。
      ko: |-
        무덤에 매장된 사람의
        영혼이 포켓몬으로 변했다.
        죽기 전 기억이 남아 있다.
      en: |-
        These Pokémon arose from the spirits of people
        interred in graves. Each retains memories of its
        former life.
      fr: |-
        Il est né de l’âme d’un défunt inhumé dans une tombe
        antique. Il a conservé ses anciens souvenirs.
      de: |-
        Es entsteht aus den Seelen von längst begrabenen
        Menschen und kann sich immer noch an deren
        Vergangenheit erinnern.
      es: |-
        Almas de humanos sepultados en tumbas que han
        adquirido forma de Pokémon. Recuerdan su vida antes
        de la muerte.
      it: |-
        Erano un tempo spettri che riposavano in antiche
        tombe. Conservano la memoria della loro vita mortale.
    'y':
      ja-Hrkt: |-
        もっている　マスクは　デスマスが
        にんげんだった　ときの　かお。
        たまに　みつめては　ないている。
      ja: |-
        持っている　マスクは
        デスマスが　人間だった　ときの　顔。
        たまに　見つめては　泣いている。
      ko: |-
        가지고 있는 마스크는 데스마스가
        사람이었을 때의 얼굴이다.
        가끔 마스크를 쳐다보며 운다.
      en: |-
        Each of them carries a mask that used to be its face
        when it was human. Sometimes they look at it
        and cry.
      fr: |-
        Le motif de son masque est son visage quand il était
        humain. Parfois, il le regarde et se met à pleurer.
      de: |-
        Seine Maske ist ein Abbild des Gesichts, das es
        als Mensch hatte. Manchmal weint es, wenn man
        ihm in die Augen sieht.
      es: |-
        Su máscara representa la cara que poseía cuando
        era humano. A veces se le saltan las lágrimas al
        contemplarla.
      it: |-
        La maschera che indossa è il volto che aveva quando
        era un umano. A volte si mette a piangere mentre
        la guarda.
    omega-ruby:
      ja-Hrkt: |-
        おはかに　まいそうされた　ひとの
        たましいが　ポケモンに　へんかした。
        しぬまえの　きおくが　のこっている。
      ja: |-
        お墓に　埋葬された　人の
        魂が　ポケモンに　変化した。
        死ぬ前の　記憶が　残っている。
      ko: |-
        무덤에 매장된 사람의
        영혼이 포켓몬으로 변했다.
        죽기 전 기억이 남아 있다.
      en: |-
        These Pokémon arose from the spirits of people
        interred in graves. Each retains memories of its
        former life.
      fr: |-
        Il est né de l’âme d’un défunt inhumé dans une tombe antique.
        Il a conservé ses anciens souvenirs.
      de: |-
        Es entsteht aus den Seelen von längst begrabenen Menschen
        und kann sich immer noch an deren Vergangenheit erinnern.
      es: |-
        Almas de humanos sepultados en tumbas que han adquirido
        forma de Pokémon. Recuerdan su vida antes de la muerte.
      it: |-
        Erano un tempo spettri che riposavano in antiche tombe.
        Conservano la memoria della loro vita mortale.
    alpha-sapphire:
      ja-Hrkt: |-
        もっている　マスクは　デスマスが
        にんげんだった　ときの　かお。
        たまに　みつめては　ないている。
      ja: |-
        持っている　マスクは
        デスマスが　人間だった　ときの　顔。
        たまに　見つめては　泣いている。
      ko: |-
        가지고 있는 마스크는 데스마스가
        사람이었을 때의 얼굴이다.
        가끔 마스크를 쳐다보며 운다.
      en: |-
        Each of them carries a mask that used to be its face
        when it was human. Sometimes they look at it
        and cry.
      fr: |-
        Le motif de son masque est son visage quand il était humain.
        Parfois, il le regarde et se met à pleurer.
      de: |-
        Seine Maske ist ein Abbild des Gesichts, das es als Mensch
        hatte. Manchmal weint es, wenn man ihm in die Augen sieht.
      es: |-
        Su máscara representa la cara que poseía cuando era humano.
        A veces se le saltan las lágrimas al contemplarla.
      it: |-
        La maschera che indossa è il volto che aveva quando era un
        umano. A volte si mette a piangere mentre la guarda.
    sword:
      ja-Hrkt: |-
        よなよな　いせきを　さまよう。
        もっている　マスクは　ひと　だった
        ころの　じぶんの　かお　だという。　
      ja: |-
        夜な夜な　遺跡を　さまよう。
        もっている　マスクは　人　だった
        ころの　自分の　顔　だという。
      ko: |-
        밤마다 유적을 떠돈다.
        가지고 있는 마스크는 자신이
        인간이던 시절의 얼굴이라고 한다.
      zh-Hant: |-
        每天夜裡都在遺跡中徘徊。
        據說牠拿著的面具
        是牠還是人類時的臉。
      zh-Hans: |-
        每天夜里都在遗迹中徘徊。
        据说它拿着的面具
        是它还是人类时的脸。
      en: |-
        It wanders through ruins by night, carrying a mask
        that’s said to have been the face it had when it
        was still human.
      fr: |-
        Il passe ses nuits à errer dans les ruines.
        On raconte que le masque qu’il porte représente
        son visage quand il était humain.
      de: |-
        Makabaja irren Nacht für Nacht durch Ruinen.
        Die Masken, die sie umhertragen, sind angeblich
        ihre ehemaligen Menschengesichter.
      es: |-
        Merodea todas las noches entre ruinas. Se dice
        que la máscara que lleva replica su antiguo rostro
        humano.
      it: |-
        Si aggira tra i ruderi ogni notte. Si dice che
        la maschera che indossa sia il volto che
        aveva quando era umano.
    shield:
      ja-Hrkt: |-
        こだいじんの　たましいが　ポケモンに
        なった。　じぶんの　かおを　しる
        ひとを　さがし　いせきを　さまよう。
      ja: |-
        古代人の　魂が　ポケモンに
        なった。　自分の　顔を　知る
        人を　探し　遺跡を　さまよう。
      ko: |-
        고대인의 영혼이 포켓몬이 되어
        태어났다. 자신의 얼굴을 아는
        사람을 찾아 유적을 떠돈다.
      zh-Hant: |-
        古代人的靈魂變成了寶可夢。
        為了尋找認得自己長相的人
        而在遺跡裡徘徊。
      zh-Hans: |-
        古代人的灵魂变成了宝可梦。
        为了寻找认得自己长相的人
        而在遗迹里徘徊。
      en: |-
        The spirit of a person from a bygone age became
        this Pokémon. It rambles through ruins, searching
        for someone who knows its face.
      fr: |-
        Il est né de l’âme d’un être humain d’un peuple
        antique. Il erre dans les ruines à la recherche
        de quiconque reconnaîtra son visage.
      de: |-
        Makabaja sind Seelen von Menschen aus uralten
        Zeiten, die zu Pokémon wurden. Sie suchen in
        Ruinen nach Leuten, die ihr Gesicht kennen.
      es: |-
        Surgió del alma de una persona que vivió en
        tiempos remotos. Merodea por las ruinas en
        busca de alguien que reconozca su rostro.
      it: |-
        Spirito di un uomo dell’antichità divenuto
        Pokémon. Vaga tra le rovine in cerca di qualcuno
        che riconosca il suo volto.
