reuniclus:
  base_happiness: 50
  capture_rate: 50
  color: green
  egg_groups:
    - indeterminate
  evolution_chain: solosis
  evolves_from: duosion
  flavor_text:
    black:
      en: |-
        When Reuniclus shake hands, a network
        forms between their brains, increasing
        their psychic power.
      fr: |-
        Quand ils se tiennent par la main,
        leurs cerveaux forment un réseau qui
        démultiplie leurs pouvoirs psychiques.
    white:
      en: |-
        These remarkably intelligent Pokémon
        fight by controlling arms that can
        grip with rock-crushing power.
      fr: |-
        Il combat avec ses bras assez puissants
        pour broyer des rochers.
        C’est un Pokémon très intelligent.
    black-2:
      en: |-
        They use psychic power to control their
        arms, which are made of a special liquid.
        They can crush boulders psychically.
    white-2:
      en: |-
        They use psychic power to control their
        arms, which are made of a special liquid.
        They can crush boulders psychically.
    x:
      ja-Hrkt: |-
        はっきした　サイコパワーを　つかい
        とくしゅな　えきたいで　つくられた
        うでを　あやつり　いわを　くだく。
      ja: |-
        発揮した　サイコパワーを　使い
        特殊な　液体で　つくられた
        腕を　操り　岩を　砕く。
      ko: |-
        발휘한 사이코 파워를 사용해
        특수한 액체로 만들어진
        팔을 조종해서 바위를 부순다.
      en: |-
        They use psychic power to control their arms,
        which are made of a special liquid. They can crush
        boulders psychically.
      fr: |-
        Ses bras, faits d’une matière conduisant ses pouvoirs
        psychiques, sont assez puissants pour broyer des
        rochers.
      de: |-
        Seine Arme bestehen aus einer speziellen Flüssigkeit.
        Dank seiner Psycho-Kräfte kann es mit ihnen
        Felsen zerschmettern.
      es: |-
        Hacen gala de su poder psíquico y mueven sus brazos
        compuestos de líquido para controlar rocas y hacerlas
        añicos.
      it: |-
        Le sue braccia, piene di un liquido che convoglia
        i suoi poteri psichici, sono anche in grado di
        frantumare le rocce.
    'y':
      ja-Hrkt: |-
        ランクルス　どうしが　あくしゅすると
        のうみそが　ネットワークで　つながり
        サイコパワーが　ぞうふくされるのだ。
      ja: |-
        ランクルス　同士が　握手すると
        脳みそが　ネットワークで　つながり
        サイコパワーが　増幅されるのだ。
      ko: |-
        란쿨루스끼리 악수를 하면
        뇌가 네트워크처럼 연결되어
        사이코 파워가 증폭된다.
      en: |-
        When Reuniclus shake hands, a network forms
        between their brains, increasing their
        psychic power.
      fr: |-
        Quand ils se tiennent par la main, leurs cerveaux
        forment un réseau qui démultiplie leurs pouvoirs
        psychiques.
      de: |-
        Schütteln sich zwei von ihnen die Hände, bilden ihre
        Denkapparate ein Netzwerk und ihre Psycho-Kräfte
        werden stärker.
      es: |-
        Cuando los Reuniclus se dan la mano, sus cerebros se
        conectan y multiplican sus poderes psíquicos.
      it: |-
        Quando i Reuniclus si tengono per mano, i loro cervelli
        si interconnettono e i poteri psichici si amplificano.
    omega-ruby:
      ja-Hrkt: |-
        はっきした　サイコパワーを　つかい
        とくしゅな　えきたいで　つくられた
        うでを　あやつり　いわを　くだく。
      ja: |-
        発揮した　サイコパワーを　使い
        特殊な　液体で　つくられた
        腕を　操り　岩を　砕く。
      ko: |-
        발휘한 사이코 파워를 사용해
        특수한 액체로 만들어진
        팔을 조종해서 바위를 부순다.
      en: |-
        They use psychic power to control their arms,
        which are made of a special liquid. They can crush
        boulders psychically.
      fr: |-
        Ses bras, faits d’une matière conduisant ses pouvoirs
        psychiques, sont assez puissants pour broyer des rochers.
      de: |-
        Seine Arme bestehen aus einer speziellen Flüssigkeit. Dank
        seiner Psycho-Kräfte kann es mit ihnen Felsen zerschmettern.
      es: |-
        Hacen gala de su poder psíquico y mueven sus brazos
        compuestos de líquido para controlar rocas y hacerlas
        añicos.
      it: |-
        Le sue braccia, piene di un liquido che convoglia i suoi poteri
        psichici, sono anche in grado di frantumare le rocce.
    alpha-sapphire:
      ja-Hrkt: |-
        ランクルス　どうしが　あくしゅすると
        のうみそが　ネットワークで　つながり
        サイコパワーが　ぞうふくされるのだ。
      ja: |-
        ランクルス　同士が　握手すると
        脳みそが　ネットワークで　つながり
        サイコパワーが　増幅されるのだ。
      ko: |-
        란쿨루스끼리 악수를 하면
        뇌가 네트워크처럼 연결되어
        사이코 파워가 증폭된다.
      en: |-
        When Reuniclus shake hands, a network forms
        between their brains, increasing their
        psychic power.
      fr: |-
        Quand ils se tiennent par la main, leurs cerveaux forment
        un réseau qui démultiplie leurs pouvoirs psychiques.
      de: |-
        Schütteln sich zwei von ihnen die Hände, bilden ihre
        Denkapparate ein Netzwerk und ihre Psycho-Kräfte
        werden stärker.
      es: |-
        Cuando los Reuniclus se dan la mano, sus cerebros se
        conectan y multiplican sus poderes psíquicos.
      it: |-
        Quando i Reuniclus si tengono per mano, i loro cervelli
        si interconnettono e i poteri psichici si amplificano.
    sword:
      ja-Hrkt: |-
        ちょうのうりょくを　つかうよりも
        じまんの　うでを　ぶんまわして
        なぐりたおすのを　このんでいる。
      ja: |-
        超能力を　使うよりも
        自慢の　腕を　ぶん回して
        殴り倒すのを　好んでいる。
      ko: |-
        초능력을 사용하는 것보다는
        자랑거리인 팔을 휘둘러서
        때려눕히는 것을 선호한다.
      zh-Hant: |-
        比起使用超能力，
        牠更喜歡靠著揮動
        自傲的手臂來打倒對手。
      zh-Hans: |-
        比起使用超能力，
        它更喜欢靠着挥动
        自傲的手臂来打倒对手。
      en: |-
        While it could use its psychic abilities in battle,
        this Pokémon prefers to swing its powerful arms
        around to beat opponents into submission.
      fr: |-
        Fier d’avoir des bras, il préfère s’en servir
        pour assommer ses adversaires plutôt que
        d’avoir recours à ses pouvoirs psychiques.
      de: |-
        Es ist stolz auf seine beiden Arme und greift bei
        Kämpfen lieber auf diese zurück, anstatt seine
        übernatürlichen Kräfte einzusetzen.
      es: |-
        Prefiere derribar a los rivales haciendo girar sus
        fuertes brazos antes que valerse de sus poderes
        extrasensoriales.
      it: |-
        Piuttosto che usare i suoi poteri soprannaturali,
        preferisce sferrare colpi facendo roteare
        energicamente le braccia, di cui va molto fiero.
    shield:
      ja-Hrkt: |-
        とくしゅな　えきたいを　のむと
        ちえを　さずかると　いわれるが
        ランクルスいがいには　もうどく。
      ja: |-
        特殊な　液体を　飲むと
        知恵を　授かると　いわれるが
        ランクルス以外には　猛毒。
      ko: |-
        특수한 액체를 마시면
        지혜를 얻는다고 전해지지만
        란쿨루스 외에는 맹독이다.
      zh-Hant: |-
        雖然有人說只要喝掉牠特殊的液體
        就能得到智慧，但對人造細胞卵
        以外來說，那其實是劇毒。
      zh-Hans: |-
        虽然有人说只要喝掉它特殊的液体
        就能得到智慧，但对人造细胞卵
        以外来说，那其实是剧毒。
      en: |-
        It’s said that drinking the liquid surrounding
        Reuniclus grants wisdom. Problem is, the liquid is
        highly toxic to anything besides Reuniclus itself.
      fr: |-
        S’il ne s’agissait pas d’un poison violent que seul
        Symbios peut boire, son curieux fluide pourrait,
        selon les dires, rendre plus intelligent.
      de: |-
        Seine seltsame Flüssigkeit soll große Intelligenz
        verleihen, wenn man sie trinkt. Leider ist sie ein
        tödliches Gift für alle außer Zytomega.
      es: |-
        Al parecer, beber su líquido especial otorga un
        intelecto sin par, pero resulta muy venenoso,
        excepto para los propios Reuniclus.
      it: |-
        Si dice che il suo liquido speciale doni
        intelligenza a chi lo beve, ma è velenosissimo
        per tutti tranne che per Reuniclus.
