cursola:
  base_happiness: 50
  capture_rate: 30
  color: white
  egg_groups:
    - water1
    - water3
  evolution_chain: corsola
  evolves_from: corsola
  flavor_text:
    sword:
      ja-Hrkt: |-
        れいりょくが　たかまり　カラから
        ときはなたれた。　れいたいで
        かくの　たましいを　まもっている。
      ja: |-
        霊力が　高まり　殻から
        解き放たれた。　霊体で
        核の　魂を　守っている。
      ko: |-
        영력이 높아져서 껍질에서
        해방되었다. 영체로
        핵이 되는 영혼을 지킨다.
      zh-Hant: |-
        靈力增強之後從殼裡
        被解放出來。用靈體
        保護著內核中的靈魂。
      zh-Hans: |-
        灵力增强之后从壳里
        被解放出来。用灵体
        保护着内核中的灵魂。
      en: |-
        Its shell is overflowing with its heightened
        otherworldly energy. The ectoplasm serves as
        protection for this Pokémon’s core spirit.
      fr: |-
        Son énergie spectrale accrue s’est répandue
        hors de sa coquille. Il protège l’âme de son noyau
        avec son corps spirituel.
      de: |-
        In ihm wuchs eine mysteriöse Kraft und so löste
        es sich von seinem Panzer los. Sein geisterhaftes
        Ektoplasma schützt die Seele im Kern.
      es: |-
        Su energía espiritual ha aumentado hasta hacerlo
        desprenderse de su base caliza. Protege el alma
        del núcleo con su cuerpo espectral.
      it: |-
        Un accumulo di energia misteriosa lo ha separato
        dal suo guscio. Protegge l’anima contenuta nel
        suo nucleo in una sorta di ectoplasma.
    shield:
      ja-Hrkt: |-
        たましいを　おおう　れいたいの
        からだには　ちゅうい。　ふれると
        いしのように　うごけなく　なるぞ。
      ja: |-
        魂を　被う　霊体の
        体には　注意。　触れると
        石のように　動けなく　なるぞ。
      ko: |-
        혼을 감싸는 영체의 몸은
        주의가 필요하다. 만지면
        돌처럼 움직일 수 없게 된다.
      zh-Hant: |-
        一定要小心牠那包覆著
        靈魂的靈體。如果觸摸到，
        就會像石頭一樣動彈不得。
      zh-Hans: |-
        一定要小心它那包覆着
        灵魂的灵体。如果触摸到，
        就会像石头一样动弹不得。
      en: |-
        Be cautious of the ectoplasmic body
        surrounding its soul. You’ll become
        stiff as stone if you touch it.
      fr: |-
        Ceux qui ont le malheur de toucher le corps
        spirituel qui protège son noyau se retrouveront
        immobilisés, comme changés en pierre.
      de: |-
        Vor dem geisterhaften Ektoplasma, das seine
        Seele umhüllt, ist Vorsicht geboten. Berührt man
        es, erstarrt man wie zu Stein.
      es: |-
        Conviene tener cuidado con el cuerpo espectral
        que recubre su alma, pues quien lo toque podría
        acabar inerte como una piedra.
      it: |-
        Il corpo di ectoplasma che avvolge la sua anima
        è pericolosissimo: chi lo tocca si immobilizza
        come se fosse stato tramutato in pietra.
