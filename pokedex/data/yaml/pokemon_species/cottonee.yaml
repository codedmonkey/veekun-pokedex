cottonee:
  base_happiness: 50
  capture_rate: 190
  color: green
  egg_groups:
    - fairy
    - plant
  evolution_chain: cottonee
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        When attacked, it escapes by shooting
        cotton from its body. The cotton serves
        as a decoy to distract the attacker.
      fr: |-
        Si on l’attaque, il projette un nuage de
        coton. L’ennemi le confond avec lui, ce
        qui permet à Doudouvet de s’enfuir.
    white:
      en: |-
        They go wherever the wind takes them.
        On rainy days, their bodies are heavier,
        so they take shelter beneath big trees.
      fr: |-
        Il dérive librement au gré du vent.
        Les jours de pluie, il s’alourdit et
        se réfugie au pied des arbres.
    black-2:
      en: |-
        Perhaps because they feel more at ease
        in a group, they stick to others they
        find. They end up looking like a cloud.
    white-2:
      en: |-
        Perhaps because they feel more at ease
        in a group, they stick to others they
        find. They end up looking like a cloud.
    x:
      ja-Hrkt: |-
        おそわれると　からだから　わたを
        とばす。てきが　わたを　モンメンと
        まちがえている　すきに　にげるのだ。
      ja: |-
        襲われると　体から　綿を　飛ばす。
        敵が　綿を　モンメンと
        間違えている　すきに　逃げるのだ。
      ko: |-
        공격당하면 몸에서 솜을
        날린다. 상대가 솜을 소미안으로
        착각하고 있는 동안 도망친다.
      en: |-
        When attacked, it escapes by shooting cotton from
        its body. The cotton serves as a decoy to distract
        the attacker.
      fr: |-
        Si on l’attaque, il projette un nuage de coton.
        L’ennemi le confond avec lui, ce qui permet à
        Doudouvet de s’enfuir.
      de: |-
        Wird es angegriffen, verstreut es zur Täuschung
        Watte. Es flieht, während der Gegner nach dem
        wahren Waumboll sucht.
      es: |-
        Despide motas de algodón cuando lo atacan para
        confundir a los enemigos y poner pies en polvorosa.
      it: |-
        Se viene attaccato crea una nuvola di cotone per
        confondere il nemico, poi ne approfitta per fuggire.
    'y':
      ja-Hrkt: |-
        しゅうだんで　いると　おちつくのか
        なかまを　みつけると　くっついて
        いつのまにか　くものように　なる。
      ja: |-
        集団で　いると　落ち着くのか
        仲間を　みつけると　くっついて
        いつのまにか　雲のように　なる。
      ko: |-
        집단으로 있으면 편안한지
        동료를 발견하면 달라붙어
        어느새 구름처럼 된다.
      en: |-
        Perhaps because they feel more at ease in a group,
        they stick to others they find. They end up looking
        like a cloud.
      fr: |-
        Pokémon à l’instinct grégaire, ils se collent les uns
        aux autres et finissent par former un gros nuage.
      de: |-
        Sind sie mit Freunden unterwegs, hängen sie eng
        aufeinander wie Wolken, wohl weil sie sich in der
        Gruppe sicherer fühlen.
      es: |-
        Quizá por el hecho de que se relajan al estar con
        los suyos, forman un grupo al encontrar amigos y
        parecen nubes.
      it: |-
        Si sentono più sicuri in gruppo, e quando incontrano
        i loro simili non li lasciano più formando come una
        grande nuvola.
    omega-ruby:
      ja-Hrkt: |-
        おそわれると　からだから　わたを
        とばす。てきが　わたを　モンメンと
        まちがえている　すきに　にげるのだ。
      ja: |-
        襲われると　体から　綿を　飛ばす。
        敵が　綿を　モンメンと
        間違えている　すきに　逃げるのだ。
      ko: |-
        공격당하면 몸에서 솜을
        날린다. 상대가 솜을 소미안으로
        착각하고 있는 동안 도망친다.
      en: |-
        When attacked, it escapes by shooting cotton from
        its body. The cotton serves as a decoy to distract
        the attacker.
      fr: |-
        Si on l’attaque, il projette un nuage de coton.
        L’ennemi le confond avec lui, ce qui permet à
        Doudouvet de s’enfuir.
      de: |-
        Wird es angegriffen, verstreut es zur Täuschung Watte.
        Es flieht, während der Gegner nach dem wahren Waumboll
        sucht.
      es: |-
        Despide motas de algodón cuando lo atacan para confundir a
        los enemigos y poner pies en polvorosa.
      it: |-
        Se viene attaccato crea una nuvola di cotone per confondere
        il nemico, poi ne approfitta per fuggire.
    alpha-sapphire:
      ja-Hrkt: |-
        しゅうだんで　いると　おちつくのか
        なかまを　みつけると　くっついて
        いつのまにか　くものように　なる。
      ja: |-
        集団で　いると　落ち着くのか
        仲間を　みつけると　くっついて
        いつのまにか　雲のように　なる。
      ko: |-
        집단으로 있으면 편안한지
        동료를 발견하면 달라붙어
        어느새 구름처럼 된다.
      en: |-
        Perhaps because they feel more at ease in a group,
        they stick to others they find. They end up looking
        like a cloud.
      fr: |-
        Pokémon à l’instinct grégaire, ils se collent les uns aux autres
        et finissent par former un gros nuage.
      de: |-
        Sind sie mit Freunden unterwegs, hängen sie eng aufeinander
        wie Wolken, wohl weil sie sich in der Gruppe sicherer fühlen.
      es: |-
        Quizá por el hecho de que se relajan al estar con los suyos,
        forman un grupo al encontrar amigos y parecen nubes.
      it: |-
        Si sentono più sicuri in gruppo, e quando incontrano i loro
        simili non li lasciano più formando come una grande nuvola.
    sun:
      ja-Hrkt: |-
        なかまを　みつけると　くっつく。
        あまりに　たくさん　くっつきすぎて
        にゅうどうぐも　みたいになることも。
      ja: |-
        仲間を　みつけると　くっつく。
        あまりに　たくさん　くっつきすぎて
        入道雲　みたいになることも。
      ko: |-
        동료를 발견하면 붙는다.
        너무 많이 붙어서
        적란운처럼 되는 일도 있다.
      zh-Hant: |-
        找到夥伴後就會黏過去。
        黏得太多的話，
        有時候看上去就像積雨雲。
      zh-Hans: |-
        找到伙伴后就会贴上去。
        贴得太多的话，
        有时候看上去就像积雨云。
      en: |-
        When it finds others of its kind, they all stick
        together. When enough of them have collected,
        the mass resembles a cumulonimbus cloud.
      fr: |-
        Les Doudouvet se collent entre eux quand ils
        se rencontrent. Lorsqu’ils sont assez nombreux,
        ils forment de véritables cumulonimbus vivants.
      de: |-
        Begegnen sie Freunden, hängen sie eng
        aufeinander. Wenn sich zu viele versammeln,
        sehen sie aus wie eine Gewitterwolke.
      es: |-
        Cuando se encuentran con amigos, se agrupan.
        Si son muchos, a veces pueden llegar a adquirir
        un aspecto semejante al de un cúmulo de nubes.
      it: |-
        Quando si incontrano, i Cottonee si attaccano
        l’uno all’altro. Se sono in tanti, possono formare
        ammassi simili a immense nuvole.
    moon:
      ja-Hrkt: |-
        モンメンの　はく　わたを　つかった
        まくらや　ふとんは　かるくて
        つうきの　よい　こうきゅうひんだ。
      ja: |-
        モンメンの　吐く　綿を　使った
        枕や　布団は　軽くて
        通気の　良い　高級品だ。
      ko: |-
        소미안이 뱉는 솜을 사용한
        베개와 이불은 가볍고
        통기성이 좋은 고급품이다.
      zh-Hant: |-
        使用木棉球吐出的棉花
        製作而成的枕頭和被褥
        是又輕又透氣的高級商品。
      zh-Hans: |-
        使用木棉球吐出的棉花
        制作而成的枕头和被褥
        是又轻又透气的高级商品。
      en: |-
        Pillows and beds stuffed with cotton exhaled
        by Cottonee are soft and puffy, light and airy—
        altogether top quality.
      fr: |-
        Le coton qu’il produit est utilisé dans la
        confection d’oreillers et de couettes de haute
        qualité, qui allient légèreté et fraîcheur.
      de: |-
        Kissen und Bettdecken, die mit Watte von
        Waumboll gefüllt sind, gelten als Artikel von
        hoher Qualität, da sie leicht und luftig sind.
      es: |-
        Los colchones o almohadas rellenos del algodón
        que suelta Cottonee son un producto de alta
        calidad por su ligereza y transpirabilidad.
      it: |-
        Il cotone prodotto da Cottonee viene usato
        per cuscini e materassi leggeri, traspiranti
        e di ottima qualità.
    ultra-sun:
      ja-Hrkt: |-
        わたを　とばして　みを　まもる。
        あめに　ぬれると　わたが　しめって
        おもくなり　みうごきが　とれなくなる。
      ja: |-
        綿を　飛ばして　身を　守る。
        雨に　濡れると　綿が　湿って
        重くなり　身動きが　とれなくなる。
      ko: |-
        솜을 날려 몸을 지킨다.
        비에 젖으면 솜이 축축하고
        무거워져 움직일 수 없게 된다.
      zh-Hant: |-
        會撒出棉花保護自己。
        如果淋到雨，棉花就會受潮變重，
        讓牠的身體動彈不得。
      zh-Hans: |-
        会喷出棉花保护身体。
        如果淋到雨，棉花就会受潮变重，
        身体变得动弹不得。
      en: |-
        To protect itself, it shoots cotton from its body.
        When it gets wet in the rain, its cotton grows
        moist and heavy, and it can’t move as well.
      fr: |-
        Il projette un nuage de coton pour se protéger.
        Quand il pleut, son coton s’imbibe d’eau et
        le rend si lourd qu’il est incapable de bouger.
      de: |-
        Es schützt sich, indem es Watte verstreut.
        Wird es Regen ausgesetzt, saugt es sich voll
        und wird zu schwer, um sich zu bewegen.
      es: |-
        Lanza bolas de algodón como defensa. Cuando
        llueve y se moja, se vuelve tan pesado que le
        resulta difícil moverse.
      it: |-
        Si difende creando una nuvola di cotone.
        Quando piove, il cotone si appesantisce
        per l’umidità impedendogli di muoversi.
    ultra-moon:
      ja-Hrkt: |-
        おそわれると　からだの　ワタを
        とばして　おとりにする。　とばした
        ワタは　また　すぐに　はえてくるぞ。
      ja: |-
        襲われると　身体の　ワタを
        飛ばして　おとりにする。　飛ばした
        ワタは　また　すぐに　生えてくるぞ。
      ko: |-
        공격당하면 몸에 있는 솜을
        날려 미끼로 쓴다. 날린 솜은
        또 금방 자라난다.
      zh-Hant: |-
        遭到襲擊時，會噴出身上的
        棉花當成替身。噴出的棉花
        很快就會長回來。
      zh-Hans: |-
        一旦被袭击，就会喷出
        身上的棉花来代替自己的身体。
        喷出的棉花很快又会长出来。
      en: |-
        When attacked, it expels cotton from its
        body to create a diversion. The cotton it loses
        grows back in quickly.
      fr: |-
        Lorsqu’on l’attaque, il sème du coton pour faire
        diversion. Celui-ci repousse tout de suite.
      de: |-
        Wird es angegriffen, verstreut es zur Täuschung
        Watte, die es von seinem Körper nimmt. Die
        verbrauchte Watte wächst sofort wieder nach.
      es: |-
        Cuando lo atacan despide bolas de algodón a
        modo de señuelo. Estas, sin embargo, vuelven a
        crecer enseguida.
      it: |-
        Se viene attaccato, crea una nuvola di cotone
        come diversivo. Il cotone consumato a questo
        scopo ricresce immediatamente.
    sword:
      ja-Hrkt: |-
        ワタを　とばして　みを　まもる。
        たいふうの　かぜに　ながされ
        ちきゅうの　うらがわに　いくことも。
      ja: |-
        綿を　飛ばして　身を　守る。
        台風の　風に　流され
        地球の　裏側に　いくことも。
      ko: |-
        솜을 날려 몸을 지킨다.
        태풍의 바람에 휩쓸려
        지구 반대편까지 갈 때도 있다.
      zh-Hant: |-
        會噴出棉花保護身體。
        有時會被颱風吹到
        地球的另一邊。
      zh-Hans: |-
        会喷出棉花保护身体。
        有时会被台风吹到
        地球的另一边。
      en: |-
        It shoots cotton from its body to protect itself.
        If it gets caught up in hurricane-strength winds,
        it can get sent to the other side of the Earth.
      fr: |-
        Il sème du coton pour se protéger. Il lui arrive
        d’être emporté par une tempête à l’autre bout
        du monde.
      de: |-
        Sie schützen sich, indem sie Watte verstreuen.
        Manche werden vom Wind bis ans andere Ende
        der Welt getragen.
      es: |-
        Lanza bolas de algodón para defenderse. A
        veces, la fuerza de un tifón llega a arrastrarlo
        hasta el otro extremo del mundo.
      it: |-
        Si difende creando una nuvola di cotone.
        A volte viene trasportato fino all’altro capo
        del mondo dai tifoni.
    shield:
      ja-Hrkt: |-
        モンメンと　ワタシラガの　ワタを
        まぜて　おった　きじは　うつくしく
        こうきゅうブランドで　つかわれる。
      ja: |-
        モンメンと　ワタシラガの　綿を
        混ぜて　織った　生地は　美しく
        高級ブランドで　使われる。
      ko: |-
        소미안과 백솜모카의 솜을
        섞어 짠 천은 아름다워서
        고급 브랜드에 사용된다.
      zh-Hant: |-
        將木棉球和白蓬蓬的棉花
        混合後編織出的布料極其精緻，
        因此常被高級品牌選用。
      zh-Hans: |-
        将木棉球和白蓬蓬的棉花
        混合后编织出的布料极其精致，
        因此常被高级品牌选用。
      en: |-
        Weaving together the cotton of both Cottonee
        and Eldegoss produces exquisite cloth that’s
        highly prized by many luxury brands.
      fr: |-
        Les marques de luxe utilisent les étoffes
        splendides issues du mélange des cotons
        de Doudouvet et de Blancoton.
      de: |-
        Luxusmarken verwenden oft feine Stoffe, die aus
        Mischwolle von Waumboll und Cottomi
        bestehen, für ihre Produkte.
      es: |-
        Combinando los algodones de los Cottonee y
        Eldegoss se obtiene una tela exquisita, que usan
        las marcas más exclusivas.
      it: |-
        Le case di alta moda utilizzano pregiati tessuti
        realizzati con il cotone prodotto da Cottonee
        ed Eldegoss.
