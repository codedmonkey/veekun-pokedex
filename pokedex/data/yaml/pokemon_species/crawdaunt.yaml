        Pokémon hors de sa mare.
    black-2:
      en: |-
        Loving to battle, this Pokémon pinches
        all Pokémon that enter its territory
        with its pincers and throws them out.
    white-2:
      en: |-
        Loving to battle, this Pokémon pinches
        all Pokémon that enter its territory
        with its pincers and throws them out.
    x:
      ja-Hrkt: |-
        いけに　すむ　ほかの　ポケモンを
        ハサミで　つまみあげ　いけの　そとへ
        ほうりだしてしまう　あばれんぼう。
      ja: |-
        池に　住む　ほかの　ポケモンを
        ハサミで　つまみ上げ　池の　外へ
        放り出してしまう　暴れん坊。
      ko: |-
        연못에 사는 다른 포켓몬을
        집게로 집어들어 연못 밖으로
        내던져버리는 난동꾼이다.
      en: |-
        It is a ruffian that uses its pincers to pick up and
        toss out other Pokémon from its pond.
      fr: |-
        C’est un voyou qui utilise ses pinces pour chasser
        les autres Pokémon hors de sa mare.
      de: |-
        Dieser Grobian ergreift andere Pokémon mit seinen
        Scheren und wirft sie aus seinem Teich.
      es: |-
        Este malandrín usa sus pinzas para atosigar y expulsar
        a los otros Pokémon que viven en su estanque.
      it: |-
        Pokémon violento che afferra il nemico con le chele
        e lo scaraventa fuori dal suo stagno.
    'y':
      ja-Hrkt: |-
        こうせんてきな　ポケモンで　じぶんの
        なわばりから　あらゆる　ポケモンを
        ハサミで　つまんで　なげとばすぞ！
      ja: |-
        好戦的な　ポケモンで　自分の
        縄張りから　あらゆる　ポケモンを
        ハサミで　つまんで　投げ飛ばすぞ！
      ko: |-
        호전적인 포켓몬으로 자신의
        영역에서 모든 포켓몬을
        집게로 집어서 내던진다!
      en: |-
        Loving to battle, this Pokémon pinches all Pokémon
        that enter its territory with its pincers and throws
        them out.
      fr: |-
        C’est un voyou qui utilise ses pinces pour chasser
        les autres Pokémon hors de son territoire.
      de: |-
        Dieses rauflustige Pokémon nimmt Eindringlinge
        mit seinen Scheren in die Zange und wirft sie aus
        seinem Revier.
      es: |-
        De naturaleza violenta. Si un Pokémon se aventura
        en su territorio, lo agarra con sus tenazas y lo arroja
        por los aires.
      it: |-
        È un Pokémon molto bellicoso che afferra con le
        chele chiunque osi entrare nel suo territorio per
        scaraventarlo fuori.
    omega-ruby:
      ja-Hrkt: |-
        すぐに　たたかいを　いどむ　きしょうの　あらさ。
        シザリガーの　すむ　いけには　ほかの　いきものが
        すみつかず　さみしい　ばしょに　なってしまう。
      ja: |-
        すぐに　戦いを　挑む　気性の　荒さ。
        シザリガーの　すむ　池には　他の　生き物が
        すみつかず　寂しい　場所に　なってしまう。
      ko: |-
        천성이 거칠어서 바로 싸움을 건다.
        가재장군이 사는 연못에는 다른 생물이
        살 수 없어 쓸쓸한 장소가 돼버린다.
      en: |-
        Crawdaunt has an extremely violent nature that compels it to
        challenge other living things to battle. Other life-forms refuse
        to live in ponds inhabited by this Pokémon, making them
        desolate places.
      fr: |-
        Colhomard a un tempérament très violent, ce qui le pousse
        à défier tout ce qui passe près de lui. Certaines formes de vie
        refusent d’habiter dans les étangs occupés par ce Pokémon
        et désertent ces eaux.
      de: |-
        Krebutack ist von Natur aus sehr gewalttätig, sodass es
        dauernd andere Lebewesen zum Kampf herausfordern muss.
        Andere Lebensformen lehnen es ab, mit diesem Pokémon
        in ein und demselben Teich zu leben.
      es: |-
        Crawdaunt es de una naturaleza extremadamente violenta que
        le lleva a desafiar a otros seres vivos. Hay formas de vida que
        se niegan a vivir en los estanques donde habitan estos
        Pokémon, y los dejan medio vacíos.
      it: |-
        Crawdaunt, dalla natura estremamente violenta, sfida sempre
        a una lotta gli altri esseri viventi, che per questo motivo
        abbandonano i laghi abitati da questo Pokémon, lasciandoli
        deserti e desolati.
    alpha-sapphire:
      ja-Hrkt: |-
        だっぴした　ちょくごは　こうらが　やわらかい。
        こうらが　かたくなるまで　てきの　こうげきを
        さけるため　かわぞこの　あなに　かくれている。
      ja: |-
        脱皮した　直後は　甲羅が　柔らかい。
        甲羅が　硬くなるまで　敵の　攻撃を
        避けるため　川底の　穴に　隠れている。
      ko: |-
        탈피한 직후에는 껍질이 부드럽다.
        껍질이 단단해질 때까지 적의 공격을
        피하고자 강바닥의 구멍에 숨어 있다.
      en: |-
        Crawdaunt molts (sheds) its shell regularly. Immediately after
        molting, its shell is soft and tender. Until the shell hardens,
        this Pokémon hides in its streambed burrow to avoid attack
        from its foes.
      fr: |-
        Colhomard mue et perd sa carapace régulièrement.
        Immédiatement après sa mue, sa nouvelle carapace est tendre
        et molle. Il s’enterre au fond des cours d’eau pour ne pas
        être attaqué avant que sa carapace ne soit assez dure.
      de: |-
        Krebutack legt seine Schale regelmäßig ab. Direkt danach
        ist seine Schale weich und empfindlich. Bis sie gehärtet ist,
        sucht es sich ein Versteck in einem Flussbett, damit es nicht
        von Gegnern angegriffen wird.
      es: |-
        Crawdaunt muda el caparazón regularmente y, en cuanto lo
        hace, se le queda la piel tersa y suave. Mientras el nuevo
        caparazón se endurece, permanece escondido en su
        madriguera para que no le ataquen.
      it: |-
        Crawdaunt muta regolarmente la corazza. Subito dopo la muta,
        la nuova corazza è tenera e delicata. Finché non si è indurita
        totalmente, il Pokémon vive nascosto nella sua tana sott’acqua
        per evitare attacchi.
    ultra-sun:
      ja-Hrkt: |-
        きしょうがあらく　ケンカを　このむが
        ハサミが　もげると　とたんによわき。
        さいせいするまで　ビクビクしている。
      ja: |-
        気性が　荒く　ケンカを　好むが
        ハサミが　もげると　途端に弱気。
        再生するまで　ビクビクしている。
      ko: |-
        기질이 거칠고 싸움을 좋아하지만,
        집게가 떨어지면 바로 약해진다.
        재생될 때까지 벌벌 떤다.
      zh-Hant: |-
        性情粗暴愛打架，然而一旦
        鉗子掉落就會馬上變得軟弱，
        在重新長出之前都會提心吊膽。
      zh-Hans: |-
        性格暴躁，喜欢打架，
        但如果钳子掉落，就会一下子弱下来。
        在再生之前，都会提心吊胆的。
      en: |-
        Its temperament is rough and it loves to fight,
        but as soon as its pincers break off, it turns
        cowardly. It stays timid until they grow back.
      fr: |-
        D’un tempérament fougueux, il adore se battre,
        mais perd tout courage si ses pinces tombent.
        Il n’attend alors qu’une chose : leur repousse !
      de: |-
        Es ist ungestüm und liebt Kämpfe, doch sobald
        es seine Scheren verliert, wird es mutlos. Bis sie
        nachgewachsen sind, zittert es vor Angst.
      es: |-
        Su carácter agresivo le incita a pelear siempre
        que puede, pero si se le rompe una pinza se
        amedrenta y acobarda hasta que se le regenera.
      it: |-
        Ha una natura estremamente violenta e ama
        le lotte, ma quando gli cadono le chele perde
        tutto il suo coraggio finché non ricrescono.
    ultra-moon:
      ja-Hrkt: |-
        よく　ハサミが　もげる。　ハサミの
        なかみは　マケンカニや　ウデッポウと
        ちがって　ドロくさく　じつにまずい。
      ja: |-
        よく　ハサミが　もげる。　ハサミの
        中身は　マケンカニや　ウデッポウと
        違って　ドロ臭く　実に不味い。
      ko: |-
        자주 집게가 떨어진다. 집게의
        속살은 오기지게나 완철포와 달리
        흙내가 나고 정말 맛없다.
      zh-Hant: |-
        鉗子經常脫落。與好勝蟹還有
        鐵臂槍蝦不同，鉗子裡頭的肉
        帶有泥臭味所以很難吃。
      zh-Hans: |-
        钳子经常会掉。钳子里面
        跟好胜蟹和铁臂枪虾不同，
        有臭泥味，实在很难吃。
      en: |-
        Its pincers often fall off. Unlike with Crabrawler
        or Clauncher, the meat in its claws is utterly
        nasty and stinking.
      fr: |-
        Ses pinces tombent facilement, mais sa chair
        est poisseuse et dégoûtante, contrairement
        à celle de Crabagarre et de Flingouste.
      de: |-
        Es verliert oft seine Scheren. Anders als bei
        Krabbox und Scampisto ist das Innere der
        Scheren unappetitlich und stinkt.
      es: |-
        Pierde las pinzas fácilmente. Al contrario que las
        de Crabrawler o Clauncher, su carne apesta a
        lodo y tiene un sabor desagradable.
      it: |-
        Spesso perde le chele, ma la polpa all’interno,
        a differenza delle chele dei Crabrawler e dei
        Clauncher, ha uno sgradevole sapore di terra.
    sword:
      ja-Hrkt: |-
        きょだいな　ハサミを　ふりまわす
        あばれもの。　そだてるのが　とても
        むずかしい　ポケモンと　いわれる。
      ja: |-
        巨大な　ハサミを　振りまわす
        暴れ者。　育てるのが　とても
        難しい　ポケモンと　いわれる。
      ko: |-
        거대한 집게를 휘두르는
        난폭한 포켓몬. 키우는 것이
        매우 어렵다고 전해진다.
      zh-Hant: |-
        不停揮舞自己巨大的鉗子，
        是個性情粗暴的傢伙。
        被認為是很難培育的寶可夢。
      zh-Hans: |-
        不停挥舞自己巨大的钳子，
        是个性格粗暴的家伙。
        被认为是很难培育的宝可梦。
      en: |-
        A rough customer that wildly flails its giant claws.
        It is said to be extremely hard to raise.
      fr: |-
        Ce Pokémon très coriace agite tout le temps
        ses énormes pinces. Il faut beaucoup de patience
        pour le dresser.
      de: |-
        Ein grobes Pokémon, das mit seinen riesigen
        Scheren wild um sich schlägt. Man sagt, dass es
        sehr schwer zu trainieren sei.
      es: |-
        Esta violenta criatura agita de forma salvaje las
        gigantes pinzas que tiene. Dicen que es muy
        difícil criarlo.
      it: |-
        Pokémon violento che flagella il nemico con
        le sue chele affilate. Sembra che sia molto
        difficile allenarlo.
    shield:
      ja-Hrkt: |-
        たたかいを　このむ　せいかく。
        すみかに　ちかづく　あいてを
        ようしゃなく　たたきのめす。
      ja: |-
        戦いを　好む　性格。
        すみかに　近づく　相手を
        容赦なく　叩きのめす。
      ko: |-
        싸움을 좋아하는 성격.
        거처에 가까이 오는 상대를
        가차 없이 때려눕힌다.
      zh-Hant: |-
        有著熱愛戰鬥的性格。
        當遇到靠近自己領地的對手，
        會毫不留情地將之打倒。
      zh-Hans: |-
        有着热爱战斗的性格。
        当遇到靠近自己领地的对手，
        会毫不留情地将之打倒。
      en: |-
        A brutish Pokémon that loves to battle. It will
        crash itself into any foe that approaches its nest.
      fr: |-
        Il adore se battre et frappe comme une brute
        tous ceux qui approchent de sa mare.
      de: |-
        Es ist sehr rauflustig. Nähert sich ein Gegner
        seinem Unterschlupf, geht es gnadenlos auf
        ihn los.
      es: |-
        Le encanta pelear, debido a su naturaleza. Si
        alguien se acerca a su madriguera, le propinará
        una paliza sin ningún tipo de miramiento.
      it: |-
        Ama la lotta. Il malcapitato che si avvicina
        alla sua tana verrà brutalmente malmenato.
