    sun:
      ja-Hrkt: |-
        まえばは　しぬまで　のびつづけるので
        メンテナンスが　ひつよう。　ヤスリを
        よういしないと　はしらを　かじられる。
      ja: |-
        前歯は　死ぬまで　伸び続けるので
        メンテナンスが　必要。　ヤスリを
        用意しないと　柱を　かじられる。
      ko: |-
        앞니는 죽을 때까지 계속 자라기 때문에
        관리가 필요하다. 이갈이 용품을
        준비하지 않으면 기둥을 갉는다.
      zh-Hant: |-
        門牙會終生生長，所以要隨時保養。
        不幫牠準備好銼刀的話，
        牠就會去咬柱子來磨牙。
      zh-Hans: |-
        门牙会终生生长，所以必须要保养。
        不准备好锉刀的话，会把柱子都啃掉。
      en: |-
        Its incisors continue growing until its death.
        If its Trainer doesn’t offer it a file to gnaw on, it
        will gnaw on door frames, table legs, and so on.
      fr: |-
        Il doit toujours prendre soin de ses incisives
        car elles poussent sans arrêt. S’il n’a rien pour
        les limer, il se rabattra sur un pilier.
      de: |-
        Seine Nagezähne benötigen ständige Pflege, da
        sie sein ganzes Leben lang wachsen. Steht kein
        Nagestein zur Verfügung, knabbert es an Holz.
      es: |-
        Debe cuidar regularmente sus incisivos, pues
        estos siguen creciendo hasta que muere. Si no
        tiene nada con qué afilarlos, suele roer pilares.
      it: |-
        I suoi incisivi non smettono mai di crescere e
        richiedono continue cure. Se non gli viene data
        una lima per regolarli, rosicchia i tavoli o altro.
    moon:
      ja-Hrkt: |-
        せいめいりょくが　つよく　きたない
        ばしょでも　へいきで　くらす。
        ほっておくと　どんどん　ふえていく。
      ja: |-
        生命力が　強く　汚い
        場所でも　平気で　暮らす。
        ほっておくと　どんどん　増えていく。
      ko: |-
        생명력이 강해서 더러운
        곳에서도 사는데 문제없다.
        내버려두면 점점 수가 불어난다.
      zh-Hant: |-
        生命力很強，
        即使在骯髒的地方也能安然生活。
        放任不管的話會不停繁殖。
      zh-Hans: |-
        生命力很强，
        即使在肮脏的地方也能坦然生活。
        放任不管的话会不停繁殖。
      en: |-
        With their strong capacity for survival, they can
        live in dirty places without concern. Left
        unchecked, their numbers multiply rapidly.
      fr: |-
        Un Pokémon très résistant, capable de survivre
        même dans des milieux très insalubres.
        Il prolifère si l’on n’y prend pas garde.
      de: |-
        Sie strotzen vor Lebenskraft und können selbst
        an schmutzigen Orten problemlos überleben.
        Bleiben sie ungestört, vermehren sie sich rasch.
      es: |-
        Su gran resistencia le permite vivir en los
        lugares más insalubres. Su población puede
        crecer rápidamente.
      it: |-
        La sua straordinaria resistenza gli permette di
        adattarsi anche ad habitat insalubri. Se lasciato
        indisturbato, si riproduce in gran numero.
    ultra-sun:
      ja-Hrkt: |-
        いっしょう　まえばが　のびつづける。
        あまりに　のびすぎると　エサが
        たべられなくなって　がし　する。
      ja: |-
        一生　前歯が　伸び続ける。
        あまりに　伸びすぎると　エサが
        食べられなくなって　餓死　する。
      ko: |-
        평생 앞니가 계속 자란다.
        너무 많이 자라면 먹이를
        먹을 수 없어 굶어 죽는다.
      zh-Hant: |-
        門牙會終生生長，
        如果長得太長，
        就會因為無法進食而餓死。
      zh-Hans: |-
        门牙会终生生长。
        但要是长得太长，
        就会因无法进食而饿死。
      en: |-
        Its incisors grow continuously throughout its life.
        If its incisors get too long, this Pokémon
        becomes unable to eat, and it starves to death.
      fr: |-
        Ses incisives poussent tout au long de sa vie.
        Si elles dépassent une certaine longueur,
        il ne peut plus s’alimenter et meurt de faim.
      de: |-
        Seine Nagezähne wachsen sein ganzes Leben
        über. Werden sie allzu lang, kann es damit nicht
        mehr fressen und verhungert.
      es: |-
        Sus incisivos crecen durante toda su vida. Si
        aumentan demasiado de tamaño, no puede
        alimentarse y muere de inanición.
      it: |-
        I suoi incisivi continuano a crescere per tutta
        la vita. Se si allungano troppo, non riesce più
        a nutrirsi e muore di fame.
    ultra-moon:
      ja-Hrkt: |-
        ありふれた　ポケモンだが　ちゅうい。
        するどい　まえばは　かたい
        ざいもくさえ　かんたんに　へしおる。
      ja: |-
        ありふれた　ポケモンだが　注意。
        鋭い　前歯は　堅い
        材木さえ　簡単に　へしおる。
      ko: |-
        흔한 포켓몬이지만 주의해야 한다.
        날카로운 앞니는 단단한 나무도
        간단하게 부러뜨린다.
      zh-Hant: |-
        雖然是常見的寶可夢，但還是要小心。
        銳利的門牙十分堅硬，
        就連木材也能輕易咬斷。
      zh-Hans: |-
        虽是常见的宝可梦，但也不能掉以轻心。
        锋利的门牙甚至连坚硬的
        木材都能轻易咬断。
      en: |-
        This Pokémon is common but hazardous. Its
        sharp incisors can easily cut right through
        hard wood.
      fr: |-
        Prenez garde à ce Pokémon très répandu :
        ses puissantes incisives sont si acérées
        qu’elles peuvent couper des troncs d’arbre.
      de: |-
        Ein weitverbreitetes Pokémon, das nicht ganz
        ungefährlich ist. Selbst hartes Holz zerkleinert
        es mit seinen scharfen Nagezähnen mühelos.
      es: |-
        Un Pokémon muy extendido con el que conviene
        tener cuidado ya que sus afilados incisivos son
        capaces de roer maderas nobles sin problema.
      it: |-
        È un Pokémon molto comune con il quale è
        meglio fare attenzione: con i suoi incisivi affilati
        può tranciare anche un’asse di legno durissimo.
    lets-go-pikachu:
      ja-Hrkt: |-
        キバが２つ。とにかく　なんでも
        かじってみる。１ぴき　みつけたら
        ４０ぴきは　そこに　すんでるはず。
      ja: |-
        キバが２つ。とにかく　なんでも
        かじってみる。１匹　見つけたら
        ４０匹は　そこに　住んでるはず。
      ko: |-
        2개의 이빨로 뭐든지 일단
        갉고 본다. 1마리를 발견했다면
        그곳에 40마리는 살고 있을 것이다.
      zh-Hant: |-
        長著２顆大牙，碰到什麼都會
        先咬上一口。只要看見１隻出沒，
        附近肯定還住著40隻以上。
      zh-Hans: |-
        有两颗大门牙，见什么咬什么。
        只要看到１只小拉达出没，
        附近肯定还住着40只以上。
      en: |-
        Will chew on anything with its fangs. If you
        see one, you can be certain that 40 more
        live in the area.
      fr: |-
        Il peut ronger n’importe quoi avec ses
        deux dents. Quand on en voit un, il y en
        a certainement 40 dans le coin.
      de: |-
        Es knabbert mit seinen zwei Nagezähnen alles
        und jeden an. Stößt man auf eines, findet man
        sicherlich 40 weitere in der Gegend.
      es: |-
        Es propenso a hincar los incisivos en cualquier
        cosa que se le ponga por delante. Si se ve
        alguno, seguramente haya cuarenta cerca.
      it: |-
        Con i suoi incisivi rode qualsiasi cosa.
        Se se ne avvista uno, è probabile che
        in zona vivano almeno 40 esemplari.
    lets-go-eevee:
      ja-Hrkt: |-
        キバが２つ。とにかく　なんでも
