    black-2:
      en: |-
        It searches for food all day. It gnaws
        on hard objects to wear down its fangs,
        which grow constantly during its lifetime.
    white-2:
      en: |-
        It searches for food all day. It gnaws
        on hard objects to wear down its fangs,
        which grow constantly during its lifetime.
    x:
      ja-Hrkt: |-
        たべるものが　あるところなら
        どこにだって　せいそくする。
        １にちじゅう　エサを　さがしている。
      ja: |-
        食べるものが　あるところなら
        どこにだって　生息する。
        １日中　エサを　探している。
      ko: |-
        먹을 것이 있는 곳이라면
        어디서든 서식한다.
        온종일 먹이를 찾아다닌다.
      en: |-
        Living wherever there is food available,
        it ceaselessly scavenges for edibles
        the entire day.
      fr: |-
        Vivant là où se trouve la nourriture, ce charognard
        passe ses journées à la rechercher.
      de: |-
        Es baut sein Nest, wo es Futter findet. Es ist den
        ganzen Tag auf der Suche nach etwas Essbarem.
      es: |-
        Vive allí donde haya comida disponible. Busca todo
        el día, sin descanso, algo comestible.
      it: |-
        Vive ovunque si trovi del cibo, cercando
        incessantemente qualsiasi cosa sia commestibile.
    'y':
      ja-Hrkt: |-
        キバは　ながくて　するどい。
        いっしょう　のびつづけるので
        かたい　モノを　かじって　けずる。
      ja: |-
        キバは　長くて　鋭い。
        一生　伸び続けるので
        硬い　ものを　かじって　削る。
      ko: |-
        송곳니는 길고 날카롭다.
        평생 자라나기 때문에
        단단한 것을 갉아서 깎는다.
      en: |-
        Its fangs are long and very sharp. They grow
        continuously, so it gnaws on hard things to whittle
        them down.
      fr: |-
        Les dents de Rattata sont longues et tranchantes.
        Comme elles poussent sans arrêt, il doit ronger tout
        ce qu’il trouve pour pouvoir les tailler.
      de: |-
        Seine Reißzähne sind lang und scharf. Da sie
        ständig wachsen, nagt es immerzu an etwas,
        um sie abzuwetzen.
      es: |-
        Tiene unos largos y afilados colmillos que no dejan de
        crecer. Le resultan muy útiles para destruir cosas.
      it: |-
        I denti affilati gli continuano a crescere, costringendolo
        a limarseli mordicchiando oggetti molto duri.
    omega-ruby:
      ja-Hrkt: |-
        けいかいしんが　とても　つよく　ねている　ときも
        みみを　うごかし　まわりの　おとを　きいている。
        どこにでも　すみつき　す　を　つくる。
      ja: |-
        警戒心が　とても　強く　寝ている　ときも
        耳を　動かし　周りの　音を　聞いている。
        どこにでも　すみつき　巣　を　つくる。
      ko: |-
        경계심이 매우 강해서 자고 있을 때도
        귀를 움직여 주변의 소리를 듣고 있다.
        어디에든 자리를 잡고 둥지를 만든다.
      en: |-
        Rattata is cautious in the extreme. Even while it is asleep,
        it constantly listens by moving its ears around. It is not picky
        about where it lives—it will make its nest anywhere.
      fr: |-
        Rattata est extrêmement prudent. Même lorsqu’il est endormi,
        il fait pivoter ses oreilles pour écouter autour de lui.
        En ce qui concerne son habitat, il n’est vraiment pas difficile.
        Il peut faire son nid n’importe où.
      de: |-
        Rattfratz ist extrem vorsichtig. Sogar im Schlaf nimmt es
        alles wahr, indem es seine Ohren bewegt. Es stellt keine
        großen Ansprüche an seinen Lebensraum und richtet sein
        Nest überall ein.
      es: |-
        Rattata es cauto como él solo. Hasta cuando duerme mueve
        las orejas para oír todos los ruidos. No es nada delicado a
        la hora de elegir su hábitat. Cualquier sitio es bueno para
        cavar su madriguera.
      it: |-
        Rattata è estremamente cauto. Anche quando dorme tiene
        sempre le orecchie tese, muovendole come sonde. Non ha
        particolari esigenze di habitat: costruisce la propria tana
        ovunque.
    alpha-sapphire:
