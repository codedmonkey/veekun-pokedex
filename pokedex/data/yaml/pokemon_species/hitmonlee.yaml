    sword:
      ja-Hrkt: |-
        みごとな　バランスかんかく。
        どんな　しせいでも　れんぞくで
        キックを　はなてる　すごい　やつ。
      ja: |-
        見事な　バランス感覚。
        どんな　姿勢でも　連続で
        キックを　放てる　すごい　やつ。
      ko: |-
        훌륭한 밸런스 감각으로
        어떤 자세라도 연속
        킥을 날리는 대단한 녀석이다.
      zh-Hant: |-
        擁有卓越的平衡感。
        無論處於什麼姿勢都可以
        連續施展踢擊的厲害角色。
      zh-Hans: |-
        拥有卓越的平衡感。
        无论处于什么姿势都可以
        连续施展踢击的厉害角色。
      en: |-
        This amazing Pokémon has an awesome sense of
        balance. It can kick in succession from any position.
      fr: |-
        Il possède un fantastique sens de l’équilibre,
        et peut donner des rafales de coups de pied
        dans toutes les positions.
      de: |-
        Dieses Pokémon besitzt einen formidablen
        Gleichgewichtssinn. Es kann in jeder Position
        pausenlos zutreten.
      es: |-
        Este Pokémon tiene un sentido del equilibrio
        increíble. Puede dar patadas desde cualquier
        posición.
      it: |-
        Questo straordinario Pokémon ha un grande
        equilibrio. Può tirare raffiche di calci da qualsiasi
        posizione.
    shield:
      ja-Hrkt: |-
        あしが　じゆうに　のびちぢみして
        とおく　はなれている　ばあいでも
        あいてを　けりあげることが　できる。
      ja: |-
        脚が　自由に　伸び縮みして
        遠く　離れている　場合でも
        相手を　蹴り上げることが　できる。
      ko: |-
        다리를 자유자재로 늘이고 줄인다.
        상대가 멀리 떨어져 있어도
        다리를 늘여서 차올릴 수 있다.
      zh-Hant: |-
        雙腿能夠自由伸縮，
        即使離得很遠也能
        把對手一腳踢飛。
      zh-Hans: |-
        腿能自由地伸缩，
        即使离得很远，
        也能把对手踢飞。
      en: |-
        The legs freely contract and stretch. The stretchy
        legs allow it to hit a distant foe with a rising kick.
      fr: |-
        Kicklee peut rétracter et étendre ses jambes
        à sa guise. La formidable allonge dont il dispose
        lui permet de frapper des adversaires éloignés.
      de: |-
        Es kann seine Beine nach Belieben ausfahren und
        einziehen und so auch entfernte Gegner treffen.
      es: |-
        Encoge y estira las piernas a su antojo. De hecho,
        hasta puede propinar una patada a un rival que
        se encuentre lejos.
      it: |-
        Può accorciare o allungare le gambe a piacere.
        In questo modo riesce a colpire con i calci anche
        gli avversari distanti.
