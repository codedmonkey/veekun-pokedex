    x:
      ja-Hrkt: |-
        あしが　じゆうに　のびちぢみして
        とおく　はなれている　ばあいでも
        あいてを　けりあげることが　できる。
      ja: |-
        脚が　自由に　伸び縮みして
        遠く　離れている　場合でも
        相手を　蹴り上げることができる。
      ko: |-
        다리를 자유자재로 늘였다 줄였다 한다.
        멀리 떨어져 있을 때도
        상대를 차올릴 수 있다.
      en: |-
        The legs freely contract and stretch. The stretchy
        legs allow it to hit a distant foe with a rising kick.
      fr: |-
        Kicklee peut rétracter et allonger ses jambes à sa
        guise. La formidable allonge dont il dispose lui donne
        souvent l’avantage en plein combat.
      de: |-
        Die Beine ziehen und strecken sich unabhängig
        voneinander. Mit seinen dehnbaren Beinen
        kann es einen entfernten Gegner treffen.
      es: |-
        Encoge y estira las patas a su antojo. Cuando las
        estira, es capaz de propinar una buena patada al
        enemigo.
      it: |-
        Le zampe gli si accorciano e allungano a piacere.
        Con le gambe allungate, con un calcio può colpire
        anche nemici distanti.
    'y':
      ja-Hrkt: |-
        れんぞくで　キックを　はなつうちに
        りょうあしは　どんどん　のびて
        にげだそうとする　あいても　けれる。
      ja: |-
        連続で　キックを　放つうちに
        両足は　どんどん　伸びて
        逃げ出そうとする　相手も　蹴れる。
      ko: |-
        연속으로 킥을 하는 동안
        양쪽 다리는 점점 길어져서
        도망치려고 하는 상대도 걷어찬다.
      en: |-
        If it starts kicking repeatedly, both legs will stretch
        even longer to strike a fleeing foe.
      fr: |-
        S’il commence à donner des séries de coups de pied,
        ses jambes grandissent et il gagne en allonge.
      de: |-
        Wenn es anfängt pausenlos zu treten, kann es seine
        Beine ausfahren, um fliehende Feinde zu treffen.
      es: |-
        Si empieza a dar patadas, sus patas se alargarán aún
        más para golpear al enemigo en su huida.
      it: |-
        Se parte con una scarica di colpi, le gambe possono
        farsi ancora più lunghe per colpire un nemico in fuga.
    omega-ruby:
      ja-Hrkt: |-
        じざいに　のびちぢみする　あしで　きょうれつな
        キックを　はなち　あいてを　けりたおす。
        たたかいの　あと　つかれた　あしを　もみほぐす。
      ja: |-
        自在に　伸び縮みする　足で　強烈な
        キックを　放ち　相手を　蹴り倒す。
        戦いの　後　疲れた　足を　もみ解す。
      ko: |-
        자유롭게 신축되는 다리로 강렬한
        킥을 날려 상대를 발로 차 쓰러트린다.
        싸운 뒤에 지친 다리를 주물러 풀어준다.
      en: |-
        Hitmonlee’s legs freely contract and stretch. Using these
        springlike legs, it bowls over foes with devastating kicks.
        After battle, it rubs down its legs and loosens the muscles to
        overcome fatigue.
      fr: |-
        Les jambes de Kicklee peuvent se contracter et s’étirer
        à volonté. Grâce à ces jambes à ressort, il terrasse ses
        ennemis en les rouant de coups de pied. Après les combats,
        il masse ses jambes pour éviter de sentir la fatigue.
      de: |-
        Kicklee kann seine Beine ausfahren und einziehen. Es verblüfft
        seine Gegner mit brutalen Tritten. Nach einem Kampf massiert
        es seine Beine und lockert die Muskeln, um der Erschöpfung
        vorzubeugen.
      es: |-
        Hitmonlee tiene la facilidad de encoger y estirar las patas.
        Con extremidades tan flexibles, propina unas patadas
        demoledoras. Tras la lucha, se masajea las piernas y relaja
        los músculos para descansar.
      it: |-
        Le zampe di Hitmonlee sono estremamente elastiche.
        Usandole a mo’ di molla, si scaglia sul nemico con calci
        rovinosi. Dopo la lotta si strofina le zampe e scioglie i
        muscoli per recuperare le forze.
    alpha-sapphire:
      ja-Hrkt: |-
        じざいに　のびちぢみする　あしで　きょうれつな
        キックを　はなち　あいてを　けりたおす。
