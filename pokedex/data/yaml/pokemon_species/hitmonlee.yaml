    lets-go-pikachu:
      ja-Hrkt: |-
        キックがあたる　しゅんかん！
        あしのウラが　ダイヤモンドのように
        かたくなって　あいてを　はかいする。
      ja: |-
        キックがあたる　瞬間！
        足のウラが　ダイヤモンドのように
        硬くなって　相手を　破壊する。
      ko: |-
        킥이 명중하는 순간!
        발바닥이 다이아몬드처럼
        단단해져서 상대를 파괴한다.
      zh-Hant: |-
        在踢擊命中的瞬間！
        腳底會變得像鑽石般堅硬，
        將對手踢成碎片。
      zh-Hans: |-
        在踢中敌人的瞬间，
        脚底会变得像钻石般坚硬，
        将对手踢成碎片。
      en: |-
        When kicking, the sole of its foot turns as hard
        as a diamond on impact and destroys its enemy.
      fr: |-
        Ses pieds deviennent durs comme le diamant
        quand il donne des coups, pulvérisant ainsi
        ses adversaires.
      de: |-
        Tritt ein Kicklee zu, wird die Unterseite seines
        Fußes im Moment des Aufpralls hart wie ein
        Diamant. So zerschmettert es seinen Gegner.
      es: |-
        La planta de los pies se le vuelve tan dura como
        el diamante al dar patadas a su oponente, hasta
        el punto de aniquilarlo.
      it: |-
        Nel momento in cui il suo calcio colpisce,
        la pianta del piede si fa dura come il diamante
        producendo un impatto devastante.
    lets-go-eevee:
      ja-Hrkt: |-
