dewott:
  base_happiness: 70
  capture_rate: 45
  color: blue
  egg_groups:
    - ground
  evolution_chain: oshawott
  evolves_from: oshawott
  flavor_text:
    black:
      en: |-
        Strict training is how it learns its
        flowing double-scalchop technique.
      fr: |-
        L’apprentissage de sa technique de
        combat, qui utilise élégamment ses deux
        coupillages, est extrêmement rigoureux.
    white:
      en: |-
        Scalchop techniques differ from one
        Dewott to another. It never
        neglects maintaining its scalchops.
      fr: |-
        Chaque Mateloutre a sa propre technique
        d’escrime au coupillage, dont il prend
        un soin tout particulier.
    black-2:
      en: |-
        As a result of strict training,
        each Dewott learns different
        forms for using the scalchops.
    white-2:
      en: |-
        As a result of strict training,
        each Dewott learns different
        forms for using the scalchops.
    x:
      ja-Hrkt: |-
        ながれるような　たちさばきで
        ２まいの　ホタチを　あつかう　わざは
        きびしい　しゅぎょうで　みにつける。
      ja: |-
        流れるような　太刀さばきで
        ２枚の　ホタチを　あつかう　技は
        きびしい　修業によって　身につける。
      ko: |-
        물 흐르는 듯한 칼솜씨로
        2개의 가리비칼을 사용하는 기술은
        엄격한 수련을 통해 익힌 것이다.
      en: |-
        Strict training is how it learns its flowing
        double-scalchop technique.
      fr: |-
        L’apprentissage de sa technique de combat, qui
        utilise élégamment ses deux coupillages, est
        extrêmement rigoureux.
      de: |-
        Es eignet sich durch strenges Training elegant
        ineinander übergehende Attacken mit seinen
        zwei Muscheln an.
      es: |-
        Gran espadachín. Utiliza sus dos vieiras con soltura al
        ejecutar las técnicas que aprende con una disciplina
        espartana.
      it: |-
        Ha appreso tramite un durissimo allenamento l’arte
        di maneggiare le sue due conchiglie come fossero
        lame.
    'y':
      ja-Hrkt: |-
        きびしい　しゅぎょうの　すえ
        フタチマルごとに　ことなる　かたの
        ホタチさばきを　しゅうとく　する。
      ja: |-
        きびしい　修業の　すえ
        フタチマルごとに　異なる　型の
        ホタチさばきを　習得する。
      ko: |-
        혹독한 수행 끝에
        쌍검자비마다 다른 형태의
        가리비칼 다루는 기술을 습득한다.
      en: |-
        As a result of strict training, each Dewott learns
        different forms for using the scalchops.
      fr: |-
        Chaque Mateloutre a sa propre technique d’escrime
        au coupillage, acquise grâce à un entraînement
        drastique.
      de: |-
        Jedes Zwottronin eignet sich über strenges Training
        einen völlig eigenen Muschelkampfstil an.
      es: |-
        Tras un exhaustivo entrenamiento, Dewott puede
        dominar diversas técnicas para usar con sus vieiras.
      it: |-
        Le loro conchiglie sono tutte diverse nella forma e
        ogni Dewott si allena duramente per imparare a usarle.
    omega-ruby:
      ja-Hrkt: |-
        ながれるような　たちさばきで
        ２まいの　ホタチを　あつかう　わざは
        きびしい　しゅぎょうで　みにつける。
      ja: |-
        流れるような　太刀さばきで
        ２枚の　ホタチを　あつかう　技は
        きびしい　修業によって　身につける。
      ko: |-
        물 흐르는 듯한 칼 솜씨로
        2개의 가리비칼을 사용하는 기술은
        엄격한 수련을 통해 익힌 것이다.
      en: |-
        Strict training is how it learns its flowing
        double-scalchop technique.
      fr: |-
        L’apprentissage de sa technique de combat, qui utilise
        élégamment ses deux coupillages, est extrêmement rigoureux.
      de: |-
        Es eignet sich durch strenges Training elegant ineinander
        übergehende Attacken mit seinen zwei Muscheln an.
      es: |-
        Gran espadachín. Utiliza sus dos vieiras con soltura al ejecutar
        las técnicas que aprende con una disciplina espartana.
      it: |-
        Ha appreso tramite un durissimo allenamento l’arte di
        maneggiare le sue due conchiglie come fossero lame.
    alpha-sapphire:
      ja-Hrkt: |-
        きびしい　しゅぎょうの　すえ
        フタチマルごとに　ことなる　かたの
        ホタチさばきを　しゅうとく　する。
      ja: |-
        きびしい　修業の　すえ
        フタチマルごとに　異なる　型の
        ホタチさばきを　習得する。
      ko: |-
        혹독한 수행 끝에
        쌍검자비마다 다른 형태의
        가리비칼 다루는 기술을 습득한다.
      en: |-
        As a result of strict training, each Dewott learns
        different forms for using the scalchops.
      fr: |-
        Chaque Mateloutre a sa propre technique d’escrime
        au coupillage, acquise grâce à un entraînement drastique.
      de: |-
        Jedes Zwottronin eignet sich über strenges Training einen
        völlig eigenen Muschelkampfstil an.
      es: |-
        Tras un exhaustivo entrenamiento, Dewott puede dominar
        diversas técnicas para usar con sus vieiras.
      it: |-
        Le loro conchiglie sono tutte diverse nella forma e ogni
        Dewott si allena duramente per imparare a usarle.
    legends-arceus:
      en: |-
        Its exquisite double-scalchop technique is likely the result of
        daily training, and it can send even masters of the blade fleeing
        in defeat.
