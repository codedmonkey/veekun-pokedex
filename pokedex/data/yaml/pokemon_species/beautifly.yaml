beautifly:
  base_happiness: 70
  capture_rate: 45
  color: yellow
  egg_groups:
    - bug
  evolution_chain: wurmple
  evolves_from: silcoon
  flavor_text:
    ruby:
      en: |-
        BEAUTIFLY’s favorite food is the sweet
        pollen of flowers. If you want to see
        this POKéMON, just leave a pottedflower by an open window. BEAUTIFLY
        is sure to come looking for pollen.
    sapphire:
      en: |-
        BEAUTIFLY has a long mouth like a coiled
        needle, which is very convenient for
        collecting pollen from flowers.This POKéMON rides the spring winds as
        it flits around gathering pollen.
    emerald:
      en: |-
        Its colorfully patterned wings are its
        most prominent feature. It flies through
        flower-covered fields collecting pollen.
        It attacks ferociously when angered.
    firered:
      en: |-
        Despite its appearance, it has an
        aggressive nature. It attacks by jabbing
        with its long, thin mouth.
    leafgreen:
      en: |-
        Despite its appearance, it has an
        aggressive nature. It attacks by jabbing
        with its long, thin mouth.
    diamond:
      en: |-
        It has an aggressive nature. It
        stabs prey with its long, narrow
        mouth to drain the prey’s fluids.
    pearl:
      en: |-
        When flower fields bloom, it flits
        around, collecting pollen. Despite
        its appearance, it is savage.
    platinum:
      en: |-
        Despite its looks, it is aggressive.
        It jabs with its long, thin mouth if
        disturbed while collecting pollen.
    heartgold:
      en: |-
        Vibrantly patterned wings are its
        prominent feature. It sucks sweet
        flower nectar with its long mouth.
    soulsilver:
      en: |-
        Vibrantly patterned wings are its
        prominent feature. It sucks sweet
        flower nectar with its long mouth.
    black:
      en: |-
        Despite its looks, it is aggressive.
        It jabs with its long, thin mouth if
        disturbed while collecting pollen.
      fr: |-
        Malgré les apparences, il est très
        agressif et attaque avec sa trompe
        quand on le dérange.
    white:
      en: |-
        Despite its looks, it is aggressive.
        It jabs with its long, thin mouth if
        disturbed while collecting pollen.
      fr: |-
        Malgré les apparences, il est très
        agressif et attaque avec sa trompe
        quand on le dérange.
    black-2:
      en: |-
        Despite its looks, it is aggressive.
        It jabs with its long, thin mouth if
        disturbed while collecting pollen.
    white-2:
      en: |-
        Despite its looks, it is aggressive.
        It jabs with its long, thin mouth if
        disturbed while collecting pollen.
    x:
      ja-Hrkt: |-
        いろ　あざやかな　はねの　もようが
        とくちょう。ほそい　くちを　のばして
        はなの　あまい　ミツを　すいとる。
      ja: |-
        色　鮮やかな　羽の　模様が　特徴。
        細い　口を　伸ばして
        花の　甘い　ミツを　吸い取る。
      ko: |-
        색이 선명한 날개의 무늬가
        특징이다. 가는 입을 뻗어
        꽃의 달콤한 꿀을 흡수한다.
      en: |-
        Vibrantly patterned wings are its prominent feature.
        It sucks sweet flower nectar with its long mouth.
      fr: |-
        Réputé pour les motifs de ses ailes aux couleurs vives.
        Il allonge sa trompe pour butiner le nectar.
      de: |-
        Die bunten Flügel sind sein Markenzeichen.
        Mit seinem Rüssel saugt es süßen Honig aus Blumen.
      es: |-
        Los dibujos de sus coloridas alas son muy peculiares.
        Liba el néctar de las flores con su fina trompa.
      it: |-
        Sulle ali ha splendidi, vividi colori. Succhia il dolce
        polline dai fiori allungando la bocca sottile.
    'y':
      ja-Hrkt: |-
        ほそながい　くちを　つきさして
        あいての　たいえきを　すいとる。
        こうげきてきな　せいかく。
      ja: |-
        長細い　口を　突き刺して
        相手の　体液を　吸い取る。
        攻撃的な　性格。
      ko: |-
        가늘고 긴 입을 깊이 찔러
        상대의 체액을 흡수한다.
        공격적인 성격이다.
      en: |-
        It has an aggressive nature. It stabs prey with its
        long, narrow mouth to drain the prey’s fluids.
      fr: |-
        Il est très agressif. Il pique sa proie avec son long
        museau étroit et absorbe sa vitalité.
      de: |-
        Es besitzt ein aggressives Wesen. Es sticht seinen
        Rüssel in seine Beute und saugt sie aus.
      es: |-
        Es un Pokémon agresivo. Con su boca larga y afilada
        ataca a sus rivales para drenar sus fluidos.
      it: |-
        Ha un’indole aggressiva. Conficca la sua bocca
        lunga e sottile nelle prede e ne succhia i fluidi.
    omega-ruby:
      ja-Hrkt: |-
        あまい　かふんが　だいこうぶつの　ポケモン。
        はなを　つけた　はちうえを　まどべに　おけば
        かふんを　あつめに　かならず　とんでくるよ。
      ja: |-
        甘い　花粉が　大好物の　ポケモン。
        花を　つけた　鉢植えを　窓辺に　置けば
        花粉を　集めに　必ず　飛んでくるよ。
      ko: |-
        달콤한 꽃가루를 매우 좋아하는 포켓몬이다.
        꽃이 핀 화분을 창가에 두면
        꽃가루를 모으려고 반드시 날아온다.
      en: |-
        Beautifly’s favorite food is the sweet pollen of flowers. If you
        want to see this Pokémon, just leave a potted flower by an
        open window. Beautifly is sure to come looking for pollen.
      fr: |-
        La nourriture préférée de Charmillon est le pollen sucré
        des fleurs. Si on veut voir ce Pokémon, il suffit de laisser
        une fleur en pot sur un rebord de fenêtre. Charmillon viendra
        sûrement voir s’il y a du pollen.
      de: |-
        Papinellas Lieblingsspeise ist Blütenstaub. Wenn du dieses
        Pokémon beobachten möchtest, musst du bloß einen
        Blumentopf vor ein geöffnetes Fenster stellen. Papinella
        wird sich diese Leckerei nicht entgehen lassen.
      es: |-
        La comida favorita de Beautifly es el dulce polen de las flores.
        Si quieres ver a este Pokémon, deja una maceta con flores al
        lado de la ventana y verás cómo aparece un ejemplar de
        Beautifly en busca de polen.
      it: |-
        Il nutrimento preferito da Beautifly è il polline dei fiori.
        Per attirare questo Pokémon basta mettere una pianta fiorita
        sul davanzale: senza dubbio si avvicinerà in cerca di polline.
    alpha-sapphire:
      ja-Hrkt: |-
        くるりと　まいた　はりの　ような　ながい　くちは
        かふんを　あつめる　ときに　とても　べんり。
        はるかぜに　のって　かふんを　あつめて　まわる。
      ja: |-
        くるりと　巻いた　針の　ような　長い　口は
        花粉を　集める　ときに　とても　便利。
        春風に　乗って　花粉を　集めてまわる。
      ko: |-
        둥글게 말린 바늘같이 생긴 긴 입은
        꽃가루를 모을 때 매우 편리하다.
        봄바람을 타고 꽃가루를 모으러 돌아다닌다.
      en: |-
        Beautifly has a long mouth like a coiled needle, which is very
        convenient for collecting pollen from flowers. This Pokémon
        rides the spring winds as it flits around gathering pollen.
      fr: |-
        Charmillon a une longue trompe en spirale, particulièrement
        pratique pour récupérer le pollen des fleurs. Ce Pokémon
        se laisse porter par les vents printaniers pendant qu’il butine.
      de: |-
        Papinella hat einen langen Rüssel, der hervorragend zum
        Sammeln von Blütenpollen geeignet ist. Dieses Pokémon
        flattert im Frühlingswind herum und sammelt Blütenstaub.
      es: |-
        Beautifly tiene una boca enorme en espiral que parece una
        aguja y le resulta muy útil para recolectar polen. Este
        Pokémon va revoloteando de flor en flor para recogerlo.
      it: |-
        La bocca di Beautifly è costituita da un ago spiraliforme, molto
        utile per succhiare il polline dai fiori. Questo Pokémon si
        fa trasportare dal vento nei suoi viaggi alla ricerca del polline.
    legends-arceus:
      en: |-
        A colorful and incredibly beautiful but also greedy Pokémon.
        In an effort to keep its favorite food all to itself, it will chase
        away Combee as they try to gather nectar.
