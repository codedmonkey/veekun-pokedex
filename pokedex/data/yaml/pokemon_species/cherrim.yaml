cherrim:
  base_happiness: 50
  capture_rate: 75
  color: purple
  egg_groups:
    - fairy
    - plant
  evolution_chain: cherubi
  evolves_from: cherubi
  flavor_text:
    diamond:
      en: |-
        It blooms during times of strong
        sunlight. It tries to make up for
        everything it endured as a bud.
    pearl:
      en: |-
        It is docile as a bud, but turns
        cheerful when it blooms. It folds
        back into a bud if sunlight wanes.
    platinum:
      en: |-
        If it senses strong sunlight, it
        opens its folded petals to absorb
        the sun’s rays with its whole body.
    heartgold:
      en: |-
        During times of strong sunlight,
        its bud blooms, its petals open
        fully, and it becomes very active.
    soulsilver:
      en: |-
        During times of strong sunlight,
        its bud blooms, its petals open
        fully, and it becomes very active.
    black:
      en: |-
        If it senses strong sunlight, it
        opens its folded petals to absorb
        the sun’s rays with its whole body.
      fr: |-
        Sous un grand soleil, il ouvre
        ses pétales pour en absorber
        les rayons.
    white:
      en: |-
        If it senses strong sunlight, it
        opens its folded petals to absorb
        the sun’s rays with its whole body.
      fr: |-
        Sous un grand soleil, il ouvre
        ses pétales pour en absorber
        les rayons.
    black-2:
      en: |-
        If it senses strong sunlight, it
        opens its folded petals to absorb
        the sun’s rays with its whole body.
    white-2:
      en: |-
        If it senses strong sunlight, it
        opens its folded petals to absorb
        the sun’s rays with its whole body.
    x:
      ja-Hrkt: |-
        つぼみが　たいようの　ひかりを
        あびて　はなびらを　ひろげると
        かっぱつに　うごく　ように　なる。
      ja: |-
        つぼみが　太陽の　光を　浴びて
        花びらを　広げると
        活発に　動くように　なる。
      ko: |-
        봉오리가 태양의 빛을
        쬐어 꽃잎이 피면
        활발하게 움직일 수 있게 된다.
      en: |-
        During times of strong sunlight, its bud blooms,
        its petals open fully, and it becomes very active.
      fr: |-
        Une fois gorgé de soleil, il déploie ses pétales et
        bouge avec vivacité.
      de: |-
        Bei Sonnenschein entfaltet seine Knospe ihre
        Blütenblätter und es springt lebhaft umher.
      es: |-
        Cuando los rayos de sol inundan su capullo, abre de
        par en par sus pétalos y se vuelve muy dinámico.
      it: |-
        Sboccia quando si espone ai raggi solari,
        espandendo la corolla e diventando molto attivo.
    'y':
      ja-Hrkt: |-
        つよい　ひざしを　かんじとると
        とざしていた　はなびらを　ひろげ
        ぜんしんで　にっこうを　あびる。
      ja: |-
        強い　日差しを　感じとると
        閉ざしていた　花びらを　広げ
        全身で　日光を　浴びる。
      ko: |-
        강한 햇살을 느끼면
        움츠려 있던 꽃잎을 펼쳐
        전신으로 햇빛을 받는다.
      en: |-
        If it senses strong sunlight, it opens its folded
        petals to absorb the sun’s rays with its whole body.
      fr: |-
        Sous un grand soleil, il ouvre ses pétales pour en
        absorber les rayons.
      de: |-
        Spürt es Sonnenlicht, öffnet es seine Blütenblätter
        und nimmt die Energie der Sonnenstrahlen auf.
      es: |-
        Cuando detecta luz solar fuerte, despliega los pétalos
        y absorbe todos los rayos posibles.
      it: |-
        Quando splende il sole, ama aprire i suoi petali per
        assorbire i raggi solari con tutto il corpo.
    omega-ruby:
      ja-Hrkt: |-
        つぼみが　たいようの　ひかりを
        あびて　はなびらを　ひろげると
        かっぱつに　うごく　ように　なる。
      ja: |-
        つぼみが　太陽の　光を　浴びて
        花びらを　広げると
        活発に　動くように　なる。
      ko: |-
        봉오리가 태양의 빛을
        쬐어 꽃잎이 피면
        활발하게 움직일 수 있게 된다.
      en: |-
        During times of strong sunlight, its bud blooms,
        its petals open fully, and it becomes very active.
      fr: |-
        Une fois gorgé de soleil, il déploie ses pétales et bouge
        avec vivacité.
      de: |-
        Bei Sonnenschein entfaltet seine Knospe ihre Blütenblätter
        und es springt lebhaft umher.
      es: |-
        Cuando los rayos de sol inundan su capullo, abre de par en
        par sus pétalos y se vuelve muy dinámico.
      it: |-
        Sboccia quando si espone ai raggi solari, espandendo la
        corolla e diventando molto attivo.
    alpha-sapphire:
      ja-Hrkt: |-
        つよい　ひざしを　かんじとると
        とざしていた　はなびらを　ひろげ
        ぜんしんで　にっこうを　あびる。
      ja: |-
        強い　日差しを　感じとると
        閉ざしていた　花びらを　広げ
        全身で　日光を　浴びる。
      ko: |-
        강한 햇살을 느끼면
        움츠려 있던 꽃잎을 펼쳐
        전신으로 햇빛을 받는다.
      en: |-
        If it senses strong sunlight, it opens its folded
        petals to absorb the sun’s rays with its whole body.
      fr: |-
        Sous un grand soleil, il ouvre ses pétales pour en absorber
        les rayons.
      de: |-
        Spürt es Sonnenlicht, öffnet es seine Blütenblätter und nimmt
        die Energie der Sonnenstrahlen auf.
      es: |-
        Cuando detecta luz solar fuerte, despliega los pétalos y
        absorbe todos los rayos posibles.
      it: |-
        Quando splende il sole, ama aprire i suoi petali per assorbire
        i raggi solari con tutto il corpo.
    sword:
      ja-Hrkt: |-
        つぼみの　あいだは　おとなしく
        ほぼ　うごかない。　ひのひかりが
        でるのを　じっと　まっている。
      ja: |-
        つぼみの　あいだは　おとなしく
        ほぼ　動かない。　日の光が
        出るのを　じっと　待っている。
      ko: |-
        봉오리일 때는 얌전하고
        거의 움직이지 않는다. 햇빛이
        들기를 가만히 기다리고 있다.
      zh-Hant: |-
        花苞形態時性情穩重，
        幾乎不會動，只是靜靜地
        等待太陽光的出現。
      zh-Hans: |-
        花苞形态时性格稳重，
        几乎不会动，只是静静地
        等待太阳光的出现。
      en: |-
        As a bud, it barely moves. It sits still, placidly
        waiting for sunlight to appear.
      fr: |-
        Pendant sa période de bourgeonnement,
        il reste presque totalement immobile et attend
        que le soleil se lève.
      de: |-
        Als Knospe verhält es sich ruhig und bewegt sich
        kaum, während es geduldig auf Sonnenschein
        wartet.
      es: |-
        Permanece casi inmóvil cerrado en un capullo
        a la espera de que lo bañen los rayos del sol.
      it: |-
        Quando è un bocciolo rimane pressoché
        immobile in attesa che spunti il sole.
    shield:
      ja-Hrkt: |-
        たたんだ　はなびらは　かたい。
        とりポケモンに　つっつかれても
        ぜんぜん　へいき　なのだ。
      ja: |-
        畳んだ　花びらは　硬い。
        鳥ポケモンに　突っつかれても
        ぜんぜん　平気　なのだ。
      ko: |-
        겹쳐진 꽃잎은 딱딱하다.
        새포켓몬에게 쪼여도
        아무렇지도 않다.
      zh-Hant: |-
        闔起來的花瓣很硬。
        即使被鳥寶可夢啄到，
        也完全沒問題。
      zh-Hans: |-
        盖起来的花瓣很硬。
        即使被鸟宝可梦啄到，
        也完全没问题。
      en: |-
        Its folded petals are pretty tough. Bird Pokémon
        can peck at them all they want, and Cherrim
        won’t be bothered at all.
      fr: |-
        Lorsqu’il se ferme, ses pétales sont si durs qu’il
        ne craint plus les attaques des Pokémon oiseaux.
      de: |-
        Die Blütenblätter, die es umschließen, sind hart.
        Deswegen macht es ihm absolut nichts aus, wenn
        Vogel-Pokémon es mit ihren Schnäbeln angreifen.
      es: |-
        Al cerrarse, sus pétalos son tan duros que
        resultan inmunes a los picotazos de los Pokémon
        pájaro.
      it: |-
        I petali ripiegati sono molto duri e lo proteggono
        dalle beccate dei Pokémon alati.
    legends-arceus:
      en: |-
        Motionless, save for the occasional quiver. A rich array of
        Pokémon can be found gathered around it, drawn by the
        scent exuded from Cherrim's folded petals.
