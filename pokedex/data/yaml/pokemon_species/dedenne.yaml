dedenne:
  base_happiness: 50
  capture_rate: 180
  color: yellow
  egg_groups:
    - ground
    - fairy
  evolution_chain: dedenne
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        ヒゲが　アンテナの　やくわり。
        でんぱを　そうじゅしんして　とおくの
        なかまと　れんらくを　とりあうのだ。
      ja: |-
        ヒゲが　アンテナの　役割。
        電波を　送受信して　遠くの　仲間と
        連絡を　取り合うのだ。
      ko: |-
        수염이 안테나의 역할을 한다.
        전파를 송수신해서 멀리 떨어진
        동료와 서로 연락하는 것이다.
      en: |-
        Its whiskers serve as antennas. By sending and
        receiving electrical waves, it can communicate
        with others over vast distances.
      fr: |-
        Ses moustaches lui servent d’antennes, et lui
        permettent d’envoyer et de recevoir des signaux
        pour communiquer à distance avec ses congénères.
      de: |-
        Seine Schnurrhaare dienen ihm als Antennen. Durch
        das Senden und Empfangen von elektrischen Wellen
        kann es mit weit entfernten Freunden kommunizieren.
      es: |-
        Sus bigotes hacen la función de antenas, por lo
        que puede enviar y recibir ondas eléctricas para
        comunicarse a grandes distancias.
      it: |-
        I suoi baffi fungono da antenne che trasmettono e
        ricevono onde radio. Se ne serve per comunicare
        con i suoi simili.
    'y':
      ja-Hrkt: |-
        しっぽで　はつでんしょや　みんかの
        コンセントから　でんきを　すいとり
        ヒゲから　でんげきを　うちだす。
      ja: |-
        尻尾で　発電所や　民家の
        コンセントから　電気を　吸い取り
        ヒゲから　電撃を　撃ち出す。
      ko: |-
        꼬리로 발전소나 민가의
        콘센트에서 전기를 흡수하여
        수염에서 전격을 날린다.
      en: |-
        It uses its tail to absorb electricity from
        power plants or from outlets in houses,
        and then it fires the electricity from its whiskers.
      fr: |-
        Il utilise sa queue pour pomper l’énergie des centrales
        électriques ou pour se brancher sur les prises des
        maisons. Ses moustaches envoient des décharges.
      de: |-
        Mit seinem Schwanz zapft es Kraftwerke sowie
        Steckdosen in Häusern an, um Strom zu tanken,
        den es über seine Schnurrhaare wieder entlädt.
      es: |-
        Con su cola absorbe la electricidad procedente de las
        centrales de energía o los enchufes de las casas,
        para liberarla en forma de ataque por los bigotes.
      it: |-
        Con la coda può assorbire energia dalle prese di
        corrente di centrali elettriche e abitazioni per poi
        scaricarla dai baffi.
    omega-ruby:
      ja-Hrkt: |-
        ヒゲが　アンテナの　やくわり。
        でんぱを　そうじゅしんして　とおくの
        なかまと　れんらくを　とりあうのだ。
      ja: |-
        ヒゲが　アンテナの　役割。
        電波を　送受信して　遠くの　仲間と
        連絡を　取り合うのだ。
      ko: |-
        수염이 안테나의 역할을 한다.
        전파를 송수신해서 멀리 떨어진
        동료와 서로 연락하는 것이다.
      en: |-
        Its whiskers serve as antennas. By sending and
        receiving electrical waves, it can communicate
        with others over vast distances.
      fr: |-
        Ses moustaches lui servent d’antennes, et lui permettent
        d’envoyer et de recevoir des signaux pour communiquer
        à distance avec ses congénères.
      de: |-
        Seine Schnurrhaare dienen ihm als Antennen. Durch das
        Senden und Empfangen von elektrischen Wellen kann es
        mit weit entfernten Freunden kommunizieren.
      es: |-
        Sus bigotes hacen la función de antenas, por lo que puede
        enviar y recibir ondas eléctricas para comunicarse a grandes
        distancias.
      it: |-
        I suoi baffi fungono da antenne che trasmettono e ricevono
        onde radio. Se ne serve per comunicare con i suoi simili.
    alpha-sapphire:
      ja-Hrkt: |-
        しっぽで　はつでんしょや　みんかの
        コンセントから　でんきを　すいとり
        ヒゲから　でんげきを　うちだす。
      ja: |-
        尻尾で　発電所や　民家の
        コンセントから　電気を　吸い取り
        ヒゲから　電撃を　撃ち出す。
      ko: |-
        꼬리로 발전소나 민가의
        콘센트에서 전기를 흡수하여
        수염에서 전격을 날린다.
      en: |-
        It uses its tail to absorb electricity from
        power plants or from outlets in houses,
        and then it fires the electricity from its whiskers.
      fr: |-
        Il utilise sa queue pour pomper l’énergie des centrales
        électriques ou pour se brancher sur les prises des maisons.
        Ses moustaches envoient des décharges.
      de: |-
        Mit seinem Schwanz zapft es Kraftwerke sowie Steckdosen
        in Häusern an, um Strom zu tanken, den es über seine
        Schnurrhaare wieder entlädt.
      es: |-
        Con su cola absorbe la electricidad procedente de las
        centrales de energía o los enchufes de las casas, para
        liberarla en forma de ataque por los bigotes.
      it: |-
        Con la coda può assorbire energia dalle prese di corrente
        di centrali elettriche e abitazioni per poi scaricarla dai baffi.
    ultra-sun:
      ja-Hrkt: |-
        みんかに　しのびこみ　コンセントから
        でんきを　ぬすむ。　でんきだいが
        おかしいときは　こいつの　しわざ。
      ja: |-
        民家に　忍びこみ　コンセントから
        電気を　盗む。　電気代が
        おかしいときは　こいつの　仕業。
      ko: |-
        민가에 숨어들어 콘센트에서
        전기를 훔친다. 전기료가
        이상할 때는 이 녀석의 소행이다.
      zh-Hant: |-
        會潛入人們家裡，從插座偷電。
        如果發現電費不正常，
        那就是這傢伙幹的。
      zh-Hans: |-
        潜入民居，从插座里偷电。
        电费很奇怪的时候，
        就是这家伙的杰作。
      en: |-
        It sneaks into people’s homes and steals
        electricity from their outlets. When your electric
        bill seems off, it’s the handiwork of this rascal.
      fr: |-
        Il s’introduit chez les gens pour voler l’électricité
        via les prises de courant. On sait qui blâmer
        en cas de facture d’électricité trop élevée !
      de: |-
        Es schleicht sich in Häuser und zapft an den
        Steckdosen Strom ab. Fällt die Stromrechnung
        mal unerwartet hoch aus, ist Dedenne schuld.
      es: |-
        Se infiltra en los hogares para robar energía de
        los enchufes. Si la factura de la electricidad es
        inusualmente alta, seguro que él tiene la culpa.
      it: |-
        Si intrufola nelle case per rubare energia dalle
        prese elettriche. Se la bolletta della luce è
        stranamente alta, c’è di sicuro il suo zampino!
    ultra-moon:
      ja-Hrkt: |-
        うえの　ヒゲは　あたりを　さぐる
        センサーで　したに　はえた　ヒゲは
        でんきを　はなつ　きかん　なのだ。
      ja: |-
        上の　ヒゲは　辺りを　探る
        センサーで　下に　生えた　ヒゲは
        電気を　放つ　器官　なのだ。
      ko: |-
        위쪽 수염은 주변을 살피는
        센서이고 아래로 난 수염은
        전기를 발산하는 기관이다.
      zh-Hant: |-
        上面的鬍鬚是探索周遭環境
        的感應器，長在下面的鬍鬚
        是釋放電流的器官。
      zh-Hans: |-
        上面的胡子是探索周边的感应器。
        下面长出的胡子是释放电的器官。
      en: |-
        Its upper whiskers are sensors that survey its
        surroundings. Its lower whiskers are organs
        that shoot electricity.
      fr: |-
        Les moustaches du haut lui servent de capteurs
        pour inspecter son environnement ; celles du
        bas lui permettent de décharger de l’électricité.
      de: |-
        Seine oberen Schnurrhaare dienen ihm als
        Sensoren zum Abtasten der Umgebung. Seine
        unteren Schnurrhaare erzeugen Elektrizität.
      es: |-
        Los bigotes superiores actúan como sensores
        del entorno, mientras que los inferiores son
        órganos que generan electricidad.
      it: |-
        I baffi superiori sono sensori con cui sonda
        l’ambiente circostante, mentre quelli inferiori
        sono organi che emettono elettricità.
    sword:
      ja-Hrkt: |-
        なかまの　はなつ　でんぱを　ヒゲで
        キャッチ。　エサや　でんきの
        ありかを　みんなで　シェアするのだ。
      ja: |-
        仲間の　放つ　電波を　ヒゲで
        キャッチ。　エサや　電気の　ありかを
        みんなで　シェアするのだ。
      ko: |-
        동료가 내뿜는 전파를 수염으로
        감지한다. 먹이나 전기의 위치를
        모두와 함께 공유한다.
      zh-Hant: |-
        能用鬍鬚接收來自夥伴們
        的電波，藉此向彼此分享
        哪裡有食物或電力。
      zh-Hans: |-
        用胡子来感知伙伴发出
        的电波。它们通过这种方式
        告诉彼此哪里有食物和电。
      en: |-
        A Dedenne’s whiskers pick up electrical waves
        other Dedenne send out. These Pokémon share
        locations of food or electricity with one another.
      fr: |-
        Il capte les ondes émises par ses congénères
        avec ses moustaches. Cela lui permet de savoir
        où trouver de la nourriture ou de l’électricité.
      de: |-
        Mit den Schnurrhaaren empfangen sie elektrische
        Wellen von Artgenossen. So teilen sie einander
        mit, wo Futter und Elektrizität zu finden sind.
      es: |-
        Se sirve de sus bigotes para captar las ondas que
        emiten sus compañeros, con las que se indican
        dónde encontrar sustento o electricidad.
      it: |-
        Usa i baffi per captare le onde radio emesse
        dai suoi simili. Così condivide informazioni
        su dove trovare cibo ed elettricità.
    shield:
      ja-Hrkt: |-
        でんきを　うみだす　ちからが
        よわいので　コンセントや　ほかの
        でんきポケモンから　ぬすむのだ。
      ja: |-
        電気を　生みだす　力が　弱いので
        コンセントや　ほかの
        電気ポケモンから　盗むのだ。
      ko: |-
        전기를 만들어내는 힘이
        약해서 콘센트나 다른
        전류포켓몬에게 훔친다.
      zh-Hant: |-
        由於發電的能力不強，
        因此會從插座或其他的
        電氣寶可夢那裡偷電。
      zh-Hans: |-
        由于发电的能力弱，
        会从插座或其他的
        电气宝可梦那里偷电。
      en: |-
        Since Dedenne can’t generate much electricity on
        its own, it steals electricity from outlets or other
        electric Pokémon.
      fr: |-
        Puisqu’il a du mal à générer sa propre électricité,
        il en vole aux autres Pokémon Électrik ou via
        les prises de courant.
      de: |-
        Dedenne selbst kann nur wenig Elektrizität
        erzeugen, weshalb es Strom von anderen
        Elektro-Pokémon oder aus Steckdosen stiehlt.
      es: |-
        Su capacidad para producir electricidad es muy
        limitada, de modo que tiene que robarla de las
        tomas de corriente o de otros Pokémon.
      it: |-
        Non riuscendo a produrre molta elettricità,
        la ruba dalle prese di corrente o da
        altri Pokémon di tipo Elettro.
