    sun:
      ja-Hrkt: |-
        くっても　くっても　せなかに
        はえている　キノコが　ほとんど
        えいようを　うばっていくのだ。
      ja: |-
        喰っても　喰っても　背中に
        生えている　キノコが　ほとんど
        栄養を　奪っていくのだ。
      ko: |-
        먹어도 먹어도 등에
        돋아나 있는 버섯이 대부분의
        영양을 빼앗아간다.
      zh-Hant: |-
        即使不停地吃，不停地吃，
        大部分攝取的營養都會被
        生長在背上的蘑菇奪走。
      zh-Hans: |-
        即使不停地吃，
        获取的营养也几乎都会被
        背上生长的蘑菇夺走。
      en: |-
        No matter how much it eats, the mushrooms
        growing on its back steal away most of
        the nutrients it consumes.
      fr: |-
        Il a beau manger autant qu’il peut,
        les champignons qui poussent sur son dos
        lui volent la plupart de ses nutriments.
      de: |-
        Egal, wie viel Nahrung es auch zu sich nimmt,
        die Pilze, die auf seinem Rücken wachsen,
        entziehen ihm so gut wie alle Nährstoffe.
      es: |-
        Por mucho que coma, las setas parásitas que
        tiene en el lomo le roban la mayor parte de los
        nutrientes.
      it: |-
        Mangia a più non posso, ma i funghi che
        crescono sul suo dorso gli rubano quasi
        tutto il nutrimento.
    moon:
      ja-Hrkt: |-
        とうちゅうかそうと　いう　せなかの
        キノコは　ちょうじゅの　くすり。
        かわかし　ふんまつにして　つかう。
      ja: |-
        冬虫夏草と　いう　背中の
        キノコは　長寿の　薬。
        乾かし　粉末にして　使う。
      ko: |-
        동충하초라고 불리는 등의
        버섯은 장수의 약이다.
        말려서 가루로 만들어 사용한다.
      zh-Hant: |-
        背上生長蘑菇被稱為冬蟲夏草，
        是一種能延年益壽的藥。
        乾燥後磨成粉末使用。
      zh-Hans: |-
        背上生长的被称为冬虫夏草的
        蘑菇是长寿之药。
        干燥后磨成粉末使用。
      en: |-
        Mushrooms called tochukaso sprout from its
        back. They can be dried and powdered to make
        a medicine used to extend life.
      fr: |-
        Les champignons qui poussent sur son dos,
        appelés tochukaso, peuvent être séchés puis
        broyés pour obtenir un élixir de longue vie.
      de: |-
        Die Pilze auf seinem Rücken heißen Tochukaso.
        Sie lassen sich als lebensverlängernde Medizin
        verwerten, wenn man sie trocknet und zermahlt.
      es: |-
        Las setas que lleva en su lomo, llamadas
        tochukaso, se pueden deshidratar y pulverizar
        para crear un elixir que alarga la vida.
      it: |-
        I funghi che ha sul dorso, chiamati tochukaso,
        sono considerati un farmaco di longevità.
        Prima dell’uso, vanno essiccati e polverizzati.
    ultra-sun:
      ja-Hrkt: |-
        しっけが　たりないのか　えいようが
        たりないのか　アローラの　パラスの
        キノコは　そだちが　いまいち。
      ja: |-
        湿気が　足りないのか　栄養が
        足りないのか　アローラの　パラスの
        キノコは　育ちが　いまいち。
      ko: |-
        습도가 낮아서인지 영양이
        부족해서인지 알로라 파라스의
        버섯은 성장이 그저 그렇다.
      zh-Hant: |-
        不知是因為濕氣不夠還是營養不足，
        阿羅拉的派拉斯背上的
        蘑菇長得都不怎麼樣。
      zh-Hans: |-
        可能是湿气不够，也可能是营养不足，
        反正阿罗拉的派拉斯背上的
        蘑菇都长得不怎么样。
      en: |-
        Whether it’s due to a lack of moisture or a lack
        of nutrients, in Alola the mushrooms on Paras
        don’t grow up quite right.
      fr: |-
        C’est probablement par manque de nutriments
        et d’humidité que les champignons sur son dos
        peinent à se développer à Alola.
      de: |-
        In Alola sind Paras’ Pilze etwas unterentwickelt.
        Vielleicht mangelt es ihm hier an Feuchtigkeit
        oder Nährstoffen.
      es: |-
        Ya sea por la falta de humedad o de nutrientes,
        las setas parásitas de los Paras en Alola suelen
        ser más pequeñas que en otras regiones.
      it: |-
        I funghi sul dorso di Paras crescono con
        difficoltà ad Alola, forse per mancanza
        di umidità o di nutrimento.
    ultra-moon:
      ja-Hrkt: |-
        とうちゅうかそう　という　キノコが
        ムシを　あやつっているのだ。
        ムシの　いしは　むしされる。
      ja: |-
        冬虫夏草と　いう　キノコが
        虫を　操っているのだ。
        虫の　意思は　無視される。
      ko: |-
        동충하초라고 불리는 버섯이
        벌레를 조종하고 있다.
        벌레의 의사는 무시된다.
      zh-Hant: |-
        控制蟲子的是一種
        叫做冬蟲夏草的蕈類。
        蟲子的意志會被忽視。
      zh-Hans: |-
        是一种叫做冬虫夏草的
        蘑菇在控制着虫子。
        虫子的意志会被它忽视。
      en: |-
        The mushrooms, known as tochukaso, are
        controlling the bug. Even if the bug bugs the
        mushrooms, they tell it to bug off.
      fr: |-
        Les champignons, appelés tochukaso,
        contrôlent l’insecte contre sa volonté.
      de: |-
        Paras’ Körper kann nicht nach seinem eigenen
        Willen handeln, da er von Tochukaso, den Pilzen
        auf seinem Rücken, kontrolliert wird.
      es: |-
        Las setas que tiene en el dorso, llamadas
        tochukaso, controlan al insecto contra su
        voluntad.
      it: |-
        I funghi che crescono sul dorso di questo
        Pokémon, chiamati tochukaso, controllano le sue
        azioni contro la sua volontà.
    lets-go-pikachu:
      ja-Hrkt: |-
        あなをほり　きのねっこ　から
        えいようを　とるが　ほとんどは
        せなかの　キノコに　うばわれる。
      ja: |-
        穴を掘り　木の根っこ　から
        栄養を　摂るが　ほとんどは
        背中の　キノコに　奪われる。
      ko: |-
        구멍을 파서 나무뿌리로부터
        영양을 섭취하지만 대부분은
        등에 있는 버섯에게 빼앗긴다.
      zh-Hant: |-
        會挖掘洞穴，從樹木的根部
        獲取營養，但幾乎所有的營養
        都會被背上的蘑菇奪走。
      zh-Hans: |-
        它会通过挖洞来从树根里
        吸取营养，但大部分营养
        都会被背上的蘑菇抢走。
      en: |-
        Burrows under the ground to gnaw on
        tree roots. The mushrooms on its back
        absorb most of the nutrition.
      fr: |-
        Il s’enfouit pour ronger des racines, mais ce sont
        les champignons sur son dos qui absorbent
        presque tous les nutriments.
      de: |-
        Es gräbt sich in den Boden, um Baumwurzeln
        Nährstoffe zu entziehen. Den Großteil davon
        absorbieren jedoch die Pilze auf seinem Rücken.
      es: |-
        Escarba en el suelo para extraer nutrientes de
        las raíces de los árboles, que las setas del lomo
        absorben después casi por completo.
      it: |-
        Scava nella terra per cibarsi delle radici degli
        alberi, ma i funghi che ha sul dorso assorbono
        quasi tutte le sostanze nutritive.
    lets-go-eevee:
      ja-Hrkt: |-
