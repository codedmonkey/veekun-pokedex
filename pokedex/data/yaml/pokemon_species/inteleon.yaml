inteleon:
  base_happiness: 50
  capture_rate: 45
  color: blue
  egg_groups:
    - water1
    - ground
  evolution_chain: sobble
  evolves_from: drizzile
  flavor_text:
    sword:
      ja-Hrkt: |-
        たさいな　きのうを　かくしもつ。
        ゆびから　みずを　ふんしゃして
        せなかの　ひまくで　かぜに　のる。
      ja: |-
        多彩な　機能を　隠し持つ。
        指から　水を　噴射して
        背中の　皮膜で　風に　乗る。
      ko: |-
        다채로운 기능을 숨기고 있다.
        손끝에서 물을 분사하고
        등에 있는 피막으로 바람을 탄다.
      zh-Hant: |-
        身上隱藏著多種特殊能力，
        例如從手指噴射水流，
        以及用背部的翼膜滑翔等等。
      zh-Hans: |-
        身上隐藏着多种特殊能力，
        例如从手指喷射水流，
        以及用背部的翼膜滑翔等等。
      en: |-
        It has many hidden capabilities, such as fingertips
        that can shoot water and a membrane on its back
        that it can use to glide through the air.
      fr: |-
        Il a plus d’un tour dans son sac : il peut tirer
        des gerbes d’eau du bout de ses doigts et planer
        dans les airs grâce à ses membranes dorsales.
      de: |-
        Zu seinen vielen geheimen Talenten gehört es,
        Wasser aus den Fingern zu schießen und mit der
        Membran am Rücken durch die Lüfte zu segeln.
      es: |-
        Esconde algunos trucos bajo la manga: puede
        disparar agua por los dedos o planear con las
        membranas de su espalda.
      it: |-
        Ha vari assi nella manica. Emette getti d’acqua
        dalle dita e si fa trasportare dal vento grazie
        alla membrana che ha sulla schiena.
    shield:
      ja-Hrkt: |-
        ゆびさきから　はなつ　みずでっぽうは
        マッハ３の　はやさ。　しゅんまくで
        きゅうしょを　みぬいて　うちぬくぞ。
      ja: |-
        指先から　放つ　水鉄砲は
        マッハ３の　速さ。　瞬膜で
        急所を　見抜いて　撃ちぬくぞ。
      ko: |-
        손가락 끝에서 마하3의 스피드로
        물대포를 쏜다. 눈의 얇은 막으로
        급소를 간파해 꿰뚫어버린다.
      zh-Hant: |-
        能從指尖射出速度高達３馬赫
        的水槍。牠的瞬膜能幫助牠看穿
        敵人的弱點，準確地擊中要害。
      zh-Hans: |-
        能从指尖射出速度高达３马赫
        的水枪。它的瞬膜能帮助它看穿
        敌人的弱点，准确地击中要害。
      en: |-
        Its nictitating membranes let it pick out foes’
        weak points so it can precisely blast them with
        water that shoots from its fingertips at Mach 3.
      fr: |-
        Il repère le point faible de l’ennemi grâce à sa
        membrane nictitante, puis il transperce sa cible en
        tirant des jets d’eau à Mach 3 du bout des doigts.
      de: |-
        Die Wasserschüsse aus seinen Fingern erreichen
        Geschwindigkeiten von bis zu Mach 3. Mit seiner
        Nickhaut erkennt es Schwachpunkte des Gegners.
      es: |-
        Dispara chorros de agua por la punta de los
        dedos a 3 mach de velocidad. Con su membrana
        nictitante puede ver los puntos débiles del rival.
      it: |-
        Spara getti d’acqua dalla punta delle dita a una
        velocità di Mach 3. Grazie alle sue membrane
        nittitanti individua i punti deboli del nemico.
