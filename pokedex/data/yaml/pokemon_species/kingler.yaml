    sword:
      ja-Hrkt: |-
        かたい　ハサミは　１まんばりきの
        パワーを　もっているが　おおきすぎて
        うごきが　にぶい。
      ja: |-
        硬い　ハサミは　１万馬力の
        パワーを　もっているが　大きすぎて
        動きが　鈍い。
      ko: |-
        단단한 집게는 1만 마력의
        파워를 지녔지만
        너무 커서 움직임이 둔하다.
      zh-Hant: |-
        雖然堅硬的鉗子
        有著１萬馬力的力量，
        但尺寸太大讓牠行動遲緩。
      zh-Hans: |-
        虽然坚硬的钳子
        有着１万马力的力量，
        但因为太大而行动迟缓。
      en: |-
        Its large and hard pincer has 10,000-horsepower
        strength. However, being so big, it is unwieldy
        to move.
      fr: |-
        Sa grosse pince est dotée d’une puissance
        incommensurable. Sa taille imposante la rend
        toutefois difficile à utiliser.
      de: |-
        Die Kraft seiner großen und harten Schere
        entspricht 10 000 PS. Durch die Größe ist sie
        aber auch äußerst unhandlich und sperrig.
      es: |-
        La pinza tan grande que tiene posee una fuerza
        de 10 000 CV, pero le cuesta moverla por su
        gran tamaño.
      it: |-
        La chela più grande sprigiona una potenza
        di 10.000 CV. Le dimensioni gli rendono
        difficili gli spostamenti.
    shield:
      ja-Hrkt: |-
        はかいりょく　ばつぐんの　おおきな
        ハサミだが　おもすぎるので
        たたかわないときは　じゃまになる。
      ja: |-
        破壊力　抜群の　大きな
        ハサミだが　重すぎるので
        戦わないときは　じゃまになる。
      ko: |-
        큰 집게는 뛰어난 파괴력을
        지녔지만 너무 무거워서
        싸우지 않을 때는 거추장스럽다.
      zh-Hant: |-
        巨大的鉗子破壞力十足，
        但是因為太過沉重，
        不戰鬥的時候就很礙事。
      zh-Hans: |-
        巨大的钳子破坏力十足，
        但是因为太过沉重，
        不战斗的时候就很碍事。
      en: |-
        Its oversized claw is very powerful, but when it’s
        not in battle, the claw just gets in the way.
      fr: |-
        Sa pince gigantesque possède une puissance
        destructrice phénoménale, mais hors combat,
        son poids devient un handicap.
      de: |-
        Seine Riesenschere ist sehr stark, aber wenn es
        nicht kämpft, kommt sie ihm häufig in die Quere.
      es: |-
        Su gran pinza posee una potencia devastadora,
        pero su peso excesivo la convierte en un estorbo
        fuera del terreno de combate.
      it: |-
        La sua chela più grande ha una potenza
        distruttiva fenomenale, ma fuori dalla lotta
        gli è d’impiccio per via del peso.
