    x:
      ja-Hrkt: |-
        かたい　ハサミは　１まんばりきの
        パワーを　もっているが
        おおきすぎて　うごきが　にぶい。
      ja: |-
        硬い　ハサミは　１万馬力の
        パワーを　持っているが
        大きすぎて　動きが　鈍い。
      ko: |-
        단단한 집게는 1만 마력의
        파워를 지녔지만
        너무 커서 움직임이 둔하다.
      en: |-
        Its large and hard pincer has 10,000-horsepower
        strength. However, being so big, it is unwieldy
        to move.
      fr: |-
        Sa grosse pince développe une puissance de
        10 000 CV. Toutefois, sa taille imposante la rend
        difficile à utiliser.
      de: |-
        Die Kraft seiner großen und harten Schere
        entspricht 10 000 PS. Durch die Größe ist sie
        aber auch äußerst unhandlich und sperrig.
      es: |-
        La pinza tan grande que tiene posee una fuerza de
        10 000 caballos de potencia. Pero, por su gran
        tamaño, cuesta moverla.
      it: |-
        La chela più grande sprigiona una potenza di
        10.000 CV. Le dimensioni gli rendono difficili
        gli spostamenti.
    'y':
      ja-Hrkt: |-
        ぶかっこうに　おおきくなった
        ハサミを　いきおいよく　もちあげると
        バランスがくずれ　よたついてしまう。
      ja: |-
        不格好に　大きくなった
        ハサミを　勢いよく　持ち上げると
        バランスが　崩れ　よたついてしまう。
      ko: |-
        볼품없이 크게 자라난
        집게를 기세 좋게 들고 걷다 보면
        밸런스가 무너져 뒤뚱거리게 된다.
      en: |-
        Its pincers grow peculiarly large. If it lifts the
        pincers too fast, it loses its balance and staggers.
      fr: |-
        Sa pince devient énorme. S’il la soulève trop vite,
        il risque de perdre l’équilibre.
      de: |-
        Seine Scheren werden sehr groß. Hebt es sie
        zu schnell, verliert es die Balance und strauchelt.
      es: |-
        Su pinza es muy grande. Si la levanta demasiado
        rápido, pierde el equilibrio y se tambalea.
      it: |-
        Una delle sue chele è particolarmente grande. Se la
        alza troppo rapidamente può perdere l’equilibrio.
    omega-ruby:
      ja-Hrkt: |-
        キングラーは　きょだいな　ハサミを　ふって
        なかまどうしで　あいずを　おくりあっているが
        ハサミが　おもすぎて　すぐに　つかれてしまう。
      ja: |-
        キングラーは　巨大な　ハサミを　振って
        仲間同士で　合図を　送りあっているが
        ハサミが　重すぎて　すぐに　疲れてしまう。
      ko: |-
        킹크랩은 거대한 집게를 휘둘러
        동료 간에 신호를 보내지만
        집게가 무거워서 곧 지쳐버린다.
      en: |-
        Kingler has an enormous, oversized claw. It waves this huge
        claw in the air to communicate with others. However, because
        the claw is so heavy, the Pokémon quickly tires.
      fr: |-
        Krabboss est doté d’une pince gigantesque, surdimensionnée.
        Il l’agite en l’air pour communiquer avec ses semblables.
        En revanche, sa pince est tellement lourde que ce Pokémon
        se fatigue très vite.
      de: |-
        Kingler hat eine riesige Schere. Es winkt damit, um mit
        anderen zu kommunizieren. Da seine Schere aber so
        schwer ist, wird dieses Pokémon schnell müde.
      es: |-
        Kingler tiene una pinza enorme y descomunal que usa
        agitándola en el aire para comunicarse con otros. Lo malo es
        que, al pesarle tanto, se cansa enseguida.
      it: |-
        Kingler è dotato di un’enorme chela, che brandisce nell’aria
        per comunicare con i suoi simili. Tuttavia, dato il notevole
        peso della chela sovradimensionata, il Pokémon si stanca
        in fretta.
    alpha-sapphire:
      ja-Hrkt: |-
        キングラーは　きょだいな　ハサミを　ふって
        なかまどうしで　あいずを　おくりあっているが
        ハサミが　おもすぎて　すぐに　つかれてしまう。
      ja: |-
