    lets-go-pikachu:
      ja-Hrkt: |-
        かたほうだけ　きょだいか　した
        ハサミは　こうてつの　かたさと
        １まんばりきを　もつが　おもすぎる。
      ja: |-
        片方だけ　巨大か　した
        ハサミは　鋼鉄の　硬さと
        １万馬力を　もつが　重すぎる。
      ko: |-
        한쪽만 거대해진 집게는
        강철 같은 단단함과 1만 마력의
        힘을 지녔지만 너무 무겁다.
      zh-Hant: |-
        只有一邊變得巨大的鉗子有著
        鋼鐵般的硬度和１萬馬力的力量，
        但實在是太重了。
      zh-Hans: |-
        一边的钳子很是巨大，
        虽说硬如钢铁还拥有
        １万马力，但还是太重了。
      en: |-
        One claw grew massively and is as hard as steel.
        It has 10,000-horsepower strength.
        However, it is too heavy.
      fr: |-
        Sa grosse pince, dure comme de l’acier,
        est d’une puissance incommensurable,
        mais elle est trop lourde.
      de: |-
        Seine größere Schere ist zwar hart wie Stahl
        und verfügt über eine außerordentliche Stärke,
        aber gleichzeitig ist sie auch extrem schwer.
      es: |-
        Una de sus pinzas, enorme y dura como el
        acero, tiene 10 000 CV. No obstante, resulta
        demasiado pesada.
      it: |-
        Una delle sue chele è cresciuta a dismisura
        ed è dura come l’acciaio. Può sprigionare
        una potenza di 10.000 CV, ma è pesantissima.
    lets-go-eevee:
      ja-Hrkt: |-
