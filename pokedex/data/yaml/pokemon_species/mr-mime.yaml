    sword:
      ja-Hrkt: |-
        おおきな　てのひらは　パントマイムを
        するために　はったつ　したと
        かんがえる　がくしゃも　おおい。
      ja: |-
        大きな　手のひらは　パントマイムを
        するために　発達　したと
        考える　学者も　多い。
      ko: |-
        커다란 손바닥은 팬터마임을
        하기 위해 발달했다고
        생각하는 학자도 많다.
      zh-Hant: |-
        有很多學者認為
        牠大大的手掌是因為要
        表演默劇而發達起來的。
      zh-Hans: |-
        有很多学者认为，
        它大大的手掌是因为要
        表演默剧而发达起来的。
      en: |-
        The broadness of its hands may be no
        coincidence—many scientists believe its palms
        became enlarged specifically for pantomiming.
      fr: |-
        De nombreux savants pensent que ses mains
        se sont développées pour faire de la pantomime.
      de: |-
        Viele Forscher glauben, seine Hände hätten nur
        deshalb so eine beachtliche Größe angenommen,
        damit es Pantomime praktizieren kann.
      es: |-
        Muchos estudiosos sostienen que el desarrollo
        de sus enormes manos se debe a su afán por
        practicar la pantomima.
      it: |-
        Molti studiosi ritengono che abbia sviluppato
        mani così grandi perché gli sono utili per
        la mimica.
    shield:
      ja-Hrkt: |-
        パントマイムが　とくい。　ゆびから
        だした　はどうで　かべを　つくり
        あまたの　こうげきから　みをまもる。
      ja: |-
        パントマイムが　得意。　指から
        出した　波動で　壁を　つくり
        あまたの　攻撃から　身を守る。
      ko: |-
        팬터마임이 특기다. 손가락에서
        내보내는 파동으로 벽을 만들어
        갖은 공격으로부터 몸을 지킨다.
      zh-Hant: |-
        擅長表演默劇。
        用手指放出的波動製造牆壁，
        保護自己免於大多數的攻擊。
      zh-Hans: |-
        擅长表演默剧。
        用手指放出的波动制造墙壁，
        保护自己免于大多数攻击。
      en: |-
        It’s known for its top-notch pantomime skills.
        It protects itself from all sorts of attacks by
        emitting auras from its fingers to create walls.
      fr: |-
        Son talent pour le mime est indéniable.
        Il émet des ondes du bout des doigts pour créer
        un mur qui le protège de nombreuses attaques.
      de: |-
        Es ist für die Pantomime geboren. Zur Abwehr
        unterschiedlichster Angriffe erzeugt es mit einem
        Kraftfeld aus seinen Fingerspitzen Schutzwände.
      es: |-
        Domina con maestría la pantomima. La barrera
        generada con las ondas que emite por los dedos
        le permite protegerse de numerosos ataques.
      it: |-
        È un ottimo mimo. Con le onde che emette
        dalle dita può creare una barriera che lo
        protegge da molti attacchi.
    legends-arceus:
      en: |-
        The behavior of this clown-like Pokémon reminds one of
        pantomime. It creates invisible walls using a force emitted
        from its fingertips.
