    ultra-sun:
      ja-Hrkt: |-
        すばらしい　パントマイムの　うでまえ。
        みとれている　あいだに　いつのまにか
        ほんとうに　かべが　できているのだ。
      ja: |-
        素晴らしい　パントマイムの　腕前。
        見とれている　間に　いつの間にか
        本当に　壁が　できているのだ。
      ko: |-
        팬터마임 실력이 굉장하다.
        넋을 놓고 보다 보면
        어느새 진짜 벽이 나타난다.
      zh-Hant: |-
        實力出神入化的默劇高手。
        當人們看牠的表演看到入神時，
        不知不覺間眼前會出現真正的牆壁。
      zh-Hans: |-
        有着非凡的默剧表演实力。
        在你看入迷的时候，不知不觉间
        就会出现一面真正的墙壁。
      en: |-
        Its pantomime skills are wonderful. You may
        become enraptured while watching it, but next
        thing you know, Mr. Mime has made a real wall.
      fr: |-
        Il est tellement doué pour l’art du mime qu’il est
        capable de faire apparaître un vrai mur sous
        le regard médusé de son public.
      de: |-
        Sein Können als Pantomime ist verblüffend. Vor
        lauter Bewunderung merkt man gar nicht, wie
        plötzlich eine echte Wand vor einem erscheint.
      es: |-
        Su talento para el mimo es tal que resulta
        cautivador, y llega a crear muros de verdad sin
        que quien lo observa se dé cuenta.
      it: |-
        Con le sue eccezionali abilità di mimo incanta
        gli spettatori e, prima che se ne accorgano,
        crea dei muri in tutto e per tutto reali.
    ultra-moon:
      ja-Hrkt: |-
        パントマイムで　みえない　かべを
        うみだす。　かんしんして　あげないと
        おうふくビンタで　おそってくるぞ。
      ja: |-
        パントマイムで　見えない　壁を
        生みだす。　感心して　あげないと
        おうふくビンタで　襲ってくるぞ。
      ko: |-
        팬터마임으로 보이지 않는 벽을
        만들어 낸다. 감탄하지 않으면
        연속뺨치기로 공격해 온다.
      zh-Hant: |-
        會用默劇製造出看不見的牆壁。
        如果不讚美牠的話，
        連環巴掌就會向你襲來。
      zh-Hans: |-
        能通过默剧生成一道看不见的墙壁。
        如果不赞美它的话，
        连环巴掌就会向你袭来。
      en: |-
        It creates invisible walls with its pantomiming.
        If you don’t act impressed, it will attack you
        with a double slap!
      fr: |-
        Grâce à ses talents de mime, il est capable de
        faire apparaître de vrais murs. Applaudissez-le,
        au risque de recevoir une ou deux Torgnoles !
      de: |-
        Durch Pantomime lässt es unsichtbare Wände
        entstehen. Wer davon nicht beeindruckt ist,
        wird mit einem Duplexhieb bestraft.
      es: |-
        Crea muros invisibles con sus grandes dotes de
        mimo. Quien no se muestre impresionado recibirá
        un sonoro Doble Bofetón.
      it: |-
        Crea pareti invisibili grazie alle sue doti da mimo.
        Attacca chiunque non mostri ammirazione
        con una sonora Doppiasberla.
    lets-go-pikachu:
      ja-Hrkt: |-
        パントマイムが　とくいで　いつでも
        れんしゅう　している。ないものでも
        そこに　あると　しんじこませる。
      ja: |-
        パントマイムが　得意で　いつでも
        練習　している。ない物　でも
        そこに　あると　信じこませる。
      ko: |-
        팬터마임이 특기로 언제나
        연습을 하고 있다. 없는 것도
        그곳에 있다고 믿게 만든다.
      zh-Hant: |-
        擅長演默劇，隨時都在練習。
        即使眼前空無一物，也能讓人
        相信有東西在那裡。
      zh-Hans: |-
        擅长表演哑剧，一直都在练习。
        即使空无一物，也能让人
        觉得那里真的有东西存在。
      en: |-
        Always practicing its pantomime act.
        It makes enemies believe something exists
        that really doesn’t.
      fr: |-
        Ce Pokémon très doué pour le mime s’entraîne
        sans cesse. Il arrive à faire croire que quelque
        chose d’inexistant est réel.
      de: |-
        Pantimos ist begabt im Mienenspiel und trainiert
        dieses jederzeit. Es kann andere dazu verleiten,
        Dinge zu sehen, die gar nicht existieren.
      es: |-
        Practica constantemente la pantomima. Tal es
        su maestría que puede convencer a quien lo
        observe de la existencia de algo que no es real.
      it: |-
        È molto abile nella mimica e si esercita
        in continuazione. Chi lo osserva crede
        di vedere cose che in realtà non esistono.
    lets-go-eevee:
      ja-Hrkt: |-
        パントマイムが　とくいで　いつでも
