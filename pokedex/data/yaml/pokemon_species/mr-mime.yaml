mr-mime:
  base_happiness: 50
  capture_rate: 45
  color: pink
  egg_groups:
    - humanshape
  evolution_chain: mr-mime
  evolves_from: mime-jr
  flavor_text:
    red:
      en: |-
        If interrupted
        while it is
        miming, it willslap around the
        offender with its
        broad hands.
    blue:
      en: |-
        If interrupted
        while it is
        miming, it willslap around the
        offender with its
        broad hands.
    yellow:
      en: |-
        Always practices
        its pantomime act.
        It makes enemiesbelieve something
        exists that
        really doesn't.
    gold:
      en: |-
        A skilled mime
        from birth, it
        gains the abilityto create invisi­
        ble objects as it
        matures.
    silver:
      en: |-
        Its fingertips
        emit a peculiar
        force field thathardens air to
        create an actual
        wall.
    crystal:
      en: |-
        It uses the
        mysterious
        power it has inits fingers to
        solidify air into
        an invisible wall.
    ruby:
      en: |-
        MR. MIME is a master of pantomime.
        Its gestures and motions convince
        watchers that something unseeableactually exists. Once it is believed,
        it will exist as if it were a real thing.
    sapphire:
      en: |-
        MR. MIME is a master of pantomime.
        Its gestures and motions convince
        watchers that something unseeableactually exists. Once it is believed,
        it will exist as if it were a real thing.
    emerald:
      en: |-
        A MR. MIME is a master of pantomime. It can
        convince others that something unseeable
        actually exists. Once believed, the
        imaginary object does become real.
    firered:
      en: |-
        It is adept at conning people. It is said
        to be able to create walls out of thin
        air by miming.
    leafgreen:
      en: |-
        If interrupted while it is miming, it will
        suddenly DOUBLESLAP the offender with its
        broad hands.
    diamond:
      en: |-
        It is a pantomime expert that can
        create invisible but solid walls
        using miming gestures.
    pearl:
      en: |-
        Emanations from its fingertips
        solidify the air into invisible walls
        that repel even harsh attacks.
    platinum:
      en: |-
        It shapes an invisible wall in midair
        by minutely vibrating its fingertips
        to stop molecules in the air.
    heartgold:
      en: |-
        A skilled mime from birth,
        it gains the ability to create
        invisible objects as it matures.
    soulsilver:
      en: |-
        Its fingertips emit a peculiar
        force field that hardens air to
        create an actual wall.
    black:
      en: |-
        It shapes an invisible wall in midair
        by minutely vibrating its fingertips
        to stop molecules in the air.
      fr: |-
        En modifiant les molécules de l’air
        du bout de ses doigts, il parvient
        à créer un mur invisible devant lui.
    white:
      en: |-
        It shapes an invisible wall in midair
        by minutely vibrating its fingertips
        to stop molecules in the air.
      fr: |-
        En modifiant les molécules de l’air
        du bout de ses doigts, il parvient
        à créer un mur invisible devant lui.
    black-2:
      en: |-
        It shapes an invisible wall in midair
        by minutely vibrating its fingertips
        to stop molecules in the air.
    white-2:
      en: |-
        It shapes an invisible wall in midair
        by minutely vibrating its fingertips
        to stop molecules in the air.
    x:
      ja-Hrkt: |-
        ゆびさきから　だす　はどうが
        くうきを　かためて　カベを　つくる。
        はげしい　こうげきも　はねかえす。
      ja: |-
        指先から　出す　波動が
        空気を　固めて　壁を　作る。
        激しい　攻撃も　跳ね返す。
      ko: |-
        손가락 끝에서 내는 파동이
        공기를 굳혀서 벽을 만든다.
        격렬한 공격도 튕겨 낸다.
      en: |-
        Emanations from its fingertips solidify the air into
        invisible walls that repel even harsh attacks.
      fr: |-
        Les murs invisibles qu’il matérialise du bout des doigts
        repoussent les attaques les plus puissantes.
      de: |-
        Seine Fingerspitzen sondern etwas ab, das die Luft
        zu einer schützenden Wand werden lässt.
      es: |-
        Para repeler ataques, solidifica el aire y crea muros
        invisibles con emanaciones de sus dedos.
      it: |-
        Con le dita solidifica l’aria e crea pareti invisibili
        che respingono gli attacchi più violenti.
    'y':
      ja-Hrkt: |-
        ひとを　しんじこませるのが　うまい。
        パントマイムで　つくったカベが
        ほんとうに　あらわれるという。
      ja: |-
        人を　信じこませるのが　うまい。
        パントマイムで　作った　壁が
        本当に　現れるという。
      ko: |-
        사람 속이기를 잘한다.
        팬터마임으로 만든 벽이
        정말로 나타난다고 한다.
      en: |-
        It is adept at conning people. It is said to be able
        to create walls out of thin air by miming.
      fr: |-
        Il adore imiter les gens. On le dit capable de créer
        de véritables murs juste en les mimant.
      de: |-
        Es ist geschickt darin, Menschen zu beeinflussen.
        Man sagt, es könne dünne Wände aus Luft nur durch
        Mimen entstehen lassen.
      es: |-
        Dicen que puede hacer un muro a partir del aire
        mediante la pantomima. Es experto en crear ilusiones
        ópticas.
      it: |-
        Si diletta a imbrogliare la gente. Si dice che sia in
        grado di creare pareti d’aria servendosi della mimica.
    omega-ruby:
      ja-Hrkt: |-
        めに　みえない　ものを　みぶりで　そこに　あると
        しんじこませる　パントマイムの　たつじん。
        しんじさせた　ものは　ほんとうに　あらわれる。
      ja: |-
        目に　見えない　ものを　身振りで　そこに　あると
        信じ込ませる　パントマイムの　達人。
        信じさせた　ものは　本当に　現れる。
      ko: |-
        몸짓으로 눈에 보이지 않는 것이 그곳에
        있다고 믿게 만드는 팬터마임의 달인이다.
        있다고 믿게 만든 것은 정말로 나타난다.
      en: |-
        Mr. Mime is a master of pantomime. Its gestures and motions
        convince watchers that something unseeable actually exists.
        Once the watchers are convinced, the unseeable thing exists
        as if it were real.
      fr: |-
        M. Mime est un pantomime hors pair. Ses gestes et ses
        mouvements parviennent à faire croire que quelque chose
        d’invisible existe réellement. Lorsqu’on y croit, ces choses
        deviennent palpables.
      de: |-
        Pantimos ist ein Meister der Pantomime. Seine Gesten und
        Bewegungen machen den Zuschauer glauben, dass etwas
        Unsichtbares tatsächlich existiert. Wenn ein Objekt für real
        gehalten wird, beginnt es, wirklich zu existieren.
      es: |-
        Mr. Mime es un experto en pantomima. Con sus gestos y
        movimientos es capaz de convencer a sus espectadores de
        que algo existe, cuando en realidad no es así. Pero, cuando
        el público se lo cree, las ilusiones se hacen realidad.
      it: |-
        Mr. Mime è un esperto di mimica. La sua gestualità e i suoi
        movimenti convincono l’osservatore dell’esistenza di oggetti
        invisibili, che saranno percepiti come concreti e reali.
    alpha-sapphire:
      ja-Hrkt: |-
        めに　みえない　ものを　みぶりで　そこに　あると
        しんじこませる　パントマイムの　たつじん。
        しんじさせた　ものは　ほんとうに　あらわれる。
      ja: |-
