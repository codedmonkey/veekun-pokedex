obstagoon:
  base_happiness: 50
  capture_rate: 45
  color: gray
  egg_groups:
    - ground
  evolution_chain: zigzagoon
  evolves_from: linoone
  flavor_text:
    sword:
      ja-Hrkt: |-
        すさまじい　せいりょうを　もつ。
        シャウトとともに　いかくするさまは
        ブロッキングと　よばれている。
      ja: |-
        凄まじい　声量を　もつ。
        シャウトとともに　威嚇するさまは
        ブロッキングと　呼ばれている。
      ko: |-
        엄청난 성량을 가졌다.
        샤우팅하며 위협하는 모습은
        블로킹이라 불린다.
      zh-Hant: |-
        能夠發出驚人的音量。
        牠在大叫的同時威嚇對手
        的樣子被稱為「攔堵」。
      zh-Hans: |-
        能够发出惊人的音量。
        它在大叫的同时威吓对手
        的样子被称为“拦堵”。
      en: |-
        Its voice is staggering in volume. Obstagoon
        has a tendency to take on a threatening posture
        and shout—this move is known as Obstruct.
      fr: |-
        Il possède une puissance vocale remarquable.
        On appelle Blocage sa technique qui consiste
        à intimider l’ennemi avec son cri guttural.
      de: |-
        Es verfügt über eine beeindruckende Stimmkraft.
        Sein von Schreien begleitetes Drohverhalten
        nennt man auch „Abblocker“.
      es: |-
        La potencia de su voz es realmente pasmosa. La
        técnica que usa para intimidar al rival mientras
        grita recibe el nombre de Obstrucción.
      it: |-
        Ha una potenza vocale impressionante. Quando
        assume la tipica posa intimidatoria e si mette a
        urlare, si dice che sta facendo “sbarramento”.
    shield:
      ja-Hrkt: |-
        ケンカを　くりかえし　しんか。
        うでをクロスし　さけぶ　おたけびは
        どんな　あいても　ひるませるぞ。
      ja: |-
        ケンカを　繰り返し　進化。
        腕をクロスし　叫ぶ　雄叫びは
        どんな　相手も　怯ませるぞ。
      ko: |-
        싸움을 반복하면서 진화한다.
        팔을 크로스하고 우렁차게 외치면
        어떤 상대라도 풀죽게 된다.
      zh-Hant: |-
        在不斷的鬥爭中得到了進化。
        牠交叉著雙臂發出的怒吼
        能讓一切對手都為之膽怯。
      zh-Hans: |-
        在不断的斗争中得到了进化。
        它交叉着双臂发出的怒吼
        能让一切对手都为之胆怯。
      en: |-
        It evolved after experiencing numerous fights.
        While crossing its arms, it lets out a shout that
        would make any opponent flinch.
      fr: |-
        Il a évolué après avoir enchaîné de nombreux
        combats. Le cri qu’il pousse lorsqu’il fait un « X »
        avec ses bras ébranle n’importe quel ennemi.
      de: |-
        Durch das Austragen unzähliger Kämpfe hat es
        sich entwickelt. Formt es mit den Armen ein „X“
        und stößt einen Schrei aus, verschreckt das jeden.
      es: |-
        Evoluciona tras haber librado numerosas peleas.
        El grito de guerra que profiere mientras pone los
        brazos en cruz atemoriza a cualquier rival.
      it: |-
        Si è evoluto a forza di lottare. L’urlo di guerra
        che lancia mentre mette le braccia a X è in
        grado di terrorizzare qualsiasi avversario.
