shiinotic:
  base_happiness: 50
  capture_rate: 75
  color: purple
  egg_groups:
    - plant
  evolution_chain: morelull
  evolves_from: morelull
  flavor_text:
    sun:
      ja-Hrkt: |-
        よなかに　マシェードのすむ　もりに
        いくのは　きけん。　あやしいひかりに
        まどわされ　にどと　かえれなくなる。
      ja: |-
        夜中に　マシェードの棲む　森に
        いくのは　危険。　怪しい光に
        惑わされ　二度と　帰れなくなる。
      ko: |-
        한밤중에 마셰이드가 사는 숲에
        가는 것은 위험하다. 이상한빛에
        유인되어 다시는 돌아올 수 없게 된다.
      zh-Hant: |-
        深夜前往燈罩夜菇棲息的森林
        是很危險的。會被怪異的光線
        迷惑，從此再也回不來。
      zh-Hans: |-
        深夜前往灯罩夜菇栖息的森林
        是很危险的。会被怪异的光线
        诱惑，再也回不来了。
      en: |-
        Forests where Shiinotic live are treacherous to
        enter at night. People confused by its strange
        lights can never find their way home again.
      fr: |-
        Il est risqué de s’aventurer la nuit dans un bois
        peuplé de Lampignon. Attirés par leur lumière
        envoûtante, certains n’en sont jamais revenus.
      de: |-
        Nachts sollte man Wälder meiden, in denen
        Lamellux leben. Ihr unheimliches Licht raubt
        jedem die Orientierung.
      es: |-
        Es peligroso adentrarse por la noche en un
        bosque habitado por Shiinotic. Su luz confunde
        a los caminantes, que terminan perdiéndose.
      it: |-
        Meglio non avventurarsi di notte in un bosco
        abitato da questi Pokémon, perché le loro luci
        fanno perdere il senso dell’orientamento.
    moon:
      ja-Hrkt: |-
        てんめつする　ほうしを　ふきだし
        ねむりに　いざなう。　ねむった
        えものの　せいきを　すいとる。
      ja: |-
        点滅する　胞子を　吹き出し
        眠りに　誘う。　眠った
        獲物の　精気を　吸い取る。
      ko: |-
        깜빡이는 포자를 뿜어내어
        잠으로 유도한다. 잠든
        먹이의 정기를 빨아들인다.
      zh-Hant: |-
        會噴出閃爍的孢子讓獵物睡著，
        再從睡著的獵物身上吸取精氣。
      zh-Hans: |-
        喷出闪烁的孢子诱使对方睡眠。
        会吸取睡着了的猎物的精气。
      en: |-
        It emits flickering spores that cause drowsiness.
        When its prey succumb to sleep, this Pokémon
        feeds on them by sucking in their energy.
      fr: |-
        Il projette des spores clignotantes qui
        hypnotisent et endorment ses proies,
        avant de venir absorber leur énergie vitale.
      de: |-
        Speit blinkende Sporen, die eine einschläfernde
        Wirkung haben. Schläft die Beute ein, wird ihr
        die Lebenskraft ausgesaugt.
      es: |-
        Las esporas parpadeantes que despide tienen
        un efecto somnífero. Absorbe la vitalidad de su
        presa cuando esta se queda dormida.
      it: |-
        Libera spore soporifere che emettono una luce
        intermittente di cui si serve per addormentare
        le sue prede, a cui poi succhia l’energia vitale.
    ultra-sun:
      ja-Hrkt: |-
        えものを　ねむらせ　うでの　さきから
        せいきを　うばう。　なかまが　よわると
        せいきを　おくって　たすけてあげる。
      ja: |-
        獲物を　眠らせ　腕の　先から
        生気を　奪う。　仲間が　弱ると
        生気を　送って　助けてあげる。
      ko: |-
        먹이를 잠들게 하고 팔 끝으로
        생기를 빼앗는다. 동료가 약해지면
        생기를 보내 도와준다.
      zh-Hant: |-
        會讓獵物睡著，然後用手臂前端
        奪取獵物的精氣。在夥伴虛弱的時候，
        會輸送精氣過去拯救對方。
      zh-Hans: |-
        让猎物睡着，然后从手腕处夺走
        对方的生命气息。伙伴虚弱的话，
        就会输送生命气息给予拯救。
      en: |-
        It puts its prey to sleep and siphons off their
        vitality through the tip of its arms. If one of its
        kind is weakened, it helps by sending it vitality.
      fr: |-
        Il endort ses victimes puis aspire leur énergie
        vitale avec ses doigts. Il aide ses congénères
        affaiblis en partageant cette énergie avec eux.
      de: |-
        Es lullt seine Gegner in den Schlaf und raubt
        ihnen über seine Fingerspitzen die Lebenskraft.
        Diese schickt es schwächelnden Kameraden.
      es: |-
        Duerme a su presa y le arrebata la vitalidad con
        sus brazos. Si otro Shiinotic se encuentra en
        apuros, le transmite sus fuerzas.
      it: |-
        Addormenta la preda e utilizza le estremità delle
        sue braccia per rubarle l’energia vitale, che può
        anche trasmettere ai compagni in difficoltà.
    ultra-moon:
      ja-Hrkt: |-
        なわばりを　めぐり　パラセクトと
        あらそい　はじめると　あたりいちめん
        ほうしまみれに　なってしまうぞ。
      ja: |-
        縄張りを　巡り　パラセクトと
        争い　はじめると　あたり一面
        胞子まみれに　なってしまうぞ。
      ko: |-
        영역을 두고 파라섹트와
        싸움을 시작하면 부근 일대는
        포자투성이가 되어 버린다.
      zh-Hant: |-
        一旦為了爭奪地盤而
        與派拉斯特展開鬥爭，
        周圍就會變得到處都是孢子。
      zh-Hans: |-
        一旦围绕着领地问题
        与派拉斯特展开争斗，
        周围就会变得到处都是孢子。
      en: |-
        When it starts fighting for territory with
        Parasect, the entire area gets completely
        coated in spores!
      fr: |-
        Quand un conflit territorial éclate entre Parasect
        et lui, un brouillard de spores envahit toute
        la zone.
      de: |-
        Kommt es zwischen ihm und Parasek zu
        Revierkämpfen, ist hinterher die gesamte
        Umgebung mit Sporen bedeckt.
      es: |-
        Al rondar por su territorio, si se encuentra con
        un Parasect, competirá con él y acabarán
        dejando el lugar cubierto de esporas.
      it: |-
        Quando Shiinotic e Parasect lottano per
        il dominio di un territorio, finiscono per
        coprire ogni cosa con le loro spore.
    sword:
      ja-Hrkt: |-
        てんめつする　ほうしの　ひかりで
        えものを　おびきよせて　ねむらせる。
        ゆびさきから　せいきを　すいとる。
      ja: |-
        点滅する　胞子の　光りで
        獲物を　おびき寄せて　眠らせる。
        指先から　生気を　吸い取る。
      ko: |-
        깜빡이는 포자의 빛으로
        먹이를 유인해서 잠들게 한다.
        손끝으로 생기를 흡수한다.
      zh-Hant: |-
        用孢子閃爍著的光
        吸引獵物，讓對方睡著。
        會從指尖吸收精氣。
      zh-Hans: |-
        用孢子闪烁着的光
        吸引猎物，让对方睡着。
        会从指尖吸收精气。
      en: |-
        Its flickering spores lure in prey and put them to
        sleep. Once this Pokémon has its prey snoozing,
        it drains their vitality with its fingertips.
      fr: |-
        Il attire ses proies et les endort grâce
        au clignotement de ses spores. Il aspire ensuite
        leur énergie vitale du bout de ses doigts.
      de: |-
        Mit blinkenden Sporen lullt es seine Beute in
        den Schlaf und saugt ihr dann über seine
        Fingerspitzen die Lebenskraft aus.
      es: |-
        Atrae y duerme a su presa con la luz parpadeante
        de sus esporas y luego le absorbe la energía vital
        con la punta de los dedos.
      it: |-
        Attira a sé la preda con la luce intermittente
        delle sue spore e l’addormenta. Poi ne succhia
        l’energia vitale con le estremità delle dita.
    shield:
      ja-Hrkt: |-
        まよなか　もりの　おくに　あかりを
        みつけても　ちかづいては　いけない。
        マシェードに　ねむらされてしまうぞ。
      ja: |-
        真夜中　森の　奥に　灯りを
        見つけても　近づいては　いけない。
        マシェードに　眠らされてしまうぞ。
      ko: |-
        한밤중에 숲속에서 빛을
        발견하더라도 다가가면 안 된다.
        마셰이드가 잠들어 버리게 한다.
      zh-Hant: |-
        如果半夜裡在森林的深處
        看見光亮，記住千萬不要接近。
        燈罩夜菇會讓你睡著的。
      zh-Hans: |-
        如果大半夜在森林的深处
        看见光亮，记住千万不要接近。
        灯罩夜菇会让你睡着的。
      en: |-
        If you see a light deep in a forest at night,
        don’t go near. Shiinotic will make you fall
        fast asleep.
      fr: |-
        Il ne faut pas s’approcher des lumières qui luisent
        la nuit au fond des bois, sous peine de se faire
        endormir par un Lampignon.
      de: |-
        Stößt man im nächtlichen Wald auf ein Leuchten,
        sollte man sich diesem nicht nähern. Sonst wird
        man nämlich von Lamellux in den Schlaf gelullt.
      es: |-
        Conviene no acercarse si se avistan luces en la
        espesura del bosque en plena noche, ya que
        podrían ser las esporas soporíferas de Shiinotic.
      it: |-
        Se di notte si scorge una luce nel cuore della
        foresta, meglio non avvicinarsi: si rischia di finire
        vittima delle spore soporifere di Shiinotic.
