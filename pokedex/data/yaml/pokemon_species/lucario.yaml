lucario:
  base_happiness: 50
  capture_rate: 45
  color: blue
  egg_groups:
    - ground
    - humanshape
  evolution_chain: riolu
  evolves_from: riolu
  flavor_text:
    diamond:
      en: |-
        It has the ability to sense the
        auras of all things.
        It understands human speech.
    pearl:
      en: |-
        By catching the aura emanating
        from others, it can read their
        thoughts and movements.    
    platinum:
      en: |-
        A well-trained one can sense auras
        to identify and take in the feelings
        of creatures over half a mile away.
    heartgold:
      en: |-
        It’s said that no foe can remain invisible
        to LUCARIO, since it can detect auras.
        Even foes it could not otherwise see.
    soulsilver:
      en: |-
        It’s said that no foe can remain invisible
        to LUCARIO, since it can detect auras.
        Even foes it could not otherwise see.
    black:
      en: |-
        A well-trained one can sense auras
        to identify and take in the feelings
        of creatures over half a mile away.
      fr: |-
        Un spécimen bien entraîné peut
        sentir et identifier les émotions de
        quelqu’un à plus d’un kilomètre.
    white:
      en: |-
        A well-trained one can sense auras
        to identify and take in the feelings
        of creatures over half a mile away.
      fr: |-
        Un spécimen bien entraîné peut
        sentir et identifier les émotions de
        quelqu’un à plus d’un kilomètre.
    black-2:
      en: |-
        By reading the auras of all things,
        it can tell how others are feeling
        from over half a mile away.
    white-2:
      en: |-
        By reading the auras of all things,
        it can tell how others are feeling
        from over half a mile away.
    x:
      ja-Hrkt: |-
        あいての　はっする　はどうを
        キャッチすることで　かんがえや
        うごきを　よみとることが　できる。
      ja: |-
        相手の　発する　波動を
        キャッチすることで　考えや　動きを
        読み取ることが　できる。
      ko: |-
        상대가 발하는 파동을
        감지하여 생각이나
        움직임을 간파할 수 있다.
      en: |-
        By catching the aura emanating from others, it can
        read their thoughts and movements.
      fr: |-
        Il peut deviner les pensées et les mouvements des
        autres en analysant leur aura.
      de: |-
        Es nimmt die Aura seines Gegners wahr. So kann es
        dessen Gedanken und Bewegungen erkennen.
      es: |-
        Puede leer los pensamientos y movimientos de su
        adversario a través de su aura.
      it: |-
        Riesce a leggere i pensieri e i movimenti del
        nemico decifrando l’aura che questo emette.
    'y':
      ja-Hrkt: |-
        あらゆる　ものが　だす　はどうを
        よみとることで　１キロさきに　いる
        あいての　きもちも　りかいできる。
      ja: |-
        あらゆる　ものが　出す　波動を
        読みとることで　１キロ先に　いる
        相手の　気持ちも　理解できる。
      ko: |-
        모든 물건이 내는 파동을
        읽어내어 1km 앞에 있는
        상대의 마음도 이해할 수 있다.
      en: |-
        By reading the auras of all things, it can tell how
        others are feeling from over half a mile away.
      fr: |-
        Il peut sentir et identifier les émotions de quelqu’un
        à plus d’un kilomètre.
      de: |-
        Kann aus 1 km Entfernung die Gefühle anderer Wesen
        erfassen, indem es die Wellen liest, die sie aussenden.
      es: |-
        Emite unas ondas que le permiten percibir todo lo que
        se encuentre a 1 km, incluso los sentimientos de otras
        personas.
      it: |-
        Sa decifrare le onde emesse da ogni cosa. Questo gli
        permette di capire le emozioni di creature lontane
        anche 1 km.
    omega-ruby:
      ja-Hrkt: |-
        あいての　はっする　はどうを
        キャッチすることで　かんがえや
        うごきを　よみとることが　できる。
      ja: |-
        相手の　発する　波動を
        キャッチすることで　考えや　動きを
        読み取ることが　できる。
      ko: |-
        상대가 발하는 파동을
        감지하여 생각이나
        움직임을 간파할 수 있다.
      en: |-
        By catching the aura emanating from others, it can
        read their thoughts and movements.
      fr: |-
        Il peut deviner les pensées et les mouvements des autres
        en analysant leur aura.
      de: |-
        Es nimmt die Aura seines Gegners wahr. So kann es dessen
        Gedanken und Bewegungen erkennen.
      es: |-
        Puede leer los pensamientos y movimientos de su adversario
        a través de su aura.
      it: |-
        Riesce a leggere i pensieri e i movimenti del nemico decifrando
        l’aura che questo emette.
    alpha-sapphire:
      ja-Hrkt: |-
        あらゆる　ものが　だす　はどうを
        よみとることで　１キロさきに　いる
        あいての　きもちも　りかいできる。
      ja: |-
        あらゆる　ものが　出す　波動を
        読みとることで　１キロ先に　いる
        相手の　気持ちも　理解できる。
      ko: |-
        모든 물건이 내는 파동을
        읽어내어 1km 앞에 있는
        상대의 마음도 이해할 수 있다.
      en: |-
        By reading the auras of all things, it can tell how
        others are feeling from over half a mile away.
      fr: |-
        Il peut sentir et identifier les émotions de quelqu’un à plus
        d’un kilomètre.
      de: |-
        Kann aus 1 km Entfernung die Gefühle anderer Wesen
        erfassen, indem es die Wellen liest, die sie aussenden.
      es: |-
        Emite unas ondas que le permiten percibir todo lo que se
        encuentre a 1 km, incluso los sentimientos de otras personas.
      it: |-
        Sa decifrare le onde emesse da ogni cosa. Questo gli permette
        di capire le emozioni di creature lontane anche 1 km.
    sun:
      ja-Hrkt: |-
        よみとるだけ　ではなく　はどうを
        あやつる　ちからを　てに　いれた。
        たたかいにも　りよう　するぞ。
      ja: |-
        読み取るだけ　ではなく　波動を
        操る　力を　手に　入れた。
        戦いにも　利用　するぞ。
      ko: |-
        간파하는 것뿐만 아니라
        파동을 조종하는 힘을 얻었다.
        싸울 때도 이용한다.
      zh-Hant: |-
        不僅僅是讀取，
        還獲得了操控波導的能力。
        也會用於戰鬥。
      zh-Hans: |-
        不仅仅是读取，
        还获得了操控波导的能力。
        也会被用于战斗。
      en: |-
        Not only does it perceive auras, but it has also
        gained the power to control them. It employs
        them in battle.
      fr: |-
        Ne se contentant pas de percevoir les auras,
        il peut également les modifier. Il n’hésite pas
        à s’en servir en plein combat.
      de: |-
        Es kann Auren nicht nur wahrnehmen, sondern
        auch manipulieren. Diese Fähigkeit nutzt es
        beim Kämpfen.
      es: |-
        No solo es capaz de detectar auras, sino
        también de manipularlas. Esta habilidad le
        resulta muy útil durante los combates.
      it: |-
        Oltre a essere in grado di percepire l’aura,
        ha anche la capacità di controllarla.
        Sfrutta questa sua abilità anche nelle lotte.
    moon:
      ja-Hrkt: |-
        １キロさきの　いきものの　しゅるいや
        きもちを　キャッチする。　はどうを
        あやつり　むれで　えものを　かる。
      ja: |-
        １キロ先の　生き物の　種類や
        気持ちを　キャッチする。　波動を
        操り　群れで　獲物を　狩る。
      ko: |-
        1km 앞의 생물의 종류나
        기분을 캐치한다. 파동을
        이용해 무리로 먹이를 사냥한다.
      zh-Hant: |-
        能察覺到１公里外
        生物的種類和心情。
        操縱波導以群體形式狩獵。
      zh-Hans: |-
        能侦测到１公里开外
        生物的种类和心情。
        操纵波导以群体形式狩猎。
      en: |-
        They can detect the species of a living being—
        and its emotions—from over half a mile away.
        They control auras and hunt their prey in packs.
      fr: |-
        Il peut détecter les émotions des individus
        se trouvant à 1 km, ainsi que leur espèce.
        Il chasse en meute en se servant des auras.
      de: |-
        Es kann aus 1 km Entfernung die Art und auch
        die Gefühle von Lebewesen erfassen. Es jagt
        im Rudel und manipuliert die Aura der Beute.
      es: |-
        Detecta la presencia y los sentimientos de los
        seres vivos a más de 1 km de distancia,
        habilidad que aprovecha para cazar en grupos.
      it: |-
        Riesce a identificare creature ed emozioni a
        1 km di distanza. Sfrutta la sua capacità di
        percepire l’aura per cacciare in gruppo.
    ultra-sun:
      ja-Hrkt: |-
        せいしんを　しゅうちゅうして　はなつ
        はどうと　よばれる　ふしぎな　なみは
        おおいわをも　こなごなに　くだく。
      ja: |-
        精神を　集中して　放つ
        波動と　呼ばれる　不思議な　波は
        大岩をも　粉々に　砕く。
      ko: |-
        정신을 집중하고 발산하는
        파동이라고 불리는 신비한 파는
        큰 바위도 산산이 부숴 버린다.
      zh-Hant: |-
        集中精神後能放出一種
        被稱為波導的奇異波動，
        就連巨大的岩石都能粉碎。
      zh-Hans: |-
        它集中精神所放出的一种
        神奇的波，被称为波导，
        连巨大的岩石都能击得粉碎。
      en: |-
        It concentrates its mental energy and fires off
        mysterious waves called auras, which can crush
        boulders of large size to dust.
      fr: |-
        Il peut canaliser son énergie mentale pour
        déchaîner des auras mystérieuses capables
        de réduire d’énormes rochers en miettes.
      de: |-
        Unter starker Konzentration kann es rätselhafte
        Wellen von sich geben, die man Aura nennt.
        Damit kann es sogar große Felsen pulverisieren.
      es: |-
        Acumula poder espiritual y lo canaliza en forma
        de auras misteriosas capaces de hacer añicos
        incluso enormes rocas.
      it: |-
        È in grado di concentrare le sue energie
        spirituali per sprigionare un’aura che può
        frantumare anche grossi macigni.
    ultra-moon:
      ja-Hrkt: |-
        はどうの　なみで　あいての　きもちを
        キャッチする。　しりたくないことも
        わかるので　ストレスを　ためやすい。
      ja: |-
        波動の　波で　相手の　気持ちを
        キャッチする。　知りたくないことも
        わかるので　ストレスを　ためやすい。
      ko: |-
        파동의 파장으로 상대의 기분을
        캐치한다. 알고 싶지 않은 일도
        알게 되어 스트레스가 잘 쌓인다.
      zh-Hant: |-
        會用波導來偵測對手的心情。
        就連不想知道的事也會知道，
        所以很容易累積壓力。
      zh-Hans: |-
        用波导来侦测对手的心情。
        不想知道的事情也会知道，
        所以很容易累积压力。
      en: |-
        Lucario reads its opponent’s feelings with its
        aura waves. It finds out things it would rather
        not know, so it gets stressed out easily.
      fr: |-
        Grâce à ses auras, il peut détecter toutes les
        émotions de son adversaire, même celles qu’il
        préférerait ignorer et qui lui causent du stress.
      de: |-
        Es kann über die Auren anderer deren Gefühle
        wahrnehmen. Da es dabei auch Dinge erfährt,
        die es lieber nicht wüsste, ist es oft gestresst.
      es: |-
        Puede percibir sentimientos ajenos a través de
        su aura, pero averiguar cosas que preferiría no
        saber constituye una fuente de estrés para él.
      it: |-
        Riesce a identificare le emozioni dell’avversario
        tramite l’aura. A volte capta pensieri che
        preferirebbe ignorare e questo gli causa stress.
    sword:
      ja-Hrkt: |-
        おおいわも　こなごなに　くだく
        はどうと　よばれる　ちからを
        あやつって　えものを　かる。
      ja: |-
        大岩も　粉々に　砕く
        波動と　呼ばれる　力を
        操って　獲物を　狩る。
      ko: |-
        큰 바위도 산산조각 내는
        파동이라 불리는 힘을
        다뤄서 먹이를 사냥한다.
      zh-Hant: |-
        操作一種被稱為波導的力量
        來進行狩獵。這種力量就連
        巨大的岩石也能擊得粉碎。
      zh-Hans: |-
        操纵一种被称为波导的力量
        来进行狩猎。这种力量就连
        巨大的岩石也能击得粉碎。
      en: |-
        It controls waves known as auras, which are
        powerful enough to pulverize huge rocks.
        It uses these waves to take down its prey.
      fr: |-
        Il chasse ses proies en se servant d’une force
        appelée aura, dont la puissance est telle qu’elle
        lui permet de réduire un rocher en poussière.
      de: |-
        Es jagt seine Beute, indem es eine Kraft
        manipuliert, die Aura genannt wird. Dadurch
        kann es sogar große Felsen pulverisieren.
      es: |-
        Caza a sus presas manipulando una energía,
        denominada aura, cuya potencia es capaz incluso
        de hacer añicos rocas enormes.
      it: |-
        Caccia le prede usando un potere chiamato
        aura, in grado di ridurre in frantumi anche
        grossi macigni.
    shield:
      ja-Hrkt: |-
        ひとの　かんがえていることも
        わかるので　ただしい　こころの
        トレーナーにしか　なつかない。
      ja: |-
        人の　考えていることも
        わかるので　正しい　心の
        トレーナーにしか　懐かない。
      ko: |-
        사람이 생각하는 것도
        알 수 있기 때문에 정직한 마음을
        가진 트레이너만 따른다.
      zh-Hant: |-
        牠能理解人類的想法，
        因此只會去親近
        內心端正的訓練家。
      zh-Hans: |-
        他能理解人类的想法，
        因此只会去亲近
        内心端正的训练家。
      en: |-
        It can tell what people are thinking. Only Trainers
        who have justice in their hearts can earn this
        Pokémon’s trust.
      fr: |-
        Étant capable de lire ce que pensent les humains,
        ce Pokémon ne s’attache qu’aux Dresseurs dotés
        d’un cœur pur.
      de: |-
        Es kann die Gedanken von Menschen lesen.
        Deshalb lässt es sich nur auf Trainer ein, die
        ihr Herz auf dem rechten Fleck haben.
      es: |-
        Puede leer los pensamientos de la gente, por
        lo que establece lazos afectivos únicamente con
        Entrenadores de corazón noble.
      it: |-
        È in grado di comprendere anche i pensieri
        degli esseri umani. Per questo, si affeziona
        solo agli Allenatori dall’animo onesto.
