glastrier:
  base_happiness: 35
  capture_rate: 3
  color: white
  egg_groups:
    - no-eggs
  evolution_chain: glastrier
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        ひづめから　きょうりょくな　れいきを
        はなつ。　ほしいものは　なんでも
        ちからずくで　うばう　あばれんぼう。
      ja: |-
        蹄から　強力な　冷気を
        放つ。　欲しいものは　なんでも
        力尽くで　奪う　暴れん坊。
      ko: |-
        발굽에서 강력한 냉기를 발산한다.
        원하는 것은 무엇이든
        힘으로 빼앗는 폭군.
      zh-Hant: |-
        會從蹄子釋放出強烈的寒氣。
        性情暴躁，只要是自己想要
        的東西，就會強行去搶奪。
      zh-Hans: |-
        会从蹄子释放出强力的冷气。
        性格粗暴，只要是自己想要的
        东西，就会竭尽全力去抢夺。
      en: |-
        Glastrier emits intense cold from its hooves.
        It’s also a belligerent Pokémon—anything it
        wants, it takes by force.
      fr: |-
        Violent au point de s’emparer de tout ce qu’il
        désire par la force, ce Pokémon est capable
        de libérer un puissant air glacial de ses sabots.
      de: |-
        Aus seinen Hufen verströmt es eisige Kälte.
        Dieses ungestüme Pokémon nimmt sich alles,
        was es will, mit roher Gewalt.
      es: |-
        Libera un potente vaho gélido por las pezuñas.
        Un ser violento que no duda en tomar a la fuerza
        todo cuanto desea.
      it: |-
        Rilascia una potente aria gelida dagli zoccoli.
        È impetuoso e prende con la forza tutto ciò
        che vuole.
    shield:
      ja-Hrkt: |-
        すさまじい　かいりきの　もちぬし。
        かおを　おおう　こおりの　マスクは
        ダイヤモンドの　１００ばい　かたい。
      ja: |-
        凄まじい　怪力の　持ち主。
        顔を　覆う　氷の　マスクは
        ダイヤモンドの　１００倍　硬い。
      ko: |-
        굉장한 괴력을 가졌다.
        얼굴을 덮는 얼음 마스크는
        다이아몬드보다 100배 단단하다.
      zh-Hant: |-
        擁有十分驚人的怪力。
        遮住臉部的冰面罩比
        鑽石還要堅硬１００倍。
      zh-Hans: |-
        拥有十分惊人的怪力。
        戴在脸上的冰之面罩
        硬度是钻石的１００倍
      en: |-
        Glastrier has tremendous physical strength, and
        the mask of ice covering its face is 100 times
        harder than diamond.
      fr: |-
        Ce Pokémon à la force hors du commun porte
        un masque composé de glace cent fois plus
        solide que le diamant.
      de: |-
        Das Gesicht dieses außergewöhnlich starken
        Pokémon wird von einer Maske aus Eis bedeckt,
        die hundertmal härter als Diamant ist.
      es: |-
        Cuenta con una fuerza física sobrecogedora.
        La máscara de hielo que le cubre el rostro es
        cien veces más dura que el diamante.
      it: |-
        È dotato di una forza incommensurabile.
        La maschera di ghiaccio che gli ricopre il muso
        è cento volte più dura del diamante.
