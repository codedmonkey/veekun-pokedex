    black-2:
      en: |-
        Not even downy wool will grow on
        its rubbery, nonconductive patches
        of skin that prevent electrical shock.
    white-2:
      en: |-
        Not even downy wool will grow on
        its rubbery, nonconductive patches
        of skin that prevent electrical shock.
    x:
      ja-Hrkt: |-
        ふかふかの　たいもうは　でんきを
        ためやすいが　ゴムのような　ひふの
        おかげで　じぶんは　しびれない。
      ja: |-
        ふかふかの　体毛は　電気を
        ためやすいが　ゴムのような　皮膚の
        おかげで　自分は　しびれない。
      ko: |-
        푹신푹신한 털은 전기를
        모으기 쉽지만 고무 같은 피부
        덕분에 자신은 마비되지 않는다.
      en: |-
        Its fluffy fleece easily stores electricity. Its rubbery
        hide keeps it from being electrocuted.
      fr: |-
        Sa douce laine stocke facilement l’électricité.
        Sa peau caoutchouteuse prévient l’électrocution.
      de: |-
        Sein flauschiges Fell speichert Elektrizität.
        Seine Gummihaut schützt es vor Stromstößen.
      es: |-
        Su esponjosa lana almacena electricidad. Su piel
        gomosa evita que sea electrocutado.
      it: |-
        La soffice pelliccia raccoglie elettricità. Non resta
        fulminato grazie a uno strato di pelle gommosa.
    'y':
      ja-Hrkt: |-
        たいもうに　ためた　でんきが
        まんたんになると　しっぽが　ひかる。
        ふれると　しびれる　けを　とばす。
      ja: |-
        体毛に　ためた　電気が
        満タンになると　尻尾が　光る。
        触れると　しびれる　毛を　飛ばす。
      ko: |-
        털에 모아둔 전기가
        다 채워지면 꼬리가 반짝인다.
        접촉하면 마비되는 털을 날린다.
      en: |-
        If its coat becomes fully charged with electricity,
        its tail lights up. It fires hair that zaps on impact.
      fr: |-
        Sa queue s’allume lorsque sa laine se charge
        d’électricité. Il projette des poils électrifiés.
      de: |-
        Hat es sich mit Elektrizität aufgeladen, leuchtet sein
        Schweif und es feuert Haare ab, die sich entladen.
      es: |-
        Cuando su pelaje se carga de electricidad, su cola se
        enciende. Lanza pelo que explota al impacto.
      it: |-
        Se il suo manto è del tutto carico d’elettricità, la
        coda s’illumina. Lancia peli che danno la scossa.
    omega-ruby:
      ja-Hrkt: |-
        たいもうの　せいしつが　へんかするので　すくない
        りょうでも　たくさんの　でんきを　つくりだせる。
        でんきを　さえぎる　つるつるの　はだを　もつ。
      ja: |-
        体毛の　性質が　変化するので　少ない
        量でも　沢山の　電気を　つくりだせる。
        電気を　遮る　つるつるの　肌を　持つ。
      ko: |-
        털의 성질이 변화하기 때문에 적은
        양으로도 많은 전기를 만들어낸다.
        전기를 차단하는 반질반질한 피부를 가졌다.
      en: |-
        Flaaffy’s wool quality changes so that it can generate a high
        amount of static electricity with a small amount of wool.
        The bare and slick parts of its hide are shielded
        against electricity.
      fr: |-
        La qualité de la laine de Lainergie se modifie pour générer
        un maximum d’électricité statique avec un minimum de laine.
        Les sections glabres de sa peau sont résistantes à l’électricité.
      de: |-
        Die Qualität von Waatys Wolle verändert sich, sodass es mit
        nur wenig Wolle eine große statische Aufladung erzeugen
        kann. Die kahlen Stellen in seinem Fell sind gegen Elektrizität
        abgeschirmt.
      es: |-
        La calidad de la lana de Flaaffy varía para poder generar
        mucha electricidad estática con muy poca cantidad de lana.
        Las zonas suaves de la piel en las que no tiene pelaje están
        protegidas contra la electricidad.
      it: |-
        La qualità della lana di Flaaffy varia in modo da generare
        un’alta carica elettrostatica con un ridotto quantitativo di lana.
        Le parti scoperte e vulnerabili del suo corpo sono schermate
        contro le scosse.
    alpha-sapphire:
      ja-Hrkt: |-
        たいもうの　せいしつが　へんかするので　すくない
        りょうでも　たくさんの　でんきを　つくりだせる。
        でんきを　さえぎる　つるつるの　はだを　もつ。
      ja: |-
        体毛の　性質が　変化するので　少ない
        量でも　沢山の　電気を　つくりだせる。
        電気を　遮る　つるつるの　肌を　持つ。
      ko: |-
        털의 성질이 변화하기 때문에 적은
        양으로도 많은 전기를 만들어낸다.
        전기를 차단하는 반질반질한 피부를 가졌다.
      en: |-
        Flaaffy’s wool quality changes so that it can generate
        a high amount of static electricity with a small amount of
        wool. The bare and slick parts of its hide are shielded
        against electricity.
      fr: |-
        La qualité de la laine de Lainergie se modifie pour générer
        un maximum d’électricité statique avec un minimum de laine.
        Les sections glabres de sa peau sont résistantes à l’électricité.
      de: |-
        Die Qualität von Waatys Wolle verändert sich, sodass es mit
        nur wenig Wolle eine große statische Aufladung erzeugen
        kann. Die kahlen Stellen in seinem Fell sind gegen Elektrizität
        abgeschirmt.
      es: |-
        La calidad de la lana de Flaaffy varía para poder generar
        mucha electricidad estática con muy poca cantidad de lana.
        Las zonas suaves de la piel en las que no tiene pelaje están
        protegidas contra la electricidad.
      it: |-
        La qualità della lana di Flaaffy varia in modo da generare
        un’alta carica elettrostatica con un ridotto quantitativo di lana.
        Le parti scoperte e vulnerabili del suo corpo sono schermate
        contro le scosse.
    ultra-sun:
      ja-Hrkt: |-
        けの　はえていない　ゴムの　ような
        ひふは　でんきを　とおさないので
        さわっても　あんぜん　なのだ。
      ja: |-
        毛の　生えていない　ゴムの　ような
        皮膚は　電気を　通さないので
        触っても　安全　なのだ。
      ko: |-
        털이 나지 않은 고무 같은
        피부는 전기가 통하지 않아
        만져도 안전하다.
      zh-Hant: |-
        一根毛髮也沒有的皮膚
        跟橡膠一樣不會導電，
        即使觸碰到也很安全。
      zh-Hans: |-
        毛发不生有如橡胶一样的
        皮肤不会导电，
        即便触电了也很安全。
      en: |-
        In the places on its body where fleece doesn’t
        grow, its skin is rubbery and doesn’t conduct
        electricity. Those spots are safe to touch.
      fr: |-
        Sa peau lisse et élastique étant isolante,
        on peut la caresser sans risquer de se
        prendre une décharge électrique.
      de: |-
        Die unbehaarten Stellen seiner gummiartigen
        Haut leiten keinen Strom weiter. Dort kann man
        es daher ohne Gefahr anfassen.
      es: |-
        Las zonas de su piel desprovistas de lana no
        transmiten electricidad, por lo que pueden
        acariciarse sin miedo.
      it: |-
        La pelle gommosa che ricopre le aree del suo
        corpo prive di pelliccia non conduce elettricità e
        può essere toccata senza prendere la scossa.
    ultra-moon:
      ja-Hrkt: |-
        ふかふかの　けに　でんきを　ためこむ。
        たくわえすぎて　ところどころ
        つるつるに　はげあがって　しまった。
      ja: |-
        ふかふかの　毛に　電気を　ためこむ。
        蓄えすぎて　ところどころ
        つるつるに　禿げあがって　しまった。
      ko: |-
        푹신푹신한 털에 전기를 저장한다.
        너무 많이 저장해서 여기저기
        반질반질하게 털이 빠져 버렸다.
      zh-Hant: |-
        會將電力儲存在鬆軟的毛中。
        因為儲存了太多電力，
        身上有些地方變得光禿禿的。
      zh-Hans: |-
        能将电力储存在松软的毛发中。
        因为储存了太多电力，所以身上
        有些地方已经变得光秃秃的了。
      en: |-
        It stores electricity in its fluffy fleece. If it
        stores up too much, it will start to go bald in
        those patches.
      fr: |-
        Il accumule de l’électricité dans sa toison
        duveteuse. Il en a tellement stocké qu’il en
        a perdu sa laine par endroits.
      de: |-
        Sein flauschiges Fell speichert Elektrizität. Zu
        große Mengen bewirkten aber stellenweise einen
        Haarausfall, wo nun glatte Haut freiliegt.
      es: |-
        Su lana sedosa acumula tanta electricidad que
        algunas partes de su cuerpo se han quedado
        desprovistas de pelo.
      it: |-
        Raccoglie elettricità nel soffice manto. Alcune
        parti del suo corpo sono diventate interamente
        glabre per la troppa elettricità immagazzinata.
