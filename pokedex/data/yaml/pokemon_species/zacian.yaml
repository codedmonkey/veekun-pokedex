  flavor_text:
    sword:
      ja-Hrkt: |-
        でんせつの　えいゆうと　よばれる
        ポケモン。　きんぞくを　とりこみ
        ぶぐに　へんかさせ　たたかう。
      ja: |-
        伝説の　英雄と　呼ばれる
        ポケモン。　金属を　取り込み
        武具に　変化させ　戦う。
      ko: |-
        전설의 영웅이라고 불리는
        포켓몬. 금속을 흡수한 뒤
        무기로 변화시켜서 싸운다.
      zh-Hant: |-
        被稱為傳說中的英雄。
        能夠吸收金屬，將之
        轉化為武器來戰鬥。
      zh-Hans: |-
        被称为传说中的英雄。
        能够吸收金属，将之
        转化为武器来战斗。
      en: |-
        Known as a legendary hero, this Pokémon
        absorbs metal particles, transforming them
        into a weapon it uses to battle.
      fr: |-
        Également surnommé « héros légendaire »,
        ce Pokémon absorbe du métal et se change
        en arme pour se battre.
      de: |-
        Dieses Pokémon gilt als legendärer Held.
        Es nimmt Metall auf, wandelt dies in eine Waffe
        um und kämpft damit.
      es: |-
        Este Pokémon está considerado como un héroe
        de leyenda. Absorbe el metal para transformarlo
        y emplearlo como armamento.
      it: |-
        È conosciuto come “l’eroe della leggenda”.
        Assorbe il metallo e lo trasforma per armarsi
        durante la lotta.
    shield:
      ja-Hrkt: |-
        ながい　ねむりに　ついていた
        ザマゼンタの　あね　とも
        ライバルとも　いわれる　ポケモン。
      ja: |-
        長い　眠りに　ついていた
        ザマゼンタの　姉　とも
        ライバルとも　いわれる　ポケモン。
      ko: |-
        오랜 세월 잠들어 있던
        자마젠타의 형제자매 또는
        라이벌로 불리는 포켓몬이다.
      zh-Hant: |-
        這隻寶可夢被認為是沉睡已久的
        藏瑪然特的姐姐，也有人
        認為牠們之間是勁敵關係。
      zh-Hans: |-
        这只宝可梦被认为是沉睡已久的
        藏玛然特的姐姐，也有人
        认为它们之间是劲敌关系。
      en: |-
        This Pokémon has slumbered for many years.
        Some say it’s Zamazenta’s elder sister—others
        say the two Pokémon are rivals.
      fr: |-
        On dit qu’il s’agit de la figure fraternelle
        et du rival de Zamazenta, un Pokémon plongé
        dans un long sommeil.
      de: |-
        Man sagt, es sei wie ein älteres Geschwisterteil,
        aber auch wie ein Rivale zu Zamazenta, welches
        in einen langen Schlaf gefallen war.
      es: |-
        Hay quien lo considera una suerte de figura
        fraterna a la par que rival de Zamazenta,
        un Pokémon sumido en un profundo letargo.
      it: |-
        Viene considerato una figura fraterna e allo
        stesso tempo un rivale per Zamazenta,
        un Pokémon rimasto a lungo addormentato.
