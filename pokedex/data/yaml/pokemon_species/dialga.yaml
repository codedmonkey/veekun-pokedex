    x:
      ja-Hrkt: |-
        ディアルガが　うまれたことで
        じかんが　うごきだしたという
        でんせつを　もつ　ポケモン。
      ja: |-
        ディアルガが　生まれたことで
        時間が　動き出したという
        伝説を　持つ　ポケモン。
      ko: |-
        디아루가가 태어남으로써
        시간이 움직이기 시작했다는
        전설이 내려오는 포켓몬이다.
      en: |-
        A Pokémon spoken of in legend. It is said that time
        began moving when Dialga was born.
      fr: |-
        Les mythes parlent de ce Pokémon. On dit que le
        temps s’est mis en mouvement à sa naissance.
      de: |-
        Ein Pokémon, das in Legenden zu finden ist.
        Man sagt, als Dialga geboren wurde,
        begann der Lauf der Zeit.
      es: |-
        Un Pokémon de leyenda. Se dice que el tiempo
        comenzó a avanzar cuando Dialga nació.
      it: |-
        Pokémon menzionato nelle leggende. Pare che il
        tempo abbia avuto origine alla nascita di Dialga.
    'y':
      ja-Hrkt: |-
        じかんを　あやつる　ちからを　もつ。
        シンオウちほうでは　かみさまと
        よばれ　しんわに　とうじょうする。
      ja: |-
        時間を　操る　力を　持つ。
        シンオウ地方では　神様と　呼ばれ
        神話に　登場する。
      ko: |-
        시간을 조종하는 힘을 가지고 있다.
        신오지방에서는 신이라고
        불리며 신화에 등장한다.
      en: |-
        It has the power to control time. It appears in
        Sinnoh-region myths as an ancient deity.
      fr: |-
        Il peut contrôler le temps. Les mythes de Sinnoh en
        parlent comme d’une divinité ancienne.
      de: |-
        Es besitzt die Macht, die Zeit zu kontrollieren.
        In den Mythen von Sinnoh erscheint es als Gottheit.
      es: |-
        Tiene el poder de controlar el tiempo. Aparece en los
        mitos de Sinnoh como una vieja deidad.
      it: |-
        Ha il potere di controllare il tempo. Descritto nei miti
        della regione di Sinnoh come un’antica divinità.
