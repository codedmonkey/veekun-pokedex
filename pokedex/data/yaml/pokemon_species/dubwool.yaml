dubwool:
  base_happiness: 50
  capture_rate: 127
  color: white
  egg_groups:
    - ground
  evolution_chain: wooloo
  evolves_from: wooloo
  flavor_text:
    sword:
      ja-Hrkt: |-
        だんりょくの　ある　けで　おった
        カーペットは　トランポリンみたいで
        のれば　ピョンピョン　はねるのだ。
      ja: |-
        弾力の　ある　毛で　織った
        カーペットは　トランポリンみたいで
        乗れば　ピョンピョン　跳ねるのだ。
      ko: |-
        탄력 있는 털로 짜낸
        카펫은 트램펄린 같아서
        올라가면 통통 튀어 오르게 된다.
      zh-Hant: |-
        用牠那彈力十足的毛
        織成的地毯就像是彈簧墊，
        可以站上去蹦蹦跳。
      zh-Hans: |-
        用它那弹力十足的毛
        织成的地毯就像是弹簧垫，
        可以站上去蹦蹦跳。
      en: |-
        Weave a carpet from its springy wool, and you end
        up with something closer to a trampoline. You’ll
        start to bounce the moment you set foot on it.
      fr: |-
        La texture de sa laine est si élastique que
        la surface des tapis fabriqués avec ce matériau
        est aussi rebondissante que celle d’un trampoline.
      de: |-
        Spannt man einen aus den elastischen Haaren
        von Zwollock gewobenen Teppich auf, kann man
        darauf hüpfen wie auf einem Trampolin.
      es: |-
        Su lana es muy flexible. Las alfombras tejidas con
        ella adoptan una textura similar a la de las camas
        elásticas.
      it: |-
        I tappeti realizzati con i suoi peli sono talmente
        elastici che saltandoci sopra si rimbalza come
        su un trampolino.
    shield:
      ja-Hrkt: |-
        りっぱに　のびた　ツノは　いせいに
        アピールするために　はえている。
        ぶきとして　つかうことはない。
      ja: |-
        立派に　伸びた　ツノは　異性に
        アピールするために　生えている。
        武器として　使うことはない。
      ko: |-
        늠름하게 자란 뿔은 이성에게
        어필하기 위한 것이다.
        무기로는 사용하지 않는다.
      zh-Hant: |-
        長得長長的角是為了
        向異性求愛而存在的。
        牠從不會把角當作武器。
      zh-Hans: |-
        长得长长的角是为了
        向异性求爱而存在的。
        它从不会把角当做武器。
      en: |-
        Its majestic horns are meant only to impress the
        opposite gender. They never see use in battle.
      fr: |-
        Ses splendides cornes lui servent à attirer
        les membres de l’autre sexe.
        Il ne s’en sert jamais pour se battre.
      de: |-
        Seine prächtig gewachsenen Hörner dienen dazu,
        dem anderen Geschlecht zu imponieren. Es nutzt
        sie nicht als Waffe.
      es: |-
        Sus espléndidos cuernos sirven de reclamo para
        atraer al sexo opuesto. No los utiliza como arma.
      it: |-
        Le sue magnifiche corna hanno la funzione
        di attirare gli individui di sesso opposto.
        Non le usa mai per attaccare.
  form_description: {  }
  forms_switchable: false
