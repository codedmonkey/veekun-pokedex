    alpha-sapphire:
      ja-Hrkt: |-
        すばやい　みのこなしで　あいてを
        ほんろうして　ポケモンを　まもると
        でんせつで　つたえられている。
      ja: |-
        素早い　身のこなしで　相手を
        翻弄して　ポケモンを　守ると
        伝説で　伝えられている。
      ko: |-
        재빠른 몸놀림으로 상대를
        농락해 포켓몬을 지킨다고
        전설로 전해져 온다.
      en: |-
        Legends say this Pokémon confounded opponents
        with its swift movements.
      fr: |-
        Il lacère ses ennemis avec une agilité sans égale.
        La légende raconte qu’il protège les Pokémon.
      de: |-
