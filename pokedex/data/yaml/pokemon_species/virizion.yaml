  flavor_text:
    black:
      en: |-
        This Pokémon fought humans in order
        to protect its friends. Legends about it
        continue to be passed down.
      fr: |-
        Il a défié les humains pour protéger
        les siens. Son nom est resté dans
        la légende.
    white:
      en: |-
        Its head sprouts horns as sharp as
        blades. Using whirlwind-like movements,
        it confounds and swiftly cuts opponents.
      fr: |-
        Ses cornes sont des lames effilées.
        Il lacère ses ennemis dans un
        mouvement tourbillonnant.
    black-2:
      en: |-
        Legends say this Pokémon
        confounded opponents with
        its swift movements.
    white-2:
      en: |-
        Legends say this Pokémon
        confounded opponents with
        its swift movements.
    x:
      ja-Hrkt: |-
        あたまの　ツノは　するどい　やいば。
        つむじかぜのような　うごきで　てきを
        ほんろうして　すばやく　きりつける。
      ja: |-
        頭の　ツノは　鋭い　刃。
        旋風のような　動きで　敵を
        翻弄して　素早く　切りつける。
      ko: |-
        머리의 뿔은 날카로운 칼날이다.
        회오리바람과 같은 움직임으로
        상대를 농락하여 재빠르게 벤다.
      en: |-
        Its head sprouts horns as sharp as blades. Using
        whirlwind-like movements, it confounds and swiftly
        cuts opponents.
      fr: |-
        Ses cornes sont des lames effilées. Il lacère ses
        ennemis dans un mouvement tourbillonnant.
      de: |-
        Das Horn an seinem Kopf ist eine scharfe Klinge.
        Neckt seine Gegner mit quirligen Bewegungen
        und greift blitzartig an.
      es: |-
        Sus cuernos son hojas afiladas. Sacude a sus
        enemigos con sus relampagueantes movimientos y
        los reduce.
      it: |-
        Le corna della testa sono lame affilate. Muovendosi
        come un turbine, scuote e falcia fulmineo i nemici.
    'y':
      ja-Hrkt: |-
        すばやい　みのこなしで　あいてを
        ほんろうして　ポケモンを　まもると
        でんせつで　つたえられている。
      ja: |-
        素早い　身のこなしで　相手を
        翻弄して　ポケモンを　守ると
        伝説で　伝えられている。
      ko: |-
        재빠른 몸놀림으로 상대를
        농락해 포켓몬을 지킨다고
        전설로 전해져 온다.
      en: |-
        Legends say this Pokémon confounded opponents
        with its swift movements.
      fr: |-
        Il lacère ses ennemis avec une agilité sans égale.
        La légende raconte qu’il protège les Pokémon.
      de: |-
        Legenden zufolge täuschte es seine Gegner mit flinken
        Bewegungen und beschützte so die Pokémon.
      es: |-
        Cuenta la leyenda que Virizion confunde a sus rivales
        con rápidos movimientos para proteger a otros
        Pokémon.
      it: |-
        Le leggende dicono di lui che protegge i Pokémon
        tenendo in scacco i nemici con i suoi movimenti
        fulminei.
    omega-ruby:
      ja-Hrkt: |-
