    sword:
      ja-Hrkt: |-
        コバルオン　テラキオンと　ともに
        イッシュちほうの　ポケモンたちを
        まもりつづけた　でんせつが　のこる。
      ja: |-
        コバルオン　テラキオンと　ともに
        イッシュ地方の　ポケモンたちを
        守り続けた　伝説が　残る。
      ko: |-
        코바르온 테라키온과 함께
        하나지방의 포켓몬들을
        수호했다는 전설이 남아 있다.
      zh-Hant: |-
        與勾帕路翁和代拉基翁
        並肩保護合眾地區寶可夢
        的傳說一直流傳至今。
      zh-Hans: |-
        与勾帕路翁和代拉基翁
        并肩保护合众地区宝可梦
        的传说一直流传至今。
      en: |-
        A legend tells of this Pokémon working
        together with Cobalion and Terrakion to
        protect the Pokémon of the Unova region.
      fr: |-
        Selon la légende, il aurait combattu aux côtés
        de Cobaltium et de Terrakium pour protéger
        les Pokémon d’Unys.
      de: |-
        Eine Legende berichtet davon, wie Viridium einst
        mit Kobalium und Terrakium unermüdlich die
        Pokémon Einalls vor den Menschen beschützte.
      es: |-
        Según una leyenda, luchó con valentía junto
        a Cobalion y Terrakion para proteger a los
        Pokémon de Teselia.
      it: |-
        Secondo la leggenda, ha lottato fino all’ultimo
        assieme a Cobalion e Terrakion per proteggere
        i Pokémon di Unima.
    shield:
      ja-Hrkt: |-
        すばやい　みのこなしで　つむじかぜの
        ように　てきを　ほんろうし　するどい
        ツノで　ようしゃなく　きりきざむ。
      ja: |-
        素早い　身のこなしで　つむじ風の
        ように　敵を　翻弄し　鋭い
        ツノで　容赦なく　切り刻む。
      ko: |-
        회오리바람처럼 재빠른 몸동작으로
        적을 농락하고 예리한 뿔로
        가차 없이 베어버린다.
      zh-Hant: |-
        以敏捷的身手像旋風一般將敵人
        玩弄於股掌之中，會用鋒利的角
        毫不留情地斬斷對手。
      zh-Hans: |-
        以敏捷的身手像旋风一般将敌人
        玩弄于股掌之中，会用锋利的角
        毫不留情地切斩对手。
      en: |-
        It darts around opponents with a flurry of quick
        movements, slicing them up with its horns.
      fr: |-
        Rapide comme le vent, il s’abat tel un tourbillon
        sur ses ennemis avant de les transpercer sans pitié
        de ses cornes acérées.
      de: |-
        Es täuscht seine Gegner mit flinken Bewegungen,
        um sie dann blitzartig anzugreifen und ohne jede
        Gnade mit seinen Hörnern aufzuschlitzen.
      es: |-
        Confunde a los enemigos con sus movimientos
        relampagueantes y luego los rebana sin piedad
        con sus afilados cuernos.
      it: |-
        Si abbatte sui nemici rapido come un turbine e li
        fa a pezzi senza pietà con le sue corna affilate.
