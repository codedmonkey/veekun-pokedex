    white-2:
      en: |-
        It lives in the shallows of warm
        seas. When the tide goes out, it
        digs up prey from beaches.
    x:
      ja-Hrkt: |-
        あたたかい　うみの　あさせに　いる。
        しおが　ひくと　すなはまに　もぐった
        えものを　ほりだして　たべる。
      ja: |-
        暖かい　海の　浅瀬に　いる。
        潮が　引くと　砂浜に　潜った
        獲物を　掘り出して　食べる。
      ko: |-
        따뜻한 바다의 얕은 곳에 있다.
        바닷물이 빠지면 모래 해변에
        숨어 있는 먹이를 파내어 먹는다.
      en: |-
        It lives in the shallows of warm seas. When the tide
        goes out, it digs up prey from beaches.
      fr: |-
        Vit dans les hauts-fonds des mers chaudes.
        Il déterre sa proie du sable quand la marée se retire.
      de: |-
        Es lebt in seichten Stellen warmer Meere.
        Bei Ebbe sucht es im Sand nach Beute.
      es: |-
        Vive en el fondo de los mares de aguas templadas.
        Emerge para cazar cuando baja la marea.
      it: |-
        Vive in acque poco profonde nei mari caldi. Con la
        bassa marea, scava sulla riva in cerca di prede.
    'y':
      ja-Hrkt: |-
        ８まいの　しょくしゅで　えものを
        からめとり　つよい　しょうかえきで
        とかしてから　むしゃむしゃ　たべる。
      ja: |-
        ８枚の　触手で　獲物を　絡め取り
        強い　消化液で　溶かしてから
        むしゃむしゃ　食べる。
      ko: |-
        8개의 촉수로 먹이를
        감싸 강한 소화액으로
        녹이고 나서 우걱우걱 먹는다.
      en: |-
        It ensnares prey with its eight tentacles. It then
        melts the prey with a strong acid before feeding.
      fr: |-
        Lorsqu’il chasse, Vacilys utilise ses huit tentacules.
        Il dissout sa proie à l’aide d’un puissant acide avant
        de l’avaler.
      de: |-
        Es fängt Beute mit seinen acht Tentakeln. Ehe es sie
        verspeist, löst es sie mit einer starken Säure auf.
      es: |-
        Atrapa a su presa con los ocho tentáculos que tiene y,
        antes de devorarla, la baña en ácido.
      it: |-
        Irretisce la preda con gli otto tentacoli, poi la scioglie
        usando un forte acido e, infine, se ne ciba.
    omega-ruby:
      ja-Hrkt: |-
        うみの　そこで　エサを　さがして　あるきまわる。
        きの　えだの　ような　くびを　じざいに　のばして
        ８まいの　しょくしゅで　えものを　つかまえる。
      ja: |-
        海の　底で　エサを　探して　歩き回る。
        木の　枝の　ような　首を　自在に　伸ばして
        ８枚の　触手で　獲物を　捕まえる。
      ko: |-
        바다 밑에서 먹이를 찾아 돌아다닌다.
        나뭇가지 같은 목을 자유롭게 늘여서
        8개의 촉수로 먹이를 잡는다.
      en: |-
        Cradily roams around the ocean floor in search of food.
        This Pokémon freely extends its tree trunk-like neck and
        captures unwary prey using its eight tentacles.
      fr: |-
        Vacilys erre dans les profondeurs de l’océan pour chercher
        de la nourriture. Ce Pokémon peut allonger son cou à volonté
        et capturer ses proies à l’aide de ses huit tentacules.
      de: |-
        Wielie sucht den Meeresboden nach Beute ab. Dieses
        Pokémon fährt seinen baumstammartigen Nacken aus
        und fängt mit seinen acht Tentakeln Beute.
      es: |-
        Cradily va por el fondo oceánico sin rumbo fijo en busca de
        comida. El cuello de este Pokémon se parece al tronco de
        un árbol. Cuando quiere atrapar a su presa desprevenida, lo
        estira y usa los ocho tentáculos que tiene.
      it: |-
        Cradily scandaglia i fondali oceanici in cerca di nutrimento.
        Riesce a estendere il collo, simile al tronco di un albero,
        per catturare ignare prede con i propri otto tentacoli.
    alpha-sapphire:
      ja-Hrkt: |-
        からだが　おもりがわりに　なっているので
        うみが　あれても　ながされる　ことは　ない。
        しょくしゅから　つよい　しょうかえきを　だす。
      ja: |-
        体が　錘替わりに　なっているので
        海が　荒れても　流される　ことは　ない。
        触手から　強い　消化液を　出す。
      ko: |-
        몸이 추와 같은 역할을 해서
        바다가 거칠어져도 떠내려가는 일이 없다.
        촉수에서 강한 소화액이 나온다.
      en: |-
        Cradily’s body serves as an anchor, preventing it from being
        washed away in rough seas. This Pokémon secretes a strong
        digestive fluid from its tentacles.
      fr: |-
        Le corps de Vacilys lui sert d’ancre et l’empêche d’être
        emporté quand la mer est déchaînée. Les tentacules
        de ce Pokémon sécrètent un puissant fluide digestif.
      de: |-
        Wielies Körper dient ihm als Anker und schützt es davor,
        in die stürmische See gespült zu werden. Dieses Pokémon
        sondert eine starke Verdauungsflüssigkeit aus seinen
        Tentakeln ab.
      es: |-
        A Cradily le sirve el cuerpo de ancla y sostén en aguas
        turbulentas. Gracias a él no es arrastrado por las corrientes.
        Este Pokémon segrega un fuerte jugo digestivo a través de
        los tentáculos.
      it: |-
        Il corpo di Cradily funge da ancora, per evitare di essere
        spazzato via dal mare grosso. Il Pokémon secerne un potente
        liquido digestivo dai propri tentacoli.
    ultra-sun:
      ja-Hrkt: |-
        ふだんは　あさせの　かいていに　すみ
        しおが　ひくと　そのまま　りくに
        あがって　えものを　さがしていた。
      ja: |-
        普段は　浅瀬の　海底に　棲み
        潮が　引くと　そのまま　陸に
        あがって　獲物を　探していた。
      ko: |-
        평소에는 얕은 여울 바다 밑에 살고
        물이 빠지면 그대로 지상으로
        올라가 먹이를 찾았다.
      zh-Hant: |-
        平時棲息在海中淺灘的底部，
        每當退潮時就會爬到陸地上，
        四處尋找獵物。
      zh-Hans: |-
        平常栖息在海的浅滩底部，
        退潮的时候就爬到陆地上，
        四处寻找猎物。
      en: |-
        Normally, it lived on shallow sea shoals. When
        the tide went out, this Pokémon came up on
        land to search for prey.
      fr: |-
        Il habitait généralement dans les hauts-fonds,
        mais parcourait le littoral en quête de proies
        lorsque la marée était basse.
      de: |-
        Es lebte für gewöhnlich an seichten Stellen im
        Meer. Bei Ebbe kam es an Land, um nach Beute
        zu suchen.
      es: |-
        Por lo general habitaba en las profundidades
        del mar y salía a tierra firme en busca de presas
        cuando bajaba la marea.
      it: |-
        Questo Pokémon viveva sui fondali di acque
        poco profonde e con la bassa marea andava in
        cerca di prede sulla riva.
    ultra-moon:
      ja-Hrkt: |-
        こだいのうみの　にくしょくポケモン。
        ８つのしょくしゅで　えものを　とらえ
        しょうかえきで　とかしながら　くう。
      ja: |-
        古代の海の　肉食ポケモン。
        ８つの触手で　獲物を　捕らえ
        消化液で　溶かしながら　食う。
      ko: |-
        고대 바다의 육식 포켓몬.
        8개의 촉수로 먹이를 잡아서
        소화액으로 녹여 가며 먹는다.
      zh-Hant: |-
        古代海裡的肉食性寶可夢。
        會用８根觸手捉住獵物，
        一邊用消化液溶解一邊進食。
      zh-Hans: |-
        古代海里的食肉宝可梦。
        能用８根触手捕捉猎物，
        一边用消化液溶化一边吃。
      en: |-
        This carnivorous Pokémon lived in primordial
        seas. It catches prey in its eight tentacles and
        dissolves them with digestive fluid as it eats.
      fr: |-
        Ce carnivore des mers antiques attrape sa proie
        à l’aide de ses huit tentacules, puis la dissout
        avec ses sucs digestifs.
      de: |-
        Ein fleischfressendes Pokémon aus dem Urmeer.
        Mit seinen acht Tentakeln fing es Beute und
        löste sie in Verdauungssaft auf, bevor es sie aß.
      es: |-
        Pokémon carnívoro de mares ancestrales. Con
        los ocho tentáculos atrapa a su presa y la come
        a medida que sus jugos gástricos la disuelven.
      it: |-
        Questo antico Pokémon carnivoro afferra
        la preda con gli otto tentacoli, poi la scioglie
        usando un acido e cibandosene man mano.
    sword:
      ja-Hrkt: |-
        あしが　みじかく　あゆみは　おそいが
        くびと　しょくしゅが　３ばい　のびて
        とおくにいる　えものを　つかまえる。
      ja: |-
        脚が　短く　歩みは　遅いが
        首と　触手が　３倍　伸びて
        遠くにいる　獲物を　捕まえる。
      ko: |-
        다리가 짧아 걸음이 느리지만
        목과 촉수가 3배로 늘어나서
        멀리 있는 먹이를 잡는다.
      zh-Hant: |-
        雖然腳短且走得慢，但
        脖子和觸手能伸長３倍
        去捕捉在遠處的獵物。
      zh-Hans: |-
        虽然脚很短走得慢，
        但脖子和触手能伸长３倍，
        因此能捉到远处的猎物。
      en: |-
        It has short legs and can’t walk very fast, but its
        neck and tentacles can extend to over three
        times their usual length to nab distant prey.
      fr: |-
        Il se déplace lentement avec ses petites pattes,
        mais il peut tripler la longueur de son cou et
        de ses tentacules pour capturer ses proies.
      de: |-
        Durch die kurzen Beine läuft Wielie nur langsam,
        doch um ferne Beute zu fangen, kann es Hals und
        Tentakel auf die dreifache Länge ausstrecken.
      es: |-
        Sus cortas patas le impiden desplazarse con
        rapidez, pero puede triplicar la longitud de sus
        tentáculos y cuello para atrapar a presas lejanas.
      it: |-
        Il suo passo è lento a causa delle corte zampe,
        ma può triplicare la lunghezza del collo e dei
        tentacoli per catturare le prede.
    shield:
      ja-Hrkt: |-
        しょくしゅで　えものを　つかまえると
        そのまま　しょうかえきで　とかして
        えいようぶんを　きゅうしゅうする。
      ja: |-
        触手で　獲物を　捕まえると
        そのまま　消化液で　溶かして
        栄養分を　吸収する。
      ko: |-
        촉수로 먹이를 잡은 후
        그대로 소화액으로 녹여
        영양분을 흡수한다.
      zh-Hant: |-
        用觸手捕捉到獵物時，
        會直接用消化液溶解
        獵物然後吸收養分。
      zh-Hans: |-
        用触手将猎物缠住后，
        会用消化液将其溶化，
        然后吸收其中的养分。
      en: |-
        Once Cradily catches prey in its tentacles,
        it digests them whole and absorbs their nutrients.
      fr: |-
        Il attrape ses proies à l’aide de ses tentacules,
        puis les dissout immédiatement avec ses sucs
        digestifs pour en absorber les nutriments.
      de: |-
        Sobald es mit seinen Tentakeln Beute erfasst hat,
        löst es diese mit seiner Verdauungsflüssigkeit auf
        und absorbiert ihre Nährstoffe.
      es: |-
        Atrapa a sus presas con los tentáculos y
        enseguida las disuelve con sus jugos gástricos
        para absorber los nutrientes.
      it: |-
        Cattura le prede con i tentacoli e le scioglie
        con un fluido digestivo, assorbendone così
        le sostanze nutritive.
