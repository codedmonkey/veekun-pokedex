kyurem:
  base_happiness: 0
  capture_rate: 3
  color: gray
  egg_groups:
    - no-eggs
  evolution_chain: kyurem
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        It generates a powerful, freezing
        energy inside itself, but its body became
        frozen when the energy leaked out.
      fr: |-
        Son corps produit une énergie à très
        basse température, mais le souffle 
        glacé qu’il exhale l’a gelé lui-même.
    white:
      en: |-
        It can produce ultracold air.
        Its body is frozen.
      fr: |-
        Il a le pouvoir de générer un souffle
        d’un froid inimaginable, mais a fini
        par se geler lui-même.
    black-2:
      en: |-
        This legendary ice Pokémon waits for
        a hero to fill in the missing parts
        of its body with truth or ideals.
    white-2:
      en: |-
        This legendary ice Pokémon waits for
        a hero to fill in the missing parts
        of its body with truth or ideals.
    x:
      ja-Hrkt: |-
        うしなった　からだを　しんじつと
        りそうで　うめてくれる　えいゆうを
        まつ　こおりの　でんせつポケモン。
      ja: |-
        失った　体を　真実と
        理想で　埋めてくれる　英雄を
        待つ　氷の　伝説ポケモン。
      ko: |-
        잃어버린 몸을 진실과
        이상으로 채워줄 영웅을
        기다리는 얼음의 전설 포켓몬.
      en: |-
        This legendary ice Pokémon waits for a hero to fill
        in the missing parts of its body with truth or ideals.
      fr: |-
        Il attend le héros qui saura réanimer son corps de
        glace incomplet en partageant avec lui son Idéal et
        sa Réalité.
      de: |-
        Ein Legendäres Eis-Pokémon, das auf den Helden
        wartet, der seinen verstümmelten Körper mit
        Wunsch und Wirklichkeit heilt.
      es: |-
        Pokémon legendario que aguarda al héroe que
        compense el vacío de su cuerpo de hielo con verdad
        e ideales.
      it: |-
        Questo leggendario Pokémon dei ghiacci attende
        l’eroe che gli restituirà le sue vere sembianze con
        gli ideali o la verità.
    'y':
      ja-Hrkt: |-
        きょうりょくな　れいとうエネルギーを
        たいないで　つくりだすが　もれだした
        れいきで　からだが　こおっている。
      ja: |-
        強力な　冷凍エネルギーを
        体内で　作り出すが　漏れ出した
        冷気で　体が　凍っている。
      ko: |-
        강력한 냉동 에너지를
        체내에서 만들어 내지만 새어 나온
        냉기에 몸이 얼어 있다.
      en: |-
        It generates a powerful, freezing energy inside
        itself, but its body became frozen when the energy
        leaked out.
      fr: |-
        Son corps produit une énergie à très basse
        température, mais le souffle glacé qu’il exhale l’a gelé
        lui-même.
      de: |-
        Sein Körper erzeugt in seinem Inneren gewaltige
        Mengen an Kälteenergie. Tritt diese jedoch aus,
        gefriert sein Körper.
      es: |-
        Produce en su interior una intensa energía gélida, y
        cualquier fuga hace que su cuerpo se congele.
      it: |-
        Produce all’interno del suo corpo una potente e gelida
        energia. Ma l’aria fredda che esala lo ha congelato.
    omega-ruby:
      ja-Hrkt: |-
        うしなった　からだを　しんじつと
        りそうで　うめてくれる　えいゆうを
        まつ　こおりの　でんせつポケモン。
      ja: |-
        失った　体を　真実と
        理想で　埋めてくれる　英雄を
        待つ　氷の　伝説ポケモン。
      ko: |-
        잃어버린 몸을 진실과
        이상으로 채워줄 영웅을
        기다리는 얼음의 전설 포켓몬.
      en: |-
        This legendary ice Pokémon waits for a hero to fill
        in the missing parts of its body with truth or ideals.
      fr: |-
        Il attend le héros qui saura réanimer son corps de glace
        incomplet en partageant avec lui son Idéal et sa Réalité.
      de: |-
        Ein Legendäres Eis-Pokémon, das auf den Helden wartet, der
        seinen verstümmelten Körper mit Wunsch und Wirklichkeit heilt.
      es: |-
        Pokémon legendario que aguarda al héroe que compense el
        vacío de su cuerpo de hielo con verdad e ideales.
      it: |-
        Questo leggendario Pokémon dei ghiacci attende l’eroe che
        gli restituirà le sue vere sembianze con gli ideali o la verità.
    alpha-sapphire:
      ja-Hrkt: |-
        きょうりょくな　れいとうエネルギーを
        たいないで　つくりだすが　もれだした
        れいきで　からだが　こおっている。
      ja: |-
        強力な　冷凍エネルギーを
        体内で　作り出すが　漏れ出した
        冷気で　体が　凍っている。
      ko: |-
        강력한 냉동 에너지를
        체내에서 만들어 내지만 새어 나온
        냉기에 몸이 얼어 있다.
      en: |-
        It generates a powerful, freezing energy inside
        itself, but its body became frozen when the energy
        leaked out.
      fr: |-
        Son corps produit une énergie à très basse température,
        mais le souffle glacé qu’il exhale l’a gelé lui-même.
      de: |-
        Sein Körper erzeugt in seinem Inneren gewaltige Mengen an
        Kälteenergie. Tritt diese jedoch aus, gefriert sein Körper.
      es: |-
        Produce en su interior una intensa energía gélida, y cualquier
        fuga hace que su cuerpo se congele.
      it: |-
        Produce all’interno del suo corpo una potente e gelida
        energia. Ma l’aria fredda che esala lo ha congelato.
    sword:
      ja-Hrkt: |-
        レシラムと　ゼクロムを　しのぐほどの
        ちからを　もつが　きょくていおんの
        れいきで　ふうじられてしまっている。
      ja: |-
        レシラムと　ゼクロムを　凌ぐほどの
        力を　もつが　極低温の
        冷気で　封じられてしまっている。
      ko: |-
        레시라무와 제크로무를 능가할 정도의
        힘을 가졌으나 극저온의
        냉기에 봉인되어 있다.
      zh-Hant: |-
        雖然擁有凌駕於萊希拉姆和
        捷克羅姆之上的力量，但是那
        力量已被極低溫冷氣封住了。
      zh-Hans: |-
        虽然拥有凌驾于莱希拉姆和
        捷克罗姆之上的力量，但是那
        力量已被极低温冷气封印住了。
      en: |-
        Dwelling within it is a power even greater than
        that of Reshiram or Zekrom, but the extreme
        cold keeps that power bound.
      fr: |-
        Il possède une puissance qui dépasse celle
        de Reshiram et de Zekrom, mais il a scellé
        son corps grâce à son souffle glacé.
      de: |-
        Seine Kraft übertrifft die von Reshiram und
        Zekrom, doch sie wird durch die extreme Kälte,
        die in seinem Körper herrscht, versiegelt.
      es: |-
        Su poder supera al de Reshiram y Zekrom,
        pero permanece sellado por el frío extremo
        que genera.
      it: |-
        La sua forza supera quella di Reshiram e
        Zekrom, ma è sigillata dalla temperatura
        glaciale del suo corpo.
    shield:
      ja-Hrkt: |-
        さいぼうそしきを　あんていさせるため
        じぶんで　はっせいさせた　れいきで
        からだを　こおりつかせているらしい。
      ja: |-
        細胞組織を　安定させるため
        自分で　発生させた　冷気で
        体を　凍りつかせているらしい。
      ko: |-
        세포 조직을 안정시키기 위해
        자신이 발생시킨 냉기로
        몸을 얼어붙게 한 듯하다.
      zh-Hant: |-
        為了穩定細胞組織，
        牠似乎用自己製造出
        的冷氣冰凍著身體。
      zh-Hans: |-
        为了稳定细胞组织，
        它似乎用自己制造出
        的冷气冰冻着身体。
      en: |-
        It appears that this Pokémon uses its powers over
        ice to freeze its own body in order to stabilize its
        cellular structure.
      fr: |-
        Il se serait congelé lui-même avec son souffle
        glacé pour stabiliser sa structure cellulaire.
      de: |-
        Es erzeugt Kälteenergie, mit der es seinen Körper
        gefroren hält. Damit verfolgt es offenbar das
        Ziel, seine Zellstruktur zu stabilisieren.
      es: |-
        Mantiene su cuerpo congelado con la intensa
        energía gélida que él mismo produce para
        estabilizar su estructura celular.
      it: |-
        Sembra che abbia finito con il congelarsi
        producendo un soffio gelido al fine di
        stabilizzare la sua struttura cellulare.
  form_description:
    en: 'Forms have different stats, abilities, and signature moves.  Kyurem fuses with []{pokemon:reshiram} to become White Kyurem or []{pokemon:zekrom} to become Black Kyurem.  The []{item:dna-splicers} are used to fuse Kyurem with another Pokémon or separate them again.  While fused, the other Pokémon disappears.  Signature moves are replaced by the equivalent moves when switching forms.'
