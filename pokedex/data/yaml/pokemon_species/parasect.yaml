        host’s body controls Parasect.
        It scatters poisonous spores.
    white-2:
      en: |-
        A mushroom grown larger than the
        host’s body controls Parasect.
        It scatters poisonous spores.
    x:
      ja-Hrkt: |-
        からだよりも　おおきな　キノコが
        パラセクトを　あやつっている。
        どくの　ほうしを　ばらまく。
      ja: |-
        体よりも　大きな　キノコが
        パラセクトを　操っている。
        毒の　胞子を　ばらまく。
      ko: |-
        몸보다 큰 버섯이
        파라섹트를 조종하고 있다.
        독 포자를 여기저기 뿌린다.
      en: |-
        A mushroom grown larger than the host’s body
        controls Parasect. It scatters poisonous spores.
      fr: |-
        Un champignon parasite plus gros que Parasect
        contrôle son corps. Il répand des spores
        empoisonnées.
      de: |-
        Parasek wird von einem Pilz, der größer als das
        Pokémon ist, kontrolliert. Er gibt Giftsporen ab.
      es: |-
        Parasect está dominado por una seta parásita mayor
        que él. Dispersa esporas venenosas.
      it: |-
        Parasect è controllato da un fungo ancora più
        grosso del suo corpo. Diffonde spore velenose.
    'y':
      ja-Hrkt: |-
        せなかの　キノコが　そだつほど
        ばらまかれる　キノコのほうしの
        こうかは　きょうりょくになる。
      ja: |-
        背中の　キノコが　育つほど
        ばらまかれる　キノコの　胞子の
        効果は　強力になる。
      ko: |-
        등의 버섯이 자랄수록
        흩뿌려지는 버섯포자의
        효과는 강력해진다.
      en: |-
        The larger the mushroom on its back grows,
        the stronger the mushroom spores it scatters.
      fr: |-
        Plus le champignon sur son dos grandit, plus celui-ci
        émet des spores puissantes dans l’air.
      de: |-
        Je größer der Pilz auf seinem Rücken wird, desto
        stärker werden auch die Sporen, die es verteilt.
      es: |-
        Cuanto más grande sea la seta de su lomo, más
        resistentes serán las esporas que esta suelta.
      it: |-
        Più cresce il fungo che ha sul dorso, più forti
        diventano le spore che sparge.
    omega-ruby:
      ja-Hrkt: |-
        パラセクトは　しゅうだんで　たいぼくの　ねもとに
        くっついて　えいようを　すいとってしまう。
        かれると　いっせいに　べつの　きに　いどうする。
      ja: |-
        パラセクトは　集団で　大木の　根元に
        くっついて　栄養を　吸い取ってしまう。
        枯れると　一斉に　別の　木に　移動する。
      ko: |-
        파라섹트는 집단으로 큰 나무의 밑동에
        붙어 영양을 빨아들인다.
        말라버리면 일제히 다른 나무로 이동한다.
      en: |-
        Parasect is known to infest large trees en masse and drain
        nutrients from the lower trunk and roots. When an infested tree
        dies, they move onto another tree all at once.
      fr: |-
        On sait que les Parasect vivent en groupe dans les grands
        arbres et se nourrissent des nutriments contenus dans le tronc
        et les racines. Lorsqu’un arbre infesté meurt, ils se précipitent
        vers le prochain.
      de: |-
        Parasek sucht große Bäume heim und entzieht Nährstoffe aus
        Stamm und Wurzeln. Wenn ein befallener Baum stirbt, sucht es
        sich zusammen mit seinen Artgenossen einen neuen Wirt.
      es: |-
        Parasect es conocido por destruir en plaga grandes árboles,
        absorbiendo los nutrientes que tienen en la parte baja del
        tronco y las raíces. Cuando un árbol azotado por la plaga
        muere, los Parasect van a por el siguiente al instante.
      it: |-
        I Parasect agiscono in gruppo e sono noti per la loro abilità
        di infestare gli alberi traendo nutrimento da tronchi e radici.
        Quando muore un albero infestato, ne cercano subito un altro.
    alpha-sapphire:
      ja-Hrkt: |-
        パラセクトは　しゅうだんで　たいぼくの　ねもとに
        くっついて　えいようを　すいとってしまう。
        かれると　いっせいに　べつの　きに　いどうする。
      ja: |-
        パラセクトは　集団で　大木の　根元に
        くっついて　栄養を　吸い取ってしまう。
        枯れると　一斉に　別の　木に　移動する。
      ko: |-
        파라섹트는 집단으로 큰 나무의 밑동에
        붙어 영양을 빨아들인다.
        말라버리면 일제히 다른 나무로 이동한다.
      en: |-
        Parasect is known to infest large trees en masse and drain
        nutrients from the lower trunk and roots. When an infested
        tree dies, they move onto another tree all at once.
      fr: |-
        On sait que les Parasect vivent en groupe dans les grands
        arbres et se nourrissent des nutriments contenus dans le tronc
        et les racines. Lorsqu’un arbre infesté meurt, ils se précipitent
        vers le prochain.
      de: |-
        Parasek sucht große Bäume heim und entzieht Nährstoffe aus
        Stamm und Wurzeln. Wenn ein befallener Baum stirbt, sucht es
        sich zusammen mit seinen Artgenossen einen neuen Wirt.
      es: |-
        Parasect es conocido por destruir en plaga grandes árboles,
        absorbiendo los nutrientes que tienen en la parte baja del
        tronco y las raíces. Cuando un árbol azotado por la plaga
        muere, los Parasect van a por el siguiente al instante.
      it: |-
        I Parasect agiscono in gruppo e sono noti per la loro abilità
        di infestare gli alberi traendo nutrimento da tronchi e radici.
        Quando muore un albero infestato, ne cercano subito un altro.
    sun:
      ja-Hrkt: |-
        おおきな　キノコが　パラセクトを
        あやつっている。　よく　マシェードと
        なわばりあらそいを　している。
      ja: |-
        大きな　キノコが　パラセクトを
        操っている。　よく　マシェードと
        縄張り争いを　している。
      ko: |-
        큰 버섯이 파라섹트를
        조종하고 있다. 자주 마셰이드와
        영역싸움을 하고 있다.
      zh-Hant: |-
        大大的蘑菇操縱著派拉斯特。
        經常和燈罩夜菇爭奪地盤。
      zh-Hans: |-
        大大的蘑菇操纵着派拉斯特。
        经常和灯罩夜菇争夺领地。
      en: |-
        The large mushroom on its back controls it.
        It often fights over territory with Shiinotic.
      fr: |-
        Le gros champignon sur son dos contrôle
        le Pokémon. Lampignon et Parasect
        se disputent souvent un même territoire.
      de: |-
        Parasek wird von dem Pilz auf seinen Rücken
        kontrolliert. Es ist oft mit Lamellux in
        Revierstreitigkeiten verstrickt.
      es: |-
        La gran seta en su lomo lo controla. A menudo
        libra luchas territoriales contra Shiinotic.
      it: |-
        Parasect è controllato dal grande fungo che ha
        sul dorso. Spesso si contende il territorio con
        gli Shiinotic.
    moon:
      ja-Hrkt: |-
        キノコの　カサから　どくのほうしを
        まきちらす。　ほうしを　あつめて
        せんじると　かんぽうやくに　なる。
      ja: |-
        キノコの　カサから　毒の胞子を
        撒き散らす。　胞子を　集めて
        煎じると　漢方薬に　なる。
      ko: |-
        버섯의 갓에서 독 포자를
        흩뿌린다. 포자를 모아서
        달이면 한약이 된다.
      zh-Hant: |-
        從蘑菇的菌傘處撒出有毒的孢子。
        收集孢子用水煎就能成為中藥。
      zh-Hans: |-
        从蘑菇的菌伞处撒出有毒的孢子。
        收集孢子用水煎就能成为中药。
      en: |-
        It scatters toxic spores from its mushroom cap.
        Once harvested, these spores can be steeped
        and boiled down to prepare herbal medicines.
      fr: |-
        Il répand des spores empoisonnées depuis son
        chapeau. On peut les récolter et les faire sécher
        pour préparer des remèdes traditionnels.
      de: |-
        Der Pilz auf seinem Rücken stößt Giftsporen
        aus. Kocht man ihn ab, lässt er sich als
        natürliches Heilmittel verwerten.
      es: |-
        La gran seta en su lomo dispersa esporas
        venenosas, que pueden servir para elaborar
        remedios medicinales.
      it: |-
        Sparge spore velenose dal fungo che ha
        sul dorso. Se raccolte e fatte bollire, queste
        spore possono essere usate come farmaco.
    ultra-sun:
      ja-Hrkt: |-
        ムシの　ほうは　ほぼ　しんでいて
        ほんたいは　せなかの　キノコだ。
        もげると　もう　うごかなくなる。
      ja: |-
        ムシの　方は　ほぼ　死んでいて
        本体は　背中の　キノコだ。
        もげると　もう　動かなくなる。
      ko: |-
        벌레는 거의 죽은 상태이고
        본체는 등의 버섯이다.
        떨어지면 더는 움직일 수 없다.
      zh-Hant: |-
        本體是背上的蘑菇，
        底下的蟲子幾乎已經死亡。
        一旦蘑菇脫落，牠就再也不會動了。
      zh-Hans: |-
        底下的虫子基本上死了，
        真正的本体是背上的蘑菇。
        如果蘑菇掉下来，它就不会动了。
      en: |-
        The bug is mostly dead, with the mushroom on
        its back having become the main body. If the
        mushroom comes off, the bug stops moving.
      fr: |-
        L’insecte est quasiment mort, à ce stade, et le
        champignon est devenu le véritable cerveau.
        Si on l’ôte de son dos, il ne peut plus bouger.
      de: |-
        Der Pilz auf seinem Rücken ist sein wichtigstes
        Körperteil. Der Rest ist quasi leblos und kann
        sich ohne den Pilz nicht bewegen.
      es: |-
        La mayor parte de su cuerpo está atrofiada,
        excepto la seta del dorso, que controla al resto.
        Si se desprende, Parasect ya no podrá moverse.
      it: |-
        La parte essenziale di questo Pokémon,
        praticamente morto, è costituita dal fungo sulla
        sua schiena. Se si stacca, non può più muoversi.
    ultra-moon:
      ja-Hrkt: |-
        どくの　ほうしは　かんぽうやくにも
        つかわれる。　アローラさんは
        あまり　しつが　よくないらしい。
      ja: |-
        毒の　胞子は　漢方薬にも
        使われる。　アローラ産は
        あまり　質が　良くないらしい。
      ko: |-
        독 포자는 한방약으로도
        사용된다. 알로라산은
        그다지 품질이 좋지 않다고 한다.
      zh-Hant: |-
        有毒的孢子也能用於中藥。
        但阿羅拉地區生產出來的品質
        似乎不怎麼樣。
      zh-Hans: |-
        有毒的孢子也能用于中药。
        阿罗拉产的好像品质不怎么样。
      en: |-
        Its poisonous spores are also used in traditional
        medicine. Apparently, spores produced in Alola
        are not of very good quality.
      fr: |-
        Des remèdes traditionnels sont préparés avec
        ses spores empoisonnées, mais ceux produits
        à Alola seraient de moindre qualité.
      de: |-
        Seine Giftsporen werden als natürliches
        Heilmittel verwendet, doch bei Parasek aus
        Alola ist die Qualität etwas minderwertig.
      es: |-
        Sus esporas venenosas se usan para elaborar
        remedios medicinales que en Alola, al parecer,
        son de calidad más bien mediocre.
      it: |-
        Dalle sue spore velenose si possono ricavare
        dei farmaci. Tuttavia, sembra che quelli prodotti
        ad Alola non siano di buona qualità.
    lets-go-pikachu:
      ja-Hrkt: |-
        ずっと　エキスを　すいつづけられ
        もはや　ムシではなく　せなかの
        キノコが　かんがえているようだ。
      ja: |-
        ずっと　エキスを　吸い続けられ
        もはや　ムシではなく　背中の
        キノコが　考えているようだ。
      ko: |-
        계속 진액을 빨아 먹혀서
        이제는 벌레가 아니라 등에 있는
        버섯이 생각하고 있는 듯하다.
      zh-Hant: |-
        由於蟲子的精華不斷被吸走，
        在思考的似乎已經不是蟲子，
        而是背上的蘑菇了。
      zh-Hans: |-
        由于虫子的精华不断被吸走，
        在思考的似乎已经不是虫子，
        而是背上的蘑菇了。
      en: |-
        The bug host is drained of energy by
        the mushroom on its back. The mushroom
        appears to do all the thinking.
      fr: |-
        À force de voir son énergie aspirée, il semblerait
        que ce ne soit plus l’insecte qui réfléchisse,
        mais le champignon sur son dos.
      de: |-
        Der Pilz auf Paraseks Rücken nutzt das Pokémon
        als Wirt und entzieht ihm Energie. Es scheint,
        als habe er die Kontrolle über das Pokémon.
      es: |-
        Tras largo tiempo absorbiendo la energía del
        huésped, la seta parásita del lomo es la que
        parece controlar la voluntad de este Pokémon.
      it: |-
        Il fungo sulla schiena assorbe l’energia
        dell’organismo ospite, su cui ha anche
        pieno controllo.
    lets-go-eevee:
      ja-Hrkt: |-
        ずっと　エキスを　すいつづけられ
        もはや　ムシではなく　せなかの
        キノコが　かんがえているようだ。
      ja: |-
        ずっと　エキスを　吸い続けられ
        もはや　ムシではなく　背中の
        キノコが　考えているようだ。
      ko: |-
        계속 진액을 빨아 먹혀서
        이제는 벌레가 아니라 등에 있는
        버섯이 생각하고 있는 듯하다.
      zh-Hant: |-
        由於蟲子的精華不斷被吸走，
        在思考的似乎已經不是蟲子，
        而是背上的蘑菇了。
      zh-Hans: |-
        由于虫子的精华不断被吸走，
        在思考的似乎已经不是虫子，
        而是背上的蘑菇了。
      en: |-
        The bug host is drained of energy by
        the mushroom on its back. The mushroom
        appears to do all the thinking.
      fr: |-
        À force de voir son énergie aspirée, il semblerait
        que ce ne soit plus l’insecte qui réfléchisse,
        mais le champignon sur son dos.
      de: |-
        Der Pilz auf Paraseks Rücken nutzt das Pokémon
        als Wirt und entzieht ihm Energie. Es scheint,
        als habe er die Kontrolle über das Pokémon.
      es: |-
        Tras largo tiempo absorbiendo la energía del
        huésped, la seta parásita del lomo es la que
        parece controlar la voluntad de este Pokémon.
      it: |-
        Il fungo sulla schiena assorbe l’energia
        dell’organismo ospite, su cui ha anche
        pieno controllo.
