    black:
      en: |-
        If its body is torn, it can grow
        back if the red core remains.
        The core flashes at midnight.
      fr: |-
        Même amoché, son corps se régénère
        tant que le noyau rouge est intact.
        Le noyau s’illumine à minuit.
    white:
      en: |-
        If its body is torn, it can grow
        back if the red core remains.
        The core flashes at midnight.
      fr: |-
        Même amoché, son corps se régénère
        tant que le noyau rouge est intact.
        Le noyau s’illumine à minuit.
    black-2:
      en: |-
        As long as its red core remains,
        it can regenerate its body instantly,
        even if it’s torn apart.
    white-2:
      en: |-
        As long as its red core remains,
        it can regenerate its body instantly,
        even if it’s torn apart.
    x:
      ja-Hrkt: |-
        からだの　ちゅうしんで　ひかる
        コアが　あるかぎり　からだが
        ちぎれても　さいせい　できる。
      ja: |-
        体の　中心で　光る
        コアが　ある限り
        体が　ちぎれても　再生できる。
      ko: |-
        몸의 중심에서 빛나는
        핵이 있는 한 몸이
        찢겨나가도 재생할 수 있다.
      en: |-
        Even if its body is torn, it can regenerate as long as
        the glowing central core remains intact.
      fr: |-
        Même si son corps est détruit, il peut se régénérer
        aussi longtemps que son cœur est en bon état.
      de: |-
        Auch wenn sein Körper nicht mehr intakt ist,
        kann es sich regenerieren, wenn der Kern leuchtet.
      es: |-
        Aunque sus brazos se rompan podrán regenerarse,
        siempre y cuando su núcleo siga intacto.
      it: |-
        Anche se il corpo è lacerato, continua a rigenerarsi
        finché il nucleo ardente centrale rimane intatto.
    'y':
      ja-Hrkt: |-
        うみべに　おおく　あらわれ
        よるになると　ちゅうしんが
        あかく　てんめつする。
      ja: |-
        海辺に　多く　現れ
        夜になると　中心が
        赤く　点滅する。
      ko: |-
        해변에 많이 나타나며
        밤이 되면 가운데가
        빨갛게 깜박거린다.
      en: |-
        It appears in large numbers by seashores. At night,
        its central core flashes with a red light.
      fr: |-
        On peut voir des Stari en grand nombre près des
        côtes. La nuit, le centre de son corps clignote
        d’une lumière rouge.
      de: |-
        Es taucht in großer Anzahl an Ufern auf.
        Nachts leuchtet der Kern in seiner Mitte rot auf.
      es: |-
        Suele aparecer en grupos en la orilla de la playa. Por
        la noche, el órgano central que tiene brilla con una luz
        roja.
      it: |-
        Se ne trovano molti in riva al mare. Di notte, il nucleo
        al centro del corpo lampeggia di una luce rossa.
    omega-ruby:
      ja-Hrkt: |-
        なつの　おわりごろ　よるに　すなはまへ　いくと
        コアと　よばれる　きかんを　あかく　ひからせた
        ヒトデマンが　ほしの　ように　みえるよ。
      ja: |-
        夏の　終わりごろ　夜に　砂浜に　いくと
        コアと　呼ばれる　器官を　赤く　光らせた
        ヒトデマンが　星の　ように　見えるよ。
      ko: |-
        여름이 끝날 무렵 밤에 모래 해변에 가면
        핵이라고 불리는 기관을 붉게 빛내는
        별가사리가 별처럼 보인다.
      en: |-
        Staryu’s center section has an organ called the core that
        shines bright red. If you go to a beach toward the end of
        summer, the glowing cores of these Pokémon look like the
        stars in the sky.
      fr: |-
        Au centre de Stari se trouve un organe rouge et brillant appelé
        le cœur. À la fin de l’été, sur les plages, les cœurs de ces
        Pokémon brillent comme les étoiles dans le ciel.
      de: |-
        In Sterndus Körpermitte befindet sich ein hellrot leuchtendes
        Organ – sein Kern. Wenn du im Spätsommer an einen Strand
        gehst, sehen die leuchtenden Kerne dieser Pokémon aus wie
        Sterne.
      es: |-
        Staryu posee un órgano central, conocido como su núcleo,
        que brilla con una luz roja. A finales de verano, pueden verse
        en la playa los núcleos de estos Pokémon brillando como las
        estrellas del cielo.
      it: |-
        Al centro del corpo di Staryu è presente un nucleo che brilla
        di un rosso intenso. In spiaggia, a fine estate, il nucleo
        di questi Pokémon ha l’aspetto delle stelle nel firmamento.
    alpha-sapphire:
      ja-Hrkt: |-
        ちゅうしんの　あかい　コアを　てんめつさせて
        よぞらの　ほしと　こうしん　している　らしい。
        からだは　ちぎれても　じこさいせい　するぞ。
      ja: |-
        中心の　赤い　コアを　点滅させて
        夜空の　星と　交信　している　らしい。
        体は　千切れても　自己再生　するぞ。
      ko: |-
        가운데에 있는 빨간 코어를 점멸시켜
        밤하늘의 별과 교신하는 것 같다.
        몸은 찢겨 나가더라도 스스로 재생한다.
      en: |-
        Staryu apparently communicates with the stars in the night sky
        by flashing the red core at the center of its body. If parts of its
        body are torn, this Pokémon simply regenerates the missing
        pieces and limbs.
      fr: |-
        Stari communique apparemment avec les étoiles dans
        le ciel en faisant clignoter son cœur rouge. Si des parties
        de son corps sont cassées, ce Pokémon les régénère.
      de: |-
        Sterndu kommuniziert mit den Sternen am Nachthimmel,
        indem es den roten Kern in seiner Körpermitte blinken lässt.
        Wenn Teile seines Körpers beschädigt wurden, stellt es die
        fehlenden Teile selbst wieder her.
      es: |-
        Staryu parece comunicarse por la noche con las estrellas
        haciendo brillar el núcleo rojo de su cuerpo. Si este Pokémon
        sufre algún daño en alguna zona de su cuerpo, la regenerará
        sin problema.
      it: |-
        Pare che la notte Staryu comunichi con le stelle facendo
        brillare il suo nucleo rosso al centro del corpo. In caso di
        perdita di qualche appendice questo Pokémon riesce a
        rigenerarla senza problemi.
    sun:
      ja-Hrkt: |-
        うみべに　おおく　せいそく。
        よるに　なると　からだの　ちゅうしんが
        あやしく　あかく　かがやきだす。
      ja: |-
        海辺に　多く　生息。
        夜に　なると　身体の　中心が
        怪しく　赤く　輝きだす。
      ko: |-
        해변에 많이 서식한다.
        밤이 되면 몸의 중심이
        이상하고 빨갛게 빛을 낸다.
      zh-Hant: |-
        大多在海邊棲息。
        夜幕降臨時，身體的正中
        會閃耀出怪異的紅色光芒。
      zh-Hans: |-
        大多在海边栖息。
        夜幕降临时，身体的正中
        会闪耀出怪异的红色。
      en: |-
        Large numbers of these Pokémon make their
        home at the seaside. At night, a strange red
        glow radiates from the center of their bodies.
      fr: |-
        Ce Pokémon vit en grand nombre au fond de
        la mer. À la nuit tombée, son cœur émet une
        étrange lumière rouge.
      de: |-
        Es taucht in großer Zahl an Ufern auf.
        Nachts erstrahlt der Kern in seiner Mitte
        in einem unheimlichen Rot.
      es: |-
        Suelen vivir en el mar, cerca de la costa. Por la
        noche, su núcleo brilla con una misteriosa luz
        roja.
      it: |-
        Gli Staryu vivono numerosi in riva al mare.
        Di notte, il nucleo al centro del corpo brilla
        di una strana luce rossa.
    moon:
      ja-Hrkt: |-
        ネオラントなどに　かじられるが
        あかいコアが　あるかぎり　すぐに
        さいせいするので　きにしていない。
      ja: |-
        ネオラントなどに　かじられるが
        赤いコアが　ある限り　すぐに
        再生するので　気にしていない。
      ko: |-
        네오라이트 등에게 물리지만
        빨간 핵이 있는 한 바로
        재생되므로 신경 쓰지 않는다.
      zh-Hant: |-
        即使被霓虹魚之類的咬到，
        只要紅色的核心部分還在就會立刻再生，
        所以一點都不在意。
      zh-Hans: |-
        即使被霓虹鱼等咬到，
        只要红色内核部分还在就会立刻再生，
        所以对此并不在意。
      en: |-
        This Pokémon gets nibbled on by Lumineon and
        others. Thanks to its red core, it regenerates
        fast, so it’s unconcerned by their snack attacks.
      fr: |-
        Même s’il se fait manger des bras par un
        Luminéon, il peut les régénérer tant que son
        cœur rouge est intact, aussi ne s’en fait-il pas.
      de: |-
        Es wird ab und zu von Lumineon angeknabbert,
        aber solange es seinen roten Kern hat, kann es
        den abgebissenen Teil sofort wiederherstellen.
      es: |-
        A veces recibe ataques de Lumineon y otros
        Pokémon, pero puede regenerar cualquier parte
        de su cuerpo mientras su núcleo siga intacto.
      it: |-
        Se gli capita di venire mangiucchiato da un
        Lumineon, non si preoccupa, perché finché
        il nucleo rosso rimane intatto, può rigenerarsi.
    ultra-sun:
      ja-Hrkt: |-
        ほしくずが　うみに　おちて
        ヒトデマンに　なったのだ　という
        みんわが　かくちに　のこっている。
      ja: |-
        星屑が　海に　落ちて
        ヒトデマンに　なったのだ　という
        民話が　各地に　残っている。
      ko: |-
        무수한 별들이 바다로 떨어져
        별가사리가 되었다고 하는
        민화가 각지에 남아 있다.
      zh-Hant: |-
        在各地都流傳著
        星星落到海中之後變成了
        海星星的民間傳說。
      zh-Hans: |-
        在各地都流传着
        星屑掉到海里就会变成海星星
        这样的民间故事。
      en: |-
        In many places, there are folktales of stardust
        falling into the ocean and becoming Staryu.
      fr: |-
        Si l’on en croit une légende populaire, il serait
        né d’une pluie de poussière d’étoiles tombée
        dans la mer.
      de: |-
        Einer weitverbreiteten Volkssage zufolge ist
        Sterndu aus Sternennebel entstanden, der ins
        Meer gefallen war.
      es: |-
        Varias leyendas populares atribuyen su origen
        a polvo de estrellas que se precipitó en la mar.
      it: |-
        In molti luoghi è ancora diffusa la credenza
        che gli Staryu nascano da polvere di stelle
        caduta in fondo al mare.
    ultra-moon:
      ja-Hrkt: |-
        いくら　きずついても　へいき。
        さいせいのうりょくが　たかいので
        はんにちぐらいで　もとに　もどるぞ。
      ja: |-
        いくら　傷ついても　平気。
        再生能力が　高いので
        半日ぐらいで　元に　戻るぞ。
      ko: |-
        아무리 상처를 입어도 문제없다.
        재생 능력이 높아서
        한나절이면 원래대로 돌아온다.
      zh-Hant: |-
        不管受多少傷都不怕。
        由於再生能力很強，
        只要半天左右就會復原。
      zh-Hans: |-
        不管受了多少伤也没问题。
        再生能力很高，
        所以半天左右就会复原。
      en: |-
        No number of injuries can bother Staryu. Its
        amazing regenerative powers return it to its
        previous state in half a day!
      fr: |-
        Étant capable de se régénérer en une demi-
        journée seulement, il ne craint aucune blessure.
      de: |-
        Verletzungen machen diesem Pokémon nichts
        aus. Dank seiner Regenerationsfähigkeit ist es
        einen halben Tag später schon wieder wie neu.
      es: |-
        Puede sufrir graves heridas sin problema,
        ya que sus notables facultades regenerativas
        le permiten recuperarse en apenas medio día.
      it: |-
        Le ferite non sono un problema per Staryu:
        grazie alle sue eccellenti capacità rigenerative,
        torna intero in mezza giornata.
    lets-go-pikachu:
      ja-Hrkt: |-
        からだの　ちゅうしんぶぶん　さえ
        のこっていれば　どんなに　こまかく
        きられても　さいせいするという。
      ja: |-
        体の　中心部分　さえ
        残っていれば　どんなに　細かく
        切られても　再生するという。
      ko: |-
        몸의 중심 부분만
        남아 있으면 아무리 잘게
        잘려도 재생한다고 한다.
      zh-Hant: |-
        據說不管被切成多小塊，
        只要身體的中心部分還留著，
        就能重新長回來。
      zh-Hans: |-
        据说只要它身体的中心
        部分还存活着，即使
        被切成小块也能再生。
      en: |-
        As long as the center section is unharmed,
        this Pokémon can grow back fully even if it is
        chopped to bits.
      fr: |-
        Même découpé en mille morceaux, il peut
        régénérer les parties de son corps tant que
        sa partie centrale reste indemne.
      de: |-
        Selbst wenn es zerstückelt wird, kann es seinen
        Körper immer wieder regenerieren, solange sein
        Kernstück unversehrt bleibt.
      es: |-
        Aunque haya perdido partes de su cuerpo, le
        crecerán de nuevo siempre y cuando su parte
        central se mantenga intacta.
      it: |-
        Si dice che Staryu possa rigenerarsi anche dopo
        essere stato fatto a pezzetti, purché il suo centro
        sia rimasto intatto.
    lets-go-eevee:
      ja-Hrkt: |-
        からだの　ちゅうしんぶぶん　さえ
        のこっていれば　どんなに　こまかく
        きられても　さいせいするという。
      ja: |-
        体の　中心部分　さえ
        残っていれば　どんなに　細かく
        切られても　再生するという。
      ko: |-
        몸의 중심 부분만
        남아 있으면 아무리 잘게
        잘려도 재생한다고 한다.
      zh-Hant: |-
        據說不管被切成多小塊，
        只要身體的中心部分還留著，
        就能重新長回來。
      zh-Hans: |-
        据说只要它身体的中心
        部分还存活着，即使
        被切成小块也能再生。
      en: |-
        As long as the center section is unharmed,
        this Pokémon can grow back fully even if it is
        chopped to bits.
      fr: |-
        Même découpé en mille morceaux, il peut
        régénérer les parties de son corps tant que
        sa partie centrale reste indemne.
      de: |-
        Selbst wenn es zerstückelt wird, kann es seinen
        Körper immer wieder regenerieren, solange sein
        Kernstück unversehrt bleibt.
      es: |-
        Aunque haya perdido partes de su cuerpo, le
        crecerán de nuevo siempre y cuando su parte
        central se mantenga intacta.
      it: |-
        Si dice che Staryu possa rigenerarsi anche dopo
        essere stato fatto a pezzetti, purché il suo centro
        sia rimasto intatto.
    sword:
      ja-Hrkt: |-
        なつのおわりの　はまべに　いくと
        きそくてきな　リズムで　ひかる
        ヒトデマンの　むれが　みられるよ。
      ja: |-
        夏の終わりの　浜辺に　行くと
        規則的な　リズムで　光る
        ヒトデマンの　群れが　見られるよ。
      ko: |-
        늦여름 해변에 가면
        규칙적인 리듬으로 빛나는
        별가사리의 무리를 볼 수 있다.
      zh-Hant: |-
        在夏天快結束時到海邊，
        就能看見成群的海星星
        有規律地一閃一閃發光。
      zh-Hans: |-
        夏季快结束时去海边，
        就能看到以有规律的节奏
        发光的海星星族群。
      en: |-
        If you visit a beach at the end of summer, you’ll
        be able to see groups of Staryu lighting up in a
        steady rhythm.
      fr: |-
        Lorsqu’on se rend en bord de mer à la fin
        de l’été, on peut voir des groupes de Stari
        clignoter à un rythme régulier.
      de: |-
        Bei spätsommerlichen Strandbesuchen kann man
        Gruppen von Sterndu begegnen, deren Kerne in
        gleichmäßigem Rhythmus aufblinken.
      es: |-
        A finales de verano, se pueden ver grupos de
        Staryu en la orilla de la playa sincronizando el
        brillo de sus núcleos a ritmo regular.
      it: |-
        Alla fine dell’estate, sui litorali è possibile
        osservare gruppi di Staryu che emettono luce
        a un ritmo regolare.
    shield:
      ja-Hrkt: |-
        さかなポケモンに　ついばまれるが
        からだが　ちぎれても　すぐに
        さいせいするので　きにしない。　
      ja: |-
        魚ポケモンに　ついばまれるが
        体が　ちぎれても
        すぐに　再生するので　気にしない。
      ko: |-
        물고기포켓몬에게 물리곤 하지만
        몸이 찢겨도 금방 재생되기 때문에
        신경 쓰지 않는다.
      zh-Hant: |-
        會被魚寶可夢啄食，但是
        即使身體被咬斷也能很快就
        再生，所以一點都不在意。
      zh-Hans: |-
        虽然会遭到鱼宝可梦的啄食，
        但身体即使被咬掉一块也能
        马上再生，所以完全不在意。
      en: |-
        Fish Pokémon nibble at it, but Staryu isn’t
        bothered. Its body regenerates quickly, even
        if part of it is completely torn off.
      fr: |-
        Il ne se soucie guère des Pokémon poissons
        qui viennent le grignoter, car même si son corps
        est déchiqueté, il se régénère aussitôt.
      de: |-
        Ihm macht es nichts aus, von Fisch-Pokémon
        angeknabbert zu werden, da sich sein Körper
        bei Verletzungen im Nu regeneriert.
      es: |-
        No le importa que le mordisqueen el cuerpo los
        Pokémon pez, ya que las partes desgarradas se
        regeneran casi al instante.
      it: |-
        Viene mangiucchiato dai Pokémon acquatici,
        ma non ci dà peso, perché le parti danneggiate
        del suo corpo si rigenerano subito.
  form_description: {  }
  forms_switchable: false
  gender_rate: '-1'
  generation: generation-i
  genus:
    ja-Hrkt: ほしがたポケモン
    ja: ほしがたポケモン
