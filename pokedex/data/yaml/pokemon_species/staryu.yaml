    firered:
      en: |-
        It appears in large numbers by seashores.
        At night, its central core flashes with a
        red light.
    leafgreen:
      en: |-
        An enigmatic POKéMON that can effortlessly
        regenerate any appendage it loses in
        battle.
    diamond:
      en: |-
        If its body is torn, it can grow
        back if the red core remains.
        The core flashes at midnight.
    pearl:
      en: |-
        If its body is torn, it can grow
        back if the red core remains.
        The core flashes at midnight.
    platinum:
      en: |-
        If its body is torn, it can grow
        back if the red core remains.
        The core flashes at midnight.
    heartgold:
      en: |-
