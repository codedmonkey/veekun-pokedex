    x:
      ja-Hrkt: |-
        すいしょうのような　タマには
        てんこうを　じゆうに　あやつる
        のうりょくが　ひめられているらしい。
      ja: |-
        水晶のような　玉には
        天候を　自由に　操る
        能力が　秘められているらしい。
      ko: |-
        수정 같은 구슬에는
        날씨를 자유롭게 조종하는
        능력이 담겨 있는 듯하다.
      en: |-
        Its crystalline orbs appear to give this Pokémon
        the power to freely control the weather.
      fr: |-
        Ses orbes de cristal donnent le pouvoir de contrôler
        le climat.
      de: |-
        Die kristallenen Bälle an seinem Schweif
        ermöglichen es ihm, das Wetter zu beeinflussen.
      es: |-
        Sus cristalinos orbes parecen darle al Pokémon el
        poder de controlar el clima libremente.
      it: |-
        Pare che le sfere di cristallo diano a questo Pokémon
        il pieno controllo sulle condizioni atmosferiche.
    'y':
      ja-Hrkt: |-
        オーラに　つつまれる　しんせいな
        いきものらしい。てんきを　かえる
        ちからを　もつと　いわれている。
      ja: |-
        オーラに　包まれる　神聖な
        生き物らしい。天気を　変える
        力を　持つと　言われている。
      ko: |-
        오라에 싸여있는 신성한
        생명체인 듯하다. 날씨를 바꾸는
        힘을 가졌다고 한다.
      en: |-
        A mystical Pokémon that exudes a gentle aura.
        It is said to have the ability to change the weather.
      fr: |-
        Un Pokémon légendaire plein de charme. Il peut
        contrôler les variations climatiques.
      de: |-
        Ein mysteriöses Pokémon mit einer sehr freundlichen
        Ausstrahlung. Es kann das Klima beeinflussen.
      es: |-
        Es un Pokémon misterioso. Está rodeado de una sutil
        aura y tiene la capacidad de cambiar el clima.
      it: |-
        Pokémon etereo che emana un’aura mite e ha la
        capacità di mutare il clima.
    omega-ruby:
      ja-Hrkt: |-
        おおきな　エネルギーを　からだに　ためている。
        くびと　しっぽの　すいしょうから　エネルギーを
        ときはなち　あたりの　てんきを　かえると　いう。
      ja: |-
        大きな　エネルギーを　体に　ためている。
        首と　尻尾の　水晶から　エネルギーを
        解き放ち　あたりの　天気を　変えると　いう。
      ko: |-
        큰 에너지를 몸에 모으고 있다.
        목과 꼬리의 수정에서 에너지를
        발산하여 주변 날씨를 바꾼다고 한다.
      en: |-
        Dragonair stores an enormous amount of energy inside its
        body. It is said to alter weather conditions in its vicinity by
        discharging energy from the crystals on its neck and tail.
      fr: |-
        Draco stocke une quantité d’énergie considérable dans
        son corps. On raconte qu’il peut modifier les conditions
        climatiques autour de lui en déchargeant l’énergie contenue
        dans les cristaux de son cou et de sa queue.
      de: |-
        Dragonir speichert eine enorme Menge an Energie in seinem
        Körper. Es kann die Witterung in seiner Umgebung ändern,
        indem es Energie aus den Kristallen an seinem Hals und
        an seinem Schweif entlädt.
      es: |-
        Dragonair acumula grandes cantidades de energía dentro de
        sí. Dicen que altera el clima de la zona en la que está
        descargando energía a través de las esferas de cristal que
        tiene en el cuello y en la cola.
      it: |-
        Dragonair accumula un’enorme quantità d’energia all’interno
        del corpo. Si dice che sia in grado di mutare le condizioni
        meteorologiche circostanti scaricando energia dai cristalli
        del collo e della coda.
    alpha-sapphire:
      ja-Hrkt: |-
        おおきな　エネルギーを　からだに　ためている。
        くびと　しっぽの　すいしょうから　エネルギーを
        ときはなち　あたりの　てんきを　かえると　いう。
      ja: |-
