        목과 꼬리의 수정에서 에너지를
        발산하여 주변 날씨를 바꾼다고 한다.
      en: |-
        Dragonair stores an enormous amount of energy inside
        its body. It is said to alter weather conditions in its vicinity
        by discharging energy from the crystals on its neck and tail.
      fr: |-
        Draco stocke une quantité d’énergie considérable dans
        son corps. On raconte qu’il peut modifier les conditions
        climatiques autour de lui en déchargeant l’énergie contenue
        dans les cristaux de son cou et de sa queue.
      de: |-
        Dragonir speichert eine enorme Menge an Energie in seinem
        Körper. Es kann die Witterung in seiner Umgebung ändern,
        indem es Energie aus den Kristallen an seinem Hals und
        an seinem Schweif entlädt.
      es: |-
        Dragonair acumula grandes cantidades de energía dentro de
        sí. Dicen que altera el clima de la zona en la que está
        descargando energía a través de las esferas de cristal que
        tiene en el cuello y en la cola.
      it: |-
        Dragonair accumula un’enorme quantità d’energia all’interno
        del corpo. Si dice che sia in grado di mutare le condizioni
        meteorologiche circostanti scaricando energia dai cristalli
        del collo e della coda.
    sun:
      ja-Hrkt: |-
        すいしょうの　ような　タマには
        てんこうを　あやつる　パワーが
        ひめられていると　いわれている。
      ja: |-
        水晶の　ような　玉には
        天候を　操る　パワーが
        秘められていると　いわれている。
      ko: |-
        수정 같은 구슬에는
        날씨를 조종하는 힘이
        숨겨져 있다고 전해진다.
      zh-Hant: |-
        據說，在水晶般的珠子裡
        蘊含著操縱天氣的力量。
      zh-Hans: |-
        据说，在水晶般的珠子里
        蕴含着操纵天气的力量。
      en: |-
        It has long been thought that its crystalline
        orbs are imbued with the power to control
        the weather.
      fr: |-
        Beaucoup pensent que les orbes cristallins
        de ce Pokémon ont le pouvoir de modifier
        le climat.
      de: |-
        Es heißt, es könne mit den kristallenen Bällen
        an seinem Schweif das Wetter beeinflussen.
      es: |-
        Se dice que sus cristalinos orbes confieren a
        este Pokémon el poder de controlar el clima.
      it: |-
        Si dice che le sfere di cristallo che ha sul corpo
        gli permettano di controllare le condizioni
        atmosferiche.
    moon:
      ja-Hrkt: |-
        てんこうを　つかさどる　ものとして
        たいこから　のうぎょうを　いとなむ
        ひとびとに　あがめられてきた。
      ja: |-
        天候を　司る　者として
        太古から　農業を　営む
        人々に　崇められてきた。
      ko: |-
        날씨를 지배하는 존재로서
        태고부터 농업에 종사하는
        사람들에게 받들어져 왔다.
      zh-Hant: |-
        自太古時代就被
        從事農業的人們當做
        掌管天氣者而崇拜著。
      zh-Hans: |-
        自太古时代起就被
        从事农业的人们当做
        掌管天气者而崇拜着。
      en: |-
        From time immemorial, it has been venerated by
        agricultural peoples as an entity able to control
        the weather.
      fr: |-
        Il est adoré depuis l’Antiquité dans certaines
        communautés paysannes en tant que divinité
        des conditions climatiques.
      de: |-
        Bauern verehren es schon seit Urzeiten,
        da es die Fähigkeit besitzt, das Wetter
        zu beeinflussen.
      es: |-
        Ha sido venerado desde tiempos ancestrales
        por los pueblos agrícolas, debido a que con sus
        poderes puede controlar el clima.
      it: |-
        Fin dall’antichità è venerato dai popoli dediti
        all’agricoltura per la sua capacità di controllare
        le condizioni atmosferiche.
    ultra-sun:
      ja-Hrkt: |-
        てんこうを　あやつると　しんじられ
        ハクリューの　すむ　みずうみには
        おそなえものが　たえない。　
      ja: |-
        天候を　操ると　信じられ
        ハクリューの　棲む　湖には
        お供え物が　絶えない。
      ko: |-
        날씨를 조종한다는 믿음 때문에
        신뇽이 있는 호수에는
        공물이 끊이지 않는다.
      zh-Hant: |-
        人們相信牠能操縱天氣，
        所以哈克龍居住的湖裡
        總是不乏人們獻上的供品。
      zh-Hans: |-
        人们相信它能操纵天气，
        所以在哈克龙栖息的湖里，
        供品总是源源不断。
      en: |-
        Lakes where Dragonair live are filled with
        offerings from people, because they believe this
        Pokémon is able to control the weather.
      fr: |-
        On raconte que ce Pokémon a le pouvoir de
        modifier le climat. Les offrandes affluent donc
        au bord des lacs où il vit.
      de: |-
        Aufgrund der Annahme, es könne das Wetter
        beeinflussen, finden sich an Seen, die es
        bewohnt, viele Opfergaben.
      es: |-
        Existe la creencia de que puede controlar el
        clima y a menudo se hallan ofrendas a orillas
        de los lagos donde habita.
      it: |-
        Si crede che abbia il potere di controllare le
        condizioni atmosferiche. Presso i laghi in cui
        vive non mancano mai offerte a lui dedicate.
    ultra-moon:
      ja-Hrkt: |-
        としあけに　からだを　くねらせながら
        そらを　とぶ　すがたを　みられると
        いちねん　けんこうだと　いわれる。
      ja: |-
        年明けに　身体を　くねらせながら
        空を　飛ぶ　姿を　見られると
        １年　健康だと　いわれる。
      ko: |-
        새해에 몸을 구부리며
        하늘을 나는 모습을 보면
        1년 동안 건강하다고 전해진다.
      zh-Hant: |-
        據說如果能在新年時看見
        牠扭動身子在空中飛翔的樣子，
        這一年就能過得很健康。
      zh-Hans: |-
        据说在新年时，如果能看到它
        扭动着身子在空中飞翔的样子，
        那么这一年就能健健康康的。
      en: |-
        Some say that if you see it at the start of the
        year, flying through the sky and twisting its
        body, you’ll be healthy all year long.
      fr: |-
        Voir ce Pokémon serpenter dans le ciel
        au réveillon présage d’une bonne santé
        pour la nouvelle année.
      de: |-
        Wenn man zu Neujahr sieht, wie sich ein
        Dragonir durch die Lüfte schlängelt, erwartet
        einen angeblich ein Jahr bester Gesundheit.
      es: |-
        Se dice que ver a este Pokémon serpenteando
        por los cielos en año nuevo es augurio de buena
        salud para el año entrante.
      it: |-
        Si dice che se si vede questo Pokémon
        serpeggiare nel cielo all’inizio dell’anno,
        si avranno dodici mesi di ottima salute.
    lets-go-pikachu:
      ja-Hrkt: |-
        もくげきした　ひとの　はなしによると
        からだからは　オーラが　だされて
        しんぴてきだった　という。
      ja: |-
        目撃した　人の　話によると
        体からは　オーラが　出されて
        神秘的だった　という。
      ko: |-
        목격한 사람의 말에 의하면
        몸에서 오라가 나와서
        신비로웠다고 한다.
      zh-Hant: |-
        根據目擊者的說法，
        牠的全身上下散發著
        一種神秘的氣場。
      zh-Hans: |-
        根据目击者的描述，
        哈克龙的身上散发着
        一种神秘的气场。
      en: |-
        According to a witness, its body was surrounded
        by a strange aura that gave it a mystical look.
      fr: |-
        Selon des témoins, son corps est baigné d’une
        étrange aura lui donnant un air mystique.
      de: |-
        Augenzeugenberichten zufolge wird Dragonirs
        Körper von einer seltsamen Aura umgeben,
        die ihm eine mysteriöse Ausstrahlung verleiht.
      es: |-
        Según un testigo, está rodeado por una extraña
        aura, que le da un aspecto misterioso y místico.
      it: |-
        Chi lo ha incontrato racconta che questo
        Pokémon è circondato da un’aura misteriosa.
    lets-go-eevee:
      ja-Hrkt: |-
        もくげきした　ひとの　はなしによると
        からだからは　オーラが　だされて
        しんぴてきだった　という。
      ja: |-
        目撃した　人の　話によると
        体からは　オーラが　出されて
        神秘的だった　という。
      ko: |-
        목격한 사람의 말에 의하면
        몸에서 오라가 나와서
        신비로웠다고 한다.
      zh-Hant: |-
