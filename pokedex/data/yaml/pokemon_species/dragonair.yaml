        牠的全身上下散發著
        一種神秘的氣場。
      zh-Hans: |-
        根据目击者的描述，
        哈克龙的身上散发着
        一种神秘的气场。
      en: |-
        According to a witness, its body was surrounded
        by a strange aura that gave it a mystical look.
      fr: |-
        Selon des témoins, son corps est baigné d’une
        étrange aura lui donnant un air mystique.
      de: |-
        Augenzeugenberichten zufolge wird Dragonirs
        Körper von einer seltsamen Aura umgeben,
        die ihm eine mysteriöse Ausstrahlung verleiht.
      es: |-
        Según un testigo, está rodeado por una extraña
        aura, que le da un aspecto misterioso y místico.
      it: |-
        Chi lo ha incontrato racconta che questo
        Pokémon è circondato da un’aura misteriosa.
    sword:
      ja-Hrkt: |-
        きれいな　うみや　みずうみに　すむ。
        てんこうを　あやつる　ちからで
        かぜに　のり　そらへと　のぼる。
      ja: |-
        きれいな　海や　湖に　棲む。
        天候を　操る　力で
        風に　乗り　空へと　昇る。
      ko: |-
        깨끗한 바다나 호수에 산다.
        날씨를 조종하는 힘으로
        바람을 타고 하늘로 오른다.
      zh-Hant: |-
        棲息在清澈的海洋或湖泊。
        能利用操縱天氣的力量，
        乘著風升上天空。
      zh-Hans: |-
        栖息在美丽的大海或湖泊。
        可以通过操纵天气的力量
        驾风升上天空。
      en: |-
        This Pokémon lives in pristine oceans and lakes.
        It can control the weather, and it uses this power
        to fly into the sky, riding on the wind.
      fr: |-
        Il vit dans les mers et les lacs aux eaux claires.
        Sa maîtrise de la météo lui permet de s’élever
        dans le ciel en se laissant porter par le vent.
      de: |-
        Dragonir lebt in klaren Meeren und Seen.
        Mit seiner Gabe, das Wetter zu beeinflussen,
        schwingt es sich auf dem Wind in den Himmel.
      es: |-
        Vive en lagos y mares de aguas cristalinas. Su
        poder para controlar el clima le permite alzar el
        vuelo llevado por el viento.
      it: |-
        Vive in mari e laghi dalle acque limpide.
        Grazie alla sua capacità di controllare il clima,
        sfrutta il vento per spiccare il volo.
    shield:
      ja-Hrkt: |-
        しっぽの　たまに　ちからを　あつめて
        てんこうを　あやつる。　オーラを
        まとう　すがたは　しんぴてき。
      ja: |-
        尻尾の　玉に　力を　集めて
        天候を　操る。
        オーラを　まとう　姿は　神秘的。
      ko: |-
        꼬리의 구슬에 힘을 모아
        날씨를 조종한다. 오라에
        둘러싸인 모습은 신비롭다.
      zh-Hant: |-
        能將力量集中在尾巴的珠子，
        藉此操縱天氣。全身散發著
        氣場的樣子非常神秘。
      zh-Hans: |-
        把力量集中在尾巴的
        珠子上操纵天气。
        散发气场的样子非常神秘。
      en: |-
        This Pokémon gathers power in the orbs on its
        tail and controls the weather. When enshrouded
        by an aura, Dragonair has a mystical appearance.
      fr: |-
        Il contrôle la météo en accumulant de l’énergie
        dans les orbes au bout de sa queue. Sa silhouette
        nimbée d’une aura lui confère un air mystique.
      de: |-
        Mit der Kraft, die es in den Bällen an seinem
        Schweif sammelt, beeinflusst es das Wetter. Seine
        in eine Aura gehüllte Gestalt steckt voller Mystik.
      es: |-
        Acumula energía en las esferas de la cola para
        controlar el clima. La sutil aura que lo rodea le
        confiere un aspecto misterioso y místico.
      it: |-
        Accumula energia nelle sfere che ha sulla coda
        e controlla le condizioni atmosferiche. Avvolto
        dalla sua aura ha un aspetto misterioso.
