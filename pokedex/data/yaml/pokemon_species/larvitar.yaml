        has finished eating the surrounding soil.
    white-2:
      en: |-
        Born deep underground, it comes
        aboveground and becomes a pupa once it
        has finished eating the surrounding soil.
    x:
      ja-Hrkt: |-
        つちを　たべて　いきている。
        おおきな　やまひとつ　たべおわると
        せいちょうのため　ねむりはじめる。
      ja: |-
        土を　食べて　生きている。
        大きな　山ひとつ　食べ終わると
        成長のため　眠りはじめる。
      ko: |-
        흙을 먹으며 살고 있다.
        큰 산을 하나 다 먹으면
        성장을 위해 잠자기 시작한다.
      en: |-
        It feeds on soil. After it has eaten a large mountain,
        it falls asleep so it can grow.
      fr: |-
        Il se nourrit de terre. Une fois qu’il a absorbé une
        montagne, il s’endort et commence à évoluer.
      de: |-
        Es ernährt sich von Erde. Nachdem es einen Berg
        verspeist hat, schläft es ein, um zu wachsen.
      es: |-
        Se alimenta de tierra. Después de comer una gran
        montaña, se duerme y empieza a crecer.
      it: |-
        Si nutre di terra. Dopo aver divorato una montagna
        intera, si addormenta per poter crescere.
    'y':
      ja-Hrkt: |-
        ちてい　おくふかくで　うまれる。
        まわりの　つちを　たいらげると
        ちじょうに　あらわれ　サナギになる。
      ja: |-
        地底　奥深くで　生まれる。
        まわりの　土を　たいらげると
        地上に　現われ　サナギになる。
      ko: |-
        땅속 깊은 곳에서 태어난다.
        주변의 흙을 다 먹으면
        지상으로 올라와 번데기가 된다.
      en: |-
        Born deep underground, it comes aboveground and
        becomes a pupa once it has finished eating the
        surrounding soil.
      fr: |-
        Il vit très profond sous terre. Il n’en sort pour évoluer
        qu’après avoir dévoré tout ce qui l’entourait.
      de: |-
        Sie schlüpfen tief unter der Erde und fressen sich
        durch das Erdreich bis zur Oberfläche durch,
        wo sie sich verpuppen.
      es: |-
        Nace muy profundo en el suelo y sube a la superficie,
        donde se convierte en una larva comiéndose la tierra
        que lo rodea.
      it: |-
        Nasce nelle profondità del sottosuolo. Dopo aver
        divorato la terra circostante emerge in superficie e
        diventa crisalide.
    omega-ruby:
      ja-Hrkt: |-
        ちちゅう　ふかくで　うまれる　ヨーギラスは
        つちを　たべつくして　ちじょうへ　でないと
        おやの　かおを　みる　ことが　できないのだ。
      ja: |-
        地中　深くで　生まれる　ヨーギラスは
        土を　食べ尽くして　地上へ　出ないと
        親の　顔を　見る　ことが　できないのだ。
      ko: |-
        땅속 깊은 곳에서 태어나는 애버라스는
        흙을 먹어치우고 지상에 나오지 않으면
        부모의 얼굴을 볼 수가 없다.
      en: |-
        Larvitar is born deep under the ground. To come up to the
        surface, this Pokémon must eat its way through the soil above.
        Until it does so, Larvitar cannot see its parents.
      fr: |-
        Embrylex est né sous terre. Pour remonter à la surface,
        ce Pokémon doit manger la terre au-dessus de lui.
        Jusqu’à ce qu’il y parvienne, Embrylex ne peut pas voir
        le visage de ses parents.
      de: |-
        Larvitar wurde tief unter der Erde geboren. Um an die
        Oberfläche zu gelangen, muss es sich durch das Erdreich
        fressen. Erst dann bekommt es seine Eltern zu Gesicht.
      es: |-
        Larvitar nace bajo tierra a gran profundidad. Para subir a la
        superficie, este Pokémon debe comer lo que encuentra en su
        camino para abrirse paso. Y, hasta que no está arriba, no
        puede verles la cara a sus padres.
      it: |-
        Larvitar nasce nelle viscere della terra. Per emergere
        in superficie deve farsi strada inghiottendo la terra che
        lo ostacola. Larvitar non può vedere il volto dei propri
        genitori finché non emerge.
    alpha-sapphire:
      ja-Hrkt: |-
        ちちゅう　ふかくで　うまれる　ヨーギラスは
        つちを　たべつくして　ちじょうへ　でないと
        おやの　かおを　みる　ことが　できないのだ。
      ja: |-
        地中　深くで　生まれる　ヨーギラスは
        土を　食べ尽くして　地上へ　出ないと
        親の　顔を　見る　ことが　できないのだ。
      ko: |-
        땅속 깊은 곳에서 태어나는 애버라스는
        흙을 먹어치우고 지상에 나오지 않으면
        부모의 얼굴을 볼 수가 없다.
      en: |-
        Larvitar is born deep under the ground. To come up to the
        surface, this Pokémon must eat its way through the soil above.
        Until it does so, Larvitar cannot see its parents.
      fr: |-
        Embrylex est né sous terre. Pour remonter à la surface,
        ce Pokémon doit manger la terre au-dessus de lui.
        Jusqu’à ce qu’il y parvienne, Embrylex ne peut pas voir
        le visage de ses parents.
      de: |-
        Larvitar wurde tief unter der Erde geboren. Um an die
        Oberfläche zu gelangen, muss es sich durch das Erdreich
        fressen. Erst dann bekommt es seine Eltern zu Gesicht.
      es: |-
        Larvitar nace bajo tierra a gran profundidad. Para subir a la
        superficie, este Pokémon debe comer lo que encuentra en su
        camino para abrirse paso. Y, hasta que no está arriba, no
        puede verles la cara a sus padres.
      it: |-
        Larvitar nasce nelle viscere della terra. Per emergere
        in superficie deve farsi strada inghiottendo la terra che
        lo ostacola. Larvitar non può vedere il volto dei propri
        genitori finché non emerge.
    ultra-sun:
      ja-Hrkt: |-
        ちかで　うまれ　つちを　くいながら
        おやの　いる　ちじょうを　めざす。
        まぶしいので　ひかりは　にがてだよ。
      ja: |-
        地下で　生まれ　土を　食いながら
        親の　いる　地上を　目指す。
        まぶしいので　光は　苦手だよ。
      ko: |-
        지하에서 태어나 흙을 먹으면서
        어버이가 있는 지상을 향해 올라간다.
        눈이 부셔서 빛은 좋아하지 않는다.
      zh-Hant: |-
        誕生在地裡，會一邊吃著泥土
        一邊朝母親所在的地面上前進。
        光線很刺眼，所以牠不太能適應。
      zh-Hans: |-
        诞生于地下，会一边吃着泥土，
        一边朝至亲所在的地面前进。
        因为光线刺眼，所以它不太能适应哦。
      en: |-
        Born underground, it eats its way through dirt to
        the surface, where its parents are. It doesn’t
        deal well with the bright light it finds there.
      fr: |-
        Il naît sous terre et doit se frayer un chemin à
        coups de mâchoire pour rejoindre ses parents
        à la surface. Il déteste la lumière, qui l’éblouit.
      de: |-
        Es wird unterirdisch geboren und frisst sich
        durchs Erdreich an die Oberfläche zu seinen
        Eltern. Es verabscheut grelles, blendendes Licht.
      es: |-
        Nace bajo el suelo y, para reunirse con sus
        progenitores en la superficie, asciende comiendo
        tierra. Evita la luz directa porque lo deslumbra.
      it: |-
        Nasce sottoterra e risale in superficie verso i
        genitori mangiando la terra lungo il cammino.
        Detesta la luce, che trova troppo abbagliante.
    ultra-moon:
      ja-Hrkt: |-
        つちの　なかの　えいようで　そだつ。
        およそ　やま　ひとつぶんの　つちを
        くうことで　サナギに　なるのだ。
      ja: |-
        土の　中の　栄養で　育つ。
        およそ　山　１つ分の　土を
        食うことで　サナギに　なるのだ。
      ko: |-
        땅속의 영양으로 성장한다.
        대략 산 하나만큼의 흙을
        먹으면 번데기가 된다.
      zh-Hant: |-
        靠著土中的營養長大。
        當吃下大約一座山那麼多的
        土壤之後，牠就會變成蛹。
      zh-Hans: |-
        靠着土壤中的养分长大。
        当吃下大约一座山那么多的土后，
        它就会变成蛹。
      en: |-
        Raised on nutrients it finds in the dirt, it eats
        roughly a mountain’s worth of dirt before
        it becomes a pupa.
      fr: |-
        Il se nourrit des nutriments présents dans le
        sol. Il lui faut dévorer l’équivalent d’une petite
        montagne pour se changer en chrysalide.
      de: |-
        Es wächst durch die Nährstoffe im Boden.
        Wenn es ungefähr einen ganzen Berg Erde
        gefressen hat, verpuppt es sich.
      es: |-
        Crece alimentándose de nutrientes del suelo.
        Tras devorar el equivalente a una pequeña
        montaña, se prepara para convertirse en pupa.
      it: |-
        Cresce assorbendo nutrimento dal terreno.
        Dopo aver divorato una quantità di terra
        pari a una montagna, diventa crisalide.
    sword:
      ja-Hrkt: |-
        ちてい　おくふかくで　うまれる。
        まわりの　つちを　たいらげると
        ちじょうに　あらわれ　サナギになる。
      ja: |-
        地底　奥深くで　生まれる。
        まわりの　土を　たいらげると
        地上に　現われ　サナギになる。
      ko: |-
        땅속 깊은 곳에서 태어난다.
        주변의 흙을 다 먹으면
        지상으로 올라와 번데기가 된다.
      zh-Hant: |-
        誕生於地底深處。
        把周圍的泥土都吃光後，
        就會出現在地上變成蛹。
      zh-Hans: |-
        诞生于地底深处。
        把周围的土都吃光后，
        就会出现在地上变成蛹。
      en: |-
        Born deep underground, it comes
        aboveground and becomes a pupa once it
        has finished eating the surrounding soil.
      fr: |-
        Il naît dans les profondeurs du sol.
        Après avoir englouti toute la terre qui l’entoure,
        il fait surface et se change en chrysalide.
      de: |-
        Sie schlüpfen tief unter der Erde und fressen sich
        durch das Erdreich bis zur Oberfläche durch,
        wo sie sich verpuppen.
      es: |-
        Nace en el subsuelo a gran profundidad. Tras
        ingerir la tierra que lo rodea, emerge a la
        superficie y se convierte en pupa.
      it: |-
        Nasce nelle profondità del sottosuolo.
        Dopo aver divorato la terra circostante
        emerge in superficie e diventa crisalide.
    shield:
      ja-Hrkt: |-
        つちを　たべて　いきている。
        おおきな　やまひとつ　たべおわると
        せいちょうのため　ねむりはじめる。
      ja: |-
        土を　食べて　生きている。
        大きな　山ひとつ　食べ終わると
        成長のため　眠りはじめる。
      ko: |-
        흙을 먹으며 살고 있다.
        큰 산 하나를 다 먹으면
        성장을 위해 잠자기 시작한다.
      zh-Hant: |-
        靠吃泥土維生。
        吃掉一座大山後，
        就會為了成長而開始沉睡。
      zh-Hans: |-
        以吃土为生。
        吃掉一座大山后，
        就会为了成长而开始沉睡。
      en: |-
        It feeds on soil. After it has eaten a large
        mountain, it will fall asleep so it can grow.
      fr: |-
        Il vit en se nourrissant de terre.
        Après avoir dévoré une montagne, il s’endort
        et entame sa croissance.
      de: |-
        Es ernährt sich von Erde. Nachdem es einen Berg
        verspeist hat, schläft es ein, um zu wachsen.
      es: |-
        Se alimenta de tierra. Después de devorar el
        equivalente a una montaña, se duerme y empieza
        a crecer.
      it: |-
        Si nutre di terra. Dopo aver divorato una
        montagna intera, si addormenta per poter
        crescere.
