magikarp:
  base_happiness: 50
  capture_rate: 255
  color: red
  egg_groups:
    - water2
    - dragon
  evolution_chain: magikarp
  evolves_from: ~
  flavor_text:
    red:
      en: |-
        In the distant
        past, it was
        somewhat strongerthan the horribly
        weak descendants
        that exist today.
    blue:
      en: |-
        In the distant
        past, it was
        somewhat strongerthan the horribly
        weak descendants
        that exist today.
    yellow:
      en: |-
        Famous for being
        very unreliable.
        It can be foundswimming in seas,
        lakes, rivers and
        shallow puddles.
    gold:
      en: |-
        An underpowered,
        pathetic POKéMON.
        It may jump highon rare occasions,
        but never more
        than seven feet.
    silver:
      en: |-
        For no reason, it
        jumps and splashes
        about, making iteasy for predators
        like PIDGEOTTO to
        catch it mid-jump.
    crystal:
      en: |-
        This weak and
        pathetic POKéMON
        gets easily pushedalong rivers when
        there are strong
        currents.
    ruby:
      en: |-
        MAGIKARP is a pathetic excuse for a
        POKéMON that is only capable of
        flopping and splashing.This behavior prompted scientists to
        undertake research into it.
    sapphire:
      en: |-
        MAGIKARP is virtually useless in battle
        as it can only splash around.
        As a result, it is considered to be weak.However, it is actually a very hardy
        POKéMON that can survive in any body of
        water no matter how polluted it is.
    emerald:
      en: |-
        Its swimming muscles are weak, so it is
        easily washed away by currents. In places
        where water pools, you can see many
        MAGIKARP deposited there by the flow.
    firered:
      en: |-
        It is virtually worthless in terms of both
        power and speed. It is the most weak and
        pathetic POKéMON in the world.
    leafgreen:
      en: |-
        In the distant past, it was somewhat
        stronger than the horribly weak
        descendants that exist today.
    diamond:
      en: |-
        It is said to be the world’s
        weakest Pokémon. No one knows why
        it has managed to survive.
    pearl:
      en: |-
        It is unable to swim against even
        slow-moving currents. It always
        splashes about for some reason.
    platinum:
      en: |-
        A MAGIKARP living for many years
        can leap a mountain using Splash.
        The move remains useless, though.
    heartgold:
      en: |-
        An underpowered, pathetic Pokémon.
        It may jump high on rare occasions,
        but usually not more than seven feet.
    soulsilver:
      en: |-
        For no reason, it jumps and splashes
        about, making it easy for predators
        like PIDGEOTTO to catch it mid-jump.
    black:
      en: |-
        A Magikarp living for many years
        can leap a mountain using Splash.
        The move remains useless, though.
      fr: |-
        Un vénérable Magicarpe peut
        franchir une montagne en utilisant
        Trempette. Mais c’est tout...
    white:
      en: |-
        A Magikarp living for many years
        can leap a mountain using Splash.
        The move remains useless, though.
      fr: |-
        Un vénérable Magicarpe peut
        franchir une montagne en utilisant
        Trempette. Mais c’est tout...
    black-2:
      en: |-
        A Magikarp living for many years
        can leap a mountain using Splash.
        The move remains useless, though.
    white-2:
      en: |-
        A Magikarp living for many years
        can leap a mountain using Splash.
        The move remains useless, though.
    x:
      ja-Hrkt: |-
        ちからも　スピードも　ほとんどダメ。
        せかいで　いちばん　よわくて
        なさけない　ポケモンだ。
      ja: |-
        力も　スピードも　ほとんど　ダメ。
        世界で　一番　弱くて
        情けない　ポケモンだ。
      ko: |-
        힘도 스피드도 거의 없다.
        세상에서 가장 약하고
        한심한 포켓몬이다.
      en: |-
        It is virtually worthless in terms of both power and
        speed. It is the most weak and pathetic Pokémon
        in the world.
      fr: |-
        Magicarpe manque totalement de vitesse et de force.
        C’est le Pokémon le plus pathétique sur terre.
      de: |-
        Es ist nutzlos, was Kraft und Geschwindigkeit
        angeht. Dieses ist das schwächste
        und erbärmlichste Pokémon der Welt.
      es: |-
        No es precisamente rápido ni fuerte. Es el Pokémon
        más debilucho y simplón de todos los que hay.
      it: |-
        La sua forza e velocità sono praticamente nulle.
        Si può tranquillamente definire il più debole e patetico
        Pokémon del mondo.
    'y':
      ja-Hrkt: |-
        おおむかしは　まだ　もうすこし
        つよかったらしい。しかし　いまは
        かなしいくらいに　よわいのだ。
      ja: |-
        大昔は　まだ　もう少し
        強かったらしい。しかし　今は
        悲しいくらいに　弱いのだ。
      ko: |-
        아주 먼 옛날에는 좀 더
        강했던 것 같다. 그러나 지금은
        안쓰러울 정도로 약하다.
      en: |-
        In the distant past, it was somewhat stronger than
        the horribly weak descendants that exist today.
      fr: |-
        La puissance de cette créature a beaucoup régressé
        au fil des siècles.
      de: |-
        Die urzeitlichen Vorfahren dieses Pokémon waren
        sehr viel stärker als ihre heutigen Nachkommen.
      es: |-
        En un pasado lejano, era más fuerte de lo que hoy
        son sus débiles descendientes.
      it: |-
        Anticamente era molto più forte dell’odierno
        discendente, che è debolissimo.
    omega-ruby:
      ja-Hrkt: |-
        はねる　ことしか　しない　なさけない　ポケモン。
        なぜ　はねるのか　しらべた　けんきゅうしゃが
        いるほど　とにかく　はねて　はねて　はねまくる。
      ja: |-
        跳ねる　ことしか　しない　情けない　ポケモン。
        なぜ　跳ねるのか　調べた　研究者が
        いるほど　とにかく　跳ねて　跳ねて　跳ねまくる。
      ko: |-
        튀어 오르기만 하는 한심한 포켓몬이다.
        왜 튀어 오르는지 조사한 연구자가
        있을 정도로 무조건 튀고 튀고 튀어 오르기만 한다.
      en: |-
        Magikarp is a pathetic excuse for a Pokémon that is only
        capable of flopping and splashing. This behavior prompted
        scientists to undertake research into it.
      fr: |-
        Magicarpe est un Pokémon ridicule qui ne sait faire que
        des ronds dans l’eau ou se laisser porter par les courants.
        Son comportement a donné envie aux savants d’étudier
        son cas.
      de: |-
        Karpador ist ein armseliges Pokémon, das nur platschen kann.
        Sein merkwürdiges Verhalten hat so manchen Wissenschaftler
        zum Forschen angeregt.
      es: |-
        Magikarp es el triste ejemplo de un Pokémon capaz
        únicamente de saltar y salpicar. Esta conducta llevó a
        científicos a estudiarlo en profundidad.
      it: |-
        Magikarp è un patetico esempio di Pokémon capace soltanto
        di dimenarsi e sguazzare. La natura di questo comportamento
        inutile è oggetto di studi da parte del mondo scientifico.
    alpha-sapphire:
      ja-Hrkt: |-
        はねている　だけで　まんぞくに　たたかえないため
        よわいと　おもわれているが　どんなに　よごれた
        みずでも　くらせる　しぶとい　ポケモンなのだ。
      ja: |-
        跳ねている　だけで　満足に　戦えないため
        弱いと　思われているが　どんなに　汚れた
        水でも　暮らせる　しぶとい　ポケモンなのだ。
      ko: |-
        튀어오르기만으로는 만족스럽게 싸울 수 없어서
        약하다고 여겨지고 있지만 아무리 더러워진
        물에서라도 살 수 있는 끈질긴 포켓몬이다.
      en: |-
        Magikarp is virtually useless in battle as it can only splash
        around. As a result, it is considered to be weak. However,
        it is actually a very hardy Pokémon that can survive in any
        body of water no matter how polluted it is.
      fr: |-
        Magicarpe est virtuellement inutile en combat. Il se contente
        de faire des ronds dans l’eau. On le considère plutôt faible.
        Pourtant, ce Pokémon est très robuste et peut survivre
        dans n’importe quel environnement, même très pollué.
      de: |-
        Karpador ist im Kampf praktisch nutzlos, da es nur
        platschen kann. Daher wird es als schwach eingeschätzt.
        Es ist aber tatsächlich sehr robust und kann in jedem
        Gewässer überleben, egal, wie verseucht dieses ist.
      es: |-
        Magikarp es prácticamente inútil en combate; solo sirve para
        salpicar, y se le considera muy débil. Con todo, en realidad
        es un Pokémon muy resistente. Sobrevive en cualquier medio
        acuático, aunque esté contaminado.
      it: |-
        Nella lotta Magikarp è inutile, poiché può solo sguazzare.
        Infatti è considerato debole. In realtà si tratta di un Pokémon
        molto robusto che sopravvive in tutte le acque, anche le più
        inquinate.
    sun:
      ja-Hrkt: |-
        ちからは　よわく　たよりないのに
        はんしょくりょくだけ　ものすごい。
        あきるほど　みかけるぞ。
      ja: |-
        力は　弱く　頼りないのに
        繁殖力だけ　物凄い。
        飽きるほど　みかけるぞ。
      ko: |-
        힘은 약하고 믿음직스럽지 못하지만
        번식력만은 엄청나다.
        질릴 정도로 눈에 띈다.
      zh-Hant: |-
        力量很弱，派不上用場，
        只有繁殖力異常驚人。
        多得簡直要看膩了。
      zh-Hans: |-
        力量很弱，派不上用场，
        但就只有繁殖力惊人。
        多得简直要看腻了。
      en: |-
        Although weak and helpless, this Pokémon is
        incredibly fertile. They exist in such multitudes,
        you’ll soon grow tired of seeing them.
      fr: |-
        Ce Pokémon est faible et ne sait pas faire
        grand-chose à part se multiplier à toute allure.
        On en trouve à ne plus savoir qu’en faire.
      de: |-
        Es ist schwach und unzuverlässig, aber es
        vermehrt sich unglaublich schnell. Deshalb
        trifft man es auch öfter an, als einem lieb ist.
      es: |-
        Es muy débil y de poca utilidad, aunque su
        capacidad reproductora resulta abrumadora.
        Lo normal es encontrar Magikarp por doquier.
      it: |-
        È debole e indifeso, ma è particolarmente
        prolifico. Se ne vedono talmente tanti in giro
        che vengono a noia.
    moon:
      ja-Hrkt: |-
        むやみに　はねて　すぐ　おそわれるが
        コイキングの　おかげで　おおくの
        ポケモンが　いきのびられると　いう。
      ja: |-
        無闇に　跳ねて　すぐ　襲われるが
        コイキングの　おかげで　多くの
        ポケモンが　生き延びられると　いう。
      ko: |-
        무턱대고 튀어 올라서 바로 공격당하지만
        잉어킹 덕분에 많은 포켓몬이
        살아남을 수 있다고 한다.
      zh-Hant: |-
        因為胡亂躍起，總是馬上就被襲擊。
        但據說多虧了鯉魚王，
        大多數寶可夢都能活得更久。
      zh-Hans: |-
        因为胡乱跃起，马上就被袭击了，
        但据说多亏了鲤鱼王，
        大多数宝可梦都能活得更久。
      en: |-
        Its reckless leaps make it easy pickings for
        predators. On the bright side, many Pokémon
        enjoy longer life spans, thanks to Magikarp.
      fr: |-
        Il bondit hors de l’eau sans faire attention et se
        fait attraper par toutes sortes de Pokémon.
        Beaucoup d’espèces dépendent de cette manne.
      de: |-
        Da es immer nur leichtsinnig herumplatscht,
        ist es leichte Beute für hungrige Pokémon.
        Für viele ist es daher ein Lebensretter.
      es: |-
        Como lo único que hace es chapotear en el
        agua, resulta una presa fácil. Gracias a esto,
        muchos otros Pokémon pueden sobrevivir.
      it: |-
        Non fa che sguazzare senza cautela. Questa
        abitudine lo rende una facile preda e garantisce
        la sopravvivenza di molti altri Pokémon.
    ultra-sun:
      ja-Hrkt: |-
        はるか　おおむかしは　それなりに
        つよかったが　ときが　たつに　つれて
        どんどんどんどん　よわくなっていった。
      ja: |-
        遥か　大昔は　それなりに　
        強かったが　時が　経つに　つれて
        どんどんどんどん　弱くなっていった。
      ko: |-
        먼 옛날에는 그럭저럭
        강한 편이었으나
        시간이 흐르면서 점점 약해졌다.
      zh-Hant: |-
        在遙遠的過去實力還算強大，
        但隨著時光的流轉，
        牠變得越來越弱了。
      zh-Hans: |-
        在非常遥远的过去，它还是十分
        强大的，但随着时间的推移，
        它变得越来越弱，越来越弱了。
      en: |-
        In the distant past, they were fairly strong, but
        they have become gradually weaker over time.
      fr: |-
        Il y a fort, fort longtemps, il était relativement
        puissant. Il est toutefois devenu de plus en plus
        nul au fil du temps.
      de: |-
        Vor langer, langer Zeit war es anscheinend
        ziemlich stark, doch es wurde zusehends
        schwächer und schwächer.
      es: |-
        Al parecer, en la antigüedad había gozado de
        gran fuerza, pero con el paso del tiempo se ha
        ido debilitando hasta su estado actual.
      it: |-
        Anticamente Magikarp era piuttosto forte, ma
        col tempo è diventato sempre più debole.
    ultra-moon:
      ja-Hrkt: |-
        せいめいりょくが　つよく　きたない
        みずでも　へっちゃら。　せかいじゅうの
        みずべに　せいそく　しているぞ。
      ja: |-
        生命力が　強く　汚い
        水でも　へっちゃら。　世界中の
        水辺に　生息　しているぞ。
      ko: |-
        생명력이 강해서 더러운
        물이라도 문제없다. 전 세계의
        물가에 서식하고 있다.
      zh-Hant: |-
        生命力頑強，
        即使待在污水中也不怕。
        棲息在世界各地的水邊。
      zh-Hans: |-
        生命力顽强，
        即便在污水中也毫不在意。
        生活在世界各地的水边。
      en: |-
        Thanks to their strong hold on life, dirty water
        doesn’t bother them at all. They live in waters
        all over the world!
      fr: |-
        Sa survie ne dépendant pas de la salubrité
        des eaux dans lesquelles il nage, on rencontre
        ce Pokémon aux quatre coins du monde.
      de: |-
        Unbekümmert strotzt es selbst in verseuchten
        Gewässern nur so vor Lebenskraft. Man findet
        es in allen Teilen der Welt in Ufernähe.
      es: |-
        Su resistencia le permite vivir en las aguas más
        turbias. Por eso se los puede ver nadando en
        cualquier lugar del mundo.
      it: |-
        È molto resistente e può sopravvivere anche
        nelle acque più sporche. Se ne trovano nelle
        acque di tutto il mondo.
    lets-go-pikachu:
      ja-Hrkt: |-
        たよりないので　ゆうめいなポケモン。
        うみ　かわ　いけ　みずたまり
        いたるところを　およいでいる。
      ja: |-
        頼りないので　有名なポケモン。
        海　川　池　水たまり
        至るところを　泳いでいる。
      ko: |-
        못 미덥기로 유명한 포켓몬.
        바다, 강, 연못, 물웅덩이 등
        다양한 곳에서 헤엄치고 있다.
      zh-Hant: |-
        以靠不住而聞名的寶可夢。
        不管是海、河、池塘或水窪，
        都能看見牠們在裡頭游來游去。
      zh-Hans: |-
        因靠不住而出名的宝可梦。海里、
        河里、池子里、还有水洼里……
        它们会在各种地方游来游去。
      en: |-
        Famous for being very unreliable. It can be
        found swimming in seas, lakes, rivers,
        and shallow puddles.
      fr: |-
        Célèbre pour son inutilité, on en trouve
        beaucoup dans les océans, les étangs,
        les rivières et même les flaques d’eau.
      de: |-
        Karpador ist für seine Nutzlosigkeit bekannt.
        Ob Meer, Fluss, See oder Pfütze, es schwimmt
        durch die verschiedensten Gewässer.
      es: |-
        Famoso por su ineptitud. Nada en todo tipo de
        aguas, ya sean mares, lagos, ríos o charcas.
      it: |-
        È famoso per la sua debolezza. Lo si vede
        comunemente nuotare nel mare, nei fiumi,
        nei laghi e in qualsiasi altra pozza d’acqua.
    lets-go-eevee:
      ja-Hrkt: |-
        たよりないので　ゆうめいなポケモン。
        うみ　かわ　いけ　みずたまり
        いたるところを　およいでいる。
      ja: |-
        頼りないので　有名なポケモン。
        海　川　池　水たまり
        至るところを　泳いでいる。
      ko: |-
        못 미덥기로 유명한 포켓몬.
        바다, 강, 연못, 물웅덩이 등
        다양한 곳에서 헤엄치고 있다.
      zh-Hant: |-
        以靠不住而聞名的寶可夢。
        不管是海、河、池塘或水窪，
        都能看見牠們在裡頭游來游去。
      zh-Hans: |-
        因靠不住而出名的宝可梦。海里、
        河里、池子里、还有水洼里……
        它们会在各种地方游来游去。
      en: |-
        Famous for being very unreliable. It can be
        found swimming in seas, lakes, rivers,
        and shallow puddles.
      fr: |-
        Célèbre pour son inutilité, on en trouve
        beaucoup dans les océans, les étangs,
        les rivières et même les flaques d’eau.
      de: |-
        Karpador ist für seine Nutzlosigkeit bekannt.
        Ob Meer, Fluss, See oder Pfütze, es schwimmt
        durch die verschiedensten Gewässer.
      es: |-
        Famoso por su ineptitud. Nada en todo tipo de
        aguas, ya sean mares, lagos, ríos o charcas.
      it: |-
        È famoso per la sua debolezza. Lo si vede
        comunemente nuotare nel mare, nei fiumi,
        nei laghi e in qualsiasi altra pozza d’acqua.
    sword:
      ja-Hrkt: |-
        ちからも　スピードも　ほとんどダメ。
        せかいで　いちばん　よわくて
        なさけない　ポケモンだ。
      ja: |-
        力も　スピードも　ほとんどダメ。
        世界で　一番　弱くて
        情けない　ポケモンだ。
      ko: |-
        힘도 스피드도 거의 없다.
        세상에서 가장 약하고
        한심한 포켓몬이다.
      zh-Hant: |-
        力量和速度都不太行。
        是世界上最弱
        最可憐的寶可夢。
      zh-Hans: |-
        力量和速度几乎都不行。
        是世界上最弱最可怜的宝可梦。
      en: |-
        It is virtually worthless in terms of both power
        and speed. It is the most weak and pathetic
        Pokémon in the world.
      fr: |-
        Il manque totalement de vitesse et de force.
        C’est le Pokémon le plus pathétique au monde.
      de: |-
        Es ist nutzlos, was Kraft und Geschwindigkeit
        angeht. Dieses Pokémon ist das schwächste und
        erbärmlichste der Welt.
      es: |-
        Es el Pokémon más débil y patético que existe,
        con una fuerza y velocidad prácticamente nulas.
      it: |-
        La sua forza e velocità sono praticamente nulle.
        Si può tranquillamente definire il più debole e
        patetico Pokémon del mondo.
    shield:
      ja-Hrkt: |-
        ながれの　はやい　ところでは
        ただ　ながされて　いくだけの
        ひよわで　なさけない　ポケモン。
      ja: |-
        流れの　速い　ところでは
        ただ　流されて　いくだけの
        ひ弱で　情けない　ポケモン。
      ko: |-
        유속이 빠른 곳에서는
        그저 떠내려갈 뿐인
        약하고 한심한 포켓몬이다.
      zh-Hant: |-
        又弱又可憐的寶可夢。
        在水流比較快的地方，
        只能任憑自己被水沖走。
      zh-Hans: |-
        又弱又可怜的宝可梦。
        在水流比较快的地方
        只能任凭自己被水冲走。
      en: |-
        This weak and pathetic Pokémon gets easily
        pushed along rivers when there are strong currents.
      fr: |-
        Ce Pokémon est si faible que, dans les eaux
        à forts courants, il se contente de se laisser
        porter lamentablement.
      de: |-
        Dieses Pokémon ist so schwach und erbärmlich,
        dass es sich in Gewässern mit starker Strömung
        einfach vom Wasser treiben lässt.
      es: |-
        Este Pokémon débil y patético se limita a dejarse
        llevar por la corriente cuando esta tiene fuerza.
      it: |-
        Un Pokémon debole e patetico: non fa che
        lasciarsi trascinare dove lo porta la corrente.
    legends-arceus:
      en: |-
        A feeble, pitiful imbecile of a Pokémon that is nonetheless very
