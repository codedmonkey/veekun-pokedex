scolipede:
  base_happiness: 50
  capture_rate: 45
  color: red
  egg_groups:
    - bug
  evolution_chain: venipede
  evolves_from: whirlipede
  flavor_text:
    black:
      en: |-
        With quick movements, it chases down
        its foes, attacking relentlessly with
        its horns until it prevails.
      fr: |-
        Il accule l’ennemi par ses mouvements
        rapides et l’attaque avec ses cornes.
        Il ne s’arrête qu’au coup de grâce.
    white:
      en: |-
        Highly aggressive, it uses the claws
        near its neck to dig into its opponents
        and poison them.
      fr: |-
        Il inocule du poison à ses ennemis
        par les griffes de son cou.
        Il est extrêmement agressif.
    black-2:
      en: |-
        It clasps its prey with the claws
        on its neck until it stops moving.
        Then it finishes it off with deadly poison.
    white-2:
      en: |-
        It clasps its prey with the claws
        on its neck until it stops moving.
        Then it finishes it off with deadly poison.
    x:
      ja-Hrkt: |-
        えものを　くびのツメで　はさみこみ
        みうごきを　とれなくしてから
        もうどくを　あたえ　とどめを　さす。
      ja: |-
        獲物を　首のツメで　挟みこみ
        身動きを　とれなくしてから
        猛毒を　与え　とどめを　刺す。
      ko: |-
        먹이를 목의 가시에 끼워 넣어
        움직이지 못하게 한 후
        맹독을 퍼뜨려 마무리한다.
      en: |-
        It clasps its prey with the claws on its neck until it
        stops moving. Then it finishes it off with
        deadly poison.
      fr: |-
        Il paralyse l’ennemi avec les griffes de son cou avant
        de mettre fin au combat grâce à son poison virulent.
      de: |-
        Lähmt seine Beute, indem es sie mit den Zacken an
        seinem Hals aufspießt. Mit einer Ladung Gift gibt es
        ihr den Rest.
      es: |-
        Atenaza a sus presas con las garras que sobresalen de
        su cuello hasta que no se pueden mover y las remata
        con veneno.
      it: |-
        Trafigge la preda con gli aculei del collo e dopo
        averla immobilizzata la finisce con le sue tossine.
    'y':
      ja-Hrkt: |-
        すばやい　うごきで　てきを　おいつめ
        あたまの　ツノで　こうげきする。
        とどめを　さすまで　ようしゃしない。
      ja: |-
        素早い　動きで　敵を　追いつめ
        頭の　ツノで　攻撃する。
        とどめを　刺すまで　容赦しない。
      ko: |-
        빠른 움직임으로 적을 바싹 몰아넣어
        머리의 뿔로 공격한다.
        마무리 지을 때까지 봐주지 않는다.
      en: |-
        With quick movements, it chases down its foes,
        attacking relentlessly with its horns until it prevails.
      fr: |-
        Il accule l’ennemi par ses mouvements rapides et
        l’attaque avec ses cornes. Il ne s’arrête qu’au coup
        de grâce.
      de: |-
        Holt Gegner flinken Fußes ein und greift sie mit
        den Hörnern an seinem Kopf an. Gnade ist ihm
        ein Fremdwort.
      es: |-
        Arrincona a sus rivales con rápidos movimientos y los
        ensarta con sus cuernos. No se detiene hasta vencer.
      it: |-
        Incalza la preda con movimenti rapidi e la attacca
        ripetutamente con le corna. Non si ferma fino al
        colpo di grazia.
    omega-ruby:
      ja-Hrkt: |-
        えものを　くびのツメで　はさみこみ
        みうごきを　とれなくしてから
        もうどくを　あたえ　とどめを　さす。
      ja: |-
        獲物を　首のツメで　挟みこみ
        身動きを　とれなくしてから
        猛毒を　与え　とどめを　刺す。
      ko: |-
        먹이를 목의 가시에 끼워 넣어
        움직이지 못하게 한 후
        맹독을 퍼뜨려 마무리한다.
      en: |-
        It clasps its prey with the claws on its neck until it
        stops moving. Then it finishes it off with
        deadly poison.
      fr: |-
        Il paralyse l’ennemi avec les griffes de son cou avant
        de mettre fin au combat grâce à son poison virulent.
      de: |-
        Lähmt seine Beute, indem es sie mit den Zacken an seinem
        Hals aufspießt. Mit einer Ladung Gift gibt es ihr den Rest.
      es: |-
        Atenaza a sus presas con las garras que sobresalen de su
        cuello hasta que no se pueden mover y las remata con
        veneno.
      it: |-
        Trafigge la preda con gli aculei del collo e dopo averla
        immobilizzata la finisce con le sue tossine.
    alpha-sapphire:
      ja-Hrkt: |-
        すばやい　うごきで　てきを　おいつめ
        あたまの　ツノで　こうげきする。
        とどめを　さすまで　ようしゃしない。
      ja: |-
        素早い　動きで　敵を　追いつめ
        頭の　ツノで　攻撃する。
        とどめを　刺すまで　容赦しない。
      ko: |-
        빠른 움직임으로 적을 바싹 몰아넣어
        머리의 뿔로 공격한다.
        마무리 지을 때까지 봐주지 않는다.
      en: |-
        With quick movements, it chases down its foes,
        attacking relentlessly with its horns until it prevails.
      fr: |-
        Il accule l’ennemi par ses mouvements rapides et l’attaque
        avec ses cornes. Il ne s’arrête qu’au coup de grâce.
      de: |-
        Holt Gegner flinken Fußes ein und greift sie mit den Hörnern
        an seinem Kopf an. Gnade ist ihm ein Fremdwort.
      es: |-
        Arrincona a sus rivales con rápidos movimientos y los ensarta
        con sus cuernos. No se detiene hasta vencer.
      it: |-
        Incalza la preda con movimenti rapidi e la attacca
        ripetutamente con le corna. Non si ferma fino al colpo
        di grazia.
    sword:
      ja-Hrkt: |-
        くびのツメで　えものを　つかむと
        そのまま　じめんに　たたきつけ
        どくのトゲを　つきたてるぞ。
      ja: |-
        首のツメで　獲物を　つかむと
        そのまま　地面に　叩きつけ
        毒のトゲを　突きたてるぞ。
      ko: |-
        목의 가시로 먹이를 잡은 채
        그대로 땅으로 내동댕이쳐서
        독가시를 꽂는다.
      zh-Hant: |-
        用頸部的爪子夾住獵物後，
        會直接將對方摔到地上，
        然後用毒刺戳下去。
      zh-Hans: |-
        用颈部的爪子抓住猎物后，
        会直接将对方摔向地面，
        然后将带毒的尖刺猛戳进去。
      en: |-
        Scolipede latches on to its prey with the claws on
        its neck before slamming them into the ground
        and jabbing them with its claws’ toxic spikes.
      fr: |-
        Après avoir saisi sa proie à l’aide des griffes
        de son cou, il la plaque au sol puis la transperce
        avec ses épines empoisonnées.
      de: |-
        Kriegt es seine Beute mit den Krallen an seinem
        Hals zu fassen, wirft es sie zu Boden und rammt
        die giftigen Spitzen der Krallen in sie hinein.
      es: |-
        Usa las garras que le sobresalen del cuello para
        atrapar a su presa, golpearla contra el suelo y
        rematarla inoculando un potente veneno.
      it: |-
        Sbatte a terra la preda afferrandola con gli artigli
        del collo per poi infilzarla con le punte velenose.
    shield:
      ja-Hrkt: |-
        なわばりを　めぐり　マルヤクデと
        はげしく　あらそう。　まけたほうは
        そのまま　えものに　なるのだ。
      ja: |-
        縄張りを　めぐり　マルヤクデと
        激しく　争う。　負けたほうは
        そのまま　獲物に　なるのだ。
      ko: |-
        영역을 두고 다태우지네와
        격렬하게 다툰다. 패배한 쪽이
        그대로 먹이가 된다.
      zh-Hant: |-
        為了搶地盤，會和焚焰蚣
        激烈地爭鬥。輸掉的那一方
        會直接變成對手的獵物。
      zh-Hans: |-
        会和焚焰蚣激烈地争夺
        领地。输掉的那一方
        会成为另一方的猎物。
      en: |-
        Scolipede engage in fierce territorial battles with
        Centiskorch. At the end of one of these battles,
        the victor makes a meal of the loser.
      fr: |-
        Il défend son territoire avec acharnement contre
        son ennemi Scolocendre. Le perdant sert de dîner
        au vainqueur.
      de: |-
        Es liefert sich erbitterte Revierkämpfe mit
        Infernopod. Wer den Kampf verliert, wird zur
        Beute des Siegers.
      es: |-
        Las disputas territoriales con Centiskorch son
        extremadamente violentas. El perdedor se
        convierte en la presa del ganador.
      it: |-
        Lotta ferocemente con Centiskorch per il
        controllo sul territorio. Il perdente diventa
        preda del vincitore.
