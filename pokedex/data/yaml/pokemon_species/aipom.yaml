    black-2:
      en: |-
        It lives high among the treetops.
        It can use its tail as freely and
        cleverly as its hands.
    white-2:
      en: |-
        It lives high among the treetops.
        It can use its tail as freely and
        cleverly as its hands.
    x:
      ja-Hrkt: |-
        たかい　きの　うえで　くらしている。
        えだから　えだへ　とびうつるとき
        しっぽで　たくみに　バランスをとる。
      ja: |-
        高い　木の上で　暮らしている。
        枝から　枝へ　飛び移るとき
        尻尾で　巧みに　バランスをとる。
      ko: |-
        높은 나무 위에서 살고 있다.
        나뭇가지에서 가지로 건너뛸 때
        꼬리로 능숙하게 밸런스를 잡는다.
      en: |-
        It lives atop tall trees. When leaping from branch to
        branch, it deftly uses its tail for balance.
      fr: |-
        Il vit sur les plus hautes cimes. Sautant de branche
        en branche, sa queue lui assure un bon équilibre.
      de: |-
        Es lebt in den Kronen großer Bäume. Es hüpft von
        Ast zu Ast und balanciert mit seinem Schweif.
      es: |-
        Vive en lo alto de los árboles. Cuando salta de rama
        en rama, usa su cola para equilibrarse.
      it: |-
        Vive in cima agli alberi più alti. Usando abilmente
        la coda, mantiene l’equilibrio quando salta di ramo
        in ramo.
    'y':
      ja-Hrkt: |-
        ちからづよい　しっぽだけで
        きの　えだに　ぶらさがって
        からだを　ささえることが　できる。
      ja: |-
        力強い　尻尾だけで
        木の枝に　ぶら下がって
        体を　支えることが　できる。
      ko: |-
        힘이 센 꼬리만으로
        나뭇가지에 매달려서
        몸을 지탱할 수 있다.
      en: |-
        Its tail is so powerful that it can use it to grab a
        tree branch and hold itself up in the air.
      fr: |-
        Sa queue est si forte qu’il peut l’utiliser pour se
        suspendre aux branches des arbres.
      de: |-
        Sein Schweif ist so kräftig, dass es sich stundenlang
        damit an einem Ast in der Luft halten kann.
      es: |-
        Su cola es tan potente que puede usarla para
        agarrarse a la rama de un árbol y no caer.
      it: |-
        La sua coda è così forte che può appendersi a un
        albero e rimanere sospeso.
    omega-ruby:
      ja-Hrkt: |-
        きように　うごく　しっぽの　さきを　てのひらの
        かわりに　つかっていたら　はんたいに　りょうてが
        ぶきように　なってしまった　ポケモンだ。
      ja: |-
        器用に　動く　尻尾の　先を　手のひらの
        代りに　使っていたら　反対に　両手が
        不器用に　なってしまった　ポケモンだ。
      ko: |-
        능숙하게 움직이는 꼬리 끝을 손바닥
        대신 사용하다 보니 반대로 양손이
        둔해져 버린 포켓몬이다.
      en: |-
        Aipom’s tail ends in a hand-like appendage that can be cleverly
        manipulated. However, because the Pokémon uses its tail so
        much, its real hands have become rather clumsy.
      fr: |-
        L’extrémité de la queue de Capumain ressemble à une main
        et peut être utilisée de façon ingénieuse. Malheureusement,
        ce Pokémon utilise tellement sa queue que ses véritables
        mains sont devenues très maladroites.
      de: |-
        An Griffels Schweif befindet sich ein handähnliches Anhängsel,
        mit dem es geschickt zu Werke gehen kann. Da dieses
        Pokémon sehr häufig seinen Schweif einsetzt, wirken seine
        Hände eher plump.
      es: |-
        La cola de Aipom termina en una especie de mano a la que,
        con un poco de cabeza, se le puede dar muy buen uso. Pero
        hay un problema: como se ha acostumbrado a usarla mucho,
        las de verdad se le han vuelto algo torponas.
      it: |-
        La coda di Aipom termina in un’appendice a forma di mano
        dotata di grande abilità. Tuttavia, poiché il Pokémon usa
        così tanto la coda, le sue vere mani sono diventate molto
        maldestre.
    alpha-sapphire:
      ja-Hrkt: |-
        きように　うごく　しっぽの　さきを　てのひらの
        かわりに　つかっていたら　はんたいに　りょうてが
        ぶきように　なってしまった　ポケモンだ。
      ja: |-
        器用に　動く　尻尾の　先を　手のひらの
        代りに　使っていたら　反対に　両手が
        不器用に　なってしまった　ポケモンだ。
      ko: |-
        능숙하게 움직이는 꼬리 끝을 손바닥
        대신 사용하다 보니 반대로 양손이
        둔해져 버린 포켓몬이다.
      en: |-
        Aipom’s tail ends in a hand-like appendage that can be cleverly
        manipulated. However, because the Pokémon uses its tail so
        much, its real hands have become rather clumsy.
      fr: |-
        L’extrémité de la queue de Capumain ressemble à une main
        et peut être utilisée de façon ingénieuse. Malheureusement,
        ce Pokémon utilise tellement sa queue que ses véritables
        mains sont devenues très maladroites.
      de: |-
        An Griffels Schweif befindet sich ein handähnliches Anhängsel,
        mit dem es geschickt zu Werke gehen kann. Da dieses
        Pokémon sehr häufig seinen Schweif einsetzt, wirken seine
        Hände eher plump.
      es: |-
        La cola de Aipom termina en una especie de mano a la que,
        con un poco de cabeza, se le puede dar muy buen uso. Pero
        hay un problema: como se ha acostumbrado a usarla mucho,
        las de verdad se le han vuelto algo torponas.
      it: |-
        La coda di Aipom termina in un’appendice a forma di mano
        dotata di grande abilità. Tuttavia, poiché il Pokémon usa
        così tanto la coda, le sue vere mani sono diventate molto
        maldestre.
    ultra-sun:
      ja-Hrkt: |-
        シッポで　いろんなことを　していたら
        てさきは　ぶきように　なってしまった。
        たかい　きのうえに　すを　つくる。
      ja: |-
        シッポで　いろんなことを　していたら
        手先は　不器用に　なってしまった。
        高い　木の上に　巣を　作る。
      ko: |-
        꼬리로 이것저것 하는 사이에
        손이 둔해지고 말았다.
        높은 나무 위에 둥지를 만든다.
      zh-Hant: |-
        習慣了用尾巴做各種事之後，
        雙手就變得不怎麼靈活了。
        會在很高的樹上築巢。
      zh-Hans: |-
        习惯用尾巴做各种事情后，
        手就变得不怎么灵活了。
        会在很高的树上筑巢。
      en: |-
        As it did more and more with its tail, its hands
        became clumsy. It makes its nest high in
        the treetops.
      fr: |-
        À force d’utiliser sa queue à tort et à travers,
        elle est devenue plus habile que ses mains.
        Il l’utilise pour faire son nid en haut des arbres.
      de: |-
        Der übermäßige Einsatz seines Schweifes hatte
        die Zurückbildung seiner Hände zur Folge.
        Es lebt in den Kronen hoher Bäume.
      es: |-
        De tanto utilizar la cola, esta se ha vuelto más
        hábil que sus dedos. Construye sus nidos en
        las copas de los árboles.
      it: |-
        Poiché utilizza la coda per fare qualsiasi cosa,
        le sue vere mani sono diventate molto maldestre.
        Fa il nido sugli alberi più alti.
    ultra-moon:
      ja-Hrkt: |-
        きの　うえから　えものが　いないか
        さがす。　こうぶつの　アマカジを
        みると　こうふんして　とびかかるぞ。
      ja: |-
        木の　上から　獲物が　いないか
        探す。　好物の　アマカジを
        見ると　興奮して　飛びかかるぞ。
      ko: |-
        나무 위에서 먹이를 찾는다.
        좋아하는 달콤아를 발견하면
        흥분해서 덤벼든다.
      zh-Hant: |-
        會從樹上尋找獵物。
        只要發現自己愛吃的甜竹竹，
        就會興奮地飛撲過去。
      zh-Hans: |-
        会从树上寻找猎物。
        发现喜食的甜竹竹后，
        就会兴奋地飞扑过去。
      en: |-
        It searches for prey from the tops of trees.
        When it spots its favorite food, Bounsweet,
        Aipom gets excited and pounces.
      fr: |-
        Il guette ses proies depuis la cime des arbres.
        Quand il aperçoit un Croquine, son mets préféré,
        il se jette dessus.
      de: |-
        Es sitzt in Baumwipfeln und hält Ausschau nach
        Beute. Sieht es ein Frubberl, sein Leibgericht,
        stürzt es begeistert auf es herab.
      es: |-
        Sube a las copas de los árboles para buscar
        presas. Si encuentra un Bounsweet, su manjar
        predilecto, se alboroza y se abalanza sobre él.
      it: |-
        Individua le prede dalla cima degli alberi.
        Appena avvista un Bounsweet, di cui è ghiotto,
        gli balza addosso preso dall’entusiasmo.
    legends-arceus:
      en: |-
        This treetop dweller possesses a tail as dexterous as a hand.
        Ancient writings describe this Pokémon as a one-armed oddity.
