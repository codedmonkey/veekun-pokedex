  flavor_text:
    red:
      en: |-
        With its huge and
        magnificent wings,
        it can keep aloftwithout ever
        having to land
        for rest.
    blue:
      en: |-
        With its huge and
        magnificent wings,
        it can keep aloftwithout ever
        having to land
        for rest.
    yellow:
      en: |-
        A POKéMON that
        dates back many
        years. If itsenses danger, it
        flies high and
        away, instantly.
    gold:
      en: |-
        It shoots itself
        suddenly high into
        the sky, thenplummets down in
        one fell swoop to
        strike its prey.
    silver:
      en: |-
        It cleverly uses
        its thin, long
        beak to pluck andeat small insects
        that hide under
        the ground.
    crystal:
      en: |-
        It uses its long
        beak to attack. It
        has a surprisinglylong reach, so it
        must be treated
        with caution.
