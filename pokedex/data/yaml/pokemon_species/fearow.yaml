        allongé. Ces attributs lui permettent d’attraper facilement
        ses proies dans la terre ou dans l’eau. Il bouge son bec
        long et fin avec une grande agilité.
      de: |-
        Ibitak erkennt man an seinem langen Schnabel. Er ist
        hervorragend dafür geeignet, im Erdreich oder im Wasser
        Beute zu jagen. Es setzt seinen langen, dünnen Schnabel
        dabei sehr geschickt ein.
      es: |-
        A Fearow se le reconoce por tener un pescuezo y un pico
        largos que le permiten cazar en tierra y agua. Tiene una
        gran habilidad moviendo el fino pico para atrapar a sus presas.
      it: |-
        Fearow è caratterizzato da un collo e un becco molto lunghi,
        dalla forma ottimale per la cattura della preda a terra o
        in acqua. Muove agilmente il becco lungo e affusolato
        per stanare la preda.
    sun:
      ja-Hrkt: |-
        タフで　じきゅうりょくに　すぐれる。
        おもたい　にもつを　のせたまま
        まる１にち　とびつづけても　へいき。
      ja: |-
        タフで　持久力に　優れる。
        重たい　荷物を　乗せたまま
        丸１日　飛び続けても　平気。
      ko: |-
        터프하고 지구력도 우수하다.
        무거운 짐을 진 채
        온종일 날아도 끄떡없다.
      zh-Hant: |-
        強壯且擁有優秀的持久力。
        即使載著很重的貨物
        持續飛行一整天也沒問題。
      zh-Hans: |-
        因为很强壮而持久力优秀。
        即使载着很重的货物持续
        飞行一整天也平心静气。
      en: |-
        It’s tough and has excellent stamina.
        It has no problem flying continuously
        for a whole day carrying a heavy load.
      fr: |-
        Un Pokémon robuste et extrêmement endurant.
        Il est capable de voler du matin au soir tout
        en transportant de lourdes charges.
      de: |-
        Es ist belastbar und hat genügend Ausdauer,
        um selbst mit schwerer Fracht beladen einen
        ganzen Tag lang in der Luft zu bleiben.
      es: |-
        Son de destacar su dureza y resistencia.
        Puede volar sin parar durante un día entero
        aunque lleve una pesada carga.
      it: |-
        Ha una notevole resistenza fisica e può volare
        per un giorno intero trasportando oggetti
        pesanti.
    moon:
      ja-Hrkt: |-
        はるか　たいこの　へきがのなかに
        オニドリルらしき　ポケモンが
        えがかれていることが　わかった。
      ja: |-
        遥か　太古の　壁画の中に
        オニドリルらしき　ポケモンが
        描かれていることが　判った。
      ko: |-
        먼 태곳적 벽화 속에
        깨비드릴조처럼 보이는 포켓몬이
        그려져 있는 것이 발견되었다.
      zh-Hant: |-
        經調查發現，在遙遠
        太古時代的壁畫描繪著
        形似大嘴雀的寶可夢。
      zh-Hans: |-
        经查证，在遥远的
        太古时代壁画中描绘有
        形似大嘴雀的宝可梦。
      en: |-
        Drawings of a Pokémon resembling Fearow can
        be seen in murals from deep in ancient history.
      fr: |-
        Un Pokémon fort ancien, qui a même été identifié
        sur des fresques antiques.
      de: |-
        Wie kürzlich bekannt wurde, existieren uralte
        Wandmalereien, auf denen Pokémon abgebildet
        sind, die Ähnlichkeiten mit Ibitak aufweisen.
      es: |-
        En algunos murales de épocas arcaicas se han
        hallado pinturas de un Pokémon que guarda un
        gran parecido con Fearow.
      it: |-
        Sembra che questo Pokémon sia raffigurato
        in pitture rupestri antichissime.
    ultra-sun:
      ja-Hrkt: |-
        オニドリルの　なわばりで　たべものを
        もって　あるくのは　キケンだ。
        あっという　まに　かっさらわれるぞ。
      ja: |-
        オニドリルの　縄張りで　食べ物を
        持って　歩くのは　危険だ。
        あっという　間に　かっさらわれるぞ。
      ko: |-
        깨비드릴조 영역에서 음식을
        갖고 다니는 것은 위험하다.
        순식간에 빼앗긴다.
      zh-Hant: |-
        在大嘴雀的地盤上
        帶著食物走動是件危險的事，
        食物轉眼間就會被奪走。
      zh-Hans: |-
        在大嘴雀的领地上拿着食物
        走动可是相当危险的。
        食物转眼间就会被抢走。
      en: |-
        Carrying food through Fearow’s territory is
        dangerous. It will snatch the food away from
        you in a flash!
      fr: |-
        Si vous vous promenez sur le territoire d’un
        Rapasdepic en transportant de la nourriture,
        vous risquez de vite la voir s’envoler !
      de: |-
        Wer Essbares dabeihat, sollte sich nicht in
        Ibitaks Revier begeben, da sonst ein Überfall
        aus heiterem Himmel droht.
      es: |-
        Es peligroso pasear con comida por su territorio,
        ya que supone exponerse a que en cualquier
        momento se abalance para robarla.
      it: |-
        Chi attraversa il suo territorio portando con sé
        del cibo corre il rischio di vederselo strappare
        via in men che non si dica.
    ultra-moon:
      ja-Hrkt: |-
        アローラでは　さかなポケモンが
        えもの。　うみの　うえを　せんかいし
        エサをさがす　こうけいが　みられる。
      ja: |-
        アローラでは　さかなポケモンが
        獲物。　海の　上を　旋回し
        エサを探す　光景が　見られる。
      ko: |-
        알로라에서는 물고기포켓몬이
        먹이다. 바다 위를 선회하며
        먹이를 찾는 광경을 볼 수 있다.
      zh-Hant: |-
        在阿羅拉，牠的獵物是魚寶可夢，
        所以能看見牠盤旋在海上
        尋找食物的景象。
      zh-Hans: |-
        在阿罗拉，它的猎物是鱼宝可梦。
        能看到它盘旋在海上觅食的景象。
      en: |-
        In Alola, fish Pokémon are its prey. It can be
        seen circling above the ocean searching
        for food.
      fr: |-
        À Alola, il se repaît de Pokémon poissons.
        On le voit souvent voler en cercle au-dessus
        des flots en quête de nourriture.
      de: |-
        In Alola findet es seine Beute im Meer. Ibitak, die
        suchend ihre Kreise über dem Wasser ziehen,
        sind ein typischer Anblick in der Region.
      es: |-
        En Alola, se alimenta de Pokémon pez. A menudo
        se lo puede ver sobrevolando el mar en círculos
        en busca de presas.
      it: |-
        Ad Alola si ciba di Pokémon acquatici.
        Spesso lo si vede volteggiare sul mare in
        cerca di prede.
    lets-go-pikachu:
      ja-Hrkt: |-
        むかしから　すんでいる　ポケモン。
        すこしでも　きけんを　かんじると
        そらたかく　とんで　いってしまう。
      ja: |-
        昔から　住んでいる　ポケモン。
        少しでも　危険を　感じると
        空高く　飛んで　いってしまう。
      ko: |-
        옛날부터 살고 있는 포켓몬.
        조금이라도 위험을 감지하면
        하늘 높이 날아가 버린다.
      zh-Hant: |-
        從很久以前就已存在的寶可夢。
        只要察覺到絲毫的危險，
        就會立刻飛上高空躲避。
      zh-Hans: |-
        很久以前就存在的宝可梦。
        哪怕只察觉到一丝危险，
        都会立即飞向高空。
      en: |-
        A Pokémon that dates back many years. If it
        senses danger, it flies high and away, instantly.
      fr: |-
        Un Pokémon très ancien. S’il perçoit un danger,
        il fuit instantanément à haute altitude.
      de: |-
        Dieses Pokémon gehört einer sehr alten Spezies
        an. Wittert es Gefahr, so fliegt es sofort in große
        Höhen davon.
      es: |-
        Este Pokémon ha existido desde tiempos
        remotos. Al menor atisbo de peligro, alza el
        vuelo y huye.
      it: |-
        Questo Pokémon molto antico vola in alto
        nel cielo al minimo accenno di pericolo.
    lets-go-eevee:
      ja-Hrkt: |-
        むかしから　すんでいる　ポケモン。
        すこしでも　きけんを　かんじると
        そらたかく　とんで　いってしまう。
      ja: |-
