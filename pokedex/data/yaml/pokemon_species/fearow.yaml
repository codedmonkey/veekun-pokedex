    white-2:
      en: |-
        It has the stamina to fly all
        day on its broad wings. It
        fights by using its sharp beak.
    x:
      ja-Hrkt: |-
        おおきな　つばさで　おおぞらを
        とびつづけることが　できる。
        １かいも　おりなくても　へいきだ。
      ja: |-
        大きな　翼で　大空を
        飛び続けることが　できる。
        １回も　降りなくても　平気だ。
      ko: |-
        커다란 날개로 넓은 하늘을
        계속 날 수 있다.
        한 번도 내려앉지 않아도 괜찮다.
      en: |-
        With its huge and magnificent wings, it can keep
        aloft without ever having to land for rest.
      fr: |-
        Ses ailes géantes lui permettent de voler sur de
        longues distances sans qu’il ait besoin de se reposer.
      de: |-
        Mit seinen riesigen Flügeln kann dieses Pokémon
        nahezu pausenlos in der Luft bleiben.
      es: |-
        Con sus enormes y magníficas alas, puede seguir
        volando sin tener que aterrizar para descansar.
      it: |-
        Con le sue enormi e magnifiche ali, è in grado di
        volare senza mai atterrare per riposarsi.
    'y':
      ja-Hrkt: |-
        おおきな　つばさで　１にちじゅう
        とびまわる　たいりょくの　もちぬし。
        するどい　くちばしで　たたかう。
      ja: |-
        大きな　翼で　１日中
        飛び回る　体力の　持ち主。
        鋭い　クチバシで　戦う。
      ko: |-
        큰 날개로 온종일
        날아다닐 수 있는 체력의 소유자다.
        날카로운 부리로 싸운다.
      en: |-
        It has the stamina to fly all day on its broad wings.
        It fights by using its sharp beak.
      fr: |-
        Il a assez d’énergie pour voler toute la journée avec
        ses grandes ailes. Il frappe de son bec acéré.
      de: |-
        Es hat genügend Ausdauer, den ganzen Tag
        zu fliegen. Sein scharfer Schnabel dient als Waffe.
      es: |-
        Tiene energía para volar todo el día con sus grandes
        alas. Lucha con su afilado pico.
      it: |-
        Le sue ampie ali robuste gli permettono di volare
        tutto il giorno. Combatte usando il becco aguzzo.
    omega-ruby:
      ja-Hrkt: |-
        ながい　くびと　くちばしは　つちや　みずの
        なかに　いる　エサを　つかまえるのに　べんり。
        ほそながい　くちばしで　きように　つまむぞ。
      ja: |-
        長い　首と　くちばしは　土や　水の
        中に　いる　エサを　捕まえるのに　便利。
        細長い　くちばしで　器用に　つまむぞ。
      ko: |-
        긴 목과 부리는 땅이나 물 안에
        있는 먹이를 잡기 편리하다.
        가늘고 긴 부리로 능숙히 집는다.
      en: |-
        Fearow is recognized by its long neck and elongated beak.
        They are conveniently shaped for catching prey in soil
        or water. It deftly moves its long and skinny beak to
        pluck prey.
      fr: |-
        On reconnaît un Rapasdepic à son long cou et à son bec
        allongé. Ces attributs lui permettent d’attraper facilement
        ses proies dans la terre ou dans l’eau. Il bouge son bec
        long et fin avec une grande agilité.
      de: |-
        Ibitak erkennt man an seinem langen Hals und Schnabel.
        Er ist hervorragend dafür geeignet, im Erdreich oder im
        Wasser Beute zu jagen. Es setzt seinen langen, dünnen
        Schnabel dabei sehr geschickt ein.
      es: |-
        A Fearow se le reconoce por tener un pescuezo y un pico
        largos que le permiten cazar en tierra y agua. Tiene una
        gran habilidad moviendo el fino pico para atrapar a sus presas.
      it: |-
        Fearow è caratterizzato da un collo e un becco molto lunghi,
        dalla forma ottimale per la cattura della preda a terra o
        in acqua. Muove agilmente il becco lungo e affusolato
        per stanare la preda.
    alpha-sapphire:
      ja-Hrkt: |-
        ながい　くびと　くちばしは　つちや　みずの
        なかに　いる　エサを　つかまえるのに　べんり。
        ほそながい　くちばしで　きように　つまむぞ。
      ja: |-
        長い　首と　くちばしは　土や　水の
        中に　いる　エサを　捕まえるのに　便利。
        細長い　くちばしで　器用に　つまむぞ。
      ko: |-
