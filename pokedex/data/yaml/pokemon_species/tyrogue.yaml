    white-2:
      en: |-
        It is famous for its eagerness to
        fight and always nurses injuries
        from challenging larger foes.
    x:
      ja-Hrkt: |-
        いつでも　げんきいっぱい。
        つよくなるため　まけても　まけても
        あいてに　たちむかっていく。
      ja: |-
        いつでも　元気いっぱい。
        強くなるため　負けても　負けても
        相手に　立ち向かっていく。
      ko: |-
        항상 기운이 넘친다.
        강해지기 위해 계속 져도
        상대에게 맞선다.
      en: |-
        It is always bursting with energy. To make itself
        stronger, it keeps on fighting even if it loses.
      fr: |-
        Il est plein d’énergie. Il se bat tout le temps pour
        être plus fort, quitte à perdre un combat.
      de: |-
        Es strotzt vor Energie. Um noch stärker zu werden,
        kämpft es weiter, auch wenn es verloren hat.
      es: |-
        Ataca siempre con mucha energía. Para fortalecerse a
        sí mismo, sigue luchando aunque pierda.
      it: |-
        Sempre traboccante di energia. Per rinforzarsi
        continua a combattere anche dopo aver perso.
    'y':
      ja-Hrkt: |-
        かくとうセンスを　みがくため
        あらゆる　あいてに　たちむかう。
        まけんきが　ものすごく　つよい。
      ja: |-
        格闘センスを　磨くため
        あらゆる　相手に　立ち向かう。
        負けん気が　ものすごく　強い。
      ko: |-
        격투 감각을 닦기 위해
        모든 상대에게 맞선다.
        오기가 굉장히 세다.
      en: |-
        To brush up on its fighting skills, it will challenge
        anyone. It has a very strong competitive spirit.
      fr: |-
        Pour augmenter ses capacités, il cherche à se battre
        contre n’importe qui. Il est très courageux.
      de: |-
        Um seine Kampffähigkeiten zu verbessern, tritt es
        gegen jeden an. Es besitzt großen Kampfgeist.
      es: |-
        Para mejorar sus técnicas de lucha, desafiará a
        cualquiera. Tiene un espíritu muy competitivo.
      it: |-
        Sfida chiunque per mettere alla prova le sua abilità
        nella lotta. Ha un forte spirito agonistico.
    omega-ruby:
      ja-Hrkt: |-
        まいにち　トレーニング　しないと　ストレスが
        たまってしまうので　トレーナーは　そだてる　とき
        スケジュールかんりに　くふうが　ひつようだ。
      ja: |-
        毎日　トレーニング　しないと　ストレスが
        たまってしまうので　トレーナーは　育てる　とき
        スケジュール管理に　工夫が　必要だ。
      ko: |-
        매일 트레이닝하지 않으면 스트레스가
        쌓이기 때문에 트레이너는 키울 때
        스케줄 관리에 여러모로 고민해야 한다.
      en: |-
        Tyrogue becomes stressed out if it does not get to train every
        day. When raising this Pokémon, the Trainer must establish
        and uphold various training methods.
      fr: |-
        Debugant devient nerveux s’il ne s’entraîne pas tous les jours.
        Lorsqu’un Dresseur élève ce Pokémon, il doit établir et
        appliquer un programme d’entraînement très complet.
      de: |-
        Rabauz muss jeden Tag trainieren, sonst ist es nicht
        ausgelastet und reagiert gestresst. Wenn man dieses
        Pokémon trainiert, muss man zahlreiche Trainingsmethoden
        einsetzen und sie ständig ausbauen.
      es: |-
        Tyrogue se pone demasiado nervioso si no lo sacan a
        entrenarse cada día. Su Entrenador debe establecer y
        mantener ciertos métodos de entrenamiento durante la cría.
      it: |-
        Tyrogue ha bisogno di allenarsi ogni giorno per scaricare
        la sua energia. Gli Allenatori che lo allevano devono stabilire
        e praticare diverse metodologie di allenamento.
    alpha-sapphire:
      ja-Hrkt: |-
        まいにち　トレーニング　しないと　ストレスが
        たまってしまうので　トレーナーは　そだてる　とき
        スケジュールかんりに　くふうが　ひつようだ。
      ja: |-
        毎日　トレーニング　しないと　ストレスが
        たまってしまうので　トレーナーは　育てる　とき
        スケジュール管理に　工夫が　必要だ。
      ko: |-
        매일 트레이닝하지 않으면 스트레스가
        쌓이기 때문에 트레이너는 키울 때
        스케줄 관리에 여러모로 고민해야 한다.
      en: |-
        Tyrogue becomes stressed out if it does not get to train every
        day. When raising this Pokémon, the Trainer must establish
        and uphold various training methods.
      fr: |-
        Debugant devient nerveux s’il ne s’entraîne pas tous les jours.
        Lorsqu’un Dresseur élève ce Pokémon, il doit établir et
        appliquer un programme d’entraînement très complet.
      de: |-
        Rabauz muss jeden Tag trainieren, sonst ist es nicht
        ausgelastet und reagiert gestresst. Wenn man dieses
        Pokémon trainiert, muss man zahlreiche Trainingsmethoden
        einsetzen und ausbauen.
      es: |-
        Tyrogue se pone demasiado nervioso si no lo sacan a
        entrenarse cada día. Su Entrenador debe establecer y
        mantener ciertos métodos de entrenamiento durante la cría.
      it: |-
        Tyrogue ha bisogno di allenarsi ogni giorno per scaricare
        la sua energia. Gli Allenatori che lo allevano devono stabilire
        e praticare diverse metodologie di allenamento.
    sword:
      ja-Hrkt: |-
        いつでも　げんきいっぱい。
        つよくなるため　まけても　まけても
        あいてに　たちむかっていく。
      ja: |-
        いつでも　元気いっぱい。
        強くなるため　負けても　負けても
        相手に　立ち向かっていく。
      ko: |-
        항상 기운이 넘친다.
        강해지기 위해 지고 또 져도
        계속 상대에게 맞선다.
      zh-Hant: |-
        無論何時都充滿活力。
        為了變強，就算輸了一次又一次，
        也會不斷重新站起來迎戰對手。
      zh-Hans: |-
        永远都是精力充沛的样子。
        为了变强，就算输了一次又一次，
        也会不断地站起来迎战对手。
      en: |-
        It is always bursting with energy. To make itself
        stronger, it keeps on fighting even if it loses.
      fr: |-
        Ce Pokémon est débordant d’énergie.
        Même s’il perd encore et encore, il se relève
        toujours pour devenir plus fort.
      de: |-
        Es strotzt vor Energie. Um stärker zu werden,
        fordert es seine Gegner immer wieder heraus,
        auch wenn es schon mehrmals verloren hat.
      es: |-
        Siempre está rebosante de energía. Por muchas
        derrotas que acumule, no deja de plantar cara a
        sus rivales con tal de fortalecerse.
      it: |-
        Sempre traboccante di energia. Per rinforzarsi
        continua a sfidare il suo avversario anche dopo
        essere stato ripetutamente sconfitto.
    shield:
      ja-Hrkt: |-
        てごろな　あいてを　みつけると
        すぐに　なぐりかかってくるので
        ちいさくても　ゆだんならない。
      ja: |-
        手ごろな　相手を　見つけると
        すぐに　殴りかかってくるので
        小さくても　油断ならない。
      ko: |-
        만만한 상대를 발견하면
        바로 공격해오기 때문에
        몸집이 작아도 방심은 할 수 없다.
      zh-Hant: |-
        體型雖小卻不可輕視，
        因為牠只要發現合適的對手，
        就會馬上撲上去大打出手。
      zh-Hans: |-
        体型偏小却不可轻视，
        因为它只要发现合适的对手
        便会马上扑上去大打出手。
      en: |-
        Even though it is small, it can’t be ignored because
        it will slug any handy target without warning.
      fr: |-
        Même s’il est petit, il vaut mieux ne pas l’ignorer :
        quand il trouve un adversaire à sa hauteur,
        il frappe fort et souvent sans prévenir.
      de: |-
        Es ist zwar nicht groß, geht aber entschlossen
        zum Angriff über, sobald es einen angemessenen
        Gegner sichtet. Vorsicht ist also geboten.
      es: |-
        Su pequeño tamaño no debe ser motivo para
        subestimarlo, ya que se liará de inmediato a
        golpes con cualquier rival que estime oportuno.
      it: |-
        Anche se è piccolo, non bisogna abbassare
        la guardia: quando trova un avversario che fa
        al caso suo, inizia subito a tempestarlo di colpi.
