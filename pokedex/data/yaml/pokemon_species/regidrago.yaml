  flavor_text:
    sword:
      ja-Hrkt: |-
        うでの　かたちは　こだいの　ドラゴン
        ポケモンの　あたまという　がくせつも
        あるが　しょうめいされていない。
      ja: |-
        腕の　形は　古代の　ドラゴン
        ポケモンの　頭という　学説も
        あるが　証明されていない。
      ko: |-
        팔의 형태가 고대 드래곤포켓몬의
        머리라는 학설도 있지만
        증명된 바는 없다.
      zh-Hant: |-
        有學者認為牠的手臂是
        古代龍寶可夢頭部的形狀。
        但這個學說尚未被證實。
      zh-Hans: |-
        有一种未经证实的学术说法
        认为它手臂的形状
        是古代龙宝可梦的头，
      en: |-
        An academic theory proposes that Regidrago’s
        arms were once the head of an ancient dragon
        Pokémon. The theory remains unproven.
      fr: |-
        Une théorie stipule que ses bras ont la forme
        de la tête d’un Pokémon Dragon des temps
        anciens, mais aucune preuve ne l’atteste.
      de: |-
        Einer unbestätigten Theorie zufolge sind seine
        Arme wie der Kopf eines urzeitlichen
        Drachen-Pokémon geformt.
      es: |-
        Cierta teoría afirma que la forma de sus brazos
        representa la cabeza de un Pokémon dragón
        ancestral, aunque esto no ha podido verificarse.
      it: |-
        Si ipotizza che le sue braccia abbiano la forma
        della testa di un antico Pokémon di tipo Drago,
        ma non esistono prove certe.
    shield:
      ja-Hrkt: |-
        ぜんしんが　ドラゴンエネルギーの
        けっしょう。　すべての　ドラゴン
        ポケモンの　ちからを　もつらしい。
      ja: |-
        全身が　ドラゴンエネルギーの
        結晶。　すべての　ドラゴン
        ポケモンの　力を　持つらしい。
      ko: |-
        온몸이 드래곤 에너지의
        결정체다. 모든 드래곤포켓몬의
        힘을 가지고 있는 듯하다.
      zh-Hant: |-
        全身是由龍之能量的結晶
        打造而成。據說牠擁有
        所有的龍寶可夢的力量。
      zh-Hans: |-
        整个身体是龙之能量的
        结晶。据说它拥有
        所有龙宝可梦的能力。
      en: |-
        Its body is composed of crystallized dragon
        energy. Regidrago is said to have the powers of
        every dragon Pokémon.
      fr: |-
        Son corps est entièrement composé de cristaux
        d’énergie draconique. Il possèderait les pouvoirs
        de tous les Pokémon Dragon.
      de: |-
        Sein ganzer Körper besteht aus kristallisierter
        Drachen-Energie. Es soll über die Kräfte aller
        Drachen-Pokémon verfügen.
      es: |-
        Todo su cuerpo es una gema de energía dragón
        cristalizada. Se cree que posee los poderes de
        todos los Pokémon dragón.
      it: |-
        Il suo corpo è formato da energia Drago
        cristallizzata. Pare che possieda i poteri
        di tutti i Pokémon di tipo Drago.
