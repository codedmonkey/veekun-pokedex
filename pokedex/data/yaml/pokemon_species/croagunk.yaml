  flavor_text:
    diamond:
      en: |-
        Its cheeks hold poison sacs.
        It tries to catch foes off guard
        to jab them with toxic fingers.
    pearl:
      en: |-
        Inflating its poison sacs, it
        makes an eerie blubbering sound
        for intimidation.
    platinum:
      en: |-
        It rarely fights fairly, but that is
        strictly to ensure survival. It is
        popular as a mascot.
    heartgold:
      en: |-
        Fluid squeezed from its finger, albeit
        poisonous, is a significant ingredient in
        remedies for lower-back pain.
    soulsilver:
      en: |-
        Fluid squeezed from its finger, albeit
        poisonous, is a significant ingredient in
        remedies for lower back pain.
    black:
      en: |-
        It rarely fights fairly, but that is
        strictly to ensure survival. It is
        popular as a mascot.
      fr: |-
        Son instinct de survie le pousse à
        ne pas se battre dans les règles.
        C’est une mascotte populaire.
    white:
      en: |-
        It rarely fights fairly, but that is
        strictly to ensure survival. It is
        popular as a mascot.
      fr: |-
        Son instinct de survie le pousse à
        ne pas se battre dans les règles.
        C’est une mascotte populaire.
    black-2:
      en: |-
        Inflating its poison sacs, it fills the
        area with an odd sound and hits
        flinching opponents with a poison jab.
    white-2:
      en: |-
        Inflating its poison sacs, it fills the
        area with an odd sound and hits
        flinching opponents with a poison jab.
    x:
      ja-Hrkt: |-
        ほっぺたに　どくぶくろを　もつ。
        あいての　すきを　ついて　もうどくを
        にじませている　ゆびを　つきさす。
      ja: |-
        ほっぺたに　毒袋を　持つ。
        相手の　すきを　ついて　猛毒を
        にじませている　指を　突き刺す。
      ko: |-
        볼에 독주머니를 가지고 있다.
        상대의 틈을 노려 맹독이
        배인 손가락을 꿰찌른다.
      en: |-
        Its cheeks hold poison sacs. It tries to catch foes
        off guard to jab them with toxic fingers.
      fr: |-
        Ses joues contiennent des glandes toxiques.
        Il attaque par surprise et utilise son toucher
        empoisonné.
      de: |-
        In seinen Backen sammelt sich Gift. Es versucht,
        Beute zu überraschen und mit Giftfingern zu
        schnappen.
      es: |-
        Tiene bolsas venenosas en las mejillas. Pilla
        desprevenidos a sus rivales para pincharles.
      it: |-
        Le sacche delle guance contengono veleno.
        Infilza i nemici con le sue unghie avvelenate.
    'y':
      ja-Hrkt: |-
        どくぶくろを　ふくらませて　ならし
        あたりに　ぶきみな　おとを　ひびかせ
        あいてが　ひるむと　どくづきをする。
      ja: |-
        毒袋を　ふくらませて　鳴らし
        辺りに　不気味な　音を　響かせ
        相手が　ひるむと　どくづきをする。
      ko: |-
        독주머니를 부풀려서 울어
        주변에 으스스한 소리를 퍼트려
        상대가 풀죽으면 독찌르기를 한다.
      en: |-
        Inflating its poison sacs, it fills the area with an odd
        sound and hits flinching opponents with a
        poison jab.
      fr: |-
        Ses glandes se gonflent de venin tout en émettant
        un son effrayant, le laissant ainsi empoisonner ses
        proies pétrifiées.
      de: |-
        Bläst es seine Giftbeutel auf, ertönt ein unheimliches
        Geräusch, das Gegner zurückschrecken lässt
        und vergiftet.
      es: |-
        Infla sus bolsas venenosas para emitir un sonido
        macabro mientras asesta golpes que hacen retroceder
        a los rivales.
      it: |-
        Gonfia le sue sacche di veleno emettendo un verso
        sinistro che può far tentennare l’avversario, poi lo
        avvelena.
    omega-ruby:
      ja-Hrkt: |-
        ほっぺたに　どくぶくろを　もつ。
        あいての　すきを　ついて　もうどくを
        にじませている　ゆびを　つきさす。
      ja: |-
        ほっぺたに　毒袋を　持つ。
        相手の　すきを　ついて　猛毒を
        にじませている　指を　突き刺す。
      ko: |-
        볼에 독주머니를 가지고 있다.
        상대의 틈을 노려 맹독이
        밴 손가락을 꿰찌른다.
      en: |-
        Its cheeks hold poison sacs. It tries to catch foes
        off guard to jab them with toxic fingers.
      fr: |-
        Ses joues contiennent des glandes toxiques. Il attaque
        par surprise et utilise son toucher empoisonné.
      de: |-
        In seinen Backen sammelt sich Gift. Es versucht, Beute zu
        überraschen und mit Giftfingern zu schnappen.
      es: |-
        Tiene bolsas venenosas en las mejillas. Pilla desprevenidos a
        sus rivales para pincharles.
      it: |-
        Le sacche delle guance contengono veleno. Infilza i nemici
        con le sue unghie avvelenate.
    alpha-sapphire:
      ja-Hrkt: |-
        どくぶくろを　ふくらませて　ならし
        あたりに　ぶきみな　おとを　ひびかせ
        あいてが　ひるむと　どくづきをする。
      ja: |-
        毒袋を　ふくらませて　鳴らし
        辺りに　不気味な　音を　響かせ
        相手が　ひるむと　どくづきをする。
      ko: |-
        독주머니를 부풀려서 울어
        주변에 으스스한 소리를 퍼트려
        상대가 풀죽으면 독찌르기를 한다.
      en: |-
        Inflating its poison sacs, it fills the area with an odd
        sound and hits flinching opponents with a
        poison jab.
      fr: |-
        Ses glandes se gonflent de venin tout en émettant un son
        effrayant, le laissant ainsi empoisonner ses proies pétrifiées.
      de: |-
        Bläst es seine Giftbeutel auf, ertönt ein unheimliches
        Geräusch, das Gegner zurückschrecken lässt und vergiftet.
      es: |-
        Infla sus bolsas venenosas para emitir un sonido macabro
        mientras asesta golpes que hacen retroceder a los rivales.
      it: |-
        Gonfia le sue sacche di veleno emettendo un verso sinistro
        che può far tentennare l’avversario, poi lo avvelena.
    sword:
      ja-Hrkt: |-
        ほほの　どくぶくろを　ならして
        てきを　いかく。　ひるんだ　スキに
        どくづきを　おみまいする。
      ja: |-
        頬の　毒袋を　鳴らして
        敵を　威嚇。　ひるんだ　隙に
        毒突きを　おみまいする。
      ko: |-
        볼에 있는 독주머니를 울려서
        상대를 위협한다. 풀이 죽은 틈을 타
        독찌르기 공격을 한다.
      zh-Hant: |-
        會從自己臉頰上的毒囊
        發出聲音來威嚇對手，
        趁對手畏懼的時候使出毒擊。
      zh-Hans: |-
        会从自己脸颊上的毒囊
        发出声音来威吓对手，
        趁对手畏惧的时间使出毒击。
      en: |-
        It makes frightening noises with its poison-filled
        cheek sacs. When opponents flinch, Croagunk
        hits them with a poison jab.
      fr: |-
        Il intimide ses ennemis en faisant résonner
        les glandes toxiques de ses joues, puis leur
        porte un coup empoisonné par surprise.
      de: |-
        Es schüchtert Gegner mit Geräuschen ein, die
        es mit seinen Giftbeuteln erzeugt. Gelingt ihm
        dies, erledigt es sein Ziel mit einem Giftangriff.
      es: |-
        Amenaza a los rivales haciendo sonar las bolsas
        venenosas de sus mejillas y aprovecha su estupor
        para inyectarles toxinas.
      it: |-
        Spaventa il nemico facendo risuonare le sacche
        sulle guance e lo avvelena approfittando del
        momento di esitazione.
    shield:
      ja-Hrkt: |-
        どくを　うすめると　くすりに　なる。
        やくひんがいしゃの　マスコットに
        なって　にんきものに　なった。
      ja: |-
        毒を　薄めると　薬に　なる。
        薬品会社の　マスコットに
        なって　人気者に　なった。
      ko: |-
        독을 희석하면 약이 된다.
        제약 회사의 마스코트가
        된 후로 인기가 많아졌다.
      zh-Hant: |-
        毒素在稀釋後能製成藥品。
        牠是製藥公司的吉祥物，
        廣受眾人的歡迎。
      zh-Hans: |-
        毒素在稀释后能制成药品。
        它是制药公司的吉祥物，
        广受众人的欢迎。
      en: |-
        Once diluted, its poison becomes medicinal.
        This Pokémon came into popularity after a
        pharmaceutical company chose it as a mascot.
      fr: |-
        Dilué, son poison sert de remède. Cela lui a valu
        de devenir la mascotte populaire d’une entreprise
        de produits pharmaceutiques.
      de: |-
        Verdünnt man sein Gift, wird es zu Medizin. Seit
        es zum Maskottchen eines Pharmakonzerns
        wurde, hat es viele neue Fans gewonnen.
      es: |-
        Su veneno posee propiedades medicinales si se
        diluye. Se ha vuelto muy popular desde que una
        empresa farmacéutica lo adoptó como mascota.
      it: |-
        Se diluito, il suo veleno ha proprietà medicinali.
        È diventato popolare da quando una casa
        farmaceutica ne ha fatto la sua mascotte.
