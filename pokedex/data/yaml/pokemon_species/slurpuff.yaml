slurpuff:
  base_happiness: 50
  capture_rate: 140
  color: white
  egg_groups:
    - fairy
  evolution_chain: swirlix
  evolves_from: swirlix
  flavor_text:
    x:
      ja-Hrkt: |-
        わずかな　においでも　かぎわける
        びんかんな　きゅうかくを　いかして
        パティシエの　てつだいを　している。
      ja: |-
        わずかな　においでも　かぎわける
        敏感な　きゅうかくを　活かして
        パティシエの　手伝いを　している。
      ko: |-
        아주 약간의 냄새도 구별할 수 있는
        민감한 후각을 살려
        파티시에를 돕고 있다.
      en: |-
        It can distinguish the faintest of scents.
        It puts its sensitive sense of smell to use
        by helping pastry chefs in their work.
      fr: |-
        La finesse de son odorat lui permet de distinguer
        les nuances de parfums les plus subtiles, ce qui en
        fait un compagnon idéal pour les pâtissiers.
      de: |-
        Es verfügt über einen feinen Geruchssinn, mit dem
        es selbst die schwächsten Gerüche erkennen kann.
        Es hilft deshalb oft in Konditoreien aus.
      es: |-
        Puede rastrear hasta el más débil de los olores. Hace
        uso de su fino olfato para ayudar a los pasteleros más
        exquisitos.
      it: |-
        È dotato di un olfatto sensibilissimo che gli permette
        di distinguere anche gli odori più sottili. Si serve di
        questo talento per aiutare i pasticcieri.
    'y':
      ja-Hrkt: |-
        きゅうかくは　ひとの　１おくばい。
        くうきちゅうの　わずかな　においで
        まわりの　ようすが　すべて　わかる。
      ja: |-
        きゅうかくは　人の　１億倍以上。
        空気中に　漂う　わずかな　においで
        まわりの　様子が　すべて　わかる。
      ko: |-
        후각이 사람의 1억 배이다.
        공기 중의 미세한 냄새로
        주위의 상황을 전부 파악할 수 있다.
      en: |-
        Its sense of smell is 100 million times better than
        a human’s, so even the faintest scent tells it about
        everything in the area. It’s like it can see with its nose!
      fr: |-
        Son odorat est des millions de fois plus développé
        que celui d’un humain. Il se repère dans l’espace
        grâce aux odeurs qui flottent autour de lui.
      de: |-
        Sein Geruchssinn ist mehrere Millionen Mal stärker als
        der des Menschen. Durch die schwächsten Gerüche
        in der Luft weiß es, was in seiner Umgebung vorgeht.
      es: |-
        Su sentido del olfato es varios millones de veces más
        agudo que el de un humano. Con él percibe lo que
        sucede a su alrededor, por sutil que sea el olor.
      it: |-
        Il suo olfatto è milioni di volte più sviluppato di quello
        degli esseri umani. Grazie ad esso, riesce a percepire
        l’ambiente circostante attraverso gli odori più sottili.
    omega-ruby:
      ja-Hrkt: |-
        わずかな　においでも　かぎわける
        びんかんな　きゅうかくを　いかして
        パティシエの　てつだいを　している。
      ja: |-
        わずかな　においでも　かぎわける
        敏感な　きゅうかくを　活かして
        パティシエの　手伝いを　している。
      ko: |-
        아주 약간의 냄새도 구별할 수 있는
        민감한 후각을 살려
        파티시에를 돕고 있다.
      en: |-
        It can distinguish the faintest of scents.
        It puts its sensitive sense of smell to use
        by helping pastry chefs in their work.
      fr: |-
        La finesse de son odorat lui permet de distinguer les nuances
        de parfums les plus subtiles, ce qui en fait un compagnon idéal
        pour les pâtissiers.
      de: |-
        Es verfügt über einen feinen Geruchssinn, mit dem es selbst
        die schwächsten Gerüche erkennen kann. Es hilft deshalb oft
        in Konditoreien aus.
      es: |-
        Puede rastrear hasta el más débil de los olores. Hace uso de
        su fino olfato para ayudar a los pasteleros más exquisitos.
      it: |-
        È dotato di un olfatto sensibilissimo che gli permette di
        distinguere anche gli odori più sottili. Si serve di questo
        talento per aiutare i pasticcieri.
    alpha-sapphire:
      ja-Hrkt: |-
        きゅうかくは　ひとの　１おくばい。
        くうきちゅうの　わずかな　においで
        まわりの　ようすが　すべて　わかる。
      ja: |-
        きゅうかくは　人の　１億倍以上。
        空気中に　漂う　わずかな　においで
        まわりの　様子が　すべて　わかる。
      ko: |-
        후각이 사람의 1억 배이다.
        공기 중의 미세한 냄새로
        주위의 상황을 전부 파악할 수 있다.
      en: |-
        Its sense of smell is 100 million times better than
        a human’s, so even the faintest scent tells it about
        everything in the area. It’s like it can see with its nose!
      fr: |-
        Son odorat est des millions de fois plus développé que celui
        d’un humain. Il se repère dans l’espace grâce aux odeurs
        qui flottent autour de lui.
      de: |-
        Sein Geruchssinn ist mehrere Millionen Mal stärker als der
        des Menschen. Durch die schwächsten Gerüche in der Luft
        weiß es, was in seiner Umgebung vorgeht.
      es: |-
        Su sentido del olfato es varios millones de veces más agudo
        que el de un humano. Con él percibe lo que sucede a su
        alrededor, por sutil que sea el olor.
      it: |-
        Il suo olfatto è milioni di volte più sviluppato di quello degli
        esseri umani. Grazie ad esso, riesce a percepire l’ambiente
        circostante attraverso gli odori più sottili.
    sword:
      ja-Hrkt: |-
        たいしゅうから　こころと　からだの
        ちょうしを　かぎとる。　いりょうへの
        おうようが　きたいされている。
      ja: |-
        体臭から　心と　体の
        調子を　嗅ぎとる。　医療への
        応用が　期待されている。
      ko: |-
        체취로 몸과 마음의 상태를
        알아낸다. 의료계에서 응용될
        것으로 기대되고 있다.
      zh-Hant: |-
        能從人們身上的氣味裡
        嗅出他們的身心狀態。
        在醫療領域的實際應用備受矚目。
      zh-Hans: |-
        能从人们身上的气味里
        嗅出他们的身心状态。
        在医疗领域的实际应用备受瞩目。
      en: |-
        By taking in a person’s scent, it can sniff out their
        mental and physical condition. It’s hoped that
        this skill will have many medical applications.
      fr: |-
        Il peut diagnostiquer l’état de santé mentale et
        physique de quelqu’un rien qu’à l’odorat. Un tel
        don pourrait avoir des applications en médecine.
      de: |-
        Es kann die körperliche und seelische Verfassung
        anderer anhand ihres Körpergeruchs erkennen.
        Dies versucht man für die Medizin zu nutzen.
      es: |-
        Puede percibir el estado físico y mental de
        alguien solo con olerlo, lo que podría tener
        aplicaciones útiles en el campo de la medicina.
      it: |-
        È in grado di comprendere lo stato fisico e
        mentale altrui dall’odore. Questa capacità
        potrebbe essere molto utile in campo medico.
    shield:
      ja-Hrkt: |-
        たいもうに　たくさん　くうきを
        ふくんでいるので　さわりごこちは
        やわらかく　みためより　かるい。
      ja: |-
        体毛に　たくさん　空気を
        含んでいるので　触り心地は
        柔らかく　見た目より　軽い。
      ko: |-
        털에 많은 공기를 담고 있어
        촉감이 부드럽고
        보기보다 가볍다.
      zh-Hant: |-
        因為體毛裡富含空氣，
        所以摸起來十分柔軟，
        重量也比看起來要輕。
      zh-Hans: |-
        因为体毛里富含空气，
        所以摸起来十分柔软，
        重量也比看起来要轻。
      en: |-
        Slurpuff’s fur contains a lot of air, making it soft
        to the touch and lighter than it looks.
      fr: |-
        Sa fourrure est si aérée qu’elle le rend très doux
        et très agréable au toucher, et bien plus léger
        qu’il en a l’air.
      de: |-
        Da in seinem Fell eine Menge Luft eingeschlossen
        ist, fühlt es sich unheimlich weich an und ist
        leichter, als es auf den ersten Blick aussieht.
      es: |-
        La gran cantidad de aire acumulada en su pelaje
        le confiere un tacto aterciopelado y un peso muy
        inferior al que aparenta.
      it: |-
        La grande quantità d’aria contenuta nella sua
        pelliccia la rende soffice al tatto. È più leggero
        di quanto possa sembrare.
