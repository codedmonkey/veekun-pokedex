    x:
      ja-Hrkt: |-
        よあけごろ　あたりいったいに
        ひびきわたる　ぶきみな　とおぼえで
        じぶんたちの　なわばりを　アピール。
      ja: |-
        夜明けごろ　あたり一帯に
        響きわたる　不気味な　遠ぼえで
        自分たちの　縄張りを　アピール。
      ko: |-
        새벽녘에 주변 일대에
        울려 퍼지는 기분 나쁜 울음소리로
        자신들의 영역을 어필한다.
      en: |-
        Around dawn, its ominous howl echoes through
        the area to announce that this is its territory.
      fr: |-
        Il hurle dès l’aube pour délimiter son territoire.
        On l’entend à des kilomètres à la ronde.
      de: |-
        Im Morgengrauen schallt sein ominöses Geheule
        über das Gebiet, das es für sich beansprucht.
      es: |-
        Al amanecer, resuena por la zona su inquietante
        aullido para anunciar que es su territorio.
      it: |-
        All’alba, i suoi sinistri urli riecheggiano nell’aria.
        In questo modo demarca il territorio.
    'y':
      ja-Hrkt: |-
        なかまだけで　わかりあえる
        なきごえで　おたがいの　いちを
        たしかめながら　えものをおいつめる。
      ja: |-
        仲間だけで　わかりあえる
        鳴き声で　お互いの　位置を
        確かめながら　獲物を　追いつめる。
      ko: |-
        동료끼리만 서로 알 수 있는
        울음소리로 서로의 위치를
        확인해가며 먹이를 몰아붙인다.
      en: |-
        To corner prey, they check each other’s location
        using barks that only they can understand.
      fr: |-
        Pour traquer leur proie, ils se localisent mutuellement
        avec des aboiements compris par eux seuls.
      de: |-
        Sie treiben ihre Beute in die Enge und orientieren sich
        dabei anhand ihres Bellens, das nur sie verstehen.
      es: |-
        Para arrinconar a sus presas, comprueban sus
        posiciones con ladridos que solo ellos entienden.
      it: |-
        Per circondare la preda, gli Houndour si comunicano
        la posizione reciproca con ululati che capiscono solo
        loro.
    omega-ruby:
      ja-Hrkt: |-
        さまざまな　なきごえを　つかいわけ　なかまと
        れんらくを　とりあい　えものを　おいこんでいく。
        チームワークの　みごとさは　ポケモンずいいち。
      ja: |-
        様々な　鳴き声を　使いわけ　仲間と
        連絡を　取りあい　獲物を　追い込んでいく。
        チームワークの　見事さは　ポケモン随一。
      ko: |-
        여러 가지 울음소리를 사용하여 동료와
        연락을 주고받아 먹이를 몰아간다.
        팀워크는 포켓몬 중 제일이다.
      en: |-
        Houndour hunt as a coordinated pack. They communicate with
        each other using a variety of cries to corner their prey.
        This Pokémon’s remarkable teamwork is unparalleled.
      fr: |-
        Les Malosse chassent en meute organisée. Ils communiquent
        entre eux grâce à une série de petits cris pour encercler leur
        proie. L’étonnant travail d’équipe de ces Pokémon est sans
        comparaison.
      de: |-
        Hunduster jagen in Gruppen. Sie kommunizieren miteinander
        über verschiedene Arten von Geheul und treiben ihre Feinde in
        die Enge. Die Zusammenarbeit dieser Pokémon ist einzigartig.
      es: |-
        Houndour sale a cazar con el resto de la manada con total
        coordinación. Estos Pokémon se comunican unos con otros
        usando una serie de aullidos para acorralar a su presa.
        El compañerismo que existe entre ellos es incomparable.
      it: |-
        Gli Houndour cacciano in squadre organizzate. Comunicano
        tra loro con svariati versi per intrappolare la preda.
        Quest’incredibile lavoro di squadra è unico nel suo genere.
    alpha-sapphire:
      ja-Hrkt: |-
        さまざまな　なきごえを　つかいわけ　なかまと
        れんらくを　とりあい　えものを　おいこんでいく。
        チームワークの　みごとさは　ポケモンずいいち。
      ja: |-
        様々な　鳴き声を　使いわけ　仲間と
        連絡を　取りあい　獲物を　追い込んでいく。
        チームワークの　見事さは　ポケモン随一。
      ko: |-
        여러 가지 울음소리를 사용하여 동료와
        연락을 주고받아 먹이를 몰아간다.
        팀워크는 포켓몬 중 제일이다.
      en: |-
        Houndour hunt as a coordinated pack. They communicate
        with each other using a variety of cries to corner their prey.
        This Pokémon’s remarkable teamwork is unparalleled.
      fr: |-
        Les Malosse chassent en meute organisée. Ils communiquent
        entre eux grâce à une série de petits cris pour encercler leur
        proie. L’étonnant travail d’équipe de ces Pokémon est sans
        comparaison.
      de: |-
        Hunduster jagen in Gruppen. Sie kommunizieren miteinander
        über verschiedene Arten von Geheul und treiben ihre Feinde in
        die Enge. Die Zusammenarbeit dieser Pokémon ist einzigartig.
      es: |-
        Houndour sale a cazar con el resto de la manada con total
        coordinación. Estos Pokémon se comunican unos con otros
        usando una serie de aullidos para acorralar a su presa.
        El compañerismo que existe entre ellos es incomparable.
      it: |-
        Gli Houndour cacciano in squadre organizzate. Comunicano
        tra loro con svariati versi per intrappolare la preda.
        Quest’incredibile lavoro di squadra è unico nel suo genere.
    ultra-sun:
      ja-Hrkt: |-
        なかまとの　れんけいが　とくい。
        パートナーに　なると　トレーナーの
        めいれいに　とっても　ちゅうじつだ。
      ja: |-
        仲間との　連携が　得意。
        パートナーに　なると　トレーナーの
        命令に　とっても　忠実だ。
      ko: |-
        동료와의 연계가 특기다.
        파트너가되면 트레이너의
        명령에 매우 충실하다.
      zh-Hant: |-
        擅長與夥伴合作。
        只要與訓練家成為搭檔，
        就會徹底服從訓練家的命令。
      zh-Hans: |-
        擅长与伙伴的合作。
        如果成为同伴，
        就会非常听从训练家的命令。
      en: |-
        It cooperates with others skillfully. When it
        becomes your partner, it’s very loyal to you as
        its Trainer and will obey your orders.
      fr: |-
        Ce Pokémon est doué pour le travail en équipe.
        C’est un compagnon fidèle qui écoute les ordres
        de son Dresseur sans sourciller.
      de: |-
        Es ist auf Zusammenarbeit spezialisiert und
        folgt den Befehlen seines Trainers aufs Wort.
      es: |-
        Famoso por su lealtad y ánimo cooperativo.
        Obedecerá sin dudar todo cuanto le ordene
        su Entrenador.
      it: |-
        Agisce sempre in squadra con i suoi simili.
        È un compagno fedele e segue attentamente
        le istruzioni del suo Allenatore.
    ultra-moon:
      ja-Hrkt: |-
        よあけまえに　ぶきみな　とおぼえを
        くりかえし　じぶんたちの　むれの
        そんざいを　アピール　している。
      ja: |-
        夜明け前に　不気味な　遠吠えを
        繰り返し　自分たちの　群れの
        存在を　アピール　している。
      ko: |-
        동이 트기 전에 기분 나쁜 울음을
        반복하여 자신들 무리의
        존재를 어필한다.
      zh-Hant: |-
        會在天亮前反覆發出令人
        不寒而慄的長嚎，藉此強調
        自己群體的存在。
      zh-Hans: |-
        会在天亮之前反复发出恐怖的长嚎，
        并以此来彰显自己群体的存在。
      en: |-
        They make repeated eerie howls before dawn
        to call attention to their pack.
      fr: |-
        Si ses congénères et lui poussent de sinistres
        hurlements avant l’aube, c’est pour signaler
        leur présence à tout le monde.
      de: |-
        Mit wiederholtem unheimlichen Heulen vor
        Tagesanbruch machen sie auf die Existenz
        ihres Rudels aufmerksam.
      es: |-
        Los escalofriantes aullidos que profiere justo
        antes del alba son para señalar la presencia de
        su manada.
      it: |-
        Gli urli sinistri che emette prima dell’alba hanno
        la funzione di segnalare la presenza del suo
        branco.
