    black-2:
      en: |-
        It’s so stinky! Muk’s body contains
        toxic elements, and any plant will
        wilt when it passes by.
    white-2:
      en: |-
        It’s so stinky! Muk’s body contains
        toxic elements, and any plant will
        wilt when it passes by.
    x:
      ja-Hrkt: |-
        ヘドロが　たまる　くさい　ばしょを
        このんで　あつまってくるので
        あたりは　いっそう　くさくなる。
      ja: |-
        ヘドロが　たまる　くさい　場所を
        好んで　集まってくるので
        あたりは　いっそう　くさくなる。
      ko: |-
        진흙이 쌓여 악취가 나는 장소를
        좋아해서 모여들기 때문에
        주변은 더욱 악취가 난다.
      en: |-
        They love to gather in smelly areas where sludge
        accumulates, making the stench around
        them worse.
      fr: |-
        Il recherche les endroits sales où il y a des ordures
        pour y établir son habitat puant et infect.
      de: |-
        Sie treffen sich an stinkenden Orten, an denen der
        Schleim sich türmt. Dies merkt man am Gestank.
      es: |-
        Les encanta reunirse en zonas apestosas donde se
        acumula el lodo, haciendo su olor más insoportable.
      it: |-
        Amano riunirsi vicino a puzzolenti liquami di scolo,
        rendendo il fetore ancora più intenso.
    'y':
      ja-Hrkt: |-
        からだから　もうどくの　たいえきが
        しみでている。その　えきに　ふれた
        くさきは　あっというまに　かれる。
      ja: |-
        体から　猛毒の　体液が
        染み出ている。その　液に　触れた
        草木は　あっというまに　枯れる。
      ko: |-
        몸에서 맹독의 체액이
        배어 나오고 있다. 그 액에 스친
        초목은 순식간에 시든다.
      en: |-
        A toxic fluid seeps from its body. The fluid instantly
        kills plants and trees on contact.
      fr: |-
        Son corps exsude un fluide toxique qui tue
        instantanément les plantes et les arbres au contact.
      de: |-
        Sein Körper sondert eine giftige Substanz ab,
        die bei Kontakt Pflanzen und Bäume vernichtet.
      es: |-
        Su cuerpo segrega un fluido tóxico que elimina la vida
        vegetal cuando la toca.
      it: |-
        Dal suo corpo filtra un fluido tossico che uccide
        all’istante piante e alberi con cui viene a contatto.
    omega-ruby:
      ja-Hrkt: |-
        からだから　しみだしている　たいえきは　はなが
        まがるほど　きょうれつな　においを　はなつ。
        １てきで　プールのみずが　にごり　においだす。
      ja: |-
        体から　染み出している　体液は　鼻が
        曲がるほど　強烈な　臭いを　放つ。
        １滴で　プールの水が　濁り　臭いだす。
      ko: |-
        몸에서 배어 나오는 체액은 코를
        찌를 정도로 강렬한 냄새를 뿜는다.
        한 방울로 수영장의 물이 탁해지고 냄새가 난다.
      en: |-
        From Muk’s body seeps a foul fluid that gives off a
        nose-bendingly horrible stench. Just one drop of this
        Pokémon’s body fluid can turn a pool stagnant and rancid.
      fr: |-
        Un fluide nauséabond suinte du corps de Grotadmorv,
        agressant les narines de ses ennemis. Une seule goutte
        de ce fluide suffit à faire croupir un bassin d’eau propre.
      de: |-
        Sleimok scheidet eine widerlich stinkende Substanz aus.
        Ein einziger Tropfen dieser Substanz reicht aus, um ein
        Gewässer zu verseuchen.
      es: |-
        Muk emana por todo el cuerpo un fluido maloliente que obliga
        a taparse la nariz. Con solo una gota de la sustancia que
        exuda este Pokémon, se podría contaminar un estanque.
      it: |-
        Il corpo di questo Pokémon emana un liquido marcio
        dall’odore nauseabondo. Una sola goccia di questo liquido
        è in grado di rendere l’acqua di una piscina putrida
        e stagnante.
    alpha-sapphire:
      ja-Hrkt: |-
        きたない　ものが　だいこうぶつなので　ゴミを
        みちばたに　すてる　ような　ひとが　すんでいる
        まちには　ベトベトンが　あつまってくるぞ。
      ja: |-
        汚い　ものが　大好物なので　ゴミを
        道端に　捨てる　ような　人が　住んでいる
        街には　ベトベトンが　集まってくるぞ。
      ko: |-
        더러운 것을 매우 좋아해서 쓰레기를
        길가에 버릴 것 같은 사람이 사는
        마을에는 질뻐기가 모여든다.
      en: |-
        This Pokémon’s favorite food is anything that is repugnantly
        filthy. In dirty towns where people think nothing of throwing
        away litter on the streets, Muk are certain to gather.
      fr: |-
        Ce Pokémon ne mange que ce qui est répugnant et abject.
        Les Grotadmorv se rassemblent dans les villes où les gens
        jettent tout par terre, dans la rue.
      de: |-
        Sleimoks Lieblingsspeise ist alles, was widerlich
        verschmutzt ist. In dreckigen Städten, in denen
        sich Menschen nichts dabei denken, wenn sie Müll
        auf die Straße werfen, lassen sich diese Pokémon
        mit Vorliebe in Scharen nieder.
      es: |-
        A este Pokémon le encanta comer cosas repulsivas. En
        ciudades sucias en las que la gente tira la basura por la calle,
        los Muk tienen, sin duda, su punto de encuentro.
      it: |-
        Questo Pokémon si ciba di qualunque cosa sia sudicia
        e ripugnante. Le città più inquinate, dove la popolazione
        getta i rifiuti in strada, sono un luogo di ritrovo frequente
        per i Muk.
    sun:
      ja-Hrkt: |-
        とにかく　はなが　まがるほど　くさい。
        だが　いちぶには　それがいいと　いう
        ベトベトンマニアも　そんざいする。
      ja: |-
        とにかく　鼻が　曲がるほど　臭い。
        だが　一部には　それがいいと　いう
        ベトベトンマニアも　存在する。
      ko: |-
        코를 찌를 정도로 지독한 냄새가 난다.
        하지만 오히려 그 냄새가 좋다는
        질뻐기 마니아도 일부 존재한다.
      zh-Hant: |-
        總之就是臭得讓人不敢用鼻子呼吸。
        但是也存在著少數覺得這味道
        很不錯的臭臭泥愛好者。
      zh-Hans: |-
        总之就是臭得鼻子都不敢呼吸。
        但是也存在着部分觉得这味道
        很不错的臭臭泥爱好者。
      en: |-
        The stench it gives off will make your nose
        scrunch up. Still, there are Muk fans who think
        that’s a good thing.
      fr: |-
        La puanteur qu’il dégage est presque
        insoutenable. Mais certains aficionados trouvent
        que c’est ce qui fait son charme.
      de: |-
        Es sondert einen widerlichen Gestank ab.
        In Fankreisen wird jedoch ausgerechnet
        diese Eigenschaft besonders geschätzt.
      es: |-
        Desprende un hedor insoportable que invita a
        taparse la nariz. A algunos fanáticos de este
        Pokémon, este hecho les parece encantador.
      it: |-
        Emana un fetore insopportabile, ma i fanatici
        di questo Pokémon lo considerano un pregio.
    moon:
      ja-Hrkt: |-
        かんきょうが　せいびされた　さいきんは
        めっきり　すがたを　みなくなった。
        いずれ　ぜつめつすると　いわれている。
      ja: |-
        環境が　整備された　最近は
        めっきり　姿を　みなくなった。
        いずれ　絶滅すると　いわれている。
      ko: |-
        환경이 정비된 최근에는
        좀처럼 모습을 볼 수 없게 되었다.
        언젠가는 멸종될 것이라고 전해진다.
      zh-Hant: |-
        經過環境整治後，
        最近已經很難看到牠的身影了。
        據說早晚會滅絕。
      zh-Hans: |-
        在环境治理后的现在，
        明显已经看不到它们的身影了。
        据说早晚会灭绝。
      en: |-
        After recent environmental improvements, this
        Pokémon is now hardly seen at all. People
        speculate that it may go extinct at some point.
      fr: |-
        La qualité de l’environnement s’étant améliorée
        récemment, ce Pokémon est devenu plus rare.
        On dit qu’il est en voie d’extinction.
      de: |-
        Es wird immer seltener gesehen, da zunehmend
        mehr Wert auf Umweltschutz gelegt wird. Man
        vermutet, dass es irgendwann ganz ausstirbt.
      es: |-
        Con la reciente preocupación por el medio
        ambiente, este Pokémon escasea cada vez más.
        Podría considerarse en peligro de extinción.
      it: |-
        Ultimamente, l’accresciuta sensibilità ambientale
        ha portato a una diminuzione degli esemplari
        di questo Pokémon, che rischia l’estinzione.
    ultra-sun:
      ja-Hrkt: |-
        エサが　へって　かずも　げきげん。
        ぜつめつを　ふせぐため　じんこうの
        ヘドロいけが　つくられはじめた。
      ja: |-
        エサが　減って　数も　激減。
        絶滅を　防ぐため　人工の
        ヘドロ池が　作られ始めた。
      ko: |-
        먹이가 줄어들어 개체 수가 격감했다.
        멸종을 방지하기 위해 
        인공 진흙 연못을 만들기 시작했다.
      zh-Hant: |-
        因為食物減少而導致數量驟減。
        為了防止牠絕種，人們開始
        建造人工的污泥池。
      zh-Hans: |-
        食物变少数量也会急剧减少。
        为了防止它灭绝，
        人们开始了制造人工污泥池。
      en: |-
        Their food sources have decreased, and their
        numbers have declined sharply. Sludge ponds
        are being built to prevent their extinction.
      fr: |-
        Faute de nourriture, la population de Grotadmorv
        diminue rapidement. Pour éviter son extinction,
        des étangs de fange artificiels ont été creusés.
      de: |-
        Aufgrund von Futtermangel sieht man es immer
        seltener. Um es vom Aussterben zu bewahren,
        werden nun künstliche Schlammteiche angelegt.
      es: |-
        Su número ha disminuido por falta de sustento,
        por lo que se han creado estanques de lodo
        artificiales para salvarlo de la extinción.
      it: |-
        Il loro numero è calato drasticamente a causa
        della mancanza di cibo. Per evitarne l’estinzione,
        sono state create pozze di liquami artificiali.
    ultra-moon:
      ja-Hrkt: |-
        びょうげんきんを　まきちらすので
        くじょ　しつづけた　けっか
        かずが　げきげんして　しまった。
      ja: |-
        病原菌を　まき散らすので
        駆除　し続けた　結果
        数が　激減して　しまった。
      ko: |-
        병원균을 흩뿌리기 때문에
        제거를 거듭한 결과
        수가 급격히 줄어들었다.
      zh-Hant: |-
        由於牠會散播病原菌，
        因此不斷遭到驅逐，
        結果導致牠的數量急遽減少。
      zh-Hans: |-
        因为它会播撒病原菌，
        所以一直遭到人们的驱逐，
        结果它的数量也急剧减少了。
      en: |-
        Because they scatter germs everywhere,
        they’ve long been targeted for extermination,
        leading to a steep decline in their population.
      fr: |-
        Comme il répand des microbes, on lui a
        beaucoup fait la chasse. La population de
        Grotadmorv a diminué de manière drastique.
      de: |-
        Da es Krankheitskeime verbreitet, hat man lange
        versucht, es auszurotten. Heute sieht man es
        daher nur noch selten.
      es: |-
        Al ser un portador de toda clase de gérmenes,
        ha sido perseguido a lo largo de la historia
        hasta verse abocado casi a la extinción.
      it: |-
        Essendo portatore di germi, è stato sempre
        cacciato senza pietà. Per questo il numero di
        esemplari si è ridotto drasticamente.
    lets-go-pikachu:
      ja-Hrkt: |-
        とっても　くさい！　きぜつするほど
        きょうれつだが　ベトベトンは　はなが
        たいかして　においを　かんじない。
      ja: |-
        とっても　臭い！　気絶するほど
        強烈だが　ベトベトンは　鼻が
        退化して　臭いを　感じない。
      ko: |-
        악취가 심하다! 기절할 정도로
        강렬하지만 질뻐기는 코가
        퇴화해서 냄새를 맡지 못한다.
      zh-Hant: |-
        奇臭無比！雖然臭到令人昏倒，
        但臭臭泥的鼻子已經退化，
        所以牠自己聞不到味道。
      zh-Hans: |-
        非常难闻！气味臭到让人
        窒息，但由于鼻子的退化，
        它自己完全闻不到味道。
      en: |-
        Smells so awful, it can cause fainting.
        Through degeneration of its nose,
        it lost its sense of smell.
      fr: |-
        Son odeur immonde provoque des
        évanouissements. Son odorat s’est atrophié
        à cause de sa propre puanteur.
      de: |-
        Sein fürchterlicher Gestank kann zur Ohnmacht
        führen. Da seine Nase so verkümmert ist, kann
        es selbst nichts mehr riechen.
      es: |-
        Huele tan mal que puede provocar desmayos.
        Su nariz se ha atrofiado de tal manera que
        ha perdido por completo el sentido del olfato.
      it: |-
        Emette un tanfo così terribile da far svenire,
        ma non sente alcun odore perché ormai
        il suo naso si è atrofizzato.
    lets-go-eevee:
      ja-Hrkt: |-
        とっても　くさい！　きぜつするほど
        きょうれつだが　ベトベトンは　はなが
        たいかして　においを　かんじない。
      ja: |-
        とっても　臭い！　気絶するほど
        強烈だが　ベトベトンは　鼻が
        退化して　臭いを　感じない。
      ko: |-
        악취가 심하다! 기절할 정도로
        강렬하지만 질뻐기는 코가
        퇴화해서 냄새를 맡지 못한다.
      zh-Hant: |-
        奇臭無比！雖然臭到令人昏倒，
        但臭臭泥的鼻子已經退化，
        所以牠自己聞不到味道。
      zh-Hans: |-
        非常难闻！气味臭到让人
        窒息，但由于鼻子的退化，
        它自己完全闻不到味道。
      en: |-
        Smells so awful, it can cause fainting.
        Through degeneration of its nose,
        it lost its sense of smell.
      fr: |-
        Son odeur immonde provoque des
        évanouissements. Son odorat s’est atrophié
        à cause de sa propre puanteur.
      de: |-
        Sein fürchterlicher Gestank kann zur Ohnmacht
        führen. Da seine Nase so verkümmert ist, kann
        es selbst nichts mehr riechen.
      es: |-
        Huele tan mal que puede provocar desmayos.
        Su nariz se ha atrofiado de tal manera que
        ha perdido por completo el sentido del olfato.
      it: |-
        Emette un tanfo così terribile da far svenire,
        ma non sente alcun odore perché ormai
        il suo naso si è atrofizzato.
