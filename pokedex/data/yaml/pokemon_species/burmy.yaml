    legends-arceus:
      en: |-
        If its cloak is even slightly damaged, Burmy will immediately
        repair it with whatever is close at hand. The Pokémon within the
        cloak is scrawny and vulnerable to the cold.
  form_description:
    en: "Forms only affect appearance, although they become permanent upon evolution.  Wild and newly-hatched Burmy are always in a Plant Cloak.  Burmy's cloak changes to match the terrain after a battle it participated in: Plant Cloak by default; Sandy Cloak in sandy or rocky areas, such as beaches, caves, and trails; and Trash Cloak in buildings."
