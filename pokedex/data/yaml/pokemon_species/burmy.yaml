        always ends up with a cloak.
    white-2:
      en: |-
        Even if it is born where there are
        no cocooning materials, it somehow
        always ends up with a cloak.
    x:
      ja-Hrkt: |-
        つめたい　こがらしを　ふせぐため
        こえだや　おちばを　ざいりょうに
        ミノを　つくり　からだを　おおう。
      ja: |-
        冷たい　木枯らしを　防ぐため
        小枝や　落ち葉を　材料に
        ミノを　作り　体を　覆う。
      ko: |-
        차가운 초겨울 바람을 막으려고
        작은 가지나 낙엽을 재료로
        도롱이를 만들어 몸을 감싼다.
      en: |-
        To shelter itself from cold, wintry winds, it covers
        itself with a cloak made of twigs and leaves.
      fr: |-
        Pour se protéger des vents glacés de l’hiver, il s’est
        tissé une cape de feuilles et de brindilles.
      de: |-
        Um sich vor dem eisigen Winterwind zu schützen,
        legt es sich unter einen Umhang aus Ästen und Laub.
      es: |-
        Para protegerse de los vientos fríos invernales, se
        cubre con un caparazón de ramas y hojas.
      it: |-
        Per ripararsi dal freddo e dai venti invernali si copre
        con un manto fatto di rami e foglie.
    'y':
      ja-Hrkt: |-
        たたかいで　ミノが　こわれてしまうと
        ちかくにある　ざいりょうで
        ミノを　すぐに　つくりなおす。
      ja: |-
        戦いで　ミノが　壊れてしまうと
        近くにある　材料で
        ミノを　すぐに　作り直す。
      ko: |-
        싸움으로 도롱이가 부서져 버리면
        가까이 있는 재료로
        도롱이를 바로 만들어 고친다.
      en: |-
        If its cloak is broken in battle, it quickly remakes
        the cloak with materials nearby.
      fr: |-
        S’il perd sa cape au combat, il en tisse rapidement
        une nouvelle avec ce qui lui tombe sous la main.
      de: |-
        Wird sein Umhang im Kampf zerstört, macht es sich
        schnell aus dem, was es findet, einen neuen.
      es: |-
        Si su caparazón se rompe en combate, lo rehace
        rápidamente con lo que tenga a mano.
      it: |-
        Se il suo manto si rompe mentre lotta, lo rifà
        velocemente con ciò che trova attorno a sé.
