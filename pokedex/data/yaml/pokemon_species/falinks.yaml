falinks:
  base_happiness: 50
  capture_rate: 45
  color: yellow
  egg_groups:
    - fairy
    - mineral
  evolution_chain: falinks
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        ヘイチョーと　よばれる　１ぴきと
        ヘイと　よばれる　５ひきで　ひとつ。
        ヘイチョーの　めいれいは　ぜったい。
      ja: |-
        ヘイチョーと　呼ばれる　１匹と
        ヘイと　呼ばれる　５匹で　ひとつ。
        ヘイチョーの　命令は　絶対。
      ko: |-
        리더라고 불리는 1마리와
        멤버라고 불리는 5마리로 이루어져 있다.
        리더의 명령은 절대적이다.
      zh-Hant: |-
        列陣兵由１個頭頭
        和５個跟班組成。
        頭頭的命令不可違抗。
      zh-Hans: |-
        列阵兵由１个头头
        和５个跟班组成。
        头头的命令不可违抗。
      en: |-
        Five of them are troopers, and one is the brass.
        The brass’s orders are absolute.
      fr: |-
        C’est une entité unique composée d’un chef
        et de cinq cadets. Ces derniers obéissent
        sans sourciller à leur supérieur hiérarchique.
      de: |-
        Dieses Pokémon besteht aus fünf Untergebenen
        und einem Anführer. Die Befehle des Anführers
        werden nie in Frage gestellt.
      es: |-
        Este Pokémon consta de cinco subalternos y un
        líder, cuyas órdenes obedecen sin rechistar.
      it: |-
        Questo Pokémon è formato da un capo e da
        cinque sottoposti che obbediscono ciecamente
        ai suoi ordini.
    shield:
      ja-Hrkt: |-
        ６ぴきで　１ぴきの　ポケモン。
        たいれつを　くみかえながら
        チームワークで　たたかうのだ。
      ja: |-
        ６匹で　１匹の　ポケモン。
        隊列を　組み替えながら
        チームワークで　戦うのだ。
      ko: |-
        6마리가 1마리의 포켓몬이다.
        대열을 바꿔가며
        팀워크로 싸운다.
      zh-Hant: |-
        ６隻為一體的寶可夢。
        慣於團隊行動，會一邊
        變換陣形一邊戰鬥。
      zh-Hans: |-
        ６只为一体的宝可梦。
        惯于团队行动，会一边
        变换阵形一边战斗。
      en: |-
        The six of them work together as one Pokémon.
        Teamwork is also their battle strategy, and they
        constantly change their formation as they fight.
      fr: |-
        À six, ils représentent un Pokémon unique.
        Ils peuvent changer de formation et comptent
        sur leur travail d’équipe en combat.
      de: |-
        Sie bilden zu sechst ein Pokémon. Es kann im
        Kampf seine Formation nach Belieben ändern
        und legt bemerkenswerte Teamarbeit an den Tag.
      es: |-
        Este Pokémon está formado por seis individuos
        que cambian de formación al luchar, haciendo
        gala de un notable espíritu de equipo.
      it: |-
        Pokémon dallo spiccato spirito di squadra, è
        formato da 6 elementi che lottano assieme
        cambiando schieramento in base alla situazione.
