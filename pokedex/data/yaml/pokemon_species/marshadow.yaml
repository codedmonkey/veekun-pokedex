marshadow:
  base_happiness: 0
  capture_rate: 3
  color: gray
  egg_groups:
    - no-eggs
  evolution_chain: marshadow
  evolves_from: ~
  flavor_text:
    sun:
      ja-Hrkt: |-
        かげのなかに　ひそむことが　でき
        ひとまえに　すがたを　みせないので
        そのそんざいは　まぼろし　だった。
      ja: |-
        影の中に　潜むことが　でき
        人前に　姿を　みせないので
        その存在は　幻　だった。
      ko: |-
        그림자 안에 숨어 들을 수 있어
        사람들 앞에 모습을 보이지 않아
        그 존재는 환상이었다.
      zh-Hant: |-
        可以潛入影子中，
        因為從不在人前現身，
        所以其存在曾被視為幻想。
      zh-Hans: |-
        可以潜入影子中，
        因为不会在人的面前展露身姿，
        所以其存在曾是个幻想。
      en: |-
        Able to conceal itself in shadows, it never
        appears before humans, so its very existence
        was the stuff of myth.
      fr: |-
        Il dissimule son apparence aux autres en se
        tapissant dans l’ombre. Son existence pourrait
        se révéler n’être qu’une fable.
      de: |-
        Da es sich im Schatten verbergen und so für
        menschliche Augen unsichtbar werden kann,
        war seine Existenz lange bezweifelt worden.
      es: |-
        Debido a que siempre se ha ocultado en las
        sombras y no le gusta dejarse ver, su misma
        existencia es todo un misterio.
      it: |-
        Si nasconde nelle ombre per sfuggire alla vista
        degli esseri viventi, e per questo si è dubitato
        per molto tempo della sua esistenza.
    moon:
      ja-Hrkt: |-
        あいての　かげに　もぐりこみ
        その　うごきや　ちからを　コピーする。
        おくびょうで　よわきな　ポケモン。
      ja: |-
        相手の　影に　潜り込み
        その　動きや　力を　コピーする。
        おくびょうで　弱気な　ポケモン。
      ko: |-
        상대의 그림자에 숨어들어
        그 움직임과 힘을 복사한다.
        겁이 많고 나약한 포켓몬이다.
      zh-Hant: |-
        會潛入對手的影子，
        複製其動作和力量。
        是種性格膽小而孱弱的寶可夢。
      zh-Hans: |-
        潜入对手的影子，
        复制其动作和力量。
        是胆小软弱的宝可梦。
      en: |-
        It lurks in the shadows of others, copying their
        movements and powers. This Pokémon is craven
        and cowering.
      fr: |-
        En se glissant dans l’ombre de son adversaire,
        il peut copier ses mouvements et ses forces.
        C’est un Pokémon au caractère timide et craintif.
      de: |-
        Es verschmilzt mit dem Schatten seiner Gegner
        und kopiert deren Bewegungen und Kräfte.
        Es ist ein feiges und schwaches Pokémon.
      es: |-
        Se infiltra en la sombra de su oponente y copia
        sus movimientos y su fuerza. Es un Pokémon
        tímido y un poco cobardica.
      it: |-
        Si infiltra nell’ombra del nemico, copiandone
        i movimenti e la forza. È un Pokémon timido
        e insicuro.
    ultra-sun:
      ja-Hrkt: |-
        あいての　かげに　もぐって　うごきや
        ちからを　まねる。　まねているうちに
        ほんもの　よりも　つよくなるぞ。
      ja: |-
        相手の　影に　潜って　動きや
        力を　真似る。　真似ているうちに
        本物　よりも　強くなるぞ。
      ko: |-
        상대 그림자에 숨어들어
        움직임이나 능력을 흉내 낸다.
        그러다가 진짜보다 강해진다.
      zh-Hant: |-
        能夠潛入對手的影子，
        模仿對手的動作和能力。
        在模仿的過程中會變得比本尊更強。
      zh-Hans: |-
        能潜入对方的影子，
        模仿对方的动作和力量。
        在模仿的过程中会变得比本尊更强。
      en: |-
        It slips into the shadows of others and mimics
        their powers and movements. As it improves, it
        becomes stronger than those it’s imitating.
      fr: |-
        Il se fond dans l’ombre de son adversaire
        pour imiter sa force et ses attaques.
        La copie surpasse alors l’original.
      de: |-
        Schlüpft es in den Schatten seines Gegners, um
        dessen Bewegungen und Kräfte zu imitieren,
        kann es sogar stärker als das Original werden.
      es: |-
        Se oculta en la sombra de su oponente y copia
        sus movimientos y su fuerza. Su imitación
        resulta más poderosa que el original.
      it: |-
        Si infiltra nell’ombra del nemico, copiandone
        i movimenti e la forza. L’imitazione finisce per
        diventare più forte dell’originale.
    ultra-moon:
      ja-Hrkt: |-
        ひとや　ポケモンの　かげの　なかに
        もぐる。　もぐった　あいての　きもちを
        りかいして　のうりょくを　コピーする。
      ja: |-
        人や　ポケモンの　影の　中に　潜る。
        潜った　相手の　気持ちを
        理解して　能力を　コピーする。
      ko: |-
        사람이나 포켓몬의 그림자 속에
        숨는다. 숨은 상대의 마음을
        이해하고 능력을 복사한다.
      zh-Hant: |-
        會潛進人或寶可夢的影子裡。
        能理解潛入對象的心情，
        並複製對方的能力。
      zh-Hans: |-
        会潜入人或宝可梦的影子里。
        会理解所潜入者的心情，
        复制其能力。
      en: |-
        It sinks into the shadows of people and
        Pokémon, where it can understand their feelings
        and copy their capabilities.
      fr: |-
        Il se terre dans les ombres des humains
        et des Pokémon. Il peut lire dans l’esprit
        de ses hôtes et copier leurs habilités.
      de: |-
        Es verschmilzt mit den Schatten von Menschen
        und Pokémon, wodurch es ihre Gefühle
        verstehen und ihre Fähigkeiten kopieren kann.
      es: |-
        Se infiltra en la sombra de las personas y los
        Pokémon. Sintoniza con sus sentimientos y
        copia sus capacidades.
      it: |-
        Infiltrandosi nell’ombra di Pokémon ed esseri
        umani riesce a comprendere il loro stato d’animo
        e a copiarne le capacità.
    sword:
      ja-Hrkt: |-
        けんぽうの　たつじんの　かげに
        もぐって　うごきを　コピーしたため
        きゅうきょく　おうぎを　みにつけた。
      ja: |-
        拳法の　達人の　影に
        潜って　動きを　コピーしたため
        究極奥義を　身につけた。
      ko: |-
        권법의 달인의 그림자에 숨어들어
        움직임을 복사했기 때문에
        궁극의 오의를 익힐 수 있었다.
      zh-Hant: |-
        潛入拳法高手的影子裡
        複製對方的動作，
        最後習得了究極的奧義。
      zh-Hans: |-
        潜入拳法高手的影子里
        复制对方的动作，
        最后习得了究极的奥义。
      en: |-
        By slipping into the shadow of a martial arts
        master and copying their movements, this
        Pokémon learned the ultimate techniques.
      fr: |-
        Il s’est glissé dans l’ombre d’un maître du kung-fu.
        Il s’est aussi approprié sa botte secrète ultime
        en copiant ses mouvements.
      de: |-
        Es schlüpfte in den Schatten eines Meisters des
        Faustkampfes und imitierte dessen Bewegungen.
        So lernte es ultimative Geheimtechniken.
      es: |-
        Tras infiltrarse en la sombra de un maestro de
        artes marciales y copiar sus movimientos, es
        capaz de utilizar su técnica secreta definitiva.
      it: |-
        Si è infiltrato nell’ombra di un maestro di arti
        marziali e ne ha copiato i movimenti, carpendo
        così tutti i segreti.
    shield:
      ja-Hrkt: |-
        あらゆる　かげの　なかに　もぐりこむ
        のうりょくを　もっているため　ながい
        あいだ　だれにも　みつからなかった。
      ja: |-
        あらゆる　影の　中に　潜りこむ
        能力を　もっているため　長い
        あいだ　誰にも　見つからなかった。
      ko: |-
        모든 그림자 안에 숨어들 수 있는
        능력을 갖고 있어 오랫동안
        누구에게도 발견되지 않았다.
      zh-Hant: |-
        擁有潛入一切影子裡的能力，
        所以在很長一段時間裡
        都沒有任何人發現牠。
      zh-Hans: |-
        拥有潜入一切影子里的能力，
        所以在很长一段时间里
        都没有任何人发现它。
      en: |-
        This Pokémon can conceal itself in any shadow,
        so it went undiscovered for a long time.
      fr: |-
        Ce Pokémon ayant la capacité de se dissimuler
        dans les ombres, il est resté très longtemps
        caché aux yeux du monde.
      de: |-
        Da es in der Lage ist, mit jedem Schatten zu
        verschmelzen, ist es lange Zeit unentdeckt
        geblieben.
      es: |-
        Posee la extraordinaria capacidad de infiltrarse
        en cualquier sombra, por lo que nadie lo había
        visto en mucho tiempo.
      it: |-
        A causa della sua capacità di infiltrarsi in
        qualunque ombra, per lungo tempo nessuno è
        riuscito ad avvistarlo.
