    x:
      ja-Hrkt: |-
        １おくねん　まえから　すがたが
        かわらない　ポケモン。しんかいを
        ちょうさちゅうに　はっけんされた。
      ja: |-
        １億年前から
        姿が　変わらない　ポケモン。
        深海を　調査中に　発見された。
      ko: |-
        1억 년 전부터 모습이
        바뀌지 않은 포켓몬이다. 심해를
        조사하던 중 발견되었다.
      en: |-
        It has remained unchanged for 100 million years.
        It was discovered during a deep-sea exploration.
      fr: |-
        Relicanth n’a connu aucune évolution depuis 100
        millions d’années. Il a été découvert pendant une
        exploration dans les profondeurs de la mer.
      de: |-
        100 Millionen Jahre lang blieb es unverändert.
        Es wurde bei einer Tiefsee-Tauchexpedition entdeckt.
      es: |-
        No ha sufrido ningún cambio desde hace 100 millones
        de años. Fue descubierto durante una expedición
        marina.
      it: |-
        Immutato da 100 milioni di anni, è stato scoperto
        durante un’esplorazione nelle profondità marine.
    'y':
      ja-Hrkt: |-
        しんかいちょうさで　はっけんされた
        めずらしい　ポケモン。１おくねんの
        あいだ　すがたが　かわっていない。
      ja: |-
        深海調査で　発見された
        珍しい　ポケモン。１億年の　あいだ
        姿が　変わっていない。
      ko: |-
        심해 조사에서 발견된
        희귀한 포켓몬이다. 1억 년
        동안 모습이 바뀌지 않았다.
      en: |-
        A rare Pokémon discovered during a deep-sea
        exploration. It has not changed in over
        100 million years.
      fr: |-
        Un Pokémon rare aperçu lors d’une exploration
        sous-marine. Il n’a pas évolué depuis 100 millions
        d’années.
      de: |-
        Tiefseeforscher fanden dieses seltene Pokémon,
        das sich in 100 Millionen Jahren nicht verändert hat.
      es: |-
        Un Pokémon raro descubierto en una exploración
        marina. No ha cambiado en más de 100 millones de
        años.
      it: |-
        Un Pokémon raro scoperto durante un’esplorazione
        del mare profondo. È immutato da 100 milioni di anni.
    omega-ruby:
      ja-Hrkt: |-
        １おくねんの　ながい　あいだ　まったく　すがたが
        かわらずに　しんかいで　くらしていた　ポケモン。
        はの　ない　くちで　びせいぶつだけを　たべる。
      ja: |-
        １億年の　長い　間　まったく　姿が
        変わらずに　深海で　暮らしていた　ポケモン。
        歯の　ない　口で　微生物だけを　食べる。
      ko: |-
        1억 년이란 긴 세월 동안 전혀 모습이
        바뀌지 않고 심해에서 살고 있던 포켓몬이다.
        이빨이 없는 입으로 미생물만을 먹는다.
      en: |-
        Relicanth is a Pokémon species that existed for a hundred
        million years without ever changing its form. This ancient
        Pokémon feeds on microscopic organisms with its
        toothless mouth.
      fr: |-
        Les Relicanth sont une espèce de Pokémon qui a existé
        pendant 100 millions d’années sans jamais changer de forme.
        Ce Pokémon antique se nourrit d’organismes microscopiques
        avec sa bouche édentée.
      de: |-
        Relicanth ist eine Pokémon-Art, die seit 100 Millionen Jahren
        existiert, ohne jemals ihre Form zu verändern. Dieses
        prähistorische Pokémon hat ein zahnloses Maul und ernährt
        sich von Mikroorganismen.
      es: |-
        Relicanth pertenece a una especie de Pokémon que lleva
        millones de años sin cambiar de forma. Este ancestral
        Pokémon se alimenta de microorganismos por la boca
        desdentada que tiene.
      it: |-
        Relicanth è una specie esistente da 100 milioni di anni senza
        alcuna mutazione di forma. Questo antichissimo Pokémon
        si nutre di microrganismi, come prova la sua bocca sdentata.
    alpha-sapphire:
      ja-Hrkt: |-
        しんかい　ちょうさで　はっけんされた　ちんしゅ。
        ごつごつした　いわの　ような　うろこで　おおわれ
        かいていの　すいあつに　たえる　からだを　もつ。
      ja: |-
        深海　調査で　発見された　珍種。
        ごつごつした　岩の　ような　うろこで　覆われ
        海底の　水圧に　耐える　体を　持つ。
      ko: |-
        심해 조사로 발견된 희귀종이다.
        울퉁불퉁한 바위 같은 비늘에 덮여
        해저의 수압을 견뎌내는 몸을 지녔다.
      en: |-
        Relicanth is a rare species that was discovered in deep-sea
        explorations. This Pokémon’s body withstands the enormous
        water pressure of the ocean depths. Its body is covered in
        tough scales that are like craggy rocks.
      fr: |-
        Relicanth est une espèce rare découverte pendant des
        explorations sous-marines. Son corps peut supporter
        l’énorme pression des profondeurs océaniques. Il est
        recouvert d’écailles semblables à des pierres.
      de: |-
        Relicanth ist eine seltene Art, die auf einer
        Tiefsee-Expedition entdeckt wurde. Dieses Pokémon
        hält dem enormen Wasserdruck des Ozeans stand.
        Sein Körper ist mit steinharten Schuppen bedeckt.
      es: |-
        Relicanth pertenece a una rara especie descubierta al explorar
        el fondo marino. Es grande y está cubierto de toscas y duras
        escamas, con las que puede soportar la presión del fondo
        oceánico.
      it: |-
        Relicanth è una specie rara scoperta durante le esplorazioni
        nelle profondità marine. Il suo corpo riesce a resistere
        all’incredibile pressione degli abissi oceanici ed è ricoperto
        di squame dure come roccia viva.
    sun:
      ja-Hrkt: |-
        １おくねんまえから　おなじ　すがた。
        たいないが　あぶらまみれ　なので
        しんかいの　すいあつに　たえられる。
      ja: |-
        約１億年前から　同じ　姿。
        体内が　脂まみれ　なので
        深海の　水圧に　耐えられる。
      ko: |-
        1억 년 전부터 같은 모습이다.
        체내가 기름투성이라서
        심해의 수압을 견딜 수 있다.
      zh-Hant: |-
        從１億年前就長這個樣子。
        因為體內積存著厚厚的脂肪，
        所以能承受深海的水壓。
      zh-Hans: |-
        从１亿年前起就是相同的样子。
        因为体内富含脂肪，
        所以可以承受深海的水压。
      en: |-
        Its form has remained the same for one hundred
        million years. Its body is filled with fat, so it can
        withstand the water pressure of the deep sea.
      fr: |-
        Il n’a pas changé d’apparence en 100 millions
        d’années. La densité de sa couche graisseuse
        l’aide à supporter la pression des grands fonds.
      de: |-
        Relicanth existiert seit 100 Millionen Jahren in
        unveränderter Form. Dank seines Körperfetts
        hält es dem Wasserdruck der Tiefsee stand.
      es: |-
        No ha cambiado de aspecto en 100 millones de
        años. Su gruesa capa de grasa le permite
        soportar la presión abisal.
      it: |-
        Il suo aspetto è immutato da 100 milioni di anni.
        Resiste all’enorme pressione degli abissi marini
        grazie a uno spesso strato di grasso corporeo.
    moon:
      ja-Hrkt: |-
        しんかいちょうさちゅう　ぐうぜんに
        はっけん　された。　はが　たいかし
        すうようにして　びせいぶつを　とる。
      ja: |-
        深海調査中　偶然に
        発見　された。　歯が　退化し
        吸うようにして　微生物を　取る。
      ko: |-
        심해 조사 중 우연히
        발견되었다. 이빨이 퇴화하여
        빨아들이듯 미생물을 먹는다.
      zh-Hant: |-
        在深海調查中偶然被發現。
        牙齒退化，只能用吸食的方式
        攝取微生物。
      zh-Hans: |-
        在深海调查中被偶然发现。
        牙齿退化，靠吸食来摄取微生物。
      en: |-
        It was fortuitously discovered during a deep sea
        expedition. Its teeth have atrophied, so it now
        survives on microscopic organisms it sucks up.
      fr: |-
        Il a été découvert complètement par hasard au
        fin fond de l’océan. Sa dentition déplorable le
        contraint à se nourrir de micro-organismes.
      de: |-
        Es wurde zufällig auf einer Tiefsee-Expedition
        entdeckt. Es ernährt sich von Mikroorganismen,
        die es mit seinem zahnlosen Maul einsaugt.
      es: |-
        Fue descubierto de forma accidental durante
        unas exploraciones marinas. No tiene dientes,
        por lo que se alimenta de microorganismos.
      it: |-
        È stato scoperto per caso nelle profondità
        marine durante una perlustrazione. Sprovvisto
        di denti, si nutre risucchiando microrganismi.
    ultra-sun:
      ja-Hrkt: |-
        ぜつめつしたと　かんがえられていた。
        ジーランスの　なは　はっけんしゃの
        なまえを　もじって　つけられた。
      ja: |-
        絶滅したと　考えられていた。
        ジーランスの　名は　発見者の
        名前を　もじって　つけられた。
      ko: |-
        멸종되었고 여겨져 왔다.
        시라칸의 이름은 발견한
        사람의 이름을 따서 만들어졌다.
      zh-Hant: |-
        曾被認為已經絕種。
        古空棘魚名字的由來
        是取自發現者的名字。
      zh-Hans: |-
        曾被认为已经灭绝。
        古空棘鱼的名字是
        模仿发现者的名字而起的。
      en: |-
        Thought to have gone extinct, Relicanth was
        given a name that is a variation of the name of
        the person who discovered it.
      fr: |-
        On a longtemps cru son espèce disparue.
        Son nom serait une déformation du patronyme
        de la personne qui l’a découvert.
      de: |-
        Es galt als ausgestorben. Der Name Relicanth
        ist eine Abwandlung des Namens seines
        Entdeckers.
      es: |-
        Se creía que esta especie se había extinguido.
        Le pusieron su nombre, Relicanth, en honor a
        su descubridor.
      it: |-
        Un tempo si credeva che si fosse estinto.
        Prende il nome dalla persona che lo ha
        scoperto.
    ultra-moon:
      ja-Hrkt: |-
        １おくねんかん　まったく　すがたが
        かわっていないのは　せいめい　として
        かんせい　されているから　らしい。
      ja: |-
        １億年間　まったく　姿が
        変わっていないのは　生命　として
        完成　されているから　らしい。
      ko: |-
        1억년 동안 전혀 모습이
        바뀌지 않은 것은 생명체로서
        완성되었기 때문이라고 한다.
      zh-Hant: |-
        之所以在１億年之間完全沒有
        外觀上的變化，似乎是因為牠的
        生命形式已經達到了完美境界。
      zh-Hans: |-
        好像作为生命已是完成状态，
        所以在１亿年间，
        样子完全没有变化。
      en: |-
        The reason it hasn’t changed at all in a hundred
        million years is that it’s apparently already a
        perfect life-form.
      fr: |-
        On raconte que s’il n’a pas changé d’apparence
        en 100 millions d’années, c’est parce qu’il
        a atteint le stade de forme de vie parfaite.
      de: |-
        Seine seit 100 Millionen Jahren unveränderte
        Gestalt wird als Zeichen dafür gesehen, dass
        es eine vollendete Lebensform ist.
      es: |-
        La razón por la que su aspecto no ha cambiado
        un ápice durante 100 millones de años se debe,
        al parecer, a que es una forma de vida perfecta.
      it: |-
        La sua forma è immutata da 100 milioni di anni
        e ciò sembra indicare che abbia raggiunto
        la perfezione.
    sword:
      ja-Hrkt: |-
        いわのように　かたい　ウロコと
        あぶらの　つまった　うきぶくろで
        しんかいの　すいあつに　たえる。
      ja: |-
        岩のように　硬い　ウロコと
        脂の　詰まった　浮袋で
        深海の　水圧に　耐える。
      ko: |-
        바위처럼 단단한 비늘과
        기름으로 가득 찬 부레로
        심해의 수압을 견딘다.
      zh-Hant: |-
        如岩石般堅硬的鱗片
        以及裝滿了油脂的鰾囊，
        讓牠能承受深海的水壓。
      zh-Hans: |-
        如岩石般坚硬的鳞片
        和富含脂肪的浮囊使它
        能够耐得住深海的水压。
      en: |-
        Rock-hard scales and oil-filled swim bladders
        allow this Pokémon to survive the intense water
        pressure of the deep sea.
      fr: |-
        Il peut supporter la pression des profondeurs
        grâce à ses écailles aussi solides que le roc et
        à ses vessies natatoires remplies de graisse.
      de: |-
        Dank seiner steinharten Schuppen und mit
        Fett gefüllten Schwimmblasen kann es dem
        Wasserdruck der Tiefsee standhalten.
      es: |-
        Es capaz de soportar la alta presión del fondo
        marino gracias a sus escamas, duras como rocas,
        y a sus vejigas natatorias llenas de grasa.
      it: |-
        Riesce a sopportare la pressione degli abissi
        marini grazie alle sue scaglie dure come la roccia
        e alle vesciche natatorie piene di grasso.
    shield:
      ja-Hrkt: |-
        しんかいちょうさで　はっけんされた。
        １おくねんかん　すがたが　かわらず
        いきているかせき　と　よばれている。
      ja: |-
        深海調査で　発見された。
        １億年間　姿が　変わらず
        生きている化石　と　呼ばれている。
      ko: |-
        심해 조사를 통해 발견되었다.
        1억 년 동안 모습이 변하지 않아
        살아 있는 화석이라고 불린다.
      zh-Hant: |-
        在深海調查中被發現的寶可夢。
        樣子在１億年之間都沒有變化，
        被人們稱為活化石。
      zh-Hans: |-
        在深海调查中被发现的宝可梦。
        样子在１亿年间都没有任何变化，
        被人们称为活化石。
      en: |-
        This Pokémon was discovered during deep-sea
        exploration. Its appearance hasn’t changed in
        100,000,000 years, so it’s called a living fossil.
      fr: |-
        Découvert lors d’une expédition dans les abysses,
        son apparence inchangée depuis 100 millions
        d’années lui a valu le surnom de « fossile vivant ».
      de: |-
        Es wurde auf einer Tiefsee-Expedition entdeckt.
        Man nennt es ein „lebendes Fossil“, da es sich
        seit 100 Millionen Jahren nicht verändert hat.
      es: |-
        Fue descubierto durante una expedición marina.
        Se lo considera un fósil viviente, pues no ha
        cambiado en cien millones de años.
      it: |-
        Scoperto durante una perlustrazione degli abissi
        marini, viene chiamato “fossile vivente” per via
        del suo aspetto, immutato da 100 milioni di anni.
