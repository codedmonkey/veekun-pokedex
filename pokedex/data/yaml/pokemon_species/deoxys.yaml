  flavor_text:
    ruby:
      en: |-
        The DNA of a space virus underwent a
        sudden mutation upon exposure to a
        laser beam and resulted in DEOXYS.The crystalline organ on this POKéMON’s
        chest appears to be its brain.
    sapphire:
      en: |-
        DEOXYS emerged from a virus that came
        from space. It is highly intelligent and
        wields psychokinetic powers.This POKéMON shoots lasers from the
        crystalline organ on its chest.
    emerald:
      en: |-
        A POKéMON that mutated from an
        extraterrestrial virus exposed to a laser
        beam. Its body is configured for superior
        agility and speed.
    firered:
      en: |-
        This DEOXYS has transformed into its
        aggressive guise. It can fool enemies by
        altering its appearance.
    leafgreen:
      en: |-
        When it changes form, an aurora appears.
        It absorbs attacks by altering its
        cellular structure.
    diamond:
      en: |-
        An alien virus that fell to earth
        on a meteor underwent a DNA
        mutation to become this Pokémon.
    pearl:
      en: |-
        An alien virus that fell to earth
        on a meteor underwent a DNA
        mutation to become this Pokémon.
    platinum:
      en: |-
        An alien virus that fell to earth
        on a meteor underwent a DNA
        mutation to become this Pokémon.
    heartgold:
      en: |-
        DNA from a space virus mutated and
        became a Pokémon. It appears
        where auroras are seen.
    soulsilver:
      en: |-
        DNA from a space virus mutated and
        became a Pokémon. It appears
        where auroras are seen.
    black:
      en: |-
        An alien virus that fell to earth
        on a meteor underwent a DNA
        mutation to become this Pokémon.
      fr: |-
        Il vient d’un virus extraterrestre
        arrivé avec une météorite et ayant
        subi une mutation génétique.
    white:
      en: |-
        An alien virus that fell to earth
        on a meteor underwent a DNA
        mutation to become this Pokémon.
      fr: |-
        Il vient d’un virus extraterrestre
        arrivé avec une météorite et ayant
        subi une mutation génétique.
    black-2:
      en: |-
        An alien virus that fell to earth
        on a meteor underwent a DNA
        mutation to become this Pokémon.
    white-2:
      en: |-
        An alien virus that fell to earth
        on a meteor underwent a DNA
        mutation to become this Pokémon.
    x:
      ja-Hrkt: |-
        いんせきに　ふちゃくしていた
        うちゅうウイルスの　ＤＮＡが
        へんいして　うまれた　ポケモン。
      ja: |-
        隕石に　付着していた
        宇宙ウイルスの　ＤＮＡが
        変異して　生まれた　ポケモン。
      ko: |-
        운석에 붙어 있던
        우주 바이러스의 DNA가
        변이하여 생겨난 포켓몬이다.
      en: |-
        An alien virus that fell to earth on a meteor
        underwent a DNA mutation to become
        this Pokémon.
      fr: |-
        Il vient d’un virus extraterrestre arrivé avec une
        météorite et ayant subi une mutation génétique.
      de: |-
        Ein außerirdischer Virus kam mit einem Meteor auf
        die Erde. Seine DNA mutierte. So entstand Deoxys.
      es: |-
        Surgió a raíz de la mutación de ADN de un virus
        alienígena que cayó a la Tierra en un meteorito.
      it: |-
        È il risultato della mutazione genetica di un virus
        alieno giunto con un meteorite.
    'y':
      ja-Hrkt: |-
        うちゅうウィルスが　とつぜんへんいを
        おこして　ポケモンに　なった。
        オーロラの　ちかくに　あらわれる。
      ja: |-
        宇宙ウィルスが　突然変異を
        起こして　ポケモンに　なった。
        オーロラの　近くに　現れる。
      ko: |-
        우주 바이러스가 돌연변이를
        일으켜 포켓몬이 되었다.
        오로라 근처에 나타난다.
      en: |-
        DNA from a space virus mutated and became a
        Pokémon. It appears where auroras are seen.
      fr: |-
        C’est un virus extraterrestre qui a muté en Pokémon.
        Il apparaît à proximité des aurores boréales.
      de: |-
        Deoxys ist ein außerirdisches Virus, das zu einem
        Pokémon mutierte. Es erscheint in der Nähe von
        Auroras.
      es: |-
        Pokémon surgido a raíz de la mutación de un virus
        alienígena. Aparece cerca de la aurora.
      it: |-
        Una mutazione di virus alieni ha portato alla creazione
        di questo Pokémon. Visibile in prossimità dell’aurora.
    omega-ruby:
      ja-Hrkt: |-
        レーザーを　あびた　うちゅうウィルスの　ＤＮＡが
        とつぜんへんいを　おこして　うまれた　ポケモン。
        むねの　すいしょうたいが　のうみそ　らしい。
      ja: |-
        レーザーを　浴びた　宇宙ウィルスの　ＤＮＡが
        突然変異を　起こして　生まれた　ポケモン。
        胸の　水晶体が　脳みそ　らしい。
      ko: |-
        레이저를 쬔 우주 바이러스의 DNA가
        돌연변이를 일으켜 태어난 포켓몬이다.
        가슴의 수정체가 뇌인 것 같다.
      en: |-
        The DNA of a space virus underwent a sudden mutation upon
        exposure to a laser beam and resulted in Deoxys.
        The crystalline organ on this Pokémon’s chest appears to be
        its brain.
      fr: |-
        L’ADN d’un virus extraterrestre entama une mutation
        non attendue suite à une exposition à un rayon laser,
        ce qui créa Deoxys. L’organe cristallin se trouvant
        sur la poitrine de ce Pokémon semble être son cerveau.
      de: |-
        Die DNS eines Weltraumvirus hat eine spontane Mutation
        erfahren, da sie einem Laserstrahl ausgesetzt wurde.
        Daraus entstand Deoxys. Das kristallartige Organ auf
        der Brust dieses Pokémon ist sein Gehirn.
      es: |-
        Tras estar expuesto a un rayo láser, el ADN de un virus
        espacial sufrió una mutación y dio origen a Deoxys. Según
        parece, el órgano cristalino que este Pokémon tiene en el
        torso es el cerebro.
      it: |-
        Il DNA di un virus spaziale ha subito un’improvvisa mutazione,
        in seguito all’esposizione a un raggio laser. Questo ha
        dato vita a Deoxys. Pare che l’organo cristallino sul suo petto
        costituisca il cervello.
    alpha-sapphire:
      ja-Hrkt: |-
        うちゅうウィルスから　たんじょうした　ポケモン。
        ちのうが　たかく　ちょうのうりょくを　あやつる。
        むねの　すいしょうたいから　レーザーを　だす。
      ja: |-
        宇宙ウィルスから　誕生した　ポケモン。
        知能が　高く　超能力を　操る。
        胸の　水晶体から　レーザーを　出す。
      ko: |-
        우주 바이러스에서 태어난 포켓몬이다.
        지능이 높고 초능력을 쓸 수 있다.
        가슴의 수정체에서 레이저를 쏜다.
      en: |-
        Deoxys emerged from a virus that came from space. It is highly
        intelligent and wields psychokinetic powers. This Pokémon
        shoots lasers from the crystalline organ on its chest.
      fr: |-
        Deoxys était à l’origine un virus provenant de l’espace. Il est
        extrêmement intelligent et dispose de pouvoirs télékinétiques.
        Ce Pokémon envoie des lasers avec l’organe cristallin situé
        sur sa poitrine.
      de: |-
        Deoxys ging aus einem Virus aus dem Weltraum hervor.
        Es ist sehr intelligent und nutzt psychokinetische Energie.
        Dieses Pokémon verschießt Laserstrahlen aus einem
        kristallartigen Organ auf seinem Brustkorb.
      es: |-
        Deoxys surgió a partir de un virus espacial. Tiene un alto nivel
        intelectual y poderes psicoquinéticos. Este Pokémon dispara
        rayos láser por el órgano cristalino que tiene en el torso.
      it: |-
        Deoxys è nato da un virus proveniente dallo spazio. È dotato
        di estrema intelligenza e di poteri psicocinetici. Spara raggi
        laser dall’organo cristallino del proprio corpo.
  form_description:
    en: |-
      Forms have different stats and can learn different moves.  Moves are retained through form changes.

      In Generation III, Deoxys's form depends on the game: Normal Forme in Ruby and Sapphire, Attack Forme in FireRed, Defense Forme in LeafGreen, and Speed Forme in Emerald.  In subsequent games, every form exists.  Meteorites for switching Deoxys's form can be found in the following locations, depending on the game:

      * Diamond, Pearl, and Platinum: In the southwest corner of []{location:veilstone-city}.
      * HeartGold and SoulSilver: At the west end of []{location:kanto-route-3}, near []{location:pewter-city}.
      * Black and White 1 & 2: In the museum in []{location:nacrene-city}, there is a single meteorite on display which cycles between all forms.
