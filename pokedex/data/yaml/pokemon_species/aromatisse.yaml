aromatisse:
  base_happiness: 50
  capture_rate: 140
  color: pink
  egg_groups:
    - fairy
  evolution_chain: spritzee
  evolves_from: spritzee
  flavor_text:
    x:
      ja-Hrkt: |-
        さまざまな　においを　つくりだす。
        あいての　いやがる　においを　だして
        たたかいを　ゆうりに　すすめるのだ。
      ja: |-
        さまざまな　においを　作り出す。
        相手の　嫌がる　においを　出して
        戦いを　有利に　進めるのだ。
      ko: |-
        여러 가지 향기를 만들어 낸다.
        상대가 싫어하는 냄새를 내보내
        싸움을 유리하게 이끌어 나간다.
      en: |-
        It devises various scents, pleasant and unpleasant,
        and emits scents that its enemies dislike in order
        to gain an edge in battle.
      fr: |-
        Ce Pokémon est capable d’émettre toutes sortes
        d’odeurs pour incommoder son adversaire et
        augmenter ses chances de gagner.
      de: |-
        Es produziert verschiedene Düfte. Im Kampf verschafft
        es sich einen Vorteil, indem es einen Duft verströmt,
        der dem Gegner zuwider ist.
      es: |-
        Puede producir multitud de olores diferentes y, en
        combate, secreta los que le resultan molestos al
        enemigo para así contar con cierta ventaja.
      it: |-
        È in grado di emanare profumi di diversi tipi. Durante
        la lotta, mette in difficoltà i nemici emettendo odori
        sgradevoli.
    'y':
      ja-Hrkt: |-
        においが　つよすぎるため
        よほど　すきな　トレーナーでなければ
        つれて　あるくのは　キツイのだ。
      ja: |-
        においが　強すぎるため
        よほど　好きな　トレーナーでなければ
        連れて　歩くのは　キツイのだ。
      ko: |-
        향기가 지나치게 강하기 때문에
        어지간히 좋아하는 트레이너가 아니면
        데리고 다니기 힘들다.
      en: |-
        Its scent is so overpowering that, unless a Trainer
        happens to really enjoy the smell, he or she will
        have a hard time walking alongside it.
      fr: |-
        Son parfum est tellement capiteux qu’un Dresseur
        n’appréciant pas pleinement son odeur aura toutes
        les difficultés du monde à cheminer à ses côtés.
      de: |-
        Sein Duft ist so stark, dass es für einen Trainer,
        der seinen Duft nicht mag, schwer ist, es an
        seiner Seite zu haben.
      es: |-
        La fragancia que despide es tan potente que solo
        podría caminar a su lado un Entrenador que tenga
        especial predilección por ese aroma.
      it: |-
        Emette un profumo intensissimo. Se un Allenatore non
        è un assoluto estimatore di quel particolare aroma,
        avrà grosse difficoltà anche solo a stargli vicino.
    omega-ruby:
      ja-Hrkt: |-
        さまざまな　においを　つくりだす。
        あいての　いやがる　においを　だして
        たたかいを　ゆうりに　すすめるのだ。
      ja: |-
        さまざまな　においを　作り出す。
        相手の　嫌がる　においを　出して
        戦いを　有利に　進めるのだ。
      ko: |-
        여러 가지 향기를 만들어 낸다.
        상대가 싫어하는 냄새를 내보내
        싸움을 유리하게 이끌어 나간다.
      en: |-
        It devises various scents, pleasant and unpleasant,
        and emits scents that its enemies dislike in order
        to gain an edge in battle.
      fr: |-
        Ce Pokémon est capable d’émettre toutes sortes d’odeurs
        pour incommoder son adversaire et augmenter ses chances
        de gagner.
      de: |-
        Es produziert verschiedene Düfte. Im Kampf verschafft es sich
        einen Vorteil, indem es einen Duft verströmt, der dem Gegner
        zuwider ist.
      es: |-
        Puede producir multitud de olores diferentes y, en combate,
        secreta los que le resultan molestos al enemigo para así
        contar con cierta ventaja.
      it: |-
        È in grado di emanare profumi di diversi tipi. Durante la lotta,
        mette in difficoltà i nemici emettendo odori sgradevoli.
    alpha-sapphire:
      ja-Hrkt: |-
        においが　つよすぎるため
        よほど　すきな　トレーナーでなければ
        つれて　あるくのは　キツイのだ。
      ja: |-
        においが　強すぎるため
        よほど　好きな　トレーナーでなければ
        連れて　歩くのは　キツイのだ。
      ko: |-
        향기가 지나치게 강하기 때문에
        어지간히 좋아하는 트레이너가 아니면
        데리고 다니기 힘들다.
      en: |-
        Its scent is so overpowering that, unless a Trainer
        happens to really enjoy the smell, he or she will
        have a hard time walking alongside it.
      fr: |-
        Son parfum est tellement capiteux qu’un Dresseur n’appréciant
        pas pleinement son odeur aura toutes les difficultés du monde
        à cheminer à ses côtés.
      de: |-
        Sein Duft ist so stark, dass es für einen Trainer, der seinen
        Duft nicht mag, schwer ist, es an seiner Seite zu haben.
      es: |-
        La fragancia que despide es tan potente que solo podría
        caminar a su lado un Entrenador que tenga especial
        predilección por ese aroma.
      it: |-
        Emette un profumo intensissimo. Se un Allenatore non è un
        assoluto estimatore di quel particolare aroma, avrà grosse
        difficoltà anche solo a stargli vicino.
    sword:
      ja-Hrkt: |-
        たいもうから　きょうれつな　においを
        いつも　だしているため　パートナーは
        はなが　きかなくなってしまうのだ。
      ja: |-
        体毛から　強烈な　においを
        いつも　出しているため　パートナーは
        鼻が　利かなくなってしまうのだ。
      ko: |-
        털에서 항상 강렬한 향기를
        내보내기 때문에 파트너는
        후각이 둔해지게 된다.
      zh-Hant: |-
        由於牠會不斷從體毛裡
        散發出強烈的香氣，
        導致夥伴訓練家的嗅覺失靈。
      zh-Hans: |-
        由于它会不断从体毛里
        散发出强烈的香气，
        导致伙伴训练家的嗅觉失灵。
      en: |-
        The scent that constantly emits from its fur is so
        powerful that this Pokémon’s companions will
        eventually lose their sense of smell.
      fr: |-
        Un parfum capiteux émane constamment
        de sa fourrure. Ce parfum est si fort qu’il peut
        priver son Dresseur d’odorat.
      de: |-
        Von seinem Fell strömt ein derart intensiver
        Geruch aus, dass die Nase seines Trainers
        irgendwann unweigerlich den Geist aufgibt.
      es: |-
        La fragancia que despide su pelaje es tan
        potente que puede dejar sin olfato a su
        Entrenador.
      it: |-
        Il suo pelo emette un profumo così intenso
        da compromettere irrimediabilmente l’olfatto
        del suo Allenatore.
    shield:
      ja-Hrkt: |-
        てきの　たたかう　きもちを　なくす
        あくしゅうや　みかたを　たすける
        かぐわしい　かおりを　つくりだす。
      ja: |-
        敵の　戦う　気持ちを　なくす
        悪臭や　味方を　助ける
        香しい　香りを　つくりだす。
      ko: |-
        상대의 전의를 상실시키는
        악취와 같은 편을 돕는
        황홀한 향기를 만들어 낸다.
      zh-Hant: |-
        會發出惡臭讓敵人喪失戰意，
        或者發出芳香的味道
        來幫助自己的夥伴。
      zh-Hans: |-
        会发出恶臭让敌人丧失战意，
        或者发出芳香的味道
        来帮助自己的伙伴。
      en: |-
        The scents Aromatisse can produce range from
        sweet smells that bolster allies to foul smells
        that sap an opponent’s will to fight.
      fr: |-
        Il peut émettre une puanteur si infâme qu’elle
        prive ses ennemis de leur combativité, ou un
        parfum si réconfortant qu’il encourage ses alliés.
      de: |-
        Es kann üblen Gestank verströmen, der seinen
        Gegnern den Kampfeswillen raubt, oder wohlige
        Düfte erzeugen, die seinen Mitstreitern helfen.
      es: |-
        Puede emanar tanto un olor desagradable para
        desmotivar al rival como un dulce aroma para
        reconfortar a los aliados en combate.
      it: |-
        Può produrre un tanfo così tremendo da far
        passare ai nemici la voglia di lottare, e un
        profumo così buono da incoraggiare gli alleati.
