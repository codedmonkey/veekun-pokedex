  flavor_text:
    sword:
      ja-Hrkt: |-
        とても　さむい　ばしょから　ながれ
        ながされ　やってきた。　こおりで
        かおを　つねに　ひやして　いるのだ。
      ja: |-
        とても　寒い　場所から　流れ
        流されて　やってきた。　氷で
        顔を　つねに　冷やして　いるのだ。
      ko: |-
        매우 추운 곳에서 흘러 흘러
        떠내려왔다. 항상 얼음으로
        얼굴을 식히고 있다.
      zh-Hant: |-
        從非常寒冷的地方漂流
        而來。隨時都用冰塊
        冰鎮著自己的臉。
      zh-Hans: |-
        从非常寒冷的地方漂流
        而来。随时都用冰块
        冰镇着自己的脸。
      en: |-
        It drifted in on the flow of ocean waters from a
        frigid place. It keeps its head iced constantly to
        make sure it stays nice and cold.
      fr: |-
        Originaire d’une contrée polaire, ce Pokémon
        a débarqué dans la région ballotté par les flots.
        Il garde toujours la tête froide.
      de: |-
        Es kam von einem extrem kalten Ort, indem es
        sich treiben ließ und schließlich angespült wurde.
        Es kühlt unablässig sein Gesicht mit Eis.
      es: |-
        La corriente lo ha transportado hasta aquí desde
        un lugar sumamente gélido. Utiliza el hielo para
        mantener la cara refrigerada en todo momento.
      it: |-
        È arrivato da un luogo freddissimo trasportato
        dalla corrente. Mantiene sempre fredda la
        testa servendosi del ghiaccio.
    shield:
      ja-Hrkt: |-
        あつさに　よわい　かおを　いつも
        こおりで　ひやしている。　あたまの
        けを　うみに　たらして　エサをつる。
      ja: |-
        暑さに　弱い　顔を　いつも
        氷で　冷やしている。　頭の
        毛を　海に　たらして　餌を釣る。
      ko: |-
        더위에 약해서 얼굴을 언제나
        얼음으로 식히고 있다. 머리의 털을
        바다에 늘어뜨리고 먹이를 낚는다.
      zh-Hant: |-
        無論何時都用冰塊冰鎮著
        自己怕熱的臉。會把頭頂
        上的毛垂到海裡釣食物吃。
      zh-Hans: |-
        无论何时都用冰块冰镇着
        自己怕热的脸。会把头顶
        上的毛垂到海里钓食物吃。
      en: |-
        This Pokémon keeps its heat-sensitive head cool
        with ice. It fishes for its food, dangling its single
        hair into the sea to lure in prey.
      fr: |-
        Ne supportant pas la chaleur, il se rafraîchit
        toujours la tête avec de la glace.
        Il pêche de quoi se nourrir à l’aide de son cheveu.
      de: |-
        Es kühlt sein Gesicht ständig mit Eis, da dieses
        Hitze nicht gut verträgt. Das Haar auf dem Kopf
        hängt es ins Meer und angelt sich damit Beute.
      es: |-
        Se enfría constantemente la cara con hielo por
        su escasa resistencia al calor. Utiliza el pelo de
        la cabeza para pescar en el mar.
      it: |-
        Raffredda costantemente la testa con del
        ghiaccio perché non sopporta il caldo. Usa il
        pelo che ha sul capo per pescare le sue prede.
