swalot:
  base_happiness: 70
  capture_rate: 75
  color: purple
  egg_groups:
    - indeterminate
  evolution_chain: gulpin
  evolves_from: gulpin
  flavor_text:
    ruby:
      en: |-
        When SWALOT spots prey, it spurts out
        a hideously toxic fluid from its pores
        and sprays the target.Once the prey has weakened, this
        POKéMON gulps it down whole with its
        cavernous mouth.
    sapphire:
      en: |-
        SWALOT has no teeth, so what it
        eats, it swallows whole, no matter what.
        Its cavernous mouth yawns widely.An automobile tire could easily fit
        inside this POKéMON’s mouth.
    emerald:
      en: |-
        Its powerful stomach acid is capable of
        digesting almost anything. The one thing
        in the whole world a SWALOT can’t digest is
        its own stomach.
    firered:
      en: |-
        It can swallow a tire whole in one gulp.
        It secretes a horribly toxic fluid from
        the pores on its body.
    leafgreen:
      en: |-
        It can swallow a tire whole in one gulp.
        It secretes a horribly toxic fluid from
        the pores on its body.
    diamond:
      en: |-
        It swallows anything whole.
        It sweats toxic fluids from its
        follicles to douse foes.
    pearl:
      en: |-
        It swallows anything whole.
        It sweats toxic fluids from its
        follicles to douse foes.
    platinum:
      en: |-
        It swallows anything whole.
        It sweats toxic fluids from its
        follicles to douse foes.
    heartgold:
      en: |-
        It gulps anything that fits in its
        mouth. Its special enzymes can
        dissolve anything.
    soulsilver:
      en: |-
        It gulps anything that fits in its
        mouth. Its special enzymes can
        dissolve anything.
    black:
      en: |-
        It swallows anything whole.
        It sweats toxic fluids from its
        follicles to douse foes.
      fr: |-
        Il avale tout en une bouchée. Ses
        follicules sécrètent des fluides
        toxiques qui endorment l’ennemi.
    white:
      en: |-
        It swallows anything whole.
        It sweats toxic fluids from its
        follicles to douse foes.
      fr: |-
        Il avale tout en une bouchée. Ses
        follicules sécrètent des fluides
        toxiques qui endorment l’ennemi.
    black-2:
      en: |-
        It swallows anything whole.
        It sweats toxic fluids from its
        follicles to douse foes.
    white-2:
      en: |-
        It swallows anything whole.
        It sweats toxic fluids from its
        follicles to douse foes.
    x:
      ja-Hrkt: |-
        なんでも　まるのみしてしまう。
        けあなから　もうどくの　たいえきを
        ぶんぴつして　てきに　あびせかける。
      ja: |-
        なんでも　まるのみしてしまう。
        毛穴から　猛毒の　体液を
        分泌して　敵に　浴びせかける。
      ko: |-
        무엇이든 통째로 삼켜 버린다.
        모공에서 맹독의 체액을
        분비하여 상대에게 끼얹는다.
      en: |-
        It swallows anything whole. It sweats toxic fluids
        from its follicles to douse foes.
      fr: |-
        Il avale tout en une bouchée. Ses follicules sécrètent
        des fluides toxiques qui endorment l’ennemi.
      de: |-
        Es verschluckt alles in einem Stück und sondert
        giftige Stoffe ab, mit denen es Gegner besprüht.
      es: |-
        Se traga cualquier cosa de una pieza. Sus poros
        segregan fluidos tóxicos que dañan a sus enemigos.
      it: |-
        Inghiotte intera qualsiasi cosa. Dai pori traspira
        un liquido tossico con cui bagna i nemici.
    'y':
      ja-Hrkt: |-
        くちに　はいる　おおきさの　ものなら
        なんでも　まるのみ。とくしゅな
        いえきで　なんでも　しょうかする。
      ja: |-
        口に　入る　大きさの　ものなら
        なんでも　まる飲み。特殊な
        胃液で　なんでも　消化する。
      ko: |-
        입에 들어가는 크기의 것이라면
        무엇이든 통째로 삼킨다. 특수한
        위액으로 무엇이든 소화한다.
      en: |-
        It gulps anything that fits in its mouth. Its special
        enzymes can dissolve anything.
      fr: |-
        Il avale tout en une bouchée. Ses sucs digestifs
        peuvent digérer n’importe quoi.
      de: |-
        Es verschluckt, was in sein Maul passt, und verdaut es
        mit seiner alles zersetzenden Magensäure.
      es: |-
        Se traga todo lo que le quepa en su enorme boca.
        Sus jugos gástricos pueden digerir cualquier cosa.
      it: |-
        Inghiotte qualunque cosa che possa infilarsi in
        bocca. Digerisce tutto con succhi gastrici speciali.
    omega-ruby:
      ja-Hrkt: |-
        えものを　みつけると　けあなから　もうどくの
        たいえきを　ふきだして　あびせかけるぞ。
        よわった　ところを　おおきな　くちで　ペロリ。
      ja: |-
        獲物を　見つけると　毛穴から　猛毒の
        体液を　吹き出して　浴びせかけるぞ。
        弱った　ところを　大きな　口で　ペロリ。
      ko: |-
        먹이를 발견하면 모공에서 맹독의
        체액을 뿜어내어 끼얹는다.
        약해지면 커다란 입으로 한입에 먹는다.
      en: |-
        When Swalot spots prey, it spurts out a hideously toxic fluid
        from its pores and sprays the target. Once the prey has
        weakened, this Pokémon gulps it down whole with its
        cavernous mouth.
      fr: |-
        Lorsqu’Avaltout repère une proie, il libère une substance
        terriblement toxique de ses pores et en enduit son ennemi
        pour l’affaiblir. Ce Pokémon peut ensuite l’avaler d’un coup
        dans sa gigantesque bouche.
      de: |-
        Wenn Schlukwech Beute sichtet, verspritzt es eine höchst
        giftige Substanz aus seinen Poren und besprüht damit sein
        Ziel. Wenn die Beute geschwächt ist, schluckt es sie mit
        seinem riesigen Maul im Ganzen herunter.
      es: |-
        Cuando Swalot detecta una presa, echa por los poros, y a
        borbotones, un fluido tóxico espantoso con el que rocía a su
        víctima. Una vez que la debilita, se la traga entera gracias a
        la gigantesca boca que tiene.
      it: |-
        Quando individua la preda, Swalot spruzza sul bersaglio
        un ripugnante fluido tossico dai propri pori. Una volta
        indebolito l’avversario, Swalot lo ingoia intero con la bocca
        simile a una voragine.
    alpha-sapphire:
      ja-Hrkt: |-
        はが　１ぽんも　ないので　なんでも　まるのみ。
        いっぱいに　あけた　くちは　とても　おおきく
        じどうしゃの　タイヤだって　すっぽり　はいるぞ。
      ja: |-
        歯が　１本も　ないので　なんでも　丸のみ。
        いっぱいに　開けた　口は　とても　大きく
        自動車の　タイヤだって　すっぽり　入るぞ。
      ko: |-
        이빨이 하나도 없어서 무엇이든 통째로 삼킨다.
        최대한 벌린 입은 정말 커서
        자동차 타이어마저도 쑥 들어간다.
      en: |-
        Swalot has no teeth, so what it eats, it swallows whole, no
        matter what. Its cavernous mouth yawns widely. An automobile
        tire could easily fit inside this Pokémon’s mouth.
      fr: |-
        Avaltout n’a pas de dents, ce qui le force à tout avaler en
        une bouchée. Quand il bâille, sa bouche prend une taille
        impressionnante, et on pourrait y placer une roue de voiture.
      de: |-
        Schlukwech hat keine Zähne. Alles was es isst, schluckt es im
        Ganzen herunter. Sein Maul ist so riesig, dass mit Leichtigkeit
        ein Autoreifen hineinpassen würde.
      es: |-
        Swalot no tiene dientes, así que lo que come se lo traga de
        una vez; da igual lo que sea. A este Pokémon le cabría un
        neumático en la boca sin problema.
      it: |-
        Swalot non ha denti, così quando mangia ingoia ogni cosa
        intera, senza masticare. Quando sbadiglia, la sua bocca
        enorme si apre a mo’ di voragine. È così grande che potrebbe
        contenere persino uno pneumatico.
