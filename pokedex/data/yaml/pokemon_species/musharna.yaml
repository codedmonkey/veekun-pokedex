musharna:
  base_happiness: 50
  capture_rate: 75
  color: pink
  egg_groups:
    - ground
  evolution_chain: munna
  evolves_from: munna
  flavor_text:
    black:
      en: |-
        The mist emanating from their foreheads
        is packed with the dreams of people
        and Pokémon.
      fr: |-
        La fumée qui sort de son front contient
        les rêves de nombreuses personnes et
        ceux de nombreux Pokémon.
    white:
      en: |-
        With the mist from its forehead,
        it can create shapes of things
        from dreams it has eaten.
      fr: |-
        Il peut matérialiser les rêves qu’il a
        mangés. La fumée qui sort de son front
        prend la forme des objets vus en rêve.
    black-2:
      en: |-
        The dream mist coming from its forehead
        changes into many different colors
        depending on the dream that was eaten.
    white-2:
      en: |-
        The dream mist coming from its forehead
        changes into many different colors
        depending on the dream that was eaten.
    x:
      ja-Hrkt: |-
        おでこから　でている　けむりの
        なかには　ひとや　ポケモンの　みた
        ゆめが　たくさん　つまっているのだ。
      ja: |-
        おでこから　出ている　煙の　中には
        人や　ポケモンの　見た　夢が
        たくさん　つまっているのだ。
      ko: |-
        이마에서 나오는 연기 속에는
        사람이나 포켓몬이 꾼
        꿈이 많이 모여 있다.
      en: |-
        The mist emanating from their foreheads is packed
        with the dreams of people and Pokémon.
      fr: |-
        La fumée qui sort de son front contient les rêves
        de nombreuses personnes et ceux de nombreux
        Pokémon.
      de: |-
        Der Dunst, der aus seiner Stirn tritt, enthält die
        Träume unzähliger Menschen und Pokémon.
      es: |-
        Multitud de sueños de humanos y Pokémon se
        encuentran atrapados en el humo que despide por
        su frente.
      it: |-
        Nel fumo che gli esce dalla fronte sono racchiusi
        molti sogni di esseri umani e di Pokémon.
    'y':
      ja-Hrkt: |-
        おでこから　でる　ゆめのけむりは
        たべた　ゆめの　ないようによって
        さまざまな　いろに　かわるのだ。
      ja: |-
        おでこから　でる　ゆめのけむりは
        食べた　夢の　内容によって
        さまざまな　色に　変わるのだ。
      ko: |-
        이마에서 나오는 꿈연기는
        먹은 꿈의 내용에 따라
        여러 가지 색으로 변한다.
      en: |-
        The dream mist coming from its forehead changes
        into many different colors depending on the dream
        that was eaten.
      fr: |-
        La fumée qui sort de son front change de couleur
        selon le contenu des rêves qu’il a mangés.
      de: |-
        Je nach Inhalt der Träume, die es frisst, nimmt der
        Dunst, der aus seiner Stirn austritt, unterschiedliche
        Farben an.
      es: |-
        El color del humo que despide por su abultada frente
        varía según el contenido de los sueños que haya
        engullido.
      it: |-
        Il fumo che esce dalla sua fronte cambia colore a
        seconda del contenuto del sogno che ha mangiato.
    omega-ruby:
      ja-Hrkt: |-
        おでこから　でている　けむりの
        なかには　ひとや　ポケモンの　みた
        ゆめが　たくさん　つまっているのだ。
      ja: |-
        おでこから　出ている　煙の　中には
        人や　ポケモンの　見た　夢が
        たくさん　つまっているのだ。
      ko: |-
        이마에서 나오는 연기 속에는
        사람이나 포켓몬이 꾼
        꿈이 많이 모여 있다.
      en: |-
        The mist emanating from their foreheads is packed
        with the dreams of people and Pokémon.
      fr: |-
        La fumée qui sort de son front contient les rêves de
        nombreuses personnes et ceux de nombreux Pokémon.
      de: |-
        Der Dunst, der aus seiner Stirn tritt, enthält die Träume
        unzähliger Menschen und Pokémon.
      es: |-
        Multitud de sueños de humanos y Pokémon se encuentran
        atrapados en el humo que despide por su frente.
      it: |-
        Nel fumo che gli esce dalla fronte sono racchiusi molti sogni
        di esseri umani e di Pokémon.
    alpha-sapphire:
      ja-Hrkt: |-
        おでこから　でる　ゆめのけむりは
        たべた　ゆめの　ないようによって
        さまざまな　いろに　かわるのだ。
      ja: |-
        おでこから　でる　ゆめのけむりは
        食べた　夢の　内容によって
        さまざまな　色に　変わるのだ。
      ko: |-
        이마에서 나오는 꿈연기는
        먹은 꿈의 내용에 따라
        여러 가지 색으로 변한다.
      en: |-
        The dream mist coming from its forehead changes
        into many different colors depending on the dream
        that was eaten.
      fr: |-
        La fumée qui sort de son front change de couleur
        selon le contenu des rêves qu’il a mangés.
      de: |-
        Je nach Inhalt der Träume, die es frisst, nimmt der Dunst,
        der aus seiner Stirn austritt, unterschiedliche Farben an.
      es: |-
        El color del humo que despide por su abultada frente varía
        según el contenido de los sueños que haya engullido.
      it: |-
        Il fumo che esce dalla sua fronte cambia colore a seconda del
        contenuto del sogno che ha mangiato.
    sword:
      ja-Hrkt: |-
        でてる　けむりが　くろっぽいときは
        ちかづかないほうが　いいよ。
        あくむが　げんじつに　なるぞ。
      ja: |-
        出てる　煙が　黒っぽいときは
        近づかないほうが　いいよ。
        悪夢が　現実に　なるぞ。
      ko: |-
        뿜어내는 연기가 거무스름할 때는
        가까이 가지 않는 것이 좋다.
        악몽이 현실이 되기 때문이다.
      zh-Hant: |-
        在牠冒出黑黑的煙霧時，
        還是不要接近牠為妙，
        否則惡夢將會成真。
      zh-Hans: |-
        在它冒出黑黑的烟雾时，
        还是不要接近它为妙，
        否则噩梦将会成真。
      en: |-
        When dark mists emanate from its body, don’t
        get too near. If you do, your nightmares will
        become reality.
      fr: |-
        Il est recommandé de ne pas l’approcher quand
        la fumée qui sort de son front a une teinte noire,
        sinon son cauchemar risque de se matérialiser.
      de: |-
        Wenn es schwärzlichen Dunst ausströmt, sollte
        man sich ihm nicht nähern, denn sonst werden
        Alpträume wahr.
      es: |-
        Cuando el humo que desprende es de un color
        negruzco, conviene no acercarse, ya que puede
        hacer realidad las pesadillas.
      it: |-
        Meglio non avvicinarsi quando emette
        un fumo di colore scuro, perché gli incubi
        diventano realtà.
    shield:
      ja-Hrkt: |-
        いつも　まどろみ　ゆめを　みている。
        ねおきは　とっても　ふきげんに
        なるので　そっとして　おこう。
      ja: |-
        いつも　まどろみ　夢を　見ている。
        寝起きは　とっても　不機嫌に
        なるので　そっとして　おこう。
      ko: |-
        언제나 선잠을 자며 꿈을 꾼다.
        잠에서 깨면 매우 불쾌해하므로
        가만히 내버려 두자.
      zh-Hant: |-
        總是在打瞌睡作夢。
        剛睡醒的時候會鬧脾氣，
        所以最好別去招惹牠。
      zh-Hans: |-
        总是在打瞌睡做梦。
        刚睡醒的时候会闹脾气，
        所以最好别去招惹它。
      en: |-
        It drowses and dreams all the time. It’s best to
        leave it be if it’s just woken up, as it’s a terrible
        grump when freshly roused from sleep.
      fr: |-
        Il est sans cesse assoupi, plongé dans ses rêves.
        Il vaut mieux éviter de le déranger, car il est
        toujours mal luné au réveil.
      de: |-
        Es schlummert und träumt immerzu. Wenn es
        geweckt wird, bekommt es schlechte Laune.
        Deshalb sollte man es lieber in Ruhe lassen.
      es: |-
        Siempre está soñando o adormecido. Se pone de
        muy mal humor al despertar, por lo que es mejor
        no perturbarlo.
      it: |-
        Sonnecchia costantemente, sognando.
        Quando si sveglia è di pessimo umore,
        quindi è meglio tenersi a debita distanza.
