snorlax:
  base_happiness: 50
  capture_rate: 25
  color: black
  egg_groups:
    - monster
  evolution_chain: snorlax
  evolves_from: munchlax
  flavor_text:
    red:
      en: |-
        Very lazy. Just
        eats and sleeps.
        As its rotundbulk builds, it
        becomes steadily
        more slothful.
    blue:
      en: |-
        Very lazy. Just
        eats and sleeps.
        As its rotundbulk builds, it
        becomes steadily
        more slothful.
    yellow:
      en: |-
        Will eat anything,
        even if the food
        happens to be alittle moldy. It
        never gets an
        upset stomach.
    gold:
      en: |-
        What sounds like
        its cry may ac­
        tually be itssnores or the
        rumblings of its
        hungry belly.
    silver:
      en: |-
        Its stomach's di­
        gestive juices can
        dissolve any kindof poison. It can
        even eat things
        off the ground.
    crystal:
      en: |-
        This POKéMON's
        stomach is so
        strong, eveneating moldy or
        rotten food will
        not affect it.
    ruby:
      en: |-
        SNORLAX’s typical day consists of
        nothing more than eating and sleeping.
        It is such a docile POKéMON that thereare children who use its expansive belly
        as a place to play.
    sapphire:
      en: |-
        SNORLAX’s typical day consists of
        nothing more than eating and sleeping.
        It is such a docile POKéMON that thereare children who use its expansive belly
        as a place to play.
    emerald:
      en: |-
        SNORLAX’s typical day consists of nothing
        more than eating and sleeping. It is such
        a docile POKéMON that there are children
        who use its big belly as a place to play.
    firered:
      en: |-
        It is not satisfied unless it eats over 880
        pounds of food every day. When it is done
        eating, it goes promptly to sleep.
    leafgreen:
      en: |-
        Very lazy. Just eats and sleeps. As its
        rotund bulk builds, it becomes steadily
        more slothful.
    diamond:
      en: |-
        Its stomach can digest any kind
        of food, even if it happens to be
        moldy or rotten.
    pearl:
      en: |-
        It stops eating only to sleep.
        It doesn’t feel full unless it
        eats nearly 900 pounds a day.
    platinum:
      en: |-
        When its belly is full, it becomes
        too lethargic to even lift a finger,
        so it is safe to bounce on its belly.
    heartgold:
      en: |-
        What sounds like its cry may
        actually be its snores or the
        rumblings of its hungry belly.
    soulsilver:
      en: |-
        Its stomach’s digestive juices can
        dissolve any kind of poison. It can
        even eat things off the ground.
    black:
      en: |-
        When its belly is full, it becomes
        too lethargic to even lift a finger,
        so it is safe to bounce on its belly.
      fr: |-
        Une fois le ventre plein, il est trop
        amorphe pour lever le petit doigt.
        Sautez sur son ventre!
    white:
      en: |-
        When its belly is full, it becomes
        too lethargic to even lift a finger,
        so it is safe to bounce on its belly.
      fr: |-
        Une fois le ventre plein, il est trop
        amorphe pour lever le petit doigt.
        Sautez sur son ventre!
    black-2:
      en: |-
        When its belly is full, it becomes
        too lethargic to even lift a finger,
        so it is safe to bounce on its belly.
    white-2:
      en: |-
        When its belly is full, it becomes
        too lethargic to even lift a finger,
        so it is safe to bounce on its belly.
    x:
      ja-Hrkt: |-
        １にちに　たべものを　４００キロ
        たべないと　きが　すまない。
        たべおわると　ねむってしまう。
      ja: |-
        １日に　食べ物を　４００キロ
        食べないと　気がすまない。
        食べ終わると　眠ってしまう。
      ko: |-
        하루에 먹을 것을 400kg
        먹지 않으면 성에 차지 않는다.
        다 먹으면 잠이 들어 버린다.
      en: |-
        It is not satisfied unless it eats over 880 pounds of
        food every day. When it is done eating, it goes
        promptly to sleep.
      fr: |-
        Ronflex n’est pas satisfait tant qu’il n’a pas avalé ses
        400 kg de nourriture quotidienne. Dès qu’il a fini de
        manger, il commence une sieste pour digérer.
      de: |-
        Es ist erst satt, wenn es über 400 kg Nahrung am
        Tag gefressen hat. Ist es mit dem Essen fertig,
        schläft es sofort ein.
      es: |-
        No se encuentra satisfecho hasta que no se come
        400 kg de comida cada día. Cuando acaba de comer,
        se queda dormido.
      it: |-
        Dopo aver trangugiato i suoi immancabili 400 kg di
        cibo quotidiani, cade in un sonno profondo.
    'y':
      ja-Hrkt: |-
        カビが　はえていても　くさっていても
        だいじょうぶ。カビゴンの　いぶくろは
        なんでも　しょうかできるのだ。
      ja: |-
        カビが　生えていても　腐っていても
        大丈夫。カビゴンの　胃袋は
        なんでも　消化できるのだ。
      ko: |-
        곰팡이가 피어 있거나 상했어도
        괜찮다. 잠만보의 위는
        무엇이든 소화시킬 수 있다.
      en: |-
        Its stomach can digest any kind of food,
        even if it happens to be moldy or rotten.
      fr: |-
        Son estomac peut digérer n’importe quel type de
        nourriture, même quand elle est moisie ou pourrie.
      de: |-
        Sein Magen kann jede Art von Nahrung verdauen,
        selbst wenn sie verschimmelt und verdorben ist.
      es: |-
        Su estómago puede digerir todo tipo de comida,
        incluso si está podrida o mohosa.
      it: |-
        Il suo stomaco riesce a digerire qualsiasi tipo di cibo,
        anche se marcio o ammuffito.
    omega-ruby:
      ja-Hrkt: |-
        たべて　ねての　くりかえしで　１にちが　おわる。
        おおきな　おなかの　うえを　あそびばに　している
        こどもたちも　いるほど　おとなしい　ポケモンだ。
      ja: |-
        食べて　寝ての　繰り返しで　１日が　終わる。
        大きな　お腹の　上を　遊び場に　している
        子どもたちも　いるほど　大人しい　ポケモンだ。
      ko: |-
        먹고 자는 것을 반복하다 하루가 끝난다.
        큰 배 위를 놀이터로 삼은 아이들이
        있을 정도로 얌전한 포켓몬이다.
      en: |-
        Snorlax’s typical day consists of nothing more than eating and
        sleeping. It is such a docile Pokémon that there are children
        who use its expansive belly as a place to play.
      fr: |-
        Les journées de Ronflex se résument aux repas et aux siestes.
        C’est un Pokémon tellement gentil que les enfants n’hésitent
        pas à jouer sur son énorme ventre.
      de: |-
        Der typische Tagesablauf von Relaxo besteht lediglich aus
        Essen und Schlafen. Es ist so zutraulich, dass Kinder seinen
        dicken Bauch als Platz zum Spielen nutzen.
      es: |-
        Un día cualquiera en la vida de Snorlax consiste en comer y
        dormir. Es un Pokémon tan dócil que es fácil ver niños usando
        la gran panza que tiene como lugar de juegos.
      it: |-
        La giornata tipica di Snorlax consiste in nient’altro che
        mangiare e dormire. È un Pokémon così docile che
        i bambini usano la sua enorme pancia come parco giochi.
    alpha-sapphire:
