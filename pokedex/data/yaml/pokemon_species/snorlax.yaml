        i bambini usano la sua enorme pancia come parco giochi.
    sun:
      ja-Hrkt: |-
        さいきょうの　いぶくろを　もつと
        いわれる。　ベトベトンの　どくでさえ
        カビゴンの　したには　スパイスなのだ。
      ja: |-
        最強の　胃袋を　持つと
        いわれる。　ベトベトンの　毒でさえ
        カビゴンの　舌には　スパイスなのだ。
      ko: |-
        최강의 위를 가졌다고
        전해진다. 질뻐기의 독조차
        잠만보의 혀에는 향신료인 셈이다.
      zh-Hant: |-
        據說擁有最強的胃袋。
        就連臭臭泥的毒對卡比獸的
        舌頭來說也只是調味料而已。
      zh-Hans: |-
        据说拥有最强的胃袋。
        就连臭臭泥的毒对卡比兽的
        舌头来说也只是调味料而已。
      en: |-
        Its stomach is said to be incomparably strong.
        Even Muk’s poison is nothing more than a hint of
        spice on Snorlax’s tongue.
      fr: |-
        On dit que son estomac n’a pas d’égal.
        Même les toxines de Grotadmorv ne sont rien
        de plus qu’un assaisonnement épicé pour lui.
      de: |-
        Es heißt, sein Magen sei an Widerstandsfähigkeit
        nicht zu übertreffen. Für Relaxo ist selbst das
        Gift eines Sleimok nicht mehr als ein Würzstoff.
      es: |-
        Su estómago es exageradamente resistente.
        Tanto que podría condimentar su comida con el
        veneno de Muk sin inmutarse.
      it: |-
        Sembra che abbia uno stomaco fortissimo.
        Il fluido tossico di Muk per lui è solo un
        condimento un po’ speziato.
    moon:
      ja-Hrkt: |-
        まいにち　４００キロの　エサを　くう。
        くってるはじから　いねむりを　はじめ
        ねむったままでも　くっている。
      ja: |-
        毎日　４００キロの　餌を　喰う。
        喰ってるはじから　居眠りを　はじめ
        眠ったままでも　喰っている。
      ko: |-
        매일 400kg의 먹이를 먹는다.
        먹기 시작할 때부터 졸기 시작하여
        자는 동안에도 먹고 있다.
      zh-Hant: |-
        每天要吃下４００公斤的食物。
        一開始吃就會打瞌睡，
        即使是睡著的狀態也會繼續吃。
      zh-Hans: |-
        每天要吃下４００公斤的食物。
        开吃之后，就会开始打瞌睡，
        即使是睡着的状态也会继续吃。
      en: |-
        It eats nearly 900 pounds of food every day.
        It starts nodding off while eating—and continues
        to eat even while it’s asleep.
      fr: |-
        Il mange 400 kg de nourriture par jour.
        Il arrive que sa sieste commence pendant qu’il
        mange, mais il continue à manger même endormi.
      de: |-
        Es nimmt jeden Tag 400 kg an Nahrung zu sich.
        Es schläft beim Essen ein und frisst selbst im
        Schlaf noch weiter.
      es: |-
        Engulle 400 kg de comida a diario. Si le entra
        sueño cuando está alimentándose, sigue
        comiendo mientras echa una cabezada.
      it: |-
        Ogni giorno mangia 400 kg di cibo.
        Appena inizia a mangiare, si addormenta, ma
        continua anche mentre dorme.
    ultra-sun:
      ja-Hrkt: |-
        くうか　ねるかしか　していないが
        なにかの　きっかけで　ほんきをだすと
        すごい　パワーを　はっきするらしい。
      ja: |-
        食うか　寝るかしか　していないが
        なにかの　きっかけで　本気を出すと
        凄い　パワーを　発揮するらしい。
      ko: |-
        먹거나 자는 것밖에 안 하지만
        일단 진심을 다하게 되면
        굉장한 파워를 발휘하는 듯하다.
      zh-Hant: |-
        平常不是吃就是睡，但如果
        因某種原因認真起來的話，
        似乎就會發揮驚人的力量。
      zh-Hans: |-
        平时不是吃就是睡，但如果因
        某些事而认真起来的话，
        好像就会发挥出惊人的力量。
      en: |-
        It doesn’t do anything other than eat and sleep.
        When prompted to make a serious effort,
        though, it apparently displays awesome power.
      fr: |-
        Il ne fait pas grand-chose à part manger
        et dormir, mais gare à lui quand il décide
        de passer à l’action !
      de: |-
        Wenn es nicht gerade frisst, dann schläft es.
        Macht es aber einmal Ernst, ist Schluss mit
        lustig.
      es: |-
        Poco hace aparte de comer y dormir, pero
        puede desatar una fuerza arrolladora si le da
        un arrebato.
      it: |-
        Non fa altro che mangiare e dormire, ma quando
        decide di fare sul serio tira fuori una potenza
        eccezionale.
    ultra-moon:
      ja-Hrkt: |-
        たべること　いがいに　きょうみが
        ない。　ひるねちゅうに　おなかのうえに
        のっかっても　まるで　きにしないぞ。
      ja: |-
        食べること　以外に　興味が
        ない。　昼寝中に　お腹の上に
        乗っかっても　まるで　気にしないぞ。
      ko: |-
        먹는 것 외에는 관심이 없다.
        낮잠 중에 배 위에 올라타도
        전혀 신경 쓰지 않는다.
      zh-Hant: |-
        就只對吃感興趣。
        當牠睡午覺時，就算站上牠的肚子，
        牠也絲毫不會在意。
      zh-Hans: |-
        只对吃感兴趣。
        即便是在它睡午觉时跳到
        它肚子上，它也毫不在意。
      en: |-
        It has no interest in anything other than eating.
        Even if you climb up on its stomach while it’s
        napping, it doesn’t seem to mind at all!
      fr: |-
        La seule chose qui l’intéresse, c’est manger.
        Il ne se réveille même pas si quelqu’un grimpe
        sur son ventre pendant qu’il fait une sieste.
      de: |-
        Bei ihm geht es immer nur ums Fressen. Macht
        man es sich auf seinem Bauch bequem, während
        es döst, ist es ihm daher egal.
      es: |-
        Solo piensa en comer y lo demás no le interesa.
        Cuando duerme la siesta, no se inmuta ni aunque
        alguien se le tumbe en la barriga.
      it: |-
        Il suo unico interesse è il cibo. Quando fa
        la sua pennichella pomeridiana, non si accorge
        nemmeno se qualcuno gli sale sulla pancia.
    lets-go-pikachu:
      ja-Hrkt: |-
        たしょう　カビが　はえていても
        きにしないで　たべまくる。
        おなかを　こわしたりもしない。
      ja: |-
        多少　カビが　生えていても
        気にしないで　食べまくる。
        お腹を　壊したりもしない。
      ko: |-
        약간 곰팡이가 피어 있어도
        신경 쓰지 않고 먹어 치운다.
        배탈이 나는 일도 없다.
      zh-Hant: |-
        就算食物有點發霉，
        也會毫不在意地大吃特吃，
        從不會因此吃壞肚子。
      zh-Hans: |-
        就算是有些发霉的食物
        也能毫不在意地吃完，
        并且完全不会吃坏肚子。
      en: |-
        Will eat anything, even if the food happens to
        be a little moldy. It never gets an upset stomach.
      fr: |-
        Il peut tout manger, même de la nourriture
        avariée. Il n’a jamais mal au ventre.
      de: |-
        Relaxo verschlingt sogar Nahrung, auf der sich
        etwas Schimmel gebildet hat. Trotzdem verdirbt
        es sich nie den Magen.
      es: |-
        Engulle cualquier cosa, incluso comida mohosa,
        sin que esto le cause dolor de estómago.
      it: |-
        Mangia qualsiasi cosa gli capiti a tiro, anche
        se ammuffita, senza mai soffrire di mal di pancia.
    lets-go-eevee:
      ja-Hrkt: |-
        たしょう　カビが　はえていても
