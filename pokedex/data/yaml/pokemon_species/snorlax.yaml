    sword:
      ja-Hrkt: |-
        １にちに　たべものを　４００キロ
        たべないと　きが　すまない。
        たべおわると　ねむってしまう。
      ja: |-
        １日に　食べ物を　４００キロ
        食べないと　気がすまない。
        食べ終わると　眠ってしまう。
      ko: |-
        하루에 400kg의 음식을
        먹지 않으면 성에 차지 않는다.
        다 먹으면 잠이 들어 버린다.
      zh-Hant: |-
        每天不吃下４００公斤的食物
        絕不會善罷甘休。
        吃飽了就會開始睡覺。
      zh-Hans: |-
        每天不吃上４００公斤的食物
        心里就不畅快。
        吃饱了就会开始睡觉。
      en: |-
        It is not satisfied unless it eats over 880 pounds
        of food every day. When it is done eating, it
        goes promptly to sleep.
      fr: |-
        Ronflex n’est pas satisfait tant qu’il n’a pas avalé
        ses 400 kg de nourriture quotidienne. Dès qu’il
        a fini, il commence une sieste pour digérer.
      de: |-
        Es muss über 400 kg Nahrung am Tag fressen,
        um satt zu werden. Ist es mit dem Essen fertig,
        schläft es sofort ein.
      es: |-
        No se encuentra satisfecho hasta haber ingerido
        400 kg de comida cada día. Cuando acaba de
        comer, se queda dormido.
      it: |-
        Dopo aver trangugiato i suoi immancabili 400 kg
        di cibo quotidiani, cade in un sonno profondo.
    shield:
      ja-Hrkt: |-
        がんじょうな　いぶくろは　カビの
        はえたものや　くさったものを
        たべても　こわれることはない。
      ja: |-
        頑丈な　胃袋は　カビの
        生えたものや　腐ったものを
        食べても　壊れることはない。
      ko: |-
        위장이 튼튼해서
        곰팡이가 피거나 썩은 것을
        먹어도 배탈이 나지 않는다.
      zh-Hant: |-
        擁有一個結實的胃，
        即使吃了發霉腐爛的東西，
        也完全不會吃壞肚子。
      zh-Hans: |-
        拥有一个结实的胃，
        即使吃了发霉腐烂的东西，
        也完全不会吃坏肚子。
      en: |-
        This Pokémon’s stomach is so strong, even eating
        moldy or rotten food will not affect it.
      fr: |-
        L’estomac de ce Pokémon est si résistant
        qu’il peut même digérer de la nourriture avariée.
      de: |-
        Der Magen dieses Pokémon ist so resistent,
        dass es sogar Verschimmeltes oder Verdorbenes
        essen kann.
      es: |-
        Este Pokémon tiene un estómago a prueba de
        bomba, por lo que es capaz de ingerir incluso
        comida podrida o mohosa.
      it: |-
        Ha uno stomaco così resistente che può
        ingerire anche cibo ammuffito o avariato.
    legends-arceus:
      en: |-
        This glutton appears in villages without warning and devours the
        entirety of their rice granaries—such occurrences have long been
        counted among the gravest of disasters.
