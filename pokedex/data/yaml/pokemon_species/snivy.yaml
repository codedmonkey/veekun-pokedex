snivy:
  base_happiness: 70
  capture_rate: 45
  color: green
  egg_groups:
    - ground
    - plant
  evolution_chain: snivy
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        It is very intelligent and calm.
        Being exposed to lots of sunlight makes
        its movements swifter.
      fr: |-
        Un Pokémon intelligent et très calme.
        Lorsqu’il a reçu suffisamment de
        lumière du soleil, il devient plus agile.
    white:
      en: |-
        They photosynthesize by bathing their
        tails in sunlight. When they are not
        feeling well, their tails droop.
      fr: |-
        Il laisse sa queue prendre le soleil pour
        sa photosynthèse. Quand il est malade,
        sa queue pend tristement.
    black-2:
      en: |-
        Being exposed to sunlight makes
        its movements swifter. It uses
        vines more adeptly than its hands.
    white-2:
      en: |-
        Being exposed to sunlight makes
        its movements swifter. It uses
        vines more adeptly than its hands.
    x:
      ja-Hrkt: |-
        たいようの　ひかりを　あびると
        いつもよりも　すばやく　うごける。
        てよりも　ツルを　うまくつかう。
      ja: |-
        太陽の　光を　浴びると
        いつもよりも　素早く　動ける。
        手よりも　ツルを　うまく使う。
      ko: |-
        태양의 빛을 받으면
        평소보다 빨리 움직일 수 있다.
        손보다 덩굴을 잘 사용한다.
      en: |-
        Being exposed to sunlight makes its movements
        swifter. It uses vines more adeptly than its hands.
      fr: |-
        La lumière du soleil augmente fortement son agilité.
        Ses lianes sont plus habiles que ses mains.
      de: |-
        Im Sonnenlicht erhöht sich das Tempo seiner
        Bewegungen. Es ist mit seinen Schlingen
        geschickter als mit den Händen.
      es: |-
        Cuando recibe los rayos de sol, se mueve mucho más
        rápido que de costumbre. Usa mejor sus lianas que
        sus manos.
      it: |-
        Quando è esposto alla luce solare può muoversi
        più velocemente. Usa le sue liane meglio dei suoi
        stessi arti.
    'y':
      ja-Hrkt: |-
        しっぽで　たいようを　あびて
        こうごうせいを　する。げんきを
        なくすと　しっぽが　たれさがる。
      ja: |-
        尻尾で　太陽の光を　浴びて
        光合成を　する。元気を　なくすと
        尻尾が　たれさがる。
      ko: |-
        꼬리로 태양의 빛을 받아
        광합성한다. 기운이
        빠지면 꼬리가 축 늘어진다.
      en: |-
        They photosynthesize by bathing their tails in
        sunlight. When they are not feeling well, their
        tails droop.
      fr: |-
        Il laisse sa queue prendre le soleil pour sa
        photosynthèse. Quand il est malade, sa queue pend
        tristement.
      de: |-
        Fängt mit dem Schweif Sonnenlicht auf,
        um Photosynthese zu betreiben. Fehlt ihm
        die Kraft, hängt sein Schweif schlaff herab.
      es: |-
        Sintetiza la luz del sol que recoge con su cola. Esta
        se le queda abatida cuando le fallan las energías.
      it: |-
        Assorbe i raggi solari dalla coda per operare la
        fotosintesi. Quando non sta bene, la sua coda si
        affloscia.
