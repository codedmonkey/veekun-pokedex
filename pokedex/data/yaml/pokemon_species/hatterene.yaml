hatterene:
  base_happiness: 50
  capture_rate: 45
  color: pink
  egg_groups:
    - fairy
  evolution_chain: hatenna
  evolves_from: hattrem
  flavor_text:
    sword:
      ja-Hrkt: |-
        ずつうになるほどの　サイコパワーを
        しゅういに　はなって　ほかの
        せいぶつを　とおざけているのだ。
      ja: |-
        頭痛になるほどの　サイコパワーを
        周囲に　放って　ほかの
        生物を　遠ざけているのだ。
      ko: |-
        두통이 생길 정도의 사이코 파워를
        주위에 발산해서 다른 생물이
        접근하지 못하게 한다.
      zh-Hant: |-
        由於會朝四周釋放足以
        引起頭痛的精神力量，
        其他生物都躲得遠遠的。
      zh-Hans: |-
        由于会朝四周释放足以
        引起头痛的精神力量，
        其他生物都躲得远远的。
      en: |-
        It emits psychic power strong enough to cause
        headaches as a deterrent to the approach
        of others.
      fr: |-
        Il éloigne les autres êtres vivants en émettant
        des ondes psychiques pouvant donner
        des maux de tête épouvantables.
      de: |-
        Die starken Psycho-Kräfte, die es ausstrahlt,
        rufen Kopfschmerzen hervor. So hält es andere
        Lebewesen von sich fern.
      es: |-
        Para mantener alejados a los demás seres vivos,
        emana a su alrededor ondas psíquicas cuya
        potencia es capaz de provocar jaquecas.
      it: |-
        Tiene alla larga gli esseri viventi che si trovano
        nei paraggi emettendo onde psichiche così forti
        da far venire il mal di testa.
    shield:
      ja-Hrkt: |-
        べつめいは　もりの　まじょ。
        さわぎたてると　しょくしゅのツメで
        ひきさかれるかも　しれないぞ。
      ja: |-
        別名は　森の　魔女。
        騒ぎたてると　触手のツメで
        引き裂かれるかも　しれないぞ。
      ko: |-
        숲의 마녀라는 별명을 가졌다.
        소란을 피우면 촉수의 손톱에
        찢겨질지도 모른다.
      zh-Hant: |-
        又被稱為森林魔女。
        如果有人大吵大鬧，可能會
        被牠用觸手上的爪子撕碎。
      zh-Hans: |-
        又被称为森林魔女。
        如果有人大吵大闹，可能会
        被它用触手上的爪子撕碎。
      en: |-
        If you’re too loud around it, you risk being torn
        apart by the claws on its tentacle. This Pokémon
        is also known as the Forest Witch.
      fr: |-
        On l’appelle aussi la « sorcière de la forêt ».
        Ce Pokémon lacère quiconque fait trop de bruit
        avec les griffes de son tentacule.
      de: |-
        Es wird auch „Hexe des Waldes“ genannt. Wer
        Lärm veranstaltet, wird unter Umständen von der
        Klaue an seinem Fühler auseinandergenommen.
      es: |-
        Recibe el apodo de Hechicera del Bosque.
        Quienes arman demasiado barullo se exponen a
        ser despedazados por las garras de su tentáculo.
      it: |-
        È conosciuto anche come “maga del bosco”.
        Se qualcuno fa troppo chiasso rischia di essere
        fatto a pezzettini dagli artigli sul suo tentacolo.
