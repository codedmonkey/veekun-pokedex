oricorio:
  base_happiness: 70
  capture_rate: 45
  color: red
  egg_groups:
    - flying
  evolution_chain: oricorio
  evolves_from: ~
  flavor_text:
    sun:
      ja-Hrkt: |-
        はねを　うちあわせて　はっか。
        かれいな　ステップを　ふみながら
        はげしい　ほのおを　あびせかけるぞ。
      ja: |-
        羽を　打ち合わせて　発火。
        華麗な　ステップを　踏みながら
        激しい　炎を　浴びせかけるぞ。
      ko: |-
        날개를 부딪쳐서 발화시킨다.
        화려한 스텝을 밟으면서
        격렬한 불꽃을 퍼붓는다.
      zh-Hant: |-
        拍打翅膀生火。
        一邊踩著華麗的步伐，
        一邊灑下猛烈的火焰。
      zh-Hans: |-
        拍打翅膀生火。
        一边踩着华丽的步伐，
        一边洒下猛烈的火焰。
      en: |-
        It beats its wings together to create fire.
        As it moves in the steps of its beautiful dance,
        it bathes opponents in intense flames.
      fr: |-
        Il réunit ses ailes pour générer du feu.
        Sa chorégraphie envoûtante noie l’ennemi
        sous un torrent de flammes.
      de: |-
        Schlägt es mit den Flügeln, gibt es Zunder!
        Mit eleganten Ausfallschritten lässt es dann
        Feuer auf seine Gegner herabregnen.
      es: |-
        Junta las alas y lanza voraces llamas al rival.
        Su ataque se asemeja a una elaborada
        coreografía de fuego.
      it: |-
        Genera del fuoco congiungendo le ali.
        Avvolge il nemico con violente fiamme mentre
        si esibisce in un’elegante coreografia di danza.
    moon:
      ja-Hrkt: |-
        くれないのミツを　すった　オドリドリ。
        じょうねつてきな　ステップで　てきの
        みも　こころも　やきつくす。
      ja: |-
        くれないのミツを　吸った　オドリドリ。
        情熱的な　ステップで　敵の
        身も　心も　焼き尽くす。
      ko: |-
        다홍꿀을 빨아들인 춤추새.
        정열적인 스텝으로 적의
        몸도 마음도 불태운다.
      zh-Hant: |-
        吸食了朱紅色花蜜的花舞鳥。
        以熱情的舞步將敵人的身心
        全部燃燒殆盡。
      zh-Hans: |-
        吸食了朱红色花蜜的花舞鸟。
        以热情的步伐将敌人的身心
        全部燃烧殆尽。
      en: |-
        This Oricorio has sipped red nectar. Its
        passionate dance moves cause its enemies
        to combust in both body and mind.
      fr: |-
        Après avoir bu du Nectar Rouge, Plumeline
        se lance dans une ardente danse qui consume
        le cœur de ses ennemis.
      de: |-
        Ein Choreogel, das roten Nektar geschlürft hat.
        Mit seinen hitzigen Tanzschritten versengt es
        Körper und Geist eines jeden Gegners.
      es: |-
        Forma que toma Oricorio al libar Néctar Rojo.
        Hace arder el corazón de sus adversarios con
        su cálida danza.
      it: |-
        Un Oricorio che si è nutrito di Nettare rosso.
        Con i suoi ardenti passi di danza trascina i suoi
        nemici in una lotta infuocata.
    ultra-sun:
      ja-Hrkt: |-
        じょうねつてきな　ダンスで　てきの
        こころを　つかみ　ゆだんした　すきに
        もえさかる　ほのおで　やきつくす。
      ja: |-
        情熱的な　ダンスで　敵の
        心を　つかみ　油断した　隙に
        燃えさかる　炎で　焼き尽くす。
      ko: |-
        정열적인 댄스로 적의 마음을
        사로잡아 방심하게 한 후
        타오르는 불꽃으로 태워버린다.
      zh-Hant: |-
        會用熱情的舞蹈抓住敵人的心，
        再趁對手失去戒心的空檔
        用熊熊燃燒的火焰把對方燒成灰。
      zh-Hans: |-
        用热情的舞蹈抓住敌人的心，
        趁对方疏忽的间隙，
        用熊熊燃烧的火焰将其烧尽。
      en: |-
        It wins the hearts of its enemies with its
        passionate dancing and then uses the opening
        it creates to burn them up with blazing flames.
      fr: |-
        Il envoûte ses ennemis avec une danse
        fougueuse, et profite de leur inattention
        pour les noyer sous un torrent de flammes.
      de: |-
        Mit feurigen Tanzschritten zieht es Gegner in
        seinen Bann und nutzt ihre Unachtsamkeit, um
        sie mit lodernden Flammen einzuäschern.
      es: |-
        Con su danza apasionada cautiva al enemigo.
        En cuanto este baja la guardia, lo calcina con
        sus enormes llamaradas.
      it: |-
        Ammalia il nemico con una danza appassionata
        e approfitta della sua distrazione per attaccare
        con fiamme potentissime riducendolo in cenere.
    ultra-moon:
      ja-Hrkt: |-
        くれないのミツを　すった　オドリドリ。
        トレーナーが　しじを　まちがえると
        はげしく　おこる　げきじょうか　だ。
      ja: |-
        くれないのミツを　吸った　オドリドリ。
        トレーナーが　指示を　間違えると
        激しく　怒る　激情家　だ。
      ko: |-
        다홍꿀을 빨아들인 춤추새.
        트레이너가 틀린 지시를 내리면
        격렬하게 화를 내는 격정적인 성격이다.
      zh-Hant: |-
        吸食了朱紅色花蜜的花舞鳥。
        訓練家如果做出了錯誤的指示，
        感情起伏激烈的牠就會非常生氣。
      zh-Hans: |-
        吸食了朱红色花蜜的花舞鸟。
        训练家弄错指示的话就会非常生气。
        是情感变化非常剧烈的家伙。
      en: |-
        This Oricorio has drunk red nectar. If its Trainer
        gives the wrong order, this passionate Pokémon
        becomes fiercely angry.
      fr: |-
        Un Plumeline ayant bu du Nectar Rouge.
        D’un naturel passionné, il brûle de rage
        quand son Dresseur se trompe d’ordre.
      de: |-
        Ein Choreogel, das roten Nektar geschlürft hat.
        Es neigt zur Theatralik. Gibt ihm sein Trainer
        einen falschen Befehl, macht es ihm eine Szene.
      es: |-
        Forma que toma Oricorio al libar Néctar Rojo. Su
        vehemencia le lleva a ponerse hecho una furia
        si el Entrenador le imparte la orden equivocada.
      it: |-
        Un Oricorio che si è nutrito di Nettare rosso.
        È molto melodrammatico e va su tutte le furie se
        il suo Allenatore gli dà un’indicazione sbagliata.
