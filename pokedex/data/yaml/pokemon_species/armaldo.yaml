      fr: |-
        Il a gagné la côte après son
        évolution. Une armure robuste
        recouvre son corps.
    black-2:
      en: |-
        It went ashore after evolving.
        Its entire body is clad in a sturdy
        armor.
    white-2:
      en: |-
        It went ashore after evolving.
        Its entire body is clad in a sturdy
        armor.
    x:
      ja-Hrkt: |-
        のびちぢみする　きょだいな　ツメで
        えものを　くしざしにして　とらえる。
        じょうぶな　よろいを　みに　まとう。
      ja: |-
        伸び縮みする　巨大な　ツメで
        獲物を　くし刺しにして　捕らえる。
        丈夫な　よろいを　身に　まとう。
      ko: |-
        늘었다 줄었다 하는 거대한 손톱으로
        먹이를 찔러서 잡는다.
        튼튼한 갑옷을 몸에 두르고 있다.
      en: |-
        Its enormous, retractable claws can cut through
        most anything. Its entire body is clad in
        sturdy plates.
      fr: |-
        Ce Pokémon au corps blindé peut allonger ou
        rétracter ses énormes pinces pour embrocher ses
        proies.
      de: |-
        Es spießt die Beute mit seinen Scheren auf,
        ehe es sie verspeist. Den Körper umgibt
        ein robuster Panzer.
      es: |-
        Ensarta a sus presas con sus gigantescas garras
        elásticas. Una fuerte coraza cubre su cuerpo.
      it: |-
        Cattura il nemico infilzandolo con gli enormi artigli
        retrattili. È rivestito di una robusta corazza.
    'y':
      ja-Hrkt: |-
        こうらに　おおわれた　からだは
        とても　がんじょう。するどい　ツメで
        えものを　くしざしにして　たべる。
      ja: |-
        甲羅に　覆われた　体は
        とても　頑丈。鋭い　ツメで
        獲物を　くしざしにして　食べる。
      ko: |-
        등껍질이 감싸고 있는 몸은
        매우 단단하다. 날카로운 손톱으로
        먹이를 찔러서 먹는다.
      en: |-
        Protected by a hard shell, its body is very sturdy.
        It skewers prey with its claws to feed.
      fr: |-
        Rien ne peut transpercer la cuirasse d’Armaldo.
        Ce Pokémon embroche ses proies avec ses griffes
        pour les avaler plus facilement.
      de: |-
        Sein robuster Körper wird von einem harten Panzer
        geschützt. Es spießt die Beute mit seinen Scheren auf,
        ehe es sie verspeist.
      es: |-
        Está protegido por una fuerte armadura y tiene un
        cuerpo robusto. Engancha a sus presas con las pinzas
        y las devora.
      it: |-
        Ha un corpo molto resistente, protetto da un duro
        guscio. Infilza le prede con gli artigli per poi cibarsene.
    omega-ruby:
      ja-Hrkt: |-
        こうらは　あらゆる　こうげきを　はねかえす。
        のび　ちぢみする　きょだいな　２ほんの　ツメは
        てっぱんを　くしざしにする　ほどの　いりょくだ。
      ja: |-
        甲羅は　あらゆる　攻撃を　はね返す。
        伸び　縮みする　巨大な　２本の　ツメは
        鉄板を　くし刺しにする　ほどの　威力だ。
      ko: |-
        등껍질은 어떠한 공격이라도 튕겨낸다.
        늘었다 줄었다 하는 거대한 2개의 발톱은
        철판을 찔러 뚫을 정도의 위력을 지녔다.
      en: |-
        Armaldo’s tough armor makes all attacks bounce off. This
        Pokémon’s two enormous claws can be freely extended or
        contracted. They have the power to punch right through a
        steel slab.
      fr: |-
        Le puissant blindage d’Armaldo peut repousser toute attaque.
        Les énormes pinces de ce Pokémon peuvent s’allonger ou
        se rétracter. Elles peuvent transpercer une plaque d’acier.
      de: |-
        Von Armaldos hartem Panzer prallen alle Angriffe ab. Dieses
        Pokémon hat zwei mächtige Klauen, die es ausfahren oder
        einziehen kann. Es hat so viel Kraft, dass es damit eine
        Stahlplatte pulverisieren kann.
      es: |-
        Armaldo tiene una sólida armadura que repele cualquier
        ataque. Este Pokémon puede estirar o encoger todo lo que
        quiera las pinzas que tiene. Con ellas, puede atravesar una
        plancha de acero.
      it: |-
        La dura corazza di Armaldo protegge da ogni tipo di attacco.
        I suoi due enormi artigli sono in grado di estendersi
        e contrarsi. Inoltre sono dotati di una potenza tale
        da spaccare una lastra d’acciaio.
    alpha-sapphire:
      ja-Hrkt: |-
        おおむかし　ぜつめつした　ポケモンの　いっしゅ。
        ちじょうで　くらすとき　べんりな　ように
        ２ほんの　あしで　あるくように　なったと　いう。
      ja: |-
        大昔　絶滅した　ポケモンの　一種。
        地上で　暮らすとき　便利な　ように
        ２本の　足で　歩くように　なったと　いう。
      ko: |-
        오랜 옛날 멸종된 포켓몬의 한 종류다.
        땅 위에서 살 때 편리하도록
        2개의 다리로 걸을 수 있게 됐다고 한다.
      en: |-
        Armaldo is a Pokémon species that became extinct in
        prehistoric times. This Pokémon is said to have walked
        on its hind legs, which would have been more convenient
        for life on land.
      fr: |-
        Armaldo fait partie d’une espèce de Pokémon qui s’est
        éteinte à l’époque préhistorique. On raconte que ce Pokémon
        marchait sur ses pattes arrière, ce qui facilitait sa vie sur
        la terre ferme.
      de: |-
        Armaldo ist eine Pokémon-Art, die vor vielen Jahren
        ausgestorben ist. Dieses Pokémon soll sich auf seinen
        Hinterbeinen fortbewegt haben, da dies für das Leben
        an Land bequemer war.
      es: |-
        Armaldo es una de las especies de Pokémon que se
        extinguieron en la era prehistórica. Se cree que caminaban
        sobre las patas traseras; lo más apropiado para la vida en
        tierra firme.
      it: |-
        Armaldo è una specie di Pokémon estinta già in tempi antichi.
        Si dice che camminasse sugli arti inferiori per affrontare meglio
        il tipo di vita che conduceva sulla terraferma.
    ultra-sun:
      ja-Hrkt: |-
        りくに　くらし　えものを　もとめて
        うみへ　かりへと　でかけていた。
        するどい　ツメが　さいだいの　ぶき。
      ja: |-
        陸に　暮らし　獲物を　求めて
        海へ　狩りへと　でかけていた。
        鋭い　ツメが　最大の　武器。
      ko: |-
        지상에 살며 먹이를 찾아
        바다로 사냥을 나갔다.
        날카로운 발톱이 최대 무기다.
      zh-Hant: |-
        過去的牠生活在陸地上，
        會為了尋找獵物而去海中狩獵。
        銳利的爪子是牠最大的武器。
      zh-Hans: |-
        生活在陆地上，曾为了
        寻找猎物而出发去海里狩猎。
        锐利的爪子是它最大的武器。
      en: |-
        It lived on land and went out into the sea to
        hunt for prey. Its sharp claws were its
        greatest weapon.
      fr: |-
        Ce Pokémon terrestre avait pour habitude
        d’aller chasser ses proies en mer à l’aide de
        ses armes de prédilection : ses griffes acérées.
      de: |-
        Es lebte an Land und jagte im Meer nach Beute.
        Seine scharfen Klauen waren seine größte Waffe.
      es: |-
        Vivía en tierra firme, pero se adentraba en el
        mar en busca de presas a las que cazar con
        sus afiladas pinzas, un arma de lo más temible.
      it: |-
        Viveva sulla terraferma e si tuffava in mare
        per cacciare le prede. La sua arma migliore
        erano gli artigli affilati.
    ultra-moon:
      ja-Hrkt: |-
        うみから　ちじょうで　くらすように
        なった。　いちぶの　むしポケモンの
        そせんで　あることが　わかった。
      ja: |-
        海から　地上で　暮らすように
        なった。　一部の　むしポケモンの
        祖先で　あることが　わかった。
      ko: |-
        바다에서 살다가 지상에서도
        살 수 있게 되었다. 일부 벌레포켓몬의
        조상인 것으로 밝혀졌다.
      zh-Hant: |-
        從海裡搬到了陸地上生活。
        根據了解，牠是一部份
        蟲寶可夢的祖先。
      zh-Hans: |-
        从海里变成了在陆地生活。
        据了解，是一部分虫宝可梦的祖先。
      en: |-
        Armaldo adapted from living in water to living on
        land. It has been determined that it is the
        ancestor of some bug Pokémon.
      fr: |-
        Considéré comme l’un des ancêtres des
        Pokémon Insecte, il avait quitté la mer pour
        s’installer sur la terre ferme.
      de: |-
        Es hat früher im Meer gelebt und ist dann an
        Land gekommen. Man hat herausgefunden, dass
        es der Vorfahre einiger Käfer-Pokémon ist.
      es: |-
        Este Pokémon abandonó el mar para habitar en
        tierra firme. Según se ha demostrado, es el
        antepasado de algunos Pokémon insecto.
      it: |-
        Originariamente viveva in mare, ma poi si spostò
        sulla terraferma. Si è scoperto che è l’antenato
        di alcuni Pokémon Coleottero.
    sword:
      ja-Hrkt: |-
        しんかして　りくちに　あがった。
        かはんしんが　きょうかされ　しっぽの
        いちげきは　すごい　はかいりょくだ。
      ja: |-
        進化して　陸地に　上がった。
        下半身が　強化され　しっぽの
        一撃は　すごい　破壊力だ。
      ko: |-
        진화해서 육지로 올라왔다.
        하반신이 강화되어 꼬리로 가하는
        일격은 굉장한 파괴력을 자랑한다.
      zh-Hant: |-
        進化後搬到了陸地上生活，
        且下半身獲得了強化。用尾巴
        使出的一擊破壞力十分驚人。
      zh-Hans: |-
        进化之后登上了陆地。
        下半身得到了强化，
        尾巴的攻击破坏力极强。
      en: |-
        After evolution, this Pokémon emerged onto
        land. Its lower body has become stronger, and
        blows from its tail are devastating.
      fr: |-
        Depuis son évolution, il vit sur la terre ferme.
        Ses membres inférieurs se sont développés
        et ses coups de queue sont dévastateurs.
      de: |-
        Nach seiner Entwicklung ging es an Land, sodass
        sich sein Unterkörper verstärkte. Ein Hieb seines
        Schweifs besitzt gewaltige Zerstörungskraft.
      es: |-
        Tras evolucionar, pasó a vivir en tierra firme.
        Posee tal fuerza en la parte inferior del cuerpo
        que un solo coletazo puede resultar devastador.
      it: |-
        Dopo l’evoluzione, è salito sulla terraferma.
        La parte inferiore del corpo si è rafforzata,
        rendendo i colpi della sua coda devastanti.
    shield:
      ja-Hrkt: |-
        りくちで　せいかつするが　およぎも
        とくい。　えものを　もとめて　うみに
        もぐり　するどい　ツメで　しとめる。
      ja: |-
        陸地で　生活するが　泳ぎも　得意。
        獲物を　求めて　海に　潜り
        鋭い　ツメで　しとめる。
      ko: |-
        육지에서 생활하지만 헤엄도 잘 친다.
        먹이를 찾아 바다로 잠수해
        날카로운 발톱으로 꼼짝 못 하게 한다.
      zh-Hant: |-
        生活在陸地上，但也擅長游泳。
        會為了尋找獵物而潛入海中，
        用銳利的爪子解決對方。
      zh-Hans: |-
        栖息在陆地，但也擅长游泳。
        会潜入大海寻找猎物，
        用锋利的爪子给予致命一击。
      en: |-
        Though it lives on land, it’s also a good swimmer.
        It dives into the ocean in search of prey, using its
        sharp claws to take down its quarry.
      fr: |-
        Bien que vivant sur la terre ferme, il est très
        bon nageur. Il plonge dans la mer à la recherche
        de proies et les abat avec ses pinces acérées.
      de: |-
        Es lebt an Land, kann aber auch gut schwimmen.
        Zum Jagen taucht es ins Meer und erledigt Beute
        mit seinen scharfen Klauen.
      es: |-
        Vive en tierra firme, pero es un hábil nadador.
        Se zambulle en el agua en busca de presas y las
        atrapa con sus afiladas pinzas.
      it: |-
        Vive sulla terraferma, ma è un abile nuotatore.
        Si tuffa in mare alla ricerca di prede, che abbatte
        con i suoi artigli affilati.
