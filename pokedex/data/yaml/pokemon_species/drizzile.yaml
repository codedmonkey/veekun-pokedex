drizzile:
  base_happiness: 50
  capture_rate: 45
  color: blue
  egg_groups:
    - water1
    - ground
  evolution_chain: sobble
  evolves_from: sobble
  flavor_text:
    sword:
      ja-Hrkt: |-
        ての　ひらから　でる　すいぶんを
        まるめて　つくった　みずの　たまを
        つかい　ずのうせんを　くりひろげる。
      ja: |-
        手のひらから　出る　水分を
        丸めて　つくった　水の　玉を
        使い　頭脳戦を　繰り広げる。
      ko: |-
        손바닥에서 나오는 수분을
        빚어서 만든 물구슬로
        두뇌 싸움을 펼친다.
      zh-Hant: |-
        很有戰略頭腦，
        會把手掌分泌出的水分
        做成水彈攻擊敵人。
      zh-Hans: |-
        很有战略头脑，
        会把手掌分泌出的水分
        做成水弹攻击敌人。
      en: |-
        A clever combatant, this Pokémon battles using
        water balloons created with moisture secreted
        from its palms.
      fr: |-
        Il crée des bombes à eau grâce au liquide
        qu’il sécrète avec la paume de ses mains.
        Il s’en sert dans les combats où la stratégie prime.
      de: |-
        Das Sekret, das aus seinen Handflächen austritt,
        formt es zu Wasserkugeln. Diese nutzt es im
        Kampf für taktisch ausgeklügelte Angriffe.
      es: |-
        Crea bolas de agua con el líquido que segrega
        por las palmas de las manos y las usa en combate
        de forma estratégica.
      it: |-
        Lotta in modo strategico servendosi di sfere
        che crea con l’acqua che fuoriesce dalle
        sue zampe.
    shield:
      ja-Hrkt: |-
        あたまが　よく　めんどうくさがり。
        ナワバリに　てきが　ちかづかないよう
        そこかしこに　ワナを　しかけている。
      ja: |-
        頭が　よく　面倒くさがり。
        縄張りに　敵が　近づかないよう
        そこかしこに　罠を　仕掛けている。
      ko: |-
        머리가 좋지만 귀찮음이 많다.
        영역에 적이 다가오지 못하게
        여기저기에 함정을 만들어 놓는다.
      zh-Hant: |-
        頭腦聰明但是很怕麻煩。
        為了不讓敵人接近自己的地盤，
        在各個地方都設下了陷阱。
      zh-Hans: |-
        头脑聪明但是怕麻烦。
        为了不让敌人接近自己的地盘，
        在各个地方都设下了陷阱。
      en: |-
        Highly intelligent but also very lazy,
        it keeps enemies out of its territory
        by laying traps everywhere.
      fr: |-
        Paresseux, mais malin, il parsème son territoire
        de pièges pour empêcher ses ennemis
        d’y pénétrer.
      de: |-
        Es ist intelligent, fühlt sich aber schnell von jeder
        Kleinigkeit genervt. Damit kein Feind in sein
        Revier eindringt, stellt es überall Fallen auf.
      es: |-
        Es inteligente, pero no muestra especial interés
        por nada. Distribuye trampas por su territorio
        para mantener alejados a sus enemigos.
      it: |-
        È intelligente ma svogliato. Dissemina di
        trappole il suo territorio per tenere alla
        larga i nemici.
