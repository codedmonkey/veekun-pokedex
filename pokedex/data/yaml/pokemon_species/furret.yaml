    white-2:
      en: |-
        The mother puts its offspring to
        sleep by curling up around them.
        It corners foes with speed.
    x:
      ja-Hrkt: |-
        ははおやは　ほそながい　からだで
        こどもを　つつみこみ　ねむらせる。
        はやい　うごきで　てきを　おいこむ。
      ja: |-
        母親は　細長い　体で
        子供を　包みこみ　眠らせる。
        速い　動きで　敵を　追いこむ。
      ko: |-
        엄마 포켓몬이 가늘고 긴 몸으로
        새끼를 감싸 안아 재운다. 빠른
        움직임으로 상대를 몰아붙인다.
      en: |-
        The mother puts its offspring to sleep by curling up
        around them. It corners foes with speed.
      fr: |-
        La femelle s’enroule autour des petits pour les bercer.
        Il accule l’ennemi grâce à sa vitesse.
      de: |-
        Es rollt sich um seine Jungen, wenn diese schlafen
        sollen. Gegnern begegnet es mit Schnelligkeit.
      es: |-
        Acurruca a sus crías para que duerman. Acorrala a los
        enemigos con su enorme velocidad.
      it: |-
        Si addormenta avvolto nell’esile corpo della madre.
        Mette all’angolo i nemici con movimenti rapidi.
    'y':
      ja-Hrkt: |-
        ほそながい　からだの　かたちに
        あわせた　すを　つくり　ほかの
        ポケモンは　はいれなくしている。
      ja: |-
        細長い　体の　形に
        合わせた　巣を　作り
        他の　ポケモンは　入れなくしている。
      ko: |-
        가늘고 긴 몸의 형태에
        맞춘 둥지를 만들어 다른
        포켓몬은 들어오지 못하게 한다.
      en: |-
        It makes a nest to suit its long and skinny body.
        The nest is impossible for other Pokémon to enter.
      fr: |-
        Il fabrique un nid qui convient à son corps très fin,
        et où lui seul peut entrer.
      de: |-
        Sein Nest ist seinem schmalen und dünnen Körper
        angepasst. Kein anderes Pokémon kommt hinein.
      es: |-
        Construye un nido donde introducir su largo y delgado
        cuerpo, en el que no pueden entrar otros Pokémon.
      it: |-
        Il suo nido è adatto al corpo lungo e magro.
        Gli altri Pokémon non riescono a entrarci.
    omega-ruby:
      ja-Hrkt: |-
        てきに　おそわれても　ほそい　すきまに
        するりと　もぐりこんで　にげる　ことが　できる。
        てあしは　みじかいが　とても　すばしっこい。
      ja: |-
        敵に　襲われても　細い　すき間に
        するりと　潜り込んで　逃げる　ことが　できる、
        手足は　短いが　とても　すばしっこい。
      ko: |-
        적에게 습격당해도 좁은 틈으로
        쑥 들어가서 도망갈 수 있다.
        팔다리는 짧지만 매우 날쌔다.
      en: |-
        Furret has a very slim build. When under attack, it can slickly
        squirm through narrow spaces and get away. In spite of its
        short limbs, this Pokémon is very nimble and fleet.
      fr: |-
        Fouinar est très mince. Lorsqu’il est attaqué, il peut
        s’enfuir en se faufilant habilement dans les recoins étroits.
        Malgré ses pattes courtes, ce Pokémon est très agile
        et rapide.
      de: |-
        Wiesenior ist sehr schlank. Wenn es angegriffen wird, kann es
        sich durch enge Zwischenräume schlängeln und entkommen.
        Trotz seiner kurzen Gliedmaßen ist dieses Pokémon sehr
        wendig und flink.
      es: |-
        Furret es de constitución muy delgada. En combate le resulta
        útil porque puede escabullirse con habilidad por cualquier
        huequito y escapar. A pesar de que tiene patas cortas, es ágil
        y veloz.
      it: |-
        Furret è di esile costituzione. Quando è attaccato riesce
        a scappare intrufolandosi in ogni fessura. Nonostante i suoi arti
        corti, questo Pokémon è molto agile e rapido nei movimenti.
    alpha-sapphire:
      ja-Hrkt: |-
