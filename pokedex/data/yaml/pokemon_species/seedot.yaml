    white-2:
      en: |-
        When it dangles from a tree
        branch, it looks just like an acorn.
        It enjoys scaring other Pokémon.
    x:
      ja-Hrkt: |-
        あたまの　さきを　えだに　くっつけて
        ぶらさがる。きょうふうに　あおられ
        おちてしまう　ことも　あるのだ。
      ja: |-
        頭の　先を　枝に　くっつけて
        ぶら下がる。強風に　あおられ
        落ちてしまう　ことも　あるのだ。
      ko: |-
        머리끝을 가지에 붙여
        매달린다. 강풍이 불어
        떨어지기도 한다.
      en: |-
        It attaches itself to a tree branch using the top of
        its head. Strong winds can sometimes make it fall.
      fr: |-
        Il se suspend aux branches par l’extrémité de sa tête.
        Il arrive qu’il tombe s’il est pris de panique.
      de: |-
        Mit dem Stiel auf seinem Kopf hängt es sich an Äste.
        Bei starkem Wind fällt es durchaus einmal herunter.
      es: |-
        Se cuelga de las ramas con el extremo de su cabeza.
        A veces se cae cuando soplan vientos fuertes.
      it: |-
        Si attacca ai rami degli alberi usando il picciolo che
        ha sul capo. Talvolta il vento lo fa cadere.
    'y':
      ja-Hrkt: |-
        えだに　ぶらさがっていると
        きのみに　そっくり。ついばもうとした
        ポケモンを　おどろかせて　よろこぶ。
      ja: |-
        枝に　ぶらさがっていると
        木の実に　そっくり。ついばもうとした
        ポケモンを　驚かせて　喜ぶ。
      ko: |-
        가지에 매달려 있으면 나무열매와
        똑 닮았다. 쪼아 먹으려 한
        포켓몬을 놀래주며 좋아한다.
      en: |-
        When it dangles from a tree branch, it looks just
        like an acorn. It enjoys scaring other Pokémon.
      fr: |-
        Il ressemble à un gland pendu à une branche.
        Il adore effrayer les autres Pokémon.
      de: |-
        Es sieht aus wie eine Eichel, die am Baum hängt.
        Es liebt es, andere Pokémon zu erschrecken.
      es: |-
        Cuando cuelga de las ramas, parece una bellota.
        Le encanta asustar a otros Pokémon.
      it: |-
        Quando si attacca a un ramo, sembra una vera
        ghianda. Si diverte a spaventare gli altri Pokémon.
    omega-ruby:
      ja-Hrkt: |-
        あたまの　てっぺんを　きの　えだに　くっつけて
        ぶらさがり　ながら　すいぶんを　すいとっている。
        みずを　のむほど　からだが　ツヤツヤ　ひかる。
      ja: |-
        頭の　てっぺんを　木の　枝に　くっつけて
        ぶら下がり　ながら　水分を　吸い取っている。
        水を　飲むほど　体が　ツヤツヤ　光る。
      ko: |-
        머리의 정수리를 나뭇가지에 붙이고
        매달려 수분을 빨아들이고 있다.
        물을 마실수록 몸이 반들반들 빛난다.
      en: |-
        Seedot attaches itself to a tree branch using the top of its
        head. It sucks moisture from the tree while hanging off the
        branch. The more water it drinks, the glossier this Pokémon’s
        body becomes.
      fr: |-
        Grainipiot s’accroche par la tête aux branches d’arbre.
        Il en profite alors pour absorber l’humidité de l’arbre.
        Plus ce Pokémon boit d’eau, plus son corps devient brillant.
      de: |-
        Samurzel hängt sich mit dem Kopf an einen Ast. Dabei entzieht
        es dem Baum Feuchtigkeit. Je mehr Wasser es trinkt, desto
        glänzender wird der Körper dieses Pokémon.
      es: |-
        Seedot se queda enganchado a las ramas de los árboles por el
        extremo que tiene en la cabeza. Mientras está ahí colgado,
        aprovecha para tomar la humedad del árbol. Cuanta más agua
        bebe, más lustroso se le ve.
      it: |-
        Seedot si attacca ai rami degli alberi usando il picciolo che ha
        sul capo. In questa posizione succhia l’umidità dell’albero
        per nutrirsi. Più acqua assume, più lucido appare il suo corpo.
    alpha-sapphire:
      ja-Hrkt: |-
        えだに　ぶらさがる　すがたは　きのみ　そっくり。
        いきなり　うごいて　ポケモンを　ビックリさせる。
        １にち　１かい　はっぱで　からだを　みがくよ。
      ja: |-
        枝に　ぶら下がる　姿は　きのみ　そっくり。
        いきなり　動いて　ポケモンを　ビックリさせる。
        １日　１回　葉っぱで　体を　磨くよ。
      ko: |-
        가지에 매달린 모습이 나무열매와 똑 닮았다.
        갑자기 움직여서 포켓몬을 놀라게 한다.
        하루에 한 번 잎사귀로 몸을 닦는다.
      en: |-
        Seedot looks exactly like an acorn when it is dangling from a
        tree branch. It startles other Pokémon by suddenly moving.
        This Pokémon polishes its body once a day using leaves.
      fr: |-
        Grainipiot ressemble à s’y méprendre à un gland quand
        il s’accroche à une branche. Il effraie les autres Pokémon
        quand il se met à bouger. Ce Pokémon se lustre le corps
        une fois par jour avec des feuilles.
      de: |-
        Samurzel sieht aus wie eine Eichel, wenn es an einem
        Ast hängt. Es erschreckt andere Pokémon, indem es sich
        dann plötzlich bewegt. Dieses Pokémon poliert seinen
        Körper einmal am Tag mit Blättern.
      es: |-
        Seedot es igualito a una bellota colgada de la rama de un
        árbol. A veces asusta a más de un Pokémon con movimientos
        repentinos. Seedot suele acicalarse con hojas una vez al día.
      it: |-
        Seedot è molto simile a una ghianda penzolante da
        un ramo. È solito spaventare gli altri Pokémon con
        movimenti improvvisi. Lucida il proprio corpo una volta
        al giorno usando delle foglie.
    sword:
      ja-Hrkt: |-
        じっと　うごかずに　いると　きのみと
        そっくり。　ついばみに　やってきた
        ポケモンを　おどろかせて　あそぶ。
      ja: |-
        じっと　動かずに　いると　木の実と
        そっくり。　ついばみに　やって来た
        ポケモンを　驚かせて　遊ぶ。
      ko: |-
        가만히 움직이지 않고 있으면
        나무열매와 똑같이 생겼다.
        먹으러 온 포켓몬을 놀라게 하면서 논다.
      zh-Hant: |-
        在牠一動也不動的時候，
        看起來和樹果一模一樣，
        以嚇唬來啄食自己的寶可夢為樂。
      zh-Hans: |-
        在它一动不动的时候，
        看上去和树果没有分别。
        以吓唬来啄食自己的宝可梦为乐。
      en: |-
        If it remains still, it looks just like a real nut.
        It delights in surprising foraging Pokémon.
      fr: |-
        S’il reste immobile, il a l’air d’une Baie.
        Il adore surprendre les Pokémon qui tentent
        de le picorer.
      de: |-
        Zeigt es sich regungslos, kann man es nicht von
        echten Nüssen unterscheiden. Es überrascht
        liebend gern Pokémon, die es aufpicken wollen.
      es: |-
        Cuando se queda inmóvil, parece una bellota
        de verdad. Le encanta sorprender a los Pokémon
        que se acercan a picotearlo.
      it: |-
        Quando è immobile è identico a una ghianda.
        Si diverte a sorprendere i Pokémon che si
        avvicinano con l’intenzione di beccarlo.
    shield:
      ja-Hrkt: |-
        あたまの　さきを　えだに　くっつけて
        ぶらさがる。　きょうふうに　あおられ
        おちてしまう　ことも　あるのだ。
      ja: |-
        頭の　先を　枝に　くっつけて
        ぶら下がる。　強風に　あおられ
        落ちてしまう　ことも　あるのだ。
      ko: |-
        머리끝을 가지에 붙여
        매달린다. 강풍이 불면
        떨어지기도 한다.
      zh-Hant: |-
        會將頭頂黏在樹枝上
        懸掛著。也有被大風
        吹落的時候。
      zh-Hans: |-
        会将头顶粘在树枝上悬挂着。
        也有被大风吹落的时候。
      en: |-
        It attaches itself to a tree branch using the top of
        its head. Strong winds can sometimes make it fall.
      fr: |-
        Il se suspend aux branches par l’extrémité
        de sa tête. Il arrive qu’une bourrasque
        le fasse tomber.
      de: |-
        Mit dem Stiel auf seinem Kopf hängt es sich an
        Äste. Bei starkem Wind kann es durchaus mal
        herunterfallen.
      es: |-
        Se cuelga de las ramas con el extremo de la
        cabeza. A veces se cae cuando soplan vientos
        fuertes.
      it: |-
        Si attacca ai rami degli alberi usando il picciolo
        che ha sul capo. Talvolta il vento lo fa cadere.
