        Ils brouillent les télévisions.
    black-2:
      en: |-
        The stronger electromagnetic waves
        from the three linked Magnemite are
        enough to dry out surrounding moisture.
    white-2:
      en: |-
        The stronger electromagnetic waves
        from the three linked Magnemite are
        enough to dry out surrounding moisture.
    x:
      ja-Hrkt: |-
        ふくすうの　コイルが　れんけつして
        きょうりょくな　じりょくせんと
        こうでんあつを　ほうしゃする。
      ja: |-
        複数の　コイルが　連結して
        強力な　磁力線と
        高電圧を　放射する。
      ko: |-
        다수의 코일이 연결되어
        강력한 자기장과
        높은 전압을 방사한다.
      en: |-
        A linked cluster formed of several Magnemite.
        It discharges powerful magnetic waves at
        high voltage.
      fr: |-
        Ce Pokémon est composé de plusieurs Magnéti.
        Il est capable de projeter de puissantes décharges
        magnétiques à haute tension.
      de: |-
        Schließen sich mehrere Magnetilo zusammen,
        entsteht dieses Pokémon. Es entlädt kräftige
        Hochspannungsmagnetwellen.
      es: |-
        Lo constituye un grupo de Magnemite. Descarga
        potentes ondas magnéticas de alto voltaje.
      it: |-
        Formato da vari Magnemite, è in grado di lanciare
        onde magnetiche ad alto voltaggio.
    'y':
      ja-Hrkt: |-
        なぞのでんぱを　はっしんしており
        はんけい　１キロのはんいでは
        きおんが　２ど　あがる。
      ja: |-
        ナゾの　電波を　発信しており
        半径１キロの　範囲では
        気温が　２度　上がる。
      ko: |-
        알 수 없는 전파를 발신하고 있어
        반경 1km 범위는
        기온이 2도 오른다.
      en: |-
        Generates strange radio signals. It raises the
        temperature by 3.6 degrees Fahrenheit within
        3,300 feet.
      fr: |-
        Il émet un signal radio étrange. Sa présence
        augmente la température de 1 °C dans un rayon
        de 1 000 m.
      de: |-
        Dieses Pokémon erzeugt seltsame Radiowellen
        und kann die Lufttemperatur geringfügig anheben.
      es: |-
        Es capaz de elevar 2 °C la temperatura en un radio
        de un kilómetro emitiendo extrañas ondas
        electromagnéticas.
      it: |-
        Produce strane onde radio con cui può aumentare
        la temperatura atmosferica di qualche grado.
    omega-ruby:
      ja-Hrkt: |-
        つよい　じりょくで　きかいを　こわしてしまうので
        おおきな　まちでは　サイレンを　ならして
        レアコイルの　たいりょう　はっせいを　しらせる。
      ja: |-
        強い　磁力で　機械を　壊してしまうので
        大きな　街では　サイレンを　鳴らして
        レアコイルの　大量　発生を　報せる。
      ko: |-
        강한 자력으로 기계를 망가트리기 때문에
        큰 마을에서는 사이렌을 울려
        레어코일의 대량 발생을 알린다.
      en: |-
        Magneton emits a powerful magnetic force that is fatal to
        mechanical devices. As a result, large cities sound sirens
        to warn citizens of large-scale outbreaks of this Pokémon.
      fr: |-
        Magnéton émet un puissant champ magnétique qui neutralise
        les appareils mécaniques. Lorsque ces Pokémon débarquent
        en masse, les villes sonnent l’alarme et préviennent les
        habitants.
      de: |-
        Magneton erzeugt ein sehr starkes Magnetfeld,
        das Maschinen zerstören kann. Deshalb hört man
        in großen Städten oft Sirenen, die die Bürger vor
        Scharen dieser Pokémon warnen sollen.
      es: |-
        Magneton emite una fuerte energía magnética que causa
        estragos en los instrumentos mecánicos. Por ello, en las
        ciudades se avisa con sirenas cuando hay concentraciones de
        estos Pokémon.
      it: |-
        Magneton emette una potente carica magnetica fatale per
        tutte le apparecchiature meccaniche. Nelle città, le sirene
        avvertono la popolazione di grandi invasioni di
        questi Pokémon.
    alpha-sapphire:
      ja-Hrkt: |-
        きょうりょくな　じりょくせんで　せいみつきかいを
        こわしてしまうため　モンスターボールに　いれて
        おかないと　ちゅういされる　まちも　あるという。
      ja: |-
        強力な　磁力線で　精密機械を
        壊してしまうため　モンスターボールに　入れて
        おかないと　注意される　街も　あるという。
      ko: |-
        강력한 자기장이 정밀 기계를
        망가트리기 때문에 몬스터볼에 넣어
        두지 않으면 주의를 받는 마을도 있다고 한다.
      en: |-
        Magneton emits a powerful magnetic force that is fatal to
        electronics and precision instruments. Because of this, it is
        said that some towns warn people to keep this Pokémon
        inside a Poké Ball.
      fr: |-
        Magnéton émet un puissant champ magnétique qui neutralise
        les appareils électroniques. Certaines villes demandent
        aux propriétaires de ces Pokémon de les garder dans
        leurs Poké Balls.
      de: |-
        Magneton strahlt eine starke magnetische Energie ab,
        die für elektronische Geräte und Präzisionsinstrumente
        sehr schädlich ist. In einigen Städten werden die Bewohner
        gebeten, dieses Pokémon in einem Pokéball zu halten.
      es: |-
        Magneton emite una fuerte energía magnética, fatal para los
        instrumentos electrónicos y de precisión. Este es el motivo por
        el que, dicen, mucha gente mantiene a este Pokémon en su
        Poké Ball.
      it: |-
        Magneton emette una potente carica magnetica fatale per
        gli strumenti elettronici e di precisione. Per questo motivo
        molte città impongono ai cittadini di tenere questi Pokémon
        nelle Poké Ball.
    sun:
      ja-Hrkt: |-
        れんけつするとき　３びきのコイルの
        のうも　ひとつに　れんけつする。
        ３ばい　かしこくなりは　しない。
      ja: |-
        連結するとき　３匹のコイルの
        脳も　一つに　連結する。
        ３倍　賢くなりは　しない。
      ko: |-
        연결할 때 3마리의 코일의
        뇌도 하나로 연결된다.
        3배로 똑똑해지지는 않는다.
      zh-Hant: |-
        結合的時候，３隻小磁怪的
        腦袋也會連成一個。
        但並不會變得３倍聰明。
      zh-Hans: |-
        连接的时候，３只小磁怪的
        脑袋也会连成一体。
        但并不会变得３倍聪明。
      en: |-
        When three Magnemite link together, their brains
        also become one. They do not become three
        times more intelligent.
      fr: |-
        Lorsque trois Magnéti fusionnent, leurs cerveaux
        fusionnent aussi. Mais cela ne signifie pas que
        Magnéton est trois fois plus intelligent.
      de: |-
        Drei Magnetilo schließen sich zusammen und
        vereinigen ihre Gehirne. Das heißt aber nicht,
        dass dieses Pokémon dreimal so schlau wird.
      es: |-
        Cuando tres Magnemite se unen, sus cerebros
        se convierten en uno. No obstante, su
        inteligencia no se multiplica por tres.
      it: |-
        Quando tre Magnemite formano un Magneton,
        anche il loro cervello si fonde. Ma non significa
        che Magneton è tre volte più intelligente.
    moon:
      ja-Hrkt: |-
        ほぼ　コイル　３ばいの　でんりょく。
        たいようのこくてんが　おおいとき
        なぜか　たいりょうはっせい。
      ja: |-
        ほぼ　コイル　３倍の　電力。
        太陽の黒点が　多いとき
        なぜか　大量発生。
      ko: |-
        거의 코일의 3배의 전력이다.
        태양의 흑점이 많을 때
        어찌 된 일인지 대량 발생한다.
      zh-Hant: |-
        大約有小磁怪３倍的電力。
        太陽黑子多的時候，
        不知為何會大量出現。
      zh-Hans: |-
        大约有小磁怪３倍的电力。
        不知为何会在太阳黑子
        多的时候大量出现。
      en: |-
        It has about three times the electrical power of
        Magnemite. For some reason, outbreaks of this
        Pokémon happen when lots of sunspots appear.
      fr: |-
        Il possède le triple de la puissance d’un Magnéti.
        Il en apparaît beaucoup lorsque les taches
        solaires sont nombreuses.
      de: |-
        Seine Stromstärke ist fast dreimal so hoch wie
        die eines Magnetilos. Es erscheint vermehrt,
        wenn Flecken auf der Sonne auftauchen.
      es: |-
        Su poder eléctrico es unas tres veces superior
        al de Magnemite. Aparecen en gran cantidad
        cuando se vislumbran muchas manchas solares.
      it: |-
        Ha una potenza elettrica tre volte superiore a
        quella di Magnemite. Si registrano comparse
        massicce quando ci sono molte macchie solari.
    ultra-sun:
      ja-Hrkt: |-
        なぞの　でんぱを　はっしん　しており
        レアコイルが　すんでいる　ばしょでは
        せいみつききが　こしょうしてしまう。
      ja: |-
        謎の　電波を　発信　しており
        レアコイルが　棲んでいる　場所では
        精密機器が　故障してしまう。
      ko: |-
        정체 모를 전파를 발신하기 때문에
        레어코일이 사는 곳에는
        정밀 기기가 고장 난다.
      zh-Hant: |-
        會發出神秘的電波。
        在三合一磁怪棲息的地方，
        精密機器會發生故障。
      zh-Hans: |-
        会发出神秘的电波，
        在三合一磁怪栖息的地方，
        精密机器会发生故障。
      en: |-
        Delicate equipment can malfunction in areas
        inhabited by Magneton, which send out
        mysterious electrical signals.
      fr: |-
        Les Magnéton émettent d’étranges ondes,
        et les appareils de précision ont tendance
        à tomber en panne à leur approche.
      de: |-
        Es erzeugt seltsame Radiowellen, die Störungen
        an Präzisionsinstrumenten in seiner Umgebung
        verursachen.
      es: |-
        Las misteriosas ondas eléctricas que emiten
        provocan toda clase de averías en la electrónica
        de precisión allí donde viven.
      it: |-
        Nelle zone abitate dai Magneton, i dispositivi
        di precisione spesso si guastano a causa delle
        strane onde prodotte da questi Pokémon.
    ultra-moon:
      ja-Hrkt: |-
        あまぐもが　できると　たかいところに
        あつまってくる。　かみなりが
        おちるのを　まっているのだ。
      ja: |-
        雨雲が　できると　高いところに
        集まってくる。　雷が
        落ちるのを　待っているのだ。
      ko: |-
        비구름이 생기면 높은 곳에
        모여든다. 번개가 치기를
        기다리는 것이다.
      zh-Hant: |-
        當天空中出現雨雲時，
        牠們就會聚集在高處，
        等待著天上落下雷電。
      zh-Hans: |-
        雨云形成后，
        它们就会聚集在高处，
        等待着从天上落下雷电。
      en: |-
        When rain clouds form, many Magneton gather
        in high places to wait for lightning to strike.
      fr: |-
        Quand de gros nuages de pluie s’amoncellent
        dans le ciel, les Magnéton se rassemblent
        sur les hauteurs pour attendre la foudre.
      de: |-
        Ziehen Regenwolken auf, versammeln sich
        Magneton in großer Höhe und warten darauf,
        dass der Blitz einschlägt.
      es: |-
        Cuando se forman nubes de tormenta, se
        congregan en las alturas aguardando a que
        caigan rayos.
      it: |-
        Quando il cielo si copre di nuvole temporalesche,
        i Magneton si raggruppano in luoghi sopraelevati
        in attesa dei fulmini.
    lets-go-pikachu:
      ja-Hrkt: |-
        なぞのでんぱを　はっしんしており
        はんけい　１キロのはんいでは
        きおんが　２ど　あがる。
      ja: |-
        謎の電波を　発信しており
        半径　１キロの範囲では
        気温が　２度　上がる。
      ko: |-
        알 수 없는 전파를 발신하고 있어
        반경 1km 범위는
        기온이 2도 오른다.
      zh-Hant: |-
        會發出神秘的電波，
        使半徑１公里範圍內的
        氣溫提高２度。
      zh-Hans: |-
        在它发射出神秘电波后，
        方圆１千米以内的
        气温会上升２度。
      en: |-
        Generates strange radio signals. It raises
        the temperature by 3.6 degrees Fahrenheit
        within 3,300 feet.
      fr: |-
        Il émet un signal radio étrange. Sa présence
        augmente la température de 2 ºC dans un rayon
        de 1 000 m.
      de: |-
        Es erzeugt seltsame Radiowellen, durch welche
        die Lufttemperatur in einem Radius von 1 km
        um 2 ºC steigt.
      es: |-
        Es capaz de elevar 2 °C la temperatura en
        un radio de 1 km emitiendo extrañas ondas
        electromagnéticas.
      it: |-
        Emette strane onde radio che fanno aumentare
        la temperatura atmosferica di 2 ºC nel raggio
        di 1 km.
    lets-go-eevee:
      ja-Hrkt: |-
        なぞのでんぱを　はっしんしており
        はんけい　１キロのはんいでは
        きおんが　２ど　あがる。
      ja: |-
        謎の電波を　発信しており
        半径　１キロの範囲では
        気温が　２度　上がる。
      ko: |-
        알 수 없는 전파를 발신하고 있어
        반경 1km 범위는
        기온이 2도 오른다.
      zh-Hant: |-
        會發出神秘的電波，
        使半徑１公里範圍內的
        氣溫提高２度。
      zh-Hans: |-
        在它发射出神秘电波后，
        方圆１千米以内的
        气温会上升２度。
      en: |-
        Generates strange radio signals. It raises
        the temperature by 3.6 degrees Fahrenheit
        within 3,300 feet.
      fr: |-
        Il émet un signal radio étrange. Sa présence
        augmente la température de 2 ºC dans un rayon
        de 1 000 m.
      de: |-
        Es erzeugt seltsame Radiowellen, durch welche
        die Lufttemperatur in einem Radius von 1 km
        um 2 ºC steigt.
      es: |-
        Es capaz de elevar 2 °C la temperatura en
        un radio de 1 km emitiendo extrañas ondas
        electromagnéticas.
      it: |-
        Emette strane onde radio che fanno aumentare
        la temperatura atmosferica di 2 ºC nel raggio
        di 1 km.
    sword:
      ja-Hrkt: |-
        ３びきの　コイルが　れんけつした。
        きょうりょくな　でんぱを　はなち
        まわりの　ようすを　かんそくする。
      ja: |-
        ３匹の　コイルが　連結した。
        強力な　電波を　放ち
        まわりの　様子を　観測する。
      ko: |-
        3마리의 코일이 연결되었다.
        강력한 전파를 발산해
        주위의 상황을 관측한다.
      zh-Hant: |-
        由３隻小磁怪連結而成。
        會發射出強烈的電波
        來觀測周圍的狀況。
      zh-Hans: |-
        ３只小磁怪连在了一起。
        会通过放出强力的电波
        来观测周围的状况。
      en: |-
        This Pokémon is three Magnemite that have
        linked together. Magneton sends out powerful
        radio waves to study its surroundings.
      fr: |-
        La fusion de trois Magnéti a donné naissance
        à ce Pokémon. Il surveille les alentours en
        libérant de puissantes ondes électriques.
      de: |-
        Es entsteht durch den Zusammenschluss dreier
        Magnetilo und sendet starke Radiowellen aus,
        um seine Umgebung zu untersuchen.
      es: |-
        Este Pokémon, surgido de la unión de tres
        Magnemite, genera potentes ondas de radio
        con las que examina el entorno.
      it: |-
        È formato dall’unione di tre Magnemite.
        Esamina i dintorni emettendo potenti onde radio.
    shield:
      ja-Hrkt: |-
        つよい　じりょくを　たえず　はなつ。
        レアコイルが　ちかづくと　たいていの
        コンピュータは　いじょうを　きたす。
      ja: |-
        強い　磁力を　たえず　放つ。
        レアコイルが　近づくと　大抵の
        コンピュータは　異常を　きたす。
      ko: |-
        강한 자력을 끊임없이 발산한다.
        레어코일이 접근하면 대부분의
        컴퓨터에 이상 현상이 발생한다.
      zh-Hant: |-
        隨時都釋放著很強的磁力。
        只要三合一磁怪一靠近，
        大多數的電腦都會出現異常。
      zh-Hans: |-
        会不断释放很强的的磁力。
        在三合一磁怪接近时，大多数
        电脑都会发生异常情况。
      en: |-
        This Pokémon is constantly putting out a powerful
        magnetic force. Most computers go haywire when
        a Magneton approaches.
      fr: |-
        Il émet constamment une énergie magnétique
        puissante qui interfère avec la grande majorité
        des ordinateurs dont il s’approche.
      de: |-
        Es sondert stetig seine starken Magnetkräfte ab,
        sodass bei den meisten Computern Störungen
        auftreten, wenn es sich in deren Nähe aufhält.
      es: |-
        Emite de forma constante una potente fuerza
        magnética que causa estragos en prácticamente
        cualquier ordenador al que se acerque.
      it: |-
        Produce costantemente una potente carica
        magnetica che causa malfunzionamenti
        nella maggior parte dei computer.
