talonflame:
  base_happiness: 50
  capture_rate: 45
  color: red
  egg_groups:
    - flying
  evolution_chain: fletchling
  evolves_from: fletchinder
  flavor_text:
    x:
      ja-Hrkt: |-
        はげしい　たたかいで　こうふんすると
        ぜんしんの　うもうの　すきまから
        ひのこを　ふきだして　ひこうする。
      ja: |-
        激しい　戦いで　興奮すると
        全身の　羽毛の　すきまから
        火の粉を　噴き出して　飛行する。
      ko: |-
        격렬한 싸움으로 흥분하게 되면
        온몸의 깃털 사이에서
        불꽃을 뿜어내며 비행한다.
      en: |-
        In the fever of an exciting battle, it
        showers embers from the gaps between
        its feathers and takes to the air.
      fr: |-
        Exalté par un combat sans merci, il s’envole en
        semant dans son sillage les escarbilles du feu qui
        couve dans son plumage.
      de: |-
        Die Aufregung eines harten Kampfes veranlasst es
        dazu, im Flug Funken aus den Zwischenräumen
        seines Gefieders zu sprühen.
      es: |-
        Si se exalta durante un combate reñido, arroja chispas
        y ascuas de los intersticios entre su plumaje
        mientras vuela.
      it: |-
        Durante lotte senza esclusione di colpi, spicca il
        volo sprizzando scintille dalle fessure che ha tra
        le piume.
    'y':
      ja-Hrkt: |-
        えものに　おそいかかるときの
        スピードは　じそく５００キロ。
        きょうれつな　キックで　しとめる。
      ja: |-
        獲物に　襲いかかるときの
        スピードは　時速５００キロ。
        強烈な　キックで　しとめる。
      ko: |-
        사냥감을 덮칠 때의
        스피드는 시속 500km이다.
        강렬한 킥으로 꼼짝 못하게 한다.
      en: |-
        When attacking prey, it can reach speeds
        of up to 310 mph. It finishes its prey off
        with a colossal kick.
      fr: |-
        Quand il s’abat sur ses proies, sa vitesse dépasse
        les 500 km/h. Il les achève d’un puissant coup de
        serre.
      de: |-
        Bei der Jagd erreicht es Geschwindigkeiten von bis zu
        500 km/h. Es erledigt seine Beute mit einem kräftigen
        Tritt.
      es: |-
        Llega a alcanzar los 500 km/h al perseguir a su presa,
        a quien le asesta el golpe de gracia con una patada
        muy potente.
      it: |-
        Piomba sulle prede a 500 km/h e le attacca con
        artigli potentissimi.
    omega-ruby:
      ja-Hrkt: |-
        はげしい　たたかいで　こうふんすると
        ぜんしんの　うもうの　すきまから
        ひのこを　ふきだして　ひこうする。
      ja: |-
        激しい　戦いで　興奮すると
        全身の　羽毛の　すきまから
        火の粉を　噴き出して　飛行する。
      ko: |-
        격렬한 싸움으로 흥분하게 되면
        온몸의 깃털 사이에서
        불꽃을 뿜어내며 비행한다.
      en: |-
        In the fever of an exciting battle, it
        showers embers from the gaps between
        its feathers and takes to the air.
      fr: |-
        Exalté par un combat sans merci, il s’envole en semant
        dans son sillage les escarbilles du feu qui couve dans
        son plumage.
      de: |-
        Die Aufregung eines harten Kampfes veranlasst es dazu,
        im Flug Funken aus den Zwischenräumen seines Gefieders
        zu sprühen.
      es: |-
        Si se exalta durante un combate reñido, arroja chispas y
        ascuas de los intersticios entre su plumaje mientras vuela.
      it: |-
        Durante lotte senza esclusione di colpi, spicca il volo
        sprizzando scintille dalle fessure che ha tra le piume.
    alpha-sapphire:
      ja-Hrkt: |-
        えものに　おそいかかるときの
        スピードは　じそく５００キロ。
        きょうれつな　キックで　しとめる。
      ja: |-
        獲物に　襲いかかるときの
        スピードは　時速５００キロ。
        強烈な　キックで　しとめる。
      ko: |-
        사냥감을 덮칠 때의
        스피드는 시속 500km이다.
        강렬한 킥으로 꼼짝 못하게 한다.
      en: |-
        When attacking prey, it can reach speeds
        of up to 310 mph. It finishes its prey off
        with a colossal kick.
      fr: |-
        Quand il s’abat sur ses proies, sa vitesse dépasse
        les 500 km/h. Il les achève d’un puissant coup de serre.
      de: |-
        Bei der Jagd erreicht es Geschwindigkeiten von bis zu
        500 km/h. Es erledigt seine Beute mit einem kräftigen Tritt.
      es: |-
        Llega a alcanzar los 500 km/h al perseguir a su presa, a
        quien le asesta el golpe de gracia con una patada muy
        potente.
      it: |-
        Piomba sulle prede a 500 km/h e le attacca con artigli
        potentissimi.
    sun:
      ja-Hrkt: |-
        こうぶつは　キャモメや　ツツケラ。
        きょうれつな　キックを　おみまいし
        するどいツメで　がっちり　キャッチ。
      ja: |-
        好物は　キャモメや　ツツケラ。
        強烈な　キックを　お見舞いし
        鋭いツメで　がっちり　キャッチ。
      ko: |-
        좋아하는 것은 갈모매와 콕코구리다.
        강렬한 킥으로 타격을 가하고
        날카로운 발톱으로 꽉 잡는다.
      zh-Hant: |-
        喜歡吃長翅鷗和小篤兒。
        會對獵物施展猛烈的踢腿，
        再用銳利的爪子牢牢抓住。
      zh-Hans: |-
        喜欢吃的是长翅鸥和小笃儿。
        会施展猛烈的踢腿，
        用锐利的爪子牢牢抓住。
      en: |-
        Its favorite foods are Wingull and Pikipek.
        It attacks with a powerful kick and grasps them
        firmly in its talons.
      fr: |-
        Il raffole des Goélise et des Picassaut.
        Il déstabilise ses proies d’un bon coup de patte
        avant de les capturer avec ses serres acérées.
      de: |-
        Auf seinem Speiseplan stehen bevorzugt Wingull
        und Peppeck. Es schaltet seine Beute mit einem
        kräftigen Tritt aus, um sie sich dann zu krallen.
      es: |-
        Wingull y Pikipek son sus presas favoritas.
        Les asesta un potente golpe y después las
        atrapa sin remisión con sus garras afiladas.
      it: |-
        È ghiotto di Wingull e Pikipek.
        Stordisce le prede con potenti zampate e poi
        le afferra saldamente con i suoi artigli aguzzi.
    moon:
      ja-Hrkt: |-
        はねの　すきまから　ひのこを
        ふきだしながら　じそく５００キロで
        えものに　むかって　いっちょくせん。
      ja: |-
        羽の　すき間から　火の粉を
        吹きだしながら　時速５００キロで
        獲物に　向かって　一直線。
      ko: |-
        깃털 사이로 불꽃을 뿜어내며
        시속 500km로 먹이를 향해
        똑바로 날아간다.
      zh-Hant: |-
        從翅膀的縫隙裡噴出火花，
        同時以５００公里的時速
        直線衝向獵物。
      zh-Hans: |-
        从翅膀的缝隙里喷出火花，
        同时以５００公里的时速
        呈一直线冲向猎物。
      en: |-
        It zooms directly at its prey at flight speeds of
        close to 310 mph, while fiery embers scatter
        from gaps in its feathers.
      fr: |-
        Il fond sur ses proies en piqué à 500 km/h,
        semant derrière lui une pluie d’escarbilles
        échappées de ses ailes.
      de: |-
        Bei bis zu 500 km/h sprüht es im Flug Funken
        aus den Zwischenräumen seines Gefieders und
        stürzt sich schnurstracks auf seine Beute.
      es: |-
        Se abalanza en línea recta sobre su presa a una
        velocidad de 500 km/h mientras arroja chispas
        y ascuas de los intersticios entre su plumaje.
      it: |-
        Piomba dritto sulle prede a 500 km/h,
        sprizzando scintille dalle fessure che ha
        tra le piume.
    ultra-sun:
      ja-Hrkt: |-
        はねは　ひを　とおさず　じょうぶ。
        むかしの　しょうぼうしの　ふくは
        ファイアローの　はねで　できていた。
      ja: |-
        羽は　火を　通さず　丈夫。
        昔の　消防士の　服は
        ファイアローの　羽で　できていた。
      ko: |-
        날개는 불이 붙지 않고 튼튼하다.
        옛날에는 소방관들의 옷을
        파이어로의 날개로 만들었다.
      zh-Hant: |-
        羽毛很結實而且能夠防火。
        在過去消防隊員的制服
        是用烈箭鷹的羽毛製成的。
      zh-Hans: |-
        羽毛很结实，连火都烧不穿。
        过去的消防员服就是用
        烈箭鹰的羽毛做成的。
      en: |-
        Its tough wings don’t allow fire to pass through
        them. A long time ago, firefighters’ outfits were
        made from Talonflame wings.
      fr: |-
        Son plumage résistant est ignifugé.
        Jadis, la combinaison portée par les pompiers
        était faite de plumes de Flambusard.
      de: |-
        Sein Gefieder ist robust und feuerfest. Früher
        fertigte man Feuerwehranzüge deshalb aus
        Fiaro-Federn.
      es: |-
        Sus alas son resistentes al fuego, por lo que se
        solían usar sus plumas para confeccionar trajes
        de bombero.
      it: |-
        Le sue ali sono robuste e ignifughe.
        In passato le divise dei pompieri venivano
        fabbricate con le sue piume.
    ultra-moon:
      ja-Hrkt: |-
        とりポケモンが　おもな　えもの。
        きゅうせっきんからの　ちからづよい
        キックで　じめんに　たたきおとす。
      ja: |-
        とりポケモンが　主な　獲物。
        急接近からの　力強い
        キックで　地面に　叩き落す。
      ko: |-
        새포켓몬이 주된 먹이다.
        갑자기 접근한 뒤 강력한
        킥으로 땅에 떨어뜨린다.
      zh-Hant: |-
        主要的獵物是鳥寶可夢。
        會急速接近對手，然後用
        猛烈的腳踢把對手擊落到地面。
      zh-Hans: |-
        鸟宝可梦是它的主要猎物。
        用迅速接近后的强力踢
        将对方打落到地面。
      en: |-
        Bird Pokémon make up most of its diet.
        It approaches at high speeds and smacks them
        down to the ground with its powerful kick.
      fr: |-
        La plupart de ses proies sont des Pokémon
        oiseaux. Il surgit sans prévenir et propulse
        sa victime au sol d’un puissant coup de patte.
      de: |-
        Fiaro ernährt sich vor allem von Vogel-Pokémon.
        Es nähert sich überfallartig seiner Beute und
        befördert sie mit einem kräftigen Tritt zu Boden.
      es: |-
        Su presa favorita son los Pokémon pájaro, a los
        cuales se acerca a velocidades vertiginosas y
        derriba con la temible potencia de sus patas.
      it: |-
        Caccia soprattutto Pokémon alati. Si avvicina
        rapido alla preda e l’abbatte con un calcio
        potentissimo, facendola precipitare al suolo.
    sword:
      ja-Hrkt: |-
        とりポケモンが　おもな　えもの。
        うもうの　あいだから　ひのこを
        ふきだし　あいてを　いかくする。
      ja: |-
        鳥ポケモンが　おもな　獲物。
        羽毛の　あいだから　火の粉を
        噴き出し　相手を　威嚇する。
      ko: |-
        새포켓몬이 주요 먹이다.
        깃털 사이로 불똥을
        뿜어내며 상대를 위협한다.
      zh-Hant: |-
        主要的獵物是鳥寶可夢。
        會從羽毛的縫隙裡噴出
        火花威嚇對手。
      zh-Hans: |-
        主要以鸟宝可梦为食。
        会从羽毛的缝隙里
        喷出火花来威吓对手。
      en: |-
        Talonflame mainly preys upon other bird
        Pokémon. To intimidate opponents, it sends
        embers spewing from gaps between its feathers.
      fr: |-
        Flambusard chasse surtout les Pokémon oiseaux.
        Il intimide ses adversaires en produisant
        des étincelles avec son plumage.
      de: |-
        Fiaro ernährt sich vor allem von Vogel-Pokémon.
        Aus den Zwischenräumen seines Gefieders sprüht
        es Funken, um seine Gegner einzuschüchtern.
      es: |-
        Su presa predilecta son los Pokémon pájaro.
        Intimida a sus rivales lanzando ascuas desde
        los intersticios de su plumaje.
      it: |-
        Caccia soprattutto Pokémon alati.
        Intimorisce il bersaglio sprizzando scintille
        dalle fessure che ha tra le piume.
    shield:
      ja-Hrkt: |-
        じそく５００キロで　とつげき。
        えものが　にげるすきを　あたえずに
        きょうれつな　けりで　しとめる。
      ja: |-
        時速５００キロで　突撃。
        獲物が　逃げるすきを　与えずに
        強烈な　蹴りで　しとめる。
      ko: |-
        시속 500km로 돌격한다.
        먹이가 도망칠 틈을 주지 않고
        강렬한 발차기로 꼼짝 못 하게 한다.
      zh-Hant: |-
        會以時速５００公里的速度
        進行突擊。對手連逃跑都來不及
        就被牠猛烈的腳踢給解決了。
      zh-Hans: |-
        会以５００公里的时速进行突击。
        不给猎物留下逃跑的机会，
        直接以猛烈的踢击将其解决。
      en: |-
        Talonflame dives toward prey at speeds of up to
        310 mph and assaults them with powerful kicks,
        giving the prey no chance to escape.
      fr: |-
        Flambusard attaque à une vitesse de 500 km/h.
        Il achève ses proies d’un puissant coup de patte
        sans leur laisser la moindre chance de fuir.
      de: |-
        Fiaro greift mit einer Geschwindigkeit von bis zu
        500 km/h an. Mit einem kräftigen Tritt erlegt es
        seine Beute und gibt ihr keine Chance zur Flucht.
      es: |-
        Arremete contra sus presas a una velocidad de
        500 km/h y les asesta el golpe de gracia con una
        patada muy potente, sin dejarles escapatoria.
      it: |-
        Piomba sulle prede a 500 km/h e le attacca
        con calci potentissimi senza dargli via di scampo.
