cranidos:
  base_happiness: 70
  capture_rate: 45
  color: blue
  egg_groups:
    - monster
  evolution_chain: cranidos
  evolves_from: ~
  flavor_text:
    diamond:
      en: |-
        It lived in jungles around 100
        million years ago. Its skull is as
        hard as iron.
    pearl:
      en: |-
        It was resurrected from an iron
        ball-like fossil. It downs prey with
        its head butts.
    platinum:
      en: |-
        A lifelong jungle dweller from 100
        million years ago, it would snap
        obstructing trees with head butts.
    heartgold:
      en: |-
        CRANIDOS toughen up their already
        rock-hard heads by headbutting
        one another.
    soulsilver:
      en: |-
        CRANIDOS toughen up their already
        rock-hard heads by headbutting
        one another.
    black:
      en: |-
        A lifelong jungle dweller from 100
        million years ago, it would snap
        obstructing trees with head butts.
      fr: |-
        Il vivait dans la jungle il y a
        100 millions d’années. Il abat
        un arbre d’un coup de tête.
    white:
      en: |-
        A lifelong jungle dweller from 100
        million years ago, it would snap
        obstructing trees with head butts.
      fr: |-
        Il vivait dans la jungle il y a
        100 millions d’années. Il abat
        un arbre d’un coup de tête.
    black-2:
      en: |-
        A lifelong jungle dweller from 100
        million years ago, it would snap
        obstructing trees with head butts.
    white-2:
      en: |-
        A lifelong jungle dweller from 100
        million years ago, it would snap
        obstructing trees with head butts.
    x:
      ja-Hrkt: |-
        てっきゅうの　ような　かせきから
        ふっかつした　こだいの　ポケモン。
        ずつきで　えものを　しとめた。
      ja: |-
        鉄球の　ような　化石から
        復活した　古代の　ポケモン。
        頭突きで　獲物を　しとめた。
      ko: |-
        철구 같은 화석에서
        부활한 고대 포켓몬이다.
        박치기로 먹이를 꼼짝 못하게 한다.
      en: |-
        It was resurrected from an iron ball-like fossil.
        It downs prey with its headbutts.
      fr: |-
        On l’a ressuscité à partir d’un fossile de fer en forme
        de balle. Il abat ses proies à coups de tête.
      de: |-
        Es wurde aus einem ballartigen, eisernen Fossil
        geschaffen. Es schlägt Beute mit einem Kopfstoß.
      es: |-
        Fue recreado a partir de un fósil con forma esférica.
        Derriba a las presas a cabezazos.
      it: |-
        È stato fatto rivivere da un fossile di ferro simile a
        una palla. Abbatte le prede con le punte sulla testa.
    'y':
      ja-Hrkt: |-
        およそ　１おくねんまえの　ポケモン。
        ジャングルで　うまれそだち　じゃまな
        じゅもくは　ずつきで　へしおった。
      ja: |-
        およそ　１億年前の　ポケモン。
        ジャングルで　生まれ育ち　邪魔な
        樹木は　頭突きで　へしおった。
      ko: |-
        대략 1억 년 전의 포켓몬이다.
        정글에서 태어나 자라 방해되는
        수목은 박치기로 꺾었다.
      en: |-
        A lifelong jungle dweller from 100 million years
        ago, it would snap obstructing trees with headbutts.
      fr: |-
        Il vivait dans la jungle il y a 100 millions d’années.
        Il peut abattre un arbre d’un coup de tête.
      de: |-
        Es lebt seit Urzeiten im Dschungel. Kann im Weg
        befindliche Bäume mit Kopfstößen aus dem Weg
        räumen.
      es: |-
        Vivía en la jungla hace 100 millones de años.
        Apartaba los árboles del camino a cabezazos.
      it: |-
        Abitava nella giungla già 100 milioni di anni fa.
        Abbatte gli alberi che lo ostacolano con delle testate.
    omega-ruby:
      ja-Hrkt: |-
        てっきゅうの　ような　かせきから
        ふっかつした　こだいの　ポケモン。
        ずつきで　えものを　しとめた。
      ja: |-
        鉄球の　ような　化石から
        復活した　古代の　ポケモン。
        頭突きで　獲物を　しとめた。
      ko: |-
        철구 같은 화석에서
        부활한 고대 포켓몬이다.
        박치기로 먹이를 꼼짝 못하게 한다.
      en: |-
        It was resurrected from an iron ball-like fossil.
        It downs prey with its headbutts.
      fr: |-
        On l’a ressuscité à partir d’un fossile de fer en forme de balle.
        Il abat ses proies à coups de tête.
      de: |-
        Es wurde aus einem ballartigen, eisernen Fossil geschaffen.
        Es schlägt Beute mit einem Kopfstoß.
      es: |-
        Fue recreado a partir de un fósil con forma esférica. Derriba a
        las presas a cabezazos.
      it: |-
        È stato fatto rivivere da un fossile di ferro simile a una palla.
        Abbatte le prede con le punte sulla testa.
    alpha-sapphire:
      ja-Hrkt: |-
        およそ　１おくねんまえの　ポケモン。
        ジャングルで　うまれそだち　じゃまな
        じゅもくは　ずつきで　へしおった。
      ja: |-
        およそ　１億年前の　ポケモン。
        ジャングルで　生まれ育ち　邪魔な
        樹木は　頭突きで　へしおった。
      ko: |-
        대략 1억 년 전의 포켓몬이다.
        정글에서 태어나고 자라며 방해되는
        수목은 박치기로 꺾었다.
      en: |-
        A lifelong jungle dweller from 100 million years
        ago, it would snap obstructing trees with headbutts.
      fr: |-
        Il vivait dans la jungle il y a 100 millions d’années.
        Il peut abattre un arbre d’un coup de tête.
      de: |-
        Es lebt seit Urzeiten im Dschungel. Kann im Weg befindliche
        Bäume mit Kopfstößen aus dem Weg räumen.
      es: |-
        Vivía en la jungla hace 100 millones de años. Apartaba los
        árboles del camino a cabezazos.
      it: |-
        Abitava nella giungla già 100 milioni di anni fa. Abbatte
        gli alberi che lo ostacolano con delle testate.
    sun:
      ja-Hrkt: |-
        １おくねんほど　まえの　みつりんで
        くらしていた。　とくいの　ずつきで
        プテラに　たいこう　していた。
      ja: |-
        １億年ほど　前の　密林で
        暮らしていた。　得意の　頭突きで
        プテラに　対抗　していた。
      ko: |-
        1억 년 정도 전의 밀림에서
        살았었다. 특기인 박치기로
        프테라에게 저항했었다.
      zh-Hant: |-
        曾經生活在大約１億年前的密林中。
        用最拿手的頭錘對抗化石翼龍。
      zh-Hans: |-
        生活在大约１亿年前的密林中。
        用最拿手的头锤对抗化石翼龙。
      en: |-
        It lived in jungles around a hundred million years
        ago. It used its skillful headbutts to
        combat Aerodactyl.
      fr: |-
        Il peuplait les jungles il y a 100 millions
        d’années et se débarrassait de son grand rival,
        Ptéra, en lui donnant des coups de tête.
      de: |-
        Vor Urzeiten lebte es im Dschungel.
        Mit seinem Kopfstoß setzt es sich
        gegen Aerodactyl zur Wehr.
      es: |-
        Vivía en la jungla hace 100 millones de años.
        Gracias a su destreza propinando cabezazos
        podía hacerle frente a Aerodactyl.
      it: |-
        Viveva nella giungla circa 100 milioni di anni fa.
        Si difendeva con potenti testate dal suo nemico
        naturale Aerodactyl.
    moon:
      ja-Hrkt: |-
        ズガイドスの　かせきが　みつかる
        ちそうでは　へしおれた　じゅもくの
        かせきも　いっしょに　でてくるぞ。
      ja: |-
        ズガイドスの　化石が　見つかる
        地層では　へし折れた　樹木の
        化石も　一緒に　出てくるぞ。
      ko: |-
        두개도스의 화석이 발견되는
        지층에는 부러진 나무의
        화석도 같이 발굴된다.
      zh-Hant: |-
        在發現頭蓋龍化石的
        地層裡也能發現
        折斷了的樹木的化石。
      zh-Hans: |-
        在发现头盖龙化石的
        地层里也一并出土了
        被锤断了的树木的化石。
      en: |-
        In rock layers where Cranidos fossils are found,
        the fossilized trunks of trees snapped in two
        are also often found.
      fr: |-
        Auprès des fossiles de Kranidos, il n’est pas
        rare de trouver des arbres pétrifiés
        complètement broyés.
      de: |-
        In den Erdschichten, in denen Fossilien von
        Koknodon entdeckt werden, finden sich
        auch Überreste abgebrochener Bäume.
      es: |-
        En los estratos geológicos donde se encuentran
        fósiles de Cranidos también aparecen muchos
        fósiles de árboles destrozados.
      it: |-
        Nelle zone ricche di fossili di Cranidos si
        trovano spesso anche numerosi fossili di
        alberi spezzati.
    ultra-sun:
      ja-Hrkt: |-
        たいこの　ポケモン。　かたくて
        じょうぶな　ずがいこつを　もつが
        あたまは　そうとうに　わるかった。
      ja: |-
        太古の　ポケモン。　硬くて
        丈夫な　頭蓋骨を　持つが
        頭は　相当に　悪かった。
      ko: |-
        태곳적 포켓몬. 딱딱하고
        튼튼한 두개골을 가졌지만
        머리는 정말 나빴다.
      zh-Hant: |-
        太古時代的寶可夢。
        擁有堅硬而結實的頭蓋骨，
        但是頭腦相當不靈光。
      zh-Hans: |-
        太古时代的宝可梦。
        拥有坚硬而结实的头盖骨，
        但是脑子相当不好使。
      en: |-
        A primeval Pokémon, it possesses a hard and
        sturdy skull, lacking any intelligence within.
      fr: |-
        Un Pokémon préhistorique doté d’un crâne très
        solide, mais d’un cerveau très peu performant.
      de: |-
        Dieses urzeitliche Pokémon war trotz seines
        harten, robusten Schädels nicht sehr schlau.
      es: |-
        Este Pokémon arcaico cuenta con un cráneo
        sólido y resistente, pero su cerebro no está a la
        par.
      it: |-
        Pokémon che esisteva in epoca antica, dotato di
        un cranio duro e resistente ma dall’intelligenza
        non altrettanto sviluppata.
    ultra-moon:
      ja-Hrkt: |-
        かたい　ずがいこつが　とくちょう。
        ずつきで　じゅもくを　へしおって
        みのった　きのみを　くっていた。
      ja: |-
        硬い　頭蓋骨が　特徴。
        頭突きで　樹木を　へし折って
        実った　きのみを　食っていた。
      ko: |-
        단단한 두개골이 특징이다.
        박치기로 나무를 부러뜨려
        잘 익은 나무열매를 먹었다.
      zh-Hant: |-
        特徵是堅硬的頭蓋骨。
        會用頭錘撞斷樹木，
        吃樹上長的樹果。
      zh-Hans: |-
        坚硬的头盖骨是其特征。
        会用头锤撞断树木，
        吃树上结的树果。
      en: |-
        Its hard skull is its distinguishing feature. It
        snapped trees by headbutting them, and then
        it fed on their ripe berries.
      fr: |-
        Son crâne extrêmement solide est sa principale
        caractéristique. Il s’en servait pour faire tomber
        des arbres les Baies dont il se nourrissait.
      de: |-
        Seine Besonderheit ist der harte Schädel. Mit
        seinem Kopfstoß fällte es Bäume, um deren
        Früchte fressen zu können.
      es: |-
        Se caracteriza por la dureza de su cráneo.
        Derribaba árboles a cabezazos para comerse
        las bayas maduras que colgaban de ellos.
      it: |-
        Era caratterizzato da un cranio durissimo,
        grazie al quale spezzava gli alberi a testate
        per poi cibarsi delle bacche mature.
    legends-arceus:
      en: |-
        An incredibly rare sight. They duel each other by ramming their
        heads together, and the resulting sound echoes throughout the
        area like the pealing of a bell.
