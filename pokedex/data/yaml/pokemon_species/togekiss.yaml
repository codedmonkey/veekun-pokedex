        It shares many blessings with
        people who respect one another’s
        rights and avoid needless strife.
      fr: |-
        Il apprécie particulièrement les
        gens qui respectent les autres
        et évitent les conflits inutiles.
    white:
      en: |-
        It shares many blessings with
        people who respect one another’s
        rights and avoid needless strife.
      fr: |-
        Il apprécie particulièrement les
        gens qui respectent les autres
        et évitent les conflits inutiles.
    black-2:
      en: |-
        It shares many blessings with
        people who respect one another’s
        rights and avoid needless strife.
    white-2:
      en: |-
        It shares many blessings with
        people who respect one another’s
        rights and avoid needless strife.
    x:
      ja-Hrkt: |-
        あらそいの　ない　へいわな　とちに
        トゲキッスは　おとずれ　さまざまな
        めぐみを　わけあたえると　いわれる。
      ja: |-
        争いのない　平和な　土地に
        トゲキッスは　訪れ　さまざまな　恵みを
        分け与えると　言われる。
      ko: |-
        다툼이 없는 평화로운 땅에
        토게키스가 나타나 여러 가지
        은총을 나눠줬다고 전해진다.
      en: |-
        As everyone knows, it visits peaceful regions,
        bringing them gifts of kindness and
        sweet blessings.
      fr: |-
        On dit qu’il apparaît dans les contrées paisibles pour
        dispenser mille bienfaits.
      de: |-
        Es heißt, Togekiss erscheine in friedlichen Zeiten
        und verteile alle möglichen Wohltaten.
      es: |-
        Se dice que aparece en zonas pacíficas y las bendice
        con sus dones.
      it: |-
        Pare che Togekiss ami visitare le regioni pacifiche,
        senza conflitti, donando bontà e dolcezza.
    'y':
      ja-Hrkt: |-
        おたがいの　そんざいを　みとめあい
        むだに　あらそわない　ひとのために
        さまざまな　めぐみを　わけあたえる。
      ja: |-
        お互いの　存在を　認め合い
        無駄に　争わない　人のために
        さまざまな　恵みを　分け与える。
      ko: |-
        서로 존재를 인정하고 쓸데없는
        분쟁을 하지 않는 사람을 위해
        다양한 은총을 나누어 준다.
      en: |-
        It shares many blessings with people who respect
        one another’s rights and avoid needless strife.
      fr: |-
        Il apprécie particulièrement les gens qui respectent
        les autres et évitent les conflits inutiles.
      de: |-
        Menschen, die unnötigen Streit vermeiden und
        sich gegenseitig respektieren, ist es wohlgesinnt.
      es: |-
        Congenia muy bien con las personas que respetan los
        derechos de los demás y evitan riñas innecesarias.
      it: |-
        La sua natura lo rende affine alle persone che
        rispettano i diritti altrui ed evitano conflitti inutili.
    omega-ruby:
      ja-Hrkt: |-
        あらそいの　ない　へいわな　とちに
        トゲキッスは　おとずれ　さまざまな
        めぐみを　わけあたえると　いわれる。
      ja: |-
        争いのない　平和な　土地に
        トゲキッスは　訪れ　さまざまな　恵みを
        分け与えると　言われる。
      ko: |-
        다툼이 없는 평화로운 땅에
        토게키스가 나타나 여러 가지
        은총을 나눠줬다고 전해진다.
      en: |-
        As everyone knows, it visits peaceful regions,
        bringing them gifts of kindness and
        sweet blessings.
      fr: |-
        On dit qu’il apparaît dans les contrées paisibles pour dispenser
        mille bienfaits.
      de: |-
        Es heißt, Togekiss erscheine in friedlichen Zeiten und verteile
        alle möglichen Wohltaten.
      es: |-
        Se dice que aparece en zonas pacíficas y las bendice con sus
        dones.
      it: |-
        Pare che Togekiss ami visitare le regioni pacifiche, senza
        conflitti, donando bontà e dolcezza.
    alpha-sapphire:
      ja-Hrkt: |-
        おたがいの　そんざいを　みとめあい
        むだに　あらそわない　ひとのために
        さまざまな　めぐみを　わけあたえる。
      ja: |-
        お互いの　存在を　認め合い
        無駄に　争わない　人のために
        さまざまな　恵みを　分け与える。
      ko: |-
        서로 존재를 인정하고 쓸데없는
        분쟁을 하지 않는 사람을 위해
        다양한 은총을 나누어 준다.
      en: |-
        It shares many blessings with people who respect
        one another’s rights and avoid needless strife.
      fr: |-
        Il apprécie particulièrement les gens qui respectent les autres
        et évitent les conflits inutiles.
      de: |-
        Menschen, die unnötigen Streit vermeiden und sich
        gegenseitig respektieren, ist es wohlgesinnt.
      es: |-
        Congenia muy bien con las personas que respetan los
        derechos de los demás y evitan riñas innecesarias.
      it: |-
        La sua natura lo rende affine alle persone che rispettano
        i diritti altrui ed evitano conflitti inutili.
    sword:
      ja-Hrkt: |-
        あらそいごとや　もめごとが　おこる
        ばしょには　すがたを　みせない。
        ちかごろは　ほとんど　みかけない。
      ja: |-
        争い事や　もめ事が　起こる
        場所には　姿を　見せない。
        近ごろは　ほとんど　見かけない。
      ko: |-
        분쟁이나 다툼이 일어나는
        장소에는 모습을 드러내지 않는다.
        최근에는 거의 보이지 않는다.
      zh-Hant: |-
        不會出現在發生
        爭端和紛亂的地方。
        近來幾乎見不到牠的身影。
      zh-Hans: |-
        不会出现在发生
        争端和纷乱的地方。
        近来几乎见不到它的身影。
      en: |-
        These Pokémon are never seen anywhere near
        conflict or turmoil. In recent times, they’ve hardly
        been seen at all.
      fr: |-
        Il ne se montre jamais en temps de guerre
        ou de conflit. Ces derniers temps, il est rare
        de le croiser.
      de: |-
        Es zeigt sich nie an Orten, wo Streit und
        Zwietracht herrschen. In letzter Zeit wird es
        kaum noch gesehen.
      es: |-
        Este Pokémon jamás se muestra en lugares donde
        reine la discordia y la disensión. Últimamente
        apenas se avistan ejemplares.
      it: |-
        Non appare dove è in corso un conflitto o un
        litigio. Di recente non si vede quasi mai.
    shield:
      ja-Hrkt: |-
        めぐみを　あたえる　そんざいと
        いわれており　おおむかしから
        えんぎものに　えがかれてきた。
      ja: |-
        恵みを　与える　存在と
        言われており　大昔から
        縁起物に　描かれてきた。
      ko: |-
        은총을 베푸는 존재로
        전해지고 있으며 먼 옛날부터
        길조로 묘사되어 왔다.
      zh-Hant: |-
        被稱為帶來恩惠的寶可夢，
        從很久很久以前開始，
        人們就視牠為吉祥之物。
      zh-Hans: |-
        被称为会带来恩惠的宝可梦，
        从很久很久以前开始，
        人们就视它为吉祥之物。
      en: |-
        Known as a bringer of blessings, it’s
        been depicted on good-luck charms
        since ancient times.
      fr: |-
        On dit que ce Pokémon dispense ses bienfaits,
        ce qui explique pourquoi il est représenté
        sur les porte-bonheurs depuis fort longtemps.
      de: |-
        Man sagt, es verteile Wohltaten. Aus diesem
        Grund wird sein Abbild seit Urzeiten für
        Glücksbringer verwendet.
      es: |-
        Se dice que es portador de buena suerte.
        Por ello, su imagen aparece representada en
        talismanes y amuletos desde la antigüedad.
      it: |-
        Si dice che doni prosperità, e per questo viene
        rappresentato nei portafortuna fin dall’antichità.
