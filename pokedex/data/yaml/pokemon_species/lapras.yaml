    x:
      ja-Hrkt: |-
        やさしい　こころの　もちぬし。
        めったに　あらそわないため　たくさん
        つかまえられ　かずが　へった。
      ja: |-
        優しい　心の　持ち主。
        めったに　争わないため　たくさん
        捕まえられ　数が　減った。
      ko: |-
        부드러운 마음의 소유자다.
        좀처럼 다투지 않아 많이
        잡혔기 때문에 수가 줄었다.
      en: |-
        They have gentle hearts. Because they rarely
        fight, many have been caught. Their number
        has dwindled.
      fr: |-
        Ils sont d’une nature gentille. Comme ils se défendent
        rarement, ils sont en voie d’extinction.
      de: |-
        Sie sind gutmütig. Da sie selten kämpfen,
        wurden sie oft gefangen. Ihre Anzahl ist
        stark reduziert.
      es: |-
        Son buenos de corazón. Muchos fueron capturados
        por ser tan pacíficos. Ahora hay muchos menos.
      it: |-
        Sono buoni d’animo e lottano di rado, così molti
        di loro sono facili prede: sono stati decimati.
    'y':
      ja-Hrkt: |-
        ひとの　ことばを　りかいする　たかい
        ちのうを　もつ。うみの　うえを
        ひとを　のせて　すすむのが　すき。
      ja: |-
        人の　言葉を　理解する　高い
        知能を　持つ。海の　上を
        人を　乗せて　進むのが　好き。
      ko: |-
        사람의 말을 이해하는 높은 지능을
        가지고 있다. 사람을 태우고
        바다를 건너는 것을 좋아한다.
      en: |-
        Its high intelligence enables it to understand human
        speech. It likes to ferry people on its back.
      fr: |-
        Son intelligence lui permet de comprendre le langage
        des humains. Il adore promener les gens sur son dos.
      de: |-
        Aufgrund seiner hohen Intelligenz kann es
        die menschliche Sprache verstehen. Es mag es,
        Menschen auf seinem Rücken zu transportieren.
      es: |-
        Tiene un coeficiente intelectual tan alto que puede
        entender el lenguaje humano. Le encanta llevar a
        gente sobre el lomo.
      it: |-
        La sua intelligenza gli permette di comprendere il
        linguaggio degli umani, che ama trasportare sul suo
        dorso.
    omega-ruby:
      ja-Hrkt: |-
        ひとが　ぜつめつの　ききに　おいこんでしまった。
        ゆうぐれどきになると　すくなくなった　なかまを
        さがして　かなしそうな　こえで　うたうと　いう。
      ja: |-
        人が　絶滅の　危機に　追い込んでしまった。
        夕暮どきに　なると　少なくなった　仲間を
        探して　悲しそうな　声で　歌うと　いう。
      ko: |-
        사람이 멸종의 위기로 몰아갔다.
        석양이 내리면 수가 줄어든 동료를
        찾아 슬픈 목소리로 노래한다고 한다.
      en: |-
        People have driven Lapras almost to the point of extinction.
        In the evenings, this Pokémon is said to sing plaintively as it
        seeks what few others of its kind still remain.
      fr: |-
        Les Lokhlass sont en voie d’extinction. Le soir, on entend
        ce Pokémon chantonner une complainte mélancolique,
        espérant retrouver ses rares congénères.
      de: |-
        Die Menschen sind dafür verantwortlich, dass Lapras fast
        ausgestorben wäre. Abends singt es traurige Klagelieder,
        da nur noch wenige seiner Artgenossen übrig sind.
      es: |-
        Por culpa de la gente, Lapras está casi en extinción. Dicen
        que, al anochecer, se pone a cantar quejicoso mientras busca
        a los miembros de su especie que puedan quedar.
      it: |-
        L’uomo ha portato Lapras alla sua quasi totale estinzione.
        Si dice che la sera lo si senta cantare malinconico per
        richiamare i suoi pochi simili ancora in vita.
