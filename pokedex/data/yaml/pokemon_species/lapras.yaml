    sword:
      ja-Hrkt: |-
        かしこく　こころやさしい　ポケモン。
        きれいな　うたごえを　ひびかせながら
        うみのうえを　およいで　いく。
      ja: |-
        賢く　心優しい　ポケモン。
        きれいな　歌声を　響かせながら
        海の上を　泳いで　いく。
      ko: |-
        영리하고 마음 착한 포켓몬.
        아름다운 소리로 노래 부르며
        바다 위를 헤엄친다.
      zh-Hant: |-
        頭腦聰慧，心地善良的寶可夢。
        會一邊以優美的聲音歌唱，
        一邊暢游在大海之上。
      zh-Hans: |-
        头脑聪慧，心地善良的宝可梦。
        会一边以优美的声音歌唱，
        一边畅游于大海之上。
      en: |-
        A smart and kindhearted Pokémon,
        it glides across the surface of the sea while
        its beautiful song echoes around it.
      fr: |-
        C’est un Pokémon doux et intelligent.
        Il vogue sur la mer en émettant un chant
        magnifique.
      de: |-
        Ein intelligentes und herzensgutes Pokémon.
        Während es auf dem Meer schwimmt, lässt es
        seinen herrlichen Gesang erklingen.
      es: |-
        Este Pokémon posee una notable inteligencia y
        un corazón de oro. Entona un canto melodioso
        mientras surca el mar.
      it: |-
        È un Pokémon intelligente e dall’animo gentile.
        Solca i mari facendo riecheggiare il suo canto
        dolce e melodioso.
    shield:
      ja-Hrkt: |-
        さむさに　つよく　こおりの　うみも
        へいき。　ひふは　スベスベで
        すこしだけ　ひんやり　しているよ。
      ja: |-
        寒さに　強く　氷の　海も
        平気。　皮膚は　スベスベで
        少しだけ　ひんやり　しているよ。
      ko: |-
        추위에 강해서 얼음 바다에서도
        끄떡없다. 피부는 매끈매끈하고
        조금 차갑다.
      zh-Hant: |-
        十分耐寒，不畏冰海。
        皮膚滑滑的，
        摸起來會有點涼。
      zh-Hans: |-
        十分耐寒，不畏冰海。
        皮肤滑滑的，
        摸上去会有点凉。
      en: |-
        Crossing icy seas is no issue for this
        cold-resistant Pokémon. Its smooth skin
        is a little cool to the touch.
      fr: |-
        Il résiste bien aux très basses températures
        et peut nager dans des mers glaciales.
        Sa peau est lisse et légèrement froide au toucher.
      de: |-
        Es kommt gut mit Kälte zurecht und kann auch
        in eisigen Meeren problemlos schwimmen.
        Seine Haut fühlt sich glatt und kühl an.
      es: |-
        Nada sin problema en aguas heladas gracias a la
        soberbia resistencia al frío que posee. Su tersa
        piel es ligeramente fría al tacto.
      it: |-
        Resiste molto bene al freddo e si trova
        a suo agio anche nei mari ghiacciati.
        La sua pelle è liscia e fresca.
