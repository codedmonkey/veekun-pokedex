    sun:
      ja-Hrkt: |-
        たかい　ちのうを　もち　にんげんの
        ことばを　りかいする。　ごきげんに
        なると　うつくしい　こえで　うたう。
      ja: |-
        高い　知能を　持ち　人間の
        言葉を　理解する。　ご機嫌に
        なると　美しい　声で　歌う。
      ko: |-
        높은 지능을 가졌으며 인간의
        말을 이해한다. 기분이 좋아지면
        아름다운 목소리로 노래한다.
      zh-Hant: |-
        擁有很高的智商，理解人類的語言。
        心情好的時候會用美妙的聲音唱歌。
      zh-Hans: |-
        拥有很高的智商，理解人类的语言。
        心情好的时候会用美妙的声音唱歌。
      en: |-
        Its high intelligence enables it to comprehend
        human speech. When it’s in a good mood,
        it sings in its beautiful voice.
      fr: |-
        Ce Pokémon est très intelligent et comprend
        le langage humain. Quand il est de bonne
        humeur, il chante avec une voix magnifique.
      de: |-
        Aufgrund seiner hohen Intelligenz kann es die
        menschliche Sprache verstehen. Ist es gut
        gelaunt, singt es mit wunderschöner Stimme.
      es: |-
        Es un Pokémon muy inteligente y comprende el
        lenguaje humano. Cuando está de buen humor,
        canta con su bella voz.
      it: |-
        È talmente intelligente da comprendere
        il linguaggio degli esseri umani. Quando è di
        buon umore, canta con la sua bellissima voce.
    moon:
      ja-Hrkt: |-
        みつりょうで　ぜつめつすんぜんに。
        たいせつに　ほご　された　けっか
        ぎゃくに　ふえすぎてきたという。
      ja: |-
        密漁で　絶滅寸前に。
        大切に　保護　された　結果
        逆に　増え過ぎてきたという。
      ko: |-
        밀렵으로 멸종 위기에 처했다가
        소중히 보호한 결과
        오히려 수가 너무 늘었다고 한다.
      zh-Hant: |-
        因違法捕撈而導致瀕臨絕種。
        但據說在受到重點保護之後，
        數量反而開始過度增加了。
      zh-Hans: |-
        曾因非法捕捞濒临灭绝。
        但听说重点保护却反而
        导致它有点泛滥成灾。
      en: |-
        These Pokémon were once near extinction due
        to poaching. Following protective regulations,
        there is now an overabundance of them.
      fr: |-
        Il était en voie d’extinction à cause de la pêche
        illégale, mais après de stricts programmes de
        protection, il y en a maintenant trop.
      de: |-
        Es wäre einst durch übermäßiges Fischen fast
        ausgestorben. Durch ein strenges Abkommen
        zum Artenschutz gibt es nun fast zu viele.
      es: |-
        Estuvo en peligro de extinción debido a la caza
        ilegal. Sin embargo, desde que está protegido, la
        población de Lapras ha crecido sin mesura.
      it: |-
        Le misure adottate per proteggerlo ne hanno
        scongiurato il pericolo di estinzione, ma ha finito
        per moltiplicarsi in modo eccessivo.
    ultra-sun:
      ja-Hrkt: |-
        ひとを　のせて　およぐのが　すき。
        アローラちほう　では　たいせつな
        すいじょうの　こうつう　しゅだん。
      ja: |-
        人を　乗せて　泳ぐのが　好き。
        アローラ地方　では　大切な
        水上の　交通　手段。
      ko: |-
        사람을 태우고 헤엄치는 것을 좋아한다.
        알로라지방에서는 소중한
        수상 교통수단이다.
      zh-Hant: |-
        喜歡載著人游泳。
        在阿羅拉地區
        是重要的水上交通工具。
      zh-Hans: |-
        喜欢乘载着人游泳。
        在阿罗拉地区，
        这是重要的水上交通方式。
      en: |-
        It likes swimming around with people on its
        back. In the Alola region, it’s an important means
        of transportation over water.
      fr: |-
        Il prend plaisir à transporter des humains sur
        son dos quand il nage. Les habitants d’Alola
        adorent ce moyen de transport.
      de: |-
        Da es liebend gerne beim Schwimmen Menschen
        auf seinem Rücken trägt, gilt es in Alola als
        bedeutendes Transportmittel.
      es: |-
        Debido a su buena disposición a llevar gente
        sobre su lomo, ha terminado por convertirse en
        un medio de transporte muy popular en Alola.
      it: |-
        Ama trasportare persone sul suo dorso.
        Ad Alola, viaggiare in groppa a Lapras è un
        modo molto popolare di spostarsi sull’acqua.
    ultra-moon:
      ja-Hrkt: |-
        たいせつに　されすぎて　ふえすぎた。
        ラプラスが　おおすぎる　うみでは
        さかなポケモンが　へってきたという。
      ja: |-
        大切に　されすぎて　増えすぎた。
        ラプラスが　多すぎる　海では
        さかなポケモンが　減ってきたという。
      ko: |-
        너무 소중히 여겨져서 수가 너무 늘었다.
        라프라스가 너무 많은 바다에는
        물고기포켓몬이 줄어든다고 한다.
      zh-Hant: |-
        因為受到過度保護而導致數量激增。
        據說在拉普拉斯過多的海域，
        魚寶可夢的數量已漸漸減少了。
      zh-Hans: |-
        重点保护过头导致数量增加太多。
        据说在拉普拉斯过多的海域，
        鱼宝可梦的数量已经减少了。
      en: |-
        They’ve been so cherished that there’s now an
        overabundance. The fish Pokémon population
        has declined in waters with too many Lapras.
      fr: |-
        Cette espèce protégée a tellement proliféré que
        les Pokémon poissons se font apparemment
        plus rares dans les eaux peuplées de Lokhlass.
      de: |-
        Aufgrund eines Artenschutzabkommens gibt es
        nun zu viele Lapras. In den betroffenen Meeren
        sinkt daher das Vorkommen von Fisch-Pokémon.
      es: |-
        Desde que están protegidos, la población de
        Lapras ha crecido sin mesura, a la par que la de
        los Pokémon pez ha ido en descenso.
      it: |-
        Fin troppo protetto, ha finito per moltiplicarsi
        in modo eccessivo e questo ha causato una
        diminuzione dei Pokémon acquatici nei mari.
    lets-go-pikachu:
      ja-Hrkt: |-
        にんげんの　ことばを　りかいする
        やさしい　こころの　もちぬしだ。
        せなかに　のせて　うみをゆく。
      ja: |-
        人間の　言葉を　理解する
        優しい　心の　持ち主だ。
        背中に　乗せて　海をゆく。
      ko: |-
        인간의 말을 이해하는
        착한 마음의 소유자다.
        사람을 등에 태우고 바다를 건넌다.
      zh-Hant: |-
        能夠理解人類的語言。
        有著一顆善良的心，
        會把人載在背上渡過大海。
      zh-Hans: |-
        它拥有可以理解人类
        语言的温柔之心。
        会把人载在背上渡过大海。
      en: |-
        A gentle soul that can understand
        human speech. It can ferry people across
        the sea on its back.
      fr: |-
        Ce gentil Pokémon comprend le langage
        humain. Il parcourt les mers en transportant
        des gens sur son dos.
      de: |-
        Dieses freundliche Pokémon besitzt ein sanftes
        Gemüt und versteht die Sprache der Menschen.
        Auf seinem Rücken trägt es sie über das Meer.
      es: |-
        Este amable Pokémon es capaz de comprender
        el lenguaje humano y deja que las personas
        monten en él para navegar por el mar.
      it: |-
        Possiede un animo gentile e capisce il linguaggio
        degli esseri umani. Trasporta le persone per
        mare sul suo dorso.
    lets-go-eevee:
      ja-Hrkt: |-
