    x:
      ja-Hrkt: |-
        やさしいひとの　そばに　いないと
        げんきが　でなくなってしまう。
        はねをうごかさずに　そらにうかべる。
      ja: |-
        優しい人の　そばに　いないと
        元気が　出なくなってしまう。
        羽を動かさずに　空に浮かべる。
      ko: |-
        상냥한 사람 곁에 있지 않으면
        기운이 나지 않게 되어버린다.
        날개를 움직이지 않고 뜰 수 있다.
      en: |-
        It grows dispirited if it is not with kind people.
        It can float in midair without moving its wings.
      fr: |-
        Il se démoralise vite s’il n’est pas avec des gens
        sympathiques. Il peut léviter sans battre des ailes.
      de: |-
        Es wird entmutigt, wenn es unter unfreundlichen
        Menschen ist. Es kann ohne Flügel niedrig schweben.
      es: |-
        Si no está con gente amable, se entristece. Puede
        flotar en el aire sin mover las alas.
      it: |-
        S’intristisce se non si trova con persone gentili.
        Può restare sospeso in aria senza bisogno di
        muovere le ali.
    'y':
      ja-Hrkt: |-
        こころやさしい　ひとの　まえに
        しあわせを　もたらすため
        すがたを　あらわすと　いわれている。
      ja: |-
        心優しい　人の　前に
        幸せを　もたらすため
        姿を　現すと　言われている。
      ko: |-
        마음 착한 사람 앞에
        행복을 가져다주기 위해
        모습을 나타낸다고 전해진다.
      en: |-
        They say that it will appear before kindhearted,
        caring people and shower them with happiness.
      fr: |-
        On dit qu’il n’apparaît qu’aux cœurs purs et
        qu’il leur apporte la joie et le bonheur.
      de: |-
        Man sagt, es zeigt sich nur gutherzigen und
        einfühlsamen Menschen. Es überschüttet sie
        mit Freude.
      es: |-
        Dicen que aparece entre gentes cuidadosas y de
        buen corazón, a quienes inunda de felicidad.
      it: |-
        Si dice che appaia alle persone buone e premurose,
        inondandole di felicità.
    omega-ruby:
      ja-Hrkt: |-
        こううんを　もたらす　ポケモンと　いわれている。
        じゅんすいな　こころの　もちぬしを　みつけると
        すがたを　あらわし　しあわせを　わけあたえる。
      ja: |-
        幸運を　もたらす　ポケモンと　いわれている。
        純粋な　心の　持ち主を　みつけると
        姿を　あらわし　幸せを　分け与える。
      ko: |-
        행운을 가져다주는 포켓몬이라고 전해진다.
        순수한 마음을 지닌 자를 발견하면
        모습을 드러내고 행복을 나누어준다.
      en: |-
        Togetic is said to be a Pokémon that brings good fortune.
        When the Pokémon spots someone who is pure of heart, it is
        said to appear and share its happiness with that person.
      fr: |-
        On raconte que Togetic est un Pokémon qui porte chance.
        Si ce Pokémon remarque quelqu’un doté d’un cœur pur,
        il apparaît et partage son bonheur avec la personne
        en question.
      de: |-
        Togetic ist ein Pokémon, das Glück bringt. Wenn es jemanden
        trifft, der reinen Herzens ist, zeigt es sich und teilt sein Glück
        mit dieser Person.
      es: |-
        Dicen que Togetic es un Pokémon que trae buena suerte y
        que, si detecta a alguien que es puro de corazón, sale para
        compartir su alegría con él.
      it: |-
        Togetic pare essere un Pokémon di buon auspicio.
        Quando riconosce un cuore puro, si dice che condivida
        la sua felicità con questa persona.
    alpha-sapphire:
      ja-Hrkt: |-
        こううんを　もたらす　ポケモンと　いわれている。
        じゅんすいな　こころの　もちぬしを　みつけると
        すがたを　あらわし　しあわせを　わけあたえる。
      ja: |-
