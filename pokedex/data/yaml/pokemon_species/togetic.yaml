        純粋な　心の　持ち主を　みつけると
        姿を　あらわし　幸せを　分け与える。
      ko: |-
        행운을 가져다주는 포켓몬이라고 전해진다.
        순수한 마음을 지닌 자를 발견하면
        모습을 드러내고 행복을 나누어준다.
      en: |-
        Togetic is said to be a Pokémon that brings good fortune.
        When the Pokémon spots someone who is pure of heart,
        it is said to appear and share its happiness with that person.
      fr: |-
        On raconte que Togetic est un Pokémon qui porte chance.
        Si ce Pokémon remarque quelqu’un doté d’un cœur pur,
        il apparaît et partage son bonheur avec la personne
        en question.
      de: |-
        Togetic ist ein Pokémon, das Glück bringt. Wenn es jemanden
        trifft, der gutherzig ist, teilt es seine Freude mit dieser Person.
      es: |-
        Dicen que Togetic es un Pokémon que trae buena suerte y
        que, si detecta a alguien que es puro de corazón, sale para
        compartir su alegría con él.
      it: |-
        Togetic pare essere un Pokémon di buon auspicio.
        Quando riconosce un cuore puro, si dice che condivida
        la sua felicità con questa persona.
    sword:
      ja-Hrkt: |-
        こころやさしい　ひとの　まえに
        しあわせを　もたらすため
        すがたを　あらわすと　いわれている。
      ja: |-
        心優しい　人の　前に
        幸せを　もたらすため
        姿を　現すと　言われている。
      ko: |-
        마음 착한 사람에게
        행복을 가져다주기 위해
        모습을 드러낸다고 전해진다.
      zh-Hant: |-
        據說牠會為了將
        幸福帶給心地善良
        的人而現身。
      zh-Hans: |-
        据说它是为了将幸福带给
        性格温柔的人而现身的。
      en: |-
        They say that it will appear before kindhearted,
        caring people and shower them with happiness.
      fr: |-
        On dit qu’il se montre aux personnes dotées
        d’un cœur pur pour leur apporter joie et bonheur.
      de: |-
        Man sagt, es zeige sich nur gutherzigen und
        einfühlsamen Menschen und überschütte sie
        dann mit Freude.
      es: |-
        Dicen que se le aparece a la gente de buen
        corazón y la inunda de felicidad.
      it: |-
        Si dice che appaia alle persone buone
        e premurose, inondandole di felicità.
    shield:
      ja-Hrkt: |-
        やさしいひとの　そばに　いないと
        げんきが　でなくなってしまう。
        はねをうごかさずに　そらにうかべる。
      ja: |-
        優しい人の　そばに　いないと
        元気が　でなくなってしまう。
        羽を動かさずに　空に浮かべる。
      ko: |-
        상냥한 사람 곁에 있지 않으면
        기운을 내지 못한다.
        날개를 움직이지 않고도 공중에 뜰 수 있다.
      zh-Hant: |-
        不待在溫柔的人身邊
        就會變得沒有精神。
        不揮動翅膀也能浮在空中。
      zh-Hans: |-
        不待在温柔的人身边
        就会变得没有精神。
        不挥动翅膀也能浮在空中。
      en: |-
        It grows dispirited if it is not with kind people.
        It can float in midair without moving its wings.
      fr: |-
        Ce Pokémon est capable de léviter sans battre
        des ailes. Il est vite démoralisé s’il n’est pas
        en compagnie de gens sympathiques.
      de: |-
        Es kann, ohne mit den Flügeln zu schlagen, in der
        Luft schweben. Ein Mangel an gutherzigen
        Menschen in seiner Nähe schlägt ihm aufs Gemüt.
      es: |-
        Si no está con gente amable, se entristece.
        Puede flotar en el aire sin mover las alas.
      it: |-
        S’intristisce se non ha persone gentili
        al suo fianco. Può restare sospeso in aria
        senza dover muovere le ali.
    legends-arceus:
      en: |-
        No records exist of Togetic being seen in the wilds. Rumors
        abound that it evolves under the loving care of a trusted human
        companion, upon whom the Pokémon then bestows great joy.
