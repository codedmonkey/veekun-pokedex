lopunny:
  base_happiness: 140
  capture_rate: 60
  color: brown
  egg_groups:
    - ground
    - humanshape
  evolution_chain: buneary
  evolves_from: buneary
  flavor_text:
    diamond:
      en: |-
        An extremely cautious Pokémon.
        It cloaks its body with its fluffy
        ear fur when it senses danger.
    pearl:
      en: |-
        It is very conscious of its looks
        and never fails to groom its ears.
        It runs with sprightly jumps.
    platinum:
      en: |-
        The ears appear to be delicate. If
        they are touched roughly, it kicks
        with its graceful legs.
    heartgold:
      en: |-
        It sheds its fur twice a year.
        Its winter fur is soft and fluffy.
    soulsilver:
      en: |-
        It sheds its fur twice a year.
        Its winter fur is soft and fluffy.
    black:
      en: |-
        The ears appear to be delicate. If
        they are touched roughly, it kicks
        with its graceful legs.
      fr: |-
        Il est capable de décocher de
        puissants coups de pied si on
        touche à ses délicates oreilles.
    white:
      en: |-
        The ears appear to be delicate. If
        they are touched roughly, it kicks
        with its graceful legs.
      fr: |-
        Il est capable de décocher de
        puissants coups de pied si on
        touche à ses délicates oreilles.
    black-2:
      en: |-
        Extremely cautious,
        it quickly bounds off
        when it senses danger.
    white-2:
      en: |-
        Extremely cautious,
        it quickly bounds off
        when it senses danger.
    x:
      ja-Hrkt: |-
        けいかいしんが　とても　つよい。
        きけんを　かんじると　かろやかに
        とびはねて　はしりさってしまう。
      ja: |-
        警戒心が　とても　強い。
        危険を　感じると　軽やかに
        飛び跳ねて　走り去ってしまう。
      ko: |-
        경계심이 아주 강하다.
        위험을 감지하면 가뿐하게
        뛰어올라 달아난다.
      en: |-
        Extremely cautious, it quickly bounds off
        when it senses danger.
      fr: |-
        Il détecte le moindre danger. Il file discrètement
        par petits bonds rapides quand il se sent menacé.
      de: |-
        Es ist extrem vorsichtig. Wenn es Gefahr wittert,
        macht es sich mit flinken Sprüngen aus dem Staub.
      es: |-
        Este Pokémon resulta muy precavido. Si siente peligro,
        escapa corriendo a grandes saltos.
      it: |-
        È un Pokémon estremamente cauto. Se avverte
        un pericolo, si dà subito alla fuga saltellando.
    'y':
      ja-Hrkt: |-
        みみは　とても　デリケートらしく
        やさしく　ていねいに　さわらないと
        しなやかな　あしで　けられてしまう。
      ja: |-
        耳は　とても　デリケートらしく
        優しく　丁寧に　触らないと
        しなやかな　脚で　けられてしまう。
      ko: |-
        귀가 아주 민감한 부위이므로
        상냥하고 정중하게 만지지 않으면
        그 매끈한 다리에 차이게 된다.
      en: |-
        The ears appear to be delicate. If they are touched
        roughly, it kicks with its graceful legs.
      fr: |-
        Il est capable de décocher de puissants coups de
        pied si on touche à ses délicates oreilles.
      de: |-
        Es hat sehr empfindliche Ohren. Fasst man sie zu
        rau an, wird es mit seinen grazilen Beinen zutreten.
      es: |-
        Sus orejas son muy delicadas. Si alguien las toca con
        brusquedad, recibirá una espléndida patada.
      it: |-
        Ha delle orecchie molto delicate. Se le si tocca con
        forza, scalcia con le sue graziose gambe.
    omega-ruby:
      ja-Hrkt: |-
        けいかいしんが　とても　つよい。
        きけんを　かんじると　かろやかに
        とびはねて　はしりさってしまう。
      ja: |-
        警戒心が　とても　強い。
        危険を　感じると　軽やかに
        飛び跳ねて　走り去ってしまう。
      ko: |-
        경계심이 아주 강하다.
        위험을 감지하면 가뿐하게
        뛰어올라 달아난다.
      en: |-
        Extremely cautious, it quickly bounds off when it
        senses danger.
      fr: |-
        Il détecte le moindre danger. Il file discrètement par petits
        bonds rapides quand il se sent menacé.
      de: |-
        Es ist extrem vorsichtig. Wenn es Gefahr wittert, macht es sich
        mit flinken Sprüngen aus dem Staub.
      es: |-
        Este Pokémon resulta muy precavido. Si siente peligro,
        escapa corriendo a grandes saltos.
      it: |-
        È un Pokémon estremamente cauto. Se avverte un pericolo,
        si dà subito alla fuga saltellando.
    alpha-sapphire:
      ja-Hrkt: |-
        みみは　とても　デリケートらしく
        やさしく　ていねいに　さわらないと
        しなやかな　あしで　けられてしまう。
      ja: |-
        耳は　とても　デリケートらしく
        優しく　丁寧に　触らないと
        しなやかな　脚で　けられてしまう。
      ko: |-
        귀가 아주 민감한 부위이므로
        상냥하고 정중하게 만지지 않으면
        그 매끈한 다리에 차이게 된다.
      en: |-
        The ears appear to be delicate. If they are touched
        roughly, it kicks with its graceful legs.
      fr: |-
        Il est capable de décocher de puissants coups de pied
        si on touche à ses délicates oreilles.
      de: |-
        Es hat sehr empfindliche Ohren. Fasst man sie zu rau an,
        wird es mit seinen grazilen Beinen zutreten.
      es: |-
        Sus orejas son muy delicadas. Si alguien las toca con
        brusquedad, recibirá una espléndida patada.
      it: |-
        Ha delle orecchie molto delicate. Se le si tocca con forza,
        scalcia con le sue graziose gambe.
    ultra-sun:
      ja-Hrkt: |-
        ねんに　２かい　けが　はえかわる。
        そのけを　つかった　マフラーや
        ぼうしは　とっても　あたたかいぞ。
      ja: |-
        年に　２回　毛が　生えかわる。
        その毛を　使った　マフラーや
        帽子は　とっても　あたたかいぞ。
      ko: |-
        연 2회 털갈이를 한다.
        그 털로 만든 머플러나
        모자는 매우 따듯하다.
      zh-Hant: |-
        每年會換２次毛。
        用這種毛製成的
        圍巾和帽子非常保暖。
      zh-Hans: |-
        一年会换２次毛。
        用这个毛制作的
        围巾和帽子非常温暖。
      en: |-
        Lopunny regrows its coat twice a year. Mufflers
        and hats made from its fur are really warm.
      fr: |-
        Il mue deux fois par an. Les écharpes et
        les chapeaux fabriqués à partir de ses poils
        tiennent bien chaud.
      de: |-
        Es wechselt zweimal im Jahr seine Wolle. Daraus
        lassen sich Schals oder Mützen herstellen, die
        ihre Träger mollig warmhalten.
      es: |-
        Muda el pelo dos veces al año. Este se usa
        en la confección de unos gorros y bufandas
        que abrigan mucho.
      it: |-
        Cambia il pelo due volte l’anno. Le sciarpe e
        i berretti fatti con la lana che perde sono
        molto caldi.
    ultra-moon:
      ja-Hrkt: |-
        けいかいしんが　つよく　たたかいは
        このまないが　しなやかな　あしから
        パワフルな　キックを　くりだすぞ。
      ja: |-
        警戒心が　強く　戦いは
        好まないが　しなやかな　足から
        パワフルな　キックを　繰り出すぞ。
      ko: |-
        경계심이 강하고 싸움은
        좋아하지 않지만 유연한 다리로
        파워풀한 킥을 날린다.
      zh-Hant: |-
        警戒心很強。雖然不喜歡戰鬥，
        但牠能夠用柔韌的雙腳
        使出強而有力的踢腿。
      zh-Hans: |-
        警戒心很强，不喜欢战斗，
        但能够用柔软的脚使出有力的脚踢。
      en: |-
        It’s notably wary and has a dislike of fighting,
        but at the same time, it can deliver powerful
        kicks with its lithe legs.
      fr: |-
        Il est très vigilant et n’aime pas vraiment
        se battre, mais gare aux coups de patte
        dévastateurs qu’il peut décocher !
      de: |-
        Ein sehr vorsichtiges Pokémon, das Kämpfe zu
        vermeiden sucht. Mit seinen grazilen Beinen teilt
        es kräftige Tritte aus.
      es: |-
        Es cauteloso y nada amante de los combates,
        pero puede propinar potentes patadas si la
        situación lo requiere.
      it: |-
        È cauto e rifugge la lotta, ma può sferrare
        potenti calci con le sue gambe aggraziate.
    sword:
      ja-Hrkt: |-
        まわりの　ようすを　つねに　きにして
        きけんが　およぶと　はかいりょく
        ばつぐんの　キックを　おみまいする。
      ja: |-
        まわりの　様子を　つねに　気にして
        危険が　およぶと　破壊力　抜群の
        キックを　おみまいする。
      ko: |-
        주위 상황을 항상 신경 쓰고 있으며
        위험이 닥치면 무시무시한 파괴력을
        가진 킥을 날린다.
      zh-Hant: |-
        總是注意著周圍的狀況。
        危險逼近時，就會給對手
        奉上破壞力十足的踢腿。
      zh-Hans: |-
        一直注意着周围的状况，
        遇到危险时便会施展
        破坏力超群的踢击。
      en: |-
        Lopunny is constantly monitoring its surroundings.
        If danger approaches, this Pokémon responds
        with superdestructive kicks.
      fr: |-
        Constamment sur le qui-vive, il donne
        des coups de pied particulièrement
        dévastateurs si une menace approche.
      de: |-
        Schlapor behält seine Umgebung stets im Auge.
        Wenn Gefahr im Verzug ist, setzt es sich mit
        vernichtenden Tritten zur Wehr.
      es: |-
        Está siempre atento a lo que ocurre a su
        alrededor. Si advierte peligro, se defenderá
        con patadas de potencia devastadora.
      it: |-
        Presta sempre attenzione all’ambiente
        circostante e in caso di pericolo sfodera calci
        di straordinaria potenza distruttiva.
    shield:
      ja-Hrkt: |-
        あつい　きせつが　おわると　くうきを
        たくさん　ふくんだ　たいもうに
        はえかわり　さむさに　そなえる。
      ja: |-
        暑い　季節が　終わると　空気を
        たくさん　含んだ　体毛に
        生え変わり　寒さに　備える。
      ko: |-
        더운 계절이 끝나면 공기를
        많이 머금은 털로 털갈이를 하여
        추위에 대비한다.
      zh-Hant: |-
        炎熱的季節結束後，
        就會換上富含空氣的
        體毛以備寒天來臨。
      zh-Hans: |-
        当高温的季节结束后，
        就会换上富含空气的
        体毛，准备抵御寒冷。
      en: |-
        Once hot seasons are over, Lopunny’s coat will
        be replaced with fur that holds a lot of insulating
        air in preparation for colder weather.
      fr: |-
        À la fin de la saison chaude, il mue et se recouvre
        d’une fourrure épaisse et légère pour se préparer
        à affronter le froid hivernal.
      de: |-
        Ist die heiße Jahreszeit vorbei, wechselt sein Fell
        zu einer Wollfaser, die viel Luft umschließt.
        So schützt sich Schlapor gegen die Kälte.
      es: |-
        Cuando acaba la estación más tórrida, le crece
        un nuevo pelaje muy mullido que lo prepara para
        el frío.
      it: |-
        Terminata la stagione calda, si prepara all’arrivo
        del freddo coprendosi di una pelliccia soffice
        e vaporosa.
