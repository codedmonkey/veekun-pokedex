    x:
      ja-Hrkt: |-
        なくときは　ナイフのような　うでを
        むねの　まえで　こうささせる。
        そっきょうで　メロディを　つくる。
      ja: |-
        鳴くときは　ナイフのような　腕を
        胸の　前で　交差させる。
        即興で　メロディを　作る。
      ko: |-
        울 때는 나이프 같은 팔을
        가슴 앞에서 교차시킨다.
        즉흥으로 멜로디를 만든다.
      en: |-
        It crosses its knifelike arms in front of its chest
        when it cries. It can compose melodies ad lib.
      fr: |-
        Il croise ses bras affûtés devant son torse pour crier.
        Il compose tout un tas de mélodies.
      de: |-
        Wenn es ruft, verschränkt es seine messerartigen
        Arme vor der Brust. Es komponiert aus dem Stegreif.
      es: |-
        Cuando llora, cruza sus brazos con forma de cuchillo.
        Puede improvisar melodías.
      it: |-
        Quando canta tiene le zampe incrociate al petto.
        Sa improvvisare melodie.
    'y':
      ja-Hrkt: |-
        かんじょうを　メロディで　あらわす。
        メロディの　ほうそくせいを
        がくしゃたちが　けんきゅうしている。
      ja: |-
        感情を　メロディで　表す。
        メロディの　法則性を
        学者たちが　研究している。
      ko: |-
        감정을 멜로디로 나타낸다.
        멜로디의 법칙성을
        학자들이 연구하고 있다.
      en: |-
        It signals its emotions with its melodies. Scientists
        are studying these melodic patterns.
      fr: |-
        Il exprime ses émotions par des mélodies.
        Les scientifiques étudient actuellement leur structure.
      de: |-
        Über seine Melodien teilt es seine Gefühle mit.
        Wissenschaftler untersuchen das Muster der Melodien.
      es: |-
        Los científicos tratan de estudiar sus melodías, que
        son reflejo de sus emociones.
      it: |-
        Esprime le proprie emozioni con melodie, che sono
        oggetto di studio di molti scienziati.
