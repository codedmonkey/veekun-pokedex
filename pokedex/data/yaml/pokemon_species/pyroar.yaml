pyroar:
  base_happiness: 70
  capture_rate: 65
  color: brown
  egg_groups:
    - ground
  evolution_chain: litleo
  evolves_from: litleo
  flavor_text:
    x:
      ja-Hrkt: |-
        むれの　なかで　いちばん　おおきな
        ほのおの　たてがみを　もつ　オスが
        リーダーとして　なかまを　ひきいる。
      ja: |-
        群れの　中で　一番　大きな　炎の
        たてがみを　持つ　オスが
        リーダーとして　仲間を　率いる。
      ko: |-
        무리 중에서 가장 커다란
        불꽃 갈기를 지닌 수컷이
        리더로서 동료들을 이끈다.
      en: |-
        The male with the largest mane of fire
        is the leader of the pride.
      fr: |-
        Le mâle qui possède la crinière de feu la plus
        imposante devient le chef de la horde.
      de: |-
        Das Männchen mit der prächtigsten Feuermähne
        führt das Rudel an.
      es: |-
        El macho con la melena de fuego más grande de toda
        la manada es el líder de sus compañeros.
      it: |-
        Di solito, il maschio con la criniera fiammeggiante
        più ampia guida i compagni del gruppo.
    'y':
      ja-Hrkt: |-
        せっし６０００どの　いきを　はきだし
        はげしく　あいてを　いかくする。
        メスが　むれの　こどもを　まもる。
      ja: |-
        摂氏６０００度の　息を　吐き出し
        激しく　相手を　威嚇する。
        メスが　群れの　子供を　守る。
      ko: |-
        섭씨 6000도의 숨을 내뿜어
        격렬하게 상대를 위협한다.
        암컷이 무리의 새끼를 지킨다.
      en: |-
        With fiery breath of more than 10,000 degrees
        Fahrenheit, they viciously threaten any challenger.
        The females protect the pride’s cubs.
      fr: |-
        Son souffle peut atteindre les 6 000 °C et il s’en sert
        pour intimider l’ennemi. Dans la horde, les femelles
        protègent les petits.
      de: |-
        Sie bedrohen ihre Gegner, indem sie 6 000 °C heiße
        Atemluft ausstoßen. Die Weibchen beschützen die
        Jungen des Rudels.
      es: |-
        Intimida con ferocidad al enemigo exhalando su aliento
        abrasador a 6000 °C de temperatura. Las hembras
        protegen a los cachorros de la manada.
      it: |-
        Minaccia furiosamente i nemici soffiando aria a una
        temperatura che raggiunge i 6000 °C. Le femmine
        proteggono i piccoli del gruppo.
    omega-ruby:
      ja-Hrkt: |-
        むれの　なかで　いちばん　おおきな
        ほのおの　たてがみを　もつ　オスが
        リーダーとして　なかまを　ひきいる。
      ja: |-
        群れの　中で　一番　大きな　炎の
        たてがみを　持つ　オスが
        リーダーとして　仲間を　率いる。
      ko: |-
        무리 중에서 가장 커다란
        불꽃 갈기를 지닌 수컷이
        리더로서 동료들을 이끈다.
      en: |-
        The male with the largest mane of fire
        is the leader of the pride.
      fr: |-
        Le mâle qui possède la crinière de feu la plus imposante
        devient le chef de la horde.
      de: |-
        Das Männchen mit der prächtigsten Feuermähne führt
        das Rudel an.
      es: |-
        El macho con la melena de fuego más grande de toda la
        manada es el líder de sus compañeros.
      it: |-
        Di solito, il maschio con la criniera fiammeggiante più ampia
        guida i compagni del gruppo.
    alpha-sapphire:
      ja-Hrkt: |-
        せっし６０００どの　いきを　はきだし
        はげしく　あいてを　いかくする。
        メスが　むれの　こどもを　まもる。
      ja: |-
        摂氏６０００度の　息を　吐き出し
        激しく　相手を　威嚇する。
        メスが　群れの　子供を　守る。
      ko: |-
        섭씨 6000도의 숨을 내뿜어
        격렬하게 상대를 위협한다.
        암컷이 무리의 새끼를 지킨다.
      en: |-
        With fiery breath of more than 10,000 degrees
        Fahrenheit, they viciously threaten any challenger.
        The females protect the pride’s cubs.
      fr: |-
        Son souffle peut atteindre les 6 000 °C et il s’en sert pour
        intimider l’ennemi. Dans la horde, les femelles protègent
        les petits.
      de: |-
        Sie bedrohen ihre Gegner, indem sie 6 000 °C heiße Atemluft
        ausstoßen. Die Weibchen beschützen die Jungen des Rudels.
      es: |-
        Intimida con ferocidad al enemigo exhalando su aliento
        abrasador a 6000 °C de temperatura. Las hembras protegen
        a los cachorros de la manada.
      it: |-
        Minaccia furiosamente i nemici soffiando aria a una temperatura
        che raggiunge i 6000 °C. Le femmine proteggono i piccoli
        del gruppo.
    ultra-sun:
      ja-Hrkt: |-
        オスは　ふだん　だらだら　しているが
        きょうてきが　おそってくると　わがみを
        かえりみず　なかまを　まもるぞ。
      ja: |-
        オスは　普段　だらだら　しているが
        強敵が　襲ってくると　わが身を
        かえりみず　仲間を　守るぞ。
      ko: |-
        수컷은 평소에 빈둥거리지만,
        강적이 덤벼들면 자신을
        돌보지 않고 동료를 지킨다.
      zh-Hant: |-
        雄性平常十分懶散，
        但當有強敵來襲的時候，
        會奮不顧身地保護夥伴。
      zh-Hans: |-
        雄性平时总是拖拖拉拉的，
        但如果有强敌来袭，
        就会不顾自身，保护伙伴。
      en: |-
        The males are usually lazy, but when attacked
        by a strong foe, a male will protect its friends
        with no regard for its own safety.
      fr: |-
        Le mâle a tendance à se prélasser à longueur
        de journée. Si un ennemi surgit, en revanche,
        il défend ses congénères au péril de sa vie.
      de: |-
        Männliche Exemplare faulenzen die meiste Zeit.
        Wird ihr Rudel von starken Gegnern angegriffen,
        verteidigen sie dieses jedoch mit ihrem Leben.
      es: |-
        Por lo general, el macho suele ser un holgazán,
        pero si aparece un enemigo poderoso, no duda
        en plantarle cara para proteger a los suyos.
      it: |-
        Di solito il maschio passa le giornate nell’ozio,
        ma se compare un nemico temibile è pronto a
        rischiare la vita per proteggere i compagni.
    ultra-moon:
      ja-Hrkt: |-
        せっし　６０００どの　いきを　はくが
        えものには　つかわない。　にくは
        なまの　ほうが　このみ　だから。
      ja: |-
        摂氏　６０００度の　息を　吐くが
        獲物には　使わない。　肉は
        生のほうが　好み　だから。
      ko: |-
        섭씨 6000도의 숨결을 내뱉지만
        먹이에는 사용하지 않는다.
        고기는 날것을 좋아하기 때문이다.
      zh-Hant: |-
        能吐出攝氏６０００度的氣息，
        但不會用在獵物身上，
        因為牠比較喜歡吃生肉。
      zh-Hans: |-
        会吐出摄氏６０００度的气息，
        但不会用于猎物。
        因为更喜欢吃生的肉。
      en: |-
        The temperature of its breath is over 10,000
        degrees Fahrenheit, but Pyroar doesn’t use it on
        its prey. This Pokémon prefers to eat raw meat.
      fr: |-
        Son souffle enflammé atteint les 6 000 °C,
        mais il ne l’utilise jamais contre ses proies.
        Il préfère en effet la viande crue.
      de: |-
        Es kann 6 000 °C heiße Atemluft ausstoßen,
        die es jedoch nicht bei der Jagd verwendet.
        Seine Beute verspeist es nämlich lieber roh.
      es: |-
        Su aliento alcanza temperaturas de 6000 ºC,
        aunque no lo emplea contra sus presas, ya que
        prefiere la carne más bien cruda.
      it: |-
        Con il suo soffio, infiamma l’aria a una
        temperatura di 6.000 °C, ma evita di farlo con
        le prede perché preferisce la carne cruda.
