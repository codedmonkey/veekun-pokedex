    white-2:
      en: |-
        It shelters itself in its shell
        then strikes back with spouts of
        water at every opportunity.
    x:
      ja-Hrkt: |-
        こうらに　とじこもり　みを　まもる。
        あいての　すきを　みのがさず
        みずを　ふきだして　はんげきする。
      ja: |-
        甲羅に　閉じこもり　身を　守る。
        相手の　すきを　見逃さず
        水を　噴き出して　反撃する。
      ko: |-
        등껍질에 숨어 몸을 보호한다.
        상대의 빈틈을 놓치지 않고
        물을 뿜어내어 반격한다.
      en: |-
        It shelters itself in its shell, then strikes back
        with spouts of water at every opportunity.
      fr: |-
        Il se réfugie dans sa carapace et réplique en
        éclaboussant l’ennemi à la première occasion.
      de: |-
        Es zieht sich in seinen Panzer zurück und greift
        dann mit Wasserstrahlen seine Gegner an.
      es: |-
        Se protege con su caparazón y luego contraataca
        lanzando agua a presión cuando tiene oportunidad.
      it: |-
        Si ritira nel suo guscio e, alla prima occasione,
        contrattacca colpendo il nemico con spruzzi d’acqua.
    'y':
      ja-Hrkt: |-
        すいめんから　みずを　ふんしゃして
        エサをとる。あぶなくなると　こうらに
        てあしを　ひっこめて　みをまもる。
      ja: |-
        水面から　水を　噴射して
        エサを　取る。危なくなると　甲羅に
        手足を　ひっこめて　身を　守る。
      ko: |-
        수면에서 물을 분사하여
        먹이를 잡는다. 위험해지면 등껍질에
        손발을 감추고 몸을 지킨다.
      en: |-
        Shoots water at prey while in the water. Withdraws
        into its shell when in danger.
      fr: |-
        Caché sous l’eau, il crache un jet d’eau sur sa proie
        et se cache à l’intérieur de sa carapace.
      de: |-
        Dieses Pokémon jagt mit einem Wasserstrahl.
        Bei Gefahr zieht es sich in seinen Panzer zurück.
      es: |-
        Lanza agua a su presa desde el agua. Se esconde en
        su concha cuando se siente en peligro.
      it: |-
        Attacca i nemici con potenti getti d’acqua. Se si
        sente in pericolo si ritira dentro la sua corazza.
    omega-ruby:
      ja-Hrkt: |-
        こうらの　やくめは　みを　まもる　だけではない。
        まるい　かたちと　ひょうめんの　みぞが　みずの
        ていこうを　へらすので　はやく　およげるのだ。
      ja: |-
        甲羅の　役目は　身を　守る　だけではない。
        丸い　形と　表面の　溝が　水の
        抵抗を　減らすので　早く　泳げるのだ。
      ko: |-
        등껍질의 역할은 몸을 지키는 것뿐만이 아니다.
        둥그런 모양과 표면의 홈이 물의
        저항을 줄여서 빠르게 헤엄칠 수 있다.
      en: |-
        Squirtle’s shell is not merely used for protection.
        The shell’s rounded shape and the grooves on its surface
        help minimize resistance in water, enabling this Pokémon
        to swim at high speeds.
      fr: |-
        La carapace de Carapuce ne sert pas qu’à le protéger.
        La forme ronde de sa carapace et ses rainures lui permettent
        d’améliorer son hydrodynamisme.
        Ce Pokémon nage extrêmement vite.
      de: |-
        Schiggys Panzer dient nicht nur zum Schutz. Die runde Form
        und die Furchen auf der Oberfläche verringern den Widerstand
        im Wasser, sodass dieses Pokémon sehr schnell schwimmen
        kann.
      es: |-
        El caparazón de Squirtle no le sirve de protección únicamente.
        Su forma redondeada y las hendiduras que tiene le ayudan
        a deslizarse en el agua y le permiten nadar a gran velocidad.
      it: |-
        La corazza di Squirtle non serve soltanto da protezione.
        La particolare forma arrotondata e le scanalature
        superficiali lo aiutano a minimizzare l’attrito dell’acqua
        per nuotare ad alta velocità.
    alpha-sapphire:
      ja-Hrkt: |-
        こうらの　やくめは　みを　まもる　だけではない。
        まるい　かたちと　ひょうめんの　みぞが　みずの
        ていこうを　へらすので　はやく　およげるのだ。
      ja: |-
