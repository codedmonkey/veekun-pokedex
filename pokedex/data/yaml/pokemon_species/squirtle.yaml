    lets-go-pikachu:
      ja-Hrkt: |-
        すいめんから　みずを　ふんしゃして
        エサをとる。あぶなくなると　こうらに
        てあしを　ひっこめて　みをまもる。
      ja: |-
        水面から　水を　噴射して
        エサをとる。危なくなると　こうらに
        手足を　引っこめて　身を守る。
      ko: |-
        수면에서 물을 분사하여
        먹이를 잡는다. 위험해지면 등껍질에
        손발을 감추고 몸을 지킨다.
      zh-Hant: |-
        會從水面噴水來擊落獵物。
        當遇到危險時，會把手腳
        縮進甲殼裡保護自己。
      zh-Hans: |-
        通过从水面喷水来捕食。
        在危急时刻会将四肢
        缩入龟壳里保护自己。
      en: |-
        Shoots water at prey while in the water.
        Withdraws into its shell when in danger.
      fr: |-
        Caché sous les flots, il crache un jet d’eau sur
        sa proie et se réfugie à l’intérieur de sa carapace
        en cas de danger.
      de: |-
        Es greift seine Beute aus dem Wasser heraus mit
        einem Wasserstrahl an. Bei Gefahr zieht es sich
        in seinen Panzer zurück.
      es: |-
        Escupe chorros de agua mientras flota para
        capturar a sus presas. Se esconde en su
        caparazón cuando se siente en peligro.
      it: |-
        Se ne sta tra i flutti e attacca le prede con
        potenti getti d’acqua. Se si sente in pericolo
        si ritira dentro la corazza.
