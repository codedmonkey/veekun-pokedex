    sword:
      ja-Hrkt: |-
        ながい　くびを　こうらのなかに
        ひっこめるとき　いきおいよく
        みずでっぽうを　はっしゃする。
      ja: |-
        長い　首を　甲羅のなかに
        引っこめるとき　勢いよく
        水鉄砲を　発射する。
      ko: |-
        기다란 목을 등껍질 속에
        감춘 다음 기세 좋게
        물대포를 발사한다.
      zh-Hant: |-
        當牠把長長的脖子縮回
        殼裡時，會順勢發射
        力道強勁的水槍。
      zh-Hans: |-
        当它把长长的脖子缩回
        壳里时，会顺势发射出
        力道强劲的水枪。
      en: |-
        When it retracts its long neck into its shell, it
        squirts out water with vigorous force.
      fr: |-
        Quand il rentre son cou dans sa carapace,
        il peut projeter de l’eau à haute pression.
      de: |-
        Zieht es seinen langen Hals in seinen Panzer
        zurück, verspritzt es Wasser mit unbändiger Kraft.
      es: |-
        Cuando retrae su largo cuello en el caparazón,
        dispara agua a una presión increíble.
      it: |-
        Quando ritrae il lungo collo dentro la corazza
        sputa un vigoroso getto d’acqua.
    shield:
      ja-Hrkt: |-
        あぶなくなると　こうらに　てあしを
        ひっこめて　みを　まもりながら
        くちから　みずを　ふきだしてくる。
      ja: |-
        危なくなると　甲羅に　手足を
        引っこめて　身を　守りながら
        口から　水を　吹き出している。
      ko: |-
        위험해지면 등껍질에 손발을
        감추고 몸을 지키면서
        입에서 물을 내뿜는다.
      zh-Hant: |-
        當牠遇到危險的時候，
        會將四肢收回甲殼裡保護自己，
        同時從嘴裡噴出水來。
      zh-Hans: |-
        当它遇到危险的时候，
        会将四肢收回龟壳里保护自己，
        同时从嘴里喷出水来。
      en: |-
        When it feels threatened, it draws its limbs inside
        its shell and sprays water from its mouth.
      fr: |-
        S’il se sent menacé, il rétracte ses pattes dans
        sa carapace pour se protéger et crache de l’eau.
      de: |-
        Fühlt es sich bedroht, verkriecht es sich in seinen
        Panzer und spuckt Wasser aus seinem Maul.
      es: |-
        Cuando se siente en peligro, se esconde en su
        caparazón y escupe chorros de agua por la boca.
      it: |-
        Se si sente minacciato, ritira le zampe nel guscio
        e inizia a spruzzare acqua dalla bocca.
