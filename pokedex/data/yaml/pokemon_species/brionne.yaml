brionne:
  base_happiness: 50
  capture_rate: 45
  color: blue
  egg_groups:
    - water1
    - ground
  evolution_chain: popplio
  evolves_from: popplio
  flavor_text:
    sun:
      ja-Hrkt: |-
        ダンスが　とくいで　おどりながら
        つぎつぎに　みずの　バルーンを
        つくりだし　てきに　ぶつけるぞ。
      ja: |-
        ダンスが　得意で　踊りながら
        次々に　水の　バルーンを
        作りだし　敵に　ぶつけるぞ。
      ko: |-
        댄스가 특기이며 춤추면서
        계속해서 물의 풍선을
        만들어 적에게 부딪힌다.
      zh-Hant: |-
        很擅長跳舞，會邊跳舞
        邊一個接一個地
        製造水氣球扔向敵人。
      zh-Hans: |-
        擅长跳舞，能够边跳舞，
        边一个接一个地
        制作水做的气球扔向敌人。
      en: |-
        A skillful dancer, it creates a sequence of water
        balloons as it dances, and briskly bombards
        its enemies.
      fr: |-
        Danseur hors pair, il produit des ballons d’eau
        à la chaîne afin d’éclabousser l’adversaire lors
        d’un impitoyable ballet funeste.
      de: |-
        Dieser begnadete Tänzer erzeugt beim Tanzen
        eine Wasserblase nach der anderen und greift
        damit seine Feinde an.
      es: |-
        Un bailarín consumado. Crea globos de agua
        con los que golpea a sus rivales una y otra vez
        sin dejar de bailar.
      it: |-
        È un provetto ballerino e scaglia contro il nemico
        una serie di palloncini d’acqua, che crea a ritmo
        di danza.
    moon:
      ja-Hrkt: |-
        なかまを　おもう　きもちが　つよい。
        トレーナーが　おちこんでいると
        ダンスを　おどって　はげまそうとする。
      ja: |-
        仲間を　思う　気持ちが　強い。
        トレーナーが　落ち込んでいると
        ダンスを　踊って　励まそうとする。
      ko: |-
        동료를 생각하는 마음이 강하다.
        트레이너가 풀이 죽어 있으면
        춤을 추며 격려해주려 한다.
      zh-Hant: |-
        非常關心自己的夥伴。
        訓練家如果情緒低落，
        就會跳舞給予鼓勵。
      zh-Hans: |-
        非常关心自己的伙伴。
        训练家如果情绪低落，
        就会跳舞给予鼓励。
      en: |-
        It cares deeply for its companions. When its
        Trainer is feeling down, it performs a cheery
        dance to try and help.
      fr: |-
        Il est très soucieux du bien-être des autres
        et n’hésite pas à exécuter une petite danse
        s’il sent que son Dresseur a le moral à zéro.
      de: |-
        Fühlt sich anderen sehr verbunden. Wenn sein
        Trainer schlechte Laune hat, muntert es ihn mit
        einem Tänzchen auf.
      es: |-
        Este Pokémon tiene un gran sentido de la
        camaradería y no duda en echarse a bailar si
        nota que su Entrenador está con la moral baja.
      it: |-
        Stringe profondi legami d’amicizia e, se
        percepisce che il suo Allenatore è un po’ giù
        di morale, si mette a danzare per tirarlo su.
    ultra-sun:
      ja-Hrkt: |-
        しらないダンスを　みると　こうふん。
        おどれるように　なるまで　けんめいに
        れんしゅうする　どりょくか　だよ。
      ja: |-
        知らないダンスを　見ると　興奮。
        踊れるように　なるまで　懸命に
        練習する　努力家　だよ。
      ko: |-
        모르는 댄스를 보면 흥분한다.
        출 수 있을 때까지 열심히
        연습하는 노력가다.
      zh-Hant: |-
        個性勤奮，只要看見自己
        不知道的舞蹈，就會很興奮。
        會拚命練習直到自己也會跳為止。
      zh-Hans: |-
        如果看到没见过的舞蹈，就会很兴奋。
        会拼命练习直到自己也会跳为止。
        是个很努力的家伙哦。
      en: |-
        It gets excited when it sees a dance it doesn’t
        know. This hard worker practices diligently until
        it can learn that dance.
      fr: |-
        Il est tout excité quand il est témoin d’une danse
        qu’il ne connaît pas. Il s’entraîne alors comme
        un forcené jusqu’à la maîtriser à la perfection.
      de: |-
        Sieht es einen Tanz, den es nicht kennt, wird es
        ganz aufgeregt. Dann übt es fleißig, bis es ihn
        gemeistert hat.
      es: |-
        Se emociona al contemplar una danza que no
        conoce y se esfuerza sobremanera por aprender
        todos sus pasos a la perfección.
      it: |-
        Si emoziona quando assiste a una danza che
        non conosce ancora e si esercita con impegno
        finché non la impara alla perfezione.
    ultra-moon:
      ja-Hrkt: |-
        ふくらませた　みずのバルーンを
        てあしで　はじき　てきに　たたきつけ
        ばくはつさせて　こうげき　するのだ。
      ja: |-
        膨らませた　水のバルーンを
        手足で　はじき　敵に　叩きつけ
        爆発させて　攻撃　するのだ。
      ko: |-
        부풀린 물의 벌룬을
        손발로 튕겨 내어 적에게 날린 후
        폭발시켜서 공격한다.
      zh-Hant: |-
        會用手腳將自己吹起來的
        水球彈出去砸向敵人，
        再讓水球爆開進行攻擊。
      zh-Hans: |-
        用手脚将自己吹起的
        水做的气球弹出去砸向敌人，
        让气球爆炸攻击对方。
      en: |-
        It attacks by smacking its enemies with the
        exploding water balloons that it creates.
      fr: |-
        Il utilise ses pattes pour lancer des ballons
        d’eau sur ses ennemis. Les ballons explosent
        au moment de l’impact.
      de: |-
        Es erzeugt Wasserblasen, die es mit seinen
        Flossen auf Gegner schleudert. Die Blasen
        platzen dadurch und schaden dem Ziel.
      es: |-
        Crea burbujas de agua que lanza al rival con
        sus aletas y que explotan cuando alcanzan al
        objetivo.
      it: |-
        Attacca creando palloncini d’acqua che lancia
        con le sue pinne. I palloncini esplodono al
        contatto con il nemico.
    sword:
      ja-Hrkt: |-
        ダンスの　ステップで　てきの　わざを
        かわしながら　バルーンを　つぎつぎと
        つくって　こうげきを　たたみかける。
      ja: |-
        ダンスの　ステップで　敵の　技を
        かわしながら　バルーンを　次々と
        つくって　攻撃を　たたみかける。
      ko: |-
        댄스 스텝으로 상대의 기술을
        피하면서 벌룬을 계속해서 만들고
        공격을 펼쳐서 상대를 몰아붙인다.
      zh-Hant: |-
        一邊用舞步躲避敵人的攻擊，
        一邊連續製造出氣球，
        接連不斷地攻擊對方。
      zh-Hans: |-
        一边利用舞步躲避敌人的攻击，
        一边连续制作出气球，
        接连不断地攻击对方。
      en: |-
        As if dancing, it artfully dodges the attacks of its
        enemies. All the while, it’s busy forming a bunch
        of balloons to overwhelm its foes.
      fr: |-
        Il esquive les attaques de ses adversaires
        avec ses légers pas de danse, puis leur assène
        une rafale de coups avec ses ballons.
      de: |-
        Es weicht den Attacken seiner Gegner mithilfe
        von Tanzschritten aus und erzeugt eine Blase nach
        der anderen, um sie in Bedrängnis zu bringen.
      es: |-
        Esquiva los ataques del rival con elegantes pasos
        de baile mientras lo presiona arrojando globos
        en rápida sucesión.
      it: |-
        Evita le mosse del nemico con agili passi di danza
        per poi attaccarlo ripetutamente con una raffica
        di palloncini.
    shield:
      ja-Hrkt: |-
        なみの　おだやかな　よるになると
        リーダーの　アシレーヌの　うたごえに
        あわせて　なかまたちと　おどる。
      ja: |-
        波の　穏やかな　夜になると
        リーダーの　アシレーヌの　歌声に
        合わせて　仲間たちと　踊る。
      ko: |-
        파도가 잔잔한 밤이 되면
        리더인 누리레느의 노랫소리에
        맞춰 동료와 함께 춤을 춘다.
      zh-Hant: |-
        到了風平浪靜的夜晚，
        會配合領隊西獅海壬的歌聲
        和夥伴們一起跳舞。
      zh-Hans: |-
        到了风平浪静的夜晚，
        会配合领队西狮海壬的歌声
        和伙伴们一起跳舞。
      en: |-
        On nights when the sea is calm, Brionne dance
        with one another to the singing of the Primarina
        that’s leading them.
      fr: |-
        Les soirs où la mer est calme, il danse
        avec ses congénères au son des chants
        d’Oratoria, le chef du groupe.
      de: |-
        In Nächten mit ruhigem Wellengang tanzt es mit
        seinen Artgenossen zusammen zu einem Lied,
        das ihr Rudelführer, ein Primarene, vorsingt.
      es: |-
        Las noches en las que el mar está en calma, baila
        junto a sus congéneres al compás del canto de su
        líder, Primarina.
      it: |-
        Nelle notti in cui il mare è tranquillo si uniscono
        al canto del Primarina a capo del gruppo e
        danzano tutti insieme.
