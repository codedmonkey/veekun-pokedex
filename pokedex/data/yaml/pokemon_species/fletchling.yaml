fletchling:
  base_happiness: 50
  capture_rate: 255
  color: red
  egg_groups:
    - flying
  evolution_chain: fletchling
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        ひとなつっこい　せいかく。うつくしい
        さえずりと　おばねを　ふる　うごきで
        なかまに　あいずを　おくる。
      ja: |-
        人懐っこい　性格。美しい　さえずりと
        尾羽を　振る　動きで
        仲間に　合図を　送る。
      ko: |-
        사람을 잘 따르는 성격이다. 아름다운
        지저귐과 꽁지를 흔드는 움직임으로
        동료에게 신호를 보낸다.
      en: |-
        These friendly Pokémon send signals
        to one another with beautiful chirps
        and tail-feather movements.
      fr: |-
        Peu farouche, il communique avec ses congénères
        par un doux gazouillis et par des signaux de la queue.
      de: |-
        Ein sehr zutrauliches Pokémon. Durch Zwitschern
        und Bewegen der Schwanzfedern sendet es Signale
        an seine Gefährten.
      es: |-
        Es muy amigable y se comunica con sus aliados
        mediante melodiosos gorjeos y el movimiento de su
        cola y sus gráciles alas.
      it: |-
        Ha una natura amichevole. Comunica con i suoi simili
        tramite meravigliosi cinguettii e movimenti delle penne
        della coda.
    'y':
      ja-Hrkt: |-
        さえずる　こえは　うつくしいが
        なわばりに　はいった　あいては
        ようしゃしない　あらあらしさだ。
      ja: |-
        さえずる　声は　美しいが
        縄張りに　入った　相手は
        容赦しない　荒々しさだ。
      ko: |-
        지저귀는 소리는 아름답지만
        영역에 들어온 상대를
        용서하지 않는 난폭한 성격이다.
      en: |-
        Despite the beauty of its lilting voice, it’s
        merciless to intruders that enter its territory.
      fr: |-
        Son chant est harmonieux, mais trompeur !
        Les ennemis qui pénètrent sur son territoire se
        retrouvent confrontés à un déluge de violence.
      de: |-
        Sein Zwitschern ist wunderschön, aber wenn Gegner
        sein Revier betreten, kennt es keine Gnade.
      es: |-
        Su melodioso gorjeo lo dota de una gran belleza,
        pero adopta una actitud agresiva y despiadada hacia
        cualquiera que ose invadir su territorio.
      it: |-
        Cinguetta in modo meraviglioso, ma diventa
        estremamente aggressivo se un nemico invade
        il suo territorio.
    omega-ruby:
      ja-Hrkt: |-
        ひとなつっこい　せいかく。うつくしい
        さえずりと　おばねを　ふる　うごきで
        なかまに　あいずを　おくる。
      ja: |-
        人懐っこい　性格。美しい　さえずりと
        尾羽を　振る　動きで
        仲間に　合図を　送る。
      ko: |-
        사람을 잘 따르는 성격이다. 아름다운
        지저귐과 꽁지를 흔드는 움직임으로
        동료에게 신호를 보낸다.
      en: |-
        These friendly Pokémon send signals
        to one another with beautiful chirps
        and tail-feather movements.
      fr: |-
        Peu farouche, il communique avec ses congénères
        par un doux gazouillis et par des signaux de la queue.
      de: |-
        Ein sehr zutrauliches Pokémon. Durch Zwitschern und
        Bewegen der Schwanzfedern sendet es Signale an seine
        Gefährten.
      es: |-
        Es muy amigable y se comunica con sus aliados mediante
        melodiosos gorjeos y el movimiento de su cola y sus gráciles
        alas.
      it: |-
        Ha una natura amichevole. Comunica con i suoi simili tramite
        meravigliosi cinguettii e movimenti delle penne della coda.
    alpha-sapphire:
      ja-Hrkt: |-
        さえずる　こえは　うつくしいが
        なわばりに　はいった　あいては
        ようしゃしない　あらあらしさだ。
      ja: |-
        さえずる　声は　美しいが
        縄張りに　入った　相手は
        容赦しない　荒々しさだ。
      ko: |-
        지저귀는 소리는 아름답지만
        영역에 들어온 상대를
        용서하지 않는 난폭한 성격이다.
      en: |-
        Despite the beauty of its lilting voice, it’s
        merciless to intruders that enter its territory.
      fr: |-
        Son chant est harmonieux, mais trompeur !
        Les ennemis qui pénètrent sur son territoire se
        retrouvent confrontés à un déluge de violence.
      de: |-
        Sein Zwitschern ist wunderschön, aber wenn Gegner sein
        Revier betreten, kennt es keine Gnade.
      es: |-
        Su melodioso gorjeo lo dota de una gran belleza, pero
        adopta una actitud agresiva y despiadada hacia cualquiera
        que ose invadir su territorio.
      it: |-
        Cinguetta in modo meraviglioso, ma diventa estremamente
        aggressivo se un nemico invade il suo territorio.
    sun:
      ja-Hrkt: |-
        ひとなつっこいので　あつかいやすい
        ポケモンだが　ひとたび　たたかいに
        なると　とても　あらあらしいぞ。
      ja: |-
        人懐っこいので　扱いやすい
        ポケモンだが　一度　戦いに
        なると　とても　荒々しいぞ。
      ko: |-
        사람을 잘 따라서 다루기 쉬운
        포켓몬이지만 한번 싸움이
        붙으면 매우 거칠어진다.
      zh-Hant: |-
        和人很親近，所以是易於訓練的
        寶可夢，但一旦進入戰鬥，
        就會變得非常兇猛。
      zh-Hans: |-
        和人很亲近，所以是易于训练的
        宝可梦，但一旦进入战斗，
        就会变得非常凶猛。
      en: |-
        This amiable Pokémon is easy to train.
        But when battle is joined, it shows its
        ferocious side.
      fr: |-
        C’est un Pokémon affectueux et très facile à
        élever, mais une fois en situation de combat,
        il devient un adversaire implacable.
      de: |-
        Ein sehr zutrauliches und pflegeleichtes
        Pokémon, das im Kampf jedoch erstaunlich
        wild und ungestüm agiert.
      es: |-
        Su carácter amigable lo convierte en un Pokémon
        muy dócil. Ahora bien, en cuanto se pone a
        combatir, se vuelve un adversario implacable.
      it: |-
        È facile da allenare grazie alla sua indole
        amichevole, ma nella lotta diventa
        estremamente aggressivo.
    moon:
      ja-Hrkt: |-
        こうふん　すると　たいおんが
        ２ばいまで　あがり　たいないの
        ホルモンが　かっぱつに　なるのだ。
      ja: |-
        興奮　すると　体温が
        ２倍まで　上がり　体内の
        ホルモンが　活発に　なるのだ。
      ko: |-
        흥분하면 체온이
        2배까지 올라 체내의
        호르몬이 활발해진다.
      zh-Hant: |-
        一感到興奮，體溫會上升到２倍，
        同時體內的荷爾蒙會變得活躍。
      zh-Hans: |-
        一兴奋，体温就会上升２倍，
        体内的荷尔蒙就会变得活跃。
      en: |-
        When it’s excited, its temperature can double,
        spiking hormone production in its body.
      fr: |-
        Quand il est tout excité, sa température peut
        doubler et ses hormones bouillonnent.
      de: |-
        Ist es aufgeregt, steigt seine Körpertemperatur
        auf das Doppelte an und seine Hormone
        spielen verrückt.
      es: |-
        Cuando se exalta, su temperatura corporal llega
        a duplicarse y sus hormonas se descontrolan.
      it: |-
        Quando si innervosisce, la sua temperatura
        corporea sale fino a raddoppiare e gli ormoni
        ribollono.
    ultra-sun:
      ja-Hrkt: |-
        ひとなつっこい　ポケモンだけど
        むりに　さわると　からだを　いっきに
        はつねつさせるので　やけど　するぞ。
      ja: |-
        人懐っこい　ポケモンだけど
        無理やり　触ると　身体を　一気に
        発熱させるので　火傷　するぞ。
      ko: |-
        사람을 잘 따르는 포켓몬이지만,
        억지로 만지면 몸을 단숨에
        발열시켜 화상을 입는다.
      zh-Hant: |-
        雖然是種容易與人親近的寶可夢，
        但如果強行去摸牠，牠的身體會
        一口氣發熱而讓人灼傷。
      zh-Hans: |-
        是和人很亲近的宝可梦，
        但如果强行触碰，它就会让身体
        一下子发热，从而造成灼伤。
      en: |-
        While it’s an amiable Pokémon, if you touch it
        unexpectedly, it will heat up its body in an
        instant, and you’ll be burned.
      fr: |-
        Bien qu’il soit affectueux, il peut brusquement
        augmenter sa température et infliger des
        brûlures à ceux qui le touchent par surprise.
      de: |-
        Es ist eigentlich sehr zutraulich. Berührt man es
        aber gegen seinen Willen, erhitzt es blitzartig
        seinen Körper, was zu Verbrennungen führt.
      es: |-
        Es de carácter afable, pero si lo tocan en contra
        de su voluntad, aumenta repentinamente su
        temperatura y puede provocar quemaduras.
      it: |-
        Ha un’indole amichevole, ma se viene infastidito
        aumenta all’istante la sua temperatura corporea
        provocando ustioni al colpevole.
    ultra-moon:
      ja-Hrkt: |-
        からだは　いつでも　あたたかい。
        さむい　ちいきの　トレーナーは
        ベッドで　いっしょに　ねるらしい。
      ja: |-
        身体は　いつでも　暖かい。
        寒い　地域の　トレーナーは
        ベッドで　一緒に　寝るらしい。
      ko: |-
        몸은 언제나 따뜻하다.
        추운 지역의 트레이너는
        침대에서 함께 잔다고 한다.
      zh-Hant: |-
        身體總是很溫暖。
        寒冷地區的訓練家似乎
        會和牠一起睡在床上。
      zh-Hans: |-
        身体一直都很温暖。
        听说寒冷地区的训练家
        会和它一起睡在床上。
      en: |-
        Its body is always warm. Trainers who live in
        cold areas apparently sleep with it in their bed.
      fr: |-
        Une agréable chaleur émane toujours de son
        petit corps. Dans les régions froides, il n’est
        pas rare qu’il dorme dans le lit de son Dresseur.
      de: |-
        Sein Körper ist immer warm. In kalten Gebieten
        schlafen Trainer deshalb oft in einem Bett
        mit ihm.
      es: |-
        Su cuerpo emana bastante calor, razón por la
        que los Entrenadores de regiones frías les
        permiten dormir en sus camas.
      it: |-
        Il suo corpo è sempre caldo e per questo gli
        Allenatori che vivono in zone fredde a volte
        lo lasciano dormire nel loro letto.
    sword:
      ja-Hrkt: |-
        うつくしい　さえずりは　いかく。
        なわばりに　はいった　ものは
        ようしゃなく　つつきまくる。
      ja: |-
        美しい　さえずりは　威嚇。
        縄張りに　入った　ものは
        容赦なく　突きまくる。
      ko: |-
        아름답게 지저귀는 소리는 위협하고
        있다는 뜻이다. 영역에 들어온 자는
        용서 없이 콕콕 쪼아버린다.
      zh-Hant: |-
        婉轉的叫聲是在威嚇對方。
        對於闖入自己地盤的傢伙
        會毫不留情地啄個不停。
      zh-Hans: |-
        它优美的鸣叫其实是威吓。
        对于进入自己领地的家伙，
        会毫不留情地啄个不停。
      en: |-
        Its melodious cries are actually warnings.
        Fletchling will mercilessly peck at anything
        that enters its territory.
      fr: |-
        Son chant mélodieux est en fait une tentative
        d’intimidation. Il picore sans merci tout individu
        qui pénètre dans son territoire.
      de: |-
        Sein wunderschönes Zwitschern ist in Wirklichkeit
        eine Warnung. Wer in sein Revier eindringt, wird
        gnadenlos von ihm gepickt.
      es: |-
        Sus melodiosos gorjeos son en realidad un aviso.
        Acribilla a picotazos a todo el que ose invadir su
        territorio.
      it: |-
        I suoi meravigliosi cinguettii sono in realtà
        versi minacciosi. Becca senza pietà chi invade
        il suo territorio.
    shield:
      ja-Hrkt: |-
        こうふんすると　たいおんが
        グッと　あがる。　すでで　さわると
        ヤケドすることも　あるほどだ。
      ja: |-
        興奮すると　体温が
        グッと　上がる。　素手で　触ると
        火傷することも　あるほどだ。
      ko: |-
        흥분하면 체온이 확 오른다.
        맨손으로 만지면
        화상을 입기도 할 정도다.
      zh-Hant: |-
        一旦興奮體溫就會
        急速上升。赤手去摸牠
        有時甚至會被灼傷。
      zh-Hans: |-
        一旦兴奋体温就会
        急剧上升。赤手去摸
        甚至有可能会被灼伤。
      en: |-
        When this Pokémon gets excited, its body
        temperature increases sharply. If you touch a
        Fletchling with bare hands, you might get burned.
      fr: |-
        Quand il est surexcité, sa température corporelle
        augmente d’un coup, à tel point qu’il est possible
        de se brûler en le touchant à mains nues.
      de: |-
        Ist es aufgeregt, steigt seine Körpertemperatur
        so stark an, dass man sich verbrennen kann,
        wenn man es mit bloßen Händen anfasst.
      es: |-
        Su temperatura corporal aumenta de repente
        cuando se exalta y puede causar quemaduras
        al contacto con la piel.
      it: |-
        Quando si innervosisce, la sua temperatura
        corporea sale di colpo, tanto da causare
        scottature a chi lo tocca a mani nude.
