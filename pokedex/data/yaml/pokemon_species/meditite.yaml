  flavor_text:
    ruby:
      en: |-
        MEDITITE undertakes rigorous mental
        training deep in the mountains.
        However, whenever it meditates, thisPOKéMON always loses its concentration
        and focus. As a result, its training
        never ends.
    sapphire:
      en: |-
        MEDITITE heightens its inner energy
        through meditation. It survives on
        just one berry a day.Minimal eating is another aspect of
        this POKéMON’s training.
    emerald:
      en: |-
        It continually meditates for hours every
        day. As a result of rigorous and dedicated
        yoga training, it has tempered its
        spiritual power so much it can fly.
    firered:
      en: |-
        It never skips its daily yoga training.
        It heightens its inner strength through
        meditation.
    leafgreen:
      en: |-
        It never skips its daily yoga training.
        It heightens its inner strength through
        meditation.
    diamond:
      en: |-
        It eats just one berry a day.
        By enduring hunger, its spirit is
        tempered and made sharper.
    pearl:
      en: |-
        It never misses its daily yoga
        workouts, and it heightens its
        spiritual power through meditation.
    platinum:
      en: |-
        It always trains deep in mountains.
        It levitates when it heightens its
        spiritual power through meditation.
    heartgold:
      en: |-
        It meditates to heighten its inner
        energy and to float in the air.
        It eats one berry a day.
    soulsilver:
      en: |-
        It meditates to heighten its inner
        energy and to float in the air.
        It eats one berry a day.
    black:
      en: |-
        It always trains deep in mountains.
        It levitates when it heightens its
        spiritual power through meditation.
      fr: |-
        Son entraînement d’ermite lui
        permet de léviter par le seul
        pouvoir de la méditation.
    white:
      en: |-
        It always trains deep in mountains.
        It levitates when it heightens its
        spiritual power through meditation.
      fr: |-
        Son entraînement d’ermite lui
        permet de léviter par le seul
        pouvoir de la méditation.
    black-2:
      en: |-
        It always trains deep in mountains.
        It levitates when it heightens its
        spiritual power through meditation.
    white-2:
      en: |-
        It always trains deep in mountains.
        It levitates when it heightens its
        spiritual power through meditation.
    x:
      ja-Hrkt: |-
        いつもは　やまおくで　しゅぎょう。
        めいそうをして　せいしんりょくを
        たかめると　からだが　うかびあがる。
      ja: |-
        いつもは　山奥で　修行。
        めいそうをして　精神力を　高めると
        体が　浮かび上がる。
      ko: |-
        평상시는 깊은 산속에서 수행한다.
        명상을 하고 정신력을
        높이면 몸이 떠오른다.
      en: |-
        It always trains deep in mountains. It levitates
        when it heightens its spiritual power
        through meditation.
      fr: |-
        Son entraînement d’ermite lui permet de léviter par
        le seul pouvoir de la méditation.
      de: |-
        Trainiert tief in den Bergen. Erhöht es seine
        spirituelle Kraft durch Meditation, kann es schweben.
      es: |-
        Se entrena en la profundidad de las montañas. Cuando
        aumenta su poder espiritual con meditación, levita.
      it: |-
        Si allena in montagna per elevare il suo potere
        spirituale. Con la meditazione riesce a levitare.
    'y':
      ja-Hrkt: |-
        １にち　１こだけ　きのみを　たべる。
        くうふくに　たえることで
        こころが　とぎすまされていく。
      ja: |-
        １日　１個だけ　木の実を　食べる。
        空腹に　耐えることで
        心が　研ぎ澄まされていく。
      ko: |-
        하루에 하나만 나무열매를 먹는다.
        배고픔을 참는 것으로
        마음을 갈고 닦아간다.
      en: |-
        It eats just one berry a day. By enduring hunger,
        its spirit is tempered and made sharper.
      fr: |-
        Il ne mange qu’une Baie par jour. La faim lui a forgé
        une volonté de fer.
      de: |-
        Es isst gerade mal eine Beere am Tag. Durch Hunger
        wird sein Geist ruhiger und schärfer.
      es: |-
        Solo come una baya al día. El ayuno fortalece su
        espíritu y su capacidad de concentración.
      it: |-
        Mangia solo una bacca al giorno. Resistendo alla
        fame, il suo spirito viene temprato e rinvigorito.
    omega-ruby:
      ja-Hrkt: |-
        やまおくで　ヨガの　しゅぎょうを　している。
        めいそうを　していても　しゅうちゅうりょくが
        とぎれてしまうため　しゅぎょうは　おわらない。
      ja: |
        山奥で　ヨガの　修行を　している。
        めいそうを　していても　集中力が
        途切れてしまうため　修行は　終わらない。
      ko: |-
        산속에서 요가 수행을 한다.
        명상을 하고 있어도 집중력이
        떨어지기 때문에 수행이 끝나지 않는다.
      en: |-
        Meditite undertakes rigorous mental training deep in the
        mountains. However, whenever it meditates, this Pokémon
        always loses its concentration and focus. As a result,
        its training never ends.
      fr: |-
        Méditikka poursuit un difficile entraînement mental dans
        les montagnes. Cependant, à chaque fois qu’il médite,
        ce Pokémon perd sa concentration. Du coup, son
        entraînement ne s’arrête jamais.
      de: |-
        Meditie unterzieht sich einem strikten mentalen Training
        tief in den Bergen. Wenn es meditiert, verliert es jedoch
        immer seine Konzentration. Deshalb wird sein Training
        niemals ein Ende haben.
      es: |-
        Meditite lleva a cabo un entrenamiento mental exhaustivo en lo
        más profundo de las montañas. Aunque, cuando medita, pierde
        toda la concentración y se descentra. Por eso, no deja nunca
        de entrenarse.
      it: |-
        Meditite esegue rigorosi esercizi mentali in montagna.
        Tuttavia, quando è immerso in meditazione, perde sempre
        la concentrazione, dovendo così ricominciare da capo.
        Il suo esercizio dunque non finisce mai.
    alpha-sapphire:
      ja-Hrkt: |-
        めいそうで　せいしんエネルギーを　たかめている。
        １にちに　きのみを　１こだけしか　たべない。
        あまり　たべない　ことも　しゅぎょうの　ひとつ。
      ja: |-
        めいそうで　精神エネルギーを　高めている。
        １日に　きのみを　１個だけしか　食べない。
        あまり　食べない　ことも　修行の　一つ。
      ko: |-
        명상으로 정신 에너지를 높이고 있다.
        하루에 나무열매를 한 개만 먹는다.
        별로 먹지 않는 것도 수행의 하나다.
      en: |-
        Meditite heightens its inner energy through meditation.
        It survives on just one berry a day. Minimal eating is another
        aspect of this Pokémon’s training.
      fr: |-
        Méditikka intensifie son énergie intérieure grâce à la
        méditation. Il lui suffit d’une Baie par jour pour survivre.
        La diète fait partie de l’entraînement de ce Pokémon.
      de: |-
        Meditie erhöht seine Energie durch Meditation. Es lebt von
        nur einer Beere am Tag. Diese absolut reduzierte Ernährung
        ist Bestandteil seines Trainings.
      es: |-
        Meditite aumenta su energía interior mediante meditación.
        Para subsistir le basta con una baya al día. El comer poco
        entra dentro de su entrenamiento.
      it: |-
        Meditite incrementa la sua energia interiore grazie alla
        meditazione. La sua alimentazione minima - si nutre di
        una bacca al giorno - è un’altra peculiarità dell’esercizio
        di questo Pokémon.
