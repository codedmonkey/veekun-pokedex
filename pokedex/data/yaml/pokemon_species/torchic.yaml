        very warm to hug. It launches
        fireballs of 1,800 degrees F.
    white-2:
      en: |-
        A fire burns inside, so it feels
        very warm to hug. It launches
        fireballs of 1,800 degrees F.
    x:
      ja-Hrkt: |-
        おなかに　ほのおぶくろを　もつ。
        だきしめると　ぽかぽか　あたたかい。
        いのち　ある　かぎり　もえつづける。
      ja: |-
        お腹に　炎袋を　持つ。
        抱きしめると　ぽかぽか　温かい。
        命ある　限り　燃え続ける。
      ko: |-
        몸속에 불꽃 주머니를 지니고 있어서
        껴안으면 따끈따끈하다.
        살아 있는 한 계속 불타오른다.
      en: |-
        It has a flame sac inside its belly that perpetually
        burns. It feels warm if it is hugged.
      fr: |-
        Poussifeu possède, dans son ventre, une poche
        de feu qui brûle sans arrêt. Il donne une impression
        de chaleur quand on lui fait des câlins.
      de: |-
        In seinem Bauch ist ein Flammensack, der stets
        brennt. Umarmt man es, fühlt es sich warm an.
      es: |-
        En su interior, guarda una llama que arde sin cesar.
        Si se le abraza, se nota que tiene una temperatura
        muy alta.
      it: |-
        Nel ventre ha una sacca di fuoco che brucia in
        continuazione. Se lo si abbraccia, emana calore.
    'y':
      ja-Hrkt: |-
        たいないで　ほのおが　もえているので
        だきしめると　とても　あたたかい。
        １０００どの　ひのたまを　とばす。
      ja: |-
        体内で　炎が　燃えているので
        抱きしめると　とても　温かい。
        １０００度の　火の玉を　飛ばす。
      ko: |-
        체내에 불꽃이 타오르고 있어
        껴안으면 무척 따뜻하다.
        1000도의 불구슬을 날린다.
      en: |-
        A fire burns inside, so it feels very warm to hug.
        It launches fireballs of 1,800 degrees Fahrenheit.
      fr: |-
        Ses câlins réchauffent car il renferme une fournaise.
        Il envoie des boules de feu à 1 000 °C.
      de: |-
        In seinem Inneren lodert ein Feuer. Es schleudert
        1 000 °C heiße Feuerbälle.
      es: |-
        En su interior arde una llama que mantiene su cuerpo
        caliente. Tira bolas de fuego a 1000 °C.
      it: |-
        Nel suo corpo brucia una fiamma e abbracciandolo
        si avverte calore. Lancia palle di fuoco a 1000 °C.
    omega-ruby:
      ja-Hrkt: |-
        トレーナーに　くっついて　ちょこちょこ　あるく。
        くちから　とばす　ほのおは　せっし　１０００ど。
        あいてを　くろコゲにする　しゃくねつの　たまだ。
      ja: |-
        トレーナーに　くっついて　ちょこちょこ　歩く。
        口から　飛ばす　炎は　摂氏　１０００度。
        相手を　黒コゲにする　灼熱の　玉だ。
      ko: |-
        트레이너에게 바짝 붙어 아장아장 걷는다.
        입에서 날리는 불꽃은 섭씨 1000도다.
        상대를 새까맣게 태우는 작열하는 불덩이다.
      en: |-
        Torchic sticks with its Trainer, following behind with
        unsteady steps. This Pokémon breathes fire of over
        1,800 degrees Fahrenheit, including fireballs that leave
        the foe scorched black.
      fr: |-
        Poussifeu ne lâche pas son Dresseur d’une semelle,
        marchant maladroitement derrière lui. Ce Pokémon crache
        des flammes pouvant atteindre 1 000 °C et des boules de feu
        qui carbonisent l’ennemi.
      de: |-
        Flemmli hängt an seinem Trainer wie eine Klette. Es schlurft
        immer hinter ihm her. Dieses Pokémon spuckt 1 000 °C
        heißes Feuer, das seinen Feinden ordentlich einheizt.
      es: |-
        Torchic no se separa de su Entrenador. Siempre va tras él con
        sus pasitos inseguros. Este Pokémon escupe bolas de fuego
        que pueden alcanzar los 1000 °C y carbonizar al enemigo.
      it: |-
        Torchic segue il proprio Allenatore ovunque, saltellandogli
        dietro con passo incerto. Questo Pokémon sputa fiammate
        roventi a 1000 °C, con sfere infuocate capaci di carbonizzare
        il nemico.
    alpha-sapphire:
      ja-Hrkt: |-
        たいないに　ほのおを　もやす　ばしょが　あるので
        だきしめると　ぽかぽか　とっても　あたたかい。
        ぜんしん　ふかふかの　うもうに　おおわれている。
      ja: |-
        体内に　炎を　燃やす　場所が　あるので
        抱きしめると　ぽかぽか　とっても　暖かい。
        全身　ふかふかの　羽毛に　覆われている。
      ko: |-
        체내에 불꽃을 태우는 곳이 있어서
        껴안으면 따끈따끈 정말 따뜻하다.
        전신이 푹신푹신한 깃털로 덮여 있다.
      en: |-
        Torchic has a place inside its body where it keeps its flame.
        Give it a hug—it will be glowing with warmth. This Pokémon is
        covered all over by a fluffy coat of down.
      fr: |-
        Poussifeu dispose d’un endroit dans son corps pour stocker
        sa flamme. Si on lui fait un gros câlin, sa flamme s’illumine
        chaleureusement. Ce Pokémon est couvert d’un duvet
        très doux.
      de: |-
        In Flemmlis Körper brennt eine Flamme. Wenn man es
        umarmt, beginnt es zu glühen. Dieses Pokémon trägt ein
        flauschiges Fell aus Daunen.
      es: |-
        Torchic tiene un lugar en el interior de su organismo en el
        que guarda la llama que posee. Si le das un abrazo, arderá
        encantado. Este Pokémon está recubierto totalmente de
        sedoso plumón.
      it: |-
        Nel corpo di Torchic è custodita la sua fiamma.
        Abbracciandolo si illumina emanando un incredibile calore.
        Questo Pokémon è ricoperto da un piumaggio soffice e caldo.
