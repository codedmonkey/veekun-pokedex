        its eyes into gemstones.
    x:
      ja-Hrkt: |-
        どうくつの　くらやみに　ひそむ。
        ほうせきを　たべているうちに
        めが　ほうせきに　なってしまった。
      ja: |-
        洞窟の　暗闇に　潜む。
        宝石を　食べているうちに
        目が　宝石に　なってしまった。
      ko: |-
        동굴의 어둠에 숨는다.
        보석을 먹는 사이에
        눈이 보석이 되어 버렸다.
      en: |-
        It hides in the darkness of caves. Its diet of gems
        has transformed its eyes into gemstones.
      fr: |-
        À force de manger des gemmes, les yeux de ce
        Pokémon des grottes obscures sont devenus des
        joyaux.
      de: |-
        Es versteckt sich im Dunkeln von Höhlen.
        Seine Augen sind Edelsteine.
      es: |-
        Se oculta en cavernas oscuras. De tanto comer gemas,
        sus ojos son piedras preciosas.
      it: |-
        Si cela nell’oscurità delle caverne. Si nutre di gemme
        e per questo i suoi occhi sono pietre preziose.
    'y':
      ja-Hrkt: |-
        くらい　どうくつに　すみかを　つくり
        するどい　ツメを　つかって
        ほうせきを　ほりだしては　たべる。
      ja: |-
        暗い　洞窟に　住処を　作り
        鋭い　ツメを　使って
        宝石を　掘り出しては　食べる。
      ko: |-
        어두운 동굴에 거처를 만들어
        예리한 손톱을 써서
        보석을 파내어 먹는다.
      en: |-
        It dwells in the darkness of caves. It uses its sharp
        claws to dig up gems to nourish itself.
      fr: |-
        Ce Pokémon vit dans les grottes obscures et mange
        des gemmes qu’il déterre avec ses griffes acérées.
      de: |-
        Es haust in düsteren Höhlen, wo es mit seinen
        spitzen Klauen Edelsteine ausgräbt und verspeist.
      es: |-
        Hace su guarida en cuevas oscuras. Usa sus afiladas
        garras para desenterrar las gemas que se come.
      it: |-
        Si costruisce la tana in grotte oscure dove con le
        affilate unghie scava gemme per poi nutrirsene.
    omega-ruby:
      ja-Hrkt: |-
        どうくつの　おくで　ひっそりと　せいかつする。
        くらやみで　ひとみが　あやしく　かがやく　とき
        ひとの　たましいを　うばうと　おそれられている。
      ja: |-
        洞窟　奥で　ひっそりと　生活する。
        暗闇で　瞳が　怪しく　輝く　とき
        人の　魂を　奪うと　恐れられている。
      ko: |-
        동굴 깊은 곳에서 은밀히 생활한다.
        어둠 속에서 눈동자가 수상하게 빛날 때 사람의
        영혼을 빼앗는다며 두려움의 대상이 되고 있다.
      en: |-
        Sableye lead quiet lives deep inside caverns.
        They are feared, however, because these Pokémon are
        thought to steal the spirits of people when their eyes burn
        with a sinister glow in the darkness.
      fr: |-
        Les Ténéfix mènent une vie tranquille dans les cavernes.
        Pourtant, ils sont craints, car on raconte que ces Pokémon
        volent l’esprit des gens quand leurs yeux brillent
        dans l’obscurité.
      de: |-
        Zobiris führt ein ruhiges, zurückgezogenes Leben tief im Innern
        einer Höhle. Es ist aber trotzdem sehr gefürchtet, da man sagt,
        es stehle die Seelen der Menschen, wenn seine Augen im
        Dunkeln furchterregend funkeln.
      es: |-
        Los Sableye hacen una vida muy tranquila en cavernas, pero
        son muy temidos. Se dice que, cuando los ojos les brillan de
        manera siniestra, están robándole el alma a alguien.
      it: |-
        Sableye conduce una vita tranquilla nel profondo delle grotte.
        Tuttavia, è molto temuto perché si dice che rubi lo spirito
        degli umani con lo sguardo sinistro dei suoi occhi opalescenti
        che fendono le tenebre.
    alpha-sapphire:
      ja-Hrkt: |-
        するどい　ツメで　つちを　ほり　いしを　たべる。
        いしに　ふくまれた　せいぶんは　けっしょうとなり
        からだの　ひょうめんに　うかびあがってくる。
      ja: |-
        鋭い　ツメで　土を　掘り　石を　食べる。
        石に　含まれた　成分は　結晶となり
        体の　表面に　浮かび上がってくる。
      ko: |-
        날카로운 발톱으로 땅을 파고 돌을 먹는다.
        돌에 포함된 성분은 결정이 되어
        몸의 표면에 나타난다.
      en: |-
        Sableye digs the ground with sharpened claws to find rocks
        that it eats. Substances in the eaten rocks crystallize and rise
        up to the Pokémon’s body surface.
      fr: |-
        Ténéfix creuse le sol avec ses griffes acérées pour trouver
        des rochers à manger. Les substances des rochers avalés
        se cristallisent et remontent sur la peau de ce Pokémon.
      de: |-
        Zobiris durchwühlt mit seinen scharfen Krallen den Erdboden
        auf der Suche nach Steinen, von denen es sich ernährt.
        Die Substanzen in den Steinen nehmen schließlich eine
        feste Form an und gelangen auf seine Körperoberfläche.
      es: |-
        Sableye cava en el suelo para buscar con las afiladas garras
        que tiene rocas para comer. Las sustancias que hay en las
        rocas que ingiere se solidifican y se le quedan en la piel.
      it: |-
        Sableye scava il terreno con i suoi artigli affilati per trovare
        le pietre di cui si nutre. Le sostanze ingerite si cristallizzano
        ed emergono a livello epidermico.
    sun:
      ja-Hrkt: |-
        ほうせきが　こうぶつで　メレシーを
        ねらって　つけまわしているが
        ガバイトに　よこどり　されてしまう。
      ja: |-
        宝石が　好物で　メレシーを
        狙って　付け回しているが
        ガバイトに　横取り　されてしまう。
      ko: |-
        보석을 좋아해서 멜리시를
        노리고 끈질기게 따라다니지만
        한바이트가 가로채 버린다.
      zh-Hant: |-
        非常喜歡寶石，
        因此到處追著小碎鑽跑，
        但卻被尖牙陸鯊半路奪走。
      zh-Hans: |-
        非常喜欢宝石，
        因此到处追着小碎钻。
        但却被尖牙陆鲨半路夺走。
      en: |-
        It’s a fiend for gemstones, so it stalks Carbink.
        Unfortunately, Gabite almost always grabs
        them first.
      fr: |-
        Comme il adore tout ce qui brille, il traque
        souvent les Strassie. Malheureusement, il se fait
        tout aussi souvent devancer par Carmache.
      de: |-
        Seine Liebe zu Edelsteinen treibt es dazu,
        Rocara nachzustellen. Knarksel kommt ihm
        allerdings immer zuvor.
      es: |-
        Le gustan mucho las joyas, por lo que suele
        merodear cerca de los Carbink. Sin embargo, los
        Gabite siempre se le suelen adelantar.
      it: |-
        È ghiotto di gemme e va sempre a caccia di
        Carbink, ma è spesso preceduto dai Gabite.
    moon:
      ja-Hrkt: |-
        ほうせきの　ひとみが　あやしく
        かがやくとき　ひとの　たましいを
        うばうと　おそれられる　ポケモン。
      ja: |-
        宝石の　瞳が　怪しく
        輝くとき　人の　魂を
        奪うと　恐れられる　ポケモン。
      ko: |-
        보석 눈동자가 수상하게 빛날 때
        사람의 영혼을 빼앗는다며
        두려움의 대상이 된 포켓몬이다.
      zh-Hant: |-
        寶石的眼睛發出詭異光芒時，
        就會攝取人的魂魄。
        是令人恐懼的寶可夢。
      zh-Hans: |-
        宝石的眼睛发出诡异光芒时，
        就会摄取人的魂魄。
        是令人恐惧的宝可梦。
      en: |-
        This Pokémon is feared. When its gemstone eyes
        begin to glow with a sinister shine, it’s believed
        that Sableye will steal people’s spirits away.
      fr: |-
        Pokémon redouté de beaucoup, car l’éclat
        de ses yeux précieux donne l’impression qu’il
        s’apprête à dérober l’âme de ceux qu’il regarde.
      de: |-
        Es ist gefürchtet, da man sagt, es stehle
        die Seelen der Menschen, wenn seine
        Edelsteinaugen furchterregend funkeln.
      es: |-
        Se dice que, cuando las gemas de los ojos
        de estos Pokémon brillan de manera siniestra,
        están robándole el alma a alguien.
      it: |-
        È molto temuto perché si dice che rubi lo spirito
        degli esseri umani con lo sguardo sinistro
        dei suoi occhi opalescenti.
    ultra-sun:
      ja-Hrkt: |-
        かたいツメで　つちを　ほり　ふとい
        キバで　ほうせきを　バリバリかじる。
        メレシーが　だいこうぶつだ。
      ja: |-
        硬いツメで　土を　掘り　太い
        キバで　宝石を　バリバリかじる。
        メレシーが　大好物だ。
      ko: |-
        딱딱한 발톱으로 땅에 구멍을 파고
        굵은 이빨로 보석을 북북 갉는다.
        멜리시를 매우 좋아한다.
      zh-Hant: |-
        會用堅硬的爪子挖土，
        並用粗壯的獠牙啃食寶石。
        最喜歡吃小碎鑽。
      zh-Hans: |-
        用坚硬的爪子掘土，
        用粗粗的牙齿嘎嘣嘎嘣地嚼宝石。
        非常喜欢吃小碎钻。
      en: |-
        It digs through the ground with its hard claws
        and crunches down gems with its thick pointy
        teeth. Carbink is its favorite food.
      fr: |-
        Il creuse le sol de ses griffes acérées pour
        trouver des gemmes, qu’il croque comme
        s’il s’agissait de chips. Il raffole des Strassie.
      de: |-
        Mit seinen scharfen Krallen gräbt es nach
        Edelsteinen, die es mit seinen dicken Fängen
        zerbeißt. Besonders gern frisst es Rocara.
      es: |-
        Horada la tierra con sus duras garras y extrae
        gemas que luego desmenuza con sus gruesos
        colmillos. Los Carbink son su manjar predilecto.
      it: |-
        Scava il terreno con gli artigli robusti e frantuma
        le gemme con le grosse zanne.
        È molto ghiotto di Carbink.
    ultra-moon:
      ja-Hrkt: |-
        からだの　ひょうめんに　くった
        ほうせきの　せいぶんが　うきだす。
        その　パターンは　むげんだいだ。
      ja: |-
        身体の　表面に　食った
        宝石の　成分が　浮きだす。
        その　パターンは　無限大だ。
      ko: |-
        신체의 표면에 먹은
        보석의 성분이 떠오른다.
        그 패턴은 무한대다.
      zh-Hant: |-
        吃下的寶石成分會在身體
        表面浮現出來。所形成的
        花紋有無限多種變化。
      zh-Hans: |-
        所吃宝石的成分会在
        身体表面浮现出来。
        所形成的花纹变化无限。
      en: |-
        Materials from gems it has eaten float to the
        surface of its body and can form an infinite
        number of patterns among individuals.
      fr: |-
        Les éléments présents dans les gemmes qu’il
        mange remontent à la surface de son corps,
        formant des motifs d’une infinie variété.
      de: |-
        Die Substanzen der Edelsteine, die es frisst,
        verfestigen sich an seiner Körperoberfläche,
        wobei unendlich viele Musterungen entstehen.
      es: |-
        Algunos de los elementos de las gemas con las
        que se alimenta emergen en su piel creando
        patrones variopintos.
      it: |-
        Le sostanze contenute nelle gemme che
        ingerisce emergono a livello epidermico e
        formano i motivi più disparati.
    sword:
      ja-Hrkt: |-
        ほうせきの　ひとみが　あやしく
        かがやくとき　ひとの　たましいを
        うばうと　おそれられる　ポケモン。
      ja: |-
        宝石の　瞳が　怪しく
        輝くとき　人の　魂を
        奪うと　恐れられる　ポケモン。
      ko: |-
        보석 눈동자가 수상하게 빛날 때
        사람의 영혼을 빼앗는다며
        두려움의 대상이 된 포켓몬이다.
      zh-Hant: |-
        寶石的眼睛發出詭異光芒時，
        就會攝取人的魂魄。
        是令人恐懼的寶可夢。
      zh-Hans: |-
        宝石的眼睛发出诡异光芒时，
        就会摄取人的魂魄。
        是令人恐惧的宝可梦。
      en: |-
        This Pokémon is feared. When its gemstone eyes
        begin to glow with a sinister shine, it’s believed
        that Sableye will steal people’s spirits away.
      fr: |-
        Beaucoup de gens le craignent, car l’éclat
        de ses yeux précieux donne l’impression qu’il
        s’apprête à dérober l’âme de ceux qu’il regarde.
      de: |-
        Man sagt, es stehle die Seelen der Menschen,
        wenn seine Edelsteinaugen furchterregend
        funkeln. Viele fürchten es deswegen.
      es: |-
        Se dice que, cuando las gemas de los ojos de
        estos Pokémon tan temidos brillan de manera
        siniestra, están robándole el alma a alguien.
      it: |-
        È molto temuto perché si dice che rubi lo spirito
        degli esseri umani con lo sguardo sinistro dei suoi
        occhi opalescenti.
    shield:
      ja-Hrkt: |-
        ほうせきの　けっしょうを　たべる。
        くらやみの　なかでは　りょうめが
        ほうせきの　かがやきを　はなつ。
      ja: |-
        宝石の　結晶を　食べる。
        暗闇の　中では　両目が
        宝石の　輝きを　放つ。
      ko: |-
        보석의 결정을 먹는다.
        어둠 속에서는 두 눈이 
        보석의 빛을 낸다.
      zh-Hant: |-
        會去吃寶石的結晶。
        雙眼在漆黑一片的地方
        會發出寶石的光芒。
      zh-Hans: |-
        会去吃宝石的结晶。
        双眼在漆黑一片的地方
        会发出宝石的光芒。
      en: |-
        It feeds on gemstone crystals. In darkness, its
        eyes sparkle with the glitter of jewels.
      fr: |-
        Ce Pokémon se nourrit de pierres précieuses.
        Dans les ténèbres, ses yeux brillent du reflet
        des joyaux.
      de: |-
        Es ernährt sich von Edelsteinen. Im Dunkeln
        funkeln seine beiden Augen wie Juwelen.
      es: |-
        Se alimenta de gemas. En la oscuridad, los ojos
        le brillan con el destello de las piedras preciosas.
      it: |-
        Si nutre di gemme. Nell’oscurità i suoi occhi
        brillano come gioielli.
