snorunt:
  base_happiness: 50
  capture_rate: 190
  color: gray
  egg_groups:
    - fairy
    - mineral
  evolution_chain: snorunt
  evolves_from: ~
  flavor_text:
    ruby:
      en: |-
        SNORUNT live in regions with heavy
        snowfall. In seasons without snow, such
        as spring and summer, this POKéMONsteals away to live quietly among
        stalactites and stalagmites deep in
        caverns.
    sapphire:
      en: |-
        SNORUNT survives by eating only snow
        and ice.
        Old folklore claims that a house visitedby this POKéMON is sure to prosper for
        many generations to come.
    emerald:
      en: |-
        They tend to move about in groups of
        around five SNORUNT. In snowy regions,
        it is said that when they are seen late at
        night, snowfall will arrive by morning.
    firered:
      en: |-
        It is said that a home visited by a
        SNORUNT will prosper. It can withstand
        cold of minus 150 degrees Fahrenheit.
    leafgreen:
      en: |-
        It is said that a home visited by a
        SNORUNT will prosper. It can withstand
        cold of minus 150 degrees Fahrenheit.
    diamond:
      en: |-
        In the snow country, certain
        folklore says a house will
        prosper if a SNORUNT lives there.
    pearl:
      en: |-
        In the snow country, certain
        folklore says a house will
        prosper if a SNORUNT lives there.
    platinum:
      en: |-
        It is said that several SNORUNT
        gather under giant leaves and
        live together in harmony.
    heartgold:
      en: |-
        It’s said that if they are seen at
        midnight, they’ll cause heavy snow.
        They eat snow and ice to survive.
    soulsilver:
      en: |-
        It’s said that if they are seen at
        midnight, they’ll cause heavy snow.
        They eat snow and ice to survive.
    black:
      en: |-
        It is said that several Snorunt
        gather under giant leaves and
        live together in harmony.
      fr: |-
        On dit que des groupes entiers de
        Stalgamin vivent en harmonie
        sous des feuilles gigantesques.
    white:
      en: |-
        It is said that several Snorunt
        gather under giant leaves and
        live together in harmony.
      fr: |-
        On dit que des groupes entiers de
        Stalgamin vivent en harmonie
        sous des feuilles gigantesques.
    black-2:
      en: |-
        It is said that several Snorunt
        gather under giant leaves and
        live together in harmony.
    white-2:
      en: |-
        It is said that several Snorunt
        gather under giant leaves and
        live together in harmony.
    x:
      ja-Hrkt: |-
        おおきな　はっぱの　したに
        すうひきの　ユキワラシが　あつまり
        なかよく　くらしているという。
      ja: |-
        大きな　葉っぱの　下に
        数匹の　ユキワラシが　集まり
        仲良く　暮らしているという。
      ko: |-
        커다란 잎사귀 아래서
        여러 마리의 눈꼬마가 모여
        사이좋게 살고 있다고 한다.
      en: |-
        It is said that several Snorunt gather under giant
        leaves and live together in harmony.
      fr: |-
        On dit que des groupes entiers de Stalgamin vivent
        en harmonie sous des feuilles gigantesques.
      de: |-
        Gerüchten zufolge sammeln sich Schneppke unter
        riesigen Blättern und leben dort friedlich zusammen.
      es: |-
        Se dice que se reúnen en grupos bajo hojas
        gigantescas y viven allí en total armonía.
      it: |-
        Si dice che gli Snorunt vivano in armonia riuniti
        sotto gigantesche foglie.
    'y':
      ja-Hrkt: |-
        ユキワラシの　すみついた　いえは
        おかねもちになるという　いいつたえが
        ゆきぐにには　のこっている。
      ja: |-
        ユキワラシの　住み着いた　家は
        お金持ちになるという　言い伝えが
        雪国には　残っている。
      ko: |-
        눈꼬마가 자리 잡은 집은
        부자가 된다고 하는 전설이
        설국에는 남아 있다.
      en: |-
        In the snow country, certain folklore says a house
        will prosper if a Snorunt lives there.
      fr: |-
        Selon un vieux dicton des régions enneigées :
        « Stalgamin dans la maison, richesse à l’horizon ».
      de: |-
        Im Land des Schnees sagt eine Legende, dass in
        ein Haus Wohlstand einzieht, wenn es darin lebt.
      es: |-
        En las zonas nevadas, las leyendas dicen que si un
        Snorunt vive en una casa, trae prosperidad.
      it: |-
        Secondo alcune leggende delle regioni fredde, uno
        Snorunt porta prosperità alla casa in cui vive.
    omega-ruby:
      ja-Hrkt: |-
        ゆきの　おおい　とちで　くらす　ポケモン。
        はるや　なつの　ゆきの　ふらない　きせつには
        しょうにゅうどうの　おくで　しずかに　くらす。
      ja: |-
        雪の　多い　土地で　暮らす　ポケモン。
        春や　夏の　雪の　降らない　季節には
        しょう乳洞の　奥で　静かに　暮らす。
      ko: |-
        눈이 많은 땅에서 사는 포켓몬이다.
        봄이나 여름처럼 눈이 내리지 않는 계절에는
        석회암 동굴 깊은 곳에서 조용히 산다.
      en: |-
        Snorunt live in regions with heavy snowfall. In seasons
        without snow, such as spring and summer, this Pokémon
        steals away to live quietly among stalactites and stalagmites
        deep in caverns.
      fr: |-
        Les Stalgamin vivent dans les régions enneigées.
        Pendant les saisons sans neige, comme le printemps
        et l’été, ces Pokémon se retirent pour vivre dans
        les cavernes, au milieu des stalactites et des stalagmites.
      de: |-
        Schneppke lebt in Gebieten mit heftigem Schneefall.
        In Jahreszeiten, in denen es nicht schneit, wie im Frühling
        oder im Sommer, nimmt das Pokémon Reißaus, um in einer
        Höhle ein ruhiges Leben zwischen Stalaktiten und Stalagmiten
        zu führen.
      es: |-
        Snorunt vive en zonas de grandes nevadas. En primavera y
        verano, cuando no nieva, se retira a las cavernas para vivir
        tranquilamente entre estalactitas y estalagmitas.
      it: |-
        Snorunt vive in regioni molto nevose. Nelle stagioni più calde,
        come l’estate e la primavera, questo Pokémon si ritira a vivere
        in tranquillità nel cuore delle caverne tra stalattiti e stalagmiti.
    alpha-sapphire:
      ja-Hrkt: |-
        ゆきや　こおりだけを　たべて　くらしている。
        ユキワラシの　おとずれた　いえは　だいだい
        さかえるという　いいつたえが　のこっている。
      ja: |-
        雪や　氷だけを　食べて　暮らしている。
        ユキワラシの　訪れた　家は　代々
        栄えるという　言い伝えが　残っている。
      ko: |-
        눈이나 얼음만 먹고 생활하고 있다.
        눈꼬마가 찾아간 집은 대대로
        번창한다는 전설이 남아 있다.
      en: |-
        Snorunt survives by eating only snow and ice. Old folklore
        claims that a house visited by this Pokémon is sure to prosper
        for many generations to come.
      fr: |-
        Stalgamin survit en se nourrissant uniquement de neige
        et d’eau. De vieilles légendes racontent que les maisons
        visitées par ce Pokémon sont assurées d’être prospères
        pendant plusieurs générations.
      de: |-
        Schneppke kann überleben, indem es nur Schnee und Eis
        zu sich nimmt. Alte Überlieferungen besagen, dass ein Haus,
        welches von diesem Pokémon besucht wird, vielen kommenden
        Generationen Glück und Erfolg beschert.
      es: |-
        Snorunt sobrevive alimentándose solo de nieve y hielo. Se
        dice que la casa por la que pase este Pokémon estará llena
        de prosperidad durante generaciones.
      it: |-
        Snorunt si nutre soltanto di neve e ghiaccio.
        Gli antichi detti popolari affermano che questo Pokémon porta
        fortuna e prosperità per molte generazioni alle case che visita.
    sun:
      ja-Hrkt: |-
        きづくと　アローラで　ふえていた。
        ユキワラシが　すみついた　いえは
        ししそんそんに　さかえると　いう。
      ja: |-
        気づくと　アローラで　増えていた。
        ユキワラシが　棲みついた　家は
        子々孫々に　栄えると　いう。
      ko: |-
        어느새 알로라에서 늘어나 있었다.
        눈꼬마가 살고 있는 집은
        자자손손 번창한다고 한다.
      zh-Hant: |-
        不知不覺間已在阿羅拉增多起來。
        據說，有雪童子棲息的家庭
        會子孫滿堂家族繁榮。
      zh-Hans: |-
        等发觉时，已在阿罗拉增多起来。
        据说，雪童子栖息过的家庭
        会子孙满堂家族繁荣。
      en: |-
        Their numbers seem to have rapidly increased in
        Alola. Custom has it that houses where Snorunt
        live will be prosperous for generations to come.
      fr: |-
        De nombreux spécimens de ce Pokémon vivent
        dans la région d’Alola. On dit que les maisons
        abritant un Stalgamin seront prospères.
      de: |-
        Schneppke hat sich rasant in Alola verbreitet.
        Es heißt, das Haus, in dem es lebt, werde über
        viele Generationen blühen und gedeihen.
      es: |-
        Su número ha aumentado en la región de Alola.
        Dicen que traen prosperidad durante
        generaciones a las casas en las que habitan.
      it: |-
        È sempre più diffuso nella regione di Alola.
        Si dice che porti prosperità per generazioni
        agli abitanti delle case in cui vive.
    moon:
      ja-Hrkt: |-
        さむい　とちでしか　いきられない。
        マイナス　１００どの　かんきょうでも
        げんきに　はねまわっているよ。
      ja: |-
        寒い　土地でしか　生きられない。
        マイナス　１００度の　環境でも
        元気に　跳ねまわっているよ。
      ko: |-
        추운 땅에서만 살 수 있다.
        영하 100도의 환경에서도
        건강하게 뛰어다닌다.
      zh-Hant: |-
        只能在寒冷的土地上生存。
        即使在零下１００度的環境下
        也能充滿活力地到處蹦蹦跳跳哦。
      zh-Hans: |-
        只能在寒冷的土地上生存。
        即使在零下１００度的环境下
        也能充满活力地到处蹦蹦跳跳哦。
      en: |-
        It can only survive in cold areas. It bounces
        happily around, even in environments as cold as
        -150 degrees Fahrenheit.
      fr: |-
        Il ne peut voir le jour que dans les plus froides
        contrées. Il s’accommode parfaitement de
        températures atteignant les -100 °C.
      de: |-
        Schneppke kann nur in besonders kalten
        Gebieten leben. Selbst bei -100 °C hopst es
        munter umher.
      es: |-
        Las regiones frías son su hábitat natural. Se
        encuentra a sus anchas en lugares donde la
        temperatura alcanza los -100 °C.
      it: |-
        Sopravvive solo nelle regioni fredde.
        Si trova perfettamente a suo agio anche
        a una temperatura di -100 °C.
    ultra-sun:
      ja-Hrkt: |-
        ゆきや　こおりが　おもな　エサ。
        あたたかな　アローラでは　かぎられた
        ばしょ　でしか　いきていけない。
      ja: |-
        雪や　氷が　主な　エサ。
        暖かな　アローラでは　限られた
        場所　でしか　生きていけない。
      ko: |-
        눈과 얼음이 주요 먹이다.
        따듯한 알로라에서는 한정된
        장소에서만 살 수 있다.
      zh-Hant: |-
        雪和冰是牠的主食。
        在溫暖的阿羅拉地區，
        牠只能在少數地方生存。
      zh-Hans: |-
        雪和冰是它的主要食物。
        在温暖的阿罗拉只能在
        限定的地方生存。
      en: |-
        It feeds mainly on ice and snow. It’s only able to
        survive in a limited number of places in the
        warm Alola region.
      fr: |-
        Il se nourrit principalement de neige et de glace.
        Le climat chaud d’Alola le contraint à vivre dans
        des lieux bien spécifiques.
      de: |-
        Es ernährt sich hauptsächlich von Eis und
        Schnee. Im warmen Alola kann es daher nur
        an wenigen Orten überleben.
      es: |-
        Se alimenta sobre todo de hielo y nieve. Debido
        a las temperaturas cálidas que reinan en Alola,
        solo puede habitar en contados lugares.
      it: |-
        Si nutre principalmente di neve e ghiaccio.
        Ad Alola, dove il clima è generalmente caldo,
        sopravvive solo in determinate zone.
    ultra-moon:
      ja-Hrkt: |-
        さむい　とちの　かねもちは　みんな
        こどもの　ころに　ユキワラシと
        あそんだ　おもいでが　あるらしい。
      ja: |-
        寒い　土地の　金持ちは　みんな
        子どもの　頃に　ユキワラシと
        遊んだ　思い出が　あるらしい。
      ko: |-
        추운 토지의 부자들은 모두
        어린 시절에 눈꼬마와
        놀았던 추억이 있다고 한다.
      zh-Hant: |-
        寒冷地帶的有錢人們
        好像都有在小時候和
        雪童子一起玩的回憶。
      zh-Hans: |-
        寒冷地方的富人们，
        好像都会有小时候
        和雪童子一起玩的回忆。
      en: |-
        Rich people from cold areas all share childhood
        memories of playing with Snorunt.
      fr: |-
        Il semblerait que toute personne aisée ayant
        grandi dans les régions enneigées se rappelle
        avoir joué avec un Stalgamin étant enfant.
      de: |-
        Wohlhabende Leute aus kalten Gebieten haben
        alle in ihrer Kindheit mit Schneppke gespielt.
      es: |-
        Según parece, en las regiones frías todos los
        miembros de las familias pudientes recuerdan
        haber jugado con Snorunt en su infancia.
      it: |-
        Sembra che tutte le persone facoltose delle
        regioni fredde ricordino di aver giocato con
        uno Snorunt da piccoli.
    sword:
      ja-Hrkt: |-
        まよなか　あらわれる　ユキワラシは
        おおゆきを　ふらせると　いわれる。
        ゆきや　こおりを　たべて　くらす。
      ja: |-
        真夜中　現れる　ユキワラシは
        大雪を　降らせると　いわれる。
        雪や　氷を　食べて　暮らす。
      ko: |-
        한밤중에 나타나는 눈꼬마는
        큰 눈을 내리게 한다고 전해진다.
        눈과 얼음을 먹으며 지낸다.
      zh-Hant: |-
        據說半夜出現的
        雪童子會帶來大雪。
        靠吃雪和冰維生。
      zh-Hans: |-
        据说半夜出现的
        雪童子会带来大雪。
        靠吃雪和冰为生。
      en: |-
        It’s said that if they are seen at midnight, they’ll
        cause heavy snow. They eat snow and ice
        to survive.
      fr: |-
        Quand ce Pokémon apparaît la nuit, il provoque
        de fortes chutes de neige.
        Il se nourrit de glace et de neige.
      de: |-
        Erscheint es mitten in der Nacht, so sagt man,
        steht starker Schneefall bevor. Es ernährt sich
        von Eis und Schnee.
      es: |-
        Dicen que, si aparece a medianoche, provoca
        grandes nevadas. Se alimenta de nieve y hielo.
      it: |-
        Si dice che provochi forti nevicate se appare
        nel cuore della notte. Si nutre di neve e ghiaccio.
    shield:
      ja-Hrkt: |-
        さむい　とちでしか　いきられない。
        マイナス　１００どの　かんきょうでも
        げんきに　はねまわっているよ。
      ja: |-
        寒い　土地でしか　生きられない。
        マイナス　１００度の　環境でも
        元気に　跳ねまわっているよ。
      ko: |-
        추운 땅에서만 살 수 있다.
        영하 100도의 환경에서도
        건강하게 뛰어다닌다.
      zh-Hant: |-
        只能在寒冷的土地上生存。
        即使在零下１００度的環境下
        也能充滿活力地到處蹦蹦跳跳。
      zh-Hans: |-
        只能在寒冷的土地上生存。
        即使在零下１００度的环境下
        也能充满活力地到处蹦蹦跳跳。
      en: |-
        It can only survive in cold areas. It bounces
        happily around, even in environments as cold as
        −150 degrees Fahrenheit.
      fr: |-
        Il ne peut vivre que dans les plus froides contrées.
        Il s’accommode parfaitement de températures
        atteignant les - 100 °C.
      de: |-
        Schneppke kann nur in besonders kalten
        Gebieten leben. Selbst bei -100 ºC hopst es
        munter umher.
      es: |-
        Las regiones frías son su hábitat natural. Se
        encuentra a sus anchas incluso en lugares donde
        la temperatura alcanza los -100 °C.
      it: |-
        Sopravvive solo nelle regioni fredde.
        Si trova perfettamente a suo agio anche
        a una temperatura di -100 ºC.
    legends-arceus:
      en: |-
        Arrives alongside the first snow. It's thought that homes Snorunt
        visit will prosper for many generations. By tradition, one might
        offer a lump of ice made from pure water at one's front door.
