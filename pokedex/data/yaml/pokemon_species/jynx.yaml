    x:
      ja-Hrkt: |-
        こしを　ふるように　あるいている。
        ゆだんをすると　おもわず　つられて
        おどってしまうという。
      ja: |-
        腰を　振るように　歩いている。
        油断をすると　思わず　釣られて
        踊ってしまうという。
      ko: |-
        허리를 흔드는 듯이 걷고 있다.
        방심하면 엉겁결에 따라서
        춤춰버린다고 한다.
      en: |-
        It wiggles its hips as it walks. It can
        cause people to dance in unison with it.
      fr: |-
        Il ondule ses hanches en marchant et entraîne les
        gens dans des danses frénétiques.
      de: |-
        Der beschwingte Gang dieses Pokémon bezaubert
        Zuschauer und lässt sie im Takt dazu tanzen.
      es: |-
        Camina moviendo las caderas de forma llamativa.
        Puede hacer que la gente baile a su ritmo.
      it: |-
        Camminando ancheggia in modo seducente.
        La gente può essere indotta a seguire la sua danza.
    'y':
      ja-Hrkt: |-
        にんげんのような　ことばを　はなすが
        まだ　なにをいっているか　ふめいで
        げんざい　けんきゅうされている。
      ja: |-
        人間のような　言葉を　話すが
        まだ　なにを言っているか　不明で
        現在　研究されている。
      ko: |-
        인간처럼 말을 하지만
        아직 무슨 말을 하는지 알 수 없어
        현재 연구 중이다.
      en: |-
        It speaks using a language that sounds human.
        Research is under way to determine what is
        being said.
      fr: |-
        Il communique en utilisant un langage qui semble
        être humain. Des recherches sont en cours pour
        déterminer ce qu’il dit.
      de: |-
        Es spricht und benutzt dabei eine Sprache, die der
        des Menschen sehr ähnelt. Noch wird erforscht,
        was es wirklich spricht.
      es: |-
        Habla emitiendo sonidos que parecen humanos. Se
        está intentando descifrar lo que dice cuando habla.
      it: |-
        Parla usando un linguaggio simile a quello umano.
        Sono in corso studi per riuscire a interpretarlo.
    omega-ruby:
      ja-Hrkt: |-
        おどるような　こしつきで　リズミカルに　あるく。
        その　うごきは　みている　ひとも　おもわず
        こしを　ふってしまうほど　かろやかなのだ。
      ja: |-
        踊るような　腰つきで　リズミカルに　歩く。
        その　動きは　見ている　人も　思わず
        腰を　振ってしまうほど　軽やかなのだ。
      ko: |-
        춤추는 듯한 자세로 리드미컬하게 걷는다.
        그 움직임은 보고 있는 사람마저 얼떨결에
        허리를 흔들 정도로 경쾌하다.
      en: |-
        Jynx walks rhythmically, swaying and shaking its hips as if it
        were dancing. Its motions are so bouncingly alluring, people
        seeing it are compelled to shake their hips without giving any
        thought to what they are doing.
      fr: |-
        Lippoutou marche en rythme, ondule de tout son corps et
        se déhanche comme s’il dansait. Ses mouvements sont si
        communicatifs que les gens qui le voient sont soudain pris
        d’une terrible envie de bouger les hanches, sans réfléchir.
      de: |-
        Rossana bewegt sich rhythmisch fort. Es wiegt und schwingt
        seine Hüften, als würde es tanzen. Seine Bewegungen wirken
        so anziehend auf Menschen, dass diese beginnen, mit den
        Hüften zu schwingen, ohne darüber nachzudenken.
      es: |-
        Jynx camina con ritmo, balanceándose y moviendo las caderas
        como si estuviera bailando. Realiza unos movimientos tan
        vistosos y atractivos que no hay quien pueda resistirse a
        mover las caderas.
      it: |-
        Jynx avanza oscillando e ancheggiando ritmicamente come
        in una specie di danza tesa ad ammaliare il nemico.
        Chi vede questo Pokémon è costretto a iniziare la stessa
        danza senza pensare a cosa sta facendo.
    alpha-sapphire:
      ja-Hrkt: |-
        おどるような　こしつきで　リズミカルに　あるく。
        その　うごきは　みている　ひとも　おもわず
        こしを　ふってしまうほど　かろやかなのだ。
      ja: |-
