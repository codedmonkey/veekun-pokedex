        se déhanche comme s’il dansait. Ses mouvements sont si
        communicatifs que les gens qui le voient sont soudain pris
        d’une terrible envie de bouger les hanches, sans réfléchir.
      de: |-
        Rossana bewegt sich rhythmisch fort. Es wiegt und schwingt
        seine Hüften, als würde es tanzen. Seine Bewegungen wirken
        so anziehend auf Menschen, dass diese beginnen, mit den
        Hüften zu schwingen, ohne darüber nachzudenken.
      es: |-
        Jynx camina con ritmo, balanceándose y moviendo las caderas
        como si estuviera bailando. Realiza unos movimientos tan
        vistosos y atractivos que no hay quien pueda resistirse a
        mover las caderas.
      it: |-
        Jynx avanza oscillando e ancheggiando ritmicamente come
        in una specie di danza tesa ad ammaliare il nemico.
        Chi vede questo Pokémon è costretto a iniziare la stessa
        danza senza pensare a cosa sta facendo.
    ultra-sun:
      ja-Hrkt: |-
        どくとくの　リズムで　こしを　ふる。
        アローラに　すむ　ルージュラは
        そのキレが　じつに　すばらしい。
      ja: |-
        独特の　リズムで　腰を　振る。
        アローラに　棲む　ルージュラは
        そのキレが　実に　素晴らしい。
      ko: |-
        독특한 리듬으로 허리를 흔든다.
        알로라에 사는 루주라는
        그 동작이 실로 훌륭하다.
      zh-Hant: |-
        會以獨特的節奏扭動腰部。
        棲息在阿羅拉的迷唇姐
        動作更是特別完美無瑕。
      zh-Hans: |-
        会按独特的节奏扭动腰部。
        栖息在阿罗拉的迷唇姐，
        那动作更是妙不可言。
      en: |-
        It sways its hips to a rhythm all its own. The
        precise movements of Jynx living in Alola are
        truly wonderful.
      fr: |-
        Les Lippoutou se déhanchent sur un tempo très
        particulier, et ceux d’Alola sont particulièrement
        réputés pour leur admirable sens du rythme.
      de: |-
        Es bewegt seine Hüften in einem eigentümlichen
        Rhythmus. Rossana in Alola beherrschen einen
        besonders anmutigen Hüftschwung.
      es: |-
        Se bambolea con un ritmo peculiar que, en el
        caso de los ejemplares que viven en Alola, es
        realmente cautivador.
      it: |-
        Cammina ancheggiando a un ritmo tutto suo.
        I movimenti dei Jynx della regione di Alola sono
        particolarmente affascinanti.
    ultra-moon:
      ja-Hrkt: |-
        にんげんの　ことばのような　ふしぎな
        なきごえ。　ルージュラに　うたわせる
        きょくを　つくる　おんがくかもいる。
      ja: |-
        人間の　言葉のような　不思議な
        鳴き声。　ルージュラに　歌わせる
        曲を　作る　音楽家もいる。
      ko: |-
        인간의 언어를 닮은 이상한
        울음소리를 가졌다. 루주라가 부르는
        곡을 만드는 음악가도 있다.
      zh-Hant: |-
        奇異的叫聲聽起來就像是
        人類的語言。也有些音樂家
        會創作讓迷唇姐唱的曲子。
      zh-Hans: |-
        神奇的叫声听起来就像人类的
        语言一样。也有些音乐家
        会谱写一些让迷唇姐唱的曲子。
      en: |-
        Its strange cries sound like human language.
        There are some musicians who compose songs
        for Jynx to sing.
      fr: |-
        Ses étranges cris s’apparentent à des mots.
        Certains musiciens lui composent des chansons
        pour qu’il les interprète.
      de: |-
        Sein sonderbarer Ruf klingt fast wie die Sprache
        der Menschen. Manche Musiker schreiben sogar
        eigens Lieder, damit Rossana sie singen kann.
      es: |-
        Sus particulares gritos recuerdan al lenguaje
        humano. Algunos artistas han compuesto temas
        específicamente para estos Pokémon.
      it: |-
        Emette strani versi che ricordano il linguaggio
        umano. Alcuni compositori scrivono melodie
        appositamente per farle cantare ai Jynx.
    lets-go-pikachu:
      ja-Hrkt: |-
        どくとくの　リズムを　もつらしく
        おどるように　かろやかに　うごき
        こしをふる　ようにして　あるく。
      ja: |-
        独特の　リズムを　もつらしく
        踊るように　軽やかに　動き
        腰を振る　ようにして　歩く。
      ko: |-
        특유의 리듬감을 갖고 있다.
        춤추듯 경쾌하게 움직이며
        허리를 흔들며 걷는다.
      zh-Hant: |-
        似乎有著獨特的節奏感。
        會以跳舞般的輕快動作
        扭著腰來走路。
      zh-Hans: |-
        以独特的节奏悠然移动，
        仿佛是在跳舞。走路的
        姿势如同在扭腰一样。
      en: |-
        Appears to move to a rhythm of its own, as if it
        were dancing. It wiggles its hips as it walks.
      fr: |-
        Ce Pokémon bouge en rythme comme
        s’il dansait. Il ondule même du popotin
        quand il marche.
      de: |-
        Es scheint sich mit einem besonderen Rhythmus
        zu bewegen. Beim Laufen schwingt es die Hüften
        und sieht so aus, als würde es tanzen.
      es: |-
        Parece moverse como si estuviera bailando un
        ritmo de su propia invención. Mueve mucho las
        caderas al andar.
      it: |-
        Si muove in modo leggiadro, come se
        danzasse seguendo un ritmo tutto suo.
        Cammina ancheggiando.
    lets-go-eevee:
      ja-Hrkt: |-
        どくとくの　リズムを　もつらしく
