    sword:
      ja-Hrkt: |-
        ガラルの　とある　ちいきでは
        こおりの　じょおうと　よんで
        ルージュラを　おそれあがめていた。
      ja: |-
        ガラルの　とある　地域では
        氷の　女王と　呼んで
        ルージュラを　恐れ崇めていた。
      ko: |-
        가라르의 어느 지역에서는
        얼음의 여왕이라고 부르며
        루주라를 두려워하며 받들었다.
      zh-Hant: |-
        在伽勒爾的某個地區，
        人們稱迷唇姐為冰之女王，
        並且敬畏崇拜牠。
      zh-Hans: |-
        在伽勒尔的某些地方，
        迷唇姐被称作冰之女王，
        受到人们的畏惧与崇拜。
      en: |-
        In certain parts of Galar, Jynx was once feared
        and worshiped as the Queen of Ice.
      fr: |-
        Dans une certaine zone de Galar, Lippoutou
        était craint et vénéré par la population qui l’avait
        surnommé la « reine des glaces ».
      de: |-
        In einer bestimmten Gegend von Galar wurde
        Rossana einst als „Königin des Eises“
        gleichermaßen gefürchtet wie verehrt.
      es: |-
        En cierta parte de Galar se conocía a Jynx como
        la Reina del Hielo y se reverenciaba con cierto
        temor.
      it: |-
        In una certa zona di Galar, Jynx era temuto
        e venerato dagli abitanti, che lo chiamavano
        “Regina dei ghiacci”.
    shield:
      ja-Hrkt: |-
        ガラルの　ルージュラは　うつくしく
        せんさいな　なきごえを　もつものが
        おおく　ファンも　いるほど。
      ja: |-
        ガラルの　ルージュラは　美しく
        繊細な　鳴き声を　持つものが　多く
        ファンも　いるほど。
      ko: |-
        가라르에는 아름답고 섬세한
        울음소리를 가진 루주라가
        많아서 팬도 있을 정도다.
      zh-Hant: |-
        許多伽勒爾的迷唇姐擁有
        美麗又纖細的聲音，甚至
        有一批對牠們著迷的粉絲。
      zh-Hans: |-
        伽勒尔的迷唇姐外表靓丽，
        拥有纤细叫声的也不在少数，
        甚至有为其着迷的粉丝。
      en: |-
        The Jynx of Galar often have beautiful and
        delicate voices. Some of these Pokémon have
        even gathered a fan base.
      fr: |-
        Les Lippoutou vivant à Galar sont souvent dotés
        d’une belle voix cristalline, ce qui leur vaut
        d’attirer des fans.
      de: |-
        Viele Rossana in Galar verfügen über solch eine
        schöne und zarte Stimme, dass sie sogar eine
        Fangemeinde haben.
      es: |-
        Los ejemplares que habitan en Galar poseen
        una voz tan delicada y hermosa que incluso
        cuentan con su propio grupo de admiradores.
      it: |-
        La maggior parte dei Jynx di Galar hanno
        una voce talmente incantevole e delicata
        da avere addirittura dei fan.
