        and lies in wait at the bottom
        for prey to come tumbling down.
    x:
      ja-Hrkt: |-
        かんそうした　さばくに　せいそく。
        すりばちじょうの　すあなの　なかで
        えものを　じっと　まち　つづける。
      ja: |-
        乾燥した　砂漠に　生息。
        すり鉢状の　巣穴の　中で
        獲物を　じっと　待ち続ける。
      ko: |-
        건조한 사막에 서식한다.
        원뿔형의 보금자리 속에서
        조용히 먹잇감을 계속 기다린다.
      en: |-
        It lives in arid deserts. It makes a sloping pit trap in
        sand where it patiently awaits prey.
      fr: |-
        Il vit dans les déserts arides. Pour attraper ses proies,
        il se place dans un trou et laisse sa gueule grande
        ouverte en attendant qu’elles tombent dedans.
      de: |-
        Es lebt in trockenen Wüstengebieten, wo es eine
        Trichterfalle baut und seelenruhig darauf wartet,
        dass Beute hinabrutscht.
      es: |-
        Habita desiertos áridos. Cava fosas profundas, en las
        que espera que caiga su presa.
      it: |-
        Vive nei deserti. Scava buche nel terreno e vi si
        apposta, attendendo che le prede vi caschino dentro.
    'y':
      ja-Hrkt: |-
        ぜったいに　だっしゅつ　ふかのうな
        すりばちじょうの　すあなを　つくって
        えものが　おちてくるのを　まつ。
      ja: |-
        絶対に　脱出　不可能な
        すりばち状の　巣穴を　つくって
        獲物が　落ちてくるのを　待つ。
      ko: |-
        절대 탈출 불가능한
        원뿔형의 둥지를 만들어
        먹이가 떨어지는 것을 기다린다.
      en: |-
        It makes an inescapable conical pit and lies in wait
        at the bottom for prey to come tumbling down.
      fr: |-
        Il creuse puis attend ses proies dans son antre, un
        trou conique dont il est impossible de s’échapper.
      de: |-
        Es baut sich ein trichterförmiges Loch, aus dem es
        kein Entrinnen gibt, und wartet, bis Beute hineinfällt.
      es: |-
        Excava fosas cóncavas de las cuales resulta imposible
        escapar y espera a que una presa caiga en su interior.
      it: |-
        Costruisce un nido a forma di imbuto dal quale non si
        può scappare, aspettando poi che le prede cadano in
        trappola.
    omega-ruby:
      ja-Hrkt: |-
        すりばちじょうの　すあなの　そこで　じっと
        えものが　おちて　くるのを　まちつづけている。
        おおきな　アゴは　いわをも　くだく　いりょく。
      ja: |-
        すり鉢状の　巣穴の　底で　じっと
        獲物が　落ちて　くるのを　待ち続けている。
        大きな　アゴは　岩をも　砕く　威力。
      ko: |-
        원뿔형의 보금자리 밑에서 가만히
        먹이가 빠지기를 계속 기다리고 있다.
        큰 턱의 위력은 바위도 부술 정도다.
      en: |-
        Trapinch’s nest is a sloped, bowl-like pit dug in sand.
        This Pokémon patiently waits for prey to tumble down the pit.
        Its giant jaws have enough strength to crush even boulders.
      fr: |-
        Le nid de Kraknoix consiste en un trou en pente creusé dans
        le sable, comme une cuvette. Ce Pokémon attend patiemment
        que sa proie tombe dedans. Ses gigantesques mâchoires sont
        assez puissantes pour croquer des rochers.
      de: |-
        Knacklions Bau ist eine Art in den Sand gegrabener Kessel.
        Dieses Pokémon wartet geduldig darauf, dass Beute in seinen
        Bau hineinfällt. Seine gigantischen Kiefer verfügen über
        genügend Kraft, um einen Felsen zu zerquetschen.
      es: |-
        El nido de Trapinch está situado bajo la arena, en una zona
        cóncava. Este Pokémon espera con paciencia a que su presa
        caiga en la misma. Con las fauces que tiene puede destruir
        hasta piedras.
      it: |-
        La tana di Trapinch è ricavata in una ripida fossa a forma
        di sacca scavata nella sabbia. Il Pokémon attende
        pazientemente che la preda cada in trappola.
        Le sue possenti mascelle frantumano anche la pietra.
    alpha-sapphire:
      ja-Hrkt: |-
        だっしゅつ　ふかのうな　あなを　さばくに　つくり
        えものが　くるのを　ひたすら　まちかまえている。
        みずが　なくても　１しゅうかんは　へっちゃら。
      ja: |-
        脱出　不可能な　穴を　砂漠に　つくり
        獲物が　くるのを　ひたすら　待ち構えている。
        水が　なくても　１週間は　へっちゃら。
      ko: |-
        탈출 불가능한 구멍을 사막에 만들어
        먹이가 오는 것을 한결같이 기다리고 있다.
        물이 없어도 1주일 동안 문제없다.
      en: |-
        Trapinch is a patient hunter. It digs an inescapable pit in a
        desert and waits for its prey to come tumbling down. This
        Pokémon can go a whole week without access to any water.
      fr: |-
        Kraknoix est un chasseur patient. Dans le désert, il creuse
        un trou dont on ne peut pas s’échapper et attend que sa proie
        tombe dedans. Ce Pokémon peut se passer d’eau une semaine
        entière.
      de: |-
        Knacklion ist ein geduldiger Jäger. Es gräbt in einer Wüste
        eine tiefe Grube und wartet auf Beute, die hineinfällt. Dieses
        Pokémon kommt eine ganze Woche ohne Wasser aus.
      es: |-
        Trapinch es un cazador paciente. Suele cavar una fosa
        profunda en el desierto y esperar a que su presa caiga en
        ella. Este Pokémon puede aguantar toda una semana sin
        beber nada de agua.
      it: |-
        Trapinch è un paziente cacciatore. Nel deserto scava fosse
        micidiali e attende che la preda cada in trappola. Questo
        Pokémon può vivere senz’acqua anche per una settimana.
    sun:
      ja-Hrkt: |-
        １しゅうかんは　なにも　くわずに
        いきられる。　すあなの　そこで
        えものが　くるのを　じっと　まつ。
      ja: |-
        １週間は　なにも　喰わずに
        生きられる。　巣穴の　底で
        獲物が　くるのを　じっと　待つ。
      ko: |-
        1주일은 아무것도 먹지 않고
        살 수 있다. 보금자리의 속에서
        먹이가 오기만을 가만히 기다린다.
      zh-Hant: |-
        １整個星期什麼都不吃也能生存。
        總是動也不動地呆在巢穴底部
        等待獵物的到來。
      zh-Hans: |-
        一整个星期什么都不吃
        也能生存。一动不动地呆在
        巢穴底部等待猎物的到来。
      en: |-
        It can live for a week without eating a thing.
        It waits patiently at the bottom of its nest for
        prey to appear.
      fr: |-
        Il peut survivre une semaine entière sans se
        sustenter. Il attend patiemment au fond de
        son trou, guettant sa proie.
      de: |-
        Knacklion kann eine Woche überleben, ohne
        zu essen. Es wartet geduldig in seinem Bau
        darauf, dass seine Beute zu ihm kommt.
      es: |-
        Puede sobrevivir una semana entera sin comer.
        Se queda muy quieto en su fosa, esperando a
        que se acerquen sus presas.
      it: |-
        Può sopravvivere senza cibo nella sua tana
        anche per una settimana, mentre attende
        paziente che le prede cadano in trappola.
    moon:
      ja-Hrkt: |-
        おおきな　アゴで　じゃまな　いわを
        くだきながら　すなを　ほる。
        すあなの　かたちは　スリばちじょう。
      ja: |-
        大きな　顎で　邪魔な　岩を
        砕きながら　砂を　掘る。
        巣穴の　形は　スリ鉢状。
      ko: |-
        커다란 턱으로 방해되는 바위를
        부수며 모래를 판다.
        둥지 모양은 원뿔형.
      zh-Hant: |-
        一邊用大大的顎把礙事的
        岩石咬碎，一邊挖沙子。
        巢穴的形狀就像研磨缽一樣。
      zh-Hans: |-
        一边用大大的颚把挡道的
        岩石咬碎，一边挖沙子。
        巢穴的形状是捣蒜钵那样的。
      en: |-
        As it digs through the sand, its giant jaws
        crush any rocks that obstruct its path. It builds
        a funnel-shaped nest.
      fr: |-
        Il creuse des trous dans le sable et brise les
        rochers qui le gênent d’un coup de mâchoire.
        Ses terriers ressemblent à un entonnoir.
      de: |-
        Es gräbt im Sand und zerquetscht dabei mit
        seinem gigantischen Kiefer störende Felsen.
        Sein Bau hat die Form eines Trichters.
      es: |-
        Cava su nido de forma cóncava en la arena y, si
        aparece una roca que le molesta, la destroza
        con sus grandes mandíbulas.
      it: |-
        Scava una tana a forma di imbuto nella sabbia
        frantumando le rocce che lo ostacolano
        con le sue possenti mascelle.
    ultra-sun:
      ja-Hrkt: |-
        アゴは　いわも　くだくが　おもくて
        ひっくり　かえると　おきられない。
        メグロコは　そのすきを　ねらうのだ。　
      ja: |-
        アゴは　岩も　砕くが　重くて
        ひっくり　返ると　起きられない。
        メグロコは　その隙を　狙うのだ。
      ko: |-
        턱은 바위도 부수지만 무거워서
        뒤집히면 일어나지 못한다.
        깜눈크는 그 틈을 노린다.
      zh-Hant: |-
        重量十足的下顎足以粉碎岩石，
        一旦身子翻過去就爬不起來，
        黑眼鱷會趁這個空檔襲擊牠。
      zh-Hans: |-
        颚部连岩石也能弄碎，但很重，
        如果翻身了，就会爬不起来。
        黑眼鳄会趁这个空当袭击它。
      en: |-
        Its jaws are strong enough to crush rocks but
        so heavy that it can’t get up if it flips over.
        Sandile seize those moments as their chance.
      fr: |-
        Sa lourde mâchoire peut briser le roc, mais s’il
        tombe à la renverse, il ne peut plus se relever.
        Mascaïman en profite alors pour l’attaquer.
      de: |-
        Sein Kiefer kann sogar Felsen zermalmen, ist
        aber so schwer, dass es sich nicht aufrichten
        kann, wenn es hinfällt. Das nutzen Ganovil aus.
      es: |-
        Puede triturar rocas con su mandíbula, pero su
        peso le impide darse la vuelta si lo tumban. Los
        Sandile sacan provecho de este punto débil.
      it: |-
        Con le pesanti mascelle spacca anche le pietre.
        Tuttavia, se cade all’indietro non può rialzarsi
        e Sandile ne approfitta per attaccarlo.
    ultra-moon:
      ja-Hrkt: |-
        わなを　かねた　すを　つくり
        ひたすら　えものを　まちかまえる。
        よるになると　すなに　もぐり　ねる。
      ja: |-
        罠を　兼ねた　巣を　作り
        ひたすら　獲物を　待ちかまえる。
        夜になると　砂に　潜り　寝る。
      ko: |-
        함정을 겸하는 둥지를 만들고
        한결같이 먹이를 기다리고 있다.
        밤이 되면 모래 속에 숨어서 잔다.
      zh-Hant: |-
        會製造兼有陷阱功能的巢穴，
        不斷埋伏著等待獵物上門。
        到了夜晚就會潛進沙中睡覺。
      zh-Hans: |-
        制造兼有陷阱功能的巢穴，
        一心一意埋伏着等待猎物。
        到了晚上就潜回沙中睡觉。
      en: |-
        It builds nests that double as traps, lying in
        wait for its prey to get caught. When night falls,
        it digs itself a spot beneath the sand to sleep.
      fr: |-
        Pour attraper ses proies, il bâtit un nid piégé
        et attend patiemment. Lorsque la nuit tombe,
        il s’enfouit dans le sable pour dormir.
      de: |-
        Sein Bau dient gleichzeitig als Falle, in der es
        Beute auflauert. Nachts gräbt es sich zum
        Schlafen im Sand ein.
      es: |-
        Construye un nido, que también sirve de trampa,
        y espera pacientemente a su presa. Durante la
        noche duerme enterrado en la arena.
      it: |-
        Costruisce una tana che fa anche da trappola e
        attende pazientemente le prede. La notte dorme
        sotto la sabbia.
    sword:
      ja-Hrkt: |-
        さばくに　つくられた　すあなは
        すりばちの　かたちを　しているので
        おちてしまうと　だっしゅつふかのう。
      ja: |-
        砂漠に　つくられた　巣穴は
        すり鉢の　形を　しているので
        落ちてしまうと　脱出不可能。
      ko: |-
        사막에 만들어진 둥지는
        깔때기 모양이므로
        떨어지면 탈출할 수 없다.
      zh-Hant: |-
        牠在沙漠中建造的巢穴
        造型就像是研缽一樣。
        一旦掉進去就再也逃不出來了。
      zh-Hans: |-
        它在沙漠中建造的巢穴
        造型就像是研钵一样。
        一旦掉进去就再也逃不出来了。
      en: |-
        Its nest is a sloped, bowl-like pit in the desert.
        Once something has fallen in, there is no escape.
      fr: |-
        Il est impossible de s’échapper de son antre
        en forme de cône qu’il creuse dans le sable
        du désert.
      de: |-
        Der Bau, den es sich in der Wüste errichtet, ist
        trichterförmig. Fällt man einmal hinein, gibt es
        kein Entkommen.
      es: |-
        Si una presa cae en las fosas cóncavas de arena
        que cava en el desierto, no podrá salir de ellas.
      it: |-
        Se si cade in una delle tane a forma di imbuto
        che scava nel deserto, è impossibile sfuggirne.
    shield:
      ja-Hrkt: |-
        ぜったいに　だっしゅつ　ふかのうな
        すりばちじょうの　すあなを　つくって
        えものが　おちてくるのを　まつ。
      ja: |-
        絶対に　脱出　不可能な
        すり鉢状の　巣穴を　つくって
        獲物が　落ちてくるのを　待つ。
      ko: |-
        절대 탈출 불가능한
        원뿔형의 둥지를 만들어
        먹이가 떨어지는 것을 기다린다.
      zh-Hant: |-
        會建造絕對無法逃脫的
        缽狀巢穴，並在巢穴裡
        等著獵物自己掉進來。
      zh-Hans: |-
        建造了绝对无法逃脱的
        捣蒜钵状巢穴，并在巢穴里
        等着猎物自己掉进来。
      en: |-
        It makes an inescapable conical pit and lies in
        wait at the bottom for prey to come
        tumbling down.
      fr: |-
        Il creuse, puis attend ses proies dans son antre
        en forme de cône, dont il est impossible
        de s’échapper.
      de: |-
        Es errichtet einen trichterförmigen Bau, aus dem
        es kein Entrinnen gibt, und wartet, bis Beute
        hineinfällt.
      es: |-
        Excava fosas cóncavas, de las cuales resulta
        imposible escapar, y espera a que una presa
        caiga en su interior.
      it: |-
        Costruisce una tana a forma di imbuto dalla
        quale non si può scappare, aspettando poi
        che le prede cadano in trappola.
