    white-2:
      en: |-
        It carries food all day long.
        When someone is lost in the
        mountains, it shares that food.
    x:
      ja-Hrkt: |-
        しっぽで　エサを　つつんで　はこぶ。
        やまで　そうなんした　ひとに
        エサを　わけあたえる　しゅうせい。
      ja: |-
        尻尾で　エサを　包んで　運ぶ。
        山で　遭難した　人に
        エサを　分け与える　習性。
      ko: |-
        꼬리로 먹이를 싸서 운반한다.
        산에서 조난당한 사람에게
        먹이를 나눠주는 습성이 있다.
      en: |-
        It carries food rolled up in its tail. It has the habit of
        sharing food with people lost in mountains.
      fr: |-
        Il dépose sa nourriture dans sa queue enroulée.
        Il l’offre souvent aux gens égarés en montagne.
      de: |-
        Im eingerollten Schweif transportiert es Futter,
        das es mit denen teilt, die sich verlaufen haben.
      es: |-
        Transporta alimentos en su cola enrollada. Le gusta
        compartir su comida con los montañistas perdidos.
      it: |-
        Trascina il cibo avvolgendolo nella coda e ha
        l’abitudine di condividerlo con chi si perde fra
        le montagne.
    'y':
      ja-Hrkt: |-
        １にちじゅう　エサを　はこぶ。
        やまで　そうなんした　ひとがいると
        エサを　わけあたえ　たすけている。
      ja: |-
        １日中　エサを　運ぶ。
        山で　遭難した　人がいると
        エサを　分け与え　助けている。
      ko: |-
        온종일 먹이를 나른다.
        산에서 조난당한 사람이 있으면
        먹이를 나눠 도와주고 있다.
      en: |-
        It carries food all day long. When someone is lost
        in the mountains, it shares that food.
      fr: |-
        Il passe ses journées à transporter de la nourriture.
        Il l’offre souvent aux gens égarés en montagne.
      de: |-
        Es trägt den ganzen Tag Essen mit sich herum, das es
        mit Menschen teilt, die in den Bergen feststecken.
      es: |-
        Lleva siempre comida consigo. Si se encuentra con
        montañeros que vagan perdidos, la comparte.
      it: |-
        Porta sempre del cibo con sé e lo condivide volentieri
        con gli sfortunati che si sono persi in montagna.
    omega-ruby:
      ja-Hrkt: |-
        しっぽで　エサを　つつみ　もちはこぶ　ポケモン。
        デリバードに　エサを　わけてもらった　おかげで
        エベレストを　のぼりきれた　ぼうけんかが　いた。
      ja: |-
        尻尾で　エサを　包み　持ち運ぶ　ポケモン。
        デリバードに　エサを　分けてもらった　おかげで
        エベレストを　登り切れた　冒険家が　いた。
      ko: |-
        꼬리로 먹이를 둘러싸서 나르는 포켓몬이다.
        딜리버드가 나눠준 먹이 덕분에
        에베레스트 산을 등정한 모험가가 있었다.
      en: |-
        Delibird carries its food bundled up in its tail. There once was
        a famous explorer who managed to reach the peak of the
        world’s highest mountain, thanks to one of these Pokémon
        sharing its food.
      fr: |-
        Cadoizo transporte sa nourriture dans sa queue. Il y a
        longtemps, un célèbre explorateur réussit à atteindre
        le sommet de la plus haute montagne du monde grâce
        à un de ces Pokémon, qui partagea sa nourriture avec lui.
      de: |-
        Botogel sammelt seine Nahrung in seinem Schweif. Es gab
        einmal einen berühmten Entdecker, der es dank eines Botogels
        geschafft hat, einen der höchsten Berge der Welt zu besteigen.
        Es hatte seine Nahrung mit ihm geteilt.
      es: |-
        Delibird usa la cola a modo de saco para llevar su alimento.
        En una ocasión, un famoso escalador consiguió alcanzar la
        cima más alta del mundo gracias a que uno de estos Pokémon
        compartió sus alimentos con él.
      it: |-
        Delibird trasporta il cibo avvolgendolo nella coda. Si narra di
        un esploratore che riuscì a raggiungere la vetta del monte più
        alto del mondo grazie alla riserva di cibo di questo Pokémon.
    alpha-sapphire:
      ja-Hrkt: |-
        しっぽで　エサを　つつみ　もちはこぶ　ポケモン。
        デリバードに　エサを　わけてもらった　おかげで
        エベレストを　のぼりきれた　ぼうけんかが　いた。
      ja: |-
        尻尾で　エサを　包み　持ち運ぶ　ポケモン。
        デリバードに　エサを　分けてもらった　おかげで
        エベレストを　登り切れた　冒険家が　いた。
      ko: |-
        꼬리로 먹이를 둘러싸서 나르는 포켓몬이다.
        딜리버드가 나눠준 먹이 덕분에
        에베레스트 산을 등정한 모험가가 있었다.
      en: |-
        Delibird carries its food bundled up in its tail. There once was
        a famous explorer who managed to reach the peak of the
        world’s highest mountain, thanks to one of these Pokémon
        sharing its food.
      fr: |-
        Cadoizo transporte sa nourriture dans sa queue. Il y a
        longtemps, un célèbre explorateur réussit à atteindre
        le sommet de la plus haute montagne du monde grâce
        à un de ces Pokémon, qui partagea sa nourriture avec lui.
      de: |-
        Botogel sammelt seine Nahrung in seinem Schweif. Es gab
        einmal einen berühmten Entdecker, der es dank eines Botogels
        geschafft hat, einen der höchsten Berge der Welt zu besteigen.
        Es hat seine Nahrung mit ihm geteilt.
      es: |-
        Delibird usa la cola a modo de saco para llevar su alimento.
        En una ocasión, un famoso escalador consiguió alcanzar la
        cima más alta del mundo gracias a que uno de estos Pokémon
        compartió sus alimentos con él.
      it: |-
        Delibird trasporta il cibo avvolgendolo nella coda. Si narra di
        un esploratore che riuscì a raggiungere la vetta del monte più
        alto del mondo grazie alla riserva di cibo di questo Pokémon.
    sun:
      ja-Hrkt: |-
        ほんらい　さむい　とちを　このむが
        アローラの　デリバードは　あるていどの
        あつさでも　たえられる　ようだ。
      ja: |-
        本来　寒い　土地を　好むが
        アローラの　デリバードは　ある程度の
        暑さでも　耐えられる　ようだ。
      ko: |-
        원래 추운 토지를 좋아하지만
        알로라의 딜리버드는 어느 정도의
        더위도 견딜 수 있는 것 같다.
      zh-Hant: |-
        原本很喜歡寒冷的地方，
        但是阿羅拉的信使鳥好像
        也能忍耐一定程度的炎熱。
      zh-Hans: |-
        原本很喜欢寒冷的地方，
        但是阿罗拉的信使鸟好像
        即便是有点儿炎热也能忍耐。
      en: |-
        Although it naturally prefers colder locales,
        Delibird in Alola seem able to withstand the
        heat to a certain extent.
      fr: |-
        Il s’agit à l’origine d’un Pokémon venant du froid,
        mais les Cadoizo se sont acclimatés à la chaleur
        d’Alola.
      de: |-
        Sie bevorzugen eigentlich kühle Gegenden,
        aber die Botogel Alolas können bis zu einem
        gewissen Grad auch heißes Klima ertragen.
      es: |-
        Este Pokémon es originario de tierras frías,
        pero los Delibird de Alola se han adaptado
        sin problemas al entorno cálido de la región.
      it: |-
        I Delibird prediligono normalmente i climi freddi,
        ma quelli di Alola sembrano trovarsi a loro agio
        anche con temperature piuttosto calde.
    moon:
      ja-Hrkt: |-
        じぶんの　エサを　ひとや　ポケモンに
        わける　しゅうせいが　あるため
        いつも　エサを　さがしまわっている。
      ja: |-
        自分の　餌を　人や　ポケモンに
        分け与える　習性が　あるため
        いつも　餌を　探しまわっている。
      ko: |-
        자신의 먹이를 사람이나 포켓몬에게
        나눠주는 습성이 있어
        언제나 먹이를 찾아다니고 있다.
      zh-Hant: |-
        因為有跟人類及寶可夢
        分享自己食物的習性，
        所以一直都在到處尋找食物。
      zh-Hans: |-
        因为有跟人类及宝可梦
        分享自己食物的习性，
        所以一直都在到处寻找食物。
      en: |-
        It has a generous habit of sharing its food with
        people and Pokémon, so it’s always scrounging
        around for more food.
      fr: |-
        Ce Pokémon partage facilement son repas avec
        d’autres Pokémon et humains, ce qui l’oblige
        constamment à courir après la nourriture.
      de: |-
        Es hat die Angewohnheit, seine eigene Nahrung
        mit Menschen und Pokémon zu teilen, und ist
        deshalb stets unterwegs auf Futtersuche.
      es: |-
        Tiene la costumbre de compartir su comida con
        todo el mundo, ya sea humano o Pokémon, por lo
        que está constantemente en busca de alimento.
      it: |-
        È sempre alla ricerca di cibo, che ama
        condividere con esseri umani e Pokémon.
    ultra-sun:
      ja-Hrkt: |-
        そうなんした　ひとに　じぶんのエサを
        わけあたえる。　ざっしょく　なので
        むしポケモンを　わたされることも。
      ja: |-
        遭難した　人に　自分のエサを
        わけ与える。　雑食　なので
        むしポケモンを　渡されることも。
      ko: |-
        조난 당한 사람에게 자신의 먹이를
        나눠준다. 잡식이어서
        벌레포켓몬을 건네주기도 한다.
      zh-Hant: |-
        會把自己的食物分給遇難者。
        因為牠是雜食性的寶可夢，
        分到的食物有時會是蟲寶可夢。
      zh-Hans: |-
        会把自己的食物分给遇难者。
        因为它是杂食性的宝可梦，
        所以有时会把虫宝可梦分给对方。
      en: |-
        It shares its food with people who are stranded.
        Because Delibird is omnivorous, sometimes
        it gives those people bug Pokémon.
      fr: |-
        Il partage sa nourriture avec les personnes en
        difficulté mais, étant omnivore, il peut lui arriver
        de leur offrir des Pokémon Insecte.
      de: |-
        Es teilt sein Futter mit Menschen in Not. Da es
        ein Allesfresser ist, kann es passieren, dass sie
        auch mal Käfer-Pokémon bekommen.
      es: |-
        Si ve a alguien en apuros, comparte su alimento
        con él. Aunque, al ser omnívoro, podría ser que
        compartiera algún que otro Pokémon insecto.
      it: |-
        Se incontra qualcuno che si è perso, condivide
        il cibo che ha con sé. È onnivoro, perciò
        potrebbe offrire anche dei Pokémon Coleottero.
    ultra-moon:
      ja-Hrkt: |-
        シッポで　エサを　つつみこみ
        はこぶ。　１ばん　おおきな　シッポの
        デリバードが　むれの　ボスだぞ。
      ja: |-
        シッポで　エサを　包みこみ
        運ぶ。　１番　大きな　シッポの
        デリバードが　群れの　ボスだぞ。
      ko: |-
        꼬리로 먹이를 둘러싸서
        운반한다. 가장 큰 꼬리를 가진
        딜리버드가 무리의 보스다.
      zh-Hant: |-
        會用尾巴包住食物來搬運。
        尾巴最大的信使鳥
        就是群體裡的老大。
      zh-Hans: |-
        会用尾巴将食物裹起来运送。
        尾巴最大的信使鸟
        就是群体里的老大。
      en: |-
        It wraps food in its tail to carry it around.
        The Delibird with the biggest tail is the boss
        of the flock!
      fr: |-
        Il transporte toute sa nourriture dans sa queue.
        Le Cadoizo qui a la plus grande devient le chef
        de la volée.
      de: |-
        Dieses Pokémon sammelt seine Nahrung in
        seinem Schweif. Das Botogel mit dem größten
        Schweif ist der Anführer der Gruppe.
      es: |-
        Usa la cola para transportar su alimento. El
        ejemplar que posea la cola de mayor tamaño se
        convertirá en el líder de la bandada.
      it: |-
        Trasporta il cibo avvolgendolo nella coda.
        Il Delibird con la coda più grande diventa
        il capo di tutto lo stormo.
    sword:
      ja-Hrkt: |-
        １にち　ずっと　エサをはこんでる。
        そうなんした　ひとが　デリバードの
        エサで　たすかった　はなしもある。
      ja: |-
        １日　ずっと　エサを運んでいる。
        遭難した　人が　デリバードの
        エサで　助かった　話もある。
      ko: |-
        온종일 먹이를 운반한다.
        조난당한 사람이 딜리버드의
        먹이로 살아났다는 이야기도 있다.
      zh-Hant: |-
        一整天都在搬運食物。
        據說曾經有遇難的人因為
        信使鳥的食物而得救。
      zh-Hans: |-
        一整天都在搬运食物。
        据说曾有遇险的人因为
        信使鸟的食物而得救。
      en: |-
        It carries food all day long. There are tales about
        lost people who were saved by the food it had.
      fr: |-
        Il transporte de la nourriture toute la journée.
        Ses réserves de vivres auraient sauvé la vie
        de nombreuses personnes en péril.
      de: |-
        Es trägt immer Lebensmittel bei sich. Man sagt,
        dass viele Menschen in Not nur dank seiner
        Notration überlebt hätten.
      es: |-
        Transporta comida durante todo el día. Según
        dicen, muchos desaparecidos han sobrevivido
        gracias a ella.
      it: |-
        Trasporta cibo per tutto il giorno. Si racconta
        che diverse persone disperse o in difficoltà
        si siano salvate grazie al suo cibo.
    shield:
      ja-Hrkt: |-
        じぶんの　エサを　ひとや　ポケモンに
        わける　しゅうせいが　あるため
        いつも　エサを　さがしまわっている。
      ja: |-
        自分の　エサを　人や　ポケモンに
        わける　習性が　あるため
        いつも　エサを　探しまわっている。
      ko: |-
        자신의 먹이를 사람이나 포켓몬에게
        나눠주는 습성이 있어
        언제나 먹이를 찾아다닌다.
      zh-Hant: |-
        因為有跟人類及寶可夢
        分享自己食物的習性，
        所以一直都在到處尋找食物。
      zh-Hans: |-
        因为有跟人类及宝可梦
        分享自己食物的习性，
        所以一直都在到处寻找食物。
      en: |-
        It has a generous habit of sharing its food with
        people and Pokémon, so it’s always scrounging
        around for more food.
      fr: |-
        Ce Pokémon partage facilement son repas avec
        d’autres Pokémon et avec des humains, ce qui
        l’oblige à constamment courir après la nourriture.
      de: |-
        Es hat die Angewohnheit, seine eigene Nahrung
        mit Menschen und Pokémon zu teilen, und ist
        deshalb stets unterwegs auf Futtersuche.
      es: |-
        Tiene la costumbre de compartir su comida con
        todo el mundo, sea humano o Pokémon, por lo
        que está constantemente en busca de alimento.
      it: |-
        È sempre alla ricerca di cibo, che ama
        condividere con esseri umani e Pokémon.
