mienshao:
  base_happiness: 50
  capture_rate: 45
  color: purple
  egg_groups:
    - ground
    - humanshape
  evolution_chain: mienfoo
  evolves_from: mienfoo
  flavor_text:
    black:
      en: |-
        It wields the fur on its arms like a whip.
        Its arm attacks come with such rapidity
        that they cannot even be seen.
      fr: |-
        Il se sert des poils de ses pattes
        antérieures comme de fouets. Ses coups
        ultrarapides sont invisibles à l’œil nu.
    white:
      en: |-
        They use the long fur on their arms
        as a whip to strike their opponents.
      fr: |-
        Il combat à l’aide des longs poils
        de ses pattes antérieures. 
        Ils font aussi mal qu’un fouet.
    black-2:
      en: |-
        Using the long fur on its arms like whips,
        it launches into combo attacks that,
        once started, no one can stop.
    white-2:
      en: |-
        Using the long fur on its arms like whips,
        it launches into combo attacks that,
        once started, no one can stop.
    x:
      ja-Hrkt: |-
        うでの　たいもうを　ムチのように
        あつかう。りょううでの　こうげきは
        めにも　とまらぬ　はやさ。
      ja: |-
        腕の　体毛を　ムチのように
        あつかう。両腕の　攻撃は
        目にも　止まらぬ　速さ。
      ko: |-
        팔에 있는 털을 채찍처럼
        다룬다. 양팔로 펼치는 공격은
        눈에 보이지 않을 만큼 빠르다.
      en: |-
        It wields the fur on its arms like a whip. Its arm
        attacks come with such rapidity that they cannot
        even be seen.
      fr: |-
        Il se sert des poils de ses pattes antérieures comme
        de fouets. Ses coups ultrarapides sont invisibles à
        l’œil nu.
      de: |-
        Es benutzt das Fell an seinen Armen als Peitsche.
        Beide Arme bewegen sich dabei
        mit atemberaubender Geschwindigkeit.
      es: |-
        Usa el pelaje de sus brazos a manera de látigos.
        Sus ataques alcanzan velocidades de vértigo.
      it: |-
        Usa i peli degli arti come fruste. I suoi attacchi sono
        talmente rapidi da essere invisibili a occhio nudo.
    'y':
      ja-Hrkt: |-
        りょうての　たいもうを　ムチのように
        つかいこなし　れんぞくこうげきを
        はじめると　だれにも　とめられない。
      ja: |-
        両手の　体毛を　ムチのように
        使いこなし　連続攻撃を
        はじめると　だれにも　止められない。
      ko: |-
        양손의 털을 채찍처럼
        능숙하게 다뤄 연속 공격을
        시작하면 아무도 멈출 수 없다.
      en: |-
        Using the long fur on its arms like whips, it
        launches into combo attacks that, once started,
        no one can stop.
      fr: |-
        Il combat à l’aide des longs poils de ses pattes
        antérieures. Une fois lancé dans ses enchaînements,
        rien ne l’arrête.
      de: |-
        Niemand kann es aufhalten, wenn es eine Angriffsserie
        mit seinen peitschenartigen Armen startet.
      es: |-
        Usa el pelaje de sus brazos a modo de látigos para
        encadenar ataques que nadie puede parar una vez
        iniciados.
      it: |-
        Usa i peli degli arti anteriori a mo’ di frusta e se inizia
        un attacco a catena non c’è nessuno che lo possa
        fermare.
    omega-ruby:
      ja-Hrkt: |-
        うでの　たいもうを　ムチのように
        あつかう。りょううでの　こうげきは
        めにも　とまらぬ　はやさ。
      ja: |-
        腕の　体毛を　ムチのように
        あつかう。両腕の　攻撃は
        目にも　止まらぬ　速さ。
      ko: |-
        팔에 있는 털을 채찍처럼
        다룬다. 양팔로 펼치는 공격은
        눈에 보이지 않을 만큼 빠르다.
      en: |-
        It wields the fur on its arms like a whip. Its arm
        attacks come with such rapidity that they cannot
        even be seen.
      fr: |-
        Il se sert des poils de ses pattes antérieures comme de fouets.
        Ses coups ultrarapides sont invisibles à l’œil nu.
      de: |-
        Es benutzt das Fell an seinen Armen als Peitsche. Beide Arme
        bewegen sich dabei mit atemberaubender Geschwindigkeit.
      es: |-
        Usa el pelaje de sus brazos a manera de látigos. Sus ataques
        alcanzan velocidades de vértigo.
      it: |-
        Usa i peli degli arti come fruste. I suoi attacchi sono
        talmente rapidi da essere invisibili a occhio nudo.
    alpha-sapphire:
      ja-Hrkt: |-
        りょうての　たいもうを　ムチのように
        つかいこなし　れんぞくこうげきを
        はじめると　だれにも　とめられない。
      ja: |-
        両手の　体毛を　ムチのように
        使いこなし　連続攻撃を
        はじめると　だれにも　止められない。
      ko: |-
        양손의 털을 채찍처럼
        능숙하게 다뤄 연속 공격을
        시작하면 아무도 멈출 수 없다.
      en: |-
        Using the long fur on its arms like whips, it
        launches into combo attacks that, once started,
        no one can stop.
      fr: |-
        Il combat à l’aide des longs poils de ses pattes antérieures.
        Une fois lancé dans ses enchaînements, rien ne l’arrête.
      de: |-
        Niemand kann es aufhalten, wenn es eine Angriffsserie mit
        seinen peitschenartigen Armen startet.
      es: |-
        Usa el pelaje de sus brazos a modo de látigos para encadenar
        ataques que nadie puede parar una vez iniciados.
      it: |-
        Usa i peli degli arti anteriori a mo’ di frusta e se inizia un
        attacco a catena non c’è nessuno che lo possa fermare.
    ultra-sun:
      ja-Hrkt: |-
        れんぞく　こうげきで　あいてを
        あっとうする。　とどめの　いちげきは
        ゆっくり　ちからを　ためて　はなつ。
      ja: |-
        連続　攻撃で　相手を
        圧倒する。　とどめの　一撃は
        ゆっくり　力を　ためて　放つ。
      ko: |-
        연속 공격으로 상대를 압도한다.
        마무리는 느긋하게
        힘을 모아 일격을 가한다.
      zh-Hant: |-
        會用連續攻擊壓倒對手。
        致命的一擊會在
        緩慢蓄力之後施展出來。
      zh-Hans: |-
        会用连续攻击压倒对手。
        致命的一击会在缓慢蓄力后施展出来。
      en: |-
        It overwhelms its opponents with continuous
        attacks and then slowly stores up power
        before delivering the finishing blow.
      fr: |-
        Il accule son ennemi avec une rafale d’attaques
        fulgurantes, puis concentre son énergie pour
        lui donner le coup de grâce.
      de: |-
        Es überwältigt seine Gegner mit einer Serie aus
        Angriffen. Den finalen Stoß versetzt es ihnen
        erst, nachdem es seine Energie gebündelt hat.
      es: |-
        Ataca al rival con una rápida ráfaga de golpes,
        mientras reúne poco a poco la energía necesaria
        para asestar el golpe definitivo.
      it: |-
        Mette alle strette l’avversario con una raffica
        di colpi, poi si concentra per raccogliere le
        energie prima di sferrare il colpo finale.
    ultra-moon:
      ja-Hrkt: |-
        きみょうなこえで　ほえたら　キケン。
        めにもとまらぬ　キックや　チョップの
        れんぞくこうげきが　はじまるぞ。
      ja: |-
        奇妙な声で　吠えたら　危険。
        目にも止まらぬ　キックや　チョップの
        連続攻撃が　始まるぞ。
      ko: |-
        기묘한 소리로 짖는다면 위험하다.
        눈에 보이지도 않는 킥과 촙의
        연속 공격이 시작된다.
      zh-Hant: |-
        當牠用奇妙聲音發出叫喊時是很危險的，
        由快到無法看清的踢腿和手刀
        組成的連續攻擊將接踵而來。
      zh-Hans: |-
        用奇妙的声音叫唤的话，就危险了。
        它会展开飞快的踢和劈来连续攻击。
      en: |-
        When Mienshao lets out a bizarre wail, you’re in
        danger. A flurry of kicks and chops too fast to
        see is about to be unleashed!
      fr: |-
        Le cri lugubre de Shaofouine annonce qu’il est
        sur le point de déchaîner une pluie de coups
        si rapides qu’ils en sont invisibles.
      de: |-
        Gibt es einen sonderbaren Laut von sich, sollte
        man schnell in Deckung gehen, da eine rasante
        Angriffsserie aus Schlägen und Tritten folgt.
      es: |-
        Si emite extraños aullidos, hay que extremar la
        precaución: empezará a repartir un sinfín de
        patadas y puñetazos a una velocidad pasmosa.
      it: |-
        Se emette un verso bizzarro, è meglio stargli
        alla larga: potrebbe scatenare una pioggia di
        calci e pugni così rapidi da essere invisibili!
    sword:
      ja-Hrkt: |-
        しんの　きょうてきと　あうと
        みがるに　なるため　りょうての
        けを　かみちぎり　すててしまう。
      ja: |-
        真の　強敵と　会うと
        身軽に　なるため　両手の　毛を
        噛み千切り　捨ててしまう。
      ko: |-
        진정한 강적과 만나면
        몸을 가볍게 하기 위해
        양손의 털을 물어뜯어 버린다.
      zh-Hant: |-
        當牠遇上真正的強敵時，
        會將雙臂的毛咬斷丟棄，
        讓自己的身體更加輕盈。
      zh-Hans: |-
        遇到真正的强敌时，
        为了让身体更加灵便，
        会咬断自己双手的毛扔掉。
      en: |-
        When Mienshao comes across a truly challenging
        opponent, it will lighten itself by biting off the
        fur on its arms.
      fr: |-
        Lorsqu’il fait face à un adversaire vraiment
        redoutable, il coupe les poils de ses mains
        avec les dents pour améliorer son agilité.
      de: |-
        Begegnet es einem wahrhaft starken Gegner,
        beißt es das Fell an seinen Armen ab, um an
        Beweglichkeit zu gewinnen.
      es: |-
        Cuando se encuentra frente a un oponente de
        categoría, se arranca parte del pelaje de los
        brazos a mordiscos para ganar agilidad.
      it: |-
        Se incontra un nemico veramente forte,
        si strappa a morsi i peli degli arti per alleggerirsi
        e guadagnare in agilità.
    shield:
      ja-Hrkt: |-
        めにも　とまらぬ　スピードで
        くりだす　けりは　きょだいな
        いわも　こっぱみじんに　くだく。
      ja: |-
        目にも　止まらぬ　スピードで
        繰りだす　蹴りは　巨大な　岩も
        木っ端みじんに　砕く。
      ko: |-
        눈에 보이지 않을 정도의 스피드로
        구사하는 발차기는 거대한
        바위도 산산이 조각낸다.
      zh-Hant: |-
        快到無法看清的踢腿
        非常強烈，即使是
        巨大的岩石也能粉碎。
      zh-Hans: |-
        以迅雷不及掩耳的速度
        使出踢击，即使是巨大的
        岩石也能击得粉碎。
      en: |-
        Delivered at blinding speeds, kicks from this
        Pokémon can shatter massive boulders into
        tiny pieces.
      fr: |-
        Ses coups de pied ultrarapides et invisibles
        à l’œil nu peuvent réduire un énorme rocher
        en poussière.
      de: |-
        Seine mit atemberaubender Geschwindigkeit
        ausgeführten Tritte können selbst riesige Felsen
        in winzige Stücke zerschmettern.
      es: |-
        Sus veloces patadas, que escapan al ojo humano,
        son capaces de reducir a escombros incluso rocas
        de gran tamaño.
      it: |-
        I suoi calci, talmente veloci da risultare invisibili,
        sono in grado di sbriciolare anche massi enormi.
