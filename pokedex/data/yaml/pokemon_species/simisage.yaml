        tail. This Pokémon is wild tempered.
      fr: |-
        Il frappe ses ennemis avec sa queue couverte de
        pointes. Un Pokémon au caractère agressif.
      de: |-
        Wer sich mit diesem temperamentvollen Pokémon
        anlegt, bekommt seinen mit Dornen bestückten
        Schweif zu spüren.
      es: |-
        Ataca estampando las espinas de su cola en el
        enemigo. Es un Pokémon con mucho temperamento.
      it: |-
        Attacca il nemico colpendolo con la coda piena di
        aculei. Pokémon dal carattere impetuoso.
