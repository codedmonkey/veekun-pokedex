        トゲの　たくさん　ついた　しっぽを
        あいてに　たたきつけて　こうげき。
        きしょうの　はげしい　ポケモン。
      ja: |-
        トゲの　たくさん　ついた　尻尾を
        相手に　たたきつけて　攻撃。
        気性の　激しい　ポケモン。
      ko: |-
        가시가 잔뜩 박힌 꼬리를
