  evolution_chain: mankey
  evolves_from: mankey
  flavor_text:
    red:
      en: |-
        Always furious
        and tenacious to
        boot. It will notabandon chasing
        its quarry until
        it is caught.
    blue:
      en: |-
        Always furious
        and tenacious to
        boot. It will notabandon chasing
        its quarry until
        it is caught.
    yellow:
      en: |-
        It stops being
        angry only when
        nobody else isaround. To view
        this moment is
        very difficult.
    gold:
      en: |-
        If approached
        while asleep, it
        may awaken andangrily give chase
        in a groggy state
        of semi-sleep.
    silver:
      en: |-
        It becomes wildly
        furious if it even
