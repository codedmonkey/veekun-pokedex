    white-2:
      en: |-
        It grows angry if you see its eyes
        and gets angrier if you run. If you
        beat it, it gets even madder.
    x:
      ja-Hrkt: |-
        まわりに　だれも　いないときだけは
        おこるのを　やめている。しかし
        それをみるのは　むずかしい。
      ja: |-
        まわりに　だれも　いないときだけは
        怒るのを　やめている。しかし
        それを　見るのは　難しい。
      ko: |-
        주위에 아무도 없을 때만은
        화를 내지 않고 있다. 그러나
        그 모습을 보기가 어렵다.
      en: |-
        It stops being angry only when nobody else is
        around. To view this moment is very difficult.
      fr: |-
        Sa fureur prend fin quand il n’a plus personne à
        frapper. Il est difficile d’en être témoin.
      de: |-
        In ganz seltenen Fällen beruhigt sich dieses sehr
        jähzornige Pokémon und ist für einen Moment friedlich.
      es: |-
        Solo se calma cuando nadie está cerca. Llegar a ver
        ese momento es realmente difícil.
      it: |-
        Questo Pokémon è costantemente furioso e si
        calma solo nella solitudine più assoluta.
    'y':
      ja-Hrkt: |-
        いつも　もうれつに　おこっており
        にげても　にげても
        どこまでも　おいかけてくる。
      ja: |-
        いつも　猛烈に　怒っており
        逃げても　逃げても
        どこまでも　追いかけてくる。
      ko: |-
        항상 맹렬하게 화내고 있어
        도망치고 또 도망쳐도
        끝까지 쫓아온다.
      en: |-
        It is always outrageously furious. If it gives chase,
        it will tenaciously track the target no matter
        how far.
      fr: |-
        Ce Pokémon est constamment en rogne.
        Lorsqu’il traque une proie, il la pourchasse n’importe
        où, peu importe la distance.
      de: |-
        Es ist immer außerordentlich wütend. Nimmt es
        die Verfolgung auf, bleibt es dem Opfer hartnäckig
        auf den Fersen, egal wie weit oder wie lange.
      es: |-
        Siempre está tremendamente enfadado. Cuando se
        empeña en una presa, no hay distancia para él.
      it: |-
        Va facilmente su tutte le furie. Se insegue una preda,
        non si dà per vinto finché non l’ha catturata.
    omega-ruby:
      ja-Hrkt: |-
        はげしく　おこる　ことで　けっこうが　よくなり
        きんにくの　ちからを　つよくするのだ。
        ただし　あたまの　かいてんは　おそくなるぞ。
      ja: |-
        激しく　怒る　ことで　血行が　良くなり
        筋肉の　力を　強くするのだ。
        ただし　頭の　回転は　遅くなるぞ。
      ko: |-
        격렬하게 화를 내면 혈액순환이
        좋아져 근육의 힘을 강하게 만든다.
        단 머리 회전은 느려진다.
      en: |-
        When Primeape becomes furious, its blood circulation is
        boosted. In turn, its muscles are made even stronger.
        However, it also becomes much less intelligent at the
        same time.
      fr: |-
        Lorsque Colossinge devient furieux, sa circulation sanguine
        s’accélère. Du coup, ses muscles sont encore plus puissants.
        En revanche, il devient bien moins intelligent.
      de: |-
        Wenn Rasaff wütend ist, wird seine Blutzirkulation gesteigert
        und seine Muskeln werden noch stärker. Allerdings mindert
        das auch die Fähigkeit zum logischen Denken.
      es: |-
        Cuando Primeape se enfada, se le acelera el ritmo cardíaco
        y se le fortalecen los músculos. Con todo, pierde en
        inteligencia.
      it: |-
        Quando Primeape s’infuria, la circolazione sanguigna
        si fa intensa, irrobustendo i suoi muscoli. Allo stesso
        tempo, tuttavia, perde anche la sua lucidità e intelligenza.
    alpha-sapphire:
      ja-Hrkt: |-
        はげしく　おこる　ことで　けっこうが　よくなり
        きんにくの　ちからを　つよくするのだ。
        ただし　あたまの　かいてんは　おそくなるぞ。
      ja: |-
        激しく　怒る　ことで　血行が　良くなり
        筋肉の　力を　強くするのだ。
        ただし　頭の　回転は　遅くなるぞ。
      ko: |-
        격렬하게 화를 내면 혈액순환이
        좋아져 근육의 힘을 강하게 만든다.
        단 머리 회전은 느려진다.
      en: |-
        When Primeape becomes furious, its blood circulation
        is boosted. In turn, its muscles are made even stronger.
        However, it also becomes much less intelligent at the
        same time.
      fr: |-
        Lorsque Colossinge devient furieux, sa circulation sanguine
        s’accélère. Du coup, ses muscles sont encore plus puissants.
        En revanche, il devient bien moins intelligent.
      de: |-
        Wenn Rasaff wütend ist, wird seine Blutzirkulation gesteigert
        und seine Muskeln werden noch stärker. Allerdings sinkt dabei
        auch die Fähigkeit logischen Denkens.
      es: |-
        Cuando Primeape se enfada, se le acelera el ritmo cardíaco
        y se le fortalecen los músculos. Con todo, pierde en
        inteligencia.
      it: |-
        Quando Primeape s’infuria, la circolazione sanguigna
        si fa intensa, irrobustendo i suoi muscoli. Allo stesso
        tempo, tuttavia, perde anche la sua lucidità e intelligenza.
    sun:
      ja-Hrkt: |-
        あまりに　おこりすぎて　そのまま
        しんでしまうことが　あるほどだが
        そのしにがおは　とても　やすらか。
      ja: |-
        あまりに　怒りすぎて　そのまま
        死んでしまうことが　あるほどだが
        その死に顔は　とても　安らか。
      ko: |-
        너무 화를 내서 그대로
        사망하는 경우가 있을 정도지만
        죽은 후의 얼굴은 매우 평온하다.
      zh-Hant: |-
        因為太過生氣而就這樣死去，
        這樣的事也是有的。
        但死的時候表情很安詳。
      zh-Hans: |-
        因为太过生气以致于就这么死去，
        这种事也是有的。
        但死的时候表情很安详。
      en: |-
        It has been known to become so angry that
        it dies as a result. Its face looks peaceful in
        death, however.
      fr: |-
        Il arrive qu’il s’énerve tellement qu’il en meurt.
        Son visage, lorsqu’il meurt ainsi, est empreint
        d’une grande sérénité.
      de: |-
        Manchmal rastet es so aus, dass es auf der
        Stelle tot umfällt. Sein Gesichtsausdruck ist
        danach jedoch äußerst friedlich.
      es: |-
        Se han conocido casos de Primeape que se han
        enfadado tanto que han llegado a fallecer. Aun
        así, sus rostros expresaban sosiego.
      it: |-
        A volte si arrabbia così tanto da morirne,
        e allora finalmente il suo volto diventa sereno.
    moon:
      ja-Hrkt: |-
        あるけんきゅうしゃの　がくせつでは
        モンスターボールの　なかでも
        オコリザルは　おこっているらしい。
      ja: |-
        ある研究者の　学説では
        モンスターボールの　中でも
        オコリザルは　怒っているらしい。
      ko: |-
        어느 연구자의 학설에 의하면
        몬스터볼 안에서도
        성원숭은 화나 있다는 듯하다.
      zh-Hant: |-
        某位研究者的學說中提到，
        即使在精靈球裡，
        火爆猴好像也在發怒。
      zh-Hans: |-
        根据某位研究者的论文，
        即使在精灵球里，
        火暴猴好像也在发怒。
      en: |-
        Some researchers theorize that Primeape
        remains angry even when inside a Poké Ball.
      fr: |-
        D’après les recherches d’un certain scientifique,
        les Colossinge continuent de bouillonner de
        fureur même à l’intérieur d’une Poké Ball.
      de: |-
        Der Theorie eines Forschers zufolge schäumt
        Rasaff sogar im Inneren von Pokébällen weiter
        vor Wut.
      es: |-
        Según muestran los estudios de un investigador
        Pokémon, Primeape sigue enfadado incluso
        dentro de la Poké Ball.
      it: |-
        Secondo le teorie di un certo studioso,
        Primeape è arrabbiato anche quando
        si trova dentro la Poké Ball.
    ultra-sun:
      ja-Hrkt: |-
        おこらせた　あいてを　ゆるさず
        おいつづける。　たたきのめして
        うごかなくなっても　まだ　ゆるさない。
      ja: |-
        怒らせた　相手を　許さず
        追い続ける。　叩きのめして
        動かなくなっても　まだ　許さない。
      ko: |-
        화나게 한 상대를 용서하지 않고
        계속 쫓아다닌다. 때려눕혀
        움직일 수 없게 돼도 용서하지 않는다.
      zh-Hant: |-
        不會原諒激怒自己的對手，
        會不斷追擊，就算把對方揍到
        無法動彈也不會原諒對方。
      zh-Hans: |-
        它不会原谅激怒它的人或宝可梦，
        会持续地追击对方。就算把对方揍得
        无法动弹也依然不会原谅对方。
      en: |-
        It will never forgive opponents who have
        angered it. Even after it has beaten them down
        until they can’t move, it never ever forgives.
      fr: |-
        Il ne pardonne rien et poursuit sans relâche
        ceux qui l’ont courroucé. Même les assommer
        ne suffira pas à apaiser sa rancune.
      de: |-
        Wer es nervt, wird auf ewig verfolgt. Selbst
        nachdem es seinen Gegner zu Boden gebracht
        hat, kann es ihm noch nicht verzeihen.
      es: |-
        Si se enfada, perseguirá sin descanso al objeto
        de su enojo. Aun habiéndolo golpeado hasta la
        extenuación, seguirá guardándole rencor.
      it: |-
        Insegue chi lo fa arrabbiare senza dargli tregua
        e non lo perdona neanche dopo averlo ridotto
        all’immobilità a furia di percosse.
    ultra-moon:
      ja-Hrkt: |-
        ほかの　ポケモンよりも　のうないの
        けっかんが　じょうぶなので　おこり
        つづけても　げんきで　いられるのだ。
      ja: |-
        他の　ポケモンよりも　脳内の
        血管が　丈夫なので　怒り
        続けても　元気で　いられるのだ。
      ko: |-
        다른 포켓몬들보다도
        뇌의 혈관이 튼튼해서 계속
        화를 내도 건강을 유지한다.
      zh-Hant: |-
        和其他的寶可夢比起來，
        牠的腦血管特別結實，
        就算一直發怒也能活得好好的。
      zh-Hans: |-
        比起其他宝可梦，
        它的脑血管更加坚固，
        就算持续发怒也能精力充沛。
      en: |-
        The blood vessels in its brain are sturdier than
        those of other Pokémon, so it can stay healthy
        despite its constant raging.
      fr: |-
        Les vaisseaux sanguins de son cerveau étant
        plus résistants que ceux d’autres Pokémon,
        il peut rester en état de colère perpétuelle.
      de: |-
        Da es robustere Hirnblutgefäße als andere
        Pokémon hat, wirkt sich selbst kontinuierlicher
        Zorn nicht schädlich auf seine Gesundheit aus.
      es: |-
        Los vasos sanguíneos de su cerebro son más
        fuertes que los de otros Pokémon, por lo que
        puede vivir en cólera perpetua sin problemas.
      it: |-
        I vasi sanguigni del suo cervello sono più robusti
        di quelli degli altri Pokémon e sono in grado di
        resistere al suo stato di collera perpetua.
    lets-go-pikachu:
      ja-Hrkt: |-
        まわりに　だれも　いないときだけは
        おこるのを　やめている。しかし
        それをみるのは　むずかしい。
      ja: |-
        まわりに　誰も　いないときだけは
        怒るのを　やめている。しかし
        それを見るのは　難しい。
      ko: |-
        주위에 아무도 없을 때만은
        화를 내지 않고 있다. 그러나
        그 모습을 보기가 어렵다.
      zh-Hant: |-
        只有當誰都不在身邊的時候
        才會停止生氣。然而要看到牠
        不生氣的樣子是很困難的。
      zh-Hans: |-
        只有在谁都不在身边的
        时候才不生气，但几乎
        没有人目击过这种情况。
      en: |-
        It stops being angry only when nobody else
        is around. To view this moment is very difficult.
      fr: |-
        Sa fureur prend fin quand il n’a plus personne
        à frapper. Il est difficile d’en être témoin.
      de: |-
        Es hört lediglich dann auf zu toben, wenn
        niemand in der Nähe ist. Diesen Anblick zu
        Gesicht zu bekommen, ist daher nicht einfach.
      es: |-
        Solo se calma cuando no hay nadie cerca,
        por lo que llegar a ver ese momento resulta
        verdaderamente difícil.
      it: |-
        È molto difficile vedere questo Pokémon calmo,
        dato che la sua furia si placa solamente
        quando si trova nella solitudine più assoluta.
