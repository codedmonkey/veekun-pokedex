  flavor_text:
    red:
      en: |-
        While apparently
        doing nothing, it
        fires punches inlightning fast
        volleys that are
        impossible to see.
    blue:
      en: |-
        While apparently
        doing nothing, it
        fires punches inlightning fast
        volleys that are
        impossible to see.
    yellow:
      en: |-
        Punches in cork­
        screw fashion. It
        can punch its waythrough a concrete
        wall in the same
        way as a drill.
    gold:
      en: |-
        Its punches slice
        the air. However,
        it seems to need ashort break after
        fighting for three
        minutes.
    silver:
      en: |-
        Its punches slice
        the air. They are
