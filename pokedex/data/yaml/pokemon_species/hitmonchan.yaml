        s’essouffle au bout de 3 minutes.
    black-2:
      en: |-
        The arm-twisting punches it throws
        pulverize even concrete. It rests
        after three minutes of fighting.
    white-2:
      en: |-
        The arm-twisting punches it throws
        pulverize even concrete. It rests
        after three minutes of fighting.
    x:
      ja-Hrkt: |-
        うでを　ねじりながら　くりだす
        パンチは　コンクリートも　ふんさい。
        ３ぷん　たたかうと　ひとやすみする。
      ja: |-
        腕を　ねじりながら　繰り出す
        パンチは　コンクリートも　粉砕。
        ３分　戦うと　ひとやすみする。
      ko: |-
        팔을 비틀며 날리는 펀치는
        콘크리트도 부스러뜨린다.
        3분 싸우면 잠시 쉰다.
      en: |-
        The arm-twisting punches it throws pulverize even
        concrete. It rests after three minutes of fighting.
      fr: |-
        Même le béton cède sous ses poings dévastateurs.
        Au combat, il s’essouffle au bout de trois minutes.
      de: |-
        Die Schläge, die es austeilt, können Beton
        pulverisieren. Es muss sich im Kampf alle
        drei Minuten ausruhen.
      es: |-
        Los potentes golpes de sus brazos pueden pulverizar
        el hormigón. Descansa tras luchar tres minutos.
      it: |-
        Sferra pugni così potenti da polverizzare persino
        il cemento. Si riposa dopo 3 minuti di lotta.
    'y':
      ja-Hrkt: |-
        プロボクサーの　たましいが
        のりうつっている。パンチのスピードは
        しんかんせんよりも　はやい。
      ja: |-
        プロボクサーの　魂が
        乗り移っている。パンチの　スピードは
        新幹線よりも　速い。
      ko: |-
        프로 복서의 혼에 씌었다.
        펀치의 스피드는
        고속열차보다도 빠르다.
      en: |-
        The spirit of a pro boxer has infused this Pokémon.
        It throws punches that are faster than a bullet train.
      fr: |-
        Tygnon possède l’esprit combatif des plus grands
        champions de boxe. Ses coups de poing partent plus
        vite qu’un boulet de canon.
      de: |-
        Der Geist eines Profi-Boxers hat dieses Pokémon
        inspiriert. Seine Faustschläge sind schneller als
        ein Hochgeschwindigkeitszug.
      es: |-
        Dicen que tiene el alma de un boxeador profesional.
        Da puñetazos a la velocidad del rayo.
      it: |-
        Questo Pokémon ha lo spirito di un pugile
        professionista. I suoi pugni sono più rapidi di un
        treno superveloce.
    omega-ruby:
      ja-Hrkt: |-
        せかいチャンピオンを　めざしていた　ボクサーの
        たましいが　やどったと　いわれる　エビワラーは
        ふくつの　せいしんで　ぜったいに　へこたれない。
      ja: |-
        世界チャンピオンを　目指していた　ボクサーの
        魂が　宿ったと　いわれる　エビワラーは
        不屈の　精神で　絶対に　へこたれない。
      ko: |-
        세계 챔피언을 목표했던 복서의
        혼이 깃들었다고 하는 홍수몬은
        불굴의 정신으로 절대 지쳐 쓰러지지 않는다.
      en: |-
        Hitmonchan is said to possess the spirit of a boxer who had
        been working toward a world championship. This Pokémon has
        an indomitable spirit and will never give up in the face
        of adversity.
      fr: |-
        On raconte que Tygnon dispose de l’état d’esprit d’un boxeur
        qui s’entraîne pour le championnat du monde. Ce Pokémon
        est doté d’une ténacité à toute épreuve et n’abandonne
        jamais face à l’adversité.
      de: |-
        Nockchan besitzt das Herz eines Boxers, der sich auf eine
        Weltmeisterschaft vorbereitet. Dieses Pokémon hat einen
        unbeugsamen Willen und gibt niemals auf.
      es: |-
        Dicen que Hitmonchan tiene el mismo ímpetu que un boxeador
        entrenándose para un campeonato mundial. Este Pokémon
        tiene un espíritu indomable que nunca se doblega ante la
        adversidad.
      it: |-
        Si dice che Hitmonchan abbia l’animo di un pugile destinato
        a partecipare al campionato mondiale. Questo Pokémon
        ha uno spirito indomito e non demorde mai di fronte
        alle avversità.
    alpha-sapphire:
      ja-Hrkt: |-
        せかいチャンピオンを　めざしていた　ボクサーの
        たましいが　やどったと　いわれる　エビワラーは
        ふくつの　せいしんで　ぜったいに　へこたれない。
      ja: |-
        世界チャンピオンを　目指していた　ボクサーの
        魂が　宿ったと　いわれる　エビワラーは
        不屈の　精神で　絶対に　へこたれない。
      ko: |-
        세계 챔피언을 목표했던 복서의
        혼이 깃들었다고 하는 홍수몬은
        불굴의 정신으로 절대 지쳐 쓰러지지 않는다.
      en: |-
        Hitmonchan is said to possess the spirit of a boxer who had
        been working toward a world championship. This Pokémon
        has an indomitable spirit and will never give up in the face
        of adversity.
      fr: |-
        On raconte que Tygnon dispose de l’état d’esprit d’un boxeur
        qui s’entraîne pour le championnat du monde. Ce Pokémon
        est doté d’une ténacité à toute épreuve et n’abandonne
        jamais face à l’adversité.
      de: |-
        Nockchan besitzt das Herz eines Boxers, der sich auf eine
        Weltmeisterschaft vorbereitet. Dieses Pokémon hat einen
        unbeugsamen Willen und gibt niemals auf.
      es: |-
        Dicen que Hitmonchan tiene el mismo ímpetu que un boxeador
        entrenándose para un campeonato mundial. Este Pokémon
        tiene un espíritu indomable que nunca se doblega ante la
        adversidad.
      it: |-
        Si dice che Hitmonchan abbia l’animo di un pugile destinato
        a partecipare al campionato mondiale. Questo Pokémon
        ha uno spirito indomito e non demorde mai di fronte
        alle avversità.
    lets-go-pikachu:
      ja-Hrkt: |-
        ねじりこむような　パンチこうげき！
        コンクリートのかべが　ドリルじょうに
        けずられて　やがて　あなが　あく。
      ja: |-
        ねじり込むような　パンチ攻撃！
        コンクリートの壁が　ドリル状に
        削られて　やがて　穴が　あく。
      ko: |-
        비틀면서 뚫는 듯한 펀치 공격!
        콘크리트 벽이 드릴 모양으로
        깎여나가 구멍이 뚫린다.
      zh-Hant: |-
        牠的拳擊就像是鑽頭！
        在牠的攻擊之下，即使是
        水泥牆也會被鑽出洞來。
      zh-Hans: |-
        它的拳击好似钻头一般！
        在它的攻击之下，哪怕是
        水泥墙也会被钻出洞来。
      en: |-
        Punches in corkscrew fashion. It can punch
        its way through a concrete wall like a drill.
      fr: |-
        Ses coups de poing rotatifs sont si puissants
        qu’ils peuvent percer le béton comme
        une foreuse.
      de: |-
        Mit seinen rotierenden Hieben vermag es, sich
        wie eine Bohrmaschine Stück für Stück durch
        Betonwände zu bohren.
      es: |-
        Sus puñetazos, semejantes a una taladradora,
        pueden perforar un muro de hormigón como si
        nada.
      it: |-
        Attacca facendo ruotare i pugni come un
        trapano. Grazie ad essi, è in grado di perforare
        persino un muro di cemento.
    lets-go-eevee:
      ja-Hrkt: |-
        ねじりこむような　パンチこうげき！
        コンクリートのかべが　ドリルじょうに
        けずられて　やがて　あなが　あく。
      ja: |-
        ねじり込むような　パンチ攻撃！
        コンクリートの壁が　ドリル状に
        削られて　やがて　穴が　あく。
      ko: |-
