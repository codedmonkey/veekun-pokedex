      zh-Hant: |-
        牠的拳擊就像是鑽頭！
        在牠的攻擊之下，即使是
        水泥牆也會被鑽出洞來。
      zh-Hans: |-
        它的拳击好似钻头一般！
        在它的攻击之下，哪怕是
        水泥墙也会被钻出洞来。
      en: |-
        Punches in corkscrew fashion. It can punch
        its way through a concrete wall like a drill.
      fr: |-
        Ses coups de poing rotatifs sont si puissants
        qu’ils peuvent percer le béton comme
        une foreuse.
      de: |-
        Mit seinen rotierenden Hieben vermag es, sich
        wie eine Bohrmaschine Stück für Stück durch
        Betonwände zu bohren.
      es: |-
        Sus puñetazos, semejantes a una taladradora,
        pueden perforar un muro de hormigón como si
        nada.
      it: |-
        Attacca facendo ruotare i pugni come un
        trapano. Grazie ad essi, è in grado di perforare
        persino un muro di cemento.
    sword:
      ja-Hrkt: |-
        くうきを　きりさく　パンチ。
        かすっただけで　やけどに　なるほど
        パンチの　スピードは　はやいのだ。
      ja: |-
        空気を　切り裂く　パンチ。
        かすっただけで　火傷に　なるほど
        パンチの　スピードは　速いのだ。
      ko: |-
        주변의 공기를 가르는 펀치.
        스치기만 해도 화상을 입을 정도로
        펀치 스피드가 매우 빠르다.
      zh-Hant: |-
        使出的拳擊能劈開空氣。
        出拳的速度極為迅速，
        即便只是擦過都會造成灼傷。
      zh-Hans: |-
        使出的拳击能劈开空气。
        出拳的速度极为迅速，
        即使只是擦过都会造成灼伤。
      en: |-
        Its punches slice the air. They are launched at
        such high speed, even a slight graze could cause
        a burn.
      fr: |-
        Ses poings fendent l’air. Ils sont si rapides
        qu’un simple frôlement peut causer une brûlure.
      de: |-
        Seine Fäuste zerschneiden regelrecht die Luft.
        Sie sind so schnell, dass selbst die geringste
        Berührung Verbrennungen verursacht.
      es: |-
        Sus puñetazos cortan el aire. Son tan veloces que
        el mínimo roce podría causar una quemadura.
      it: |-
        I suoi pugni fendono l’aria a una tale velocità
        che basta venire sfiorati per riportare
        una scottatura.
    shield:
      ja-Hrkt: |-
        くうきをも　きりさく　パンチ。
        だが　３ぷんかん　こうげきすると
        ひとやすみ　したくなるらしい。
      ja: |-
        空気をも　切り裂く　パンチ。
        だが　３分間　攻撃すると
        ひと休み　したくなるらしい。
      ko: |-
        공기마저 베어 가르는 펀치.
        하지만 3분간 공격하면
        잠시 쉬고 싶어하는 것 같다.
      zh-Hant: |-
        打出的拳擊甚至能劈開空氣。
        但連續攻擊３分鐘後，
        牠似乎就會想休息一下。
      zh-Hans: |-
        打出的拳击甚至能劈开空气。
        但攻击３分钟后，
        它似乎就会想休息一下。
      en: |-
        Its punches slice the air. However, it seems to
        need a short break after fighting for three minutes.
      fr: |-
        Ses poings fendent l’air, mais il se fatigue au bout
        de trois minutes à enchaîner les coups.
      de: |-
        Seine Fäuste zerschneiden die Luft. Es muss
        jedoch alle drei Minuten eine kurze Pause
        einlegen.
      es: |-
        Sus puñetazos son capaces incluso de cortar el
        aire, aunque parece necesitar un descanso tras
        estar luchando durante 3 min.
      it: |-
        Fende l’aria con i suoi pugni. Tuttavia, dopo
        tre minuti di lotta deve riprendere fiato.
