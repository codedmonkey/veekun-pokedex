    black:
      en: |-
        It is formed by two Beldum joining
        together. Its steel body won’t be
        scratched if it collides with a jet.
      fr: |-
        Il est formé de deux Terhal
        soudés. Son corps de fer résiste à
        un choc avec un avion à réaction.
    white:
      en: |-
        It is formed by two Beldum joining
        together. Its steel body won’t be
        scratched if it collides with a jet.
      fr: |-
        Il est formé de deux Terhal
        soudés. Son corps de fer résiste à
        un choc avec un avion à réaction.
    black-2:
      en: |-
        It is formed by two Beldum joining
        together. Its two brains are linked,
        amplifying its psychic power.
    white-2:
      en: |-
        It is formed by two Beldum joining
        together. Its two brains are linked,
        amplifying its psychic power.
    x:
      ja-Hrkt: |-
        ２ひきの　ダンバルが　がったいした。
        はがねの　ボディは　ジェットきと
        しょうとつしても　きずつかない。
      ja: |-
        ２匹の　ダンバルが　合体した。
        鋼の　ボディは　ジェット機と
        衝突しても　傷つかない。
      ko: |-
        2마리의 메탕이 합체했다.
        강철의 몸은 제트기와
        충돌해도 상처 입지 않는다.
      en: |-
        It is formed by two Beldum joining together.
        Its steel body won’t be scratched if it collides
        with a jet.
      fr: |-
        Il est formé de deux Terhal soudés. Son corps de fer
        résiste à un choc avec un avion à réaction.
      de: |-
        Das Pokémon besteht aus zwei Tanhel. Es bekommt
        selbst dann keinen Kratzer, wenn ein Jet es streift.
      es: |-
        Lo forman dos Beldum unidos. Puede chocarse con un
        avión sin que su cuerpo de acero sufra ni un rasguño.
      it: |-
        È sorto dalla fusione di due Beldum. Il suo corpo
        d’acciaio non viene scalfito neanche se urta un jet.
    'y':
      ja-Hrkt: |-
        ２ひきの　ダンバルが　がったいした。
        ２つの　のうみそが　れんけつしたので
        サイコパワーは　より　つよくなった。
      ja: |-
        ２匹の　ダンバルが　合体した。
        ２つの　脳みそが　連結したので
        サイコパワーは　より　強くなった。
      ko: |-
        2마리의 메탕이 합체했다.
        2개의 뇌가 연결되었기 때문에
        사이코 파워는 보다 강해졌다.
      en: |-
        It is formed by two Beldum joining together. Its two
        brains are linked, amplifying its psychic power.
      fr: |-
        Il est formé de deux Terhal soudés. Leurs deux
        cerveaux étant liés, ses pouvoirs psychiques sont
        très puissants.
      de: |-
        Es besteht aus zwei Tanhel. Dank der Vereinigung
        ihrer beiden Hirne verfügen sie über gesteigerte
        Psycho-Kräfte.
      es: |-
        Está formado por dos Beldum unidos. Tiene dos
        cerebros, así que cuenta con poderes psíquicos
        amplificados.
      it: |-
        È nato dalla fusione di due Beldum. L’unione di due
        cervelli rende ancora più forti i suoi poteri psichici.
    omega-ruby:
      ja-Hrkt: |-
        ２ひきの　ダンバルが　がったいした　すがた。
        ２つの　のうを　じりょくの　しんけいが　むすぶ
        ことで　つよい　サイコエネルギーを　うみだす。
      ja: |-
        ２匹の　ダンバルが　合体した　姿。
        ２つの　脳を　磁力の　神経が　結ぶ
        ことで　強い　サイコエネルギーを　生み出す。
      ko: |-
        두 마리의 메탕이 합체한 모습이다.
        두 개의 뇌를 자력 신경이 묶고 있어서
        강한 사이코 에너지를 만들어 낸다.
      en: |-
        When two Beldum fuse together, Metang is formed. The brains
        of the Beldum are joined by a magnetic nervous system.
        By linking its brains magnetically, this Pokémon generates
        strong psychokinetic power.
      fr: |-
        Lorsque deux Terhal fusionnent, un Métang apparaît.
        Les cerveaux des Terhal sont reliés par un système nerveux
        magnétique, ce qui permet à ce Pokémon de générer
        un puissant pouvoir télékinétique.
      de: |-
        Wenn zwei Tanhel miteinander verschmelzen, entsteht
        daraus Metang. Die Gehirne der Tanhel werden mit einem
        magnetischen Nervensystem verbunden. Dadurch erzeugt
        es starke psychokinetische Energie.
      es: |-
        Cuando dos Beldum se fusionan, forman un Metang. Los
        cerebros de los Beldum se unen mediante un sistema nervioso
        magnético y generan potente energía psicoquinética.
      it: |-
        Fondendo insieme due Beldum, si crea Metang. I cervelli
        dei Beldum sono uniti da un sistema nervoso magnetico.
        Questo particolare sistema di unione genera forti poteri
        psicocinetici.
    alpha-sapphire:
      ja-Hrkt: |-
        ２ひきの　ダンバルが　がったいしたとき　２つの
        のうが　じりょくの　しんけいで　むすばれる。
        うでを　うしろへ　まわし　こうそくで　いどう。
      ja: |-
        ２匹の　ダンバルが　合体したとき　２つの
        脳が　磁力の　神経で　結ばれる。
        腕を　後ろへ　まわし　高速で　移動。
      ko: |-
        두 마리의 메탕이 합체했을 때 두 개의
        뇌가 자력 신경에 의해 이어진다.
        팔을 뒤로 돌리고 고속으로 이동한다.
      en: |-
        When two Beldum fuse together, Metang is formed.
        The brains of the Beldum are joined by a magnetic
        nervous system. This Pokémon turns its arms to the
        rear for traveling at high speed.
      fr: |-
        Lorsque deux Terhal fusionnent, un Métang se forme.
        Les cerveaux des Terhal sont reliés par un système nerveux
        magnétique. Ce Pokémon dirige ses bras vers l’arrière
        pour voyager à grande vitesse.
      de: |-
        Wenn zwei Tanhel miteinander verschmelzen, entsteht
        daraus Metang. Die Gehirne der Tanhel werden mit einem
        magnetischen Nervensystem verbunden. Es schlägt seine
        Arme nach hinten, um sich schnell bewegen zu können.
      es: |-
        Cuando se funden dos Beldum, uniendo los cerebros por un
        sistema nervioso magnético, se forma un Metang. Para
        desplazarse a mayor velocidad, este Pokémon echa los brazos
        hacia atrás.
      it: |-
        Fondendosi, due Beldum formano Metang. I cervelli
        dei Beldum sono uniti da un sistema nervoso magnetico.
        Questo Pokémon ruota le zampe all’indietro per muoversi
        ad elevata velocità.
    sun:
      ja-Hrkt: |-
        ２ひきの　ダンバルが　れんけつし
        サイコパワーは　２ばいに。　ただし
        かしこさじたいは　かわっていない。
      ja: |-
        ２匹の　ダンバルが　連結し
        サイコパワーは　２倍に。　ただし
        賢さ自体は　変わっていない。
      ko: |-
        2마리의 메탕이 연결되어
        사이코 파워는 두 배가 된다. 단,
        영리함 자체는 변하지 않는다.
      zh-Hant: |-
        ２隻鐵啞鈴結合起來，
        精神力量也變為２倍。
        但是智商並沒有發生改變。
      zh-Hans: |-
        ２只铁哑铃组合起来，
        精神力量也变为２倍。
        但是智商并没有发生改变。
      en: |-
        When two Beldum link together, their psychic
        power is doubled. Their intelligence, however,
        remains unchanged.
      fr: |-
        Lorsque deux Terhal fusionnent, leurs pouvoirs
        psychiques sont doublés. En revanche, ils ne
        deviennent pas plus futés.
      de: |-
        Zwei Tanhel haben sich vereinigt und so ihre
        Psycho-Kräfte verdoppelt. Ihre Denkfähigkeit
        bleibt dabei aber unverändert.
      es: |-
        Al unirse dos Beldum, sus poderes psíquicos se
        duplican. No obstante, su inteligencia no se ve
        afectada.
      it: |-
        Quando due Beldum si fondono per formare un
        Metang, i loro poteri psichici raddoppiano, ma
        l’intelligenza rimane la stessa.
    moon:
      ja-Hrkt: |-
        じりょくを　はなつ　こうぶつが
        こうぶつ。　じそく　１００キロで
        ノズパスを　おいつめるぞ。
      ja: |-
        磁力を　放つ　鉱物が
        好物。　時速　１００キロで
        ノズパスを　追いつめるぞ。
      ko: |-
        자력을 발산하는 광물을
        좋아한다. 시속 100km로
        코코파스를 몰아넣는다.
      zh-Hant: |-
        非常喜歡能放出磁力的礦物。
        會以１００公里的時速窮追朝北鼻。
      zh-Hans: |-
        非常喜欢能放出磁力的矿物。
        会以１００公里的时速穷追朝北鼻。
      en: |-
        It adores magnetic minerals, so it pursues
        Nosepass at speeds exceeding 60 mph.
      fr: |-
        Il raffole des minéraux qui émettent des ondes
        magnétiques. Il peut s’élancer à la poursuite
        d’un Tarinor à 100 km/h.
      de: |-
        Es liebt Mineralien, die Magnetfelder erzeugen.
        Kein Wunder, dass es Nasgnet mit 100 km/h
        hinterherjagt.
      es: |-
        Le encanta comer minerales con propiedades
        magnéticas. Puede rastrear a un Nosepass
        desplazándose a más de 100 km/h.
      it: |-
        È ghiotto di minerali dotati di proprietà
        magnetiche. Quando dà la caccia ai Nosepass,
        può raggiungere i 100 km/h.
    ultra-sun:
      ja-Hrkt: |-
        ２つの　のうみそから　きょうりょくな
        サイコエネルギーを　ほうしゃし
        えものの　みうごきを　ふうじる。
      ja: |-
        ２つの　脳みそから　強力な
        サイコエネルギーを　放射し
        獲物の　身動きを　封じる。
      ko: |-
        2개의 뇌에서 강력한
        사이코 에너지를 방사하여
        먹이를 움직이지 못하게 한다.
      zh-Hant: |-
        會從２個大腦發射出
        強大的精神能量，
        藉此封鎖獵物的行動。
      zh-Hans: |-
        会从２个大脑里放射出
        强力的精神能量，
        封住猎物的行动。
      en: |-
        With its two brains, it fires powerful psychic
        energy to stop its prey in their tracks.
      fr: |-
        Grâce à ses deux cerveaux, il peut déchaîner
        une puissante force psychique qui lui permet
        d’immobiliser ses proies.
      de: |-
        Durch seine zwei Gehirne kann es sehr starke
        Psycho-Kräfte freisetzen, mit denen es seine
        Beute bewegungsunfähig macht.
      es: |-
        El poder psíquico combinado de ambos
        cerebros es tal que le permite paralizar a sus
        presas.
      it: |-
        Grazie alla fusione di due cervelli, è in grado di
        scatenare fortissimi poteri psichici che
        immobilizzano le prede.
    ultra-moon:
      ja-Hrkt: |-
        こうそくで　そらを　とびまわり
        えものを　みつけると　するどいツメで
        がっちり　つかんで　はなさないのだ。
      ja: |-
        高速で　空を　飛びまわり
        獲物を　見つけると　鋭いツメで
        がっちり　つかんで　離さないのだ。
      ko: |-
        고속으로 하늘을 날아다니다가
        먹이를 발견하면 날카로운 발톱으로
        꽉 잡고 놓지 않는다.
      zh-Hant: |-
        會以高速在空中四處飛行。
        當發現獵物時，會用銳利的爪子
        牢牢抓住獵物，絕不鬆開。
      zh-Hans: |-
        以高速在空中飞来飞去，
        如果发现猎物就会用锐利的爪子
        牢牢抓住，绝不松开。
      en: |-
        It flies at high speeds around the skies. When it
        finds its prey, Metang takes a firm grip with its
        sharp claws and never lets go.
      fr: |-
        Il parcourt le ciel à toute allure à la recherche
        d’une proie. Quand il en trouve une, il l’attrape
        avec ses griffes acérées et ne la lâche plus.
      de: |-
        Es fliegt schnell durch die Luft. Wenn es Beute
        entdeckt, packt es sie mit seinen scharfen
        Klauen und lässt sie nicht mehr los.
      es: |-
        Surca el cielo a gran velocidad. En cuanto avista
        su presa, la agarra con sus afiladas garras y ya
        no se desprende de ella.
      it: |-
        Vola a grande velocità. Una volta individuata
        la preda, la afferra saldamente con gli artigli
        affilati e non la lascia più andare.
    sword:
      ja-Hrkt: |-
        ２ひきの　ダンバルが　じりょくで
        くっついた。　２つの　のうみそにより
        サイコパワーは　２ばいに　きょうか。
      ja: |-
        ２匹の　ダンバルが　磁力で
        くっついた。　２つの　脳みそにより
        サイコパワーは　２倍に　強化。
      ko: |-
        2마리의 메탕이 자력으로
        합체했다. 2개의 두뇌로 인해
        사이코 파워가 2배로 강화되었다.
      zh-Hant: |-
        由２隻鐵啞鈴以磁力結合
        而成。因為有２個大腦，
        精神力量也強化成２倍了。
      zh-Hans: |-
        ２只铁哑铃因磁力结合
        起来了。因为有了２个大脑，
        精神力量也强化到了２倍。
      en: |-
        Two Beldum have become stuck together via
        their own magnetic forces. With two brains, the
        resulting Metang has doubled psychic powers.
      fr: |-
        Composé de deux Terhal réunis par l’attraction
        magnétique, ce Pokémon a vu sa puissance
        psychique doubler grâce aux deux cerveaux.
      de: |-
        Durch Magnetismus verschmolzen zwei Tanhel
        miteinander. Da es nun zwei Gehirne besitzt,
        haben sich seine Psycho-Kräfte verdoppelt.
      es: |-
        Está formado por la fusión magnética de dos
        Beldum. Al tener dos cerebros, sus poderes
        psíquicos se ven duplicados.
      it: |-
        Due Beldum si sono uniti tramite
        l’attrazione magnetica, raddoppiando
        i loro poteri psichici grazie ai due cervelli.
    shield:
      ja-Hrkt: |-
        じりょくで　そらを　とぶ。　けわしい
        さんがくを　ぬうように　こうそくで
        ひこうして　えものを　おいつめる。
      ja: |-
        磁力で　空を　飛ぶ。　険しい
        山岳を　縫うように　高速で
        飛行して　獲物を　追いつめる。
      ko: |-
        자력으로 하늘을 난다. 험준한
        산들을 누비듯이 고속으로
        비행하여 먹이를 쫓는다.
      zh-Hant: |-
        會以磁力在空中飛行。
        能在險峻的山岳中高速
        穿梭，將獵物逼入絕境。
      zh-Hans: |-
        依靠磁力飞行。能够在空中
        以高速穿过险峻的山岳，
        让追捕的猎物无处可逃。
      en: |-
        Using magnetic forces to stay aloft, this Pokémon
        flies at high speeds, weaving through harsh
        mountain terrain in pursuit of prey.
      fr: |-
        Ce Pokémon vole par magnétisme.
        Il poursuit ses proies en slalomant
        à toute allure entre les pics escarpés.
      de: |-
        Mithilfe von Magnetismus kann Metang fliegen.
        Auf der Jagd nach Beute manövriert es so mit
        hoher Geschwindigkeit durch schroffes Gebirge.
      es: |-
        Levita gracias al magnetismo. Es capaz de sortear
        escarpadas montañas mientras vuela a altas
        velocidades en pos de su presa.
      it: |-
        Levita sfruttando la forza magnetica. Si fa strada
        fra i picchi scoscesi volando a grande velocità
        mentre insegue le prede.
