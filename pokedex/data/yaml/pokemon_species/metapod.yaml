    sun:
      ja-Hrkt: |-
        カラのなかには　トロトロの　なかみが
        つまっている。　ほぼ　うごかないのは
        ウッカリ　なかみが　こぼれないため。
      ja: |-
        カラの中には　トロトロの　中身が
        詰まっている。　ほぼ動かないのは
        ウッカリ　中身が　こぼれないため。
      ko: |-
        껍질 안은 부드러운 내용물로 가득 차 있다.
        거의 움직이지 않는 것은 무심코
        내용물이 흘러나오게 하지 않기 위해서다.
      zh-Hant: |-
        殼中塞滿了軟綿綿的身體。
        幾乎動也不動是為了防止
        身體在不留神時露出來。
      zh-Hans: |-
        壳中藏着软乎乎的身体。
        几乎不动是为了防止
        身体一不留神就露出来。
      en: |-
        Its shell is filled with its soft innards. It doesn’t
        move much because of the risk it might
        carelessly spill its innards out.
      fr: |-
        Sous sa carapace, il est tout mou et tendre.
        Il bouge très peu afin de ne pas secouer son
        corps encore fragile.
      de: |-
        Sein harter Panzer birgt ein weiches Inneres.
        Um zu vermeiden, dass dieses versehentlich
        ausläuft, bewegt es sich kaum.
      es: |-
        La dura capa que le recubre el cuerpo protege
        sus delicadas vísceras. Metapod apenas se
        mueve para evitar que estas se desparramen.
      it: |-
        La corazza racchiude un corpo estremamente
        molle e il Pokémon si muove appena per paura
        che fuoriesca accidentalmente.
    moon:
      ja-Hrkt: |-
        かたいと　いっても　むしの　カラ。
        われてしまうことも　あるので
        はげしい　たたかいは　きんもつ。
      ja: |-
        硬いと　いっても　虫の　殻。
        割れてしまうことも　あるので
        激しい　戦いは　禁物。
      ko: |-
        단단하다고는 해도 벌레의 껍질.
        갈라질 수도 있으므로
        격렬한 싸움은 금물이다.
      zh-Hant: |-
        雖說堅硬，但還是蟲的外殼。
        有時還是會破裂的，
        所以禁止用於激烈的戰鬥。
      zh-Hans: |-
        虽说坚硬，但还是虫的外壳。
        因为有时也会破裂，
        所以禁止用于激烈的战斗。
      en: |-
        Its shell is hard, but it’s still just a bug shell.
        It’s been known to break, so intense battles
        with it should be avoided.
      fr: |-
        Même si sa carapace est solide, elle n’est guère
        composée que de chitine et peut se briser
        aisément. Mieux vaut éviter les combats rudes.
      de: |-
        Sein Panzer ist zwar hart, aber dennoch anfällig
        für Risse, da es ein Käfer-Pokémon ist.
        Für schwere Kämpfe ist es daher ungeeignet.
      es: |-
        Su coraza es muy dura, pero no deja de estar
        hecha de quitina, por lo que podría quebrarse.
        Es mejor no llevarlo en combates muy intensos.
      it: |-
        La sua corazza è piuttosto dura per un
        Pokémon Coleottero, ma potrebbe comunque
        rompersi. Meglio evitare lotte troppo veementi.
    ultra-sun:
      ja-Hrkt: |-
        カラのなかは　ドロドロの　えきたい。
        しんかに　そなえて　からだじゅうの
        さいぼうを　つくりなおしている。
      ja: |-
        カラの中は　ドロドロの　液体。
        進化に　備えて　体中の
        細胞を　作りなおしている。
      ko: |-
        껍질 안은 걸쭉한 액체다.
        진화를 대비하여 몸 전체의
        세포를 재구성하고 있다.
      zh-Hant: |-
        殼裡面是黏糊糊的液體。
        為了準備迎接進化，
        正不斷更新全身的細胞。
      zh-Hans: |-
        壳里面是黏糊糊的液体。
        为了准备迎接进化，
        正在不断地更新体内的细胞。
      en: |-
        Its shell is filled with a thick liquid. All of the
        cells throughout its body are being rebuilt in
        preparation for evolution.
      fr: |-
        Sa carapace contient un liquide gluant.
        Sa structure cellulaire est en cours de
        modification en vue de son évolution prochaine.
      de: |-
        Sein Panzer birgt ein dickflüssiges Inneres.
        In Vorbereitung auf seine Entwicklung wird seine
        Zellstruktur vollständig umgestaltet.
      es: |-
        El interior del caparazón es un líquido viscoso.
        Todas las células de su cuerpo se están
        regenerando en preparación para su evolución.
      it: |-
        La sua corazza contiene un liquido vischioso.
        Ristruttura tutte le cellule del suo corpo
        preparandosi all’evoluzione.
    ultra-moon:
      ja-Hrkt: |-
        とても　かたいカラは　ツツケラに
        つつかれても　びくともしないが
        ゆれて　なかみが　こぼれてしまう。
      ja: |-
        とても　硬いカラは　ツツケラに
        突かれても　びくともしないが
        揺れて　中身が　こぼれてしまう。
      ko: |-
        매우 단단한 껍질은 콕코구리가
        쪼아도 꿈쩍도 하지 않지만 흔들림에
        약해서 내용물이 흘러나와 버린다.
      zh-Hant: |-
        外殼非常堅硬，就算被
        小篤兒啄到也能平安無事，
        但殼裡的身體會因為晃動而流出來。
      zh-Hans: |-
        外壳非常坚硬，即使受到
        小笃儿的啄击也能安然无恙，
        但壳里的身体会因晃动而流出来。
      en: |-
        Its hard shell doesn’t crack a bit even if Pikipek
        pecks at it, but it will tip over, spilling out
        its insides.
      fr: |-
        Sa carapace est très solide et résiste sans
        peine aux assauts des Picassaut. Si elle bascule,
        par contre, son contenu s’éparpille au sol.
      de: |-
        Ein Schnabelangriff von Peppeck kann Safcons
        hartem Panzer nichts anhaben, doch wenn es
        zu schaukeln beginnt, läuft sein Inneres aus.
      es: |-
        Su dura coraza resiste los picotazos de un
        Pikipek, pero, si se agita mucho, su contenido
        puede verterse por el suelo.
      it: |-
        La sua dura corazza resiste anche alle beccate
        dei Pikipek ma, se oscilla troppo, il contenuto
        può fuoriuscire.
    lets-go-pikachu:
      ja-Hrkt: |-
        みをまもるため　ひたすら　カラを
        かたくしても　つよい　しょうげきを
        うけると　なかみが　でてしまう。
      ja: |-
        身を守るため　ひたすら　カラを
        硬くしても　強い　衝撃を
        受けると　中身が　出てしまう。
      ko: |-
        몸을 보호하기 위해 끊임없이
        껍질을 단단하게 하지만 강한 충격을
        받으면 내용물이 나와버린다.
      zh-Hant: |-
        靠著堅硬無比的外殼來保護自己。
        然而一旦遭受到強烈衝擊，
        殼裡的身體就會跑出來。
      zh-Hans: |-
        它会让外壳变硬来保护自己。
        然而在遇到强烈的冲击力时，
        它的身体还是会被撞出来。
      en: |-
        Hardens its shell to protect itself. However, a
        large impact may cause it to pop out of its shell.
      fr: |-
        Il renforce sa carapace pour se protéger,
        mais un coup puissant peut l’en déloger.
      de: |-
        Um sich zu schützen, härtet es eifrig seinen
        Panzer, doch wenn es heftige Treffer einsteckt,
        wird sein Inneres entblößt.
      es: |-
        Pese a su constante empeño por endurecer su
        coraza para protegerse, puede romperse si
        recibe un fuerte impacto y quedar expuesto.
      it: |-
        Per difendersi indurisce la corazza, ma un colpo
        violento può scaraventarlo fuori dal guscio.
    lets-go-eevee:
      ja-Hrkt: |-
        みをまもるため　ひたすら　カラを
        かたくしても　つよい　しょうげきを
        うけると　なかみが　でてしまう。
      ja: |-
