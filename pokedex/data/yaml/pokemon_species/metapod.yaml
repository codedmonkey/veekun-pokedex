    sword:
      ja-Hrkt: |-
        しんかを　まっている　じょうたい。
        かたくなる　ことしか　できないので
        おそわれないよう　じっとしている。
      ja: |-
        進化を　待っている　状態。
        硬くなる　ことしか　できないので
        襲われないよう　じっとしている。
      ko: |-
        진화를 기다리고 있는 상태다.
        단단해지는 것밖에 할 수 없어서
        공격받지 않도록 꿈쩍 않고 있다.
      zh-Hant: |-
        正處於等待進化的狀態。
        除了變硬之外什麼都做不了，
        只能動也不動以免遭受攻擊。
      zh-Hans: |-
        正处于等待进化的状态。
        除了变硬之外什么都做不了，
        只能动也不动以免引来袭击。
      en: |-
        It is waiting for the moment to evolve. At this
        stage, it can only harden, so it remains
        motionless to avoid attack.
      fr: |-
        En attendant sa prochaine évolution, il ne peut
        que durcir sa carapace et rester immobile
        pour éviter de se faire attaquer.
      de: |-
        In diesem Zustand wartet es auf die Entwicklung.
        Es kann nur seinen Panzer erhärten, daher bewegt
        es sich nicht, um nicht angegriffen zu werden.
      es: |-
        Como en este estado solo puede endurecer
        su coraza, permanece inmóvil a la espera de
        evolucionar.
      it: |-
        In attesa di evolversi, l’unica cosa che può fare
        è indurire la sua corazza, quindi rimane immobile
        per evitare di essere attaccato.
    shield:
      ja-Hrkt: |-
        かたい　カラに　つつまれているが
        なかみは　やわらかいので
        つよい　こうげきには　たえられない。
      ja: |-
        硬い　殻に　包まれているが
        中身は　軟らかいので
        強い　攻撃には　耐えられない。
      ko: |-
        단단한 껍질로 둘러싸여 있지만
        안은 부드럽기 때문에
        강한 공격에는 버티지 못한다.
      zh-Hant: |-
        雖然有堅硬的外殼，
        但因為殼裡的身體很軟，
        所以無法抵抗強力的攻擊。
      zh-Hans: |-
        虽然有坚硬的外壳，
        因为壳里的身体很软，
        所以无法抵抗强力的攻击。
      en: |-
        Even though it is encased in a sturdy shell,
        the body inside is tender. It can’t withstand a
        harsh attack.
      fr: |-
        Bien que son corps soit entouré d’une carapace
        solide, l’intérieur est si mou qu’il ne résisterait
        pas à une attaque violente.
      de: |-
        In seiner harten Schale ist ein weicher Körper.
        Einem brutalen Angriff hat es nichts
