        are its biggest weapons.
      fr: |-
        C’est le rival de Séviper depuis
        des générations. Ses griffes
        aiguisées sont son meilleur atout.
    black-2:
      en: |-
        It’s Seviper’s archrival. To threaten
        those it encounters, it fans out
        the claws on its front paws.
    white-2:
      en: |-
        It’s Seviper’s archrival. To threaten
        those it encounters, it fans out
        the claws on its front paws.
    x:
      ja-Hrkt: |-
        なんせだいにも　わたって
        ハブネークと　たたかってきた。
        するどい　ツメが　さいだいの　ぶき。
      ja: |-
        何世代にも　渡って
        ハブネークと　戦ってきた。
        鋭い　ツメが　最大の　武器。
      ko: |-
        몇 대에 걸쳐서
        세비퍼와 싸워왔다.
        날카로운 발톱이 최대의 무기다.
      en: |-
        It has feuded with Seviper for many generations.
        Its sharp claws are its biggest weapons.
      fr: |-
        C’est le rival de Séviper depuis des générations.
        Ses griffes aiguisées sont son meilleur atout.
      de: |-
        Seit Generationen ist es mit Vipitis verfeindet.
        Seine scharfen Klauen sind seine stärksten Waffen.
      es: |-
        Hace muchos años que se enfrenta a Seviper. Su arma
        más eficaz son sus zarpas afiladas.
      it: |-
        Da generazioni, è acerrimo nemico di Seviper. Gli
        artigli aguzzi sono le sue armi più potenti.
    'y':
      ja-Hrkt: |-
        ハブネークの　においを　かぐ　だけで
        ぜんしんの　たいもうが　さかだつ。
        するどい　ツメが　てきを　きりさく。
      ja: |-
        ハブネークの　においを　かぐ　だけで
        全身の　体毛が　逆立つ。
        鋭い　ツメが　敵を　切り裂く。
      ko: |-
        세비퍼의 냄새를 맡는 것만으로도
        전신의 털이 곤두선다.
        예리한 손톱으로 적을 베어 가른다.
      en: |-
        Its fur would all stand on end if it smelled a Seviper
        nearby. Its sharp claws tear up its foes.
      fr: |-
        Son poil se hérisse dès qu’il sent un Séviper.
        Il lacère ses ennemis avec ses griffes acérées.
      de: |-
        Vipitis’ Geruch lässt ihm alle Haare zu Berge stehen.
        Mit seinen scharfen Klauen kratzt es seine Feinde.
      es: |-
        Se le eriza todo el pelaje con solo oler un Seviper.
        Con sus afiladas zarpas puede rajar a sus enemigos.
      it: |-
        Se sente anche solo l’odore di Seviper, gli si rizza
        la pelliccia. Lacera il nemico con artigli affilati.
    omega-ruby:
      ja-Hrkt: |-
        しゅくてき　ハブネークとの　たたかいの　きおくが
        からだじゅうの　さいぼうに　きざみこまれている。
        びんしょうな　みのこなしで　こうげきを　かわす。
      ja: |-
        宿敵　ハブネークとの　戦いの　記憶が
        体中の　細胞に　刻み込まれている。
        敏しょうな　身のこなしで　攻撃を　かわす。
      ko: |-
        숙적 세비퍼와 대결했던 기억이
        전신의 세포에 새겨져 있다.
        민첩한 몸동작으로 공격을 피한다.
      en: |-
        Memories of battling its archrival Seviper are etched into every
        cell of Zangoose’s body. This Pokémon adroitly dodges
        attacks with incredible agility.
      fr: |-
        Chaque cellule du corps de Mangriff porte les stigmates
        de sa rivalité avec Séviper. Ce Pokémon est capable
        d’esquiver les attaques avec une agilité incroyable.
      de: |-
        Die Erinnerungen an den Kampf mit seinem Erzrivalen Vipitis
        haben sich in jede Zelle von Sengos Körper eingebrannt.
        Dieses Pokémon weicht feindlichen Angriffen unheimlich
        raffiniert und geschickt aus.
      es: |-
        Los ecos del combate mantenido con su rival más feroz,
        Seviper, resuenan aún en cada célula de Zangoose. Este
        Pokémon esquiva los ataques con auténtica destreza.
      it: |-
        I ricordi delle lotte contro il suo acerrimo nemico Seviper sono
        insiti in ogni cellula del corpo di Zangoose. Questo Pokémon
        riesce a schivare gli attacchi con incredibile maestria.
    alpha-sapphire:
      ja-Hrkt: |-
        ふだんは　４ほんあしで　こうどうするが　おこると
        うしろあしで　たち　まえあしの　ツメが　とびだす。
        ハブネークとは　せんぞから　つづく　ライバルだ。
      ja: |-
        普段は　４本足で　行動するが　怒ると
        後足で　立ち　前足の　ツメが　飛び出す。
        ハブネークとは　先祖から　続く　ライバルだ。
      ko: |-
        평소에는 4개의 다리로 행동하지만 화나면
        뒷다리로 서서 앞발의 발톱을 내보인다.
        세비퍼와는 선조 대대로 라이벌이다.
      en: |-
        Zangoose usually stays on all fours, but when angered, it gets
        up on its hind legs and extends its claws. This Pokémon shares
        a bitter rivalry with Seviper that dates back over generations.
      fr: |-
        Mangriff est généralement à quatre pattes, mais lorsqu’il
        est en colère, il se lève sur ses pattes arrière et montre
        ses griffes. Ce Pokémon est l’ennemi juré de Séviper depuis
        plusieurs générations.
      de: |-
        Sengo bewegt sich normalerweise auf allen Vieren. Wenn es
        aber wütend wird, stellt es sich auf seine Hinterbeine und
        fährt die Klauen an seinen Vorderbeinen aus. Dieses Pokémon
        ist seit Generationen ein erbitterter Rivale von Vipitis.
      es: |-
        Zangoose suele caminar a cuatro patas, pero cuando se
        enfada se pone de pie sobre las traseras y saca las zarpas.
        Este Pokémon tiene desde hace varias generaciones una
        áspera rivalidad con Seviper.
      it: |-
        Di solito Zangoose cammina a quattro zampe, ma quando
        si infuria si alza sulle zampe posteriori ed estrae gli artigli.
        Questo Pokémon è acerrimo nemico di Seviper, infatti la loro
        inimicizia è ormai leggendaria.
