crustle:
  base_happiness: 50
  capture_rate: 75
  color: red
  egg_groups:
    - bug
    - mineral
  evolution_chain: dwebble
  evolves_from: dwebble
  flavor_text:
    black:
      en: |-
        Competing for territory, Crustle
        fight viciously. The one whose boulder
        is broken is the loser of the battle.
      fr: |-
        Entre eux, les querelles de territoire
        sont fréquentes et violentes. Celui qui
        se fait briser son rocher a perdu.
    white:
      en: |-
        It possesses legs of enormous strength,
        enabling it to carry heavy slabs for many
        days, even when crossing arid land.
      fr: |-
        Il est assez endurant pour voyager des
        jours durant dans des zones desséchées
        avec son lourd rocher sur le dos.
    black-2:
      en: |-
        When its boulder is broken
        in battles for territory, it feels
        unsure and begins to weaken.
    white-2:
      en: |-
        When its boulder is broken
        in battles for territory, it feels
        unsure and begins to weaken.
    x:
      ja-Hrkt: |-
        おもたい　いわを　せおって
        かんそうした　とちを　なんにちでも
        いどうできる　きゃくりょくを　もつ。
      ja: |-
        重たい　岩を　背負って
        乾燥した　土地を　何日でも
        移動できる　脚力を　持つ。
      ko: |-
        무거운 바위를 등에 지고
        며칠이고 건조한 땅을
        이동할 수 있는 다릿심을 가지고 있다.
      en: |-
        It possesses legs of enormous strength, enabling it
        to carry heavy slabs for many days, even when
        crossing arid land.
      fr: |-
        Il est assez endurant pour voyager des jours durant
        dans des zones desséchées avec son lourd rocher sur
        le dos.
      de: |-
        Es ist hart genug im Nehmen, um mitsamt seines
        schweren Felsens mehrere Tage durch trockene
        Gebiete zu wandern.
      es: |-
        Su inmensa capacidad motriz le permite desplazarse
        cargando a sus espaldas rocas enormes durante días.
      it: |-
        Ha una tale forza nelle gambe, che può spostarsi
        per giorni in zone aride con una pesante roccia
        sulle spalle.
    'y':
      ja-Hrkt: |-
        なわばりを　とりあって　イワパレス
        どうしが　はげしく　たたかう。
        いわを　こわされた　ほうが　まけ。
      ja: |-
        縄張りを　取り合って
        イワパレス　同士が　激しく　戦う。
        岩を　壊されたほうが　負け。
      ko: |-
        영역을 빼앗기 위해
        암팰리스끼리 격렬히 싸운다.
        바위가 부서진 쪽이 패배다.
      en: |-
        Competing for territory, Crustle fight viciously.
        The one whose boulder is broken is the loser of
        the battle.
      fr: |-
        Entre eux, les querelles de territoire sont fréquentes
        et violentes. Celui qui se fait briser son rocher a
        perdu.
      de: |-
        Revierkonflikte führen oft zu heftigen Kämpfen
        zwischen ihnen. Gewonnen hat, wer das
        gegnerische Haus zerstört.
      es: |-
        Se disputa el territorio con sus congéneres. Pierde
        aquel al que le rompan la roca que lleva a cuestas.
      it: |-
        I Crustle si disputano il territorio lottando ferocemente.
        Vince chi distrugge la roccia del rivale.
    omega-ruby:
      ja-Hrkt: |-
        おもたい　いわを　せおって
        かんそうした　とちを　なんにちでも
        いどうできる　きゃくりょくを　もつ。
      ja: |-
        重たい　岩を　背負って
        乾燥した　土地を　何日でも
        移動できる　脚力を　持つ。
      ko: |-
        무거운 바위를 등에 지고
        며칠이고 건조한 땅을
        이동할 수 있는 다릿심을 가지고 있다.
      en: |-
        It possesses legs of enormous strength, enabling it
        to carry heavy slabs for many days, even when
        crossing arid land.
      fr: |-
        Il est assez endurant pour voyager des jours durant
        dans des zones desséchées avec son lourd rocher sur
        le dos.
      de: |-
        Es ist hart genug im Nehmen, um mitsamt seines schweren
        Felsens mehrere Tage durch trockene Gebiete zu wandern.
      es: |-
        Su inmensa capacidad motriz le permite desplazarse cargando
        a sus espaldas rocas enormes durante días.
      it: |-
        Ha una tale forza nelle gambe, che può spostarsi per giorni
        in zone aride con una pesante roccia sulle spalle.
    alpha-sapphire:
      ja-Hrkt: |-
        なわばりを　とりあって　イワパレス
        どうしが　はげしく　たたかう。
        いわを　こわされた　ほうが　まけ。
      ja: |-
        縄張りを　取り合って
        イワパレス　同士が　激しく　戦う。
        岩を　壊されたほうが　負け。
      ko: |-
        영역을 빼앗기 위해
        암팰리스끼리 격렬히 싸운다.
        바위가 부서진 쪽이 패배다.
      en: |-
        Competing for territory, Crustle fight viciously.
        The one whose boulder is broken is the loser of
        the battle.
      fr: |-
        Entre eux, les querelles de territoire sont fréquentes
        et violentes. Celui qui se fait briser son rocher a perdu.
      de: |-
        Revierkonflikte führen oft zu heftigen Kämpfen zwischen ihnen.
        Gewonnen hat, wer das gegnerische Haus zerstört.
      es: |-
        Se disputa el territorio con sus congéneres. Pierde aquel al
        que le rompan la roca que lleva a cuestas.
      it: |-
        I Crustle si disputano il territorio lottando ferocemente.
        Vince chi distrugge la roccia del rivale.
    sword:
      ja-Hrkt: |-
        かんそうした　ばしょを　このみ
        あめのひは　いわから　でない。
        なわばりいしきが　つよいぞ。
      ja: |-
        乾燥した　場所を　好み
        雨の日は　岩から　出ない。
        縄張り意識が　強いぞ。
      ko: |-
        건조한 곳을 좋아하며
        비가 내리는 날에는 바위에서 나오지 않는다.
        자기 영역에 대한 의식이 강하다.
      zh-Hant: |-
        喜歡乾燥的地方，
        下雨時不會從岩石裡出來。
        有著很強的地盤意識。
      zh-Hans: |-
        喜欢干燥的地方，
        下雨时不会从岩石里出来。
        有着很强的地盘意识。
      en: |-
        This highly territorial Pokémon prefers dry
        climates. It won’t come out of its boulder on
        rainy days.
      fr: |-
        Il préfère les endroits secs, et rentre dans
        son rocher quand il pleut.
        Il défend farouchement son territoire.
      de: |-
        Dieses Pokémon mag trockene Gebiete und
        verkriecht sich bei Regen unter seinem Felsen.
        Es zeigt stark ausgeprägtes Territorialverhalten.
      es: |-
        Este Pokémon posee un fuerte instinto territorial
        y prefiere los entornos áridos. Los días de lluvia
        permanece en el interior de su roca.
      it: |-
        Predilige i luoghi aridi e nei giorni di pioggia
        non esce dalla sua roccia. È molto territoriale.
    shield:
      ja-Hrkt: |-
        ふとい　ツメが　さいだいの　ぶき。
        ドサイドンの　プロテクターにさえ
        ひびを　いれるほど　かたいぞ。
      ja: |-
        太い　ツメが　最大の　武器。
        ドサイドンの　プロテクターにさえ
        ひびを　入れるほど　硬いぞ。
      ko: |-
        두꺼운 발톱이 최고의 무기다.
        거대코뿌리의 프로텍터조차
        금이 갈 정도로 딱딱하다.
      zh-Hant: |-
        厚實的鉗子是牠最大的武器。
        硬度高到甚至能讓
        超甲狂犀的護具裂開。
      zh-Hans: |-
        厚实的钳子是它最大的武器。
        硬度高到甚至能让
        超甲狂犀的护具裂开。
      en: |-
        Its thick claws are its greatest weapons.
        They’re mighty enough to crack
        Rhyperior’s carapace.
      fr: |-
        Ses meilleures armes sont ses pinces.
        Elles sont si dures qu’elles peuvent ébrécher
        les Protecteurs de Rhinastoc.
      de: |-
        Seine kräftigen Scheren sind robuste Waffen.
        Sie sind hart genug, um selbst in den Schützern
        von Rihornior Risse zu hinterlassen.
      es: |-
        Su arma más potente son sus gruesas pinzas, tan
        duras que pueden abrir una brecha incluso en el
        Protector de Rhyperior.
      it: |-
        Le spesse chele sono la sua arma più potente.
        Sono talmente dure da poter perfino aprire
        brecce nella Copertura dei Rhyperior.
