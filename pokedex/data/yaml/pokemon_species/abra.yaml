        qu’il dort 18 heures par jour.
    black-2:
      en: |-
        Using its psychic power is such a
        strain on its brain that it needs
        to sleep for 18 hours a day.
    white-2:
      en: |-
        Using its psychic power is such a
        strain on its brain that it needs
        to sleep for 18 hours a day.
    x:
      ja-Hrkt: |-
        １にち　１８じかんは　ねている。
        ねむってる　あいだでも　さまざまな
        ちょうのうりょくを　つかう。
      ja: |-
        １日　１８時間は　寝ている。
        眠ってる　あいだでも
        さまざまな　超能力を　使う。
      ko: |-
        하루에 18시간은 자고 있다.
        자는 동안에도 다양한
        초능력을 사용한다.
      en: |-
        It sleeps for 18 hours a day. It uses a variety of
        extrasensory powers even while asleep.
      fr: |-
        Il dort 18 h par jour. Il peut utiliser de nombreux
        pouvoirs psy, même pendant son sommeil.
      de: |-
        Es schläft 18 Stunden am Tag.
        Währenddessen setzt es eine Vielzahl
        zusätzlicher sensorischer Kräfte ein.
      es: |-
        Duerme 18 horas al día y mientras lo hace es capaz de
        usar una serie de poderes extrasensoriales.
      it: |-
        Dorme 18 ore al giorno. Anche da addormentato
        utilizza una serie di poteri extrasensoriali.
    'y':
      ja-Hrkt: |-
        こうげきの　けはいを　よみとって
        おそわれるまえに　さっさと
        テレポートで　そのばを　さっていく。
      ja: |-
        攻撃の　気配を　読み取って
        襲われる前に　さっさと
        テレポートで　その場を　去っていく。
      ko: |-
        공격의 낌새를 읽고
        공격당하기 전에 얼른
        순간이동으로 그 장소를 떠난다.
      en: |-
        It senses impending attacks and teleports away to
        safety before the actual attacks can strike.
      fr: |-
        Il prévoit les attaques futures et se téléporte pour
        se mettre à l’abri et éviter le combat.
      de: |-
        Es sieht die Attacken der Gegner voraus und setzt
        Teleport ein, um sich in Sicherheit zu bringen.
      es: |-
        Siente los ataques inminentes y se teletransporta a un
        lugar seguro, antes de que estos puedan darle.
      it: |-
        Avverte gli attacchi imminenti e si teletrasporta in
        salvo prima che l’attacco lo possa colpire.
    omega-ruby:
      ja-Hrkt: |-
        １にち　１８じかん　ねむっている　ポケモン。
        ねむったままでも　てきの　けはいを　さっちすると
        テレポートして　にげる　ことが　できるぞ。
      ja: |-
        １日　１８時間　眠っている　ポケモン。
        眠ったままでも　敵の　気配を　察知すると
        テレポートして　逃げる　ことが　できるぞ。
      ko: |-
        하루에 18시간 잠들어 있는 포켓몬이다.
        잠든 상태에서도 적의 기척을 감지하면
        순간이동하여 도망갈 수 있다.
      en: |-
        Abra sleeps for eighteen hours a day. However, it can sense
        the presence of foes even while it is sleeping. In such a
        situation, this Pokémon immediately teleports to safety.
      fr: |-
        Abra dort dix-huit heures par jour. Pourtant, il peut sentir
        la présence de ses ennemis, même endormi. Dans ce genre
        de situation, ce Pokémon se téléporte en lieu sûr.
      de: |-
        Abra schläft 18 Stunden am Tag. Es nimmt die Gegenwart
        von Feinden aber auch im Schlaf wahr. In einer solchen
        Situation bringt es sich umgehend mit Teleport in Sicherheit.
      es: |-
        Abra duerme 18 horas al día, pero puede detectar a cualquier
        enemigo que se le acerque mientras duerme. En una situación
        así, usa Teletransporte para protegerse.
      it: |-
        Abra dorme per 18 ore al giorno, ma riesce a captare
        la presenza dei nemici anche durante il sonno. In questo
        caso il Pokémon si teletrasporta immediatamente al sicuro.
    alpha-sapphire:
      ja-Hrkt: |-
        まいにち　１８じかん　ねむらないと　ねぶそくで
        ちょうのうりょくが　つかえなくなってしまう。
        おそわれると　ねたまま　テレポートで　にげる。
      ja: |-
        毎日　１８時間　眠らないと　寝不足で
        超能力が　使えなくなってしまう。
        襲われると　寝たまま　テレポートで　逃げる。
      ko: |-
        매일 18시간을 자지 않으면 수면 부족으로
        초능력을 사용할 수 없게 된다.
        습격당하면 잠든 채로 순간이동하여 도망간다.
      en: |-
        Abra needs to sleep for eighteen hours a day. If it doesn’t,
        this Pokémon loses its ability to use telekinetic powers. If it is
        attacked, Abra escapes using Teleport while it is still sleeping.
      fr: |-
        Abra doit dormir dix-huit heures par jour. S’il dort moins,
        ce Pokémon ne peut plus utiliser ses pouvoirs télékinétiques.
        Lorsqu’il est attaqué, Abra s’enfuit en utilisant Téléport,
        sans même se réveiller.
      de: |-
        Abra braucht 18 Stunden Schlaf pro Tag, sonst verliert
        es die Fähigkeit, seine telekinetischen Kräfte zu nutzen.
        Abra flüchtet mithilfe von Teleport, schläft dabei aber weiter.
      es: |-
        Abra necesita dormir 18 horas al día. Si no, pierde la habilidad
        que tiene de usar poderes de telequinesia. Si le atacan, Abra
        puede escapar usando Teletransporte mientras duerme.
      it: |-
        Abra ha bisogno di 18 ore di sonno al giorno. In caso
        contrario perde le sue abilità telecinetiche. Se attaccato,
        Abra fugge usando Teletrasporto mentre dorme.
    sun:
      ja-Hrkt: |-
        １にち　１８じかんは　ねむる。
        ねたまま　テレポートで　きのうえに
        いどうし　きのみを　とって　くう。
      ja: |-
        １日　１８時間は　眠る。
        寝たまま　テレポートで　木の上に
        移動し　木の実を　取って　喰う。
      ko: |-
        1일 18시간을 잔다.
        잠든 채 순간이동으로 나무 위에
        이동하여 나무열매를 따서 먹는다.
      zh-Hant: |-
        １天中有１８個小時都在睡覺。
        即使在睡夢中也能用瞬間移動
        跑到樹上去採樹果吃。
      zh-Hans: |-
        １天中有１８个小时在睡觉。
        即使睡着，也能用瞬间移动
        在树上移动，采树果吃。
      en: |-
        It sleeps 18 hours a day. Even while sleeping,
        it will teleport itself to treetops and pick and
        eat berries there.
      fr: |-
        Il dort 18 heures par jour. Il lui arrive de se
        téléporter dans les arbres et d’en manger
        les Baies sans même se réveiller.
      de: |-
        Abra schläft 18 Stunden am Tag. Es kann sich
        im Schlaf auf Bäume teleportieren, um dort
        Beeren zu pflücken und zu essen.
      es: |-
        Abra duerme 18 horas al día. Se teletransporta
        a las copas de los árboles y, aún dormido,
        se alimenta de bayas.
      it: |-
        Dorme 18 ore al giorno. Anche nel sonno,
        si teletrasporta sugli alberi, coglie le bacche
        e le mangia.
    moon:
      ja-Hrkt: |-
        ねむっているときも　テレポートして
        みを　まもっているが　めざめたときに
        どこに　いるか　わからず　あわてる。
      ja: |-
        眠っているときも　テレポートして
        身を　守っているが　目覚めたときに
        どこに　いるか　分からず　あわてる。
      ko: |-
        잠든 사이에도 순간이동 해서
        몸을 지키지만 깨어났을 때
        어디에 있는지 몰라서 당황한다.
      zh-Hant: |-
        即使在睡著的時候也會用
        瞬間移動保護自己的安全，
        但醒來時會因不知自己在何處而慌張。
      zh-Hans: |-
        即使是睡着的时候也会用
        瞬间移动保护身体，
        但醒来时会因不知自己在何处而慌张。
      en: |-
        It can teleport itself to safety while it’s asleep,
        but when it wakes, it doesn’t know where it is,
        so it panics.
      fr: |-
        Il lui arrive de se téléporter pendant son sommeil
        pour se protéger, mais lorsqu’il se réveille, il se
        retrouve dans un endroit inconnu et panique.
      de: |-
        Es bringt sich selbst im Schlaf mit Teleport vor
        Angreifern in Sicherheit. Wacht es danach auf,
        gerät es in Panik, weil es nicht weiß, wo es ist.
      es: |-
        Puede teletransportarse mientras duerme para
        evitar todo tipo de peligros, pero luego se
        despierta desconcertado en un lugar extraño.
      it: |-
        Può teletrasportarsi al sicuro anche mentre
        dorme, ma quando si sveglia non capisce dove
        si trova e viene preso dall’agitazione.
    ultra-sun:
      ja-Hrkt: |-
        ねむっている　あいだも　さまざまな
        ちょうのうりょくを　つかってくるので
        おきているのか　みわけが　つかない。
      ja: |-
        眠っている　あいだも　様々な
        超能力を　使ってくるので
        起きているのか　見分けが　つかない。
      ko: |-
        자는 동안에도 다양한
        초능력을 사용하기 때문에
        깨어 있는 것이 아닌지 헷갈린다.
      zh-Hant: |-
        即使在睡夢中也會
        使出各式各樣的超能力，
        所以很難分辨牠是不是醒著。
      zh-Hans: |-
        即使是在睡梦中
        也会使用各种超能力，
        所以分辨不出它是不是醒着。
      en: |-
        It uses various psychic powers even while it’s
        sleeping, so you can’t tell whether or not
        it’s awake.
      fr: |-
        Il utilise certains de ses pouvoirs psychiques
        même quand il dort, aussi est-ce impossible
        de savoir s’il est éveillé ou non.
      de: |-
        Da es seine Psycho-Kräfte selbst im Schlaf
        einsetzt, weiß man meistens nicht, ob es gerade
        wach ist oder schläft.
      es: |-
        Es capaz de usar sus poderes psíquicos aun
        estando dormido, por lo que es difícil distinguir
        entre sus estados de sueño y vigilia.
      it: |-
        Può usare i suoi poteri psichici anche mentre
        dorme. Per questo è difficile capire se è sveglio
        oppure no.
    ultra-moon:
      ja-Hrkt: |-
        あいての　こころを　よみとって
        キケンが　せまるまえに　テレポート。
        つかまえるには　むしんに　なれ。
      ja: |-
        相手の　心を　読みとって
        危険が　迫る前に　テレポート。
        捕まえるには　無心に　なれ。
      ko: |-
        상대의 마음을 읽어서
        위험이 닥치기 전에 순간이동한다.
        잡으려면 마음을 비워야 한다.
      zh-Hant: |-
        會讀對方的心，在危險來臨前
        使出瞬間移動逃走。要捕捉牠
        就必須讓自己的心完全放空。
      zh-Hans: |-
        能读取对方的心声，在危险临近前
        会通过瞬间移动逃走。
        要捕捉它的话，你得放空心灵。
      en: |-
        It can read others’ minds and will teleport away
        when danger approaches. You must clear your
        mind if you want to catch it.
      fr: |-
        Il lit les pensées de ses adversaires et se
        téléporte au loin avant d’être en danger. Pour
        l’attraper, il faut faire le vide dans son esprit.
      de: |-
        Es liest die Gedanken seines Gegners und setzt
        bei Gefahr Teleport ein. Wer es fangen möchte,
        übe seinen Geist in absoluter Gelassenheit.
      es: |-
        Lee el pensamiento del rival y se teletransporta
        antes de verse en peligro. Para atraparlo es
        necesario mantener la mente en blanco.
      it: |-
        Grazie alla sua capacità di leggere nel pensiero,
        prevede il pericolo e si teletrasporta lontano.
        Per catturarlo bisogna svuotare la mente.
    lets-go-pikachu:
      ja-Hrkt: |-
        １にちに　１８じかん　ねむる。
        きけんが　せまると　ねたままでも
        テレポートして　にげる。
      ja: |-
        １日に　１８時間　眠る。
        危険が　迫ると　寝たままでも
        テレポートして　逃げる。
      ko: |-
        하루에 18시간을 잔다.
        위험이 닥치면 잠든 상태에서도
        순간이동해서 도망친다.
      zh-Hant: |-
        每天要睡18個小時。
        有危險逼近時，就算在睡夢中
        也能用瞬間移動來逃走。
      zh-Hans: |-
        它每天要睡18个小时。
        遇到危险时，即使在睡梦中
        也可以用瞬间移动来逃脱。
      en: |-
        Sleeps 18 hours a day. If it senses danger,
        it will teleport itself to safety even as it sleeps.
      fr: |-
        Il dort 18 heures par jour. En cas de danger, il se
        téléporte vers un lieu sûr, même s’il est assoupi.
      de: |-
        Dieses Pokémon schläft 18 Stunden am Tag.
        Bei Gefahr teleportiert es sich in Sicherheit,
        ohne dabei aufzuwachen.
      es: |-
        Duerme 18 horas al día. Si siente peligro, se
        teletransporta a un lugar seguro, aun estando
        dormido.
      it: |-
        Dorme 18 ore al giorno. Se percepisce
        un pericolo, riesce a teletrasportarsi anche
        senza svegliarsi.
    lets-go-eevee:
      ja-Hrkt: |-
        １にちに　１８じかん　ねむる。
        きけんが　せまると　ねたままでも
        テレポートして　にげる。
      ja: |-
        １日に　１８時間　眠る。
        危険が　迫ると　寝たままでも
        テレポートして　逃げる。
      ko: |-
        하루에 18시간을 잔다.
        위험이 닥치면 잠든 상태에서도
        순간이동해서 도망친다.
      zh-Hant: |-
        每天要睡18個小時。
        有危險逼近時，就算在睡夢中
        也能用瞬間移動來逃走。
      zh-Hans: |-
        它每天要睡18个小时。
        遇到危险时，即使在睡梦中
        也可以用瞬间移动来逃脱。
      en: |-
        Sleeps 18 hours a day. If it senses danger,
        it will teleport itself to safety even as it sleeps.
      fr: |-
        Il dort 18 heures par jour. En cas de danger, il se
        téléporte vers un lieu sûr, même s’il est assoupi.
      de: |-
        Dieses Pokémon schläft 18 Stunden am Tag.
        Bei Gefahr teleportiert es sich in Sicherheit,
        ohne dabei aufzuwachen.
      es: |-
        Duerme 18 horas al día. Si siente peligro, se
        teletransporta a un lugar seguro, aun estando
        dormido.
      it: |-
        Dorme 18 ore al giorno. Se percepisce
        un pericolo, riesce a teletrasportarsi anche
        senza svegliarsi.
    sword:
      ja-Hrkt: |-
        ねながら　ちょうのうりょくを
        あやつる。　ゆめの　ないようが
        つかう　ちからに　えいきょうする。
      ja: |-
        寝ながら　超能力を　操る。
        夢の　内容が　使う　力に　影響する。
      ko: |-
        자면서 초능력을 구사한다.
        꿈의 내용이
        사용하는 힘에 영향을 준다.
      zh-Hant: |-
        會一邊睡覺一邊操控超能力。
        夢的內容會影響牠使用的能力。
      zh-Hans: |-
        会一边睡觉一边操纵
        超能力。梦的内容会
        影响它使用的能力。
      en: |-
        This Pokémon uses its psychic powers while it
        sleeps. The contents of Abra’s dreams affect the
        powers that the Pokémon wields.
      fr: |-
        Le contenu de ses rêves influe sur les pouvoirs
        psychiques qu’il utilise dans son sommeil.
      de: |-
        Es setzt seine Psycho-Kräfte selbst im Schlaf ein.
        Der Inhalt seiner Träume hat Einfluss auf die
        Kräfte, die es verwendet.
      es: |-
        Es capaz de usar sus poderes psíquicos aun
        estando dormido. Al parecer, el contenido del
        sueño influye en sus facultades.
      it: |-
        Il contenuto dei suoi sogni influisce sui suoi
        poteri psichici, che può utilizzare anche
        mentre dorme.
    shield:
      ja-Hrkt: |-
        ねむったまま　テレポート　できる。
        ねむりが　ふかいほど　はなれた
        ばしょに　いどうする　という。
      ja: |-
        眠ったまま　テレポート　できる。
        眠りが　深いほど　離れた　場所に
        移動する　という。
      ko: |-
        잠이 든 상태에서 순간이동이
        가능하다. 깊이 잠들수록
        먼 곳으로 이동한다고 한다.
      zh-Hant: |-
        就算在睡夢中也能使用瞬間移動。
        據說當牠睡得越熟，
        瞬間移動的距離就會越遠。
      zh-Hans: |-
        能够在睡梦中使出瞬间移动。
        据说它睡得越熟，就能
        移动到越遥远的地方。
      en: |-
        Abra can teleport in its sleep. Apparently
        the more deeply Abra sleeps, the farther its
        teleportations go.
      fr: |-
        Il peut se téléporter en dormant. On dit que plus
        son sommeil est profond, plus il se téléporte loin.
      de: |-
        Es kann sich im Schlaf teleportieren. Je tiefer
        Abra schläft, desto weiter entfernt soll der Ort
        sein, an den es sich teleportiert.
      es: |-
        Puede teletransportarse mientras duerme. Se
        dice que, cuanto más profundo sea su sueño,
        mayor será la distancia a la que se desplace.
      it: |-
        È in grado di teletrasportarsi mentre dorme.
        Si dice che più profondo sia il suo sonno, più
        possa spostarsi lontano.
    legends-arceus:
      en: |-
        Spends 18 hours of the day sleeping. Even while asleep, Abra
        can control its psychic powers—should danger approach, the
        Pokémon will simply teleport away.
  form_description: {  }
  forms_switchable: false
  gender_rate: '2'
