    sword:
      ja-Hrkt: |-
        ある　しょうねんの　はつめいから
        ロトムを　いかした　いろいろな
        きかいが　つくられはじめたのだ。
      ja: |-
        ある　少年の　発明から
        ロトムを　活かした　いろいろな
        機械が　作られ始めたのだ。
      ko: |-
        어떤 소년의 발명에 의해
        로토무를 활용한 다양한
        기계가 만들어지기 시작했다.
      zh-Hant: |-
        某位少年的發明
        促使人們開始製造
        各種活用洛托姆的機器。
      zh-Hans: |-
        某位少年的发明
        促使人们开始制造
        各种活用洛托姆的机器 。
      en: |-
        One boy’s invention led to the development of
        many different machines that take advantage of
        Rotom’s unique capabilities.
      fr: |-
        L’invention d’un jeune homme a inspiré
        la création de machines permettant de profiter
        des compétences de ce Pokémon.
      de: |-
        Die Erfindung eines jungen Tüftlers hat zu der
        Herstellung verschiedener Geräte geführt, die
        das Potenzial von Rotom nutzen können.
      es: |-
        Gracias a la inventiva de cierto joven, se ha
        iniciado la fabricación de diversos artilugios
        que aprovechan todo el potencial de Rotom.
      it: |-
        L’invenzione di un ragazzo ha dato l’avvio
        alla fabbricazione di vari apparecchi che
        sfruttano le caratteristiche peculiari di Rotom.
    shield:
      ja-Hrkt: |-
        プラズマで　できた　からだで
        いろんな　きかいに　もぐりこむ。
        おどろかせるのが　だいすきだ。
      ja: |-
        プラズマで　できた　体で
        いろんな　機械に　潜りこむ。
        驚かせるのが　大好きだ。
      ko: |-
        플라스마로 된 몸으로
        다양한 기계에 숨는다.
        놀라게 하는 걸 매우 좋아한다.
      zh-Hant: |-
        會用等離子構成的身體
        潛入各式各樣的機器裡。
        最喜歡惡作劇嚇人。
      zh-Hans: |-
        会用由离子构成的身体
        潜入各种各样的机器里。
        最喜欢恶作剧吓人。
      en: |-
        With a body made of plasma, it can inhabit all
        sorts of machines. It loves to surprise others.
      fr: |-
        Son corps composé de plasma lui permet
        d’infiltrer diverses machines.
        Il adore surprendre les gens.
      de: |-
        Mit seinem aus Plasma bestehenden Körper kann
        es in verschiedene Geräte schlüpfen. Es liebt es,
        andere zu erschrecken.
      es: |-
        Su cuerpo de plasma le permite infiltrarse en
        toda clase de dispositivos electrónicos. Adora
        sobresaltar a la gente.
      it: |-
        Si intrufola in diversi apparecchi con il suo corpo
        composto di plasma. Gli piace tanto sorprendere
        le persone.
    legends-arceus:
      en: |-
        This bizarre Pokémon appears to be a will-o'-the-wisp powered
        by electricity. Be wary, as Rotom is both smart and mischievous.
  form_description:
    en: |-
      Forms have different signature moves and types, and the appliance forms' stats are different from the normal form's.  In Generation IV, all forms are Electric/Ghost type.

      When switching forms, the old signature move (if any) is removed and the new one must be learned, overwriting another move if need be, or the switch will be cancelled; however, it can be forgotten while in the new form.  If Rotom only knows its signature move upon reverting to its default form, it learns []{move:thunder-shock} to avoid having no moves.

      Appliances for switching Rotom's form can be found in the following locations, depending on the game:

      * Platinum: In the Team Galactic Eterna Building.  Requires a []{item:secret-key}.
      * HeartGold and SoulSilver: In the Silph Co. Office Building.  Enter the building when walking with Rotom and enter the broken elevator.
      * Black and White 1 & 2: In Shopping Mall Nine.  Found in boxes in a storage room on the first floor on the far right.
