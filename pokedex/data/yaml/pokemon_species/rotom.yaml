      en: |-
        Research continues on this Pokémon, which could
        be the power source of a unique motor.
      fr: |-
        Un Pokémon longtemps étudié comme source
        d’énergie pour un moteur très spécial.
      de: |-
        Dieses Pokémon wurde lange Zeit erforscht,
        um als Energiequelle für einen besonderen
        Motor zu dienen.
      es: |-
        Desde hace mucho tiempo se estudia su singular
        motor como fuente de energía motriz.
      it: |-
        Questo Pokémon è stato usato a lungo per ricerche
        come forza motrice su motori speciali.
    'y':
