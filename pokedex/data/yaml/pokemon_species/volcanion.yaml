volcanion:
  base_happiness: 100
  capture_rate: 3
  color: brown
  egg_groups:
    - no-eggs
  evolution_chain: volcanion
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        すいじょうきを　ふきだして　じぶんの
        すがたを　のうむで　かくす。ひとの
        たちいらない　やまに　すむと　いう。
      ja: |-
        水蒸気を　噴き出して　自分の　姿を
        濃霧で　隠す。人の　立ち入らない
        山に　住むという。
      ko: |-
        수증기를 뿜어내어 자신의
        모습을 짙은 안개 속에 숨긴다. 사람이
        오지 않는 산에 산다고 한다.
      en: |-
        It lets out billows of steam and disappears into
        the dense fog. It’s said to live in mountains
        where humans do not tread.
      fr: |-
        Il est capable de générer un nuage de vapeur pour
        se cacher. Il vit dans des montagnes inhabitées.
      de: |-
        Es stößt Wasserdampf aus und versteckt sich
        im dadurch entstehenden dichten Nebel. Es lebt in
        Bergen, die von Menschen gemieden werden.
      es: |-
        Expulsa vapor y desaparece entre la densa niebla.
        Dicen que habita en montañas solitarias.
      it: |-
        Si nasconde emettendo spesse nubi di vapore attorno
        a sé. Si dice che viva su montagne non frequentate
        dall’uomo.
    'y':
      ja-Hrkt: |-
        せなかの　アームから　たいないの
        すいじょうきを　ふんしゃする。
        やま　ひとつ　ふきとばす　いりょく。
      ja: |-
        背中の　アームから
        体内の　水蒸気を　噴射する。
        山　ひとつ　吹き飛ばす　威力。
      ko: |-
        등에 있는 팔로 체내의
        수증기를 분사한다.
        산 하나를 날려버릴 정도의 위력이다.
      en: |-
        It expels its internal steam from the
        arms on its back. It has enough
        power to blow away a mountain.
      fr: |-
        Il évacue la vapeur qui s’accumule à l’intérieur de son
        corps par les bras situés sur son dos.
        Ce jet est assez puissant pour raser des montagnes.
      de: |-
        Über die Arme auf seinem Rücken stößt es
        Wasserdampf aus. Seine Kraft reicht aus,
        um Berge zu versetzen.
      es: |-
        Expulsa vapor de agua por los brazos que tiene en
        la espalda. Sale a tal potencia que sería capaz de
        arrasar una montaña entera.
      it: |-
        Emette il vapore generato nel suo corpo dalle braccia
        congiunte ad anello sul dorso. La potenza del getto
        potrebbe spazzare via una montagna.
