carbink:
  base_happiness: 50
  capture_rate: 60
  color: gray
  egg_groups:
    - fairy
    - mineral
  evolution_chain: carbink
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        ちかふかくの　こうおん　こうあつな
        かんきょうで　うまれた。あたまの
        いしから　エネルギーを　はなつ。
      ja: |-
        地下深くの　高温　高圧な
        環境で　生まれた。
        頭の　石から　エネルギーを　放つ。
      ko: |-
        지하 깊은 곳에 있는 고온, 고압의
        환경에서 태어났다. 머리의
        돌에서 에너지를 방출한다.
      en: |-
        Born from the temperatures and pressures
        deep underground, it fires beams from the
        stone in its head.
      fr: |-
        Ce Pokémon vient des profondeurs de la terre,
        où la chaleur et la pression sont intenses.
        La pierre qui orne sa tête émet de l’énergie.
      de: |-
        Dieses Pokémon entstand aus Druck und Hitze
        in den tiefsten Erdschichten. Mithilfe des Steines
        in seinem Kopf feuert es Energiestrahlen ab.
      es: |-
        Nace en las profundidades subterráneas, a altas
        temperaturas y a gran presión. Irradia energía por
        la roca que tiene en la cabeza.
      it: |-
        Nato in ambienti sotterranei a elevati livelli di pressione
        e temperatura, emette energia dalla pietra che ha
        sulla testa.
    'y':
      ja-Hrkt: |-
        うまれてから　すうおくねんの　あいだ
        ちていで　ねむっていた。どうくつを
        ほると　たまに　でてくる。
      ja: |-
        生まれてから　数億年の間
        地底で　眠っていた。
        洞窟を　掘ると　たまに　出てくる。
      ko: |-
        태어나서 수억 년 동안
        땅속에 잠들어 있었다. 동굴을
        파면 가끔 나오곤 한다.
      en: |-
        It has slept underground for hundreds of millions
        of years since its birth. It’s occasionally found
        during the excavation of caves.
      fr: |-
        Il sommeille sous terre depuis son apparition, il y a
        plusieurs centaines de millions d’années.
        On le découvre parfois en creusant des cavernes.
      de: |-
        Nach seiner Geburt brachte es hunderte Millionen von
        Jahren tief unter der Erde schlafend zu. Es tritt
        gelegentlich bei Höhlengrabungen zutage.
      es: |-
        Lleva varios cientos de millones de años durmiendo en
        las profundidades subterráneas, desde su nacimiento.
        Aparece a veces al excavar en cuevas.
      it: |-
        Dopo la nascita, dorme nelle viscere della terra per
        milioni di anni. A volte se ne trova qualche esemplare
        scavando nelle caverne.
    omega-ruby:
      ja-Hrkt: |-
        ちかふかくの　こうおん　こうあつな
        かんきょうで　うまれた。あたまの
        いしから　エネルギーを　はなつ。
      ja: |-
