        temperatura, emette energia dalla pietra che ha sulla testa.
    alpha-sapphire:
      ja-Hrkt: |-
        うまれてから　すうおくねんの　あいだ
        ちていで　ねむっていた。どうくつを
        ほると　たまに　でてくる。
      ja: |-
        生まれてから　数億年の間
        地底で　眠っていた。
        洞窟を　掘ると　たまに　出てくる。
      ko: |-
        태어나서 수억 년 동안
        땅속에 잠들어 있었다. 동굴을
        파면 가끔 나오곤 한다.
      en: |-
        It has slept underground for hundreds of millions
        of years since its birth. It’s occasionally found
        during the excavation of caves.
      fr: |-
        Il sommeille sous terre depuis son apparition, il y a
        plusieurs centaines de millions d’années. On le découvre
        parfois en creusant des cavernes.
      de: |-
        Nach seiner Geburt brachte es hunderte Millionen von
        Jahren tief unter der Erde schlafend zu. Es tritt gelegentlich
        bei Höhlengrabungen zutage.
      es: |-
        Lleva varios cientos de millones de años durmiendo en las
        profundidades subterráneas, desde su nacimiento. Aparece
        a veces al excavar en cuevas.
      it: |-
        Dopo la nascita, dorme nelle viscere della terra per milioni
        di anni. A volte se ne trova qualche esemplare scavando
        nelle caverne.
    sun:
      ja-Hrkt: |-
        こうおん　こうあつの　ちかふかくで
        うまれる。　ほうせきの　ぶぶんから
        ビームを　はなち　みを　まもるぞ。
      ja: |-
        高温　高圧の　地下深くで
        生まれる。　宝石の　部分から
        ビームを　放ち　身を　守るぞ。
      ko: |-
        고온 고압의 지하 깊은 곳에서
        태어난다. 보석 부분에서
        빔을 발사하여 몸을 지킨다.
      zh-Hant: |-
        出生在高溫高壓的地底深處。
        從寶石的部分釋放光束保護身體。
      zh-Hans: |-
        出生在高温高压的地下深处。
        从宝石的部分放出光束保护身体。
      en: |-
        Born from the high temperatures and pressures
        deep underground, it defends itself by firing
        beams from the jewel part of its body.
      fr: |-
        Les Strassie sont nés sous la terre, à de hautes
        pressions et températures. Ils se défendent
        en lançant des lasers depuis leurs cristaux.
      de: |-
        Druck und Hitze tiefster Erdschichten erzeugten
        dieses Pokémon. Seine funkelnden Körperstellen
        sondern Strahlen ab, mit denen es sich schützt.
      es: |-
        Nace en las profundidades subterráneas, a altas
        temperaturas y a gran presión. Lanza rayos por
        sus gemas a modo de defensa.
      it: |-
        Questo Pokémon nasce sottoterra in condizioni
        di pressione e temperatura estreme. Si difende
        emettendo raggi dalle gemme.
    moon:
      ja-Hrkt: |-
        さほど　めずらしいわけではないが
        キラキラと　かがやく　ほうせきの
        からだが　じょせいに　にんきだ。
      ja: |-
        さほど　珍しいわけではないが
        キラキラと　輝く　宝石の
        身体が　女性に　人気だ。
      ko: |-
        그다지 희귀하지는 않지만
        반짝반짝 빛나는 보석으로 된
        몸이 여성에게 인기다.
      zh-Hant: |-
        雖然並不是很稀有，
        但閃閃發光的寶石身體
        很受女性歡迎。
      zh-Hans: |-
        虽然并不是那么的稀有，
        但闪闪发光的宝石身体
        在女性中很受欢迎。
      en: |-
        Although this Pokémon is not especially rare,
        its glittering, jewel-draped body draws
        attention from people.
      fr: |-
        Il ne s’agit pas d’un Pokémon particulièrement
        rare, mais son allure strass et paillettes attire
        les gens.
      de: |-
        Der Edelstein, der in seinem Körper steckt,
        ist zwar recht gewöhnlich, aber da er schön
        funkelt, ist das Pokémon trotzdem sehr beliebt.
      es: |-
        Aunque no es un Pokémon especialmente raro
        de ver, el brillo de las joyas que lleva
        incrustadas lo hace muy popular.
      it: |-
        Pur non essendo particolarmente raro, è molto
        apprezzato per le scintillanti pietre preziose
        di cui è cosparso il suo corpo.
    ultra-sun:
      ja-Hrkt: |-
        ちていの　おくふかくには　メレシーの
        むれと　その　じょおうが　くらす
        ほうせきの　くにが　あるという。
      ja: |-
        地底の　奥深くには　メレシーの
        群れと　その　女王が　暮らす
        宝石の　国が　あるという。
      ko: |-
        땅속 깊숙한 곳에는 멜리시의
        무리와 그들의 여왕이 사는
        보석의 나라가 있다고 한다.
      zh-Hant: |-
        據說在地底的深處，
        有著小碎鑽族群和牠們的女王
        所居住的寶石王國。
      zh-Hans: |-
        据说，在地底的深处，
        有着小碎钻群体和它们的女王
        共同生活的宝石王国。
      en: |-
        Some say that deep beneath the surface of the
        world, a pack of Carbink live with their queen in
        a kingdom of jewels.
      fr: |-
        Au plus profond de la terre se trouverait
        un royaume de pierres précieuses où vivent
        la reine des Strassie et son peuple.
      de: |-
        Tief unter der Erde gibt es angeblich ein
        Königreich aus Diamanten, in dem Rocara
        zusammen mit ihrer Königin leben.
      es: |-
        Se dice que en las profundidades subterráneas
        viven grupos enteros de Carbink con su reina
        rodeados de toda suerte de joyas.
      it: |-
        Corre voce che nelle profondità della terra
        ci sia un regno fatto di pietre preziose dove
        vivono i Carbink assieme alla loro regina.
    ultra-moon:
      ja-Hrkt: |-
        からだの　ほうせきが　くもらないよう
        メレシーの　むれでは　ふわふわの
        ヒゲで　おたがいを　みがきあうのだ。
      ja: |-
        身体の　宝石が　曇らないよう
        メレシーの　群れでは　ふわふわの
        ヒゲで　お互いを　磨きあうのだ。
      ko: |-
        몸에 있는 보석의 색이 바래지 않도록
        멜리시의 무리는 푹신푹신한
        수염으로 서로를 닦아준다.
      zh-Hant: |-
        為了不讓身上的寶石失去光芒，
        小碎鑽的群體會用蓬鬆的鬍子
        互相打磨彼此的身體。
      zh-Hans: |-
        为了不让身体上的宝石黯淡，
        小碎钻群体间会用蓬松的胡子
        互相打磨对方。
      en: |-
        To keep the jewels on their bodies free of
        tarnish, packs of Carbink use their soft manes
        to polish one another’s jewels.
      fr: |-
        Pour éviter que les pierres précieuses de leur
        corps ne ternissent, les Strassie se les polissent
        mutuellement avec leurs moustaches.
      de: |-
        Um zu verhindern, dass die Edelsteine an ihrem
        Körper den Glanz verlieren, polieren sich Rocara
        gegenseitig mit ihren flauschigen Bärten.
      es: |-
        Para que las piedras preciosas que adornan sus
        cuerpos no pierdan lustre, los Carbink se las
        pulen unos a otros con sus mullidos bigotes.
      it: |-
        Per evitare che le pietre preziose che adornano
        il loro corpo perdano lucentezza, i Carbink se le
        lucidano a vicenda con i morbidi baffi.
    sword:
      ja-Hrkt: |-
        からだに　うまっている　ほうせきから
        こうエネルギーの　ビームを　はなち
        おそいかかる　てきを　いっそうする。
      ja: |-
        体に　埋まっている　宝石から
        高エネルギーの　ビームを　放ち
        襲いかかる　敵を　一掃する。
      ko: |-
        몸에 묻어 있는 보석에서
        강한 에너지 빔을 쏘아 덤벼드는
        적을 한꺼번에 날려버린다.
      zh-Hant: |-
        會從嵌在身體的寶石
        發射出高能量的光線，
        將來襲的敵人一掃而盡。
      zh-Hans: |-
        从体内埋藏的宝石中发射出
        高能量的光线，将所有
        来袭的敌人都一扫而尽。
      en: |-
        When beset by attackers, Carbink wipes them all
        out by firing high-energy beams from the gems
        embedded in its body.
      fr: |-
        Ce Pokémon élimine les ennemis qui l’attaquent
        en projetant un laser d’énergie généré par
        les pierres précieuses incrustées dans son corps.
      de: |-
        Es feuert hochenergetische Strahlen aus den
        Edelsteinen ab, mit denen sein Körper besetzt
        ist, und erledigt so angreifende Gegner.
      es: |-
        Fulmina a sus enemigos con potentes rayos de
        energía que dispara por las gemas que tiene
        incrustadas en el cuerpo.
      it: |-
        Le gemme incastonate nel suo corpo
        emettono potenti raggi energetici con cui
        spazza via i nemici che lo attaccano.
    shield:
      ja-Hrkt: |-
        せかいの　どこかには　メレシーが
        たくさん　ねむる　こうみゃくがあり
        むれの　じょおうも　いるという。
      ja: |-
        世界の　どこかには　メレシーが
        たくさん　眠る　鉱脈があり
        群れの　女王も　いるという。
      ko: |-
        세상 어딘가에는 멜리시가
        많이 잠들어 있는 광맥이 있고
        무리의 여왕도 있다고 한다.
      zh-Hant: |-
        據說在世界的某處，有個
        沉睡著許多小碎鑽的礦床，
        群體的女王也在那裡。
      zh-Hans: |-
        据说在世界上的某处，有个
        沉睡着许多小碎钻的矿脉，
        它们的女王也在那里。
      en: |-
        It’s said that somewhere in the world, there’s
        a mineral vein housing a large pack of slumbering
        Carbink. It’s also said that this pack has a queen.
      fr: |-
        On raconte qu’il existerait quelque part dans
        le monde un filon regorgeant de Strassie,
        qui abriterait également leur reine.
      de: |-
        Es heißt, irgendwo auf der Welt gäbe es eine
        Gesteinsader aus schlafenden Rocara. Dort soll
        man auch ihre Königin antreffen können.
      es: |-
        Se cree que en algún lugar de este mundo existe
        un filón rebosante de Carbink que viven bajo las
        órdenes de una reina.
      it: |-
        Si dice che da qualche parte nel mondo c’è
        una miniera in cui i Carbink dormono assieme
        alla loro regina.
