dreepy:
  base_happiness: 50
  capture_rate: 45
  color: green
  egg_groups:
    - indeterminate
    - dragon
  evolution_chain: dreepy
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        こだいの　うみで　くらしていた。
        ゴーストポケモンとして　よみがえり
        かつての　すみかを　さまよっている。
      ja: |-
        古代の　海で　暮らしていた。
        ゴーストポケモンとして　よみがえり
        かつての　すみかを　さまよっている。
      ko: |-
        고대의 바다에 살았다.
        고스트포켓몬으로 되살아나
        과거의 보금자리를 떠돌고 있다.
      zh-Hant: |-
        曾經棲息在古代的大海。
        在重生為幽靈寶可夢後，
        會在昔日的住處徘徊。
      zh-Hans: |-
        曾经栖息在古代的大海。
        在重生为幽灵宝可梦后，
        会在昔日的住处徘徊。
      en: |-
        After being reborn as a ghost Pokémon,
        Dreepy wanders the areas it used to inhabit
        back when it was alive in prehistoric seas.
      fr: |-
        Revenu à la vie sous forme de Pokémon Spectre,
        il erre au-dessus de la mer dans laquelle il vivait
        autrefois.
      de: |-
        In der Urzeit lebte es im Meer. Nun ist es als
        Geister-Pokémon wiedererwacht und irrt rastlos
        durch seinen früheren Lebensraum.
      es: |-
        Habitaba los mares en tiempos inmemoriales. Ha
        revivido en forma de Pokémon de tipo Fantasma
        para vagar por su antigua morada.
      it: |-
        Abitava i mari in tempi antichi. È rinato sotto
        forma di Pokémon di tipo Spettro e vaga per
        quella che un tempo era la sua dimora.
    shield:
      ja-Hrkt: |-
        １ぴきでは　こどもにも　まけるくらい
        ひりきだが　なかまの　きょうりょくで
        きたえられ　しんかして　つよくなる。
      ja: |-
        １匹では　子どもにも　負けるくらい
        非力だが　仲間の　協力で
        鍛えられ　進化して　強くなる。
      ko: |-
        1마리로는 아이에게도 질 정도로
        힘이 약하지만 동료의 협력으로
        단련하고 진화하면 강해진다.
      zh-Hant: |-
        雖然單獨１隻弱得甚至敵不過小孩，
        但會和夥伴合作一起鍛鍊，
        透過進化而變得更強。
      zh-Hans: |-
        虽然单独１只弱得甚至敌不过小孩，
        但会和伙伴合作一起锻炼，
        通过进化而变得更强。
      en: |-
        If this weak Pokémon is by itself, a mere child
        could defeat it. But if Dreepy has friends to help
        it train, it can evolve and become much stronger.
      fr: |-
        Seul, il est si faible qu’il ne saurait rivaliser avec
        un enfant, mais en coopérant avec ses semblables,
        il peut devenir assez fort pour évoluer.
      de: |-
        Alleine ist es sogar gegen ein Kind machtlos,
        doch mit der Hilfe seiner Gefährten trainiert es,
        entwickelt sich und wird so stärker.
      es: |-
        En solitario es tan débil que no sería rival ni para
        un niño, pero, al entrenarse con sus congéneres,
        evoluciona y se vuelve más fuerte.
      it: |-
        Da solo è più debole di un bambino, ma se
        si allena con l’aiuto dei suoi simili si evolve
        e diventa più forte.
