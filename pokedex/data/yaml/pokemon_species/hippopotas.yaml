    x:
      ja-Hrkt: |-
        かんそうした　とちで　くらす。
        あせの　かわりに　すなつぶを
        からだから　ぶんぴつする　ポケモン。
      ja: |-
        乾燥した　土地で　暮らす。
        汗の　かわりに　砂粒を
        体から　分泌する　ポケモン。
      ko: |-
        건조한 땅에서 산다.
        땀 대신 모래알을
        몸에서 분비하는 포켓몬이다.
      en: |-
        It lives in arid places. Instead of perspiration,
        it expels grainy sand from its body.
      fr: |-
        Il vit dans des endroits arides. Il exsude du sable
        granuleux au lieu de transpirer.
      de: |-
        Es lebt in ausgetrockneten Gebieten. Statt zu
        schwitzen, sondert sein Körper Sand ab.
      es: |-
        Vive en zonas áridas. En lugar de sudar, su cuerpo
        expulsa granos de arena.
      it: |-
        Vive in territori aridi. Invece del sudore, espelle
        dal corpo sabbia granulosa.
    'y':
      ja-Hrkt: |-
        ぜんしんに　すなを　まとうことで
        ばいきんから　からだを　まもる。
        みずに　ぬれることが　にがて。
      ja: |-
        全身に　砂を　まとうことで
        ばい菌から　体を　守る。
        水に　ぬれることが　苦手。
      ko: |-
        전신에 모래를 둘러서
        세균으로부터 몸을 보호한다.
        물에 젖는 것을 싫어한다.
      en: |-
        It enshrouds itself with sand to protect itself from
        germs. It does not enjoy getting wet.
      fr: |-
        Il se recouvre de sable pour se protéger des
        microbes. Il n’aime pas l’eau.
      de: |-
        Es bedeckt sich mit Sand, um sich vor Keimen
        zu schützen. Es mag es gar nicht, wenn es nass wird.
      es: |-
        Se embadurna de arena para protegerse de los
        gérmenes. No le gusta mojarse.
      it: |-
        Si ricopre di sabbia per proteggersi dai germi.
        Non ama bagnarsi.
    omega-ruby:
      ja-Hrkt: |-
        かんそうした　とちで　くらす。
        あせの　かわりに　すなつぶを
        からだから　ぶんぴつする　ポケモン。
      ja: |-
