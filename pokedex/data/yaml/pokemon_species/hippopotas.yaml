      es: |-
        Vive en zonas áridas. En lugar de sudar, su cuerpo expulsa
        granos de arena.
      it: |-
        Vive in territori aridi. Invece del sudore, espelle dal corpo
        sabbia granulosa.
    alpha-sapphire:
      ja-Hrkt: |-
        ぜんしんに　すなを　まとうことで
        ばいきんから　からだを　まもる。
        みずに　ぬれることが　にがて。
      ja: |-
        全身に　砂を　まとうことで
        ばい菌から　体を　守る。
        水に　ぬれることが　苦手。
      ko: |-
        전신에 모래를 둘러서
        세균으로부터 몸을 보호한다.
        물에 젖는 것을 싫어한다.
      en: |-
        It enshrouds itself with sand to protect itself from
        germs. It does not enjoy getting wet.
      fr: |-
        Il se recouvre de sable pour se protéger des microbes.
        Il n’aime pas l’eau.
      de: |-
        Es bedeckt sich mit Sand, um sich vor Keimen zu schützen.
        Es mag es gar nicht, wenn es nass wird.
      es: |-
        Se embadurna de arena para protegerse de los gérmenes.
        No le gusta mojarse.
      it: |-
        Si ricopre di sabbia per proteggersi dai germi.
        Non ama bagnarsi.
    sword:
      ja-Hrkt: |-
        くちを　あけて　いどうしながら
        すなごと　えものを　まるのみ。
        すなは　はなから　ふきだし　すてる。
      ja: |-
        口を　開けて　移動しながら
        砂ごと　獲物を　丸飲み。
        砂は　鼻から　噴き出し　捨てる。
      ko: |-
        입을 벌리고 이동하면서
        모래째로 먹이를 꿀꺽 삼킨다.
        모래는 코로 뿜어내서 버린다.
      zh-Hant: |-
        張大嘴巴移動，連同沙子
        把對手一整個吞下去。
        會從鼻孔把沙子噴出來丟掉。
      zh-Hans: |-
        张大嘴巴移动，连同沙子
        把对手一整个吞下去。
        会从鼻孔把沙子喷出来丢掉。
      en: |-
        It moves through the sands with its mouth open,
        swallowing sand along with its prey. It gets rid of
        the sand by spouting it from its nose.
      fr: |-
        Il attrape ses proies en se déplaçant la gueule
        ouverte. Il éjecte ensuite le sable qu’il a avalé
        au passage en l’expulsant par le nez.
      de: |-
        Es bewegt sich mit geöffnetem Maul und
        verschluckt seine Beute mit jeder Menge Sand,
        den es durch seine Nasenlöcher wieder ausstößt.
      es: |-
        Se desplaza con la boca abierta engullendo tanto
        presas como arena por igual. Luego, expulsa la
        arenilla por la nariz.
      it: |-
        Si sposta con la bocca aperta inghiottendo
        contemporaneamente sabbia e prede. Poi si
        libera della sabbia soffiandola fuori dal naso.
    shield:
      ja-Hrkt: |-
        おもに　ひるまに　かつどうする。
        さばくのよは　ひえるので　すなの
        おくふかくに　もぐって　ねむる。
      ja: |-
        おもに　昼間に　活動する。
        砂漠の夜は　冷えるので　砂の
        奥深くに　潜って　眠る。
      ko: |-
        주로 낮에 활동한다.
        사막의 밤은 기온이 낮아져
        모래 깊숙이 들어가 잠을 잔다.
      zh-Hant: |-
        主要在白天活動。
        因為沙漠的夜晚會降溫，
        所以會鑽進沙子的深處睡覺。
      zh-Hans: |-
        主要在白天活动。
        因为沙漠的夜晚会降温，
        所以会钻到沙子的深处睡觉。
      en: |-
        This Pokémon is active during the day and passes
        the cold desert nights burrowed snugly into
        the sand.
      fr: |-
        Il est principalement actif pendant la journée.
        Il s’enfouit profondément dans le sable pour
        dormir, car les nuits désertiques sont très froides.
      de: |-
        Es ist hauptsächlich tagsüber aktiv. Die Nächte in
        der Wüste sind kalt, deswegen vergräbt es sich
        zum Schlafen tief im Sand.
      es: |-
        Este Pokémon de hábitos diurnos se entierra en
        la arena para dormir cuando la temperatura en
        el desierto se desploma al caer la noche.
      it: |-
        È attivo principalmente di giorno. Dato che nel
        deserto la temperatura notturna è molto bassa,
        scava profonde buche nella sabbia per dormire.
    legends-arceus:
      en: |-
        Though large and languid, Hippopotas is difficult to detect
        due to its tendency to burrow into and lurk beneath the soil.
        When agitated or excited, it expels sand from its nostrils.
