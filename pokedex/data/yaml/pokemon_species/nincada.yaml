        its surroundings using antennae
        instead of its virtually blind eyes.
    white-2:
      en: |-
        It grows underground, sensing
        its surroundings using antennae
        instead of its virtually blind eyes.
    x:
      ja-Hrkt: |-
        ながい　あいだ　ちちゅうで　くらして
        いたため　めは　ほとんど　みえない。
        しょっかくで　ようすを　さぐる。
      ja: |-
        長い　あいだ　地中で　暮らして
        いたため　目は　ほとんど　見えない。
        触覚で　様子を　探る。
      ko: |-
        긴 시간 동안 땅속에서 살고
        있었기 때문에 눈은 거의 보이지 않는다.
        더듬이로 주변 상황을 살핀다.
      en: |-
        Because it lived almost entirely underground, it is
        nearly blind. It uses its antennae instead.
      fr: |-
        Comme il vit presque toujours sous terre, sa vue est
        très peu développée et il est presque aveugle.
        Il utilise ses antennes pour se repérer.
      de: |-
        Da es fast sein gesamtes Leben unter der Erde
        verbracht hat, ist es nahezu blind. Es setzt daher
        als Augenersatz seine Fühler ein.
      es: |-
        Como se ha pasado casi toda la vida viviendo bajo
        tierra, no ve bien. Las antenas que tiene le ayudan
        a orientarse.
      it: |-
        Poiché passa quasi tutta l’esistenza sottoterra, è
        quasi cieco. Usa le antenne per orientarsi.
    'y':
      ja-Hrkt: |-
        １０ねん　いじょう　つちの　なかで
        くらす　ことも　ある。じゅもくの
        ねっこから　えいようを　すいとる。
      ja: |-
        １０年以上　土の　中で
        暮らす　ことも　ある。樹木の
        根っこから　栄養を　吸い取る。
      ko: |-
        10년 이상 땅속에서
        지내는 경우도 있다. 수목의
        뿌리에서 영양을 흡수한다.
      en: |-
        It can sometimes live underground for more than
        10 years. It absorbs nutrients from the roots
        of trees.
      fr: |-
        Il peut passer jusqu’à dix ans sous terre. Les racines
        des arbres constituent son régime alimentaire.
      de: |-
        Manches Nincada lebt bis zu zehn Jahre unter der Erde
        und saugt Nährstoffe aus Baumwurzeln.
      es: |-
        Algunos pasan más de diez años bajo tierra.
        Absorbe nutrientes de las raíces de los árboles.
      it: |-
        Gli capita di restare anche più di dieci anni sottoterra.
        Si nutre delle radici di enormi alberi.
    omega-ruby:
      ja-Hrkt: |-
        なんねんも　まっくらな　つちの　なかで　くらす。
        きの　ねっこから　えいようを　きゅうしゅうして
        じっと　うごかず　しんかの　ときを　まっている。
      ja: |-
        何年も　真っ暗な　土の　中で　暮らす。
        木の　根っこから　栄養を　吸収して
        じっと　動かず　進化の　ときを　待っている。
      ko: |-
        몇 년을 캄캄한 땅속에서 산다.
        나무의 뿌리에서 영양을 흡수하며 가만히
        움직이지 않고 진화의 때를 기다리고 있다.
      en: |-
        Nincada lives underground for many years in complete
        darkness. This Pokémon absorbs nutrients from the roots of
        trees. It stays motionless as it waits for evolution.
      fr: |-
        Ningale vit depuis des années sous terre, dans l’obscurité
        la plus totale. Ce Pokémon absorbe les nutriments des racines
        des arbres. Il reste immobile, attendant patiemment
        son évolution.
      de: |-
        Nincada lebt viele Jahre in absoluter Dunkelheit unter der
        Erde. Dieses Pokémon nimmt Nährstoffe aus Baumwurzeln
        auf. Es rührt sich nicht, da es auf seine Entwicklung wartet.
      es: |-
        Nincada vive bajo tierra en la más absoluta oscuridad durante
        años. Este Pokémon absorbe nutrientes de las raíces de los
        árboles y permanece inmóvil a la espera de su evolución.
      it: |-
        Nincada vive sottoterra per molti anni nell’oscurità più
        assoluta. Questo Pokémon assume le sostanze nutritive
        dalle radici degli alberi. Rimane immobile in attesa
        dell’evoluzione.
    alpha-sapphire:
      ja-Hrkt: |-
        するどい　ツメで　じゅもくの　ねっこを　けずり
        すいぶんや　えいようを　きゅうしゅうする。
        たいようの　ひかりは　まぶしいので　にがて。
      ja: |-
        鋭い　ツメで　樹木の　根っこを　削り
        水分や　栄養を　吸収する。
        太陽の　光は　まぶしいので　苦手。
      ko: |-
        날카로운 발톱으로 나무뿌리를 깎아내어
        수분이나 영양을 흡수한다.
        태양의 빛은 눈이 부셔서 싫어한다.
      en: |-
        Nincada lives underground. It uses its sharp claws to carve the
        roots of trees and absorb moisture and nutrients.
        This Pokémon can’t withstand bright sunlight so avoids it.
      fr: |-
        Ningale vit sous terre. Il utilise ses griffes acérées pour
        creuser les racines des arbres et en absorber l’humidité
        et les nutriments. Ce Pokémon ne supporte pas la lumière
        du soleil.
      de: |-
        Nincada lebt unter der Erde. Es benutzt seine scharfen
        Krallen, um die Wurzeln von Bäumen freizulegen und an
        Flüssigkeit und Nährstoffe zu kommen. Dieses Pokémon
        kann grelles Sonnenlicht nicht aushalten und meidet es.
      es: |-
        Nincada vive bajo tierra y usa las garras afiladas que tiene
        para escarbar y buscar raíces de árboles y absorber humedad
        y nutrientes. Este Pokémon huye de la luz del sol porque le
        hace daño.
      it: |-
        Nincada vive sottoterra. Usa i suoi artigli affilati per incidere
        le radici degli alberi e assorbirne l’acqua e altre sostanze
        nutritive. Il Pokémon non sopporta la luce del sole, quindi
        cerca di evitarla.
    sword:
      ja-Hrkt: |-
        ながい　あいだ　ちちゅうで　くらして
        いたため　めは　ほとんど　みえない。
        しょっかくで　ようすを　さぐる。
      ja: |-
        長い　あいだ　地中で　暮らして
        いたため　目は　ほとんど　見えない。
        触角で　様子を　探る。
      ko: |-
        긴 시간 동안 땅속에서 살았기 때문에
        눈이 거의 보이지 않는다.
        더듬이로 주변 상황을 살핀다.
      zh-Hant: |-
        因為長時間生活在地底下，
        所以眼睛幾乎什麼都看不到。
        會靠觸角來探察周圍的狀況。
      zh-Hans: |-
        因为长时间生活在地下，
        所以眼睛几乎什么都看不到。
        会靠触角来探察周围的情况。
      en: |-
        Because it lived almost entirely underground,
        it is nearly blind. It uses its antennae instead.
      fr: |-
        Parce qu’il a longtemps vécu sous terre,
        il est presque aveugle et utilise ses antennes
        pour se repérer.
      de: |-
        Da es fast sein gesamtes Leben unter der Erde
        verbracht hat, ist es nahezu blind. Es setzt daher
        als Augenersatz seine Fühler ein.
      es: |-
        Vivir bajo tierra durante tanto tiempo lo ha
        dejado prácticamente ciego. Las antenas que
        tiene le ayudan a orientarse.
      it: |-
        Poiché passa quasi tutta l’esistenza sottoterra,
        è quasi cieco. Usa le antenne per sondare ciò
        che lo circonda.
    shield:
      ja-Hrkt: |-
        １０ねん　いじょう　つちの　なかで
        くらす　ことも　ある。　じゅもくの
        ねっこから　えいようを　すいとる。
      ja: |-
        １０年以上　土の　中で
        暮らす　ことも　ある。　樹木の
        根っこから　栄養を　吸い取る。
      ko: |-
        10년 이상 땅속에서
        지내는 경우도 있다. 수목의
        뿌리에서 영양을 흡수한다.
      zh-Hant: |-
        有時會在土裡生活
        １０年以上。會從樹木
        的根部吸取營養。
      zh-Hans: |-
        有时能在土里生活１０年以上。
        会从树木的根部那里吸取营养。
      en: |-
        It can sometimes live underground for more than
        10 years. It absorbs nutrients from the roots
        of trees.
      fr: |-
        Il peut passer plus de dix ans sous terre.
        Les racines des arbres constituent son régime
        alimentaire.
      de: |-
        Manche Nincada leben mehr als zehn Jahre unter
        der Erde und saugen Nährstoffe aus den Wurzeln
        von Bäumen.
      es: |-
        Pueden pasar más de diez años bajo tierra.
        Absorben nutrientes de las raíces de los árboles.
      it: |-
        Gli capita di restare anche più di dieci anni
        sottoterra. Assorbe le sostanze nutritive
        dalle radici degli alberi.
