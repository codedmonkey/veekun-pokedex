tropius:
  base_happiness: 70
  capture_rate: 200
  color: green
  egg_groups:
    - monster
    - plant
  evolution_chain: tropius
  evolves_from: ~
  flavor_text:
    ruby:
      en: |-
        The bunches of fruit around TROPIUS’s
        neck are very popular with children.
        This POKéMON loves fruit, and eats itcontinuously. Apparently, its love for
        fruit resulted in its own outgrowth
        of fruit.
    sapphire:
      en: |-
        Children of the southern tropics eat
        as snacks the fruit that grows in
        bunches around the neck of TROPIUS.This POKéMON flies by flapping the
        leaves on its back as if they were
        wings.
    emerald:
      en: |-
        It flies by flapping its broad leaves.
        The bunch of fruit that grows around its
        neck is deliciously sweet. In the spring,
        it scatters pollen from its neck.
    firered:
      en: |-
        It lives in tropical jungles. The bunch of
        fruit around its neck is delicious.
        The fruit grows twice a year.
    leafgreen:
      en: |-
        It lives in tropical jungles. The bunch of
        fruit around its neck is delicious.
        The fruit grows twice a year.
    diamond:
      en: |-
        Because it continually ate only
        its favorite fruit, the fruit
        started growing around its neck.
    pearl:
      en: |-
        Because it continually ate only
        its favorite fruit, the fruit
        started growing around its neck.
    platinum:
      en: |-
        Delicious fruits grew out from
        around its neck because it always
        ate the same kind of fruit.
    heartgold:
      en: |-
        The bunch of fruit around its neck
        ripens twice a year and is delicious.
        It’s a highly favored tropical snack.
    soulsilver:
      en: |-
        The bunch of fruit around its neck
        ripens twice a year and is delicious.
        It’s a highly favored tropical snack.
    black:
      en: |-
        Delicious fruits grew out from
        around its neck because it always
        ate the same kind of fruit.
      fr: |-
        À force de toujours manger le même
        fruit succulent, il en pousse à la
        base de son cou.
    white:
      en: |-
        Delicious fruits grew out from
        around its neck because it always
        ate the same kind of fruit.
      fr: |-
        À force de toujours manger le même
        fruit succulent, il en pousse à la
        base de son cou.
    black-2:
      en: |-
        It flies by flapping its broad leaves
        and gives the sweet, delicious
        fruit around its neck to children.
    white-2:
      en: |-
        It flies by flapping its broad leaves
        and gives the sweet, delicious
        fruit around its neck to children.
    x:
      ja-Hrkt: |-
        おおきな　はっぱで　そらをとんで
        こどもたちに　だいにんきの　くびに
        できる　あまい　くだものを　くばる。
      ja: |-
        大きな　葉っぱで　空を飛んで
        子供たちに　大人気の　首に
        できる　甘い　くだものを　配る。
      ko: |-
        커다란 잎으로 하늘을 날며
        아이들에게 인기가 많은 목에
        생기는 달콤한 과일을 나눠준다.
      en: |-
        It flies by flapping its broad leaves and gives
        the sweet, delicious fruit around its neck
        to children.
      fr: |-
        Ses grandes feuilles lui servent à voler.
        Il distribue les fruits qui pendent à son cou aux
        enfants, qui s’en régalent.
      de: |-
        Es nutzt seine großen Blätter als Flügel und verteilt die
        süßen Früchte, die an seinem Hals wachsen, an Kinder.
      es: |-
        Puede volar al agitar sus grandes hojas. Reparte entre
        los niños la codiciada fruta dulce que crece de su
        cuello.
      it: |-
        Vola sbattendo delle grandi ali a forma di foglia
        e distribuisce ai bambini i deliziosi frutti che gli
        crescono sul collo.
    'y':
      ja-Hrkt: |-
        くびの　フサは　１ねんに　２かい
        みを　つける。あまくて　おいしい。
        なんごくの　こどもの　おやつだ。
      ja: |-
        首の　房は　１年に　２回
        実を　つける。甘くて　おいしい。
        南国の　子供の　おやつだ。
      ko: |-
        목의 송이는 1년에 2번
        열매를 맺는다. 달고 맛있다.
        남쪽에 사는 아이들의 간식이다.
      en: |-
        The bunch of fruit around its neck ripens twice a
        year and is delicious. It’s a highly favored
        tropical snack.
      fr: |-
        Les succulents fruits de son cou poussent deux fois
        l’an et font le régal des enfants des tropiques.
      de: |-
        Sein Hals trägt zweimal im Jahr süße Früchte.
        Kinder in den südlichen Tropen naschen oft davon.
      es: |-
        Los racimos de su cuello dan fruto cada seis meses. A
        los niños de zonas tropicales les encanta su dulzor.
      it: |-
        Due volte l’anno il suo collare produce dei frutti dolci
        e squisiti, molto amati dai bambini dei tropici.
    omega-ruby:
      ja-Hrkt: |-
        くびの　フサは　あまくて　こどもに　だいにんき。
        くだものが　だいこうぶつで　たべつづけて　いたら
        くびに　くだものが　できるように　なったらしい。
      ja: |-
        首の　フサは　甘くて　子どもに　大人気。
        果物が　大好物で　食べ続けて　いたら
        首に　果物が　できるように　なったらしい。
      ko: |-
        목에 난 송이는 달콤해서 아이들에게 인기가 많다.
        과일을 매우 좋아하여 계속 먹다 보니
        목에 과일이 열리게 됐다고 한다.
      en: |-
        The bunches of fruit around Tropius’s neck are very popular
        with children. This Pokémon loves fruit, and eats it
        continuously. Apparently, its love for fruit resulted in its own
        outgrowth of fruit.
      fr: |-
        Les enfants adorent les fruits autour du cou de Tropius.
        Apparemment, son penchant pour les fruits l’a conduit
        à en faire pousser sur son propre corps. Il les aime tant
        qu’il en mange sans arrêt.
      de: |-
        Die Früchte am Hals von Tropius sind bei Kindern sehr
        beliebt. Dieses Pokémon liebt Früchte und isst sie ständig.
        Offensichtlich sind ihm wegen dieser Vorliebe selbst Früchte
        gewachsen.
      es: |-
        A los niños les encantan los racimos de fruta que Tropius tiene
        en el cuello. Este Pokémon siempre come fruta; le encanta.
        De hecho, ese parece ser el motivo por el que él mismo da
        fruta.
      it: |-
        Tutti i bambini conoscono i grappoli di frutti penzolanti attorno
        al collo di Tropius. Anche il Pokémon stesso ne mangia
        in continuazione. Pare che il suo amore per la frutta sia
        all’origine del fatto che egli stesso la produca.
    alpha-sapphire:
      ja-Hrkt: |-
        なんごくの　こどもたちは　トロピウスの　くびに
        なった　くだものの　フサを　おやつに　たべるよ。
        せなかの　はっぱを　はばたかせて　そらを　とぶ。
      ja: |-
        南国の　子どもたちは　トロピウスの　首に
        なった　果物の　フサを　おやつに　食べるよ。
        背中の　葉っぱを　羽ばたかせて　空を　飛ぶ。
      ko: |-
        남쪽 나라의 아이들은 트로피우스의 목에
        난 과일 송이를 간식으로 먹는다.
        등의 잎사귀를 펄럭거려 하늘을 난다.
      en: |-
        Children of the southern tropics eat as snacks the fruit that
        grows in bunches around the neck of Tropius. This Pokémon
        flies by flapping the leaves on its back as if they were wings.
      fr: |-
        Les enfants des tropiques mangent les fruits qui poussent
        autour du cou de Tropius pour leur goûter. Ce Pokémon
        peut voler en agitant les feuilles situées sur son dos,
        comme s’il s’agissait d’ailes.
      de: |-
        Kinder aus den südlichen Tropen essen die Früchte,
        die am Hals von Tropius hängen, als Zwischenmahlzeit.
        Dieses Pokémon kann fliegen, indem es mit den Blättern
        auf seinem Rücken schlägt, als ob es Flügel wären.
      es: |-
        Los niños de la zona sur de los trópicos se comen los racimos
        de fruta que le crecen a Tropius alrededor del cuello. Este
        Pokémon vuela batiendo las hojas que tiene en el lomo como
        si fueran alas.
      it: |-
        I bambini dei tropici meridionali fanno merenda coi frutti che
        crescono a grappoli attorno al collo di Tropius. Questo
        Pokémon vola agitando le foglie sulla schiena come
        se fossero ali.
    ultra-sun:
      ja-Hrkt: |-
        アローラにすむ　トロピウスの　くびに
        みのる　フサは　ほかの　ちほうより
        かくべつに　あまくて　もうさいこう。
      ja: |-
        アローラに棲む　トロピウスの　首に
        実る　フサは　他の　地方より
        格別に　甘くて　もう最高。
      ko: |-
        알로라에 사는 트로피우스는
        다른 지방에 비해 목에 열리는
        송이가 특히 달콤하고 맛있다.
      zh-Hant: |-
        棲息在阿羅拉的熱帶龍
        脖子上的果實比其他地區的更甜，
        簡直美味到了極點。
      zh-Hans: |-
        栖息在阿罗拉的热带龙
        脖子里结的那串水果比其他地区的
        甜得多，是最最棒的。
      en: |-
        The bunches of fruit growing around the necks
        of Tropius in Alola are especially sweet
        compared to those in other regions.
      fr: |-
        Les fruits qui poussent sur le cou des Tropius
        d’Alola sont si doux qu’ils surclassent ceux
        des autres régions.
      de: |-
        Die Früchte, die am Hals der in Alola lebenden
        Tropius hängen, sind die besten, denn sie sind
        süßer als die in anderen Regionen.
      es: |-
        Los frutos que crecen en el cuello del Tropius de
        la región de Alola son mucho más dulces y ricos
        que los de otros lugares.
      it: |-
        I grappoli di frutti che crescono attorno al collo
        dei Tropius che vivono ad Alola sono più dolci e
        prelibati di quelli degli esemplari di altre regioni.
    ultra-moon:
      ja-Hrkt: |-
        くびの　フサが　おいしくて　にんき。
        あたたかい　とちには　トロピウスを
        そだてる　ぼくじょうが　たくさん。
      ja: |-
        首の　フサが　美味しくて　人気。
        暖かい　土地には　トロピウスを
        育てる　牧場が　たくさん。
      ko: |-
        목에 난 송이는 맛있어서 인기다.
        따뜻한 장소에는 트로피우스를
        키우는 목장이 많다.
      zh-Hant: |-
        脖子上的美味水果很受歡迎。
        在溫暖的地區有很多
        養殖熱帶龍的牧場。
      zh-Hans: |-
        脖子上的那串水果很美味，
        很受欢迎。在温暖的地方，
        有许多培育热带龙的牧场。
      en: |-
        Bunches of delicious fruit grow around its neck.
        In warm areas, many ranches raise Tropius.
      fr: |-
        Dans les régions où il fait chaud, on trouve des
        fermes dédiées à l’élevage de ce Pokémon, très
        apprécié pour les fruits poussant sur son cou.
      de: |-
        Die leckeren Früchte an seinem Hals sind sehr
        beliebt. In warmen Gebieten gibt es viele
        Farmen, auf denen Tropius gezüchtet werden.
      es: |-
        A la gente le encanta la deliciosa fruta de sus
        racimos. En las regiones cálidas abundan las
        granjas que se dedican a criar Tropius.
      it: |-
        Molti amano i grappoli di frutti che crescono
        attorno al collo di Tropius. Nelle regioni calde,
        diversi pascoli sono riservati a questo Pokémon.
