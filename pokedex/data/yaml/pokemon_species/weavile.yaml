weavile:
  base_happiness: 35
  capture_rate: 45
  color: black
  egg_groups:
    - ground
  evolution_chain: sneasel
  evolves_from: sneasel
  flavor_text:
    diamond:
      en: |-
        They live in cold regions, forming
        groups of four or five that hunt
        prey with impressive coordination.
    pearl:
      en: |-
        It sends signals to others by
        carving odd patterns in frost-
        covered trees and ice.
    platinum:
      en: |-
        Evolution made it even more
        devious. It communicates by clawing
        signs in boulders.
    heartgold:
      en: |-
        It lives in snowy regions. It carves
        patterns in trees with its claws as
        a signal to others.
    soulsilver:
      en: |-
        It lives in snowy regions. It carves
        patterns in trees with its claws as
        a signal to others.
    black:
      en: |-
        Evolution made it even more
        devious. It communicates by clawing
        signs in boulders.
      fr: |-
        L’évolution l’a rendu encore plus
        retors. Il communique en griffant
        des signes dans les pierres.
    white:
      en: |-
        Evolution made it even more
        devious. It communicates by clawing
        signs in boulders.
      fr: |-
        L’évolution l’a rendu encore plus
        retors. Il communique en griffant
        des signes dans les pierres.
    black-2:
      en: |-
        They communicate by clawing
        signs in boulders and work
        together to surround enemies.
    white-2:
      en: |-
        They communicate by clawing
        signs in boulders and work
        together to surround enemies.
    x:
      ja-Hrkt: |-
        ゆきの　おおい　ちほうに　せいそく。
        じゅもくに　ツメで　サインを　えがき
        なかまに　あいずを　おくる。
      ja: |-
        雪の　多い　地方に　生息。
        樹木に　ツメで　サインを　描き
        仲間に　合図を　送る。
      ko: |-
        눈이 많은 지방에 서식한다.
        수목에 발톱으로 사인을 그려
        동료에게 신호를 보낸다.
      en: |-
        It lives in snowy regions. It carves patterns in trees
        with its claws as a signal to others.
      fr: |-
        Il vit dans les régions enneigées, et communique avec
        ses pairs en gravant des motifs sur les arbres.
      de: |-
        Es lebt in schneereichen Gebieten. Snibunna senden
        einander Signale, indem sie Zeichen in Rinde ritzen.
      es: |-
        Vive en zonas nevadas. Deja marcas en los árboles
        con sus garras para comunicarse con sus compañeros.
      it: |-
        Il suo habitat sono le grandi aree innevate. Con gli
        artigli, incide sui tronchi segnali per i suoi simili.
    'y':
      ja-Hrkt: |-
        さむい　ちいきで　くらす　ポケモン。
        ４、５ひきの　グループは　みごとな
        れんけいで　えものを　おいつめる。
      ja: |-
        寒い　地域で　暮らす　ポケモン。
        ４、５匹の　グループは　見事な
        連係で　獲物を　追いつめる。
      ko: |-
        추운 지역에서 사는 포켓몬이다.
        4, 5마리의 그룹은 훌륭한
        연계 작전으로 먹이를 몰아넣는다.
      en: |-
        They live in cold regions, forming groups of four or
        five that hunt prey with impressive coordination.
      fr: |-
        Ils vivent par groupe de 4 ou 5 en région froide et
        chassent de façon très organisée.
      de: |-
        Es lebt in kalten Gebieten in Gruppen von
        vier oder fünf Pokémon, die bei der Jagd
        großes Geschick zeigen.
      es: |-
        Viven en zonas frías y forman grupos de cuatro o
        cinco para cazar con gran coordinación.
      it: |-
        Questi Pokémon vivono in zone fredde in gruppi di
        quattro o cinque. Insieme sono cacciatori abilissimi.
    omega-ruby:
      ja-Hrkt: |-
        ゆきの　おおい　ちほうに　せいそく。
        じゅもくに　ツメで　サインを　えがき
        なかまに　あいずを　おくる。
      ja: |-
        雪の　多い　地方に　生息。
        樹木に　ツメで　サインを　描き
        仲間に　合図を　送る。
      ko: |-
        눈이 많은 지방에 서식한다.
        수목에 발톱으로 사인을 그려
        동료에게 신호를 보낸다.
      en: |-
        It lives in snowy regions. It carves patterns in trees
        with its claws as a signal to others.
      fr: |-
        Il vit dans les régions enneigées, et communique avec
        ses pairs en gravant des motifs sur les arbres.
      de: |-
        Es lebt in schneereichen Gebieten. Snibunna senden einander
        Signale, indem sie Zeichen in Rinde ritzen.
      es: |-
        Vive en zonas nevadas. Deja marcas en los árboles con sus
        garras para comunicarse con sus compañeros.
      it: |-
        Il suo habitat sono le grandi aree innevate. Con gli artigli,
        incide sui tronchi segnali per i suoi simili.
    alpha-sapphire:
      ja-Hrkt: |-
        さむい　ちいきで　くらす　ポケモン。
        ４、５ひきの　グループは　みごとな
        れんけいで　えものを　おいつめる。
      ja: |-
        寒い　地域で　暮らす　ポケモン。
        ４、５匹の　グループは　見事な
        連係で　獲物を　追いつめる。
      ko: |-
        추운 지역에서 사는 포켓몬이다.
        4, 5마리의 그룹은 훌륭한
        연계 작전으로 먹이를 몰아넣는다.
      en: |-
        They live in cold regions, forming groups of four or
        five that hunt prey with impressive coordination.
      fr: |-
        Ils vivent par groupe de quatre ou cinq en région froide et
        chassent de façon très organisée.
      de: |-
        Es lebt in kalten Gebieten in Gruppen von vier oder
        fünf Pokémon, die bei der Jagd großes Geschick zeigen.
      es: |-
        Viven en zonas frías y forman grupos de cuatro o cinco para
        cazar con gran coordinación.
      it: |-
        Questi Pokémon vivono in zone fredde in gruppi di quattro
        o cinque. Insieme sono cacciatori abilissimi.
    sun:
      ja-Hrkt: |-
        ４～５ひきの　グループで　こうどう。
        いわや　じゅもくに　サインを　のこし
        れんけいプレイで　えものを　しとめる。
      ja: |-
        ４～５匹の　グループで　行動。
        岩や　樹木に　サインを　残し
        連係プレイで　獲物を　仕留める。
      ko: |-
        4~5마리의 그룹으로 행동한다.
        바위나 나무에 표시를 남겨
        연계 플레이로 먹이를 잡는다.
      zh-Hant: |-
        ４～５隻一組行動。
        在岩石和樹木上留下記號，
        以團隊合作捕殺獵物。
      zh-Hans: |-
        ４～５只一组进行行动。
        在岩石和树木上留下记号，
        以团队合作捕杀猎物。
      en: |-
        They travel in groups of four or five, leaving
        signs for one another on trees and rocks. They
        bring down their prey with coordinated attacks.
      fr: |-
        Il se déplace en groupe de quatre ou cinq. Lors
        de la chasse, il laisse des signes sur les arbres
        ou les rochers pour communiquer efficacement.
      de: |-
        Sie sind immer zu viert oder fünft unterwegs.
        Bei der Jagd arbeiten sie zusammen, indem
        sie Zeichen in Felsen und Bäume ritzen.
      es: |-
        Siempre van en grupos de cuatro o cinco. Dejan
        marcas en rocas y árboles al cazar para
        coordinarse con sus compañeros.
      it: |-
        Si muove in gruppi di quattro o cinque individui.
        Durante la caccia, si coordina con i compagni
        lasciando dei segni sulle rocce e sugli alberi.
    moon:
      ja-Hrkt: |-
        さむい　ばしょに　すみ　アローラでは
        ロコンや　サンドが　おもな　エサ。
        えものは　なかまで　きちんと　わける。
      ja: |-
        寒い　場所に　棲み　アローラでは
        ロコンや　サンドが　主な　餌。
        獲物は　仲間で　きちんと　分ける。
      ko: |-
        추운 장소에 살며 알로라에서는
        식스테일과 모래두지가 주된 먹이다.
        사냥감은 동료끼리 정확히 나눈다.
      zh-Hant: |-
        生活在寒冷的地方，
        在阿羅拉以六尾和穿山鼠為主食。
        捕獲的獵物會和同伴們公平地分享。
      zh-Hans: |-
        生活在寒冷的地方，
        在阿罗拉以六尾和穿山鼠为主要食物。
        伙伴之间会认真地分配猎物。
      en: |-
        They dwell in cold places. This Pokémon’s main
        food source in Alola is Vulpix and Sandshrew,
        which they carefully divide among their group.
      fr: |-
        Habitant des régions enneigées, il ne se nourrit
        que de Goupix et de Sabelette à Alola. Il partage
        toujours ses proies avec ses amis.
      de: |-
        Sie leben in kalten Gebieten und ernähren sich
        in Alola hauptsächlich von Vulpix und Sandan.
        Ihre Beute teilen sie gerecht untereinander auf.
      es: |-
        Habita en lugares fríos. En Alola se alimenta
        principalmente de Vulpix y Sandshrew, presas
        que reparte entre sus congéneres.
      it: |-
        È un Pokémon che vive nelle zone fredde.
        Ad Alola caccia i Vulpix e i Sandshrew,
        dividendo le prede con i suoi compagni.
    ultra-sun:
      ja-Hrkt: |-
        １ぴきが　サンドの　あしを　すくい
        ひっくりかえすと　もう　１ぴきが
        するどいツメで　とどめを　さす。
      ja: |-
        １匹が　サンドの　足を　すくい
        ひっくり返すと　もう　１匹が
        鋭いツメで　止めを　刺す。
      ko: |-
        1마리가 모래두지에게 다리를 걸어
        뒤집으면 다른 1마리가
        날카로운 발톱으로 처리한다.
      zh-Hant: |-
        一隻負責絆住穿山鼠的腳，
        讓牠翻過來。另一隻則用
        銳利的爪子給予致命一擊。
      zh-Hans: |-
        １只负责绊住穿山鼠的脚，
        将其翻过来后，另１只用
        锐利的爪子给予致命一击。
      en: |-
        One Weavile will trip a Sandshrew and flip it
        over, and then another Weavile will deal the
        finishing blow with its sharp claws.
      fr: |-
        Il chasse les Sabelette en équipe : un Dimoret
        maintient la proie sur le dos, puis un deuxième
        l’achève d’un coup de griffe.
      de: |-
        Zieht es einem Sandan die Beine weg, gibt ein
        weiteres Snibunna der nun rücklings liegenden
        Beute mit seinen Krallen den Gnadenstoß.
      es: |-
        Trabaja en parejas. Uno pone la zancadilla a un
        Sandshrew y, cuando está boca arriba, el otro
        Weavile lo ataca con sus afiladas garras.
      it: |-
        Caccia in coppia: un Weavile fa cadere
        Sandshrew mandandolo a gambe all’aria mentre
        un altro dà il colpo di grazia con gli artigli affilati.
    ultra-moon:
      ja-Hrkt: |-
        かしこくなり　エサを　めぐっての
        ケンカは　おこらなくなった。　ツメで
        ひっかかれると　とうしょうになるぞ。
      ja: |-
        賢くなり　エサを　巡っての
        ケンカは　起こらなくなった。　ツメで
        ひっかかれると　凍傷になるぞ。
      ko: |-
        영리해져서 먹이를 두고
        싸우지 않게 되었다. 손톱으로
        할퀴어지면 동상에 걸린다.
      zh-Hant: |-
        變得比較聰明，
        不再為了爭奪食物而打架。
        要是被牠的爪子抓到就會凍傷。
      zh-Hans: |-
        变聪明了，
        不会因为食物的分配而打架。
        如果被它的爪子勾到就会冻伤。
      en: |-
        Thanks to its increased intelligence, scrapping
        over food is a thing of the past. A scratch from
        its claws will give you a case of frostbite!
      fr: |-
        Il est devenu assez sournois pour ne plus avoir
        à se battre pour ses proies. Quiconque entre
        en contact avec ses griffes souffrira de gelures.
      de: |-
        Es hat gelernt, sich mit Artgenossen nicht mehr
        um seine Beute zu streiten. Kratzer durch seine
        Klauen hinterlassen Frostbeulen.
      es: |-
        Se ha vuelto tan astuto que las disputas por las
        presas obtenidas son cosa del pasado. Quien se
        ve golpeado por sus garras sufre congelaciones.
      it: |-
        Si è fatto furbo e non ha più bisogno di lottare
        per il cibo. Il tocco dei suoi artigli provoca dei
        geloni.
    sword:
      ja-Hrkt: |-
        むれを　なし　えものを　おそう。
        チームプレーで　マンムーなどの
        おおものも　たやすく　しとめる。
      ja: |-
        群れを　成し　獲物を　襲う。
        チームプレーで　マンムーなどの
        大物も　たやすく　しとめる。
      ko: |-
        무리를 지어 먹이를 공격한다.
        팀플레이로 맘모꾸리 같은
        큰 상대도 손쉽게 처리한다.
      zh-Hant: |-
        成群結隊襲擊獵物。
        透過團隊合作，連象牙豬那樣
        強大的對手也能輕鬆解決。
      zh-Hans: |-
        成群结队袭击猎物。
        通过团队合作，连象牙猪那样
        强大的对手也能轻松解决。
      en: |-
        They attack their quarry in packs. Prey as large
        as Mamoswine easily fall to the teamwork of
        a group of Weavile.
      fr: |-
        Ils chassent en hordes. Grâce à leur bonne
        coordination, ils peuvent aisément venir à bout
        de grands Pokémon comme Mammochon.
      de: |-
        Sie jagen ihre Beute in Gruppen. Im Team
        erledigen sie selbst große Ziele wie Mamutel
        mit Leichtigkeit.
      es: |-
        Cazan en grupo, lo que les permite abatir con
        facilidad presas de gran tamaño, como los
        Mamoswine.
      it: |-
        Caccia in gruppo. Grazie al lavoro di squadra
        riesce ad avere la meglio anche su prede di
        grossa taglia come i Mamoswine.
    shield:
      ja-Hrkt: |-
        ツメで　サインを　えがき　なかまと
        れんらく。　サインの　しゅるいは
        ５００いじょう　あると　いう。
      ja: |-
        ツメで　サインを　描き　仲間と
        連絡。　サインの　種類は
        ５００以上　あると　いう。
      ko: |-
        발톱으로 사인을 그려
        동료와 연락한다. 사인의 종류는
        500가지가 넘는다고 한다.
      zh-Hant: |-
        透過用爪子留下記號
        來與夥伴聯絡。據說記號
        的種類有５００種以上。
      zh-Hans: |-
        通过用爪子留下记号
        来与伙伴联络。据说记号
        的种类有５００种以上。
      en: |-
        With its claws, it leaves behind signs for its
        friends to find. The number of distinct signs
        is said to be over 500.
      fr: |-
        Il communique avec ses semblables en gravant
        des motifs avec ses griffes. Il existerait près
        de 500 signes différents.
      de: |-
        Sie kommunizieren miteinander, indem sie
        Zeichen mit ihren Krallen hinterlassen. Es soll
        über 500 davon geben.
      es: |-
        Se comunican mediante marcas que tallan con
        sus garras. Se cree que tienen un repertorio de
        más de 500.
      it: |-
        Comunica con i suoi simili tramite i segni che
        traccia con le unghie. Si dice che esistano più
        di 500 segni diversi.
    legends-arceus:
      en: |-
        This species corners prey as a pack, under the guidance of
        a leader. Weavile displays increased cunning, leading me to
        speculate that its evolution caused further brain development.
