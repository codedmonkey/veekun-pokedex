emboar:
  base_happiness: 70
  capture_rate: 45
  color: red
  egg_groups:
    - ground
  evolution_chain: tepig
  evolves_from: pignite
  flavor_text:
    black:
      en: |-
        It can throw a fire punch by setting its
        fists on fire with its fiery chin. It cares
        deeply about its friends.
      fr: |-
        Il embrase ses poings avec les flammes
        sur son menton et cogne l’ennemi avec.
        C’est un Pokémon très solidaire.
    white:
      en: |-
        It has mastered fast and powerful
        fighting moves. It grows a beard of fire.
      fr: |-
        Il a une barbe enflammée.
        Il maîtrise des techniques de combat au
        corps à corps rapides et puissantes.
    black-2:
      en: |-
        A flaring beard of fire is proof
        that it is fired up. It is adept at
        using many different moves.
    white-2:
      en: |-
        A flaring beard of fire is proof
        that it is fired up. It is adept at
        using many different moves.
    x:
      ja-Hrkt: |-
        あごの　ほのおで　こぶしを　もやして
        ほのおの　パンチを　くりだす。
        とても　なかまおもいの　ポケモン。
      ja: |-
        アゴの　炎で　こぶしを　燃やして
        炎の　パンチを　繰り出す。
        とても　仲間思いの　ポケモン。
      ko: |-
        턱의 화염으로 주먹을 불태워
        불꽃펀치를 날린다.
        동료애가 깊은 포켓몬이다.
      en: |-
        It can throw a fire punch by setting its fists on fire
        with its fiery chin. It cares deeply about its friends.
      fr: |-
        Il embrase ses poings avec les flammes sur son
        menton et cogne l’ennemi avec. C’est un Pokémon
        très solidaire.
      de: |-
        Steckt mit dem Feuer um sein Kinn seine Fäuste
        in Brand und holt zu feurigen Fausthieben aus.
        Zeigt großen Teamgeist.
      es: |-
        Calienta sus puños con las llamas de su barbilla para
        propinar puñetazos ardientes. Es muy fiel a sus
        compañeros.
      it: |-
        Infiamma i pugni sulla barba ardente, poi sferra
        attacchi di fuoco sui nemici. Ha molta considerazione
        per i suoi simili.
    'y':
      ja-Hrkt: |-
        ほのおの　あごひげを　たくわえる。
        パワーと　スピードを　かねそなえた
        かくとうの　わざを　みにつけている。
      ja: |-
        炎の　あごひげを　たくわえている。
        パワーと　スピードを　兼ね備えた
        格闘の　技を　身につけている。
      ko: |-
        불꽃 턱수염을 기르고 있다.
        파워와 스피드를 겸비한
        격투 기술을 익히고 있다.
      en: |-
        It has mastered fast and powerful fighting moves.
        It grows a beard of fire.
      fr: |-
        Il a une barbe enflammée. Il maîtrise des techniques
        de combat au corps à corps rapides et puissantes.
      de: |-
        Es trägt einen Backenbart aus Feuer und beherrscht
        Kampftechniken, die ebenso wuchtig wie schnell sind.
      es: |-
        Posee una tupida barba fogosa. Es tanto rápido como
        poderoso, y su principal baza es la lucha cuerpo a
        cuerpo.
      it: |-
        La sua barba è avvolta dalle fiamme. Padroneggia
        mosse di lotta che combinano potenza e rapidità.
