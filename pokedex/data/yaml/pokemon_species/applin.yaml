applin:
  base_happiness: 50
  capture_rate: 255
  color: green
  egg_groups:
    - plant
    - dragon
  evolution_chain: applin
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        いっしょう　りんごの　なかで　くらし
        てんてきの　とりポケモンに　であうと
        りんごの　ふりをして　みをまもる。
      ja: |-
        一生　りんごの　中で　暮らし
        天敵の　鳥ポケモンに　出会うと
        りんごの　振りをして　身を守る。
      ko: |-
        평생을 사과 속에서 지내며
        천적인 새포켓몬과 마주치면
        사과인 척을 해서 몸을 지킨다.
      zh-Hant: |-
        終其一生都在蘋果裡度過。
        遇到天敵鳥寶可夢時，
        會裝成蘋果保護自己。
      zh-Hans: |-
        终其一生都在苹果里度过。
        遇到天敌鸟宝可梦时，
        会装成苹果保护自己。
      en: |-
        It spends its entire life inside an apple. It hides
        from its natural enemies, bird Pokémon, by
        pretending it’s just an apple and nothing more.
      fr: |-
        Il vit toujours dans sa pomme. S’il croise
        un Pokémon oiseau, son prédateur naturel, il se
        fait passer pour un simple fruit pour se protéger.
      de: |-
        Es verbringt sein ganzes Leben im Inneren eines
        Apfels. Um sich vor Vogel-Pokémon, seinen
        Fressfeinden, zu schützen, imitiert es einen Apfel.
      es: |-
        Habita durante toda su vida en el interior de una
        manzana. Finge ser una fruta para protegerse de
        los Pokémon pájaro, sus enemigos naturales.
      it: |-
        Passa la vita all’interno di un pomo. Quando si
        imbatte in Pokémon alati, suoi nemici naturali,
        si protegge fingendosi un semplice frutto.
    shield:
      ja-Hrkt: |-
        うまれると　りんごに　もぐりこむ。
        なかみを　たべながら　せいちょうし
        りんごの　あじが　しんかを　きめる。
      ja: |-
        生まれると　りんごに　潜りこむ。
        中身を　食べながら　成長し
        りんごの　味が　進化を　決める。
      ko: |-
        태어나면 사과 안으로 숨어든다.
        안을 파먹으면서 성장하고
        사과 맛이 진화를 결정한다.
      zh-Hant: |-
        一出生就躲進了蘋果中，
        一邊吃果肉一邊成長。
        進化方向依蘋果的味道而定。
      zh-Hans: |-
        一出生就躲进了苹果中。
        一边吃果肉一边成长。
        进化方向因苹果的味道而定。
      en: |-
        As soon as it’s born, it burrows into an apple. Not
        only does the apple serve as its food source, but
        the flavor of the fruit determines its evolution.
      fr: |-
        À la naissance, il s’installe dans une pomme
        et grandit en se nourrissant de sa chair.
        Son évolution dépend de la saveur du fruit.
      de: |-
        Nach der Geburt kriecht es sofort in einen Apfel
        und verspeist dessen Inneres, um zu wachsen.
        Seine Entwicklung hängt von dessen Aroma ab.
      es: |-
        Nada más nacer se refugia en una manzana, cuyo
        interior va devorando a medida que crece. El
        sabor de la fruta determina la evolución.
      it: |-
        Quando nasce si intrufola in un pomo e cresce
        mangiandone la polpa. Si evolve in modo diverso
        a seconda del gusto del frutto.
