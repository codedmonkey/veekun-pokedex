        あたまの　はっぱを　わけあたえる。
        つかれを　とる　こうかが　あるのだ。
      ja: |-
        元気の　ない　ポケモンに
        頭の　葉っぱを　分け与える。
        疲れを　取る　効果が　あるのだ。
