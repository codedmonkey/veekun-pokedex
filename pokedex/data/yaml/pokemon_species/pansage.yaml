        auf die Beine.
      es: |-
        Comparte las hojas de su cabeza con Pokémon
        agotados. Posee la facultad de aliviar el cansancio.
      it: |-
        Distribuisce le foglie sulla sua testa ai Pokémon
        affaticati, per alleviare la loro stanchezza.
