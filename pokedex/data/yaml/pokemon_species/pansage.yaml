        分け与える　優しさを　持つ。
      ko: |-
        나무열매를 잘 찾아
        여기저기에서 모아 동료에게
        나누어 주는 상냥함을 가졌다.
      en: |-
        It’s good at finding berries and gathers them from
        all over. It’s kind enough to share them
        with friends.
      fr: |-
        Il est très doué pour trouver des Baies et aime les
        partager avec ses amis sans rien demander en
        échange.
      de: |-
        Ein nettes Kerlchen, das so talentiert darin ist,
        Beeren aufzuspüren, dass es sie mit all seinen
        Kameraden teilt.
      es: |-
        Es todo un experto en la búsqueda de bayas y es tan
        gentil que las comparte con todos sus compañeros.
      it: |-
        È un Pokémon molto generoso. Abilissimo nello
        scovare le bacche, va in giro a raccoglierle per poi
