dragalge:
  base_happiness: 50
  capture_rate: 55
  color: brown
  egg_groups:
    - water1
    - dragon
  evolution_chain: skrelp
  evolves_from: skrelp
  flavor_text:
    x:
      ja-Hrkt: |-
        タンカーの　せんたいを　くさらせる
        もうどくを　なわばりに　はいりこんだ
        ものに　みさかいなく　はきかける。
      ja: |-
        タンカーの　船体を　腐らせる　猛毒を
        縄張りに　入りこんだ　ものに
        見境なく　吐きかける。
      ko: |-
        유조선의 선체를 썩게 할 정도의
        맹독을 영역 안에 들어 온 것에
        무턱대고 끼얹는다
      en: |-
        Their poison is strong enough to eat through
        the hull of a tanker, and they spit it indiscriminately
        at anything that enters their territory.
      fr: |-
        Il asperge tous ceux qui osent pénétrer sur son
        territoire d’un poison assez corrosif pour dissoudre
        la coque d’un pétrolier.
      de: |-
        Das Gift, mit dem es Eindringlinge in seinem Revier
        bespritzt, ist ätzend genug, um sich durch
        den Stahl eines Tankschiffes zu fressen.
      es: |-
        Ataca de manera indiscriminada a quien ose adentrarse
        en su territorio, escupiéndole un virulento veneno
        que puede corroer hasta el casco de un petrolero.
      it: |-
        Spruzza su chiunque invada il suo territorio un veleno
        talmente potente da sciogliere lo scafo di una
        petroliera.
    'y':
      ja-Hrkt: |-
        ドラミドロが　すむ　かいいきに
        まよいこんだ　ふねは　２どと
        いきて　もどれないと　いわれている。
      ja: |-
        ドラミドロが　住む　海域に
        迷いこんだ　船は　２度と
        生きて　戻れないと　言われている。
      ko: |-
        드래캄이 사는 해역에
        길을 잘못 든 배는 두 번 다시
        살아서 돌아가지 못한다고 전해진다.
      en: |-
        Tales are told of ships that wander into
        seas where Dragalge live, never to return.
      fr: |-
        Il paraît que les navires qui s’aventurent dans les eaux
        peuplées de Kravarech ne reviennent jamais de leur
        périple.
      de: |-
        Es heißt, dass die Besatzung von Schiffen, die sich in
        Tandraks Hoheitsgebiet begeben, nicht mehr lebend
        zurückkehrt.
      es: |-
        Según se dice, los barcos que se aventuran en aguas
        donde habitan Dragalge desaparecen del mapa y no
        regresan a puerto.
      it: |-
        Si dice che le navi che finiscono alla deriva nelle acque
        in cui vive questo Pokémon non tornino più indietro.
    omega-ruby:
      ja-Hrkt: |-
        タンカーの　せんたいを　くさらせる
        もうどくを　なわばりに　はいりこんだ
        ものに　みさかいなく　はきかける。
      ja: |-
        タンカーの　船体を　腐らせる　猛毒を
        縄張りに　入りこんだ　ものに
        見境なく　吐きかける。
      ko: |-
        유조선의 선체를 썩게 할 정도의
        맹독을 영역 안에 들어 온 것에
        무턱대고 끼얹는다.
      en: |-
        Their poison is strong enough to eat through
        the hull of a tanker, and they spit it indiscriminately
        at anything that enters their territory.
      fr: |-
        Il asperge tous ceux qui osent pénétrer sur son territoire
        d’un poison assez corrosif pour dissoudre la coque
        d’un pétrolier.
      de: |-
        Das Gift, mit dem es Eindringlinge in seinem Revier bespritzt,
        ist ätzend genug, um sich durch den Stahl eines Tankschiffes
        zu fressen.
      es: |-
        Ataca de manera indiscriminada a quien ose adentrarse en
        su territorio, escupiéndole un virulento veneno que puede
        corroer hasta el casco de un petrolero.
      it: |-
        Spruzza su chiunque invada il suo territorio un veleno
        talmente potente da sciogliere lo scafo di una petroliera.
    alpha-sapphire:
      ja-Hrkt: |-
        ドラミドロが　すむ　かいいきに
        まよいこんだ　ふねは　２どと
        いきて　もどれないと　いわれている。
      ja: |-
        ドラミドロが　住む　海域に
        迷いこんだ　船は　２度と
        生きて　戻れないと　言われている。
      ko: |-
        드래캄이 사는 해역에
        길을 잘못 든 배는 두 번 다시
        살아서 돌아가지 못한다고 전해진다.
      en: |-
        Tales are told of ships that wander into
        seas where Dragalge live, never to return.
      fr: |-
        Il paraît que les navires qui s’aventurent dans les eaux
        peuplées de Kravarech ne reviennent jamais de leur périple.
      de: |-
        Es heißt, dass die Besatzung von Schiffen, die sich in Tandraks
        Hoheitsgebiet begeben, nicht mehr lebend zurückkehrt.
      es: |-
        Según se dice, los barcos que se aventuran en aguas donde
        habitan Dragalge desaparecen del mapa y no regresan a
        puerto.
      it: |-
        Si dice che le navi che finiscono alla deriva nelle acque
        in cui vive questo Pokémon non tornino più indietro.
    ultra-sun:
      ja-Hrkt: |-
        きょうぼうで　よってきた　あいてに
        どくえきを　ふきかける。　なぜだか
        ダダリンとだけは　とっても　なかよし。
      ja: |-
        凶暴で　寄ってきた　相手に
        毒液を　吹きかける。　なぜだか
        ダダリンとだけは　とっても　仲良し。
      ko: |-
        매우 흉포해서, 다가온 상대에게
        독액을 내뿜는다. 무슨 이유에서인지
        타타륜과만 매우 사이가 좋다.
      zh-Hant: |-
        性情兇暴，會對靠近自己的對手
        噴出毒液。不知為何就只跟
        破破舵輪關係非常親密。
      zh-Hans: |-
        性格粗暴，会朝靠近的对手
        喷出毒液。不知为何，
        只和破破舵轮关系非常好。
      en: |-
        This vicious Pokémon sprays a poisonous liquid
        on opponents that come near. For whatever
        reason, it gets along really well with Dhelmise.
      fr: |-
        Les étourdis qui divaguent du côté de chez lui
        se font chasser à grands jets de poison.
        Curieusement, il adore Sinistrail.
      de: |-
        Ein boshaftes Pokémon, das alle, die sich ihm
        nähern, mit Gift bespritzt. Einzig mit Moruda
        versteht es sich aus unbekannten Gründen gut.
      es: |-
        Este violento Pokémon escupe veneno a los
        rivales que se le acercan. Sin embargo, por algún
        extraño motivo, se lleva muy bien con Dhelmise.
      it: |-
        È spietato e spruzza un liquido velenoso sui
        Pokémon ostili che gli si avvicinano. Per qualche
        strano motivo, va d’accordo solo con Dhelmise.
    ultra-moon:
      ja-Hrkt: |-
        かいそうに　まぎれて　えものを　まち
        きんぞくを　とかすほどの　どくえきを
        ふきかけて　しとめるのだ。
      ja: |-
        海藻に　まぎれて　獲物を　待ち
        金属を　溶かすほどの　毒液を
        吹きかけて　仕留めるのだ。
      ko: |-
        해조와 뒤섞여서 먹이를 기다렸다
        금속을 녹일 정도의 독액을
        내뿜어서 처리한다.
      zh-Hant: |-
        混在海藻裡等待獵物上門。
        會噴出連金屬都能溶解的毒液，
        給獵物致命一擊。
      zh-Hans: |-
        混在海藻里，等待着猎物，
        会喷出连金属都能溶解的毒液，
        给猎物致命一击。
      en: |-
        It blends in with seaweed to ambush its prey
        and then takes them down with a poisonous
        liquid strong enough to melt metal.
      fr: |-
        Il attend sa proie tapi au milieu des algues,
        et attaque en crachant un poison si corrosif
        qu’il peut même dissoudre le métal.
      de: |-
        Es versteckt sich in Algen und lauert dort seiner
        Beute auf. Diese greift es mit einem Gift an, das
        selbst Metall zum Schmelzen bringt.
      es: |-
        Se esconde entre las algas y espera a sus
        presas, a las cuales rocía con un veneno tan
        cáustico que puede derretir hasta el metal.
      it: |-
        Aspetta la preda nascosto tra le alghe e
        l’attacca spruzzandole addosso un liquido
        altamente corrosivo che scioglie anche il metallo.
    sword:
      ja-Hrkt: |-
        きんぞくを　くさらせる　どくえきで
        なわばりに　はいりこんだ　タンカーを
        うみのもくずに　してしまう。
      ja: |-
        金属を　腐らせる　毒液で
        縄張りに　入りこんだ　タンカーを
        海の藻屑に　してしまう。
      ko: |-
        금속을 녹슬게 하는 독액으로
        영역에 들어온 유조선을
        바다의 부스러기로 만들어 버린다.
      zh-Hant: |-
        會用能夠腐蝕金屬的毒液
        將闖入自己地盤的油輪
        化為碎屑，沉入大海。
      zh-Hans: |-
        将能够腐蚀金属的毒液
        喷向进入自己领地的油轮，
        使其化为碎屑，葬身海底。
      en: |-
        Dragalge uses a poisonous liquid capable of
        corroding metal to send tankers that enter its
        territory to the bottom of the sea.
      fr: |-
        Avec son poison capable de dissoudre le métal,
        il réduit à l’état d’épave les navires-citernes qui
        pénètrent sur son territoire.
      de: |-
        Dringen Tankschiffe in sein Revier ein, versenkt
        es diese mithilfe eines Giftes, das selbst Metall
        zum Korrodieren bringt.
      es: |-
        Utiliza su veneno capaz de corroer el metal
        para enviar a pique cualquier navío que ose
        adentrarse en las aguas que habita.
      it: |-
        Con il suo liquido altamente corrosivo, capace
        di sciogliere il metallo, riduce in rottami
        le petroliere che sconfinano nel suo territorio.
    shield:
      ja-Hrkt: |-
        あたまの　カサを　かいめんから　だし
        たいようの　ひかりを　あびることで
        ドラゴンエネルギーを　つくるのだ。
      ja: |-
        頭の　笠を　海面から　出し
        太陽の　光を　浴びることで
        ドラゴンエネルギーを　作るのだ。
      ko: |-
        머리의 갓을 해면 위로 내밀고
        태양 빛을 받아
        드래곤 에너지를 만든다.
      zh-Hant: |-
        透過讓頭頂類似帽子的部分
        浮出海面吸收陽光，
        就能夠製造龍之能量。
      zh-Hans: |-
        会通过将头上的伞状部分
        伸出海面吸收阳光的方式，
        在体内制造龙之能量。
      en: |-
        Dragalge generates dragon energy by sticking
        the plume on its head out above the ocean’s
        surface and bathing it in sunlight.
      fr: |-
        Il sort la crête sur sa tête à la surface de l’eau
        et l’expose à la lumière du soleil pour produire
        de l’énergie draconique.
      de: |-
        Indem Tandrak seinen Kopfschmuck aus dem
        Wasser reckt und ihn im Sonnenlicht badet,
        produziert es Drachen-Energie.
      es: |-
        Asoma la cresta de la cabeza sobre la superficie
        del agua y transforma la luz que absorbe del sol
        en energía dragón.
      it: |-
        Fa uscire la cresta che ha sulla testa fuori
        dall’acqua per assorbire la luce del sole
        e convertirla in energia Drago.
