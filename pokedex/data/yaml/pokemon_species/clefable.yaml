    ruby:
      en: |-
        CLEFABLE moves by skipping lightly as if
        it were flying using its wings. Its
        bouncy step lets it even walk on water.It is known to take strolls on lakes on
        quiet, moonlit nights.
    sapphire:
      en: |-
        CLEFABLE moves by skipping lightly as if
        it were flying using its wings. Its
        bouncy step lets it even walk on water.It is known to take strolls on lakes on
        quiet, moonlit nights.
    emerald:
      en: |-
        A CLEFABLE uses its wings to skip lightly 
        as if it were flying. Its bouncy step
        lets it even walk on water. On quiet,
        moonlit nights, it strolls on lakes.
    firered:
      en: |-
        It has an acute sense of hearing. It can
        easily hear a pin being dropped nearly
        1,100 yards away.
    leafgreen:
      en: |-
        A timid fairy POKéMON that is rarely seen,
        it will run and hide the moment it senses
        people.
    diamond:
      en: |-
        Rarely seen by people, it is
        said to be drawn by the full
        moon to play at deserted lakes.
    pearl:
      en: |-
        Its hearing is so acute it can
        hear a pin drop over half a mile
        away. It lives on quiet mountains.
    platinum:
      en: |-
        It is very wary and rarely shows
        itself to people. Its ears can hear
        a pin drop over half a mile away.
    heartgold:
      en: |-
        With its acute hearing, it can
        pick up sounds from far away.
        It usually hides in quiet places.
    soulsilver:
      en: |-
        Its very sensitive ears let it
        distinguish distant sounds. As a
        result, it prefers quiet places.
    black:
      en: |-
        It is very wary and rarely shows
        itself to people. Its ears can hear
        a pin drop over half a mile away.
      fr: |-
        Il est très farouche et se laisse
        rarement approcher. De plus, il
        détecte les sons à plus d’1 km.
    white:
      en: |-
        It is very wary and rarely shows
        itself to people. Its ears can hear
        a pin drop over half a mile away.
      fr: |-
        Il est très farouche et se laisse
        rarement approcher. De plus, il
        détecte les sons à plus d’1 km.
    black-2:
      en: |-
        Their ears are sensitive enough to hear
        a pin drop from over a mile away,
        so they’re usually found in quiet places.
    white-2:
      en: |-
        Their ears are sensitive enough to hear
        a pin drop from over a mile away,
        so they’re usually found in quiet places.
    x:
      ja-Hrkt: |-
        １キロさきで　おちた　ハリの　おとも
        ききわける　すぐれた　みみを　もつ。
        しずかな　やまおくに　すんでいる。
      ja: |-
        １キロ先で　落ちた　針の　音も
        聞き分ける　優れた　耳を　持つ。
        静かな　山奥に　住んでいる。
      ko: |-
        1km 전방에 떨어진 바늘 소리도
        분간할 수 있는 우수한 귀를 가지고
        있다. 조용한 산속에 살고 있다.
      en: |-
        Its hearing is so acute it can hear a pin drop over
        half a mile away. It lives on quiet mountains.
      fr: |-
        Il aime le calme des montagnes. Son ouïe
        exceptionnelle entendrait une aiguille tomber à 1 km.
      de: |-
        Es kann eine Nadel hören, die in 1 km Entfernung
        zu Boden fällt. Es lebt in der Stille der Berge.
      es: |-
        Su oído es tan agudo que puede oír una aguja caer a
        1 km. Vive en montañas solitarias.
      it: |-
        Ha un udito tanto acuto da sentire la caduta di uno
        spillo a 1 km di distanza. Vive su monti quieti.
    'y':
      ja-Hrkt: |-
        ようせいの　なかまで　めったに
        ひとまえに　でてこない。けはいを
        かんじて　すぐ　にげてしまうようだ。
      ja: |-
        妖精の　仲間で　めったに
        人前に　出てこない。気配を
        感じて　すぐに　逃げてしまうようだ。
      ko: |-
        요정의 동료로 좀처럼
        사람 앞에 나타나지 않는다. 기척을
        느끼면 바로 도망가는 듯하다.
      en: |-
        A timid fairy Pokémon that is rarely seen, it will run
        and hide the moment it senses people.
      fr: |-
        Ce Pokémon est une sorte de petite fée très rare.
        Il court vite se cacher s’il aperçoit un être humain.
      de: |-
        Ein feenhaftes und scheues Pokémon, das sofort
        die Flucht ergreift, wenn es Menschen wittert.
      es: |-
        Un encantador y tímido Pokémon muy raro de ver.
        Corre y se oculta en cuanto siente que viene gente.
      it: |-
        Timido Pokémon Fata, molto raro a vedersi. Scappa e
        si nasconde non appena avverte la presenza umana.
    omega-ruby:
      ja-Hrkt: |-
        つばさを　つかって　とぶように　スキップ。
        すいめんを　あるく　ことだって　できるのだ。
        しずかな　つきよに　みずうみを　あるく。
      ja: |-
        翼を　使って　飛ぶように　スキップ。
        水面を　歩く　ことだって　できるのだ。
        静かな　月夜に　湖を　歩く。
      ko: |-
        날개를 사용하여 날아가듯 뛰어간다.
        물 위를 걷는 것도 할 수 있다.
        조용한 달밤에 호수를 걷는다.
      en: |-
        Clefable moves by skipping lightly as if it were flying using its
        wings. Its bouncy step lets it even walk on water. It is known
        to take strolls on lakes on quiet, moonlit nights.
      fr: |-
        Les Mélodelfe se déplacent en sautant doucement,
        comme s’ils volaient. Leur démarche légère leur permet
        même de marcher sur l’eau. On raconte qu’ils se promènent
        sur les lacs, les soirs où la lune est claire.
      de: |-
        Pixi bewegt sich fort, indem es leicht mit den Flügeln schlägt.
        Durch seinen federnden Gang kann es sogar über Wasser
        gehen. Bei Mondschein unternimmt es Spaziergänge auf Seen.
      es: |-
        Clefable se mueve dando saltitos como si fuera haciendo uso
        de las alas. Estos pequeños brincos le permiten caminar por
        el agua. De todos es sabido que le encanta darse paseos por
        los lagos en tranquilas noches de luna llena.
      it: |-
        Clefable si muove saltellando leggero come se fluttuasse
        sorretto dalle sue ali. Così riesce anche a camminare
        sull’acqua. È solito passeggiare sui laghi in silenziose
        notti di luna piena.
    alpha-sapphire:
      ja-Hrkt: |-
        つばさを　つかって　とぶように　スキップ。
        すいめんを　あるく　ことだって　できるのだ。
        しずかな　つきよに　みずうみを　あるく。
      ja: |-
        翼を　使って　飛ぶように　スキップ。
        水面を　歩く　ことだって　できるのだ。
        静かな　月夜に　湖を　歩く。
      ko: |-
        날개를 사용하여 날아가듯 뛰어간다.
        물 위를 걷는 것도 할 수 있다.
        조용한 달밤에 호수를 걷는다.
      en: |-
        Clefable moves by skipping lightly as if it were flying using
        its wings. Its bouncy step lets it even walk on water.
        It is known to take strolls on lakes on quiet, moonlit nights.
      fr: |-
        Les Mélodelfe se déplacent en sautant doucement,
        comme s’ils volaient. Leur démarche légère leur permet
        même de marcher sur l’eau. On raconte qu’ils se promènent
        sur les lacs, les soirs où la lune est claire.
      de: |-
        Pixi bewegt sich fort, indem es leicht mit den Flügeln schlägt.
        Durch seinen federnden Gang kann es sogar über Wasser
        gehen. Bei Mondschein unternimmt es Spaziergänge auf Seen.
      es: |-
        Clefable se mueve dando saltitos como si fuera haciendo uso
        de las alas. Estos pequeños brincos le permiten caminar por
        el agua. De todos es sabido que le encanta darse paseos por
        los lagos en tranquilas noches de luna llena.
      it: |-
        Clefable si muove saltellando leggero come se fluttuasse
        sorretto dalle sue ali. Così riesce anche a camminare
        sull’acqua. È solito passeggiare sui laghi in silenziose
        notti di luna piena.
    sun:
      ja-Hrkt: |-
        ひとまえに　すがたを　みせることを
        このまない。　ふかい　やまの　おくで
        むれに　なって　ひっそり　くらす。
      ja: |-
        人前に　姿を　みせることを
        好まない。　深い　山の　奥で
        群れに　なって　ひっそり　暮らす。
      ko: |-
        사람 앞에 모습을 보이는 것을
        좋아하지 않는다. 깊은 산 속에서
        무리를 지어 조용히 살고 있다.
      zh-Hant: |-
        不喜歡在人面前現身。
        喜歡群居在深山裡靜靜地生活。
      zh-Hans: |-
        不喜欢在人面前现身。
        喜欢群居在深山里静静地生活。
      en: |-
        They don’t like to reveal themselves in front of
        people. They live quietly in packs deep in
        the mountains.
      fr: |-
        Il n’aime pas être aperçu par les humains.
        Il préfère donc vivre paisiblement en groupes
        au fond des montagnes.
      de: |-
        Es zeigt sich Menschen nur ungern und führt
        zusammen mit anderen Artgenossen ein
        abgeschiedenes Leben tief in den Bergen.
      es: |-
        No les gusta dejarse ver ante las personas.
        Viven tranquilamente en grupos en lo profundo
        de las montañas.
      it: |-
        È un Pokémon molto timido. Vive nascosto
        assieme ai suoi simili nei recessi montani.
    moon:
      ja-Hrkt: |-
        つがいの　ピクシーが　スキップする
        すがたを　みると　しあわせな
        けっこんが　できると　いわれる。
      ja: |-
        つがいの　ピクシーが　スキップする
        姿を　みると　幸せな
        結婚が　できると　いわれる。
      ko: |-
        한 쌍의 픽시가 뛰어가는
        모습을 보면 행복한
        결혼을 할 수 있다고 전해진다.
      zh-Hant: |-
        據說，如果看到一對皮可西
        蹦蹦跳跳的樣子，
        就能獲得幸福的婚姻。
      zh-Hans: |-
        据说，如果看到一对皮可西
        蹦蹦跳跳的样子，
        就能获得幸福的婚姻。
      en: |-
        According to tradition, people who see a pair
        of Clefable skipping by can look forward to a
        happy marriage.
      fr: |-
        Une tradition raconte qu’apercevoir un Mélodelfe
        gambader joyeusement signifie que l’on fera
        un heureux mariage.
      de: |-
        Man sagt, zwei herumtollende Pixi zu sehen,
        verheiße eine glückliche Ehe.
      es: |-
        Se dice que avistar a una pareja de Clefable
        dando saltitos trae felicidad al matrimonio.
      it: |-
        Si dice che chi vede saltellare una coppia
        di Clefable avrà un matrimonio felice.
    ultra-sun:
      ja-Hrkt: |-
        １キロさきで　はりが　おちた　おとも
        きこえてしまうので　ひとやポケモンが
        すくない　ふかいやまおくで　くらす。
      ja: |-
        １キロ先で　針が　落ちた　音も
        聞こえてしまうので　人やポケモンが
        少ない　深い山奥で　暮らす。
      ko: |-
        1km 떨어진 곳에서 바늘이 떨어지는
        소리도 들을 수 있어 사람과 포켓몬이
        적은 깊은 산속에 산다.
      zh-Hant: |-
        由於連１公里外針落地的聲音
        也能聽見，所以牠生活在很少有
        人或寶可夢出現的深山裡。
      zh-Hans: |-
        连１公里外针落地的声音都能听到，
        所以它生活在鲜有人或
        宝可梦出入的深山里。
      en: |-
        It can’t help but hear a pin drop from over half
        a mile away, so it lives deep in the mountains
        where there aren’t many people or Pokémon.
      fr: |-
        Il préfère vivre au fond des montagnes, loin des
        humains et des Pokémon, car il peut entendre
        une aiguille tomber à un kilomètre de distance.
      de: |-
        Es hört eine fallende Nadel aus 1 km Entfernung
        und lebt daher tief in den Bergen, weit weg vom
        Lärm der Menschen und anderer Pokémon.
      es: |-
        Su fino oído puede percibir la caída de un alfiler
        a un kilómetro de distancia. Por eso prefiere
        vivir en las montañas, lejos del mundanal ruido.
      it: |-
        Può sentire il rumore di uno spillo che cade a
        1 km di distanza. Per questo vive in recessi
        montani, lontano da esseri umani e Pokémon.
    ultra-moon:
      ja-Hrkt: |-
        まんげつの　ばん　じっと　よぞらを
        みているのは　ホームシックなのだと
        かんがえる　かがくしゃも　いる。
      ja: |-
        満月の　晩　じっと　夜空を
        見ているのは　ホームシックなのだと
        考える　科学者も　いる。
      ko: |-
        보름달이 뜨는 밤에 밤하늘을
        바라보는 이유는 향수병 때문이라고
        생각하는 과학자도 있다.
      zh-Hant: |-
        也有科學家認為，牠之所以
        會在滿月的晚上盯著夜空看，
        是因為牠在想家。
      zh-Hans: |-
        也有科学家认为，它之所以
        会在满月的晚上盯着夜空看，
        是因为它患上了思乡病。
      en: |-
        Some scientists believe that it gazes intently at
        the sky on nights with a full moon because
        it’s homesick.
      fr: |-
        Selon certains scientifiques, c’est parce qu’il
        a le mal du pays qu’il fixe le ciel les soirs de
        pleine lune.
      de: |-
        Bei Vollmond blickt es still zum Nachthimmel
        hinauf. Manche Wissenschaftler deuten dieses
        Verhalten als Heimweh.
      es: |-
        Algunos científicos sostienen que cuando mira
        al cielo fijamente en las noches de luna llena es
        porque siente morriña.
      it: |-
        Nelle notti di luna piena si perde a fissare il
        cielo. Secondo alcuni studiosi, pensa con
        nostalgia alla sua casa lontana.
    lets-go-pikachu:
      ja-Hrkt: |-
        じぶんたちの　せかいを　だいじに
        しているらしく　めったに　ひとまえに
        でてこない　ようせいの　なかま。
      ja: |-
        自分たちの　世界を　大事に
        しているらしく　めったに　人前に
        出てこない　妖精の　仲間。
      ko: |-
        자신들의 세계를 소중히
        생각하고 있는 듯 좀처럼 사람 앞에
        나타나지 않는 요정의 일종.
      zh-Hant: |-
        妖精的一種。
        似乎非常珍惜自己的世界，
        很少在人們面前現身。
      zh-Hans: |-
        妖精的一种。
        似乎非常珍惜自己的世界，
        很少在人类面前现身。
      en: |-
        They appear to be very protective of their own
        world. It is a kind of fairy, rarely seen by people.
      fr: |-
        Ce Pokémon à l’aspect féérique semble très
        attaché à son habitat et ne se montre que
        rarement.
      de: |-
        Dieses feenhafte Pokémon scheint sein Reich
        mit großem Eifer zu schützen. Es zeigt sich den
        Menschen nur selten.
      es: |-
        Un Pokémon de aspecto feérico que protege
        con celo su entorno y muy rara vez se deja ver
        por los humanos.
      it: |-
        Sembra che queste creature simili alle fate siano
        molto protettive verso il loro habitat.
        Si mostrano agli esseri umani solo di rado.
    lets-go-eevee:
      ja-Hrkt: |-
        じぶんたちの　せかいを　だいじに
