      es: |-
        Un Pokémon de aspecto feérico que protege
        con celo su entorno y muy rara vez se deja ver
        por los humanos.
      it: |-
        Sembra che queste creature simili alle fate siano
        molto protettive verso il loro habitat.
        Si mostrano agli esseri umani solo di rado.
    sword:
      ja-Hrkt: |-
        ようせいの　なかまで　めったに
        ひとまえに　でてこない。　けはいを
        かんじて　すぐ　にげてしまうようだ。
      ja: |-
        妖精の　仲間で　めったに
        人前に　出てこない。　気配を
        感じて　すぐに　逃げてしまうようだ。
      ko: |-
        요정의 동료로 좀처럼
        사람 앞에 나타나지 않는다. 기척을
        느끼면 바로 도망가는 듯하다.
      zh-Hant: |-
        妖精的一種。極少出現在
        人類面前。一感覺到有人
        就會立刻逃走。
      zh-Hans: |-
        妖精的一种，极少出现在人前。
        察觉到有人存在后，
        好像就会立刻逃走。
      en: |-
        A timid fairy Pokémon that is rarely seen, it will
        run and hide the moment it senses people.
      fr: |-
        Ce Pokémon s’apparente à une petite fée
        qui n’apparaît que rarement devant les humains.
        Il court se cacher dès qu’il ressent une présence.
      de: |-
        Ein feenhaftes und scheues Pokémon,
        das sofort die Flucht ergreift, wenn es
        Menschen wahrnimmt.
      es: |-
        Este Pokémon de aspecto feérico, raramente
        visto por los humanos, corre a esconderse en
        cuanto detecta que hay alguien cerca.
      it: |-
        Timido Pokémon Fata, molto raro a vedersi.
        Scappa e si nasconde non appena avverte
        la presenza delle persone.
    shield:
      ja-Hrkt: |-
        １キロさきに　おちた　はりの　おとも
        きこえるほど　みみが　いいので
        ふだんは　しずかな　ところに　いる。
      ja: |-
        １キロ先に　落ちた　針の　音も
        聞こえるほど　耳が　いいので
        ふだんは　静かな　ところに　いる。
      ko: |-
        1km 앞에 떨어진 바늘 소리가
        들릴 정도로 귀가 좋아
        평소에는 조용한 곳에서 지낸다.
      zh-Hant: |-
        聽覺靈敏，連１公里以外
        針落地的聲音都聽得見，
        因此平時會待在安靜的地方。
      zh-Hans: |-
        听觉灵敏，连１公里以外
        针落地的声音都听得见，
        因此平时会待在安静的地方。
      en: |-
        Their ears are sensitive enough to hear a pin
        drop from over a mile away, so they’re usually
        found in quiet places.
      fr: |-
        Capable d’entendre une aiguille tomber à plus
        d’un kilomètre, ce Pokémon préfère les endroits
        calmes et isolés.
      de: |-
        Ihr Gehör erfasst das Geräusch einer fallenden
        Nadel noch aus 1 km Entfernung. Sie bevorzugen
        daher ruhige Orte.
      es: |-
        Su oído es tan fino que puede percibir cómo cae
        una aguja a 1 km de distancia. Por eso suele
        habitar en lugares tranquilos.
      it: |-
        Il loro udito è così acuto che sentono un ago
        cadere a 1 km di distanza. Per questo di solito
        vivono in luoghi molto silenziosi.
    legends-arceus:
      en: |-
