  flavor_text:
    diamond:
      en: |-
        A Pokémon that was formed by 108
        spirits. It is bound to a fissure
        in an odd keystone.
    pearl:
      en: |-
        It was bound to a fissure in an
        odd keystone as punishment for
        misdeeds 500 years ago.
    platinum:
      en: |-
        Its constant mischief and misdeeds
        resulted in it being bound to an Odd
        Keystone by a mysterious spell.
    heartgold:
      en: |-
        It was formed by uniting 108 spirits.
        It has been bound to the Odd Keystone
        to keep it from doing any mischief.
    soulsilver:
      en: |-
        It was formed by uniting 108 spirits.
        It has been bound to the Odd Keystone
        to keep it from doing any mischief.
    black:
      en: |-
        Its constant mischief and misdeeds
        resulted in it being bound to an Odd
        Keystone by a mysterious spell.
      fr: |-
        Son mauvais comportement lui a valu
        d’être enchaîné à une Clé de Voûte
        par un mystérieux sortilège.
    white:
      en: |-
        Its constant mischief and misdeeds
        resulted in it being bound to an Odd
        Keystone by a mysterious spell.
      fr: |-
        Son mauvais comportement lui a valu
        d’être enchaîné à une Clé de Voûte
        par un mystérieux sortilège.
    black-2:
      en: |-
        Its constant mischief and misdeeds
        resulted in it being bound to an Odd
        Keystone by a mysterious spell.
    white-2:
      en: |-
        Its constant mischief and misdeeds
        resulted in it being bound to an Odd
        Keystone by a mysterious spell.
    x:
      ja-Hrkt: |-
        １０８この　たましいが　あつまって
        うまれた　ポケモン。かなめいしの
        ひびわれに　つながれている。
      ja: |-
        １０８個の　魂が　集まって
        生まれた　ポケモン。
        要石の　ひび割れに　つながれている。
      ko: |-
        108개의 영혼이 모여서
        태어난 포켓몬이다. 쐐기돌의
        균열과 연결되어 있다.
      en: |-
        A Pokémon that was formed by 108 spirits. It is
        bound to a fissure in an odd keystone.
      fr: |-
        Un Pokémon composé de 108 esprits. Il provient
        d’une fissure dans une clé de voûte étrange.
      de: |-
        Ein Pokémon, das aus 108 Geistern besteht.
        Es ist an einen Spalt in einem mysteriösen Stein
        gebunden.
      es: |-
        Se formó a partir de 108 espíritus. Está unido a la
        fisura de una piedra angular mística.
      it: |-
        Pokémon formato da 108 spiriti. È stato imprigionato
        nella fessura di una Roccianima.
    'y':
      ja-Hrkt: |-
        ５００ねんまえに　わるさをしたため
        かなめいしの　ひびわれに
        からだを　つなぎとめられてしまった。
      ja: |-
        ５００年前に　悪さをしたため
        要石の　ひび割れに
        体を　つなぎとめられてしまった。
      ko: |-
        500년 전에 나쁜 짓을 했기 때문에
        쐐기돌의 균열에
        몸이 연결되어 갇혀 버렸다.
      en: |-
        It was bound to a fissure in an odd keystone as
        punishment for misdeeds 500 years ago.
      fr: |-
        Il fut emprisonné dans la fissure d’une clé de voûte
        étrange en guise de punition il y a 500 ans.
      de: |-
        Es wurde in einen Spalt eines Steins gebannt,
        als Sühne für Untaten, die es vor 500 Jahren
        begangen hatte.
      es: |-
        Como castigo por una fechoría 500 años atrás, está
        unido a la fisura de una piedra angular mística.
      it: |-
        500 anni fa fu imprigionato nella fessura di una
        Roccianima come punizione.
    omega-ruby:
      ja-Hrkt: |-
        １０８この　たましいが　あつまって
        うまれた　ポケモン。かなめいしの
        ひびわれに　つながれている。
      ja: |-
        １０８個の　魂が　集まって
        生まれた　ポケモン。
        要石の　ひび割れに　つながれている。
      ko: |-
        108개의 영혼이 모여서
        태어난 포켓몬이다. 쐐기돌의
        균열과 연결되어 있다.
      en: |-
        A Pokémon that was formed by 108 spirits. It is
        bound to a fissure in an odd keystone.
      fr: |-
        Un Pokémon composé de 108 esprits. Il provient d’une fissure
        dans une clé de voûte étrange.
      de: |-
        Ein Pokémon, das aus 108 Geistern besteht. Es ist an einen
        Spalt in einem mysteriösen Stein gebunden.
      es: |-
        Se formó a partir de 108 espíritus. Está unido a la fisura de
        una piedra angular mística.
      it: |-
        Pokémon formato da 108 spiriti. È stato imprigionato nella
        fessura di una Roccianima.
    alpha-sapphire:
      ja-Hrkt: |-
        ５００ねんまえに　わるさをしたため
        かなめいしの　ひびわれに
        からだを　つなぎとめられてしまった。
      ja: |-
        ５００年前に　悪さをしたため
        要石の　ひび割れに
        体を　つなぎとめられてしまった。
      ko: |-
        500년 전에 나쁜 짓을 했기 때문에
        쐐기돌의 균열에
        몸이 연결되어 갇혀 버렸다.
      en: |-
        It was bound to a fissure in an odd keystone as
        punishment for misdeeds 500 years ago.
      fr: |-
        Il fut emprisonné dans la fissure d’une clé de voûte étrange
        en guise de punition il y a 500 ans.
      de: |-
        Es wurde in einen Spalt eines Steins gebannt, als Sühne
        für Untaten, die es vor 500 Jahren begangen hatte.
      es: |-
        Como castigo por una fechoría 500 años atrás, está unido a
        la fisura de una piedra angular mística.
      it: |-
        500 anni fa fu imprigionato nella fessura di una Roccianima
        come punizione.
    sword:
      ja-Hrkt: |-
        １０８この　たましいが　あつまり
        ポケモンになったが　しょうわるの
        たましいが　まじってしまったらしい。
      ja: |-
        １０８個の　魂が　集まり
        ポケモンになったが　性悪の
        魂が　混じってしまったらしい。
      ko: |-
        108개의 영혼이 모여
        포켓몬이 되었지만 성질이 나쁜
        영혼이 섞여버린 듯하다.
      zh-Hant: |-
        １０８個靈魂聚集在一起
        成為了寶可夢，但其中
        似乎混進了壞心眼的靈魂。
      zh-Hans: |-
        由１０８个灵魂聚在一起
        变成了宝可梦，但似乎有
        性格恶劣的灵魂混在里面。
      en: |-
        Exactly 108 spirits gathered to become this
        Pokémon. Apparently there are some ill-natured
        spirits in the mix.
      fr: |-
        Ce Pokémon est né de la fusion de 108 âmes,
        mais on raconte que certaines d’entre elles
        seraient de nature maléfique.
      de: |-
        Es besteht aus 108 Geistern. Allerdings scheinen
        sich auch einige bösartige daruntergemischt zu
        haben.
      es: |-
        Este Pokémon se formó a partir de 108 espíritus.
        Dicen que entre ellos se mezclaron algunos de
        naturaleza malvada.
      it: |-
        108 spiriti si sono riuniti dando vita a questo
        Pokémon, e pare che fra questi ce ne fossero
        di malvagi.
    shield:
      ja-Hrkt: |-
        わるさばかりしていたら　ふしぎな
        じゅつを　つかう　たびびとによって
        かなめいしに　つながれてしまった。
      ja: |-
        悪さばかりしていたら　不思議な
        術を　使う　旅人によって
        要石に　つながれてしまった。
      ko: |-
        나쁜 짓만 일삼다가 신비한
        술수를 사용하는 여행자에 의해
        쐐기돌에 속박당했다.
      zh-Hant: |-
        總是作惡多端，不料有一天
        被使用神奇法術的旅人
        綁縛到了楔石上。
      zh-Hans: |-
        总是作恶多端，
        于是被使用神奇法术的
        旅人绑缚在楔石里。
      en: |-
        All Spiritomb’s mischief and misdeeds compelled
        a traveler to use a mysterious spell to bind
        Spiritomb to an odd keystone.
      fr: |-
        Pour punir son comportement déplorable,
        un voyageur a utilisé un mystérieux sortilège
        pour l’enchaîner à une Clé de Voûte.
      de: |-
        Aufgrund seiner ständigen Untaten wurde es von
        einem Reisenden mithilfe mysteriöser Künste an
        einen Spiritkern gebunden.
      es: |-
        Un viajero utilizó un misterioso hechizo para
        unirlo a una Piedra Espíritu por sus constantes
        fechorías.
      it: |-
        A causa del suo comportamento molesto, è stato
        imprigionato in una Roccianima da un viandante
        tramite un incantesimo misterioso.
    legends-arceus:
      en: |-
        It lays curses by thinking wicked thoughts. Writings tell that this
        Pokémon was born out of the assembly of five score and eight
        malevolent spirits.
