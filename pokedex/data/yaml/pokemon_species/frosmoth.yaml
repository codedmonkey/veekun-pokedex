frosmoth:
  base_happiness: 50
  capture_rate: 75
  color: white
  egg_groups:
    - bug
  evolution_chain: snom
  evolves_from: snom
  flavor_text:
    sword:
      ja-Hrkt: |-
        はねの　おんどは　マイナス１８０ど。
        れいきを　こめた　りんぷんを　ゆきの
        ように　ふりまき　のやまを　とぶ。
      ja: |-
        はねの　温度は　マイナス１８０度。
        冷気を　込めた　りんぷんを　雪の
        ように　ふりまき　野山を　飛ぶ。
      ko: |-
        날개의 온도는 영하 180도.
        냉기가 담긴 인분을 눈처럼
        흩뿌리며 산과 들을 날아다닌다.
      zh-Hant: |-
        翅膀的溫度是零下１８０度。
        當牠飛過山野時，帶有冷氣的
        鱗粉會像下雪般地飄落下來。
      zh-Hans: |-
        翅膀的温度为零下１８０度。
        当它飞过山野时，带有冷气的
        鳞粉会像下雪般地飘落下来。
      en: |-
        Icy scales fall from its wings like snow as it flies
        over fields and mountains. The temperature of its
        wings is less than −290 degrees Fahrenheit.
      fr: |-
        La température de ses ailes est de - 180 °C.
        Quand il vole, ses écailles gelées tombent
        sur le paysage comme des flocons de neige.
      de: |-
        Seine Flügel sind -180 ºC kalt. Während es über
        Felder und Berge fliegt, verstreut es mit Kälte
        versetzten Flügelstaub, der wie Schnee aussieht.
      es: |-
        La temperatura de sus alas es de -180 °C.
        Sobrevuela el campo esparciendo sus gélidas
        escamas, como si de nieve se tratase.
      it: |-
        La temperatura delle sue ali è di -180 ºC.
        Sorvola pianure e montagne lasciando cadere le
        sue scaglie gelide come fossero fiocchi di neve.
    shield:
      ja-Hrkt: |-
        のやまを　あらすものには　ようしゃ
        しない。　つめたいはねで　とびまわり
        ふぶきを　おこして　こらしめる。
      ja: |-
        野山を　荒らすものには　容赦
        しない。　冷たいはねで　飛びまわり
        吹雪を　起こして　懲らしめる。
      ko: |-
        산과 들을 황폐하게 만들면 용서하지 않는다.
        차가운 날개로 날아다니며
        눈보라를 일으켜 응징한다.
      zh-Hant: |-
        絕不放過破壞山野環境的人。
        會用冰冷的翅膀四處飛翔，
        製造出暴風雪來懲罰他們。
      zh-Hans: |-
        绝不放过破坏山野环境的人。
        会用冰冷的翅膀四处飞翔，
        制造出暴风雪来惩罚他们。
      en: |-
        It shows no mercy to any who desecrate fields
        and mountains. It will fly around on its icy wings,
        causing a blizzard to chase offenders away.
      fr: |-
        Sans pitié pour les vandales, il bat ses ailes
        gelées pour provoquer des blizzards et punir
        quiconque ose souiller les champs et les collines.
      de: |-
        Verwüstet jemand Felder und Berge, vergibt es
        ihm niemals. Es bestraft den Täter, indem es mit
        seinen kalten Flügeln einen Schneesturm erzeugt.
      es: |-
        No muestra la menor compasión con quien asole
        el campo: lo escarmienta batiendo sus gélidas
        alas para provocar una ventisca.
      it: |-
        Non ha alcuna pietà per chi danneggia la natura.
        Vola in ricognizione e punisce i malfattori con
        tempeste di neve che crea con le sue fredde ali.
