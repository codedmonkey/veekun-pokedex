        Pokémon connaîtra l’amour éternel.
    black-2:
      en: |-
        It lives in warm seas. It is said
        that a couple finding this Pokémon
        will be blessed with eternal love.
    white-2:
      en: |-
        It lives in warm seas. It is said
        that a couple finding this Pokémon
        will be blessed with eternal love.
    x:
      ja-Hrkt: |-
        あたたかい　うみに　せいそくする。
        ラブカスを　みつけた　カップルは
        えいえんの　あいが　つづくという。
      ja: |-
        暖かい　海に　生息する。
        ラブカスを　見つけた　カップルは
        永遠の　愛が　続くという。
      ko: |-
        따뜻한 바다에서 서식한다.
        사랑동이를 발견한 커플은
        영원한 사랑이 지속된다고 한다.
      en: |-
        It lives in warm seas. It is said that a couple finding
        this Pokémon will be blessed with eternal love.
      fr: |-
        Un habitant des mers chaudes. On dit que le couple
        qui tombe sur ce Pokémon connaîtra l’amour éternel.
      de: |-
        Es lebt in warmen Meeren. Man sagt, dass Verliebte,
        die es sehen, mit ewiger Liebe gesegnet sind.
      es: |-
        Vive en mares cálidos. Se dice que, si una pareja lo
        encuentra, será bendecida con amor eterno.
      it: |-
        Vive nei mari caldi. Si dice che le coppie che trovano
        questo Pokémon riceveranno in dono l’eterno amore.
    'y':
      ja-Hrkt: |-
        はんしょく　シーズンには　たくさんの
        ラブカスが　さんごしょうに　あつまり
        かいめんが　ピンクいろに　そまる。
      ja: |-
        繁殖シーズンには　たくさんの
        ラブカスが　サンゴ礁に　集まり
        海面が　ピンク色に　染まる。
      ko: |-
        번식기에는 많은 사랑동이가
        산호초에 모여들어서
        해수면이 핑크색으로 물든다.
      en: |-
        During the spawning season, countless Luvdisc
        congregate at coral reefs, turning the waters pink.
      fr: |-
        Pendant la saison des amours, d’innombrables
        Lovdisc se réunissent près des barrières de corail et
        donnent l’impression que la mer est rose.
      de: |-
        Während der Laichzeit versammeln sich zahllose
        Liebiskus in den Korallenriffen. Daher erstrahlt
        das Wasser rosa.
      es: |-
        Durante el desove, multitud de Luvdisc se concentran
        en los arrecifes de coral coloreando de rosa el agua.
      it: |-
        Durante il periodo riproduttivo, numerosi Luvdisc si
        riuniscono intorno alla barriera corallina, colorando
        l’acqua di rosa.
    omega-ruby:
      ja-Hrkt: |-
        ねったいの　あさい　うみで　くらしている。
        カップルを　みつけると　うしろに　くっついて
        およぐ　ことから　この　なまえが　つけられた。
      ja: |-
        熱帯の　浅い　海で　暮らしている。
        カップルを　見つけると　後ろに　くっついて
        泳ぐ　ことから　この　名前が　つけられた。
      ko: |-
        열대의 얕은 바다에서 살고 있다.
        커플을 발견하면 뒤에 붙어서
        헤엄치기 때문에 이런 이름이 붙었다.
      en: |-
        Luvdisc live in shallow seas in the tropics. This heart-shaped
        Pokémon earned its name by swimming after loving couples it
        spotted in the ocean’s waves.
      fr: |-
        Lovdisc vit dans les mers peu profondes des tropiques.
        Ce Pokémon en forme de cœur a gagné son nom en nageant
        derrière les couples d’amoureux qu’il repérait dans les eaux
        claires de l’océan.
      de: |-
        Liebiskus lebt in den seichten Gewässern der Tropen. Dieses
        herzförmige Pokémon verdankt seinen Namen der Tatsache,
        dass es hinter Liebespaaren herschwamm, die es in den Wellen
        des Ozeans beobachtet hatte.
      es: |-
        Luvdisc vive en aguas tropicales poco profundas. Este
        Pokémon con forma de corazón se ha ganado la reputación
        que tiene por ir nadando detrás de las parejas de enamorados
        que veía entre las olas del océano.
      it: |-
        Luvdisc vive nei mari tropicali poco profondi.
        Questo Pokémon a forma di cuore ha preso
        questo nome perché segue le coppie innamorate
        che scorge tra le onde oceaniche.
    alpha-sapphire:
      ja-Hrkt: |-
        ハートがたの　からだは　あいじょうの　シンボル。
        ラブカスに　であった　カップルは　えいえんの
        あいが　やくそくされると　いわれているよ。
      ja: |-
        ハート型の　体は　愛情の　シンボル。
        ラブカスに　出会った　カップルは　永遠の
        愛が　約束されると　いわれているよ。
      ko: |-
        하트 모양의 몸은 애정의 상징이다.
        사랑동이를 만난 커플에게는 영원한
        사랑이 약속된다고 전해진다.
      en: |-
        Luvdisc’s heart-shaped body is a symbol of love and romance.
        It is said that any couple meeting this Pokémon is promised a
        loving relationship that never ends.
      fr: |-
        Le corps en forme de cœur de Lovdisc représente l’amour
        et les sentiments. On raconte qu’un couple qui rencontre
        ce Pokémon s’aimera jusqu’à la fin des temps.
      de: |-
        Liebiskus’ herzförmiger Körper ist ein Symbol der Liebe
        und der Romantik. Man sagt, jedem Paar, dem es begegnet,
        stünde eine unendliche Liebesbeziehung bevor.
      es: |-
        Luvdisc tiene forma de corazón y simboliza el amor y el
        romanticismo. Dicen que la pareja que se encuentre con él
        mantendrá una relación de amor de por vida.
      it: |-
        Il corpo a forma di cuore di Luvdisc è il simbolo delle storie
        d’amore. Si dice che le coppie a cui capita di vederlo siano
        destinate a vivere un’intensa passione che non avrà mai fine.
    sun:
      ja-Hrkt: |-
        １ぴきだけに　なった　ラブカスは
        げんきが　なくなり　スキだらけ。
        そこを　ペリッパーに　さらわれる。
      ja: |-
        １匹だけに　なった　ラブカスは
        元気が　なくなり　スキだらけ。
        そこを　ペリッパーに　さらわれる。
      ko: |-
        혼자가 된 사랑동이는
        기력이 없어지고 빈틈이 많다.
        그럴 때 패리퍼가 잡아간다.
      zh-Hant: |-
        變成只有獨自１隻的愛心魚
        會變得無精打采而破綻處處。
        於是就被大嘴鷗趁機叼走了。
      zh-Hans: |-
        变成只有独自１只的爱心鱼
        无精打采地，尽是空虚。
        就在那时被大嘴鸥叼走了。
      en: |-
        If a Luvdisc is left on its own, it becomes
        despondent, leaving itself open to attack.
        That is when Pelipper snatch them up.
      fr: |-
        Un Lovdisc esseulé perd tout entrain et baisse
        sa garde. Le Bekipan n’attend que cela pour
        frapper.
      de: |-
        Einsame Liebiskus verlieren den Lebensmut und
        vernachlässigen die Deckung. Diese Schwäche
        nutzen Pelipper, um sie sich zu schnappen.
      es: |-
        Cuando un Luvdisc se halla solo, su energía
        disminuye y baja la guardia, momento que
        aprovechan los Pelipper para hacerse con ellos.
      it: |-
        Se rimane solo, Luvdisc perde vitalità
        e abbassa la guardia, diventando una facile
        preda per Pelipper.
    moon:
      ja-Hrkt: |-
        カップルに　にんきが　たかいので
        ハネムーンきゃくが　とまる　ホテルの
        プールに　ほうりゅう　される。
      ja: |-
        カップルに　人気が　高いので
        ハネムーン客が　泊まる　ホテルの
        プールに　放流　される。
      ko: |-
        커플에게 인기가 높아서
        신혼 여행객이 묵는 호텔의
        수영장에 방류된다.
      zh-Hant: |-
        很受情侶歡迎，
        因此被放養在蜜月客人
        住宿的旅館泳池裡。
      zh-Hans: |-
        在情侣中人气很高，
        因此被放养在蜜月客人
        住宿的酒店泳池里。
      en: |-
        Loving couples have a soft spot for this
        Pokémon, so honeymoon hotels often release
        this Pokémon into their pools.
      fr: |-
        Comme il est très populaire auprès des
        amoureux, les hôtels fréquentés par les couples
        en lune de miel en ont souvent dans leur piscine.
      de: |-
        Da Liebiskus besonders bei Pärchen beliebt
        sind, findet man sie oft in Swimmingpools von
        Hotels für Frischvermählte.
      es: |-
        Es popular entre las parejas de enamorados,
        por lo que se suelen soltar en las piscinas de
        los hoteles donde se celebran lunas de miel.
      it: |-
        È molto popolare tra gli innamorati, perciò viene
        messo nelle piscine degli hotel frequentati
        dalle coppiette in luna di miele.
    ultra-sun:
      ja-Hrkt: |-
        ハートがたの　ウロコを　もっていると
        こいびとが　できると　ウワサに　なり
        らんかくされた　じだいも　あった。
      ja: |-
        ハート型の　ウロコを　持っていると
        恋人が　できると　ウワサに　なり
        乱獲された　時代も　あった。
      ko: |-
        하트 모양의 비늘을 갖고 있으면
        연인이 생긴다는 소문이 돌아
        남획된 시대도 있었다.
      zh-Hant: |-
        傳聞說如果擁有牠的心形鱗片
        就能交到男女朋友，這讓牠
        曾經在某段時期遭到濫捕。
      zh-Hans: |-
        如果拥有它的心形鳞片，
        就能交往到恋人。也曾有个时期
        因为这个谣传而遭到滥捕。
      en: |-
        There was an era when it was overfished due to
        the rumor that having one of its heart-shaped
        scales would enable you to find a sweetheart.
      fr: |-
        Il fut un temps où les gens le capturaient en
        masse pour s’approprier ses écailles en forme
        de cœur, supposées porter chance en amour.
      de: |-
        Früher wurde es überfischt, weil man glaubte,
        der Besitz einer seiner herzförmigen Schuppen
        führe zu einer erfolgreichen Partnersuche.
      es: |-
        Según las leyendas, una escama con forma de
        corazón brinda suerte en el amor, lo que condujo
        tiempo ha a su pesca excesiva.
      it: |-
        In passato è stato vittima di una caccia sfrenata
        per via delle sue scaglie a forma di cuore, che si
        riteneva facessero trovare l’anima gemella.
    ultra-moon:
      ja-Hrkt: |-
        あたたかい　うみの　サンゴしょうが
        すみか。　サニーゴのえだの　あいだで
        ねむるのが　とくに　おきにいり。
      ja: |-
        暖かい　海の　サンゴ礁が
        棲み処。　サニーゴの枝の　間で
        眠るのが　特に　お気に入り。
      ko: |-
        따뜻한 바다의 산호초가 서식지다.
        코산호의 가지 사이에서
        자는 것을 특히 좋아한다.
      zh-Hant: |-
        溫暖海域的珊瑚礁是
        牠的棲息地。最喜歡在
        太陽珊瑚的枝條間睡覺。
      zh-Hans: |-
        温暖海域的珊瑚礁是它的栖息地。
        特别喜欢在太阳珊瑚的枝条间睡觉。
      en: |-
        Luvdisc makes its home in coral reefs in warm
        seas. It especially likes sleeping in the space
        between Corsola’s branches.
      fr: |-
        Il vit dans les récifs coralliens des mers
        chaudes, et aime particulièrement dormir
        entre les cornes des Corayon.
      de: |-
        Es lebt in den Korallenriffen warmer Meere und
        schläft besonders gern zwischen den Armen
        von Corasonn.
      es: |-
        Vive en los arrecifes de coral de mares cálidos.
        Dormir entre las ramas de los Corsola es algo
        por lo que siente una especial predilección.
      it: |-
        Vive nelle barriere coralline dei mari caldi.
        Ama particolarmente dormire fra le ramificazioni
        dei Corsola.
