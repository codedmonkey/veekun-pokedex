  flavor_text:
    red:
      en: |-
        Uses its three
        brains to execute
        complex plans.While two heads
        sleep, one head
        stays awake.
    blue:
      en: |-
        Uses its three
        brains to execute
        complex plans.While two heads
        sleep, one head
