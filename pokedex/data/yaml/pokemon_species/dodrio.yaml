    yellow:
      en: |-
        One of DODUO's 2
        heads splits to
        form a uniquespecies. It runs
        close to 40 MPH
        in prairies.
    gold:
      en: |-
        It collects data 
        and plans three
        times as wisely,but it may think
        too much and be­
        come immobilized.
    silver:
