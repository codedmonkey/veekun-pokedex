meowstic:
  base_happiness: 50
  capture_rate: 75
  color: blue
  egg_groups:
    - ground
  evolution_chain: espurr
  evolves_from: espurr
  flavor_text:
    x:
      ja-Hrkt: |-
        きけんが　せまると　みみを　もちあげ
        １０トン　トラックを　ひねりつぶす
        サイコパワーを　かいほうする。
      ja: |-
        危険が　迫ると　耳を　持ち上げ
        １０トン　トラックを　ひねりつぶす
        サイコパワーを　解放する。
      ko: |-
        위험이 다가오면 귀를 들어 올리고
        10톤 트럭을 눌러 부술 정도의
        사이코 파워를 방출한다.
      en: |-
        When in danger, it raises its ears and
        releases enough psychic power to
        grind a 10-ton truck into dust.
      fr: |-
        S’il se sent menacé, il lève les oreilles et déchaîne
        un pouvoir psychique capable de réduire en miettes
        un camion de 10 t.
      de: |-
        In Gefahrensituationen hebt es seine Ohren an und
        setzt Psycho-Kräfte frei, die einen 10 t schweren LKW
        zu Schrott verarbeiten können.
      es: |-
        Cuando percibe peligro, yergue sus orejas y desata un
        poder psíquico capaz de levantar un camión de unas
        10 toneladas.
      it: |-
        Se si sente minacciato, drizza le orecchie e libera un
        potere psichico devastante, in grado di accartocciare
        un camion da 10 t come se fosse una lattina.
    'y':
      ja-Hrkt: |-
        みみの　うちがわの　めだまもようから
        サイコパワーを　だすが　あまりにも
        きょうりょくなので　ふさいでいる。
      ja: |-
        耳の　内側の　目玉模様から
        サイコパワーを　出すが
        あまりにも　強力なので　ふさいでいる。
      ko: |-
        귀 안쪽의 눈알 모양에서
        사이코 파워를 내지만
        너무나도 강력하여 귀를 막고 있다.
      en: |-
        The eyeball patterns on the interior of its ears
        emit psychic energy. It keeps the patterns tightly
        covered because that power is too immense.
      fr: |-
        Les motifs en forme d’yeux à l’intérieur de ses oreilles
        émettent une force psychique tellement puissante
        qu’il est contraint de les garder couverts.
      de: |-
        Über das Augenmuster auf der Innenseite seiner Ohren
        setzt es seine Psycho-Kräfte frei. Da diese aber viel zu
        stark sind, hält es das Muster bedeckt.
      es: |-
        Las marcas en forma de ojos que tiene en las orejas
        emiten poderes psíquicos, pero su potencia es tan
        avasalladora que las mantiene tapadas.
      it: |-
        I motivi a forma di occhio all’interno delle orecchie
        sono la fonte del suo potere psichico. Li tiene coperti
        per controllarne l’immensa potenza.
    omega-ruby:
      ja-Hrkt: |-
        きけんが　せまると　みみを　もちあげ
        １０トン　トラックを　ひねりつぶす
        サイコパワーを　かいほうする。
      ja: |-
        危険が　迫ると　耳を　持ち上げ
        １０トン　トラックを　ひねりつぶす
        サイコパワーを　解放する。
      ko: |-
        위험이 다가오면 귀를 들어 올리고
        10톤 트럭을 눌러 부술 정도의
        사이코 파워를 방출한다.
      en: |-
        When in danger, it raises its ears and
        releases enough psychic power to
        grind a 10-ton truck into dust.
      fr: |-
        S’il se sent menacé, il lève les oreilles et déchaîne un pouvoir
        psychique capable de réduire en miettes un camion de 10 t.
      de: |-
        In Gefahrensituationen hebt es seine Ohren an und setzt
        Psycho-Kräfte frei, die einen 10 t schweren LKW zu Schrott
        verarbeiten können.
      es: |-
        Cuando percibe peligro, yergue sus orejas y desata un poder
        psíquico capaz de levantar un camión de unas 10 toneladas.
      it: |-
        Se si sente minacciato, drizza le orecchie e libera un potere
        psichico devastante, in grado di accartocciare un camion da
        10 t come se fosse una lattina.
    alpha-sapphire:
      ja-Hrkt: |-
        みみの　うちがわの　めだまもようから
        サイコパワーを　だすが　あまりにも
        きょうりょくなので　ふさいでいる。
      ja: |-
        耳の　内側の　目玉模様から
        サイコパワーを　出すが
        あまりにも　強力なので　ふさいでいる。
      ko: |-
        귀 안쪽의 눈알 모양에서
        사이코 파워를 내지만
        너무나도 강력하여 귀를 막고 있다.
      en: |-
        The eyeball patterns on the interior of its ears
        emit psychic energy. It keeps the patterns tightly
        covered because that power is too immense.
      fr: |-
        Les motifs en forme d’yeux à l’intérieur de ses oreilles
        émettent une force psychique tellement puissante qu’il est
        contraint de les garder couverts.
      de: |-
        Über das Augenmuster auf der Innenseite seiner Ohren setzt
        es seine Psycho-Kräfte frei. Da diese aber viel zu stark sind,
        hält es das Muster bedeckt.
      es: |-
        Las marcas en forma de ojos que tiene en las orejas emiten
        poderes psíquicos, pero su potencia es tan avasalladora que
        las mantiene tapadas.
      it: |-
        I motivi a forma di occhio all’interno delle orecchie sono la
        fonte del suo potere psichico. Li tiene coperti per controllarne
        l’immensa potenza.
    sword:
      ja-Hrkt: |-
        みみの　うちがわの　めだまもようから
        サイコパワーを　はなつが　ふだんは
        その　ちからを　かくしている。
      ja: |-
        耳の　内側の　目玉模様から
        サイコパワーを　放つが　普段は
        その　力を　隠している。
      ko: |-
        귀 안쪽의 눈알 모양에서
        사이코 파워를 내지만 평소에는
        그 힘을 숨기고 있다.
      zh-Hant: |-
        會從耳朵內側眼珠花紋的地方
        釋放出精神力量，但平時
        會將那種力量隱藏起來。
      zh-Hans: |-
        会从耳朵内侧眼珠花纹的地方
        释放出精神力量，但平时
        会将那种力量隐藏起来。
      en: |-
        Revealing the eyelike patterns on the insides of
        its ears will unleash its psychic powers. It normally
        keeps the patterns hidden, however.
      fr: |-
        Les motifs en forme d’yeux, à l’intérieur de ses
        oreilles, sont la source de ses pouvoirs psychiques.
        La plupart du temps, il cache ces pouvoirs.
      de: |-
        Über das Augenmuster auf der Innenseite seiner
        Ohren kann es seine Psycho-Kräfte freisetzen.
        Für gewöhnlich hält es sie aber verborgen.
      es: |-
        Emite sus poderes psíquicos por las marcas en
        forma de ojos que tiene en las orejas, aunque,
        por lo general, las mantiene ocultas.
      it: |-
        I motivi a forma di occhio all’interno delle
        orecchie sono la fonte del suo potere psichico.
        Di solito tiene nascosti i suoi poteri.
    shield:
      ja-Hrkt: |-
        オスは　ぼうえい　ほんのうが　つよく
        じぶんや　パートナーを　まもるときに
        さいだいきゅうの　パワーを　だす。
      ja: |-
        オスは　防衛本能が　強く
        自分や　パートナーを　守るときに
        最大級の　パワーを　出す。
      ko: |-
        수컷은 방어 본능이 강해서
        자신과 파트너를 지킬 때
        최대의 파워를 쓴다.
      zh-Hant: |-
        雄性的防衛本能很強，
        在保護自己和夥伴時
        能發揮最大的威力。
      zh-Hans: |-
        雄性的防卫本能很强，
        在保护自己和伙伴时
        能发挥最大的威力。
      en: |-
        The defensive instinct of the males is strong.
        It’s when they’re protecting themselves or their
        partners that they unleash their full power.
      fr: |-
        Le mâle a un instinct de défense très développé.
        Il n’hésite pas à lancer une attaque à pleine
        puissance pour protéger ses partenaires et lui.
      de: |-
        Männliche Psiaugon haben einen ausgeprägten
        Beschützerinstinkt. Sie sind dann am stärksten,
        wenn sie sich oder ihren Trainer verteidigen.
      es: |-
        El fuerte instinto protector de los machos los
        lleva a liberar todo su poder cuando se trata de
        defenderse a sí mismos o a su Entrenador.
      it: |-
        Il maschio ha un forte istinto protettivo.
        Se deve difendere se stesso o il suo Allenatore,
        attacca con una forza formidabile.
  form_description:
    en: "Male and female Meowstic have different level-up moves and hidden abilities.  While gender differences are not usually considered to be separate forms, Meowstic's are treated as such for practical purposes."
