  flavor_text:
    diamond:
      en: |-
        There is an enduring legend that
        states this Pokémon towed
        continents with ropes.
    pearl:
      en: |-
        There is an enduring legend that
        states this Pokémon towed
        continents with ropes.
    platinum:
      en: |-
        It is said to have made Pokémon
        that look like itself from a special
        ice mountain, rocks, and magma.
    heartgold:
      en: |-
        It is believed to have shaped
        REGIROCK, REGICE, and REGISTEEL
        out of clay, ice, and magma.
    soulsilver:
      en: |-
        It is believed to have shaped
        REGIROCK, REGICE, and REGISTEEL
        out of clay, ice, and magma.
    black:
      en: |-
        It is said to have made Pokémon
        that look like itself from a special
        ice mountain, rocks, and magma.
      fr: |-
        On dit qu’il a créé des Pokémon
        à son image à partir de glace,
        de roche et de magma.
    white:
      en: |-
        It is said to have made Pokémon
        that look like itself from a special
        ice mountain, rocks, and magma.
      fr: |-
        On dit qu’il a créé des Pokémon
        à son image à partir de glace,
        de roche et de magma.
    black-2:
      en: |-
        It is said to have made Pokémon
        that look like itself from a special
        ice mountain, rocks, and magma.
    white-2:
      en: |-
        It is said to have made Pokémon
        that look like itself from a special
        ice mountain, rocks, and magma.
    x:
      ja-Hrkt: |-
        とくしゅな　ひょうざんや　がんせき
        マグマから　じぶんの　すがたに　にた
        ポケモンを　つくったと　いわれる。
      ja: |-
        特殊な　氷山や　岩石　マグマから
        自分の　姿に　似た　ポケモンを
        つくったと　言われる。
      ko: |-
        특수한 빙산이나 암석,
        마그마에서 자신의 모습과 닮은
        포켓몬을 만들었다고 전해진다.
      en: |-
        It is said to have made Pokémon that look like
        itself from a special ice mountain, rocks,
        and magma.
      fr: |-
        On dit qu’il a créé des Pokémon à son image à partir
        de glace, de roche et de magma.
      de: |-
        Man sagt, es habe Pokémon aus einem Eisberg,
        Felsen und Magma nach seinem Abbild geschaffen.
      es: |-
        Se dice que usó rocas, magma y un hielo especial de
        montaña para crear Pokémon con su aspecto.
      it: |-
        Si dice che abbia creato dei Pokémon simili a sé
        usando una montagna ghiacciata, rocce e magma.
    'y':
      ja-Hrkt: |-
        なわで　しばった　たいりくを
        ひっぱって　うごかしたという
        でんせつが　のこされている。
      ja: |-
        縄で　縛った　大陸を
        引っ張って　動かしたという
        伝説が　残されている。
      ko: |-
        밧줄로 묶은 대륙을
        당겨서 움직였다고 하는
        전설이 남아 있다.
      en: |-
        There is an enduring legend that states this
        Pokémon towed continents with ropes.
      fr: |-
        Une légende tenace veut que ce Pokémon ait traîné
        les continents en les attachant à des cordes.
      de: |-
        Es gibt eine Legende, wonach dieses Pokémon
        die Kontinente mit einem Seil gezogen hat.
      es: |-
        Una antigua leyenda afirma que este Pokémon
        arrastraba continentes con cuerdas.
      it: |-
        Una leggenda narra che questo Pokémon abbia
        trainato i continenti con delle funi.
    omega-ruby:
      ja-Hrkt: |-
        とくしゅな　ひょうざんや　がんせき
        マグマから　じぶんの　すがたに　にた
        ポケモンを　つくったと　いわれる。
      ja: |-
        特殊な　氷山や　岩石　マグマから
        自分の　姿に　似た　ポケモンを
        つくったと　言われる。
      ko: |-
        특수한 빙산이나 암석,
        마그마에서 자신의 모습과 닮은
        포켓몬을 만들었다고 전해진다.
      en: |-
        It is said to have made Pokémon that look like
        itself from a special ice mountain, rocks,
        and magma.
      fr: |-
        On dit qu’il a créé des Pokémon à son image à partir de glace,
        de roche et de magma.
      de: |-
        Man sagt, es habe Pokémon aus einem Eisberg, Felsen und
        Magma nach seinem Abbild geschaffen.
      es: |-
        Se dice que usó rocas, magma y un hielo especial de montaña
        para crear Pokémon con su aspecto.
      it: |-
        Si dice che abbia creato dei Pokémon simili a sé usando
        una montagna ghiacciata, rocce e magma.
    alpha-sapphire:
      ja-Hrkt: |-
        なわで　しばった　たいりくを
        ひっぱって　うごかしたという
        でんせつが　のこされている。
      ja: |-
        縄で　縛った　大陸を
        引っ張って　動かしたという
        伝説が　残されている。
      ko: |-
        밧줄로 묶은 대륙을
        당겨서 움직였다고 하는
        전설이 남아 있다.
      en: |-
        There is an enduring legend that states this
        Pokémon towed continents with ropes.
      fr: |-
        Une légende tenace veut que ce Pokémon ait traîné
        les continents en les attachant à des cordes.
      de: |-
        Es gibt eine Legende, wonach dieses Pokémon die Kontinente
        mit einem Seil gezogen hat.
      es: |-
        Una antigua leyenda afirma que este Pokémon arrastraba
        continentes con cuerdas.
      it: |-
        Una leggenda narra che questo Pokémon abbia trainato
        i continenti con delle funi.
    sword:
      ja-Hrkt: |-
        じぶんの　すがたに　にせて
        ポケモンを　つくった　でんせつが
        せかいじゅうに　のこされている。
      ja: |-
        自分の　姿に　似せて
        ポケモンを　作った　伝説が
        世界中に　残されている。
      ko: |-
        자신의 모습을 닮은
        포켓몬을 만들었다는 전설이
        온 세계에 남아 있다.
      zh-Hant: |-
        世界各地的傳說都有
        提到牠曾經模仿自己
        的樣子做出了寶可夢。
      zh-Hans: |-
        在世上流传着的传说中，
        它曾模仿自己的样子
        创造出过宝可梦。
      en: |-
        All over the world, there are legends that tell
        of Regigigas creating other Pokémon in its
        own image.
      fr: |-
        Plusieurs légendes à travers le monde
        racontent que Regigigas aurait créé
        des Pokémon à son image.
      de: |-
        Überall auf der Welt kursieren Legenden, denen
        zufolge Regigigas Pokémon nach seinem Abbild
        geschaffen habe.
      es: |-
        Existen leyendas en todo el mundo que narran
        como Regigigas creó otros Pokémon a su imagen
        y semejanza.
      it: |-
        In tutto il mondo esistono leggende che narrano
        di come Regigigas abbia creato dei Pokémon
        simili a sé.
    shield:
      ja-Hrkt: |-
        さまざまな　ざいりょうで　ポケモンを
        つくってから　たいりくを　げんざいの
        ばしょに　いどうさせたと　いわれる。
      ja: |-
        さまざまな　材料で　ポケモンを
        作ってから　大陸を　現在の
        場所に　移動させたと　いわれる。
      ko: |-
        다양한 재료로 포켓몬을
        만든 후 대륙을 지금의
        장소로 이동시켰다고 전해진다.
      zh-Hant: |-
        據說牠曾使用各種材料
        製作了寶可夢，然後把
        大陸移動到了現在的位置。
      zh-Hans: |-
        据说它用各种各样的材料
        制作了宝可梦后，把大陆
        移动到了现在的位置。
      en: |-
        It’s said that Regigigas created other Pokémon
        from many different materials before it moved
        the continents to where they are today.
      fr: |-
        On raconte qu’après avoir créé des Pokémon
        avec différentes matières, il aurait placé
        les continents à leur position actuelle.
      de: |-
        Man sagt, es habe aus verschiedenen Materialien
        Pokémon erschaffen und dann die Kontinente an
        ihren jetzigen Standort bewegt.
      es: |-
        Dicen que creó a otros Pokémon a partir de
        distintos materiales y que, después, colocó los
        continentes en su posición actual.
      it: |-
        Si narra che abbia spostato i continenti nella loro
        posizione attuale dopo aver creato dei Pokémon
        con vari materiali.
