    x:
      ja-Hrkt: |-
        しゅうだんで　ふねに　おそいかかり
        ふなぞこを　くいちぎり　しずめる。
        ジャングルの　かわに　せいそくする。
      ja: |-
        集団で　船に　襲いかかり
        船底を　食いちぎり　沈める。
        ジャングルの　川に　生息する。
      ko: |-
        집단으로 배를 공격해
        배의 밑바닥도 물어뜯어 가라앉힌다.
        정글의 강에 서식한다.
      en: |-
        They form packs to attack boats and rip out their
        hulls to sink them. They live in rivers in the jungle.
      fr: |-
        Il s’attaque en banc aux bateaux dont il dévore la
        coque. Les rivières de la jungle forment son habitat.
      de: |-
        Schwärme von Kanivanha haben in Dschungelflüssen
        schon so manches Boot zerbissen und versenkt.
      es: |-
        Atacan en grupo a los barcos y los hunden a base de
        bocados. Habitan en los ríos de la jungla.
      it: |-
        I Carvanha attaccano le navi in branco e ne strappano
        gli scafi a morsi. Abitano i fiumi della giungla.
    'y':
      ja-Hrkt: |-
        ジャングルを　ながれる　たいがに
        せいそく。なわばりに　まぎれこんだ
        えものを　しゅうだんで　おそう。
      ja: |-
        ジャングルを　流れる　大河に　生息。
        縄張りに　紛れこんだ　獲物を
        集団で　襲う。
      ko: |-
        정글을 흐르는 큰 강에 서식한다.
        영역에 섞여 들어온
        먹이를 집단으로 덮친다.
      en: |-
        It lives in massive rivers that course through
        jungles. It swarms prey that enter its territory.
      fr: |-
        Ce Pokémon vit dans les fleuves qui traversent les
        forêts tropicales. Il attaque en groupe ceux qui
        s’aventurent sur son territoire.
      de: |-
        Es lebt in reißenden Flüssen, die sich ihren Weg
        durch den Dschungel bahnen. Es fängt Beute,
        die sich in sein Gebiet wagt.
      es: |-
        Habita caudalosos ríos que atraviesan las junglas.
        Si alguien invade su territorio, acude con más de su
        especie.
      it: |-
        Vive in grandi fiumi che attraversano la giungla,
        lanciandosi in branco contro gli intrusi.
    omega-ruby:
      ja-Hrkt: |-
        はったつした　アゴと　するどく　とがった　キバは
        ふなぞこを　かみちぎる　ほどの　はかいりょく。
        キバニアに　おそわれ　しずんだ　ふねは　おおい。
      ja: |-
        発達した　アゴと　鋭く　とがった　キバは
        船底を　かみ千切る　ほどの　破壊力。
        キバニアに　襲われ　沈んだ　船は　多い。
      ko: |-
        발달한 턱과 날카롭고 뾰족한 이빨은
        배 밑바닥을 물어뜯을 정도의 파괴력을 지녔다.
        샤프니아에게 습격당해 가라앉은 배가 많다.
      en: |-
        Carvanha’s strongly developed jaws and its sharply pointed
        fangs pack the destructive power to rip out boat hulls.
        Many boats have been attacked and sunk by this Pokémon.
      fr: |-
        Les mâchoires surdéveloppées de Carvanha et ses crocs
        acérés sont si puissants qu’ils peuvent déchirer la coque
        des bateaux. De nombreux navires ont été attaqués
        et coulés par ce Pokémon.
      de: |-
        Kanivanhas starke Kiefer und seine spitzen Zähne verfügen
        über die zerstörerische Kraft, Bootsrümpfe verschlingen zu
        können. Dieses Pokémon hat schon viele Boote versenkt.
      es: |-
        Carvanha, gracias a las descomunales fauces de afilados
        colmillos que tiene, es capaz de hacer trizas un barco. Son
        muchas las naves que han sufrido el ataque de este Pokémon
        y han acabado naufragando.
      it: |-
        Le sviluppate mascelle di Carvanha e i denti estremamente
        appuntiti e affilati hanno una potenza distruttiva tale da
        sventrare la carena di una nave. Già molte navi sono state
        attaccate e affondate da questo Pokémon.
    alpha-sapphire:
      ja-Hrkt: |-
        テリトリーを　あらす　ものには　しゅうだんで
        おそいかかり　とがった　キバで　やつざきにする。
        １ぴきに　なると　とたんに　よわごしに　なるぞ。
      ja: |-
        テリトリーを　荒らす　ものには　集団で
        襲いかかり　とがった　キバで　八つ裂きにする。
        １匹に　なると　途端に　弱腰に　なるぞ。
      ko: |-
        영역을 침범하는 자는 집단으로
        덤벼들어 뾰족한 이빨로 갈가리 찢는다.
        혼자가 되면 바로 소극적인 모습을 보인다.
      en: |-
        If anything invades Carvanha’s territory, it will swarm and tear
        at the intruder with its pointed fangs. On its own, however, this
        Pokémon turns suddenly timid.
      fr: |-
        Si un intrus s’aventure sur le territoire des Carvanha, ils se
        ruent sur lui et le mordent à l’aide de leurs crocs acérés.
        En revanche, lorsqu’il est seul, ce Pokémon devient tout
        à coup très timide.
      de: |-
        Wenn jemand Kanivanhas Revier betritt, schwärmt es aus und
        schnappt mit seinen spitzen Zähnen nach dem Eindringling.
        Wenn es allein ist, ist dieses Pokémon sehr scheu.
      es: |-
        Si algo o alguien invade el territorio de los Carvanha, se
        acercarán en masa y harán trizas al intruso con los afilados
        colmillos. Sin embargo, cuando están en solitario, estos
        Pokémon se vuelven tímidos de repente.
      it: |-
        In caso di invasione del proprio territorio, i Carvanha si
        lanciano in branco contro gli intrusi annientandoli senza
        pietà. Preso singolarmente, invece, questo Pokémon diventa
        estremamente timido.
    sun:
      ja-Hrkt: |-
        むれごとに　テリトリーを　もっている。
        しんにゅうする　ものは　ようしゃなく
        キバを　むきだしにして　おそいかかる。
      ja: |-
        群れごとに　テリトリーを　持っている。
        侵入する　者は　容赦なく
        キバを　むきだしにして　襲いかかる。
      ko: |-
        무리별로 영역이 있다.
        침입하는 자는 봐주지 않고
        이빨을 드러내며 덤벼든다.
      zh-Hant: |-
        每個群體都擁有自己的地盤。
        對於入侵者，會毫不留情地
        露出牙齒發動攻擊。
      zh-Hans: |-
        每个群体都拥有自己的领地。
        对于入侵者，会毫不留情地
        露出牙齿发动袭击。
      en: |-
        Each school has its own territory. Any intruders
        are mercilessly attacked with fangs bared.
      fr: |-
        Il protège son territoire en se déplaçant en banc.
        Le moindre intrus est raccompagné sans pitié,
        à grands claquements de mâchoire.
      de: |-
        Schwärme von Kanivanha schützen ihr Revier,
        indem sie sich mit gefletschten Zähnen
        gnadenlos auf Eindringlinge stürzen.
      es: |-
        Cada banco de Carvanha tiene su propio
        territorio. En cuanto detectan a un intruso, sacan
        los dientes y lo atacan sin miramientos.
      it: |-
        I branchi di Carvanha difendono il territorio
        lanciandosi contro gli intrusi e attaccandoli
        con le zanne micidiali.
    moon:
      ja-Hrkt: |-
        わずかな　ちの　においを　かぎつけ
        しゅうだんで　えものを　おそう。
        １ぴきでは　けっこう　おくびょう。
      ja: |-
        わずかな　血の　匂いを　嗅ぎつけ
        集団で　獲物を　襲う。
        １匹では　結構　おくびょう。
      ko: |-
        아주 적은 피 냄새에도 먹이를 찾아내
        집단으로 먹이를 덮친다.
        1마리만 있으면 꽤 겁쟁이다.
      zh-Hant: |-
        能聞出些微的鮮血氣味，
        集體攻擊獵物。
        只有１隻的時候相當膽小。
      zh-Hans: |-
        即使一丝丝血的味道也能闻到，
        并以集群形式袭击猎物。
        但只有１只的话，就相当胆小。
      en: |-
        If they scent the faintest trace of blood, they
        rush to attack en masse. When alone, they’re
        rather cowardly.
      fr: |-
        En banc, il guette l’odeur du sang et fond sur
        sa proie sans aucune pitié. Seul, il se montre
        plus timoré.
      de: |-
        Wittert es auch nur einen Hauch von Blut,
        greift es im Schwarm seine Beute an.
        Alleine ist es hingegen ziemlich furchtsam.
      es: |-
        En cuanto huelen la menor cantidad de sangre,
        todo el grupo ataca a la presa, pero cuando van
        en solitario se amilanan fácilmente.
      it: |-
        In gruppo, questo Pokémon attacca le prede
        appena avverte odore di sangue.
        Da solo, invece, è molto timido.
    ultra-sun:
      ja-Hrkt: |-
        おくびょうで　１ぴきでは　かりも
        しない。　５ひき　くらい　あつまると
        きゅうに　きょうぼうに　なるぞ。
      ja: |-
        臆病で　１匹では　狩りも
        しない。　５匹　くらい　集まると
        急に　凶暴に　なるぞ。
      ko: |-
        겁이 많아 1마리일 때는 사냥도
        하지 않는다. 5마리 정도 모이면
        갑자기 흉포해진다.
      zh-Hant: |-
        個性膽小，只有１隻的話連狩獵
        也不敢去，但如果聚集了５隻左右
        就會一下子變得兇暴。
      zh-Hans: |-
        非常胆小，１只的话不会去狩猎。
        如果聚集了５只左右的话，
        就会一下子变得很粗暴。
      en: |-
        They’re such cowards that they won’t hunt
        alone. When five or so of them get together,
        they suddenly turn ferocious!
      fr: |-
        C’est un couard qui ne chasse jamais tout seul.
        Dès qu’il se retrouve dans un groupe de cinq,
        par contre, il devient on ne peut plus féroce !
      de: |-
        Dieses ängstliche Pokémon jagt nicht, wenn es
        allein ist. Aber sobald sich fünf von ihnen
        versammeln, geraten sie in Rage.
      es: |-
        Es algo timorato, por lo que nunca va solo. Pero,
        en cuanto se reúnen cinco ejemplares, de pronto
        se convierten en una fuerza de la naturaleza.
      it: |-
        È di indole timida e non va mai a caccia da solo,
        ma in un gruppo di quattro o cinque esemplari
        diventa molto feroce.
    ultra-moon:
      ja-Hrkt: |-
        じょうぶなアゴと　キバは　もくぞうの
        ふね　なら　かんたんに　かみくだく。
        エサをめぐり　バスラオと　あらそう。
      ja: |-
        丈夫なアゴと　キバは　木造の
        船　なら　簡単に　噛み砕く。
        エサを巡り　バスラオと　争う。
      ko: |-
        튼튼한 턱과 이빨은 나무로 만든
        배라면 간단하게 깨물어 부순다.
        먹이를 두고 배쓰나이와 싸운다.
      zh-Hant: |-
        結實的下巴和牙齒能夠
        輕易地咬碎木造的船隻。
        與野蠻鱸魚互相爭奪著食物。
      zh-Hans: |-
        结实的颚部和牙齿，如果是
        木头造的船，轻易就可以咬碎。
        围绕食物的问题，和野蛮鲈鱼争斗。
      en: |-
        With its sturdy jaws and fangs, it can easily
        chomp wooden boats to splinters. It fights with
        Basculin over food.
      fr: |-
        Grâce à sa mâchoire d’acier et ses dents
        acérées, il déchiquette sans peine les canots.
        Bargantua et lui se disputent le menu fretin.
      de: |-
        Mit seinem robusten Kiefer und starken Zähnen
        zerbeißt es mühelos Holzboote. Es streitet mit
        Barschuft um Futter.
      es: |-
        Puede destrozar a bocados fácilmente un barco
        de madera con sus potentes mandíbulas y
        colmillos. Compite por presas con los Basculin.
      it: |-
        Può frantumare una nave di legno usando le
        sue mascelle robuste e dai denti affilati.
        Si contende il cibo con i Basculin.
    sword:
      ja-Hrkt: |-
        えものを　みつけても　１ぴきのときは
        おそわない。　なかまが　くるのを
        まって　しゅうだんで　おそいかかる。
      ja: |-
        獲物を　見つけても　１匹のときは
        襲わない。　仲間が　来るのを　待って
        集団で　襲いかかる。
      ko: |-
        먹이를 발견해도 혼자일 때는
        공격하지 않는다. 동료가 오는 것을
        기다린 다음 집단으로 공격한다.
      zh-Hant: |-
        只有１隻時即使發現了獵物
        也不會發動攻擊。會等到
        夥伴來之後，再結隊襲擊。
      zh-Hans: |-
        即使发现猎物也不会单独
        发起攻击。会等待伙伴的
        到来，发动集体攻击。
      en: |-
        It won’t attack while it’s alone—not even if it
        spots prey. Instead, it waits for other Carvanha to
        join it, and then the Pokémon attack as a group.
      fr: |-
        Il ne s’attaque jamais à une proie tout seul,
        préférant attendre l’arrivée de ses congénères
        pour lancer l’assaut.
      de: |-
        Kanivanha jagt Beute nicht im Alleingang,
        sondern wartet auf seine Artgenossen, um mit
        ihnen im Schwarm anzugreifen.
      es: |-
        Nunca aborda a su presa en solitario, sino que
        espera a que lleguen sus semejantes para atacar
        en grupo.
      it: |-
        Se è da solo, non assale la preda.
        Preferisce aspettare i suoi compagni
        per attaccare in gruppo.
    shield:
      ja-Hrkt: |-
        するどい　キバと　たくましい　アゴを
        もつ。　ふなのりたちは　キバニアの
        すみかには　けっして　ちかづかない。
      ja: |-
        鋭い　キバと　たくましい　顎を
        もつ。　船乗りたちは　キバニアの
        すみかには　けっして　近づかない。
      ko: |-
        날카로운 이빨과 튼튼한 턱을
        갖고 있다. 선원들은 샤프니아
        거처에 결코 가까이 가지 않는다.
      zh-Hant: |-
        擁有銳利的牙齒和結實的
        下巴。船員們絕對不會去
        靠近利牙魚棲息的地方。
      zh-Hans: |-
        拥有锋利的牙齿和
        结实的下颚。水手们绝不会
        主动靠近利牙鱼的栖息地。
      en: |-
        These Pokémon have sharp fangs and powerful
        jaws. Sailors avoid Carvanha dens at all costs.
      fr: |-
        Il possède une mâchoire puissante garnie de
        dents acérées. Les marins ne s’approchent
        jamais des eaux habitées par les Carvanha.
      de: |-
        Es verfügt über äußerst spitze Zähne und kräftige
        Kiefer. Seefahrer meiden die Lebensräume von
        Kanivanha um jeden Preis.
      es: |-
        Los marineros evitan por completo las zonas
        donde habita este Pokémon de afilados colmillos
        y fuertes mandíbulas.
      it: |-
        È dotato di denti affilati e mascelle robuste.
        Chi viaggia per mare si tiene accuratamente
        alla larga dalle tane di Carvanha.
