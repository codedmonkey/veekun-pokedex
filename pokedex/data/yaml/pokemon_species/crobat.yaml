crobat:
  base_happiness: 50
  capture_rate: 90
  color: purple
  egg_groups:
    - flying
  evolution_chain: zubat
  evolves_from: golbat
  flavor_text:
    gold:
      en: |-
        It flies so si­
        lently through the
        dark on its fourwings that it may
        not be noticed
        even when nearby.
    silver:
      en: |-
        The development of
        wings on its legs
        enables it to flyfast but also
        makes it tough to
        stop and rest.
    crystal:
      en: |-
        As a result of its
        pursuit of faster,
        yet more silentflight, a new set
        of wings grew on
        its hind legs.
    ruby:
      en: |-
        If this POKéMON is flying by fluttering
        only a pair of wings on either the
        forelegs or hind legs, it’s proof thatCROBAT has been flying a long distance.
        It switches the wings it uses if it is
        tired.
    sapphire:
      en: |-
        CROBAT sneaks up on its intended prey
        using wings that barely make a sound.
        This POKéMON rests by hanging on atree branch with its rear legs that
        serve as wings.
    emerald:
      en: |-
        Over the course of evolution, its hind legs
        turned into wings. By alternately resting
        its front and rear wings, it can fly all day
        without having to stop.
    firered:
      en: |-
        The development of wings on its legs
        enables it to fly fast but also makes it
        tough to stop and rest.
    leafgreen:
      en: |-
        It flies so silently through the dark on
        its four wings that it may not be noticed
        even when nearby.
    diamond:
      en: |-
        Having four wings enables it to fly
        faster and more quietly. It turns
        active when the night comes.
    pearl:
      en: |-
        A Pokémon that gained vastly
        enhanced flying performance by
        having its legs turn into wings.
    platinum:
      en: |-
        The transformation of its legs into
        wings made it better at flying, but
        more clumsy at walking.
    heartgold:
      en: |-
        It flies so silently through the
        dark on its four wings that it may
        not be noticed even when nearby.
    soulsilver:
      en: |-
        The development of wings on its legs
        enables it to fly fast but also
        makes it tough to stop and rest.
    black:
      en: |-
        The transformation of its legs into
        wings made it better at flying, but
        more clumsy at walking.
      fr: |-
        La transformation de ses pattes en
        ailes a certes amélioré sa capacité
        à voler, mais pas à marcher.
    white:
      en: |-
        The transformation of its legs into
        wings made it better at flying, but
        more clumsy at walking.
      fr: |-
        La transformation de ses pattes en
        ailes a certes amélioré sa capacité
        à voler, mais pas à marcher.
    black-2:
      en: |-
        Having four wings allows it to fly more
        quickly and quietly so it can sneak up
        on prey without its noticing.
    white-2:
      en: |-
        Having four wings allows it to fly more
        quickly and quietly so it can sneak up
        on prey without its noticing.
    x:
      ja-Hrkt: |-
        ４まいに　ふえた　つばさで
        くらやみを　しずかに　とんでいく。
        となりを　とおられても　きづかない。
      ja: |-
        ４枚に　増えた　翼で
        暗闇を　静かに　飛んでいく。
        となりを　通られても　気づかない。
      ko: |-
        4장으로 수가 늘어난 날개로
        어둠 속을 조용히 날아간다.
        주위를 지나쳐도 눈치채지 못한다.
      en: |-
        It flies so silently through the dark on its four wings
        that it may not be noticed even when nearby.
      fr: |-
        Il vole en silence dans l’obscurité à l’aide de ses
        quatre ailes. On ne l’entend pas, même s’il est très
        proche.
      de: |-
        Mit seinen vier Flügeln fliegt es so geräuschlos
        durch die Nacht, dass man es nicht bemerkt.
      es: |-
        Es tan silencioso cuando vuela en la oscuridad con sus
        cuatro alas, que cuesta percibirlo cuando se acerca.
      it: |-
        Vola nel buio con le sue quattro ali in modo talmente
        silenzioso che è difficile notarlo anche se è vicino.
    'y':
      ja-Hrkt: |-
        ４まいに　ふえた　はねを　つかい
        さらに　はやく　しずかに　とんで
        えものに　きづかれず　しのびよる。
      ja: |-
        ４枚に　増えた　羽を　使い
        さらに　速く　静かに　飛んで
        獲物に　気づかれず　忍びよる。
      ko: |-
        4장으로 늘어난 날개를 사용하여
        더욱 빠르고 조용하게 날아
        먹이가 눈치채지 않게 살며시 다가간다.
      en: |-
        Having four wings allows it to fly more quickly and
        quietly so it can sneak up on prey without
        its noticing.
      fr: |-
        Ses quatre ailes lui permettent de voler furtivement
        pour approcher ses proies sans les effrayer.
      de: |-
        Dank seiner vier Flügel kann es sich seiner Beute
        noch schneller und leiser nähern, ohne dabei
        bemerkt zu werden.
      es: |-
        Al contar con cuatro alas, puede acechar de manera
        más rápida y sigilosa a sus presas sin que estas lo
        perciban.
      it: |-
        Con il secondo paio d’ali ottenuto dall’evoluzione,
        vola verso le prede in modo ancora più veloce e
        silenzioso.
    omega-ruby:
      ja-Hrkt: |-
        うでか　あしの　どちらかだけで　はばたいている
        ときは　ながい　きょりを　とんでいる　しょうこ。
        つかれると　はばたく　ハネを　かえるのだ。
      ja: |-
        腕か　足の　どちらかだけで　羽ばたいている
        ときは　長い　距離を　飛んでいる　証拠。
        疲れると　羽ばたく　ハネを　変えるのだ。
      ko: |-
        팔이나 다리 어느 한쪽만으로 날갯짓할
        때는 긴 거리를 날고 있다는 증거다.
        지치면 날갯짓하는 날개를 바꾼다.
      en: |-
        If this Pokémon is flying by fluttering only a pair of wings on
        either the forelegs or hind legs, it’s proof that Crobat has been
        flying a long distance. It switches the wings it uses if it is tired.
      fr: |-
        Lorsque Nostenfer vole depuis longtemps, il utilise ses ailes
        antérieures ou postérieures en alternance. Il peut aisément
        changer de paire d’ailes lorsqu’il est fatigué.
      de: |-
        Wenn Iksbat fliegt, indem es entweder das vordere oder
        das hintere Paar Flügel bewegt, ist dies ein Anzeichen dafür,
        dass dieses Pokémon bereits eine lange Strecke hinter sich
        hat. Dann wechselt es die Flügel häufig.
      es: |-
        Cuando este Pokémon vuela batiendo solo las alas delanteras
        o traseras, es porque lleva volando bastante tiempo. Cuando
        se cansa, Crobat alterna las alas.
      it: |-
        Quando Crobat vola agitando soltanto un paio d’ali, quelle
        anteriori o quelle posteriori, significa che ha affrontato
        un volo molto lungo. Infatti, se è stanco cambia le ali
        che sta usando.
    alpha-sapphire:
      ja-Hrkt: |-
        みみを　すまさないと　きこえないほど　ちいさな
        はおとで　ねらった　えものに　しのびよるぞ。
        うしろあしの　ハネで　えだに　つかまり　やすむ。
      ja: |-
        耳を　すまさないと　聞こえないほど　小さな
        羽音で　ねらった　獲物に　忍び寄るぞ。
        後ろ足の　ハネで　枝に　つかまり　休む。
      ko: |-
        귀를 기울이지 않으면 들리지 않을 정도로 작은
        날갯소리로 노린 먹이에게 살며시 다가간다.
        뒷다리의 날개로 가지를 붙잡고 쉰다.
      en: |-
        Crobat sneaks up on its intended prey using wings that barely
        make a sound. This Pokémon rests by hanging on a tree
        branch with its rear legs that serve as wings.
      fr: |-
        Nostenfer s’approche discrètement de sa proie grâce à
        ses ailes silencieuses. Ce Pokémon se repose en s’accrochant
        à une branche avec ses pattes arrière, qui peuvent aussi lui
        servir d’ailes.
      de: |-
        Iksbats Flügelschlag ist so leise, dass die Beute lautlos
        überrascht wird. Dieses Pokémon ruht sich aus, indem es
        sich mit seinen Hinterbeinen an einen Ast hängt.
      es: |-
        Crobat se acerca hasta su posible presa usando las alas casi
        sin hacer ruido. La forma de descansar que tiene es colgarse
        de la rama de un árbol por las patas traseras.
      it: |-
        Crobat si avvicina furtivo alla preda con le sue ali
        silenziosissime. Questo Pokémon si riposa aggrappato ai rami
        degli alberi con le zampe posteriori, che servono anche da ali.
    sun:
      ja-Hrkt: |-
        りょうあしも　はねになった　けっか
        ちじょうでの　うごきは　にがて。
        はいずりまわることしか　できない。
      ja: |-
        両足も　羽になった　結果
        地上での　動きは　苦手。
        はいずりまわることしか　できない。
      ko: |-
        양발이 날개가 된 결과
        지상에서 움직이는 것이 서툴다.
        기어 돌아다니는 것밖에 못 한다.
      zh-Hant: |-
        因為連雙腳也變成翅膀，
        所以不擅長在地上行動，
        只能到處爬行。
      zh-Hans: |-
        连双脚也变成翅膀的结果
        就是不擅长在地上行动。
        只能爬着到处活动。
      en: |-
        Both its legs became wings, and as a result,
        it can’t move well on the ground. All it can do
        is crawl around.
      fr: |-
        Comme ses pattes sont devenues des ailes,
        il a du mal à se mouvoir sur terre. Il ne peut
        que se traîner péniblement au sol.
      de: |-
        Es kann sich nur schwer am Boden fortbewegen,
        da aus seinen zwei Beinen Flügel geworden sind.
        Daher ist es nur zu Kriechbewegungen fähig.
      es: |-
        Tiene una movilidad muy reducida en el suelo, ya
        que sus patas se transformaron en alas. La
        única opción que le queda es arrastrarse.
      it: |-
        Le sue zampe si sono trasformate in ali,
        rendendolo molto goffo negli spostamenti a
        terra, dove ormai può avanzare solo strisciando.
    moon:
      ja-Hrkt: |-
        ４まいのハネで　はやくしずかに　とぶ。
        きづかれるまえに　えものを　ガブリ。
        あっというまに　ちを　ぬきさるぞ。
      ja: |-
        ４枚の羽で　速く静かに　飛ぶ。
        気づかれる前に　獲物を　ガブリ。
        あっというまに　血を　抜き去るぞ。
      ko: |-
        4장의 날개로 빠르고 조용하게 난다.
        눈치채기 전에 먹이를 덥석 문다.
        순식간에 피를 뽑아낸다.
      zh-Hant: |-
        用４隻翅膀快速而安靜地飛行。
        在被發現之前一口咬住獵物，
        一瞬間把血吸得乾乾淨淨。
      zh-Hans: |-
        用４根翅膀又快又静地飞行。
        在被发现之前一口咬住猎物。
        一瞬间就把血都吸掉。
      en: |-
        Silent and swift in its four-winged flight, it bites
        down on its prey before they realize what’s
        happening. In a heartbeat, it drains their blood.
      fr: |-
        Il vole vite et sans bruit grâce à ses quatre
        ailes, mord sa proie sans se faire remarquer,
        et disparaît aussi vite, la laissant exsangue.
      de: |-
        Mit seinen vier Flügeln kann es schnell und leise
        fliegen. Ehe seine Beute sich versieht, hat es sie
        schon gebissen und ihr alles Blut ausgesaugt.
      es: |-
        Puede volar rápida y sigilosamente gracias a sus
        cuatro alas. Se abalanza sobre sus presas y les
        chupa toda la sangre antes de que se percaten.
      it: |-
        Vola rapido e silenzioso grazie alle sue quattro
        ali. Azzanna l’ignara preda e fugge via in un
        baleno lasciandola esangue.
    ultra-sun:
      ja-Hrkt: |-
        キバが　するどいので　くらやみで
        かまれ　ちを　すわれても　いたみが
        なくて　すぐに　きが　つかない。
      ja: |-
        キバが　鋭いので　暗闇で
        噛まれ　血を　吸われても　痛みが
        なくて　すぐに　気が　つかない。
      ko: |-
        이빨이 예리해서 어둠 속에서 물려
        피를 빨려도 통증이 없기 때문에
        금세 알아차리지 못한다.
      zh-Hant: |-
        牙齒很銳利，就算在黑暗中被牠
        咬住吸血，也會因感覺不到疼痛
        而無法立刻發現。
      zh-Hans: |-
        牙齿锋利，就算在黑暗中被它
        咬住吸血也不会感到疼痛，
        所以无法立刻发觉。
      en: |-
        Its fangs are so sharp, if it bites you in the dark
        and sucks your blood, you won’t notice any pain
        or realize you’ve been bitten.
      fr: |-
        Ses crocs sont si acérés qu’il peut sucer
        le sang de ses proies dans l’obscurité sans
        même qu’elles s’en rendent compte.
      de: |-
        Iksbat hat sehr scharfe Zähne, sodass seine
        Beute oft nichts davon merkt, wenn es in der
        Dunkelheit zubeißt und ihr Blut aussaugt.
      es: |-
        Sus colmillos son tan afilados que su mordedura
        resulta indolora y puede chupar la sangre a sus
        presas en la oscuridad sin que se percaten.
      it: |-
        Succhia il sangue alle sue vittime nell’oscurità.
        Le sue zanne sono così affilate che i suoi morsi
        sono indolori e le vittime non se ne accorgono.
    ultra-moon:
      ja-Hrkt: |-
        ひとや　ポケモンの　いきちが　エサ。
        すこし　すわないで　いるだけで
        よわって　とべなくなって　しまう。
      ja: |-
        人や　ポケモンの　生き血が　エサ。
        少し　吸わないで　いるだけで
        弱って　飛べなくなって　しまう。
      ko: |-
        사람이나 포켓몬의 피가 먹이다.
        잠시만 피를 빨지 않아도
        약해져서 날지 못하게 되어 버린다.
      zh-Hant: |-
        主食是人和寶可夢的鮮血。
        只要一小段時間沒吸血，
        就會衰弱到無法飛行。
      zh-Hans: |-
        人和宝可梦的鲜血是其食物。
        只要不吸上一口，
        就会衰弱得无法飞行。
      en: |-
        It feeds on the blood of living people and
        Pokémon. If it can’t drink any blood for even a
        short while, it becomes weak and unable to fly.
      fr: |-
        Il se nourrit du sang frais d’humains et de
        Pokémon. S’il en manque ne serait-ce qu’un
        instant, il s’affaiblit et ne peut plus voler.
      de: |-
        Frisches Blut von Menschen und Pokémon ist
        seine Nahrung. Ohne konstanten Nachschub
        wird es schwach und kann nicht mehr fliegen.
      es: |-
        Se alimenta de sangre fresca de humanos y
        Pokémon. Debe alimentarse constantemente o,
        de lo contrario, se vuelve débil y no puede volar.
      it: |-
        Si nutre del sangue di persone e Pokémon.
        Se rimane senza anche solo per poco, si
        indebolisce al punto di non riuscire più a volare.
    sword:
      ja-Hrkt: |-
        りょうあしが　ハネに　へんか。
        おとを　たてずに　こうそくで　とび
        エモノの　うなじに　キバを　たてる。
      ja: |-
        両足が　羽に　変化。
        音を　たてずに　高速で　飛び
        獲物の　うなじに　キバを　たてる。
      ko: |-
        양발이 날개로 변화했다.
        소리를 내지 않고 고속으로 날아
        먹이의 목덜미에 이빨을 꽂는다.
      zh-Hant: |-
        雙腳變成了翅膀。
        能夠無聲無息地高速飛行，
        用獠牙咬住獵物的後頸。
      zh-Hans: |-
        双脚变成了翅膀。
        可以悄无声息地高速飞行，
        亮出牙齿咬向猎物的后颈。
      en: |-
        Both of its legs have turned into wings. Without a
        sound, Crobat flies swiftly toward its prey and
        sinks its fangs into the nape of its target’s neck.
      fr: |-
        Ses pattes sont devenues des ailes.
        Il fond sur sa proie furtivement puis
        plante ses crocs dans sa nuque.
      de: |-
        Seine zwei Beine wurden zu Flügeln. Es fliegt
        schnell und lautlos zu seiner Beute, um ihr dann
        die Zähne in den Nacken zu bohren.
      es: |-
        Sus patas se han convertido en alas. Se lanza
        sobre su presa en un vuelo silencioso a alta
        velocidad y le clava los colmillos en la nuca.
      it: |-
        Le due zampe si sono mutate in ali. Vola verso la
        preda ad alta velocità senza fare alcun rumore
        e le affonda le zanne nella nuca.
    shield:
      ja-Hrkt: |-
        ４まいの　ハネを　じざいに　あやつり
        はばたく。　せまい　どうくつでも
        スピードを　おとさず　とびまわれる。
      ja: |-
        ４枚の　羽を　自在に　操り
        羽ばたく。　狭い　洞窟でも
        スピードを　落とさず　飛びまわれる。
      ko: |-
        4장의 날개를 자유자재로 움직이며
        날갯짓한다. 좁은 동굴에서도
        속도를 늦추지 않고 날아다닐 수 있다.
      zh-Hant: |-
        能夠自在地控制４隻翅膀
        振翅飛翔。即使是在狹窄的
        洞窟裡也能毫不減速地飛舞。
      zh-Hans: |-
        可以自由地控制４根翅膀
        振翅而飞。即使在狭窄的
        洞窟内也能保持速度飞来飞去。
      en: |-
        This Pokémon flaps its four wings skillfully.
        Crobat can fly through cramped caves without
        needing to slow down.
      fr: |-
        Il vole en contrôlant librement ses quatre ailes
        et peut se déplacer sans avoir besoin de ralentir,
        même dans les grottes étroites.
      de: |-
        Seine vier Flügel können unabhängig voneinander
        schlagen. So vermag es auch in engen Höhlen
        ohne Geschwindigkeitsverlust umherzufliegen.
      es: |-
        Controla de forma independiente cada una de
        sus cuatro alas. Puede revolotear por cuevas
        estrechas sin aminorar la velocidad.
      it: |-
        Vola controllando indipendentemente le sue
        quattro ali. Non riduce la velocità nemmeno
        nelle caverne più anguste.
    legends-arceus:
      en: |-
        Its hind limbs have become another set of wings. Crobat
        expertly maneuvers its four wings to dart in exquisite fashion
        through even the most confined caves without losing any speed.
