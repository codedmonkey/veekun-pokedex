goldeen:
  base_happiness: 50
  capture_rate: 225
  color: red
  egg_groups:
    - water2
  evolution_chain: goldeen
  evolves_from: ~
  flavor_text:
    red:
      en: |-
        Its tail fin
        billows like an
        elegant ballroomdress, giving it
        the nickname of
        the Water Queen.
    blue:
      en: |-
        Its tail fin
        billows like an
        elegant ballroomdress, giving it
        the nickname of
        the Water Queen.
    yellow:
      en: |-
        When it is time
        for them to lay
        eggs, they can beseen swimming up
        rivers and falls
        in large groups.
    gold:
      en: |-
        Its dorsal, pecto­
        ral and tail fins
        wave elegantly inwater. That is why
        it is known as the
        water dancer.
    silver:
      en: |-
        A strong swimmer,
        it is capable of
        swimming nonstopup fast streams at
        a steady speed of
        five knots.
    crystal:
      en: |-
        During spawning
        season, they swim
        gracefully in thewater, searching
        for their perfect
        mate.
    ruby:
      en: |-
        GOLDEEN is a very beautiful POKéMON
        with fins that billow elegantly in water.
        However, don’t let your guard downaround this POKéMON - it could ram you
        powerfully with its horn.
    sapphire:
      en: |-
        GOLDEEN loves swimming wild and free
        in rivers and ponds.
        If one of these POKéMON is placed in anaquarium, it will shatter even the
        thickest glass with one ram of its horn
        and make its escape.
    emerald:
      en: |-
        In the springtime, schools of GOLDEEN
        can be seen swimming up falls and rivers.
        It metes out staggering damage with its
        single horn.
    firered:
      en: |-
        Its dorsal and pectoral fins are strongly
        developed like muscles. It can swim at a
        speed of five knots.
    leafgreen:
      en: |-
        Its tail fin billows like an elegant
        ballroom dress, giving it the nickname of
        “The Water Queen.”
    diamond:
      en: |-
        It swims elegantly by flittering
        its tail fin as if it were a dress.
        It has the look of a queen.
    pearl:
      en: |-
        It swims at a steady 5 knots.
        If it senses danger, it will strike
        back with its sharp horn.
    platinum:
      en: |-
        Though it appears very elegant
        when swimming with fins unfurled, it
        can jab powerfully with its horn.
    heartgold:
      en: |-
        Its dorsal, pectoral and tail fins
        wave elegantly in water. That is why
        it is known as the water dancer.
    soulsilver:
      en: |-
        A strong swimmer, it is capable of
        swimming nonstop up fast streams at
        a steady speed of five knots per hour.
    black:
      en: |-
        Though it appears very elegant
        when swimming with fins unfurled, it
        can jab powerfully with its horn.
      fr: |-
        Malgré son élégance quand il
        nage, ses coups de corne sont
        redoutables.
    white:
      en: |-
        Though it appears very elegant
        when swimming with fins unfurled, it
        can jab powerfully with its horn.
      fr: |-
        Malgré son élégance quand il
        nage, ses coups de corne sont
        redoutables.
    black-2:
      en: |-
        Though it appears very elegant
        when swimming with fins unfurled, it
        can jab powerfully with its horn.
    white-2:
      en: |-
        Though it appears very elegant
        when swimming with fins unfurled, it
        can jab powerfully with its horn.
    x:
      ja-Hrkt: |-
        ５ノットの　スピードで　およぐ。
        みの　きけんを　かんじると
        するどい　ツノで　はんげきする。
      ja: |-
        ５ノットの　スピードで　泳ぐ。
        身の　危険を　感じると
        鋭い　ツノで　反撃する。
      ko: |-
        5노트의 스피드로 헤엄친다.
        몸에 위험을 느끼면
        날카로운 뿔로 반격한다.
      en: |-
        It swims at a steady 5 knots. If it senses danger,
        it will strike back with its sharp horn.
      fr: |-
        Il nage à 5 nœuds. Quand on l’agresse, il réplique
        d’un bon coup de corne aiguisée.
      de: |-
        Es schwimmt mit fünf Knoten. Wird es angegriffen,
        wehrt es sich mit seinem scharfen Horn.
      es: |-
        Nada a una velocidad de cinco nudos. Si siente
        peligro, golpea con su afilado cuerno.
      it: |-
        Nuota alla velocità di 5 nodi. Se avverte il pericolo,
        contrattacca con il suo corno aguzzo.
    'y':
      ja-Hrkt: |-
        せびれ　むなびれ　おびれが
        ゆうがに　たなびくので
        みずのおどりこ　とよばれる。
      ja: |-
        背びれ　胸びれ　尾びれが
        優雅に　たなびくので
        水の踊り子　と呼ばれる。
      ko: |-
        등, 가슴, 꼬리지느러미가
        우아하게 나부끼기 때문에
        물의 무희라고 불린다.
      en: |-
        Its dorsal, pectoral, and tail fins wave elegantly in
        water. That is why it is known as the water dancer.
      fr: |-
        Ses nageoires dorsales et pectorales bougent avec
        élégance. Il est surnommé le danseur des flots.
      de: |-
        Seine Brust-, Rücken- und Schweifflossen sehen
        anmutig aus. Daher nennt man es den „Wassertänzer“.
      es: |-
        Sus aletas dorsal, trasera y pectoral ondean gráciles
        en el agua. Por eso es llamado el Bailarín Acuático.
      it: |-
        Le pinne su dorso, petto e coda ondulano con grazia
        in acqua. Per questo lo chiamano “danzatore d’acqua”.
    omega-ruby:
      ja-Hrkt: |-
        すいちゅうで　ゆうがに　たなびく　ひれが　とても
        うつくしい　ポケモンだが　ゆだんを　していると
        きょうれつな　ツノの　ひとつきを　くらうぞ。
      ja: |-
        水中で　優雅に　棚引く　ひれが　とても
        美しい　ポケモンだが　油断を　していると
        強烈な　ツノの　一突きを　くらうぞ。
      ko: |-
        물속에서 우아하게 나부끼는 지느러미가 매우
        아름다운 포켓몬이지만 방심하고 있으면
        강렬한 뿔의 일격을 당한다.
      en: |-
        Goldeen is a very beautiful Pokémon with fins that billow
        elegantly in water. However, don’t let your guard down around
        this Pokémon—it could ram you powerfully with its horn.
      fr: |-
        Poissirène est un Pokémon magnifique doté de nageoires
        qui ondulent élégamment dans les profondeurs. Il ne faut
        pourtant pas baisser sa garde face à ce Pokémon, car il peut
        charger avec sa puissante corne.
      de: |-
        Goldini ist ein wunderschönes Pokémon, dessen Flossen
        sich elegant im Wasser wiegen. Aber man muss auf dieses
        Pokémon achtgeben. Es könnte einen sonst heftig mit
        seinem Horn rammen.
      es: |-
        Goldeen es un bello Pokémon que mueve con elegancia las
        aletas en el agua. Con todo, no hay que bajar la guardia, en
        cualquier momento puede embestir con el cuerno.
      it: |-
        Goldeen è un Pokémon molto elegante dai movimenti
        aggraziati. Tuttavia, è necessario stare attenti poiché
        potrebbe attaccare violentemente con il suo corno.
    alpha-sapphire:
      ja-Hrkt: |-
        かわや　いけを　およぐ　ことが　だいすきなので
        すいそう　なんかに　いれていたら　ぶあつい
        ガラスも　ツノの　ひとつきで　わって　にげるぞ。
      ja: |-
        川や　池を　泳ぐ　ことが　大好きなので
        水槽　なんかに　入れていたら　ぶ厚い
        ガラスも　ツノの　一突きで　割って　逃げるぞ。
      ko: |-
        강이나 연못을 헤엄치는 것을 매우 좋아해서
        수조 같은 곳에 넣어 두면 두꺼운
        유리도 뿔의 일격으로 깨고 도망간다.
      en: |-
        Goldeen loves swimming wild and free in rivers and ponds.
        If one of these Pokémon is placed in an aquarium, it will
        shatter even the thickest glass with one ram of its horn
        and make its escape.
      fr: |-
        Poissirène adore nager librement dans les rivières et
        les étangs. Si l’un de ces Pokémon est mis dans un aquarium,
        il n’hésitera pas à casser la vitre avec sa puissante corne pour
        s’enfuir.
      de: |-
        Goldini liebt es, in Teichen und Flüssen zu schwimmen.
        Wenn ein solches Pokémon in ein Aquarium gebracht wird,
        wird es selbst das dickste Glas mit einem Stoß seines Horns
        zum Zerbersten bringen und die Flucht ergreifen.
      es: |-
        A Goldeen le encanta nadar libremente y a su aire en ríos y
        estanques. Si pones a uno de estos Pokémon en un acuario,
        usará el cuerno que tiene para romper las paredes,
        independientemente del grosor del cristal, y escapar.
      it: |-
        Goldeen ama nuotare libero in fiumi e laghetti. Se messo
        in acquario, questo Pokémon riesce a fuggire spaccando
        anche il vetro più spesso con un colpo secco del suo corno.
    sun:
      ja-Hrkt: |-
        あたたかくなってくると　むれをなし
        かわを　さかのぼる。　そのこうけいは
        はるを　つげる　ふうぶつしだ。
      ja: |-
        暖かくなってくると　群れをなし
        川を　さかのぼる。　その光景は
        春を　告げる　風物詩だ。
      ko: |-
        따뜻해지면 무리를 지어
        강을 거슬러 올라간다. 그 광경은
        봄을 알리는 풍물시이다.
      zh-Hant: |-
        天氣變得暖和之後，
        就會成群結隊溯流而上。
        那畫面正如宣告春天來臨的風景詩。
      zh-Hans: |-
        天气变得暖和之后，
        就会成群结队溯流而上。
        那画面正如告知春天的风景诗。
      en: |-
        When the weather grows warm, they form
        groups and swim upriver. This sight serves
        as a poetic reminder that spring has arrived.
      fr: |-
        À la fin de l’hiver, des bancs de Poissirène
        remontent les fleuves. Ce spectacle annonce
        traditionnellement l’arrivée du printemps.
      de: |-
        Wenn es warm wird, bilden sie Schwärme und
        schwimmen stromaufwärts. Dies ist ein Zeichen
        dafür, dass der Frühling herannaht.
      es: |-
        Cuando el tiempo se vuelve más cálido, se
        agrupan y nadan río arriba. Este espectáculo tan
        poético anuncia la llegada de la primavera.
      it: |-
        Quando la temperatura comincia ad alzarsi,
        forma un banco con i suoi simili e inizia a risalire
        i fiumi, annunciando così l’inizio della primavera.
    moon:
      ja-Hrkt: |-
        ツノの　ながさ　ひれの　うつくしさに
        みせられ　トサキントしか　そだてない
        おつな　トレーナーも　おおいのだ。
      ja: |-
        角の　長さ　ヒレの　美しさに
        魅せられ　トサキント　しか育てない
        乙な　トレーナーも　多いのだ。
      ko: |-
        뿔의 길이와 지느러미의 아름다움에
        매혹되어 콘치만 키우게 되는
        특이한 트레이너도 많다.
      zh-Hant: |-
        被角的長度和魚鰭的美麗所迷住，
        因而只培育角金魚的
        風雅訓練家也是很多的。
      zh-Hans: |-
        被角的长度和鱼鳍的美丽而迷住，
        只培育角金鱼的
        风雅训练家也是很多的。
      en: |-
        Spellbound by the length of its horn and the
        beauty of its fins, many strange Trainers raise
        Goldeen and nothing but Goldeen.
      fr: |-
        Séduits par la longueur de sa corne et la beauté
        de ses nageoires, de nombreux Dresseurs
        esthètes n’élèvent plus que des Poissirène.
      de: |-
        Einige Trainer sind von seinem langem Horn
        und seiner Eleganz so entzückt, dass sie
        ausschließlich Goldini trainieren.
      es: |-
        Hay muchos Entrenadores que, fascinados por
        el tamaño de su cuerno y la belleza de sus
        aletas, entrenan únicamente Goldeen.
      it: |-
        Molti Allenatori dai gusti raffinati allenano solo
        i Goldeen, affascinati dal loro lungo corno
        e dalle bellissime pinne.
    ultra-sun:
      ja-Hrkt: |-
        うつくしい　おびれが　とくちょうだが
        トサキントどうしは　ツノの　ふとさと
        するどさを　きそいあっているらしい。
      ja: |-
        美しい　尾びれが　特徴だが
        トサキント同士は　ツノの　太さと
        鋭さを　競い合っているらしい。
      ko: |-
        아름다운 꼬리지느러미가 특징이지만
        콘치끼리는 뿔의 굵기와
        날카로움을 겨루는 듯 하다.
      zh-Hant: |-
        特徵是美麗的尾鰭，
        但角金魚們之間競爭的
        似乎是角的粗細和尖銳度。
      zh-Hans: |-
        虽然漂亮的尾鳍是其特征，
        但角金鱼之间好像会比
        谁的角更粗更尖锐。
      en: |-
        Although known for their splendid tail fins,
        Goldeen apparently compete among themselves
        to see whose horn is thickest and sharpest.
      fr: |-
        Prisés pour la beauté de leur nageoire caudale,
        les Poissirène rivalisent quant à eux pour savoir
        qui a la corne la plus épaisse et la plus acérée.
      de: |-
        Es ist für seine schöne Schwanzflosse bekannt.
        Miteinander wetteifern sie aber darum, wer das
        dickste und spitzeste Horn auf dem Kopf hat.
      es: |-
        La hermosa aleta caudal es su rasgo distintivo,
        pero por lo que compiten los propios Goldeen es
        por lucir el cuerno más grueso y afilado.
      it: |-
        È famoso per le sue splendide pinne caudali.
        Sembra che competa con i suoi simili per
        stabilire chi ha il corno più spesso e affilato.
    ultra-moon:
      ja-Hrkt: |-
        ドレスの　ような　ヒレを　ひらひらと
        ゆらしながら　およぐ　すがたから
        みずの　プリンセスと　よばれる。
      ja: |-
        ドレスの　ような　ヒレを　ひらひらと
        揺らしながら　泳ぐ　姿から
        水の　プリンセスと　呼ばれる。
      ko: |-
        드레스 같은 지느러미를 하늘하늘
        흔들면서 헤엄치는 모습 때문에
        물의 프린세스라고 불린다.
      zh-Hant: |-
        會輕飄飄地搖擺著
        像裙子一樣的鰭來游動，
        所以牠被稱為水中公主。
      zh-Hans: |-
        会飘飘然地摇摆着
        像裙子一样的鱼鳍游动，
        所以它被称为水中公主。
      en: |-
        The way it swims along fluttering its dress-like
        fins has earned it the name “princess of
        the water.”
      fr: |-
        La beauté de ses nageoires, qu’il agite telle
        une robe de bal, lui a valu le surnom de
        « princesse des eaux ».
      de: |-
        Beim Schwimmen flattern seine Flossen wie ein
        Kleid, was ihm eine märchenhafte Ausstrahlung
        verleiht. Man nennt es auch „Wasserprinzessin“.
      es: |-
        Al nadar, sus hermosas aletas ondean gráciles
        cual vestido de gala, lo que le ha merecido el
        apodo de Princesa de los Mares.
      it: |-
        Quando nuota, le sue pinne fluttuano dolcemente
        come un vestito da ballo. Da questo deriva il suo
        soprannome “principessa delle acque”.
    lets-go-pikachu:
      ja-Hrkt: |-
        タマゴをうむ　じきになると　かわや
        たきを　のぼってくる　トサキントの
        しゅうだんの　すがたが　みられる。
      ja: |-
        タマゴをうむ　時季になると　川や
        滝を　のぼってくる　トサキントの
        集団の　姿が　見られる。
      ko: |-
        알을 낳을 때가 되면 강이나
        폭포를 오르는 콘치 무리의
        모습을 볼 수 있다.
      zh-Hant: |-
        每到角金魚產卵的時期，
        就能看見牠們成群結隊
        從河川和瀑布逆流而上。
      zh-Hans: |-
        到了产卵期你就可以
        看到成群的角金鱼
        逆流而行或是攀登瀑布。
      en: |-
        When it is time for them to lay eggs, they
        can be seen swimming up rivers and falls
        in large groups.
      fr: |-
        Quand vient la saison de ponte des Poissirène,
        on peut en voir de larges groupes remonter
        les rivières et les cascades.
      de: |-
        Während der Laichzeit kann man Schwärme von
        Goldini dabei beobachten, wie sie gegen den
        Strom von Flüssen und Wasserfällen schwimmen.
      es: |-
        Durante la época de desove, se les suele ver
        nadando a contracorriente en ríos o remontando
        cascadas en grandes grupos.
      it: |-
        Nel periodo in cui i Goldeen depongono
        le Uova, se ne possono vedere a banchi
        mentre risalgono fiumi e cascate.
    lets-go-eevee:
      ja-Hrkt: |-
        タマゴをうむ　じきになると　かわや
        たきを　のぼってくる　トサキントの
        しゅうだんの　すがたが　みられる。
      ja: |-
        タマゴをうむ　時季になると　川や
        滝を　のぼってくる　トサキントの
        集団の　姿が　見られる。
      ko: |-
        알을 낳을 때가 되면 강이나
        폭포를 오르는 콘치 무리의
        모습을 볼 수 있다.
      zh-Hant: |-
        每到角金魚產卵的時期，
        就能看見牠們成群結隊
        從河川和瀑布逆流而上。
      zh-Hans: |-
        到了产卵期你就可以
        看到成群的角金鱼
        逆流而行或是攀登瀑布。
      en: |-
        When it is time for them to lay eggs, they
        can be seen swimming up rivers and falls
        in large groups.
      fr: |-
        Quand vient la saison de ponte des Poissirène,
        on peut en voir de larges groupes remonter
        les rivières et les cascades.
      de: |-
        Während der Laichzeit kann man Schwärme von
        Goldini dabei beobachten, wie sie gegen den
        Strom von Flüssen und Wasserfällen schwimmen.
      es: |-
        Durante la época de desove, se les suele ver
        nadando a contracorriente en ríos o remontando
        cascadas en grandes grupos.
      it: |-
        Nel periodo in cui i Goldeen depongono
        le Uova, se ne possono vedere a banchi
        mentre risalgono fiumi e cascate.
    sword:
      ja-Hrkt: |-
        せびれ　むなびれ　おびれが
        ゆうがに　たなびくので
        みずのおどりこ　とよばれる。
      ja: |-
        背びれ　胸びれ　尾びれが
        優雅に　たなびくので
        水の踊り子　と呼ばれる。
      ko: |-
        등, 가슴, 꼬리지느러미가
        우아하게 나부끼기 때문에
        물의 무희라고 불린다.
      zh-Hant: |-
        會優雅地搖擺
        背鰭、胸鰭和尾鰭，
        所以被稱為水中的舞者。
      zh-Hans: |-
        会优雅地摇摆背鳍、
        胸鳍和尾鳍，
        所以被称之为水中的舞者。
      en: |-
        Its dorsal, pectoral, and tail fins wave elegantly
        in water. That is why it is known as the Water Dancer.
      fr: |-
        Ses nageoires dorsales, pectorales et caudales
        ondulent avec élégance. Il est surnommé
        le « danseur des flots ».
      de: |-
        Seine Brust-, Rücken- und Schwanzflossen
        bewegen sich anmutig. Daher nennt man es
        den „Wassertänzer“.
      es: |-
        Sus aletas pectorales, caudal y dorsal ondean
        gráciles en el agua. Por eso se le llama el Bailarín
        Acuático.
      it: |-
        Le pinne su dorso, petto e coda ondeggiano
        con grazia. Perciò viene chiamato “danzatore
        d’acqua”.
    shield:
      ja-Hrkt: |-
        せビレ　むなビレが　きんにくのように
        はったつしており　すいちゅうを
        ５ノットの　はやさで　およぐ。
      ja: |-
        背びれ　胸びれが　筋肉のように
        発達しており　水中を
        ５ノットの　速さで　泳ぐ。
      ko: |-
        등지느러미와 가슴지느러미가
        근육처럼 발달하여 물속을
        5노트의 속도로 헤엄친다.
      zh-Hant: |-
        背鰭和尾鰭像肌肉
        那樣發達。能夠以
        ５節的速度在水中游泳。
      zh-Hans: |-
        背鳍和尾鳍像肌肉
        那样发达。能够以
        ５节的速度在水中游泳。
      en: |-
        Its dorsal and pectoral fins are strongly developed
