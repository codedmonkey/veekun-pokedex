      fr: |-
        Sa queue à l’extrémité remplie
        d’huile fait office de flotteur et
        lui permet de ne pas couler.
    white:
      en: |-
        The oil-filled end of its tail floats
        on water. It keeps Marill from
        drowning even in a strong current.
      fr: |-
        Sa queue à l’extrémité remplie
        d’huile fait office de flotteur et
        lui permet de ne pas couler.
    black-2:
      en: |-
        The oil-filled tail functions
        as a buoy, so it’s fine even
        in rivers with strong currents.
    white-2:
      en: |-
        The oil-filled tail functions
        as a buoy, so it’s fine even
        in rivers with strong currents.
    x:
      ja-Hrkt: |-
        ぜんしんの　たいもうは
        みずを　はじく　せいしつを　もち
        みずあび　しても　かわいている。
      ja: |-
        全身の　体毛は
        水を　弾く　性質を　持ち
        水浴び　しても　乾いている。
      ko: |-
        전신의 털은
        물을 튕겨내는 성질을 지녀
        물을 끼얹어도 말라 있다.
      en: |-
        The fur on its body naturally repels water. It can
        stay dry, even when it plays in the water.
      fr: |-
        Sa fourrure est imperméable, si bien qu’il reste sec
        même en jouant dans l’eau.
      de: |-
        Sein Fell ist von Natur aus wasserabweisend.
        Es bleibt trocken, auch wenn es im Wasser spielt.
      es: |-
        Tiene una piel que repele el agua. De hecho, puede
        pasarse horas jugando en el agua sin mojarse.
      it: |-
        La pelliccia è idrorepellente. Così, rimane asciutto
        anche giocando nell’acqua.
    'y':
      ja-Hrkt: |-
        しっぽの　さきには　みずより　かるい
        あぶらが　つまっているので
        うきぶくろの　かわりに　なるのだ。
      ja: |-
        尻尾の　先には　水より　軽い
        油が　つまっているので
        浮き袋の　かわりに　なるのだ。
      ko: |-
        꼬리의 끝에는 물보다 가벼운
        기름이 가득 차 있어서
        부낭 대신 쓸 수 있다.
      en: |-
        The tip of its tail is filled with oil that is lighter than
        water, so it acts as a float.
      fr: |-
        Le bout de sa queue renferme une huile plus légère
        que l’eau qui fait office de flotteur.
      de: |-
        Seine Schweifspitze ist mit Öl gefüllt, das leichter
        als Wasser ist, sodass es nicht untergeht.
      es: |-
        La punta de su cola está llena de un aceite que, al
        ser más ligero que el agua, le permite flotar.
      it: |-
        La punta della coda contiene un olio più leggero
        dell’acqua, che gli permette di stare a galla.
    omega-ruby:
      ja-Hrkt: |-
        あぶらの　つまった　しっぽは　うきわの　かわり。
        すいめんに　しっぽだけが　ういている　ときは
        もぐって　みずくさを　たべている　めじるしだ。
      ja: |-
        油の　つまった　尻尾は　浮き輪の　代り。
        水面に　尻尾だけが　浮いている　ときは
        潜って　水草を　食べている　目印だ。
      ko: |-
        기름이 가득한 꼬리는 튜브 대용이다.
        수면에 꼬리만 떠 있을 때는
        잠수하여 물풀을 먹고 있다는 표시다.
      en: |-
        Marill’s oil-filled tail acts much like a life preserver. If you see
        just its tail bobbing on the water’s surface, it’s a sure
        indication that this Pokémon is diving beneath the water to
        feed on aquatic plants.
      fr: |-
        La queue remplie d’huile de Marill lui sert de gilet de
        sauvetage. Parfois, on peut voir sa queue flotter à la surface.
        On peut en déduire que ce Pokémon a plongé sous l’eau
        pour se nourrir de plantes aquatiques.
      de: |-
        Marills Schweif ist mit Öl gefüllt und dient ihm als eine Art
        Rettungsring. Wenn nur sein Schweif an der Wasseroberfläche
        zu sehen ist, taucht dieses Pokémon gerade, um sich von
        Wasserpflanzen zu ernähren.
      es: |-
        La cola de Marill contiene un aceite que hace las veces de
        chaleco salvavidas. Si ves una moviéndose en el agua, seguro
        que debajo hay un Marill medio sumergido buscando plantas
        acuáticas para comer.
      it: |-
        La coda di Marill contiene dell’olio e agisce da salvagente.
        Se si scorge soltanto la sua coda a pelo d’acqua, significa
        che questo Pokémon si sta immergendo in profondità
        per cibarsi di piante acquatiche.
    alpha-sapphire:
      ja-Hrkt: |-
        ながれの　はやい　かわで　エサを　とる　ときは
        しっぽを　かわべりの　きの　みきに　まきつける。
        しっぽは　だんりょくがあって　のびる　しくみ。
      ja: |-
        流れの　速い　川で　エサを　取る　ときは
        尻尾を　川べりの　木の　幹に　巻きつける。
        尻尾は　弾力があって　伸びる　仕組み。
      ko: |-
        흐름이 빠른 강에서 먹이를 잡을 때는
        꼬리를 강가의 나무줄기에 휘감는다.
        꼬리는 탄력이 있어서 늘어나는 구조다.
      en: |-
        When fishing for food at the edge of a fast-running stream,
        Marill wraps its tail around the trunk of a tree. This Pokémon’s
        tail is flexible and configured to stretch.
      fr: |-
        Lorsqu’il pêche pour se nourrir sur les rives d’un fleuve rapide,
        Marill accroche sa queue autour d’un tronc d’arbre pour
        ne pas être emporté. La queue de ce Pokémon est flexible
        et résiste à l’étirement.
      de: |-
        Wenn es am Ufer eines reißenden Flusses fischt,
        wickelt Marill seinen Schweif um einen Baumstamm.
        Der Schweif dieses Pokémon ist flexibel und elastisch,
        sodass es ihn ausdehnen kann.
      es: |-
        Este Pokémon tiene la cola muy flexible y elástica. A la hora
        de pescar a su presa en una rápida corriente, Marill enrosca
        la cola en un árbol.
      it: |-
        Per nutrirsi Marill pesca il cibo in riva a torrenti impetuosi,
        avvinghiando la coda attorno ai tronchi degli alberi. La coda
        di questo Pokémon è flessibile e dalla costituzione elastica.
    sword:
      ja-Hrkt: |-
        まるい　しっぽは　うきわの　かわり。
        たまの　なかには　あぶらに　かえた
        えいようが　たっぷり　つまっている。
      ja: |-
        丸い　しっぽは　浮き輪の　かわり。
        球の　中には　脂に　変えた
        栄養が　たっぷり　詰まっている。
      ko: |-
        둥근 꼬리는 튜브 대용이다.
        그 안에는 영양으로 가득 찬
        기름이 들어 있다.
      zh-Hant: |-
        圓圓的尾巴能用來代替
        救生圈。球裡面滿滿都是
        轉換成油脂的營養。
      zh-Hans: |-
        圆圆的尾巴拥有
        救生圈的功能。球里满是
        转变为了油脂的营养。
      en: |-
        This Pokémon uses its round tail as a float. The
        ball of Marill’s tail is filled with nutrients that
        have been turned into an oil.
      fr: |-
        Sa queue ronde lui sert de bouée.
        La boule au bout de celle-ci est remplie
        de nutriments qui se sont changés en huile.
      de: |-
        Marills runde Schweifspitze dient ihm als eine Art
        Schwimmring. Sie ist mit Nährstoffen gefüllt,
        die in Fett umgewandelt wurden.
      es: |-
        La punta redonda de su cola hace las veces de
        flotador. En ella almacena abundantes nutrientes
        en forma de aceite.
      it: |-
        La coda rotonda funge da salvagente. All’interno
        della palla sono conservate sostanze nutritive
        sotto forma di grasso.
    shield:
      ja-Hrkt: |-
        よく　みずを　はじく　たいもうは
        つめたい　うみから　あがったときでも
        すぐに　かわいて　さむくないのだ。
      ja: |-
        よく　水を　弾く　体毛は
        冷たい　海から　上がったときでも
        すぐに　乾いて　寒くないのだ。
      ko: |-
        물을 잘 튕겨내는 털은
        차가운 바다에 있다가 나와도
        금방 말라서 춥지 않다.
      zh-Hant: |-
        很能彈開水的體毛就算是
        從寒冷的海裡上岸時也能
        立刻乾掉，一點都不冷。
      zh-Hans: |-
        体毛的防水性能很好，
        就算是从冰冷的海里上岸，
        身体也会立刻干掉，一点都不冷。
      en: |-
        Even after Marill swims in a cold sea, its water-
        repellent fur dries almost as soon as Marill leaves
        the water. That’s why this Pokémon is never cold.
      fr: |-
        Sa fourrure est hydrophobe, si bien qu’elle
        sèche en un instant. Il n’a donc jamais froid,
        même lorsqu’il sort d’une mer glaciale.
      de: |-
        Sein wasserabweisendes Fell trocknet sofort und
        hält Marill warm, selbst wenn es aus kaltem
        Meerwasser auftaucht.
      es: |-
        Su pelaje repele el agua, lo que evita que pase
        frío al salir de mares gélidos porque se seca al
        momento.
      it: |-
        Non soffre il freddo nemmeno quando emerge
        dai mari gelidi, grazie alla pelliccia idrorepellente
        che si asciuga subito.
