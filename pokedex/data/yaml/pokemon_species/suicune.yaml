    x:
      ja-Hrkt: |-
        せかいじゅうを　かけめぐり
        よごれた　みずを　きよめている。
        きたかぜと　ともに　はしりさる。
      ja: |-
        世界中を　駆け巡り
        汚れた　水を　清めている。
        北風と　ともに　走り去る。
      ko: |-
        세계 곳곳을 뛰어다니며
        오염된 물을 정화시킨다.
        북풍과 함께 달려나간다.
      en: |-
        It races around the world to purify fouled water.
        It dashes away with the north wind.
      fr: |-
        Il parcourt le vaste monde pour purifier les eaux
        polluées. Il accompagne le vent du nord.
      de: |-
        Es wandert beständig in der Welt herum,
        um verunreinigtes Wasser zu reinigen.
        Es zieht mit dem Nordwind.
      es: |-
        Recorre el mundo para purificar agua contaminada.
        Corre veloz con el viento del norte.
      it: |-
        Corre per tutto il mondo per purificare l’acqua
        contaminata. Si allontana con i venti del nord.
    'y':
      ja-Hrkt: |-
        いっしゅんで　きたなく　にごった
        みずも　きよめる　ちからをもつ。
        きたかぜの　うまれかわり　という。
      ja: |-
        一瞬で　汚く　濁った　水も
        清める　力を　持つ。
        北風の　生まれ変わり　という。
      ko: |-
        순식간에 더럽고 탁한
        물도 깨끗하게 하는 힘을 가졌다.
        북풍이 다시 태어난 것이라고 한다.
      en: |-
        Said to be the embodiment of north winds, it can
        instantly purify filthy, murky water.
      fr: |-
        Il serait la réincarnation du vent du nord. Il peut
        purifier instantanément les eaux polluées.
      de: |-
        Man sagt, es sei die Wiedergeburt des Nordwindes.
        Es kann verschmutztes Wasser im Nu reinigen.
      es: |-
        Conocido como la reencarnación de los vientos del
        norte, puede purificar aguas turbias y sucias.
      it: |-
        Si dice che sia la reincarnazione dei venti nordici.
        Purifica all’istante l’acqua torbida e putrida.
    omega-ruby:
      ja-Hrkt: |-
        わきみずの　やさしさを　やどした　ポケモン。
        すべる　ような　みのこなしで　だいちを　はしり
        にごった　みずを　きよめる　ちからを　もつ。
      ja: |-
        わき水の　優しさを　宿した　ポケモン。
        滑る　ような　身のこなしで　大地を　走り
        濁った　水を　清める　力を　持つ。
      ko: |-
        솟아나는 물의 부드러움이 깃들어 있는 포켓몬이다.
        흐르는 듯한 몸놀림으로 대지를 달려
        탁해진 물을 맑게 하는 힘을 지녔다.
      en: |-
        Suicune embodies the compassion of a pure spring of water.
        It runs across the land with gracefulness. This Pokémon has
        the power to purify dirty water.
      fr: |-
        Suicune incarne la tranquillité d’une source d’eau pure.
        Il parcourt les plaines avec grâce. Ce Pokémon a le pouvoir
        de purifier l’eau.
      de: |-
        Suicune wohnt die Reinheit einer Quelle inne. Es bewegt sich
        graziös und hat die Macht, schmutziges Wasser zu reinigen.
      es: |-
        Suicune emana la pureza de los manantiales. Suele corretear
        por el campo con gran elegancia. Este Pokémon tiene el poder
        de purificar el agua contaminada.
      it: |-
        Suicune rappresenta la purezza delle sorgenti d’acqua dolce.
        Corre con grazia immerso nella natura. Questo Pokémon
        ha la facoltà di depurare le acque di scarico.
    alpha-sapphire:
