    x:
      ja-Hrkt: |-
        ひるまは　たいようを　さけるため
        つめたい　じめんに　もぐっている。
        つきのひかりを　あびて　そだつ。
      ja: |-
        昼間は　太陽を　避けるため
        冷たい　地面に　潜っている。
        月の　光を　浴びて　育つ。
      ko: |-
        낮에는 태양을 피하려고
        차가운 땅속에 들어가 있다.
        달빛을 쬐어 성장한다.
      en: |-
        During the day, it stays in the cold underground
        to avoid the sun. It grows by bathing in moonlight.
      fr: |-
        Le jour, il reste en sous-sol et évite le soleil.
        Il grandit en se baignant au clair de lune.
      de: |-
        Tagsüber versteckt es sich in der kalten Erde,
        um die Sonne zu meiden. Es wächst im Mondschein.
      es: |-
        Durante el día, se agazapa en el frío subsuelo huyendo
        del sol. La luz de la luna le hace crecer mucho.
      it: |-
        Di giorno vive nel freddo sottosuolo, per evitare la
        luce del sole. Cresce assorbendo la luce lunare.
    'y':
      ja-Hrkt: |-
        べつめい　アルキメンデス。
        よるに　なると　２ほんの　ねっこで
        ３００メートルも　あるくという。
      ja: |-
        別名　アルキメンデス。
        夜になると　２本の　根っこで
        ３００メートルも　歩くという。
      ko: |-
        별명 걸어 다니는 독초.
        밤이 되면 2개의 뿌리로
        300m나 걷는다고 한다.
      en: |
        Its scientific name is “Oddium Wanderus.” At night,
        it is said to walk nearly 1,000 feet on its two roots.
      fr: |-
        Son nom scientifique est « Oddium Wanderus ».
        Lorsqu’il fait nuit, il se déplace à l’aide de ses
        racines pour disséminer ses graines.
      de: |-
        Sein wissenschaftlicher Name lautet:
        „Oddium Wanderus“. Nachts soll es knapp
        300 m auf seinen zwei Wurzeln zurücklegen.
      es: |-
        Su nombre científico es “Oddium Wanderus”. Se dice
        que de noche puede llegar a desplazarse hasta 300 m
        con sus dos raíces.
      it: |-
        Nome scientifico: “Oddium Viandantis”. Percorre fino
        a 300 m in una notte sulle due radici fatte a piede.
    omega-ruby:
      ja-Hrkt: |-
        ひるま　じめんの　なかに　からだを　うめて
        つちの　えいようを　ぜんしんで　すいあげている。
        こえた　つちほど　はっぱに　ツヤが　でるという。
      ja: |-
        昼間　地面の　中に　体を　埋めて
        土の　栄養を　全身で　吸い上げている。
        肥えた　土ほど　葉っぱに　ツヤが　出るという。
      ko: |-
        낮에 땅속에 몸을 묻고
        땅의 영양을 전신으로 빨아올린다.
        비옥한 땅일수록 잎사귀에 윤이 난다고 한다.
      en: |-
        During the daytime, Oddish buries itself in soil to absorb
        nutrients from the ground using its entire body.
        The more fertile the soil, the glossier its leaves become.
      fr: |-
        Pendant la journée, Mystherbe s’enterre dans le sol pour
        absorber avec son corps tout entier les nutriments présents
        dans la terre. Plus le sol est fertile, plus ses feuilles sont
        brillantes.
      de: |-
        Am Tage vergräbt sich Myrapla im Boden, um mit seinem
        ganzen Körper Nahrung aufzunehmen. Je fruchtbarer der
        Boden ist, desto glänzender werden seine Blätter.
      es: |-
        Durante el día, Oddish se entierra en el suelo para absorber
        nutrientes valiéndose de todo el cuerpo. Cuanto más fértil sea
        el suelo, mayor brillo tendrá en las hojas.
      it: |-
        Durante il giorno, Oddish si nasconde nel terreno per
        assorbire sostanze nutritive con tutto il corpo.
        Più il suolo è fertile, più lucide diventano le foglie.
    alpha-sapphire:
      ja-Hrkt: |-
        えいよう　たっぷりの　つちを　さがして　うまる。
        ひるま　つちに　うまっている　ときには　あしが
        きの　ねっこのような　かたちを　しているらしい。
      ja: |-
        栄養　たっぷりの　土を　探して　埋まる。
        昼間　土に　埋まっている　ときには　足が
        木の　根っこのような　形を　しているらしい。
      ko: |-
        영양 만점인 흙을 찾아 몸을 묻는다.
        낮 동안 땅에 묻혀 있을 때는 다리가
        나무뿌리 같은 형태를 띠고 있는 듯하다.
      en: |-
        Oddish searches for fertile, nutrient-rich soil, then plants itself.
        During the daytime, while it is planted, this Pokémon’s feet
        are thought to change shape and become similar to the roots
        of trees.
      fr: |-
        Mystherbe cherche un sol fertile et riche en nutriments,
        pour s’y planter. Pendant la journée, quand il est planté,
        les pieds de ce Pokémon changent de forme et deviennent
        similaires à des racines.
      de: |-
        Myrapla sucht nach fruchtbarem, nahrhaftem Boden und pflanzt
        sich selbst darin ein. Solange es eingepflanzt ist, nehmen seine
        Füße tagsüber die Gestalt von Baumwurzeln an.
      es: |-
        Oddish busca los suelos fértiles y ricos en nutrientes para
        plantarse en la tierra. Durante el día, se cree que le cambia
        la forma de los pies y se le empiezan a parecer a las raíces
        de los árboles.
      it: |-
        Oddish cerca suolo fertile e ricco di sostanze nutritive per
        piantarvi le radici. Si dice che durante il giorno, quando
        è fisso nel terreno, le sue zampe si trasformino prendendo
        la forma delle radici degli alberi.
    ultra-sun:
      de: |-
        Wenn sich der Mond zeigt, taucht es aus dem
        Boden auf. Über fruchtbarer Erde schüttelt es
        seinen Kopf und verstreut Samen.
    ultra-moon:
      de: |-
        Im warmen Klima Alolas gedeiht Myrapla
        besonders gut. Hier lebende Exemplare
        sind rund und schwer.
    lets-go-pikachu:
      ja-Hrkt: |-
        ただの　くさだと　おもって
        ひきぬこうとすると　なきごえがする。
        なぜか　とても　おそろしいきぶん。
      ja: |-
        ただの　草だと　思って
        引き抜こうとすると　鳴き声がする。
        なぜか　とても　恐ろしい気分。
      ko: |-
        평범한 풀이라 생각하고
        뽑으려 하면 울음소리가 들린다.
        어쩐지 매우 오싹한 기분이 든다.
      zh-Hant: |-
        如果把牠當成普通的雜草去拔，
        牠就會發出叫聲，讓聽見的人
        莫名地感到異常恐怖。
      zh-Hans: |-
        要是以为它是普通的草而
        将它拔起，就会听到它的叫声。
        这让人感到莫名的恐怖。
      en: |-
        It may be mistaken for a clump of weeds.
        If you try to yank it out of the ground,
        it shrieks horribly.
      fr: |-
        On le confond souvent avec de l’herbe.
        Si on essaie de le soulever du sol, il pousse
        un cri terrifiant.
      de: |-
        Es wird oft mit Unkraut verwechselt. Versucht
        man, es aus der Erde zu ziehen, stößt es einen
        fürchterlichen Schrei aus.
      es: |-
        En ocasiones lo confunden con una mala hierba
        y, al tratar de arrancarlo, profiere unos gritos
        escalofriantes.
      it: |-
        Spesso confuso con un’erbaccia, questo
        Pokémon stride atrocemente se si prova
        a estirparlo.
    lets-go-eevee:
      ja-Hrkt: |-
