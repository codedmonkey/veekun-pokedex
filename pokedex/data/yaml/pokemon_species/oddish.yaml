        차가운 땅속에 들어가 있다.
        달빛을 쬐어 성장한다.
      zh-Hant: |-
        白天為了躲避太陽，
        會鑽進涼爽的地下。
        藉由沐浴月光來成長。
      zh-Hans: |-
        白天会为躲避太阳
        而钻入凉爽的地下。
        会通过沐浴月光成长。
      en: |-
