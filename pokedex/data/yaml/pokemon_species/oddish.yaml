    sword:
      ja-Hrkt: |-
        つきのひかりを　あびて　うごきだす。
        よるのあいだに　タネを　あちこちに
        ばらまくため　あるきまわる。
      ja: |-
        月の光を　浴びて　動きだす。
        夜のあいだに　タネを　あちこちに
        ばらまくため　歩きまわる。
      ko: |-
        달빛을 받아 움직인다.
        밤중에 씨앗을 여기저기
        뿌리기 위해 돌아다닌다.
      zh-Hant: |-
        沐浴月光就會開始活動。
        為了四處散播種子，
        會在夜晚到處走動。
      zh-Hans: |-
        沐浴月光就会开始活动。
        为了四处散播种子
        会在夜晚到处走动。
      en: |-
        If exposed to moonlight, it starts to move.
        It roams far and wide at night to scatter its seeds.
      fr: |-
        Il ne bouge que lorsqu’il est exposé aux rayons
        de la lune. Il se déplace alors pour disséminer
        ses graines.
      de: |-
        Wird es vom Mondschein getroffen, bewegt es
        sich. Nachts wandert es weite Wege, um seine
        Samen zu verstreuen.
      es: |-
        Se mueve al exponerse a la luz de la luna.
        Merodea por la noche para esparcir sus semillas.
      it: |-
        Inizia a muoversi quando è illuminato dalla luce
        lunare. Di notte se ne va in giro a spargere semi.
    shield:
      ja-Hrkt: |-
        ひるまは　たいようを　さけるため
