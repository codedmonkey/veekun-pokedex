        traîner dans les pieds des gens.
    black-2:
      en: |-
        It likes to carry around a small
        rock. It may wander around others’
        feet and cause them to stumble.
    white-2:
      en: |-
        It likes to carry around a small
        rock. It may wander around others’
        feet and cause them to stumble.
    x:
      ja-Hrkt: |-
        タマゴに　にた　まんまるい　いしを
        おなかの　ふくろに　いれている。
        すきな　あいてに　いしを　わたす。
      ja: |-
        タマゴに　似た　真んまるい　石を
        お腹の　袋に　入れている。
        好きな　相手に　石を　渡す。
      ko: |-
        알을 닮은 둥근 돌을
        배의 주머니에 넣고 있다.
        좋아하는 상대에게 돌을 준다.
      en: |-
        It carries a round, egg-shaped rock in its belly
        pouch and gives the rock to its friends.
      fr: |-
        Ptiravi transporte un caillou rond en forme d’œuf dans
        sa poche ventrale pour l’offrir à ses amis.
      de: |-
        In seinem Beutel trägt es einen runden,
        eiförmigen Stein, den es Freunden gibt.
      es: |-
        Les da a sus amigos una roca con forma de huevo que
        transporta en la bolsa de su panza.
      it: |-
        Trasporta una roccia a forma di uovo nella sua
        tasca ventrale e poi la offre ai suoi amici.
    'y':
      ja-Hrkt: |-
        しろくて　まるい　いしを　タマゴと
        おもいこんで　だいじに　もっている。
        まきげの　かたちを　きにしている。
      ja: |-
        白くて　まるい　石を　タマゴと
        思いこんで　大事に　持っている。
        巻き毛の　形を　気にしている。
      ko: |-
        하얗고 둥근 돌을 알이라고
        생각하고는 소중히 가지고 있다.
        말려 있는 머리 모양을 신경 쓰고 있다.
      en: |-
        It carefully carries a round, white rock that it thinks
        is an egg. It’s bothered by how curly its hair looks.
      fr: |-
        Il prend soin de ses bouclettes et couve son caillou
        comme si c’était son Œuf.
      de: |-
        Es hält den runden, weißen Stein für ein Ei
        und kümmert sich um ihn. Es achtet sehr
        auf seine Haarlocke.
      es: |-
        Cuida de una pequeña roca blanca y redonda
        creyendo que es un huevo. Le gusta arreglarse
        el tirabuzón.
      it: |-
        Trasporta con cura un sasso bianco e tondo
        trattandolo come un uovo.
        Adora il ricciolo che ha in testa.
    omega-ruby:
      ja-Hrkt: |-
        タマゴに　にた　まんまるい　いしを
        おなかの　ふくろに　いれている。
        すきな　あいてに　いしを　わたす。
      ja: |-
        タマゴに　似た　真んまるい　石を
        お腹の　袋に　入れている。
        好きな　相手に　石を　渡す。
      ko: |-
        알을 닮은 둥근 돌을
        배의 주머니에 넣고 있다.
        좋아하는 상대에게 돌을 준다.
      en: |-
        It carries a round, egg-shaped rock in its belly
        pouch and gives the rock to its friends.
      fr: |-
        Ptiravi transporte un caillou rond en forme d’œuf dans
        sa poche ventrale pour l’offrir à ses amis.
      de: |-
        In seinem Beutel trägt es einen runden, eiförmigen Stein,
        den es Freunden gibt.
      es: |-
        Les da a sus amigos una roca con forma de huevo que
        transporta en la bolsa de su panza.
      it: |-
        Trasporta una roccia a forma di uovo nella sua tasca ventrale
        e poi la offre ai suoi amici.
    alpha-sapphire:
      ja-Hrkt: |-
        しろくて　まるい　いしを　タマゴと
        おもいこんで　だいじに　もっている。
        まきげの　かたちを　きにしている。
      ja: |-
        白くて　まるい　石を　タマゴと
        思いこんで　大事に　持っている。
        巻き毛の　形を　気にしている。
      ko: |-
        하얗고 둥근 돌을 알이라고
        생각하고는 소중히 가지고 있다.
        말려 있는 머리 모양을 신경 쓰고 있다.
      en: |-
        It carefully carries a round, white rock that it thinks
        is an egg. It’s bothered by how curly its hair looks.
      fr: |-
        Il prend soin de ses bouclettes et couve son caillou comme
        si c’était son Œuf.
      de: |-
        Es hält den runden, weißen Stein für ein Ei und kümmert sich
        um ihn. Es achtet sehr auf seine Haarlocke.
      es: |-
        Cuida de una pequeña roca blanca y redonda creyendo que
        es un huevo. Le gusta arreglarse el tirabuzón.
      it: |-
        Trasporta con cura un sasso bianco e tondo trattandolo
        come un uovo. Adora il ricciolo che ha in testa.
    sun:
      ja-Hrkt: |-
        おなかの　ふくろに　しろくて　まるい
        いしを　いれている。　なかよくなると
        わけて　くれることも　あるよ。
      ja: |-
        お腹の　袋に　白くて　丸い
        石を　入れている。　仲良くなると
        わけて　くれることも　あるよ。
      ko: |-
        배의 주머니에 하얗고 동그란
        돌을 넣고 있다. 사이가 좋아지면
        나누어 주는 일도 있다.
      zh-Hant: |-
        腹部的袋子裡裝著白色的
        圓形石頭。如果和牠變得友好，
        也可能會分一點給你哦。
      zh-Hans: |-
        腹部的袋子里装着白色的
        圆形石头。如果关系变好，
        也可能会分给你哦。
      en: |-
        It carries a round white rock in its belly pouch.
        If it gets along well with someone, it will
        sometimes give that person the rock.
      fr: |-
        Il transporte un petit caillou rond et blanc dans
        sa poche ventrale. Il arrive même qu’il le donne
        aux personnes qu’il aime bien.
      de: |-
        In seinem Beutel trägt es einen runden, weißen
        Stein. Freundet man sich mit ihm an, kann es
        vorkommen, dass man ihn geschenkt bekommt.
      es: |-
        En la bolsa de su panza transporta una roca
        redonda y blanca. Cuando hace amigos puede
        llegar a regalársela.
      it: |-
        Trasporta nella tasca ventrale una roccia
        a forma di uovo, che a volte regala ai suoi amici.
    moon:
      ja-Hrkt: |-
        ちいさいので　まだ　タマゴを
        うむことが　できない。　かわりに
        しろくて　まるい　いしを　さがす。
      ja: |-
        小さいので　まだ　タマゴを
        産むことが　できない。　代わりに
        白くて　丸い　石を　探す。
      ko: |-
        작아서 아직 알을
        낳을 수 없다. 대신에
        하얗고 둥근 돌을 찾는다.
      zh-Hant: |-
        因為很小，還不能生蛋。
        會尋找白白圓圓的
        石頭來代替。
      zh-Hans: |-
        因为很小，还不能生蛋。
        会寻找白白的圆圆的
        石头来作为替代。
      en: |-
        It’s too small to lay eggs yet. As a surrogate,
        it searches out round white stones.
      fr: |-
        Comme il est très jeune, il ne peut pas encore
        pondre d’œuf. À la place, il cherche un joli petit
        caillou blanc, bien rond.
      de: |-
        Es ist noch zu jung, um Eier zu legen. Als Ersatz
        sucht es nach runden, weißen Steinen.
      es: |-
        Como todavía no puede poner huevos, busca
        rocas blancas y redondas en su lugar.
      it: |-
        Dato che è ancora piccolo e non può deporre
        uova, cerca pietre bianche e tonde da usare
        in sostituzione.
    ultra-sun:
      ja-Hrkt: |-
        おとなしい　ポケモンだが　おなかの
        まるい　いしを　とりあげると
        ないて　さわいで　おおあばれ。
      ja: |-
        大人しい　ポケモンだが　お腹の
        丸い　石を　取り上げると
        泣いて　騒いで　大暴れ。
      ko: |-
        온순한 포켓몬이지만
        배의 둥근 돌을 빼내면
        울고불고 난폭해진다.
      zh-Hant: |-
        性情溫馴的寶可夢，
        但如果肚子上的圓形石頭被搶走，
        就會哭著大吵大鬧。
      zh-Hans: |-
        是非常温顺的宝可梦，
        但如果被夺走了腹部的圆石头，
        就会哭着大吵大闹。
      en: |-
        Usually it’s a well-behaved Pokémon, but if you
        take its round rock away, it will cry and fuss
        and throw a big old tantrum.
      fr: |-
        C’est un Pokémon d’un naturel calme. Quiconque
        tente de s’emparer du caillou de sa poche
        ventrale s’expose toutefois à un gros caprice.
      de: |-
        Eigentlich ein sehr braves Pokémon, das aber
        fürchterlich weint und tobt, wenn man den
        runden, weißen Stein aus seinem Beutel nimmt.
      es: |-
        Se trata de un Pokémon dócil y tranquilo, pero,
        si le arrebatan la piedra redonda que lleva en la
        bolsa de su panza, se pone a llorar y berrear.
      it: |-
        È un Pokémon docile, ma se si fa per togliergli
        la pietra dalla tasca ventrale piange, strilla e
        diventa una furia.
    ultra-moon:
      ja-Hrkt: |-
        しろく　まるいものを　みると　はらの
        ふくろに　しまう。　しまいすぎて
        うごけなく　なることも　あるほど。
      ja: |-
        白く　丸いものを　見ると　腹の
        袋に　しまう。　しまいすぎて
        動けなく　なることも　あるほど。
      ko: |-
        하얗고 둥근 것을 보면 배의
        주머니에 넣는다. 너무 많이 넣어서
        움직이지 못할 때도 있을 정도다.
      zh-Hant: |-
        只要看見又白又圓的東西
        就會放進腹部的袋裡。
        有時甚至會放得太多而動彈不得。
      zh-Hans: |-
        如果看到又白又圆的东西
        就会放到腹部的袋子里。
        有时甚至会放得太多而动弹不得。
      en: |-
        When it sees something round and white,
        Happiny puts it into the pouch on its stomach. It
        sometimes becomes overloaded and can’t move.
      fr: |-
        Dès qu’il repère un objet rond et blanc, il le
        range dans sa poche ventrale. Il en ramasse
        parfois tellement qu’il ne peut plus bouger.
      de: |-
        Findet es weiße, runde Steine, verstaut es sie in
        seinem Beutel. Manchmal trägt es so viele davon
        bei sich, dass es nicht mehr laufen kann.
      es: |-
        En cuanto ve cosas blancas y redondas, se las
        guarda en la bolsa de su panza. A veces la llena
        hasta tales extremos que no se puede ni mover.
      it: |-
        Quando vede un oggetto bianco e tondo lo mette
        nella tasca ventrale. A volte ce ne mette così
        tanti che finisce per non riuscire a muoversi.
    sword:
      ja-Hrkt: |-
        ラッキーの　まねをして　タマゴに
        そっくりな　まるい　いしを　おなかの
        ふくろに　いれて　だいじにしている。
      ja: |-
        ラッキーの　真似をして　タマゴに
        そっくりな　まるい　石を　お腹の
        袋に　入れて　大事にしている。
      ko: |-
        럭키를 흉내 내어 알처럼 생긴
        둥근 돌을 배의 주머니에 넣고
        소중히 보관한다.
      zh-Hant: |-
        會模仿吉利蛋的樣子，
        把很像蛋的渾圓石頭放
        在腹部的袋子裡寶貝著。
      zh-Hans: |-
        模仿吉利蛋，把很像蛋的
        浑圆石头放入腹部的
        袋子中用心保管着。
      en: |-
        Mimicking Chansey, Happiny will place an egg-
        shaped stone in its belly pouch. Happiny will
        treasure this stone.
      fr: |-
        Pour imiter Leveinard, il conserve un caillou
        en forme d’œuf dans sa poche ventrale et
        en prend grand soin.
      de: |-
        Es imitiert Chaneira und legt einen eiförmigen
        Stein in den Beutel an seinem Bauch. Dieser Stein
        ist sein größter Schatz.
      es: |-
        Lleva en la bolsa de su panza una roca con forma
        de huevo que cuida con esmero, imitando a
        Chansey.
      it: |-
        Imita Chansey trasportando con cura nella tasca
        ventrale un sasso rotondo identico a un uovo.
    shield:
      ja-Hrkt: |-
        なかよくなった　あいてには　だいじな
        まるい　いしを　かしてあげる。
        かえさないと　なきだし　おおあばれ。
      ja: |-
        仲良くなった　相手には　大事な
        丸い　石を　貸してあげる。
        返さないと　泣きだし　大暴れ。
      ko: |-
        친해진 상대에게는 소중하게 여기는
        둥근 돌을 빌려준다. 돌려주지
        않으면 울고불고하다가 난폭해진다.
      zh-Hant: |-
        會把寶貝的渾圓石頭借給
        變得友好的對象。如果不
        還給牠的話，就會哭著大鬧。
      zh-Hans: |-
        会把自己珍贵的浑圆石头
        借给关系变得很要好的对象。
        如果不还给它，它便会大哭大闹。
      en: |-
        Happiny’s willing to lend its precious round stone
        to those it’s friendly with, but if the stone isn’t
        returned, Happiny will cry and throw a tantrum.
      fr: |-
        Il prête volontiers son caillou rond à ceux
        qu’il apprécie, mais éclate en sanglots et
        se met en colère si on ne le lui rend pas.
      de: |-
        Seinen kostbaren, runden Stein leiht Wonneira
        nur denjenigen, die es mag. Bekommt es diesen
        nicht zurück, tobt es und weint bitterlich.
      es: |-
        Les deja su preciada roca redonda a aquellos
        con los que se lleva bien. Si no se la devuelven,
        se echa a llorar, presa de una rabieta.
      it: |-
        Dà in prestito il suo amato sasso a chi considera
        suo amico, ma se non gli viene restituito piange
        e si scatena.
    legends-arceus:
      en: |-
        In imitation of Chansey, it keeps a round stone tucked into its
        belly pouch and cherishes it dearly. It gets along well with
        children and will sometimes play house with them for fun.
