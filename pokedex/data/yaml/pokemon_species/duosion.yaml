duosion:
  base_happiness: 50
  capture_rate: 100
  color: green
  egg_groups:
    - indeterminate
  evolution_chain: solosis
  evolves_from: solosis
  flavor_text:
    black:
      en: |-
        Since they have two divided brains,
        at times they suddenly try to take two
        different actions at once.
      fr: |-
        Il possède deux cerveaux séparés
        qui le font parfois agir de façon
        totalement incohérente.
    white:
      en: |-
        When their brains, now divided in two,
        are thinking the same thoughts, these
        Pokémon exhibit their maximum power.
      fr: |-
        Il dégage sa puissance maximale
        quand ses cerveaux réfléchissent
        à la même chose.
    black-2:
      en: |-
        When their two divided brains
        think the same thoughts,
        their psychic power is maximized.
    white-2:
      en: |-
        When their two divided brains
        think the same thoughts,
        their psychic power is maximized.
    x:
      ja-Hrkt: |-
        ２つに　ぶんれつした　のうみそを
        もっているため　いきなり　ちがう
        こうどうを　とることが　あるのだ。
      ja: |-
        ２つに　分裂した　脳みそを
        持っているため　いきなり　違う
        行動を　とることが　あるのだ。
      ko: |-
        둘로 분열된 뇌를
        가지고 있어서 갑자기 다른
        행동을 취할 때가 있다.
      en: |-
        Since they have two divided brains, at times they
        suddenly try to take two different actions at once.
      fr: |-
        Il possède deux cerveaux séparés qui le font parfois
        agir de façon totalement incohérente.
      de: |-
        Wegen seines gespaltenen Denkapparates kann es
        vorkommen, dass es sich abrupt einer anderen
        Tätigkeit zuwendet.
      es: |-
        Dado que su cerebro está dividido en dos, a veces
        tiene conflictos a la hora de decidir qué hacer.
      it: |-
        Poiché ha due cervelli separati e indipendenti, può
        capitare che si comporti in modo del tutto incoerente.
    'y':
      ja-Hrkt: |-
        ぶんれつした　２つの　のうみそで
        おなじことを　かんがえると　だせる
        サイコパワーは　さいこうと　なる。
      ja: |-
        分裂した　２つの　脳みそで
        同じことを　考えると　だせる
        サイコパワーは　最高と　なる。
      ko: |-
        분열한 2개의 뇌로
        같은 생각을 하면 낼 수 있는
        사이코 파워는 최고가 된다.
      en: |-
        When their two divided brains think the same
        thoughts, their psychic power is maximized.
      fr: |-
        Il dégage le maximum de sa puissance psychique
        quand ses deux cerveaux réfléchissent à la même
        chose.
      de: |-
        Wenn beide Hälften seines gespaltenen Denkapparates
        an dasselbe denken, sind seine Psycho-Kräfte am
        stärksten.
      es: |-
        Cuando las dos partes de su cerebro piensan lo
        mismo, saca todo su poder a relucir.
      it: |-
        I suoi poteri psichici sono al massimo quando le due
        parti in cui è diviso il suo cervello pensano la stessa
        cosa.
    omega-ruby:
      ja-Hrkt: |-
        ２つに　ぶんれつした　のうみそを
        もっているため　いきなり　ちがう
        こうどうを　とることが　あるのだ。
      ja: |-
        ２つに　分裂した　脳みそを
        持っているため　いきなり　違う
        行動を　とることが　あるのだ。
      ko: |-
        둘로 분열된 뇌를
        가지고 있어서 갑자기 다른
        행동을 취할 때가 있다.
      en: |-
        Since they have two divided brains, at times they
        suddenly try to take two different actions at once.
      fr: |-
        Il possède deux cerveaux séparés qui le font parfois agir
        de façon totalement incohérente.
      de: |-
        Wegen seines gespaltenen Denkapparates kann es
        vorkommen, dass es sich abrupt einer anderen Tätigkeit
        zuwendet.
      es: |-
        Dado que su cerebro está dividido en dos, a veces tiene
        conflictos a la hora de decidir qué hacer.
      it: |-
        Poiché ha due cervelli separati e indipendenti, può capitare
        che si comporti in modo del tutto incoerente.
    alpha-sapphire:
      ja-Hrkt: |-
        ぶんれつした　２つの　のうみそで
        おなじことを　かんがえると　だせる
        サイコパワーは　さいこうと　なる。
      ja: |-
        分裂した　２つの　脳みそで
        同じことを　考えると　だせる
        サイコパワーは　最高と　なる。
      ko: |-
        분열한 2개의 뇌로
        같은 생각을 하면 낼 수 있는
        사이코 파워는 최고가 된다.
      en: |-
        When their two divided brains think the same
        thoughts, their psychic power is maximized.
      fr: |-
        Il dégage le maximum de sa puissance psychique quand
        ses deux cerveaux réfléchissent à la même chose.
      de: |-
        Wenn beide Hälften seines gespaltenen Denkapparates an
        dasselbe denken, sind seine Psycho-Kräfte am stärksten.
      es: |-
        Cuando las dos partes de su cerebro piensan lo mismo, saca
        todo su poder a relucir.
      it: |-
        I suoi poteri psichici sono al massimo quando le due parti
        in cui è diviso il suo cervello pensano la stessa cosa.
    sword:
      ja-Hrkt: |-
        ２つの　のうみその　いけんが
        いっちしたときの　ねんりきは
        しゅうい１キロに　およぶと　いう。
      ja: |-
        ２つの　脳みその　意見が
        一致したときの　念力は
        周囲１キロに　およぶと　いう。
      ko: |-
        2개의 뇌가 의견 일치했을 때의
        염동력은 주변 1km까지
        영향을 미친다고 한다.
      zh-Hant: |-
        據說當牠的２個大腦
        意見一致時，發出的念力
        可以覆蓋方圓１公里的範圍。
      zh-Hans: |-
        据称说它的２个大脑
        意见一致时，发出的念力
        可以覆盖方圆１公里的范围。
      en: |-
        Its psychic power can supposedly cover a range
        of more than half a mile—but only if its two
        brains can agree with each other.
      fr: |-
        On prétend que lorsque ses deux cerveaux
        agissent à l’unisson, la portée de sa force mentale
        peut s’étendre sur un rayon d’un kilomètre.
      de: |-
        Die gewaltigen Psycho-Kräfte, die entstehen,
        wenn seine zwei Denkapparate einer Meinung
        sind, sollen im Umkreis von 1 km zu spüren sein.
      es: |-
        Dicen que, cuando las dos partes de su cerebro
        piensan lo mismo, el alcance de su telequinesia
        aumenta hasta abarcar un radio de 1 km.
      it: |-
        Quando i suoi due cervelli pensano la stessa
        cosa, la sua forza psichica si propaga nel
        raggio di 1 km.
    shield:
      ja-Hrkt: |-
        ぶんれつした　２つの　のうみその
        かんがえは　ほぼ　いっちせず
        まるで　こうどうが　よめない。
      ja: |-
        分裂した　２つの　脳みその
        考えは　ほぼ　一致せず
        まるで　行動が　読めない。
      ko: |-
        분열한 2개의 뇌는
        생각이 거의 일치하지 않아
        전혀 행동을 예측할 수 없다.
      zh-Hant: |-
        由於牠一分為二的大腦
        思考的內容幾乎完全不同，
        導致牠的行動非常難以預測。
      zh-Hans: |-
        由于它一分为二的大脑
        思考的内容几乎完全不同，
        导致它的行动非常难以预测。
      en: |-
        Its brain has split into two, and the two
        halves rarely think alike. Its actions are
        utterly unpredictable.
      fr: |-
        Étant donné que ses deux cerveaux sont rarement
        sur la même longueur d’onde, il est impossible
        de prédire son comportement.
      de: |-
        Weil die beiden Hälften seines gespaltenen
        Denkapparates fast nie einer Meinung sind,
        ist es auf gewisse Weise unberechenbar.
      es: |-
        Las dos partes de su cerebro casi nunca piensan
        lo mismo, por lo que es imposible predecir sus
        intenciones.
      it: |-
        È un Pokémon piuttosto imprevedibile.
        I suoi due cervelli, separati e indipendenti,
        raramente sono sulla stessa lunghezza onda.
