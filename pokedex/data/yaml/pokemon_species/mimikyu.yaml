mimikyu:
  base_happiness: 50
  capture_rate: 45
  color: yellow
  egg_groups:
    - indeterminate
  evolution_chain: mimikyu
  evolves_from: ~
  flavor_text:
    sun:
      ja-Hrkt: |-
        しょうたいふめい。　ボロきれの
        なかみを　みた　とある　がくしゃは
        きょうふの　あまり　ショックしした。
      ja: |-
        正体不明。　ボロ布の
        中身を　みた　とある　学者は
        恐怖の　あまり　ショック死した。
      ko: |-
        정체불명. 누더기 속을 본
        어떤 학자는 공포에서
        헤어나오지 못하고 쇼크사했다.
      zh-Hant: |-
        真面目是個謎。
        某個看過破布裡面的學者
        因為太可怕而被活活嚇死了。
      zh-Hans: |-
        正身不明。
        某位学者看过破布里面后，
        因为太过恐惧而被惊吓致死。
      en: |-
        Its actual appearance is unknown. A scholar
        who saw what was under its rag was
        overwhelmed by terror and died from the shock.
      fr: |-
        Sa véritable apparence est inconnue. Les
        chercheurs qui ont vu sous son déguisement
        sont littéralement morts de peur.
      de: |-
        Niemand weiß, wie es wirklich aussieht. Ein
        Forscher, der unter seinen Lumpen blickte, soll
        sich buchstäblich zu Tode erschreckt haben.
      es: |-
        Su verdadero aspecto es un misterio total. Un
        investigador que intentó mirar dentro del saco
        recibió, literalmente, un susto de muerte.
      it: |-
        Nessuno conosce il suo vero aspetto.
        Pare che uno studioso sia morto di paura dopo
        aver guardato sotto il panno che lo nasconde.
    moon:
      ja-Hrkt: |-
        おそろしい　すがたを　ボロぬので
        かくし　ひとや　ほかの　ポケモンに
        ちかづく　さみしがりや。
      ja: |-
        恐ろしい　姿を　ボロ布で
        隠し　人や　他のポケモンに
        近づく　寂しがりや。
      ko: |-
        무시무시한 모습을 누더기로 가리고
        사람이나 다른 포켓몬에게 다가가는
        외로움이 많은 포켓몬이다.
      zh-Hant: |-
        用破破爛爛的布隱藏起可怕的模樣，
        接近人類和其他寶可夢的寂寞傢伙。
      zh-Hans: |-
        这个怕寂寞的家伙，
        会用破布隐藏自己可怕的样子
        来接近人和其他宝可梦。
      en: |-
        A lonely Pokémon, it conceals its terrifying
        appearance beneath an old rag so it can get
        closer to people and other Pokémon.
      fr: |-
        Son apparence est si effrayante qu’il doit se
        déguiser pour oser s’approcher des gens et
        des autres Pokémon.
      de: |-
        Es versteckt seine schreckliche Gestalt unter
        einem Lumpen, um sich Menschen und anderen
        Pokémon zu nähern. Oft fühlt es sich einsam.
      es: |-
        El saco andrajoso le permite ocultar su aspecto
        aterrador para acercarse a otros Pokémon o a la
        gente y vencer así la soledad que lo atenaza.
      it: |-
        Soffre molto la solitudine e per poter avvicinare
        gli esseri umani e gli altri Pokémon, cela il suo
        tremendo aspetto sotto a un panno.
    ultra-sun:
      ja-Hrkt: |-
        おとなしい　さみしがりや　だけど
        ボロきれの　なかみを　みようとすると
        はげしく　いやがり　ていこうする。
      ja: |-
        大人しい　寂しがり屋　だけど
        ボロ切れの　中身を　見ようとすると
        激しく　嫌がり　抵抗する。
      ko: |-
        얌전하고 외로움을 잘 타지만,
        넝마 조각의 속을 보려고 하면
        격렬하게 싫어하며 저항한다.
      zh-Hant: |-
        性情溫和且害怕寂寞，
        但如果有人試圖窺看破布裡面的樣子，
        牠就會非常厭惡地激烈反抗。
      zh-Hans: |-
        稳重又怕寂寞，
        但如果想要看它的破布里面，
        就会非常厌恶，激烈反抗。
      en: |-
        Although it’s a quiet, lonely Pokémon, if you try
        to look at what’s under its rag, it will become
        agitated and resist violently.
      fr: |-
        Ce Pokémon docile déteste la solitude, mais
        il oppose une résistance acharnée si l’on essaie
        de jeter un coup d’œil sous son déguisement.
      de: |-
        Eigentlich ist es friedlich und sehnt sich nur
        nach Gesellschaft, doch versucht man, unter
        seinen Lumpen zu linsen, wehrt es sich heftig.
      es: |-
        Es de carácter tranquilo y propenso a sentirse
        solo. Odia que intenten mirar bajo su saco, y se
        resiste con todas sus fuerzas.
      it: |-
        È un Pokémon tranquillo che soffre di solitudine.
        Se qualcuno cerca di sbirciare sotto il panno che
        lo nasconde, si oppone con forza.
    ultra-moon:
      ja-Hrkt: |-
        かぜが　まって　ぐうぜん　なかみを
        みてしまった　トレーナーは　そのひの
        ばんに　くるしみ　もがいて　しんだ。
      ja: |-
        風が　舞って　偶然　中身を
        見てしまった　トレーナーは　その日の
        晩に　苦しみ　もがいて　死んだ。
      ko: |-
        바람이 불어서 우연히 속을
        봐 버린 트레이너는 그날 밤
        고통에 몸부림치다 죽었다.
      zh-Hant: |-
        因為風把布吹起來而偶然
        見到牠裡面模樣的訓練家，
        當天晚上會在痛苦掙扎中死去。
      zh-Hans: |-
        因为风吹起而偶然见到
        它里面的训练家，
        会在当天晚上痛苦地挣扎着死去。
      en: |-
        A gust of wind revealed what hides under this
        Pokémon’s rag to a passing Trainer, who went
        home and died painfully that very night.
      fr: |-
        Une bourrasque a un jour permis à un Dresseur
        de voir sous le déguisement de Mimiqui. Il est
        mort le soir même dans d’atroces souffrances.
      de: |-
        Ein Trainer, der durch einen Windstoß Mimigmas
        wahre Gestalt unter seinem Lumpen erblickte,
        starb am selben Abend einen qualvollen Tod.
      es: |-
        Al levantarse su saco a causa de un golpe de
        viento, un Entrenador vio su verdadera forma y
        murió dolorosamente esa misma noche.
      it: |-
        Un Allenatore che ha visto cosa si cela sotto
        il suo panno per una folata di vento è andato
        incontro a una morte dolorosa la sera stessa.
    sword:
      ja-Hrkt: |-
        こわがられないように　ピカチュウに
        にせた　ボロぬのを　かぶっているが
        よけい　ぶきみに　なってしまった。
      ja: |-
        怖がられないように　ピカチュウに
        似せた　ボロ布を　かぶっているが
        余計に　不気味に　なってしまった。
      ko: |-
        겁을 주지 않기 위해 피카츄와
        닮은 누더기를 쓰고 있지만
        오히려 더 으스스해졌다.
      zh-Hant: |-
        為了讓別人不要害怕自己，
        特意穿上了看似皮卡丘的破布，
        結果卻變得更加令人毛骨悚然。
      zh-Hans: |-
        为了让别人不要害怕自己，
        特意穿上了看似皮卡丘的破布，
        结果却变得更加令人毛骨悚然。
      en: |-
        It wears a rag fashioned into a Pikachu costume
        in an effort to look less scary. Unfortunately,
        the costume only makes it creepier.
      fr: |-
        Il se cache sous des guenilles en forme de Pikachu
        pour avoir l’air moins effrayant, mais cela le rend
        encore plus inquiétant.
      de: |-
        Es verbirgt sich unter einem Lumpen, der wie ein
        Pikachu aussieht, damit niemand Angst vor ihm
        bekommt. Leider wird es dadurch noch gruseliger.
      es: |-
        Se cubre con un saco andrajoso con aspecto de
        Pikachu para no resultar tan aterrador, aunque
        este le confiere un aspecto aún más terrorífico.
      it: |-
        Per non spaventare gli altri, cela il suo aspetto
        sotto a un panno che imita le fattezze di Pikachu,
        ma questo lo rende ancor più inquietante.
    shield:
      ja-Hrkt: |-
        けんきゅうのため　ボロぬのの　なかを
        みてしまった　がくしゃが　なぞの
        びょうきで　いのちを　おとした。
      ja: |-
        研究のため　ボロ布の　中を
        見てしまった　学者が　謎の
        病気で　命を　落とした。
      ko: |-
        연구를 위해 누더기 속을
        들여다본 학자가 알 수 없는
        병으로 목숨을 잃었다.
      zh-Hant: |-
        有一位學者為了研究
        而看了牠的破布裡面，
        結果患上怪病而離開人世。
      zh-Hans: |-
        有一位学者为了研究
        而看了它的破布里面，
        结果患上怪病而离开人世。
      en: |-
        There was a scientist who peeked under
        Mimikyu’s old rag in the name of research.
        The scientist died of a mysterious disease.
      fr: |-
        Les malheureux chercheurs qui ont regardé
        sous son déguisement en lambeaux ont succombé
        à une mystérieuse maladie.
      de: |-
        Alle Wissenschaftler, die zu Forschungszwecken
        einen Blick unter seinen Lumpen gewagt haben,
        sind an einer rätselhaften Krankheit gestorben.
      es: |-
        Un investigador que miró dentro del saco para
        estudiar a este Pokémon perdió la vida a causa
        de una misteriosa enfermedad.
      it: |-
        Uno scienziato che studiava questo Pokémon
        morì di una misteriosa malattia dopo aver
        guardato sotto il suo panno.
