        serves as a ferry to Pokémon
        that can’t swim.
    platinum:
      en: |-
        It looks like an aquatic plant and
        serves as a ferry to Pokémon
        that can’t swim.
    heartgold:
      en: |-
        Its leaf grew too large for it to
        live on land. That is how it began
        to live floating in the water.
    soulsilver:
      en: |-
        Its leaf grew too large for it to
        live on land. That is how it began
        to live floating in the water.
    black:
      en: |-
        It looks like an aquatic plant and
        serves as a ferry to Pokémon
        that can’t swim.
      fr: |-
        Il ressemble à une plante aquatique
        et fait la navette pour les Pokémon
        qui ne savent pas nager.
    white:
      en: |-
        It looks like an aquatic plant and
        serves as a ferry to Pokémon
        that can’t swim.
      fr: |-
        Il ressemble à une plante aquatique
        et fait la navette pour les Pokémon
        qui ne savent pas nager.
    black-2:
      en: |-
        It looks like an aquatic plant and
        serves as a ferry to Pokémon
        that can’t swim.
    white-2:
      en: |-
        It looks like an aquatic plant and
        serves as a ferry to Pokémon
        that can’t swim.
    x:
      ja-Hrkt: |-
        みずくさに　そっくりな　ポケモン。
        およげない　ポケモンを　はっぱに
        のせて　むこうぎしまで　はこぶ。
      ja: |-
        水草に　そっくりな　ポケモン。
        泳げない　ポケモンを　葉っぱに
        乗せて　向こう岸まで　運ぶ。
      ko: |-
        수초를 똑 닮은 포켓몬이다.
        헤엄을 못 치는 포켓몬을 잎사귀에
        태워 건너편 물가까지 운반한다.
      en: |-
        It looks like an aquatic plant and serves as a ferry
        to Pokémon that can’t swim.
      fr: |-
        Il ressemble à une plante aquatique et fait la navette
        pour les Pokémon qui ne savent pas nager.
      de: |-
        Es sieht aus wie eine Wasserpflanze. Es dient den
        Pokémon, die nicht schwimmen können, als Fähre.
      es: |-
        Parece una planta acuática. Hace de ferry para los
        Pokémon que no saben nadar.
      it: |-
        Sembra una pianta acquatica e viene usato come
        traghetto dai Pokémon che non sanno nuotare.
    'y':
      ja-Hrkt: |-
        きれいな　みずを　さがして　あるく。
        ながい　じかん　みずを　のまないと
        あたまの　はっぱが　かれてしまう。
      ja: |-
        きれいな　水を　探して　歩く。
        長い　時間　水を　飲まないと
        頭の　葉っぱが　枯れてしまう。
      ko: |-
        깨끗한 물을 찾아 걷는다.
        오랫동안 물을 마시지 않으면
        머리의 잎이 시들어 버린다.
      en: |-
        It searches about for clean water. If it does not
        drink water for too long, the leaf on its head wilts.
      fr: |-
        Nénupiot recherche toujours les coins où coule
        de l’eau pure. S’il reste longtemps sans boire,
        la feuille sur sa tête commence à faner.
      de: |-
        Es sucht nach reinem Wasser. Wenn es für längere Zeit
        kein Wasser trinkt, verwelkt das Blatt auf seinem Kopf.
      es: |-
        Va buscando agua potable para beber. Si no la
        encuentra pasado un tiempo, se le marchita la hoja
        de la cabeza.
      it: |-
        Vaga alla ricerca di acqua pulita. Se non beve per
        parecchio tempo, la foglia che ha sul capo appassisce.
    omega-ruby:
      ja-Hrkt: |-
        いけや　みずうみの　すいめんに　ういて　くらす。
        はっぱが　かれると　よわってしまうが　きれいな
        みずを　もとめて　たまに　りくちを　いどうする。
      ja: |-
        池や　湖の　水面に　浮いて　暮らす。
        葉っぱが　枯れると　弱ってしまうが　きれいな
        水を　求めて　たまに　陸地を　移動する。
      ko: |-
        연못이나 호수의 수면에 떠서 산다.
        잎사귀가 마르면 약해지지만 깨끗한
        물을 찾아 가끔 육지로 이동한다.
      en: |-
        Lotad live in ponds and lakes, where they float on the surface.
        It grows weak if its broad leaf dies. On rare occasions, this
        Pokémon travels on land in search of clean water.
      fr: |-
        Nénupiot vit dans les étangs et les lacs, sur lesquels
        il flotte à la surface. Si sa feuille tombe, il est affaibli.
        De temps en temps, ce Pokémon sort sur la terre ferme
        à la recherche d’eau propre.
      de: |-
        Loturzel lebt auf der Wasseroberfläche von Teichen oder Seen.
        Es wird schwächer, wenn sein breites Blatt abstirbt. Nur selten
        geht dieses Pokémon an Land, um nach sauberem Wasser
        Ausschau zu halten.
      es: |-
        Lotad vive en estanques y lagos, donde permanece flotando.
        Si se le marchita la ancha hoja que tiene en la cabeza, se
        debilitará. De vez en cuando, se desplaza en busca de agua
        limpia.
      it: |-
        Lotad vive in stagni e laghi, galleggiando a pelo d’acqua.
        S’indebolisce se muoiono le larghe foglie in superficie.
        In rare occasioni si avventura sulla terraferma in cerca
        di acqua pulita.
    alpha-sapphire:
      ja-Hrkt: |-
        もともとは　ちじょうで　せいかつしていたが
        あたまの　はっぱが　おもくなったので　みずに
        うかんで　くらすようになったと　いわれている。
      ja: |-
        元々は　地上で　生活していたが
        頭の　葉っぱが　重くなったので　水に
        浮かんで　暮らすようになったと　いわれている。
      ko: |-
        원래는 지상에서 생활했으나
        머리의 잎사귀가 무거워져서 물에
        떠서 생활하게 됐다고 전해진다.
      en: |-
        Lotad is said to have dwelled on land before. However, this
        Pokémon is thought to have returned to water because the
        leaf on its head grew large and heavy. It now lives by floating
        atop the water.
      fr: |-
        On raconte que jadis, Nénupiot vivait sur terre. Mais on pense
        que ce Pokémon est retourné dans l’eau car la feuille sur
        sa tête était devenue trop grande et trop lourde. Maintenant,
        il vit en flottant à la surface de l’eau.
      de: |-
        Loturzel soll einige Zeit an Land verbracht haben, aber ins
        Wasser zurückgekehrt sein, weil das Blatt auf seinem Kopf
        zu groß und zu schwer geworden ist. Nun lässt es sich auf
        dem Wasser treiben.
      es: |-
        A Lotad se le atribuye el haber vivido antes en tierra. En
        cualquier caso, se cree que volvió al agua porque la hoja de
        la cabeza le creció mucho y le empezó a pesar. Ahora vive
        flotando en el agua.
      it: |-
        Si dice che prima Lotad vivesse sulla terraferma. Tuttavia,
        si dice che sia tornato all’acqua perché le foglie che ha
        sulla testa erano diventate troppo grandi e pesanti.
        Ora vive galleggiando a pelo d’acqua.
    sword:
      ja-Hrkt: |-
        きれいな　みずを　さがして　あるく。
        ながい　じかん　みずを　のまないと
        あたまの　はっぱが　かれてしまう。
      ja: |-
        きれいな　水を　探して　歩く。
        長い　時間　水を　飲まないと
        頭の　葉っぱが　枯れてしまう。
      ko: |-
        깨끗한 물을 찾아 걷는다.
        오랫동안 물을 마시지 않으면
        머리의 잎이 시들어 버린다.
      zh-Hant: |-
        會為了尋找清水而走動。
        如果長時間不喝水的話，
        頭上的葉子就會枯萎。
      zh-Hans: |-
        会走来走去寻找清水。
        如果长时间不饮水的话，
        头上的叶子就会枯萎。
      en: |-
        It searches about for clean water. If it does not
        drink water for too long, the leaf on its
        head wilts.
      fr: |-
        Il recherche toujours les endroits où coule
        de l’eau pure. S’il reste longtemps sans boire,
        la feuille sur sa tête commence à faner.
      de: |-
        Es sucht nach reinem Wasser. Wenn es für längere
        Zeit kein Wasser trinkt, verwelkt das Blatt auf
        seinem Kopf.
      es: |-
        Va buscando agua potable para beber. Si no la
        encuentra pasado bastante tiempo, la hoja de la
        cabeza se le marchita.
      it: |-
        Vaga alla ricerca di acqua pulita. Se non beve
        per parecchio tempo, la foglia che ha sul capo
        appassisce.
    shield:
      ja-Hrkt: |-
        はっぱが　おおきく　なりすぎて
        おもくなって　しまったため　みずに
        うかんで　くらすように　なった。
      ja: |-
        葉っぱが　大きく　なりすぎて
        重くなって　しまったため　水に
        浮かんで　暮らすように　なった。
      ko: |-
        잎사귀가 너무 커서
        무거워졌기 때문에 물에
        떠서 생활하게 되었다.
      zh-Hant: |-
        因為葉子長得太大太重，
        所以才會改變習性，
        漂浮在水面上生活。
      zh-Hans: |-
        因为叶子长得太大太重，
        所以才会改变习性，
        漂浮在水面上生活。
      en: |-
        Its leaf grew too large for it to live on land.
        That is how it began to live floating in the water.
      fr: |-
        Sa feuille est devenue si grande et si lourde
        qu’il doit vivre en flottant sur l’eau.
      de: |-
        Da sein Blatt zu groß und schwer für das Leben
        an Land geworden ist, lebt es nun im Wasser
        schwimmend.
      es: |-
        El excesivo tamaño y peso de la hoja que tiene
        en la cabeza ha propiciado que viva flotando en
        el agua.
      it: |-
        La foglia che ha in testa, diventata
        troppo grande e pesante, lo ha spinto
        a vivere galleggiando a pelo d’acqua.
