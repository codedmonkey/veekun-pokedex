    black:
      en: |-
        It shatters ice with its big tusks.
        Its thick blubber repels not only
        the cold, but also enemy attacks.
      fr: |-
        Il brise la glace avec ses grosses
        défenses. Sa graisse le protège du
        froid, mais aussi des attaques.
    white:
      en: |-
        It shatters ice with its big tusks.
        Its thick blubber repels not only
        the cold, but also enemy attacks.
      fr: |-
        Il brise la glace avec ses grosses
        défenses. Sa graisse le protège du
        froid, mais aussi des attaques.
    black-2:
      en: |-
        Not only does its thick blubber keep it
        warm, it also protects it from attacks.
        It shatters ice with its prized tusks.
    white-2:
      en: |-
        Not only does its thick blubber keep it
        warm, it also protects it from attacks.
        It shatters ice with its prized tusks.
    x:
      ja-Hrkt: |-
        おおきな　こおりを　キバで　くだく。
        あつい　しぼうは　さむさだけでなく
        てきの　こうげきも　はねかえす。
      ja: |-
        大きな　氷を　キバで　砕く。
        厚い　脂肪は　寒さだけでなく
        敵の　攻撃も　はね返す。
      ko: |-
        큰 얼음을 이빨로 부순다.
        두꺼운 지방은 추위뿐만 아니라
        상대의 공격도 이겨낸다.
      en: |-
        It shatters ice with its big tusks. Its thick blubber
        repels not only the cold, but also enemy attacks.
      fr: |-
        Il brise la glace avec ses grosses défenses.
        Sa graisse le protège du froid, mais aussi des
        attaques.
      de: |-
        Mit seinen Stoßzähnen bricht es durch Eis.
        Eine Speckschicht schützt es vor Kälte und Angriffen.
      es: |-
        Rompe el hielo con sus colmillos. Su gruesa capa de
        grasa le protege del frío y de los enemigos.
      it: |-
        Frantuma il ghiaccio con le zanne. Lo spesso strato
        adiposo respinge il freddo e gli attacchi nemici.
    'y':
      ja-Hrkt: |-
        たくましい　キバで　りゅうひょうを
        ふんさいする。ぶあつい　しぼうが
        てきの　こうげきを　はねかえす。
      ja: |-
        たくましい　キバで　流氷を
        粉砕する。分厚い　脂肪が
        敵の　攻撃を　跳ね返す。
      ko: |-
        믿음직한 송곳니로 유빙을
        부스러뜨린다. 두꺼운 지방으로
        적의 공격을 이겨낸다.
      en: |-
        It shatters drift ice with its strong tusks. Its thick
        layer of blubber repels enemy attacks.
      fr: |-
        Ses robustes défenses pulvérisent la glace, et son
        épaisse couche de graisse repousse les attaques.
      de: |-
        Seine kräftigen Stoßzähne können Eisschollen
        zerschmettern. Sein dicker Speck wehrt Angriffe ab.
      es: |-
        Sus fuertes colmillos destrozan los témpanos de hielo.
        Su capa de grasa lo protege de sus enemigos.
      it: |-
        Frantuma il ghiaccio con le potenti zanne. Il suo
        spesso strato adiposo respinge gli attacchi nemici.
    omega-ruby:
      ja-Hrkt: |-
        はったつした　２ほんの　キバは　１０トンも　ある
        ひょうざんを　いちげきで　ふんさいする。
        しぼうが　ぶあつく　ひょうてんかでも　へいき。
      ja: |-
        発達した　２本の　キバは　１０トンも　ある
        氷山を　一撃で　粉砕する。
        脂肪が　ぶ厚く　氷点下でも　平気。
      ko: |-
        발달한 2개의 이빨은 10톤이나 되는
        빙산을 일격에 분쇄한다.
        지방이 두꺼워서 영하의 기온에서도 끄떡없다.
      en: |-
        Walrein’s two massively developed tusks can totally shatter
        blocks of ice weighing 10 tons with one blow. This Pokémon’s
        thick coat of blubber insulates it from subzero temperatures.
      fr: |-
        Les deux énormes défenses de Kaimorse peuvent détruire
        en un seul coup des blocs de glace de plus de 10 t.
        L’épaisse couche de graisse de ce Pokémon l’isole
        lorsque la température est en dessous de zéro.
      de: |-
        Walraisa hat zwei massive Stoßzähne, die mit einem Hieb
        Eisblöcke zertrümmern können, die bis zu 10 t wiegen.
        Es besitzt eine dicke Speckschicht, die es vor eisigen
        Temperaturen schützt.
      es: |-
        Walrein tiene unos exagerados colmillos con los que puede
        hacer añicos bloques de hielo de hasta 10 toneladas de una
        sola dentellada. La gruesa capa de grasa que lo recubre le
        protege de temperaturas inferiores a 0 °C.
      it: |-
        Le due zanne molto sviluppate di Walrein sono in grado
        di ridurre in polvere blocchi di ghiaccio del peso di
        100 quintali. Lo spesso strato di grasso attorno al corpo
        lo isola dalle rigide temperature polari.
    alpha-sapphire:
      ja-Hrkt: |-
        おおきな　キバで　ひょうざんを　くだきながら
        ひょうてんかの　うみを　およぎまわる。
        ぶあつい　しぼうが　こうげきを　はねかえす。
      ja: |-
        大きな　キバで　氷山を　砕きながら
        氷点下の　海を　泳ぎ回る。
        ぶ厚い　脂肪が　攻撃を　跳ね返す。
      ko: |-
        큰 이빨로 빙산을 깨트리며
        영하의 바다를 헤엄쳐 다닌다.
        두꺼운 지방이 공격을 튕겨낸다.
      en: |-
        Walrein swims all over in frigid seawater while crushing
        icebergs with its grand, imposing tusks. Its thick layer of
        blubber makes enemy attacks bounce off harmlessly.
      fr: |-
        Kaimorse nage dans l’eau glacée et détruit les icebergs
        sur son passage à l’aide de ses grandes et impressionnantes
        défenses. Son épaisse couche de graisse lui permet de faire
        rebondir les attaques ennemies.
      de: |-
        Walraisa schwimmt in eiskaltem Meerwasser und zertrümmert
        Eisberge mit seinen beeindruckenden Stoßzähnen. Eine dicke
        Schicht aus Walfischspeck lässt gegnerische Attacken von ihm
        abprallen.
      es: |-
        Walrein va nadando por mares glaciales y destrozando
        icebergs con los enormes e imponentes colmillos que tiene.
        La gruesa capa de grasa que tiene en el cuerpo hace que los
        ataques enemigos reboten y no le hagan ningún daño.
      it: |-
        Walrein nuota in tutti i mari glaciali e frantuma gli iceberg con
        le sue enormi e potenti zanne. Lo spesso strato di grasso che
        avvolge il suo corpo fa rimbalzare senza danno gli attacchi
        nemici.
    sword:
      ja-Hrkt: |-
        ２、３０ひきで　むれを　つくる。
        てきに　おそわれると　リーダーは
        からだを　はって　むれを　まもる。
      ja: |-
        ２、３０匹で　群れを　つくる。
        敵に　襲われると　リーダーは
        体を　張って　群れを　守る。
      ko: |-
        2, 30마리가 무리를 이룬다.
        적에게 공격받으면 리더는
        몸을 던져서 무리를 지킨다.
      zh-Hant: |-
        會由２、３０隻群居生活。
        受到敵人攻擊時，首領會
        奮不顧身地保護群體。
      zh-Hans: |-
        ２、３０只一起群居。
        受到敌人袭击时，
        首领会拼命保护族群。
      en: |-
        Walrein form herds of 20 to 30 individuals.
        When a threat appears, the herd’s leader will
        protect the group with its life.
      fr: |-
        Ils vivent en groupes de 20 à 30 individus.
        Si un ennemi les attaque, le chef s’interpose
        pour tous les protéger, au péril de sa vie.
      de: |-
        Es bildet mit 20 bis 30 Artgenossen eine Herde.
        Wird diese angegriffen, verteidigt der Anführer
        sie unter Einsatz seines Lebens.
      es: |-
        Forman manadas de unos 20 o 30 individuos. Si
        el grupo se ve atacado por un enemigo, el líder
        se interpondrá para proteger al resto.
      it: |-
        Vive in branchi di 20-30 esemplari. In caso
        di attacco nemico, il capo protegge il gruppo
        a costo della vita.
    shield:
      ja-Hrkt: |-
        キバは　いっしょう　のびつづける。
        たたかいで　おれても　１ねんあれば
        もとの　りっぱな　キバに　もどる。
      ja: |-
        キバは　一生　伸び続ける。
        戦いで　折れても　１年あれば
        もとの　立派な　キバに　もどる。
      ko: |-
        이빨은 평생 자란다.
        싸우다 부러져도 1년이 지나면
        원래의 훌륭한 이빨로 복원된다.
      zh-Hant: |-
        獠牙會一輩子不停地成長。
        即使在戰鬥中折斷，也只需要
        １年的時間就又能長得巨大如初。
      zh-Hans: |-
        它的獠牙一生都会持续生长。
        即使在战斗中被折断也能逐渐恢复，
        只需要１年的时间便能完好如初。
      en: |-
        Walrein’s tusks keep growing throughout its life.
        Tusks broken in battle will grow back to their
        usual impressive size in a year.
      fr: |-
        Ses défenses poussent tout au long de sa vie.
        Si l’une d’elles se brise au cours d’un combat,
        au bout d’un an, elle aura repoussé entièrement.
      de: |-
        Die Stoßzähne wachsen sein Leben lang. Selbst,
        wenn sie im Kampf abbrechen, erreichen sie nach
        nur einem Jahr wieder ihre alte imposante Größe.
      es: |-
        Sus colmillos nunca dejan de crecer. Aunque los
        pierda en un combate, al cabo de un año ya los
        habrá regenerado por completo.
      it: |-
        Le sue zanne continuano a crescere per tutta la
        vita. Se si spezzano mentre lotta, tornano
        forti e robuste nell’arco di un anno.
