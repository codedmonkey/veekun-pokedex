claydol:
  base_happiness: 50
  capture_rate: 90
  color: black
  egg_groups:
    - mineral
  evolution_chain: baltoy
  evolves_from: baltoy
  flavor_text:
    ruby:
      en: |-
        CLAYDOL are said to be dolls of mud made
        by primitive humans and brought to life
        by exposure to a mysterious ray.This POKéMON moves about while
        levitating.
    sapphire:
      en: |-
        CLAYDOL is an enigma that appeared
        from a clay statue made by an ancient
        civilization dating back 20,000 years.This POKéMON shoots beams from both
        its hands.
    emerald:
      en: |-
        A CLAYDOL sleeps while hovering in midair.
        Its arms are separate from its body.
        They are kept floating by the POKéMON’s
        manipulation of psychic power.
    firered:
      en: |-
        It appears to have been born from clay
        dolls made by ancient people. It uses
        telekinesis to float and move.
    leafgreen:
      en: |-
        It appears to have been born from clay
        dolls made by ancient people. It uses
        telekinesis to float and move.
    diamond:
      en: |-
        An ancient clay figurine that came
        to life as a Pokémon from exposure
        to a mysterious ray of light.
    pearl:
      en: |-
        An ancient clay figurine that came
        to life as a Pokémon from exposure
        to a mysterious ray of light.
    platinum:
      en: |-
        An ancient clay figurine that came
        to life as a Pokémon from exposure
        to a mysterious ray of light.
    heartgold:
      en: |-
        It is said that it originates from clay
        dolls made by an ancient civilization.
    soulsilver:
      en: |-
        It is said that it originates from clay
        dolls made by an ancient civilization.
    black:
      en: |-
        An ancient clay figurine that came
        to life as a Pokémon from exposure
        to a mysterious ray of light.
      fr: |-
        Une ancienne figurine d’argile qui 
        s’est animée suite à son exposition
        à un rayon de lumière étrange.
    white:
      en: |-
        An ancient clay figurine that came
        to life as a Pokémon from exposure
        to a mysterious ray of light.
      fr: |-
        Une ancienne figurine d’argile qui 
        s’est animée suite à son exposition
        à un rayon de lumière étrange.
    black-2:
      en: |-
        This mysterious Pokémon started life
        as an ancient clay figurine made over
        20,000 years ago.
    white-2:
      en: |-
        This mysterious Pokémon started life
        as an ancient clay figurine made over
        20,000 years ago.
    x:
      ja-Hrkt: |-
        こだいの　どろにんぎょうが
        かいこうせんを　あびたことで
        いのちが　やどり　ポケモンとなった。
      ja: |-
        古代の　泥人形が
        怪光線を　浴びたことで
        命が　宿り　ポケモンとなった。
      ko: |-
        고대의 진흙인형이 괴이한
        광선을 쬐어 생명이 깃들면서
        포켓몬이 되었다.
      en: |-
        An ancient clay figurine that came to life as a
        Pokémon from exposure to a mysterious ray
        of light.
      fr: |-
        Une ancienne figurine d’argile qui s’est animée suite à
        son exposition à un rayon de lumière étrange.
      de: |-
        Eine antike Lehmstatue, die durch ein mysteriöses
        Licht zum Leben erwacht ist.
      es: |-
        Este Pokémon es una vieja figurilla de barro que cobró
        vida mediante la exposición a extraños rayos de luz.
      it: |-
        Pokémon nato da un’antica statuetta d’argilla
        portata in vita da misteriose radiazioni.
    'y':
      ja-Hrkt: |-
        ２まんねんまえの　こだいじんが
        ドロで　つくった　にんぎょうに
        いのちが　やどったと　いわれている。
      ja: |-
        ２万年前の　古代人が
        泥で　作った　人形に
        命が　宿ったと　言われている。
      ko: |-
        2만 년 전에 고대인이
        진흙으로 만든 인형에
        생명이 깃들었다고 한다.
      en: |-
        It is said that it originates from clay dolls made by
        an ancient civilization.
      fr: |-
        Une figurine d’argile fabriquée par une civilisation
        vieille de 20 000 ans et amenée à la vie.
      de: |-
        In die Puppe, die Menschen vor 20 000 Jahren aus
        Lehm formten, ist anscheinend Leben eingefahren.
      es: |-
        Dicen que es una figurilla de barro elaborada por una
        civilización de hace 20 000 años que cobró vida.
      it: |-
        Si tramanda che sia una statuetta d’argilla creata
        dagli antichi 20.000 anni fa che ha preso vita.
    omega-ruby:
      ja-Hrkt: |-
        こだいじんの　どろにんぎょうが　かいこうせんを
        あびて　せいめいを　やどしたと　いわれている。
        くうちゅうに　ういて　いどうしている。
      ja: |-
        古代人の　泥人形が　怪光線を
        浴びて　生命を　宿したと　いわれている。
        空中に　浮いて　移動している。
      ko: |-
        괴이한 광선을 쬔 고대인의 진흙인형에
        생명이 깃들었다고 전해진다.
        공중에 떠서 이동하고 있다.
      en: |-
        Claydol are said to be dolls of mud made by primitive humans
        and brought to life by exposure to a mysterious ray.
        This Pokémon moves about while levitating.
      fr: |-
        On raconte que les Kaorine sont des poupées de boue créées
        par les premiers hommes et qu’elles furent amenées à la vie
        après une exposition à un mystérieux rayon.
        Ce Pokémon se déplace en lévitant.
      de: |-
        Lepumentas sind aus Schlamm gefertigte Puppen, die von
        primitiven Menschen hergestellt und durch mysteriöse Strahlen
        zum Leben erweckt wurden. Diese Pokémon bewegen sich
        schwebend fort.
      es: |-
        Se cree que los Claydol son figuras de barro hechas por
        humanos primitivos y que un misterioso rayo les hizo cobrar
        vida. Este Pokémon se desplaza levitando.
      it: |-
        Pare che Claydol sia una bambola d’argilla creata dall’uomo
        primitivo e portata in vita grazie all’esposizione a misteriose
        radiazioni. Questo Pokémon si muove per levitazione.
    alpha-sapphire:
      ja-Hrkt: |-
        ２まんねんまえに　さかえた　こだい　ぶんめいの
        どろにんぎょうから　うまれた　ナゾの　ポケモン。
        りょうてから　ビームを　はっしゃするぞ。
      ja: |-
        ２万年前に　栄えた　古代　文明の
        泥人形から　生まれた　ナゾの　ポケモン。
        両手から　ビームを　発射するぞ。
      ko: |-
        2만 년 전에 번창한 고대 문명의
        진흙 인형에서 태어난 수수께끼의 포켓몬이다.
        양손에서 빔을 발사한다.
      en: |-
        Claydol is an enigma that appeared from a clay statue made by
        an ancient civilization dating back 20,000 years. This Pokémon
        shoots beams from both its hands.
      fr: |-
        Kaorine est un mystérieux Pokémon apparu sous la forme
        d’une statue en argile fabriquée par une civilisation vieille
        de plus de 20 000 ans. Ce Pokémon envoie des rayons
        avec ses mains.
      de: |-
        Lepumentas ist auf mysteriöse Weise aus einer Tonstatue
        entstanden, die vor 20 000 Jahren von einer antiken
        Zivilisation geschaffen wurde. Dieses Pokémon verschießt
        Strahlen aus beiden Händen.
      es: |-
        Claydol es un enigma, una figura de barro procedente de una
        civilización antigua de hace más de 20 000 años. Este
        Pokémon dispara rayos por las manos.
      it: |-
        Claydol rimane ancora un mistero: comparve da una statua
        d’argilla creata da un popolo antico 20.000 anni fa. Questo
        Pokémon emette radiazioni dai propri arti superiori.
    ultra-sun:
      ja-Hrkt: |-
        ぬれると　からだが　とけてしまう。
        あめが　ふってくると　サイコパワーで
        ぜんしんを　つつんで　まもる。
      ja: |-
        濡れると　身体が　溶けてしまう。
        雨が　降ってくると　サイコパワーで
        全身を　包んで　守る。
      ko: |-
        젖으면 몸이 녹아버린다.
        비가 오면 사이코 파워로
        전신을 감싸서 지킨다.
      zh-Hant: |-
        一旦被淋濕身體就會溶解，
        所以下雨時牠會用精神力量
        包住全身來保護自己。
      zh-Hans: |-
        如果淋湿，身体就会溶解掉。
        所以下雨时会用精神力量
        包住全身，保护自己。
      en: |-
        If it gets wet, its body melts. When rain starts
        to fall, it wraps its whole body up with its
        psychic powers to protect itself.
      fr: |-
        Il fond au moindre contact avec l’eau et doit
        donc entourer son corps d’énergie psychique
        pour se protéger les jours de pluie.
      de: |-
        Wenn es nass wird, schmilzt es. Fängt es an zu
        regnen, errichtet es mit seinen Psycho-Kräften
        eine schützende Hülle um seinen Körper.
      es: |-
        Su cuerpo se disuelve si se moja, razón por la
        que emplea su poder psíquico para crear una
        barrera a su alrededor los días de lluvia.
      it: |-
        Se si bagna, si scioglie. Quando piove,
        si protegge usando i suoi poteri psichici.
    ultra-moon:
      ja-Hrkt: |-
        こだいじんが　そらから　おりてきた
        なにかを　もして　つくったらしい。
        りょううで　から　ビームを　はなつ。
      ja: |-
        古代人が　空から　降りてきた
        なにかを　模して　作ったらしい。
        両腕　から　ビームを　放つ。
      ko: |-
        고대인이 하늘에서 내려온
        무언가를 본떠서 만들었다고 한다.
        양팔에서 빔을 발사한다.
      zh-Hant: |-
        似乎是古代人模仿從天而降的
        某種東西而製造的。
        會從雙臂發射出光束。
      zh-Hans: |-
        好像是古代人模仿
        从天而降的某物制作而成。
        会从双臂发射出光束。
      en: |-
        The ancient people who made it apparently
        modeled it after something that descended
        from the sky. It fires beams from both arms.
      fr: |-
        Il aurait été fabriqué par une civilisation
        ancienne, sur le modèle d’un objet mystérieux
        tombé du ciel. Ses bras peuvent tirer des lasers.
      de: |-
        Menschen der Urzeit haben es als Nachbildung
        von etwas, das vom Himmel kam, hergestellt.
        Es verschießt Strahlen aus beiden Händen.
      es: |-
        Se cree que fue creado por humanos primitivos
        que tomaron como modelo algo caído del cielo.
        Dispara rayos por las manos.
      it: |-
        Sembra che sia stato creato da un popolo antico
        ispirandosi a qualcosa di misterioso caduto
        dal cielo. Emette raggi dagli arti superiori.
    sword:
      ja-Hrkt: |-
        ２まんねんまえの　こだいじんが
        つくった　ドロにんぎょうから
        うまれたらしい　ナゾの　ポケモン。
      ja: |-
        ２万年前の　古代人が
        つくった　泥人形から
        生まれたらしい　謎の　ポケモン。
      ko: |-
        2만 년 전 고대인이
        만든 진흙인형에서
        태어난 듯한 의문의 포켓몬.
      zh-Hant: |-
        似乎是由２萬年前的
        古代人製作的泥偶
        蛻變而來的謎之寶可夢。
      zh-Hans: |-
        似乎是由２万年前的
        古代人制作的泥偶
        蜕变而来的谜之宝可梦。
      en: |-
        This mysterious Pokémon started life as an ancient
        clay figurine made over 20,000 years ago.
      fr: |-
        Ce Pokémon mystérieux serait né d’une figurine
        d’argile vieille de près de 20 000 ans.
      de: |-
        Dieses rätselhafte Pokémon ist aus einer
        Lehmpuppe entstanden, die vor 20 000 Jahren
        von einem uralten Volk angefertigt wurde.
      es: |-
        Al parecer, este misterioso Pokémon nació a
        partir de una figurilla de barro creada por una
        civilización de hace más de 20 000 años.
      it: |-
        Un Pokémon enigmatico nato da una statuetta
        d’argilla costruita dagli antichi 20.000 anni
        or sono.
    shield:
      ja-Hrkt: |-
        こだいじんの　どろにんぎょうから
        うまれたらしい。　ねんりきを　つかい
        くうちゅうに　ういて　いどうする。
      ja: |-
        古代人の　泥人形から
        生まれたらしい。　念力を　使い
        空中に　浮いて　移動する。
      ko: |-
        고대인의 진흙인형에서
        태어난 것 같다. 염력을
        사용해 공중을 떠다닌다.
      zh-Hant: |-
        似乎是從古代人做的
        泥偶誕生而來的寶可夢。
        能靠念力飄浮在空中移動。
      zh-Hans: |-
        似乎是从古代人做的
        泥偶诞生而来的宝可梦。
        能靠念力浮在空中移动。
      en: |-
        It appears to have been born from clay dolls
        made by ancient people. It uses telekinesis to
        float and move.
      fr: |-
        Ce Pokémon aurait été créé à partir d’une poupée
        d’argile confectionnée par une ancienne
        civilisation. Il se déplace en lévitant.
      de: |-
        Es scheint, sein Ursprung geht auf altertümliche
        Lehmpuppen zurück. Durch Telekinese kann es
        schweben und sich bewegen.
      es: |-
        Dicen que surgió de una figurilla de barro hecha
        por una antigua civilización. Usa telequinesia
        para levitar y moverse.
      it: |-
        Pare che sia nato da un’antica bambola
        di argilla. Si sposta levitando a mezz’aria
        grazie alla telecinesi.
