florges:
  base_happiness: 70
  capture_rate: 45
  color: white
  egg_groups:
    - fairy
  evolution_chain: flabebe
  evolves_from: floette
  flavor_text:
    x:
      ja-Hrkt: |-
        テリトリーは　みごとな　はなぞの。
        くさばなが　はなつ　エネルギーを
        あびて　じぶんの　パワーにするのだ。
      ja: |-
        テリトリーは　見事な　花園。
        草花の　放つ　エネルギーを　浴びて
        自分の　パワーにするのだ。
      ko: |-
        멋진 화원이 영역이다.
        화초가 내보내는 에너지를
        쬐어 자신의 파워로 삼는다.
      en: |-
        It claims exquisite flower gardens as its territory,
        and it obtains power from basking in the energy
        emitted by flowering plants.
      fr: |-
        Les jardins fleuris sont son territoire.
        Il se baigne dans l’énergie dégagée par les plantes
        en fleurs pour l’absorber.
      de: |-
        Wunderschöne Blumengärten sind sein Revier.
        Es badet in der von blühenden Blumen freigesetzten
        Energie und zieht daraus seine Kraft.
      es: |-
        Habita en preciosos jardines floridos. Absorbe la
        energía que emiten las plantas y la convierte en su
        fuente de poder.
      it: |-
        Il suo habitat preferito sono i meravigliosi giardini
        fioriti. Assorbe e utilizza l’energia di piante e fiori.
    'y':
      ja-Hrkt: |-
        むかしの　しろの　あるじたちは
        にわを　かざるため　フラージェスを
        まねきいれ　はなぞのを　つくらせた。
      ja: |-
        昔の　城の　主たちは　庭を　飾るため
        フラージェスを　招き入れ
        花園を　作らせた。
      ko: |-
        옛 성의 주인은
        정원을 꾸미기 위해 플라제스를
        불러들여 화원을 만들게 했다.
      en: |-
        In times long past, governors of castles
        would invite Florges to create flower gardens
        to embellish the castle domains.
      fr: |-
        Les châtelains de jadis invitaient les Florges sur leurs
        terres et leur confiaient la réalisation de leurs jardins.
      de: |-
        Die Schlossherren vergangener Zeiten haben Florges
        eingeladen, damit diese Blumengärten für sie anlegen,
        um so ihre Anwesen zu verschönern.
      es: |-
        Los propietarios de los castillos de antaño solían
        invitar a Florges para que creasen jardines floridos,
        a fin de decorar sus terrenos.
      it: |-
        Anticamente, i padroni dei castelli ricorrevano al suo
        aiuto per abbellire i loro giardini con tanti fiori diversi.
    omega-ruby:
      ja-Hrkt: |-
        テリトリーは　みごとな　はなぞの。
        くさばなが　はなつ　エネルギーを
        あびて　じぶんの　パワーにするのだ。
      ja: |-
