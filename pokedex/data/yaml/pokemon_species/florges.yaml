        abbellire i loro giardini con tanti fiori diversi.
    ultra-sun:
      ja-Hrkt: |-
        そだてた　はなばなを　あやつる。
        フラージェスの　はなつ　はなふぶきは
        うつくしさも　パワーも　あっとうてき。
      ja: |-
        育てた　花々を　操る。
        フラージェスの　放つ　花吹雪は
        美しさも　パワーも　圧倒的。
      ko: |-
        기른 꽃들을 조종한다.
        플라제스가 발산하는 꽃보라는
        아름다움도 파워도 압도적이다.
      zh-Hant: |-
        會操縱自己培育的花朵。
        花潔夫人使出的落英繽紛
        有著壓倒性的力與美。
      zh-Hans: |-
        会操纵自己培育的花。
        花洁夫人释放的落英缤纷，
        其美貌和力量都是压倒性的。
      en: |-
        It controls the flowers it grows. The petal
        blizzards that Florges triggers are overwhelming
        in their beauty and power.
      fr: |-
        Il contrôle les fleurs qu’il cultive. Les tempêtes
        de pétales qu’il déchaîne sont aussi belles que
        redoutables.
      de: |-
        Es kontrolliert selbst gezüchtete Blumen. Die
        Blütenwirbel, die es erzeugt, sind überwältigend
        schön und stark.
      es: |-
        Es capaz de controlar las flores que cultiva. La
        ráfaga de pétalos que emplea es hermosa a la
        vez que devastadora.
      it: |-
        Ha il potere di controllare i fiori che coltiva.
        È in grado di creare tempeste di fiori tanto
        meravigliose quanto devastanti.
    ultra-moon:
      ja-Hrkt: |-
        すうひゃくねんの　じゅみょうをもつ。
        ていえんを　まもりつづけることに
        その　いっしょうを　ささげるという。
      ja: |-
        数百年の　寿命を持つ。
        庭園を　守り続けることに
        その　一生を　ささげるという。
      ko: |-
        수백 년의 수명을 가졌다.
        정원을 지키는 일에
        일생을 바친다고 한다.
      zh-Hant: |-
        擁有數百年的壽命。
        據說牠終其一生都會
        不斷守護著庭園。
      zh-Hans: |-
        拥有几百年的寿命。
        据说会终其一生不断地守护着庭园。
      en: |-
        Its life can span several hundred years. It’s said
        to devote its entire life to protecting gardens.
      fr: |-
        Il peut vivre des centaines d’années, et
        consacre sa longue existence à l’entretien
        des jardins.
      de: |-
        Es hat eine Lebenserwartung von mehreren
        Hundert Jahren. Man sagt, es widme sein ganzes
        Dasein beharrlich der Pflege von Blumengärten.
      es: |-
        Su esperanza de vida asciende a varios siglos y
        dedica toda su dilatada existencia al cuidado
        de los jardines.
      it: |-
        Può vivere per centinaia di anni e dedica la sua
        intera esistenza alla cura dei giardini fioriti.
