        Assorbe e utilizza l’energia di piante e fiori.
    alpha-sapphire:
      ja-Hrkt: |-
        むかしの　しろの　あるじたちは
        にわを　かざるため　フラージェスを
        まねきいれ　はなぞのを　つくらせた。
      ja: |-
        昔の　城の　主たちは　庭を　飾るため
