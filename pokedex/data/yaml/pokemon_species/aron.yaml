aron:
  base_happiness: 35
  capture_rate: 180
  color: gray
  egg_groups:
    - monster
  evolution_chain: aron
  evolves_from: ~
  flavor_text:
    ruby:
      en: |-
        This POKéMON has a body of steel.
        To make its body, ARON feeds on
        iron ore that it digs from mountains.Occasionally, it causes major trouble by
        eating bridges and rails.
    sapphire:
      en: |-
        ARON has a body of steel.
        With one all-out charge, this POKéMON
        can demolish even a heavy dump truck.The destroyed dump truck then becomes
        a handy meal for the POKéMON.
    emerald:
      en: |-
        A POKéMON that is clad in steel armor.
        A new suit of armor is made when it evolves.
        The old, discarded armor is salvaged as
        metal for making iron products.
    firered:
      en: |-
        It eats iron to build its steel body.
        It is a pest that descends from mountains
        to eat bridges and train tracks.
    leafgreen:
      en: |-
        It eats iron to build its steel body.
        It is a pest that descends from mountains
        to eat bridges and train tracks.
    diamond:
      en: |-
        It usually lives deep in mountains.
        However, hunger may drive it to
        eat railroad tracks and cars.
    pearl:
      en: |-
        It usually lives deep in mountains.
        However, hunger may drive it to
        eat railroad tracks and cars.
    platinum:
      en: |-
        It usually lives deep in mountains.
        However, hunger may drive it to
        eat railroad tracks and cars.
    heartgold:
      en: |-
        When it evolves, it sheds the steel
        carapace that covered its whole body
        and develops a new one.
    soulsilver:
      en: |-
        When it evolves, it sheds the steel
        carapace that covered its whole body
        and develops a new one.
    black:
      en: |-
        It usually lives deep in mountains.
        However, hunger may drive it to
        eat railroad tracks and cars.
      fr: |-
        Il vit habituellement au cœur des
        montagnes. Affamé, il dévore
        parfois des rails et des voitures.
    white:
      en: |-
        It usually lives deep in mountains.
        However, hunger may drive it to
        eat railroad tracks and cars.
      fr: |-
        Il vit habituellement au cœur des
        montagnes. Affamé, il dévore
        parfois des rails et des voitures.
    black-2:
      en: |-
        In order to build up its steel body,
        it eats iron ore. This pesky Pokémon
        is known to eat railroad tracks.
    white-2:
      en: |-
        In order to build up its steel body,
        it eats iron ore. This pesky Pokémon
        is known to eat railroad tracks.
    x:
      ja-Hrkt: |-
        ふだんは　やまおくで　くらしているが
        おなかが　すくと　ふもとに　あらわれ
        せんろや　くるまを　たべてしまう。
      ja: |-
        普段は　山奥で　暮らしているが
        お腹が　すくと　ふもとに　現われ
        線路や　車を　食べてしまう。
      ko: |-
        평소에는 산속에서 살고 있지만
        배가 고프면 산기슭에 나타나
        선로나 차를 먹어 버린다.
      en: |-
        It usually lives deep in mountains. However, hunger
        may drive it to eat railroad tracks and cars.
      fr: |-
        Il vit habituellement au cœur des montagnes.
        Affamé, il dévore parfois des rails et des voitures.
      de: |-
        Normalerweise lebt es in dunklen Bergen. Ist es
        hungrig, frisst es auch Eisenbahnschienen und Autos.
      es: |-
        Suele vivir en lugares inaccesibles de las montañas,
        pero el hambre lo empuja a comer raíles y coches.
      it: |-
        Vive generalmente sui monti ma, spinto dalla fame,
        scende per cibarsi di binari ferroviari e automobili.
    'y':
      ja-Hrkt: |-
        からだを　おおう　はがねの　よろいは
        しんかするとき　ポロリと　はがれおち
        あたらしい　よろいが　つくられる。
      ja: |-
        体を　覆う　鋼の　よろいは
        進化するとき　ポロリと　はがれ落ち
        新しい　よろいが　作られる。
      ko: |-
        몸을 감싼 강철 갑옷은
        진화할 때 똑 떨어져
        새 갑옷이 만들어진다.
      en: |-
        When it evolves, it sheds the steel carapace that
        covered its whole body and develops a new one.
      fr: |-
        L’armure d’acier qui recouvre son corps s’émiette
        quand il évolue pour laisser place à une nouvelle.
      de: |-
        Entwickelt es sich, wirft es seinen alten Stahlpanzer ab
        und bildet einen neuen aus.
      es: |-
        Al evolucionar, la coraza de acero que recubre todo
        su cuerpo se cae para crear una nueva.
      it: |-
        L’armatura d’acciaio che riveste Aron viene sostituita
        da una nuova quando il Pokémon si evolve.
    omega-ruby:
      ja-Hrkt: |-
        はがねの　からだを　つくるため　てっこうせきを
        やまから　ほりだして　たべているが　たまに
        はしや　レールを　たべてしまう　こまりものだ。
      ja: |-
        鋼の　体を　つくるため　鉄鉱石を
        山から　掘り出して　食べているが　たまに
        橋や　レールまで　食べてしまう　困りものだ。
      ko: |-
        강철 몸을 만들기 위해 철광석을
        산에서 채광해 먹지만 가끔
        다리나 레일을 먹어버리는 말썽꾸러기다.
      en: |-
        This Pokémon has a body of steel. To make its body, Aron
        feeds on iron ore that it digs from mountains. Occasionally,
        it causes major trouble by eating bridges and rails.
      fr: |-
        Ce Pokémon a un corps en acier. Pour constituer son corps,
        Galekid se nourrit de minerai de fer extrait des montagnes.
        De temps en temps, il cause de nombreux dégâts en mangeant
        des ponts ou des rails.
      de: |-
        Dieses Pokémon hat einen Körper aus Stahl. Stollunior ernährt
        sich von Eisenerz aus den Bergen. Zuweilen richtet es großen
        Schaden an, weil es Brücken und Bahngleise auffrisst.
      es: |-
        Este Pokémon tiene el cuerpo de acero. Para mantenerlo, se
        alimenta del hierro que saca de las montañas. A veces, causa
        verdaderos problemas, pues se come puentes y vías de tren.
      it: |-
        Il corpo di Aron è costituito d’acciaio. Per mantenerne
        la consistenza Aron si ciba di pepite di ferro rinvenute
        scavando in montagna. Talvolta crea enorme scompiglio
        poiché si nutre anche di ponti e ferrovie.
    alpha-sapphire:
      ja-Hrkt: |-
        こうてつの　からだで　おもいっきり　ぶつかれば
        おおきな　ダンプカーも　いちげきで　バラバラだ。
        こわれた　ダンプカーを　むしゃむしゃ　たべるぞ。
      ja: |-
        鋼鉄の　体で　思いっきり　ぶつかれば
        大きな　ダンプカーも　一撃で　バラバラだ。
        壊れた　ダンプカーを　むしゃむしゃ　食べるぞ。
      ko: |-
        강철의 몸으로 힘껏 부딪치면
        큰 덤프트럭도 한 방에 엉망이 된다.
        부서진 덤프트럭을 우적우적 먹는다.
      en: |-
        Aron has a body of steel. With one all-out charge, this
        Pokémon can demolish even a heavy dump truck.
        The destroyed dump truck then becomes a handy meal
        for the Pokémon.
      fr: |-
        Galekid a un corps d’acier. En une seule charge, ce Pokémon
        peut démolir un camion poids lourd. Le camion détruit devient
        ensuite le repas de ce Pokémon.
      de: |-
        Stolluniors Körper besteht aus Stahl. Mit einem Schlag kann
        dieses Pokémon einen Schwerlasttransporter demolieren.
        Der Lastwagen stellt danach eine handliche Mahlzeit für
        dieses Pokémon dar.
      es: |-
        Aron tiene el cuerpo de acero. Con una carga hecha con toda
        la fuerza es capaz de demoler hasta un camión de basura y,
        a continuación, comérselo.
      it: |-
        Aron è dotato di un corpo d’acciaio. Con una sola potente
        carica riesce a demolire anche un camion a rimorchio. Questo
        costituisce poi un sano e ricco pasto per il Pokémon.
    sword:
      ja-Hrkt: |-
        てっこうせきや　たまに　てつどうの
        レールを　たべて　からだを　まもる
        はがねの　よろいが　つくられる。
      ja: |-
        鉄鉱石や　たまに　鉄道の　レールを
        食べて　体を　守る
        鋼の　鎧が　つくられる。
      ko: |-
        철광석을 먹거나 가끔은
        철도의 레일을 먹고
        몸을 지키는 강철 갑옷을 만든다.
      zh-Hant: |-
        保護牠身體的鋼鐵盔甲，
        是由牠吃下的鐵礦石以及
        偶爾吃下的鐵軌所製成的。
      zh-Hans: |-
        食用铁矿石，偶尔也会吃
        铁路的轨道，从而打造出
        保护身体的钢铁盔甲。
      en: |-
        It eats iron ore—and sometimes railroad tracks—
        to build up the steel armor that protects its body.
      fr: |-
        Il se nourrit de minerai de fer et parfois même
        de rails pour se fabriquer une armure d’acier
        qui protège son corps.
      de: |-
        Es frisst Eisenerz und manchmal auch Bahngleise.
        So bildet es einen Panzer aus Stahl, der seinen
        Körper schützt.
      es: |-
        Se alimenta de minerales de hierro o, en
        ocasiones, de vías de tren para producir la
        coraza de acero que le protege el cuerpo.
      it: |-
        Si ciba di minerali ferrosi e talvolta di rotaie,
        che vanno poi a costituire l’armatura d’acciaio
        che protegge il suo corpo.
    shield:
      ja-Hrkt: |-
        しんかのとき　はがねの　よろいが
        はがれおちる。　むかしの　ひとは
        ひろって　せいかつに　やくだてた。
      ja: |-
        進化のとき　鋼の　鎧が
        剥がれ落ちる。　昔の　人は
        拾って　生活に　役立てた。
      ko: |-
        진화할 때 강철의 갑옷이
        떨어진다. 옛날 사람들은 주워서
        일상생활에서 유용하게 사용했다.
      zh-Hant: |-
        進化時身上的鋼鐵盔甲
        會脫落。以前的人會把
        它撿起來用在生活上。
      zh-Hans: |-
        进化的时候，钢铁盔甲会
        全部脱落。人们曾经
        将其捡来活用于生活。
      en: |-
        When Aron evolves, its steel armor peels off. In
        ancient times, people would collect Aron’s shed
        armor and make good use of it in their daily lives.
      fr: |-
        Quand il évolue, il perd son armure d’acier.
        Autrefois, les gens la ramassaient pour
        en faire usage dans leur vie quotidienne.
      de: |-
        Stollunior wirft seinen Stahlpanzer ab, wenn es
        sich entwickelt. Früher sammelten Menschen
        diesen auf und nutzten ihn für Alltagszwecke.
      es: |-
        Antiguamente se recogía la coraza de acero
        que este Pokémon desprende al evolucionar
        y se empleaba para distintos usos.
      it: |-
        Quando si evolve, l’armatura d’acciaio si stacca.
        In passato, gli esseri umani la raccoglievano per
        utilizzarla in attività quotidiane.
