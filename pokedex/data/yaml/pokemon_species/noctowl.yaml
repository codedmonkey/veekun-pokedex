    white-2:
      en: |-
        Its eyes are specially developed
        to enable it to see clearly even in
        murky darkness and minimal light.
    x:
      ja-Hrkt: |-
        りょうめは　とくしゅな　つくり。
        わずかな　ひかりを　あつめては
        くらやみでも　まわりを　みわける。
      ja: |-
        両目は　特殊な　つくり。
        わずかな　光を　集めては
        暗闇でも　まわりを　見分ける。
      ko: |-
        양쪽 눈이 특수한 구조다.
        적은 양의 빛이라도 잘 모아
        어둠 속에서도 주위를 분별한다.
      en: |-
        Its eyes are specially adapted. They concentrate
        even faint light and enable it to see in the dark.
      fr: |-
        Ses yeux sont adaptés à la nuit. Ils peuvent
        concentrer la faible lumière dans l’obscurité.
      de: |-
        Sein Sehvermögen ist hervorragend. Selbst bei
        schwachem Licht kann es jedes Detail erkennen.
      es: |-
        Sus ojos están especialmente adaptados.
        Concentran la luz para poder ver en la oscuridad.
      it: |-
        Ha degli occhi speciali con cui concentra anche la
        luce più fioca per poter vedere al buio.
    'y':
      ja-Hrkt: |-
        ものごとを　かんがえだすと
        くびを　１８０ど　かいてん　させて
        あたまの　はたらきを　たかめる。
      ja: |-
        物事を　考え出すと
        首を　１８０度　回転させて
        頭の　働きを　高める。
      ko: |-
        뭔가를 생각해내면
        목을 180도 회전시켜
        두뇌 회전을 높인다.
      en: |-
        When it needs to think, it rotates its head
        180 degrees to sharpen its intellectual power.
      fr: |-
        Quand il réfléchit, il tourne sa tête sur 180° pour
        optimiser son mode de pensée.
      de: |-
        Muss es nachdenken, dreht es seinen Kopf um
        180 Grad, um so seinen Intellekt zu schärfen.
      es: |-
        Cuando necesita pensar, gira su cabeza 180° para
        agudizar su capacidad intelectual.
      it: |-
        Quando pensa ruota la testa di 180 gradi per
        potenziare le sue capacità intellettive.
    omega-ruby:
      ja-Hrkt: |-
        わずかな　ひかりでも　みえる　すぐれた　めと
        はおとを　たてない　やわらかい　はねの　おかげで
        くらやみでは　えものを　ぜったいに　にがさない。
      ja: |-
        わずかな　光でも　見える　優れた　目と
        羽音を　立てない　柔らかい　羽の　おかげで
        暗闇では　獲物を　絶対に　逃がさない。
      ko: |-
        약간의 빛만으로도 볼 수 있는 우수한 눈과
        날갯소리를 내지 않는 부드러운 깃털 덕분에
        어둠 속에서 먹이를 절대 놓치지 않는다.
      en: |-
        Noctowl never fails at catching prey in darkness. This Pokémon
        owes its success to its superior vision that allows it to see in
        minimal light, and to its soft, supple wings that make no sound
        in flight.
      fr: |-
        Dans l’obscurité, Noarfang ne rate jamais une proie.
        Il le doit à sa vision surdéveloppée qui lui permet de
        tout voir, même avec une lueur très faible, ainsi qu’à
        ses ailes très souples et silencieuses.
      de: |-
        Dank seines hervorragenden Sehvermögens, mit dem es
        auch bei geringer Beleuchtung sehen kann, und dank seiner
        geschmeidigen Flügel, mit denen es geräuschlos fliegt,
        entgeht Noctuh keine Beute.
      es: |-
        Noctowl no falla a la hora de cazar a su presa en la oscuridad.
        El éxito se lo debe a una vista privilegiada, que le permite ver
        donde apenas hay luz, y a las ligeras y flexibles alas que
        tiene, que no hacen ruido alguno al volar.
      it: |-
        Noctowl non manca mai la cattura di una preda nell’oscurità.
        L’infallibilità gli deriva dall’acutissima vista, che gli consente
        di vedere anche alla luce più flebile, e dalle ali morbide e
        soffici, silenziosissime in volo.
    alpha-sapphire:
      ja-Hrkt: |-
        わずかな　ひかりでも　みえる　すぐれた　めと
        はおとを　たてない　やわらかい　はねの　おかげで
        くらやみでは　えものを　ぜったいに　にがさない。
      ja: |-
        わずかな　光でも　見える　優れた　目と
        羽音を　立てない　柔らかい　羽の　おかげで
        暗闇では　獲物を　絶対に　逃がさない。
      ko: |-
        약간의 빛만으로도 볼 수 있는 우수한 눈과
        날갯소리를 내지 않는 부드러운 깃털 덕분에
        어둠 속에서 먹이를 절대 놓치지 않는다.
      en: |-
        Noctowl never fails at catching prey in darkness. This Pokémon
        owes its success to its superior vision that allows it to see in
        minimal light, and to its soft, supple wings that make no sound
        in flight.
      fr: |-
        Dans l’obscurité, Noarfang ne rate jamais une proie.
        Il le doit à sa vision surdéveloppée qui lui permet de
        tout voir, même avec une lueur très faible, ainsi qu’à
        ses ailes très souples et silencieuses.
      de: |-
        Dank seines hervorragenden Sehvermögens, mit dem es
        auch bei geringer Beleuchtung sehen kann, und dank seiner
        geschmeidigen Flügel, mit denen es geräuschlos fliegen kann,
        entgeht Noctuh keine Beute.
      es: |-
        Noctowl no falla a la hora de cazar a su presa en la oscuridad.
        El éxito se lo debe a una vista privilegiada, que le permite ver
        donde apenas hay luz, y a las ligeras y flexibles alas que
        tiene, que no hacen ruido alguno al volar.
      it: |-
        Noctowl non manca mai la cattura di una preda nell’oscurità.
        L’infallibilità gli deriva dall’acutissima vista, che gli consente
        di vedere anche alla luce più flebile, e dalle ali morbide e
        soffici, silenziosissime in volo.
    ultra-sun:
      ja-Hrkt: |-
        くらやみでも　はっきり　みえる　めを
        もっており　えものを　にがさない。
        やみよの　ていおうとも　よばれる。
      ja: |-
        暗闇でも　はっきり　見える　目を
        持っており　獲物を　逃がさない。
        闇夜の　帝王とも　呼ばれる。
      ko: |-
        어둠 속에서도 뚜렷이 볼 수 있는 눈을
        갖고 있어 먹이를 놓치지 않는다.
        어둠의 제왕이라고도 불린다.
      zh-Hant: |-
        擁有在黑暗中也能清楚看見的眼睛，
        不會放過任何獵物，
        所以也被稱為黑夜帝王。
      zh-Hans: |-
        即便是在黑暗里，它的眼睛也能
        看得一清二楚，不会放过任何猎物。
        所以也被称为黑夜帝王。
      en: |-
        With eyes that can see in pitch-darkness, it
        never lets its prey escape. Some even call it
        “the emperor of dark nights.”
      fr: |-
        Sa vue perçante lui permettant de distinguer sa
        proie même dans l’obscurité la plus profonde,
        il a reçu le surnom d’« empereur de la nuit ».
      de: |-
        Dank seines perfekten Sehvermögens entgeht
        ihm selbst in der Dunkelheit keine Beute. Man
        nennt es auch den „Herrscher der Nacht“.
      es: |-
        Apodado el Emperador Nocturno, su aguzada
        vista lo convierte en un formidable cazador aun
        en la más impenetrable oscuridad.
      it: |-
        Riesce a vedere benissimo anche nell’oscurità
        e non si lascia mai sfuggire una preda.
        È chiamato anche “re della notte”.
    ultra-moon:
      ja-Hrkt: |-
        あたまが　さかさまむきの　ときは
        とても　なやんでいる　あかし。
        そっとしておかないと　ついばまれる。
      ja: |-
        頭が　逆さま向きの　ときは
        とても　悩んでいる　証。
        そっとしておかないと　ついばまれる。
      ko: |-
        머리가 거꾸로 되었을 때는
        매우 고민하고 있다는 증거다.
        가만히 두지 않으면 쪼아 댄다.
      zh-Hant: |-
        如果牠的頭倒轉過來，
        就代表牠非常煩惱。
        這時如果去驚動牠就會被啄。
      zh-Hans: |-
        头倒转过来就表示它非常烦恼。
        如果这时去惊动它，就会被啄。
      en: |-
        When it turns its head entirely upside down,
        you know it’s troubled by something. If you don’t
        leave it be, it will peck you.
      fr: |-
        Quand il est soucieux, il tourne la tête à 180
        degrés. Il ne faut alors surtout pas le déranger,
        sous peine de recevoir un coup de bec.
      de: |-
        Dreht es seinen Kopf um 180 Grad, ist es aus
        irgendeinem Grund besorgt. Man lässt es dann
        zur eigenen Sicherheit am besten in Ruhe.
      es: |-
        Si da media vuelta a la cabeza es señal de que
        está preocupado y conviene no molestarlo.
        Quien lo haga se arriesga a recibir un picotazo.
      it: |-
        Quando capovolge la testa all’ingiù vuol dire che
        c’è qualcosa che lo preoccupa. Meglio non
        disturbarlo o si rischia di venire beccati.
    sword:
      ja-Hrkt: |-
        とくしゅな　つくりの　りょうめは
        わずかな　ひかりさえ　あれば
        くらやみでも　ひるのように　みえる。
      ja: |-
        特殊な　つくりの　両目は
        わずかな　光さえ　あれば
        暗闇でも　昼のように　見える。
      ko: |-
        특수한 구조의 두 눈은
        약간의 빛만 있으면
        어둠 속에서도 낮처럼 볼 수 있다.
      zh-Hant: |-
        雙眼有著特殊的構造，只要有
        些微的光線，即使在黑暗中
        也能看得像白天一樣清楚。
      zh-Hans: |-
        双眼有着特殊的构造，只要有
        些微的光线，即使在黑暗中
        也能看得像白天一样清楚。
      en: |-
        Its eyes are specially developed to enable it to
        see clearly even in murky darkness and minimal light.
      fr: |-
        Ses yeux à la structure particulière sont capables
        de voir comme en plein jour même quand il fait
        très sombre.
      de: |-
        Seine Augen sind so gut entwickelt, dass es selbst
        in fast kompletter Dunkelheit so klar sehen kann,
        als wäre es Tag.
      es: |-
        Tiene los ojos muy desarrollados y puede ver con
        increíble claridad en la oscuridad más absoluta.
      it: |-
        Grazie alla speciale struttura dei suoi occhi,
        gli basta la luce più fioca per vedere anche
        nell’oscurità come fosse pieno giorno.
    shield:
      ja-Hrkt: |-
        ものごとを　かんがえだすと
        くびを　１８０ど　かいてん　させて
        あたまの　はたらきを　たかめる。
      ja: |-
        ものごとを　考えだすと
        首を　１８０度　回転　させて
        頭の　働きを　高める。
      ko: |-
        무언가를 생각하기 시작하면
        목을 180도 회전시켜
        두뇌 회전을 높인다.
      zh-Hant: |-
        開始思考事情時，
        會將脖子旋轉１８０度，
        提高大腦的工作效率。
      zh-Hans: |-
        开始思考事情时，
        会将脖子旋转１８０度，
        以此提高大脑的工作效率。
      en: |-
        When it needs to think, it rotates its head
        180 degrees to sharpen its intellectual power.
      fr: |-
        Quand il réfléchit, il tourne sa tête sur 180 degrés
        pour optimiser son mode de pensée.
      de: |-
        Muss es nachdenken, dreht es seinen Kopf um
        180 Grad, um so seinen Intellekt zu schärfen.
      es: |-
        Cuando necesita pensar, gira la cabeza 180°
        para agudizar su capacidad intelectual.
      it: |-
        Quando pensa ruota la testa di 180 gradi
        per potenziare le sue capacità intellettive.
