        color. The zigzag pattern on its
        belly doesn’t change, however.
    heartgold:
      en: |-
        It changes its shading to match its
        surroundings so it can sneak up on prey.
        Only its belly patterns stay fixed.
    soulsilver:
      en: |-
        It changes its shading to match its
        surroundings so it can sneak up on prey.
        Only its belly patterns stay fixed.
    black:
      en: |-
        It can freely change its body’s
        color. The zigzag pattern on its
        belly doesn’t change, however.
      fr: |-
        Il change de couleur à volonté,
        mais le motif en zigzag qui orne
        son ventre reste le même.
    white:
      en: |-
        It can freely change its body’s
        color. The zigzag pattern on its
        belly doesn’t change, however.
      fr: |-
        Il change de couleur à volonté,
        mais le motif en zigzag qui orne
        son ventre reste le même.
    black-2:
      en: |-
        It can freely change its body’s
        color. The zigzag pattern on its
        belly doesn’t change, however.
    white-2:
      en: |-
        It can freely change its body’s
        color. The zigzag pattern on its
        belly doesn’t change, however.
    x:
      ja-Hrkt: |-
        からだの　いろを　じゆうに　かえる
        のうりょくを　もつ。おなかにある
        ギザギザもよう　だけは　かわらない。
      ja: |-
        体の　色を　自由に　変える
        能力を　持つ。お腹にある
        ギザギザ模様　だけは　変わらない。
      ko: |-
        몸의 색을 자유롭게 바꾸는
        능력을 가지고 있다. 배에 있는
        톱니무늬만은 바뀌지 않는다.
      en: |-
        It can freely change its body’s color. The zigzag
        pattern on its belly doesn’t change, however.
      fr: |-
        Il change de couleur à volonté, mais le motif en
        zigzag qui orne son ventre reste le même.
      de: |-
        Es kann nach Belieben seine Farbe ändern. Nur das
        gezackte Muster auf seinem Bauch bleibt gleich.
      es: |-
        Puede mudar el color de su cuerpo a voluntad, pero el
        dibujo en zigzag de su panza nunca desaparece.
      it: |-
        Può mutare il colore del corpo a piacimento.
        Tuttavia, il motivo a zigzag sul ventre non cambia.
    'y':
      ja-Hrkt: |-
        からだの　いろを　かえて　けしきに
        とけこみ　えものに　しのびよる。
        おなかの　もようは　けせないのだ。
      ja: |-
        体の　色を　変えて　景色に　溶けこみ
        獲物に　忍び寄る。
        お腹の　模様は　消せないのだ。
      ko: |-
        몸의 색을 바꿔 풍경에
        녹아들어 먹이에게 다가간다.
        배의 모양은 지울 수 없다.
      en: |-
        It changes its shading to match its surroundings
        so it can sneak up on prey. Only its belly patterns
        stay fixed.
      fr: |-
        Il se fond dans son environnement en changeant de
        couleur, mais le motif sur son ventre reste le même.
      de: |-
        Beim Beutefang passt es seine Farbe der Umgebung
        an. Nur das Muster auf seinem Bauch bleibt gleich.
      es: |-
        Acecha a sus presas adaptando sus colores a los del
        paisaje, pero los dibujos de su panza nunca cambian.
      it: |-
        Cambia colore per mimetizzarsi e sorprendere la
        preda. Il disegno sulla pancia rimane sempre visibile.
    omega-ruby:
      ja-Hrkt: |-
        からだの　いろを　じざいに　かえる　ことで
        まわりの　けしきに　とけこむ　ことが　できる。
        おなかの　ギザギザもよう　だけは　かえられない。
      ja: |-
        体の　色を　自在に　変える　ことで
        周りの　景色に　溶けこむ　ことが　できる。
        お腹の　ギザギザ模様　だけは　変えられない。
      ko: |-
        몸의 색을 자유로이 바꿔서
        주변의 경치에 녹아들 수 있다.
        배의 삐쭉삐쭉한 무늬만은 바꿀 수 없다.
      en: |-
        Kecleon is capable of changing its body colors at will to blend
        in with its surroundings. There is one exception—this Pokémon
        can’t change the zigzag pattern on its belly.
      fr: |-
        Kecleon est capable de modifier les couleurs de son corps
        pour se fondre dans son environnement. Il y a cependant
        une exception : ce Pokémon ne peut pas modifier la figure
        géométrique en zigzag sur son ventre.
      de: |-
        Kecleon kann die Farbe seines Körpers bei Bedarf verändern,
        um sich seiner Umgebung anzupassen. Es gibt allerdings eine
        Ausnahme: Das Zickzackmuster auf seinem Bauch kann es
        nicht verändern.
      es: |-
        Kecleon puede alterar la pigmentación de la piel para
        mezclarse con su entorno. Lo único que no es capaz de
        cambiar es el trazado en zigzag que tiene en la panza.
      it: |-
        Kecleon è in grado di mutare il colore del proprio corpo per
        mimetizzarsi con l’ambiente circostante.
        Tuttavia, fa eccezione il motivo zigzagato sulla pancia,
        che rimane sempre visibile.
    alpha-sapphire:
      ja-Hrkt: |-
        からだを　けしきと　おなじ　いろに　かえて
        えものに　きづかれない　ように　しのびよる。
        ながく　のびる　ベロで　すばやく　つかまえる。
      ja: |-
        体を　景色と　同じ　色に　変えて
        獲物に　気づかれない　ように　忍びよる。
        長く　伸びる　ベロで　素早く　捕まえる。
      ko: |-
        몸을 경치와 같은 색으로 바꿔
        먹이에게 들키지 않고 살며시 다가간다.
        길게 늘어나는 혓바닥으로 빠르게 잡는다.
      en: |-
        Kecleon alters its body coloration to blend in with its
        surroundings, allowing it to sneak up on its prey unnoticed.
        Then it lashes out with its long, stretchy tongue to instantly
        ensnare the unsuspecting target.
      fr: |-
        Kecleon change la couleur de son corps pour se fondre
        dans son environnement, ce qui lui permet de s’approcher
        de sa proie sans être repéré. Il envoie ensuite sa grande
        langue élastique pour piéger sa proie qui ne se doute de rien.
      de: |-
        Kecleon verändert seine Körperfärbung, um sich seiner
        Umgebung anzupassen. Dadurch kann es sich prima an
        seine ahnungslose Beute anschleichen. Es schlägt mit
        seiner dehnbaren, langen Zunge aus und fängt sie.
      es: |-
        Kecleon modifica la coloración de la piel para camuflarse en el
        medio en el que esté. Así, puede acercarse a hurtadillas a su
        enemigo sin que se dé cuenta y lanzarle la larga y elástica
        lengua que tiene para atraparlo por sorpresa.
      it: |-
        Kecleon varia la colorazione del proprio corpo per mimetizzarsi
        con l’ambiente circostante, consentendogli di tendere un
        agguato alla preda senza farsi notare. Poi l’attacca con la sua
        lingua elastica sopraffacendola.
    ultra-sun:
      ja-Hrkt: |-
        からだの　いろを　かえて　けしきに
        とけこむ。　ながく　かまわないでいると
        スネて　すがたを　みせなくなる。
      ja: |-
        身体の　色を　変えて　景色に
        溶け込む。　長く　かまわないでいると
        スネて　姿を　見せなくなる。
      ko: |-
        몸의 색을 바꿔 경치에 녹아든다.
        오랫동안 방치하면 토라져서
        모습을 볼 수 없게 된다.
      zh-Hant: |-
        能改變體色，融入周圍的景色中。
        如果長時間不去理會牠，
        牠就會鬧彆扭而不肯現身。
      zh-Hans: |-
        能改变身体的颜色，融入周围景色中。
        如果长时间不管它，就会闹别扭不现身。
      en: |-
        It changes its hue to blend into its surroundings.
        If no one takes notice of it for too long, it will
        pout and never reveal itself.
      fr: |-
        Il change de couleur pour se camoufler, mais si
        on cesse de lui prêter attention pendant trop
        longtemps, il se vexe et ne se montre plus...
      de: |-
        Es kann mit der Umgebung verschmelzen, indem
        es seine Farbe ändert. Wenn man es längere Zeit
        ignoriert, macht es sich schmollend unsichtbar.
      es: |-
        Cambia de color para fundirse con el paisaje,
        pero, si pasa desapercibido demasiado tiempo,
        se enfurruña y no vuelve a hacerse visible.
      it: |-
        Si mimetizza con l’ambiente mutando il colore
        del proprio corpo. Se lo si ignora, si imbroncia
        e non si fa più vedere.
    ultra-moon:
      ja-Hrkt: |-
        かくれるとき　いがいにも　きぶんや
        ちょうしで　からだのいろが　かわる。
        いろが　こいときほど　げんきだぞ。
      ja: |-
        隠れるとき　以外にも　気分や
        調子で　身体の色が　変わる。
        色が　濃いときほど　元気だぞ。
      ko: |-
        숨을 때 말고도 기분이나
        컨디션에 따라 몸의 색이 바뀐다.
        색이 진할수록 건강하다.
      zh-Hant: |-
        就算是在不需要隱身的時候，
        體色也會隨心情和身體狀態而改變。
        顏色越濃代表牠越有活力。
      zh-Hans: |-
        在不隐身的时候，身体的颜色
        也会随着心情和状态改变。
        颜色越浓的时候越有精神。
      en: |-
        Its color changes for concealment and also
        when its mood or health changes. The darker
        the color, the healthier it is.
      fr: |-
        Sa couleur change quand il se cache, mais varie
        aussi selon son humeur et son état de santé :
        plus il est en forme, plus sa couleur est vive.
      de: |-
        Seine Färbung ändert sich nicht nur zur Tarnung,
        sondern auch je nach Laune und Verfassung. Je
        kräftiger seine Farben sind, desto vitaler ist es.
      es: |-
        Incluso cuando no se está mimetizando, el color
        de su cuerpo cambia según cómo se encuentre.
        Un color más intenso indica mayor vitalidad.
      it: |-
        Cambia colore non solo per mimetizzarsi ma
        anche in base all’umore e allo stato di salute.
        Più il suo colore è intenso, più è in forze.
