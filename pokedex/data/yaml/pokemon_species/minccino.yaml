minccino:
  base_happiness: 50
  capture_rate: 255
  color: gray
  egg_groups:
    - ground
  evolution_chain: minccino
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        They greet one another by rubbing each
        other with their tails, which are always
        kept well groomed and clean.
      fr: |-
        Ils se saluent en se caressant
        mutuellement le corps avec la queue,
        qu’ils gardent toujours immaculée.
    white:
      en: |-
        These Pokémon prefer a tidy habitat.
        They are always sweeping and dusting,
        using their tails as brooms.
      fr: |-
        Un Pokémon qui aime la propreté. Chez
        lui, il enlève sans cesse la poussière
        en utilisant sa queue comme un plumeau.
    black-2:
      en: |-
        Minccino greet each other
        by grooming one another
        thoroughly with their tails.
    white-2:
      en: |-
        Minccino greet each other
        by grooming one another
        thoroughly with their tails.
    x:
      ja-Hrkt: |-
        おたがいの　しっぽで　あいてを
        とことん　きれいに　してあげるのが
        チラーミィどうしの　あいさつ。
      ja: |-
        お互いの　尻尾で　相手を
        とことん　きれいに　してあげるのが
        チラーミィ同士の　あいさつ。
      ko: |-
        서로의 꼬리로 상대를
        철저히 깨끗하게 만드는 것이
        치라미끼리의 인사다.
      en: |-
        Minccino greet each other by grooming one another
        thoroughly with their tails.
      fr: |-
        Ils se saluent en s’époussetant les uns les autres avec
        leur queue qui leur sert de plumeau.
      de: |-
        Sie begrüßen einander, indem sie ihr Gegenüber
        mithilfe ihres Schweifs säubern.
      es: |-
        Se saludan entre sí frotándose con la cola y
        limpiándose a conciencia.
      it: 'Si salutano pulendosi l’un l’altro con le loro code.'
    'y':
      ja-Hrkt: |-
        きれいずきな　せいかくの　ポケモン。
        しっぽを　ほうきがわりに　いつも
        すみかの　ほこりを　はらっている。
      ja: |-
        きれい好きな　性格の　ポケモン。
        尻尾を　ほうきがわりに　いつも
        住処の　ほこりを　払っている。
      ko: |-
        깨끗함을 좋아하는 포켓몬이다.
        꼬리를 빗자루 대신 써서 항상
        거처의 먼지를 쓸어낸다.
      en: |-
        These Pokémon prefer a tidy habitat. They are
        always sweeping and dusting, using their tails
        as brooms.
      fr: |-
        Un Pokémon qui aime la propreté. Chez lui, il enlève
        sans cesse la poussière en utilisant sa queue comme
        un plumeau.
      de: |-
        Ein Pokémon mit Putzfimmel. Es benutzt seinen
        Schweif als Staubwedel und fegt seinen Bau,
        bis alles picobello ist.
      es: |-
        Le encanta la limpieza. Usa su cola a modo de escoba
        y se pasa el día barre que te barre.
      it: |-
        Di natura ama la pulizia. Spazza sempre la polvere
        dalla sua tana usando la coda come scopa.
    omega-ruby:
      ja-Hrkt: |-
        おたがいの　しっぽで　あいてを
        とことん　きれいに　してあげるのが
        チラーミィどうしの　あいさつ。
      ja: |-
        お互いの　尻尾で　相手を
        とことん　きれいに　してあげるのが
        チラーミィ同士の　あいさつ。
      ko: |-
        서로의 꼬리로 상대를
        철저히 깨끗하게 만드는 것이
        치라미끼리의 인사다.
      en: |-
        Minccino greet each other by grooming one another
        thoroughly with their tails.
      fr: |-
        Ils se saluent en s’époussetant les uns les autres avec
        leur queue qui leur sert de plumeau.
      de: |-
        Sie begrüßen einander, indem sie ihr Gegenüber mithilfe ihres
        Schweifs säubern.
      es: |-
        Se saludan entre sí frotándose con la cola y limpiándose a
        conciencia.
      it: 'Si salutano pulendosi l’un l’altro con le loro code.'
    alpha-sapphire:
      ja-Hrkt: |-
        きれいずきな　せいかくの　ポケモン。
        しっぽを　ほうきがわりに　いつも
        すみかの　ほこりを　はらっている。
      ja: |-
        きれい好きな　性格の　ポケモン。
        尻尾を　ほうきがわりに　いつも
        住処の　ほこりを　払っている。
      ko: |-
        깨끗함을 좋아하는 포켓몬이다.
        꼬리를 빗자루 대신 써서 항상
        거처의 먼지를 쓸어낸다.
      en: |-
        These Pokémon prefer a tidy habitat. They are
        always sweeping and dusting, using their tails
        as brooms.
      fr: |-
        Un Pokémon qui aime la propreté. Chez lui, il enlève
        sans cesse la poussière en utilisant sa queue comme
        un plumeau.
      de: |-
        Ein Pokémon mit Putzfimmel. Es benutzt seinen Schweif als
        Staubwedel und fegt seinen Bau, bis alles picobello ist.
      es: |-
        Le encanta la limpieza. Usa su cola a modo de escoba y se
        pasa el día barre que te barre.
      it: |-
        Di natura ama la pulizia. Spazza sempre la polvere dalla sua
        tana usando la coda come scopa.
    ultra-sun:
      ja-Hrkt: |-
        けっぺきしょうで　すこしの　よごれも
        ゆるせない。　シッポを　モップにして
        てっていてきに　よごれを　おとす。
      ja: |-
        潔癖症で　少しの　汚れも
        許せない。　シッポを　モップにして
        徹底的に　汚れを　落とす。
      ko: |-
        결벽증이 있어서 조금의 더러움도
        용서하지 않는다. 꼬리를 걸레 삼아
        꼼꼼히 더러운 것을 닦아 낸다.
      zh-Hant: |-
        因為有潔癖，無法容忍絲毫髒污。
        會把尾巴當成拖把，
        把髒污的地方徹底擦乾淨。
      zh-Hans: |-
        因为有洁癖，所以不能容忍
        一丁点儿的脏污。会把尾巴
        当做拖把彻底地清除脏污。
      en: |-
        A clean freak that will not allow even the
        slightest mess, it uses its tail like a mop to
        thoroughly clean any and all filth.
      fr: |-
        Ce maniaque de la propreté ne supporte pas
        la moindre saleté. Il utilise sa queue comme
        une serpillière pour tout nettoyer.
      de: |-
        Es hat einen Putzfimmel und duldet selbst das
        kleinste Staubkorn nicht. Seinen Schweif benutzt
        es als Mopp, mit dem es alles picobello putzt.
      es: |-
        Este Pokémon es extremadamente pulcro y no
        puede ver ni una mota de suciedad o la limpiará
        usando su cola como si fuera una mopa.
      it: |-
        È un maniaco della pulizia e non sopporta
        neanche la più piccola traccia di sporco. Usa la
        coda come una scopa per pulire ogni superficie.
    ultra-moon:
      ja-Hrkt: |-
        じぶんの　からだや　すの　そうじで
        よごれた　シッポは　きれいな
        わきみずで　１にち　かけて　あらう。
      ja: |-
        自分の　身体や　巣の　掃除で
        汚れた　シッポは　綺麗な
        湧き水で　１日　かけて　洗う。
      ko: |-
        자신의 몸이나 보금자리를 청소하느라
        더러워진 꼬리는 깨끗한 샘물로
        하루에 걸쳐서 씻는다.
      zh-Hant: |-
        當尾巴因為打掃自己的身體
        和巢穴而變髒時，會花一整天時間
        用乾淨的湧泉水把尾巴洗乾淨。
      zh-Hans: |-
        因为清洁自己的身体和巢穴
        而弄脏的尾巴，会花上１天的时间
        用涌出的干净泉水清洗。
      en: |-
        When its tail has gotten dirty from self-cleaning
        or from cleaning its nest, Minccino spends a
        whole day washing its tail in clean spring water.
      fr: |-
        Il lui faut bien une journée entière pour laver
        sa queue après s’en être servi pour faire le
        ménage dans son nid et épousseter son corps.
      de: |-
        Wird sein Schweif beim Putzen seines Baus oder
        Körpers schmutzig, verbringt es einen ganzen
        Tag damit, ihn mit klarem Wasser zu reinigen.
      es: |-
        Tras usar la cola para limpiar su madriguera o
        su propio cuerpo, se pasa un día entero
        lavándosela con agua de manantial.
      it: |-
        Passa giornate intere a lavare la sua coda con
        acqua pura di sorgente dopo averla usata per
        spazzolare la tana e il proprio corpo.
    sword:
      ja-Hrkt: |-
        しっぽで　よごれを　はらいおとす。
        そうじを　するときに　たすかるが
        けっぺきしょう　なので　たいへん。
      ja: |-
        しっぽで　汚れを　払い落す。
        掃除を　するときに　助かるが
        潔癖症　なので　大変。
      ko: |-
        꼬리로 더러운 것을 떨어낸다.
        청소를 할 때는 도움이 되지만
        결벽증이 있어서 힘들기도 하다.
      zh-Hant: |-
        用尾巴來清掃灰塵。
        雖說能幫忙打掃是件好事，
        但牠的潔癖也會讓人感到棘手。
      zh-Hans: |-
        用尾巴来清扫灰尘。
        虽说能帮忙打扫是件好事，
        它的洁癖也会让人感到棘手。
      en: |-
        The way it brushes away grime with its tail
        can be helpful when cleaning. But its focus on
        spotlessness can make cleaning more of a hassle.
      fr: |-
        Il époussette les saletés avec sa queue.
        Il est d’une aide précieuse pour faire le ménage,
        mais il est très tatillon sur la propreté.
      de: |-
        Es entfernt Schmutz mit seinem Schweif. Beim
        Hausputz ist es eine große Hilfe, aber sein
        Putzfimmel kann auch anstrengend werden.
      es: |-
        Usa la cola para barrer la basurilla. Su extrema
        pulcritud es tanto una ayuda en la limpieza del
        hogar como un incordio.
      it: |-
        Con la coda rimuove ogni traccia di sporco.
        È di grande aiuto per le pulizie, ma la sua
        pignoleria può diventare estenuante.
    shield:
      ja-Hrkt: |-
        しっぽで　なであって　あいさつ。
        しっぽの　けが　おおきな　ほうが
        すこし　いばっているぞ。
      ja: |-
        しっぽで　なであって　挨拶。
        しっぽの　毛が　大きな　ほうが
        少し　威張っているぞ。
      ko: |-
        꼬리로 쓰다듬으며 서로
        인사한다. 꼬리 털이
        많은 쪽이 조금 으스댄다.
      zh-Hant: |-
        用尾巴互相撫摸來打招呼。
        尾巴的毛比較蓬鬆的那一方
        會表現得稍微威風些。
      zh-Hans: |-
        用尾巴互相抚摸来打招呼。
        尾巴的毛比较蓬松的那一方
        会表现得稍微威风些。
      en: |-
        They pet each other with their tails as a form of
        greeting. Of the two, the one whose tail is fluffier
        is a bit more boastful.
      fr: |-
        Les Chinchidou se saluent en se frottant la queue.
        Celui qui a la plus volumineuse en tire
        une certaine fierté.
      de: |-
        Sie begrüßen sich, indem sie sich gegenseitig mit
        ihren Schweifen streicheln. Das Picochilla mit
        dem buschigeren Schweif gibt damit oft an.
      es: |-
        Se saludan entre sí frotándose la cola. Cuanto
        más voluminosa es, más orgullosos se muestran.
      it: |-
        Si salutano strofinando le proprie code tra loro.
        Gli esemplari che ne hanno una particolarmente
        voluminosa tendono a darsi delle arie.
