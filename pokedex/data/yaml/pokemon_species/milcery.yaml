milcery:
  base_happiness: 50
  capture_rate: 200
  color: white
  egg_groups:
    - fairy
    - indeterminate
  evolution_chain: milcery
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        クリームで　できた　からだを　もつ。
        くうきちゅうの　あまい　かおりの
        せいぶんが　あつまって　うまれた。
      ja: |-
        クリームで　できた　体を　もつ。
        空気中の　甘い　香りの
        成分が　集まって　生まれた。
      ko: |-
        크림으로 이루어진 몸을 가졌다.
        공기 중을 떠도는 달콤한 향기의
        성분이 모여서 태어났다.
      zh-Hant: |-
        空氣中甜甜香氣的
        成分集中之後誕生。
        身體由鮮奶油構成。
      zh-Hans: |-
        空气中甜甜香气的
        成分集中之后诞生。
        身体由鲜奶油构成。
      en: |-
        This Pokémon was born from sweet-smelling
        particles in the air. Its body is made of cream.
      fr: |-
        Son corps de crème s’est composé à partir
        de particules au parfum sucré flottant dans l’air.
      de: |-
        Sein Körper besteht aus Sahne. Es entstand
        aus einer Ansammlung süßer Geruchspartikel
        in der Luft.
      es: |-
        Su cremoso cuerpo surgió a partir de la unión
        de partículas odoríferas de dulces aromas
        presentes en el aire.
      it: |-
        Il suo corpo è fatto di panna. È nato dall’unione
        di particelle di profumo dolce disperse nell’aria.
    shield:
      ja-Hrkt: |-
        マホミルが　すがたを　みせた
        パティスリーは　だいはんじょうが
        やくそく　されると　いわれている。
      ja: |-
        マホミルが　姿を　みせた
        パティスリーは　大繁盛が
        約束されると　いわれている。
      ko: |-
        마빌크가 모습을 보인
        디저트 가게는 크게
        번창한다고 전해지고 있다.
      zh-Hant: |-
        據說有小仙奶
        現身的蛋糕店
        保證能生意興隆。
      zh-Hans: |-
        据说有小仙奶
        现身过的蛋糕店
        保证能生意兴隆。
      en: |-
        They say that any patisserie visited by Milcery
        is guaranteed success and good fortune.
      fr: |-
        Les pâtissiers connaissent tous ce vieil adage :
        Quand Crèmy apparaît, le succès est assuré.
      de: |-
        Es heißt, dass den Konditoreien, in denen sich
        Hokumil zeigt, großer Wohlstand verheißen sei.
      es: |-
        Se dice que las pastelerías donde ha aparecido
        Milcery tienen casi todas las papeletas para
        saborear las mieles del éxito.
      it: |-
        Si dice che le pasticcerie in cui è apparso
        un Milcery avranno un successo assicurato!
