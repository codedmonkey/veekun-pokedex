dugtrio:
  base_happiness: 50
  capture_rate: 50
  color: brown
  egg_groups:
    - ground
  evolution_chain: diglett
  evolves_from: diglett
  flavor_text:
    red:
      en: |-
        A team of DIGLETT
        triplets.
        It triggers hugeearthquakes by
        burrowing 60 miles
        underground.
    blue:
      en: |-
        A team of DIGLETT
        triplets.
        It triggers hugeearthquakes by
        burrowing 60 miles
        underground.
    yellow:
      en: |-
        A team of triplets
        that can burrow
        over 60 MPH.Due to this, some
        people think it's
        an earthquake.
    gold:
      en: |-
        Its three heads
        bob separately up
        and down to loosenthe soil nearby,
        making it easier
        for it to burrow.
    silver:
      en: |-
        Extremely power­
        ful, they can DIG
        through even thehardest ground to
        a depth of over 60
        miles.
    crystal:
      en: |-
        These DIGLETT
        triplets dig over
        60 miles below sealevel. No one
        knows what it's
        like underground.
    ruby:
      en: |-
        DUGTRIO are actually triplets that
        emerged from one body. As a result,
        each triplet thinks exactly like theother two triplets.
        They work cooperatively to burrow
        endlessly.
    sapphire:
      en: |-
        DUGTRIO are actually triplets that
        emerged from one body. As a result,
        each triplet thinks exactly like theother two triplets.
        They work cooperatively to burrow
        endlessly.
    emerald:
      en: |-
        Because the triplets originally split from
        one body, they think exactly alike.
        They work cooperatively to burrow
        endlessly through the ground.
    firered:
      en: |-
        In battle, it digs through the ground and
        strikes the unsuspecting foe from an
        unexpected direction.
    leafgreen:
      en: |-
        A team of DIGLETT triplets. It triggers
        huge earthquakes by burrowing 60 miles
        underground.
    diamond:
      en: |-
        Its three heads move alternately,
        driving it through tough soil to
        depths of over 60 miles.
    pearl:
      en: |-
        Its three heads move alternately,
        driving it through tough soil to
        depths of over 60 miles.
    platinum:
      en: |-
        Its three heads move alternately,
        driving it through tough soil to
        depths of over 60 miles.
    heartgold:
      en: |-
        Its three heads bob separately up
        and down to loosen the soil nearby,
        making it easier for it to burrow.
    soulsilver:
      en: |-
        Extremely powerful, they can dig
        through even the hardest ground to
        a depth of over 60 miles.
    black:
      en: |-
        Its three heads move alternately,
        driving it through tough soil to
        depths of over 60 miles.
      fr: |-
        Ses trois têtes creusent le sol à
        tour de rôle. Il peut atteindre des
        profondeurs de 100 kilomètres.
    white:
      en: |-
        Its three heads move alternately,
        driving it through tough soil to
        depths of over 60 miles.
      fr: |-
        Ses trois têtes creusent le sol à
        tour de rôle. Il peut atteindre des
        profondeurs de 100 kilomètres.
    black-2:
      en: |-
        Its three heads move alternately,
        driving it through tough soil to
        depths of over 60 miles.
    white-2:
      en: |-
        Its three heads move alternately,
        driving it through tough soil to
        depths of over 60 miles.
    x:
      ja-Hrkt: |-
        ちちゅうを　ほりすすんで
        あいてが　ゆだんしているところを
        べつの　ばしょから　こうげきする。
      ja: |-
        地中を　掘りすすんで
        相手が　油断しているところを
        別の　場所から　攻撃する。
      ko: |-
        땅속을 파고들어 가
        상대가 방심하고 있을 때
        다른 곳에서 공격한다.
      en: |-
        In battle, it digs through the ground and strikes
        the unsuspecting foe from an unexpected direction.
      fr: |-
        Au combat, il s’enfouit sous terre pour pouvoir frapper
        ses adversaires depuis n’importe quelle direction.
      de: |-
        Im Kampf gräbt es sich ein und attackiert den
        Gegner aus einer unvorhersehbaren Richtung.
      es: |-
        En combate, cava la tierra, se esconde y sale de
        repente para golpear a su rival. Nunca se sabe por
        dónde puede aparecer.
      it: |-
        Nella lotta, scava tunnel nel terreno per sorprendere
        il nemico attaccandolo da una direzione imprevedibile.
    'y':
      ja-Hrkt: |-
        すごい　ちからの　もちぬしで
        どんなに　かたい　じめんでも
        ちか１００キロまで　ほりすすむ。
      ja: |-
        すごい　力の　持ち主で
        どんなに　硬い　地面でも
        地下１００キロまで　掘りすすむ。
      ko: |-
        엄청난 힘의 소유자로
        그 어떤 단단한 땅이라도
        지하 100km까지 파고들어 간다.
      en: |-
        Extremely powerful, they can dig through even the
        hardest ground to a depth of over 60 miles.
      fr: |-
        Terriblement puissants, ils peuvent creuser un
        tunnel dans tout type de sol et jusqu’à 100 km
        de profondeur.
      de: |-
        Es ist so stark, dass es sich mit Schaufler sogar durch
        steinharten Boden bis in 100 km Tiefe gräbt.
      es: |-
        Muy poderosos, pueden excavar hasta los terrenos
        más duros a una profundidad de más de 100 km.
      it: |-
        Estremamente forte, può scavare una fossa anche
        nella terra più dura fino a 100 km di profondità.
    omega-ruby:
      ja-Hrkt: |-
        もともと　ひとつの　からだから　３つごに
        なったので　みんな　かんがえることは　おなじ。
        ちからを　あわせ　どこまでも　ほりすすむ。
      ja: |-
        元々　一つの　体から　３つ子に
        なったので　みんな　考えることは　同じ。
        力を　合わせ　どこまでも　掘り進む。
      ko: |-
        본래 하나의 몸에서 세쌍둥이가
        된 것이라 모두 생각하는 것이 같다.
        힘을 모아 끝없이 파나간다.
      en: |-
        Dugtrio are actually triplets that emerged from one body.
        As a result, each triplet thinks exactly like the other
        two triplets. They work cooperatively to burrow endlessly.
      fr: |-
        Les Triopikeur sont en fait des triplés qui ont émergé du
        même corps. C’est pourquoi chaque triplé pense exactement
        comme les deux autres. Ils creusent inlassablement, dans
        une coopération parfaite.
      de: |-
        Digdri sind Drillinge, die aus einem Körper entstanden sind.
        Daher denken alle Köpfe gleich. Sie arbeiten so gut zusammen,
        dass sie endlos graben können.
      es: |-
        Los Dugtrio son trillizos que se originaron a partir de un solo
        cuerpo, por eso piensan de la misma forma. A la hora de
        excavar, trabajan en equipo y sin descanso.
      it: |-
        Dugtrio è un Pokémon formato da tre unità legate in un solo
        corpo. Ogni trio è un’unica mente pensante. Le tre unità
        collaborano scavando instancabilmente.
    alpha-sapphire:
      ja-Hrkt: |-
        もともと　ひとつの　からだから　３つごに
        なったので　みんな　かんがえることは　おなじ。
        ちからを　あわせ　どこまでも　ほりすすむ。
      ja: |-
        元々　一つの　体から　３つ子に
        なったので　みんな　考えることは　同じ。
        力を　合わせ　どこまでも　掘り進む。
      ko: |-
        본래 하나의 몸에서 세쌍둥이가
        된 것이라 모두 생각하는 것이 같다.
        힘을 모아 끝없이 파나간다.
      en: |-
        Dugtrio are actually triplets that emerged from one body.
        As a result, each triplet thinks exactly like the other two
        triplets. They work cooperatively to burrow endlessly.
      fr: |-
        Les Triopikeur sont en fait des triplés qui ont émergé du
        même corps. C’est pourquoi chaque triplé pense exactement
        comme les deux autres. Ils creusent inlassablement, dans
        une coopération parfaite.
      de: |-
        Digdri sind Drillinge, die aus einem Körper entstanden sind.
        Daher denken alle Köpfe gleich. Sie arbeiten so gut zusammen,
        dass sie endlos graben können.
      es: |-
        Los Dugtrio son trillizos que se originaron a partir de un solo
        cuerpo, por eso piensan de la misma forma. A la hora de
        excavar, trabajan en equipo y sin descanso.
      it: |-
        Dugtrio è un Pokémon formato da tre unità legate in un solo
        corpo. Ogni trio è un’unica mente pensante. Le tre unità
        collaborano scavando instancabilmente.
    sun:
      ja-Hrkt: |-
        ３つごが　きょうりょくして　こうどう。
        ちか１００キロを　ほりすすむほどの
        パワーは　チームワークの　たまもの。
      ja: |-
        三つ子が　協力し　行動。
        地下１００キロを　掘り進むほどの
        パワーは　チームワークの　賜物。
      ko: |-
        세쌍둥이가 협력해서 행동한다.
        지하 100km를 파고 갈 정도의
        파워는 팀워크 덕택이다.
      zh-Hant: |-
        三胞胎合作行動。
        足以挖到地下１００公里深的
        力量是團隊合作的成果。
      zh-Hans: |-
        三胞胎合作行动。
        甚至连地下１００公里都能挖到，
        这种力量是团队合作的成果。
      en: |-
        This set of triplets moves cooperatively.
        It’s the power of teamwork that enables
        this Pokémon to dig to a depth of 60 miles.
      fr: |-
        Des triplés Taupiqueur qui s’entraident en tout.
        En se coordonnant, ils peuvent creuser en
        équipe jusqu’à 100 km de profondeur.
      de: |-
        Die drei arbeiten und handeln stets zusammen.
        Durch Teamwork gelingt es dem Pokémon, sich
        bis zu 100 km tief ins Erdreich zu graben.
      es: |-
        Este trío siempre trabaja en equipo, gracias a lo
        cual puede perforar hasta alcanzar 100 km de
        profundidad.
      it: |-
        Le tre unità agiscono collaborando fra loro.
        Grazie al lavoro di squadra possono scavare
        fino a raggiungere i 100 km di profondità.
    moon:
      ja-Hrkt: |-
        のうかなど　おおくの　ひとびとに
        したしまれているのに　じめんの　したの
        すがたを　みたものは　いない。
      ja: |-
        農家など　多くの　人々に
        親しまれているのに　地面の　下の
        姿を　みたものは　いない。
      ko: |-
        농가 등 많은 사람에게
        친숙하지만 땅 아래의
        모습을 본 사람은 없다.
      zh-Hant: |-
        和農戶等大多數人都很親近，
        不過還是沒有人見過
        牠在地面下的樣子。
      zh-Hans: |-
        和农户等大多数人都很亲近，
        不过还是没有人见过
        它在地面下的样子。
      en: |-
        Despite the closeness between this Pokémon
        and farmers and other people, no one has ever
        seen the parts of it concealed underground.
      fr: |-
        Bien que beaucoup d’agriculteurs élèvent
        ce Pokémon, personne n’a jamais vu la partie
        enfouie de son corps.
      de: |-
        Trotz seiner Beliebtheit bei Farmern und vielen
        anderen Menschen, hat noch niemand den unter
        der Erde versteckten Teil von Digdri gesehen.
      es: |-
        A pesar de ser muy comunes en las granjas,
        nadie ha visto jamás la parte de sus cuerpos
        que ocultan bajo tierra.
      it: |-
        È un Pokémon amato da molti, soprattutto dagli
        agricoltori. Nessuno ha mai visto la parte del
        suo corpo che si trova sottoterra.
    ultra-sun:
      ja-Hrkt: |-
        いつも　なかよしの　３つごだが
        ごく　まれに　どのあたまが　はじめに
        エサを　くうかで　おおゲンカになる。
      ja: |-
        いつも　仲良しの　３つ子だが
        ごく　まれに　どの頭が　初めに
        エサを　食うかで　大ゲンカになる。
      ko: |-
        언제나 사이좋은 세쌍둥이지만
        극히 드물게 어느 머리가 먼저
        먹이를 먹을까로 큰 싸움을 한다.
      zh-Hant: |-
        三胞胎的感情一向很好，
        但在極少數情況下也會為了
        哪個頭先吃東西而大吵一架。
      zh-Hans: |-
        三胞胎的感情一直很好，
        但在极少数情况下，也会为哪个
        脑袋先进食而激烈争吵。
      en: |-
        While the three of them normally get along
        splendidly, on rare occasions a huge fight will
        break out over which head gets to eat first.
      fr: |-
        Ces triplés s’entendent à merveille, mais en
        de rares occasions, une terrible dispute éclate
        pour savoir qui va manger en premier.
      de: |-
        Digdri sind Drillinge und normalerweise ein Herz
        und eine Seele. Nur ganz selten streiten sie sich,
        welcher Kopf zuerst ans Futter darf.
      es: |-
        Este trío se lleva de maravilla, aunque muy de
        vez en cuando se enzarzan en acaloradas
        disputas para decidir cuál come primero.
      it: |-
        In genere le tre teste vanno d’accordo, ma a
        volte può capitare che scoppi una lite furiosa
        per decidere quale mangerà per prima.
    ultra-moon:
      ja-Hrkt: |-
        つるりとした　かたちを　しているが
        とてつもなく　かたいあたま。　どんな
        じばんも　ずつきで　ほりすすめるぞ。
      ja: |-
        つるりとした　形を　しているが
        とてつもなく　硬い頭。　どんな
        地盤も　頭突きで　掘り進めるぞ。
      ko: |-
        매끄러운 형태를 하고 있지만
        굉장히 머리가 단단하다. 어떤
        지반이라도 박치기로 파고 간다.
      zh-Hant: |-
        腦袋長得渾圓光滑，但卻
        極為堅硬。不管是哪種地層
        都能用頭錘挖掘前進。
      zh-Hans: |-
        虽然长得很圆润，但却有着出奇
        坚硬的脑袋。不管是怎样的地层，
        它都能用头锤的方式挖掘前进。
      en: |-
        Dugtrio’s heads are sleek and smooth and
        incredibly hard. It can dig through any soil with
        its headbutts.
      fr: |-
        D’apparence lisse, ses têtes sont
        incroyablement dures. Il creuse la terre
        à coups de crâne répétés.
      de: |-
        Seine Köpfe sind vollkommen glatt und steinhart.
        Mit Kopfnüssen gräbt es sich mühelos durch
        jeden Untergrund.
      es: |-
        A pesar de ser lisas, sus cabezas son de una
        dureza extraordinaria. Puede horadar el terreno
        más difícil a base de testarazos.
      it: |-
        Le sue teste sono perfettamente lisce e
        incredibilmente dure. Può scavare a testate
        qualsiasi tipo di terreno.
    lets-go-pikachu:
      ja-Hrkt: |-
        みつごのパワーで　ちか１００キロまで
        ほりすすむので　じしんの　げんいんに
        なるとの　ほうこくも　されている。
      ja: |-
        三つ子のパワーで　地下１００キロまで
        掘り進むので　地震の　原因に
        なるとの　報告も　されている。
      ko: |-
        세쌍둥이의 파워로 지하 100km까지
        땅을 파고들어 간다. 이것이
        지진의 원인이라는 보고도 있다.
      zh-Hant: |-
        會以三胞胎的力量一路
        往下挖到100公里的深度。
        有報告指出這是地震的成因之一。
      zh-Hans: |-
        三合一的力量能让它们
        挖地深至100公里，甚至
        有报告说它们会引发地震。
      en: |-
        A team of triplets that can burrow to a depth
        of 60 miles. It’s reported that this triggers
        an earthquake.
      fr: |-
        À trois, ils peuvent creuser jusqu’à 100 km
        de profondeur. On les dit responsables des
        tremblements de terre.
      de: |-
        Mit der vereinten Kraft von drei Digda gräbt
        es sich bis zu 100 km tief in die Erde. Berichten
        zufolge löst dies mitunter Erdbeben aus.
      es: |-
        Estos trillizos combinan su fuerza para excavar
        hasta una profundidad de 100 km, razón por la
        que se les atribuyen algunos terremotos.
      it: |-
        Un gruppo di tre Diglett che può scavare
        gallerie fino a 100 km di profondità. Per questo
        si dice che causi dei terremoti.
    lets-go-eevee:
      ja-Hrkt: |-
        みつごのパワーで　ちか１００キロまで
        ほりすすむので　じしんの　げんいんに
        なるとの　ほうこくも　されている。
      ja: |-
        三つ子のパワーで　地下１００キロまで
        掘り進むので　地震の　原因に
        なるとの　報告も　されている。
      ko: |-
        세쌍둥이의 파워로 지하 100km까지
        땅을 파고들어 간다. 이것이
        지진의 원인이라는 보고도 있다.
      zh-Hant: |-
        會以三胞胎的力量一路
        往下挖到100公里的深度。
        有報告指出這是地震的成因之一。
      zh-Hans: |-
        三合一的力量能让它们
        挖地深至100公里，甚至
        有报告说它们会引发地震。
      en: |-
        A team of triplets that can burrow to a depth
        of 60 miles. It’s reported that this triggers
        an earthquake.
      fr: |-
        À trois, ils peuvent creuser jusqu’à 100 km
        de profondeur. On les dit responsables des
        tremblements de terre.
      de: |-
        Mit der vereinten Kraft von drei Digda gräbt
        es sich bis zu 100 km tief in die Erde. Berichten
        zufolge löst dies mitunter Erdbeben aus.
      es: |-
        Estos trillizos combinan su fuerza para excavar
        hasta una profundidad de 100 km, razón por la
        que se les atribuyen algunos terremotos.
      it: |-
        Un gruppo di tre Diglett che può scavare
        gallerie fino a 100 km di profondità. Per questo
        si dice che causi dei terremoti.
    sword:
      ja-Hrkt: |-
        チームワークに　すぐれた　みつごの
        ディグダ。　ちか　１００キロまで
        ほって　じしんを　おこすこともある。
      ja: |-
        チームワークに　すぐれた　三つ子の
        ディグダ。　地下　１００キロまで
        掘って　地震を　起こすこともある。
      ko: |-
        팀워크가 뛰어난 세쌍둥이 디그다.
        지하 100km까지 파고들어
        지진을 일으킬 때도 있다.
      zh-Hant: |-
        擅長團隊合作的三胞胎地鼠。
        有時會挖掘到１００公里深的
        地底，甚至引發地震。
      zh-Hans: |-
        擅长团队合作的三胞胎地鼠。
        有时会挖掘到１００公里深的
        地底，甚至引发地震。
      en: |-
        A team of Diglett triplets. It triggers huge
        earthquakes by burrowing 60 miles underground.
      fr: |-
        Ces triplés forment une équipe de choc.
        Ils causent parfois des séismes lorsqu’ils creusent
        jusqu’à 100 km de profondeur.
      de: |-
        Diese Digda-Drillinge graben sich manchmal
        bis zu 100 km tief in den Erdboden und lösen
        dadurch Erdbeben aus.
      es: |-
        Un trío de Diglett. Causa enormes terremotos al
        cavar en el subsuelo a profundidades de hasta
        100 km.
      it: |-
        Trio di Diglett che eccellono nel lavoro di
        squadra. Scava fino a 100 km di profondità,
        provocando a volte dei terremoti.
    shield:
      ja-Hrkt: |-
        ちか１００キロまで　ほりすすむ
        パワーをひめた　みつごの　ディグダ。
        じめんのしたは　だれも　しらない。
      ja: |-
        地下１００キロまで　掘り進む。
        パワーを秘めた　三つ子の　ディグダ。
        地面の下は　だれも　知らない。
      ko: |-
        지하 100km까지 파고들 수 있는
        파워를 간직한 세쌍둥이 디그다.
        땅 밑은 아무도 모른다.
      zh-Hant: |-
        三胞胎的地鼠，擁有能夠挖掘到
        地下１００公里深的潛力。沒人知道
        牠在地下的部分究竟長成什麼樣子。
      zh-Hans: |-
        三胞胎的地鼠，拥有能够挖掘到
        地下１００公里深的潜力。没人知道
        它在地下的部分究竟长成什么样子。
      en: |-
        These Diglett triplets dig over 60 miles below sea
        level. No one knows what it’s like underground.
      fr: |-
        Ce trio de Taupiqueur est capable de creuser
        jusqu’à 100 km sous terre, vers l’inconnu.
      de: |-
        Diese kraftvollen Digda-Drillinge graben bis zu
        100 km tief. Keiner weiß, wie sie unter der Erde
        aussehen.
      es: |-
        Estos trillizos cavan a una profundidad de hasta
        100 km. Se desconoce el aspecto de la parte de
        sus cuerpos que se oculta bajo tierra.
      it: |-
        Questo trio di Diglett può scavare fino a 100 km
        di profondità. Nessuno ha mai visto la parte
