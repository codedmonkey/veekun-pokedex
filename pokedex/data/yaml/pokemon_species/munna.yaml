munna:
  base_happiness: 50
  capture_rate: 190
  color: pink
  egg_groups:
    - ground
  evolution_chain: munna
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        Munna always float in the air. People
        whose dreams are eaten by them
        forget what the dreams had been about.
      fr: |-
        Quand Munna mange un rêve, celui-ci
        est aussitôt oublié par le rêveur.
        Il lévite en permanence.
    white:
      en: |-
        It eats the dreams of people and
        Pokémon. When it eats a pleasant
        dream, it expels pink-colored mist.
      fr: |-
        Il se nourrit des rêves des gens et des
        Pokémon. Quand le rêve est agréable,
        il crache une fumée rose.
    black-2:
      en: |-
        This Pokémon appears before people
        and Pokémon who are having nightmares
        and eats those dreams.
    white-2:
      en: |-
        This Pokémon appears before people
        and Pokémon who are having nightmares
        and eats those dreams.
    x:
      ja-Hrkt: |-
        わるい　ゆめに　うなされている
        ポケモンや　ひとの　まえに　あらわれ
        そのゆめを　たべてしまう　ポケモン。
      ja: |-
        悪い　夢に　うなされている
        ポケモンや　人の　前に　現われ
        その夢を　食べてしまう　ポケモン。
      ko: |-
        나쁜 꿈에 시달리고 있는
        포켓몬이나 사람 앞에 나타나
        그 꿈을 먹어버리는 포켓몬.
      en: |-
        This Pokémon appears before people and Pokémon
        who are having nightmares and eats those dreams.
      fr: |-
        Il apparaît aux humains et aux Pokémon qui font
        des mauvais rêves et mange leurs cauchemars pour
        les en libérer.
      de: |-
        Es erscheint vor schlafenden Menschen
        und Pokémon und frisst ihre Alpträume.
      es: |-
        Cuando un humano o un Pokémon sufre una pesadilla,
        Munna se aparece ante ellos y la engulle.
      it: |-
        Compare accanto a Pokémon e uomini tormentati
        dagli incubi per nutrirsi di tutti i loro brutti sogni.
    'y':
      ja-Hrkt: |-
        ひとや　ポケモンが　みた　ゆめを
        たべる。たのしい　ゆめを　たべると
        ピンクいろの　けむりを　はきだす。
      ja: |-
        人や　ポケモンが　見た　夢を
        食べる。楽しい　夢を　食べると
        ピンク色の　けむりを　吐き出す。
      ko: |-
        사람이나 포켓몬이 꾼 꿈을
        먹는다. 즐거운 꿈을 먹으면
        분홍색 연기를 뿜어낸다.
      en: |-
        It eats the dreams of people and Pokémon. When it
        eats a pleasant dream, it expels pink-colored mist.
      fr: |-
        Il se nourrit des rêves des gens et des Pokémon.
        Quand le rêve est agréable, il crache une fumée rose.
      de: |-
        Es verschlingt die Träume der Menschen.
        Frisst es einen fröhlichen Traum, stößt es
        danach einen rosafarbenen Dunst aus.
      es: |-
        Se alimenta de los sueños de humanos y Pokémon.
        Si los sueños son felices, despide humo rosa.
      it: |-
        Si nutre dei sogni di uomini e Pokémon. Se mangia
        sogni piacevoli, esala un fumo di colore rosa.
    omega-ruby:
      ja-Hrkt: |-
        わるい　ゆめに　うなされている
        ポケモンや　ひとの　まえに　あらわれ
        そのゆめを　たべてしまう　ポケモン。
      ja: |-
        悪い　夢に　うなされている
        ポケモンや　人の　前に　現われ
        その夢を　食べてしまう　ポケモン。
      ko: |-
        나쁜 꿈에 시달리고 있는
        포켓몬이나 사람 앞에 나타나
        그 꿈을 먹어버리는 포켓몬.
      en: |-
        This Pokémon appears before people and Pokémon
        who are having nightmares and eats those dreams.
      fr: |-
        Il apparaît aux humains et aux Pokémon qui font des mauvais
        rêves et mange leurs cauchemars pour les en libérer.
      de: |-
        Es erscheint vor schlafenden Menschen und Pokémon und
        frisst ihre Alpträume.
      es: |-
        Cuando un humano o un Pokémon sufre una pesadilla, Munna
        se aparece ante ellos y la engulle.
      it: |-
        Compare accanto a Pokémon e uomini tormentati dagli incubi
        per nutrirsi di tutti i loro brutti sogni.
    alpha-sapphire:
      ja-Hrkt: |-
        ひとや　ポケモンが　みた　ゆめを
        たべる。たのしい　ゆめを　たべると
        ピンクいろの　けむりを　はきだす。
      ja: |-
        人や　ポケモンが　見た　夢を
        食べる。楽しい　夢を　食べると
        ピンク色の　けむりを　吐き出す。
      ko: |-
        사람이나 포켓몬이 꾼 꿈을
        먹는다. 즐거운 꿈을 먹으면
        분홍색 연기를 뿜어낸다.
      en: |-
        It eats the dreams of people and Pokémon. When it
        eats a pleasant dream, it expels pink-colored mist.
      fr: |-
        Il se nourrit des rêves des gens et des Pokémon.
        Quand le rêve est agréable, il crache une fumée rose.
      de: |-
        Es verschlingt die Träume der Menschen. Frisst es einen
        fröhlichen Traum, stößt es danach einen rosafarbenen Dunst
        aus.
      es: |-
        Se alimenta de los sueños de humanos y Pokémon. Si los
        sueños son felices, despide humo rosa.
      it: |-
        Si nutre dei sogni di uomini e Pokémon. Se mangia sogni
        piacevoli, esala un fumo di colore rosa.
    sword:
      ja-Hrkt: |-
        しんや　まくらもとに　あらわれる。
        ゆめを　たべているとき　からだの
        もようが　ぼんやりと　ひかる。
      ja: |-
        深夜　枕元に　現れる。
        夢を　食べているとき　体の
        模様が　ぼんやりと　光る。
      ko: |-
        깊은 밤중 머리맡에 나타난다.
        꿈을 먹는 동안 몸에 있는
        무늬가 어렴풋이 빛난다.
      zh-Hant: |-
        會在深夜出現在枕頭邊。
        在吃夢的時候，
        身上的花紋會微微發亮。
      zh-Hans: |-
        会在深夜出现在枕头边。
        在吃梦的时候，
        身上的花纹会微微发亮。
      en: |-
        Late at night, it appears beside people’s pillows.
        As it feeds on dreams, the patterns on its body
        give off a faint glow.
      fr: |-
        Il apparaît en pleine nuit, à côté de l’oreiller.
        Quand il se nourrit de rêves, les motifs
        de son corps luisent légèrement.
      de: |-
        Tief in der Nacht erscheint es am Kopfende von
        Betten. Während es einen Traum frisst, schimmert
        das Muster auf seinem Körper.
      es: |-
        Aparece en plena noche junto a la almohada
        de la gente. Cuando devora los sueños, los
        motivos de su cuerpo emiten una luz tenue.
      it: |-
        Appare vicino al guanciale nel cuore della notte.
        Quando mangia i sogni, i motivi che ha sul
        corpo si illuminano lievemente.
    shield:
      ja-Hrkt: |-
        ゆめを　たべて　けむりを　はく。
        たのしい　ゆめなら　ピンクいろで
        あくむの　ときは　くろっぽいぞ。
      ja: |-
        夢を　食べて　煙を　吐く。
        楽しい　夢なら　ピンク色で
        悪夢の　ときは　黒っぽいぞ。
      ko: |-
        꿈을 먹고 연기를 내뿜는다.
        즐거운 꿈이면 핑크색이고
        악몽이면 거무스름하다.
      zh-Hant: |-
        在吃掉夢之後會吐出煙霧。
        吃了快樂的夢時，煙霧是粉紅色的；
        如果是惡夢，煙霧則是黑灰色的。
      zh-Hans: |-
        在吃掉梦之后会吐出烟雾。
        吃了快乐的梦时，烟雾是粉红色的；
        如果是噩梦，烟雾则是黑灰色的。
      en: |-
        It eats dreams and releases mist. The mist is pink
        when it’s eating a good dream, and black when
        it’s eating a nightmare.
      fr: |-
        Il se nourrit de songes et expire de la fumée
        qui prend la couleur rose si le rêve est joyeux,
        ou noire s’il s’agit d’un cauchemar.
      de: |-
        Während es Träume frisst, stößt es Dunst aus.
        Bei fröhlichen Träumen ist dieser rosafarben,
        bei Alpträumen schwärzlich.
      es: |-
        El humo que despide cambia de color en función
        del sueño que haya consumido. Si es alegre, será
        rosa, o negruzco en el caso de una pesadilla.
      it: |-
        Si nutre di sogni. Esala un fumo rosa se sono
        sogni piacevoli e nero se sono incubi.
