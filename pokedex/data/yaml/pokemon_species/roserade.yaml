roserade:
  base_happiness: 50
  capture_rate: 75
  color: green
  egg_groups:
    - fairy
    - plant
  evolution_chain: roselia
  evolves_from: roselia
  flavor_text:
    diamond:
      en: |-
        It attracts prey with a sweet
        aroma, then downs it with
        thorny whips hidden in its arms.
    pearl:
      en: |-
        With the movements of a dancer,
        it strikes with whips that are
        densely lined with poison thorns.
    platinum:
      en: |-
        Each of its hands contains
        different toxins, but both hands
        can jab with near-fatal power.
    heartgold:
      en: |-
        Its sweet aroma attracts prey.
        Then it spews poison. The more
        toxic it is, the sweeter its aroma.
    soulsilver:
      en: |-
        Its sweet aroma attracts prey.
        Then it spews poison. The more
        toxic it is, the sweeter its aroma.
    black:
      en: |-
        Each of its hands contains
        different toxins, but both hands
        can jab with near-fatal power.
      fr: |-
        Ses mains contenant chacune des
        toxines différentes sont capables
        d’asséner de puissants coups.
    white:
      en: |-
        Each of its hands contains
        different toxins, but both hands
        can jab with near-fatal power.
      fr: |-
        Ses mains contenant chacune des
        toxines différentes sont capables
        d’asséner de puissants coups.
    black-2:
      en: |-
        Luring prey with a sweet scent, it
        uses poison whips on its arms
        to poison, bind, and finish off the prey.
    white-2:
      en: |-
        Luring prey with a sweet scent, it
        uses poison whips on its arms
        to poison, bind, and finish off the prey.
    x:
      ja-Hrkt: |-
        あまい　かおりで　えものを　さそい
        りょううでの　どくのムチを　つかって
        さしたり　しめたりして　しとめる。
      ja: |-
        甘い　香りで　獲物を　誘い
        両腕の　毒のムチを　使って
        刺したり　締めたりして　しとめる。
      ko: |-
        달콤한 향기로 먹이를 유인해
        양팔의 독 채찍을 사용하여
        찌르거나 조여서 꼼짝 못하게 한다.
      en: |-
        Luring prey with a sweet scent, it uses poison whips
        on its arms to poison, bind, and finish off the prey.
      fr: |-
        Il attire ses proies grâce à son parfum, puis les
        empoisonne ou les étouffe à l’aide de ses bras
        vénéneux.
      de: |-
        Es lockt seine Beute mit süßem Duft an, um sie
        danach mit seinen dornigen Ranken zu peitschen
        oder zu würgen.
      es: |-
        Atrae a sus presas con una dulce fragancia y usa sus
        cepas venenosas para atenazarlas y acabar con ellas.
      it: |-
        Attira la preda con il suo profumo soave per poi
        afferrarla e abbatterla con gli arti velenosi.
    'y':
      ja-Hrkt: |-
        ダンサーのような　みのこなしで
        どくの　トゲが　びっしりと　ならんだ
        ムチを　あやつり　こうげきする。
      ja: |-
        ダンサーのような　身のこなしで
        毒の　トゲが　びっしりと　並んだ
        ムチを　操り　攻撃する。
      ko: |-
        댄서 같은 재빠른 몸놀림으로
        독가시가 빽빽이 늘어선
        채찍을 조종하여 공격한다.
      en: |-
        With the movements of a dancer, it strikes with
        whips that are densely lined with poison thorns.
      fr: |-
        Gracieux comme un danseur, il abat ses fouets ornés
        d’épines empoisonnées.
      de: |-
        Mit den Bewegungen eines Tänzers holt es aus und
        schlägt mit Ranken um sich, die giftige Dornen haben.
      es: |-
        Se mueve como un bailarín y golpea con látigos
        repletos de púas venenosas.
      it: |-
        Con i movimenti di una ballerina, colpisce con le
        fruste, piene di spine velenose.
    omega-ruby:
      ja-Hrkt: |-
        あまい　かおりで　えものを　さそい
        りょううでの　どくのムチを　つかって
        さしたり　しめたりして　しとめる。
      ja: |-
        甘い　香りで　獲物を　誘い
        両腕の　毒のムチを　使って
        刺したり　締めたりして　しとめる。
      ko: |-
        달콤한 향기로 먹이를 유인해
        양팔의 독 채찍을 사용하여
        찌르거나 조여서 꼼짝 못하게 한다.
      en: |-
        Luring prey with a sweet scent, it uses poison whips
        on its arms to poison, bind, and finish off the prey.
      fr: |-
        Il attire ses proies grâce à son parfum, puis les empoisonne
        ou les étouffe à l’aide de ses bras vénéneux.
      de: |-
        Es lockt seine Beute mit süßem Duft an, um sie danach mit
        seinen dornigen Ranken zu peitschen oder zu würgen.
      es: |-
        Atrae a sus presas con una dulce fragancia y usa sus cepas
        venenosas para atenazarlas y acabar con ellas.
      it: |-
        Attira la preda con il suo profumo soave per poi afferrarla
        e abbatterla con gli arti velenosi.
    alpha-sapphire:
      ja-Hrkt: |-
        ダンサーのような　みのこなしで
        どくの　トゲが　びっしりと　ならんだ
        ムチを　あやつり　こうげきする。
      ja: |-
        ダンサーのような　身のこなしで
        毒の　トゲが　びっしりと　並んだ
        ムチを　操り　攻撃する。
      ko: |-
        댄서 같은 재빠른 몸놀림으로
        독가시가 빽빽이 늘어선
        채찍을 조종하여 공격한다.
      en: |-
        With the movements of a dancer, it strikes with
        whips that are densely lined with poison thorns.
      fr: |-
        Gracieux comme un danseur, il abat ses fouets ornés
        d’épines empoisonnées.
      de: |-
        Mit den Bewegungen eines Tänzers holt es aus und
        schlägt mit Ranken um sich, die giftige Dornen haben.
      es: |-
        Se mueve como un bailarín y golpea con látigos repletos de
        púas venenosas.
      it: |-
        Con i movimenti di una ballerina, colpisce con le fruste, piene
        di spine velenose.
    sword:
      ja-Hrkt: |-
        かぐわしい　はなの　かおりで
        あいてを　まどわせ　いばらの
        ムチで　はげしく　うちつける。
      ja: |-
        かぐわしい　花の　香りで
        相手を　惑わせ　いばらの
        ムチで　激しく　打ちつける。
      ko: |-
        향긋한 꽃향기로
        상대를 혼란스럽게 한 다음
        가시 채찍으로 세차게 때린다.
      zh-Hant: |-
        會用馥郁芬芳的花香
        迷惑敵人，並用荊棘上
        的鞭子猛力抽打對方。
      zh-Hans: |-
        会用馥郁芬芳的花香
        迷惑敌人，并用荆棘上
        的鞭子猛力抽打对方。
      en: |-
        After captivating opponents with its sweet scent,
        it lashes them with its thorny whips.
      fr: |-
        Après avoir troublé les sens de ses adversaires
        avec le parfum exquis de ses fleurs, il les frappe
        violemment avec ses fouets ornés d’épines.
      de: |-
        Mit dem süßlichen Duft seiner Blüten betört es
        seine Gegner, bevor es sie mit dornigen Ranken
        heftig auspeitscht.
      es: |-
        Aturde a los rivales con la fragancia de sus flores
        para luego azotarlos sin piedad con sus cepas
        espinosas.
      it: |-
        Stordisce l’avversario con il profumo intenso
        dei suoi fiori e lo colpisce con le sue fruste
        piene di spine.
    shield:
      ja-Hrkt: |-
        みぎての　どくは　そっこうせい。
        ひだりての　どくは　ちこうせい。
        どちらも　いのちに　かかわるぞ。
      ja: |-
        右手の　毒は　即効性。
        左手の　毒は　遅効性。
        どちらも　命に　かかわるぞ。
      ko: |-
        오른손의 독은 즉효성이고
        왼손의 독은 지효성을 띠고 있다.
        양쪽 모두 생명에 지장을 준다.
      zh-Hant: |-
        右手的毒是速效的，
        左手的毒則是慢性的。
        無論哪邊的毒性都能致命。
      zh-Hans: |-
        右手的毒是速效的，
        左手的毒则是慢性的。
        无论哪边的毒性都能致命。
      en: |-
        The poison in its right hand is quick acting.
        The poison in its left hand is slow acting.
        Both are life threatening.
      fr: |-
        Sa main gauche administre un poison lent,
        et la droite, un poison foudroyant.
        Les deux peuvent être fatals.
      de: |-
        Das Gift aus seiner rechten Hand wirkt sofort,
        das aus seiner linken langsam. Beide Gifte
        können tödlich sein.
      es: |-
        Las toxinas de la mano derecha son de efecto
        inmediato, y las de la izquierda, retardado. No
        obstante, ambas pueden ser letales.
      it: |-
        Il veleno nel bouquet destro ha effetto
        istantaneo, quello nel sinistro ha effetto
        ritardato. Entrambi possono essere letali.
