popplio:
  base_happiness: 50
  capture_rate: 45
  color: blue
  egg_groups:
    - water1
    - ground
  evolution_chain: popplio
  evolves_from: ~
  flavor_text:
    sun:
      ja-Hrkt: |-
        がんばりやな　せいしつで　ゆうめい。
        たいえきを　はなで　ふくらませた
        バルーンを　てきに　ぶつける。
      ja: |-
        頑張り屋な　性質で　有名。
        体液を　鼻で　膨らませた
        バルーンを　敵に　ぶつける。
      ko: |-
        노력하는 성질로 유명하다.
        체액을 코로 부풀린
        풍선을 적에게 부딪힌다.
      zh-Hant: |-
        因勤奮的性格而聞名。
        會用鼻子將體液吹成氣球，
        然後扔向敵人。
      zh-Hans: |-
        因为勤奋的性格而有名。
        用鼻子将体液吹成气球，
        扔向敌人。
      en: |-
        This Pokémon snorts body fluids from its nose,
        blowing balloons to smash into its foes.
        It’s famous for being a hard worker.
      fr: |-
        Connu pour son tempérament de battant,
        il rassemble l’eau de son corps au bout de son
        museau en un ballon qu’il projette sur l’ennemi.
      de: |-
        Dieses Pokémon ist für seine Willensstärke
        bekannt. Bläst es Körperflüssigkeit durch die
        Nase, entsteht eine Blase, die als Waffe fungiert.
      es: |-
        Se le conoce por su diligencia y predisposición.
        Segrega agua por la nariz para hinchar globos
        con los que golpea a sus rivales.
      it: |-
        È conosciuto per la sua forza di volontà.
        Lancia sul nemico dei palloncini pieni d’acqua
        che gonfia con il naso.
    moon:
      ja-Hrkt: |-
        みずの　バルーンを　あやつる。
        おおきな　バルーンを　つくるため
        コツコツ　れんしゅうを　くりかえす。
      ja: |-
        水の　バルーンを　操る。
        大きな　バルーンを　作るため
        コツコツ　練習を　繰り返す。
      ko: |-
        물로 된 풍선을 조종한다.
        커다란 풍선을 만들기 위해
        꾸준히 연습을 반복한다.
      zh-Hant: |-
        操縱水做的氣球。
        為了製造大大的氣球，
        孜孜不倦地反復練習。
      zh-Hans: |-
        操纵水做的气球。
        为了制作大大的球，
        孜孜不倦地反复练习。
      en: |-
        This Pokémon can control water bubbles. It
        practices diligently so it can learn to make
        big bubbles.
      fr: |-
        Ce Pokémon fabrique des ballons remplis d’eau
        pour se battre. Il ne peut produire un gros ballon
        qu’au prix d’un entraînement rigoureux.
      de: |-
        Es kontrolliert Wasserblasen. Um eine große
        Blase zu erschaffen, muss es unermüdlich üben.
      es: |-
        Maneja con soltura los globos de agua que crea,
        pero, para poder hacer uno bien grande,
        necesita practicar sin descanso.
      it: |-
        Crea dei palloncini d’acqua che controlla
        nella lotta. Si allena costantemente per riuscire
        a produrre palloni di grandi dimensioni.
    ultra-sun:
      ja-Hrkt: |-
        はなで　ふくらませる　バルーンは
        ひび　れんしゅうを　かさねることで
        すこしずつ　おおきく　なっていく。
      ja: |-
        鼻で　膨らませる　バルーンは
        日々　練習を　重ねることで
        少しずつ　大きく　なっていく。
      ko: |-
        코로 부풀리는 벌룬은
        매일 연습을 반복하면서
        조금씩 커진다.
      zh-Hant: |-
        靠著每天不斷地練習，
        用鼻子吹出的氣球
        會一點一滴地漸漸變大。
      zh-Hans: |-
        通过每天不断地重复练习，
        用鼻子吹起来的气球
        一点点地变大起来。
      en: |-
        The balloons it inflates with its nose grow
        larger and larger as it practices day by day.
      fr: |-
        À force de s’entraîner quotidiennement,
        les ballons qu’il gonfle avec son nez grossissent
        de jour en jour.
      de: |-
        Dank seines täglichen Trainings gelingt es ihm,
        mit seiner Nase immer größere Blasen zu
        erzeugen.
      es: |-
        Gracias al entrenamiento diario al que se
        somete, es capaz de inflar burbujas cada vez
        más grandes a través de la nariz.
      it: |-
        Grazie al costante allenamento, i palloncini
        che gonfia con il naso diventano ogni giorno
        un po’ più grandi.
    ultra-moon:
      ja-Hrkt: |-
        だんりょくせいの　ある　みずの
        バルーンに　のって　だいジャンプ。
        アクロバティックに　たたかうぞ。
      ja: |-
        弾力性の　ある　水の
        バルーンに　乗って　大ジャンプ。
        アクロバティックに　戦うぞ。
      ko: |-
        탄력이 있는 물의
        벌룬을 타고 크게 점프한다.
        아크로바틱하게 싸운다.
      zh-Hant: |-
        會乘著有彈性的水球
        做出大大的跳躍，
        像表演雜技般地戰鬥。
      zh-Hans: |-
        乘着有弹性的水做的气球，
        进行大大的跳跃。
        会像表演杂技那样战斗。
      en: |-
        Popplio gets on top of its bouncy water balloons
        to jump higher. It’s quite the acrobatic fighter!
      fr: |-
        Il monte sur un ballon d’eau élastique pour
        effectuer de grands sauts. Son style de combat
        est on ne peut plus acrobatique.
      de: |-
        Es klettert auf seine elastischen Wasserblasen
        und nutzt sie als Trampolin. Sein Kampfstil ist
        sehr akrobatisch.
      es: |-
        Monta sobre las burbujas de agua para realizar
        grandes saltos. Su estilo de combate es
        bastante acrobático.
      it: |-
        Sfrutta l’elasticità dei palloncini d’acqua per
        rimbalzarci sopra e saltare ancora più in alto.
        Anche nelle lotte è un vero acrobata!
    sword:
      ja-Hrkt: |-
        だんりょくがあり　はれつした　ときの
        しょうげきで　あいてを　いためつける
        とくべつな　バルーンを　つくる。
      ja: |-
        弾力があり　破裂した　ときの
        衝撃で　相手を　痛めつける
        特別な　バルーンを　作る。
      ko: |-
        탄력이 있어 터졌을 때의
        충격으로 상대에게 타격을 주는
        특별한 벌룬을 만든다.
      zh-Hant: |-
        能吹出特別的氣球。
        靠富有彈力的氣球破裂時
        產生的衝擊力來痛擊對手。
      zh-Hans: |-
        能吹出特别的气球。
        靠富有弹力的气球破裂时
        产生的冲击力来痛击对手。
      en: |-
        It creates special bouncy balloons to send at its
        opponents. When the balloons pop, the sheer
        force of their bursting is what deals damage.
      fr: |-
        Il fabrique des ballons élastiques pour se battre.
        Ils blessent l’ennemi en explosant à son contact.
      de: |-
        Es kann besondere, elastische Blasen erschaffen,
        die seine Gegner verletzen, wenn sie platzen.
      es: |-
        Crea unos globos especiales muy elásticos que
        hieren al rival al estallar.
      it: |-
        Produce dei palloncini speciali dalla superficie
        elastica, che esplodendo feriscono l’avversario.
    shield:
      ja-Hrkt: |-
        まいにち　けんめいに　れんしゅうして
        ようやく　おおきくて　こうせいのうな
        バルーンを　つくれるようになるのだ。
      ja: |-
        毎日　懸命に　練習して
        ようやく　大きくて　高性能な
        バルーンを　つくれるようになるのだ。
      ko: |-
        매일 열심히 연습하면
        결국에는 커다랗고 성능 좋은
        벌룬을 만들 수 있게 된다.
      zh-Hant: |-
        每天拼命地練習，
        才終於能夠製造出
        又大又好用的氣球。
      zh-Hans: |-
        每天拼命地练习，
        才终于能够制造出
        又大又好用的气球。
      en: |-
        If Popplio want to create big, powerful balloons,
        they must be persistent. It takes daily practice for
        these Pokémon to develop their skills.
      fr: |-
        Il s’entraîne sans relâche tous les jours pour
        réussir à créer de gros ballons de bonne qualité.
      de: |-
        Es trainiert jeden Tag fleißig, um irgendwann
        eine Blase zu erschaffen, welche die perfekte
        Form und Größe vorweist.
      es: |-
        Entrena con ahínco a diario hasta que por fin es
        capaz de crear globos de un tamaño y eficacia
        adecuados.
      it: |-
        Si allena con impegno tutti i giorni fino a quando
        non è in grado di produrre palloncini d’acqua
        abbastanza grandi e utili ai suoi scopi.
