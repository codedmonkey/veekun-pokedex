    white-2:
      en: |-
        It loves the honey of flowers and
        can locate flower patches that
        have even tiny amounts of pollen.
    x:
      ja-Hrkt: |-
        はなの　ミツが　だいこうぶつ。
        わずかな　かふんで　はなばたけの
        ばしょを　さがしだすことが　できる。
      ja: |-
        花の　ミツが　大好物。
        わずかな　花粉で　花畑の
        場所を　探し出すことが　できる。
      ko: |-
        꽃의 꿀을 매우 좋아한다.
        약간의 꽃가루만으로 꽃밭이
        있는 장소를 찾아낼 수 있다.
      en: |-
        It loves the honey of flowers and can locate
        flower patches that have even tiny amounts
        of pollen.
      fr: |-
        Il raffole du nectar des fleurs. Il est capable de
        repérer la plus petite quantité de pollen.
      de: |-
        Es liebt Blütenhonig. Es findet selbst Blumen,
        die sehr wenig Pollen haben.
      es: |-
        Adora el néctar de las flores. Puede localizar hasta las
        más pequeñas cantidades de polen.
      it: |-
        Adora il nettare dei fiori e riesce a localizzare i campi
        in cui si trova anche una minima quantità di polline.
    'y':
      ja-Hrkt: |-
        ハネは　みずを　はじく　りんぷんに
        まもられている。あめの　ひでも
        そらを　とぶことが　できる。
      ja: |-
        羽は　水を　弾く　りんぷんに
        守られている。雨の　日でも
        空を　飛ぶことが　できる。
      ko: |-
        물을 튕겨내는 가루가
        날개를 보호하고 있다. 비가 오는 날에도
        하늘을 날 수 있다.
      en: |-
        The wings are protected by rain-repellent dust.
        As a result, this Pokémon can fly about even
        in rain.
      fr: |-
        Ses ailes sont recouvertes d’une poudre les
        protégeant de la pluie. Ce Pokémon peut donc voler
        pendant de grosses averses.
      de: |-
        Seine Flügel sind mit Wasser abweisendem Staub
        überzogen. Daher kann dieses Pokémon auch bei
        Regen fliegen.
      es: |-
        Tiene las alas protegidas con una capa impermeable,
        de ahí que pueda volar también cuando llueve.
      it: |-
        Una polvere idrorepellente gli ricopre le ali,
        permettendogli di volare anche sotto la pioggia.
    omega-ruby:
      ja-Hrkt: |-
        おいしい　はなの　ミツを　さがす　のうりょくに
        すぐれ　すみかから　１０キロはなれた　ばしょに
        さく　はなから　ミツを　あつめて　はこんでいる。
      ja: |-
        美味しい　花の　ミツを　探す　能力に
        優れ　すみかから　１０キロ離れた　場所に
        咲く　花から　ミツを　集めて　運んでいる。
      ko: |-
        맛있는 꽃의 꿀을 찾는 능력이
        뛰어나서 사는 곳에서 10km 떨어진 장소에
        핀 꽃에서 꿀을 모아 옮긴다.
      en: |-
        Butterfree has a superior ability to search for delicious honey
        from flowers. It can even search out, extract, and carry honey
        from flowers that are blooming over six miles from its nest.
      fr: |-
        Papilusion est très doué pour repérer le délicieux nectar qu’il
        butine dans les fleurs. Il peut détecter, extraire et transporter
        le nectar de fleurs situées à plus de 10 km de son nid.
      de: |-
        Smettbos größte Fähigkeit ist das Aufspüren köstlichen
        Blütenhonigs. Es findet sogar Honig in Blumen, die fast
        10 km von seinem Nest entfernt blühen.
      es: |-
        Butterfree tiene una habilidad especial para encontrar
        delicioso polen en las flores. Puede localizar, extraer y
        transportar polen de flores que estén floreciendo a 10 km
        de distancia de su nido.
      it: |-
        Butterfree è dotato di abilità molto raffinate per individuare
        il delizioso nettare dei fiori. Riesce a trovare, estrarre
        e trasportare il nettare dai fiori in boccio al nido anche
        per 10 km.
    alpha-sapphire:
      ja-Hrkt: |-
        おいしい　はなの　ミツを　さがす　のうりょくに
        すぐれ　すみかから　１０キロはなれた　ばしょに
