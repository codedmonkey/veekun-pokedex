    sun:
      ja-Hrkt: |-
        おおきな　めを　よく　かんさつすると
        じつは　ちいさな　めが　むすうに
        あつまって　できているのが　わかる。
      ja: |-
        大きな　眼を　よく　観察すると
        実は　小さな　眼が　無数に
        集まって　できているのが　わかる。
      ko: |-
        커다란 눈을 잘 관찰하면
        사실 작은 눈이 무수히 모여
        만들어진 것을 알 수 있다.
      zh-Hant: |-
        仔細觀察那雙大眼睛的話，
        會發現那其實是由無數小眼睛
        聚集在一起而形成的。
      zh-Hans: |-
        仔细观察那对大眼睛的话，
        会发现其实是许许多多小眼睛
        聚集在一起形成的。
      en: |-
        Close examination of its large eyes reveals that
        each eye is composed of a myriad of tiny eyes.
      fr: |-
        Si l’on regarde ses grands yeux de plus près,
        on remarque qu’il s’agit en réalité d’une
        multitude de petits yeux réunis.
      de: |-
        Bei genauerer Betrachtung zeigt sich, dass
        seine zwei großen Augen jeweils aus einer
        Vielzahl an kleineren Augen bestehen.
      es: |-
        Al mirar sus grandes ojos desde cerca, puede
        observarse como en realidad están compuestos
        de incontables ojos diminutos.
      it: |-
        Osservando da vicino i suoi grandi occhi
        si nota che in realtà sono composti da una
        miriade di minuscoli occhietti.
    moon:
      ja-Hrkt: |-
        ほかの　ポケモンに　おそわれると
        どくの　りんぷんを　まきちらしながら
        はばたいて　ていこう　するのだ。
      ja: |-
        他の　ポケモンに　襲われると
        毒の　鱗粉を　撒き散らしながら
        羽ばたいて　抵抗　するのだ。
      ko: |-
        다른 포켓몬에게 습격당하면
        독 인분을 흩뿌리며
        날갯짓하여 저항한다.
      zh-Hant: |-
        如果被其他寶可夢襲擊，
        就會一邊散布有毒的鱗粉，
        一邊拍動翅膀抵抗。
      zh-Hans: |-
        如果被其他宝可梦袭击，
        就会一边挥洒有毒的鳞粉，
        一边拍动翅膀抵抗。
      en: |-
        When attacked by other Pokémon, it defends
        itself by scattering its poisonous scales and
        fluttering its wings.
      fr: |-
        Pour se défendre contre les agressions d’autres
        Pokémon, il bat des ailes en éparpillant autour
        de lui un nuage de poussière toxique.
      de: |-
        Wird es von einem anderen Pokémon angegriffen,
        wehrt es sich, indem es mit den Flügeln schlägt
        und giftigen Flügelstaub verstreut.
      es: |-
        Cuando lo atacan, Butterfree aletea con fuerza
        y esparce escamas venenosas con las que hace
        frente a su adversario.
      it: |-
        Quando viene attaccato da altri Pokémon,
        si difende sbattendo le ali e spargendo intorno
        a sé polveri velenose.
    ultra-sun:
      ja-Hrkt: |-
        ハネを　つつむ　りんぷんは　もうどく。
        キャタピーを　ねらう　とりポケモンを
        みつけると　ふりかけて　おいはらうぞ。
      ja: |-
        羽を　包む　りん粉は　猛毒。
        キャタピーを　狙う　とりポケモンを
        見つけると　ふりかけて　追い払うぞ。
      ko: |-
        날개를 감싼 인분은 맹독이다.
        캐터피를 노리는 새포켓몬을
        발견하면 흩뿌려 내쫓는다.
      zh-Hant: |-
        附著在翅膀上的鱗粉帶有劇毒，
        一旦發現有鳥寶可夢要襲擊綠毛蟲，
        就會撒出鱗粉來趕跑對方。
      zh-Hans: |-
        翅膀上覆盖着的鳞粉有剧毒。
        如果发现有鸟宝可梦要袭击绿毛虫，
        就会撒出鳞粉将它赶跑。
      en: |-
        Its wings are covered in toxic scales. If it finds
        bird Pokémon going after Caterpie, Butterfree
        sprinkles its scales on them to drive them off.
      fr: |-
        Lorsqu’il surprend un Pokémon oiseau attaquant
        un Chenipan, il répand les écailles très toxiques
        qui recouvrent ses ailes sur l’assaillant.
      de: |-
        Sieht es ein Raupy, das von Vogel-Pokémon
        angegriffen wird, schlägt es diese mit seinem
        hochgiftigen Flügelstaub in die Flucht.
      es: |-
        Si un Pokémon pájaro acecha a un Caterpie,
        Butterfree esparcirá las escamas venenosas
        que recubren sus alas para ahuyentarlo.
      it: |-
        Se vede dei Pokémon alati attaccare Caterpie,
        li scaccia cospargendoli con la velenosissima 
        polvere che ricopre le sue ali.
    ultra-moon:
      ja-Hrkt: |-
        きれいな　はなの　ミツが　こうぶつ。
        はなばたけで　アブリーとの　しれつな
        なわばりあらそいを　くりひろげる。
      ja: |-
        綺麗な　花の　ミツが　好物。
        花畑で　アブリーとの　熾烈な
        縄張り争いを　繰り広げる。
      ko: |-
        예쁜 꽃의 꿀을 좋아한다.
        꽃밭에서 에블리와 치열한
        영역 싸움을 벌인다.
      zh-Hant: |-
        愛吃美麗花朵的花蜜，
        總是在花圃和萌虻
        展開激烈的地盤爭奪戰。
      zh-Hans: |-
        喜食美丽花儿的花蜜。
        会在花圃里和萌虻
        展开激烈的领地之争。
      en: |-
        Nectar from pretty flowers is its favorite food.
        In fields of flowers, it has heated battles with
        Cutiefly for territory.
      fr: |-
        Il raffole du nectar des plus jolies fleurs.
        Dans les prairies, les luttes territoriales
        l’opposant à Bombydou sont impitoyables.
      de: |-
        Es liebt den Blütenhonig schöner Blumen.
        Auf Blumenfeldern liefert es sich erbitterte
        Revierkämpfe mit Wommel.
      es: |-
        Adora el néctar de las flores más bellas. Libra
        feroces disputas territoriales en los prados con
        los Cutiefly.
      it: |-
        È ghiotto del nettare dei fiori più belli.
        Si contende i prati in fiore con Cutiefly in furiose
        lotte per il territorio.
    lets-go-pikachu:
      ja-Hrkt: |-
        ハネの　もうどくの　りんぷんには
        みずをはじく　せいしつが　あるので
        あめのひ　でも　とびまわれる。
      ja: |-
        ハネの　猛毒の　りん粉には
        水を弾く　性質が　あるので
        雨の日　でも　飛びまわれる。
      ko: |-
        날개에 있는 맹독을 가진 인분에는
        물을 튕겨내는 성질이 있어
        비가 오는 날에도 날아다닐 수 있다.
      zh-Hant: |-
        翅膀上的劇毒鱗粉
        有著能夠防水的特性，
        即使在雨天也能自在飛翔。
      zh-Hans: |-
        它翅膀上的剧毒鳞粉
        能够防水，因此即使是
        雨天也可以飞来飞去。
      en: |-
        Its wings, covered with poisonous powder, repel
        water. This allows it to fly in the rain.
      fr: |-
        Ses ailes sont enduites d’une poudre toxique
        imperméable lui permettant de voler sous
        la pluie.
      de: |-
        Da die hochgiftige Staubschicht auf seinen
        Flügeln wasserabweisend ist, kann es auch
        bei Regen umherfliegen.
      es: |-
        Sus alas están recubiertas de escamas venenosas
        impermeables que le permiten volar bajo la
        lluvia.
      it: |-
        Possiede ali idrorepellenti ricoperte da una
        polvere velenosa. Può volare anche quando
        piove.
    lets-go-eevee:
      ja-Hrkt: |-
        ハネの　もうどくの　りんぷんには
        みずをはじく　せいしつが　あるので
        あめのひ　でも　とびまわれる。
      ja: |-
        ハネの　猛毒の　りん粉には
