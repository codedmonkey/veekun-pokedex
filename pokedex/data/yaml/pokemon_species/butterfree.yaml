butterfree:
  base_happiness: 50
  capture_rate: 45
  color: white
  egg_groups:
    - bug
  evolution_chain: caterpie
  evolves_from: metapod
  flavor_text:
    red:
      en: |-
        In battle, it
        flaps its wings
