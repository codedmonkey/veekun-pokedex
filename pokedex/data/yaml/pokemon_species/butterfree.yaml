    sword:
      ja-Hrkt: |-
        こまかく　はやく　はばたいたら
        もうどくの　りんぷんが
        かぜに　のって　とんでくるぞ。
      ja: |-
        こまかく　速く　羽ばたいたら
        猛毒の　りんぷんが
        風に　のって　飛んでくるぞ。
      ko: |-
        매우 빠르게 날갯짓하면
        맹독성의 인분이
        바람을 타고 날아간다.
      zh-Hant: |-
        當牠飛快地拍動翅膀，
        帶有劇毒的鱗粉就會
        隨著風向這裡飄過來。
      zh-Hans: |-
        当它飞快地扑打翅膀，
        带有剧毒的鳞粉就会
        随着风向这里飘过来。
      en: |-
        In battle, it flaps its wings at great speed to
        release highly toxic dust into the air.
      fr: |-
        En combat, il bat des ailes très rapidement pour
        projeter de la poudre toxique sur ses ennemis.
      de: |-
        Wenn es sehr schnell mit den Flügeln schlägt,
        setzt es hochgiftigen Flügelstaub frei.
      es: |-
        Aletea a gran velocidad para lanzar al aire sus
        escamas extremadamente tóxicas.
      it: |-
        Sbatte le ali a gran velocità per liberare
        le sue polveri tossiche nell’aria.
    shield:
      ja-Hrkt: |-
        まいにち　ミツを　あつめまわる。
        あしの　うぶげに　ミツを　ぬりこんで
        すに　もちかえる　しゅうせいをもつ。
      ja: |-
        毎日　ミツを　集めまわる。
        脚の　産毛に　ミツを　塗りこんで
        巣に　持ち帰る　習性をもつ。
      ko: |-
        매일 꿀을 모으러 다닌다.
        다리의 솜털에 꿀을 발라
        둥지로 가지고 가는 습성이 있다.
      zh-Hant: |-
        每天都忙著採集花蜜。
        習慣在腿部的細毛上塗滿花蜜，
        然後帶回巢穴裡。
      zh-Hans: |-
        每天都忙着采集花蜜。
        习惯往腿部的细毛上涂满花蜜，
        然后带回巢穴里。
      en: |-
        It collects honey every day. It rubs honey onto
        the hairs on its legs to carry it back to its nest.
      fr: |-
        Il ramasse du nectar chaque jour et l’agglutine
        sur les poils de ses pattes pour le transporter
        jusqu’à son nid.
      de: |-
        Es sammelt täglich Honig. Es reibt ihn in seine
        Beinhaare, um ihn in sein Nest zu transportieren.
      es: |-
        Recoge néctar a diario y se lo adhiere al pelo de
        las patas para llevarlo a su nido.
      it: |-
        Raccoglie nettare tutti i giorni e lo spalma sulla
        peluria che ricopre le sue zampe per trasportarlo
        al nido.
