    x:
      ja-Hrkt: |-
        さらに　けんきゅうが　すすめられ
        のうりょくが　たかまった。ときどき
        プログラムにない　しぐさを　みせる。
      ja: |-
        さらに　研究が　進められ
        能力が　高まった。ときどき
        プログラムにない　仕草を　見せる。
      ko: |-
        더욱 연구가 진행되어
        능력이 올라갔다. 가끔
        프로그램에 없는 행동을 보인다.
      en: |-
        Further research enhanced its abilities. Sometimes,
        it may exhibit motions that were not programmed.
      fr: |-
        Des recherches poussées ont amélioré ses capacités.
        Il a appris de nouveaux mouvements.
      de: |-
        Seine Fähigkeiten wurden verbessert. Es zeigt
        manchmal sogar Handlungen, die nicht
        einprogrammiert sind.
      es: |-
        La investigación mejoró sus habilidades. A veces,
        puede actuar de forma no programada.
      it: |-
        Ricerche avanzate hanno potenziato le sue capacità.
        Ora può fare movimenti che non erano programmati.
    'y':
      ja-Hrkt: |-
        わくせいかいはつようの　プログラムが
        インストールされている。しんくうの
        うちゅうでも　かつどうできるのだ。
      ja: |-
        惑星開発用の　プログラムが
        インストールされている。
        真空の　宇宙でも　活動できるのだ。
      ko: |-
        행성 개발용 프로그램이
        인스톨되어 있다. 우주와 같은
        진공 공간에서도 활동할 수 있다.
      en: |-
        With planetary development software installed,
        it became capable of working in space.
      fr: |-
        On lui a installé un logiciel de terraformation pour
        lui permettre de travailler dans l’espace.
      de: |-
        Interstellare Software wurde installiert, sodass
        dieses Pokémon sich auch im All bewegen kann.
      es: |-
        Tiene instalado un avanzado software astrofísico que
        le permite trabajar en el espacio.
      it: |-
        Gli è stato installato un programma di sviluppo
        planetario che lo rende capace di lavorare nello
        spazio.
    omega-ruby:
      ja-Hrkt: |-
        にんげんが　かがくの　ちからで　つくりだした。
        じんこう　ちのうを　もたせたので　あたらしい
        しぐさや　かんじょうを　ひとりで　おぼえていく。
      ja: |-
        人間が　科学の　力で　つくりだした。
        人工　知能を　持たせたので　新しい
        仕草や　感情を　ひとりで　覚えていく。
      ko: |-
        인간이 과학의 힘으로 만들어냈다.
        인공 지능을 지니고 있어서 새로운
        동작이나 감정을 혼자서 익혀간다.
      en: |-
        Porygon2 was created by humans using the power of science.
        The man-made Pokémon has been endowed with artificial
        intelligence that enables it to learn new gestures and emotions
        on its own.
      fr: |-
        Porygon2 fut créé par des humains grâce aux progrès
        de la science. Ce Pokémon a été doté d’une intelligence
        artificielle qui lui permet d’apprendre de nouveaux
        mouvements et des émotions par lui-même.
      de: |-
        Porygon2 wurde in einem wissenschaftlichen Experiment
        von Menschen erzeugt. Es verfügt über künstliche Intelligenz,
        wodurch es selbstständig neue Gesten und Gefühle erlernen
        kann.
      es: |-
        Porygon2 fue creado por el hombre gracias a los avances de
        la ciencia. Esta obra humana ha sido provista de inteligencia
        artificial que le permite aprender gestos y sensaciones nuevas
        por su cuenta.
      it: |-
        Porygon2 è una creatura artificiale frutto del sapere scientifico.
        Questo Pokémon è dotato di un’intelligenza artificiale che
        gli consente d’imparare autonomamente nuovi comportamenti
        ed emozioni.
    alpha-sapphire:
      ja-Hrkt: |-
        にんげんが　かがくの　ちからで　つくりだした。
        じんこう　ちのうを　もたせたので　あたらしい
        しぐさや　かんじょうを　ひとりで　おぼえていく。
      ja: |-
        人間が　科学の　力で　つくりだした。
        人工　知能を　持たせたので　新しい
        仕草や　感情を　ひとりで　覚えていく。
      ko: |-
        인간이 과학의 힘으로 만들어냈다.
        인공 지능을 지니고 있어서 새로운
        동작이나 감정을 혼자서 익혀간다.
      en: |-
        Porygon2 was created by humans using the power of science.
        The man-made Pokémon has been endowed with artificial
        intelligence that enables it to learn new gestures and emotions
        on its own.
      fr: |-
        Porygon2 fut créé par des humains grâce aux progrès
        de la science. Ce Pokémon a été doté d’une intelligence
        artificielle qui lui permet d’apprendre de nouveaux
        mouvements et des émotions par lui-même.
      de: |-
        Porygon2 wurde in einem wissenschaftlichen Experiment
        von Menschen erzeugt. Es verfügt über künstliche Intelligenz,
        wodurch es selbstständig neue Gesten und Gefühle erlernen
        kann.
      es: |-
        Porygon2 fue creado por el hombre gracias a los avances de
        la ciencia. Esta obra humana ha sido provista de inteligencia
        artificial que le permite aprender gestos y sensaciones nuevas
        por su cuenta.
      it: |-
        Porygon2 è una creatura artificiale frutto del sapere scientifico.
        Questo Pokémon è dotato di un’intelligenza artificiale che
        gli consente d’imparare autonomamente nuovi comportamenti
        ed emozioni.
    sun:
      ja-Hrkt: |-
        わくせい　かいはつを　しやに　いれ
        とうじの　さいしん　ぎじゅつで
        ポリゴンを　アップデートしたのだ。
      ja: |-
        惑星　開発を　視野に　入れ
        当時の　最新　技術で
        ポリゴンを　アップデートしたのだ。
      ko: |-
        행성 개발을 시야에 넣어
        당시의 최신 기술로
        폴리곤을 업데이트했다.
      zh-Hant: |-
        將行星的開發納入視野，
        以當時的最新技術升級了多邊獸。
      zh-Hans: |-
        将行星的开发纳入视野，
        以当时的最新技术升级了多边兽。
      en: |-
        For the purposes of planetary development,
        Porygon was updated with the most
        cutting-edge technology available.
      fr: |-
        Cette mise à jour de Porygon a été conçue
        dans le cadre d’un projet de terraformation,
        grâce aux avancées scientifiques de l’époque.
      de: |-
        In der Absicht, andere Planeten zu erforschen,
        verpasste man Porygon ein Upgrade auf dem
        höchsten Stand der damaligen Technologie.
      es: |-
        Esta versión actualizada de Porygon ha sido
        dotada de la más avanzada tecnología, lo que,
        en teoría, le permite explorar otros planetas.
      it: |-
        È stato creato aggiornando Porygon con la
        tecnologia più avanzata per l’epoca, in vista
        di un progetto di sviluppo planetario.
    moon:
      ja-Hrkt: |-
        わくせい　かいはつを　もくひょうに
        ポリゴンを　バージョンアップしたが
        まだまだ　ゆめには　とどかない。
      ja: |-
        惑星　開発を　目標に
        ポリゴンを　バージョンアップしたが
        まだまだ　夢には　届かない。
      ko: |-
        행성 개발을 목표로
        폴리곤을 버전 업 했지만
        아직 꿈에 도달하지 못했다.
      zh-Hant: |-
        以行星的開發為目標
        升級了多邊獸，
        但距離夢想實現還有很長的距離。
      zh-Hans: |-
        以行星的开发为目标
        将多边兽升级而成，
        但离实现梦想还有很长距离。
      en: |-
        Porygon was updated to a new version in
        readiness for planetary development. But that
        dream remains unrealized as yet.
      fr: |-
        Version évoluée de Porygon, créée dans l’espoir
        de pouvoir un jour terraformer des planètes,
        un rêve loin d’être concrétisé pour l’instant.
      de: |-
        Porygon erfuhr ein Upgrade auf diese Version
        mit dem Ziel, andere Planeten zu erschließen.
        Bislang bleibt diese Vision unverwirklicht.
      es: |-
        Esta versión de Porygon mejorada se creó para
        posibilitar la exploración de otros planetas. Por
        desgracia, este sueño sigue siendo inalcanzable.
      it: |-
        È nato da un potenziamento di Porygon per un
        progetto di esplorazione di altri pianeti che
        però non ha avuto successo.
    ultra-sun:
      ja-Hrkt: |-
        ＡＩを　とうさい。　じりきで
        さまざまなことを　まなんでいくが
        よけいなことまで　おぼえだす。
      ja: |-
        ＡＩを　搭載。　自力で
        様々なことを　学んでいくが
        余計なことまで　覚えだす。
      ko: |-
        AI를 탑재했다. 자력으로
        다양한 것을 습득하지만
        필요 없는 것까지 배운다.
      zh-Hant: |-
        內建ＡＩ。
        會自己學習各式各樣的事物，
        但也會記住一些多餘的東西。
      zh-Hans: |-
        搭载有ＡＩ。
        会自己学习各种各样的事情，
        但也会记住一些多余的东西。
      en: |-
        AI has been installed in it. It learns various
        things all on its own, but it even remembers
        things it doesn’t need to know.
      fr: |-
        Grâce à son intelligence artificielle, il peut
        apprendre beaucoup de choses par lui-même,
        qu’elles soient utiles... ou un peu superflues.
      de: |-
        Es ist mit künstlicher Intelligenz ausgestattet
        und kann selbstständig verschiedene Dinge
        lernen. Darunter ist jedoch auch viel Unnützes.
      es: |-
        Un Pokémon dotado de inteligencia artificial y
        capacidad de aprendizaje autónomo, aunque a
        veces aprende cosas que no debería.
      it: |-
        Dotato di intelligenza artificiale, è in grado di
        imparare autonomamente molte cose... anche
        quelle che non dovrebbe!
    ultra-moon:
      ja-Hrkt: |-
        うちゅうくうかん　でも　しなないが
        むじゅうりょく　では　うまく
        みうごきを　とることが　できない。
      ja: |-
        宇宙空間　でも　死なないが
        無重力　では　うまく
        身動きを　とることが　できない。
      ko: |-
        우주 공간에서도 죽지 않지만
        무중력 상태에서는
        제대로 몸을 가누지 못한다.
      zh-Hant: |-
        雖然在宇宙空間裡也不會死亡，
        但在無重力的環境下，
        牠根本無法順利活動身體。
      zh-Hans: |-
        虽然在宇宙空间里也不会死亡，
        但在无重力的环境下，
        它无法顺利地转动身体。
      en: |-
        Even though it doesn’t die in the vacuum of
        space, it can’t move around very well in
        zero gravity.
      fr: |-
        Bien qu’il puisse survivre dans l’espace, il peine
        malheureusement à se mouvoir en apesanteur.
      de: |-
        Es ist zwar imstande, auch im All zu überleben,
        aber in der Schwerelosigkeit kann es sich nicht
        gut fortbewegen.
      es: |-
        Puede sobrevivir en el espacio, aunque la
        ausencia de gravedad entorpece sus
        movimientos.
      it: |-
        Sopravvive anche nello spazio, ma non è in
        grado di muoversi agevolmente a causa
        dell’assenza di gravità.
    sword:
      ja-Hrkt: |-
        ポリゴンを　とくべつな　データで
        アップデート。　さまざまな　ことを
        じぶんで　まなび　せいちょうする。
      ja: |-
        ポリゴンを　特別な　データで
        アップデート。　さまざまな　ことを
        自分で　学び　成長する。
      ko: |-
        폴리곤을 특별한 데이터로
        업데이트했다. 다양한 것을
        스스로 배우고 성장한다.
      zh-Hant: |-
        利用特別的數據升級了
        的多邊獸。會自己學習
        各式各樣的事物來成長。
      zh-Hans: |-
        通过特别的数据使多边兽
        得以升级。能自己学会
        各种各样的事情实现成长。
      en: |-
        This is a Porygon that was updated with special
        data. Porygon2 develops itself by learning about
        many different subjects all on its own.
      fr: |-
        Fruit de la mise à jour d’un Porygon avec
        des données spéciales, il peut apprendre
        et se développer de manière autonome.
      de: |-
        Durch ein Update mit besonderen Daten wurde
        Porygon zu Porygon2. Es erweitert sein Wissen,
        indem es selbstständig verschiedene Dinge lernt.
      es: |-
        Se trata de una versión mejorada de Porygon
        mediante un software especial. Tiene capacidad
        de aprendizaje autónomo.
      it: |-
        È un Porygon aggiornato con dei dati particolari.
        Cresce imparando autonomamente svariate cose.
    shield:
      ja-Hrkt: |-
        ＡＩきのうを　とうさいした　けっか
        ポリゴン２　どうしにしか　わからない
        なぞの　げんごを　はなし　はじめた。
      ja: |-
        ＡＩ機能を　搭載した　結果
        ポリゴン２　同士にしか　わからない
        謎の　言語を　話しはじめた。
      ko: |-
        AI 기능을 탑재한 결과
        폴리곤2끼리만 통하는 수수께끼의
        언어로 말하기 시작했다.
      zh-Hant: |-
        搭載了ＡＩ功能後，開始
        說起了只有多邊獸Ⅱ彼此
        之間才能了解的神秘語言。
      zh-Hans: |-
        在装载了ＡＩ功能后，
        多边兽２型便开始用只有彼此
        能懂的神秘语言互相交流了。
      en: |-
        After artificial intelligence was implemented in
        Porygon2, the Pokémon began using a strange
        language that only other Porygon2 understand.
      fr: |-
        Depuis qu’on l’a doté d’une intelligence
        artificielle, il parle un langage mystérieux
        que seuls ses congénères comprennent.
      de: |-
        Als es mit künstlicher Intelligenz ausgestattet
        wurde, begann es, eine rätselhafte Sprache zu
        sprechen, die nur andere Porygon2 verstehen.
      es: |-
        Al dotarlo de inteligencia artificial, desarrolló un
        misterioso lenguaje que solo los miembros de su
        especie son capaces de comprender.
      it: |-
        Dopo essere stati dotati d’intelligenza artificiale,
        i Porygon2 hanno cominciato a parlare fra di loro
        utilizzando una lingua misteriosa.
