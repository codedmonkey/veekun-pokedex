banette:
  base_happiness: 35
  capture_rate: 45
  color: black
  egg_groups:
    - indeterminate
  evolution_chain: shuppet
  evolves_from: shuppet
  flavor_text:
    ruby:
      en: |-
        BANETTE generates energy for laying
        strong curses by sticking pins into its
        own body.This POKéMON was originally a pitiful
        plush doll that was thrown away.
    sapphire:
      en: |-
        A cursed energy permeated the stuffing
        of a discarded and forgotten plush doll,
        giving it new life as BANETTE.The POKéMON’s energy would escape if it
        were to ever open its mouth.
    emerald:
      en: |-
        An abandoned plush doll became this
        POKéMON. They are said to live in garbage
        dumps and wander about in search of the
        children that threw them away.
    firered:
      en: |-
        Strong feelings of hatred turned a puppet
        into a POKéMON. If it opens its mouth,
        its cursed energy escapes.
    leafgreen:
      en: |-
        Strong feelings of hatred turned a puppet
        into a POKéMON. If it opens its mouth,
        its cursed energy escapes.
    diamond:
      en: |-
        A doll that became a Pokémon over
        its grudge from being junked. It
        seeks the child that disowned it.
    pearl:
      en: |-
        A doll that became a Pokémon over
        its grudge from being junked. It
        seeks the child that disowned it.
    platinum:
      en: |-
        A doll that became a Pokémon over
        its grudge from being junked. It
        seeks the child that disowned it.
    heartgold:
      en: |-
        This Pokémon developed from an
        abandoned doll that amassed a
        grudge. It is seen in dark alleys.
    soulsilver:
      en: |-
        This Pokémon developed from an
        abandoned doll that amassed a
        grudge. It is seen in dark alleys.
    black:
      en: |-
        A doll that became a Pokémon over
        its grudge from being junked. It
        seeks the child that disowned it.
      fr: |-
        Une poupée mue par la tristesse qui
        la ronge depuis qu’on l’a délaissée.
        Elle recherche son propriétaire.
    white:
      en: |-
        A doll that became a Pokémon over
        its grudge from being junked. It
        seeks the child that disowned it.
      fr: |-
        Une poupée mue par la tristesse qui
        la ronge depuis qu’on l’a délaissée.
        Elle recherche son propriétaire.
    black-2:
      en: |-
        A doll that became a Pokémon over
        its grudge of being thrown away. It
        seeks the child who disowned it.
    white-2:
      en: |-
        A doll that became a Pokémon over
        its grudge of being thrown away. It
        seeks the child who disowned it.
    x:
      ja-Hrkt: |-
        すてられた　ぬいぐるみに　おんねんが
        やどり　ポケモンになった。じぶんを
        すてた　こどもを　さがしている。
      ja: |-
        捨てられた　ぬいぐるみに　おんねんが
        宿り　ポケモンになった。自分を
        捨てた　子供を　捜している。
      ko: |-
        버려진 인형에 원념이
        깃들어 포켓몬이 되었다.
        자신을 버린 아이를 찾고 있다.
      en: |-
        A doll that became a Pokémon over its grudge from
        being junked. It seeks the child that disowned it.
      fr: |-
        Une poupée mue par la tristesse qui la ronge depuis
        qu’on l’a délaissée. Elle recherche son propriétaire.
      de: |-
        Dieses Pokémon war eine Puppe, die weggeworfen
        wurde. Es sucht nun das Kind, das dies getan hat.
      es: |-
        Este muñeco se convirtió en un Pokémon cuando lo
        tiraron a la basura. Busca a su antiguo dueño.
      it: |-
        Un peluche divenuto Pokémon per la rabbia di essere
        stato buttato via da un bimbo, di cui è alla ricerca.
    'y':
      ja-Hrkt: |-
        つよい　おんねんが　ぬいぐるみを
        ポケモンに　かえた。くちを　あけると
        のろいの　エネルギーが　にげていく。
      ja: |-
        強い　おん念が　ぬいぐるみを
        ポケモンに　変えた。口を　開けると
        のろいの　エネルギーが　逃げていく。
      ko: |-
        강한 원념이 인형을
        포켓몬으로 바꿨다. 입을 열면
        저주의 에너지가 빠져나간다.
      en: |-
        Strong feelings of hatred turned a puppet into a
        Pokémon. If it opens its mouth, its cursed
        energy escapes.
      fr: |-
        Un très violent sentiment de haine a transformé
        une poupée de chiffon en Branette. S’il ouvre la
        bouche, une énergie négative s’en échappe.
      de: |-
        Starke Gefühle des Hasses machten aus einer Puppe
        ein Pokémon. Öffnet es seinen Mund, kann die ganze
        verfluchte Energie hinaus.
      es: |-
        Cuando abandonaron a este muñeco de felpa, se
        convirtió en Pokémon. Libera una energía que hechiza
        al enemigo.
      it: |-
        Peluche trasformato in Pokémon da un forte odio.
        Appena apre la sua bocca, sprigiona una forte
        energia negativa.
    omega-ruby:
      ja-Hrkt: |-
        じぶんの　からだを　はりで　キズつける　とき
        つよい　のろいの　エネルギーが　はっせいする。
        もとは　すてられた　かわいそうな　ぬいぐるみ。
      ja: |-
        自分の　体を　針で　キズつける　とき
        強い　のろいの　エネルギーが　発生する。
        元は　捨てられた　可哀想な　ぬいぐるみ。
      ko: |-
        자신의 몸을 바늘로 상처 낼 때
        강한 저주 에너지가 발생한다.
        원래는 버려진 불쌍한 인형이다.
      en: |-
        Banette generates energy for laying strong curses by sticking
        pins into its own body. This Pokémon was originally a pitiful
        plush doll that was thrown away.
      fr: |-
        En plantant des aiguilles dans son propre corps,
        Branette génère de l’énergie permettant de lancer
        de puissantes malédictions. Au départ, ce Pokémon
        n’était qu’une malheureuse peluche jetée à la poubelle.
      de: |-
        Banette belegt andere mit Flüchen, indem es Nadeln in seinen
        eigenen Körper sticht. Dieses Pokémon war ursprünglich eine
        mitleiderregende Plüschpuppe, die weggeworfen wurde.
      es: |-
        Banette genera energía para echar un infalible hechizo
        clavándose púas a sí mismo. Los orígenes de este Pokémon
        son algo tristes: era un muñeco de felpa al que tiraron a la
        basura.
      it: |-
        Banette genera energia per lanciare terribili maledizioni,
        conficcandosi alcuni spilli nel corpo. Originariamente questo
        Pokémon era un dolce peluche, successivamente gettato via.
    alpha-sapphire:
      ja-Hrkt: |-
        すてられた　ぬいぐるみの　わたに　のろいの
        エネルギーが　しみこんで　ポケモンに　なった。
        くちを　あけると　エネルギーが　にげてしまう。
      ja: |-
        捨てられた　ぬいぐるみの　綿に　のろいの
        エネルギーが　染み込んで　ポケモンに　なった。
        口を　開けると　エネルギーが　逃げてしまう。
      ko: |-
        버려진 인형의 솜에 저주
        에너지가 스며들어 포켓몬이 되었다.
        입을 열면 에너지가 빠져나간다.
      en: |-
        A cursed energy permeated the stuffing of a discarded and
        forgotten plush doll, giving it new life as Banette.
        The Pokémon’s energy would escape if it were to ever open
        its mouth.
      fr: |-
        Une énergie maudite a pénétré le rembourrage d’une vieille
        peluche abandonnée, donnant ainsi vie à Branette. L’énergie
        de ce Pokémon s’échappe s’il ouvre la bouche.
      de: |-
        Die Energie eines Fluchs durchdrang die Füllung einer
        weggeworfenen und vergessenen Plüschpuppe und erweckte
        Banette zum Leben. Die Energie dieses Pokémon würde
        entweichen, wenn es seinen Mund öffnen sollte.
      es: |-
        Fue un hechizo el que hizo que el relleno de este muñeco de
        felpa olvidado y abandonado pasara a ser Banette. Si este
        Pokémon abriera la boca, se quedaría sin energía.
      it: |-
        Un’energia maledetta ha permeato l’imbottitura di un peluche
        vecchio e dimenticato, dando vita a Banette.
        Questo Pokémon deve tenere sempre la bocca chiusa per
        evitare che l’energia accumulata scappi fuori.
    ultra-sun:
      ja-Hrkt: |-
        すてられた　ヌイグルミに　おんねんが
        やどった。　じぶんを　すてたものを
        さがし　ふくしゅうする　つもりだ。
      ja: |-
        捨てられた　ヌイグルミに　怨念が
        宿った。　自分を　捨てた者を
        探し　復しゅうする　つもりだ。
      ko: |-
        버려진 인형에 원념이 깃들었다.
        자신을 버린 자를 
        찾아내 복수할 셈이다.
      zh-Hant: |-
        怨念附在被丟棄的玩偶上，
        不斷尋找著丟棄自己的人，
        想要為自己報仇。
      zh-Hans: |-
        怨念附在被丢弃的玩偶身上，
        打算寻找丢弃自己的人来报仇。
      en: |-
        It’s a stuffed toy that was thrown away and
        became possessed, ever searching for the one
        who threw it away so it can exact its revenge.
      fr: |-
        Animée par la rancune, cette poupée
        abandonnée traque son ancien propriétaire
        pour se venger.
      de: |-
        Einst als Plüschpuppe weggeworfen, ist dieses
        hasserfüllte Pokémon auf der Suche nach dem
        Täter, um sich an ihm zu rächen.
      es: |-
        Este muñeco de trapo alberga gran odio por la
        persona que lo abandonó, a quien busca sin
        descanso para vengarse.
      it: |-
        È un peluche pieno di rancore per essere stato
        buttato via. Cerca senza darsi pace il vecchio
        proprietario per vendicarsi.
    ultra-moon:
      ja-Hrkt: |-
        すてられた　おんねんで　うまれる。
        たいせつに　されると　まんぞくして
        もとの　ヌイグルミに　もどるという。
      ja: |-
        捨てられた　怨念で　生まれる。
        大切に　されると　満足して
        元の　ヌイグルミに　戻るという。
      ko: |-
        버려진 원념에 의해 태어난다.
        소중히 대하면 만족해서
        원래의 인형으로 돌아간다고 한다.
      zh-Hant: |-
        誕生自遭到捨棄時的怨念。
        據說只要讓牠感覺自己受到重視，
        牠就會滿意地變回原本的玩偶。
      zh-Hans: |-
        因被丢弃的怨念而诞生。
        听说，如果满足它受重视的需求，
        就会变回原来的玩偶。
      en: |-
        Resentment at being cast off made it spring into
        being. Some say that treating it well will satisfy
        it, and it will once more become a stuffed toy.
      fr: |-
        Il est né de la rancune qu’il a ressentie quand
        il a été abandonné. Il redevient apparemment
        une poupée si l’on en prend grand soin.
      de: |-
        Geboren aus Hass, weil es weggeworfen wurde,
        soll es sich wieder in eine Plüschpuppe
        zurückverwandeln, wenn es sich geliebt fühlt.
      es: |-
        El rencor de haber sido tirado a la basura fue lo
        que le dio vida. Se dice que puede convertirse
        de nuevo en muñeco si se le trata con cariño.
      it: |-
        È stato generato dalla rabbia per essere stato
        buttato via. Si dice che se ci si prende cura di
        lui, tornerà a essere il peluche di un tempo.
