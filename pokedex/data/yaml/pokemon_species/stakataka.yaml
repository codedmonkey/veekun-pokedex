  flavor_text:
    ultra-sun:
      ja-Hrkt: |-
        ウルトラホールから　しゅつげんした。
        ふくすうの　せいめいが　つみあがり
        １ぴきを　けいせいしている　ようだ。
      ja: |-
        ウルトラホールから　出現した。
        複数の　生命が　積み上がり
        １匹を　形成している　ようだ。
      ko: |-
        울트라홀에서 출현했다.
        여러 개의 생명이 쌓여
        1마리를 형성하고 있는 듯하다.
      zh-Hant: |-
        從究極之洞中出現。
        似乎是由多數的生命
        堆積起來形成的個體。
      zh-Hans: |-
        从究极之洞里出现。
        好像是复数的生命累积起来，
        形成了１只。
      en: |-
        It appeared from an Ultra Wormhole. Each one
        appears to be made up of many life-forms
        stacked one on top of each other.
      fr: |-
        Il est sorti d’une Ultra-Brèche. Il est composé
        de plusieurs petites entités qui s’assemblent
        pour n’en former qu’une seule.
      de: |-
        Diese Kreatur kam durch eine Ultrapforte.
        Sie besteht anscheinend aus mehreren
        aufeinandergestapelten Wesen.
      es: |-
        Surgió de un Ultraumbral. Parece estar
        compuesto de varias criaturas que se han
        combinado para formar un solo ser.
      it: |-
        È arrivato attraverso un Ultravarco. Sembra
        essere costituito da più creature impilate che
        formano una singola unità.
    ultra-moon:
      ja-Hrkt: |-
        ＵＢらしき　なぞの　せいめいたい。
        とつぜん　うごきだして　おそってきた
        いしがきの　しょうたいは　こいつだ。
      ja: |-
        ＵＢらしき　謎の　生命体。
        突然　動き出して　襲ってきた
        石垣の　正体は　こいつだ。
      ko: |-
        UB 같은 수수께끼의 생명체.
        갑자기 움직이기 시작해서 덮쳐온
        돌담의 정체는 이 녀석이다.
      zh-Hant: |-
        疑似究極異獸的神秘生命體。
        突然動起來展開襲擊的石牆，
        它的真面目就是這個傢伙。
      zh-Hans: |-
        像是究极异兽的谜一般的生命体。
        突然动起来并展开袭击的石墙，
        正身就是这家伙。
      en: |-
        When stone walls started moving and attacking,
        the brute’s true identity was this mysterious
        life-form, which brings to mind an Ultra Beast.
      fr: |-
        On suppose que cette mystérieuse forme de vie
        est une Ultra-Chimère. Si un mur se met en
        branle et vous attaque sans prévenir, c’est lui.
      de: |-
        Diese rätselhafte Lebensform ist vermutlich eine
        Ultrabestie. Sie sieht aus wie eine Steinmauer,
        bis sie sich plötzlich bewegt und angreift.
      es: |-
        Extraña criatura que podría ser un Ultraente.
        Parece un muro rocoso hasta que se mueve de
        repente y ataca.
      it: |-
        Questa misteriosa forma di vita sembra essere
        un’Ultracreatura. Se all’improvviso un muro si
        muove e attacca, in realtà si tratta di lui.
