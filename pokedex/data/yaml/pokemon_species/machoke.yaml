machoke:
  base_happiness: 50
  capture_rate: 90
  color: gray
  egg_groups:
    - humanshape
  evolution_chain: machop
  evolves_from: machop
  flavor_text:
    red:
      en: |-
        Its muscular body
        is so powerful, it
        must wear a powersave belt to be
        able to regulate
        its motions.
    blue:
      en: |-
        Its muscular body
        is so powerful, it
        must wear a powersave belt to be
        able to regulate
        its motions.
    yellow:
      en: |-
        The belt around
        its waist holds
        back its energy.Without it, this
        POKéMON would be
        unstoppable.
    gold:
      en: |-
        It always goes at
        its full power,
        but this verytough and durable
        POKéMON never gets
        tired.
    silver:
      en: |-
        The muscles cover­
        ing its body teem
        with power. Evenwhen still, it
        exudes an amazing
        sense of strength.
    crystal:
      en: |-
        This tough POKéMON
        always stays in
        the zone. Itsmuscles become
        thicker after
        every battle.
    ruby:
      en: |-
        MACHOKE’s thoroughly toned muscles
        possess the hardness of steel.
        This POKéMON has so much strength,it can easily hold aloft a sumo wrestler
        on just one finger.
    sapphire:
      en: |-
        MACHOKE undertakes bodybuilding every
        day even as it helps people with tough,
        physically demanding labor.On its days off, this POKéMON heads to
        the fields and mountains to exercise
        and train.
    emerald:
      en: |-
        A belt is worn by a MACHOKE to keep its
        overwhelming power under control.
        Because it is so dangerous, no one has
        ever removed the belt.
    firered:
      en: |-
        Its formidable body never gets tired.
        It helps people by doing work such as
        the moving of heavy goods.
    leafgreen:
      en: |-
        Its muscular body is so powerful, it must
        wear a power-save belt to be able to
        regulate its motions.
    diamond:
      en: |-
        MACHOKE’s boundless power is very
        dangerous, so it wears a belt that
        suppresses its energy.
    pearl:
      en: |-
        It can lift a dump truck with one
        hand. Using that power, it helps
        people with heavy jobs.
    platinum:
      en: |-
        It happily carries heavy cargo to
        toughen up. It willingly does hard
        work for people.
    heartgold:
      en: |-
        It always goes at its full power,
        but this very tough and durable
        Pokémon never gets tired.
    soulsilver:
      en: |-
        The muscles covering its body teem
        with power. Even when still, it
        exudes an amazing sense of strength.
    black:
      en: |-
        It happily carries heavy cargo to
        toughen up. It willingly does hard
        work for people.
      fr: |-
        Il soulève les plus lourdes charges
        avec plaisir et facilité. Il donne un
        coup de main tout en s’entraînant!
    white:
      en: |-
        It happily carries heavy cargo to
        toughen up. It willingly does hard
        work for people.
      fr: |-
        Il soulève les plus lourdes charges
        avec plaisir et facilité. Il donne un
        coup de main tout en s’entraînant!
    black-2:
      en: |-
        It happily carries heavy cargo to
        toughen up. It willingly does hard
        work for people.
    white-2:
      en: |-
        It happily carries heavy cargo to
        toughen up. It willingly does hard
        work for people.
    x:
      ja-Hrkt: |-
        すごく　きょうじんな　にくたいなので
        パワーセーブ　ベルトを　つけて
        つよさを　せいぎょしている。
      ja: |-
        すごく　強靭な　肉体なので
        パワーセーブ　ベルトを　つけて
        強さを　制御している。
      ko: |-
        엄청나게 강한 육체를 지녔기 때문에
        파워 세이브 벨트를 차서
        힘을 제어하고 있다.
      en: |-
        Its muscular body is so powerful, it must wear a
        power-save belt to be able to regulate its motions.
      fr: |-
        Son corps est si puissant qu’il lui faut une ceinture
        de force pour équilibrer ses mouvements.
      de: |-
        Dieses Pokémon ist superstark. Es kann sich nur
        mit einem Kraft regulierenden Gürtel bewegen.
      es: |-
        Su musculoso cuerpo es tan fuerte que usa un cinto
        antifuerza para controlar sus movimientos.
      it: |-
        Il suo corpo muscoloso è così forte che usa una
        cintura antiforza per regolare i suoi movimenti.
    'y':
      ja-Hrkt: |-
        かたてで　ダンプカーを　もちあげる
        パワーを　いかして　ひとの　かわりに
        ちからしごとを　てつだう　ポケモン。
      ja: |-
        片手で　ダンプカーを　持ち上げる
        パワーを　活かして　人の　かわりに
        力仕事を　手伝う　ポケモン。
      ko: |-
        한 손으로 덤프트럭을 들어 올린다.
        파워를 살려서 사람 대신
        힘쓰는 일을 돕는 포켓몬이다.
      en: |-
        It can lift a dump truck with one hand. Using that
        power, it helps people with heavy jobs.
      fr: |-
        Il peut soulever un camion d’une main. Il se sert
        de sa force pour aider dans les tâches physiques.
      de: |-
        Es kann einen LKW mit einer Hand hochheben.
        Es nutzt die Kraft, um anderen bei der Arbeit zu helfen.
      es: |-
        Puede levantar un gran camión con una mano. Utiliza
        su fuerza para ayudar a la gente.
      it: |-
        È così forte da sollevare un autocarro con una sola
        mano. Aiuta le persone nei lavori pesanti.
    omega-ruby:
      ja-Hrkt: |-
        きたえあげた　きんにくは　はがねの　かたさ。
        すもうとりの　からだも　ゆび　１ぽんで　らくらく
        もちあげてしまう　かいりきの　ポケモンだ。
      ja: |-
        鍛えあげた　筋肉は　鋼の　硬さ。
        相撲取りの　体も　指　１本で　楽々
        持ちあげてしまう　怪力の　ポケモンだ。
      ko: |-
        잘 단련된 근육은 강철처럼 단단하다.
        씨름 선수의 몸을 손가락 1개로 쉽게
        들어 올릴 수 있는 괴력의 포켓몬이다.
      en: |-
        Machoke’s thoroughly toned muscles possess the hardness
        of steel. This Pokémon has so much strength, it can easily
        hold aloft a sumo wrestler on just one finger.
      fr: |-
        Les muscles toniques de Machopeur sont durs comme
        de l’acier. Ce Pokémon est si fort qu’il peut facilement
        soulever un sumo avec un seul doigt.
      de: |-
        Maschocks starke Muskeln sind so hart wie Stahl.
        Dieses Pokémon hat so viel Kraft, dass es mit nur
        einem Finger einen Sumo-Ringer in der Luft halten kann.
      es: |-
        Los entrenados músculos de Machoke son tan fuertes como el
        acero. Este Pokémon es tan fuerte que puede levantar con un
        solo dedo a un luchador de sumo.
      it: |-
        I muscoli perfettamente tonici di Machoke possiedono
        la durezza dell’acciaio. Questo Pokémon è così forte
        da riuscire a sollevare un lottatore di sumo con un dito.
    alpha-sapphire:
      ja-Hrkt: |-
        にんげんの　ちからしごとを　てつだいながら
        からだを　まいにち　きたえている　ポケモン。
        やすみの　ひには　のやまで　からだを　きたえる。
      ja: |-
        人間の　力仕事を　手伝いながら
        体を　毎日　鍛えている　ポケモン。
        休みの　日には　野山で　体を　鍛える。
      ko: |-
        힘이 많이 드는 인간의 일을 도와주며
        매일 몸을 단련하는 포켓몬이다.
        쉬는 날에는 산야에서 몸을 단련한다.
      en: |-
        Machoke undertakes bodybuilding every day even as
        it helps people with tough, physically demanding labor.
        On its days off, this Pokémon heads to the fields and
        mountains to exercise and train.
      fr: |-
        Machopeur pratique le body-building tous les jours,
        même lorsqu’il aide les gens à réaliser de durs travaux.
        Pendant ses congés, ce Pokémon va s’entraîner dans
        les champs et les montagnes.
      de: |-
        Maschock stählt seinen Körper jeden Tag, zum Beispiel
        indem es Menschen bei einer harten körperlichen Arbeit hilft.
        An seinen freien Tagen begibt es sich auf Felder und Berge,
        um zu trainieren.
      es: |-
        Machoke realiza sesiones de culturismo todos los días.
        De entrenamiento le sirven también las veces que ayuda a
        la gente en tareas de esfuerzo físico. En sus días libres, va
        al campo o a la montaña para hacer más ejercicio.
      it: |-
        Machoke si allena ogni giorno con esercizi di body building,
        aiutando l’uomo nei lavori fisicamente pesanti. Nei giorni
        di riposo, si reca in campagna o in montagna per allenarsi
        ancora.
    sun:
      ja-Hrkt: |-
        きたえにきたえた　けっか　すさまじい
        パワーを　てにいれた。　そのちからを
        いかし　ひとのしごとを　てつだう。
      ja: |-
        きたえにきたえた　結果　凄まじい
        パワーを　手にいれた。　その力を
        活かし　人の仕事を　手伝う。
      ko: |-
        단련하고 단련한 결과 무시무시한
        파워를 손에 넣었다. 그 힘을
        살려서 사람 일을 돕는다.
      zh-Hant: |-
        不斷鍛煉的成果就是
        獲得了非常驚人的力量。
        會靈活運用這股力量幫助人工作。
      zh-Hans: |-
        不断锻炼的结果就是
        拥有了非常惊人的力量。
        灵活运用这力量帮助人类工作。
      en: |-
        As a result of its continual workouts, it has
        developed tremendous power. It uses that
        power to help people with their work.
      fr: |-
        Grâce à un long entraînement, il a obtenu
        une force incroyable, qu’il met au service des
        humains pour les aider dans leurs travaux.
      de: |-
        Es hat sich durch unerbittliches Training
        unglaubliche Kräfte angeeignet, mit denen
        es die Menschen bei der Arbeit unterstützt.
      es: |-
        Posee una fuerza extraordinaria, obtenida a
        través de un tenaz entrenamiento. Utiliza su
        fuerza para ayudar a las personas.
      it: |-
        Grazie al costante allenamento fisico ha
        sviluppato una forza straordinaria, di cui si
        serve per aiutare gli uomini nel loro lavoro.
    moon:
      ja-Hrkt: |-
        すすんで　じゅうろうどうを　てつだう。
        じぶんに　とっての　いい　きんりょく
        トレーニングになると　しっているから。
      ja: |-
        進んで　重労働を　手伝う。
        自分に　とっての　いい　筋力
        トレーニングになると　知っているから。
      ko: |-
        자진해서 중노동을 돕는다.
        자신에게 좋은 근력 트레이닝이
        되는 것을 알기 때문이다.
      zh-Hant: |-
        會積極地幫忙做重體力勞動，
        因為牠知道這對自己來說
        是很好的肌肉鍛鍊方法。
      zh-Hans: |-
        积极地帮忙做重体力劳动，
        因为知道这会成为对自己
        有用的肌肉锻炼。
      en: |-
        It willingly assists with hard labor because it
        knows the work is good training for its muscles.
      fr: |-
        Il aide les humains dans les travaux de force.
        Il n’y a aucun scrupule à avoir, car il est ravi
        de pouvoir faire travailler ses muscles.
      de: |-
        Es bietet freiwillig seine Hilfe bei körperlicher
        Schwerstarbeit an, da es weiß, dass dies eine
        sehr effektive Form des Muskeltrainings ist.
      es: |-
        Ayuda a las personas cuyos trabajos requieren
        mucha fuerza, ya que esto le sirve de
        entrenamiento para fortalecer sus músculos.
      it: |-
        È sempre disponibile ad aiutare nei lavori
        pesanti, considerandoli un allenamento
        per accrescere la sua forza muscolare.
    ultra-sun:
      ja-Hrkt: |-
        しんの　きょうてきに　であうと
        こしの　パワーセーブ　ベルトを
        はずして　ぜんりょくを　はっきする。
      ja: |-
        真の　強敵に　出会うと
        腰の　パワーセーブ　ベルトを
        外して　全力を　発揮する。
      ko: |-
        진정한 강적을 만나면
        허리의 파워 세이브 벨트를
        풀고 전력을 발휘한다.
      zh-Hant: |-
        當遇上真正的強敵時，
        會解開限制力量的腰帶
        來使出全力。
      zh-Hans: |-
        如果遇到了真正的强敌，
        就会解开腰上的力量限制腰带，
        并使出全力。
      en: |-
        When it encounters an enemy that’s truly
        mighty, this Pokémon removes the power-save
        belt from its waist and unleashes its full power.
      fr: |-
        Quand il rencontre un adversaire vraiment
        redoutable, il retire sa ceinture de force
        et déchaîne toute sa puissance.
      de: |-
        Trifft es auf einen wahrhaft starken Gegner,
        nimmt es seinen kraftregulierenden Gürtel ab,
        um seine volle Stärke entfalten zu können.
      es: |-
        Cuando encuentra un rival realmente formidable,
        se quita el cinturón que restringe su energía y
        combate con todas sus fuerzas.
      it: |-
        Quando incontra un nemico davvero formidabile,
        si toglie la cintura che usa per contenere la sua
        forza e scatena tutta la sua potenza.
    ultra-moon:
      ja-Hrkt: |-
        ちょうこくの　モチーフとして　にんき。
        きたえぬかれた　きんにくが　おおくの
        げいじゅつかを　とりこに　している。
      ja: |-
        彫刻の　モチーフとして　人気。
        鍛えぬかれた　筋肉が　多くの
        芸術家を　虜に　している。
      ko: |-
        조각의 모티브로 인기 있다.
        잘 단련된 근육이 많은
        예술가들을 사로잡는다.
      zh-Hant: |-
        是很受歡迎的雕刻主題。
        經過千錘百煉的肌肉
        讓許多藝術家為之著迷。
      zh-Hans: |-
        作为雕刻的主题很受欢迎。
        锻炼到极致的肌肉俘获了
        很多艺术家的心。
      en: |-
        A popular motif for sculptures, its incredibly
        well-developed muscles have captured the
        imagination of many an artist.
      fr: |-
        C’est un modèle très en vogue chez les
        sculpteurs. De nombreux artistes ne jurent
        que par sa musculature parfaite.
      de: |-
        Es gilt als beliebtes Motiv in der Bildhauerei.
        Seinen wohlgeformten, stählernen Muskeln sind
        nicht wenige Künstler verfallen.
      es: |-
        Su escultural figura lo convierte en un modelo
        ideal para artistas del cincel, a los que su
        perfecta musculatura embelesa sin remisión.
      it: |-
        Gli artisti sono rapiti dalla perfezione dei suoi
        muscoli ben sviluppati e spesso lo scelgono
        come soggetto delle loro sculture.
    lets-go-pikachu:
      ja-Hrkt: |-
        こしにまいた　パワーセーブベルトを
        はずした　ゴーリキーの　いきおいを
        とめることは　だれにも　ふかのうだ。
      ja: |-
        腰にまいた　パワーセーブベルトを
        外した　ゴーリキーの　勢いを
        止めることは　誰にも　不可能だ。
      ko: |-
        허리에 두른 파워 세이브 벨트를
        풀면 그 누구도 근육몬의
        기세를 막을 수 없다.
      zh-Hant: |-
        當腰上那條限制力量的
        腰帶解開時，豪力的氣勢
        將會變得無人能擋。
      zh-Hans: |-
        只要解开系在腰上的
        限制它力量的腰带，
        豪力就会变得势不可挡。
      en: |-
        The belt around its waist holds back its energy.
        Without it, this Pokémon would be unstoppable.
      fr: |-
        Sa ceinture sert à retenir son énergie. Sans elle,
        il serait incontrôlable.
      de: |-
        Der Gürtel an seiner Hüfte dient dazu, seine
        Kraft zu begrenzen. Ohne ihn wäre Maschock
        nicht zu bändigen.
      es: |-
        El cinto antifuerza que lleva puesto limita sus
        movimientos. Sin él, resultaría imparable.
      it: |-
        La cintura che porta attorno alla vita serve
        a contenere la sua energia. Senza di essa
        sarebbe inarrestabile.
    lets-go-eevee:
      ja-Hrkt: |-
        こしにまいた　パワーセーブベルトを
        はずした　ゴーリキーの　いきおいを
        とめることは　だれにも　ふかのうだ。
      ja: |-
        腰にまいた　パワーセーブベルトを
        外した　ゴーリキーの　勢いを
        止めることは　誰にも　不可能だ。
      ko: |-
        허리에 두른 파워 세이브 벨트를
        풀면 그 누구도 근육몬의
        기세를 막을 수 없다.
      zh-Hant: |-
        當腰上那條限制力量的
        腰帶解開時，豪力的氣勢
        將會變得無人能擋。
      zh-Hans: |-
        只要解开系在腰上的
        限制它力量的腰带，
        豪力就会变得势不可挡。
      en: |-
        The belt around its waist holds back its energy.
        Without it, this Pokémon would be unstoppable.
      fr: |-
        Sa ceinture sert à retenir son énergie. Sans elle,
        il serait incontrôlable.
      de: |-
        Der Gürtel an seiner Hüfte dient dazu, seine
        Kraft zu begrenzen. Ohne ihn wäre Maschock
        nicht zu bändigen.
      es: |-
        El cinto antifuerza que lleva puesto limita sus
        movimientos. Sin él, resultaría imparable.
      it: |-
        La cintura che porta attorno alla vita serve
        a contenere la sua energia. Senza di essa
        sarebbe inarrestabile.
    sword:
      ja-Hrkt: |-
        すごく　きょうじんな　にくたいなので
        パワーセーブ　ベルトを　つけて
        つよさを　せいぎょしている。
      ja: |-
        すごく　強靭な　肉体なので
        パワーセーブ　ベルトを　つけて
        強さを　制御している。
      ko: |-
        엄청나게 강한 육체를 지녔기 때문에
        파워 세이브 벨트를 차서
        힘을 제어하고 있다.
      zh-Hant: |-
        因為肉體非常強韌，
        所以戴著力量限制腰帶
        來控制力量。
      zh-Hans: |-
        因为肉体非常强韧，
        所以戴着力量限制腰带
        来控制力量。
      en: |-
        Its muscular body is so powerful, it must wear a
        power-save belt to be able to regulate
        its motions.
      fr: |-
        Son corps est si puissant qu’il lui faut une ceinture
        pour maîtriser sa force.
      de: |-
        Dieses Pokémon ist superstark. Es kann sich nur
        mit einem kraftregulierenden Gürtel bewegen.
      es: |-
        Su musculoso cuerpo es tan fuerte que usa un
        cinto antifuerza para controlar sus movimientos.
      it: |-
        Il suo corpo muscoloso è così forte che usa
        una cintura per contenere la sua potenza.
    shield:
      ja-Hrkt: |-
        つかれることのない　きょうじんな
        にくたいを　もつ。　おもい　にもつの
        うんぱんなどの　しごとを　てつだう。
      ja: |-
        疲れることのない　強靭な
        肉体を　もつ。　重い　荷物の
        運搬などの　仕事を　手伝う。
      ko: |-
        지치지 않는 강인한
        육체를 가졌다. 무거운 물건을
        옮기는 등의 일을 돕는다.
      zh-Hant: |-
        有著不會疲勞的強韌肉體。
        會去幫助人類完成例如
        搬運沉重行李之類的工作。
      zh-Hans: |-
        有着不会疲劳的强韧肉体。
        会去帮助人类完成例如
        搬运沉重行李之类的工作。
      en: |-
        Its formidable body never gets tired. It helps
        people by doing work such as the moving of
        heavy goods.
      fr: |-
        Son corps robuste ne se fatigue jamais.
        Il n’hésite pas à aider les gens lorsqu’il s’agit
        de soulever des objets très lourds.
      de: |-
        Sein durchtrainierter Körper wird nie müde.
        Es hilft den Menschen, indem es schwere
        Sachen trägt.
      es: |-
        Tiene una complexión tan fuerte que nunca se
        cansa. Suele ayudar a la gente a cargar objetos
        pesados.
      it: |-
        Ha un fisico vigoroso e instancabile. Aiuta
        le persone a trasportare carichi e a svolgere
        altri lavori pesanti.
