greninja:
  base_happiness: 70
  capture_rate: 45
  color: blue
  egg_groups:
    - water1
  evolution_chain: froakie
  evolves_from: frogadier
  flavor_text:
    x:
      ja-Hrkt: |-
        みずを　あっしゅくして　しゅりけんを
        つくりだす。こうそくかいてんさせて
        とばすと　きんぞくも　まっぷたつ。
      ja: |-
        水を　圧縮して　手裏剣を　作り出す。
        高速回転させて　飛ばすと
        金属も　真っ二つ。
      ko: |-
        물을 압축시켜 수리검을
        만들어 낸다. 고속으로 회전시키며
        던지면 금속도 두 동강이 난다.
      en: |-
        It creates throwing stars out of compressed water.
        When it spins them and throws them at high speed,
        these stars can split metal in two.
      fr: |-
        Il transforme des jets d’eau sous pression
        en redoutables shuriken. Une fois lancés, ils tournent
        si vite qu’ils peuvent même couper le métal.
      de: |-
        Es stellt Wurfsterne aus komprimiertem Wasser
        her, die durch ihre hohe Drehgeschwindigkeit
        beim Werfen sogar Metall durchtrennen.
      es: |-
        Comprime el agua y crea estrellas ninja con las que
        ataca al enemigo. Cuando las hace girar a gran
        velocidad cortan en dos hasta el metal.
      it: |-
        Crea lame d’acqua micidiali che ruotano
        ad alta velocità e, se lanciate, possono perforare
        il metallo.
    'y':
      ja-Hrkt: |-
        にんじゃのように　しんしゅつきぼつ。
        すばやい　うごきで　ほんろうしつつ
        みずの　しゅりけんで　きりさく。
      ja: |-
        忍者のように　神出鬼没。
        素早い　動きで　翻弄しつつ
        水の　手裏剣で　切り裂く。
      ko: |-
        닌자처럼 신출귀몰하다.
        재빠른 움직임으로 상대를 농락하면서
        물의 수리검으로 벤다.
      en: |-
        It appears and vanishes with a ninja’s grace.
        It toys with its enemies using swift movements, while
        slicing them with throwing stars of sharpest water.
      fr: |-
        Aussi insaisissable qu’un ninja, il se joue de
        ses ennemis grâce à sa célérité, et les tranche
        de ses Sheauriken.
      de: |-
        Kaum hat man es erspäht, verschwindet es auch schon
        wieder. Mit der Agilität eines Ninjas verwirrt es seine
        Gegner, um sie dann mit Wasser-Shuriken anzugreifen.
      es: |-
        Aparece y desaparece de improvisto, cual ninja. Marea
        al oponente con su soberbia agilidad y lo hace trizas
        con sus Shuriken de Agua.
      it: |-
        Agile e sfuggente come un ninja, si fa beffe dei nemici
        grazie alla sua velocità e li bersaglia di shuriken
        d’acqua.
