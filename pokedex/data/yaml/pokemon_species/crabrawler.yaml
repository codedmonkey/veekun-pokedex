crabrawler:
  base_happiness: 70
  capture_rate: 225
  color: purple
  egg_groups:
    - water3
  evolution_chain: crabrawler
  evolves_from: ~
  flavor_text:
    sun:
      ja-Hrkt: |-
        ハサミで　じゃくてんを　ガードしつつ
        スキを　うかがい　パンチを　はなつ。
        まけたほうは　アワを　ふいて　ダウン。
      ja: |-
        ハサミで　弱点を　ガードしつつ
        隙を　うかがい　パンチを　放つ。
        負けたほうは　泡を　ふいて　ダウン。
      ko: |-
        가위로 약점을 가드 하면서
        틈을 노려 펀치를 날린다.
        진 쪽은 거품을 물고 다운된다.
      zh-Hant: |-
        用鉗子保護自己的弱點，
        同時等候時機出拳。
        輸了的話會吐著泡泡倒下。
      zh-Hans: |-
        用钳子保护自己的弱点，
        同时伺机出拳。
        输了的话会吐泡泡倒下。
      en: |-
        While guarding its weak points with its pincers,
        it looks for an opening and unleashes punches.
        When it loses, it foams at the mouth and faints.
      fr: |-
        Il protège ses points faibles avec ses pinces en
        guettant le moment propice pour riposter.
        Il crache de l’écume lorsqu’il tombe K.O.
      de: |-
        Schützt mit den Scheren seine Schwachstellen
        und bereitet einen Gegenschlag vor. Verliert es,
        bläst es Trübsal.
      es: |-
        Protege sus puntos débiles con las pinzas y
        propina puñetazos en cuanto tiene ocasión.
        Cuando pierde, llora lágrimas espumosas.
      it: |-
        Protegge con le chele i propri punti deboli e, al
        momento opportuno, contrattacca con potenti
        pugni. Quando perde, crolla schiumante al suolo.
    moon:
      ja-Hrkt: |-
        なぐりすぎで　ハサミは　よく　もげるが
        すぐに　はえる。　ハサミの　なかみは
        すくないが　コクがあって　うまいぞ。
      ja: |-
        なぐり過ぎで　ハサミは　よく　もげるが
        すぐに　生える。　ハサミの　中味は
        少ないが　コクがあって　うまいぞ。
      ko: |-
        심하게 때려서 집게는 잘 떨어지지만
        바로 자란다. 집게 속살은
        적지만 풍미가 있고 맛있다.
      zh-Hant: |-
        因為常常打架，鉗子經常掉落，
        不過很快又會長出來。鉗子裡的肉很少，
        但味道濃郁且非常美味。
      zh-Hans: |-
        因为打架太频繁，钳子常常掉落，
        但很快又会长出来。钳子里的肉很少，
        但味道浓郁非常鲜美。
      en: |-
        It punches so much, its pincers often come off
        from overuse, but they grow back quickly. What
        little meat they contain is rich and delicious.
      fr: |-
        Ses pinces se décrochent lorsqu’il s’en sert trop
        pour frapper, mais repoussent heureusement
        aussitôt. Leur chair est fine et délicieuse.
      de: |-
        Es verliert oft seine Scheren im Kampf, aber sie
        wachsen schnell nach. Obwohl diese nur wenig
        Fleisch enthalten, gelten sie als Delikatesse.
      es: |-
        Suele perder las pinzas por usarlas demasiado,
        pero enseguida le vuelven a crecer. Estas tienen
        poca carne, pero es muy apreciada.
      it: |-
        A furia di sferrare pugni, le chele gli si
        staccano, ma ricrescono sempre. La polpa al loro
        interno è poca, ma molto saporita.
    ultra-sun:
      ja-Hrkt: |-
        かたい　ハサミは　せめも　まもりも
        とくい。　マケンカニ　どうしの
        たたかいは　ボクシングの　ようだ。
      ja: |-
        硬い　ハサミは　攻めも　守りも
        得意。　マケンカニ　同士の
        戦いは　ボクシングの　ようだ。
      ko: |-
        딱딱한 집게는 공격과 수비에
        모두 능하다. 오기지게끼리의
        싸움은 복싱 같다.
      zh-Hant: |-
        堅硬的鉗子攻守皆宜。
        好勝蟹與好勝蟹之間的戰鬥
        就像是拳擊賽一樣。
      zh-Hans: |-
        坚硬的钳子攻守皆宜。
        好胜蟹同类之间的战斗
        就像是拳击一样。
      en: |-
        Its hard pincers are well suited to both offense
        and defense. Fights between two Crabrawler
        are like boxing matches.
      fr: |-
        Ses robustes pinces sont aussi efficaces pour
        l’attaque que pour la défense. Les combats de
        Crabagarre ressemblent à des matchs de boxe.
      de: |-
        Seine harten Scheren eignen sich sowohl für
        offensive als auch defensive Techniken. Kämpfe
        zwischen zwei Krabbox ähneln Boxkämpfen.
      es: |-
        Usa hábilmente sus robustas pinzas tanto para
        atacar como para defenderse. Las peleas entre
        congéneres parecen combates de boxeo.
      it: |-
        Utilizza le robuste chele sia per attaccare
        che per difendersi. Le lotte tra Crabrawler
        assomigliano molto a incontri di boxe.
    ultra-moon:
      ja-Hrkt: |-
        ヤシのきと　まちがえて　ナッシーに
        のぼることもある。　いかりを　かって
        ふりおとされて　ふみつけられる。
      ja: |-
        ヤシの木と　間違えて　ナッシーに
        登ることもある。　怒りを　かって
        振り落とされて　踏みつけられる。
      ko: |-
        야자나무로 착각하고 나시에
        오르는 일도 있다. 분노를 사
        내동댕이쳐진 다음 짓밟힌다.
      zh-Hant: |-
        有時會錯把椰蛋樹當成椰子樹
        而爬上去。惹怒椰蛋樹的牠會被
        甩下來並遭到踩踏。
      zh-Hans: |-
        有时会把椰蛋树错认为椰子树
        而爬上去。惹怒椰蛋树后
        被抖落下来，并遭到踩踏。
      en: |-
        Crabrawler has been known to mistake
        Exeggutor for a coconut tree and climb it. The
        enraged Exeggutor shakes it off and stomps it.
      fr: |-
        Il grimpe parfois sur un Noadkoko qu’il a pris
        pour un cocotier. Il se fait alors éjecter puis
        piétiner par le Noadkoko courroucé.
      de: |-
        Manchmal hält es ein Kokowei für eine Palme
        und klettert es hinauf. Dieses schüttelt es dann
        wütend ab und verpasst ihm einen Tritt.
      es: |-
        A veces trepa por Exeggutor al confundirlo con
        una palmera de verdad. Este, presa de la ira, se
        desembaraza de él a sacudidas y lo pisotea.
      it: |-
        A volte si arrampica sugli Exeggutor, prendendoli
        per vere palme. Per tutta risposta, questi si
        adirano, lo scaraventano a terra e lo calpestano.
