  flavor_text:
    black:
      en: |-
        The water stored inside the tuft on
        its head is full of nutrients. Plants
        that receive its water grow large.
      fr: |-
        L’eau contenue dans la mèche sur sa
        tête est pleine de nutriments. Elle fait
        pousser les plantes avec vigueur.
    white:
      en: |-
        It does not thrive in dry environments.
        It keeps itself damp by shooting water
        stored in its head tuft from its tail.
      fr: |-
        Il supporte mal les environnements secs.
        Il s’humidifie avec sa queue en aspirant
        l’eau stockée dans la mèche sur sa tête.
    black-2:
      en: |-
        The water stored inside the tuft
        on its head is full of nutrients.
        It waters plants with it using its tail.
    white-2:
      en: |-
        The water stored inside the tuft
        on its head is full of nutrients.
        It waters plants with it using its tail.
    x:
      ja-Hrkt: |-
        あたまのふさに　ためこんだ　みずは
        えいよう　たっぷり。しっぽをつかって
        その　みずを　くさきに　かけている。
      ja: |-
        頭の房に　ためこんだ　水は
        栄養　たっぷり。尻尾を使って
        その　水を　草木に　かけている。
      ko: |-
        머리 송아리에 모은 물은
        영양 듬뿍. 꼬리를 사용해서
        그 물을 초목에 뿌린다.
      en: |-
        The water stored inside the tuft on its head is full
        of nutrients. It waters plants with it using its tail.
      fr: |-
        Sa houppette est chargée d’eau et de nutriments.
        Il nourrit les plantes et les arbres avec sa queue.
      de: |-
        Das Büschel auf seinem Kopf enthält eine sehr
        nahrhafte Flüssigkeit, mit der es über seinen
        Schweif Pflanzen wässert.
      es: |-
        El agua acumulada en su mata de pelo es rica en
        nutrientes. Usa su cola para regar plantas con esa
        misma agua.
      it: |-
        L’acqua contenuta nel suo ciuffo è ricca di nutrienti
        e la usa per annaffiare le piante con la coda.
