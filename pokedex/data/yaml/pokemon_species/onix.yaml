    sword:
      ja-Hrkt: |-
        ちちゅうを　ほりすすみながら
        いろんな　かたいものを　とりこみ
        がんじょうな　からだをつくる。
      ja: |-
        地中を　掘り進みながら
        いろんな　硬いものを　取り込み
        頑丈な　体をつくる。
      ko: |-
        땅속을 파고들면서 여러 가지
        단단한 것들을 집어삼켜서
        튼튼한 몸을 만든다.
      zh-Hant: |-
        會一邊在地底挖掘前進，
        一邊吸收各種堅硬的物體，
        藉此讓身體變得更加結實。
      zh-Hans: |-
        会一边在地里挖掘前进，
        一边吸收各种坚硬的物体，
        以此让身体变得更加结实。
      en: |-
        As it digs through the ground, it absorbs many
        hard objects. This is what makes its body so solid.
      fr: |-
        Il absorbe des éléments solides en creusant le sol,
        ce qui le rend plus robuste.
      de: |-
        Wenn es sich durch die Erde gräbt, nimmt es
        viele harte Gegenstände auf, die seinen Körper
        erhärten.
      es: |-
        Al abrirse paso bajo tierra, va absorbiendo todo
        lo que encuentra. Eso hace que su cuerpo sea
        así de sólido.
      it: |-
        Scava nel terreno assorbendo gli oggetti più duri
        per irrobustire il suo corpo.
    shield:
      ja-Hrkt: |-
        おおきく　じょうぶな　からだを
        くねらせ　よじらせ　じそく８０キロで
        じめんを　いきおいよく　ほりすすむ。
      ja: |-
        大きく　丈夫な　体を
        くねらせ　よじらせ　時速８０キロで
        地面を　勢いよく　掘り進む。
      ko: |-
        크고 튼튼한 몸을
        뒤틀고 꼬아서 시속 80km로
        힘차게 땅을 파나간다.
      zh-Hant: |-
        彎曲扭動巨大結實的身體，
        以時速８０公里的
        猛烈勢頭挖掘前進。
      zh-Hans: |-
        弯曲扭动巨大结实的身体，
        以时速８０公里的
        猛烈劲头向前挖进。
      en: |-
        It rapidly bores through the ground at 50 mph by
        squirming and twisting its massive, rugged body.
      fr: |-
        Il creuse dans le sol à une vitesse de 80 km/h
        en contorsionnant son immense corps de pierre.
      de: |-
        Es bohrt sich mit 80 km/h durch das Erdreich,
        indem es seinen massiven, rauen Körper dreht
        und windet.
      es: |-
        Perfora el suelo a una velocidad de 80 km/h
        girando y retorciendo su robusto y enorme
        cuerpo.
      it: |-
        Scava nel terreno a una velocità di 80 km/h
        contorcendo e agitando il corpo grande
        e possente.
    legends-arceus:
      en: |-
        This chain of immense stones resembles a giant serpent. Tremors
        shake the earth above as it burrows deep beneath the ground,
        feeding on boulders as it goes.
