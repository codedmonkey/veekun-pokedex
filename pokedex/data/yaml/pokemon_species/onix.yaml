    sapphire:
      en: |-
        ONIX has a magnet in its brain. It acts
        as a compass so that this POKéMON does
        not lose direction while it is tunneling.As it grows older, its body becomes
        increasingly rounder and smoother.
    emerald:
      en: |-
        There is a magnet in its brain that
        prevents an ONIX from losing direction
        while tunneling. As it grows older, its body
        becomes steadily rounder and smoother.
    firered:
      en: |-
        It usually lives underground. It searches
        for food while boring its way through the
        ground at 50 miles per hour.
    leafgreen:
      en: |-
        As it grows, the stone portions of its
        body harden to become similar to
        black-colored diamonds.
    diamond:
      en: |-
        When it travels underground, it
        causes rumbling and tremors.
        It can move at 50 mph.
    pearl:
      en: |-
        It squirms through the ground
        using its long and rugged body.
        It always eats while burrowing.
    platinum:
      en: |
        It burrows through the ground
        at a speed of 50 mph while
        feeding on large boulders.
    heartgold:
      en: |-
        It twists and squirms through
        the ground. The thunderous roar of
        its tunneling echoes a long way.
    soulsilver:
      en: |-
        It rapidly bores through the ground
        at 50 mph by squirming and
        twisting its massive, rugged body.
    black:
      en: |-
        It burrows through the ground
        at a speed of 50 mph while
        feeding on large boulders.
      fr: |-
        Il se nourrit des pierres qu’il
        rencontre en creusant le sol.
        Il peut creuser à 80 km/h!
    white:
      en: |-
        It burrows through the ground
        at a speed of 50 mph while
        feeding on large boulders.
      fr: |-
        Il se nourrit des pierres qu’il
        rencontre en creusant le sol.
        Il peut creuser à 80 km/h!
    black-2:
      en: |-
        Opening its large mouth, it ingests
        massive amounts of soil and creates
        long tunnels.
    white-2:
      en: |-
        Opening its large mouth, it ingests
        massive amounts of soil and creates
        long tunnels.
    x:
      ja-Hrkt: |-
        ちちゅうを　ものすごい　いきおいで
        ほりすすみ　エサを　さがす。とおった
        あとは　ディグダの　すみかになる。
      ja: |-
        地中を　ものすごい　勢いで
        掘りすすみ　エサを　探す。通った
        跡は　ディグダの　住処になる。
      ko: |-
        땅속을 엄청난 기세로
        뚫고 나아가며 먹이를 찾는다. 지나간
        곳은 디그다의 보금자리가 된다.
      en: |-
        Burrows at high speed in search of food.
        The tunnels it leaves are used as homes
        by Diglett.
      fr: |-
        Il creuse sous terre en quête de nourriture.
        Ses tunnels servent de maison aux Taupiqueur.
      de: |-
        Dieses Pokémon gräbt auf seiner Suche nach Futter
        lange Tunnel, in denen sich später Digda einnisten.
      es: |-
        Cava a gran velocidad en busca de comida. Los
        túneles que deja son usados por los Diglett.
      it: |-
        Scava veloce nel terreno in cerca di cibo lasciando
        lunghi cunicoli usati poi come casa dai Diglett.
    'y':
      ja-Hrkt: |-
        ふだんは　つちのなかに　すんでいる。
        ちちゅうを　じそく　８０キロで
        ほりながら　エサを　さがす。
      ja: |-
        普段は　土の中に　住んでいる。
        地中を　時速８０キロで
        掘りながら　エサを　探す。
      ko: |-
        평상시에는 땅속에 살고 있다.
        땅속을 시속 80km로
        파면서 먹이를 찾는다.
      en: |-
        It usually lives underground. It searches for food
        while boring its way through the ground at 50 miles
        per hour.
      fr: |-
        Onix vit généralement sous terre. Il cherche de
        la nourriture en creusant à plus de 80 km/h.
      de: |-
        Es lebt gewöhnlich unter der Erde. Während es sich
        mit 80 km/h durchs Erdreich bohrt, sucht es nach
        Nahrung.
      es: |-
        Suele vivir bajo tierra. Va buscando comida a medida
        que se va abriendo camino a 80 km por hora.
      it: |-
        Di solito vive sottoterra. Cerca cibo scavando
        cunicoli nel terreno alla velocità di 80 km/h.
    omega-ruby:
      ja-Hrkt: |-
        のうみそに　じしゃくが　あるので　つちの　なかを
        ほり　すすんでいても　ほうこうを　まちがえない。
        としを　とるほど　からだは　まるみを　おびる。
      ja: |-
        脳みそに　磁石が　あるので　土の　中を
        掘り　進んでいても　方向を　間違えない。
        歳を　取るほど　体は　丸みを　帯びる。
      ko: |-
        뇌에 자석이 있어서 땅속을
        파고 나가도 방향을 틀리지 않는다.
        나이를 먹을수록 몸이 둥그스름해진다.
      en: |-
        Onix has a magnet in its brain. It acts as a compass so that this
        Pokémon does not lose direction while it is tunneling.
        As it grows older, its body becomes increasingly rounder
        and smoother.
      fr: |-
        Onix a dans le cerveau un aimant qui lui sert de boussole.
        Il permet à ce Pokémon de ne pas se perdre pendant
        qu’il creuse. En prenant de l’âge, son corps s’arrondit
        et se polit.
      de: |-
        Onix hat einen Magneten in seinem Gehirn. Er dient ihm
        als Kompass, sodass es beim Graben von Tunneln nicht
        die Orientierung verliert. Wenn es älter wird, wird sein
        Körper immer runder und glatter.
      es: |-
        Onix tiene un imán en el cerebro, que actúa como una brújula
        para no perder la orientación cuando está cavando túneles.
        A medida que crece, se le redondea y suaviza el cuerpo.
      it: |-
        Onix nel cervello ha una calamita, che agisce da bussola
        per consentirgli di non perdere l’orientamento mentre
        scava sottoterra. Con il passare del tempo il suo corpo
        diventa sempre più smussato e levigato.
    alpha-sapphire:
      ja-Hrkt: |-
        のうみそに　じしゃくが　あるので　つちの　なかを
