    lets-go-pikachu:
      ja-Hrkt: |-
        ちちゅうを　ものすごい　いきおいで
        ほりすすみ　エサを　さがす。とおった
        あとは　ディグダの　すみかになる。
      ja: |-
        地中を　ものすごい　勢いで
        掘り進み　エサを　探す。通った
        跡は　ディグダの　住みかになる。
      ko: |-
        땅속을 엄청난 기세로
        뚫고 나아가며 먹이를 찾는다. 지나간
        곳은 디그다의 보금자리가 된다.
      zh-Hant: |-
        會以驚人的氣勢在地底下
        鑽洞尋找獵物。經過後留下的
        隧道會成為地鼠的巢穴。
      zh-Hans: |-
        以惊人之势钻地觅食。在它
        通过之后形成的洞穴会
        被地鼠们当作自己的住处。
      en: |-
        Burrows at high speed in search of food.
        The tunnels it leaves are used as homes
        by Diglett.
      fr: |-
        Il creuse la terre à toute allure en quête de
        nourriture. Ses tunnels servent de maison
        aux Taupiqueur.
      de: |-
        Es gräbt auf seiner Suche nach Futter mit
        irrsinniger Geschwindigkeit lange Tunnel,
        in denen sich später Digda einnisten.
      es: |-
        Cava a gran velocidad en busca de comida.
        Los Diglett convierten en su hogar los túneles
        que deja a su paso.
      it: |-
        Scava nel terreno con incredibile vigore in cerca
        di cibo, creando cunicoli usati poi come tana
        dai Diglett.
