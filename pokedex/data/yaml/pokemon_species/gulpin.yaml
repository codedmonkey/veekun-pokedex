    white-2:
      en: |-
        Almost all its body is its stomach.
        Its harsh digestive juices quickly
        dissolve anything it swallows.
    x:
      ja-Hrkt: |-
        しんぞうや　のうみそは　ちいさく
        からだの　だいぶぶんが　いぶくろ。
        なんでも　とかす　いえきを　だす。
      ja: |-
        心臓や　脳みそは　小さく
        体の　大部分が　胃袋。
        なんでも　溶かす　胃液を　出す。
      ko: |-
        심장과 뇌가 작고
        몸 대부분이 위다.
        무엇이든 녹이는 위액을 낸다.
      en: |-
        It has a small heart and brain. Its stomach
        comprises most of its body, with enzymes to
        dissolve anything.
      fr: |-
        Son corps est principalement constitué d’un estomac
        dont les sucs digestifs dissolvent tout.
      de: |-
        Sein Körper besteht fast nur aus Magen. Herz und
        Hirn sind winzig. Sein Magensaft verdaut alles.
      es: |-
        Sus sesos y corazón son diminutos; es casi todo
        estómago. Sus jugos gástricos disuelven lo que sea.
      it: |-
        Ha cuore e cervello mini: lo stomaco prende troppo
        spazio! Con i succhi gastrici scioglie qualunque cosa.
    'y':
      ja-Hrkt: |-
        なんでも　しょうかする　いぶくろ。
        しょうかする　ときに　はっせいする
        ガスは　きょうれつな　あくしゅうだ。
      ja: |-
        なんでも　消化する　胃袋。
        消化する　ときに　発生する　ガスは
        強烈な　悪臭だ。
      ko: |-
        무엇이든 소화하는 위다.
        소화할 때 발생하는
        가스는 강렬한 악취가 난다.
      en: |-
        There is nothing its stomach can’t digest. While it is
        digesting, vile, overpowering gases are expelled.
      fr: |-
        Il n’y a rien que son estomac ne puisse digérer.
        Pendant sa digestion, il laisse s’échapper des gaz très
        bruyants et nauséabonds.
      de: |-
        Es gibt nichts, das sein Magen nicht verdauen könnte.
        Während des Verdauungsvorgangs werden eklige,
        penetrante Gase freigesetzt.
      es: |-
        Es capaz de digerir cualquier cosa. Para hacer la
        digestión, se ayuda de un fluido y un gas capaces
        de corroerlo todo.
      it: |-
        Non c’è nulla che il suo stomaco non possa digerire.
        Durante la digestione espelle gas insopportabilmente
        fetidi.
    omega-ruby:
      ja-Hrkt: |-
        からだの　ほとんどが　いぶくろで　できているので
        じぶんと　おなじ　おおきさの　ものも　のみこむ。
        とくしゅな　いえきで　なんでも　しょうかするぞ。
      ja: |-
        体の　ほとんどが　胃袋で　できているので
        自分と　同じ　大きさの　ものも　のみ込む。
        特殊な　胃液で　なんでも　消化するぞ。
      ko: |-
        몸 대부분이 위로 되어 있어
        자신과 크기가 같은 것도 삼킨다.
        특수한 위액으로 무엇이든 소화한다.
      en: |-
        Virtually all of Gulpin’s body is its stomach. As a result, it can
        swallow something its own size. This Pokémon’s stomach
        contains a special fluid that digests anything.
      fr: |-
        Virtuellement, le corps de Gloupti n’est qu’un estomac.
        Il est capable d’avaler des objets aussi gros que lui.
        L’estomac de ce Pokémon contient un fluide spécial
        qui lui permet de digérer n’importe quoi.
      de: |-
        Eigentlich besteht Schluppucks Körper nur aus einem Magen.
        Daher kann es etwas verschlingen, das beinahe seine Größe
        hat. Sein Magen enthält eine spezielle Flüssigkeit, die wirklich
        alles verdauen kann.
      es: |-
        Casi la totalidad del cuerpo de Gulpin está compuesto por el
        estómago. Por eso, puede tragarse todo lo que tenga su
        tamaño. En el interior del estómago tiene un fluido capaz de
        corroerlo todo.
      it: |-
        Praticamente l’intero corpo di Gulpin è costituito
        dallo stomaco, che gli consente di ingoiare oggetti delle
        sue stesse dimensioni. Inoltre, il suo stomaco contiene
        un fluido speciale in grado di fargli digerire ogni cosa.
    alpha-sapphire:
      ja-Hrkt: |-
        からだの　だいぶぶんが　いぶくろで　できていて
        しんぞうや　のうみそは　とても　ちいさい。
        なんでも　とかす　とくしゅな　いえきを　もつ。
      ja: |-
        体の　大部分が　胃袋で　できていて
        心臓や　脳みそは　とても　小さい。
        なんでも　溶かす　特殊な　胃液を　持つ。
      ko: |-
        몸 대부분이 위로 되어 있어
        심장이나 뇌는 매우 작다.
        무엇이든 녹이는 특수한 위액을 지녔다.
      en: |-
        Most of Gulpin’s body is made up of its stomach—its heart and
        brain are very small in comparison. This Pokémon’s stomach
        contains special enzymes that dissolve anything.
      fr: |-
        Le corps de Gloupti n’est pratiquement qu’un gros estomac.
        En comparaison, son cœur et son cerveau sont tout petits.
        L’estomac de ce Pokémon contient des enzymes spéciales
        capables de tout dissoudre.
      de: |-
        Schluppucks Körper besteht zum größten Teil aus seinem
        Magen. Sein Herz und sein Gehirn sind im Vergleich dazu
        sehr klein. Der Magen dieses Pokémon enthält Enzyme,
        die alles zersetzen können.
      es: |-
        La mayor parte del cuerpo de Gulpin está ocupado por su
        estómago. En comparación, el corazón y el cerebro son muy
        pequeños. Este Pokémon tiene enzimas especiales en el
        estómago capaces de corroerlo todo.
      it: |-
        La maggior parte del corpo di Gulpin è formato dallo stomaco
        di dimensioni enormi rispetto al cuore e al cervello.
        Lo stomaco di questo Pokémon contiene enzimi speciali che
        sciolgono qualsiasi cosa.
