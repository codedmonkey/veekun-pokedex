minior:
  base_happiness: 70
  capture_rate: 30
  color: brown
  egg_groups:
    - mineral
  evolution_chain: minior
  evolves_from: ~
  flavor_text:
    sun:
      ja-Hrkt: |-
        もともと　オゾンそうに　すんでおり
        からだの　カラが　おもくなると
        ちじょうに　むかって　おちてくる。
      ja: |-
        もともと　オゾン層に　棲んでおり
        身体の　殻が　重くなると
        地上に　向かって　落ちてくる。
      ko: |-
        원래 오존층에 살고 있으며
        몸의 껍질이 무거워지면
        지상을 향해 떨어진다.
      zh-Hant: |-
        原本棲息在臭氧層，
        身體的外殼變重後，
        就會向著地面落下。
      zh-Hans: |-
        原本栖息在臭氧层，
        身体的外壳变重后，
        就会向着地面落下。
      en: |-
        Originally making its home in the ozone layer,
        it hurtles to the ground when the shell enclosing
        its body grows too heavy.
      fr: |-
        Il vivait dans la couche d’ozone, avant que
        sa carapace, devenue trop lourde, ne finisse
        par le faire chuter sur la terre ferme.
      de: |-
        Eigentlich lebt es in der Ozonschicht, doch
        wenn seine Schale zu schwer wird, stürzt es
        auf die Erde.
      es: |-
        Vive en la capa de ozono hasta que su
        caparazón se hace demasiado pesado y cae
        sin remisión a tierra firme.
      it: |-
        Vive normalmente nello strato d’ozono, ma
        quando il guscio esterno si indurisce precipita
        a terra.
    moon:
      ja-Hrkt: |-
        つよい　しょうげきを　うけると　カラは
        はがれ　おちる。　ナノりゅうしが
        とつぜんへんいし　うまれたポケモン。
      ja: |-
        強い　衝撃を　うけると　殻は
        はがれ　落ちる。　ナノ粒子が
        突然変異し　生まれたポケモン。
      ko: |-
        강한 충격을 받으면 껍데기는
        떨어져 나간다. 나노입자가
        돌연변이하여 태어난 포켓몬이다.
      zh-Hant: |-
        若受到強烈的衝擊，外殼就會剝落。
        是奈米粒子突變而誕生的寶可夢。
      zh-Hans: |-
        如果受到强烈的冲击，外壳就会剥落。
        纳米粒子突变诞生而成的宝可梦。
      en: |-
        Strong impacts can knock it out of its shell. This
        Pokémon was born from mutated nanoparticles.
      fr: |-
        La carapace qui le recouvre peut être arrachée
        par une violente attaque. Il est le fruit d’une
        mutation de nanoparticules.
      de: |-
        Heftige Stöße lassen seine Schale abblättern.
        Eine Mutation von Nanopartikeln brachte
        dieses Pokémon hervor.
      es: |-
        Este Pokémon nació fruto de la mutación de
        nanopartículas. El caparazón que lo recubre
        se desprende al recibir un fuerte impacto.
      it: |-
        Ha avuto origine da una mutazione improvvisa
        di nanoparticelle. Un attacco violento può fargli
        perdere il guscio esterno.
    ultra-sun:
      ja-Hrkt: |-
        オゾンそうに　すみ　より　つよい
        ポケモンの　エサに　なっている。
        にげるうちに　ちじょうに　おちてくる。
      ja: |-
        オゾン層に　棲み　より　強い
        ポケモンの　エサに　なっている。
        逃げるうちに　地上に　おちてくる。
      ko: |-
        오존층에 살며 더 강한
        포켓몬의 먹이가 된다.
        도망치다 지상으로 떨어진다.
      zh-Hant: |-
        棲息在臭氧層，被更強大的
        寶可夢當成了食物。
        在逃跑的過程中落到了地上。
      zh-Hans: |-
        栖息在臭氧层，成为了
        更强大的宝可梦的食物。
        会在逃跑的过程中掉落到地上。
      en: |-
        It lives in the ozone layer, where it becomes
        food for stronger Pokémon. When it tries to run
        away, it falls to the ground.
      fr: |-
        Il vit dans la couche d’ozone, où des Pokémon
        plus forts que lui cherchent à le manger.
        Il tombe à terre lorsqu’il tente de s’enfuir.
      de: |-
        Es lebt in der Ozonschicht und dient stärkeren
        Pokémon als Nahrung. Wenn es vor ihnen flieht,
        stürzt es auf die Oberfläche des Planeten.
      es: |-
        Vive en la capa de ozono, donde puede resultar
        presa de Pokémon más fuertes. Al huir, acaba
        precipitándose a tierra firme.
      it: |-
        Vive nello strato d’ozono, dove Pokémon più
        forti di lui lo cacciano per cibarsene. Spesso
        precipita sulla terraferma cercando di fuggire.
    ultra-moon:
      ja-Hrkt: |-
        がいかくは　とても　がんじょうだが
        ちじょうに　らっかする　ショックで
        こっぱみじんに　くだけてしまう。
      ja: |-
        外殻は　とても　頑丈だが
        地上に　落下する　ショックで
        木っ端微塵に　砕けてしまう。
      ko: |-
        겉껍질은 매우 튼튼하지만
        지상에 낙하할 때의 충격으로
        산산이 조각나 버린다.
      zh-Hant: |-
        外殼非常堅固，
        但墜落到地上時的衝擊
        會讓牠碎成細屑。
      zh-Hans: |-
        外壳非常坚固，但落到地上的
        冲击会让它碎成细屑。
      en: |-
        Although its outer shell is uncommonly durable,
        the shock of falling to the ground smashes the
        shell to smithereens.
      fr: |-
        Sa carapace, pourtant très solide, éclate
        en mille morceaux quand il s’écrase sur
        la terre en tombant du ciel.
      de: |-
        Seine äußere Schale ist zwar sehr robust, durch
        den Aufprall auf der Oberfläche des Planeten
        zersplittert sie allerdings.
      es: |-
        Lo recubre un duro caparazón que se quiebra
        en pedazos al impactar con la superficie de la
        tierra.
      it: |-
        Il suo guscio esterno è estremamente resistente,
        ma quando precipita dallo strato d’ozono
        l’impatto con il suolo lo fa andare in mille pezzi.
