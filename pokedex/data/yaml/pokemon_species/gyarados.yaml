    black-2:
      en: |-
        Once it begins to rampage, a
        Gyarados will burn everything
        down, even in a harsh storm.
    white-2:
      en: |-
        Once it begins to rampage, a
        Gyarados will burn everything
        down, even in a harsh storm.
    x:
      ja-Hrkt: |-
        あらそいの　おこった　むらを
        やきつくしたという　きろくが
        こもんじょに　のこされている。
      ja: |-
        争いの　起こった　村を
        焼きつくしたという　記録が
        古文書に　残されている。
      ko: |-
        분쟁이 일어난 마을을
        다 태워버렸다는 기록이
        고문서에 남아 있다.
      en: |-
        In ancient literature, there is a record of a Gyarados
        that razed a village when violence flared.
      fr: |-
        La littérature ancienne fait état d’un Léviator qui
        aurait rasé un village sous le coup de la colère.
      de: |-
        In alten Schriften wird von einem Garados berichtet,
        das in einem Wutanfall ein Dorf zerstörte.
      es: |-
        En la literatura antigua se dice que un Gyarados
        rebosante de violencia arrasó un poblado.
      it: |-
        Un antico documento riporta che Gyarados rase al
        suolo un villaggio in cui dilagava la violenza.
    'y':
      ja-Hrkt: |-
        めったに　すがたを　あらわさないが
        ひとたび　あばれだすと　おおきな
        としが　かいめつする　ときもある。
      ja: |-
        めったに　姿を　現さないが
        ひとたび　暴れ出すと　大きな
        都市が　壊滅するときもある。
      ko: |-
        거의 모습을 드러내지 않지만
        한번 날뛰면 커다란 도시가
        괴멸하는 경우도 있다.
      en: |-
        Rarely seen in the wild. Huge and vicious, it is
        capable of destroying entire cities in a rage.
      fr: |-
        Gigantesque et maléfique, il est capable de raser
        une ville entière dans un accès de rage.
      de: |-
        Ein gigantisches, sehr kraftvolles Pokémon.
        Es ist fähig, ganze Städte zu zerstören.
      es: |-
        No es frecuente verlo en su medio. Es enorme y
        malvado, y capaz de destruir ciudades enteras de
        un ataque.
      it: |-
        Poco comune allo stato selvatico. Enorme e cattivo,
        può distruggere intere città con un solo attacco.
    omega-ruby:
      ja-Hrkt: |-
        コイキングから　ギャラドスに　しんかする　とき
        のうさいぼうの　こうぞうが　くみかわる　ために
        せいかくが　きょうぼうに　なると　いわれている。
      ja: |-
        コイキングから　ギャラドスに　進化する　とき
        脳細胞の　構造が　組替わる　ために
        性格が　凶暴に　なると　いわれている。
      ko: |-
        잉어킹에서 갸라도스로 진화할 때
        뇌세포의 구조가 재구성되기 때문에
        성격이 난폭해진다고 전해진다.
      en: |-
        When Magikarp evolves into Gyarados, its brain cells undergo a
        structural transformation. It is said that this transformation is to
        blame for this Pokémon’s wildly violent nature.
      fr: |-
        Quand Magicarpe évolue et devient Léviator, la structure de
        ses cellules cérébrales est modifiée. On pense que l’extrême
        violence de ce Pokémon découle de cette modification.
      de: |-
        Wenn sich Karpador zu Garados entwickelt, durchlaufen
        seine Gehirnzellen eine strukturelle Veränderung, was wohl
        der Grund für die zügellose, gewalttätige Natur dieses
        Pokémon ist.
      es: |-
        Cuando Magikarp evoluciona y se convierte en Gyarados,
        sufre un cambio estructural en las células del cerebro. Dicen
        que esa transformación es la causa de la naturaleza violenta
        y salvaje de este Pokémon.
      it: |-
        Quando Magikarp si evolve in Gyarados, le cellule cerebrali
        subiscono una trasformazione strutturale che presumibilmente
        determina la natura selvaggia e violenta di questo Pokémon.
    alpha-sapphire:
      ja-Hrkt: |-
        いちど　あばれはじめると　すべてを　もやさないと
        きょうぼうな　ちが　おさまらなく　なってしまう。
        ひとつき　あばれつづけた　きろくが　のこる。
      ja: |-
        一度　暴れ始めると　すべてを　燃やさないと
        凶暴な　血が　収まらなく　なってしまう。
        ひと月　暴れ続けた　記録が　残る。
      ko: |-
        한 번 날뛰기 시작하면 모든 것을
        불태워야 난폭한 피가 가라앉는다.
        한 달간을 날뛴 기록이 남아 있다.
      en: |-
        Once Gyarados goes on a rampage, its ferociously violent
        blood doesn’t calm until it has burned everything down.
        There are records of this Pokémon’s rampages lasting a
        whole month.
      fr: |-
        Lorsque Léviator commence à s’énerver, sa nature violente
        ne se calme qu’une fois qu’il a tout réduit en cendres.
        La fureur de ce Pokémon peut durer pendant un mois.
      de: |-
        Wenn Garados in Rage gerät, ist sein wildes Blut kaum zu
        beruhigen, bis es alles niedergebrannt hat. Aufzeichnungen
        belegen, dass die Zerstörungswut dieses Pokémon einen
        ganzen Monat anhalten kann.
      es: |-
        Una vez que Gyarados se desmanda, la presión incontrolable
        y enrabiada de la sangre no se le calmará hasta que no haya
        quemado todo lo que le rodea. Según parece, a este
        Pokémon le duran los arranques de cólera hasta un mes.
      it: |-
        Quando Gyarados s’infuria, la sua indole feroce e violenta
        non si placa finché non ha incendiato ogni cosa. Ci sono
        testimonianze di sfuriate di questo Pokémon durate anche
        un mese intero.
    sun:
      ja-Hrkt: |-
        ギャラドスを　おこらせた　あるまちは
        ひとばんの　うちに　やきつくされ
        あとかたも　なくなったと　いわれる。
      ja: |-
        ギャラドスを　怒らせた　ある街は
        一晩の　うちに　焼き尽くされ
        跡形も　なくなったと　いわれる。
      ko: |-
        갸라도스를 화나게 한 어떤 마을은
        하룻밤 만에 다 타버려서
        흔적도 없어졌다고 전해진다.
      zh-Hant: |-
        據說，某個激怒了暴鯉龍的城鎮
        在一夜之間就被燃燒殆盡，
        連一點痕跡都沒有留下。
      zh-Hans: |-
        据说，让暴鲤龙怒火中烧的
        某个街镇在一晚上就被燃烧殆尽，
        然后便消失无踪了。
      en: |-
        A tale is told of a town that angered Gyarados.
        Before the sun rose the next day, flames utterly
        consumed the town, leaving not a trace behind.
      fr: |-
        Il existe une légende à propos d’une ville qui a
        mis un Léviator en colère et qui a été réduite
        en cendres en une nuit.
      de: |-
        Es heißt, es habe eine ganze Stadt, deren
        Bewohner es verärgert hatten, über Nacht
        vollständig in Schutt und Asche gelegt.
      es: |-
        Cuentan que un Gyarados se enfadó tanto que
        arrasó un poblado en una sola noche y no dejó
        ni rastro.
      it: |-
        Si racconta che Gyarados, infuriato contro gli
        abitanti di una città, la incenerì nel giro di
        una notte.
    moon:
      ja-Hrkt: |-
        ギャラドスが　あらわれる　ばしょは
        はかいされる　さだめに　あると
        しんじている　ひとも　いる。
      ja: |-
        ギャラドスが　現れる　場所は
        破壊される　定めに　あると
        信じている　人も　いる。
      ko: |-
        갸라도스가 나타난 장소는
        파괴될 운명이라고
        믿고 있는 사람도 있다.
      zh-Hant: |-
        暴鯉龍出現的地方肯定會遭到破壞，
        有些人相信這種說法。
      zh-Hans: |-
        暴鲤龙出现的地方肯定会遭到破坏，
        相信这个说法的人也是有的。
      en: |-
        There are people who swear that any place
        Gyarados appears is fated for destruction.
      fr: |-
        Certaines personnes croient que les endroits où
        un Léviator apparaît sont destinés à connaître
        la destruction.
      de: |-
        Manche Menschen sind fest davon überzeugt,
        dass Orte, an denen ein Garados erscheint,
        dem Untergang geweiht sind.
      es: |-
        Alguna gente cree que aquellos lugares donde
        aparece Gyarados están abocados a la
        destrucción.
      it: |-
        Secondo alcuni, i luoghi dove appare Gyarados
        sono destinati alla distruzione.
    ultra-sun:
      ja-Hrkt: |-
        はかいこうせんを　はきまくり
        あたり　いちめんを　やきつくす。
        はかいのかみと　よぶ　ちほうもある。
      ja: |-
        破壊光線を　はきまくり
        あたり　一面を　焼き尽くす。
        破壊の神と　呼ぶ　地方もある。
      ko: |-
        파괴광선을 무자비하게 쏘아
        주변 일대를 태워 버린다.
        파괴의 신이라고 부르는 지방도 있다.
      zh-Hant: |-
        會不斷吐出破壞光線，
        把周圍一帶燃燒殆盡，
        有的地方把牠稱為破壞神。
      zh-Hans: |-
        能不断地吐出破坏光线，
        将周围一带燃烧殆尽。
        也有一些地区称其为破坏神。
      en: |-
        It fires hyper beams in all directions, burning the
        surrounding area to ash. There are some regions
        where it’s called “the deity of destruction.”
      fr: |-
        Avec son Ultralaser, il anéantit d’immenses
        étendues. Dans ces régions dévastées, il est
        surnommé « le dieu de la destruction ».
      de: |-
        Mit seinem Hyperstrahl legt es die Umgebung
        in Schutt und Asche. Manchmal wird es auch
        als „Gottheit der Zerstörung“ bezeichnet.
      es: |-
        Allí donde alcanza su Hiperrayo la tierra queda
        carbonizada por completo. En algunas regiones
        lo consideran una deidad destructiva.
      it: |-
        Incenerisce tutto ciò che lo circonda usando
        Iper Raggio. In alcune regioni ci si riferiva
        a lui con il nome di “dio della distruzione”.
    ultra-moon:
      ja-Hrkt: |-
        しんか　エネルギーが　のうさいぼうを
        つよく　しげきした　けっか　とても
        きょうぼうな　せいかくに　へんかした。
      ja: |-
        進化　エネルギーが　脳細胞を
        強く　刺激した　結果　とても
        凶暴な　性格に　変化した。
      ko: |-
        진화 에너지가 뇌세포를
        강하게 자극한 결과 매우
        난폭한 성격으로 변화했다.
      zh-Hant: |-
        進化能量強烈刺激了
        腦細胞，結果使得
        牠的性格變得非常兇暴。
      zh-Hans: |-
        进化能量猛烈刺激
        脑细胞的结果就是，
        它的性格变得非常的残暴。
      en: |-
        The energy from evolution stimulated its brain
        cells strongly, causing it to become
        very ferocious.
      fr: |-
        L’énergie libérée au moment de son évolution
        a fortement stimulé ses cellules cérébrales
        et causé son tempérament pour le moins violent.
      de: |-
        Die bei der Entwicklung freigesetzte Energie
        stimuliert seine Gehirnzellen und verleiht ihm
        eine sehr zügellose, gewalttätige Natur.
      es: |-
        La energía desprendida durante la evolución
        afecta de forma irreversible sus neuronas,
        dando origen a su agresividad manifiesta.
      it: |-
        La sua natura estremamente violenta è dovuta ai
        forti stimoli subiti dalle sue cellule cerebrali a
        causa dell’energia sprigionatasi con l’evoluzione.
    lets-go-pikachu:
      ja-Hrkt: |-
        やばんで　はかいてきな　せいかく。
        おおむかし　まちを　やきつくした
        きろくがある　きょうふのポケモン。
      ja: |-
        野蛮で　破壊的な　性格。
        大昔　町を　焼き尽くした
        記録がある　恐怖のポケモン。
      ko: |-
        야만스럽고 파괴적인 성격이다.
        먼 옛날 마을을 불태워버렸다는
        기록이 있는 공포의 포켓몬.
      zh-Hant: |-
        性情野蠻喜歡破壞。在古代，
        這種恐怖的寶可夢曾經有過
        把整座城市燒成焦土的紀錄。
      zh-Hans: |-
        性格蛮横喜欢破坏。在古代，
        这个恐怖的宝可梦曾经有过
        把整座城市烧成焦土的记录。
      en: |-
        Brutally vicious and enormously destructive.
        Known for totally destroying cities in
        ancient times.
      fr: |-
        Brutal et dangereux, il est connu pour avoir rasé
        des villes entières par le passé.
      de: |-
        Garados ist brutal und zerstörungswütig. Es hat
        Aufzeichnungen zufolge in alten Zeiten ganze
        Städte in Schutt und Asche gelegt.
      es: |-
        Este Pokémon tan salvaje como destructivo es
        conocido por haber reducido a escombros
        ciudades enteras en el pasado.
      it: |-
        Pokémon brutale e feroce, è famoso per aver
        ridotto in cenere intere città nel passato.
    lets-go-eevee:
      ja-Hrkt: |-
        やばんで　はかいてきな　せいかく。
        おおむかし　まちを　やきつくした
        きろくがある　きょうふのポケモン。
      ja: |-
        野蛮で　破壊的な　性格。
        大昔　町を　焼き尽くした
        記録がある　恐怖のポケモン。
      ko: |-
        야만스럽고 파괴적인 성격이다.
        먼 옛날 마을을 불태워버렸다는
        기록이 있는 공포의 포켓몬.
      zh-Hant: |-
        性情野蠻喜歡破壞。在古代，
        這種恐怖的寶可夢曾經有過
        把整座城市燒成焦土的紀錄。
      zh-Hans: |-
        性格蛮横喜欢破坏。在古代，
        这个恐怖的宝可梦曾经有过
        把整座城市烧成焦土的记录。
      en: |-
        Brutally vicious and enormously destructive.
        Known for totally destroying cities in
        ancient times.
      fr: |-
        Brutal et dangereux, il est connu pour avoir rasé
        des villes entières par le passé.
      de: |-
        Garados ist brutal und zerstörungswütig. Es hat
        Aufzeichnungen zufolge in alten Zeiten ganze
        Städte in Schutt und Asche gelegt.
      es: |-
        Este Pokémon tan salvaje como destructivo es
        conocido por haber reducido a escombros
        ciudades enteras en el pasado.
      it: |-
        Pokémon brutale e feroce, è famoso per aver
        ridotto in cenere intere città nel passato.
    sword:
      ja-Hrkt: |-
        ひじょうに　きょうぼうな　せいかく。
        くちからだす　はかいこうせんは
        すべてのものを　やきつくす。
      ja: |-
        非常に　狂暴な　性格。
        口から出す　破壊光線は
        すべてのものを　焼きつくす。
      ko: |-
        성격이 매우 흉포하다.
        입에서 나오는 파괴광선은
        모든 것을 태워버린다.
      zh-Hant: |-
        性情非常凶暴。
        從嘴裡發出的破壞光線
        能夠將一切燃燒殆盡。
      zh-Hans: |-
        性格非常凶暴。
        从嘴里发出的破坏光线
        能够将一切燃烧殆尽。
      en: |-
        It has an extremely aggressive nature.
        The Hyper Beam it shoots from its mouth
        totally incinerates all targets.
      fr: |-
        Il est d’une nature très agressive.
        Les lasers qu’il tire de sa bouche sont capables
        de désintégrer n’importe quelle cible.
      de: |-
        Es ist von Natur aus sehr aggressiv.
        Der Hyperstrahl, den es aus seinem Maul
        verschießt, äschert seine Gegner ein.
      es: |-
        Es exageradamente agresivo. El Hiperrayo que
        lanza por la boca reduce a cenizas todo lo que
        encuentra.
      it: |-
        Pokémon estremamente aggressivo, incenerisce
        ogni cosa con l’Iper Raggio che spara dalla
        bocca.
    shield:
      ja-Hrkt: |-
        いちど　あばれだした　ギャラドスは
        あらしが　ふきすさんでいようとも
        どんなものでも　やきつくしてしまう。
      ja: |-
        一度　暴れだした　ギャラドスは
        嵐が　吹き荒んでいようとも
        どんなものでも　焼きつくしてしまう。
      ko: |-
        한번 난동부리기 시작한 갸라도스는
        태풍이 사납게 휘몰아쳐도
        모든 것을 다 태워버린다.
      zh-Hant: |-
        就算是在狂風暴雨中，
        只要發狂的暴鯉龍出現，
        一切都會被牠燒毀殆盡。
      zh-Hans: |-
        就算是在狂风暴雨中，
        只要发狂的暴鲤龙出现，
        一切都会被它烧毁殆尽。
      en: |-
        Once it begins to rampage, a Gyarados will burn
        everything down, even in a harsh storm.
      fr: |-
        Quand il se laisse emporter par la rage,
        même la plus violente des tempêtes ne peut
        l’empêcher de détruire tout ce qui l’entoure.
      de: |-
        Wütet ein Garados, wird es alles niederbrennen.
        Dies geschieht selbst während eines Sturms.
      es: |-
