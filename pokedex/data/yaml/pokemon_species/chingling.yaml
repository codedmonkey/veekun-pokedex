chingling:
  base_happiness: 70
  capture_rate: 120
  color: yellow
  egg_groups:
    - no-eggs
  evolution_chain: chimecho
  evolves_from: ~
  flavor_text:
    diamond:
      en: |-
        It emits cries by agitating an orb
        at the back of its throat.
        It moves with flouncing hops.
    pearl:
      en: |-
        Each time it hops, it makes a
        ringing sound. It deafens foes by
        emitting high-frequency cries.
    platinum:
      en: |-
        There is an orb inside its mouth.
        When it hops, the orb bounces all
        over and makes a ringing sound.
    heartgold:
      en: |-
        It emits high-frequency cries that 
        people can’t hear. Once it starts,
        it can cry for an awfully long time. 
    soulsilver:
      en: |-
        It emits high-frequency cries that 
        people can’t hear. Once it starts,
        it can cry for an awfully long time. 
    black:
      en: |-
        There is an orb inside its mouth.
        When it hops, the orb bounces all
        over and makes a ringing sound.
      fr: |-
        Quand il sautille, l’orbe qu’il a
        dans la bouche s’agite et tinte
        comme une cloche.
    white:
      en: |-
        There is an orb inside its mouth.
        When it hops, the orb bounces all
        over and makes a ringing sound.
      fr: |-
        Quand il sautille, l’orbe qu’il a
        dans la bouche s’agite et tinte
        comme une cloche.
    black-2:
      en: |-
        There is an orb inside its mouth.
        When it hops, the orb bounces all
        over and makes a ringing sound.
    white-2:
      en: |-
        There is an orb inside its mouth.
        When it hops, the orb bounces all
        over and makes a ringing sound.
    x:
      ja-Hrkt: |-
        はねるたび　リリンと　おとを　だす。
        たかい　しゅうはすうの　なきごえで
        あいての　みみを　きこえなくする。
      ja: |-
        跳ねるたびに　リリンと　音を　出す。
        高い　周波数の　鳴き声で
        相手の　耳を　聞こえなくする。
      ko: |-
        뛸 때마다 딸랑딸랑 소리를 낸다.
        높은 주파수의 울음소리로
        상대의 귀를 들리지 않게 한다.
      en: |-
        Each time it hops, it makes a ringing sound.
        It deafens foes by emitting high-frequency cries.
      fr: |-
        Il produit un bruit de sonnerie à chaque bond.
        Il assourdit l’ennemi avec ses cris à haute fréquence.
      de: |-
        Jedes Mal, wenn es hüpft, entsteht ein klingender
        Laut. Seine hohen Schreie machen die Gegner taub.
      es: |-
        Emite un tintineo cada vez que salta. Ensordece a sus
        rivales con sonidos de alta frecuencia.
      it: |-
        A ogni salto produce un suono che sembra uno
        squillo. I suoi versi ad alta frequenza assordano
        i nemici.
    'y':
      ja-Hrkt: |-
        とびはねると　くちのなかにある
        たまが　あちこちに　はんしゃして
        すずのような　ねいろと　なる。
      ja: |-
        飛び跳ねると　口の中にある
        玉が　あちこちに　反射して
        鈴のような　音色と　なる。
      ko: |-
        뛰어오르면 입안에 있는
        구슬이 사방에 반사되어
        방울 같은 음색을 만들어 낸다.
      en: |-
        There is an orb inside its mouth. When it hops,
        the orb bounces all over and makes a
        ringing sound.
      fr: |-
        Quand il sautille, l’orbe qu’il a dans la bouche s’agite
        et tinte comme une cloche.
      de: |-
        In seinem Maul befindet sich eine Kugel, die beim
        Hopsen ein klingelndes Geräusch erzeugt.
      es: |-
        Tiene una esfera en la boca. Cuando salta, la esfera
        rebota y emite un tintineo.
      it: |-
        Ha una sfera nella gola. Quando saltella, la sfera si
        muove emettendo dei trilli.
    omega-ruby:
      ja-Hrkt: |-
