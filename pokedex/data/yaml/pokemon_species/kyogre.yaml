    x:
      ja-Hrkt: |-
        おおあめと　おおつなみで　うみを
        ひろげた　しんわの　ポケモン。
        グラードンと　はげしく　たたかった。
      ja: |-
        大雨と　大津波で　海を　広げた
        神話の　ポケモン。
        グラードンと　激しく　戦った。
      ko: |-
        많은 비와 큰 해일로 바다를
        넓힌 신화의 포켓몬이다.
        그란돈과 격하게 싸웠다.
      en: |-
        A mythical Pokémon said to have swelled the seas
        with rain and tidal waves. It battled with Groudon.
      fr: |-
        Ennemi juré de Groudon, la légende dit qu’il a étendu
        les mers en causant déluges et raz de marée.
      de: |-
        Der Legende nach erschuf sein Regen das Meer.
        Es und Groudon lieferten sich einen langen Kampf.
      es: |-
        Pokémon legendario que aumentó los mares con
        diluvios y maremotos. Fue un enemigo acérrimo de
        Groudon.
      it: |-
        Nella mitologia, Kyogre è il Pokémon che ha
        ampliato i mari con megaonde e megapiogge.
        Nemico di Groudon.
    'y':
      ja-Hrkt: |-
        おおあめを　ふらせる　のうりょくで
        うみを　ひろげたと　いわれている。
        かいこうの　そこで　ねむっていた。
      ja: |-
        大雨を　降らせる　能力で
        海を　広げたと　言われている。
        海溝の　底で　眠っていた。
      ko: |-
        많은 비를 내리게 하는 능력으로
        바다를 넓혔다고 전해진다.
        해구의 밑바닥에서 잠들어 있었다.
      en: |-
        It is said to have widened the seas by causing
        downpours. It had been asleep in a marine trench.
      fr: |-
        On dit qu’il a fait monter les eaux en causant des
        pluies diluviennes. Il somnolait dans une fosse marine.
      de: |-
        Man sagt, es habe die Meere vergrößert, indem es
        es regnen ließ. Es schlief in einem Meeresgraben.
      es: |-
        Se dice que aumentó el nivel del mar a base de
        aguaceros. Ha estado durmiendo en una fosa marina.
      it: |-
        Si dice che abbia ampliato i mari provocando piogge
        torrenziali. Si è assopito in una fossa marina.
    omega-ruby:
      ja-Hrkt: |-
        しぜんのエネルギーに　よって　ゲンシカイキし
        ほんらいの　すがたを　とりもどす。そのちからは
        あらしを　よびよせ　うみを　ひろげる。
      ja: |-
        自然のエネルギーに　よって　ゲンシカイキし
        本来の　姿を　取り戻す。その力は
        嵐を　呼び寄せ　海を　広げる。
      ko: |-
        자연의 힘에 의해 원시회귀하여
        원래의 모습을 되찾는다. 그 힘은
        폭풍을 불러들이며 바다를 확장한다.
      en: |-
        Through Primal Reversion and with nature’s
        full power, it will take back its true form. It can
        summon storms that cause the sea levels to rise.
      fr: |-
        Grâce à l’énergie de la nature, il peut accomplir
        sa Primo-Résurgence pour retrouver son apparence originelle.
        Ce pouvoir lui permet d’appeler de terribles déluges
        pour étendre les mers.
      de: |-
        Mithilfe von Naturenergie kann es eine Protomorphose
        durchführen und so seine ursprüngliche Form zurückerlangen.
        Dadurch kann es Stürme erzeugen und das Meer vergrößern.
      es: |-
        Kyogre se sirve de la energía de la naturaleza para realizar su
        Regresión Primigenia y recobrar su apariencia primitiva. Con tal
        poder, puede desencadenar tempestades para expandir los
        océanos.
      it: |-
        L’energia della natura può causare l’archeorisveglio
        di questo Pokémon, facendolo tornare al suo aspetto
        originario.
        Può provocare diluvi torrenziali in grado di espandere
        la superficie dei mari.
    alpha-sapphire:
      ja-Hrkt: |-
        うみの　けしん　と つたわる　ポケモン。
        しぜんのエネルギーを　もとめて　グラードンと
        あらそいを　くりかえした　でんせつが　ある。
      ja: |-
        海の　化身　と 伝わる　ポケモン。
        自然のエネルギーを　求めて　グラードンと
        争いを　繰り返したという　伝説が　ある。
      ko: |-
        바다의 화신이라 전해지는 포켓몬.
        자연의 힘을 갈구하여 그란돈과
        사투를 반복한다는 전설이 있다.
      en: |-
        Kyogre is said to be the personification of the sea itself.
        Legends tell of its many clashes against Groudon,
        as each sought to gain the power of nature.
      fr: |-
        Un Pokémon considéré comme l’avatar des océans.
        Selon les légendes, il a disputé de nombreux combats
        avec Groudon pour contrôler l’énergie de la nature.
      de: |-
        Es heißt, Kyogre sei die Personifizierung des Meeres.
        Legenden zufolge hat es in seinem Bestreben, sich die
        Naturenergie anzueignen, viele Male gegen Groudon gekämpft.
      es: |-
        A Kyogre siempre se le ha descrito como el Pokémon que
        expandió los océanos. Varias leyendas cuentan que libró
        combates contra Groudon en repetidas ocasiones para tener
        el control de la energía de la naturaleza.
      it: |-
        Si dice che questo Pokémon abbia un profondo
        legame con le distese dei mari.
        Le leggende narrano dei suoi continui scontri con
        Groudon per ottenere l’energia della natura.
