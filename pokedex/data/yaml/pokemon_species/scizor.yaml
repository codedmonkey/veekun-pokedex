    x:
      ja-Hrkt: |-
        こうてつを　ふくんでいる
        ハサミで　とらえたものは　どんなに
        かたくても　コナゴナに　くだく。
      ja: |-
        鋼鉄を　含んでいる　ハサミで
        捕らえたものは　どんなに　硬くても
        コナゴナに　砕く。
      ko: |-
        강철이 함유된
        집게로 잡은 것은 아무리
        딱딱해도 산산조각이 난다.
      en: |-
        This Pokémon’s pincers, which contain steel, can
        crush any hard object it gets ahold of into bits.
      fr: |-
        Les pinces de ce Pokémon contiennent de l’acier et
        peuvent réduire en miettes quasiment n’importe quoi.
      de: |-
        Dieses Pokémon kann mit seinen stählernen
        Scheren jeden harten Gegenstand mühelos zermalmen.
      es: |-
        Las pinzas que posee tienen acero. Con ellas, no hay
        nada que se le resista. Rompen todo lo que pillan.
      it: |-
        Le chele, che contengono acciaio, possono fare a
        pezzi qualsiasi oggetto afferrino.
    'y':
      ja-Hrkt: |-
        はがねの　からだを　もつ。
        めだまもようの　ついた　はさみを
        ふりあげて　あいてを　いかくする。
      ja: |-
        鋼の　体を　持つ。
        目玉模様の　ついた　ハサミを
        振り上げて　相手を　威嚇する。
      ko: |-
        강철의 몸을 가지고 있다.
        눈알 무늬가 붙은 집게를
        치켜들어 상대를 위협한다.
      en: |-
        It has a steel-hard body. It intimidates foes by
        upraising its eye-patterned pincers.
      fr: |-
        Son corps est dur comme l’acier. Il intimide ses
        ennemis en levant ses pinces pareilles à des yeux.
      de: |-
        Sein Körper ist stahlhart. Es bedroht seine Gegner,
        indem es die Augen auf seinen Scheren zeigt.
      es: |-
        Su cuerpo es duro como el acero. Confunde a los
        rivales con los dibujos de ojos en sus pinzas.
      it: |-
        Ha un corpo duro come l’acciaio. Spaventa i nemici
        con le chele, su cui sono disegnati degli occhi.
    omega-ruby:
      ja-Hrkt: |-
        はがねの　かたさを　もつ　からだは　ちょっとや
        そっとの　こうげきでは　びくとも　しないぞ。
        ハネを　はばたかせ　たいおんを　ちょうせつする。
      ja: |-
        鋼の　硬さを　持つ　体は　ちょっとや
        そっとの　攻撃では　びくとも　しないぞ。
        ハネを　羽ばたかせ　体温を　調節する。
      ko: |-
        강철의 강도를 지닌 몸은 어지간한
        공격으로는 꿈쩍도 하지 않는다.
        날갯짓으로 체온을 조절한다.
      en: |-
        Scizor has a body with the hardness of steel. It is not easily
        fazed by ordinary sorts of attacks. This Pokémon flaps its
        wings to regulate its body temperature.
      fr: |-
        Le corps de Cizayox est dur comme de l’acier. Les attaques
        ordinaires ne le déstabilisent pas. Ce Pokémon bat des ailes
        pour réguler sa température interne.
      de: |-
        Scherox’ Körper ist hart wie Stahl. Gewöhnliche Angriffe jagen
        ihm keine Angst ein. Dieses Pokémon schlägt mit den Flügeln,
        um seine Körpertemperatur zu regulieren.
      es: |-
        Scizor tiene un cuerpo duro como el acero que no es fácil de
        alterar con ningún ataque común. Este Pokémon bate las alas
        para regular la temperatura corporal.
      it: |-
        Il corpo di Scizor è duro come l’acciaio. Gli attacchi
        più comuni non riescono neanche a scalfirlo. Sbatte le ali
        per regolare la propria temperatura corporea.
    alpha-sapphire:
      ja-Hrkt: |-
        はがねの　かたさを　もつ　からだは　ちょっとや
        そっとの　こうげきでは　びくとも　しないぞ。
        ハネを　はばたかせ　たいおんを　ちょうせつする。
      ja: |-
        鋼の　硬さを　持つ　体は　ちょっとや
        そっとの　攻撃では　びくとも　しないぞ。
        ハネを　羽ばたかせ　体温を　調節する。
      ko: |-
        강철의 강도를 지닌 몸은 어지간한
        공격으로는 꿈쩍도 하지 않는다.
        날갯짓으로 체온을 조절한다.
      en: |-
        Scizor has a body with the hardness of steel. It is not easily
        fazed by ordinary sorts of attacks. This Pokémon flaps its
        wings to regulate its body temperature.
      fr: |-
        Le corps de Cizayox est dur comme de l’acier. Les attaques
        ordinaires ne le déstabilisent pas. Ce Pokémon bat des ailes
        pour réguler sa température interne.
      de: |-
        Scherox’ Körper ist hart wie Stahl. Gewöhnliche Angriffe jagen
        ihm keine Angst ein. Dieses Pokémon schlägt mit den Flügeln,
        um seine Körpertemperatur zu regulieren.
      es: |-
        Scizor tiene un cuerpo duro como el acero que no es fácil de
        alterar con ningún ataque común. Este Pokémon bate las alas
        para regular la temperatura corporal.
      it: |-
        Il corpo di Scizor è duro come l’acciaio. Gli attacchi
        più comuni non riescono neanche a scalfirlo. Sbatte le ali
        per regolare la propria temperatura corporea.
    sun:
      ja-Hrkt: |-
        ハネを　つかい　たいおんちょうせつ。
        たたかいで　あつくなりすぎて
        きんぞくの　からだが　とけないため。
      ja: |-
        ハネを　使い　体温調節。
        戦いで　熱くなり過ぎて
        金属の　身体が　溶けないため。
      ko: |-
        날개를 사용해 체온조절을 한다.
        싸움으로 너무 뜨거워져서
        금속 몸이 녹지 않게 하기 위함이다.
      zh-Hant: |-
        為了防止戰鬥時變得過熱，
        而令金屬的身體熔化，
        會使用翅膀調節體溫。
      zh-Hans: |-
        为了防止战斗时变得过热，
        而令金属的身体熔化，
        会使用翅膀调节体温。
      en: |-
        It uses its wings to adjust its body temperature.
        Otherwise, its metal body would become
        too hot and melt in the heat of battle.
      fr: |-
        Il utilise ses ailes pour réguler sa température
        corporelle, ce qui empêche sa carcasse d’acier
        de fondre en cas d’ardent combat.
      de: |-
        Es schlägt mit den Flügeln, um seine Körper-
        temperatur zu regulieren. So überhitzt und
        schmilzt sein stählerner Körper im Kampf nicht.
      es: |-
        Este Pokémon bate las alas para regular su
        temperatura corporal y evitar que su cuerpo
        metálico se derrita en el fragor de la batalla.
      it: |-
        Quando lotta, sbatte continuamente le ali per
        regolare la temperatura corporea ed evitare che
        il suo corpo metallico si surriscaldi e fonda.
    moon:
      ja-Hrkt: |-
        ひとたび　てきと　にんしきすると
        こうてつの　こうどを　もつ　ハサミで
        ようしゃなく　たたきつぶす。
      ja: |-
        ひとたび　敵と　認識すると
        鋼鉄の　硬度を　持つ　ハサミで
        容赦なく　叩き潰す。
      ko: |-
        한 번 적이라고 인식하면
        강철의 경도를 지닌 집게로
        봐주지 않고 때려눕힌다.
      zh-Hant: |-
        一旦認定對方是敵人，
        就會用具有鋼鐵硬度的鉗子
        毫不留情地將對方擊倒。
      zh-Hans: |-
        一旦认出敌人，
        就会用具有钢铁硬度的钳子
        毫不留情地将对方击溃。
      en: |-
        Once it has identified an enemy, this Pokémon
        smashes it mercilessly with pincers hard
        as steel.
      fr: |-
        Avec ses puissantes pinces d’acier, ce Pokémon
        implacable s’acharne sur tout ce qu’il considère
        comme un ennemi jusqu’à le briser.
      de: |-
        Sobald es einen Gegner bemerkt, schlägt es ihn
        mit seinen stahlharten Scheren erbarmungslos
        nieder.
      es: |-
        Arremete contra sus enemigos con sus
        poderosas pinzas, tan duras como el acero, sin
        ningún tipo de compasión.
      it: |-
        Si scaglia implacabile sul nemico, attaccandolo
        con le sue chele dure come l’acciaio.
    ultra-sun:
      ja-Hrkt: |-
        はがねの　ような　からだを　もつ。
        ごつくて　おもい　ハサミは　てきを
        はさむより　たたきつぶすのに　むく。
      ja: |-
        鋼の　ような　身体を　持つ。
        ごつくて　重い　ハサミは　敵を
        挟むより　叩き潰すのに　向く。
      ko: |-
        강철 같은 몸을 가졌다.
        완고하고 무거운 집게는 적을
        잡기보다 때려눕히기에 적당하다.
      zh-Hant: |-
        有著鋼鐵般的身體，比起用來
        夾住敵人，牠粗重的鉗子
        更適合用來把敵人砸扁。
      zh-Hans: |-
        有着钢铁般的身体。
        比起夹住敌人，它粗重的钳子
        更适合用来把敌人砸扁。
      en: |-
        Its body is like steel. Its tough, heavy pincers
        are more suited to smashing enemies than
        grabbing them.
      fr: |-
        Son corps est aussi solide que l’acier. Ses
        pinces, grosses et lourdes, sont plus adaptées
        au broyage qu’à la capture d’ennemis.
      de: |-
        Sein Körper ist hart wie Stahl. Es nutzt seine
        großen, schweren Scheren weniger, um Gegner
        zu packen, als um sie niederzuschlagen.
      es: |-
        Su cuerpo es duro como el acero. Con sus
        pinzas grandes y pesadas, si agarra a un rival,
        más que inmovilizarlo lo destroza.
      it: |-
        Il suo corpo è duro come l’acciaio. Con le pesanti
        e robuste chele schiaccia facilmente il nemico
        non appena lo afferra.
    ultra-moon:
      ja-Hrkt: |-
        １ど　てきと　はんだんした　ものは
        こうてつの　かたさを　もつ　ハサミで
        こなごなになるまで　なぐりつづける。
      ja: |-
        １度　敵と　判断した　ものは
        鋼鉄の　硬さを　もつ　ハサミで
        粉々になるまで　殴り続ける。
      ko: |-
        한번 적이라고 판단한 상대는
        강철의 강도를 지닌 집게로
        가루가 되도록 때린다.
      zh-Hant: |-
        一旦將對方認定為敵人，
        就會用鋼鐵般堅硬的鉗子
        不斷毆打，直到將對方粉碎。
      zh-Hans: |-
        一旦将对方认定为敌人，
        就会用钢铁般坚硬的钳子
        持续殴打对方，直到其粉身碎骨。
      en: |-
        Once it has identified something as an enemy, it
        will continue beating them with its steel-hard
        pincers until there’s nothing left but scraps.
      fr: |-
        Il utilise ses énormes pinces dures comme
        de l’acier pour réduire en miettes ceux
        qu’il identifie comme des ennemis.
      de: |-
        Sobald es ein anderes Pokémon als Feind
        erkennt, schlägt es dieses mit seinen
        stahlharten Scheren gnadenlos in Stücke.
      es: |-
        Una vez que identifica a su enemigo, arremete
        contra él hasta hacerlo trizas con sus pinzas
        duras como el acero.
      it: |-
        Dopo aver stabilito che qualcuno è suo nemico,
        lo colpisce con le chele dure come l’acciaio fino
        a ridurlo in polvere.
    sword:
      ja-Hrkt: |-
        おおきな　ハサミは　たいじゅうの
        ３ぶんの１の　おもさ。　ふりおろせば
        がんせきも　いっぱつで　こなごなだ。
      ja: |-
        大きな　ハサミは　体重の
        ３分の１の　重さ。　振り下ろせば
        岩石も　一発で　粉々だ。
      ko: |-
        커다란 집게의 무게는
        체중의 3분의 1이다. 내리치면
        암석도 일격에 산산조각이 난다.
      zh-Hant: |-
        巨大的鉗子重達體重的
        ３分之１。鉗子一揮，
        就連岩石都能一擊粉碎。
      zh-Hans: |-
        大大的钳子占了身体
        重量的３分之１。就算是
        岩石也能一击砸个粉碎。
      en: |-
        Bulky pincers account for one third of Scizor’s
        body weight. A single swing of one of these
        pincers will crush a boulder completely.
      fr: |-
        Ses grandes pinces représentent un tiers de
        son poids. Un seul coup de l’une d’entre elles
        peut réduire un rocher en poussière.
      de: |-
        Mit einer seiner großen Scheren, die ein Drittel
        seines Körpergewichts ausmachen, kann es Felsen
        mit einem einzigen Schlag zermalmen.
      es: |-
        Sus grandes pinzas representan un tercio de su
        peso corporal. Basta el impacto de una de ellas
        para reducir a escombros una enorme roca.
      it: |-
        Le grandi chele costituiscono un terzo del suo
        peso corporeo. Agitandole può ridurre in polvere
        una roccia con un colpo solo.
    shield:
      ja-Hrkt: |-
        からだは　ほそいが　こうげきりょくは
        すさまじい。　からだの　きんにくも
        きんぞくで　できているのだ。
      ja: |-
        体は　細いが　攻撃力は　凄まじい。
        体の　筋肉も
        金属で　できているのだ。
      ko: |-
        몸은 가늘지만 공격력은
        무시무시하다. 몸의 근육도
        금속으로 되어 있다.
      zh-Hant: |-
        體型雖然纖細，攻擊力卻
        非常駭人。連身體的肌肉
        都是由金屬構成的。
      zh-Hans: |-
        虽然身体纤细，却有着
        惊人的攻击力。身体的
        肌肉也是由金属构成的。
      en: |-
        Though its body is slim, Scizor has tremendous
        attacking power. Even Scizor’s muscles are made
        of metal.
      fr: |-
        Malgré son corps fin, sa puissance de frappe
        est prodigieuse, car même ses muscles sont
        composés de métal.
      de: |-
        Trotz seines dünnen Körpers verfügt Scherox
        über eine gewaltige Angriffsstärke. Selbst seine
        Muskeln bestehen aus Metall.
      es: |-
        Su potencia de ataque, que asombra dada su
        delgadez, se debe a que sus músculos están
        hechos de metal.
      it: |-
        Nonostante il corpo esile, è dotato di capacità
        offensive spaventose. Persino i suoi muscoli sono
        formati da metallo.
    legends-arceus:
      en: |-
        Evolved by way of a curious item. The shell covering its body
        has been shown to be stronger than forged steel.
