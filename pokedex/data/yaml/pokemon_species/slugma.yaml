    x:
      ja-Hrkt: |-
        かざんちたいに　おおく　はっせい。
        あたたかい　ところを　さがして
        のろのろ　はいずりまわっている。
      ja: |-
        火山地帯に　多く　発生。
        暖かい　ところを　探して
        のろのろ　はいずり回っている。
      ko: |-
        화산 지대에 많이 나타난다.
        따뜻한 곳을 찾아서
        느릿느릿 기어 다니고 있다.
      en: |-
        A common sight in volcanic areas, it slowly slithers
        around in a constant search for warm places.
      fr: |-
        Commun dans les régions volcaniques, il se déplace
        sans cesse pour trouver des endroits chauds.
      de: |-
        Es hält sich ständig bei Vulkanen auf und ist
        stets kriechend auf der Suche nach warmen
        Aufenthaltsorten.
      es: |-
        Asiduo a las zonas volcánicas, se desliza lentamente
        en busca de lugares calientes.
      it: |-
        Comune nelle aree vulcaniche, striscia in giro
        lentamente, sempre alla ricerca di luoghi caldi.
    'y':
      ja-Hrkt: |-
        ようがんで　できた　からだを　もつ。
        たえず　うごいていないと　からだが
        ひえて　かたまってしまうのだ。
      ja: |-
        溶岩で　できた　体を　持つ。
        絶えず　動いていないと　体が
        冷えて　固まってしまうのだ。
      ko: |-
        용암으로 된 몸을 가지고 있다.
        끊임없이 움직이지 않으면 몸이
        식어 굳어져 버린다.
      en: |-
        Its body is made of magma. If it doesn’t keep
        moving, its body will cool and harden.
      fr: |-
        Son corps est fait de magma. S’il cesse de bouger,
        il refroidit et durcit.
      de: |-
        Sein Körper besteht aus Magma. Bleibt es nicht
        ständig in Bewegung, kühlt es aus und verhärtet sich.
      es: |-
        Su cuerpo se compone de magma. Si deja de
        moverse, se enfría y se endurece.
      it: |-
        Nel suo corpo scorre magma. Se non si muove
        continuamente, il suo corpo si raffredda e s’indurisce.
    omega-ruby:
      ja-Hrkt: |-
        からだの　なかでは　しゃくねつの　ようがんが
        うずまいているが　ひえると　かたまって　しまい
        くずれて　からだが　ちいさく　なっていく。
      ja: |-
        体の　中では　灼熱の　溶岩が
        渦巻いているが　冷えると　固まって　しまい
        崩れて　体が　小さく　なっていく。
      ko: |-
        몸 안에는 작열하는 용암이
        소용돌이치지만 식으면 굳어지고
        부서져서 몸이 작아진다.
      en: |-
        Molten magma courses throughout Slugma’s circulatory
        system. If this Pokémon is chilled, the magma cools and
        hardens. Its body turns brittle and chunks fall off, reducing
        its size.
      fr: |-
        Du magma en fusion coule dans les veines de Limagma.
        Si ce Pokémon est refroidi, le magma se solidifie. Son corps
        devient alors cassant et des morceaux s’en détachent,
        diminuant ainsi sa taille.
      de: |-
        Durch Schneckmags Kreislaufsystem fließt Magma.
        Wenn dieses Pokémon erkältet ist, kühlt das Magma
        aus und erhärtet. Sein Körper wird spröde und es
        brechen Stücke heraus, sodass es kleiner wird.
      es: |-
        Por el sistema circulatorio de Slugma corre magma líquido. Si
        este Pokémon se enfriara, el magma perdería el calor y se
        solidificaría, por lo que se resquebrajaría por completo,
        perdería algunos trozos y reduciría su tamaño.
      it: |-
        Nel corpo di Slugma scorre magma liquido. In caso di
        congelamento, il magma si raffredda e si solidifica. Il corpo
        diventa fragile e cade a pezzi consumandosi progressivamente.
    alpha-sapphire:
      ja-Hrkt: |-
        からだの　なかでは　けつえきの　かわりに
        ひつような　えいようと　さんそを　はこぶために
        しゃくねつの　マグマが　じゅんかんしている。
      ja: |-
        体の　中では　血液の　かわりに
        必要な　栄養と　酸素を　運ぶために
        灼熱の　マグマが　循環している。
      ko: |-
        몸 안에는 혈액 대신
        필요한 영양과 산소를 운반하기 위해
        작열하는 마그마가 순환되고 있다.
      en: |-
        Slugma does not have any blood in its body. Instead, intensely
        hot magma circulates throughout this Pokémon’s body,
        carrying essential nutrients and oxygen to its organs.
      fr: |-
        Les veines de Limagma ne contiennent pas de sang.
        Au lieu de ça, du magma en fusion circule dans le corps
        de ce Pokémon, apportant les nutriments et l’oxygène
        nécessaires à ses organes.
      de: |-
        Schneckmag hat kein Blut in seinem Körper. Stattdessen fließt
        glühend heißes Magma in diesem Pokémon, das seine Organe
        mit lebenswichtigen Nährstoffen und Sauerstoff versorgt.
      es: |-
        Slugma no tiene sangre en su organismo, sino ardiente
        magma que hace circular por todo el cuerpo los nutrientes
        y el oxígeno que necesitan sus órganos.
      it: |-
        Nel corpo di Slugma non scorre nemmeno una goccia di
        sangue, bensì magma rovente, che garantisce l’apporto di
        ossigeno e sostanze nutritive fondamentali per i suoi organi.
