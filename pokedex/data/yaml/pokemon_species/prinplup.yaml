    x:
      ja-Hrkt: |-
        むれを　つくらずに　１ぴきで　いる。
        じぶんが　いちばん　えらいと　どの
        ポッタイシも　かんがえているようだ。
      ja: |-
        群れを　作らずに　１匹で　いる。
        自分が　一番　偉いと　どの
        ポッタイシも　考えているようだ。
      ko: |-
        무리를 만들지 않고 혼자 생활한다.
        어떤 팽태자라도 자신이 제일
        훌륭하다고 생각하는 듯하다.
      en: |-
        It lives alone, away from others. Apparently, every
        one of them believes it is the most important.
      fr: |-
        Il vit seul, à l’écart de ses pairs. Chaque individu est
        convaincu d’être meilleur que les autres.
      de: |-
        Es lebt allein, entfernt von anderen. Jedes von
        ihnen denkt, es sei das Bedeutendste unter ihnen.
      es: |-
        Vive solo, alejado de los demás. Cada uno piensa que
        es el más importante.
      it: |-
        Vive da solo lontano dagli altri. Apparentemente
        ogni esemplare crede di essere il più importante.
    'y':
      ja-Hrkt: |-
        なかまを　つくらずに　くらす。
        つばさの　きょうれつな　いちげきは
        たいぼくを　まっぷたつに　へしおる。
      ja: |-
        仲間を　作らずに　暮らす。
        翼の　強烈な　一撃は
        大木を　真っ二つに　へし折る。
      ko: |-
        무리를 만들지 않고 생활한다.
        날개의 강렬한 일격은
        큰 나무를 두 동강으로 꺾는다.
      en: |-
        It lives a solitary life. Its wings deliver wicked blows
        that can snap even the thickest of trees.
      fr: |-
        C’est un Pokémon solitaire. Un seul coup de ses
        puissantes ailes peut briser un arbre en deux.
      de: |-
        Pliprin sind Einzelgänger. Ein Schlag ihrer
        kräftigen Flügel haut selbst große Bäume entzwei.
      es: |-
        No hace amigos. Puede partir en dos un árbol
        gigantesco de un fuerte aletazo.
      it: |-
        Vive senza riunirsi in gruppi. Con i suoi poderosi
        colpi d’ala, può spaccare in due degli alberi enormi.
