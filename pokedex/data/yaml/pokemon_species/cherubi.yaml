    - plant
  evolution_chain: cherubi
  evolves_from: ~
  flavor_text:
    diamond:
      en: |-
        The small ball holds the nutrients
        needed for evolution. Apparently,
        it is very sweet and tasty.
    pearl:
      en: |-
        Sunlight colors it red. When the
        small ball is drained of nutrients,
        it shrivels to herald evolution.
    platinum:
      en: |-
        The small ball is not only filled with
        nutrients, it is also tasty. STARLY
        try to peck it off.
    heartgold:
      en: |-
        It evolves by sucking the energy
        out of the small ball where it had
        been storing nutrients.
    soulsilver:
      en: |-
        It evolves by sucking the energy
        out of the small ball where it had
        been storing nutrients.
    black:
      en: |-
        The small ball is not only filled with
        nutrients, it is also tasty. Starly
        try to peck it off.
      fr: |-
        Sa petite boule rose est nutritive
        et délicieuse. Les Étourmi en
        raffolent.
    white:
      en: |-
        The small ball is not only filled with
        nutrients, it is also tasty. Starly
        try to peck it off.
      fr: |-
        Sa petite boule rose est nutritive
        et délicieuse. Les Étourmi en
        raffolent.
    black-2:
      en: |-
        The small ball is not only filled with
        nutrients, it is also tasty. Starly
        try to peck it off.
    white-2:
      en: |-
        The small ball is not only filled with
        nutrients, it is also tasty. Starly
        try to peck it off.
    x:
      ja-Hrkt: |-
        ひのひかりで　あかく　いろづく。
        えいようぶんが　すわれて　ちいさい
        たまが　しぼむと　しんかが　ちかい。
      ja: |-
        日の光で　赤く　色づく。
        栄養分が　吸われて　小さい　玉が
        しぼむと　進化が　近い。
      ko: |-
        햇빛으로 빨갛게 물들었다.
        영양분이 흡수되어 작은 구슬이
        시들면 곧 진화한다는 뜻이다.
      en: |-
        Sunlight colors it red. When the small ball is
        drained of nutrients, it shrivels to herald evolution.
      fr: |-
        Il rougit au soleil. Quand la petite boule est à court
        de nutriments, elle fane en signe d’évolution.
      de: |-
        Sonnenlicht färbt es rot. Verliert das kleine Bällchen
        Nährstoffe, welkt es und die Entwicklung beginnt.
      es: |-
        Bajo la luz solar es rojo. La esfera pequeña pierde sus
        nutrientes y se seca para anunciar la evolución.
      it: |-
        La luce solare lo tinge di rosso. Se la pallina esaurisce
        i nutrimenti, si avvizzisce indicando l’evoluzione.
    'y':
      ja-Hrkt: |-
        ちいさな　たまに　つまった
        えいようぶんを　すいとって
        しんかの　エネルギーに　するのだ。
      ja: |-
        小さな　玉に　つまった
        栄養分を　吸い取って
        進化の　エネルギーに　するのだ。
      ko: |-
        작은 구슬에 모인
        영양분을 흡수해
        진화의 에너지로 삼는다.
      en: |-
        It evolves by sucking the energy out of the small
        ball where it had been storing nutrients.
      fr: |-
        Il aspire les nutriments de sa petite boule pour pouvoir
        évoluer.
      de: |-
        Es saugt Nährstoffe, die in seinem Bällchen enthalten
        sind, und nutzt die Energie für seine Entwicklung.
      es: |-
        Obtiene la energía necesaria para evolucionar de esa
        pequeña esfera que está cargada de nutrientes.
      it: |-
        Ricava l’energia necessaria all’evoluzione dalla
        pallina, ricca di sostanze nutritive.
    omega-ruby:
      ja-Hrkt: |-
        ひのひかりで　あかく　いろづく。
        えいようぶんが　すわれて　ちいさい
        たまが　しぼむと　しんかが　ちかい。
      ja: |-
        日の光で　赤く　色づく。
        栄養分が　吸われて　小さい　玉が
        しぼむと　進化が　近い。
      ko: |-
        햇빛으로 빨갛게 물들었다.
        영양분이 흡수되어 작은 구슬이
        시들면 곧 진화한다는 뜻이다.
      en: |-
        Sunlight colors it red. When the small ball is
        drained of nutrients, it shrivels to herald evolution.
      fr: |-
        Il rougit au soleil. Quand la petite boule est à court
        de nutriments, elle fane en signe d’évolution.
      de: |-
        Sonnenlicht färbt es rot. Verliert das kleine Bällchen
        Nährstoffe, welkt es und die Entwicklung beginnt.
      es: |-
        Bajo la luz solar es rojo. La esfera pequeña pierde sus
        nutrientes y se seca para anunciar la evolución.
      it: |-
        La luce solare lo tinge di rosso. Se la pallina esaurisce
        i nutrimenti, si avvizzisce indicando l’evoluzione.
    alpha-sapphire:
      ja-Hrkt: |-
        ちいさな　たまに　つまった
        えいようぶんを　すいとって
        しんかの　エネルギーに　するのだ。
      ja: |-
        小さな　玉に　つまった
        栄養分を　吸い取って
        進化の　エネルギーに　するのだ。
      ko: |-
        작은 구슬에 모인
        영양분을 흡수해
        진화의 에너지로 삼는다.
      en: |-
        It evolves by sucking the energy out of the small
        ball where it had been storing nutrients.
      fr: |-
        Il aspire les nutriments de sa petite boule pour pouvoir
        évoluer.
      de: |-
        Es saugt Nährstoffe, die in seinem Bällchen enthalten sind,
        und nutzt die Energie für seine Entwicklung.
      es: |-
        Obtiene la energía necesaria para evolucionar de esa pequeña
        esfera que está cargada de nutrientes.
      it: |-
        Ricava l’energia necessaria all’evoluzione dalla pallina, ricca
        di sostanze nutritive.
    sword:
      ja-Hrkt: |-
        えいようの　つまった　たまは
        とりポケモンの　だいこうぶつ。
        ついばまれないよう　にげまわる。
      ja: |-
        栄養の　詰まった　玉は
        鳥ポケモンの　大好物。
        ついばまれないよう　逃げまわる。
      ko: |-
        영양이 듬뿍 담긴 구슬을
        새포켓몬들이 아주 좋아한다.
        쪼이지 않기 위해 도망 다닌다.
      zh-Hant: |-
        牠營養豐富的小球
        是鳥寶可夢的最愛。
        為了不被啄到而四處逃跑。
      zh-Hans: |-
        它营养丰富的小球
        是鸟宝可梦的最爱。
        为了不被啄到而四处逃跑。
      en: |-
        It nimbly dashes about to avoid getting pecked
        by bird Pokémon that would love to make off
        with its small, nutrient-rich storage ball.
      fr: |-
        Il s’enfuit à la vue des Pokémon oiseaux,
        dont le mets favori est sa petite boule remplie
        de nutriments.
      de: |-
        Sein nährstoffreiches Bällchen erfreut sich bei
        Vogel-Pokémon großer Beliebtheit. Es ist ständig
        auf der Flucht, damit es nicht gefressen wird.
      es: |-
        Se ve obligado a huir constantemente de los
        Pokémon pájaro, pues su pequeña esfera repleta
        de nutrientes es su manjar predilecto.
      it: |-
        Fugge dai Pokémon alati, ghiotti della
        sua pallina ricca di sostanze nutritive.
    shield:
      ja-Hrkt: |-
        からだが　あかい　チェリンボほど
        えいようが　おおく　たまの　あじも
        あまくて　おいしいよ。
      ja: |-
        体が　赤い　チェリンボほど
        栄養が　多く　玉の　味も
        甘くて　おいしいよ。
      ko: |-
        몸이 빨간 체리버일수록
        영양이 많고 구슬의 맛도
        달고 맛있다.
      zh-Hant: |-
        身體越紅的櫻花寶
        含有的營養越豐富，
        味道也很甜很好吃。
      zh-Hans: |-
        身体越红的樱花宝
        含有的营养越丰富，
        味道也很甜很好吃。
      en: |-
        The deeper a Cherubi’s red, the more nutrients it
        has stockpiled in its body. And the sweeter and
        tastier its small ball!
      fr: |-
        Plus son corps est rouge, plus la saveur
        de sa petite boule gorgée de nutriments
        est sucrée et délicieuse.
      de: |-
        Je stärker die Rotfärbung seines Körpers ist,
        desto mehr Nährstoffe stecken in ihm und umso
        süßer und besser schmeckt sein Bällchen.
      es: |-
        Cuanto más rojo sea su cuerpo, más dulce y
        deliciosa será su pequeña esfera repleta de
        nutrientes.
      it: |-
        Più è rosso, più è ricco di sostanze nutritive
        e più la sua pallina si fa dolce e gustosa.
    legends-arceus:
      en: |-
        Once the fruit growing alongside the main body is large and
        plump, Cherubi will use the nutrients within to evolve. The fruit
        then detaches, becoming nourishment for other creatures.
