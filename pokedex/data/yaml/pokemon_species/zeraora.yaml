zeraora:
  base_happiness: 0
  capture_rate: 3
  color: yellow
  egg_groups:
    - no-eggs
  evolution_chain: zeraora
  evolves_from: ~
  flavor_text:
    ultra-sun:
      ja-Hrkt: |-
        りょうてあしの　ツメを　たいでんさせ
        あいてを　やつざき。　かわされても
        とびちる　でんげきで　かんでんさせる。
      ja: |-
        両手足の　ツメを　帯電させ
        相手を　八つ裂き。　かわされても
        飛び散る　電撃で　感電させる。
      ko: |-
        양 손발톱에 전기를 머금어
        상대를 갈가리 찢는다. 피하더라도
        흩날리는 전격으로 감전시킨다.
      zh-Hant: |-
        會讓雙手雙腳的爪子帶電，
        然後將對手撕裂。就算被躲開，
        也會用飛散的電擊讓對手觸電。
      zh-Hans: |-
        让双手双脚的爪子带电，
        将对手撕得稀碎。即使被躲开，
        也会用飞散的电击让其触电。
      en: |-
        It electrifies its claws and tears its opponents
        apart with them. Even if they dodge its attack,
        they’ll be electrocuted by the flying sparks.
      fr: |-
        Il déchiquette son adversaire avec ses griffes
        chargées d’électricité. Même si sa cible évite
        l’attaque, elle reçoit un coup de jus.
      de: |-
        Mit seinen elektrisierten Krallen reißt es Gegner
        in Stücke. Selbst wenn sie ausweichen, werden
        sie von elektrisch geladenen Funken getroffen.
      es: |-
        Hace jirones al oponente con sus garras
        electrificadas. Aunque este esquive los golpes,
        acaba electrocutado por las descargas.
      it: |-
        Fa a pezzi l’avversario con le unghie cariche di
        elettricità. Anche se il nemico schiva il colpo,
        riceve comunque una scarica folgorante.
    ultra-moon:
      ja-Hrkt: |-
        かみなりが　おちるのと　おなじ
        はやさで　てきに　きゅうせっきん。
        するどい　ツメで　やつざきに　する。
      ja: |-
        雷が　落ちるのと　同じ
        速さで　敵に　急接近。
        鋭い　ツメで　八つ裂きに　する。
      ko: |-
        번개가 떨어지는 것과 같은
        스피드로 적에게 접근한다.
        날카로운 발톱으로 갈가리 찢는다.
      zh-Hant: |-
        會用與落雷相同的速度
        急速接近敵人，然後用
        銳利的爪子把對手撕碎。
      zh-Hans: |-
        用与雷落下相同的速度
        急速接近敌人。
        会用锐利的爪子将对方撕得粉碎。
      en: |-
        It approaches its enemies at the speed of
        lightning, then tears them limb from limb with
        its sharp claws.
      fr: |-
        Il prend l’ennemi par surprise en attaquant
        plus vite que l’éclair, et le débite en morceaux
        avec ses griffes acérées.
      de: |-
        Schnell wie der Blitz nähert es sich seinen
        Feinden, um sie dann mit seinen scharfen
        Klauen in Stücke zu reißen.
      es: |-
        Se acerca a su enemigo de forma tan súbita
        como la caída de un rayo, y lo hace trizas con
        sus afiladas garras.
      it: |-
        Si avvicina all’avversario con la velocità di un
        fulmine e lo fa a pezzi con le unghie affilate.
    sword:
      ja-Hrkt: |-
        カミナリに　ひってきする　スピードで
        はしり　だいでんあつを　はっする
        ツメで　てきを　やつざきにする。
      ja: |-
        雷に　匹敵する　スピードで
        走り　大電圧を　発する
        ツメで　敵を　八つ裂きにする。
      ko: |-
        번개에 필적하는 스피드로
        달려나가 고전압의 발톱으로
        상대를 갈가리 찢는다.
      zh-Hant: |-
        以媲美閃電的速度奔跑，
        用能釋放高壓電的爪子
        將敵人撕得粉碎。
      zh-Hans: |-
        以媲美闪电的速度奔跑，
        用能释放高压电的爪子
        将敌人撕得粉碎。
      en: |-
        It runs as fast as lightning strikes, shredding its
        opponents with its high-voltage claws.
      fr: |-
        Il fonce sur ses ennemis à la vitesse de l’éclair
        et les déchiquette à l’aide de ses griffes chargées
        à haute tension.
      de: |-
        Es läuft so schnell wie der Blitz und reißt Gegner
        mit seinen Krallen, die mit Hochspannung
        geladen sind, in Stücke.
      es: |-
        Tan veloz como el rayo, hace trizas a cualquier
        rival con sus garras cargadas de electricidad de
        alto voltaje.
      it: |-
        Dotato di una velocità fulminea, fa a pezzi
        l’avversario con i suoi artigli carichi di elettricità
        ad alta tensione.
    shield:
      ja-Hrkt: |-
        てあしの　にくきゅうから　ほうでん。
        ゼラオラが　かけぬけると　イナズマが
        ひかり　らいめいが　とどろく。
      ja: |-
        手足の　肉球から　放電。
        ゼラオラが　駆け抜けると　稲妻が
        光り　雷鳴が　轟く。
      ko: |-
        손발의 볼록살에서 전기를 내보낸다.
        제라오라가 달려나가면 번개가
        치고 우렛소리가 울려 퍼진다.
      zh-Hant: |-
        從手腳的肉球放電。
        當捷拉奧拉奔馳而過時，
        周圍將充斥著電閃雷鳴。
      zh-Hans: |-
        从手脚的肉球放电。
        当捷拉奥拉奔驰而过时，
        周围将充斥着电闪雷鸣，
      en: |-
        Electricity sparks from the pads on its limbs.
        Wherever Zeraora runs, lightning flashes and
        thunder echoes.
      fr: |-
        Il envoie des décharges électriques avec
        les coussinets de ses pattes. Quand il court,
        on peut voir des éclairs et entendre la foudre.
      de: |-
        Über die Ballen an seinen Pfoten entlädt es
        Elektrizität. Wenn Zeraora an einem vorbeirennt,
        zuckt ein Blitz auf und man hört Donnergrollen.
      es: |-
        Las almohadillas de sus patas desprenden
        descargas eléctricas. Cuando corre, hace que
        caigan rayos y reverberen los truenos.
      it: |-
        Emette scariche elettriche dai cuscinetti delle
        zampe. Sfreccia a tutta velocità accompagnato
        da saette e rombi di tuono.
