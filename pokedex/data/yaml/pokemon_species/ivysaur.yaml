    sword:
      ja-Hrkt: |-
        せなかの　つぼみが　おおきく
        そだってくると　２ほんあしで
        たつことが　できなくなるらしい。
      ja: |-
        背中の　つぼみが　大きく
        育ってくると　２本脚で
        立つことが　できなくなるらしい。
      ko: |-
        등에 있는 봉오리가 크게
        자라면 두 다리로
        설 수 없게 되는 듯하다.
      zh-Hant: |-
        當背上的花苞長大之後，
        牠似乎就無法再用兩隻腳
        站立起來了。
      zh-Hans: |-
        当背上的花苞长大之后，
        它似乎就无法再用两只脚
        站立起来了。
      en: |-
        When the bulb on its back grows large, it
        appears to lose the ability to stand on its
        hind legs.
      fr: |-
        Son bulbe dorsal est devenu si gros qu’il ne peut
        plus se tenir sur ses pattes postérieures.
      de: |-
        Sobald die Knospe auf seinem Rücken groß wird,
        kann Bisaknosp nicht mehr auf zwei Beinen
        stehen.
      es: |-
        Cuando le crece bastante el bulbo del lomo,
        pierde la capacidad de erguirse sobre las patas
        traseras.
      it: |-
        Il bulbo sulla schiena è cresciuto così tanto
        da impedirgli di alzarsi in piedi sulle zampe
        posteriori.
    shield:
      ja-Hrkt: |-
        たいようの　ひかりを　あびるほど
        からだに　ちからが　わいて　せなかの
        つぼみが　そだっていく。
      ja: |-
        太陽の　光を　浴びるほど
        体に　力が　わいて　背中の
        つぼみが　育っていく。
      ko: |-
        햇빛을 받을수록
        몸에 힘이 솟아나
        등의 꽃봉오리가 자라난다.
      zh-Hant: |-
        沐浴在陽光下越久，
        身體內會湧出越多力量，
        背上的花苞也會漸漸成長。
      zh-Hans: |-
        沐浴在阳光下越久，
        身体内会涌出越多力量，
        背上的花苞也会渐渐成长。
      en: |-
        Exposure to sunlight adds to its strength.
        Sunlight also makes the bud on its back
        grow larger.
      fr: |-
        La lumière du soleil le rend plus fort et vigoureux.
        Le bulbe sur son dos grossit en conséquence.
      de: |-
        Die Sonne macht es stärker. Die Knospe auf
        seinem Rücken wächst unter dem Einfluss von
        Sonnenlicht.
      es: |-
        La luz del sol lo fortalece y hace que le crezca el
        capullo que tiene en el lomo.
      it: |-
        L’esposizione alla luce solare lo rafforza
        e fa crescere il bocciolo che ha sul dorso.
