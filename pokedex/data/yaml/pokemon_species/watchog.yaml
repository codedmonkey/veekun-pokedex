        目玉や　体を　光らせ
        襲ってきた　敵を　ひるませる。
      ko: |-
        체내의 발광 물질로
        눈이나 몸을 빛나게 하여
        습격해 온 상대를 풀이 죽게 만든다.
      en: |-
        Using luminescent matter, it makes its eyes and
        body glow and stuns attacking opponents.
      fr: |-
        Il intimide l’ennemi en faisant briller son pelage et ses yeux
        grâce à une substance à l’intérieur de son corps.
      de: |-
        Es kann mit einer körpereigenen Substanz seine Augen und
        seinen Torso aufleuchten lassen, um Gegner zu erschrecken.
      es: |-
        Los componentes luminiscentes de su interior hacen que sus
