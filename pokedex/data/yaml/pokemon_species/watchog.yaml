        はっけんすると　しっぽを　たてる。
      ja: |-
        ほほ袋に　ためた　木の実の　タネを
        飛ばして　攻撃。
        敵を　発見すると　尻尾を　立てる。
      ko: |-
        뺨의 주머니에 모아둔 나무열매의
        씨앗을 날려서 공격한다. 적을
        발견하면 꼬리를 세운다.
      en: |-
