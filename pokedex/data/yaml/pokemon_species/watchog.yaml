watchog:
  base_happiness: 70
  capture_rate: 255
  color: brown
  egg_groups:
    - ground
  evolution_chain: patrat
  evolves_from: patrat
  flavor_text:
    black:
      en: |-
        When they see an enemy, their tails
        stand high, and they spit the seeds of
        berries stored in their cheek pouches.
      fr: |-
        Il attaque en crachant les graines des
        Baies qu’il accumule dans ses bajoues.
        S’il voit un ennemi, il dresse la queue.
    white:
      en: |-
        They make the patterns on their bodies
        shine in order to threaten predators.
        Keen eyesight lets them see in the dark.
      fr: |-
        Il intimide l’ennemi en faisant briller
        les motifs de son pelage. Ses yeux
        peuvent voir même dans l’obscurité.
    black-2:
      en: |-
        Using luminescent matter, it
        makes its eyes and body glow
        and stuns attacking opponents.
    white-2:
      en: |-
        Using luminescent matter, it
        makes its eyes and body glow
        and stuns attacking opponents.
    x:
      ja-Hrkt: |-
        たいないの　はっこうぶっしつで
        めだまや　からだを　ひからせ
        おそってきた　てきを　ひるませる。
      ja: |-
        体内の　発光物質で
        目玉や　体を　光らせ
        襲ってきた　敵を　ひるませる。
      ko: |-
        체내의 발광물질로
        눈이나 몸을 빛나게 하여
        습격해 온 상대를 풀이 죽게 만든다.
      en: |-
        Using luminescent matter, it makes its eyes and
        body glow and stuns attacking opponents.
      fr: |-
        Il intimide l’ennemi en faisant briller son pelage et
        ses yeux grâce à une substance à l’intérieur de son
        corps.
      de: |-
        Es kann mit einer körpereigenen Substanz seine
        Augen und seinen Torso aufleuchten lassen,
        um Gegner zu erschrecken.
      es: |-
        Los componentes luminiscentes de su interior hacen
        que sus ojos y su cuerpo brillen, y así intimida a sus
        rivales.
      it: |-
        Fa tentennare il nemico facendo brillare occhi e
        pelliccia grazie a una sostanza fluorescente
        contenuta nel suo corpo.
    'y':
      ja-Hrkt: |-
        ほっぺの　ふくろに　ためた　きのみの
        タネを　とばして　こうげき。てきを
        はっけんすると　しっぽを　たてる。
      ja: |-
        ほほ袋に　ためた　木の実の　タネを
        飛ばして　攻撃。
        敵を　発見すると　尻尾を　立てる。
      ko: |-
        뺨의 주머니에 모아둔 나무열매의
        씨앗을 날려서 공격한다. 적을
        발견하면 꼬리를 세운다.
      en: |-
        When they see an enemy, their tails stand high,
        and they spit the seeds of berries stored in their
        cheek pouches.
      fr: |-
        Il attaque en crachant les graines des Baies qu’il
        accumule dans ses bajoues. S’il voit un ennemi,
        il dresse la queue.
      de: |-
        Bespuckt Gegner mit Kernen von Beeren aus
        seinen Backentaschen. Erspäht es einen Feind,
        richtet es den Schweif auf.
      es: |-
        Ataca lanzando las semillas de las bayas que acumula
        en sus mofletes. Su cola se tensa al avistar a un
        enemigo.
      it: |-
        Attacca sparando i semi delle bacche che ha
        accumulato nelle guance. Se avvista il nemico,
        drizza la coda.
    omega-ruby:
      ja-Hrkt: |-
        たいないの　はっこうぶっしつで
