porygon-z:
  base_happiness: 50
  capture_rate: 30
  color: red
  egg_groups:
    - mineral
  evolution_chain: porygon
  evolves_from: porygon2
  flavor_text:
    diamond:
      en: |-
        Additional software was installed
        to make it a better Pokémon.
        It began acting oddly, however.
    pearl:
      en: |-
        Additional software was installed
        to make it a better Pokémon.
        It began acting oddly, however.
    platinum:
      en: |-
        Its programming was modified to
        enable work in alien dimensions.
        It did not work as planned.
    heartgold:
      en: |-
        Its programming was modified to enable
        it to travel through alien dimensions.
        Seems there might have been an error...
    soulsilver:
      en: |-
        Its programming was modified to enable
        it to travel through alien dimensions.
        Seems there might have been an error...
    black:
      en: |-
        Its programming was modified to
        enable work in alien dimensions.
        It did not work as planned.
      fr: |-
        Il a été modifié pour être capable
        de travailler dans des dimensions
        parallèles, mais c’est un échec.
    white:
      en: |-
        Its programming was modified to
        enable work in alien dimensions.
        It did not work as planned.
      fr: |-
        Il a été modifié pour être capable
        de travailler dans des dimensions
        parallèles, mais c’est un échec.
    black-2:
      en: |-
        Its programming was modified to
        enable work in alien dimensions.
        It did not work as planned.
    white-2:
      en: |-
        Its programming was modified to
        enable work in alien dimensions.
        It did not work as planned.
    x:
      ja-Hrkt: |-
        より　すぐれた　ポケモンに　するため
        プログラムを　ついかしたが　なぜか
        おかしな　こうどうを　はじめた。
      ja: |-
        より　優れた　ポケモンに　するため
        プログラムを　追加したが　なぜか
        おかしな　行動を　はじめた。
      ko: |-
        더욱 우수한 포켓몬으로 만들고자
        프로그램을 추가했지만 어쩐지
        괴상하게 행동하기 시작했다.
      en: |-
        Additional software was installed to make it a better
        Pokémon. It began acting oddly, however.
      fr: |-
        Un logiciel supplémentaire fut installé pour l’améliorer.
        Mais depuis, il se comporte bizarrement.
      de: |-
        Zusätzliche Software wurde installiert, um das
        Pokémon zu verbessern. Seitdem benimmt es
        sich seltsam.
      es: |-
        Se le instaló un software para mejorarlo. Sin embargo,
        comenzó a comportarse de manera extraña.
      it: |-
        È stato aggiunto un software per migliorare le
        prestazioni di questo Pokémon. Agisce in modo
        strano.
    'y':
      ja-Hrkt: |-
        いじげん　くうかんを　じゆうに
        いどうできるように　プログラムを
        しゅうせいしたが　ミスした　らしい。
      ja: |-
        異次元空間を　自由に
        移動できるように　プログラムを
        修正したが　ミスした　らしい。
      ko: |-
        다른 차원의 공간을 자유롭게
        이동할 수 있도록 프로그램을
        수정했지만 실수한 것 같다.
      en: |-
        Its programming was modified to enable it to travel
        through alien dimensions. Seems there might have
        been an error...
      fr: |-
        On a modifié son programme pour qu’il puisse
        parcourir les dimensions, mais ce fut un échec.
      de: |-
        Eine neue Software sollte es zu interdimensionalen
        Reisen befähigen, doch anscheinend ging etwas
        schief.
      es: |-
        Aunque le instalaron un software para desplazarse por
        otras dimensiones, algo no funcionó bien.
      it: |-
        Non sembra funzionare correttamente dopo essere
        stato riprogrammato per muoversi in dimensioni
        sconosciute.
    omega-ruby:
      ja-Hrkt: |-
        より　すぐれた　ポケモンに　するため
        プログラムを　ついかしたが　なぜか
        おかしな　こうどうを　はじめた。
      ja: |-
        より　優れた　ポケモンに　するため
        プログラムを　追加したが　なぜか
        おかしな　行動を　はじめた。
      ko: |-
        더욱 우수한 포켓몬으로 만들고자
        프로그램을 추가했지만 어쩐지
        괴상하게 행동하기 시작했다.
      en: |-
        Additional software was installed to make it a better
        Pokémon. It began acting oddly, however.
      fr: |-
        Un logiciel supplémentaire fut installé pour l’améliorer.
        Mais depuis, il se comporte bizarrement.
      de: |-
        Zusätzliche Software wurde installiert, um das Pokémon zu
        verbessern. Seitdem benimmt es sich seltsam.
      es: |-
        Se le instaló un software para mejorarlo. Sin embargo,
        comenzó a comportarse de manera extraña.
      it: |-
        È stato aggiunto un software per migliorare le prestazioni
        di questo Pokémon. Agisce in modo strano.
    alpha-sapphire:
      ja-Hrkt: |-
        いじげん　くうかんを　じゆうに
        いどうできるように　プログラムを
        しゅうせいしたが　ミスした　らしい。
      ja: |-
        異次元空間を　自由に
        移動できるように　プログラムを
        修正したが　ミスした　らしい。
      ko: |-
        다른 차원의 공간을 자유롭게
        이동할 수 있도록 프로그램을
        수정했지만 실수한 것 같다.
      en: |-
        Its programming was modified to enable it to travel
        through alien dimensions. Seems there might have
        been an error...
      fr: |-
        On a modifié son programme pour qu’il puisse parcourir
        les dimensions, mais ce fut un échec.
      de: |-
        Eine neue Software sollte es zu interdimensionalen Reisen
        befähigen, doch anscheinend ging etwas schief.
      es: |-
        Aunque le instalaron un software para desplazarse por otras
        dimensiones, algo no funcionó bien.
      it: |-
        Non sembra funzionare correttamente dopo essere stato
        riprogrammato per muoversi in dimensioni sconosciute.
    sun:
      ja-Hrkt: |-
        さらに　すぐれた　ポケモンを　めざし
        ついかした　プログラムに　ふぐあいが
        あったらしく　うごきが　おかしい。
      ja: |-
        さらに　優れた　ポケモンを　目指し
        追加した　プログラムに　不具合が
        あったらしく　動きが　おかしい。
      ko: |-
        더 우월한 포켓몬을 목표로
        추가한 프로그램에 문제가
        있었는지 움직임이 이상하다.
      zh-Hant: |-
        以成為更優秀的寶可夢為目標
        所新追加的程式好像狀況不佳，
        使得動作變得很奇怪。
      zh-Hans: |-
        以更优秀的宝可梦为目标，
        好像新追加的程序状况不佳，
        动作很奇怪。
      en: |-
        In order to create a more advanced Pokémon, an
        additional program was installed, but apparently
        it contained a defect that makes it move oddly.
      fr: |-
        Il a été modifié pour devenir encore plus
        efficace, mais cela a entraîné plusieurs bugs.
        Maintenant, il se conduit très bizarrement.
      de: |-
        Zusätzliche Software wurde installiert, um das
        Pokémon zu verbessern. Etwas ging jedoch
        schief und seitdem benimmt es sich seltsam.
      es: |-
        Se le instaló un software para mejorarlo. Sin
        embargo, algo salió mal y a raíz de ello comenzó
        a comportarse de manera extraña.
      it: |-
        A volte mostra strani comportamenti a causa
        di un errore nel software aggiuntivo usato
        per migliorare le sue prestazioni.
    moon:
      ja-Hrkt: |-
        いじげんくうかんでの　かつどうを
        めざし　プログラムを　こうしんしたが
        おかしな　きょどうが　めだつ。
      ja: |-
        異次元空間での　活動を
        目指し　プログラムを　更新したが
        おかしな　挙動が　目立つ。
      ko: |-
        다른 차원의 공간에서의 활동을
        목표로 프로그램을 갱신했으나
        괴상한 동작이 눈에 띈다.
      zh-Hant: |-
        以能夠在異次元空間活動為目標
        更新了程式，但是怪異的動作
        非常惹人注目。
      zh-Hans: |-
        为了在异次元空间行动而
        更新了程序，但是其怪异的
        举动却很惹人注目。
      en: |-
        Its program was modified to facilitate
        extra-dimensional activities, but that led to
        noticeably strange behavior.
      fr: |-
        Un nouveau logiciel était censé lui permettre
        de voyager entre les dimensions, mais tout ne
        se passe pas comme prévu et il y a des bugs.
      de: |-
        Eine neue Software sollte es zu
        interdimensionalen Reisen befähigen,
        doch seitdem verhält es sich seltsam.
      es: |-
        La actualización de software que recibió para
        viajar a otras dimensiones ha causado cambios
        extraños y llamativos en su comportamiento.
      it: |-
        Da quando è stato riprogrammato per lavorare
        in dimensioni sconosciute ha assunto
        comportamenti visibilmente strani.
    ultra-sun:
      ja-Hrkt: |-
        ふあんていな　きょどうが　めだつ。
        プログラムを　アップデートした
        ぎじゅつしゃの　うでの　せいらしい。
      ja: |-
        不安定な　挙動が　目立つ。
        プログラムを　アップデートした
        技術者の　腕の　せいらしい。
      ko: |-
        불안정한 거동이 눈에 띈다.
        프로그램을 업데이트한
        기술자의 실력이 문제인 듯하다.
      zh-Hant: |-
        動作明顯地不穩定。
        這個問題似乎要歸咎於
        負責升級程式的技術人員。
      zh-Hans: |-
        不稳定的举动很惹人注目。
        这问题好像要归咎于负责
        升级程序的技术人员的水平。
      en: |-
        Its behavior is noticeably unstable, which is
        apparently due to the incompetence of the
        engineer who updated its programming.
      fr: |-
        Son comportement, manifestement étrange,
        s’expliquerait par l’incompétence du technicien
        qui a mis à jour son système d’exploitation.
      de: |-
        Sein seltsames Verhalten verdankt es offenbar
        der Unfähigkeit des Wissenschaftlers, der seine
        Software aktualisiert hat.
      es: |-
        Llama la atención por su errática conducta, la
        cual se debe a la torpeza de quien realizara la
        actualización de su sistema operativo.
      it: |-
        Mostra un comportamento instabile, da attribuire
        probabilmente alla scarsa competenza di chi ha
        aggiornato il suo software.
    ultra-moon:
      ja-Hrkt: |-
        ついかした　プログラムが　まずかった。
        おかしな　きょどうが　めだつので
        じっけんしっぱい　なのかも　しれない。
      ja: |-
        追加した　プログラムが　まずかった。
        おかしな　挙動が　目立つので
        実験失敗　なのかも　しれない。
      ko: |-
        추가한 프로그램이 좋지 않았다.
        괴상한 동작이 눈에 띄는 걸 보니
        실험에 실패한 것일지도 모른다.
      zh-Hant: |-
        新追加的程式大有問題，
        做出的動作明顯地有些怪異。
        實驗或許可說是失敗了。
      zh-Hans: |-
        追加的程序不太好。
        因为其怪异的举动很惹人注目，
        所以或许是实验失败了。
      en: |-
        A faulty update was added to its programming.
        Its behavior is noticeably strange, so the
        experiment may have been a failure.
      fr: |-
        Le logiciel qu’on lui a implanté était de toute
        évidence défaillant. Il s’agit sans doute d’une
        expérience ratée, vu son étrange comportement.
      de: |-
        Eine fehlerhafte neue Software führte zu seinem
        auffällig seltsamen Verhalten. Vermutlich
        handelt es sich um ein verkorkstes Experiment.
      es: |-
        El software que se le instaló era defectuoso. Tal
        vez se trate de un experimento fallido, a tenor
        de su extraño comportamiento.
      it: |-
        Il software aggiuntivo che gli è stato installato
        aveva dei bug. I suoi comportamenti strani fanno
        pensare che si tratti di un esperimento fallito.
    sword:
      ja-Hrkt: |-
        いじげん　くうかんに　ではいりできる
        プログラムを　ついかしたところ
        きょどうが　ふあんていになった。
      ja: |-
        異次元　空間に　出入りできる
        プログラムを　追加したところ
        挙動が　不安定になった。
      ko: |-
        다른 공간에 드나들 수 있는
        프로그램을 추가한 결과
        움직임이 불안정해졌다.
      zh-Hant: |-
        在追加了能夠自由進出
        異次元空間的程式後，
        動作就變得不穩定了。
      zh-Hans: |-
        在追加了能够进出
        异次元空间的程序之后，
        运行状况就不稳定了。
      en: |-
        Porygon-Z had a program installed to allow it to
        move between dimensions, but the program also
        caused instability in Porygon-Z’s behavior.
      fr: |-
        Depuis qu’on lui a ajouté un programme
        permettant de voyager entre les dimensions,
        son comportement est devenu instable.
      de: |-
        Seit eine neue Software installiert wurde, die es
        zu interdimensionalen Reisen befähigen sollte,
        wurde sein Verhalten instabil.
      es: |-
        Se le instaló un software que le permite entrar
        y salir de otras dimensiones, pero que provocó
        que su comportamiento se volviese inestable.
      it: |-
        Da quando gli è stato installato un programma
        che gli permette di viaggiare in altre dimensioni,
        mostra un comportamento instabile.
    shield:
      ja-Hrkt: |-
        ついか　プログラムで　しんかしたと
        いわれるが　ほんとうに　しんかなのか
        がっかいでも　いけんが　わかれる。
      ja: |-
        追加　プログラムで　進化したと
        言われるが　ほんとうに　進化なのか
        学会でも　意見が　分かれる。
      ko: |-
        추가 프로그램으로 진화했다고
        전해지지만 정말 진화인 건지
        학회에서도 의견이 나뉜다.
      zh-Hant: |-
        據說是在追加程式後進化了，
        但牠的改變是否真的是進化，
        在學術界也是意見分歧。
      zh-Hans: |-
        有人说它是通过追加程序进化的，
        但关于它的改变是否真是进化，
        在学会中也存在着意见分歧。
      en: |-
        Some say an additional program made this
        Pokémon evolve, but even academics can’t agree
        on whether Porygon-Z is really an evolution.
      fr: |-
        On dit qu’un nouveau programme l’a fait évoluer,
        mais les avis des scientifiques divergent quant à
        savoir s’il s’agit réellement d’une évolution.
      de: |-
        Es heißt, es habe sich durch eine neue Software
        entwickelt, doch Wissenschaftler sind sich nicht
        einig, ob Porygon-Z wirklich eine Entwicklung ist.
      es: |-
        Se dice que evolucionó con la instalación de un
        nuevo software, pero la comunidad científica
        está dividida respecto a si es o no una evolución.
      it: |-
        Pare che si sia evoluto in seguito all’installazione
        di un programma, ma la comunità scientifica non
        è concorde nel definire ciò un’evoluzione.
    legends-arceus:
      en: |-
        A curious item induced this evolution. The Pokémon's offensive
        capabilities have greatly increased, but the strangeness of its
        behavior has magnified in equal measure. This worries me.
