polteageist:
  base_happiness: 50
  capture_rate: 60
  color: purple
  egg_groups:
    - mineral
    - indeterminate
  evolution_chain: sinistea
  evolves_from: sinistea
  flavor_text:
    sword:
      ja-Hrkt: |-
        アンティークの　ポットに　すみつく。
        ほとんどが　がんさくだが　ごくまれに
        しんさくが　みつかる　ことも。
      ja: |-
        アンティークの　ポットに　棲みつく。
        ほとんどが　贋作だが　ごくまれに
        真作が　見つかる　ことも。
      ko: |-
        앤티크한 찻주전자에 산다.
        대부분 위작이지만 매우 드물게
        진품이 발견되기도 한다.
      zh-Hant: |-
        住在古董茶壺裡。
        雖然大多數都是贗品，
        但偶爾也能發現真貨。
      zh-Hans: |-
        住在古董茶壶里。
        虽然大多数都是赝品，
        但偶尔也能发现真货。
      en: |-
        This species lives in antique teapots.
        Most pots are forgeries, but on rare occasions,
        an authentic work is found.
      fr: |-
        Il élit domicile dans des théières antiques.
        La plupart sont des contrefaçons, mais il lui arrive
        dans de très rares cas de trouver des originaux.
      de: |-
        Sie lassen sich in alten Teekannen nieder. Die
        meisten dieser Kannen sind billige Fälschungen,
        aber es gibt auch ein paar sehr seltene Originale.
      es: |-
        Se hospeda en teteras dignas de un anticuario.
        Las originales son escasísimas, pero existe un
        gran número de burdas falsificaciones.
      it: |-
        Prende dimora in una teiera antica. Quelle
        in circolazione sono quasi tutte contraffatte,
        ma a volte ne trova una autentica.
    shield:
      ja-Hrkt: |-
        のこされた　こうちゃを　みかけると
        じぶんの　からだを　そそぎこむ。
        その　こうちゃは　ポットデスになる。
      ja: |-
        残された　紅茶を　見かけると
        自分の　体を　注ぎこむ。
        その　紅茶は　ポットデスになる。
      ko: |-
        남겨진 홍차를 발견하면
        자신의 몸을 흘러 들어가게 한다.
        그 홍차는 포트데스가 된다.
      zh-Hant: |-
        每當發現喝剩的紅茶，
        牠就會把自己的身體倒進去，
        讓那壺紅茶變成怖思壺。
      zh-Hans: |-
        每当发现喝剩的红茶，
        它就会把自己的身体倒进去，
        让那壶红茶变成怖思壶。
      en: |-
        Leaving leftover black tea unattended is asking
        for this Pokémon to come along and pour itself
        into it, turning the tea into a new Polteageist.
      fr: |-
        Dès qu’il voit un reste de thé noir, il se verse
        dedans pour donner naissance à un Polthégeist.
      de: |-
        Entdeckt es zurückgelassenen Schwarztee, so
        gießt es seinen Körper hinein. Der Tee wird dann
        zu einem Mortipot.
      es: |-
        Si avista una taza de té abandonada a su suerte,
        la rellena vertiendo parte de su propio cuerpo
        para generar otro Polteageist.
      it: |-
        Se trova una tazza di tè abbandonata, ci versa
        dentro un po’ del suo corpo per far nascere
        un Polteageist.
  form_description: {  }
  forms_switchable: false
