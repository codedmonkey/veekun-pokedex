        it bravely take on tough foes. It
        flies in search of warm climates.
    white-2:
      en: |-
        It has a gutsy spirit that makes
        it bravely take on tough foes. It
        flies in search of warm climates.
    x:
      ja-Hrkt: |-
        つよい　あいてにも　ゆうかんに
        たちむかう　こんじょうの　もちぬし。
        あたたかい　とちを　めざして　とぶ。
      ja: |-
        強い　相手にも　勇敢に
        立ち向かう　根性の　持ち主。
        暖かい　土地を　目指して　飛ぶ。
      ko: |-
        강한 상대에게도 용감히
        맞서는 근성의 소유자다.
        따뜻한 땅을 찾아서 난다.
      en: |-
        It has a gutsy spirit that makes it bravely take on
        tough foes. It flies in search of warm climates.
      fr: |-
        Ce Pokémon téméraire n’a pas peur d’affronter
        des ennemis puissants. Il vole en quête de climats
        chauds.
      de: |-
        Es ist sehr mutig und stellt sich auch starken
        Gegnern. Es sucht ständig nach warmen Regionen.
      es: |-
        Es un Pokémon valiente que no teme a los rivales
        fuertes. Vuela en busca de climas templados.
      it: |-
        È molto coraggioso e affronta spavaldo i nemici
        più forti. Migra verso i paesi caldi.
    'y':
      ja-Hrkt: |-
        さむい　きせつは　にがて。あたたかい
        とちを　さがし　１にち　３００キロの
        きょりを　とんで　いどうする。
      ja: |-
        寒い　季節は　苦手。暖かい　土地を
        探し　１日　３００キロの　距離を
        飛んで　移動する。
      ko: |-
        추운 계절에 약하다. 따뜻한
        지방을 찾아 하루에 300km의
        거리를 날아서 이동한다.
      en: |-
        It dislikes cold seasons. They migrate to other
        lands in search of warmth, flying over 180 miles
        a day.
      fr: |-
        Nirondelle ne supporte pas les saisons froides.
        Il vole vers d’autres terres à la recherche de chaleur
        et peut ainsi parcourir 300 km par jour.
      de: |-
        Es mag die kalte Jahreszeit nicht. Daher legt es
        auf der Suche nach wärmeren Gefilden mehr als
        300 km am Tag zurück.
      es: |-
        No le gustan las bajas temperaturas. En las estaciones
        frías se recorre casi 300 km al día en busca de zonas
        cálidas.
      it: |-
        Non ama il freddo. In inverno emigra verso regioni
        calde, viaggiando a una velocità di 300 km al giorno.
    omega-ruby:
      ja-Hrkt: |-
        どんな　つよい　あいてでも　ゆうかんに　いどむ。
        まけても　へこたれない　こんじょうの　もちぬし。
        おなかが　すくと　おおごえで　ないて　しまう。
      ja: |-
        どんな　強い　相手でも　勇敢に　挑む。
        負けても　へこたれない　根性の　持ち主。
        お腹が　空くと　大声で　泣いて　しまう。
      ko: |-
        아무리 강한 상대라도 용감히 맞선다.
        져도 주저앉지 않는 근성의 소유자다.
        배가 고프면 큰 소리로 운다.
      en: |-
        Taillow courageously stands its ground against foes, however
        strong they may be. This gutsy Pokémon will remain defiant
        even after a loss. On the other hand, it cries loudly if it
        becomes hungry.
      fr: |-
        Nirondelle défend courageusement son territoire contre
        ses ennemis, même les plus puissants. Ce vaillant Pokémon
        est toujours prêt à relever un défi, mais s’il a faim, il se met
        à pleurer à chaudes larmes.
      de: |-
        Mutig behauptet Schwalbini sein Territorium gegen
        Eindringlinge, so stark diese auch sein mögen. Dieses
        unerschrockene Pokémon bleibt trotz einer Niederlage
        angriffslustig, heult aber laut, wenn es Hunger hat.
      es: |-
        Taillow se mantiene firme ante sus rivales, sean lo fuertes que
        sean. Este valiente Pokémon seguirá mostrándose desafiante,
        aunque pierda en combate. Además, si se enfada, se pondrá a
        gritar con energía.
      it: |-
        Taillow affronta coraggiosamente persino i nemici più forti.
        Anche in caso di sconfitta rimane fiero e spavaldo.
        Ma quando ha fame, si lamenta rumorosamente.
    alpha-sapphire:
      ja-Hrkt: |-
        すだちを　おえたばかり　なので　よるに　なると
        さみしく　なって　ないてしまう　ことも　ある。
        もりに　すむ　ケムッソを　つかまえて　たべる。
      ja: |-
        巣立ちを　終えたばかり　なので　夜に　なると
        寂しく　なって　泣いてしまう　ことも　ある。
        森に　すむ　ケムッソを　捕まえて　食べる。
      ko: |-
        둥지를 떠난 지 얼마 안 돼서 밤이 되면
        쓸쓸함에 우는 일도 있다.
        숲에 사는 개무소를 잡아먹는다.
      en: |-
        Taillow is young—it has only just left its nest. As a result,
        it sometimes becomes lonesome and cries at night.
        This Pokémon feeds on Wurmple that live in forests.
      fr: |-
        Nirondelle est jeune. Il vient de quitter son nid. Du coup,
        il se sent parfois un peu seul et pleure la nuit. Ce Pokémon
        se nourrit des Chenipotte qu’il trouve dans les forêts.
      de: |-
        Schwalbini ist noch klein, es hat gerade erst sein Nest
        verlassen. Daher fühlt es sich manchmal einsam und weint
        nachts. Dieses Pokémon ernährt sich von Waumpel.
      es: |-
        Taillow es pequeño, está recién salido del nido. Por eso, se
        siente solo con frecuencia y se pone a piar. Este Pokémon
        se alimenta de los Wurmple que hay por el bosque.
      it: |-
        Taillow è molto piccolo, infatti ha appena lasciato il nido.
        Talvolta di notte si sente solo e piange.
        Si nutre dei Wurmple che vivono nella foresta.
