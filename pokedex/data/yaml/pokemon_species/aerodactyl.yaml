    sword:
      ja-Hrkt: |-
        こだいの　どうもうな　ポケモン。
        かんぺきな　ふくげんは　いまの
        かがくでも　ふかのう　らしい。
      ja: |-
        古代の　獰猛な　ポケモン。
        完璧な　復元は
        いまの　科学でも　不可能らしい。
      ko: |-
        고대의 거칠고 사나운 포켓몬이다.
        완벽한 복원은 현대의
        과학으로도 불가능하다고 한다.
      zh-Hant: |-
        古代的凶猛寶可夢。
        據說即使是當今的科學，
        也無法將牠完美地復原。
      zh-Hans: |-
        它是一种古代的凶猛宝可梦。
        据说，就算运用当今最先进的
        科技，也无法将其完美复原。
      en: |-
        This is a ferocious Pokémon from ancient times.
        Apparently even modern technology is incapable
        of producing a perfectly restored specimen.
      fr: |-
        On raconte qu’aujourd’hui encore, il est
        impossible de restaurer à la perfection
        ce Pokémon féroce de l’ère préhistorique.
      de: |-
        Selbst mit moderner Technologie scheint es
        unmöglich, ein perfektes Exemplar von diesem
        wilden urzeitlichen Pokémon zu reproduzieren.
      es: |-
        Un feroz Pokémon de la época prehistórica al
        que no bastan todos los avances tecnológicos
        actuales para regenerar a la perfección.
      it: |-
        È un feroce Pokémon dell’antichità. Pare che
        con la tecnologia odierna non sia possibile
        rigenerarlo perfettamente.
    shield:
      ja-Hrkt: |-
        のこぎりの　ような　キバは
        はがねポケモンの　ひふ　さえ
        ズタズタに　きりさいて　しまう。
      ja: |-
        のこぎりの　ような　キバは
        はがねポケモンの　皮膚さえ
        ズタズタに　切り裂いてしまう。
      ko: |-
        톱 같은 이빨은
        강철포켓몬의 피부도
        갈기갈기 베어 가른다.
      zh-Hant: |-
        擁有像鋸子般的牙齒，
        就連鋼屬性寶可夢的
        皮膚都能撕裂成碎片。
      zh-Hans: |-
        长着锯子般的牙齿。
        甚至连钢属性宝可梦的皮肤
        都会被它的牙齿撕成碎片。
      en: |-
        Aerodactyl’s sawlike fangs can shred skin to
        tatters—even the skin of Steel-type Pokémon.
      fr: |-
        Sa dentition semblable à une scie peut même
        broyer la peau des Pokémon Acier.
      de: |-
        Mit seinen Zähnen, die Sägeblättern gleichen,
