    sun:
      ja-Hrkt: |-
        きょうりゅう　じだいの　ポケモン。
        のこぎりのような　キバで　えものを
        ひきさいて　くっていた。
      ja: |-
        恐竜　時代の　ポケモン。
        のこぎりのような　キバで　獲物を
        引き裂いて　喰っていた。
      ko: |-
        공룡시대의 포켓몬이다.
        톱 같은 엄니로 먹이를
        찢어서 먹었다.
      zh-Hant: |-
        恐龍時代的寶可夢。
        會用鋸子般的牙齒
        將獵物撕碎後吞食。
      zh-Hans: |-
        恐龙时代的宝可梦。
        用锯子一样的牙齿
        将猎物撕碎后吞食。
      en: |-
        A Pokémon from the age of the dinosaurs.
        It used its sawlike fangs to shred its prey
        before eating them.
      fr: |-
        Un Pokémon de l’époque préhistorique.
        Il mangeait ses proies en les déchiquetant
        avec ses crocs acérés comme des scies.
      de: |-
        Es stammt aus dem Zeitalter der Dinosaurier.
        Mit seinen Zähnen, die Sägeblättern gleichen,
        zerreißt es seine Beute, bevor es sie frisst.
      es: |-
        Sus orígenes datan de la era de los dinosaurios.
        Desgarra a sus presas con sus colmillos afilados
        como sierras antes de devorarlas.
      it: |-
        Questo Pokémon, risalente all’epoca dei
        dinosauri, lacerava le prede con le zanne
        affilate come lame per poi divorarle.
    moon:
      ja-Hrkt: |-
        こだいの　おおぞらの　おうじゃ。
        きょだい　いんせきの　らっかで
        ぜつめつした　せつが　ねづよい。
      ja: |-
        古代の　大空の　王者。
        巨大　隕石の　落下で
        絶滅した　説が　根強い。
      ko: |-
        고대 하늘의 왕.
        거대한 운석의 낙하로
        멸종했다는 설이 뿌리깊다.
      zh-Hant: |-
        在古代是廣闊天空的王者。
        因巨大隕石的墜落而滅絕的
        學說在人們心中根深蒂固。
      zh-Hans: |-
        古代广袤天空的王者。
        因巨大陨石的坠落而灭绝的
        学说在人们心中根深蒂固。
      en: |-
        In ancient times, it ruled the skies. A widely
        accepted theory is that it went extinct due to
        a large meteor impact.
      fr: |-
        Le roi des airs à l’époque préhistorique.
        La théorie la plus crédible est qu’il aurait été
        annihilé par la chute d’une énorme météorite.
      de: |-
        Zu Urzeiten war es der Herrscher der Lüfte.
        Es wird allgemein angenommen, dass es infolge
        eines Kometenabsturzes ausstarb.
      es: |-
        Dominaba los cielos en la época prehistórica.
        Se extinguió tras la caída de un gran meteorito,
        según una de las teorías más arraigadas.
      it: |-
        In tempi antichi era il signore dei cieli.
        Secondo una teoria molto diffusa, fu sterminato
        dalla caduta di un meteorite.
    ultra-sun:
      ja-Hrkt: |-
        こはくに　のこされた　いでんしから
        ふくげんさせた。　よそういじょうに
        きょうぼうで　ぎせいしゃも　でた。
      ja: |-
        琥珀に　残された　遺伝子から
        復元させた。　予想以上に
        凶暴で　犠牲者も　でた。
      ko: |-
        호박에 남겨진 유전자로
        복원시켰다. 예상 밖으로
        흉포하여 희생자도 발생했다.
      zh-Hant: |-
        由琥珀中殘留的基因還原而來。
        性情比想像中更加兇暴，
        甚至還出現了犧牲者。
      zh-Hans: |-
        由琥珀中残留的遗传基因复原而来。
        性情比想像的还要粗暴，
        甚至还出现了牺牲者。
      en: |-
        Restored from DNA found in amber, this
        Pokémon exhibited ferocity that was greater
        than expected. Some casualties resulted.
      fr: |-
        Recréé à partir d’ADN contenu dans de l’ambre,
        il s’est avéré plus féroce que prévu et a causé
        la mort de plusieurs personnes.
      de: |-
        Ein grausames Pokémon, das vielen das Leben
        schwer gemacht hat. Es wurde aus Genmaterial
        reproduziert, das in Bernstein enthalten war.
      es: |-
        Recreado a partir de material genético extraído
        del ámbar, es más feroz de lo que se preveía.
        Quien lo subestime lo puede pagar caro.
      it: |-
        Questo Pokémon è stato rigenerato a partire da
        materiale genetico ritrovato nell’ambra. La sua
        inaspettata ferocia ha causato delle vittime.
    ultra-moon:
      ja-Hrkt: |-
        こだいの　おおぞらを　わがものがおで
        とびまわっていた。　じめんに　おりると
        あるくのも　おそく　よわかったらしい。
      ja: |-
        古代の　大空を　我がもの顔で
        飛びまわっていた。　地面に　降りると
        歩くのも　遅く　弱かったらしい。
      ko: |-
        고대의 넓은 하늘을 제집처럼
        날아다녔다. 땅에 내려오면
        걷는 것도 느리고 약했다고 한다.
      zh-Hant: |-
        以高高在上的姿態翱翔在
        古代的天空中。一旦降落到地面
        就會變得很弱，連走路也很慢。
      zh-Hans: |-
        会以一副傲然的姿态翱翔在
        古代的广袤天空中。降落到地面后，
        它好像会变弱，走起路来也会变慢。
      en: |-
        It flew through the open skies over the ancient
        continent as if they were its own. When it
        touched ground, its walk was weak and slow.
      fr: |-
        L’air suffisant qu’il affichait lorsqu’il volait dans
        les cieux s’effaçait vite une fois sur terre, où il
        était faible et peinait à se mouvoir rapidement.
      de: |-
        Dieses antike Pokémon flog einst gebieterisch
        durch die Lüfte. Auf dem Boden hingegen war
        es schwach und konnte nur langsam gehen.
      es: |-
        Dominaba los cielos en la época prehistórica.
        En tierra firme, sin embargo, se revela como un
        Pokémon débil y de movimientos torpes.
      it: |-
        Nei tempi antichi dominava i cieli, ma sulla
        terraferma era debole e lento nei movimenti.
    lets-go-pikachu:
      ja-Hrkt: |-
        コハクから　とりだされた　いでんしを
        けんきゅうして　ふっかつさせた
        おおむかしの　どうもうな　ポケモン。
      ja: |-
        コハクから　取り出された　遺伝子を
        研究して　復活させた
        大昔の　獰猛な　ポケモン。
      ko: |-
        호박에서 추출한 유전자를
        연구해서 부활시킨
        먼 옛날의 사나운 포켓몬.
      zh-Hant: |-
        透過研究取自琥珀中的
        基因而誕生，是生存在
        遠古時代的凶猛寶可夢。
      zh-Hans: |-
        通过研究从琥珀中提取
        出来的基因复活而成，是
        远古时期的凶恶宝可梦。
      en: |-
        A savage Pokémon that died out in ancient
        times. It was resurrected using DNA taken
        from amber.
      fr: |-
        Un Pokémon féroce disparu il y a longtemps.
        Il a été reconstitué à partir d’ADN fossilisé
        dans de l’ambre.
      de: |-
        Dieses wilde Pokémon aus der Urzeit wurde
        mithilfe von in Bernstein eingeschlossenem
        Genmaterial wieder zum Leben erweckt.
      es: |-
        Este Pokémon feroz, extinto hace siglos, fue
        regenerado a partir de ADN extraído de un
        ámbar.
      it: |-
        Estinto già nell’antichità, questo feroce Pokémon
        preistorico è stato rigenerato usando del DNA
        estratto da un pezzo d’ambra.
    lets-go-eevee:
      ja-Hrkt: |-
