    x:
      ja-Hrkt: |-
        こはくに　のこされた　きょうりゅうの
        いでんしから　ふっかつさせた。
        たかいこえで　なきながら　とぶ。
      ja: |-
        こはくに　残された　恐竜の
        遺伝子から　復活させた。
        高い　声で　鳴きながら　飛ぶ。
      ko: |-
        호박에 남아 있던 공룡의
        유전자에서 부활시켰다.
        높은 소리로 울며 난다.
      en: |-
        It was regenerated from a dinosaur’s genetic
        matter that was found in amber. It flies with
        high-pitched cries.
      fr: |-
        Ce Pokémon a été reconstitué à partir d’une cellule
        de dinosaure trouvée dans un morceau d’ambre.
        Il vole très haut en poussant des cris très aigus.
      de: |-
        In Bernstein eingeschlossenes genetisches Material
        eines Dinosauriers war der Ursprung dieses
        Pokémon. Beim Fliegen schreit es schrill.
      es: |-
        Se regeneró a partir de material genético de un
        dinosaurio encontrado en ámbar. Cuando vuela emite
        escandalosos alaridos.
      it: |-
        Rigenerato dal materiale organico di un dinosauro
        ritrovato nell’ambra. Emette versi acuti mentre vola.
    'y':
      ja-Hrkt: |-
        かんだかい　こえで　さけびながら
        こだいの　おおぞらを　とんでいたと
        される　どうもうな　ポケモン。
      ja: |-
        甲高い　声で　叫びながら
        古代の　大空を　飛んでいたとされる
        どうもうな　ポケモン。
      ko: |-
        날카로운 목소리로 울부짖으며
        고대의 넓은 하늘을 날아다녔다고
        여겨지는 거칠고 사나운 포켓몬이다.
      en: |-
        This vicious Pokémon is said to have flown in
        ancient skies while shrieking high-pitched cries.
      fr: |-
        Ce terrible Pokémon a dominé les cieux d’une autre
        époque, terrorisant ses ennemis.
      de: |-
        Dieses grausame, antike Pokémon flog durch die Luft
        und stieß sehr hohe und laute Schreie aus.
      es: |-
        Dicen que este malvado Pokémon volaba por los
        antiguos cielos profiriendo sus agudos gritos.
      it: |-
        Si dice che questo feroce Pokémon volasse nei cieli
        dell’antichità lanciando versi acuti.
    omega-ruby:
      ja-Hrkt: |-
        コハクから　とりだした　いでんしを　さいせいして
        ふっかつした　きょうりゅう　じだいの　ポケモン。
        そらの　おうじゃだったと　そうぞうされている。
      ja: |-
        コハクから　取り出した　遺伝子を　再生して
        復活した　恐竜　時代の　ポケモン。
        空の　王者だったと　想像されている。
      ko: |-
        호박에서 추출한 유전자를 재생하여
        부활한 공룡시대의 포켓몬이다.
        하늘의 왕이었다고 상상된다.
      en: |-
        Aerodactyl is a Pokémon from the age of dinosaurs. It was
        regenerated from genetic material extracted from amber. It is
        imagined to have been the king of the skies in ancient times.
      fr: |-
        Ptéra est un Pokémon de l’ère des dinosaures. Il fut ressuscité
        à partir de cellules extraites d’un morceau d’ambre. On pense
        qu’il était le roi des cieux à l’époque préhistorique.
      de: |-
        Aerodactyl ist ein Pokémon aus dem Zeitalter der Dinosaurier.
        Es wurde aus genetischem Material reproduziert, das aus
        Bernstein gewonnen wurde. Man geht davon aus, dass es
        in grauer Vorzeit der König der Lüfte war.
      es: |-
        Los orígenes de Aerodactyl datan de la era de los dinosaurios.
        Se regeneró a partir de material genético contenido en ámbar.
        Se supone que fue el amo de los cielos en épocas pasadas.
      it: |-
        Aerodactyl risale all’epoca dei dinosauri. È stato rigenerato
        da materiale genetico estratto dall’ambra. Si suppone che
        in tempi antichi fosse considerato il signore dei cieli.
