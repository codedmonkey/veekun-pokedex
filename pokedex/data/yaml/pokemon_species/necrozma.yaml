necrozma:
  base_happiness: 0
  capture_rate: 255
  color: black
  egg_groups:
    - no-eggs
  evolution_chain: necrozma
  evolves_from: ~
  flavor_text:
    sun:
      ja-Hrkt: |-
        ちかで　ねむりに　ついていたようだ。
        たいこに　べつせかいから　やってきたと
        おもわれる　ＵＢらしき　せいぶつ。
      ja: |-
        地下で　眠りに　ついていたようだ。
        太古に　別世界から　やってきたと
        おもわれる　ＵＢらしき　生物。
      ko: |-
        지하에서 잠들어 있던 것 같다.
        태고의 다른 세계에서 왔다고
        추측되는 UB같은 생물이다.
      zh-Hant: |-
        好像一直都沉睡在地底下。
        被認為是在太古時代從另一個世界
        來到此地，是種類似ＵＢ的生物。
      zh-Hans: |-
        好像一直都沉睡在地下。
        被认为是太古时代从其他世界
        来到此地的类似究极异兽的生物。
      en: |-
        Reminiscent of the Ultra Beasts, this life-form,
        apparently asleep underground, is thought to
        have come from another world in ancient times.
      fr: |-
        Une créature endormie sous terre. On suppose
        qu’il s’agit d’une Ultra-Chimère et qu’elle serait
        venue d’un autre monde, il y a bien longtemps.
      de: |-
        Diese einer Ultrabestie ähnelnde Kreatur ist
        wohl vor Urzeiten aus einer anderen Welt
        gekommen und ruhte lange Zeit unter der Erde.
      es: |-
        Se dice que yacía en el interior de la tierra. Se
        cree que esta criatura, parecida a un Ultraente,
        vino de otro mundo hace muchísimo tiempo.
      it: |-
        Pare che questo essere simile a un’Ultracreatura
        sia giunto da un altro mondo in tempi antichi e
        sia rimasto a lungo dormiente sottoterra.
    moon:
      ja-Hrkt: |-
        ひかりが　エネルギーげん　らしい。
        レーザーこうを　ぶっぱなしまくる
        ひじょうに　きょうぼうな　せいしつ。
      ja: |-
        光が　エネルギー源　らしい。
        レーザー光を　ぶっ放しまくる
        非常に　凶暴な　性質。
      ko: |-
        빛이 에너지원인 듯하다.
        레이저 광선을 마구 쏘아대는
        매우 난폭한 성질을 가졌다.
      zh-Hant: |-
        光似乎是牠的能量來源。
        毫無節制地不停發射雷射，
        性格非常凶暴。
      zh-Hans: |-
        光似乎是它的能量源。
        一个劲儿地发射激光，
        性格非常粗暴。
      en: |-
        Light is apparently the source of its energy.
        It has an extraordinarily vicious disposition
        and is constantly firing off laser beams.
      fr: |-
        La lumière semble être sa source d’énergie.
        Une créature extrêmement agressive, capable
        d’émettre des rayons laser au moindre prétexte.
      de: |-
        Dieses extrem grausame Lebewesen wandelt
        Licht in Energie um und stößt unablässig
        Laserstrahlen aus.
      es: |-
        Este Ultraente parece alimentarse de luz. Posee
        un carácter muy hostil y no duda en lanzar
        rayos láser.
      it: |-
        La luce sembra essere la sua fonte di energia.
        È estremamente aggressivo e gli basta molto
        poco per mettersi a sparare raggi laser.
    ultra-sun:
      ja-Hrkt: |-
        エネルギーとなる　ひかりを　もとめて
        あばれる　すがたは　どこか　くるしげ。
        べつの　せかいの　そんざい　らしい。
      ja: |-
        エネルギーとなる　光を　求めて
        暴れる　姿は　どこか　苦しげ。
        別の　世界の　存在　らしい。
      ko: |-
        에너지인 빛을 찾아 날뛰는 모습은
        어딘지 모르게 괴로워 보인다.
        다른 세계의 존재인 듯하다.
      zh-Hant: |-
        為了尋求作為能量的光
        而發狂的牠看起來有些痛苦。
        似乎是來自於其他世界。
      zh-Hans: |-
        为了寻找作为能量的光
        而发狂的样子看上去有些痛苦。
        好像存在于其他世界。
      en: |-
        It looks somehow pained as it rages around in
        search of light, which serves as its energy.
        It’s apparently from another world.
      fr: |-
        Il semble souffrir dans sa recherche désespérée
        de lumière, sa source d’énergie. On pense
        qu’il vient d’un autre monde.
      de: |-
        Diese Kreatur stammt wohl aus einer anderen
        Welt. Sie wirkt gequält, wenn sie auf der Suche
        nach Licht, seiner Energiequelle, herumwütet.
      es: |-
        La luz es su fuente de energía y la busca con tal
        desespero que da la impresión de que sufre.
        Parece ser una criatura de otro mundo.
      it: |-
        Pare che sia una creatura di un altro mondo.
        La luce è la sua fonte d’energia e la cerca con
        furia, rivelando sofferenza.
    ultra-moon:
      ja-Hrkt: |-
        ひかりが　エネルギーげん。　ひかりを
        くらわないで　いると　ふじゅんぶつが
        たまり　くろずんで　うごけなくなる。
      ja: |-
        光が　エネルギー源。　光を
        喰らわないで　いると　不純物が
        たまり　黒ずんで　動けなくなる。
      ko: |-
        빛이 에너지원이다.
        빛을 받지 못하면 불순물이 쌓여서
        검게 변해 움직일 수 없게 된다.
      zh-Hant: |-
        光是牠的能量來源。如果一段時間
        沒吃到光，雜質就會逐漸累積，
        使得牠身體發黑且變得無法動彈。
      zh-Hans: |-
        光是它的能量源。如果不吃
        光的话，杂质会慢慢积聚，
        它就会发黑而变得不能动弹。
      en: |-
        Light is the source of its energy. If it isn’t
        devouring light, impurities build up in it and on it,
        and Necrozma darkens and stops moving.
      fr: |-
        S’il ne dévore pas assez de lumière, sa source
        d’énergie, il accumule les impuretés. Il noircit
        et finit par ne plus pouvoir bouger.
      de: |-
        Licht ist seine Energiequelle. Kann es dieses
        nicht verschlingen, sammeln sich Unreinheiten
        an und es wird schwarz und regungslos.
      es: |-
        La luz es su fuente de energía. Si no absorbe la
        suficiente, empieza a acumular impurezas que
        hacen que se quede negruzco e inmóvil.
      it: |-
        La luce è la sua fonte di energia. Quando non
        riesce a consumarne, accumula impurità che lo
        scuriscono e gli impediscono di muoversi.
    sword:
      ja-Hrkt: |-
        ひかりを　エネルギーに　いきている。
        ちかで　ねむっていたため　たいないに
        たまった　ふじゅんぶつで　くろずむ。
      ja: |-
        光を　エネルギーに　生きている。
        地下で　眠っていたため　体内に
        溜まった　不純物で　黒ずむ。
      ko: |-
        빛을 에너지원으로 하여 살고 있다.
        지하에 잠들어 있었기 때문에 체내에
        쌓인 불순물에 의해 검게 변했다.
      zh-Hant: |-
        光芒是牠維持生命的能量。
        由於一直沉睡在地下，身體
        因積存在體內的雜質而發黑。
      zh-Hans: |-
        光芒是它维持生命的能量。
        由于一直沉睡于地下，身体
        因积存在体内的杂质而发黑。
      en: |-
        It survives by absorbing light. After a long time
        spent slumbering underground, impurities
        accumulated within it, causing its body to darken.
      fr: |-
        La lumière est sa source d’énergie. Les impuretés
        que son corps a accumulées en dormant sous terre
        lui ont donné cette couleur noire.
      de: |-
        Es zieht seine Lebensenergie aus Licht. Weil es in
        der Erde ruhte, haben sich in seinem Körper
        Unreinheiten angesammelt und es wurde schwarz.
      es: |-
        La luz es su fuente de energía. Se volvió negro
        debido a las impurezas acumuladas en su cuerpo
        mientras yacía en el interior de la tierra.
      it: |-
        La luce è la sua fonte d’energia. Deve il colore
        nero del corpo alle impurità accumulatesi al suo
        interno mentre giaceva addormentato sottoterra.
    shield:
      ja-Hrkt: |-
        いきるために　ひかりを　もとめて
        あばれまわる。　レーザーこうせんを
        はなち　あらゆるものを　きりきざむ。
      ja: |-
        生きるために　光を　求めて
        暴れまわる。　レーザー光線を
        放ち　あらゆるものを　切り刻む。
      ko: |-
        살기 위해 빛을 찾아 날뛰며
        돌아다닌다. 레이저 광선을 쏘아
        온갖 것을 산산조각 낸다.
      zh-Hant: |-
        為生存而發狂般地尋找著光。
        會發射出雷射光，
        將所有東西切成碎片。
      zh-Hans: |-
        为生存而发狂般地寻找着光。
        会发射出激光，
        将所有东西切成碎片。
      en: |-
        It needs light to survive, and it goes on a
        rampage seeking it out. Its laser beams will
        cut anything to pieces.
      fr: |-
        Sa quête de lumière, sa source de vie, le rend
        violent. Il détruit tout sur son passage avec
        ses rayons laser.
      de: |-
        Auf der Suche nach Licht, das es zum Überleben
        benötigt, wütet es umher. Es setzt Laserstrahlen
        frei, die alles zerteilen.
      es: |-
        Con sus rayos láser destruye todo a su paso en
        busca de luz para sustentarse.
      it: |-
        Cerca con furia la luce di cui si nutre,
        distruggendo ogni cosa al suo passaggio
        con i suoi micidiali raggi laser.
