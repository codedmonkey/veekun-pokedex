klinklang:
  base_happiness: 50
  capture_rate: 30
  color: gray
  egg_groups:
    - mineral
  evolution_chain: klink
  evolves_from: klang
  flavor_text:
    black:
      en: |-
        Its red core functions as an energy
        tank. It fires the charged energy
        through its spikes into an area.
      fr: |-
        Son noyau rouge lui permet d’accumuler
        de l’énergie qu’il projette ensuite aux
        alentours grâce à ses pics.
    white:
      en: |-
        The gear with the red core is
        rotated at high speed for a
        rapid energy charge.
      fr: |-
        Il accumule rapidement de l’énergie en
        faisant tourner très vite le rouage
        qui contient son noyau rouge.
    black-2:
      en: |-
        The minigear spins at high speed. Then
        the energy from the red core charges
        the minigear to make it ready to fire.
    white-2:
      en: |-
        The minigear spins at high speed. Then
        the energy from the red core charges
        the minigear to make it ready to fire.
    x:
      ja-Hrkt: |-
        あかい　コアの　ついた　ギアを
        こうそくかいてんさせて　エネルギーを
        きゅうそくチャージ　するのだ。
      ja: |-
        赤い　コアの　ついた　ギアを
        高速回転させて　エネルギーを
        急速チャージ　するのだ。
      ko: |-
        빨간 코어가 달린 기어를
        고속 회전시켜서 에너지를
        급속 충전한다.
      en: |-
        The gear with the red core is rotated at high speed
        for a rapid energy charge.
      fr: |-
        Il accumule rapidement de l’énergie en faisant tourner
        très vite le rouage qui contient son noyau rouge.
      de: |-
        Indem es das Rad mit dem roten Zentrum mit
        hohem Tempo zum Rotieren bringt, kann es eine
        Turboladung durchführen.
      es: |-
        Recarga su energía rápidamente haciendo girar con
        gran celeridad el engranaje equipado con un núcleo
        rojo.
      it: |-
        Facendo girare velocemente l’ingranaggio dotato
        del nucleo rosso, accumula una grande quantità di
        energia.
    'y':
      ja-Hrkt: |-
        あかい　コアは　エネルギータンクの
        やくわり。チャージした　エネルギーを
        トゲから　しゅういに　うちだす。
      ja: |-
        赤い　コアは　エネルギータンクの
        役割。チャージした　エネルギーを
        トゲから　周囲に　撃ち出す。
      ko: |-
        빨간 코어는 에너지 탱크
        역할을 한다. 가시를 이용해
        모아둔 에너지를 주변에 쏘아댄다.
      en: |-
        Its red core functions as an energy tank. It fires the
        charged energy through its spikes into an area.
      fr: |-
        Son noyau rouge lui permet d’accumuler de l’énergie
        qu’il projette ensuite aux alentours grâce à ses pics.
      de: |-
        Der rote Zentralbestandteil dient als Energiespeicher.
        Darin geladene Energie feuert es über seine Stacheln
        ab.
      es: |-
        El núcleo rojo sirve como depósito de la energía que
        expulsa por las púas una vez que está cargado.
      it: |-
        Il nucleo rosso serve da serbatoio di energia, che
        poi spara intorno a sé attraverso gli spuntoni.
    omega-ruby:
      ja-Hrkt: |-
        あかい　コアの　ついた　ギアを
        こうそくかいてんさせて　エネルギーを
        きゅうそくチャージ　するのだ。
      ja: |-
        赤い　コアの　ついた　ギアを
        高速回転させて　エネルギーを
        急速チャージ　するのだ。
      ko: |-
        빨간 코어가 달린 기어를
        고속 회전시켜서 에너지를
        급속 충전한다.
      en: |-
        The gear with the red core is rotated at high speed
        for a rapid energy charge.
      fr: |-
        Il accumule rapidement de l’énergie en faisant tourner très vite
        le rouage qui contient son noyau rouge.
      de: |-
        Indem es das Rad mit dem roten Zentrum mit hohem Tempo
        zum Rotieren bringt, kann es eine Turboladung durchführen.
      es: |-
        Recarga su energía rápidamente haciendo girar con gran
        celeridad el engranaje equipado con un núcleo rojo.
      it: |-
        Facendo girare velocemente l’ingranaggio dotato del nucleo
        rosso, accumula una grande quantità di energia.
    alpha-sapphire:
      ja-Hrkt: |-
        あかい　コアは　エネルギータンクの
        やくわり。チャージした　エネルギーを
        トゲから　しゅういに　うちだす。
      ja: |-
        赤い　コアは　エネルギータンクの
        役割。チャージした　エネルギーを
        トゲから　周囲に　撃ち出す。
      ko: |-
        빨간 코어는 에너지 탱크
        역할을 한다. 가시를 이용해
        모아둔 에너지를 주변에 쏘아댄다.
      en: |-
        Its red core functions as an energy tank. It fires the
        charged energy through its spikes into an area.
      fr: |-
        Son noyau rouge lui permet d’accumuler de l’énergie
        qu’il projette ensuite aux alentours grâce à ses pics.
      de: |-
        Der rote Zentralbestandteil dient als Energiespeicher.
        Darin geladene Energie feuert es über seine Stacheln ab.
      es: |-
        El núcleo rojo sirve como depósito de la energía que expulsa
        por las púas una vez que está cargado.
      it: |-
        Il nucleo rosso serve da serbatoio di energia, che poi spara
        intorno a sé attraverso gli spuntoni.
    sword:
      ja-Hrkt: |-
        トゲの　さきから　つよい　でんげきを
        はっしゃ。　あかいコアに　たくさんの
        エネルギーを　たくわえている。
      ja: |-
        棘の　先から　強い　電撃を
        発射。　赤いコアに　たくさんの
        エネルギーを　蓄えている。
      ko: |-
        가시 끝에서 강한 전격을
        발사한다. 빨간 코어에 많은
        에너지를 비축하고 있다.
      zh-Hant: |-
        會從尖刺的前端發出強力
        電擊。紅色核心裡填充著
        非常多的能量。
      zh-Hans: |-
        会从尖刺的前端发出强力
        电击。红色核心里填充着
        非常多的能量。
      en: |-
        From its spikes, it launches powerful blasts of
        electricity. Its red core contains an enormous
        amount of energy.
      fr: |-
        Il peut envoyer de terribles décharges électriques
        de la pointe de ses pics. Il accumule de grandes
        quantités d’énergie dans son noyau rouge.
      de: |-
        Die Stachelspitzen können starke Elektrizität
        abfeuern. Im roten Zentralbestandteil sind
        Unmengen von Energie gespeichert.
      es: |-
        Emite fuertes descargas eléctricas por la punta
        de las púas. Acumula una gran cantidad de
        energía en su núcleo rojo.
      it: |-
        Emette una forte scarica elettrica dall’estremità
        dei suoi spuntoni. Il nucleo rosso contiene
        un’enorme quantità di energia.
    shield:
      ja-Hrkt: |-
        ３つの　ギアを　こうそくかいてん。
        あらたに　ふえた　トゲの　ついた
        ギアは　いきものでは　ないのだ。
      ja: |-
        ３つの　ギアを　高速回転。
        新たに　増えた　棘の　ついた
        ギアは　生き物では　ないのだ。
      ko: |-
        3개의 기어가 고속 회전한다.
        가시가 달려 있는 새로 생긴
        기어는 생물이 아니다.
      zh-Hant: |-
        讓３個齒輪高速旋轉。
        新增出來的那個帶著
        尖刺的齒輪並不是生物。
      zh-Hans: |-
        让３个齿轮高速旋转。
        新增出来的那个带着
        尖刺的齿轮并不是生物。
      en: |-
        The three gears that compose this Pokémon
        spin at high speed. Its new spiked gear isn’t
        a living creature.
      fr: |-
        Bien que son nouveau rouage à pointes
        ne soit pas doué de vie, il parvient à le faire
        tourner à grande vitesse avec les deux autres.
      de: |-
        Dieses Pokémon besteht aus drei schnell
        rotierenden Zahnrädern. Das neue dritte Rad
        mit den Stacheln ist unbelebt.
      es: |-
        Las tres ruedas dentadas giran a gran velocidad.
        El aro metálico dotado de púas no es materia
        viva.
      it: |-
        I suoi tre ingranaggi girano ad altissima velocità.
        Quello con gli spuntoni, apparso dopo
        l’evoluzione, è inanimato.
