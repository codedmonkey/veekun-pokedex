terrakion:
  base_happiness: 35
  capture_rate: 3
  color: gray
  egg_groups:
    - no-eggs
  evolution_chain: terrakion
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        This Pokémon came to the defense of
        Pokémon that had lost their homes in
        a war among humans.
      fr: |-
        Il a combattu les humains pour protéger
        les Pokémon ayant perdu leur foyer à
        cause de leurs guerres fratricides.
    white:
      en: |-
        Its charge is strong enough to break
        through a giant castle wall in one blow.
        This Pokémon is spoken of in legends.
      fr: |-
        Sa puissance d’impact lui permet
        d’enfoncer d’un seul coup le rempart
        d’un château. Un Pokémon de légende.
    black-2:
      en: |-
        Spoken of in legend, this Pokémon used
        its phenomenal power to destroy a castle
        in its effort to protect Pokémon.
    white-2:
      en: |-
        Spoken of in legend, this Pokémon used
        its phenomenal power to destroy a castle
        in its effort to protect Pokémon.
    x:
      ja-Hrkt: |-
        きょだいな　じょうへきを　いちげきで
        とっぱするほどの　とっしんりょく。
        でんせつで　かたられる　ポケモン。
      ja: |-
        巨大な　城壁を
        一撃で　突破するほどの　突進力。
        伝説で　語られる　ポケモン。
      ko: |-
        거대한 성벽을 일격에
        돌파할 만한 돌진력을 가졌다.
        전설로 전해지는 포켓몬이다.
      en: |-
        Its charge is strong enough to break through a
        giant castle wall in one blow. This Pokémon is
        spoken of in legends.
      fr: |-
        Sa puissance d’impact lui permet d’enfoncer d’un
        seul coup le rempart d’un château. Un Pokémon de
        légende.
      de: |-
        Seine Angriffskraft genügt, um selbst mächtige
        Wälle niederzureißen. Ein Held zahlreicher Legenden.
      es: |-
        Su potencia al embestir es capaz de derribar las
        murallas de un castillo. Las leyendas hablan de sus
        proezas.
      it: |-
        Quando carica, ha una forza tale da sfondare
        un’enorme muraglia. Si racconta di lui nelle leggende.
    'y':
      ja-Hrkt: |-
        でんせつで　かたられる　ポケモン。
        ポケモンを　まもるため　じまんの
        パワーで　しろを　こわした。
      ja: |-
        伝説で　語られる　ポケモン。
        ポケモンを　守るため　自慢の
        パワーで　城を　壊した。
      ko: |-
        전설로 전해지는 포켓몬.
        포켓몬을 지키기 위해 자랑스러운
        파워로 성을 부쉈다.
      en: |-
        Spoken of in legend, this Pokémon used its
        phenomenal power to destroy a castle in its effort
        to protect Pokémon.
      fr: |-
        Un Pokémon de légende. Grâce à sa puissance
        phénoménale, il aurait détruit un château pour sauver
        des Pokémon.
      de: |-
        Ein in Legenden besungenes Pokémon. Mit seinen
        einzigartigen Kräften zerstörte es zum Schutz der
        Pokémon ein Schloss.
      es: |-
        Las leyendas hablan de este Pokémon, que derribó
        un castillo con su propia fuerza para proteger a otros
        Pokémon.
      it: |-
        Si racconta di lui nelle leggende. Per salvare i
        Pokémon, ha distrutto un castello con il suo
        immenso potere.
    omega-ruby:
      ja-Hrkt: |-
        きょだいな　じょうへきを　いちげきで
        とっぱするほどの　とっしんりょく。
        でんせつで　かたられる　ポケモン。
      ja: |-
        巨大な　城壁を
        一撃で　突破するほどの　突進力。
        伝説で　語られる　ポケモン。
      ko: |-
        거대한 성벽을 일격에
        돌파할 만한 돌진력을 가졌다.
        전설로 전해지는 포켓몬이다.
      en: |-
        Its charge is strong enough to break through a
        giant castle wall in one blow. This Pokémon is
        spoken of in legends.
      fr: |-
        Sa puissance d’impact lui permet d’enfoncer d’un seul coup
        le rempart d’un château. Un Pokémon de légende.
      de: |-
        Seine Angriffskraft genügt, um selbst mächtige Wälle
        niederzureißen. Ein Held zahlreicher Legenden.
      es: |-
        Su potencia al embestir es capaz de derribar las murallas de
        un castillo. Las leyendas hablan de sus proezas.
      it: |-
        Quando carica, ha una forza tale da sfondare un’enorme
        muraglia. Si racconta di lui nelle leggende.
    alpha-sapphire:
      ja-Hrkt: |-
        でんせつで　かたられる　ポケモン。
        ポケモンを　まもるため　じまんの
        パワーで　しろを　こわした。
      ja: |-
        伝説で　語られる　ポケモン。
        ポケモンを　守るため　自慢の
        パワーで　城を　壊した。
      ko: |-
        전설로 전해지는 포켓몬.
        포켓몬을 지키기 위해 자랑스러운
        파워로 성을 부쉈다.
      en: |-
        Spoken of in legend, this Pokémon used its
        phenomenal power to destroy a castle in its effort
        to protect Pokémon.
      fr: |-
        Un Pokémon de légende. Grâce à sa puissance phénoménale,
        il aurait détruit un château pour sauver des Pokémon.
      de: |-
        Ein in Legenden besungenes Pokémon. Mit seinen
        einzigartigen Kräften zerstörte es zum Schutz der
        Pokémon ein Schloss.
      es: |-
        Las leyendas hablan de este Pokémon, que derribó un castillo
        con su propia fuerza para proteger a otros Pokémon.
      it: |-
        Si racconta di lui nelle leggende. Per salvare i Pokémon, ha
        distrutto un castello con il suo immenso potere.
    sword:
      ja-Hrkt: |-
        けたはずれの　パワーの　もちぬし。
        ちいさな　ポケモンを　いじめる
        あいては　とことん　たたきのめす。
      ja: |-
        けた外れの　パワーの　持ち主。
        小さな　ポケモンを　いじめる
        相手は　とことん　叩きのめす。
      ko: |-
        차원이 다른 파워의 소유자.
        작은 포켓몬을 괴롭히는
        상대는 철저히 때려눕힌다.
      zh-Hant: |-
        擁有異常強大的力量。
        會把欺負弱小寶可夢的
        對手打到再也站不起來。
      zh-Hans: |-
        拥有异常强大的力量。
        会把欺负弱小宝可梦的
        对手打得再也站不起来。
      en: |-
        It has phenomenal power. It will mercilessly crush
        anyone or anything that bullies small Pokémon.
      fr: |-
        Il possède un pouvoir incommensurable.
        Il se montre impitoyable envers ceux
        qui s’en prennent aux petits Pokémon.
      de: |-
        Terrakium verfügt über unvergleichliche Kräfte.
        Wer kleinere Pokémon bedroht oder schlecht
        behandelt, wird von ihm zur Strecke gebracht.
      es: |-
        Posee una fuerza extraordinaria, y combatirá sin
        miramientos contra cualquier adversario que se
        meta con Pokémon más pequeños y débiles.
      it: |-
        Possiede una forza straordinaria. Non ha
        alcuna pietà per quelli che se la prendono
        con i Pokémon più piccoli di loro.
    shield:
      ja-Hrkt: |-
        ポケモンを　まもるため　にんげんに
        たたかいを　いどんだ　でんせつが
        イッシュちほうに　のこされている。
      ja: |-
        ポケモンを　守るため　人間に
        戦いを　挑んだ　伝説が
        イッシュ地方に　残されている。
      ko: |-
        포켓몬을 지키기 위해
        사람에게 승부를 걸었다는
        전설이 하나지방에 남아 있다.
      zh-Hant: |-
        代拉基翁為保護寶可夢
        而與人類作戰的傳說
        在合眾地區廣為流傳。
      zh-Hans: |-
        代拉基翁为保护宝可梦
        而与人类作战的传说
        在合众地区广为流传。
      en: |-
        In Unovan legend, Terrakion battled against
        humans in an effort to protect other Pokémon.
      fr: |-
        Selon une légende d’Unys, Terrakium se serait
        jadis dressé contre les humains pour protéger
        les Pokémon.
      de: |-
        Eine Legende aus der Einall-Region handelt
        davon, wie sich Terrakium gegen die Menschen
        stellte, um die Pokémon zu beschützen.
      es: |-
        Las leyendas de Teselia narran la lucha que libró
        contra los humanos para proteger a los Pokémon.
      it: |-
        Le leggende della regione di Unima narrano
        delle sue lotte contro gli esseri umani per
        proteggere i Pokémon.
