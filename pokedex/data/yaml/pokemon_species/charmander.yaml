        En revanche, lorsqu’il s’énerve, la flamme prend
        de l’importance et brûle plus ardemment.
      de: |-
        Die Flamme auf seiner Schweifspitze zeigt seine
        Gefühlslage an. Sie flackert, wenn Glumanda
        zufrieden ist. Wenn dieses Pokémon wütend wird,
        lodert die Flamme sehr stark.
      es: |-
        La llama que tiene en la punta de la cola arde según sus
        sentimientos. Llamea levemente cuando está alegre y arde
        vigorosamente cuando está enfadado.
      it: |-
        La fiamma sulla punta della coda indica il suo stato emotivo.
        Se la fiamma ondeggia significa che Charmander si sta
        divertendo. Quando il Pokémon si infuria, la fiamma arde
        violentemente.
    lets-go-pikachu:
      ja-Hrkt: |-
        しずかな　ところに　つれていくと
        シッポが　もえてる　ちいさな　おとが
        きこえてくるよ。
      ja: |-
        静かな　ところに　連れていくと
        シッポが　燃えてる　小さな　音が
        聞こえてくるよ。
      ko: |-
        조용한 곳에 데려가면
        꼬리가 타고 있는
        작은 소리가 들린다.
      zh-Hant: |-
        要是把牠帶到安靜的地方，
        就能聽見牠的尾巴燃燒時
        發出的微小聲音。
      zh-Hans: |-
        要是把它带到安静的地方，
        就能听到它的尾巴燃烧时
        发出的微小的声音。
      en: |-
        The flame at the tip of its tail makes a sound as
        it burns. You can only hear it in quiet places.
      fr: |-
        La flammèche au bout de sa queue émet
        un crépitement audible seulement dans
        les endroits calmes.
      de: |-
        An sehr stillen Orten kann man seine brennende
        Schwanzspitze ganz leise lodern hören.
      es: |-
        En lugares silenciosos se puede oír el débil
        chisporroteo de la llama que le arde en la
        punta de la cola.
      it: |-
        Nel silenzio più assoluto si può udire la fiamma
        in cima alla sua coda scoppiettare bruciando.
