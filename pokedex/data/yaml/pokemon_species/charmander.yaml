        楽しい　ときには　ゆらゆら　炎が　ゆれて
        怒った　ときには　めらめら　盛んに　燃える。
      ko: |-
        꼬리의 불꽃은 기분을 표현한다.
        즐거울 때는 흔들흔들 불꽃이 흔들리고
        화가 났을 때는 활활 맹렬히 불타오른다.
      en: |-
