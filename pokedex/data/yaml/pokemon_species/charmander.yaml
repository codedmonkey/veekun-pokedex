    sword:
      ja-Hrkt: |-
        あついものを　このむ　せいかく。
        あめにぬれると　しっぽの　さきから
        けむりが　でるという。
      ja: |-
        熱いものを　好む　性格。
        雨に濡れると　しっぽの　先から
        煙が　出るという。
      ko: |-
        뜨거운 것을 좋아하는 성격이다.
        비에 젖으면 꼬리 끝에서
        연기가 난다고 한다.
      zh-Hant: |-
        天生喜歡熱熱的東西。
        據說當牠被雨淋濕的時候，
        尾巴的末端會冒出煙來。
      zh-Hans: |-
        天生喜欢热热的东西。
        据说当它被雨淋湿的时候，
        尾巴的末端会冒出烟来。
      en: |-
        It has a preference for hot things. When it rains,
        steam is said to spout from the tip of its tail.
      fr: |-
        Il préfère ce qui est chaud.
        En cas de pluie, de la vapeur se forme autour
        de sa queue.
      de: |-
        Dieses Pokémon bevorzugt heiße Dinge.
        Bei Regen soll seine Schwanzspitze dampfen.
      es: |-
        Prefiere las cosas calientes. Dicen que cuando
        llueve le sale vapor de la punta de la cola.
      it: |-
        Ama le cose calde. Si dice che quando piove
        gli esca vapore dalla punta della coda.
    shield:
      ja-Hrkt: |-
        うまれたときから　しっぽに　ほのおが
        ともっている。　ほのおが　きえたとき
        その　いのちは　おわって　しまう。
      ja: |-
        生まれたときから　しっぽに　炎が
        ともっている。　炎が　消えたとき
        その　命は　終わって　しまう。
      ko: |-
        태어날 때부터 꼬리에 불꽃이
        타오르고 있다. 불꽃이 꺼지면
        생명도 다하고 만다.
      zh-Hant: |-
        從出生時開始尾巴上
        就有火焰在燃燒。
        火焰熄滅時，生命也會結束。
      zh-Hans: |-
        生下来的时候，
        尾巴上就有火焰在燃烧。
        火焰熄灭时，它的生命也会结束。
      en: |-
        From the time it is born, a flame burns at the tip
        of its tail. Its life would end if the flame were to
        go out.
      fr: |-
        Depuis sa naissance, une petite flamme brûle
        au bout de sa queue. Si cette flamme s’éteint,
        la vie de ce Pokémon s’éteindra elle aussi.
      de: |-
        Von Geburt an brennt die Flamme auf seiner
        Schwanzspitze. Sobald sie verglimmt, erlischt
        auch sein Lebenslicht.
      es: |-
        Este Pokémon nace con una llama en la punta de
        la cola. Si se le apagara, fallecería.
      it: |-
        Una fiamma gli arde sulla punta della coda
        fin dalla nascita. Se si spegnesse, per lui
        sarebbe la fine.
