    ultra-sun:
      ja-Hrkt: |-
        はなの　ちからが　ないと　キケン。
        でも　すきな　いろと　かたちが
        みつかるまで　たびを　つづけるぞ。
      ja: |-
        花の　力が　ないと　危険。
        でも　好きな　色と　形が
        見つかるまで　旅を　続けるぞ。
      ko: |-
        꽃의 힘이 없으면 위험하다.
        그래도 좋아하는 색과 형태를
        찾을 때까지 여행을 계속한다.
      zh-Hant: |-
        要是沒有花的力量會很危險，
        但在找到自己喜愛的顏色和形狀之前，
        牠都會繼續旅行下去。
      zh-Hans: |-
        如果没有花的力量，就会很危险。
        但是在找到喜爱的颜色和形状之前，
        会不断地旅行。
      en: |-
        It’s not safe without the power of a flower, but
        it will keep traveling around until it finds one
        with the color and shape it wants.
      fr: |-
        Bien qu’il soit vulnérable sans le pouvoir
        de sa fleur, il voyagera jusqu’à en trouver
        une de la couleur et de la forme qu’il préfère.
      de: |-
        Ohne die Kräfte einer Blume ist es relativ
        schutzlos. Es sucht jedoch so lange, bis es
        eine findet, deren Form und Farbe ihm zusagt.
      es: |-
        Sin el poder que le confiere la flor es una presa
        fácil, así que busca una del tamaño y color
        idóneos y no cesa hasta dar con ella.
      it: |-
        Senza il potere di un fiore è vulnerabile, tuttavia
        viaggia senza sosta finché non ne trova uno di
        un colore e di una forma che lo soddisfano.
    ultra-moon:
      ja-Hrkt: |-
        あたまの　かんむりは　はなの
        かふんを　あつめて　つくったもの。
        いやしの　こうかが　ひめられている。
      ja: |-
        頭の　冠は　花の　花粉を
        集めて　作ったもの。
        癒しの　効果が　秘められている。
      ko: |-
        머리의 관은 꽃가루를
        모아서 만든 것이다.
        치유의 효과가 숨겨져 있다.
      zh-Hant: |-
        頭上的冠是收集
        花粉製成的，
        蘊藏著治癒的效果。
      zh-Hans: |-
        头上的冠是收集花粉做成的。
        蕴藏着治愈的效果。
      en: |-
        Flabébé wears a crown made from pollen it’s
        collected from its flower. The crown has hidden
        healing properties.
      fr: |-
        Il confectionne la couronne qui orne sa tête en
        récoltant du pollen. Elle recèle de nombreuses
        propriétés curatives.
      de: |-
        Die Krone auf seinem Kopf hat es sich aus
        Pollen von Blumen gebastelt. Sie besitzt eine
        heilende Wirkung.
      es: |-
        Acumula el polen de las flores para confeccionar
        la tiara que lleva en la cabeza, que cuenta con
        propiedades curativas.
      it: |-
        La corona sulla testa è realizzata con il polline
        che raccoglie dai fiori e ha proprietà curative.
