flabebe:
  base_happiness: 70
  capture_rate: 225
  color: white
  egg_groups:
    - fairy
  evolution_chain: flabebe
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        はなの　ひめた　ちからを　ひきだして
        じざいに　あやつる。フラベベが　もつ
        はなは　もはや　からだの　いちぶだ。
      ja: |-
        花の　秘めた　力を　引き出して
        自在に　操る。フラベベが　持つ　花は
        もはや　体の　一部だ。
      ko: |-
        꽃의 숨겨진 힘을 끌어내어
        자유자재로 조종한다. 플라베베가 지닌
        꽃은 이미 몸의 일부다.
      en: |-
        It draws out and controls the hidden power
        of flowers. The flower Flabébé holds
        is most likely part of its body.
      fr: |-
        Capable de libérer et de contrôler la force cachée
        des plantes. La fleur qu’il tient fait partie de lui.
      de: |-
        Es entlockt Blumen ihre geheimen Kräfte und
        kontrolliert diese nach Belieben. Die Blume,
        die es trägt, ist wie ein Teil seines Körpers.
      es: |-
        Puede controlar el poder oculto de las flores. La flor
        que lleva consigo es como si formara parte de su
        cuerpo.
      it: |-
        È in grado di controllare a piacimento la forza
        nascosta dei fiori. Il fiore a cui si aggrappa fa
        parte del suo stesso corpo.
    'y':
      ja-Hrkt: |-
        きにいった　はなを　みつけると
        いっしょう　その　はなと　くらす。
        かぜに　のって　きままに　ただよう。
      ja: |-
        気に入った　花を　見つけると
        一生　その花と　暮らす。
        風に　乗って　気ままに　漂う。
      ko: |-
        마음에 든 꽃을 발견하면
        평생을 그 꽃과 지낸다.
        바람을 타고 내키는 대로 떠다닌다.
      en: |-
        When it finds a flower it likes, it dwells on
        that flower its whole life long. It floats in the
        wind’s embrace with an untroubled heart.
      fr: |-
        Après avoir trouvé une fleur à son goût, il ne la quitte
        plus de toute sa vie. Il se laisse porter au gré du vent.
      de: |-
        Hat es eine Blume gefunden, die ihm gefällt, lebt es
        sein Leben lang in Symbiose mit ihr. Es lässt sich
        unbekümmert vom Wind treiben.
      es: |-
        En cuanto encuentra una flor de su agrado, la
        convierte en su hogar para toda la vida.
        Flota en el aire a su antojo cabalgando el viento.
      it: |-
        Una volta trovato un fiore di suo gradimento, rimane
        in simbiosi con esso per tutta la vita. Va in giro
        lasciandosi trasportare dal vento.
    omega-ruby:
      ja-Hrkt: |-
        はなの　ひめた　ちからを　ひきだして
