wigglytuff:
  base_happiness: 50
  capture_rate: 50
  color: pink
  egg_groups:
    - fairy
  evolution_chain: jigglypuff
  evolves_from: jigglypuff
  flavor_text:
    red:
      en: |-
        The body is soft
        and rubbery. When
        angered, it willsuck in air and
        inflate itself to
        an enormous size.
    blue:
      en: |-
        The body is soft
        and rubbery. When
        angered, it willsuck in air and
        inflate itself to
        an enormous size.
    yellow:
      en: |-
        Its body is full
        of elasticity. By
        inhaling deeply,it can continue
        to inflate itself
        without limit.
    gold:
      en: |-
        Their fur feels so
        good that if two
        of them snuggletogether, they
        won't want to be
        separated.
    silver:
      en: |-
        It has a very fine
        fur. Take care not
        to make it angry,or it may inflate
        steadily and hit
        with a BODY SLAM.
    crystal:
      en: |-
        The rich, fluffy
        fur that covers
        its body feels sogood that anyone
        who feels it can't
        stop touching it.
    ruby:
      en: |-
        WIGGLYTUFF has large, saucerlike eyes.
        The surfaces of its eyes are always
        covered with a thin layer of tears.If any dust gets in this POKéMON’s
        eyes, it is quickly washed away.
    sapphire:
      en: |-
        WIGGLYTUFF’s body is very flexible.
        By inhaling deeply, this POKéMON can
        inflate itself seemingly without end.Once inflated, WIGGLYTUFF bounces
        along lightly like a balloon.
    emerald:
      en: |-
        Its fur is the ultimate in luxuriousness.
        Sleeping alongside a WIGGLYTUFF is simply
        divine. Its body expands seemingly without
        end when it inhales.
    firered:
      en: |-
        Its fur is extremely fine, dense, and
        supple. The exquisitely pleasant fur
        conveys an image of luxury.
    leafgreen:
      en: |-
        The body is soft and rubbery. When
        angered, it will suck in air and inflate
        itself to an enormous size.
    diamond:
      en: |-
        Its fine fur feels sublime to the
        touch. It can expand its body by
        inhaling air.
    pearl:
      en: |-
        Its fine fur feels sublime to the
        touch. It can expand its body by
        inhaling air.
    platinum:
      en: |-
        Its fine fur feels sublime to the
        touch. It can expand its body by
        inhaling air.
    heartgold:
      en: |-
        Their fur feels so good that if two
        of them snuggle together,
        they won’t want to be separated.
    soulsilver:
      en: |-
        It has a very fine fur. Take care not
        to make it angry, or it may inflate
        steadily and hit with a body slam.
    black:
      en: |-
        Its fine fur feels sublime to the
        touch. It can expand its body by
        inhaling air.
      fr: |-
        Sa fourrure est d’une douceur
        incomparable au toucher. Il 
        peut gonfler en aspirant de l’air.
    white:
      en: |-
        Its fine fur feels sublime to the
        touch. It can expand its body by
        inhaling air.
      fr: |-
        Sa fourrure est d’une douceur
        incomparable au toucher. Il 
        peut gonfler en aspirant de l’air.
    black-2:
      en: |-
        Its fine fur feels so pleasant,
        those who accidentally touch it
        cannot take their hands away.
    white-2:
      en: |-
        Its fine fur feels so pleasant,
        those who accidentally touch it
        cannot take their hands away.
    x:
      ja-Hrkt: |-
        ２ひき　よりそいあうと　おたがいの
        けがわが　きもちよすぎて
        はなれられなく　なってしまう。
      ja: |-
        ２匹　寄り添いあうと　お互いの
        毛皮が　気持ち良すぎて
        離れられなく　なってしまう。
      ko: |-
        2마리가 바싹 붙어 있으면 서로의
        털이 너무 기분 좋아서
        떨어지지 않게 되어버린다.
      en: |-
        Their fur feels so good that if two of them snuggle
        together, they won’t want to be separated.
      fr: |-
        Leur fourrure est si douce que s’ils se font des câlins,
        ils ne voudront plus se séparer.
      de: |-
        Sein Fell ist so flauschig, dass, wenn zwei
        zusammenstehen, sie nicht getrennt werden möchten.
      es: |-
        Su piel es tan suave que si dos de ellos se acurrucan
        juntos, no querrán separarse nunca.
      it: |-
        Hanno un pelo così morbido che se due di loro
        si abbracciano non vogliono più separarsi.
    'y':
      ja-Hrkt: |-
        ボディーに　だんりょくせいが　あり
        おこらせると　いきを　すいこんで
        どんどん　おおきく　ふくらむ。
      ja: |-
        ボディーに　弾力性が　あり
        怒らせると　息を　吸いこんで
        どんどん　大きく　ふくらむ。
      ko: |-
        몸에 탄력성이 있어
        화나게 하면 숨을 들이켜서
        점점 몸을 크게 부풀린다.
      en: |-
        The body is soft and rubbery. When angered,
        it will suck in air and inflate itself to an
        enormous size.
      fr: |-
        En cas de danger, il gonfle d’air son corps doux et
        potelé dans des proportions gigantesques.
      de: |-
        Der Körper dieses Pokémon ist sehr elastisch.
        Bei Gefahr bläht es sich zu enormer Körpergröße auf.
      es: |-
        Su cuerpo es blando y gomoso. Cuando se enfada,
        traga aire y se hincha muchísimo.
      it: |-
        Il suo corpo è morbido e gommoso. Se si arrabbia,
        aspira aria e si gonfia enormemente.
    omega-ruby:
      ja-Hrkt: |-
        おおきな　まるい　ひとみの　ひょうめんには
        なみだの　うすい　まくが　いつも　はっている。
        ほこりが　ついても　すぐに　あらい　ながされる。
      ja: |-
        大きな　丸い　瞳の　表面には
        涙の　薄い　膜が　いつも　張っている。
        ほこりが　ついても　すぐ　洗い　流される。
      ko: |-
        크고 동그란 눈동자 표면에는
        항상 얇은 눈물 막이 쳐져 있다.
        먼지가 들어가도 바로 씻겨 나간다.
      en: |-
        Wigglytuff has large, saucerlike eyes. The surfaces of its eyes
        are always covered with a thin layer of tears. If any dust gets in
        this Pokémon’s eyes, it is quickly washed away.
      fr: |-
        Grodoudou a des yeux immenses et écarquillés. La surface
        de ses yeux est couverte d’une fine couche de larmes.
        Si de la poussière est projetée dans les yeux de ce Pokémon,
        elle est rapidement évacuée.
      de: |-
        Knuddeluff hat handtellergroße Augen, die immer mit
        Tränenflüssigkeit bedeckt sind. Gerät Staub in die Augen
        dieses Pokémon, so wird dieser sofort ausgespült.
      es: |-
        Wigglytuff tiene unos ojos enormes con forma de platillo, que
        siempre están cubiertos de lágrimas. Si se le metiera algo en
        el ojo, enseguida se le saldría solo.
      it: |-
        Wigglytuff è dotato di occhi grandi come dischi, resi lucidi
        da un sottile strato lacrimale in superficie. Se gli va della
        polvere negli occhi, questa è lavata via subito.
    alpha-sapphire:
      ja-Hrkt: |-
        だんりょくせいに　すぐれた　からだは　おおきく
        いきを　すいこむと　どこまでも　ふくれていく。
        ふくらんだ　プクリンは　ふんわり　はねるよ。
      ja: |-
        弾力性に　優れた　体は　大きく
        息を　吸い込むと　どこまでも　膨れていく。
        膨らんだ　プクリンは　ふんわり　跳ねるよ。
      ko: |-
        탄력이 뛰어난 몸은 크게
        숨을 들이마시면 한없이 부푼다.
        부푼 푸크린은 두둥실 떠오른다.
      en: |-
        Wigglytuff’s body is very flexible. By inhaling deeply,
        this Pokémon can inflate itself seemingly without end.
        Once inflated, Wigglytuff bounces along lightly like a balloon.
      fr: |-
        Le corps de Grodoudou est très élastique. S’il inspire
        profondément, ce Pokémon peut se gonfler à volonté.
        Une fois gonflé, Grodoudou peut rebondir comme un ballon.
      de: |-
        Knuddeluffs Körper ist sehr dehnbar. Indem es tief einatmet,
        kann sich dieses Pokémon selbst aufblasen. Wenn es
        aufgepumpt ist, hüpft es wie ein Luftballon umher.
      es: |-
        El cuerpo de Wigglytuff es muy flexible. Dicen que, al aspirar
        aire, puede hincharse sin límites. Y, una vez hinchado, se
        pone a botar como si fuera una pelota.
      it: |-
        Wigglytuff è molto elastico. Se respira profondamente, questo
        Pokémon riesce a gonfiarsi praticamente all’infinito. Una volta
        gonfio, Wigglytuff rimbalza leggero come un pallone.
    sun:
      ja-Hrkt: |-
        ふわふわの　けは　きせつの　かわりめに
        ぬけおちる。　それを　ひろいあつめて
        つむいだ　けいとは　こうきゅうひん。
      ja: |-
        ふわふわの　毛は　季節の　変わり目に
        抜け落ちる。　それを　拾い集めて
        紡いだ　毛糸は　高級品。
      ko: |-
        푹신푹신한 털은 계절이 바뀔 때
        빠진다. 그걸 모아서
        뽑아낸 털실은 고급품이다.
      zh-Hant: |-
        蓬鬆的毛髮會隨季節變遷而掉落。
        收集這些毛髮所紡織成的
        毛線是高級商品。
      zh-Hans: |-
        蓬松的毛发会随着季节转换
        而掉落。收集这些毛发后
        纺织成的毛线是高级商品。
      en: |-
        It sheds its fine fur when the seasons change.
        The fur is gathered and spun into a
        luxurious yarn.
      fr: |-
        Son pelage est doux et soyeux, mais il en
        change à chaque saison. Certains le récupèrent
        et en font des manteaux de grand luxe.
      de: |-
        Pünktlich zum Wechsel der Jahreszeiten streift
        es sein kuschelig weiches Fell ab. Der Stoff, der
        sich daraus spinnen lässt, gilt als Luxusgut.
      es: |-
        Este Pokémon muda con las estaciones su
        pelaje suave y sedoso, que algunos recogen
        para elaborar artículos de lujo.
      it: |-
        Al cambio di stagione perde il suo morbido
        manto, che può essere raccolto e filato per
        realizzare prodotti di lusso.
    moon:
      ja-Hrkt: |-
        いきを　すって　どんどん　ふくらむ。
        プクリンどうしは　どっちが　おおきく
        ふくらめるか　しょうぶ　するよ。
      ja: |-
        息を　吸って　どんどん　膨らむ。
        プクリン同士は　どっちが　大きく
        膨らめるか　勝負　するよ。
      ko: |-
        숨을 들이마셔서 점점 부풀어 오른다.
        푸크린끼리는 누가 크게
        부풀어 오르나 대결한다.
      zh-Hant: |-
        連續不停吸氣，不斷地膨脹起來。
        胖可丁之間會互相比試誰脹得比較大哦。
      zh-Hans: |-
        连续不停吸气，不断地膨胀起来。
        胖可丁之间会互相比较谁胀得大哦。
      en: |-
        As it inhales, it expands...and expands...and
        expands. Wigglytuff compete to see which one
        can inflate itself the most.
      fr: |-
        Il aime se gonfler d’air au maximum. Les conflits
        de Grodoudou se règlent en regardant lequel
        réussit à se faire plus gros que les autres.
      de: |-
        Es kann sich größer machen, indem es Luft
        einatmet. Mit Artgenossen wetteifert es, wer
        sich am meisten aufblasen kann.
      es: |-
        Puede hinchar su cuerpo tragando aire. Los
        Wigglytuff suelen competir para ver quién es
        capaz de hincharse más.
      it: |-
        Respira profondamente per gonfiarsi più
        che può. Fa a gara con altri Wigglytuff a chi
        si gonfia di più.
    ultra-sun:
      ja-Hrkt: |-
        だんりょくの　ある　ボディーと
        キメこまやかな　けがわが　にんき。
        だきしめて　ねると　きもちいい。
      ja: |-
        弾力の　ある　ボディーと
        キメ細やかな　毛皮が　人気。
        抱きしめて　寝ると　気持ちいい。
      ko: |-
        탄력 있는 몸과
        세밀한 결의 모피가 인기다.
        껴안고 자면 기분 좋다.
      zh-Hant: |-
        富有彈性的身體和
        細緻的毛皮深受人們喜愛。
        抱著牠睡覺是件很舒服的事。
      zh-Hans: |-
        富有弹性的身体和细腻的
        毛皮很受人们的喜爱。
        抱着它睡会感觉很惬意。
      en: |-
        Thanks to its bouncy body and fine fur,
        this Pokémon is sought after. Holding one
        in your arms while you sleep feels great.
      fr: |-
        Il est célébré pour son corps élastique et son
        pelage soyeux. Quel bonheur que de faire une
        sieste en serrant un Grodoudou contre soi !
      de: |-
        Dank seines elastischen Körpers und feinen
        Fells ist es sehr beliebt. Es fühlt sich herrlich
        an, mit Knuddeluff in den Armen einzuschlafen.
      es: |-
        Su cuerpo flexible y su pelaje suave y sedoso lo
        hacen muy popular. Muchos encuentran
        reconfortante dormir abrazándolo.
      it: |-
        È molto amato per l’elasticità del suo corpo
        e la morbidezza della sua pelliccia. Dormire
        abbracciati a questo Pokémon è molto piacevole.
    ultra-moon:
      ja-Hrkt: |-
        おこると　おもいっきり　いきを
        すいこみ　どんどん　ふくらんでいく。
        なんと　２０ばいに　なることもある。
      ja: |-
        怒ると　思いっきり　息を
        吸い込み　どんどん　膨らんでいく。
        なんと　２０倍に　なることもある。
      ko: |-
        화가 나면 힘껏 숨을
        들이쉬어서 점점 부풀어 오른다.
        무려 20배로 커질 때도 있다.
      zh-Hant: |-
        生氣時會拼命吸氣，
        讓自己的身體不斷膨脹。
        有時甚至能脹大到原來的２０倍。
      zh-Hans: |-
        生起气来就会死命地
        吸气让自己不断膨胀。
        有时甚至能胀大到原来的２０倍。
      en: |-
        When it gets angry, it inhales with all its might,
        and its body gradually inflates. Sometimes they
        can grow 20 times larger!
      fr: |-
        Lorsqu’il se fâche, il se gonfle d’air et peut
        atteindre jusqu’à vingt fois son volume normal.
      de: |-
        Ist es verärgert, atmet es möglichst viel Luft ein
        und bläst damit sein Volumen auf das bis zu
        Zwanzigfache auf.
      es: |-
        Cuando se enfada, inhala con fuerza e hincha
        su cuerpo hasta aumentar incluso 20 veces su
        tamaño normal.
      it: |-
        Se si arrabbia, aspira quanta più aria possibile
        e si gonfia enormemente, fino ad aumentare la
        sua taglia anche di 20 volte.
    lets-go-pikachu:
      ja-Hrkt: |-
        だんりょくせいに　すぐれた　からだは
        おおきく　いきを　すいこむと
        どこまでも　ふくらんでいく。
      ja: |-
        弾力性に　すぐれた　体は
        大きく　息を　吸い込むと
        どこまでも　膨らんでいく。
      ko: |-
        탄력성이 뛰어난 몸은
        크게 숨을 들이마시면
        끝없이 부풀어 오른다.
      zh-Hant: |-
        身體非常有彈性，
        當牠用力吸氣時，
        身體可以無限制地膨脹。
      zh-Hans: |-
        身体非常有弹性，
        当它用力吸气时，
        身体可以无限制地膨胀。
      en: |-
        Its body is very elastic. By inhaling deeply,
        it can continue to inflate itself without limit.
      fr: |-
        Son corps est malléable. En aspirant de l’air,
        il se gonfle jusqu’à atteindre des proportions
        gigantesques.
      de: |-
        Knuddeluff verfügt über einen sehr elastischen
        Körper. Es kann sich mit einem tiefen Atemzug
        zu schier grenzenloser Größe aufblasen.
      es: |-
        Su cuerpo es muy elástico. Cuando inhala aire
        profundamente, puede inflarse sin límite.
      it: |-
        Il suo corpo è estremamente elastico e può
        gonfiarsi fino a dimensioni impressionanti.
    lets-go-eevee:
      ja-Hrkt: |-
        だんりょくせいに　すぐれた　からだは
        おおきく　いきを　すいこむと
        どこまでも　ふくらんでいく。
      ja: |-
        弾力性に　すぐれた　体は
        大きく　息を　吸い込むと
        どこまでも　膨らんでいく。
      ko: |-
        탄력성이 뛰어난 몸은
        크게 숨을 들이마시면
        끝없이 부풀어 오른다.
      zh-Hant: |-
        身體非常有彈性，
        當牠用力吸氣時，
        身體可以無限制地膨脹。
      zh-Hans: |-
        身体非常有弹性，
        当它用力吸气时，
        身体可以无限制地膨胀。
      en: |-
        Its body is very elastic. By inhaling deeply,
        it can continue to inflate itself without limit.
      fr: |-
        Son corps est malléable. En aspirant de l’air,
        il se gonfle jusqu’à atteindre des proportions
        gigantesques.
      de: |-
        Knuddeluff verfügt über einen sehr elastischen
        Körper. Es kann sich mit einem tiefen Atemzug
        zu schier grenzenloser Größe aufblasen.
      es: |-
        Su cuerpo es muy elástico. Cuando inhala aire
        profundamente, puede inflarse sin límite.
      it: |-
        Il suo corpo è estremamente elastico e può
        gonfiarsi fino a dimensioni impressionanti.
    sword:
      ja-Hrkt: |-
        いきを　すえば　すうほど　ふくらむ。
        ふきげんになると　からだを　おおきく
        ふくらませて　あいてを　いあつする。
      ja: |-
        息を　吸えば　吸うほど　膨らむ。
        不機嫌になると　体を　大きく
        膨らませて　相手を　威圧する。
      ko: |-
        숨을 들이쉬면 쉴수록 몸이 부푼다.
        기분이 나빠지면 몸을 커다랗게
        부풀려 상대에게 위압을 가한다.
      zh-Hant: |-
        越吸氣就越會膨脹。
        心情變壞時，會鼓氣撐大
        身體來威嚇對方。
      zh-Hans: |-
        吸越多气，身体就会胀得越大。
        要是心情不好了，就会
        把身体胀大来威吓对方。
      en: |-
        The more air it takes in, the more it inflates. If
        opponents catch it in a bad mood, it will inflate
        itself to an enormous size to intimidate them.
      fr: |-
        Son corps gonfle à mesure qu’il inspire de l’air.
        Il se sert de cette particularité pour se grandir
        et intimider son adversaire quand il est en colère.
      de: |-
        Je mehr Luft es einatmet, desto größer wird es.
        Ist es verärgert, bläst es seinen Körper enorm auf
        und schüchtert so seine Gegner ein.
      es: |-
        Cuanto más aire inhala, más aumenta de tamaño.
        Si se enfada, hincha el cuerpo con el fin de
        intimidar a su oponente.
      it: |-
        Più aria inala, più il suo corpo si gonfia.
        Se è di cattivo umore, si gonfia per intimidire
        l’avversario.
    shield:
      ja-Hrkt: |-
        キメこまやかな　たいもうが　じまん。
        とくに　ひたいの　まきげは　てんにも
        のぼる　ごくじょうの　てざわり。
      ja: |-
        きめ細やかな　体毛が　自慢。
        とくに　額の　巻き毛は
        天にも　昇る　極上の　手触り。
      ko: |-
        얇고 고운 털을 가졌다.
        특히 이마에 동그랗게 말린 털은
        하늘을 날 듯한 최고의 감촉을 지녔다.
      zh-Hant: |-
        以自己細緻的體毛為傲。
        尤其額頭上的捲毛，更是有著
        彷彿會一摸升天的極致觸感。
      zh-Hans: |-
        以自己细腻的体毛为傲。
        尤其是额头上的卷毛，
        更是有着天堂般的极致触感。
      en: |-
        It’s proud of its fur, which is fine and delicate.
        In particular, the curl on its forehead has a
        texture that’s perfectly heavenly.
      fr: |-
        Sa fourrure soyeuse fait sa fierté. La touffe
        sur son front est si douce que la caresser
        donne l’impression d’être sur un petit nuage.
      de: |-
        Knuddeluffs weiches Fell ist sein ganzer Stolz.
        Besonders die Locke auf seiner Stirn fühlt sich
        herrlich an.
      es: |-
        Se enorgullece de su pelaje fino y sedoso. El rizo
