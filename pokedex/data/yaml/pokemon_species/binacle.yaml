binacle:
  base_happiness: 50
  capture_rate: 120
  color: brown
  egg_groups:
    - water3
  evolution_chain: binacle
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        ２ひきの　カメテテが　ひとつの
        いわで　くらす。ケンカすると
        どちらかが　ほかの　いわに　うつる。
      ja: |-
        ２匹の　カメテテが　ひとつの　岩で
        暮らす。ケンカすると　どちらかが
        他の　岩に　移る。
      ko: |-
        2마리의 거북손손이 하나의
        바위에서 산다. 서로 싸우면
        한쪽이 다른 바위로 옮겨 간다.
      en: |-
        Two Binacle live together on one rock.
        When they fight, one of them will move
        to a different rock.
      fr: |-
        Chaque rocher abrite deux Opermine.
        S’ils se disputent, l’un d’entre eux part à la recherche
        d’un nouveau logis.
      de: |-
        Bithora bewohnen jeweils zu zweit einen Felsen.
        Entzweien sie sich im Streit, sucht sich eines
        der beiden einen neuen Felsen als Unterkunft.
      es: |-
        Dos Binacle conviven en la misma roca, pero cuando
        se produce un altercado entre ambos, uno de ellos se
        muda a otra.
      it: |-
        I Binacle vivono su una roccia. Quando litigano, uno
        dei due finisce per spostarsi su una pietra diversa.
    'y':
      ja-Hrkt: |-
        からだを　のばす　はんどうで　いわを
        もちあげて　あるく。なみうちぎわで
        ながされてきた　かいそうを　たべる。
      ja: |-
        体を　伸ばす　反動で　岩を
        持ち上げて　歩く。波打ち際で
        流されてきた　海藻を　食べる。
      ko: |-
        몸을 늘린 반동으로 바위를
        들어 올리며 걷는다. 물가로
        흘러들어온 해조를 먹는다.
      en: |-
        They stretch and then contract, yanking their
        rocks along with them in bold hops. They eat
        seaweed that washes up on the shoreline.
      fr: |-
        Ils prennent de l’élan avec tout leur corps et
        soulèvent ainsi leur pierre pour se déplacer.
        Ils mangent les algues échouées sur le rivage.
      de: |-
        Sie bewegen sich fort, indem sie durch Strecken beider
        Extremitäten ihren Felsen anheben. Sie ernähren
        sich von Seetang, der an die Küste gespült wurde.
      es: |-
        El impulso que cogen al erguirse les permite levantar
        su roca y caminar. Se alimentan de las algas que la
        marea arrastra hasta la orilla.
      it: |-
        Si muovono allungando il corpo a turno, in modo da
        sollevare la pietra. Si nutrono di alghe portate a riva
        dalle onde.
