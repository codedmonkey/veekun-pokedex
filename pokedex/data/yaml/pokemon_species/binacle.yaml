    sword:
      ja-Hrkt: |-
        ２ひきが　うみべの　てごろな　いわに
        くっついて　くらす。　まんちょうじ
        きょうりょくして　えさを　あつめる。
      ja: |-
        ２匹が　海辺の　手ごろな　岩に
        くっついて　暮らす。　満潮時
        協力して　エサを　集める。
      ko: |-
        2마리가 해변가의 적당한 바위에
        달라붙어서 지낸다. 만조가 되면
        협력해서 먹이를 모은다.
      zh-Hant: |-
        ２隻龜腳腳會在海邊找一塊大小
        合適的岩石，附在上面一起生活。
        漲潮的時候會互相合作尋找食物。
      zh-Hans: |-
        ２只龟脚脚会在海边找一块大小
        合适的岩石，附在上面一起生活。
        涨潮的时候会互相合作寻找食物。
      en: |-
        After two Binacle find a suitably sized rock, they
        adhere themselves to it and live together.
        They cooperate to gather food during high tide.
      fr: |-
        Ils vivent par groupes de deux sur un rocher
        qui leur convient en bord de mer. À marée haute,
        le duo coopère pour capturer des proies.
      de: |-
        Zwei Exemplare hängen sich an einen passenden
        Felsen in Küstennähe, um dort zu leben. Bei Flut
        sammeln sie gemeinsam Nahrung.
      es: |-
        Dos Binacle conviven adheridos a una misma
        roca a orillas del mar y colaboran para atrapar
        a sus presas cuando sube la marea.
      it: |-
        Vivono in riva al mare attaccati a due a due su
        rocce adatte. Quando sale la marea, i membri
        di ciascun duo collaborano per raccogliere cibo.
    shield:
      ja-Hrkt: |-
        ２ひきの　いきが　あわないと
        こうげき　ぼうぎょ　どちらも
        おろそかになり　いきのこれない。
      ja: |-
        ２匹の　息が　合わないと
        攻撃　防御　どちらも
        おろそかになり　生き残れない。
      ko: |-
        2마리의 호흡이 맞지 않으면
        공격과 방어 어느 쪽도
        변변치 않게 되어 살아남지 못한다.
      zh-Hant: |-
        如果２隻龜腳腳配合得不好，
        不但無法有效地攻擊和防禦，
        甚至沒辦法生存下去。
      zh-Hans: |-
        如果２只龟脚脚配合得不好，
        不但无法有效地攻击和防御，
        甚至没办法生存下去。
      en: |-
        If the two don’t work well together, both their
        offense and defense fall apart. Without good
        teamwork, they won’t survive.
      fr: |-
        Il faut que les deux bras travaillent bien ensemble
        s’ils souhaitent survivre, sinon leur défense
        et leur attaque en souffrent grandement.
      de: |-
        Wenn die beiden Exemplare sich nicht gut
        verstehen, werden sie in Angriff und Verteidigung
        nachlässig und ihre Überlebenschancen sinken.
      es: |-
        Si no se llevan bien, no consiguen ni atacar ni
        defenderse de forma eficaz y sus probabilidades
        de supervivencia se reducen.
      it: |-
        Se non vanno d’accordo non riescono né ad
        attaccare né a difendersi efficacemente e la
        loro probabilità di sopravvivenza si riduce.
