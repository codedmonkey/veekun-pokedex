    x:
      ja-Hrkt: |-
        つばさと　あしの　きんにくが　つよく
        ちいさな　ポケモンを　つかんだまま
        らくらくと　とぶことが　できる。
      ja: |-
        翼と　脚の　筋肉が　強く
        小さな　ポケモンを　つかんだまま
        らくらくと　飛ぶことが　できる。
      ko: |-
        날개와 발의 근육이 강해
        작은 포켓몬을 붙잡은 채로
        너끈히 날 수 있다.
      en: |-
        The muscles in its wings and legs are strong.
        It can easily fly while gripping a small Pokémon.
      fr: |-
        Ses ailes et ses pattes ont des muscles développés.
        Il peut voler en agrippant un petit Pokémon.
      de: |-
        Die Muskeln in seinen Flügeln und Beinen sind stark.
        Es kann im Flug sogar ein anderes Pokémon tragen.
      es: |-
        Sus alas y sus patas son muy fuertes. Puede llevarse
        volando Pokémon pequeños.
      it: |-
        I muscoli di ali e zampe sono molto sviluppati. Vola
        senza fatica anche portando un piccolo Pokémon.
    'y':
      ja-Hrkt: |-
        ムクホークに　なると　むれから
        はなれて　１ぴきで　いきていく。
        きょうじんな　つばさを　もっている。
      ja: |-
        ムクホークに　なると　群れから
        離れて　１匹で　生きていく。
        強靭な　翼を　持っている。
      ko: |-
        찌르호크가 되면 무리에서
        떨어져 혼자서 살아간다.
        강인한 날개를 가지고 있다.
      en: |-
        When Staravia evolve into Staraptor, they leave the
        flock to live alone. They have sturdy wings.
      fr: |-
        Lorsque Étourvol évolue en Étouraptor, il quitte
        son groupe pour vivre seul. Ses ailes sont très
        développées.
      de: |-
        Wird Staravia zu Staraptor, verlässt es die Gruppe
        und lebt allein. Seine Spannweite ist gigantisch.
      es: |-
        Al evolucionar a Staraptor deja su bandada y pasa a
        vivir en soledad. Sus alas son inmensas.
      it: |-
        Per diventare Staraptor, lascia il gruppo e affronta
        la vita da solo. Possiede ali robustissime.
    omega-ruby:
      ja-Hrkt: |-
        つばさと　あしの　きんにくが　つよく
        ちいさな　ポケモンを　つかんだまま
        らくらくと　とぶことが　できる。
      ja: |-
