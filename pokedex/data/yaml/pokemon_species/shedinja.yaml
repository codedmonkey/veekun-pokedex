      fr: |-
        Une carapace d’insecte laissée à
        l’abandon. On dit qu’il vole l’âme
        de celui qui regarde à l’intérieur.
    black-2:
      en: |-
        A discarded bug shell that came to
        life. Peering into the crack on its
        back is said to steal one’s spirit.
    white-2:
      en: |-
        A discarded bug shell that came to
        life. Peering into the crack on its
        back is said to steal one’s spirit.
    x:
      ja-Hrkt: |-
        ぬけがらが　たましいを　やどした。
        せなかの　すきまから　のぞきこむと
        たましいを　すわれてしまうらしい。
      ja: |-
        抜け殻が　魂を　宿した。
        背中の　すきまから　のぞきこむと
        魂を　吸われてしまうらしい。
      ko: |-
        허물 속으로 영혼이 들어갔다.
        등에 난 틈새로 들여다보면
        영혼을 빼앗겨버린다고 한다.
      en: |-
        A discarded bug shell that came to life. Peering into
        the crack on its back is said to steal one’s spirit.
      fr: |-
        Une carapace d’insecte laissée à l’abandon. On dit
        qu’il vole l’âme de celui qui regarde à l’intérieur.
      de: |-
        Ein weggeworfener Käferpanzer, der zum Leben
        erwachte. Schaut man hinein, stiehlt es einem
        die Seele.
      es: |-
        Es el caparazón de un bicho que cobró vida. Si alguien
        lo mira por la espalda, le robará el alma.
      it: |-
        È nato dal guscio vuoto di un insetto. Pare che
        chi spia nella fessura sul suo dorso perda l’anima.
    'y':
      ja-Hrkt: |-
        ツチニンが　しんかする　ときに
        いつの　まにか　モンスターボールに
        はいっている　ふしぎな　ポケモンだ。
      ja: |-
        ツチニンが　進化する　ときに
        いつの間にか　モンスターボールに
        入っている　不思議な　ポケモンだ。
      ko: |-
        토중몬이 진화할 때
        어느샌가 몬스터볼에
        들어와 있는 신기한 포켓몬이다.
      en: |-
        A most peculiar Pokémon that somehow appears in
        a Poké Ball when a Nincada evolves.
      fr: |-
        Un Pokémon étrange que l’on trouve dans les
        Poké Balls après l’évolution d’un Ningale.
      de: |-
        Ein sehr spezielles Pokémon, das irgendwie in einem
        Pokéball auftaucht, wenn Nincada sich entwickelt.
      es: |-
        Es un Pokémon muy peculiar; aparece de repente en
        una Poké Ball cuando Nincada evoluciona.
      it: |-
        Pokémon particolare, che appare misteriosamente
        in una Poké Ball dopo l’evoluzione di un Nincada.
    omega-ruby:
      ja-Hrkt: |-
        かたい　からだは　ぴくりとも　うごかない。
        せなかから　からだの　くうどうを　のぞくと
        たましいを　すいとられると　しんじられている。
      ja: |-
        硬い　体は　ぴくりとも　動かない。
        背中から　体の　空洞を　のぞくと
        魂を　吸い取られると　信じられている。
      ko: |-
        단단한 몸은 꿈쩍도 하지 않는다.
        등을 통해 몸의 구멍을 들여다보면
        혼이 빨려 들어간다고 믿어지고 있다.
      en: |-
        Shedinja’s hard body doesn’t move—not even a twitch. In fact,
        its body appears to be merely a hollow shell. It is believed that
        this Pokémon will steal the spirit of anyone peering into its
        hollow body from its back.
      fr: |-
        Le corps robuste de Munja ne bouge pas d’un pouce. En fait,
        son corps semble être une coquille vide. Certains croient que
        ce Pokémon peut voler l’âme de quiconque regarderait
        à l’intérieur de son corps creux.
      de: |-
        Ninjatoms harter Körper bewegt sich überhaupt nicht.
        Er scheint bloß eine hohle Schale zu sein. Dieses Pokémon
        soll angeblich die Seele eines jeden stehlen, der hinterrücks
        einen Blick in seinen hohlen Körper riskiert.
      es: |-
        Shedinja tiene un cuerpo robusto que no mueve en absoluto.
        De hecho, parece una especie de caparazón hueco. Se cree
        que, si alguien se atreviera a mirarle por la espalda lo que
        tiene en su interior, Shedinja le robaría el alma.
      it: |-
        Il corpo coriaceo di Shedinja non si muove neanche
        di un millimetro. In realtà sembra quasi un guscio vuoto.
        Si dice che questo Pokémon rubi lo spirito di chiunque
        osi spiare dentro il suo guscio.
    alpha-sapphire:
      ja-Hrkt: |-
        ツチニンが　しんかしたとき　なぜか　かってに
        モンスターボールに　はいっている　ポケモンだ。
        からだは　まったく　うごかず　いきも　しない。
      ja: |-
        ツチニンが　進化したとき　なぜか　勝手に
        モンスターボールに　入っている　ポケモンだ。
        体は　まったく　動かず　息も　しない。
      ko: |-
        토중몬이 진화했을 때 어찌 된 영문인지 제멋대로
        몬스터볼에 들어 있는 포켓몬이다.
        몸을 전혀 움직이지 않으며 숨도 쉬지 않는다.
      en: |-
        Shedinja is a peculiar Pokémon. It seems to appear unsought
        in a Poké Ball after a Nincada evolves. This bizarre Pokémon
        is entirely immobile—it doesn’t even breathe.
      fr: |-
        Munja est un étrange Pokémon. Il semble apparaître sans
        raison dans une Poké Ball après l’évolution d’un Ningale.
        Ce Pokémon bizarre est totalement immobile. Il ne respire
        même pas.
      de: |-
        Ninjatom ist ein ganz besonderes Pokémon. Es taucht plötzlich
        in einem Pokéball auf, nachdem sich ein Nincada entwickelt
        hat. Dieses Pokémon ist absolut bewegungsunfähig und atmet
        nicht einmal.
      es: |-
        Shedinja es un Pokémon peculiar. Según parece, surge por
        las buenas en una Poké Ball cuando Nincada evoluciona. Este
        raro Pokémon no se mueve nada; ni siquiera respira.
      it: |-
        Shedinja è molto particolare. Pare comparire all’improvviso
        in una Poké Ball dopo l’evoluzione di Nincada. Questo strano
        Pokémon è completamente immobile. Non è nemmeno
        in grado di respirare.
    sword:
      ja-Hrkt: |-
        ツチニンが　しんかする　ときに
        いつの　まにか　モンスターボールに
        はいっている　ふしぎな　ポケモンだ。
      ja: |-
        ツチニンが　進化する　ときに
        いつの間にか　モンスターボールに
        入っている　不思議な　ポケモンだ。
      ko: |-
        토중몬이 진화할 때
        어느샌가 몬스터볼에
        들어와 있는 신기한 포켓몬이다.
      zh-Hant: |-
        牠是一種在土居忍士進化時，
        會神不知鬼不覺地出現在
        精靈球裡的神奇寶可夢。
      zh-Hans: |-
        它是一种在土居忍士进化时，
        会神不知鬼不觉地出现在
        精灵球里的神奇宝可梦。
      en: |-
        A most peculiar Pokémon that somehow appears
        in a Poké Ball when a Nincada evolves.
      fr: |-
        Un Pokémon étrange que l’on trouve dans
        une Poké Ball après l’évolution d’un Ningale.
      de: |-
        Ein äußerst sonderbares Pokémon, das plötzlich
        auf rätselhafte Weise in einem Pokéball
        auftaucht, wenn Nincada sich entwickelt.
      es: |-
        Es un Pokémon muy peculiar; aparece de repente
        en una Poké Ball cuando Nincada evoluciona.
      it: |-
        È un Pokémon molto particolare. Appare
        misteriosamente in una Poké Ball dopo
        l’evoluzione di un Nincada.
    shield:
      ja-Hrkt: |-
        ハネを　うごかさずに　とびまわる。
        からだの　なかは　からっぽで
        いきを　しない　ふしぎな　ポケモン。
      ja: |-
        ハネを　動かさずに　飛びまわる。
        体の　中は　空っぽで
        息を　しない　不思議な　ポケモン。
      ko: |-
        날개를 움직이지 않고 날아다닌다.
        몸속이 텅 비어 있고
        숨을 쉬지 않는 이상한 포켓몬이다.
      zh-Hant: |-
        不拍動翅膀也能四處飛行。
        身體裡面空空的，是一種
        不呼吸的奇妙寶可夢。
      zh-Hans: |-
        不拍动翅膀也能四处飞行。
        身体里面空空的，是一种
        不呼吸的奇妙宝可梦。
      en: |-
        A strange Pokémon—it flies without moving its
        wings, has a hollow shell for a body, and does
        not breathe.
      fr: |-
        Cet étrange Pokémon, dont le corps
        est comme une coquille vide, ne respire pas
        et peut voler sans battre des ailes.
      de: |-
        Ninjatom ist ein äußerst sonderbares Pokémon.
        Es fliegt umher, ohne seine Flügel zu bewegen,
        sein Körper ist hohl und es atmet nicht.
      es: |-
        Es un Pokémon muy peculiar: revolotea sin batir
        las alas, no respira y su cuerpo está hueco por
        dentro.
      it: |-
        Svolazza in giro senza muovere le ali.
        È un Pokémon strano: è vuoto all’interno
        e non respira.
