cryogonal:
  base_happiness: 50
  capture_rate: 25
  color: blue
  egg_groups:
    - mineral
  evolution_chain: cryogonal
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        When its body temperature goes up, it
        turns into steam and vanishes. When its
        temperature lowers, it returns to ice.
      fr: |-
        Si sa température monte, il se dissipe
        en vapeur d’eau et disparaît. Quand
        elle diminue, il redevient de glace.
    white:
      en: |-
        They are born in snow clouds.
        They use chains made of
        ice crystals to capture prey.
      fr: |-
        Né d’un nuage neigeux, il attrape ses
        proies à l’aide de sa chaîne faite
        de cristaux de givre.
    black-2:
      en: |-
        They are composed of ice crystals.
        They capture prey with chains of ice,
        freezing the prey at -148° F.
    white-2:
      en: |-
        They are composed of ice crystals.
        They capture prey with chains of ice,
        freezing the prey at -148° F.
    x:
      ja-Hrkt: |-
        ゆきぐもの　なかで　うまれた。
        こおりの　けっしょうで　できた
        くさりで　えものを　つかまえる。
      ja: |-
        雪雲の　中で　生まれた。
        氷の　結晶で　できた　鎖で
        獲物を　捕まえる。
      ko: |-
        눈구름 속에서 태어났다.
        얼음 결정으로 만들어진
        사슬로 먹이를 잡는다.
      en: |-
        They are born in snow clouds. They use chains
        made of ice crystals to capture prey.
      fr: |-
        Né d’un nuage neigeux, il attrape ses proies à l’aide
        de sa chaîne faite de cristaux de givre.
      de: |-
        Es fängt seine Beute mit Ketten, die sich aus
        Eiskristallen zusammensetzen. Entstanden ist es
        aus einer Schneewolke.
      es: |-
        Nació entre nubes de nieve. Atrapa a sus presas con
        una cadena hecha de hielo cristalizado.
      it: |-
        È nato nelle nuvole cariche di neve. Cattura le prede
        con una catena fatta di cristalli di ghiaccio.
    'y':
      ja-Hrkt: |-
        こおりの　けっしょうで　できた
        くさりをつかい　えものを　からめとり
        マイナス１００どに　こおらせる。
      ja: |-
        氷の　結晶で　できた
        鎖を使い　獲物を　絡め取り
        マイナス１００度に　凍らせる。
      ko: |-
        얼음 결정으로 만들어진
        사슬로 먹이를 휘감아 잡고
        마이너스 100도로 얼린다.
      en: |-
        They are composed of ice crystals. They capture
        prey with chains of ice, freezing the prey at
        -148 degrees Fahrenheit.
      fr: |-
        Il attrape ses proies à l’aide de sa chaîne faite de
        cristaux de givre et les gèle à près de -100 °C.
      de: |-
        Es fängt seine Beute mit Ketten aus Eiskristallen
        und kühlt sie auf eine Temperatur von -100 °C ab.
      es: |-
        Usa cadenas de cristales de hielo para atrapar a
        sus presas y congelarlas a temperaturas de hasta
        -100 °C.
      it: |-
        Cattura le sue prede con catene fatte di cristalli di
        ghiaccio, poi le congela a una temperatura di -100 °C.
    omega-ruby:
      ja-Hrkt: |-
        ゆきぐもの　なかで　うまれた。
        こおりの　けっしょうで　できた
        くさりで　えものを　つかまえる。
      ja: |-
        雪雲の　中で　生まれた。
        氷の　結晶で　できた　鎖で
        獲物を　捕まえる。
      ko: |-
        눈구름 속에서 태어났다.
        얼음 결정으로 만들어진
        사슬로 먹이를 잡는다.
      en: |-
        They are born in snow clouds. They use chains
        made of ice crystals to capture prey.
      fr: |-
        Né d’un nuage neigeux, il attrape ses proies à l’aide
        de sa chaîne faite de cristaux de givre.
      de: |-
        Es fängt seine Beute mit Ketten, die sich aus Eiskristallen
        zusammensetzen. Entstanden ist es aus einer Schneewolke.
      es: |-
        Nació entre nubes de nieve. Atrapa a sus presas con una
        cadena hecha de hielo cristalizado.
      it: |-
        È nato nelle nuvole cariche di neve. Cattura le prede
        con una catena fatta di cristalli di ghiaccio.
    alpha-sapphire:
      ja-Hrkt: |-
        こおりの　けっしょうで　できた
        くさりをつかい　えものを　からめとり
        マイナス１００どに　こおらせる。
      ja: |-
        氷の　結晶で　できた
        鎖を使い　獲物を　絡め取り
        マイナス１００度に　凍らせる。
      ko: |-
        얼음 결정으로 만들어진
        사슬로 먹이를 휘감아 잡고
        마이너스 100도로 얼린다.
      en: |-
        They are composed of ice crystals. They capture
        prey with chains of ice, freezing the prey at
        -148 degrees Fahrenheit.
      fr: |-
        Il attrape ses proies à l’aide de sa chaîne faite de cristaux
        de givre et les gèle à près de -100 °C.
      de: |-
        Es fängt seine Beute mit Ketten aus Eiskristallen und kühlt sie
        auf eine Temperatur von -100 °C ab.
      es: |-
        Usa cadenas de cristales de hielo para atrapar a sus presas y
        congelarlas a temperaturas de hasta -100 °C.
      it: |-
        Cattura le sue prede con catene fatte di cristalli di ghiaccio,
        poi le congela a una temperatura di -100 °C.
    sword:
      ja-Hrkt: |-
        こおりで　つくった　くさりを
        あやつって　であった　ものを
        こおらせ　どこかへ　つれさる。
      ja: |-
        氷で　作った　鎖を　操って
        出会った　ものを　凍らせ
        どこかへ　連れ去る。
      ko: |-
        얼음으로 만든 사슬을
        조종하여 만나는 상대를 얼린 후
        어딘가로 데려간다.
      zh-Hant: |-
        會操縱用冰做成的鎖鏈
        凍住遇見的獵物，然後
        把牠帶去不知名的地方。
      zh-Hans: |-
        操控用冰制成的锁，
        冻住遇到的猎物，
        并把它带去某个地方。
      en: |-
        With its icy chains, Cryogonal freezes those it
        encounters. It then takes its victims away to
        somewhere unknown.
      fr: |-
        Il gèle ceux qu’il croise à l’aide de ses chaînes
        faites de givre, puis les emmène vers un lieu
        inconnu.
      de: |-
        Mit seinen Ketten aus Eis friert es jeden ein,
        der ihm über den Weg läuft. Dann verschleppt
        es sein Opfer an einen unbekannten Ort.
      es: |-
        Se vale de sus cadenas de hielo para congelar a
        todo aquel que se cruza en su camino y llevárselo
        a un lugar desconocido.
      it: |-
        Maneggia una catena di ghiaccio, con cui
        congela e trascina via chiunque incontri.
    shield:
      ja-Hrkt: |-
        あつくなると　すいじょうきに
        かわる。　なつばに　すがたを
        みることは　ほとんどない。
      ja: |-
        暑くなると　水蒸気に　変わる。
        夏場に　姿を　見ることは
        ほとんどない。
      ko: |-
        뜨거워지면 수증기로 변한다.
        여름철에 모습을
        볼 일은 거의 없다.
      zh-Hant: |-
        天氣一熱，就會變成
        水蒸氣。在夏天見到
        牠的機會少之又少。
      zh-Hans: |-
        天气一热就会化为水蒸气。
        到了夏天几乎到处都
        看不到它的踪影。
      en: |-
        When the weather gets hot, these Pokémon turn
        into water vapor. Cryogonal are almost never
        seen during summer.
      fr: |-
        Lorsqu’il fait trop chaud, il s’évapore, ce qui
        explique pourquoi on ne le voit presque pas
        en été.
      de: |-
        Bei Hitze wird es zu Wasserdampf. Im Sommer
        bekommt man es daher kaum zu Gesicht.
      es: |-
        Cuando aumenta su temperatura corporal, se
        convierte en vapor, por lo que es muy difícil de
        avistar durante el verano.
      it: |-
        Quando fa caldo si dissolve in una nuvola
        di vapore acqueo. Per questo è molto raro
        vederlo in estate.
