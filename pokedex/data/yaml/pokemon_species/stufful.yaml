stufful:
  base_happiness: 50
  capture_rate: 140
  color: pink
  egg_groups:
    - ground
  evolution_chain: stufful
  evolves_from: ~
  flavor_text:
    sun:
      ja-Hrkt: |-
        あいくるしい　みためだが　おこって
        ジタバタする　てあしに　ぶつかると
        プロレスラーでも　ふっとばされる。
      ja: |-
        愛くるしい　見た目だが　怒って
        ジタバタする　手足に　ぶつかると
        プロレスラーでも　吹っ飛ばされる。
      ko: |-
        사랑스러운 외모지만 화가 나서
        버둥거리는 손발에 부딪히면
        프로레슬러라도 날아가 버린다.
      zh-Hant: |-
        外表惹人喜愛，但如果被牠
        發怒後胡亂揮舞的腿碰到，
        即使是職業摔角手也會被踢到老遠。
      zh-Hans: |-
        外表惹人喜爱，但如果被
        发怒后胡乱挥舞的腿脚碰到，
        即便是职业摔角手也会被击飞。
      en: |-
        Despite its adorable appearance, when it gets
        angry and flails about, its arms and legs could
        knock a pro wrestler sprawling.
      fr: |-
        Il est à croquer, sauf lorsqu’il s’énerve et frappe
        à tout va. Dans ce cas, laissez-le tranquille ou
        vous finirez à coup sûr dans le décor.
      de: |-
        Es sieht sehr süß aus, aber wehe, es wird
        wütend. Mit seinen Armen wirbelnd haut es
        selbst den stärksten Wrestler um.
      es: |-
        Pese a su aspecto encantador, cuando se enoja,
        sus pataletas son tan feroces que pueden
        derribar hasta a un luchador profesional.
      it: |-
        Tenero all’apparenza, quando si arrabbia agita
        braccia e gambe con una furia tale da atterrare
        persino un lottatore di wrestling.
    moon:
      ja-Hrkt: |-
        なついた　あいてや　なかまいがいに
        さわられると　ものすごい　ちからで
        あばれるので　ひじょうに　キケン。
      ja: |-
        なついた　相手や　仲間以外に
        触られると　物凄い　力で
        暴れるので　非常に　キケン。
      ko: |-
        친밀한 사이나 동료 이외의 사람이
        만지면 굉장한 힘으로
        날뛰기 때문에 매우 위험하다.
      zh-Hant: |-
        除了親密的對象和夥伴以外，
        一旦被接觸到，便會用可怕的
        力量發狂，所以很危險。
      zh-Hans: |-
        如果被亲密的对象和伙伴以外的
        接触到，就会用可怕的力量发狂，
        所以很危险。
      en: |-
        A touch from anyone except a known friend
        sends it into a surging frenzy. It’s an incredibly
        dangerous Pokémon.
      fr: |-
        Ne tentez pas de le caresser s’il ne vous connaît
        pas assez : il entrerait dans une rage folle,
        et vous encourriez un grand danger.
      de: |-
        Wird es von irgendjemand anderem als seinen
        Kameraden angefasst, flippt es aus und schlägt
        mit unglaublicher Kraft wild um sich.
      es: |-
        Cuando alguien con quien no haya congeniado lo
        toca, se pone hecho una furia y despliega una
        fuerza tal que lo hace tremendamente peligroso.
      it: |-
        È molto pericoloso perché attacca furiosamente
        chiunque lo tocchi, a meno che non sia un amico
        o un suo simile.
    ultra-sun:
      ja-Hrkt: |-
        たいぼくも　へしおる　ちからじまん。
        おしりの　きかんから　においを　だし
        なかまと　コミュニケーションをとる。
      ja: |-
        大木も　へし折る　力自慢。
        おしりの　器官から　匂いを　出し
        仲間と　コミュニケーションをとる。
      ko: |-
        큰 나무도 꺽을 만큼 힘이 세다.
        엉덩이의 기관에서 냄새를 풍겨
        동료와 커뮤니케이션을 한다.
      zh-Hant: |-
        以連大樹都能折斷的力氣為傲。
        會從臀部的器官發出氣味，
        藉此與夥伴進行溝通。
      zh-Hans: |-
        以连大树都能折断的力量而自豪。
        从臀部的器官发出气味，
        与伙伴进行交流。
      en: |-
        It boasts power enough to split large trees in
        half. The organ on its rear releases an odor that
        it uses to communicate with others of its kind.
      fr: |-
        Il est si fort qu’il peut abattre un grand arbre.
        L’odeur que dégage l’organe sur son derrière lui
        permet de communiquer avec ses semblables.
      de: |-
        Es ist stark genug, um große Baumstämme zu
        zerbrechen. Über Düfte aus dem Organ am
        Hinterteil kommuniziert es mit Artgenossen.
      es: |-
        Es capaz de derribar un árbol con su fuerza. Se
        comunica con sus congéneres mediante el olor
        que emite el órgano de su parte posterior.
      it: |-
        Riesce a spezzare anche gli alberi più grossi.
        Comunica con i suoi simili usando l’odore che
        emana da un organo che ha sul posteriore.
    ultra-moon:
      ja-Hrkt: |-
        だきしめられたり　さわられるのが
        だいきらい。　ジタバタ　あばれて
        ていこうする　ちからは　ものすごい。
      ja: |-
        抱きしめられたり　触られるのが
        大嫌い。　ジタバタ　暴れて
        抵抗する　力は　ものすごい。
      ko: |-
        껴안거나 만지는 것을
        아주 싫어한다. 바둥바둥 날뛰면서
        저항하는 힘이 굉장하다.
      zh-Hant: |-
        非常討厭被抱住或是被觸摸。
        會手腳亂揮地掙扎，
        抵抗的力氣非常大。
      zh-Hans: |-
        非常讨厌被抱住或是被碰触。
        手脚乱蹬挣扎抵抗的力气会非常大。
      en: |-
        Stufful hates to be hugged or touched in any
        way. It will squirm, thrash, and resist with
        amazing power.
      fr: |-
        Il déteste être touché ou pris dans les bras,
        et se débat de toutes ses forces pour
        se dégager.
      de: |-
        Es hasst es, angefasst oder gar gedrückt zu
        werden und wehrt sich dagegen, indem es mit
        unglaublicher Kraft wild um sich schlägt.
      es: |-
        Odia que lo toquen o lo abracen. Se resiste
        empleando toda su fuerza, que es considerable.
      it: |-
        Detesta profondamente essere toccato o
        abbracciato e resiste dibattendosi con tutta
        la sua incredibile forza.
    sword:
      ja-Hrkt: |-
        ふわふわの　けなみは　さわりごこちが
        ばつぐんだが　うかつに　てを　だすと
        ていたい　はんげきを　うけてしまう。
      ja: |-
        ふわふわの　毛並みは　触り心地が
        抜群だが　うかつに　手を　だすと
        手痛い　反撃を　受けてしまう。
      ko: |-
        푹신푹신한 털은 감촉이
        뛰어나지만 섣불리 손을 댔다간
        호되게 반격을 당하고 만다.
      zh-Hant: |-
        毛茸茸的毛皮摸起來觸感超群，
        但粗心大意地向牠伸出手的人
        基本上都會遭到牠的劇烈反擊。
      zh-Hans: |-
        毛茸茸的毛皮摸上去触感超群，
        但粗心大意地向它伸出手的人
        基本上都会遭到它的剧烈反击。
      en: |-
        Its fluffy fur is a delight to pet, but carelessly
        reaching out to touch this Pokémon could result
        in painful retaliation.
      fr: |-
        Sa fourrure duveteuse est très agréable à caresser,
        mais ceux qui la touchent sans prévenir s’exposent
        à une correction brutale.
      de: |-
        Sein Pelz ist wunderbar flauschig. Wagt man es
        jedoch, diesen zu berühren, setzt es sich ohne
        Rücksicht auf Verluste zur Wehr.
      es: |-
        Su suave pelaje invita a acariciarlo, pero quien
        cometa semejante temeridad recibirá un severo
        escarmiento.
      it: |-
        Il suo soffice manto è molto piacevole da
        accarezzare, ma se lo si sfiora inavvertitamente
        si rischia di venire attaccati.
    shield:
      ja-Hrkt: |-
        まえあしを　じたばた　ふって　みを
        まもる　ようすは　かわいらしいが
        たいぼくを　へしおる　いりょくだ。
      ja: |-
        前脚を　じたばた　振って　身を
        守る　様子が　可愛らしいが
        大木を　へし折る　威力だ。
      ko: |-
        앞발을 바둥바둥 흔들어 몸을
        지키는 모습은 귀엽지만
        큰 나무도 꺾을 정도의 위력이 있다.
      zh-Hant: |-
        為了保護自己的身體而
        胡亂揮舞前腳的樣子雖然可愛，
        威力卻大到能將大樹折斷。
      zh-Hans: |-
        为了保护自己的身体而
        胡乱挥舞前脚的样子虽然可爱，
        威力却大到能将大树折断。
      en: |-
        The way it protects itself by flailing its arms may
        be an adorable sight, but stay well away. This is
        flailing that can snap thick tree trunks.
      fr: |-
        Sa façon de remuer les pattes pour se défendre
        semble adorable, mais ce Pokémon est si puissant
        qu’il pourrait fendre un tronc de la sorte.
      de: |-
        Strampelt es zum Schutz mit den Vorderbeinen,
        sieht das zwar niedlich aus, aber ein Treffer mit
        ihnen ist stark genug, um große Bäume zu fällen.
      es: |-
        Cuando patalea para tratar de defenderse
        resulta adorable, pero conviene no fiarse, ya
        que su fuerza sería capaz de derribar un árbol.
      it: |-
        Quando cerca di difendersi agitando le zampe
        anteriori fa tenerezza, ma in realtà possiede
        una forza tale da spezzare grossi alberi.
