solosis:
  base_happiness: 50
  capture_rate: 200
  color: green
  egg_groups:
    - indeterminate
  evolution_chain: solosis
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        They drive away attackers by unleashing
        psychic power. They can use telepathy
        to talk with others.
      fr: |-
        Ils repoussent leurs assaillants
        avec leurs pouvoirs psychiques et
        communiquent entre eux par télépathie.
    white:
      en: |-
        Because their bodies are enveloped
        in a special liquid, they can survive
        in any environment.
      fr: |-
        Son corps est enrobé dans un fluide
        spécial, ce qui lui permet de vivre
        dans n’importe quel environnement.
    black-2:
      en: |-
        Because their bodies are enveloped
        in a special liquid, they are fine in any
        environment, no matter how severe.
    white-2:
      en: |-
        Because their bodies are enveloped
        in a special liquid, they are fine in any
        environment, no matter how severe.
    x:
      ja-Hrkt: |-
        からだが　とくしゅな　えきたいに
        つつまれているので　どんな　きびしい
        じょうきょうでも　へいきなのだ。
      ja: |-
        体が　特殊な　液体に
        包まれているので　どんな　きびしい
        状況でも　平気なのだ。
      ko: |-
        몸이 특수한 액체로
        둘러싸여 있어 어떤 곤란한
        상황이라도 문제없다.
      en: |-
        Because their bodies are enveloped in a special
        liquid, they are fine in any environment, no matter
        how severe.
      fr: |-
        Son corps est enrobé dans un fluide spécial, ce qui lui
        permet de vivre dans n’importe quel environnement.
      de: |-
        Die spezielle Flüssigkeit, die es umgibt, bietet ihm
        in jeder noch so gefährlichen Situation Schutz.
      es: |-
        Gracias a la sustancia viscosa que envuelve su cuerpo,
        permanece tranquilo por dura o rigurosa que sea la
        situación.
      it: |-
        Il liquido speciale in cui è avvolto il suo corpo gli
        permette di resistere alle condizioni più estreme.
    'y':
      ja-Hrkt: |-
        サイコパワーを　ほうしゅつして
        おそってきた　てきを　げきたい。
        テレパシーで　なかまと　かいわする。
      ja: |-
        サイコパワーを　放出して
        襲ってきた　敵を　撃退。
        テレパシーで　仲間と　会話する。
      ko: |-
        사이코 파워를 방출하여
        달려드는 상대를 물리친다.
        텔레파시로 동료와 대화한다.
      en: |-
        They drive away attackers by unleashing psychic
        power. They can use telepathy to talk with others.
      fr: |-
        Ils repoussent leurs assaillants avec leurs pouvoirs
        psychiques et communiquent entre eux par télépathie.
      de: |-
        Es wehrt Angreifer ab, indem es Psycho-Kräfte auf sie
        ansetzt. Es kommuniziert telepathisch mit Artgenossen.
      es: |-
        Desata su poder psíquico para ahuyentar al enemigo.
        Se comunica con sus compañeros por telepatía.
      it: |-
        Utilizza i suoi poteri psichici per respingere gli
        aggressori. Comunica con i compagni usando la
        telepatia.
    omega-ruby:
      ja-Hrkt: |-
        からだが　とくしゅな　えきたいに
        つつまれているので　どんな　きびしい
        じょうきょうでも　へいきなのだ。
      ja: |-
        体が　特殊な　液体に
        包まれているので　どんな　きびしい
        状況でも　平気なのだ。
      ko: |-
        몸이 특수한 액체로
        둘러싸여 있어 어떤 곤란한
        상황이라도 문제없다.
      en: |-
        Because their bodies are enveloped in a special
        liquid, they are fine in any environment, no matter
        how severe.
      fr: |-
        Son corps est enrobé dans un fluide spécial, ce qui lui permet
        de vivre dans n’importe quel environnement.
      de: |-
        Die spezielle Flüssigkeit, die es umgibt, bietet ihm in jeder
        noch so gefährlichen Situation Schutz.
      es: |-
        Gracias a la sustancia viscosa que envuelve su cuerpo,
        permanece tranquilo por dura o rigurosa que sea la situación.
      it: |-
        Il liquido speciale in cui è avvolto il suo corpo gli permette
        di resistere alle condizioni più estreme.
    alpha-sapphire:
      ja-Hrkt: |-
        サイコパワーを　ほうしゅつして
        おそってきた　てきを　げきたい。
        テレパシーで　なかまと　かいわする。
      ja: |-
        サイコパワーを　放出して
        襲ってきた　敵を　撃退。
        テレパシーで　仲間と　会話する。
      ko: |-
        사이코 파워를 방출하여
        달려드는 상대를 물리친다.
        텔레파시로 동료와 대화한다.
      en: |-
        They drive away attackers by unleashing psychic
        power. They can use telepathy to talk with others.
      fr: |-
        Ils repoussent leurs assaillants avec leurs pouvoirs psychiques
        et communiquent entre eux par télépathie.
      de: |-
        Es wehrt Angreifer ab, indem es Psycho-Kräfte auf sie ansetzt.
        Es kommuniziert telepathisch mit Artgenossen.
      es: |-
        Desata su poder psíquico para ahuyentar al enemigo.
        Se comunica con sus compañeros por telepatía.
      it: |-
        Utilizza i suoi poteri psichici per respingere gli aggressori.
        Comunica con i compagni usando la telepatia.
    sword:
      ja-Hrkt: |-
        テレパシーで　いしを　おくりあう。
        つよいショックを　うけると　からだを
        つつむ　えきたいが　もれだす。
      ja: |-
        テレパシーで　意思を　送りあう。
        強いショックを　受けると　体を
        包む　液体が　漏れ出す。
      ko: |-
        텔레파시로 의사소통을 한다.
        강한 충격을 받으면 몸을
        둘러싸고 있는 액체가 흘러나온다.
      zh-Hant: |-
        透過心靈感應來與夥伴交流。
        如果受到了強烈的衝擊，
        包裹著身體的液體就會漏出來。
      zh-Hans: |-
        通过心灵感应来与伙伴交流。
        如果受到了强烈的冲击，
        包裹着身体的液体就会漏出来。
      en: |-
        It communicates with others telepathically.
        Its body is encapsulated in liquid, but if it takes
        a heavy blow, the liquid will leak out.
      fr: |-
        Ils communiquent entre eux par télépathie.
        S’ils subissent un choc physique violent,
        le fluide qui entoure leur corps se met à fuir.
      de: |-
        Monozyto kommunizieren untereinander mittels
        Telepathie. Erfährt es eine starke Erschütterung,
        läuft die Flüssigkeit, die es umgibt, aus.
      es: |-
        Se comunica mediante telepatía. Si recibe un
        fuerte golpe, la sustancia viscosa que lo envuelve
        se desparrama.
      it: |-
        Comunica con i suoi simili tramite la telepatia.
        Se subisce un impatto violento, il liquido
        speciale in cui è immerso il suo corpo fuoriesce.
    shield:
      ja-Hrkt: |-
        とくしゅな　えきたいに　からだを
        つつんでいるので　うちゅうでも
        いきられるとも　いわれている。
      ja: |-
        特殊な　液体に　体を
        包んでいるので　宇宙でも
        生きられるとも　いわれている。
      ko: |-
        특수한 액체로 몸을
        둘러싸고 있어 우주에서도
        살 수 있다고 전해진다.
      zh-Hant: |-
        身體被特殊的液體包裹著，
        許多人因此認為牠
        即使在宇宙中也能存活。
      zh-Hans: |-
        身体被特殊的液体包裹着，
        许多人因此认为它
        即使在宇宙中也能存活。
      en: |-
        Many say that the special liquid covering this
        Pokémon’s body would allow it to survive in
        the vacuum of space.
      fr: |-
        On raconte que le curieux fluide qui entoure
        le corps de ce Pokémon lui permet de survivre
        dans l’espace.
      de: |-
        Sein Körper ist von einer speziellen Flüssigkeit
        umgeben. Es heißt, dass es dank dieser Blase
        sogar im Weltraum überleben könne.
      es: |-
        Se cree que la sustancia viscosa que lo envuelve
        le permite sobrevivir en el espacio exterior.
      it: |-
        Si dice che il liquido speciale in cui è immerso
        il suo corpo gli permetta di vivere persino
        nello spazio.
