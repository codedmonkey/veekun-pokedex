  base_happiness: 50
  capture_rate: 45
  color: yellow
  egg_groups:
    - humanshape
  evolution_chain: electabuzz
  evolves_from: elekid
  flavor_text:
    red:
      en: |-
        Normally found
        near power plants,
        they can wanderaway and cause
        major blackouts
        in cities.
    blue:
      en: |-
        Normally found
        near power plants,
        they can wanderaway and cause
        major blackouts
        in cities.
    yellow:
      en: |-
        If a major power
        outage occurs, it
        is certain thatthis POKéMON has
        eaten electricity
        at a power plant.
    gold:
      en: |-
        Electricity runs
        across the surface
        of its body. Indarkness, its en­
