        ce Pokémon se battent pour grimper sur les hauteurs,
        où la foudre a le plus de chance de tomber. Certaines villes
        se servent d’Élektek en guise de paratonnerres.
      de: |-
        Bei Gewitter entbrennt unter Elektek ein Wettstreit um höher
        gelegene Orte, an denen ein Blitzeinschlag wahrscheinlich ist.
        Einige Ortschaften benutzen diese Pokémon anstelle von
        Blitzableitern.
      es: |-
        Al desatarse una tormenta, bandadas de estos Pokémon se
        enfrentan entre sí para ver quién alcanza antes sitios altos en
        los que suelan caer rayos. Hay ciudades que usan Electabuzz
        en lugar de pararrayos.
      it: |-
        All’arrivo di un temporale questi Pokémon si raggruppano
        e a gara scalano le vette più alte sperando di riuscire
        a prendere qualche fulmine. Alcune città usano
        gli Electabuzz al posto dei parafulmini.
    sun:
      ja-Hrkt: |-
        とつぜんおこる　ていでんの　はんぶんは
        エレブーが　はつでんしょに　あつまり
        でんきを　くいちらかした　からだ。
      ja: |-
        突然起こる　停電の　半分は
        エレブーが　発電所に　集まり
        電気を　喰い散らかした　からだ。
      ko: |-
        갑자기 일어나는 정전의 반은
        에레브가 발전소에 모여
        전기를 마구 먹어대기 때문이다.
      zh-Hant: |-
        突發的停電，有一半
        是因為電擊獸聚集在發電廠
        胡亂吞食電力造成的。
      zh-Hans: |-
        突发的停电，有一半
        是因为电击兽聚集在发电厂
        胡乱吞食电力造成的。
      en: |-
        Half of all sudden blackouts are caused
        by Electabuzz gathering at electric power
        plants and gobbling up electricity.
      fr: |-
        La moitié des coupures de courant soudaines
        est due à des groupes d’Élektek rassemblés
        dans une centrale électrique pour se nourrir.
      de: |-
        Für die Hälfte aller plötzlichen Stromausfälle
        sind Elektek verantwortlich. Sie belagern gerne
        Kraftwerke und zapfen ihnen Strom ab.
      es: |-
        La mitad de los apagones los provoca este
        Pokémon, pues suele merodear por las centrales
        eléctricas para alimentarse de electricidad.
      it: |-
        Una buona metà dei blackout improvvisi sono
        causati da Electabuzz che si riversano nelle
        centrali per nutrirsi di elettricità.
    moon:
      ja-Hrkt: |-
        エサで　くう　でんきりょう　よりも
        からだから　もれる　でんきりょうの
        ほうが　あっとうてきに　おおい。
      ja: |-
        餌で　喰う　電気量　よりも
        身体から　漏れる　電気量の
        ほうが　圧倒的に　多い。
      ko: |-
        먹이로 먹는 전기량보다
        몸에서 새는 전기량이
        압도적으로 많다.
      zh-Hant: |-
        比起透過進食獲得的電量，
        從身體洩露的電量壓倒性地多。
      zh-Hans: |-
        比起吃食物获得的电量，
        从身体泄露的电量要多得多。
      en: |-
        Electricity leaks from it in amounts far greater
        than the amount of electricity it eats.
      fr: |-
        L’électricité qui se dégage de son corps est
        largement supérieure à celle qu’il ingère pour
        se nourrir.
      de: |-
        Die Menge an Elektrizität, die aus seinem Körper
        austritt, ist sehr viel größer als jene, die es über
        seine Nahrung zu sich nimmt.
      es: |-
        La cantidad de electricidad que descarga su
        cuerpo supera con creces la cantidad que
        consume para alimentarse.
      it: |-
        La quantità di elettricità che libera dal suo
        corpo è nettamente superiore a quella che
        assorbe come nutrimento.
    ultra-sun:
      ja-Hrkt: |-
        ぜんしんが　でんきを　おびている。
        うでを　ぐるぐる　まわし　でんきを
        チャージしてから　パンチを　はなつ。
      ja: |-
        全身が　電気を　帯びている。
        腕を　ぐるぐる　まわし　電気を
        チャージしてから　パンチを　放つ。
      ko: |-
        온몸이 전기로 둘러싸여 있다.
        팔을 빙빙 돌려 전기를
        충전 후 펀치를 날린다.
      zh-Hant: |-
        全身帶著電流，
        會不斷轉動手臂來充電
        然後使出拳擊。
      zh-Hans: |-
        全身都带着电。
        会一圈圈抡动手臂
        进行充电后再出拳。
      en: |-
        Electricity permeates its body. It swings
        its arms round and round to charge up
        electricity before unleashing a punch.
      fr: |-
        Son corps regorge d’électricité. Il la concentre
        dans ses bras en faisant des moulinets, avant
        de décocher un coup d’une violence fulgurante.
      de: |-
        Sein ganzer Körper speichert Elektrizität.
        Vor einem Schlag lädt es seine Arme mit
        kreisförmigen Bewegungen elektrisch auf.
      es: |-
        Su cuerpo entero emite energía eléctrica. Hace
        girar los brazos cuales aspas de molino para
        cargar sus puñetazos con electricidad.
      it: |-
        Tutto il suo corpo è pervaso di elettricità.
        Fa roteare vorticosamente le braccia prima di
        sferrare un pugno per caricarlo il più possibile.
    ultra-moon:
      ja-Hrkt: |-
        ていでんが　おこる　げんいんに
        されることが　おおいが　じつは
        かいしゃの　ミスの　ほうが　おおい。
      ja: |-
        停電が　起こる　原因に
        されることが　多いが　実は
        会社の　ミスの　ほうが多い。
      ko: |-
        정전이 일어나는 원인으로
        지목되는 경우가 많지만 사실은
        회사의 실수인 경우가 더 많다.
      zh-Hant: |-
        人們經常把停電的原因
        歸咎到牠們身上，但其實
        大多是電力公司的過失。
      zh-Hans: |-
        虽然引起停电的原因多被
        归咎于它们身上，
        但其实很多是电力公司的过失。
      en: |-
        While it’s often blamed for power outages, the
        truth is the cause of outages is more often
        an error on the part of the electric company.
      fr: |-
        On l’accuse d’être à l’origine des coupures
        de courant, mais c’est souvent une excuse pour
        couvrir les bévues du personnel des centrales.
      de: |-
        Es wird oft für Stromausfälle verantwortlich
        gemacht, doch viel häufiger handelt es sich
        um eine Folge menschlichen Fehlverhaltens.
      es: |-
        Cuando se produce un apagón, a menudo se
        culpa a este Pokémon, aunque en realidad el
        fallo haya sido de la compañía eléctrica.
      it: |-
        Spesso gli si dà la colpa dei blackout, ma in
        realtà in genere le vere responsabili sono le
        compagnie elettriche.
    lets-go-pikachu:
      ja-Hrkt: |-
        おおきな　ていでんが　おきたときは
        エレブーが　はつでんしょの
        でんきを　たべたに　ちがいない。
      ja: |-
        大きな　停電が　起きたときは
        エレブーが　発電所の
        電気を　食べたに　違いない。
      ko: |-
        대규모 정전이 일어났을 땐
        에레브가 발전소의 전기를
        먹은 것임이 틀림없다.
      zh-Hant: |-
        要是發生了大規模停電，
        那肯定是因為電擊獸
        吃掉了發電廠的電力。
      zh-Hans: |-
        要是发生了大片的停电，
        那一定是电击兽偷偷
        吃掉了发电站的电能。
      en: |-
        If a major power outage occurs, it is certain
        that this Pokémon has eaten electricity
        at a power plant.
      fr: |-
        Il provoque de grosses pannes de courant en
        se nourrissant de l’électricité des centrales.
      de: |-
        Größere Stromausfälle sind fast immer darauf
        zurückzuführen, dass ein Elektek den Strom
        eines Kraftwerks einfach gefressen hat.
      es: |-
        Cuando hay un apagón, es señal inequívoca de
        que este Pokémon se ha comido la energía de
        una central eléctrica.
      it: |-
        Quando si verifica un grosso blackout,
        significa che questo Pokémon si è intrufolato
        in una centrale per cibarsi di elettricità.
    lets-go-eevee:
      ja-Hrkt: |-
        おおきな　ていでんが　おきたときは
        エレブーが　はつでんしょの
        でんきを　たべたに　ちがいない。
      ja: |-
