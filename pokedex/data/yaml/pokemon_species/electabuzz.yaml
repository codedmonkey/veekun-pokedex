    sapphire:
      en: |-
        When a storm arrives, gangs of this
        POKéMON compete with each other to
        scale heights that are likely to bestricken by lightning bolts.
        Some towns use ELECTABUZZ in place of
        lightning rods.
    emerald:
      en: |-
        When a storm approaches, it competes with
        others to scale heights that are likely to
        be stricken by lightning. Some towns use
        ELECTABUZZ in place of lightning rods.
    firered:
      en: |-
        It loves to feed on strong electricity.
        It occasionally appears around large
        power plants and so on.
    leafgreen:
      en: |-
        Normally found near power plants, they
        can wander away and cause major
        blackouts in cities.
    diamond:
      en: |-
        Half of all blackouts occur when
        this Pokémon appears at power
        plants and eats electricity.
    pearl:
      en: |-
        Half of all blackouts occur when
        this Pokémon appears at power
        plants and eats electricity.
    platinum:
      en: |-
        It windmills its arms to slightly
        boost its punches. Foes have been
        known to escape in the meantime.
    heartgold:
      en: |-
        Electricity runs across the surface
        of its body. In darkness, its entire
        body glows a whitish-blue.
    soulsilver:
      en: |-
        Its body constantly discharges
        electricity. Getting close to it
        will make your hair stand on end.
    black:
      en: |-
        It windmills its arms to slightly
        boost its punches. Foes have been
        known to escape in the meantime.
      fr: |-
        Il fait tournoyer ses bras pour
        donner de la force à ses coups.
        Profitez-en pour filer!
    white:
      en: |-
        It windmills its arms to slightly
        boost its punches. Foes have been
        known to escape in the meantime.
      fr: |-
        Il fait tournoyer ses bras pour
        donner de la force à ses coups.
        Profitez-en pour filer!
    black-2:
      en: |-
        Research is progressing on storing
        lightning in Electabuzz so this
        energy can be used at any time.
    white-2:
      en: |-
        Research is progressing on storing
        lightning in Electabuzz so this
        energy can be used at any time.
    x:
      ja-Hrkt: |-
        からだの　ひょうめんには　でんきが
        ながれている。あたりが　くらいと
        ぜんしんが　あおじろく　ひかるのだ。
      ja: |-
        体の　表面には　電気が
        流れている。あたりが　暗いと
        全身が　青白く　光るのだ。
      ko: |-
        몸의 표면에는 전기가
        흐르고 있다. 주변이 어두우면
        전신이 푸르스름하게 빛난다.
      en: |-
        Electricity runs across the surface of its body.
        In darkness, its entire body glows a whitish blue.
      fr: |-
        Des ondes électriques parcourent la surface de son
        corps. Il brille d’un éclat bleuté dans le noir.
      de: |-
        Elektrizität bedeckt seinen Körper. Im Dunkeln
        erstrahlt es in einem bläulichen Ton.
      es: |-
        Por la superficie de su piel corre la electricidad. En la
        oscuridad, su cuerpo se torna blanquecino.
      it: |-
        La corrente elettrica attraversa la superficie del
        suo corpo che al buio riluce di un blu perlato.
    'y':
      ja-Hrkt: |-
        つよい　でんきが　だいこうぶつで
        おおきな　はつでんしょ　などに
        しばしば　あらわれる。
      ja: |-
        強い　電気が　大好物で
        大きな　発電所などに
        しばしば　現れる。
      ko: |-
        강한 전기를 좋아하여
        커다란 발전소 같은 곳에
        종종 나타난다.
      en: |-
        It loves to feed on strong electricity. It occasionally
        appears around large power plants and so on.
      fr: |-
        Il adore se nourrir d’électricité. Il apparaît
        occasionnellement près des grandes centrales
        électriques.
      de: |-
        Es konsumiert am liebsten Elektrizität. Gelegentlich
        sieht man es in der Nähe von Kraftwerken.
      es: |-
        Le encanta alimentarse de alta tensión. A veces,
        aparece cerca de centrales eléctricas y zonas
        similares.
      it: |-
        Ama nutrirsi di elettricità ad alta tensione. È possibile
        trovarlo vicino a grandi centrali elettriche.
    omega-ruby:
      ja-Hrkt: |-
        あらしが　くると　きの　うえ　など　カミナリの
        おちそうな　たかい　ばしょへ　きそって　のぼる。
        ひらいしん　がわりに　する　まちも　ある。
      ja: |-
        嵐が　くると　木の　上　など　カミナリの
        落ちそうな　高い　場所へ　競って　登る。
        避雷針　代わりに　する　街も　ある。
      ko: |-
        폭풍이 오면 나무 위처럼 벼락이
        떨어질 만한 높은 장소로 앞다투어 올라간다.
        피뢰침 대용으로 삼는 마을도 있다.
      en: |-
        When a storm arrives, gangs of this Pokémon compete with
        each other to scale heights that are likely to be stricken by
        lightning bolts. Some towns use Electabuzz in place of
        lightning rods.
      fr: |-
        Lorsqu’une tempête approche, des groupes entiers de
        ce Pokémon se battent pour grimper sur les hauteurs,
        où la foudre a le plus de chance de tomber. Certaines villes
        se servent d’Élektek en guise de paratonnerres.
      de: |-
        Bei Gewitter entbrennt unter Elektek ein Wettstreit um höher
        gelegene Orte, an denen ein Blitzeinschlag wahrscheinlich ist.
        Einige Ortschaften benutzen diese Pokémon anstelle von
        Blitzableitern.
      es: |-
        Al desatarse una tormenta, bandadas de estos Pokémon se
        enfrentan entre sí para ver quién alcanza antes sitios altos en
        los que suelan caer rayos. Hay ciudades que usan Electabuzz
        en lugar de pararrayos.
      it: |-
        All’arrivo di un temporale questi Pokémon si raggruppano
        e a gara scalano le vette più alte sperando di riuscire
        a prendere qualche fulmine. Alcune città usano
        gli Electabuzz al posto dei parafulmini.
    alpha-sapphire:
      ja-Hrkt: |-
        あらしが　くると　きの　うえ　など　カミナリの
        おちそうな　たかい　ばしょへ　きそって　のぼる。
        ひらいしん　がわりに　する　まちも　ある。
      ja: |-
        嵐が　くると　木の　上　など　カミナリの
        落ちそうな　高い　場所へ　競って　登る。
        避雷針　代わりに　する　街も　ある。
      ko: |-
