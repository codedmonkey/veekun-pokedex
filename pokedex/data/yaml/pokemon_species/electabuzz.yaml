        significa che questo Pokémon si è intrufolato
        in una centrale per cibarsi di elettricità.
    sword:
      ja-Hrkt: |-
        でんきを　ねらう　エレブーの
        たいさくに　じめんポケモンを
        おく　はつでんしょは　おおい。
      ja: |-
        電気を　狙う　エレブーの　対策に
        じめんポケモンを　置く
        発電所は　多い。
      ko: |-
        전기를 노리는 에레브를
        퇴치하고자 땅포켓몬을 두는
        발전소도 많다.
      zh-Hant: |-
        很多發電廠會用地面屬性的
        寶可夢當守衛，藉以對抗
        想伺機偷吃電力的電擊獸。
      zh-Hans: |-
        很多发电站为了防止
        电击兽来偷电，会放一些
        地面属性的宝可梦对付它们。
      en: |-
        Many power plants keep Ground-type Pokémon
        around as a defense against Electabuzz that
        come seeking electricity.
      fr: |-
        De nombreuses centrales électriques gardent
        des Pokémon Sol à proximité afin d’empêcher
        les Élektek de leur voler de l’électricité.
      de: |-
        In vielen Elektrizitätswerken werden Pokémon
        vom Typ Boden eingesetzt, um Elektek davon
        abzuhalten, den dortigen Strom anzuzapfen.
      es: |-
        Es habitual que las centrales eléctricas cuenten
        con Pokémon de tipo Tierra para hacer frente a
        los Electabuzz ávidos de electricidad.
      it: |-
        Molte centrali elettriche utilizzano Pokémon
        di tipo Terra per difendersi dagli Electabuzz
        a caccia di elettricità.
    shield:
      ja-Hrkt: |-
        あらしが　くると　たかい　きの
        まわりに　あつまり　かみなりが
        おちるのを　じっと　まちつづける。
      ja: |-
        嵐が　来ると　高い　木の
        まわりに　集まり　雷が　落ちるのを
        じっと　待ち続ける。
      ko: |-
        폭풍이 치면 높은 나무
        주위에 모여 번개가
        떨어지기를 가만히 기다린다.
      zh-Hant: |-
        暴風雨來臨時，牠們會
        聚集在高大的樹周圍，
        靜靜地一直等待落雷。
      zh-Hans: |-
        暴风雨来临时，它们就会
        集结在高高的大树周围，
        耐心地等待落雷。
      en: |-
        With the coming of a storm, many of these
        Pokémon will gather under tall trees and sit there
        waiting for lightning to strike.
      fr: |-
        Quand un orage approche, ils se réunissent
        tous autour d’un grand arbre et attendent
        patiemment que la foudre s’abatte.
      de: |-
        Bei Gewittern versammeln sich Elektek in der
        Nähe von hohen Bäumen, wo sie regungslos auf
        Blitzeinschläge warten.
      es: |-
        Al desatarse una tormenta, se reúnen en torno
        a los árboles de mayor altura y esperan inmóviles
        a que caiga algún rayo.
      it: |-
        All’arrivo di un temporale questi Pokémon si
        raggruppano intorno agli alberi alti, aspettando
        immobili che cada un fulmine.
    legends-arceus:
      en: |-
        Feeds on electrical energy. During sudden showers beneath
        looming thunderclouds, one can observe Electabuzz scaling tall
