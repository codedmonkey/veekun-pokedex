        by women to be cute.
    white-2:
      en: |-
        Small Pokémon flee from its scary
        face. It is, however, considered
        by women to be cute.
    x:
      ja-Hrkt: |-
        かっぱつで　あそびずきな　せいかく。
        なついてくれるので　いっしょに
        あそびたがる　じょせいも　おおい。
      ja: |-
        活発で　遊び好きな　性格。
        懐いてくれるので　一緒に
        遊びたがる　女性も　多い。
      ko: |-
        활발하고 노는 것을 좋아하는 성격.
        잘 따르기 때문에 함께
        놀고 싶어 하는 여성들이 많다.
      en: |-
        It has an active, playful nature. Many women like to
        frolic with it because of its affectionate ways.
      fr: |-
        Il est d’une nature joviale. De nombreuses femmes
        l’apprécient pour sa gentillesse.
      de: |-
        Es ist von Natur aus verspielt. Es tollt mit vielen
        Frauen herum, da es ihnen zugeneigt ist.
      es: |-
        Muy travieso por naturaleza, a muchas mujeres les
        gusta jugar con él porque es muy cariñoso.
      it: |-
        Ha uno spirito attivo e giocoso. A molti piace
        giocherellare con lui per i suoi modi affettuosi.
    'y':
      ja-Hrkt: |-
        ちいさな　ポケモンが　にげだすほどの
        こわいかおが　ぎゃくに　かわいいと
        じょせいに　にんきの　ポケモン。
      ja: |-
        小さな　ポケモンが　逃げ出すほどの
        怖い顔が　逆に　かわいいと
        女性に　人気の　ポケモン。
      ko: |-
        작은 포켓몬이 도망칠 정도의
        무서운 얼굴이 반대로 귀엽다며
        여성에게 인기가 있는 포켓몬이다.
      en: |-
        Small Pokémon flee from its scary face. It is,
        however, considered by women to be cute.
      fr: |-
        Son visage horrible fait fuir les petits Pokémon.
        Par contre, les femmes le trouvent mignon.
      de: |-
        Kleine Pokémon fliehen beim Anblick seines Gesichts.
        Frauen aber finden es niedlich.
      es: |-
        Los Pokémon pequeños huyen al ver su cara agresiva.
        No obstante, para muchas féminas es mono.
      it: |-
        I Pokémon più piccoli fuggono alla vista della sua
        faccia terrificante. Ma le donne lo trovano carino.
    omega-ruby:
      ja-Hrkt: |-
        キバを　むきだして　こわい　かおを　すれば
        ちいさな　ポケモンなら　おびえて　にげだす。
        にげられた　ブルーは　ちょっと　さみしそう。
      ja: |-
        キバを　むき出して　怖い　顔を　すれば
        小さな　ポケモンなら　おびえて　逃げ出す。
        逃げられた　ブルーは　ちょっと　寂しそう。
      ko: |-
        이빨을 드러내고 무서운 얼굴을 하면
        작은 포켓몬은 겁을 먹고 도망친다.
        남겨진 블루는 조금 외로워 보인다.
      en: |-
        By baring its fangs and making a scary face, Snubbull sends
        smaller Pokémon scurrying away in terror. However, this
        Pokémon seems a little sad at making its foes flee.
      fr: |-
        Snubbull terrorise les Pokémon plus petits que lui en montrant
        les dents et en faisant une grimace. Cependant, ce Pokémon
        est toujours un peu triste de voir ses ennemis prendre la fuite.
      de: |-
        Indem es seine Zähne fletscht und ein furchterregendes
        Gesicht macht, schlägt Snubbull kleinere Pokémon in die
        Flucht. Es scheint darüber jedoch etwas traurig zu sein.
      es: |-
        Al tener los colmillos por fuera, Snubbull da miedo y espanta
        a los Pokémon pequeños, que huyen aterrados. Parece que
        a él le da un poco de pena que salgan huyendo.
      it: |-
        Mostrando le zanne e ringhiando furiosamente, Snubbull
        terrorizza i Pokémon più piccoli mettendoli in fuga.
        Tuttavia, pare intristirsi ogni volta che il nemico scappa
        atterrito.
    alpha-sapphire:
      ja-Hrkt: |-
        キバを　むきだして　こわい　かおを　すれば
        ちいさな　ポケモンなら　おびえて　にげだす。
        にげられた　ブルーは　ちょっと　さみしそう。
      ja: |-
        キバを　むき出して　怖い　顔を　すれば
        小さな　ポケモンなら　おびえて　逃げ出す。
        逃げられた　ブルーは　ちょっと　寂しそう。
      ko: |-
        이빨을 드러내고 무서운 얼굴을 하면
        작은 포켓몬은 겁을 먹고 도망친다.
        남겨진 블루는 조금 외로워 보인다.
      en: |-
        By baring its fangs and making a scary face, Snubbull sends
        smaller Pokémon scurrying away in terror. However, this
        Pokémon seems a little sad at making its foes flee.
      fr: |-
        Snubbull terrorise les Pokémon plus petits que lui en montrant
        les dents et en faisant une grimace. Cependant, ce Pokémon
        est toujours un peu triste de voir ses ennemis prendre la fuite.
      de: |-
        Indem es seine Zähne fletscht und ein furchterregendes
        Gesicht macht, schlägt Snubbull kleinere Pokémon in die
        Flucht. Es scheint darüber jedoch etwas traurig zu sein.
      es: |-
        Al tener los colmillos por fuera, Snubbull da miedo y espanta
        a los Pokémon pequeños, que huyen aterrados. Parece que
        a él le da un poco de pena que salgan huyendo.
      it: |-
        Mostrando le zanne e ringhiando furiosamente, Snubbull
        terrorizza i Pokémon più piccoli mettendoli in fuga.
        Tuttavia, pare intristirsi ogni volta che il nemico scappa
        atterrito.
    sun:
      ja-Hrkt: |-
        かおは　いかついが　じつは　けっこう
        おくびょう。　ひっしに　いかくする
        ひょうじょうが　じょせいに　にんき。
      ja: |-
        顔は　厳ついが　実は　結構
        臆病。　必死に　いかくする
        表情が　女性に　人気。
      ko: |-
        얼굴은 우락부락하지만 사실은 꽤
        겁쟁이다. 필사적으로 위협하는
        표정이 여성들에게 인기 있다.
      zh-Hant: |-
        臉看起來很嚴厲，但其實相當膽小。
        那拼命作出威嚇的表情很受女性歡迎。
      zh-Hans: |-
        脸很严厉，但其实相当胆小。
        拼命威吓的表情在女性中很有人气。
      en: |-
        Despite its intimidating face, it’s quite cowardly.
        Its desperate attempts to appear threatening
        make it popular with people.
      fr: |-
        Malgré sa mine renfrognée, il est en réalité plutôt
        craintif. Son visage faussement intimidant
        fait craquer les gens.
      de: |-
        Es macht ein furchterregendes Gesicht, ist aber
        an sich recht feige. Sein Bemühen, bedrohlich
        zu wirken, macht es bei vielen beliebt.
      es: |-
        Su rostro da un poco de miedo, pero en realidad
        es bastante cobardica. A la gente suele hacerle
        gracia su cara de malas pulgas.
      it: |-
        Nonostante la faccia torva, è molto timido.
        Si sforza di apparire minaccioso, ma proprio per
        questo molti lo trovano carino.
    moon:
      ja-Hrkt: |-
        うなりごえは　あいてを　ふあんに
        させる。　ふだんは　のんびりやで
        １にちの　はんぶんは　ねているよ。
      ja: |-
        唸り声は　相手を　不安に
        させる。　普段は　のんびり屋で
        １日の　半分は　寝ているよ。
      ko: |-
        으르렁거리는 소리는 상대를 불안하게
        만든다. 평소에는 느긋한 성격으로
        하루의 절반은 자고 있다.
      zh-Hant: |-
        發出的嗚咽聲讓對手不安。
        平時是很悠閒的傢伙，
        １天中有一半時間都在睡覺哦。
      zh-Hans: |-
        呜呜声让对手不安。
        平时是很悠闲的家伙，
        １天中有一半时间都在睡觉哦。
      en: |-
        Its growls make its opponents uneasy. This
        laid-back Pokémon tends to sleep half the day.
      fr: |-
        Lorsqu’il n’aboie pas pour effrayer ses
        adversaires, ce Pokémon aime se la couler
        douce et dort 12 h par jour.
      de: |-
        Es brüllt, um seine Feinde zu verunsichern.
        Normalerweise geht es die Dinge gemütlich
        an und schläft den halben Tag.
      es: |-
        Sus ladridos inquietan a sus adversarios.
        Normalmente tiene una personalidad afable y se
        pasa la mitad del día durmiendo.
      it: |-
        Emette versi inquietanti, ma di solito è tranquillo
        e passa metà della giornata a dormire.
    ultra-sun:
      ja-Hrkt: |-
        よく　なついて　よく　あまえる。
        その　しぐさと　かおの　ギャップで
        わかい　じょせいは　メロメロらしい。　
      ja: |-
        よく　懐いて　よく　甘える。
        その　仕草と　顔の　ギャップで
        若い　女性は　メロメロらしい。
      ko: |-
        금방 따르고 금방 응석을 부린다.
        하는 행동과 생김새의 격차 때문에
        젊은 여성은 헤롱헤롱하는 듯하다.
      zh-Hant: |-
        喜歡與人親近，很會撒嬌。
        牠的動作與長相之間的反差
        似乎能讓年輕女性不禁著迷。
      zh-Hans: |-
        喜欢亲近人，爱撒娇。
        它的动作与长相之间的反差
        好像会让年轻女性为之着迷。
      en: |-
        It grows close to others easily and is also easily
        spoiled. The disparity between its face and its
        actions makes many young people wild about it.
      fr: |-
        Il s’attache très facilement et aime être cajolé.
        Une telle sensibilité cachée derrière une mine
        renfrognée fait fondre beaucoup de jeunes gens.
      de: |-
        Es wird schnell zahm und wird gerne verwöhnt.
        Viele lieben den Kontrast zwischen seiner
        mürrischen Miene und dem putzigen Charakter.
      es: |-
        Le gusta que le hagan mimos y coge confianza
        con facilidad. A la gente le fascina el contraste
        entre su aspecto fiero y carácter dulce.
      it: |-
        Si affeziona facilmente ed è sempre in cerca di
        attenzioni, nonostante la sua espressione.
        I giovani lo adorano proprio per questo.
    ultra-moon:
      ja-Hrkt: |-
        みためと　ちがって　おくびょうなので
        ほかの　こいぬポケモンと　いっしょに
        すると　いじめられることも　ある。
      ja: |-
        見た目と　違って　臆病なので
        他の　こいぬポケモンと　一緒に
        すると　いじめられることも　ある。
      ko: |-
        겉보기와 다르게 겁쟁이라
        다른 강아지포켓몬과 함께
        있으면 괴롭힘을 당할 때도 있다.
      zh-Hant: |-
        個性與外表相反，其實很膽小。
        要是把牠和其他小狗寶可夢
        放在一起，牠有可能會被欺負。
      zh-Hans: |-
        它和看上去不同，其实很胆小。
        所以如果把它和小狗宝可梦
        放在一起，它就有可能会受到欺负。
      en: |-
        In contrast to its appearance, it’s quite
        timid. When playing with other puppy
        Pokémon, it sometimes gets bullied.
      fr: |-
        Malgré les apparences, c’est un grand timide
        qui fait souvent l’objet de railleries quand il se
        trouve au milieu d’un groupe de Pokémon Chiot.
      de: |-
        Man sieht es ihm zwar nicht an, aber es ist
        recht feige. Lässt man es mit anderen kleinen
        Hunde-Pokémon spielen, wird es oft gehänselt.
      es: |-
        A pesar de su aspecto, es muy tímido y afable.
        A menudo es objeto de burla cuando se junta
        con Pokémon Perrito.
      it: |-
        Nonostante il suo aspetto, è piuttosto timido.
        Quando si ritrova in mezzo a dei Pokémon
        Cagnolino, tutti lo prendono in giro.
