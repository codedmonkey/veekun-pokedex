    black-2:
      en: |-
        It is timid in spite of its looks.
        If it becomes enraged, however,
        it will strike with its huge fangs.
    white-2:
      en: |-
        It is timid in spite of its looks.
        If it becomes enraged, however,
        it will strike with its huge fangs.
    x:
      ja-Hrkt: |-
        かおに　にあわず　おくびょう。
        しかし　ひとたび　おこりはじめると
        おおきな　キバで　はんげきする。
      ja: |-
        顔に　似合わず　臆病。
        しかし　ひとたび　怒りはじめると
        大きな　キバで　反撃する。
      ko: |-
        얼굴에 어울리지 않게 겁이 많다.
        그러나 한번 화내기 시작하면
        큰 이빨로 반격한다.
      en: |-
        It is timid in spite of its looks. If it becomes
        enraged, however, it will strike with its huge fangs.
      fr: |-
        En dépit des apparences, c’est un grand timide.
        Quand il s’énerve, il mord de ses énormes crocs.
      de: |-
        Es ist trotz seines Äußeren schüchtern. Wird es
        wütend, schnappt es mit seinen Fängen zu.
      es: |-
        A pesar de su aspecto, es muy tímido. Sin embargo,
        cuando se enfada, ataca con sus colmillos.
      it: |-
        Malgrado il suo aspetto, è molto timido. Se si
        arrabbia, tuttavia, colpisce con le sue enormi zanne.
    'y':
      ja-Hrkt: |-
        おおきな　くちを　ひらいて
        ふとい　キバを　みせつければ
        たいていの　ポケモンは　にげだす。
      ja: |-
        大きな　口を　開いて
        太い　キバを　見せつければ
        たいていの　ポケモンは　逃げ出す。
      ko: |-
        커다란 입을 벌리고
        두꺼운 송곳니를 드러내면
        대부분의 포켓몬이 도망친다.
      en: |-
        It can make most any Pokémon run away simply by
        opening its mouth wide to reveal its big fangs.
      fr: |-
        Il peut faire fuir presque tous les Pokémon en ouvrant
        très largement sa mâchoire.
      de: |-
        Es kann fast jedes Pokémon vertreiben, indem es sein
        Maul weit öffnet und seine scharfen Reißzähne zeigt.
      es: |-
        Con solo enseñar las fauces, conseguirá ahuyentar
        prácticamente a todos los Pokémon con los que se
        cruce.
      it: |-
        Se spalanca la bocca mostrando i grandi denti,
        quasi tutti i Pokémon fuggono spaventati.
    omega-ruby:
      ja-Hrkt: |-
        したアゴが　とても　はったつした　ポケモン。
        キバが　おもたいので　くびを　かしげている。
        おどろかさなければ　むやみに　かみつかない。
      ja: |-
        下アゴが　とても　発達した　ポケモン。
        キバが　重たいので　首を　傾げている。
        驚かさなければ　無暗に　かみつかない。
      ko: |-
        아래턱이 매우 발달한 포켓몬이다.
        이빨이 무거워서 목을 기울이고 있다.
        놀라게 하지 않으면 무턱대고 물지 않는다.
      en: |-
        Granbull has a particularly well-developed lower jaw.
        The enormous fangs are heavy, causing the Pokémon to tip its
        head back for balance. Unless it is startled, it will not try to
        bite indiscriminately.
      fr: |-
        Granbull a une mâchoire inférieure particulièrement
        développée. Ses énormes crocs sont tellement lourds
        qu’ils l’obligent à pencher la tête.
        Il ne mord jamais sans raison, sauf quand il a peur.
      de: |-
        Granbull besitzt einen besonders ausgeprägten Unterkiefer.
        Wegen seiner schweren Zähne wackelt es mit dem Kopf.
        Es beißt nur zu, wenn es erschreckt wird.
      es: |-
        Granbull tiene la mandíbula inferior demasiado desarrollada
        y colmillos enormes y pesados que le obligan a inclinar la
        cabeza hacia atrás para compensar el peso. Si no se le
        asusta, no muerde.
      it: |-
        Granbull è dotato di una mascella inferiore particolarmente
        sviluppata. A causa delle enormi e pesanti zanne deve
        inclinare la testa per mantenersi in equilibrio.
        Se spaventato, può mordere in modo inconsulto.
    alpha-sapphire:
      ja-Hrkt: |-
        したアゴが　とても　はったつした　ポケモン。
        キバが　おもたいので　くびを　かしげている。
        おどろかさなければ　むやみに　かみつかない。
      ja: |-
        下アゴが　とても　発達した　ポケモン。
        キバが　重たいので　首を　傾げている。
        驚かさなければ　無暗に　かみつかない。
      ko: |-
        아래턱이 매우 발달한 포켓몬이다.
        이빨이 무거워서 목을 기울이고 있다.
        놀라게 하지 않으면 무턱대고 물지 않는다.
      en: |-
        Granbull has a particularly well-developed lower jaw.
        The enormous fangs are heavy, causing the Pokémon to tip
        its head back for balance. Unless it is startled, it will not try to
        bite indiscriminately.
      fr: |-
        Granbull a une mâchoire inférieure particulièrement
        développée. Ses énormes crocs sont tellement lourds
        qu’ils l’obligent à pencher la tête.
        Il ne mord jamais sans raison, sauf quand il a peur.
      de: |-
        Granbull besitzt einen besonders ausgeprägten Unterkiefer.
        Wegen seiner schweren Zähne wackelt es mit dem Kopf.
        Es beißt nur zu, wenn es erschreckt wird.
      es: |-
        Granbull tiene la mandíbula inferior demasiado desarrollada
        y colmillos enormes y pesados que le obligan a inclinar la
        cabeza hacia atrás para compensar el peso. Si no se le
        asusta, no muerde.
      it: |-
        Granbull è dotato di una mascella inferiore particolarmente
        sviluppata. A causa delle enormi e pesanti zanne deve
        inclinare la testa per mantenersi in equilibrio.
        Se spaventato, può mordere in modo inconsulto.
    sun:
      ja-Hrkt: |-
        はったつした　したアゴと　おもたい
        キバが　ぶき。　おこらせないかぎり
        めったに　かみついたり　しないよ。
      ja: |-
        発達した　下アゴと　重たい
        キバが　武器。　怒らせない限り
        滅多に　噛みついたり　しないよ。
      ko: |-
        발달한 아래턱과 묵직한 이빨이
        무기다. 화나게 하지 않는 한
        웬만해서는 물거나 하지 않는다.
      zh-Hant: |-
        發達的下顎和沉重的牙齒
        是牠的武器。只要不惹牠生氣，
        就不太會咬人哦。
      zh-Hans: |-
        发达的下颚和沉重的牙齿
        是它的武器。只要不惹怒它，
        很少会被咬到哦。
      en: |-
        Its well-developed lower jaw and heavy fangs
        are its weapons. As long as it’s not provoked,
        it rarely bites.
      fr: |-
        Sa mâchoire inférieure et ses crocs
        surdimensionnés sont ses armes de prédilection.
        Il ne mord pas tant qu’on ne l’énerve pas.
      de: |-
        Ein ausgeprägter Unterkiefer und schwere
        Zähne sind seine Waffen. Es beißt nur zu,
        wenn es verärgert wird.
      es: |-
        Ataca con su desarrollada mandíbula y sus
        enormes colmillos. Rara es la vez que muerde a
        alguien, a menos que le haya hecho enfadar.
      it: |-
        Attacca i nemici con la grossa mascella
        inferiore, dotata di zanne massicce.
        Morde solo quando è arrabbiato.
    moon:
      ja-Hrkt: |-
        ブルー　いじょうに　おくびょう。
        みためとの　ギャップが　うけて
        わかい　じょせいに　だいにんき。
      ja: |-
        ブルー　以上に　臆病。
        見た目との　ギャップが　うけて
        若い　女性に　大人気。
      ko: |-
        블루 이상으로 겁쟁이다.
        겉모습과의 차이가 인기를 얻어
        젊은 여성에게 인기가 높다.
      zh-Hant: |-
        比布魯更加膽小。
        與外表之間的反差萌很受歡迎，
        在年輕女性中人氣很高。
      zh-Hans: |-
        比布鲁更加胆小。
        与外表之间的反差萌很受欢迎，
        在年轻女性中人气很高。
      en: |-
        More timid than Snubbull, this Pokémon is doted
        on by young people amused at the contrast
        between its looks and its attitude.
      fr: |-
        Encore plus peureux que Snubbull, son
        apparence ô combien trompeuse lui vaut
        un succès fou.
      de: |-
        Es ist noch schüchterner als Snubbull. Der
        Kontrast zwischen seinem Äußeren und seinem
        Wesen macht es bei jungen Leuten so beliebt.
      es: |-
        Es más miedica que Snubbull. Resulta muy
        popular entre la gente joven debido a su
        aspecto de duro y a su afable personalidad.
      it: |-
        È persino più timido di Snubbull. I giovani lo
        trovano irresistibile proprio per lo scarto tra
        il suo aspetto minaccioso e il suo carattere.
    ultra-sun:
      ja-Hrkt: |-
        アゴの　ちからは　きょうりょくだが
        あらそいを　このまないので　めったに
        ひろうする　きかいは　ないのだ。
      ja: |-
        アゴの　力は　強力だが
        争いを　好まないので　滅多に
        披露する　機会は　ないのだ。
      ko: |-
        턱의 힘은 강력하지만
        다툼을 좋아하지 않아 그다지
        싸우는 걸 볼 기회가 많지 않다.
      zh-Hant: |-
        下顎的力量很強，
        但因為生性不喜歡鬥爭，
        所以很少有展露的機會。
      zh-Hans: |-
        颚的力量很强，但不喜欢争斗，
        所以很少有展露的机会。
      en: |-
        While it has powerful jaws, it doesn’t care for
        disputes, so it rarely has a chance to display
        their might.
      fr: |-
        Sa mâchoire est étonnamment puissante,
        mais comme il n’aime pas se battre, il n’a
        pas souvent l’occasion de s’en servir.
      de: |-
        Sein Unterkiefer ist sehr stark. Da es jedoch
        den Kampf scheut, kommt es nur selten dazu,
        dies zu demonstrieren.
      es: |-
        Su mandíbula posee una fuerza abrumadora,
        pero, como no le gusta pelear, rara vez tiene
        ocasión de demostrarlo.
      it: |-
        Ha una mascella molto potente, ma non ama
        battersi, perciò non ha molte occasioni di dare
        prova della sua forza.
    ultra-moon:
      ja-Hrkt: |-
        わかい　じょせいに　だいにんきだが
        おくびょうなうえに　せんさいなので
        ばんけん　としては　むのうだ。
      ja: |-
        若い　女性に　大人気だが
        臆病な上に　繊細なので
        番犬　としては　無能だ。
      ko: |-
        젊은 여성에게 인기가 많지만
        겁쟁이인데다가 섬세하기 때문에
        지킴이로는 무능하다.
      zh-Hant: |-
        雖然很受年輕女性歡迎，
        但牠不但膽小而且個性纖細，
        以看門狗來說一點用都沒有。
      zh-Hans: |-
        虽然深受年轻女性的欢迎，
        但它胆小怕事，内心柔弱，
        所以无法成为一条看门犬。
      en: |-
        Although it’s popular with young people,
        Granbull is timid and sensitive, so it’s totally
        incompetent as a watchdog.
      fr: |-
        Les jeunes gens en sont fous, mais sa timidité
        et sa grande délicatesse en font un piètre
        Pokémon de garde.
      de: |-
        Es ist bei jungen Leuten sehr beliebt. Aufgrund
        seines feigen und sensiblen Charakters ist es
        als Wache allerdings völlig ungeeignet.
      es: |-
        Es muy popular entre la gente joven, pero su
        personalidad afable y algo miedosa hacen de
        él un pésimo guardián.
      it: |-
        Piace moltissimo ai giovani.
        Di indole timida e delicata, non è adatto a fare
        la guardia.
