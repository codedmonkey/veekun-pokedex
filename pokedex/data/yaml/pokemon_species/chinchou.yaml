        antenna tips to shock its foes.
    white-2:
      en: |-
        It discharges positive and
        negative electricity from its
        antenna tips to shock its foes.
    x:
      ja-Hrkt: |-
        くらい　かいていでは　いつも
        てんめつ　している　しょくしゅの
        あかり　だけが　つうしんしゅだん。
      ja: |-
        暗い　海底では　いつも
        点滅している　触手の
        明かり　だけが　通信手段。
      ko: |-
        어두운 해저에서는 항상
        깜빡거리고 있는 촉수의
        빛만이 통신수단이다.
      en: |-
        On the dark ocean floor, its only means of
        communication is its constantly flashing lights.
      fr: |-
        Au plus profond de l’océan, son seul moyen de
        communication est sa lumière qui clignote
        constamment.
      de: |-
        Am Meeresgrund kann es sich nur durch ständiges
        Flackern seiner Lichter der Umgebung kundtun.
      es: |-
        En el oscuro fondo del océano, su único modo de
        comunicarse es emitiendo luces parpadeantes.
      it: |-
        Negli oscuri fondali oceanici il suo unico mezzo di
        comunicazione sono le luci sempre lampeggianti.
    'y':
      ja-Hrkt: |-
        ２つの　しょくしゅの　さきから
        プラスと　マイナスの　でんきを
        ながして　あいてを　しびれさせる。
      ja: |-
        ２つの　触手の　先から
        プラスと　マイナスの　電気を　流して
        相手を　しびれさせる。
      ko: |-
        2개의 촉수 끝에서
        플러스와 마이너스의 전기를
        흘려보내 상대를 마비시킨다.
      en: |-
        It shoots positive and negative electricity between
        the tips of its two antennae and zaps its enemies.
      fr: |-
        Il émet avec ses antennes des impulsions positives
        et négatives qui peuvent électrocuter ses ennemis.
      de: |-
        Es verschießt negative und positive Elektronen
        zwischen seinen Antennen, um seine Feinde
        zu erlegen.
      es: |-
        Descarga electricidad positiva y negativa entre las
        puntas de sus dos antenas y electrocuta al enemigo.
      it: |-
        Spara elettricità positiva e negativa tra le punte delle
        due antenne per colpire i nemici.
    omega-ruby:
      ja-Hrkt: |-
        ２ほんの　しょくしゅから　プラスと　マイナスの
        でんきを　ながして　えものを　きぜつ　させる。
        でんきの　あかりは　なかまとの　サインだ。
      ja: |-
        ２本の　触手から　プラスと　マイナスの
        電気を　流して　獲物を　気絶　させる。
        電気の　灯りは　仲間との　サインだ。
      ko: |-
        2개의 촉수로 플러스와 마이너스
        전기를 흘려 먹이를 기절시킨다.
        전기의 빛은 동료와의 신호다.
      en: |-
        Chinchou lets loose positive and negative electrical charges
        from its two antennas to make its prey faint. This Pokémon
        flashes its electric lights to exchange signals with others.
      fr: |-
        Loupio relâche des charges électriques positives et négatives
        de ses deux antennes pour mettre sa proie K.O. Ce Pokémon
        illumine ses ampoules électriques pour communiquer avec
        ses congénères.
      de: |-
        Lampi gibt positive und negative elektrische Ladungen
        durch seine Antennen ab, um seine Beute zu lähmen.
        Dieses Pokémon lässt seine Lichter aufflackern und
        tauscht Signale mit seinen Artgenossen aus.
      es: |-
        Chinchou libera cargas eléctricas positivas y negativas a través
        de las dos antenas que tiene para que su rival pierda el
        conocimiento. Asimismo, usa los destellos de electricidad para
        comunicarse con otros.
      it: |-
        Chinchou libera una carica elettrica positiva e negativa
        dalle due antenne per intontire la preda. Il Pokémon usa
        le sue luci elettriche per scambiare segnali coi suoi simili.
    alpha-sapphire:
      ja-Hrkt: |-
        つよい　でんきを　はっせいさせる　さいぼうが
        ２ほんの　しょくしゅの　なかに　つまっている。
        じぶんも　ちょっと　ピリピリ　しびれるらしい。
      ja: |-
        強い　電気を　発生させる　細胞が
        ２本の　触手の　中に　詰まっている。
        自分も　ちょっと　ピリピリ　しびれるらしい。
      ko: |-
        강한 전기를 발생시키는 세포가
        2개의 촉수 안에 채워져 있다.
        자신도 조금은 찌릿하고 마비된다고 한다.
      en: |-
        Chinchou’s two antennas are filled with cells that generate
        strong electricity. This Pokémon’s cells create so much
        electrical power, it even makes itself tingle slightly.
      fr: |-
        Les deux antennes de Loupio sont chargées de cellules
        qui génèrent un courant de forte intensité. Ces cellules
        libèrent tellement d’électricité qu’elles vibrent légèrement.
      de: |-
        Lampis zwei Antennen sind mit Zellen gefüllt, die Elektrizität
        erzeugen. Die elektrische Ladung ist so stark, dass es sogar
        ein leichtes Kribbeln verspürt.
      es: |-
        Las dos antenas de Chinchou están llenas de células que
        generan potente electricidad. Crean tal cantidad que hasta
        el propio Pokémon siente cierto hormigueo.
      it: |-
        Le due antenne di Chinchou contengono cellule che generano
        un’elettricità incredibile, tanto forte da farlo vibrare tutto.
    sun:
      ja-Hrkt: |-
        ２ほんの　しょくしゅは　もとは　ヒレ。
        でんきを　はなって　えものを
        しびれさせてから　おそう。
      ja: |-
        ２本の　触手は　元は　ヒレ。
        電気を　放って　獲物を
        しびれさせてから　襲う。
      ko: |-
        2개의 촉수는 원래는 지느러미이다.
        전기를 발산해서 먹이를
        마비시킨 다음 덮친다.
      zh-Hant: |-
        ２根觸手原本是鰭。
        會釋放電力讓獵物麻痺後進行襲擊。
      zh-Hans: |-
        ２根触手原本是鳍。
        释放电力让猎物麻痹后进行袭击。
      en: |-
        Its two antennae were originally fins.
        It discharges electricity to stun its prey
        before attacking.
      fr: |-
        Ses deux antennes étaient à l’origine des
        ailerons. Il libère de l’électricité pour étourdir
        ses proies avant de passer à l’attaque.
      de: |-
        Seine zwei Antennen waren ursprünglich
        Flossen. Es greift seine Beute an, indem es
        sie mit Strom lähmt.
      es: |-
        Sus dos antenas antes eran aletas. Ataca a sus
        presas después de haberlas paralizado de una
        descarga eléctrica.
      it: |-
        Le sue due antenne sono l’evoluzione di pinne
        primitive da cui emette scariche elettriche per
        tramortire la preda prima di attaccarla.
    moon:
      ja-Hrkt: |-
        ひかりの　とどかない　かいていに
        くらす。　しょくしゅを　ひからせ
        なかまと　コミュニケーション。
      ja: |-
        光の　届かない　海底に
        暮らす。　触手を　光らせ
        仲間と　コミュニケーション。
      ko: |-
        빛이 닿지 않는 해저에 산다.
        촉수를 빛내 동료들과
        커뮤니케이션을 한다.
      zh-Hant: |-
        在光線無法觸及的海底生活。
        讓觸手發光來與夥伴們交流。
      zh-Hans: |-
        在光线都无法到达的海底生活。
        让触手发光来与伙伴们交流。
      en: |-
        It lives in the depths beyond the reach of
        sunlight. It flashes lights on its antennae
        to communicate with others of its kind.
      fr: |-
        Il vit dans les profondeurs marines que le soleil
        n’atteint pas. Il utilise ses antennes lumineuses
        pour communiquer avec ses congénères.
      de: |-
        Es lebt in den Tiefen des Meeres, zu denen kein
        Licht durchdringt. Es kommuniziert mit anderen
        Lampi, indem es seine Antennen aufblitzen lässt.
      es: |-
        Vive en lo más profundo del océano, donde ya
        no alcanza la luz. Se comunica con los de su
        especie emitiendo luces con sus antenas.
      it: |-
        Vive in profondità marine al riparo dalla luce
        del sole. Usa le antenne luminose per
        comunicare con i suoi simili.
    ultra-sun:
      ja-Hrkt: |-
        ２ほんの　しょくしゅが　ほのかに
        ひかって　えものを　よびよせる。
        よづりに　べんりな　ポケモンだ。
      ja: |-
        ２本の　触手が　ほのかに
        光って　獲物を　呼び寄せる。
        夜釣りに　便利な　ポケモンだ。
      ko: |-
        2개의 촉수가 어렴풋이 빛나
        먹이를 불러들인다.
        밤낚시에 편리한 포켓몬이다.
      zh-Hant: |-
        會讓２根觸手微微發光，
        藉此引誘獵物靠近。
        是種在夜釣時很好用的寶可夢。
      zh-Hans: |-
        会通过２根触手发出
        微光来吸引猎物。
        是一种在夜钓时很有用的宝可梦。
      en: |-
        Its two antennae glow softly to lure in prey,
        making it a useful Pokémon for night fishing.
      fr: |-
        Ses deux antennes luisent légèrement pour
        attirer ses proies. C’est un Pokémon très
        pratique pour pêcher la nuit.
      de: |-
        Das schwache Licht seiner zwei Antennen
        zieht andere Pokémon an. Es ist somit ein
        idealer Begleiter beim Nachtangeln.
      es: |-
        Sus dos antenas emiten una tenue luz con la que
        atrae a sus presas. Resulta un compañero ideal
        para una partida de pesca nocturna.
      it: |-
        Dalle antenne emette una debole luce che usa
        per attirare a sé le prede. È un compagno
        perfetto per la pesca notturna.
    ultra-moon:
      ja-Hrkt: |-
        ひかる　しょくしゅの　てんめつで
        チョンチーどうしは　たがいの
        なわばりを　しゅちょう　しあう。
      ja: |-
        光る　触手の　点滅で
        チョンチー同士は　互いの
        縄張りを　主張　しあう。
      ko: |-
        빛나는 촉수를 깜빡여서
        초라기끼리 서로의
        영역을 주장한다.
      zh-Hant: |-
        燈籠魚們會透過
        發光觸手的閃爍
        來宣示彼此的地盤。
      zh-Hans: |-
        灯笼鱼之间会通过发光触手上
        发出的闪光来宣示各自的领地。
      en: |-
        Chinchou blink their shining antennae at one
        another to claim their respective turf.
      fr: |-
        Les Loupio marquent les limites de leur territoire
        en faisant clignoter leurs antennes.
      de: |-
        Es lässt seine leuchtenden Antennen aufblitzen,
        um vor anderen Lampi sein Revier geltend zu
        machen.
      es: |-
        Hace parpadear las luces de sus antenas para
        comunicarse con sus congéneres y así marcar
        su territorio.
      it: |-
        Vive nelle profondità marine, al riparo dalla luce
        del sole. Usa le antenne luminose per
        comunicare con i suoi simili.
    sword:
      ja-Hrkt: |-
        ひれが　へんかして　できた
        しょくしゅは　それぞれ　プラスと
        マイナスの　でんきが　ながれている。
      ja: |-
        ひれが　変化して　できた
        触手は　それぞれが　プラスと
        マイナスの　電気が　流れている。
      ko: |-
        지느러미가 변해서 만들어진
        촉수는 각각 플러스와
        마이너스의 전기가 흐르고 있다.
      zh-Hant: |-
        從鰭變化而來的觸手
        之中，分別流通著
        正電以及負電。
      zh-Hans: |-
        从鳍变化而来的触手
        之中，分别流通着
        正电以及负电。
      en: |-
        Its antennae, which evolved from a fin, have both
        positive and negative charges flowing through them.
      fr: |-
        Ses antennes proviennent d’anciennes nageoires
        et sont chargées d’énergies positive et négative.
      de: |-
        Seine Antennen haben sich aus Flossen entwickelt
        und sind sowohl positiv als auch negativ geladen.
      es: |-
        Sus otrora dos aletas han evolucionado a las
        actuales antenas y ambas tienen carga positiva
        y negativa.
      it: |-
        Le sue antenne, evoluzione di pinne primitive,
        sono attraversate da energia elettrica, positiva
        in una e negativa nell’altra.
    shield:
      ja-Hrkt: |-
        くらい　かいていでは　いつも
        てんめつ　している　しょくしゅの
        あかり　だけが　つうしんしゅだん。
      ja: |-
        暗い　海底では　いつも
        点滅している　触手の
        灯り　だけが　通信手段。
      ko: |-
        어두운 해저에서는 항상
        깜빡거리는 촉수의 빛이
        유일한 통신 수단이다.
      zh-Hant: |-
        在黑暗的海底，
        觸手上不斷閃爍的亮光
        是牠唯一的通訊手段。
      zh-Hans: |-
        在黑暗的海底，
        触手上不断闪烁着的光
        是它们唯一的通信手段。
      en: |-
        On the dark ocean floor, its only means of
        communication is its constantly flashing lights.
      fr: |-
        Au plus profond de l’océan, son seul moyen
        de communication est la lumière de ses antennes,
        qui clignotent constamment.
      de: |-
        Am dunklen Meeresgrund sind die ständig
        flackernden Lichter seiner Antennen sein
        einziges Kommunikationsmittel.
      es: |-
        En el oscuro fondo del océano, su único modo
        de comunicarse son las luces parpadeantes que
        emite por las antenas.
      it: |-
        Il suo unico mezzo di comunicazione negli oscuri
        fondali oceanici sono le luci delle sue antenne,
        che lampeggiano costantemente.
