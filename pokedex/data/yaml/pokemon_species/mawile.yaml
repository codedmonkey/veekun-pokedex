      fr: |-
        Ses cornes forment une grande
        mâchoire attachée à sa tête. Elle
        peut broyer des barres de fer.
    black-2:
      en: |-
        Attached to its head is a huge
        set of jaws formed by horns.
        It can chew through iron beams.
    white-2:
      en: |-
        Attached to its head is a huge
        set of jaws formed by horns.
        It can chew through iron beams.
    x:
      ja-Hrkt: |-
        おとなしい　かおで　あいてを　ゆだん
        させてから　おおあごで　がぶり。
        かみつくと　ぜったいに　はなさない。
      ja: |-
        おとなしい　顔で　相手を　油断
        させてから　おおあごで　がぶり。
        かみつくと　絶対に　放さない。
      ko: |-
        얌전한 얼굴로 상대를 방심하게
        만들고 큰 턱으로 덥석 문다.
        한번 물면 절대로 놓지 않는다.
      en: |-
        It uses its docile-looking face to lull foes into
        complacency, then bites with its huge,
        relentless jaws.
      fr: |-
        Il utilise son visage charmeur pour tromper ses
        ennemis avant de les mordre avec ses énormes
        mâchoires.
      de: |-
        Mit seinem friedlichen Gesicht bringt es Gegner zur
        Selbstgefälligkeit und beißt anschließend mit seinem
        riesigen Kiefer gnadenlos zu.
      es: |-
        Engaña con su aspecto dócil; hace que el rival se
        confíe y le da un mordisco con sus enormes e
        implacables mandíbulas.
      it: |-
        Intenerisce i nemici con la sua faccia innocente,
        per poi morderli con le forti e instancabili mascelle.
    'y':
      ja-Hrkt: |-
        ツノが　へんけいして　できた
        おおあごが　あたまに　ついている。
        てっこつを　かみきってしまう。
      ja: |-
        ツノが　変形して　できた
        おおあごが　頭に　ついている。
        鉄骨を　かみきってしまう。
      ko: |-
        뿔이 변형되어 생긴
        큰 턱이 머리에 달려 있다.
        철골을 물어서 끊어 버린다.
      en: |-
        Attached to its head is a huge set of jaws formed
        by horns. It can chew through iron beams.
      fr: |-
        Ses cornes forment une grande mâchoire attachée
        à sa tête. Elle peut broyer des barres de fer.
      de: |-
        Auf seinem Kopf befindet sich ein riesiger Kiefer,
        der aus Hörnern besteht. Er kann Eisen zermalmen.
      es: |-
        Las grandes fauces de su cabeza están formadas por
        cuernos. Puede romper el hierro con ellas.
      it: |-
        Le sue due enormi mandibole sono corna trasformate.
        Con esse può masticare persino travi di ferro.
    omega-ruby:
      ja-Hrkt: |-
        はがねの　ツノが　へんけいした　おおきな　あご。
        おとなしそうな　かおに　ゆだんを　していると
        とつぜん　ふりむき　バクリと　かみつかれるぞ。
      ja: |-
        鋼の　ツノが　変形した　大きな　あご。
        大人しそうな　顔に　油断を　していると
        突然　振り向き　バクリと　かみつかれるぞ。
      ko: |-
        강철 뿔이 변형된 큰 턱이다.
        얌전해 보이는 얼굴에 방심하고 있으면
        갑자기 뒤돌아서 덥석 문다.
      en: |-
        Mawile’s huge jaws are actually steel horns that have been
        transformed. Its docile-looking face serves to lull its foe into
        letting down its guard. When the foe least expects it, Mawile
        chomps it with its gaping jaws.
      fr: |-
        Les énormes mâchoires de Mysdibule sont en réalité
        des cornes en métal transformées. Son visage doux et gentil
        est un leurre pour tromper l’ennemi. Quand l’ennemi s’y attend
        le moins, il le croque d’un coup de mâchoire.
      de: |-
        Flunkifers sagenhafter Kiefer besteht aus umgewandelten
        Stahlhörnern. Sein unterwürfiger Gesichtsausdruck dient dazu,
        seinen Gegner in Sicherheit zu wiegen, sodass er
        unaufmerksam wird. Dann schnappt es zu!
      es: |-
        Las descomunales fauces de acero de Mawile son la evolución
        de unos cuernos que tuvo en su día. Con su expresión dócil
        puede engañar al enemigo y hacer que baje la guardia para
        sorprenderle con las fauces.
      it: |-
        Le enormi mascelle di Mawile sono in realtà corna d’acciaio
        trasformate. Il volto dallo sguardo tanto mansueto serve
        a indurre i nemici ad abbassare la guardia. Infatti Mawile
        attacca quando l’avversario meno se l’aspetta.
    alpha-sapphire:
      ja-Hrkt: |-
        あいてを　ゆだんさせ　おおきな　あごで　がぶり。
        かわいい　かおに　だまされると　きけんだよ。
        はがねの　あごは　ツノが　へんけいした　ものだ。
      ja: |-
        相手を　油断させ　大きな　あごで　がぶり。
        可愛い　顔に　だまされると　危険だよ。
        鋼の　あごは　ツノが　変形した　ものだ。
      ko: |-
        상대를 방심하게 하고 큰 턱으로 덥석 문다.
        귀여운 얼굴에 속아 넘어가면 위험하다.
        강철의 턱은 뿔이 변형된 것이다.
      en: |-
        Don’t be taken in by this Pokémon’s cute face—it’s very
        dangerous. Mawile fools the foe into letting down its guard,
        then chomps down with its massive jaws. The steel jaws are
        really horns that have been transformed.
      fr: |-
        Il ne faut pas se fier au visage mignon de ce Pokémon. Il est
        très dangereux. Mysdibule leurre son ennemi, puis le croque
        avec son énorme mâchoire constituée en fait des cornes
        transformées.
      de: |-
        Fall bloß nicht auf das hübsche Gesicht dieses Pokémon
        herein – es ist sehr gefährlich. Flunkifer lenkt seine Feinde
        ab und schlägt dann mit seinem massiven Kiefer zu. Sein
        kräftiger Stahlkiefer besteht aus umgewandelten Hörnern.
      es: |-
        No hay que dejarse engañar por el aspecto tierno de este
        Pokémon; es un verdadero peligro. Mawile engaña, así, a su
        rival. Primero, hace que baje la guardia y, después, despliega
        sus horribles fauces de acero, que antes eran cuernos.
      it: |-
        Non bisogna mai farsi ingannare dallo sguardo mansueto
        di Mawile, che è invece estremamente pericoloso. Tenta così
        di far abbassare la guardia al nemico per attaccare con le
        possenti mascelle formate da corna trasformate.
    ultra-sun:
      ja-Hrkt: |-
        ずるがしこく　おそろしい　ポケモン。
        キュートな　しぐさで　ゆだんさせ
        いきなり　おおアゴで　まるのみにする。
      ja: |-
        ずる賢く　恐ろしい　ポケモン。
        キュートな　仕草で　油断させ
        いきなり　おおアゴで　丸呑みにする。
      ko: |-
        약삭빠르고 무서운 포켓몬.
        귀여운 행동으로 방심하게 한 후
        느닷없이 큰 턱으로 통째로 삼켜 버린다.
      zh-Hant: |-
        聰明又狡猾，可怕的寶可夢。
        會用可愛的動作使對手掉以輕心，
        然後出其不意地用大顎一口吞下。
      zh-Hans: |-
        狡黠而又恐怖的宝可梦。
        用可爱的举止让人麻痹大意，
        然后出其不意地用大颚一口吞下。
      en: |-
        A cunning and terrifying Pokémon, its cuteness
        makes opponents let down their guard—and
        then it swallows them whole with its huge jaws.
      fr: |-
        Rusé et dangereux, ce Pokémon profite de son
        air candide pour tromper ses ennemis, et les
        gobe d’un trait dès qu’ils ont le dos tourné.
      de: |-
        Ein verschlagenes Pokémon, das sich niedlich
        gibt, um die Beute in Sicherheit zu wiegen. Dann
        verschlingt es diese mit seinem riesigen Kiefer.
      es: |-
        Este Pokémon astuto y temible engaña al rival
        con su aspecto dulce para luego engullirlo de un
        bocado cuando menos se lo espera.
      it: |-
        Scaltro e pericoloso, induce il nemico ad
        abbassare la guardia con atteggiamenti graziosi
        e lo divora in un colpo con le possenti mascelle.
    ultra-moon:
      ja-Hrkt: |-
        ２つの　くちを　もつ。　こうとうぶの
        おおアゴには　みかくが　ないため
        にがてな　ものは　こちらで　たべる。
      ja: |-
        ２つの　口を　持つ。　後頭部の
        大アゴには　味覚が　ないため
        苦手な　ものは　こちらで　食べる。
      ko: |-
        2개의 입을 가졌다. 후두부의
        큰 턱에는 미각이 없어서
        싫어하는 것은 이쪽으로 먹는다.
      zh-Hant: |-
        擁有２張嘴。頭部後面的大顎
        沒有味覺，所以會用來
        吃那些自己不喜歡的東西。
      zh-Hans: |-
        拥有２张嘴。
        因为头部后面的大颚里没有味觉，
        所以那里用来吃不喜欢的东西。
      en: |-
        It has two mouths. The big jaws on the back of
        its head can’t taste anything, so that’s the
        mouth it uses to eat foods it doesn’t like.
      fr: |-
        Il possède deux bouches. Celle au sommet de sa
        tête ne percevant pas les saveurs, il s’en sert
        pour manger les aliments qui lui déplaisent.
      de: |-
        Es hat zwei Münder. Mit dem großen Kiefer auf
        seinem Hinterkopf kann es nichts schmecken,
        deswegen isst es damit Dinge, die es nicht mag.
      es: |-
        Tiene dos bocas. Las grandes mandíbulas a su
        espalda carecen de sentido del gusto, por lo
        que las usa para comer lo que no le agrada.
      it: |-
        Ha due bocche. Quella dietro la nuca, dotata di
        possenti mascelle, non percepisce i sapori e
        viene usata per mangiare i cibi meno graditi.
    sword:
      ja-Hrkt: |-
        おとなしい　かおで　あいてを　ゆだん
        させてから　おおあごで　がぶり。
        かみつくと　ぜったいに　はなさない。
      ja: |-
        おとなしい　顔で　相手を　油断
        させてから　おおあごで　がぶり。
        噛みつくと　絶対に　放さない。
      ko: |-
        얌전한 얼굴로 상대를 방심하게
        만들고 큰 턱으로 덥석 문다.
        한번 물면 절대로 놓지 않는다.
      zh-Hant: |-
        用溫順的長相讓對手大意，
        然後用大顎一口咬住對手。
        咬住後就絕不會鬆口。
      zh-Hans: |-
        会用温顺的长相让对手大意，
        然后再用大颚一口咬住对手。
        咬住后就绝不会松口。
      en: |-
        It uses its docile-looking face to lull foes into
        complacency, then bites with its huge,
        relentless jaws.
      fr: |-
        Trompés par son visage innocent, ses ennemis
        se font happer par ses énormes mâchoires
        et ne peuvent plus s’échapper.
      de: |-
        Mit seinem friedlichen Gesicht wiegt es Gegner
        in Sicherheit und beißt dann mit seinem riesigen
        Kiefer zu. Danach gibt es kein Entkommen mehr.
      es: |-
        Con su cara inocente hace que el rival se confíe
        y, al bajar la guardia, le da un mordisco con sus
        enormes fauces del que no se puede liberar.
      it: |-
        Distrae i nemici con la sua faccia innocente,
        per poi azzannarli con le sue possenti mascelle.
        Non molla la presa a nessun costo.
    shield:
      ja-Hrkt: |-
        はがねの　ツノが　へんけいして
        できた　おおきな　アゴで
        あいてに　がぶりと　かみつくのだ。
      ja: |-
        鋼の　ツノが　変形して
        できた　大きな　アゴで
        相手に　がぶりと　噛みつくのだ。
      ko: |-
        강철의 뿔이 변형되어
        생긴 큰 턱으로
        상대를 덥석 문다.
      zh-Hant: |-
        大嘴娃能用自己那由鋼角
        變化而成的巨大顎部
        將對手一口緊緊咬住。
      zh-Hans: |-
        大嘴娃能用自己那由钢角
        变化而成的巨大颚部
        将对手一口紧紧咬住。
      en: |-
        It chomps with its gaping mouth. Its huge jaws are
        actually steel horns that have been transformed.
      fr: |-
        Ses cornes d’acier forment une grande mâchoire
        avec laquelle il mord férocement ses adversaires.
      de: |-
        Sein riesiger Kiefer hat sich aus stählernen
        Hörnern entwickelt. Mit ihm beißt es seine
        Gegner.
      es: |-
        Sus otrora cuernos de acero se han transformado
        en grandes fauces con las que muerde a sus
        enemigos.
      it: |-
        Le sue corna d’acciaio si sono trasformate in
        enormi mascelle, con cui morde i nemici.
