    white-2:
      en: |-
        When alone, nothing happens.
        However, if there are two or more,
        an odd power is said to emerge.
    x:
      ja-Hrkt: |-
        からだじたいは　うすっぺらく
        いつも　かべに　はりついている。
        かたちに　なにか　いみがあるらしい。
      ja: |-
        体自体は　薄っぺらく
        いつも　壁に　張りついている。
        形に　なにか　意味があるらしい。
      ko: |-
        몸 자체는 굉장히 얇고
        항상 벽에 들러붙어 있다.
        모습에는 뭔가 의미가 있는 듯하다.
      en: |-
        Its flat, thin body is always stuck on walls. Its shape
        appears to have some meaning.
      fr: |-
        Son corps plat et fin est toujours collé aux murs.
        On pense que sa forme a une signification.
      de: |-
        Sein flacher, dünner Körper hängt immer an Wänden.
        Seine Form scheint eine Bedeutung zu haben.
      es: |-
        Su cuerpo fino y plano aparece siempre en los muros.
        Su forma parece tener algún significado.
      it: |-
        Il corpo piatto e sottile sta sempre attaccato ai muri.
        Pare che la forma abbia un preciso significato.
    'y':
      ja-Hrkt: |-
        こだいぶんめいの　もじに　にている。
        もじが　さきか　アンノーンが　さきか
        せかいの　７ふしぎの　ひとつ。
      ja: |-
        古代文明の　文字に　似ている。
        文字が　先か　アンノーンが　先か
        世界の　七不思議の　ひとつ。
      ko: |-
        고대 문명의 문자와 닮았다.
        문자가 먼저인지 안농이 먼저인지
        세계 7대 불가사의의 하나다.
      en: |-
        Shaped like ancient writing, it is a huge mystery
        whether language or Unown came first.
      fr: |-
        Il rappelle une écriture ancienne. Reste à savoir qui
        du langage ou de Zarbi est apparu en premier.
      de: |-
        Seine Form sieht aus wie antike Schrift. Was war
        zuerst da? Die Sprache oder Icognito?
      es: |-
        Tienen forma de letras antiguas. Se desconoce qué
        fue antes: si la escritura o los Unown.
      it: |-
        È a forma di lettera di un antico alfabeto. È un mistero
        chi sia apparso prima, l’alfabeto o Unown.
    omega-ruby:
      ja-Hrkt: |-
        こだいの　もじに　にた　すがたの　ポケモン。
        さきに　うまれたのは　もじか　アンノーンなのか。
        けんきゅうちゅうだが　いまだに　なぞである。
      ja: |-
        古代の　文字に　似た　姿の　ポケモン。
        先に　生まれたのは　文字か　アンノーンなのか。
        研究中だが　いまだに　謎である。
      ko: |-
        고대 문자를 닮은 모습의 포켓몬이다.
        먼저 생겨난 것은 문자인가 안농인가.
        연구 중이지만 아직도 수수께끼다.
      en: |-
        This Pokémon is shaped like ancient writing. It is a mystery as
        to which came first, the ancient writings or the various Unown.
        Research into this topic is ongoing but nothing is known.
      fr: |-
        Ce Pokémon a la forme d’un caractère d’écriture antique.
        Personne ne sait si ces écritures antiques sont apparues
        avant les Zarbi ou le contraire. Des études sont en cours,
        mais aucun résultat n’a été annoncé.
      de: |-
        Icognito hat die Form antiker Schriftzeichen. Bis heute ist
        unklar, was zuerst da war – die antiken Schriftzeichen oder
        die vielen unterschiedlichen Icognito. Trotz umfangreicher
        Forschung bleiben Fragen offen.
      es: |-
        Estos Pokémon tienen forma de caracteres antiguos. No se
        sabe qué surgió primero, si la vieja escritura o los distintos
        Unown. Esta cuestión sigue siendo objeto de estudio, pero
        aún no se ha averiguado nada.
      it: |-
        Questo Pokémon pare una lettera di un alfabeto antico.
        A tutt’oggi rimane un mistero chi sia comparso prima,
        se l’alfabeto o Unown. Sono in corso ricerche in merito
        ma non si sa ancora praticamente nulla.
    alpha-sapphire:
      ja-Hrkt: |-
        こだいの　もじに　にた　すがたの　ポケモン。
        さきに　うまれたのは　もじか　アンノーンなのか。
        けんきゅうちゅうだが　いまだに　なぞである。
      ja: |-
