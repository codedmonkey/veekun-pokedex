      fr: |-
        Il bouge si vite que l’œil a parfois du
        mal à le suivre. Ils se regroupent près
        de la sève des arbres.
    white:
      en: |-
        Because it moves so quickly, it
        sometimes becomes unseeable. It
        congregates around tree sap.
      fr: |-
        Il bouge si vite que l’œil a parfois du
        mal à le suivre. Ils se regroupent près
        de la sève des arbres.
    black-2:
      en: |-
        Because it moves so quickly, it
        sometimes becomes unseeable. It
        congregates around tree sap.
    white-2:
      en: |-
        Because it moves so quickly, it
        sometimes becomes unseeable. It
        congregates around tree sap.
    x:
      ja-Hrkt: |-
        なきごえを　きき　つづけると
        ずつうが　おさまらなくなる。
        みえない　ほどの　はやさで　うごく。
      ja: |-
        鳴き声を　聞き続けると
        頭痛が　治まらなくなる。
        見えない　ほどの　速さで　動く。
      ko: |-
        울음소리를 계속 들으면
        두통이 낫지 않게 된다.
        안 보일 정도의 스피드로 움직인다.
      en: |-
        Its cry leaves a lasting headache if heard for too
        long. It moves so quickly that it is almost invisible.
      fr: |-
        C’est la migraine assurée quand il pousse son cri
        perçant. On le perd facilement de vue tant il est vif.
      de: |-
        Sein Gesang erzeugt unausweichlich Kopfweh.
        Es bewegt sich so schnell, dass es beinah
        unsichtbar zu sein scheint.
      es: |-
        Escuchar su zumbido de forma continuada provoca
        jaquecas. Casi no se le ve de lo rápido que es.
      it: |-
        I suoi continui lamenti provocano atroci emicranie.
        Si sposta così velocemente che... non si vede!
    'y':
      ja-Hrkt: |-
        あまりに　こうそくで　うごくため
        すがたが　みえなくなる　ことがある。
        じゅえきに　あつまってくる。
      ja: |-
        あまりに　高速で　動くため
        姿が　見えなくなる　ことがある。
        樹液に　集まってくる。
      ko: |-
        매우 고속으로 움직이므로
        모습이 보이지 않게 될 때가 있다.
        수액에 모여든다.
      en: |-
        Because it moves so quickly, it sometimes becomes
        unseeable. It congregates around tree sap.
      fr: |-
        Il bouge si vite que l’œil a parfois du mal à le suivre.
        Les Pokémon de cette espèce se regroupent près
        de la sève des arbres.
      de: |-
        Es bewegt sich so schnell, dass es manchmal
        unsichtbar zu sein scheint. Es liebt Baumsaft.
      es: |-
        Se mueve tan rápido que a veces resulta invisible.
        Le atrae la savia de los árboles.
      it: |-
        Si muove così in fretta da risultare quasi invisibile.
        Lo si vede in gruppo attorno agli alberi ricchi di linfa.
    omega-ruby:
      ja-Hrkt: |-
        こうそくで　うごきまわり　すがたが　みえない。
        なきごえしか　きこえて　こないので　ながいあいだ
        とうめいな　ポケモンと　かんがえられていた。
      ja: |-
        高速で　動き回り　姿が　見えない。
        鳴き声しか　聞こえて　こないので　長い間
        透明な　ポケモンと　考えられていた。
      ko: |-
        고속으로 움직여서 모습이 보이지 않는다.
        울음소리만 들려서 오랫동안
        투명한 포켓몬이라고 여겨져 왔다.
      en: |-
        Ninjask moves around at such a high speed that it
        cannot be seen, even while its crying can be clearly heard.
        For that reason, this Pokémon was long believed to
        be invisible.
      fr: |-
        Ninjask se déplace tellement vite qu’il est impossible
        de le voir. En revanche, on entend clairement son cri.
        On a pendant très longtemps cru que ce Pokémon
        était invisible.
      de: |-
        Ninjask bewegt sich so schnell, dass man es nicht sehen kann.
        Seine Schreie sind aber laut und deutlich zu hören. Deshalb
        hielt man dieses Pokémon lange für unsichtbar.
      es: |-
        Ninjask se mueve de un lado a otro a tal velocidad que es
        imposible verlo. Sin embargo, como su zumbido no deja de
        oírse, se pensó durante mucho tiempo que este Pokémon era
        invisible.
      it: |-
        Ninjask si muove a una velocità tale da rendersi praticamente
        invisibile, nonostante il suo verso si possa udire chiaramente.
        Per questo motivo, per molto tempo si è pensato che fosse
        effettivamente invisibile.
    alpha-sapphire:
      ja-Hrkt: |-
        じょうずに　そだてないと　いうことを　きかず
        おおごえで　なきつづけるので　トレーナーの
        うでが　ためされる　ポケモンと　いわれている。
      ja: |-
        上手に　育てないと　いうことを　聞かず
        大声で　鳴き続けるので　トレーナーの
        腕が　試される　ポケモンと　いわれている。
      ko: |-
        잘 키우지 않으면 말을 듣지 않고
        큰 소리로 계속 울어대기 때문에 트레이너의
        실력이 시험되는 포켓몬이라고 전해진다.
      en: |-
        If Ninjask is not trained properly, it will refuse to obey
        the Trainer and cry loudly continuously. Because of this
        quality, this Pokémon is said to be one that puts the
        Trainer’s abilities to the test.
      fr: |-
        Si Ninjask n’est pas dressé correctement, il refuse d’obéir
        à son Dresseur et crie sans arrêt. C’est pourquoi on dit que
        ce Pokémon peut réellement mettre son Dresseur à l’épreuve.
      de: |-
        Wenn Ninjask nicht richtig trainiert wird, hört es nicht mehr auf
        seinen Trainer und beginnt, unaufhörlich und laut zu brüllen.
        Es stellt die Fähigkeiten eines Trainers auf eine harte Probe.
      es: |-
        Si Ninjask no recibe un entrenamiento adecuado, desobedece
        a su Entrenador y empieza a dar zumbidos sin parar.
        Por ello, se dice que pone a prueba las habilidades de su
        Entrenador.
      it: |-
        Se Ninjask non viene allenato adeguatamente, si rifiuta di
        obbedire all’Allenatore, lamentandosi di continuo. Questa sua
        caratteristica mette alla prova le capacità di ciascun Allenatore
        di Pokémon.
    sword:
      ja-Hrkt: |-
        なきごえを　きき　つづけると
        ずつうが　おさまらなくなる。
        みえない　ほどの　はやさで　うごく。
      ja: |-
        鳴き声を　聴き　つづけると
        頭痛が　治まらなくなる。
        見えない　ほどの　速さで　動く。
      ko: |-
        울음소리를 계속 들으면
        두통이 낫지 않게 된다.
        안 보일 정도의 스피드로 움직인다.
      zh-Hant: |-
        一直聽牠的叫聲
        會讓人頭痛不止。
        會以肉眼無法看清的速度移動。
      zh-Hans: |-
        如果一直听它的叫声，
        就会让人头痛不止。
        会以眼睛无法看清的速度移动。
      en: |-
        Its cry leaves a lasting headache if heard for too
        long. It moves so quickly that it is almost invisible.
      fr: |-
        Une écoute prolongée de son cri provoque
        des maux de tête persistants.
        On le perd facilement de vue tant il est vif.
      de: |-
        Lauscht man längere Zeit seinem Gesang, löst er
        dauerhafte Kopfschmerzen aus. Es ist so schnell,
        dass es beinahe unsichtbar zu sein scheint.
      es: |-
        Escuchar su zumbido de forma continuada
        provoca jaquecas persistentes. Se mueve con
        tanta rapidez que es casi imposible verlo.
      it: |-
        I suoi continui lamenti provocano atroci
        emicranie. Si sposta così velocemente che...
        non si vede!
    shield:
      ja-Hrkt: |-
        どんな　こうげきでも　よけてしまうと
        いわれるほど　すばやい　ポケモン。
        あまい　じゅえきが　だいこうぶつ。
      ja: |-
        どんな　攻撃でも　避けてしまうと
        いわれるほど　素早い　ポケモン。
        甘い　樹液が　大好物。
      ko: |-
        어떤 공격이든 피할 수 있다고
        이야기될 정도로 빠른 포켓몬이다.
        달콤한 수액을 매우 좋아한다.
      zh-Hant: |-
        行動十分迅速的寶可夢。
        說牠無論什麼攻擊都能避開也不誇張。
        非常喜歡甘甜的樹液。
      zh-Hans: |-
        行动十分迅速的宝可梦。
        说它无论什么攻击都能避开也不夸张。
        非常喜欢甘甜的树液。
      en: |-
        This Pokémon is so quick, it is said to be able to
        avoid any attack. It loves to feed on tree sap.
      fr: |-
        Ce Pokémon est tellement rapide qu’on le dit
        capable d’éviter toutes les attaques.
        Il adore se nourrir de la sève sucrée des arbres.
      de: |-
        Dieses Pokémon ist so schnell, dass es jedem
        Angriff ausweichen kann. Es ernährt sich am
        liebsten von süßem Baumsaft.
      es: |-
        Este Pokémon es tan rápido que, según dicen,
        puede esquivar cualquier ataque. Le encanta
        alimentarse de la dulce savia de los árboles.
      it: |-
        È così rapido che si dice sia in grado di schivare
        qualsiasi attacco. Ama nutrirsi della linfa degli
        alberi.
