dwebble:
  base_happiness: 50
  capture_rate: 190
  color: red
  egg_groups:
    - bug
    - mineral
  evolution_chain: dwebble
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        This Pokémon can easily melt holes in
        hard rocks with a liquid secreted from
        its mouth.
      fr: |-
        Il peut facilement creuser son trou
        dans les pierres les plus dures grâce
        au liquide sécrété par sa bouche.
    white:
      en: |-
        It makes a hole in a suitable rock. If
        that rock breaks, the Pokémon remains
        agitated until it locates a replacement.
      fr: |-
        Il perce un caillou et s’en sert comme
        maison. Quand on lui casse, il est anxieux
        jusqu’à ce qu’il en trouve un autre.
    black-2:
      en: |-
        When it finds a stone of a suitable
        size, it secretes a liquid from its
        mouth to open up a hole to crawl into.
    white-2:
      en: |-
        When it finds a stone of a suitable
        size, it secretes a liquid from its
        mouth to open up a hole to crawl into.
    x:
      ja-Hrkt: |-
        てごろな　いしに　あなを　あけて
        すみかにする。こわされると　かわりの
        いしが　みつかるまで　おちつかない。
      ja: |-
        手ごろな　石に　穴を　開けて
        住処にする。壊されると　かわりの
        石が　見つかるまで　落ち着かない。
      ko: |-
        적당한 돌을 찾아 구멍을 뚫어
        살 곳을 만든다. 부서지면 대신할
        돌을 찾을 때까지 불안해한다.
      en: |-
        It makes a hole in a suitable rock. If that rock
        breaks, the Pokémon remains agitated until it
        locates a replacement.
      fr: |-
        Il perce un caillou et s’en sert comme maison.
        Quand on lui casse, il est anxieux jusqu’à ce qu’il en
        trouve un autre.
      de: |-
        Höhlt sich einen brauchbaren Stein aus, um darin
        zu wohnen. Geht er zu Bruch, ruht es nicht, bis es
        einen neuen findet.
      es: |-
        Abre un agujero en la roca y vive en él. Si la roca se
        resquebraja, no se queda tranquilo hasta que no
        encuentra otra.
      it: |-
        Scava un buco in una pietra adatta per farne la sua
        dimora. Se si rompe, non si dà pace finché non ne
        trova un’altra.
    'y':
      ja-Hrkt: |-
        てごろな　サイズの　いしが　あると
        くちから　えきたいを　ぶんぴつして
        なかに　はいるための　あなをあける。
      ja: |-
        てごろな　サイズの　石が　あると
        口から　液体を　分泌して
        中に　入るための　穴をあける。
      ko: |-
        적당한 사이즈의 돌이 있으면
        입에서 액체를 분비해서
        안에 들어가기 위한 구멍을 판다.
      en: |-
        When it finds a stone of a suitable size, it secretes
        a liquid from its mouth to open up a hole to
        crawl into.
      fr: |-
        Lorsqu’il trouve un caillou à sa taille, il y creuse
        un trou avec le fluide qui sort de sa bouche et s’en
        sert comme maison.
      de: |-
        Sobald es einen angemessen großen Stein findet,
        höhlt es ihn mit einem ätzenden Sekret aus und
        kriecht hinein.
      es: |-
        Si encuentran una piedra de tamaño ideal, segregan
        un líquido por la boca para crear un agujero y
        deslizarse dentro.
      it: |-
        Quando trova una pietra della sua misura crea un
        buco con il liquido che secerne dalla bocca e ci si
        infila dentro.
    omega-ruby:
      ja-Hrkt: |-
        てごろな　いしに　あなを　あけて
        すみかにする。こわされると　かわりの
        いしが　みつかるまで　おちつかない。
      ja: |-
        手ごろな　石に　穴を　開けて
        住処にする。壊されると　かわりの
        石が　見つかるまで　落ち着かない。
      ko: |-
        적당한 돌을 찾아 구멍을 뚫어
        살 곳을 만든다. 부서지면 대신할
        돌을 찾을 때까지 불안해한다.
      en: |-
        It makes a hole in a suitable rock. If that rock
        breaks, the Pokémon remains agitated until it
        locates a replacement.
      fr: |-
        Il perce un caillou et s’en sert comme maison. Quand on lui
        casse, il est anxieux jusqu’à ce qu’il en trouve un autre.
      de: |-
        Höhlt sich einen brauchbaren Stein aus, um darin zu wohnen.
        Geht er zu Bruch, ruht es nicht, bis es einen neuen findet.
      es: |-
        Abre un agujero en la roca y vive en él. Si la roca se
        resquebraja, no se queda tranquilo hasta que no encuentra
        otra.
      it: |-
        Scava un buco in una pietra adatta per farne la sua dimora.
        Se si rompe, non si dà pace finché non ne trova un’altra.
    alpha-sapphire:
      ja-Hrkt: |-
        てごろな　サイズの　いしが　あると
        くちから　えきたいを　ぶんぴつして
        なかに　はいるための　あなをあける。
      ja: |-
        てごろな　サイズの　石が　あると
        口から　液体を　分泌して
        中に　入るための　穴をあける。
      ko: |-
        적당한 사이즈의 돌이 있으면
        입에서 액체를 분비해서
        안에 들어가기 위한 구멍을 판다.
      en: |-
        When it finds a stone of a suitable size, it secretes
        a liquid from its mouth to open up a hole to
        crawl into.
      fr: |-
        Lorsqu’il trouve un caillou à sa taille, il y creuse un trou avec
        le fluide qui sort de sa bouche et s’en sert comme maison.
      de: |-
        Sobald es einen angemessen großen Stein findet, höhlt es ihn
        mit einem ätzenden Sekret aus und kriecht hinein.
      es: |-
        Si encuentran una piedra de tamaño ideal, segregan un líquido
        por la boca para crear un agujero y deslizarse dentro.
      it: |-
        Quando trova una pietra della sua misura crea un buco con il
        liquido che secerne dalla bocca e ci si infila dentro.
    sword:
      ja-Hrkt: |-
        このみの　こいしに　あなを　あけて
        すみかに　する。　ダンゴロや
        タンドンに　とっては　てんてき。
      ja: |-
        好みの　小石に　穴を　開けて
        すみかに　する。　ダンゴロや
        タンドンに　とっては　天敵。
      ko: |-
        마음에 드는 돌멩이에 구멍을 파서
        보금자리로 삼는다. 단굴이나
        탄동에게는 천적이다.
      zh-Hant: |-
        會在自己喜歡的石頭上開洞
        當成住所。對石丸子還有
        小炭仔來說是天敵。
      zh-Hans: |-
        会在自己喜欢的石头上开洞
        当成住所。对石丸子还有
        小炭仔来说是天敌。
      en: |-
        When it finds a stone appealing, it creates a hole
        inside it and uses it as its home. This Pokémon is
        the natural enemy of Roggenrola and Rolycoly.
      fr: |-
        Quand il trouve un caillou qui lui plaît, il y creuse
        un trou et s’en sert comme d’une maison.
        C’est l’ennemi juré des Nodulithe et des Charbi.
      de: |-
        Lithomith sucht sich einen Stein, der ihm gefällt,
        und höhlt ihn aus, um darin zu wohnen. Es ist ein
        natürlicher Feind von Kiesling und Klonkett.
      es: |-
        Cuando halla una piedra de su agrado, la horada
        y establece su morada. Es enemigo natural de los
        Roggenrola y los Rolycoly.
      it: |-
        Scava un buco in una piccola pietra di suo
        gradimento per farne la sua dimora. È il nemico
        naturale di Roggenrola e di Rolycoly.
    shield:
      ja-Hrkt: |-
        いえに　ちょうどいい　こいしが
        みつからないと　カバルドンの
        あなに　すんでしまうことも。
      ja: |-
        家に　ちょうどいい　小石が
        見つからないと　カバルドンの
        穴に　棲んでしまうことも。
      ko: |-
        집으로 삼기 딱 좋은 돌멩이를
        발견하지 못하면 하마돈의
        구멍에 살기도 한다.
      zh-Hant: |-
        如果找不到大小合適
        的石頭來當成自己的家，
        牠也會住到河馬獸的洞裡。
      zh-Hans: |-
        如果找不到大小合适
        的石头来当成自己的家，
        它也会住到河马兽的洞里。
      en: |-
        It first tries to find a rock to live in, but if there
        are no suitable rocks to be found, Dwebble may
        move in to the ports of a Hippowdon.
      fr: |-
        S’il ne trouve pas de bon caillou à creuser
        pour s’y loger, il élit domicile dans un des trous
        du corps d’Hippodocus.
      de: |-
        Wenn es keinen Stein findet, der sich als Haus
        eignet, lässt es sich manchmal in den Öffnungen
        im Körper eines Hippoterus’ nieder.
      es: |-
        Si no encuentra una piedra que sea idónea como
        morada, se instala en los orificios de algún
        Hippowdon.
      it: |-
        A volte, quando non riesce a trovare una pietra
        adatta, usa come sua dimora i pori
        di Hippowdon.
