        what it likes and dislikes.
    x:
      ja-Hrkt: |-
        くちびるが　いちばん　びんかん。
        なんでも　まず　くちびるで　ふれて
        どんなものか　かくにんする。
      ja: |-
        唇が　一番　敏感。
        なんでも　まず　唇で　触れて
        どんなものか　確認する。
      ko: |-
        입술이 제일 민감하다.
        뭐든지 먼저 입술로 건드려서
        어떤 것인지 확인한다.
      en: |-
        Its lips are the most sensitive part of its body.
        It always uses its lips first to examine things.
      fr: |-
        Ses lèvres sont la partie la plus sensible de son corps.
        Il les utilise pour examiner les objets.
      de: |-
        Die Lippen sind sein empfindlichster Körperteil.
        Neue Dinge untersucht es zuerst damit.
      es: |-
        Sus labios son la parte más sensible de su cuerpo.
        Siempre los usa para examinar las cosas.
      it: |-
        Le labbra sono la parte più sensibile del corpo,
        il primo organo con cui analizza nuovi oggetti.
    'y':
      ja-Hrkt: |-
        なんでも　くちびるで　ふれてみて
        たしかめる。すきな　ものも　きらいな
        ものも　くちびるが　おぼえている。
      ja: |-
        なんでも　唇で　触れてみて
        確かめる。好きな　物も　嫌いな　物も
        唇が　覚えている。
      ko: |-
        무엇이든 입술로 건드려보고
        확인한다. 좋아하는 것도 싫어하는
        것도 입술이 기억하고 있다.
      en: |-
        It tests everything by touching with its lips,
        which remember what it likes and dislikes.
      fr: |-
        Il goûte à tout du bout des lèvres. Elles gardent
        en mémoire ses goûts et ses dégoûts.
      de: |-
        Dieses Pokémon berührt alles mit den Lippen.
        Diese merken sich, was es mag und nicht mag.
      es: |-
        Analiza todo tocándolo con los labios. Así puede
        recordar las cosas que le gustan y disgustan.
      it: |-
        Analizza tutto con le labbra e con esse riesce a
        memorizzare ciò che gli piace e ciò che non gli piace.
    omega-ruby:
      ja-Hrkt: |-
        げんき　いっぱい　うごきまわるが　よく　ころぶ。
        むっくり　おきあがると　みずうみの　すいめんに
        かおを　うつして　よごれていないか　しらべる。
      ja: |-
        元気　いっぱい　動き回るが　よく　転ぶ。
        むっくり　起き上がると　湖の　水面に
        顔を　映して　汚れていないか　調べる。
      ko: |-
        기운차게 돌아다니지만 자주 넘어진다.
        벌떡 일어나서는 호수의 수면에 얼굴을
        비추고 더러워지지 않았는지 살핀다.
      en: |-
        Smoochum actively runs about, but also falls quite often.
        Whenever the chance arrives, it will look for its reflection to
        make sure its face hasn’t become dirty.
      fr: |-
        Lippouti court dans tous les sens et tombe assez souvent.
        Quand il en a l’occasion, il regarde son reflet dans l’eau
        pour vérifier si son visage n’a pas été sali par ses chutes.
      de: |-
        Kussilla läuft hektisch umher, fällt aber auch ziemlich oft hin.
        Es lässt keine Möglichkeit aus, sein Spiegelbild zu betrachten,
        um sicherzustellen, dass sein Gesicht nicht schmutzig
        geworden ist.
      es: |-
        Smoochum va corriendo por todos lados, pero se cae también
        con frecuencia. Y, en cuanto tiene ocasión, se mira en algún
        sitio para ver si se ha manchado la cara.
      it: |-
        Smoochum scorrazza vivacemente, ma spesso inciampa
        e cade. Così, appena può, cerca di specchiarsi da qualche
        parte per assicurarsi di non essersi imbrattato il volto.
    alpha-sapphire:
      ja-Hrkt: |-
        げんき　いっぱい　うごきまわるが　よく　ころぶ。
        むっくり　おきあがると　みずうみの　すいめんに
        かおを　うつして　よごれていないか　しらべる。
      ja: |-
        元気　いっぱい　動き回るが　よく　転ぶ。
        むっくり　起き上がると　湖の　水面に
        顔を　映して　汚れていないか　調べる。
      ko: |-
        기운차게 돌아다니지만 자주 넘어진다.
        벌떡 일어나서는 호수의 수면에 얼굴을
        비추고 더러워지지 않았는지 살핀다.
      en: |-
        Smoochum actively runs about, but also falls quite often.
        Whenever the chance arrives, it will look for its reflection to
        make sure its face hasn’t become dirty.
      fr: |-
        Lippouti court dans tous les sens et tombe assez souvent.
        Quand il en a l’occasion, il regarde son reflet dans l’eau
        pour vérifier si son visage n’a pas été sali par ses chutes.
      de: |-
        Kussilla läuft hektisch umher, fällt aber auch ziemlich oft hin.
        Es lässt keine Möglichkeit aus, sein Spiegelbild zu betrachten,
        um sicherzustellen, dass sein Gesicht nicht schmutzig
        geworden ist.
      es: |-
        Smoochum va corriendo por todos lados, pero se cae también
        con frecuencia. Y, en cuanto tiene ocasión, se mira en algún
        sitio para ver si se ha manchado la cara.
      it: |-
        Smoochum scorrazza vivacemente, ma spesso inciampa
        e cade. Così, appena può, cerca di specchiarsi da qualche
        parte per assicurarsi di non essersi imbrattato il volto.
    ultra-sun:
      ja-Hrkt: |-
        なにかを　たしかめるときは　て　より
        さきに　くちびるで　ふれてみる。
        こまめに　なめて　よごれを　おとす。
      ja: |-
        なにかを　確かめるときは　手　より
        先に　唇で　触れてみる。
        こまめに　舐めて　汚れを　落とす。
      ko: |-
        무언가를 확인할 때는
        손보다 입술을 먼저 갖다 댄다.
        바지런히 핥아 더러운 것을 닦는다.
      zh-Hant: |-
        在確認某樣東西時不是用手，
        而是會先用嘴唇去觸碰。
        會經常用舌頭舔去髒污。
      zh-Hans: |-
        在确认某样东西时，
        会先用嘴唇而不是手去触碰试试。
        会经常用舌头舔去污渍。
      en: |-
        When it examines things, before touching them
        with its hands, it makes lip contact and then
        diligently licks all the dirt off its lips.
      fr: |-
        Avant même de toucher de ses mains un objet
        qui l’intéresse, il le tâte de ses lèvres. S’il est
        sale, il le lèche au passage pour le nettoyer.
      de: |-
        Bevor es Dinge in die Hände nimmt, die es
        interessieren, untersucht es diese mit den
        Lippen. Dabei leckt es sie sorgfältig sauber.
      es: |-
        Cuando quiere examinar algo, lo toca con los
        labios antes que con las manos. Si está sucio,
        limpia la mugre lamiendo repetidamente.
      it: |-
        Tocca gli oggetti con le labbra prima ancora
        che con le mani per analizzarli. Se sono sporchi,
        li lecca accuratamente per pulirli.
    ultra-moon:
      ja-Hrkt: |-
        くちびるは　びんかんな　センサー。
        あれないように　きの　じゅえきを
        まいにち　ぬって　ほしつしているよ。
      ja: |-
        唇は　敏感な　センサー。
        荒れないように　木の　樹液を
        毎日　塗って　保湿しているよ。
      ko: |-
        입술은 민감한 센서다.
        트지 않게 나무 수액을 매일 발라서
        촉촉하게 유지하고 있다.
      zh-Hant: |-
        嘴唇是敏感的感應器。
        為了不讓嘴唇乾裂，牠每天
        都會用樹液塗抹嘴唇來保濕。
      zh-Hans: |-
        嘴唇是敏感的感应器。
        为了不让嘴唇干裂，它每天
        都会用树汁涂抹嘴唇来保湿哦。
      en: |-
        Highly perceptive sensors, Smoochum’s lips are
        kept moist by its daily application of tree sap.
      fr: |-
        Ses lèvres sont des détecteurs hypersensibles.
        Il les enduit de sève tous les jours pour les
        garder hydratées et éviter les gerçures.
      de: |-
        Die Lippen sind sein empfindlichster Körperteil.
        Es schmiert sie täglich mit Baumsaft ein, damit
        sie nicht austrocknen und rissig werden.
      es: |-
        Los labios son la parte más sensible de su
        cuerpo. Para que no se le cuarteen, los mantiene
        hidratados a diario con savia de los árboles.
      it: |-
        Le sue labbra sono recettori molto sensibili.
        Per evitare che si rovinino, le mantiene idratate
        applicandovi ogni giorno la linfa degli alberi.
    sword:
      ja-Hrkt: |-
        ちょっとでも　かおが　よごれると
        みずあび。　からだの　よごれは
        あまり　きに　していないみたい。
      ja: |-
        ちょっとでも　顔が　汚れると
        水浴び。　体の　汚れは
        あまり　気にしていないみたい。
      ko: |-
        조금이라도 얼굴이 지저분해지면
        물로 씻는다. 몸은 지저분해져도
        별로 신경 쓰지 않는 듯하다.
      zh-Hant: |-
        只要稍微弄髒了臉，就會
        馬上去用水沖乾淨。但對於
        身體的髒污似乎就不太在意。
      zh-Hans: |-
        只要稍微弄脏了脸
        就会立刻去洗干净。
        身上脏了倒是不太在意。
      en: |-
        If its face gets even slightly dirty, Smoochum will
        bathe immediately. But if its body gets dirty,
        Smoochum doesn’t really seem to care.
      fr: |-
        Quand il s’aperçoit que son visage est sale,
        il le lave à l’eau, mais la propreté du reste
        de son corps ne semble pas le préoccuper.
      de: |-
        Wird Kussillas Gesicht auch nur ein bisschen
        schmutzig, wäscht es sich sofort. Schmutz am
        Rest seines Körpers scheint es nicht zu stören.
      es: |-
        En cuanto se le ensucia la cara, aunque sea un
        poco, se la lava con agua. En el resto del cuerpo,
        la suciedad no parece importarle mucho.
      it: |-
        Si sciacqua il volto alla minima traccia
        di sporcizia. Pare non presti la stessa
        attenzione al resto del corpo.
    shield:
      ja-Hrkt: |-
        こうきしんおうせいな　ポケモン。
        なんでも　くちびるで　ふれてみて
        すきか　きらいかを　きめている。
      ja: |-
        好奇心旺盛な　ポケモン。
        なんでも　唇で　触れてみて
        好きか　嫌いかを　決めている。
      ko: |-
        호기심이 왕성한 포켓몬이다.
        뭐든지 입술에 대보고
        좋은지 싫은지 판단한다.
      zh-Hant: |-
        好奇心旺盛的寶可夢。對於
        任何東西都會先用嘴唇去觸碰，
        再決定是喜歡還是討厭這東西。
      zh-Hans: |-
        好奇心旺盛的宝可梦。
        不管是什么都会试着用
        嘴唇去触碰，确认是否喜欢。
      en: |-
        This is a very curious Pokémon. Smoochum
        decides what it likes and dislikes by touching
        things with its lips.
      fr: |-
        Ce Pokémon très curieux touche tout et n’importe
        quoi avec ses lèvres pour déterminer ce qu’il aime
        et ce qu’il déteste.
      de: |-
        Ein äußerst neugieriges Pokémon, das alles mit
        seinen Lippen berührt, um herauszufinden, ob es
        etwas mag oder nicht.
      es: |-
        Este Pokémon rebosante de curiosidad lo toca
        todo con los labios para determinar qué cosas
        le gustan y cuáles no.
      it: |-
        È un Pokémon traboccante di curiosità.
        Stabilisce cosa gli piace e cosa no
        appoggiandovi le labbra.
