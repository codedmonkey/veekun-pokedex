    x:
      ja-Hrkt: |-
        しんかした　ばしょによって　すがたが
        かわる。みぢかにある　ざいりょうが
        からだの　いちぶに　なるのだ。
      ja: |-
        進化した　場所によって
        姿が　変わる。身近にある　材料が
        体の　一部に　なるのだ。
      ko: |-
        진화한 장소에 따라 모습이
        바뀐다. 가까이 있는 재료가
        몸의 일부가 된다.
      en: |-
        Its appearance changes depending on where it
        evolved. The materials on hand become a part of
        its body.
      fr: |-
        Son apparence varie selon le lieu d’évolution. Son
        corps est façonné avec les matériaux à disposition.
      de: |-
        Die Umgebung, in der es sich entwickelt, bestimmt
        sein Aussehen. Es formt seinen Körper mithilfe
        der umliegenden Materialien.
      es: |-
        Su apariencia varía según dónde evolucione. Los
        materiales que haya pasan a formar parte de su
        cuerpo.
      it: |-
        Il suo aspetto dipende dal luogo in cui si evolve.
        Tutto ciò che ha intorno va a costituire il suo corpo.
    'y':
