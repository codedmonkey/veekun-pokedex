        いっしょう　ミノを　ぬぐことはない。
      ja: |-
        ミノムッチから　進化したとき
        ミノが　体の　一部に　なった。
        一生　ミノを　脱ぐことはない。
      ko: |-
        도롱충이로부터 진화할 때
        도롱이가 몸의 일부가 되었다.
        일생 도롱이를 벗는 일은 없다.
      en: |-
        When Burmy evolved, its cloak became a part of
        this Pokémon’s body. The cloak is never shed.
      fr: |-
        Quand Cheniti a évolué, sa cape a fusionné avec son
        corps. Cheniselle ne s’en sépare jamais.
      de: |-
        Als sich Burmy entwickelte, wurde sein Umhang
        Teil des Körpers. Es legt den Umhang niemals ab.
      es: |-
        Cuando Burmy evolucionó, su caparazón pasó a formar
        parte de este Pokémon.
      it: |-
        Con l’evoluzione, il manto di Burmy diventa parte del
        corpo di questo Pokémon. Non se ne separa mai.
    omega-ruby:
