  flavor_text:
    black:
      en: |-
        It fights using the scalchop on its
        stomach. In response to an attack,
        it retaliates immediately by slashing.
      fr: |-
        Il combat avec le coupillage de son
        ventre. Il peut parer un assaut et
        immédiatement contre-attaquer.
    white:
      en: |-
        The scalchop on its stomach is made from
        the same elements as claws. It detaches
        the scalchop for use as a blade.
      fr: |-
        Le coupillage sur son ventre est fait de
        la même matière que ses griffes. Il le
        détache pour l’utiliser comme une dague.
    black-2:
      en: |-
        The scalchop on its stomach isn’t
        just used for battle--it can be used
        to break open hard berries as well.
    white-2:
      en: |-
        The scalchop on its stomach isn’t
        just used for battle--it can be used
        to break open hard berries as well.
    x:
      ja-Hrkt: |-
        おなかに　できる　ホタチは
        たたかうとき　だけでなく　かたい
        きのみを　わるときにも　つかう。
      ja: |-
        お腹に　できる　ホタチは
        戦うとき　だけでなく　硬い
        木の実を　割るときにも　使う。
      ko: |-
        배에 생기는 가리비칼은
        싸울 때뿐 아니라 딱딱한
        나무열매를 쪼갤 때도 사용한다.
      en: |-
        The scalchop on its stomach isn’t just used for
        battle--it can be used to break open hard berries
        as well.
      fr: |-
        Le coupillage sur son ventre lui sert non seulement à
        combattre, mais aussi à trancher les Baies très dures.
      de: |-
        Die Muschel an seinem Bauch dient ihm nicht nur
        als Waffe, sondern auch als Messer, mit dem es
        Beeren aufschneidet.
      es: |-
        La vieira de su ombligo no solo sirve como arma, sino
        también como instrumento para cortar las bayas que
        estén duras.
      it: |-
        Non usa la conchiglia del suo ventre solo durante
        la lotta, ma anche per tagliare a metà le bacche.
    'y':
      ja-Hrkt: |-
        おなかの　ホタチで　たたかう。
        こうげきを　うけとめてから　すかさず
        きりつけて　はんげきするのだ。
      ja: |-
        お腹の　ホタチで　戦う。
        攻撃を　受け止めてから　すかさず
        切りつけて　反撃するのだ。
      ko: |-
        배에 있는 가리비칼로 싸운다.
        공격을 막고 그 즉시
        베어 반격한다.
      en: |-
        It fights using the scalchop on its stomach.
        In response to an attack, it retaliates immediately
        by slashing.
      fr: |-
        Il combat avec le coupillage de son ventre. Il peut
        parer un assaut et immédiatement contre-attaquer.
      de: |-
        Kämpft mit der Muschel auf seinem Bauch.
        Pariert es einen Angriff, schlägt es sofort
        mit einer Schnitt-Attacke zurück.
      es: |-
        Ataca con la vieira de su ombligo. En cuanto para un
        ataque, pasa al contraataque sin dilación.
      it: |-
        Combatte con la conchiglia che ha sul ventre.
        Contrattacca prontamente dopo aver parato
        l’attacco avversario.
    omega-ruby:
      ja-Hrkt: |-
