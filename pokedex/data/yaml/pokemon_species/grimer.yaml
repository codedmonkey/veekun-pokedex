    black:
      en: |-
        It was born when sludge in a dirty
        stream was exposed to the moon’s
        X-rays. It appears among filth.
      fr: |-
        Il est né d’un torrent de boue
        exposé aux rayons X de la lune.
        Il vit dans les ordures.
    white:
      en: |-
        It was born when sludge in a dirty
        stream was exposed to the moon’s
        X-rays. It appears among filth.
      fr: |-
        Il est né d’un torrent de boue
        exposé aux rayons X de la lune.
        Il vit dans les ordures.
    black-2:
      en: |-
        Born from sludge, these Pokémon now
        gather in polluted places and increase
        the bacteria in their bodies.
    white-2:
      en: |-
        Born from sludge, these Pokémon now
        gather in polluted places and increase
        the bacteria in their bodies.
    x:
      ja-Hrkt: |-
        つきからの　エックスせんをあびた
        ヘドロが　ベトベターにへんかした。
        きたないモノが　だいこうぶつ。
      ja: |-
        月からの　エックス線を　浴びた
        ヘドロが　ベトベターに　変化した。
        汚いものが　大好物。
      ko: |-
        달로부터의 X선을 쬔
        오물이 질퍽이로 변화했다.
        더러운 것을 좋아한다.
      en: |-
        Sludge exposed to X-rays from the moon
        transformed into Grimer. It loves feeding
        on filthy things.
      fr: |-
        Tadmorv est né d’un tas de déchets exposé aux
        rayons X lunaires. Ce Pokémon adore se nourrir
        de choses dégoûtantes.
      de: |-
        Schlamm, der Röntgenstrahlung vom Mond
        ausgesetzt war, wurde zu Sleima. Es isst
        am liebsten dreckige Dinge.
      es: |-
        Nace de lodo alterado al filtrarse en el agua los
        rayos X reflejados por la Luna. Se alimenta de
        sustancias desagradables.
      it: |-
        Grimer è nato da fango esposto ai raggi X provenienti
        dalla luna. Ama nutrirsi di sostanze sudicie.
    'y':
      ja-Hrkt: |-
        きたない　ばしょに　あらわれる。
        こうじょうが　ながす　ヘドロ
        はいえきを　のんで　いきている。
      ja: |-
        汚い　場所に　現れる。
        工場が　流す　ヘドロ廃液を
        飲んで　生きている。
      ko: |-
        지저분한 곳에 모습을 드러낸다.
        공장에서 내보내는 오물
        폐수를 마시며 살고 있다.
      en: |-
        Appears in filthy areas. It thrives by sucking up
        polluted sludge that is pumped out of factories.
      fr: |-
        Vivant dans des tas d’ordures, il se nourrit des
        déchets polluants rejetés par les usines.
      de: |-
        Dieses Pokémon lebt vorwiegend in schmutzigen
        Gebieten und ernährt sich von Industrieabfällen.
      es: |-
        Aparece en zonas asquerosas. Crece absorbiendo los
        residuos tóxicos expulsados por las fábricas.
      it: |-
        Prospera in zone paludose. Cresce nutrendosi dei
        liquami di scarico delle fabbriche.
    omega-ruby:
      ja-Hrkt: |-
        ドロドロ　ブヨブヨした　からだは　どんなに
        ほそい　すきまにも　はいりこむことが　できる。
        げすいかんに　もぐって　きたない　みずを　のむ。
      ja: |-
        ドロドロ　ブヨブヨした　体は　どんなに
        細い　すき間にも　入り込むことが　できる。
        下水管に　潜って　汚い　水を　飲む。
      ko: |-
        흐물흐물 물렁물렁한 몸은 아무리
        좁은 틈이라도 파고들어 갈 수 있다.
        하수관에 들어가 지저분한 물을 마신다.
      en: |-
        Grimer’s sludgy and rubbery body can be forced through any
        opening, however small it may be. This Pokémon enters sewer
        pipes to drink filthy wastewater.
      fr: |-
        Le corps boueux et gélatineux de Tadmorv peut s’enfoncer
        dans n’importe quelle ouverture, même la plus petite.
        Ce Pokémon se promène dans les tuyaux des égouts pour
        boire de l’eau croupie.
      de: |-
        Sleimas glitschiger, gummiartiger Körper passt durch jede
        noch so kleine Öffnung. Dieses Pokémon steigt in die
        Kanalisation hinab, um fauliges Abwasser zu trinken.
      es: |-
        El elástico cuerpo de lodo de Grimer le permite colarse por
        cualquier orificio, sea del tamaño que sea. Este Pokémon entra
        en los bajantes de las cloacas para beberse el agua sucia.
      it: |-
        Il corpo fangoso e gommoso di Grimer può passare attraverso
        ogni apertura, anche la più angusta. Si intrufola dentro
        le condotte fognarie per bere le ripugnanti acque di scarico.
    alpha-sapphire:
      ja-Hrkt: |-
        おせんされた　かいていの　ヘドロから　うまれた。
        きたない　ものが　だいすきで　からだじゅうから
        バイキンだらけの　えきたいを　たれながしている。
      ja: |-
        汚染された　海底の　ヘドロから　生まれた。
        汚い　ものが　大好きで　体中から
        バイキンだらけの　液体を　垂れ流している。
      ko: |-
        오염된 해저의 진흙에서 태어났다.
        더러운 것을 매우 좋아해서 몸 전체에서
        세균 범벅인 액체가 흘러나오고 있다.
      en: |-
        Grimer emerged from the sludge that settled on a polluted
        seabed. This Pokémon loves anything filthy. It constantly
        leaks a horribly germ-infested fluid from all over its body.
      fr: |-
        Tadmorv est apparu dans la vase accumulée sur un bord
        de mer pollué. Ce Pokémon aime tout ce qui est dégoûtant.
        Une substance pleine de germes suinte constamment
        de tout son corps.
      de: |-
        Sleima ist aus dem Schlamm eines verseuchten Flussbetts
        entstanden. Dieses Pokémon liebt verschmutzte Dinge.
        Es scheidet ständig eine mit Bakterien verseuchte Flüssigkeit
        aus seinem ganzen Körper aus.
      es: |-
        Grimer emergió del lodo que se formó en una zona
        contaminada en el fondo del mar. A este Pokémon le encanta
        todo lo que sea suciedad. Emana continuamente por todo el
        cuerpo un horrible fluido contaminado por bacterias.
      it: |-
        Grimer proviene dal fango depositato sui fondali inquinati.
        Infatti ama tutto ciò che è sudicio e tossico. Emana
        continuamente un fluido batterico velenoso da ogni parte
        del corpo.
    sun:
      ja-Hrkt: |-
        こうじょうが　たれながす　ヘドロの
        はいえきが　おもな　エサ　なのだ。
        さいきんは　かずが　へってきた。
      ja: |-
        工場が　垂れ流す　ヘドロの
        廃液が　主な　餌　なのだ。
        最近は　数が　減ってきた。
      ko: |-
        공장에서 흘러나오는
        오물 폐수가 주요 먹이다.
        최근에는 수가 줄어들고 있다.
      zh-Hant: |-
        主要的食物是
        工廠排放的污泥廢液。
        最近數量減少了。
      zh-Hans: |-
        工厂排放的污泥废液
        是其主要的饵料。
        最近数量减少了。
      en: |-
        Its main source of food is the slimy industrial
        waste of factories. This Pokémon’s numbers
        have been decreasing in recent years.
      fr: |-
        Il s’alimente principalement des déchets
        chimiques rejetés par les usines. Ce Pokémon
        est devenu plus rare ces derniers temps.
      de: |-
        Es ernährt sich primär von Industrieabfällen.
        In letzter Zeit sieht man es viel seltener als
        früher.
      es: |-
        Su principal fuente de alimento son los residuos
        industriales. Últimamente la población de Grimer
        ha menguado bastante.
      it: |-
        Si nutre principalmente di rifiuti industriali
        fangosi. Negli ultimi tempi, il numero di Grimer
        sta diminuendo.
    moon:
      ja-Hrkt: |-
        つきからの　エックスせんを　あびた
        ヘドロが　へんかし　たんじょう。
        からだの　ばいきんが　へると　しぬ。
      ja: |-
        月からの　Ｘ線を　浴びた
        ヘドロが　変化し　誕生。
        身体の　ばい菌が　減ると　死ぬ。
      ko: |-
        달의 엑스선을 쬔
        진흙이 변화하여 태어났다.
        몸의 세균이 줄어들면 죽는다.
      zh-Hant: |-
        照射了來自月亮的Ｘ射線後，
        污泥發生變化而誕生。
        身體的細菌如果減少就會死亡。
      zh-Hans: |-
        污泥沐浴了来自月亮的Ｘ射线后，
        发生变化而诞生的。
        身体的细菌如果减少就会死亡。
      en: |-
        It was born from sludge transformed by
        exposure to X-rays from the moon. When its
        internal load of germs decreases, it dies.
      fr: |-
        Né d’un tas de déchets exposés aux rayons X
        réfléchis par la lune, il meurt si les microbes qui
        pullulent sur son corps diminuent en nombre.
      de: |-
        Schlamm, der Röntgenstrahlung vom Mond
        ausgesetzt war, wurde zu Sleima. Sinkt die
        Zahl der Bakterien in seinem Körper, stirbt es.
      es: |-
        Nace del lodo expuesto a los rayos X reflejados
        por la luna. Si el número de bacterias de su
        cuerpo disminuye, su vida corre peligro.
      it: |-
        È nato da fango esposto ai raggi X provenienti
        dalla luna. Per sopravvivere, deve conservare
        un’elevata popolazione batterica.
    ultra-sun:
      ja-Hrkt: |-
        かいていの　ヘドロから　うまれた。
        せいけつな　ばしょでは　たいないの
        ばいきんが　ふやせず　しんでしまう。
      ja: |-
        海底の　ヘドロから　生まれた。
        清潔な　場所では　体内の
        ばい菌が　増やせず　死んでしまう。
      ko: |-
        바다 밑의 진흙에서 태어났다.
        청결한 장소에서는 체내의
        세균이 증식되지 않아 죽어 버린다.
      zh-Hant: |-
        誕生自海底的污泥。
        在乾淨的地方，牠會因為
        體內的細菌無法增長而死去。
      zh-Hans: |-
        诞生于海底的污泥。
        在干净的地方，它就会因
        体内的细菌无法增长而死去。
      en: |-
        It was born from sludge on the ocean floor. In a
        sterile environment, the germs within its body
        can’t multiply, and it dies.
      fr: |-
        Il est né de la vase polluée des fonds marins.
        Dans les lieux trop propres, sa flore bactérienne
        ne peut pas proliférer et il dépérit.
      de: |-
        Sleima ist aus dem Schlamm am Meeresgrund
        entstanden. An sterilen Orten kann es seine
        Bakterien nicht kultivieren und stirbt.
      es: |-
        Surgió del limo oceánico. En hábitats impolutos,
        los gérmenes de su cuerpo no pueden medrar y
        termina falleciendo.
      it: |-
        Proviene dal fango dei fondali marini. Non può
        sopravvivere in ambienti puliti perché i batteri
        nel suo corpo non riescono a moltiplicarsi.
    ultra-moon:
      ja-Hrkt: |-
        さいきんは　こうじょうが　ながす
        はいえきが　きれいで　エサが　ない。
        じき　ぜつめつすると　いわれている。
      ja: |-
        最近は　工場が　流す
        廃液が　綺麗で　エサが　ない。
        じき　絶滅すると　いわれている。
      ko: |-
        최근에는 공장에서 나오는
        폐수가 깨끗해서 먹이가 없다.
        곧 멸종될 것이라고 전해진다.
      zh-Hant: |-
        最近工廠排放的廢水太乾淨，
        使得牠沒東西可吃。
        據說就快要絕種了。
      zh-Hans: |-
        最近工厂流出的废水太干净，
        它都没东西可吃。
        据说马上就要灭绝了。
      en: |-
        The wastewater coming from factories is clean
        these days, so Grimer have nothing to eat.
        They’re said to be on the verge of extinction.
      fr: |-
        Les usines ne rejetant désormais plus de
        déchets toxiques, il n’a plus rien à se mettre
        sous la dent et se voit menacé d’extinction.
      de: |-
        Es ernährt sich von Industrieabfällen, die durch
        umweltfreundliche Methoden nun aber knapp
        werden. Es ist daher vom Aussterben bedroht.
      es: |-
        Debido a la reducción en los vertidos de aguas
        residuales, su fuente de alimento ha menguado
        y ahora se encuentra en peligro de extinción.
      it: |-
        Poiché gli scarichi industriali sono sempre
        più puliti, fatica a trovare fonti di nutrimento.
        Sembra che per questo rischi l’estinzione.
    lets-go-pikachu:
      ja-Hrkt: |-
        ヘドロが　かたまって　うまれた。
        くさくて　さわることが　できないし
        とおったあとには　くさも　はえない。
      ja: |-
        ヘドロが　固まって　生まれた。
        臭くて　さわることが　できないし
        通った跡には　草も　生えない。
      ko: |-
        진흙이 뭉쳐져서 태어났다.
        악취 때문에 건드릴 엄두가 안 나고
        지나간 자리에는 풀 한 포기 나지 않는다.
      zh-Hant: |-
        由許多污泥凝聚而成。
        散發著惡臭，讓人無法觸碰。
        經過的地方寸草不生。
      zh-Hans: |-
        它由囤积的淤泥而形成。
        臭到让人无法碰触，凡是
        它走过的地方都寸草不生。
      en: |-
        Made of congealed sludge. It smells too putrid
        to touch. Even weeds won’t grow in its path.
      fr: |-
        Ce tas de fange sent si mauvais qu’il est
        impossible de le toucher. Plus rien ne pousse
        dans son sillage putride.
      de: |-
        Sleima ist aus erhärtetem Schlamm entstanden.
        Es riecht sehr penetrant und man sollte es nicht
        berühren. Wo es hintritt, wächst kein Gras mehr.
      es: |-
        Está hecho de lodo endurecido. Pocos se atreven
        a tocarlo debido a su pestilencia y composición
        nociva. Allá por donde pasa no crece la hierba.
      it: |-
        Formato da fanghi tossici solidificati, emana
        un tanfo nauseabondo ed è impossibile toccarlo.
        Dove passa lui non cresce più nemmeno l’erba.
    lets-go-eevee:
      ja-Hrkt: |-
        ヘドロが　かたまって　うまれた。
        くさくて　さわることが　できないし
        とおったあとには　くさも　はえない。
      ja: |-
        ヘドロが　固まって　生まれた。
        臭くて　さわることが　できないし
        通った跡には　草も　生えない。
      ko: |-
        진흙이 뭉쳐져서 태어났다.
        악취 때문에 건드릴 엄두가 안 나고
        지나간 자리에는 풀 한 포기 나지 않는다.
      zh-Hant: |-
        由許多污泥凝聚而成。
        散發著惡臭，讓人無法觸碰。
        經過的地方寸草不生。
      zh-Hans: |-
        它由囤积的淤泥而形成。
        臭到让人无法碰触，凡是
        它走过的地方都寸草不生。
      en: |-
        Made of congealed sludge. It smells too putrid
        to touch. Even weeds won’t grow in its path.
      fr: |-
        Ce tas de fange sent si mauvais qu’il est
        impossible de le toucher. Plus rien ne pousse
        dans son sillage putride.
      de: |-
        Sleima ist aus erhärtetem Schlamm entstanden.
        Es riecht sehr penetrant und man sollte es nicht
        berühren. Wo es hintritt, wächst kein Gras mehr.
      es: |-
        Está hecho de lodo endurecido. Pocos se atreven
        a tocarlo debido a su pestilencia y composición
        nociva. Allá por donde pasa no crece la hierba.
      it: |-
        Formato da fanghi tossici solidificati, emana
        un tanfo nauseabondo ed è impossibile toccarlo.
        Dove passa lui non cresce più nemmeno l’erba.
