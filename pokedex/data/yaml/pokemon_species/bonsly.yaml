    alpha-sapphire:
      ja-Hrkt: |-
        かんそうした　くうきを　このむ。
        すいぶんを　ちょうせつ　するときに
        だす　みずが　なみだに　みえる。
      ja: |-
        乾燥した　空気を　好む。
        水分を　調節　するときに
        出す　水が　涙に　見える。
      ko: |-
        건조한 공기를 좋아한다.
        수분을 조절할 때에 내는 물이
        눈물처럼 보인다.
      en: |-
        It prefers an arid atmosphere. It leaks water that
        looks like tears when adjusting its moisture level.
      fr: |-
        Adepte des climats secs, il régule son humidité en laissant
        couler ce qui ressemble à des larmes.
      de: |-
        Mag es trocken. Gleicht es seinen Wasserhaushalt aus,
        entweicht ihm Wasser, das wie Tränen geformt ist.
      es: |-
        Prefiere entornos áridos. Sus ojos expulsan agua para ajustar
        sus niveles de hidratación corporal.
      it: |-
        Ama i luoghi aridi. Quando regola l’umidità del corpo sembra
        che pianga.
    sun:
      ja-Hrkt: |-
        みずが　にがてで　かわいた　ばしょに
        すんでいる。　まわりに　みどりが
        すくないので　よく　めだつ。
      ja: |-
        水が　苦手で　乾いた　場所に
        棲んでいる。　周りに　緑が
        少ないので　よく　目立つ。
      ko: |-
        물을 싫어해 건조한 장소에
        살고 있다. 주변에는 녹색이
        적어 눈에 잘 띈다.
      zh-Hant: |-
        很怕水，所以生活在乾燥的地方。
        因為周圍綠色植物很少，所以相當顯眼。
      zh-Hans: |-
        很怕水，所以生活在干燥的地方。
        因为周围绿色很少，所以相当醒目。
      en: |-
        It does not deal well with water, so it lives in dry
        locales. Since its surroundings tend to lack
        greenery, it stands out noticeably.
      fr: |-
        Comme il a horreur de l’eau, on le trouve surtout
        dans les régions arides. Avec si peu de verdure
        alentour, on le repère tout de suite.
      de: |-
        Es mag kein Wasser und lebt an trockenen
        Orten. Da es in seiner Umgebung nur wenig
        grüne Pflanzen gibt, sticht es deutlich heraus.
      es: |-
        No le gusta el agua, por lo que suele vivir en
        lugares secos. Como hay poco verdor a su
        alrededor, suele destacar mucho.
      it: |-
        Non ama l’acqua e preferisce vivere in ambienti
        aridi. Data la mancanza di vegetazione in questi
        luoghi, individuarlo è molto facile.
    moon:
      ja-Hrkt: |-
        からだの　よけいな　すいぶんを　めから
        そとに　だす。　その　せいぶんは
        にんげんの　あせに　にている。
      ja: |-
        身体の　余計な　水分を　目から
        外に　出す。　その　成分は
        人間の　汗に　似ている。
      ko: |-
        몸에 불필요한 수분은 눈을
        통해 밖으로 내보낸다. 그 성분은
        인간의 땀과 비슷하다.
      zh-Hant: |-
        會從眼睛排出體內多餘的水分。
        該成分接近人類的汗液。
      zh-Hans: |-
        会从眼睛排出体内多余的水分。
        该成分接近人类的汗液。
      en: |-
        From its eyes, it can expel excess moisture from
        its body. This liquid is similar in composition to
        human sweat.
      fr: |-
        Il se débarrasse des liquides superflus par ses
        yeux. La composition chimique de ces liquides
        ressemble à celle de la sueur humaine.
      de: |-
        Überschüssiges Wasser in seinem Körper
        scheidet es über die Augen aus. Dieses ist
        vergleichbar mit dem Schweiß des Menschen.
      es: |-
        Expulsa por los ojos el líquido corporal que le
        sobra. La composición química de este líquido
        se parece a la del sudor de los seres humanos.
      it: |-
        Espelle dagli occhi l’umidità corporea in eccesso.
        Si tratta di un fenomeno fisiologico simile alla
        sudorazione.
    ultra-sun:
      ja-Hrkt: |-
        ひとみから　すいぶんを　ほうしゅつ。
        ないているように　みえるので　てきを
        ゆだんさせる　こうかも　あるらしい。
      ja: |-
        瞳から　水分を　放出。
        泣いているように　見えるので　敵を
        油断させる　効果も　あるらしい。
      ko: |-
        눈동자에서 수분을 방출한다.
        울고 있는 것처럼 보이기 때문에
        적을 방심시키는 효과도 있는 듯하다.
      zh-Hant: |-
        會從眼睛排出水分。
        因為看起來就像是在哭，
        似乎也有讓敵人疏忽大意的效果。
      zh-Hans: |-
        会从眼睛里排出水分。
        看起来就像是正在哭泣，
        所以似乎也有让敌人麻痹大意的效果。
      en: |-
        It discharges moisture from its eyes, making it
        look like it’s crying—apparently an effective way
        of getting enemies to let down their guard.
      fr: |-
        Il évacue tout surplus d’eau par les yeux.
        Cela ressemble à une crise de larmes et
        a parfois pour effet d’attendrir ses ennemis.
      de: |-
        Es gibt über seine Pupillen Wasser ab, was den
        Eindruck erweckt, es würde weinen. Bei seinen
        Feinden führt das offenbar zu Unachtsamkeit.
      es: |-
        Expulsa agua por los ojos, lo que da la impresión
        de que está llorando. Esto puede sorprender a
        los enemigos y hacer que bajen la guardia.
      it: |-
        Espelle l’umidità dagli occhi dando l’impressione
        che stia piangendo. I nemici che assistono a
        questo fenomeno abbassano la guardia.
    ultra-moon:
      ja-Hrkt: |-
        あまり　からだが　しめりすぎると
        しんでしまうので　あせの　ように
        めから　すいぶんを　だしている。
      ja: |-
        あまり　身体が　湿りすぎると
        死んでしまうので　汗の　ように
        目から　水分を　出している。
      ko: |-
        너무 몸이 습해지면
        죽어 버리기 때문에 땀처럼
        눈에서 수분을 내보내고 있다.
      zh-Hant: |-
        如果身體太過潮濕就會死掉，
        所以牠會像分泌汗水那樣
        從眼睛排出水分。
      zh-Hans: |-
        如果身体过于潮湿就会死掉，
        因此会像分泌汗液那样
        从眼睛里排出水分。
      en: |-
        If its body gets too damp, it will die. So, in a
        process reminiscent of sweating, its eyes
        expel moisture.
      fr: |-
        Absorber trop d’humidité peut mettre sa vie
        en danger, c’est pourquoi il « sue » tout excès
        de liquide par les yeux.
      de: |-
        Da ein zu hoher Wasseranteil für seinen Körper
        lebensbedrohlich werden kann, scheidet es
        über die Augen Wasser aus wie Schweiß.
      es: |-
        Debido a que un exceso de humedad en su
        cuerpo puede provocarle la muerte, expulsa
        líquido por los ojos como si fuera sudor.
      it: |-
        Se il suo corpo è troppo umido, la sua vita è
        in pericolo. Per questo espelle dagli occhi
        l’umidità corporea come se fosse sudore.
    sword:
      ja-Hrkt: |-
        あせと　なみだを　めから　ながす。
        あせは　ちょっぴり　しょっぱくて
        なみだは　ほんのり　にがい　あじだ。
      ja: |-
        汗と　涙を　目から　流す。
        汗は　ちょっぴり　しょっぱくて
        涙は　ほんのり　苦い　味だ。
      ko: |-
        땀과 눈물이 모두 눈에서 나온다.
        땀은 약간 짠맛이고
        눈물은 살짝 씁쓸한 맛이다.
      zh-Hant: |-
        會從眼睛裡排出汗水和淚水。
        牠的汗水有一點點鹹，
        淚水則略微帶著一些苦味。
      zh-Hans: |-
        会从眼睛里排出汗和泪水。
        它的汗水有一点点咸，
        泪水则略微带着一些苦味。
      en: |-
        It expels both sweat and tears from its eyes.
        The sweat is a little salty, while the tears have
        a slight bitterness.
      fr: |-
        Il évacue sa sueur et ses larmes par les yeux.
        Sa sueur a un goût légèrement salé, tandis que
        ses larmes ont un soupçon d’amertume.
      de: |-
        Es sondert sowohl Schweiß als auch Tränen über
        seine Augen ab. Sein Schweiß schmeckt leicht
        salzig, seine Tränen ein bisschen bitter.
      es: |-
        Expulsa sudor y lágrimas por los ojos. El sudor
        es ligeramente salado y las lágrimas tienen un
        leve regusto amargo.
      it: |-
        Dagli occhi espelle sudore e lacrime.
        Il primo ha un gusto lievemente salato,
        le seconde sono leggermente amare.
    shield:
      ja-Hrkt: |-
        かんそうした　いわばに　くらす。
        みどりの　たまは　かわくほど
        ツヤツヤと　にぶく　かがやく。
      ja: |-
        乾燥した　岩場に　暮らす。
        緑の　玉は　乾くほど
        ツヤツヤと　鈍く　輝く。
      ko: |-
        건조한 바위 밭에 산다.
        초록색 구슬은 마를수록
        반들반들 희미하게 빛난다.
      zh-Hant: |-
        棲息在空氣乾燥岩石裸露的地方。
        空氣越是乾燥，牠身上的綠球
        就越是會泛出黯淡的光澤。
      zh-Hans: |-
        栖息在空气干燥岩石裸露的地方。
        空气越是干燥，它身上的绿球
        就越是会泛出暗淡的光泽。
      en: |-
        This Pokémon lives in dry, rocky areas. As its
        green spheres dry out, their dull luster increases.
      fr: |-
        Il vit dans les zones rocheuses arides.
        Quand ses boules vertes sont sèches,
        elles se mettent à briller légèrement.
      de: |-
        Es lebt in trockenen Felsgebieten. Je trockener
        seine grünen Kugeln sind, desto matter ist ihr
        Glanz.
      es: |-
        Vive en entornos áridos y pedregosos. Cuanto
        más se secan sus esferas verdes, más destaca
        su sutil lustre.
      it: |-
        Vive in ambienti aridi e pietrosi. Quando sono
        secche, le sue sfere verdi emettono un fioco
        bagliore.
