    x:
      ja-Hrkt: |-
        かんそうした　ばしょを　このむ。
        め　から　みずを　だして　からだの
        すいぶんを　ちょうせつする。
      ja: |-
        乾燥した　場所を　好む。
        目から　水を　出して
        体の　水分を　調節する。
      ko: |-
        건조한 장소를 좋아한다.
        눈에서 물을 내어 몸의
        수분을 조절한다.
      en: |-
        It prefers arid environments. It leaks water from its
        eyes to adjust its body’s fluid levels.
      fr: |-
        Il préfère les sols arides. Il évacue l’eau par ses yeux
        pour réguler ses fluides corporels.
      de: |-
        Es bevorzugt trockene Gebiete. Es gibt über die Augen
        Wasser ab, um den Wasserhaushalt zu regulieren.
      es: |-
        Prefiere entornos áridos. Sus ojos expulsan agua para
        ajustar los niveles de fluido corporal.
      it: |-
        Preferisce le terre aride. Rilascia acqua dagli occhi
        per regolare il livello dei suoi fluidi corporei.
    'y':
      ja-Hrkt: |-
        かんそうした　くうきを　このむ。
        すいぶんを　ちょうせつ　するときに
        だす　みずが　なみだに　みえる。
      ja: |-
        乾燥した　空気を　好む。
        水分を　調節　するときに
        出す　水が　涙に　見える。
      ko: |-
        건조한 공기를 좋아한다.
        수분을 조절할 때에 내는 물이
        눈물처럼 보인다.
      en: |-
        It prefers an arid atmosphere. It leaks water that
        looks like tears when adjusting its moisture level.
      fr: |-
        Adepte des climats secs, il régule son humidité en
        laissant couler ce qui ressemble à des larmes.
      de: |-
        Mag es trocken. Gleicht es seinen Wasserhaushalt aus,
        entweicht ihm Wasser, das wie Tränen geformt ist.
      es: |-
        Prefiere entornos áridos. Sus ojos expulsan agua
        para ajustar sus niveles de hidratación corporal.
      it: |-
        Ama i luoghi aridi. Quando regola l’umidità del
        corpo sembra che pianga.
    omega-ruby:
      ja-Hrkt: |-
