    black-2:
      en: |-
        It digs deep burrows to live in.
        When in danger, it rolls up its
        body to withstand attacks.
    white-2:
      en: |-
        It digs deep burrows to live in.
        When in danger, it rolls up its
        body to withstand attacks.
    x:
      ja-Hrkt: |-
        じめんに　あなを　ほって　すむ。
        じぶんに　きけんが　せまると
        まるくなって　みを　まもる。
      ja: |-
        地面に　穴を　掘って　住む。
        自分に　危険が　迫ると
        まるくなって　身を　守る。
      ko: |-
        지면에 구멍을 파고 산다.
        자신에게 위험이 닥쳐오면
        둥글게 말아서 몸을 보호한다.
      en: |-
        It burrows and lives underground. If threatened,
        it curls itself up into a ball for protection.
      fr: |-
        Il s’enterre et vit dans les sous-sols. S’il se sent
        menacé, il se met en boule pour se protéger.
      de: |-
        Es gräbt und lebt im Erdboden. Bei Gefahr rollt es
        sich zum Schutz zu einem Ball zusammen.
      es: |-
        Este Pokémon permanece bajo tierra. Si se siente
        amenazado, se enrosca para defenderse.
      it: |-
        Vive sottoterra, scavando buche. Se minacciato,
        si protegge raggomitolandosi.
    'y':
      ja-Hrkt: |-
        みずけを　きらい　かんそうちに
        ふかいあなを　ほって　せいかつする。
        いっしゅんで　からだを　まるめる。
      ja: |-
        水気を　嫌い　乾燥地に
        深い穴を　掘って　生活する。
        一瞬で　体を　まるめる。
      ko: |-
        습기를 싫어해서 건조한 땅에
        깊은 구멍을 파고 생활한다.
        눈 깜짝할 사이에 몸을 둥글게 만다.
      en: |-
        Disliking water, it lives in deep burrows in arid
        areas. It can roll itself instantly into a ball.
      fr: |-
        Détestant l’eau, il vit dans de profondes tanières
        des régions arides. Il aime se rouler en boule.
      de: |-
        Da es Wasser verabscheut, gräbt es sich
        in trockenes Erdreich ein. Es kann sich rasch
        zu einem Ball rollen.
      es: |-
        Como odia el agua, vive en madrigueras muy
        profundas en zonas áridas. Puede hacerse una bola
        al instante.
      it: |-
        Odia l’acqua e vive in tane profonde all’interno di
        zone aride. È capace di appallottolarsi in un istante.
    omega-ruby:
      ja-Hrkt: |-
        すいぶんを　むだなく　きゅうしゅうする　からだの
        つくりなので　かんそうした　すなちでも　へいき。
        からだを　まるめて　てきの　こうげきを　ふせぐ。
      ja: |-
        水分を　無駄なく　吸収する　体の
        つくりなので　乾燥した　砂地でも　平気。
        体を　丸めて　敵の　攻撃を　防ぐ。
      ko: |-
        몸이 수분을 효율적으로 흡수하기 때문에
        건조한 모래땅에서도 문제없다.
        몸을 둥글게 만들어 적의 공격을 막는다.
      en: |-
        Sandshrew’s body is configured to absorb water without waste,
        enabling it to survive in an arid desert. This Pokémon curls up
        to protect itself from its enemies.
      fr: |-
        Le corps de Sabelette lui permet d’économiser l’eau
        qu’il absorbe, afin de survivre longtemps dans le désert.
        Ce Pokémon s’enroule sur lui-même pour se protéger
        de ses ennemis.
      de: |-
        Sandans Körper kann sehr viel Wasser aufnehmen, sodass es
        auch in der Wüste überleben kann. Dieses Pokémon rollt sich
        zusammen, um sich vor Feinden zu schützen.
      es: |-
        Sandshrew es capaz de absorber agua y no perder ni una
        gota, algo que le permite sobrevivir en el desierto. Este
        Pokémon se enrosca para defenderse de los enemigos.
      it: |-
        Il corpo di Sandshrew ha una conformazione che gli consente
        di assorbire l’acqua senza perdite e di sopravvivere nell’aridità
        del deserto. Questo Pokémon si avvolge su se stesso per
        proteggersi dai nemici.
    alpha-sapphire:
      ja-Hrkt: |-
        からからに　かわいた　ひふは　とても　かたく
        まるくなると　どんな　こうげきでも　はねかえす。
        よなかは　さばくの　すなに　もぐって　ねむる。
      ja: |-
        からからに　乾いた　皮膚は　とても　硬く
        丸くなると　どんな　攻撃でも　はね返す。
        夜中は　砂漠の　砂に　潜って　眠る。
      ko: |-
        바싹바싹 마른 피부는 매우 단단해서
        몸을 둥글게 말면 어떤 공격도 튕겨낸다.
        밤에는 사막의 모래에 들어가 잠잔다.
      en: |-
        Sandshrew has a very dry hide that is extremely tough.
        The Pokémon can roll into a ball that repels any attack.
        At night, it burrows into the desert sand to sleep.
      fr: |-
        Sabelette a une peau très sèche et extrêmement dure.
        Ce Pokémon peut s’enrouler sur lui-même pour repousser
        les attaques. La nuit, il s’enterre dans le sable du désert
        pour dormir.
      de: |-
        Sandan hat eine sehr trockene und extrem robuste Haut.
        Dieses Pokémon kann sich zu einem Ball zusammenrollen,
        von dem jegliche Angriffe abprallen. Nachts gräbt es sich
        im Wüstensand ein und schläft dort.
      es: |-
        Sandshrew tiene una piel muy seca y tremendamente dura.
        Tiene la habilidad de hacerse una bola y evitar cualquier
        ataque. Por las noches, escarba en la arena del desierto y
        se echa a dormir.
      it: |-
        Sandshrew ha una corazza estremamente secca e dura.
        Può chiudersi a sfera e rotolare per difendersi dagli attacchi.
        Quando cala la notte, si nasconde nella sabbia del deserto
        per dormire.
    sun:
      ja-Hrkt: |-
        からだを　まるめて　ボールのような
        すがたに　なれる。　ころがりながら
        さばくを　こうそくで　いどうする。
      ja: |-
        身体を　丸めて　ボールのような
        姿に　なれる。　転がりながら
        砂漠を　高速で　移動する。
      ko: |-
        몸을 웅크려서 공 같은
        모습이 된다. 구르면서
        사막을 고속으로 이동한다.
      zh-Hant: |-
        可以蜷縮身體變成球的樣子。
        骨碌碌滾動著，在沙漠裡高速移動。
      zh-Hans: |-
        可以蜷缩身体变成球的样子。
        骨碌碌滚动着在沙漠里高速移动。
      en: |-
        It can roll its body into a ball. It moves through
        the desert by rolling at high speeds.
      fr: |-
        Il peut se changer en boule parfaitement ronde
        et rouler à toute allure à travers le désert.
      de: |-
        Es kann sich blitzschnell durch die Wüste
        fortbewegen, indem es sich zu einem Ball
        zusammenrollt.
      es: |-
        Enrolla su cuerpo hasta hacerse una bola
        y rueda por el desierto a gran velocidad.
      it: |-
        Quando si raggomitola su se stesso sembra
        una palla. Si muove nel deserto rotolando a
        gran velocità.
    moon:
      ja-Hrkt: |-
        あめの　ふらない　かんそうちたいや
        さばくが　おもな　すみか。　あなを
        ほって　むしポケモンを　とらえる。
      ja: |-
        雨の　降らない　乾燥地帯や
        砂漠が　おもな　棲みか。　穴を
        掘って　むしポケモンを　捕らえる。
      ko: |-
        비가 내리지 않는 건조지대나
        사막이 주된 거처다. 구멍을
        파서 벌레포켓몬을 잡는다.
      zh-Hant: |-
        不下雨的乾燥地區和沙漠
        是牠的主要棲息地。
        會挖洞捕捉蟲寶可夢。
      zh-Hans: |-
        不下雨的干燥地区和沙漠
        是它的主要栖息地。
        会挖洞捕捉虫宝可梦。
      en: |-
        It usually makes its home in deserts and arid
        zones, where rain does not fall. It digs holes to
        catch Bug-type Pokémon.
      fr: |-
        Il vit principalement dans les zones désertiques
        où il ne pleut jamais. Il creuse dans le sol
        pour dénicher des Pokémon Insecte.
      de: |-
        Es lebt hauptsächlich in trockenen Regionen und
        Wüsten, wo wenig Regen fällt. Es gräbt Löcher,
        um Käfer-Pokémon zu fangen.
      es: |-
        Habita principalmente en zonas desérticas
        donde las lluvias son escasas. Excava agujeros
        en el suelo en busca de Pokémon insecto.
      it: |-
        Vive per lo più nei deserti e in zone aride.
        Scava buche nel terreno per catturare Pokémon
        di tipo Coleottero.
    ultra-sun:
      ja-Hrkt: |-
        あめの　すくない　とちに　すんでいる。
        きけんが　せまると　からだを　まるめ
        やわらかい　おなかを　まもるぞ。
      ja: |-
        雨の　少ない　土地に　棲んでいる。
        危険が　迫ると　身体を　丸め
        柔らかい　お腹を　守るぞ。
      ko: |-
        비가 적은 토지에 살고 있다.
        위험한 상황이 되면 몸을 웅크려
        부드러운 배를 지킨다.
      zh-Hant: |-
        棲息在雨量稀少的地區。
        遇到危險時會蜷縮起身體，
        藉此保護自己柔軟的腹部。
      zh-Hans: |-
        栖息在雨量稀少的土地上。
        遇到危险就会蜷缩起身体，
        并以此来保护自己柔弱的腹部。
      en: |-
        It lives in areas of limited rainfall. When danger
        approaches, it curls up into a ball to protect its
        soft stomach.
      fr: |-
        Il vit dans les régions où il pleut rarement.
        Quand il est en danger, il se roule en boule pour
        protéger son ventre, qui est son point faible.
      de: |-
        Es lebt in trockenen Gebieten mit wenig Regen.
        Bei Gefahr rollt es sich zu einem Ball zusammen
        und schützt so seine weiche Bauchgegend.
      es: |-
        Prefiere hábitats secos. Cuando intuye peligro,
        se enrolla hasta hacerse una bola para proteger
        las partes blandas de su cuerpo.
      it: |-
        Vive in zone con scarse precipitazioni.
        Quando è minacciato da un pericolo, si
        raggomitola per proteggere il ventre molle.
    ultra-moon:
      ja-Hrkt: |-
        しっけで　ひふが　ふやけてくると
        かざんに　むかう。　ちねつの　たかい
        じめんに　はりつき　かわかすのだ。
      ja: |-
        湿気で　皮膚が　ふやけてくると
        火山に　向かう。　地熱の　高い
        地面に　はりつき　乾かすのだ。
      ko: |-
        습기로 인해 피부가 불면
        화산으로 이동한다. 지열이 높은
        지면에 달라붙어 말리는 것이다.
      zh-Hant: |-
        當皮膚因為濕氣而發脹變軟時，
        會前往火山地區，趴在因地熱
        而帶著高溫的地面上烘乾。
      zh-Hans: |-
        如果皮肤因湿气而发胀，
        它就会前往火山。会趴在地热
        温度很高的地面上烘干皮肤。
      en: |-
        When its skin gets wrinkled from moisture, it
        heads for a volcano. It lies flat on a spot with a
        lot of geothermal heat and dries itself out.
      fr: |-
        Lorsque sa peau est saturée d’humidité,
        il se dirige vers un volcan et se sèche
        à la chaleur du magma.
      de: |-
        Bei zu viel Feuchtigkeit sucht es einen Vulkan
        auf, um auf dem warmen Erdboden seine
        aufgeweichte Haut wieder zu trocknen.
      es: |-
        Cuando la humedad le satura la piel, se dirige a
        un volcán y aprovecha las altas temperaturas
        del suelo para secarse.
      it: |-
        Quando la sua pelle assorbe troppa umidità,
        raggiunge un vulcano e si stende sul terreno
        caldo per asciugarsi.
    lets-go-pikachu:
      ja-Hrkt: |-
        からだは　かわいている。しかし
        よなか　きおんが　さがったときは
        ひふに　しずくが　つくという。
      ja: |-
        体は　乾いている。しかし
        夜中　気温が　下がったときは
        皮膚に　滴が　つくという。
      ko: |-
        몸이 건조하다. 하지만
        밤중에 기온이 내려가면
        피부에 물방울이 맺힌다고 한다.
      zh-Hant: |-
        牠的身體十分乾燥，
        但當夜裡溫度降低時，
        表皮上會有露水凝結。
      zh-Hans: |-
        身体很干燥。但据说
        在夜里降温时，它的
        表皮上会有露水凝结。
      en: |-
        Its body is dry. When it gets cold at night, its
        hide is said to become coated with a fine dew.
      fr: |-
        Son corps est sec. Quand la nuit déploie ses
        ailes de fraîcheur, son épiderme se couvre
        de rosée.
      de: |-
        Der Körper dieses Pokémon ist sehr trocken.
        In kalten Nächten wird sein Körper von Tau
        überzogen.
      es: |-
        Tiene la piel muy seca, aunque, si hace frío por
        la noche, aparece cubierta de un fino rocío.
      it: |-
        Il suo corpo è molto asciutto, ma si dice che
        quando di notte la temperatura si abbassa
        si ricopra di fine rugiada.
    lets-go-eevee:
      ja-Hrkt: |-
        からだは　かわいている。しかし
        よなか　きおんが　さがったときは
        ひふに　しずくが　つくという。
      ja: |-
        体は　乾いている。しかし
        夜中　気温が　下がったときは
        皮膚に　滴が　つくという。
      ko: |-
        몸이 건조하다. 하지만
        밤중에 기온이 내려가면
        피부에 물방울이 맺힌다고 한다.
      zh-Hant: |-
        牠的身體十分乾燥，
        但當夜裡溫度降低時，
        表皮上會有露水凝結。
      zh-Hans: |-
        身体很干燥。但据说
        在夜里降温时，它的
        表皮上会有露水凝结。
      en: |-
        Its body is dry. When it gets cold at night, its
        hide is said to become coated with a fine dew.
      fr: |-
        Son corps est sec. Quand la nuit déploie ses
        ailes de fraîcheur, son épiderme se couvre
        de rosée.
      de: |-
        Der Körper dieses Pokémon ist sehr trocken.
        In kalten Nächten wird sein Körper von Tau
        überzogen.
      es: |-
        Tiene la piel muy seca, aunque, si hace frío por
        la noche, aparece cubierta de un fino rocío.
      it: |-
        Il suo corpo è molto asciutto, ma si dice che
        quando di notte la temperatura si abbassa
        si ricopra di fine rugiada.
    sword:
      ja-Hrkt: |-
        かんそうした　すなちで　すなあびを
        するのが　すき。　からだに　ついた
        よごれと　みずけを　おとすのだ。
      ja: |-
        乾燥した　砂地で　砂浴びを
        するのが　好き。　体に　ついた
        汚れと　水気を　落とすのだ。
      ko: |-
        건조한 모래땅에서 모래를 끼얹는 것을
        좋아한다. 몸에 붙은 지저분한 것들을
        떨어뜨리고 물기를 없애는 것이다.
      zh-Hant: |-
        喜歡在乾燥的沙地上
        滾來滾去，藉此去掉
        身體上的髒污和水分。
      zh-Hans: |-
        喜欢在干燥的沙地上
        滚来滚去，借此去掉
        身上的脏东西和水分。
      en: |-
        It loves to bathe in the grit of dry, sandy areas.
        By sand bathing, the Pokémon rids itself of dirt
        and moisture clinging to its body.
      fr: |-
        Il aime se rouler dans le sable des zones
        désertiques pour se débarrasser des traces
        de terre et d’humidité qui lui collent à la peau.
      de: |-
        Es badet sehr gern im trockenen Sand. Dadurch
        befreit es seinen Körper von Schmutz und
        Feuchtigkeit.
      es: |-
        Le gusta revolcarse por la arena seca para
        eliminar todo rastro de suciedad y humedad
        en la piel.
      it: |-
        Ama rotolarsi nella sabbia delle zone desertiche,
        per rimuovere ogni traccia di sporcizia e umidità
        dal suo corpo.
    shield:
      ja-Hrkt: |-
        じめんを　ほって　すあなを　つくる。
        ちちゅうの　かたい　いわも　するどい
        ツメで　くだいて　ほりすすむぞ。
      ja: |-
        地面を　掘って　巣穴を　つくる。
        地中の　硬い　岩も　鋭い　ツメで
        砕いて　掘り進むぞ。
      ko: |-
        땅을 파서 굴을 만든다.
        땅속의 단단한 바위도 날카로운
        발톱으로 부수며 파고들어 간다.
      zh-Hant: |-
        會在地面挖洞築巢。
        即使遇到地下堅硬的岩石，
        也會用銳利的爪子擊碎並向前挖進。
      zh-Hans: |-
        会在地上挖洞建造巢穴。
        挖洞时，即便遇到地里的坚硬岩石，
        也能用尖锐的爪子弄碎后继续挖进。
      en: |-
        It burrows into the ground to create its nest. If
        hard stones impede its tunneling, it uses its sharp
        claws to shatter them and then carries on digging.
      fr: |-
        Il creuse le sol pour construire sa tanière.
        Rien n’arrête ses griffes acérées, pas même
        la roche la plus solide.
      de: |-
        Es gräbt sich seinen Bau im Erdboden. Stößt es
        dabei auf harte Steine, zerstört es diese mit
