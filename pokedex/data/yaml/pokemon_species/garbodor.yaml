garbodor:
  base_happiness: 50
  capture_rate: 60
  color: green
  egg_groups:
    - mineral
  evolution_chain: trubbish
  evolves_from: trubbish
  flavor_text:
    black:
      en: |-
        It clenches opponents with its left arm
        and finishes them off with foul-smelling
        poison gas belched from its mouth.
      fr: |-
        Il étrangle ses ennemis avec son bras
        droit et les achève avec le gaz puant et
        empoisonné qu’il exhale par la bouche.
    white:
      en: |-
        They absorb garbage and make it part
        of their bodies. They shoot a poisonous
        liquid from their right-hand fingertips.
      fr: |-
        Il aspire les déchets et les intègre à
        son corps. Les doigts de sa main droite
        exsudent un fluide empoisonné.
    black-2:
      en: |-
        Consuming garbage makes
        new kinds of poison gases
        and liquids inside their bodies.
    white-2:
      en: |-
        Consuming garbage makes
        new kinds of poison gases
        and liquids inside their bodies.
    x:
      ja-Hrkt: |-
        ひだりうでで　あいてを　しめつけて
        くちから　はきだす　あくしゅうの
        どくガスで　とどめを　さすのだ。
      ja: |-
        左腕で　相手を　絞めつけて
        口から　吐き出す　悪臭の　毒ガスで
        とどめを　刺すのだ。
      ko: |-
        왼팔로 상대를 꼭 붙들고
        입에서 악취가 나는 독가스를
        토해내서 마무리한다.
      en: |-
        It clenches opponents with its left arm and finishes
        them off with foul-smelling poison gas belched from
        its mouth.
      fr: |-
        Il étrangle ses ennemis avec son bras gauche et les
        achève avec le gaz puant et empoisonné qu’il exhale
        par la bouche.
      de: |-
        Es nimmt mit dem rechten Arm Gegner in
        die Mangel und gibt ihnen mit dem giftigen Gas
        aus seinem Maul den Rest.
      es: |-
        Apresa a su rival con el brazo izquierdo y le da el
        golpe de gracia exhalando por la boca un apestoso
        gas venenoso.
      it: |-
        Serra l’avversario con l’arto sinistro e gli dà il colpo
        di grazia esalando dalla bocca un fetido gas velenoso.
    'y':
      ja-Hrkt: |-
        ゴミを　すいとっては　たいないで
        あたらしい　しゅるいの　どくガスや
        どくの　えきたいを　うみだしている。
      ja: |-
        ゴミを　吸いとっては　体内で
        新しい　種類の　毒ガスや
        毒の　液体を　生みだしている。
      ko: |-
        쓰레기를 흡수해서 체내에서
        새로운 종류의 독가스나
        독의 액체를 만들어낸다.
      en: |-
        Consuming garbage makes new kinds of poison
        gases and liquids inside their bodies.
      fr: |-
        Il aspire les déchets et les intègre à son corps pour
        produire des gaz et des fluides toxiques.
      de: |-
        Jedes Mal, wenn es frischen Müll in sich aufsaugt,
        erzeugt es völlig neue Formen von Giftgasen und
        Toxinen.
      es: |-
        Absorbe y procesa en su interior basura para generar
        nuevos gases nocivos y líquidos venenosos de alta
        virulencia.
      it: |-
        Assorbe la spazzatura nel suo corpo per creare dei
        liquidi velenosi e dei gas tossici sempre nuovi.
    omega-ruby:
      ja-Hrkt: |-
        ひだりうでで　あいてを　しめつけて
        くちから　はきだす　あくしゅうの
        どくガスで　とどめを　さすのだ。
      ja: |-
        左腕で　相手を　絞めつけて
        口から　吐き出す　悪臭の　毒ガスで
        とどめを　刺すのだ。
      ko: |-
        왼팔로 상대를 꼭 붙들고
        입에서 악취가 나는 독가스를
        토해내서 마무리한다.
      en: |-
        It clenches opponents with its left arm and finishes
        them off with foul-smelling poison gas belched from
        its mouth.
      fr: |-
        Il étrangle ses ennemis avec son bras gauche et les achève
        avec le gaz puant et empoisonné qu’il exhale par la bouche.
      de: |-
        Es nimmt mit dem rechten Arm Gegner in die Mangel und
        gibt ihnen mit dem giftigen Gas aus seinem Maul den Rest.
      es: |-
        Apresa a su rival con el brazo izquierdo y le da el golpe de
        gracia exhalando por la boca un apestoso gas venenoso.
      it: |-
        Serra l’avversario con l’arto sinistro e gli dà il colpo di grazia
        esalando dalla bocca un fetido gas velenoso.
    alpha-sapphire:
      ja-Hrkt: |-
        ゴミを　すいとっては　たいないで
        あたらしい　しゅるいの　どくガスや
        どくの　えきたいを　うみだしている。
      ja: |-
        ゴミを　吸いとっては　体内で
        新しい　種類の　毒ガスや
        毒の　液体を　生みだしている。
      ko: |-
        쓰레기를 흡수해서 체내에서
        새로운 종류의 독가스나
        독의 액체를 만들어낸다.
      en: |-
        Consuming garbage makes new kinds of poison
        gases and liquids inside their bodies.
      fr: |-
        Il aspire les déchets et les intègre à son corps pour produire
        des gaz et des fluides toxiques.
      de: |-
        Jedes Mal, wenn es frischen Müll in sich aufsaugt, erzeugt es
        völlig neue Formen von Giftgasen und Toxinen.
      es: |-
        Absorbe y procesa en su interior basura para generar nuevos
        gases nocivos y líquidos venenosos de alta virulencia.
      it: |-
        Assorbe la spazzatura nel suo corpo per creare dei liquidi
        velenosi e dei gas tossici sempre nuovi.
    sun:
      ja-Hrkt: |-
        みぎうでから　とびだす　どくえきに
        ちゅうい。　ちょっと　かかるだけで
        みちの　どくそに　おかされる。
      ja: |-
        右腕から　飛びだす　毒液に
        注意。　ちょっと　かかるだけで
        未知の　毒素に　冒される。
      ko: |-
        오른쪽 팔에서 날리는 독액에
        주의. 살짝 닿기만 해도
        미지의 독소가 침범한다.
      zh-Hant: |-
        要注意從右臂噴出的毒液。
        只要沾到一點點，
        就會被未知的毒素侵襲。
      zh-Hans: |-
        要注意从右臂喷出的毒液。
        只要沾到一点点，
        就会被未知的毒素侵袭。
      en: |-
        Beware the poisonous liquid it shoots from its
        right arm. If even a little of it gets on you, you’ll
        experience the effects of the unidentified toxin.
      fr: |-
        Méfiez-vous du poison qu’il projette de son
        bras droit, sans quoi ses toxines non identifiées
        vous feront passer un sale quart d’heure.
      de: |-
        Vorsicht vor dem Gift, das es aus seinem
        rechten Arm sprüht! Kleinste Mengen genügen,
        um einen unbekannten Giftstoff zu übertragen.
      es: |-
        El veneno líquido que brota de su brazo derecho
        es muy nocivo. La mera exposición puede llevar
        a inhalar accidentalmente toxinas desconocidas.
      it: |-
        Dall’arto destro spruzza un veleno altamente
        nocivo. Basta toccarlo per essere contaminati
        da tossine sconosciute.
    moon:
      ja-Hrkt: |-
        あるじき　アローラで　ばくはつてきに
        ふえたが　ベトベターが　きてからは
        そのかずは　ガクンと　へった。
      ja: |-
        ある時期　アローラで　爆発的に
        増えたが　ベトベターが　来てからは
        その数は　ガクンと　減った。
      ko: |-
        한때 알로라에서 폭발적으로
        늘었지만 질퍽이가 오고 난 뒤로
        개체 수가 크게 줄었다.
      zh-Hant: |-
        在阿羅拉的數量從某個時期開始
        爆炸性增加，但是自從臭泥來了之後，
        數量一下子便減少了。
      zh-Hans: |-
        某个时期在阿罗拉呈爆发式增长，
        但是臭泥来了之后，
        数量一下子减少了。
      en: |-
        For a time, their numbers increased explosively
        in Alola. Since the arrival of Grimer, their
        population has decreased dramatically.
      fr: |-
        Il fut un temps où les Miasmax étaient LE fléau
        d’Alola. Heureusement, leur population a vite
        diminué après l’arrivée des Tadmorv.
      de: |-
        Einst haben sie sich explosionsartig in Alola
        ausgebreitet. Mit der Ankunft von Sleima hat
        ihr Bestand jedoch sehr rasch abgenommen.
      es: |-
        Hubo un tiempo en el que la población de
        Garbodor en Alola era espectacular, pero su
        número se desplomó cuando llegaron los Grimer.
      it: |-
        Un tempo questi Pokémon erano molto diffusi
        ad Alola, ma il loro numero è notevolmente
        diminuito con l’arrivo dei Grimer.
    ultra-sun:
      ja-Hrkt: |-
        ひだりうでで　てきを　ロックすると
        どくの　えきたいを　からだじゅうに
        あびせかけ　みうごきを　ふうじる。
      ja: |-
        左腕で　敵を　ロックすると
        毒の　液体を　体中に
        浴びせかけ　身動きを　封じる。
      ko: |-
        왼쪽 팔로 적을 꼭 붙들고
        독액을 온몸에
        퍼부어 움직임을 막는다.
      zh-Hant: |-
        用左臂鎖住敵人後，
        會將毒液灑向敵人全身，
        使對方無法動彈。
      zh-Hans: |-
        用左臂锁住敌人后，
        会将有毒的液体泼向对方全身，
        封住其行动。
      en: |-
        It locks opponents in place with its left hand,
        immobilizing them by entirely dousing their
        bodies with poisonous liquid.
      fr: |-
        Il maîtrise son adversaire de son bras gauche,
        puis l’arrose d’un liquide toxique paralysant.
      de: |-
        Mit dem linken Arm nagelt es seinen Gegner fest,
        um ihn dann mit einer toxischen Flüssigkeit zu
        besprühen und ihn so zu lähmen.
      es: |-
        Atrapa a su presa con el brazo izquierdo y luego
        rocía su cuerpo con un líquido venenoso para
        inmovilizarla.
      it: |-
        Blocca il nemico con l’arto sinistro e
        ne cosparge il corpo con un liquido
        velenoso per immobilizzarlo.
    ultra-moon:
      ja-Hrkt: |-
        アローラの　ダストダスが　すこし
        たくましいのは　ベトベトンという
        てんてきが　いるせいだと　いわれる。
      ja: |-
        アローラの　ダストダスが　少し
        たくましいのは　ベトベトンという
        天敵が　いるせいだと　いわれる。
      ko: |-
        알로라의 더스트나가 좀 더
        강인한 것은 질뻐기라는
        천적이 있기 때문이라고 전해진다.
      zh-Hant: |-
        阿羅拉的灰塵山之所以
        比較強壯一點，據說是因為
        有臭臭泥這個天敵在的緣故。
      zh-Hans: |-
        阿罗拉的灰尘山有点儿魁梧，
        据说是因为有臭臭泥这个天敌的缘故。
      en: |-
        Some say the reason Garbodor in Alola are a
        little stronger than their counterparts elsewhere
        is the presence of Muk, their natural enemy.
      fr: |-
        Ce serait pour pouvoir faire face à Grotadmorv,
        son ennemi juré, que le Miasmax d’Alola est
        légèrement plus robuste que les autres.
      de: |-
        Man vermutet, dass die Deponitox in Alola
        wegen ihres Fressfeindes Sleimok kräftiger
        wurden als Artgenossen in anderen Regionen.
      es: |-
        La razón de la mayor fortaleza de los Garbodor
        que viven en la región de Alola se atribuye a la
        presencia de Muk, su enemigo natural.
      it: |-
        I Garbodor che vivono ad Alola sono più robusti
        del normale per difendersi dai Muk, i loro nemici
        naturali.
    sword:
      ja-Hrkt: |-
        くった　ゴミが　たいないで　どくに
        へんかする。　くう　ゴミ　しだいで
        どくの　しゅせいぶんも　かわる。
      ja: |-
        食った　ゴミが　体内で　毒に
        変化する。　食う　ゴミ　しだいで
        毒の　主成分も　変わる。
      ko: |-
        먹은 쓰레기가 체내에서 독으로
        변화한다. 먹은 쓰레기에 따라
        독의 주성분도 바뀐다.
      zh-Hant: |-
        吃掉的垃圾會在體內
        轉化為毒素。毒素的成分
        會隨著吃掉的垃圾而不同。
      zh-Hans: |-
        吃掉的垃圾会在体内
        转化为毒素。毒素的成分
        会随着吃掉的垃圾而不同。
      en: |-
        This Pokémon eats trash, which turns into poison
        inside its body. The main component of the
        poison depends on what sort of trash was eaten.
      fr: |-
        Il produit du poison dans son corps à partir
        des ordures qu’il ingurgite. Selon ce qu’il mange,
        la composition des toxines diffère.
      de: |-
        Es frisst Müll und verdaut ihn in seinem Inneren
        zu Gift. Je nach Art des Mülls, den es verzehrt,
        ändern sich die Hauptbestandteile des Giftes.
      es: |-
        Su cuerpo transforma la inmundicia que engulle
        en un veneno cuya composición cambia según la
        basura ingerida.
      it: |-
        Mangia spazzatura e la trasforma in un veleno
        la cui composizione cambia a seconda di cosa
        ha ingurgitato.
    shield:
      ja-Hrkt: |-
        みぎうでから　だす　どくえきは
        よわった　せいぶつが　あびれば
        そくしするほど　きけんな　シロモノ。
      ja: |-
        右腕から　出す　毒液は
        弱った　生物が　浴びれば
        即死するほど　危険な　シロモノ。
      ko: |-
        오른팔에서 내보내는 독액은
        약한 생물이 맞으면
        즉사할 정도로 위험하다.
      zh-Hant: |-
        從右臂噴出的毒液十分危險，
        虛弱的生物只要一沾到，
        立刻就會丟掉性命。
      zh-Hans: |-
        从右臂喷出的毒液十分危险，
        虚弱的生物只要一沾到，
        立刻就会丢掉性命。
      en: |-
        The toxic liquid it launches from its right arm
        is so virulent that it can kill a weakened
        creature instantly.
      fr: |-
        Le liquide qu’il projette de son bras droit
        est si toxique que si une créature fragile
        en est aspergée, elle succombe sur-le-champ.
      de: |-
        Die toxische Flüssigkeit aus seinem rechten Arm
        ist sehr gefährlich. Angeschlagene Lebewesen
        kommen bei Kontakt sofort ums Leben.
      es: |-
        El veneno líquido que brota de su brazo derecho
        es tan nocivo que puede acabar con una criatura
        ya débil al menor contacto.
      it: |-
        Il veleno che spruzza dall’arto destro è talmente
        tossico da risultare istantaneamente letale
        per le creature già debilitate.
