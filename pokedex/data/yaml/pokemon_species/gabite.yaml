    white-2:
      en: |-
        It loves sparkly things. It seeks
        treasures in caves and hoards the
        loot in its nest.
    x:
      ja-Hrkt: |-
        ひかりかがやく　ものが　だいすきで
        どうくつの　なかで　みつけた
        たからを　じぶんのすに　ためこむ。
      ja: |-
        光り輝く　ものが　大好きで
        洞窟の　中で　見つけた
        宝を　自分の巣に　ためこむ。
      ko: |-
        반짝반짝 빛나는 것을
        아주 좋아하기에 동굴 안에서 발견한
        보물을 자신의 둥지에 모아둔다.
      en: |-
        It loves sparkly things. It seeks treasures in caves
        and hoards the loot in its nest.
      fr: |-
        Toujours à la recherche d’objets brillants, il arpente
        les grottes pour constituer son butin.
      de: |-
        Es liebt funkelnde Dinge und sucht nach Schätzen
        in Höhlen, die es dann in seinem Nest hortet.
      es: |-
        Le gustan las cosas brillantes. Busca tesoros en
        cuevas y se lleva el botín a su nido.
      it: |-
        Adora gli oggetti luccicanti. Va a caccia di tesori
        nelle grotte e li trasporta nel suo nido.
    'y':
      ja-Hrkt: |-
        すあなを　ひろげるとき　ちちゅうから
        でてきた　ほうせきの　げんせきを
        すに　ためる　しゅうせいを　もつ。
      ja: |-
        巣穴を　広げるとき　地中から
        出てきた　宝石の　原石を
        巣に　ためる　習性を　持つ。
      ko: |-
        거처를 늘릴 때 땅속에서
        나온 보석의 원석을
        거처에 모아두는 습성을 가졌다.
      en: |-
        As it digs to expand its nest, it habitually digs up
        gems that it then hoards in its nest.
      fr: |-
        Carmache accumule les pierres précieuses qu’il
        déterre quand il entreprend d’agrandir son nid.
      de: |-
        Die Rohedelsteine, die beim Erweitern seiner Höhle
        zum Vorschein kommen, hortet es in seinem Nest.
      es: |-
        Tiende a acumular las gemas en bruto que encuentra
        cuando agranda su guarida.
      it: |-
        Ha l’abitudine di collezionare gemme che trova
        mentre si scava la tana, appositamente ampliata.
    omega-ruby:
      ja-Hrkt: |-
        ひかりかがやく　ものが　だいすきで
        どうくつの　なかで　みつけた
        たからを　じぶんのすに　ためこむ。
      ja: |-
        光り輝く　ものが　大好きで
        洞窟の　中で　見つけた
        宝を　自分の巣に　ためこむ。
      ko: |-
        반짝반짝 빛나는 것을
        아주 좋아하기에 동굴 안에서 발견한
        보물을 자신의 둥지에 모아둔다.
      en: |-
        It loves sparkly things. It seeks treasures in caves
        and hoards the loot in its nest.
      fr: |-
        Toujours à la recherche d’objets brillants, il arpente
        les grottes pour constituer son butin.
      de: |-
        Es liebt funkelnde Dinge und sucht nach Schätzen in Höhlen,
        die es dann in seinem Nest hortet.
      es: |-
        Le gustan las cosas brillantes. Busca tesoros en cuevas y se
        lleva el botín a su nido.
      it: |-
        Adora gli oggetti luccicanti. Va a caccia di tesori nelle grotte
        e li trasporta nel suo nido.
    alpha-sapphire:
      ja-Hrkt: |-
        すあなを　ひろげるとき　ちちゅうから
        でてきた　ほうせきの　げんせきを
        すに　ためる　しゅうせいを　もつ。
      ja: |-
        巣穴を　広げるとき　地中から
        出てきた　宝石の　原石を
        巣に　ためる　習性を　持つ。
      ko: |-
        거처를 늘릴 때 땅속에서
        나온 보석의 원석을
        거처에 모아두는 습성을 가졌다.
      en: |-
        As it digs to expand its nest, it habitually digs up
        gems that it then hoards in its nest.
      fr: |-
        Carmache accumule les pierres précieuses qu’il déterre quand
        il entreprend d’agrandir son nid.
      de: |-
        Die Rohedelsteine, die beim Erweitern seiner Höhle
        zum Vorschein kommen, hortet es in seinem Nest.
      es: |-
        Tiende a acumular las gemas en bruto que encuentra cuando
        agranda su guarida.
      it: |-
        Ha l’abitudine di collezionare gemme che trova mentre si scava
        la tana, appositamente ampliata.
    sun:
      ja-Hrkt: |-
        まれに　だっぴし　ウロコが　はげる。
        そのせいぶんが　ふくまれる　くすりは
        つかれた　からだを　ギンギンにする。
      ja: |-
        稀に　脱皮し　ウロコが　剥げる。
        その成分が　含まれる　薬は
        疲れた　体を　ギンギンにする。
      ko: |-
        드물게 탈피해서 비늘이 벗겨진다.
        그 성분이 들어 있는 약은
        피곤한 몸을 회복시켜 준다.
      zh-Hant: |-
        偶爾脫皮，鱗片會脫落。
        含有其成分的藥可以
        讓疲勞的身體活力四射。
      zh-Hans: |-
        偶尔蜕皮，鳞片会脱落。
        其成分中所含的药物成分
        可以让疲劳的身体活力四射。
      en: |-
        In rare cases, it molts and sheds its scales.
        Medicine containing its scales as an ingredient
        will make a weary body feel invigorated.
      fr: |-
        Il perd parfois ses écailles quand il mue.
        Les remèdes à base d’écailles de Carmache
        sont de puissants toniques.
      de: |-
        Ab und zu häutet es sich und verliert Schuppen.
        Medizin, die solche Schuppen enthält, macht
        müde Körper munter.
      es: |-
        Muy ocasionalmente puede mudar la piel y
        perder las escamas. Las medicinas que las usan
        como ingrediente son muy reconstituyentes.
      it: |-
        Con le scaglie che a volte perde durante la muta
        si possono preparare tonici che alleviano
        la stanchezza e ripristinano le energie.
    moon:
      ja-Hrkt: |-
        ひかり　かがやくものが　だいすき。
        ほうせきや　つかまえた　メレシーを
        すあなで　じーっと　ながめている。
      ja: |-
        光り　輝くものが　大好き。
        宝石や　捕まえた　メレシーを
        巣穴で　じーっと　眺めている。
      ko: |-
        반짝반짝 빛나는 것을 아주 좋아한다.
        보석이나 잡은 멜리시를
        둥지에서 가만히 바라보고 있다.
      zh-Hant: |-
        最喜歡閃閃發光的東西。
        會一直呆在巢穴裡
        盯著寶石和捕捉到的小碎鑽。
      zh-Hans: |-
        最喜欢闪闪发光的东西。
        一直呆在巢穴里，
        盯着宝石和捕捉到的小碎钻。
      en: |-
        Shiny objects are its passion. It can be found in
        its cave, scarcely moving, its gaze fixed on the
        jewels it’s amassed or Carbink it has caught.
      fr: |-
        Il adore tout ce qui brille. Au fond de sa tanière,
        il contemple les joyaux qu’il a dérobés et les
        Strassie qu’il a kidnappés.
      de: |-
        Es liebt funkelnde Dinge. Edelsteine und
        gefangene Rocara nimmt es mit in sein Nest,
        um sich an ihrem Anblick zu weiden.
      es: |-
        Le gustan las cosas brillantes. Pasa largas
        horas en su cueva, admirando las gemas y los
        Carbink que ha capturado.
      it: |-
        Adora gli oggetti luccicanti. Passa molto tempo
        nella sua tana a rimirare la sua scorta di gemme
        e Carbink.
    ultra-sun:
      ja-Hrkt: |-
        ひかるものが　だいすき。　メレシーを
        ねらう　ヤミラミを　みつけると
        はげしく　いかって　おそいかかる。
      ja: |-
        光るものが　大好き。　メレシーを
        狙う　ヤミラミを　見つけると
        激しく　怒って　襲いかかる。
      ko: |-
        반짝이는 것을 매우 좋아한다.
        멜리시를 노리는 깜까미를 발견하면
        격렬하게 화를 내며 덤벼든다.
      zh-Hant: |-
        最喜歡會發亮的東西。
        只要發現在打小碎鑽主意的勾魂眼，
        就會非常生氣地發動攻擊。
      zh-Hans: |-
        非常喜欢发光的东西。
        如果发现正在攻击小碎钻的勾魂眼，
        就会非常生气地发动袭击。
      en: |-
        It loves shiny things. When it finds a Sableye
        trying to catch a Carbink, Gabite becomes
        furiously angry and attacks the Sableye.
      fr: |-
        Il adore tout ce qui brille, et rien ne l’énerve plus
        qu’un Ténéfix s’en prenant à un Strassie. S’il est
        témoin d’une telle agression, il passe à l’attaque.
      de: |-
        Es liebt funkelnde Dinge. Sieht es ein Zobiris,
        das ein Rocara jagt, stürzt es sich wütend auf
        den Verfolger.
      es: |-
        Se vuelve loco por las cosas brillantes y no duda
        en atacar con violencia a los Sableye que
        acechan a los Carbink.
      it: |-
        Adora gli oggetti luccicanti. Se sorprende un
        Sableye a caccia di Carbink, si infuria e lo
        attacca.
    ultra-moon:
      ja-Hrkt: |-
        だっぴして　おおきくなって　いく。
        ウロコを　すって　こなにした　ものは
        かんぽうやくの　げんりょうに　なる。
      ja: |-
        脱皮して　大きくなって　いく。
        ウロコを　擦って　粉にした　ものは
        漢方薬の　原料に　なる。
      ko: |-
        탈피하면서 커진다.
        비늘을 비벼서 가루로 만든 것은
        한방약의 원료가 된다.
      zh-Hant: |-
        會反覆脫皮並長大。
        將牠的鱗片磨成粉之後，
        可以當成中藥的原料。
      zh-Hans: |-
        会反复蜕皮变大。
        将鳞片磨成粉，
        可以作为中药的原料。
      en: |-
        It sheds its skin and gradually grows larger. Its
        scales can be ground into a powder and used
        as raw materials for traditional medicine.
      fr: |-
        Il mue régulièrement au cours de sa croissance.
        Les écailles ainsi tombées peuvent être pilées
        pour préparer des remèdes traditionnels.
      de: |-
        Wenn es wächst, streift es seine Schuppen ab.
        Diese lassen sich zu einem Pulver zerkleinern,
        das als Basis für natürliche Heilmittel dient.
      es: |-
        Muda la piel a medida que crece. Las escamas
        que pierde se pueden pulverizar para utilizar
        como ingrediente en remedios medicinales.
      it: |-
        Quando il suo corpo si ingrandisce, fa la muta.
        Con la polvere ricavata frantumando le scaglie
        scartate si preparano dei rimedi naturali.
    sword:
      ja-Hrkt: |-
        あたまの　さゆうの　とっきから
        ちょうおんぱを　だして　まっくらな
        ほらあなの　ようすを　しらべるのだ。
      ja: |-
        頭の　左右の　突起から
        超音波を　出して　真っ暗な
        洞穴の　様子を　調べるのだ。
      ko: |-
        머리의 좌우 돌기에서
        초음파를 내보내 캄캄한
        동굴의 상황을 살핀다.
      zh-Hant: |-
        會從頭部左右兩側的突起處
        發出超音波，藉此調查漆黑
        洞窟裡的狀況。
      zh-Hans: |-
        会从头部左右两边的
        突起物发出超音波，
        观察漆黑洞窟中的状况。
      en: |-
        This Pokémon emits ultrasonic waves from a
        protrusion on either side of its head to probe
        pitch-dark caves.
      fr: |-
        Il émet des ultrasons avec les deux appendices
        sur sa tête pour sonder les grottes obscures.
      de: |-
        Aus den Fortsätzen an beiden Seiten seines
        Kopfes stößt es Ultraschallwellen aus, um sich
        in stockfinsteren Höhlen zurechtzufinden.
      es: |-
        Explora las más oscuras cuevas utilizando ondas
        ultrasónicas que emite desde las protuberancias
        a ambos lados de la cabeza.
      it: |-
        Emette ultrasuoni dalle protuberanze sulla testa
        per esaminare le grotte anche nel buio più fitto.
    shield:
      ja-Hrkt: |-
        すみかの　どうくつには　ほうせきを
        まいぞうするが　はいりこんだとたんに
        ツメと　キバで　ズタズタにされる。
      ja: |-
        すみかの　洞窟には　宝石を
        埋蔵するが　入りこんだとたんに
        ツメと　キバで　ズタズタにされる。
      ko: |-
        거처인 동굴에 보석을 매장하는데
        그곳에 침입자가 들어가면 즉시
        발톱과 이빨로 갈기갈기 찢어버린다.
      zh-Hant: |-
        會把寶石埋藏在自己棲息的
        洞窟裡。但只要入侵牠的洞窟，
        就會立刻被牠的爪子和牙齒撕碎。
      zh-Hans: |-
        会把宝石埋藏在栖息的洞窟内。
        入侵者闯入洞窟后，会立刻
        被它用爪子和牙齿撕碎。
      en: |-
        Jewels are buried in the caves these Pokémon
        nest in, but you’ll be torn apart by claws and
        fangs the moment you enter one of these caves.
      fr: |-
        Il cache des pierres précieuses dans le sol
        de sa grotte, et accueille à coups de griffes
        et de crocs quiconque ose y pénétrer.
      de: |-
        In der Höhle, die Knarksel als Nest dient,
        vergräbt es Edelsteine. Wer sie betritt, wird
        sofort von seinen Krallen und Zähnen zerfetzt.
      es: |-
        Entierra gemas en la cueva que le sirve de nido y
        hace trizas con sus garras y colmillos a cualquier
        intruso.
      it: |-
        Accumula pietre preziose nella grotta in cui vive.
        Fa a pezzi con gli artigli e le zanne chiunque
        vi si intrufoli.
    legends-arceus:
      en: |-
        Though Gabite are usually of a violent disposition, when I gave
        one a glass bead it had been eyeing covetously, it suddenly
        became quite docile.
