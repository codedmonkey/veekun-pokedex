lumineon:
  base_happiness: 70
  capture_rate: 75
  color: blue
  egg_groups:
    - water2
  evolution_chain: finneon
  evolves_from: finneon
  flavor_text:
    diamond:
      en: |-
        It lives on the deep-sea floor.
        It attracts prey by flashing the
        patterns on its four tail fins.
    pearl:
      en: |-
        To avoid detection by predators,
        it crawls along the seafloor using
        the two fins on its chest.
    platinum:
      en: |-
        It crawls along the seafloor using
        its long front fins like legs. It
        competes for food with LANTURN.
    heartgold:
      en: |-
        LUMINEON swimming in the darkness
        of the deep sea look like stars shining
        in the night sky.
    soulsilver:
      en: |-
        LUMINEON swimming in the darkness
        of the deep sea look like stars shining
        in the night sky.
    black:
      en: |-
        It crawls along the seafloor using
        its long front fins like legs. It
        competes for food with Lanturn.
      fr: |-
        Il rampe au fond de l’océan grâce
        aux nageoires de son torse.
        Le Lanturn est son rival.
    white:
      en: |-
        It crawls along the seafloor using
        its long front fins like legs. It
        competes for food with Lanturn.
      fr: |-
        Il rampe au fond de l’océan grâce
        aux nageoires de son torse.
        Le Lanturn est son rival.
    black-2:
      en: |-
        It crawls along the seafloor using
        its long front fins like legs. It
        competes for food with Lanturn.
    white-2:
      en: |-
        It crawls along the seafloor using
        its long front fins like legs. It
        competes for food with Lanturn.
    x:
      ja-Hrkt: |-
        ふかい　うみの　そこで　くらす。
        ４まいの　ひれの　もようを　ひからせ
        えものを　おびきよせる。
      ja: |-
        深い　海の　底で　暮らす。
        ４枚の　ヒレの　模様を　光らせて
        獲物を　おびき寄せる。
      ko: |-
        깊은 바다의 밑바닥에서 산다.
        4개의 지느러미 무늬를 반짝거려
        먹이를 끌어들인다.
      en: |-
        It lives on the deep-sea floor. It attracts prey by
        flashing the patterns on its four tail fins.
      fr: |-
        Il vit au plus profond de l’océan. Il attire sa proie en
        illuminant les motifs de ses quatre nageoires.
      de: |-
        Es lebt tief auf dem Meeresboden. Das blinkende
        Muster auf seinen vier Rückenflossen zieht Beute an.
      es: |-
        Vive en las profundidades marinas. Atrae a sus presas
        con parpadeos del dibujo de sus cuatro aletas.
      it: |-
        Vive negli abissi marini. Attira le prede illuminando
        i motivi delle sue quattro pinne.
    'y':
      ja-Hrkt: |-
        てんてきに　みつからないように
        むねの　２まいの　ひれを　つかい
        かいていを　はって　いどうする。
      ja: |-
        天敵に　見つからないように
        胸の　２枚の　ヒレを　使い
        海底を　這って　移動する。
      ko: |-
        천적에게 발견되지 않도록
        가슴에 있는 2개의 지느러미로
        해저에 붙어서 이동한다.
      en: |-
        To avoid detection by predators, it crawls along the
        seafloor using the two fins on its chest.
      fr: |-
        Pour éviter de se faire voir par ses ennemis, il rampe
        au fond de l’eau grâce aux nageoires sur son torse.
      de: |-
        Um nicht von Fressfeinden entdeckt zu werden,
        krabbelt es auf zwei Brustflossen am Meeresboden.
      es: |-
        Para que los depredadores no lo detecten, se arrastra
        por el fondo marino con las aletas del pecho.
      it: |-
        Per non farsi scoprire dai nemici, si muove lentamente
        sui fondali marini con le due pinne pettorali.
    omega-ruby:
      ja-Hrkt: |-
        ふかい　うみの　そこで　くらす。
        ４まいの　ひれの　もようを　ひからせ
        えものを　おびきよせる。
      ja: |-
        深い　海の　底で　暮らす。
        ４枚の　ヒレの　模様を　光らせて
        獲物を　おびき寄せる。
      ko: |-
        깊은 바다의 밑바닥에서 산다.
        4개의 지느러미 무늬를 반짝거려
        먹이를 끌어들인다.
      en: |-
        It lives on the deep-sea floor. It attracts prey by
        flashing the patterns on its four tail fins.
      fr: |-
        Il vit au plus profond de l’océan. Il attire sa proie en illuminant
        les motifs de ses quatre nageoires.
      de: |-
        Es lebt tief auf dem Meeresboden. Das blinkende Muster auf
        seinen vier Rückenflossen zieht Beute an.
      es: |-
        Vive en las profundidades marinas. Atrae a sus presas con
        parpadeos del dibujo de sus cuatro aletas.
      it: |-
        Vive negli abissi marini. Attira le prede illuminando i motivi
        delle sue quattro pinne.
    alpha-sapphire:
      ja-Hrkt: |-
        てんてきに　みつからないように
        むねの　２まいの　ひれを　つかい
        かいていを　はって　いどうする。
      ja: |-
        天敵に　見つからないように
        胸の　２枚の　ヒレを　使い
        海底を　這って　移動する。
      ko: |-
        천적에게 발견되지 않도록
        가슴에 있는 2개의 지느러미로
        해저에 붙어서 이동한다.
      en: |-
        To avoid detection by predators, it crawls along the
        seafloor using the two fins on its chest.
      fr: |-
        Pour éviter de se faire voir par ses ennemis, il rampe au fond
        de l’eau grâce aux nageoires sur son torse.
      de: |-
        Um nicht von Fressfeinden entdeckt zu werden, krabbelt es
        auf zwei Brustflossen am Meeresboden.
      es: |-
        Para que los depredadores no lo detecten, se arrastra por el
        fondo marino con las aletas del pecho.
      it: |-
        Per non farsi scoprire dai nemici, si muove lentamente sui
        fondali marini con le due pinne pettorali.
    sun:
      ja-Hrkt: |-
        ひかりで　えものを　おびきよせるが
        てんてきである　どうもうな
        さかなポケモンまで　よってくるのだ。
      ja: |-
        光で　獲物を　おびき寄せるが
        天敵である　獰猛な
        さかなポケモンまで　寄ってくるのだ。
      ko: |-
        빛으로 먹이를 유인하지만
        천적인 사나운
        물고기포켓몬까지 다가온다.
      zh-Hant: |-
        利用光來引誘獵物靠近，
        但往往連天敵的兇猛
        魚寶可夢也引了過來。
      zh-Hans: |-
        利用光来诱惑猎物靠近，
        但是作为天敌的凶猛
        鱼宝可梦也靠了过来。
      en: |-
        With its shining light, it lures its prey close.
        However, the light also happens to attract
        ferocious fish Pokémon—its natural predators.
      fr: |-
        Il attire ses proies en émettant de la lumière,
        mais à son grand dam, cela attire aussi ses
        prédateurs : les Pokémon poissons carnassiers.
      de: |-
        Mit seinem blinkenden Muster lockt es Beute an.
        Leider zieht es hierdurch auch seine
        Fressfeinde an.
      es: |-
        Atrae a sus presas con el destello que emite,
        aunque eso también llama la atención de sus
        feroces depredadores marinos.
      it: |-
        Con la sua luce attira le prede, ma anche i
        Pokémon acquatici suoi predatori.
    moon:
      ja-Hrkt: |-
        かいていに　すむ　しんかいのポケモン。
        ヒレをつかい　かいていを　はって
        こうぶつの　スターミーを　さがす。
      ja: |-
        海底に　棲む　深海のポケモン。
        ヒレを使い　海底を　はって
        好物の　スターミーを　探す。
      ko: |-
        해저에 사는 심해의 포켓몬이다.
        지느러미를 사용해 해저를 기어
        좋아하는 아쿠스타를 찾는다.
      zh-Hant: |-
        棲息在海底的深海寶可夢。
        使用鰭在海底爬行，
        尋找愛吃的寶石海星。
      zh-Hans: |-
        栖息在海底的深海宝可梦。
        使用鳍在海底爬行，
        寻找爱吃的宝石海星。
      en: |-
        This deep-sea Pokémon lives at the bottom of
        the sea. Its fins haul it over the seabed in
        search of its favorite food—Starmie.
      fr: |-
        Ce Pokémon des profondeurs vit tout au fond
        de l’océan. Il rampe à l’aide de ses nageoires
        ventrales et cherche les Staross dont il raffole.
      de: |-
        Dieses Tiefsee-Pokémon lebt am Meeresboden,
        über den es mit seinen Flossen krabbelt, um
        Starmie, seine Leibspeise, aufzuspüren.
      es: |-
        Un Pokémon abisal que vive en el lecho marino.
        Usa sus aletas ventrales para arrastrarse en
        busca de Starmie, su presa favorita.
      it: |-
        Vive negli abissi marini. Si sposta sui fondali
        muovendo agilmente le pinne in cerca degli
        Starmie, di cui è ghiotto.
    ultra-sun:
      ja-Hrkt: |-
        ふかい　うみの　そこは　えものが
        すくない。　きちょうなエサを　めぐり
        ランターンと　はげしく　あらそう。
      ja: |-
        深い　海の　底は　獲物が
        少ない。　貴重な　エサを　巡り
        ランターンと　激しく　争う。
      ko: |-
        깊은 바다 밑은 먹이가
        적다. 귀한 먹이를 두고
        랜턴과 격렬히 싸운다.
      zh-Hant: |-
        深海的海底獵物很少，
        為了爭奪寶貴的食物，
        會和電燈怪展開激烈的鬥爭。
      zh-Hans: |-
        深海的海底猎物很少。
        四处寻找宝贵的食物，
        和电灯怪展开激烈争夺。
      en: |-
        Deep down at the bottom of the ocean, prey is
        scarce. Lumineon get into fierce disputes with
        Lanturn over food.
      fr: |-
        La nourriture étant très rare dans les abysses
        marins, Luminéon doit souvent se disputer
        ses précieuses proies avec Lanturn.
      de: |-
        Auf dem tiefen Meeresboden gibt es nur wenig
        Beute, weshalb es sich mit Lanturn heftige
        Kämpfe um das wertvolle Futter liefert.
      es: |-
        Es difícil encontrar presas en lo más profundo
        del mar, por lo que lucha a capa y espada con
        los Lanturn si avista una que merezca la pena.
      it: |-
        I fondali marini non gli offrono molte occasioni
        per cibarsi, perciò si scontra continuamente
        con i Lanturn per accaparrarsi le prede migliori.
    ultra-moon:
      ja-Hrkt: |-
        しんかいの　かいていを　はうように
        およぐ。　げんそうてきな　ヒレの
        ひかりは　よぞらの　ほしの　よう。
      ja: |-
        深海の　海底を　はうように
        泳ぐ。　幻想的な　ヒレの
        光は　夜空の　星の　よう。
      ko: |-
        심해 해저를 기어가듯 헤엄친다.
        환상적인 지느러미의 빛은
        밤하늘의 별과 같다.
      zh-Hant: |-
        像爬行般地在海底游動。
        鰭發出的光充滿奇幻氣氛，
        就像夜空中的星星一樣。
      zh-Hans: |-
        像是爬行一样在深海的海底游泳。
        鳍上发出的充满幻想的光
        就像是夜空的星星。
      en: |-
        They traverse the deep waters as if crawling
        over the seafloor. The fantastic lights of its
        fins shine like stars in the night sky.
      fr: |-
        Il se déplace en rampant dans les profondeurs
        de l’océan. Ses nageoires brillent telles des
        étoiles dans le ciel nocturne.
      de: |-
        Es bewegt sich krabbelnd über den Boden der
        Tiefsee. Seine prachtvollen Flossen leuchten
        wie der Sternenhimmel.
      es: |-
        Nada arrastrándose por el lecho marino. Sus
        espléndidas aletas brillan como las estrellas del
        firmamento.
      it: |-
        Avanza strisciando sul fondo degli abissi marini.
        La luce meravigliosa delle sue pinne ricorda
        le stelle risplendenti del cielo notturno.
    legends-arceus:
      en: |-
        Uses its gleaming fins to hunt its prey. The view of Lumineon
        schooling near the surface of the sea at night is breathtaking—
        it's as though there were shining stars right there.
