    sword:
      ja-Hrkt: |-
        ほぼ　ぜつめつした　ポケモン。
        みっかに　いちど　だっぴして
        カラを　どんどん　かたくする。
      ja: |-
        ほぼ　全滅した　ポケモン。
        ３日に　一度　脱皮して
        殻を　どんどん　硬くする。
      ko: |-
        거의 멸종된 포켓몬이다.
        3일에 1번 탈피하여
        껍질을 점점 단단하게 만든다.
      zh-Hant: |-
        幾乎滅絕的寶可夢。
        每３天就會脫一次皮，
        讓殼變得越來越堅硬。
      zh-Hans: |-
        几乎已灭绝的宝可梦。
        每３天会脱一次皮，使自己
        的壳变得越来越坚硬。
      en: |-
        This species is almost entirely extinct. Kabuto
        molt every three days, making their shells harder
        and harder.
      fr: |-
        Ce Pokémon au bord de l’extinction
        mue tous les trois jours et renforce
        ainsi davantage sa carapace.
      de: |-
        Dieses Pokémon ist so gut wie ausgestorben.
        Sein Panzer wird immer härter, indem es sich
        alle drei Tage häutet.
      es: |-
        Un Pokémon casi extinto. Cada tres días, muda
        el caparazón, que se va endureciendo de forma
        progresiva.
      it: |-
        È un Pokémon sull’orlo dell’estinzione. Fa la
        muta ogni tre giorni indurendo gradualmente
        il carapace.
    shield:
      ja-Hrkt: |-
        ぜつめつしたとも　いわれるが
        いちぶの　ちいきでは　けっこう
        ふつうに　みかける　らしい。
      ja: |-
        絶滅したとも　言われるが
        一部の　地域では　けっこう
        普通に　見かける　らしい。
      ko: |-
        멸종되었다는 이야기가 있지만
        일부 지역에서는 제법
        많이 목격되는 듯하다.
      zh-Hant: |-
        雖然有人說這種寶可夢
        已經滅絕，但牠在一部分
        地區似乎是相當常見的。
      zh-Hans: |-
        虽然存在已经灭绝的说法，
        但据说在一部分地区
        还是经常能见到它的身影。
      en: |-
        While some say this species has gone extinct,
        Kabuto sightings are apparently fairly common
        in some places.
      fr: |-
        On raconte qu’ils se seraient éteints,
        mais apparemment, on peut souvent
        en croiser dans une zone particulière.
      de: |-
        Es heißt zwar, dass Kabuto ausgestorben sei,
        doch in einer bestimmten Gegend trifft man es
        noch relativ häufig an.
      es: |-
        Se consideraba extinto, pero, al parecer, existen
        determinadas zonas en las que es posible hallar
        ejemplares con facilidad.
      it: |-
        Si dice che si sia estinto, ma pare che in certe
        zone si possa avvistare con una certa facilità.
