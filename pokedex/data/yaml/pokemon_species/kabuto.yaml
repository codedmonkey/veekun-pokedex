    x:
      ja-Hrkt: |-
        ３おくねんまえの　すなはまで
        くらしていたと　かんがえられている。
        かたい　カラが　みを　まもる。
      ja: |-
        ３億年前の　砂浜で
        暮らしていたと　考えられている。
        硬い　殻が　身を　守る。
      ko: |-
        3억 년 전에 모래 해변에서
        살고 있었던 것으로 추측된다.
        단단한 껍질이 몸을 보호한다.
      en: |-
        It is thought to have inhabited beaches 300 million
        years ago. It is protected by a stiff shell.
      fr: |-
        On pense qu’il peuplait les plages il y a 300 millions
        d’années. Il est protégé par une coquille robuste.
      de: |-
        Man geht davon aus, dass dieses Pokémon vor
        300 Millionen Jahren die Strände bevölkerte.
      es: |-
        Se cree que habitó las playas hace 300 millones de
        años. Se protege con una dura concha.
      it: |-
        Si ritiene che vivesse sulle spiagge 300 milioni di
        anni fa. È protetto da una conchiglia robusta.
    'y':
      ja-Hrkt: |-
        こだい　せいぶつの　かせきから
        さいせいしたポケモン。
        かたい　カラで　みを　まもっている。
      ja: |-
        古代生物の　化石から
        再生した　ポケモン。
        硬い　殻で　身を　守っている。
      ko: |-
        고대 생물의 화석에서
        재생된 포켓몬.
        단단한 껍데기로 몸을 지키고 있다.
      en: |-
        This Pokémon was regenerated from the fossil of an
        ancient creature. It protects itself with a hard shell.
      fr: |-
        Ce Pokémon a été reconstitué à partir du fossile
        d’une ancienne créature. Il se protège à l’aide de
        sa carapace.
      de: |-
        Dieses Pokémon wurde aus dem Fossil einer
        altertümlichen Kreatur geschaffen. Es schützt sich
        mittels eines harten Panzers.
      es: |-
        Es un Pokémon regenerado a partir de un fósil de una
        criatura ancestral. Está protegido por un duro
        caparazón.
      it: |-
        Questo Pokémon è stato rigenerato dal fossile di
        un’antica creatura. È protetto da un guscio coriaceo.
    omega-ruby:
      ja-Hrkt: |-
        かせきから　ふっかつした　ポケモンだが　まれに
        いきつづけている　カブトを　はっけん　できる。
        その　すがたは　３おくねん　かわっていない。
      ja: |-
        化石から　復活した　ポケモンだが　まれに
        生き続けている　カブトを　発見　できる。
        その　姿は　３億年　変わっていない。
      ko: |-
        화석에서 부활한 포켓몬이지만 드물게
        살아 있는 투구를 발견할 수 있다.
        그 모습은 3억 년 동안 변치 않았다.
      en: |-
        Kabuto is a Pokémon that has been regenerated from a fossil.
        However, in extremely rare cases, living examples have been
        discovered. The Pokémon has not changed at all for
        300 million years.
      fr: |-
        Kabuto est un Pokémon ressuscité à partir d’un fossile.
        Cependant, on a découvert des spécimens vivants.
        Ce Pokémon n’a pas changé depuis 300 millions d’années.
      de: |-
        Kabuto ist ein Pokémon, das aus einem Fossil reproduziert
        wurde. Höchst selten wurden lebende Exemplare dieser Art
        entdeckt. Dieses Pokémon hat sich seit 300 Millionen Jahren
        überhaupt nicht verändert.
      es: |-
        Kabuto es un Pokémon regenerado a partir de un fósil,
        aunque, en raras ocasiones, se han encontrado casos de
        ejemplares vivos en estado salvaje. En 300 millones de
        años, este Pokémon no ha cambiado en nada.
      it: |-
        Kabuto è stato rigenerato da un fossile, sebbene in rarissimi
        casi siano stati scoperti esemplari viventi. Il Pokémon non ha
        subito alcuna mutazione nell’arco di oltre 300 milioni di anni.
