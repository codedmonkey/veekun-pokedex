    ultra-sun:
      ja-Hrkt: |-
        ３おくねんまえに　さかえた　ポケモン。
        とある　ちほうでは　いまでも　まれに
        いきた　すがたが　みられると　いう。
      ja: |-
        ３億年前に　栄えた　ポケモン。
        とある　地方では　今でも　まれに
        生きた　姿が　見られると　言う。
      ko: |-
        3억 년 전에 번성했던 포켓몬.
        어느 지방에서는 지금도 드물게
        살아 있는 모습을 볼 수 있다고 한다.
      zh-Hant: |-
        ３億年前十分常見的寶可夢。
        據說在某個地區至今仍
        偶爾能看見活著的化石盔。
      zh-Hans: |-
        ３亿年前繁衍兴旺的宝可梦。
        据说在某些地区，至今仍能
        偶尔看见活着的化石盔。
      en: |-
        This Pokémon thrived 300 million years ago. It’s
        said that living specimens can still be seen
        in a certain region—a rare sight.
      fr: |-
        Un Pokémon qui prospérait il y a 300 millions
        d’années. On raconte que de rares survivants
        subsistent dans une certaine région.
      de: |-
        Kabuto erlebte seine Blütezeit vor 300 Millionen
        Jahren. Doch in einer bestimmten Region gibt es
        angeblich noch einige lebende Exemplare.
      es: |-
        Este Pokémon vivió hace 300 millones de años,
        pero en cierta región se dice que han llegado a
        verse ejemplares vivos hoy en día.
      it: |-
        Pokémon vissuto 300 milioni di anni fa.
        Si dice che in una certa regione si possano
        ancora trovare rarissimi esemplari viventi.
    ultra-moon:
      ja-Hrkt: |-
        ごく　いちぶの　ちいきを　のぞいて
        ぜつめつ　してしまった　ポケモン。
        かたい　カラで　みを　まもる。
      ja: |-
        ごく　一部の　地域を　除いて
        絶滅　してしまった　ポケモン。
        硬い　カラで　身を　守る。
      ko: |-
        극히 일부 지역을 제외하고
        멸종해 버린 포켓몬이다.
        단단한 껍질로 몸을 지킨다.
      zh-Hant: |-
        除了極少數的區域之外，
        這種寶可夢幾乎已經絕種。
        會用堅硬的外殼保護身體。
      zh-Hans: |-
        除某些极少数地方外，
        该宝可梦已基本灭绝。
        会用坚硬的外壳保护身体。
      en: |-
        This Pokémon became extinct everywhere,
        except in a few areas. It protects itself with its
        hard shell.
      fr: |-
        Ce Pokémon, doté d’une solide carapace
        protectrice, a totalement disparu de la surface
        de la terre, sauf dans une région particulière.
      de: |-
        Dieses Pokémon ist überall ausgestorben, mit
        Ausnahme einer bestimmten Region. Es schützt
        sich mit einem harten Panzer.
      es: |-
        Posee una dura coraza que lo protege. Este
        Pokémon se ha extinguido en todo el mundo
        salvo en una región determinada.
      it: |-
        Questo Pokémon si è ormai estinto in tutte le
        regioni tranne una. È protetto da una conchiglia
        robusta.
    lets-go-pikachu:
      ja-Hrkt: |-
        カセキから　さいせいした　ポケモン。
        かいていに　かくれては　せなかの
        めで　あたりを　みていたようだ。
      ja: |-
        カセキから　再生した　ポケモン。
        海底に　隠れては　背中の
        目で　あたりを　見ていたようだ。
      ko: |-
        화석에서 재생된 포켓몬.
        해저에 숨어서 등에 달린
        눈으로 주변을 살폈던 것 같다.
      zh-Hant: |-
        從化石復活而來的寶可夢。
        似乎會躲在海底，用背上的
        眼睛來觀察四周。
      zh-Hans: |-
        由化石复活而成的宝可梦。
        在藏匿于海底时似乎会用
        背上的眼睛观察周围的情况。
      en: |-
        A Pokémon that was recovered from a fossil.
        It used the eyes on its back while hiding
        on the seafloor.
      fr: |-
        Un Pokémon reconstitué à partir d’un fossile.
        Il utilise les yeux situés sur son dos pour regarder
        alentour quand il se cache au fond de l’eau.
      de: |-
        Es wurde aus einem Fossil zurückverwandelt.
        Aus Verstecken am Meeresboden spähte es mit
        den Augen auf seinem Rücken die Gegend aus.
      es: |-
        Este Pokémon se regeneró a partir de un fósil.
        Usaba los ojos de la espalda para explorar su
        entorno al ocultarse en el lecho marino.
      it: |-
        Pokémon rigenerato da un fossile. Quando
        si nasconde sul fondo del mare usa gli occhi
        che ha sul dorso per guardarsi intorno.
    lets-go-eevee:
      ja-Hrkt: |-
        カセキから　さいせいした　ポケモン。
        かいていに　かくれては　せなかの
        めで　あたりを　みていたようだ。
      ja: |-
