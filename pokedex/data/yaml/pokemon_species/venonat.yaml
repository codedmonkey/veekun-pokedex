    lets-go-pikachu:
      ja-Hrkt: |-
        レーダーになる　おおきな　めは
        あかるいところでは　ちいさな　めが
        あつまって　できているのが　わかる。
      ja: |-
        レーダーになる　大きな　目は
        明るいところでは　小さな　目が
        集まって　できているのが　わかる。
      ko: |-
        레이더 역할을 하는 큰 눈은
        밝은 곳에서 보면 작은 눈이 모여서
        이루어진 것임을 알 수 있다.
      zh-Hant: |-
        在明亮的地方看就會發現
        那對有著雷達作用的大眼睛，
        是由許多小眼睛聚集而成的。
      zh-Hans: |-
        在明亮的地方你便能发现它
        具有雷达功能的大眼其实是
        由许多个小眼睛聚集而成的。
      en: |-
        Its large eyes act as radar. In a bright place, you
        can see that they are clusters of many tiny eyes.
      fr: |-
        Ses grands yeux lui servent de radar. En pleine
        lumière, on peut y distinguer des facettes.
      de: |-
        Seine großen Augen fungieren als Radar.
        Im Licht kann man erkennen, dass sie aus
        unzähligen, sehr kleinen Augen bestehen.
      es: |-
        Sus grandes ojos actúan como radares. A plena
        luz se percibe que son, en realidad, grupos de
        ojos diminutos.
      it: |-
        Gli occhi enormi fungono da radar. Alla luce
        si può notare che sono formati da molti occhi
        più piccoli.
