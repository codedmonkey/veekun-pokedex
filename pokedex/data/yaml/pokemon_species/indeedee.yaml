indeedee:
  base_happiness: 140
  capture_rate: 30
  color: purple
  egg_groups:
    - fairy
  evolution_chain: indeedee
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        あたまの　ツノで　あいての　きもちを
        かんじとる。　オスは　じゅうしゃの
        ように　あるじのそばで　せわをやく。
      ja: |-
        頭の　ツノで　相手の　気持ちを
        感じとる。　オスは　従者の
        ように　主のそばで　世話を焼く。
      ko: |-
        머리에 달린 뿔로 상대의 기분을
        감지한다. 수컷은 집사처럼
        주인의 곁에서 시중을 든다.
      zh-Hant: |-
        會用頭上的角讀取對方的心情。
        雄性就像管家一樣，
        在主人的身邊打理一切。
      zh-Hans: |-
        会用头上的角读取对方的心情。
        雄性就像管家一样，
        在主人的身边打理一切。
      en: |-
        It uses the horns on its head to sense the
        emotions of others. Males will act as valets for
        those they serve, looking after their every need.
      fr: |-
        Il peut sentir les émotions d’autrui avec ses cornes.
        Le mâle reste aux côtés de son Dresseur pour
        s’occuper de lui, à l’image d’un domestique.
      de: |-
        Mit den Hörnern auf seinem Kopf erfasst es die
        Gefühle seines Gegenübers. Männchen kümmern
        sich wie Bedienstete um ihren Trainer.
      es: |-
        Percibe las emociones del objetivo con los
        cuernos de la cabeza. Los machos están atentos
        a cualquier cosa que necesite su Entrenador.
      it: |-
        Le corna sulla testa gli permettono di percepire
        lo stato d’animo degli altri. Il maschio segue il
        suo Allenatore ovunque e si prende cura di lui.
    shield:
      ja-Hrkt: |-
        ツノで　ちかくの　いきものの
        きもちを　かんじとる。　ポジティブな
        かんじょうが　ちからの　みなもと。
      ja: |-
        ツノで　近くの　生き物の
        気持ちを　感じとる。　ポジティブな
        感情が　力の　源。
      ko: |-
        뿔로 가까이 있는 생명체의
        기분을 읽는다. 긍정적인
        감정이 힘의 원천이다.
      zh-Hant: |-
        能透過自己的角去
        感受附近生物的情感。
        正面情緒是牠的能量之源。
      zh-Hans: |-
        能通过自己的角去
        感受附近生物的情感。
        正面情绪是它的能量之源。
      en: |-
        Through its horns, it can pick up on the emotions
        of creatures around it. Positive emotions are the
        source of its strength.
      fr: |-
        Avec ses cornes, il peut percevoir les émotions
        des êtres vivants alentour. Celles qui sont
        positives lui servent de source d’énergie.
      de: |-
        Mit seinen Hörnern erfasst es die Gefühle von
        Lebewesen, die sich in seiner Nähe aufhalten.
        Positive Gefühle sind die Quelle seiner Kraft.
      es: |-
        Con sus cuernos percibe las emociones de los
        seres vivos que se hallen cerca. Los sentimientos
        positivos constituyen su fuente de energía.
      it: |-
        Percepisce lo stato d’animo di chi gli sta intorno
        grazie alle sue corna. I sentimenti positivi sono
        la sua fonte di energia.
