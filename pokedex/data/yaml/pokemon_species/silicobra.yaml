silicobra:
  base_happiness: 50
  capture_rate: 255
  color: green
  egg_groups:
    - ground
    - dragon
  evolution_chain: silicobra
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        あなを　ほりながら　たべた　すなを
        くびの　ふくろに　ためている。
        ８キロもの　すなが　はいるのだ。
      ja: |-
        穴を　掘りながら　食べた　砂を
        首の　袋に　溜めている。
        ８キロもの　砂が　入るのだ。
      ko: |-
        굴을 파면서 먹은 모래를
        목에 있는 주머니에 저장하는데
        8kg이나 되는 모래가 들어간다.
      zh-Hant: |-
        一邊挖洞一邊把吃掉的
        沙子儲存在頸部的囊裡。
        囊裡面能裝進８公斤的沙子。
      zh-Hans: |-
        一边挖洞一边把吃掉的
        沙子储存在颈部的囊里。
        囊里面能装进８公斤的沙子。
      en: |-
        As it digs, it swallows sand and stores it in its
        neck pouch. The pouch can hold more than
        17 pounds of sand.
      fr: |-
        Il amasse le sable qu’il avale en creusant
        dans la poche de son cou. Elle peut en contenir
        jusqu’à huit kilos.
      de: |-
        Den Sand, den es beim Graben von Löchern
        verzehrt, speichert es in einem Beutel in seinem
        Hals. Dieser kann bis zu 8 kg Sand aufnehmen.
      es: |-
        Almacena la arena que ingiere al perforar hoyos
        en la saca del cuello, cuya capacidad llega a
        alcanzar incluso los 8 kg.
      it: |-
        Conserva nella sacca del collo la sabbia che
        ingoia scavando buche. Può accumularne ben
        8 kg.
    shield:
      ja-Hrkt: |-
        はなの　あなから　すなを　ふんしゃ。
        てきの　めを　くらました　すきに
        ちちゅうに　もぐって　みを　かくす。
      ja: |-
        鼻の　穴から　砂を　噴射。
        敵の　目を　くらました　隙に
        地中に　潜って　身を　隠す。
      ko: |-
        콧구멍으로 모래를 분사한다.
        적의 눈을 속이고 그 틈에
        땅속으로 숨어들어 몸을 숨긴다.
      zh-Hant: |-
        會從鼻孔噴射出沙子，
        趁敵人看不清的時候
        躲進地底下藏身。
      zh-Hans: |-
        会从鼻孔喷射出沙子，
        趁敌人看不清的时候
        躲进地底下藏身。
      en: |-
        It spews sand from its nostrils. While the enemy
        is blinded, it burrows into the ground to hide.
      fr: |-
        En expulsant du sable par les narines, il aveugle
        son adversaire et en profite pour se cacher
        sous terre.
      de: |-
        Aus seinen Nasenlöchern verschießt es Sand.
        Sobald der Feind dadurch nichts mehr sieht,
        versteckt es sich flugs unter der Erde.
      es: |-
        Expulsa arena por los orificios nasales. Una vez
        que aturde al enemigo, aprovecha la ocasión
        para ocultarse bajo tierra.
      it: |-
        Espelle sabbia dalle narici accecando il nemico
        per distrarlo e ne approfitta per nascondersi
        sottoterra.
