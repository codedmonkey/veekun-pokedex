wailmer:
  base_happiness: 50
  capture_rate: 125
  color: blue
  egg_groups:
    - ground
    - water2
  evolution_chain: wailmer
  evolves_from: ~
  flavor_text:
    ruby:
      en: |-
        WAILMER’s nostrils are located above
        its eyes. This playful POKéMON loves
        to startle people by forcefully snortingout seawater it stores inside its body
        out of its nostrils.
    sapphire:
      en: |-
        WAILMER can store water inside its body
        to transform itself into a ball for
        bouncing around on the ground.By filling itself up with more water, this
        POKéMON can elevate the height of its
        bounces.
    emerald:
      en: |-
        While this POKéMON usually lives in the sea,
        it can survive on land, although not too
        long. It loses vitality if its body becomes
        dried out.
    firered:
      en: |-
        When it sucks in a large volume of
        seawater, it becomes like a big, bouncy
        ball. It eats a ton of food daily.
    leafgreen:
      en: |-
        When it sucks in a large volume of
        seawater, it becomes like a big, bouncy
        ball. It eats a ton of food daily.
    diamond:
      en: |-
        On sunny days, it lands on beaches
        to bounce like a ball and play.
        It spouts water from its nose.
    pearl:
      en: |-
        On sunny days, it lands on beaches
        to bounce like a ball and play.
        It spouts water from its nose.
    platinum:
      en: |-
        On sunny days, it lands on beaches
        to bounce like a ball and play.
        It spouts water from its nose.
    heartgold:
      en: |-
        It bounces playfully like a ball.
        The more seawater it swallows,
        the higher it bounces.
    soulsilver:
      en: |-
        It bounces playfully like a ball.
        The more seawater it swallows,
        the higher it bounces.
    black:
      en: |-
        On sunny days, it lands on beaches
        to bounce like a ball and play.
        It spouts water from its nose.
      fr: |-
        Par beau temps, il se pose sur les
        plages pour jouer et rebondir. Il
        expulse de l’eau par son évent.
    white:
      en: |-
        On sunny days, it lands on beaches
        to bounce like a ball and play.
        It spouts water from its nose.
      fr: |-
        Par beau temps, il se pose sur les
        plages pour jouer et rebondir. Il
        expulse de l’eau par son évent.
    black-2:
      en: |-
        It eats one ton of food every day.
        It plays by shooting stored seawater
        out its blowholes with great force.
    white-2:
      en: |-
        It eats one ton of food every day.
        It plays by shooting stored seawater
        out its blowholes with great force.
    x:
      ja-Hrkt: |-
        ボールの　ように　はずんで　あそぶ。
        たくさん　かいすいを　のみこむ　ほど
        たかく　はずむ　ように　なるのだ。
      ja: |-
        ボールの　ように　弾んで　遊ぶ。
        たくさんの　海水を　飲みこむほど
        高く　弾むように　なるのだ。
      ko: |-
        공처럼 튀면서 논다.
        해수를 많이 마실수록
        높이 튀게 된다.
      en: |-
        It bounces playfully like a ball. The more seawater
        it swallows, the higher it bounces.
      fr: |-
        Il rebondit comme un ballon pour s’amuser.
        Plus il boit d’eau, plus il va haut.
      de: |-
        Es hüpft gerne wie ein Ball herum. Je mehr
        Meerwasser es trinkt, desto höher kann es springen.
      es: |-
        Le gusta botar como una pelota de playa. Cuanta más
        agua de mar traga, más alto puede llegar.
      it: |-
        Si diverte a rimbalzare come una palla. Più acqua di
        mare ingolla, più in alto riesce a rimbalzare.
    'y':
      ja-Hrkt: |-
        まいにち　１トンの　エサをたべる。
        はなから　ためこんだ　かいすいを
        いきおいよく　ふきだして　あそぶ。
      ja: |-
        毎日　１トンの　エサを食べる。
        鼻から　ためこんだ　海水を
        勢いよく　噴き出して　遊ぶ。
      ko: |-
        매일 1톤의 먹이를 먹는다.
        코에서 모은 해수를
        기세 좋게 내뿜으며 논다.
      en: |-
        It eats one ton of food every day. It plays by
        shooting stored seawater out its blowholes with
        great force.
      fr: |-
        Il mange près d’une tonne de nourriture par jour.
        Jouer avec son jet d’eau est son passe-temps favori.
      de: |-
        Es nimmt täglich 1 t an Nahrung auf und lässt verspielt
        Wasserfontänen aus seinem Atemloch aufschießen.
      es: |-
        Engulle una tonelada de comida al día. Le gusta
        jugar expulsando con energía el agua marina por
        sus espiráculos.
      it: |-
        Mangia una tonnellata di cibo al giorno. Si diverte a
        spruzzare con forza l’acqua marina attraverso il suo
        sfiatatoio.
    omega-ruby:
      ja-Hrkt: |-
        めの　うえに　ついている　はなの　あなから
        からだに　ためた　かいすいを　ふきだし
        ひとを　おどろかすのが　だいすきな　ポケモンだ。
      ja: |-
        目の　上に　ついている　鼻の　穴から
        体に　ためた　海水を　吹き出し
        人を　驚かすのが　大好きな　ポケモンだ。
      ko: |-
        눈 위에 있는 콧구멍을 통해
        몸에 모아둔 바닷물을 뿜어내서
        사람을 놀라게 하는 것을 좋아하는 포켓몬이다.
      en: |-
        Wailmer’s nostrils are located above its eyes. This playful
        Pokémon loves to startle people by forcefully snorting out
        seawater it stores inside its body out of its nostrils.
      fr: |-
        Les narines de Wailmer sont situées au-dessus de ses yeux.
        Ce joyeux Pokémon adore effrayer les gens en expulsant
        de l’eau de mer par les narines.
      de: |-
        Wailmers Nasenlöcher liegen über seinen Augen. Dieses
        verspielte Pokémon erschreckt gern Menschen, indem
        es das Meerwasser, das es in seinem Körper speichert,
        mit aller Kraft herausprustet.
      es: |-
        Wailmer tiene los espiráculos encima de la cabeza. A este
        juguetón Pokémon le encanta asustar a la gente expulsando
        el agua que acumula a través de estos orificios.
      it: |-
        Le narici di Wailmer sono posizionate sopra gli occhi.
        È un giocherellone e ama spaventare le persone sparando
        dalle narici l’acqua del mare, che accumula all’interno
        del proprio corpo.
    alpha-sapphire:
      ja-Hrkt: |-
        からだに　かいすいを　ためると　ボールの　ように
        じめんで　とびはねることが　できるように　なる。
        たくさん　ためると　たかく　ジャンプできる。
      ja: |-
        体に　海水を　ためると　ボールの　ように
        地面で　飛び跳ねることが　できるように　なる。
        沢山　ためると　高く　ジャンプできる。
      ko: |-
        몸에 바닷물을 저장하면 공처럼
        땅에서 튀어 오를 수 있게 된다.
        많이 저장하면 더 높이 점프할 수 있다.
      en: |-
        Wailmer can store water inside its body to transform itself
        into a ball for bouncing around on the ground. By filling itself
        up with more water, this Pokémon can elevate the height of
        its bounces.
      fr: |-
        Wailmer peut stocker de l’eau dans son corps pour se
        transformer en balle et rebondir sur le sol. Plus ce Pokémon
        se remplit d’eau, plus il peut rebondir haut.
      de: |-
        Wailmer kann Wasser in seinem Körper speichern,
        um sich in einen Ball zu verwandeln und herumzuhüpfen.
        Wenn es die Wassermenge steigert, kann dieses Pokémon
        noch höher hüpfen.
      es: |-
        Wailmer puede almacenar agua dentro de su organismo para
        convertirse en una pelota y botar por tierra firme. Cuanta más
        agua trague, mayor altura alcanzará al saltar.
      it: |-
        Wailmer accumula acqua all’interno del proprio corpo per
        trasformarsi in un pallone e rimbalzare al suolo. Questo
        Pokémon aumenta l’altezza del balzo incrementando
        la quantità d’acqua con cui si gonfia.
    sun:
      ja-Hrkt: |-
        ひとを　おどろかせるのが　すき。
        かいすいを　のみこんで　ボールの
        ように　ふくらみ　はずんで　あそぶ。
      ja: |-
        人を　驚かせるのが　好き。
        海水を　飲み込んで　ボールの
        ように　ふくらみ　弾んで　遊ぶ。
      ko: |-
        사람을 놀라게 하는 것을 좋아한다.
        해수를 삼켜서 공처럼
        몸을 부풀려 튀면서 논다.
      zh-Hant: |-
        很喜歡嚇人。
        會喝海水把肚子撐得
        跟球一樣來玩彈跳遊戲。
      zh-Hans: |-
        喜欢吓人。
        喝入海水鼓成球一样，
        弹跳着玩。
      en: |-
        It loves to startle people. It fills itself up with
        seawater and plays by bouncing around like
        a ball.
      fr: |-
        Très joueur, il adore faire des blagues.
        Il engloutit des litres d’eau de mer et enfle
        comme une baudruche, pour mieux rebondir.
      de: |-
        Wailmer liebt es, Menschen zu erschrecken.
        Es trinkt so viel Meerwasser, dass es sich in
        einen Ball verwandeln und herumhüpfen kann.
      es: |-
        A este Pokémon le gusta dar sustos a la gente.
        Se divierte tragando mucha agua de mar para
        hincharse como una bola y dar grandes saltos.
      it: |-
        Si diverte a spaventare la gente.
        Ama gonfiarsi riempiendosi d’acqua e rimbalzare
        qua e là.
    moon:
      ja-Hrkt: |-
        のみこんだ　かいすいを　めの　うえの
        はなの　あなから　ふきだし　アピール。
        まいにち　１トンの　ヨワシを　くう。
      ja: |-
        飲み込んだ　海水を　目の　上の
        鼻の　穴から　吹きだし　アピール。
        毎日　１トンの　ヨワシを　喰う。
      ko: |-
        들이마신 바닷물을 눈 위의
        콧구멍으로 뿜어내어 어필한다.
        매일 1톤의 약어리를 먹는다.
      zh-Hant: |-
        把喝入的海水從眼睛上方的
        鼻孔中噴出來吸引他人。
        每天要吃１噸弱丁魚。
      zh-Hans: |-
        把喝入的海水从眼睛上方的
        鼻孔中喷出来吸引他人。
        每天要吃１吨弱丁鱼。
      en: |-
        It shows off by spraying jets of seawater from
        the nostrils above its eyes. It eats a solid ton of
        Wishiwashi every day.
      fr: |-
        Il recrache l’eau avalée par son évent, c’est
        ce qui le rend si charmant. Il gobe une tonne
        de Froussardine par jour.
      de: |-
        Es prustet Meerwasser aus den über seinen
        Augen liegenden Nasenlöchern hinaus.
        Außerdem frisst es täglich eine Tonne Lusardin.
      es: |-
        Wailmer se come una tonelada de Wishiwashi
        cada día. Le gusta llamar la atención expulsando
        chorros de agua marina por su espiráculo.
      it: |-
        Gioca spruzzando l’acqua di mare dalle narici
        situate sopra gli occhi.
        Mangia una tonnellata di Wishiwashi al giorno.
    ultra-sun:
      ja-Hrkt: |-
        くちを　ひらいたまま　およいで
        かいすいごと　エサをくう。　いらない
        みずは　はなから　ふきだし　すてる。
      ja: |-
        口を　開いたまま　泳いで
        海水ごと　エサを　食う。　いらない
        水は　鼻から　噴き出し　捨てる。
      ko: |-
        입을 열고 헤엄쳐서
        해수와 함께 먹이를 먹는다.
        필요없는 물은 코로 내뿜는다.
      zh-Hant: |-
        會張著嘴巴游泳，
        把食物連同海水一起吃下去。
        不要的水會從鼻子噴出去捨棄掉。
      zh-Hans: |-
        会张着嘴游泳，
        将食物连同海水一起吃下去。
        不要的水会从鼻子里喷出来舍弃。
      en: |-
        It swims along with its mouth open and
        swallows down seawater along with its food.
        It sprays excess water out of its nostrils.
      fr: |-
        Pour se nourrir, il nage en gardant la bouche
        grande ouverte, et recrache l’eau dont il n’a
        pas besoin par son évent.
      de: |-
        Es schwimmt mit offenem Maul und nimmt mit
        dem Wasser sein Futter auf. Überschüssiges
        Wasser stößt es durch seine Nasenlöcher aus.
      es: |-
        Nada con la boca abierta para engullir alimento
        y cantidades ingentes de agua de mar, cuyo
        exceso expulsa luego por el espiráculo.
      it: |-
        Nuota con la bocca aperta, ingoiando cibo e
        acqua marina, poi espelle l’acqua in eccesso
        spruzzandola dallo sfiatatoio.
    ultra-moon:
      ja-Hrkt: |-
        ごくごく　まれに　むれが　すなはまに
        うちあがるのは　おおむかし　りくに
        すんでいた　なごりと　いわれている。
      ja: |-
        極々　まれに　群れが　砂浜に
        打ちあがるのは　大昔　陸に
        棲んでいた　名残と　いわれている。
      ko: |-
        매우 드물게 무리가 모래 해변에
        올라오는 것은 먼 옛날 육지에
        살았던 기억 때문이라고 전해진다.
      zh-Hant: |-
        在極少數情況下，吼吼鯨的群體
        會衝上沙灘。據說這是源自牠們在
        遠古時代棲息於陸地上的習性。
      zh-Hans: |-
        在极其偶然的情况下它们会群体
        冲上沙滩，据说这是源自它们
        远古时代居住在陆地时的习性。
      en: |-
        Due to their memories of when they once lived
        on land, pods of them will, very rarely, wash up
        on shore.
      fr: |-
        On raconte que ce Pokémon habitait jadis
        sur terre. En de rares occasions, on peut en
        voir se regrouper sur les plages.
      de: |-
        Als Überbleibsel ihres einstigen Lebens an Land
        deutet man den Umstand, dass Wailmer ab und
        an auch heute noch Strände aufsuchen.
      es: |-
        En raras ocasiones, bancos enteros quedan
        varados en la playa, tal vez debido a que en un
        pasado vivía en tierra firme.
      it: |-
        Molto raramente si possono vedere gruppi
        di questi Pokémon adagiati a riva, segno che
        in tempi antichi vivevano sulla terraferma.
    sword:
      ja-Hrkt: |-
        のみこんだ　かいすいを　めの　うえの
        はなの　あなから　ふきだし　アピール。
        まいにち　１トンの　ヨワシを　くう。
      ja: |-
        飲みこんだ　海水を　目の　上の
        鼻の　穴から　噴き出し　アピール。
        毎日　１トンの　ヨワシを　食う。
      ko: |-
        들이마신 바닷물을 눈 위의
        콧구멍으로 뿜어내어 어필한다.
        매일 1톤의 약어리를 먹는다.
      zh-Hant: |-
        把喝入的海水從眼睛上方的
        鼻孔中噴出來吸引他人。
        每天要吃１噸弱丁魚。
      zh-Hans: |-
        把喝入的海水从眼睛上方的
        鼻孔中喷出来吸引他人。
        每天要吃１吨弱丁鱼。
      en: |-
        It shows off by spraying jets of seawater from
        the nostrils above its eyes. It eats a solid ton of
        Wishiwashi every day.
      fr: |-
        Il aime faire le beau en recrachant par son évent
        l’eau qu’il a avalée.
        Il gobe une tonne de Froussardine chaque jour.
      de: |-
        Es prustet Meerwasser aus den Nasenlöchern,
        die über seinen Augen liegen. Außerdem frisst
        es täglich eine Tonne Lusardin.
      es: |-
        Wailmer se come una tonelada de Wishiwashi
        cada día. Le gusta llamar la atención expulsando
        chorros de agua marina por su espiráculo.
      it: |-
        Gioca spruzzando l’acqua di mare dalle narici
        situate sopra gli occhi. Mangia una tonnellata
        di Wishiwashi al giorno.
    shield:
      ja-Hrkt: |-
        かいすいを　たくさん　のみこむと
        からだが　ボールの　ように　はずむ。
        まいにち　１トンの　エサを　たべる。
      ja: |-
        海水を　たくさん　飲みこむと
        体が　ボールの　ように　弾む。
        毎日　１トンの　エサを　食べる。
      ko: |-
        바닷물을 많이 마시면
        몸이 공처럼 튄다.
        매일 1톤의 먹이를 먹는다.
      zh-Hant: |-
        喝入大量的海水之後，
        身體會鼓成像球一樣。
        每天要吃掉１噸的食物。
      zh-Hans: |-
        喝入大量的海水之后，
        身体会鼓成像球一样。
        每天要吃掉１吨的食物。
      en: |-
        When it sucks in a large volume of seawater,
        it becomes like a big, bouncy ball. It eats a ton
        of food daily.
      fr: |-
        Il ressemble à un énorme ballon quand il avale
        de très grandes quantités d’eau de mer.
        Il dévore une tonne de nourriture par jour.
      de: |-
        Verschluckt es eine große Menge Meerwasser,
        wird sein Körper elastisch wie ein Ball. Es frisst
        täglich eine Tonne Nahrung.
      es: |-
        Cuando traga una gran cantidad de agua marina,
        se hincha hasta parecer una pelota. Necesita una
        tonelada de alimento al día.
      it: |-
        Se inghiotte molta acqua diventa una specie
        di palla rimbalzante. Ha bisogno di una
        tonnellata di cibo al giorno.
