lilligant:
  base_happiness: 50
  capture_rate: 75
  color: green
  egg_groups:
    - plant
  evolution_chain: petilil
  evolves_from: petilil
  flavor_text:
    black:
      en: |-
        Even veteran Trainers face a challenge
        in getting its beautiful flower to bloom.
        This Pokémon is popular with celebrities.
      fr: |-
        Même les Dresseurs confirmés ont
        du mal à faire éclore sa belle fleur.
        Un Pokémon apprécié des célébrités.
    white:
      en: |-
        The fragrance of the garland on its head
        has a relaxing effect. It withers if a
        Trainer does not take good care of it.
      fr: |-
        La fleur sur sa tête a des propriétés
        relaxantes. Elle se fane si on ne s’en
        occupe pas avec attention.
    black-2:
      en: |-
        The fragrance of the garland on its head
        has a relaxing effect, but taking
        care of it is very difficult.
    white-2:
      en: |-
        The fragrance of the garland on its head
        has a relaxing effect, but taking
        care of it is very difficult.
    x:
      ja-Hrkt: |-
        あたまの　はなかざりの　かおりには
        リラックスさせる　こうかが　ある。
        ていれを　なまけると　かれてしまう。
      ja: |-
        頭の　花飾りの　香りには
        リラックスさせる　効果が　ある。
        手入れを　怠けると　枯れてしまう。
      ko: |-
        머리에 있는 꽃 장식의 향기에는
        긴장을 풀어 주는 효과가 있다.
        자주 손질하지 않으면 시들어 버린다.
      en: |-
        The fragrance of the garland on its head has a
        relaxing effect. It withers if a Trainer does not take
        good care of it.
      fr: |-
        La fleur sur sa tête a des propriétés relaxantes.
        Elle se fane si on ne s’en occupe pas avec attention.
      de: |-
        Der Duft des Blumenschmucks auf seinem Kopf
        wirkt beruhigend. Damit der Schmuck nicht
        verwelkt, muss man es gut pflegen.
      es: |-
        El aroma de la flor de su tocado relaja a cualquiera a
        su alrededor. Hay que cuidarle mucho para que no se
        marchite.
      it: |-
        I fiori che ha sulla testa spandono un profumo
        rilassante, ma necessitano di continue attenzioni
        per non appassire.
    'y':
      ja-Hrkt: |-
        うつくしい　はなを　さかせるのは
        ベテラントレーナーでも　むずかしい。
        セレブに　にんきの　ポケモン。
      ja: |-
        美しい　花を　咲かせるのは
        ベテラントレーナーでも　難しい。
        セレブに　人気の　ポケモン。
      ko: |-
        베테랑 트레이너일지라도
        아름다운 꽃을 피우기는 쉽지 않다.
        유명 인사에게 인기가 많은 포켓몬이다.
      en: |-
        Even veteran Trainers face a challenge in getting its
        beautiful flower to bloom. This Pokémon is popular
        with celebrities.
      fr: |-
        Même les Dresseurs confirmés ont du mal à faire
        éclore sa belle fleur. Un Pokémon apprécié des
        célébrités.
      de: |-
        Bei Promis ist es sehr beliebt. Auch gestandene
        Trainer tun sich schwer damit, seine Blüte schön
        aufblühen zu lassen.
      es: |-
        Todos los famosos quieren uno de estos Pokémon.
        Incluso a los Entrenadores más curtidos les cuesta
        que florezca.
      it: |-
        Neanche gli Allenatori più navigati riescono sempre a
        fare schiudere il suo fiore. Va di moda fra le celebrità.
    omega-ruby:
      ja-Hrkt: |-
        あたまの　はなかざりの　かおりには
        リラックスさせる　こうかが　ある。
        ていれを　なまけると　かれてしまう。
      ja: |-
        頭の　花飾りの　香りには
        リラックスさせる　効果が　ある。
        手入れを　怠けると　枯れてしまう。
      ko: |-
