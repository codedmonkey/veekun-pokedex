        ma necessitano di continue attenzioni per non appassire.
    alpha-sapphire:
      ja-Hrkt: |-
        うつくしい　はなを　さかせるのは
        ベテラントレーナーでも　むずかしい。
        セレブに　にんきの　ポケモン。
      ja: |-
        美しい　花を　咲かせるのは
        ベテラントレーナーでも　難しい。
        セレブに　人気の　ポケモン。
      ko: |-
        베테랑 트레이너일지라도
        아름다운 꽃을 피우기는 쉽지 않다.
        유명 인사에게 인기가 많은 포켓몬이다.
      en: |-
        Even veteran Trainers face a challenge in getting its
        beautiful flower to bloom. This Pokémon is popular
        with celebrities.
      fr: |-
        Même les Dresseurs confirmés ont du mal à faire éclore
        sa belle fleur. Un Pokémon apprécié des célébrités.
      de: |-
        Bei Promis ist es sehr beliebt. Auch gestandene Trainer tun
        sich schwer damit, seine Blüte schön aufblühen zu lassen.
      es: |-
        Todos los famosos quieren uno de estos Pokémon. Incluso
        a los Entrenadores más curtidos les cuesta que florezca.
      it: |-
        Neanche gli Allenatori più navigati riescono sempre a fare
        schiudere il suo fiore. Va di moda fra le celebrità.
    sun:
      ja-Hrkt: |-
        どんなに　てまと　おかねを　かけても
        ひとの　てで　さかせるよりも　やせいで
        さく　はなの　ほうが　うつくしい。
      ja: |-
        どんなに　手間と　お金を　かけても
        人の　手で　咲かせるよりも　野生で
        咲く　花の　ほうが　美しい。
      ko: |-
        아무리 시간과 돈을 들여도
        사람 손으로 피우는 것보다
        야생에서 피는 꽃이 더 아름답다.
      zh-Hant: |-
        無論花多少功夫和金錢，
        比起借助人工手段培育出的花，
        在野外綻放的花更美。
      zh-Hans: |-
        无论花多少工夫和金钱，
        比起借助人工手段让它开放，
        在野外绽放的花更美。
      en: |-
        No matter how much time and money is spent
        raising it, its flowers are the most beautiful
        when they bloom in the wild.
      fr: |-
        La main la plus verte au monde ne saurait faire
        éclore une fleur de Fragilady aussi belle que
        celles qui s’épanouissent à l’état sauvage.
      de: |-
        Egal, wie viel Mühe und Geld investiert wird,
        sein Blumenschmuck ist wild gewachsen immer
        schöner als von Menschenhand gezüchtet.
      es: |-
        Por muchos esfuerzos o dinero que destine la
        gente para hacerla florecer, siempre es más
        bella la flor que brota en un ejemplar salvaje.
      it: |-
        Per quanto si possano impiegare tempo, denaro
        e fatica nella cura di questo Pokémon, il suo
        fiore sarà sempre più bello se sboccia in natura.
    moon:
      ja-Hrkt: |-
        パートナーとなる　♂が　できた
        とたんに　うつくしい　はなは
        くすんで　しおれ　かれていく。
      ja: |-
        パートナーとなる　♂が　できた
        途端に　美しい　花は
        くすんで　しおれ　枯れていく。
      ko: |-
        파트너인 수컷이 생기면
        아름다운 꽃은 곧
        생기 없이 시들어 말라간다.
      zh-Hant: |-
        一旦和♂成為伴侶，
        美麗的花就會漸漸黯淡，
        變得枯萎。
      zh-Hans: |-
        一旦找到了♂作为同伴，
        美丽的花就会渐渐黯淡，
        变得枯萎。
      en: |-
        As soon as it finds a male to be its partner,
        the beautiful flower on its head darkens,
        droops, and withers away.
      fr: |-
        Dès lors qu’une Fragilady trouve un compagnon
        mâle, sa si jolie fleur se dessèche, se flétrit
        et finit par se faner.
      de: |-
        Sobald es einen Partner gefunden hat, verwelkt
        sein wunderschöner Blumenschmuck.
      es: |-
        Nada más encontrar un compañero, su bella flor
        comienza a languidecer y poco a poco se va
        marchitando sin remedio.
      it: |-
        Appena trova un compagno, il meraviglioso fiore
        che ha sulla testa appassisce e si secca.
    ultra-sun:
      ja-Hrkt: |-
        そだった　つちの　せいぶんに　よって
        はなの　かおりは　すこしずつ　ちがう。
        かぐと　こころが　いやされ　やすらぐ。
      ja: |-
        育った　土の　成分に　よって
        花の　香りは　少しずつ　違う。
        嗅ぐと　心が　癒され　安らぐ。
      ko: |-
        자란 흙의 성분에 따라 꽃향기는
        조금씩 다르다. 냄새를 맡으면
        마음이 치유되고 평온해진다.
      zh-Hant: |-
        隨著栽培用的土壤不同，
        花香也會有些不一樣。
        聞一下就能舒緩心情，帶來安寧。
      zh-Hans: |-
        根据栽培土壤的成分不同，
        花香也会略微不一样。
        闻一下就能治愈心灵，心情舒畅。
      en: |-
        The fragrance of its flower differs slightly
        depending on the soil where it grew up.
        Sniffing the aroma calms your heart and mind.
      fr: |-
        Le parfum de sa fleur calme les nerfs et apaise
        l’esprit. Il varie légèrement selon la composition
        de la terre dans laquelle Fragilady a poussé.
      de: |-
        Sein Blumenduft wird von der Beschaffenheit
        der Erde, auf der es aufwächst, beeinflusst.
        Daran zu riechen ist eine Wohltat für die Seele.
      es: |-
        El olor que desprende su flor varía en función
        de la composición de la tierra en la que crezca.
        Su aroma calma los nervios y sosiega el alma.
      it: |-
        Il profumo del suo fiore, che varia lievemente in
        base alla composizione del terreno dove il
        Pokémon è cresciuto, dona serenità.
    ultra-moon:
      ja-Hrkt: |-
        うつくしいので　ほかの　ポケモンに
        すかれる。　あたまのはなは　ていれを
        おこたると　すぐに　くさって　かれる。
      ja: |-
        美しいので　他の　ポケモンに
        好かれる。　頭の花は　手入れを
        怠ると　すぐに　腐って　枯れる。
      ko: |-
        아름다워서 다른 포켓몬들에게
        사랑받는다. 머리의 꽃은 손질을
        게을리하면 금방 상해서 시든다.
      zh-Hant: |-
        因為美麗的模樣而受到其他
        寶可夢的喜愛。頭上的花如果
        疏於照料，很快就會腐爛枯萎。
      zh-Hans: |-
        因为美丽而受其他宝可梦喜爱。
        头上的花如果疏于照料，
        很快就会腐烂枯萎。
      en: |-
        It’s well liked by other Pokémon because of its
        beauty. The flower on its head needs constant
        care, or it will soon wither and rot.
      fr: |-
        Sa beauté lui confère une grande popularité
        auprès des autres Pokémon. Si l’on ne prend
        pas soin de la fleur sur sa tête, elle fane.
      de: |-
        Es ist aufgrund seiner Schönheit bei anderen
        Pokémon beliebt. Die Blume an seinem Kopf
        verwelkt sofort, wenn man sie nicht pflegt.
      es: |-
        Su belleza fascina a otros Pokémon. La flor de la
        cabeza se marchita enseguida si no se le presta
        el cuidado necesario.
      it: |-
        La sua bellezza affascina anche gli altri
        Pokémon. Il fiore che ha sulla testa necessita
        di continue attenzioni, altrimenti appassisce.
    sword:
      ja-Hrkt: |-
        いちりゅうの　えんげいかでも
        あたまの　はなを　さかせるのは
        しなんのわざと　いわれている。
      ja: |-
        一流の　園芸家でも
        頭の　花を　咲かせるのは
        至難の業と　言われている。
      ko: |-
        일류 원예가라 하더라도
        머리의 꽃을 피우는 일은
        매우 어렵다고 전해진다.
      zh-Hant: |-
        據說即使是一流的園藝家，
        要讓牠的頭上綻放美麗花朵
        也是極為困難的事。
      zh-Hans: |-
        据说即使对一流的园艺家
        来说，让它头上的花朵绽放
        也是一件极其困难的事。
      en: |-
        It’s believed that even first-rate gardeners have a
        hard time getting the flower on a Lilligant’s head
        to bloom.
      fr: |-
        On raconte que même les meilleurs horticulteurs
        ont énormément de mal à faire éclore sa fleur.
      de: |-
        Man sagt, dass selbst erstklassige Gärtner
        Schwierigkeiten damit haben, die Blume auf
        Dressellas Kopf zum Blühen zu bringen.
      es: |-
        Se dice que conseguir que la flor de su cabeza
        florezca es una empresa titánica incluso para los
        mejores jardineros.
      it: |-
        Si dice che riuscire a far sbocciare il fiore sulla
        sua testa sia un’impresa ardua anche per
        i floricoltori più esperti.
    shield:
      ja-Hrkt: |-
        はなから　つくられる　せいゆは
        ごくじょうの　かおりが　するが
        めが　とびでるほど　こうかだ。
      ja: |-
        花から　作られる　精油は
        極上の　香りが　するが
        目が　飛び出るほど　高価だ。
      ko: |-
        꽃으로 만든 정유는
        최고의 향을 내지만
        눈이 튀어나올 정도로 비싸다.
      zh-Hant: |-
        由牠的花朵提煉的精油有著
        極致的香氣，但價格同時也
        是貴得令人眼睛幾乎要掉出來。
      zh-Hans: |-
        用它的花朵制成的精油
        虽有着极致香气，但价格
        同时也贵得令人大跌眼镜。
      en: |-
        Essential oils made from Lilligant flowers
        have a sublime scent, but they’re also
        staggeringly expensive.
      fr: |-
        L’huile essentielle extraite de sa fleur dégage
        un parfum exceptionnel, mais elle coûte
        extrêmement cher.
      de: |-
        Das aus seiner Blume gewonnene ätherische Öl
        verströmt den allerfeinsten Duft, doch es kostet
        ein Vermögen.
      es: |-
        El aceite esencial que se extrae de su flor emana
        un aroma sublime, aunque su precio resulta
        desorbitado.
      it: |-
        L’olio essenziale che si ottiene dal fiore ha un
        profumo sublime, ma costa un occhio della testa.
