gothitelle:
  base_happiness: 50
  capture_rate: 50
  color: purple
  egg_groups:
    - humanshape
  evolution_chain: gothita
  evolves_from: gothorita
  flavor_text:
    black:
      en: |-
        Starry skies thousands of light-years
        away are visible in the space distorted
        by their intense psychic power.
      fr: |-
        Ses pouvoirs psychiques plient l’espace
        aux alentours. On y voit des étoiles
        éloignées de millions d’années-lumière.
    white:
      en: |-
        They can predict the future from the
        placement and movement of the stars.
        They can see Trainers’ life spans.
      fr: |-
        Prédit l’avenir à partir de la position
        et du mouvement des étoiles. Perçoit
        aussi l’espérance de vie des Dresseurs.
    black-2:
      en: |-
        It can see the future from the movement
        of the stars. When it learns its
        Trainer’s life span, it cries in sadness.
    white-2:
      en: |-
        It can see the future from the movement
        of the stars. When it learns its
        Trainer’s life span, it cries in sadness.
    x:
      ja-Hrkt: |-
        きょうりょくな　サイコパワーの
        えいきょうで　くうかんが　ねじれて
        しゅういに　ほしぞらが　うつるのだ。
      ja: |-
        強力な　サイコパワーの　影響で
        ゴチルゼルの　周囲の　空間が　ねじれ
        何万光年も　遠くの　星空が　映る。
      ko: |-
        강력한 사이코 파워의 영향으로
        고디모아젤 주변 공간이 비틀어져
        몇만 광년이나 떨어진 하늘의 별이 비친다.
      en: |-
        Starry skies thousands of light-years away are
        visible in the space distorted by their intense
        psychic power.
      fr: |-
        Ses pouvoirs psychiques plient l’espace aux
        alentours. On y voit des étoiles éloignées de millions
        d’années-lumière.
      de: |-
        Durch seine mächtigen Psycho-Kräfte krümmt sich
        der Raum und Bilder eines Lichtjahre entfernten
        Ortes erscheinen.
      es: |-
        Su inmenso poder psíquico distorsiona el espacio y
        le permite reflejar incluso estrellas a años luz de
        distancia.
      it: |-
        I suoi forti poteri psichici modificano lo spazio
        circostante rendendo visibili galassie lontane
        milioni di anni luce.
    'y':
      ja-Hrkt: |-
        ほしの　ばしょや　うごきから
        みらいの　できごとを　よちする。
        トレーナーの　じゅみょうも　みえる。
      ja: |-
        星の　配置や　動きから　未来の
        できごとを　予知する　能力を　持つ。
        トレーナーの　寿命も　見える。
      ko: |-
        별의 배치나 움직임으로 미래의
        일을 예지하는 능력을 가지고 있다.
        트레이너의 수명도 알 수 있다.
      en: |-
        They can predict the future from the placement and
        movement of the stars. They can see Trainers’
        life spans.
      fr: |-
        Prédit l’avenir à partir de la position et du mouvement
        des étoiles. Perçoit aussi l’espérance de vie des
        Dresseurs.
      de: |-
        Kann anhand der Sternenkonstellationen die Zukunft
        voraussagen. Es weiß sogar, wie alt sein Trainer
        werden wird.
      es: |-
        Predice el futuro analizando la posición de los astros
        y su movimiento. Conoce la esperanza de vida de los
        Entrenadores.
      it: |-
        Prevede il futuro dalla posizione e dal movimento
        delle stelle. Conosce anche la durata della vita
        dell’Allenatore.
    omega-ruby:
      ja-Hrkt: |-
        きょうりょくな　サイコパワーの
        えいきょうで　くうかんが　ねじれて
        しゅういに　ほしぞらが　うつるのだ。
      ja: |-
        強力な　サイコパワーの　影響で
        ゴチルゼルの　周囲の　空間が　ねじれ
        何万光年も　遠くの　星空が　映る。
      ko: |-
        강력한 사이코 파워의 영향으로
        고디모아젤 주변 공간이 비틀어져
        몇만 광년이나 떨어진 하늘의 별이 비친다.
      en: |-
        Starry skies thousands of light-years away are
        visible in the space distorted by their intense
        psychic power.
      fr: |-
        Ses pouvoirs psychiques plient l’espace aux alentours.
        On y voit des étoiles éloignées de millions d’années-lumière.
      de: |-
        Durch seine mächtigen Psycho-Kräfte krümmt sich der Raum
        und Bilder eines Lichtjahre entfernten Ortes erscheinen.
      es: |-
        Su inmenso poder psíquico distorsiona el espacio y le permite
        reflejar incluso estrellas a años luz de distancia.
      it: |-
        I suoi forti poteri psichici modificano lo spazio circostante
        rendendo visibili galassie lontane milioni di anni luce.
    alpha-sapphire:
      ja-Hrkt: |-
        ほしの　ばしょや　うごきから
        みらいの　できごとを　よちする。
        トレーナーの　じゅみょうも　みえる。
      ja: |-
        星の　配置や　動きから　未来の
        できごとを　予知する　能力を　持つ。
        トレーナーの　寿命も　見える。
      ko: |-
        별의 배치나 움직임으로 미래의
        일을 예지하는 능력을 가지고 있다.
        트레이너의 수명도 알 수 있다.
      en: |-
        They can predict the future from the placement and
        movement of the stars. They can see Trainers’
        life spans.
      fr: |-
        Prédit l’avenir à partir de la position et du mouvement
        des étoiles. Perçoit aussi l’espérance de vie des Dresseurs.
      de: |-
        Kann anhand der Sternenkonstellationen die Zukunft
        voraussagen. Es weiß sogar, wie alt sein Trainer werden wird.
      es: |-
        Predice el futuro analizando la posición de los astros y
        su movimiento. Conoce la esperanza de vida de los
        Entrenadores.
      it: |-
        Prevede il futuro dalla posizione e dal movimento delle stelle.
        Conosce anche la durata della vita dell’Allenatore.
    sword:
      ja-Hrkt: |-
        ほしの　うごきから　みらいを　みる。
        すさまじい　サイコパワーを　もつが
        あらそいは　このまない　きしつ。
      ja: |-
        星の　動きから　未来を　見る。
        すさまじい　サイコパワーを　もつが
        争いは　好まない　気質。
      ko: |-
        별의 움직임으로 미래를 본다.
        엄청난 사이코 파워를 가졌지만
        싸움을 좋아하지 않는 기질을 가졌다.
      zh-Hant: |-
        根據星星的動向預知未來。
        雖然擁有強大的精神力量，
        但生性並不喜好紛爭。
      zh-Hans: |-
        根据星星的动向预知未来。
        虽然拥有强大的精神力量，
        但生性并不喜好纷争。
      en: |-
        It has tremendous psychic power, but it dislikes
        conflict. It’s also able to predict the future based
        on the movement of the stars.
      fr: |-
        Il prédit l’avenir à partir du mouvement
        des étoiles. Il dispose de grands pouvoirs
        psychiques, mais il n’est pas de nature hostile.
      de: |-
        Es liest die Zukunft aus Sternenkonstellationen.
        Seine Psycho-Kräfte sind gewaltig, aber es ist
        von Natur aus konfliktscheu.
      es: |-
        Predice el futuro observando el movimiento de
        las estrellas. Posee un poder psíquico tremendo,
        pero evita los conflictos por su buen carácter.
      it: |-
        Prevede il futuro osservando i moti delle stelle.
        Possiede terrificanti poteri psichici, ma per
        natura non ama le ostilità.
    shield:
      ja-Hrkt: |-
        ゴチルゼルに　じぶんの　さいごを
        みせられた　あくにんは　そのひを
        さいごに　ゆくえを　たった。
      ja: |-
        ゴチルゼルに　自分の　最期を
        見せられた　悪人は　その日を
        最後に　行方を　絶った。
      ko: |-
        고디모아젤을 통해 자신의 최후를
        보게 된 악인은 그날을
        마지막으로 종적을 감추었다.
      zh-Hant: |-
        從哥德小姐那裡
        看到了自己下場的惡人
        在那之後便銷聲匿跡了。
      zh-Hans: |-
        从哥德小姐那里
        看到了自己下场的恶人
        在那之后便销声匿迹了。
      en: |-
        A criminal who was shown his fate by a Gothitelle
        went missing that same day and was never
        seen again.
      fr: |-
        Les criminels à qui Sidérella a révélé les derniers
        instants de leur vie ont tous été portés disparus
        le jour même.
      de: |-
        Ein böser Mensch verschwand einst am selben
        Tag, an dem ein Morbitesse ihm die letzten
        Momente seines Lebens gezeigt hatte.
      es: |-
        Los malhechores a los que revela sus últimos
        momentos pierden la vida el mismo día.
      it: |-
        Pare che un malfattore non si sia più fatto
        vedere dopo che Gothitelle gli aveva rivelato
        i suoi ultimi momenti.
