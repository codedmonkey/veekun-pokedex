      zh-Hant: |-
        進化後變得只用後腳就能站立。
        如果被牠的角刺中，
        就連岩石也會被開出洞來。
      zh-Hans: |-
        进化后会变得仅用后脚就能站立。
        如果被它的角刺中，
        就连岩石也会被开个洞。
      en: |-
        It begins walking on its hind legs after evolution.
        It can punch holes through boulders with its horn.
      fr: |-
        L’évolution a permis à ce Pokémon de marcher
        sur ses pattes postérieures. Il peut faire des trous
        dans les rochers en utilisant sa corne.
      de: |-
        Nach seiner Entwicklung geht es aufrecht auf
        seinen Hinterbeinen. Mit seinem Horn kann es
        Löcher in Felsen bohren.
      es: |-
        Cuando evoluciona, comienza a andar con las
        patas traseras. Es capaz de horadar rocas con el
        cuerno que tiene.
      it: |-
        Dopo l’evoluzione inizia a muoversi sulle zampe
