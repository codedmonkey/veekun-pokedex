    x:
      ja-Hrkt: |-
        ぜんしんを　よろいのような　ひふで
        まもっている。２０００どの
        マグマの　なかでも　いきられる。
      ja: |-
        全身を　よろいのような　皮膚で
        守っている。２０００度の
        マグマの　中でも　生きられる。
      ko: |-
        전신을 갑옷 같은 피부로
        보호하고 있다. 2000도의
        마그마 속에서도 살 수 있다.
      en: |-
        Protected by an armor-like hide, it is capable of
        living in molten lava of 3,600 degrees Fahrenheit.
      fr: |-
        Son épiderme très épais lui permet de survivre dans
        un environnement où il fait plus de 2 000 °C.
      de: |-
        Durch seine panzerähnliche Körperhülle kann es
        in bis zu 2 000 °C heißer Lava leben.
      es: |-
        La piel le sirve de escudo protector. Puede vivir en
        lava líquida a 2000 °C de temperatura.
      it: |-
        Protetto da una pelle-armatura, può vivere nella
        lava liquida a 2000 °C.
    'y':
      ja-Hrkt: |-
        しんかして　うしろあし　だけで
        たつようになった。ツノで　つかれると
        がんせきにも　あながあいてしまう。
      ja: |-
        進化して　後ろ足だけで
        立つようになった。ツノで　突かれると
        岩石にも　穴が　開いてしまう。
      ko: |-
        진화하여 뒷다리만으로
        서게 되었다. 뿔에 찔리면
        암석에도 구멍이 뚫리고 만다.
      en: |-
        It begins walking on its hind legs after evolution.
        It can punch holes through boulders with its horn.
      fr: |-
        L’évolution a permis à ce Pokémon de marcher sur
        ses pattes arrière. Il peut facilement faire des trous
        dans les rochers en utilisant sa corne.
      de: |-
        Nach seiner Entwicklung geht es aufrecht auf
        seinen Hinterfüßen. Mit seinem Horn kann es
        Löcher in Felsen bohren.
      es: |-
        Cuando evoluciona, comienza a andar con las patas
        traseras. Es capaz de horadar rocas con el cuerno que
        tiene.
      it: |-
        Dopo l’evoluzione inizia a muoversi sulle zampe
        posteriori. Con il corno può perforare la roccia.
    omega-ruby:
      ja-Hrkt: |-
        ツノは　ダイヤモンドの　げんせきを　くだき
        しっぽの　いちげきは　ビルを　なぎたおす。
        かたい　ひふは　たいほうでも　キズつかない。
      ja: |-
        ツノは　ダイヤモンドの　原石を　砕き
        尻尾の　一撃は　ビルを　なぎ倒す。
        硬い　皮膚は　大砲でも　キズつかない。
      ko: |-
        뿔은 다이아몬드 원석을 부수고
        꼬리의 일격은 빌딩을 쓰러트린다.
        단단한 피부는 대포에도 상처 입지 않는다.
      en: |-
        Rhydon’s horn can crush even uncut diamonds. One sweeping
        blow of its tail can topple a building. This Pokémon’s hide is
        extremely tough. Even direct cannon hits don’t leave a scratch.
      fr: |-
        La corne de Rhinoféros peut même casser du diamant brut.
        Et avec un simple coup de queue, il peut détruire un bâtiment.
        La peau de ce Pokémon est incroyablement dure.
        Un boulet de canon ne lui ferait même pas une égratignure.
      de: |-
        Mit seinem Horn kann Rizeros selbst Diamanten zerbrechen.
        Ein einziger Hieb mit seinem Schweif kann ein Haus zum
        Einsturz bringen. Die Haut dieses Pokémon ist so hart,
        dass nicht einmal Kanonenkugeln Kratzer hinterlassen.
      es: |-
        Rhydon tiene un cuerno capaz de horadar hasta un diamante
        en bruto y con una sacudida de la cola puede derribar un
        edificio. La piel de este Pokémon es muy fuerte; ni los
        disparos de un cañón le arañarían.
      it: |-
        Il corno di Rhydon riesce a fracassare anche un diamante
        grezzo. Un colpo della sua coda abbatte un edificio.
        La pelle-armatura di questo Pokémon è così coriacea
        da essere immune anche alle cannonate.
    alpha-sapphire:
      ja-Hrkt: |-
        ドリルに　なる　ツノで　がんせきを　はかいする。
        マグマを　ふきださせてしまう　ことも　あるが
        よろいの　ような　ひふは　あつさを　かんじない。
      ja: |-
        ドリルに　なる　ツノで　岩石を　破壊する。
        マグマを　噴き出させてしまう　ことも　あるが
        よろいの　ような　皮膚は　熱さを　感じない。
      ko: |-
        드릴처럼 쓰는 뿔로 암석을 파괴한다.
        마그마가 뿜어져 나오기도 하지만
        갑옷 같은 피부는 뜨거움을 느끼지 않는다.
      en: |-
        Rhydon has a horn that serves as a drill. It is used for
        destroying rocks and boulders. This Pokémon occasionally
        rams into streams of magma, but the armor-like hide prevents
        it from feeling the heat.
      fr: |-
        La corne de Rhinoféros lui sert de foreuse. Il l’utilise pour
        détruire des rochers et des cailloux. Ce Pokémon charge
        de temps en temps dans du magma en fusion, mais sa peau
        blindée le protège de la chaleur.
      de: |-
        Rizeros hat ein Horn, das es als Bohrer benutzen kann.
        Damit zerstört es Felsblöcke und Steine. Dieses Pokémon
        rammt sein Horn manchmal in Ströme von Magma.
        Seine panzerähnliche Haut schützt es dabei vor der Hitze.
      es: |-
        Rhydon tiene un cuerno anillado que le sirve de taladro. Le
        resulta muy útil para horadar rocas y piedras. A veces, se
        queda atrapado en corrientes de magma, pero la tosca piel
        que tiene impide que sienta el calor.
      it: |-
        Rhydon è dotato di un corno che usa a mo’ di trapano.
        Serve a distruggere rocce e massi. Talvolta questo Pokémon
        s’imbatte in rivoli di magma, ma la sua pelle-armatura lo
        protegge dall’eccessivo calore.
    lets-go-pikachu:
      ja-Hrkt: |-
        うしろあしだけで　あるくようになり
        ちのうが　はったつした。よろいの
        ような　ひふは　マグマにも　たえる。
      ja: |-
        後ろ足だけで　歩くようになり
        知能が　発達した。鎧の
        ような　皮膚は　マグマにも　耐える。
      ko: |-
        뒷다리만으로 걸을 수 있게 되어
        지능이 발달했다. 갑옷 같은
        피부는 마그마에도 견딘다.
      zh-Hant: |-
        變得能夠只用後腳步行，
        智能也發達了許多。鎧甲般的
        皮膚足以抵擋熔岩的高溫。
      zh-Hans: |-
        可以只用后腿行走，智力也
        发达了许多。像盔甲一样的
        皮肤可以抵挡住岩浆。
      en: |-
        Its brain developed when it began walking on
        its hind legs. Its armor-like hide even repels
        molten lava.
      fr: |-
        L’évolution a permis à ce Pokémon de
        développer son intelligence et de se tenir
        debout. Son épiderme résiste à la lave.
      de: |-
        Es hat gelernt, auf seinen Hinterbeinen zu laufen
        und komplex zu denken. Seine Haut gleicht
        einer Rüstung und widersteht sogar heißer Lava.
      es: |-
        Pasar a ser bípedo le ha permitido desarrollar su
        inteligencia. La piel, rígida como una armadura,
        resiste incluso el magma.
      it: |-
        Ha imparato a camminare in posizione eretta
        e il suo cervello si è evoluto. La sua pelle simile
        a un’armatura può resistere anche al magma.
    lets-go-eevee:
      ja-Hrkt: |-
