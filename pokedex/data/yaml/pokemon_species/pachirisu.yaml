        자신이 좋아하는 나무열매와 함께
        나무줄기의 구멍에 숨긴다.
      en: |-
        It makes fur balls that crackle with static electricity.
        It stores them with berries in tree holes.
      fr: |-
        Il roule des boules de poils pleines d’électricité statique
        et les range dans des souches avec des Baies.
      de: |-
        Es bildet ein Fellknäuel, der vor statischer Energie knistert.
