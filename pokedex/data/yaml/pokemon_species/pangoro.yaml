    sun:
      ja-Hrkt: |-
        うでっぷしが　じまんで　ごうかい。
        ゴロンダの　トレーナーに　なりたいなら
        こぶしで　かたりあう　しかない。
      ja: |-
        腕っぷしが　自慢で　豪快。
        ゴロンダの　トレーナーに　なりたいなら
        拳で　語り合う　しかない。
      ko: |-
        완력이 자랑거리이며 호쾌하다.
        부란다의 트레이너가 되고 싶으면
        주먹으로 이야기하는 수밖에 없다.
      zh-Hant: |-
        以腕力為傲，個性豪邁。
        想要成為流氓熊貓的訓練家的話，
        只能用拳頭來和牠交心。
      zh-Hans: |-
        以腕力为傲，很豪迈。
        想要成为流氓熊猫的训练家的话，
        只能用拳头来和它磋商。
      en: |-
        It boasts superb physical strength. Those who
        wish to become Pangoro’s Trainer have no
        choice but to converse with their fists.
      fr: |-
        Ses gros bras sont sa plus grande fierté. Si vous
        voulez devenir un Dresseur de Pandarbare,
        il va falloir jouer des poings !
      de: |-
        Seine mächtigen Arme sind sehr imposant.
        Wer als Pandagro-Trainer Karriere machen will,
        muss wohl die Fäuste sprechen lassen!
      es: |-
        Su aspecto imponente rinde justicia a la fuerza
        de la que hace gala. Todo aspirante a entrenarlo
        deberá entender el lenguaje de los puños.
      it: |-
        Va molto fiero dell’enorme forza delle sue
        braccia. Gli Allenatori sono avvisati: la lingua
        che capisce meglio è quella dei pugni.
    moon:
      ja-Hrkt: |-
        たけの　はっぱの　ゆれで　てきの
        うごきを　よむ。　ケンカっぱやいが
        なかまへの　じょうは　あつい。
      ja: |-
        竹の　葉っぱの　揺れで　敵の
        動きを　読む。　ケンカっ早いが
        仲間への　情は　厚い。
      ko: |-
        대나무 잎의 움직임으로 적의
        행동을 읽는다. 싸움꾼이지만
        동료에 대한 정은 두텁다.
      zh-Hant: |-
        透過竹葉的擺動來洞悉
        敵人的動向。性格很粗暴，
        但是對夥伴的感情很深厚。
      zh-Hans: |-
        通过竹叶的摇摆来洞悉
        敌人的动向。很粗暴，
        但是对伙伴的感情很深厚。
      en: |-
        From the slight twitches of its bamboo leaf, it
        deduces its opponent’s movements. It’s eager to
        tussle but kindhearted toward its companions.
      fr: |-
        Il peut détecter les mouvements ennemis grâce
        aux vibrations de sa feuille. Avec ses amis,
        ce grand lunatique a en fait le cœur sur la main.
      de: |-
        Mit seinem Blatt erspürt es die Bewegungen
        des Gegners. Es ist sehr grob und streitlustig,
        hält aber stets zu seinen Artgenossen.
      es: |-
        Predice los movimientos del enemigo mediante
        su hoja. Pese a su carácter temperamental, se
        muestra muy afable con sus compañeros.
      it: |-
        È un attaccabrighe, ma è anche generoso con gli
        amici. Prevede i movimenti dei nemici dalle
        vibrazioni della foglia che tiene in bocca.
    ultra-sun:
      ja-Hrkt: |-
        うでっぷしが　じまんの　ワイルドな
        ポケモン。　ごうかいな　せいしつに
        ほれこむ　トレーナーも　おおい。
      ja: |-
        腕っ節が　自慢の　ワイルドな
        ポケモン。　豪快な　性質に
        惚れこむ　トレーナーも　多い。
      ko: |-
        완력을 뽐내는 와일드한
        포켓몬. 호쾌한 성질에
        반하는 트레이너도 많다.
      zh-Hant: |-
        以自己的腕力為傲，
        充滿野性的寶可夢。
        豪爽的性情令許多訓練家為之著迷。
      zh-Hans: |-
        以腕力为傲的野性的宝可梦。
        性格豪爽，
        因此迷恋它的训练家也很多。
      en: |-
        This rowdy Pokémon boasts great physical
        strength. Many Trainers are also smitten by its
        lively character.
      fr: |-
        Ce Pokémon féroce est très fier de ses gros
        bras. Beaucoup de Dresseurs l’apprécient
        pour son côté truculent.
      de: |-
        Ein ungezügeltes Pokémon, das mit seinen
        Fäusten ordentlich austeilen kann. Viele Trainer
        sind völlig vernarrt in sein energisches Wesen.
      es: |-
        Pokémon un tanto agresivo que se jacta de la
        fuerza de sus puños. A muchos Entrenadores
        les llama la atención su carácter atrevido.
      it: |-
        È aggressivo e va molto fiero della forza delle
        sue braccia. Molti Allenatori vanno matti per
        il suo carattere intrepido.
    ultra-moon:
      ja-Hrkt: |-
        こぶしで　かたる　タイプ。　ガタガタ
        いわず　ぶんなぐり　ダンプカーも
        ふっとばす　とっしんを　かます。
      ja: |-
        こぶしで　語る　タイプ。　ガタガタ
        いわず　ぶん殴り　ダンプカーも
        ふっ飛ばす　突進を　かます。
      ko: |-
        주먹으로 이야기하는 타입이다.
        긴말 없이 냅다 때려서
        덤프트럭도 날려버리는 돌진을 먹인다.
      zh-Hant: |-
        屬於用拳頭來說話的類型。
        會二話不說地揮拳痛毆，
        或使出連大卡車都能撞飛的猛撞。
      zh-Hans: |-
        是用拳头来说话的那一型。
        一句话也不说就猛殴，
        会使出连翻斗车都能击飞的猛撞。
      en: |-
        Pangoro is the type to talk with its fists. It
        doesn’t say much as it pummels opponents with
        enough force to send a dump truck flying.
      fr: |-
        Il est du genre à laisser ses poings parler :
        il martèle ses ennemis et charge avec assez
        de force pour envoyer voler un camion-benne.
      de: |-
        Ein Pokémon, das lieber die Fäuste sprechen
        lässt, als lange Reden zu schwingen. Selbst
        Kipplaster fliegen meterweit, wenn es sie rammt.
      es: |-
        Prefiere solucionar las disputas a mamporros.
        Puede embestir un camión y hacerlo volar por
        los aires a largas distancias sin despeinarse.
      it: |-
        Preferisce parlare la lingua dei pugni. Si lancia
        alla carica con un impeto tale da far prendere
        il volo a un autocarro.
    sword:
      ja-Hrkt: |-
        きしょうが　あらく　わんりょくで
        だまらせる。　タチフサグマとの
        いっきうちに　とうしを　もやす。
      ja: |-
        気性が　荒く　腕力で
        黙らせる。　タチフサグマとの
        一騎打ちに　闘志を　燃やす。
      ko: |-
        성질이 사나워서 완력으로 상대를
        조용하게 만든다. 가로막구리와의
        결투에 투지를 불태운다.
      zh-Hant: |-
        性情暴躁，靠力氣解決問題。
        為與堵攔熊一對一比拼
        而燃燒自己的鬥志。
      zh-Hans: |-
        性格暴躁，靠力气解决问题。
        为与堵拦熊一对一比拼
        而燃烧自己的斗志。
      en: |-
        This Pokémon is quick to anger, and it has no
        problem using its prodigious strength to get its
        way. It lives for duels against Obstagoon.
      fr: |-
        Ce Pokémon agressif a recours à la force
        pour faire taire ceux qui le contrarient.
        Il adore combattre les Ixon.
      de: |-
        Dieses aggressive Pokémon bringt Gegner mit
        seiner Muskelkraft zum Verstummen. Es liebt
        Kämpfe gegen Barrikadax.
      es: |-
        Este Pokémon de carácter agresivo lo soluciona
        todo a golpes. Desata su espíritu combativo al
        enfrentarse a los Obstagoon.
      it: |-
        Ha un’indole focosa e sistema ogni diatriba con
        la forza delle braccia. Il suo spirito combattivo
        arde quando lotta con Obstagoon.
    shield:
      ja-Hrkt: |-
        はっぱで　あいての　うごきを　よむ。
        おおがた　ダンプカーを　いちげきで
        スクラップにする　パンチを　もつ。
      ja: |-
        葉っぱで　相手の　動きを　読む。
        大型　ダンプカーを　一撃で
        スクラップにする　パンチを　もつ。
      ko: |-
        잎사귀로 상대의 움직임을 읽는다.
        대형 덤프트럭을 일격에 고철로
        만들어버리는 펀치를 가졌다.
      zh-Hant: |-
        透過葉子來洞悉敵人的動向。
        只要使出一記拳擊就能
        讓大型砂石車變成廢鐵。
      zh-Hans: |-
        通过叶子来洞悉敌人的动向。
        只要使出一记拳击就能
        让大型翻斗车变成废铁。
      en: |-
        Using its leaf, Pangoro can predict the moves of
        its opponents. It strikes with punches that can
        turn a dump truck into scrap with just one hit.
      fr: |-
        Il anticipe les mouvements de son adversaire
        grâce à sa feuille. Ses coups de poing peuvent
        réduire un camion-benne en un tas de ferraille.
      de: |-
        Mit seinem Blatt erspürt es die Bewegungen des
        Gegners. Seine Schläge sind so stark, dass es
        sogar Kipplaster zu Schrott verarbeiten kann.
      es: |-
        La hoja que lleva en la boca le permite predecir
        los movimientos del rival. Puede reducir un
        camión a chatarra de un solo puñetazo.
      it: |-
        Prevede i movimenti dei nemici dalle vibrazioni
        della foglia che tiene in bocca. Con un pugno
        può fare a pezzi un camion ribaltabile.
