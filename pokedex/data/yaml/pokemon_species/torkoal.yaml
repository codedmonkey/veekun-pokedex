torkoal:
  base_happiness: 50
  capture_rate: 90
  color: brown
  egg_groups:
    - ground
  evolution_chain: torkoal
  evolves_from: ~
  flavor_text:
    ruby:
      en: |-
        TORKOAL digs through mountains in
        search of coal. If it finds some, it fills
        hollow spaces on its shell with the coaland burns it.
        If it is attacked, this POKéMON spouts
        thick black smoke to beat a retreat.
    sapphire:
      en: |-
        TORKOAL generates energy by burning
        coal. It grows weaker as the fire
        dies down.When it is preparing for battle, this
        POKéMON burns more coal.
    emerald:
      en: |-
        It battles using energy it gets from
        burning coal. When loosing smoke from its
        nostrils, it lets off a sound that is
        similar to a locomotive’s horn.
    firered:
      en: |-
        It burns coal inside its shell. If it is
        attacked, it belches thick, black smoke
        and flees.
    leafgreen:
      en: |-
        It burns coal inside its shell. If it is
        attacked, it belches thick, black smoke
        and flees.
    diamond:
      en: |-
        It burns coal inside its shell for
        energy. It blows out black soot if
        it is endangered.
    pearl:
      en: |-
        It burns coal inside its shell for
        energy. It blows out black soot if
        it is endangered.
    platinum:
      en: |-
        It burns coal inside its shell for
        energy. It blows out black soot if
        it is endangered.
    heartgold:
      en: |-
        You find abandoned coal mines full
        of them. They dig tirelessly in
        search of coal.
    soulsilver:
      en: |-
        You find abandoned coal mines full
        of them. They dig tirelessly in
        search of coal.
    black:
      en: |-
        It burns coal inside its shell for
        energy. It blows out black soot if
        it is endangered.
      fr: |-
        Il tire son énergie du charbon qu’il
        brûle dans sa carapace et crache
        de la suie noire en cas de danger.
    white:
      en: |-
        It burns coal inside its shell for
        energy. It blows out black soot if
        it is endangered.
      fr: |-
        Il tire son énergie du charbon qu’il
        brûle dans sa carapace et crache
        de la suie noire en cas de danger.
    black-2:
      en: |-
        It burns coal inside its shell for
        energy. It blows out black soot if
        it is endangered.
    white-2:
      en: |-
        It burns coal inside its shell for
        energy. It blows out black soot if
        it is endangered.
    x:
      ja-Hrkt: |-
        つかわれなくなった　たんこうには
        たくさんの　コータスが　すみついて
        せきたんを　せっせと　ほっている。
      ja: |-
        使われなくなった　炭鉱には
        たくさんの　コータスが　住みついて
        石炭を　せっせと　掘っている。
      ko: |-
        사용할 수 없게 된 탄광에는
        많은 코터스가 살며
        석탄을 부지런히 캐고 있다.
      en: |-
        You find abandoned coal mines full of them.
        They dig tirelessly in search of coal.
      fr: |-
        Les Chartor vivent dans les mines abandonnées,
        où ils extraient le charbon avec ardeur.
      de: |-
        Große Gruppen Qurtel siedeln sich in stillgelegten
        Bergwerken an und graben dort emsig nach Kohle.
      es: |-
        Trabaja sin descanso en minas en desuso localizando
        y extrayendo carbón.
      it: |-
        I Torkoal eleggono a propria dimora miniere di carbone
        abbandonate e vi scavano carbone con ardore.
    'y':
      ja-Hrkt: |-
        こうらの　なかで　せきたんを　もやし
        エネルギーに　している。ピンチの
        ときは　くろい　ススを　ふきだす。
      ja: |-
        甲羅の　中で　石炭を　燃やし
        エネルギーに　している。ピンチの
        ときは　黒い　ススを　噴き出す。
      ko: |-
        등껍질 속에 석탄을 태워서
        에너지로 사용한다. 위급할
        때는 까만 그을음을 뿜어낸다.
      en: |-
        It burns coal inside its shell for energy. It blows out
        black soot if it is endangered.
      fr: |-
        Il tire son énergie du charbon qu’il brûle dans sa
        carapace et crache de la suie noire en cas de danger.
      de: |-
        In seinem Panzer verbrennt es Kohle und gewinnt
        daraus Energie. Bei Gefahr sondert es Ruß ab.
      es: |-
        Quema carbón en su caparazón para obtener energía.
        Si le atacan, echa un denso humo negro.
      it: |-
        Genera energia bruciando carbone all’interno della
        corazza. Se è in pericolo, emette fuliggine scura.
    omega-ruby:
      ja-Hrkt: |-
        やまを　ほって　せきたんを　みつけては　せっせと
        こうらの　くうどうに　いれて　もやす　ポケモン。
        おそわれると　くろい　けむりを　だして　にげる。
      ja: |-
        山を　掘って　石炭を　見つけては　せっせと
        甲羅の　空洞に　入れて　燃やす　ポケモン。
        襲われると　黒い　煙を　出して　逃げる。
      ko: |-
        산을 파서 석탄을 발견하면 부지런히
        등껍질의 빈 곳에 넣고 태우는 포켓몬이다.
        습격당하면 검은 연기를 내고 도망간다.
      en: |-
        Torkoal digs through mountains in search of coal. If it finds
        some, it fills hollow spaces on its shell with the coal and burns
        it. If it is attacked, this Pokémon spouts thick black smoke to
        beat a retreat.
      fr: |-
        Chartor fore les montagnes à la recherche de charbon.
        Lorsqu’il en trouve, il le met dans les emplacements creux
        de sa carapace pour le brûler. Quand il est attaqué,
        ce Pokémon crache une épaisse fumée noire pour s’enfuir.
      de: |-
        Qurtel schaufelt sich auf der Suche nach Kohle durch
        die Berge. Wenn es welche findet, füllt es die Hohlräume
        seines Panzers mit Kohle und verbrennt diese. Wenn es
        angegriffen wird, stößt es dicken schwarzen Rauch aus.
      es: |-
        Torkoal va cavando por las montañas en busca de carbón.
        Cuando lo encuentra, rellena los huecos que tiene dentro del
        caparazón y lo quema. Si le atacan, este Pokémon echa un
        humo negro que le permite la retirada.
      it: |-
        Torkoal scava in montagna in cerca di carbone. Quando
        lo trova, lo usa per riempire la cavità della propria corazza
        e poi lo brucia. In caso di aggressione, emette nubi di
        fumo nero per poi battere in ritirata.
    alpha-sapphire:
      ja-Hrkt: |-
        せきたんを　もやして　エネルギーを　つくりだす。
        ひの　いきおいが　よわまると　げんきが　なくなり
        たたかう　ときは　せきたんを　たくさん　もやす。
      ja: |-
        石炭を　燃やして　エネルギーを　つくりだす。
        火の　勢いが　弱まると　元気が　なくなり
        戦う　ときは　石炭を　沢山　燃やす。
      ko: |-
        석탄을 태워서 에너지를 만들어낸다.
        불의 기세가 약해지면 기운이 없어져
        싸울 때는 석탄을 많이 태운다.
      en: |-
        Torkoal generates energy by burning coal. It grows weaker
        as the fire dies down. When it is preparing for battle, this
        Pokémon burns more coal.
      fr: |-
        Chartor génère de l’énergie en brûlant du charbon.
        Il s’affaiblit lorsque le feu s’éteint. Lorsqu’il se prépare
        au combat, ce Pokémon brûle plus de charbon.
      de: |-
        Qurtel erzeugt Energie, indem es Kohle verbrennt. Wenn das
        Feuer nachlässt, wird es schwächer. In der Vorbereitung auf
        einen Kampf verbrennt dieses Pokémon mehr Kohle.
      es: |-
        Torkoal genera energía quemando carbón. A medida que se
        extingue el fuego, se va debilitando. Antes de entrar en
        combate, quema más carbón de lo habitual.
      it: |-
        Torkoal genera energia bruciando il carbone. Si indebolisce
        con l’affievolirsi del fuoco. In preparazione alle lotte
        il Pokémon brucia maggiori quantità di carbone.
    sun:
      ja-Hrkt: |-
        せきたんが　エネルギーの　みなもと。
        コータスの　すんでいる　やまには
        おおくの　せきたんが　ねむっている。
      ja: |-
        石炭が　エネルギーの　源。
        コータスの　棲んでいる　山には
        多くの　石炭が　眠っている。
      ko: |-
        석탄이 에너지의 근원이다.
        코터스가 사는 산에는
        많은 석탄이 잠들어 있다.
      zh-Hant: |-
        煤炭是牠的能量來源。
        在煤炭龜棲息著的山裡，
        沉睡著大量的煤炭。
      zh-Hans: |-
        煤炭是其能量的来源。
        在煤炭龟栖息着的山里，
        沉睡着大量的煤炭。
      en: |-
        Coal is the source of Torkoal’s energy. Large
        amounts of coal can be found in the mountains
        where they live.
      fr: |-
        Les Chartor peuplent les montagnes abritant
        de grands gisements de charbon, dont ils se
        servent comme source d’énergie.
      de: |-
        Kohle ist die Quelle seiner Energie. Ein Glück,
        dass in den von Qurtel bewohnten Bergen
        große Kohlevorkommen schlummern.
      es: |-
        La fuente de su energía es el carbón. Torkoal
        suele vivir en montañas donde yacen grandes
        cantidades de esta roca mineral.
      it: |-
        Genera energia bruciando carbone all’interno
        della corazza. Le montagne in cui vive sono
        ricche di questo materiale.
    moon:
      ja-Hrkt: |-
        こうらのなかの　ほのおが　きえると
        しんでしまう。　いえで　そだてるには
        つねに　もやすものが　いるぞ。
      ja: |-
        甲羅の中の　炎が　消えると
        死んでしまう。　家で　育てるには
        常に　燃やすものが　いるぞ。
      ko: |-
        등껍질 안의 불꽃이 꺼지면
        죽어버린다. 집에서 키우기 위해서는
        항상 태울 것이 필요하다.
      zh-Hant: |-
        如果甲殼中的火焰熄滅就會死亡。
        要在家裡培育的話，必須常備燃料。
      zh-Hans: |-
        如果甲壳中的火焰消失就会死亡。
        要在家里培育的话，必须常备燃料。
      en: |-
        If the fire burning within its shell goes out, it will
        die. Those who wish to raise one in their home
        must always keep something flammable at hand.
      fr: |-
        Si le feu brûlant sous sa carapace s’éteint,
        il meurt. Si vous le gardez à la maison, il y a
        toujours quelque chose qui flambe.
      de: |-
        Erlöschen die Flammen in seinem Panzer,
        stirbt es. Will man es bei sich zu Hause halten,
        braucht man daher stets brennbares Material.
      es: |-
        Si se extingue el fuego que arde en el interior de
        su caparazón, puede perecer. Si se cría en casa,
        no hay día que no queme algo accidentalmente.
      it: |-
        Se il fuoco che brucia dentro la sua corazza si
        estingue, le sue energie vitali si esauriscono.
        Se tenuto in casa, dà spesso fuoco agli oggetti.
    ultra-sun:
      ja-Hrkt: |-
        こうらから　ふきだす　けむりで
        たいちょうが　わかる。　いきおいが
        はげしいときは　げんきな　しょうこ。
      ja: |-
        甲羅から　噴きだす　煙で
        体調が　わかる。　勢いが
        激しいときは　元気な　証拠。
      ko: |-
        등껍질에서 내뿜는 연기로
        몸 상태를 알 수 있다. 기세가
        격렬할 때는 건강하다는 증거다.
      zh-Hant: |-
        從甲殼噴出的煙可以看出牠的
        身體狀況。煙噴得很激烈時，
        代表牠很有精神。
      zh-Hans: |-
        通过甲壳里喷出的烟
        就能了解它的身体状况。
        势头很旺时，说明很有精神。
      en: |-
        You can tell how it’s feeling by the smoke
        spouting from its shell. Tremendous velocity
        is a sign of good health.
      fr: |-
        Un bon indicateur de sa santé est le débit
        de la fumée qui s’échappe de sa carapace :
        s’il est important, c’est qu’il est en pleine forme.
      de: |-
        Am Rauch, den es aus seinem Panzer ausstößt,
        erkennt man seine Verfassung. Stößt es diesen
        kraftvoll aus, geht es ihm gut.
      es: |-
        El humo que expulsa por el dorso es indicativo
        de su estado de salud. Si las fumarolas brotan
        con fuerza, significa que está en plena forma.
      it: |-
        Il fumo che fuoriesce dalla sua corazza permette
        di capire il suo stato di salute. Quando i getti
        sono vigorosi, significa che sta bene.
    ultra-moon:
      ja-Hrkt: |-
        せきたんを　もやして　エネルギーを
        つくる。　せきたんが　もえつきると
        みうごきが　とれなくなってしまう。
      ja: |-
        石炭を　燃やして　エネルギーを
        作る。　石炭が　燃え尽きると
        身動きが　とれなくなってしまう。
      ko: |-
        석탄을 태워서 에너지를
        만든다. 석탄이 다 타 버리면
        움직이지 못하게 된다.
      zh-Hant: |-
        會燃燒煤炭來製造能量。
        如果煤炭燒光了，
        身體就會變得無法動彈。
      zh-Hans: |-
        燃烧煤炭，制作能量。
        如果煤炭烧尽，
        身体就会变得无法动弹。
      en: |-
        It burns coal to produce energy. When it has
        burned through all of its coal, it becomes unable
        to move.
      fr: |-
        Il tire son énergie du charbon qu’il fait brûler.
        Une fois qu’il a tout consommé, il ne peut plus
        bouger.
      de: |-
        Es erzeugt Energie, indem es Kohle verbrennt.
        Wenn diese vollständig verbrannt ist, kann es
        sich nicht mehr bewegen.
      es: |-
        Genera su energía quemando carbón y, una vez
        que lo ha consumido por completo, ya no puede
        moverse.
      it: |-
        Genera energia bruciando carbone e quando lo
        esaurisce non riesce più a muoversi.
    sword:
      ja-Hrkt: |-
        こうらの　なかで　せきたんを　もやし
        エネルギーに　している。　ピンチの
        ときは　くろい　ススを　ふきだす。
      ja: |-
        甲羅の　中で　石炭を　燃やし
        エネルギーに　している。　ピンチの
        ときは　黒い　ススを　噴き出す。
      ko: |-
        등껍질 속에 석탄을 태워서
        에너지로 사용한다. 위급할
        때는 까만 매연을 뿜어낸다.
      zh-Hant: |-
        會在甲殼中燃燒煤炭
        產生能量。遇到危機時
        會噴出黑色的煤煙。
      zh-Hans: |-
        会在甲壳中燃烧煤炭产生能量。
        危急关头会喷出黑色的煤烟。
      en: |-
        It burns coal inside its shell for energy. It blows
        out black soot if it is endangered.
      fr: |-
        Il tire son énergie du charbon qu’il brûle
        dans sa carapace, et crache de la suie noire
        en cas de danger.
      de: |-
        In seinem Panzer verbrennt es Kohle und gewinnt
        daraus Energie. Bei Gefahr sondert es Ruß ab.
      es: |-
        Quema carbón en su caparazón para obtener
        energía. Si se ve amenazado, despide un hollín
        negro.
      it: |-
        Genera energia bruciando carbone all’interno
        della corazza. Se è in pericolo, emette fuliggine
        scura.
    shield:
      ja-Hrkt: |-
        つかわれなくなった　たんこうには
        たくさんの　コータスが　すみついて
        せきたんを　せっせと　ほっている。
      ja: |-
        使われなくなった　炭鉱には
        たくさんの　コータスが　棲みついて
        石炭を　せっせと　掘っている。
      ko: |-
        사용할 수 없게 된 탄광에는
        많은 코터스가 살며
        석탄을 부지런히 캐고 있다.
      zh-Hant: |-
        在廢棄不用的煤礦坑中
        住著許多的煤炭龜。
        牠們會不停地挖掘煤炭。
      zh-Hans: |-
        在弃用的煤矿中
        住着很多煤炭龟，
        它们会不停地挖掘煤炭。
      en: |-
        You find abandoned coal mines full of them.
        They dig tirelessly in search of coal.
      fr: |-
        Les Chartor vivent en grand nombre dans
        les mines abandonnées, où ils extraient
        le charbon avec ardeur.
      de: |-
        Große Gruppen von Qurtel siedeln sich in
        stillgelegten Bergwerken an und graben dort
        emsig nach Kohle.
      es: |-
        Se junta con numerosos congéneres para
        establecer su morada en minas abandonadas,
        donde se afanan en localizar y extraer carbón.
      it: |-
        Elegge a propria dimora miniere abbandonate,
        dove cerca carbone scavando con ardore.
