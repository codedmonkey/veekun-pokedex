xurkitree:
  base_happiness: 0
  capture_rate: 45
  color: black
  egg_groups:
    - no-eggs
  evolution_chain: xurkitree
  evolves_from: ~
  flavor_text:
    sun:
      ja-Hrkt: |-
        ぜんしんから　すさまじい　でんげきを
        ほとばしらせる　こうけいを　もくげき。
        なぞの　せいぶつ　ＵＢの　いっしゅだ。
      ja: |-
        全身から　凄まじい　電撃を
        ほとばしらせる　光景を　目撃。
        謎の　生物　ＵＢの　一種だ。
      ko: |-
        온몸에서 엄청난 전격을
        내뿜는 광경이 목격되었다.
        수수께끼의 생물 UB 중 하나다.
      zh-Hant: |-
        有人目擊到牠全身噴湧出
        駭人電流的情景。
        是神秘生物ＵＢ的一種。
      zh-Hans: |-
        被目击到了从全身喷涌出
        骇人电击的光景。
        谜一般的生物究极异兽的一种。
      en: |-
        One of the mysterious life-forms known as Ultra
        Beasts. Astonishing electric shocks emanate
        from its entire body, according to witnesses.
      fr: |-
        L’une des mystérieuses Ultra-Chimères.
        On l’aurait vue émettre une formidable quantité
        d’électricité autour d’elle.
      de: |-
        Eine geheimnisvolle Ultrabestie, aus deren
        Körper furchterregende Mengen an elektrischer
        Energie strömen.
      es: |-
        Un Ultraente rodeado de misterio. Se dice que
        su cuerpo desprende descargas eléctricas de
        inmensa potencia.
      it: |-
        Una delle misteriose Ultracreature.
        È stata vista sprigionare scariche elettriche
        terrificanti da tutto il corpo.
    moon:
      ja-Hrkt: |-
        ウルトラホールから　しゅつげんした。
        はつでんしょを　しゅうげき　したため
        でんきが　エネルギーと　おもわれる。
      ja: |-
        ウルトラホールから　出現した。
        発電所を　襲撃　したため
        電気が　エネルギーと　おもわれる。
      ko: |-
        울트라홀에서 출현했다.
        발전소를 습격한 것으로 보아
        전기가 에너지원인 것으로 여겨진다.
      zh-Hant: |-
        從究極之洞出現。
        因為襲擊了發電廠，
        被認為電力就是牠的能量。
      zh-Hans: |-
        从究极之洞出现。
        因为袭击了发电厂，
        所以被认为电力就是它的能量。
      en: |-
        It appeared from the Ultra Wormhole. It raided a
        power plant, so people think it energizes itself
        with electricity.
      fr: |-
        Une créature échappée de l’Ultra-Brèche.
        Elle a attaqué une centrale électrique, aussi
        suppose-t-on qu’elle se nourrit d’électricité.
      de: |-
        Es ist durch die Ultrapforte erschienen. Seine
        Überfälle auf Kraftwerke lassen vermuten,
        dass es seine Lebensenergie aus Strom bezieht.
      es: |-
        Este Ultraente surgió de un Ultraumbral. Se cree
        que la electricidad es su fuente de energía, ya
        que una vez asaltó una central eléctrica.
      it: |-
        Arrivato attraverso un Ultravarco, si ritiene che
        la sua fonte primaria di energia sia l’elettricità
        dato che ha attaccato una centrale elettrica.
    ultra-sun:
      ja-Hrkt: |-
        このせかいでは　いしつで　きけんだが
        ほんらい　すんでいる　せかいでは
        ふつうに　みかける　せいぶつらしい。
      ja: |-
        この世界では　異質で　危険だが
        本来　棲んでいる　世界では
        普通に　見かける　生物らしい。
      ko: |-
        이 세계와는 성질이 다르고
        위험하지만 원래 살던 세계에서는
        흔히 볼 수 있는 생물인 듯하다.
      zh-Hant: |-
        在這個世界是危險的異類，
        但在原本棲息的世界裡，
        牠似乎是常見的普通生物。
      zh-Hans: |-
        在这个世界是异类，很危险，
        但在它原本栖息的世界，
        好像只是寻常能见的生物。
      en: |-
        Although it’s alien to this world and a danger
        here, it’s apparently a common organism in the
        world where it normally lives.
      fr: |-
        Cette créature venue d’ailleurs est dangereuse
        dans notre monde, mais il semblerait qu’elle soit
        très commune dans le sien.
      de: |-
        In dieser Welt wirkt sein Aussehen gefährlich
        und fremdartig, doch in seiner ursprünglichen
        Welt ist es ein ganz gewöhnliches Lebewesen.
      es: |-
        Para los seres de este mundo resulta extraño
        y peligroso, pero en el mundo del que procede
        es una criatura muy común.
      it: |-
        Nel nostro mondo il suo aspetto appare strano
        e minaccioso, ma sembra che in quello da cui
        proviene sia una creatura molto comune.
    ultra-moon:
      ja-Hrkt: |-
        ウルトラビーストと　よばれる。
        じゅもくのように　じめんに　てあしを
        さしたまま　うごかないもの　もいる。
      ja: |-
        ウルトラビーストと　呼ばれる。
        樹木のように　地面に　手足を
        刺したまま　動かないもの　もいる。
      ko: |-
        울트라비스트라고 불린다.
        나무처럼 땅에 손발을 꽂고
        움직이지 않는 것도 있다.
      zh-Hant: |-
        被稱為究極異獸。
        也有一些會像樹木一樣，
        把手腳刺進地面動也不動。
      zh-Hans: |-
        被称为究极异兽。
        也有像树木一样将手脚
        插入地面后一动不动的。
      en: |-
        They’ve been dubbed Ultra Beasts. Some of
        them stand unmoving, like trees, with their
        arms and legs stuck into the ground.
      fr: |-
        Certains spécimens de ce type d’Ultra-Chimère
        plantent leurs membres dans le sol à la manière
        d’un arbre et restent immobiles.
      de: |-
        Eine der sogenannten Ultrabestien. Es gibt auch
        Exemplare, die ihre Gliedmaßen in den Boden
        rammen und regungslos wie Bäume verharren.
      es: |-
        Uno de los llamados Ultraentes. Algunos
        ejemplares plantan sus extremidades en el suelo
        como si fueran árboles y permanecen inmóviles.
      it: |-
        Una delle cosiddette Ultracreature. Alcuni
        esemplari se ne stanno immobili con braccia
        e gambe piantate nel terreno come alberi.
