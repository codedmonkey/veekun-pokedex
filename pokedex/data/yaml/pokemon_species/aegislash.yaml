aegislash:
  base_happiness: 50
  capture_rate: 45
  color: brown
  egg_groups:
    - mineral
  evolution_chain: honedge
  evolves_from: doublade
  flavor_text:
    x:
      ja-Hrkt: |-
        れきだいの　おうが　つれていた。
        れいりょくで　ひとや　ポケモンの
        こころを　あやつり　したがわせる。
      ja: |-
        歴代の　王が　連れていた。
        霊力で　人や　ポケモンの
        心を　操り　従わせる。
      ko: |-
        역대 왕들이 데리고 있었다.
        영험한 힘으로 사람이나 포켓몬의
        마음을 조종하여 복종하게 한다.
      en: |-
        Generations of kings were attended by these
        Pokémon, which used their spectral power to
        manipulate and control people and Pokémon.
      fr: |-
        Ils ont fait le bonheur de générations de rois.
        Leurs pouvoirs psychiques leur permettent de
        contrôler hommes et Pokémon.
      de: |-
        Generationen von Königen hatten dieses Pokémon
        an ihrer Seite. Mit seiner mysteriösen Kraft kann es
        Menschen und Pokémon gleichermaßen kontrollieren.
      es: |-
        Han permanecido junto a estirpes de reyes durante
        generaciones. Mediante su poder espectral pueden
        controlar a humanos y a Pokémon.
      it: |-
        Ha accompagnato generazioni di re. È in grado di
        controllare e manipolare esseri umani e Pokémon col
        suo potere spettrale.
    'y':
      ja-Hrkt: |-
        おうの　そしつを　もつ　にんげんを
        みぬくらしい。みとめられた　ひとは
        やがて　おうになると　いわれている。
      ja: |-
        王の　素質を　持つ　人間を
        見抜くらしい。認められた　人は
        やがて　王になると　言われている。
      ko: |-
        왕의 기질을 가진 인간을
        간파하는 듯하다. 인정받은 자는
        이윽고 왕이 된다고 한다.
      en: |-
        Apparently, it can detect the innate qualities
        of leadership. According to legend, whoever it
        recognizes is destined to become king.
      fr: |-
        Il peut déceler les qualités régaliennes dans les âmes
        humaines. On raconte que celui ou celle qui obtient
        sa faveur deviendra à coup sûr roi ou reine.
      de: |-
        Angeblich erkennt es jene Menschen, die Potenzial
        zum Herrscher haben. Es heißt, von ihm anerkannte
        Personen seien bald darauf Könige geworden.
      es: |-
        Al parecer, puede intuir si un humano tiene madera
        de rey. Según se dice, las personas que obtuvieron
        su reconocimiento acabaron siendo reyes.
      it: |-
        Si dice che sia in grado di riconoscere chi possiede le
        qualità per diventare re e che le persone da lui
        indicate siano effettivamente destinate al trono.
    omega-ruby:
      ja-Hrkt: |-
        れきだいの　おうが　つれていた。
        れいりょくで　ひとや　ポケモンの
        こころを　あやつり　したがわせる。
      ja: |-
        歴代の　王が　連れていた。
        霊力で　人や　ポケモンの
        心を　操り　従わせる。
      ko: |-
        역대 왕들이 데리고 있었다.
        영험한 힘으로 사람이나 포켓몬의
        마음을 조종하여 복종하게 한다.
      en: |-
        Generations of kings were attended by these
        Pokémon, which used their spectral power to
        manipulate and control people and Pokémon.
      fr: |-
        Ils ont fait le bonheur de générations de rois. Leurs pouvoirs
        psychiques leur permettent de contrôler hommes et Pokémon.
      de: |-
        Generationen von Königen hatten dieses Pokémon an ihrer
        Seite. Mit seiner mysteriösen Kraft kann es Menschen und
        Pokémon gleichermaßen kontrollieren.
      es: |-
        Han permanecido junto a estirpes de reyes durante
        generaciones. Mediante su poder espectral pueden controlar
        a humanos y a Pokémon.
      it: |-
        Ha accompagnato generazioni di re. È in grado di controllare
        e manipolare esseri umani e Pokémon col suo potere spettrale.
    alpha-sapphire:
      ja-Hrkt: |-
        おうの　そしつを　もつ　にんげんを
        みぬくらしい。みとめられた　ひとは
        やがて　おうになると　いわれている。
      ja: |-
        王の　素質を　持つ　人間を
        見抜くらしい。認められた　人は
        やがて　王になると　言われている。
      ko: |-
        왕의 기질을 가진 인간을
        간파하는 듯하다. 인정받은 자는
        이윽고 왕이 된다고 한다.
      en: |-
        Apparently, it can detect the innate qualities
        of leadership. According to legend, whoever it
        recognizes is destined to become king.
      fr: |-
        Il peut déceler les qualités régaliennes dans les âmes
        humaines. On raconte que celui ou celle qui obtient
        sa faveur deviendra à coup sûr roi ou reine.
      de: |-
        Angeblich erkennt es jene Menschen, die Potenzial zum
        Herrscher haben. Es heißt, von ihm anerkannte Personen
        seien bald darauf Könige geworden.
      es: |-
        Al parecer, puede intuir si un humano tiene madera de rey.
        Según se dice, las personas que obtuvieron su reconocimiento
        acabaron siendo reyes.
      it: |-
        Si dice che sia in grado di riconoscere chi possiede le
        qualità per diventare re e che le persone da lui indicate
        siano effettivamente destinate al trono.
    sword:
      ja-Hrkt: |-
        はがねの　からだと　れいりょくの
        バリアで　あらゆる　こうげきを
        よわめる　ぼうぎょの　たいせい。
      ja: |-
        鋼の　体と　霊力の
        バリアで　あらゆる　攻撃を
        弱める　防御の　体勢。
      ko: |-
        강철로 된 몸과 영험한 힘을 가진
        배리어로 모든 공격을
        약하게 만드는 방어적인 태세.
      zh-Hant: |-
        處於防禦狀態時，
        會用鋼之身體和靈力的屏障
        來減弱一切的攻擊。
      zh-Hans: |-
        处于防御状态时，
        会用钢之身体和灵力的屏障
        来减弱一切的攻击。
      en: |-
        In this defensive stance, Aegislash uses its steel
        body and a force field of spectral power to
        reduce the damage of any attack.
      fr: |-
        Grâce à son corps en acier et à sa barrière
        psychique, il peut se défendre en affaiblissant
        toutes sortes d’attaques.
      de: |-
        Mit seinem stählernen Körper und der Barriere,
        die es durch eine mysteriöse Kraft erzeugt,
        vermag es jegliche Angriffe abzuschwächen.
      es: |-
        Gracias a su cuerpo de acero y a una barrera de
        poder espectral, crea una defensa que le permite
        mitigar prácticamente cualquier ataque.
      it: |-
        Con il suo corpo metallico e la sua barriera
        psichica può opporre una difesa in grado di
        indebolire qualsiasi tipo di attacco.
    shield:
      ja-Hrkt: |-
        きょうりょくな　れいりょくで　ひとや
        ポケモンを　あやつり　ギルガルドに
        つごうの　よい　くにを　つくらせた。
      ja: |-
        強力な　霊力で　人や
        ポケモンを　操り　ギルガルドに
        都合の　良い　国を　つくらせた。
      ko: |-
        강력한 영력으로 사람과
        포켓몬을 조종해 킬가르도의
        입맛에 맞는 나라를 만들게 했다.
      zh-Hant: |-
        堅盾劍怪曾經用強大的靈力
        控制人和寶可夢，建立了
        適合自己生活的國家。
      zh-Hans: |-
        坚盾剑怪曾经用强大的灵力
        控制人和宝可梦，建立了
        适合自己生活的国家。
      en: |-
        Its potent spectral powers allow it to manipulate
        others. It once used its powers to force people
        and Pokémon to build a kingdom to its liking.
      fr: |-
        Grâce à ses puissants pouvoirs spirituels,
        il a contrôlé des humains et des Pokémon
        pour créer un pays conforme à ses idéaux.
      de: |-
        Mithilfe seiner mysteriösen Kräfte kontrollierte es
        Menschen und Pokémon und ließ sie ein Land
        nach seinen Vorstellungen erschaffen.
      es: |-
        Mediante el control ejercido con su inmenso
        poder espectral, logró que humanos y Pokémon
        le forjaran un país a medida de sus necesidades.
      it: |-
        Ha manipolato il pensiero di esseri umani e
        Pokémon con il suo potere spettrale facendogli
        costruire un paese adatto alle sue esigenze.
  form_description:
    en: "Forms have different stats.  If Aegislash's ability is []{ability:stance-change}, it changes to Blade Forme before using a damaging move, and reverts to Shield Forme before using King's Shield or upon leaving the field."
