noibat:
  base_happiness: 50
  capture_rate: 190
  color: purple
  egg_groups:
    - flying
    - dragon
  evolution_chain: noibat
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        まっくらな　どうくつで　くらす。
        ２０まんヘルツの　ちょうおんぱを
        おおきな　みみから　はっしゃする。
      ja: |-
        真っ暗な　洞窟で　暮らす。
        ２０万ヘルツの　超音波を
        大きな　耳から　発射する。
      ko: |-
        캄캄한 동굴에서 산다.
        20만Hz의 초음파를
        커다란 귀에서 발사한다.
      en: |-
        They live in pitch-black caves. Their enormous ears
        can emit ultrasonic waves of 200,000 hertz.
      fr: |-
        Il apprécie les grottes les plus sombres.
        Ses grandes oreilles lui permettent de générer
        des ultrasons d’une fréquence de 200 000 Hz.
      de: |-
        Es lebt im Inneren pechschwarzer Höhlen.
        Seine riesigen Ohren setzen Ultraschallwellen
        von 200 000 Hz frei.
      es: |-
        Habita en cuevas donde reina la más absoluta
        oscuridad y emite ondas ultrasónicas de
        200 000 Hz a través de sus enormes orejas.
      it: |-
        Vive in caverne completamente buie. Emette onde
        ultrasoniche alla frequenza di 200.000 Hz dalle
        grandi orecchie.
    'y':
      ja-Hrkt: |-
        ２０まんヘルツの　ちょうおんぱを
        あびると　くっきょうな　レスラーも
        めが　まわり　たっていられないのだ。
      ja: |-
        ２０万ヘルツの　超音波を　浴びると
        屈強な　レスラーも　目が　回り
        立っていられないのだ。
      ko: |-
        20만Hz의 초음파를 받으면
        막강한 레슬러도 현기증이 나
        서 있을 수 없다.
      en: |-
        Even a robust wrestler will become
        dizzy and unable to stand when exposed
        to its 200,000-hertz ultrasonic waves.
      fr: |-
        Les ultrasons à 200 000 Hz qu’il émet suffiraient
        à rendre groggy le plus chevronné des lutteurs.
      de: |-
        Selbst ein gestandener Ringer geht bei den
        200 000 Hz hohen Ultraschallwellen dieses
        Pokémon unweigerlich in die Knie.
      es: |-
        Ni el más recio de los luchadores profesionales
        sería capaz de aguantar sus ondas ultrasónicas de
        200 000 Hz sin marearse e hincar la rodilla.
      it: |-
        Questo Pokémon emette ultrasuoni a 200.000 Hz
        in grado di stordire e stendere anche un lottatore
        professionista.
    omega-ruby:
      ja-Hrkt: |-
        まっくらな　どうくつで　くらす。
