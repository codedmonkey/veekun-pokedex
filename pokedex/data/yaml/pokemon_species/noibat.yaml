    ultra-sun:
      ja-Hrkt: |-
        こうぶつは　くだもの。　ちょうおんぱを
        あてて　よく　じゅくした　ものだけを
        えらびだして　くらう　グルメなのだ。
      ja: |-
        好物は　果物。　超音波を
        あてて　よく　熟した　ものだけを
        選び出して　食らう　グルメなのだ。
      ko: |-
        과일을 좋아한다. 초음파를
        이용해서 잘 익은 것만
        골라내 먹는 미식가다.
      zh-Hant: |-
        喜歡吃水果。是個美食家，
        會對水果發射超音波，
        從中挑選出成熟的果實來吃。
      zh-Hans: |-
        喜欢吃水果。会用超音波击中水果，
        然后只挑选出已成熟的来食用，
        是个美食家。
      en: |-
        Fruits are its favorite foods. This gourmet
        carefully picks out just the ripe ones using
        its sonar.
      fr: |-
        Il adore les fruits et, en véritable gourmet, il ne
        mange que ceux qui sont bien mûrs. Il utilise ses
        ultrasons pour déterminer le degré de maturité.
      de: |-
        Es liebt Obst. Als Feinschmecker sortiert es
        jedoch unreife Früchte mit Ultraschallwellen aus
        und verleibt sich nur reifes Obst ein.
      es: |-
        Le encanta la fruta, pero es tan selecto que
        emite ondas ultrasónicas para detectar cuáles
        están maduras y el resto lo descarta.
      it: |-
        Adora la frutta. Ha gusti raffinati e usa gli
        ultrasuoni per individuare i frutti maturi al punto
        giusto, ignorando gli altri.
    ultra-moon:
      ja-Hrkt: |-
        エサと　なる　くだものを　さがして
        とびまわる。　じゅくして　いるかを
        ちょうおんぱで　はんべつ　できるぞ。
      ja: |-
        エサと　なる　果物を　探して
        飛びまわる。　熟して　いるかを
        超音波で　判別　できるぞ。
      ko: |-
        먹이인 과일을 찾아
        날아다닌다. 익은 정도를
        초음파로 판별할 수 있다.
      zh-Hant: |-
        為了尋找能當食物的水果
        而四處飛翔。能用超音波
        判斷水果是否已成熟。
      zh-Hans: |-
        寻找作为食物的水果，四处飞翔。
        能用超音波判断水果熟了没有。
      en: |-
        It flies around in search of fruit to eat. It uses
        ultrasonic waves to detect which fruits are ripe.
      fr: |-
        Il vole à la recherche de fruits à manger.
        Il peut déterminer si un fruit est mûr ou non
        grâce à ses ultrasons.
      de: |-
        Es sucht die Gegend im Flug nach Obst ab, das
        seine Nahrung darstellt. Mit Ultraschallwellen
        kann es genau erkennen, welches Obst reif ist.
      es: |-
        Revolotea en busca de fruta, su principal fuente
        de sustento. Con las ondas ultrasónicas que
        emite puede determinar cuáles están maduras.
      it: |-
        Vola alla ricerca di frutti di cui cibarsi.
        È in grado di determinare se sono maturi grazie
        agli ultrasuoni che emette.
    sword:
      ja-Hrkt: |-
        ひが　くれると　すみかの　どうくつを
        はなれて　とびまわり　かんじゅくの
        くだものを　ちょうおんぱで　さがす。
      ja: |-
        日が　暮れると　すみかの　洞窟を
        離れて　飛びまわり　完熟の
        果物を　超音波で　探す。
      ko: |-
        해가 지면 둥지인 동굴을
        나와 날아다니며 잘 익은
        과일을 초음파로 찾는다.
      zh-Hant: |-
        每到太陽下山時，
        牠便會離開居住的洞窟四處飛行，
        用超音波尋找熟透的果實。
      zh-Hans: |-
        到了太阳落山时，
        它便会离开居住的洞窟四处飞行，
        用超音波寻找熟透的果实。
      en: |-
        After nightfall, they emerge from the caves they
        nest in during the day. Using their ultrasonic
        waves, they go on the hunt for ripened fruit.
      fr: |-
        À la tombée de la nuit, il quitte la grotte
        où il réside et s’envole à la recherche de fruits
        mûrs avec ses ultrasons.
      de: |-
        Bei Sonnenuntergang verlässt es seine Höhle und
        geht mithilfe von Ultraschallwellen auf die Suche
        nach reifem Obst.
      es: |-
        Al caer la noche, abandona su cueva y revolotea
        en busca de fruta madura, que localiza mediante
        ondas ultrasónicas.
      it: |-
        La sera esce dalla grotta in cui vive e vola
        in cerca di frutti maturi, che individua grazie
        agli ultrasuoni.
    shield:
      ja-Hrkt: |-
        あらゆる　しゅうはすうの　おんぱを
        あやつる。　ちょうおんぱを　あびると
        きょたいの　ポケモンも　たまらない。
      ja: |-
        あらゆる　周波数の　音波を
        操る。　超音波を　浴びると
        巨体の　ポケモンも　たまらない。
      ko: |-
        온갖 주파수의 음파를 조종한다.
        초음파를 맞으면 거대한 몸집의
        포켓몬도 견디지 못한다.
      zh-Hant: |-
        可以控制所有頻率的音波。
        就算是體型巨大的寶可夢，
        也對牠的超音波束手無策。
      zh-Hans: |-
        可以控制所有频率的音波。
        就算是体型巨大的宝可梦，
        也对它的超音波束手无策。
      en: |-
        No wavelength of sound is beyond Noibat’s
        ability to produce. The ultrasonic waves it
        generates can overcome much larger Pokémon.
      fr: |-
        Il peut contrôler des ondes à n’importe quelle
        fréquence du spectre. Même les plus grands
        Pokémon ne peuvent supporter ses ultrasons.
      de: |-
        Es kann Schallwellen verschiedenster Frequenzen
        freisetzen. Selbst große Pokémon können seinem
        Beschuss mit Ultraschallwellen nicht standhalten.
      es: |-
        Su registro vocal cubre todo el espectro de
        frecuencias. Ni los Pokémon más grandes
        soportan las ondas ultrasónicas que emite.
      it: |-
        Controlla onde sonore di qualsiasi frequenza.
        Nemmeno i Pokémon più grandi riescono a
        sopportare i suoi ultrasuoni.
