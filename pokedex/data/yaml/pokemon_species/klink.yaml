klink:
  base_happiness: 50
  capture_rate: 130
  color: gray
  egg_groups:
    - mineral
  evolution_chain: klink
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        The two minigears that mesh together
        are predetermined. Each will rebound
        from other minigears without meshing.
      fr: |-
        La compatibilité entre ses deux rouages
        est prédéterminée. Ceux-ci ne se
        fixeront à aucun autre.
    white:
      en: |-
        Interlocking two bodies and
        spinning around generates
        the energy they need to live.
      fr: |-
        Le mouvement de ses deux corps
        enchâssés produit l’énergie qui
        lui est nécessaire pour vivre.
    black-2:
      en: |-
        Two bodies comprise a fixed pair.
        They spin around each other
        to generate energy.
    white-2:
      en: |-
        Two bodies comprise a fixed pair.
        They spin around each other
        to generate energy.
    x:
      ja-Hrkt: |-
        ２つの　からだが　かみあい
        かいてんすることで　いきるための
        エネルギーを　つくりだしている。
      ja: |-
        ２つの　体が　かみ合い
        回転することで　生きるための
        エネルギーを　作り出している。
      ko: |-
        두 개의 몸을 맞물려
        회전시켜서 살아가기 위한
        에너지를 만들고 있다.
      en: |-
        Interlocking two bodies and spinning around
        generates the energy they need to live.
      fr: |-
        Le mouvement de ses deux corps enchâssés produit
        l’énergie qui lui est nécessaire pour vivre.
      de: |-
        Es gewinnt lebenswichtige Energie, indem es seine
        zwei Einzelteile ineinander verzahnt und rotieren lässt.
      es: |-
        Genera la energía vital que necesita haciendo girar sus
        dos cuerpos.
      it: |-
        Produce l’energia che gli serve per vivere incastrando
        e facendo ruotare le due parti che lo compongono.
    'y':
      ja-Hrkt: |-
        ２つの　からだは　くみあわせが
        きまっている。べつの　からだとは
        かみあわずに　はなれてしまう。
      ja: |-
        ２つの　体は　組み合わせが
        決まっている。別の　体とは
        かみ合わずに　離れてしまう。
      ko: |-
        두 개의 몸은 그 조합 방법이
        정해져 있다. 다른 몸과는
        맞물리지 않고 떨어져 버린다.
      en: |-
        The two minigears that mesh together are
        predetermined. Each will rebound from other
        minigears without meshing.
      fr: |-
        La compatibilité entre ses deux rouages est
        prédéterminée. Ceux-ci ne se fixeront à aucun autre.
      de: |-
        Seine zwei Teile greifen ineinander wie ein Uhrwerk.
        Jedes andere Objekt, das man mit ihm kombinieren
        will, wird abgestoßen.
      es: |-
        La combinación de sus dos cuerpos es
        predeterminada. Si no se corresponde con
        su homólogo, se separa.
      it: |-
        I due ingranaggi che lo compongono combaciano
        unicamente l’uno con l’altro. Qualsiasi altro incastro
        è impossibile.
    omega-ruby:
      ja-Hrkt: |-
        ２つの　からだが　かみあい
        かいてんすることで　いきるための
        エネルギーを　つくりだしている。
      ja: |-
        ２つの　体が　かみ合い
        回転することで　生きるための
        エネルギーを　作り出している。
      ko: |-
        두 개의 몸을 맞물려
        회전시켜서 살아가기 위한
        에너지를 만들고 있다.
      en: |-
        Interlocking two bodies and spinning around
        generates the energy they need to live.
      fr: |-
        Le mouvement de ses deux corps enchâssés produit l’énergie
        qui lui est nécessaire pour vivre.
      de: |-
        Es gewinnt lebenswichtige Energie, indem es seine zwei
        Einzelteile ineinander verzahnt und rotieren lässt.
      es: |-
        Genera la energía vital que necesita haciendo girar sus dos
        cuerpos.
      it: |-
        Produce l’energia che gli serve per vivere incastrando
        e facendo ruotare le due parti che lo compongono.
    alpha-sapphire:
      ja-Hrkt: |-
        ２つの　からだは　くみあわせが
        きまっている。べつの　からだとは
        かみあわずに　はなれてしまう。
      ja: |-
        ２つの　体は　組み合わせが
        決まっている。別の　体とは
        かみ合わずに　離れてしまう。
      ko: |-
        두 개의 몸은 그 조합 방법이
        정해져 있다. 다른 몸과는
        맞물리지 않고 떨어져 버린다.
      en: |-
        The two minigears that mesh together are
        predetermined. Each will rebound from other
        minigears without meshing.
      fr: |-
        La compatibilité entre ses deux rouages est prédéterminée.
        Ceux-ci ne se fixeront à aucun autre.
      de: |-
        Seine zwei Teile greifen ineinander wie ein Uhrwerk.
        Jedes andere Objekt, das man mit ihm kombinieren will,
        wird abgestoßen.
      es: |-
        La combinación de sus dos cuerpos es predeterminada. Si no
        se corresponde con su homólogo, se separa.
      it: |-
        I due ingranaggi che lo compongono combaciano unicamente
        l’uno con l’altro. Qualsiasi altro incastro è impossibile.
    sword:
      ja-Hrkt: |-
        ２つの　からだは　ふたごよりも
        ちかい。　べつの　からだどうしだと
        いまいち　うまく　かみあわない。
      ja: |-
        ２つの　体は　双子よりも
        近い。　べつの　体同士だと
        いまいち　うまく　噛み合わない。
      ko: |-
        2개의 몸은 쌍둥이보다도
        가깝다. 다른 몸과 있으면
        제대로 맞물리지 못한다.
      zh-Hant: |-
        ２個身體比雙胞胎還要親近。
        要是換成別的齒輪兒，
        就沒有辦法好好咬合。
      zh-Hans: |-
        ２个身体比双胞胎还要亲近。
        要是换成别的齿轮儿。
        就没有办法好好咬合。
      en: |-
        The two minigears that compose this Pokémon
        are closer than twins. They mesh well only with
        each other.
      fr: |-
        Ses deux rouages sont plus soudés que des
        jumeaux. Si on essaie de les combiner à d’autres
        rouages, ils ne s’entendent pas très bien.
      de: |-
        Seine zwei Teile stehen einander näher als
        Zwillinge. Eine andere Kombination würde
        nicht halb so gut ineinandergreifen.
      es: |-
        Los dos cuerpos que lo componen están más
        unidos que unos gemelos. Si intentaran acoplarse
        a otros, no lograrían encajar.
      it: |-
        I due ingranaggi che lo compongono sono più
        uniti di una coppia di gemelli. Se combinati con
        ingranaggi diversi, non combaciano bene.
    shield:
      ja-Hrkt: |-
        おおむかしに　ギアルを　みた
        にんげんが　はぐるまの　こうぞうを
        おもいついたと　いわれている。
      ja: |-
        大昔に　ギアルを　見た
        人間が　歯車の　構造を
        思いついたと　いわれている。
      ko: |-
        먼 옛날에 기어르를 본
        사람이 톱니바퀴의 구조를
        고안했다고 전해진다.
      zh-Hant: |-
        據說在很久以前，
        是看到了齒輪兒的人
        發明了齒輪的構造。
      zh-Hans: |-
        据说在很久以前，
        是看到了齿轮儿的人
        发明了齿轮的构造。
      en: |-
        It’s suspected that Klink were the inspiration
        behind ancient people’s invention of the
        first gears.
      fr: |-
        Les humains auraient inventé les mécanismes
        à engrenages il y a fort longtemps, en observant
        ce Pokémon.
      de: |-
        Man sagt, dass vor langer Zeit ein Mensch das
        Zahnrad erfand, weil er so von der Begegnung
        mit diesem Pokémon inspiriert wurde.
      es: |-
        Se dice que en tiempos remotos los seres
        humanos se inspiraron en este Pokémon para
        inventar el mecanismo de engranaje.
      it: |-
        Si dice che gli uomini del passato abbiano
        inventato gli ingranaggi dopo aver visto
        questo Pokémon.
