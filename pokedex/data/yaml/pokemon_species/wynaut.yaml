    black-2:
      en: |-
        It grows strong by pushing up
        against others en masse.
        It loves eating sweet fruit.
    white-2:
      en: |-
        It grows strong by pushing up
        against others en masse.
        It loves eating sweet fruit.
    x:
      ja-Hrkt: |-
        むれで　こうどうする　しゅうせい。
        ねむる　ときは　どうくつの　なかで
        なかまたちと　からだを　よせあう。
      ja: |-
        群れで　行動する　習性。
        眠る　ときは　洞窟の　中で
        仲間たちと　体を　寄せ合う。
      ko: |-
        무리를 지어 행동하는 습성이 있다.
        잠들 때는 동굴 안에서
        동료들과 서로 몸을 붙인다.
      en: |-
        It tends to move in a pack with others. They cluster
        in a tight group to sleep in a cave.
      fr: |-
        Okéoké adore se déplacer en groupe.
        Ils se réunissent souvent pour dormir la nuit dans les
        cavernes.
      de: |-
        Es zieht normalerweise im Rudel umher.
        Zum Schlafen drängen sie sich ganz eng
        in einer Höhle zusammen.
      es: |-
        Suelen ir en grupo y a la hora de dormir se resguardan
        en una cueva.
      it: |-
        Tendono a spostarsi in gruppo. Anche per dormire
        si stringono fra loro, nelle grotte.
    'y':
      ja-Hrkt: |-
        なかまたちと　おしくらまんじゅうを
        やることで　がまんづよく　そだつ。
        あまい　くだものが　だいこうぶつ。
      ja: |-
        仲間たちと　おしくらまんじゅうを
        やることで　我慢強く　育つ。
        甘い　果物が　大好物。
      ko: |-
        동료들과 밀어내기 놀이를 하면서
        인내심이 강한 성격으로 자란다.
        달콤한 과일을 매우 좋아한다.
      en: |-
        It grows strong by pushing up against others en
        masse. It loves eating sweet fruit.
      fr: |-
        Il se muscle en bousculant ses semblables lors de
        mêlées. Il raffole des fruits sucrés.
      de: |-
        Es wird stärker, indem es andere ständig anrempelt.
        Es liebt Süßigkeiten.
      es: |-
        Se fortalecen empujándose unos a otros en grupos.
        Les encantan los dulces.
      it: |-
        Questi Pokémon si allenano in gruppo caricandosi
        l’un l’altro per rafforzarsi. Amano i frutti dolci.
    omega-ruby:
      ja-Hrkt: |-
        いつも　ニコニコ　えがおの　ソーナノ。
        おこっているときは　しっぽに　ちゅうもく。
        じめんを　パタパタ　たたいているぞ。
      ja: |-
        いつも　ニコニコ　笑顔の　ソーナノ。
        怒っているときは　尻尾に　注目。
        地面を　パタパタ　たたいているぞ。
      ko: |-
        언제나 싱글벙글 미소 짓는 마자.
        화났을 때는 꼬리에 주목하자.
        땅을 탁탁 치고 있다.
      en: |-
        Wynaut can always be seen with a big, happy smile on its face.
        Look at its tail to determine if it is angry. When angered, this
        Pokémon will be slapping the ground with its tail.
      fr: |-
        Okéoké a toujours un grand sourire qui illumine son visage.
        On peut savoir s’il est en colère en regardant sa queue.
        Lorsqu’il est furieux, sa queue remue en frappant le sol.
      de: |-
        Isso hat immer ein breites, fröhliches Lächeln auf seinem
        Gesicht. Um festzustellen, ob es wütend ist, muss man seinen
        Schweif betrachten. Wenn es wütend ist, schlägt es damit auf
        den Boden.
      es: |-
        Wynaut está siempre con una gran sonrisa puesta. Para ver si
        está enfadado, basta con mirarle la cola. Cuando se le
        molesta, se pone a dar golpetazos en el suelo.
      it: |-
        Wynaut ha sempre un sorriso grande e genuino stampato
        sul volto. La coda è indice del suo vero stato d’animo.
        Se la sbatte violentemente a terra, significa che è infuriato.
    alpha-sapphire:
      ja-Hrkt: |-
        つきのよる　なかまたちと　おしくらまんじゅう。
        ぎゅうぎゅう　おされて　がまんづよくなる。
        きょうれつな　カウンターを　くりだす　くんれん。
      ja: |-
        月の夜　仲間たちと　おしくらまんじゅう。
        ぎゅうぎゅう　押されて　我慢強くなる。
        強烈な　カウンターを　繰り出す　訓練。
      ko: |-
        달밤에 동료들과 밀어내기 놀이를 한다.
        이리저리 밀리면 인내심이 강해진다.
        강렬한 카운터를 쓰는 훈련이다.
      en: |-
        Wynaut gather on moonlit nights to play by squeezing up
        against each other. By being squeezed, this Pokémon gains
        endurance and is trained to dole out powerful counterattacks.
      fr: |-
        Les Okéoké se rassemblent quand la nuit est claire pour jouer
        à se presser les uns contre les autres. En se poussant,
        ces Pokémon améliorent leur endurance et s’entraînent à
        renvoyer de puissantes contre-attaques.
      de: |-
        Isso sammeln sich in Mondnächten, um sich gegenseitig
        anzurempeln. Dadurch gewinnt dieses Pokémon an Ausdauer
        und kann wirkungsvolle Gegenangriffe trainieren.
      es: |-
        Los Wynaut se agrupan cuando hay luna para jugar
        achuchándose unos a otros. Cuanto más se achuchan, más
        ganan en resistencia y lanzan fuertes contraataques con más
        facilidad.
      it: |-
        Gli Wynaut si riuniscono di notte al chiaro di luna per giocare
        stringendosi fra loro. In tal modo il Pokémon acquisisce
        resistenza per poter sferrare potenti contrattacchi.
    sword:
      ja-Hrkt: |-
        おおぜいの　なかまと　こうどうする。
        おしくらまんじゅうで　がまんづよい
        こんじょうを　きたえるのだ。
      ja: |-
        大勢の　仲間と　行動する。
        おしくらまんじゅうで　我慢強い
        根性を　鍛えるのだ。
      ko: |-
        많은 동료와 함께 행동한다.
        밀어내기 놀이로 인내심과
        근성을 강하게 단련한다.
      zh-Hant: |-
        和大群夥伴一起行動，
        透過和夥伴彼此推擠
        來鍛鍊自己的忍耐力。
      zh-Hans: |-
        和大群伙伴一起行动，
        通过和伙伴彼此推挤
        来锻炼自己的忍耐力。
      en: |-
        It tends to move in a pack. Individuals squash
        against one another to toughen their spirits.
      fr: |-
        Il fait toutes ses activités en groupe.
        L’une d’elles consiste à se bousculer mutuellement
        afin de s’endurcir.
      de: |-
        Isso bleiben immer im Rudel und schubsen
        einander spielerisch, um ihre Ausdauer zu
        trainieren.
      es: |-
        Suelen ir en grupo. Templan su paciencia jugando
        a empujarse los unos a los otros.
      it: |-
        I Wynaut fanno tutto in gruppo. Giocando
        a darsi spintoni, si tengono sempre allenati.
    shield:
      ja-Hrkt: |-
        むれで　こうどうする　しゅうせい。
        ねむる　ときは　どうくつの　なかで
        なかまたちと　からだを　よせあう。
      ja: |-
        群れで　行動する　習性。
        眠る　ときは　洞窟の　中で
        仲間たちと　体を　寄せあう。
      ko: |-
        무리를 지어 행동하는 습성이 있다.
        잠들 때는 동굴 안에서
        동료들과 서로 몸을 붙인다.
      zh-Hant: |-
        具有集體行動的習性。
        睡覺的時候會在洞窟中
        和夥伴們把身體挨在一起。
      zh-Hans: |-
        具有集体行动的习性。
        睡觉的时候会聚集在洞窟中，
        和伙伴们把身体挨在一起。
      en: |-
        It tends to move in a pack with others.
        They cluster in a tight group to sleep in a cave.
      fr: |-
        Ces Pokémon adorent se déplacer en groupe.
        Ils se blottissent les uns contre les autres
        dans des cavernes pour dormir.
      de: |-
        Sie ziehen normalerweise im Rudel umher. Zum
        Schlafen drängen sie sich ganz eng in einer Höhle
        zusammen.
      es: |-
        Suelen ir en grupo y, a la hora de dormir, se
        pegan unos a otros para descansar resguardados
        en cuevas.
      it: |-
        Hanno l’abitudine di spostarsi in gruppo.
        Quando è ora di dormire, si radunano in
        una grotta e riposano stretti l’uno all’altro.
