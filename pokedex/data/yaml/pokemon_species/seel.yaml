    white-2:
      en: |-
        The colder it gets, the better it feels.
        It joyfully swims around oceans so cold
        that they are filled with floating ice.
    x:
      ja-Hrkt: |-
        ひょうざんで　くらす　ポケモン。
        あたまの　とがった　でっぱりで
        こおりを　わって　うみを　およぐ。
      ja: |-
        氷山で　暮らす　ポケモン。
        頭の　とがった　でっぱりで
        氷を　割って　海を　泳ぐ。
      ko: |-
        빙산에 사는 포켓몬이다.
        머리의 뾰족하게 돌출된 부분으로
        얼음을 깨고 바다를 헤엄친다.
      en: |-
        A Pokémon that lives on icebergs. It swims in the
        sea using the point on its head to break up ice.
      fr: |-
        Un habitant des icebergs. En mer, il utilise la corne
        sur sa tête pour briser la banquise.
      de: |-
        Dieses Pokémon lebt auf Eisbergen. Es schwimmt
        im Eiswasser und bricht das Eis mithilfe seines Horns.
      es: |-
        Este Pokémon vive en icebergs. Nada en el mar y usa
        el cuerno de su cabeza para romper el hielo.
      it: |-
        Pokémon che vive sugli iceberg. Nuota spaccando
        il ghiaccio con la punta che ha sulla testa.
    'y':
      ja-Hrkt: |-
        みずいろの　たいもうに　おおわれた
        ひふは　ぶあつくて　じょうぶ。
        れいか４０ど　でも　かつどうできる。
      ja: |-
        水色の　体毛に　覆われた　皮膚は
        分厚くて　丈夫。
        零下４０度でも　活動できる。
      ko: |-
        하늘색의 털로 뒤덮인
        피부는 두껍고 튼튼하다.
        영하 40도라도 활동할 수 있다.
      en: |-
        Covered with light blue fur, its hide is thick and
        tough. It is active in bitter cold of
        -40 degrees Fahrenheit.
      fr: |-
        Sa peau épaisse et dure est recouverte d’une
        fourrure bleu clair. Elle permet à ce Pokémon
        de résister aux températures les plus glaciales.
      de: |-
        Unter seinem hellblauen Pelz liegt eine dicke und
        feste Haut. Es ist bei frostigen -40 °C noch aktiv.
      es: |-
        Está recubierto de un pelaje de color azul, y tiene una
        piel gruesa y tosca. Se mantiene activo a -40 °C.
      it: |-
        Sotto la pelliccia azzurra ha una pelle spessa e dura.
        Può resistere a una temperatura di -40 °C.
    omega-ruby:
      ja-Hrkt: |-
        こおりに　おおわれた　うみで　エサを　とる。
        いきつぎを　するときは　あたまの　でっぱりで
        こおりを　わって　うみから　かおを　だす。
      ja: |-
        氷に　覆われた　海で　エサを　採る。
        息継ぎを　するときは　頭の　出っ張りで
        氷を　割って　海から　顔を　出す。
      ko: |-
        얼음으로 뒤덮인 바다에서 먹이를 잡는다.
        숨을 쉴 때는 머리의 돌출된 부분으로
        얼음을 깨고 바다 밖으로 얼굴을 내민다.
      en: |-
        Seel hunts for prey in the frigid sea underneath sheets of ice.
        When it needs to breathe, it punches a hole through the ice
        with the sharply protruding section of its head.
      fr: |-
        Otaria chasse ses proies dans l’eau gelée, sous la couche de
        glace. Lorsqu’il cherche à respirer, il perce un trou en frappant
        la glace avec la partie saillante de sa tête.
      de: |-
        Jurob jagt unter der eisigen Oberfläche des Eismeeres nach
        Beute. Zum Luftholen schlägt es mit dem vorstehenden Teil
        seines Kopfes ein Loch ins Eis.
      es: |-
        Seel busca a sus presas en aguas heladas, bajo las capas de
        hielo. Cuando necesita respirar, abre un agujerito en el hielo
        con la afilada protuberancia que tiene encima de la cabeza.
      it: |-
        Seel caccia le prede nel mare gelido sotto le lastre
        di ghiaccio. Per respirare apre un foro nel ghiaccio
        usando la protuberanza appuntita sulla sommità del capo.
    alpha-sapphire:
      ja-Hrkt: |-
        こおりに　おおわれた　うみで　エサを　とる。
        いきつぎを　するときは　あたまの　でっぱりで
