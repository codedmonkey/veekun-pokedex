    ultra-sun:
      ja-Hrkt: |-
        つめたい　うみにしか　すまないと
        かんがえられてきた。　アローラに
        あらわれる　りゆうは　ナゾ。
      ja: |-
        冷たい　海にしか　棲まないと
        考えられてきた。　アローラに
        現れる　理由は　ナゾ。
      ko: |-
        차가운 바다에서만 산다고
        추정되었다. 알로라에
        나타나는 이유를 알 수 없다.
      zh-Hant: |-
        人們一向認為牠只棲息在
        寒冷的海域，沒人知道牠
        出現在阿羅拉的原因。
      zh-Hans: |-
        人们一直以为它只生活在寒冷的海域。
        它出现在阿罗拉的原因是个谜。
      en: |-
        It has always been supposed that Seel live only
        in cold seas. Their having shown up in Alola is
        a mystery.
      fr: |-
        Tout le monde pensait qu’il ne pouvait survivre
        que dans les mers froides.
        Personne ne sait donc ce qu’il fait à Alola.
      de: |-
        Bisher wurde vermutet, dass es ausschließlich
        in kalten Gewässern lebe. Warum es auch in
        Alola auftaucht, ist noch ein Rätsel.
      es: |-
        Siempre se ha creído que solo puede subsistir
        en aguas frías. El motivo de su aparición en
        Alola es un misterio.
      it: |-
        Finora si pensava che i Seel potessero vivere
        solo nei mari gelidi, pertanto la loro comparsa
        ad Alola è alquanto misteriosa.
    ultra-moon:
      ja-Hrkt: |-
        ぶあつい　しぼうの　おかげで　さむい
        うみも　へっちゃらだけど　あたたかい
        うみでは　ちょっと　バテやすいのだ。
      ja: |-
        分厚い　脂肪の　おかげで　寒い
        海も　へっちゃらだけど　暖かい
        海では　ちょっと　バテやすいのだ。
      ko: |-
        두꺼운 지방 덕분에
        추운 바다는 문제없지만
        따뜻한 바다에서 쉽게 지친다.
      zh-Hant: |-
        因為有著厚厚的脂肪，
        所以完全不怕寒冷的海域，
        但在溫暖的海裡就有點容易中暑。
      zh-Hans: |-
        因为有着厚厚的脂肪，
        所以在寒冷的海里它也毫不在意，
        但在温暖的海里却有点容易疲劳。
      en: |-
        Thanks to its thick fat, cold seas don’t bother it
        at all, but it gets tired pretty easily in
        warm waters.
      fr: |-
        Sa couche de gras lui permet d’être à l’aise
        dans les eaux les plus froides. Il a par contre
        plus de mal à supporter les mers chaudes.
      de: |-
        Kalte Meere machen ihm dank seiner dicken
        Fettschicht nichts aus. Wärmere Gewässer
        setzen ihm hingegen sehr zu.
      es: |-
        La gruesa capa de grasa que le permite nadar
        sin problemas en aguas frías le da más de un
        sofoco en climas más cálidos.
      it: |-
        Grazie al suo spesso strato di grasso nuota
        tranquillamente nell’acqua gelida. Nei mari
        caldi rischia facilmente lo sfinimento.
    lets-go-pikachu:
      ja-Hrkt: |-
        こおるほど　さむいところが　すき。
        ひょうてんか　１０ど　くらいで
        きもちよく　およいでいる。
      ja: |-
        凍るほど　寒いところが　好き。
        氷点下　１０度　くらいで
        気持ちよく　泳いでいる。
      ko: |-
        얼어붙을 정도로 추운 곳을 좋아한다.
        영하 10도 정도의 물속에서
        기분 좋게 헤엄친다.
      zh-Hant: |-
        喜歡滴水成冰的寒冷地方。
        在零下10度的溫度裡
        也能舒服自在地游泳。
      zh-Hans: |-
        喜欢天寒地冻的地方，
        就算零下10度
        也能愉快地游泳。
      en: |-
        Loves freezing-cold conditions.
        Relishes swimming in a frigid climate
        of around 14 degrees Fahrenheit.
      fr: |-
        Il est à l’aise dans les endroits gelés.
        Il nage avec plaisir dans de l’eau à -10 ºC.
      de: |-
        Es bevorzugt eiskalte Lebensräume und
        schwimmt mit Vorliebe in -10 ºC kaltem Wasser.
      es: |-
        Le encantan los lugares gélidos y disfruta
        nadando en aguas a temperaturas en torno a
        los -10 °C.
      it: |-
        Adora gli ambienti gelidi. Nuota con piacere
        nell’acqua a temperature di circa -10 ºC.
