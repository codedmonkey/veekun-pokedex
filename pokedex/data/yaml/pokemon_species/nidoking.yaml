        Il suo corno può perforare anche il diamante.
    sword:
      ja-Hrkt: |-
        あばれると　てが　つけられなくなるが
        ながねん　つれそった　ニドクインの
        まえでは　おだやかな　かおに　なる。
      ja: |-
        暴れると　手が　つけられなくなるが
        長年　連れ添った　ニドクインの
        前では　穏やかな　顔に　なる。
      ko: |-
        날뛰기 시작하면 손쓸 수 없게 되지만
        긴 세월 함께 지낸 니드퀸
        앞에서는 온순해진다.
      zh-Hant: |-
        一旦大鬧起來就無人能擋，
        但在長年相伴的尼多后面前
        則會露出溫和的表情。
      zh-Hans: |-
        虽然一旦大闹起来便会令人
        束手无措，但在长年一起生活
        的尼多后面前却会露出温和的一面。
      en: |-
        When it goes on a rampage, it’s impossible to
        control. But in the presence of a Nidoqueen it’s
        lived with for a long time, Nidoking calms down.
      fr: |-
        Lorsqu’il s’énerve, il devient incontrôlable,
        mais il retrouve son calme face à Nidoqueen,
        sa compagne de longue date.
      de: |-
        Gerät es in Rage, ist es nur schwer aufzuhalten.
        Doch vor einem Nidoqueen, mit dem es schon
        viele Jahre verbracht hat, zeigt es sich friedlich.
      es: |-
        Una vez que se desboca, no hay quien lo pare.
        Solo se calma ante Nidoqueen, su compañera de
        toda la vida.
      it: |-
        Quando si scatena non c’è modo di fermarlo,
        ma davanti a Nidoqueen, la sua compagna
        di lunga data, ritrova la calma.
    shield:
      ja-Hrkt: |-
        ちからじまんの　ポケモン。　ふとい
        しっぽと　ダイヤをも　くだく　ツノを
        くしして　ごうかいに　たたかう。
      ja: |-
        力自慢の　ポケモン。　太い　尻尾と
        ダイヤをも　砕く　ツノを　駆使して
        豪快に　戦う。
      ko: |-
        힘이 센 포켓몬이다.
        굵은 꼬리와 다이아몬드도
        부수는 뿔로 호쾌하게 싸운다.
      zh-Hant: |-
        以力氣為傲的寶可夢。
        會善用粗壯的尾巴和連鑽石
        也能擊碎的角，豪邁地戰鬥。
      zh-Hans: |-
        以力量为傲的宝可梦。
        用自己的粗尾巴和连钻石
        都能击碎的角，豪爽地战斗。
      en: |-
        Nidoking prides itself on its strength. It’s forceful
        and spirited in battle, making use of its thick tail
        and diamond-crushing horn.
      fr: |-
        Très fier de sa force, il se bat vigoureusement
        à l’aide de sa queue robuste et de sa corne
        capable de briser le diamant.
      de: |-
        Nidoking ist stolz auf seine Kraft und kämpft sehr
        geschickt mit seinem dicken Schweif und seinem
        Horn, das selbst Diamanten zertrümmern kann.
      es: |-
        Presume de su hercúlea fuerza y combate
        vigorosamente con su robusta cola y su cuerno,
        con el que hasta puede pulverizar diamantes.
      it: |-
        Si dà vanto della propria forza e lotta con
        vigore sfruttando la coda robusta e il corno
        in grado di frantumare il diamante.
