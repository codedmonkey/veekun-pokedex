    x:
      ja-Hrkt: |-
        いしのように　かたい　ひふと
        ながく　のびた　ツノが　とくちょう。
        ツノには　どくもあるので　ちゅうい。
      ja: |-
        石のように　硬い　皮膚と
        長く　伸びた　ツノが　特徴。
        ツノには　毒も　あるので　注意。
      ko: |-
        돌처럼 딱딱한 피부와
        길게 뻗은 뿔이 특징이다.
        뿔에는 독이 있으니 주의해야 한다.
      en: |-
        It is recognized by its rock-hard hide and
        its extended horn. Be careful with the horn,
        as it contains venom.
      fr: |-
        On le reconnaît facilement grâce à sa peau dure
        comme de la pierre ainsi qu’à sa grosse corne pleine
        de poison.
      de: |-
        Seine steinharte Haut und sein ausgeprägtes Horn
        sind seine Markenzeichen. Achte auf das Horn,
        denn es enthält Gift.
      es: |-
        Es fácil reconocerlo por tener una dura piel y un gran
        cuerno lleno de peligrosísimo veneno.
      it: |-
        Lo si riconosce dalla pelle durissima e dal corno
        particolarmente allungato, che contiene sostanze
        velenose.
    'y':
      ja-Hrkt: |-
        しっぽの　いちげきは　でんちゅうを
        まるで　マッチぼうのように
        まっぷたつに　へしおってしまう。
      ja: |-
        尻尾の　一撃は　電柱を
        まるで　マッチ棒のように
        真っ二つに　へし折ってしまう。
      ko: |-
        꼬리의 일격은 전신주를
        마치 성냥개비 다루듯이
        두 동강으로 꺾어 버린다.
      en: |-
        One swing of its mighty tail can snap a telephone
        pole as if it were a matchstick.
      fr: |-
        Un coup de sa puissante queue peut briser un poteau
        téléphonique comme une allumette.
      de: |-
        Ein Schlag mit seinem gewaltigen Schweif kann
        einen Telegrafenmast knicken wie ein Streichholz.
      es: |-
        Un golpe de su poderosa cola puede partir un poste
        de teléfono como si fuese una cerilla.
      it: |-
        Con un solo colpo della potente coda può abbattere
        un palo del telefono come se fosse un fiammifero.
    omega-ruby:
      ja-Hrkt: |-
        ふとい　しっぽの　ひとふりは　がんじょうな
        てっとうも　へしおる　すさまじい　はかいりょく。
        いちど　あばれだすと　てが　つけられない。
      ja: |-
        太い　尻尾の　一振りは　頑丈な
        鉄塔も　へし折る　すさまじい　破壊力。
        一度　暴れだすと　手が　つけられない。
      ko: |-
        두꺼운 꼬리는 한 번 휘두르면 튼튼한
        철탑도 꺾어 버리는 엄청난 파괴력을 지녔다.
        한 번 날뛰기 시작하면 손쓸 수 없다.
      en: |-
        Nidoking’s thick tail packs enormously destructive power.
        With one swing, it can topple a metal transmission tower.
        Once this Pokémon goes on a rampage, there is no stopping it.
      fr: |-
        L’épaisse queue de Nidoking est d’une puissance incroyable.
        En un seul coup, il peut renverser une tour métallique.
        Lorsque ce Pokémon se déchaîne, plus rien ne peut l’arrêter.
      de: |-
        Nidokings Schweif ist enorm stark. Mit einer Bewegung
        kann es einen metallenen Sendemast zum Einsturz bringen.
        Wenn es in Rage gerät, ist es nur schwer aufzuhalten.
      es: |-
        La gruesa cola de Nidoking encierra una fuerza realmente
        destructora. Con una vez que la agite, es capaz de tumbar
        una torre metálica de transmisión. Una vez que este Pokémon
        se desboca, no hay quien lo pare.
      it: |-
        La possente coda di Nidoking è dotata di un enorme potere
        distruttivo. Con un solo colpo riesce ad abbattere un pilone
        metallico. Quando si scatena non c’è modo di fermare
        la sua furia.
    alpha-sapphire:
      ja-Hrkt: |-
        ふとい　しっぽの　ひとふりは　がんじょうな
        てっとうも　へしおる　すさまじい　はかいりょく。
