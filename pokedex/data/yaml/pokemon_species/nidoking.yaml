    lets-go-pikachu:
      ja-Hrkt: |-
        はがねのような　ひふを　いかした
        たいあたりは　きょうりょく。
        ツノは　ダイヤモンドも　つきさす。
      ja: |-
        鋼のような　皮膚を　活かした
        たいあたりは　強力。
        ツノは　ダイヤモンドも　突き刺す。
      ko: |-
        강철같은 피부를 활용한
        몸통박치기는 강력하다.
        뿔은 다이아몬드도 꿰뚫는다.
      zh-Hant: |-
        會利用全身鋼鐵般的皮膚，
        使出威力強大的撞擊。
        頭上的角連鑽石也能穿透。
      zh-Hans: |-
        通过活用自己钢一般坚硬的
        皮肤来使出强力的撞击。它的
        犄角坚硬得能够刺穿钻石。
      en: |-
        Its steel-like hide adds to its powerful tackle.
        Its horns are so hard, they can pierce a diamond.
      fr: |-
        Ses charges sont dévastatrices grâce à sa peau
        d’acier. Sa corne perce même le diamant.
      de: |-
        Dank seiner stahlharten Haut kann es Gegner
        besonders effektiv rammen. Mit seinem Horn
        spaltet es sogar Diamanten.
      es: |-
        Su piel dura como el acero refuerza el impacto
        al cargar contra sus enemigos. Su cuerno puede
        atravesar hasta diamantes.
      it: |-
        La pelle dura come l’acciaio garantisce alle
        sue cariche una potenza devastante.
        Il suo corno può perforare anche il diamante.
    lets-go-eevee:
      ja-Hrkt: |-
        はがねのような　ひふを　いかした
        たいあたりは　きょうりょく。
        ツノは　ダイヤモンドも　つきさす。
      ja: |-
