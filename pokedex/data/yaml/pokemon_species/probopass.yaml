probopass:
  base_happiness: 70
  capture_rate: 60
  color: gray
  egg_groups:
    - mineral
  evolution_chain: nosepass
  evolves_from: nosepass
  flavor_text:
    diamond:
      en: |-
        It exudes strong magnetism from
        all over. It controls three small
        units called Mini-Noses.
    pearl:
      en: |-
        It exudes strong magnetism from
        all over. It controls three small
        units called Mini-Noses.
    platinum:
      en: |-
        It freely controls three small
        units called Mini-Noses using
        magnetic force.
    heartgold:
      en: |-
        It controls three units called Mini-Noses
        using magnetic force. With them, it can
        attack the foe from three directions.
    soulsilver:
      en: |-
        It controls three units called Mini-Noses
        using magnetic force. With them, it can
        attack the foe from three directions.
    black:
      en: |-
        It freely controls three small
        units called Mini-Noses using
        magnetic force.
      fr: |-
        Il utilise sa force magnétique pour
        diriger trois petites unités
        appelées Mini-nez.
    white:
      en: |-
        It freely controls three small
        units called Mini-Noses using
        magnetic force.
      fr: |-
        Il utilise sa force magnétique pour
        diriger trois petites unités
        appelées Mini-nez.
    black-2:
      en: |-
        It freely controls three units
        called Mini-Noses using
        magnetic force.
    white-2:
      en: |-
        It freely controls three units
        called Mini-Noses using
        magnetic force.
    x:
      ja-Hrkt: |-
        ぜんしんから　つよい　じりょくを
        だしている。３この　チビノーズと
        よばれる　ユニットを　あやつる。
      ja: |-
        全身から　強い　磁力を　出している。
        ３個の　チビノーズと　呼ばれる
        ユニットを　操る。
      ko: |-
        전신에서 강한 자력을 발산하고
        있다. 꼬마코파스라고 불리는
        3개의 유닛을 조종한다.
      en: |-
        It exudes strong magnetism from all over.
        It controls three small units called Mini-Noses.
      fr: |-
        Son corps libère une puissante force magnétique.
        Il dirige trois petites unités appelées Mini-nez.
      de: |-
        Es gibt starken Magnetismus ab. Es steuert drei
        kleine Einheiten, die sich Mininasen nennen.
      es: |-
        Emana un fuerte magnetismo. Controla tres pequeñas
        unidades llamadas mininarices.
      it: |-
        Emana un forte magnetismo da tutto il corpo.
        Controlla tre piccole unità, dette Mininasi.
    'y':
      ja-Hrkt: |-
        チビノーズと　よばれる　ちいさな
        ３つの　ユニットを　じりょくで
        じゆうじざいに　あやつっている。
      ja: |-
        チビノーズと　呼ばれる　小さな
        ３つの　ユニットを　磁力で
        自由自在に　操っている。
      ko: |-
        꼬마코파스라고 불리는 작은
        3개의 유닛을 자력으로
        자유자재로 조종한다.
      en: |-
        It freely controls three small units called Mini-Noses
        using magnetic force.
      fr: |-
        Il utilise sa force magnétique pour diriger trois petites
        unités appelées Mini-nez.
      de: |-
        Es steuert drei kleine Einheiten mithilfe von
        starkem Magnetismus. Man nennt sie Mininasen.
      es: |-
        Con el magnetismo que emana, controla tres pequeñas
        unidades llamadas mininarices.
      it: |-
        Controlla tre piccole unità, dette Mininasi, usando
        la forza magnetica.
    omega-ruby:
      ja-Hrkt: |-
        ぜんしんから　つよい　じりょくを
        だしている。３この　チビノーズと
        よばれる　ユニットを　あやつる。
      ja: |-
        全身から　強い　磁力を　出している。
        ３個の　チビノーズと　呼ばれる
        ユニットを　操る。
      ko: |-
        전신에서 강한 자력을 발산하고
        있다. 꼬마코파스라고 불리는
        3개의 유닛을 조종한다.
      en: |-
        It exudes strong magnetism from all over.
        It controls three small units called Mini-Noses.
      fr: |-
        Son corps libère une puissante force magnétique.
        Il dirige trois petites unités appelées Mini-nez.
      de: |-
        Es gibt starken Magnetismus ab. Es steuert drei kleine
        Einheiten, die sich Mininasen nennen.
      es: |-
        Emana un fuerte magnetismo. Controla tres pequeñas
        unidades llamadas mininarices.
      it: |-
        Emana un forte magnetismo da tutto il corpo. Controlla
        tre piccole unità, dette Mininasi.
    alpha-sapphire:
      ja-Hrkt: |-
        チビノーズと　よばれる　ちいさな
        ３つの　ユニットを　じりょくで
        じゆうじざいに　あやつっている。
      ja: |-
        チビノーズと　呼ばれる　小さな
        ３つの　ユニットを　磁力で
        自由自在に　操っている。
      ko: |-
        꼬마코파스라고 불리는 작은
        3개의 유닛을 자력으로
        자유자재로 조종한다.
      en: |-
        It freely controls three small units called Mini-Noses
        using magnetic force.
      fr: |-
        Il utilise sa force magnétique pour diriger trois petites unités
        appelées Mini-nez.
      de: |-
        Es steuert drei kleine Einheiten mithilfe von
        starkem Magnetismus. Man nennt sie Mininasen.
      es: |-
        Con el magnetismo que emana, controla tres pequeñas
        unidades llamadas mininarices.
      it: |-
        Controlla tre piccole unità, dette Mininasi, usando la forza
        magnetica.
    sun:
      ja-Hrkt: |-
        つよい　じりょくを　はなっているので
        ちかくにある　でんかせいひんは
        つかいものに　ならなくなってしまう。
      ja: |-
        強い　磁力を　放っているので
        近くにある　電化製品は
        使いものに　ならなくなってしまう。
      ko: |-
        강한 자력을 뿜어내기 때문에
        가까이 있는 전기 제품은
        망가져 버리고 만다.
      zh-Hant: |-
        因為會釋放強大的磁力，
        導致附近的電器都變得
        無法使用。
      zh-Hans: |-
        因为会释放强大的磁力，
        所以导致附近的电器都变得无法使用。
      en: |-
        It radiates such a powerful magnetic field that
        nearby electrical appliances become unusable.
      fr: |-
        Il émet un puissant champ magnétique qui rend
        tous les appareils électriques des alentours
        inutilisables.
      de: |-
        Durch seinen starken Magnetismus macht es
        Elektrogeräte in seiner Nähe kaputt.
      es: |-
        Crea un campo magnético tan potente que
        inutiliza cualquier electrodoméstico que se
        encuentre cerca.
      it: |-
        Emette un forte campo magnetico che manda
        in cortocircuito le apparecchiature elettriche
        rendendole inutilizzabili.
    moon:
      ja-Hrkt: |-
        ほんたいは　うごかず　チビノーズと
        よばれる　３つのユニットを　じざいに
        あやつり　えものを　とらえる。
      ja: |-
        本体は　動かず　チビノーズと
        呼ばれる　３つのユニットを　自在に
        操り　獲物を　捕える。
      ko: |-
        본체는 움직이지 않고 꼬마코파스라고
        불리는 3개의 유닛을 자유자재로
        조종하여 먹이를 잡는다.
      zh-Hant: |-
        可以本體不動，
        自由操縱被稱為小朝北鼻的
        ３個組件來捕捉獵物。
      zh-Hans: |-
        可以本体不动，
        自由操纵被称为小朝北鼻的
        ３个部件来捕捉猎物。
      en: |-
        The main body controls three mobile units called
        Mini-Noses, which it maneuvers to catch prey.
      fr: |-
        Sans avoir besoin de se déplacer, il pilote ses
        trois Mini-nez à distance afin de capturer
        ses proies.
      de: |-
        Sein Körper selbst bewegt sich nicht. Um Beute
        zu fangen, steuert es drei kleine Einheiten,
        die Mininasen genannt werden.
      es: |-
        Las tres unidades que controla, llamadas
        mininarices, le permiten atrapar a su presa
        sin necesidad de mover el resto de su cuerpo.
      it: |-
        È in grado di controllare tre piccole unità dette
        Mininasi per catturare le sue prede senza
        doversi spostare.
    ultra-sun:
      ja-Hrkt: |-
        チビノーズと　よばれる　ユニットを
        あやつるが　たまに　まいごに　なって
        かえってこないことも　あるらしい。
      ja: |-
        チビノーズと　呼ばれる　ユニットを
        操るが　たまに　迷子に　なって
        帰ってこないことも　あるらしい。
      ko: |-
        꼬마코파스라고 불리는 유닛을
        조종하지만 가끔 미아가 되어
        돌아오지 않는 경우도 있는 듯하다.
      zh-Hant: |-
        會操縱被稱為小朝北鼻的組件。
        但這些組件有時似乎會
        因為迷路而無法回來。
      zh-Hans: |-
        操纵着被称为小朝北鼻的部件，
        但这些部件好像偶尔也会迷路，没法回来。
      en: |-
        Although it can control its units known as
        Mini-Noses, they sometimes get lost and don’t
        come back.
      fr: |-
        Il est capable de piloter ses Mini-nez à distance,
        mais il arrive que l’un d’entre eux s’aventure
        trop loin et se perde pour ne jamais revenir.
      de: |-
        Es steuert kleine Einheiten, die man Mininasen
        nennt. Leider verirren sie sich manchmal, und es
        heißt, dass einige von ihnen nie wiederkehren.
      es: |-
        Manipula unas pequeñas unidades conocidas
        como mininarices, aunque estas a veces se
        pierden y no saben cómo regresar a Probopass.
      it: |-
        Controlla delle unità dette Mininasi, ma pare che
        a volte queste si smarriscano e non riescano più
        a tornare.
    ultra-moon:
      ja-Hrkt: |-
        ３つの　ちいさな　ユニットを　つかい
        エサを　とったり　てきと　たたかう。
        ほんたいは　ほぼ　めいれいするだけ。
      ja: |-
        ３つの　小さな　ユニットを　使い
        エサを　とったり　敵と　戦う。
        本体は　ほぼ　命令するだけ。
      ko: |-
        3개의 작은 유닛을 사용해서
        먹이를 잡거나 적과 싸운다.
        본체는 거의 명령할 뿐이다.
      zh-Hant: |-
        會驅使３個小組件去
        獲取食物或與敵人戰鬥。
        本體基本上只負責下命令。
      zh-Hans: |-
        使用３个小部件获取食物，
        或是和敌人战斗。
        本体基本上只负责下命令。
      en: |-
        It uses three small units to catch prey and
        battle enemies. The main body mostly just
        gives orders.
      fr: |-
        Il utilise ses trois petites unités pour combattre
        ses ennemis et capturer ses proies. Le reste de
        son corps se contente de donner des ordres.
      de: |-
        Sein Körper selbst befehligt meist nur die drei
        kleinen Einheiten, die an seiner Stelle kämpfen
        und für die Nahrungssuche zuständig sind.
      es: |-
        Usa sus tres pequeñas unidades para capturar
        presas o combatir, mientras que el resto de su
        cuerpo se dedica casi solo a impartir órdenes.
      it: |-
        Usa le tre piccole unità per procacciare il cibo
        e lottare contro i nemici. Il corpo centrale si
        limita quasi esclusivamente a impartire ordini.
