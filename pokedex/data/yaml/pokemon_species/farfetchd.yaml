        It can’t live without the stalk it
        holds. That’s why it defends the
        stalk from attackers with its life.
    white-2:
      en: |-
        It can’t live without the stalk it
        holds. That’s why it defends the
        stalk from attackers with its life.
    x:
      ja-Hrkt: |-
        もっている　クキは　たいせつな
        ぶきでもあり　かたなを　ふるように
        いろんなものを　きることが　できる。
      ja: |-
        持っている　茎は　大切な
        武器でもあり　刀を　振るように
        いろんな　ものを　切ることができる。
      ko: |-
        가지고 있는 파 줄기는 소중한
        무기이기도 하며 칼을 휘두르듯
        다양한 것을 자를 수 있다.
      en: |-
        The plant stalk it holds is its weapon. The stalk is
        used like a sword to cut all sorts of things.
      fr: |-
        Il utilise le légume qu’il tient comme s’il
        s’agissait d’une épée.
      de: |-
        Dieses Pokémon nutzt eine Lauchstange als Waffe.
        Es setzt sie wie ein Schwert ein.
      es: |-
        El puerro que lleva es su mejor arma. Suele usarlo
        como espada para cortar cosas.
      it: |-
        Il verde gambo di porro che brandisce è la sua
        arma, che usa come spada.
    'y':
      ja-Hrkt: |-
        じぶんの　すを　つくるための
        しょくぶつの　クキを　いっぽん
        いつも　もって　あるいている。
      ja: |-
        自分の　巣を　作るための
        植物の　茎を　１本
        いつも　持って　歩いている。
      ko: |-
        자신의 둥지를 만들기 위해서
        식물의 줄기 하나를
        항상 들고 걷는다.
      en: |-
        It always walks about with a plant stalk clamped in
        its beak. The stalk is used for building its nest.
      fr: |-
        Ce Pokémon se promène toujours en tenant un
        légume. Il l’utilise pour faire son nid.
      de: |-
        Es läuft stets mit einer Lauchstange umher.
        Damit baut es sein Nest.
      es: |-
        Siempre lleva un puerro consigo, con el que
        construye su nido.
      it: |-
        Si sposta sempre tenendo un gambo con il becco.
        Gli serve per costruire il nido.
    omega-ruby:
      ja-Hrkt: |-
        もっている　しょくぶつの　クキにも　よいものと
        そうでない　ものが　あるらしく　カモネギどうしが
        クキを　めぐって　たたかう　ことが　ある。
      ja: |-
        持っている　植物の　クキにも　良いものと
        そうでない　ものが　あるらしく　カモネギ同士が
        クキを　巡って　戦う　ことが　ある。
      ko: |-
        가지고 있는 식물의 줄기에도 좋은 것과
        그렇지 않은 것이 있는 듯하여 파오리들이
        줄기를 둘러싸고 싸우는 일도 있다.
      en: |-
        Farfetch’d is always seen with a stalk from a plant of some
        sort. Apparently, there are good stalks and bad stalks. This
        Pokémon has been known to fight with others over stalks.
      fr: |-
        On voit souvent des Canarticho avec une tige, récupérée sur
        une plante quelconque. Apparemment, ils peuvent distinguer
        les bonnes des mauvaises. On a vu ces Pokémon se battre
        pour des histoires de tiges.
      de: |-
        Porenta trifft man immer mit einer Lauchstange an. Es gibt
        gute und schlechte Stangen. Dieses Pokémon kämpft mit
        Hilfe seiner Stange gegen seine Gegner.
      es: |-
        Al parecer, entre los puerros que suelen llevar los Farfetch’d,
        los hay mejores y peores. A estos Pokémon se les ha visto
        luchar entre ellos por los mejores puerros.
      it: |-
        Farfetch’d ha sempre con sé il gambo di qualche pianta.
        Pare che alcuni gambi siano migliori di altri. Spesso lotta
        con altri Pokémon per avere i gambi migliori.
    alpha-sapphire:
      ja-Hrkt: |-
        もっている　しょくぶつの　クキにも　よいものと
        そうでない　ものが　あるらしく　カモネギどうしが
        クキを　めぐって　たたかう　ことが　ある。
      ja: |-
        持っている　植物の　クキにも　良いものと
        そうでない　ものが　あるらしく　カモネギ同士が
        クキを　巡って　戦う　ことが　ある。
      ko: |-
        가지고 있는 식물의 줄기에도 좋은 것과
        그렇지 않은 것이 있는 듯하여 파오리들이
        줄기를 둘러싸고 싸우는 일도 있다.
      en: |-
        Farfetch’d is always seen with a stalk from a plant of some
        sort. Apparently, there are good stalks and bad stalks. This
        Pokémon has been known to fight with others over stalks.
      fr: |-
        On voit souvent des Canarticho avec une tige, récupérée sur
        une plante quelconque. Apparemment, ils peuvent distinguer
        les bonnes des mauvaises. On a vu ces Pokémon se battre
        pour des histoires de tiges.
      de: |-
        Porenta trifft man immer mit einem Pflanzenstängel an,
        dessen Qualität unterschiedlich ausfallen kann.
        Von diesem Pokémon wird behauptet, es kämpfe gegen
        die eigenen Artgenossen um die besten Stängel.
      es: |-
        Al parecer, entre los puerros que suelen llevar los Farfetch’d,
        los hay mejores y peores. A estos Pokémon se les ha visto
        luchar entre ellos por los mejores puerros.
      it: |-
        Farfetch’d ha sempre con sé il gambo di qualche pianta.
        Pare che alcuni gambi siano migliori di altri. Spesso lotta
        con altri Pokémon per avere i gambi migliori.
    lets-go-pikachu:
      ja-Hrkt: |-
        クキが　はえている　ところに　すむ。
        めずらしく　かずも　すくないので
        カモネギも　へってきた　らしい。
      ja: |-
        クキが　生えている　ところに　住む。
        珍しく　数も　少ないので
        カモネギも　減ってきた　らしい。
      ko: |-
        줄기가 자라는 곳에 산다.
        이상하게 수도 적어서
        파오리의 수도 줄고 있는 듯하다.
      zh-Hant: |-
        棲息在莖狀植物生長的地方。
        由於這種植物十分稀少而罕見，
        大蔥鴨的數量似乎也越來越少了。
      zh-Hans: |-
        居住在茎状植物生长的地方。
        由于这种植物极为稀少而罕见，
        大葱鸭的数量似乎也在减少。
      en: |-
        They live where reedy plants grow.
        Farfetch’d are rarely seen, so it’s thought
        their numbers are decreasing.
      fr: |-
        Il vit là où poussent des tiges. Ces endroits sont
        rares, ce qui pourrait faire penser que cette
        espèce de Pokémon est en voie d’extinction.
      de: |-
        Sie leben in Gebieten, in denen stangenförmige
        Gewächse gedeihen. Da diese seltener werden,
        scheint es auch weniger Porenta zu geben.
      es: |-
        Vive cerca de cultivos de puerros. Como estos
        son cada vez más escasos, se cree que el
        número de Farfetch’d también ha disminuido.
      it: |-
        Vivono nei canneti, un tipo di habitat che sta
        diventando sempre più raro. Per questo si pensa
        che anche il numero di Farfetch’d sia diminuito.
    lets-go-eevee:
      ja-Hrkt: |-
        クキが　はえている　ところに　すむ。
        めずらしく　かずも　すくないので
        カモネギも　へってきた　らしい。
      ja: |-
        クキが　生えている　ところに　住む。
