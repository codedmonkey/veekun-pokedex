        由于这种植物极为稀少而罕见，
        大葱鸭的数量似乎也在减少。
      en: |-
        They live where reedy plants grow.
        Farfetch’d are rarely seen, so it’s thought
        their numbers are decreasing.
      fr: |-
        Il vit là où poussent des tiges. Ces endroits sont
        rares, ce qui pourrait faire penser que cette
        espèce de Pokémon est en voie d’extinction.
      de: |-
        Sie leben in Gebieten, in denen stangenförmige
        Gewächse gedeihen. Da diese seltener werden,
        scheint es auch weniger Porenta zu geben.
      es: |-
        Vive cerca de cultivos de puerros. Como estos
        son cada vez más escasos, se cree que el
        número de Farfetch’d también ha disminuido.
      it: |-
        Vivono nei canneti, un tipo di habitat che sta
        diventando sempre più raro. Per questo si pensa
        che anche il numero di Farfetch’d sia diminuito.
    sword:
      ja-Hrkt: |-
        はねで　もつ　クキを　かたなのように
        あやつり　てきを　きりすてる。
        いざと　いうときは　エサに　する。
      ja: |-
        羽で　もつ　茎を　刀のように
        操り　敵を　切り捨てる。
        いざと　いうときは　エサに　する。
      ko: |-
        날개로 쥐고 있는 파 줄기를
        칼처럼 휘둘러 상대를 베어버린다.
        몹시 허기질 때는 먹기도 한다.
      zh-Hant: |-
        會將翅膀所拿的莖狀植物
        當成劍一般去劈砍對手。
        在非常時期會拿它當作食物。
      zh-Hans: |-
        会将翅膀拿着的茎状植物
        当成剑一般去劈砍对手。
        在非常时期会拿它当作食物。
      en: |-
        The stalk this Pokémon carries in its wings serves
        as a sword to cut down opponents. In a dire
        situation, the stalk can also serve as food.
      fr: |-
        Il tranche ses adversaires avec sa tige, qu’il manie
        comme une épée. Quand la situation l’exige,
        il s’en nourrit.
      de: |-
        Unter seinem Flügel trägt es eine Lauchstange,
        die es wie ein Schwert gegen Feinde einsetzt und
        welche ihm im Bedarfsfall auch als Nahrung dient.
      es: |-
        Blande el puerro que sujeta con un ala como si se
        tratase de una espada para rebanar a su rival. En
        caso de necesidad, se lo come para nutrirse.
      it: |-
        Colpisce gli avversari con un gambo, che
        brandisce con l’ala come se fosse una spada.
        In caso di necessità, può anche mangiarselo.
    shield:
      ja-Hrkt: |-
        しょくぶつの　クキで　たたかう。
        クキの　ふりかたには　いくつかの
        りゅうはの　ようなものが　ある。
      ja: |-
        植物の　茎で　戦う。
        茎の　振り方には　いくつかの
        流派の　ようなものが　ある。
      ko: |-
        식물의 줄기로 싸운다.
        줄기를 휘두르는 방식에 따라
        몇 종류의 유파가 있는 듯하다.
      zh-Hant: |-
        用植物的莖來戰鬥。
        莖的揮舞方式存在著
        好幾種不同的流派。
      zh-Hans: |-
        用植物的茎来战斗。
        茎的挥舞方式存在着
        好几种不同的流派。
      en: |-
        They use a plant stalk as a weapon, but not all
        of them use it in the same way. Several distinct
        styles of stalk fighting have been observed.
      fr: |-
        Il se bat à l’aide de sa tige. Il existe plusieurs
        écoles quant à son maniement.
      de: |-
        Im Kampf verwendet es eine Lauchstange als
        Waffe. Es gibt verschiedene Meinungen dazu,
        wie diese korrekt zu schwingen sei.
      es: |-
        Combate empuñando un puerro como arma. La
        forma de blandirlo es tan variada que ha llegado
        a generar sus propias escuelas.
      it: |-
        Affronta i nemici usando il gambo di una
        pianta, brandendolo secondo stili diversi
        in base alla scuola di lotta che segue.
