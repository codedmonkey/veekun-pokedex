dottler:
  base_happiness: 50
  capture_rate: 120
  color: yellow
  egg_groups:
    - bug
  evolution_chain: blipbug
  evolves_from: blipbug
  flavor_text:
    sword:
      ja-Hrkt: |-
        ほぼ　うごかないが　いきている。
        のまずくわずで　からに　こもるうち
        ちょうのうりょくに　めざめたらしい。
      ja: |-
        ほぼ　動かないが　生きている。
        飲まず食わずで　殻に　こもるうち
        超能力に　目覚めたらしい。
      ko: |-
        거의 움직이지 않지만 살아 있다.
        식음을 전폐하고 껍질에 은둔하는 동안
        초능력에 눈을 뜬 모양이다.
      zh-Hant: |-
        雖然幾乎從來不動但還是活著的。
        牠的超能力似乎是在縮在殼裡
        不吃不喝的過程中覺醒的。
      zh-Hans: |-
        虽然几乎从来不动但还是活着的。
        它的超能力似乎是在缩在壳里
        不吃不喝的过程中觉醒的。
      en: |-
        It barely moves, but it’s still alive. Hiding in its
        shell without food or water seems to have
        awakened its psychic powers.
      fr: |-
        Il ne bouge presque pas, mais il est bien vivant.
        On dit qu’il aurait découvert ses pouvoirs
        psychiques à force de jeûner dans sa coquille.
      de: |-
        Obwohl es sich fast nie bewegt, ist es am Leben.
        Es sollen Psycho-Kräfte in ihm erwacht sein, als
        es ohne Nahrung in seinem Panzer ausharrte.
      es: |-
        Apenas se mueve, pero está vivo. Se cree que
        adquiere poderes psíquicos mientras permanece
        recluido en su caparazón sin comer ni beber.
      it: |-
        Si muove appena, ma è vivo. Sembra che sviluppi
        poteri paranormali mentre se ne sta rintanato nel
        suo guscio senza bere né mangiare.
    shield:
      ja-Hrkt: |-
        からの　なかで　せいちょうちゅう。
        サイコパワーで　そとの　ようすを
        うかがい　しんかに　そなえている。
      ja: |-
        殻の　中で　成長中。
        サイコパワーで　外の　様子を
        うかがい　進化に　備えている。
      ko: |-
        껍질 안에서 성장 중이다.
        사이코 파워로 밖의 상태를
        살피며 진화에 대비하고 있다.
      zh-Hant: |-
        正在殼裡成長著。
        用精神力量掌握外界的
        狀況，做好進化的準備。
      zh-Hans: |-
        正在壳里成长着。
        用精神力量掌握外界的
        状况，做好进化的准备。
      en: |-
        As it grows inside its shell, it uses its psychic
        abilities to monitor the outside world and
        prepare for evolution.
      fr: |-
        Il se développe dans sa coquille et se prépare
        à évoluer en sondant les alentours grâce
        à ses pouvoirs psychiques.
      de: |-
        Im Inneren seines Panzers wächst es. Während es
        sich auf die Entwicklung vorbereitet, prüft es mit
        seinen Psycho-Kräften, was im Freien geschieht.
      es: |-
        Está en constante crecimiento dentro del
        caparazón. Mientras se prepara para evolucionar,
        examina el exterior con sus poderes psíquicos.
      it: |-
        Continua a crescere dentro il suo guscio.
        In attesa dell’evoluzione, percepisce il mondo
        esterno grazie ai suoi poteri psichici.
