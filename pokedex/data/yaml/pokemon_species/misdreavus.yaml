    black-2:
      en: |-
        A Pokémon that startles people in
        the middle of the night. It gathers
        fear as its energy.
    white-2:
      en: |-
        A Pokémon that startles people in
        the middle of the night. It gathers
        fear as its energy.
    x:
      ja-Hrkt: |-
        こわがる　こころを　あかい　たまで
        きゅうしゅうして　えいようにする。
        ひるまは　くらがりで　ねむっている。
      ja: |-
        怖がる　心を　赤い　玉で
        吸収して　栄養にする。
        昼間は　暗がりで　眠っている。
      ko: |-
        무서워하는 마음을 빨간 구슬로
        흡수해 영양분으로 만든다. 낮에는
        어두운 곳에서 잠자고 있다.
      en: |-
        It gets nourishment from fear that it absorbs into its
        red orbs. In daytime, it sleeps in darkness.
      fr: |-
        Il se nourrit de la peur absorbée par ses orbes rouges.
        Il somnole à l’ombre en journée.
      de: |-
        Es nährt sich von der Angst anderer Wesen und
        nimmt diese in roten Kugeln auf. Schläft am Tage.
      es: |-
        Se deleita con el miedo, que absorbe con sus esferas
        rojas. Por el día, duerme en la oscuridad.
      it: |-
        Si nutre delle preoccupazioni che assorbe con le
        sue sfere rosse. Di giorno dorme nell’oscurità.
    'y':
      ja-Hrkt: |-
        よなかに　ひとの　なきさけぶような
        なきごえを　だして　みんなを
        おどろかせる　いたずらずき。
      ja: |-
        夜中に　人の　泣き叫ぶような
        鳴き声を　出して
        みんなを　驚かせる　いたずら好き。
      ko: |-
        밤중에 사람이 울부짖는
        울음소리를 내어 모두를
        놀라게 하는 장난꾸러기다.
      en: |-
        It likes playing mischievous tricks, such as
        screaming and wailing to startle people at night.
      fr: |-
        Il pousse des hurlements la nuit pour effrayer
        les gens.
      de: |-
        Es liebt Streiche und erschreckt nachts Menschen,
        indem es heult oder ihnen im Dunkeln auflauert.
      es: |-
        Le gusta hacer travesuras, como gritar y aullar por la
        noche, para asustar a la gente.
      it: |-
        Si diverte a fare brutti scherzi, come gridare e
        lamentarsi in piena notte spaventando la gente.
    omega-ruby:
      ja-Hrkt: |-
        すすりなく　ような　なきごえで　こわがらせる。
        あいての　こわがる　こころを　あかい　たまで
        きゅうしゅうして　えいように　している　らしい。
      ja: |-
        すすり泣く　ような　鳴き声で　怖がらせる。
        相手の　怖がる　心を　赤い　玉で
        吸収して　栄養に　している　らしい。
      ko: |-
        흐느껴 우는 듯한 울음소리로 겁을 준다.
        상대의 두려워하는 마음을 빨간 구슬로
        흡수하여 영양분으로 삼는 것 같다.
      en: |-
        Misdreavus frightens people with a creepy, sobbing cry.
        The Pokémon apparently uses its red spheres to absorb the
        fearful feelings of foes and turn them into nutrition.
      fr: |-
        Feuforêve effraie les gens en poussant un cri à faire froid
        dans le dos, une sorte de lamentation. Ce Pokémon utilise
        ses sphères rouges pour absorber les sentiments de terreur
        de ses ennemis et s’en nourrir.
      de: |-
        Traunfugil erschreckt Menschen mit einem markerschütternden
        Schrei. Dieses Pokémon verwendet seine roten Kraftfelder
        dazu, die Ängste seiner Feinde aufzunehmen und sie in
        Nahrung umzuwandeln.
      es: |-
        Misdreavus asusta a la gente con un chillido escalofriante y
        sollozante. Y, al parecer, usa las esferas rojas para absorber
        los sentimientos de miedo de los enemigos y usarlos como
        alimento.
      it: |-
        Misdreavus terrorizza le persone con un singhiozzo
        raccapricciante. Pare usi le sue sfere rosse per assorbire
        la paura dei nemici e cibarsene.
    alpha-sapphire:
      ja-Hrkt: |-
        すすりなく　ような　なきごえで　こわがらせる。
        あいての　こわがる　こころを　あかい　たまで
        きゅうしゅうして　えいように　している　らしい。
      ja: |-
        すすり泣く　ような　鳴き声で　怖がらせる。
        相手の　怖がる　心を　赤い　玉で
        吸収して　栄養に　している　らしい。
      ko: |-
        흐느껴 우는 듯한 울음소리로 겁을 준다.
        상대의 두려워하는 마음을 빨간 구슬로
        흡수하여 영양분으로 삼는 것 같다.
      en: |-
        Misdreavus frightens people with a creepy, sobbing cry.
        The Pokémon apparently uses its red spheres to absorb the
        fearful feelings of foes and turn them into nutrition.
      fr: |-
        Feuforêve effraie les gens en poussant un cri à faire froid
        dans le dos, une sorte de lamentation. Ce Pokémon utilise
        ses sphères rouges pour absorber les sentiments de terreur
        de ses ennemis et s’en nourrir.
      de: |-
        Traunfugil erschreckt Menschen mit einem markerschütternden
        Schrei. Dieses Pokémon verwendet seine roten Kraftfelder
        dazu, die Ängste seiner Feinde aufzunehmen und sie in
        Nahrung umzuwandeln.
      es: |-
        Misdreavus asusta a la gente con un chillido escalofriante y
        sollozante. Y, al parecer, usa las esferas rojas para absorber
        los sentimientos de miedo de los enemigos y usarlos como
        alimento.
      it: |-
        Misdreavus terrorizza le persone con un singhiozzo
        raccapricciante. Pare usi le sue sfere rosse per assorbire
        la paura dei nemici e cibarsene.
    sun:
      ja-Hrkt: |-
        あのて　このてで　ひとを　おどろかし
        せいめいエネルギーを　すいとる。
        おどろかす　れんしゅうは　かかさない。
      ja: |-
        あの手　この手で　人を　驚かし
        生命エネルギーを　吸い取る。
        驚かす　練習は　欠かさない。
      ko: |-
        온갖 방법으로 사람을 놀라게 해서
        생명 에너지를 빨아들인다.
        놀라게 하는 연습을 꾸준히 한다.
      zh-Hant: |-
        千方百計地驚嚇人類，
        吸取生命的能量。
        嚇人的練習從來不曾間斷。
      zh-Hans: |-
        千方百计地吓唬人类，
        吸取生命的能量。
        吓人的练习一天也不落。
      en: |-
        It will use any means necessary to frighten
        people and absorb their life energy. It practices
        constantly to hone its skill in causing fear.
      fr: |-
        Il ne recule devant rien pour effrayer les
        humains et leur voler leur énergie vitale.
        Pour cela, il s’entraîne régulièrement à faire peur.
      de: |-
        Es lässt nichts unversucht, um Menschen
        zu erschrecken und ihnen Lebensenergie
        abzusaugen. Dafür übt es regelmäßig.
      es: |-
        Atemoriza a la gente de distintas formas y
        absorbe su energía vital. Entrena todos los días
        para no perder su toque terrorífico.
      it: |-
        Assorbe l’energia vitale degli esseri umani
        terrorizzandoli. Si allena per cercare di essere
        il più spaventoso possibile.
    moon:
      ja-Hrkt: |-
        だれもいない　へやから　すすりなく
        ような　こえが　きこえたら　それは
        ムウマの　イタズラに　ちがいない。
      ja: |-
        誰もいない　部屋から　すすり泣く
        ような　声が　聞こえたら　それは
        ムウマの　イタズラに　違いない。
      ko: |-
        아무도 없는 방에서 흐느껴 우는
        듯한 소리가 들린다면 그것은
        무우마의 장난임에 틀림없다.
      zh-Hant: |-
        如果從四下無人的房間裡
        傳來抽泣般的聲音，
        那一定是夢妖的惡作劇。
      zh-Hans: |-
        如果从四下无人的房间里
        传来抽泣般的声音，
        那准是梦妖的恶作剧。
      en: |-
        If you hear a sobbing sound emanating from a
        vacant room, it’s undoubtedly a bit of mischief
        from Misdreavus.
      fr: |-
        Si vous entendez des pleurs provenant d’une
        pièce vide, c’est sûrement un Feuforêve
        qui vous fait une farce.
      de: |-
        Hört man ein Schluchzen in einem leeren Zimmer,
        handelt es sich dabei eindeutig um einen Streich
        von Traunfugil.
      es: |-
        Si se escucha un sollozo proveniente de una
        habitación que en teoría está vacía, es probable
        que sea Misdreavus haciendo de las suyas.
      it: |-
        Se vi sembra di sentire qualcuno singhiozzare
        in una stanza apparentemente vuota, è
        sicuramente un Misdreavus in vena di scherzi.
    ultra-sun:
      ja-Hrkt: |-
        おどろかせることが　いきがい。
        くびの　あかいたまに　みみを　あてると
        なかから　ひめいが　きこえてくるぞ。
      ja: |-
        驚かせることが　生きがい。
        首の　赤い玉に　耳を　あてると
        中から　悲鳴が　聞こえてくるぞ。
      ko: |-
        놀라게 하는 것이 삶의 낙이다.
        목의 빨간 구슬에 귀를 대면
        안에서 비명이 들려온다.
      zh-Hant: |-
        把嚇唬別人當成自己活著的意義。
        如果把耳朵貼近牠脖子上的紅珠子，
        就會聽見裡頭傳來哀嚎的聲音。
      zh-Hans: |-
        吓唬别人是其活着的意义。
        如果把耳朵贴近它脖子上的红珠子，
        就能从中听到悲鸣声。
      en: |-
        What gives meaning to its life is surprising
        others. If you set your ear against the red orbs
        around its neck, you can hear shrieking.
      fr: |-
        Effrayer les gens est sa raison d’être. Si l’on
        presse l’oreille contre les sphères rouges de
        son cou, on peut entendre des gémissements.
      de: |-
        Andere zu erschrecken ist sein Lebenssinn.
        Wenn man das Ohr auf die roten Kugeln an
        seinem Hals legt, kann man Hilfeschreie hören.
      es: |-
        Vive para asustar a la gente. Al acercar la oreja
        a las perlas rojas de su cuello, pueden oírse
        sollozos de angustia en su interior.
      it: |-
        Terrorizzare gli altri è la sua ragione d’essere.
        Avvicinando l’orecchio alle sfere rosse che ha
        al collo, si sentono grida e gemiti.
    ultra-moon:
      ja-Hrkt: |-
        ひとが　なきさけぶ　こえを　まねて
        みんなを　おびえさせ　よろこぶ。
        きもが　すわった　あいては　にがて。
      ja: |-
        人が　泣き叫ぶ　声を　真似て
        みんなを　おびえさせ　喜ぶ。
        肝が　据わった　相手は　苦手。
      ko: |-
        사람이 울부짖는 소리를 흉내 내
        모두를 겁주고 기뻐한다.
        담력이 강한 상대는 좋아하지 않는다.
      zh-Hant: |-
        會藉由模仿人哭叫的聲音
        嚇唬大家來取樂。
        不擅長應付膽大的對手。
      zh-Hans: |-
        会通过模仿人哭叫的声音
        来吓唬大家并以此为乐。
        不擅长对付胆大的对手。
      en: |-
        What makes it happy is imitating the voices of
        weeping people and scaring everyone. It doesn’t
        deal well with folks who aren’t easily frightened.
      fr: |-
        Il adore faire peur aux humains en imitant
        leurs pleurs, et n’apprécie guère ceux qui
        ne se laissent pas intimider.
      de: |-
        Es genießt es, das Schluchzen eines Menschen
        nachzuahmen und andere damit zu erschrecken.
        Wen das kaltlässt, den kann es nicht leiden.
      es: |-
        Disfruta imitando llantos humanos para asustar
        a la gente. Los valientes no le caen demasiado
        bien.
      it: |-
        Si diverte a seminare il terrore imitando le grida
        e i lamenti degli esseri umani.
        Non ha vita facile con chi non si lascia intimidire.
