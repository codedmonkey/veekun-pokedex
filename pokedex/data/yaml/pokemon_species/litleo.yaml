        und umso kraftvoller wird es.
      es: |-
        Cuanto más poderoso es el enemigo al que se enfrenta, más
        calor desprende su mechón y más energía recorre todo su
        cuerpo.
      it: |-
        Più l’avversario che affronta è temibile, più la sua criniera
        si scalda, aumentandone la forza.
    alpha-sapphire:
      ja-Hrkt: |-
        つよくなるため　むれを　はなれて
        １ぴきで　せいかつするようになる。
        けっきさかんで　けんかっぱやい。
      ja: |-
        強くなるため　群れを　離れて
        １匹で　生活するようになる。
        血気盛んで　ケンカっ早い。
      ko: |-
        강해지기 위해 무리를 벗어나
        홀로 생활하게 된다.
        혈기 왕성하여 쉽게 싸우려 든다.
      en: |-
        They set off on their own from their pride
        and live by themselves to become stronger.
        These hot-blooded Pokémon are quick to fight.
      fr: |-
        Il n’hésite pas à quitter la horde et à mener une existence
        solitaire pour mieux pouvoir s’entraîner. Il a le sang chaud
        et ne rechigne pas au combat.
      de: |-
        Sie verlassen ihr Rudel schon sehr früh, um stärker
        zu werden und auf eigenen Pfoten zu stehen.
        Sie sind sehr hitzköpfig und streitlustig.
      es: |-
        Se separa de su manada para hacerse más fuerte y aprender
        a valerse por sí mismo. Su excesiva fogosidad le hace saltar
        a la mínima.
      it: |-
        Si allontana dal gruppo e inizia una vita solitaria per diventare
        più forte. Ha un carattere impetuoso ed è sempre pronto a
        gettarsi nella mischia.
    ultra-sun:
      ja-Hrkt: |-
        おさないころは　なかまと　むれている。
        じぶんで　えものを　かるようになると
        むれから　おいだされ　ひとりだちする。
      ja: |-
        幼い頃は　仲間と　群れている。
        自分で　獲物を　狩るようになると
        群れから　追い出され　独り立ちする。
      ko: |-
        어릴 때는 동료와 무리를 이룬다.
        스스로 먹이를 사냥할 수 있게 되면
        무리에서 쫓겨나 독립한다.
      zh-Hant: |-
        小時候會和夥伴們群居在一起，
        當成長到能自己捕捉獵物之後，
        就會被趕出群體獨立生活。
      zh-Hans: |-
        小时候会与伙伴们群居生活。
        一旦自己能捕猎后，
        就会被赶出群体独立生活。
      en: |-
        When they’re young, they live with a pride. Once
        they’re able to hunt prey on their own, they’re
        kicked out and have to make their own way.
      fr: |-
        Il est élevé avec ses congénères au sein
        de la troupe, mais dès qu’il peut chasser seul,
        il doit partir et vivre par ses propres moyens.
      de: |-
        Bis es seine Beute selbst fangen kann, bewegt
        es sich in Rudeln. Danach wird es verstoßen und
        muss auf eigenen Pfoten stehen.
      es: |-
        Mientras es solo una cría vive con el resto de la
        manada, pero en cuanto aprende a cazar se
        separa del grupo y se independiza.
      it: |-
        Da piccolo vive in gruppo con i suoi simili, ma
        appena impara a catturare da solo le sue prede
        viene allontanato e diventa indipendente.
    ultra-moon:
      ja-Hrkt: |-
        けっきさかんで　こうきしんおうせい。
        おこったり　たたかいが　はじまると
        みじかい　たてがみは　あつくなる。
      ja: |-
        血気盛んで　好奇心旺盛。
        怒ったり　戦いが　始まると
        短い　たてがみは　熱くなる。
      ko: |-
        혈기가 왕성하고 호기심도 왕성하다.
        화가 나거나 싸움이 시작되면
        짧은 갈기가 뜨거워진다.
      zh-Hant: |-
        血氣方剛且好奇心旺盛。
        當牠生氣或是開始戰鬥時，
        短短的鬃毛就會變熱。
      zh-Hans: |-
        血气方刚且好奇心旺盛。
        如果生气或是开始战斗，
        短短的鬃毛就会变热。
      en: |-
        This hot-blooded Pokémon is filled with
        curiosity. When it gets angry or starts
        fighting, its short mane gets hot.
      fr: |-
        Il déborde d’énergie et de curiosité. Quand
        il se fâche ou qu’il s’apprête à se battre,
        sa courte crinière s’échauffe.
      de: |-
        Ein sehr aktives und neugieriges Pokémon.
        Bei Kampfbeginn und wenn es wütend ist,
        wird seine Mähne heiß.
      es: |-
        Este enérgico Pokémon es de naturaleza curiosa
        e inquieta y, tanto al comienzo de un combate
        como cuando se enoja, su crin prende fuego.
      it: |-
        Ha una spiccata curiosità ed è pieno di energie.
        Quando si arrabbia o si appresta a lottare,
        la sua corta criniera si scalda.
