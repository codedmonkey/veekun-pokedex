litleo:
  base_happiness: 70
  capture_rate: 220
  color: brown
  egg_groups:
    - ground
  evolution_chain: litleo
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        つよい　あいてに　たちむかうときほど
        たてがみが　こうおんになり
        ぜんしんに　ちからが　みなぎるのだ。
      ja: |-
        強い　相手に　立ち向かうときほど
        たてがみが　高温になり
        全身に　力が　みなぎるのだ。
      ko: |-
        강한 상대에게 맞설 때일수록
        갈기의 온도가 높아지고
        전신에 힘이 넘쳐난다.
      en: |-
        The stronger the opponent it faces,
        the more heat surges from its mane
        and the more power flows through its body.
      fr: |-
        Plus l’adversaire auquel il est confronté est fort,
        plus la température de sa crinière augmente, l’énergie
        générée se diffusant alors dans tout son corps.
      de: |-
        Je stärker sein Gegner ist, desto heißer wird seine
        Mähne und umso kraftvoller wird es.
      es: |-
        Cuanto más poderoso es el enemigo al que se
        enfrenta, más calor desprende su mechón y más
        energía recorre todo su cuerpo.
      it: |-
        Più l’avversario che affronta è temibile, più la sua
        criniera si scalda, aumentandone la forza.
    'y':
      ja-Hrkt: |-
        つよくなるため　むれを　はなれて
        １ぴきで　せいかつするようになる。
        けっきさかんで　けんかっぱやい。
      ja: |-
        強くなるため　群れを　離れて
        １匹で　生活するようになる。
        血気盛んで　ケンカっ早い。
      ko: |-
        강해지기 위해 무리를 벗어나
        홀로 생활하게 된다.
        혈기 왕성하여 쉽게 싸우려 든다.
      en: |-
        They set off on their own from their pride
        and live by themselves to become stronger.
        These hot-blooded Pokémon are quick to fight.
      fr: |-
        Il n’hésite pas à quitter la horde et à mener une
        existence solitaire pour mieux pouvoir s’entraîner.
        Il a le sang chaud et ne rechigne pas au combat.
      de: |-
        Sie verlassen ihr Rudel schon sehr früh, um stärker
        zu werden und auf eigenen Pfoten zu stehen.
        Sie sind sehr hitzköpfig und streitlustig.
      es: |-
        Se separa de su manada para hacerse más fuerte
        y aprender a valerse por sí mismo. Su excesiva
        fogosidad le hace saltar a la mínima.
      it: |-
        Si allontana dal gruppo e inizia una vita solitaria per
        diventare più forte. Ha un carattere impetuoso ed è
        sempre pronto a gettarsi nella mischia.
    omega-ruby:
      ja-Hrkt: |-
        つよい　あいてに　たちむかうときほど
        たてがみが　こうおんになり
        ぜんしんに　ちからが　みなぎるのだ。
      ja: |-
        強い　相手に　立ち向かうときほど
        たてがみが　高温になり
        全身に　力が　みなぎるのだ。
      ko: |-
