avalugg:
  base_happiness: 50
  capture_rate: 55
  color: blue
  egg_groups:
    - monster
    - mineral
  evolution_chain: bergmite
  evolves_from: bergmite
  flavor_text:
    x:
      ja-Hrkt: |-
        こおりついた　からだは　こうてつの
        ように　かたい。たちふさがる　ものを
        きょたいで　おしつぶし　いどうする。
      ja: |-
        凍りついた　体は　鋼鉄のように
        硬い。立ちふさがる　ものを
        巨体で　押しつぶし　移動する。
      ko: |-
        얼어붙은 몸은 강철처럼
        단단하다. 앞을 가로막는 것을
        커다란 몸으로 파괴하며 이동한다.
      en: |-
        Its ice-covered body is as hard as steel.
        Its cumbersome frame crushes anything that
        stands in its way.
      fr: |-
        Son immense corps recouvert de glace est aussi
        solide que de l’acier. Quand il se déplace, il écrase
        tout qui se trouve sur son passage.
      de: |-
        Sein eisbedeckter Körper ist so hart wie Stahl.
        Es nutzt diese stahlharte Hülle, um Hindernisse
        zu zerschmettern und sich so seinen Weg zu bahnen.
      es: |-
        Su cuerpo, cubierto de hielo, es tan duro como el
        propio acero. Su abultada figura le permite arramblar
        con todo lo que se encuentra a su paso.
      it: |-
        Il suo enorme corpo di ghiaccio è duro come l’acciaio.
        Avanza distruggendo tutto ciò che gli si para davanti.
    'y':
      ja-Hrkt: |-
        せなかに　すうひきの　カチコールを
        のせて　くらす　ようすは　まるで
        こおりの　こうくうぼかんのようだ。
      ja: |-
        背中に　数匹の　カチコールを
        乗せて　暮らす　様子は
        まるで　氷の　航空母艦のようだ。
      ko: |-
        등에 수 마리의 꽁어름을
        태우고 지내는 모습은 마치
        얼음으로 된 항공모함 같다.
      en: |-
        The way several Bergmite huddle
        on its back makes it look like
        an aircraft carrier made of ice.
      fr: |-
        Quand on le voit transportant les petits Grelaçon
        qui vivent sur son dos, il y a une ressemblance
        certaine avec les véhicules déplaçant les fusées.
      de: |-
        Mit den zahlreichen Arktip auf seinem Rücken sieht es
        aus wie ein Flugzeugträger aus Eis.
      es: |-
        Parece un portaaviones de hielo, por el aspecto que
        presenta al llevar varios Bergmite en su espalda.
      it: |-
        Ospita numerosi Bergmite sul suo dorso, come
        una vera e propria portaerei di ghiaccio.
    omega-ruby:
      ja-Hrkt: |-
        こおりついた　からだは　こうてつの
        ように　かたい。たちふさがる　ものを
