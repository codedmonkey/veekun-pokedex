    sword:
      ja-Hrkt: |-
        なんびきもの　カチコールを　せなかに
        のせて　こういどの　つめたい　うみを
        ひょうざんに　まぎれて　およぐ。
      ja: |-
        何匹もの　カチコールを　背中に
        乗せて　高緯度の　冷たい　海を
        氷山に　紛れて　泳ぐ。
      ko: |-
        여러 마리의 꽁어름을 등에
        태우고 고위도의 차가운 바다를
        빙산 속에 섞여 헤엄친다.
      zh-Hant: |-
        把好幾隻冰寶馱在背上，
        混進眾多冰山之間，
        在高緯度的寒冷大海裡游動。
      zh-Hans: |-
        把好几只冰宝驮在背上，
        混进众多冰山之间，
        在高纬度的寒冷大海里游动。
      en: |-
        At high latitudes, this Pokémon can be found
        with clusters of Bergmite on its back as it swims
        among the icebergs.
      fr: |-
        Il sillonne les eaux glacées des pôles en se mêlant
        aux icebergs, une foule de Grelaçon collée
        à son dos.
      de: |-
        Mit unzähligen Arktip auf dem Rücken schwimmt
        es wie ein Eisberg durch die kalten Meere hoher
        Breitengrade.
      es: |-
        Surca las aguas de mares gélidos, situados a altas
        latitudes, llevando a varios Bergmite en el lomo y
        confundiéndose entre los icebergs.
      it: |-
        Nuota nei freddi mari polari ospitando numerosi
        Bergmite sulla schiena e confondendosi tra
        gli iceberg.
    shield:
      ja-Hrkt: |-
        にっちゅうの　かつどうで　からだの
        きれつは　ふかくなるが　ひとばんで
        きれつの　ない　からだに　もどる。
      ja: |-
        日中の　活動で　体の
        亀裂は　深くなるが　一晩で
        亀裂の　ない　体に　もどる。
      ko: |-
        낮 동안의 활동으로 몸의 균열이
        깊어지지만 하룻밤 사이에
        균열이 없는 몸으로 돌아간다.
      zh-Hant: |-
        雖然身體的裂縫會因
        白天的活動而變大，
        但只要一晚就能全部長好。
      zh-Hans: |-
        虽然身体的裂缝会因
        白天的活动而变大，
        但只要一晚就能全部长好。
      en: |-
        As Avalugg moves about during the day,
        the cracks in its body deepen. The Pokémon’s
        body returns to a pristine state overnight.
      fr: |-
        Les crevasses sur son dos s’approfondissent
        au cours de la journée, mais se comblent
        de nouveau pendant la nuit.
      de: |-
        Die Risse auf seinem Körper werden im Zuge
        seiner täglichen Aktivitäten tiefer. Ihm genügt
        jedoch eine Nacht, um sie wieder zu schließen.
      es: |-
        Las fisuras de su cuerpo se agrandan durante
        el día, pero por la noche vuelven a cerrarse.
      it: |-
        Durante il giorno le crepe sul suo corpo
        diventano più profonde, ma nel giro di una
        notte si riempiono del tutto.
