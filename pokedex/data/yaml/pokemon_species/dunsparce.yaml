    black-2:
      en: |-
        It creates mazes in dark locations.
        When spotted, it flees into the
        ground by digging with its tail.
    white-2:
      en: |-
        It creates mazes in dark locations.
        When spotted, it flees into the
        ground by digging with its tail.
    x:
      ja-Hrkt: |-
        だれかに　みられると
        しっぽで　じめんを　ほって
        うしろむきに　にげだすのだ。
      ja: |-
        だれかに　見られると
        尻尾で　地面を　掘って
        後ろ向きに　逃げ出すのだ。
      ko: |-
        누군가에게 들키면
        꼬리로 땅을 파서
        뒤쪽으로 도망친다.
      en: |-
        When spotted, this Pokémon escapes backward by
        furiously boring into the ground with its tail.
      fr: |-
        Il s’enfuit en creusant à reculons dans le sol avec
        sa queue dès qu’un ennemi le repère.
      de: |-
        Wird es entdeckt, flüchtet dieses Pokémon,
        indem es sich mit seinem Schweif in den Boden gräbt.
      es: |-
        Este Pokémon escapa hacia atrás perforando el suelo
        con su cola, si es descubierto.
      it: |-
        Se lo si scopre, questo Pokémon fugge all’indietro
        scavando furiosamente nel terreno con la coda.
    'y':
      ja-Hrkt: |-
        しっぽで　じめんを　ほって
        めいろのような　すあなを　つくる。
        はねで　すこしだけ　とべる。
      ja: |-
        尻尾で　地面を　掘って
        迷路のような　巣穴を　作る。
        羽で　少しだけ　飛べる。
      ko: |-
        꼬리로 땅을 파서
        미로 같은 둥지를 만든다.
        날개로 조금 날 수 있다.
      en: |-
        It digs into the ground with its tail and makes a
        mazelike nest. It can fly just a little.
      fr: |-
        Son nid est un véritable labyrinthe qu’il creuse à l’aide
        de sa queue. Il sait à peine voler.
      de: |-
        Es gräbt sich mit seinem Schweif in die Erde und baut
        ein labyrinthartiges Nest. Es kann kaum fliegen.
      es: |-
        Cava el suelo con su cola para construir su
        madriguera. Puede volar distancias cortas.
      it: |-
        Scava nel terreno con la coda creando una tana
        simile a un labirinto. Sa spiccare brevissimi voli.
    omega-ruby:
      ja-Hrkt: |-
        ドリルの　シッポを　つかって　うしろむきに
        じめんを　ほりすすみ　ふくざつな　かたちの
        すあなを　ちちゅう　ふかくに　つくる　ポケモン。
      ja: |-
        ドリルの　シッポを　使って　後ろ向きに
        地面を　掘り進み　複雑な　形の
        巣穴を　地中　深くに　つくる　ポケモン。
      ko: |-
        드릴 꼬리를 사용해서 뒤쪽을 향해
        땅을 파고 들어가 복잡한 형태의
        둥지를 땅속 깊이 만드는 포켓몬이다.
      en: |-
        Dunsparce has a drill for its tail. It uses this tail to burrow into
        the ground backward. This Pokémon is known to make its
        nest in complex shapes deep under the ground.
      fr: |-
        Insolourdo a une perceuse au bout de la queue. Il l’utilise
        pour creuser des souterrains, à reculons. On dit que ce
        Pokémon enfouit son nid aux formes complexes sous terre.
      de: |-
        Dummisel hat einen Bohrer als Schweif. Diesen benutzt es,
        um sich rückwärts in den Boden einzugraben. Dieses Pokémon
        baut seinen Nestkomplex tief unter der Erdoberfläche auf.
      es: |-
        La cola de Dunsparce es un taladro que usa para enterrarse
        en el suelo de espaldas. De todos es sabido que este
        Pokémon hace su nido a gran profundidad y con una forma
        muy compleja.
      it: |-
        Dunsparce ha un trapano al posto della coda, che usa per
        scavare a ritroso nel terreno. È noto per la complessa forma
        delle tane che crea sottoterra in profondità.
    alpha-sapphire:
      ja-Hrkt: |-
        ドリルの　シッポを　つかって　うしろむきに
        じめんを　ほりすすみ　ふくざつな　かたちの
        すあなを　ちちゅう　ふかくに　つくる　ポケモン。
      ja: |-
        ドリルの　シッポを　使って　後ろ向きに
        地面を　掘り進み　複雑な　形の
        巣穴を　地中　深くに　つくる　ポケモン。
      ko: |-
        드릴 꼬리를 사용해서 뒤쪽을 향해
        땅을 파고 들어가 복잡한 형태의
        둥지를 땅속 깊이 만드는 포켓몬이다.
      en: |-
        Dunsparce has a drill for its tail. It uses this tail to burrow into
        the ground backward. This Pokémon is known to make its
        nest in complex shapes deep under the ground.
      fr: |-
        Insolourdo a une perceuse au bout de la queue. Il l’utilise
        pour creuser des souterrains, à reculons. On dit que ce
        Pokémon enfouit son nid aux formes complexes sous terre.
      de: |-
        Dummisel hat einen Bohrer als Schweif. Diesen benutzt es,
        um sich rückwärts in den Boden einzugraben. Dieses Pokémon
        baut seinen Nestkomplex tief unter der Erdoberfläche auf.
      es: |-
        La cola de Dunsparce es un taladro que usa para enterrarse
        en el suelo de espaldas. De todos es sabido que este
        Pokémon hace su nido a gran profundidad y con una forma
        muy compleja.
      it: |-
        Dunsparce ha un trapano al posto della coda, che usa per
        scavare a ritroso nel terreno. È noto per la complessa forma
        delle tane che crea sottoterra in profondità.
    ultra-sun:
      ja-Hrkt: |-
        じめんを　ほりすすみ　いどう。
        ディグダと　おたがいの　トンネルを
        なかよく　きょうよう　している。
      ja: |-
        地面を　掘り進み　移動。
        ディグダと　お互いの　トンネルを
        仲良く　共用　している。
      ko: |-
        지면을 파고 다니며 이동한다.
        디그다와 서로의 터널을
        사이좋게 같이 사용하고 있다.
      zh-Hant: |-
        會挖掘地面來移動。
        與地鼠保持著友好的關係，
        會共用彼此的隧道。
      zh-Hans: |-
        能挖掘地面移动。
        会友好地和地鼠共用各自的隧道。
      en: |-
        It travels by digging through the ground.
        Diglett and Dunsparce share one another’s
        tunnels happily.
      fr: |-
        Il se déplace en creusant dans le sol et partage
        les tunnels ainsi créés avec les Taupiqueur.
        Ces Pokémon s’entendent très bien.
      de: |-
        Sie bewegen sich fort, indem sie sich durch den
        Boden graben. Da Dummisel sich mit Digda gut
        verstehen, teilen sie ihre Tunnel miteinander.
      es: |-
        Se desplaza excavando túneles subterráneos.
        Se lleva bien con los Diglett, con quienes suele
        compartir túneles.
      it: |-
        Si sposta scavando nel terreno.
        I Dunsparce e i Diglett condividono di buon
        grado i tunnel che scavano.
    ultra-moon:
      ja-Hrkt: |-
        ひとの　すがたを　みると　シッポで
        あなを　ほって　にげてしまう。
        もし　であえたなら　ラッキーだよ。
      ja: |-
        人の　姿を　見ると　シッポで
        穴を　掘って　逃げてしまう。
        もし　出会えたなら　ラッキーだよ。
      ko: |-
        사람의 모습을 보면 꼬리로
        구멍을 파서 도망가 버린다.
        만났다면 운이 좋은 것이다.
      zh-Hant: |-
        一看到人就會用尾巴
        挖洞逃走。如果能夠遇見牠，
        代表你很幸運。
      zh-Hans: |-
        一看到人就会用尾巴挖洞逃走。
        如果遇到了它，就说明你很幸运哦。
      en: |-
        When it sees a person, it digs a hole with its tail
        to make its escape. If you happen to find one,
        consider yourself lucky.
      fr: |-
        Quand il aperçoit la silhouette d’un humain,
        il s’enfuit en creusant un trou avec sa queue.
        Quiconque en voit un peut s’estimer chanceux !
      de: |-
        Erblickt es einen Menschen, bohrt es mit seinem
        Schweif ein Loch und ergreift sofort die Flucht.
        Man braucht viel Glück, um ihm zu begegnen.
      es: |-
        En cuanto ve un humano, horada en el suelo un
        agujero con la cola y huye. Quien logra ver uno
        puede considerarse afortunado.
      it: |-
        Appena scorge un essere umano fugge
        scavando con la coda. Incontrarne uno è
        un vero e proprio colpo di fortuna.
    sword:
      ja-Hrkt: |-
        ちいさな　ハネを　もっていることから
        おおむかしは　そらを　とんでいたと
        しゅちょうする　がくしゃもいる。
      ja: |-
        小さな　ハネを　持っていることから
        大昔は　空を　飛んでいたと
        主張する　学者もいる。
      ko: |-
        작은 날개를 갖고 있어서
        먼 옛날에는 하늘을 날았다고
        주장하는 학자도 있다.
      zh-Hant: |-
        因為牠擁有小小的翅膀，
        有些學者主張很久以前
        牠曾是在天上飛的。
      zh-Hans: |-
        因为长着小小的翅膀，
        有些学者认为它
        在很久以前是会飞的。
      en: |-
        This Pokémon’s tiny wings have some scientists
        saying that Dunsparce used to fly through the sky
        in ancient times.
      fr: |-
        Des savants affirment que ses petites ailes sont
        la preuve qu’il y a fort longtemps, il était capable
        de voler.
      de: |-
        Da es kleine Flügel hat, behaupten manche
        Wissenschaftler, dass es vor langer Zeit fliegen
        konnte.
      es: |-
        Debido a que presenta pequeñas alas, algunos
        científicos sostienen que antiguamente era capaz
        de volar.
      it: |-
        Secondo alcuni studiosi, le sue piccole ali sono
        la prova che in un lontano passato questo
        Pokémon fosse in grado di volare.
    shield:
      ja-Hrkt: |-
        めいろのような　すあなが　すみか。
        つちの　においで　じぶんの　ばしょが
        わかるので　ぜったいに　まよわない。
      ja: |-
        迷路のような　巣穴が　すみか。
        土の　匂いで　自分の　場所が
        わかるので　ぜったいに　迷わない。
      ko: |-
        미로 같은 굴에 산다.
        흙냄새로 자신이 있는 곳을
        알 수 있어 절대 길을 잃지 않는다.
      zh-Hant: |-
        居住在像是迷宮的巢穴裡。
        能憑土壤的氣味知道自己的
        位置，所以絕對不會迷路。
      zh-Hans: |-
        栖息在像迷宫一样的巢穴里。
        能通过土壤的气味来判断自己的
        位置，所以绝对不会迷路。
      en: |-
        The nests Dunsparce live in are mazes of tunnels.
        They never get lost in their own nests—they can
        tell where they are by the scent of the dirt.
      fr: |-
        Bien que son nid ressemble à un labyrinthe,
        il ne s’y perd jamais, car il se repère grâce
        à l’odeur de la terre.
      de: |-
        Es lebt in einem labyrinthartigen Nestkomplex.
        Anhand des Geruchs der Erde weiß Dummisel
        genau, wo es sich befindet und verirrt sich nie.
      es: |-
        Habita en madrigueras laberínticas. Gracias a su
        capacidad para ubicarse por el olor de la tierra
        que lo rodea, nunca se pierde.
      it: |-
        Costruisce tane simili a labirinti, ma poiché
        riesce a capire dove si trova in base all’odore
        del terreno non si smarrisce mai.
