palpitoad:
  base_happiness: 50
  capture_rate: 120
  color: blue
  egg_groups:
    - water1
  evolution_chain: tympole
  evolves_from: tympole
  flavor_text:
    black:
      en: |-
        When they vibrate the bumps on their
        heads, they can make waves in water
        or earthquake-like vibrations on land.
      fr: |-
        Quand il fait vibrer la bosse sur sa tête,
        il provoque des ondulations dans l’eau,
        mais aussi des tremblements de terre.
    white:
      en: |-
        It lives in the water and on land.
        It uses its long, sticky tongue
        to capture prey.
      fr: |-
        Il vit dans l’eau et sur la terre ferme.
        Il attrape ses proies avec sa langue
        longue et gluante.
    black-2:
      en: |-
        It lives in the water and on land.
        It uses its long, sticky tongue
        to immobilize its opponents.
    white-2:
      en: |-
        It lives in the water and on land.
        It uses its long, sticky tongue
        to immobilize its opponents.
    x:
      ja-Hrkt: |-
        あたまの　コブを　しんどうさせると
        すいちゅうが　なみだつ　だけでなく
        じめんも　じしんのように　ゆれる。
      ja: |-
        頭の　コブを　振動させると
        水中が　波立つ　だけでなく
        地面も　地震のように　揺れる。
      ko: |-
        머리의 혹을 진동시키면
        물속에 파동이 일어나며
        땅마저 지진처럼 흔들린다.
      en: |-
        When they vibrate the bumps on their heads, they
        can make waves in water or earthquake-like
        vibrations on land.
      fr: |-
        Quand il fait vibrer la bosse sur sa tête, il provoque
        des ondulations dans l’eau, mais aussi des
        tremblements de terre.
      de: |-
        Wenn es die Beulen auf seinem Kopf zum
        Schwingen bringt, tobt je nach Umgebung
        entweder das Wasser oder die Erde bebt.
      es: |-
        Cuando hace vibrar el bulto de su cabeza, no solo se
        embravece el mar, sino que la tierra también tiembla.
      it: |-
        Se fa vibrare il bernoccolo sulla testa può sollevare
        onde nell’acqua e anche provocare terremoti.
    'y':
      ja-Hrkt: |-
        すいちゅうと　りくちで　くらす。
        ながく　ねばねばする　ベロをつかって
        あいての　うごきを　ふうじこめる。
      ja: |-
        水中と　陸地で　暮らす。
        長く　ねばねばする　ベロを使って
        相手の　動きを　封じこめる。
      ko: |-
        수중과 육지에서 살며
        길고 끈적이는 혀를 사용하여
        상대의 움직임을 봉쇄한다.
      en: |-
        It lives in the water and on land. It uses its long,
        sticky tongue to immobilize its opponents.
      fr: |-
        Il vit dans l’eau et sur la terre ferme. Il immobilise
        ses proies avec sa langue longue et gluante.
      de: |-
        Es lebt zu Wasser und zu Lande. Mit seiner langen,
        klebrigen Zunge raubt es Gegnern die
        Bewegungsfreiheit.
      es: |-
        Vive tanto en tierra como en el fondo del mar. Con su
        larga y viscosa lengua, inmoviliza a sus contrincantes.
      it: |-
        Vive in acqua e sulla terraferma. Immobilizza la preda
        con la sua lunga lingua appiccicosa.
    omega-ruby:
      ja-Hrkt: |-
        あたまの　コブを　しんどうさせると
        すいちゅうが　なみだつ　だけでなく
        じめんも　じしんのように　ゆれる。
      ja: |-
        頭の　コブを　振動させると
        水中が　波立つ　だけでなく
        地面も　地震のように　揺れる。
      ko: |-
        머리의 혹을 진동시키면
        물속에 파동이 일어나며
        땅마저 지진처럼 흔들린다.
      en: |-
        When they vibrate the bumps on their heads, they
        can make waves in water or earthquake-like
        vibrations on land.
      fr: |-
        Quand il fait vibrer la bosse sur sa tête, il provoque
        des ondulations dans l’eau, mais aussi des tremblements
        de terre.
      de: |-
        Wenn es die Beulen auf seinem Kopf zum Schwingen bringt,
        tobt je nach Umgebung entweder das Wasser oder die Erde
        bebt.
      es: |-
        Cuando hace vibrar el bulto de su cabeza, no solo se
        embravece el mar, sino que la tierra también tiembla.
      it: |-
        Se fa vibrare il bernoccolo sulla testa può sollevare onde
        nell’acqua e anche provocare terremoti.
    alpha-sapphire:
      ja-Hrkt: |-
        すいちゅうと　りくちで　くらす。
        ながく　ねばねばする　ベロをつかって
        あいての　うごきを　ふうじこめる。
      ja: |-
        水中と　陸地で　暮らす。
        長く　ねばねばする　ベロを使って
        相手の　動きを　封じこめる。
      ko: |-
        수중과 육지에서 살며
        길고 끈적이는 혀를 사용하여
        상대의 움직임을 봉쇄한다.
      en: |-
        It lives in the water and on land. It uses its long,
        sticky tongue to immobilize its opponents.
      fr: |-
        Il vit dans l’eau et sur la terre ferme. Il immobilise ses proies
        avec sa langue longue et gluante.
      de: |-
        Es lebt zu Wasser und zu Lande. Mit seiner langen,
        klebrigen Zunge raubt es Gegnern die Bewegungsfreiheit.
      es: |-
        Vive tanto en tierra como en el fondo del mar. Con su larga
        y viscosa lengua, inmoviliza a sus contrincantes.
      it: |-
        Vive in acqua e sulla terraferma. Immobilizza la preda con la
        sua lunga lingua appiccicosa.
    sword:
      ja-Hrkt: |-
        ずつうを　おこすほどの　おんぱで
        えものを　じゅうぶん　よわらせて
        ネバネバした　ベロで　からめとる。
      ja: |-
        頭痛を　起こすほどの　音波で
        獲物を　じゅうぶん　弱らせて
        ネバネバした　ベロで　絡めとる。
      ko: |-
        두통을 일으킬 정도의 음파로
        먹이를 충분히 약하게 만든 뒤
        끈적끈적한 혀로 포박한다.
      zh-Hant: |-
        透過發出足以造成頭痛的
        音波來充分削弱獵物之後，
        用黏糊糊的舌頭將其捉住。
      zh-Hans: |-
        通过发出足以造成头痛的
        音波来充分削弱猎物之后，
        用黏糊糊的舌头将其捉住。
      en: |-
        It weakens its prey with sound waves intense
        enough to cause headaches, then entangles
        them with its sticky tongue.
      fr: |-
        Il affaiblit ses proies en émettant des ondes
        si fortes qu’elles leur donnent la migraine.
        Ensuite, il les saisit avec sa langue gluante.
      de: |-
        Es schwächt seine Beute mit Kopfschmerzen
        erregenden Schallwellen und umschlingt
        sie anschließend mit seiner klebrigen Zunge.
      es: |-
        Las ondas sonoras que emite pueden provocar
        dolor de cabeza. Con ellas debilita a sus presas
        para luego atraparlas con su lengua viscosa.
      it: |-
        Indebolisce la preda con onde sonore in grado
        di causare emicranie e poi la cattura con la sua
        lingua appiccicosa.
    shield:
      ja-Hrkt: |-
        きれいな　こえで　なくこともある。
        からだの　とっきが　おおきいほど
        ひろい　おんいきで　なけるのだ。
      ja: |-
        きれいな　声で　鳴くこともある。
        体の　突起が　大きいほど
        広い　音域で　鳴けるのだ。
      ko: |-
        고운 목소리로 울 때도 있다.
        몸의 돌기가 클수록
        넓은 음역으로 울 수 있다.
      zh-Hant: |-
        有時也會發出悅耳的叫聲。
        身上突起物越大的藍蟾蜍
        越能以更廣的音域來鳴叫。
      zh-Hans: |-
        有时也会发出悦耳的叫声。
        身上突起物越大的蓝蟾蜍
        越能在更广的音域来鸣叫。
      en: |-
        On occasion, their cries are sublimely pleasing to
        the ear. Palpitoad with larger lumps on their
        bodies can sing with a wider range of sounds.
      fr: |-
        Il lui arrive de pousser des cris ravissants.
        Plus ses protubérances sont grosses,
        plus le son porte loin.
      de: |-
        Gelegentlich singt es sehr schön. Je größer die
        Fortsätze an seinem Körper ausgebildet sind,
        desto ausgeprägter fällt sein Stimmumfang aus.
      es: |-
        A veces emiten un bello canto. Cuanto mayores
        son las protuberancias del cuerpo, más extenso
        es su registro vocal.
      it: |-
        A volte emette un canto di notevole bellezza.
        Più grandi sono i bernoccoli che ha sul corpo,
        più ampio è il registro dei suoni che produce.
