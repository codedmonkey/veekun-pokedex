yamper:
  base_happiness: 50
  capture_rate: 255
  color: yellow
  egg_groups:
    - ground
  evolution_chain: yamper
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        はしる　ときに　しっぽの　ねもとから
        でんきを　うみだす。　ガラルでは
        ぼくようけん　として　にんき。
      ja: |-
        走る　ときに　しっぽの　根元から
        電気を　生み出す。　ガラルでは
        牧羊犬として　人気。
      ko: |-
        달릴 때 꼬리가 시작되는 부분에서
        전기를 만들어 낸다. 가라르에서는
        양치기로 인기가 많다.
      zh-Hant: |-
        奔跑的時候會從尾巴的根部
        製造出電能。在伽勒爾
        是很受歡迎的牧羊犬。
      zh-Hans: |-
        奔跑的时候会从尾巴的根部
        制造出电能。在伽勒尔
        是很受欢迎的牧羊犬。
      en: |-
        This Pokémon is very popular as a herding dog
        in the Galar region. As it runs, it generates
        electricity from the base of its tail.
      fr: |-
        Lorsqu’il court, on peut voir de l’électricité
        se former à la base de sa queue. Ce Pokémon
        est très populaire auprès des bergers de Galar.
      de: |-
        Beim Rennen erzeugt es Elektrizität in seinem
        Schwanzansatz. In der Galar-Region erfreut es
        sich bei Hirten großer Beliebtheit.
      es: |-
        Al correr, genera electricidad por la base de la
        cola. Es muy popular entre los pastores de Galar.
      it: |-
        Quando corre produce elettricità dalla base
        della coda. A Galar è apprezzato soprattutto
        per l’aiuto che fornisce ai pastori nei pascoli.
    shield:
      ja-Hrkt: |-
        おやつに　つられて　ひとの　しごとを
        てつだう　くいしんぼう。　パチパチと
        でんきを　まとって　ひたはしる。
      ja: |-
        おやつに　釣られて　人の　仕事を
        手伝う　食いしん坊。　パチパチと
        電気を　まとって　ひた走る。
      ko: |-
        간식에 끌려 사람의 일을
        돕는 먹보다. 탁탁 튀는
        전기를 두르고 계속 달린다.
      zh-Hant: |-
        因為想要得到零食而
        幫助人類工作的貪吃鬼。
        總是帶著電火花跑來跑去。
      zh-Hans: |-
        因为想要得到零食而
        帮助人类工作的贪吃鬼。
        总是带着电火花跑来跑去。
      en: |-
        This gluttonous Pokémon only assists people with
        their work because it wants treats. As it runs,
        it crackles with electricity.
      fr: |-
        Ce glouton assiste les humains dans leur travail
        en échange de friandises. Il court sans arrêt,
        le corps enveloppé d’électricité.
      de: |-
        Im Austausch gegen Leckerlis hilft dieser kleine
        Vielfraß Menschen bei der Arbeit. Beim Rennen
        wird es von knisternder Elektrizität umhüllt.
      es: |-
        Son muy glotones, por lo que ayudan a la gente
        a cambio de comida. Echan chispas al correr.
      it: |-
        È un golosone e aiuta gli uomini in cambio
        di ghiottonerie. Corre di qua e di là
        emettendo scintille da tutto il corpo.
