tentacool:
  base_happiness: 50
  capture_rate: 190
  color: blue
  egg_groups:
    - water3
  evolution_chain: tentacool
  evolves_from: ~
  flavor_text:
    red:
      en: |-
        Drifts in shallow
        seas. Anglers who
        hook them byaccident are
        often punished by
        its stinging acid.
    blue:
      en: |-
        Drifts in shallow
        seas. Anglers who
        hook them byaccident are
        often punished by
        its stinging acid.
    yellow:
      en: |-
        It can sometimes
        be found all dry
        and shriveled upon a beach. Toss
        it back into the
        sea to revive it.
    gold:
      en: |-
        When the tide goes
        out, dehydrated
        TENTACOOL remainscan be found
        washed up on the
        shore.
    silver:
      en: |-
        It drifts aimless­
        ly in waves. Very
        difficult to seein water, it may
        not be noticed
        until it stings.
    crystal:
      en: |-
        As it floats along
        on the waves, it
        uses its toxicfeelers to stab
        anything it
        touches.
    ruby:
      en: |-
        TENTACOOL’s body is largely composed
        of water. If it is removed from the
        sea, it dries up like parchment.If this POKéMON happens to become
        dehydrated, put it back into the sea.
    sapphire:
      en: |-
        TENTACOOL absorbs sunlight and
        refracts it using water inside its body
        to convert it into beam energy.This POKéMON shoots beams from its
        crystal-like eyes.
    emerald:
      en: |-
        Its body is almost entirely composed of
        water. It ensnares its foe with its two
        long tentacles, then stabs with the poison
        stingers at their tips.
    firered:
      en: |-
        Its eyes are as transparent as crystals.
        From them, it shoots mysterious
        beams of light.
    leafgreen:
      en: |-
        Drifts in shallow seas. Anglers who hook
        them by accident are often punished by
        their stingers.
    diamond:
      en: |-
        Its body is virtually composed of
        water. It shoots strange beams
        from its crystal-like eyes.
    pearl:
      en: |-
        It drifts in sea currents.
        Countless fishermen are
        hurt by its poison stingers.
    platinum:
      en: |-
        Because its body is almost entirely
        composed of water, it shrivels up if
        it is washed ashore.
    heartgold:
      en: |-
        When the tide goes out, dehydrated
        TENTACOOL remains can be found
        washed up on the shore.
    soulsilver:
      en: |-
        It drifts aimlessly in waves. Very
        difficult to see in water, it may
        not be noticed until it stings.
    black:
      en: |-
        Because its body is almost entirely
        composed of water, it shrivels up if
        it is washed ashore.
      fr: |-
        Presque entièrement composé d’eau,
        son corps a tendance à se dessécher
        sur la terre ferme.
    white:
      en: |-
        Because its body is almost entirely
        composed of water, it shrivels up if
        it is washed ashore.
      fr: |-
        Presque entièrement composé d’eau,
        son corps a tendance à se dessécher
        sur la terre ferme.
    black-2:
      en: |-
        Because its body is almost entirely
        composed of water, it shrivels up if
        it is washed ashore.
    white-2:
      en: |-
        Because its body is almost entirely
        composed of water, it shrivels up if
        it is washed ashore.
    x:
      ja-Hrkt: |-
        からだの　ほとんどが　すいぶん。
        すいしょうのような　めだまから
        ふしぎな　ビームを　はっしゃする。
      ja: |-
        体の　ほとんどが　水分。
        水晶のような　目玉から
        不思議な　ビームを　発射する。
      ko: |-
        몸 대부분이 수분이다.
        수정 같은 눈에서
        이상한 빔을 발사한다.
      en: |-
        Its body is virtually composed of water. It shoots
        strange beams from its crystal-like eyes.
      fr: |-
        Son corps est principalement composé d’eau.
        Ses yeux cristallins projettent d’étranges rayons.
      de: |-
        Sein Körper besteht aus Wasser. Aus seinen
        kristallartigen Augen verschießt es eigenartige
        Strahlen.
      es: |-
        Su cuerpo se compone casi en exclusiva de agua.
        Lanza extraños rayos con sus ojos cristalinos.
      it: |-
        Il suo corpo è quasi interamente composto d’acqua.
        Emette dei raggi misteriosi dagli occhi cristallini.
    'y':
      ja-Hrkt: |-
        うみの　あさい　ところを　ただよう。
        つりびとが　まちがって　つりあげ
        さされる　ことが　おおいと　きく。
      ja: |-
        海の　浅い　ところを　漂う。
        釣り人が　間違って　釣り上げ
        刺されることが　多いと　聞く。
      ko: |-
        바다 얕은 곳을 떠다닌다.
        낚시꾼이 실수로 낚아 올려
        찔리는 일이 많다고 한다.
      en: |-
        Drifts in shallow seas. Anglers who hook them by
        accident are often punished by their stingers.
      fr: |-
        Il vit en bord de mer. Les pêcheurs se font souvent
        arroser d’acide quand ils en accrochent un.
      de: |-
        Dieses Pokémon findet man in flachen Gewässern.
        Unachtsame Gegner empfängt es mit brennendem Gift.
      es: |-
        Va a la deriva a poca profundidad. Si es pescado por
        accidente, el castigo será su punzante ácido.
      it: |-
        Va alla deriva in acque poco profonde. Se pescato
        per sbaglio, colpisce con gli aculei pungenti.
    omega-ruby:
      ja-Hrkt: |-
        からだの　ほとんどが　みずで　できているので
        うみから　でると　からからに　ひからびてしまう。
        ひからびた　ときは　うみに　もどしてあげよう。
      ja: |-
        体の　ほとんどが　水で　できているので
        海から　出ると　からからに　干からびてしまう。
        干からびた　ときは　海に　戻してあげよう。
      ko: |-
        몸 대부분이 물로 되어 있어
        바다에서 나오면 바싹 말라버린다.
        말라버렸을 때는 바다로 돌려보내 주자.
      en: |-
        Tentacool’s body is largely composed of water. If it is removed
        from the sea, it dries up like parchment. If this Pokémon
        happens to become dehydrated, put it back into the sea.
      fr: |-
        Le corps de Tentacool est principalement aqueux. Si on le
        retire de l’eau, il se déshydrate complètement. Si cela arrive,
        il suffit de le replonger dans un liquide pour qu’il reprenne
        sa forme normale.
      de: |-
        Tentachas Körper setzt sich zum größten Teil aus Wasser
        zusammen. Wenn es das Meer verlässt, vertrocknet es.
        Wenn dieses Pokémon auszutrocknen beginnt, sollte man
        es schnell wieder ins Wasser zurückbringen.
      es: |-
        Tentacool está compuesto en su mayor parte por agua. Si se
        le saca del mar, se secará y se quedará acartonado. Si este
        Pokémon se deshidrata, hay que echarlo inmediatamente de
        vuelta al mar.
      it: |-
        Il corpo di Tentacool è costituito quasi solo d’acqua.
        Se pescato ed esposto all’aria, si secca totalmente.
        In caso di disidratazione, dunque, si consiglia di rimetterlo
        in mare.
    alpha-sapphire:
      ja-Hrkt: |-
        たいようこうせんを　からだの　なかの　すいぶんで
        くっせつさせて　ビームの　エネルギーに　かえる。
        すいしょうの　ような　めだまから　はっしゃする。
      ja: |-
        太陽光線を　体の　中の　水分で
        屈折させて　ビームの　エネルギーに　変える。
        水晶の　ような　目玉から　発射する。
      ko: |-
        태양 광선을 몸 안의 수분으로
        굴절시켜서 빔 에너지로 바꾼다.
        수정 같은 눈알에서 발사된다.
      en: |-
        Tentacool absorbs sunlight and refracts it using water inside
        its body to convert it into beam energy. This Pokémon shoots
        beams from the small round organ above its eyes.
      fr: |-
        Grâce à l’eau de son corps, Tentacool convertit la lumière
        du soleil absorbée et la renvoie sous forme de rayon
        d’énergie. Ce Pokémon lance ces rayons par le petit
        organe rond situé au-dessus de ses yeux.
      de: |-
        Tentacha nimmt Sonnenlicht auf und bricht es in seinem Körper
        mithilfe von Wasser, um es in Strahlenenergie umzuwandeln.
        Dieses Pokémon verschießt Strahlen aus dem kleinen, runden
        Organ über seinen Augen.
      es: |-
        Tentacool absorbe luz solar, la refracta a través del agua que
        tiene en su interior y la convierte en un rayo de energía. Este
        Pokémon tiene un órgano que parece de cristal sobre los ojos
        por el cual dispara los rayos.
      it: |-
        Tentacool assorbe la luce solare e la rifrange usando l’acqua
        che ha nel corpo per convertirla in raggi energetici.
        Successivamente emette questi raggi dalla piccola sfera rossa
        che ha sulla testa.
    sun:
      ja-Hrkt: |-
        ビーチなどで　ひからびているが
        まだ　いきていることも　おおい。
        みずに　ひたせば　ふやけて　ふっかつ。
      ja: |-
        ビーチなどで　干からびているが
        まだ　生きていることも　多い。
        水に　浸せば　ふやけて　復活。
      ko: |-
        해변 등에서 말라버렸지만
        아직 살아 있는 경우도 많다.
        물에 적시면 불면서 부활한다.
      zh-Hant: |-
        就算在沙灘等地方曬得乾乾的，
        在很多情況下依然可以存活。
        泡在水裡就會回復濕潤而復活了。
      zh-Hans: |-
        在沙滩等地方晒干后，
        依然能存活的情况也有很多。
        泡在水里的话就会湿润复活。
      en: |-
        They can be found lying dehydrated on
        beaches, but they are often still alive.
        When soaked in water, they will revive.
      fr: |-
        On en trouve parfois échoués sur le sable et
        desséchés, mais certains sont encore en vie. Il
        suffit de les mettre à l’eau pour les ranimer.
      de: |-
        Am Strand kann man oft stark ausgetrocknete
        Exemplare finden, die aber noch leben. Taucht
        man sie in Wasser, werden sie wieder topfit.
      es: |-
        A veces es posible encontrarlos deshidratados
        en la playa, pero, si se los pone en remojo,
        volverán a henchirse de vida.
      it: |-
        Se ne trovano spesso esemplari disidratati
        sulla spiaggia. Se rigettati in acqua, di solito
        si riprendono immediatamente.
    moon:
      ja-Hrkt: |-
        すなはま　などの　あさせを　ただよう。
        どくの　しょくしゅに　さされたり
        かまれたら　びょういんに　いそげ。
      ja: |-
        砂浜　などの　浅瀬を　漂う。
        毒の　触手に　刺されたり
        かまれたら　病院に　急げ。
      ko: |-
        모래 해변 등의 얕은 물가를 떠돈다.
        독 촉수에 쏘이거나
        물리면 서둘러 병원에 가자.
      zh-Hant: |-
        漂浮在沙灘等淺灘地區。
        要是被牠有毒的觸手刺到或是被咬到，
        就趕快去醫院吧。
      zh-Hans: |-
        漂浮在沙滩等浅滩地区。
        一旦被有毒的触手刺到或是被咬到，
        就要立刻去医院。
      en: |-
        It drifts in shallow seas, such as the areas near
        beaches. If you get bitten or stabbed by its
        toxic tentacles, rush to the hospital.
      fr: |-
        Il flotte dans les chenaux sablonneux. En cas de
        piqûre par l’un de ses tentacules empoisonnés,
        il faut aller à l’hôpital de toute urgence.
      de: |-
        Es treibt durch seichte Gewässer in der Nähe
        von Stränden. Durch seine Tentakel verursachte
        Verletzungen müssen sofort untersucht werden.
      es: |-
        Suele rondar las aguas poco profundas de la
        orilla. Sus tentáculos son muy venenosos y, en
        caso de picadura, hay que correr al hospital.
      it: |-
        Si aggira nelle secche vicino alle spiagge.
        Se si viene punti dai suoi tentacoli velenosi,
        è meglio correre subito all’ospedale.
    ultra-sun:
      ja-Hrkt: |-
        うみべを　ただよい　えものを　さがす。
        どくの　しょくしゅは　ちぎれることも
        あるが　じかんが　たてば　はえてくる。
      ja: |-
        海辺を　漂い　獲物を　探す。
        毒の　触手は　ちぎれることも
        あるが　時間が　経てば　生えてくる。
      ko: |-
        해변을 떠다니며 먹이를 찾는다.
        독이 있는 촉수는 끊어지기도 하지만
        시간이 흐르면 다시 자란다.
      zh-Hant: |-
        會漂浮在海邊尋找獵物。
        有毒的觸手有時也會斷掉，
        但過了一段時間就會重新長出來。
      zh-Hans: |-
        会漂浮在海边寻找猎物。
        虽然有毒的触手也会断掉，
        但过一段时间就会重新长出来。
      en: |-
        It drifts through the sea searching for prey.
        Its poisonous tentacles break off sometimes,
        but after a while, they grow back.
      fr: |-
        Il flotte près des côtes à la recherche de proies.
        Il lui arrive de perdre ses tentacules toxiques,
        mais ceux-ci repoussent avec le temps.
      de: |-
        Es treibt in Küstennähe im Wasser und sucht
        nach Beute. Seine giftigen Tentakel fallen ab und
        zu ab, wachsen aber mit der Zeit wieder nach.
      es: |-
        Ronda las costas en busca de presas. Si pierde
        alguno de sus tentáculos venenosos, le volverá
        a crecer al cabo del tiempo.
      it: |-
        Fluttua in acqua lungo la costa in cerca di prede.
        I tentacoli velenosi a volte si staccano, ma col
        tempo ricrescono.
    ultra-moon:
      ja-Hrkt: |-
        からだの　９９パーセントが　すいぶん。
        のこりの　１パーセントに　どくそを
        つくる　きかんが　あるのだ。
      ja: |-
        身体の　９９パーセントが　水分。
        残りの　１パーセントに　毒素を
        作る　器官が　あるのだ。
      ko: |-
        몸의 99퍼센트가 수분이다.
        남은 1퍼센트에 독소를
        만드는 기관이 있다.
      zh-Hant: |-
        身體的９９％是水分。
        剩下的１％之中包含了
        用來製造毒素的器官。
      zh-Hans: |-
        身体的９９％是水分。
        剩下的１％中包含了
        用来制造毒素的器官。
      en: |-
        Its body is 99% water. The remaining 1%
        contains the organ that makes its poison.
      fr: |-
        Son corps est composé à 99 % d’eau. Le 1 %
        restant est occupé par l’organe qui sécrète
        les toxines.
      de: |-
        Es besteht zu 99 % aus Wasser. Das restliche
        1 % wird von einem Organ für die Giftproduktion
        eingenommen.
      es: |-
        Su cuerpo está compuesto de agua en un 99%.
        El 1% restante es el órgano que segrega sus
        toxinas.
      it: |-
        Il 99% del suo corpo è composto d’acqua.
        Il restante 1% è costituito da un organo
        che produce una sostanza velenosa.
    lets-go-pikachu:
      ja-Hrkt: |-
        なみうちぎわに　ひからびた　すがたを
        はっけん　することも　あるが　みずに
        つけてやれば　ふっかつする。
      ja: |-
        波打ち際に　干からびた　姿を
        発見　することも　あるが　水に
        浸けてやれば　復活する。
      ko: |-
        물가에 바싹 마른 상태로
        발견될 때도 있지만
        물에 담가주면 부활한다.
      zh-Hant: |-
        有時可以在海邊看見牠
        被曬乾的樣子，但只要把牠
        放進水裡就能讓牠復活。
      zh-Hans: |-
        有时能在沙滩上发现它
        干巴巴的身体，但是
        它只要沾到水就能复活。
      en: |-
        It can sometimes be found all dry and
        shriveled up on a beach. Toss it back
        into the sea to revive it.
      fr: |-
        Certains échouent sur la plage et sèchent sur
        le sable. Poussez-les dans l’eau pour les ranimer.
      de: |-
        Findet man ein schwaches, ausgetrocknetes
        Tentacha am Strand und bringt es ins Wasser
        zurück, so wird es wieder topfit.
      es: |-
        A veces pueden encontrarse deshidratados en
        las playas, pero reviven al sumergirlos de nuevo
        en el agua.
      it: |-
        A volte lo si può trovare tutto rinsecchito
        sulla spiaggia, ma basta gettarlo in mare
        e si riprende all’istante.
    lets-go-eevee:
      ja-Hrkt: |-
        なみうちぎわに　ひからびた　すがたを
        はっけん　することも　あるが　みずに
        つけてやれば　ふっかつする。
      ja: |-
        波打ち際に　干からびた　姿を
        発見　することも　あるが　水に
        浸けてやれば　復活する。
      ko: |-
        물가에 바싹 마른 상태로
        발견될 때도 있지만
        물에 담가주면 부활한다.
      zh-Hant: |-
        有時可以在海邊看見牠
        被曬乾的樣子，但只要把牠
        放進水裡就能讓牠復活。
      zh-Hans: |-
        有时能在沙滩上发现它
        干巴巴的身体，但是
        它只要沾到水就能复活。
      en: |-
        It can sometimes be found all dry and
        shriveled up on a beach. Toss it back
        into the sea to revive it.
      fr: |-
        Certains échouent sur la plage et sèchent sur
        le sable. Poussez-les dans l’eau pour les ranimer.
      de: |-
        Findet man ein schwaches, ausgetrocknetes
        Tentacha am Strand und bringt es ins Wasser
        zurück, so wird es wieder topfit.
      es: |-
        A veces pueden encontrarse deshidratados en
        las playas, pero reviven al sumergirlos de nuevo
        en el agua.
      it: |-
        A volte lo si può trovare tutto rinsecchito
        sulla spiaggia, ma basta gettarlo in mare
        e si riprende all’istante.
    sword:
      ja-Hrkt: |-
        およぐ　ちからは　つよくは　ない。
        あさい　うみの　みなもを
        ただよいながら　エモノを　さがす。
      ja: |-
        泳ぐ　力は　強くは　ない。
        浅い　海の　水面を
        漂いながら　獲物を　探す。
      ko: |-
        헤엄치는 힘은 강하지 않다.
        얕은 바다 수면을 떠다니면서
        먹이를 찾는다.
      zh-Hant: |-
        游泳的力道並不強。
        會漂浮在淺海的水面上
        尋找獵物。
      zh-Hans: |-
        游泳能力并不强。
        会漂浮在浅海的水面上
        寻找猎物。
      en: |-
        Tentacool is not a particularly strong swimmer.
        It drifts across the surface of shallow seas as it
        searches for prey.
      fr: |-
        Peu doué pour la natation, ce Pokémon
        se contente de flotter à la surface des eaux
        peu profondes pour chasser ses proies.
      de: |-
        Da Tentacha kein besonders guter Schwimmer ist,
        treibt es in seichten Gewässern an der
        Wasseroberfläche und sucht nach Beute.
      es: |-
        Sus facultades natatorias son más bien escasas,
        por lo que se limita a flotar a la deriva en aguas
        poco profundas en busca de alimento.
      it: |-
        Non essendo molto abile a nuotare, va in cerca
        di prede fluttuando in acque poco profonde.
    shield:
      ja-Hrkt: |-
        ほとんどが　すいぶんで　できている
        からだは　うみの　なかでは　みずと
        どうかして　とても　みえづらいのだ。
      ja: |-
        ほとんどが　水分で　できている。
        体は　海の中では　水と　同化して
        とても　見えづらいのだ。
      ko: |-
        몸의 대부분이 수분이어서
        바닷속에서는 물과
        동화되어 매우 구분하기 힘들다.
      zh-Hant: |-
        絕大部分都是由水組成的身體
        在海中會與海水同化，
        令其他生物很難看見牠。
      zh-Hans: |-
        身体的大部分由水组成。
        在海中，会和海水混为一体，
        非常难以发现。
      en: |-
        This Pokémon is mostly made of water.
        A Tentacool out in the ocean is very hard to
        spot, because its body blends in with the sea.
      fr: |-
        Il est presque totalement composé d’eau.
        Lorsqu’il s’immerge dans les flots, son corps se
        fond dans l’eau, ce qui le rend presque invisible.
      de: |-
        Tentacha besteht fast vollständig aus Wasser,
        wodurch man es im Meer nur sehr schwer
        erkennen kann.
      es: |-
        Su cuerpo está compuesto casi por completo de
        agua, por lo que resulta muy difícil distinguirlo
        cuando está sumergido en el mar.
      it: |-
        Il suo corpo composto quasi interamente
        d’acqua rende molto difficile individuarlo
        quando è in mare.
