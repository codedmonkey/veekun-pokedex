        with its horn.
    crystal:
      en: |-
        With its Herculean
        powers, it can
        easily throw arou­nd an object that
        is 100 times its
        own weight.
    ruby:
      en: |-
        HERACROSS charges in a straight line at
        its foe, slips beneath the foe’s grasp,
        and then scoops up and hurls theopponent with its mighty horn.
        This POKéMON even has enough power
        to topple a massive tree.
    sapphire:
      en: |-
        HERACROSS has sharp claws on its feet.
        These are planted firmly into the
        ground or the bark of a tree, giving thePOKéMON a secure and solid footing
        to forcefully fling away foes with
        its proud horn.
    emerald:
      en: |-
        They gather in forests seeking the sweet
        sap of trees. It is completely clad in a
        steel-hard shell. It is proud of its horn,
        which it uses to fling foes.
    firered:
      en: |-
        Usually docile, but if disturbed while
        sipping honey, it chases off the intruder
        with its horn.
    leafgreen:
      en: |-
        This powerful POKéMON thrusts its prized
        horn under its enemies’ bellies, then lifts
        and throws them.
    diamond:
      en: |-
        It gathers in forests to search
        for tree sap, its favorite food.
        It’s strong enough to hurl foes.
    pearl:
      en: |-
        With powerful legs and claws,
        it generates enough power to hurl
        foes over great distances.
    platinum:
      en: |-
        It loves sweet honey. To keep all
        the honey to itself, it hurls rivals
        away with its prized horn.
    heartgold:
      en: |-
        This powerful Pokémon thrusts
        its prized horn under its enemies’
        bellies, then lifts and throws them.
    soulsilver:
      en: |-
        It is usually docile, but if it is
        disturbed while sipping honey,
        it chases off the intruder with its horn.
    black:
      en: |-
        It loves sweet honey. To keep all
        the honey to itself, it hurls rivals
        away with its prized horn.
      fr: |-
        Il défend vaillamment sa réserve de
        miel personnelle à grand renfort
        de coups de corne.
    white:
      en: |-
        It loves sweet honey. To keep all
        the honey to itself, it hurls rivals
        away with its prized horn.
      fr: |-
        Il défend vaillamment sa réserve de
        miel personnelle à grand renfort
        de coups de corne.
    black-2:
      en: |-
        No matter how heavy its opponents,
        it flings them far away
        with its prized horn.
    white-2:
      en: |-
        No matter how heavy its opponents,
        it flings them far away
        with its prized horn.
    x:
      ja-Hrkt: |-
        じまんのツノを　あいての　おなかの
        したに　ねじこみ　いっきに　もちあげ
        ぶんなげてしまう　ちからもち。
      ja: |-
        自慢のツノを　相手の　お腹の
        下に　ねじこみ　一気に　持ち上げ
        ぶん投げてしまう　力持ち。
      ko: |-
        자랑스러운 뿔을 상대의 배
        밑에 틀어박고 단번에 들어 올려
        집어 던지는 천하장사다.
      en: |-
        This powerful Pokémon thrusts its prized horn under
        its enemies’ bellies, then lifts and throws them.
      fr: |-
        Ce Pokémon est si puissant qu’il peut projeter ses
        ennemis en l’air grâce à ses cornes.
      de: |-
        Dieses kräftige Pokémon rammt sein stolzes Horn
        unter den Rumpf des Gegners und wirft ihn um.
      es: |-
        Este fuerte Pokémon clava su preciado cuerno en la
        tripa del enemigo, lo eleva y luego lo arroja.
      it: |-
        Questo potente Pokémon infilza con il corno la pancia
        del nemico, sollevandolo e lanciandolo lontano.
    'y':
      ja-Hrkt: |-
        ものすごい　かいりきの　もちぬし。
        じぶんの　たいじゅうの　１００ばいの
        おもさでも　らくに　ぶんなげる。
      ja: |-
        ものすごい　怪力の　持ち主。
        自分の　体重の　１００倍の
        重さでも　楽に　ぶん投げる。
      ko: |-
        엄청난 괴력의 소유자.
        자신 체중의 100배나 되는
        무게도 가뿐히 내던진다.
      en: |-
        With its Herculean powers, it can easily throw
        around an object that is 100 times its own weight.
      fr: |-
        Sa force herculéenne lui permet de soulever et de
        jeter plus de 100 fois son poids.
      de: |-
        Mit seiner herkulischen Kraft kann es Objekte,
        die hundertmal sein Körpergewicht haben,
        mühelos umwerfen.
      es: |-
        Tiene una fuerza descomunal. Puede, sin gran
        esfuerzo, arrojar objetos que superen su peso en
        cien veces.
      it: |-
        La forza erculea gli permette di lanciare oggetti
        100 volte più pesanti di lui.
    omega-ruby:
      ja-Hrkt: |-
        いっちょくせんに　てきの　ふところに　もぐりこみ
        たくましい　ツノで　すくいあげ　なげとばす。
        たいぼくも　ねこそぎ　たおす　ほどの　パワーだ。
      ja: |-
        一直線に　敵の　懐に　潜り込み
        たくましい　ツノで　すくい上げ　投げ飛ばす。
        大木も　根こそぎ　倒す　ほどの　パワーだ。
      ko: |-
        똑바로 적에게 돌격하여
        강인한 뿔로 들어 올려 내던진다.
        큰 나무도 뿌리째 뽑아 쓰러트릴 만한 파워다.
      en: |-
        Heracross charges in a straight line at its foe, slips beneath the
        foe’s grasp, and then scoops up and hurls the opponent with
        its mighty horn. This Pokémon even has enough power to
        topple a massive tree.
      fr: |-
        Scarhino charge ses ennemis en ligne droite, se glisse
        dessous, les attrape et les projette violemment d’un coup
        de sa puissante corne. Ce Pokémon est tellement fort
        qu’il pourrait déraciner un arbre.
      de: |-
        Skaraborn geht direkt auf seinen Gegner los, rutscht auf
        ihn zu, um ihn auszuhebeln und mit seinem mächtigen Horn
        wegzuschleudern. Dieses Pokémon hat genug Kraft, um einen
        massigen Baum umzustoßen.
      es: |-
        Heracross carga en línea recta contra el enemigo, se le queda
        encajado por debajo, lo agarra y lo lanza con ayuda del fuerte
        cuerno que tiene. Este Pokémon tiene fuerza hasta para echar
        abajo un árbol descomunal.
      it: |-
        Heracross si lancia all’attacco dritto contro il nemico,
        lo afferra con forza, lo solleva in aria e poi lo incorna
        violentemente scagliandolo lontano.
        Riesce ad abbattere un grosso albero.
    alpha-sapphire:
      ja-Hrkt: |-
        てあしの　するどい　ツメが　じめんや　じゅもくに
        ふかく　くいこむので　じまんの　ツノで　あいてを
        なげとばす　とき　おもいっきり　ふんばれるのだ。
      ja: |-
        手足の　鋭い　ツメが　地面や　樹木に
        深く　食い込むので　自慢の　ツノで　相手を
        投げ飛ばす　とき　思いっきり　踏ん張れるのだ。
      ko: |-
        손발의 날카로운 손발톱이 땅이나 나무에
        깊숙이 박히기 때문에 자랑스런 뿔로 상대를
        내던질 때 단단히 버틸 수 있다. 
      en: |-
        Heracross has sharp claws on its feet. These are planted
        firmly into the ground or the bark of a tree, giving the
        Pokémon a secure and solid footing to forcefully fling away
        foes with its proud horn.
      fr: |-
        Scarhino est doté de griffes acérées sur ses pieds. Elles se
        plantent fermement dans le sol ou dans l’écorce d’un arbre,
        ce qui permet à ce Pokémon d’être bien stable lorsqu’il veut
        projeter ses ennemis d’un coup de corne.
      de: |-
        Skaraborn hat scharfe Krallen an den Füßen. Diese bohren sich
        fest in den Boden oder in die Rinde eines Baumes und geben
        diesem Pokémon einen sicheren Halt. So kann es seine Gegner
        mit seinem imposanten Horn wegschleudern.
      es: |-
        Heracross tiene unas afiladas garras en los pies que se
        clavan con firmeza en la tierra o la corteza de los árboles,
        dando al Pokémon gran estabilidad y seguridad a la hora de
        embestir y herir a su rival con el cuerno que tiene.
      it: |-
        Heracross è dotato di artigli affilati sulle zampe inferiori,
        che conficca nel terreno o nella corteccia degli alberi per
        guadagnare stabilità mentre incorna violentemente i nemici
        e li scaglia lontano.
    ultra-sun:
      ja-Hrkt: |-
        ふといツノが　じまん。　アローラでは
        クワガノンが　さいだいの　ライバルで
        しょっちゅう　ケンカを　している。
      ja: |-
        太いツノが　自慢。　アローラでは
        クワガノンが　最大の　ライバルで
        しょっちゅう　ケンカを　している。
      ko: |-
        두꺼운 뿔이 자랑거리다. 
        알로라에서는 투구뿌논이
        최대 라이벌로 자주 싸움을 한다.
      zh-Hant: |-
        以擁有粗壯的角為傲。在阿羅拉，
        鍬農炮蟲是牠最大的競爭者，
        雙方經常大打出手。
      zh-Hans: |-
        粗粗的角是其骄傲。
        在阿罗拉，锹农炮虫是它最大的
        竞争者，双方经常大打出手。
      en: |-
        It’s proud of its thick horn. In Alola, its biggest
        rival is Vikavolt, which it’s always fighting with.
      fr: |-
        Il est très fier de sa grosse corne. Il se chamaille
        souvent avec Lucanon, son plus grand rival.
      de: |-
        Sein mächtiges Horn ist sein ganzer Stolz.
        Es streitet sich ständig mit Donarion, seinem
        größten Rivalen in Alola.
      es: |-
        Luce con orgullo su gran cornamenta. Los
        Vikavolt son sus mayores rivales en Alola y
        tienen enfrentamientos constantes.
      it: |-
        Il grosso corno è il suo punto di forza. Ad Alola
        ha una forte rivalità con i Vikavolt, con i quali
        è costantemente in lotta.
    ultra-moon:
      ja-Hrkt: |-
        あまいミツを　もとめ　もりの　なかを
        さがしまわる。　かいりきは　じまんだが
        とぶのは　あまり　とくいでは　ない。
      ja: |-
        甘いミツを　求め　森の　中を
        探しまわる。　怪力は　自慢だが
        飛ぶのは　あまり　得意では　ない。
      ko: |-
        달콤한꿀을 찾아 숲속을
        돌아다닌다. 괴력을 자랑하지만
        나는 것은 그리 잘하지 못한다.
      zh-Hant: |-
        會在森林中四處尋找甜甜蜜。
        雖然以擁有一身怪力為傲，
        但卻不是很擅長飛行。
      zh-Hans: |-
        会在森林中四处寻找甜甜蜜。
        虽然对于自己的一身怪力
        很是自豪，但却不怎么擅长飞行。
      en: |-
        It roams through forests searching for sweet
        nectar. Although it boasts fantastic physical
        strength, it’s not that good at flying.
      fr: |-
        Il parcourt les forêts à la recherche de miel.
        Il est très fier de sa force colossale, mais sa
        capacité à voler laisse quelque peu à désirer.
      de: |-
        Auf der Suche nach süßem Honig durchstreift
        es die Wälder. Es ist stolz auf seine Stärke,
        aber fliegen kann es nicht besonders gut.
      es: |-
        Ronda los bosques en busca de miel. Se jacta
        de su fuerza, pero su capacidad de vuelo deja
        mucho que desear.
      it: |-
        Si aggira per le foreste in cerca di miele.
        Possiede una forza spaventosa di cui va fiero,
        ma non è molto abile nel volo.
    sword:
      ja-Hrkt: |-
        あまい　じゅえきが　だいこうぶつ。
        ２ほんの　しょっかくで　においを
        たよりに　もりを　さがしまわる。
      ja: |-
        甘い　樹液が　大好物。
        ２本の　触角で　匂いを　頼りに
        森を　探しまわる。
      ko: |-
        달콤한 수액을 매우 좋아한다.
        2개의 더듬이로 냄새를 따라
        숲을 찾아다닌다.
      zh-Hant: |-
        非常喜歡甘甜的樹液。
        會用２隻觸角偵測氣味，
        在森林中四處覓食。
      zh-Hans: |-
        用２只触角来感知气味，
        以此在整片森林中寻找
        自己超爱的甘甜树汁。
      en: |-
        Heracross loves sweet sap and will go looking
        through forests for it. The Pokémon uses its two
        antennae to pick up scents as it searches.
      fr: |-
        Il raffole de la sève sucrée dont il détecte
        le parfum à l’aide de ses deux antennes
        lorsqu’il parcourt la forêt.
      de: |-
        Skaraborn verspeist am liebsten süßen Baumsaft.
        Mit seinen zwei Antennen nimmt es die Witterung
        auf, während es den Wald danach absucht.
      es: |-
        Adora la savia dulce de los árboles. Recorre
        el bosque en su busca y se sirve de las antenas
        para detectar su olor.
      it: |-
        È ghiotto della dolce linfa degli alberi.
        Perlustra la foresta alla sua ricerca, sfruttando
        le antenne per percepire gli odori.
    shield:
      ja-Hrkt: |-
        じぶんの　たいじゅうの　１００ばいの
        おもさでも　かるがる　もちあげる
        かいりき　じまんの　ポケモン。
      ja: |-
        自分の　体重の　１００倍の　重さでも
        軽がる　持ち上げる
        怪力　自慢の　ポケモン。
      ko: |-
        자신 몸무게의 100배에 달하는
        무게도 거뜬히 들어 올리는
        괴력을 자랑하는 포켓몬이다.
      zh-Hant: |-
        能夠輕輕鬆鬆舉起比自己
        體重還要重１００倍的物體，
        是以一身怪力為傲的寶可夢。
      zh-Hans: |-
        能轻轻松松地举起比自己
        体重还重１００倍的东西，
        是以一身怪力为傲的宝可梦。
      en: |-
        This Pokémon takes pride in its strength, which
        allows it to lift things 100 times heavier than
        itself with no trouble at all.
      fr: |-
        Ce Pokémon est fier de sa force colossale
        qui lui permet de soulever cent fois son propre
        poids avec facilité.
      de: |-
        Dieses Pokémon ist stolz auf seine Stärke. Es kann
        mit Leichtigkeit das Hundertfache seines eigenen
        Körpergewichts stemmen.
      es: |-
        Este Pokémon muestra una fuerza hercúlea, que
        le permite levantar cien veces su propio peso sin
        inmutarse.
      it: |-
        Questo Pokémon va molto fiero della sua forza
        erculea, che gli permette di sollevare senza fatica
        oggetti 100 volte più pesanti di lui.
    legends-arceus:
      en: |-
        This Pokémon has an unparalleled horn. Heracross itself
        demonstrates tremendous power—it's capable of throwing
        several people trained in the traditional arts of war at once.
