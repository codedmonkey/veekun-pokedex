    x:
      ja-Hrkt: |-
        からだの　よこがわにある　ラインは
        たいようのひかりを　ためておける。
        よるになると　あざやかに　かがやく。
      ja: |-
        体の　横側にある　ラインは
        太陽の光を　ためておける。
        夜になると　鮮やかに　輝く。
      ko: |-
        몸의 옆쪽에 있는 줄에
        태양의 빛을 모아둘 수 있다.
        밤이 되면 아름답게 빛난다.
      en: |-
        The line running down its side can store sunlight.
        It shines vividly at night.
      fr: |-
        La ligne qui fait le tour de son corps stocke l’énergie
        solaire et brille dans la nuit.
      de: |-
        Die Linie an seiner Seite kann Sonnenlicht
        speichern. Nachts leuchtet es sehr intensiv.
      es: |-
        La línea que le recorre el costado puede almacenar
        luz solar. Brilla con mucha fuerza por la noche.
      it: |-
        La linea che contorna il suo corpo immagazzina la
        luce solare. Di notte si illumina di una luce splendente.
    'y':
      ja-Hrkt: |-
        たいようを　いっぱいに　あびた
        おびれの　もようは　くらくなると
        あざやかな　いろで　ひかりだす。
      ja: |-
        太陽を　いっぱいに　浴びた
        尾びれの　模様は　暗くなると
        鮮やかな　色で　光り出す。
      ko: |-
        햇볕을 잔뜩 쬔 꼬리지느러미의
        무늬는 어두워지면 선명한 색으로
        반짝이기 시작한다.
      en: |-
        After long exposure to sunlight, the patterns on its
        tail fins shine vividly when darkness arrives.
      fr: |-
        Après une longue exposition au soleil, les motifs de
        ses nageoires caudales luisent à la nuit tombée.
      de: |-
        Wurden die Flossen lange dem Sonnenlicht
        ausgesetzt, leuchten sie in der Dunkelheit.
      es: |-
        Si se expone mucho al sol, los dibujos de sus aletas
        brillan en la oscuridad.
      it: |-
        Dopo una lunga esposizione al sole, i motivi sulle
        sue pinne brillano vividamente al calar dell’oscurità.
    omega-ruby:
      ja-Hrkt: |-
        からだの　よこがわにある　ラインは
        たいようのひかりを　ためておける。
        よるになると　あざやかに　かがやく。
      ja: |-
        体の　横側にある　ラインは
        太陽の光を　ためておける。
        夜になると　鮮やかに　輝く。
      ko: |-
        몸의 옆쪽에 있는 줄에
        태양의 빛을 모아둘 수 있다.
        밤이 되면 아름답게 빛난다.
      en: |-
        The line running down its side can store sunlight.
        It shines vividly at night.
      fr: |-
        La ligne qui fait le tour de son corps stocke l’énergie solaire
        et brille dans la nuit.
      de: |-
        Die Linie an seiner Seite kann Sonnenlicht speichern.
        Nachts leuchtet es sehr intensiv.
      es: |-
        La línea que le recorre el costado puede almacenar luz solar.
        Brilla con mucha fuerza por la noche.
      it: |-
        La linea che contorna il suo corpo immagazzina la luce solare.
        Di notte si illumina di una luce splendente.
    alpha-sapphire:
      ja-Hrkt: |-
        たいようを　いっぱいに　あびた
        おびれの　もようは　くらくなると
        あざやかな　いろで　ひかりだす。
      ja: |-
        太陽を　いっぱいに　浴びた
        尾びれの　模様は　暗くなると
        鮮やかな　色で　光り出す。
      ko: |-
        햇볕을 잔뜩 쬔 꼬리지느러미의
        무늬는 어두워지면 선명한 색으로
        반짝이기 시작한다.
      en: |-
        After long exposure to sunlight, the patterns on its
        tail fins shine vividly when darkness arrives.
      fr: |-
        Après une longue exposition au soleil, les motifs de
        ses nageoires caudales luisent à la nuit tombée.
      de: |-
        Wurden die Flossen lange dem Sonnenlicht ausgesetzt,
        leuchten sie in der Dunkelheit.
      es: |-
        Si se expone mucho al sol, los dibujos de sus aletas brillan
        en la oscuridad.
      it: |-
        Dopo una lunga esposizione al sole, i motivi sulle sue pinne
        brillano vividamente al calar dell’oscurità.
    sun:
      ja-Hrkt: |-
        ピンクいろの　かわの　ぶぶんは
        たいようこうを　ためて　ひかる。
        カモフラージュの　ためと　いわれる。
      ja: |-
        ピンク色の　皮の　部分は
        太陽光を　溜めて　光る。
        カモフラージュの　ためと　いわれる。
      ko: |-
        핑크색의 가죽 부분은
        태양광을 모아서 빛을 낸다.
        위장하기 위해서라고 전해진다.
      zh-Hant: |-
        粉紅色的皮膚部分
        會儲存太陽光發光。
        聽說是用來做保護色的。
      zh-Hans: |-
        粉红色的那部分皮肤
        会储存太阳光并发光。
        听说是用来做保护色的。
      en: |-
        It absorbs sunlight with the pink areas of its
        skin, which then shine. This appears to be a
        form of camouflage.
      fr: |-
        Il stocke les rayons solaires grâce aux parties
        roses de sa peau, qui brillent ensuite. Il s’agirait
        en fait d’une technique de camouflage.
      de: |-
        Der rosafarbene Teil seiner Haut speichert
        Sonnenlicht und leuchtet. Es wird angenommen,
        dass dies der Tarnung dient.
      es: |-
        Las marcas rosadas de su piel brillan con
        intensidad tras almacenar luz solar. Se cree
        que esta característica le permite camuflarse.
      it: |-
        I motivi rosa sul suo corpo brillano dopo aver
        immagazzinato la luce solare. Pare che questa
        sia una forma di mimetismo.
    moon:
      ja-Hrkt: |-
        ２まいの　おビレで　げんきにジャンプ。
        かいめんに　とびあがった　ところを
        キャモメが　くわえ　さらっていく。
      ja: |-
        ２枚の　尾ビレで　元気にジャンプ。
        海面に　飛びあがった　ところを
        キャモメが　くわえ　さらっていく。
      ko: |-
        2장의 꼬리지느러미로 힘차게 점프한다.
        해수면을 뛰어오르는 순간
        갈모매가 물고 가버린다.
      zh-Hant: |-
        用２枚尾鰭活力充沛地跳躍。
        跳出海面的那一刻，
        會被長翅鷗叼走。
      zh-Hans: |-
        用２片尾鳍活力四射地跳跃。
        跳出海面的那一刻，
        会被长翅鸥叼走。
      en: |-
        Its double tail fins propel its energetic jumps.
        When it breaks the surface of the sea, Wingull
        swoop down to grab it on the fly.
      fr: |-
        Avec sa double nageoire caudale, il peut bondir
        hors de l’eau. C’est souvent à ce moment que
        les Goélise de passage l’attrapent et le gobent.
      de: |-
        Mit ihren beiden Flossen können sie hoch in die
        Luft springen. Über der Meeresoberfläche lauern
        jedoch Wingull.
      es: |-
        Sus dos aletas le permiten saltar fuera del agua,
        momento que aprovechan los Wingull para
        llevárselos al buche.
      it: |-
        Le pinne caudali gli permettono di saltare fuori
        dall’acqua. Spesso Wingull approfitta di questi
        momenti per acchiapparlo al volo.
    ultra-sun:
      ja-Hrkt: |-
        ピンクいろの　もようは　よるになると
        ひかりだす。　ダイバーに　にんきなので
        リゾートちでは　えづけされることも。
      ja: |-
        ピンク色の　模様は　夜になると
        光りだす。　ダイバーに　人気なので
        リゾート地では　餌付けされることも。
      ko: |-
        핑크색 모양은 밤이 되면 빛이 난다.
        다이버에게 인기여서 리조트에서
        길들여지기도 한다.
      zh-Hant: |-
        粉紅色的花紋到了夜裡就會發光。
        由於很受潛水者的歡迎，
        在度假地有時會被人工馴養。
      zh-Hans: |-
        粉红色的花纹到了夜里就会发光。
        很受潜水者欢迎，
        所以有时会被驯养在度假地。
      en: |-
        When night falls, their pink patterns begin to
        shine. They’re popular with divers, so there are
        resorts that feed them to keep them close.
      fr: |-
        Les motifs roses de sa peau brillent la nuit.
        Des stations balnéaires l’attirent avec de la
        nourriture, car il est très aimé des plongeurs.
      de: |-
        Seine rosafarbene Musterung leuchtet in der
        Nacht. Wegen seiner Popularität unter Tauchern
        ist es ein gern gesehener Gast in Feriengebieten.
      es: |-
        Las marcas rosadas de su piel brillan al caer la
        noche. Triunfa entre los buceadores, por eso en
        los resorts turísticos le proporcionan alimento.
      it: |-
        I motivi rosa sul suo corpo brillano di notte.
        Poiché è molto amato dai sub, alcuni centri
        turistici li attirano con il cibo.
    ultra-moon:
      ja-Hrkt: |-
        ひかる　おびれで　えものを　さそう。
        ひるは　かいめん　ちかくに　いて
        よるに　なると　ふかみに　いどう。
      ja: |-
        光る　尾びれで　獲物を　誘う。
        昼は　海面　近くに　いて
        夜に　なると　深みに　移動。
      ko: |-
        빛나는 꼬리지느러미로 먹이를 유인한다.
        낮에는 해수면 가까이 있다가
        밤이 되면 깊은 곳으로 이동한다.
      zh-Hant: |-
        會用發光的尾鰭引誘獵物。
        白天會待在海面附近，
        到了夜裡就會向深海移動。
      zh-Hans: |-
        用发光的尾鳍引诱猎物。
        白天会在海面附近，
        到了夜里就向海的深处移动。
      en: |-
        It lures in prey with its shining tail fins. It stays
        near the surface during the day and moves to
        the depths when night falls.
      fr: |-
        Il attire ses proies avec ses nageoires caudales
        lumineuses. Il passe la journée à la surface
        et se retire dans les abysses la nuit venue.
      de: |-
        Seine leuchtenden Flossen locken Beute an. Bei
        Tag bleibt es nahe an der Wasseroberfläche,
        während es abends in den Tiefen verschwindet.
      es: |-
        Por el día permanece cerca de la superficie y se
        retira a las profundidades por la noche. Atrae a
        las presas con sus brillantes aletas caudales.
      it: |-
        Attira la preda con le sue brillanti pinne.
        Di giorno nuota vicino alla superficie del mare,
        mentre di notte si sposta in profondità.
    legends-arceus:
      en: |-
        What a gorgeous sight this Pokémon is as it swims with its long,
        pink-painted caudal fins fluttering behind it. Finneon's beautiful
        appearance has led to its nickname: ”finery fish.”
