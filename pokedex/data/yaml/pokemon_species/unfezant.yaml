        cabeza. Al volar, la hembra es mucho más diestra que el
        macho.
      it: |-
        Il maschio minaccia il nemico facendo ondeggiare gli
        ornamenti del capo. La femmina eccelle nel volo.
    alpha-sapphire:
      ja-Hrkt: |-
        オスは　あたまに　かざりを　もつ。
        トレーナー　いがいの　ひとには
        けっして　なつかない　せいしつ。
      ja: |-
        オスは　頭に　飾りを　持つ。
        トレーナー　以外の　人には
        けっして　懐かない　性質。
      ko: |-
        수컷은 머리에 장식이 있다.
        트레이너가 아닌 사람은
        절대 따르지 않는 성질을 가졌다.
      en: |-
        Males have plumage on their heads. They will never
        let themselves feel close to anyone other than
        their Trainers.
      fr: |-
        Ils sont très farouches et ne s’attachent qu’à leur Dresseur.
        Les mâles ont une parure sur la tête.
      de: |-
        Männliche Exemplare tragen eine Verzierung am Kopf.
        Lässt sich von Natur aus nur auf seinen Trainer ein.
      es: |-
        El macho hace gala de ornamentación en la cabeza. No es
        dado a hacerse amigo de alguien que no sea su Entrenador.
      it: |-
        Il maschio ha una decorazione sulla fronte. Per indole, non si
        affeziona a nessuno tranne l’Allenatore.
    sword:
      ja-Hrkt: |-
        たかい　ひこうのうりょくを　もち
        メスは　じきゅうりょくに　すぐれる。
        ひこうスピードは　オスが　まさる。
      ja: |-
        高い　飛行能力を　もち
        メスは　持久力に　優れる。
        飛行スピードは　オスが　勝る。
      ko: |-
        높은 비행 능력을 가졌다.
        암컷은 지구력이 뛰어나며
        수컷은 비행 속도가 뛰어나다.
      zh-Hant: |-
        擁有高度的飛行能力。
        雌性擅於持久，
        雄性擅長速度。
      zh-Hans: |-
        拥有高度的飞行能力。
        雌性擅于持久，
        雄性擅长速度。
      en: |-
        Unfezant are exceptional fliers. The females
        are known for their stamina, while the males
        outclass them in terms of speed.
      fr: |-
        Ce Pokémon a une excellente technique de vol.
        Les femelles ont plus d’endurance que les mâles,
        mais ces derniers peuvent voler plus vite.
      de: |-
        Sie verfügen über exzellente Flugfertigkeiten.
        Weibchen können länger fliegen, aber dafür
        erreichen Männchen ein höheres Flugtempo.
      es: |-
        Hacen gala de una soberbia destreza al volar.
        La hembra posee una mayor resistencia, mientras
        que el macho la supera en velocidad.
      it: |-
        Eccelle nel volo. La femmina è particolarmente
        resistente, ma il maschio la batte in velocità.
    shield:
      ja-Hrkt: |-
        かしこいぶん　プライドも　たかい。
        ケンホロウの　トレーナーに　なれば
        みんなに　いちもく　おかれるよ。
      ja: |-
        賢いぶん　プライドも　高い。
        ケンホロウの　トレーナーに　なれば
        みんなに　一目　置かれるよ。
      ko: |-
        영리한 만큼 프라이드도 높다.
        켄호로우의 트레이너가 되면
        모두에게 실력을 인정받는다.
      zh-Hant: |-
        頭腦聰明，所以自尊心也強。
        如果能成為高傲雉雞的訓練家，
        所有人都會對你刮目相看。
      zh-Hans: |-
        头脑聪明，所以自尊心也强。
        如果能成为高傲雉鸡的训练家，
        所有人都会对你刮目相看。
      en: |-
        This Pokémon is intelligent and intensely proud.
        People will sit up and take notice if you become
        the Trainer of one.
      fr: |-
        Ce Pokémon est aussi intelligent qu’il est arrogant.
        Les Dresseurs de Déflaisan sont tenus en haute
        estime.
      de: |-
        Es ist schlau, aber auch sehr stolz. Seine Trainer
        genießen daher generell großen Respekt.
      es: |-
        Es un Pokémon muy inteligente y orgulloso.
        Se tiene en alta estima a aquellos que se
        convierten en sus Entrenadores.
      it: |-
        È tanto intelligente quanto orgoglioso.
        Diventare Allenatori di questo Pokémon equivale
        a guadagnarsi il rispetto e l’ammirazione di tutti.
