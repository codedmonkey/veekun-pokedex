type-null:
  base_happiness: 0
  capture_rate: 3
  color: gray
  egg_groups:
    - no-eggs
  evolution_chain: type-null
  evolves_from: ~
  flavor_text:
    sun:
      ja-Hrkt: |-
        おもい　せいぎょマスクを　つけており
        ほんらいの　のうりょくを　だせない。
        とくべつな　ちからを　ひめている。
      ja: |-
        重い　制御マスクを　つけており
        本来の　能力を　だせない。
        特別な　力を　秘めている。
      ko: |-
        무거운 제어마스크를 쓰고 있어
        본래의 능력을 발휘할 수 없다.
        특별한 힘을 숨기고 있다.
      zh-Hant: |-
        帶著沉重的控制面罩，
        無法釋放出原有的能力。
        蘊藏著特別的力量。
      zh-Hans: |-
        带着沉重的控制面罩，
        不能释放出原来的能力。
        蕴藏着特别的力量。
      en: |-
        The heavy control mask it wears suppresses its
        intrinsic capabilities. This Pokémon has some
        hidden special power.
      fr: |-
        Le lourd masque qu’il porte est un limiteur qui
        l’empêche d’exprimer toute l’étendue de
        sa puissance. Il recèle une force mystérieuse.
      de: |-
        Seine schwere Maske unterdrückt seine wahre
        Macht. In ihm schlummern nämlich besondere
        Kräfte.
      es: |-
        La pesada máscara le impide liberar toda su
        fuerza, que se cree que es extraordinaria.
      it: |-
        La pesante maschera che indossa agisce come
        un freno che gli impedisce di usare la sua vera
        potenza. Nasconde in sé un potere speciale.
    moon:
      ja-Hrkt: |-
        じんこうの　ポケモン。　ぼうそうの
        きけんが　あるため　せいぎょマスクで
        ちからを　ふういん　されている。
      ja: |-
        人工の　ポケモン。　暴走の
        危険が　あるため　制御マスクで
        力を　封印　されている。
      ko: |-
        인공의 포켓몬이다. 폭주할
        위험이 있어 제어마스크로
        힘을 봉인하고 있다.
      zh-Hant: |-
        人工創造出的寶可夢。
        因為有暴走的危險，
        所以其力量被控制面罩封印住了。
      zh-Hans: |-
        人工的宝可梦。
        因为有暴走的危险，
        所以被控制面罩封印住了力量。
      en: |-
        Due to the danger that this synthetic Pokémon
        may go on a rampage, it wears a control mask
        to restrain its power.
      fr: |-
        Ce Pokémon créé de toutes pièces porte un
        masque qui contient sa puissance et l’empêche
        de perdre le contrôle et de tout détruire.
      de: |-
        Ein künstliches Pokémon. Da die Gefahr besteht,
        dass es alles kurz und klein schlagen könnte,
        muss es eine Kontrollmaske tragen.
      es: |-
        Un Pokémon artificial. La máscara de contención
        que lleva sirve para evitar que se descontrole.
      it: |-
        È un Pokémon artificiale. La maschera che porta
        ha la funzione di tenere a freno la sua potenza
        e impedirgli di perdere il controllo.
    ultra-sun:
      ja-Hrkt: |-
        あるにんむの　ために　かいはつされた
        ポケモンへいき。　じっけんちゅうに
        ぼうそうした　ため　とうけつされた。
      ja: |-
        ある任務の　ために　開発された
        ポケモン兵器。　実験中に
        暴走した　ため　凍結された。
      ko: |-
        특정 임무를 위해 개발된
        포켓몬 병기다. 실험 중에
        폭주해서 중단되었다.
      zh-Hant: |-
        為了某個任務而被開發出來的
        寶可夢兵器。因為在實驗中失控
        而遭到了凍結。
      zh-Hans: |-
        是为了某个任务而
        被开发出来的宝可梦武器。
        因为在试验中暴走而被冻结了。
      en: |-
        A Pokémon weapon developed for a specific
        mission, it went berserk during an experiment,
        so it was cryogenically frozen.
      fr: |-
        Développé en tant qu’arme dans un but bien
        précis, il est devenu incontrôlable lors d’une
        expérience et a dû être cryogénisé.
      de: |-
        Dieses für einen bestimmten Zweck als Waffe
        kreierte Pokémon geriet bei einem Experiment
        außer Kontrolle und wurde deshalb stillgelegt.
      es: |-
        Este Pokémon se creó en un laboratorio como
        arma para cierto fin. Fue criogenizado tras
        desbocarse durante un experimento.
      it: |-
        È stato creato come arma per una missione
        precisa. Fu ibernato dopo aver perso il controllo
        durante un esperimento.
    ultra-moon:
      ja-Hrkt: |-
        ぼうそうの　きけんが　あるため
        せいぎょマスクに　よって　ほんとうの
        ちからを　ふういん　されているのだ。
      ja: |-
        暴走の　危険が　あるため
        制御マスクに　よって　本当の
        力を　封印　されているのだ。
      ko: |-
        폭주의 위험이 있어
        제어마스크를 통해 본래의
        힘을 봉인하고 있다.
      zh-Hant: |-
        因為有失控的危險，
        所以被控制面罩
        封住了真正的力量。
      zh-Hans: |-
        因为有暴走的危险，
        所以被控制面罩
        封印住了真正的力量。
      en: |-
        There’s danger of its going on a rampage, so its
        true power is sealed away beneath its
        control mask.
      fr: |-
        On lui fait porter un masque qui limite
        sa puissance afin d’éviter qu’il n’en perde
        le contrôle et sème le chaos.
      de: |-
        Da die Gefahr besteht, dass es sonst alles kurz
        und klein schlägt, muss es eine Kontrollmaske
        tragen, die seine wahre Macht unterdrückt.
      es: |-
        La máscara que lleva sirve para contener su
        verdadero poder y evitar que se descontrole.
      it: |-
        La maschera che porta ha la funzione di
        tenere a freno la sua vera potenza e impedirgli
        di perdere il controllo.
    sword:
      ja-Hrkt: |-
        ごくひだった　けんきゅう　しりょうが
        ぬすまれ　ガラルちほうで　あらたに
        つくりだされたと　うわさされている。
      ja: |-
        極秘だった　研究資料が
        盗まれ　ガラル地方で　新たに
        つくりだされたと　噂されている。
      ko: |-
        극비였던 연구 자료가
        도난당한 뒤 가라르지방에서
        새로 만들어졌다는 소문이 있다.
      zh-Hant: |-
        傳言說有人偷走了機密
        研究資料，在伽勒爾地區
        創造出了新的「屬性：空」。
      zh-Hans: |-
        传言说有人偷走了绝密
        研究资料，在伽勒尔地区
        创造出了新的“属性：空”。
      en: |-
        Rumor has it that the theft of top-secret research
        notes led to a new instance of this Pokémon
        being created in the Galar region.
      fr: |-
        On raconte qu’il aurait été recréé à Galar
        suite à un vol de documents de recherche
        hautement confidentiels.
      de: |-
        Gerüchte besagen, es sei in der Galar-Region
        mithilfe von gestohlenen, streng geheimen
        Dokumenten komplett neu erschaffen worden.
      es: |-
        Se rumorea que ha sido recreado en Galar a
        partir de documentos de investigación de alto
        secreto robados.
      it: |-
        Si dice che sia stato ricreato nuovamente a
        Galar sulla base di documenti top secret
        trafugati.
    shield:
      ja-Hrkt: |-
        しんわの　ポケモンを　モデルに
        つくられたが　ちからの　ぼうそうを
        おさえる　マスクを　つけられている。
      ja: |-
        神話の　ポケモンを　モデルに
        つくられたが　力の　暴走を
        抑える　マスクを　着けられている。
      ko: |-
        신화 속 포켓몬을 모델로
        만들었지만 힘이 폭주하는 것을
        억제하는 마스크를 쓰고 있다.
      zh-Hant: |-
        以神話中的寶可夢為原型所
        創造出的寶可夢，被戴上了
        抑制力量失控的面罩。
      zh-Hans: |-
        以神话中的宝可梦为原型所
        创造出的宝可梦，被戴上了
        抑制力量失控的面罩。
      en: |-
        It was modeled after a mighty Pokémon of myth.
        The mask placed upon it limits its power in order
        to keep it under control.
      fr: |-
        Il a été créé artificiellement d’après un Pokémon
        mythique. Il est muni d’un masque afin de contenir
        sa puissance.
      de: |-
        Typ:Null ist eine künstliche Nachbildung eines
        Pokémon aus einer alten Sage. Die Maske dient
        dazu, seine Kräfte unter Kontrolle zu halten.
      es: |-
        Fue creado a imagen de un Pokémon mitológico.
        Lleva una máscara de contención para evitar que
        su poder se descontrole.
      it: |-
        È stato creato sul modello di un Pokémon
        mitologico. È stato necessario dotarlo di una
        maschera per tenere a freno la sua potenza.
