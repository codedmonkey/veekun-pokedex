deino:
  base_happiness: 35
  capture_rate: 45
  color: blue
  egg_groups:
    - dragon
  evolution_chain: deino
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        It tends to bite everything, and it
        is not a picky eater. Approaching it
        carelessly is dangerous.
      fr: |-
        Il mord tout ce qui bouge, et mange tout
        ce qu’il trouve. Il vaut mieux éviter
        de s’en approcher.
    white:
      en: |-
        They cannot see, so they tackle and bite
        to learn about their surroundings.
        Their bodies are covered in wounds.
      fr: |-
        Comme il ne voit rien, il perçoit son
        environnement en mordant et en fonçant
        à tout va. Il est couvert de plaies.
    black-2:
      en: |-
        Lacking sight, it’s unaware of its
        surroundings, so it bumps into things
        and eats anything that moves.
    white-2:
      en: |-
        Lacking sight, it’s unaware of its
        surroundings, so it bumps into things
        and eats anything that moves.
    x:
      ja-Hrkt: |-
        めが　みえないため　たいあたりしたり
        かみついて　まわりを　さぐる。
        からだじゅう　なまきずが　たえない。
      ja: |-
        目が　見えないため　体当たりしたり
        かみついて　まわりを　探る。
        体中　生傷が　絶えない。
      ko: |-
        눈이 보이지 않아서 몸통박치기나
        물기로 주변을 살핀다.
        몸에 상처가 끊이지 않는다.
      en: |-
        They cannot see, so they tackle and bite to learn
        about their surroundings. Their bodies are covered
        in wounds.
      fr: |-
        Comme il ne voit rien, il perçoit son environnement
        en mordant et en fonçant à tout va. Il est couvert
        de plaies.
      de: |-
        Da es nichts sehen kann, sucht es seine Umgebung
        mit Rempel- und Bissattacken ab und ist immer
        mit Wunden übersät.
      es: |-
        No ve, por eso va haciendo placajes y dando
        mordiscos a diestro y siniestro. Su cuerpo está
        plagado de heridas.
      it: |-
        Dal momento che non ci vede, esamina ciò che lo
        circonda mordendo o lanciandosi di peso. Ha
        ammaccature su tutto il corpo.
    'y':
      ja-Hrkt: |-
        まわりの　ようすが　わからないので
        てあたりしだいに　ぶつかっては
        うごくものに　かみつき　たべまくる。
      ja: |-
        まわりの　様子が　わからないので
        手当り次第に　ぶつかっては
        動くものに　かみつき　食べまくる。
      ko: |-
        주변의 모습을 모르기 때문에
        닥치는 대로 부딪쳐서는
        움직이는 것을 물어 먹어치운다.
      en: |-
        Lacking sight, it’s unaware of its surroundings,
        so it bumps into things and eats anything
        that moves.
      fr: |-
        Comme il ne voit rien, il perçoit son environnement
        en mordant et en fonçant à tout va.
      de: |-
        Da es nichts sehen kann, rammt und frisst es alles,
        was ihm auf dem Weg in die Quere kommt.
      es: |-
        No ve bien a su alrededor, por eso va chocándose a
        diestro y siniestro, y mordiendo todo lo que se mueve.
      it: |-
        Non vede bene ciò che lo circonda e sbatte qua e
        là mordendo e mangiando tutto ciò che si muove.
    omega-ruby:
      ja-Hrkt: |-
        めが　みえないため　たいあたりしたり
        かみついて　まわりを　さぐる。
        からだじゅう　なまきずが　たえない。
      ja: |-
        目が　見えないため　体当たりしたり
        かみついて　まわりを　探る。
        体中　生傷が　絶えない。
      ko: |-
        눈이 보이지 않아서 몸통박치기나
        물기로 주변을 살핀다.
        몸에 상처가 끊이지 않는다.
      en: |-
        They cannot see, so they tackle and bite to learn
        about their surroundings. Their bodies are covered
        in wounds.
      fr: |-
        Comme il ne voit rien, il perçoit son environnement en mordant
        et en fonçant à tout va. Il est couvert de plaies.
      de: |-
        Da es nichts sehen kann, sucht es seine Umgebung mit
        Rempel- und Bissattacken ab und ist immer mit Wunden
        übersät.
      es: |-
        No ve, por eso va haciendo placajes y dando mordiscos a
        diestro y siniestro. Su cuerpo está plagado de heridas.
      it: |-
        Dal momento che non ci vede, esamina ciò che lo circonda
        mordendo o lanciandosi di peso. Ha ammaccature su tutto
        il corpo.
    alpha-sapphire:
      ja-Hrkt: |-
        まわりの　ようすが　わからないので
        てあたりしだいに　ぶつかっては
        うごくものに　かみつき　たべまくる。
      ja: |-
        まわりの　様子が　わからないので
        手当り次第に　ぶつかっては
        動くものに　かみつき　食べまくる。
      ko: |-
        주변의 모습을 모르기 때문에
        닥치는 대로 부딪쳐서는
        움직이는 것을 물어 먹어치운다.
      en: |-
        Lacking sight, it’s unaware of its surroundings,
        so it bumps into things and eats anything
        that moves.
      fr: |-
        Comme il ne voit rien, il perçoit son environnement en mordant
        et en fonçant à tout va.
      de: |-
        Da es nichts sehen kann, rammt und frisst es alles, was ihm
        auf dem Weg in die Quere kommt.
      es: |-
        No ve bien a su alrededor, por eso va chocándose a diestro y
        siniestro, y mordiendo todo lo que se mueve.
      it: |-
        Non vede bene ciò che lo circonda e sbatte qua e là
        mordendo e mangiando tutto ciò che si muove.
    sword:
      ja-Hrkt: |-
        とりあえず　まず　かみついてみる
        しゅうせい。　おいしかった　ものは
        においを　ちゃんと　おぼえるという。
      ja: |-
        とりあえず　まず　噛みついてみる
        習性。　美味しかった　ものは
        においを　ちゃんと　憶えるという。
      ko: |-
        무엇이든 일단 물고 보는
        습성을 가졌다. 맛있었던 것은
        냄새를 확실히 기억한다고 한다.
      zh-Hant: |-
        不管遇到什麼都習慣先咬再說。
        據說如果咬起來味道不錯，
        牠就會牢牢記住那種氣味。
      zh-Hans: |-
        不管遇到什么都习惯先咬再说。
        据说如果咬起来味道不错，
        它就会牢牢记住那种气味。
      en: |-
        When it encounters something, its first urge is
        usually to bite it. If it likes what it tastes, it will
        commit the associated scent to memory.
      fr: |-
        Il mord d’abord et réfléchit ensuite.
        On dit qu’il n’oublie jamais l’odeur
        de la nourriture qu’il aime.
      de: |-
        Es hat die Angewohnheit, in alles zu beißen,
        was es findet. Stellt sich etwas als lecker heraus,
        prägt es sich den Geruch davon gut ein.
      es: |-
        Muestra cierta tendencia a morder todo lo que
        encuentra. Se cree que recuerda perfectamente
        el olor de lo que encuentra delicioso.
      it: |-
        Ha l’abitudine di mordere tutto quello che
        trova. Si dice che ricordi con precisione
        il profumo di ciò che ha trovato delizioso.
    shield:
      ja-Hrkt: |-
        めが　みえないので　てあたりしだい
        かみついて　じぶんの　まわりの
        じょうきょうを　はあく　している。
      ja: |-
        目が　見えないので　手あたりしだい
        噛みついて　自分の　まわりの
        状況を　把握　している。
      ko: |-
        눈이 보이지 않아 닥치는 대로
        물면서 본인 주위의
        상황을 파악한다.
      zh-Hant: |-
        因為眼睛看不見，
        所以會又撞又咬，
        來判斷四周的狀況。
      zh-Hans: |-
        因为眼睛看不见，
        所以会又撞又咬，
        来判断四周的状况。
      en: |-
        Because it can’t see, this Pokémon is constantly
        biting at everything it touches, trying to keep
        track of its surroundings.
      fr: |-
        Comme il ne voit rien, il se repère en mâchouillant
        tout ce qui se trouve autour de lui.
      de: |-
        Da es nichts sehen kann, beißt es zur
        Orientierung in alles hinein, was sich in seiner
        Umgebung befindet.
      es: |-
        Al no poder ver, su forma de orientarse y percibir
        el entorno consiste en chocarse a diestro y
        siniestro, mordiendo todo lo que se encuentra.
      it: |-
        È cieco e si orienta mordicchiando
        tutto ciò che ha intorno.
