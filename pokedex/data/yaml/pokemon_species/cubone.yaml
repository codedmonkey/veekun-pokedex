        come out as a sad melody.
      fr: |-
        Il porte le crâne de sa défunte mère.
        Ses pleurs résonnent dans son casque
        en une triste mélodie.
      de: |-
        Es trägt den Schädel seiner Mutter als Maske.
        Sein Weinen hallt darin wider und wird zu einer
        traurigen Melodie.
      es: |-
        Siempre lleva puesto el cráneo de su difunta
        madre. Su llanto resuena dentro como una
        triste melodía.
      it: |-
        Indossa il teschio di sua madre come elmo.
        Il suo verso riecheggia all’interno del teschio
