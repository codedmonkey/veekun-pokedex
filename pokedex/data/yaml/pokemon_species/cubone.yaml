    sun:
      ja-Hrkt: |-
        しにわかれた　ははを　おもいだして
        おおごえで　なく。　こえをききつけた
        バルジーナに　そらから　ねらわれる。
      ja: |-
        死に別れた　母を　思いだして
        大声で　泣く。　声を聞きつけた
        バルジーナに　空から　狙われる。
      ko: |-
        사별한 어머니를 생각하며
        큰 소리로 운다. 목소리를 들은
        버랜지나가 하늘에서 노린다.
      zh-Hant: |-
        想起與自己死別的母親
        而大聲哭泣，被聽到聲音的
        禿鷹娜從空中襲擊。
      zh-Hans: |-
        想起与自己天人永隔的母亲
        而大声哭泣。被听到声音的
        秃鹰娜从空中袭击。
      en: |-
        When it thinks of its deceased mother, it weeps
        loudly. Mandibuzz that hear its cries will attack
        it from the air.
      fr: |-
        Quand il se souvient de la mort de sa mère,
        il pleure à grands sanglots. Les Vaututrice
        entendent ces cris et fondent sur leur proie.
      de: |-
        Denkt es an seine verstorbene Mutter, weint es
        laut. Hört dies ein Grypheldis, nutzt dieses die
        Gelegenheit, um es aus der Luft anzugreifen.
      es: |-
        Llora desconsoladamente por la pérdida de su
        madre. Los Mandibuzz que escuchan su llanto
        se lanzan en picado al ataque.
      it: |-
        Piange disperatamente pensando alla madre
        morta. Quando i Mandibuzz lo sentono,
        si lanciano in picchiata per attaccarlo.
    moon:
      ja-Hrkt: |-
        あたまに　かぶった　ずがいこつは
        しんだ　ははおや。　しの　かなしみを
        のりこえたとき　しんかする　という。
      ja: |-
        頭に　被った　頭がい骨は
        死んだ　母親。　死の　悲しみを
        乗り越えたとき　進化する　という。
      ko: |-
        머리에 뒤집어쓴 두개골은
        죽은 어미의 것. 죽음의 슬픔을
        뛰어넘었을 때 진화한다고 전해진다.
      zh-Hant: |-
        頭上戴著的是死去母親的
        頭蓋骨。據說，當牠擺脫
        母親死亡的悲痛時就會進化。
      zh-Hans: |-
        头上戴着的是死去母亲的
        头盖骨。据说，当它摆脱
        母亲死亡的悲痛时就会进化。
      en: |-
        The skull it wears on its head is that of its dead
        mother. According to some, it will evolve when
        it comes to terms with the pain of her death.
      fr: |-
        Le crâne qu’il porte sur la tête est celui de sa
        mère décédée. On dit qu’il évolue lorsqu’il
        parvient à surpasser la douleur de sa mort.
      de: |-
        Der Schädel auf seinem Kopf gehörte seiner
        verstorbenen Mutter. Überwindet es diesen
        Verlust, setzt angeblich die Entwicklung ein.
      es: |-
        El cráneo que lleva en la cabeza pertenece a su
        madre. Se dice que evoluciona una vez que ha
        conseguido superar su pérdida.
      it: |-
        Il teschio che porta in testa apparteneva alla
        madre morta. Si evolve dopo aver superato
        il lutto per la sua perdita.
    ultra-sun:
      ja-Hrkt: |-
        なくした　ははおやを　おもい　よるに
        なきさけぶが　そのせいで　てんてきの
        バルジーナに　みつかってしまう。
      ja: |-
        亡くした　母親を　思い　夜に
        泣き叫ぶが　そのせいで　天敵の
        バルジーナに　見つかってしまう。
      ko: |-
        밤이 되면 죽은 엄마를 생각하며
        울부짖는데, 그 탓에 천적인
        버랜지나에게 발각된다.
      zh-Hant: |-
        因為思念死去的母親，
        會在夜裡大聲哭叫，
        導致自己被天敵禿鷹娜發現。
      zh-Hans: |-
        会思念已故的母亲而在夜里哭叫，
        因此会被其天敌秃鹰娜发现。
      en: |-
        At night, it weeps loudly for its dead mother,
        but those cries only attract its natural
        enemy—Mandibuzz.
      fr: |-
        La nuit, il pense avec nostalgie à sa défunte
        mère et éclate en sanglots. Vaututrice, son
        prédateur, le localise au son de ses pleurs.
      de: |-
        Nachts weint es laut, weil es seine verstorbene
        Mutter vermisst. Dadurch wird jedoch sein
        natürlicher Feind Grypheldis auf es aufmerksam.
      es: |-
        Al caer la noche, rompe a llorar pensando en su
        difunta madre, lo que delata su presencia ante
        los Mandibuzz, sus enemigos naturales.
      it: |-
        Di notte piange disperatamente pensando alla
        madre morta. I suoi lamenti attirano i Mandibuzz,
        suoi predatori naturali.
    ultra-moon:
      ja-Hrkt: |-
        ははおやの　ホネを　かぶっているので
        すがおも　ひょうじょうも　わからない。
        ただ　いつも　ずっと　ないているぞ。　
      ja: |-
        母親の　ホネを　被っているので
        素顔も　表情も　わからない。
        ただ　いつも　ずっと　泣いているぞ。　
      ko: |-
        어미의 뼈를 뒤집어쓰고 있어서
        얼굴도 표정도 알 수 없다.
        그저 언제나 계속해서 울고 있다.
      zh-Hant: |-
        頭上戴著母親的骨頭，
        所以看不見牠的長相和表情，
        只知道牠一直在哭泣。
      zh-Hans: |-
        头上戴着母亲的骨头，
        因此无法知晓其长相和表情，
        只知道它一直在哭。
      en: |-
        It wears its mother’s skull on its head, so no
        one knows what its bare face looks like.
        However, it’s clear that it’s always crying.
      fr: |-
        Comme il porte le crâne de sa mère sur sa tête,
        nul ne connaît son vrai visage. Une seule chose
        est sûre : il ne cesse de pleurer.
      de: |-
        Da es den Schädel seiner Mutter auf dem Kopf
        trägt, weiß man nicht, wie sein Gesicht aussieht.
        Bekannt ist nur, dass es ständig weint.
      es: |-
        Al cubrir su rostro con el cráneo de su madre,
        su expresión queda velada. La única emoción
        que lo delata es su llanto constante.
      it: |-
        Poiché indossa sempre il teschio della madre,
        non si sa che viso o che espressione abbia,
        ma è evidente che piange continuamente.
    lets-go-pikachu:
      ja-Hrkt: |-
        しんだ　ははおやの　ホネを　かぶる。
        なきごえは　ホネのなかで　ひびいて
        ものがなしい　メロディになる。
      ja: |-
        死んだ　母親の　ホネを　かぶる。
        鳴き声は　ホネの中で　ひびいて
        もの悲しい　メロディになる。
      ko: |-
        죽은 어미의 뼈를 뒤집어썼다.
        울음소리는 뼈 안에서 울려서
        구슬픈 멜로디가 된다.
      zh-Hant: |-
        頭上戴著死去母親的頭骨。
        牠的叫聲會在頭骨內迴響，
        形成哀傷的旋律。
      zh-Hans: |-
        它头上戴着死去母亲的头骨。
        它的哭声会在头骨里
        回响出悲伤的旋律。
      en: |-
        Wears the skull of its deceased mother.
        Its cries echo inside the skull and
        come out as a sad melody.
      fr: |-
        Il porte le crâne de sa défunte mère.
        Ses pleurs résonnent dans son casque
        en une triste mélodie.
      de: |-
        Es trägt den Schädel seiner Mutter als Maske.
        Sein Weinen hallt darin wider und wird zu einer
        traurigen Melodie.
      es: |-
        Siempre lleva puesto el cráneo de su difunta
        madre. Su llanto resuena dentro como una
        triste melodía.
      it: |-
        Indossa il teschio di sua madre come elmo.
        Il suo verso riecheggia all’interno del teschio
        producendo una triste melodia.
    lets-go-eevee:
      ja-Hrkt: |-
        しんだ　ははおやの　ホネを　かぶる。
        なきごえは　ホネのなかで　ひびいて
        ものがなしい　メロディになる。
      ja: |-
