    sword:
      ja-Hrkt: |-
        しにわかれた　ははおやを　おもいだし
        なくと　あたまに　かぶった　ホネの
        なかで　ものがなしく　ひびくのだ。
      ja: |-
        死に別れた　母親を　思い出し
        泣くと　頭に　被った　骨の　中で
        物悲しく　響くのだ。
      ko: |-
        죽은 어머니를 떠올리며 울면
        머리에 쓴 뼈 안에서
        울음소리가 구슬프게 퍼진다.
      zh-Hant: |-
        當牠想起與自己死別的
        母親而哭泣時，哭聲就會在
        頭上戴的骨頭中哀傷地迴盪。
      zh-Hans: |-
        因想起与自己天人永隔的母亲
        而哭泣时，哀伤的哭声便会
        回荡在它头上戴着的头骨中。
      en: |-
        When the memory of its departed mother brings
        it to tears, its cries echo mournfully within the
        skull it wears on its head.
      fr: |-
        Lorsqu’il repense à sa mère défunte,
        ses sanglots résonnent tristement sous
        le crâne qu’il porte sur la tête.
      de: |-
        Denkt Tragosso an seine verstorbene Mutter,
        so weint es. Sein Schluchzen hallt dabei in dem
        Schädel auf seinem Kopf klagend wider.
      es: |-
        Cuando llora al acordarse de su madre fallecida,
        su llanto resuena en el cráneo que lleva en la
        cabeza.
      it: |-
        Quando piange pensando alla madre defunta,
        i suoi lamenti riecheggiano tristemente all’interno
        del teschio che ha in testa.
    shield:
      ja-Hrkt: |-
        しんだ　ははおやの　ホネを　かぶる。
        ゆめを　みて　なくことも　あるけれど
        なみだを　ながすたびに　つよくなる。
      ja: |-
        死んだ　母親の　骨を　被る。
        夢を　見て　泣くことも　あるけど
        涙を　流すたびに　強くなる。
      ko: |-
        죽은 어미의 뼈를 머리에 쓰고 있다.
        어미의 꿈을 꾸고 울기도 하지만
        눈물을 흘릴 때마다 강해진다.
      zh-Hant: |-
        頭上戴著死去母親的頭骨。
        雖然有時會因為作夢而哭泣，
        但每次流淚後都會變得更強。
      zh-Hans: |-
        它头上戴着死去母亲的头骨。
        虽然也会因悲伤的梦境而哭泣，
        但每流一次泪，都会变得更加坚强。
      en: |-
        This Pokémon wears the skull of its deceased
        mother. Sometimes Cubone’s dreams make it cry,
        but each tear Cubone sheds makes it stronger.
      fr: |-
        Il porte sur sa tête le crâne de sa défunte mère.
        Il lui arrive de rêver d’elle et de pleurer, mais
        chaque larme qu’il verse le rend plus fort.
      de: |-
        Es trägt den Schädel seiner verstorbenen Mutter.
        Manchmal weint Tragosso, während es träumt,
        doch jede vergossene Träne macht es stärker.
      es: |-
        Lleva puesto el cráneo de su difunta madre.
        A veces llora en sueños, pero cada lágrima
        vertida le hace más fuerte.
      it: |-
        Indossa il teschio della madre defunta. A volte
        capita che pianga vedendola in sogno, ma a ogni
        lacrima versata diventa più forte.
