        dans son crâne creux.
    black-2:
      en: |-
        When it thinks of its dead mother,
        it cries. Its crying makes the
        skull it wears rattle hollowly.
    white-2:
      en: |-
        When it thinks of its dead mother,
        it cries. Its crying makes the
        skull it wears rattle hollowly.
    x:
      ja-Hrkt: |-
        しにわかれた　ははおやの　ほねを
        あたまに　かぶっている。さびしいとき
        おおごえで　なくという。
      ja: |-
        死に別れた　母親の　骨を
        頭に　覆っている。寂しいとき
        大声で　泣くという。
      ko: |-
        죽은 어미의 해골을
        머리에 쓰고 있다. 외로울 때는
        큰 소리로 운다고 한다.
      en: |-
        It wears the skull of its dead mother on its head.
        When it becomes lonesome, it is said to cry loudly.
      fr: |-
        Ce Pokémon porte le crâne de sa défunte mère sur
        sa tête. On raconte qu’il se met à pleurer dès qu’il
        se retrouve seul.
      de: |-
        Es trägt den Schädel seiner verstorbenen Mutter auf
        seinem Kopf. Fühlt es sich einsam, soll es laut weinen.
      es: |-
        Lleva puesto el cráneo de su madre. Cuando se siente
        solo se pone a gritar muy fuerte.
      it: |-
        Indossa il teschio della madre morta come un casco.
        Quando si sente solo lancia urla strazianti.
    'y':
      ja-Hrkt: |-
        しにわかれた　ははおやの　ホネを
        いつも　かぶっているので
        すがおが　どんなふうか　わからない。
      ja: |-
        死に別れた　母親の　骨を
        いつも　覆っているので
        素顔が　どんなふうか　わからない。
      ko: |-
        죽은 어미의 해골을
        항상 뒤집어쓰고 있어서
        얼굴이 어떻게 생겼는지 모른다.
      en: |-
        It always wears the skull of its dead mother, so no
        one has any idea what its hidden face looks like.
      fr: |-
        Il porte constamment le crâne de sa mère.
        Personne ne sait à quoi il ressemble sans ce crâne.
      de: |-
        Es trägt immer den Schädel seiner verstorbenen
        Mutter. Darum weiß niemand, wie sein Gesicht
        aussieht.
      es: |-
        Siempre lleva la calavera de su difunta madre, así que
        nadie sabe cómo es su cara oculta.
      it: |-
        Indossa sempre il teschio della mamma scomparsa:
        nessuno l’ha mai potuto vedere in faccia.
    omega-ruby:
      ja-Hrkt: |-
        ２どと　あえない　ははおやの　おもかげを
        まんげつに　みつけて　なきごえを　あげる。
        かぶっている　ホネの　しみは　なみだの　あと。
      ja: |-
        ２度と　会えない　母親の　面影を
        満月に　みつけて　泣き声を　あげる。
        被っている　ホネの　染みは　涙の　あと。
      ko: |-
        두 번 다시 만나지 못하는 어미의 모습을
        보름달에서 발견하고 울음소리를 낸다.
        뒤집어쓰고 있는 뼈의 얼룩은 눈물 자국이다.
      en: |-
        Cubone pines for the mother it will never see again.
        Seeing a likeness of its mother in the full moon, it cries.
        The stains on the skull the Pokémon wears are made by the
        tears it sheds.
      fr: |-
        La maman d’Osselait lui manque terriblement et il ne la reverra
        jamais. La lune le fait pleurer, car elle lui rappelle sa mère.
        Les taches sur le crâne que porte ce Pokémon sont
        les marques de ses larmes.
      de: |-
        Tragosso sehnt sich nach seiner Mutter, die nicht mehr da ist.
        Wenn es im Vollmond das Ebenbild seiner Mutter erblickt,
        muss es weinen. Die Flecken auf dem Totenkopf, den es trägt,
        stammen von vergossenen Tränen.
      es: |-
        A Cubone le ahoga la pena porque no volverá a ver jamás a
        su madre. La luna le recuerda a veces a ella, y se pone a
        llorar. Los churretes que tiene en el cráneo que lleva puesto
        son debidos a las lágrimas que derrama.
      it: |-
        Cubone si strugge per la madre che non rivedrà mai più.
        Piange alla luna piena che somiglia molto alla madre.
        Le macchie sul teschio che indossa sono dovute alle
        lacrime copiose.
    alpha-sapphire:
      ja-Hrkt: |-
