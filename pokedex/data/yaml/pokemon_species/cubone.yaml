        mother. Its criesecho inside the
        skull and come out
        as a sad melody.
    gold:
      en: |-
        If it is sad or
        lonely, the skull
        it wears shakes,and emits a plain­
        tive and mournful
        sound.
    silver:
      en: |-
        It always wears
        the skull of its
        dead mother, so noone has any idea
        what its hidden
        face looks like.
    crystal:
      en: |-
        It lost its mother
        after its birth.
        It wears itsmother's skull,
        never revealing
        its true face.
    ruby:
      en: |-
        CUBONE pines for the mother it will
        never see again. Seeing a likeness of
