cubone:
  base_happiness: 50
  capture_rate: 190
  color: brown
  egg_groups:
    - monster
  evolution_chain: cubone
  evolves_from: ~
  flavor_text:
    red:
      en: |-
        Because it never
        removes its skull
        helmet, no onehas ever seen
        this POKéMON's
        real face.
    blue:
      en: |-
        Because it never
        removes its skull
        helmet, no onehas ever seen
        this POKéMON's
