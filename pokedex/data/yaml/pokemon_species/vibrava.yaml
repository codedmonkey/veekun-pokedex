vibrava:
  base_happiness: 50
  capture_rate: 120
  color: green
  egg_groups:
    - bug
    - dragon
  evolution_chain: trapinch
  evolves_from: trapinch
  flavor_text:
    ruby:
      en: |-
        To make prey faint, VIBRAVA generates
        ultrasonic waves by vigorously making
        its two wings vibrate.This POKéMON’s ultrasonic waves are so
        powerful, they can bring on headaches
        in people.
    sapphire:
      en: |-
        VIBRAVA’s wings have not yet
        completed the process of growing.
        Rather than flying long distances,they are more useful for generating
        ultrasonic waves by vibrating.
    emerald:
      en: |-
        It looses ultrasonic waves by rubbing its
        wings together. Since a VIBRAVA’s wings
        are still in the process of growing, it can
        only fly short distances.
    firered:
      en: |-
        It generates ultrasonic waves by violently
        flapping its wings. After making its prey
        faint, it melts the prey with acid.
    leafgreen:
      en: |-
        It generates ultrasonic waves by violently
        flapping its wings. After making its prey
        faint, it melts the prey with acid.
    diamond:
      en: |-
        It violently shudders its wings,
        generating ultrasonic waves to
        induce headaches in people.
    pearl:
      en: |-
        It violently shudders its wings,
        generating ultrasonic waves to
        induce headaches in people.
    platinum:
      en: |-
        It violently shudders its wings,
        generating ultrasonic waves to
        induce headaches in people.
    heartgold:
      en: |-
        It vibrates its wings vigorously,
        creating ultrasonic waves that
        cause serious headaches.
    soulsilver:
      en: |-
        It vibrates its wings vigorously,
        creating ultrasonic waves that
        cause serious headaches.
    black:
      en: |-
        It violently shudders its wings,
        generating ultrasonic waves to
        induce headaches in people.
      fr: |-
        Ses violents battements d’ailes
        génèrent des vagues d’ultrasons
        qui donnent mal au crâne.
    white:
      en: |-
        It violently shudders its wings,
        generating ultrasonic waves to
        induce headaches in people.
      fr: |-
        Ses violents battements d’ailes
        génèrent des vagues d’ultrasons
        qui donnent mal au crâne.
    black-2:
      en: |-
        The ultrasonic waves it generates
        by rubbing its two wings together
        cause severe headaches.
    white-2:
      en: |-
        The ultrasonic waves it generates
        by rubbing its two wings together
        cause severe headaches.
    x:
      ja-Hrkt: |-
        ２まいの　ハネを　こうそくで
        しんどうさせて　だす　ちょうおんぱは
        はげしい　ずつうを　ひきおこす。
      ja: |-
        ２枚の　羽を　高速で
        振動させて　出す　超音波は
        激しい　頭痛を　ひきおこす。
      ko: |-
        2장의 날개를 고속으로
        진동시켜서 내는 초음파는
        격렬한 두통을 불러일으킨다.
      en: |-
        The ultrasonic waves it generates by rubbing its two
        wings together cause severe headaches.
      fr: |-
        Ses violents battements d’ailes génèrent des vagues
        d’ultrasons qui donnent d’intenses migraines.
      de: |-
        Die Schallwellen, die es durch eine hohe
        Flügelschlagfrequenz erzeugt, verursachen
        heftige Kopfschmerzen.
      es: |-
        Al agitar a gran velocidad ambas alas, emite ondas
        ultrasónicas que provocan fuertes dolores de cabeza.
      it: |-
        Fa vibrare velocemente le ali generando onde
        ultrasoniche che provocano dei forti mal di testa.
    'y':
      ja-Hrkt: |-
        ハネを　はげしく　しんどうさせて
        ちょうおんぱを　はっせい。きぜつした
        えものを　しょうかえきで　とかす。
      ja: |-
        羽を　激しく　振動させて
        超音波を　発生。気絶した　獲物を
        消化液で　溶かす。
      ko: |-
        날개를 격렬하게 진동시켜서
        초음파를 발생시킨다. 기절한
        먹이를 소화액으로 녹인다.
      en: |-
        It generates ultrasonic waves by violently flapping
        its wings. After making its prey faint, it melts the
        prey with acid.
      fr: |-
        Il génère des ondes ultrasoniques en battant
        violemment des ailes. Dès que sa proie est
        inconsciente, il l’arrose d’acide pour pouvoir l’avaler.
      de: |-
        Durch gewaltiges Schlagen seiner Flügel entstehen
        Ultraschallwellen. Ist sein Gegner besiegt, löst es ihn
        mittels Säure auf.
      es: |-
        Genera ondas ultrasónicas batiendo las alas
        violentamente. Cuando debilita a su presa, la
        destruye con ácido.
      it: |-
        Sbattendo violentemente le ali genera onde
        ultrasoniche per far svenire la preda che poi scioglie
        col proprio acido.
    omega-ruby:
      ja-Hrkt: |-
        ２まいの　ハネを　はげしく　しんどうさせて
        ちょうおんぱを　だし　えものを　きぜつさせる。
        にんげんも　ずつうを　おこす　ほどの　いりょく。
      ja: |-
        ２枚の　ハネを　激しく　振動させて
        超音波を　出し　獲物を　気絶させる。
        人間も　頭痛を　起こす　ほどの　威力。
      ko: |-
        두 장의 날개를 세차게 진동시켜서
        초음파를 내 먹이를 기절시킨다.
        인간도 두통이 일어날 정도의 위력이다.
      en: |-
        To make prey faint, Vibrava generates ultrasonic waves by
        vigorously making its two wings vibrate. This Pokémon’s
        ultrasonic waves are so powerful, they can bring on headaches
        in people.
      fr: |-
        Pour mettre ses proies K.O., Vibraninf envoie des ultrasons
        en faisant vibrer ses deux ailes. Les ondes sonores de ce
        Pokémon sont si puissantes qu’elles peuvent déclencher
        des maux de tête chez les gens.
      de: |-
        Um seine Beute zu schwächen, erzeugt Vibrava
        Ultraschallwellen, indem es seine Flügel vibrieren lässt.
        Die Ultraschallwellen dieses Pokémon sind so stark, dass
        sie bei Menschen Kopfschmerzen verursachen können.
      es: |-
        Para debilitar a su víctima, Vibrava genera ondas ultrasónicas
        haciendo vibrar con fuerza las alas. Las ondas que crea son
        tan fuertes que pueden dar dolor de cabeza a la gente.
      it: |-
        Vibrava attacca la preda generando onde a ultrasuoni con
        le vigorose vibrazioni delle due ali. Tali onde sono così potenti
        da causare il mal di testa a chi le sente.
    alpha-sapphire:
      ja-Hrkt: |-
        ビブラーバの　ハネは　まだ　せいちょうとちゅう。
        ながい　きょりを　とぶ　よりも　しんどうさせて
        ちょうおんぱを　だす　ほうが　とくいなのだ。
      ja: |-
        ビブラーバの　ハネは　まだ　成長途中。
        長い　距離を　飛ぶ　よりも　振動させて
        超音波を　出す　ほうが　得意なのだ。
      ko: |-
        비브라바의 날개는 아직 성장 중이다.
        장거리를 나는 것보다 진동시켜
        초음파를 내는 것이 특기다.
      en: |-
        Vibrava’s wings have not yet completed the process of
        growing. Rather than flying long distances, they are more
        useful for generating ultrasonic waves by vibrating.
      fr: |-
        Les ailes de Vibraninf n’ont pas complètement fini de pousser.
        Elles ne lui servent pas à voler sur de longues distances,
        mais plutôt à générer des ultrasons en vibrant.
      de: |-
        Vibravas Flügel sind noch nicht ganz ausgewachsen. Für lange
        Strecken sind seine Flügel weniger geeignet. Aber es kann mit
        ihnen Ultraschallwellen erzeugen, wenn es sie vibrieren lässt.
      es: |-
        Vibrava no ha desarrollado las alas del todo. Más que para
        volar y recorrer largas distancias, le resultan útiles para
        generar ondas ultrasónicas al hacer que vibren.
      it: |-
        Le ali di Vibrava non hanno ancora completato il loro sviluppo.
        Più che per affrontare lunghe distanze, le utilizza per generare
        onde ultrasoniche facendole vibrare.
    sun:
      ja-Hrkt: |-
        みじゅくな　ハネは　とぶことよりも
        こすって　ちょうおんぱを　はっせいさせ
        てきを　こうげきするのに　つかう。
      ja: |-
        未熟な　ハネは　飛ぶことよりも
        擦って　超音波を　発生させ
        敵を　攻撃するのに　使う。
      ko: |-
        미숙한 날개는 나는 것보다는
        비벼서 초음파를 발생시켜
        적을 공격하는 데 사용한다.
      zh-Hant: |-
        還未發達的翅膀比起用於飛行，
        更常用來摩擦產生超音波，
        從而攻擊敵人。
      zh-Hans: |-
        还不发达的翅膀，
        比起飞行，反而更多地用于
        通过摩擦产生超音波攻击敌人。
      en: |-
        Rather than using its underdeveloped wings for
        flight, it rubs them together, producing
        ultrasonic waves to attack its enemies.
      fr: |-
        Ses ébauches d’ailes ne lui servent pas tant à
        voler qu’à produire des ultrasons par frottement
        pour neutraliser ses ennemis.
      de: |-
        Vibravas Flügel sind zum Fliegen kaum geeignet.
        Es lässt sie vibrieren, um Ultraschallwellen
        zu erzeugen und so seine Gegner anzugreifen.
      es: |-
        Las alas de Vibrava están subdesarrolladas.
        Más que para volar, las utiliza para crear ondas
        ultrasónicas con las que ataca a sus enemigos.
      it: |-
        Le sue ali non sono del tutto sviluppate. Più che
        per volare, le usa per attaccare i nemici con le
        onde ultrasoniche prodotte dalle loro vibrazioni.
    moon:
      ja-Hrkt: |-
        ハネを　せいちょう　させるために
        まいにち　たいりょうの　えものを
        しょうかえきで　とかして　すする。
      ja: |-
        ハネを　成長　させるために
        毎日　大量の　獲物を
        消化液で　溶かして　すする。
      ko: |-
        날개를 성장시키기 위해
        매일 대량의 먹잇감을
        소화액으로 녹여 마신다.
      zh-Hant: |-
        為了讓翅膀成長，
        每天要用消化液溶化
        並吸食大量的獵物。
      zh-Hans: |-
        为了让翅膀成长，
        每天要吸食大量
        用消化液溶化的猎物。
      en: |-
        To help make its wings grow, it dissolves
        quantities of prey in its digestive juices and
        guzzles them down every day.
      fr: |-
        Pour aider ses ailes à pousser, il fait un vrai
        carnage tous les jours, arrosant ses moult
        proies d’acide pour les dissoudre et s’en nourrir.
      de: |-
        Um das Wachstum seiner Flügel zu fördern,
        schlürft es täglich große Mengen an Beute,
        die es zuvor in Säure aufgelöst hat.
      es: |-
        Para terminar de desarrollar sus alas, se nutre
        a diario de un gran número de presas, a las que
        disuelve con ácido antes de devorarlas.
      it: |-
        Per far sviluppare le ali, si nutre ogni giorno
        di una grande quantità di prede, che succhia
        dopo averle sciolte con il proprio acido.
    ultra-sun:
      ja-Hrkt: |-
        ハネを　しんどうさせ　ちょうおんぱを
        はなつ。　きぜつした　えものを　すなの
        なかに　いきうめにして　ほぞんする。
      ja: |-
        ハネを　振動させ　超音波を
        放つ。　気絶した　獲物を　砂の
        中に　生き埋めにして　保存する。
      ko: |-
        날개를 진동시켜 초음파를 발산한다.
        기절한 먹이를 모래 속에
        산 채로 묻어 저장한다.
      zh-Hant: |-
        振動翅膀發出超音波。
        會把暈厥的獵物，
        活埋在沙中保存。
      zh-Hans: |-
        振动翅膀，发出超音波。
        会把晕厥的猎物
        活埋在沙子里保存。
      en: |-
        It vibrates its wings to generate ultrasonic
        waves, causing its prey to faint. Then it buries
        the prey alive in the sand to preserve it.
      fr: |-
        Il émet des ultrasons avec ses ailes pour
        assommer ses proies, puis les ensable vivantes
        pour les conserver.
      de: |-
        Durch die Vibration seiner Flügel erzeugt es
        Ultraschallwellen. Es vergräbt bewusstlose
        Beute im Sand, um sie zu konservieren.
      es: |-
        Emite ondas ultrasónicas cuando hace vibrar
        sus alas. Entierra bajo la arena a las presas que
        ha dejado inconscientes para conservarlas.
      it: |-
        Grazie agli ultrasuoni che produce con le
        vibrazioni delle ali, fa svenire le prede e le
        seppellisce nella sabbia per conservarle.
    ultra-moon:
      ja-Hrkt: |-
        ハネを　しんどうさせ　おんぱを
        はっせいさせる。　いっしょに　いる
        トレーナーは　みみせんが　ひつよう。
      ja: |-
        ハネを　振動させ　音波を
        発生させる。　一緒に　いる
        トレーナーは　耳栓が　必要。
      ko: |-
        날개를 진동시켜서 음파를
        발생시킨다. 함께 있는
        트레이너는 귀마개가 필요하다.
      zh-Hant: |-
        會振動翅膀來製造特殊音波。
        和牠待在一起的訓練家
        必須準備耳塞才行。
      zh-Hans: |-
        会振动翅膀，产生特殊的音波。
        呆在一起的训练家
        有必要准备好耳塞。
      en: |-
        It vibrates its wings to send out odd sound
        waves. Trainers who are with it need earplugs.
      fr: |-
        Il émet de puissantes ondes sonores en battant
        des ailes, aussi est-il recommandé à son
        Dresseur de se protéger les tympans.
      de: |-
        Es lässt seine Flügel vibrieren, um dadurch
        bizarre Schallwellen zu erzeugen. Seine Trainer
        brauchen Ohrstöpsel.
      es: |-
        Genera raras ondas sónicas batiendo las alas.
        El estruendo es tal que sus Entrenadores
        necesitan tapones para los oídos.
      it: |-
        Genera strane onde acustiche con le vibrazioni
        delle ali. Gli Allenatori devono proteggersi le
        orecchie con dei tappi.
    sword:
      ja-Hrkt: |-
        ２まいの　ハネを　こうそくで
        しんどうさせて　だす　ちょうおんぱは
        はげしい　ずつうを　ひきおこす。
      ja: |-
        ２枚の　ハネを　高速で
        振動させて　だす　超音波は
        激しい　頭痛を　ひきおこす。
      ko: |-
        2장의 날개를 고속으로
        진동시켜서 내는 초음파는
        격렬한 두통을 불러일으킨다.
      zh-Hant: |-
        ２片翅膀高速振動
        產生的超音波會
        引起劇烈的頭痛。
      zh-Hans: |-
        ２根翅膀高速振动产生的
        超音波会引起剧烈的头痛。
      en: |-
        The ultrasonic waves it generates by rubbing its
        two wings together cause severe headaches.
      fr: |-
        Ses violents battements d’ailes génèrent
        des vagues d’ultrasons qui donnent
        des migraines intenses.
      de: |-
        Die Schallwellen, die es durch seine hohe
        Flügelschlagfrequenz erzeugt, verursachen
        heftige Kopfschmerzen.
      es: |-
        Al agitar sus alas a gran velocidad, emite ondas
        ultrasónicas que provocan fuertes dolores de
        cabeza.
      it: |-
        Fa vibrare velocemente le ali generando
        onde ultrasoniche che provocano dei
        forti mal di testa.
    shield:
      ja-Hrkt: |-
        ハネを　せいちょう　させるために
        まいにち　たいりょうの　えものを
        しょうかえきで　とかして　すする。
      ja: |-
        ハネを　成長　させるために
        毎日　大量の　獲物を
        消化液で　溶かして　すする。
      ko: |-
        날개를 성장시키기 위해
        매일 대량의 먹잇감을
        소화액으로 녹여 마신다.
      zh-Hant: |-
        為了讓翅膀成長，
        每天要用消化液溶化
        並吸食大量的獵物。
      zh-Hans: |-
        为了让翅膀成长，
        每天要用消化液溶化
        并吸食大量的猎物。
      en: |-
        To help make its wings grow, it dissolves
        quantities of prey in its digestive juices and
        guzzles them down every day.
      fr: |-
        Pour aider ses ailes à pousser, il se nourrit chaque
        jour d’un grand nombre de proies qu’il dissout
        en projetant de l’acide.
      de: |-
        Um das Wachstum seiner Flügel zu fördern,
        schlürft es täglich große Mengen an Beute,
        die es zuvor in Magensäure aufgelöst hat.
      es: |-
        Para terminar de desarrollar sus alas, se nutre
        a diario de un gran número de presas, a las que
        disuelve con ácido antes de devorarlas.
      it: |-
        Per far sviluppare le ali, si nutre ogni giorno
        di una grande quantità di prede, che succhia
        dopo averle sciolte con il proprio acido.
