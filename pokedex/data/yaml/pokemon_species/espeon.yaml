    black-2:
      en: |-
        Its fur is so sensitive, it can feel
        minute shifts in the air and predict the
        weather...and its foes’ thoughts.
    white-2:
      en: |-
        Its fur is so sensitive, it can feel
        minute shifts in the air and predict the
        weather...and its foes’ thoughts.
    x:
      ja-Hrkt: |-
        あいての　うごきを　よち　するとき
        ふたまたに　なっている　しっぽの
        さきは　びみょうに　ゆれている。
      ja: |-
        相手の　動きを　予知するとき
        ふたまたに　なっている　尻尾の　先は
        微妙に　揺れている。
      ko: |-
        상대의 움직임을 예지할 때
        두 갈래로 갈라져 있는 꼬리의
        끝이 미세하게 떨리고 있다.
      en: |-
        The tip of its forked tail quivers when it is predicting
        its opponent’s next move.
      fr: |-
        Le bout fourchu de sa queue frémit lorsqu’il prédit
        la prochaine attaque de son adversaire.
      de: |-
        Die Spitze seines geteilten Schweifs bebt, wenn es
        die nächste Attacke seines Feindes voraussagt.
      es: |-
        Al predecir el siguiente movimiento de su rival,
        chasquea el extremo de la cola bífida que tiene.
      it: |-
        Mentre predice la prossima mossa del nemico,
        la coda biforcuta gli inizia a tremare.
    'y':
      ja-Hrkt: |-
        ぜんしんの　こまやかな　たいもうで
        くうきの　ながれを　かんじて　てきの
        かんがえや　てんこうを　よそくする。
      ja: |-
        全身の　細やかな　体毛で
        空気の　流れを　感じて　敵の
        考えや　天候を　予測する。
      ko: |-
        전신의 세밀한 털로
        공기의 흐름을 알아차려 상대의
        생각이나 날씨를 예측한다.
      en: |-
        Its fur is so sensitive, it can feel minute shifts in the
        air and predict the weather...and its foes’ thoughts.
      fr: |-
        Sa fourrure ultrasensible détecte les vibrations de
        l’air. Il peut ainsi prédire le temps ou lire les pensées
        adverses.
      de: |-
        Die Haare seines Fells sind so feinfühlig, dass es
        am Wind ablesen kann, was seine Gegner denken
        und wie das Wetter wird.
      es: |-
        Su pelaje es tan sensible que percibe los cambios en
        el aire y predice así los ataques de sus enemigos y el
        tiempo.
      it: |-
        Grazie al pelo sensibile, percepisce pure gli
        spostamenti d’aria. Sa leggere nel pensiero e
        prevedere il tempo.
    omega-ruby:
      ja-Hrkt: |-
        みとめた　トレーナーには　きわめて　ちゅうじつ。
        トレーナーを　きけんから　まもる　ために
        よちのうりょくが　はったつしたと　いわれている。
      ja: |-
        認めた　トレーナーには　極めて　忠実。
        トレーナーを　危険から　守る　ために
        予知能力が　発達したと　いわれている。
      ko: |-
        인정한 트레이너에게는 극히 충실하다.
        트레이너를 위험에서 지키기 위해
        예지능력이 발달했다고 전해진다.
      en: |-
        Espeon is extremely loyal to any Trainer it considers to
        be worthy. It is said that this Pokémon developed its
        precognitive powers to protect its Trainer from harm.
      fr: |-
        Mentali est extrêmement loyal envers les Dresseurs
        qu’il respecte. On raconte que ce Pokémon a développé
        des talents divinatoires pour protéger son Dresseur.
      de: |-
        Psiana ist jedem Trainer treu, dem es zugetan ist.
        Dieses Pokémon hat die Fähigkeit der Prophezeiung
        entwickelt, um seine Trainer vor Unheil zu bewahren.
      es: |-
        Espeon es tremendamente leal al Entrenador al que considera
        digno de ello. Dicen que este Pokémon desarrolló sus poderes
        adivinatorios para evitar que su Entrenador sufra daño alguno.
      it: |-
        Espeon è estremamente leale nei confronti di qualsiasi
        Allenatore considerato all’altezza. Si dice che questo
        Pokémon abbia sviluppato capacità precognitive per
        proteggere il proprio Allenatore.
    alpha-sapphire:
      ja-Hrkt: |-
        みとめた　トレーナーには　きわめて　ちゅうじつ。
        トレーナーを　きけんから　まもる　ために
        よちのうりょくが　はったつしたと　いわれている。
      ja: |-
        認めた　トレーナーには　極めて　忠実。
        トレーナーを　危険から　守る　ために
        予知能力が　発達したと　いわれている。
      ko: |-
        인정한 트레이너에게는 극히 충실하다.
        트레이너를 위험에서 지키기 위해
        예지능력이 발달했다고 전해진다.
      en: |-
        Espeon is extremely loyal to any Trainer it considers to
        be worthy. It is said that this Pokémon developed its
        precognitive powers to protect its Trainer from harm.
      fr: |-
        Mentali est extrêmement loyal envers les Dresseurs
        qu’il respecte. On raconte que ce Pokémon a développé
        des talents divinatoires pour protéger son Dresseur.
      de: |-
        Psiana ist jedem Trainer treu, dem es zugetan ist.
        Dieses Pokémon hat die Fähigkeit der Prophezeiung
        entwickelt, um seine Trainer vor Unheil zu bewahren.
      es: |-
        Espeon es tremendamente leal al Entrenador al que considera
        digno de ello. Dicen que este Pokémon desarrolló sus poderes
        adivinatorios para evitar que su Entrenador sufra daño alguno.
      it: |-
        Espeon è estremamente leale nei confronti di qualsiasi
        Allenatore considerato all’altezza. Si dice che questo
        Pokémon abbia sviluppato capacità precognitive per
        proteggere il proprio Allenatore.
    sun:
      ja-Hrkt: |-
        ほそく　みじかい　たいもうで　くうきの
        ながれから　あいての　こうどう　まで
        いっしゅんで　よみとってしまう。
      ja: |-
        細く　短い　体毛で　空気の
        流れから　相手の　行動　まで
        一瞬で　読み取ってしまう。
      ko: |-
        가늘고 짧은 털로 공기의
        흐름부터 상대의 행동까지
        순식간에 읽어버린다.
      zh-Hant: |-
        利用又細又短的體毛感受
        空氣的流動，連對手的行動
        也能一瞬間洞悉。
      zh-Hans: |-
        利用又细又短的体毛，
        从空气的流动中，连对手的行动
        也能一瞬间就察觉。
      en: |-
        It can instantaneously sense its opponent’s
        movements by feeling air currents with its
        fine fur.
      fr: |-
        Son pelage court et clairsemé détecte en un
        instant le moindre mouvement de l’air ou de
        l’ennemi.
      de: |-
        Mit seinem feinen, kurzen Fell kann es anhand
        von Luftbewegungen augenblicklich erkennen,
        was sein Gegner plant.
      es: |-
        Su corto y fino pelaje percibe los cambios en el
        aire y esto le permite predecir los movimientos
        de sus oponentes.
      it: |-
        Riesce a prevedere in un istante le mosse
        dei nemici analizzando le correnti d’aria
        grazie al suo pelo corto e fine.
    moon:
      ja-Hrkt: |-
        ひたいの　たまから　サイコパワーを
        ほうしゃして　たたかう。　パワーが
        つきると　たまの　いろが　くすむ。
      ja: |-
        額の　玉から　サイコパワーを
        放射して　戦う。　パワーが
        尽きると　玉の　色が　くすむ。
      ko: |-
        이마의 구슬에서 사이코 파워를
        방사해서 싸운다. 파워가
        다하면 구슬의 색이 흐려진다.
      zh-Hant: |-
        從額頭的珠子放射出精神力量
        進行戰鬥。當力量用盡時，
        珠子的顏色也會褪去。
      zh-Hans: |-
        从额头的珠子放射出精神力量
        进行战斗。当力量用尽时，
        珠子的颜色也会褪去。
      en: |-
        It unleashes psychic power from the orb on its
        forehead. When its power is exhausted, the orb
        grows dull and dark.
      fr: |-
        Le joyau sur son front projette des ondes
        psychiques en combat, et s’obscurcit lorsque
        Mentali est à bout de force.
      de: |-
        Über die Kugel an seiner Stirn feuert es
        Psycho-Kräfte ab. Geht ihm die Kraft aus,
        verliert die Farbe der Kugel an Glanz.
      es: |-
        Lucha con los poderes psíquicos que brotan de
        la esfera de su frente, que se oscurece cuando
        su energía disminuye.
      it: |-
        Lotta emettendo poteri psichici dalla sfera
        che ha sulla fronte, che diventa più scura
        man mano che le sue energie diminuiscono.
    ultra-sun:
      ja-Hrkt: |-
        もともとは　なんの　のうりょくも
        なかったが　みを　まもるために
        よちのうりょくに　めざめたと　いう。
      ja: |-
        元々は　なんの　能力も
        なかったが　身を　守るために
        予知能力に　目覚めたと　いう。
      ko: |-
        원래는 아무런 능력도 없었지만
        몸을 지키기 위해
        예지 능력에 눈뜨게 됐다고 한다.
      zh-Hant: |-
        據說本來沒有任何能力，
        是為了要保護自己，
        預知的能力才因此覺醒。
      zh-Hans: |-
        本来没有任何能力，
        但据说为了保护自己
        从而觉醒了预知能力。
      en: |-
        Although it originally had no powers at all,
        people say its precognitive faculties were
        awakened by its need to protect itself.
      fr: |-
        À l’origine, il n’était doté d’aucune compétence
        particulière, mais il a développé un don de
        prescience pour se défendre.
      de: |-
        Es heißt, dass die Fähigkeit der Prophezeiung
        erst im Laufe der Zeit in ihm erwacht sei, damit
        es sich selbst vor Unheil bewahren könne.
      es: |-
        Originariamente, carecía de habilidades
        especiales, pero terminó desarrollando
        facultades premonitorias para protegerse.
      it: |-
        Inizialmente non aveva particolari abilità,
        ma in seguito ha sviluppato delle capacità
        premonitrici per difendersi.
    ultra-moon:
      ja-Hrkt: |-
        にっこうを　あびていると　ひたいの
        たまに　サイコパワーが　たまっていく。
        よるの　たたかいは　にがて　なのだ。
      ja: |-
        日光を　浴びていると　額の
        玉に　サイコパワーが　たまっていく。
        夜の　戦いは　苦手　なのだ。
      ko: |-
        햇빛을 받으면 이마의 구슬에
        사이코 파워가 모인다.
        밤에 하는 싸움에 약하다.
      zh-Hant: |-
        只要沐浴在陽光下，額頭上的
        珠子裡就會開始累積精神力量。
        不擅長在夜間戰鬥。
      zh-Hans: |-
        如果沐浴在阳光下，额头上的
        珠子就会开始储存精神力量。
        不擅长夜间战斗。
      en: |-
        Psychic power builds up in the orb on its
        forehead as it bathes in the sunshine. Espeon is
        not good at battling at night.
      fr: |-
        Le joyau sur son front accumulant de la force
        psychique lorsqu’il est exposé à la lumière
        du soleil, il préfère les combats de jour.
      de: |-
        Indem es im Sonnenlicht badet, speichert es
        Psycho-Kraft in der Kugel an seiner Stirn. Daher
        tut es sich nachts beim Kämpfen etwas schwer.
      es: |-
        La luz del sol imbuye de poder psíquico la
        esfera de su frente, por lo que los combates
        nocturnos son su punto débil.
      it: |-
        Accumula poteri psichici esponendo alla luce
        solare la sfera che ha sulla fronte.
        Le lotte notturne non sono il suo forte.
    sword:
      ja-Hrkt: |-
        くうきの　ながれを　よみとることで
        これからの　てんきや　あいての
        うごきなどを　すべて　あててしまう。
      ja: |-
        空気の　流れを　読みとることで
        これからの　天気や　相手の
        動きなどを　すべて　当ててしまう。
      ko: |-
        공기의 흐름을 읽어내서
        앞으로의 날씨와 상대의
        움직임 등을 모두 맞혀버린다.
      zh-Hant: |-
        能透過感受空氣的流動，
        準確地預測出接下來的
        天氣和對手的行動等等。
      zh-Hans: |-
        能通过感受空气的流动，
        准确地预测出接下来的
        天气和对手的行动等等。
      en: |-
        By reading air currents, it can predict things such
        as the weather or its foe’s next move.
      fr: |-
        En analysant les courants aériens, il peut prédire
        la météo ou même les mouvements de son ennemi.
      de: |-
        Es analysiert Luftströmungen und kann dadurch
        das Wetter oder die nächste Attacke des
        Gegners vorhersehen.
      es: |-
        Basándose en las corrientes de aire, predice
        cosas como el tiempo atmosférico o la próxima
        acción del enemigo.
      it: |-
        Analizza le correnti d’aria per predire le
        condizioni atmosferiche o la prossima
        mossa del nemico.
    shield:
      ja-Hrkt: |-
        ひたいの　たまから　サイコパワーを
        ほうしゃして　たたかう。　パワーが
        つきると　たまの　いろが　くすむ。
      ja: |-
        額の　珠から　サイコパワーを
        放射して　戦う。　パワーが
        つきると　珠の　色が　くすむ。
      ko: |-
        이마의 구슬에서 사이코 파워를
        방사해서 싸운다. 파워가
        다하면 구슬의 색이 흐려진다.
      zh-Hant: |-
        從額頭的珠子放射出精神力量
        進行戰鬥。當力量用盡時，
        珠子的顏色也會褪去。
      zh-Hans: |-
        从额头的珠子放射出精神力量
        进行战斗。当力量用尽时，
        珠子的颜色也会褪去。
      en: |-
        It unleashes psychic power from the orb on its
        forehead. When its power is exhausted, the orb
        grows dull and dark.
      fr: |-
        Le joyau sur le front de Mentali projette
        des ondes psychiques en combat, et s’obscurcit
        quand il est à bout de force.
      de: |-
        Über die Kugel an seiner Stirn feuert es
        Psycho-Kräfte ab. Geht ihm die Kraft aus,
        verliert die Farbe der Kugel an Glanz.
      es: |-
        Lucha con los poderes psíquicos que brotan de
        la esfera de su frente, que se oscurece cuando
        su energía disminuye.
      it: |-
        Lotta emettendo poteri psichici dalla sfera
        che ha sulla fronte, che diventa più scura
        man mano che le sue energie diminuiscono.
    legends-arceus:
      en: |-
        Wields an arcane power with which it can predict the weather
        and even people's thoughts. When bathed in sunshine, the
        scarlet orb on its brow glows and builds energy.
