sewaddle:
  base_happiness: 70
  capture_rate: 255
  color: yellow
  egg_groups:
    - bug
  evolution_chain: sewaddle
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        Leavanny dress it in clothes they made
        for it when it hatched. It hides its head
        in its hood while it is sleeping.
      fr: |-
        Quand il éclot, Manternel lui coud son
        vêtement. Il dort en cachant son
        visage sous sa capuche.
    white:
      en: |-
        This Pokémon makes clothes for itself.
        It chews up leaves and sews them with
        sticky thread extruded from its mouth.
      fr: |-
        Il fait des vêtements en découpant des
        feuilles et en les cousant avec le fil
        adhésif qu’il sécrète par la bouche.
    black-2:
      en: |-
        Since this Pokémon makes its own
        clothes out of leaves, it is a popular
        mascot for fashion designers.
    white-2:
      en: |-
        Since this Pokémon makes its own
        clothes out of leaves, it is a popular
        mascot for fashion designers.
    x:
      ja-Hrkt: |-
        はっぱを　かみきり　くちから　だす
        ねんちゃくいとで　ぬいあわせて
        じぶんで　ふくを　つくる　ポケモン。
      ja: |-
        葉っぱを　かみ切り　口から　出す
        粘着糸で　縫い合わせる。
        自分で　服を　作る　ポケモン。
      ko: |-
        잎사귀를 물어뜯어
        입에서 뱉어낸 점착실로 꿰맨다.
        스스로 옷을 만드는 포켓몬이다.
      en: |-
        This Pokémon makes clothes for itself. It chews up
        leaves and sews them with sticky thread extruded
        from its mouth.
      fr: |-
        Il fait des vêtements en découpant des feuilles et
        en les cousant avec le fil adhésif qu’il sécrète par
        la bouche.
      de: |-
        Schneidert sich ein Kleid, indem es sich Blätter
        zurechtbeißt und sie mit Klebefäden aus seinem
        Mund zusammennäht.
      es: |-
        Recorta hojas y las teje con el líquido viscoso que
        segrega por la boca para hacerse su propia ropa.
      it: |-
        Si prepara da sé i vestiti, tagliando le foglie e usando
        i fili viscosi che secerne dalla bocca per cucirli.
    'y':
      ja-Hrkt: |-
        はっぱから　ふくを　つくるので
        ファッションデザイナーから
        マスコットとして　にんきがある。
      ja: |-
        葉っぱから　服を　つくるので
        ファッションデザイナーから
        マスコットとして　人気がある。
      ko: |-
        잎사귀로 옷을 만들기 때문에
        패션 디자이너에게
        마스코트로 인기가 있다.
      en: |-
        Since this Pokémon makes its own clothes out of
        leaves, it is a popular mascot for fashion designers.
      fr: |-
        La mascotte des créateurs de mode. Il découpe
        ses vêtements dans les feuilles qu’il trouve.
      de: |-
        Unter Modeschöpfern gilt es als beliebtes
        Maskottchen, da es sich aus Blättern
        Kleidchen schneidert.
      es: |-
        Usa hojas como material para fabricar su propia ropa,
        por lo que los diseñadores más famosos los tienen
        como mascota.
      it: |-
        Taglia le foglie per farne vestiti. Per questo motivo
        è la mascotte preferita di molti stilisti.
    omega-ruby:
      ja-Hrkt: |-
