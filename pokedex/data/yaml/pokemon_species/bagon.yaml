        Pour l’heure, il s’entraîne en
        sautant du haut des falaises.
    black-2:
      en: |-
        Dreaming of one day flying, it
        practices by leaping off cliffs
        every day.
    white-2:
      en: |-
        Dreaming of one day flying, it
        practices by leaping off cliffs
        every day.
    x:
      ja-Hrkt: |-
        きたえられた　くびの　きんにくと
        てつの　ように　かたい　あたまで
        おおいわを　コナゴナに　くだく。
      ja: |-
        鍛えられた　首の　筋肉と
        鉄の　ように　硬い　頭で
        大岩を　コナゴナに　砕く。
      ko: |-
        단련된 목 근육과
        철과 같이 단단한 머리로
        커다란 바위를 조각조각으로 부순다.
      en: |-
        Its well-developed neck muscles and iron-like
        head can smash boulders into pieces.
      fr: |-
        Il réduit en miettes les plus gros rochers grâce à
        son cou musculeux et à sa tête dure comme l’acier.
      de: |-
        Mit seinen robusten Nackenmuskeln und seinem
        stahlharten Kopf kann es sogar Felsen zertrümmern.
      es: |-
        Su desarrollado cuello y su cabeza dura como el acero
        le permiten reducir a añicos rocas enormes.
      it: |-
        Frantuma grandi massi con la testa dura come il
        ferro e gli allenatissimi muscoli del collo.
    'y':
      ja-Hrkt: |-
        おおぞらを　とぶことを　ゆめみて
        まいにち　とぶ　れんしゅうのために
        がけから　とびおりている。
      ja: |-
        大空を　飛ぶことを　夢見て
        毎日　飛ぶ　練習のために
        崖から　飛び降りている。
      ko: |-
        넓은 하늘을 나는 것을 꿈꾸며
        매일 나는 연습을 하려고
        절벽에서 뛰어내린다.
      en: |-
        Dreaming of one day flying, it practices by leaping
        off cliffs every day.
      fr: |-
        Il rêve de pouvoir voler un jour. Pour l’heure,
        il s’entraîne en sautant du haut des falaises.
      de: |-
        Es träumt davon, eines Tages fliegen zu können
        und springt daher jeden Tag von hohen Klippen.
      es: |-
        Sueña con volar algún día, por lo que siempre practica
        saltando desde acantilados.
      it: |-
        Sogna di poter volare un giorno e, pertanto, si allena
        regolarmente gettandosi da alture.
    omega-ruby:
      ja-Hrkt: |-
        おおぞらを　とぶことを　ゆめみて　くりかえし
        だんがいから　とびおりている　うちに　あたまが
        きたえられ　こうてつの　ように　かたく　なった。
      ja: |-
        大空を　飛ぶことを　夢見て　繰り返し
        断崖から　飛び降りている　うちに　頭が
        鍛えられ　鋼鉄の　ように　硬く　なった。
      ko: |-
        넓은 하늘을 나는 것을 꿈꾸며 연거푸
        낭떠러지에서 뛰어내리다 보니 머리가
        단련되어 강철처럼 단단해졌다.
      en: |-
        Bagon has a dream of one day soaring in the sky.
        In doomed efforts to fly, this Pokémon hurls itself off cliffs.
        As a result of its dives, its head has grown tough and as hard
        as tempered steel.
      fr: |-
        Draby rêve de pouvoir un jour s’élancer dans les cieux.
        Bien que voué à l’échec, ce Pokémon se jette des falaises
        pour essayer de voler. À force, sa tête est devenue
        aussi dure que de l’acier.
      de: |-
        Kindwurm hat den Traum, fliegen zu können. In zahlreichen
        vergeblichen Versuchen stürzte es sich die Klippen herunter.
        Daher ist sein Kopf sehr robust und so hart wie Stahl
        geworden.
      es: |-
        Bagon sueña con poder pasar un día volando por el cielo. En
        vanos intentos por volar, ha llegado a tirarse desde riscos.
        Como resultado de estas caídas en picado, se le ha puesto la
        cabeza dura como las piedras.
      it: |-
        Bagon serba in sé il sogno di volare alto in cielo. Nei suoi vani
        tentativi di spiccare il volo, si lancia a picco dalle alture.
        A causa di queste rovinose cadute, la testa gli è diventata
        dura come l’acciaio temprato.
    alpha-sapphire:
      ja-Hrkt: |-
        おおぞらを　とぶことを　ゆめみている　ポケモン。
        とべない　くやしさを　はらす　ように　おおいわに
        いしあたまを　うちつけては　コナゴナに　くだく。
      ja: |-
        大空を　飛ぶことを　夢見ている　ポケモン。
        飛べない　悔しさを　晴らす　ように　大岩に
        石頭を　打ちつけては　コナゴナに　砕く。
      ko: |-
        넓은 하늘을 나는 것을 꿈꾸는 포켓몬이다.
        날지 못하는 분함을 떨치기 위한 것인 양 큰 바위에
        돌머리를 부딪쳐서 산산조각으로 부순다.
      en: |-
        Bagon harbors a never-ending dream of one day soaring high
        among the clouds. As if trying to dispel its frustration over its
        inability to fly, this Pokémon slams its hard head against huge
        rocks and shatters them into pebbles.
      fr: |-
        Draby rêve depuis toujours de voler au milieu des nuages.
        Ce Pokémon éclate d’énormes rochers avec sa tête, comme
        pour exorciser le fait qu’il ne puisse pas voler.
      de: |-
        Kindwurm hegt einen unerfüllten Traum. Es möchte einmal
        hoch über den Wolken fliegen. Um seinen Frust über seine
        Flugunfähigkeit zu vertreiben, rammt es seinen harten Kopf
        gegen riesige Felsen und macht Kiesel aus ihnen.
      es: |-
        Bagon sueña siempre con lo mismo: pasar todo un día
        volando entre las nubes. Frustrado ante la imposibilidad de
        volar, parece que se desahoga dándose cabezazos contra
        rocas enormes hasta hacerlas añicos.
      it: |-
        Da sempre Bagon serba in sé il sogno di volare alto tra le
        nuvole. Sfoga la sua frustrazione per l’incapacità di volare
        sbattendo la testa dura contro rocce enormi, che frantuma
        in mille pezzi.
    sun:
      ja-Hrkt: |-
        いつか　とべると　しんじているのは
        いでんしの　なかの　じょうほうが
        えいきょう　しているから　らしい。
      ja: |-
        いつか　飛べると　信じているのは
        遺伝子の　中の　情報が
        影響　しているから　らしい。
      ko: |-
        언젠가 날 수 있다고 믿는 것은
        유전자 안의 정보가
        영향을 주고 있기 때문이라고 한다.
      zh-Hant: |-
        牠之所以深信自己
        總有一天能飛，據說是因為
        受到基因中的資訊影響。
      zh-Hans: |-
        它相信自己早晚能飞，
        听说是因为受到
        遗传基因中信息的影响。
      en: |-
        Its belief that it will be able to fly one day
        is apparently the influence of information
        carried in its genes.
      fr: |-
        Sa lubie de voler lui viendrait d’une information
        contenue dans ses gènes.
      de: |-
        Es liegt wohl an den Erbinformationen in
        seinen Genen, dass es glaubt, eines Tages
        fliegen zu können.
      es: |-
        Parece ser que la información genética de los
        Bagon les impulsa a creer que algún día serán
        capaces de volar.
      it: |-
        Pare che la sua convinzione di poter imparare
        a volare sia dovuta a delle informazioni
        contenute nel suo codice genetico.
    moon:
      ja-Hrkt: |-
        こうてつなみの　いしあたまで
        やたら　めったら　ずつきする。
        そらを　とべない　ストレスの　せいだ。
      ja: |-
        鋼鉄並みの　石頭で
        やたら　めったら　頭突きする。
        空を　飛べない　ストレスの　せいだ。
      ko: |-
        강철 수준의 돌머리로
        마구잡이로 박치기한다.
        하늘을 날 수 없는 스트레스 때문이다.
      zh-Hant: |-
        用鋼鐵般堅硬的腦袋胡亂地
        作出頭錘攻擊。這是無法飛到
        空中的精神壓力造成的。
      zh-Hans: |-
        用钢铁般坚硬的脑袋胡乱地
        头锤攻击。这是无法飞到
        空中的精神压力造成的。
      en: |-
        With its steel-hard stone head, it headbutts
        indiscriminately. This is because of the stress
        it feels at being unable to fly.
      fr: |-
        Il charge sans distinction tout ce qui l’entoure,
        distribuant allègrement les coups de tête.
        Il extériorise ainsi son stress de ne pas voler.
      de: |-
        Es verteilt oft Kopfstöße mit seinem stahlharten
        Schädel. Grund ist offenbar der Frust darüber,
        dass es nicht fliegen kann.
      es: |-
        Se lanza de cabeza contra todo lo que se le
        pone a tiro para lidiar con la frustración que le
        causa el no poder surcar los cielos.
      it: |-
        Colpisce tutto quello che gli capita a tiro
        con la testa dura come l’acciaio per sfogare
        la frustrazione dovuta all’incapacità di volare.
    ultra-sun:
      ja-Hrkt: |-
        そらをとぶ　とりポケモンを　みるたび
        うらやましくなって　ヘッドバッドで
        あたりのものを　こなごなに　くだく。
      ja: |-
        空を飛ぶ　とりポケモンを　見るたび
        羨ましくなって　ヘッドバッドで
        あたりのものを　粉々に　砕く。
      ko: |-
        하늘을 나는 새포켓몬을 볼 때마다
        부러워서 머리로 주변에 있는 것을
        들이받아 산산조각으로 부숴 버린다.
      zh-Hant: |-
        每當見到飛在天空上的鳥寶可夢，
        牠就會羨慕到用頭錘
        把周圍的東西砸得粉碎。
      zh-Hans: |-
        每次见到在空中飞行的鸟宝可梦，
        就会变得非常羡慕，
        而用头锤把周围的东西砸得粉碎。
      en: |-
        Whenever it sees bird Pokémon flying through
        the sky, it becomes envious and smashes its
        surroundings to bits with headbutts.
      fr: |-
        Il est jaloux des Pokémon oiseaux. Dès qu’il en
        voit un voler, il donne des coups de tête dans
        tous les sens et détruit tout sur son passage.
      de: |-
        Jedes Mal, wenn es ein Vogel-Pokémon am
        Himmel fliegen sieht, zerstört es vor Neid
        alles in seiner Umgebung mit Kopfstößen.
      es: |-
        Cada vez que ve volar a un Pokémon pájaro le
        corroe la envidia por dentro y asesta cabezazos
        a todo lo que le rodea hasta hacerlo añicos.
      it: |-
        Ogni volta che vede volare i Pokémon alati,
        viene preso dall’invidia e polverizza a testate
        qualunque cosa abbia a tiro.
    ultra-moon:
      ja-Hrkt: |-
        あたまを　つよく　うちつける　ことで
        しんかに　えいきょうする　さいぼうを
        しげきしている　というせつも　ある。
      ja: |-
        頭を　強く　打ちつける　ことで
        進化に　影響する　細胞を
        刺激している　という説も　ある。
      ko: |-
        머리를 강하게 부딪쳐서
        진화에 영향을 주는 세포를
        자극하고 있다는 설도 있다.
      zh-Hant: |-
        也有說法是，牠會藉由
        用力地撞擊頭部來刺激
        影響進化的細胞。
      zh-Hans: |-
        也有说法，说它通过重重地
        敲打脑袋来刺激影响进化的细胞。
      en: |-
        Some theories suggest that its behavior
        of forcefully bashing its head into things
        stimulates cells that affect its evolution.
      fr: |-
        Selon certaines théories, il donne des coups
        de tête pour stimuler les cellules qui lui
        permettent d’évoluer.
      de: |-
        Einer Theorie zufolge werden durch seine
        Kopfstöße Zellen angeregt, die seine
        Entwicklung beeinflussen.
      es: |-
        Según una teoría, los fuertes cabezazos que
        propina estimulan las células implicadas en su
        evolución.
      it: |-
        Secondo una teoria, le potenti testate che sferra
        permetterebbero di stimolare le cellule che
        presiedono all’evoluzione.
    sword:
      ja-Hrkt: |-
        いつか　そらを　とぶために　まいにち
        がけから　とびおりて　からだを
        きたえる　くんれんを　つづけている。
      ja: |-
        いつか　空を　飛ぶために　毎日
        崖から　飛び降りて　体を
        鍛える　訓練を　続けている。
      ko: |-
        언젠가 하늘을 날기 위해
        매일같이 절벽에서 뛰어내리며
        몸을 단련하는 훈련을 계속하고 있다.
      zh-Hant: |-
        為了有朝一日能在天空翱翔，
        牠每天都會從懸崖上跳下來，
        藉此不斷地鍛鍊自己的身體。
      zh-Hans: |-
        为了有一天能翱翔天空，
        每天都从悬崖上跳下来，
        坚持训练锻炼身体。
      en: |-
        Bagon jumps off cliffs every day, trying to
        grow stronger so that someday it will be able
        to fly.
      fr: |-
        Tous les jours, il se jette du haut d’une falaise
        pour renforcer son corps, dans l’espoir de
        pouvoir voler un jour.
      de: |-
        In der Hoffnung, eines Tages fliegen zu können,
        stürzt es sich täglich von Klippen, um seinen
        Körper zu stählen.
      es: |-
        En su afán por volar, fortalece su cuerpo a diario
        saltando desde acantilados.
      it: |-
        Tempra il suo corpo ogni giorno gettandosi
        in un precipizio, nella speranza di riuscire
        a volare, prima o poi.
    shield:
      ja-Hrkt: |-
        むれを　つくらず　１ぴきで　くらす。
        いちげきで　かたい　がんせきを
        まっぷたつにする　いしあたまをもつ。
      ja: |-
        群れを　つくらず　１匹で　暮らす。
        一撃で　硬い　岩石を
        真っ二つにする　石頭をもつ。
      ko: |-
        무리를 짓지 않고 혼자서 지낸다.
        단단한 화석을 단 일격으로
        두 동강 내버리는 돌머리를 가졌다.
      zh-Hant: |-
        不集結成群，而是單獨生活。
        擁有硬得不得了的頭部，能夠
        一擊就把堅硬的岩石撞成兩半。
      zh-Hans: |-
        不会成群结队，喜欢单独生活。
        脑袋很硬，只要猛地一撞，
        就能把坚硬的岩石一分为二。
      en: |-
        Bagon is a solitary Pokémon that doesn’t form
        groups with others of its kind. It also has a head
        hard enough to cleave a boulder in one strike.
      fr: |-
        La tête de ce Pokémon solitaire est si solide
        qu’il est capable de fendre en deux un rocher
        d’un seul coup.
      de: |-
        Es lebt in Einsamkeit, ohne Gruppen zu bilden.
        Sein steinharter Schädel kann mit einem Schlag
        einen massiven Felsen entzweihauen.
      es: |-
        Vive en solitario, sin formar manadas, y posee
        una cabeza dura como la piedra que le permite
        hacer añicos rocas enormes de un solo golpe.
      it: |-
        Vive in solitudine senza formare branchi.
        È dotato di una testa così dura da poter spaccare
        in due rocce granitiche con un solo colpo.
