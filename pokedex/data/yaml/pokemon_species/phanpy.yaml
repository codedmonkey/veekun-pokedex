    x:
      ja-Hrkt: |-
        あいじょう　ひょうげんで　はなを
        ぶつけてくるが　ちからが　あるので
        きをつけないと　ふっとばされる。
      ja: |-
        愛情表現で　鼻を　ぶつけてくるが
        力が　あるので
        気をつけないと　吹っ飛ばされる。
      ko: |-
        애정 표현으로 코를
        부딪쳐 오지만 힘이 있기 때문에
        조심하지 않으면 날아가 버린다.
      en: |-
        As a sign of affection, it bumps with its snout.
        However, it is so strong, it may send you flying.
      fr: |-
        Il se cogne sur celui ou celle qu’il apprécie. Il est
        cependant si fort qu’il fait souvent mal.
      de: |-
        Als Zeichen seiner Zuneigung stupst es dich mit
        dem Rüssel, was dich aber buchstäblich umwerfen
        könnte.
      es: |-
        Como muestra de afecto, golpea con su trompa.
        Aunque es tan fuerte que te mandará lejos.
      it: |-
        Dà colpi con il muso in segno di affetto, ma è così
        forte che può far volare la gente in questo modo.
    'y':
      ja-Hrkt: |-
        からだは　ちいさいが　ちからもち。
        おとなの　ひとを　かるがると
        せなかに　のせて　あるいてしまう。
      ja: |-
        体は　小さいが　力持ち。
        大人の　人を　軽々と
        背中に　乗せて　歩いてしまう。
      ko: |-
        몸은 작지만 힘이 장사다.
        어른인 사람을 가볍게
        등에 태우고 걸어 다닌다.
      en: |-
        It is strong despite its compact size. It can easily
        pick up and carry an adult human on its back.
      fr: |-
        Il est fort malgré son aspect ramassé. Il n’a aucun mal
        à porter un humain adulte sur son dos.
      de: |-
        Trotz seiner geringen Größe ist es stark. Es kann
        einen Erwachsenen mühelos auf dem Rücken tragen.
      es: |-
        A pesar de su tamaño reducido, es tan fuerte que
        puede llevar a un humano a su espalda con facilidad.
      it: |-
        Non è molto grande, ma è forte. Può sollevare un
        adulto e trasportarlo sul dorso senza fatica.
    omega-ruby:
      ja-Hrkt: |-
        かわの　ほとりに　たてあなを　ほって　くらす。
        すみかの　ちかくに　はなの　しるしを　つけて
        じぶんの　ばしょだと　なかまに　おしえているよ。
      ja: |-
        川の　畔に　縦穴を　掘って　暮らす。
        すみかの　近くに　鼻の　印を　つけて
        自分の　場所だと　仲間に　教えているよ。
      ko: |-
        강 근처에 수직으로 구멍을 파고 산다.
        사는 곳 가까이에 코의 표시를 남겨
        자신의 장소라고 동료에게 알리고 있다.
      en: |-
        For its nest, Phanpy digs a vertical pit in the ground at the
        edge of a river. It marks the area around its nest with its trunk
        to let the others know that the area has been claimed.
      fr: |-
        Pour faire son nid, Phanpy creuse un trou au bord d’une
        rivière. Il délimite la zone autour de son nid avec sa trompe
        pour prévenir les autres que ce territoire est le sien.
      de: |-
        Um sich ein Nest zu bauen, gräbt Phanpy am Flussufer ein
        Loch ins Erdreich. Es markiert die Umgebung seines Nests
        mithilfe seines Rüssels, damit seine Artgenossen wissen,
        dass dieses Gebiet vergeben ist.
      es: |-
        Phanpy cava un agujero profundo para hacer su nido en el
        suelo, en la ribera de los ríos, y marca con la trompa la zona
        para que el resto vea que ese terreno ya está ocupado.
      it: |-
        Phanpy crea il suo nido scavando delle fosse profonde
        nel terreno in riva al fiume. Delimita l’area attorno al nido
        usando la proboscide per indicare la sua proprietà.
    alpha-sapphire:
      ja-Hrkt: |-
        ながい　はなを　つかって　みずあびを　する。
        なかまが　あつまってくると　みずを　かけあう。
        ずぶぬれの　からだを　みずべで　かわかすよ。
      ja: |-
        長い　鼻を　使って　水浴びを　する。
        仲間が　集まってくると　水を　掛け合う。
        ずぶぬれの　体を　水辺で　乾かすよ。
      ko: |-
        긴 코를 써서 물을 끼얹는다.
        동료가 모여들면 서로 물을 끼얹는다.
        흠뻑 젖은 몸을 물가에서 말린다.
      en: |-
        Phanpy uses its long nose to shower itself. When others
        gather around, they thoroughly douse each other with water.
        These Pokémon can be seen drying their soaking-wet
        bodies at the edge of water.
      fr: |-
        Phanpy utilise sa petite trompe pour se doucher.
        Quand plusieurs d’entre eux se réunissent, ils s’arrosent
        joyeusement. On peut souvent voir ces Pokémon se sécher
        au bord de l’eau.
      de: |-
        Phanpy kann sich mit seiner Nase selbst duschen. Wenn
        andere dabei sind, begießen sie sich gegenseitig mit Wasser.
        Danach trocknet es seinen durchnässten Körper am Ufer.
      es: |-
        Phanpy se vale de la trompa para ducharse. Cuando varios se
        agrupan, se dedican a echarse agua unos a otros. Es muy fácil
        ver a estos Pokémon secándose cerca del agua.
      it: |-
        Phanpy usa la proboscide per farsi la doccia. Questi Pokémon
        sono soliti raggrupparsi per spruzzarsi d’acqua a vicenda.
        Poi, è frequente vederli mentre si asciugano il corpo fradicio
        a riva.
