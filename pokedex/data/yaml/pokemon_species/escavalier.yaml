escavalier:
  base_happiness: 50
  capture_rate: 75
  color: gray
  egg_groups:
    - bug
  evolution_chain: karrablast
  evolves_from: karrablast
  flavor_text:
    black:
      en: |-
        They fly around at high speed, striking
        with their pointed spears. Even when in
        trouble, they face opponents bravely.
      fr: |-
        Il vole à toute vitesse et frappe tout
        ennemi de ses lances pointues. Il combat
        bravement contre les plus forts que lui.
    white:
      en: |-
        These Pokémon evolve by wearing the
        shell covering of a Shelmet. The steel
        armor protects their whole body.
      fr: |-
        Un Pokémon qui a évolué en portant la
        carapace d’un Escargaume. Une armure
        de fer protège tout son corps.
    black-2:
      en: |-
        Wearing the shell covering they stole
        from Shelmet, they defend themselves
        and attack with two lances.
    white-2:
      en: |-
        Wearing the shell covering they stole
        from Shelmet, they defend themselves
        and attack with two lances.
    x:
      ja-Hrkt: |-
        チョボマキから　うばった　カラで
        からだを　おおい　ガードしながら
        ２ほんの　ヤリで　つついてくる。
      ja: |-
        チョボマキから　奪った　殻で
        体を　覆い　ガードしながら
        ２本の　ヤリで　突いてくる。
      ko: |-
        쪼마리에게서 뺏은 껍질로
        몸을 에워싸 가드하면서
        2개의 창으로 찔러온다.
      en: |-
        Wearing the shell covering they stole from Shelmet,
        they defend themselves and attack with two lances.
      fr: |-
        Ce Pokémon se protège avec la carapace dérobée
        à un Escargaume et attaque avec ses deux
        redoutables lances.
      de: |-
        Eine von einem Schnuthelm gestohlene Muschel
        dient ihm als Helm. Es greift Gegner mit seinen
        beiden Lanzen an.
      es: |-
        Se defienden de los ataques con el caparazón que
        roban a los Shelmet. Atacan con sus dos mortíferas
        lanzas.
      it: |-
        Protegge il corpo con la conchiglia che ha rubato a
        Shelmet mentre spunzona il nemico con due lance.
    'y':
      ja-Hrkt: |-
        チョボマキの　カラを　みにつけて
        しんかした　ポケモン。こうてつの
        よろいが　ぜんしんを　ガードする。
      ja: |-
        チョボマキの　殻を　身につけて
        進化した　ポケモン。鋼鉄の　よろいが
        全身を　ガードする。
      ko: |-
        쪼마리의 껍질을 입고
        진화한 포켓몬이다. 강철의
        갑옷이 전신을 보호한다.
      en: |-
        These Pokémon evolve by wearing the shell
        covering of a Shelmet. The steel armor protects
        their whole body.
      fr: |-
        Un Pokémon qui a évolué en portant la carapace
        d’un Escargaume. Une armure de fer protège tout
        son corps.
      de: |-
        Es ist bei der Entwicklung in die Muschel eines
        Schnuthelm geschlüpft. Die Eisenrüstung schützt
        seinen ganzen Körper.
      es: |-
        Pokémon que evolucionó poniéndose el caparazón de
        Shelmet. Su armazón de acero le protege todo el
        cuerpo.
      it: |-
        Pokémon che si è evoluto appropriandosi della
        conchiglia di Shelmet. Un’armatura d’acciaio
        protegge tutto il suo corpo.
    omega-ruby:
      ja-Hrkt: |-
        チョボマキから　うばった　カラで
        からだを　おおい　ガードしながら
        ２ほんの　ヤリで　つついてくる。
      ja: |-
        チョボマキから　奪った　殻で
        体を　覆い　ガードしながら
        ２本の　ヤリで　突いてくる。
      ko: |-
        쪼마리에게서 뺏은 껍질로
        몸을 에워싸 가드하면서
        2개의 창으로 찔러온다.
      en: |-
        Wearing the shell covering they stole from Shelmet,
        they defend themselves and attack with two lances.
      fr: |-
        Ce Pokémon se protège avec la carapace dérobée à un
        Escargaume et attaque avec ses deux redoutables lances.
      de: |-
        Eine von einem Schnuthelm gestohlene Muschel dient ihm
        als Helm. Es greift Gegner mit seinen beiden Lanzen an.
      es: |-
        Se defienden de los ataques con el caparazón que roban a
        los Shelmet. Atacan con sus dos mortíferas lanzas.
      it: |-
        Protegge il corpo con la conchiglia che ha rubato a Shelmet
        mentre spunzona il nemico con due lance.
    alpha-sapphire:
      ja-Hrkt: |-
        チョボマキの　カラを　みにつけて
        しんかした　ポケモン。こうてつの
        よろいが　ぜんしんを　ガードする。
      ja: |-
        チョボマキの　殻を　身につけて
        進化した　ポケモン。鋼鉄の　よろいが
        全身を　ガードする。
      ko: |-
        쪼마리의 껍질을 입고
        진화한 포켓몬이다. 강철의
        갑옷이 전신을 보호한다.
      en: |-
        These Pokémon evolve by wearing the shell
        covering of a Shelmet. The steel armor protects
        their whole body.
      fr: |-
        Un Pokémon qui a évolué en portant la carapace
        d’un Escargaume. Une armure de fer protège tout
        son corps.
      de: |-
        Es ist bei der Entwicklung in die Muschel eines Schnuthelm
        geschlüpft. Die Eisenrüstung schützt seinen ganzen Körper.
      es: |-
        Pokémon que evolucionó poniéndose el caparazón de
        Shelmet. Su armazón de acero le protege todo el cuerpo.
      it: |-
        Pokémon che si è evoluto appropriandosi della conchiglia
        di Shelmet. Un’armatura d’acciaio protegge tutto il suo corpo.
    sword:
      ja-Hrkt: |-
        チョボマキの　からを　うばって
        かんぜんぶそう。　ガラルちほうでは
        ひじょうに　にんきが　たかい。
      ja: |-
        チョボマキの　殻を　奪って
        完全武装。　ガラル地方では
        非常に　人気が　高い。
      ko: |-
        쪼마리의 껍질을 빼앗아 완전히
        무장했다. 가라르지방에서는
        매우 인기가 높다.
      zh-Hant: |-
        搶走小嘴蝸的殼，將自己
        全副武裝。在伽勒爾地區，
        騎士蝸牛非常受到人們喜愛。
      zh-Hans: |-
        抢走小嘴蜗的壳，将自己
        全副武装。在伽勒尔地区，
        骑士蜗牛非常受到人们喜爱。
      en: |-
        They use shells they’ve stolen from Shelmet
        to arm and protect themselves. They’re very
        popular Pokémon in the Galar region.
      fr: |-
        Il a volé la coquille d’Escargaume pour obtenir
        une armure parfaite. Il jouit d’une très grande
        popularité à Galar.
      de: |-
        In der Galar-Region ist es besonders beliebt.
        Es stiehlt die Muschel eines Schnuthelms und
        vollendet damit seine Ganzkörperrüstung.
      es: |-
        Le roba el caparazón a un Shelmet y lo usa como
        armadura. Este Pokémon es extremadamente
        popular en la región de Galar.
      it: |-
        Si appropria della conchiglia di Shelmet e la usa
        per proteggere tutto il suo corpo. È amatissimo
        dagli abitanti di Galar.
    shield:
      ja-Hrkt: |-
        やりを　かまえ　てきへ　とつげき。
        ネギガナイトとの　けっとうを
        えがいた　かいがが　ゆうめい。
      ja: |-
        槍を　構え　敵へ　突撃。
        ネギガナイトとの　決闘を
        描いた　絵画が　有名。
      ko: |-
        창을 겨누고 적에게 돌격한다.
        창파나이트와의 결투를
        그린 그림이 유명하다.
      zh-Hant: |-
        會舉起長矛突擊敵人。
        有一幅名畫描繪著
        牠和蔥遊兵決鬥的場景。
      zh-Hans: |-
        会举起长矛突击敌人。
        有一幅名画描绘着
        它和葱游兵决斗的场景。
      en: |-
        It charges its enemies, lances at the ready.
        An image of one of its duels is captured in a famous
        painting of Escavalier clashing with Sirfetch’d.
      fr: |-
        Il charge ses ennemis en brandissant ses lances.
        Il existe un célèbre tableau représentant la joute
        entre un Lançargot et un Palarticho.
      de: |-
        Es greift Gegner mit seinen Lanzen an. Auf einem
        berühmten Gemälde ist ein Duell zwischen ihm
        und Lauchzelot zu sehen.
      es: |-
        Ataca a los enemigos con sus lanzas. Aparece
        representado en pleno duelo contra un Sirfetch’d
        en un famoso cuadro.
      it: |-
        Carica il nemico con le sue lance.
        Un famoso dipinto lo ritrae durante
        un duello con Sirfetch’d.
