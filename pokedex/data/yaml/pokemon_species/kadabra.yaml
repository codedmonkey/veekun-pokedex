kadabra:
  base_happiness: 50
  capture_rate: 100
  color: brown
  egg_groups:
    - humanshape
  evolution_chain: abra
  evolves_from: abra
  flavor_text:
    red:
      en: |-
        It emits special
        alpha waves from
        its body thatinduce headaches
        just by being
        close by.
    blue:
      en: |-
        It emits special
        alpha waves from
        its body thatinduce headaches
        just by being
        close by.
    yellow:
      en: |-
        Many odd things
        happen if this
        POKéMON is closeby. For example,
        it makes clocks
        run backwards.
    gold:
      en: |-
        It possesses
        strong spiritual
        power. The moredanger it faces,
        the stronger its
        psychic power.
    silver:
      en: |-
        If it uses its
        abilities, it
        emits specialalpha waves that
        cause machines to
        malfunction.
    crystal:
      en: |-
        When it closes its
        eyes, twice as
        many alpha parti­cles come out of
        the surface of its
        body.
    ruby:
      en: |-
        KADABRA emits a peculiar alpha wave
        if it develops a headache. Only those
        people with a particularly strongpsyche can hope to become a TRAINER
        of this POKéMON.
    sapphire:
      en: |-
        KADABRA holds a silver spoon in its
        hand. The spoon is used to amplify the
        alpha waves in its brain.Without the spoon, the POKéMON is said
        to be limited to half the usual amount
        of its telekinetic powers.
    emerald:
      en: |-
        It is rumored that a boy with psychic
        abilities suddenly transformed into
        KADABRA while he was assisting research
        into extrasensory powers.
    firered:
      en: |-
        It happened one morning - a boy with
        extrasensory powers awoke in bed
        transformed into KADABRA.
    leafgreen:
      en: |-
        It emits special alpha waves from its
        body that induce headaches just by being
        close.
    diamond:
      en: |-
        If one is nearby, an eerie shadow
        appears on TV screens. Seeing the
        shadow is said to bring bad luck.
    pearl:
      en: |-
        When it uses its psychic power, it
        emits strong ha waves that can
        ruin precision devices.
    platinum:
      en: |-
        It stares at its silver spoon to
        focus its mind. It emits more alpha
        waves while doing so.
    heartgold:
      en: |-
        It possesses strong spiritual power.
        The more danger it faces,
        the stronger its psychic power.
    soulsilver:
      en: |-
        If it uses its abilities, it
        emits special alpha waves that
        cause machines to malfunction.
    black:
      en: |-
        It stares at its silver spoon to
        focus its mind. It emits more alpha
        waves while doing so.
      fr: |-
        Il fixe sa cuillère d’argent afin de
        concentrer son esprit et d’émettre
        un maximum d’ondes alpha.
    white:
      en: |-
        It stares at its silver spoon to
        focus its mind. It emits more alpha
        waves while doing so.
      fr: |-
        Il fixe sa cuillère d’argent afin de
        concentrer son esprit et d’émettre
        un maximum d’ondes alpha.
    black-2:
      en: |-
        It stares at its silver spoon to
        focus its mind. It emits more alpha
        waves while doing so.
    white-2:
      en: |-
        It stares at its silver spoon to
        focus its mind. It emits more alpha
        waves while doing so.
    x:
      ja-Hrkt: |-
        ちょうのうりょくを　はっきすると
        つよい　アルファはを　だして
        せいみつきかいを　こわしてしまう。
      ja: |-
        超能力を　発揮すると
        強い　アルファ波を　出して
        精密機械を　壊してしまう。
      ko: |-
        초능력을 발휘하면
        강한 알파파를 내어
        정밀 기계를 고장 내 버린다.
      en: |-
        When it uses its psychic power, it emits strong
        alpha waves that can ruin precision devices.
      fr: |-
        Son pouvoir psychique émet des ondes alpha qui
        brouillent les appareils électroniques.
      de: |-
        Setzt es seine Psycho-Kräfte ein, sondert es
        Alphawellen ab, die Präzisionsgeräten schaden
        können.
      es: |-
        Cuando utiliza su poder psíquico, emite poderosas
        ondas alfa que pueden destruir dispositivos.
      it: |-
        Quando usa i poteri psichici, emette forti onde alfa
        che possono rovinare strumenti di precisione.
    'y':
      ja-Hrkt: |-
        のうりょくを　つかうたびに
        からだから　とくしゅな　アルファはを
        だして　きかいをくるわせる。
      ja: |-
        能力を　使うたびに
        体から　特殊な　アルファ波を
        出して　機械を　狂わせる。
      ko: |-
        능력을 사용할 때마다
        몸에서 특수한 알파파를
        발산하여 기계를 교란시킨다.
      en: |-
        If it uses its abilities, it emits special alpha waves
        that cause machines to malfunction.
      fr: |-
        En utilisant ses pouvoirs, il émet des ondes alpha et
        cause des distorsions électroniques.
      de: |-
        Setzt es seine Kräfte ein, sendet es Alphawellen aus,
        die einen Defekt bei Maschinen erzeugen können.
      es: |-
        Si usa sus habilidades, emite ondas alfa especiales
        que hacen que las máquinas fallen.
      it: |-
        Usando le sue abilità emette speciali onde alfa che
        causano malfunzionamenti nei macchinari.
    omega-ruby:
      ja-Hrkt: |-
        ずつうを　おこす　とくしゅな　アルファはを
        だすので　つよい　せいしんりょくの　もちぬしじゃ
        ないと　ユンゲラーの　トレーナーには　なれない。
      ja: |-
        頭痛を　起こす　特殊な　アルファ波を
        出すので　強い　精神力の　持ち主じゃ
        ないと　ユンゲラーの　トレーナーには　なれない。
      ko: |-
        두통을 유발하는 특수한 알파파를
        발산하기 때문에 강한 정신력의 소유자가
        아니면 윤겔라의 트레이너가 될 수 없다.
      en: |-
        Kadabra emits a peculiar alpha wave if it develops a headache.
        Only those people with a particularly strong psyche can hope
        to become a Trainer of this Pokémon.
      fr: |-
        Kadabra émet une onde alpha si particulière qu’elle vous
        donne mal à la tête. Seuls les gens avec un psychisme
        puissant peuvent espérer devenir Dresseur de ce Pokémon.
      de: |-
        Kadabra sendet Alphawellen aus, wenn es Kopfschmerzen hat.
        Nur wer eine besonders starke Psyche hat, kann dieses
        Pokémon unter seine Fittiche nehmen.
      es: |-
        Kadabra emite unas ondas alfa muy particulares que provocan
        dolores de cabeza a los demás. Solo aquellos que tengan gran
        poder mental podrán optar a ser Entrenador de este Pokémon.
      it: |-
        Kadabra emette particolari onde alfa che causano mal di
        testa a chi si trova nelle vicinanze. Soltanto chi ha una
        psiche molto stabile può sperare di diventare Allenatore
        di questo Pokémon.
    alpha-sapphire:
      ja-Hrkt: |-
        ぎんの　スプーンは　アルファはを　たかめる。
        スプーンが　ないと　いつもの　はんぶんしか
        ちょうのうりょくを　つかえなくなると　いう。
      ja: |-
        銀の　スプーンは　アルファ波を　高める。
        スプーンが　ないと　いつもの　半分しか
        超能力を　使えなくなると　いう。
      ko: |-
        은 숟가락은 알파파를 높여준다.
        숟가락이 없으면 평상시의 반밖에
        초능력을 사용할 수 없게 된다고 한다.
      en: |-
        Kadabra holds a silver spoon in its hand. The spoon is used
        to amplify the alpha waves in its brain. Without the spoon, the
        Pokémon is said to be limited to half the usual amount of its
        telekinetic powers.
      fr: |-
        Kadabra tient une cuiller en argent dans la main. Elle est
        utilisée pour amplifier les ondes alpha de son cerveau.
        Sans elle, on raconte que ce Pokémon ne peut utiliser que
        la moitié de ses pouvoirs télékinétiques.
      de: |-
        Kadabra hält einen silbernen Löffel in der Hand.
        Es verstärkt damit die Alphawellen in seinem Gehirn.
        Ohne den Löffel könnte dieses Pokémon nur die Hälfte
        seiner telekinetischen Kräfte nutzen.
      es: |-
        Kadabra lleva siempre una cuchara de plata en la mano, que
        usa para amplificar las ondas alfa de su cerebro. Dicen que, sin
        la cuchara, sus poderes de telequinesia se reducen a la mitad.
      it: |-
        Kadabra tiene in mano un cucchiaio d’argento per amplificare
        le onde alfa nel suo cervello. Si dice che senza cucchiaio
        i suoi abituali poteri telecinetici siano dimezzati.
    sun:
      ja-Hrkt: |-
        エスパーしょうねんが　じぶんの　なかの
        サイコパワーを　おさえきれなくなり
        へんしんして　しまったとの　せつも。
      ja: |-
        エスパー少年が　自分の　中の
        サイコパワーを　抑えきれなくなり
        変身して　しまったとの　説も。
      ko: |-
        에스퍼 소년이 자신 안의
        사이코 파워를 억누르지 못하고
        변신했다는 설도 있다.
      zh-Hant: |-
        也有說法是說，牠是
        超能力少年因無法抑制自己
        體內的精神力量而變身成的。
      zh-Hans: |-
        也有说是超能力少年
        无法抑制自己体内的
        精神力量，变身而成。
      en: |-
        A theory exists that this Pokémon was a young
        boy who couldn’t control his psychic powers
        and ended up transformed into this Pokémon.
      fr: |-
        Certains pensent que lorsqu’un enfant humain
        télépathe perd le contrôle de ses pouvoirs
        psychiques, il devient un Kadabra.
      de: |-
        Es heißt, dass es früher ein Junge mit Psikräften
        war, der sich zu Kadabra verwandelte, weil er
        seine Fähigkeiten nicht kontrollieren konnte.
      es: |-
        Algunos creen que Kadabra no es más que un
        joven que perdió el control de sus poderes
        psíquicos y que acabó transformándose.
      it: |-
        Secondo una teoria, in realtà è un ragazzo che
        non è riuscito a controllare i suoi poteri psichici,
        trasformandosi in Pokémon.
    moon:
      ja-Hrkt: |-
        ユンゲラーが　いるとき　テレビなど
        きかいの　モニターに　ふこうを　よぶ
        ぶきみな　かげが　とおりすぎる。
      ja: |-
        ユンゲラーが　いるとき　テレビなど
        機械の　モニターに　不幸を　呼ぶ
        不気味な　影が　通り過ぎる。
      ko: |-
        윤겔라가 있을 때 TV 등
        기계 모니터에 불행을 부르는
        으스스한 그림자가 스쳐 간다.
      zh-Hant: |-
        勇基拉在的時候，
        電視機等機械的螢幕中會有
        喚來不幸的可怕影像閃現。
      zh-Hans: |-
        勇基拉在的时候，
        电视机等机械的显示器中会有
        召唤不幸的可怕影像闪现。
      en: |-
        Kadabra’s presence infests televisions and
        monitors with creepy shadows that bring
        bad luck.
      fr: |-
        Lorsqu’un Kadabra se trouve à proximité d’un
        écran, une télé par exemple, une ombre sinistre
        dont la vision porte malheur traverse l’image.
      de: |-
        Hält sich Kadabra in der Nähe von Geräten mit
        Bildschirmen wie Fernsehern auf, huscht ein
        Unglück bringender Schatten über den Screen.
      es: |-
        Cuando Kadabra está cerca de la pantalla de
        algún dispositivo, en esta aparece una sombra
        ominosa que se dice que solo trae desdicha.
      it: |-
        In sua presenza, sugli schermi di televisori o
        dispositivi simili appare un’ombra inquietante
        che porta sfortuna a chi la guarda.
    ultra-sun:
      ja-Hrkt: |-
        ぎんの　スプーンを　じっと　みつめ
        サイコパワーを　ぞうふくし　はなつ。
        きんの　スプーンでは　ダメらしい。
      ja: |-
        銀の　スプーンを　じっと　見つめ
        サイコパワーを　増幅し　放つ。
        金の　スプーンでは　ダメらしい。
      ko: |-
        은 숟가락을 가만히 주시하고
        사이코 파워를 증폭하여 발산한다.
        금 숟가락으로는 안 되는 듯하다.
      zh-Hant: |-
        會盯著銀湯匙瞧，
        來增強並釋放精神力量。
        換成金湯匙似乎就沒用了。
      zh-Hans: |-
        会盯着银汤匙来增强
        并放出精神力量。
        用金汤匙好像就不行。
      en: |-
        It stares at a silver spoon to amplify its psychic
        powers before it lets loose. Apparently, gold
        spoons are no good.
      fr: |-
        Il fixe sa cuiller d’argent pour concentrer son
        énergie psychique avant de la libérer, mais
        il ne peut rien faire avec une cuiller en or.
      de: |-
        Es verstärkt seine Psycho-Kräfte, indem es auf
        seinen Silberlöffel starrt. Mit einem goldenen
        Löffel funktioniert es anscheinend nicht.
      es: |-
        Es capaz de doblar una cuchara de plata fijando
        la mirada y usando sus poderes psíquicos, pero
        no puede hacer lo propio con una de oro.
      it: |-
        Prima di usare i suoi poteri psichici, li amplifica
        fissando un cucchiaio d’argento. Sembra che
        non riesca a fare lo stesso con i cucchiai d’oro.
    ultra-moon:
      ja-Hrkt: |-
        つよい　せいしんりょくを　もつが
        ぎんの　スプーンを　もっていないと
        サイコパワーが　はんげんしてしまう。
      ja: |-
        強い　精神力を　持つが
        銀の　スプーンを　持っていないと
        サイコパワーが　半減してしまう。
      ko: |-
        강한 정신력을 가졌지만
        은 숟가락이 없으면
        사이코 파워가 반감되어 버린다.
      zh-Hant: |-
        擁有強大的精神力。
        但如果沒有拿著銀湯匙，
        精神力量就會減半。
      zh-Hans: |-
        虽然有着强大的精神力，
        但如果没有拿着银汤匙，
        精神力量就会减半。
      en: |-
        It possesses strong mental capabilities, but its
        psychic powers are halved when it’s not
        holding a silver spoon.
      fr: |-
        Son esprit est doté d’impressionnantes
        facultés, mais elles sont diminuées de moitié
        s’il n’a pas de cuiller d’argent.
      de: |-
        Es verfügt über starke Psycho-Kräfte, doch
        ohne seinen Silberlöffel reduzieren sich diese
        um die Hälfte.
      es: |-
        Sus impresionantes poderes mentales se ven
        reducidos a la mitad cuando no lleva consigo
        su cuchara de plata.
      it: |-
        Ha una grande forza mentale, ma la potenza dei
        suoi poteri è dimezzata se non ha con sé il suo
        cucchiaio d’argento.
    lets-go-pikachu:
      ja-Hrkt: |-
        ユンゲラーが　ちかくに　いると
        とけいが　ぎゃくかいてん　したり
        おかしなことが　おこるらしい。
      ja: |-
        ユンゲラーが　近くに　いると
        時計が　逆回転　したり
        おかしなことが　起こるらしい。
      ko: |-
        윤겔라가 근처에 있으면
        시계가 거꾸로 도는 등
        이상한 일들이 일어나는 듯하다.
      zh-Hant: |-
        當勇基拉來到附近時，
        似乎會發生時鐘倒著轉
        之類的奇怪現象。
      zh-Hans: |-
        当勇基拉在附近时，
        似乎会发生像是
        时钟倒转这样的怪事。
      en: |-
        Many odd things happen if this Pokémon is
        close by. For example, it makes clocks
        run backward.
      fr: |-
        Sa présence cause des évènements étranges,
        comme des horloges tournant à l’envers.
      de: |-
        Viele seltsame Dinge passieren, wenn ein
        Kadabra in der Nähe ist. Uhren laufen zum
        Beispiel rückwärts.
      es: |-
        Hace que sucedan cosas extrañas cuando está
        cerca, como que los relojes vayan al revés.
      it: |-
        Quando è vicino succedono molte cose strane.
        Per esempio, gli orologi girano al contrario.
    lets-go-eevee:
      ja-Hrkt: |-
        ユンゲラーが　ちかくに　いると
        とけいが　ぎゃくかいてん　したり
        おかしなことが　おこるらしい。
      ja: |-
        ユンゲラーが　近くに　いると
        時計が　逆回転　したり
        おかしなことが　起こるらしい。
      ko: |-
        윤겔라가 근처에 있으면
        시계가 거꾸로 도는 등
        이상한 일들이 일어나는 듯하다.
      zh-Hant: |-
        當勇基拉來到附近時，
        似乎會發生時鐘倒著轉
        之類的奇怪現象。
      zh-Hans: |-
        当勇基拉在附近时，
        似乎会发生像是
        时钟倒转这样的怪事。
      en: |-
        Many odd things happen if this Pokémon is
        close by. For example, it makes clocks
        run backward.
      fr: |-
        Sa présence cause des évènements étranges,
        comme des horloges tournant à l’envers.
      de: |-
        Viele seltsame Dinge passieren, wenn ein
        Kadabra in der Nähe ist. Uhren laufen zum
        Beispiel rückwärts.
      es: |-
        Hace que sucedan cosas extrañas cuando está
        cerca, como que los relojes vayan al revés.
      it: |-
        Quando è vicino succedono molte cose strane.
        Per esempio, gli orologi girano al contrario.
    sword:
      ja-Hrkt: |-
        サイコパワーで　ちゅうに　ういたまま
        ねむる。　だんりょくに　すぐれた
        しっぽを　まくらがわりに　するぞ。
      ja: |-
        サイコパワーで　宙に　浮いたまま
        眠る。　弾力に　優れた　しっぽを
        枕がわりに　するぞ。
      ko: |-
        사이코 파워로 공중에 떠서 잠든다.
        탄력이 뛰어난 꼬리를
        베개 대신으로 사용한다.
      zh-Hant: |-
        會用精神力量浮在空中睡覺。
        牠還會把彈力十足的尾巴
        當成枕頭用喔。
      zh-Hans: |-
        用精神力量浮在空中睡觉。
        会把弹力十足的
        尾巴当成枕头来用。
      en: |-
        Using its psychic power, Kadabra levitates as it
        sleeps. It uses its springy tail as a pillow.
      fr: |-
        Ses pouvoirs psychiques lui permettent de léviter
        en dormant. Il utilise alors sa queue très souple
        comme un oreiller.
      de: |-
        Kadabras Psycho-Kräfte ermöglichen es ihm,
        schwebend zu schlafen. Seinen äußerst
        elastischen Schweif nutzt es dabei als Kissen.
      es: |-
        Duerme suspendido en el aire gracias a sus
        poderes psíquicos. La cola, de una flexibilidad
        extraordinaria, hace las veces de almohada.
      it: |-
        I suoi poteri psichici gli permettono di levitare
        mentre dorme. Come cuscino usa la sua coda
        straordinariamente elastica.
    shield:
      ja-Hrkt: |-
        ねんりきの　いりょくは　ぜつだい。
        しんかに　そなえて　ひたいの　ほしに
        サイコパワーを　たくわえている。
      ja: |-
        念力の　威力は　絶大。
        進化に　備えて　額の　星に
        サイコパワーを　蓄えている。
      ko: |-
        염동력의 위력은 절대적이다.
        진화에 대비하여 이마에 있는 별에
        사이코 파워를 비축하고 있다.
      zh-Hant: |-
        念力的威力大得驚人。
        會把精神力量儲存在額頭
        的星星裡，以備進化所需。
      zh-Hans: |-
        念力的威力大得惊人。
        会把精神力量储存在额头的
        星星里，以备进化之需。
      en: |-
        This Pokémon’s telekinesis is immensely powerful.
        To prepare for evolution, Kadabra stores up
        psychic energy in the star on its forehead.
      fr: |-
        Incroyablement doué en télékinésie, il concentre
        son énergie psychique dans l’étoile sur son front
        en prévision de son évolution.
      de: |-
        Kadabra verfügt über enorme psychokinetische
        Macht. Als Vorbereitung für seine Entwicklung
        speichert es im Stern auf der Stirn Psycho-Kräfte.
      es: |-
        La potencia de su telequinesis es inmensa.
        Acumula poder psíquico en la estrella de la
        frente como preparativo de cara a su evolución.
      it: |-
        La potenza della sua psicocinesi è immensa.
        Immagazzina i suoi poteri psichici nella stella
        sulla fronte, preparandosi all’evoluzione.
    legends-arceus:
      en: |-
        There are rumors that a child with mystical powers became
        a Kadabra; however, this remains unverified. I suspect that
