  flavor_text:
    diamond:
      en: |-
        It protects itself by spraying a
        noxious fluid from its rear. The
        stench lingers for 24 hours.
    pearl:
      en: |-
        It sprays a nose-curling,
        stinky fluid from its rear to
        repel attackers.
    platinum:
      en: |-
        It sprays a foul fluid from its
        rear. Its stench spreads over a
        mile radius, driving Pokémon away.
    heartgold:
      en: |-
        The foul fluid from its rear is so
        revolting that it can make people feel
        queasy up to a mile and a quarter away.
    soulsilver:
      en: |-
        The foul fluid from its rear is so
        revolting that it can make people feel
        queasy up to a mile and a quarter away.
    black:
      en: |-
        It sprays a foul fluid from its
        rear. Its stench spreads over a
        mile radius, driving Pokémon away.
      fr: |-
        Son derrière propulse un fluide
        nauséabond qui peut faire fuir les
        Pokémon dans un rayon de 2 km.
    white:
      en: |-
        It sprays a foul fluid from its
        rear. Its stench spreads over a
        mile radius, driving Pokémon away.
      fr: |-
        Son derrière propulse un fluide
        nauséabond qui peut faire fuir les
        Pokémon dans un rayon de 2 km.
    black-2:
      en: |-
        It sprays a foul fluid from its
        rear. Its stench spreads over a
        mile radius, driving Pokémon away.
    white-2:
      en: |-
        It sprays a foul fluid from its
        rear. Its stench spreads over a
        mile radius, driving Pokémon away.
    x:
      ja-Hrkt: |-
        おしりからとばす　くさい　しるの
        においは　はんけい２キロに　ひろがり
        まわりの　ポケモンは　いなくなる。
      ja: |-
        お尻から飛ばす　くさい　汁の
        においは　半径２キロに　広がり
        まわりの　ポケモンは　いなくなる。
      ko: |-
        엉덩이에서 뿜어지는 역한 분비액의
        냄새는 범위 2km까지 멀리 퍼져
        주변의 포켓몬이 자리를 뜨게 한다.
      en: |-
        It sprays a foul fluid from its rear. Its stench
        spreads over a mile radius, driving Pokémon away.
      fr: |-
        Son derrière propulse un fluide nauséabond qui peut
        faire fuir les Pokémon dans un rayon de 2 km.
      de: |-
        Versprüht eine Substanz aus seinem Hinterleib,
        die in einem großen Radius andere Pokémon fernhält.
      es: |-
        Expulsa un fluido maloliente por sus cuartos traseros.
        El hedor repele Pokémon en un radio de 2 km.
      it: |-
        Emette un fluido puzzolente dal posteriore. Il tanfo
        si sparge per 2 km e tiene lontani i Pokémon.
    'y':
      ja-Hrkt: |-
        おしりから　きょうれつに　くさい
        えきたいを　とばして　みを　まもる。
        においは　２４じかん　きえない。
      ja: |-
        お尻から　強烈に　くさい　液体を
        飛ばして　身を　守る。
        においは　２４時間　消えない。
      ko: |-
        엉덩이에서 강렬한 구린내의
        액체를 날려서 몸을 지킨다.
        냄새가 24시간 사라지지 않는다.
      en: |-
        It protects itself by spraying a noxious fluid from its
        rear. The stench lingers for 24 hours.
      fr: |-
        Il se protège en expulsant un fluide nocif par son
        derrière. La puanteur dure 24 heures.
      de: |-
        Um sich zu schützen, versprüht es eine Substanz
        aus seinem Hinterleib, die 24 Stunden stinkt.
      es: |-
        Se protege expulsando un fluido nocivo por su parte
        trasera. El hedor dura 24 horas.
      it: |-
        Si protegge spruzzando un fluido puzzolente dal
        posteriore. Il tanfo permane per 24 ore.
    omega-ruby:
      ja-Hrkt: |-
        おしりからとばす　くさい　しるの
        においは　はんけい２キロに　ひろがり
        まわりの　ポケモンは　いなくなる。
      ja: |-
        お尻から飛ばす　くさい　汁の
        においは　半径２キロに　広がり
        まわりの　ポケモンは　いなくなる。
      ko: |-
        엉덩이에서 뿜어지는 역한 분비액의
        냄새는 반경 2km까지 멀리 퍼져
        주변의 포켓몬이 자리를 뜨게 한다.
      en: |-
        It sprays a foul fluid from its rear. Its stench
        spreads over a mile radius, driving Pokémon away.
      fr: |-
        Son derrière propulse un fluide nauséabond qui peut faire fuir
        les Pokémon dans un rayon de 2 km.
      de: |-
        Versprüht eine Substanz aus seinem Hinterleib, die in einem
        großen Radius andere Pokémon fernhält.
      es: |-
        Expulsa un fluido maloliente por sus cuartos traseros. El hedor
        repele Pokémon en un radio de 2 km.
      it: |-
        Emette un fluido puzzolente dal posteriore. Il tanfo si sparge
        per 2 km e tiene lontani i Pokémon.
    alpha-sapphire:
      ja-Hrkt: |-
        おしりから　きょうれつに　くさい
        えきたいを　とばして　みを　まもる。
        においは　２４じかん　きえない。
      ja: |-
        お尻から　強烈に　くさい　液体を
        飛ばして　身を　守る。
        においは　２４時間　消えない。
      ko: |-
        엉덩이에서 강렬한 구린내의
        액체를 날려서 몸을 지킨다.
        냄새가 24시간 사라지지 않는다.
      en: |-
        It protects itself by spraying a noxious fluid from its
        rear. The stench lingers for 24 hours.
      fr: |-
        Il se protège en expulsant un fluide nocif par son derrière.
        La puanteur dure 24 heures.
      de: |-
        Um sich zu schützen, versprüht es eine Substanz aus seinem
        Hinterleib, die 24 Stunden stinkt.
      es: |-
        Se protege expulsando un fluido nocivo por su parte trasera.
        El hedor dura 24 horas.
      it: |-
        Si protegge spruzzando un fluido puzzolente dal posteriore.
        Il tanfo permane per 24 ore.
    sword:
      ja-Hrkt: |-
        おしりから　あいての　かお　めがけて
        ものすごく　くさい　しるを　とばす。
        しるは　５メートルさきまで　とどく。
      ja: |-
        おしりから　相手の　顔を　めがけて
        ものすごく　臭い　汁を　飛ばす。
        汁は　５メートル先まで　とどく。
      ko: |-
        엉덩이를 상대의 얼굴에 겨냥해서
        엄청나게 역한 분비액을 뿜는다.
        분비액은 5m 떨어진 곳까지 닿는다.
      zh-Hant: |-
        瞄準對手的臉，從屁股
        噴出奇臭無比的液體。
        液體能噴到５公尺外。
      zh-Hans: |-
        瞄准对手的脸，从屁股
        喷出奇臭无比的液体。
        液体能喷到５米开外。
      en: |-
        From its rear, it sprays a foul-smelling liquid at
        opponents. It aims for their faces, and it can hit
        them from over 16 feet away.
      fr: |-
        Il propulse un liquide extrêmement nauséabond
        au visage de son adversaire depuis son derrière.
        Il peut atteindre une cible à cinq mètres.
      de: |-
        Aus seinem Hinterleib sprüht es Gegnern eine
        fürchterlich stinkende Flüssigkeit ins Gesicht.
        Dabei hat es eine Reichweite von bis zu 5 m.
      es: |-
        Expulsa un líquido de olor nauseabundo por sus
        cuartos traseros con el que puede acertar a su
        enemigo en el rostro a 5 m de distancia.
      it: |-
        Spruzza un fluido puzzolente dal posteriore
        mirando al muso dell’avversario. Lo spruzzo
        può arrivare fino 5 m di distanza.
    shield:
      ja-Hrkt: |-
        しっぽを　あげて　おしりを　むけたら
        ようちゅうい。　きぜつ　するほど
        くさい　しるを　とばす　まえぶれ。
      ja: |-
        尻尾を　あげて　お尻を　向けたら
        要注意。　気絶　するほど
        臭い　汁を　飛ばす　前触れ。
      ko: |-
        꼬리를 들고 엉덩이를 돌리면
        주의해야 한다. 기절할 정도로
        악취 나는 분비액을 날릴 전조인 것이다.
      zh-Hant: |-
        要是牠翹起尾巴把屁股對準了你，
        請一定要小心。因為這表示牠將要
        噴出足以讓人窒息的臭液。
      zh-Hans: |-
        要是它翘起尾巴把屁股对准了你，
        请一定要小心。因为这表示它将要
        喷出足以让人窒息的臭液。
      en: |-
        If it lifts its tail and points its rear at you, beware.
        It’s about to spray you with a fluid stinky enough
        to make you faint.
      fr: |-
        S’il lève la queue, c’est qu’il s’apprête à projeter
        un liquide tellement nauséabond qu’il peut faire
        perdre connaissance.
      de: |-
        Dreht es einem den Hinterleib zu und hebt seinen
        Schweif, versprüht es kurz darauf eine Flüssigkeit,
        die so sehr stinkt, dass sie einem die Sinne raubt.
      es: |-
        Si levanta la cola y apunta los cuartos traseros,
        es señal de que se dispone a expulsar un líquido
        cuyo hedor llega a provocar desmayos.
      it: |-
        Se mostra il posteriore alzando la coda, bisogna
        fare attenzione: sta per spruzzare un fluido così
        maleodorante da far perdere i sensi.
