sizzlipede:
  base_happiness: 50
  capture_rate: 190
  color: red
  egg_groups:
    - bug
  evolution_chain: sizzlipede
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        からだに　ためた　かねんガスで
        はつねつ。　とくに　おなかの
        きいろい　ぶぶんが　あついのだ。
      ja: |-
        体に　溜めた　可燃ガスで
        発熱。　とくに　お腹の
        黄色い　部分が　熱いのだ。
      ko: |-
        몸속에 모아둔 가연성 가스로
        열을 낸다. 특히 배 쪽의
        노란 부분이 뜨겁다.
      zh-Hant: |-
        靠儲存在體內的可燃氣體
        來發熱。熱度最高的是
        腹部的黃色部分。
      zh-Hans: |-
        靠储存在体内的可燃气体
        来发热。热度最高的是
        腹部的黄色部分。
      en: |-
        It stores flammable gas in its body and uses it to
        generate heat. The yellow sections on its belly
        get particularly hot.
      fr: |-
        Il produit de la chaleur grâce au gaz inflammable
        qu’il emmagasine dans son corps. La partie jaune
        de son abdomen est particulièrement brûlante.
      de: |-
        Mit dem entzündlichen Gas in seinem Körper
        erzeugt es Hitze. Die gelben Stellen an seinem
        Bauch werden besonders heiß.
      es: |-
        Genera calor consumiendo el gas inflamable que
        almacena en su cuerpo. Los círculos amarillos del
        abdomen están particularmente calientes.
      it: |-
        Genera calore grazie ai gas combustibili
        accumulati nel suo corpo. Le parti gialle
        del suo addome sono particolarmente calde.
    shield:
      ja-Hrkt: |-
        はつねつした　からだで　えものを
        しめあげる。　こんがり　やけたら
        むしゃむしゃ　いただくのだ。
      ja: |-
        発熱した　体で　獲物を
        締め上げる。　こんがり　焼けたら
        むしゃむしゃ　いただくのだ。
      ko: |-
        발열된 몸으로 먹이를
        세게 조른다. 알맞게 구워지면
        우적우적 먹어버린다.
      zh-Hant: |-
        會用滾燙的身體勒緊獵物，
        等到烤得恰到好處之時，
        就把牠們大口大口地吃掉。
      zh-Hans: |-
        会用滚烫的身体勒紧猎物，
        等到烤得恰到好处之时，
        就把它们大口大口地吃掉。
      en: |-
        It wraps prey up with its heated body, cooking
        them in its coils. Once they’re well-done, it will
        voraciously nibble them down to the last morsel.
      fr: |-
        Il enserre fermement ses proies avec son corps
        brûlant et, quand elles sont bien grillées,
        il les dévore.
      de: |-
        Es nimmt Beute mit seinem aufgeheizten Körper
        in die Mangel. Sobald sie gut durchgebraten ist,
        frisst es sie genüsslich.
      es: |-
        Oprime a sus presas con su cuerpo candente.
        Una vez bien tostadas, las devora con fruición.
      it: |-
        Stritola le prede con il suo corpo ardente e,
        quando sono belle abbrustolite, le divora.
