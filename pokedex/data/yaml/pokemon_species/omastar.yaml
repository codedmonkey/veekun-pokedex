    sword:
      ja-Hrkt: |-
        おおきく　おもい　カラのせいで
        うごきが　にぶくなり　えものを
        とれずに　ぜつめつした　という。
      ja: |-
        大きく　重い　殻のせいで
        動きが　鈍くなり　獲物を　獲れずに
        絶滅した　という。
      ko: |-
        크고 무거운 껍질 때문에
        움직임이 둔해져서
        먹이를 잡지 못해 멸종했다고 한다.
      zh-Hant: |-
        據說是又大又重的殼導致
        牠的行動變得遲緩到無法
        捕捉獵物，因此才會滅絕的。
      zh-Hans: |-
        据说它是因为背上的壳又大又重，
        导致行动迟缓，无法捕捉到猎物，
        因此才会灭绝的。
      en: |-
        Weighed down by a large and heavy shell,
        Omastar couldn’t move very fast. Some say it
        went extinct because it was unable to catch food.
      fr: |-
        Il se serait éteint à cause de la taille et du poids
        importants de sa coquille, qui le ralentissait
        quand il chassait ses proies.
      de: |-
        Es starb wohl aus, weil seine Bewegungen durch
        das große, schwere Gehäuse so langsam wurden,
        dass es keine Beute mehr fangen konnte.
      es: |-
        Se cree que se extinguió porque el excesivo
        tamaño y peso de su concha le impedían
        moverse con rapidez para capturar presas.
      it: |-
        Si dice si sia estinto per via della conchiglia
        grossa e pesante che, rendendo i suoi movimenti
        impacciati, gli impediva di catturare le prede.
    shield:
      ja-Hrkt: |-
        するどいキバは　いわも　くだくが
        しょくしゅの　とどく　はんいの
        えものしか　おそえないのだ。
      ja: |-
        鋭いキバは　岩も　砕くが
        触手の　とどく　範囲の
        獲物しか　襲えないのだ。
      ko: |-
        날카로운 이빨은 바위도 부수지만
        촉수가 닿는 범위 안의
        먹이만 공격할 수 있다.
      zh-Hant: |-
        尖銳的牙齒足以咬碎岩石，
        但能夠襲擊的獵物僅限在
        牠的觸手可及的範圍之內。
      zh-Hans: |-
        拥有足以咬碎岩石的锋利牙齿，
        但是能够袭击的猎物仅限
        触手可以伸展的范围之内。
      en: |-
        Omastar’s sharp fangs could crush rock, but the
        Pokémon can attack only the prey that come
        within reach of its tentacles.
      fr: |-
        Ses crocs sont capables de broyer la roche,
        mais il ne peut s’attaquer qu’aux proies
        à portée de ses tentacules.
      de: |-
        Mit seinen scharfen Zähnen ist es imstande,
        selbst Felsen zu zermalmen. Angreifen kann es
        jedoch nur Beute in Reichweite seiner Tentakel.
      es: |-
        Posee unos colmillos afilados con los que puede
        partir piedras, pero solo ataca a presas que se
        hallan al alcance de sus tentáculos.
      it: |-
        Le sue zanne affilate possono frantumare
        anche le pietre, ma può attaccare solo le prede
        a portata di tentacolo.
