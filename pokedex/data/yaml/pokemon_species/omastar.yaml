    ultra-sun:
      ja-Hrkt: |-
        おもいカラが　げんいんで　ほろんだと
        かんがえられている　こだいポケモン。
        オクタンの　とおい　そせん　らしい。
      ja: |-
        重いカラが　原因で　滅んだと
        考えられている　古代ポケモン。
        オクタンの　遠い　祖先　らしい。
      ko: |-
        무거운 껍질 때문에 멸종했다고
        추정되는 고대 포켓몬.
        대포무노의 먼 선조인 듯하다.
      zh-Hant: |-
        被認為是因為身上沉重的殼
        而滅絕的古代寶可夢。
        似乎是章魚桶的遠祖。
      zh-Hans: |-
        被认为是由于身上沉重的壳
        而灭绝的古代宝可梦。
        好像是章鱼桶的远祖。
      en: |-
        Its heavy shell is thought to be the reason this
        ancient Pokémon died out. It’s apparently a
        distant ancestor of Octillery.
      fr: |-
        On suppose que ce Pokémon antique a disparu
        en raison de la lourdeur de sa coquille. Il est
        l’ancêtre présumé des Octillery.
      de: |-
        Diesem prähistorischen Pokémon wurde wohl
        das Gewicht seines Gehäuses zum Verhängnis.
        Es ist ein ferner Vorfahre von Octillery.
      es: |-
        Un posible antepasado remoto de Octillery
        cuya extinción se cree debida a que su concha
        se hizo demasiado pesada.
      it: |-
        Si ritiene che questo antico Pokémon si sia
        estinto a causa della conchiglia troppo pesante.
        Sembra sia un lontano antenato di Octillery.
    ultra-moon:
      ja-Hrkt: |-
        しょくしゅで　えものを　からめとり
        みうごきを　ふうじて　するどい
        キバで　とどめを　さすのだ。
      ja: |-
        触手で　獲物を　からめとり
        身動きを　封じて　鋭い
        キバで　止めを　刺すのだ。
      ko: |-
        촉수로 먹이를 휘감아
        움직임을 봉쇄한 뒤
        날카로운 이빨로 마무리한다.
      zh-Hant: |-
        會用觸手纏住獵物，
        封鎖對手的行動，然後用
        銳利的牙齒給予致命一擊。
      zh-Hans: |-
        用触手缠住猎物并让其
        无法动弹后，就会用锋利的
        牙齿使出致命一击。
      en: |-
        It wraps its prey in its tentacles to immobilize
        them and then finishes them off with its
        sharp fangs.
      fr: |-
        Il immobilise ses proies avec ses tentacules
        et leur inflige le coup de grâce à l’aide de
        ses crocs aiguisés.
      de: |-
        Mit seinen Tentakeln umklammerte es fest seine
        Beute, bevor es ihr mit seinen scharfen Zähnen
        den Garaus machte.
      es: |-
        Atrapa a sus presas con los tentáculos y, una
        vez inmovilizadas, las desgarra con sus afilados
        colmillos.
      it: |-
        Afferra e immobilizza le prede con i tentacoli,
        per poi infliggere il colpo di grazia con le sue
        zanne affilate.
    lets-go-pikachu:
      ja-Hrkt: |-
        するどい　キバを　もっていたが
        カラが　おおきすぎて　うまく
        うごけず　ぜつめつ　したらしい。
      ja: |-
        鋭い　キバを　持っていたが
        カラが　大きすぎて　うまく
        動けず　絶滅　したらしい。
      ko: |-
        날카로운 이빨을 가졌지만
        껍질이 너무 커서 제대로
        움직이지 못해 멸종한 듯하다.
      zh-Hant: |-
        擁有尖銳的牙齒，但似乎
        因為甲殼太大而不易移動，
        最後陷入了滅絕。
      zh-Hans: |-
        它拥有锋利的牙齿，但
        据说它由于外壳过大，
        不易移动而导致灭绝。
      en: |-
        Its sharp beak rings its mouth. Its shell was too
        big for it to move freely, so it became extinct.
      fr: |-
        Sa bouche est formée de crocs aiguisés.
        Il aurait disparu car sa coquille, trop grosse,
        l’empêchait de se déplacer facilement.
      de: |-
        Es verfügt über sehr scharfe Zähne. Offenbar
        starb es aus, weil seine Schale zu groß war und
        es sich daher nicht frei bewegen konnte.
      es: |-
        Poseía unos colmillos afilados, pero el excesivo
        tamaño de su concha le impedía moverse con
        libertad, lo que acabó provocando su extinción.
      it: |-
        È dotato di denti affilati. Sembra che si sia
        estinto a causa della conchiglia troppo grande,
        che lo ostacolava nei movimenti.
    lets-go-eevee:
      ja-Hrkt: |-
        するどい　キバを　もっていたが
