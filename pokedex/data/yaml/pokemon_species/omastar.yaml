    x:
      ja-Hrkt: |-
        しょくしゅが　てあしのように
        はったつしてる。しがみつくと
        どうじに　かみついてくる。
      ja: |-
        触手が　手足のように
        発達している。しがみつくと
        同時に　かみついてくる。
      ko: |-
        촉수가 팔다리처럼
        발달해 있다.
        달라붙자마자 문다.
      en: |-
        Its tentacles are highly developed as if they are
        hands and feet. As soon as it ensnares prey,
        it bites.
      fr: |-
        Ses tentacules sont développés comme s’il s’agissait
        de bras ou de jambes. Dès qu’il attrape une proie,
        il la mord.
      de: |-
        Seine Tentakel sind hoch entwickelt und es setzt
        sie ähnlich Händen und Füßen ein. Sobald es Beute
        ergriffen hat, beißt es zu.
      es: |-
        Tiene los tentáculos tan desarrollados que le sirven de
        manos y pies. Con ellos atrapa a su presa y le da un
        bocado.
      it: |-
        Ha tentacoli molto sviluppati, paragonabili ad arti
        umani. Appena irretisce la preda, la morde.
    'y':
      ja-Hrkt: |-
        いちど　まきついたら　ぜったいに
        はなれない。するどい　キバで
        えものを　ひきさくように　たべる。
      ja: |-
        一度　巻きついたら　絶対に
        離れない。鋭い　キバで
        獲物を　引き裂くように　食べる。
      ko: |-
        한번 휘감으면 절대
        놓지 않는다. 날카로운 이빨로
        먹이를 찢듯이 먹는다.
      en: |-
        Once wrapped around its prey, it never lets go.
        It eats the prey by tearing at it with sharp fangs.
      fr: |-
        Une fois enroulé autour de sa proie, il ne la laisse
        pas repartir et la dévore avec ses crocs.
      de: |-
        Hat es die Beute erst eingewickelt, lässt es nicht
        mehr los. Es verspeist sie, indem es sie zerreißt.
      es: |-
        Cuando agarra a su presa, nunca la deja escapar.
        Se la come despedazándola con sus colmillos.
      it: |-
        Dopo aver avvolto la preda non la molla più. La
        mangia facendola a brandelli con i denti affilati.
    omega-ruby:
      ja-Hrkt: |-
        しょくしゅを　あやつり　えものを　つかまえる。
        カラが　おおきく　なりすぎた　ことで　うごきが
        にぶくなり　ぜつめつしたと　かんがえられている。
      ja: |-
        触手を　操り　獲物を　捕まえる。
        カラが　大きく　なり過ぎた　ことで　動きが
        鈍くなり　絶滅したと　考えられている。
      ko: |-
        촉수를 이용하여 먹이를 잡는다.
        껍질이 너무 커진 탓에 움직임이
        둔해져서 멸종했다고 여겨지고 있다.
      en: |-
        Omastar uses its tentacles to capture its prey. It is believed to
        have become extinct because its shell grew too large and
        heavy, causing its movements to become too slow
        and ponderous.
      fr: |-
        Amonistar utilise ses tentacules pour capturer ses proies.
        On pense que l’espèce s’est éteinte parce que sa coquille
        était devenue trop grande et trop lourde, ce qui rendait
        ses mouvements lents et pesants.
      de: |-
        Amoroso benutzt seine Tentakel, um Beute einzufangen.
        Man nimmt an, dass es ausgestorben ist, weil seine Schale
        zu groß und zu schwer geworden war, sodass seine
        Bewegungen immer langsamer und schwerfälliger wurden.
      es: |-
        Omastar usa los tentáculos para atrapar a su presa. Se cree
        que el motivo de su extinción fue el tamaño y el peso
        que llegó a alcanzar la concha que lleva a cuestas, lo que le
        entorpeció y ralentizó los movimientos.
      it: |-
        Omastar usa i suoi tentacoli per catturare la preda.
        Si pensa che si sia estinto a causa della conchiglia ormai
        troppo pesante e ingombrante, che rendeva i suoi movimenti
        lenti e difficoltosi.
    alpha-sapphire:
      ja-Hrkt: |-
        しょくしゅを　あやつり　えものを　つかまえる。
        カラが　おおきく　なりすぎた　ことで　うごきが
