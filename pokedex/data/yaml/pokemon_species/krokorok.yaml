krokorok:
  base_happiness: 50
  capture_rate: 90
  color: brown
  egg_groups:
    - ground
  evolution_chain: sandile
  evolves_from: sandile
  flavor_text:
    black:
      en: |-
        They live in groups of a few individuals.
        Protective membranes shield their eyes
        from sandstorms.
      fr: |-
        Ils vivent en petits groupes.
        La membrane qui couvre leurs yeux
        les protège du soleil.
    white:
      en: |-
        The special membrane covering its eyes
        can sense the heat of objects, so it can
        see its surroundings even in darkness.
      fr: |-
        La membrane spéciale qui recouvre ses
        yeux détecte la chaleur et lui permet
        de voir dans le noir.
    black-2:
      en: |-
        Protected by thin membranes, their eyes
        can see even in the dead of night.
        They live in groups of a few individuals.
    white-2:
      en: |-
        Protected by thin membranes, their eyes
        can see even in the dead of night.
        They live in groups of a few individuals.
    x:
      ja-Hrkt: |-
        すうひきで　むれを　つくる。
        がんきゅうを　カバーする　まくが
        すなあらしから　めを　まもる。
      ja: |-
        数匹で　群れを　作る。
        眼球を　カバーする　膜が
        砂嵐から　目を　守る。
      ko: |-
        여러 마리가 무리를 짓는다.
        안구를 감싼 막이
        모래 폭풍으로부터 눈을 지켜준다.
      en: |-
        They live in groups of a few individuals. Protective
        membranes shield their eyes from sandstorms.
      fr: |-
        Ils vivent en petits groupes. La membrane qui couvre
        leurs yeux les protège du soleil.
      de: |-
        Bildet mit mehreren Artgenossen ein Rudel.
        Eine Membran schützt seine Augen vor Sandstürmen.
      es: |-
        Viven en manadas. La membrana que cubre sus ojos
        los protege de la arena.
      it: |-
        Forma gruppi di pochi esemplari. La pellicola che
        ricopre i suoi occhi lo protegge dalle tempeste di
        sabbia.
    'y':
      ja-Hrkt: |-
        めを　おおう　とくしゅな　まくが
        ぶったいの　ねつを　かんちするため
        くらやみでも　まわりが　みえるのだ。
      ja: |-
        眼球を　覆う　特殊な　膜が
        物体の　熱を　感知するため
        暗闇でも　まわりが　見えるのだ。
      ko: |-
        눈을 감싼 특수한 막이
        물체의 열을 감지해서
        어두워도 주변을 볼 수 있다.
      en: |-
        The special membrane covering its eyes can sense
        the heat of objects, so it can see its surroundings
        even in darkness.
      fr: |-
        La membrane spéciale qui recouvre ses yeux détecte
        la chaleur et lui permet de voir dans le noir.
      de: |-
        Die spezielle Membran um seine Augen fungiert als
        Wärmesensor, durch den es sich auch im Dunkeln
        zurechtfindet.
      es: |-
        Una membrana especial cubre sus ojos y le permite
        detectar el calor de los cuerpos, por eso ve en la
        oscuridad.
      it: |-
        La membrana speciale che ha sugli occhi è in grado
        di percepire il calore dei corpi, consentendogli così
        di vedere al buio.
    omega-ruby:
      ja-Hrkt: |-
        すうひきで　むれを　つくる。
        がんきゅうを　カバーする　まくが
        すなあらしから　めを　まもる。
      ja: |-
        数匹で　群れを　作る。
        眼球を　カバーする　膜が
        砂嵐から　目を　守る。
      ko: |-
        여러 마리가 무리를 짓는다.
        안구를 감싼 막이
        모래 폭풍으로부터 눈을 지켜준다.
      en: |-
        They live in groups of a few individuals. Protective
        membranes shield their eyes from sandstorms.
      fr: |-
        Ils vivent en petits groupes. La membrane qui couvre
        leurs yeux les protège du soleil.
      de: |-
        Bildet mit mehreren Artgenossen ein Rudel. Eine Membran
        schützt seine Augen vor Sandstürmen.
      es: |-
        Viven en manadas. La membrana que cubre sus ojos los
        protege de la arena.
      it: |-
        Forma gruppi di pochi esemplari. La pellicola che ricopre
        i suoi occhi lo protegge dalle tempeste di sabbia.
    alpha-sapphire:
      ja-Hrkt: |-
        めを　おおう　とくしゅな　まくが
        ぶったいの　ねつを　かんちするため
        くらやみでも　まわりが　みえるのだ。
      ja: |-
        眼球を　覆う　特殊な　膜が
        物体の　熱を　感知するため
        暗闇でも　まわりが　見えるのだ。
      ko: |-
        눈을 감싼 특수한 막이
        물체의 열을 감지해서
        어두워도 주변을 볼 수 있다.
      en: |-
        The special membrane covering its eyes can sense
        the heat of objects, so it can see its surroundings
        even in darkness.
      fr: |-
        La membrane spéciale qui recouvre ses yeux détecte
        la chaleur et lui permet de voir dans le noir.
      de: |-
        Die spezielle Membran um seine Augen fungiert als
        Wärmesensor, durch den es sich auch im Dunkeln
        zurechtfindet.
      es: |-
        Una membrana especial cubre sus ojos y le permite detectar
        el calor de los cuerpos, por eso ve en la oscuridad.
      it: |-
        La membrana speciale che ha sugli occhi è in grado di
        percepire il calore dei corpi, consentendogli così di vedere
        al buio.
    sun:
      ja-Hrkt: |-
        すうひきの　むれを　なして　こうどう。
        むれの　ちゅうしんは　♀の　ばあいが
        おおく　♂たちが　エサを　あつめる。
      ja: |-
        数匹の　群れを　成して　行動。
        群れの　中心は　♀の　場合が
        多く　♂たちが　餌を　集める。
      ko: |-
        몇 마리씩 무리를 지어 행동한다.
        무리의 중심은 암컷인 경우가
        많고 수컷들이 먹이를 모은다.
      zh-Hant: |-
        通常以數隻為單位成群行動。
        群體的中心大多都是♀，
        ♂們負責收集食物。
      zh-Hans: |-
        数只成群后行动。
        群体的中心大多都是♀，
        ♂们会收集食物。
      en: |-
        They move in groups of a few individuals.
        A female is often the leader of the group, and
        the males will gather food.
      fr: |-
        Les Escroco se déplacent en bandes, souvent
        menées par une femelle. La plupart du temps,
        les mâles se chargent de collecter la nourriture.
      de: |-
        Es bildet mit mehreren Artgenossen ein Rudel.
        Meistens führen Weibchen die Gruppe an und
        Männchen müssen Nahrung beschaffen.
      es: |-
        Viven en manadas. En muchos casos, las
        hembras ejercen una posición dominante y los
        machos se encargan de buscar alimento.
      it: |-
        Vive in piccoli gruppi.
        Se il capogruppo è una femmina, i maschi
        si occupano di procurare il cibo.
    moon:
      ja-Hrkt: |-
        めを　おおう　とくしゅな　まくの
        おかげで　まよなかでも　あたりを
        はっきり　みることが　できるぞ。
      ja: |-
        目を　覆う　特殊な　膜の
        おかげで　真夜中でも　あたりを
        はっきり　見ることが　できるぞ。
      ko: |-
        눈을 감싸는 특수한 막
        덕분에 한밤중에도 주변을
        똑똑히 볼 수 있다.
      zh-Hant: |-
        多虧蓋住眼睛的特殊膜，
        即使在深夜也能把周圍
        看得一清二楚。
      zh-Hans: |-
        多亏了盖住眼睛的特殊膜，
        即使在深夜也能把周围
        看得一清二楚。
      en: |-
        Thanks to the special membrane covering its
        eyes, it can see its surroundings clearly, even in
        the middle of the night.
      fr: |-
        Grâce à la membrane spéciale qui recouvre
        ses yeux, il peut distinguer parfaitement
        ses environs, même en pleine nuit.
      de: |-
        Durch die spezielle Membran um seine Augen
        kann es seine Umgebung auch im Dunkeln
        deutlich sehen.
      es: |-
        La membrana especial que le recubre los ojos
        le permite discernir con claridad lo que se halla
        a su alrededor, incluso en plena noche.
      it: |-
        La membrana speciale che ricopre i suoi occhi
        gli permette di vedere chiaramente l’ambiente
        circostante anche al buio.
    ultra-sun:
      ja-Hrkt: |-
        からだが　ひえるのが　とてもにがて。
        きおんが　さがる　ばんには　さばくの
        すなの　おくふかくに　もぐっている。
      ja: |-
        体が　冷えるのが　とても　苦手。
        気温が　下がる　晩には　砂漠の
        砂の　奥深くに　潜っている。
      ko: |-
        몸이 차가워지는 것을 매우 싫어한다.
        기온이 내려가는 밤에는
        사막 모래 속으로 깊숙이 파고든다.
      zh-Hant: |-
        非常害怕身體變冷。
        在氣溫下降的夜晚，
        會潛藏在沙漠的沙底深處。
      zh-Hans: |-
        非常害怕身体变冷。
        在气温下降的夜晚
        会潜藏在沙漠的沙子深处。
      en: |-
        Krokorok really hates it when its body gets
        cold. On nights when the temperature drops,
        it digs deep into the desert sands.
      fr: |-
        Son corps supportant mal les baisses de
        température, il s’ensable profondément lorsque
        les nuits sont trop fraîches.
      de: |-
        Rokkaiman verträgt es nicht gut, wenn sein
        Körper auskühlt. Deshalb vergräbt es sich an
        besonders kalten Abenden tief im Wüstensand.
      es: |-
        Su gran debilidad es el frío, por lo que cuando
        bajan las temperaturas de noche en el desierto,
        excava un agujero en la arena y se cobija en él.
      it: |-
        Odia il freddo. Se di notte la temperatura
        cala eccessivamente, si scava un rifugio in
        profondità sotto la sabbia.
    ultra-moon:
      ja-Hrkt: |-
        えものの　いちぶは　すなのなかに
        うめて　かりが　しっぱいしたときの
        ひじょうしょくに　するのだ。
      ja: |-
        獲物の　１部は　砂の中に
        埋めて　狩りが　失敗したときの
        非常食に　するのだ。
      ko: |-
        먹이의 일부는 모래 속에
        묻어서 사냥에 실패했을 때의
        비상식량으로 삼는다.
      zh-Hant: |-
        會把獵物的一部份
        埋在沙子裡，當成狩獵
        失敗時的儲備糧食。
      zh-Hans: |-
        把猎物的一部分埋在沙子里，
        作为狩猎失败时的储备粮。
      en: |-
        It buries some of its prey in the sand to use as
        emergency meals when its hunts
        are unsuccessful.
      fr: |-
        Il garde une partie de ses prises en réserve
        dans le sable, au cas où il rentrerait bredouille
        de la chasse.
      de: |-
        Einen Teil seiner Beute vergräbt es als Notration
        im Sand. Auf sie greift es zurück, wenn es von
        einer erfolglosen Jagd zurückkehrt.
      es: |-
        Entierra parte de sus presas bajo la arena para
        reservarlas a modo de víveres de emergencia,
        en caso de una caza infructuosa.
      it: |-
        Sotterra alcune prede nella sabbia come scorta
        d’emergenza per i casi in cui la caccia non dia
        buoni frutti.
    sword:
      ja-Hrkt: |-
        くらやみでも　みえる　とくしゅな
        りょうめの　おかげで　まよなかでも
        まよわず　かりが　できるのだ。
      ja: |-
        暗闇でも　見える　特殊な
        両目の　おかげで　真夜中でも
        迷わず　狩りが　できるのだ。
      ko: |-
        어둠 속에서도 볼 수 있는 특수한
        두 눈 덕분에 한밤중에도
        거침없이 사냥할 수 있다.
      zh-Hant: |-
        有一雙在漆黑環境也能看見
        四周的特殊眼睛，讓牠即使
        在半夜也能不受影響地去打獵。
      zh-Hans: |-
        多亏了那双能在黑暗中看清
        四周的特殊眼睛，即使在深夜里
        它也能精准地进行捕猎。
      en: |-
        Krokorok has specialized eyes that enable it to
        see in the dark. This ability lets Krokorok hunt in
        the dead of night without getting lost.
      fr: |-
        Il chasse de nuit sans difficulté grâce à
        ses yeux particuliers qui lui permettent
        de voir dans l’obscurité.
      de: |-
        Da es dank seiner besonderen Augen selbst im
        Dunkeln gut sieht, kann es auch nachts auf die
        Jagd gehen, ohne sich zu verirren.
      es: |-
        Es capaz de cazar en plena noche sin perderse
        gracias a sus ojos especiales, que le permiten
        ver en la oscuridad.
      it: |-
        È in grado di cacciare nel pieno della notte senza
        difficoltà, grazie agli occhi particolari che gli
        permettono di vedere anche al buio.
    shield:
      ja-Hrkt: |-
        くらやみでも　みえる　とくしゅな
        りょうめを　もつが　さばくのよるは
        さむいので　あまり　うごかない。
      ja: |-
        暗闇でも　見える　特殊な
        両目を　もつが　砂漠の夜は
        寒いので　あまり　動かない。
      ko: |-
        어둠 속에서도 볼 수 있는 특수한
        눈을 가졌지만 사막의 밤은
        춥기 때문에 잘 움직이지 않는다.
      zh-Hant: |-
        雖然有一雙在漆黑環境也能看見
        四周的特殊眼睛，但因為沙漠的
        夜晚較寒冷，所以牠不太會活動。
      zh-Hans: |-
        虽然拥有能在黑暗中看清事物的
        特殊双眼，但由于沙漠的夜晚寒冷，
        所以一般不怎么活动。
      en: |-
        Although this Pokémon has specialized eyes that
        allow it to see in the dark, Krokorok won’t move
        much at night—the desert gets cold after sunset.
      fr: |-
        Bien que ses yeux particuliers lui permettent
        de voir dans l’obscurité, les nuits sont si froides
        dans le désert qu’il ne se déplace presque pas.
      de: |-
        Obwohl es dank seiner besonderen Augen auch
        im Dunkeln gut sehen kann, bewegt es sich nachts
        nur selten, da die Wüste dann abkühlt.
      es: |-
        Tiene unos ojos especiales que le permiten ver
        en la oscuridad, pero suele permanecer inmóvil
        en las frías noches del desierto.
      it: |-
        È dotato di occhi particolari che gli permettono
        di vedere anche al buio, ma poiché le notti nel
        deserto sono fredde non è molto attivo di notte.
