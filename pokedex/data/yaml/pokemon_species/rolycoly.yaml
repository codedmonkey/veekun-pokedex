rolycoly:
  base_happiness: 50
  capture_rate: 255
  color: black
  egg_groups:
    - mineral
  evolution_chain: rolycoly
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        およそ４００ねんまえに　たんこうで
        みつかった。　からだの　ほとんどが
        せきたんと　おなじ　せいぶん。
      ja: |-
        およそ４００年前に　炭鉱で
        見つかった。　体の　ほとんどが
        石炭と　同じ　成分。
      ko: |-
        약 400년 전에 탄광에서
        발견되었다. 몸의 대부분이
        석탄과 같은 성분이다.
      zh-Hant: |-
        大約４００年前在煤礦坑中
        被人們發現。身體絕大部分
        的成分都和煤炭相同。
      zh-Hans: |-
        大约４００年前在煤矿坑中
        被人们发现。身体绝大部分
        的成分都和煤炭相同。
      en: |-
        Most of its body has the same composition as
        coal. Fittingly, this Pokémon was first discovered
        in coal mines about 400 years ago.
      fr: |-
        On l’a découvert dans une mine il y a 400 ans.
        Son corps est presque entièrement composé
        d’une substance identique au charbon.
      de: |-
        Es wurde vor circa 400 Jahren in einer Kohlemine
        entdeckt. Sein Körper besteht fast aus denselben
        Komponenten wie Steinkohle.
      es: |-
        Fue descubierto hace aproximadamente 400
        años en una mina. Casi la totalidad de su cuerpo
        presenta una composición igual a la del carbón.
      it: |-
        È stato scoperto più di 400 anni fa in una
        miniera. Il suo corpo è prevalentemente
        composto di una sostanza uguale al carbone.
    shield:
      ja-Hrkt: |-
        いわだらけの　あくろを　ものともせず
        いちりんしゃのように　はしりまわる。
        せきたんを　もやして　いきている。
      ja: |-
        岩だらけの　悪路を　ものともせず
        一輪車のように　走りまわる。
        石炭を　燃やして　生きている。
      ko: |-
        바위투성이의 거친 길을 아무렇지도
        않게 일륜차처럼 달린다.
        석탄을 태워서 살고 있다.
      zh-Hant: |-
        在滿是岩石的崎嶇路面上
        也能像獨輪車那樣自在移動。
        靠燃燒煤炭維持生命。
      zh-Hans: |-
        在满是岩石的崎岖之路上
        也能像独轮车那样自在移动。
        靠燃烧煤炭维持生命。
      en: |-
        It can race around like a unicycle, even on rough,
        rocky terrain. Burning coal sustains it.
      fr: |-
        Il parcourt sans difficulté les sentiers rocheux
        accidentés à la manière d’un monocycle.
        Il a besoin de brûler du charbon pour vivre.
      de: |-
        Auch auf steinigen, schlecht befahrbaren Wegen
        fährt es problemlos, als wäre es ein Einrad.
        Es verbrennt Steinkohle, um zu überleben.
      es: |-
        Recorre incluso los caminos más impracticables y
        pedregosos como si de un monociclo se tratase.
        La combustión de carbón es su fuente vital.
      it: |-
        Corre in lungo e in largo come un monociclo
        anche sulle strade sassose più accidentate.
        Vive grazie alla combustione del carbone.
