    white-2:
      en: |-
        The brains in its two heads appear
        to communicate emotions to each
        other with a telepathic power.
    x:
      ja-Hrkt: |-
        とつぜんへんいで　みつかった
        ２つの　あたまを　もつ　ポケモン。
        じそく　１００キロで　はしる。
      ja: |-
        突然変異で　見つかった
        ２つの　頭を　持つ　ポケモン。
        時速１００キロで　走る。
      ko: |-
        돌연변이로 발견된
        두 개의 머리를 지닌 포켓몬이다.
        시속 100km로 달린다.
      en: |-
        A two-headed Pokémon that was discovered as a
        sudden mutation. It runs at a pace of over 60 miles
        per hour.
      fr: |-
        Ce Pokémon à deux têtes est le résultat d’une
        soudaine mutation. Il peut courir jusqu’à 100 km/h.
      de: |-
        Dieses zweiköpfige Pokémon gilt als plötzliche
        Mutation. Es rennt bis zu 100 km/h schnell.
      es: |-
        Este Pokémon de dos cabezas es el resultado de una
        mutación. Cuando corre, puede alcanzar casi 100 km
        por hora.
      it: |-
        Pokémon a due teste, scoperto a seguito di
        un’improvvisa mutazione. Può correre a 100 km/h.
    'y':
      ja-Hrkt: |-
        ２つの　あたまの　のうみそは
        テレパシーのような　ちからで
        きもちを　つうじあわせているらしい。
      ja: |-
        ２つの　頭の　脳みそは
        テレパシーのような　力で
        気持ちを　通じ合わせているらしい。
      ko: |-
        두 머리에 각각 존재하는 뇌는
        텔레파시 같은 힘으로
        의사를 맞춰나가는 듯하다.
      en: |-
        The brains in its two heads appear to communicate
        emotions to each other with a telepathic power.
      fr: |-
        Ses deux cerveaux semblent communiquer leurs
        émotions grâce à un lien télépathique.
      de: |-
        Die Gehirne der beiden Köpfe kommunizieren ihre
        Gefühle über Telepathie.
      es: |-
        Parece que los cerebros de sus dos cabezas se
        comunican por telepatía.
      it: |-
        I suoi due cervelli si comunicano le emozioni grazie
        ai poteri telepatici.
    omega-ruby:
      ja-Hrkt: |-
        ２つの　あたまが　どうじに　ねむることは　ない。
        ねている　とき　てきから　おそわれない　ように
        かわりばんこで　みはりを　しているからだ。
      ja: |-
        ２つの　頭が　同時に　眠ることは　ない。
        寝ている　とき　敵から　襲われない　ように
        代りばんこで　見張りを　しているからだ。
      ko: |-
        2개의 머리가 동시에 잠드는 일은 없다.
        자고 있을 때 적에게 습격당하지 않도록
        교대로 망을 보고 있기 때문이다.
      en: |-
        Doduo’s two heads never sleep at the same time. Its two
        heads take turns sleeping, so one head can always keep
        watch for enemies while the other one sleeps.
      fr: |-
        Les deux têtes de Doduo ne dorment jamais en même temps.
        Elles se reposent à tour de rôle pour que l’une puisse monter
        la garde pendant que l’autre dort.
      de: |-
        Dodu hat zwei Köpfe, die nie zur selben Zeit, sondern
        abwechselnd schlafen. Während ein Kopf schläft, hält der
        andere Ausschau nach Feinden.
      es: |-
        Las dos cabezas de Doduo duermen de forma independiente,
        siempre por turnos. Mientras una duerme, la otra hace de
        centinela por si aparecen enemigos.
      it: |-
        Le due teste di Doduo non dormono mai nello stesso
        momento, in modo che una sia sempre vigile per difendersi
        dai nemici, mentre l’altra può riposare tranquilla.
    alpha-sapphire:
      ja-Hrkt: |-
        ２つの　あたまは　おなじ　のうみそを　もつ。
        まれに　べつべつの　のうを　もった　ドードーが
        うまれてくると　けんきゅうで　ほうこくされた。
      ja: |-
        ２つの　頭は　同じ　脳みそを　持つ。
        まれに　別々の　脳を　持った　ドードーが
        生まれてくると　研究で　報告された。
      ko: |-
        두 개의 머리는 같은 뇌를 지녔다.
        드물게 각각의 뇌를 지닌 두두가
        태어난다는 연구 결과도 보고되었다.
      en: |-
        Doduo’s two heads contain completely identical brains. A
        scientific study reported that on rare occasions, there will be
        examples of this Pokémon possessing different sets of brains.
      fr: |-
        Les deux têtes de Doduo contiennent des cerveaux
        totalement identiques. Une étude scientifique démontra
        que dans des cas rares, certains de ces Pokémon
        possèdent des cerveaux différents.
      de: |-
        Dodu hat zwei Köpfe mit absolut identischen Gehirnen.
        Eine wissenschaftliche Studie hat allerdings nachgewiesen,
        dass es auch Exemplare dieses Pokémon gibt, die zwei
        unterschiedliche Gehirne haben.
      es: |-
        Doduo es un Pokémon bicéfalo de cerebros idénticos. Según
        un estudio científico, podría darse el extraño caso de que
        hubiera algún Doduo con cerebros distintos.
      it: |-
        Le due teste di Doduo contengono lo stesso identico
        cervello. Secondo uno studio scientifico sono stati riportati
        rari casi di Doduo con cervelli diversi.
    lets-go-pikachu:
      ja-Hrkt: |-
        はねは　みじかく　そらをとぶのは
        にがてだが　そのかわり　はったつした
        あしで　はやく　かけることができる。
      ja: |-
        羽は　短く　空を飛ぶのは
        苦手だが　その代わり　発達した
        足で　速く　駆けることができる。
      ko: |-
        날개가 짧아서 하늘을 나는 것은
        서투르지만 대신 발달한
        다리로 빠르게 달릴 수 있다.
      zh-Hant: |-
        翅膀短小不擅長飛行，
        但是擁有發達的雙腳，
        能以很快的速度奔跑。
      zh-Hans: |-
        羽毛较短所以不擅长飞行，
        但是拥有发达的双脚，
        能够以很快的速度奔跑。
      en: |-
        Its short wings make flying difficult. Instead, this
        Pokémon runs at high speed on developed legs.
      fr: |-
        Ses petites ailes ne lui permettent pas de voler,
        mais grâce à ses puissantes pattes, il peut courir
        très rapidement.
      de: |-
        Es kann nicht gut fliegen, weil seine Flügel zu
        klein sind. Dafür kann es mit seinen starken
        Beinen sehr schnell laufen.
      es: |-
        Las diminutas alas apenas le permiten volar,
        pero puede correr a gran velocidad gracias a
        sus patas hiperdesarrolladas.
      it: |-
        Le cortissime ali non gli permettono di volare.
        Può tuttavia correre velocissimo grazie alle
        zampe ben sviluppate.
    lets-go-eevee:
      ja-Hrkt: |-
