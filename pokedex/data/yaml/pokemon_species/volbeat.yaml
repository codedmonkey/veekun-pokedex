    x:
      ja-Hrkt: |-
        よるになると　おしりを　ひからせ
        なかまと　かいわする。イルミーゼの
        だす　あまい　かおりが　だいすき。
      ja: |-
        夜になると　お尻を　光らせ
        仲間と　会話する。イルミーゼの
        出す　甘い　香りが　大好き。
      ko: |-
        밤이 되면 엉덩이를 빛나게 해
        동료와 대화한다. 네오비트가
        내는 달콤한 향기를 매우 좋아한다.
      en: |-
        It communicates with others by lighting up its rear
        at night. It loves Illumise’s sweet aroma.
      fr: |-
        Il communique avec ses pairs en allumant son
        postérieur la nuit. Il adore le doux parfum de
        Lumivole.
      de: |-
        Es kommuniziert mit anderen, indem es sein
        Hinterteil zum Leuchten bringt. Es liebt Illumises Duft.
      es: |-
        Se comunica con otros iluminando su cola por la
        noche. Le encanta el suave aroma de Illumise.
      it: |-
        Di notte comunica con gli altri illuminando la sua
        coda. Ama il dolce aroma di Illumise.
    'y':
      ja-Hrkt: |-
        みずの　きれいな　いけに　せいそく。
        よるに　なると　おしりが　ひかり
        てんめつさせて　なかまと　かいわ。
      ja: |-
        水の　きれいな　池に　生息。
        夜に　なると　お尻が　光り
        点滅させて　仲間と　会話。
      ko: |-
        물이 깨끗한 연못에 서식한다.
        밤이 되면 엉덩이가 빛나며
        이를 깜박여서 동료와 대화한다.
      en: |-
        It lives around clean ponds. At night, its rear lights
        up. It converses with others by flashing its light.
      fr: |-
        Il vit aux abords des étangs. La nuit, son corps émet
        de la lumière pour communiquer avec d’autres
        Muciole.
      de: |-
        Es lebt in der Nähe von reinen Teichen. Nachts
        leuchtet sein Hinterteil und es kommuniziert durch
        dessen Blinken mit Artgenossen.
      es: |-
        Vive cerca de estanques de agua clara. De noche,
        enciende la luz de la cola para comunicarse con
        otros de su especie.
      it: |-
        Vive vicino a stagni puliti. Di notte, la sua coda
        lancia una luce intermittente per comunicare.
    omega-ruby:
      ja-Hrkt: |-
        ひが　くれると　しっぽから　ひかりを　だして
        あかるさや　てんめつで　なかまと　かいわする。
        イルミーゼの　あまい　かおりに　ひきよせられる。
      ja: |-
        日が　暮れると　尻尾から　光を　出して
        明るさや　点滅で　仲間と　会話する。
        イルミーゼの　甘い　香りに　引き寄せられる。
      ko: |-
        날이 저물면 꼬리에서 빛을 내어
        밝기나 점멸로 동료와 대화한다.
        네오비트의 달콤한 향기에 유인된다.
      en: |-
        With the arrival of night, Volbeat emits light from its tail.
        It communicates with others by adjusting the intensity and
        flashing of its light. This Pokémon is attracted by the sweet
        aroma of Illumise.
      fr: |-
        À la tombée de la nuit, la queue de Muciole émet de la
        lumière. Il communique avec les autres en ajustant l’intensité
        et le clignotement de sa lumière. Ce Pokémon est attiré
        par le doux parfum de Lumivole.
      de: |-
        Wenn es Nacht wird, beginnt Volbeats Schweif zu leuchten.
        Es kommuniziert mit anderen, indem es die Helligkeit und das
        Blinken dieses Lichts reguliert. Dieses Pokémon wird vom
        süßen Duft der Illumise angezogen.
      es: |-
        Cuando llega la noche, Volbeat emite luz por la cola y regula
        la intensidad y el destello para comunicarse con el resto. A
        este Pokémon le atrae el dulce aroma de Illumise.
      it: |-
        Quando cala la notte, Volbeat emette una luce intensa
        dalla coda. Comunica con gli altri regolando l’intensità e
        l’intermittenza della propria luce. Il Pokémon è attratto
        dal dolce aroma di Illumise.
    alpha-sapphire:
      ja-Hrkt: |-
        しっぽの　あかりを　つかって　しゅうだんで
        よぞらに　きかがくてきな　ずけいを　えがく。
        イルミーゼの　だす　あまい　かおりが　だいすき。
      ja: |-
        尻尾の　明かりを　つかって　集団で
        夜空に　幾何学的な　図形を　描く。
        イルミーゼの　出す　甘い　香りが　大好き。
      ko: |-
        꼬리의 불빛을 사용하여 단체로
        밤하늘에 기하학적인 도형을 그린다.
        네오비트가 내는 달콤한 향기를 매우 좋아한다.
      en: |-
        Volbeat’s tail glows like a lightbulb. With other Volbeat,
        it uses its tail to draw geometric shapes in the night sky.
        This Pokémon loves the sweet aroma given off by Illumise.
      fr: |-
        La queue de Muciole éclaire comme une ampoule.
        Ensemble, les Muciole dessinent des figures géométriques
        dans la nuit étoilée. Ce Pokémon adore le parfum dégagé
        par Lumivole.
      de: |-
        Volbeats Schweif leuchtet wie eine Glühbirne. Zusammen mit
        anderen Volbeat malt es mit seinem Schweif geometrische
        Figuren an den Nachthimmel. Dieses Pokémon liebt den von
        Illumise verströmten Duft.
      es: |-
        La cola de Volbeat brilla como una bombilla. Ante otro de su
        grupo, la usa para dibujar formas geométricas en la oscuridad
        del cielo por la noche. Este Pokémon adora el dulce aroma
        que desprende Illumise.
      it: |-
        La coda di Volbeat si illumina come una lampadina.
        Assieme ai suoi simili usa la coda per tracciare figure
        geometriche nel cielo notturno. Questo Pokémon ama
        il dolce aroma emanato da Illumise.
