    sun:
      ja-Hrkt: |-
        テレパシーで　なかまと　こうしんする。
        しょくぶつと　あるしゅの　タイプの
        いでんしを　あわせもつと　いう。
      ja: |-
        テレパシーで　仲間と　交信する。
        植物と　ある種の　タイプの
        遺伝子を　併せ持つと　いう。
      ko: |-
        텔레파시로 동료와 교신한다.
        식물과 어떤 종의 타입의 유전자를
        모두 갖추고 있다고 한다.
      zh-Hant: |-
        用心靈感應與夥伴交流。
        聽說同時具備植物與
        某種屬性的基因。
      zh-Hans: |-
        用心灵感应与伙伴交流。
        据说兼有植物与某种别的遗传基因。
      en: |-
        Its six eggs use telepathy to communicate
        among themselves. It is believed to carry
        plant genes and the genes of other species.
      fr: |-
        Il communique avec ses amis par télépathie.
        Son ADN est un mélange de celui d’une plante
        et d’un autre type non identifié.
      de: |-
        Die sechs Eier kommunizieren telepathisch
        miteinander. Sie tragen das Erbgut von Pflanzen
        sowie Pokémon eines bestimmten Typs in sich.
      es: |-
        Los seis huevos que componen a Exeggcute se
        comunican por medio de la telepatía. Se dice que
        contiene genes de plantas y de otras especies.
      it: |-
        Le sei uova comunicano telepaticamente. Il loro
        patrimonio genetico sembra avere elementi in
        comune con quello dei vegetali e di altre specie.
    moon:
      ja-Hrkt: |-
        ６ぴきで　１にんまえの　ポケモン。
        マケンカニに　よく　ねらわれるが
        ねんりきを　つかって　げきたいする。
      ja: |-
        ６匹で　１人前の　ポケモン。
        マケンカニに　よく　狙われるが
        念力を　使って　撃退する。
      ko: |-
        여섯 마리가 하나인 포켓몬이다.
        오기지게가 자주 노리지만
        염동력을 사용해서 물리친다.
      zh-Hant: |-
        ６隻為１個單位的寶可夢。
        經常被好勝蟹襲擊，
        但是會使用念力擊退對方。
      zh-Hans: |-
        ６只成为１只完整的宝可梦。
        经常被好胜蟹袭击，
        但是会使用念力击退对方。
      en: |-
        Six of them together form a full-fledged
        Pokémon. It’s often hunted by Crabrawler,
        but uses psychokinesis to drive it off.
      fr: |-
        Ce Pokémon est composé de six œufs.
        Ils sont souvent attaqués par des Crabagarre,
        mais ils se défendent avec leurs pouvoirs psy.
      de: |-
        Es besteht aus sechs Eiern. Krabbox versucht
        oft, es sich einzuverleiben, doch wehrt es sich
        tapfer mit seinen Psycho-Kräften.
      es: |-
        Este Pokémon está formado por seis huevos.
        Se defiende con sus poderes psíquicos de los
        frecuentes ataques de Crabrawler.
      it: |-
        È costituito da sei individui. Viene spesso preso
        di mira dai Crabrawler, ma riesce a metterli
        in fuga con i suoi poteri psichici.
    ultra-sun:
      ja-Hrkt: |-
        ６ぴきで　１ぴき。　なにかあって
        １ぴき　へっても　よくあさに　なると
        かならず　６ぴきに　もどっている。
      ja: |-
        ６匹で　１匹。　なにかあって
        １匹　減っても　翌朝に　なると
        必ず　６匹に　戻っている。
      ko: |-
        6마리가 1마리다. 어쩌다
        1마리가 줄어도 다음날 아침이 되면
        다시 6마리로 돌아와 있다.
      zh-Hant: |-
        ６隻合起來算是１隻。就算
        發生了什麼事導致少了１隻，
        隔天也一定會變回６隻。
      zh-Hans: |-
        ６只加在一起算１只。
        即便出于某些原因少了１只，
        到了次日清晨也一定会变回６只。
      en: |-
        Six of them form a single Pokémon. Should one
        of the six be lost, the next morning there will
        once more be six.
      fr: |-
        Six pour le prix d’un ! Si par malheur l’un d’entre
        eux disparaît, il est remplacé dès le lendemain
        matin par une nouvelle recrue.
      de: |-
        Dieses Pokémon besteht aus sechs Individuen.
        Geht eines verloren, sind es am nächsten
        Morgen trotzdem auf jeden Fall wieder sechs.
      es: |-
        Seis criaturas en una. Si Exeggcute pierde alguno
        de los huevos que lo componen, este volverá a
        crecer a la mañana siguiente.
      it: |-
        Ciascun Pokémon è formato da sei individui.
        Anche se dovesse sparirne uno per qualche
        motivo, la mattina dopo sarebbero di nuovo sei.
    ultra-moon:
      ja-Hrkt: |-
        アローラさんの　タマタマは　おんなじ
        おおきさでも　かなり　おもたい。
        しっかり　なかみが　つまっているのだ。
      ja: |-
        アローラ産の　タマタマは　同じ
        大きさでも　かなり　重たい。
        しっかり　中身が　詰まっているのだ。
      ko: |-
        알로라산 아라리는
        같은 크기라도 꽤 무겁다.
        내용물이 꽉 차 있다.
      zh-Hant: |-
        即使大小相同，
        阿羅拉產的蛋蛋會特別重。
        這是因為牠裡面長得非常紮實。
      zh-Hans: |-
        即便大小相同，
        阿罗拉产的蛋蛋却很沉重。
        这是因为里面长得十分密实。
      en: |-
        Although they are the same size as other
        Exeggcute, the ones produced in Alola are quite
        heavy. Their shells are packed full.
      fr: |-
        Bien qu’ils fassent la même taille, les Noeunoeuf
        d’Alola sont plus lourds que ceux des autres
        régions, car leur intérieur est bien plus dense.
      de: |-
        Owei in Alola sind trotz gleicher Größe schwerer
        als ihre Artgenossen in anderen Regionen, da ihr
        Inneres eine besonders hohe Dichte hat.
      es: |-
        Pese a tener el mismo tamaño, los Exeggcute de
        Alola son más pesados que los de otras
        regiones, ya que su interior es más denso.
      it: |-
        Gli Exeggcute che vivono ad Alola, pur essendo
        grandi come quelli di altre regioni, sono più
        pesanti per via dell’interno più denso.
    lets-go-pikachu:
      ja-Hrkt: |-
        タマの　ひとつひとつが　おたがいに
        ひきあって　かいてんしている。
        ６つでないと　あんていしないのだ。
      ja: |-
        タマの　ひとつひとつが　お互いに
        引きあって　回転している。
        ６つでないと　安定しないのだ。
      ko: |-
        알 하나하나가 서로를
        끌어당겨서 회전한다.
        6개가 아니면 불안해한다.
      zh-Hant: |-
        每顆蛋之間會互相吸引
        並且不停旋轉，只有在
        湊齊６顆時才會安定下來。
      zh-Hans: |-
        每一个蛋都相互吸引着
        旋转。６个蛋凑不齐时
        它就无法保持平衡。
      en: |-
        The heads attract each other and spin
        around. There must be six heads for it to
        maintain balance.
      fr: |-
        Ses têtes sont attirées les unes vers les autres
        et pivotent. Il en faut six pour qu’il maintienne
        son équilibre.
      de: |-
        Oweis kleine Köpfe ziehen sich gegenseitig an
        und drehen sich. Es braucht sechs von ihnen,
        um die Balance zu halten.
      es: |-
        Las cabezas se atraen unas a otras y giran entre
        sí. Debe tener seis para equilibrarse.
      it: |-
        Le teste si attraggono a vicenda, creando un
        movimento circolare. Riescono a stabilizzarsi
        solo se sono in sei.
    lets-go-eevee:
      ja-Hrkt: |-
        タマの　ひとつひとつが　おたがいに
        ひきあって　かいてんしている。
        ６つでないと　あんていしないのだ。
      ja: |-
