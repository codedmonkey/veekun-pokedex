    sword:
      ja-Hrkt: |-
        タマゴのように　みえるが　りっぱな
        ポケモン。　テレパシーで　なかまと
        こうしん　している　らしいぞ。　
      ja: |-
        タマゴのように　見えるが　立派な
        ポケモン。　テレパシーで　仲間と
        交信している　らしいぞ。
      ko: |-
        알처럼 보이지만 엄연한
        포켓몬이다. 텔레파시로
        동료와 교신하는 듯하다.
      zh-Hant: |-
        雖然看起來很像是蛋，但卻是
        如假包換的寶可夢。似乎會用
        心靈感應來與夥伴們交流喔。
      zh-Hans: |-
        别看它看上去像蛋，其实是
        如假包换的宝可梦。据说它会
        用心灵感应来和伙伴通讯。
      en: |-
        Though it may look like it’s just a bunch of eggs,
        it’s a proper Pokémon. Exeggcute communicates
        with others of its kind via telepathy, apparently.
      fr: |-
        Même s’il ressemble à un tas d’œufs, il s’agit bien
        d’un Pokémon. Il paraît qu’ils communiquent
        entre eux par télépathie.
      de: |-
        Owei mag zwar Eiern ähneln, ist aber ein echtes
        Pokémon, das aus sechs Individuen besteht, die
        wohl telepathisch miteinander kommunizieren.
      es: |-
        Pese a su aspecto de mera piña de huevos, se
        trata de un Pokémon. Al parecer, sus cabezas
        se comunican entre sí por telepatía.
      it: |-
        Somiglia a un mucchio di uova, ma è un Pokémon
        a tutti gli effetti. Pare che comunichi con i suoi
        simili telepaticamente.
    shield:
      ja-Hrkt: |-
        ６ぴきで　いないと　おちつかない。
        １ぴきでも　いなくなると　とたんに
        にげごしに　なるのだ。
      ja: |-
        ６匹で　いないと　落ち着かない。
        １匹でも　いなくなると　とたんに
        逃げ腰に　なるのだ。
      ko: |-
        6마리가 아니면 진정하지 못한다.
        1마리라도 없어지면 바로
        도망태세가 된다.
      zh-Hant: |-
        非得湊齊６隻才會有安全感。
        那怕只是少了１隻，都會立刻
        變得很膽小，隨時想要逃跑。
      zh-Hans: |-
        ６只不在一起就不安心。
        哪怕只是少了１只，
        都会马上想要逃跑。
      en: |-
        These Pokémon get nervous when they’re not in a
        group of six. The minute even one member of the
        group goes missing, Exeggcute become cowardly.
      fr: |-
        Il a besoin d’être constitué de ses six membres
        pour rester calme. Sitôt qu’il en manque un,
        il lui prend soudainement l’envie de fuir.
      de: |-
        Es muss immer aus sechs Mitgliedern bestehen,
        sonst herrscht Unruhe. Fehlt auch nur eines, steigt
