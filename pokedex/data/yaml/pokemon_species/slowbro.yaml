slowbro:
  base_happiness: 50
  capture_rate: 75
  color: pink
  egg_groups:
    - monster
    - water1
  evolution_chain: slowpoke
  evolves_from: slowpoke
  flavor_text:
    red:
      en: |-
        The SHELLDER that
        is latched onto
        SLOWPOKE's tailis said to feed
        on the host's left
        over scraps.
    blue:
      en: |-
        The SHELLDER that
        is latched onto
        SLOWPOKE's tailis said to feed
        on the host's left
        over scraps.
    yellow:
      en: |-
        Lives lazily by
        the sea. If the
        SHELLDER on itstail comes off,
        it becomes a
        SLOWPOKE again.
    gold:
      en: |-
        If the tail-biting
        SHELLDER is thrown
        off in a harshbattle, it reverts
        to being an ordi­
        nary SLOWPOKE.
    silver:
      en: |-
        Naturally dull to
        begin with, it
        lost its abilityto feel pain due
        to SHELLDER's
        seeping poison.
    crystal:
      en: |-
        An attached
        SHELLDER won't let
        go because of thetasty flavor that
        oozes out of its
        tail.
    ruby:
      en: |-
        SLOWBRO’s tail has a SHELLDER firmly
        attached with a bite. As a result, the
        tail can’t be used for fishing anymore.This causes SLOWBRO to grudgingly swim
        and catch prey instead.
    sapphire:
      en: |-
        SLOWBRO’s tail has a SHELLDER firmly
        attached with a bite. As a result, the
        tail can’t be used for fishing anymore.This causes SLOWBRO to grudgingly swim
        and catch prey instead.
    emerald:
      en: |-
        Its tail has a SHELLDER firmly attached
        with a bite. As a result, the tail can’t be
        used for fishing anymore. This forces it
        to reluctantly swim and catch prey.
    firered:
      en: |-
        When a SLOWPOKE went hunting in the sea,
        its tail was bitten by a SHELLDER. That
        made it evolve into SLOWBRO.
    leafgreen:
      en: |-
        The SHELLDER that latches onto
        SLOWPOKE’s tail is said to feed on the
        host’s leftover scraps.
    diamond:
      en: |-
        Though usually dim witted, it
        seems to become inspired if the
        SHELLDER on its tail bites down.
    pearl:
      en: |-
        Though usually dim witted, it
        seems to become inspired if the
        SHELLDER on its tail bites down.
    platinum:
      en: |-
        Though usually dim witted, it
        seems to become inspired if the
        SHELLDER on its tail bites down.
    heartgold:
      en: |-
        If the tail-biting SHELLDER is thrown
        off in a harsh battle, it reverts to
        being an ordinary SLOWPOKE.
    soulsilver:
      en: |-
        Naturally dull to begin with, it
        lost its ability to feel pain due
        to SHELLDER’s seeping poison.
    black:
      en: |-
        Though usually dim witted, it
        seems to become inspired if the
        Shellder on its tail bites down.
      fr: |-
        Ce grand benêt connaît des éclairs
        de lucidité lorsque le Kokiyas de sa
        queue se met à mordre.
    white:
      en: |-
        Though usually dim witted, it
        seems to become inspired if the
        Shellder on its tail bites down.
      fr: |-
        Ce grand benêt connaît des éclairs
        de lucidité lorsque le Kokiyas de sa
        queue se met à mordre.
    black-2:
      en: |-
        Though usually dim witted, it
        seems to become inspired if the
        Shellder on its tail bites down.
    white-2:
      en: |-
        Though usually dim witted, it
        seems to become inspired if the
        Shellder on its tail bites down.
    x:
      ja-Hrkt: |-
        くっついている　シェルダーは
        しっぽから　にじみでる　うまみが
        ほしくて　ずっと　はなれない。
      ja: |-
        くっついている　シェルダーは
        尻尾から　にじみ出る　うま味が
        欲しくて　ずっと　離れない。
      ko: |-
        붙어 있는 셀러는
        꼬리에서 배어 나오는 맛을
        좋아해서 계속 떨어지지 않는다.
      en: |-
        An attached Shellder won’t let go because of
        the tasty flavor that oozes out of its tail.
      fr: |-
        Le Kokiyas accroché à sa queue est friand de ce qu’il
        dévore et ne veut pas lâcher prise.
      de: |-
        Das Muschas an seiner Rute lässt nicht locker,
        da ein leckerer Geschmack aus seiner Rute strömt.
      es: |-
        Tiene una cola tan apetecible, que el Shellder que va
        enganchado a ella no se soltará por nada del mundo.
      it: |-
        Lo Shellder che gli sta attaccato non si stacca mai
        a causa del profumo appetitoso della coda.
    'y':
      ja-Hrkt: |-
        ヤドンが　うみへ　エサを
        とりにいったとき　シェルダーに
        しっぽをかまれ　ヤドランになった。
      ja: |-
        ヤドンが　海へ　エサを
        取りにいったとき　シェルダーに
        尻尾を　かまれ　ヤドランになった。
      ko: |-
        야돈이 바다로 먹이를
        잡으러 갔다가 셀러에게
        꼬리를 물려 야도란이 되었다.
      en: |-
        When a Slowpoke went hunting in the sea, its tail
        was bitten by a Shellder. That made it evolve
        into Slowbro.
      fr: |-
        Un Kokiyas s’est un jour accroché à la queue d’un
        Ramoloss qui pêchait et l’a fait évoluer en Flagadoss.
      de: |-
        Als Flegmon im Wasser jagen ging, wurde es von
        einem Muschas gebissen. Dadurch entwickelte es sich
        zu Lahmus.
      es: |-
        Según parece, cuando Slowpoke fue a pescar al río,
        le mordió un Shellder en la cola y así se convirtió en
        Slowbro.
      it: |-
        Uno Slowpoke che si trovava in mare in cerca di cibo
        fu morso da uno Shellder, evolvendosi in Slowbro.
    omega-ruby:
      ja-Hrkt: |-
        シェルダーが　かみついて　いるので　しっぽで
        エサを　つれなくなった　ヤドランは　しぶしぶ
        すいちゅうを　およいで　エサを　つかまえている。
      ja: |-
        シェルダーが　かみついて　いるので　尻尾で
        エサを　釣れなくなった　ヤドランは　渋々
        水中を　泳いで　エサを　捕まえている。
      ko: |-
        셀러가 물고 있어서 꼬리로 먹이를
        낚을 수 없게 된 야도란은 마지못해
        물속을 헤엄쳐 먹이를 잡고 있다.
      en: |-
        Slowbro’s tail has a Shellder firmly attached with a bite.
        As a result, the tail can’t be used for fishing anymore.
        This causes Slowbro to grudgingly swim and catch
        prey instead.
      fr: |-
        Flagadoss a un Kokiyas solidement attaché à sa queue.
        Du coup, il ne peut plus l’utiliser pour pêcher. Flagadoss est
        donc obligé, à contrecœur, de nager pour attraper ses proies.
      de: |-
        An Lahmus’ Rute hat sich ein Muschas festgebissen. Daher
        kann es ihn nicht mehr zum Angeln benutzen und es ist dazu
        gezwungen, umherzuschwimmen und nach Beute Ausschau
        zu halten.
      es: |-
        Slowbro lleva en la cola un Shellder enganchado, sujeto por
        los dientes. Como Slowbro no puede usar la cola para pescar,
        se mete en el agua de mala gana en busca de sus presas.
      it: |-
        Slowbro ha uno Shellder saldamente attaccato alla coda,
        che quindi non può più essere usata per pescare.
        Così Slowbro può essere visto nuotare di malavoglia per
        catturare una preda.
    alpha-sapphire:
      ja-Hrkt: |-
        シェルダーが　かみついて　いるので　しっぽで
        エサを　つれなくなった　ヤドランは　しぶしぶ
        すいちゅうを　およいで　エサを　つかまえている。
      ja: |-
        シェルダーが　かみついて　いるので　尻尾で
        エサを　釣れなくなった　ヤドランは　渋々
        水中を　泳いで　エサを　捕まえている。
      ko: |-
        셀러가 물고 있어서 꼬리로 먹이를
        낚을 수 없게 된 야도란은 마지못해
        물속을 헤엄쳐 먹이를 잡고 있다.
      en: |-
        Slowbro’s tail has a Shellder firmly attached with a bite.
        As a result, the tail can’t be used for fishing anymore. This
        causes Slowbro to grudgingly swim and catch prey instead.
      fr: |-
        Flagadoss a un Kokiyas solidement attaché à sa queue.
        Du coup, il ne peut plus l’utiliser pour pêcher. Flagadoss est
        donc obligé, à contrecœur, de nager pour attraper ses proies.
      de: |-
        An Lahmus’ Schweif hat sich ein Muschas festgebissen.
        Daher kann es ihn nicht mehr zum Fischen benutzen und
        ist dazu gezwungen, umherzuschwimmen und Ausschau
        nach Beute zu halten.
      es: |-
        Slowbro lleva en la cola un Shellder enganchado, sujeto por
        los dientes. Como Slowbro no puede usar la cola para pescar,
        se mete en el agua de mala gana en busca de sus presas.
      it: |-
        Slowbro ha uno Shellder saldamente attaccato alla coda,
        che quindi non può più essere usata per pescare.
        Così Slowbro può essere visto nuotare di malavoglia per
        catturare una preda.
    sun:
      ja-Hrkt: |-
        うみを　ながめ　ぼーっと　している。
        シェルダーのどくが　からだに　まわり
        より　ぼんやりするように　なった。
      ja: |-
        海を　眺め　ぼーっと　している。
        シェルダーの毒が　身体に　回り
        より　ぼんやりするように　なった。
      ko: |-
        바다를 바라보며 멍하니 있다.
        셀러의 독이 몸에 퍼져서
        더욱 멍하니 있게 되었다.
      zh-Hant: |-
        呆呆地遠望著大海。
        大舌貝的毒因為在身體中循環，
        變得越來越呆呆笨笨的。
      zh-Hans: |-
        呆呆地望着大海。
        因大舌贝的毒在身体中循环
        而变得越来越傻乎乎。
      en: |-
        It spaces out while gazing at the sea.
        With Shellder’s poison flowing through its body,
        it becomes even spacier.
      fr: |-
        Il aime contempler la mer sans bouger. Le poison
        du Kokiyas répandu dans son organisme a
        encore plus ralenti son métabolisme.
      de: |-
        Es betrachtet oft mit leerem Blick das Meer.
        Das Gift, das Muschas in seinen Körper injiziert,
        erhöht seine Begriffsstutzigkeit noch weiter.
      es: |-
        Contemplar el océano le permite relajarse y
        desconectar. Si el veneno de Shellder circula por
        sus venas, alcanza el culmen de la relajación.
      it: |-
        Contempla il mare con aria assente.
        Il veleno di Shellder che circola nel suo corpo
        lo rende ancora più stordito.
    moon:
      ja-Hrkt: |-
        シェルダーが　つよく　かむたび
        いっしゅん　なにかを　ひらめくが
        あっというまに　わすれてしまう。
      ja: |-
        シェルダーが　強く　噛むたび
        一瞬　なにかを　閃くが
        あっという間に　忘れてしまう。
      ko: |-
        셀러가 세게 물 때마다
        퍼뜩 무언가가 떠오르지만
        순식간에 잊어버린다.
      zh-Hant: |-
        每次大舌貝狠狠咬下去的瞬間
        會有什麼在腦海中閃過，
        但轉瞬之間就全部忘光了。
      zh-Hans: |-
        每次大舌贝狠狠咬下去的瞬间
        会有什么在脑海中闪过，
        但转瞬之间就全部忘光了。
      en: |-
        Whenever Shellder bites down hard on its tail,
        it gives Slowbro a flash of inspiration...which it
        forgets a moment later.
      fr: |-
        Chaque fois que le Kokiyas mord avec force,
        il a soudain une idée de génie, mais il l’oublie
        immédiatement.
      de: |-
        Beißt das Muschas an seinem Schweif beherzt
        zu, hat es eine geniale Idee, die es aber sofort
        wieder vergisst.
      es: |-
        Cada vez que Shellder le muerde la cola, se le
        ocurre una idea brillante, pero la olvida instantes
        después.
      it: |-
        Ogni volta che lo Shellder che ha sulla coda
        lo morde, aguzza l’ingegno e gli viene un’idea
        brillante, ma un attimo dopo l’ha già dimenticata.
    ultra-sun:
      ja-Hrkt: |-
        きほんてきに　ぼんやり　している。
        シッポが　ちぎれて　シェルダーが
        はずれてしまうと　ヤドンに　もどる。
      ja: |-
        基本的に　ぼんやり　している。
        シッポが　ちぎれて　シェルダーが
        外れてしまうと　ヤドンに　戻る。
      ko: |-
        기본적으로 멍하니 있다.
        꼬리가 끊겨 셀러가 떨어지면
        야돈으로 돌아간다.
      zh-Hant: |-
        基本上一直在發呆。
        當尾巴斷掉，大舌貝脫落後
        就會變回呆呆獸。
      zh-Hans: |-
        基本上一直在发呆。
        当尾巴被切断，大舌贝脱落后，
        它就会变回呆呆兽。
      en: |-
        Spacing out is basically all it does. It turns back
        into Slowpoke if its tail, along with Shellder,
        breaks off.
      fr: |-
        Ce Pokémon passe son temps dans l’oisiveté
        la plus totale. Sa queue se détache parfois et il
        perd son Kokiyas, redevenant ainsi un Ramoloss.
      de: |-
        Ein von Grund auf begriffsstutziges Pokémon.
        Verliert es seine Rute mitsamt Muschas,
        entwickelt es sich zu Flegmon zurück.
      es: |-
        Vive en un estado de distracción constante.
        Si el Shellder que tiene en la cola se desprende,
        revierte a su estadio evolutivo anterior.
      it: |-
        Ha sempre un’aria un po’ assente. Se perde la
        coda e lo Shellder che vi è attaccato, si
        trasforma in uno Slowpoke.
    ultra-moon:
      ja-Hrkt: |-
        シッポの　あまみを　もっと　もっと
        すすろうと　よくばった　シェルダーが
        まきがい　じょうに　へんかしたのだ。
      ja: |-
        シッポの　甘みを　もっと　もっと
        すすろうと　欲張った　シェルダーが
        巻き貝状に　変化したのだ。
      ko: |-
        꼬리의 단맛을 더 많이
        마시기 위해 욕심을 낸 셀러가
        고둥 모양으로 변화했다.
      zh-Hant: |-
        為了能夠從尾巴上吸到更多的
        甘美精華，貪吃的大舌貝
        把外殼變化成了螺旋狀。
      zh-Hans: |-
        为了能从其尾巴上吸到
        更多更多的甜味，贪吃的大舌贝
        把外壳变成了螺旋状的样子。
      en: |-
        Shellder, in its greed to suck out more and more
        sweetness from Slowbro’s tail, has
        metamorphosed into a spiral-shaped shell.
      fr: |-
        Un Kokiyas avide s’est accroché à sa queue
        pour en sucer le jus sucré et s’est transformé
        pour prendre une forme en spirale.
      de: |-
        Das Muschas an seiner Rute bekommt von dem
        süßen Geschmack einfach nicht genug und
        mutiert für mehr Biss zu einer Spiralform.
      es: |-
        El Shellder que le muerde la cola para sorber su
        dulce savia ha terminado por transformarse en
        una especie de caracola.
      it: |-
        Lo Shellder che sta attaccato alla sua coda per
        succhiarne avidamente la dolce linfa si è
        trasformato, assumendo una forma a spirale.
    lets-go-pikachu:
      ja-Hrkt: |-
        うみのちかくで　のんびり　くらす。
        もし　シッポの　シェルダーが
        はずれてしまうと　ヤドンにもどる。
      ja: |-
        海の近くで　のんびり　暮らす。
        もし　シッポの　シェルダーが
        外れてしまうと　ヤドンに戻る。
      ko: |-
        바다 근처에서 느긋하게 산다.
        만약 꼬리에 있는 셀러가
        떨어지면 야돈으로 돌아간다.
      zh-Hant: |-
        悠閒地生活在海邊。
        尾巴上的大舌貝如果脫落，
        就會變回呆呆獸。
      zh-Hans: |-
        在海边悠闲地生活。如果
        尾巴上的大舌贝脱落了，
        它就会变回呆呆兽。
      en: |-
        Lives lazily by the sea. If the Shellder on its tail
        comes off, it becomes a Slowpoke again.
      fr: |-
        Il mène une vie tranquille en bord de mer.
        Si le Kokiyas accroché à sa queue s’en va,
        il redevient un Ramoloss.
      de: |-
        Es führt ein ruhiges Leben in der Nähe des
        Meeres. Verliert es das Muschas an seinem
        Schwanz, wird es wieder zu einem Flegmon.
      es: |-
        Lleva una vida tranquila cerca del mar. Si el
        Shellder de la cola se desprende, se convierte
        de nuevo en un Slowpoke.
      it: |-
        Vive tranquillo vicino al mare. Se per caso
        lo Shellder che ha sulla coda si stacca,
        torna ad essere uno Slowpoke.
    lets-go-eevee:
      ja-Hrkt: |-
        うみのちかくで　のんびり　くらす。
        もし　シッポの　シェルダーが
        はずれてしまうと　ヤドンにもどる。
      ja: |-
        海の近くで　のんびり　暮らす。
        もし　シッポの　シェルダーが
        外れてしまうと　ヤドンに戻る。
      ko: |-
        바다 근처에서 느긋하게 산다.
        만약 꼬리에 있는 셀러가
        떨어지면 야돈으로 돌아간다.
      zh-Hant: |-
        悠閒地生活在海邊。
        尾巴上的大舌貝如果脫落，
        就會變回呆呆獸。
      zh-Hans: |-
        在海边悠闲地生活。如果
        尾巴上的大舌贝脱落了，
        它就会变回呆呆兽。
      en: |-
        Lives lazily by the sea. If the Shellder on its tail
        comes off, it becomes a Slowpoke again.
      fr: |-
        Il mène une vie tranquille en bord de mer.
        Si le Kokiyas accroché à sa queue s’en va,
        il redevient un Ramoloss.
      de: |-
        Es führt ein ruhiges Leben in der Nähe des
        Meeres. Verliert es das Muschas an seinem
        Schwanz, wird es wieder zu einem Flegmon.
      es: |-
        Lleva una vida tranquila cerca del mar. Si el
        Shellder de la cola se desprende, se convierte
        de nuevo en un Slowpoke.
      it: |-
        Vive tranquillo vicino al mare. Se per caso
        lo Shellder che ha sulla coda si stacca,
        torna ad essere uno Slowpoke.
    sword:
      ja-Hrkt: |-
        シェルダーに　しっぽを　かまれて
        しんか。　シェルダーは　しっぽから
        にじみでる　あまみに　ゆめごこちだ。
      ja: |-
        シェルダーに　しっぽを　噛まれて
        進化。　シェルダーは　しっぽから
        にじみ出る　甘味に　夢心地だ。
      ko: |-
        셀러에게 꼬리를 물려서 진화했다.
        셀러는 꼬리에서 배어 나오는
        단맛에 황홀한 기분이다.
      zh-Hant: |-
        被大舌貝咬住尾巴而進化。
        大舌貝陶醉在尾巴滲出的
        甜味裡，彷彿置身夢境。
      zh-Hans: |-
        被大舌贝咬住尾巴而
        进化。尾巴里渗出的
        甜味让大舌贝心醉神迷。
      en: |-
        Slowpoke became Slowbro when a Shellder bit
        on to its tail. Sweet flavors seeping from the tail
        make the Shellder feel as if its life is a dream.
      fr: |-
        Il a évolué après qu’un Kokiyas lui a mordu
        la queue. Celle-ci sécrète une substance sucrée
        qui enchante particulièrement les Kokiyas.
      de: |-
        Es entwickelte sich, als ein Muschas in seine Rute
        biss. Das süße Aroma, das aus der Rute strömt,
        hat Muschas in eine Art Trance versetzt.
      es: |-
        Ha evolucionado después de que lo mordiera
        un Shellder, al cual le embelesa la sustancia que
        secreta por la cola.
      it: |-
        Si è evoluto in seguito al morso di uno Shellder.
        Gli Shellder sono inebriati dalla dolce linfa
        secreta dalla coda.
    shield:
      ja-Hrkt: |-
        シェルダーに　かまれた　ショックで
        にそくほこうになった。　シェルダーが
        はなれると　ヤドンに　もどるらしい。
      ja: |-
        シェルダーに　噛まれた　ショックで
        二足歩行になった。　シェルダーが
        離れると　ヤドンに　戻るらしい。
      ko: |-
        셀러에게 물린 충격으로 두 발로
        걸을 수 있게 되었다. 셀러가 떨어지면
        야돈으로 돌아간다고 한다.
      zh-Hant: |-
        被大舌貝狠狠咬下的衝擊讓牠
        變得能用兩腳行走。如果大舌貝
        脫落了，牠似乎就會變回呆呆獸。
      zh-Hans: |-
        因为被大舌贝咬住而受到的刺激使它
        变得能够两足直立行走。当大舌贝
        离开后，它似乎就会变回呆呆兽。
      en: |-
        Being bitten by a Shellder shocked this Pokémon
        into standing on two legs. If the Shellder lets go,
        it seems Slowbro will turn back into a Slowpoke.
      fr: |-
        La morsure du Kokiyas l’a tellement surpris
        qu’il est devenu bipède. Il paraît qu’il redevient
        un Ramoloss si le Kokiyas lâche prise.
      de: |-
        Der Schock, den Muschas’ Biss verursachte,
        ließ es auf zwei Beinen stehen. Löst das Muschas
        sich von ihm, wird es wieder zu einem Flegmon.
      es: |-
        Se volvió bípedo por el impacto que le causó la
        mordedura del Shellder. Si este se desprende,
        vuelve a convertirse en un Slowpoke.
      it: |-
        Ha assunto una postura eretta per lo shock
        causato dal morso di uno Shellder. Pare che torni
        a essere uno Slowpoke se lo Shellder si stacca.
