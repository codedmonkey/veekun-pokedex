garchomp:
  base_happiness: 50
  capture_rate: 45
  color: blue
  egg_groups:
    - monster
    - dragon
  evolution_chain: gible
  evolves_from: gabite
  flavor_text:
    diamond:
      en: |-
        When it folds up its body and
        extends its wings, it looks like a
        jet plane. It flies at sonic speed.
    pearl:
      en: |-
        It flies at speeds equal to a jet
        fighter plane. It never allows its
        prey to escape.
    platinum:
      en: |-
        It is said that when one runs at
        high speed, its wings create blades
        of wind that can fell nearby trees.
    heartgold:
      en: |-
        Its body is covered in fine scales that
        reduce drag, enabling it to fly at
        high speeds.
    soulsilver:
      en: |-
        Its body is covered in fine scales that
        reduce drag, enabling it to fly at
        high speeds.
    black:
      en: |-
        It is said that when one runs at
        high speed, its wings create blades
        of wind that can fell nearby trees.
      fr: |-
        On dit que lancé à pleine vitesse,
        il crée des lames de vent avec ses
        ailes pouvant trancher un arbre.
    white:
      en: |-
        It is said that when one runs at
        high speed, its wings create blades
        of wind that can fell nearby trees.
      fr: |-
        On dit que lancé à pleine vitesse,
        il crée des lames de vent avec ses
        ailes pouvant trancher un arbre.
    black-2:
      en: |-
        It is said that when one runs at
        high speed, its wings create blades
        of wind that can fell nearby trees.
    white-2:
      en: |-
        It is said that when one runs at
        high speed, its wings create blades
        of wind that can fell nearby trees.
    x:
      ja-Hrkt: |-
        からだを　おりたたみ　つばさを
        のばすと　まるで　ジェットき。
        おんそくで　とぶことが　できる。
      ja: |-
        体を　折り畳み　翼を　伸ばすと
        まるで　ジェット機。
        音速で　飛ぶことが　できる。
      ko: |-
        몸을 접고 날개를
        펼치면 마치 제트기 같다.
        음속으로 날 수 있다.
      en: |-
        When it folds up its body and extends its wings,
        it looks like a jet plane. It flies at sonic speed.
      fr: |-
        Quand il se recroqueville et étend ses ailes, on dirait
        un chasseur. Sa vitesse est supersonique.
      de: |-
        Spannt es seinen Körper und seine Flügel, sieht es
        aus wie ein Jet. Es fliegt mit Schallgeschwindigkeit.
      es: |-
        Cuando despliega su cuerpo y sus alas, parece un
        avión a reacción. Vuela a velocidad sónica.
      it: |-
        Quando si piega e distende le ali, sembra un jet.
        Vola a una velocità supersonica.
    'y':
      ja-Hrkt: |-
        ジェットせんとうきに　まけない
        スピードで　そらを　とぶ。
        ねらった　えものは　にがさない。
      ja: |-
        ジェット戦闘機に　負けない
        スピードで　空を　飛ぶ。
        ねらった　獲物は　逃がさない。
      ko: |-
        제트기와 맞먹는
        스피드로 하늘을 난다.
        노린 먹이는 놓치지 않는다.
      en: |-
        It flies at speeds equal to a jet fighter plane.
        It never allows its prey to escape.
      fr: |-
        Il vole à la vitesse d’un avion à réaction et ne lâche
        jamais sa proie.
      de: |-
        Es fliegt mit der Geschwindigkeit eines Kampfjets.
        Es lässt nicht zu, dass ihm seine Beute entkommt.
      es: |-
        Vuela tan rápido como un avión a reacción. Nunca se
        le escapa una presa.
      it: |-
        Vola alla velocità di un aereo da combattimento a
        reazione. Non lascia mai fuggire la preda.
    omega-ruby:
      ja-Hrkt: |-
        からだを　おりたたみ　つばさを
        のばすと　まるで　ジェットき。
        おんそくで　とぶことが　できる。
      ja: |-
        体を　折り畳み　翼を　伸ばすと
        まるで　ジェット機。
        音速で　飛ぶことが　できる。
      ko: |-
        몸을 접고 날개를
        펼치면 마치 제트기 같다.
        음속으로 날 수 있다.
      en: |-
        When it folds up its body and extends its wings,
        it looks like a jet plane. It flies at sonic speed.
      fr: |-
        Quand il se recroqueville et étend ses ailes, on dirait
        un chasseur. Sa vitesse est supersonique.
      de: |-
        Spannt es seinen Körper und seine Flügel, sieht es aus wie
        ein Jet. Es fliegt mit Schallgeschwindigkeit.
      es: |-
        Cuando despliega su cuerpo y sus alas, parece un avión a
        reacción. Vuela a velocidad sónica.
      it: |-
        Quando si piega e distende le ali, sembra un jet. Vola a una
        velocità supersonica.
    alpha-sapphire:
      ja-Hrkt: |-
        ジェットせんとうきに　まけない
        スピードで　そらを　とぶ。
        ねらった　えものは　にがさない。
      ja: |-
        ジェット戦闘機に　負けない
        スピードで　空を　飛ぶ。
        ねらった　獲物は　逃がさない。
      ko: |-
        제트기와 맞먹는
        스피드로 하늘을 난다.
        노린 먹이는 놓치지 않는다.
      en: |-
        It flies at speeds equal to a jet fighter plane.
        It never allows its prey to escape.
      fr: |-
        Il vole à la vitesse d’un avion à réaction et ne lâche jamais
        sa proie.
      de: |-
        Es fliegt mit der Geschwindigkeit eines Kampfjets. Es lässt
        nicht zu, dass ihm seine Beute entkommt.
      es: |-
        Vuela tan rápido como un avión a reacción. Nunca se le
        escapa una presa.
      it: |-
        Vola alla velocità di un aereo da combattimento a reazione.
        Non lascia mai fuggire la preda.
    sun:
      ja-Hrkt: |-
        ジェットき　なみの　こうそくで　とぶ。
        とりポケモンの　むれに　つっこむと
        そのまま　むれごと　まるのみだ。
      ja: |-
        ジェット機　並の　高速で　飛ぶ。
        とりポケモンの　群れに　突っ込むと
        そのまま　群れごと　丸呑みだ。
      ko: |-
        제트기만큼 빠른 속도로 난다.
        새포켓몬 무리에 돌진하여
        그대로 무리째 삼켜버린다.
      zh-Hant: |-
        以媲美噴射機的速度高速飛行。
        如果衝入鳥寶可夢的群體中，
        會就直接把整個群體都吞掉。
      zh-Hans: |-
        以媲美喷气式飞机的高速来飞行。
        如果冲入鸟宝可梦的群体中，
        会就这么把整个群体都吞掉。
      en: |-
        It can fly at speeds rivaling jet planes.
        It dives into flocks of bird Pokémon and
        gulps the entire flock down whole.
      fr: |-
        Il vole aussi vite qu’un avion à réaction. Si en vol
        il croise une nuée de Pokémon oiseaux, il les
        avale d’une seule bouchée.
      de: |-
        Es fliegt mit der Geschwindigkeit eines Jets.
        Wenn es sich auf einen Schwarm Vogel-Pokémon
        stürzt, schlingt es ihn im Ganzen hinunter.
      es: |-
        Vuela tan rápido como un avión a reacción.
        Embiste a bandadas de Pokémon pájaro y, si
        atrapa a alguno, se lo traga de un bocado.
      it: |-
        Vola alla velocità di un jet. Caccia attaccando
        i Pokémon alati, di cui può divorare interi stormi.
    moon:
      ja-Hrkt: |-
        あたまに　ついた　２つの　とっきは
        センサーの　やくめ。　はるか　さきの
        えものの　ようすも　わかる。
      ja: |-
        頭に　ついた　２つの　突起は
        センサーの　役目。　遥か　先の
        獲物の　様子も　わかる。
      ko: |-
        머리에 달린 2개의 돌기는
        센서 역할을 한다. 저 멀리 있는
        먹이의 모습도 알 수 있다.
      zh-Hant: |-
        頭上長著的２個突起物
        是作為感應器的用途。
        就連遠處獵物的狀況也能察覺。
      zh-Hans: |-
        头上长着的２个突起物
        是起感应器作用的。
        前方很远处猎物的样子也能知道。
      en: |-
        The protuberances on its head serve as
        sensors. It can even detect distant prey.
      fr: |-
        Les deux protubérances qu’il a sur la tête lui
        servent de capteurs. Il peut ainsi détecter les
        mouvements de proies très éloignées.
      de: |-
        Die beiden Fortsätze an seinem Kopf haben
        die Funktion eines Sensors. Mit ihnen kann
        es auch weit entfernte Beute aufspüren.
      es: |-
        Las dos protuberancias que tiene en la cabeza
        le sirven de sensores. Puede rastrear presas
        que se encuentren a gran distancia.
      it: |-
        Le protuberanze che ha ai lati della testa hanno
        funzione di sensori e percepiscono le prede
        anche a grande distanza.
    ultra-sun:
      ja-Hrkt: |-
        おんそくで　とび　えものを　さがす。
        エサを　めぐり　ボーマンダと
        くうちゅうせんを　くりひろげる。
      ja: |-
        音速で　飛び　獲物を　探す。
        エサを　巡り　ボーマンダと
        空中戦を　繰り広げる。
      ko: |-
        음속으로 날아다니며 먹이를 찾는다.
        먹이를 두고 보만다와
        공중전을 펼친다.
      zh-Hant: |-
        以音速飛行來尋找獵物。
        會為了爭奪食物而與
        暴飛龍展開空中戰鬥。
      zh-Hans: |-
        以音速飞行，寻找猎物。
        围绕着食物的问题，
        和暴飞龙展开空中战。
      en: |-
        It flies at the speed of sound while searching
        for prey, and it has midair battles with
        Salamence as the two compete for food.
      fr: |-
        Il vole à la vitesse du son en quête de nourriture.
        Drattak et lui se disputent souvent leurs proies
        dans des combats aériens impressionnants.
      de: |-
        Es geht mit Schallgeschwindigkeit fliegend auf
        die Jagd und leistet sich mit Brutalanda
        Luftkämpfe um das Vorrecht auf die Beute.
      es: |-
        Surca el aire a velocidad supersónica en busca
        de presas y no duda en librar una batalla aérea
        con un Salamence para quedarse con ellas.
      it: |-
        Caccia le prede volando a velocità supersonica.
        Le lotte aeree con Salamence per contendersi
        il cibo sono all’ordine del giorno.
    ultra-moon:
      ja-Hrkt: |-
        きめこまかく　とがった　ウロコは
        くうきていこうを　へらすだけでなく
        おそってきた　あいてを　きずつけるぞ。
      ja: |-
        きめ細かく　尖った　ウロコは
        空気抵抗を　減らすだけでなく
        襲ってきた　相手を　傷つけるぞ。
      ko: |-
        매끄럽고 뾰족한 비늘은
        공기 저항을 줄일 뿐만 아니라
        습격해 온 상대를 상처 입힌다.
      zh-Hant: |-
        細小而尖銳的鱗片
        不僅能夠減少空氣阻力，
        還能令來襲的敵人受傷。
      zh-Hans: |-
        细小又尖锐的鳞片，
        不但可以减少空气的阻力，
        还能使来袭击的对手受伤。
      en: |-
        Its fine scales don’t just reduce wind
        resistance—their sharp edges also cause injury
        to any opponent who attacks it.
      fr: |-
        En plus de maximiser son aérodynamisme,
        ses écailles lisses et pointues ont l’avantage
        de blesser ses ennemis quand ils l’attaquent.
      de: |-
        Mit seinen feinporigen Schuppen kann es nicht
        nur den Luftwiderstand verringern, sondern
        auch nahende Angreifer verletzen.
      es: |-
        Sus escamas, pequeñas, lisas y afiladas, no solo
        lo hacen más aerodinámico, sino que le sirven
        para herir al rival que ose atacarlo.
      it: |-
        Le sue scaglie finissime e aguzze riducono
        l’attrito con l’aria e gli permettono allo stesso
        tempo di danneggiare i nemici che lo attaccano.
    sword:
      ja-Hrkt: |-
        かざんせいの　やまに　すみつく。
        ジェットきに　まけない　はやさで
        そらを　とび　えものを　かりまくる。
      ja: |-
        火山性の　山に　すみつく。
        ジェット機に　負けない　速さで
        空を　飛び　獲物を　狩りまくる。
      ko: |-
        화산이 있는 산에 서식한다.
        제트기에도 지지 않는 속도로
        하늘을 날아 먹이를 사냥한다.
      zh-Hant: |-
        棲息在火山區的山中。會以
        不遜於噴射戰鬥機的速度在
        天空飛行，盡情地獵取獵物。
      zh-Hans: |-
        在火山区的山上栖息。
        会以不输给喷气式飞机的
        速度飞到天空中寻找猎物。
      en: |-
        Garchomp makes its home in volcanic mountains.
        It flies through the sky as fast as a jet airplane,
        hunting down as much prey as it can.
      fr: |-
        Vivant dans les massifs volcaniques, ce Pokémon
        chasse ses proies dans le ciel en volant aussi vite
        qu’un avion à réaction.
      de: |-
        Knackrack lebt in vulkanischen Gebirgen. Es fliegt
        so schnell wie ein Jet durch die Lüfte und macht
        dabei unentwegt Jagd auf Beute.
      es: |-
        Habita en montañas de origen volcánico. Vuela
        tan rápido como un avión a reacción en busca de
        presas.
      it: |-
        Vive in montagne di origine vulcanica. Caccia
        le prede solcando i cieli alla velocità di un jet.
    shield:
      ja-Hrkt: |-
        ちじょうでも　うごきは　すばやく
        ゆきやまで　からだが　ひえきるまえに
        えものを　しとめ　すみかに　もどる。
      ja: |-
        地上でも　動きは　素早く
        雪山で　体が　冷えきるまえに
        獲物を　しとめ　すみかに　戻る。
      ko: |-
        지상에서도 움직임이 빠르다.
        설산에서는 체온이 떨어지기 전에
        먹이를 잡아 거처로 돌아간다.
      zh-Hant: |-
        在陸地上也能迅速行動。
        會在身體被寒冷的雪山凍僵
        之前了結獵物並返回住處。
      zh-Hans: |-
        身手在陆地上也很矫捷，
        在雪山上会赶在身体冻僵前
        干掉猎物并返回住处。
      en: |-
        Garchomp is fast both underground and above.
        It can bring down prey and return to its den
        before its body has chilled from being outside.
      fr: |-
        Ce Pokémon très rapide même au sol capture
        ses proies sur les monts enneigés et rentre vite
        dans son antre avant que son corps ne gèle.
      de: |-
        Auch am Boden bewegt es sich schnell. Es kann
        im verschneiten Gebirge Beute erlegen und in
        sein Nest bringen, bevor sein Körper auskühlt.
      es: |-
        Se mueve a gran velocidad incluso por tierra. Es
        capaz de cazar una presa en una montaña nevada
        y volver a su guarida sin llegar a pasar frío.
      it: |-
        È veloce anche a terra. È in grado di abbattere
        le prede tra le montagne innevate e tornare
        nella sua tana prima di congelarsi.
