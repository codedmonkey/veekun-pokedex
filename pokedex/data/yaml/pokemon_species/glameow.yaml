    white-2:
      en: |-
        It hides its spiteful tendency of
        hooking its claws into the nose of
        its Trainer if it isn’t fed.
    x:
      ja-Hrkt: |-
        きにいらないと　ツメを　たてるが
        たまに　のどを　ならして　あまえる
        せいかくが　いちぶに　だいにんきだ。
      ja: |-
        気に入らないと　ツメを　立てるが
        たまに　のどを　鳴らして
        甘える　性格が　一部に　大人気だ。
      ko: |-
        마음에 안 들면 발톱을 세우지만
        가끔 울음소리로 응석을 부리는
        성격이 일부에게 매우 인기가 있다.
      en: |-
        It claws if displeased and purrs when affectionate.
        Its fickleness is very popular among some.
      fr: |-
        Il griffe quand il est en colère et ronronne quand
        il est heureux. Certains aiment ce côté lunatique.
      de: |-
        Es schlägt mit Krallen zu oder schnurrt,
        je nachdem, ob es gerade wütend oder zutraulich ist.
      es: |-
        Araña cuando está enfadado y ronronea cuando está
        cariñoso. Su imprevisibilidad es famosa.
      it: |-
        Se disturbato, tira fuori gli artigli; se soddisfatto,
        fa le fusa. La sua incostanza piace a molti.
    'y':
      ja-Hrkt: |-
        ごきげんな　ニャルマーは　しっぽで
        しんたいそうの　リボンの　ような
        うつくしい　うごきを　みせる。
      ja: |-
        ご機嫌な　ニャルマーは　尻尾で
        新体操の　リボンのような
        美しい　動きを　見せる。
      ko: |-
        기분이 좋은 나옹마는 꼬리로
        리듬 체조의 리본처럼
        아름다운 움직임을 보인다.
      en: |-
        When it’s happy, Glameow demonstrates beautiful
        movements of its tail, like a dancing ribbon.
      fr: |-
        Lorsqu’il est heureux, sa queue décrit des arabesques
        comme un ruban de gymnastique rythmique.
      de: |-
        Je nach Laune lässt es seinen Schweif anmutig
        wirbeln, ganz wie das Band eines Sportgymnasten.
      es: |-
        Dependiendo de su humor, mueve grácilmente su
        cola, que se asemeja a un lazo de gimnasia rítmica.
      it: |-
        Il lunatico Glameow fa sinuosi movimenti di coda
        che ricordano i nastri della ginnastica artistica.
    omega-ruby:
      ja-Hrkt: |-
        きにいらないと　ツメを　たてるが
        たまに　のどを　ならして　あまえる
        せいかくが　いちぶに　だいにんきだ。
      ja: |-
