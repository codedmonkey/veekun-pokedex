      de: |-
        Es schlägt mit Krallen zu oder schnurrt, je nachdem,
        ob es gerade wütend oder zutraulich ist.
      es: |-
        Araña cuando está enfadado y ronronea cuando está cariñoso.
        Su imprevisibilidad es famosa.
      it: |-
        Se disturbato, tira fuori gli artigli; se soddisfatto, fa le fusa.
        La sua incostanza piace a molti.
