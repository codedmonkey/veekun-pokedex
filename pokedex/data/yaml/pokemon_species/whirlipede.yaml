whirlipede:
  base_happiness: 50
  capture_rate: 120
  color: gray
  egg_groups:
    - bug
  evolution_chain: venipede
  evolves_from: venipede
  flavor_text:
    black:
      en: |-
        Protected by a hard shell, it spins
        its body like a wheel and crashes
        furiously into its enemies.
      fr: |-
        Protégé par sa solide carapace,
        il fonce sur ses ennemis en
        roulant comme un pneu.
    white:
      en: |-
        It is usually motionless, but when
        attacked, it rotates at high speed and
        then crashes into its opponent.
      fr: |-
        En général, il reste immobile. Mais quand
        on l’attaque, il se met à tourbillonner
        à toute vitesse et fonce sur l’ennemi.
    black-2:
      en: |-
        Storing energy for evolution, it sits.
        But, when predators approach, it
        moves to stab them with poison spikes.
    white-2:
      en: |-
        Storing energy for evolution, it sits.
        But, when predators approach, it
        moves to stab them with poison spikes.
    x:
      ja-Hrkt: |-
        かたい　カラに　まもられている。
        タイヤのように　かいてんして
        てきに　はげしく　たいあたりする。
      ja: |-
        硬い　殻に　守られている。
        タイヤのように　回転して
        敵に　激しく　体当たりする。
      ko: |-
        단단한 껍질로 보호되고 있다.
        타이어처럼 회전하여 상대에게
        격렬히 몸통박치기를 날린다.
      en: |-
        Protected by a hard shell, it spins its body like a
        wheel and crashes furiously into its enemies.
      fr: |-
        Protégé par sa solide carapace, il fonce sur ses
        ennemis en roulant comme un pneu.
      de: |-
        Von einem harten Schutzpanzer umgeben. Es greift
        seine Gegner an, indem es mit Karacho wie ein Rad
        in sie hineinrollt.
      es: |-
        Lo protege un duro caparazón. Gira como una rueda y
        realiza brutales placajes contra sus enemigos.
      it: |-
        È protetto da un guscio resistente. Si scaglia contro
        il nemico rotolando come uno pneumatico.
    'y':
      ja-Hrkt: |-
        ふだんは　うごかないが　おそわれると
        こうそく　かいてんして　はしりまわり
        たいあたりで　はんげきするのだ。
      ja: |-
        普段は　動かないが
        襲われると　高速　回転して　走り回り
        体当たりで　反撃するのだ。
      ko: |-
        평소에는 움직이지 않지만 공격당하면
        고속 회전하여 뛰어다니다가
        몸통박치기로 반격한다.
      en: |-
        It is usually motionless, but when attacked,
        it rotates at high speed and then crashes into
        its opponent.
      fr: |-
        En général, il reste immobile. Mais quand on l’attaque,
        il se met à tourbillonner à toute vitesse et fonce sur
        l’ennemi.
      de: |-
        An sich ist es harmlos. Bringt man es jedoch
        in Bedrängnis, setzt es sich mit blitzschnellen
        Rollattacken zur Wehr.
      es: |-
        Normalmente no se mueve, pero se pone a rodar
        frenéticamente y contraataca con placajes si lo atacan.
      it: |-
        Di solito non si muove, ma se viene attaccato,
        comincia a turbinare su se stesso e si scaglia contro
        il nemico.
    omega-ruby:
      ja-Hrkt: |-
        かたい　カラに　まもられている。
        タイヤのように　かいてんして
        てきに　はげしく　たいあたりする。
      ja: |-
        硬い　殻に　守られている。
        タイヤのように　回転して
        敵に　激しく　体当たりする。
      ko: |-
        단단한 껍질로 보호되고 있다.
        타이어처럼 회전하여 상대에게
        격렬히 몸통박치기를 날린다.
      en: |-
        Protected by a hard shell, it spins its body like a
        wheel and crashes furiously into its enemies.
      fr: |-
        Protégé par sa solide carapace, il fonce sur ses ennemis
        en roulant comme un pneu.
      de: |-
        Von einem harten Schutzpanzer umgeben. Es greift seine
        Gegner an, indem es mit Karacho wie ein Rad in sie hineinrollt.
      es: |-
        Lo protege un duro caparazón. Gira como una rueda y realiza
        brutales placajes contra sus enemigos.
      it: |-
        È protetto da un guscio resistente. Si scaglia contro il nemico
        rotolando come uno pneumatico.
    alpha-sapphire:
      ja-Hrkt: |-
        ふだんは　うごかないが　おそわれると
        こうそく　かいてんして　はしりまわり
        たいあたりで　はんげきするのだ。
      ja: |-
        普段は　動かないが
        襲われると　高速　回転して　走り回り
        体当たりで　反撃するのだ。
      ko: |-
        평소에는 움직이지 않지만 공격당하면
        고속 회전하여 뛰어다니다가
        몸통박치기로 반격한다.
      en: |-
        It is usually motionless, but when attacked,
        it rotates at high speed and then crashes into
        its opponent.
      fr: |-
        En général, il reste immobile. Mais quand on l’attaque,
        il se met à tourbillonner à toute vitesse et fonce sur l’ennemi.
      de: |-
        An sich ist es harmlos. Bringt man es jedoch in Bedrängnis,
        setzt es sich mit blitzschnellen Rollattacken zur Wehr.
      es: |-
        Normalmente no se mueve, pero se pone a rodar
        frenéticamente y contraataca con placajes si lo atacan.
      it: |-
        Di solito non si muove, ma se viene attaccato, comincia a
        turbinare su se stesso e si scaglia contro il nemico.
    sword:
      ja-Hrkt: |-
        こうそくで　かいてんし　あいてに
        とつげき。　さいこうじそくは
        およそ　１００キロに　たっする。
      ja: |-
        高速で　回転し　相手に　突撃。
        最高時速は
        およそ　１００キロに　達する。
      ko: |-
        고속으로 회전해 상대에게
        돌격한다. 최고 시속은
        약 100km에 달한다.
      zh-Hant: |-
        會高速旋轉去突擊對手。
        牠的最高時速可以達到
        大約１００公里。
      zh-Hans: |-
        高速旋转突击对方。
        最高时速可以达到
        １００公里左右。
      en: |-
        This Pokémon spins itself rapidly and charges into
        its opponents. Its top speed is just over 60 mph.
      fr: |-
        Il se propulse sur ses ennemis en tournant
        très vite sur lui-même. Il peut ainsi atteindre
        une vitesse d’environ 100 km/h.
      de: |-
        Rollum dreht sich mit hoher Geschwindigkeit
        und rammt seine Gegner. Dabei erreicht es
        Geschwindigkeiten von bis zu 100 km/h.
      es: |-
        Gira a gran velocidad y carga contra sus rivales.
        Puede alcanzar los 100 km/h.
      it: |-
        Attacca l’avversario turbinando rapidamente
        su se stesso. Può raggiungere una velocità
        di circa 100 km/h.
    shield:
      ja-Hrkt: |-
        かたいカラと　どくのトゲで　みを
        まもり　しんかに　ひつような
        エネルギーを　ためているのだ。
      ja: |-
        硬い殻と　毒のトゲで　身を
        守り　進化に　必要な
        エネルギーを　溜めているのだ。
      ko: |-
        단단한 껍질과 독가시로
        몸을 보호하면서 진화에 필요한
        에너지를 비축하고 있다.
      zh-Hant: |-
        用堅硬的殼和有毒的刺
        保護自己，同時累積
        進化所需的能量。
      zh-Hans: |-
        用坚硬的壳和带毒的刺
        保护自己的身体，
        积蓄进化所需的能量。
      en: |-
        Whirlipede protects itself with a sturdy shell and
        poisonous spikes while it stores up the energy it’ll
        need for evolution.
      fr: |-
        Il se protège avec sa solide carapace et ses épines
        empoisonnées tandis qu’il rassemble l’énergie
        nécessaire à son évolution.
      de: |-
        Es schützt sich mit seinem harten Panzer und den
        Giftspitzen, um ungestört genügend Energie für
        seine Entwicklung zu sammeln.
      es: |-
        Se defiende con su duro caparazón y sus
        púas venenosas mientras acumula la energía
        necesaria para evolucionar.
      it: |-
        Mentre accumula l’energia necessaria per
        evolversi, si difende con il guscio resistente
        e le spine velenose.
