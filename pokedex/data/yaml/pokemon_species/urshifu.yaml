urshifu:
  base_happiness: 50
  capture_rate: 3
  color: gray
  egg_groups:
    - no-eggs
  evolution_chain: kubfu
  evolves_from: kubfu
  flavor_text:
    sword:
      ja-Hrkt: |-
        いちげきひっさつが　しんじょう。
        あいての　ふところに　とびこみ
        きたえられた　こぶしを　たたきこむ。
      ja: |-
        一撃必殺が　信条。
        相手の　懐に　飛びこみ
        鍛えられた　拳を　叩きこむ。
      ko: |-
        일격필살이 신조다.
        상대의 품으로 파고들어
        단련된 주먹을 질러 넣는다.
      zh-Hant: |-
        一擊必殺是牠的信念。
        會衝進對手的懷裡，不留情地
        用千錘百煉的拳頭給予一擊。
      zh-Hans: |-
        一击必杀是它的信条。
        飞冲到对方的怀中，用自己
        经过千锤百炼的拳头一拳击入。
      en: |-
        This form of Urshifu is a strong believer in the
        one-hit KO. Its strategy is to leap in close to foes
        and land a devastating blow with a hardened fist.
      fr: |-
        Adepte des techniques pouvant mettre K.O.
        en un seul coup, il se jette sur son adversaire
        et le frappe de son poing robuste.
      de: |-
        Es ist darauf spezialisiert, Gegner mit nur einem
        Treffer zu bezwingen, indem es sie schlagartig
        anfällt und einen fokussierten Hieb austeilt.
      es: |-
        Su estilo de lucha se basa en abatir a sus rivales
        de un solo golpe. Se abalanza sobre ellos con su
        puño cincelado por el entrenamiento.
      it: |-
        Il suo credo è sconfiggere l’avversario con un
        colpo solo. Si lancia sul nemico e lo colpisce con
        un pugno potenziato al massimo dall’allenamento.
    shield:
      ja-Hrkt: |-
        とおい　ちほうの　さんがくちたいで
        くらす。　だんがいぜっぺきを　はしり
        あしこしを　きたえ　わざを　みがく。
      ja: |-
        遠い　地方の　山岳地帯で
        暮らす。　断崖絶壁を　走り
        足腰を　鍛え　技を　磨く。
      ko: |-
        먼 지방의 산악지대에 산다.
        낭떠러지 절벽을 달리며
        하체를 단련하고 기술을 연마한다.
      zh-Hant: |-
        棲息在遙遠地區的山岳地帶。
        會在斷崖絕壁上來回奔跑
        鍛鍊下盤，磨練招式。
      zh-Hans: |-
        生活在遥远地区的山岳地带。
        通过在断崖绝壁上奔跑
        来锻炼腰腿，磨炼招式。
      en: |-
        Inhabiting the mountains of a distant region, this
        Pokémon races across sheer cliffs, training its legs
        and refining its moves.
      fr: |-
        Il vit dans une lointaine région montagneuse où
        il peaufine ses techniques et muscle ses jambes
        en courant le long des falaises abruptes.
      de: |-
        Wulaosu lebt in den Bergen einer fernen Region.
        Um die Beine zu stählen und seine Kampftechnik
        zu verbessern, rennt es steile Klippen entlang.
      es: |-
        Vive en zonas montañosas en áreas recónditas,
        donde entrena corriendo por escarpados riscos
        para fortalecer sus piernas y refinar su técnica.
      it: |-
        Vive nelle zone montuose di una regione lontana.
        Corre sulle pareti dei dirupi, allenando gli arti
        inferiori e perfezionando le sue mosse.
