    x:
      ja-Hrkt: |-
        せなかの　カラは　くずれやすいが
        ときどき　たいないを　めぐっている
        こうねつの　ほのおが　ふきだす。
      ja: |-
        背中の　殻は　崩れやすいが
        ときどき　体内を　巡っている
        高熱の　炎が　噴き出す。
      ko: |-
        등껍질은 깨어지기 쉬우며
        가끔 체내를 순환하고 있는
        고열의 불꽃을 뿜어낸다.
      en: |-
        Its brittle shell occasionally spouts intense flames
        that circulate throughout its body.
      fr: |-
        Sa coquille, très fragile, projette régulièrement
        des flammes qui circulent dans son corps.
      de: |-
        Aus seinem porösen Schneckengehäuse sprudeln
        Feuerfontänen, die seinen Körper durchfluten.
      es: |-
        En ocasiones, su resbaladiza concha lanza intensas
        llamaradas que recorren todo su cuerpo.
      it: |-
        A volte intense fiamme partono dal fragile guscio e
        avvolgono tutto il suo corpo.
    'y':
      ja-Hrkt: |-
        からだは　いつも　なみうっていて
        ようがんのように　あつい。
        ときどき　カラから　ひのこがもれる。
      ja: |-
        体は　いつも　波打っていて
        溶岩のように　熱い。
        ときどき　殻から　火の粉が漏れる。
      ko: |-
        몸이 항상 일렁이고 있으며
        용암처럼 뜨겁다.
        때때로 껍데기에서 불티가 샌다.
      en: |-
        Its body is as hot as lava and is always billowing.
        Flames will occasionally burst from its shell.
      fr: |-
        Son corps en ébullition est aussi chaud que de la
        lave. Des flammes sortent de sa coquille.
      de: |-
        Sein Körper ist heißer als Lava und wogt stets.
        Manchmal schießen Flammen aus seinem Haus.
      es: |-
        Tiene un cuerpo que no deja de hincharse y tan
        caliente como la lava. La concha suelta llamas.
      it: |-
        Il corpo caldo come lava è sempre in ebollizione.
        A volte si vedono fiammate uscire dal guscio.
    omega-ruby:
      ja-Hrkt: |-
        カラは　ひふが　ひえて　かたまった　もの。
        さわった　だけで　ボロボロと　くずれて　しまう。
        マグマに　はいると　もとの　おおきさに　もどる。
      ja: |-
        カラは　皮膚が　冷えて　固まった　もの。
        触った　だけで　ボロボロと　崩れて　しまう。
        マグマに　入ると　元の　大きさに　戻る。
      ko: |-
        껍질은 피부가 식어 굳어진 것이다.
        만지기만 해도 산산이 부서져 버린다.
        마그마에 들어가면 원래 크기로 돌아온다.
      en: |-
        Magcargo’s shell is actually its skin that hardened as a result
        of cooling. Its shell is very brittle and fragile—just touching it
        causes it to crumble apart. This Pokémon returns to its original
        size by dipping itself in magma.
      fr: |-
        La carapace de Volcaropod est en fait constituée de sa peau,
        qui s’est durcie après un refroidissement. Elle est très cassante
        et fragile. Il suffit de la toucher pour qu’elle casse. Il reprend
        sa forme en plongeant dans le magma.
      de: |-
        Magcargos Schale ist eigentlich seine Haut, die erhärtet
        ist, als es auskühlte. Seine Schale ist sehr spröde und
        zerbrechlich. Schon bei einer leichten Berührung bricht sie
        auseinander. Dann muss es ein Bad in Magma nehmen.
      es: |-
        La coraza de Magcargo es en realidad su propia piel que
        quedó endurecida al enfriarse. Está muy resquebrajada y es
        muy frágil; se desharía solo con tocarla. Este Pokémon debe
        sumergirse en magma para recuperar su forma.
      it: |-
        La corazza di Magcargo è formata dalla sua pelle induritasi
        per effetto del raffreddamento. La corazza è fragile e friabile:
        cade a pezzi al minimo contatto. Riacquista le sue dimensioni
        normali immergendosi nel magma.
    alpha-sapphire:
      ja-Hrkt: |-
        たいおんが　やく１まんども　あるので　あまつぶに
        うたれると　じょうきが　もうもうと　たちこめて
        あたりは　ふかい　きりに　おおわれると　いう。
      ja: |-
        体温が　約１万度も　あるので　雨粒に
        打たれると　蒸気が　もうもうと　立ち込めて
        あたりは　深い　霧に　覆われると　いう。
      ko: |-
        체온이 약 1만 도나 돼서 빗방울이
        몸에 닿으면 수증기가 자욱하게 피어나
        주변이 깊은 안개에 둘러싸인다고 한다.
      en: |-
        Magcargo’s body temperature is approximately
        18,000 degrees Fahrenheit. Water is vaporized on contact.
        If this Pokémon is caught in the rain, the raindrops instantly
        turn into steam, cloaking the area in a thick fog.
      fr: |-
        La température de Volcaropod est d’environ 10 000 °C.
        L’eau s’évapore à son contact. Si ce Pokémon se retrouve
        sous la pluie, les gouttes d’eau forment de la vapeur et
        couvrent la zone de brouillard.
      de: |-
        Magcargos Körpertemperatur liegt bei etwa 10 000 °C.
        Dieses Pokémon bringt Wasser sofort zum Verdampfen.
        Wenn dieses Pokémon im Regen steht, werden die Tropfen
        augenblicklich zu Dampf und es entsteht dichter Nebel.
      es: |-
        Magcargo tiene una temperatura corporal de 1000 °C
        aproximadamente. El agua se evapora al contacto con él.
        Si llueve, las gotas que le rozan se transforman en vapor al
        instante y crean una densa niebla.
      it: |-
        La temperatura corporea di Magcargo si aggira attorno
        ai 10.000 °C. A contatto col suo corpo l’acqua diventa vapore
        all’istante. In caso di pioggia la zona circostante è invasa da
        una fitta nebbia.
