axew:
  base_happiness: 35
  capture_rate: 75
  color: green
  egg_groups:
    - monster
    - dragon
  evolution_chain: axew
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        They use their tusks to crush the
        berries they eat. Repeated regrowth
        makes their tusks strong and sharp.
      fr: |-
        Il broie les Baies à grands coups de
        crocs. Ceux-ci repoussent plusieurs
        fois, toujours plus forts et aiguisés.
    white:
      en: |-
        They mark their territory by leaving
        gashes in trees with their tusks. If a
        tusk breaks, a new one grows in quickly.
      fr: |-
        Il laisse la marque de ses crocs dans les
        arbres pour marquer son territoire. Ses
        crocs repoussent dès qu’ils tombent.
    black-2:
      en: |-
        Its large tusks have a tendency to
        break, but each time they grow back,
        they grow in harder and sturdier.
    white-2:
      en: |-
        Its large tusks have a tendency to
        break, but each time they grow back,
        they grow in harder and sturdier.
    x:
      ja-Hrkt: |-
        きのみを　キバで　くだいて　たべる。
        なんかいも　はえかわることで
        つよく　するどい　キバに　なる。
      ja: |-
        木の実を　キバで　砕いて　食べる。
        何回も　生え変わることで
        強く　鋭い　キバに　なる。
      ko: |-
        나무열매를 이빨로 깨물어 먹는다.
        이빨이 몇 차례에 걸쳐 새로 나면
        강하고 날카로워진다
      en: |-
        They use their tusks to crush the berries they eat.
        Repeated regrowth makes their tusks strong
        and sharp.
      fr: |-
        Il broie les Baies à grands coups de crocs.
        Ceux-ci repoussent plusieurs fois, toujours plus forts
        et aiguisés.
      de: |-
        Es knackt mit seinen Hauern Nüsse.
        Brechen seine Fangzähne ab, wächst
        an ihrer Stelle ein stärkeres Ersatzpaar.
      es: |-
        Usa sus colmillos para romper las bayas que come.
        Estos se regeneran una y otra vez, por eso son tan
        fuertes y afilados.
      it: |-
        Mangia le bacche sminuzzandole con i denti, che
        ricrescono costantemente, diventando sempre più
        forti e affilati.
    'y':
      ja-Hrkt: |-
        キバで　じゅもくに　きずを　つけて
        なわばりの　めじるしにする。
        キバは　おれても　すぐに　はえる。
      ja: |-
        キバで　樹木に　傷を　つけて
        縄張りの　目印にする。
        キバは　折れても　すぐに　生える。
      ko: |-
        이빨로 수목에 상처를 내서
        영역 표시를 한다.
        부러지면 바로 새 이빨이 난다.
      en: |-
        They mark their territory by leaving gashes in trees
        with their tusks. If a tusk breaks, a new one grows
        in quickly.
      fr: |-
        Il laisse la marque de ses crocs dans les arbres pour
        marquer son territoire. Ses crocs repoussent dès
        qu’ils tombent.
      de: |-
        Markiert sein Revier, indem es mit seinen Fängen
        Kerben in Bäume schlägt. Brechen diese einmal ab,
        wachsen sie sofort nach.
      es: |-
        Deja la huella de sus colmillos en los árboles para
        marcar su territorio. Si se le rompen, se regeneran
        muy rápido.
      it: |-
        Incide gli alberi con le zanne per marcare il suo
        territorio. Se le zanne gli si spezzano, ricrescono
        subito.
    omega-ruby:
      ja-Hrkt: |-
        きのみを　キバで　くだいて　たべる。
        なんかいも　はえかわることで
        つよく　するどい　キバに　なる。
      ja: |-
        木の実を　キバで　砕いて　食べる。
        何回も　生え変わることで
        強く　鋭い　キバに　なる。
      ko: |-
        나무열매를 이빨로 깨물어 먹는다.
        이빨이 몇 차례에 걸쳐 새로 나면
        강하고 날카로워진다.
      en: |-
        They use their tusks to crush the berries they eat.
        Repeated regrowth makes their tusks strong
        and sharp.
      fr: |-
        Il broie les Baies à grands coups de crocs. Ceux-ci repoussent
        plusieurs fois, toujours plus forts et aiguisés.
      de: |-
        Es knackt mit seinen Hauern Nüsse. Brechen seine Fangzähne
        ab, wächst an ihrer Stelle ein stärkeres Ersatzpaar.
      es: |-
        Usa sus colmillos para romper las bayas que come. Estos se
        regeneran una y otra vez, por eso son tan fuertes y afilados.
      it: |-
        Mangia le bacche sminuzzandole con i denti, che ricrescono
        costantemente, diventando sempre più forti e affilati.
    alpha-sapphire:
      ja-Hrkt: |-
        キバで　じゅもくに　きずを　つけて
        なわばりの　めじるしにする。
        キバは　おれても　すぐに　はえる。
      ja: |-
        キバで　樹木に　傷を　つけて
        縄張りの　目印にする。
        キバは　折れても　すぐに　生える。
      ko: |-
        이빨로 수목에 상처를 내서
        영역 표시를 한다.
        부러지면 바로 새 이빨이 난다.
      en: |-
        They mark their territory by leaving gashes in trees
        with their tusks. If a tusk breaks, a new one grows
        in quickly.
      fr: |-
        Il laisse la marque de ses crocs dans les arbres pour marquer
        son territoire. Ses crocs repoussent dès qu’ils tombent.
      de: |-
        Markiert sein Revier, indem es mit seinen Fängen Kerben
        in Bäume schlägt. Brechen diese einmal ab, wachsen sie
        sofort nach.
      es: |-
        Deja la huella de sus colmillos en los árboles para marcar su
        territorio. Si se le rompen, se regeneran muy rápido.
      it: |-
        Incide gli alberi con le zanne per marcare il suo territorio.
        Se le zanne gli si spezzano, ricrescono subito.
    sword:
      ja-Hrkt: |-
        じめんに　つくった　すあなに　すむ。
        かたい　きのみを　キバで　くだいて
        なかまと　ちからを　くらべあう。
      ja: |-
        地面に　つくった　巣穴に　棲む。
        硬い　木の実を　キバで　砕いて
        仲間と　力を　比べあう。
      ko: |-
        땅속에 만든 굴에 산다.
        딱딱한 나무열매를 어금니로
        부수는 것을 통해 동료와 힘을 겨룬다.
      zh-Hant: |-
        在地面上築巢居住。
        用牙齒粉碎堅硬的樹果，
        和夥伴比拼力氣。
      zh-Hans: |-
        在地面上筑巢居住。
        用牙齿粉碎坚硬的树果，
        和伙伴比拼力气。
      en: |-
        These Pokémon nest in the ground and use their
        tusks to crush hard berries. Crushing berries is
        also how they test each other’s strength.
      fr: |-
        Il vit dans des terriers qu’il creuse à même le sol,
        et organise des concours avec ses camarades
        pour voir qui peut briser la Baie la plus dure.
      de: |-
        Sie wohnen in Löchern, die sie selbst graben.
        Ab und an veranstalten sie mit harten Beeren
        Wettbewerbe, wer die stärksten Fangzähne hat.
      es: |-
        Viven en madrigueras que construyen bajo tierra.
        Compiten entre ellos para ver quién logra abrir
        con los colmillos las bayas más duras.
      it: |-
        Vive nelle tane che costruisce nel terreno.
        Fa a gara con i suoi compagni a chi riesce a
        frantumare con i denti le bacche più dure.
    shield:
      ja-Hrkt: |-
        おおきな　キバを　うちつけ　なかまと
        じゃれあう。　キバは　おれても
        すぐ　はえてくるから　へっちゃらだ。
      ja: |-
        大きな　キバを　打ちつけ　仲間と
        じゃれあう。　キバは　折れても
        すぐ　生えてくるから　へっちゃらだ。
      ko: |-
        커다란 어금니를 부딪치며 동료와
        장난친다. 어금니는 부러져도
        바로 자라나서 걱정 없다.
      zh-Hant: |-
        會和夥伴們一起互撞牙齒來玩。
        折斷的牙齒會馬上長出來，
        所以絲毫都不會在意。
      zh-Hans: |-
        会和伙伴们一起互撞牙齿来玩。
        折断的牙齿会马上长出来，
        所以丝毫都不会去在意。
      en: |-
        They play with each other by knocking their large
        tusks together. Their tusks break sometimes, but
        they grow back so quickly that it isn’t a concern.
      fr: |-
        Il joue avec ses congénères à se donner de grands
        coups de crocs. Peu importe s’ils se cassent :
        ils repousseront aussitôt.
      de: |-
        Sie rammen sich spielerisch mit ihren Fangzähnen.
        Brechen diese ab, wachsen sie sofort nach.
      es: |-
        Juega con sus congéneres chocando sus enormes
        colmillos con la tranquilidad de saber que, si se
        le rompen, se regenerarán enseguida.
      it: |-
        Giocano tra di loro facendo cozzare le zanne.
        Se si spezzano non è un problema, perché
        ricrescono subito.
