    black-2:
      en: |-
        Lanturn’s light can shine up from
        great depths. It is nicknamed
        “The Deep-Sea Star.”
    white-2:
      en: |-
        Lanturn’s light can shine up from
        great depths. It is nicknamed
        “The Deep-Sea Star.”
    x:
      ja-Hrkt: |-
        しんかいを　およぐ　ランターンの
        あかりは　すいめんまで　とどく。
        しんかいのほし　と　よばれている。
      ja: |-
        深海を　泳ぐ　ランターンの
        明かりは　水面まで　届く。
        深海の星　と　呼ばれている。
      ko: |-
        심해를 헤엄치는 랜턴의
        불빛은 수면까지 다다른다.
        심해의 별이라고 불리고 있다.
      en: |-
        Lanturn’s light can shine up from great depths.
        It is nicknamed “The Deep-Sea Star.”
      fr: |-
        La lumière de Lanturn surgit des profondeurs.
        On le surnomme « étoile des profondeurs ».
      de: |-
        Lanturns Licht kann aus großen Tiefen heraufscheinen.
        Man nennt es auch „Tiefseestern“.
      es: |-
        La luz de Lanturn se puede ver desde lo más
        profundo. Se le llama la Estrella de Alta Mar.
      it: |-
        La sua luce è visibile anche quando si trova in
        profondità. È soprannominato “Stella degli abissi”.
    'y':
      ja-Hrkt: |-
        まぶしい　ひかりを　はなって
        あいての　めを　くらませ　うごけない
        あいだに　まるのみに　してしまう。
      ja: |-
        まぶしい　光を　放って
        相手の　目を　くらませ　動けない
        あいだに　まるのみに　してしまう。
      ko: |-
        눈부신 빛을 발산하여 상대의 눈을
        안 보이게 만들어 움직이지 못하는
        동안에 통째로 삼켜버린다.
      en: |-
        It blinds prey with an intense burst of light.
        With the prey incapacitated, the Pokémon
        swallows it in a single gulp.
      fr: |-
        Il aveugle sa proie avec une lumière intense, puis
        l’avale d’un seul trait une fois immobilisée.
      de: |-
        Es blendet seine Beute mit einem starken Blitz und
        verschlingt die gelähmte Beute mit einem Schluck.
      es: |-
        Ciega a su presa con una luz intensa y luego se la
        traga de un solo bocado.
      it: |-
        Acceca la preda con un’intensa ondata di luce,
        immobilizzandola, per poi ingoiarla in un sol boccone.
    omega-ruby:
      ja-Hrkt: |-
        しんかいのほし　と　よばれる　ポケモンだ。
        しょくしゅの　なかの　バクテリアと　たいえきを
        かがくはんのうさせる　ことで　ひかりを　つくる。
      ja: |-
        深海の星　と　呼ばれる　ポケモンだ。
        触手の　中の　バクテリアと　体液を
        科学反応させる　ことで　光を　つくる。
      ko: |-
        심해의 별이라 불리는 포켓몬이다.
        촉수 안의 박테리아와 체액을
        화학 반응시켜서 빛을 만든다.
      en: |-
        Lanturn is nicknamed “the deep-sea star” for its illuminated
        antenna. This Pokémon produces light by causing a chemical
        reaction between bacteria and its bodily fluids inside
        the antenna.
      fr: |-
        On surnomme Lanturn « l’étoile des profondeurs » à cause de
        son antenne lumineuse. Ce Pokémon produit de la lumière
        en provoquant une réaction chimique entre des bactéries
        et les fluides corporels de son antenne.
      de: |-
        Lanturn wird auch „Tiefseestern“ genannt, da es eine
        leuchtende Antenne besitzt. Dieses Pokémon erzeugt Licht,
        indem es in der Antenne eine chemische Reaktion zwischen
        Bakterien und seinen Körperflüssigkeiten erzeugt.
      es: |-
        A Lanturn lo llaman la Estrella del Fondo del Mar por la antena
        iluminada que tiene. Este Pokémon produce luz creando una
        reacción química entre una bacteria y los fluidos corporales de
        la antena.
      it: |-
        Lanturn è detto anche “Stella degli abissi” per la sua
        antenna-lanterna. Genera la luce grazie a una reazione
        chimica tra i batteri e i fluidi corporei all’interno
        dell’antenna stessa.
    alpha-sapphire:
      ja-Hrkt: |-
        よなかに　ふねから　くらい　うみを　のぞきこむと
        しんかいを　およぐ　ランターンの　ひかりが
        ほしぞらの　ように　みえる　ことが　あるよ。
      ja: |-
        夜中に　船から　暗い　海を　のぞき込むと
        深海を　泳ぐ　ランターンの　光が
        星空の　ように　見える　ことが　あるよ。
      ko: |-
        밤중에 배에서 어두운 바다를 들여다보면
        심해를 헤엄치는 랜턴의 빛이
        별이 총총한 하늘처럼 보이는 일이 있다.
      en: |-
        Lanturn is known to emit light. If you peer down into the dark
        sea from a ship at night, you can sometimes see this
        Pokémon’s light rising from the depths where it swims. It gives
        the sea an appearance of a starlit night.
      fr: |-
        On sait que Lanturn émet de la lumière. Si on regarde
        attentivement la mer de nuit à partir d’un bateau, on peut voir
        la lumière générée par ce Pokémon éclairer les profondeurs.
        Cela donne à la mer l’apparence d’un ciel étoilé.
      de: |-
        Lanturn strahlt Licht ab. Wenn du nachts aufs dunkle Meer
        hinausblickst, kannst du vielleicht das Licht dieses Pokémon
        aus der Tiefe, in der es schwimmt, heraufschimmern sehen.
        Es lässt das Meer wie eine sternklare Nacht wirken.
      es: |-
        Todos saben que Lanturn emite luz. Si echas un ojo al mar
        desde un barco en una noche cerrada, quizás veas su luz a
        través de las aguas, brillando desde lo más profundo, por
        donde suele nadar. Con él, el mar parece un cielo estrellado.
      it: |-
        Lanturn emette una luce intensa. Osservando il mare da
        un’imbarcazione, di notte, è possibile scorgere la sua luce
        risalire dagli abissi dov’è solito nuotare. Il mare assume
        l’aspetto d’un cielo stellato.
    sun:
      ja-Hrkt: |-
        よるの　かいめんを　のぞきこんで
        かがやく　ほしの　ような　ひかりが
        みえたら　それは　ランターンだよ。
      ja: |-
        夜の　海面を　覗き込んで
        輝く　星の　ような　光が
        見えたら　それは　ランターンだよ。
      ko: |-
        밤에 해면을 들여다보다
        반짝이는 별 같은 빛이
        보이면 그것은 랜턴이다.
      zh-Hant: |-
        探頭望向夜晚的海面，
        如果能看到有如星星閃爍
        一樣的光，那就是電燈怪哦。
      zh-Hans: |-
        探头望向夜晚的海面，
        如果看到犹如闪烁的星星
        一样的光，那是电灯怪哦。
      en: |-
        Should you peer into the ocean at night and see
        a light shining like the stars, that is Lanturn.
      fr: |-
        Lorsqu’on regarde au fond de la mer au milieu
        de la nuit et que l’on croit apercevoir le reflet
        des étoiles, c’est probablement un Lanturn.
      de: |-
        Blickt man nachts in die Tiefen des Meeres
        hinab und sieht am Grund ein helles Licht,
        handelt es sich dabei um ein Lanturn.
      es: |-
        Cuando por la noche el mar parece un cielo
        estrellado, es muy probable que se trate de
        Lanturn haciendo brillar su antena.
      it: |-
        Quando sulla superficie del mare si vede brillare
        una luce che sembra una stella, si tratta di
        un Lanturn.
    moon:
      ja-Hrkt: |-
        つよい　ひかりを　はなち　えものの
        めを　くらませる。　スキが　できたら
        でんげきを　おみまいする。
      ja: |-
        強い　光を　放ち　獲物の
        目を　くらませる。　隙が　できたら
        電撃を　お見舞いする。
      ko: |-
        강한 빛을 발산해 먹이의 눈을
        멀게 한다. 허점이 생기면
        전격을 먹인다.
      zh-Hant: |-
        發出強光讓獵物暫時失明。
        趁獵物露出破綻時，
        用電擊招呼對手。
      zh-Hans: |-
        发出强光蒙住猎物的眼睛。
        抓住那一瞬间的空档，
        使其遭受电的攻击。
      en: |-
        This Pokémon flashes a bright light that blinds
        its prey. This creates an opening for it to deliver
        an electrical attack.
      fr: |-
        Il dégage une vive lumière pour éblouir ses
        proies, puis les achève d’un choc électrique
        bien senti.
      de: |-
        Es blendet seine Beute mit einem starken Blitz.
        Sieht es eine Chance zuzuschlagen, greift es
        sie mit Elektrizität an.
      es: |-
        Ciega a sus presas con una luz intensa. Si tiene
        la ocasión, les propina una buena descarga
        eléctrica.
      it: |-
        Acceca la preda con una luce intensa per poi
        attaccarla immediatamente con una scossa
        elettrica.
    ultra-sun:
      ja-Hrkt: |-
        しょくしゅに　すむ　バクテリアが
        ランターンの　たいえきを　すうとき
        つよい　はっこうげんしょうが　おこる。
      ja: |-
        触手に　棲む　バクテリアが
        ランターンの　体液を　吸うとき
        強い　発光現象が　起こる。
      ko: |-
        촉수에 사는 박테리아가
        랜턴의 체액을 빨아들일 때
        강한 발광 현상이 일어난다.
      zh-Hant: |-
        當棲息在觸手中的細菌
        吸食電燈怪的體液時，
        會產生強烈的發光現象。
      zh-Hans: |-
        栖息在触手里的细菌在
        吸食电灯怪的体液时，
        会产生强烈的发光现象。
      en: |-
        When the bacteria living inside its antennae
        absorb Lanturn’s bodily fluids, a strong
        luminescent effect is produced.
      fr: |-
        Les bactéries nichées dans l’antenne de Lanturn
        émettent une lumière vive quand elles aspirent
        ses fluides corporels.
      de: |-
        In Lanturns Antennen leben Bakterien, die seine
        Körperflüssigkeiten aufnehmen und so ein
        eindrucksvolles Lichtspektakel auslösen.
      es: |-
        Cuando las bacterias que viven en sus antenas
        absorben sus fluidos corporales, sufren una
        reacción que libera una luz intensa.
      it: |-
        Quando i batteri nelle antenne di Lanturn
        assimilano i suoi fluidi corporei, scatenano una
        reazione che sprigiona una forte luce.
    ultra-moon:
      ja-Hrkt: |-
        かいちゅうの　はるか　ふかくに　すむ。
        ひかりで　えものの　めを　くらませて
        ひるんだ　すきに　まるのみに　する。
      ja: |-
        海中の　遥か　深くに　棲む。
        光で　獲物の　目を　くらませて
        ひるんだ　隙に　丸呑みに　する。
      ko: |-
        바닷속 깊고 깊은 곳에 산다.
        빛으로 먹이의 눈을 멀게 해서
        풀이 죽은 틈을 타 통째로 삼킨다.
      zh-Hant: |-
        棲息在很深的海底。會用
        刺眼的光線讓獵物看不見東西，
        再趁對方畏縮時一口吞下。
      zh-Hans: |-
        栖息在深邃的海里。
        会用光眩晕猎物，并趁对方
        畏缩时将其整个吞下。
      en: |-
        It lives far down in the depths of the ocean. It
        blinds its prey with light, using the moment
        they’re dazzled to swallow them whole.
      fr: |-
        Ce Pokémon des abysses immobilise ses proies
        en les aveuglant grâce à la lumière de son
        antenne, puis les gobe toutes crues.
      de: |-
        Dieses tief im Meer lebende Pokémon blendet
        seine Beute mit dem Licht seiner Antennen und
        verschlingt sie anschließend mit einem Schluck.
      es: |-
        Vive en lo más profundo del océano. Deslumbra
        a su presa con la luz de sus antenas y, mientras
        está confusa, la engulle de un bocado.
      it: |-
        Vive negli abissi più remoti. Abbaglia la preda
        con la sua luce e approfitta del suo stordimento
        per ingoiarla in un sol boccone.
    sword:
      ja-Hrkt: |-
        ランターンのだす　ひかりは
        ５０００メートルの　ふかさ　からでも
        すいめんまで　とどくほど　あかるい。
      ja: |-
        ランターンのだす　光は
        ５０００メートルの　深さ　からでも
        水面まで　届くほど　明るい。
      ko: |-
        랜턴이 내는 빛은
        5000m의 깊이에서도
        수면까지 전해질 정도로 밝다.
      zh-Hant: |-
        電燈怪發出的光有著極高的
        亮度，甚至可以從５０００公尺
        深的水底照亮水面。
      zh-Hans: |-
        电灯怪发出的光有着极高的
        亮度，甚至可以从５０００米
        深的水底照亮水面。
      en: |-
        The light it emits is so bright that it can illuminate
        the sea’s surface from a depth of over three miles.
      fr: |-
        Sa lumière est si intense qu’on peut la voir
        à la surface de l’eau alors qu’il se trouve
        à 5 000 mètres de profondeur.
      de: |-
        Sein Licht ist so hell, dass es selbst aus 5 000 m
        Tiefe an die Meeresoberfläche dringt.
      es: |-
        La luz que emite es tan brillante que puede
        iluminar la superficie del mar desde unos 5 km
        de profundidad.
      it: |-
        Emette una luce così intensa da illuminare la
        superficie del mare da oltre 5 km di profondità.
    shield:
      ja-Hrkt: |-
        つよい　ひかりを　はなち　えものの
        めを　くらませる。　スキが　できたら
        でんげきを　おみまいする。
      ja: |-
        強い　光を　放ち　獲物の
        目を　眩ませる。　隙が　できたら
        電撃を　おみまいする。
      ko: |-
        강한 빛을 발산해
        먹이의 눈을 멀게 한다.
        허점을 보이면 전격을 먹인다.
      zh-Hant: |-
        發出強光讓獵物暫時失明。
        趁獵物露出破綻時，
        用電擊招呼對手。
      zh-Hans: |-
        发出强光蒙住猎物的眼睛。
        抓住那一瞬间的空档，
        使其遭受电的攻击。
      en: |-
        This Pokémon flashes a bright light that blinds
        its prey. This creates an opening for it to deliver
        an electrical attack.
      fr: |-
        Il dégage une vive lumière pour éblouir ses proies,
        puis leur inflige un choc électrique bien senti.
      de: |-
        Es blendet seine Beute mit einem grellen Licht.
        Sieht es eine Chance zuzuschlagen, greift es sie
        mit Elektrizität an.
      es: |-
        Ciega a sus presas con una luz intensa. Si tiene la
        ocasión, les propina una descarga eléctrica.
      it: |-
        Acceca la preda con una luce intensa per poi
        attaccarla immediatamente con una scossa
        elettrica.
