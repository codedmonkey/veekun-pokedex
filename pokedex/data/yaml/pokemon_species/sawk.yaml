sawk:
  base_happiness: 50
  capture_rate: 45
  color: blue
  egg_groups:
    - humanshape
  evolution_chain: sawk
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        The sound of Sawk punching boulders
        and trees can be heard all the way from
        the mountains where they train.
      fr: |-
        Dans les montagnes où il s’entraîne, on
        peut l’entendre donner des coups de
        poing aux rochers et aux grands arbres.
    white:
      en: |-
        Tying their belts gets them pumped and
        makes their punches more destructive.
        Disturbing their training angers them.
      fr: |-
        Quand il noue sa ceinture, il est plus
        concentré et ses coups font plus mal.
        Il s’énerve si on gêne son entraînement.
    black-2:
      en: |-
        Desiring the strongest karate chop,
        they seclude themselves in
        mountains and train without sleeping.
    white-2:
      en: |-
        Desiring the strongest karate chop,
        they seclude themselves in
        mountains and train without sleeping.
    x:
      ja-Hrkt: |-
        さいきょうの　からてチョップを
        もとめて　やまおくに　こもって
        ねむることなく　しゅぎょうする。
      ja: |-
        最強の　からてチョップを
        求めて　山奥に　こもって
        眠ることなく　修行する。
      ko: |-
        최강의 태권당수를
        목표로 산속에 틀어박혀
        잠도 없이 수행한다.
      en: |-
        Desiring the strongest karate chop, they seclude
        themselves in mountains and train without sleeping.
      fr: |-
        Pour accéder à la maîtrise ultime du karaté, il se
        retire dans les montagnes et s’entraîne nuit et jour.
      de: |-
        Es lebt zurückgezogen in den Bergen und trainiert
        Tag und Nacht, um seinen Karateschlag
        zu perfektionieren.
      es: |-
        Para lograr dominar las técnicas de kárate más letales,
        se retiran a las montañas y entrenan día y noche.
      it: |-
        Si allena senza posa, giorno e notte, sui monti per
        potenziare al massimo i suoi colpi di karate.
    'y':
      ja-Hrkt: |-
        おびを　しめると　きあいが　はいり
        パンチの　はかいりょくが　ます。
        しゅぎょうを　ジャマすると　おこる。
      ja: |-
        帯を　締めると　気合いが　入り
        パンチの　破壊力が　増す。
        修行を　ジャマすると　怒る。
      ko: |-
        끈을 매면 기합이 들어가
        펀치의 파괴력이 강해진다.
        수련을 방해하면 화를 낸다.
      en: |-
        Tying their belts gets them pumped and makes their
        punches more destructive. Disturbing their training
        angers them.
      fr: |-
        Quand il noue sa ceinture, il est plus concentré et
        ses coups font plus mal. Il s’énerve si on gêne son
        entraînement.
      de: |-
        Zieht es den Gürtel fest, werden seine Hiebe stärker.
        Kann es gar nicht leiden, wenn man es beim Training
        stört.
      es: |-
        La potencia de sus puñetazos aumenta si se aprieta el
        cinturón. Si le molestan cuando se entrena, se enfada.
      it: |-
        La cintura da karate gli dà la carica e aumenta la
        forza distruttiva dei pugni. Quando si allena, meglio
        non disturbarlo.
    omega-ruby:
      ja-Hrkt: |-
        さいきょうの　からてチョップを
        もとめて　やまおくに　こもって
        ねむることなく　しゅぎょうする。
      ja: |-
        最強の　からてチョップを
        求めて　山奥に　こもって
        眠ることなく　修行する。
      ko: |-
        최강의 태권당수를
        목표로 산속에 틀어박혀
        잠도 없이 수행한다.
      en: |-
        Desiring the strongest karate chop, they seclude
        themselves in mountains and train without sleeping.
      fr: |-
        Pour accéder à la maîtrise ultime du karaté, il se retire
        dans les montagnes et s’entraîne nuit et jour.
      de: |-
        Es lebt zurückgezogen in den Bergen und trainiert Tag
        und Nacht, um seinen Karateschlag zu perfektionieren.
      es: |-
        Para lograr dominar las técnicas de kárate más letales, se
        retiran a las montañas y entrenan día y noche.
      it: |-
        Si allena senza posa, giorno e notte, sui monti per potenziare
        al massimo i suoi colpi di karate.
    alpha-sapphire:
      ja-Hrkt: |-
        おびを　しめると　きあいが　はいり
        パンチの　はかいりょくが　ます。
        しゅぎょうを　ジャマすると　おこる。
      ja: |-
        帯を　締めると　気合いが　入り
        パンチの　破壊力が　増す。
        修行を　ジャマすると　怒る。
      ko: |-
        끈을 매면 기합이 들어가
        펀치의 파괴력이 강해진다.
        수련을 방해하면 화를 낸다.
      en: |-
        Tying their belts gets them pumped and makes their
        punches more destructive. Disturbing their training
        angers them.
      fr: |-
        Quand il noue sa ceinture, il est plus concentré et ses coups
        font plus mal. Il s’énerve si on gêne son entraînement.
      de: |-
        Zieht es den Gürtel fest, werden seine Hiebe stärker. Kann es
        gar nicht leiden, wenn man es beim Training stört.
      es: |-
        La potencia de sus puñetazos aumenta si se aprieta el
        cinturón. Si le molestan cuando se entrena, se enfada.
      it: |-
        La cintura da karate gli dà la carica e aumenta la forza
        distruttiva dei pugni. Quando si allena, meglio non disturbarlo.
    sword:
      ja-Hrkt: |-
        ひたすらに　つよさを　もとめる。
        やまで　しゅぎょうする　ダゲキを
        みたら　しずかに　たちさろう。
      ja: |-
        ひたすらに　強さを　求める。
        山で　修行する　ダゲキを
        見たら　静かに　立ち去ろう。
      ko: |-
        한결같이 강해지기를 추구한다.
        산에서 수행 중인 타격귀를
        발견한다면 조용히 물러나자.
      zh-Hant: |-
        不斷地尋求強大的實力。
        要是看到了在山上修行的
        打擊鬼，就靜靜地離開吧。
      zh-Hans: |-
        不断地寻求强大的实力。
        要是看到了在山上修行的
        打击鬼，就静静地离开吧。
      en: |-
        If you see a Sawk training in the mountains in its
        single-minded pursuit of strength, it’s best to
        quietly pass by.
      fr: |-
        Il cherche à tout prix à devenir plus fort.
        Il est conseillé de ne pas le déranger quand
        il s’entraîne en montagne.
      de: |-
        Es strebt unentwegt nach Stärke. Wer in den
        Bergen ein Karadonis beim Training erblickt,
        sollte sich ganz leise aus dem Staub machen.
      es: |-
        Viven obsesionados con hacerse más fuertes. Si se
        los encuentra entrenando en la montaña, lo más
        recomendable es alejarse en silencio.
      it: |-
        Cerca costantemente di diventare più forte.
        Se lo si incontra in montagna mentre si allena,
        è meglio svignarsela in silenzio.
    shield:
      ja-Hrkt: |-
        きたえに　きたえた　ダゲキが
        くりだす　ひっさつ　からてチョップは
        うみも　わるほどの　はかいりょく。
      ja: |-
        鍛えに　鍛えた　ダゲキが
        繰りだす　必殺　空手チョップは
        海も　割るほどの　破壊力。
      ko: |-
        단련하고 단련한 타격귀가
        사용하는 필살 태권당수는
        바다도 가를 정도의 파괴력을 지녔다.
      zh-Hant: |-
        不斷重複練習的打擊鬼
        所使出的空手劈擁有
        足以劈開大海的破壞力。
      zh-Hans: |-
        不断重复练习的打击鬼
        所使出的空手劈拥有
        足以劈开大海的破坏力。
      en: |-
        The karate chops of a Sawk that’s trained itself
        to the limit can cleave the ocean itself.
      fr: |-
        Après avoir suivi un entraînement intensif,
        la puissance du tranchant de sa main est telle
        qu’il peut fendre la mer en deux.
      de: |-
        Der Karateschlag eines perfekt durchtrainierten
        Karadonis’ hat genug Wucht, um selbst das Meer
        zu spalten.
      es: |-
        Cuando un Sawk ha entrenado duro, es capaz
        de separar las aguas del océano con la potencia
        de sus técnicas de kárate.
      it: |-
        Grazie al suo intenso allenamento, può infliggere
        micidiali colpi di karate capaci di dividere in due
        le acque dell’oceano.
