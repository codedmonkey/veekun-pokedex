  flavor_text:
    gold:
      en: |-
        It spins string
        not only from its
        rear but also fromits mouth. It is
        hard to tell which
        end is which.
    silver:
      en: |-
        A single strand of
        a special string
        is endlessly spunout of its rear.
        The string leads
        back to its nest.
    crystal:
      en: |-
        Rather than mak­
        ing a nest in one
        specific spot, itwanders in search
        of food after
        darkness falls.
    ruby:
      en: |-
