    sapphire:
      en: |-
        PINSIR has a pair of massive horns 
        Protruding from the surface of these
        horns are thorns.These thorns are driven deeply into the
        foe’s body when the pincer closes,
        making it tough for the foe to escape.
    emerald:
      en: |-
        Their pincers are strong enough to
        shatter thick logs. Because they dislike
        cold, PINSIR burrow and sleep under
        the ground on chilly nights.
    firered:
      en: |-
        Its two long pincer horns are powerful.
        Once they grip an enemy, they won’t
        release until the foe is torn.
    leafgreen:
      en: |-
        If it fails to crush the foe in its
        pincers, it will swing around and toss
        the opponent.
    diamond:
      en: |-
        It grips prey with its pincers
        until the prey is torn in half.
        What it can’t tear, it tosses far.
    pearl:
      en: |-
        It grips prey with its pincers
        until the prey is torn in half.
        What it can’t tear, it tosses far.
    platinum:
      en: |-
        It grips prey with its pincers
        until the prey is torn in half.
        What it can’t tear, it tosses far.
    heartgold:
      en: |-
        With its pincer horns, it digs burrows
        to sleep in at night. In the morning,
        damp soil clings to its body.
    soulsilver:
      en: |-
        It swings its long pincer horns wildly
        to attack. During cold periods, it
        hides deep in forests.
    black:
      en: |-
        It grips prey with its pincers
        until the prey is torn in half.
        What it can’t tear, it tosses far.
      fr: |-
        Il serre les proies dans ses pinces
        pour les trancher en deux. S’il n’y
        arrive pas, il les jette au loin.
    white:
      en: |-
        It grips prey with its pincers
        until the prey is torn in half.
        What it can’t tear, it tosses far.
      fr: |-
        Il serre les proies dans ses pinces
        pour les trancher en deux. S’il n’y
        arrive pas, il les jette au loin.
    black-2:
      en: |-
        It grips prey with its powerful
        pincers and will not let go
        until the prey is torn in half.
    white-2:
      en: |-
        It grips prey with its powerful
        pincers and will not let go
        until the prey is torn in half.
    x:
      ja-Hrkt: |-
        ２ほんの　ツノで　えものを　はさんで
        ちぎれるまで　はなさない。ちぎれない
        ときは　かなたまで　なげとばすのだ。
      ja: |-
        ２本の　ツノで　獲物を　挟んで
        ちぎれるまで　放さない。ちぎれない
        ときは　かなたまで　投げ飛ばすのだ。
      ko: |-
        2개의 뿔 사이에 먹이를 끼우고
        조각날 때까지 놓지 않는다. 조각나지
        않으면 저편으로 세게 내던진다.
      en: |-
        It grips prey with its pincers until the prey is torn
        in half. What it can’t tear, it tosses far.
      fr: |-
        Il serre les proies dans ses pinces pour les trancher
        en deux. S’il n’y arrive pas, il les jette au loin.
      de: |-
        Es hält seine Beute mit seiner Zange fest und
        teilt sie dann. Was es nicht teilen kann, wirft es fort.
      es: |-
        Atrapa presas con sus pinzas hasta que las parte en
        dos. Lanza lejos lo que no puede quebrar.
      it: |-
        Afferra la preda con le pinze e non la molla finché
        non l’ha tranciata. Se non ci riesce, la scaglia via.
    'y':
      ja-Hrkt: |-
        ながい　ツノを　ふりまわして
        こうげきしてくる。さむいときは
        もりの　おくに　すがたを　かくす。
      ja: |-
        長い　ツノを　振り回して
        攻撃してくる。寒いときは
        森の　奥に　姿を　隠す。
      ko: |-
        긴 뿔을 휘둘러서
        공격을 해온다. 추울 때는
        숲 깊은 곳에 몸을 숨긴다.
      en: |-
        It swings its long pincer horns wildly to attack.
        During cold periods, it hides deep in forests.
      fr: |-
        Il attaque sauvagement avec ses cornes. En hiver,
        il se cache au plus profond des forêts.
      de: |-
        Beim Angriff verdreht es sein Geweih.
        In Kälteperioden versteckt es sich tief im Wald.
      es: |-
        Arremete violentamente con su cornamenta. Cuando
        llega el frío, se adentra en los bosques.
      it: |-
        Quando attacca agita le lunghe corna. Nei periodi
        freddi sta nascosto nelle foreste.
    omega-ruby:
      ja-Hrkt: |-
        じぶんの　たいじゅうの　２ばいも　ある　あいてを
        ツノで　はさみ　かるがる　もちあげる　かいりき。
        さむい　ばしょでは　からだの　うごきが　にぶる。
      ja: |-
        自分の　体重の　２倍も　ある　相手を
        ツノで　挟み　軽々　持ち上げる　怪力。
        寒い　場所では　体の　動きが　鈍る。
      ko: |-
        자신의 몸무게 두 배나 되는 상대를 뿔로
        집어 가볍게 들어 올리는 괴력을 지녔다.
        추운 곳에서는 몸의 움직임이 둔해진다.
      en: |-
        Pinsir is astoundingly strong. It can grip a foe weighing twice
        its weight in its horns and easily lift it. This Pokémon’s
        movements turn sluggish in cold places.
      fr: |-
        Scarabrute est incroyablement fort. Il peut attraper un ennemi
        qui pèse deux fois son poids dans ses mandibules et le
        soulever sans le moindre problème. Lorsqu’il fait froid,
        les mouvements de ce Pokémon sont un peu ralentis.
      de: |-
        Pinsir ist erstaunlich stark. Es kann einen Feind, der
        doppelt so viel wiegt wie es selbst, mit seinen Hörnern
        packen und hochheben. Bei niedrigen Temperaturen
        werden die Bewegungen dieses Pokémon schwerfällig.
      es: |-
        Pinsir es sorprendentemente fuerte. Puede agarrar con los
        cuernos a un rival que pese el doble que él y levantarlo por
        los aires. En zonas frías, los movimientos de este Pokémon
        se vuelven lentos.
      it: |-
        Pinsir è incredibilmente forte. Può afferrare e sollevare tra
        le chele sul capo un nemico dal peso doppio rispetto al suo.
        I suoi movimenti sono impacciati in luoghi freddi.
    alpha-sapphire:
      ja-Hrkt: |-
        たくましい　２ほんの　ツノの　ひょうめんに　ある
        トゲが　あいての　からだに　ふかく　くいこむので
        はさまれると　かんたんに　はずせないのだ。
      ja: |-
        たくましい　２本の　ツノの　表面に　ある
        トゲが　相手の　体に　深く　食い込むので
        挟まれると　簡単に　外せないのだ。
      ko: |-
        늠름한 2개의 뿔 표면에 있는
        가시가 상대의 몸에 깊숙이 파고들어서
        집히면 쉽게 벗어날 수 없다.
      en: |-
        Pinsir has a pair of massive horns. Protruding from the surface
        of these horns are thorns. These thorns are driven deeply into
        the foe’s body when the pincer closes, making it tough for the
        foe to escape.
      fr: |-
        Scarabrute est doté de cornes imposantes. Des pointes
        jaillissent de la surface de ses cornes. Ces pointes s’enfoncent
        profondément dans le corps de l’ennemi, l’empêchant ainsi
        de s’échapper.
      de: |-
        Pinsir hat ein Paar massive Hörner. Aus diesen ragen Dornen
        hervor, die sich in den Körper seines Gegners hineinbohren,
        wenn sich die Zange schließt, und ihm das Entkommen
        schwer machen.
      es: |-
        Pinsir tiene un par de cuernos imponentes recubiertos de
        pinchos, que se clavan en el cuerpo del rival. Una vez que
        los ha clavado, no hay quien escape de su abrazo.
      it: |-
        Pinsir è dotato di due chele enormi sul capo, dalla cui
        superficie sporgono aculei. Questi vengono conficcati
        nel corpo del nemico quando le chele si chiudono,
        per impedirne la fuga.
    sun:
      ja-Hrkt: |-
        ながい　ツノで　あいてを　はさみこみ
        そのまま　まっぷたつに　してしまう。
        パワフルだが　さむいのは　にがて。
      ja: |-
        長い　角で　相手を　挟み込み
        そのまま　真っ二つに　してしまう。
        パワフルだが　寒いのは　苦手。
      ko: |-
        긴 뿔로 상대를 끼워 넣어
        그대로 두 동강을 내 버린다.
        파워풀하지만 추운 것을 싫어한다.
      zh-Hant: |-
        會用長長的角把對手夾住，
        就這樣把對方夾成兩半。
        力量非常強大，但很害怕寒冷。
      zh-Hans: |-
        用长长的角把对手夹住，
        就这么把对方夹成两半。
        非常强大，但很害怕寒冷。
      en: |-
        It grips its prey in its pincers and splits them
        apart. Although it is a powerful Pokémon, it
        can’t deal with the cold.
      fr: |-
        Il attrape ses adversaires entre ses cornes et
        les tranche en deux d’un seul coup. Malgré sa
        force, il a une faiblesse : le froid.
      de: |-
        Es nimmt Gegner mit seinen langen Hörnern in
        die Zange und reißt sie damit entzwei. Es ist
        sehr stark, aber es verabscheut Kälte.
      es: |-
        Atrapa a sus rivales con las pinzas y los parte
        en dos con su enorme fuerza. A pesar de ser
        muy fuerte, no soporta el frío.
      it: |-
        Afferra il nemico con le lunghe corna e lo trancia
        in due. È estremamente forte, ma non sopporta
        il freddo.
    moon:
      ja-Hrkt: |-
        ツノの　いちげきは　たいぼく　さえ
        へしおるほど。　アローラでは
        クワガノンが　さいだいの　ライバル。
      ja: |-
        角の　一撃は　大木　さえ
        へし折るほど。　アローラでは
        クワガノンが　最大の　ライバル。
      ko: |-
        뿔의 일격은 큰 나무조차도
        부러뜨릴 정도다. 알로라에서는
        투구뿌논이 최대의 라이벌이다.
      zh-Hant: |-
        角的一擊連大樹都能折斷。
        在阿羅拉，鍬農炮蟲是牠最大的競爭者。
      zh-Hans: |-
        用角一击连大树都能折断。
        在阿罗拉，锹农炮虫是它最大的竞争者。
      en: |-
        One solid blow from its horns is enough to split
        apart a large tree. Its greatest rival in Alola
        is Vikavolt.
      fr: |-
        Il peut abattre un grand arbre d’un coup de
        corne. À Alola, son plus grand rival est Lucanon.
      de: |-
        Ein Stoß mit seinen Hörnern reicht, um große
        Bäume zu zersplittern. In Alola ist Donarion
        sein größter Rivale.
      es: |-
        Es capaz de derribar un árbol de una sola
        arremetida. En Alola, su mayor rival es Vikavolt.
      it: |-
        Con le sue corna può abbattere un grande
        albero in un colpo solo. Nella regione di Alola,
        Vikavolt è il suo più acerrimo nemico.
    ultra-sun:
      ja-Hrkt: |-
        クワガノンと　なわばりを　あらそう。
        アローラでは　なぜか　ヘラクロスと
        けっこう　なかが　よいらしい。
      ja: |-
        クワガノンと　縄張りを　争う。
        アローラでは　なぜか　ヘラクロスと
        結構　仲が　良いらしい。
      ko: |-
        투구뿌논과 영역 다툼을 한다.
        알로라에서는 어째서인지
        헤라크로스와 사이가 좋은 듯하다.
      zh-Hant: |-
        會和鍬農炮蟲爭奪地盤。
        不知為何，在阿羅拉這裡，
        牠和赫拉克羅斯的關係相當不錯。
      zh-Hans: |-
        会和锹农炮虫争夺领地。
        在阿罗拉，不知为何它和
        赫拉克罗斯的关系好像相当不错。
      en: |-
        It gets into territorial disputes with Vikavolt.
        For some reason, it apparently gets along well
        with Heracross in Alola.
      fr: |-
        Des luttes territoriales l’opposent aux Lucanon.
        À Alola, il semble bien s’entendre avec Scarhino.
      de: |-
        Es liefert sich Revierkämpfe mit Donarion. Aus
        noch unbekannten Gründen versteht es sich in
        Alola ausgesprochen gut mit Skaraborn.
      es: |-
        Son famosas sus disputas territoriales con los
        Vikavolt. En Alola parece llevarse muy bien con
        los Heracross por motivos que se desconocen.
      it: |-
        Si contende il territorio con i Vikavolt.
        Per qualche motivo, ad Alola i Pinsir sembrano
        andare d’accordo con gli Heracross.
    ultra-moon:
      ja-Hrkt: |-
        たくましいが　さむさが　じゃくてん。
        よるに　なると　このはの　なかに
        からだを　うずめて　ねむる。
      ja: |-
        たくましいが　寒さが　弱点。
        夜に　なると　木の葉の　中に
        身体を　埋めて　眠る。
      ko: |-
        늠름하지만 추위가 약점이다.
        밤이 되면 나뭇잎 속에
        몸을 파묻고 잔다.
      zh-Hant: |-
        雖然很強壯，但弱點是怕冷。
        到了晚上就會把身體
        埋在樹葉堆裡睡覺。
      zh-Hans: |-
        虽然身体壮实，但弱点是怕冷。
        到了晚上，就会将身体
        埋在树叶中睡觉。
      en: |-
        Although it’s tough, it can’t handle cold well.
        When night falls, it buries itself in leafage
        and sleeps.
      fr: |-
        Ce Pokémon a beau être robuste, il supporte
        mal le froid. La nuit, il s’enfouit donc sous un tas
        de feuilles pour dormir au chaud.
      de: |-
        Es ist zwar robust, verträgt jedoch keine Kälte.
        Bei Anbruch der Nacht vergräbt es sich im Laub
        und schläft.
      es: |-
        Es de constitución robusta, pero no soporta el
        frío. Al caer la noche, se cubre con un manto de
        hojas antes de conciliar el sueño.
      it: |-
        È molto robusto ma non sopporta il freddo.
        Al calare della notte, si ripara sotto uno strato
        di foglie per dormire.
    lets-go-pikachu:
      ja-Hrkt: |-
        ツノで　はさんで　パワーぜんかい！
        さむくなると　うごけなくなるから
        あたたかい　ところに　すんでいる。
      ja: |-
        ツノで　挟んで　パワー全開！
        寒くなると　動けなくなるから
        暖かい　ところに　住んでいる。
      ko: |-
        뿔로 집은 다음 있는 힘껏 조인다!
        추워지면 움직일 수 없게 되므로
        따뜻한 곳에 산다.
      zh-Hant: |-
        用角夾住對手全力突擊！
        氣溫低時會變得無法動彈，
        所以總是住在溫暖的地方。
      zh-Hans: |-
        用犄角全力夹击！由于
        低温会使它无法动弹，所以
        它会选择在温暖的地方生活。
      en: |-
        Grips its prey in its pincers and squeezes hard!
        It can’t move if it’s cold out, so it lives in
        warm places.
      fr: |-
        Il enserre sa proie de sa puissante pince.
        Il ne peut pas se déplacer dans le froid,
        donc on le trouve dans les milieux chauds.
      de: |-
        Pinsir nimmt Gegner mit seinen Hörnern in die
        Zange und drückt kräftig zu. Es lebt an warmen
        Orten, da es bei niedrigen Temperaturen erstarrt.
      es: |-
        Atrapa a su presa con las pinzas y aprieta fuerte.
        Habita en lugares cálidos, ya que el frío puede
        llegar a inmovilizarlo.
      it: |-
        Afferra la preda tra le corna, stritolandola
        con tutte le sue forze. Vive in ambienti caldi
        poiché il freddo lo immobilizza.
    lets-go-eevee:
      ja-Hrkt: |-
        ツノで　はさんで　パワーぜんかい！
        さむくなると　うごけなくなるから
        あたたかい　ところに　すんでいる。
      ja: |-
        ツノで　挟んで　パワー全開！
        寒くなると　動けなくなるから
        暖かい　ところに　住んでいる。
      ko: |-
        뿔로 집은 다음 있는 힘껏 조인다!
        추워지면 움직일 수 없게 되므로
        따뜻한 곳에 산다.
      zh-Hant: |-
        用角夾住對手全力突擊！
        氣溫低時會變得無法動彈，
        所以總是住在溫暖的地方。
      zh-Hans: |-
        用犄角全力夹击！由于
        低温会使它无法动弹，所以
        它会选择在温暖的地方生活。
      en: |-
        Grips its prey in its pincers and squeezes hard!
        It can’t move if it’s cold out, so it lives in
        warm places.
      fr: |-
        Il enserre sa proie de sa puissante pince.
        Il ne peut pas se déplacer dans le froid,
        donc on le trouve dans les milieux chauds.
      de: |-
        Pinsir nimmt Gegner mit seinen Hörnern in die
        Zange und drückt kräftig zu. Es lebt an warmen
        Orten, da es bei niedrigen Temperaturen erstarrt.
      es: |-
        Atrapa a su presa con las pinzas y aprieta fuerte.
        Habita en lugares cálidos, ya que el frío puede
        llegar a inmovilizarlo.
      it: |-
        Afferra la preda tra le corna, stritolandola
        con tutte le sue forze. Vive in ambienti caldi
        poiché il freddo lo immobilizza.
    sword:
      ja-Hrkt: |-
        ツノで　たがいを　かくづけする。
        ふとく　りっぱな　ツノを　もつ
        カイロスほど　いせいに　にんき。
      ja: |-
        ツノで　互いを　格付けする。
        太く　立派な　ツノを　持つ
        カイロスほど　異性に　人気。
      ko: |-
        뿔로 서로의 등급을 매긴다.
        굵고 훌륭한 뿔을 가진
        쁘사이저일수록 이성에게 인기다.
      zh-Hant: |-
        會以角來判斷彼此的地位。
        凱羅斯的角越是粗壯氣派，
        就越能得到異性的愛戴。
      zh-Hans: |-
        同类之间以角的成色划分等级。
        一只凯罗斯的角越粗越结实，
        它就越受异性欢迎。
      en: |-
        These Pokémon judge one another based on
        pincers. Thicker, more impressive pincers make
        for more popularity with the opposite gender.
      fr: |-
        Ses cornes déterminent son rang au sein
        du groupe. Plus elles sont imposantes, plus
        les membres du sexe opposé l’apprécient.
      de: |-
        Der Status eines Pinsirs hängt von seinen Hörnern
        ab. Je dicker und stattlicher diese sind, desto
        beliebter ist es beim anderen Geschlecht.
      es: |-
        Los Pinsir se juzgan entre ellos por la robustez
        de la cornamenta. Cuanto más imponente sea,
        más agradará a sus congéneres del sexo opuesto.
      it: |-
        I Pinsir si giudicano a vicenda in base alle corna.
        Quelli con corna grosse e imponenti hanno
        più successo con gli esemplari dell’altro sesso.
    shield:
      ja-Hrkt: |-
        ツノで　えものを　はさみこみ
        そのまま　まっぷたつに　するか
        ごういんに　なげとばしてしまう。　
      ja: |-
        ツノで　獲物を　挟みこみ
        そのまま　まっぷたつに　するか
        強引に　投げ飛ばしてしまう。
      ko: |-
        뿔로 먹이를 찔러 넣어
        그대로 두 동강으로 만들거나
        강제로 던져버린다.
      zh-Hant: |-
        會用角緊緊夾住獵物，
        就這樣把對方剪成兩半
        或是把牠硬扔到天邊去。
      zh-Hans: |-
        用角夹住猎物后，
        不是直接把对方切成两半，
        就是强行把对方扔飞。
      en: |-
        This Pokémon clamps its pincers down on its prey
        and then either splits the prey in half or flings
        it away.
      fr: |-
        Une fois sa proie enserrée entre ses cornes,
        deux choix s’offrent à lui : la couper en deux
        ou la projeter au loin de toutes ses forces.
      de: |-
        Pinsir nimmt Beute mit seinen Hörnern in die
        Zange, um sie anschließend entzweizureißen
        oder mit Wucht fortzuschleudern.
      es: |-
        Usa la cornamenta a modo de pinza para atrapar
        a sus presas. Acto seguido, las parte por la mitad
        o las arroja lejos.
      it: |-
        Afferra le prede con le corna e le trancia in due,
        oppure le lancia via con violenza.
