        it hard.
    blue:
      en: |-
        If it fails to
        crush the victim
        in its pincers,it will swing it
        around and toss
        it hard.
    yellow:
      en: |-
        Grips its prey in
        its pincers and
        squeezes hard! Itcan't move if it's
        cold, so it lives
        in warm places.
    gold:
      en: |-
        With its horns, it
        digs burrows to
        sleep in at night.In the morning,
        damp soil clings
        to its body.
    silver:
      en: |-
        Swings its long
        antlers wildly to
        attack. Duringcold periods, it
        hides deep in
        forests.
    crystal:
      en: |-
        When the tempera­
        ture drops at
        night, it sleepson treetops or
        among roots where
        it is well hidden.
    ruby:
      en: |-
        PINSIR is astoundingly strong. It can
        grip a foe weighing twice its weight
        in its horns and easily lift it.This POKéMON’s movements turn sluggish
