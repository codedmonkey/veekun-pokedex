  flavor_text:
    black:
      en: |-
        Its melodies are sung with a special
        vocalization method that can control
        the feelings of those who hear it.
      fr: |-
        Sa voix si particulière lui permet de
        chanter des mélodies qui ensorcellent
        les gens et modifient leurs émotions.
    white:
      en: |-
        Many famous songs have been inspired
        by the melodies that Meloetta plays.
      fr: |-
        De nombreux succès musicaux ont été
        composés en s’inspirant des mélodies
        chantées par Meloetta.
    black-2:
      en: |-
        The melodies sung by Meloetta have
        the power to make Pokémon that
        hear them happy or sad.
    white-2:
      en: |-
        The melodies sung by Meloetta have
        the power to make Pokémon that
        hear them happy or sad.
    x:
      ja-Hrkt: |-
        メロエッタの　かなでる　せんりつは
        まわりの　ポケモンを　よろこばせたり
        かなしませるほどの　パワーがある。
      ja: |-
        メロエッタの　奏でる　旋律は
        まわりの　ポケモンを　喜ばせたり
        悲しませるほどの　パワーがある。
      ko: |-
        메로엣타가 연주하는 선율에는
        주위 포켓몬을 기쁘게 하거나
        슬프게 할 정도의 힘이 있다.
      en: |-
        The melodies sung by Meloetta have the power to
        make Pokémon that hear them happy or sad.
      fr: |-
        Les mélodies enivrantes de Meloetta touchent les
        Pokémon, pouvant les rendre heureux ou tristes.
      de: |-
        Es besitzt die Macht, Pokémon, die sich in seiner
        Nähe aufhalten, mit seinen Melodien froh oder
        traurig zu stimmen.
      es: |-
        Las melodías que canta Meloetta tienen el poder de
        hacer sentir felicidad a los Pokémon que hay a su
        alrededor.
      it: |-
        Canta una melodia che ha il potere di portare la
        gioia o la tristezza nel cuore dei Pokémon che
        l’ascoltano.
    'y':
      ja-Hrkt: |-
        とくしゅな　はっせいほうで　うたう
        メロディは　きいた　ものの
        かんじょうを　じざいに　あやつる。
      ja: |-
        特殊な　発声法で　歌う　メロディは
        聞いた者の　感情を
        自在に　操る。
      ko: |-
        특수한 발성법으로 노래하는
        멜로디는 노래를 들은 자의
        감정을 자유자재로 조종한다.
      en: |-
        Its melodies are sung with a special vocalization
        method that can control the feelings of those who
        hear it.
      fr: |-
        Sa voix si particulière lui permet de chanter des
        mélodies qui ensorcellent les gens et modifient
        leurs émotions.
      de: |-
        Wer die Melodie hört, die es in einer speziellen
        Stimmlage von sich gibt, steht voll in seinem Bann.
      es: |-
        Controla los sentimientos de los que escuchan las
        melodías que emite con su singular vocalización.
      it: |-
        Controlla a suo piacimento le emozioni di coloro
        che ascoltano i suoi singolari vocalizzi.
