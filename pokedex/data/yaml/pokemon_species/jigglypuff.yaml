jigglypuff:
  base_happiness: 50
  capture_rate: 170
  color: pink
  egg_groups:
    - fairy
  evolution_chain: jigglypuff
  evolves_from: igglybuff
  flavor_text:
    red:
      en: |-
        When its huge eyes
        light up, it sings
        a mysteriouslysoothing melody
        that lulls its
        enemies to sleep.
    blue:
      en: |-
        When its huge eyes
        light up, it sings
        a mysteriouslysoothing melody
        that lulls its
        enemies to sleep.
    yellow:
      en: |-
        Uses its alluring
        eyes to enrapture
        its foe. It thensings a pleasing
        melody that lulls
        the foe to sleep.
    gold:
      en: |-
        If it inflates to
        SING a lullaby, it
        can perform longerand cause sure
        drowsiness in its
        audience.
    silver:
      en: |-
        Looking into its
        cute, round eyes
        causes it to singa relaxing melody,
        inducing its
        enemies to sleep.
    crystal:
      en: |-
        It rolls its cute
        eyes as it sings a
        soothing lullaby.Its gentle song
        puts anyone who
        hears it to sleep.
    ruby:
      en: |-
        JIGGLYPUFF’s vocal chords can freely
        adjust the wavelength of its voice.
        This POKéMON uses this ability to singat precisely the right wavelength to
        make its foes most drowsy.
    sapphire:
      en: |-
        When this POKéMON sings, it never
        pauses to breathe. If it is in a battle
        against an opponent that does noteasily fall asleep, JIGGLYPUFF cannot
        breathe, endangering its life.
    emerald:
      en: |-
        Nothing can avoid falling asleep hearing a
        JIGGLYPUFF’s song. The sound waves of its
        singing voice match the brain waves of
        someone in a deep sleep.
    firered:
      en: |-
        It captivates foes with its huge, round
        eyes, then lulls them to sleep by singing
        a soothing melody.
    leafgreen:
      en: |-
        When its huge eyes waver, it sings a
        mysteriously soothing melody that lulls
        its enemies to sleep.
    diamond:
      en: |-
        When it wavers its big, round
        eyes, it begins singing a lullaby
        that makes everyone drowsy.
    pearl:
      en: |-
        When it wavers its big, round
        eyes, it begins singing a lullaby
        that makes everyone drowsy.
    platinum:
      en: |-
        When it wavers its big, round
        eyes, it begins singing a lullaby
        that makes everyone drowsy.
    heartgold:
      en: |-
        If it inflates to sing a lullaby,
        it can perform longer and cause
        sure drowsiness in its audience.
    soulsilver:
      en: |-
        Looking into its cute, round eyes
        causes it to sing a relaxing melody,
        inducing its enemies to sleep.
    black:
      en: |-
        When it wavers its big, round
        eyes, it begins singing a lullaby
        that makes everyone drowsy.
      fr: |-
        Lorsqu’il roule ses grands yeux
        ronds, il entonne une berceuse
        qui endort son auditoire.
    white:
      en: |-
        When it wavers its big, round
        eyes, it begins singing a lullaby
        that makes everyone drowsy.
      fr: |-
        Lorsqu’il roule ses grands yeux
        ronds, il entonne une berceuse
        qui endort son auditoire.
    black-2:
      en: |-
        Looking into its cute, round eyes makes
        it start singing a song so pleasant
        listeners can’t help but fall asleep.
    white-2:
      en: |-
        Looking into its cute, round eyes makes
        it start singing a song so pleasant
        listeners can’t help but fall asleep.
    x:
      ja-Hrkt: |-
        まるくて　おおきい　ひとみで
        さそいこみ　ここちよい　うたを
        うたい　あいてを　ねむらせる。
      ja: |-
        まるくて　大きい　瞳で　誘いこみ
        心地よい　歌を　歌い
        相手を　眠らせる。
      ko: |-
        동그랗고 커다란 눈동자로
        유인하고 기분 좋은 노래를
        불러 상대방을 잠들게 한다.
      en: |-
        It captivates foes with its huge, round eyes,
        then lulls them to sleep by singing a
        soothing melody.
      fr: |-
        Il hypnotise ses ennemis grâce à ses grands yeux
        avant de les plonger dans un profond sommeil en
        chantant une douce mélopée.
      de: |-
        Es fesselt die Gegner mit seinen großen,
        runden Augen und versetzt sie in Schlaf,
        indem es eine beruhigende Melodie singt.
      es: |-
        Cautiva con la mirada a su enemigo y hace que se
        quede profundamente dormido mientras entona una
        dulce melodía.
      it: |-
        Cattura l’attenzione dei nemici grazie agli enormi
        occhi rotondi, per poi farli addormentare con una
        dolce ninnananna.
    'y':
      ja-Hrkt: |-
        おおきく　からだを　ふくらませてから
        うたう　こもりうたは　いつもより
        ながくて　ぜったいに　ねむくなる。
      ja: |-
        大きく　体を　ふくらませてから
        歌う　子守歌は　いつもより
        長くて　ぜったいに　眠くなる。
      ko: |-
        크게 몸을 부풀려
        노래하는 자장가는 평소보다
        길어서 반드시 잠이 온다.
      en: |-
        If it inflates to sing a lullaby, it can perform longer
        and cause sure drowsiness in its audience.
      fr: |-
        En se gonflant, il peut chanter une longue berceuse
        qui endort inévitablement ses adversaires.
      de: |-
        Wenn es Gesang einsetzt, steigt seine Ausdauer
        und seine Zuhörer werden in Tiefschlaf versetzt.
      es: |-
        Si se hincha para cantar una nana, cantará más tiempo
        y podría causar sopor en el público.
      it: |-
        Se si gonfia e usa il suo Canto diventa più resistente
        e causa una forte sonnolenza in chi lo ascolta.
    omega-ruby:
      ja-Hrkt: |-
        こえの　はちょうを　じざいに　かえる　せいたいを
        もっているので　あいてが　いちばん　ねむくなる
        はちょうで　うたを　うたう　ことが　できる。
      ja: |-
        声の　波長を　自在に　変える　声帯を
        持っているので　相手が　いちばん　眠くなる
        波長で　歌を　歌う　ことが　できる。
      ko: |-
        목소리의 파장을 자유로이 바꿀 수 있는
        성대가 있어서 상대가 가장 졸리게 되는
        파장으로 노래를 부를 수 있다.
      en: |-
        Jigglypuff’s vocal cords can freely adjust the wavelength of its
        voice. This Pokémon uses this ability to sing at precisely the
        right wavelength to make its foes most drowsy.
      fr: |-
        Rondoudou utilise ses cordes vocales pour ajuster librement
        la longueur d’onde de sa voix. Cela permet à ce Pokémon
        de chanter en utilisant une longueur d’onde qui endort
        ses ennemis.
      de: |-
        Pummeluffs Stimmbänder können die Tonlage seiner Stimme
        beliebig variieren. Dieses Pokémon benutzt diese Fähigkeit,
        um seine Gegner mit monotonem Gesang in Tiefschlaf zu
        versetzen.
      es: |-
        Jigglypuff tiene unas cuerdas vocales que ajustan sin problema
        la longitud de onda de su voz. Este Pokémon usa la habilidad
        que tiene para cantar con la longitud de onda necesaria para
        adormecer a su rival.
      it: |-
        Le corde vocali di Jigglypuff gli consentono di cantare
        esattamente alla lunghezza d’onda richiesta per
        addormentare il suo avversario.
    alpha-sapphire:
      ja-Hrkt: |-
        うたう　ときは　いちども　いきつぎをしない。
        なかなか　ねむらない　てきを　あいてに　した
        ときは　いきを　できない　プリンも　いのちがけ。
      ja: |-
        歌う　ときは　一度も　息継ぎをしない。
        中々　眠らない　敵を　相手に　した
        ときは　息を　出来ない　プリンも　命懸け。
      ko: |-
        노래할 때는 한 번도 숨을 쉬지 않는다.
        어지간히 잠들지 않는 상대와 맞설 때는
        숨을 쉴 수 없기에 푸린도 필사적이다.
      en: |-
        When this Pokémon sings, it never pauses to breathe.
        If it is in a battle against an opponent that does not easily
        fall asleep, Jigglypuff cannot breathe, endangering its life.
      fr: |-
        Lorsque ce Pokémon chante, il ne s’arrête pas pour respirer.
        Quand il se bat contre un adversaire qu’il ne peut pas
        facilement endormir, Rondoudou reste donc sans respirer,
        mettant sa vie en danger.
      de: |-
        Während dieses Pokémon singt, holt es niemals Luft.
        Im Kampf gegen einen Gegner, der nicht so leicht in Schlaf
        zu versetzen ist, kann Pummeluff nicht atmen. Leider gefährdet
        es sich dadurch selbst.
      es: |-
        Cuando este Pokémon canta, no para nunca para respirar.
        Si en combate el enemigo no se queda dormido con facilidad,
        Jigglypuff no podrá respirar y su vida correrá peligro.
      it: |-
        Quando canta, Jigglypuff non si ferma a prendere fiato.
        Se lotta contro un nemico che non si addormenta facilmente,
        non respira rischiando così di esaurire tutte le sue energie.
    sun:
      ja-Hrkt: |-
        おおきく　おなかを　ふくらませて
        ふしぎな　メロディーを　うたう。
        きくと　すぐに　ねむくなるぞ。
      ja: |-
        大きく　お腹を　膨らませて
        不思議な　メロディーを　歌う。
        聞くと　すぐに　眠くなるぞ。
      ko: |-
        배를 크게 부풀려서
        신비한 멜로디를 노래한다.
        들으면 바로 졸음이 쏟아진다.
      zh-Hant: |-
        讓肚子脹得大大的，
        唱出神奇的旋律。
        聽到後就會馬上變得昏昏欲睡。
      zh-Hans: |-
        把肚子鼓得大大的，
        唱出神奇的旋律。
        听到后就会马上昏昏欲睡。
      en: |-
        It hugely inflates its stomach and sings a
        mysterious melody. If you hear this melody,
        you’ll become sleepy right away.
      fr: |-
        Ce Pokémon aime inspirer profondément
        et chanter une mélodie mystérieuse qui endort
        immédiatement tous ceux qui l’entendent.
      de: |-
        Es kann tief einatmen und seinen Bauch mit Luft
        füllen, um ein sonderbares Lied anzustimmen.
        Wer dieses hört, schläft auf der Stelle ein.
      es: |-
        Hincha su vientre considerablemente y entona
        una melodía misteriosa que duerme en el acto
        a todo aquel que la oye.
      it: |-
        Gonfia la pancia per cantare una melodia
        misteriosa che fa addormentare chiunque
        l’ascolti.
    moon:
      ja-Hrkt: |-
        １２オクターブを　こえる　せいいきを
        もつが　うたが　うまいか　どうかは
        それぞれの　プリンの　どりょくしだい。
      ja: |-
        １２オクターブを　超える　声域を
        持つが　歌が　上手いか　どうかは
        それぞれの　プリンの　努力次第。
      ko: |-
        12옥타브를 넘는 음역을
        지녔지만 노래를 잘하는지는
        푸린 저마다의 노력에 달렸다.
      zh-Hant: |-
        擁有超過１２個八度音的音域，
        不過歌唱得好不好就要看
        每隻胖丁自己努力的程度了。
      zh-Hans: |-
        拥有超过１２个音阶的音域，
        至于歌唱得好不好就要靠
        胖丁们各自努力了。
      en: |-
        Jigglypuff possess a vocal range that exceeds
        12 octaves, but each individual’s singing skill
        depends on its own effort.
      fr: |-
        Cette espèce possède une tessiture de douze
        octaves, mais la beauté du chant dépend des
        efforts déployés par chaque individu.
      de: |-
        Sein Stimmumfang übersteigt zwölf Oktaven.
        Wie gut ein Pummeluff singen kann, hängt
        jedoch davon ab, wie fleißig es übt.
      es: |-
        Su tesitura suele ser de 12 octavas, pero su
        habilidad en el canto dependerá del esfuerzo
        que realice cada individuo.
      it: |-
        Ha un’estensione vocale più ampia di 12 ottave.
        L’abilità nel canto è diversa da un esemplare
        all’altro e dipende dalla dedizione personale.
    ultra-sun:
      ja-Hrkt: |-
        デパートの　しんぐコーナーには
        プリンの　ふしぎな　こもりうたを
        しゅうろくしたＣＤが　うられている。
      ja: |-
        デパートの　寝具コーナーには
        プリンの　不思議な　子守唄を
        収録した　ＣＤが　売られている。
      ko: |-
        백화점 침구 코너에는
        푸린의 신비한 자장가를
        수록한 CD를 판매하고 있다.
      zh-Hant: |-
        在百貨公司的寢具區
        可以買到收錄著胖丁那
        奇妙搖籃曲的ＣＤ。
      zh-Hans: |-
        可以在百货商店的寝具区
        买到收录有胖丁那
        神奇摇篮曲的ＣＤ。
      en: |-
        Recordings of Jigglypuff’s strange lullabies can
        be purchased from department stores. These
        CDs can be found near the bedding area.
      fr: |-
        Les rayons literie des magasins proposent
        généralement des CD de berceuses chantées
        par des Rondoudou.
      de: |-
        In der Bettenabteilung von Kaufhäusern erhält
        man auch CDs mit Pummeluffs wundersam
        einlullendem Gesang.
      es: |-
        En la sección de muebles de dormitorio de los
        grandes almacenes se pueden encontrar discos
        recopilatorios de nanas cantadas por Jigglypuff.
      it: |-
        Ai grandi magazzini nel reparto camera da letto
        sono in vendita dei CD con la registrazione della
        misteriosa ninnananna cantata da Jigglypuff.
    ultra-moon:
      ja-Hrkt: |-
        うたう　うたは　すむ　ちほうによって
        ぜんぜん　ちがっている。　なかには
        シャウトするような　ものまで　あるぞ。
      ja: |-
        歌う　歌は　棲む　地方によって
        全然　違っている。　中には
        シャウトするような　ものまで　あるぞ。
      ko: |-
        부르는 노래는 서식하는 지방에
        따라 전혀 다르다. 그중에는
        샤우팅하는 듯한 노래도 있다.
      zh-Hant: |-
        隨著棲息的地方不同，所唱的歌
        也完全不一樣。甚至有一部分胖丁
        唱的歌聽起來就像是在大吼大叫。
      zh-Hans: |-
        栖息的地区不同，它唱的歌
        也完全不同。里面甚至还有
        一些歌听起来像是在大喊大叫。
      en: |-
        The songs they sing are totally different
        depending on the region they live in. Some even
        sound like they’re shouting!
      fr: |-
        Les airs qu’il chante varient selon la région
        où il habite. Certains chants s’apparentent
        à des hurlements.
      de: |-
        Sein Gesang unterscheidet sich je nach der
        Region, in der es lebt. Mancherorts erinnert er
        mehr an Geschrei.
      es: |-
        Su canto varía enormemente de una región a
        otra. En algunos casos, más que cantos parecen
        aullidos.
      it: |-
        Il suo canto è diversissimo a seconda della
        regione in cui vive. In alcuni casi, più che
        cantare sembra quasi che urli.
    lets-go-pikachu:
      ja-Hrkt: |-
        つぶらな　ひとみで　あいてを
        みつめたあと　ふしぎで　ここちよい
        うたを　きかせて　ねむらせてしまう。
      ja: |-
        つぶらな　瞳で　相手を
        見つめたあと　不思議で　心地よい
        歌を　聴かせて　眠らせてしまう。
      ko: |-
        초롱초롱한 눈동자로 상대를
        바라본 다음 이상하고 기분 좋은
        노래를 불러서 잠들게 한다.
      zh-Hant: |-
        會用圓圓的大眼睛凝視對手，
        然後唱出令人舒服的奇妙歌曲，
        讓對手陷入夢鄉。
      zh-Hans: |-
        它会用圆溜溜的大眼睛盯着
        对手唱起不可思议的歌曲，这
        令人舒服的歌曲会让对手睡着。
      en: |-
        Uses its cute round eyes to enrapture its foe.
        It then sings a pleasing melody that lulls
        the foe to sleep.
      fr: |-
        Il déstabilise ses adversaires grâce à son regard,
        puis chante une berceuse pour les endormir.
      de: |-
        Es betört Gegner mit seinen Kulleraugen und
        singt ihnen dann ein mysteriöses, wohlklingendes
        Lied vor, das sie in den Schlaf lullt.
      es: |-
        Tras fijar su tierna mirada en el objetivo,
        entona una dulce y misteriosa melodía para
        adormecerlo.
      it: |-
        Usa gli enormi occhi per ammaliare i
        nemici, poi canta una dolce melodia per
        addormentarli.
    lets-go-eevee:
      ja-Hrkt: |-
        つぶらな　ひとみで　あいてを
        みつめたあと　ふしぎで　ここちよい
        うたを　きかせて　ねむらせてしまう。
      ja: |-
        つぶらな　瞳で　相手を
        見つめたあと　不思議で　心地よい
        歌を　聴かせて　眠らせてしまう。
      ko: |-
        초롱초롱한 눈동자로 상대를
        바라본 다음 이상하고 기분 좋은
        노래를 불러서 잠들게 한다.
      zh-Hant: |-
        會用圓圓的大眼睛凝視對手，
        然後唱出令人舒服的奇妙歌曲，
        讓對手陷入夢鄉。
      zh-Hans: |-
        它会用圆溜溜的大眼睛盯着
        对手唱起不可思议的歌曲，这
        令人舒服的歌曲会让对手睡着。
      en: |-
        Uses its cute round eyes to enrapture its foe.
        It then sings a pleasing melody that lulls
        the foe to sleep.
      fr: |-
        Il déstabilise ses adversaires grâce à son regard,
        puis chante une berceuse pour les endormir.
      de: |-
        Es betört Gegner mit seinen Kulleraugen und
        singt ihnen dann ein mysteriöses, wohlklingendes
        Lied vor, das sie in den Schlaf lullt.
      es: |-
        Tras fijar su tierna mirada en el objetivo,
        entona una dulce y misteriosa melodía para
        adormecerlo.
      it: |-
        Usa gli enormi occhi per ammaliare i
        nemici, poi canta una dolce melodia per
        addormentarli.
    sword:
      ja-Hrkt: |-
        はいかつりょうは　ポケモンかいでも
        トップクラス。　あいてが　ねむるまで
        こもりうたを　うたいつづけるぞ。
      ja: |-
        肺活量は　ポケモン界でも
        トップクラス。　相手が　眠るまで
        子守唄を　歌いつづけるぞ。
      ko: |-
        폐활량은 포켓몬 중에서도
        톱클래스다. 상대가 잠들 때까지
        자장가를 계속 부른다.
      zh-Hant: |-
        肺活量之大在寶可夢界
        數一數二。會不停唱搖籃曲
        直到對方睡著為止。
      zh-Hans: |-
        肺活量之大，在整个宝可梦界
        数一数二。会一直哼唱摇篮曲
        直到对方睡着。
      en: |-
        Jigglypuff has top-notch lung capacity, even by
        comparison to other Pokémon. It won’t stop
        singing its lullabies until its foes fall asleep.
      fr: |-
        Il a une des meilleures capacités pulmonaires
        parmi les Pokémon. Il chante des berceuses à
        son adversaire jusqu’à ce que sommeil s’ensuive.
      de: |-
        Sein Lungenvolumen übersteigt das der meisten
        anderen Pokémon. Es singt so lange Schlaflieder,
        bis seine Gegner eingenickt sind.
      es: |-
        Su capacidad pulmonar es excepcional, incluso
        para un Pokémon. Es capaz de cantar nanas sin
        cesar hasta que su rival se duerma.
      it: |-
        Dotato di una capacità polmonare fra le migliori
        nel mondo Pokémon, canta una ninnananna
        finché il suo avversario non s’addormenta.
    shield:
      ja-Hrkt: |-
        こえの　はちょうを　じざいに　かえて
        きくと　ぜったいに　ねむくなる
        ふしぎな　メロディーを　うたう。
      ja: |-
        声の　波長を　自在に　変えて
        聞くと　絶対に　眠くなる
        不思議な　メロディーを　歌う。
      ko: |-
        목소리 파장을 자유자재로 바꾸어
        들으면 반드시 잠드는
        신비한 멜로디를 노래한다.
      zh-Hant: |-
        會自在地改變聲音的波長，
        唱出一聽見就絕對會
        昏昏欲睡的神奇旋律。
      zh-Hans: |-
        能够随意改变声音的波长，
        唱出听了绝对会
        犯困的神奇旋律。
