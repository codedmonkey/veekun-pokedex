appletun:
  base_happiness: 50
  capture_rate: 45
  color: green
  egg_groups:
    - plant
    - dragon
  evolution_chain: applin
  evolves_from: applin
  flavor_text:
    sword:
      ja-Hrkt: |-
        あまい　りんごを　たべて　しんか。
        からだから　あまい　においを　だして
        エサの　むしポケモンを　ひきよせる。
      ja: |-
        甘い　りんごを　食べて　進化。
        体から　甘い　においを　だして
        餌の　虫ポケモンを　引き寄せる。
      ko: |-
        달콤한 사과를 먹고 진화했다.
        몸에서 달콤한 향기를 내보내서
        먹이인 벌레포켓몬을 유인한다.
      zh-Hant: |-
        啃果蟲吃了甜蘋果後進化而成。
        以蟲寶可夢為食，會從體內發出
        甜甜的香味引誘牠們上鉤。
      zh-Hans: |-
        啃果虫吃了甜苹果后进化而成。
        以虫宝可梦为食，会从体内发出
        甜甜的香味引诱它们上钩。
      en: |-
        Eating a sweet apple caused its evolution.
        A nectarous scent wafts from its body, luring in
        the bug Pokémon it preys on.
      fr: |-
        Il a évolué après avoir mangé une pomme sucrée.
        Il attire ses proies, les Pokémon Insecte,
        en dégageant un parfum mielleux.
      de: |-
        Nach dem Verzehr eines süßen Apfels hat es sich
        entwickelt. Es verströmt einen süßen Duft und
        lockt damit sein Futter an: Käfer-Pokémon.
      es: |-
        Ha evolucionado tras ingerir una manzana dulce.
        De ahí que el olor que emana para atraer a sus
        presas, los Pokémon insecto, sea tan agradable.
      it: |-
        Si è evoluto dopo aver mangiato una mela dolce.
        Si nutre di Pokémon Coleottero, che attira
        emanando un dolce profumo dal corpo.
    shield:
      ja-Hrkt: |-
        あまい　みつで　からだが　おおわれ
        せなかの　かわは　とくに　あまく
        むかしは　こどもの　おやつだった。
      ja: |-
        甘い　蜜で　体が　おおわれ
        背中の　皮は　とくに　甘く
        昔は　子どもの　おやつだった。
      ko: |-
        달콤한 꿀로 몸이 둘러싸여 있다.
        등의 껍질은 특히 더 달콤해서
        옛날에는 어린이 간식이었다.
      zh-Hant: |-
        身體被甜甜的蜜汁包裹，
        背部的皮尤其甘甜，
        過去曾經是小孩的零食。
      zh-Hans: |-
        身体被甜甜的蜜汁包裹，
        背部的皮尤其甘甜，
        过去曾经是小孩的零食。
      en: |-
        Its body is covered in sweet nectar, and the
        skin on its back is especially yummy. Children
        used to have it as a snack.
      fr: |-
        Son corps est recouvert de nectar.
        La peau de son dos, particulièrement sucrée,
        constituait jadis le goûter des enfants.
      de: |-
        Sein Körper wird von süßem Nektar bedeckt und
        die Schale auf seinem Rücken ist besonders süß.
        Früher war diese ein Leckerbissen für Kinder.
      es: |-
        Su cuerpo está recubierto de néctar. La piel de
        la espalda es tan dulce que los niños de antaño
        solían tomarla como merienda.
      it: |-
        È ricoperto di una specie di sciroppo. La buccia
        sulla sua schiena, particolarmente dolce, una
        volta veniva data ai bambini per merenda.
