castform:
  base_happiness: 70
  capture_rate: 45
  color: gray
  egg_groups:
    - fairy
    - indeterminate
  evolution_chain: castform
  evolves_from: ~
  flavor_text:
    ruby:
      en: |-
        CASTFORM’s appearance changes with
        the weather.
        This POKéMON gained the ability to usethe vast power of nature to protect
        its tiny body.
    sapphire:
      en: |-
        CASTFORM borrows the power of nature
        to transform itself into the guises of
        the sun, rain clouds, and snow clouds.This POKéMON’s feelings change with the
        weather.
    emerald:
      en: |-
        It alters its form depending on the
        weather. Changes in the climate such as
        the temperature and humidity appear to
        affect its cellular structure.
    firered:
      en: |-
        It has the ability to change its form into
        the sun, the rain, or a snow cloud, 
        depending on the weather.
    leafgreen:
      en: |-
        It has the ability to change its form into
        the sun, the rain, or a snow cloud, 
        depending on the weather.
    diamond:
      en: |-
        Its appearance changes with the
        weather. Recently, its molecules
        were found to be just like water.
    pearl:
      en: |-
        Its appearance changes with the
        weather. Recently, its molecules
        were found to be just like water.
    platinum:
      en: |-
        Its appearance changes with the
        weather. Recently, its molecules
        were found to be just like water.
    heartgold:
      en: |-
        This Pokémon can change its cells,
        taking different forms based on
        the temperature and humidity.
    soulsilver:
      en: |-
        This Pokémon can change its cells,
        taking different forms based on
        the temperature and humidity.
    black:
      en: |-
        Its appearance changes with the
        weather. Recently, its molecules
        were found to be just like water.
      fr: |-
        Son aspect change avec la météo.
        On a récemment découvert que ses
        molécules étaient pareilles à l’eau.
    white:
      en: |-
        Its appearance changes with the
        weather. Recently, its molecules
        were found to be just like water.
      fr: |-
        Son aspect change avec la météo.
        On a récemment découvert que ses
        molécules étaient pareilles à l’eau.
    black-2:
      en: |-
        Temperature and weather affect its
        cellular structure, so this Pokémon
        changes form according to the weather.
    white-2:
      en: |-
        Temperature and weather affect its
        cellular structure, so this Pokémon
        changes form according to the weather.
    x:
      ja-Hrkt: |-
        きおんや　しつどの　へんかが
        からだの　さいぼうに　えいきょうして
        すがたを　かえる　ポケモン。
      ja: |-
        気温や　湿度の　変化が
        体の　細胞に　影響して
        姿を　変える　ポケモン。
      ko: |-
        기온이나 습도의 변화가
        몸의 세포에 영향을 주어
        모습을 바꾸는 포켓몬이다.
      en: |-
        This Pokémon can change its cells, taking different
        forms based on the temperature and humidity.
      fr: |-
        Les variations de température ou d’humidité affectent
        sa structure cellulaire et son apparence.
      de: |-
        Formeo kann seine Gestalt ändern. Seine Zellen
        reagieren auf Temperaturschwankungen und
        Feuchtigkeit.
      es: |-
        Sus células son muy sensibles a los cambios de
        temperatura y humedad y se adapta sin problema.
      it: |-
        Il suo aspetto varia con l’umidità e la temperatura,
        che influenzano la sua struttura molecolare.
    'y':
      ja-Hrkt: |-
        しぜんの　ちからを　うけて　たいよう
        あまみず　ゆきぐもと　すがたを
        かえる　のうりょくを　もっている。
      ja: |-
        自然の　力を　受けて
        太陽　雨水　雪雲と　姿を　変える
        能力を　持っている。
      ko: |-
        자연의 힘을 받아 태양,
        빗물, 설운으로 모습을
        바꾸는 능력을 가지고 있다.
      en: |-
        It has the ability to change its form into the sun,
        the rain, or a snow cloud, depending on
        the weather.
      fr: |-
        Morphéo a la capacité de changer son apparence
        en fonction du temps. Il utilise la force de la nature
        pour combattre.
      de: |-
        Es verfügt über die Eigenschaft, seinen Körper
        in die Sonne, den Regen oder eine Schneewolke,
        je nach Wetter, zu verändern.
      es: |-
        Tiene la habilidad de cambiar y adaptarse al tiempo.
        Según el clima, se transformará en sol, nubarrones
        de lluvia o nieve.
      it: |-
        Ha la capacità di trasformarsi in sole, pioggia o in una
        nuvola di neve, secondo le condizioni atmosferiche.
    omega-ruby:
      ja-Hrkt: |-
        てんきに　よって　すがたが　かわる　ポケモン。
        ちいさい　からだを　まもる　ために　だいしぜんの
        おおきな　パワーを　つかえる　ように　なった。
      ja: |-
        天気に　よって　姿が　変わる　ポケモン。
        小さい　体を　守る　ために　大自然の
        大きな　パワーを　使える　ように　なった。
      ko: |-
        날씨에 따라 모습이 바뀌는 포켓몬이다.
        작은 몸을 지키기 위해 대자연의
        거대한 힘을 사용할 수 있게 됐다.
      en: |-
        Castform’s appearance changes with the weather.
        This Pokémon gained the ability to use the vast power of
        nature to protect its tiny body.
      fr: |-
        L’apparence de Morphéo change en fonction du temps.
        Ce Pokémon a appris à utiliser l’immense pouvoir de la nature
        pour protéger son corps minuscule.
      de: |-
        Formeos Erscheinung ändert sich mit dem Wetter. Dieses
        Pokémon hat die Fähigkeit erworben, die mächtige Kraft der
        Natur zu nutzen, um seinen winzigen Körper zu schützen.
      es: |-
        La forma de Castform cambia con las variaciones del tiempo.
        Este Pokémon consiguió aprender a usar el gran poder de la
        naturaleza para proteger el pequeño cuerpo que tiene.
      it: |-
        L’aspetto di Castform cambia con le condizioni atmosferiche.
        Questo Pokémon ha imparato a usare la potente forza
        della natura per proteggere il suo corpicino indifeso.
    alpha-sapphire:
      ja-Hrkt: |-
        しぜんの　ちからを　うけて　たいよう　あまみず
        ゆきぐもに　すがたを　かえる　ポケモン。
        きしょうが　かわると　きしょうも　かわるぞ。
      ja: |-
        自然の　力を　受けて　太陽　雨水
        雪雲に　姿を　変える　ポケモン。
        気象が　変わると　気性も　変わるぞ。
      ko: |-
        자연의 힘을 받아 태양과 빗방울
        그리고 설운으로 모습을 바꾸는 포켓몬이다.
        날씨가 바뀌면 기질도 바뀐다.
      en: |-
        Castform borrows the power of nature to transform itself
        into the guises of the sun, rain, and snow-clouds.
        This Pokémon’s feelings change with the weather.
      fr: |-
        Morphéo emprunte le pouvoir de la nature pour prendre
        l’apparence du soleil, de la pluie ou de la neige. Le type
        de ce Pokémon change en fonction du temps.
      de: |-
        Formeo bedient sich der Kraft der Natur, um die Gestalt
        der Sonne, des Regens oder von Schneewolken anzunehmen.
        Die Gefühlslage dieses Pokémon verändert sich mit dem
        Wetter.
      es: |-
        Castform se vale del poder de la naturaleza para tomar el
        aspecto del sol, la lluvia o nubarrones de nieve. El estado de
        ánimo de este Pokémon varía según el clima.
      it: |-
        Castform usa il potere della natura per trasformarsi in sole,
        gocce di pioggia e nubi nevose. Il tipo di questo Pokémon
        varia con i mutamenti meteorologici.
    sun:
      ja-Hrkt: |-
        てんきに　よって　すがたを　かえる。
        きおんや　しつどの　へんかが
        さいぼうに　えいきょう　するらしい。
      ja: |-
        天気に　よって　姿を　変える。
        気温や　湿度の　変化が
        細胞に　影響　するらしい。
      ko: |-
        날씨에 따라 모습을 바꾼다.
        기온과 습도의 변화가
        세포에 영향을 준다고 한다.
      zh-Hant: |-
        會隨著天氣而改變樣子。
        氣溫和濕度的變化似乎會
        對牠的細胞產生影響。
      zh-Hans: |-
        根据天气而改变样子。
        听说气温和湿度的变化
        对细胞有影响。
      en: |-
        It changes its form depending on the weather.
        Changes in the temperature or humidity
        appear to affect its cellular structure.
      fr: |-
        Son apparence change en fonction du temps.
        Les changements de température et d’humidité
        influenceraient sa structure cellulaire.
      de: |-
        Es ändert seine Erscheinung je nach Wetter.
        Seine Zellen reagieren anscheinend auf
        Temperatur- und Feuchtigkeitsschwankungen.
      es: |-
        Cambia de apariencia en función del tiempo
        atmosférico. Se cree que las variaciones en la
        temperatura y la humedad afectan a sus células.
      it: |-
        Le sue cellule reagiscono all’umidità
        e alla temperatura, facendogli assumere
        un aspetto diverso a seconda del clima.
    moon:
      ja-Hrkt: |-
        きおんや　しつどに　さいぼうが
        びんかんに　はんのうし　すがたが
        かってに　かわって　しまうのだ。
      ja: |-
        気温や　湿度に　細胞が
        敏感に　反応し　姿が
        勝手に　変わって　しまうのだ。
      ko: |-
        기온이나 습도에 세포가
        민감하게 반응해 모습이
        멋대로 변해버린다.
      zh-Hant: |-
        細胞會靈敏地反應氣溫和濕度，
        導致樣子不由自主地變化。
      zh-Hans: |-
        细胞对气温和湿度的反应很敏感，
        导致样子会随意地变化。
      en: |-
        Its form changes on its own, due to its cells’
        sensitive reactions to temperature and humidity.
      fr: |-
        Comme ses cellules réagissent au moindre
        changement de température ou d’humidité, il ne
        contrôle pas ses changements d’apparence.
      de: |-
        Seine Zellen reagieren empfindlich auf
        Temperatur und Feuchtigkeit, wodurch sich
        unweigerlich seine Gestalt verändert.
      es: |-
        Sus células captan la más mínima variación en la
        temperatura y la humedad, y cambian la forma
        de este Pokémon de manera espontánea.
      it: |-
        Il suo aspetto varia in base all’umidità
        e alla temperatura, che ne influenzano
        la struttura molecolare.
    ultra-sun:
      ja-Hrkt: |-
        てんきに　よって　すがたが　かわるが
        かがくてきな　はんのうの　けっかで
        じぶんの　いしでは　ないらしい。
      ja: |-
        天気に　よって　姿が　変わるが
        化学的な　反応の　結果で
        自分の　意思では　ないらしい。
      ko: |-
        날씨에 따라 모습이 바뀌지만,
        화학 반응의 결과일 뿐
        자신의 의지는 아닌 듯하다.
      zh-Hant: |-
        樣子會隨著天氣而改變。
        這似乎是化學反應產生的結果，
        不受牠自身的意志控制。
      zh-Hans: |-
        样子会根据天气发生变化。
        但这是根据化学反应的结果，
        似乎并不是出于它的本意。
      en: |-
        Although its form changes with the weather,
        that is apparently the result of a chemical
        reaction and not the result of its own free will.
      fr: |-
        Il change de forme en fonction de la météo,
        mais ce phénomène serait en fait une réaction
        chimique indépendante de sa volonté.
      de: |-
        Seine Erscheinung ändert sich je nach Wetter.
        Dies hat weniger mit seinem eigenen Willen zu
        tun als vielmehr mit einer chemischen Reaktion.
      es: |-
        Cambia de apariencia en función del tiempo
        atmosférico, pero se trata más bien de una
        reacción química ajena a su voluntad.
      it: |-
        Il suo aspetto cambia con le condizioni
        atmosferiche per effetto di una reazione
        chimica indipendente dalla sua volontà.
    ultra-moon:
      ja-Hrkt: |-
        てんきに　よって　すがたが　かわる。
        きしょうが　あらくなるほど
        きしょうも　あらっぽく　なってくる。
      ja: |-
        天気に　よって　姿が　変わる。
        気象が　荒くなるほど
        気性も　荒っぽく　なってくる。
      ko: |-
        날씨에 따라 모습이 바뀐다.
        날씨가 궂을수록
        성질도 난폭해진다.
      zh-Hant: |-
        樣子會隨著天氣而變化。
        天氣越是惡劣，
        性情就會變得越粗暴。
      zh-Hans: |-
        样子会根据天气发生变化。
        天气越恶劣，
        性格也会变得越暴躁。
      en: |-
        Its form changes depending on the weather.
        The rougher conditions get, the rougher
        Castform’s disposition!
      fr: |-
        Il n’y a pas que son apparence qui change en
        fonction de la météo : son tempérament aussi !
        Plus il y a de vent, plus il se montre agressif.
      de: |-
        Seine Gestalt ändert sich abhängig vom Wetter.
        Je ungestümer dieses ist, desto gröber wird
        auch sein Charakter.
      es: |-
        El tiempo atmosférico cambia tanto su aspecto
        como su estado de ánimo. Cuanto más arrecia,
        más agresivo se vuelve.
      it: |-
        Il suo aspetto cambia con le condizioni
        atmosferiche. Più il tempo è brutto, più
        diventa aggressivo.
  form_description:
    en: 'Form changes along with type to match the [weather]{mechanic:weather} in battle, due to []{ability:forecast}.  Castform is always in its normal form outside of battle, regardless of weather.'
