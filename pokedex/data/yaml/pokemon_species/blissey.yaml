        coat of fur. If it does so, this POKéMON
        will rush over to the sad person,however far they may be, to share an
        egg of happiness that brings a smile
        to any face.
    emerald:
      en: |-
        If it senses sadness with its fluffy fur,
        a BLISSEY will rush over to the sad person,
        however far away, to share an egg of
        happiness that brings a smile to any face.
    firered:
      en: |-
        It has a very compassionate nature. If it
        sees a sick POKéMON, it will nurse the
        sufferer back to health.
    leafgreen:
      en: |-
        Anyone who takes even one bite of
        BLISSEY’s egg becomes unfailingly caring
        and pleasant to everyone.
    diamond:
      en: |-
        This kindhearted Pokémon
        nurses sick Pokémon to health.
        It senses feelings of sadness.
    pearl:
      en: |-
        It is a Pokémon that delivers
        happiness. Eating its egg is said
        to make one kind to everyone.
    platinum:
      en: |-
        The eggs it lays are filled with
        happiness. Eating even one bite
        will bring a smile to anyone.
    heartgold:
      en: |-
        Anyone who takes even one taste of
        BLISSEY’s egg becomes unfailingly
        caring and pleasant to everyone.
    soulsilver:
      en: |-
        It has a very compassionate nature.
        If it sees a sick Pokémon, it will
        nurse the sufferer back to health.
    black:
      en: |-
        The eggs it lays are filled with
        happiness. Eating even one bite
        will bring a smile to anyone.
      fr: |-
        Les œufs que pond Leuphorie sont
        un concentré de bonheur dont une
        bouchée suffit à apporter la joie.
    white:
      en: |-
        The eggs it lays are filled with
        happiness. Eating even one bite
        will bring a smile to anyone.
      fr: |-
        Les œufs que pond Leuphorie sont
        un concentré de bonheur dont une
        bouchée suffit à apporter la joie.
    black-2:
      en: |-
        The eggs it lays are filled with
        happiness. Eating even one bite
        will bring a smile to anyone.
    white-2:
      en: |-
        The eggs it lays are filled with
        happiness. Eating even one bite
        will bring a smile to anyone.
    x:
      ja-Hrkt: |-
        ハピナスの　うむ　タマゴには
        しあわせが　つまっていて　ひとくち
        たべると　だれでも　えがおになれる。
      ja: |-
        ハピナスの　産む　タマゴには
        幸せが　つまっていて　ひとくち
        食べると　だれでも　笑顔になれる。
      ko: |-
        해피너스가 낳은 알에는
        행복이 담겨 있어서 한 입 먹으면
        누구든지 웃음 띤 얼굴이 된다.
      en: |-
        The eggs it lays are filled with happiness. Eating
        even one bite will bring a smile to anyone.
      fr: |-
        Les œufs que pond Leuphorie sont un concentré
        de bonheur dont une bouchée suffit à apporter la joie.
      de: |-
        Eier, die es legt, stecken voller Fröhlichkeit.
        Schon ein Bissen erzeugt ein breites Lächeln.
      es: |-
        Los huevos que pone están llenos de felicidad. Solo
        con probar un poquito de uno, cualquiera sonríe.
      it: |-
        Le uova che depone sono piene di felicità. Un
        assaggio rende chiunque allegro.
    'y':
      ja-Hrkt: |-
        よわった　ポケモンを　なおるまで
        かんびょうする　やさしい　ポケモン。
        かなしい　きもちを　キャッチする。
      ja: |-
        弱った　ポケモンを　治るまで
        看病する　優しい　ポケモン。
        悲しい　気持ちを　キャッチする。
      ko: |-
        약해진 포켓몬을 나을 때까지
        간호하는 상냥한 포켓몬이다.
        슬퍼하는 기분을 알아챈다.
      en: |-
        This kindhearted Pokémon nurses sick Pokémon to
        health. It senses feelings of sadness.
      fr: |-
        Ce Pokémon au cœur d’or soigne les Pokémon
        malades. Il ressent la tristesse d’autrui.
      de: |-
        Dieses gutherzige Pokémon pflegt kranke Pokémon
        gesund. Es spürt die Traurigkeit anderer Lebewesen.
      es: |-
        Este amable Pokémon cuida de Pokémon enfermos y
        los sana. Puede percibir la tristeza.
      it: |-
        Questo Pokémon buono cura i Pokémon malati e li
        fa guarire. Percepisce la tristezza altrui.
    omega-ruby:
      ja-Hrkt: |-
        ふわふわの　たいもうで　かなしんでいる　こころを
        キャッチすると　どんなに　とおくでも　かけつけて
        えがおに　なる　しあわせタマゴを　わけてあげる。
      ja: |-
        ふわふわの　体毛で　悲しんでいる　心を
        キャッチすると　どんなに　遠くでも　駆けつけて
        笑顔に　なる　しあわせタマゴを　分けてあげる。
      ko: |-
        푹신푹신한 털로 슬퍼하는 마음을
        감지하면 아무리 멀어도 바로 달려가서
        미소 짓게 되는 행복의알을 나눠준다.
      en: |-
        Blissey senses sadness with its fluffy coat of fur. If it does so,
        this Pokémon will rush over to a sad person, no matter how far
        away, to share a Lucky Egg that brings a smile to any face.
      fr: |-
        Leuphorie ressent la tristesse grâce à son pelage duveteux.
        Lorsqu’il la remarque, ce Pokémon se précipite vers la
        personne triste pour partager avec elle un Œuf Chance,
        capable de faire naître un sourire sur tout visage.
      de: |-
        Heiteira nimmt mit seinem flauschigen Fell Traurigkeit wahr.
        Es hastet zu einer traurigen Person, egal, wie weit diese
        entfernt ist, und teilt ein Glücks-Ei mit ihr, um sie zum
        Lächeln zu bringen.
      es: |-
        Blissey es capaz de sentir la tristeza a través del sedoso
        pelaje. Si detecta que alguien está apenado, irá hasta donde
        esté y compartirá un Huevo Suerte para devolverle la sonrisa.
      it: |-
        Blissey percepisce la tristezza degli altri tramite la sua soffice
        pelliccia. In tal caso si reca da chi è triste, ovunque si trovi,
        per condividere un Fortunuovo che riporta il sorriso
        sul volto afflitto.
    alpha-sapphire:
      ja-Hrkt: |-
        ふわふわの　たいもうで　かなしんでいる　こころを
        キャッチすると　どんなに　とおくでも　かけつけて
        えがおに　なる　しあわせタマゴを　わけてあげる。
      ja: |-
        ふわふわの　体毛で　悲しんでいる　心を
        キャッチすると　どんなに　遠くでも　駆けつけて
        笑顔に　なる　しあわせタマゴを　分けてあげる。
      ko: |-
        푹신푹신한 털로 슬퍼하는 마음을
        감지하면 아무리 멀어도 바로 달려가서
        미소 짓게 되는 행복의알을 나눠준다.
      en: |-
        Blissey senses sadness with its fluffy coat of fur. If it does so,
        this Pokémon will rush over to a sad person, no matter how far
        away, to share a Lucky Egg that brings a smile to any face.
      fr: |-
        Leuphorie ressent la tristesse grâce à son pelage duveteux.
        Lorsqu’il la remarque, ce Pokémon se précipite vers la
        personne triste pour partager avec elle un Œuf Chance,
        capable de faire naître un sourire sur tout visage.
      de: |-
        Heiteira nimmt mit seinem flauschigen Fell Traurigkeit wahr.
        Es hastet zu einer traurigen Person, egal, wie weit diese
        entfernt ist, und teilt ein Glücks-Ei mit ihr, um sie zum
        Lächeln zu bringen.
      es: |-
        Blissey es capaz de sentir la tristeza a través del sedoso
        pelaje. Si detecta que alguien está apenado, irá hasta donde
        esté y compartirá un Huevo Suerte para devolverle la sonrisa.
      it: |-
        Blissey percepisce la tristezza degli altri tramite la sua soffice
        pelliccia. In tal caso si reca da chi è triste, ovunque si trovi,
        per condividere un Fortunuovo che riporta il sorriso
        sul volto afflitto.
    sun:
      ja-Hrkt: |-
        しあわせが　つまっていると　いわれる
        ハピナスの　タマゴを　たべれば　どんな
        きょうぼうな　ポケモンも　おだやかに。
      ja: |-
        幸せが　つまっていると　いわれる
        ハピナスの　タマゴを　食べれば　どんな
        凶暴な　ポケモンも　穏やかに。
      ko: |-
        행복이 가득 차 있다고 전해지는
        해피너스의 알을 먹으면 어떤
        난폭한 포켓몬도 온화해진다.
      zh-Hant: |-
        只要吃了據說飽含著幸福的
        幸福蛋的蛋，無論多麼
        殘暴的寶可夢都會變得溫馴。
      zh-Hans: |-
        如果吃了据说饱含着幸福的
        幸福蛋的蛋，无论怎么
        残暴的宝可梦都会变得温和。
      en: |-
        Even the most ferocious Pokémon become calm
        when they eat Blissey’s egg, which is said
        to be filled with happiness.
      fr: |-
        On dit que les œufs de Leuphorie seraient
        de véritables concentrés de bonheur, capables
        d’adoucir les Pokémon les plus hargneux.
      de: |-
        Ein Bissen von seinem Glücks-Ei, das voller
        Fröhlichkeit steckt, lässt selbst das wildeste
        Pokémon ganz sanft und ruhig werden.
      es: |-
        Se dice que los huevos de Blissey están llenos
        de felicidad y que un solo bocado puede calmar
        hasta al más feroz de los Pokémon.
      it: |-
        Si dice che le sue uova siano ricche di felicità
        e che rendano mansueti persino i Pokémon più
        aggressivi.
    moon:
      ja-Hrkt: |-
        ふわふわの　たいもうは　センサー。
        ポケモンや　ひとの　きもちを
        キャッチすることが　できるのだ。
      ja: |-
        ふわふわの　体毛は　センサー。
        ポケモンや　人の　気持ちを
        キャッチすることが　できるのだ。
      ko: |-
        푹신푹신한 털은 센서다.
        포켓몬이나 사람의 기분을
        캐치할 수 있다.
      zh-Hant: |-
        蓬鬆的體毛有感應的作用。
        能夠察覺寶可夢和人類的心情。
      zh-Hans: |-
        蓬松的体毛是感应器。
        可以捕捉到宝可梦和人类的心情。
      en: |-
        Its fluffy fur coat acts as a sensor, enabling it to
        read the feelings of people and Pokémon.
      fr: |-
        Le pelage de ce Pokémon lui fait office de radar
        à émotions. Il est ainsi capable de capter
        les humeurs des Pokémon et humains alentour.
      de: |-
        Sein flauschiges Fell ist wie ein Sensor,
        mit dem es die Gefühle von Pokémon und
        Menschen wahrnehmen kann.
      es: |-
        Con su sedoso pelaje, que funciona como un
        sensor, puede detectar los sentimientos de los
        Pokémon y las personas.
      it: |-
        È in grado di percepire i sentimenti di Pokémon
        ed esseri umani tramite la sua soffice pelliccia.
    ultra-sun:
      ja-Hrkt: |-
        タマゴは　たべると　しあわせになると
        いわれるほど　ぜっぴん。　しじょうで
        １ばん　たかい　ねだんが　つく。
      ja: |-
        タマゴは　食べると　幸せになると
        いわれるほど　絶品。　市場で
        １番　高い　値段が　つく。
      ko: |-
        알을 먹으면 행복해진다고
        전해질 정도로 맛이 일품이다.
        시장에서 제일 가격이 비싸다.
      zh-Hant: |-
        牠的蛋美味至極，甚至有
        吃了就能獲得幸福的說法，
        所以在市場上的價格是最高的。
      zh-Hans: |-
        这个蛋是天下一绝，
        甚至有吃下去就会获得幸福的说法。
        所以它在市场上的价格是最高的。
      en: |-
        Their eggs are such a delicacy that some say
        eating one will bring you happiness. These eggs
        fetch the highest prices on the market.
      fr: |-
        Ses œufs sont si bons qu’il suffirait d’en manger
        un pour trouver le bonheur. Au marché, c’est
        le produit qui se vend le plus cher.
      de: |-
        Sein Ei ist eine Kostbarkeit, denn es heißt, wer
        davon esse, werde glücklich. Auf dem Markt
        erzielt es deshalb Spitzenpreise.
      es: |-
        Se dice que los huevos de Blissey están tan
        ricos que dan la felicidad a quien los prueba.
        Por eso alcanzan precios exorbitantes.
      it: |-
        Le sue uova sono talmente deliziose che si dice
        rendano felice chiunque le mangi. Per questo
        hanno prezzi altissimi sul mercato.
    ultra-moon:
      ja-Hrkt: |-
        あいじょうに　みちあふれた　ポケモン。
        トレーナーと　こころを　かよわせた
        ラッキーだけが　しんかできるという。
      ja: |-
        愛情に　満ちあふれた　ポケモン。
        トレーナーと　心を　通わせた
        ラッキーだけが　進化できるという。
      ko: |-
        애정이 넘치는 포켓몬이다.
        트레이너와 마음이 통하는
        럭키만이 진화할 수 있다고 한다.
      zh-Hant: |-
        心中充滿了愛的寶可夢。
        據說只有和訓練家心靈相通的
        吉利蛋才能進化。
      zh-Hans: |-
        心中充满着爱的宝可梦。
        据说只有和训练家心灵相通的
        吉利蛋才能进化。
      en: |-
        This Pokémon is overflowing with love. Only
        Chansey that share a strong bond with their
        Trainer can evolve, so people say.
      fr: |-
        Ce Pokémon déborde de compassion.
        On raconte que seuls les Leveinard ayant ouvert
        leur cœur à leur Dresseur peuvent évoluer.
      de: |-
        Es ist ein sehr liebevolles Pokémon. Nur ein
        Chaneira, das in völligem Einklang mit seinem
        Trainer ist, entwickelt sich zu Heiteira.
      es: |-
        Un Pokémon que rebosa amor y del que se dice
        que solo puede evolucionar de un Chansey que
        esté muy unido a su Entrenador.
      it: |-
        È molto affettuoso e comprensivo. Si dice che
        possa evolversi solo da un Chansey che va
        d’amore e d’accordo con il proprio Allenatore.
    sword:
      ja-Hrkt: |-
        よわった　ポケモンを　みつけると
        じぶんの　タマゴを　わけあたえ
        なおるまで　かんびょうを　つづける。
      ja: |-
        弱った　ポケモンを　見つけると
        自分の　タマゴを　分け与え
        治るまで　看病を　続ける。
      ko: |-
        약해진 포켓몬을 발견하면
        자신의 알을 나눠주고
        치료될 때까지 병간호한다.
      zh-Hant: |-
        發現虛弱的寶可夢時就會
        把自己的蛋分給牠，並且
        一直照顧對方直到牠痊癒。
      zh-Hans: |-
        发现虚弱的宝可梦时
        就会把自己的蛋分给它，
        并一直精心照顾它直到痊愈。
      en: |-
        Whenever a Blissey finds a weakened Pokémon,
        it will share its egg and offer its care until the
        other Pokémon is all better.
      fr: |-
        Lorsqu’il croise un Pokémon affaibli, il partage
        son œuf avec ce dernier et lui prodigue des soins
        jusqu’à ce qu’il soit rétabli.
      de: |-
        Stößt Heiteira auf geschwächte Pokémon, teilt es
        sein Ei mit ihnen und pflegt sie wieder gesund.
      es: |-
        Si se encuentra un Pokémon enfermo, comparte
        su huevo con él y lo cuida hasta que se recupera.
      it: |-
        Quando incontra un Pokémon indebolito,
        condivide con lui il proprio uovo e lo accudisce
        fino alla completa guarigione.
    shield:
      ja-Hrkt: |-
        しあわせが　つまった　ふしぎな
        タマゴを　うむ。　たべた　ひとは
        だれにでも　やさしく　なれるという。
      ja: |-
        幸せが　詰まった　不思議な
        タマゴを　産む。　食べた　人は
        誰にでも　優しくなれるという。
      ko: |-
        행복이 가득 찬 신비한
        알을 낳는다. 먹은 사람은
        누구에게나 친절해진다고 한다.
      zh-Hant: |-
        會生下飽含幸福的神奇的蛋。
        據說吃下蛋的人，就能夠
        對任何人都很溫和相待。
      zh-Hans: |-
        会生下装满幸福的奇妙之蛋。
        据说，吃下它的蛋的人，
        能够对所有人都温柔相待。
      en: |-
        Blissey lays mysterious eggs that are filled with
        happiness. It’s said that anyone who eats a
        Blissey egg will start acting kindly to all others.
      fr: |-
        Il pond d’étranges œufs remplis de bonheur.
        On raconte que quiconque en mange un
        devient aimable envers tout le monde.
      de: |-
        Es legt mysteriöse Eier, die voller Glück stecken.
        Wer davon isst, soll anderen gegenüber sorgsam
        und höflich werden.
      es: |-
        Pone unos extraños huevos llenos de felicidad.
        Dicen que aquellos que los prueban se vuelven
        amables con todo el mundo.
      it: |-
        Le sue uova sono un magico concentrato
        di felicità. Si dice che rendano gentile
        chiunque le mangia.
