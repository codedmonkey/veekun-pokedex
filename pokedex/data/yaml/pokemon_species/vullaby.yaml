vullaby:
  base_happiness: 35
  capture_rate: 190
  color: brown
  egg_groups:
    - flying
  evolution_chain: vullaby
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        Its wings are too tiny to allow it to fly.
        As the time approaches for it to evolve,
        it discards the bones it was wearing.
      fr: |-
        Ses ailes sont trop petites pour lui
        permettre de voler. Quand l’évolution
        approche, il sort lui-même de sa coquille.
    white:
      en: |-
        They tend to guard their posteriors
        with suitable bones they have found.
        They pursue weak Pokémon.
      fr: |-
        Il trouve des os convenables pour
        protéger ses arrières, puis harcèle
        les Pokémon plus faibles que lui.
    black-2:
      en: |-
        Their wings are too tiny to allow them to
        fly. They guard their posteriors with
        bones that were gathered by Mandibuzz.
    white-2:
      en: |-
        Their wings are too tiny to allow them to
        fly. They guard their posteriors with
        bones that were gathered by Mandibuzz.
    x:
      ja-Hrkt: |-
        つばさが　ちいさいため　とべない。
        しんかの　ときが　ちかづくと
        じぶんから　ガイコツを　ぬぎすてる。
      ja: |-
        翼が　小さいため　飛べない。
        進化の　ときが　近づくと
        自分から　ガイコツを　脱ぎ捨てる。
      ko: |-
        날개가 작아서 날지 못한다.
        진화가 가까워지면
        자기 스스로 해골을 벗어버린다.
      en: |-
        Its wings are too tiny to allow it to fly. As the time
        approaches for it to evolve, it discards the bones
        it was wearing.
      fr: |-
        Ses ailes sont trop petites pour lui permettre de
        voler. Quand l’évolution approche, il sort lui-même
        du crâne qui le protège.
      de: |-
        Seine Flügel sind noch zu klein zum Fliegen.
        Kurz bevor es sich entwickelt, wirft es seine
        Schädelwindel ab.
      es: |-
        No puede volar porque sus alas son muy pequeñas.
        Cuando va a evolucionar, se deshace de su calavera.
      it: |-
        Le piccole ali non gli consentono di volare. Quando si
        avvicina il momento di evolversi, si libera del teschio.
    'y':
      ja-Hrkt: |-
        つばさは　ちいさく　まだ　とべない。
        バルジーナが　あつめてきた
        ガイコツで　おしりを　まもっている。
      ja: |-
        翼は　小さく　まだ　飛べない。
        バルジーナが　集めてきた
        ガイコツで　お尻を　守っている。
      ko: |-
        날개는 작아서 아직 날 수 없다.
        버랜지나가 모아온
        해골로 엉덩이를 지키고 있다.
      en: |-
        Their wings are too tiny to allow them to fly.
        They guard their posteriors with bones that were
        gathered by Mandibuzz.
      fr: |-
        Ses ailes sont trop petites pour voler. Il protège son
        croupion avec un crâne apporté par un Vaututrice.
      de: |-
        Seine Flügel sind noch zu klein zum Fliegen. Ein von
        Grypheldis beschaffter Schädel schützt seinen Bürzel.
      es: |-
        Sus pequeñas alas no le permiten volar. Usa una
        calavera que le dio Mandibuzz para proteger sus
        posaderas.
      it: |-
        Le sue ali sono ancora piccole e non può volare.
        Usa delle ossa ricevute da Mandibuzz per riparare
        il suo bacino.
    omega-ruby:
      ja-Hrkt: |-
        つばさが　ちいさいため　とべない。
        しんかの　ときが　ちかづくと
        じぶんから　ガイコツを　ぬぎすてる。
      ja: |-
        翼が　小さいため　飛べない。
        進化の　ときが　近づくと
        自分から　ガイコツを　脱ぎ捨てる。
      ko: |-
        날개가 작아서 날지 못한다.
        진화가 가까워지면
        자기 스스로 해골을 벗어버린다.
      en: |-
        Its wings are too tiny to allow it to fly. As the time
        approaches for it to evolve, it discards the bones
        it was wearing.
      fr: |-
        Ses ailes sont trop petites pour lui permettre de voler.
        Quand l’évolution approche, il sort lui-même du crâne
        qui le protège.
      de: |-
        Seine Flügel sind noch zu klein zum Fliegen. Kurz bevor es
        sich entwickelt, wirft es seine Schädelwindel ab.
      es: |-
        No puede volar porque sus alas son muy pequeñas. Cuando
        va a evolucionar, se deshace de su calavera.
      it: |-
        Le piccole ali non gli consentono di volare. Quando si
        avvicina il momento di evolversi, si libera del teschio.
    alpha-sapphire:
      ja-Hrkt: |-
        つばさは　ちいさく　まだ　とべない。
        バルジーナが　あつめてきた
        ガイコツで　おしりを　まもっている。
      ja: |-
        翼は　小さく　まだ　飛べない。
        バルジーナが　集めてきた
        ガイコツで　お尻を　守っている。
      ko: |-
        날개는 작아서 아직 날 수 없다.
        버랜지나가 모아온
        해골로 엉덩이를 지키고 있다.
      en: |-
        Their wings are too tiny to allow them to fly.
        They guard their posteriors with bones that were
        gathered by Mandibuzz.
      fr: |-
        Ses ailes sont trop petites pour voler. Il protège son croupion
        avec un crâne apporté par un Vaututrice.
      de: |-
        Seine Flügel sind noch zu klein zum Fliegen. Ein von
        Grypheldis beschaffter Schädel schützt seinen Bürzel.
      es: |-
        Sus pequeñas alas no le permiten volar. Usa una calavera que
        le dio Mandibuzz para proteger sus posaderas.
      it: |-
        Le sue ali sono ancora piccole e non può volare. Usa delle
        ossa ricevute da Mandibuzz per riparare il suo bacino.
    sun:
      ja-Hrkt: |-
        ぷよぷよの　おしりを　まもるのは
        くった　えものの　ホネ。
        せいちょうのたび　はきかえるよ。
      ja: |-
        ぷよぷよの　お尻を　守るのは
        喰った　獲物の　骨。
        成長のたび　はき替えるよ。
      ko: |-
        포동포동한 엉덩이를 지키는 것은
        먹어버린 먹이의 뼈다.
        성장할 때마다 갈아입는다.
      zh-Hant: |-
        保護著軟綿綿屁股的
        是吃完獵物後剩下的骨頭。
        會隨著每次成長丟棄更換哦。
      zh-Hans: |-
        保护着软乎乎屁股的
        是吃完的猎物的尸骨。
        会随着每次生长丢弃更换哦。
      en: |-
        It protects its plump posterior with the bones
        of prey it has consumed. As it grows, it 
        replaces the bones.
      fr: |-
        Il protège son tendre popotin avec le crâne
        d’une de ses proies. Il en change régulièrement
        en grandissant.
      de: |-
        Seinen weichen Bürzel schützt es mithilfe von
        Schädeln gefressener Beute. Ist es ein Stück
        gewachsen, muss ein größerer Schädel her.
      es: |-
        Protege sus posaderas blanduzcas con los
        huesos de las presas que ha devorado. A
        medida que crece se ve obligado a cambiarlos.
      it: |-
        Protegge il debole bacino con i teschi delle
        prede di cui si nutre. Man mano che cresce,
        deve cambiare il teschio.
    moon:
      ja-Hrkt: |-
        まだまだ　あそびざかり。
        はねが　みじゅくで　とべないので
        ぴょんぴょん　はねまわっているよ。
      ja: |-
        まだまだ　遊び盛り。
        羽が　未熟で　飛べないので
        ぴょんぴょん　跳ね回っているよ。
      ko: |-
        아직 한창 놀 때이다. 날개가
        다 자라지 않아 날지 못하기 때문에
        깡충깡충 뛰어다닌다.
      zh-Hant: |-
        還是貪玩的年紀。
        翅膀還未發達，所以無法飛行，
        會來來回回地蹦蹦跳哦。
      zh-Hans: |-
        还是最爱玩的年纪。
        翅膀还不发达，无法飞行，
        所以会来回地蹦蹦跳哦。
      en: |-
        It can’t fly yet and must wait until its wings have
        developed more. Since it’s still at a playful age,
        it hops around friskily.
      fr: |-
        Il est encore très joueur. Ses ailes n’étant pas
        assez développées pour lui permettre de voler,
        il se déplace en sautillant.
      de: |-
        Dieses Pokémon ist noch sehr verspielt. Seine
        Flügel sind noch zu klein zum Fliegen, es kann
        sich also nur hüpfend fortbewegen.
      es: |-
        Todavía está en su más tierna infancia. Como
        sus alas aún no se han desarrollado del todo,
        se desplaza dando saltos.
      it: |-
        È un giocherellone. Non potendo volare a causa
        delle ali poco sviluppate, si sposta saltellando.
    ultra-sun:
      ja-Hrkt: |-
        ガイコツは　バルジーナが　あたえる。
        つばさは　みじかく　まだ　とべないが
        おおぞらを　ゆめみて　とびはねる。
      ja: |-
        ガイコツは　バルジーナが　与える。
        翼は　短く　まだ　飛べないが
        大空を　夢見て　飛び跳ねる。
      ko: |-
        해골은 버랜지나가 준다.
        날개가 짧아 아직 날지 못하지만,
        넓은 하늘을 꿈꾸며 뛰어오른다.
      zh-Hant: |-
        骸骨是禿鷹娜給的。
        雖然翅膀太短還不能飛，但總是
        因為憧憬著天空而蹦蹦跳跳。
      zh-Hans: |-
        骸骨是秃鹰娜所给予的。
        翅膀很短，还不会飞，
        但是一直憧憬着天空而蹦蹦跳跳的。
      en: |-
        Mandibuzz gives it the bones it wears. Vullaby’s
        wings are short, so it can’t fly yet, but it jumps
        around, dreaming of wide open skies.
      fr: |-
        Sa culotte est un cadeau de Vaututrice.
        Ses petites ailes ne pouvant pas le porter, il est
        condamné à sautiller en rêvant au grand azur.
      de: |-
        Seine Schädelwindel erhält es von Grypheldis.
        Auch wenn seine Flügel noch zu klein dafür sind,
        träumt es vom Fliegen und hüpft wild herum.
      es: |-
        El cráneo que usa de protección es regalo de un
        Mandibuzz. Como sus alas son muy cortas para
        volar, da brincos soñando que vuela por el cielo.
      it: |-
        Ha ricevuto il suo teschio da Mandibuzz.
        Poiché le corte ali non gli permettono di volare,
        saltella sognando un giorno di poterlo fare.
    ultra-moon:
      ja-Hrkt: |-
        たべざかりの　そだちざかり。
        からだの　せいちょうに　あわせて
        ガイコツを　なんども　はきかえるよ。
      ja: |-
        食べ盛りの　育ち盛り。
        身体の　成長に　あわせて
        ガイコツを　何度も　履き替えるよ。
      ko: |-
        한창 먹고 자랄 때다.
        몸의 성장에 맞춰서
        해골을 몇 번이고 갈아입는다.
      zh-Hant: |-
        正處於食慾旺盛的發育期。
        為了配合身體的成長，
        會多次更換所穿的骨頭。
      zh-Hans: |-
        正处于食欲旺盛的发育期。
        为了配合身体的成长，
        会多次更换所穿的骸骨哦。
      en: |-
        Its healthy appetite leads to visible growth
        spurts. It often has to replace the bones it
        wears as its size increases.
      fr: |-
        Ce petit est en pleine croissance et forcit à vue
        d’œil. Il doit donc régulièrement changer le crâne
        qui lui sert de culotte.
      de: |-
        Durch seinen ständigen Appetit hat Skallyk
        fortlaufend Wachstumsschübe. Deshalb muss
        es seine Schädelwindel immerzu auswechseln.
      es: |-
        Demuestra un voraz apetito y aumenta de
        tamaño a vista de ojo. Su continuo crecimiento
        le obliga a cambiar varias veces de cráneo.
      it: |-
        Ha un grande appetito e cresce a vista d’occhio.
        Man mano che la sua taglia aumenta, deve
        cambiare il teschio che indossa.
    sword:
      ja-Hrkt: |-
        ガイコツを　はき　おしりを　ガード。
        はきごこちの　いい　ガイコツを
        めぐり　なかまどうしで　こぜりあう。
      ja: |-
        骸骨を　はき　お尻を　ガード。
        はき心地の　いい　骸骨を
        めぐり　仲間同士で　小競り合う。
      ko: |-
        해골을 입어서 엉덩이를 보호한다.
        착용감이 편안한 해골을 두고
        동료끼리 옥신각신한다.
      zh-Hant: |-
        穿上骸骨來保護屁股。
        會和夥伴互相爭搶
        穿起來舒服的骸骨。
      zh-Hans: |-
        穿上骸骨来保护屁股。
        会和伙伴互相争抢
        穿起来舒服的骸骨。
      en: |-
        It wears a bone to protect its rear.
        It often squabbles with others of its kind over
        particularly comfy bones.
      fr: |-
        Ils protègent leur derrière en portant un crâne
        comme couche. Ils se disputent les plus douillets
        d’entre eux.
      de: |-
        Sie schützen ihren Bürzel mit einer Schädelwindel.
        Untereinander streiten sie sich um den Schädel
        mit dem höchsten Tragekomfort.
      es: |-
        Usa una calavera para proteger sus posaderas.
        A menudo pelea con sus congéneres para
        hacerse con la más cómoda.
      it: |-
        Indossa il teschio per proteggere il suo bacino.
        Spesso litiga con i suoi consimili per accaparrarsi
        il teschio più comodo.
    shield:
      ja-Hrkt: |-
        すぐに　おおきく　そだつので
        おしりの　ガイコツは　すの　なかで
        おさがりとして　つかいまわされる。
      ja: |-
        すぐに　大きく　育つので
        お尻の　骸骨は　巣の　中で
        お下がりとして　使いまわされる。
      ko: |-
        금방 크게 성장하므로
        엉덩이의 해골은 둥지 안에서
        대물림되어 계속 사용된다.
      zh-Hant: |-
        由於很快就會長大，
        屁股上的骸骨會接著傳給
        巢裡更小的禿鷹丫頭用。
      zh-Hans: |-
        由于很快就会长大，
        屁股上的骸骨会接着传给
        巢里更小的秃鹰丫头用。
      en: |-
        Vullaby grow quickly. Bones that have gotten too
        small for older Vullaby to wear often get passed
        down to younger ones in the nest.
      fr: |-
        Il grandit vite. Au sein du nid, les petits Vostourno
        héritent des couches en crâne de leurs aînés.
      de: |-
        Sie werden rasend schnell größer. Wenn sie aus
        Schädelwindeln herauswachsen, werden diese
        von jüngeren Nestgefährten getragen.
      es: |-
        Deja en el nido las calaveras que va descartando
        a medida que crece con celeridad para que las
        reutilicen futuras generaciones.
      it: |-
        Cresce così velocemente che il teschio gli va
        presto stretto. I teschi smessi restano nel nido
        e vengono usati dalle generazioni successive.
