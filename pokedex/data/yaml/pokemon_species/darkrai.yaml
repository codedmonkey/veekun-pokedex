        around it with nightmares. However,
        it means no harm.
    white-2:
      en: |-
        To protect itself, it afflicts those
        around it with nightmares. However,
        it means no harm.
    x:
      ja-Hrkt: |-
        ふかい　ねむりに　さそう　ちからで
        ひとや　ポケモンに　あくむを　みせて
        じぶんの　なわばりから　おいだす。
      ja: |-
        深い　眠りに　誘う　力で
        人や　ポケモンに　悪夢を　見せて
        自分の　縄張りから　追い出す。
      ko: |-
        깊은 잠으로 끌어들이는 힘으로
        사람과 포켓몬에게 악몽을 꾸게 해
        자신의 영역에서 쫓아낸다.
      en: |-
        It chases people and Pokémon from its territory by
        causing them to experience deep,
        nightmarish slumbers.
      fr: |-
        Il endort humains et Pokémon, et leur fait avoir
        des cauchemars pour les chasser de son territoire.
      de: |-
        Es vertreibt Eindringlinge aus seinem Revier,
        indem es sie in Schlaf versetzt und mit
        Alpträumen quält.
      es: |-
        Defiende su territorio de personas y Pokémon
        haciéndoles dormir y provocándoles pesadillas.
      it: |-
        Respinge umani e Pokémon dal suo territorio
        inducendoli a un sonno profondo e provocando incubi.
    'y':
      ja-Hrkt: |-
        ひとびとを　ふかい　ねむりに　さそい
        ゆめを　みせる　のうりょくを　もつ。
        しんげつの　よるに　かつどうする。
      ja: |-
        人々を　深い　眠りに　誘い
        夢を　見せる　能力を　持つ。
        新月の　夜に　活動する。
      ko: |-
        사람들을 깊은 잠으로 끌어들여
        꿈을 꾸게 하는 능력을 가지고 있다.
        그믐달이 뜨는 밤에 활동한다.
      en: |-
        It can lull people to sleep and make them dream.
        It is active during nights of the new moon.
      fr: |-
        Il a la capacité de bercer les gens pour les faire rêver.
        Il se montre durant les nuits de nouvelle lune.
      de: |-
        Es kann andere in Schlaf versetzen und ihnen
        Träume geben. Es ist nur bei Neumond aktiv.
      es: |-
        Puede adormecer a la gente y hacerles soñar. Está
        activo en las noches de luna nueva.
      it: |-
        Ha l’abilità di far addormentare la gente e farla
        sognare. È attivo nelle notti di luna nuova.
    omega-ruby:
