morgrem:
  base_happiness: 50
  capture_rate: 120
  color: pink
  egg_groups:
    - fairy
    - humanshape
  evolution_chain: impidimp
  evolves_from: impidimp
  flavor_text:
    sword:
      ja-Hrkt: |-
        どげざして　あやまる　ふりをして
        やりのように　とがった　うしろがみで
        つきさしてくる　せんぽうを　つかう。
      ja: |-
        土下座して　謝る　振りをして
        槍のように　尖った　後ろ髪で
        突き刺してくる　戦法を　使う。
      ko: |-
        납작 엎드려서 사과하는 척하다가
        창처럼 뾰족한 뒷머리로
        찌르는 전법을 구사한다.
      zh-Hant: |-
        會先裝成要下跪道歉的樣子，
        然後用後腦勺尖如長矛的
        頭髮刺向對手。
      zh-Hans: |-
        会先装成要下跪道歉的样子，
        然后用后脑勺尖如长矛的
        头发刺向对手。
      en: |-
        When it gets down on all fours as if to beg for
        forgiveness, it’s trying to lure opponents in so
        that it can stab them with its spear-like hair.
      fr: |-
        Sa technique de combat consiste à faire semblant
        de se prosterner devant son adversaire
        pour le transpercer avec ses cheveux aiguisés.
      de: |-
        Es nutzt eine Taktik, bei der es sich niederwirft
        und vorgibt, sich zu entschuldigen, nur um dann
        mit seinem speerartigen Haar zuzustoßen.
      es: |-
        Su estrategia consiste en postrarse ante el rival y
        fingir una disculpa para ensartarlo con el mechón
        que tiene en la espalda, afilado cual lanza.
      it: |-
        Nella lotta si prostra fingendo di chiedere pietà e
        infilza il nemico con il ciuffo di capelli appuntito
        come una lancia che gli parte dalla nuca.
    shield:
      ja-Hrkt: |-
        わるぢえを　つかって　よるの　もりに
        さそいこもうとする。　のうさくもつを
        そだてる　ちからを　もつらしい。
      ja: |-
        悪知恵を　使って　夜の　森に
        誘い込もうとする。　農作物を
        育てる　力を　もつらしい。
      ko: |-
        못된 꾀를 내어 밤에 숲으로
        꾀어내려 한다. 농작물을
        키우는 힘을 갖고 있는 듯하다.
      zh-Hant: |-
        喜歡動歪腦筋，把人們
        引誘到深夜的森林中。
        似乎擁有培育農作物的能力。
      zh-Hans: |-
        喜欢动歪脑筋，把人们
        引诱到深夜的森林中。
        似乎拥有培育农作物的能力。
      en: |-
        With sly cunning, it tries to lure people into the
        woods. Some believe it to have the power to
        make crops grow.
      fr: |-
        La nuit, il ruse pour attirer ses proies dans la forêt.
        On raconte qu’il a le pouvoir de faire pousser
        les cultures agricoles.
      de: |-
        Es hat einen Hang zur Verschlagenheit und
        versucht, nachts seine Beute in den Wald zu
        locken. Angeblich kann es Äcker gedeihen lassen.
      es: |-
        De noche, atrae con astucia a su objetivo hasta
        el bosque. Al parecer, tiene la capacidad de
        hacer crecer productos agrícolas.
      it: |-
        Attira le prede nel bosco di notte con l’astuzia.
        Sembra che abbia il potere di far crescere ogni
        tipo di prodotto agricolo.
