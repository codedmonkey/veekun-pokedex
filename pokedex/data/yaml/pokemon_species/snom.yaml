snom:
  base_happiness: 50
  capture_rate: 190
  color: white
  egg_groups:
    - bug
  evolution_chain: snom
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        れいきの　まざった　いとを　はく。
        いとで　からだを　えだに　まきつけ
        つららの　ふりをして　ねむるのだ。
      ja: |-
        冷気の　混ざった　糸を　吐く。
        糸で　体を　枝に　巻きつけ
        氷柱の　振りをして　眠るのだ。
      ko: |-
        냉기가 서린 실을 뿜는다.
        실로 몸을 가지에 휘감아서
        고드름인 척하고 잠든다.
      zh-Hant: |-
        能吐出帶著冷氣的絲。
        會用絲把自己掛在樹枝上，
        一邊裝成冰柱一邊睡覺。
      zh-Hans: |-
        能吐出带着冷气的丝。
        会用丝把自己挂在树枝上
        一边装成冰柱一边睡觉。
      en: |-
        It spits out thread imbued with a frigid sort of
        energy and uses it to tie its body to branches,
        disguising itself as an icicle while it sleeps.
      fr: |-
        Il crache un fil gelé qu’il utilise pour s’accrocher
        à une branche : il dort ainsi en imitant
        une stalactite.
      de: |-
        Es spinnt einen eiskalten Faden, mit dem es sich
        an einen Ast hängt. Dabei tut es so, als wäre es
        ein Eiszapfen, um in Ruhe schlafen zu können.
      es: |-
        Teje un hilo gélido que le permite aferrarse a
        las ramas y simula ser un carámbano mientras
        duerme.
      it: |-
        Si assicura a un ramo con il filo gelido che
        produce dalla bocca e dorme fingendosi
        un ghiacciolo.
    shield:
      ja-Hrkt: |-
        じめんに　つもった　ゆきを　たべる。
        たくさん　たべれば　たべるほど
        せなかの　トゲは　りっぱに　そだつ。
      ja: |-
        地面に　積もった　雪を　食べる。
        たくさん　食べれば　食べるほど
        背中の　棘は　立派に　育つ。
      ko: |-
        땅에 쌓인 눈을 먹는다.
        많이 먹으면 먹을수록
        등의 가시는 훌륭하게 자란다.
      zh-Hant: |-
        會吃地面上的積雪。
        吃得越多，背上的
        刺就會長得越挺拔。
      zh-Hans: |-
        会吃地面上的积雪。
        吃得越多，背上的
        刺就会长得越挺拔。
      en: |-
        It eats snow that piles up on the ground.
        The more snow it eats, the bigger and more
        impressive the spikes on its back grow.
      fr: |-
        Il se nourrit de la neige entassée sur le sol.
        Plus il en mange, plus les épines sur son dos
        grandissent.
      de: |-
        Es frisst den Schnee, der sich am Boden
        angesammelt hat. Je mehr es frisst, desto größer
        werden die Stacheln auf seinem Rücken.
      es: |-
        Se nutre de la nieve acumulada en el terreno.
        Cuanta más ingiere, más imponentes se vuelven
        las púas que presenta en el lomo.
      it: |-
        Si nutre della neve accumulatasi sul terreno.
        Più ne mangia, più gli aculei sul suo dorso
        diventano grandi.
