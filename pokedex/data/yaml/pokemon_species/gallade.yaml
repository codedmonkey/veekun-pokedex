gallade:
  base_happiness: 35
  capture_rate: 45
  color: white
  egg_groups:
    - humanshape
    - indeterminate
  evolution_chain: ralts
  evolves_from: kirlia
  flavor_text:
    diamond:
      en: |-
        A master of courtesy and
        swordsmanship, it fights using
        extending swords on its elbows.
    pearl:
      en: |-
        A master of courtesy and
        swordsmanship, it fights using
        extending swords on its elbows.
    platinum:
      en: |-
        When trying to protect someone,
        it extends its elbows as if they
        were swords and fights savagely.
    heartgold:
      en: |-
        Because it can sense what its foe
        is thinking, its attacks burst out
        first, fast, and fierce.
    soulsilver:
      en: |-
        Because it can sense what its foe
        is thinking, its attacks burst out
        first, fast, and fierce.
    black:
      en: |-
        When trying to protect someone,
        it extends its elbows as if they
        were swords and fights savagely.
      fr: |-
        Toujours prêt à protéger son prochain,
        il se bat férocement avec ses coudes
        en forme d’épées.
    white:
      en: |-
        When trying to protect someone,
        it extends its elbows as if they
        were swords and fights savagely.
      fr: |-
        Toujours prêt à protéger son prochain,
        il se bat férocement avec ses coudes
        en forme d’épées.
    black-2:
      en: |-
        When trying to protect someone,
        it extends its elbows as if they
        were swords and fights savagely.
    white-2:
      en: |-
        When trying to protect someone,
        it extends its elbows as if they
        were swords and fights savagely.
    x:
      ja-Hrkt: |-
        あいての　かんがえを　びんかんに
        キャッチする　のうりょくを　もつため
        さきに　こうげきが　できるのだ。
      ja: |-
        相手の　考えを　敏感に
        キャッチする　能力を　持つため
        先に　攻撃が　できるのだ。
      ko: |-
        상대의 생각을 민감하게
        포착하는 능력을 가졌기 때문에
        먼저 공격할 수 있다.
      en: |-
        Because it can sense what its foe is thinking,
        its attacks burst out first, fast, and fierce.
      fr: |-
        Comme il peut lire les pensées de ses adversaires,
        il frappe toujours en premier.
      de: |-
        Da es selbst die leisesten Gedanken seines
        Gegners lesen kann, kann es immer zuerst angreifen.
      es: |-
        Puede presentir los movimientos de sus rivales y por
        eso ataca siempre antes que ellos.
      it: |-
        Il suo intuito gli consente di capire cosa pensa il
        nemico: può così attaccare per primo.
    'y':
      ja-Hrkt: |-
        のびちぢみする　ひじの　かたなで
        たたかう。いあいの　めいしゅ。
        れいぎ　ただしい　ポケモン。
      ja: |-
        伸び縮みする　ヒジの　刀で　戦う。
        居合の　名手。
        礼儀正しい　ポケモン。
      ko: |-
        늘었다 줄었다 하는 팔꿈치의
        칼날로 싸운다. 칼 뽑기의 명수
        이며 예의가 바른 포켓몬이다.
      en: |-
        A master of courtesy and swordsmanship, it fights
        using extending swords on its elbows.
      fr: |-
        Il frappe avec les grandes lames à ses coudes.
        Son talent d’escrimeur n’a d’égal que sa courtoisie.
      de: |-
        Es kämpft, indem es die Schwerter an seinen Ellbogen
        verlängert. Es ist ein Meister des Kampfes.
      es: |-
        Lucha con las espadas que salen de sus codos.
        Es un maestro de la cortesía y la esgrima.
      it: |-
        Pokémon elegante e ottimo spadaccino, combatte
        allungando le lame che ha sui gomiti.
    omega-ruby:
      ja-Hrkt: |-
        あいての　かんがえを　びんかんに
        キャッチする　のうりょくを　もつため
        さきに　こうげきが　できるのだ。
      ja: |-
        相手の　考えを　敏感に
        キャッチする　能力を　持つため
        先に　攻撃が　できるのだ。
      ko: |-
        상대의 생각을 민감하게
        포착하는 능력을 가졌기 때문에
        먼저 공격할 수 있다.
      en: |-
        Because it can sense what its foe is thinking,
        its attacks burst out first, fast, and fierce.
      fr: |-
        Comme il peut lire les pensées de ses adversaires, il frappe
        toujours en premier.
      de: |-
        Da es selbst die leisesten Gedanken seines Gegners lesen
        kann, kann es immer zuerst angreifen.
      es: |-
        Puede presentir los movimientos de sus rivales y por eso
        ataca siempre antes que ellos.
      it: |-
        Il suo intuito gli consente di capire cosa pensa il nemico:
        può così attaccare per primo.
    alpha-sapphire:
      ja-Hrkt: |-
        のびちぢみする　ひじの　かたなで
        たたかう。いあいの　めいしゅ。
        れいぎ　ただしい　ポケモン。
      ja: |-
        伸び縮みする　ヒジの　刀で　戦う。
        居合の　名手。
        礼儀正しい　ポケモン。
      ko: |-
        늘었다 줄었다 하는 팔꿈치의
        칼날로 싸운다. 칼 뽑기의 명수
        이며 예의가 바른 포켓몬이다.
      en: |-
        A master of courtesy and swordsmanship, it fights
        using extending swords on its elbows.
      fr: |-
        Il frappe avec les grandes lames à ses coudes. Son talent
        d’escrimeur n’a d’égal que sa courtoisie.
      de: |-
        Es kämpft, indem es die Schwerter an seinen Ellbogen
        verlängert. Es ist ein Meister des Kampfes.
      es: |-
        Lucha con las espadas que salen de sus codos. Es un
        maestro de la cortesía y la esgrima.
      it: |-
        Pokémon elegante e ottimo spadaccino, combatte allungando
        le lame che ha sui gomiti.
    sword:
      ja-Hrkt: |-
        ぶじんと　よばれる　ポケモン。
        なにかを　まもるためで　なければ
        ひじの　かたなは　つかわない。
      ja: |-
        武人と　呼ばれる　ポケモン。
        なにかを　守るためで　なければ
        肘の　刀は　使わない。
      ko: |-
        무사라 불리는 포켓몬.
        무언가를 지킬 때가 아니면
        팔꿈치의 칼날을 사용하지 않는다.
      zh-Hant: |-
        被稱為武神的寶可夢。
        只有在為了保護什麼的時候，
        才會去使用自己的肘刀。
      zh-Hans: |-
        被称为武神的宝可梦。
        只有在为了保护什么的时候
        才会去使用自己的肘刀。
      en: |-
        True to its honorable-warrior image, it uses
        the blades on its elbows only in defense of
        something or someone.
      fr: |-
        Ce Pokémon, que l’on surnomme « l’escrimeur »,
        ne se sert de ses coudes en forme de lames
        que s’il doit défendre quelque chose.
      de: |-
        Dieses Pokémon wird als Krieger angesehen.
        Die Klingen an seinen Ellbogen benutzt es nur,
        um etwas zu beschützen.
      es: |-
        Este Pokémon es considerado todo un justiciero.
        Solo utiliza las espadas que le salen de los codos
        si tiene una causa que defender.
      it: |-
        Viene soprannominato “il guerriero”. Si serve
        delle lame sui gomiti solo a scopo difensivo.
    shield:
      ja-Hrkt: |-
        たすけを　もとめる　かんじょうを
        びんかんに　キャッチ。　あいての
        もとへ　はせさんじ　かせいするぞ。
      ja: |-
        助けを　求める　感情を
        敏感に　キャッチ。　相手の
        もとへ　馳せ参じ　加勢するぞ。
      ko: |-
        도움을 구하는 감정을 민감하게
        캐치해서 상대가 있는 곳으로
        급히 달려가 가세한다.
      zh-Hant: |-
        能夠敏銳地感知到
        尋求幫助的感情，
        並且火速趕去援助對方。
      zh-Hans: |-
        能够敏锐地感知到
        寻求帮助的感情，
        并且火速赶去援助对方。
      en: |-
        Sharply attuned to others’ wishes for help, this
        Pokémon seeks out those in need and aids them
        in battle.
      fr: |-
        Ses sens aiguisés lui indiquent lorsque quelqu’un
        est en danger. Il accourt alors à la rescousse.
      de: |-
        Es spürt sofort, wenn jemand in Not ist, und eilt
        ihm unverzüglich zu Hilfe.
      es: |-
        Es capaz de percibir al instante cuando alguien
        está en un aprieto y corre raudo a su lado para
        prestarle ayuda.
      it: |-
        È in grado di captare con estrema sensibilità
        lo stato d’animo di chi si trova nei guai e può
        così accorrere subito in suo aiuto.
    legends-arceus:
      en: |-
        The blades extending from its elbows are sharper than the
        finest swords. Its swordsmanship, albeit self-taught, is
        astonishingly impressive.
