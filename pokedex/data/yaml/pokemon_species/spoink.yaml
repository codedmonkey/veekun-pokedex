      fr: |-
        Il utilise sa queue comme un ressort
        et bondit partout. Chaque nouveau
        choc fait battre son cœur.
    white:
      en: |-
        It bounces constantly, using its
        tail like a spring. The shock of
        bouncing keeps its heart beating.
      fr: |-
        Il utilise sa queue comme un ressort
        et bondit partout. Chaque nouveau
        choc fait battre son cœur.
    black-2:
      en: |-
        Using its tail like a spring, it keeps
        its heart beating by bouncing
        constantly. If it stops, it dies.
    white-2:
      en: |-
        Using its tail like a spring, it keeps
        its heart beating by bouncing
        constantly. If it stops, it dies.
    x:
      ja-Hrkt: |-
        しっぽを　バネのかわりに　いつも
        とびはねている。はねる　しんどうで
        しんぞうを　こどう　させているのだ。
      ja: |-
        尻尾を　バネのかわりに　いつも
        飛び跳ねている。跳ねる　振動で
        心臓を　鼓動　させているのだ。
      ko: |-
        꼬리를 용수철 대용으로 써서 항상
        뛰어오르고 있다. 뛰는 반동으로
        심장을 고동시키고 있는 것이다.
      en: |-
        It bounces constantly, using its tail like a spring.
        The shock of bouncing keeps its heart beating.
      fr: |-
        Il utilise sa queue comme un ressort et bondit partout.
        Chaque nouveau choc fait battre son cœur.
      de: |-
        Es hüpft beständig umher, wobei es seinen Schweif
        als Feder verwendet. Nur so bleibt sein Herz aktiv.
      es: |-
        Bota continuamente usando su cola como muelle.
        Salta para mantener el latido de su corazón.
      it: |-
        Rimbalza costantemente usando la coda come una
        molla. Il movimento sollecita il cuore e lo fa battere.
    'y':
      ja-Hrkt: |-
        しっぽで　とびはねて　しんぞうを
        うごかしている。パールルの　つくった
        しんじゅを　あたまに　のせている。
      ja: |-
        尻尾で　飛び跳ねて　心臓を
        動かしている。パールルの　作った
        真珠を　頭に　乗せている。
      ko: |-
        꼬리로 뛰어올라 심장을
        움직이고 있다. 진주몽이 만든
        진주를 머리에 이고 있다.
      en: |-
        It bounces around on its tail to keep its
        heart pumping. It carries a pearl from
        Clamperl on its head.
      fr: |-
        Il rebondit sur sa queue pour faire battre son cœur.
        La perle sur sa tête vient d’un Coquiperl.
      de: |-
        Seine Hüpfbewegungen bringen sein Herz zum
        Schlagen. Es trägt eine Perle von Perlu auf dem Kopf.
      es: |-
        Bota usando su cola para mantener el latido de su
        corazón. Lleva una perla de Clamperl en la cabeza.
      it: |-
        Deve saltellare continuamente per far battere il suo
        cuore. Porta una perla di Clamperl sul capo.
    omega-ruby:
      ja-Hrkt: |-
        シッポで　びょんびょん　とびはねる　ポケモン。
        とびはねる　しんどうで　しんぞうを　うごかして
        いるので　とびはねる　ことは　やめられないのだ。
      ja: |-
        シッポで　びょんびょん　飛び跳ねる　ポケモン。
        飛び跳ねる　振動で　心臓を　動かして
        いるので　飛び跳ねる　ことは　止められないのだ。
      ko: |-
        꼬리로 뿅뿅 뛰어오르는 포켓몬이다.
        뛰어오르는 진동으로 심장을 움직이기
        때문에 뛰어오르는 것을 멈출 수 없다.
      en: |-
        Spoink bounces around on its tail. The shock of its bouncing
        makes its heart pump. As a result, this Pokémon cannot afford
        to stop bouncing—if it stops, its heart will stop.
      fr: |-
        Spoink rebondit sur sa queue. Le choc du rebond fait battre
        son cœur. Du coup, ce Pokémon ne peut pas s’arrêter
        de rebondir, sinon, son cœur s’arrête.
      de: |-
        Spoink hüpft auf seinem Schweif durch die Gegend.
        Die Erschütterung des Hüpfens bringt sein Herz zum Schlagen.
        Deshalb kann dieses Pokémon das Hüpfen nicht sein lassen,
        ansonsten würde sein Herz aufhören zu schlagen.
      es: |-
        Spoink se pasa todo el día saltando sobre la cola. Cada salto
        hace que le lata el corazón. Por eso, no puede permitirse
        dejar de saltar. Si lo hiciera, se le pararía.
      it: |-
        Spoink rimbalza come una molla sulla coda. Il colpo ricevuto
        dal rimbalzo gli fa battere il cuore. Di conseguenza, non può
        mai smettere di saltellare, altrimenti il suo cuore smette
        di battere.
    alpha-sapphire:
      ja-Hrkt: |-
        あたまに　のせた　しんじゅが　バネブーの
        サイコパワーを　たかめる　はたらきをする。
        おおきな　しんじゅを　いつも　さがしている。
      ja: |-
        頭に　乗せた　真珠が　バネブーの
        サイコパワーを　高める　働きをする。
        大きな　真珠を　いつも　探している。
      ko: |-
        머리에 얹은 진주가 피그점프의
        사이코 파워를 높여주는 역할을 한다.
        항상 큰 진주를 찾고 있다.
      en: |-
        Spoink keeps a pearl on top of its head. The pearl functions to
        amplify this Pokémon’s psychokinetic powers. It is therefore on
        a constant search for a bigger pearl.
      fr: |-
        Spoink garde une perle sur sa tête. Elle lui sert à amplifier
        ses pouvoirs télékinétiques. Il est constamment en quête
        d’une perle plus grosse.
      de: |-
        Spoink trägt eine Perle auf seinem Kopf, die seine
        psychokinetische Energie verstärkt. Deshalb ist es
        dauernd auf der Suche nach einer größeren Perle.
      es: |-
        Spoink lleva una perla en la cabeza, que sirve para amplificar
        los poderes psicoquinéticos que tiene. Por eso, está
        continuamente buscando una perla mayor.
      it: |-
        Sulla sommità del capo Spoink porta una perla che serve per
        amplificare i suoi poteri psicocinetici. Per questo motivo è
        sempre in cerca di una perla più grande.
