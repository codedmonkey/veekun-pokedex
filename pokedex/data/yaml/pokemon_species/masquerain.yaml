masquerain:
  base_happiness: 70
  capture_rate: 75
  color: blue
  egg_groups:
    - water1
    - bug
  evolution_chain: surskit
  evolves_from: surskit
  flavor_text:
    ruby:
      en: |-
        MASQUERAIN intimidates enemies with
        the eyelike patterns on its antennas.
        This POKéMON flaps its four wings tofreely fly in any direction - even
        sideways and backwards - as if it were
        a helicopter.
    sapphire:
      en: |-
        MASQUERAIN’s antennas have eyelike
        patterns that usually give it an angry
        look. If the “eyes” are droopy andappear sad, it is said to be a sign
        that a heavy rainfall is on its way.
    emerald:
      en: |-
        It intimidates foes with the large eyelike
        patterns on its antennae. Because it can’t
        fly if its wings get wet, it shelters itself
        from rain under large trees and eaves.
    firered:
      en: |-
        The antennae have distinctive patterns
        that look like eyes. When it rains, they
        grow heavy, making flight impossible.
    leafgreen:
      en: |-
        The antennae have distinctive patterns
        that look like eyes. When it rains, they
        grow heavy, making flight impossible.
    diamond:
      en: |-
        Its antennae have eye patterns
        on them. Its four wings enable it
        to hover and fly in any direction.
    pearl:
      en: |-
        Its antennae have eye patterns
        on them. Its four wings enable it
        to hover and fly in any direction.
    platinum:
      en: |-
        Its antennae have eye patterns
        on them. Its four wings enable it
        to hover and fly in any direction.
    heartgold:
      en: |-
        It flaps its four wings to hover and
        fly freely in any direction--
        to and fro and sideways.
    soulsilver:
      en: |-
        It flaps its four wings to hover and
        fly freely in any direction--
        to and fro and sideways.
    black:
      en: |-
        Its antennae have eye patterns
        on them. Its four wings enable it
        to hover and fly in any direction.
      fr: |-
        Des motifs en forme d’yeux ornent
        ses antennes. Ses 4 ailes l’aident
        à voler dans toutes les directions.
    white:
      en: |-
        Its antennae have eye patterns
        on them. Its four wings enable it
        to hover and fly in any direction.
      fr: |-
        Des motifs en forme d’yeux ornent
        ses antennes. Ses 4 ailes l’aident
        à voler dans toutes les directions.
    black-2:
      en: |-
        Its antennae have eye patterns
        on them. Its four wings enable it
        to hover and fly in any direction.
    white-2:
      en: |-
        Its antennae have eye patterns
        on them. Its four wings enable it
        to hover and fly in any direction.
    x:
      ja-Hrkt: |-
        めだまもようの　しょっかくを　もつ。
        ４まいの　はねで　うかびあがり
        ぜんごさゆうに　うごくことができる。
      ja: |-
        目玉模様の　触角を　持つ。
        ４枚の　羽で　浮かび上がり
        前後左右に　動くことができる。
      ko: |-
        눈알 모양의 더듬이를 가지고 있다.
        4장의 날개로 떠올라
        전후좌우로 움직일 수 있다.
      en: |-
        Its antennae have eye patterns on them. Its four
        wings enable it to hover and fly in any direction.
      fr: |-
        Des motifs en forme d’yeux ornent ses antennes.
        Ses quatre ailes l’aident à voler dans toutes les
        directions.
      de: |-
        Seine Antenne besitzt ein Augenmuster. Seine vier
        Flügel erlauben es, in alle Richtungen zu fliegen.
      es: |-
        Sus antenas tienen dibujos de ojos, mientras que sus
        alas le permiten volar en cualquier dirección.
      it: |-
        Le sue antenne presentano un motivo a occhi.
        Con le quattro ali riesce a volare in ogni direzione.
    'y':
      ja-Hrkt: |-
        ４まいの　はねで　うかびあがり
        ぜんご　さゆうへ　じゆうじざいに
        とびまわる　ことが　できる。
      ja: |-
        ４枚の　羽で　浮かび上がり
        前後　左右　自由自在に
        飛び回る　ことが　できる。
      ko: |-
        4장의 날개로 떠올라
        전후좌우로 자유자재로
        날아다닐 수 있다.
      en: |-
        It flaps its four wings to hover and fly freely in any
        direction--to and fro and sideways.
      fr: |-
        Ses quatre ailes permettent à ce Pokémon de voler
        dans toutes les directions.
      de: |-
        Dank seiner vier Flügel kann es frei in alle Richtungen
        fliegen, sogar seitwärts und rückwärts.
      es: |-
        Sus cuatro alas le permiten volar en cualquier
        dirección a su antojo.
      it: |-
        Spalanca le quattro ali per poter svolazzare a
        piacimento avanti e indietro, a destra e a sinistra.
    omega-ruby:
      ja-Hrkt: |-
        しょっかくの　めだま　もようで　てきを　いかく。
        ４まいの　はねを　つかい　ヘリコプターの　ように
        くうちゅうで　ぜんごさゆう　じゆうに　すすめる。
      ja: |-
        触角の　目玉　模様　で　敵を　威嚇。
        ４枚の　羽を　使い　ヘリコプターの　ように
        空中で　前後左右　自由に　進める。
      ko: |-
        더듬이의 눈알 무늬로 적을 위협한다.
        4개의 날개를 사용하여 헬리콥터처럼
        공중에서 전후좌우로 자유롭게 나아간다.
      en: |-
        Masquerain intimidates enemies with the eyelike patterns
        on its antennas. This Pokémon flaps its four wings to freely fly
        in any direction—even sideways and backwards—as if it were
        a helicopter.
      fr: |-
        Maskadra intimide ses ennemis grâce aux motifs en forme
        de regard sur ses antennes. En battant des ailes,
        ce Pokémon peut voler librement dans toutes les directions,
        même latéralement ou à reculons.
      de: |-
        Maskeregen schüchtert seine Feinde mit den augenähnlichen
        Mustern auf seinen Antennen ein. Dieses Pokémon kann mit
        seinen vier Flügeln wie ein Hubschrauber in jede Richtung
        fliegen, sogar seitwärts und rückwärts.
      es: |-
        Masquerain intimida a sus enemigos con los ojos que tiene
        dibujados en las antenas. Este Pokémon bate las cuatro alas
        que tiene para volar libremente en cualquier dirección, hasta
        de lado y hacia atrás, como un helicóptero.
      it: |-
        Masquerain intimorisce i nemici con il motivo a forma
        d’occhio sulle antenne. Agita le quattro ali per volare libero
        in ogni direzione, anche lateralmente e posteriormente,
        come fosse un elicottero.
    alpha-sapphire:
      ja-Hrkt: |-
        おこった　ひょうじょうの　めだま　もようが
        かなしそうに　たれさがっている　ときは
        ゆうだちの　ふりだす　ぜんちょうと　いわれる。
      ja: |-
        怒った　表情の　目玉　模様が
        悲しそうに　垂れ下がっている　ときは
        夕立ちの　降り出す　前兆と　いわれる。
      ko: |-
        화난 표정의 눈알 무늬가
        슬픈 듯이 처져 있을 때는
        소나기가 내릴 전조라고 전해진다.
      en: |-
        Masquerain’s antennas have eyelike patterns that usually
        give it an angry look. If the “eyes” are droopy and appear sad,
        it is said to be a sign that a heavy rainfall is on its way.
      fr: |-
        Les antennes de Maskadra ont la forme de grands yeux
        qui lancent un regard malfaisant. Si ces « yeux » sont tristes,
        cela signifie qu’un déluge se prépare.
      de: |-
        Maskeregens Antennen haben ein augenähnliches Muster,
        das ihm ein furchterregendes Äußeres verleiht. Wenn seine
        „Augen“ traurig aussehen, ist ein heftiger Regenguss im Anzug.
      es: |-
        Masquerain tiene unas antenas con ojos dibujados que le dan
        aspecto de estar enfadado. Si tiene los “ojos” medio cerrados
        y con aspecto triste, es probable que esté a punto de caer
        un buen aguacero.
      it: |-
        Le antenne di Masquerain presentano un motivo
        a forma d’occhio che gli conferisce un aspetto aggressivo.
        Quando questi motivi simili a occhi hanno un aspetto triste
        e depresso significa che si sta avvicinando un acquazzone.
    sun:
      ja-Hrkt: |-
        しょっかくに　ある　めだまもようで
        てきを　いかく。　４まいの　はねで
        ぜんごさゆうに　とびまわる。
      ja: |-
        触角に　ある　目玉模様で
        敵を　いかく。　４枚の　羽で
        前後左右に　飛びまわる。
      ko: |-
        더듬이에 있는 눈알 모양으로
        적을 위협한다. 4개의 날개로
        전후좌우로 날아다닌다.
      zh-Hant: |-
        用觸角上的眼珠花紋威嚇敵人。
        用４根翅膀前後左右靈活飛行。
      zh-Hans: |-
        用触角上的眼珠花纹威吓敌人。
        用４根翅膀前后左右灵活飞行。
      en: |-
        It intimidates enemies with the eye-like
        patterns on its antennae. Its four wings
        allow it to fly in any direction.
      fr: |-
        Ses antennes semblables à des yeux servent
        à intimider ses ennemis, et ses quatre ailes lui
        permettent de voler dans toutes les directions.
      de: |-
        Schüchtert seine Feinde mit den augenähnlichen
        Mustern auf seinen Antennen ein. Kann dank
        seiner vier Flügel frei in alle Richtungen fliegen.
      es: |-
        Amenaza a sus enemigos con las grandes
        pupilas de sus antenas. Sus cuatro alas le
        permiten volar en cualquier dirección.
      it: |-
        Intimorisce i nemici con i motivi a forma di
        occhio sulle antenne. Vola libero in ogni
        direzione agitando le sue quattro ali.
    moon:
      ja-Hrkt: |-
        はねや　しょっかくは　しっけが
        にがて。　あめあがりには　たいようの
        ほうを　むいて　からだを　かわかす。
      ja: |-
        羽や　触角は　湿気が
        苦手。　雨上がりには　太陽の
        ほうを　向いて　身体を　乾かす。
      ko: |-
        날개와 더듬이는 습기에 약하다.
        비가 갠 뒤에는 태양 쪽을
        향해 몸을 말린다.
      zh-Hant: |-
        翅膀和觸角很怕濕氣。
        雨後會朝著太陽的方向曬乾身體。
      zh-Hans: |-
        翅膀和触角很怕湿气。
        雨后会朝着太阳的方向晒干身体。
      en: |-
        Its wings and antennae don’t cope well with
        moisture. After a rain, it faces sunward to
        dry off.
      fr: |-
        Ses ailes et ses antennes tolèrent mal l’humidité.
        En cas de pluie, ce Pokémon se réfugie là où
        le soleil brille pour y faire sécher son corps.
      de: |-
        Seine Flügel und Fühler sind empfindlich gegen
        Feuchtigkeit. Nachdem es geregnet hat, streckt
        es sie gen Sonne, um sie zu trocknen.
      es: |-
        Sus alas y antenas son muy sensibles a la
        humedad. Cuando deja de llover se dirige
        volando hacia el sol para secarlas.
      it: |-
        Le ali e le antenne sono molto sensibili
        all’umidità. Se ha piovuto, vola al sole per
        farle asciugare.
    ultra-sun:
      ja-Hrkt: |-
        めだまもようで　てきを　いかく。
        それで　ダメなら　４まいの　ハネを
        つかって　きように　にげまわるのだ。
      ja: |-
        目玉模様で　敵を　威嚇。
        それで　ダメなら　４枚の　ハネを
        使って　器用に　逃げまわるのだ。
      ko: |-
        눈알 모양으로 적을 위협한다.
        그래도 안 되면 4장의 날개를
        사용해 재빠르게 도망친다.
      zh-Hant: |-
        會用眼珠花紋威嚇敵人。
        如果威嚇起不了作用，就會用
        ４片翅膀靈活地四處竄逃。
      zh-Hans: |-
        会用眼珠花纹威吓敌人。
        如果这样不起作用，就会挥动
        ４根翅膀，灵活地四处逃窜。
      en: |-
        Masquerain intimidates enemies with the eyelike
        patterns of its eyespots. If that doesn’t work, it
        deftly makes its escape on its set of four wings.
      fr: |-
        Ses protubérances en forme d’yeux servent
        à intimider ses ennemis. Si cela ne marche pas,
        il utilise ses quatre ailes pour s’enfuir.
      de: |-
        Kann es Feinde nicht mit seinen augenähnlichen
        Mustern einschüchtern, flieht es geschwind
        mithilfe seiner vier Flügel.
      es: |-
        Intimida a sus enemigos con las grandes pupilas
        de sus antenas. Si esto no funciona, bate sus
        cuatro alas para huir.
      it: |-
        Intimorisce i nemici con i motivi a forma di
        occhio. Se lo stratagemma non funziona,
        fugge via agitando le quattro ali.
    ultra-moon:
      ja-Hrkt: |-
        うすい　ハネの　ような　しょっかくは
        しっけを　すいやすい。　あめの　ひは
        きの　ウロなどで　じっと　すごす。
      ja: |-
        薄い　ハネの　ような　触角は
        湿気を　吸いやすい。　雨の　日は
        木の　ウロなどで　じっと　過ごす。
      ko: |-
        얇은 날개처럼 생긴 더듬이는
        습기를 머금기 쉽다. 비가 오는 날은
        나무 구멍 등에서 얌전히 지낸다.
      zh-Hant: |-
        薄薄翅膀般的觸角很容易
        吸收濕氣。下雨天會靜靜待在
        樹洞之類的地方度過。
      zh-Hans: |-
        像薄薄的翅膀一样的触角
        很容易吸收湿气。
        雨天会静静地待在树洞等地方度过。
      en: |-
        Its thin, winglike antennae are highly absorbent.
        It waits out rainy days in tree hollows.
      fr: |-
        Ses antennes en forme d’ailes absorbent
        facilement l’humidité. Par temps de pluie,
        il attend patiemment au creux d’un arbre.
      de: |-
        Seine Antennen erinnern an dünne Flügel und
        saugen leicht Flüssigkeit auf. Regentage
        verbringt es regungslos in Baumhöhlen.
      es: |-
        Sus grandes antenas en forma de ojos tienden a
        absorber humedad. Los días de lluvia, se refugia
        en cavidades de los árboles y espera paciente.
      it: |-
        Le sue antenne, simili ad ali sottili, assorbono
        l’umidità. Quando piove si rifugia all’interno
        delle cavità degli alberi.
