    sun:
      ja-Hrkt: |-
        かしこく　おんこうで　ゆうかん。
        レスキューたいの　たいいんたちの
        たよれる　あいぼう　だぞ。
      ja: |-
        賢く　温厚で　勇敢。
        レスキュー隊の　隊員たちの
        頼れる　相棒　だぞ。
      ko: |-
        똑똑하고 온후하며 용감하다.
        구조대 대원들의
        믿음직한 동료이다.
      zh-Hant: |-
        聰明溫厚而勇敢。
        是深受救援隊隊員們
        信賴的好夥伴。
      zh-Hans: |-
        聪明温厚而勇敢。
        是救援队队员们可以信赖的伙伴。
      en: |-
        Intelligent, good-natured, and valiant,
        it’s a trustworthy partner on rescue teams.
      fr: |-
        Sagesse, gentillesse et bravoure sont les mots
        qui qualifient le mieux ce Pokémon, devenu
        l’inséparable partenaire des équipes de secours.
      de: |-
        Es ist ein kluges, sanftmütiges und tapferes
        Pokémon. Für Mitglieder von Rettungstruppen
        stellt es einen zuverlässigen Partner dar.
      es: |-
        A su inteligencia y carácter afable se suma su
        valentía. Presta una ayuda inestimable a los
        equipos de rescate.
      it: |-
        Intelligente, calmo e coraggioso, è il compagno
        ideale degli addetti alle missioni di soccorso.
    moon:
      ja-Hrkt: |-
        かしこく　ひとに　おそいかかる
        しんぱいが　ないので　こどもの
        おもりを　まかせる　おやも　いる。
      ja: |-
        賢く　人に　襲い掛かる
        心配が　ないので　子どもの
        お守りを　任せる　親も　いる。
      ko: |-
        영리해서 사람을 공격할
        걱정이 없어 아이를
        돌보게 하는 부모도 있다.
      zh-Hant: |-
        很聰明，不用擔心牠會
        襲擊人，所以也有家長會
        把保護孩子的任務交給牠。
      zh-Hans: |-
        很聪明，且不用担心会朝人
        猛扑过来，所以也有家长会
        把保护孩子的任务交给它。
      en: |-
        With this wise Pokémon, there could be no
        concern that it would ever attack people. Some
        parents even trust it to babysit.
      fr: |-
        Modèle de sagesse, il ne s’en prend jamais aux
        humains sans raison, et assume volontiers le
        rôle de nounou pour les parents occupés.
      de: |-
        Da es klug ist und keine Gefahr besteht, dass
        es Menschen angreift, geben Eltern ihre Kinder
        in seine Obhut.
      es: |-
        Debido a su inteligencia y a lo manso que se
        muestra al tratar con personas, algunos padres
        confían en él incluso para proteger a sus hijos.
      it: |-
        La sua intelligenza e docilità verso gli esseri
        umani fanno sì che molti genitori si affidino
        a lui per la cura dei figli.
    ultra-sun:
      ja-Hrkt: |-
        ながく　あたたかい　けの　おかげで
        さむさは　へっちゃら。　アローラの
        ムーランドは　すこし　くるしそうだ。
      ja: |-
        長く　暖かい　毛の　おかげで
        寒さは　へっちゃら。　アローラの
        ムーランドは　少し　苦しそうだ。
      ko: |-
        길고 따듯한 털 덕분에
        추위는 걱정 없다. 알로라의
        바랜드는 조금 괴로운 것 같다.
      zh-Hant: |-
        靠著又長又暖的毛皮，
        一點也不怕寒冷的天氣。
        但阿羅拉的長毛狗看起來有點難受。
      zh-Hans: |-
        多亏了那身又长又暖和的毛，
        抵御寒冷根本不在话下。
        阿罗拉的长毛狗看上去有点辛苦。
      en: |-
        It pays no mind to the cold, thanks to its long
        warm coat. Stoutland in Alola look a
        little uncomfortable.
      fr: |-
        Son long pelage le protège parfaitement du froid.
        Malheureusement pour lui, cela n’est pas très
        utile à Alola.
      de: |-
        Dank seines langen, warmen Fells kann ihm die
        Kälte nichts anhaben. In Alola hat es daher
        leider mit dem schwülen Klima zu kämpfen.
      es: |-
        El largo y cálido pelaje le permite soportar sin
        ningún problema el frío, pero resulta un poco
        asfixiante en Alola.
      it: |-
        Non teme il freddo grazie al manto lungo
        e caldo. Gli Stoutland che vivono ad Alola,
        però, sembrano soffrire un po’ il caldo.
    ultra-moon:
      ja-Hrkt: |-
        ながく　あつでの　たいもうを　もつ。
        むかしは　さむい　ちほうでは　１かに
        １ぴき　ムーランドを　かっていた。
      ja: |-
        長く　厚手の　体毛を　もつ。
        昔は　寒い　地方では　一家に
        １匹　ムーランドを　飼っていた。
      ko: |-
        길고 두꺼운 털을 가졌다.
        옛날 추운 지방에서는 한 집에
        1마리씩 바랜드를 키웠다.
      zh-Hant: |-
        有著又長又厚的體毛。
        過去在寒冷的地方，
        每戶人家都會養１隻長毛狗。
      zh-Hans: |-
        拥有又长又厚实的体毛。
        过去在寒冷的地方，
        每家都会养１只长毛狗。
      en: |-
        Its fur is long and thick. A long time ago in cold
        regions, every household kept a Stoutland.
      fr: |-
        Il possède un pelage long et épais. Jadis, dans
        les régions froides, chaque foyer en élevait un.
      de: |-
        Es hat langes, dickes Fell. Vor einiger Zeit war
        es in kalten Gegenden üblich, dass jede Familie
        ein Bissbark im Haus hielt.
      es: |-
        Posee un largo y tupido pelaje. En las regiones
        frías no había antaño una casa que no tuviese
        un Stoutland.
      it: |-
        Ha un manto lungo e folto. In passato, nelle
        regioni fredde ogni famiglia aveva uno Stoutland.
    sword:
      ja-Hrkt: |-
        ひとと　くらすのが　すきらしい。
        やせいで　つかまえても　みっかも
        たてば　ひとに　なつくようになる。
      ja: |-
        人と　暮らすのが　好きらしい。
        野生で　捕まえても　3日も
        たてば　人に　懐くようになる。
      ko: |-
        사람과 사는 것을 좋아하는 듯하다.
        야생에서 잡아도 3일만 지나면
        사람을 따르게 된다.
      zh-Hant: |-
        似乎很喜歡和人類一起生活。
        即使是捕捉來的野生長毛狗，
        只要過個三天就會與人親近。
      zh-Hans: |-
        似乎喜欢和人类一起生活。
        就算是野生的长毛狗，捕捉后
        只要过个三天就能和人亲近。
      en: |-
        These Pokémon seem to enjoy living with humans.
        Even a Stoutland caught in the wild will warm up
        to people in about three days.
      fr: |-
        Il apprécierait tant la compagnie des êtres
        humains qu’il ne faudrait pas plus de trois jours
        pour apprivoiser un Mastouffe sauvage.
      de: |-
        Bissbark scheint gerne unter Menschen zu leben.
        Wenn man ein wildes Exemplar fängt, dauert es
        nur etwa drei Tage, bis dieses zutraulich wird.
      es: |-
        Parece ser que le gusta vivir con personas. En tan
        solo tres días ya le coge cariño a cualquiera que
        lo haya atrapado en estado salvaje.
      it: |-
        Sembra gli piaccia vivere con gli esseri umani.
        Gli esemplari selvatici catturati si affezionano
        nel giro di tre giorni.
    shield:
      ja-Hrkt: |-
        りっぱなヒゲが　じまんの　ポケモン。
        その　ながさで　なかまどうしの
        ゆうれつが　きまると　いう。
      ja: |-
        立派なヒゲが　自慢の　ポケモン。
        その　長さで　仲間同士の
        優劣が　決まると　いう。
      ko: |-
        훌륭한 수염이 특징인 포켓몬이다.
        그 길이로 동료들과
        우열을 가린다고 한다.
      zh-Hant: |-
        以氣派的鬍鬚為傲的寶可夢。
        據說在夥伴之間的階級地位
        就取決於鬍鬚的長度。
      zh-Hans: |-
        以自己气派的胡须为傲。
        据说，每只个体在族群中的地位，
        就是根据胡须长度来决定的。
      en: |-
        Stoutland is immensely proud of its impressive
        moustache. It’s said that moustache length is what
        determines social standing among this species.
      fr: |-
        Sa moustache remarquable fait sa fierté,
        car sa longueur permettrait de déterminer
        la hiérarchie au sein de l’espèce.
      de: |-
        Seinen üppigen Schnauzbart trägt es mit Stolz.
        Angeblich entscheidet dessen Länge über die
        Rangordnung innerhalb dieser Pokémon-Art.
      es: |-
        Sus impresionantes bigotes son su orgullo. Entre
        los de su especie se establece una jerarquía
        según su longitud.
      it: |-
        Va molto fiero dei suoi splendidi baffi. Si dice
        che la loro lunghezza determini la sua
        superiorità o inferiorità rispetto ai suoi simili.
