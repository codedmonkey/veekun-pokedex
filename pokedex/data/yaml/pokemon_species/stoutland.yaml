stoutland:
  base_happiness: 50
  capture_rate: 45
  color: gray
  egg_groups:
    - ground
  evolution_chain: lillipup
  evolves_from: herdier
  flavor_text:
    black:
      en: |-
        It rescues people stranded by
        blizzards in the mountains. Its
        shaggy fur shields it from the cold.
      fr: |-
        Il sauve les gens bloqués dans les
        montagnes par des tempêtes de neige.
        Ses longs poils le protègent du froid.
    white:
      en: |-
        This extremely wise Pokémon excels
        at rescuing people stranded at sea or
        in the mountains.
      fr: |-
        Il est spécialisé dans l’assistance aux
        personnes perdues en mer ou en
        montagne. Il est très intelligent.
    black-2:
      en: |-
        Being wrapped in its long fur is so
        comfortable that a person would be fine
        even overnight on a wintry mountain.
    white-2:
      en: |-
        Being wrapped in its long fur is so
        comfortable that a person would be fine
        even overnight on a wintry mountain.
    x:
      ja-Hrkt: |-
        ふぶきで　とざされた　やまに　はいり
        そうなんした　ひとを　たすける。
        ながい　けが　さむさを　ふせぐ。
      ja: |-
        吹雪で　閉ざされた　山に　入り
        遭難した　人を　助ける。
        長い　毛が　寒さを　防ぐ。
      ko: |-
        눈보라로 길이 막힌 산에 들어가
        조난된 사람을 구해준다.
        긴 털이 추위를 막는다.
      en: |-
        It rescues people stranded by blizzards in the
        mountains. Its shaggy fur shields it from the cold.
      fr: |-
        Il sauve les gens bloqués dans les montagnes par
        des tempêtes de neige. Ses longs poils le protègent
        du froid.
      de: |-
        Es rettet Menschen, die aufgrund eines
        Schneesturmes im Gebirge festsitzen.
        Sein langes Fell schützt es vor Kälte.
      es: |-
        Socorre a humanos perdidos en montañas azotadas
        por ventiscas. Su largo pelaje le protege del frío.
      it: |-
        Soccorre chi si trova in difficoltà sulle montagne
        spazzate da bufere di neve. I lunghi peli lo
        proteggono dal freddo.
    'y':
      ja-Hrkt: |-
        ながい　たいもうに　つつまれると
        ふゆやまでも　ひとばん　へいきなほど
        あたたかく　とても　ここちよい。
      ja: |-
        長い　体毛に　包まれると
        冬山でも　一晩　平気なほど
        暖かく　とても　心地よい。
      ko: |-
        긴 털에 둘러싸이면 겨울 산에서
        하룻밤을 보내도 괜찮을 정도로
        따뜻하고 매우 기분이 좋다.
      en: |-
        Being wrapped in its long fur is so comfortable
        that a person would be fine even overnight on a
        wintry mountain.
      fr: |-
        Sa soyeuse fourrure à poils longs est assez chaude
        pour supporter de longues nuits d’hiver en montagne.
      de: |-
        Sein langes Fell ist sehr bequem und kann einen
        Menschen eine ganze Nacht lang auf einem
        schneebedeckten Berg warmhalten.
      es: |-
        Un humano podría pasar una noche gélida en las
        montañas sin pasar frío si se tapara con su largo y
        tupido pelaje.
      it: |-
        Avvolti nel suo caldo manto si può dormire
        all’addiaccio su una montagna in inverno senza
        correre alcun pericolo.
    omega-ruby:
      ja-Hrkt: |-
