luxray:
  base_happiness: 50
  capture_rate: 45
  color: blue
  egg_groups:
    - ground
  evolution_chain: shinx
  evolves_from: luxio
  flavor_text:
    diamond:
      en: |-
        It has eyes that can see through
        anything. It spots and captures
        prey hiding behind objects.
    pearl:
      en: |-
        When its eyes gleam gold, it can
        spot hiding prey--even those
        taking shelter behind a wall.
    platinum:
      en: |-
        It can see clearly through walls
        to track down its prey and seek
        its lost young.
    heartgold:
      en: |-
        LUXRAY’s ability to see through
        objects comes in handy when it’s
        scouting for danger.
    soulsilver:
      en: |-
        LUXRAY’s ability to see through
        objects comes in handy when it’s
        scouting for danger.
    black:
      en: |-
        It can see clearly through walls
        to track down its prey and seek
        its lost young.
      fr: |-
        Il est capable de voir à travers
        les murs pour chasser des proies
        ou retrouver ses petits égarés.
    white:
      en: |-
        It can see clearly through walls
        to track down its prey and seek
        its lost young.
      fr: |-
        Il est capable de voir à travers
        les murs pour chasser des proies
        ou retrouver ses petits égarés.
    black-2:
      en: |-
        It can see clearly through walls
        to track down its prey and seek
        its lost young.
    white-2:
      en: |-
        It can see clearly through walls
        to track down its prey and seek
        its lost young.
    x:
      ja-Hrkt: |-
        ひとみが　きんいろに　ひかるとき
        カベの　むこうに　かくれている
        えものを　みつけることが　できる。
      ja: |-
        瞳が　金色に　光るとき
        壁の　向こうに　隠れている
        獲物を　見つけることが　できる。
      ko: |-
        눈동자가 금색으로 빛날 때
        벽의 저편에 숨어 있는
        먹이를 찾아낼 수 있다.
      en: |-
        When its eyes gleam gold, it can spot hiding
        prey--even those taking shelter behind a wall.
      fr: |-
        Quand ses yeux se dorent, il peut repérer une proie
        cachée, même si elle est derrière un mur.
      de: |-
        Leuchten seine Augen golden auf, kann es Beute,
        die sich versteckt, sehen. Es kann durch Wände sehen.
      es: |-
        Cuando sus ojos brillan como el oro, puede ver presas
        escondidas, incluso detrás de un muro.
      it: |-
        Se i suoi occhi sono dorati, può individuare le prede,
        anche quelle che si nascondono dietro i muri.
    'y':
      ja-Hrkt: |-
        レントラーの　とうし　のうりょくは
        きけんな　ものを　はっけんする　とき
        とても　やくに　たつのだ。
      ja: |-
        レントラーの　透視能力は
        危険な　ものを　発見するとき
        とても　役に立つのだ。
      ko: |-
        렌트라의 투시 능력은
        위험한 것을 발견할 때
        매우 도움이 된다.
      en: |-
        Luxray’s ability to see through objects comes in
        handy when it’s scouting for danger.
      fr: |-
        Sa capacité à voir à travers tout est très utile pour
        détecter les moindres dangers.
      de: |-
        Beim Aufspüren von Gefahren sind Luxtras
        hellseherische Fähigkeiten äußerst hilfreich.
      es: |-
        La potente visión de Luxray resulta extremadamente
        valiosa cuando acecha el peligro.
      it: |-
        L’abilità radioscopica di Luxray si rivela utile
        quando gli fa scoprire oggetti pericolosi.
    omega-ruby:
      ja-Hrkt: |-
        ひとみが　きんいろに　ひかるとき
        カベの　むこうに　かくれている
        えものを　みつけることが　できる。
      ja: |-
        瞳が　金色に　光るとき
        壁の　向こうに　隠れている
        獲物を　見つけることが　できる。
      ko: |-
        눈동자가 금색으로 빛날 때
        벽의 저편에 숨어 있는
        먹이를 찾아낼 수 있다.
      en: |-
        When its eyes gleam gold, it can spot hiding
        prey—even those taking shelter behind a wall.
      fr: |-
        Quand ses yeux se dorent, il peut repérer une proie cachée,
        même si elle est derrière un mur.
      de: |-
        Leuchten seine Augen golden auf, kann es Beute, die sich
        versteckt, sehen. Es kann durch Wände sehen.
      es: |-
        Cuando sus ojos brillan como el oro, puede ver presas
        escondidas, incluso detrás de un muro.
      it: |-
        Se i suoi occhi sono dorati, può individuare le prede,
        anche quelle che si nascondono dietro i muri.
    alpha-sapphire:
      ja-Hrkt: |-
        レントラーの　とうし　のうりょくは
        きけんな　ものを　はっけんする　とき
        とても　やくに　たつのだ。
      ja: |-
        レントラーの　透視能力は
        危険な　ものを　発見するとき
        とても　役に立つのだ。
      ko: |-
        렌트라의 투시 능력은
        위험한 것을 발견할 때
        매우 도움이 된다.
      en: |-
        Luxray’s ability to see through objects comes in
        handy when it’s scouting for danger.
      fr: |-
        Sa capacité à voir à travers tout est très utile pour détecter
        les moindres dangers.
      de: |-
        Beim Aufspüren von Gefahren sind Luxtras hellseherische
        Fähigkeiten äußerst hilfreich.
      es: |-
        La potente visión de Luxray resulta extremadamente valiosa
        cuando acecha el peligro.
      it: |-
        L’abilità radioscopica di Luxray si rivela utile quando gli fa
        scoprire oggetti pericolosi.
    sword:
      ja-Hrkt: |-
        とうしのうりょくを　もつ　ポケモン。
        あつい　かべの　むこうに　かくれる
        えものを　たちまち　みつけだす。
      ja: |-
        透視能力を　もつ　ポケモン。
        厚い　壁の　向こうに　隠れる
        獲物を　たちまち　見つけだす。
      ko: |-
        투시 능력을 가진 포켓몬.
        두꺼운 벽 반대편에 숨어 있는
        먹이를 순식간에 찾아낸다.
      zh-Hant: |-
        擁有透視能力的寶可夢。
        能夠在眨眼間就發現躲在
        厚厚牆壁另一側的獵物。
      zh-Hans: |-
        拥有透视能力的宝可梦。
        能够立刻发现身处于
        厚厚墙壁另一侧的猎物。
      en: |-
        Luxray can see through solid objects. It will
        instantly spot prey trying to hide behind walls,
        even if the walls are thick.
      fr: |-
        Sa capacité à voir à travers la matière lui
        permet de repérer en un instant des proies
        cachées derrière un mur épais.
      de: |-
        Dieses Pokémon verfügt über einen Röntgenblick.
        So kann es im Nu Beute aufspüren, selbst wenn
        sich diese hinter dicken Wänden versteckt.
      es: |-
        Tiene la capacidad de ver a través de cualquier
        cosa. Encuentra enseguida su presa, aunque se
        oculte tras una pared de gran grosor.
      it: |-
        Grazie all’abilità radioscopica di cui è dotato,
        può individuare all’istante le prede nascoste
        oltre spesse pareti.
    shield:
      ja-Hrkt: |-
        とうしは　でんきエネルギーを　ひどく
        しょうもうするため　ちょうじかん
        ねむり　エネルギーを　たくわえる。
      ja: |-
        透視は　電気エネルギーを　ひどく
        消耗するため　長時間　眠り
        エネルギーを　蓄える。
      ko: |-
        투시는 전기 에너지를 매우 많이
        소모하기 때문에 오랜 시간
        수면을 취해서 에너지를 비축한다.
      zh-Hant: |-
        由於透視會消耗極大量的
        電能，因此牠會花很長的
        時間睡覺，藉此儲存能量。
      zh-Hans: |-
        由于透视需要消耗
        大量的电能，因此它会
        睡很长时间来积蓄能量。
      en: |-
        Seeing through solid objects uses up a lot of
        Luxray’s electricity, so the Pokémon sleeps for
        long periods of time to store up energy.
      fr: |-
        Il dort beaucoup pour récupérer la quantité
        d’énergie électrique énorme qu’il consomme
        afin de voir à travers la matière.
      de: |-
        Der Einsatz seines Röntgenblicks verbraucht sehr
        viel Elektrizität. Luxtra gewinnt diese zurück,
        indem es lange schläft.
      es: |-
        Duerme durante largos períodos para recuperar
        la enorme cantidad de electricidad que consume
        al usar su capacidad para ver a través de objetos.
      it: |-
        La sua visione radioscopica consuma enormi
        quantità di energia elettrica, che Luxray recupera
        dormendo per lunghi periodi.
