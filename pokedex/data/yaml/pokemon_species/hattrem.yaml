hattrem:
  base_happiness: 50
  capture_rate: 120
  color: pink
  egg_groups:
    - fairy
  evolution_chain: hatenna
  evolves_from: hatenna
  flavor_text:
    sword:
      ja-Hrkt: |-
        つよい　かんじょうを　もつ　ものは
        それが　だれであれ　だまらせる。
        そのしゅだんは　じつに　らんぼう。
      ja: |-
        強い　感情を　もつ　ものは
        それが　誰であれ　黙らせる。
        その手段は　じつに　乱暴。
      ko: |-
        강한 감정을 품은 자라면
        누가 됐든 조용하게 만드는데
        그 수단이 매우 난폭하다.
      zh-Hant: |-
        遇到情緒激昂的對手時，
        無論對方是誰，都會用
        粗暴的方式使其沉默。
      zh-Hans: |-
        遇到情绪激昂的对手时，
        无论对方是谁，都会用
        粗暴的方式使其沉默。
      en: |-
        No matter who you are, if you bring strong
        emotions near this Pokémon, it will silence
        you violently.
      fr: |-
        S’il ressent des émotions trop fortes, il en fera
        taire la source, quelle qu’elle soit, en utilisant
        des méthodes assez violentes.
      de: |-
        Empfindet jemand starke Emotionen, bringt es
        ihn auf gewaltsame Art zum Schweigen, egal,
        um wen es sich dabei handelt.
      es: |-
        Silencia a cualquiera que muestre una emoción
        intensa sin importar de quién se trate y recurre
        para ello a métodos a cuál más violento.
      it: |-
        Se qualcuno esterna emozioni troppo forti,
        lo affronta immediatamente e lo mette a
        tacere senza tanti convenevoli.
    shield:
      ja-Hrkt: |-
        あたまのフサで　あいてを　なぐり
        だまらせる。　プロボクサーさえ
        いっぱつ　ＫＯの　はかいりょく。
      ja: |-
        頭の房で　相手を　殴り
        黙らせる。　プロボクサーさえ
        一発　ＫＯの　破壊力。
      ko: |-
        머리의 술로 상대를 때려
        꼼짝 못 하게 한다. 프로복서조차
        한 방에 KO되는 파괴력이다.
      zh-Hant: |-
        會用頭上的辮子攻擊對手，
        讓對方安靜下來。破壞力
        強到能一擊ＫＯ職業拳擊手。
      zh-Hans: |-
        会用头上的辫子攻击对手，
        让对方安静下来。破坏力
        强到能一击ＫＯ职业拳击手。
      en: |-
        Using the braids on its head, it pummels foes to
        get them to quiet down. One blow from those
        braids would knock out a professional boxer.
      fr: |-
        Il frappe ses ennemis avec ses tresses pour les
        faire taire. Sa puissance est telle qu’il peut mettre
        K.O. un boxeur professionnel d’un seul coup.
      de: |-
        Ein Schlag mit den Quasten an seinem Kopf
        bringt Gegner zum Schweigen. Ein Treffer genügt,
        um einen Profiboxer auf die Bretter zu schicken.
      es: |-
        Silencia al objetivo atizándole con los mechones.
        Despliega una potencia devastadora capaz de
        noquear a un boxeador profesional.
      it: |-
        Zittisce gli avversari colpendoli con le nappe che
        ha ai lati della testa. È così forte da mandare KO
        con un colpo anche un pugile professionista.
