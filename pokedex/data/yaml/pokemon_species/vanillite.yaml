    alpha-sapphire:
      ja-Hrkt: |-
        あさひの　エネルギーを　あびた
        つららが　ポケモンに　なった。
        ゆきに　からだを　うめて　ねむる。
      ja: |-
        朝日の　エネルギーを　浴びた
        つららが　ポケモンに　なった。
        雪に　体を　埋めて　眠る。
      ko: |-
        아침 해의 에너지를 받은
        고드름이 포켓몬이 되었다.
        눈에 몸을 묻고 잠든다.
      en: |-
        This Pokémon formed from icicles bathed in energy
        from the morning sun. It sleeps buried in snow.
      fr: |-
        Ce Pokémon est né d’un glaçon qui a baigné dans la lumière
        du matin. Il se cache dans la neige pour dormir.
      de: |-
        Ein Eiszapfen, der durch die Energie der aufgehenden Sonne
        zum Pokémon wurde. Nachts deckt es sich mit Schnee zu.
      es: |-
        Nació de un carámbano que absorbió la energía del sol al
        alba. Duerme arropado por la nieve.
      it: |-
        Pokémon nato da una stalattite che ha ricevuto l’energia del
        sole mattutino. Dorme sepolto sotto la neve.
    sun:
      ja-Hrkt: |-
        つららから　うまれた　ポケモン。
        つめたい　いきで　ゆきの　けっしょうを
        つくって　ゆきを　ふらせる。
      ja: |-
        氷柱から　生まれたポケモン。
        冷たい　息で　雪の　結晶を
        つくって　雪を　降らせる。
      ko: |-
        고드름에서 태어난 포켓몬이다.
        차가운 숨으로 눈 결정을
        만들어 눈을 뿌린다.
      zh-Hant: |-
        從冰柱中誕生的寶可夢。
        用冰冷的氣息製造雪的結晶，
        讓周圍降雪。
      zh-Hans: |-
        从冰柱中诞生的宝可梦。
        用冰冷的气息制造雪的结晶，
        让天上下雪。
      en: |-
        Born of an icicle, this Pokémon uses its frosty
        breath to make ice crystals, causing snow
        to fall.
      fr: |-
        Né dans une colonne de glace, ce Pokémon
        peut créer des flocons de neige de son souffle
        glacé, voire même faire tomber la neige en été.
      de: |-
        Dieses Pokémon ist aus einem Eiszapfen
        entstanden. Mit seinem kalten Odem erzeugt
        es Eiskristalle und lässt es schneien.
      es: |-
        Pokémon nacido de un carámbano. Con su
        aliento gélido es capaz de crear cristales de
        nieve y provocar una nevasca.
      it: |-
        Pokémon nato da una stalattite di ghiaccio.
        Con il suo fiato gelido forma dei cristalli
        di neve e fa nevicare.
    moon:
      ja-Hrkt: |-
        だきしめると　ひんやり　ここちよい。
        あつい　ちほうでは　いっかに　１ぴきと
        ちょうほうされる　ポケモンだ。
      ja: |-
        抱きしめると　ひんやり　心地よい。
        暑い　地方では　一家に　１匹と
        重宝される　ポケモンだ。
      ko: |-
        껴안으면 차가워서 기분이 좋다.
        더운 지방에서는 한 집에 1마리씩 두고
        소중하게 여기는 포켓몬이다.
      zh-Hant: |-
        抱緊牠就會感覺涼涼的
        非常舒服。在炎熱的地區，
        是每家必備１隻的便利寶可夢。
      zh-Hans: |-
        抱紧的话，就会感觉凉凉的
        非常舒服。在炎热地区，
        是每家必备１只的便利宝可梦。
      en: |-
        It feels pleasantly cool when embraced. This
        Pokémon is treasured by households in
        warm regions.
      fr: |-
        Serrer Sorbébé contre soi procure une délicieuse
        sensation de fraîcheur. Dans les régions
        chaudes, c’est le Pokémon à avoir à la maison.
      de: |-
        Wenn man es umarmt, fühlt es sich angenehm
        und kühl an. In heißen Regionen hat man daher
        gern ein Exemplar im Haus.
      es: |-
        Al abrazarlo transmite una sensación agradable
        y refrescante. La gente que vive en las regiones
        cálidas aprecia mucho su presencia en casa.
      it: |-
        Abbracciarlo dà una piacevole sensazione
        di freschezza. Per chi vive in regioni calde, è
        decisamente un Pokémon da tenere in casa.
    ultra-sun:
      ja-Hrkt: |-
        マイナス　５０どの　れいきを　はく。
        あたたかい　ばしょに　いると
        ちょっとずつ　ちいさくなって　いく。
      ja: |-
        マイナス　５０度の　冷気を　吐く。
        暖かい　場所に　いると
        ちょっとずつ　小さくなって　いく。
      ko: |-
        마이너스 50도 냉기를 내뱉는다.
        따듯한 장소에 있으면
        조금씩 작아진다.
      zh-Hant: |-
        會吐出零下５０度的寒氣。
        如果待在溫暖的地方，
        身體就會漸漸地變小。
      zh-Hans: |-
        会吐出零下５０度的冷气。
        如果呆在温暖的场所，
        就会一点点地变小。
      en: |-
        It exhales cold air that is at –58 degrees
        Fahrenheit. When it’s in a warm place, it shrinks
        little by little.
      fr: |-
        Son souffle glacé descend jusqu’à -50 °C.
        Il fond peu à peu quand il se retrouve dans
        un endroit chaud.
      de: |-
        Die Temperatur seines Atems liegt bei -50 °C.
        Wenn es sich an warmen Orten aufhält, wird es
        nach und nach kleiner.
      es: |-
        Exhala vaho a una temperatura de -50 ºC. Su
        tamaño corporal se reduce poco a poco cuando
        se encuentra en un lugar cálido.
      it: |-
        Il suo fiato ha una temperatura di -50 °C.
        Quando si trova in un luogo caldo, il volume
        del suo corpo si riduce a poco a poco.
    ultra-moon:
      ja-Hrkt: |-
        あさひを　あびる　つららが　まだ
        とけたくないと　ねがい　うまれた。
        よるは　ゆきに　もぐって　ねむる。
      ja: |-
        朝日を　浴びる　つららが　まだ
        溶けたくないと　願い　生まれた。
        夜は　雪に　潜って　眠る。
      ko: |-
        아침 햇살을 받은 고드름이 아직
        녹고 싶지 않다고 소원하여 태어났다.
        밤에는 눈 속에 들어가 잠든다.
      zh-Hant: |-
        誕生自沐浴在朝陽下的
        冰柱還不願融化的心意。
        夜裡會潛進雪中睡覺。
      zh-Hans: |-
        是由沐浴在朝阳下但仍不愿
        融化的冰柱诞生而成。
        晚上会潜入雪中睡觉。
      en: |-
        When the morning sun hit an icicle, it wished not
        to melt, and thus Vanillite was born. At night, it
        buries itself in snow to sleep.
      fr: |-
        Il est né d’une stalactite de glace qui, face au
        soleil du matin, a fait le vœu de ne pas fondre.
        Il se terre dans la neige pour dormir la nuit.
      de: |-
        Es entstand aus dem Wunsch eines Eiszapfens,
        der in der Morgensonne nicht schmelzen wollte.
        Nachts schläft es tief vergraben im Schnee.
      es: |-
        Nació a partir del deseo de una estalactita de
        no derretirse con los rayos del albor. Por la
        noche se arropa bajo la nieve para dormir.
      it: |-
        È nato dal desiderio di una stalattite che non
        voleva sciogliersi ai raggi del sole mattutino.
        La notte dorme immerso nella neve.
    sword:
      ja-Hrkt: |-
        あつい　とちでは　くらせない。
        れいきを　はいて　ゆきを　ふらせ
        つもった　なかに　もぐって　ねむる。
      ja: |-
        暑い　土地では　暮らせない。
        冷気を　吐いて　雪を　降らせ
        積もった　中に　潜って　眠る。
      ko: |-
        더운 곳에서는 살 수 없다.
        냉기를 뿜어 눈을 내리게 한 뒤
        쌓인 눈 속에 들어가 잠든다.
      zh-Hant: |-
        無法在炎熱的地方生存。
        會吐出冷氣來降雪，
        然後窩在積雪裡睡覺。
      zh-Hans: |-
        无法在炎热的地方生存。
        会吐出冷气来降雪，
        然后窝在积雪里睡觉。
      en: |-
        Unable to survive in hot areas, it makes itself
        comfortable by breathing out air cold enough to
        cause snow. It burrows into the snow to sleep.
      fr: |-
        Il ne peut pas vivre dans les contrées chaudes.
        Il souffle un air glacial pour faire tomber la neige,
        puis s’y plonge pour dormir.
      de: |-
        Gelatini kann nicht an warmen Orten leben. Es
        erzeugt Schnee, indem es kalte Luft ausatmet,
        und vergräbt sich dann darin, um zu schlafen.
      es: |-
        No puede vivir en lugares muy cálidos. Provoca
        nevadas exhalando un vaho gélido y luego se
        acurruca en la nieve acumulada para dormir.
      it: |-
        Non può vivere nei luoghi caldi. Fa nevicare
        esalando un alito gelido e poi si addormenta
        immerso nella neve che si è accumulata.
    shield:
      ja-Hrkt: |-
        つららから　うまれたと　いわれる。
        マイナス５０どの　れいきを　はいて
        あたりを　こおらせ　すみやすくする。
      ja: |-
        氷柱から　生まれたと　いわれる。
        マイナス５０度の　冷気を　吐いて
        あたりを　凍らせ　棲みやすくする。
      ko: |-
        고드름에서 태어났다고 전해진다.
        마이너스 50도의 냉기를 뿜어
        주변을 얼려 살기 좋게 만든다.
      zh-Hant: |-
        據說牠是從冰柱中誕生的。
        為了能讓自己生活得更舒適，
        會吐出零下５０度的冷氣凍住四周。
      zh-Hans: |-
        据说它是从冰柱中诞生的。
        为了能让自己生活得更舒适，
        会吐出零下５０度的冷气冻住四周。
      en: |-
        Supposedly, this Pokémon was born from an
        icicle. It spews out freezing air at −58 degrees
        Fahrenheit to make itself more comfortable.
      fr: |-
        On raconte qu’il est né de stalactites.
        Il gèle les alentours en soufflant de l’air à - 50 °C
        pour améliorer son confort.
      de: |-
        Es entstand angeblich aus einem Eiszapfen und
        speit -50 ºC kalte Luft aus, um die Umgebung
        auf seine Wohlfühltemperatur abzukühlen.
      es: |-
        Este Pokémon nació a partir de un carámbano.
        Exhala un vaho a -50 °C con el que congela el
        ambiente para adaptarlo a sus necesidades.
      it: |-
        Si dice che sia nato da una stalattite di ghiaccio.
        Per crearsi un habitat adatto, congela l’ambiente
        intorno con il suo fiato a -50 ºC.
