  evolution_chain: vanillite
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        The temperature of their breath
        is -58° F. They create snow crystals and
        make snow fall in the areas around them.
      fr: |-
        Il exhale une haleine à -50 °C.
        Il fabrique des cristaux de neige
        et fait neiger autour de lui.
    white:
      en: |-
        This Pokémon formed from icicles
        bathed in energy from the morning sun.
        It sleeps buried in snow.
      fr: |-
        Ce Pokémon est né d’un glaçon qui
        a baigné dans la lumière du matin.
        Il se cache dans la neige pour dormir.
    black-2:
      en: |-
        Theoretically, this Pokémon formed from
        icicles bathed in energy from the morning
        sun. Their breath is -58° F.
    white-2:
      en: |-
        Theoretically, this Pokémon formed from
        icicles bathed in energy from the morning
        sun. Their breath is -58° F.
    x:
      ja-Hrkt: |-
        マイナス５０どの　いきを　はく。
        ゆきの　けっしょうを　つくって
        あたりに　ゆきを　ふらせる。
      ja: |-
        マイナス５０度の　息を　吐く。
        雪の　結晶を　作って
        あたりに　雪を　降らせる。
      ko: |-
        마이너스 50도의 숨결을 내뱉는다.
        눈 결정을 만들어
        주변에 눈이 내리게 한다.
      en: |-
        The temperature of their breath is -58 degrees
        Fahrenheit. They create snow crystals and make
        snow fall in the areas around them.
      fr: |-
        Il exhale une haleine à -50 °C. Il fabrique des cristaux
        de neige et fait neiger autour de lui.
      de: |-
        Die Temperatur seines Odems liegt bei -50 °C.
        Es erzeugt Eiskristalle und lässt es in seiner
        Umgebung schneien.
      es: |-
        Lanza un aliento de -50 °C. Crea bloques de nieve y
        es capaz de lograr que nieve a su alrededor.
      it: |-
        Il suo fiato è a -50 °C. Fa nevicare tutto intorno,
        formando dei cristalli di neve.
    'y':
      ja-Hrkt: |-
        あさひの　エネルギーを　あびた
        つららが　ポケモンに　なった。
        ゆきに　からだを　うめて　ねむる。
      ja: |-
        朝日の　エネルギーを　浴びた
        つららが　ポケモンに　なった。
        雪に　体を　埋めて　眠る。
      ko: |-
        아침 해의 에너지를 받은
        고드름이 포켓몬이 되었다.
        눈에 몸을 묻고 잠든다.
      en: |-
        This Pokémon formed from icicles bathed in energy
        from the morning sun. It sleeps buried in snow.
      fr: |-
        Ce Pokémon est né d’un glaçon qui a baigné dans
        la lumière du matin. Il se cache dans la neige pour
        dormir.
      de: |-
        Ein Eiszapfen, der durch die Energie der aufgehenden
        Sonne zum Pokémon wurde. Nachts deckt es sich mit
        Schnee zu.
      es: |-
        Nació de un carámbano que absorbió la energía del
        sol al alba. Duerme arropado por la nieve.
      it: |-
        Pokémon nato da una stalattite che ha ricevuto
        l’energia del sole mattutino. Dorme sepolto sotto
        la neve.
    omega-ruby:
      ja-Hrkt: |-
        マイナス５０どの　いきを　はく。
        ゆきの　けっしょうを　つくって
        あたりに　ゆきを　ふらせる。
      ja: |-
        マイナス５０度の　息を　吐く。
        雪の　結晶を　作って
        あたりに　雪を　降らせる。
      ko: |-
