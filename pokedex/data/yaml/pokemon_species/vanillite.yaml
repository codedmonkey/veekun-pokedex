        snow fall in the areas around them.
      fr: |-
        Il exhale une haleine à -50 °C. Il fabrique des cristaux de neige
        et fait neiger autour de lui.
      de: |-
        Die Temperatur seines Odems liegt bei -50 °C. Es erzeugt
