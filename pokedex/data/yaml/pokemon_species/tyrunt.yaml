tyrunt:
  base_happiness: 50
  capture_rate: 45
  color: brown
  egg_groups:
    - monster
    - dragon
  evolution_chain: tyrunt
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        かせきから　ふっかつした　ポケモン。
        きにいらない　ことが　あると
        かんしゃくを　おこして　おおあばれ。
      ja: |-
        化石から　復活した　ポケモン。
        気に入らない　ことが　あると
        かんしゃくを　起こして　大暴れ。
      ko: |-
        화석에서 부활한 포켓몬이다.
        마음에 들지 않는 일이 있으면
        짜증을 내며 난동을 부린다.
      en: |-
        This Pokémon was restored from a fossil.
        If something happens that it doesn’t like,
        it throws a tantrum and runs wild.
      fr: |-
        Ramené à la vie à partir d’un fossile, ce Pokémon très
        capricieux devient violent à la moindre contrariété.
      de: |-
        Dieses Pokémon wurde aus einem Fossil neu belebt.
        Missfällt ihm etwas, rastet es vollkommen aus.
      es: |-
        Pokémon recreado a partir de fósiles. Cuando sucede
        algo que no es de su agrado, se enfurece y se vuelve
        violento.
      it: |-
        Pokémon risvegliatosi da un fossile.
        Se viene disturbato, si infuria e provoca disastri.
    'y':
      ja-Hrkt: |-
        じどうしゃを　バリバリと　かじって
        こわす　おおあごの　はかいりょく。
        １おくねんまえに　せいそくしていた。
      ja: |-
        自動車を　バリバリと　かじって
        壊す　おおあごの　破壊力。
        １億年前に　生息していた。
      ko: |-
        큰 턱은 자동차를 아드득아드득 갉아서
        부서뜨리는 파괴력을 가졌다
        1억 년 전에 서식하고 있었다.
      en: |-
        Its immense jaws have enough destructive
        force that it can chew up an automobile.
        It lived 100 million years ago.
      fr: |-
        Ses énormes mâchoires ont tant de puissance qu’elles
        peuvent compresser une voiture sans problème.
        Ce Pokémon vivait il y a 100 millions d’années.
      de: |-
        Mit seinem gewaltigen Kiefer kann dieses Pokémon,
        das vor 100 Millionen Jahren lebte, ein Auto so leicht
        zermalmen, als wäre es ein reifer Apfel.
      es: |-
        Su gran mandíbula posee una potencia tan atroz que
        sería capaz de destruir a bocados un coche. Ya vivía
        hace la friolera de 100 millones de años.
      it: |-
        Questo Pokémon visse 100 milioni di anni fa.
        Grazie alle fauci tremendamente forti, potrebbe
        masticare un’automobile senza sforzo.
    omega-ruby:
      ja-Hrkt: |-
        かせきから　ふっかつした　ポケモン。
        きにいらない　ことが　あると
        かんしゃくを　おこして　おおあばれ。
      ja: |-
        化石から　復活した　ポケモン。
        気に入らない　ことが　あると
        かんしゃくを　起こして　大暴れ。
      ko: |-
        화석에서 부활한 포켓몬이다.
        마음에 들지 않는 일이 있으면
        짜증을 내며 난동을 부린다.
      en: |-
        This Pokémon was restored from a fossil.
        If something happens that it doesn’t like,
        it throws a tantrum and runs wild.
      fr: |-
        Ramené à la vie à partir d’un fossile, ce Pokémon très
        capricieux devient violent à la moindre contrariété.
      de: |-
        Dieses Pokémon wurde aus einem Fossil neu belebt.
        Missfällt ihm etwas, rastet es vollkommen aus.
      es: |-
        Pokémon recreado a partir de fósiles. Cuando sucede algo
        que no es de su agrado, se enfurece y se vuelve violento.
      it: |-
        Pokémon risvegliatosi da un fossile. Se viene disturbato,
        si infuria e provoca disastri.
    alpha-sapphire:
      ja-Hrkt: |-
        じどうしゃを　バリバリと　かじって
        こわす　おおあごの　はかいりょく。
        １おくねんまえに　せいそくしていた。
      ja: |-
        自動車を　バリバリと　かじって
        壊す　おおあごの　破壊力。
        １億年前に　生息していた。
      ko: |-
        큰 턱은 자동차를 아드득아드득 갉아서
        부서뜨리는 파괴력을 가졌다.
        1억 년 전에 서식하고 있었다.
      en: |-
        Its immense jaws have enough destructive
        force that it can chew up an automobile.
        It lived 100 million years ago.
      fr: |-
        Ses énormes mâchoires ont tant de puissance qu’elles peuvent
        compresser une voiture sans problème. Ce Pokémon vivait
        il y a 100 millions d’années.
      de: |-
        Mit seinem gewaltigen Kiefer kann dieses Pokémon, das vor
        100 Millionen Jahren lebte, ein Auto so leicht zermalmen,
        als wäre es ein reifer Apfel.
      es: |-
        Su gran mandíbula posee una potencia tan atroz que sería
        capaz de destruir a bocados un coche. Ya vivía hace la friolera
        de 100 millones de años.
      it: |-
        Questo Pokémon visse 100 milioni di anni fa. Grazie alle fauci
        tremendamente forti, potrebbe masticare un’automobile
        senza sforzo.
    ultra-sun:
      ja-Hrkt: |-
        おおアゴは　すさまじい　はかいりょく。
        ふくげんさせても　とうじと　おなじ
        すがたでは　ないという　せつもある。
      ja: |-
        大アゴは　凄まじい　破壊力。
        復元させても　当時と　同じ
        姿では　ないという　説もある。
      ko: |-
        큰 턱은 무시무시한 파괴력을
        지녔다. 복원시켜도 당시와
        같은 모습은 아니라는 설도 있다.
      zh-Hant: |-
        大顎有著非常驚人的破壞力。
        也有一種說法是，即使將牠復原，
        也無法重現牠原本的樣子。
      zh-Hans: |-
        大颚有着非常惊人的破坏力。
        有说法，即使复原，
        也没法恢复到原本的样子。
      en: |-
        Its large jaw has incredible destructive power.
        Some theories suggest that its restored form is
        different from its form of long ago.
      fr: |-
        Sa mâchoire géante est d’une puissance
        redoutable. Le Pokémon reconstitué serait
        légèrement différent de son modèle antique.
      de: |-
        Sein riesiger Kiefer birgt zerstörerische Kräfte.
        Es heißt, zurückverwandelte Balgoras seien
        nicht identisch mit den ursprünglichen Pokémon.
      es: |-
        Puede ejercer una enorme presión con su gran
        mandíbula. Se cree que esta especie regenerada
        a partir de un fósil difiere de la de tiempo ha.
      it: |-
        La sua mandibola ha un’enorme forza
        distruttrice. Secondo alcuni il suo aspetto
        originale è un po’ diverso da quello rigenerato.
    ultra-moon:
      ja-Hrkt: |-
        あまえんぼうで　わがまま。　チゴラスは
        じゃれているつもりでも　あいては
        おおけがでは　すまないことも　ある。
      ja: |-
        甘えんぼうで　わがまま。　チゴラスは
        じゃれているつもりでも　相手は
        大怪我では　済まないことも　ある。
      ko: |-
        응석받이에 제멋대로다. 티고라스는
        장난으로 한 일이라도 상대는
        큰 부상으로 끝나지 않을 때도 있다.
      zh-Hant: |-
        愛撒嬌又任性。有時候
        即使寶寶暴龍只是想鬧著玩，
        對手也會受到重創。
      zh-Hans: |-
        爱撒娇又任性。有时候，
        即使宝宝暴龙只打算逗着玩，
        对方也会严重受伤。
      en: |-
        Tyrunt is spoiled and selfish. It may just be
        trying to frolic, but sometimes the ones it’s
        trying to frolic with are gravely injured.
      fr: |-
        Il est un peu égoïste et aime être le centre
        d’attention. Il arrive que ses partenaires de jeu
        finissent avec de graves blessures.
      de: |-
        Es ist verwöhnt und trotzig. Wer es mit ihm zu
        tun hat, muss eventuell mit mehr als schweren
        Wunden rechnen, selbst wenn es nur spielen will.
      es: |-
        Un tanto egoísta y malcriado. Aunque solo esté
        bromeando, a veces puede causar graves
        heridas a sus compañeros de juegos.
      it: |-
        È capriccioso e ama farsi coccolare.
        Anche se non lo fa di proposito, può ferire
        gravemente il suo compagno di giochi.
    sword:
      ja-Hrkt: |-
        よみがえった　こだいの　ポケモン。
        きしょうは　あらく　みがって。
        おおあごで　なんでも　かみくだく。
      ja: |-
        蘇った　古代の　ポケモン。
        気性は　荒く　身勝手。
        大顎で　なんでも　かみ砕く。
      ko: |-
        되살아난 고대의 포켓몬이다.
        거칠고 제멋대로인 기질을 지녔다.
        큰 턱으로 뭐든지 깨물어 부순다.
      zh-Hant: |-
        復活的古代寶可夢。
        性情粗暴又任性。
        能用大顎咬碎任何東西。
      zh-Hans: |-
        复活而来的古代宝可梦。
        性格既粗野又任性，
        能用大颚咬碎任何东西。
      en: |-
        This is an ancient Pokémon, revived in modern
        times. It has a violent disposition, and it’ll tear
        apart anything it gets between its hefty jaws.
      fr: |-
        Ce Pokémon ancien a été ranimé à partir
        d’un fossile. Égoïste et violent, il peut détruire
        n’importe quoi avec son énorme mâchoire.
      de: |-
        Ein wiederbelebtes Pokémon aus der Urzeit.
        Es ist gewalttätig sowie egoistisch und zerbeißt
        alles mit seinem riesigen Kiefer.
      es: |-
        Pokémon prehistórico recreado a partir de un
        fósil. De carácter violento y egoísta, sus enormes
        mandíbulas pueden triturar cualquier cosa.
      it: |-
        Un antico Pokémon rigenerato da un fossile.
        Ha un’indole violenta ed egoista. Con la sua
        enorme mandibola fa a pezzi qualsiasi cosa.
    shield:
      ja-Hrkt: |-
        わがままだが　あまえんぼう。
        じゃれてるだけで　トレーナーに
        おおけがを　おわせてしまう。
      ja: |-
        わがままだが　甘えん坊。
        じゃれてるだけで　トレーナーに
        大けがを　負わせてしまう。
      ko: |-
        제멋대로지만 응석꾸러기다.
        장난만 쳐도 트레이너에게
        큰 상처를 입히고 만다.
      zh-Hant: |-
        任性且愛撒嬌。
        即使牠只是鬧著玩，
        也會讓訓練家受到重傷。
      zh-Hans: |-
        又任性又爱撒娇。
        即使它只是闹着玩，
        也会让训练家受重伤。
      en: |-
        This Pokémon is selfish and likes to be pampered.
        It can also inflict grievous wounds on its Trainer
        just by playing around.
      fr: |-
        Capricieux, il veut toujours être le centre
        de l’attention. Il peut gravement blesser
        son Dresseur en essayant de jouer avec lui.
      de: |-
        Es ist eigennützig und verzogen. Selbst wenn
        Balgoras nur spielen will, verletzt es dabei seinen
        Trainer manchmal schwer.
      es: |-
        Un Pokémon un tanto egoísta y malcriado. Puede
        ocasionar graves lesiones a su Entrenador incluso
        jugando.
      it: |-
        È capriccioso e ama farsi coccolare.
        Quando gioca con il suo Allenatore,
        rischia di ferirlo gravemente.
