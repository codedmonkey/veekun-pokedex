    x:
      ja-Hrkt: |-
        くもより　はるかうえの　オゾンそうに
        せいそくしているため　ちじょうから
        すがたを　みることは　できない。
      ja: |-
        雲より　はるか上の　オゾン層に
        生息しているため　地上から
        姿を　見ることは　できない。
      ko: |-
        구름보다 아득히 먼 위의 오존층에
        서식하고 있기 때문에 지상에서
        모습을 볼 수 없다.
      en: |-
        It lives in the ozone layer far above the clouds and
        cannot be seen from the ground.
      fr: |-
        Il vit dans la couche d’ozone, au-dessus des nuages.
        Il est invisible depuis le sol.
      de: |-
        Es lebt in der Ozonschicht hoch über den Wolken
        und kann vom Boden aus nicht gesehen werden.
      es: |-
        Vive en la capa de ozono sobre las nubes y no puede
        ser visto desde el suelo.
      it: |-
        Vive nello strato di ozono oltre le nuvole e non può
        essere avvistato da terra.
    'y':
      ja-Hrkt: |-
        はるか　じょうくうの　オゾンそうの
        なかを　とんでいるため　さいきんまで
        すがたを　みた　ものは　いなかった。
      ja: |-
        はるか　上空の　オゾン層の　中を
        飛んでいるため　最近まで
        姿を　見た　者は　いなかった。
      ko: |-
        아득한 상공의 오존층
        안을 날고 있기 때문에 최근까지
        모습을 본 사람은 없었다.
      en: |-
        It flies in the ozone layer, way up high in the sky.
        Until recently, no one had ever seen it.
      fr: |-
        On ne l’a vu pour la première fois que très récemment
        car il vit dans la lointaine couche d’ozone.
      de: |-
        Da es in der Ozonschicht hoch über den Wolken lebt,
        bekam es bis vor Kurzem noch niemand zu Gesicht.
      es: |-
        Como hasta hace poco volaba a la altura de la capa
        de ozono, nadie lo había visto nunca.
      it: |-
        Vive in alto, nello strato di ozono, troppo lontano
        perché qualcuno l’abbia mai potuto avvistare.
    omega-ruby:
      ja-Hrkt: |-
        なんおくねんも　いきつづけていると　いわれる。
        グラードンと　カイオーガの　あらそいを
        おさめたという　でんせつが　のこされている。
      ja: |-
        何億年も　生き続けていると　いわれる。
        グラードンと　カイオーガの　争いを
        治めたという　伝説が　残されている。
      ko: |-
        몇억 년 동안 계속 살고 있다고 한다.
        그란돈과 가이오가의 사투를
        진정시켰다는 전설이 남아 있다.
      en: |-
        Rayquaza is said to have lived for hundreds of millions
        of years. Legends remain of how it put to rest
        the clash between Kyogre and Groudon.
      fr: |-
        On raconte qu’il aurait plus de 10 000 ans.
        Selon les légendes, c’est grâce à lui que Kyogre et Groudon
        ont cessé de se battre.
      de: |-
        Es heißt, Rayquaza lebe bereits seit mehreren
        hundert Millionen Jahren. Legenden zufolge hat es den
        einstigen Konflikt zwischen Groudon und Kyogre beendet.
      es: |-
        Dicen que Rayquaza ha vivido durante millones de años.
        Las leyendas cuentan que puso fin al continuo enfrentamiento
        entre Groudon y Kyogre.
      it: |-
        Si dice che abbia centinaia di milioni di anni.
        Secondo la leggenda, mise fine alla lotta
        tra Groudon e Kyogre.
    alpha-sapphire:
      ja-Hrkt: |-
        オゾンそうを　とびつづけ　エサとなる
        いんせきを　くらう。たいないに　たまった
        いんせきの　エネルギーで　メガシンカする。
      ja: |-
        オゾン層を　飛び続け　エサとなる
        隕石を　くらう。体内に　たまった
        隕石の　エネルギーで　メガシンカする。
      ko: |-
        오존층을 날아다니며 먹이인
        운석을 먹는다. 체내에 모인
        운석의 에너지로 메가진화한다.
      en: |-
        It flies forever through the ozone layer, consuming
        meteoroids for sustenance. The many meteoroids
        in its body provide the energy it needs to Mega Evolve.
      fr: |-
        Un Pokémon qui vit dans la couche d’ozone et se nourrit
        des météorites qu’il intercepte. Leur énergie s’accumule
        dans son corps, ce qui lui permet de méga-évoluer.
      de: |-
        Es fliegt durch die Ozonschicht und ernährt sich von Meteoren.
        Mithilfe der Energie, die durch diese Meteore in seinen Körper
        gelangt, kann es eine Mega-Entwicklung durchführen.
      es: |-
        Rayquaza ha vivido en la capa de ozono durante millones de
        años, alimentándose de meteoritos. La energía de estos
        meteoritos se acumula en su cuerpo y le permite
        megaevolucionar.
      it: |-
        Risiede nello strato di ozono, dove si nutre di meteoriti.
        Grazie alla loro energia che si accumula all’interno del
        suo corpo, può megaevolversi.
