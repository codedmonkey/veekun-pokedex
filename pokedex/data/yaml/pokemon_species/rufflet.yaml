rufflet:
  base_happiness: 50
  capture_rate: 190
  color: white
  egg_groups:
    - flying
  evolution_chain: rufflet
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        They crush berries with their talons.
        They bravely stand up to any opponent,
        no matter how strong it is.
      fr: |-
        Il casse les Baies avec ses serres.
        Il combat courageusement, quelle que
        soit la force de l’adversaire.
    white:
      en: |-
        They will challenge anything, even strong
        opponents, without fear. Their frequent
        fights help them become stronger.
      fr: |-
        Il défie sans discernement même les
        ennemis puissants. Il devient plus fort
        en multipliant les combats.
    black-2:
      en: |-
        It stands up to massive opponents, not
        out of courage, but out of recklessness.
        But that is how it gets stronger.
    white-2:
      en: |-
        It stands up to massive opponents, not
        out of courage, but out of recklessness.
        But that is how it gets stronger.
    x:
      ja-Hrkt: |-
        きゃくりょくで　きのみを　くだく。
        どんなに　つよい　あいてでも
        ゆうかんに　たちむかう　しゅうせい。
      ja: |-
        脚力で　木の実を　砕く。
        どんなに　強い　相手でも
        勇敢に　立ち向かう　習性。
      ko: |-
        다리 힘으로 나무열매를 으깬다.
        아무리 강한 상대라도
        용감히 맞서는 습성이 있다.
      en: |-
        They crush berries with their talons. They bravely
        stand up to any opponent, no matter how strong
        it is.
      fr: |-
        Il casse les Baies avec ses serres. Il combat
        courageusement, quelle que soit la force de
        l’adversaire.
      de: |-
        Kann mit seinen Füßen Nüsse zermalmen.
        Es stellt sich jedem noch so starken Gegner
        tapfer zum Kampf.
      es: |-
        Quiebra bayas con sus extremidades. Se enfrenta con
        valentía a todo enemigo por fuerte que este sea.
      it: |-
        Si serve degli arti come schiaccianoci per rompere le
        bacche. Affronta con valore anche i nemici più forti.
    'y':
      ja-Hrkt: |-
        つよい　あいてにも　みさかいなく
        たたかいを　いどむ。たたかいを
        くりかえす　ことで　つよくなるのだ。
      ja: |-
        強い　相手にも　見境なく　戦いを
        挑む。戦いを　繰り返す　ことで
        強くなるのだ。
      ko: |-
        강한 상대에게도 무작정
        싸움을 건다. 싸움을 계속
        반복하며 강해진다.
      en: |-
        They will challenge anything, even strong
        opponents, without fear. Their frequent fights help
        them become stronger.
      fr: |-
        Il défie sans discernement même les ennemis
        puissants. Il devient plus fort en multipliant les
        combats.
      de: |-
        Es zettelt willkürlich Kämpfe an, egal wie stark
        der Gegner auch ist. Es gewinnt an Stärke,
        indem es seine Fehler analysiert.
      es: |-
        Desafía indiscriminadamente a rivales poderosos.
        Librar numerosas batallas lo hace fuerte.
      it: |-
        Sfida indiscriminatamente avversari anche più forti
        di lui. Si irrobustisce a forza di lottare.
    omega-ruby:
      ja-Hrkt: |-
        きゃくりょくで　きのみを　くだく。
        どんなに　つよい　あいてでも
        ゆうかんに　たちむかう　しゅうせい。
      ja: |-
        脚力で　木の実を　砕く。
        どんなに　強い　相手でも
        勇敢に　立ち向かう　習性。
      ko: |-
        다리 힘으로 나무열매를 으깬다.
        아무리 강한 상대라도
        용감히 맞서는 습성이 있다.
      en: |-
        They crush berries with their talons. They bravely
        stand up to any opponent, no matter how strong
        it is.
      fr: |-
        Il casse les Baies avec ses serres. Il combat courageusement,
        quelle que soit la force de l’adversaire.
      de: |-
        Kann mit seinen Füßen Nüsse zermalmen. Es stellt sich jedem
        noch so starken Gegner tapfer zum Kampf.
      es: |-
        Quiebra bayas con sus extremidades. Se enfrenta con valentía
        a todo enemigo por fuerte que este sea.
      it: |-
        Si serve degli arti come schiaccianoci per rompere le bacche.
        Affronta con valore anche i nemici più forti.
    alpha-sapphire:
      ja-Hrkt: |-
        つよい　あいてにも　みさかいなく
        たたかいを　いどむ。たたかいを
        くりかえす　ことで　つよくなるのだ。
      ja: |-
        強い　相手にも　見境なく　戦いを
        挑む。戦いを　繰り返す　ことで
        強くなるのだ。
      ko: |-
        강한 상대에게도 무작정
        싸움을 건다. 싸움을 계속
        반복하며 강해진다.
      en: |-
        They will challenge anything, even strong
        opponents, without fear. Their frequent fights help
        them become stronger.
      fr: |-
        Il défie sans discernement même les ennemis puissants.
        Il devient plus fort en multipliant les combats.
      de: |-
        Es zettelt willkürlich Kämpfe an, egal wie stark der Gegner
        auch ist. Es gewinnt an Stärke, indem es seine Fehler
        analysiert.
      es: |-
        Desafía indiscriminadamente a rivales poderosos. Librar
        numerosas batallas lo hace fuerte.
      it: |-
        Sfida indiscriminatamente avversari anche più forti di lui.
        Si irrobustisce a forza di lottare.
    sun:
      ja-Hrkt: |-
        みさかいなく　たたかいを　いどむ。
        たおれるたびに　きずつくたびに
        つよく　たくましく　そだっていく。
      ja: |-
        見境なく　勝負を　挑む。
        倒れるたびに　傷つくたびに
        強く　たくましく　育っていく。
      ko: |-
        무작정 싸움을 건다.
        쓰러질 때마다 다칠 때마다
        강하고 늠름하게 성장해간다.
      zh-Hant: |-
        會不由分說挑起戰鬥。
        隨著每次被打倒，每次受傷，
        會成長得更強更壯。
      zh-Hans: |-
        会不由分说挑起战斗。
        随着每次被打倒，每次受伤，
        成长得更强更壮。
      en: |-
        They pick fights indiscriminately. They grow
        stronger and more powerful each time they
        faint or are injured.
      fr: |-
        Il s’attaque à tout ce qui bouge, sans
        discrimination. Ses blessures et échecs
        ne font que le rendre plus fort.
      de: |-
        Es zettelt willkürlich Kämpfe an, egal wie
        stark der Gegner auch ist. Es gewinnt mit
        jeder Niederlage und Blessur an Stärke.
      es: |-
        Desafía indiscriminadamente a cualquier rival.
        Cada vez que le hieren en combate o se debilita
        no hace sino aumentar su fortaleza.
      it: |-
        Si scaglia contro qualsiasi avversario.
        Ogni volta che viene ferito o sconfitto,
        diventa più forte.
    moon:
      ja-Hrkt: |-
        とがったツメを　えものに　つきたて
        ついばんでいる。　きのみも　たべるが
        きほんてきに　にくしょくの　ポケモン。
      ja: |-
        尖ったツメを　獲物に　突き立て
        ついばんでいる。　木の実も　食べるが
        基本的に　肉食の　ポケモン。
      ko: |-
        뾰족한 발톱을 사냥감에게 꽂고
        쪼아 먹는다. 나무열매도 먹지만
        기본적으로 육식 포켓몬이다.
      zh-Hant: |-
        用尖尖的爪子刺穿獵物
        後啄食。雖然也會吃樹果，
        但基本上是肉食性寶可夢。
      zh-Hans: |-
        用尖尖的爪子刺穿猎物
        并进行啄食。也会吃树果，
        但基本上是肉食类宝可梦。
      en: |-
        With its sharp claws, this Pokémon pierces its
        prey, and then it pecks at them. Although it also
        consumes berries, it’s a carnivore at heart.
      fr: |-
        Il agrippe ses proies avec ses serres effilées
        et les picore. Il lui arrive de manger des Baies,
        mais au fond c’est un carnivore.
      de: |-
        Mit seinen scharfen Fängen packt es seine
        Beute und pickt danach. Generell ist es ein
        Fleischfresser, es isst aber auch Beeren.
      es: |-
        Es un Pokémon carnívoro, aunque no les hace
        ascos a las bayas. Clava con ahínco sus garras
        afiladas en la presa para picotearla sin cesar.
      it: |-
        Infilza le prede con i suoi artigli affilati e le
        attacca a beccate. È principalmente carnivoro,
        ma può mangiare anche le bacche.
    ultra-sun:
      ja-Hrkt: |-
        つよい　きゃくりょくと　じょうぶな
        ツメで　かたい　シェルダーの　カラも
        くだいて　なかみを　ついばむ。
      ja: |-
        強い　脚力と　丈夫な　ツメで
        硬い　シェルダーの　カラも
        砕いて　中身を　ついばむ。
      ko: |-
        강한 다릿심과 튼튼한 발톱으로
        딱딱한 셀러의 껍질도 부수고
        안에 있는 내용물을 쪼아 먹는다.
      zh-Hant: |-
        靠著強大的腳力和結實的爪子，
        連大舌貝的堅硬外殼都能弄碎，
        去啄食裡面的東西。
      zh-Hans: |-
        用强大的脚力和结实的爪子，
        连大舌贝的坚硬外壳都能弄碎，
        将里面的东西啄出来。
      en: |-
        With its powerful legs and sturdy claws, it can
        crack even the hard shells of Shellder and pluck
        out their insides.
      fr: |-
        Grâce à ses pattes puissantes et à ses serres
        robustes, il arrive même à briser la coquille de
        Kokiyas pour se délecter de son contenu.
      de: |-
        Mit seinen kräftigen Beinen und robusten Krallen
        kann es selbst die harte Schale eines Muschas
        aufbrechen und das Innere herauspicken.
      es: |-
        La fuerza de los talones y dureza de las garras
        le permiten perforar la coraza de los Shellder
        para picotear su cuerpo.
      it: |-
        Ha arti potenti e artigli robusti con cui riesce
        a frantumare anche la corazza degli Shellder
        per poterne beccare il corpo all’interno.
    ultra-moon:
      ja-Hrkt: |-
        うまれながらの　せんしと　よばれる。
        うまれて　すぐに　おやに　いどみ
        みとめてもらわなければ　いけない。
      ja: |-
        生まれながらの　戦士と　呼ばれる。
        生まれて　すぐに　親に　挑み
        認めてもらわなければ　いけない。
      ko: |-
        타고난 전사라고 불린다.
        태어나자마자 부모에게 도전하여
        인정을 받아야 한다.
      zh-Hant: |-
        被稱為天生的戰士。一出生
        就必須挑戰自己的父母親，
        並獲得父母親的認可。
      zh-Hans: |-
        被称为天生的战士。
        出生后必须立即向父母亲发起挑战，
        并得到对方的认可。
      en: |-
        Known as a natural-born warrior, soon after its
        hatching, it will challenge its parent to a fight in
        order to gain their acceptance.
      fr: |-
        C’est un guerrier endurci dès sa naissance.
        Il commence d’ailleurs par défier ses parents
        au combat pour leur prouver sa valeur.
      de: |-
        Dieses Pokémon gilt als geborener Krieger.
        Kaum ist es geschlüpft, tritt es gegen seine
        Eltern an, um ihre Anerkennung zu bekommen.
      es: |-
        Su especie es guerrera y belicosa por naturaleza
        y lo primero que hacen nada más nacer es medir
        sus fuerzas contra sus progenitores.
      it: |-
        È considerato un lottatore nato: la prima cosa
        che fa quando viene al mondo è sfidare i genitori
        per guadagnarsi la loro approvazione.
    sword:
      ja-Hrkt: |-
        つよそうな　ポケモンを　みると
        たたかいを　いどまずに　いられない。
        まけると　おおごえで　なきだす。
      ja: |-
        強そうな　ポケモンを　見ると
        戦いを　挑まずに　いられない。
        負けると　大声で　泣きだす。
      ko: |-
        강해 보이는 포켓몬을 발견하면
        싸움을 걸지 않고는 못 배긴다.
        지면 큰 소리로 울어댄다.
      zh-Hant: |-
        每當遇到看似強勁的寶可夢，
        都會忍不住去挑起戰鬥。
        如果輸了就會放聲大哭。
      zh-Hans: |-
        每当遇到看似强劲的宝可梦，
        都会忍不住去挑起战斗。
        如果输了则会放声大哭。
      en: |-
        If it spies a strong Pokémon, Rufflet can’t resist
        challenging it to a battle. But if Rufflet loses,
        it starts bawling.
      fr: |-
        Il ne peut pas s’empêcher de défier les Pokémon
        qui ont l’air forts. Lorsqu’il perd, il pousse un cri
        assourdissant.
      de: |-
        Wenn es einen starken Gegner erblickt, kommt
        es nicht umhin, ihn anzugreifen. Verliert es den
        Kampf, so fängt es an zu weinen.
      es: |-
        Cuando ve a un Pokémon de aspecto fuerte,
        no puede resistirse a desafiarlo en combate.
        Si pierde, llora y se lamenta a pleno pulmón.
      it: |-
        Quando scorge un Pokémon che ha l’aria di
        essere forte, lo deve sfidare a tutti i costi. Se
        perde, piange più forte che può.
    shield:
      ja-Hrkt: |-
        かたい　きのみも　こなごなに　くだく
        あくりょく。　ケンカっぱやく
        だれにでも　しょうぶを　しかける。
      ja: |-
        硬い　木の実も　粉々に　砕く
        握力。　喧嘩っ早く
        誰にでも　勝負を　仕掛ける。
      ko: |-
        딱딱한 나무열매도 산산조각 내는
        악력을 가졌다. 쉽게 다투고
        아무에게나 승부를 건다.
      zh-Hant: |-
        握力強，能把堅硬的樹果
        弄得粉碎。性急愛吵架，
        無論對誰都會挑起戰鬥。
      zh-Hans: |-
        握力强，能把坚硬的树果
        弄得粉碎。性急爱吵架，
        无论对谁都会挑起战斗。
      en: |-
        A combative Pokémon, it’s ready to pick a fight
        with anyone. It has talons that can crush
        hard berries.
      fr: |-
        Sa poigne est telle qu’il peut réduire en miettes
        les plus dures des Baies. Belliqueux de nature,
        il n’hésite pas à défier tout le monde.
      de: |-
        Seine starken Klauen können selbst harte Beeren
        zermalmen. Es ist so streitsüchtig, dass es jeden
        zum Kampf herausfordert, dem es begegnet.
      es: |-
        Es capaz de partir hasta la baya más dura gracias
        a la fuerza de sus extremidades. Belicoso por
        naturaleza, planta cara a cualquiera.
      it: |-
        La sua stretta riduce in frantumi anche le bacche
        più dure. È un attaccabrighe e sfida chiunque
        gli capiti a tiro.
