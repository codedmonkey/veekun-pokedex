  flavor_text:
    diamond:
      en: |-
        Small Pokémon occasionally gather
        on its unmoving back to begin
        building their nests.
    pearl:
      en: |-
        Groups of this Pokémon migrating
        in search of water have been
        mistaken for “moving forests.”
    platinum:
      en: |-
        Some Pokémon are born on a
        TORTERRA’s back and spend their
        entire life there.
    heartgold:
      en: |-
        Ancient people imagined that
        beneath the ground, a gigantic
        TORTERRA dwelled.
    soulsilver:
      en: |-
        Ancient people imagined that
        beneath the ground, a gigantic
        TORTERRA dwelled.
    black:
      en: |-
        Some Pokémon are born on a
        Torterra’s back and spend their
        entire life there.
      fr: |-
        Certains petits Pokémon peuvent
        naître sur son dos et y passer
        toute leur vie.
    white:
      en: |-
        Some Pokémon are born on a
        Torterra’s back and spend their
        entire life there.
      fr: |-
        Certains petits Pokémon peuvent
        naître sur son dos et y passer
        toute leur vie.
    black-2:
      en: |-
        Some Pokémon are born on a
        Torterra’s back and spend their
        entire life there.
    white-2:
      en: |-
        Some Pokémon are born on a
        Torterra’s back and spend their
        entire life there.
    x:
      ja-Hrkt: |-
        おおむかしの　ひとびとは　だいちの
        したには　きょだいな　ドダイトスが
        いると　くうそう　していた。
      ja: |-
        大昔の　人々は　大地の　下には
        巨大な　ドダイトスが　いると
        空想していた。
      ko: |-
        오랜 옛날 사람들은 대지
        밑에 거대한 토대부기가
        있다고 공상했었다.
      en: |-
        Ancient people imagined that beneath the ground,
        a gigantic Torterra dwelled.
      fr: |-
        Autrefois, les gens pensaient qu’un gigantesque
        Torterra vivait sous la surface de la Terre.
      de: |-
        In alten Zeiten malten die Menschen sich aus,
        die Erde ruhe auf dem Rücken eines riesigen
        Chelterrar.
      es: |-
        Las gentes de antaño creían que el planeta se
        sustentaba en la espalda de un gran Torterra.
      it: |-
        In tempi antichissimi la gente pensava che sottoterra
        ci fossero dei giganteschi Torterra.
    'y':
      ja-Hrkt: |-
        ちいさな　ポケモンたちが　あつまり
        うごかない　ドダイトスの　せなかで
        すづくりを　はじめることがある。
      ja: |-
        小さな　ポケモンたちが　集まり
        動かない　ドダイトスの　背中で
        巣作りを　はじめることがある。
      ko: |-
        작은 포켓몬들이 모여
        움직이지 않는 토대부기의 등에서
        둥지를 만들려고 하는 경우가 있다.
      en: |-
        Small Pokémon occasionally gather on its unmoving
        back to begin building their nests.
      fr: |-
        Il arrive que de petits Pokémon se rassemblent sur
        son dos immobile pour y faire leur nid.
      de: |-
        Kleine Pokémon fangen manchmal an, auf dem
        bewegungslosen Rücken Nester zu bauen.
      es: |-
        Algunos Pokémon pequeños se juntan en su espalda
        para hacer sus nidos.
      it: |-
        Piccoli Pokémon si radunano talvolta sul suo dorso
        immobile per costruirvi la loro tana.
    omega-ruby:
      ja-Hrkt: |-
        おおむかしの　ひとびとは　だいちの
        したには　きょだいな　ドダイトスが
        いると　くうそう　していた。
      ja: |-
        大昔の　人々は　大地の　下には
        巨大な　ドダイトスが　いると
        空想していた。
      ko: |-
        오랜 옛날 사람들은 대지
        밑에 거대한 토대부기가
        있다고 공상했었다.
      en: |-
        Ancient people imagined that beneath the ground,
        a gigantic Torterra dwelled.
      fr: |-
        Autrefois, les gens pensaient qu’un gigantesque Torterra vivait
        sous la surface de la Terre.
      de: |-
        In alten Zeiten malten die Menschen sich aus, die Erde ruhe
        auf dem Rücken eines riesigen Chelterrar.
      es: |-
        Las gentes de antaño creían que el planeta se sustentaba en
        la espalda de un gran Torterra.
      it: |-
        In tempi antichissimi la gente pensava che sottoterra ci fossero
        dei giganteschi Torterra.
    alpha-sapphire:
      ja-Hrkt: |-
        ちいさな　ポケモンたちが　あつまり
        うごかない　ドダイトスの　せなかで
        すづくりを　はじめることがある。
      ja: |-
        小さな　ポケモンたちが　集まり
        動かない　ドダイトスの　背中で
        巣作りを　はじめることがある。
      ko: |-
        작은 포켓몬들이 모여
        움직이지 않는 토대부기의 등에서
        둥지를 만들려고 하는 경우가 있다.
      en: |-
        Small Pokémon occasionally gather on its unmoving
        back to begin building their nests.
      fr: |-
        Il arrive que de petits Pokémon se rassemblent sur son dos
        immobile pour y faire leur nid.
      de: |-
        Kleine Pokémon fangen manchmal an, auf dem
        bewegungslosen Rücken Nester zu bauen.
      es: |-
        Algunos Pokémon pequeños se juntan en su espalda para
        hacer sus nidos.
      it: |-
        Piccoli Pokémon si radunano talvolta sul suo dorso immobile
        per costruirvi la loro tana.
    legends-arceus:
      en: |-
        This remarkable, large-bodied Pokémon would serve beautifully
        as borrowed scenery for a garden, and its strength is peerless.
        Torterra roams the wilderness in search of clean water.
