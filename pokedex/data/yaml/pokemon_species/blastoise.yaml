        위기에 처하면 등껍질에 숨는다.
      zh-Hant: |-
        會用重量驚人的身體
        壓住對手使其昏厥。
        遇到危險時會躲進殼裡。
      zh-Hans: |-
        身体很重，压住对手后
        就能让对手昏厥。
        遇到危险时会躲进壳里。
      en: |-
