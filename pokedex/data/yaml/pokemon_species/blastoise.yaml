    x:
      ja-Hrkt: |-
        からだが　おもたく　のしかかって
        あいてを　きぜつさせる。
        ピンチの　ときは　カラに　かくれる。
      ja: |-
        体が　重たく　のしかかって
        相手を　気絶させる。
        ピンチのときは　殻に　隠れる。
      ko: |-
        무거운 몸으로 상대를
        덮쳐서 기절시킨다.
        위기에 처하면 등껍질에 숨는다.
      en: |-
        It crushes its foe under its heavy body to cause
        fainting. In a pinch, it will withdraw inside its shell.
      fr: |-
        Il écrase ses adversaires de tout son poids pour leur
        faire perdre connaissance. Il rentre dans sa carapace
        s’il se sent en danger.
      de: |-
        Es begräbt seine Gegner mit seinem enormen
        Körpergewicht. Wenn es in einer aussichtslosen
        Lage steckt, zieht es sich in seinen Panzer zurück.
      es: |-
        Para acabar con su enemigo, lo aplasta con el peso de
        su cuerpo. En momentos de apuro, se esconde en el
        caparazón.
      it: |-
        Mette KO gli avversari schiacciandoli sotto il corpo
        possente. Se è in difficoltà, può ritrarsi nella corazza.
    'y':
      ja-Hrkt: |-
        こうらに　ふんしゃこうが　あって
        ロケットのような　いきおいで
        つっこんでくる　すごい　やつだ。
      ja: |-
        甲羅に　噴射口が　あって
        ロケットのような　勢いで
        突っこんでくる　すごい　やつだ。
      ko: |-
        등껍질에 분사구가 있어
        로켓 같은 기세로
        덤벼드는 굉장한 녀석이다.
      en: |-
        The pressurized water jets on this brutal Pokémon’s
        shell are used for high-speed tackles.
      fr: |-
        Ce Pokémon brutal est armé de canons hydrauliques.
        Ses puissants jets d’eau sont dévastateurs.
      de: |-
        Ein mächtiges und schnelles Pokémon, das auf
        dem Rücken zwei Hochdruckwasserwerfer trägt.
      es: |-
        Es un Pokémon imponente. Tiene reactores de agua
        en el caparazón, que le sirven para atacar con fuerza.
      it: |-
        Pokémon brutale che lancia getti d’acqua ad alta
        pressione dalla corazza, usati per attacchi rapidi.
    omega-ruby:
      ja-Hrkt: |-
        こうらの　ふんしゃこうの　ねらいは　せいかく。
        みずの　だんがんを　５０メートル　はなれた
        あきかんに　めいちゅうさせる　ことが　できるぞ。
      ja: |-
        甲羅の　噴射口の　ねらいは　正確。
        水の　弾丸を　５０メートル　離れた
        空き缶に　命中させる　ことが　できるぞ。
      ko: |-
        등껍질의 분사구로 하는 조준은 정확하다.
        물 탄환으로 50m 떨어진
        빈 캔을 명중시킬 수 있다.
      en: |-
        Blastoise has water spouts that protrude from its shell.
        The water spouts are very accurate. They can shoot bullets of
        water with enough accuracy to strike empty cans from a
        distance of over 160 feet.
      fr: |-
        Tortank dispose de canons à eau émergeant de sa carapace.
        Ils sont très précis et peuvent envoyer des balles d’eau
        capables de faire mouche sur une cible située à plus de 50 m.
      de: |-
        Turtok besitzt Wasserdüsen, die aus seinem
        Panzer herausragen. Diese sind sehr präzise.
        Es kann Wassergeschosse so genau verschießen,
        dass es damit aus fast 50 m leere Dosen trifft.
      es: |-
        Blastoise lanza chorros de agua con gran precisión por los
        tubos que le salen del caparazón que tiene en la espalda.
        Puede disparar chorros de agua con tanta puntería que no
        fallaría al tirar contra una lata pequeña a 50 m.
      it: |-
        Blastoise è dotato di cannoni ad acqua che fuoriescono dalla
        corazza. I getti emessi sono così precisi da riuscire a colpire
        un bersaglio a una distanza di 50 m.
    alpha-sapphire:
      ja-Hrkt: |-
        こうらの　ふんしゃこうの　ねらいは　せいかく。
