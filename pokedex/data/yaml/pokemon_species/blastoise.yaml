    shield:
      ja-Hrkt: |-
        こうらの　ロケットほう　から
        ふきだした　ジェットすいりゅうは
        ぶあつい　てっぱんも　つらぬく。
      ja: |-
        甲羅の　ロケット砲　から
        噴き出した　ジェット水流は
        ぶ厚い　鉄板も　つらぬく。
      ko: |-
        등껍질의 로켓포에서
        뿜어져 나오는 제트 수류는
        두꺼운 철판도 뚫는다.
      zh-Hant: |-
        從甲殼上的大炮裡
        放出的噴射水流
        足以貫穿厚實的鐵板。
      zh-Hans: |-
        从龟壳上的大炮里
        放出的喷射水流
        足以贯穿厚实的铁板。
      en: |-
        The rocket cannons on its shell fire jets of water
        capable of punching holes through thick steel.
      fr: |-
        Les canons sur sa carapace tirent des jets d’eau
        capables de percer même de l’acier trempé.
      de: |-
        Die Wassersalven, die es mit den Wasserdüsen
        in seinem Panzer abfeuert, durchdringen sogar
        dicke Stahlwände.
      es: |-
        Dispara chorros de agua a través de los cañones
        de su caparazón, capaces de agujerear incluso el
        acero.
      it: |-
        I cannoni sul suo guscio sparano getti d’acqua
        capaci di bucare l’acciaio.
