      it: |-
        Blastoise è dotato di cannoni ad acqua che fuoriescono dalla
        corazza. I getti emessi sono così precisi da riuscire a colpire
        un bersaglio a una distanza di 50 m.
    lets-go-pikachu:
      ja-Hrkt: |-
        あいてに　ねらいを　さだめると
        しょうぼうしゃの　ホースより
        つよい　いきおいで　みずを　だす。
      ja: |-
        相手に　狙いを　定めると
        消防車の　ホースより
        強い　勢いで　水を　出す。
      ko: |-
        상대를 겨냥한 다음
        소방차의 호스보다
        강한 기세로 물을 뿜는다.
      zh-Hant: |-
        在鎖定了目標之後，
        會用比消防車的水龍
        更強的力道來射出水柱。
      zh-Hans: |-
        一旦锁定了目标，
        它会以超越了消防
        水枪的力道来喷水。
      en: |-
        Once it takes aim at its enemy, it blasts out
        water with even more force than a fire hose.
      fr: |-
        Une fois sa cible dans sa ligne de mire,
        il projette des jets d’eau plus puissants
        qu’une lance à incendie.
      de: |-
        Nachdem es einen Gegner anvisiert hat, greift
        es mit einem Wasserstrahl an, dessen Druck
        höher ist als der eines Feuerwehrschlauchs.
      es: |-
        Tras fijar el blanco, ataca disparando un chorro
        de agua a una presión mayor que la manguera
        de un bombero.
      it: |-
        Dopo aver preso la mira colpisce il nemico con
        getti d’acqua più potenti di quelli di un idrante.
