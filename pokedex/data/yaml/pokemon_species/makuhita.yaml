    white-2:
      en: |-
        It toughens its body by slamming
        into thick trees. Many snapped
        trees can be found near its nest.
    x:
      ja-Hrkt: |-
        たいぼくに　なんども　たいあたりして
        きょうじんな　からだと　くじけない
        こころを　きたえ　あげるのだ。
      ja: |-
        大木に　何度も　体当たりして
        強靭な　体と　くじけない　心を
        鍛え上げるのだ。
      ko: |-
        큰 나무에 몇 번이나 몸통박치기를
        하며 강인한 몸과 굴하지 않는
        마음을 단련한다.
      en: |-
        It toughens up by slamming into thick trees over
        and over. It gains a sturdy body and
        dauntless spirit.
      fr: |-
        Il fonce sur des arbres larges pour fortifier son corps
        robuste et son cœur vaillant.
      de: |-
        Indem es wieder und wieder Bäume rammt,
        erhält es einen zähen Körper und einen
        stahlharten Willen.
      es: |-
        Endurece su cuerpo golpeando grandes árboles sin
        perder jamás el ánimo.
      it: |-
        Sbattendo a ripetizione contro enormi alberi, si
        costruisce un corpo e uno spirito indistruttibili.
    'y':
      ja-Hrkt: |-
        きびしい　けいこを　くりかえして
        つよくなる。どんな　こうげきにも
        たえる　こんじょうの　ポケモン。
      ja: |-
        きびしい　けいこを　繰り返して
        強くなる。どんな　攻撃にも　耐える
        根性の　ポケモン。
      ko: |-
        힘든 수행을 반복하며
        강해진다. 어떤 공격도
        참아내는 근성의 포켓몬이다.
      en: |-
        It grows stronger by enduring harsh training. It is a
        gutsy Pokémon that can withstand any attack.
      fr: |-
        Il suit un entraînement drastique pour devenir encore
        plus fort. C’est un Pokémon plein de volonté, et
        capable de faire face à toutes les attaques.
      de: |-
        Sein hartes Training macht es stärker. Es ist ein
        tapferes Pokémon, das jeder Attacke trotzen kann.
      es: |-
        A base de duro entrenamiento se hace cada vez más
        fuerte. Es tan resistente que puede soportar cualquier
        ataque.
      it: |-
        Si rafforza allenandosi duramente. Molto coraggioso,
        può resistere a qualsiasi attacco.
    omega-ruby:
      ja-Hrkt: |-
        なんかい　たおされても　あきらめず　たちあがる。
        たちあがるたび　しんかするための　エネルギーが
        からだの　なかに　どんどん　たくわえられていく。
      ja: |-
        何回　倒されても　あきらめず　立ちあがる。
        立ちあがる度　進化するための　エネルギーが
        体の　中に　どんどん　蓄えられていく。
      ko: |-
        몇 번을 쓰러져도 포기하지 않고 일어선다.
        일어설 때마다 진화를 위한 에너지가
        몸 안에 점점 비축되어간다.
      en: |-
        Makuhita is tenacious—it will keep getting up and attacking
        its foe however many times it is knocked down. Every time it
        gets back up, this Pokémon stores more energy in its body
        for evolving.
      fr: |-
        Makuhita est tenace. Même s’il est presque battu,
        il continue à se relever et à attaquer son ennemi.
        Chaque fois qu’il se relève, ce Pokémon stocke plus
        d’énergie en vue de sa future évolution.
      de: |-
        Makuhita ist sehr zäh. Selbst wenn es im Kampf mehrfach
        niedergeschlagen wurde, steht es immer wieder auf und greift
        seinen Gegner an. Bei jedem Mal speichert es mehr Energie in
        seinem Körper für seine Entwicklung.
      es: |-
        Makuhita es tenaz. Da igual las veces que le venzan; volverá a
        ponerse en pie y a atacar. De hecho, cada vez que se
        recupera, acumula más energía para poder evolucionar.
      it: |-
        Makuhita è estremamente tenace: anche se messo al tappeto
        più volte si rialza sempre e contrattacca. Ogni volta che
        si rialza, questo Pokémon accumula ulteriore energia per
        la futura evoluzione.
    alpha-sapphire:
      ja-Hrkt: |-
        ぜったいに　あきらめない　こんじょうを　もつ。
        たくさん　たべ　よく　ねて　うんどうする　ことで
        からだの　なかに　エネルギーが　じゅうまんする。
      ja: |-
        絶対に　あきらめない　根性を　持つ。
        沢山　食べ　よく　寝て　運動する　ことで
        体の　中に　エネルギーが　充満する。
      ko: |-
        절대 포기하지 않는 근성을 지녔다.
        많이 먹고 잘 자고 운동하여
        몸 안에 에너지가 충만하다.
      en: |-
        Makuhita has a tireless spirit—it will never give up hope.
        It eats a lot of food, gets plenty of sleep, and it trains very
        rigorously. By living that way, this Pokémon packs its body
        with energy.
      fr: |-
        Makuhita a un moral d’acier. Il ne désespère jamais.
        Il mange beaucoup, dort beaucoup et s’entraîne avec rigueur.
        Son hygiène de vie permet à ce Pokémon d’accumuler
        un maximum d’énergie.
      de: |-
        Makuhitas Geist ist unbezwingbar. Es gibt die Hoffnung
        niemals auf. Es frisst eine Menge, bekommt viel Schlaf
        und trainiert unermüdlich. Dadurch füllt es seinen Körper
        mit Energie auf.
      es: |-
        Makuhita tiene un ánimo inagotable. Nunca pierde la
        esperanza. Come mucho, duerme bastante y se entrena de
        forma metódica. Siguiendo estos hábitos de vida, este
        Pokémon tiene siempre mucha energía.
      it: |-
        Makuhita è infaticabile, perseverante e non perde mai
        la speranza. Mangia molto, dorme molto e si allena con rigore.
        Questo tenore di vita gli consente di essere sempre carico
        di energia.
    sun:
      ja-Hrkt: |-
        もともとは　ほかの　ちほうから
        つれてこられたが　いまは　アローラの
        マクノシタの　ほうが　ゆうめい。
      ja: |-
        元々は　他の　地方から
        連れてこられたが　今は　アローラの
        マクノシタの　ほうが　有名。
      ko: |-
        원래는 다른 지방에서
        데려왔지만 지금은 알로라의
        마크탕이 더 유명하다.
      zh-Hant: |-
        最早是從其他地區被帶到這裡來的，
        但現在阿羅拉的幕下力士比較有名。
      zh-Hans: |-
        最早是从其他地区被带到这儿来的，
        但现在阿罗拉的幕下力士比较有名。
      en: |-
        It was originally brought in from another region,
        but now Makuhita from Alola are more famous.
      fr: |-
        Les Makuhita d’Alola sont aujourd’hui les plus
        connus, bien qu’ils aient à l’origine été amenés
        sur l’archipel depuis des régions étrangères.
      de: |-
        Obwohl sie ursprünglich aus einer anderen
        Region kommen, sind Alola-Makuhita heute
        bekannter als ihre übrigen Artgenossen.
      es: |-
        Aunque son originarios de otras regiones, los
        Makuhita de Alola son ahora los más populares
        de todos.
      it: |-
        Pur non essendo un Pokémon originario di Alola,
        oggi i Makuhita di Alola sono quelli più famosi.
    moon:
      ja-Hrkt: |-
        あさ　めざめると　みんなで　けいこ。
        ひるに　なると　エサを　たべ　ひるね。
        めざめれば　また　けいこの　まいにち。
      ja: |-
        朝　目覚めると　皆で　けいこ。
        昼に　なると　餌を　食べ　昼寝。
        目覚めれば　また　けいこの　毎日。
      ko: |-
        아침에 눈을 뜨면 모두와 연습한다.
        낮이 되면 먹이를 먹고 낮잠을 잔다.
        눈을 뜨면 다시 연습을 하는 매일을 보낸다.
      zh-Hant: |-
        每天早上醒來後大家一起訓練。
        到了中午吃完東西後就睡午覺。
        睡醒後又繼續訓練。
      zh-Hans: |-
        每天早上醒来后大家一起训练，
        到了中午就吃东西午睡，
        醒来后又继续训练。
      en: |-
        Their daily routine consists of training together
        first thing in the morning, eating and napping in
        the afternoon, and then more training afterward.
      fr: |-
        La journée de ce Pokémon est placée sous
        le signe de l’entraînement intensif, qui ne
        s’interrompt que pour manger et faire la sieste.
      de: |-
        Seine Tage beginnen morgens mit Training.
        Es folgen Mittagessen und Mittagsschlaf.
        Danach wird wieder fleißig weitertrainiert.
      es: |-
        Su jornada gira en torno al entrenamiento
        intensivo, que solo interrumpe para comer
        y para echarse una siestecilla.
      it: |-
        Si allena duramente ogni giorno assieme ai suoi
        compagni, fermandosi solo per mangiare e per
        fare un pisolino.
    ultra-sun:
      ja-Hrkt: |-
        きの　みきに　むかって　はりてを
        くりかえし　けいこする。　ナッシーに
        はりてして　なげとばされることも。
      ja: |-
        木の　幹に　向かって　張り手を
        繰り返し　稽古する。　ナッシーに
        張り手して　投げ飛ばされることも。
      ko: |-
        나무줄기에 손바닥 치기를 하며
        단련한다. 나시에게 손바닥 치기를
        해서 내던져지기도 한다.
      zh-Hant: |-
        會對著樹幹反覆練習推掌，
        有時會因為對著椰蛋樹使出推掌
        而反過來被丟得遠遠的。
      zh-Hans: |-
        会朝着树干反复练习巴掌招数。
        有时会因为朝着椰蛋树
        练习巴掌招数而被扔飞。
      en: |-
        It practices its slaps by repeatedly slapping
        tree trunks. It has been known to slap an
        Exeggutor and get flung away.
      fr: |-
        Il s’entraîne en frappant les arbres de la paume
        de la main. Il peut arriver qu’il s’attaque à un
        pauvre Noadkoko, qui l’envoie alors valser.
      de: |-
        Es trainiert, indem es mit der flachen Hand auf
        Baumstämme einschlägt. Manchmal erwischt es
        Kokowei und wird von diesen weggeschleudert.
      es: |-
        Entrena golpeando los troncos de los árboles
        con la mano abierta. A veces le da por error a
        un Exeggutor y este lo lanza volando.
      it: |-
        Si allena tirando manate contro gli alberi.
        A volte finisce per colpire un Exeggutor, che
        gli rende la pariglia scaraventandolo via.
    ultra-moon:
      ja-Hrkt: |-
        つよい　マクノシタを　そだてるために
        トレーナーたちが　でんとうてきに
        つくる　ナベりょうりが　あるという。
      ja: |-
        強い　マクノシタを　育てるために
        トレーナーたちが　伝統的に
        作る　ナベ料理が　あるという。
      ko: |-
        강한 마크탕을 키우기 위해
        트레이너들이 전통적으로
        만드는 전골 요리가 있다고 한다.
      zh-Hant: |-
        據說為了培育強大的幕下力士，
        訓練家們會製作一種
        傳統的火鍋料理。
      zh-Hans: |-
        据说为了培育强大的幕下力士，
        存在着一种训练家们按传统
        手法制作的火锅料理。
      en: |-
        There’s a rumor of a traditional recipe for stew
        that Trainers can use to raise strong Makuhita.
      fr: |-
        Il existerait un plat mijoté traditionnel que
        les Dresseurs cuisinent pour rendre leur
        Makuhita encore plus fort.
      de: |-
        Es heißt, es gebe einen Eintopf, den Trainer auf
        traditionelle Weise zubereiten, um Makuhita
        damit noch stärker zu machen.
      es: |-
        Dicen que los Entrenadores dan de comer a sus
        Makuhita un guiso tradicional para que se hagan
        más fuertes todavía.
      it: |-
        Sembra che gli Allenatori preparino un piatto
        tradizionale particolarmente indicato per far
        crescere forti i propri Makuhita.
