    lets-go-pikachu:
      ja-Hrkt: |-
        くちから　しゃくねつの　ほのおを
        はきだすとき　シッポのさきは
        より　あかく　はげしく　もえあがる。
      ja: |-
        口から　灼熱の　炎を
        吐き出すとき　シッポの先は
        より　赤く　激しく　燃えあがる。
      ko: |-
        입에서 작렬하는 불꽃을
        토해낼 때 꼬리의 끝이
        더욱 붉고 격렬하게 타오른다.
      zh-Hant: |-
        從口中噴出熾熱的火焰時，
        尾巴尖端的紅色火焰
        會燃燒得更加激烈。
      zh-Hans: |-
        从口中喷出灼热的火焰时，
        尾巴尖端的红色火焰
        会燃烧得更加猛烈。
      en: |-
        When this Pokémon expels a blast of superhot
        fire, the red flame at the tip of its tail burns
        more intensely.
      fr: |-
        Quand il crache son souffle brûlant, la flamme
        au bout de sa queue s’embrase.
      de: |-
        Wenn es einen Strahl glühenden Feuers speit,
        lodert die rote Flamme an seiner Schwanzspitze
        noch intensiver.
      es: |-
        Cuando exhala fuego abrasador, la llama de la
        punta de la cola se aviva y adquiere un intenso
        color rojo.
      it: |-
        Quando emette lingue di fuoco roventi
        dalla bocca, la fiamma rossa sulla punta
        della coda brucia più intensamente.
