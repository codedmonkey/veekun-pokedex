    sword:
      ja-Hrkt: |-
        がんせきも　やけるような
        しゃくねつの　ほのおを　はいて
        やまかじを　おこすことが　ある。
      ja: |-
        岩石も　焼けるような
        灼熱の　炎を　吐いて
        山火事を　起こすことが　ある。
      ko: |-
        암석도 태워버릴 정도로
        작열하는 화염을 뿜어
        산불을 일으킬 때가 있다.
      zh-Hant: |-
        會噴出彷彿連岩石
        都能燒焦的灼熱火焰。
        有時會引發森林火災。
      zh-Hans: |-
        能够喷出猛烈的火焰，
        仿佛连岩石都能烤焦。
        有时会引发森林火灾。
      en: |-
        It spits fire that is hot enough to melt boulders.
        It may cause forest fires by blowing flames.
      fr: |-
        Son souffle brûlant peut faire fondre la roche.
        Il est parfois la cause d’incendies de forêt.
      de: |-
        Dieses Pokémon kann mit seinem Feueratem
        Felsen schmelzen. Es verursacht ab und zu
        Waldbrände.
      es: |-
        Escupe un fuego tan caliente que funde las rocas.
        Causa incendios forestales sin querer.
      it: |-
        Sputa fiamme incandescenti in grado di fondere
        le rocce. A volte causa incendi boschivi.
