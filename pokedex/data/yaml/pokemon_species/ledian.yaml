        more stars appear at night, the
        patterns on its back grow larger.
    white-2:
      en: |-
        It uses starlight as energy. When
        more stars appear at night, the
        patterns on its back grow larger.
    x:
      ja-Hrkt: |-
        よぞらに　ほしが　またたくとき
        かがやく　こなを　ふりまきながら
        ひらひらと　とんでいく。
      ja: |-
        夜空に　星が　瞬くとき
        輝く　粉を　振りまきながら
        ひらひらと　飛んでいく。
      ko: |-
        밤하늘의 별이 깜빡일 때
        반짝이는 가루를 흩뿌리며
        훨훨 날아간다.
      en: |-
        When the stars flicker in the night sky, it flutters
        about, scattering a glowing powder.
      fr: |-
        Quand les étoiles brillent dans le ciel, il volette
        partout en semant derrière lui une poudre brillante.
      de: |-
        Leuchten die Sterne am Nachthimmel,
        schwirrt es umher und verstreut einen
        strahlenden, leuchtenden Puder.
      es: |-
        Cuando parpadean las estrellas en el cielo nocturno,
        se mece desprendiendo un polvo brillante.
      it: |-
        Si aggira nella notte stellata lasciando cadere una
        scia di polvere incandescente.
    'y':
      ja-Hrkt: |-
        せなかの　ほしもようは
        よぞらの　ほしのかずに　はんのうして
        おおきくなったり　ちいさくなる。
      ja: |-
        背中の　星模様は
        夜空の　星の数に　反応して
        大きくなったり　小さくなる。
      ko: |-
        등의 별 모양은
        밤하늘의 별의 숫자에 반응하여
        커졌다가 작아졌다가 한다.
      en: |-
        The spot patterns on its back grow larger or smaller
        depending on the number of stars in the night sky.
      fr: |-
        Les points sur son dos deviennent plus grands ou
        plus petits selon le nombre d’étoiles dans le ciel.
      de: |-
        Die Größe des gepunkteten Musters hängt direkt mit
        der Anzahl der Sterne am Firmament zusammen.
      es: |-
        Los puntos de su caparazón crecen y decrecen
        dependiendo de las estrellas del cielo nocturno.
      it: |-
        I puntini sulla schiena sono più grandi o più piccoli
        secondo il numero di stelle nel cielo.
    omega-ruby:
      ja-Hrkt: |-
        ほしが　たくさん　みえる　くうきの　きれいな
        とちには　レディアンが　たくさん　すむと　いう。
        ほしあかりを　エネルギーに　しているからだ。
      ja: |-
        星が　沢山　見える　空気の　きれいな
        土地には　レディアンが　沢山　すむと　いう。
        星明りを　エネルギーに　しているからだ。
      ko: |-
        별이 많이 보이는 공기가 깨끗한
        장소에는 레디안이 많이 산다고 한다.
        별빛을 에너지로 삼기 때문이다.
      en: |-
        It is said that in lands with clean air, where the stars fill the
        sky, there live Ledian in countless numbers. There is a good
        reason for this—the Pokémon uses the light of the stars as
        its energy.
      fr: |-
        On dit que dans les pays où le ciel est dégagé et où les
        étoiles illuminent les cieux, vivent d’innombrables quantités
        de Coxyclaque. La raison en est simple : l’énergie de ce
        Pokémon provient de la lumière des étoiles.
      de: |-
        In Ländern mit frischer Luft und Sternen am Himmel leben
        unzählig viele Ledian. Dafür gibt es einen guten Grund:
        Dieses Pokémon nutzt das Licht der Sterne als Energie.
      es: |-
        Dicen que en zonas en las que el aire está limpio, en las que
        se ven las estrellas, hay enormes poblaciones de Ledian.
        La razón es muy sencilla: este Pokémon usa la luz de las
        estrellas como fuente de energía.
      it: |-
        Si dice che in luoghi dall’aria pura e dal cielo terso e stellato
        vivano moltissimi Ledian. Ciò è dovuto alla loro abitudine
        di usare la luce delle stelle come fonte energetica.
    alpha-sapphire:
      ja-Hrkt: |-
        ほしが　たくさん　みえる　くうきの　きれいな
        とちには　レディアンが　たくさん　すむと　いう。
        ほしあかりを　エネルギーに　しているからだ。
      ja: |-
        星が　沢山　見える　空気の　きれいな
        土地には　レディアンが　沢山　すむと　いう。
        星明りを　エネルギーに　しているからだ。
      ko: |-
        별이 많이 보이는 공기가 깨끗한
        장소에는 레디안이 많이 산다고 한다.
        별빛을 에너지로 삼기 때문이다.
      en: |-
        It is said that in lands with clean air, where the stars fill the
        sky, there live Ledian in countless numbers. There is a good
        reason for this—the Pokémon uses the light of the stars as
        its energy.
      fr: |-
        On dit que dans les pays où le ciel est dégagé et où les
        étoiles illuminent les cieux, vivent d’innombrables quantités
        de Coxyclaque. La raison en est simple : l’énergie de ce
        Pokémon provient de la lumière des étoiles.
      de: |-
        In Ländern mit frischer Luft und Sternen am Himmel leben
        unzählig viele Ledian. Dafür gibt es einen guten Grund:
        Dieses Pokémon nutzt das Licht der Sterne als Energie.
      es: |-
        Dicen que en zonas en las que el aire está limpio, en las que
        se ven las estrellas, hay enormes poblaciones de Ledian.
        La razón es muy sencilla: este Pokémon usa la luz de las
        estrellas como fuente de energía.
      it: |-
        Si dice che in luoghi dall’aria pura e dal cielo terso e stellato
        vivano moltissimi Ledian. Ciò è dovuto alla loro abitudine
        di usare la luce delle stelle come fonte energetica.
    sun:
      ja-Hrkt: |-
        ほしあかりが　エネルギーと　いわれるが
        ふつうに　きのみも　だいこうぶつ。
        ひるまは　くさに　くるまって　ねてる。
      ja: |-
        星明りが　エネルギーと　いわれるが
        普通に　木の実も　大好物。
        昼間は　草に　包まって　寝てる。
      ko: |-
        별빛이 에너지라고 전해지지만
        평범하게 나무열매도 매우 좋아한다.
        낮에는 풀을 뒤집어쓰고 잔다.
      zh-Hant: |-
        據說星光是牠的能量，
        但一般來說樹果也是牠喜愛的食物。
        白天會把身體包在草堆裡睡覺。
      zh-Hans: |-
        据说星光是它的能量，
        但平时也非常喜爱吃树果。
        白天就用草包裹着睡觉。
      en: |-
        While it’s believed that starlight provides it with
        energy, this Pokémon also loves to eat berries.
        In the daytime, it curls up in the grass to sleep.
      fr: |-
        On dit qu’il se nourrit de la lumière des étoiles,
        mais il mange aussi des Baies comme les autres.
        Il dort pendant la journée dans un lit d’herbes.
      de: |-
        Es heißt, es ziehe seine Energie aus dem Licht
        der Sterne, aber es frisst trotzdem mit Wonne
        Beeren. Tagsüber schläft es im Gras.
      es: |-
        Usa la luz de las estrellas como fuente de
        energía, pero también adora las bayas. Durante
        el día, duerme envuelto en una manta de hierba.
      it: |-
        Si dice che tragga energia dalla luce delle stelle,
        ma è anche molto ghiotto di bacche.
        Di giorno dorme avvolto nell’erba.
    moon:
      ja-Hrkt: |-
        ４つの　うでで　パンチを　くりだし
        たたかう。　１ぱつの　いりょくは
        さほどだが　てかずで　しょうぶする。
      ja: |-
        ４つの　腕で　パンチを　繰り出し
        戦う。　１発の　威力は
        さほどだが　手数で　勝負する。
      ko: |-
        4개의 팔로 펀치를 날리며
        싸운다. 1발의 위력은
        별로지만 횟수로 승부한다.
      zh-Hant: |-
        用４隻手臂揮拳戰鬥。
        一拳的威力並不怎麼樣，
        但依靠出拳數取勝。
      zh-Hans: |-
        用４条手臂挥拳战斗。
        一拳的威力并不怎么样，
        但依靠出拳数取胜。
      en: |-
        In battle, it throws punches with all four arms.
        The power of each individual blow is piddly,
        so it aims to win by quantity rather than quality.
      fr: |-
        Il se bat en frappant avec ses quatre poings.
        Chaque coup ne fait pas très mal mais assénées
        en rafale, ses attaques sont dévastatrices.
      de: |-
        Es kämpft, indem es mit seinen vier Armen
        Schläge verteilt. Da diese jedoch kaum Wucht
        haben, setzt es alles auf lange Schlagserien.
      es: |-
        Combate asestando puñetazos con sus cuatro
        brazos. Sus golpes no son muy poderosos, pero
        resultan muy efectivos cuando ataca en ráfaga.
      it: |-
        Lotta sferrando pugni con le sue quattro
        braccia e sopperisce alla poca potenza dei
        singoli pugni con temibili scariche.
    ultra-sun:
      ja-Hrkt: |-
        せなかの　もようは　よぞらの　ほしと
        かんけい　していると　いわれているが
        くわしいことは　まだ　ふめいのまま。
      ja: |-
        背中の　模様は　夜空の　星と
        関係　していると　言われているが
        詳しいことは　まだ　不明のまま。
      ko: |-
        등의 모양은 밤하늘의 별과
        연관이 있다고 전해지지만
        자세한 것은 아직 알려지지 않았다.
      zh-Hant: |-
        據說牠背上的花紋與
        夜空中的星星有關，
        但詳細情形至今仍然不明。
      zh-Hans: |-
        据说它背上的花纹和
        夜空里的星星有关，
        但是具体情况至今未明。
      en: |-
        It’s said that the patterns on its back are
        related to the stars in the night sky, but the
        details of that relationship remain unclear.
      fr: |-
        Le motif qui orne son dos aurait un lien avec
        les étoiles, mais nul ne sait encore en quoi
        consiste ce lien.
      de: |-
        Es heißt, das Muster auf seinem Rücken stehe in
        Zusammenhang mit den Sternen am Firmament.
        Genaueres ist bisher aber noch nicht bekannt.
      es: |-
        Se dice que los motivos que luce en el dorso
        guardan relación con las estrellas, aunque esta
        teoría sigue siendo todo un misterio.
      it: |-
        Si dice che il motivo sul suo dorso abbia una
        qualche relazione con le stelle, ma non si sa
        ancora niente di preciso.
    ultra-moon:
      ja-Hrkt: |-
        きらめく　こなを　ふりまきながら
        よぞらを　とぶ。　こなが　からだに
        つくと　いいことが　あるといわれる。
      ja: |-
        きらめく　粉を　振りまきながら
        夜空を　飛ぶ。　粉が　身体に
        つくと　いいことが　あるといわれる。
      ko: |-
        반짝이는 가루를 흩뿌리며
        밤하늘을 난다. 가루가 몸에 붙으면
        좋은 일이 생긴다고 전해진다.
      zh-Hant: |-
        一邊撒落閃閃發亮的粉末，一邊在
        夜空中飛翔。據說如果身上沾到
        這種粉末，就會有好事發生。
      zh-Hans: |-
        在夜空中飞翔的同时
        会抛撒闪闪发光的粉末。
        据说粉末沾到身上就会有好事发生。
      en: |-
        It flies through the night sky, sprinkling sparkly
        dust. According to some, if that dust sticks to
        you, good things will happen to you.
      fr: |-
        Il vole dans le ciel nocturne en répandant une
        poudre scintillante. Si elle vous touche, quelque
        chose de positif devrait bientôt vous arriver.
      de: |-
        Nachts fliegt Ledian durch die Gegend und
        verstreut glitzernden Puder. Es soll Glück
        bringen, wenn man etwas davon abbekommt.
      es: |-
        Vuela por el cielo nocturno esparciendo un polvo
        brillante. Dicen que entrar en contacto con este
        polvo trae buena suerte.
      it: |-
        Svolazza nel cielo notturno lasciando dietro di
        sé una scia di polvere luccicante. Si dice che
        il contatto con essa porti fortuna.
