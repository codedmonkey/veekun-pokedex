    white-2:
      en: |-
        It had been asleep in underground
        magma ever since it fiercely
        fought Kyogre long ago.
    x:
      ja-Hrkt: |-
        こうねつで　みずを　じょうはつさせて
        だいちを　ひろげたと　いわれている。
        カイオーガと　はげしく　たたかった。
      ja: |-
        高熱で　水を　蒸発させて
        大地を　広げたと　言われている。
        カイオーガと　激しく　戦った。
      ko: |-
        고열로 물을 증발시켜
        대지를 넓혔다고 전해진다.
        가이오가와 격하게 싸웠다.
      en: |-
        Said to have expanded the lands by evaporating
        water with raging heat. It battled titanically
        with Kyogre.
      fr: |-
        Ennemi juré de Kyogre, sa haute chaleur corporelle
        aurait fait évaporer l’eau et permis aux continents de
        s’étendre.
      de: |-
        Sein Feuer erschuf einst das Land. Es und Kyogre
        lieferten sich einen langen Kampf.
      es: |-
        Dicen que aumentó la superficie terrestre evaporando
        el agua. Fue un enemigo acérrimo de Kyogre.
      it: |-
        Si tramanda che fece evaporare l’acqua per
        aumentare la superficie terrestre. Nemico di Kyogre.
    'y':
      ja-Hrkt: |-
        カイオーガと　しとうの　すえ　ながい
        ねむりに　ついた。だいちの　けしんと
        いわれる　でんせつの　ポケモン。
      ja: |-
        カイオーガと　死闘の末
        長い　眠りに　ついた。大地の　化身と
        言われる　伝説の　ポケモン。
      ko: |-
        가이오가와 사투 끝에 긴 잠에
        들었다. 대지의 화신이라
        불리는 전설의 포켓몬이다.
      en: |-
        This legendary Pokémon is said to represent the
        land. It went to sleep after dueling Kyogre.
      fr: |-
        Ce Pokémon légendaire incarne la terre.
        Il plongea dans un profond sommeil après son combat
        avec Kyogre.
      de: |-
        Dieses Legendäre Pokémon soll das Land verkörpern.
        Es ist in einen Schlaf gefallen, nachdem es mit Kyogre
        gekämpft hat.
      es: |-
        Dicen que este Pokémon legendario simboliza la tierra.
        Tras batirse en duelo con Kyogre se echó a dormir.
      it: |-
        Pokémon leggendario che rappresenta la terra. Dopo
        aver sfidato Kyogre, è caduto in un sonno profondo.
    omega-ruby:
      ja-Hrkt: |-
        だいちの　けしん　と つたわる　ポケモン。
        しぜんのエネルギーを　もとめて　カイオーガと
        あらそいを　くりかえしたという　でんせつが　ある。
      ja: |-
        大地の　化身　と 伝わる　ポケモン。
        自然のエネルギーを　求めて　カイオーガと
        争いを　繰り返したという　伝説が　ある。
      ko: |-
        대지의 화신이라 전해지는 포켓몬.
        자연의 힘을 갈구하여 가이오가와
        사투를 반복한다는 전설이 있다.
      en: |-
        Groudon is said to be the personification of the land
        itself. Legends tell of its many clashes against Kyogre,
        as each sought to gain the power of nature.
      fr: |-
        Un Pokémon considéré comme l’avatar des continents.
        Selon les légendes, il a disputé de nombreux combats
        avec Kyogre pour contrôler l’énergie de la nature.
      de: |-
        Es heißt, Groudon sei die Personifizierung des Landes.
        Legenden zufolge hat es in seinem Bestreben, sich die
        Naturenergie anzueignen, viele Male gegen Kyogre gekämpft.
      es: |-
        A Groudon siempre se le ha descrito como el Pokémon que
        expandió los continentes. Varias leyendas cuentan que libró
        combates contra Kyogre en repetidas ocasiones para tener
        el control de la energía de la naturaleza.
      it: |-
        Si dice che questo Pokémon abbia un profondo
        legame con le terre emerse.
        Le leggende narrano dei suoi continui scontri con
        Kyogre per ottenere l’energia della natura.
    alpha-sapphire:
      ja-Hrkt: |-
        しぜんのエネルギーに　よって　ゲンシカイキし
        ほんらいの　すがたを　とりもどす。そのちからは
        マグマを　うみだし　だいちを　ひろげる。
      ja: |-
        自然のエネルギーに　よって　ゲンシカイキし
        本来の　姿を　取り戻す。その力は
        マグマを　生みだし　大地を　広げる。
      ko: |-
        자연의 힘에 의해 원시회귀하여
        원래의 모습을 되찾는다. 그 힘은
        마그마를 만들어내며 대지를 확장한다.
      en: |-
        Through Primal Reversion and with nature’s full power,
        it will take back its true form. It can cause magma to
        erupt and expand the landmass of the world.
      fr: |-
        Grâce à l’énergie de la nature, il peut accomplir
        sa Primo-Résurgence pour retrouver son apparence originelle.
        Ce pouvoir lui permet de créer du magma pour étendre
        les continents.
      de: |-
        Mithilfe von Naturenergie kann es eine Protomorphose
        durchführen und so seine ursprüngliche Form zurückerlangen.
        Dadurch kann es Magma hervorbringen und
        die Landmasse vergrößern.
      es: |-
        Groudon se sirve de la energía de la naturaleza para realizar su
        Regresión Primigenia y recobrar su apariencia primitiva. Con tal
        poder, puede crear magma para expandir los continentes.
      it: |-
        L’energia della natura può causare l’archeorisveglio
        di questo Pokémon, facendolo tornare al suo aspetto
        originario.
        Può produrre fiumi di magma in grado di espandere
        le terre emerse.
