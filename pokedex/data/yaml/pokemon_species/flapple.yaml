flapple:
  base_happiness: 50
  capture_rate: 45
  color: green
  egg_groups:
    - plant
    - dragon
  evolution_chain: applin
  evolves_from: applin
  flavor_text:
    sword:
      ja-Hrkt: |-
        すっぱい　りんごを　たべて　しんか。
        やけどする　ほど　きょうさんせいの
        えきたいを　ほほぶくろに　ためる。
      ja: |-
        すっぱい　りんごを　食べて　進化。
        火傷する　ほど　強酸性の
        液体を　頬袋に　溜める。
      ko: |-
        새콤한 사과를 먹고 진화했다.
        화상을 입을 정도로 강한 산성을 띠는
        액체를 볼주머니에 저장하고 있다.
      zh-Hant: |-
        啃果蟲吃了酸蘋果後進化
        而成。頰囊裡儲存著足以
        造成灼傷的強酸性液體。
      zh-Hans: |-
        啃果虫吃了酸苹果后进化
        而成。颊囊里储存着足以
        造成灼伤的强酸性液体。
      en: |-
        It ate a sour apple, and that induced its
        evolution. In its cheeks, it stores an acid
        capable of causing chemical burns.
      fr: |-
        Il a évolué après avoir mangé une pomme acide.
        Il concentre dans ses joues un liquide si corrosif
        qu’il peut provoquer des brûlures.
      de: |-
        Nach dem Verzehr eines sauren Apfels hat es sich
        entwickelt. In den Backentaschen speichert es
        eine saure Substanz, die zu Verbrennungen führt.
      es: |-
        Ha evolucionado tras ingerir una manzana ácida.
        Las bolsas de las mejillas albergan un fluido cuya
        extrema acidez llega a provocar quemaduras.
      it: |-
        Si è evoluto dopo aver mangiato una mela aspra.
        Le sacche sulle guance contengono un liquido
        estremamente acido che può provocare ustioni.
    shield:
      ja-Hrkt: |-
        りんごの　かわの　つばさで　とんで
        きょうさんせいの　だえきを　とばす。
        りんごの　かたちに　へんけいする。
      ja: |-
        りんごの　皮の　翼で　飛んで
        強酸性の　唾液を　飛ばす。
        りんごの　形に　変形する。
      ko: |-
        사과 껍질로 된 날개로 날며
        강산성의 타액을 뱉는다.
        사과의 형태로 변형한다.
      zh-Hant: |-
        會用蘋果皮的翅膀飛翔，
        並吐出強酸性的唾液。
        能變成蘋果的形狀。
      zh-Hans: |-
        会用苹果皮的翅膀飞翔，
        并吐出强酸性的唾液。
        可以变成苹果的形状。
      en: |-
        It flies on wings of apple skin and spits a
        powerful acid. It can also change its shape
        into that of an apple.
      fr: |-
        Il vole avec ses ailes faites de pelures de pomme
        et crache une substance très acide.
        Il peut aussi prendre la forme de ce fruit.
      de: |-
        Dieses Pokémon fliegt mit seinen Flügeln aus
        Apfelschale und spuckt extrem sauren Speichel
        aus. Es nimmt die Gestalt eines Apfels an.
      es: |-
        Escupe una saliva sumamente ácida y vuela con
        sus alas compuestas por piel de manzana, cuyo
        aspecto es capaz de adoptar.
      it: |-
        Vola usando la buccia del pomo a mo’ di ali e
        sputa una saliva altamente acida. Può assumere
        l’aspetto di una mela.
