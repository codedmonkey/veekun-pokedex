    x:
      ja-Hrkt: |-
        スベスベした　くろいひふは　うすく
        しめっている。ないぞうの　いちぶが
        すけて　うずまきじょうに　みえる。
      ja: |-
        スベスベした　黒い皮膚は　薄く
        湿っている。内臓の　一部が
        透けて　渦巻状に　見える。
      ko: |-
        매끄럽고 검은 피부는 얇고
        축축하다. 내장 일부가
        비쳐서 소용돌이 모양으로 보인다.
      en: |-
        Its slick black skin is thin and damp. A part of its
        internal organs can be seen through the skin as a
        spiral pattern.
      fr: |-
        Sa peau est humide, lisse et surtout très fine. La
        forme en spirale sur son ventre est en fait une partie
        de ses organes internes que l’on peut apercevoir.
      de: |-
        Seine glatte, schwarze Haut ist dünn und feucht.
        Teilweise sind seine Innereien als spiralförmige
        Muster sichtbar.
      es: |-
        Tiene una piel extraordinaria, fina y húmeda, que deja
        entrever las vísceras que tiene dispuestas en espiral.
      it: |-
        Dalla pelle nera, lucida, umida e sottile si intravedono
        gli organi interni, che formano una spirale.
    'y':
      ja-Hrkt: |-
        うずまきの　むきは　うまれた
        ちほうに　よって　ちがうらしい。
        あるくより　およぐほうが　じょうず。
      ja: |-
        渦巻の　向きは　生まれた
        地方によって　違うらしい。
        歩くより　泳ぐほうが　上手。
      ko: |-
        배의 소용돌이 방향은 태어난
        지방에 따라 다른 듯하다.
        걷기보다 헤엄치기를 잘한다.
      en: |-
        The direction of the spiral on the belly differs by
        area. It is more adept at swimming than walking.
      fr: |-
        Le sens de la spirale sur son ventre diffère selon
        son origine. Il préfère la nage à la marche.
      de: |-
        Dieses Pokémon kann sehr schlecht laufen.
        Sein Bauchmuster ist unterschiedlich, je nach Region.
      es: |-
        La dirección de la espiral en el vientre cambia según el
        área. Prefiere nadar a correr.
      it: |-
        La spirale che ha sulla pancia varia da zona a zona.
        È molto più bravo nel nuoto che nella corsa.
    omega-ruby:
      ja-Hrkt: |-
        うずまき　もようの　ないぞうが　すけてしまうほど
        うすい　ひふだが　するどい　キバを　はねかえす
        だんりょくを　もっているのだ。
      ja: |-
        渦巻き　模様の　内臓が　透けてしまうほど
        薄い　皮膚だが　鋭い　キバを　はね返す
        弾力を　持っているのだ。
      ko: |-
        소용돌이 모양인 내장이 비칠 정도로
        얇은 피부이지만 날카로운 이빨을
        튕겨내는 탄력을 지니고 있다.
      en: |-
        Poliwag has a very thin skin. It is possible to see the
        Pokémon’s spiral innards right through the skin.
        Despite its thinness, however, the skin is also very flexible.
        Even sharp fangs bounce right off it.
      fr: |-
        Ptitard a une peau très fine. On peut même voir les
        entrailles en spirale de ce Pokémon à travers sa peau.
        Malgré sa finesse, cette peau est aussi très élastique.
        Même les crocs les plus acérés rebondissent dessus.
      de: |-
        Quapsel hat eine sehr dünne Haut. Durch sie hindurch
        kann man sogar sein spiralförmiges Inneres sehen. Obwohl
        seine Haut so dünn ist, ist sie sehr elastisch. Selbst scharfe
        Reißzähne können sie nicht durchdringen.
      es: |-
        Poliwag tiene una piel muy fina. Tanto que es posible entrever
        a través de la misma las vísceras en espiral que tiene. La piel,
        aunque fina, tiene la ventaja de ser flexible y hacer rebotar
        hasta los colmillos más afilados.
      it: |-
        Poliwag ha una pelle molto sottile, attraverso cui è possibile
        intravedere i suoi organi interni spiraliformi.
        Nonostante il suo esiguo spessore, la pelle è molto elastica.
        Anche le zanne più affilate non riescono a lacerarla.
    alpha-sapphire:
      ja-Hrkt: |-
        うずまき　もようの　ないぞうが　すけてしまうほど
        うすい　ひふだが　するどい　キバを　はねかえす
        だんりょくを　もっているのだ。
      ja: |-
        渦巻き　模様の　内臓が　透けてしまうほど
        薄い　皮膚だが　鋭い　キバを　はね返す
        弾力を　持っているのだ。
      ko: |-
        소용돌이 모양인 내장이 비칠 정도로
        얇은 피부이지만 날카로운 이빨을
        튕겨내는 탄력을 지니고 있다.
      en: |-
        Poliwag has a very thin skin. It is possible to see the
        Pokémon’s spiral innards right through the skin. Despite its
        thinness, however, the skin is also very flexible. Even sharp
        fangs bounce right off it.
      fr: |-
        Ptitard a une peau très fine. On peut même voir les
        entrailles en spirale de ce Pokémon à travers sa peau.
        Malgré sa finesse, cette peau est aussi très élastique.
        Même les crocs les plus acérés rebondissent dessus.
      de: |-
        Quapsel hat eine sehr dünne Haut. Durch sie hindurch
        kann man sogar sein spiralförmiges Inneres sehen. Obwohl
        seine Haut so dünn ist, ist sie sehr elastisch. Selbst scharfe
        Reißzähne können sie nicht durchdringen.
      es: |-
        Poliwag tiene una piel muy fina. Tanto que es posible entrever
        a través de la misma las vísceras en espiral que tiene. La piel,
        aunque fina, tiene la ventaja de ser flexible y hacer rebotar
        hasta los colmillos más afilados.
      it: |-
        Poliwag ha una pelle molto sottile, attraverso cui è possibile
        intravedere i suoi organi interni spiraliformi.
        Nonostante il suo esiguo spessore, la pelle è molto elastica.
        Anche le zanne più affilate non riescono a lacerarla.
    sun:
      ja-Hrkt: |-
        うずまきは　すけてみえる　ないぞう。
        そのいろが　しろみがかっているときは
        なにかの　びょうきに　かかっている。
      ja: |-
        渦巻きは　透けて見える　内臓。
        その色が　白みがかっているときは
        なにかの　病気に　かかっている。
      ko: |-
        소용돌이는 비쳐서 보이는 내장이다.
        그 색이 희뿌열 때는
        뭔가 병에 걸린 것이다.
      zh-Hant: |-
        漩渦是透明可見的內臟。
        當顏色帶有白色時，
        代表是有什麼地方生病了。
      zh-Hans: |-
        漩涡是透明可见的内脏。
        当颜色带有白色时，
        说明是生什么病了。
      en: |-
        The swirl on its belly is its internal organs
        showing through. If the swirl is tinged white,
        that means it’s affected by some disease.
      fr: |-
        La spirale est son intestin que l’on distingue
        par transparence. Lorsqu’elle blanchit, c’est
        signe qu’il a attrapé une maladie.
      de: |-
        Durch seine Haut hindurch kann man sein
        spiralförmiges Inneres sehen. Färbt sich dieses
        weiß, deutet das darauf hin, dass es krank ist.
      es: |-
        La espiral de su vientre no es otra cosa que sus
        vísceras. Cuando estas se tornan de color
        blanco, significa que Poliwag está enfermo.
      it: |-
        La spirale sulla pancia sono i suoi organi interni,
        visibili sotto la pelle sottile. Se diventa bianca,
        è segno che è malato.
    moon:
      ja-Hrkt: |-
        まだまだ　あるくのが　ヘタ。
        トレーナーに　なったら　まいにち
        あるく　くんれんを　してあげよう。
      ja: |-
        まだまだ　歩くのが　下手。
        トレーナーに　なったら　毎日
        歩く　訓練を　してあげよう。
      ko: |-
        아직 걷는 것이 서투르다.
        트레이너가 되면 매일
        걷는 훈련을 시켜주자.
      zh-Hant: |-
        走路還是很不純熟。
        成為牠的訓練家後，
        要每天給牠做走路訓練哦。
      zh-Hans: |-
        走路还是很不利索。
        成为它的训练家后，
        要每天都给它做走路训练。
      en: |-
        It’s still not very good at walking. Its Trainers
        should train this Pokémon to walk every day.
      fr: |-
        Il ne sait pas encore bien marcher. Un Dresseur
        de Ptitard doit l’entraîner à marcher tous
        les jours.
      de: |-
        Es kann noch nicht gut laufen. Sein Trainer
        sollte daher jeden Tag Laufübungen mit ihm
        durchführen.
      es: |-
        No se le da nada bien andar, por lo que se
        recomienda a los Entrenadores que le hagan
        practicar un poco cada día.
      it: |-
        Non è ancora in grado di camminare bene.
        È importante che l’Allenatore lo inciti a
        esercitarsi ogni giorno.
    ultra-sun:
      ja-Hrkt: |-
        きけんなのに　りくに　あがりたがる。
        まだ　よちよちあるき　なので　てきに
        みつかると　あわてて　みずのなかへ。
      ja: |-
        危険なのに　陸に　上がりたがる。
        まだ　よちよち歩き　なので　敵に
        見つかると　慌てて　水の中へ。
      ko: |-
        위험한데도 지상으로 올라가고 싶어한다.
        아직 아장아장 걷기 때문에 적에게
        노출되면 황급히 물속으로 들어간다.
      zh-Hant: |-
        雖然危險卻總是想登上陸地。
        因為連走路都還走不穩，
        所以一被敵人發現就會慌忙逃進水中。
      zh-Hans: |-
        虽然危险，却向往登上陆地。
        因为它还只能晃晃悠悠地走路，
        所以被敌人发现后会慌忙逃入水中。
      en: |-
        Despite the danger, it wants to come up on land.
        So it does its best to waddle along, but when
        an enemy finds it, it rushes back to the water.
      fr: |-
        Malgré le danger, il ne cesse de sortir de l’eau.
        Comme il a encore du mal à marcher, il s’y
        réfugie toutefois dès qu’un prédateur approche.
      de: |-
        Trotz der Gefahren kommt es gerne an Land.
        Taucht ein Feind auf, flitzt es hastig auf seinen
        noch wackligen Beinen zurück ins Wasser.
      es: |-
        A pesar del peligro, le gusta salir a tierra firme.
        Como es un poco torpe al caminar, regresa al
        agua rápidamente cuando se acerca un enemigo.
      it: |-
        Nonostante i pericoli, gli piace salire sulla
        terraferma. Dato che non cammina ancora bene,
        se incontra un nemico torna subito in acqua.
    ultra-moon:
      ja-Hrkt: |-
        うずまきの　むきは　ちいきにより
        びみょうに　ちがう。　ニョロモの
        マニアは　ひとめで　みわけるらしい。
      ja: |-
        うずまきの　向きは　地域により
        微妙に　違う。　ニョロモの
        マニアは　一目で　見分けるらしい。
      ko: |-
        소용돌이의 방향은 지역에 따라
        미묘하게 다르다. 발챙이 마니아는
        한눈에 구분할 수 있다고 한다.
      zh-Hant: |-
        漩渦的方向隨著地域的不同有著
        微妙的差異。蚊香蝌蚪的愛好者
        似乎一眼就能分辨出來。
      zh-Hans: |-
        因地域不同，漩涡的方向也有着
        微妙的差异。蚊香蝌蚪的爱好者
        好像一眼就能分辨出来。
      en: |-
        The direction of the swirl on their stomachs
        differs depending on where they live. Poliwag
        aficionados can tell them apart at a glance.
      fr: |-
        L’orientation de sa spirale diffère légèrement
        selon les régions. Les fans de ces Pokémon
        peuvent les différencier au premier coup d’œil.
      de: |-
        Die Ausrichtung seiner Spirale weist je nach
        Region subtile Unterschiede auf. Quapsel-Fans
        erkennen diese auf einen Blick.
      es: |-
        Un fan que se precie de serlo sabrá identificar
        a primera vista la espiral de su vientre, cuya
        orientación varía según su región de origen.
      it: |-
        La direzione della spirale che ha sulla pancia
        varia da zona a zona. Gli appassionati di Poliwag
        vedono la differenza a colpo d’occhio.
    lets-go-pikachu:
      ja-Hrkt: |-
        うずまきの　むきは　うまれた
        ちほうに　よって　ちがうらしい。
        あるくより　およぐほうが　じょうず。
      ja: |-
        渦巻きの　向きは　生まれた
        地方に　よって　違うらしい。
        歩くより　泳ぐほうが　上手。
      ko: |-
        배의 소용돌이 방향은 태어난
        지방에 따라 다른 듯하다.
        걷기보다 헤엄치기를 잘한다.
      zh-Hant: |-
        漩渦花紋的方向似乎會
        依出生的地方而不同。
        比起步行更擅長游泳。
      zh-Hans: |-
        漩涡的旋转方向好像会
        因出生地区而不同。
        比起走路，它更擅长游泳。
      en: |-
        The direction of the spiral on the belly differs by
        area. It is more adept at swimming than walking.
      fr: |-
        Le sens de la spirale sur son ventre diffère selon
        son origine. Il préfère la nage à la marche.
      de: |-
        Offenbar unterscheidet sich die Ausrichtung
        seiner Spirale je nach Geburtsregion. Es kann
        besser schwimmen als laufen.
      es: |-
        La dirección de la espiral en su vientre varía en
        función de la región donde nace. Se mueve con
        más facilidad en el agua que en tierra firme.
      it: |-
        La direzione della spirale che ha sulla pancia
        varia a seconda della zona in cui è nato.
        È più bravo a nuotare che a camminare.
    lets-go-eevee:
      ja-Hrkt: |-
        うずまきの　むきは　うまれた
        ちほうに　よって　ちがうらしい。
        あるくより　およぐほうが　じょうず。
      ja: |-
        渦巻きの　向きは　生まれた
        地方に　よって　違うらしい。
        歩くより　泳ぐほうが　上手。
      ko: |-
