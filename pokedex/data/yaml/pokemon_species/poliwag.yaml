        an Felsen fest.
      es: |-
        En ríos de aguas bravas, usa sus gruesos labios
        a modo de ventosa para adherirse a las rocas.
      it: |-
        Nei fiumi dalla corrente impetuosa, si attacca
        alle rocce utilizzando le spesse labbra come
        una ventosa.
