        지방에 따라 다른 듯하다.
        걷기보다 헤엄치기를 잘한다.
      zh-Hant: |-
        漩渦花紋的方向似乎會
        依出生的地方而不同。
        比起步行更擅長游泳。
      zh-Hans: |-
        漩涡的旋转方向好像会
        因出生地区而不同。
        比起走路，它更擅长游泳。
      en: |-
        The direction of the spiral on the belly differs by
        area. It is more adept at swimming than walking.
      fr: |-
        Le sens de la spirale sur son ventre diffère selon
        son origine. Il préfère la nage à la marche.
      de: |-
        Offenbar unterscheidet sich die Ausrichtung
        seiner Spirale je nach Geburtsregion. Es kann
        besser schwimmen als laufen.
      es: |-
        La dirección de la espiral en su vientre varía en
        función de la región donde nace. Se mueve con
        más facilidad en el agua que en tierra firme.
      it: |-
        La direzione della spirale che ha sulla pancia
        varia a seconda della zona in cui è nato.
        È più bravo a nuotare che a camminare.
    sword:
      ja-Hrkt: |-
        あるくよりも　およぐほうが　とくい。
        おなかの　うずまきもようは　すけて
        みえる　ないぞうの　いちぶだ。
      ja: |-
        歩くよりも　泳ぐほうが　得意。
        お腹の　渦巻き模様は
        透けて　見える　内臓の　一部だ。
      ko: |-
        걷기보다 헤엄치기가 특기다.
        배의 소용돌이 모양은
        내장의 일부가 비쳐 보이는 것이다.
      zh-Hant: |-
        比起步行更擅長游泳。
        腹部的漩渦花紋是透過皮膚
        可以看到的部分內臟。
      zh-Hans: |-
        比起走路更擅长游泳。
        腹部旋涡状的花纹其实是
        透过皮肤看到的部分内脏。
      en: |-
        For Poliwag, swimming is easier than walking.
        The swirl pattern on its belly is actually part of
        the Pokémon’s innards showing through the skin.
      fr: |-
        Il est plus à l’aise dans l’eau que sur la terre ferme.
        Le motif de spirale sur son ventre est en fait une
        partie de ses organes visibles à travers la peau.
      de: |-
        Quapsel kann besser schwimmen als laufen. Das
        Spiralmuster auf seinem Bauch ist ein Teil seiner
        Innereien, der durch die Haut sichtbar ist.
      es: |-
        Es más ágil en el agua que en la tierra. La espiral
        de su vientre no es más que parte de sus vísceras
        que se ven a través de la piel.
      it: |-
        È più portato per il nuoto che per la corsa.
        Il motivo spiraliforme sul ventre è parte dei
        suoi organi interni visibili in trasparenza.
    shield:
      ja-Hrkt: |-
        ながれが　はやい　かわでは　ぶあつい
        くちびるを　きゅうばんのように
        いわに　くっつけて　しがみつく。
      ja: |-
        流れが　速い　川では
        ぶ厚い　唇を　吸盤のように
        岩に　くっつけて　しがみつく。
      ko: |-
        유속이 빠른 강에서는
        두꺼운 입술을 흡반처럼
        사용해 바위에 달라붙는다.
      zh-Hant: |-
        在水流湍急的河川裡，
        會把厚厚的嘴唇當作吸盤，
        吸附在岩石上避免被沖走。
      zh-Hans: |-
        在水流湍急的河里，
