golduck:
  base_happiness: 50
  capture_rate: 75
  color: blue
  egg_groups:
    - water1
    - ground
  evolution_chain: psyduck
  evolves_from: psyduck
  flavor_text:
    red:
      en: |-
        Often seen swim­
        ming elegantly by
        lake shores. Itis often mistaken
        for the Japanese
        monster, Kappa.
    blue:
      en: |-
        Often seen swim­
        ming elegantly by
        lake shores. Itis often mistaken
        for the Japanese
        monster, Kappa.
    yellow:
      en: |-
        Its slim and long
        limbs end in broad
        flippers. Theyare used for swim­
        ming gracefully
        in lakes.
    gold:
      en: |-
        When it swims at
        full speed using
        its long, webbedlimbs, its fore­
        head somehow be­
        gins to glow.
    silver:
      en: |-
        It appears by
        waterways at dusk.
        It may use tele­kinetic powers if
        its forehead glows
        mysteriously.
    crystal:
      en: |-
        It swims grace­
        fully along on the
        quiet, slow-movingrivers and lakes
        of which it is so
        fond.
    ruby:
      en: |-
        The webbed flippers on its forelegs and
        hind legs and the streamlined body of
        GOLDUCK give it frightening speed.This POKéMON is definitely much faster
        than even the most athletic swimmer.
    sapphire:
      en: |-
        GOLDUCK is the fastest swimmer among
        all POKéMON. It swims effortlessly, even
        in a rough, stormy sea.It sometimes rescues people from
        wrecked ships floundering in high seas.
    emerald:
      en: |-
        A GOLDUCK is an adept swimmer.
        It sometimes joins competitive swimmers
        in training. It uses psychic powers when
        its forehead shimmers with light.
    firered:
      en: |-
        The forelegs are webbed, helping to make
        it an adept swimmer. It can be seen
        swimming elegantly in lakes, etc.
    leafgreen:
      en: |-
        Often seen swimming elegantly by
        lakeshores. It is often mistaken for the
        Japanese monster Kappa.
    diamond:
      en: |-
        A Pokémon that lives in lakes.
        It swims faster than any human
        swimming champion.
    pearl:
      en: |-
        The flippers of its well-developed
        limbs give it shocking speed. It is
        the best swimmer among Pokémon.
    platinum:
      en: |-
        It is seen swimming dynamically and
        elegantly using its well-developed
        limbs and flippers.
    heartgold:
      en: |-
        When it swims at full speed using
        its long, webbed limbs, its forehead
        somehow begins to glow.
    soulsilver:
      en: |-
        It appears by waterways at dusk.
        It may use telekinetic powers if
        its forehead glows mysteriously.
    black:
      en: |-
        It is seen swimming dynamically and
        elegantly using its well-developed
        limbs and flippers.
      fr: |-
        Ses membres palmés et son corps
        parfaitement adapté font de lui
        un nageur exceptionnel.
    white:
      en: |-
        It is seen swimming dynamically and
        elegantly using its well-developed
        limbs and flippers.
      fr: |-
        Ses membres palmés et son corps
        parfaitement adapté font de lui
        un nageur exceptionnel.
    black-2:
      en: |-
        When its forehead shines mysteriously,
        Golduck can use the full extent
        of its power.
    white-2:
      en: |-
        When its forehead shines mysteriously,
        Golduck can use the full extent
        of its power.
    x:
      ja-Hrkt: |-
        ゆうぐれ　みずべに　すがたをみせる。
        ひたいが　あやしく　ひかるとき
        じんつうりきを　つかいこなすという。
      ja: |-
        夕暮れ　水辺に　姿をみせる。
        額が　あやしく　光るとき
        神通力を　使いこなすという。
      ko: |-
        해 질 무렵 강가에 모습을 나타낸다.
        이마가 이상하게 빛날 때
        신통력을 발휘한다고 전해진다.
      en: |-
        It appears by waterways at dusk.
        It may use telekinetic powers
        if its forehead glows mysteriously.
      fr: |-
        Il apparaît dans les étendues d’eau au crépuscule.
        Si son front brille, il se sert de sa télékinésie.
      de: |-
        Es taucht bei Sonnenuntergang am Wasser auf.
        Leuchtet seine Stirn, setzt es telekinetische Kräfte ein.
      es: |-
        Aparece en ríos al anochecer. Puede usar poderes
        telequinéticos si su frente brilla misteriosamente.
      it: |-
        Appare presso i corsi d’acqua col buio. Acquisisce
        poteri telecinetici se la sua fronte diventa
        incandescente.
    'y':
      ja-Hrkt: |-
        てのひらが　みずかきに　なっていて
        およぐのが　とくい。みずうみなどで
        ゆうがな　すがたが　みかけられる。
      ja: |-
        手のひらが　水かきに　なっていて
        泳ぐのが　得意。湖などで
        優雅な　姿が　見かけられる。
      ko: |-
        손바닥이 물갈퀴로 되어 있어
        헤엄을 잘 친다. 호수 등에서
        우아한 모습을 볼 수 있다.
      en: |-
        The forelegs are webbed, helping to make it an
        adept swimmer. It can be seen swimming elegantly
        in lakes, etc.
      fr: |-
        Ses pattes arrière palmées font de ce Pokémon
        un excellent nageur. On peut souvent le voir nager
        élégamment dans les lacs.
      de: |-
        Seine Vorderbeine besitzen Schwimmhäute, um es
        perfekt ans Wasser anzupassen. Daher schwimmt es
        elegant in Flüssen.
      es: |-
        Las patas traseras palmípedas le permiten nadar. Es
        común verlo chapotear con estilo en lagos y otras
        zonas acuáticas.
      it: |-
        Le zampe anteriori palmate ne fanno un elegante
        nuotatore, che si può incontrare nei laghi e in altri
        specchi d’acqua.
    omega-ruby:
      ja-Hrkt: |-
        てあしの　みずかきと　りゅうせんけいの　からだが
        すいちゅうで　おそるべき　スピードを　うみだす。
        きんメダリスト　よりも　だんぜん　はやいぞ。
      ja: |-
        手足の　水かきと　流線型の　体が
        水中で　恐るべき　スピードを　生みだす。
        金メダリスト　よりも　断然　速いぞ。
      ko: |-
        손발의 물갈퀴와 유선형의 몸이
        수중에서 무서울 만큼 빠른 스피드를 낸다.
        금메달리스트보다 단연 빠르다.
      en: |-
        The webbed flippers on its forelegs and hind legs and the
        streamlined body of Golduck give it frightening speed.
        This Pokémon is definitely much faster than even the most
        athletic swimmer.
      fr: |-
        Les pattes avant et arrière palmées et le corps aérodynamique
        d’Akwakwak lui donnent une vitesse effrayante. Ce Pokémon
        est bien plus rapide que les plus grands champions de
        natation.
      de: |-
        Die mit Schwimmhäuten überzogenen Flossen an seinen
        Vorder- und Hinterbeinen und der stromlinienförmige Körper
        machen Entoron unheimlich schnell. Dieses Pokémon ist auf
        jeden Fall schneller als die meisten Hochleistungsschwimmer.
      es: |-
        Golduck alcanza una velocidad de vértigo gracias a las aletas
        palmípedas de las extremidades y a la forma aerodinámica de
        su cuerpo. Realmente, la velocidad de este Pokémon supera
        la de cualquier nadador.
      it: |-
        Le zampe anteriori e posteriori a pinna dotate di membrana
        interdigitale e il corpo longilineo di Golduck gli conferiscono
        una velocità incredibile. Infatti è molto più veloce dei più
        esperti nuotatori umani.
    alpha-sapphire:
      ja-Hrkt: |-
        およぐ　スピードは　ポケモンじゅうで　いちばん。
        あらしで　おおあれの　うみでも　へっちゃら。
        なんぱせんから　ひとを　たすける　ことも　ある。
      ja: |-
        泳ぐ　スピードは　ポケモン中で　一番。
        嵐で　大荒れの　海でも　へっちゃら。
        難破船から　人を　助ける　ことも　ある。
      ko: |-
        헤엄치는 스피드는 포켓몬 중 제일이다.
        태풍으로 거칠어진 바다라도 문제없다.
        난파선에서 사람을 구해내는 일도 있다.
      en: |-
        Golduck is the fastest swimmer among all Pokémon. It swims
        effortlessly, even in a rough, stormy sea. It sometimes rescues
        people from wrecked ships floundering in high seas.
      fr: |-
        Akwakwak est le Pokémon qui nage le plus vite.
        Il nage sans se fatiguer, même lorsque la mer est agitée.
        Il sauve parfois des gens coincés dans les navires bloqués
        en haute mer.
      de: |-
        Entoron ist der schnellste Schwimmer von allen Pokémon.
        Es schwimmt mit Leichtigkeit auch durch eine raue, stürmische
        See. Manchmal rettet es Menschen, die in Seenot geraten sind
        und auf dem Meer treiben.
      es: |-
        Golduck es el nadador más rápido de los Pokémon. Además,
        nada sin esfuerzo hasta en aguas turbulentas en plena
        tormenta. En ocasiones, ha rescatado a náufragos en alta
        mar.
      it: |-
        Golduck è il più veloce nuotatore tra tutti i Pokémon.
        Nuota senza fatica anche nel mare agitato e tempestoso.
        Talvolta salva naufraghi dai relitti affondati in alto mare.
    sun:
      ja-Hrkt: |-
        ひたいの　あかい　ぶぶんを　もつと
        じんつうりきを　さずかると　いわれ
        らんかく　された　かこも　ある。
      ja: |-
        額の　赤い　部分を　持つと
        神通力を　授かると　いわれ
        乱獲　された　過去も　ある。
      ko: |-
        이마의 붉은 부분을 가지면
        신통력을 얻을 수 있다고 전해져
        남획되었던 과거도 있다.
      zh-Hant: |-
        據說只有持有牠前額的紅色部分
        就會被授予神通力。
        這讓牠曾有過被濫捕的過去。
      zh-Hans: |-
        据说戴着额头红色的部分
        就会被赋予神通力，
        过去也曾因此被人类过度捕捉。
      en: |-
        It is said that the red part of its forehead
        grants supernatural powers to those who
        possess one, so it was over-hunted in the past.
      fr: |-
        Certains prétendaient que tenir la gemme rouge
        de son front donnait des pouvoirs psychiques,
        aussi a-t-il été braconné à certaines époques.
      de: |-
        Besitzt man den roten Fortsatz seiner Stirn,
        erhält man angeblich telekinetische Kräfte. Einst
        war es sehr selten, da es maßlos gejagt wurde.
      es: |-
        En el pasado fue objeto de una caza
        indiscriminada, pues se decía que la parte roja
        de su frente daba poderes a quien la poseyera.
      it: |-
        È stato a lungo oggetto di una caccia sfrenata
        a causa dell’escrescenza rossa che ha sulla
        fronte, ritenuta fonte di poteri soprannaturali.
    moon:
      ja-Hrkt: |-
        みずうみの　ほとりを　およぎまわり
        つかまえた　さかなポケモンを
        きしべで　しずかに　くっている。
      ja: |-
        湖の　ほとりを　泳ぎまわり
        捕まえた　さかなポケモンを
        岸辺で　静かに　喰っている。
      ko: |-
        호수 근처를 헤엄쳐 다니며
        잡은 물고기포켓몬을
        물가에서 조용히 먹고 있다.
      zh-Hant: |-
        在湖邊游來游去，
        在岸邊靜靜地吃著
        捕捉到的魚寶可夢。
      zh-Hans: |-
        在湖边游来游去，
        在岸边静静地啃食
        捕捉到的鱼宝可梦。
      en: |-
        It swims along the banks of lakes and catches
        fish Pokémon. It takes them to the shore and
        quietly eats them up.
      fr: |-
        Il nage à travers les lacs pour attraper des
        Pokémon poissons, puis il remonte sur la rive
        pour les déguster tranquillement.
      de: |-
        Es schwimmt Küstengebiete auf der Suche nach
        Fisch-Pokémon ab. Hat es eines gefangen, geht
        es ans Ufer, um es in aller Ruhe zu verschlingen.
      es: |-
        Se sumerge en las aguas de los lagos en busca
        de Pokémon pez para luego darse un apacible
        banquete en la orilla.
      it: |-
        Nuota nei laghi in cerca di Pokémon acquatici
        e, dopo averli catturati, torna a riva per
        mangiarli tranquillamente.
    ultra-sun:
      ja-Hrkt: |-
        およぎが　はやい　さかなポケモンでも
        かなしばりで　うごきを　とめて
        かんたんに　つかまえることができる。
      ja: |-
        泳ぎが　速い　さかなポケモンでも
        金縛りで　動きを　止めて
        簡単に　捕まえることが　できる。
      ko: |-
        빠르게 헤엄치는 물고기포켓몬이라도
        사슬묶기로 꼼짝 못 하게 해서
        쉽게 잡을 수 있다.
      zh-Hant: |-
        即使面對游得很快的魚寶可夢，
        也能用定身法停住對方的動作，
        輕易地捕捉獵物。
      zh-Hans: |-
        即便是游得很快的鱼宝可梦，
        它也能用定身法定住其行动，
        并轻易地进行捕捉。
      en: |-
        Even fast-swimming fish Pokémon can be
        disabled by Golduck. It brings them to a
        standstill and seizes them.
      fr: |-
        Même les Pokémon poissons les plus rapides
        ne peuvent pas lui échapper. Il les capture
        avec facilité en les immobilisant.
      de: |-
        Es bringt selbst schnelle Fisch-Pokémon zum
        Stillstand und ergreift sie anschließend mit
        Leichtigkeit.
      es: |-
        Puede paralizar incluso a los Pokémon pez más
        veloces, lo que le permite atraparlos con suma
        facilidad.
      it: |-
        Riesce a immobilizzare anche i Pokémon
        acquatici più veloci. In questo modo, può
        catturarli con facilità.
    ultra-moon:
      ja-Hrkt: |-
        およぎの　プロフェッショナル。
        ながい　シッポを　たくみに　くねらせ
        まるまる　ふつか　およいでいられる。
      ja: |-
        泳ぎの　プロフェッショナル。
        長い　シッポを　巧みに　くねらせ
        丸々　２日　泳いでいられる。
      ko: |-
        수영의 전문가다.
        긴 꼬리를 능숙하게 흔들어서
        이틀 내내 헤엄칠 수 있다.
      zh-Hant: |-
        游泳專家。能靈活地
        擺動長長的尾巴，
        連續游上整整２天。
      zh-Hans: |-
        游泳专家。
        能灵活地摇摆长尾巴，
        游上整整２天。
      en: |-
        A professional swimmer, it can continue
        swimming for two days straight by waving its
        long tail skillfully.
      fr: |-
        Ce professionnel de la natation dispose d’une
        longue queue souple qui lui permet de nager
        sans interruption pendant deux jours.
      de: |-
        Ein exzellenter Schwimmer. Wenn es seinen
        langen, beweglichen Schwanz geschickt
        einsetzt, kann es zwei Tage durchschwimmen.
      es: |-
        Un portento de la natación capaz de nadar
        durante dos días sin interrupción moviendo su
        larga cola con destreza.
      it: |-
        È un nuotatore provetto. Muovendo abilmente
        la sua lunga coda, può nuotare ininterrottamente
        per due giorni.
    lets-go-pikachu:
      ja-Hrkt: |-
        すらりとした　ながい　てあしと
        はったつした　おおきな　みずかきで
        みずうみを　ゆうがに　およぐ。
      ja: |-
        すらりとした　長い　手足と
        発達した　大きな　水かきで
        湖を　優雅に　泳ぐ。
      ko: |-
        날씬하고 긴 팔다리와
        발달한 큰 물갈퀴로
        호수를 우아하게 헤엄친다.
      zh-Hant: |-
        會用修長的四肢以及
        功能發達的巨大水蹼
        在湖面上優雅地游泳。
      zh-Hans: |-
        它靠修长的四肢
        和发达的大脚蹼
        在湖里优雅地游泳。
      en: |-
        Its long, slim limbs end in broad flippers.
        They are used for swimming gracefully in lakes.
      fr: |-
        Ses membres longs et fins se terminent par
        des nageoires qui lui permettent de nager
        élégamment.
      de: |-
        An seinen langen, dünnen Gliedmaßen befinden
        sich Schwimmflossen. Mit diesen kann es
        anmutig durch Seen schwimmen.
      es: |-
        Sus delgadas y largas extremidades terminan
        en dedos palmeados muy desarrollados que
        le permiten nadar en los lagos con gracilidad.
      it: |-
        Ha zampe palmate lunghe e sottili, che
        gli permettono di nuotare elegantemente
        nei laghi.
    lets-go-eevee:
      ja-Hrkt: |-
        すらりとした　ながい　てあしと
        はったつした　おおきな　みずかきで
        みずうみを　ゆうがに　およぐ。
      ja: |-
        すらりとした　長い　手足と
        発達した　大きな　水かきで
        湖を　優雅に　泳ぐ。
      ko: |-
        날씬하고 긴 팔다리와
        발달한 큰 물갈퀴로
        호수를 우아하게 헤엄친다.
      zh-Hant: |-
        會用修長的四肢以及
        功能發達的巨大水蹼
        在湖面上優雅地游泳。
      zh-Hans: |-
        它靠修长的四肢
        和发达的大脚蹼
        在湖里优雅地游泳。
      en: |-
        Its long, slim limbs end in broad flippers.
        They are used for swimming gracefully in lakes.
      fr: |-
        Ses membres longs et fins se terminent par
        des nageoires qui lui permettent de nager
        élégamment.
      de: |-
        An seinen langen, dünnen Gliedmaßen befinden
        sich Schwimmflossen. Mit diesen kann es
        anmutig durch Seen schwimmen.
      es: |-
        Sus delgadas y largas extremidades terminan
        en dedos palmeados muy desarrollados que
        le permiten nadar en los lagos con gracilidad.
      it: |-
        Ha zampe palmate lunghe e sottili, che
        gli permettono di nuotare elegantemente
        nei laghi.
    sword:
      ja-Hrkt: |-
        ながれの　おだやかな　かわに　すむ。
        ながい　てあしで　みずを　かきわけ
        ゆうがな　およぎを　みせる。
      ja: |-
        流れの　穏やかな　川に　棲む。
        長い　手足で　水を　掻きわけ
        優雅な　泳ぎを　みせる。
      ko: |-
        잔잔히 흐르는 강에 산다.
        긴 팔다리로 물을 헤치며
        우아하게 헤엄친다.
      zh-Hant: |-
        生活在水流平穩的河川裡。
        會用長長的手腳划水，
        展現自己優雅的泳姿。
      zh-Hans: |-
        生活在水流平稳的河里。
        会用长长的手脚划水，
        展现自己优雅的泳姿。
      en: |-
        This Pokémon lives in gently flowing rivers. It
        paddles through the water with its long limbs,
        putting its graceful swimming skills on display.
      fr: |-
        Vivant dans les rivières au cours tranquille,
        il se sert de ses longs membres pour nager
        avec élégance.
      de: |-
        Dieses Pokémon lebt in sanft fließenden Flüssen.
        Mit seinen langen Gliedmaßen schwimmt es
        voller Eleganz durch das Wasser.
      es: |-
        Habita en ríos de aguas plácidas. Sus largas
        extremidades le permiten nadar con gracilidad.
      it: |-
        Vive in fiumi dalle acque placide. Si serve
        dei suoi lunghi arti per nuotare con eleganza.
    shield:
      ja-Hrkt: |-
        かわを　よごした　にんげんを
        すいちゅうに　ひきこみ　つれさる
        むかしばなしが　のこされている。
      ja: |-
        川を　汚した　人間を
        水中に　引き込み　連れ去る
        昔話が　残されている。
      ko: |-
        강을 더럽힌 사람을 물속으로
        끌어들여 데려간다는
        옛날이야기가 전해져 오고 있다.
      zh-Hant: |-
        民間故事裡相傳，
        牠會把弄髒河川的
        人類拖進水裡帶走。
      zh-Hans: |-
        古老的故事中说，
        它会把污染河水的
        人类拖进水中带走。
      en: |-
        Old tales tell of Golduck punishing those that
        defiled its river. The guilty were dragged into
        the water and taken away.
      fr: |-
        D’après de vieilles légendes, ce Pokémon
        entraînait au fond de l’eau tous ceux
        qui osaient souiller sa rivière.
      de: |-
        Alten Legenden zufolge werden jene Menschen,
        die es wagen, seinen Fluss zu verschmutzen,
        von Entoron ins Wasser gezerrt und entführt.
      es: |-
        Cuenta una antigua leyenda que los Golduck
        arrastraban a quienes contaminaran sus ríos al
        fondo de las aguas.
      it: |-
