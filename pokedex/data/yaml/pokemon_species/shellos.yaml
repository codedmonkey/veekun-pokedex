    x:
      ja-Hrkt: |-
        やわらかい　からだを　つよくおすと
        むらさきいろの　なぞの　えきたいが
        にじみでるので　ようちゅうい。
      ja: |-
        やわらかい　体を　強く押すと
        紫色の　ナゾの　液体が
        にじみ出るので　要注意。
      ko: |-
        부드러운 몸을 강하게 누르면
        보랏빛이 나는 정체불명의 액체가
        배어 나오므로 주의가 필요하다.
      en: |-
        Beware of pushing strongly on its squishy body,
        as it makes a mysterious purple fluid ooze out.
      fr: |-
        Un étrange liquide mauve s’échappe de son corps,
        ne lui appuyez pas dessus.
      de: |-
        Nicht seinen Körper zusammendrücken,
        sonst sickert eine seltsame lilafarbene Flüssigkeit aus!
      es: |-
        No hay que apretarle muy fuerte, ya que, si lo haces,
        secreta un misterioso fluido morado.
      it: |-
        Se si esercita una forte pressione sul suo corpo,
        ne fuoriesce un misterioso liquido viola.
    'y':
      ja-Hrkt: |-
        すむ　ばしょの　かんきょうに　よって
        からだの　かたちや　いろが
        へんか　しやすい　ポケモンだ。
      ja: |-
        住む　場所の　環境に　よって
        体の　形や　色が
        変化しやすい　ポケモンだ。
      ko: |-
        사는 장소의 환경에 따라
        몸의 모양과 색깔이
        변화하기 쉬운 포켓몬이다.
      en: |-
        Its shape and coloration vary, depending on
        its habitat.
      fr: |-
        Il change facilement de couleur ou de forme en
        fonction de son environnement.
      de: |-
        Form und Farbe dieses Pokémon ändern sich
        je nach der Umgebung, in der es lebt.
      es: |-
        Shellos adapta la forma y color de su cuerpo
        dependiendo del lugar en donde viva.
      it: |-
        Cambia facilmente aspetto e colore secondo il luogo
        di provenienza.
    omega-ruby:
      ja-Hrkt: |-
        やわらかい　からだを　つよくおすと
