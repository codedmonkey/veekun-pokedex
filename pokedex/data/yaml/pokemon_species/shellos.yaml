        からだの　かたちや　いろが
        へんか　しやすい　ポケモンだ。
      ja: |-
        住む　場所の　環境に　よって
        体の　形や　色が
        変化しやすい　ポケモンだ。
      ko: |-
        사는 장소의 환경에 따라
        몸의 모양과 색깔이
        변화하기 쉬운 포켓몬이다.
      en: |-
        Its shape and coloration vary, depending on
        its habitat.
      fr: |-
        Il change facilement de couleur ou de forme en fonction
        de son environnement.
      de: |-
        Form und Farbe dieses Pokémon ändern sich je nach
        der Umgebung, in der es lebt.
      es: |-
        Shellos adapta la forma y color de su cuerpo dependiendo
        del lugar en donde viva.
      it: |-
        Cambia facilmente aspetto e colore secondo il luogo
        di provenienza.
    sun:
      ja-Hrkt: |-
        いそが　おもな　すみか。
        せいそくちの　かんきょうや　エサの
        しつで　いろや　すがたが　ことなる。
      ja: |-
        磯が　主な　棲みか。
        生息地の　環境や　餌の
        質で　色や　姿が　異なる。
      ko: |-
        물가가 주요 서식지다.
        서식지의 환경이나 먹이의
        질에 따라 색과 모습이 다르다.
      zh-Hant: |-
        岩岸是牠主要的居所。
        根據棲息地的環境和所吃食物的質地，
        顏色和樣子會有所不同。
      zh-Hans: |-
        岩岸是它主要的居所。
        根据栖息地的环境和食物的质地，
        颜色和样子会有所不同。
      en: |-
        For the most part, it makes its home along
        the seashore. Its color and form differ according
        to its habitat and the quality of its food.
      fr: |-
        Il vit principalement sur les rivages rocheux.
        Sa forme et sa couleur peuvent varier selon
        son environnement et son alimentation.
      de: |-
        Es lebt hauptsächlich in Küstengebieten.
        Seine Form und Farbe ändern sich je nach
        Lebensraum und Futter.
      es: |-
        Suele vivir cerca del agua y su forma y color
        varían en función de factores como su hábitat
        o su alimentación.
      it: |-
        Vive principalmente sui litorali rocciosi.
        La forma e il colore del suo corpo mutano in
        base all’habitat e al cibo di cui si nutre.
    moon:
      ja-Hrkt: |-
        さわると　むらさきの　ねんえきが
        てに　つくぞ。　あらっても　あらっても
        なかなか　おちないので　ちゅうい。
      ja: |-
        触ると　紫の　粘液が
        手に　つくぞ。　洗っても　洗っても
        なかなか　落ちないので　注意。
      ko: |-
        만지면 보라색 점액이
        손에 묻는다. 아무리 씻어도
        좀처럼 떨어지지 않으므로 주의.
      zh-Hant: |-
        如果用手摸牠，紫色的黏液
        就會沾到手上。不管怎麼洗
        都很難洗掉，所以要注意。
      zh-Hans: |-
        一旦接触，紫色的粘液就
        会粘到手上。即使反复洗
        也不怎么能洗掉，所以要注意。
      en: |-
        Purple mucus sticks to the hands of anyone
        who touches it. Take care, as the substance is
        troublesome to wash off. 
      fr: |-
        Au toucher, une sécrétion mauve se dépose sur
        les mains. Faites bien attention, car elle ne part
        vraiment pas facilement, même en lavant bien.
      de: |-
        Fasst man es an, schmiert man sich mit
        lilafarbenem Schleim voll, der nicht abgeht,
        egal, wie oft man sich auch die Hände wäscht.
      es: |-
        Al tocarlo, segrega un fluido violáceo que
        mancha las manos y que es extremadamente
        difícil de eliminar aún tras repetidos lavados.
      it: |-
        Quando lo si tocca, lascia sulle mani un viscoso
        liquido viola difficile da rimuovere anche dopo
        ripetuti lavaggi.
    ultra-sun:
      ja-Hrkt: |-
        ふだん　うみのなかに　くらしているが
        ひふが　かんそう　するまでなら
        りくちでも　かつどう　できるぞ。
      ja: |-
        普段　海の中に　暮らしているが
        皮膚が　乾燥　するまでなら
        陸地でも　活動　できるぞ。
      ko: |-
        평소에는 바닷속에서 지내지만,
        피부가 마르기 전까지는
        육지에서도 활동할 수 있다.
      zh-Hant: |-
        平常生活在海裡，
        但只要皮膚沒有乾燥，
        也可以在陸地上活動。
      zh-Hans: |-
        平常在海里生活，
        但只要皮肤没有干燥，
        也可以在陆地活动。
      en: |-
        While they normally live in the sea, they can
        function on land, too, until their skin dries out.
      fr: |-
        Il vit normalement dans la mer, mais il peut
        aussi s’installer sur la terre ferme, tant que
        sa peau reste humide.
      de: |-
        Es lebt zwar für gewöhnlich im Meer, kann sich
        aber auch an Land bewegen, bis seine Haut
        austrocknet.
      es: |-
        Por lo general suele habitar en el agua, pero
        también puede moverse por tierra firme siempre
        y cuando su piel no se reseque por completo.
      it: |-
        Vive solitamente in mare, ma può spostarsi
        anche sulla terraferma e restarvi finché
        la pelle non inizia a seccarsi.
    ultra-moon:
      ja-Hrkt: |-
        キケンを　かんじると　むらさきいろの
        しるを　だす。　あぶらあせの　ような
        ものだと　かんがえられている。
      ja: |-
        危険を　感じると　紫色の
        汁を　だす。　あぶら汗の　ような
        ものだと　考えられている。
      ko: |-
        위험을 느끼면 보라색
        분비액을 내보낸다. 진땀 같은
        것이라고 여겨지고 있다.
      zh-Hant: |-
        感受到危險時會分泌
        紫色的汁液。人們認為
        這是類似冷汗的東西。
      zh-Hans: |-
        如果感到危险，就会分泌出紫色的汁。
        人们认为这是类似于虚汗的东西。
      en: |-
        When it senses danger, a purple liquid oozes out
        of it. The liquid is thought to be something like
        greasy sweat.
      fr: |-
        Il sécrète un liquide mauve lorsqu’il se sent
        en danger. Il s’agirait d’un phénomène similaire
        aux sueurs froides.
      de: |-
        Spürt es Gefahr, stößt es eine lilafarbene
        Flüssigkeit aus. Man geht davon aus, dass es
        sich dabei um eine Art Angstschweiß handelt.
      es: |-
        Cuando se siente amenazado, secreta un fluido
        morado. Según se cree, podría tratarse de un
        fenómeno similar al de los sudores fríos.
      it: |-
        Quando avverte il pericolo, secerne un liquido
        viola. Si ritiene sia un fenomeno simile ai sudori
        freddi causati dalla paura.
    sword:
      ja-Hrkt: |-
        かんきょうで　すがたが　かわる。
        すいおんが　あたたかい　うみでは
        このすがたに　なるという　せつも。
      ja: |-
        環境で　姿が　変わる。
        水温が　温かい　海では
        この姿に　なるという　説も。
      ko: |-
        환경에 따라 모습이 바뀐다.
        수온이 따뜻한 바다에서는
        이 모습이 된다는 설도 있다.
      zh-Hant: |-
        樣子會因環境不同而改變。
        也有人說牠到了溫暖的
        海裡就會變成這個樣子。
      zh-Hans: |-
        样子会因环境不同而改变。
        也有人说它到了温暖的
        海里就会变成这个样子。
      en: |-
        This Pokémon’s habitat shapes its physique.
        According to some theories, life in warm ocean
        waters causes this variation to develop.
      fr: |-
        Son apparence change selon son environnement.
        On raconte qu’il adopte celle-ci dans les mers
        chaudes.
      de: |-
        Sein Aussehen hängt von seiner Umgebung ab.
        Man geht davon aus, dass es diese Form in
        warmen Meeren annimmt.
      es: |-
        Su aspecto cambia según el entorno. Al parecer,
        esta es la forma que adopta en mares de aguas
        cálidas.
      it: |-
        Il suo aspetto cambia in base all’habitat.
        Secondo alcune teorie, assume questa forma
        nei mari più caldi.
    shield:
      ja-Hrkt: |-
        つよく　ふれると　むらさきいろの
        ナゾの　しるを　だす。　がいは
        ないけれど　ネバネバするよ。
      ja: |-
        強く　触れると　紫色の
        謎の　汁を　出す。　害は
        ないけれど　ネバネバするよ。
      ko: |-
        세게 만지면 보라색의
        정체 모를 액체를 내보낸다.
        해롭지는 않지만 끈적거린다.
      zh-Hant: |-
        如果用力按住牠，
        牠就會分泌出神秘的紫色液體。
        雖然液體無害，不過黏糊糊的。
      zh-Hans: |-
        如果用力按住它，
        它就会分泌出神秘的紫色液体。
        虽然液体无害，不过黏糊糊的。
      en: |-
        Subjecting this Pokémon to a strong force
        causes it to secrete a strange purple fluid.
        Though harmless, the fluid is awfully sticky.
      fr: |-
        Si on le caresse trop fort, il sécrète un étrange
        liquide mauve qui est inoffensif, mais dont
        la texture est très gluante.
      de: |-
        Wenn man es fest drückt, sondert es eine
        seltsame lilafarbene Flüssigkeit ab. Diese ist
        zwar nicht schädlich, aber sehr schleimig.
      es: |-
        Si se le aprieta muy fuerte, secreta un misterioso
        fluido morado que, aunque inofensivo, resulta
        desagradable por su viscosidad.
      it: |-
        Se premuto con forza secerne un misterioso
        liquido viola molto appiccicoso, ma non nocivo.
