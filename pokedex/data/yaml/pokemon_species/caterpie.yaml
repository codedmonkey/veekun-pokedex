    x:
      ja-Hrkt: |-
        あたまの　しょっかく　から
        きょうれつな　においを　だして
        てきを　おいはらい　みをまもる。
      ja: |-
        頭の　触覚から
        強烈な　においを　出して
        敵を　追い払い　身を守る。
      ko: |-
        머리의 더듬이로부터
        강렬한 냄새를 내어
        적을 물리치고 몸을 보호한다.
      en: |-
        For protection, it releases a horrible stench from
        the antennae on its head to drive away enemies.
      fr: |-
        Pour se protéger, il émet un gaz puant par ses
        antennes, qui fait fuir ses ennemis audacieux.
      de: |-
        Als Schutz vor Feinden sondert es einen übel
        riechenden Gestank mit seinen Antennen ab.
      es: |-
        Para protegerse despide un hedor horrible de sus
        antenas, con el que repele a sus enemigos.
      it: |-
        Per proteggersi emette un puzzo terribile
        dall’antenna sul capo, tenendo lontani i nemici.
    'y':
      ja-Hrkt: |-
        あしの　さきは　どんなところにも
        すいつく　きゅうばん。ひっしに
        きのぼりをして　はっぱを　たべる。
      ja: |-
        足の　先は　どんなところにも
        吸いつく　吸盤。必死に
        木登りをして　葉っぱを　食べる。
      ko: |-
        발끝에는 어디든지
        달라붙는 빨판이 있다. 필사적으로
        나무 타기를 해서 나뭇잎을 먹는다.
      en: |-
        Its feet have suction cups designed to stick to any
        surface. It tenaciously climbs trees to forage.
      fr: |-
        Ses pattes ont des ventouses lui permettant de
        grimper sur toute surface, notamment les arbres.
      de: |-
        Die Saugnäpfe an den Beinen haften auf jedem
        Untergrund. Es sucht hartnäckig in Bäumen
        nach Futter.
      es: |-
        Sus patas tienen ventosas con las que se adhiere a
        cualquier sitio. Escala árboles buscando forraje.
      it: |-
        Le sue zampe hanno ventose che possono aderire
        a ogni superficie. Sale sugli alberi cercando cibo.
    omega-ruby:
      ja-Hrkt: |-
        からだ　よりも　おおきな　はっぱを　みるみる
        たべつくして　しまうほどの　しょくよくを　もつ。
        しょっかくから　きょうれつな　においを　だすぞ。
      ja: |-
        体　よりも　大きな　葉っぱを　みるみる
        食べつくして　しまうほどの　食欲を　もつ。
        触角から　強烈な　臭いを　出すぞ。
      ko: |-
        몸보다 커다란 잎사귀를 순식간에
        먹어치울 정도의 식욕을 지녔다.
        더듬이로 강렬한 냄새를 피운다.
      en: |-
        Caterpie has a voracious appetite. It can devour leaves bigger
        than its body right before your eyes. From its antenna, this
        Pokémon releases a terrifically strong odor.
      fr: |-
        Chenipan a un appétit d’ogre. Il peut engloutir des feuilles
        plus grosses que lui. Les antennes de ce Pokémon dégagent
        une odeur particulièrement entêtante.
      de: |-
        Raupy ist sehr gefräßig, es kann Blätter verschlingen,
        die größer sind als es selbst. Seine Antennen sondern
        einen übel riechenden Gestank ab.
      es: |-
        Caterpie tiene un apetito voraz. Es capaz de devorar hojas
        que superen su tamaño en un abrir y cerrar de ojos.
        Atención a la antena que tiene: libera un hedor realmente
        fuerte.
      it: |-
        Caterpie mangia voracemente. È in grado di divorare foglie
        più grandi del suo stesso corpo in pochi istanti.
        Questo Pokémon emette un odore terrificante dalle antenne.
    alpha-sapphire:
      ja-Hrkt: |-
        からだ　よりも　おおきな　はっぱを　みるみる
        たべつくして　しまうほどの　しょくよくを　もつ。
        しょっかくから　きょうれつな　においを　だすぞ。
      ja: |-
        体　よりも　大きな　葉っぱを　みるみる
        食べつくして　しまうほどの　食欲を　もつ。
        触角から　強烈な　臭いを　出すぞ。
      ko: |-
        몸보다 커다란 잎사귀를 순식간에
        먹어치울 정도의 식욕을 지녔다.
        더듬이로 강렬한 냄새를 피운다.
      en: |-
        Caterpie has a voracious appetite. It can devour leaves
        bigger than its body right before your eyes. From its antenna,
        this Pokémon releases a terrifically strong odor.
      fr: |-
        Chenipan a un appétit d’ogre. Il peut engloutir des feuilles
        plus grosses que lui. Les antennes de ce Pokémon dégagent
        une odeur particulièrement entêtante.
      de: |-
        Raupy ist sehr gefräßig. Es kann Blätter verschlingen,
        die seine eigene Größe um ein Vielfaches übersteigen.
        Seine Antennen sondern einen übel riechenden Gestank ab.
      es: |-
        Caterpie tiene un apetito voraz. Es capaz de devorar hojas
        que superen su tamaño en un abrir y cerrar de ojos.
        Atención a la antena que tiene: libera un hedor realmente
        fuerte.
      it: |-
        Caterpie mangia voracemente. È in grado di divorare foglie
        più grandi del suo stesso corpo in pochi istanti.
        Questo Pokémon emette un odore terrificante dalle antenne.
    sun:
      ja-Hrkt: |-
        とりポケモンに　おそわれると　ツノから
        においを　だして　ていこう　するが
        えじきに　なることも　おおい。
      ja: |-
        とりポケモンに　襲われると　ツノから
        臭いを　だして　抵抗　するが
        餌食に　なることも　多い。
      ko: |-
        새포켓몬에게 습격당하면 뿔에서
        냄새를 뿜어 저항하지만
        먹이가 되는 일도 많다.
      zh-Hant: |-
        被鳥寶可夢襲擊時，
        會從觸角釋放出臭氣抵抗，
        但還是經常淪為獵物。
      zh-Hans: |-
        被鸟宝可梦袭击时
        会从触角中释放出臭气抵抗，
        但也经常会成为鸟食。
      en: |-
        When attacked by bird Pokémon, it resists by
        releasing a terrifically strong odor from its
        antennae, but it often becomes their prey.
      fr: |-
        Lorsqu’il est attaqué par un Pokémon Vol,
        il utilise ses antennes pour dégager une odeur
        nauséabonde, mais cela le sauve rarement.
      de: |-
        Es versucht, angreifende Vogel-Pokémon mit
        dem Gestank aus seinen Antennen in die Flucht
        zu schlagen. Das gelingt ihm aber nicht immer.
      es: |-
        A menudo resulta presa de Pokémon pájaro,
        frente a los que su única defensa es el hedor
        repulsivo que libera por su antena.
      it: |-
        Tenta di difendersi dai Pokémon alati
        emettendo un forte fetore dalle antenne,
        ma cade spesso vittima dei loro attacchi.
    moon:
      ja-Hrkt: |-
        つかまえやすく　せいちょうも　はやい。
        しんまいトレーナーの　パートナーに
        おススメの　ポケモンの　いっぴき。
      ja: |-
        捕まえやすく　成長も　早い。
        新米トレーナーの　パートナーに
        おススメの　ポケモンの　一匹。
      ko: |-
        잡기 쉽고 성장도 빠르다.
        새내기 트레이너의 파트너로
        추천하는 포켓몬 중 한 마리.
      zh-Hant: |-
        易於捕捉，成長速度亦快。
        是推薦給新手訓練家
        作為同伴的寶可夢之一。
      zh-Hans: |-
        易于捕捉，成长也快。
        是推荐给新手训练家
        作为同伴的宝可梦之一。
      en: |-
        It’s easy to catch, and it grows quickly, making
        it one of the top recommendations for novice
        Pokémon Trainers.
      fr: |-
        Un Pokémon facile à attraper et qui croît
        rapidement. C’est l’un des partenaires
        privilégiés des Dresseurs débutants.
      de: |-
        Es eignet sich bestens für frischgebackene
        Trainer, da es sich leicht fangen lässt und
        sich sehr schnell entwickelt.
      es: |-
        Se desarrolla rápidamente y es fácil de atrapar.
        Es el compañero ideal para Entrenadores menos
        experimentados.
      it: |-
        È facile da catturare e cresce in fretta.
        È uno dei Pokémon più indicati per gli Allenatori
        in erba.
    ultra-sun:
      ja-Hrkt: |-
        はやく　せいちょう　したいのか
        しょくよくおうせいで　１にちに
        １００まいの　はっぱを　くらう。
      ja: |-
        早く　成長　したいのか
        食欲旺盛で　１日に
        １００枚の　葉っぱを　食らう。
      ko: |-
        빨리 성장하고 싶어서인지
        식욕이 왕성하여 하루에
        100장의 잎사귀를 먹는다.
      zh-Hant: |-
        或許是為了讓自己快點成長，
        牠的食慾非常旺盛，
        每天要吃掉１００片樹葉。
      zh-Hans: |-
        或许是想要尽快长大，
        它的食欲非常旺盛，
        每天能吃掉１００片叶子。
      en: |-
        Perhaps because it would like to grow up
        quickly, it has a voracious appetite, eating
        a hundred leaves a day.
      fr: |-
        C’est peut-être parce qu’il a envie de grandir
        le plus vite possible qu’il est si vorace.
        Il engloutit une centaine de feuilles par jour.
      de: |-
        Das nimmersatte Raupy verschlingt 100 Blätter
        am Tag. Vermutlich strebt es so ein schnelleres
        Wachstum an.
      es: |-
        Muestra un apetito voraz, debido quizás a sus
        ganas de acelerar su desarrollo. Puede llegar a
        devorar un centenar de hojas al día.
      it: |-
        Mangia 100 foglie al giorno. La sua voracità
        potrebbe essere dovuta al desiderio di crescere
        in fretta.
    ultra-moon:
      ja-Hrkt: |-
        からだは　やわらかく　ちからもない。
        しぜんかいでは　つねに　エサとして
        ねらわれ　つづける　うんめい。
      ja: |-
        身体は　柔らかく　力もない。
        自然界では　常に　エサとして
        狙われ　続ける　運命。
      ko: |-
        몸은 부드럽고 힘도 없다.
        자연계에서는 항상 먹이로
        노려지게 될 운명이다.
      zh-Hant: |-
        身體柔軟，又沒什麼力氣。
        在自然界，牠的命運就是
        不斷被當成獵物來捕食。
      zh-Hans: |-
        身体软绵绵的，也没什么力气。
        在自然界，它的命运就是作为
        猎物而被不断捕食。
      en: |-
        Its body is soft and weak. In nature, its
        perpetual fate is to be seen by others as food.
      fr: |-
        Son corps est mou et sans force.
        La nature semble l’avoir destiné à servir
        de proie aux autres Pokémon.
      de: |-
        Sein weicher und schwacher Körper ist ein
        allseits beliebtes Futter. Es muss sich daher
        stets vor Angreifern in Acht nehmen.
      es: |-
        Su cuerpo es blando y carente de fuerza. Parece
        que la naturaleza lo hubiera destinado a servir
        de sustento a otros Pokémon.
      it: |-
        Il suo corpo è molle e privo di forza.
        Molto spesso il suo destino in natura è
        di cadere preda di altri Pokémon.
    lets-go-pikachu:
      ja-Hrkt: |-
        あたまの　さきにある　しょっかくに
        ふれると　きょうれつな　においを
        だして　みを　まもろうとする。
      ja: |-
        頭の　先にある　触角に
        ふれると　強烈な　においを
        出して　身を　守ろうとする。
      ko: |-
        머리끝에 있는 더듬이를
        건드리면 강렬한 냄새를 내서
        몸을 보호하려 한다.
      zh-Hant: |-
        如果碰到牠頭上的觸角，
        牠就會分泌強烈的臭味
        來保護自己。
      zh-Hans: |-
        如果你碰到了它头上的
        触角，它就会分泌出
        难闻的气味来保护自己。
      en: |-
        If you touch the feeler on top of its head, it will
        release a horrible stink to protect itself.
      fr: |-
        Quand on touche l’appendice sur son front,
        il sécrète une odeur nauséabonde pour se
        protéger.
      de: |-
        Berührt man die Fühler auf seinem Kopf,
        so versucht es sich zu schützen, indem es
        einen penetranten Geruch absondert.
      es: |-
        Cuando le tocan la antena roja que tiene en la
        frente, se defiende desprendiendo un hedor
        nauseabundo.
      it: |-
        Se gli si toccano le antenne che ha sulla testa,
        si difende emettendo un odore insopportabile.
    lets-go-eevee:
      ja-Hrkt: |-
