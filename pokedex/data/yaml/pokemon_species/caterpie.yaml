      ko: |-
        머리의 더듬이로부터
        강렬한 냄새를 내어
        적을 물리치고 몸을 보호한다.
      zh-Hant: |-
        會從頭部的觸角釋放出
        強烈的氣味來趕走敵人，
        藉此保護自己。
      zh-Hans: |-
        会从头部的触角中
        释放出强烈的臭气，
        以此来赶走敌人保护自己。
      en: |-
        For protection, it releases a horrible stench from
        the antenna on its head to drive away enemies.
      fr: |-
        Pour se protéger, il émet par ses antennes
        une odeur nauséabonde qui fait fuir ses ennemis.
      de: |-
        Als Schutz vor Feinden sondert es einen übel
        riechenden Gestank mit seinen Antennen ab.
      es: |-
        Para protegerse, despide un hedor horrible por
        las antenas con el que repele a sus enemigos.
      it: |-
        Per proteggersi emette un puzzo terribile dalle
        antenne sul capo, con cui tiene lontani i nemici.
    shield:
      ja-Hrkt: |-
        あしは　みじかいが　きゅうばんに
        なっているので　さかでも　かべでも
        くたびれることなく　すすんでいく。
      ja: |-
        脚は　短いが　吸盤に
        なっているので　坂でも　壁でも
        くたびれることなく　進んでいく。
      ko: |-
        다리는 짧지만 빨판으로
        되어 있어 비탈길이나 벽에서도
        지치지 않고 나아간다.
      zh-Hant: |-
        別看牠的腳很短，
        因為是吸盤，所以無論是
        斜坡還是牆壁都能輕鬆前進。
      zh-Hans: |-
        别看它的脚很短，
        因为是吸盘，所以无论是
        斜坡还是墙壁都能轻松前进。
      en: |-
        Its short feet are tipped with suction pads that
        enable it to tirelessly climb slopes and walls.
      fr: |-
        Ses petites pattes munies de ventouses
        lui permettent de monter les pentes
        et de grimper aux murs sans se fatiguer.
      de: |-
        Es hat Saugnäpfe an den Beinchen, mit denen es
        mühelos Steigungen und Mauern erklimmen kann.
      es: |-
        Sus cortas patas están recubiertas de ventosas
        que le permiten subir incansable por muros y
        cuestas.
      it: |-
        Le ventose sulle sue corte zampe gli permettono
        di affrontare ogni salita e di scalare senza fatica
        qualsiasi muro.
