gardevoir:
  base_happiness: 35
  capture_rate: 45
  color: white
  egg_groups:
    - humanshape
    - indeterminate
  evolution_chain: ralts
  evolves_from: kirlia
  flavor_text:
    ruby:
      en: |-
        GARDEVOIR has the ability to read the
        future. If it senses impending danger
        to its TRAINER, this POKéMON is said tounleash its psychokinetic energy at
        full power.
    sapphire:
      en: |-
        GARDEVOIR has the psychokinetic
        power to distort the dimensions and
        create a small black hole.This POKéMON will try to protect its
        TRAINER even at the risk of its own
        life.
    emerald:
      en: |-
        It apparently does not feel the pull of
        gravity because it supports itself with
        psychic power. It will give its life to
        protect its TRAINER.
    firered:
      en: |-
        It has the power to predict the future.
        Its power peaks when it is protecting its
        TRAINER.
    leafgreen:
      en: |-
        It has the power to predict the future.
        Its power peaks when it is protecting its
        TRAINER.
    diamond:
      en: |-
        It will try to guard its trusted
        Trainer with its life. It has the
        ability to see the future.
    pearl:
      en: |-
        It will try to guard its trusted
        Trainer with its life. It has the
        ability to see the future.
    platinum:
      en: |-
        To protect its Trainer, it will
        expend all its psychic power
        to create a small black hole.
    heartgold:
      en: |-
        It unleashes psychokinetic energy
        at full power when protecting a
        Trainer it has bonded closely with.
    soulsilver:
      en: |-
        It unleashes psychokinetic energy
        at full power when protecting a
        Trainer it has bonded closely with.
    black:
      en: |-
        To protect its Trainer, it will
        expend all its psychic power
        to create a small black hole.
      fr: |-
        Prêt à tout pour protéger son
        Dresseur, il peut créer un mini trou
        noir par sa seule force mentale.
    white:
      en: |-
        To protect its Trainer, it will
        expend all its psychic power
        to create a small black hole.
      fr: |-
        Prêt à tout pour protéger son
        Dresseur, il peut créer un mini trou
        noir par sa seule force mentale.
    black-2:
      en: |-
        To protect its Trainer, it will
        expend all its psychic power
        to create a small black hole.
    white-2:
      en: |-
        To protect its Trainer, it will
        expend all its psychic power
        to create a small black hole.
    x:
      ja-Hrkt: |-
        トレーナーを　まもるためなら
        サイコパワーを　つかいきり　ちいさな
        ブラックホールを　つくりだす。
      ja: |-
        トレーナーを　守るためなら
        サイコパワーを　使いきり　小さな
        ブラックホールを　作り出す。
      ko: |-
        트레이너를 지키기 위해서라면
        사이코 파워를 모두 써서 작은
        블랙홀을 만들어 낸다.
      en: |-
        To protect its Trainer, it will expend all its psychic
        power to create a small black hole.
      fr: |-
        Prêt à tout pour protéger son Dresseur, il peut créer
        un mini trou noir par sa seule force mentale.
      de: |-
        Erzeugt ein kleines schwarzes Loch mithilfe all seiner
        Psycho-Kräfte, um seinen Trainer zu schützen.
      es: |-
        Para proteger a su Entrenador, emplea todo su poder
        psíquico en crear un pequeño agujero negro.
      it: |-
        Quando il suo Allenatore è in pericolo usa tutto il suo
        potere psichico per creare un piccolo buco nero.
    'y':
      ja-Hrkt: |-
        みらいを　よちする　ちからを　もつ。
        トレーナーを　まもる　ときに
        さいだい　パワーを　はっきする。
      ja: |-
        未来を　予知する　力を　持つ。
        トレーナーを　守る　ときに
        最大　パワーを　発揮する。
      ko: |-
        미래를 예지하는 힘을 가진다.
        트레이너를 지킬 때
        최대 파워를 발휘한다.
      en: |-
        It has the power to predict the future. Its power
        peaks when it is protecting its Trainer.
      fr: |-
        Gardevoir est capable de prédire l’avenir.
        Sa puissance augmente quand il protège son
        Dresseur.
      de: |-
        Es kann die Zukunft vorhersagen. Beschützt es
        seinen Trainer, erreicht seine Kraft den Höhepunkt.
      es: |-
        Tiene la capacidad de predecir el futuro. Cuando
        protege a su Entrenador se vuelve más fuerte.
      it: |-
        Ha la capacità di prevedere il futuro. Le sue
        potenzialità sono esaltate quando protegge
        il suo Allenatore.
    omega-ruby:
      ja-Hrkt: |-
        みらいを　よちする　のうりょくで　トレーナーの
        きけんを　さっちしたとき　さいだい　パワーの
        サイコエネルギーを　つかうと　いわれている。
      ja: |-
        未来を　予知する　能力で　トレーナーの
        危険を　察知したとき　最大　パワーの
        サイコエネルギーを　使うと　いわれている。
      ko: |-
        미래를 예지하는 능력으로 트레이너의
        위험을 감지했을 때 최대 파워의
        사이코 에너지를 사용한다고 전해진다.
      en: |-
        Gardevoir has the ability to read the future. If it senses
        impending danger to its Trainer, this Pokémon is said
        to unleash its psychokinetic energy at full power.
      fr: |-
        Gardevoir a le pouvoir de prédire l’avenir. On raconte que
        lorsqu’il sent que son Dresseur est en danger, il libère
        une puissante décharge d’énergie télékinétique.
      de: |-
        Guardevoir kann in die Zukunft schauen. Wenn es eine
        Gefahr für seinen Trainer voraussieht, entlädt es seine
        psychokinetische Energie mit voller Kraft.
      es: |-
        Gardevoir es capaz de leer el futuro. Si siente que su
        Entrenador está en peligro inminente, dicen que libera
        automáticamente toda su energía psicoquinética.
      it: |-
        Gardevoir ha l’abilità di prevedere il futuro. Se percepisce
        un pericolo imminente per il proprio Allenatore, pare che
        scateni tutta l’energia psicocinetica di cui è capace.
    alpha-sapphire:
      ja-Hrkt: |-
        サイコパワーで　くうかんを　ねじまげ　ちいさな
        ブラックホールを　つくりだす　ちからを　もつ。
        いのちがけで　トレーナーを　まもる　ポケモン。
      ja: |-
        サイコパワーで　空間を　ねじ曲げ　小さな
        ブラックホールを　つくりだす　力を　持つ。
        命懸けで　トレーナーを　守る　ポケモン。
      ko: |-
        사이코 파워로 공간을 비틀어 작은
        블랙홀을 만들어내는 힘을 지녔다.
        목숨을 걸고 트레이너를 지키는 포켓몬이다.
      en: |-
        Gardevoir has the psychokinetic power to distort the
        dimensions and create a small black hole. This Pokémon
        will try to protect its Trainer even at the risk of its own life.
      fr: |-
        Gardevoir est doté d’un pouvoir télékinétique lui permettant
        de déformer les dimensions et de créer un petit trou noir.
        Ce Pokémon est prêt à risquer sa vie pour protéger
        son Dresseur.
      de: |-
        Guardevoir kann mit seiner psychokinetischen Energie
        die Dimensionen verzerren und ein kleines Schwarzes Loch
        erzeugen. Es schützt seinen Trainer selbst unter Einsatz
        seines eigenen Lebens.
      es: |-
        Gardevoir tiene el poder psicoquinético de alterar las
        dimensiones y crear un agujero negro pequeño. Este
        Pokémon intenta proteger siempre a su Entrenador aunque
        tenga que arriesgar su propia vida.
      it: |-
        Gardevoir ha il potere psicocinetico di distorcere le dimensioni
        creando un piccolo buco nero. Questo Pokémon cerca di
        proteggere il proprio Allenatore anche a rischio della sua
        stessa vita.
    sword:
      ja-Hrkt: |-
        みらいを　よちする　ちからを　もつ。
        トレーナーを　まもる　ときに
        さいだい　パワーを　はっきする。
      ja: |-
        未来を　予知する　力を　もつ。
        トレーナーを　守る　ときに
        最大　パワーを　発揮する。
      ko: |-
        미래를 예지하는 힘을 가졌다.
        트레이너를 지킬 때
        최대 파워를 발휘한다.
      zh-Hant: |-
        有著預知未來的能力。
        在保護訓練家的時候，
        會發揮出最強的力量。
      zh-Hans: |-
        有着预知未来的能力。
        在保护训练家的时候，
        会发挥出最强的力量。
      en: |-
        It has the power to predict the future. Its power
        peaks when it is protecting its Trainer.
      fr: |-
        Gardevoir est capable de prédire l’avenir.
        Il déploie toute sa puissance quand il doit
        protéger son Dresseur.
      de: |-
        Es kann die Zukunft vorhersagen. Beschützt es
        seinen Trainer, erreicht seine Kraft ihren
        Höhepunkt.
      es: |-
        Tiene la capacidad de predecir el futuro. Para
        proteger a su Entrenador, emplea hasta la última
        gota de su poder psíquico.
      it: |-
        Ha la capacità di prevedere il futuro. Quando
        deve proteggere il suo Allenatore, mette in
        mostra tutta la sua potenza.
    shield:
      ja-Hrkt: |-
        トレーナーを　まもるためなら
        サイコパワーを　つかいきり　ちいさな
        ブラックホールを　つくりだす。
      ja: |-
        トレーナーを　守るためなら
        サイコパワーを　使いきり　小さな
        ブラックホールを　つくりだす。
      ko: |-
        트레이너를 지키기 위해서라면
        사이코 파워를 모두 써서
        작은 블랙홀을 만들어 낸다.
      zh-Hant: |-
        如果是為了保護訓練家，
        牠會不惜用盡自己的精神力量
        製造出小型黑洞。
      zh-Hans: |-
        如果是为了保护训练家，
        它就会用尽自己的精神力量
        制造出小型黑洞。
      en: |-
        To protect its Trainer, it will expend all its psychic
        power to create a small black hole.
      fr: |-
        Prêt à tout pour protéger son Dresseur,
        il peut aller jusqu’à épuiser sa force mentale
        pour créer un mini trou noir.
      de: |-
        Wenn es seinen Trainer schützen will, nimmt es all
        seine Psycho-Kräfte zusammen, um so ein kleines
        schwarzes Loch zu erzeugen.
      es: |-
        Para proteger a su Entrenador, emplea todo su
        poder psíquico en crear un pequeño agujero
        negro.
      it: |-
        Quando il suo Allenatore è in pericolo, usa tutto
        il suo potere psichico per creare un piccolo buco
        nero.
    legends-arceus:
      en: |-
        It will dedicate itself to defending a master it has come to
        adore. Its pure white dress, reminiscent of those worn by ladies
        of nobility, is the dress of one who is willing to risk their life.
