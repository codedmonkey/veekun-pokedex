durant:
  base_happiness: 50
  capture_rate: 90
  color: gray
  egg_groups:
    - bug
  evolution_chain: durant
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        They attack in groups, covering
        themselves in steel armor to
        protect themselves from Heatmor.
      fr: |-
        Ils portent une armure de fer et se
        regroupent pour contrer les attaques
        de leurs prédateurs, les Aflamanoir.
    white:
      en: |-
        Durant dig nests in mountains.
        They build their complicated,
        interconnected tunnels into mazes.
      fr: |-
        Ils creusent des galeries dans les
        montagnes. Les tunnels des Fermite
        sont de vrais labyrinthes.
    black-2:
      en: |-
        Individuals each play different roles in
        driving Heatmor, their natural predator,
        away from their colony.
    white-2:
      en: |-
        Individuals each play different roles in
        driving Heatmor, their natural predator,
        away from their colony.
    x:
      ja-Hrkt: |-
        てんてきの　クイタランに　たいして
        みんなで　やくわりぶんたん　しながら
        はんげきして　すから　おいはらう。
      ja: |-
        天敵の　クイタランに　対して
        みんなで　役割分担　しながら
        反撃して　巣から　追い払う。
      ko: |-
        천적인 앤티골에 대해서
        모두와 역할 분담을 하면서
        반격해 둥지에서 쫓아낸다.
      en: |-
        Individuals each play different roles in driving
        Heatmor, their natural predator, away from
        their colony.
      fr: |-
        Ils travaillent de concert pour protéger leur colonie
        des terribles attaques de leur prédateur naturel,
        Aflamanoir.
      de: |-
        Eine ausgeklügelte Rollenverteilung hilft ihnen dabei,
        ihren natürlichen Feind Furnifraß
        aus dem Nest zu verjagen.
      es: |-
        Actúan en grupo para expulsar de sus colonias a los
        Heatmor, sus depredadores naturales.
      it: |-
        Heatmor è il loro acerrimo nemico, e quando
        vogliono cacciarlo dalla tana si dividono i compiti
        e partono all’attacco!
    'y':
      ja-Hrkt: |-
        はがねの　よろいを　みにまとう。
        てんてきの　クイタランの　こうげきを
        しゅうだんで　ふせぎ　はんげきする。
      ja: |-
        鋼の　よろいを　身にまとう。
        天敵の　クイタランの　攻撃を
        集団で　防ぎ　反撃する。
      ko: |-
        강철의 갑옷을 몸에 걸친다.
        천적인 앤티골의 공격을
        집단으로 막아 반격한다.
      en: |-
        They attack in groups, covering themselves in steel
        armor to protect themselves from Heatmor.
      fr: |-
        Ils portent une armure de fer et se regroupent pour
        contrer les attaques de leurs prédateurs,
        les Aflamanoir.
      de: |-
        Ein eiserner Panzer umgibt seinen Leib. Angriffe von
        Furnifraß, seinem Feind, schlägt es in der Gruppe
        zurück.
      es: |-
        Llevan una armadura de acero. Se defienden en grupo
        para contrarrestar a sus depredadores, los Heatmor.
      it: |-
        È protetto da un’armatura d’acciaio. Si riunisce in
        gruppi per respingere gli attacchi di Heatmor, il suo
        predatore.
    omega-ruby:
      ja-Hrkt: |-
        てんてきの　クイタランに　たいして
        みんなで　やくわりぶんたん　しながら
        はんげきして　すから　おいはらう。
      ja: |-
        天敵の　クイタランに　対して
        みんなで　役割分担　しながら
        反撃して　巣から　追い払う。
      ko: |-
        천적인 앤티골에 대해서
        모두와 역할 분담을 하면서
        반격해 둥지에서 쫓아낸다.
      en: |-
        Individuals each play different roles in driving
        Heatmor, their natural predator, away from
        their colony.
      fr: |-
        Ils travaillent de concert pour protéger leur colonie
        des terribles attaques de leur prédateur naturel, Aflamanoir.
      de: |-
        Eine ausgeklügelte Rollenverteilung hilft ihnen dabei,
        ihren natürlichen Feind Furnifraß aus dem Nest zu verjagen.
      es: |-
        Actúan en grupo para expulsar de sus colonias a los Heatmor,
        sus depredadores naturales.
      it: |-
        Heatmor è il loro acerrimo nemico, e quando vogliono
        cacciarlo dalla tana si dividono i compiti e partono all’attacco!
    alpha-sapphire:
      ja-Hrkt: |-
        はがねの　よろいを　みにまとう。
        てんてきの　クイタランの　こうげきを
        しゅうだんで　ふせぎ　はんげきする。
      ja: |-
        鋼の　よろいを　身にまとう。
        天敵の　クイタランの　攻撃を
        集団で　防ぎ　反撃する。
      ko: |-
        강철의 갑옷을 몸에 걸친다.
        천적인 앤티골의 공격을
        집단으로 막아 반격한다.
      en: |-
        They attack in groups, covering themselves in steel
        armor to protect themselves from Heatmor.
      fr: |-
        Ils portent une armure de fer et se regroupent pour contrer
        les attaques de leurs prédateurs, les Aflamanoir.
      de: |-
        Ein eiserner Panzer umgibt seinen Leib. Angriffe von Furnifraß,
        seinem Feind, schlägt es in der Gruppe zurück.
      es: |-
        Llevan una armadura de acero. Se defienden en grupo para
        contrarrestar a sus depredadores, los Heatmor.
      it: |-
        È protetto da un’armatura d’acciaio. Si riunisce in gruppi per
        respingere gli attacchi di Heatmor, il suo predatore.
    sword:
      ja-Hrkt: |-
        すの　おくふかくに　タマゴを　うむ。
        クイタランに　おそわれると　おおきな
        アゴで　かみついて　はんげき。
      ja: |-
        巣の　奥深くに　タマゴを　産む。
        クイタランに　襲われると　大きな
        顎で　噛みついて　反撃。
      ko: |-
        굴속 깊은 곳에 알을 낳는다.
        앤티골에게 공격받으면 커다란
        턱으로 물어서 반격한다.
      zh-Hant: |-
        在巢穴的深處產卵。
        受到熔蟻獸的襲擊時會用
        大大的顎部咬住對方進行反擊。
      zh-Hans: |-
        在巢穴的深处产卵。
        受到熔蚁兽的袭击时会用
        大大的颚部咬住对方进行反击。
      en: |-
        They lay their eggs deep inside their nests.
        When attacked by Heatmor, they retaliate
        using their massive mandibles.
      fr: |-
        Il dépose ses Œufs tout au fond de son terrier.
        Lorsqu’un Aflamanoir l’attaque, il se défend
        à l’aide de ses mandibules.
      de: |-
        Es legt seine Eier im hintersten Winkel des Nests.
        Wenn es von Furnifraß bedroht wird, wehrt es
        sich mit seinen kräftigen Kiefern.
      es: |-
        Deposita sus huevos en la parte más profunda
        del nido. Si un Heatmor lo ataca, se defiende
        mordiéndolo con sus enormes mandíbulas.
      it: |-
        Depone le Uova nei recessi più interni del suo
        nido. Se un Heatmor lo attacca, si difende
        mordendolo con le grandi mandibole.
    shield:
      ja-Hrkt: |-
        おおきなアゴは　がんせきをも　かみ
        くだく。　サダイジャから　タマゴを
        まもるため　むれで　たたかう。
      ja: |-
        大きな顎は　岩石をも　かみ砕く。
        サダイジャから　タマゴを
        守るため　群れで　戦う。
      ko: |-
        큰 턱은 암석도 깨물어 부순다.
        사다이사로부터 알을
        지키기 위해 무리 지어 싸운다.
      zh-Hant: |-
        巨大的顎部能咬碎岩石。
        為了不讓沙螺蟒把蛋搶走，
        會和其他同類一起並肩戰鬥。
      zh-Hans: |-
        巨大的颚部能咬碎岩石。
        为了不让沙螺蟒把蛋抢走，
        会和其他同类一起并肩战斗。
      en: |-
        With their large mandibles, these Pokémon can
        crunch their way through rock. They work
        together to protect their eggs from Sandaconda.
      fr: |-
        Sa grande mâchoire réduit même les rochers
        en miettes. Il se bat avec sa colonie pour protéger
        ses Œufs des attaques des Dunaconda.
      de: |-
        Ihre mächtigen Kiefer können Felsen zerbeißen.
        Sie rotten sich zu Gruppen zusammen, um ihre
        Eier vor Sanaconda zu beschützen.
      es: |-
        Con sus grandes mandíbulas puede destrozar
        incluso rocas. Lucha en grupo para proteger sus
        larvas del ataque de los Sandaconda.
      it: |-
        Le grandi mandibole possono frantumare anche
        la roccia. Lotta con la colonia per proteggere
        le sue Uova da Sandaconda.
