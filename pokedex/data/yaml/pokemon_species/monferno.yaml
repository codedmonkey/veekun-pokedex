        しっぽの　ほのおの　いきおいを
        うまく　コントロールして　じぶんの
        とくいな　まあいで　たたかうのだ。
      ja: |-
        尻尾の　炎の　勢いを
        うまく　コントロールして
        自分の　得意な　間合いで　戦うのだ。
      ko: |-
        꼬리의 불꽃 세기를
        잘 컨트롤하여 자신에게
        맞는 거리를 두고 싸운다.
      en: |-
        It skillfully controls the intensity of the fire on its
        tail to keep its foes at an ideal distance.
      fr: |-
        Il contrôle habilement l’intensité de la flamme de
        sa queue pour tenir ses adversaires à distance.
      de: |-
        Es kontrolliert die Stärke des Feuers auf seinem
        Schweif geschickt, um Gegner auf Distanz zu halten.
      es: |-
        Controla hábilmente la intensidad del fuego de su cola
        para mantener al enemigo a una distancia ideal.
      it: |-
        Controlla abilmente l’intensità delle fiamme sulla
        sua coda per tenere i nemici alla distanza ideale.
    'y':
      ja-Hrkt: |-
        てんじょうや　かべを　りようして
        くうちゅうさっぽうを　くりだす。
        しっぽの　ほのおも　ぶきの　ひとつ。
      ja: |-
        天井や　壁を　利用して
        空中殺法を　繰り出す。
        尻尾の　炎も　武器の　ひとつ。
      ko: |-
        천장이나 벽을 이용하여
        공중 내리찍기를 날린다.
        꼬리의 불꽃도 무기의 하나이다.
      en: |-
        It uses ceilings and walls to launch aerial attacks.
        Its fiery tail is but one weapon.
      fr: |-
        Il attaque en prenant appui sur les murs et les
        plafonds. Sa queue ardente n’est pas son seul atout.
      de: |-
        Es stürzt sich von Decken und Wänden auf Beute.
        Sein feuriger Schweif ist nur eine seiner Waffen.
      es: |-
        Utiliza techos y paredes para lanzar ataques aéreos.
        También emplea su cola ígnea como arma.
      it: |-
        Attacca la preda lanciandosi da soffitti e pareti.
        Le fiamme sulla coda sono solo una delle sue armi.
