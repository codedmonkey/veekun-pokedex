chespin:
  base_happiness: 70
  capture_rate: 45
  color: green
  egg_groups:
    - ground
  evolution_chain: chespin
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        ふだん　やわらかい　あたまの　トゲは
        ちからを　こめると　するどく　とがり
        いわをも　つらぬくほど　かたくなる。
      ja: |-
        普段　やわらかい　頭の　トゲは
        力を　こめると　鋭く　とがり
        岩をも　つらぬくほど　硬くなる。
      ko: |-
        머리의 가시는 평소에는 부드럽지만
        힘을 주면 뾰족하고 날카로워지며
        바위를 뚫어 버릴 정도로 단단해진다.
      en: |-
        The quills on its head are usually soft.
        When it flexes them, the points become
        so hard and sharp that they can pierce rock.
      fr: |-
        Lorsqu’il rassemble ses forces, les piquants souples
        qui recouvrent sa tête deviennent si durs et acérés
        qu’ils pourraient transpercer un rocher.
      de: |-
        Wenn es seine Kraft auf die sonst eher weichen
        Stacheln auf seinem Kopf konzentriert, werden
        diese robust genug, um damit Steine zu zertrümmern.
      es: |-
        Cuando acumula energía, las suaves púas de su
        cabeza se vuelven tan duras y afiladas que hasta
        pueden atravesar rocas.
      it: |-
        Può indurire le punte che ha sulla testa, di solito
        morbide, per farle diventare talmente affilate e
        appuntite da penetrare nella roccia.
    'y':
      ja-Hrkt: |-
        あたまと　せなかを　かたい　カラで
        おおわれているため　トラックが
        ぶつかってきても　へっちゃらだ。
      ja: |-
        頭と　背中を　硬い　樹木の　殻で
        覆われているため　トラックが
        ぶつかってきても　平気なのだ。
      ko: |-
        머리와 등이 단단한 껍데기로
        덮여 있기 때문에 트럭이
        부딪혀와도 아무렇지 않다.
      en: |-
        Such a thick shell of wood covers its head and back
        that even a direct hit from a truck wouldn’t faze it.
      fr: |-
        Sa tête et son dos sont recouverts d’une carapace
        tellement dure que même une collision avec
        un camion ne lui ferait rien.
      de: |-
        Sein Kopf und Rücken werden von einer harten Hülle
        bedeckt, die so robust ist, dass sie selbst einer
        Kollision mit einem LKW standhalten würde.
      es: |-
        La robusta coraza que le recubre la cabeza y la
        espalda lo protege de tal manera que podría
        chocar contra un camión y permanecer impasible.
      it: |-
        Ha schiena e testa coperte da un guscio talmente
        resistente che non farebbe una piega nemmeno se
        ci passasse sopra un tir.
    omega-ruby:
      ja-Hrkt: |-
        ふだん　やわらかい　あたまの　トゲは
