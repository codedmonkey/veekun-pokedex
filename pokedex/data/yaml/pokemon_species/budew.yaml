budew:
  base_happiness: 50
  capture_rate: 255
  color: green
  egg_groups:
    - no-eggs
  evolution_chain: roselia
  evolves_from: ~
  flavor_text:
    diamond:
      en: |-
        Over the winter, it closes its bud
        and endures the cold. In spring,
        the bud opens and releases pollen.
    pearl:
      en: |-
        It lives alongside clear ponds.
        It scatters pollen that induces
        harsh sneezing and runny noses.
    platinum:
      en: |-
        Sensitive to changing temperature,
        the bud is said to bloom when it
        feels the sun’s warm touch.
    heartgold:
      en: |-
        When it feels the sun’s warm touch,
        it opens its bud to release pollen.
        It lives alongside clear pools.
    soulsilver:
      en: |-
        When it feels the sun’s warm touch,
        it opens its bud to release pollen.
        It lives alongside clear pools.
    black:
      en: |-
        Sensitive to changing temperature,
        the bud is said to bloom when it
        feels the sun’s warm touch.
      fr: |-
        Il est sensible aux variations de
        température et on dit qu’il fleurit
        quand il sent la chaleur du soleil.
    white:
      en: |-
        Sensitive to changing temperature,
        the bud is said to bloom when it
        feels the sun’s warm touch.
      fr: |-
        Il est sensible aux variations de
        température et on dit qu’il fleurit
        quand il sent la chaleur du soleil.
    black-2:
      en: |-
        Sensitive to changing temperatures,
        the bud blooms when it’s warm,
        releasing toxic pollen.
    white-2:
      en: |-
        Sensitive to changing temperatures,
        the bud blooms when it’s warm,
        releasing toxic pollen.
    x:
      ja-Hrkt: |-
        あたたかい　ひざしを　あびると
        つぼみが　ひらき　かふんを　とばす。
        きれいな　みずの　ちかくが　すみか。
      ja: |-
        暖かい　日差しを　浴びると
        つぼみが　開き　花粉を　飛ばす。
        きれいな　水の　近くが　住処。
      ko: |-
        따뜻한 햇볕을 쬐면
        봉오리를 펴서 꽃가루를 날린다.
        깨끗한 물 가까이에 거처가 있다.
      en: |-
        When it feels the sun’s warm touch, it opens its bud
        to release pollen. It lives alongside clear pools.
      fr: |-
        Son bourgeon s’ouvre une fois gorgé de soleil et
        libère du pollen. Il vit près des sources d’eau pure.
      de: |-
        Bei Sonnenlicht öffnet es seine Knospe und gibt
        Pollen ab. Es lebt in der Nähe von sauberem Wasser.
      es: |-
        Vive cerca de aguas cristalinas. Su cabello se abre y
        esparce polen cuando le bañan los rayos del sol.
      it: |-
        I raggi del sole gli fanno schiudere la gemma e
        rilasciare polline. Fa la tana vicino a bei corsi d’acqua.
    'y':
      ja-Hrkt: |-
        ふゆの　あいだは　つぼみを　とざして
        さむさに　たえる。はるになると
        つぼみを　ひらき　かふんを　とばす。
      ja: |-
        冬の　あいだは　つぼみを　閉ざして
        寒さに　耐える。春になると
        つぼみを　開き　花粉を　飛ばす。
      ko: |-
        겨울 동안 봉오리를 닫고
        추위를 견딘다. 봄이 되면
        봉오리를 펴서 꽃가루를 날린다.
      en: |-
        Over the winter, it closes its bud and endures the
        cold. In spring, the bud opens and releases pollen.
      fr: |-
        En hiver, son bourgeon se referme pour résister au
        froid. Il s’ouvre au printemps et libère du pollen.
      de: |-
        Im Winter schließt es die Knospe. Im Frühjahr
        öffnet es die Knospe und gibt Pollen ab.
      es: |-
        En invierno cierra su capullo para protegerse del frío.
        En primavera, el capullo se abre y esparce polen.
      it: |-
        D’inverno chiude la sua gemma e resiste al freddo.
        In primavera la gemma si riapre e rilascia polline.
    omega-ruby:
      ja-Hrkt: |-
        あたたかい　ひざしを　あびると
        つぼみが　ひらき　かふんを　とばす。
        きれいな　みずの　ちかくが　すみか。
      ja: |-
        暖かい　日差しを　浴びると
        つぼみが　開き　花粉を　飛ばす。
        きれいな　水の　近くが　すみか。
      ko: |-
        따뜻한 햇볕을 쬐면
        봉오리를 펴서 꽃가루를 날린다.
        깨끗한 물 가까이에 거처가 있다.
      en: |-
        When it feels the sun’s warm touch, it opens its bud
        to release pollen. It lives alongside clear pools.
      fr: |-
        Son bourgeon s’ouvre une fois gorgé de soleil et libère
        du pollen. Il vit près des sources d’eau pure.
      de: |-
        Bei Sonnenlicht öffnet es seine Knospe und gibt Pollen ab.
        Es lebt in der Nähe von sauberem Wasser.
      es: |-
        Vive cerca de aguas cristalinas. Su cabello se abre y esparce
        polen cuando le bañan los rayos del sol.
      it: |-
        I raggi del sole gli fanno schiudere la gemma e rilasciare
        polline. Fa la tana vicino a bei corsi d’acqua.
    alpha-sapphire:
      ja-Hrkt: |-
        ふゆの　あいだは　つぼみを　とざして
        さむさに　たえる。はるになると
        つぼみを　ひらき　かふんを　とばす。
      ja: |-
        冬の　間は　つぼみを　閉ざして
        寒さに　耐える。春になると
        つぼみを　開き　花粉を　飛ばす。
      ko: |-
        겨울 동안 봉오리를 닫고
        추위를 견딘다. 봄이 되면
        봉오리를 펴서 꽃가루를 날린다.
      en: |-
        Over the winter, it closes its bud and endures the
        cold. In spring, the bud opens and releases pollen.
      fr: |-
        En hiver, son bourgeon se referme pour résister au froid.
        Il s’ouvre au printemps et libère du pollen.
      de: |-
        Im Winter schließt es die Knospe. Im Frühjahr öffnet es
        die Knospe und gibt Pollen ab.
      es: |-
        En invierno cierra su capullo para protegerse del frío.
        En primavera, el capullo se abre y esparce polen.
      it: |-
        D’inverno chiude la sua gemma e resiste al freddo.
        In primavera la gemma si riapre e rilascia polline.
    sword:
      ja-Hrkt: |-
        どくを　ふくんだ　かふんを　まく。
        きれいな　みずで　そだてるほど
        どくの　せいぶんは　たかまる。
      ja: |-
        毒を　含んだ　花粉を　まく。
        きれいな　水で　育てるほど
        毒の　成分は　高まる。
      ko: |-
        독을 품고 있는 꽃가루를 뿌린다.
        맑은 물을 줘서 키울수록
        독성은 더욱 강해진다.
      zh-Hant: |-
        會散佈帶有毒素的花粉。
        培育時所用的水越乾淨，
        所含有的毒性就越高。
      zh-Hans: |-
        会散布带有毒素的花粉。
        培育时所用的水越干净，
        所含有的毒性就越高。
      en: |-
        The pollen it releases contains poison. If this
        Pokémon is raised on clean water, the poison’s
        toxicity is increased.
      fr: |-
        Plus l’eau dont il se nourrit est pure, plus le niveau
        de toxicité du pollen qu’il répand est élevé.
      de: |-
        Es verstreut giftigen Pollen. Je sauberer das
        Wasser war, mit dem es gegossen wurde, desto
        stärker ist der Giftstoff.
      es: |-
        Conforme más pura y cristalina sea el agua de
        su entorno, más venenoso resulta el polen que
        esparce.
      it: |-
        Più pulita è l’acqua con cui è a contatto durante
        la crescita, più aumentano i componenti tossici
        del polline velenoso che sparge.
    shield:
      ja-Hrkt: |-
        きおんの　へんかに　びんかん。
        つぼみが　ひらきはじめたら
        はるの　おとずれは　もうすぐだ。
      ja: |-
        気温の　変化に　敏感。
        つぼみが　開きはじめたら
        春の　訪れは　もうすぐだ。
      ko: |-
        기온 변화에 민감하다.
        봉오리가 피기 시작하면
        곧 봄이 온다.
      zh-Hant: |-
        對氣溫的變化很敏感。
        當牠開始打開花苞，
        便是冬去春來之時。
      zh-Hans: |-
        对气温的变化很敏感。
        当它开始打开花苞，
        便是冬去春来之时。
      en: |-
        This Pokémon is highly sensitive to temperature
        changes. When its bud starts to open, that means
        spring is right around the corner.
      fr: |-
        Il est sensible aux variations de température.
        Quand son bourgeon commence à s’ouvrir,
        l’arrivée du printemps est imminente.
      de: |-
        Es hat ein feines Gespür für die kleinsten
        Temperaturveränderungen. Wenn sich seine
        Knospe öffnet, bricht bald der Frühling an.
      es: |-
        Es muy sensible a los cambios de temperatura.
        Anuncia la llegada inminente de la primavera
        cuando florece.
      it: |-
        È sensibile agli sbalzi di temperatura.
        Quando le sue gemme si schiudono
        è segno che la primavera è vicina.
