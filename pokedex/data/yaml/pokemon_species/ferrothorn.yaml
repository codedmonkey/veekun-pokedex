ferrothorn:
  base_happiness: 50
  capture_rate: 90
  color: gray
  egg_groups:
    - plant
    - mineral
  evolution_chain: ferroseed
  evolves_from: ferroseed
  flavor_text:
    black:
      en: |-
        It fights by swinging around its three
        spiky feelers. A hit from these steel
        spikes can reduce a boulder to rubble.
      fr: |-
        Il combat avec ses trois tentacules
        épineux. Un coup de ses épines d’acier
        peut briser en deux de gros rochers.
    white:
      en: |-
        They attach themselves to cave
        ceilings, firing steel spikes at targets
        passing beneath them.
      fr: |-
        Il s’accroche aux plafonds des grottes
        et attaque les proies qui passent en
        dessous avec ses épines d’acier.
    black-2:
      en: |-
        By swinging around its three
        spiky feelers and shooting spikes,
        it can obliterate an opponent.
    white-2:
      en: |-
        By swinging around its three
        spiky feelers and shooting spikes,
        it can obliterate an opponent.
    x:
      ja-Hrkt: |-
        ３ぼんの　しょくしゅを　たたきつけ
        さらに　トゲを　とばして　あいてを
        あとかたのこらず　ふんさいする。
      ja: |-
        ３本の　触手を　たたきつけ
        さらに　トゲを　飛ばして　相手を
        跡形残らず　粉砕する。
      ko: |-
        3개의 촉수를 세게 내리치고
        거기에 가시를 날려 상대를
        흔적도 없이 분쇄한다.
      en: |-
        By swinging around its three spiky feelers and
        shooting spikes, it can obliterate an opponent.
      fr: |-
        Il attaque grâce à ses trois tentacules épineux et
        lance des épines d’acier pour réduire ses ennemis
        en poussière.
      de: |-
        Es macht mit Gegnern kurzen Prozess, indem es mit
        seinen drei Schlingen auf sie eindrischt und Dornen
        auf sie abfeuert.
      es: |-
        Azota al enemigo con sus tres tentáculos y después
        dispara púas hasta que no deja ni rastro del rival.
      it: |-
        Fa a pezzi il nemico colpendolo prima con le sue
        tre antenne e poi sparandogli addosso i suoi aculei.
    'y':
      ja-Hrkt: |-
        ほらあなの　てんじょうに　はりつき
        したを　とおる　えものに　むかって
        てつの　トゲを　うちこみ　おそう。
      ja: |-
        洞穴の　天井に　はりつき
        下を　通る　獲物に　向かって
        鉄の　トゲを　打ちこみ　襲う。
      ko: |-
        동굴 천장에 달라붙어
        아래를 지나가는 먹이를 향해
        철 가시를 쏘며 덮친다.
      en: |-
        They attach themselves to cave ceilings, firing steel
        spikes at targets passing beneath them.
      fr: |-
        Il s’accroche aux plafonds des grottes et attaque
        les proies qui passent en dessous avec ses épines
        d’acier.
      de: |-
        Es setzt sich an der Decke von Höhlen fest und wirft
        seine dornengespickten Schlingen auf vorbeigehende
        Beute ab.
      es: |-
        Se pega al techo de cuevas y lanza púas de metal a
        todo el que pase por debajo de donde se encuentre.
      it: |-
        Si appende al soffitto delle grotte e attacca le prede
        che passano al di sotto lanciando i suoi aculei di ferro.
    omega-ruby:
      ja-Hrkt: |-
        ３ぼんの　しょくしゅを　たたきつけ
        さらに　トゲを　とばして　あいてを
        あとかたのこらず　ふんさいする。
      ja: |-
        ３本の　触手を　たたきつけ
        さらに　トゲを　飛ばして　相手を
        跡形残らず　粉砕する。
      ko: |-
        3개의 촉수를 세게 내리치고
        거기에 가시를 날려 상대를
        흔적도 없이 분쇄한다.
      en: |-
        By swinging around its three spiky feelers and
        shooting spikes, it can obliterate an opponent.
      fr: |-
        Il attaque grâce à ses trois tentacules épineux et lance
        des épines d’acier pour réduire ses ennemis en poussière.
      de: |-
        Es macht mit Gegnern kurzen Prozess, indem es mit seinen
        drei Schlingen auf sie eindrischt und Dornen auf sie abfeuert.
      es: |-
        Azota al enemigo con sus tres tentáculos y después dispara
        púas hasta que no deja ni rastro del rival.
      it: |-
        Fa a pezzi il nemico colpendolo prima con le sue tre antenne
        e poi sparandogli addosso i suoi aculei.
    alpha-sapphire:
      ja-Hrkt: |-
        ほらあなの　てんじょうに　はりつき
        したを　とおる　えものに　むかって
        てつの　トゲを　うちこみ　おそう。
      ja: |-
        洞穴の　天井に　はりつき
        下を　通る　獲物に　向かって
        鉄の　トゲを　打ちこみ　襲う。
      ko: |-
        동굴 천장에 달라붙어
        아래를 지나가는 먹이를 향해
        철 가시를 쏘며 덮친다.
      en: |-
        They attach themselves to cave ceilings, firing steel
        spikes at targets passing beneath them.
      fr: |-
        Il s’accroche aux plafonds des grottes et attaque les proies
        qui passent en dessous avec ses épines d’acier.
      de: |-
        Es setzt sich an der Decke von Höhlen fest und wirft seine
        dornengespickten Schlingen auf vorbeigehende Beute ab.
      es: |-
        Se pega al techo de cuevas y lanza púas de metal a todo el
        que pase por debajo de donde se encuentre.
      it: |-
        Si appende al soffitto delle grotte e attacca le prede che
        passano al di sotto lanciando i suoi aculei di ferro.
    sword:
      ja-Hrkt: |-
        トゲで　がんばんに　キズを　つけると
        しょくしゅの　せんたんを　あてて
        えいようを　きゅうしゅうする。
      ja: |-
        トゲで　岩盤に　キズを　つけると
        触手の　先端を　あてて
        栄養を　吸収する。
      ko: |-
        가시로 암반에 상처를 낸 다음
        촉수 끝을 이용해서
        영양분을 흡수한다.
      zh-Hant: |-
        用尖刺刺裂岩壁之後，
        牠會用觸手的尖端
        接觸裂縫吸收營養。
      zh-Hans: |-
        用尖刺刺裂岩壁之后，
        它会用触手的尖端
        接触裂缝吸收营养。
      en: |-
        This Pokémon scrapes its spikes across rocks,
        and then uses the tips of its feelers to absorb
        the nutrients it finds within the stone.
      fr: |-
        Il fissure la roche avec ses épines pour ensuite
        absorber les nutriments qui s’y trouvent grâce
        à l’extrémité de ses tentacules.
      de: |-
        Es kratzt mit seinen Dornen Kerben in Felswände
        und extrahiert dann mit den Dornenspitzen an
        seinen Schlingen Nährstoffe aus dem Gestein.
      es: |-
        Raya el lecho rocoso con las púas para luego
        absorber nutrientes con el extremo de los
        tentáculos.
      it: |-
        Scalfisce gli strati rocciosi con i suoi aculei
        e utilizza le estremità delle sue antenne per
        estrarne gli elementi di cui si nutre.
    shield:
      ja-Hrkt: |-
        はがねより　かたい　トゲを　もつ。
        しょくしゅの　トゲを　つきさし
        いわかべを　はって　いどうする。
      ja: |-
        鋼より　硬い　棘を　もつ。
        触手の　棘を　突き刺し
        岩壁を　這って　移動する。
      ko: |-
        강철보다 견고한 가시를 갖고 있다.
        촉수 가시를 찔러서
        바위 벽을 기어 다니며 이동한다.
      zh-Hant: |-
        擁有比鋼鐵還堅硬的尖刺。
        會利用觸手上的尖刺
        攀附在岩壁上移動。
      zh-Hans: |-
        拥有比钢铁还坚硬的尖刺。
        会利用触手上的尖刺
        攀附在岩壁上移动。
      en: |-
        Its spikes are harder than steel. This Pokémon
        crawls across rock walls by stabbing the spikes
        on its feelers into the stone.
      fr: |-
        Ses épines sont plus solides que l’acier.
        Il plante celles de ses tentacules dans les parois
        rocheuses pour se déplacer.
      de: |-
        Seine Dornen sind härter als Stahl. Es bewegt sich
        fort, indem es seine dornengespickten Schlingen
        in Felswänden verhakt und sich vorwärtszieht.
      es: |-
        Sus púas son más duras que el acero. Se aferra
        y desplaza por paredes rocosas usando las que
        tiene en los tentáculos como ganchos.
      it: |-
        I suoi aculei sono più duri dell’acciaio.
        Quelli che ha sulle antenne gli permettono di
        far presa sulle pareti rocciose per spostarsi.
