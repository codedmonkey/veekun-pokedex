amoonguss:
  base_happiness: 50
  capture_rate: 75
  color: white
  egg_groups:
    - plant
  evolution_chain: foongus
  evolves_from: foongus
  flavor_text:
    black:
      en: |-
        It lures prey close by dancing and
        waving its arm caps, which resemble
        Poké Balls, in a swaying motion.
      fr: |-
        Il danse en faisant tournoyer les
        coupoles en forme de Poké Ball de
        ses bras pour attirer ses proies.
    white:
      en: |-
        They show off their Poké Ball caps to
        lure prey, but very few Pokémon are
        fooled by this.
      fr: |-
        Il se sert de ses coupoles en forme de
        Poké Ball pour attirer ses proies, mais
        peu de Pokémon se laissent avoir.
    black-2:
      en: |-
        It moves the caps on both arms
        and does a dance to lure prey.
        It prefers damp places.
    white-2:
      en: |-
        It moves the caps on both arms
        and does a dance to lure prey.
        It prefers damp places.
    x:
      ja-Hrkt: |-
        モンスターボールの　カサを　みせつけ
        えものを　おびきよせようとするが
        だまされる　ポケモンは　すくない。
      ja: |-
        モンスターボールの　カサを　見せつけ
        獲物を　誘き寄せようとするが
        だまされる　ポケモンは　少ない。
      ko: |-
        몬스터볼 무늬의 삿갓을 보여주며
        먹이를 유인하려 하지만
        속아 넘어가는 포켓몬은 드물다.
      en: |-
        They show off their Poké Ball caps to lure prey,
        but very few Pokémon are fooled by this.
      fr: |-
        Il se sert de ses coupoles en forme de Poké Ball pour
        attirer ses proies, mais peu de Pokémon se laissent
        avoir.
      de: |-
        Um Beute anzulocken, bietet es seinen Hut feil,
        der einem Pokéball ähnelt. Doch kaum ein
        Pokémon fällt darauf herein.
      es: |-
        Aunque intenta pasar por parte superior de una
        Poké Ball para atraer a sus presas, consigue engañar
        a pocos.
      it: |-
        Cerca di attirare le prede esibendo un cappello a
        forma di Poké Ball, ma sono pochi i Pokémon che
        si fanno ingannare.
    'y':
      ja-Hrkt: |-
        りょううでの　モンスターボールに
        にた　カサを　ゆらゆらと　うごかして
        えものを　さそう　ダンスを　おどる。
      ja: |-
        両腕の　モンスターボールに　似た
        カサを　ゆらゆらと　動かして
        獲物を　誘う　ダンスを　踊る。
      ko: |-
        양팔의 몬스터볼을 닮은
        삿갓을 한들한들 흔들어
        먹이를 유인하는 춤을 춘다.
      en: |-
        It lures prey close by dancing and waving its
        arm caps, which resemble Poké Balls, in a
        swaying motion.
      fr: |-
        Il danse en faisant tournoyer les coupoles en forme
        de Poké Ball de ses bras pour attirer ses proies.
      de: |-
        Es lockt seine Beute an, indem es die Hüte in Form
        von Pokébällen an seinen Armen rüttelt und einen
        Tanz aufführt.
      es: |-
        Baila meciendo rítmicamente los dos brazos a modo
        de Poké Ball para hacer que sus presas se acerquen.
      it: |-
        Attira le sue prede con danze, durante le quali fa
        roteare i dischi simili a Poké Ball che porta sugli arti.
    omega-ruby:
      ja-Hrkt: |-
        モンスターボールの　カサを　みせつけ
        えものを　おびきよせようとするが
        だまされる　ポケモンは　すくない。
      ja: |-
        モンスターボールの　カサを　見せつけ
        獲物を　誘き寄せようとするが
        だまされる　ポケモンは　少ない。
      ko: |-
        몬스터볼 무늬의 삿갓을 보여주며
        먹이를 유인하려 하지만
        속아 넘어가는 포켓몬은 드물다.
      en: |-
        They show off their Poké Ball caps to lure prey,
        but very few Pokémon are fooled by this.
      fr: |-
        Il se sert de ses coupoles en forme de Poké Ball pour attirer
        ses proies, mais peu de Pokémon se laissent avoir.
      de: |-
        Um Beute anzulocken, bietet es seinen Hut feil, der einem
        Pokéball ähnelt. Doch kaum ein Pokémon fällt darauf herein.
      es: |-
        Aunque intenta pasar por parte superior de una Poké Ball para
        atraer a sus presas, consigue engañar a pocos.
      it: |-
        Cerca di attirare le prede esibendo un cappello a forma
        di Poké Ball, ma sono pochi i Pokémon che si fanno
        ingannare.
    alpha-sapphire:
      ja-Hrkt: |-
        りょううでの　モンスターボールに
        にた　カサを　ゆらゆらと　うごかして
        えものを　さそう　ダンスを　おどる。
      ja: |-
        両腕の　モンスターボールに　似た
        カサを　ゆらゆらと　動かして
        獲物を　誘う　ダンスを　踊る。
      ko: |-
        양팔의 몬스터볼을 닮은
        삿갓을 한들한들 흔들어
        먹이를 유인하는 춤을 춘다.
      en: |-
        It lures prey close by dancing and waving its
        arm caps, which resemble Poké Balls, in a
        swaying motion.
      fr: |-
        Il danse en faisant tournoyer les coupoles en forme
        de Poké Ball de ses bras pour attirer ses proies.
      de: |-
        Es lockt seine Beute an, indem es die Hüte in Form von
        Pokébällen an seinen Armen rüttelt und einen Tanz aufführt.
      es: |-
        Baila meciendo rítmicamente los dos brazos a modo de
        Poké Ball para hacer que sus presas se acerquen.
      it: |-
        Attira le sue prede con danze, durante le quali fa roteare
        i dischi simili a Poké Ball che porta sugli arti.
    sword:
      ja-Hrkt: |-
        どくの　ほうしを　ふきつける。
        はやく　あらいながさないと
        そこに　キノコが　はえてくるぞ。
      ja: |-
        毒の　胞子を　噴きつける。
        はやく　洗い流さないと
        そこに　キノコが　生えてくるぞ。
      ko: |-
        독 포자를 내뿜는다.
        빨리 씻어내지 않으면
        그곳에 버섯이 자라난다.
      zh-Hant: |-
        會噴出帶有毒性的孢子。
        如果不盡快洗掉的話，
        就會從那裡長出蘑菇來喔。
      zh-Hans: |-
        会喷出带毒的孢子。
        如果不马上把它洗掉，
        那里就会长出蘑菇来哦。
      en: |-
        This Pokémon puffs poisonous spores at its foes.
        If the spores aren’t washed off quickly, they’ll
        grow into mushrooms wherever they land.
      fr: |-
        Si l’on ne nettoie pas rapidement les spores
        empoisonnées qu’il répand, celles-ci donnent
        naissance à des champignons.
      de: |-
        Hutsassa versprüht Giftsporen. Wäscht man diese
        nicht sofort ab, wachsen dort, wo sie gelandet
        sind, Pilze.
      es: |-
        Expulsa esporas venenosas. Crecerán setas
        en cualquier superficie con la que entren en
        contacto si no se lava de inmediato.
      it: |-
        Sparge spore velenose. Se non vengono lavate
        via in fretta, nel luogo in cui si sono depositate
        cresceranno dei funghi.
    shield:
      ja-Hrkt: |-
        ふだんは　あんまり　うごかない。
        おちている　モンスターボールの
        そばで　ただじっと　している。
      ja: |-
        ふだんは　あんまり　動かない。
        落ちている　モンスターボールの
        そばで　ただじっと　している。
      ko: |-
        평상시에는 잘 움직이지 않는다.
        떨어져 있는 몬스터볼 옆에서
        그저 가만히 대기할 뿐이다.
      zh-Hant: |-
        平時不太會有動作。
        只是一動也不動地待在
        地上掉落的精靈球旁邊。
      zh-Hans: |-
        平常一般不太动。
        只是一动不动地待在
        掉落于地面的精灵球旁边。
      en: |-
        Amoonguss generally doesn’t move much. It
        tends to stand still near Poké Balls that have
        been dropped on the ground.
      fr: |-
        Ce Pokémon a tendance à très peu se déplacer.
        Quand il voit une Poké Ball abandonnée au sol,
        il reste immobile à côté.
      de: |-
        Die meiste Zeit über bewegt es sich kaum und
        steht einfach nur regungslos neben Pokébällen,
        die am Boden liegen.
      es: |-
        Por lo general no se mueve demasiado. Suele
        permanecer quieto al lado de Poké Balls que
        haya por el suelo.
      it: |-
        Generalmente non si muove molto. Di solito
        si limita a stare immobile vicino a qualche
        Poké Ball caduta.
