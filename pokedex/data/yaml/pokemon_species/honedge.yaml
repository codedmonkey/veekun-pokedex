honedge:
  base_happiness: 50
  capture_rate: 180
  color: brown
  egg_groups:
    - mineral
  evolution_chain: honedge
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        ししゃの　たましいが　こだいの
        つるぎに　やどって　うまれたらしい。
        ひとに　とりつき　いのちを　すう。
      ja: |-
        死者の　魂が　古代の　剣に
        宿って　生まれたらしい。
        人に　とりつき　命を　吸う。
      ko: |-
        죽은 자의 혼이 고대의
        검에 깃들어 태어났다고 한다.
        사람에게 씌어 생명을 빨아들인다.
      en: |-
        Apparently this Pokémon is born when a
        departed spirit inhabits a sword. It attaches itself
        to people and drinks their life force.
      fr: |-
        Ce Pokémon naît quand l’âme d’un défunt prend
        possession d’une épée ancienne. Il s’accroche aux
        humains pour absorber leur énergie vitale.
      de: |-
        Dieses Pokémon wird geboren, wenn die Seele eines
        Verstorbenen sich in einem Schwert festsetzt. Es heftet
        sich an Menschen und saugt deren Lebenskraft aus.
      es: |-
        Cuentan que este Pokémon nace cuando el espíritu de
        un difunto toma posesión de una espada antigua.
        Se aferra a las personas y absorbe su energía.
      it: |-
        Sembra sia nato quando uno spirito si impossessò
        di un’antica spada. Si lega agli esseri umani per
        assorbirne la forza vitale.
    'y':
      ja-Hrkt: |-
        つるぎの　つかを　にぎった　ひとの
        うでに　あおい　ぬのを　まきつけて
        たおれるまで　いのちを　すいとる。
      ja: |-
        剣の　柄を　握った　人の　腕に
        青い　布を　巻きつけて
        倒れるまで　命を　吸い取る。
      ko: |-
        검의 자루를 잡은 사람의
        팔에 파란 천을 감아서
        쓰러질 때까지 목숨을 빨아들인다.
      en: |-
        If anyone dares to grab its hilt, it wraps
        a blue cloth around that person’s arm and
        drains that person’s life energy completely.
      fr: |-
        Si quelqu’un s’aventure à l’empoigner, il enroule son
        étoffe bleue autour du bras de l’infortuné et aspire
        son énergie vitale jusqu’à ce que ce dernier s’écroule.
      de: |-
        Es wickelt ein blaues Tuch um den Arm von Menschen,
        die seinen Schwertgriff ergreifen, und absorbiert deren
        Lebensenergie, bis sie zusammenbrechen.
      es: |-
        Si alguien osa empuñarlo, se enrolla en el brazo del
        desafortunado con su paño azul y le absorbe toda la
        energía hasta que pierde el sentido.
      it: |-
        Avvolge il drappo blu attorno al braccio di chiunque
        si azzardi a impugnarne l’elsa e assorbe la sua energia
        fino a fargli perdere i sensi.
    omega-ruby:
      ja-Hrkt: |-
        ししゃの　たましいが　こだいの
        つるぎに　やどって　うまれたらしい。
        ひとに　とりつき　いのちを　すう。
      ja: |-
        死者の　魂が　古代の　剣に
        宿って　生まれたらしい。
        人に　とりつき　命を　吸う。
      ko: |-
        죽은 자의 혼이 고대의
        검에 깃들어 태어났다고 한다.
        사람에게 씌어 생명을 빨아들인다.
      en: |-
        Apparently this Pokémon is born when a
        departed spirit inhabits a sword. It attaches itself
        to people and drinks their life force.
      fr: |-
        Ce Pokémon naît quand l’âme d’un défunt prend possession
        d’une épée ancienne. Il s’accroche aux humains pour absorber
        leur énergie vitale.
      de: |-
        Dieses Pokémon wird geboren, wenn die Seele eines
        Verstorbenen sich in einem Schwert festsetzt. Es heftet
        sich an Menschen und saugt deren Lebenskraft aus.
      es: |-
        Cuentan que este Pokémon nace cuando el espíritu de un
        difunto toma posesión de una espada antigua. Se aferra a las
        personas y absorbe su energía.
      it: |-
        Sembra sia nato quando uno spirito si impossessò di un’antica
        spada. Si lega agli esseri umani per assorbirne la forza vitale.
    alpha-sapphire:
      ja-Hrkt: |-
        つるぎの　つかを　にぎった　ひとの
        うでに　あおい　ぬのを　まきつけて
        たおれるまで　いのちを　すいとる。
      ja: |-
        剣の　柄を　握った　人の　腕に
        青い　布を　巻きつけて
        倒れるまで　命を　吸い取る。
      ko: |-
        검의 자루를 잡은 사람의
        팔에 파란 천을 감아서
        쓰러질 때까지 목숨을 빨아들인다.
      en: |-
        If anyone dares to grab its hilt, it wraps
        a blue cloth around that person’s arm and
        drains that person’s life energy completely.
      fr: |-
        Si quelqu’un s’aventure à l’empoigner, il enroule son étoffe
        bleue autour du bras de l’infortuné et aspire son énergie vitale
        jusqu’à ce que ce dernier s’écroule.
      de: |-
        Es wickelt ein blaues Tuch um den Arm von Menschen,
        die seinen Schwertgriff ergreifen, und absorbiert deren
        Lebensenergie, bis sie zusammenbrechen.
      es: |-
        Si alguien osa empuñarlo, se enrolla en el brazo del
        desafortunado con su paño azul y le absorbe toda la energía
        hasta que pierde el sentido.
      it: |-
        Avvolge il drappo blu attorno al braccio di chiunque si azzardi
        a impugnarne l’elsa e assorbe la sua energia fino a fargli
        perdere i sensi.
    sword:
      ja-Hrkt: |-
        おおむかし　この　つるぎに　よって
        ころされた　にんげんの　たましいが
        ヒトツキの　たましいに　なっている。
      ja: |-
        大昔　この　剣に　よって
        殺された　人間の　魂が
        ヒトツキの　魂に　なっている。
      ko: |-
        먼 옛날에 이 검에 의해
        죽은 인간의 영혼이
        단칼빙의 영혼이 되었다.
      zh-Hant: |-
        很久以前因這把劍
        而喪命之人的靈魂
        成為了獨劍鞘的靈魂。
      zh-Hans: |-
        很久以前因这把剑
        而丧命之人的灵魂
        成为了独剑鞘的灵魂。
      en: |-
        Honedge’s soul once belonged to a person who
        was killed a long time ago by the sword that
        makes up Honedge’s body.
      fr: |-
        L’âme de Monorpale est celle d’un humain
        qui a été tué il y a fort longtemps, par la même
        lame qui forme maintenant son corps.
      de: |-
        Seine Seele ist die eines Menschen, der vor
        langer Zeit durch dieses Schwert getötet wurde.
      es: |-
        Su alma es la de un ser humano que poseyó la
        misma espada que lo abatió en tiempos remotos.
      it: |-
        La sua anima è quella di un essere umano ucciso
        tanto tempo fa dalla spada che ora forma
        il suo corpo.
    shield:
      ja-Hrkt: |-
        つるぎの　つばの　あおい　めだまが
        ヒトツキの　ほんたい。　ふるびた
        ぬので　ひとの　せいきを　すいとる。
      ja: |-
        剣の　鍔の　青い　目玉が
        ヒトツキの　本体。　古びた
        布で　人の　生気を　吸い取る。
      ko: |-
        검의 가드 부분에 있는 푸른 눈동자가
        단칼빙의 본체다. 낡은 천으로
        사람의 생기를 빨아들인다.
      zh-Hant: |-
        獨劍鞘護手上的
        藍色眼珠是牠的本體。
        會用陳舊的布吸取人類的精氣。
      zh-Hans: |-
        独剑鞘剑格上的
        蓝色眼珠是它的本体。
        会用陈旧的布吸取人类的精气。
      en: |-
        The blue eye on the sword’s handguard is the
        true body of Honedge. With its old cloth, it
        drains people’s lives away.
      fr: |-
        L’œil bleu sur la garde de la lame est le véritable
        corps de Monorpale. Il aspire l’énergie vitale
        des gens avec son étoffe usée par le temps.
      de: |-
        Das blaue Auge auf der Parierstange ist sein
        wahrer Körper. Mithilfe eines alten Tuchs
        absorbiert es die Lebenskraft von Menschen.
      es: |-
        El ojo azul de la empuñadura es su verdadero
        cuerpo. Absorbe la energía vital de las personas
        con su paño de aspecto andrajoso.
      it: |-
        L’occhio blu sull’elsa della spada è il suo
        vero corpo. Usa il drappo consunto per
        assorbire la forza vitale degli uomini.
