corviknight:
  base_happiness: 50
  capture_rate: 45
  color: purple
  egg_groups:
    - flying
  evolution_chain: rookidee
  evolves_from: corvisquire
  flavor_text:
    sword:
      ja-Hrkt: |-
        ガラルちほうの　そらでは　てきなし。
        くろびかりする　はがねの　すがたは
        あいてを　いあつし　おそれさせる。
      ja: |-
        ガラル地方の　空では　敵なし。
        黒光りする　鋼の　姿は
        相手を　威圧し　恐れさせる。
      ko: |-
        가라르지방의 하늘에는 적수가 없다.
        검고 윤이 나는 강철의 자태는
        상대에게 위압감을 주어 겁먹게 만든다.
      zh-Hant: |-
        在伽勒爾地區的空中所向無敵。
        牠那黑得發亮的鋼鐵之軀
        有著讓敵人畏懼的威懾力。
      zh-Hans: |-
        在伽勒尔地区的空中所向披靡。
        它那黑得发亮的钢铁之躯
        有着让敌人畏惧的威慑力。
      en: |-
        This Pokémon reigns supreme in the skies of the
        Galar region. The black luster of its steel body
        could drive terror into the heart of any foe.
      fr: |-
        Il n’a aucun rival dans le ciel de Galar.
        L’aspect intimidant de son corps d’acier noir
        et lustré inspire la crainte chez ses ennemis.
      de: |-
        Niemand wagt es, ihm den Himmel über Galar
        streitig zu machen. Sein schwarz glänzendes,
        stählernes Äußeres schüchtert jeden Gegner ein.
      es: |-
        No tiene rival en los cielos de Galar. El acero
        negro y lustroso de su cuerpo intimida a
        cualquier adversario.
      it: |-
        Nei cieli di Galar non ha rivali. La vista del suo
        corpo di acciaio nero e lucente intimorisce
        i suoi avversari.
    shield:
      ja-Hrkt: |-
        ひこう　のうりょくに　すぐれていて
        とても　かしこいため　ガラルちほうで
        そらの　タクシーとして　かつやく。
      ja: |-
        飛行能力に　優れていて
        とても　賢いため　ガラル地方で
        空の　タクシーとして　活躍。
      ko: |-
        비행 능력이 뛰어나고
        매우 영리해 가라르지방에서
        하늘의 택시로 활약한다.
      zh-Hant: |-
        擁有優秀飛行能力和
        極度聰明頭腦的牠在伽勒爾地區
        從事飛翔計程車的工作。
      zh-Hans: |-
        拥有优秀飞行能力和极度
        聪明头脑的它在伽勒尔地区
        从事飞翔出租车的工作。
      en: |-
        With their great intellect and flying skills, these
        Pokémon very successfully act as the Galar
        region’s airborne taxi service.
      fr: |-
        Grâce à son adresse remarquable en vol
        et sa grande intelligence, il travaille comme
        taxi volant de Galar.
      de: |-
        Aufgrund seiner unübertroffenen Flugfertigkeiten
        und seiner hohen Intelligenz ist es in der
        Galar-Region als Flugtaxi im Einsatz.
      es: |-
        Debido a su excelente capacidad de vuelo y a su
        gran inteligencia, ejerce de taxi volador en Galar.
      it: |-
        È dotato di eccellenti capacità di volo e di
        grande intelligenza. Nella regione di Galar si
        rende utile come taxi del cielo.
