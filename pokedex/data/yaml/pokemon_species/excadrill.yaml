excadrill:
  base_happiness: 50
  capture_rate: 60
  color: gray
  egg_groups:
    - ground
  evolution_chain: drilbur
  evolves_from: drilbur
  flavor_text:
    black:
      en: |-
        It can help in tunnel construction.
        Its drill has evolved into steel strong
        enough to bore through iron plates.
      fr: |-
        Ses vrilles en acier peuvent transpercer
        des poutres en fer. Il est très employé
        dans la construction de tunnels.
    white:
      en: |-
        More than 300 feet below the surface,
        they build mazelike nests. Their activity
        can be destructive to subway tunnels.
      fr: |-
        Il se creuse des terriers labyrinthiques
        à 100 m sous terre. Il lui arrive de
        percer les galeries du métro.
    black-2:
      en: |-
        Forming a drill with its steel claws
        and head, it can bore through a steel
        plate, no matter how thick it is.
    white-2:
      en: |-
        Forming a drill with its steel claws
        and head, it can bore through a steel
        plate, no matter how thick it is.
    x:
      ja-Hrkt: |-
        はがねに　しんかした　ドリルは
        てっぱんを　つらぬく　はかいりょく。
        トンネルこうじで　だいかつやくする。
      ja: |-
        鋼に　進化した　ドリルは
        鉄板を　つらぬく　破壊力。
        トンネル工事で　大活躍する。
      ko: |-
        강철로 진화한 드릴은
        철판을 뚫는 파괴력을 가졌다.
        터널 공사에서 크게 활약한다.
      en: |-
        It can help in tunnel construction. Its drill has
        evolved into steel strong enough to bore through
        iron plates.
      fr: |-
        Ses vrilles en acier peuvent transpercer des poutres
        en fer. Il est très employé dans la construction de
        tunnels.
      de: |-
        Seine zu Stahl weiterentwickelten Bohrer kriegen
        selbst Eisenplatten klein. Im Tunnelbau ist es ein
        absolutes Ass.
      es: |-
        Su taladro ha evolucionado y es capaz de atravesar
        una lámina de hierro. Es muy útil para construir
        túneles.
      it: |-
        La trivella si è evoluta diventando d’acciaio e può
        perforare una lastra di ferro. È molto utile per
        scavare tunnel.
    'y':
      ja-Hrkt: |-
        ちか　１００メートルに　めいろの
        ような　すあなを　つくる。ちかてつの
        トンネルに　あなを　あけてしまう。
      ja: |-
        地下　１００メートルに　迷路の
        ような　巣穴を　作る。地下鉄の
        トンネルに　穴を　開けてしまう。
      ko: |-
        땅 밑 100m에 미로 같은
        굴을 만든다. 지하철
        터널에 구멍을 뚫어 버린다.
      en: |-
        More than 300 feet below the surface, they build
        mazelike nests. Their activity can be destructive to
        subway tunnels.
      fr: |-
        Il se creuse des terriers labyrinthiques à 100 m sous
        terre. Il lui arrive de percer les galeries du métro.
      de: |-
        Sein verworrener Bau liegt 100 m tief unter der Erde.
        Gelegentlich gräbt es auch U-Bahn-Schächte an.
      es: |-
        Construye madrigueras laberínticas a 100 m bajo
        tierra. A veces abre agujeros en los túneles de metro.
      it: |-
        Costruisce una tana simile a un labirinto 100 m sotto
        terra. A volte apre buchi nei tunnel della metropolitana.
    omega-ruby:
      ja-Hrkt: |-
        はがねに　しんかした　ドリルは
        てっぱんを　つらぬく　はかいりょく。
        トンネルこうじで　だいかつやくする。
      ja: |-
        鋼に　進化した　ドリルは
        鉄板を　つらぬく　破壊力。
        トンネル工事で　大活躍する。
      ko: |-
        강철로 진화한 드릴은
        철판을 뚫는 파괴력을 가졌다.
        터널 공사에서 크게 활약한다.
      en: |-
        It can help in tunnel construction. Its drill has
        evolved into steel strong enough to bore through
        iron plates.
      fr: |-
        Ses vrilles en acier peuvent transpercer des poutres en fer.
        Il est très employé dans la construction de tunnels.
      de: |-
        Seine zu Stahl weiterentwickelten Bohrer kriegen selbst
        Eisenplatten klein. Im Tunnelbau ist es ein absolutes Ass.
      es: |-
        Su taladro ha evolucionado y es capaz de atravesar una
        lámina de hierro. Es muy útil para construir túneles.
      it: |-
        La trivella si è evoluta diventando d’acciaio e può perforare
        una lastra di ferro. È molto utile per scavare tunnel.
    alpha-sapphire:
      ja-Hrkt: |-
        ちか　１００メートルに　めいろの
        ような　すあなを　つくる。ちかてつの
        トンネルに　あなを　あけてしまう。
      ja: |-
        地下　１００メートルに　迷路の
        ような　巣穴を　作る。地下鉄の
        トンネルに　穴を　開けてしまう。
      ko: |-
        땅 밑 100m에 미로 같은
        굴을 만든다. 지하철
        터널에 구멍을 뚫어 버린다.
      en: |-
        More than 300 feet below the surface, they build
        mazelike nests. Their activity can be destructive to
        subway tunnels.
      fr: |-
        Il se creuse des terriers labyrinthiques à 100 m sous terre.
        Il lui arrive de percer les galeries du métro.
      de: |-
        Sein verworrener Bau liegt 100 m tief unter der Erde.
        Gelegentlich gräbt es auch U-Bahn-Schächte an.
      es: |-
        Construye madrigueras laberínticas a 100 m bajo tierra.
        A veces abre agujeros en los túneles de metro.
      it: |-
        Costruisce una tana simile a un labirinto 100 m sotto terra.
        A volte apre buchi nei tunnel della metropolitana.
    sword:
      ja-Hrkt: |-
        しぜんの　どうくつに　みえても
        ドリュウズが　ほりあらした　あとと
        いうことも　よくある　はなしだ。
      ja: |-
        自然の　洞窟に　見えても
        ドリュウズが　掘り荒らした　跡と
        いうことも　よくある　話だ。
      ko: |-
        자연적으로 생긴 동굴로 보이지만
        사실은 몰드류가 파낸 흔적인
        경우는 흔히 있는 일이다.
      zh-Hant: |-
        有許多看似自然形成的
        洞窟其實都是龍頭地鼠
        一陣亂鑽之後留下來的。
      zh-Hans: |-
        有许多看似自然形成的
        洞窟其实都是龙头地鼠
        一阵乱钻之后留下来的。
      en: |-
        It’s not uncommon for tunnels that appear to
        have formed naturally to actually be a result
        of Excadrill’s rampant digging.
      fr: |-
        On confond souvent les cavernes creusées
        par les Minotaupe avec des grottes naturelles.
      de: |-
        Viele Tunnel, die aussehen, als wären sie natürlich
        entstanden, gehen wohl eigentlich auf Stalobor
        zurück, die sich durch die Erde gegraben haben.
      es: |-
        Se dice que muchas grutas que parecen naturales
        han sido en realidad horadadas por los Excadrill.
      it: |-
        Si dice che le grotte all’apparenza naturali siano
        in realtà spesso il risultato degli scavi forsennati
        effettuati da Excadrill.
    shield:
      ja-Hrkt: |-
        べつめい　ドリルキング。
        ちちゅうを　ほりすすむ　そくどは
        じそく１５０キロに　たっする。
      ja: |-
        別名　ドリルキング。
        地中を　掘り進む　速度は
        時速１５０キロに　達する。
      ko: |-
        별명은 드릴킹이다.
        땅속을 파는 속도는
        시속 150km에 달한다.
      zh-Hant: |-
        別名鑽頭王。在地底下
        挖掘前進的速度
        高達每小時１５０公里。
      zh-Hans: |-
        别名钻头王。在地底下
        挖掘前进的速度
        达到了每小时１５０公里。
      en: |-
        Known as the Drill King, this Pokémon can
        tunnel through the terrain at speeds of over
        90 mph.
      fr: |-
        On l’appelle le « roi de la vrille ». Il creuse la terre
        à une vitesse pouvant atteindre 150 km/h.
      de: |-
        Es wird auch der „Bohrkönig“ genannt. Bei seinen
        Bohrmanövern im Erdreich erreicht es eine
        Spitzengeschwindigkeit von 150 km/h.
      es: |-
        Se lo conoce como el Rey del Taladro. Puede
        horadar túneles bajo tierra a una velocidad de
        150 km/h.
      it: |-
        Conosciuto anche come “re delle trivelle”,
        questo Pokémon è capace di scavare sottoterra
        a una velocità di 150 km/h.
