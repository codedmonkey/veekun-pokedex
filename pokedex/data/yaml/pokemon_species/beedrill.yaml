    lets-go-pikachu:
      ja-Hrkt: |-
        りょうてと　おしりにある　３ぼんの
        どくバリで　あいてを　さして
        さして　さしまくって　こうげきする。
      ja: |-
        両手と　お尻にある　３本の
        毒バリで　相手を　刺して
        刺して　刺しまくって　攻撃する。
      ko: |-
        양손과 엉덩이에 있는 3개의
        독침으로 상대를 찌르고 찌르고
        또 찌르며 공격한다.
      zh-Hant: |-
        會用雙手和屁股上的
        ３根毒針不斷猛刺
        來攻擊對手。
      zh-Hans: |-
        它会用双手和
        尾部的３根毒针
        反复刺伤敌人。
      en: |-
        It has three poisonous stingers on its
        forelegs and its tail. They are used to jab
        its enemy repeatedly.
      fr: |-
        Il se sert de ses trois aiguillons empoisonnés
        situés sur les pattes avant et l’abdomen pour
        attaquer sans relâche ses adversaires.
      de: |-
        Es verfügt über insgesamt drei Giftstachel,
        zwei an den Armen und einen am Hinterleib,
        mit denen es seine Gegner wiederholt angreift.
      es: |-
        Tiene tres aguijones venenosos, dos en las patas
        anteriores y uno en la parte baja del abdomen,
        con los que ataca a sus enemigos una y otra vez.
      it: |-
        Possiede tre aculei velenosi, due sulle zampe
        anteriori e uno sull’addome, con cui punge
        ripetutamente i nemici.
