throh:
  base_happiness: 50
  capture_rate: 45
  color: red
  egg_groups:
    - humanshape
  evolution_chain: throh
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        When it tightens its belt, it becomes
        stronger. Wild Throh use vines to weave
        their own belts.
      fr: |-
        Quand il noue sa ceinture, il devient
        plus puissant. Les Judokrak sauvages
        tressent leur ceinture avec des lianes.
    white:
      en: |-
        When they encounter foes bigger than
        themselves, they try to throw them.
        They always travel in packs of five.
      fr: |-
        Ils aiment projeter ceux qui sont plus
        grands qu’eux. On les trouve toujours
        par groupes de cinq.
    black-2:
      en: |-
        When it encounters a foe bigger than
        itself, it wants to throw it.
        It changes belts as it gets stronger.
    white-2:
      en: |-
        When it encounters a foe bigger than
        itself, it wants to throw it.
        It changes belts as it gets stronger.
    x:
      ja-Hrkt: |-
        おびを　しめると　パワーアップする。
        やせいの　ナゲキは　つるくさを
        あんで　じぶんの　おびを　つくる。
      ja: |-
        帯を　締めると　パワーアップする。
        野生の　ナゲキは　つる草を　編んで
        自分の　帯を　作る。
      ko: |-
        끈을 매면 파워가 올라간다.
        야생 던지미는 덩굴풀을 엮어
        자신의 띠를 만든다.
      en: |-
        When it tightens its belt, it becomes stronger. Wild
        Throh use vines to weave their own belts.
      fr: |-
        Quand il noue sa ceinture, il devient plus puissant.
        Les Judokrak sauvages tressent leur ceinture avec
        des lianes.
      de: |-
        Zurrt es seinen Gürtel fest, gewinnt es an Kraft.
        Wilde Exemplare flechten sich ihren Gürtel
        in Handarbeit aus Ranken.
      es: |-
        Aumenta su potencia si se aprieta el cinturón. Un
        Throh salvaje teje su propio cinturón usando lianas.
      it: |-
        La cintura da karate lo rende più forte. I Throh
        selvatici si costruiscono le cinture usando piante
        rampicanti.
    'y':
      ja-Hrkt: |-
        じぶんより　おおきな　あいてと
        であうと　むしょうに　なげたくなる。
        つよくなると　おびを　とりかえる。
      ja: |-
        自分より　大きな　相手と
        出会うと　無性に　投げたくなる。
        強くなると　帯を　取り替える。
      ko: |-
        자신보다 큰 상대와 만나면
        이유 없이 내던지고 싶어 한다.
        강해지면 띠를 바꾼다.
      en: |-
        When it encounters a foe bigger than itself, it wants
        to throw it. It changes belts as it gets stronger.
      fr: |-
        Ils aiment projeter ceux qui sont plus grands qu’eux.
        Ils changent de ceinture quand ils progressent.
      de: |-
        Trifft es jemanden, der größer ist als es selbst,
        will es ihn unbedingt werfen. Wird es stärker,
        wechselt es den Gürtel.
      es: |-
        Si se topa con un rival más fuerte, ansía lanzarlo por
        los aires. Al hacerse más fuerte, cambia su cinturón.
      it: |-
        Quando incontra un avversario più grande di lui, lo
        assale l’istinto di lanciarlo via. Cambia cintura quando
        diventa più forte.
    omega-ruby:
      ja-Hrkt: |-
        おびを　しめると　パワーアップする。
        やせいの　ナゲキは　つるくさを
        あんで　じぶんの　おびを　つくる。
      ja: |-
        帯を　締めると　パワーアップする。
        野生の　ナゲキは　つる草を　編んで
        自分の　帯を　作る。
      ko: |-
        띠를 매면 파워가 올라간다.
        야생 던지미는 덩굴풀을 엮어
        자신의 띠를 만든다.
      en: |-
        When it tightens its belt, it becomes stronger. Wild
        Throh use vines to weave their own belts.
      fr: |-
        Quand il noue sa ceinture, il devient plus puissant.
        Les Judokrak sauvages tressent leur ceinture avec des lianes.
      de: |-
        Zurrt es seinen Gürtel fest, gewinnt es an Kraft. Wilde
        Exemplare flechten sich ihren Gürtel in Handarbeit aus Ranken.
      es: |-
        Aumenta su potencia si se aprieta el cinturón. Un Throh
        salvaje teje su propio cinturón usando lianas.
      it: |-
        La cintura da karate lo rende più forte. I Throh selvatici
        si costruiscono le cinture usando piante rampicanti.
    alpha-sapphire:
      ja-Hrkt: |-
        じぶんより　おおきな　あいてと
        であうと　むしょうに　なげたくなる。
        つよくなると　おびを　とりかえる。
      ja: |-
        自分より　大きな　相手と
        出会うと　無性に　投げたくなる。
        強くなると　帯を　取り替える。
      ko: |-
        자신보다 큰 상대와 만나면
        이유 없이 내던지고 싶어 한다.
        강해지면 띠를 바꾼다.
      en: |-
        When it encounters a foe bigger than itself, it wants
        to throw it. It changes belts as it gets stronger.
      fr: |-
        Ils aiment projeter ceux qui sont plus grands qu’eux.
        Ils changent de ceinture quand ils progressent.
      de: |-
        Trifft es jemanden, der größer ist als es selbst, will es ihn
        unbedingt werfen. Wird es stärker, wechselt es den Gürtel.
      es: |-
        Si se topa con un rival más fuerte, ansía lanzarlo por los aires.
        Al hacerse más fuerte, cambia su cinturón.
      it: |-
        Quando incontra un avversario più grande di lui, lo assale
        l’istinto di lanciarlo via. Cambia cintura quando diventa
        più forte.
    sword:
      ja-Hrkt: |-
        なげわざの　うでは　いちりゅう。
        たたかいで　かいた　あせが　しみ
        おびの　いろが　こく　そまっていく。
      ja: |-
        投げ技の　腕は　一流。
        戦いで　かいた　汗が　染み
        帯の　色が　濃く　染まっていく。
      ko: |-
        메치는 기술의 실력은 일류다.
        싸움으로 흘린 땀이 배어
        띠의 색이 진해져 간다.
      zh-Hant: |-
        能使出一流的投摔招式。
        帶子被戰鬥時流下的汗水
        浸濕，顏色越變越深。
      zh-Hans: |-
        能使出一流的投摔招式。
        带子被战斗时流下的汗水
        浸湿，颜色越变越深。
      en: |-
        It performs throwing moves with first-rate skill.
        Over the course of many battles, Throh’s belt
        grows darker as it absorbs its wearer’s sweat.
      fr: |-
        Ses techniques de projection sont sans égal.
        Quand il se bat, sa sueur coule sur sa ceinture
        et lui donne une teinte plus foncée.
      de: |-
        Es verfügt über ein exzellentes Repertoire an
        Wurftechniken. Sein Gürtel färbt sich dunkler,
        je mehr Schweiß er bei Kämpfen in sich aufsaugt.
      es: |-
        Su técnica de lanzamiento es formidable. El
        sudor que exhala durante el combate impregna
        su cinturón, cuyo color se vuelve más intenso.
      it: |-
        È molto bravo nelle tecniche di lancio.
        Il sudore prodotto durante la lotta impregna
        la sua cintura da karate e la rende più scura.
    shield:
      ja-Hrkt: |-
        ５ひきの　むれで　けいこに　はげむ。
        けいこに　ついていけない　ものは
        おびを　すてて　むれを　さる。
      ja: |-
        ５匹の　群れで　稽古に　はげむ。
        稽古に　ついていけない　ものは
        帯を　捨てて　群れを　去る。
      ko: |-
        5마리의 무리가 수련한다.
        수련에 뒤떨어지면
        띠를 버리고 무리를 떠난다.
      zh-Hant: |-
        ５隻一組一起努力練習。
        在練習中掉隊的投摔鬼
        會扔掉帶子離開團隊。
      zh-Hans: |-
        ５只一组一起努力练习。
        在练习中掉队的投摔鬼
        会扔掉带子离开团队。
      en: |-
        They train in groups of five. Any member that
        can’t keep up will discard its belt and leave
        the group.
      fr: |-
        Ils s’entraînent intensément par groupes de cinq.
        Ceux qui ne peuvent pas suivre le rythme
        abandonnent leur ceinture et se retirent.
      de: |-
        Es trainiert stets in Fünferrudeln. Wer beim
        Training nicht mithalten kann, entledigt sich
        seines Gürtels und verlässt das Rudel.
      es: |-
        Entrenan en grupos de cinco individuos. Si alguno
        es incapaz de seguir el ritmo, arroja el cinturón y
        abandona la cuadrilla.
      it: |-
        Si allenano in gruppi di cinque. Se uno di loro
        non riesce a stare al passo con l’allenamento,
        getta via la cintura e abbandona il gruppo.
