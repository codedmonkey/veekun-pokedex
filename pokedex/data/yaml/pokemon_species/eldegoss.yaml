eldegoss:
  base_happiness: 50
  capture_rate: 75
  color: green
  egg_groups:
    - plant
  evolution_chain: gossifleur
  evolves_from: gossifleur
  flavor_text:
    sword:
      ja-Hrkt: |-
        わたげの　タネは　えいようまんてん。
        かぜに　のせて　とばして　くさきや
        ポケモンたちを　げんきにさせる。
      ja: |-
        綿毛の　種は　栄養満点。
        風に　乗せて　飛ばして　草木や
        ポケモンたちを　元気にさせる。
      ko: |-
        솜털이 붙은 씨는 영양 만점이다.
        씨를 바람에 날려서 초목과
        포켓몬들을 건강하게 만든다.
      zh-Hant: |-
        棉絮的種子營養豐富。
        牠會藉由風散播種子，
        讓草木和寶可夢變得活力十足。
      zh-Hans: |-
        棉絮的种子营养丰富。
        它会通过风散播种子，
        让草木和宝可梦变得活力十足。
      en: |-
        The seeds attached to its cotton fluff are full of
        nutrients. It spreads them on the wind so that
        plants and other Pokémon can benefit from them.
      fr: |-
        Les graines de son duvet sont remplies
        de nutriments. Elles sont emportées par le vent
        et redonnent vitalité aux plantes et aux Pokémon.
      de: |-
        Die Saat seines Wollflaums steckt voller
        Nährstoffe. Es verstreut sie im Wind und heilt
        damit Pflanzen und Pokémon.
      es: |-
        Las semillas que tiene entre la pelusa son muy
        nutritivas. Arrastradas por el viento, devuelven
        la vitalidad a la flora y a otros Pokémon.
      it: |-
        I suoi semi lanuginosi, ricchi di sostanze nutritive,
        vengono trasportati dal vento e donano nuova
        energia a piante e Pokémon.
    shield:
      ja-Hrkt: |-
        あたまの　わたげで　つくった　いとは
        こうたくがあり　とても　うつくしい。
        ガラルちほうの　めいさんひん。
      ja: |-
        頭の　綿毛で　つくった　糸は
        光沢があり　とても　美しい。
        ガラル地方の　名産品。
      ko: |-
        머리의 솜털로 만든 실은
        윤이 나고 매우 아름답다.
        가라르지방의 특산품이다.
      zh-Hant: |-
        用牠頭上的棉絮製成的線
        有著十分美麗動人的光澤，
        是伽勒爾地區的名產。
      zh-Hans: |-
        用它头上的棉絮制成的线
        有着十分美丽动人的光泽，
        是伽勒尔地区的名产。
      en: |-
        The cotton on the head of this Pokémon can be
        spun into a glossy, gorgeous yarn—a Galar
        regional specialty.
      fr: |-
        Les fils tissés à partir du duvet sur sa tête sont
        satinés et absolument somptueux. Le textile ainsi
        créé est typique de la région de Galar.
      de: |-
        Aus dem Flaum auf seinem Kopf werden
        wunderschöne, glänzende Fäden gesponnen.
        Die Galar-Region ist bekannt für dieses Produkt.
      es: |-
        El hilo fabricado a partir de su algodón es muy
        bello y brillante; uno de los productos estrella
        de la región de Galar.
      it: |-
        I fili realizzati con la lanugine del suo capo sono
        particolarmente belli e lucenti. Sono un prodotto
        tipico di Galar.
