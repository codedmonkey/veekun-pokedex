    diamond:
      en: |-
        It is shrouded by blue vines.
        No one has seen the face hidden
        behind this growth of vines.
    pearl:
      en: |-
        It is shrouded by blue vines.
        No one has seen the face hidden
        behind this growth of vines.
    platinum:
      en: |-
        The blue vines shrouding its body
        are covered in a growth of fine
        hair. It is known to be ticklish.
    heartgold:
      en: |-
        The vines that cloak its entire
        body are always jiggling.
        They effectively unnerve its foes.
    soulsilver:
      en: |-
        It tangles any moving thing with
        its vines. Their subtle shaking
        is ticklish if you get ensnared.
    black:
      en: |-
        The blue vines shrouding its body
        are covered in a growth of fine
        hair. It is known to be ticklish.
      fr: |-
        Il se cache derrière des lianes
        bleues recouvertes d’un fin duvet.
        Il est chatouilleux.
    white:
      en: |-
        The blue vines shrouding its body
        are covered in a growth of fine
        hair. It is known to be ticklish.
      fr: |-
        Il se cache derrière des lianes
        bleues recouvertes d’un fin duvet.
        Il est chatouilleux.
    black-2:
      en: |-
        Many writhing vines cover it,
        so its true identity remains unknown.
        The blue vines grow its whole life long.
    white-2:
      en: |-
        Many writhing vines cover it,
        so its true identity remains unknown.
        The blue vines grow its whole life long.
    x:
      ja-Hrkt: |-
        たくさんの　うごめく　ツルに
        おおわれて　しょうたいふめい。
        あおいツルは　いっしょう　のびる。
      ja: |-
        たくさんの　うごめく　ツルに
        覆われて　正体不明。
        青いツルは　一生　伸びる。
      ko: |-
        수많은 움직이는 덩굴에
        둘러싸여 정체불명이다.
        파란 덩굴은 평생 자란다.
      en: |-
        Many writhing vines cover it, so its true identity
        remains unknown. The blue vines grow its whole
        life long.
      fr: |-
        Ses lianes s’allongent au fil du temps.
        Elles recouvrent tout son corps, dont on ignore
        la véritable forme.
      de: |-
        Aufgrund der Ranken, die seinen Körper bedecken,
        kennt keiner seine wahre Form. Die blauen Ranken
        wachsen immer weiter.
      es: |-
        Se camufla con la multitud de lianas que envuelven su
        cuerpo y que no dejan de crecer a lo largo de toda su
        vida.
      it: |-
        Una moltitudine di liane brulicanti, in crescita perenne,
        ne ricopre il corpo celandone la vera forma.
    'y':
      ja-Hrkt: |-
        うごくものに　ツルを　からめる。
        ツルは　びみょうに　ゆれているので
        からみつかれると　くすぐったい。
      ja: |-
        動くものに　ツルを　絡める。
        ツルは　微妙に　揺れているので
        絡みつかれると　くすぐったい。
      ko: |-
        움직이는 것에 덩굴을 감는다.
        덩굴은 미묘하게 흔들리기 때문에
        휘감기면 간지럽다.
      en: |-
        It tangles any moving thing with its vines. Their
        subtle shaking is ticklish if you get ensnared.
      fr: |-
        Il paralyse tout ce qui bouge avec ses lianes.
        Elles vous chatouillent si vous êtes capturé.
      de: |-
        Es berührt alles, was sich bewegt, mit seinen Ranken.
        Diese Berührungen kitzeln sehr.
      es: |-
        Enreda cualquier cosa que se mueva con sus lianas. Si
        te atrapa, te hará cosquillas con su delicado balanceo.
      it: |-
        Intrappola nelle liane qualsiasi cosa si muova. Il lieve
        movimento di queste può fare il solletico.
    omega-ruby:
      ja-Hrkt: |-
        てきに　つかまれると　ツルは　ぷちっと　きれる。
        ぜんぜん　いたくないので　その　スキに　にげる。
        よくじつには　あたらしい　ツルが　はえそろうぞ。
      ja: |-
        敵に　つかまれると　ツルは　ぷちっと　切れる。
        全然　痛くないので　その　スキに　逃げる。
        翌日には　新しい　ツルが　生えそろうぞ。
      ko: |-
        적에게 붙잡히면 덩굴이 뚝 하고 끊긴다.
        전혀 아프지 않기 때문에 그 틈에 도망간다.
        다음 날에는 새로운 덩굴이 자란다.
      en: |-
        Tangela’s vines snap off easily if they are grabbed.
        This happens without pain, allowing it to make a quick
        getaway. The lost vines are replaced by newly grown vines the
        very next day.
      fr: |-
        Les lianes de Saquedeneu se brisent facilement lorsqu’on
        les attrape. Cela ne lui fait pas mal et lui permet simplement
        de s’échapper rapidement. Les lianes cassées repoussent
        le lendemain.
      de: |-
        Wenn man Tangelas Ranken berührt, fallen diese sofort ab.
        Das tut ihm aber nicht weh und es kann sich schnell in
        Sicherheit bringen. Verliert es Ranken, werden diese am
        nächsten Tag durch neue ersetzt.
      es: |-
        A Tangela se le desprenden los tentáculos con facilidad en
        cuanto se los agarras. Y no solo no le duele, sino que le
        resulta muy útil para escapar rápido. Además, al día siguiente
        le crecen otros.
      it: |-
        Se afferrate, le liane di Tangela si staccano con facilità,
        ma in modo indolore, consentendo così una pratica
        scappatoia. Le liane cadute vengono sostituite da quelle
        nuove il giorno dopo.
    alpha-sapphire:
      ja-Hrkt: |-
        てきに　つかまれると　ツルは　ぷちっと　きれる。
        ぜんぜん　いたくないので　その　スキに　にげる。
        よくじつには　あたらしい　ツルが　はえそろうぞ。
      ja: |-
        敵に　つかまれると　ツルは　ぷちっと　切れる。
        全然　痛くないので　その　スキに　逃げる。
        翌日には　新しい　ツルが　生えそろうぞ。
      ko: |-
        적에게 붙잡히면 덩굴이 뚝 하고 끊긴다.
        전혀 아프지 않기 때문에 그 틈에 도망간다.
        다음 날에는 새로운 덩굴이 자란다.
      en: |-
        Tangela’s vines snap off easily if they are grabbed. This
        happens without pain, allowing it to make a quick getaway.
        The lost vines are replaced by newly grown vines the very
        next day.
      fr: |-
        Les lianes de Saquedeneu se brisent facilement lorsqu’on
        les attrape. Cela ne lui fait pas mal et lui permet simplement
        de s’échapper rapidement. Les lianes cassées repoussent
        le lendemain.
      de: |-
        Wenn man Tangelas Ranken berührt, fallen diese oft ab.
        Dabei empfindet es keine Schmerzen und es kann sich schnell
        in Sicherheit bringen. Verliert es Ranken, werden diese am
        nächsten Tag durch neue ersetzt.
      es: |-
        A Tangela se le desprenden los tentáculos con facilidad en
        cuanto se los agarras. Y no solo no le duele, sino que le
        resulta muy útil para escapar rápido. Además, al día siguiente
        le crecen otros.
      it: |-
        Se afferrate, le liane di Tangela si staccano con facilità,
        ma in modo indolore, consentendo così una pratica
        scappatoia. Le liane cadute vengono sostituite da quelle
        nuove il giorno dopo.
    lets-go-pikachu:
      ja-Hrkt: |-
        からだが　あおいツルに　おおわれて
        しょうたいは　わからない。
        ツルは　ずっと　のびつづけるという。
      ja: |-
        体が　青いツルに　覆われて
        正体は　わからない。
        ツルは　ずっと　伸び続けるという。
      ko: |-
        몸이 파란 덩굴에 싸여 있어
        정체를 알 수 없다.
        덩굴은 계속해서 자란다고 한다.
      zh-Hant: |-
        身體被藍色的藤蔓裹著，
        沒有人知道牠的真面目。
        據說藤蔓會持續不斷生長。
      zh-Hans: |-
        全身被蓝色的蔓藤覆盖，
        真面目不为人知。据说，
        它的蔓藤会持续不断地生长。
      en: |-
        Its identity is obscured by masses of thick blue
        vines. The vines are said to never stop growing.
      fr: |-
        Son corps est masqué par une masse épaisse
        de lianes bleues qui poussent en permanence.
      de: |-
        Sein Körper liegt unter dichten, blauen Ranken
        verborgen, die niemals aufhören zu wachsen.
      es: |-
        Se camufla tras una gran masa de lianas azules.
        Se dice que nunca dejan de crecer.
      it: |-
        È coperto da una massa di liane blu che non
        smettono mai di crescere. Nessuno sa quale
        sia il suo vero aspetto.
    lets-go-eevee:
      ja-Hrkt: |-
        からだが　あおいツルに　おおわれて
        しょうたいは　わからない。
        ツルは　ずっと　のびつづけるという。
      ja: |-
        体が　青いツルに　覆われて
