    red:
      en: |-
        The whole body is
        swathed with wide
        vines that aresimilar to sea­
        weed. Its vines
        shake as it walks.
    blue:
      en: |-
        The whole body is
        swathed with wide
        vines that aresimilar to sea­
        weed. Its vines
        shake as it walks.
    yellow:
      en: |-
        Its identity is
        obscured by masses
        of thick, bluevines. The vines
        are said to never
        stop growing.
    gold:
      en: |-
        The vines that
        cloak its entire
        body are alwaysjiggling. They
        effectively un­
        nerve its foes.
    silver:
      en: |-
        It tangles any
        moving thing with
        its vines. Theirsubtle shaking
