    sword:
      ja-Hrkt: |-
        ちぎれても　むげんに　のびる
        ツルの　おくの　しょうたいは
        いまだ　かいめいされていない。
      ja: |-
        ちぎれても　無限に　伸びる
        ツルの　奥の　正体は
        いまだ　解明されていない。
      ko: |-
        잘려도 잘려도 무한으로 늘어나는
        덩굴 속의 정체는
        아직 밝혀지지 않았다.
      zh-Hant: |-
        藤蔓即使斷了也會繼續
        無限地生長。藤蔓下的
        真面目至今仍是個謎。
      zh-Hans: |-
        藤蔓即使断了也能无限生长，
        里面的真面目是什么样子，
        直到今天也未被查明。
      en: |-
        Hidden beneath a tangle of vines that grows
        nonstop even if the vines are torn off, this
        Pokémon’s true appearance remains a mystery.
      fr: |-
        On ne sait toujours pas ce qui se cache
        sous ses lianes. Même si on les coupe,
        elles repoussent à l’infini.
      de: |-
        Seine wahre Gestalt ist weiterhin ein Mysterium,
        da sie von Ranken verdeckt wird, die unaufhörlich
        nachwachsen, selbst wenn sie abreißen.
      es: |-
        Sus lianas no dejan de crecer aunque se le
        desprendan. Aún se desconoce qué aspecto
        tiene sin ellas.
      it: |-
        Non è ancora chiaro quale sia il vero aspetto
        celato dietro alle sue liane, che crescono
        all’infinito anche dopo essere state recise.
    shield:
      ja-Hrkt: |-
        ツルは　どくとくの　かおりがする。
        ガラルの　いちぶの　ちいきでは
        ハーブとして　つかわれている。
      ja: |-
        ツルは　独特の　香りがする。
        ガラルの　一部の　地域では
        ハーブとして　使われている。
      ko: |-
        덩굴은 독특한 향이 난다.
        가라르 일부 지역에서는
        허브로 사용되고 있다.
      zh-Hant: |-
        藤蔓散發著獨特的香氣。
        在伽勒爾的部分地區
        會被當作香草使用。
      zh-Hans: |-
        藤蔓有着独特的香气。
        在伽勒尔的部分地区
        被当做香草使用。
      en: |-
        The vines of a Tangela have a distinct scent.
        In some parts of Galar, Tangela vines are used
        as herbs.
      fr: |-
        Ses lianes ont une odeur particulière.
        Elles servent d’herbes aromatiques
        dans une certaine zone de Galar.
      de: |-
        Seine Ranken verströmen einen eigentümlichen
        Duft, weshalb sie in bestimmten Gegenden von
        Galar als aromatische Kräuter verwendet werden.
      es: |-
        Sus lianas despiden una fragancia peculiar.
        En cierta zona de Galar se usan como aderezo.
      it: |-
        Le sue liane emanano un odore peculiare.
        In alcune zone di Galar vengono usate come
        erbe aromatiche.
    legends-arceus:
      en: |-
        It is cloaked entirely in blue vines, preventing any glimpse of
        its true identity. The vines impart a refreshing sensation when
        chewed—they're useful as a spice.
