elgyem:
  base_happiness: 50
  capture_rate: 255
  color: blue
  egg_groups:
    - humanshape
  evolution_chain: elgyem
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        It uses its strong psychic power
        to squeeze its opponent’s brain,
        causing unendurable headaches.
      fr: |-
        Avec son puissant pouvoir psychique,
        il peut compresser le cerveau de ses
        ennemis et déclencher des migraines.
    white:
      en: |-
        This Pokémon had never been seen until
        it appeared from far in the desert
        50 years ago.
      fr: |-
        Il est apparu soudainement des confins
        d’un désert il y a 50 ans. Personne ne
        l’avait jamais vu auparavant.
    black-2:
      en: |-
        Rumors of its origin are linked to a UFO
        crash site in the desert 50 years ago.
    white-2:
      en: |-
        Rumors of its origin are linked to a UFO
        crash site in the desert 50 years ago.
    x:
      ja-Hrkt: |-
        つよい　サイコパワーを　あやつる。
        サイコパワーで　あいての　のうみそを
        しめつけて　ずつうを　おこさせる。
      ja: |-
        強力な　サイコパワーを　操る。
        サイコパワーで　相手の　脳みそを
        絞めつけて　頭痛を　起こさせる。
      ko: |-
        강력한 사이코 파워를 다룬다.
        사이코 파워로 상대의 뇌를
        조여서 두통을 일으킨다.
      en: |-
        It uses its strong psychic power to squeeze its
        opponent’s brain, causing unendurable headaches.
      fr: |-
        Avec son puissant pouvoir psychique, il peut
        compresser le cerveau de ses ennemis et déclencher
        des migraines.
      de: |-
        Es verfügt über mächtige Psycho-Kräfte, mit denen
        es die Hirne seiner Gegner verwirrt, um ihnen
        Kopfweh zu bereiten.
      es: |-
        Posee un gran poder psíquico. Lo usa para comprimir
        el cerebro del enemigo y ocasionarle dolores de
        cabeza.
      it: |-
        Con i suoi incredibili poteri psichici comprime il
        cervello dei suoi nemici provocando loro fortissime
        emicranie.
    'y':
      ja-Hrkt: |-
        ５０ねんまえ　ＵＦＯが
        ついらくしたと　うわさされる
        さばくから　やってきたと　いわれる。
      ja: |-
        ５０年前　ＵＦＯが
        墜落したと　うわさされる
        砂漠から　やってきたと　いわれる。
      ko: |-
        50년 전 UFO가
        추락했다는 소문이 도는
        사막에서 왔다고 전해진다.
      en: |-
        Rumors of its origin are linked to a UFO crash site
        in the desert 50 years ago.
      fr: |-
        On dit qu’il est apparu soudainement il y a 50 ans
        des confins d’un désert où un OVNI se serait écrasé.
      de: |-
        Man sagt, es sei vor 50 Jahren aus den Tiefen einer
        Wüste erschienen, in der zuvor angeblich ein UFO
        abgestürzt war.
      es: |-
        Según cuentan los rumores, procede de un desierto
        donde hace 50 años se estrelló un ovni.
      it: |-
        Si dice che sia arrivato 50 anni fa da un deserto in
        cui sembra si sia schiantato un UFO.
    omega-ruby:
      ja-Hrkt: |-
        つよい　サイコパワーを　あやつる。
        サイコパワーで　あいての　のうみそを
        しめつけて　ずつうを　おこさせる。
      ja: |-
        強力な　サイコパワーを　操る。
        サイコパワーで　相手の　脳みそを
        絞めつけて　頭痛を　起こさせる。
      ko: |-
        강력한 사이코 파워를 다룬다.
        사이코 파워로 상대의 뇌를
        조여서 두통을 일으킨다.
      en: |-
        It uses its strong psychic power to squeeze its
        opponent’s brain, causing unendurable headaches.
      fr: |-
        Avec son puissant pouvoir psychique, il peut compresser
        le cerveau de ses ennemis et déclencher des migraines.
      de: |-
        Es verfügt über mächtige Psycho-Kräfte, mit denen es die
        Hirne seiner Gegner verwirrt, um ihnen Kopfweh zu bereiten.
      es: |-
        Posee un gran poder psíquico. Lo usa para comprimir el
        cerebro del enemigo y ocasionarle dolores de cabeza.
      it: |-
        Con i suoi incredibili poteri psichici comprime il cervello
        dei suoi nemici provocando loro fortissime emicranie.
    alpha-sapphire:
      ja-Hrkt: |-
        ５０ねんまえ　ＵＦＯが
        ついらくしたと　うわさされる
        さばくから　やってきたと　いわれる。
      ja: |-
        ５０年前　ＵＦＯが
        墜落したと　うわさされる
        砂漠から　やってきたと　いわれる。
      ko: |-
        50년 전 UFO가
        추락했다는 소문이 도는
        사막에서 왔다고 전해진다.
      en: |-
        Rumors of its origin are linked to a UFO crash site
        in the desert 50 years ago.
      fr: |-
        On dit qu’il est apparu soudainement il y a 50 ans des confins
        d’un désert où un OVNI se serait écrasé.
      de: |-
        Man sagt, es sei vor 50 Jahren aus den Tiefen einer Wüste
        erschienen, in der zuvor angeblich ein UFO abgestürzt war.
      es: |-
        Según cuentan los rumores, procede de un desierto donde
        hace 50 años se estrelló un ovni.
      it: |-
        Si dice che sia arrivato 50 anni fa da un deserto in cui sembra
        si sia schiantato un UFO.
    ultra-sun:
      ja-Hrkt: |-
        すさまじい　サイコパワーを　あやつる。
        うちゅうじん　もくげきじょうほうの
        おおくは　リグレーの　みまちがいだ。
      ja: |-
        凄まじい　サイコパワーを　操る。
        宇宙人　目撃情報の　多くは
        リグレーの　見間違いだ。
      ko: |-
        무시무시한 사이코 파워를 조종한다.
        우주인 목격 정보의 대부분은
        리그레를 보고 착각한 것이다.
      zh-Hant: |-
        操縱著驚人的精神力量。
        大部分目擊到外星人的消息
        都是把小灰怪錯看成外星人了。
      zh-Hans: |-
        操纵着非常惊人的精神力量。
        大多数目击外星人的信息都是
        错把小灰怪看成外星人了。
      en: |-
        It controls tremendous psychic power. Most
        reports of alien sightings are actually just
        people mistaking Elgyem for an alien.
      fr: |-
        Il possède de redoutables pouvoirs psychiques.
        La plupart des signalements d’extraterrestres
        correspondent à des Lewsor qui se promènent.
      de: |-
        Es besitzt unfassbare Psycho-Kräfte. Etliche
        Meldungen über Sichtungen von Außerirdischen
        entpuppten sich als Verwechslungen mit ihm.
      es: |-
        Es capaz de usar un formidable poder psíquico.
        Muchos creen haber avistado extraterrestres
        cuando, en realidad, lo que vieron eran Elgyem.
      it: |-
        I suoi poteri psichici sono straordinari. Quando
        qualcuno dichiara di aver visto un alieno, nella
        maggior parte dei casi si tratta di un Elgyem.
    ultra-moon:
      ja-Hrkt: |-
        およそ　５０ねんまえ　ちじょうに
        おちた　ＵＦＯから　あらわれたと
        いわれる　なぞの　おおい　ポケモン。
      ja: |-
        およそ　５０年前　地上に
        落ちた　ＵＦＯから　現れたと
        いわれる　謎の　多い　ポケモン。
      ko: |-
        약 50년 전 지상에 떨어진
        UFO에서 나타났다고 전해지는
        수수께끼로 둘러싸인 포켓몬.
      zh-Hant: |-
        據說是大約５０年前從
        墜落到地上的ＵＦＯ中出現。
        是充滿未解之謎的寶可夢。
      zh-Hans: |-
        据说，是在大约５０年前
        从掉落到地面的ＵＦＯ里出现的。
        是充满未解之谜的宝可梦。
      en: |-
        This Pokémon is shrouded in mystery. It’s said
        to have appeared from a UFO that fell from the
        sky about 50 years ago.
      fr: |-
        Ce Pokémon est nimbé de mystère. On raconte
        qu’il serait apparu il y a 50 ans, après la chute
        d’un OVNI.
      de: |-
        Ein geheimnisumwobenes Pokémon, von dem
        es heißt, es sei aus einem vor 50 Jahren
        abgestürzten UFO erschienen.
      es: |-
        Pokémon envuelto en un halo de misterio cuya
        aparición, 50 años atrás, coincide curiosamente
        con la caída de un ovni.
      it: |-
        È un Pokémon dai molti misteri.
        Si dice che provenga da un UFO schiantatosi
        50 anni fa.
    sword:
      ja-Hrkt: |-
        テレビのそばに　いると　モニターに
        きみょうな　けしきが　うつる。
        リグレーの　こきょうだと　いわれる。
      ja: |-
        テレビのそばに　いると　モニターに
        奇妙な　景色が　映る。
        リグレーの　故郷だと　いわれる。
      ko: |-
        TV 근처에 있으면 모니터에
        기묘한 풍경이 비친다.
        리그레의 고향이라 여겨지고 있다.
      zh-Hant: |-
        當牠站在電視機旁邊時，
        畫面上會出現奇怪的景色。
        據說那是牠的故鄉。
      zh-Hans: |-
        当它站在电视旁边时，
        画面上会出现奇怪的景色。
        据说那是小灰怪的故乡。
      en: |-
        If this Pokémon stands near a TV, strange scenery
        will appear on the screen. That scenery is said
        to be from its home.
      fr: |-
        S’il se tient près d’une télé, d’étranges panoramas
        apparaissent à l’écran. On raconte qu’il s’agirait
        de paysages venus des terres natales de Lewsor.
      de: |-
        Wenn es in der Nähe ist, beginnen Fernseher zu
        flackern und fremdartige Landschaften zu zeigen.
        Diese stellen angeblich seine Heimat dar.
      es: |-
        Cuando se halla junto a un televisor, la pantalla
        muestra imágenes de extraños paisajes. Se cree
        que corresponden a su lugar de origen.
      it: |-
        Quando si trova vicino a un televisore, sullo
        schermo appaiono paesaggi singolari. Si dice
        che siano vedute del luogo da cui proviene.
    shield:
      ja-Hrkt: |-
        ５０ねん　ほど　まえに　みつかった
        ポケモン。　おおきく　はったつした
        のうで　サイコパワーを　あやつるぞ。
      ja: |-
        ５０年　ほど　前に　見つかった
        ポケモン。　大きく　発達した
        脳で　サイコパワーを　操るぞ。
      ko: |-
        약 50년 전에 발견된
        포켓몬이다. 크게 발달한
        뇌로 사이코 파워를 조종한다.
      zh-Hant: |-
        在大約５０年前被發現的寶可夢。
        會用又大又發達的大腦
        來操縱精神力量。
      zh-Hans: |-
        在大约５０年前被发现的宝可梦。
        会用又大又发达的大脑
        操纵精神力量。
      en: |-
        This Pokémon was discovered about 50 years
        ago. Its highly developed brain enables it to
        exert its psychic powers.
      fr: |-
        Ce Pokémon a été découvert il y a environ 50 ans.
        Son cerveau surdéveloppé lui permet d’utiliser
        ses pouvoirs psychiques avec aisance.
      de: |-
        Ein Pokémon, das vor 50 Jahren entdeckt wurde.
        Sein hochentwickeltes Gehirn verleiht ihm
        Psycho-Kräfte.
      es: |-
        Fue descubierto hace aproximadamente 50 años.
        Posee un cerebro muy desarrollado que le otorga
        poderes psíquicos.
      it: |-
        È stato scoperto circa 50 anni fa. Il suo cervello
        molto sviluppato gli permette di usare
        poteri psichici.
