  flavor_text:
    sword:
      ja-Hrkt: |-
        だいそうげんの　なかで　たたずみ
        ひの　かたむきを　ながめて　くらす。
        ダイナミックな　けりわざが　とくい。
      ja: |-
        大草原の　中で　たたずみ
        陽の　傾きを　眺めて　暮らす。
        ダイナミックな　蹴り技が　得意。
      ko: |-
        넓은 초원 한복판에 우뚝 서서
        해가 기우는 것을 바라보며 지낸다.
        다이내믹한 발차기 기술이 특기다.
      zh-Hant: |-
        佇立在大草原上，
        每天眺望著日升日落。
        擅長強而有力的踢技。
      zh-Hans: |-
        伫立在大草原里，
        每天眺望着日升日落。
        擅长强而有力的踢技。
      en: |-
        It stands in grasslands, watching the sun’s descent
        from zenith to horizon. This Pokémon has a talent
        for delivering dynamic kicks.
      fr: |-
        Il se tient immobile au milieu des plaines
        et passe son temps à observer la course du soleil
        dans le ciel. Son jeu de jambes est phénoménal.
      de: |-
        Es verweilt auf weitläufigen Wiesen und
        beobachtet den Lauf der Sonne. Dynamische
        Trittangriffe sind sein Spezialgebiet.
      es: |-
        Pasa el tiempo observando inmóvil el recorrido
        del sol sobre las extensas praderas que habita.
        Se especializa en técnicas de ágiles patadas.
      it: |-
        Trascorre le giornate nelle grandi praterie
        osservando immobile il passaggio del sole.
        Le mosse basate sui calci sono la sua specialità.
    shield:
      ja-Hrkt: |-
        １ねんに　いちど　きまった　にちじに
        どこから　ともなく　あつまり　わに
        なって　ならぶ　しゅうせいが　ある。
      ja: |-
        １年に　一度　きまった　日時に
        どこから　ともなく　集まり　輪に
        なって　並ぶ　習性が　ある。
      ko: |-
        1년에 1번 정해진 일시에
        어디선가 모여 둥글게
        늘어서는 습성이 있다.
      zh-Hant: |-
        每年會有一天，牠們會在
        特定的時間突然出現，
        聚集在一起排成一個圈。
      zh-Hans: |-
        每年会有一天，它们会在
        特定的时间突然出现，
        聚集在一起排成一个圈。
      en: |-
        Once a year, on a specific date and at a specific
        time, they gather out of nowhere and form up in
        a circle.
      fr: |-
        Tous les ans à la même date, ils arrivent
        de nulle part pour se réunir en cercle.
        C’est une de leurs coutumes.
      de: |-
        Sie haben die Angewohnheit, sich einmal im Jahr
        zu einer bestimmten Zeit wie aus dem Nichts zu
        versammeln und in einem Kreis aufzustellen.
      es: |-
        Una vez al año y en una fecha concreta, tienen la
        costumbre de aparecer de la nada para reunirse
        y formar un círculo.
      it: |-
        Ogni anno, in un giorno stabilito, hanno l’usanza
        di radunarsi giungendo da ogni dove per poi
        disporsi in cerchio.
