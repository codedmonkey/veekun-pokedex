  evolution_chain: glameow
  evolves_from: glameow
  flavor_text:
    diamond:
      en: |-
        It is a brazen brute that barges
        its way into another Pokémon’s
        nest and claims it as its own.
    pearl:
      en: |-
        To make itself appear intimidatingly
        beefy, it tightly cinches its waist
        with its twin tails.
    platinum:
      en: |-
        It binds its body with its tails to
        make itself look bigger. If it locks
        eyes, it will glare ceaselessly.
    heartgold:
      en: |-
        It would claim another Pokémon’s
        nest as its own if it finds a nest
        sufficiently comfortable.
    soulsilver:
      en: |-
        It would claim another Pokémon’s
        nest as its own if it finds a nest
        sufficiently comfortable.
    black:
      en: |-
        It binds its body with its tails to
        make itself look bigger. If it locks
        eyes, it will glare ceaselessly.
      fr: |-
        Il plaque ses queues contre son
        dos pour paraître plus grand.
        Il soutient un regard des heures.
    white:
      en: |-
        It binds its body with its tails to
        make itself look bigger. If it locks
        eyes, it will glare ceaselessly.
      fr: |-
        Il plaque ses queues contre son
        dos pour paraître plus grand.
        Il soutient un regard des heures.
    black-2:
      en: |-
        It binds its body with its tails to
        make itself look bigger. If it locks
        eyes, it will glare ceaselessly.
    white-2:
      en: |-
        It binds its body with its tails to
        make itself look bigger. If it locks
        eyes, it will glare ceaselessly.
    x:
      ja-Hrkt: |-
        ほかの　ポケモンの　すみかでも
        いごこちが　よければ　いすわって
        じぶんの　すみかに　してしまう。
      ja: |-
        ほかの　ポケモンの　住処でも
        居心地が　良ければ　居座って
        自分の　住処に　してしまう。
      ko: |-
        다른 포켓몬의 거처라 할지라도
        편안하면 눌러앉아
        자신의 거처로 삼아버린다.
      en: |-
        It would claim another Pokémon’s nest as its own
        if it finds a nest sufficiently comfortable.
      fr: |-
        Il n’hésitera pas à voler le nid d’autres Pokémon et
        à s’y installer si celui-ci est confortable.
      de: |-
        Behagt ihm die Behausung eines anderen Pokémon,
        bleibt Shnurgarst einfach da und nistet sich dort ein.
      es: |-
        Si se siente a gusto, no tiene ningún reparo en
        apropiarse de las moradas de otros Pokémon.
      it: |-
        Si introduce sfacciatamente nelle tane degli altri
        Pokémon rivendicandole poi come proprie.
    'y':
      ja-Hrkt: |-
        からだを　おおきく　みせて　あいてを
        いあつするため　ふたまたの　しっぽで
        ウエストを　ぎゅっと　しぼっている。
      ja: |-
        体を　大きく　見せて　相手を
        威圧するため　ふたまたの　尻尾で
        ウエストを　ぎゅっと　絞っている。
      ko: |-
        몸을 크게 보여서 상대를
        위압하기 위해 두 갈래의 꼬리로
        허리를 꼭 쥐고 있다.
      en: |-
        To make itself appear intimidatingly beefy, it tightly
        cinches its waist with its twin tails.
      fr: |-
        Il ceinture sa taille de sa queue bifide pour paraître
        plus imposant.
      de: |-
        Damit es bedrohlicher und größer aussieht, umschlingt
        es seine Taille fest mit seinem Schwanz.
      es: |-
        Para intimidar y parecer más corpulento, se aprieta la
        cintura con su cola bífida.
      it: |-
        Si stringe la vita con la coda biforcuta per apparire
        più imponente e minaccioso.
    omega-ruby:
      ja-Hrkt: |-
        ほかの　ポケモンの　すみかでも
        いごこちが　よければ　いすわって
        じぶんの　すみかに　してしまう。
      ja: |-
        ほかの　ポケモンの　住処でも
        居心地が　良ければ　居座って
        自分の　住処に　してしまう。
      ko: |-
        다른 포켓몬의 거처라 할지라도
        편안하면 눌러앉아
        자신의 거처로 삼아버린다.
      en: |-
        It would claim another Pokémon’s nest as its own
        if it finds a nest sufficiently comfortable.
      fr: |-
        Il n’hésitera pas à voler le nid d’autres Pokémon et
        à s’y installer si celui-ci est confortable.
      de: |-
        Behagt ihm die Behausung eines anderen Pokémon,
        bleibt Shnurgarst einfach da und nistet sich dort ein.
      es: |-
        Si se siente a gusto, no tiene ningún reparo en apropiarse de
        las moradas de otros Pokémon.
      it: |-
        Si introduce sfacciatamente nelle tane degli altri Pokémon
        rivendicandole poi come proprie.
    alpha-sapphire:
      ja-Hrkt: |-
        からだを　おおきく　みせて　あいてを
        いあつするため　ふたまたの　しっぽで
        ウエストを　ぎゅっと　しぼっている。
      ja: |-
        体を　大きく　見せて　相手を
        威圧するため　ふたまたの　尻尾で
        ウエストを　ぎゅっと　絞っている。
      ko: |-
        몸을 크게 보여서 상대를
        위압하기 위해 두 갈래의 꼬리로
        허리를 꼭 쥐고 있다.
      en: |-
        To make itself appear intimidatingly beefy, it tightly
        cinches its waist with its twin tails.
      fr: |-
        Il ceinture sa taille de sa queue bifide pour paraître
        plus imposant.
      de: |-
        Damit es bedrohlicher und größer aussieht, umschlingt es
        seine Taille fest mit seinem Schwanz.
      es: |-
        Para intimidar y parecer más corpulento, se aprieta la cintura
        con su cola bífida.
      it: |-
        Si stringe la vita con la coda biforcuta per apparire più
        imponente e minaccioso.
