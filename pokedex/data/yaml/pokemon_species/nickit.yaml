nickit:
  base_happiness: 50
  capture_rate: 255
  color: brown
  egg_groups:
    - ground
  evolution_chain: nickit
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        ほかの　ポケモンが　みつけた　エサを
        かすめて　くらしている。　ふかふかの
        にくきゅうは　あしおとを　たてない。
      ja: |-
        ほかの　ポケモンが　みつけた　餌を
        掠めて　暮らしている。　ふかふかの
        肉球は　足音を　たてない。
      ko: |-
        다른 포켓몬이 발견한 먹이를
        훔치며 산다. 푹신푹신한
        볼록살 덕분에 발소리가 나지 않는다.
      zh-Hant: |-
        靠搶奪其他寶可夢找到的食物
        為生。腳上長著軟乎乎的肉球，
        走路時不會發出絲毫聲響。
      zh-Hans: |-
        靠抢夺其他宝可梦找到的食物
        为生。脚上长着软乎乎的肉球，
        走路时不会发出丝毫声响。
      en: |-
        Aided by the soft pads on its feet, it silently raids
        the food stores of other Pokémon. It survives off
        its ill-gotten gains.
      fr: |-
        Il vit en subtilisant la nourriture des autres
        Pokémon. Grâce à ses coussinets moelleux,
        il ne fait aucun bruit quand il marche.
      de: |-
        Es stibitzt Futter, das andere Pokémon gefunden
        haben. Dank der samtweichen Ballen an seinen
        Pfoten ist sein Gang lautlos.
      es: |-
        Se sustenta con el alimento que roba a otros
        Pokémon. Las almohadillas de sus patas son tan
        blandas que no hace ningún ruido al caminar.
      it: |-
        Vive rubando il cibo trovato dagli altri Pokémon.
        I morbidi cuscinetti plantari rendono i suoi passi
        silenziosi.
    shield:
      ja-Hrkt: |-
        ようじん　ぶかく　ずるがしこい。
        エサを　ぬすむと　しっぽで
        あしあとを　けしながら　にげるのだ。
      ja: |-
        用心深く　ずる賢い。
        エサを　盗むと　しっぽで
        足跡を　消しながら　逃げるのだ。
      ko: |-
        조심성이 많고 교활하다.
        먹이를 훔치고는 꼬리로
        발자국을 지우며 도망간다.
      zh-Hant: |-
        性情謹慎且狡猾。
        在偷盜食物逃走的時候
        會用尾巴擦掉自己的足跡。
      zh-Hans: |-
        性格谨慎且狡猾。
        在偷盗食物逃走的时候
        会用尾巴擦掉自己的足迹。
      en: |-
        Cunning and cautious, this Pokémon survives by
        stealing food from others. It erases its tracks with
        swipes of its tail as it makes off with its plunder.
      fr: |-
        Rusé et vigilant, il prend la poudre d’escampette
        après avoir volé de la nourriture en prenant soin
        d’effacer ses traces de pas avec sa queue.
      de: |-
        Es ist sehr vorsichtig und gerissen. Nachdem es
        Futter stibitzt hat, macht es sich davon und
        verwischt dabei seine Spuren mit seinem Schweif.
      es: |-
        Prudente y astuto, borra con la cola las huellas
        que deja al huir tras robarle el alimento a otro
        Pokémon.
      it: |-
        È scaltro e molto prudente. Quando ruba
        il cibo, scappa cancellando le sue orme
        con la coda.
