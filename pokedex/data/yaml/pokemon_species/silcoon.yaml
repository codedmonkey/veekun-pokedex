silcoon:
  base_happiness: 70
  capture_rate: 120
  color: white
  egg_groups:
    - bug
  evolution_chain: wurmple
  evolves_from: wurmple
  flavor_text:
    ruby:
      en: |-
        SILCOON tethers itself to a tree branch
        using silk to keep from falling. There, 
        this POKéMON hangs quietly while itawaits evolution.
        It peers out of the silk cocoon through
        a small hole.
    sapphire:
      en: |-
        SILCOON was thought to endure hunger
        and not consume anything before its
        evolution. However, it is now thoughtthat this POKéMON slakes its thirst by
        drinking rainwater that collects on its
        silk.
    emerald:
      en: |-
        It prepares for evolution using the
        energy it stored while it was a WURMPLE.
        It keeps watch over the surroundings with
        its two eyes.
    firered:
      en: |-
        It conserves its energy by moving as
        little as possible. It awaits evolution
        while drinking only a little rainwater.
    leafgreen:
      en: |-
        It conserves its energy by moving as
        little as possible. It awaits evolution
        while drinking only a little rainwater.
    diamond:
      en: |-
        It anchors itself by wrapping
        twigs with the silk from its body.
        It motionlessly awaits evolution.
    pearl:
      en: |-
        It drinks dew that collects on its
        silk and waits for evolution. Its
        hard cocoon repels attacks.
    platinum:
      en: |-
        It wraps silk around the branches
        of a tree. It drinks rainwater on
        its silk while awaiting evolution.
    heartgold:
      en: |-
        Having wrapped silk around the
        branches of a tree, it quiescently
        awaits evolution.
    soulsilver:
      en: |-
        Having wrapped silk around the
        branches of a tree, it quiescently
        awaits evolution.
    black:
      en: |-
        It wraps silk around the branches
        of a tree. It drinks rainwater on
        its silk while awaiting evolution.
      fr: |-
        Il attend d’évoluer dans son cocon
        de soie accroché aux branches et
        se nourrit d’eau de pluie.
    white:
      en: |-
        It wraps silk around the branches
        of a tree. It drinks rainwater on
        its silk while awaiting evolution.
      fr: |-
        Il attend d’évoluer dans son cocon
        de soie accroché aux branches et
        se nourrit d’eau de pluie.
    black-2:
      en: |-
        It wraps silk around the branches
        of a tree. It drinks rainwater on
        its silk while awaiting evolution.
    white-2:
      en: |-
        It wraps silk around the branches
        of a tree. It drinks rainwater on
        its silk while awaiting evolution.
    x:
      ja-Hrkt: |-
        いとを　きのえだに　まきつけている。
        いとについた　あまみずを　のみながら
        しんかの　ときを　まっている。
      ja: |-
        糸を　木の枝に　巻きつけている。
        糸についた　雨水を　飲みながら
        進化の　ときを　待っている。
      ko: |-
        실을 나뭇가지에 휘감고 있다.
        실에 묻은 빗물을 마시며
        진화할 때를 기다리고 있다.
      en: |-
        It wraps silk around the branches of a tree. It drinks
        rainwater on its silk while awaiting evolution.
      fr: |-
        Il attend d’évoluer dans son cocon de soie accroché
        aux branches et se nourrit d’eau de pluie.
      de: |-
        Es bindet sich mit Seide an Äste und trinkt
        Regenwasser, während es starr auf seine
        Entwicklung wartet.
      es: |-
        Se agarra con su seda a las ramas de un árbol y
        espera su evolución bebiendo agua de lluvia.
      it: |-
        Si appende ai rami con fili di seta. Aspetta l’evoluzione
        bevendo l’acqua piovana che si posa sulla seta.
    'y':
      ja-Hrkt: |-
        いとに　ついた　あさつゆを　のんで
        しんかの　ときを　まちつづける。
        かたい　マユが　こうげきを　ふせぐ。
      ja: |-
        糸に　ついた　朝露を　飲んで
        進化の　ときを　待ち続ける。
        硬い　繭が　攻撃を　防ぐ。
      ko: |-
        실에 묻은 아침 이슬을 마시고
        진화할 때를 기다린다.
        단단한 고치가 공격을 막는다.
      en: |-
        It drinks dew that collects on its silk and waits for
        evolution. Its hard cocoon repels attacks.
      fr: |-
        Il boit la rosée récoltée par sa soie en attendant
        d’évoluer. Il est à l’abri dans son robuste cocon.
      de: |-
        Es trinkt den Tau, der sich in der Seide fängt, und
        wartet auf seine Entwicklung. Sein Kokon schützt es.
      es: |-
        Bebe el rocío que recoge con su seda mientras espera
        evolucionar. Se defiende en su capullo.
      it: |-
        Beve la rugiada che si posa sulla seta e aspetta
        l’evoluzione. Il suo bozzolo duro respinge gli attacchi.
    omega-ruby:
      ja-Hrkt: |-
        おちない　ように　いとを　えだに　まきつけて
        からだを　ささえながら　しんかを　まっている。
        ちいさな　あなから　そとの　ようすを　うかがう。
      ja: |-
        落ちない　ように　糸を　枝に　巻きつけて
        体を　支えながら　進化を　待っている。
        小さな　穴から　外の　様子を　伺う。
      ko: |-
        떨어지지 않도록 실을 가지에 휘감아서
        몸을 지탱하며 진화를 기다리고 있다.
        작은 구멍을 통해 밖의 상황을 살핀다.
      en: |-
        Silcoon tethers itself to a tree branch using silk to keep from
        falling. There, this Pokémon hangs quietly while it awaits
        evolution. It peers out of the silk cocoon through a small hole.
      fr: |-
        Armulys s’accroche à une branche d’arbre avec de la soie
        pour éviter de tomber. Ce Pokémon y reste tranquillement
        en attendant son évolution. Il regarde l’extérieur à travers
        deux petits trous dans son cocon de soie.
      de: |-
        Schaloko bindet sich mit einem Seidenfaden an einen Ast.
        Es baumelt dort und wartet auf seine Entwicklung. Durch zwei
        kleine Löcher in seinem Seidenkokon lugt es heraus.
      es: |-
        Silcoon usa la seda que produce para aferrarse a la rama de un
        árbol y sujetarse bien. Se queda ahí colgado a la espera de su
        evolución, mientras lo observa todo a través de dos pequeños
        agujeros en su capullo de seda.
      it: |-
        Silcoon si lega ai rami degli alberi grazie ad alcuni fili di seta
        che gli impediscono di cadere. In tale posizione aspetta
        pazientemente l’evoluzione. Sbircia fuori dal proprio bozzolo
        di seta attraverso piccoli fori.
    alpha-sapphire:
      ja-Hrkt: |-
        しんかするまで　なにも　たべずに　たえていると
        かんがえられていたが　どうやら　いとに　ついた
        あまみずで　かわきを　いやしているらしい。
      ja: |-
        進化するまで　なにも　食べずに　耐えていると
        考えられていたが　どうやら　糸に　ついた
        雨水で　乾きを　癒しているらしい。
      ko: |-
        진화할 때까지 아무것도 먹지 않고 참는 것으로
        여겨져 왔으나 아무래도 실에 맺힌
        빗방울로 갈증을 푸는 것 같다.
      en: |-
        Silcoon was thought to endure hunger and not consume
        anything before its evolution. However, it is now thought
        that this Pokémon slakes its thirst by drinking rainwater
        that collects on its silk.
      fr: |-
        On pensait qu’Armulys pouvait résister à la faim et ne
        consommait rien avant son évolution. On sait maintenant
        que ce Pokémon étanche sa soif en récupérant l’eau
        de pluie déposée sur sa soie.
      de: |-
        Bisher nahm man an, dass Schaloko vor seiner Entwicklung
        hungert und überhaupt nichts zu sich nimmt. Nun aber wird
        behauptet, dass es seinen Durst mit Regenwasser löscht,
        das sich auf seiner seidigen Hülle sammelt.
      es: |-
        Se pensaba que Silcoon podía aguantar el hambre y no
        consumir nada antes de evolucionar. Sin embargo, ahora se
        cree que sacia su sed bebiendo el agua de la lluvia que se le
        queda sobre la seda del capullo.
      it: |-
        In passato si pensava che Silcoon resistesse alla fame senza
        ingerire nulla fino all’evoluzione. Tuttavia, ora si presume che
        il Pokémon plachi la sua sete bevendo l’acqua piovana che
        si posa sul suo bozzolo.
