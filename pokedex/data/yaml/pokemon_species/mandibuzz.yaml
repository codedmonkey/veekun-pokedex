mandibuzz:
  base_happiness: 35
  capture_rate: 60
  color: brown
  egg_groups:
    - flying
  evolution_chain: vullaby
  evolves_from: vullaby
  flavor_text:
    black:
      en: |-
        It makes a nest out of bones it finds.
        It grabs weakened prey in its talons
        and hauls it to its nest of bones.
      fr: |-
        Il construit des nids en os. Il attrape
        les proies affaiblies avec ses serres
        et les transporte allègrement au nid.
    white:
      en: |-
        Watching from the sky, they swoop to
        strike weakened Pokémon on the ground.
        They decorate themselves with bones.
      fr: |-
        Il guette le sol depuis les airs et
        fond sur les proies affaiblies.
        Il aime s’apprêter avec des ossements.
    black-2:
      en: |-
        They fly in circles around the sky.
        When they spot prey, they attack and
        carry it back to their nest with ease.
    white-2:
      en: |-
        They fly in circles around the sky.
        When they spot prey, they attack and
        carry it back to their nest with ease.
    x:
      ja-Hrkt: |-
        おおぞらで　えんをえがきつつ　とび
        えものを　みつけると　おそいかかって
        すまで　かるがると　はこんでいく。
      ja: |-
        大空で　円を描きつつ　飛び
        獲物を　みつけると　襲いかかって
        巣まで　軽々と　運んでいく。
      ko: |-
        넓은 하늘에서 원을 그리며 날고
        먹이를 발견하면 덮쳐서
        둥지까지 가뿐히 나른다.
      en: |-
        They fly in circles around the sky. When they spot
        prey, they attack and carry it back to their nest
        with ease.
      fr: |-
        Il tournoie dans les airs en quête d’une proie sur
        laquelle il fondra avant de l’emporter avec aisance
        à son nid.
      de: |-
        Es kreist am Himmel, bis es seine Beute findet.
        Nach erfolgtem Angriff trägt es sie mühelos zu
        seinem Nest.
      es: |-
        Vuela en círculos. Cuando avista una presa, la ataca y
        la transporta a su nido con suma facilidad.
      it: |-
        Vola in cerchio nel cielo e quando scorge una preda
        le si lancia contro in picchiata per trasportarla al suo
        nido.
    'y':
      ja-Hrkt: |-
        そらから　ちじょうを　かんさつして
        よわった　えものに　おそいかかる。
        ほねで　きかざる　しゅうせい。
      ja: |-
        空から　地上を　観察して
        弱った　獲物に　襲いかかる。
        骨で　着飾る　習性。
      ko: |-
        하늘에서 지상을 관찰하다
        쇠약해진 먹이를 덮친다.
        뼈로 몸치장하는 습성이 있다.
      en: |-
        Watching from the sky, they swoop to strike
        weakened Pokémon on the ground. They decorate
        themselves with bones.
      fr: |-
        Il guette le sol depuis les airs et fond sur les proies
        affaiblies. Il aime s’apprêter avec des ossements.
      de: |-
        Es überblickt das Areal aus der Luft und stürzt sich auf
        ein geschwächtes Opfer. Trägt gern Knochenschmuck.
      es: |-
        Otea la superficie desde el cielo y ataca a Pokémon
        debilitados. Tiene por costumbre hacerse adornos
        con huesos.
      it: |-
        Osserva la terra dal cielo e si lancia sulle prede in
        difficoltà. Ha l’abitudine di farsi delle decorazioni
        con le ossa.
    omega-ruby:
      ja-Hrkt: |-
        おおぞらで　えんをえがきつつ　とび
        えものを　みつけると　おそいかかって
        すまで　かるがると　はこんでいく。
      ja: |-
        大空で　円を描きつつ　飛び
        獲物を　みつけると　襲いかかって
        巣まで　軽々と　運んでいく。
      ko: |-
        넓은 하늘에서 원을 그리며 날고
        먹이를 발견하면 덮쳐서
        둥지까지 가뿐히 나른다.
      en: |-
        They fly in circles around the sky. When they spot
        prey, they attack and carry it back to their nest
        with ease.
      fr: |-
        Il tournoie dans les airs en quête d’une proie sur laquelle
        il fondra avant de l’emporter avec aisance à son nid.
      de: |-
        Es kreist am Himmel, bis es seine Beute findet. Nach erfolgtem
        Angriff trägt es sie mühelos zu seinem Nest.
      es: |-
        Vuela en círculos. Cuando avista una presa, la ataca y la
        transporta a su nido con suma facilidad.
      it: |-
        Vola in cerchio nel cielo e quando scorge una preda le si
        lancia contro in picchiata per trasportarla al suo nido.
    alpha-sapphire:
      ja-Hrkt: |-
        そらから　ちじょうを　かんさつして
        よわった　えものに　おそいかかる。
        ほねで　きかざる　しゅうせい。
      ja: |-
        空から　地上を　観察して
        弱った　獲物に　襲いかかる。
        骨で　着飾る　習性。
      ko: |-
        하늘에서 지상을 관찰하다
        쇠약해진 먹이를 덮친다.
        뼈로 몸치장하는 습성이 있다.
      en: |-
        Watching from the sky, they swoop to strike
        weakened Pokémon on the ground. They decorate
        themselves with bones.
      fr: |-
        Il guette le sol depuis les airs et fond sur les proies affaiblies.
        Il aime s’apprêter avec des ossements.
      de: |-
        Es überblickt das Areal aus der Luft und stürzt sich auf ein
        geschwächtes Opfer. Trägt gern Knochenschmuck.
      es: |-
        Otea la superficie desde el cielo y ataca a Pokémon
        debilitados. Tiene por costumbre hacerse adornos con
        huesos.
      it: |-
        Osserva la terra dal cielo e si lancia sulle prede in difficoltà.
        Ha l’abitudine di farsi delle decorazioni con le ossa.
    sun:
      ja-Hrkt: |-
        ホネで　きれいに　きかざるのは　♂に
        アピールするためと　いわれるが
        バルジーナの　♂は　みつかっていない。
      ja: |-
        骨で　綺麗に　着飾るのは　♂に
        アピールするためと　いわれるが
        バルジーナの　♂は　みつかっていない。
      ko: |-
        뼈로 예쁘게 치장하는 것은 수컷에게
        어필하기 위한 것이라고 전해지지만
        버랜지나의 수컷은 발견되지 않았다.
      zh-Hant: |-
        據說，用骨頭華麗地裝飾是為了吸引♂，
        但還沒有發現過♂的禿鷹娜。
      zh-Hans: |-
        据说，用骨头华丽地装饰是为了吸引♂，
        但还没有发现过♂的秃鹰娜。
      en: |-
        They adorn themselves beautifully with bones.
        This is supposedly an effort to attract males,
        but no male Mandibuzz have ever been found.
      fr: |-
        Les Vaututrice femelles se parent d’ossements
        pour leur parade nuptiale. On attend toujours
        de découvrir si les mâles existent ou pas.
      de: |-
        Trägt gern Knochenschmuck, um Männchen zu
        gefallen. Niemand hat bisher aber jemals ein
        männliches Grypheldis gesehen.
      es: |-
        Se dice que los huesos con los que se engalana
        le sirven para cortejar al otro sexo, aunque
        nunca se ha avistado ningún Mandibuzz macho.
      it: |-
        Si dice che si adorni di ossa per attirare
        esemplari di sesso opposto. Tuttavia non
        sono mai stati avvistati Mandibuzz maschi.
    moon:
      ja-Hrkt: |-
        おおぞらを　せんかい　しながら
        よわった　ポケモンを　ねらっている。
        だいこうぶつは　カラカラ。
      ja: |-
        大空を　旋回　しながら
        弱った　ポケモンを　狙っている。
        大好物は　カラカラ。
      ko: |-
        넓은 하늘을 선회하며
        약해진 포켓몬을 노리고 있다.
        가장 좋아하는 것은 탕구리.
      zh-Hant: |-
        一邊在天空盤旋，
        一邊瞄準弱小的寶可夢。
        最喜歡吃的是卡拉卡拉。
      zh-Hans: |-
        一边在天空盘旋，
        一边瞄准弱小的宝可梦。
        最喜欢吃的是卡拉卡拉。
      en: |-
        It circles in the sky, keeping a keen eye out for
        Pokémon in a weakened state. Its choicest food
        is Cubone.
      fr: |-
        Il tournoie, haut dans le ciel, à la recherche
        d’un Pokémon affaibli. Sa proie favorite est
        le petit Osselait.
      de: |-
        Es überblickt das Areal aus der Luft und stürzt
        sich auf geschwächte Pokémon. Tragosso ist
        seine bevorzugte Beute.
      es: |-
        Revolotea por el cielo en busca de un Pokémon
        débil al que convertir en su presa. Tiene una
        particular debilidad por los Cubone.
      it: |-
        Volteggia nel cielo alla ricerca di Pokémon
        indeboliti. È ghiotto di Cubone.
    ultra-sun:
      ja-Hrkt: |-
        くった　えものの　ホネを　つかって
        きように　すを　つくる。　おおくの
        ホネは　カラカラの　ものだ。
      ja: |-
        食った　獲物の　骨を　使って
        器用に　巣を　作る。
        多くの　骨は　カラカラの　ものだ。
      ko: |-
        먹은 먹이의 뼈를 사용해
        솜씨 좋게 둥지를 만든다.
        대부분의 뼈는 탕구리의 것이다.
      zh-Hant: |-
        會利用吃掉獵物後剩下的骨頭
        靈巧地做成自己的巢穴。
        大部分的骨頭是來自卡拉卡拉。
      zh-Hans: |-
        会使用所吃猎物的骨头
        灵巧地做成自己的巢穴。
        大多数骨头都是卡拉卡拉的。
      en: |-
        It skillfully arranges the bones of its prey to
        construct its nest. Most of the bones
        are Cubone.
      fr: |-
        Il utilise avec dextérité les ossements de
        ses proies pour construire son nid. La plupart
        de ces os appartenaient à des Osselait.
      de: |-
        Nachdem es seine Beute verspeist hat, baut es
        aus deren Knochen mit viel Geschick sein Nest.
        Die meisten davon stammen von Tragosso.
      es: |-
        Utiliza con pericia los huesos de las presas que
        devora para así construir un nido. La mayoría de
        los huesos pertenecen a los Cubone.
      it: |-
        Costruisce abilmente il nido usando le ossa
        delle sue prede, soprattutto quelle di Cubone.
    ultra-moon:
      ja-Hrkt: |-
        バルチャイの　ために　いつも　エサを
        さがしている。　よわった　ポケモンを
        みつけしだい　すまで　つれさるぞ。
      ja: |-
        バルチャイの　ために　いつも　エサを
        探している。　弱った　ポケモンを
        見つけ次第　巣まで　連れ去るぞ。
      ko: |-
        벌차이를 위해 언제나 먹이를
        찾고 있다. 약해진 포켓몬을
        발견하는 대로 둥지로 데려간다.
      zh-Hant: |-
        為了禿鷹丫頭不斷尋找食物。
        只要發現衰弱的寶可夢，
        就會捉起來帶回巢穴去。
      zh-Hans: |-
        为了秃鹰丫头而一直寻找着食物。
        一旦找到体弱的宝可梦
        就会掳去自己的巢穴。
      en: |-
        It’s always searching for food for Vullaby. When
        it finds a weak Pokémon, Mandibuzz swoops it
        right off to its nest.
      fr: |-
        Il est toujours à la recherche de nourriture pour
        Vostourno. Quand il trouve un Pokémon affaibli,
        il fond sur la proie et l’emporte dans son nid.
      de: |-
        Für Skallyk geht es pausenlos auf Futtersuche.
        Trifft es auf ein geschwächtes Pokémon, bringt
        es dieses sogar bis zu seinem Nest.
      es: |-
        Busca sin cesar comida para alimentar a
        Vullaby. Atrapa al instante a cualquier Pokémon
        debilitado que aviste y lo lleva al nido.
      it: |-
        È sempre in cerca di cibo per Vullaby. Appena
        trova un Pokémon indebolito, lo trasporta subito
        al suo nido.
    sword:
      ja-Hrkt: |-
        あらっぽい　せいしつだが　まいごの
        バルチャイを　みかけると　すだつまで
        たいせつに　めんどうを　みる。
      ja: |-
        荒っぽい　性質だが　迷子の
        バルチャイを　見かけると　巣立つまで
        大切に　面倒を　みる。
      ko: |-
        성질이 난폭하지만 미아가 된
        벌차이를 발견하면 둥지를
        떠날 때까지 정성껏 돌봐준다.
      zh-Hant: |-
        雖然性情粗暴，如果遇到了
        迷路的禿鷹丫頭，便會細心
        照顧牠，直到牠長大離巢。
      zh-Hans: |-
        虽然性情粗暴，如果遇到了
        迷路的秃鹰丫头，便会精心
        照顾它，直到它长大离巢。
      en: |-
        Although it’s a bit of a ruffian, this Pokémon will
        take lost Vullaby under its wing and care for them
        till they’re ready to leave the nest.
      fr: |-
        Malgré son naturel brutal, il recueille volontiers
        les Vostourno égarés et prend soin d’eux
        jusqu’à ce qu’ils soient en âge de quitter le nid.
      de: |-
        Grypheldis sind ziemliche Grobiane. Begegnet
        ihnen ein verirrtes Skallyk, kümmern sie sich aber
        liebevoll um es, bis es das Nest verlassen kann.
      es: |-
        A pesar de su carácter violento, si avista un
        Vullaby perdido, lo acoge en su nido y lo cuida
        con esmero hasta que está listo para partir.
      it: |-
        Ha un’indole violenta, ma se trova un Vullaby
        che si è smarrito lo accudisce con amore fino
        a quando non è pronto a lasciare il nido.
    shield:
      ja-Hrkt: |-
        ひろった　ホネで　みを　かざる。
        まとう　ホネの　かたちには
        りゅうこうが　あるらしい。
      ja: |-
        拾った　骨で　身を　飾る。
        まとう　骨の　形には
        流行が　あるらしい。
      ko: |-
        주운 뼈로 몸을 장식한다.
        몸에 두르는 뼈의 모양은
        유행이 있는 듯하다.
      zh-Hant: |-
        把撿來的骨頭裝飾在身上。
        在骨頭形狀這方面
        似乎也是有流行趨勢的。
      zh-Hans: |-
        把捡来的骨头装饰在身上。
        在骨头形状这方面
        似乎也是有流行趋势的。
      en: |-
        They adorn themselves with bones. There seem
        to be fashion trends among them, as different
        bones come into and fall out of popularity.
      fr: |-
        Il se pare d’ossements qu’il a ramassés.
        Il semblerait qu’il choisisse la forme des os
        qu’il porte selon les dernières tendances.
      de: |-
        Es schmückt sich mit Knochen. Man kann wohl
        Trends beobachten, was für Knochenformen bei
        ihnen gerade besonders angesagt sind.
      es: |-
        Se engalana con los huesos que va recogiendo.
        Al parecer, la elección no es casual, sino que
        obedece a los dictados de la moda.
      it: |-
        Raccoglie ossa con cui adorna il suo corpo.
        Sembra che la forma di queste decorazioni
        cambi a seconda della moda del momento.
