    sword:
      ja-Hrkt: |-
        もえる　たてがみを　はためかせ
        じそく　２４０キロの　そくどで
        だいそうげんを　かけぬけるのだ。
      ja: |-
        燃える　たてがみを　はためかせ
        時速　２４０キロの　速度で
        大草原を　駆けぬけるのだ。
      ko: |-
        불타는 갈기를 휘날리며
        시속 240km의 속도로
        넓은 초원을 달려나간다.
      zh-Hant: |-
        任由燃燒的鬃毛隨風飄揚，
        以每小時２４０公里的速度
        在大草原上自在奔馳。
      zh-Hans: |-
        任由燃烧的鬃毛随风飘扬，
        以每小时２４０公里的速度
        在大草原自由地驰骋。
      en: |-
        This Pokémon can be seen galloping through
        fields at speeds of up to 150 mph, its fiery mane
        fluttering in the wind.
      fr: |-
        Ce Pokémon traverse les plaines à plus
        de 240 km/h, sa crinière flamboyante flottant
        au vent.
      de: |-
        Die lodernde Mähne dieses Pokémon flattert im
        Wind, wenn es mit einer Geschwindigkeit von
        240 km/h über Felder und Wiesen galoppiert.
      es: |-
        Su ardiente crin ondea al viento mientras
        atraviesa extensas praderas a una velocidad
        de 240 km/h.
      it: |-
        Sfreccia nelle praterie a una velocità di
        240 km/h, facendo sventolare la sua
        criniera ardente.
    shield:
      ja-Hrkt: |-
        いちばん　あしが　はやい　ものが
        リーダー。　むれが　いく　ばしょや
        はしる　そくどを　きめている。
      ja: |-
        いちばん　脚が　速い　ものが
        リーダー。　群れが　行く　場所や
        走る　速度を　決めている。
      ko: |-
        가장 발이 빠른 날쌩마가
        리더가 되어 무리가 갈 장소나
        달리는 속도를 정한다.
      zh-Hant: |-
        奔跑速度最快的烈焰馬
        會成為首領，決定族群
        前往的地點和奔跑速度。
      zh-Hans: |-
        奔跑速度最快的烈焰马
        会成为首领，决定族群
        前往的地点和奔跑速度。
      en: |-
        The fastest runner becomes the leader, and it
        decides the herd’s pace and direction of travel.
      fr: |-
        Au sein d’un troupeau, c’est le plus rapide qui
        devient le chef. Il choisit les lieux où se rendre
        et détermine la vitesse de galop.
      de: |-
        Das schnellste Exemplar wird zum Anführer
        bestimmt und gibt als solcher den Zielort und
        die Geschwindigkeit der Herde vor.
      es: |-
        El ejemplar más rápido se convierte en el líder
        de la manada y decide tanto el ritmo de galope
        como su destino.
      it: |-
        L’esemplare più veloce diventa il capo del
        gruppo e ne decide velocità e destinazione.
    legends-arceus:
      en: |-
        Fiery mane aglow, Rapidash darts like an arrow across the land.
        This prodigiously swift creature can traverse the vast region of
        Hisui in a day and a half.
