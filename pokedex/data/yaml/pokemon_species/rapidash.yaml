    white-2:
      en: |-
        When at an all-out gallop, its
        blazing mane sparkles, enhancing
        its beautiful appearance.
    x:
      ja-Hrkt: |-
        はやく　うごく　ぶったいを　みると
        きょうそう　したくなり　もうれつな
        スピードで　おいかけ　はじめる。
      ja: |-
        速く　動く　物体を　見ると
        競争したくなり　猛烈な
        スピードで　追いかけはじめる。
      ko: |-
        빠르게 움직이는 물체를 보면
        경주를 하고 싶어져서 맹렬한
        스피드로 쫓아가기 시작한다.
      en: |-
        Very competitive, this Pokémon will chase anything
        that moves fast in the hopes of racing it.
      fr: |-
        Doté d’un esprit de compétition, il poursuit toute
        créature rapide pour faire la course.
      de: |-
        Dieses Pokémon verfolgt schnelle Objekte in der
        Hoffnung, ein Wettrennen gegen sie zu gewinnen.
      es: |-
        Muy competitivo, este Pokémon perseguirá a todo lo
        que se mueva rápido e intentará salir airoso.
      it: |-
        Pokémon molto competitivo, rincorre tutto ciò
        che si muove veloce, sperando di superarlo.
    'y':
      ja-Hrkt: |-
        はしる　そくどは　じそく２４０キロ。
        たてがみの　ほのおが　はげしく　もえ
        やの　ように　かけぬける。
      ja: |-
        走る　速度は　時速２４０キロ。
        たてがみの　炎が　激しく　燃え
        矢のように　駆け抜ける。
      ko: |-
        달리는 속도는 시속 240km.
        갈기의 불꽃이 세차게 타오르고
        화살처럼 달려나간다.
      en: |-
        It gallops at nearly 150 mph. With its mane blazing
        ferociously, it races as if it were an arrow.
      fr: |-
        Son galop dépasse les 240 km/h. Il file comme
        une flèche, laissant flotter sa crinière ardente.
      de: |-
        Seine Mähne lodert auf, wenn es mit 240 km/h
        pfeilschnell galoppiert.
      es: |-
        Galopa a casi 240 km por hora. Su crin ardiente
        parece una flecha cuando corre.
      it: |-
        Galoppa alla velocità di 240 km/h. Corre come una
        freccia facendo ondeggiare la criniera ardente.
    omega-ruby:
      ja-Hrkt: |-
        いつもは　のんびり　のはらを　かけまわっているが
        ひとたび　ほんきを　だすと　たてがみの　ほのおが
        もえあがり　じそく２４０キロで　はしりだす。
      ja: |-
        いつもは　のんびり　野原を　駆けまわっているが
        一度　本気を　出すと　たてがみの　炎が
        燃えあがり　時速２４０キロで　走りだす。
      ko: |-
        평상시는 느긋하게 들판을 뛰어다니지만
        한 번 마음먹으면 갈기의 불꽃을
        불태우며 시속 240km로 달린다.
      en: |-
        Rapidash usually can be seen casually cantering in the
        fields and plains. However, when this Pokémon turns serious,
        its fiery manes flare and blaze as it gallops its way up to
        150 mph.
      fr: |-
        On voit souvent Galopa trotter dans les champs et les plaines.
        Cependant, lorsque ce Pokémon s’en donne la peine, il peut
        galoper à plus de 240 km/h et sa crinière flamboyante
        s’embrase.
      de: |-
        Man kann Gallopa dabei beobachten, wie es lässig über Felder
        und Wiesen galoppiert. Wenn dieses Pokémon jedoch Ernst
        macht, erreicht es bis zu 240 km/h. Dann beginnt seine Mähne
        zu lodern.
      es: |-
        A Rapidash se le suele ver trotando sin rumbo fijo por los
        campos y llanos. Cuando tiene que ir a algún sitio en concreto,
        se le aviva el fuego de las melenas y emprende el galope
        llameante llegando a los 240 km/h.
      it: |-
        Rapidash si vede comunemente galoppare in campagne
        e pianure. Quando si lancia a tutta velocità la sua criniera
        infuocata brilla e arde mentre galoppa fino a 240 km/h.
    alpha-sapphire:
      ja-Hrkt: |-
        いつもは　のんびり　のはらを　かけまわっているが
        ひとたび　ほんきを　だすと　たてがみの　ほのおが
        もえあがり　じそく２４０キロで　はしりだす。
      ja: |-
        いつもは　のんびり　野原を　駆けまわっているが
        一度　本気を　出すと　たてがみの　炎が
        燃えあがり　時速２４０キロで　走りだす。
      ko: |-
