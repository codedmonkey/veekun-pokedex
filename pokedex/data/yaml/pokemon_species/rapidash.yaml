      fr: |-
        On voit souvent Galopa trotter dans les champs et les plaines.
        Cependant, lorsque ce Pokémon s’en donne la peine, il peut
        galoper à plus de 240 km/h et sa crinière flamboyante
        s’embrase.
      de: |-
        Man kann Gallopa dabei beobachten, wie es fröhlich über
        Felder und Wiesen galoppiert. Wenn dieses Pokémon jedoch
        Ernst macht, erreicht es bis zu 240 km/h. Dann beginnt seine
        Mähne zu lodern.
      es: |-
        A Rapidash se le suele ver trotando sin rumbo fijo por los
        campos y llanos. Cuando tiene que ir a algún sitio en
        concreto, se le aviva el fuego de las melenas y emprende
        el galope llameante llegando a los 240 km/h.
      it: |-
        Rapidash si vede comunemente galoppare in campagne
        e pianure. Quando si lancia a tutta velocità la sua criniera
        infuocata brilla e arde mentre galoppa fino a 240 km/h.
    lets-go-pikachu:
      ja-Hrkt: |-
        とにかく　はしるのが　だいすきで
        じぶんより　はやいものを　みつけると
        ぜんそくりょくで　おいかける。
      ja: |-
        とにかく　走るのが　大好きで
        自分より　速いものを　見つけると
        全速力で　追いかける。
      ko: |-
        그저 달리는 것을 좋아해서
        자신보다 빠른 상대를 발견하면
        전속력으로 쫓아간다.
      zh-Hant: |-
        非常喜愛奔跑，只要看見
        跑得比自己快的東西，
        就會立刻全速追上去。
      zh-Hans: |-
        总之就是喜欢跑步。如果
        发现有谁跑得比自己更快，
        就会用尽全力去追赶。
      en: |-
        Just loves to run. If it sees something faster
        than itself, it will give chase at top speed.
      fr: |-
        Il aime la course. Il poursuit tout ce qui va
        plus vite que lui. Question d’honneur.
      de: |-
        Es galoppiert für sein Leben gern. Entdeckt es
        etwas, das schneller ist als es selbst, nimmt es
        blitzschnell die Verfolgung auf.
      es: |-
        Le encanta galopar. Si ve algo más rápido,
        intentará alcanzarlo a toda velocidad.
      it: |-
        Ama correre, e quando incontra qualcuno
        più veloce si mette a inseguirlo con tutte
        le sue forze.
    lets-go-eevee:
      ja-Hrkt: |-
        とにかく　はしるのが　だいすきで
