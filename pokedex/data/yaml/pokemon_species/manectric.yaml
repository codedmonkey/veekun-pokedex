    white-2:
      en: |-
        It discharges electricity from its
        mane. It creates a thundercloud
        overhead to drop lightning bolts.
    x:
      ja-Hrkt: |-
        ひとまえには　めったに　すがたを
        みせない。かみなりの　おちた
        ばしょに　すみかが　あると　いう。
      ja: |-
        人前には　めったに　姿を　見せない。
        雷の　落ちた　場所に
        住処が　あると　いう。
      ko: |-
        좀처럼 사람 앞에 모습을
        드러내지 않는다. 번개가 떨어진
        곳에 보금자리가 있다고 한다.
      en: |-
        It rarely appears before people. It is said to nest
        where lightning has fallen.
      fr: |-
        Ce Pokémon évite le contact des humains.
        On raconte qu’il fait son nid là où la foudre est déjà
        tombée.
      de: |-
        Es zeigt sich selten den Menschen. Man sagt, dass es
        sein Nest baut, wo der Blitz eingeschlagen hat.
      es: |-
        No suele aparecer ante la gente. Dicen que suele
        colocar su nido donde caen los rayos.
      it: |-
        Raramente si mostra agli umani. Si dice che nidifichi
        nelle zone dove è caduto un fulmine.
    'y':
      ja-Hrkt: |-
        たてがみから　ほうでんしている。
        ずじょうに　かみなりぐもを　つくり
        いなずまを　おとして　こうげきする。
      ja: |-
        たてがみから　放電している。
        頭上に　雷雲を　作り
        稲妻を　落として　攻撃する。
      ko: |-
        갈기에서 방전을 하고 있다.
        머리 위에 번개 구름을 만들고
        천둥번개를 떨어뜨려 공격한다.
      en: |-
        It discharges electricity from its mane. It creates a
        thundercloud overhead to drop lightning bolts.
      fr: |-
        Il libère l’électricité par sa crinière. Il crée un nuage
        d’orage pour appeler la foudre.
      de: |-
        Aus seiner Mähne entlädt es Elektrizität. Es generiert
        eine Gewitterwolke, aus der es Blitze entlädt.
      es: |-
        Descarga electricidad desde su melena. Crea
        nubarrones desde los que lanza rayos.
      it: |-
        Scarica elettricità dalla criniera. Crea nubi
        temporalesche in cielo che fanno cadere saette.
    omega-ruby:
      ja-Hrkt: |-
        たてがみから　いつも　ほうでんしているため
        ひばなで　やまかじを　おこしてしまう　ことも。
        たたかいに　なると　かみなりぐもを　つくりだす。
      ja: |-
        たてがみから　いつも　放電しているため
        火花で　山火事を　起してしまう　ことも。
        戦いに　なると　雷雲を　つくりだす。
      ko: |-
        갈기를 통해 항상 방전 중이기 때문에
        불꽃이 튀어 산불이 일어나기도 한다.
        싸우게 되면 번개 구름을 만들어낸다.
      en: |-
        Manectric is constantly discharging electricity from its mane.
        The sparks sometimes ignite forest fires. When it enters a
        battle, this Pokémon creates thunderclouds.
      fr: |-
        La crinière d’Élecsprint libère constamment de l’électricité.
        Les étincelles déclenchent parfois des feux de forêt.
        Au début de ses combats, ce Pokémon crée des nuages
        orageux.
      de: |-
        Voltenso entlädt ständig Elektrizität aus seiner Mähne.
        Es fliegen dabei Funken, die zuweilen zu Waldbränden führen.
        In einem Kampf erzeugt dieses Pokémon Gewitterwolken.
      es: |-
        Manectric está continuamente descargando electricidad por
        las melenas, y a veces causa incendios en el bosque con las
        chispas que suelta. Cuando entra en combate, este Pokémon
        crea nubarrones.
      it: |-
        Manectric scarica costantemente l’elettricità dalla propria
        criniera. Spesso le scintille scatenano incendi nei boschi.
        In lotta questo Pokémon crea nubi temporalesche.
    alpha-sapphire:
      ja-Hrkt: |-
        たてがみから　つよい　でんきを　はっしている。
        くうきちゅうの　でんきを　たてがみに　あつめ
        あたまの　うえに　かみなりぐもを　つくりだす。
      ja: |-
        たてがみから　強い　電気を　発している。
        空気中の　電気を　たてがみに　集め
        頭の　上に　雷雲を　つくりだす。
      ko: |-
        갈기에서 강한 전기를 발산하고 있다.
        공기 중의 전기를 갈기에 모아
        머리 위에 번개 구름을 만들어낸다.
      en: |-
        Manectric discharges strong electricity from its mane.
        The mane is used for collecting electricity in the atmosphere.
        This Pokémon creates thunderclouds above its head.
      fr: |-
        Élecsprint peut libérer un courant intense de sa crinière.
        Cette crinière lui permet de récupérer l’électricité de
        l’atmosphère. Ce Pokémon peut créer des nuages orageux
        au-dessus de sa tête.
      de: |-
        Voltenso sammelt Elektrizität aus der Atmosphäre
        in seiner Mähne und entlädt diese. Dieses Pokémon
        erzeugt Gewitterwolken über seinem Kopf.
      es: |-
        Manectric acumula en las melenas la electricidad que hay en
        el ambiente, y la descarga a través de ellas en grandes dosis.
        Este Pokémon crea nubarrones que se le quedan por encima
        de la cabeza.
      it: |-
        Manectric scarica forti scosse elettriche dalla propria criniera,
        usata come collettore dell’elettricità presente nell’atmosfera.
        Crea inoltre nubi temporalesche sopra la sua testa.
    ultra-sun:
      ja-Hrkt: |-
        ふしぜんな　かみなりぐもの　したには
        ライボルトが　いる。　かみなりと
        おなじ　スピードで　かけると　いう。
      ja: |-
        不自然な　雷雲の　下には
        ライボルトが　いる。　雷と
        同じ　スピードで　駆けると　いう。
      ko: |-
        이상한 번개 구름 아래에는
        썬더볼트가 있다. 번개와
        같은 스피드로 달린다고 한다.
      zh-Hant: |-
        在不自然的雷雲之下有著
        雷電獸的身影。據說牠
        奔馳的速度和雷電一樣快。
      zh-Hans: |-
        在不自然的雷云之下有着雷电兽。
        听说会用和雷同等的速度奔驰。
      en: |-
        Manectric can be found beneath unnatural
        thunderclouds. People say it can run at the
        same speed as lightning striking.
      fr: |-
        Si un nuage orageux un peu louche apparaît
        dans le ciel, un Élecsprint se trouve sûrement
        en dessous. On le dit aussi rapide que l’éclair.
      de: |-
        Voltenso ist unter ungewöhnlichen
        Gewitterwolken zu finden. Man erzählt sich,
        dass es so schnell wie ein Blitz sei.
      es: |-
        Cuando se dan nubes de tormenta un tanto
        inusuales, este Pokémon suele hallarse debajo.
        Se dice que se mueve a la velocidad del rayo.
      it: |-
        Se si notano strane nubi temporalesche, sotto
        di loro si vedrà questo Pokémon. Si dice che sia
        in grado di correre alla velocità del fulmine.
    ultra-moon:
      ja-Hrkt: |-
        でんきで　きんにくを　しげきするので
        すばやく　うごける。　きんにくつうも
        でんきで　ほぐすので　すぐ　なおる。
      ja: |-
        電気で　筋肉を　刺激するので
        素早く　動ける。　筋肉痛も
        電気で　ほぐすので　すぐ　治る。
      ko: |-
        전기로 근육을 자극해서
        재빠르게 움직일 수 있다. 근육통도
        전기로 풀기 때문에 금방 낫는다.
      zh-Hant: |-
        會用電流刺激肌肉，所以能
        迅速行動。電流同時也能幫助
        肌肉放鬆，讓酸痛迅速痊癒。
      zh-Hans: |-
        用电刺激肌肉，所以能迅速行动。
        用电也能缓解肌肉疼痛，
        因此很快会治愈。
      en: |-
        It stimulates its own muscles with electricity, so
        it can move quickly. It eases its soreness with
        electricity, too, so it can recover quickly as well.
      fr: |-
        Il diffuse de l’électricité dans ses membres pour
        augmenter sa vitesse. C’est également ainsi
        qu’il apaise ses douleurs musculaires.
      de: |-
        Da es seine Muskeln mit Elektrizität stimuliert,
        kann es sich sehr schnell bewegen. Auch
        Muskelkater heilt es sofort mit Strom.
      es: |-
        La electricidad estimula su musculatura para
        que pueda moverse a gran velocidad y le ayuda
        a recuperarse del dolor muscular rápidamente.
      it: |-
        L’elettricità gli stimola i muscoli rendendolo
        più veloce e inoltre allevia i suoi dolori muscolari
        facendolo tornare rapidamente in forma.
    sword:
      ja-Hrkt: |-
        でんきで　きんにくを　しげきするので
        すばやく　うごける。　きんにくつうも
        でんきで　ほぐすので　すぐ　なおる。
      ja: |-
        電気で　筋肉を　刺激するので
        素早く　動ける。　筋肉痛も
        電気で　ほぐすので　すぐ　治る。
      ko: |-
        전기로 근육을 자극해서
        재빠르게 움직일 수 있다. 근육통도
        전기로 풀기 때문에 금방 낫는다.
      zh-Hant: |-
        會用電流刺激肌肉，因此
        能迅速行動。電流也能讓
        肌肉放鬆並快速治癒酸痛。
      zh-Hans: |-
        用电刺激肌肉，所以能迅速行动。
        用电也能缓解肌肉疼痛，
        因此很快会治愈。
      en: |-
        It stimulates its own muscles with electricity, so
        it can move quickly. It eases its soreness with
        electricity, too, so it can recover quickly as well.
      fr: |-
        Il diffuse de l’électricité dans ses membres
        pour augmenter sa vitesse. C’est également
        ainsi qu’il apaise ses douleurs musculaires.
      de: |-
        Da es seine Muskeln mit Elektrizität stimuliert,
        kann es sich sehr schnell bewegen. Auch
        Muskelkater heilt es sofort mit Strom.
      es: |-
        La electricidad estimula su musculatura para que
        pueda moverse a gran velocidad y le ayuda a
        recuperarse del dolor muscular rápidamente.
      it: |-
        L’elettricità gli stimola i muscoli rendendolo più
        veloce e inoltre allevia i suoi dolori muscolari
        facendolo tornare rapidamente in forma.
    shield:
      ja-Hrkt: |-
        ひとまえには　めったに　すがたを
        みせない。　かみなりの　おちた
        ばしょに　すみかが　あると　いう。
      ja: |-
        人前には　めったに　姿を
        見せない。　雷の　落ちた
        場所に　すみかが　あると　いう。
      ko: |-
        좀처럼 사람 앞에 모습을
        드러내지 않는다. 번개가 떨어진
        곳에 보금자리가 있다고 한다.
      zh-Hant: |-
        極少在人們面前現身，
        據說牠的住所就在
        雷電落下的地方。
      zh-Hans: |-
        极少出现在人前。
        据说它的住所就在雷电落下的地方。
      en: |-
        It rarely appears before people. It is said to nest
        where lightning has fallen.
      fr: |-
        Ce Pokémon évite de se montrer aux humains.
        On raconte qu’il fait son nid aux endroits
        où la foudre s’est abattue.
      de: |-
        Es zeigt sich selten den Menschen. Man sagt,
        dass es sein Nest an Orten baut, wo ein Blitz
        eingeschlagen hat.
      es: |-
        Rara vez aparece ante la gente. Dicen que suele
        colocar su madriguera donde caen rayos.
      it: |-
        Raramente si mostra agli umani. Si dice che
        viva nelle zone dove è caduto un fulmine.
