flygon:
  base_happiness: 50
  capture_rate: 45
  color: green
  egg_groups:
    - bug
    - dragon
  evolution_chain: trapinch
  evolves_from: vibrava
  flavor_text:
    ruby:
      en: |-
        FLYGON is nicknamed “the elemental 
        spirit of the desert.” Because its
        flapping wings whip up a cloud of sand,this POKéMON is always enveloped in a
        sandstorm while flying.
    sapphire:
      en: |-
        FLYGON whips up a sandstorm by
        flapping its wings. The wings create a
        series of notes that sound like singing.Because the “singing” is the only thing
        that can be heard in a sandstorm, this
        POKéMON is said to be the desert spirit.
    emerald:
      en: |-
        The flapping of its wings sounds like
        singing. To prevent detection by enemies,
        it hides itself by flapping up a cloud of
        desert sand.
    firered:
      en: |-
        It hides itself by kicking up desert sand
        with its wings. Red covers shield its eyes
        from sand.
    leafgreen:
      en: |-
        It hides itself by kicking up desert sand
        with its wings. Red covers shield its eyes
        from sand.
    diamond:
      en: |-
        It whips up sandstorms with
        powerful flaps of its wings. It is
        known as “The Desert Spirit.”
    pearl:
      en: |-
        It whips up sandstorms with
        powerful flaps of its wings. It is
        known as “The Desert Spirit.”
    platinum:
      en: |-
        It whips up sandstorms with
        powerful flaps of its wings. It is
        known as “The Desert Spirit.”
    heartgold:
      en: |-
        It is nicknamed “The Desert
        Spirit” because the flapping of its
        wings sounds like a woman singing.
    soulsilver:
      en: |-
        It is nicknamed “The Desert
        Spirit” because the flapping of its
        wings sounds like a woman singing.
    black:
      en: |-
        It whips up sandstorms with
        powerful flaps of its wings. It is
        known as “The Desert Spirit.”
      fr: |-
        Son puissant battement d’ailes
        provoque des tempêtes de sable.
        On l’appelle “esprit du désert”.
    white:
      en: |-
        It whips up sandstorms with
        powerful flaps of its wings. It is
        known as “The Desert Spirit.”
      fr: |-
        Son puissant battement d’ailes
        provoque des tempêtes de sable.
        On l’appelle “esprit du désert”.
    black-2:
      en: |-
        Known as “The Desert Spirit,”
        this Pokémon hides in the sandstorms
        it causes by beating its wings.
    white-2:
      en: |-
        Known as “The Desert Spirit,”
        this Pokémon hides in the sandstorms
        it causes by beating its wings.
    x:
      ja-Hrkt: |-
        ハネの　はばたきで　さばくの　すなを
        まきあげて　すがたを　かくす。あかい
        カバーが　すなから　めを　まもる。
      ja: |-
        羽の　羽ばたきで　砂漠の　砂を
        巻き上げて　姿を　隠す。
        赤い　カバーが　砂から　目を　守る。
      ko: |-
        날갯짓으로 모래 폭풍을
        일으켜 모습을 감춘다. 빨간
        덮개가 모래로부터 눈을 보호한다.
      en: |-
        It hides itself by kicking up desert sand with its
        wings. Red covers shield its eyes from sand.
      fr: |-
        Il se cache du regard des autres en soulevant le sable
        du désert avec ses ailes. Une fine peau rouge protège
        ses yeux du sable.
      de: |-
        Es versteckt sich, indem es mit seinen Flügeln
        Wüstensand aufwirbelt. Rote Augenlider schützen
        es vor dem Sand.
      es: |-
        Su medio es el desierto. Para esconderse, levanta
        arena con las patas. Tiene los ojos protegidos con
        mallas rojas.
      it: |-
        Solleva sabbia con le ali per nascondersi. Un
        rivestimento rosso protegge gli occhi dalla sabbia
        stessa.
    'y':
      ja-Hrkt: |-
        さばくのせいれい　と　よばれる。
        はばたくことで　まきおこした
        すなあらしの　なかに　かくれている。
      ja: |-
        砂漠の精霊　と　呼ばれる。
        はばたくことで　巻き起こした
        砂嵐の　中に　隠れている。
      ko: |-
        사막의 정령이라고 불린다.
        날개를 쳐서 일으킨
        모래바람 속에 숨어 있다.
      en: |-
        Known as “The Desert Spirit,” this Pokémon hides in
        the sandstorms it causes by beating its wings.
      fr: |-
        On l’appelle « esprit du désert ». Son puissant
        battement d’ailes provoque des tempêtes de sable
        qui le dissimulent.
      de: |-
        Auch bekannt als „Geist der Wüste“. Es versteckt sich
        in Sandstürmen, die es durch seinen Flügelschlag
        erzeugt.
      es: |-
        Se le conoce como el Alma del Desierto. Levanta
        tormentas de arena al batir sus alas y se refugia en
        su interior.
      it: |-
        Viene chiamato “Spirito primordiale del deserto”.
        Si nasconde nelle tempeste di sabbia che genera
        battendo le ali.
    omega-ruby:
      ja-Hrkt: |-
        さばくの　せいれいと　よばれる　ポケモン。
        ハネの　はばたきで　すなを　まいあげるため
        とんでいる　ときは　いつも　すなあらしの　なか。
      ja: |-
        砂漠の　精霊と　呼ばれる　ポケモン。
        ハネの　羽ばたきで　砂を　舞い上げるため
        飛んでいる　ときは　いつも　砂嵐の　中。
      ko: |-
        사막의 정령이라 불리는 포켓몬이다.
        날갯짓이 모래를 흩날리기 때문에
        언제나 모래바람 속에서 날고 있다.
      en: |-
        Flygon is nicknamed “the elemental spirit of the desert.”
        Because its flapping wings whip up a cloud of sand, this
        Pokémon is always enveloped in a sandstorm while flying.
      fr: |-
        Libégon est surnommé « l’esprit élémentaire du désert ».
        Le battement de ses ailes soulève des nuages de sable.
        C’est pourquoi ce Pokémon est toujours entouré
        d’une tempête de sable quand il vole.
      de: |-
        Libelldra wird auch „Geist der Wüste“ genannt. Da seine
        flatternden Flügel eine Sandwolke aufwirbeln, ist dieses
        Pokémon beim Fliegen immer von einem Sandsturm umgeben.
      es: |-
        A Flygon se le conoce como el Espíritu del Desierto. Al volar,
        como levanta una nube de arena al batir las alas, está siempre
        envuelto en una tormenta de arena.
      it: |-
        Flygon è detto anche “Spirito primordiale del deserto”.
        Poiché le sue ali sollevano nubi di sabbia, è sempre
        accompagnato da una tempesta di sabbia quando vola.
    alpha-sapphire:
      ja-Hrkt: |-
        はばたきで　おこす　すなあらしの　なかから
        うたごえの　ような　はおと　だけが　きこえるため
        フライゴンは　さばくの　せいれいと　いわれた。
      ja: |-
        羽ばたきで　起こす　砂嵐の　中から
        歌声の　ような　羽音　だけが　聞こえるため
        フライゴンは　砂漠の　精霊と　いわれた。
      ko: |-
        날갯짓으로 일으키는 모래바람 속에서
        노랫소리 같은 날갯소리만이 들리기 때문에
        플라이곤은 사막의 정령이라고 전해졌다.
      en: |-
        Flygon whips up a sandstorm by flapping its wings. The wings
        create a series of notes that sound like singing. Because the
        “singing” is the only thing that can be heard in a sandstorm,
        this Pokémon is said to be the desert spirit.
      fr: |-
        Libégon peut déclencher une tempête de sable en battant
        des ailes. Les ailes créent une suite de notes ressemblant
        à une mélodie. Comme cette « mélodie » est le seul son
        audible, on appelle ce Pokémon l’esprit du désert.
      de: |-
        Libelldra wirbelt einen Sandsturm auf, wenn es mit den
        Flügeln schlägt. Seine Flügel erzeugen dabei Töne, die wie
        Gesang klingen. Da dieser „Gesang“ das Einzige ist, was man
        in einem Sandsturm hört, wird es auch Wüstengeist genannt.
      es: |-
        Flygon puede provocar una tormenta de arena batiendo las
        alas. Estas, al ser agitadas, crean una melodía. Y, como las
        “melodías” pueden oírse cuando hay tormenta, dicen que es
        el espíritu del desierto.
      it: |-
        Flygon crea tempeste di sabbia agitando le ali, che emettono
        note musicali creando una sorta di canto. Poiché questo
        “canto” è l’unica cosa udibile durante la tempesta, Flygon
        è considerato lo spirito del deserto.
    sun:
      ja-Hrkt: |-
        はばたく　はおとは　まるで　うたごえ。
        おとに　みせられたものは　すなあらしに
        まきこまれ　フライゴンの　えじきに。
      ja: |-
        羽ばたく　羽音は　まるで　歌声。
        音に　魅せられた者は　砂嵐に
        巻き込まれ　フライゴンの　餌食に。
      ko: |-
        날개 치는 날갯소리는 마치 노랫소리 같다.
        소리에 매혹된 자는 모래 폭풍에
        휩쓸려 플라이곤의 먹이가 된다.
      zh-Hant: |-
        揮動翅膀的振翅聲簡直有如歌聲。
        凡是被這聲音迷惑的，
        最終會被捲入沙暴成為沙漠蜻蜓的食物。
      zh-Hans: |-
        挥动翅膀的声音简直就是歌声。
        凡是被这声音迷惑的，
        最终会被卷入沙暴成为沙漠蜻蜓的食物。
      en: |-
        The flapping of its wings sounds something like
        singing. Those lured by the sound are enveloped
        in a sandstorm, becoming Flygon’s prey.
      fr: |-
        Le bruissement de ses ailes est très mélodieux.
        Les malheureux envoûtés par ce chant se
        retrouvent prisonniers de sa tempête de sable.
      de: |-
        Erzeugt mit seinem Flügelschlag Töne, die wie
        Gesang klingen. Der so bezirzte Gegner wird von
        einem Sandsturm umgeben und zu seiner Beute.
      es: |-
        Al batir las alas, crea una melodía que atrae a
        sus presas. Cuando estas se acercan, quedan
        atrapadas en una tormenta de arena.
      it: |-
        Agitando le ali, emette un suono simile a un
        canto. Le prede ammaliate si ritrovano
        intrappolate in una tempesta di sabbia.
    moon:
      ja-Hrkt: |-
        みずからが　まきおこす　すなあらしの
        ちゅうしんに　いるので　めったに
        ひとまえに　あらわれない　ポケモン。
      ja: |-
        自らが　巻き起こす　砂嵐の
        中心に　いるので　滅多に
        人前に　現れない　ポケモン。
      ko: |-
        스스로 일으키는 모래바람의
        중심에 있어 좀처럼
        사람들 앞에 나타나지 않는 포켓몬이다.
      zh-Hant: |-
        因為總是位於自己引發的沙暴中心，
        所以是極少現身於人前的寶可夢。
      zh-Hans: |-
        因为位于自己卷起的沙暴中心，
        所以是很少现身于人前的宝可梦。
      en: |-
        This Pokémon hides in the heart of sandstorms
        it creates and seldom appears where people
        can see it.
      fr: |-
        Comme il est souvent caché au cœur des
        tempêtes de sable qu’il déclenche, ce Pokémon
        n’est que rarement aperçu par l’homme.
      de: |-
        Da es sich stets im Zentrum des von ihm
        entfachten Sandsturms aufhält, bekommen
        Menschen es so gut wie nie zu Gesicht.
      es: |-
        Al batir las alas, provoca tormentas de arena
        que lo ocultan por completo, por lo que rara vez
        se ha visto a este Pokémon.
      it: |-
        Si nasconde nelle tempeste di sabbia che
        genera sbattendo le ali. Raramente gli esseri
        umani riescono a vederlo.
    ultra-sun:
      ja-Hrkt: |-
        はばたきで　すなあらしを　まきおこし
        そこに　ワルビアルを　ひそませる。
        つかまえた　えものは　わけあうぞ。
      ja: |-
        羽ばたきで　砂嵐を　巻き起こし
        そこに　ワルビアルを　潜ませる。
        捕まえた　獲物は　分け合うぞ。
      ko: |-
        날갯짓으로 모래바람을 일으켜
        그곳에 악비아르를 숨긴다.
        잡은 먹이는 나누어 갖는다.
      zh-Hant: |-
        會拍動翅膀捲起沙暴，
        讓流氓鱷潛伏在裡面。
        捉到的獵物會一起分享。
      zh-Hans: |-
        挥动翅膀卷起沙暴，
        让流氓鳄潜伏在那里。
        捉到的猎物会一起分享。
      en: |-
        By flapping their wings, Flygon cause
        sandstorms that conceal Krookodile.
        The team then splits the prey they catch.
      fr: |-
        D’un battement d’ailes, il provoque des
        tempêtes qui engloutissent les Crocorible.
        Il partage ses proies avec ses congénères.
      de: |-
        Durch das Schlagen ihrer Flügel erzeugen sie
        Sandstürme, von denen Rabigator erfasst
        werden. Gefangene Beute teilen sie auf.
      es: |-
        Al batir las alas levanta tormentas de arena en
        las que se esconden los Krookodile, para luego
        compartir las presas que cacen entre ambos.
      it: |-
        Sbattendo le ali, genera tempeste di sabbia in
        cui fa nascondere Krookodile, poi spartisce
        con lui le prede catturate.
    ultra-moon:
      ja-Hrkt: |-
        うつくしい　うたの　ような　はおとに
        こころを　うばわれて　さばくで
        そうなんする　ひとが　ぞくしゅつ。
      ja: |-
        美しい　歌の　ような　羽音に
        心を　奪われて　砂漠で
        遭難する　人が　続出。
      ko: |-
        아름다운 노랫소리 같은 날갯소리에
        마음을 빼앗겨 사막에서
        조난당하는 사람이 속출한다.
      zh-Hant: |-
        不斷有人被牠如同
        美麗歌聲般的振翅聲迷住，
        因而在沙漠中遇難。
      zh-Hans: |-
        由于会被美丽歌声般的
        振翅声夺走心神，
        因此沙漠中不断有人遇难。
      en: |-
        People continue to have their hearts stolen by
        its enchanting songs and find themselves
        stranded in the desert.
      fr: |-
        Il n’est pas rare que des gens se perdent dans
        le désert après avoir succombé au charme
        du son mélodieux qu’il émet avec ses ailes.
      de: |-
        Sein wie wunderschöner Gesang klingender
        Flügelschlag verzaubert Menschen und sorgt
        ständig dafür, dass diese in der Wüste stranden.
      es: |-
        Muchas personas se han perdido en el desierto
        tras quedar cautivadas por el sonido que emite
        al batir las alas, semejante a una bella melodía.
      it: |-
        Genera un suono simile a un canto melodioso
        con le ali. Molti, incantati da questa melodia,
        finiscono per smarrirsi nel deserto.
    sword:
      ja-Hrkt: |-
        みずからが　まきおこす　すなあらしの
        ちゅうしんに　いるので　めったに
        ひとまえに　あらわれない　ポケモン。
      ja: |-
        自らが　巻き起こす　砂嵐の
        中心に　いるので　滅多に
        人前に　現れない　ポケモン。
      ko: |-
        스스로 일으키는 모래바람의
        중심에 있어 좀처럼
        사람들 앞에 나타나지 않는 포켓몬이다.
      zh-Hant: |-
        因為總是位於自己引發
        的沙暴中心，所以是極少
        現身於人前的寶可夢。
      zh-Hans: |-
        因为位于自己卷起的沙暴中心，
        所以是很少现身于人前的宝可梦。
      en: |-
        This Pokémon hides in the heart of sandstorms
        it creates and seldom appears where people
        can see it.
      fr: |-
        Comme il est souvent caché au cœur des
        tempêtes de sable qu’il déclenche, ce Pokémon
        n’est que rarement aperçu par l’Homme.
      de: |-
        Da es sich stets im Zentrum des von ihm
        entfachten Sandsturms aufhält, bekommen
        Menschen es so gut wie nie zu Gesicht.
      es: |-
        Al batir las alas, provoca tormentas de arena que
        lo ocultan por completo, por lo que rara vez se
        ha visto a este Pokémon.
      it: |-
        Si nasconde nelle tempeste di sabbia che
        genera sbattendo le ali. Raramente gli esseri
        umani riescono a vederlo.
    shield:
      ja-Hrkt: |-
        はばたく　おとが　おんなのひとの
        うつくしい　うたごえに　にているため
        さばくのせいれい　と　よばれている。
      ja: |-
        はばたく　音が　女の人の
        美しい　歌声に　似ているため
        砂漠の精霊　と　呼ばれている。
      ko: |-
        날갯짓하는 소리가 여성의
        아름다운 노랫소리와 닮아서
        사막의 정령이라고 불린다.
      zh-Hant: |-
        由於牠揮動翅膀的聲音
        好似女性優美的歌聲，
        因此被稱為沙漠精靈。
      zh-Hans: |-
        由于它挥动翅膀的声音
        好似女性优美的歌声，
        因此被称为沙漠精灵。
      en: |-
        It is nicknamed the Desert Spirit because the
        flapping of its wings sounds like a woman singing.
      fr: |-
        On l’appelle « l’esprit du désert », car ses
        battements d’ailes résonnent comme une mélodie
        entonnée par une voix douce.
      de: |-
        Sein Flügelschlag klingt wie wunderschöner
        Frauengesang. Daher nennt man es auch
        „Geist der Wüste“.
      es: |-
        El batir de sus alas suena como un bello canto de
        mujer. Se lo conoce como el Alma del Desierto.
      it: |-
        Viene chiamato anche “spirito del deserto”,
        poiché il suono del suo battito d’ali ricorda
        un bellissimo canto di donna.
