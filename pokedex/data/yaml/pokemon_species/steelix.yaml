  evolves_from: onix
  flavor_text:
    gold:
      en: |-
        Its body has been
        compressed deep
        under the ground.As a result, it is
        even harder than a
        diamond.
    silver:
      en: |-
        It is said that if
        an ONIX lives for
        over 100 years,its composition
        changes to become
        diamond-like.
    crystal:
      en: |-
        The many small
        metal particles
        that cover thisPOKéMON's body
        reflect bright
        light well.
    ruby:
      en: |-
        STEELIX lives even further underground
        than ONIX. This POKéMON is known to dig
        towards the earth’s core.There are records of this POKéMON
        reaching a depth of over six-tenths
        of a mile underground.
    sapphire:
      en: |-
        STEELIX lives even further underground
        than ONIX. This POKéMON is known to dig
        towards the earth’s core.There are records of this POKéMON
        reaching a depth of over six-tenths
        of a mile underground.
    emerald:
      en: |-
        STEELIX live even further underground
        than ONIX. This POKéMON is known to dig
        toward the earth’s core, reaching a depth
        of over six-tenths of a mile underground.
    firered:
      en: |-
        It is said that if an ONIX lives for over
        100 years, its composition changes to
        become diamond-like.
    leafgreen:
      en: |-
        Its body has been compressed deep under
        the ground. As a result, it is even harder
        than diamond.
    diamond:
      en: |-
        Tempered underground under
        high pressure and heat, its
        body is harder than any metal.
    pearl:
      en: |-
        It chews its way through boulders
        with its sturdy jaws. Its eyes can
        see in the darkness underground.
    platinum:
      en: |-
        It is thought its body transformed
        as a result of iron accumulating
        internally from swallowing soil.
    heartgold:
      en: |-
        Its body has been compressed deep
        under the ground. As a result,
        it is even harder than a diamond.
    soulsilver:
      en: |-
        It’s said that if an ONIX lives for 100
        years, its composition becomes
        diamondlike as it evolves into a STEELIX.
    black:
      en: |-
        It is thought its body transformed
        as a result of iron accumulating
        internally from swallowing soil.
      fr: |-
        On pense que son corps s’est
        transformé à cause du fer contenu
        dans la terre dont il se nourrit.
    white:
      en: |-
        It is thought its body transformed
        as a result of iron accumulating
        internally from swallowing soil.
      fr: |-
        On pense que son corps s’est
        transformé à cause du fer contenu
        dans la terre dont il se nourrit.
    black-2:
      en: |-
        The iron it ingested with the soil it
        swallowed transformed its body and
        made it harder than diamonds.
    white-2:
      en: |-
        The iron it ingested with the soil it
        swallowed transformed its body and
        made it harder than diamonds.
    x:
      ja-Hrkt: |-
        ちちゅうの　たかい　あつりょくと
        ねつで　きたえられた　からだは
        あらゆる　きんぞくよりも　かたい。
      ja: |-
        地中の　高い　圧力と　熱で
        鍛えられた　体は
        あらゆる　金属よりも　硬い。
      ko: |-
        땅속의 높은 압력과
        열로 단련된 몸은
        어떠한 금속보다도 단단하다.
      en: |-
        Tempered underground under high pressure and
        heat, its body is harder than any metal.
      fr: |-
        Grâce à la température élevée et à la haute pression
        souterraines, son corps est plus dur que le métal.
      de: |-
        Hoher Druck und hohe Temperaturen haben
        seinen Körper härter als Stahl werden lassen.
      es: |-
        Su cuerpo es más duro que cualquier metal debido a la
        gran presión y calor de su hábitat.
      it: |-
        Temprato dalla pressione e dal calore sotterraneo,
        il suo corpo è più duro di qualsiasi metallo.
    'y':
      ja-Hrkt: |-
        じょうぶな　あごで　がんせきを
        かみくだき　すすむ。まっくらな
        ちちゅうでも　みえる　めを　もつ。
      ja: |-
        丈夫な　アゴで　岩石を
        かみくだき　進む。真っ暗な
        地中でも　見える　目を　持つ。
      ko: |-
        튼튼한 턱으로 암석을 깨물어
        부수고 나아간다. 아주 캄캄한 땅속
        에서도 보이는 눈을 가지고 있다.
      en: |-
        It chews its way through boulders with its
        sturdy jaws. Its eyes can see in the
        darkness underground.
      fr: |-
        Ses mâchoires robustes peuvent broyer la pierre.
        Ses yeux percent la pénombre souterraine.
      de: |-
        Es beißt sich mit seinen Kiefern seinen Weg durch
        Felsen. Es kann auch im Dunkeln sehen.
      es: |-
        Atraviesa rocas a mordisco limpio. Sus ojos pueden
        ver en la oscuridad subterránea.
      it: |-
        Distrugge le rocce con le mascelle robuste per farsi
        strada. I suoi occhi vedono nei bui sotterranei.
    omega-ruby:
      ja-Hrkt: |-
        イワークよりも　ふかい　ちちゅうに　すんでいる。
        ちきゅうの　ちゅうしんに　むかって　ほりすすみ
        ふかさ　１キロに　たっする　ことも　ある。
      ja: |-
        イワークよりも　深い　地中に　すんでいる。
        地球の　中心に　向かって　掘り進み
        深さ　１キロに　達する　ことも　ある。
      ko: |-
        롱스톤보다 깊은 땅속에 살고 있다.
        지구의 중심을 향해 파고들어 가서
        깊이가 1km에 달하기도 한다.
      en: |-
        Steelix lives even further underground than Onix.
        This Pokémon is known to dig toward the earth’s core.
        There are records of this Pokémon reaching a depth of over
        six-tenths of a mile underground.
      fr: |-
        Steelix vit sous terre, encore plus profondément qu’Onix.
        On dit que ce Pokémon creuse vers le centre de la planète.
        On a déjà vu ce Pokémon descendre à plus d’un kilomètre
        de profondeur.
      de: |-
        Stahlos lebt noch tiefer unter der Erde als Onix. Dieses
        Pokémon gräbt immer in Richtung des Erdkerns. Nachweislich
        hat dieses Pokémon bereits Tiefen von 1 km erreicht.
      es: |-
        Steelix vive a mayor profundidad aún que Onix. Se le conoce
        por su tendencia a excavar hacia el interior del planeta. Hay
        datos que muestran que este Pokémon ha llegado a alcanzar
        1 km de profundidad.
      it: |-
        Steelix è noto per i suoi scavi in profondità, a distanze
        maggiori rispetto a Onix. Sono stati riportati record
        di profondità pari a 1 km sottoterra.
    alpha-sapphire:
      ja-Hrkt: |-
        イワークよりも　ふかい　ちちゅうに　すんでいる。
        ちきゅうの　ちゅうしんに　むかって　ほりすすみ
        ふかさ　１キロに　たっする　ことも　ある。
      ja: |-
        イワークよりも　深い　地中に　すんでいる。
        地球の　中心に　向かって　掘り進み
        深さ　１キロに　達する　ことも　ある。
      ko: |-
        롱스톤보다 깊은 땅속에 살고 있다.
        지구의 중심을 향해 파고들어 가서
        깊이가 1km에 달하기도 한다.
      en: |-
        Steelix lives even further underground than Onix.
        This Pokémon is known to dig toward the earth’s core.
        There are records of this Pokémon reaching a depth of
        over six-tenths of a mile underground.
      fr: |-
        Steelix vit sous terre, encore plus profondément qu’Onix.
        On dit que ce Pokémon creuse vers le centre de la planète.
        On a déjà vu ce Pokémon descendre à plus d’un kilomètre
        de profondeur.
      de: |-
        Stahlos lebt noch tiefer unter der Erde als Onix. Dieses
        Pokémon gräbt immer in Richtung des Erdkerns. Nachweislich
        hat dieses Pokémon bereits Tiefen von 1 km erreicht.
      es: |-
        Steelix vive a mayor profundidad aún que Onix. Se le conoce
        por su tendencia a excavar hacia el interior del planeta. Hay
        datos que muestran que este Pokémon ha llegado a alcanzar
        1 km de profundidad.
      it: |-
        Steelix è noto per i suoi scavi in profondità, a distanze
        maggiori rispetto a Onix. Sono stati riportati record
        di profondità pari a 1 km sottoterra.
    sword:
      ja-Hrkt: |-
        イワークが　１００ねん　いじょう
        いきると　からだの　せいぶんが
        ダイヤのように　へんかする　という。
      ja: |-
        イワークが　１００年　以上
        生きると　体の　成分が
        ダイヤのように　変化する　という。
      ko: |-
        롱스톤이 100년 이상 살면
        몸의 성분이 다이아몬드처럼
        변한다고 전해진다.
      zh-Hant: |-
        據說當大岩蛇活到了
        １００年以上，身體的成分
        就會變得如同鑽石一般。
      zh-Hans: |-
        据说当大岩蛇活到了
        １００年以上，身体的成分
        就会变得如同钻石一般。
      en: |-
        It is said that if an Onix lives for over 100 years,
        its composition changes to become diamond-like.
      fr: |-
        On raconte qu’il s’agit d’un Onix de plus
        de 100 ans dont la structure corporelle
        s’est rapprochée de celle du diamant.
      de: |-
        Es heißt, dass der Körper von Onix so hart wie
        ein Diamant werde, wenn es mehr als 100 Jahre
        lebt.
      es: |-
        Según dicen, si un Onix vive más de 100 años,
        su cuerpo adquiere una composición que
        recuerda a la de los diamantes.
      it: |-
        Un Onix vissuto più di 100 anni.
        Il suo corpo ha cambiato composizione
        ed è diventato duro come il diamante.
    shield:
      ja-Hrkt: |-
        つちと　いっしょに　のみこんだ
        てつぶんが　たまっていって　からだが
        へんかしたとも　かんがえられる。
      ja: |-
        土と　一緒に　飲みこんだ
        鉄分が　溜まっていって　体が
        変化したとも　考えられる。
      ko: |-
        흙과 함께 삼킨 강철이
        축적되어 몸이 변화한 것이라
        여겨지고 있다.
      zh-Hant: |-
        人們認為牠的身體是因為
        堆積了和泥土一起吞下的
        鐵質，才會發生變化的。
      zh-Hans: |-
        人们认为它的身体是因为
        堆积了很多和泥土一起吞下的
        铁元素，才会发生变化的。
      en: |-
        It is thought its body transformed as a result of
        iron accumulating internally from swallowing soil.
      fr: |-
        On pense que son corps s’est transformé à force
        d’avaler le fer contenu dans la terre en creusant.
      de: |-
        Man glaubt, dass sich sein Körper aufgrund des
        Schluckens von eisenhaltiger Erde verwandelt
        habe.
      es: |-
        Se cree que su cuerpo se ha ido transformando
        por el hierro acumulado en la tierra que ha
        ingerido.
      it: |-
        Si pensa che si sia trasformato a causa del
        ferro contenuto nella terra che mangia.
