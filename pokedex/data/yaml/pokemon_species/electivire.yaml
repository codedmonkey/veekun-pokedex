electivire:
  base_happiness: 50
  capture_rate: 30
  color: yellow
  egg_groups:
    - humanshape
  evolution_chain: electabuzz
  evolves_from: electabuzz
  flavor_text:
    diamond:
      en: |-
        It pushes the tips of its two tails
        against the foe, then lets loose
        with over 20,000 volts of power.
    pearl:
      en: |-
        It pushes the tips of its two tails
        against the foe, then lets loose
        with over 20,000 volts of power.
    platinum:
      en: |-
        Heedless of enemy attacks, it
        closes in, shoves its tails onto the
        foe, then looses high voltage.
    heartgold:
      en: |-
        As its electric charge amplifies,
        blue sparks begin to crackle between
        its horns.
    soulsilver:
      en: |-
        As its electric charge amplifies,
        blue sparks begin to crackle between
        its horns.
    black:
      en: |-
        Heedless of enemy attacks, it
        closes in, shoves its tails onto the
        foe, then looses high voltage.
      fr: |-
        Encaissant les attaques, il vient
        toucher l’ennemi de ses queues
        et lui inflige une forte décharge.
    white:
      en: |-
        Heedless of enemy attacks, it
        closes in, shoves its tails onto the
        foe, then looses high voltage.
      fr: |-
        Encaissant les attaques, il vient
        toucher l’ennemi de ses queues
        et lui inflige une forte décharge.
    black-2:
      en: |-
        The instant it presses the tips of its
        tails onto an opponent, it sends over
        20,000 volts of electricity into the foe.
    white-2:
      en: |-
        The instant it presses the tips of its
        tails onto an opponent, it sends over
        20,000 volts of electricity into the foe.
    x:
      ja-Hrkt: |-
        でんきを　いっぱいに　ためると
        ２ほんの　ツノの　あいだで　はげしく
        あおじろい　ひばなを　ちらす。
      ja: |-
        電気を　いっぱいに　ためると
        ２本の　ツノの　あいだで　激しく
        青白い　火花を　散らす。
      ko: |-
        전기를 가득 모으면
        2개의 뿔 사이에서 세차게
        푸르스름한 불티를 뿌린다.
      en: |-
        As its electric charge amplifies, blue sparks begin
        to crackle between its horns.
      fr: |-
        Des étincelles bleuâtres jaillissent entre ses 2 cornes
        quand il accumule beaucoup d’électricité.
      de: |-
        Bei voller Ladung zucken feurige, blassweiße
        Funken zwischen seinen zwei Hörnern hin und her.
      es: |-
        Al almacenar mucha electricidad, desprende chispas de
        una claridad increíble entre sus dos cuernos.
      it: |-
        Quando accumula tanta elettricità sparge scintille
        azzurrine dallo spazio tra le due corna.
    'y':
      ja-Hrkt: |-
        ２ほんの　しっぽの　さきを　あいてに
        おしあてて　２まんボルトいじょうの
        でんりゅうを　ながして　こうげき。
      ja: |-
        ２本の　尻尾の　先を　相手に
        押し当てて　２万ボルト以上の
        電流を　流して　攻撃。
      ko: |-
        2개의 꼬리 끝을 상대에게
        바싹 대어 2만 볼트 이상의
        전류를 흘려 공격한다.
      en: |-
        It pushes the tips of its two tails against the foe,
        then lets loose with over 20,000 volts of power.
      fr: |-
        Il place le bout de ses deux queues sur son ennemi
        et libère une décharge de 20 000 V.
      de: |-
        Es berührt den Gegner mit seinen beiden
        Schweifspitzen und entlädt dann über 20 000 V.
      es: |-
        Toca a su enemigo con las puntas de sus dos colas
        y le suelta una descarga de más de 20 000 voltios.
      it: |-
        Tocca il nemico con le sue due code e rilascia una
        scarica elettrica di oltre 20.000 volt.
    omega-ruby:
      ja-Hrkt: |-
        でんきを　いっぱいに　ためると
        ２ほんの　ツノの　あいだで　はげしく
        あおじろい　ひばなを　ちらす。
      ja: |-
        電気を　いっぱいに　ためると
        ２本の　ツノの　あいだで　激しく
        青白い　火花を　散らす。
      ko: |-
        전기를 가득 모으면
        2개의 뿔 사이에서 세차게
        푸르스름한 불티를 뿌린다.
      en: |-
        As its electric charge amplifies, blue sparks begin
        to crackle between its horns.
      fr: |-
        Des étincelles bleuâtres jaillissent entre ses 2 cornes
        quand il accumule beaucoup d’électricité.
      de: |-
        Bei voller Ladung zucken feurige, blassweiße Funken zwischen
        seinen zwei Hörnern hin und her.
      es: |-
        Al almacenar mucha electricidad, desprende chispas de una
        claridad increíble entre sus dos cuernos.
      it: |-
        Quando accumula tanta elettricità sparge scintille azzurrine
        dallo spazio tra le due corna.
    alpha-sapphire:
      ja-Hrkt: |-
        ２ほんの　しっぽの　さきを　あいてに
        おしあてて　２まんボルトいじょうの
        でんりゅうを　ながして　こうげき。
      ja: |-
        ２本の　尻尾の　先を　相手に
        押し当てて　２万ボルト以上の
        電流を　流して　攻撃。
      ko: |-
        2개의 꼬리 끝을 상대에게
        바싹 대어 2만 볼트 이상의
        전류를 흘려 공격한다.
      en: |-
        It pushes the tips of its two tails against the foe,
        then lets loose with over 20,000 volts of power.
      fr: |-
        Il place le bout de ses deux queues sur son ennemi et libère
        une décharge de 20 000 V.
      de: |-
        Es berührt den Gegner mit seinen beiden Schweifspitzen
        und entlädt dann über 20 000 V.
      es: |-
        Toca a su enemigo con las puntas de sus dos colas y le
        suelta una descarga de más de 20 000 voltios.
      it: |-
        Tocca il nemico con le sue due code e rilascia una scarica
        elettrica di oltre 20.000 volt.
    sun:
      ja-Hrkt: |-
        シッポの　さきを　てきに　おしつけ
        こうあつでんりゅうを　ながしこむ。
        いっしゅんで　てきは　くろコゲ。
      ja: |-
        尻尾の　先を　敵に　押しつけ
        高圧電流を　流し込む。
        一瞬で　敵は　黒コゲ。
      ko: |-
        꼬리의 끝을 적에게 밀어붙여
        고압 전류를 흘려보낸다.
        한순간에 적은 까맣게 탄다.
      zh-Hant: |-
        用尾巴尖端按住敵人，
        灌注高壓電流。
        敵人瞬間就變成黑炭了。
      zh-Hans: |-
        用尾巴尖尖按住敌人，
        输入高压电流。
        敌人瞬间就成黑炭了。
      en: |-
        It pushes the tips of its tails against its foes
        and then lets loose a high-voltage current.
        Its foes are burned to a crisp in an instant.
      fr: |-
        Il connecte le bout de sa queue à son ennemi
        et libère une violente décharge. L’ennemi est
        instantanément grillé.
      de: |-
        Es berührt Gegner mit seinen Schweifspitzen
        und entlädt dann starke Elektrizität. So kann
        es sie im Nullkommanichts verkohlen.
      es: |-
        Toca a su enemigo con la punta de sus colas
        y le suelta una descarga de alta tensión que lo
        deja achicharrado al instante.
      it: |-
        Tocca il nemico con la punta delle code
        e rilascia una scarica elettrica ad alto voltaggio
        che lo carbonizza all’istante.
    moon:
      ja-Hrkt: |-
        こうふんすると　むねを　うちならす。
        そのたびに　でんきひばなが　ちり
        らいめいが　あたりに　ひびきわたる。
      ja: |-
        興奮すると　胸を　打ち鳴らす。
        そのたびに　電気火花が　散り
        雷鳴が　あたりに　響き渡る。
      ko: |-
        흥분하면 가슴을 두들긴다.
        그때마다 전기 불꽃이 튀며
        천둥소리가 주변에 울려 퍼진다.
      zh-Hant: |-
        興奮的時候會捶胸發出聲響。
        每次捶胸都會飛濺出電火花，
        雷聲會在四周回響。
      zh-Hans: |-
        兴奋的时候会捶胸鸣叫。
        每到那时，电火花会飞溅，
        雷声会在四周回响。
      en: |-
        When it gets excited, it thumps its chest. With
        every thud, thunder roars and electric sparks
        shower all around.
      fr: |-
        Quand il est excité, il se frappe violemment la
        poitrine de ses poings. Cela fait des étincelles
        électriques et un vrai roulement de tonnerre.
      de: |-
        Wenn es sich aufregt, schlägt es sich kräftig
        auf die Brust. Bei jedem Schlag sprühen Funken
        und es ertönt ein Donnern.
      es: |-
        Al exaltarse, se golpea con ímpetu el pecho.
        Cada vez que lo hace saltan chispas y un
        trueno resuena por la zona.
      it: |-
        Quando è agitato, si batte il petto sprizzando
        scintille e producendo un rombo simile a
        un tuono.
    ultra-sun:
      ja-Hrkt: |-
        でんきが　ほとばしるシッポを　にぎり
        たいでんした　こぶしを　つくると
        ちからまかせに　ぶんなぐる。
      ja: |-
        電気が　ほとばしるシッポを　握り
        帯電した　拳を　作ると
        力任せに　ぶん殴る。
      ko: |-
        전기를 내뿜는 꼬리를 잡고
        주먹에 전기를 머금으면
        있는 힘껏 때린다.
      zh-Hant: |-
        會握住帶著強烈電流的尾巴，
        形成帶電的拳頭，
        然後使盡力氣痛毆對手。
      zh-Hans: |-
        握住冒着电火花的尾巴
        做成带电的拳头后，
        就会用尽全力猛殴。
      en: |-
        It grips its tail, which spews electricity, and
        then beats down opponents with the power of
        its electrified fist.
      fr: |-
        Il tient fermement le bout de sa queue pour
        charger son poing d’électricité, puis martèle
        ses ennemis de coups dévastateurs.
      de: |-
        Es umfasst seine vor Elektrizität sprühenden
        Schweife, um seine Hände aufzuladen und dann
        mit aller Kraft zuzuschlagen.
      es: |-
        Agarra sus colas para electrificar los puños y
        luego soltar puñetazos devastadores.
      it: |-
        Afferra le code sature di elettricità per caricare
        i suoi pugni al massimo della potenza per poi
        colpire il nemico.
    ultra-moon:
      ja-Hrkt: |-
        エレキブル　１ぴきで　だいとしの
        たてもの　すべての　でんりょくを
        １ねんぶん　まかなうことが　できる。
      ja: |-
        エレキブル　１匹で　大都市の
        建物　すべての　電力を
        １年分　まかなうことが　できる。
      ko: |-
        에레키블 1마리로
        대도시 건물 전체의 전력을
        1년 동안 공급할 수 있다.
      zh-Hant: |-
        只要１隻電擊魔獸就能提供
        整座大都市所有建築物
        一整年所需的電力。
      zh-Hans: |-
        只要１只电击魔兽就能
        提供一座大城市的建筑物
        １年所需的全部电力。
      en: |-
        A single Electivire can provide enough electricity
        for all the buildings in a big city for a year.
      fr: |-
        Il suffit d’un seul Élekable pour alimenter tous
        les bâtiments d’une métropole pendant un an.
      de: |-
        Ein einzelnes Elevoltek erzeugt genügend
        Elektrizität, um eine Großstadt ein ganzes Jahr
        lang mit Strom zu versorgen.
      es: |-
        La electricidad que genera un solo Electivire es
        suficiente para cubrir la demanda energética de
        los edificios de una metrópoli durante un año.
      it: |-
        Un singolo Electivire è in grado di fornire
        l’elettricità necessaria agli edifici di una grande
        città per un anno.
    sword:
      ja-Hrkt: |-
        はつでんりょうは　しんぱくすうと
        ひれいする。　たたかいになると
        いっきに　ボルテージが　あがるのだ。
      ja: |-
        発電量は　心拍数と　比例する。
        戦いになると　一気に
        ボルテージが　上がるのだ。
      ko: |-
        발전량은 심박 수에 비례한다.
        싸움이 시작되면
        단숨에 전압이 올라간다.
      zh-Hant: |-
        發電量與心跳數成正比。
        當牠面臨戰鬥的時候，
        電壓就會急速飆升。
      zh-Hans: |-
        发电量和心率成比例。
        一到战斗的时候，
        电压就会急速上升。
      en: |-
        The amount of electrical energy this Pokémon
        produces is proportional to the rate of its pulse.
        The voltage jumps while Electivire is battling.
      fr: |-
        La quantité d’électricité qu’il génère est
        proportionnelle à son pouls. Quand il livre
        un combat, son voltage augmente aussitôt.
      de: |-
        Wie viel Strom es erzeugt, ist abhängig von
        seinem Puls. Im Kampf steigt Elevolteks
        elektrische Spannung schlagartig an.
      es: |-
        La cantidad de electricidad que genera es
        proporcional a su pulso. Al enzarzarse en
        combate, su voltaje aumenta drásticamente.
      it: |-
        Produce una quantità di elettricità direttamente
        proporzionale alla sua frequenza cardiaca.
        Durante la lotta il voltaggio si alza all’istante.
    shield:
      ja-Hrkt: |-
        はつでんりょうは　でんきポケモン
        さいこうクラス。　しっぽの　さきから
        こうあつでんりゅうを　ほうでんする。
      ja: |-
        発電量は　電気ポケモン
        最高クラス。　しっぽの　先から
        高圧電流を　放電する。
      ko: |-
        발전량은 전기포켓몬 중에서도
        손꼽히는 수준이다. 꼬리 끝에서
        고압 전류를 방전한다.
      zh-Hant: |-
        發電量在電氣寶可夢中是
        屬於最頂級的。會從尾巴的
        前端放出高壓電流。
      zh-Hans: |-
        发电量在电气宝可梦当中
        属于最高级别。可以从
        尾巴尖端释放高压电流。
      en: |-
        In terms of electrical-energy output, Electivire
        is one of the best among all Electric Pokémon.
        It discharges high-voltage currents from its tails.
      fr: |-
        La quantité d’électricité qu’il génère est énorme,
        même pour un Pokémon Électrik. Il inflige de
        fortes décharges du bout de ses queues.
      de: |-
        Elevoltek gehört zu jenen Elektro-Pokémon, die
        den meisten Strom erzeugen können. Mit seinen
        Schweifspitzen entlädt es Starkstrom.
      es: |-
        Es de los Pokémon de tipo Eléctrico que más
        electricidad producen. Genera una corriente
        de alta tensión desde las puntas de las colas.
      it: |-
        È uno dei Pokémon di tipo Elettro che
        producono più elettricità. Rilascia scariche
        ad alto voltaggio dalla punta delle code.
    legends-arceus:
      en: |-
        Its evolution was induced by an unusual item, and its electrical
        output rises along with its heart rate. From its tails, it can
        unleash an electric current measuring 20,000 volts.
