phantump:
  base_happiness: 50
  capture_rate: 120
  color: brown
  egg_groups:
    - plant
    - indeterminate
  evolution_chain: phantump
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        くさった　きりかぶに　たましいが
        やどり　ポケモンに　なった。
        ひとの　よりつかない　もりに　すむ。
      ja: |-
        腐った　切り株に　魂が　宿り
        ポケモンに　なった。
        人の　寄りつかない　森に　住む。
      ko: |-
        썩은 그루터기에 혼이
        깃들어 포켓몬이 되었다.
        사람이 가까이 가지 않는 숲에 산다.
      en: |-
        These Pokémon are created when
        spirits possess rotten tree stumps.
        They prefer to live in abandoned forests.
      fr: |-
        Ce Pokémon apparaît lorsqu’un esprit possède
        un arbre en décomposition. Il vit dans les forêts où
        les humains n’osent pas s’aventurer.
      de: |-
        Bei diesen Pokémon handelt es sich um verrottete
        und von Geistern besessene Baumstümpfe, die sich
        in von Menschen gemiedene Wälder zurückziehen.
      es: |-
        Pokémon que nace cuando un espíritu se adentra en
        un tocón podrido. Habita en bosques que son poco
        frecuentados por humanos.
      it: |-
        Pokémon nato da un ceppo marcescente in cui
        alberga uno spirito. Vive in boschi non frequentati
        dagli esseri umani.
    'y':
      ja-Hrkt: |-
        もりで　さまよい　しんだ　こどもの
        たましいが　きりかぶに　やどり
        ポケモンになったと　いわれている。
      ja: |-
        森で　さまよい　死んだ
        子供の　魂が　切り株に　宿り
        ポケモンになったと　言われている。
      ko: |-
        숲에서 헤매다 죽은 아이의
        영혼이 나무 그루터기에 씌어
        포켓몬이 되었다고 한다.
      en: |-
        According to old tales, these Pokémon are
        stumps possessed by the spirits of
        children who died while lost in the forest.
      fr: |-
        D’après la légende, cette espèce de Pokémon aurait
        vu le jour quand des âmes d’enfants perdus dans
        la forêt auraient possédé des souches d’arbres.
      de: |-
        Bei diesen Pokémon soll es sich um die Seelen von
        Kindern handeln, die sich im Wald verliefen und ums
        Leben kamen und nun in Baumstümpfen hausen.
      es: |-
        Según una leyenda, son en realidad almas de niños
        que pasaron a mejor vida tras perderse en el bosque
        y se convirtieron en Pokémon al habitar un tocón.
      it: |-
        Secondo la leggenda, lo spirito di una persona
        smarritasi in un bosco è entrato in un ceppo d’albero,
        dando vita a questo Pokémon.
