    alpha-sapphire:
      ja-Hrkt: |-
        もりで　さまよい　しんだ　こどもの
        たましいが　きりかぶに　やどり
        ポケモンになったと　いわれている。
      ja: |-
        森で　さまよい　死んだ
        子供の　魂が　切り株に　宿り
        ポケモンになったと　言われている。
      ko: |-
        숲에서 헤매다 죽은 아이의
        영혼이 나무 그루터기에 씌어
        포켓몬이 되었다고 한다.
      en: |-
        According to old tales, these Pokémon are
        stumps possessed by the spirits of
        children who died while lost in the forest.
      fr: |-
        D’après la légende, cette espèce de Pokémon aurait vu
        le jour quand des âmes d’enfants perdus dans la forêt
        auraient possédé des souches d’arbres.
      de: |-
