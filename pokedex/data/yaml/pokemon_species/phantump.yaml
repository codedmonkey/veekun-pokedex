        pasaron a mejor vida tras perderse en el bosque y se
        convirtieron en Pokémon al habitar un tocón.
      it: |-
        Secondo la leggenda, lo spirito di una persona smarritasi
        in un bosco è entrato in un ceppo d’albero, dando vita
        a questo Pokémon.
    sun:
      ja-Hrkt: |-
        もりで　しんだ　こどもの　たましいが
        きりかぶに　やどった。　ひめいの
        ような　ぶきみな　こえで　なく。
      ja: |-
        森で　死んだ　子どもの　魂が
        切り株に　宿った。　悲鳴の
        ような　不気味な　声で　鳴く。
      ko: |-
        숲에서 죽은 어린아이의 영혼이
        그루터기에 깃들었다. 비명
        같은 기분 나쁜 목소리로 운다.
      zh-Hant: |-
        在森林中死去的孩子的靈魂
        寄生在樹樁上。
        用悲鳴般的詭異聲音鳴叫。
      zh-Hans: |-
        在森林中死去的孩子的魂魄
        寄生在树桩上。
        用悲鸣般的诡异声音鸣叫。
      en: |-
        These Pokémon are stumps possessed by the
        spirits of children who died in the forest.
        Their cries sound like eerie screams.
      fr: |-
        Ce Pokémon est une souche d’arbre possédée
        par l’âme d’un enfant mort en forêt. Son cri
        ressemble à des pleurs.
      de: |-
        Es ist die Seele eines im Wald gestorbenen
        Kindes, die von einem Baumstumpf Besitz
        ergriffen hat. Sein Ruf gleicht einem Schluchzen.
      es: |-
        Nace cuando el alma de un niño perdido habita
        un tocón. Su grito se asemeja a un escalofriante
        chillido.
      it: |-
        Ceppo di un albero in cui alberga lo spirito
        di un bambino smarrito nel bosco.
        Il suo verso è simile a un grido sinistro.
    moon:
      ja-Hrkt: |-
        みどりの　はっぱを　つみとって
        せんじて　のめば　まんびょうに
        きくと　いう　いいつたえが　ある。
      ja: |-
        緑の　葉っぱを　摘み取って
        煎じて　飲めば　万病に
        効くと　いう　言い伝えが　ある。
      ko: |-
        녹색 잎사귀를 따다가
        달여 마시면 만병에
        듣는다고 하는 전설이 있다.
      zh-Hant: |-
        傳說摘取綠色的樹葉
        煎煮飲用的話，能治百病。
      zh-Hans: |-
        传说，摘取绿色的树叶
        煎煮饮用的话，能治百病。
      en: |-
        According to legend, medicine to cure any illness
        can be made by plucking the green leaves on its
        head, brewing them, and boiling down the liquid.
      fr: |-
        Une légende raconte qu’il est possible de créer
        une panacée en infusant les feuilles vertes qui
        poussent sur ses branches.
      de: |-
        Röstet man seine grünen Blätter, lässt sich
        daraus ein Tee kochen, der gegen sämtliche
        Krankheiten helfen soll.
      es: |-
        Se cree que con las hojillas verdes que le
        crecen se puede preparar una infusión capaz
        de curar cualquier enfermedad.
      it: |-
        Secondo una credenza, dall’infusione delle foglie
        verdi che crescono sui suoi rami si produce una
        medicina portentosa capace di curare ogni male.
    ultra-sun:
      ja-Hrkt: |-
        こどものこえを　まね　ひとを　もりの
        おくふかくへ　まよいこませる。
        じぶんのなかまに　するつもりなのだ。
      ja: |-
        子どもの声を　真似　人を　森の
        奥深くへ　迷いこませる。
        自分の仲間に　する　つもりなのだ。
      ko: |-
        아이 목소리를 흉내 내어 사람을
        숲 깊숙이 유인해 길을 잃게 한다.
        자신의 동료로 삼을 생각이다.
      zh-Hant: |-
        會模仿孩子的聲音，
        把人引到森林深處讓人迷路。
        因為牠想讓對方當自己的夥伴。
      zh-Hans: |-
        会模拟孩子的声音
        将人引入森林的深处让其迷失。
        因为打算让对方做自己的伙伴。
      en: |-
        By imitating the voice of a child, it causes
        people to get hopelessly lost deep in the forest.
        It’s trying to make friends with them.
      fr: |-
        Il imite la voix d’un enfant pour inciter les gens
        à se perdre au plus profond des bois. Il espère
        ainsi se faire de nouveaux amis.
      de: |-
        Es imitiert die Stimme eines Kindes, um
        Menschen tief in den Wald zu locken. Es hofft,
        so neue Freunde zu machen.
      es: |-
        Imita la voz de un niño con la intención de que
        algún humano se adentre y se pierda en lo más
        profundo del bosque y puedan hacerse amigos.
      it: |-
        Imita la voce di un bambino per spingere chi
        la sente ad addentrarsi nei boschi e smarrirsi,
        sperando così di farsi nuovi amici.
    ultra-moon:
      ja-Hrkt: |-
        きりかぶに　なにかしらの　たましいが
        やどり　うまれた。　みどりの　はを
        にだしたしるは　まんびょうに　きく。
      ja: |-
        切り株に　何かしらの　魂が
        宿り　生まれた。　緑の　葉を
        煮出した汁は　万病に　効く。
      ko: |-
        그루터기에 무언가의 영혼이
        깃들어 태어났다. 녹색 잎사귀를
        달여 낸 물은 만병에 듣는다.
      zh-Hant: |-
        某種靈魂附在樹樁上
        而誕生。綠色的葉子
        煮出來的湯汁可治百病。
      zh-Hans: |-
        不知什么魂魄寄居在
        树桩上诞生而成。
        绿色叶子煮出来的汁包治百病。
      en: |-
        An unknown spirit came to lodge in a tree
        stump, creating this Pokémon. A cure-all can be
        made from an infusion of its green leaves.
      fr: |-
        Il est né lorsqu’une âme est venue se loger dans
        une souche. Les infusions de ses feuilles vertes
        permettent de guérir toutes les maladies.
      de: |-
        Ein Baumstumpf, den sich eine Seele als neues
        Zuhause ausgesucht hat. Kocht man seine
        grünen Blätter ab, erhält man ein Allheilmittel.
      es: |-
        Nació cuando un espíritu desconocido se alojó
        en el interior de un tocón. Una infusión con sus
        hojas verdes puede curar toda afección.
      it: |-
        Ha preso vita quando uno spirito è entrato nel
        ceppo di un albero. Dalle sue foglie verdi si
        ricava un infuso che cura ogni male.
    sword:
      ja-Hrkt: |-
        もりで　さまよい　いのちを　おとした
        こどもの　たましいが　きりかぶに
        やどり　ポケモンに　うまれかわった。
      ja: |-
        森で　さまよい　命を　落とした
        子どもの　魂が　切り株に
        宿り　ポケモンに　生まれ変わった。
      ko: |-
        숲속을 헤매다 목숨을 잃은
        아이의 영혼이 나무 그루터기에
        씌어 포켓몬으로 다시 태어났다.
      zh-Hant: |-
        在森林中迷路死去的
        孩子的魂魄附在樹樁上，
        轉生成了寶可夢。
      zh-Hans: |-
        在森林中迷路死去的
        孩子的魂魄附在树桩上，
        转生成了宝可梦。
      en: |-
        After a lost child perished in the forest, their
        spirit possessed a tree stump, causing the spirit’s
        rebirth as this Pokémon.
      fr: |-
        Ce Pokémon prend vie lorsque l’âme d’un enfant
        disparu en forêt prend possession d’une souche
        d’arbre.
      de: |-
        Die Seele eines Kindes, das sich im Wald verlief
        und dabei ums Leben kam, nistete sich in einem
        Baumstumpf ein und wurde zu diesem Pokémon.
      es: |-
        Se dice que en realidad son almas de niños que
        pasaron a mejor vida tras perderse en el bosque
        y se convirtieron en Pokémon al habitar un tocón.
      it: |-
        Questo Pokémon è nato quando l’anima di
        un bambino smarritosi nel bosco è entrata
        nel ceppo di un albero.
    shield:
      ja-Hrkt: |-
        にんげんの　こどもに　にた　こえで
        ないて　おとなを　もりの　おくへ
        さそいこみ　まよわせて　しまうのだ。
      ja: |-
        人間の　子どもに　似た　声で
        鳴いて　大人を　森の　奥へ
        誘い込み　迷わせて　しまうのだ。
      ko: |-
        인간의 어린이를 닮은 목소리로
        울어 어른을 숲속으로
        유인하여 길을 잃게 한다.
      zh-Hant: |-
        用類似人類小孩的聲音鳴叫，
        把大人引到森林的深處，
        讓他們在其中迷失方向。
      zh-Hans: |-
        用类似人类小孩的声音鸣叫，
        把大人引到森林的深处，
        让他们在其中迷失方向。
      en: |-
        With a voice like a human child’s, it cries out to
        lure adults deep into the forest, getting them lost
        among the trees.
      fr: |-
        Il imite des cris d’enfants pour pousser les adultes
        à venir se perdre au plus profond de la forêt.
      de: |-
        Es imitiert das Schluchzen eines Menschenkindes,
        um Erwachsene tief in den Wald zu locken und
        dafür zu sorgen, dass diese sich verlaufen.
      es: |-
        Imita el llanto de un niño con la intención de
        que algún adulto se adentre y se pierda en lo
        más profundo del bosque.
      it: |-
        Emette un pianto simile a quello di un bambino
        per attirare gli adulti nel cuore della foresta
        e farli perdere.
