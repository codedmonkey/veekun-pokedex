    sword:
      ja-Hrkt: |-
        いっちゅうやで　１００００キロの
        きょりを　かけぬける　すがたは
        おおくの　ひとを　みりょうしてきた。
      ja: |-
        一昼夜で　１００００キロの
        距離を　駆けぬける　姿は
        多くの　人を　魅了してきた。
      ko: |-
        하루 만에 10000km의
        거리를 달리는 모습은
        많은 사람을 매료시켜 왔다.
      zh-Hant: |-
        只需要一晝夜時間就能
        跑完１００００公里的身影
        令許多人為之沉醉。
      zh-Hans: |-
        只需要一昼夜时间就能
        跑完１００００公里的身影
        令许多人为之沉醉。
      en: |-
        The sight of it running over 6,200 miles
        in a single day and night has captivated
        many people.
      fr: |-
        De nombreuses personnes ont été charmées
        à la vue de ce Pokémon parcourant 10 000 km
        en 24 heures.
      de: |-
        Viele Trainer sind davon fasziniert, dass dieses
        Pokémon innerhalb eines Tages 10 000 km
        zurücklegen kann.
      es: |-
        Es capaz de correr 10 000 km al día, lo que deja
        embelesados a todos los que lo ven pasar.
      it: |-
        Sono molte le persone affascinate dalla capacità
        di questo Pokémon di correre per una distanza
        di 10.000 km in 24 ore.
    shield:
      ja-Hrkt: |-
        むかしから　おおくの　ひとを
        とりこにした　うつくしい　ポケモン。
        とぶように　かろやかに　はしる。
      ja: |-
        昔から　多くの　人を
        虜にした　美しい　ポケモン。
        飛ぶように　軽やかに　走る。
      ko: |-
        옛날부터 많은 사람의 마음을
        사로잡은 아름다운 포켓몬이다.
        마치 나는 것처럼 경쾌하게 달린다.
      zh-Hant: |-
        從古時候起就是擄獲
        眾多人心的美麗寶可夢。
        能像飛一樣輕盈地奔跑。
      zh-Hans: |-
        从古时候起就是俘获了
        众多人心的美丽宝可梦。
        能像飞一样轻巧地奔跑。
      en: |-
        A Pokémon that has long been admired for its
        beauty. It runs agilely as if on wings.
      fr: |-
        Ce Pokémon est admiré depuis toujours pour
        sa beauté. Il court avec tellement de légèreté
        qu’on dirait qu’il vole.
      de: |-
        Dieses Pokémon verzaubert die Menschen seit
        Urzeiten mit seiner Schönheit. Obendrein ist es
        schnell und sehr wendig.
      es: |-
        Muchos han quedado cautivados por su belleza
        desde la antigüedad. Corre ágilmente como si
        tuviera alas.
      it: |-
        Da sempre ammirato per la sua bellezza,
        corre veloce come se avesse le ali.
    legends-arceus:
      en: |-
        Snaps at its foes with fangs cloaked in blazing flame. Despite its
