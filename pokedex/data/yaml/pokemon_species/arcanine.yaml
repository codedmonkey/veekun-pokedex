        has captured the hearts of
        people since long ago.
      fr: |-
        Son port altier et son attitude
        fière ont depuis longtemps
        conquis le cœur des hommes.
    white:
      en: |-
        Its proud and regal appearance
        has captured the hearts of
        people since long ago.
      fr: |-
        Son port altier et son attitude
        fière ont depuis longtemps
        conquis le cœur des hommes.
    black-2:
      en: |-
        The sight of it running over 6,200 miles
        in a single day and night has captivated
        many people.
    white-2:
      en: |-
        The sight of it running over 6,200 miles
        in a single day and night has captivated
        many people.
    x:
      ja-Hrkt: |-
        むかしから　おおくの　ひとを
        とりこにした　うつくしい　ポケモン。
        とぶように　かろやかに　はしる。
      ja: |-
        昔から　多くの　人を
        虜にした　美しい　ポケモン。
        飛ぶように　軽やかに　走る。
      ko: |-
        옛날부터 많은 사람의
        마음을 사로잡은 아름다운 포켓몬이다.
        날듯이 경쾌하게 달린다.
      en: |-
        A Pokémon that has long been admired for its
        beauty. It runs agilely as if on wings.
      fr: |-
        Un Pokémon très recherché pour sa grâce légendaire.
        Il court avec tellement d’agilité qu’on dirait qu’il vole.
      de: |-
        Dieses Pokémon trägt ein wunderschönes Fell.
        Es ist obendrein schnell und sehr wendig.
      es: |-
        Un Pokémon muy admirado desde la antigüedad por
        su belleza. Corre ágilmente como si tuviera alas.
      it: |-
        Da sempre ammirato per la sua bellezza, corre
        veloce come se avesse le ali.
    'y':
      ja-Hrkt: |-
        どうどうとした　なきごえは
        いげんに　あふれ　きいたものは
        おもわず　ひれふしてしまう。
      ja: |-
        堂々とした　鳴き声は
        威厳に　あふれ　聞いたものは
        思わず　ひれ伏してしまう。
      ko: |-
        위풍당당한 울음소리는
        위엄이 넘쳐 소리를 들은 상대는
        무의식중에 몸을 움츠리게 된다.
      en: |-
        Its magnificent bark conveys a sense of majesty.
        Anyone hearing it can’t help but grovel before it.
      fr: |-
        Son aboiement est tout simplement majestueux.
        On ne peut que ramper à ses pieds après l’avoir
        entendu.
      de: |-
        Sein bezauberndes Bellen klingt majestätisch. Jeder,
        der es vernimmt, muss sich automatisch verbeugen.
      es: |-
        Su magnífico ladrido transmite majestuosidad. Todo
        el que lo escuche no podrá evitar adularlo.
      it: |-
        Il suo incredibile ruggito ispira un senso di maestosità.
        Chiunque lo senta non può far a meno di prostrarsi.
    omega-ruby:
      ja-Hrkt: |-
        １００００キロの　きょりを　いっちゅうやで
        はしると　いわれている　かいそくの　ポケモン。
        たいないで　もえさかる　ほのおが　パワーとなる。
      ja: |-
        １００００キロの　距離を　一昼夜で
        走ると　いわれている　快速の　ポケモン。
        体内で　燃え盛る　炎が　パワーとなる。
      ko: |-
        10000km 거리를 하루 만에 달려간다고
        전해지는 매우 빠른 포켓몬이다.
        체내에서 불타오르는 불꽃이 파워가 된다.
      en: |-
        Arcanine is known for its high speed. It is said to be capable of
        running over 6,200 miles in a single day and night.
        The fire that blazes wildly within this Pokémon’s body is its
        source of power.
      fr: |-
        Arcanin est célèbre pour son extraordinaire vitesse.
        On le dit capable de parcourir plus de 10 000 km en 24 h.
        Le feu qui fait rage à l’intérieur du corps de ce Pokémon
        est la source de son pouvoir.
      de: |-
        Arkani ist sehr schnell. Es kann an einem Tag fast 10 000 km
        zurücklegen. Das Feuer, das im Innern dieses Pokémon lodert,
        dient ihm als Energiequelle.
      es: |-
        Arcanine es conocido por lo veloz que es. Dicen que es capaz
        de correr 10 000 km en 24 horas. El fuego que arde con
        vigor en el interior de este Pokémon constituye su fuente
        de energía.
      it: |-
        Arcanine è noto per la sua velocità. Si dice sia in grado
        di percorrere 10.000 km in un giorno e una notte.
        Il fuoco che arde indomabile nel suo corpo è fonte di forza.
    alpha-sapphire:
