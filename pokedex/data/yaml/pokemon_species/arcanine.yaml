    sun:
      ja-Hrkt: |-
        とうようの　ふるい　いいつたえ　にも
        とうじょうする。　いげんに　あふれ
        たくましくも　うつくしい　ポケモン。
      ja: |-
        東洋の　古い　言い伝え　にも
        登場する。　威厳に　あふれ
        たくましくも　美しい　ポケモン。
      ko: |-
        동양의 오래된 전설에도
        등장한다. 위엄이 넘치며
        늠름하면서 아름다운 포켓몬.
      zh-Hant: |-
        在東方的古代傳說中也曾出現。
        充滿威嚴，強壯而又美麗的寶可夢。
      zh-Hans: |-
        在东方的古代传说中也会出现。
        充满威严，强壮而又美丽的宝可梦。
      en: |-
        Overflowing with beauty and majesty,
        this strong Pokémon appears in ancient
        Eastern folklore.
      fr: |-
        Ce Pokémon apparaît dans de vieux contes
        d’Extrême-Orient. Aussi beau que majestueux,
        sa puissance est légendaire.
      de: |-
        Ein anmutiges Pokémon, das Kraft und Stolz
        ausstrahlt. Bereits in alten Legenden aus dem
        weit entfernten Osten wurde von ihm berichtet.
      es: |-
        Aparece en algunas leyendas de la antigüedad.
        Es un Pokémon de una belleza y majestuosidad
        desmesuradas.
      it: |-
        Il suo aspetto maestoso ed elegante incute
        rispetto. Di lui si parla anche in antiche
        leggende orientali.
    moon:
      ja-Hrkt: |-
        たいないで　もえさかる　ほのおを
        エネルギーに　だいちを　かける。
        おおくの　でんせつが　のこっている。
      ja: |-
        体内で　燃え盛る　炎を
        エネルギーに　大地を　駆ける。
        多くの　伝説が　残っている。
      ko: |-
        체내에서 불타오르는 불꽃을
        에너지로 대지를 달린다.
        많은 전설이 남아 있다.
      zh-Hant: |-
        把體內熊熊燃燒的火焰
        作為能量在大地奔馳。
        留下了大量的傳說。
      zh-Hans: |-
        把体内熊熊燃烧的火焰
        作为能量在大地奔驰。
        留下了大量的传说。
      en: |-
        The fire burning inside its body serves as the
        energy to fuel it as it runs great distances.
        It appears in many legends.
      fr: |-
        La flamme qui brûle dans son corps lui donne
        l’énergie de parcourir les contrées.
        De nombreuses légendes existent à son sujet.
      de: |-
        Mithilfe der Energie, die das in ihm lodernde
        Feuer erzeugt, eilt es über Berg und Tal. Viele
        Legenden ranken sich um dieses Pokémon.
      es: |-
        Puede recorrer grandes distancias gracias a la
        energía producida por el fuego de su interior.
        Hay innumerables leyendas sobre este Pokémon.
      it: |-
        Corre instancabile attraverso distese sconfinate
        grazie al fuoco indomabile che arde nel suo
        corpo. Si narra di lui in molte leggende.
    ultra-sun:
      ja-Hrkt: |-
        おおむかしに　とある　ぶしょうと
        ともに　たたかい　くにを　おさめた
        という　でんせつが　のこされている。
      ja: |-
        大昔に　とある　武将と
        ともに　戦い　国を　治めた
        という　伝説が　残されている。
      ko: |-
        아주 먼 옛날 어느 장수와
        함께 싸워 나라를 다스렸다고 하는
        전설이 남아 있다.
      zh-Hant: |-
        在遠古流傳至今的傳說中，
        牠曾與某位武將並肩作戰，
        共同治理國家。
      zh-Hans: |-
        流传着这样一个传说。
        很久以前，它曾经和某位武将
        一起并肩战斗并治理国家。
      en: |-
        Legends tell of its fighting alongside a general
        and conquering a whole country.
      fr: |-
        Une légende célèbre relate les exploits d’un
        chef de guerre et de son Arcanin à la conquête
        d’un certain royaume antique.
      de: |-
        Der Legende nach soll es vor langer Zeit an der
        Seite eines Kriegshelden gekämpft und so an
        der Eroberung eines Landes mitgewirkt haben.
      es: |-
        Cuenta una antigua leyenda que, tiempo ha, llegó
        a conquistar territorios enteros luchando junto a
        cierto señor de la guerra.
      it: |-
        Narra la leggenda che in un lontano passato
        abbia lottato a fianco di un generale,
        aiutandolo a conquistare paesi interi.
    ultra-moon:
      ja-Hrkt: |-
        おおくの　いいつたえが　のこっており
        でんせつの　ポケモンと　よばれるが
        いがいと　みつかる　かずは　おおい。
      ja: |-
        多くの　言い伝えが　残っており
        伝説の　ポケモンと　呼ばれるが
        意外と　見つかる　数は　多い。
      ko: |-
        많은 전설이 남아 있어
        전설의 포켓몬이라고 불리지만
        의외로 발견되는 수는 많다.
      zh-Hant: |-
        雖然留下了許多傳說，
        被人們稱為傳說的寶可夢，
        但發現到的數量卻意外地多。
      zh-Hans: |-
        虽然留有众多传说，
        被称为传说的宝可梦，
        但发现它的次数却意外的多。
      en: |-
        There are so many old tales about them that
        they’re called legendary Pokémon, but there are
        way more of them around than you’d expect.
      fr: |-
        Tant de mythes circulent sur son compte
        qu’il est parfois qualifié de légendaire, alors
        qu’en réalité, il est on ne peut plus commun.
      de: |-
        Es ranken sich so viele Mythen um Arkani, dass
        es gemeinhin als legendär gilt. In Wirklichkeit 
        kommt es jedoch sehr häufig vor.
      es: |-
        La infinidad de mitos relacionados con este
        Pokémon le ha conferido un carácter de leyenda,
        aunque en realidad es muy común.
      it: |-
        Si narra di lui in molti racconti, tanto che viene
        chiamato “Pokémon leggendario”. Non è però un
        Pokémon raro, ma piuttosto comune.
    lets-go-pikachu:
      ja-Hrkt: |-
        とうようで　でんせつの　ポケモン。
        かろやかに　はしる　そのすがたに
        とりこに　される　ものも　おおい。
      ja: |-
        東洋で　伝説の　ポケモン。
        軽やかに　走る　その姿に
        虜にされる　者も　多い。
      ko: |-
        동양의 전설의 포켓몬.
        경쾌하게 달리는 그 모습에
        반하는 자도 많다.
      zh-Hant: |-
        東洋古老傳說中的寶可夢。
        御風而行般的輕靈姿態
        吸引了許多人對牠著迷。
      zh-Hans: |-
        东方古老传说中的宝可梦。
        曾有不计其数的人为它
        轻巧跑动的身姿而倾倒。
      en: |-
        A legendary Pokémon in the East. Many people
        are charmed by the grace and beauty of
        its running.
      fr: |-
        Un Pokémon légendaire en Extrême-Orient.
        Il est admiré pour la grâce et la beauté de
        sa course.
      de: |-
        Weit entfernt im Osten gilt Arkani als legendär.
        Wenn es rennt, zieht es mit seinen leichtfüßigen
        Bewegungen so manche in seinen Bann.
      es: |-
        Este Pokémon es toda una leyenda en oriente.
        Muchos han quedado cautivados por la belleza
        y gracilidad que exhibe al correr.
      it: |-
        È considerato un Pokémon leggendario in
        oriente. Molti sono ammaliati dal modo
        leggiadro in cui corre.
    lets-go-eevee:
      ja-Hrkt: |-
        とうようで　でんせつの　ポケモン。
        かろやかに　はしる　そのすがたに
        とりこに　される　ものも　おおい。
      ja: |-
