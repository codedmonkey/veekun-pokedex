tranquill:
  base_happiness: 50
  capture_rate: 120
  color: gray
  egg_groups:
    - flying
  evolution_chain: pidove
  evolves_from: pidove
  flavor_text:
    black:
      en: |-
        It can return to its Trainer’s location
        regardless of the distance
        separating them.
      fr: |-
        Aussi éloigné qu’il puisse se trouver,
        il parvient toujours à retourner
        auprès de son Dresseur.
    white:
      en: |-
        Many people believe that, deep in the
        forest where Tranquill live, there is
        a peaceful place where there is no war.
      fr: |-
        On dit que tout au fond de la forêt
        où il vit, il y aurait un pays paisible
        qui n’a jamais connu la guerre.
    black-2:
      en: |-
        No matter where in the world it goes,
        it knows where its nest is, so it
        never gets separated from its Trainer.
    white-2:
      en: |-
        No matter where in the world it goes,
        it knows where its nest is, so it
        never gets separated from its Trainer.
    x:
      ja-Hrkt: |-
        ハトーボーの　すむ　もりの　おくには
        あらそいのない　へいわな　くにが
        あると　しんじられている。
      ja: |-
        ハトーボーの　住む　森の　奥には
        争いのない　平和な　国が　あると
        信じられている。
      ko: |-
        유토브가 사는 숲 속에는
        싸움이 없는 평화로운 나라가
        있다고 믿어진다.
      en: |-
        Many people believe that, deep in the forest where
        Tranquill live, there is a peaceful place where there
        is no war.
      fr: |-
        On dit que tout au fond de la forêt où il vit, il y aurait
        un pays paisible qui n’a jamais connu la guerre.
      de: |-
        Viele Leute glauben, dass es tief in seinem
        heimatlichen Wald ein Land der Harmonie gibt,
        wo man keine Kriege kennt.
      es: |-
        Según los rumores, en lo más profundo del bosque
        donde mora Tranquill, hay un mundo pacífico y exento
        de luchas.
      it: |-
        Si dice che nel cuore della foresta in cui vive Tranquill
        si trovi un paese che non conosce conflitti.
    'y':
      ja-Hrkt: |-
        せかいの　どこに　いても
        じぶんの　すの　ばしょは　わかるので
        トレーナーとも　はぐれたりしない。
      ja: |-
        世界の　どこに　いても
        自分の　巣の　場所は　わかるので
        トレーナーとも　はぐれたりしない。
      ko: |-
        세계 어디에 있어도
        자신의 둥지가 있는 곳을 알 수 있어
        트레이너를 잃어버리지 않는다.
      en: |-
        No matter where in the world it goes, it knows
        where its nest is, so it never gets separated from
        its Trainer.
      fr: |-
        Quel que soit le lieu où il se trouve, il arrive toujours
        à retrouver son Dresseur comme son propre nid.
      de: |-
        Findet selbst von der anderen Seite des Globus
        zu seinem Nest zurück. Nichts kann es von seinem
        Trainer trennen.
      es: |-
        Puede regresar sin problema alguno a su nido desde
        cualquier lugar del globo y jamás se separa de quien
        lo entrena.
      it: |-
        Dovunque si trovi, è sempre in grado di ritrovare il
        suo nido. Allo stesso modo, non perde mai di vista
        il suo Allenatore.
    omega-ruby:
      ja-Hrkt: |-
        ハトーボーの　すむ　もりの　おくには
        あらそいのない　へいわな　くにが
        あると　しんじられている。
      ja: |-
        ハトーボーの　住む　森の　奥には
        争いのない　平和な　国が　あると
        信じられている。
      ko: |-
        유토브가 사는 숲 속에는
        싸움이 없는 평화로운 나라가
        있다고 믿어진다.
      en: |-
        Many people believe that, deep in the forest where
        Tranquill live, there is a peaceful place where there
        is no war.
      fr: |-
        On dit que tout au fond de la forêt où il vit, il y aurait un pays
        paisible qui n’a jamais connu la guerre.
      de: |-
        Viele Leute glauben, dass es tief in seinem heimatlichen Wald
        ein Land der Harmonie gibt, wo man keine Kriege kennt.
      es: |-
        Según los rumores, en lo más profundo del bosque donde
        mora Tranquill, hay un mundo pacífico y exento de luchas.
      it: |-
        Si dice che nel cuore della foresta in cui vive Tranquill si trovi
        un paese che non conosce conflitti.
    alpha-sapphire:
      ja-Hrkt: |-
        せかいの　どこに　いても
        じぶんの　すの　ばしょは　わかるので
        トレーナーとも　はぐれたりしない。
      ja: |-
        世界の　どこに　いても
        自分の　巣の　場所は　わかるので
        トレーナーとも　はぐれたりしない。
      ko: |-
        세계 어디에 있어도
        자신의 둥지가 있는 곳을 알 수 있어
        트레이너를 잃어버리지 않는다.
      en: |-
        No matter where in the world it goes, it knows
        where its nest is, so it never gets separated from
        its Trainer.
      fr: |-
        Quel que soit le lieu où il se trouve, il arrive toujours
        à retrouver son Dresseur comme son propre nid.
      de: |-
        Findet selbst von der anderen Seite des Globus zu seinem
        Nest zurück. Nichts kann es von seinem Trainer trennen.
      es: |-
        Puede regresar sin problema alguno a su nido desde cualquier
        lugar del globo y jamás se separa de quien lo entrena.
      it: |-
        Dovunque si trovi, è sempre in grado di ritrovare il suo nido.
        Allo stesso modo, non perde mai di vista il suo Allenatore.
    sword:
      ja-Hrkt: |-
        そらをとぶ　はやさは　そこそこ。
        どんな　とおく　はなれても　あるじと
        じぶんの　すを　おぼえている。
      ja: |-
        空を飛ぶ　速さは　そこそこ。
        どんな　遠く　離れても　主と
        自分の　巣を　憶えている。
      ko: |-
        하늘을 나는 속도는 그저 그렇다.
        아무리 멀리 떨어져 있어도 주인과
        자신의 둥지를 기억하고 있다.
      zh-Hant: |-
        飛行速度不可小覷。
        無論飛到多遠的地方，
        都會記得自己的主人和巢。
      zh-Hans: |-
        飞行速度不可小觑。
        无论飞到多远的地方，
        都会记得自己的主人和巢。
      en: |-
        It can fly moderately quickly. No matter how far
        it travels, it can always find its way back to its
        master and its nest.
      fr: |-
        Il vole relativement vite et peut parcourir
        des kilomètres sans oublier où se trouvent
        son Dresseur et son nid.
      de: |-
        Navitaub kann einigermaßen schnell fliegen. Es
        findet immer zu seinem Trainer und seinem Nest
        zurück, egal, wie weit entfernt es von ihnen ist.
      es: |-
        Posee una velocidad de vuelo nada desdeñable.
        Por más que se aleje, siempre recuerda el camino
        de regreso a su nido o hasta su Entrenador.
      it: |-
        È abbastanza veloce nel volo. Per quanto lontano
        si spinga, riesce sempre a ritrovare il proprio
        nido e il proprio Allenatore.
    shield:
      ja-Hrkt: |-
        かしこく　ものおぼえが　いい。
        はいたついんが　パートナーに
        えらぶことが　おおいらしい。
      ja: |-
        賢く　物覚えが　いい。
        配達員が　パートナーに
        選ぶことが　多いらしい。
      ko: |-
        영리하고 기억력이 좋다.
        배달원이 파트너로
        선택하는 경우가 많다.
      zh-Hant: |-
        頭腦聰明且記性很好。
        似乎有許多快遞員
        將牠選為自己的搭檔。
      zh-Hans: |-
        头脑聪明而且记性很好。
        似乎有许多快递员
        将它选为自己的搭档。
      en: |-
        These bright Pokémon have acute memories.
        Apparently delivery workers often choose them
        as their partners.
      fr: |-
        Il est intelligent et possède une bonne mémoire.
        On raconte que les livreurs le choisissent souvent
        comme partenaire.
      de: |-
        Es ist clever und hat ein gutes Gedächtnis.
        Anscheinend wird es von vielen Lieferanten als
        Partner ausgewählt.
      es: |-
        Posee una mente ágil y muy buena memoria.
        Tal vez por eso muchos repartidores lo eligen
        como compañero.
      it: |-
        Pokémon intelligente, dotato di una memoria
        di ferro. Sembra che molti fattorini lo scelgano
        come compagno.
