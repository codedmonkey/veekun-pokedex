    black-2:
      en: |-
        It sets a trap by spinning a web
        with thin but strong silk. It waits
        motionlessly for prey to arrive.
    white-2:
      en: |-
        It sets a trap by spinning a web
        with thin but strong silk. It waits
        motionlessly for prey to arrive.
    x:
      ja-Hrkt: |-
        ほそくて　じょうぶな　いとを
        はりめぐらして　わなを　しかけると
        えものが　かかるのを　ひたすらまつ。
      ja: |-
        細くて　丈夫な　糸を
        張り巡らして　わなを　仕掛けると
        獲物が　かかるのを　ひたすら待つ。
      ko: |-
        가늘고 튼튼한 실을
        뿜어 엮어서 덫을 만들고
        먹이가 걸리기만을 기다린다.
      en: |-
        It spins a web using fine--but durable--thread.
        It then waits patiently for prey to be trapped.
      fr: |-
        Il tisse une toile en utilisant un fil fin mais solide,
        puis il attend tranquillement sa proie.
      de: |-
        Es spinnt ein Netz aus feinem, aber reißfestem
        Faden. Dann wartet es auf Beute, die im Netz zappelt.
      es: |-
        Teje su telaraña con hilo fino pero resistente. Espera
        pacientemente a que caiga su presa.
      it: |-
        Tesse la tela con un filo sottile ma resistente. Poi
        attende paziente che una preda ci finisca dentro.
    'y':
      ja-Hrkt: |-
        えものが　ちかくを　とおりかかるまで
        じぶんの　すで　なんにちも　おなじ
        かっこうで　じっと　まちつづける。
      ja: |-
        獲物が　近くを　通りかかるまで
        自分の　巣で　何日も　同じ　格好で
        じっと　待ち続ける。
      ko: |-
        먹이가 근처를 지나갈 때까지
        자신의 둥지에서 며칠이고 같은
        모습으로 가만히 기다린다.
      en: |-
        It lies still in the same pose for days in its web,
        waiting for its unsuspecting prey to wander close.
      fr: |-
        Il reste immobile dans sa toile pendant des jours.
        Il attend que sa proie se rapproche pour la capturer.
      de: |-
        Es sitzt tagelang regungslos in seinem Netz und lauert
        unvorsichtiger Beute auf, die ihm zu nahe kommt.
      es: |-
        Mantiene la misma postura en su telaraña durante días,
        esperando a que se acerque una presa inocente.
      it: |-
        Può rimanere immobile nella tela per giorni,
        attendendo che s’avvicini una preda ignara.
    omega-ruby:
      ja-Hrkt: |-
        いとで　つくった　ワナは　だい２の　しんけい。
        いとを　つたわる　わずかな　しんどう　だけで
        えものの　しゅるいが　わかると　いわれている。
      ja: |-
        糸で　つくった　ワナは　第２の　神経。
        糸を　伝わる　わずかな　振動　だけで
        獲物の　種類が　わかると　いわれている。
      ko: |-
        실로 만든 함정은 제2의 신경이다.
        실에 전해지는 약간의 진동만으로
        먹이의 종류를 알 수 있다고 전해진다.
      en: |-
        The web spun by Spinarak can be considered its second
        nervous system. It is said that this Pokémon can determine
        what kind of prey is touching its web just by the tiny vibrations
        it feels through the web’s strands.
      fr: |-
        La toile tissée par Mimigal peut être comparée à un second
        système nerveux. On raconte que ce Pokémon peut déterminer
        quel type de proie touche sa toile grâce aux infimes vibrations
        des fils.
      de: |-
        Das von Webarak gesponnene Netz ist sein zweites
        Nervensystem. Dieses Pokémon kann anhand der feinen
        Vibrationen der Netzfäden bestimmen, welche Art Beute
        sich darauf befindet.
      es: |-
        La tela que teje Spinarak puede considerarse como su
        segundo sistema nervioso. Dicen que puede adivinar qué tipo
        de presa ha caído en su red con solo observar las leves
        vibraciones de los hilos de la tela.
      it: |-
        La ragnatela tessuta da Spinarak può essere considerata
        il suo secondo sistema nervoso. Infatti, pare che questo
        Pokémon riesca a capire la natura della sua preda dalle
        leggere vibrazioni di tale ragnatela.
    alpha-sapphire:
      ja-Hrkt: |-
        いとで　つくった　ワナは　だい２の　しんけい。
        いとを　つたわる　わずかな　しんどう　だけで
        えものの　しゅるいが　わかると　いわれている。
      ja: |-
        糸で　つくった　ワナは　第２の　神経。
        糸を　伝わる　わずかな　振動　だけで
        獲物の　種類が　わかると　いわれている。
      ko: |-
        실로 만든 함정은 제2의 신경이다.
        실에 전해지는 약간의 진동만으로
        먹이의 종류를 알 수 있다고 전해진다.
      en: |-
        The web spun by Spinarak can be considered its second
        nervous system. It is said that this Pokémon can determine
        what kind of prey is touching its web just by the tiny vibrations
        it feels through the web’s strands.
      fr: |-
        La toile tissée par Mimigal peut être comparée à un second
        système nerveux. On raconte que ce Pokémon peut déterminer
        quel type de proie touche sa toile grâce aux infimes vibrations
        des fils.
      de: |-
        Das von Webarak gesponnene Netz ist sein zweites
        Nervensystem. Dieses Pokémon kann anhand der feinen
        Vibrationen der Netzfäden bestimmen, welche Art Beute
        sich darauf befindet.
      es: |-
        La tela que teje Spinarak puede considerarse como su
        segundo sistema nervioso. Dicen que puede adivinar qué tipo
        de presa ha caído en su red con solo observar las leves
        vibraciones de los hilos de la tela.
      it: |-
        La ragnatela tessuta da Spinarak può essere considerata
        il suo secondo sistema nervoso. Infatti, pare che questo
        Pokémon riesca a capire la natura della sua preda dalle
        leggere vibrazioni di tale ragnatela.
    sun:
      ja-Hrkt: |-
        こうぶつの　アブリーが　すに
        かかるまで　ひたすら　まちつづける。
        じつに　しんぼうづよい　ポケモン。
      ja: |-
        好物の　アブリーが　巣に
        かかるまで　ひたすら　待ち続ける。
        実に　辛抱強い　ポケモン。
      ko: |-
        좋아하는 에블리가 둥지에
        걸릴 때까지 무작정 기다린다.
        정말 참을성 많은 포켓몬이다.
      zh-Hant: |-
        總是一心一意地等待，
        直到愛吃的萌虻落入巢中。
        實在是很有耐心的寶可夢。
      zh-Hans: |-
        一心一意地等着，
        直到爱吃的萌虻落入巢中。
        实在是有耐心的宝可梦。
      en: |-
        It waits intently until its preferred prey, Cutiefly,
        gets caught in its web. In fact, it’s quite a
        patient Pokémon.
      fr: |-
        Il attend dans sa toile jusqu’à ce qu’un
        Bombydou, son mets favori, s’y fasse prendre.
        C’est un Pokémon extrêmement patient.
      de: |-
        Ein sehr geduldiges Pokémon, das besonders
        gern Wommel frisst. Es wartet beharrlich darauf,
        dass sich welche in seinem Netz verfangen.
      es: |-
        Espera con determinación hasta que un Cutiefly
        cae en su telaraña, pues es su comida favorita.
        Es un Pokémon extremadamente paciente.
      it: |-
        Aspetta immobile finché le sue prede
        preferite, i Cutiefly, non cadono nella tela.
        È un Pokémon molto paziente.
    moon:
      ja-Hrkt: |-
        じょうぶな　いとを　よりあわせ
        さかなポケモンを　とらえる　アミを
        こしらえる　りょうしも　いるぞ。
      ja: |-
        丈夫な　糸を　より合わせ
        さかなポケモンを　捕らえる　網を
        こしらえる　漁師も　いるぞ。
      ko: |-
        튼튼한 실을 꼬아서
        물고기포켓몬을 잡는 그물을
        만드는 어부도 있다.
      zh-Hant: |-
        也有漁夫會將堅韌的絲編織起來，
        製作成可以捕捉魚寶可夢的網。
      zh-Hans: |-
        有些渔夫会用其坚韧的丝，
        编织制作成可以捕捉鱼宝可梦的网。
      en: |-
        Some fishermen weave its sturdy thread into
        nets to catch fish Pokémon.
      fr: |-
        Certains pêcheurs récoltent son fil solide pour
        tisser des filets et attraper des Pokémon
        poissons.
      de: |-
        Einige Fischer knüpfen sich aus seinem robusten
        Faden Netze, mit denen sie dann Fisch-Pokémon
        fangen.
      es: |-
        Algunos pescadores confeccionan redes para
        pescar Pokémon pez con la robusta telaraña
        que produce Spinarak.
      it: |-
        Alcuni pescatori usano il suo filo resistente per
        fabbricare le reti con cui pescano i Pokémon
        acquatici.
    ultra-sun:
      ja-Hrkt: |-
        いとを　はいて　つくった　すは
        けっこう　がんじょう。　１０キロの
        いわを　のせても　やぶれない。
      ja: |-
        糸を　はいて　作った　巣は
        結構　頑丈。　１０キロの
        岩を　乗せても　破れない。
      ko: |-
        실을 내뿜어 만든 둥지는
        제법 튼튼하다. 10kg의
        바위를 올려도 끄떡없다.
      zh-Hant: |-
        吐絲製成的巢穴相當堅固，
        即使放上１０公斤重的岩石
        也不會破掉。
      zh-Hans: |-
        由它吐丝制成的巢穴非常坚固。
        即便放上１０公斤重的岩石
        也不会破掉。
      en: |-
        With threads from its mouth, it fashions sturdy
        webs that won’t break even if you set a rock
        on them.
      fr: |-
        La toile qu’il tisse avec les fils qu’il sécrète est
        tellement solide qu’elle peut soutenir une pierre
        de dix kilos.
      de: |-
        Es spinnt ein äußerst robustes Netz aus seinen
        Fäden, das selbst unter dem Gewicht eines
        10 kg schweren Steines nicht reißt.
      es: |-
        Segrega un hilo de increíble resistencia con el
        que teje su tela, capaz de soportar el peso de
        una roca de 10 kg sin romperse.
      it: |-
        Con il filo che secerne dalla bocca tesse una
        tela talmente resistente da sostenere il peso
        di una roccia di 10 kg.
    ultra-moon:
      ja-Hrkt: |-
        キバの　どくは　さほど　つよくないが
        すに　かかって　うごけない　えものを
        よわらせるには　じゅうぶん。
      ja: |-
        キバの　毒は　さほど　強くないが
        巣に　かかって　動けない　獲物を
        弱らせるには　充分。
      ko: |-
        이빨의 독은 그다지 강하진 않지만
        둥지에 걸려서 움직일 수 없는 먹이를
        약하게 만들기에는 충분하다.
      zh-Hant: |-
        牙齒的毒性並不強烈，
        但用來削弱那些掛在蛛網上
        無法動彈的獵物是綽綽有餘。
      zh-Hans: |-
        牙齿上的毒并不强烈，
        但用来削弱那些挂在网上
        无法动弹的猎物是绰绰有余了。
      en: |-
        Although the poison from its fangs isn’t that
        strong, it’s potent enough to weaken prey that
        gets caught in its web.
      fr: |-
        Le poison contenu dans les mandibules de
        ce Pokémon n’est pas très violent, mais il suffit
        à immobiliser les proies piégées dans sa toile.
      de: |-
        Das Gift an seinen Mundwerkzeugen ist nicht
        sonderlich stark, jedoch ausreichend, um Beute
        zu schwächen, die ihm ins Netz gegangen ist.
      es: |-
        El veneno de sus colmillos no es demasiado
        tóxico, pero basta para mantener inmovilizadas
        a las presas que caen en sus redes.
      it: |-
        Il veleno delle zanne non è particolarmente
        potente, ma è sufficiente a indebolire
        le prede intrappolate nella tela.
