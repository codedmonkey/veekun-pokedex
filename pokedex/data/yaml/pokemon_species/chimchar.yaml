        Even rain can’t extinguish the fire.
      fr: |-
        La flamme de sa queue est alimentée par un gaz de
        son estomac. Même la pluie ne saurait l’éteindre.
      de: |-
        Das Feuer an seinem Hinterteil wird durch Gase im Bauch
        genährt. Selbst Regen löscht es nicht.
      es: |-
        El gas de su panza alimenta el fuego de su parte trasera, que
        ni la lluvia puede extinguir.
      it: |-
        Le fiamme sulla coda, alimentate dai gas della pancia,
        non si spengono neppure quando piove.
    alpha-sapphire:
      ja-Hrkt: |-
