    x:
      ja-Hrkt: |-
        おしりの　ほのおは　おなかで
        つくられた　ガスが　ねんりょう。
        あめに　ぬれても　きえない。
      ja: |-
        お尻の　炎は
        お腹で　作られた　ガスが　燃料。
        雨に　ぬれても　消えない。
      ko: |-
        엉덩이의 불꽃은 배에서
        만들어진 가스가 연료다.
        비에 젖어도 꺼지지 않는다.
      en: |-
        Its fiery rear end is fueled by gas made in its belly.
        Even rain can’t extinguish the fire.
      fr: |-
        La flamme de sa queue est alimentée par un gaz de
        son estomac. Même la pluie ne saurait l’éteindre.
      de: |-
        Das Feuer an seinem Hinterteil wird durch Gase
        im Bauch genährt. Selbst Regen löscht es nicht.
      es: |-
        El gas de su panza alimenta el fuego de su parte
        trasera, que ni la lluvia puede extinguir.
      it: |-
        Le fiamme sulla coda, alimentate dai gas della
        pancia, non si spengono neppure quando piove.
    'y':
      ja-Hrkt: |-
        おなかで　つくられた　ガスが
        おしりで　もえている。たいちょうが
        わるいと　ほのおが　よわくなる。
      ja: |-
        お腹で　作られた　ガスが
        お尻で　燃えている。体調が　悪いと
        炎が　弱くなる。
      ko: |-
        배에서 만들어진 가스가
        엉덩이에서 타오르고 있다. 몸 상태가
        나쁘면 불꽃이 약해진다.
      en: |-
        The gas made in its belly burns from its rear end.
        The fire burns weakly when it feels sick.
      fr: |-
        La flamme de son postérieur brûle grâce à un gaz
        de son estomac. Elle faiblit quand il ne va pas bien.
      de: |-
        An seinem Rücken verbrennt es die Gase aus seinem
        Bauch. Geht es ihm schlecht, leuchtet es weniger hell.
      es: |-
        El fuego que arde en su cola lo generan los gases
        de su estómago y disminuye cuando está débil.
      it: |-
        Le fiamme sulla coda sono alimentate dal gas della
        pancia. Si affievoliscono quando sta male.
    omega-ruby:
      ja-Hrkt: |-
        おしりの　ほのおは　おなかで
        つくられた　ガスが　ねんりょう。
        あめに　ぬれても　きえない。
      ja: |-
        お尻の　炎は
        お腹で　作られた　ガスが　燃料。
        雨に　ぬれても　消えない。
      ko: |-
