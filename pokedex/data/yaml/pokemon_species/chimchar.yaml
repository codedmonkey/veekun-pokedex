        sleep, it extinguishes the flame
        on its tail to prevent fires.
      fr: |-
        Il est très agile. Il fait toujours
        attention d’éteindre la flamme de
        sa queue avant de se coucher.
    white:
      en: |-
        It is very agile. Before going to
