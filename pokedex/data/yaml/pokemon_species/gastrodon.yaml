        jadis une carapace couvrant la
        totalité de son dos.
    black-2:
      en: |-
        Long ago, its entire back was
        shielded with a sturdy shell. There
        are traces of it left in its cells.
    white-2:
      en: |-
        Long ago, its entire back was
        shielded with a sturdy shell. There
        are traces of it left in its cells.
    x:
      ja-Hrkt: |-
        てんてきに　おそわれた　ときは
        むらさきいろの　えきたいを
        からだから　だして　にげる。
      ja: |-
        天敵に　襲われたときは
        紫色の　液体を
        体から　出して　逃げる。
      ko: |-
        천적에게 습격당했을 때는
        보라색 액체를
        몸에서 내어 도망간다.
      en: |-
        When its natural enemy attacks, it oozes purple
        fluid and escapes.
      fr: |-
        Attaqué par un prédateur, il fuit en libérant un liquide
        mauve.
      de: |-
        Wird es von einem natürlichen Feind angegriffen,
        flieht es, indem es ein lila Sekret über die Haut
        ausstößt.
      es: |-
        Si se ve amenazado por sus enemigos naturales,
        segrega un líquido morado y huye rápidamente.
      it: |-
        Se minacciato da un nemico naturale rilascia un
        liquido viola e se la dà a gambe, per così dire...
    'y':
      ja-Hrkt: |-
        おおむかしは　じょうぶな　カラで
        からだを　まもっていたらしい。
        うみの　あさせに　せいそくする。
      ja: |-
        大昔は　丈夫な　殻で
        体を　守っていたらしい。
        海の　浅瀬に　生息する。
      ko: |-
        아주 옛날에는 튼튼한 껍질로
        몸을 보호하고 있었던 듯하다.
        바다의 얕은 곳에서 서식한다.
      en: |-
        It apparently had a huge shell for protection in
        ancient times. It lives in shallow tidal pools.
      fr: |-
        Jadis, il semble qu’il portait une grande carapace
        pour se protéger. Il hante les eaux peu profondes.
      de: |-
        In Urzeiten muss es einen großen Schutzpanzer
        besessen haben. Es lebt in kleinen Wasserstellen.
      es: |-
        Al parecer, hace mucho tiempo tenía una gran concha
        protectora. Vive en aguas poco profundas.
      it: |-
        Pare che in passato il suo corpo fosse protetto da
        un enorme carapace. Vive in bacini poco profondi.
    omega-ruby:
      ja-Hrkt: |-
        てんてきに　おそわれた　ときは
        むらさきいろの　えきたいを
        からだから　だして　にげる。
      ja: |-
