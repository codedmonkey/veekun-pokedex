        紫色の　液体を
        体から　出して　逃げる。
      ko: |-
        천적에게 습격당했을 때는
        보라색 액체를
        몸에서 내어 도망간다.
      en: |-
        When its natural enemy attacks, it oozes purple
        fluid and escapes.
      fr: 'Attaqué par un prédateur, il fuit en libérant un liquide mauve.'
      de: |-
        Wird es von einem natürlichen Feind angegriffen, flieht es,
        indem es ein lila Sekret über die Haut ausstößt.
      es: |-
        Si se ve amenazado por sus enemigos naturales, segrega un
        líquido morado y huye rápidamente.
      it: |-
        Se minacciato da un nemico naturale rilascia un liquido viola
        e se la dà a gambe, per così dire...
    alpha-sapphire:
      ja-Hrkt: |-
        おおむかしは　じょうぶな　カラで
        からだを　まもっていたらしい。
        うみの　あさせに　せいそくする。
      ja: |-
        大昔は　丈夫な　殻で
        体を　守っていたらしい。
        海の　浅瀬に　生息する。
      ko: |-
        아주 옛날에는 튼튼한 껍질로
        몸을 보호하고 있었던 듯하다.
        바다의 얕은 곳에서 서식한다.
      en: |-
        It apparently had a huge shell for protection in
        ancient times. It lives in shallow tidal pools.
      fr: |-
        Jadis, il semble qu’il portait une grande carapace pour
        se protéger. Il hante les eaux peu profondes.
      de: |-
        In Urzeiten muss es einen großen Schutzpanzer
        besessen haben. Es lebt in kleinen Wasserstellen.
      es: |-
        Al parecer, hace mucho tiempo tenía una gran concha
        protectora. Vive en aguas poco profundas.
      it: |-
        Pare che in passato il suo corpo fosse protetto da un enorme
        carapace. Vive in bacini poco profondi.
    sun:
      ja-Hrkt: |-
        さいせいのうりょくが　たかい。
        さかなポケモンに　くいちぎられても
        すうじかんで　もとどおりに　なるよ。
      ja: |-
        再生能力が　高い。
        さかなポケモンに　喰い千切られても
        数時間で　元通りに　なるよ。
      ko: |-
        재생능력이 높다.
        물고기포켓몬에게 물어뜯겨도
        몇 시간이면 원래대로 돌아온다.
      zh-Hant: |-
        再生能力很高。
        即使被魚寶可夢咬斷
        也會在幾小時內恢復原狀哦。
      zh-Hans: |-
        再生能力很高。
        即使被鱼宝可梦咬断，
        也会在几小时内恢复原状哦。
      en: |-
        It has strong regenerative capabilities. Even if
        parts of it are bitten off by fish Pokémon, it will
        return to normal within a few hours.
      fr: |-
        Il se régénère très vite. Même si des Pokémon
        poissons en croquent un bout, il est à nouveau
        comme neuf au bout de quelques heures.
      de: |-
        Es hat starke Regenerationskräfte. Selbst wenn
        Fisch-Pokémon ein Stück von ihm abbeißen,
        wächst es innerhalb weniger Stunden nach.
      es: |-
        Posee una notable capacidad de regeneración.
        Aunque los Pokémon pez lo mordisqueen, puede
        recuperarse en tan solo unas pocas horas.
      it: |-
        Ha notevoli capacità rigenerative: anche se
        viene mangiucchiato dai Pokémon acquatici
        può tornare come prima nel giro di qualche ora.
    moon:
      ja-Hrkt: |-
        めに　みえない　プランクトンが　おもな
        エサ。　りくに　あがってくるが
        りゆうは　まだ　わかっていない。
      ja: |-
        目に　見えない　プランクトンが　主な
        餌。　陸に　上ってくるが
        理由は　まだ　わかっていない。
      ko: |-
        눈에 보이지 않는 플랑크톤이 주된
        먹이다. 육지에 올라오지만
        이유는 아직 밝혀지지 않았다.
      zh-Hant: |-
        牠的主要食物是無形的浮游生物。
        會到陸地上來，但原因尚不清楚。
      zh-Hans: |-
        无形的浮游生物是它的主要食物。
        会到陆地上来，但原因尚不清楚。
      en: |-
        Plankton, invisible to the naked eye, is its main
        food source. It comes onto the land periodically,
        but the reason for this is not known.
      fr: |-
        Il s’alimente principalement de plancton invisible
        à l’œil nu. On ne sait toujours pas pourquoi il a
        quitté l’océan au profit de la terre ferme.
      de: |-
        Es ernährt sich hauptsächlich von Plankton,
        das man mit bloßem Auge nicht sehen kann.
        Es ist noch unklar, warum es an Land kommt.
      es: |-
        Su principal alimento es plancton invisible. Sale
        a la superficie, pero aún se desconoce el motivo.
      it: |-
        Si nutre principalmente di plancton.
        A volte si sposta sulla terraferma per motivi
        ancora sconosciuti.
    ultra-sun:
      ja-Hrkt: |-
        むかしは　カラを　しょっていた。
        せなかの　おくに　そのなごりの
        かたくて　うすい　さらが　ある。
      ja: |-
        昔は　カラを　背負っていた。
        背中の　奥に　その名残の
        硬くて　薄い　皿が　ある。
      ko: |-
        옛날에는 껍질을 등에 지고 있었다.
        그 흔적이 남아 등 안에
        딱딱하고 얇은 접시가 있다.
      zh-Hant: |-
        過去背上曾經有殼，
        如今只在背部內側殘留著
        又硬又薄的弧狀物。
      zh-Hans: |-
        曾经一直背着壳。
        在背的里面有着
        又硬又薄的壳的痕迹。
      en: |-
        Long ago, it had a shell on its back. There’s now
        a vestigial plate on its back that’s hard but thin.
      fr: |-
        La fine soucoupe qui se trouve à l’intérieur de
        son dos est le dernier vestige de la carapace
        jadis portée par son espèce.
      de: |-
        Vor langer Zeit hatte es einen Panzer. In seinem
        Rücken ist davon noch eine harte, dünne Platte
        übrig.
      es: |-
        Un caparazón le cubría la espalda antaño, y el
        único indicio de este hecho es la fina y dura
        placa en la capa interna del lomo.
      it: |-
        In passato era protetto da un carapace di cui
        l’unica traccia rimasta è il disco duro e sottile
        sul suo dorso.
    ultra-moon:
      ja-Hrkt: |-
        すむ　ばしょや　エサの　えいきょうで
        いろや　かたちが　へんか　する。
        なみの　おだやかな　いそべに　おおい。
      ja: |-
        棲む　場所や　エサの　影響で
        色や　形が　変化　する。
        波の　おだやかな　磯辺に　多い。
      ko: |-
        사는 장소나 먹이의 영향으로
        색이나 모습이 변화한다.
        파도가 잔잔한 바위해변에 많다.
      zh-Hant: |-
        體色和外型會隨著
        棲息地和食物而變化。
        經常出現在波浪平緩的岩岸。
      zh-Hans: |-
        受栖息地和食物的影响，
        颜色和形状会发生变化。
        在波浪平稳的岩岸有很多。
      en: |-
        Their shape and color change, depending on
        their environment and diet. There are many of
        them at beaches where the waves are calm.
      fr: |-
        Il change de forme et de couleur selon son
        habitat et son alimentation. On le trouve
        souvent sur les plages à la faible houle.
      de: |-
        Seine Farbe und Form ändern sich je nachdem,
        wo es lebt und was es frisst. Man trifft viele von
        ihnen an Küsten mit mäßiger Brandung an.
      es: |-
        Altera tanto la forma como el color en función
        de su hábitat y el alimento del que se nutre.
        Abunda en las playas de calmo oleaje.
      it: |-
        Il colore e la forma del suo corpo mutano in
        base all’habitat e all’alimentazione. Ne vivono
        tanti sui litorali rocciosi dove il mare è calmo.
    sword:
      ja-Hrkt: |-
        エサを　もとめて　りくにも　あがる。
        トリトドンが　はったあとには
        ネバネバの　ねんえきが　のこる。
      ja: |-
        エサを　求めて　陸にも　上がる。
        トリトドンが　這った跡には
        ネバネバの　粘液が　残る。
      ko: |-
        먹이를 찾아 육지에도 올라온다.
        트리토돈이 지나간 자리에는
        끈적끈적한 점액이 남아 있다.
      zh-Hant: |-
        為了覓食也會登上陸地。
        海兔獸經過的地方
        會留下黏糊糊的黏液。
      zh-Hans: |-
        为了觅食也会登上陆地。
        海兔兽经过的地方
        会留下黏糊糊的粘液。
      en: |-
        Its search for food sometimes leads it onto land,
        where it leaves behind a sticky trail of slime as it
        passes through.
      fr: |-
        Il peut rejoindre la terre ferme pour chercher
        des proies. Il laisse une traînée de bave gluante
        derrière lui.
      de: |-
        Auf der Suche nach Futter kommt es bisweilen
        auch an Land. Wo es entlangkriecht, hinterlässt
        es eine klebrige Schleimspur.
      es: |-
        Puede desplazarse también por tierra firme en
        pos de su presa. Deja tras de sí, entonces, el
        rastro de una mucosidad pegajosa.
      it: |-
        Può salire sulla terraferma in cerca di cibo.
        Quando si sposta, lascia dietro di sé una scia
        di bava appiccicosa.
    shield:
      ja-Hrkt: |-
        グニャグニャの　からだ　だけれど
        かなり　タフ。　やわらかさが
        しょうげきを　ぶんさんするのだ。
      ja: |-
        グニャグニャの　体　だけれど
        かなり　タフ。　軟らかさが
        衝撃を　分散するのだ。
      ko: |-
        흐물흐물한 몸이지만
        제법 튼튼하다. 부드러워서
        충격을 분산시킨다.
      zh-Hant: |-
        身體軟綿綿的但十分強韌。
        因為牠身體的軟度可以
        幫助牠分散所受到的衝擊。
      zh-Hans: |-
        身体软瘫瘫的但十分强韧。
        因为它身体的软度可以
        帮助分散它所受到的冲击。
      en: |-
        The softness of its body helps disperse the force
        of impacts, so although its body is uncommonly
        squishy, it’s also surprisingly resilient.
      fr: |-
        Son corps est caoutchouteux, mais très résistant,
        car la puissance des chocs qu’il subit se répand
        sur toute sa surface.
      de: |-
        Es ist weich, kann aber einiges einstecken, da
        sein biegsamer Körper die Wucht von Schlägen
        absorbiert.
      es: |-
        Aunque blando, su cuerpo es tremendamente
        resistente, ya que dispersa cualquier impacto
        que recibe dada su flexibilidad.
      it: |-
        Il suo corpo molliccio è in grado di assorbire
        i colpi, rendendo questo Pokémon molto
        resistente.
    legends-arceus:
      en: |-
        Eats beach sand for nourishment. Should one Gastrodon
        encounter another of a different color, a fierce battle will inevitably ensue.
