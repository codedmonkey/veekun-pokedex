lunatone:
  base_happiness: 50
  capture_rate: 45
  color: yellow
  egg_groups:
    - mineral
  evolution_chain: lunatone
  evolves_from: ~
  flavor_text:
    ruby:
      en: |-
        LUNATONE was discovered at a location
        where a meteorite fell. As a result, some
        people theorize that this POKéMONcame from space. However, no one has
        been able to prove this theory so far.
    sapphire:
      en: |-
        LUNATONE becomes active around the
        time of the full moon. Instead of
        walking, it moves by floating in midair.The POKéMON’s intimidating red eyes
        cause all those who see it to become
        transfixed with fear.
    emerald:
      en: |-
        It becomes very active on the night of
        a full moon. This POKéMON was first
        discovered 40 years ago at the site of
        a meteor strike.
    firered:
      en: |-
        Its health ebbs and flows with the lunar
        cycle. It brims with power when exposed
        to the light of the full moon.
    leafgreen:
      en: |-
        Its health ebbs and flows with the lunar
        cycle. It brims with power when exposed
        to the light of the full moon.
    diamond:
      en: |-
        Because it turns active on nights
        of the full moon, it is said to have
        some link to the lunar phases.
    pearl:
      en: |-
        Because it turns active on nights
        of the full moon, it is said to have
        some link to the lunar phases.
    platinum:
      en: |-
        Because it turns active on nights
        of the full moon, it is said to have
        some link to the lunar phases.
    heartgold:
      en: |-
        It was discovered at the site of a
        meteor strike 40 years ago. Its
        stare can lull its foes to sleep.
    soulsilver:
      en: |-
        It was discovered at the site of a
        meteor strike 40 years ago. Its
        stare can lull its foes to sleep.
    black:
      en: |-
        Because it turns active on nights
        of the full moon, it is said to have
        some link to the lunar phases.
      fr: |-
        On suppose qu’il est lié au cycle
        lunaire, car il ne sort que les
        soirs de pleine lune.
    white:
      en: |-
        Because it turns active on nights
        of the full moon, it is said to have
        some link to the lunar phases.
      fr: |-
        On suppose qu’il est lié au cycle
        lunaire, car il ne sort que les
        soirs de pleine lune.
    black-2:
      en: |-
        The phase of the moon apparently
        has some effect on its power.
        It’s active on the night of a full moon.
    white-2:
      en: |-
        The phase of the moon apparently
        has some effect on its power.
        It’s active on the night of a full moon.
    x:
      ja-Hrkt: |-
        まんげつの　よるになると　かっぱつに
        かつどうするため　つきの　みちかけと
        かんけいしていると　いわれている。
      ja: |-
        満月の　夜になると　活発に
        活動するため　月の　満ち欠けと
        関係していると　言われている。
      ko: |-
        보름달의 밤이 되면 활발하게
        활동하기 때문에 달의 변화와
        관계 있다고 전해진다.
      en: |-
        Because it turns active on nights of the full moon,
        it is said to have some link to the lunar phases.
      fr: |-
        On suppose qu’il est lié au cycle lunaire, car il ne sort
        que les soirs de pleine lune.
      de: |-
        Da es in Vollmondnächten aktiv wird, sagt man ihm
        nach, mit den Mondphasen in Verbindung zu stehen.
      es: |-
        Se piensa que está muy influido por las fases lunares,
        ya que solo actúa en noches de luna llena.
      it: |-
        Diventa attivo nelle notti di luna piena, pertanto
        si dice che abbia qualche legame con le fasi lunari.
    'y':
      ja-Hrkt: |-
        ４０ねんまえに　いんせきの　おちた
        ばしょで　はじめて　みつかった。
        にらむ　だけで　てきを　ねむらせる。
      ja: |-
        ４０年前に　隕石の　落ちた
        場所で　初めて　見つかった。
        にらむ　だけで　敵を　眠らせる。
      ko: |-
        40년 전에 운석이 떨어진
        장소에서 처음 발견되었다.
        노려보는 것만으로 적을 재운다.
      en: |-
        It was discovered at the site of a meteor strike
        40 years ago. Its stare can lull its foes to sleep.
      fr: |-
        Il a été découvert dans le cratère d’une météorite
        il y a 40 ans. Son simple regard endort ses ennemis.
      de: |-
        Wurde erstmals vor 40 Jahren bei einem
        Meteoritenkrater entdeckt. Sein Blick wirkt
        einschläfernd.
      es: |-
        Descubierto hace 40 años junto a un meteorito.
        Duerme a sus enemigos con solo mirarlos.
      it: |-
        Fu scoperto 40 anni fa nella zona d’impatto di un
        meteorite. Con il solo sguardo addormenta il nemico.
    omega-ruby:
      ja-Hrkt: |-
        いんせきの　おちた　ばしょから　みつかったため
        うちゅうから　やってきた　ポケモンという　せつも
        あるが　まだ　しょうめいされていない。
      ja: |-
        隕石の　落ちた　場所から　見つかったため
        宇宙から　やってきた　ポケモンという　説も
        あるが　まだ　証明されていない。
      ko: |-
        운석이 떨어진 장소에서 발견되어
        우주에서 온 포켓몬이라는 설도
        있지만 아직 증명되지 않았다.
      en: |-
        Lunatone was discovered at a location where a meteoroid fell.
        As a result, some people theorize that this Pokémon came
        from space. However, no one has been able to prove this
        theory so far.
      fr: |-
        Séléroc fut découvert à côté d’un cratère de météorite.
        Du coup, certaines personnes pensent que ce Pokémon
        vient de l’espace. Cependant, rien ne peut prouver
        cette théorie pour le moment.
      de: |-
        Lunastein wurde in der Nähe eines Meteoritenkraters entdeckt.
        Daher nehmen einige Menschen an, dass dieses Pokémon
        aus dem Weltall stammt. Diese Theorie konnte allerdings
        bisher noch nicht belegt werden.
      es: |-
        Lunatone fue descubierto en el lugar de impacto de un
        meteorito. Por eso, hay quien especula con la idea de que
        procede del espacio. Con todo, hasta el día de hoy nadie ha
        podido probar esta teoría.
      it: |-
        Lunatone è stato scoperto nel luogo dove una volta cadde
        un meteorite. Si è pertanto dedotto che questo Pokémon
        venga dallo spazio. Tuttavia, questa teoria non è ancora
        stata confermata.
    alpha-sapphire:
      ja-Hrkt: |-
        まんげつの　じき　かっぱつになる　しゅうせい。
        くうちゅうに　ういて　いどうし　あかい　ひとみは
        みたものの　からだを　すくませる　はくりょく。
      ja: |-
        満月の　時期　活発になる　習性。
        空中に　浮いて　移動し　赤い　瞳は
        見たものの　体を　すくませる　迫力。
      ko: |-
        보름달일 때 활발해지는 습성이 있다.
        공중에 떠서 이동하며 빨간 눈동자는
        그것을 본 자를 움츠러들게 하는 박력을 지녔다.
      en: |-
        Lunatone becomes active around the time of the full moon.
        Instead of walking, it moves by floating in midair.
        The Pokémon’s intimidating red eyes cause all those who
        see it to become transfixed with fear.
      fr: |-
        Séléroc ne s’active que pendant la période de pleine lune.
        Il ne marche pas, mais se déplace en lévitant. Les yeux
        rouges et intimidants de ce Pokémon pétrifient ses ennemis
        de terreur.
      de: |-
        Lunastein wird bei Vollmond aktiv. Es läuft nicht, sondern
        schwebt durch die Luft. Die bedrohlichen roten Augen dieses
        Pokémon lassen alle, die es sehen, vor Angst erstarren.
      es: |-
        Lunatone entra en actividad en épocas de luna llena más o
        menos. No camina, se desplaza flotando por el aire. Tiene
        unos ojos rojos sobrecogedores que cortan la respiración a
        todo aquel que los ve.
      it: |-
        Lunatone si desta quando domina la luna piena.
        Invece di camminare, fluttua a mezz’aria. I suoi occhi rossi
        così minacciosi terrorizzano chiunque li guardi.
    sword:
      ja-Hrkt: |-
        つきの　みちかけと　パワーの
        ぞうげんが　かんけい　しているらしく
        まんげつの　よる　かっぱつになる。
      ja: |-
        月の　満ち欠けと　パワーの
        増減が　関係　しているらしく
        満月の　夜　活発になる。
      ko: |-
        달의 차고 기욺과 힘의
        증감이 관계하고 있는 듯
        보름달 밤에 활발해진다.
      zh-Hant: |-
        月亮的盈虧似乎會
        影響牠力量的增減。
        每到滿月之夜就會變得活躍。
      zh-Hans: |-
        月亮的盈缺似乎会
        影响它力量的增减。
        每到满月之夜就会变得活跃。
      en: |-
        The phase of the moon apparently has some
        effect on its power. It’s active on the night of
        a full moon.
      fr: |-
        Sa force est liée au cycle lunaire.
        Il est surtout actif les soirs de pleine lune.
      de: |-
        Anscheinend steht die Zunahme seiner Kraft mit
        den Mondphasen in Verbindung, da es bei
        Vollmond aktiv wird.
      es: |-
        Se piensa que las fases lunares tienen relación
        con la fluctuación de su poder. Se vuelve activo
        las noches de luna llena.
      it: |-
        La sua forza sembra aumentare o diminuire
        a seconda delle fasi lunari. È più attivo nelle
        notti di luna piena.
    shield:
      ja-Hrkt: |-
        ４０ねんまえに　いんせきの　おちた
        ばしょで　はじめて　みつかった。
        にらむ　だけで　てきを　ねむらせる。
      ja: |-
        ４０年前に　隕石の　落ちた
        場所で　初めて　見つかった。
        にらむ　だけで　敵を　眠らせる。
      ko: |-
        40년 전에 운석이 떨어진
        장소에서 처음 발견되었다.
        노려보기만 해도 적을 잠들게 한다.
      zh-Hant: |-
        在４０年前隕石墜落的
        地點第一次被發現。
        瞪一眼就能使敵人沉睡。
      zh-Hans: |-
        第一次发现它是在
        ４０年前陨石坠落的地方。
        只要注视敌人就能使其入睡。
      en: |-
        It was discovered at the site of a meteor strike
        40 years ago. Its stare can lull its foes to sleep.
      fr: |-
        Il a été découvert dans le cratère d’une météorite
        il y a 40 ans. Un simple regard de sa part
        endort ses ennemis.
      de: |-
        Es wurde erstmals vor 40 Jahren bei einem
        Meteoritenkrater entdeckt. Gegner versetzt es
        allein mit seinem Blick in Schlaf.
      es: |-
        Fue descubierto hace 40 años en el lugar donde
        había caído un meteorito. Le basta fulminar a sus
        enemigos con la mirada para dormirlos.
      it: |-
        Fu scoperto 40 anni fa nella zona d’impatto
        di un meteorite. Può addormentare il nemico
        con il solo sguardo.
