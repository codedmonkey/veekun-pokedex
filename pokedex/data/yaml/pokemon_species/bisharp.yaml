bisharp:
  base_happiness: 35
  capture_rate: 45
  color: red
  egg_groups:
    - humanshape
  evolution_chain: pawniard
  evolves_from: pawniard
  flavor_text:
    black:
      en: |-
        It leads a group of Pawniard.
        It battles to become the boss, but will
        be driven from the group if it loses.
      fr: |-
        Ils dirigent les groupes de Scalpion.
        Ils se battent pour la suprématie sur le
        groupe, et les perdants en sont exclus.
    white:
      en: |-
        Bisharp pursues prey in the company of a
        large group of Pawniard. Then Bisharp
        finishes off the prey.
      fr: |-
        Il chasse avec un groupe de Scalpion
        sous ses ordres, mais c’est lui qui
        donne le coup de grâce.
    black-2:
      en: |-
        This pitiless Pokémon commands a group
        of Pawniard to hound prey into immobility.
        It then moves in to finish the prey off.
    white-2:
      en: |-
        This pitiless Pokémon commands a group
        of Pawniard to hound prey into immobility.
        It then moves in to finish the prey off.
    x:
      ja-Hrkt: |-
        すうひきの　コマタナを　たたかわせ
        きずつき　うごけなくなった　えものを
        まっぷたつにする　こわい　ポケモン。
      ja: |-
        数匹の　コマタナを　戦わせ
        傷つき　動けなくなった　獲物を
        真っ二つにする　怖い　ポケモン。
      ko: |-
        몇 마리의 자망칼과 싸우게 해서
        상처 입고 움직일 수 없게 된 먹이를
        두 동강 내버리는 무서운 포켓몬.
      en: |-
        This pitiless Pokémon commands a group of
        Pawniard to hound prey into immobility. It then
        moves in to finish the prey off.
      fr: |-
        Un Pokémon sans pitié qui tranche en deux ses proies
        immobilisées par les cohortes de Scalpion qu’il
        commande.
      de: |-
        Ein kaltblütiges Pokémon, das Gegner zunächst mit
        einer Schar von Gladiantri lähmt und dann zweiteilt.
      es: |-
        Un Pokémon temible que remata a su presa una vez
        que su séquito de Pawniard la ha debilitado e
        inmovilizado.
      it: |-
        È molto crudele. Lascia che un gruppo di Pawniard
        attacchi la preda e, quando è ferita e non può più
        muoversi, la finisce.
    'y':
      ja-Hrkt: |-
        おおぜいの　コマタナを　したがえて
        えものを　むれで　おいつめる。
        とどめは　キリキザンが　さす。
      ja: |-
        大勢の　コマタナを　従えて
        獲物を　群れで　追いつめる。
        とどめは　キリキザンが　刺す。
      ko: |-
        많은 자망칼을 거느리며
        무리를 지어 먹이를 바싹 몰아넣는다.
        마무리는 절각참이 한다.
      en: |-
        Bisharp pursues prey in the company of a large
        group of Pawniard. Then Bisharp finishes off
        the prey.
      fr: |-
        Il chasse avec un groupe de Scalpion sous ses ordres,
        mais c’est lui qui donne le coup de grâce.
      de: |-
        Es rückt seinen Opfern mit einer Schar von Gladiantri
        im Gefolge auf den Pelz. Den letzten Hieb übernimmt
        es selbst.
      es: |-
        Su séquito son los Pawniard. Acorralan a su presa con
        todo el grupo y Bisharp propina el golpe de gracia.
      it: |-
        Accompagnato da molti Pawniard, blocca le prede
        grazie alla forza del gruppo. È Bisharp a dare il
        colpo di grazia.
    omega-ruby:
      ja-Hrkt: |-
        すうひきの　コマタナを　たたかわせ
        きずつき　うごけなくなった　えものを
        まっぷたつにする　こわい　ポケモン。
      ja: |-
        数匹の　コマタナを　戦わせ
        傷つき　動けなくなった　獲物を
        真っ二つにする　怖い　ポケモン。
      ko: |-
        몇 마리의 자망칼과 싸우게 해서
        상처 입고 움직일 수 없게 된 먹이를
        두 동강 내버리는 무서운 포켓몬.
      en: |-
        This pitiless Pokémon commands a group of
        Pawniard to hound prey into immobility. It then
        moves in to finish the prey off.
      fr: |-
        Un Pokémon sans pitié qui tranche en deux ses proies
        immobilisées par les cohortes de Scalpion qu’il commande.
      de: |-
        Ein kaltblütiges Pokémon, das Gegner zunächst mit einer
        Schar von Gladiantri lähmt und dann zweiteilt.
      es: |-
        Un Pokémon temible que remata a su presa una vez que su
        séquito de Pawniard la ha debilitado e inmovilizado.
      it: |-
        È molto crudele. Lascia che un gruppo di Pawniard attacchi
        la preda e, quando è ferita e non può più muoversi, la finisce.
    alpha-sapphire:
      ja-Hrkt: |-
        おおぜいの　コマタナを　したがえて
        えものを　むれで　おいつめる。
        とどめは　キリキザンが　さす。
      ja: |-
        大勢の　コマタナを　従えて
        獲物を　群れで　追いつめる。
        とどめは　キリキザンが　刺す。
      ko: |-
        많은 자망칼을 거느리며
        무리를 지어 먹이를 바싹 몰아넣는다.
        마무리는 절각참이 한다.
      en: |-
        Bisharp pursues prey in the company of a large
        group of Pawniard. Then Bisharp finishes off
        the prey.
      fr: |-
        Il chasse avec un groupe de Scalpion sous ses ordres,
        mais c’est lui qui donne le coup de grâce.
      de: |-
        Es rückt seinen Opfern mit einer Schar von Gladiantri im
        Gefolge auf den Pelz. Den letzten Hieb übernimmt es selbst.
      es: |-
        Su séquito son los Pawniard. Acorralan a su presa con todo
        el grupo y Bisharp propina el golpe de gracia.
      it: |-
        Accompagnato da molti Pawniard, blocca le prede grazie alla
        forza del gruppo. È Bisharp a dare il colpo di grazia.
    ultra-sun:
      ja-Hrkt: |-
        どんなに　つよい　キリキザンでも
        あたまの　やいばが　はこぼれすると
        ボスの　ざを　いんたいすると　いう。
      ja: |-
        どんなに　強い　キリキザンでも
        頭の　刃が　刃こぼれすると
        ボスの　座を　引退すると　いう。
      ko: |-
        아무리 강한 절각참이라도
        머리의 칼날의 이가 빠지면
        보스의 자리를 은퇴한다고 한다.
      zh-Hant: |-
        據說無論是多麼強大的劈斬司令，
        一旦頭上的刀刃出現了缺損，
        就會從首領的位子上退下來。
      zh-Hans: |-
        据说，无论是多么强大的劈斩司令，
        一旦头部的刀刃有损伤，
        就会从首领的位置上引退。
      en: |-
        No matter how strong the Bisharp, it’s said
        that if the blade on its head is chipped, it will
        retire from its position as the boss.
      fr: |-
        Peu importe la puissance du Scalproie,
        il abdique de son rôle de chef si la lame
        de sa tête subit la moindre ébréchure.
      de: |-
        Es heißt, dass ein Caesurio ungeachtet seiner
        Stärke seinen Rang als Anführer abtreten muss,
        wenn die Klinge an seinem Kopf schartig wird.
      es: |-
        Por fuerte que sea un Bisharp, la más mínima
        mella en la hoja de su cabeza es deshonrosa
        y motivo de destitución como líder de su grupo.
      it: |-
        Per quanto sia forte, se la lama sulla sua testa
        viene intaccata deve rinunciare al comando
        del gruppo.
    ultra-moon:
      ja-Hrkt: |-
        コマタナの　むれを　ひきいている。
        あいてに　とどめを　さすときも
        いっさい　ひょうじょうを　かえない。
      ja: |-
        コマタナの　群れを　率いている。
        相手に　止めを　刺すときも
        一切　表情を　変えない。
      ko: |-
        자망칼의 무리를 거느리고 있다.
        상대를 마무리할 때도
        전혀 표정을 바꾸지 않는다.
      zh-Hant: |-
        率領著成群的駒刀小兵。
        即使在給對手致命一擊的時候，
        也完全面不改色。
      zh-Hans: |-
        率领着驹刀小兵群。
        在给对手致命一击时，
        也完全面不改色。
      en: |-
        It leads a group of Pawniard. Bisharp doesn’t
        even change its expression when it deals
        the finishing blow to an opponent.
      fr: |-
        Il dirige une cohorte de Scalpion. Il ne laisse
        transparaître aucune émotion lorsqu’il assène
        le coup de grâce.
      de: |-
        Es führt eine Gruppe von Gladiantri an. Selbst
        wenn es dem Gegner den finalen Stoß versetzt,
        bleibt sein Gesichtsausdruck stets unverändert.
      es: |-
        Lidera un grupo de Pawniard y no muestra el
        más mínimo sentimiento ni cuando propina el
        ataque de gracia al rival.
      it: |-
        Comanda gruppi di Pawniard. Quando attacca
        il nemico per dargli il colpo di grazia, non lascia
        trasparire alcuna emozione.
    sword:
      ja-Hrkt: |-
        おおぜいの　コマタナを　したがえる。
        てしたたちが　うらぎらない　よう
        つねに　めを　ひからせている。
      ja: |-
        大勢の　コマタナを　従える。
        手下たちが　裏切らない　よう
        常に　目を　光らせている。
      ko: |-
        많은 수의 자망칼을 거느리고 있다.
        부하들이 배신하지 못하도록
        항상 눈에 불을 켜고 있다.
      zh-Hant: |-
        率領著一大群駒刀小兵。
        為了防止手下們背叛自己，
        總是睜大著眼睛監視牠們。
      zh-Hans: |-
        率领着一大群驹刀小兵。
        为了防止手下们背叛自己，
        总是睁大着眼睛监视它们。
      en: |-
        It’s accompanied by a large retinue of Pawniard.
        Bisharp keeps a keen eye on its minions, ensuring
        none of them even think of double-crossing it.
      fr: |-
        Il dirige des cohortes de Scalpion.
        Il garde constamment ses sous-fifres à l’œil
        pour parer à toute velléité de mutinerie.
      de: |-
        Es hat stets ein Gefolge aus mehreren Gladiantri
        und achtet immer streng darauf, dass ihm keiner
        seiner Handlanger in den Rücken fällt.
      es: |-
        Siempre va acompañado por un nutrido séquito
        de Pawniard, a los que no pierde nunca de vista
        para evitar posibles motines.
      it: |-
        È sempre accompagnato da molti Pawniard.
        Per evitare che si verifichino ammutinamenti,
        li tiene sempre sotto stretta sorveglianza.
    shield:
      ja-Hrkt: |-
        やいばを　とぐ　いしが　ある
        ばしょを　めぐって　オノンドと
        はげしい　あらそいを　くりひろげる。
      ja: |-
        刃を　研ぐ　石が　ある
        場所を　めぐって　オノンドと
        激しい　争いを　繰りひろげる。
      ko: |-
        칼날을 가는 돌의
        장소를 두고 액슨도와
        격렬하게 싸움을 벌인다.
      zh-Hant: |-
        為了搶佔能找到磨刀石
        的地方，和斧牙龍展開了
        激烈的鬥爭。
      zh-Hans: |-
        为了抢占能找到磨刀石
        的地方，和斧牙龙展开了
        激烈的斗争。
      en: |-
        Violent conflicts erupt between Bisharp and
        Fraxure over places where sharpening stones
        can be found.
      fr: |-
        Sa recherche des meilleurs endroits où trouver
        des pierres pour affûter ses lames le conduit
        souvent à affronter des Incisache.
      de: |-
        Sie streiten sich mit Sharfax aufs Heftigste um
        das Vorrecht auf Orte mit Felsen, an denen
        sie ihre Klingen schärfen können.
      es: |-
        Libra encarnizados combates con los Fraxure por
        el control de los emplazamientos donde se hallan
        las piedras con las que afila sus cuchillas.
      it: |-
        Affronta spesso Fraxure in violenti scontri
        per il controllo dei territori in cui si trovano
        le pietre che usa per affilare le sue lame.
