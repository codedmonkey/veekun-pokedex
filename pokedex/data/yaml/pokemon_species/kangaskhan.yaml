      fr: |-
        Ce Pokémon élève son petit dans sa poche
        ventrale. Il est prêt à combattre n’importe quel
        ennemi pour le protéger.
      de: |-
        Es zieht sein Junges in seiner Bauchtasche auf.
        Um es zu schützen, nimmt es mit jedem Gegner
        den Kampf auf.
      es: |-
        Cuida de la cría que lleva en la bolsa de su
        panza y se enfrenta a todo aquel que supone
        una amenaza para protegerla.
      it: |-
        Cresce il suo cucciolo dentro al marsupio.
        È pronto a qualsiasi lotta pur di proteggerlo.
    sword:
      ja-Hrkt: |-
        はらの　ふくろに　こどもが　いるが
        フットワークは　とても　かるい。
        すばやいジャブで　あいてを　いかく。
      ja: |-
        腹の　袋に　子どもが　いるが
        フットワークは　とても　軽い。
        素早いジャブで　相手を　威嚇。
      ko: |-
        배의 주머니에 새끼가 있지만
        발놀림은 매우 가볍다.
        재빠른 잽으로 상대를 위협한다.
      zh-Hant: |-
        腹部的袋子裡裝著孩子，
        但是步法非常輕盈。
        會用高速的刺拳威嚇對手。
      zh-Hans: |-
        虽然腹部的袋子里装着
        宝宝，步法却极为轻盈。
        会用快速的刺拳威吓对手。
      en: |-
        Although it’s carrying its baby in a pouch on
        its belly, Kangaskhan is swift on its feet. It
        intimidates its opponents with quick jabs.
      fr: |-
        Porter son petit dans sa poche ventrale ne
        l’empêche pas d’avoir un bon jeu de jambes.
        Ses coups rapides intimident ses ennemis.
      de: |-
        Obwohl es sein Junges im Beutel trägt, bewegt
        sich dieses Pokémon äußerst leichtfüßig. Gegner
        schreckt Kangama mit blitzschnellen Schlägen ab.
      es: |-
        Aunque lleve una cría en el marsupio, su juego
        de pies no pierde ligereza. Abruma al rival con
        ráfagas de ágiles puñetazos.
      it: |-
        Ha un agile gioco di gambe, nonostante si porti
        appresso il cucciolo nel marsupio ventrale.
        Intimidisce gli avversari con jab velocissimi.
    shield:
      ja-Hrkt: |-
        こどもの　いない　ガルーラが
        そうなんした　にんげんの　こを
        そだてていたという　きろくがある。
      ja: |-
        子どもの　いない　ガルーラが
        遭難した　人間の　子を
        育てていたという　記録がある。
      ko: |-
        새끼가 없는 캥카가
        조난한 사람의 아이를
