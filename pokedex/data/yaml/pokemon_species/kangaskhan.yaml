        pouch. It lets the baby out to
        play only when it feels safe.
    white-2:
      en: |-
        It raises its offspring in its belly
        pouch. It lets the baby out to
        play only when it feels safe.
    x:
      ja-Hrkt: |-
        おなかの　ふくろで　こそだてをする。
        あんぜんな　ときだけ　こどもを
        ふくろから　だして　あそばせる。
      ja: |-
        お腹の　袋で　子育てをする。
        安全な　ときだけ　子供を
        袋から　出して　遊ばせる。
      ko: |-
        배의 주머니에서 새끼를 키운다.
        안전할 때만 새끼를
        주머니에서 꺼내어 놀게 한다.
      en: |-
        It raises its offspring in its belly pouch. It lets the
        baby out to play only when it feels safe.
      fr: |-
        Il élève ses petits dans sa poche ventrale. Il attend
        d’être en lieu sûr pour les laisser jouer dehors.
      de: |-
        Sein Nachwuchs wächst in seinem Beutel heran.
        Nur wenn es sicher ist, darf das Junge aus dem Beutel.
      es: |-
        Lleva a su cría en la bolsa de su panza. Solo deja que
        su cría salga a jugar cuando no siente peligro.
      it: |-
        Tiene il cucciolo nel marsupio che ha sulla pancia e
        lo lascia uscire solo quando non ci sono pericoli.
    'y':
      ja-Hrkt: |-
        あんぜんな　ばしょなら　こどもも
        おなかの　ふくろから　でて　あそぶ。
        おやは　それを　じっと　みまもる。
      ja: |-
        安全な　場所なら　子供も
        お腹の　袋から　出て　遊ぶ。
        親は　それを　じっと　見守る。
      ko: |-
        안전한 장소라면 새끼도
        배의 주머니에서 나와서 논다.
        어미는 그것을 가만히 지켜본다.
      en: |-
        If it is safe, the young gets out of the belly pouch
        to play. The adult keeps a close eye on
        the youngster.
      fr: |-
        Dans les endroits sûrs, le petit quitte sa poche pour
        jouer sous la protection des adultes.
      de: |-
        Fühlt es sich sicher, dann verlässt das Junge
        den Beutel. Die Mutter behält es ständig im Auge.
      es: |-
        Si no hay peligro, el joven sale de la bolsa y juega.
        El adulto vigila atentamente al joven.
      it: |-
        Se è al sicuro, il piccolo esce dal marsupio e inizia
        a giocare sotto gli occhi vigili dell’adulto.
    omega-ruby:
      ja-Hrkt: |-
        ガルーラの　こどもが　１ぴきで　あそんでいても
        ぜったいに　つかまえたりしては　いけないよ。
        ちかくに　いる　おやが　はげしく　おこりだすぞ。
      ja: |-
        ガルーラの　子どもが　１匹で　遊んでいても
        絶対に　捕まえたりしては　いけないよ。
        近くに　いる　親が　激しく　怒りだすぞ。
      ko: |-
        캥카의 새끼가 혼자서 놀고 있어도
        절대로 잡으려 하면 안 된다.
        가까이 있는 부모가 격렬히 화낸다.
      en: |-
        If you come across a young Kangaskhan playing by itself, you
        must never disturb it or attempt to catch it. The baby
        Pokémon’s parent is sure to be in the area, and it will become
        violently enraged at you.
      fr: |-
        Lorsqu’on rencontre un petit Kangourex qui joue tout seul,
        il ne faut jamais le déranger ou essayer de l’attraper.
        Les parents du bébé Pokémon sont sûrement dans le coin
        et ils risquent d’entrer dans une colère noire.
      de: |-
        Wenn du auf ein junges, spielendes Kangama stößt,
        solltest du es nicht stören oder versuchen, es einzufangen.
        Die Mutter dieses Baby-Pokémon ist bestimmt in Reichweite
        und könnte sehr wütend auf dich werden.
      es: |-
        No es recomendable molestar ni intentar atrapar a crías de
        Kangaskhan mientras estén jugando, ya que seguro que su
        madre anda cerca y reaccionará con enfado y violencia.
      it: |-
        Vedendo un cucciolo di Kangaskhan giocare per conto suo,
        non bisogna mai disturbarlo o cercare di catturarlo.
        Il suo genitore, infatti, è sicuramente nei paraggi e potrebbe
        reagire molto violentemente.
    alpha-sapphire:
      ja-Hrkt: |-
