        solltest du es nicht stören oder versuchen, es einzufangen.
        Die Mutter dieses Baby-Pokémon ist bestimmt in Reichweite
        und könnte sehr wütend auf dich werden.
      es: |-
        No es recomendable molestar ni intentar atrapar a crías de
        Kangaskhan mientras estén jugando, ya que seguro que su
        madre anda cerca y reaccionará con enfado y violencia.
      it: |-
        Vedendo un cucciolo di Kangaskhan giocare per conto suo,
        non bisogna mai disturbarlo o cercare di catturarlo.
        Il suo genitore, infatti, è sicuramente nei paraggi e potrebbe
        reagire molto violentemente.
    sun:
      ja-Hrkt: |-
        ガルーラの　ははおやの　あいじょうは
        ふかい。　わがこを　まもるためならば
        しさえ　おそれないと　いわれている。
      ja: |-
        ガルーラの　母親の　愛情は
        深い。　我が子を　守るためならば
        死さえ　恐れないと　いわれている。
      ko: |-
        캥카의 모성애는 깊다.
        자기 아이를 지키기 위해서라면
        죽음조차 두려워하지 않는다고 한다.
      zh-Hant: |-
        袋獸的母愛很深。
        如果是為了守護自己的孩子，
        據說連死都毫不畏懼。
      zh-Hans: |-
        袋兽的母爱很深。
        如果是为了守护自己的孩子，
        据说连死都毫不畏惧。
      en: |-
        Kangaskhan’s maternal love is so deep that it
        will brave death to protect its offspring.
      fr: |-
        L’amour maternel de Kangourex est sans limites.
        Elle marcherait au-devant de la mort pour
        protéger son bébé.
      de: |-
        Die Mutterliebe des ausgewachsenen Kangama
        ist tief. Es wäre sogar bereit, sein eigenes Leben
        zu opfern, um sein Junges zu beschützen.
      es: |-
        Profesa un fuerte amor por su cría. Se dice que
        es capaz de enfrentarse sin temor a cualquier
        peligro con tal de protegerla.
      it: |-
        L’amore materno di Kangaskhan è molto
        profondo. Non esiterebbe a mettere in pericolo
        la propria vita pur di proteggere il suo piccolo.
    moon:
      ja-Hrkt: |-
        おなかの　こどもは　およそ　３ねんで
        おやばなれする。　ははおやが
        おおごえで　なくのは　そのときだけ。
      ja: |-
        お腹の　子どもは　およそ　３年で
        親離れする。　母親が
        大声で　鳴くのは　その時だけ。
      ko: |-
        뱃속의 새끼는 대략 3년이면
        자립한다. 어미가 큰 소리로
        우는 것은 그때뿐이다.
      zh-Hant: |-
        育兒袋裡的孩子
        大約３年左右會離開母親自立。
        只有在那個時候母親才會大聲鳴叫。
      zh-Hans: |-
        育儿袋中的孩子大约３年后
        才会离开母亲。
        只有在那个时候母亲才会大声地鸣叫。
      en: |-
        The child in its pouch leaves home after roughly
        three years. That is the only time the mother is
        heard to cry wildly.
      fr: |-
        Le bébé quitte la poche de sa mère au bout
        de trois ans. C’est le seul moment de sa vie
        où elle pleure à chaudes larmes.
      de: |-
        Das Junge verlässt den Beutel der Mutter im
        Alter von drei Jahren. Dies ist der einzige Zeit-
        punkt, zu dem man die Mutter laut weinen hört.
      es: |-
        La cría se separa de su madre cuando ronda los
        tres años. Es el único momento en el que la
        madre llora con vehemencia.
      it: |-
        Il cucciolo esce dal marsupio verso i tre anni
        ed è l’unico momento in cui la madre si lascia
        sfuggire possenti grida.
    ultra-sun:
      ja-Hrkt: |-
        おなかの　ふくろに　わがこを　いれて
        まもる。　こどもを　きずつけたものは
        ぜったいに　ゆるさず　たたきのめす。
      ja: |-
        お腹の　袋に　我が子を　入れて
        守る。　子どもを　傷つけた者は
        絶対に　許さず　叩きのめす。
      ko: |-
        배의 주머니에 자신의 새끼를 넣어
        지킨다. 새끼에게 해를 끼치는 자는
        절대 용서하지 않고 때려눕힌다.
      zh-Hant: |-
        把自己的孩子放進腹部的
        袋子裡保護，會毫不留情地
        狠狠教訓傷害自己孩子的傢伙。
      zh-Hans: |-
        会把自己的孩子放入腹袋里保护起来。
        对于胆敢伤害自己孩子的家伙，
        会毫不留情地予以痛击。
      en: |-
        Kangaskhan protects its child by keeping it in
        its pouch. It has zero forgiveness for those
        who harm its child and will beat them down.
      fr: |-
        Kangourex protège son petit en le mettant
        dans sa poche, et se montre sans pitié envers
        quiconque ose lui faire du mal.
      de: |-
        Sein Junges beschützt es in seinem Beutel.
        Wer dieses verwundet, den erwarten Kangamas
        Groll und eine rücksichtslose Tracht Prügel.
      es: |-
        Mete a la cría en su marsupio para protegerla. Si
        alguien hace daño a su retoño, monta en cólera
        y ataca al agresor sin miramientos.
      it: |-
        Protegge il proprio cucciolo tenendolo nel
        marsupio che ha sulla pancia e attacca
        furiosamente chiunque osi ferirlo.
    ultra-moon:
      ja-Hrkt: |-
        ふくろから　ぬけだして　あそんでいる
        こどもには　ちかづいては　いけない。
        どこかで　ははおやが　みまもっている。
      ja: |-
        袋から　抜け出して　遊んでいる
        子どもには　近付いては　いけない。
        どこかで　母親が　見守っている。
      ko: |-
        주머니를 빠져나와 놀고 있는
        새끼에게는 다가가선 안 된다.
        어딘가에서 어미가 지켜보고 있다.
      zh-Hant: |-
        絕對不要靠近從袋獸腹中
        溜出來玩耍的孩子，
        因為母親正在某處守護著牠。
      zh-Hans: |-
        不能接近从袋里溜出来玩耍的孩子。
        因为它的母亲就在某处守护着它。
      en: |-
        You shouldn’t get close to the child when it’s
        playing outside its mother’s pouch. Its mother is
        always nearby watching over it.
      fr: |-
        Ne vous approchez surtout pas d’un bébé
        Kangourex sorti de sa poche pour jouer !
        Sa mère le surveille sûrement d’un peu plus loin.
      de: |-
        Wer ein Kangama-Junges sieht, das zum Spielen
        den Beutel verlassen hat, sollte sich ihm nicht
        nähern. Seine Mutter behält es stets im Auge.
      es: |-
        No es prudente acercarse a un retoño que esté
        jugando fuera de su bolsa, pues la madre nunca
        anda lejos.
      it: |-
        Non bisogna avvicinarsi a un cucciolo che gioca
        fuori dal marsupio: la madre è sempre nei
        paraggi e vigila attenta su di lui.
    lets-go-pikachu:
      ja-Hrkt: |-
        おなかのふくろで　こどもをそだてる。
        こどもを　まもるためになら　どんな
        あいてにも　たちむかっていく。
      ja: |-
        お腹の袋で　子供を育てる。
        子供を　守るためになら　どんな
        相手にも　立ち向かっていく。
      ko: |-
        배의 주머니에서 새끼를 키운다.
        새끼를 지키기 위해서라면
        어떤 상대든지 맞서 싸운다.
      zh-Hant: |-
        把孩子放在腹部的袋中養育。
        為了保護自己的孩子，不管遇上
        什麼對手都會勇敢對抗。
      zh-Hans: |-
        在腹部的袋子里养育自己的
        宝宝。为了保护宝宝，遇到
        什么样的敌人都不会退缩。
      en: |-
        Raises its young in its belly pouch. Won’t run
        from any fight to keep its young protected.
      fr: |-
        Ce Pokémon élève son petit dans sa poche
        ventrale. Il est prêt à combattre n’importe quel
        ennemi pour le protéger.
      de: |-
        Es zieht sein Junges in seiner Bauchtasche auf.
        Um es zu schützen, nimmt es mit jedem Gegner
        den Kampf auf.
      es: |-
        Cuida de la cría que lleva en la bolsa de su
        panza y se enfrenta a todo aquel que supone
        una amenaza para protegerla.
      it: |-
        Cresce il suo cucciolo dentro al marsupio.
        È pronto a qualsiasi lotta pur di proteggerlo.
    lets-go-eevee:
      ja-Hrkt: |-
        おなかのふくろで　こどもをそだてる。
        こどもを　まもるためになら　どんな
        あいてにも　たちむかっていく。
      ja: |-
        お腹の袋で　子供を育てる。
        子供を　守るためになら　どんな
        相手にも　立ち向かっていく。
      ko: |-
