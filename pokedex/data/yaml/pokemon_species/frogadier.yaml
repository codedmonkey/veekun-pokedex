frogadier:
  base_happiness: 70
  capture_rate: 45
  color: blue
  egg_groups:
    - water1
  evolution_chain: froakie
  evolves_from: froakie
  flavor_text:
    x:
      ja-Hrkt: |-
        あわで　つつんだ　こいしを　なげる
        わざを　つかう。３０メートル　さきの
        あきかんに　あてる　コントロール。
      ja: |-
        泡で　包んだ　小石を　投げる
        技を　使う。３０メートル　先の
        空き缶に　当てる　コントロール。
      ko: |-
        거품으로 싸인 돌멩이를 던지는
        기술을 쓴다. 30m 앞에 있는
        빈 캔을 맞출 정도로 컨트롤이 좋다.
      en: |-
        It can throw bubble-covered pebbles with precise
        control, hitting empty cans up to a hundred feet away.
      fr: |-
        Il est capable de lancer des pierres recouvertes
        de mousse avec une précision suffisante pour toucher
        une canette vide à 30 m.
      de: |-
        Es kann kleine in Blasen gehüllte Steine mit solcher
        Präzision werfen, dass es selbst 30 m entfernte Dosen
        problemlos trifft.
      es: |-
        Puede lanzar piedras envueltas en burbujas con tal
        puntería, que acierta latas vacías a 30 metros de
        distancia.
      it: |-
        Lancia dei sassi racchiusi in bolle di schiuma.
        È talmente preciso da riuscire a colpire una lattina
        vuota a 30 m di distanza.
    'y':
      ja-Hrkt: |-
        みがるさは　だれにも　まけない。
        ６００メートルを　こえる　タワーの
        てっぺんまで　１ぷんで　のぼりきる。
      ja: |-
        身軽さは　だれにも　負けない。
        ６００メートルを　超える　タワーの
        天辺まで　１分で　登りきる。
      ko: |-
        누구보다도 가벼운 몸을 갖고 있다.
        600m를 넘는 타워의
        꼭대기까지 1분이면 올라간다.
      en: |-
        Its swiftness is unparalleled.
        It can scale a tower of more
        than 2,000 feet in a minute’s time.
      fr: |-
        Son agilité est incomparable.
        Il peut gravir une tour de 600 m de haut en moins
        d’une minute.
      de: |-
        Seine Flinkheit sucht ihresgleichen. Es kann einen
        600 m hohen Turm in weniger als einer Minute
        erklimmen.
      es: |-
        Su agilidad no tiene parangón. De hecho, es capaz
        de escalar una torre de más de 600 metros en tan
        solo un minuto.
      it: |-
        Grazie alla sua straordinaria agilità, è in grado di
        scalare una torre alta più di 600 m in meno
        di un minuto.
    omega-ruby:
      ja-Hrkt: |-
        あわで　つつんだ　こいしを　なげる
        わざを　つかう。３０メートル　さきの
        あきかんに　あてる　コントロール。
      ja: |-
        泡で　包んだ　小石を　投げる
        技を　使う。３０メートル　先の
        空き缶に　当てる　コントロール。
      ko: |-
        거품으로 싸인 돌멩이를 던지는
        기술을 쓴다. 30m 앞에 있는
        빈 캔을 맞힐 정도로 컨트롤이 좋다.
      en: |-
        It can throw bubble-covered pebbles with precise
        control, hitting empty cans up to a hundred feet away.
      fr: |-
        Il est capable de lancer des pierres recouvertes de mousse
        avec une précision suffisante pour toucher une canette vide
        à 30 m.
      de: |-
        Es kann kleine in Blasen gehüllte Steine mit solcher Präzision
        werfen, dass es selbst 30 m entfernte Dosen problemlos trifft.
      es: |-
        Puede lanzar piedras envueltas en burbujas con tal puntería
        que acierta latas vacías a 30 metros de distancia.
      it: |-
        Lancia dei sassi racchiusi in bolle di schiuma. È talmente
        preciso da riuscire a colpire una lattina vuota a 30 m
        di distanza.
    alpha-sapphire:
      ja-Hrkt: |-
        みがるさは　だれにも　まけない。
        ６００メートルを　こえる　タワーの
        てっぺんまで　１ぷんで　のぼりきる。
      ja: |-
        身軽さは　だれにも　負けない。
        ６００メートルを　超える　タワーの
        天辺まで　１分で　登りきる。
      ko: |-
        누구보다도 가벼운 몸을 갖고 있다.
        600m를 넘는 타워의
        꼭대기까지 1분이면 올라간다.
      en: |-
        Its swiftness is unparalleled.
        It can scale a tower of more
        than 2,000 feet in a minute’s time.
      fr: |-
        Son agilité est incomparable. Il peut gravir une tour de 600 m
        de haut en moins d’une minute.
      de: |-
        Seine Flinkheit sucht ihresgleichen. Es kann einen 600 m
        hohen Turm in weniger als einer Minute erklimmen.
      es: |-
        Su agilidad no tiene parangón. De hecho, es capaz de escalar
        una torre de más de 600 metros en tan solo un minuto.
      it: |-
        Grazie alla sua straordinaria agilità, è in grado di scalare una
        torre alta più di 600 m in meno di un minuto.
