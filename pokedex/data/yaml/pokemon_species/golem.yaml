golem:
  base_happiness: 70
  capture_rate: 45
  color: brown
  egg_groups:
    - mineral
  evolution_chain: geodude
  evolves_from: graveler
  flavor_text:
    red:
      en: |-
        Its boulder-like
        body is extremely
        hard. It caneasily withstand
        dynamite blasts
        without damage.
    blue:
      en: |-
        Its boulder-like
        body is extremely
        hard. It caneasily withstand
        dynamite blasts
        without damage.
    yellow:
      en: |-
        Once it sheds its
        skin, its body
        turns tender andwhitish. Its hide
        hardens when it's
        exposed to air.
    gold:
      en: |-
        It sheds its skin
        once a year. The
        discarded shellimmediately hard­
        ens and crumbles
        away.
    silver:
      en: |-
        It is capable of
        blowing itself up.
        It uses thisexplosive force to
        jump from mountain
        to mountain.
    crystal:
      en: |-
        Its rock-like body
        is so durable,
        even high-powereddynamite blasts
        fail to scratch
        its rugged hide.
    ruby:
      en: |-
        GOLEM live up on mountains.
        If there is a large earthquake, these
        POKéMON will come rolling down offthe mountains en masse to the
        foothills below.
    sapphire:
      en: |-
        GOLEM is known for rolling down from
        mountains. To prevent them from rolling
        into the homes of people downhill,grooves have been dug into the sides of
        mountains to serve as guideways for
        diverting this POKéMON’s course.
    emerald:
      en: |-
        It is said to live in volcanic craters
        on mountain peaks. Once a year, it sheds
        its hide and grows larger. The shed hide
        crumbles and returns to the soil.
    firered:
      en: |-
        It is enclosed in a hard shell that is as
        rugged as slabs of rock. It sheds skin
        once a year to grow larger.
    leafgreen:
      en: |-
        Its boulder-like body is extremely hard.
        It can easily withstand dynamite blasts
        without taking damage.
    diamond:
      en: |-
        It sheds its hide once a year.
        Its boulderlike body is so tough,
        even dynamite can’t harm it.
    pearl:
      en: |-
        It tumbles down mountains, leaving
        grooves from peak to base.
        Stay clear of these grooves.
    platinum:
      en: |-
        Even dynamite can’t harm its hard,
        boulderlike body. It sheds its hide
        just once a year.
    heartgold:
      en: |-
        It sheds its skin once a year.
        The discarded shell immediately
        hardens and crumbles away.
    soulsilver:
      en: |-
        It is capable of blowing itself up.
        It uses this explosive force to
        jump from mountain to mountain.
    black:
      en: |-
        Even dynamite can’t harm its hard,
        boulderlike body. It sheds its hide
        just once a year.
      fr: |-
        Aucun explosif ne pourrait entamer
        sa carapace de pierre. Il mue une
        fois par an.
    white:
      en: |-
        Even dynamite can’t harm its hard,
        boulderlike body. It sheds its hide
        just once a year.
      fr: |-
        Aucun explosif ne pourrait entamer
        sa carapace de pierre. Il mue une
        fois par an.
    black-2:
      en: |-
        Even dynamite can’t harm its hard,
        boulder-like body. It sheds its hide
        just once a year.
    white-2:
      en: |-
        Even dynamite can’t harm its hard,
        boulder-like body. It sheds its hide
        just once a year.
    x:
      ja-Hrkt: |-
        さんちょうから　ふもとまで　つづく
        みぞは　ゴローニャが　ころがりおちる
        とおりみちなので　ようちゅうい。
      ja: |-
        山頂から　ふもとまで　続く　溝は
        ゴローニャが　転がり落ちる
        通り道なので　要注意。
      ko: |-
        산 정상에서 산기슭까지 이어지는
        움푹 패인 홈은 딱구리가 굴러
        다니는 길이므로 주의가 필요하다.
      en: |-
        It tumbles down mountains, leaving grooves
        from peak to base. Stay clear of these grooves.
      fr: |-
        À force de dévaler les falaises, il a creusé de larges
        sillons. Mieux vaut ne pas s’en approcher.
      de: |-
        Sie rollen Berge hinunter und hinterlassen
        Spurrillen. Halte dich von diesen Rillen fern.
      es: |-
        Se lanza montaña abajo y deja un surco desde la cima
        hasta el pie. Es mejor mantenerse alejado.
      it: |-
        A furia di rotolare giù dalla cima dei monti, ha
        formato dei solchi. Meglio evitarli.
    'y':
      ja-Hrkt: |-
        がんせきの　ような　かたい　からだは
        ダイナマイトでも　きずつかない。
        １ねんに　１どだけ　だっぴする。
      ja: |-
        岩石の　ような　硬い　体は
        ダイナマイトでも　傷つかない。
        １年に　１度だけ　脱皮する。
      ko: |-
        암석 같은 단단한 몸은
        다이너마이트로도 상처를
        입힐 수 없다. 1년에 1번 탈피한다.
      en: |-
        Even dynamite can’t harm its hard, boulder-like
        body. It sheds its hide just once a year.
      fr: |-
        Aucun explosif ne pourrait entamer sa carapace de
        pierre. Il mue une fois par an.
      de: |-
        Selbst Sprengstoff kann seinem harten Körper
        nichts anhaben. Häutet sich nur einmal jährlich.
      es: |-
        Ni siquiera la dinamita puede dañar su cuerpo rocoso.
        Muda la piel una vez al año.
      it: |-
        Muta il guscio solo una volta all’anno. Neanche la
        dinamite può scalfire il suo corpo durissimo.
    omega-ruby:
      ja-Hrkt: |-
        おおきな　じしんが　おこると　やまに　すんでいる
        ゴローニャが　なんびきも　ふもとまで　ごろごろ
        ころがり　おちてくる　ことが　あるよ。
      ja: |-
        大きな　地震が　起こると　山に　すんでいる
        ゴローニャが　何匹も　ふもとまで　ごろごろ
        転がり　落ちてくる　ことが　あるよ。
      ko: |-
        큰 지진이 일어나면 산에 사는 딱구리
        여러 마리가 산기슭까지 데굴데굴
        굴러 내려오는 일이 있다.
      en: |-
        Golem live up on mountains. If there is a large earthquake,
        these Pokémon will come rolling down off the mountains
        en masse to the foothills below.
      fr: |-
        Grolem vit à la montagne. Lorsqu’il y a un tremblement de
        terre, ces Pokémon roulent en groupe vers les contreforts
        montagneux.
      de: |-
        Geowaz lebt hoch in den Bergen. Gibt es ein starkes
        Erdbeben, rollt dieses Pokémon so lange den Berg
        hinunter, bis es schließlich unten angekommen ist.
      es: |-
        Golem vive en las montañas. Si se produce un gran terremoto,
        estos Pokémon descienden rodando en masa por las laderas.
      it: |-
        I Golem vivono in alta montagna. In caso di terremoto,
        questi Pokémon rotolano giù per i monti in massa
        e si fermano a valle.
    alpha-sapphire:
      ja-Hrkt: |-
        やまの　しゃめんに　ほってある　みぞは　ころがり
        おちてきた　ゴローニャが　みんかに　ぶつからない
        ように　するための　とおりみちに　なっているぞ。
      ja: |-
        山の　斜面に　掘ってある　溝は　転がり
        落ちてきた　ゴローニャが　民家に　ぶつからない
        ように　するための　通り道に　なっているぞ。
      ko: |-
        산의 경사면에 파놓은 홈은 굴러
        내려오는 딱구리가 민가에 부딪히지
        않게 하기 위한 코스로 되어 있다.
      en: |-
        Golem is known for rolling down from mountains. To prevent
        them from rolling into the homes of people downhill, grooves
        have been dug into the sides of mountains to serve as
        guideways for diverting this Pokémon’s course.
      fr: |-
        On sait que les Grolem se laissent rouler en bas
        des montagnes. Afin d’éviter qu’ils roulent sur les maisons
        des gens, des tranchées ont été creusées le long des
        montagnes pour les guider dans leurs descentes infernales.
      de: |-
        Geowaz ist dafür bekannt, dass es Berghänge herunterrollt.
        Damit es nicht in die Häuser der Menschen hineinrollt, wurden
        Gräben so an den Bergen angelegt, dass der Weg dieses
        Pokémon umgeleitet wird.
      es: |-
        Golem es conocido por su afición a bajar de las montañas
        rodando. La gente que vive en la falda de las mismas ha
        cavado surcos para conducirlo en su descenso por las laderas
        y evitar que se cuele en sus casas.
      it: |-
        Golem è noto per rotolare in discesa lungo il pendio dei monti.
        Per evitare che finisca dentro le case a valle, sono stati creati
        dei canaloni sui pendii dei monti per guidarne il percorso
        durante la discesa.
    sun:
      ja-Hrkt: |-
        ダイナマイトで　ばくは　しても
        キズひとつ　つかない　からだ　だが
        しっけや　あめは　だいきらい。
      ja: |-
        ダイナマイトで　爆破　しても
        傷ひとつ　つかない　身体　だが
        湿気や　雨は　大嫌い。
      ko: |-
        다이너마이트로 폭파해도
        상처 하나 입지 않는 몸이지만
        습기나 비는 아주 싫어한다.
      zh-Hant: |-
        堅硬的身體就算
        被炸藥爆破也能毫無損傷，
        但最討厭濕氣和雨水。
      zh-Hans: |-
        即使用炸药爆破身体也毫发无伤，
        但非常讨厌湿气和雨。
      en: |-
        Its body can survive dynamite blasts without
        a single scratch, but it hates rain and humidity.
      fr: |-
        Son corps est si solide qu’il peut résister à
        l’explosion d’un bâton de dynamite, mais il
        craint l’humidité et la pluie.
      de: |-
        Selbst Sprengstoff kann seinem harten Körper
        nichts anhaben. Es verabscheut Feuchtigkeit
        und Regen.
      es: |-
        Su robusto cuerpo puede soportar una explosión
        de dinamita sin inmutarse, pero no tolera bien ni
        la humedad ni la lluvia.
      it: |-
        Il suo corpo non viene scalfito neanche dalla
        dinamite. Tuttavia, teme la pioggia e l’umidità.
    moon:
      ja-Hrkt: |-
        １ねんに　１ど　だっぴ。　ぬいだカラは
        つちに　かえり　どじょうを　ゆたかに
        するので　のうかが　あつめている。
      ja: |-
        １年に　１度　脱皮。　脱いだ殻は
        土に　かえり　土壌を　豊かに
        するので　農家が　集めている。
      ko: |-
        1년에 1번 탈피한다. 벗어낸 껍데기는
        흙으로 돌아가 토양을 비옥하게
        해서 농가에서 모으고 있다.
      zh-Hant: |-
        每年脫皮１次。
        脫下的皮掉到土裡可讓土壤肥沃，
        因此農戶便會將它收集起來。
      zh-Hans: |-
        １年蜕１次皮。
        蜕下的壳掉到土里会让土壤肥沃，
        因此农户会收集起来。
      en: |-
        Once a year, this Pokémon molts, and its shed
        shell returns to the soil. This process creates
        enriched soil, so farmers collect the shells.
      fr: |-
        Ce Pokémon mue une fois par an. Sa carapace
        se transforme en humus très prisé par les
        agriculteurs.
      de: |-
        Einmal im Jahr häutet es sich. Die abgestreifte
        Haut wird oft von Bauern eingesammelt, da sie
        sich ausgezeichnet als Dünger verwenden lässt.
      es: |-
        Muda su caparazón una vez al año. En muchas
        granjas lo aprovechan, pues este se puede
        utilizar para fertilizar el suelo.
      it: |-
        Fa la muta una volta all’anno. Il guscio
        abbandonato viene recuperato dagli agricoltori
        per le sue proprietà fertilizzanti.
    ultra-sun:
      ja-Hrkt: |-
        としおいると　だっぴ　しなくなる。
        ながくながく　いきた　ゴローニャの
        カラは　こけむしていて　みどりだ。
      ja: |-
        年老いると　脱皮　しなくなる。
        長く長く　生きた　ゴローニャの
        カラは　苔むしていて　緑だ。
      ko: |-
        나이가 들면 탈피를 하지 않는다.
        긴 세월을 산 딱구리의 껍질은
        이끼가 끼어 초록색이다.
      zh-Hant: |-
        年老之後就不會再脫皮。
        活過了漫長歲月的隆隆岩
        外皮會長滿苔蘚而變成綠色。
      zh-Hans: |-
        年老后就不会蜕皮了。
        活过了漫长岁月的隆隆岩身上的
        外皮会长满苔藓变成绿色。
      en: |-
        When Golem grow old, they stop shedding their
        shells. Those that have lived a long, long time
        have shells green with moss.
      fr: |-
        Lorsqu’il arrive à un âge avancé, il arrête de
        muer. Un Grolem ayant vécu très longtemps
        est recouvert de mousse verte.
      de: |-
        Im Alter hört es auf, sich zu häuten. Der Panzer
        betagter Geowaz ist mit dichtem, grünem Moos
        bewachsen.
      es: |-
        A medida que envejece, pierde la facultad de
        mudar la piel. Se han observado ejemplares de
        edad avanzada totalmente cubiertos de musgo.
      it: |-
        Quando invecchia, non fa più la muta.
        Il guscio dei Golem molto anziani si ricopre
        di muschio tingendosi di verde.
    ultra-moon:
      ja-Hrkt: |-
        じぶんで　からだを　ばくはつさせる。
        そのパワーで　きゅうな　やまみちも
        すごい　スピードで　のぼっていく。
      ja: |-
        自分で　身体を　爆発させる。
        そのパワーで　急な　山道も
        すごい　スピードで　登っていく。
      ko: |-
        스스로 몸을 폭발시킨다.
        그 파워로 가파른 산길도
        굉장한 스피드로 올라간다.
      zh-Hant: |-
        會讓自己的身體爆炸，
        然後利用爆炸的力量
        快速登上陡峭的山路。
      zh-Hans: |-
        它会让自己的身体爆炸，
        然后利用这爆炸的力量，
        快速登上陡峭的山路。
      en: |-
        It detonates its own body. The power from
        that explosion can propel it up steep mountain
        paths with amazing speed.
      fr: |-
        Il est capable de faire exploser une partie de
        son corps. Le souffle lui permet de se projeter
        à toute vitesse vers les sommets.
      de: |-
        Es kann sich in die Luft sprengen. Diese
        Explosionen setzt es ein, um selbst steile
        Bergpfade in rasantem Tempo zu meistern.
      es: |-
        Puede hacer estallar su cuerpo a voluntad. El
        impulso que esto genera le permite ascender
        a toda velocidad a la cima de las montañas.
      it: |-
        Può farsi esplodere e risalire a gran velocità
        i pendii montani più ripidi sfruttando la
        spinta che riceve.
    lets-go-pikachu:
      ja-Hrkt: |-
        だっぴ　したてのときは　ぜんたいが
        しろっぽく　やわらかいが　すぐに
        くうきに　ふれて　かたくなる。
      ja: |-
        脱皮　したてのときは　全体が
        白っぽく　柔らかいが　すぐに
        空気に　ふれて　硬くなる。
      ko: |-
        탈피한 직후에는 전체가
        하얗고 부드럽지만 금방
        공기와 접촉해서 단단해진다.
      zh-Hant: |-
        剛蛻皮的時候身體比較軟
        而且顏色偏白，但在接觸到
        空氣後很快就會變硬。
      zh-Hans: |-
        刚蜕皮时浑身都白白的
        非常柔软，但是接触到
        空气之后会迅速变坚硬。
      en: |-
        Once it sheds its skin, its body turns tender
        and whitish. Its hide hardens when it’s
        exposed to air.
      fr: |-
        Juste après la mue, son corps est blanc et
        tendre. Au contact de l’air, sa peau se solidifie
        et forme une armure.
      de: |-
        Nachdem es sich gehäutet hat, wird sein Körper
        weich und hell. Durch den Kontakt mit der Luft
        erhärtet er aber sofort wieder.
      es: |-
        Nada más mudar la piel, su cuerpo se vuelve
        blando y blanquecino, pero se endurece al poco
        tiempo de entrar en contacto con el aire.
      it: |-
        Subito dopo la muta il suo corpo è bianco
        e morbido, ma al contatto con l’aria si trasforma
        immediatamente in una dura corazza.
    lets-go-eevee:
      ja-Hrkt: |-
        だっぴ　したてのときは　ぜんたいが
        しろっぽく　やわらかいが　すぐに
        くうきに　ふれて　かたくなる。
      ja: |-
        脱皮　したてのときは　全体が
        白っぽく　柔らかいが　すぐに
        空気に　ふれて　硬くなる。
      ko: |-
        탈피한 직후에는 전체가
        하얗고 부드럽지만 금방
        공기와 접촉해서 단단해진다.
      zh-Hant: |-
        剛蛻皮的時候身體比較軟
        而且顏色偏白，但在接觸到
        空氣後很快就會變硬。
      zh-Hans: |-
        刚蜕皮时浑身都白白的
        非常柔软，但是接触到
        空气之后会迅速变坚硬。
      en: |-
        Once it sheds its skin, its body turns tender
        and whitish. Its hide hardens when it’s
        exposed to air.
      fr: |-
        Juste après la mue, son corps est blanc et
        tendre. Au contact de l’air, sa peau se solidifie
        et forme une armure.
      de: |-
        Nachdem es sich gehäutet hat, wird sein Körper
        weich und hell. Durch den Kontakt mit der Luft
        erhärtet er aber sofort wieder.
      es: |-
        Nada más mudar la piel, su cuerpo se vuelve
        blando y blanquecino, pero se endurece al poco
        tiempo de entrar en contacto con el aire.
      it: |-
        Subito dopo la muta il suo corpo è bianco
        e morbido, ma al contatto con l’aria si trasforma
        immediatamente in una dura corazza.
    legends-arceus:
      en: |-
        The rocklike shell is shed each year. The cast-off shell then
        crumbles, reverting to a mass of soil, which can be spread across
        fields to promote crop growth.
