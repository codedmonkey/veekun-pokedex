milotic:
  base_happiness: 50
  capture_rate: 60
  color: pink
  egg_groups:
    - water1
    - dragon
  evolution_chain: feebas
  evolves_from: feebas
  flavor_text:
    ruby:
      en: |-
        MILOTIC is said to be the most
        beautiful of all the POKéMON.
        It has the power to becalm suchemotions as anger and hostility to quell
        bitter feuding.
    sapphire:
      en: |-
        MILOTIC live at the bottom of large
        lakes. When this POKéMON’s body glows a
        vivid pink, it releases a pulsing wave ofenergy that brings soothing calm to
        restless spirits.
    emerald:
      en: |-
        It is said to live at the bottom of
        large lakes. Considered to be the most
        beautiful of all POKéMON, it has been
        depicted in paintings and statues.
    firered:
      en: |-
        MILOTIC is breathtakingly beautiful.
        Those that see it are said to forget their
        combative spirits.
    leafgreen:
      en: |-
        MILOTIC is breathtakingly beautiful.
        Those that see it are said to forget their
        combative spirits.
    diamond:
      en: |-
        When people bicker, it is said to
        arise from the depths of lakes to
        becalm violent hearts.
    pearl:
      en: |-
        It is the world’s most beautiful
        Pokémon. There are many works of
        art featuring MILOTIC.
    platinum:
      en: |-
        Its lovely scales are described as
        rainbow colored. They change color
        depending on the viewing angle.
    heartgold:
      en: |-
        It’s said that a glimpse of a
        MILOTIC and its beauty will calm any
        hostile emotions you’re feeling.
    soulsilver:
      en: |-
        It’s said that a glimpse of a
        MILOTIC and its beauty will calm any
        hostile emotions you’re feeling.
    black:
      en: |-
        Its lovely scales are described as
        rainbow colored. They change color
        depending on the viewing angle.
      fr: |-
        Ses splendides écailles aux couleurs
        de l’arc-en-ciel changent de teinte
        selon l’angle de vue.
    white:
      en: |-
        Its lovely scales are described as
        rainbow colored. They change color
        depending on the viewing angle.
      fr: |-
        Ses splendides écailles aux couleurs
        de l’arc-en-ciel changent de teinte
        selon l’angle de vue.
    black-2:
      en: |-
        Its lovely scales are described as
        rainbow colored. They change color
        depending on the viewing angle.
    white-2:
      en: |-
        Its lovely scales are described as
        rainbow colored. They change color
        depending on the viewing angle.
    x:
      ja-Hrkt: |-
        ミロカロスの　うつくしい　すがたを
        みた　ものは　あらそいの　きもちを
        わすれてしまうと　いわれている。
      ja: |-
        ミロカロスの　美しい　姿を
        見た者は　争いの　気持ちを
        忘れてしまうと　言われている。
      ko: |-
        밀로틱의 아름다운 모습을
        본 이는 싸우려던 마음가짐을
        잊어버린다고 한다.
      en: |-
        Milotic is breathtakingly beautiful. Those that see it
        are said to forget their combative spirits.
      fr: |-
        Milobellus est d’une beauté à couper le souffle.
        Ceux qui en voient un perdent aussitôt l’envie de se
        battre.
      de: |-
        Milotic ist atemberaubend schön. Man sagt,
        dass diejenigen, die es sehen, vergessen zu kämpfen.
      es: |-
        Milotic es impresionantemente bello. Quienes lo ven,
        temen perder las ganas de luchar contra él.
      it: |-
        Pokémon di una bellezza vertiginosa. Chi lo vede
        perde ogni voglia di combattere.
    'y':
      ja-Hrkt: |-
        せかいいち　うつくしい　ポケモン。
        ミロカロスを　モデルにした　かいがや
        ちょうこくが　たくさん　ある。
      ja: |-
        世界一　美しい　ポケモン。
        ミロカロスを　モデルにした
        絵画や　彫刻が　たくさん　ある。
      ko: |-
        세계에서 제일 아름다운
        포켓몬이다. 밀로틱을 모델로 한
        회화나 조각이 많이 있다.
      en: |-
        It is the world’s most beautiful Pokémon. There are
        many works of art featuring Milotic.
      fr: |-
        Le plus beau Pokémon du monde. De nombreuses
        œuvres d’art représentent Milobellus.
      de: |-
        Dies ist das schönste Pokémon der Welt. Es gibt
        viele Kunstwerke, die Milotic darstellen.
      es: |-
        Es el Pokémon más hermoso del mundo. Milotic ha
        inspirado numerosas obras de arte.
      it: |-
        È il Pokémon più bello del mondo. Ci sono parecchie
        opere d’arte ispirate a Milotic.
    omega-ruby:
      ja-Hrkt: |-
        もっとも　うつくしい　ポケモンと　いわれている。
        いかりや　にくしみの　こころを　いやして
        あらそいを　しずめる　ちからを　もっている。
      ja: |-
        最も　美しい　ポケモンと　いわれている。
        怒りや　憎しみの　心を　癒して
        争いを　鎮める　力を　持っている。
      ko: |-
        가장 아름다운 포켓몬이라고 불리고 있다.
        분노나 증오의 마음을 치유하여
        분쟁을 진정시키는 힘을 지니고 있다.
      en: |-
        Milotic is said to be the most beautiful of all the Pokémon.
        It has the power to becalm such emotions as anger and
        hostility to quell bitter feuding.
      fr: |-
        Certains prétendent que Milobellus est le plus beau de tous
        les Pokémon. Il a le pouvoir d’apaiser certaines émotions
        comme la colère ou l’hostilité, afin d’éviter les querelles
        inutiles.
      de: |-
        Milotic soll das schönste aller Pokémon sein. Es hat die
        Macht, Emotionen wie Wut und Feindseligkeit zu besänftigen
        und somit erbitterten Streit zu vermeiden.
      es: |-
        De Milotic se dice que es el Pokémon más bello. Tiene la
        capacidad de calmar sentimientos tales como el miedo y la
        hostilidad, y apaciguar las relaciones de áspera enemistad.
      it: |-
        Pare che Milotic sia il più bello tra tutti i Pokémon.
        Ha il potere di placare emozioni come la rabbia e l’astio,
        domando così anche le più accese controversie.
    alpha-sapphire:
      ja-Hrkt: |-
        おおきな　みずうみの　そこに　すんでいる。
        からだが　あざやかな　ピンクいろに　かがやくとき
        すさんだ　こころを　いやす　はどうを　はなつ。
      ja: |-
        大きな　湖の　底に　すんでいる。
        体が　鮮やかな　ピンク色に　輝くとき
        荒んだ　心を　癒す　波動を　放つ。
      ko: |-
        큰 호수의 밑바닥에 살고 있다.
        몸이 선명한 핑크빛으로 반짝일 때
        피폐해진 마음을 치유하는 파동을 발산한다.
      en: |-
        Milotic live at the bottom of large lakes. When this
        Pokémon’s body glows a vivid pink, it releases a pulsing
        wave of energy that brings soothing calm to troubled hearts.
      fr: |-
        Milobellus vit au fond des grands lacs. Lorsque le corps
        de ce Pokémon devient rose vif, il libère une pulsation
        d’énergie, capable d’apaiser les esprits agités.
      de: |-
        Milotic lebt auf dem Grund großer Seen. Wenn dieses
        Pokémon rosa leuchtet, gibt es eine Energiewelle ab,
        die einem zornigen Herzen wohltuende Ruhe verschaffen
        kann.
      es: |-
        Milotic vive en lo más profundo de los lagos. Cuando
        intensifica el color rosa de la piel, libera una fuerte onda de
        energía que tranquiliza a todo el que tenga el ánimo alterado.
      it: |-
        Milotic vive sui fondali dei grandi laghi. Quando il suo corpo
        riluce di un rosa intenso, rilascia una forte onda energetica,
        in grado di placare gli spiriti irrequieti.
    sun:
      ja-Hrkt: |-
        もっとも　うつくしい　ポケモンとも
        よばれ　おおくの　げいじゅつかに
        インスピレーションを　あたえてきた。
      ja: |-
        最も　美しい　ポケモンとも
        呼ばれ　多くの　芸術家に
        インスピレーションを　与えてきた。
      ko: |-
        가장 아름다운 포켓몬으로
        불리며 많은 예술가에게
        영감을 주고 있다.
      zh-Hant: |-
        也被稱為最美的寶可夢，
        一直以來帶給了藝術家無數靈感。
      zh-Hans: |-
        也被称为最美的宝可梦，
        一直给予许多艺术家灵感。
      en: |-
        Milotic has provided inspiration to many artists.
        It has even been referred to as the most
        beautiful Pokémon of all.
      fr: |-
        Célébré comme l’un des plus beaux Pokémon,
        il sert souvent de modèle et d’inspiration aux
        plus grands artistes.
      de: |-
        Milotic soll das schönste aller Pokémon sein.
        Es hat schon so manchem Künstler
        als Quelle der Inspiration gedient.
      es: |-
        Se dice que es el Pokémon más bello. Ha sido
        la fuente de inspiración de un gran número de
        artistas.
      it: |-
        È considerato il Pokémon più bello del mondo
        ed è fonte d’ispirazione per tantissimi artisti.
    moon:
      ja-Hrkt: |-
        すんだ　みずうみの　そこに　すむ。
        せんそうが　おこるとき　あらわれ
        ひとびとの　こころを　いやす。
      ja: |-
        澄んだ　湖の　底に　棲む。
        戦争が　起こるとき　現れ
        人々の　心を　いやす。
      ko: |-
        맑은 호수 바닥에 산다.
        전쟁이 일어날 때 나타나
        사람들의 마음을 치유한다.
      zh-Hant: |-
        棲息在清澈的湖底。
        在發生戰爭時出現，
        治癒人們的心。
      zh-Hans: |-
        栖息在清澈的湖底。
        在发生战争时出现，
        治愈人们的心。
      en: |-
        It lives at the bottom of clear lakes. In times of
        war, it shows itself, which soothes people’s
        minds and hearts.
      fr: |-
        Il vit au fond des lacs à l’eau claire. Il se révèle
        aux hommes en temps de guerre et apaise
        leurs cœurs meurtris.
      de: |-
        Es lebt auf dem Grund von klaren, ungetrübten
        Seen. Zu Kriegszeiten taucht es empor, um die
        Menschen zu besänftigen.
      es: |-
        Milotic vive en lo más profundo de lagos de
        agua cristalina. En tiempos de guerra aparece
        para calmar el corazón de los hombres.
      it: |-
        Vive in laghi dalle acque cristalline.
        Quando scoppia una guerra, compare
        per placare i cuori degli esseri umani.
    ultra-sun:
      ja-Hrkt: |-
        もっとも　うつくしいと　いわれるが
        ヒンバスが　すきで　そだててきた
        トレーナーには　びみょう　らしい。
      ja: |-
        最も　美しいと　いわれるが
        ヒンバスが　好きで　育ててきた
        トレーナーには　微妙　らしい。
      ko: |-
        가장 아름답다고 하지만
        빈티나가 좋아서 기른
        트레이너에게는 미묘한 듯하다.
      zh-Hant: |-
        被稱為最美的寶可夢。
        但就喜歡醜醜魚而培育牠的
        訓練家看來卻未必如此。
      zh-Hans: |-
        被称为最美的宝可梦，
        对于因喜爱丑丑鱼而培育它的
        训练家，好像很微妙。
      en: |-
        While Milotic is said to be the most beautiful
        Pokémon, Trainers who like Feebas and have
        raised it are seemingly disappointed by Milotic.
      fr: |-
        Il est considéré comme le plus beau de tous
        les Pokémon, mais il est loin de faire l’unanimité
        auprès des fans de Barpau !
      de: |-
        Es soll das schönste Pokémon sein, aber Trainer,
        die Barschwa trainiert haben, weil sie es mögen,
        sollen nicht so begeistert sein.
      es: |-
        Dicen que es el Pokémon más bello, pero es algo
        que los Entrenadores forofos de los Feebas
        ponen en tela de juicio.
      it: |-
        Si dice che sia il Pokémon più bello del mondo,
        ma su questo gli appassionati di Feebas più
        incalliti non sono d’accordo.
    ultra-moon:
      ja-Hrkt: |-
        おおきな　みずうみの　そこに　すむ。
        うつくしい　そのすがたは　みたものの
        こころの　けがれを　はらう　という。
      ja: |-
        大きな　湖の　底に　棲む。
        美しい　その姿は　見た者の
        心の　けがれを　はらう　という。
      ko: |-
        큰 호수 바닥에 산다.
        아름다운 그 모습은 보는 이의
        마음의 부정함을 없앤다고 한다.
      zh-Hant: |-
        棲息在大湖的湖底。
        據說只要看見牠美麗的身影，
        心中的污穢就會得到淨化。
      zh-Hans: |-
        栖息在很大的湖底。
        听说，只要看见它那美丽的样子，
        心里的污秽就会被清除。
      en: |-
        Its dwelling place is the bottom of big lakes.
        Those who behold its loveliness are said to
        have their hearts purified.
      fr: |-
        Le simple fait d’apercevoir cet habitant du fond
        des grands lacs permettrait de purifier son
        cœur des troubles qui l’habitent.
      de: |-
        Es lebt auf dem Grund großer Seen. Es heißt, der
        Anblick seiner Schönheit befreie jedes Herz von
        Unreinheit.
      es: |-
        Vive en lo más profundo de los grandes lagos.
        Se dice que su gran belleza purifica el corazón
        de todos aquellos que lo contemplen.
      it: |-
        Vive sul fondo dei grandi laghi. Pare che la sua
        bellezza vertiginosa purifichi l’animo di chi lo
        vede da tutte le brutture.
    sword:
      ja-Hrkt: |-
        もっとも　うつくしい　ポケモンとも
        よばれ　おおくの　げいじゅつかに
        インスピレーションを　あたえてきた。
      ja: |-
        もっとも　美しい　ポケモンとも
        呼ばれ　多くの　芸術家に
        インスピレーションを　与えてきた。
      ko: |-
        가장 아름다운 포켓몬으로
        불리며 많은 예술가에게
        영감을 주고 있다.
      zh-Hant: |-
        也被稱為是最美的寶可夢。
        一直以來為無數的
        藝術家提供了靈感。
      zh-Hans: |-
        也被称为最美的宝可梦，
        一直给予许多艺术家灵感。
      en: |-
        Milotic has provided inspiration to many artists.
        It has even been referred to as the most
        beautiful Pokémon of all.
      fr: |-
        Célébré comme l’un des plus beaux Pokémon,
        il sert souvent de modèle et d’inspiration
        aux plus grands artistes.
      de: |-
        Milotic soll das schönste aller Pokémon sein.
        Es hat schon so manchem Künstler als Quelle
        der Inspiration gedient.
      es: |-
        Se dice que es el Pokémon más bello. Ha sido
        la fuente de inspiración de un sinnúmero de
        artistas.
      it: |-
        È considerato il Pokémon più bello del mondo
        ed è fonte d’ispirazione per tantissimi artisti.
    shield:
      ja-Hrkt: |-
        ミロカロスの　うつくしい　すがたを
        みた　ものは　すさんだ　こころが
        いやされると　いわれている。
      ja: |-
        ミロカロスの　美しい　姿を
        見た　者は　荒んだ　心が
        癒されると　いわれている。
      ko: |-
        밀로틱의 아름다운 모습을
        본 자는 황폐해진 마음이
        치유된다고 한다.
      zh-Hant: |-
        據說目睹了美納斯美麗
        身姿的人，心中一切的
        憤恨都能得到撫慰。
      zh-Hans: |-
        据说目睹了美纳斯美丽
        身姿的人，心中一切的
        愤恨都能得到抚慰。
      en: |-
        It’s said that a glimpse of a Milotic and its beauty
        will calm any hostile emotions you’re feeling.
      fr: |-
        On dit que la beauté de ce Pokémon est telle
        qu’elle apaise l’esprit de ceux qui le voient.
      de: |-
        Es heißt, der Anblick seiner wunderschönen
        Gestalt könne selbst das verrohteste Herz
        erweichen.
      es: |-
        Se dice que su hermosa figura puede apaciguar
        el corazón de aquellos que tengan el ánimo
        alterado.
      it: |-
        Si dice che la sua bellezza sia in grado
        di alleviare qualsiasi dolore nel cuore di chi
        lo ammira.
