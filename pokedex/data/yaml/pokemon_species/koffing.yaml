      fr: |-
        Il flotte en retenant des gaz plus
        légers que l’air. Ceux-ci sont
        explosifs, en plus d’être fétides.
    black-2:
      en: |-
        Toxic gas is held within its thin,
        balloon-shaped body, so it can
        cause massive explosions.
    white-2:
      en: |-
        Toxic gas is held within its thin,
        balloon-shaped body, so it can
        cause massive explosions.
    x:
      ja-Hrkt: |-
        うすい　バルーンじょうの　からだに
        もうどくの　ガスが　つまっている。
        ちかくにくると　くさい。
      ja: |-
        薄い　バルーン状の　体に
        猛毒の　ガスが　つまっている。
        近くに　来ると　くさい。
      ko: |-
        얇고 풍선 같은 몸에
        맹독 가스가 차있다.
        가까이 오면 역겨운 냄새가 난다.
      en: |-
        Its thin, balloon-like body is inflated by horribly
        toxic gases. It reeks when it is nearby.
      fr: |-
        Son corps très fin en forme de ballon est rempli
        d’un horrible gaz toxique. L’air est nauséabond à
        proximité de ce Pokémon.
      de: |-
        Sein dünner, ballonartiger Körper ist mit
        schrecklichem Giftgas gefüllt. Es verbreitet einen
        heftigen Gestank, wenn es in der Nähe ist.
      es: |-
        Tiene forma de globo y es muy ligero. Está compuesto
        por gases tóxicos y apesta.
      it: |-
        Il suo corpo fatto a pallone è pieno di orribili sostanze
        gassose, che emanano un puzzo disgustoso.
    'y':
      ja-Hrkt: |-
        くうきよりも　かるい　ガスを
        からだに　ためて　うかんでいる。
        ガスは　くさいうえに　ばくはつする。
      ja: |-
        空気よりも　軽い　ガスを
        体に　ためて　浮かんでいる。
        ガスは　くさい上に　爆発する。
      ko: |-
        공기보다도 가벼운 가스를
        몸에 모아서 떠 있다. 가스는
        냄새나는 데다가 폭발도 한다.
      en: |-
        Lighter-than-air gases in its body keep it aloft.
        The gases not only smell, they are also explosive.
      fr: |-
        Il flotte en retenant des gaz plus légers que l’air.
        Ceux-ci sont explosifs, en plus d’être fétides.
      de: |-
        Gase, die leichter als Luft sind, lassen es schweben.
        Diese Gase stinken und sind explosiv.
      es: |-
        Los gases de su cuerpo le permiten flotar. Estos
        gases, además de oler mal, también son explosivos.
      it: |-
        Fluttua a mezz’aria grazie ai gas che ha in corpo.
        Questi sono maleodoranti e altamente esplosivi.
    omega-ruby:
      ja-Hrkt: |-
        しげきを　あたえると　ガスの　どくそが　つよまり
        からだの　あちこちから　いきおいよく　ふきだす。
        まんまるに　ふくらんだ　あと　だいばくはつする。
      ja: |-
        刺激を　与えると　ガスの　毒素が　強まり
        体の　あちこちから　勢いよく　吹き出す。
        真ん丸に　膨らんだ　後　大爆発する。
      ko: |-
        자극받으면 가스의 독소가 강해져
        몸의 이곳저곳에서 강하게 내뿜는다.
        동그랗게 부풀어 오른 후 대폭발한다.
      en: |-
        If Koffing becomes agitated, it raises the toxicity of its internal
        gases and jets them out from all over its body. This Pokémon
        may also overinflate its round body, then explode.
      fr: |-
        Lorsque Smogo s’agite, ça augmente la toxicité de ses gaz
        internes. Il les projette ensuite par les nombreux orifices de
        son corps. Ce Pokémon peut aussi gonfler son corps
        et le faire exploser.
      de: |-
        Wenn Smogon sich aufregt, lässt es das giftige Gas in seinem
        Inneren entweichen. Wenn es sich zu sehr aufbläht, explodiert
        dieses Pokémon.
      es: |-
        Si Koffing se pone nervioso, aumenta el nivel de toxicidad de
        los gases que tiene y los expulsa por todo el cuerpo. También
        suele hincharse mucho hasta llegar a explotar.
      it: |-
        Se Koffing si agita, aumenta la tossicità dei suoi gas interni
        e li espelle violentemente da tutto il corpo. Questo Pokémon
        riesce anche a gonfiarsi fino al punto di esplodere.
    alpha-sapphire:
      ja-Hrkt: |-
        なまゴミと　からだの　どくそを　かがくはんのう
        させる　ことで　もうどくの　ガスを　つくりだす。
        きおんが　たかいほど　ガスが　たくさん　できる。
      ja: |-
        生ゴミと　体の　毒素を　化学反応
        させる　ことで　猛毒の　ガスを　つくりだす。
        気温が　高いほど　ガスが　沢山　できる。
      ko: |-
        음식물 쓰레기와 몸의 독소를 화학반응시켜
        맹독 가스를 만들어 낸다.
        기온이 높을수록 가스가 많이 만들어진다.
      en: |-
        Koffing embodies toxic substances. It mixes the toxins with raw
        garbage to set off a chemical reaction that results in a terribly
        powerful poison gas. The higher the temperature, the more gas
        is concocted by this Pokémon.
      fr: |-
        Smogo est composé de substances toxiques. Il mélange
        des toxines et des détritus pour déclencher une réaction
        chimique générant un gaz très dangereux. Plus la température
        est élevée, plus la quantité de gaz est importante.
      de: |-
        Smogons Körper enthält giftige Substanzen. Es vermischt
        die Toxine mit Müll, um eine chemische Reaktion in Gang
        zu bringen, die ein unheimlich starkes Giftgas hervorbringt.
        Je höher die Temperatur, desto mehr Gas produziert es.
      es: |-
        Koffing contiene sustancias tóxicas que mezcla con
        desperdicios para provocar una reacción química que libera
        un gas tremendamente venenoso. A mayor temperatura,
        mayor será la cantidad de gas que cree este Pokémon.
      it: |-
        Koffing è costituito da sostanze velenose. Mischia tossine
        con rifiuti putrefatti per scatenare reazioni chimiche che
        generano un micidiale gas velenoso. Con l’aumento della
        temperatura, sale la quantità di gas prodotto da Koffing.
    lets-go-pikachu:
      ja-Hrkt: |-
        あついところ　では　からだのなかの
        ガスが　ふくらんで　はれつする
        きけんせいも　あるので　ちゅういだ。
      ja: |-
        暑いところ　では　体の中の
        ガスが　膨らんで　破裂する
        危険性も　あるので　注意だ。
      ko: |-
        더운 곳에서는 몸 안의
        가스가 부풀어 올라 파열될
        위험성이 있으므로 주의해야 한다.
      zh-Hant: |-
        在高溫的地方，牠體內的
        氣體會膨脹而有爆炸的危險，
        要特別小心。
      zh-Hans: |-
        在炎热的地方，它体内的
        气体会由于膨胀而产生
        爆炸的危险，需要注意。
      en: |-
        In hot places, its internal gases could
        expand and explode without any warning.
        Be very careful!
      fr: |-
        Les gaz que renferme son corps deviennent
        instables lorsqu’il se trouve dans un endroit
        chaud. Prenez garde, il pourrait exploser !
      de: |-
        Bei diesem Pokémon ist Vorsicht geboten,
        da sich die Gase in seinem Innern an warmen
        Orten ausbreiten und es explodieren lassen.
      es: |-
        A veces puede explotar sin avisar, ya que en
        lugares calurosos su gas interno se expande.
      it: |-
        Nei luoghi caldi i suoi gas interni rischiano di
        espandersi fino a farlo scoppiare, quindi bisogna
        fare attenzione.
    lets-go-eevee:
      ja-Hrkt: |-
        あついところ　では　からだのなかの
        ガスが　ふくらんで　はれつする
        きけんせいも　あるので　ちゅういだ。
      ja: |-
        暑いところ　では　体の中の
        ガスが　膨らんで　破裂する
        危険性も　あるので　注意だ。
      ko: |-
        더운 곳에서는 몸 안의
        가스가 부풀어 올라 파열될
        위험성이 있으므로 주의해야 한다.
      zh-Hant: |-
        在高溫的地方，牠體內的
        氣體會膨脹而有爆炸的危險，
        要特別小心。
      zh-Hans: |-
        在炎热的地方，它体内的
        气体会由于膨胀而产生
        爆炸的危险，需要注意。
      en: |-
        In hot places, its internal gases could
        expand and explode without any warning.
        Be very careful!
      fr: |-
        Les gaz que renferme son corps deviennent
        instables lorsqu’il se trouve dans un endroit
        chaud. Prenez garde, il pourrait exploser !
      de: |-
        Bei diesem Pokémon ist Vorsicht geboten,
        da sich die Gase in seinem Innern an warmen
        Orten ausbreiten und es explodieren lassen.
      es: |-
        A veces puede explotar sin avisar, ya que en
        lugares calurosos su gas interno se expande.
      it: |-
        Nei luoghi caldi i suoi gas interni rischiano di
        espandersi fino a farlo scoppiare, quindi bisogna
        fare attenzione.
    sword:
      ja-Hrkt: |-
        どくガスで　パンパンの　からだ。
        なまゴミの　くさった　においを
        もとめ　ゴミすてばに　やってくる。
      ja: |-
        毒ガスで　パンパンの　体。
        生ゴミの　腐った　においを
        求め　ゴミ捨て場に　やってくる。
      ko: |-
        독가스로 몸 안이 가득 차 있다.
        음식물 쓰레기의 악취에
        이끌려 쓰레기장을 찾아간다.
      zh-Hant: |-
        身體裡充滿了毒氣。
        會為了尋求廚餘垃圾的
        腐敗氣味而來到垃圾場。
      zh-Hans: |-
        身体里充满了毒气。
        会为了寻求湿垃圾腐烂的
        气味而来到垃圾场。
      en: |-
        Its body is full of poisonous gas. It floats into
        garbage dumps, seeking out the fumes of raw,
        rotting trash.
      fr: |-
        Son corps est gonflé de gaz toxique.
        Il se rend dans les décharges, attiré par l’odeur
        des déchets alimentaires en décomposition.
      de: |-
        Sein Körper ist zum Bersten voll mit Giftgas.
        Angelockt vom fauligen Geruch verrottender
        Abfälle, lungert es auf Müllhalden herum.
      es: |-
        Su cuerpo está lleno a rebosar de gas venenoso.
        Acude a los vertederos atraído por el putrefacto
        olor que emana de los desperdicios.
      it: |-
        Il suo corpo è gonfio di gas velenosi.
        Va nelle discariche attratto dall’odore
        di rifiuti putrescenti.
    shield:
      ja-Hrkt: |-
        きたない　くうきが　ごちそう。
        むかしの　ガラルちほうには　いまより
        たくさんの　ドガースが　いたという。
      ja: |-
        汚い　空気が　ごちそう。
        むかしの　ガラル地方には　いまより
        たくさんの　ドガースが　いたという。
      ko: |-
        오염된 공기를 좋아한다.
        옛날 가라르지방에는 지금보다
        많은 또가스가 있었다고 한다.
      zh-Hant: |-
        污濁的空氣是牠的美味大餐。
        據說在昔日的伽勒爾地區
        曾經存在著更多的瓦斯彈。
      zh-Hans: |-
        污浊的空气是它的美味大餐。
        据说在昔日的伽勒尔地区
        曾经存在着更多的瓦斯弹。
      en: |-
        It adores polluted air. Some claim that Koffing
        used to be more plentiful in the Galar region
        than they are now.
      fr: |-
        On raconte qu’il y a longtemps, ces Pokémon
        amateurs d’air pollué étaient beaucoup plus
        nombreux à Galar.
      de: |-
        Angeblich waren diese nach verpesteter Luft
        gierenden Pokémon früher weitaus häufiger
        in der Galar-Region anzutreffen als heute.
      es: |-
        Se nutre de aire contaminado. Al parecer, antaño
        eran mucho más numerosos en Galar.
      it: |-
        È ghiotto di aria inquinata.
        Si dice che in passato a Galar ci fossero
        molti più Koffing rispetto a ora.
