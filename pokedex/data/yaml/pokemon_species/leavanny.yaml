leavanny:
  base_happiness: 70
  capture_rate: 45
  color: yellow
  egg_groups:
    - bug
  evolution_chain: sewaddle
  evolves_from: swadloon
  flavor_text:
    black:
      en: |-
        Upon finding a small Pokémon, it weaves
        clothing for it from leaves, using the
        cutters on its arms and sticky silk.
      fr: |-
        Quand il trouve de petits Pokémon, il
        leur coud des vêtements de feuilles en
        utilisant ses coupoirs et son fil adhésif.
    white:
      en: |-
        It keeps its eggs warm with heat from
        fermenting leaves. It also uses leaves
        to make warm wrappings for Sewaddle.
      fr: |-
        Il réchauffe les œufs avec la chaleur
        de l’humus. Il fabrique des langes pour
        les Larveyette avec des feuilles.
    black-2:
      en: |-
        Upon finding a small Pokémon, it weaves
        clothing for it from leaves by using the
        sticky silk secreted from its mouth.
    white-2:
      en: |-
        Upon finding a small Pokémon, it weaves
        clothing for it from leaves by using the
        sticky silk secreted from its mouth.
    x:
      ja-Hrkt: |-
        おさない　ポケモンを　みつけると
        くちから　だす　ねんちゃくいとで
        はっぱの　ふくを　ぬってあげる。
      ja: |-
        幼い　ポケモンを　みつけると
        口から　出す　粘着糸で
        葉っぱの　服を　縫ってあげる。
      ko: |-
        어린 포켓몬을 보면
        입에서 내뿜는 점착실로
        잎사귀의 옷을 지어 준다.
      en: |-
        Upon finding a small Pokémon, it weaves clothing
        for it from leaves by using the sticky silk secreted
        from its mouth.
      fr: |-
        Il fabrique des vêtements de feuilles pour les
        Pokémon encore jeunes grâce à son fil de soie
        adhésif.
      de: |-
        Begegnet es einem jungen Pokémon, näht es ihm
        mit den klebrigen Fäden aus seinem Mund
        ein Kleid aus Blättern.
      es: |-
        Si se encuentra con un Pokémon joven, segrega por la
        boca hilos pegadizos con los que le teje una prenda
        de ropa.
      it: |-
        Quando incontra un giovane Pokémon gli fa un
        vestito di foglie che cuce con il filo appiccicoso
        prodotto dalla bocca.
    'y':
      ja-Hrkt: |-
        おちばが　はっこうする　ねつで
        タマゴを　あたためる。クルミルに
        はっぱで　おくるみを　つくる。
      ja: |-
        落ち葉が　発酵する　熱で
        タマゴを　温める。クルミルに
        葉っぱで　おくるみを　作る。
      ko: |-
        낙엽이 발효되는 열로
        알을 따뜻하게 한다. 잎사귀로
        두르보의 포대기를 만든다.
      en: |-
        It keeps its eggs warm with heat from fermenting
        leaves. It also uses leaves to make warm wrappings
        for Sewaddle.
      fr: |-
        Il réchauffe les Œufs avec la chaleur de l’humus.
        Il fabrique des langes pour les Larveyette avec
        des feuilles.
      de: |-
        Nutzt die Hitze kompostierenden Laubes zum
        Ausbrüten von Eiern. Es fertigt aus Blättern
        Kleidchen für Strawickl an.
      es: |-
        Calienta sus huevos con el calor desprendido por el
        humus. Hace mantillas con las hojas para Sewaddle.
      it: |-
        Sfrutta il calore dell’humus per covare le sue uova
        e fabbrica coperte di foglie per avvolgere Sewaddle.
    omega-ruby:
      ja-Hrkt: |-
        おさない　ポケモンを　みつけると
        くちから　だす　ねんちゃくいとで
        はっぱの　ふくを　ぬってあげる。
      ja: |-
        幼い　ポケモンを　みつけると
        口から　出す　粘着糸で
        葉っぱの　服を　縫ってあげる。
      ko: |-
