      ja: |-
        落ち葉が　発酵する　熱で
        タマゴを　温める。クルミルに
        葉っぱで　おくるみを　作る。
      ko: |-
        낙엽이 발효되는 열로
        알을 따뜻하게 한다. 잎사귀로
        두르보의 포대기를 만든다.
      en: |-
        It keeps its eggs warm with heat from fermenting
