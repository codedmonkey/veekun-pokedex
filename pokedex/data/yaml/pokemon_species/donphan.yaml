    x:
      ja-Hrkt: |-
        するどく　かたい　キバと
        さらに　がんじょうな　ひふでの
        たいあたりは　いえをも　こわすほど。
      ja: |-
        鋭く　硬い　キバと
        さらに　頑丈な　皮膚で
        体当たりは　家をも　壊すほど。
      ko: |-
        예리하고 단단한 이빨과
        더욱 튼튼한 피부의
        몸통박치기는 집도 부술 정도다.
      en: |-
        It has sharp, hard tusks and a rugged hide.
        Its Tackle is strong enough to knock down a house.
      fr: |-
        Il a des défenses aiguisées et une peau épaisse.
        Ses charges peuvent détruire une maison.
      de: |-
        Aufgrund seiner scharfen Stoßzähne und seiner
        rauen Haut könnte es mit Tackle ein Haus
        niederreißen.
      es: |-
        Tiene afilados y duros colmillos, y una gruesa piel.
        Su Placaje es tan fuerte que puede derribar una casa.
      it: |-
        Ha zanne dure e affilate e la pelle grinzosa. La sua
        Azione è così forte da abbattere una casa.
    'y':
      ja-Hrkt: |-
        キバが　ながくて　おおきいほど
        むれのなかでの　ランクが　たかい。
        キバがのびるには　じかんがかかる。
      ja: |-
        キバが　長くて　大きいほど
        群れの中での　ランクが　高い。
        キバが　伸びるには　時間が　かかる。
      ko: |-
        송곳니가 길고 클수록
        무리 중에서 서열이 높다.
        송곳니가 자라는 데는 시간이 걸린다.
      en: |-
        The longer and bigger its tusks, the higher its rank
        in its herd. The tusks take long to grow.
      fr: |-
        Plus grandes sont ses défenses, plus haut est son
        rang dans le troupeau. Elles poussent lentement.
      de: |-
        Je größer und länger die Stoßzähne, desto höher
        ist ihr Rang in der Herde, doch das dauert lange.
      es: |-
        Cuanto más grandes son sus colmillos, mayor su
        estatus en la manada. Los colmillos tardan mucho en
        crecer.
      it: |-
        Più grandi sono le zanne, più alto è il suo rango nel
        branco. Le zanne crescono lentamente.
    omega-ruby:
      ja-Hrkt: |-
        からだを　まるめて　こうそくかいてん　しながら
        あいてに　とっしんする　こうげきが　とくい。
        ころがり　はじめると　なかなか　とまれなくなる。
      ja: |-
        体を　丸めて　高速回転　しながら
        相手に　突進する　攻撃が　得意。
        転がり　始めると　なかなか　止まれなくなる。
      ko: |-
        몸을 둥글게 말아 고속 회전하며
        상대에게 돌진하는 공격이 특기다.
        구르기 시작하면 어지간해서는 멈출 수 없다.
      en: |-
        Donphan’s favorite attack is curling its body into a ball, then
        charging at its foe while rolling at high speed. Once it starts
        rolling, this Pokémon can’t stop very easily.
      fr: |-
        L’attaque favorite de Donphan consiste à se mettre en boule
        et à charger son ennemi en roulant à pleine vitesse. Une fois
        qu’il commence à rouler, ce Pokémon a du mal à s’arrêter.
      de: |-
        Donphans Lieblingsattacke ist es, als Ball zusammengerollt
        mit voller Wucht gegen seine Gegner zu krachen. Wenn es
        erst einmal rollt, ist dieses Pokémon nur schwer aufzuhalten.
      es: |-
        A Donphan le encanta enrollarse como una pelota y cargar
        contra el enemigo rodando a toda velocidad. Una vez que ha
        comenzado a rodar, no es fácil pararlo.
      it: |-
        Donphan adora attaccare arrotolandosi in forma sferica
        e puntando sul nemico ad elevata velocità. Una volta partito,
        questo Pokémon è molto difficile da fermare.
    alpha-sapphire:
      ja-Hrkt: |-
        かたい　からだで　ぶつかれば　いえも　こわれる。
        その　ちからを　つかって　やまみちを　ふさいだ
        どしゃくずれを　どかす　しごとを　てつだうよ。
      ja: |-
        硬い　体で　ぶつかれば　家も　壊れる。
        その　力を　使って　山道を　ふさいだ
        土砂崩れを　どかす　仕事を　手伝うよ。
      ko: |-
        단단한 몸으로 부딪치면 집도 부서진다.
        그 힘을 이용해 산길을 막고 있는
        토사를 치우는 일을 돕는다.
      en: |-
        If Donphan were to tackle with its hard body, even a house
        could be destroyed. Using its massive strength, the Pokémon
        helps clear rock and mud slides that block mountain trails.
      fr: |-
        Si Donphan décidait de charger, il pourrait détruire
        une maison. Grâce à sa force étonnante, ce Pokémon
        peut aider à déplacer les rochers et les coulées de boue
        qui bloquent les chemins de montagne.
      de: |-
        Donphan kann mit seinem harten Körper sogar ein
        Haus zerstören. Mit seiner imposanten Kraft hilft dieses
        Pokémon dabei, Erdrutsche aus dem Weg zu räumen,
        die Bergpfade versperren.
      es: |-
        Si Donphan tuviera que dar un golpe con todo el cuerpo, con
        lo robusto que es echaría abajo hasta una casa. Estos
        Pokémon usan su fuerza para ayudar a despejar pasos de
        montaña cuando hay piedras o lodo.
      it: |-
        Il massiccio corpo di Donphan dispone di una forza tale
        da poter abbattere persino una casa. La sua incredibile
        potenza aiuta a liberare i sentieri montani dopo una frana
        di massi o fango.
