sealeo:
  base_happiness: 50
  capture_rate: 120
  color: blue
  egg_groups:
    - water1
    - ground
  evolution_chain: spheal
  evolves_from: spheal
  flavor_text:
    ruby:
      en: |-
        SEALEO has the habit of always juggling
        on the tip of its nose anything it sees
        for the first time.This POKéMON occasionally entertains
        itself by balancing and rolling a SPHEAL
        on its nose.
    sapphire:
      en: |-
        SEALEO often balances and rolls
        things on the tip of its nose. While the
        POKéMON is rolling something, it checksthe object’s aroma and texture to
        determine whether it likes the object
        or not.
    emerald:
      en: |-
        SEALEO live in herds on ice floes. Using its
        powerful flippers, it shatters ice.
        It dives into the sea to hunt prey five
        times a day.
    firered:
      en: |-
        It touches new things with its nose to
        test for smell and feel. It plays by
        spinning SPHEAL on its nose.
    leafgreen:
      en: |-
        It touches new things with its nose to
        test for smell and feel. It plays by
        spinning SPHEAL on its nose.
    diamond:
      en: |-
        It habitually spins things on its
        nose. By doing so, it learns
        textures and odors.
    pearl:
      en: |-
        It habitually spins things on its
        nose. By doing so, it learns
        textures and odors.
    platinum:
      en: |-
        It habitually spins things on its
        nose. By doing so, it learns
        textures and odors.
    heartgold:
      en: |-
        It has a very sensitive nose.
        It touches new things with its nose
        to examine them.
    soulsilver:
      en: |-
        It has a very sensitive nose.
        It touches new things with its nose
        to examine them.
    black:
      en: |-
        It habitually spins things on its
        nose. By doing so, it learns
        textures and odors.
      fr: |-
        Il fait souvent tourner des objets
        sur son museau pour connaître
        leur odeur et leur texture.
    white:
      en: |-
        It habitually spins things on its
        nose. By doing so, it learns
        textures and odors.
      fr: |-
        Il fait souvent tourner des objets
        sur son museau pour connaître
        leur odeur et leur texture.
    black-2:
      en: |-
        Be it Spheal or Poké Ball, it will spin
        any round object on its nose
        with the greatest of ease.
    white-2:
      en: |-
        Be it Spheal or Poké Ball, it will spin
        any round object on its nose
        with the greatest of ease.
    x:
      ja-Hrkt: |-
        はなの　しんけいが　びんかん。
        はじめて　めに　する　ものは
        はなで　さわって　おぼえるのだ。
      ja: |-
        鼻の　神経が　敏感。
        はじめて　目に　する　物は
        鼻で　触って　覚えるのだ。
      ko: |-
        코의 신경이 민감하다.
        처음 보는 것은
        코로 문질러서 기억한다.
      en: |-
        It has a very sensitive nose. It touches new things
        with its nose to examine them.
      fr: |-
        Il utilise son museau hypersensible pour toucher et
        comprendre tout ce qu’il voit pour la première fois.
      de: |-
        Die Nerven in seiner Nase sind sehr empfindlich.
        Sieht es etwas Neues, berührt es es zuerst mit
        der Nase.
      es: |-
        Su nariz es muy sensible. Cuando ve algo por primera
        vez, lo toca con ella para recordarlo después.
      it: |-
        Per memorizzare un nuovo oggetto, ha bisogno di
        toccarlo con il naso, dove risiede la sua sensibilità.
    'y':
      ja-Hrkt: |-
        まるければ　モンスターボールでも
        タマザラシでも　はなのうえに　のせて
        じゆうじざいに　くるくる　まわすぞ。
      ja: |-
        まるければ　モンスターボールでも
        タマザラシでも　鼻の上に　乗せて
        自由自在に　くるくる　回すぞ。
      ko: |-
        둥글면 몬스터볼이든
        대굴레오든 코 위에 올려
        자유자재로 빙글빙글 돌린다.
      en: |-
        Be it Spheal or Poké Ball, it will spin any round
        object on its nose with the greatest of ease.
      fr: |-
        Pour s’amuser, il fait tourner tout ce qui est rond
        sur son museau, qu’il s’agisse de Poké Balls ou
        d’Obalie.
      de: |-
        Pokébälle, Seemops und alles, was sonst noch
        rund ist, balanciert es mit großem Geschick
        auf seiner Nasenspitze.
      es: |-
        Hace girar con pericia sobre la punta de su nariz
        cualquier cosa redondeada, ya sea una Poké Ball o
        un Spheal.
      it: |-
        Fa roteare sul naso qualsiasi cosa abbia forma sferica,
        Poké Ball e Spheal inclusi.
    omega-ruby:
      ja-Hrkt: |-
        はじめて　めにした　ものは　かならず　はなで
        クルクル　まわしてみる　しゅうせいを　もつ。
        タマザラシを　まわして　あそぶ　ことが　ある。
      ja: |-
        初めて　目にした　ものは　必ず　鼻で
        クルクル　回してみる　習性を　持つ。
        タマザラシを　回して　遊ぶ　ことが　ある。
      ko: |-
        처음 본 것은 반드시 코로
        빙글빙글 돌려보는 습성을 지녔다.
        대굴레오를 돌리며 놀기도 한다.
      en: |-
        Sealeo has the habit of always juggling on the tip of its nose
        anything it sees for the first time. This Pokémon occasionally
        entertains itself by balancing and rolling a Spheal on its nose.
      fr: |-
        Phogleur a pris l’habitude de jongler avec tout ce qu’il
        découvre pour la première fois. Ce Pokémon se divertit
        parfois en faisant tourner un Obalie sur le bout de son museau.
      de: |-
        Seejong hat die Angewohnheit, alles, was es zum ersten Mal
        sieht, auf seiner Nasenspitze zu jonglieren. Dieses Pokémon
        hält sich bei Laune, indem es manchmal ein Seemops auf
        seiner Nase balanciert und hin- und herrollt.
      es: |-
        Cada vez que Sealeo ve algo nuevo, se lo pone en el morro y
        empieza a darle vueltas. A veces, para entretenerse, hace lo
        mismo con un Spheal.
      it: |-
        Sealeo è solito giocare con qualsiasi cosa veda per la prima
        volta, tenendola in equilibrio sulla punta del naso.
        Talvolta, si diverte a far rotolare sul proprio naso
        anche Spheal.
    alpha-sapphire:
      ja-Hrkt: |-
        しょっちゅう　はなで　なにかを　まわしている。
        まわしながら　においや　かんしょくを　たしかめて
        すきな　ものと　きらいな　ものを　わけるのだ。
      ja: |-
        しょっちゅう　鼻で　なにかを　回している。
        回しながら　臭いや　感触を　確かめて
        好きな　ものと　嫌いな　ものを　分けるのだ。
      ko: |-
        늘 코로 무언가를 돌리고 있다.
        돌리면서 냄새나 감촉을 확인하여
        좋아하는 것과 싫어하는 것을 구별한다.
      en: |-
        Sealeo often balances and rolls things on the tip of its
        nose. While the Pokémon is rolling something, it checks
        the object’s aroma and texture to determine whether it likes
        the object or not.
      fr: |-
        Phogleur tient souvent quelque chose en équilibre sur son
        museau et le fait rouler. Pendant ce temps, ce Pokémon peut
        sentir l’odeur et la texture de l’objet pour savoir s’il lui plaît
        ou pas.
      de: |-
        Seejong balanciert häufig Dinge auf seiner Nasenspitze
        und rollt sie hin und her. Während es das tut, überprüft es
        den Duft und die Beschaffenheit des Gegenstandes und
        stellt fest, ob es das Objekt mag oder nicht.
      es: |-
        Sealeo suele balancear y hacer rodar cosas en la punta del
        morro. Al mismo tiempo, aprovecha para olerlas y detectar la
        textura que tienen para ver si le gustan o no.
      it: |-
        Sealeo gioca spesso tenendo in equilibrio oggetti sulla punta
        del naso e facendoli rotolare. Riesce così anche ad annusarli
        e provarne la consistenza per capire se sono di suo
        gradimento o meno.
    sword:
      ja-Hrkt: |-
        りゅうひょうの　うえで　せいかつ。
        およぎながら　えものの　においを
        かぎわけて　みつけだし　つかまえる。
      ja: |-
        流氷の　上で　生活。
        泳ぎながら　獲物の　匂いを
        嗅ぎわけて　見つけだし　捕まえる。
      ko: |-
        유빙 위에서 생활한다.
        헤엄치다가 먹이의 냄새를
        맡고는 찾아내서 잡는다.
      zh-Hant: |-
        在浮冰上生活。能夠一邊
        游泳一邊嗅出獵物的氣味，
        把對方找出來獵捕。
      zh-Hans: |-
        在浮冰上生活。能一边游泳
        一边分辨猎物的味道，找到
        对方的位置并将其捕获。
      en: |-
        Sealeo live on top of drift ice. They go swimming
        when they’re on the hunt, seeking out their prey
        by scent.
      fr: |-
        Cet habitant de la banquise attrape ses proies
        en les repérant à l’odeur quand il nage.
      de: |-
        Seejong lebt auf Eisschollen. Wittert es beim
        Schwimmen Beute, spürt es sie auf und schnappt
        sie sich.
      es: |-
        Vive sobre placas de hielo. Detecta el olor de
        sus presas mientras nada.
      it: |-
        Vive su banchi di ghiaccio alla deriva. Individua
        le prede fiutandone l’odore mentre nuota.
    shield:
      ja-Hrkt: |-
        タマザラシや　モンスターボールなど
        まるい　ものなら　なんでも　はなの
        うえで　まわしてしまう　しゅうせい。
      ja: |-
        タマザラシや　モンスターボールなど
        丸い　ものなら　なんでも　鼻の
        上で　回してしまう　習性。
      ko: |-
        대굴레오나 몬스터볼 등
        둥근 것이라면 뭐든지 코 위에
        올려놓고 돌리는 습성이 있다.
      zh-Hant: |-
        牠只要看見了圓形的東西，
        不論那是海豹球或是精靈球，
        都會把它頂在鼻子上轉轉看。
      zh-Hans: |-
        不管是海豹球还是精灵球，
        只要是圆的物体都会
        顶在鼻子上转来转去。
      en: |-
        This Pokémon has a habit of spinning round
        things on its nose, whether those things are
        Poké Balls or Spheal.
      fr: |-
        Il ne peut pas s’empêcher de faire tourner sur
        son museau tout ce qui a une forme sphérique,
        comme les Obalie ou les Poké Balls.
      de: |-
        Seejong balanciert gerne Pokébälle, Seemops
        und alles, was sonst noch rund ist, auf seiner
        Nasenspitze.
      es: |-
        Tiene la costumbre de hacer girar en la punta del
        morro cualquier objeto redondeado, ya sea una
        Poké Ball o un Spheal.
      it: |-
        È solito giocare facendo ruotare sulla punta
        del naso qualsiasi cosa rotonda gli capiti a tiro,
        compresi Spheal e Poké Ball.
