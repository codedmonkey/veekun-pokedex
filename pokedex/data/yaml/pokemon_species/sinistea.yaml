sinistea:
  base_happiness: 50
  capture_rate: 120
  color: purple
  egg_groups:
    - mineral
    - indeterminate
  evolution_chain: sinistea
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        のこされ　ひえきった　こうちゃに
        さみしがりやな　たましいが　やどり
        ポケモンに　なったと　いわれている。
      ja: |-
        残され　冷えきった　紅茶に
        さみしがりやな　魂が　宿り
        ポケモンに　なったと　いわれている。
      ko: |-
        차게 식은 남은 홍차에
        외로움을 타는 영혼이 깃들어
        포켓몬이 되었다고 전해진다.
      zh-Hant: |-
        據說這隻寶可夢是因為
        害怕寂寞的靈魂住進了
        涼透的喝剩紅茶而誕生的。
      zh-Hans: |-
        据说这只宝可梦是因为
        害怕寂寞的灵魂住进了
        凉透的喝剩红茶而诞生的。
      en: |-
        This Pokémon is said to have been born when
        a lonely spirit possessed a cold, leftover cup
        of tea.
      fr: |-
        On raconte que ce Pokémon est né lorsqu’une
        âme esseulée a plongé dans un reste de thé noir
        froid.
      de: |-
        Es heißt, eine einsame Seele habe Besitz von
        einer abgestellten, kalten Tasse Schwarztee
        ergriffen und sei zu diesem Pokémon geworden.
      es: |-
        Según se dice, este Pokémon surgió de un alma
        solitaria que poseyó una taza abandonada llena
        de un té ya frío.
      it: |-
        Si dice che questo Pokémon sia nato quando
        un’anima solitaria si è impossessata di una
        tazza dimenticata piena di tè ormai freddo.
    shield:
      ja-Hrkt: |-
        すみかに　している　ティーカップは
        ゆうめいな　アンティークの　しょっき。
        おおくの　がんさくが　でまわっている。
      ja: |-
        すみかに　している　ティーカップは
        有名な　アンティークの　食器。
        多くの　贋作が　出回っている。
      ko: |-
        거처로 삼고 있는 찻잔은
        유명한 골동품 식기다.
        위작이 많이 나돌고 있다.
      zh-Hant: |-
        被牠當成住處的茶杯
        是有名的古董餐具。
        市面上有很多贗品。
      zh-Hans: |-
        被它当成住处的茶杯
        是有名的古董餐具。
        市面上有很多赝品。
      en: |-
        The teacup in which this Pokémon makes its
        home is a famous piece of antique tableware.
        Many forgeries are in circulation.
      fr: |-
        Il élit domicile dans des tasses de thé anciennes
        de grand renom. Parmi celles-ci se trouvent
        de nombreuses contrefaçons.
      de: |-
        Die Teetasse, die es bewohnt, ist eine berühmte
        Antiquität. Es befinden sich allerdings auch viele
        Fälschungen im Umlauf.
      es: |-
        La taza de té donde se hospeda forma parte de
        una antigua y valiosa vajilla, de la que circulan
        numerosas falsificaciones.
      it: |-
        La tazza da tè in cui vive è un vero pezzo
        di antiquariato di cui circolano molte copie
        contraffatte.
