machop:
  base_happiness: 50
  capture_rate: 180
  color: gray
  egg_groups:
    - humanshape
  evolution_chain: machop
  evolves_from: ~
  flavor_text:
    red:
      en: |-
        Loves to build
        its muscles.
        It trains in allstyles of martial
        arts to become
        even stronger.
    blue:
      en: |-
        Loves to build
        its muscles.
        It trains in allstyles of martial
        arts to become
        even stronger.
    yellow:
      en: |-
        Very powerful in
        spite of its small
        size. Its masteryof many types of
        martial arts makes
        it very tough.
    gold:
      en: |-
        Always brimming
        with power, it
        passes time bylifting boulders.
        Doing so makes it
        even stronger.
    silver:
      en: |-
        It loves to work
        out and build its
        muscles. It isnever satisfied,
        even if it trains
        hard all day long.
    crystal:
      en: |-
        It trains by
        lifting rocks in
        the mountains. Itcan even pick up a
        GRAVELER with
        ease.
    ruby:
      en: |-
        MACHOP’s muscles are special - they
        never get sore no matter how much they
        are used in exercise.This POKéMON has sufficient power to
        hurl a hundred adult humans.
    sapphire:
      en: |-
        MACHOP exercises by hefting around
        a GRAVELER as if it were a barbell.
        There are some MACHOP that travelthe world in a quest to master all
        kinds of martial arts.
    emerald:
      en: |-
        It continually undertakes strenuous
        training to master all forms of martial
        arts. Its strength lets it easily hoist
        a sumo wrestler onto its shoulders.
    firered:
      en: |-
        Its whole body is composed of muscles.
        Even though it’s the size of a human
        child, it can hurl 100 grown-ups.
    leafgreen:
      en: |-
        Loves to build its muscles. It trains in
        all styles of martial arts to become even
        stronger.
    diamond:
      en: |-
        It hefts a GRAVELER repeatedly to
        strengthen its entire body. It
        uses every type of martial arts.
    pearl:
      en: |-
        Its muscles never cramp however
        much it trains. It lives in the
        mountains away from humans.
    platinum:
      en: |-
        Though small in stature, it is
        powerful enough to easily heft and
        throw a number of GEODUDE at once.
    heartgold:
      en: |-
        Always brimming with power,
        it passes time by lifting boulders.
        Doing so makes it even stronger.
    soulsilver:
      en: |-
        It loves to work out and build its
        muscles. It is never satisfied,
        even if it trains hard all day long.
    black:
      en: |-
        Though small in stature, it is
        powerful enough to easily heft and
        throw a number of Geodude at once.
      fr: |-
        Malgré sa petite taille, sa force
        lui permet de soulever plusieurs
        Racaillou à la fois.
    white:
      en: |-
        Though small in stature, it is
        powerful enough to easily heft and
        throw a number of Geodude at once.
      fr: |-
        Malgré sa petite taille, sa force
        lui permet de soulever plusieurs
        Racaillou à la fois.
    black-2:
      en: |-
        Though small in stature, it is
        powerful enough to easily heft and
        throw a number of Geodude at once.
    white-2:
      en: |-
        Though small in stature, it is
        powerful enough to easily heft and
        throw a number of Geodude at once.
    x:
      ja-Hrkt: |-
        ゴローンを　なんども　あげおろしして
        ぜんしんの　きんにくを　きたえる。
        あらゆる　かくとうぎを　つかう。
      ja: |-
        ゴローンを　何度も　上げ下ろしして
        全身の　筋肉を　鍛える。
        あらゆる　格闘技を　使う。
      ko: |-
        데구리를 수없이 들었다 놨다 하며
        전신의 근육을 단련한다.
        모든 격투기를 사용한다.
      en: |-
        It hefts a Graveler repeatedly to strengthen
        its entire body. It uses every type of martial arts.
      fr: |-
        Il muscle son corps en soulevant régulièrement un
        Gravalanch. Il est rompu à tous les arts martiaux.
      de: |-
        Es hebt Georok hoch, um seinen Körper zu trainieren.
        Außerdem übt es sich in jeder Art von Kampfsport.
      es: |-
        Levanta un Graveler para mantener sus músculos en
        forma. Domina todas las artes marciales.
      it: |-
        Solleva Graveler ripetutamente per mantenersi forte.
        Conosce ogni tipo di arte marziale.
    'y':
      ja-Hrkt: |-
        ぜんしんが　きんにくに　なっており
        こどもほどの　おおきさしかないのに
        おとな　１００にんを　なげとばせる。
      ja: |-
        全身が　筋肉になっており
        子供ほどの　大きさしかないのに
        大人　１００人を　投げ飛ばせる。
      ko: |-
        몸집은 어린아이만 하지만
        온몸이 근육으로 되어 있어서
        어른 100명은 날려 버릴 수 있다.
      en: |-
        Its whole body is composed of muscles.
        Even though it’s the size of a human child,
        it can hurl 100 grown-ups.
      fr: |-
        Son corps est essentiellement composé de muscles.
        Même s’il a la taille d’un petit enfant, il peut soulever
        100 adultes avec ses bras.
      de: |-
        Sein ganzer Körper besteht aus Muskeln. Auch wenn
        es nur so groß wie ein Menschenkind ist, kann es
        100 Erwachsene jonglieren.
      es: |-
        Es una masa de músculos y, aunque es pequeño, tiene
        fuerza de sobra para tomar en brazos a 100 personas.
      it: |-
        Il suo corpo è formato interamente da muscoli. Non è
        più alto di un bambino, ma può sollevare e lanciare
        100 adulti.
    omega-ruby:
      ja-Hrkt: |-
        どんなに　うんどうを　しても　いたくならない
        とくべつな　きんにくを　もつ　ポケモン。
        おとな　１００にんを　なげとばす　パワー。
      ja: |-
        どんなに　運動を　しても　痛くならない
        特別な　筋肉を　持つ　ポケモン。
        大人　１００人を　投げ飛ばす　パワー。
      ko: |-
        아무리 운동을 해도 아프지 않은
        특별한 근육을 가진 포켓몬이다.
        어른 100명을 내던지는 파워다.
      en: |-
        Machop’s muscles are special—they never get sore no matter
        how much they are used in exercise. This Pokémon has
        sufficient power to hurl a hundred adult humans.
      fr: |-
        Les muscles de Machoc sont spéciaux. Quels que soient
        les efforts qu’il produit, il n’a jamais de courbature.
        Ce Pokémon est assez puissant pour lancer une centaine
        d’hommes adultes.
      de: |-
        Machollos Muskeln sind etwas Besonderes. Sie schmerzen nie,
        egal, wie sehr sie beansprucht werden. Dieses Pokémon hat
        genug Kraft, um 100 Erwachsene umherzuwerfen.
      es: |-
        Gracias a su portentosa musculatura, Machop no se agota por
        mucho esfuerzo que haga. Este Pokémon es tan fuerte que
        puede derrotar a cien personas adultas de una sola vez.
      it: |-
        I particolari muscoli di Machop non si infiammano mai,
        nemmeno in caso di esercizio eccessivo. Questo Pokémon ha
        forza sufficiente per scagliare lontano un centinaio di uomini.
    alpha-sapphire:
      ja-Hrkt: |-
        ゴローンを　もちあげて　からだを　きたえる。
        すべての　かくとうぎを　マスターするために
        せかいじゅうを　たびする　ワンリキーも　いる。
      ja: |-
        ゴローンを　持ち上げて　体を　鍛える。
        すべての　格闘技を　マスターするために
        世界中を　旅する　ワンリキーも　いる。
      ko: |-
        데구리를 들어 올려 몸을 단련한다.
        모든 격투기를 마스터하기 위해
        전 세계를 여행하는 알통몬도 있다.
      en: |-
        Machop exercises by hefting around a Graveler as if it were
        a barbell. There are some Machop that travel the world in a
        quest to master all kinds of martial arts.
      fr: |-
        Machoc s’entraîne en soulevant un Gravalanch, comme
        s’il s’agissait d’haltères. Certains Machoc voyagent un peu
        partout dans le monde pour apprendre à maîtriser tous
        les types d’arts martiaux.
      de: |-
        Machollo trainiert, indem es ein Georok hochhebt, als wäre es
        eine Hantel. Es gibt auch Machollo, die durch die Welt reisen,
        um alle Arten der Kampfkunst zu erlernen.
      es: |-
        Machop se entrena levantando Graveler a modo de pesas.
        Algunos de estos Pokémon viajan por todo el mundo para
        aprender distintos tipos de artes marciales.
      it: |-
        Machop si allena sollevando un Graveler come fosse un
        attrezzo ginnico. Esistono Machop che girano il mondo
        nel tentativo di imparare ogni tipo di arte marziale.
    sun:
      ja-Hrkt: |-
        きたえるのが　だいすき。　ひにひに
        ふくれていく　きんにくを　ながめて
        ますます　トレーニングに　はげむぞ。
      ja: |-
        きたえるのが　大好き。　日に日に
        膨れていく　筋肉を　ながめて
        ますます　トレーニングに　励むぞ。
      ko: |-
        단련하는 것을 아주 좋아한다.
        날마다 커지는 근육을 보면서
        더욱 트레이닝을 열심히 한다.
      zh-Hant: |-
        最喜歡鍛煉。
        盯著每天不斷增大的肌肉，
        就會越來越勤奮地鍛煉自己。
      zh-Hans: |-
        非常喜欢锻炼。
        盯着自己每天不断增大的肌肉，
        愈加勤奋地锻炼。
      en: |-
        It loves working out. As it gazes at its muscles,
        which continue to swell day by day, it becomes
        more and more dedicated to its training.
      fr: |-
        Il aime faire travailler ses muscles. Jour après
        jour, il regarde sa masse musculaire gonfler, et
        cela l’encourage à s’entraîner encore davantage.
      de: |-
        Es liebt Muskelaufbautraining und verfolgt jeden
        Tag das Wachstum seiner Muskeln. Dies spornt
        es zu noch intensiverem Training an.
      es: |-
        Le encanta entrenar su cuerpo. Cuando observa
        cómo crecen sus músculos día tras día, se
        apasiona más por su entrenamiento.
      it: |-
        Prova un particolare piacere ad allenarsi.
        Osservando i suoi muscoli svilupparsi ogni
        giorno, si sente spinto ad allenarsi ulteriormente.
    moon:
      ja-Hrkt: |-
        おとな１００にんを　なげとばすほどの
        かいりきは　まいにち　ゴローンを
        もちあげることで　つくられる。
      ja: |-
        大人１００人を　投げ飛ばすほどの
        怪力は　毎日　ゴローンを
        持ち上げることで　つくられる。
      ko: |-
        어른 100명을 내던질 정도의
        괴력은 매일 데구리를
        들어 올리는 과정에서 만들어진다.
      zh-Hant: |-
        那種能扔飛１００個
        成年人的可怕力量是透過
        每天舉隆隆石來練成的。
      zh-Hans: |-
        那种能扔飞１００个
        成年人的可怕力量是通过
        每天上举隆隆石来练成的。
      en: |-
        With its superhuman strength, it’s able to throw
        a hundred people all at the same time. Its
        strength comes from lifting Graveler every day.
      fr: |-
        Il s’entraîne en soulevant des Gravalanch tous
        les jours jusqu’à pouvoir projeter en l’air
        une centaine d’humains adultes d’un coup.
      de: |-
        Es stemmt jeden Tag Georok, wodurch seine
        Muskelkraft ins schier Unendliche steigt. Daher
        kann es auch 100 Erwachsene zugleich tragen.
      es: |-
        Obtiene su fuerza descomunal, con la que es
        capaz de lanzar a 100 personas por los aires,
        mediante un levantamiento de Graveler diario.
      it: |-
        Si allena ogni giorno sollevando Graveler.
        La sua forza è tale che sarebbe in grado
        di scagliare lontano 100 uomini.
    ultra-sun:
      ja-Hrkt: |-
        なかまたちとの　トレーニングで
        じしんと　きんにくが　ついたら
        マクノシタに　しょうぶを　いどむ。
      ja: |-
        仲間たちとの　トレーニングで
        自信と　筋肉が　ついたら
        マクノシタに　勝負を　挑む。
      ko: |-
        동료들과의 트레이닝으로
        자신감과 근육이 생기면
        마크탕에게 대결을 신청한다.
      zh-Hant: |-
        藉由與夥伴的鍛鍊
        獲得了自信與肌肉之後，
        就會向幕下力士挑戰。
      zh-Hans: |-
        在和伙伴们的锻炼中
        获得了自信和肌肉后，
        就会去向幕下力士挑战。
      en: |-
        Once this Pokémon has gained enough
        confidence and muscle from training with its
        friends, it challenges Makuhita to a battle.
      fr: |-
        Il s’entraîne avec ses amis pour accroître sa
        masse musculaire et gagner en confiance.
        Une fois prêt, il ira défier un Makuhita.
      de: |-
        Wenn es im Training mit seinen Kameraden genug
        Selbstvertrauen und Muskeln aufgebaut hat,
        fordert es Makuhita zu einem Kampf heraus.
      es: |-
        Entrena con sus congéneres para potenciar su
        musculatura y confianza en sí mismo y, llegado
        el momento, reta en combate a los Makuhita.
      it: |-
        Si allena assieme ai suoi simili per sviluppare
        i muscoli e acquisire sicurezza. Quando si sente
        pronto, sfida Makuhita.
    ultra-moon:
      ja-Hrkt: |-
        えいようかの　たかい　エサをこのむ。
        こうりつよく　きんにくを　つけるため
        ほんのうが　もとめて　いるのだ。
      ja: |-
        栄養価の　高い　エサを好む。
        効率よく　筋肉を　つけるため
        本能が　求めて　いるのだ。
      ko: |-
        영양가 높은 먹이를 좋아한다.
        효율적으로 근육을 키우기 위해
        본능적으로 원하고 있는 것이다.
      zh-Hant: |-
        喜歡營養價值高的食物。
        之所以如此是受到本能驅使，
        為的是讓肌肉增長得更有效率。
      zh-Hans: |-
        喜食营养价值高的食物。
        为了能有效地增长肌肉，
        它发自本能地追求着这些食物。
      en: |-
        It likes food that’s highly nutritious because its
        instincts drive it to build muscle efficiently.
      fr: |-
        Il aime les aliments très nutritifs. Il les choisit
        instinctivement pour développer sa musculature
        aussi efficacement que possible.
      de: |-
        Es liebt Futter mit besonders hohem Nährwert.
        Dieses Instinktverhalten dient einem möglichst
        effektiven Muskelaufbau.
      es: |-
        Prefiere los alimentos con gran valor nutritivo.
        Los escoge instintivamente para desarrollar de
        forma eficaz los músculos.
      it: |-
        L’istinto lo spinge a preferire cibi ricchi
        di nutrienti, in modo da poter sviluppare
        i muscoli nel modo più efficiente.
    lets-go-pikachu:
      ja-Hrkt: |-
        ちいさな　からだ　だが　ちからもち。
        そのうえ　いろいろな　かくとうぎを
        マスターしていて　とても　つよい。
      ja: |-
        小さな　体　だが　力持ち。
        そのうえ　色々な　格闘技を
        マスターしていて　とても　強い。
      ko: |-
        몸집은 작지만 힘이 장사다.
        게다가 다양한 격투기를
        마스터해서 매우 강하다.
      zh-Hant: |-
        身體雖小但力氣很大。
        此外還精通各種格鬥技，
        實力十分堅強。
      zh-Hans: |-
        它体格虽小却力大无比。
        不但如此，它还精通各种
        格斗技能，实力十分惊人。
      en: |-
        Very powerful in spite of its small size.
        Its mastery of many types of martial arts
        makes it very tough.
      fr: |-
        Très puissant malgré sa petite taille, il est passé
        maître en plusieurs types d’arts martiaux.
      de: |-
        Dieses Pokémon ist recht klein, doch seine
        Kampfsportkenntnisse machen es zu einem
        sehr starken Gegner.
      es: |-
        Es muy fuerte, a pesar de su pequeño tamaño.
        Su dominio de varias artes marciales lo convierte
        en un rival duro de pelar.
      it: |-
        È piccolo, ma molto potente. La sua maestria
        in tutte le arti marziali lo rende un osso duro.
    lets-go-eevee:
      ja-Hrkt: |-
        ちいさな　からだ　だが　ちからもち。
        そのうえ　いろいろな　かくとうぎを
        マスターしていて　とても　つよい。
      ja: |-
        小さな　体　だが　力持ち。
        そのうえ　色々な　格闘技を
        マスターしていて　とても　強い。
      ko: |-
        몸집은 작지만 힘이 장사다.
        게다가 다양한 격투기를
        마스터해서 매우 강하다.
      zh-Hant: |-
        身體雖小但力氣很大。
        此外還精通各種格鬥技，
        實力十分堅強。
      zh-Hans: |-
        它体格虽小却力大无比。
        不但如此，它还精通各种
        格斗技能，实力十分惊人。
      en: |-
        Very powerful in spite of its small size.
        Its mastery of many types of martial arts
        makes it very tough.
      fr: |-
        Très puissant malgré sa petite taille, il est passé
        maître en plusieurs types d’arts martiaux.
      de: |-
        Dieses Pokémon ist recht klein, doch seine
        Kampfsportkenntnisse machen es zu einem
        sehr starken Gegner.
      es: |-
        Es muy fuerte, a pesar de su pequeño tamaño.
        Su dominio de varias artes marciales lo convierte
        en un rival duro de pelar.
      it: |-
        È piccolo, ma molto potente. La sua maestria
        in tutte le arti marziali lo rende un osso duro.
    sword:
      ja-Hrkt: |-
        ぜんしんが　きんにくに　なっており
        こどもほどの　おおきさしかないのに
        おとな　１００にんを　なげとばせる。
      ja: |-
        全身が　筋肉になっており
        子どもほどの　大きさしかないのに
        大人　１００人を　投げ飛ばせる。
      ko: |-
        몸집은 어린아이만 하지만
        온몸이 근육으로 되어 있어서
        어른 100명은 날려 버릴 수 있다.
      zh-Hant: |-
        全身都是肌肉，
        雖然體型只有小孩那麼大，
        卻可以扔飛１００個大人。
      zh-Hans: |-
        全身都是肌肉，
        虽然只有小孩那么大，
        却可以扔飞１００个成年人。
      en: |-
        Its whole body is composed of muscles.
        Even though it’s the size of a human child, it can
        hurl 100 grown-ups.
      fr: |-
        Son corps est essentiellement composé de
        muscles. Même s’il fait la taille d’un petit enfant,
        il peut soulever 100 adultes avec ses bras.
      de: |-
        Sein ganzer Körper besteht aus Muskeln. Auch
        wenn es nur so groß wie ein Menschenkind ist,
        kann es 100 Erwachsene jonglieren.
      es: |-
        Es una masa de músculos y, pese a su pequeño
        tamaño, tiene fuerza de sobra para levantar en
        brazos a 100 personas.
      it: |-
        Il suo corpo è formato interamente da muscoli.
        Non è più alto di un bambino, ma può sollevare
        e lanciare 100 adulti.
    shield:
      ja-Hrkt: |-
        いつも　パワフル。　たいりょくが
        ありあまっているので　ひまつぶしに
        いわをもちあげ　さらに　つよくなる。
      ja: |-
        いつも　パワフル。　体力が
        有り余っているので　暇つぶしに
        岩を持ち上げ　さらに　強くなる。
      ko: |-
        언제나 파워풀하다.
        체력이 남아돌기 때문에 심심풀이로
        바위를 들어 올리며 더 강해진다.
      zh-Hant: |-
        時時刻刻都充滿力量。
        由於體力過剩而去舉岩石
        消磨時間，也因此變得更強。
      zh-Hans: |-
        时时刻刻都充满力量。
        由于体力过剩而去举起岩石
        消磨时间，也因此变得更强。
      en: |-
        Always brimming with power, it passes time by
        lifting boulders. Doing so makes it even stronger.
      fr: |-
        Il essaie de dépenser son énergie débordante
        en soulevant des rochers, ce qui le rend encore
        plus fort.
      de: |-
        Da es vor Kraft strotzt, hebt es zum Zeitvertreib
        Felsen. Dadurch gewinnt es an zusätzlicher
        Stärke.
      es: |-
        Siempre rebosante de energía, pasa el tiempo
        levantando piedras para hacerse aún más fuerte.
      it: |-
        Sempre traboccante di energia, passa il tempo
        a sollevare massi. Così diventa ancora più forte.
