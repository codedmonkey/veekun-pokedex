ambipom:
  base_happiness: 100
  capture_rate: 45
  color: purple
  egg_groups:
    - ground
  evolution_chain: aipom
  evolves_from: aipom
  flavor_text:
    diamond:
      en: |-
        To eat, it deftly shucks nuts
        with its two tails. It rarely uses
        its arms now.
    pearl:
      en: |-
        They work in large colonies and
        make rings by linking their
        tails, apparently in friendship.
    platinum:
      en: |-
        Split into two, the tails are so
        adept at handling and doing things,
        AMBIPOM rarely uses its hands.
    heartgold:
      en: |-
        They live on large trees. They are
        said to communicate by connecting
        their tails to those of others.
    soulsilver:
      en: |-
        It is very difficult to dodge the
        consecutive strikes of its two tails.
    black:
      en: |-
        Split into two, the tails are so
        adept at handling and doing things,
        Ambipom rarely uses its hands.
      fr: |-
        Ses queues jumelles sont si agiles
        et efficaces qu’il ne se sert que
        très rarement de ses bras.
    white:
      en: |-
        Split into two, the tails are so
        adept at handling and doing things,
        Ambipom rarely uses its hands.
      fr: |-
        Ses queues jumelles sont si agiles
        et efficaces qu’il ne se sert que
        très rarement de ses bras.
    black-2:
      en: |-
        Split into two, the tails are so
        adept at handling and doing things,
        Ambipom rarely uses its hands.
    white-2:
      en: |-
        Split into two, the tails are so
        adept at handling and doing things,
        Ambipom rarely uses its hands.
    x:
      ja-Hrkt: |-
        おおぜいの　むれで　こうどうする。
        しっぽを　つなぎあわせて　わっかを
        つくる。ゆうじょうの　しるしらしい。
      ja: |-
        大勢の　群れで　行動する。
        尻尾を　つなぎ合わせて　輪っかを
        作る。友情の　印らしい。
      ko: |-
        많은 무리로 행동한다.
        꼬리를 맞잡아 원을 만든다.
        우정의 표시인 듯하다.
      en: |-
        They work in large colonies and make rings by
        linking their tails, apparently in friendship.
      fr: |-
        Ils vivent en grandes colonies et relient leurs
        queues pour former un anneau en signe d’amitié.
      de: |-
        Sie leben in großen Kolonien und verbinden
        ihre Schweife in Freundschaft.
      es: |-
        Habitan en grandes colonias y forman anillos uniendo
        sus colas, aparentemente en signo de amistad.
      it: |-
        Vivono in colonie numerose e formano anelli
        legando le loro code in segno di amicizia.
    'y':
      ja-Hrkt: |-
        ２ほんの　しっぽで　きのみの　からを
        きように　むいて　たべる。ほんものの
        うでは　ほとんど　つかわなくなった。
      ja: |-
        ２本の　尻尾で　木の実の　殻を
        器用に　むいて　食べる。本物の
        腕は　ほとんど　使わなくなった。
      ko: |-
        2개의 꼬리로 나무열매 껍질을
        솜씨 좋게 벗겨 먹는다. 진짜
        팔은 거의 쓰지 않게 되었다.
      en: |-
        To eat, it deftly shucks nuts with its two tails.
        It rarely uses its arms now.
      fr: |-
        Il se nourrit de noix qu’il épluche avec ses deux
        queues habiles. Il utilise de moins en moins ses bras.
      de: |-
        Wenn es hungrig ist, knackt es Nüsse mit seinen
        beiden Schweifen. Nur selten verwendet es die Arme.
      es: |-
        Para comer, rompe nueces con sus dos colas.
        Raras veces utiliza sus brazos.
      it: |-
        Si nutre di nocciole che sbuccia con le due code.
        Raramente usa le sue vere braccia.
    omega-ruby:
      ja-Hrkt: |-
        おおぜいの　むれで　こうどうする。
        しっぽを　つなぎあわせて　わっかを
        つくる。ゆうじょうの　しるしらしい。
      ja: |-
        大勢の　群れで　行動する。
        尻尾を　つなぎ合わせて　輪っかを
        作る。友情の　印らしい。
      ko: |-
        많은 무리로 행동한다.
        꼬리를 맞잡아 원을 만든다.
        우정의 표시인 듯하다.
      en: |-
        They work in large colonies and make rings by
        linking their tails, apparently in friendship.
      fr: |-
        Ils vivent en grandes colonies et relient leurs queues
        pour former un anneau en signe d’amitié.
      de: |-
        Sie leben in großen Kolonien und verbinden ihre Schweife
        in Freundschaft.
      es: |-
        Habitan en grandes colonias y forman anillos uniendo sus
        colas, aparentemente en signo de amistad.
      it: |-
        Vivono in colonie numerose e formano anelli legando le loro
        code in segno di amicizia.
    alpha-sapphire:
      ja-Hrkt: |-
        ２ほんの　しっぽで　きのみの　からを
        きように　むいて　たべる。ほんものの
        うでは　ほとんど　つかわなくなった。
      ja: |-
        ２本の　尻尾で　木の実の　殻を
        器用に　むいて　食べる。本物の
        腕は　ほとんど　使わなくなった。
      ko: |-
        2개의 꼬리로 나무열매 껍질을
        솜씨 좋게 벗겨 먹는다. 진짜
        팔은 거의 쓰지 않게 되었다.
      en: |-
        To eat, it deftly shucks nuts with its two tails.
        It rarely uses its arms now.
      fr: |-
        Il se nourrit de noix qu’il épluche avec ses deux queues
        habiles. Il utilise de moins en moins ses bras.
      de: |-
        Wenn es hungrig ist, knackt es Nüsse mit seinen
        beiden Schweifen. Nur selten verwendet es die Arme.
      es: |-
        Para comer, rompe nueces con sus dos colas. Raras veces
        utiliza sus brazos.
      it: |-
        Si nutre di nocciole che sbuccia con le due code.
        Raramente usa le sue vere braccia.
    ultra-sun:
      ja-Hrkt: |-
        いごこちのよい　きを　めぐって
        ナゲツケサルのグループと　なわばりを
        あらそっている。　けっかは　５ぶだ。
      ja: |-
        居心地の良い　木を　巡って
        ナゲツケサルのグループと　縄張りを
        争っている。　結果は　５分だ。
      ko: |-
        머물기 좋은 나무를 두고
        내던숭이 그룹과 영역
        다툼을 하고 있다. 승률은 비슷하다.
      zh-Hant: |-
        為了搶佔舒適好住的樹木，
        不斷與投擲猴群爭奪地盤，
        但結果是雙方勢均力敵。
      zh-Hans: |-
        围绕着舒适的树木的问题，
        一直在和投掷猴群体争夺领地。
        但结果是五五分。
      en: |-
        In their search for comfortable trees, they get
        into territorial disputes with groups of
        Passimian. They win about half the time.
      fr: |-
        Il se dispute constamment les arbres les plus
        confortables avec Quartermac et remporte
        la victoire la moitié du temps.
      de: |-
        Sie streiten sich mit Gruppen von Quartermak
        um die bequemsten Bäume. Etwa die Hälfte
        dieser Revierkämpfe gewinnen sie.
      es: |-
        Su especie arma constantes trifulcas por los
        árboles más cómodos con los Passimian. Suelen
        ganar la mitad de las veces.
      it: |-
        Questi Pokémon si azzuffano con i Passimian
        per aggiudicarsi il territorio con gli alberi più
        comodi e la metà delle volte la spuntano.
    ultra-moon:
      ja-Hrkt: |-
        なにを　するにも　シッポを　つかう。
        ２ほんの　シッポで　だきしめられたら
        ほんとうに　なつかれた　あかし。
      ja: |-
        なにを　するにも　シッポを　使う。
        ２本の　シッポで　抱きしめられたら
        本当に　懐かれた　証。
      ko: |-
        무엇을 하더라도 꼬리를 사용한다.
        2개의 꼬리로 껴안는다면
        정말로 친밀해졌다는 증거다.
      zh-Hant: |-
        不管做什麼事都會用到尾巴。
        如果牠用２根尾巴抱緊你，
        就代表牠真的和你很親近。
      zh-Hans: |-
        无论做什么都会用到尾巴。
        如果被它的２条尾巴抱紧，
        那就证明是真的和你很亲近。
      en: |-
        It uses its tails for everything. If it wraps both
        of its tails around you and gives you a squeeze,
        that’s proof it really likes you.
      fr: |-
        Il utilise toujours ses deux queues pour faire
        la moindre tâche. Il s’en sert aussi pour enlacer
        les gens qu’il affectionne tout particulièrement.
      de: |-
        Es benutzt seine zwei Schweife für alles, was es
        tut. Wenn es jemanden mit ihnen umarmt, ist das
        ein Beweis seiner Zuneigung.
      es: |-
        Utiliza las dos colas para todo. Cuando abraza
        a alguien con ellas significa que esa persona se
        ha ganado por completo su confianza.
      it: |-
        Usa le code per fare tutto. Se abbraccia
        qualcuno con entrambe le code, significa che
        prova un grande affetto per questa persona.
    legends-arceus:
      en: |-
        To affirm their kinship, members of this species will form a ring
        by linking their newly doubled tails together. On rare occasions,
        humans have been accepted into such rings.
