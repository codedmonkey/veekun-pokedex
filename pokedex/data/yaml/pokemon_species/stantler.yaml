    x:
      ja-Hrkt: |-
        ツノを　みつめていると　わっかの
        ちゅうしんに　すいこまれそうな
        ふしぎな　きぶんに　なってしまう。
      ja: |-
        ツノを　見つめていると　輪っかの
        中心に　吸いこまれそうな
        不思議な　気分に　なってしまう。
      ko: |-
        뿔을 응시하고 있으면 원의
        중심에 빨려 들어가는 것 같은
        이상한 기분이 든다.
      en: |-
        Staring at its antlers creates an odd sensation
        as if one were being drawn into their centers.
      fr: |-
        Quiconque observe ses bois ressent une sensation
        étrange, comme si leur centre l’attirait.
      de: |-
        Starrt man auf sein Geweih, bekommt man
        das seltsame Gefühl, in dessen Mitte
        gezogen zu werden.
      es: |-
        Mirar a su cornamenta provoca una extraña sensación
        de pérdida de equilibrio.
      it: |-
        Chi fissa le sue corna riceve una strana sensazione,
        quasi come se venisse risucchiato.
    'y':
      ja-Hrkt: |-
        ツノの　まがりぐあいが　まわりの
        くうきの　ながれを　びみょうにかえ
        ふしぎな　くうかんを　つくりだす。
      ja: |-
        ツノの　曲がり具合が　まわりの
        空気の　流れを　微妙に　変え
        不思議な　空間を　作り出す。
      ko: |-
        뿔의 휘어진 상태가 주변
        공기의 흐름을 미묘하게 바꿔서
        이상한 공간을 만들어낸다.
      en: |-
        The curved antlers subtly change the flow of air to
        create a strange space where reality is distorted.
      fr: |-
        Ses bois tordus changent le flot de l’air et créent
        une distorsion spatiale dans la réalité.
      de: |-
        Sein gebogenes Geweih generiert via Luftänderung
        einen Raum, in dem die Wirklichkeit verzerrt wird.
      es: |-
        Su cornamenta cambia el flujo del aire para crear un
        espacio de realidad distorsionada.
      it: |-
        Le corna ricurve modificano le correnti d’aria, creando
        una strana zona di distorsione della realtà.
    omega-ruby:
      ja-Hrkt: |-
        みごとな　かたちの　ツノは　びじゅつひん　として
        たかく　うれた　ために　ぜつめつ　すんぜんまで
        らんかくされた　ことのある　ポケモン。
      ja: |-
        見事な　形の　ツノは　美術品　として
        高く　売れた　ために　絶滅　寸前まで
        乱獲された　ことのある　ポケモン。
      ko: |-
        멋지게 생긴 뿔은 미술품으로
        비싸게 팔리기 때문에 멸종 직전까지
        남획됐었던 포켓몬이다.
      en: |-
        Stantler’s magnificent antlers were traded at high prices as
        works of art. As a result, this Pokémon was hunted close to
        extinction by those who were after the priceless antlers.
      fr: |-
        Les superbes bois de Cerfrousse étaient vendus très cher
        comme œuvres d’art. Ce Pokémon fut chassé et l’espèce
        proche de l’extinction à cause des gens qui recherchaient
        leurs précieux bois.
      de: |-
        Damhirplex hat ein prächtiges Geweih, für das hohe Preise
        gezahlt werden, da sie als Kunstwerke gelten. Daher wurde
        dieses Pokémon gejagt und wäre beinahe ausgestorben.
      es: |-
        Hace tiempo, se comerciaba con la magnífica cornamenta de
        Stantler. Se vendía como obra de arte a alto precio. Los
        interesados en cornamentas de valor incalculable empezaron
        a cazarlos y casi provocan su extinción.
      it: |-
        Le magnifiche corna ramificate di Stantler venivano vendute
        a caro prezzo come ornamenti preziosi. Questo ha causato
        una caccia indiscriminata di questo Pokémon fin quasi
        all’estinzione.
    alpha-sapphire:
      ja-Hrkt: |-
        みごとな　かたちの　ツノは　びじゅつひん　として
        たかく　うれた　ために　ぜつめつ　すんぜんまで
        らんかくされた　ことのある　ポケモン。
      ja: |-
