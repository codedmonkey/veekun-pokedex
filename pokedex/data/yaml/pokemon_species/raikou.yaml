    x:
      ja-Hrkt: |-
        あまぐもを　せおっているので
        どんなときでも　かみなりを　だせる。
        かみなりとともに　おちてきたという。
      ja: |-
        雨雲を　背負っているので
        どんなときでも　雷を　出せる。
        雷とともに　落ちてきたという。
      ko: |-
        비구름을 짊어지고 있어서
        어떤 때라도 번개를 칠 수 있다.
        번개와 함께 떨어졌다고 한다.
      en: |-
        The rain clouds it carries let it fire thunderbolts
        at will. They say that it descended with lightning.
      fr: |-
        Le nuage de pluie qu’il porte peut relâcher la foudre
        à volonté. On dit de lui qu’il est venu avec l’orage.
      de: |-
        Die Regenwolken, die es trägt, ermöglichen es ihm,
        Gewitter zu erzeugen. Es strotzt vor Blitzen.
      es: |-
        Las nubes de lluvia que lleva le permiten lanzar rayos
        a voluntad. Dicen que apareció con un rayo.
      it: |-
        Grazie alle nubi di pioggia che ha con sé lancia
        fulmini a volontà. Pare che sia arrivato con un lampo.
    'y':
      ja-Hrkt: |-
        たいないで　うずまく　ちからを
        でんげきとして　だしながら　だいちを
        かけめぐる　あらあらしい　ポケモン。
      ja: |-
        体内で　渦巻く　力を
        電撃として　出しながら　大地を
        駆け巡る　荒々しい　ポケモン。
      ko: |-
        체내에서 들끓는 힘을
        전격으로 내보내면서 대지를
        달리는 난폭한 포켓몬이다.
      en: |-
        This rough Pokémon stores energy inside its body,
        then sweeps across the land, shooting
        off electricity.
      fr: |-
        Ce terrible Pokémon emmagasine de l’énergie puis
        court en lançant de puissants éclairs.
      de: |-
        Dieses aggressive Pokémon speichert Energie
        in seinem Körper und entlädt sie, wenn es über
        das Land streift.
      es: |-
        Este duro Pokémon almacena energía en su cuerpo.
        Después, cuando se desplaza por tierra, la suelta.
      it: |-
        Pokémon violento che accumula energia nel corpo
        e poi corre all’impazzata, scaricando elettricità.
    omega-ruby:
      ja-Hrkt: |-
        かみなりの　スピードを　やどした　ポケモン。
        その　とおぼえは　かみなりが　おちた　ときの
        ように　くうきを　ふるわせ　だいちを　ゆるがす。
      ja: |-
        雷の　スピードを　宿した　ポケモン。
        その　遠ぼえは　雷が　落ちた　ときの
        ように　空気を　震わせ　大地を　揺るがす。
      ko: |-
        번개의 스피드가 깃들어 있는 포켓몬이다.
        그 울음소리는 번개가 내리쳤을 때처럼
        공기를 떨리게 하며 대지를 흔든다.
      en: |-
        Raikou embodies the speed of lightning. The roars of this
        Pokémon send shock waves shuddering through the air
        and shake the ground as if lightning bolts had come
        crashing down.
      fr: |-
        Raikou incarne la vitesse de l’éclair. Les rugissements de
        ce Pokémon libèrent des ondes de choc provenant du ciel
        et frappant le sol avec la puissance de la foudre.
      de: |-
        Raikou ist so schnell wie der Blitz. Das Gebrüll dieses
        Pokémon sendet Schockwellen aus, die wie Donnerschläge
        durch die Luft beben und den Boden erschüttern.
      es: |-
        Raikou tiene la velocidad del rayo. Los rugidos de este
        Pokémon emiten ondas de choque que se esparcen vibrando
        por el aire y sacuden el suelo como si fueran auténticas
        descargas de rayo.
      it: |-
        Raikou rappresenta la velocità del fulmine. Il suo ruggito crea
        terrificanti onde d’urto nell’aria e scuote il suolo come se
        fosse percosso dalla furia di un fulmine durante il temporale.
    alpha-sapphire:
      ja-Hrkt: |-
