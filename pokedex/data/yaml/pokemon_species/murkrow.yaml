    x:
      ja-Hrkt: |-
        かがやく　ものを　ひろっては
        ひみつの　ばしょに　かくしておく。
        よく　ニャースと　うばいあいになる。
      ja: |-
        輝く　物を　拾っては
        秘密の　場所に　隠しておく。
        よく　ニャースと　奪い合いになる。
      ko: |-
        반짝이는 물건을 주워
        비밀 장소에 숨겨 둔다.
        나옹과 자주 쟁탈전을 벌인다.
      en: |-
        It hides any shiny object it finds in a secret
        location. Murkrow and Meowth loot one
        another’s stashes.
      fr: |-
        Il vole tous les objets brillants qu’il voit. Les Cornèbre
        et les Miaouss se volent mutuellement.
      de: |-
        Es versteckt jeden schimmernden Gegenstand.
        Kramurx und Mauzi rauben sich gegenseitig die Beute.
      es: |-
        Esconde objetos brillantes en un lugar secreto.
        Meowth y Murkrow suelen saquear su escondite.
      it: |-
        Nasconde in un luogo segreto ogni oggetto che
        trova. Murkrow e Meowth si derubano tra di loro.
    'y':
      ja-Hrkt: |-
        よる　すがたを　みかけると
        ふきつなことが　おきると　しんじられ
        いみきらわれている　ポケモン。
      ja: |-
        夜　姿を　見かけると
        不吉なことが　起きると　信じられ
        忌み嫌われている　ポケモン。
      ko: |-
        밤에 모습을 발견하면
        불길한 일이 생긴다고 여겨져
        몹시 미움받는 포켓몬이다.
      en: |-
        Feared and loathed by many, it is believed to bring
        misfortune to all those who see it at night.
      fr: |-
        Craint et peu aimé, il paraît qu’il porte malheur à ceux
        qui croisent son chemin la nuit.
      de: |-
        Viele verabscheuen und hassen es, da sie glauben,
        es bringe Verderben, wenn sie ihm nachts begegnen.
      es: |-
        Temido y odiado por muchos, dicen que trae la
        desgracia a todos aquellos que lo ven por la noche.
      it: |-
        Molti lo temono e lo detestano credendo che porti
        sfortuna a coloro che lo vedono di notte.
    omega-ruby:
      ja-Hrkt: |-
        ふこうを　はこぶと　いわれ　おそれられていた。
        キラキラ　ひかる　ものに　きょうみを　しめし
        じょせいの　ゆびわを　とっていこうとする。
      ja: |-
        不幸を　運ぶと　いわれ　恐れられていた。
        キラキラ　光る　ものに　興味を　示し
        女性の　指輪を　取っていこうとする。
      ko: |-
        불행을 가져온다고 하여 두려움의 대상이었다.
        반짝반짝 빛나는 것에 흥미를 보이며
        여성의 반지를 가져가려 한다.
      en: |-
        Murkrow was feared and loathed as the alleged bearer of ill
        fortune. This Pokémon shows strong interest in anything that
        sparkles or glitters. It will even try to steal rings from women.
      fr: |-
        Jadis, Cornèbre était craint et détesté, car on disait
        qu’il portait malheur. Ce Pokémon est attiré par tout
        ce qui brille. Parfois, il essaie de voler les bagues
        des filles.
      de: |-
        Kramurx wurde als vermeintlicher Überbringer des Unheils
        verabscheut und gefürchtet. Dieses Pokémon hat ein großes
        Interesse an allem, was funkelt und glitzert. Es stiehlt auch
        Ringe von Frauen.
      es: |-
        Murkrow ha sido temido y repudiado por todos por ser
        supuestamente fuente de mala suerte. Este Pokémon siente
        debilidad por todo lo que brilla y resplandece. A las mujeres
        les roba los anillos.
      it: |-
        Murkrow era temuto e disprezzato poiché si pensava
        portasse sfortuna. Questo Pokémon mostra un vivo interesse
        per tutto ciò che luccica e brilla. Arriva persino a tentare di
        rubare gli anelli alle signore.
    alpha-sapphire:
      ja-Hrkt: |-
        ふこうを　はこぶと　いわれ　おそれられていた。
        キラキラ　ひかる　ものに　きょうみを　しめし
        じょせいの　ゆびわを　とっていこうとする。
      ja: |-
        不幸を　運ぶと　いわれ　恐れられていた。
        キラキラ　光る　ものに　興味を　示し
        女性の　指輪を　取っていこうとする。
      ko: |-
        불행을 가져온다고 하여 두려움의 대상이었다.
        반짝반짝 빛나는 것에 흥미를 보이며
        여성의 반지를 가져가려 한다.
      en: |-
        Murkrow was feared and loathed as the alleged bearer of ill
        fortune. This Pokémon shows strong interest in anything that
        sparkles or glitters. It will even try to steal rings from women.
      fr: |-
        Jadis, Cornèbre était craint et détesté, car on disait
        qu’il portait malheur. Ce Pokémon est attiré par tout
        ce qui brille. Parfois, il essaie de voler les bagues
        des filles.
      de: |-
        Kramurx wurde als vermeintlicher Überbringer des Unheils
        verabscheut und gefürchtet. Dieses Pokémon hat ein großes
        Interesse an allem, was funkelt und glitzert. Es stiehlt auch
        Ringe von Frauen.
      es: |-
        Murkrow ha sido temido y repudiado por todos por ser
        supuestamente fuente de mala suerte. Este Pokémon siente
        debilidad por todo lo que brilla y resplandece. A las mujeres
        les roba los anillos.
      it: |-
        Murkrow era temuto e disprezzato poiché si pensava
        portasse sfortuna. Questo Pokémon mostra un vivo interesse
        per tutto ciò che luccica e brilla. Arriva persino a tentare di
        rubare gli anelli alle signore.
    sun:
      ja-Hrkt: |-
        ひぐれに　めざめ　ゆうやみを　とぶ。
        ヤミカラスが　とぶまでに　いえに
        かえれ　という　ことわざも　あるぞ。
      ja: |-
        日暮れに　目覚め　夕闇を　飛ぶ。
        ヤミカラスが　飛ぶまでに　家に
        帰れ　という　ことわざも　あるぞ。
      ko: |-
        해가 지면 일어나 저녁 하늘을 난다.
        니로우가 날기 전에 집에
        돌아가라는 속담도 있다.
      zh-Hant: |-
        日落時醒來，於低垂的夜幕中飛行。
        也有所謂　「黑暗鴉出巢，
        快點回家吧」　的俗語。
      zh-Hans: |-
        日落时醒来，夜晚飞行。
        也有俗话说，黑暗鸦出窝，
        赶紧要回家。
      en: |-
        They awaken at dusk and take wing in the
        twilight, leading to the expression,
        “Get home before the Murkrow fly.”
      fr: |-
        Il s’éveille au crépuscule et prend son envol à
        la nuit tombée. Un proverbe local conseille de
        rentrer chez soi avant l’envol du Cornèbre.
      de: |-
        Es wacht bei Dämmerung auf und fliegt durch
        die Nacht. Daher das Sprichwort: „Flugs nach
        Haus, mein Kind, wenn Kramurx am Himmel sind!“
      es: |-
        Se despierta al ponerse el sol y vuela toda la
        noche. Por eso, un viejo refrán aconseja volver
        a casa antes de que Murkrow levante el vuelo.
      it: |-
        Si sveglia al tramonto e vola nella notte buia.
        Un vecchio proverbio consiglia di tornare a casa
        prima che Murkrow si alzi in volo.
    moon:
      ja-Hrkt: |-
        ふきつの　あかしと　きらわれるが
        なかよしの　トレーナーには　キラキラ
        ひかるものを　プレゼントするよ。
      ja: |-
        不吉の　証と　嫌われるが
        仲良しの　トレーナーには　キラキラ
        光るものを　プレゼントするよ。
      ko: |-
        불길의 상징으로 미움받지만
        사이 좋은 트레이너에게는 반짝반짝
        빛나는 물건을 선물한다.
      zh-Hant: |-
        被人嫌棄為不吉的象徵，
        但是會把亮晶晶發著光的
        東西送給關係好的訓練家。
      zh-Hans: |-
        作为不吉的象征而被人嫌弃，
        但是会把亮晶晶发着光的
        东西送给关系好的训练家。
      en: |-
        Seen as a symbol of bad luck, it’s generally
        disliked. Yet it gives presents—objects that
        sparkle or shine—to Trainers it’s close to.
      fr: |-
        Les gens voient en lui un oiseau de malheur,
        mais il offre des choses brillantes aux
        Dresseurs dont il devient l’ami.
      de: |-
        Es ist als Unglücksbringer verschrien, aber wenn
        es sich mit seinem Trainer gut versteht, schenkt
        es ihm allerlei funkelnde und glitzernde Objekte.
      es: |-
        Es odiado por muchos, pues se dice que atrae
        la desgracia. Si se lleva bien con su Entrenador,
        lo obsequiará con objetos brillantes.
      it: |-
        Molti lo detestano credendo che porti sfortuna.
        Se si affeziona al suo Allenatore, gli porta in
        regalo oggetti luccicanti.
    ultra-sun:
      ja-Hrkt: |-
        ひかるものに　めがない。　おたからを
        もとめて　ほうせきを　ためこむ
        ガバイトの　すに　しのびこむことも。
      ja: |-
        光るものに　目が　ない。　お宝を
        求めて　宝石を　ため込む
        ガバイトの　巣に　忍び込むことも。
      ko: |-
        반짝이는 것을 매우 좋아한다.
        보물을 찾아 보석을 모으는
        한바이트 둥지에 몰래 들어가기도 한다.
      zh-Hant: |-
        對閃亮亮的東西毫無抵抗力，
        有時會為了尋求寶物而潛入
        會儲存寶石的尖牙陸鯊的巢穴。
      zh-Hans: |-
        对于发光的东西毫无抵抗力。
        为了追求宝物，有时候会潜入
        爱储存宝石的尖牙陆鲨的巢穴。
      en: |-
        It has a weakness for shiny things. It’s been
        known to sneak into the nests of Gabite—noted
        collectors of jewels—in search of treasure.
      fr: |-
        Il est fasciné par tout ce qui brille. Son
        obsession pour les trésors est telle qu’il va
        jusqu’à fouiller les nids des Carmache.
      de: |-
        Es hat eine Schwäche für glitzernde Objekte.
        Hin und wieder schleicht es sich, in Erwartung
        schillernder Schätze, ins Nest von Knarksel.
      es: |-
        Le gustan los objetos brillantes. Su fascinación
        por todo cuanto reluce lo lleva a buscar tesoros
        incluso en los nidos de Gabite.
      it: |-
        Adora gli oggetti luccicanti. La sua brama di
        tesori lo porta a infiltrarsi nelle tane dei Gabite
        per rubare le pietre preziose che custodiscono.
    ultra-moon:
      ja-Hrkt: |-
        ボスのために　キラキラ　ひかるものを
        さがしている。　ふきつな　そんざいと
        いわれ　いみきらう　ひとも　おおい。
      ja: |-
        ボスのために　キラキラ　光るものを
        探している。　不吉な　存在と
        いわれ　忌み嫌う　人も　多い。
      ko: |-
        보스를 위해 반짝반짝 빛나는 것을
        찾고 있다. 불길한 존재로 여겨
        몹시 싫어하는 사람도 많다.
      zh-Hant: |-
        會為了老大尋找閃閃發亮的東西。
        被人們視為不吉利的象徵，
        厭惡牠的人也很多。
      zh-Hans: |-
        会为老大去寻找闪闪发光的东西。
        据说它很不吉利，厌恶它的人也很多。
      en: |-
        It searches for shiny things for its boss.
        Murkrow’s presence is said to be unlucky, so
        many people detest it.
      fr: |-
        Il cherche des objets brillants pour son chef.
        Sa réputation d’oiseau de mauvais augure lui
        vaut la haine de nombreuses personnes.
      de: |-
        Für seinen Chef geht es auf die Jagd nach
        glitzernden Objekten. Von vielen Menschen wird
        es als Überbringer des Unheils verabscheut.
      es: |-
        Busca objetos brillantes para su patrón. No
        cuenta con muchas simpatías, pues la gente lo
        considera ave de mal agüero.
      it: |-
        Va in cerca di oggetti luccicanti per il suo capo.
        Molti lo temono e lo detestano credendo che
        porti sfortuna.
