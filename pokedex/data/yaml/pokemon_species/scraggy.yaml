scraggy:
  base_happiness: 35
  capture_rate: 180
  color: yellow
  egg_groups:
    - ground
    - dragon
  evolution_chain: scraggy
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        Its skin has a rubbery elasticity, so
        it can reduce damage by defensively
        pulling its skin up to its neck.
      fr: |-
        Il remonte sa peau jusqu’à son cou pour
        se protéger. Elle a une constitution
        élastique qui absorbe les coups.
    white:
      en: |-
        It immediately headbutts anyone that
        makes eye contact with it. Its skull is
        massively thick.
      fr: |-
        Quiconque a le malheur de croiser son
        regard se prend un coup de tête.
        Il a le crâne très dur.
    black-2:
      en: |-
        Proud of its sturdy skull,
        it suddenly headbutts everything,
        but its weight makes it unstable, too.
    white-2:
      en: |-
        Proud of its sturdy skull,
        it suddenly headbutts everything,
        but its weight makes it unstable, too.
    x:
      ja-Hrkt: |-
        かわを　くびまで　ひきあげて
        ぼうぎょの　しせい。ゴムのような
        だんりょくで　ダメージを　へらす。
      ja: |-
        皮を　首まで　引き上げて
        防御の　姿勢。ゴムのような　弾力で
        ダメージを　減らす。
      ko: |-
        가죽을 목까지 늘려서
        방어 자세를 취한다. 고무 같은
        탄력을 이용해 데미지를 줄인다.
      en: |-
        Its skin has a rubbery elasticity, so it can reduce
        damage by defensively pulling its skin up to
        its neck.
      fr: |-
        Il remonte sa peau jusqu’à son cou pour se protéger.
        Elle a une constitution élastique qui absorbe les
        coups.
      de: |-
        Es zieht seine gummiartige Haut bis zum Hals hinauf
        und nimmt eine Abwehrhaltung ein, um sich vor
        Schaden zu schützen.
      es: |-
        Se sube la piel hasta el cuello para defenderse. Su
        elasticidad, similar a la de una goma, reduce el daño
        recibido.
      it: |-
        Assumono la posizione difensiva tirando su fino al
        collo la pelle, che è elastica come la gomma e
        previene i danni.
    'y':
      ja-Hrkt: |-
        がんじょうな　ずがいこつが　じまん。
        いきなり　ずつきを　かましてくるが
        おもさで　じぶんも　フラフラしてる。
      ja: |-
        頑丈な　頭蓋骨が　自慢。
        いきなり　頭突きを　かましてくるが
        重さで　自分も　フラフラしてる。
      ko: |-
        튼튼한 두개골이 자랑이다.
        느닷없이 박치기를 하려고 하지만
        무게로 자신도 휘청거린다.
      en: |-
        Proud of its sturdy skull, it suddenly headbutts
        everything, but its weight makes it unstable, too.
      fr: |-
        Ses coups de tête sont sa fierté. Seul problème :
        sa tête est un peu trop lourde, et il perd souvent
        l’équilibre.
      de: |-
        Verteilt gerne unvermittelt Kopfnüsse, deren Wucht
        auch seine Sinne vernebelt. Es ist stolz auf seinen
        robusten Schädel.
      es: |-
        Está orgulloso de su sólido cráneo. Reparte cabezazos
        a diestro y siniestro con tal vehemencia que él mismo
        se marea.
      it: |-
        Va fiero del suo robustissimo cranio. Tira senza
        preavviso testate così forti da farlo barcollare.
    omega-ruby:
      ja-Hrkt: |-
        かわを　くびまで　ひきあげて
        ぼうぎょの　しせい。ゴムのような
        だんりょくで　ダメージを　へらす。
      ja: |-
        皮を　首まで　引き上げて
        防御の　姿勢。ゴムのような　弾力で
        ダメージを　減らす。
      ko: |-
        가죽을 목까지 늘려서
        방어 자세를 취한다. 고무 같은
        탄력을 이용해 데미지를 줄인다.
      en: |-
        Its skin has a rubbery elasticity, so it can reduce
        damage by defensively pulling its skin up to
        its neck.
      fr: |-
        Il remonte sa peau jusqu’à son cou pour se protéger.
        Elle a une constitution élastique qui absorbe les coups.
      de: |-
        Es zieht seine gummiartige Haut bis zum Hals hinauf und nimmt
        eine Abwehrhaltung ein, um sich vor Schaden zu schützen.
      es: |-
        Se sube la piel hasta el cuello para defenderse. Su
        elasticidad, similar a la de una goma, reduce el daño
        recibido.
      it: |-
        Assumono la posizione difensiva tirando su fino al collo
        la pelle, che è elastica come la gomma e previene i danni.
    alpha-sapphire:
      ja-Hrkt: |-
        がんじょうな　ずがいこつが　じまん。
        いきなり　ずつきを　かましてくるが
        おもさで　じぶんも　フラフラしてる。
      ja: |-
        頑丈な　頭蓋骨が　自慢。
        いきなり　頭突きを　かましてくるが
        重さで　自分も　フラフラしてる。
      ko: |-
        튼튼한 두개골이 자랑이다.
        느닷없이 박치기를 하려고 하지만
        무게로 자신도 휘청거린다.
      en: |-
        Proud of its sturdy skull, it suddenly headbutts
        everything, but its weight makes it unstable, too.
      fr: |-
        Ses coups de tête sont sa fierté. Seul problème : sa tête est
        un peu trop lourde, et il perd souvent l’équilibre.
      de: |-
        Verteilt gerne unvermittelt Kopfnüsse, deren Wucht auch seine
        Sinne vernebelt. Es ist stolz auf seinen robusten Schädel.
      es: |-
        Está orgulloso de su sólido cráneo. Reparte cabezazos a
        diestro y siniestro con tal vehemencia que él mismo se
        marea.
      it: |-
        Va fiero del suo robustissimo cranio. Tira senza preavviso
        testate così forti da farlo barcollare.
    ultra-sun:
      ja-Hrkt: |-
        すうひきのグループで　こうどうする。
        ちんたら　あるきまわり　めが　あった
        あいてに　いきなり　ずつきを　かます。
      ja: |-
        数匹のグループで　行動する。
        ちんたら　歩きまわり　目が　合った
        相手に　いきなり　頭突きを　かます。
      ko: |-
        여러 마리 그룹으로 행동한다.
        굼뜨게 다니다 눈이 마주친
        상대에게 느닷없이 박치기를 한다.
      zh-Hant: |-
        以數隻為一組來行動。會慢吞吞地
        走來走去，和對方視線對上時
        就會冷不防用頭錘撞過去。
      zh-Hans: |-
        几只为一组行动。
        漫无目的地到处走，会冷不丁地
        向视线相遇的对手施以头锤。
      en: |-
        They move in small groups, walking around lazily.
        Anyone who makes eye contact gets smacked
        with a headbutt.
      fr: |-
        Il traîne en bandes et distribue des coups
        de tête à ceux qui osent croiser son regard.
      de: |-
        Zurrokex trotten in Gruppen von einigen
        Exemplaren durch die Gegend. Wer mit ihnen
        Augenkontakt herstellt, erhält Kopfnüsse.
      es: |-
        Se desplaza con lentitud en pequeños grupos
        y se lía a cabezazos a la mínima que alguien
        le cruza la mirada.
      it: |-
        Gli Scraggy formano piccoli gruppi e si mettono
        a gironzolare tirando improvvisamente testate a
        chiunque incroci il loro sguardo.
    ultra-moon:
      ja-Hrkt: |-
        だるんと　のびた　かわを　くびまで
        ひっぱりあげて　ガード。　かわが
        のびている　こたいほど　えらいらしい。
      ja: |-
        だるんと　のびた　皮を　首まで
        引っ張りあげて　ガード。　皮が
        のびている　個体ほど　偉いらしい。
      ko: |-
        축 늘어난 가죽을 목까지
        끌어올려서 가드한다. 가죽이
        늘어난 개체일수록 대단하다고 한다.
      zh-Hant: |-
        會把鬆垮垮的皮拉到脖子上
        來保護自己。皮越是鬆垮的
        滑滑小子，地位似乎就越高。
      zh-Hans: |-
        会把松垮垮的皮使劲
        向上拉到脖子用来保护自己。
        好像皮拉得越厉害的个体，地位越高。
      en: |-
        It stretches its saggy skin up to its neck to
        protect itself. The saggier their skin, the more
        respect they garner.
      fr: |-
        Pour se protéger, il remonte sa peau plissée
        jusqu’à son cou. Plus la peau est longue, plus
        Baggiguane inspirera de respect.
      de: |-
        Es zieht seine gummiartige Haut zum Schutz bis
        zum Hals hinauf. Seine Rangfolge scheint davon
        abzuhängen, wie hoch es sie ziehen kann.
      es: |-
        Se sube la piel arrugada hasta el cuello para
        protegerse. Parece que los ejemplares con la
        piel más larga son los más respetados.
      it: |-
        Si protegge tirando la pelle su fino al collo.
        Sembra che gli esemplari dalla pelle più lunga
        siano quelli più rispettati.
    sword:
      ja-Hrkt: |-
        しせんが　あったら　キケン！
        あいてを　えらばず　ずつきで
        おそってくる　やっかいものだ。
      ja: |-
        視線が　合ったら　危険！
        相手を　選ばず　頭突きで
        襲ってくる　厄介者だ。
      ko: |-
        눈이 마주치면 위험하다!
        상대를 가리지 않고 박치기로
        공격해오는 성가신 포켓몬이다.
      zh-Hant: |-
        與牠視線交會是很危險的！
        不管對手是誰，牠都會用
        頭錘招呼，是個難搞的傢伙。
      zh-Hans: |-
        与它视线交汇是很危险的！
        不管对手是谁，它都会用
        头锤招呼，是个难搞的家伙。
      en: |-
        If it locks eyes with you, watch out! Nothing and
        no one is safe from the reckless headbutts of this
        troublesome Pokémon.
      fr: |-
        C’est un Pokémon dangereux qui distribue
        des coups de tête à quiconque ose croiser
        son regard.
      de: |-
        Zurrokex deuten Blickkontakt als Einladung,
        ihr Gegenüber mit Kopfnüssen anzugreifen.
        Vorsicht ist also geboten.
      es: |-
        No tiene reparos en liarse a cabezazos con quien
        se le ponga por delante, por lo que es peligroso
        cruzar la mirada con él.
      it: |-
        È molto molesto e prende a testate chiunque
        gli capiti a tiro, perciò incrociare il suo sguardo
        può essere molto pericoloso.
    shield:
      ja-Hrkt: |-
        じょうぶな　かわで　みを　まもる。
        かわが　のびきるとき　しんかを
        むかえると　いわれる。
      ja: |-
        丈夫な　皮で　身を　守る。
        皮が　伸びきるとき　進化を
        迎えると　いわれる。
      ko: |-
        튼튼한 가죽으로 몸을 지킨다.
        가죽이 다 늘어나면 진화할 때가
        되었다고 한다.
      zh-Hant: |-
        用結實的皮保護身體。
        據說在皮伸展到極限時，
        牠就會開始進化。
      zh-Hans: |-
        用结实的皮保护身体。
        据说在皮伸展到极限时，
        它就会开始进化。
      en: |-
        It protects itself with its durable skin. It’s thought
        that this Pokémon will evolve once its skin has
        completely stretched out.
      fr: |-
        Il se protège grâce à sa peau robuste.
        On dit que quand celle-ci ne peut plus s’étirer
        davantage, c’est qu’il est sur le point d’évoluer.
      de: |-
        Es hat besonders robuste Haut, die seinen Körper
        schützt. Es heißt, wenn sich die Haut nicht weiter
        dehnen lässt, steht die Entwicklung bevor.
      es: |-
        Su robusta piel le sirve de protección. Cuando
        ya no puede estirarse más, es señal de que va
        a evolucionar pronto.
      it: |-
        Il suo corpo è protetto da una pelle robustissima.
        Si dice che quando questa raggiunge il limite
        dell’elasticità, Scraggy sia sul punto di evolversi.
