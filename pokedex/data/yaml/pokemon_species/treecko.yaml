        au mur et au plafond.
    black-2:
      en: |-
        The soles of its feet are covered
        by countless tiny spikes, enabling
        it to walk on walls and ceilings.
    white-2:
      en: |-
        The soles of its feet are covered
        by countless tiny spikes, enabling
        it to walk on walls and ceilings.
    x:
      ja-Hrkt: |-
        すいちょくの　カベも　すいすい
        のぼる。しっぽで　くうきの　しつどを
        かんじ　あしたの　てんきを　あてる。
      ja: |-
        垂直の　壁も　すいすい　登る。
        尻尾で　空気の　湿度を　感じ
        明日の　天気を　当てる。
      ko: |-
        수직으로 된 벽도 쭉쭉
        타고 올라간다. 꼬리로 공기 중의 습도를
        감지해서 내일 날씨를 맞힌다.
      en: |-
        It quickly scales even vertical walls. It senses
        humidity with its tail to predict the next
        day’s weather.
      fr: |-
        Arcko peut grimper aux murs à l’aide de ses pattes.
        Grâce à sa queue, il est capable de mesurer l’humidité
        de l’air et de prédire le temps du jour suivant.
      de: |-
        Es klettert blitzschnell Wände empor. Mit seinem
        Schwanz misst es die Luftfeuchtigkeit, um das
        Wetter am nächsten Tag vorherzusagen.
      es: |-
        Escala superficies verticales muy rápido. Con la cola
        detecta la humedad y prevé el tiempo que va a hacer.
      it: |-
        Riesce a scalare rapidamente anche pareti verticali.
        Rileva l’umidità attraverso la coda per prevedere il
        tempo dell’indomani.
    'y':
      ja-Hrkt: |-
        あしの　うらの　ちいさな　トゲが
        カベや　てんじょうに　ひっかかるので
        さかさまに　なっても　おちないのだ。
      ja: |-
        足の　裏の　小さな　トゲが
        壁や　天井に　引っかかるので
        逆さまに　なっても　落ちないのだ。
      ko: |-
        발바닥의 작은 가시가
        벽이나 천장에 걸리므로
        거꾸로 매달려도 떨어지지 않는다.
      en: |-
        Small hooks on the bottom of its feet catch on
        walls and ceilings. That is how it can hang
        from above.
      fr: |-
        Les épines de ses plantes de pieds lui permettent
        de marcher aux murs et au plafond sans tomber.
      de: |-
        Dank seiner mit winzigen Stacheln besetzten Sohlen
        haftet es sogar kopfüber an Wänden und Decken.
      es: |-
        Tiene pequeñas púas en las plantas de los pies que
        le permiten andar por techos y paredes sin caerse.
      it: |-
        Le piante dei suoi piedi sono piene di uncini che gli
        permettono di camminare su muri e soffitti.
    omega-ruby:
      ja-Hrkt: |-
        あしの　うらの　ちいさな　トゲを　ひっかけて
        すいちょくの　カベを　のぼることが　できる。
        ふとい　しっぽを　たたきつけて　こうげきする。
      ja: |-
        足の　裏の　小さな　トゲを　引っ掛けて
        垂直の　カベを　登ることが　できる。
        太い　尻尾を　たたきつけて　攻撃する。
      ko: |-
        다리 뒤의 작은 가시를 박아
        수직인 벽을 올라갈 수 있다.
        굵은 꼬리로 힘껏 쳐서 공격한다.
      en: |-
        Treecko has small hooks on the bottom of its feet that enable
        it to scale vertical walls. This Pokémon attacks by slamming
        foes with its thick tail.
      fr: |-
        Arcko est doté de petits crochets sous les pattes, ce qui lui
        permet de grimper aux murs. Ce Pokémon attaque en frappant
        ses ennemis avec son épaisse queue.
      de: |-
        Mit den kleinen Haken unter seinen Füßen kann Geckarbor
        an Wänden hochklettern. Dieses Pokémon greift Feinde an,
        indem es mit seinem mächtigen Schweif zuschlägt.
      es: |-
        Treecko tiene unos ganchos pequeños en las plantas de los
        pies con los que puede escalar superficies verticales. Este
        Pokémon ataca dando un golpetazo con la cola.
      it: |-
        Treecko è dotato di piccoli uncini sulla pianta delle zampe,
        che gli consentono di camminare su pareti verticali. Attacca
        frustando i suoi nemici con la coda grossa e forte.
    alpha-sapphire:
      ja-Hrkt: |-
        ちんちゃく　れいせい　なにごとにも　どうじない。
        からだの　おおきな　ポケモンに　にらまれても
        いっぽも　ひかずに　にらみかえすぞ。
      ja: |-
        沈着　冷静　何事にも　動じない。
        体の　大きな　ポケモンに　にらまれても
        一歩も　引かずに　にらみかえすぞ。
      ko: |-
        침착 냉정 어떤 일에도 동요하지 않는다.
        체격이 큰 포켓몬이 노려봐도
        한 발짝도 물러서지 않고 같이 노려본다.
      en: |-
        Treecko is cool, calm, and collected—it never panics under
        any situation. If a bigger foe were to glare at this Pokémon,
        it would glare right back without conceding an inch of ground.
      fr: |-
        Arcko est cool, calme et serein. Il ne panique jamais,
        quelle que soit la situation. Quand un ennemi plus gros
        que lui lui lance un regard de défi, ce Pokémon reste
        stoïque et ne cède pas un centimètre de terrain.
      de: |-
        Geckarbor ist ruhig und beherrscht, es gerät niemals in Panik.
        Wenn es ein stärkerer Feind zornig anstarrt, erwidert es den
        bösen Blick, weicht aber keinen Millimeter zurück.
      es: |-
        Treecko es tranquilo y tiene gran capacidad de autocontrol;
        no pierde la calma en ninguna situación. Si algún rival se le
        queda mirando fijamente, le devolverá la mirada sin ceder ni
        lo más mínimo de su territorio.
      it: |-
        Treecko ha classe, è calmo e posato: non si lascia mai
        prendere dal panico. Quando affronta un nemico più grande
        di lui, lo fissa dritto negli occhi senza la minima esitazione.
