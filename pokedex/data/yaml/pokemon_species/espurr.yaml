espurr:
  base_happiness: 50
  capture_rate: 190
  color: gray
  egg_groups:
    - ground
  evolution_chain: espurr
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        きょうりょくな　サイコパワーが
        もれださないように　ほうしゅつする
        きかんを　みみで　ふさいでいるのだ。
      ja: |-
        強力な　サイコパワーが
        漏れ出さないように　放出する　器官を
        耳で　ふさいでいるのだ。
      ko: |-
        강력한 사이코 파워가
        새어 나가지 않도록
        방출되는 기관을 귀로 막고 있다.
      en: |-
        The organ that emits its intense psychic power is
        sheltered by its ears to keep power from leaking out.
      fr: |-
        Il couvre la source de ses pouvoirs psychiques hors
        du commun avec ses oreilles afin d’éviter
        les accidents.
      de: |-
        Damit die starken Psycho-Kräfte dieses Pokémon
        nicht unkontrolliert nach außen dringen, ist das Organ,
        das diese freisetzt, von seinen Ohren bedeckt.
      es: |-
        Protege con las orejas el órgano con el que irradia su
        intenso poder psíquico para evitar que este se escape
        al exterior.
      it: |-
        Copre con le orecchie gli organi che presiedono ai suoi
        grandi poteri psichici per non perderne il controllo.
    'y':
      ja-Hrkt: |-
        １００メートルいないの　ものを
        ふきとばす　ほどの　サイコパワーを
        うまく　コントロール　できないのだ。
      ja: |-
        １００メートル以内の　ものを
        吹き飛ばす　ほどの　サイコパワーを
        うまく　コントロール　できないのだ。
      ko: |-
        100m 이내에 있는 것을
        날려버릴 정도의 사이코 파워를
        잘 컨트롤하지 못한다.
      en: |-
        It has enough psychic energy to blast
        everything within 300 feet of itself,
        but it has no control over its power.
      fr: |-
        Il a quelques difficultés à contrôler son pouvoir
        psychique. Grâce à celui-ci, il peut projeter en l’air
        tous les objets dans un rayon de 100 m.
      de: |-
        Es verfügt zwar über genug Psycho-Kräfte, um Objekte
        in einem Umkreis von 100 m wegzublasen, aber es
        kann sie noch nicht gut kontrollieren.
      es: |-
        Posee poderes psíquicos suficientes para lanzar por
        los aires objetos situados en un radio de 100 metros,
        pero carece de pericia para controlarlos.
      it: |-
        Controlla a fatica un potere psichico enorme, in grado
        di scaraventare in aria oggetti nel raggio di 100 m.
    omega-ruby:
      ja-Hrkt: |-
        きょうりょくな　サイコパワーが
        もれださないように　ほうしゅつする
        きかんを　みみで　ふさいでいるのだ。
      ja: |-
        強力な　サイコパワーが
        漏れ出さないように　放出する　器官を
        耳で　ふさいでいるのだ。
      ko: |-
        강력한 사이코 파워가
        새어 나가지 않도록
        방출되는 기관을 귀로 막고 있다.
      en: |-
        The organ that emits its intense psychic power is
        sheltered by its ears to keep power from leaking out.
      fr: |-
        Il couvre la source de ses pouvoirs psychiques hors
        du commun avec ses oreilles afin d’éviter les accidents.
      de: |-
        Damit die starken Psycho-Kräfte dieses Pokémon nicht
        unkontrolliert nach außen dringen, ist das Organ, das diese
        freisetzt, von seinen Ohren bedeckt.
      es: |-
        Protege con las orejas el órgano con el que irradia su intenso
        poder psíquico para evitar que este se escape al exterior.
      it: |-
        Copre con le orecchie gli organi che presiedono ai suoi
        grandi poteri psichici per non perderne il controllo.
    alpha-sapphire:
      ja-Hrkt: |-
        １００メートルいないの　ものを
        ふきとばす　ほどの　サイコパワーを
        うまく　コントロール　できないのだ。
      ja: |-
        １００メートル以内の　ものを
        吹き飛ばす　ほどの　サイコパワーを
        うまく　コントロール　できないのだ。
      ko: |-
        100m 이내에 있는 것을
        날려버릴 정도의 사이코 파워를
        잘 컨트롤하지 못한다.
      en: |-
        It has enough psychic energy to blast
        everything within 300 feet of itself,
        but it has no control over its power.
      fr: |-
        Il a quelques difficultés à contrôler son pouvoir psychique.
        Grâce à celui-ci, il peut projeter en l’air tous les objets
        dans un rayon de 100 m.
      de: |-
        Es verfügt zwar über genug Psycho-Kräfte, um Objekte in
        einem Umkreis von 100 m wegzublasen, aber es kann sie
        noch nicht gut kontrollieren.
      es: |-
        Posee poderes psíquicos suficientes para lanzar por los aires
        objetos situados en un radio de 100 metros, pero carece de
        pericia para controlarlos.
      it: |-
        Controlla a fatica un potere psichico enorme, in grado di
        scaraventare in aria oggetti nel raggio di 100 m.
    sword:
      ja-Hrkt: |-
        いつも　むひょうじょうだが　じつは
        きょうりょくな　サイコパワーが
        もれださないように　ひっしなのだ。
      ja: |-
        いつも　無表情だが　じつは
        強力な　サイコパワーが
        漏れ出さないように　必死なのだ。
      ko: |-
        언제나 무표정하지만 실제로는
        강력한 사이코 파워가
        새어 나가지 않게 하기 위해 필사적이다.
      zh-Hant: |-
        雖然一直都面無表情，
        但是那其實是因為牠在努力
        不讓自己強大的精神力量漏出。
      zh-Hans: |-
        虽然一直都面无表情，
        但是那其实是因为它在努力
        不让自己强力的精神力量漏出。
      en: |-
        Though Espurr’s expression never changes,
        behind that blank stare is an intense struggle to
        contain its devastating psychic power.
      fr: |-
        Sous son masque inexpressif, il est en fait
        constamment en train d’essayer de contenir
        ses puissants pouvoirs psychiques.
      de: |-
        Sein Gesicht ist stets ausdruckslos. Grund dafür
        ist die enorme Anstrengung, die es aufbringen
        muss, um seine Psycho-Kräfte zu kontrollieren.
      es: |-
        Su inexpresividad aparente esconde una lucha
        titánica por contener su inmenso poder psíquico.
      it: |-
        Il suo sguardo è inespressivo, ma in realtà sta
        facendo uno sforzo enorme per tenere sotto
        controllo i suoi potentissimi poteri psichici.
    shield:
      ja-Hrkt: |-
        プロレスラーを　ふきとばす　ほどの
        サイコパワーを　うちに　ひめているが
        コントロールできずに　こまっている。
      ja: |-
        プロレスラーを　吹きとばす　ほどの
        サイコパワーを　内に　秘めているが
        コントロールできずに　困っている。
      ko: |-
        프로레슬러를 날려 버릴 정도의
        사이코 파워를 속에 지니고 있지만
        컨트롤이 되지 않아 난처해하고 있다.
      zh-Hant: |-
        雖然擁有可以彈飛
        職業摔角選手的精神力量，
        卻因無法好好控制而感到煩惱。
      zh-Hans: |-
        虽然拥有可以弹飞
        职业摔角手的精神力量，
        却因无法好好控制而感到烦恼。
      en: |-
        There’s enough psychic power in Espurr to send a
        wrestler flying, but because this power can’t be
        controlled, Espurr finds it troublesome.
      fr: |-
        Il possède des pouvoirs psychiques si puissants
        qu’il peut faire valser un catcheur.
        Malheureusement, il a du mal à les contrôler.
      de: |-
        Mit seinen Psycho-Kräften könnte es selbst
        Profi-Wrestler vom Platz fegen. Es fällt ihm aber
        schwer, diese Kräfte zu kontrollieren.
      es: |-
        Es capaz de mandar por los aires a un luchador
        profesional gracias a sus poderes psíquicos, pero
        tiene serios problemas para controlarlos.
      it: |-
        I suoi poteri psichici sono talmente forti da
        scaraventare in aria un lottatore di wrestling,
        ma ha seri problemi nel controllarli.
