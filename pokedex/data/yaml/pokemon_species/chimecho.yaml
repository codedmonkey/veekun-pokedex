chimecho:
  base_happiness: 70
  capture_rate: 45
  color: blue
  egg_groups:
    - indeterminate
  evolution_chain: chimecho
  evolves_from: chingling
  flavor_text:
    ruby:
      en: |-
        CHIMECHO makes its cries echo
        inside its hollow body. When this
        POKéMON becomes enraged, its criesresult in ultrasonic waves that have
        the power to knock foes flying.
    sapphire:
      en: |-
        In high winds, CHIMECHO cries as it
        hangs from a tree branch or the eaves
        of a building using a suction cup on itshead.
        This POKéMON plucks berries with its
        long tail and eats them.
    emerald:
      en: |-
        They fly about very actively when the hot
        season arrives. They communicate among
        themselves using seven different and
        distinguishing cries.
    firered:
      en: |-
        It travels by riding on winds. It cleverly
        uses its long tail to pluck nuts and
        berries, which it loves to eat.
    leafgreen:
      en: |-
        It travels by riding on winds. It cleverly
        uses its long tail to pluck nuts and
        berries, which it loves to eat.
    diamond:
      en: |-
        To knock foes flying, it makes the
        air shudder with its cries. It
        converses using seven cries.
    pearl:
      en: |-
        Emitting ultrasonic cries, it
        floats on winds to travel great
        distances.
    platinum:
      en: |-
        Its cries echo inside its hollow
        body to emerge as beautiful notes
        for startling and repelling foes.
    heartgold:
      en: |-
        It uses the sucker on its head to
        hang from a tree or from eaves. It
        can produce seven different tones.
    soulsilver:
      en: |-
        It uses the sucker on its head to
        hang from a tree or from eaves. It
        can produce seven different tones.
    black:
      en: |-
        Its cries echo inside its hollow
        body to emerge as beautiful notes
        for startling and repelling foes.
      fr: |-
        Ses cris se répercutent dans son
        corps creux avant d’exploser en
        notes mélodieuses et saisissantes.
    white:
      en: |-
        Its cries echo inside its hollow
        body to emerge as beautiful notes
        for startling and repelling foes.
      fr: |-
        Ses cris se répercutent dans son
        corps creux avant d’exploser en
        notes mélodieuses et saisissantes.
    black-2:
      en: |-
        Its cries echo inside its hollow
        body to emerge as beautiful notes
        for startling and repelling foes.
    white-2:
      en: |-
        Its cries echo inside its hollow
        body to emerge as beautiful notes
        for startling and repelling foes.
    x:
      ja-Hrkt: |-
        あたまの　きゅうばんで　きの　えだや
        いえの　のきしたに　ぶらさがる。
        ７しゅるい　ねいろを　つかいわける。
      ja: |-
        頭の　吸盤で　木の　枝や
        家の　軒下に　ぶら下がる。
        ７種類　音色を　使い分ける。
      ko: |-
        머리의 빨판으로 나뭇가지나
        집의 처마 밑에 매달린다.
        7종류의 음색을 나누어 쓴다.
      en: |-
        It uses the sucker on its head to hang from a tree
        or from eaves. It can produce seven different tones.
      fr: |-
        Il se suspend sous une branche ou un auvent avec
        la ventouse de sa tête. Son langage comporte sept
        cris.
      de: |-
        Mit seinem Saugnapf hängt es sich an Äste oder unter
        Vordächer. Es kennt sieben verschiedene Schreie.
      es: |-
        Se cuelga de ramas y aleros con la ventosa de su
        cabeza. Tiene siete tipos de gritos diferentes.
      it: |-
        Emette sette tipi di versi penzolando da rami
        o cornicioni, a cui si attacca con la ventosa che ha
        sul capo.
    'y':
      ja-Hrkt: |-
        ちょうおんぱの　なきごえを　もつ。
        ふわふわと　うかび　かぜに　のって
        ながい　きょりを　たびする。
      ja: |-
        超音波の　鳴き声を　持つ。
        ふわふわと　浮かび　風に　乗って
        長い　距離を　旅する。
      ko: |-
        초음파 울음소리를 가지고 있다.
        둥둥 떠서 바람을 타고
        긴 거리를 여행한다.
      en: |-
        Emitting ultrasonic cries, it floats on winds to travel
        great distances.
      fr: |-
        Il émet des cris à ultrasons et chevauche le vent pour
        parcourir de grandes distances.
      de: |-
        Es setzt Ultraschallwellen frei, während es sich
        vom Wind über große Distanzen tragen lässt.
      es: |-
        Emite ondas ultrasónicas que le permiten flotar en el
        viento para viajar grandes distancias.
      it: |-
        Emette versi ultrasonici. Percorre grandi distanze
        facendosi trascinare dai venti.
    omega-ruby:
      ja-Hrkt: |-
        こえを　からだの　くうどうに　はんきょうさせる。
        おこった　ときの　なきごえは　てきを　ふきとばす
        いりょくを　もった　ちょうおんぱに　なるぞ。
      ja: |-
        声を　体の　空洞に　反響させる。
        怒った　ときの　鳴き声は　敵を　吹き飛ばす
        威力を　持った　超音波に　なるぞ。
      ko: |-
        목소리를 몸의 빈 곳에 메아리치게 한다.
        화가 났을 때의 울음소리는 적을 날려버릴
        위력을 지닌 초음파가 된다.
      en: |-
        Chimecho makes its cries echo inside its hollow body.
        When this Pokémon becomes enraged, its cries result in
        ultrasonic waves that have the power to knock foes flying.
      fr: |-
        Éoko fait résonner son cri dans son corps creux.
        Lorsque ce Pokémon est en colère, les échos de
        son cri génèrent des ultrasons capables d’envoyer
        voler des ennemis.
      de: |-
        Palimpalims Schreie hallen durch seinen hohlen Körper.
        Wenn dieses Pokémon wütend wird, erzeugen seine Schreie
        Ultraschallwellen, die seine Feinde buchstäblich wegfegen
        können.
      es: |-
        Chimecho hace que sus gritos resuenen con eco en su
        interior. Cuando se enfada, los chillidos se convierten en
        ondas ultrasónicas capaces de derribar a los enemigos
        voladores.
      it: |-
        Chimecho fa riecheggiare il suo verso dentro al corpo vuoto.
        Quando s’infuria emette onde a ultrasuoni in grado di
        abbattere i nemici in volo.
    alpha-sapphire:
      ja-Hrkt: |-
        かぜが　つよくなると　きの　えだや　のきしたに
        あたまの　きゅうばんで　ぶらさがり　なきだす。
        ながい　シッポで　きのみを　つまんで　たべる。
      ja: |-
        風が　強くなると　木の　枝や　軒下に
        頭の　吸盤で　ぶら下がり　鳴き出す。
        長い　シッポで　きのみを　つまんで　食べる。
      ko: |-
        바람이 강해지면 나뭇가지나 처마 끝에
        머리의 흡반으로 매달려 울기 시작한다.
        긴 꼬리로 나무열매를 집어서 먹는다.
      en: |-
        In high winds, Chimecho cries as it hangs from a tree branch or
        the eaves of a building using a suction cup on its head. This
        Pokémon plucks berries with its long tail and eats them.
      fr: |-
        Lorsqu’il y a beaucoup de vent, Éoko pousse des cris,
        accroché à une branche ou à un auvent par une ventouse
        placée sur sa tête. Ce Pokémon attrape des Baies avec
        sa longue queue pour les manger.
      de: |-
        Bei starkem Wind hängt sich Palimpalim an einen Ast oder an
        die Dachrinne eines Gebäudes, wobei es eine Saugkappe auf
        seinem Kopf benutzt. Das Pokémon pflückt mit seinem langen
        Schweif Beeren und verspeist sie.
      es: |-
        Cuando hay viento fuerte, Chimecho chilla colgado de la rama
        de un árbol o de los aleros de un edificio por la ventosa que
        tiene en la cabeza. Este Pokémon usa la larga cola que tiene
        para agarrar bayas y comérselas.
      it: |-
        Quando soffia il vento forte, Chimecho emette il suo verso
        penzolando dai rami degli alberi o dai cornicioni, a cui
        si attacca con la ventosa che ha sul capo. Con la sua
        lunga coda scova le bacche dal terreno e se ne ciba.
