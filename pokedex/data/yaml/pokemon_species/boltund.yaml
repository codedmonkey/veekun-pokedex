boltund:
  base_happiness: 50
  capture_rate: 45
  color: yellow
  egg_groups:
    - ground
  evolution_chain: yamper
  evolves_from: yamper
  flavor_text:
    sword:
      ja-Hrkt: |-
        でんきを　つくって　あしに　おくり
        はしりを　アシスト。　みっかみばん
        やすまず　はしれるのだ。
      ja: |-
        電気を　つくって　脚に　送り
        走りを　アシスト。　三日三晩
        休まず　走れるのだ。
      ko: |-
        만든 전기를 다리로 보내서
        달리는 것을 돕는다. 삼 일 밤낮을
        쉬지 않고 달릴 수 있다.
      zh-Hant: |-
        會製造電能，並傳送到腳上
        作為奔跑時的輔助動力。
        能不眠不休地奔跑三天三夜。
      zh-Hans: |-
        会制造电能，并传送到脚上
        作为奔跑时的辅助动力。
        可以不眠不休地奔跑三天三夜。
      en: |-
        This Pokémon generates electricity and channels
        it into its legs to keep them going strong.
        Boltund can run nonstop for three full days.
      fr: |-
        Il produit de l’électricité puis la transfère
        dans ses pattes pour mieux courir. Ainsi, il peut
        foncer pendant trois jours et trois nuits.
      de: |-
        Es generiert Strom und lässt ihn zur Unterstützung
        beim Rennen in seine Beine fließen. Dadurch
        kann es drei Tage und Nächte ohne Pause rennen.
      es: |-
        La electricidad que genera y envía a sus patas le
        ayuda a desplazarse rápidamente. Puede correr
        sin descanso durante tres días y tres noches.
      it: |-
        Trasferisce alle zampe l’elettricità che produce
        per aumentarne la resistenza. Può correre per
        tre giorni interi senza mai fermarsi.
    shield:
      ja-Hrkt: |-
        でんきの　ちからで　きゃくりょくを
        ぞうきょう。　トップスピードは
        じそく　９０キロを　かるく　こえる。
      ja: |-
        電気の　力で　脚力を
        増強。　トップスピードは
        時速　９０キロを　軽く　超える。
      ko: |-
        전기의 힘으로 다릿심을
        강하게 키운다. 최고 속도는
        시속 90km를 가볍게 넘긴다.
      zh-Hant: |-
        電力增強了牠的腳力。
        當以最高速度奔跑時，
        時速可以輕易超過９０公里。
      zh-Hans: |-
        电力增强了它的脚力。
        当以最高速度奔跑时，
        时速可以轻易超过９０公里。
      en: |-
        It sends electricity through its legs to boost their
        strength. Running at top speed, it easily breaks
        50 mph.
      fr: |-
        Il se sert de l’énergie électrique pour augmenter
        la puissance de ses membres.
        Sa vitesse maximale dépasse de peu les 90 km/h.
      de: |-
        Mit Elektrizität verstärkt es seine Beinkraft.
        So erreicht es mit Leichtigkeit eine
        Höchstgeschwindigkeit von über 90 km/h.
      es: |-
        La electricidad le confiere una enorme fuerza en
        las patas. Su velocidad punta puede superar los
        90 km/h sin problema.
      it: |-
        La potenza delle sue zampe aumenta grazie
        all’energia elettrica. Quando corre a tutta
        velocità supera facilmente i 90 km/h.
