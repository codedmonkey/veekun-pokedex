      it: |-
        Venomoth è un Pokémon notturno, cioè attivo soltanto
        di notte. Le sue prede favorite sono i piccoli insetti che
        si raggruppano attorno ai lampioni attratti dalla luce nel buio.
    lets-go-pikachu:
      ja-Hrkt: |-
        ハネの　りんぷんは　からだにつくと
        なかなか　とれない。しかも　そこから
        どくの　せいぶんが　しみこんでくる。
      ja: |-
        ハネの　りん粉は　体につくと
        なかなか　取れない。しかも　そこから
        毒の　成分が　染み込んでくる。
      ko: |-
        날개의 인분은 몸에 묻으면
        좀처럼 떨어지지 않는다. 게다가
        거기에서 독성분이 스며든다.
      zh-Hant: |-
        翅膀上的鱗粉一旦沾到身上
        就很難甩掉，而且鱗粉帶有的
        毒素還會逐漸滲入體內。
      zh-Hans: |-
        如果不小心把它翅膀上的鳞粉
        沾到了身上，那不但会很难去除，
        更糟的是毒素也会从那里渗入。
      en: |-
        The powdery scales on its wings are hard to
        remove from skin. They also contain poison
        that leaks out on contact.
      fr: |-
        Les écailles de ses ailes sont presque impossibles
        à retirer lorsqu’elles se collent à la peau,
        et elles libèrent un poison violent au contact.
      de: |-
        Berührt man die staubartigen Schuppen auf
        seinen Flügeln, heften diese sich hartnäckig am
        Körper an und sondern darüber hinaus Gift ab.
      es: |-
        Las alas desprenden un polvillo de escamas
        impregnado de toxinas que se adhiere al
        contacto y resulta difícil de quitar.
      it: |-
        Se si attaccano alla pelle, le scaglie che
        ricoprono le sue ali sono difficili da togliere.
        Inoltre, rilasciano una sostanza velenosa.
    lets-go-eevee:
      ja-Hrkt: |-
