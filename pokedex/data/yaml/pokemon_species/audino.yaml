audino:
  base_happiness: 50
  capture_rate: 255
  color: pink
  egg_groups:
    - fairy
  evolution_chain: audino
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        It touches others with the feelers on
        its ears, using the sound of their
        heartbeats to tell how they are feeling.
      fr: |-
        Il ausculte les gens avec ses antennes
        auriculaires pour juger de leurs
        émotions ou de leur santé.
    white:
      en: |-
        Its auditory sense is astounding. It has
        a radarlike ability to understand its
        surroundings through slight sounds.
      fr: |-
        Sa capacité auditive est exceptionnelle.
        Il émet des sons imperceptibles pour
        sonder les alentours, comme un sonar.
    black-2:
      en: |-
        Using the feelers on its ears,
        it can tell how someone is feeling
        or when an egg might hatch.
    white-2:
      en: |-
        Using the feelers on its ears,
        it can tell how someone is feeling
        or when an egg might hatch.
    x:
      ja-Hrkt: |-
        みみの　しょっかくで　あいての
        たいちょうや　タマゴから　ポケモンが
        いつ　でてくるのかも　わかるのだ。
      ja: |-
        耳の　触角で　相手の
        体調や　タマゴから　ポケモンが
        いつ　でてくるのかも　わかるのだ。
      ko: |-
        귀의 더듬이로 상대의
        컨디션이나 알에서 포켓몬이
        언제 나올지도 알 수 있다.
      en: |-
        Using the feelers on its ears, it can tell how
        someone is feeling or when an egg might hatch.
      fr: |-
        Son ouïe est si développée qu’il arrive à juger de
        la santé des gens ou à savoir quand un Œuf va éclore.
      de: |-
        Über die Fühler an seinen Ohren kann es ertasten,
        wie es einer Person geht oder wann ein Pokémon
        aus seinem Ei schlüpft.
      es: |-
        Con las antenas de sus oídos, perciben el estado de
        un rival o predicen cuándo va a eclosionar un Huevo
        Pokémon.
      it: |-
        Le sue orecchie sono antenne capaci di sondare
        lo stato di salute degli altri o capire quando un
        uovo si schiuderà.
    'y':
      ja-Hrkt: |-
        みみの　しょっかくで　あいてに
        ふれると　しんぞうの　おとで
        たいちょうや　きもちが　わかるのだ。
      ja: |-
        耳の　触角で　相手に　触れると
        心臓の　音で
        体調や　気持ちが　わかるのだ。
      ko: |-
        귀의 더듬이가 상대에게
        닿으면 심장 소리를 듣고
        몸 상태나 기분을 알 수 있다.
      en: |-
        It touches others with the feelers on its ears, using
        the sound of their heartbeats to tell how they
        are feeling.
      fr: |-
        Il ausculte les gens avec ses antennes auriculaires
        pour juger de leurs émotions ou de leur santé.
      de: |-
        Berührt es jemanden mit den Fühlern an seinen Ohren,
        erfährt es durch den Herzschlag der Person,
        wie es ihr geht.
      es: |-
        Al tocar a alguien con las antenas de sus orejas,
        conoce su estado de ánimo y de salud por los latidos
        del corazón.
      it: |-
        Quando tocca qualcuno con le antenne delle
        orecchie, ne percepisce lo stato fisico e psicologico
        dal battito cardiaco.
    omega-ruby:
      ja-Hrkt: |-
        みみの　しょっかくで　あいての
        たいちょうや　タマゴから　ポケモンが
        いつ　でてくるのかも　わかるのだ。
      ja: |-
        耳の　触角で　相手の
        体調や　タマゴから　ポケモンが
        いつ　でてくるのかも　わかるのだ。
      ko: |-
        귀의 더듬이로 상대의
        컨디션이나 알에서 포켓몬이
        언제 나올지도 알 수 있다.
      en: |-
        Using the feelers on its ears, it can tell how
        someone is feeling or when an egg might hatch.
      fr: |-
        Son ouïe est si développée qu’il arrive à juger de la santé
        des gens ou à savoir quand un Œuf va éclore.
      de: |-
        Über die Fühler an seinen Ohren kann es ertasten, wie es einer
        Person geht oder wann ein Pokémon aus seinem Ei schlüpft.
      es: |-
        Con las antenas de sus oídos, perciben el estado de un rival o
        predicen cuándo va a eclosionar un Huevo Pokémon.
      it: |-
        Le sue orecchie sono antenne capaci di sondare lo stato
        di salute degli altri o capire quando un uovo si schiuderà.
    alpha-sapphire:
      ja-Hrkt: |-
        みみの　しょっかくで　あいてに
        ふれると　しんぞうの　おとで
        たいちょうや　きもちが　わかるのだ。
      ja: |-
        耳の　触角で　相手に　触れると
        心臓の　音で
        体調や　気持ちが　わかるのだ。
      ko: |-
        귀의 더듬이가 상대에게
        닿으면 심장 소리를 듣고
        몸 상태나 기분을 알 수 있다.
      en: |-
        It touches others with the feelers on its ears, using
        the sound of their heartbeats to tell how they
        are feeling.
      fr: |-
        Il ausculte les gens avec ses antennes auriculaires pour juger
        de leurs émotions ou de leur santé.
      de: |-
        Berührt es jemanden mit den Fühlern an seinen Ohren,
        erfährt es durch den Herzschlag der Person, wie es ihr geht.
      es: |-
        Al tocar a alguien con las antenas de sus orejas, conoce su
        estado de ánimo y de salud por los latidos del corazón.
      it: |-
        Quando tocca qualcuno con le antenne delle orecchie, ne
        percepisce lo stato fisico e psicologico dal battito cardiaco.
    sword:
      ja-Hrkt: |-
        すぐれた　ちょうかくを　もっている。
        ２キロさきで　ころがった　こいしの
        おとも　ききとることが　できる。
      ja: |-
        優れた　聴覚を　持っている。
        2キロ先で　転がった　小石の
        音も　聴き取ることが　できる。
      ko: |-
        뛰어난 청각을 가졌다.
        2km 떨어진 곳에서 구르는
        돌멩이 소리도 들을 수 있다.
      zh-Hant: |-
        擁有極為敏銳的聽覺。
        連２公里外有小石子
        滾動的聲音牠都能聽見。
      zh-Hans: |-
        拥有敏锐的听觉。
        连２公里以外小石头
        滚动的声音都能听到。
      en: |-
        Audino’s sense of hearing is superb. Not even a
        pebble rolling along over a mile away will escape
        Audino’s ears.
      fr: |-
        Son ouïe est si fine qu’il est capable d’entendre
        un caillou tomber à 2 km.
      de: |-
        Dieses Pokémon verfügt über ein außerordentlich
        gutes Gehör. Es kann sogar das Kullern eines
        Kiesels aus 2 km Entfernung vernehmen.
      es: |-
        Su sentido del oído es extraordinario. Puede
        percibir el sonido de una piedrecita rodando
        a 2 km de distancia.
      it: |-
        Possiede un udito eccellente, grazie al quale
        riesce a cogliere anche il suono di un sasso
        che rotola a 2 km di distanza.
    shield:
      ja-Hrkt: |-
        こころやさしい　ポケモン。
        しょっかくを　おしあて　あいての
        きもちや　たいちょうを　りかいする。
      ja: |-
        心優しい　ポケモン。
        触角を　押し当て　相手の
        気持ちや　体調を　理解する。
      ko: |-
        마음 착한 포켓몬이다.
        더듬이를 갖다 대어 상대의
        마음과 몸 상태를 파악한다.
      zh-Hant: |-
        心地善良的寶可夢。透過
        用觸角觸碰，就能了解
        對方的情緒和身體狀況。
      zh-Hans: |-
        心地善良的宝可梦。
        通过触角接触，就能了解
        对方的心情和身体状况。
      en: |-
        This Pokémon has a kind heart. By touching with
        its feelers, Audino can gauge other creatures’
        feelings and physical conditions.
      fr: |-
        Ce Pokémon gentil est capable de deviner
        les émotions et l’état de santé des autres
        rien qu’en les touchant avec ses antennes.
      de: |-
        Berührt dieses herzensgute Pokémon jemanden
        mit seinen Fühlern, kann es dessen körperliche
        Verfassung und Gemütszustand ertasten.
      es: |-
        Un Pokémon gentil que es capaz de comprender
        los sentimientos y averiguar el estado de salud
        de todo aquel que toque con sus antenas.
      it: |-
        Questo Pokémon dal cuore tenero è in grado di
        percepire le condizioni fisiche e mentali
        di chi tocca con le antenne.
