    ultra-sun:
      ja-Hrkt: |-
        ハサミは　ときどき　もげることもあり
        さいせいするまでは　コソコソくらす。
        ハサミのなかみは　とてもおいしいよ。
      ja: |-
        ハサミは　時々　もげることもあり
        再生するまでは　コソコソ暮らす。
        ハサミの中身は　とても美味しいよ。
      ko: |-
        가끔 집게가 떨어지면
        재생할 때까지 몰래 숨어 다닌다.
        집게 속살은 매우 맛있다.
      zh-Hant: |-
        鉗子時常會脫落，
        在重新長出前會偷偷摸摸地生活。
        鉗子裡面的肉非常美味。
      zh-Hans: |-
        钳子时常会掉落，
        在再生之前，会悄悄地生活。
        钳子里面的肉非常美味哦。
      en: |-
        Its claws occasionally fall off, and it keeps a low
        profile until they grow back. The meat of its
        claws is so delicious!
      fr: |-
        Sa pince, à la chair délicieuse, tombe parfois.
        Il se fait alors tout petit et se cache le temps
        qu’elle repousse.
      de: |-
        Manchmal verliert es seine Scheren. Danach lebt
        es in Zurückgezogenheit, bis sie nachwachsen.
        Das Fleisch im Inneren der Scheren ist köstlich.
      es: |-
        En alguna que otra ocasión se le cae la pinza,
        y hasta que le crece de nuevo vive aislado. La
        carne del interior de las pinzas es deliciosa.
      it: |-
        Se capita che gli si stacchi una chela, resta
        nascosto finché non ricresce. La polpa delle sue
        chele è una vera prelibatezza.
    ultra-moon:
      ja-Hrkt: |-
        みぎの　ハサミから　みずを　ふきだし
        いどう。　バランスが　わるいので
        まっすぐ　およぐのは　へたくそ。
      ja: |-
        右の　ハサミから　水を　噴き出し
        移動。　バランスが　悪いので
        まっすぐ　泳ぐのは　下手くそ。
      ko: |-
        오른쪽 집게에서 물을 뿜어내서
        이동한다. 밸런스가 나빠서
        똑바로 헤엄치는 것에 몹시 서툴다.
      zh-Hant: |-
        從右邊的鉗子噴出水來移動。
        因為無法取得平衡，
        所以不擅長直線游動。
      zh-Hans: |-
        从右侧的钳子里喷出水来移动。
        因为平衡性很差，
        所以不擅长直线游泳。
      en: |-
        It moves around by jetting water from its right
        pincer. It has a poor sense of balance, so it’s
        terrible at swimming straight.
      fr: |-
        Il se déplace en propulsant de l’eau par sa pince
        droite. Il n’est cependant pas très agile et est
        incapable de nager droit.
      de: |-
        Das Ungleichgewicht, das entsteht, wenn es zur
        Fortbewegung Wasser aus der rechten Schere
        spritzt, hindert es daran, gerade zu schwimmen.
      es: |-
        Para moverse, expulsa chorros de agua por su
        pinza derecha. Tiene muy mal equilibrio, por lo
        que es incapaz de nadar en línea recta.
      it: |-
        Si sposta spruzzando acqua dalla chela destra.
        Ha un pessimo equilibrio e non riesce a nuotare
        seguendo una traiettoria dritta.
    sword:
      ja-Hrkt: |-
        ハサミは　たたかいで　とれても
        さいせいされる。　ハサミの　なかみは
        ガラルでは　ちんみとして　にんきだ。
      ja: |-
        ハサミは　戦いで　取れても
        再生される。　ハサミの　中身は
        ガラルでは　珍味として　人気だ。
      ko: |-
        집게발은 싸우다가 떨어져도
        재생된다. 집게 살은 가라르에서
        진미로 통하며 인기가 높다.
      zh-Hant: |-
        鉗子就算在戰鬥中脫落，也會
        重新長出來。鉗子裡面的肉在
        伽勒爾是很有人氣的珍奇美食。
      zh-Hans: |-
        钳子就算在战斗中掉落
        也还会再长出来。钳子里的肉是
        在伽勒尔广受欢迎的珍奇美食。
      en: |-
        Clauncher’s claws can fall off during battle, but
        they’ll regenerate. The meat inside the claws is
        popular as a delicacy in Galar.
      fr: |-
        S’il perd ses pinces au combat, d’autres
        repoussent à la place. La chair qu’elles
        contiennent est un mets très apprécié à Galar.
      de: |-
        Selbst wenn es seine Scheren im Kampf verlieren
        sollte, wachsen sie wieder nach. Das Innere seiner
        Scheren ist in Galar eine beliebte Delikatesse.
      es: |-
        Aunque pierda una pinza en combate, volverá
        a crecerle. La carne del interior de sus pinzas es
        considerada un auténtico manjar en Galar.
      it: |-
        Se le sue chele si staccano durante la lotta,
        ricrescono. La polpa al loro interno
        è considerata una rara prelibatezza a Galar.
    shield:
      ja-Hrkt: |-
        みぎうでの　ハサミの　なかに　たまる
        ガスの　ばくはつで　だんがんのように
        みずを　はっしゃし　てきを　たおす。
      ja: |-
        右腕の　ハサミの　中に　溜まる
        ガスの　爆発で　弾丸のように
        水を　発射し　敵を　倒す。
      ko: |-
        오른팔의 집게 안에 담긴
        가스를 폭발시켜 탄환처럼
        물을 발사해서 상대를 쓰러뜨린다.
      zh-Hant: |-
        右臂的鉗子能夠累積氣體，
        並且利用氣體爆炸噴射出
        像子彈般的水來打倒敵人。
      zh-Hans: |-
        通过引爆积蓄在右臂钳子中的
        气体，像发射子弹般
        将水喷射出去，击倒敌人。
      en: |-
        By detonating gas that accumulates in its right
        claw, this Pokémon launches water like a bullet.
        This is how Clauncher defeats its enemies.
      fr: |-
        Il concentre du gaz dans sa pince droite et
        le fait exploser pour tirer une rafale d’eau
        sur ses ennemis, comme une balle de pistolet.
      de: |-
        Scampisto erledigt seine Feinde, indem es durch
        die Explosion von Gasen, die es in seiner rechten
        Schere speichert, Wasser wie Projektile abfeuert.
      es: |-
        Acalla a sus enemigos con balas de agua que
        dispara haciendo explotar el gas de su pinza
        derecha.
      it: |-
        Sconfigge i nemici con proiettili d’acqua che
        spara facendo esplodere il gas che accumula
        nella chela destra.
