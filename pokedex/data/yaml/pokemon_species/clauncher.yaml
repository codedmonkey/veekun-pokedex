clauncher:
  base_happiness: 50
  capture_rate: 225
  color: blue
  egg_groups:
    - water1
    - water3
  evolution_chain: clauncher
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        おおきな　ハサミから　あっしゅくした
        みずを　ピストルのように　うちだし
        とんでいる　えものを　うちおとす。
      ja: |-
        大きな　ハサミから　圧縮した　水を
        ピストルのように　撃ち出し
        飛んでいる　獲物を　撃ち落とす。
      ko: |-
        커다란 집게발로
        압축한 물을 권총처럼 쏘아
        날고 있는 사냥감을 떨어뜨린다.
      en: |-
        They knock down flying prey by firing
        compressed water from their massive
        claws like shooting a pistol.
      fr: |-
        Sa pince projette un jet d’eau sous pression
        suffisamment puissant pour abattre ses proies en plein
        vol.
      de: |-
        Mit Salven komprimierten Wassers, die es wie
        Pistolenkugeln aus seinen Scheren abfeuert,
        schießt es fliegende Beute ab.
      es: |-
        Abate a enemigos voladores disparando agua a presión
        con su enorme pinza como si de una pistola se tratara.
      it: |-
        Abbatte le prede volanti sparando un getto d’acqua
        ad alta pressione dalla chela più grande, che usa come
        una pistola.
    'y':
      ja-Hrkt: |-
        たいないガスの　ばくはつで　みずを
        ピストルのように　はっしゃする。
        しきんきょりなら　いわを　くだく。
      ja: |-
        体内ガスの　爆発で
        水を　ピストルのように　発射する。
        至近距離なら　岩を　砕く。
      ko: |-
        체내 가스의 폭발로 물을
        총처럼 발사한다.
        가까운 거리에서라면 바위를 부순다.
      en: |-
        Through controlled explosions of internal gas,
        it can expel water like a pistol shot.
        At close distances, it can shatter rock.
      fr: |-
        Il est capable de transformer son corps en canon
        à eau, grâce à la combustion d’un gaz interne.
        À bout portant, il peut réduire un rocher en miettes.
      de: |-
        Durch die Explosion körpereigener Gase feuert es wie
        eine Pistole Wassersalven ab, die aus kurzer Distanz
        selbst Felsen zerschmettern.
      es: |-
        Al explotar el gas que se halla en su interior, expulsa
        un chorro de agua cual pistola, que a bocajarro es
        incluso capaz de pulverizar rocas.
      it: |-
        Facendo esplodere i gas corporei, emette un getto
        d’acqua ad altissima pressione che, a breve distanza,
        può persino frantumare le rocce.
