graveler:
  base_happiness: 70
  capture_rate: 120
  color: brown
  egg_groups:
    - mineral
  evolution_chain: geodude
  evolves_from: geodude
  flavor_text:
    red:
      en: |-
        Rolls down slopes
        to move. It rolls
        over any obstaclewithout slowing
        or changing its
        direction.
    blue:
      en: |-
        Rolls down slopes
        to move. It rolls
        over any obstaclewithout slowing
        or changing its
        direction.
    yellow:
      en: |-
        Often seen rolling
        down mountain
        trails. Obstaclesare just things to
        roll straight
        over, not avoid.
    gold:
      en: |-
        With a free and
        uncaring nature,
        it doesn't mind ifpieces break off
        while it rolls
        down mountains.
    silver:
      en: |-
        A slow walker, it
        rolls to move. It
        pays no attentionto any object that
        happens to be in
        its path.
    crystal:
      en: |-
        It travels by rol­
        ling on mountain
        paths. If it gainstoo much speed, it
        stops by running
        into huge rocks.
    ruby:
      en: |-
        GRAVELER grows by feeding on rocks.
        Apparently, it prefers to eat rocks
        that are covered in moss.This POKéMON eats its way through
        a ton of rocks on a daily basis.
    sapphire:
      en: |-
        Rocks are GRAVELER’s favorite food.
        This POKéMON will climb a mountain from
        the base to the summit, crunchinglyfeasting on rocks all the while.
        Upon reaching the peak, it rolls back
        down to the bottom.
    emerald:
      en: |-
        They descend from mountains by tumbling
        down steep slopes. They are so brutal,
        they smash aside obstructing trees and
        massive boulders with thunderous tackles.
    firered:
      en: |-
        Be careful while hiking on mountain trails.
        GRAVELER may come rolling down the path
        without slowing.
    leafgreen:
      en: |-
        Rolls down slopes to move. It rolls over
        any obstacle without slowing or changing
        its direction.
    diamond:
      en: |-
        GRAVELER make their homes on
        sheer cliff faces by gouging out
        numerous horizontal holes.
    pearl:
      en: |-
        It tumbles down slopes, heedless
        of any body parts chipping off.
        It eats a ton of rocks daily.
    platinum:
      en: |-
        It rolls on mountain paths to move.
        Once it builds momentum, no Pokémon
        can stop it without difficulty.
    heartgold:
      en: |-
        With a free and uncaring nature,
        it doesn’t mind if pieces break off
        while it rolls down mountains.
    soulsilver:
      en: |-
        A slow walker, it rolls to move. It
        pays no attention to any object that
        happens to be in its path.
    black:
      en: |-
        It rolls on mountain paths to move.
        Once it builds momentum, no Pokémon
        can stop it without difficulty.
      fr: |-
        Il dévale les montagnes pour se
        déplacer. Une fois qu’il a pris tout
        son élan, dur dur de l’arrêter!
    white:
      en: |-
        It rolls on mountain paths to move.
        Once it builds momentum, no Pokémon
        can stop it without difficulty.
      fr: |-
        Il dévale les montagnes pour se
        déplacer. Une fois qu’il a pris tout
        son élan, dur dur de l’arrêter!
    black-2:
      en: |-
        It rolls on mountain paths to move.
        Once it builds momentum, no Pokémon
        can stop it without difficulty.
    white-2:
      en: |-
        It rolls on mountain paths to move.
        Once it builds momentum, no Pokémon
        can stop it without difficulty.
    x:
      ja-Hrkt: |-
        やまから　ころがり　おちるとき
        からだの　あちこちが　とれても
        きにしない　ごうかいな　せいかく。
      ja: |-
        山から　転がり　落ちるとき
        体の　あちこちが　取れても
        気にしない　豪快な　性格。
      ko: |-
        산에서 굴러 떨어질 때
        몸의 여기저기가 부서져도
        신경 쓰지 않는 호쾌한 성격이다.
      en: |-
        With a free and uncaring nature, it doesn’t mind
        if pieces break off while it rolls down mountains.
      fr: |-
        D’une nature téméraire, il se moque de perdre des
        parties de son corps quand il dévale les pentes.
      de: |-
        Es ist ihm völlig gleichgültig, wenn Stücke aus ihm
        herausbrechen, während es Berge hinabrollt.
      es: |-
        De naturaleza descuidada y libre, no le importa
        dañarse cuando baja rodando montañas.
      it: |-
        Di natura libera e incurante, non si preoccupa se
        perde dei pezzi mentre si rotola giù dai monti.
    'y':
      ja-Hrkt: |-
        さかみちを　ころがりながら　いどう。
        じゃまな　ものは　どんどん
        おしつぶして　すすんでいく。
      ja: |-
        坂道を　転がりながら　移動。
        邪魔な　ものは　どんどん
        押しつぶして　進んでいく。
      ko: |-
        언덕을 굴러서 이동한다.
        방해물은 마구
        짓누르며 나아간다.
      en: |-
        Rolls down slopes to move. It rolls over any
        obstacle without slowing or changing its direction.
      fr: |-
        Pour se déplacer, il dégringole le long des pentes.
        Il pulvérise tous les obstacles qui se trouvent sur
        son passage.
      de: |-
        Dieses Pokémon bewegt sich nur rollend fort.
        Kein Hindernis kann es vom Kurs abbringen.
      es: |-
        Se mueve rodando cuesta abajo y sobre cualquier
        obstáculo, sin frenar ni cambiar de dirección.
      it: |-
        Si lancia in discesa, rotolando su ogni ostacolo
        senza frenare o mutare direzione.
    omega-ruby:
      ja-Hrkt: |-
        いわを　たべて　せいちょうする　ポケモンだ。
        コケの　ついた　いわの　ほうが　すき　らしい。
        １にちに　１トンの　いわを　たべてしまうぞ。
      ja: |-
        岩を　食べて　成長する　ポケモンだ。
        コケの　ついた　岩の　ほうが　好き　らしい。
        １日に　１トンの　岩を　食べてしまうぞ。
      ko: |-
        바위를 먹고 성장하는 포켓몬이다.
        이끼가 낀 바위를 좋아하는 것 같다.
        하루에 1톤의 바위를 먹어버린다.
      en: |-
        Graveler grows by feeding on rocks. Apparently, it prefers to
        eat rocks that are covered in moss. This Pokémon eats its way
        through a ton of rocks on a daily basis.
      fr: |-
        Gravalanch grandit en se nourrissant de cailloux.
        Apparemment, il a une préférence pour les cailloux recouverts
        de mousse. En moyenne, il mange une tonne de rochers
        par jour.
      de: |-
        Georok wächst, indem es sich von Steinen ernährt. Am liebsten
        mag es Steine, die mit Moos überzogen sind. Dieses Pokémon
        frisst sich täglich durch eine riesige Menge von Steinen.
      es: |-
        Graveler crece alimentándose a base de piedras. Y, según
        parece, las prefiere cubiertas de musgo. Cada día se abre
        camino comiéndose una tonelada de rocas.
      it: |-
        Graveler si ciba di rocce. Pare che preferisca quelle
        ricoperte di muschio. Questo Pokémon mangia ogni giorno
        dieci quintali di pietre.
    alpha-sapphire:
      ja-Hrkt: |-
        やまの　ふもとから　さんちょうまで　のぼる
        あいだに　だいすきな　いわを　ガリガリ　たべる。
        ちょうじょうに　つくと　また　ころがりおちる。
      ja: |-
        山の　ふもとから　山頂まで　登る
        間に　大好きな　岩を　ガリガリ　食べる。
        頂上に　着くと　また　転がり落ちる。
      ko: |-
        산기슭부터 산 정상까지 올라가는
        동안 매우 좋아하는 바위를 으득으득 먹는다.
        정상에 도달하면 다시 굴러 내려온다.
      en: |-
        Rocks are Graveler’s favorite food. This Pokémon will climb a
        mountain from the base to the summit, crunchingly feasting on
        rocks all the while. Upon reaching the peak, it rolls back down
        to the bottom.
      fr: |-
        La nourriture préférée de Gravalanch est la roche.
        Ce Pokémon escalade parfois les montagnes, dévorant
        les rochers sur son passage. Une fois au sommet,
        il se laisse rouler jusqu’en bas.
      de: |-
        Steine sind Georoks Lieblingsspeise. Dieses Pokémon klettert
        vom Fuße eines Berges zu seinem Gipfel empor und zermalmt
        dabei das Gestein. Wenn es den Gipfel erreicht hat, rollt es
        wieder herunter.
      es: |-
        Las piedras son la comida preferida de Graveler. Este
        Pokémon sube a la cima de las montañas devorando todas
        las rocas que va encontrando a su paso. Una vez que alcanza
        la cumbre, baja rodando hasta la falda.
      it: |-
        Il cibo preferito da Graveler sono le rocce. Infatti è capace
        di risalire un monte dalla base alla cima, sgranocchiando rocce
        tutto il tempo. Una volta raggiunta la cima, si lancia in discesa
        rotolando.
    sun:
      ja-Hrkt: |-
        コケの　ついた　いわが　だいこうぶつ。
        ボリボリと　おとを　たてながら
        １にち　１トンいじょうを　くらう。
      ja: |-
        コケの　ついた　岩が　大好物。
        ボリボリと　音を　立てながら
        １日　１トン以上を　喰らう。
      ko: |-
        이끼가 낀 바위를 아주 좋아한다.
        어적어적 소리를 내면서
        1일 1톤 이상을 먹는다.
      zh-Hant: |-
        最喜歡的食物是長有青苔的岩石。
        吃的時候會發出咯吱咯吱的聲音，
        每天會吃１噸以上。
      zh-Hans: |-
        非常喜欢吃长有苔藓的岩石。
        发着嘎吱嘎吱的声音，
        １天吃１吨以上。
      en: |-
        Mossy rocks are its favorite food.
        It can devour a ton a day while crunching loudly.
      fr: |-
        Ses aliments préférés sont les cailloux couverts
        de mousse. Il peut en engloutir une tonne par
        jour en les broyant bruyamment.
      de: |-
        Mit Moos überzogene Steine sind seine absolute
        Leibspeise. Es vertilgt täglich laut knirschend
        eine ganze Tonne davon.
      es: |-
        Su comida preferida son las rocas cubiertas de
        musgo. Llega a comer más de una tonelada en un
        día y causa un gran estruendo al masticar.
      it: |-
        Adora mangiare le rocce coperte di muschio.
        Ogni giorno ne sgranocchia più di 10 quintali.
    moon:
      ja-Hrkt: |-
        あしが　のろいので　からだを　まるめ
        ころがって　いどう。　いきおいづくと
        じそくは　１００キロを　こえる。
      ja: |-
        足が　のろいので　身体を　丸め
        転がって　移動。　勢いづくと
        時速は　１００キロを　超える。
      ko: |-
        발이 둔해서 몸을 둥글게 말아
        굴러서 이동한다. 기세가 더해지면
        시속 100km를 넘는다.
      zh-Hant: |-
        因腿腳笨拙而把身體蜷成一團
        翻滾著移動。滾出勢頭來的話，
        時速能超過１００公里。
      zh-Hans: |-
        因腿脚笨拙而把身体蜷成一团
        翻滚着移动。蓄势而发的话，
        时速能超过１００千米。
      en: |-
        This slow-footed Pokémon moves by curling up
        and rolling instead of walking. With enough
        momentum, its speed can exceed 60 mph.
      fr: |-
        Ses jambes sont faibles, aussi se déplace-t-il
        en se roulant en boule. Il peut ainsi rouler
        jusqu’à 100 km/h.
      de: |-
        Da sich seine Beine nicht zum Gehen eignen,
        bewegt es sich rollend fort. Kommt es richtig
        in Fahrt, erreicht es dabei bis zu 100 km/h.
      es: |-
        Se desplaza rodando, pues a pie va muy
        despacio. Si toma carrerilla, puede superar los
        100 km/h.
      it: |-
        È molto lento nel camminare e si sposta
        rotolando. Se acquista velocità, può superare
        i 100 km/h.
    ultra-sun:
      ja-Hrkt: |-
        がけを　のぼり　さんちょうを　めざす。
        てっぺんに　つくなり　すぐに　きた
        やまみちを　ころがり　おちていく。
      ja: |-
        崖を　登り　山頂を　目指す。
        てっぺんに　着くなり　すぐに　来た
        山道を　転がり　落ちていく。
      ko: |-
        정상을 목표로 절벽을 오른다.
        정상에 도착하면 곧바로
        올라온 산길을 굴러 내려간다.
      zh-Hant: |-
        會爬上山崖朝山頂前進，
        一到達山頂就會馬上沿著
        來時的山路滾下去。
      zh-Hans: |-
        会爬上山崖前往山顶。
        到达山顶后，会立刻
        沿着来时的山路滚下去。
      en: |-
        It climbs up cliffs as it heads toward the peak
        of a mountain. As soon as it reaches the summit,
        it rolls back down the way it came.
      fr: |-
        Il escalade les falaises pour en atteindre les
        sommets. Une fois tout en haut, il se laisse
        rouler par le chemin d’où il est arrivé.
      de: |-
        Es klettert Berghänge bis zum Gipfel empor.
        Einmal oben angekommen, rollt es über den
        Bergpfad sogleich wieder hinunter.
      es: |-
        Escala los riscos de las montañas y, una vez
        alcanzada la cima, desciende rodando por los
        senderos.
      it: |-
        Scala le pareti scoscese delle montagne
        e, una volta raggiunta la vetta, rotola
        giù lungo lo stesso percorso.
    ultra-moon:
      ja-Hrkt: |-
        がけを　ころがり　いどうする。
        まちがえて　かわに　おちると
        さいごの　あがきで　だいばくはつ。
      ja: |-
        崖を　転がり　移動する。
        間違えて　川に　落ちると
        最期の　あがきで　大爆発。
      ko: |-
        절벽을 굴러서 이동한다.
        실수로 강에 떨어지면
        최후의 발악으로 대폭발한다.
      zh-Hant: |-
        藉著從山崖上滾落來移動。
        如果不小心掉進河裡，
        就會在最後掙扎時來個大爆炸。
      zh-Hans: |-
        会从悬崖上滚下来移动。
        如果不慎落入河里，
        就会来个大爆炸以作最后挣扎。
      en: |-
        It travels by rolling down cliffs. If it falls into a
        river, it will explode with its last gasp.
      fr: |-
        Il se déplace en se laissant rouler le long des
        falaises. Si par malheur il finit dans une rivière,
        il se fait exploser en dernier recours.
      de: |-
        Es bewegt sich rollend über Abhänge fort.
        Stürzt es versehentlich in einen Fluss, sprengt
        es sich in seiner Verzweiflung selbst in die Luft.
      es: |-
        Se desplaza rodando por las laderas. Si por
        mala fortuna termina cayendo en un río, con su
        último aliento causa una gigantesca explosión.
      it: |-
        Si sposta rotolando lungo dirupi scoscesi.
        Se finisce dentro a un fiume, viene colto dalla
        disperazione e si fa esplodere.
    lets-go-pikachu:
      ja-Hrkt: |-
        やまみちを　よく　ころがっている。
        とおりみちに　なにが　あろうと
        いっさい　きに　していない。
      ja: |-
        山道を　よく　転がっている。
        通り道に　なにが　あろうと
        一切　気に　していない。
      ko: |-
        산길에서 자주 굴러다닌다.
        가는 길에 무엇이 있든
        전혀 신경 쓰지 않는다.
      zh-Hant: |-
        經常在山路上滾動。
        滾動時從不會去理會
        前面的路上有什麼東西。
      zh-Hans: |-
        常在山路上滚来滚去。
        滚动时从来不关心
        前面的路上都有什么。
      en: |-
        Often seen rolling down mountain trails.
        Obstacles are just things to roll straight over,
        not avoid.
      fr: |-
        Il dévale les sentiers de montagne et traverse
        les obstacles en les pulvérisant.
      de: |-
        Es rollt sich gerne Gebirgspfade hinunter.
        Dabei ist es ihm egal, wer oder was sich in
        seinem Weg befindet.
      es: |-
        Se le suele ver rodando montaña abajo. No evita
        los obstáculos, sino que los arrolla.
      it: |-
        Spesso viene visto rotolare giù per i sentieri di
        montagna, travolgendo tutto ciò che incontra.
    lets-go-eevee:
      ja-Hrkt: |-
        やまみちを　よく　ころがっている。
        とおりみちに　なにが　あろうと
        いっさい　きに　していない。
      ja: |-
        山道を　よく　転がっている。
        通り道に　なにが　あろうと
        一切　気に　していない。
      ko: |-
        산길에서 자주 굴러다닌다.
        가는 길에 무엇이 있든
        전혀 신경 쓰지 않는다.
      zh-Hant: |-
        經常在山路上滾動。
        滾動時從不會去理會
        前面的路上有什麼東西。
      zh-Hans: |-
        常在山路上滚来滚去。
        滚动时从来不关心
        前面的路上都有什么。
      en: |-
        Often seen rolling down mountain trails.
        Obstacles are just things to roll straight over,
        not avoid.
      fr: |-
        Il dévale les sentiers de montagne et traverse
        les obstacles en les pulvérisant.
      de: |-
        Es rollt sich gerne Gebirgspfade hinunter.
        Dabei ist es ihm egal, wer oder was sich in
        seinem Weg befindet.
      es: |-
        Se le suele ver rodando montaña abajo. No evita
        los obstáculos, sino que los arrolla.
      it: |-
        Spesso viene visto rotolare giù per i sentieri di
        montagna, travolgendo tutto ciò che incontra.
    legends-arceus:
      en: |-
        Dwells in holes dug into sheer walls of stone. It enjoys rolling
        down slopes as though it were a boulder during a rockfall,
        so keep an eye upward while traversing mountain roads.
