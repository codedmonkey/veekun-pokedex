    x:
      ja-Hrkt: |-
        ちしきのかみ　と　よばれている。
        めを　あわせた　ものの　きおくを
        けしてしまう　ちからを　もつという。
      ja: |-
        知識の神と　呼ばれている。
        目を　合わせた　者の　記憶を
        消してしまう　力を　持つという。
      ko: |-
        지식의 신이라 불리고 있다.
        눈을 마주친 사람의 기억을 지워
        버리는 힘을 가지고 있다고 한다.
      en: |-
        Known as “The Being of Knowledge.” It is said that
        it can wipe out the memory of those who see
        its eyes.
      fr: |-
        On l’appelle « être du savoir ». On raconte que
        son regard a le pouvoir d’effacer la mémoire.
      de: |-
        „Das wissende Wesen“. Es soll die Erinnerungen
        derer löschen, die ihm in die Augen sehen.
      es: |-
        Se le conoce como el Ser de la Sabiduría. Se dice que
        puede borrar la memoria con una mirada.
      it: |-
        Noto come “Essere della conoscenza”. Pare che
        faccia perdere la memoria a chiunque lo fissi.
    'y':
      ja-Hrkt: |-
        ユクシーの　たんじょうにより
        ひとびとの　せいかつを　ゆたかにする
        ちえが　うまれたと　いわれている。
      ja: |-
        ユクシーの　誕生により
        人々の　生活を　豊かにする
        知恵が　生まれたと　言われている。
      ko: |-
        유크시의 탄생에 의해
        사람들의 생활을 풍요롭게 하는
        지혜가 생겨났다고 전해진다.
      en: |-
        It is said that its emergence gave humans the
        intelligence to improve their quality of life.
      fr: |-
        On dit que sa venue a fourni aux humains le bon sens
        nécessaire pour améliorer leur existence.
      de: |-
        Man sagt, dass durch sein Auftauchen Menschen
        die Intelligenz erhielten, ihr Leben zu verbessern.
      es: |-
        Se dice que su aparición otorgó a los humanos la
        inteligencia para mejorar sus vidas.
      it: |-
        Alla nascita di questo Pokémon l’uomo avrebbe
        ricevuto la capacità di migliorare la propria esistenza.
