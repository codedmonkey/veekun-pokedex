celesteela:
  base_happiness: 0
  capture_rate: 45
  color: green
  egg_groups:
    - no-eggs
  evolution_chain: celesteela
  evolves_from: ~
  flavor_text:
    sun:
      ja-Hrkt: |-
        ウルトラホールから　あらわれた。
        こうそくで　そらを　とぶ　すがたが
        もくげき　された　ウルトラビースト。
      ja: |-
        ウルトラホールから　現れた。
        高速で　空を　飛ぶ　姿が
        目撃　された　ウルトラビースト。
      ko: |-
        울트라홀에서 나타났다.
        고속으로 하늘을 나는 모습이
        목격된 울트라비스트다.
      zh-Hant: |-
        從究極之洞裡出現。
        被人目擊以高速在
        空中飛行的究極異獸。
      zh-Hans: |-
        从究极之洞出现的究极异兽。
        被人目击到以高速在
        空中飞行的样子。
      en: |-
        It appeared from the Ultra Wormhole. Witnesses
        observed it flying across the sky at high speed.
      fr: |-
        Une Ultra-Chimère qui a traversé l’Ultra-Brèche.
        On l’aurait aperçue parcourir le ciel à grande
        vitesse.
      de: |-
        Eine Ultrabestie, die mit extremer
        Geschwindigkeit durch die Lüfte rast.
        Sie ist durch die Ultrapforte gekommen.
      es: |-
        Este Ultraente surgió de un Ultraumbral. Parece
        haber sido avistado surcando los cielos a
        velocidades vertiginosas.
      it: |-
        Questa Ultracreatura è arrivata attraverso
        un Ultravarco ed è stata avvistata mentre
        solcava il cielo ad altissima velocità.
    moon:
      ja-Hrkt: |-
        ＵＢの　いっしゅ。　２ほんの　うでから
        ガスを　ふきだし　もりを　やきはらう
        すがたが　かくにん　されている。
      ja: |-
        ＵＢの　一種。　２本の　腕から
        ガスを　噴きだし　森を　焼き払う
        姿が　確認　されている。
      ko: |-
        UB의 일종. 2개의 팔에서
        가스를 뿜어내어 숲을 불태워버리는
        모습이 확인되었다.
      zh-Hant: |-
        ＵＢ的一種。
        有人看見牠從２條手臂
        噴出氣體燒毀森林的樣子。
      zh-Hans: |-
        究极异兽的一种。
        从２条手臂喷出气体烧毁
        森林的样子已被确认无疑。
      en: |-
        One kind of Ultra Beast. Witnesses have seen it
        burn down a forest by expelling gas from its
        two arms.
      fr: |-
        Une espèce d’Ultra-Chimère. On l’aurait
        aperçue expulsant du gaz par ses deux bras
        et réduisant une forêt tout entière en cendres.
      de: |-
        Diese Ultrabestie wurde dabei gesichtet, wie sie
        mithilfe des Gases, das aus ihren beiden Armen
        strömt, große Waldflächen niederbrannte.
      es: |-
        Varios testigos afirman haber visto como este
        Ultraente carbonizaba un bosque entero con el
        gas expelido por sus extremidades.
      it: |-
        È una delle Ultracreature. È stata vista
        incenerire un’intera foresta emettendo gas
        dalle sue due braccia.
    ultra-sun:
      ja-Hrkt: |-
        きけんな　ＵＢの　いっしゅ。
        きょだいな　りょううで　から　たかい
        エネルギーはんのうを　けんしゅつ。
      ja: |-
        危険な　ＵＢの　一種。
        巨大な　両腕から　高い
        エネルギー反応を　検出。
      ko: |-
        위험한 UB의 일종이다.
        거대한 두 팔에서
        에너지 반응이 강하게 검출된다.
      zh-Hant: |-
        是一種危險的究極異獸。
        從牠巨大的雙臂中檢測到了
        強大的能量反應。
      zh-Hans: |-
        是危险的究极异兽中的一种。
        从它巨大的双臂中检测出来
        很高的能量反应。
      en: |-
        One of the dangerous UBs, high energy readings
        can be detected coming from both of its
        huge arms.
      fr: |-
        Cette dangereuse créature fait partie des
        Ultra-Chimères. On peut détecter des pics
        d’énergie émis par ses bras gigantesques.
      de: |-
        Eine der gefährlichen Ultrabestien. In ihren
        riesigen Armen wurden hohe Energiemengen
        nachgewiesen.
      es: |-
        Uno de los temibles Ultraentes. Las lecturas de
        las reacciones energéticas procedentes de sus
        enormes brazos alcanzan picos desorbitados.
      it: |-
        Una delle temibili Ultracreature. Rilevamenti
        effettuati sulle sue gigantesche braccia hanno
        mostrato reazioni energetiche ad alta intensità.
    ultra-moon:
      ja-Hrkt: |-
        このせかいでは　いしつで　きけんだが
        ほんらい　すんでいる　せかいでは
        ふつうに　みかける　せいぶつらしい。
      ja: |-
        この世界では　異質で　危険だが
        本来　棲んでいる　世界では
        普通に　見かける　生物らしい。
      ko: |-
        이 세계와는 성질이 다르고
        위험하지만 원래 살던 세계에서는
        흔히 볼 수 있는 생물인 듯하다.
      zh-Hant: |-
        在這個世界是危險的異類，
        但牠在原本棲息的世界裡
        似乎是隨處可見的普通生物。
      zh-Hans: |-
        在这个世界是异类，很危险，
        但在它原本栖息的世界，
        好像只是寻常能见的生物。
      en: |-
        Although it’s alien to this world and a danger
        here, it’s apparently a common organism in the
        world where it normally lives.
      fr: |-
        Cette créature venue d’ailleurs est dangereuse
        dans notre monde, mais il semblerait qu’elle soit
        très commune dans le sien.
      de: |-
        In dieser Welt wirkt sein Aussehen gefährlich
        und fremdartig, doch in seiner ursprünglichen
        Welt ist es ein ganz gewöhnliches Lebewesen.
      es: |-
        Para los seres de este mundo resulta extraño
        y peligroso, pero en el mundo del que procede
        es una criatura muy común.
      it: |-
        Nel nostro mondo il suo aspetto appare strano
        e minaccioso, ma sembra che in quello da cui
        proviene sia una creatura molto comune.
