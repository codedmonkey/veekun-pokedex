    sapphire:
      en: |-
        SEAKING is very protective of its eggs.
        The male and female will take turns
        patrolling around their nest and eggs.The guarding of eggs by these POKéMON
        goes on for over a month.
    emerald:
      en: |-
        It punches holes in boulders on stream­
        beds. This is a clever innovation that
        prevents its eggs from being attacked or
        washed away by the current.
    firered:
      en: |-
        The horn on its head is sharp like a
        drill. It bores a hole in a boulder to
        make its nest.
    leafgreen:
      en: |-
        In the autumn spawning season, they can
        be seen swimming powerfully up rivers and
        creeks.
    diamond:
      en: |-
        It makes its nest by hollowing out
        boulders in streams with its horn.
        It defends its eggs with its life.
    pearl:
      en: |-
        To protect its family, it will fight
        with its drill-sharp horn. It lives
        in hollowed rocks in streams.
    platinum:
      en: |-
        In autumn, its body becomes more
        fatty in preparing to propose to a
        mate. It takes on beautiful colors.
    heartgold:
      en: |-
        During spawning season, SEAKING
        gather from all over, causing rivers to
        appear a brilliant red.
    soulsilver:
      en: |-
        Using its horn, it bores holes in
        riverbed boulders, making nests to
        prevent its eggs from washing away.
    black:
      en: |-
        In autumn, its body becomes more
        fatty in preparing to propose to a
        mate. It takes on beautiful colors.
      fr: |-
        En automne, à la saison des amours,
        il fait des réserves de graisse et
        arbore des couleurs chatoyantes.
    white:
      en: |-
        In autumn, its body becomes more
        fatty in preparing to propose to a
        mate. It takes on beautiful colors.
      fr: |-
        En automne, à la saison des amours,
        il fait des réserves de graisse et
        arbore des couleurs chatoyantes.
    black-2:
      en: |-
        In autumn, its body becomes more
        fatty in preparing to propose to a
        mate. It takes on beautiful colors.
    white-2:
      en: |-
        In autumn, its body becomes more
        fatty in preparing to propose to a
        mate. It takes on beautiful colors.
    x:
      ja-Hrkt: |-
        あきが　くると　さんらんの　ために
        ながれに　さからって　ちからづよく
        かわを　およぐ　すがたが　みられる。
      ja: |-
        秋が　くると　産卵のために
        流れに　逆らって　力強く
        川を　泳ぐ　姿が　みられる。
      ko: |-
        가을이 오면 산란을 위해
        힘차게 강물을 거슬러 올라가며
        헤엄치는 모습을 볼 수 있다.
      en: |-
        In the autumn spawning season, they can be seen
        swimming powerfully up rivers and creeks.
      fr: |-
        Pendant la saison des amours, on peut le voir nager
        dans les rivières et les lacs.
      de: |-
        Im Herbst, zur Paarungszeit, sieht man diese
        Pokémon kraftvoll Bäche und Flüsse hinaufschwimmen.
      es: |-
        En otoño, cuando se reproducen, se les puede ver
        nadando con energía por ríos y arroyos.
      it: |-
        In autunno, quando si riproduce, può essere visto
        risalire impetuoso fiumi e torrenti.
    'y':
      ja-Hrkt: |-
        あたまの　ツノで　かわぞこにある
        いわを　くりぬいて　すを　つくる。
        タマゴを　いのちがけで　まもる。
      ja: |-
        頭の　ツノで　川底にある
        岩を　くり抜いて　巣を　作る。
        タマゴを　命がけで　守る。
      ko: |-
        머리의 뿔로 강바닥에 있는
        돌을 파내어 둥지를 만든다.
        알을 목숨 걸고 지킨다.
      en: |-
        It makes its nest by hollowing out boulders in
        streams with its horn. It defends its eggs with
        its life.
      fr: |-
        Il niche dans des rochers du ruisseau qu’il évide
        avec sa corne. Il donnerait sa vie pour ses Œufs.
      de: |-
        Es baut Nester, indem es Steine im Fluss mit seinem
        Horn aushöhlt. Es verteidigt seine Eier mit dem Leben.
      es: |-
        Hace su nido en los agujeros que cava con el cuerno.
        Defiende sus huevos con su vida.
      it: |-
        Con il suo corno, perfora le rocce sul letto dei fiumi
        per farsi il nido. Difende le uova a costo della vita.
    omega-ruby:
      ja-Hrkt: |-
        あきに　なると　メスに　プロポーズする　ために
        かわぞこで　おどる　オスを　みることが　できる。
        からだの　いろが　もっとも　うつくしい　きせつ。
      ja: |-
        秋に　なると　メスに　プロポーズする　ために
        川底で　踊る　オスを　みることが　できる。
        体の　色が　最も　美しい　季節。
      ko: |-
        가을이 되면 암컷에게 프러포즈하기 위해
        강바닥에서 춤추는 수컷을 볼 수 있다.
        몸의 색이 가장 아름다운 계절이다.
      en: |-
        In the autumn, Seaking males can be seen performing
        courtship dances in riverbeds to woo females. During this
        season, this Pokémon’s body coloration is at its most beautiful.
      fr: |-
        En automne, on peut voir les Poissoroy mâles effectuer des
        danses nuptiales dans les rivières pour plaire aux femelles.
        C’est pendant cette saison que le corps de ce Pokémon
        prend ses plus belles couleurs.
      de: |-
        Im Herbst kann man männliche Golking dabei beobachten,
        wie sie Balztänze in Flussbetten aufführen, um die weiblichen
        Exemplare zu beeindrucken. Während dieser Zeit ist die Farbe
        dieser Pokémon am schönsten.
      es: |-
        En otoño, se ven ejemplares de Seaking macho danzando en
        las riberas de los ríos para cortejar a las hembras. En esta
        época, la coloración de este Pokémon alcanza sus niveles
        máximos de belleza.
      it: |-
        In autunno, i Seaking maschio sono soliti corteggiare le
        femmine con particolari danze rituali. In questa stagione il
        corpo di questi Pokémon assume una colorazione particolare.
    alpha-sapphire:
      ja-Hrkt: |-
        タマゴを　まもるため　オスと　メスは　こうたいで
        すの　まわりを　およぎまわり　パトロールする。
        タマゴが　かえるまで　ひとつきいじょう　つづく。
      ja: |-
        タマゴを　守るため　オスと　メスは　交代で
        巣の　周りを　泳ぎ回り　パトロールする。
        タマゴが　かえるまで　ひと月以上　続く。
      ko: |-
        알을 지키기 위해서 수컷과 암컷은 교대로
        서식지 주변을 헤엄쳐 다니며 순찰한다.
        알이 부화할 때까지 한 달 이상 계속된다.
      en: |-
        Seaking is very protective of its eggs. The male and female
        will take turns patrolling around their nest and eggs. The
        guarding of eggs by these Pokémon goes on for over a month.
      fr: |-
        Les Poissoroy font tout pour protéger leurs œufs.
        Les mâles et les femelles patrouillent pour surveiller le nid et
        les œufs. La garde de ces œufs dure un peu plus d’un mois.
      de: |-
        Golking gibt sehr viel acht auf seine Brut. Es patrouilliert um
        sein Nest und die Eier herum, wobei sich das männliche und
        das weibliche Exemplar abwechseln. Das Bewachen der Eier
        beschäftigt dieses Pokémon für über einen Monat.
      es: |-
        Seaking protege sus huevos con uñas y dientes. Macho y
        hembra se turnan para vigilar el nido y los huevos. Este
        período de protección dura más de un mes en el caso de
        estos Pokémon.
      it: |-
        Seaking protegge gelosamente le sue uova. Il maschio e
        la femmina si danno il cambio attorno alla tana e alle uova.
        Le uova vengono sorvegliate per oltre un mese.
    sun:
      ja-Hrkt: |-
        はだざむくなるころ　ぜんしんが
        くれないに　そまる。　そのすがたは
        あきを　かんじる　ふうぶつしだ。
      ja: |-
        肌寒くなるころ　全身が
        紅に　染まる。　その姿は
        秋を　感じる　風物詩だ。
      ko: |-
        쌀쌀해질 무렵 전신이
        주홍색으로 물든다. 그 모습은
        가을을 느끼는 풍물시이다.
      zh-Hant: |-
        天氣變涼的時候，全身就會
        暈染成鮮紅色。那樣子正如
        令人感覺到秋意的風景詩。
      zh-Hans: |-
        凉飕飕的时候，全身就会
        晕染成鲜红色。那样子正如
        令人感觉到秋意的风景诗。
      en: |-
        When the weather grows cold, its whole body
        flushes a deep red. This sight serves as a
        poetic reminder that autumn has arrived.
      fr: |-
        Quand il commence à faire froid, son corps
        devient rouge vif. Ce spectacle annonce
        traditionnellement la venue de l’automne.
      de: |-
        Wenn es kälter wird, färbt sich sein ganzer
        Körper tiefrot. Dieser Anblick versetzt die
        Leute in Herbststimmung.
      es: |-
        Cuando las temperaturas bajan mucho, su piel
        se torna de un color carmesí. Es una señal
        inequívoca de que se aproxima el otoño.
      it: |-
        Quando le giornate cominciano a rinfrescarsi,
        il suo corpo si tinge di rosso vivo, annunciando
        così l’inizio dell’autunno.
    moon:
      ja-Hrkt: |-
        アズマオウマニアの　トレーナーは
        ツノあいこうかと　ヒレあいこうかに
        わかれ　たがいの　なかは　わるい。
      ja: |-
        アズマオウマニアの　トレーナーは
        ツノ愛好家と　ヒレ愛好家に
        わかれ　互いの　仲は　悪い。
      ko: |-
        왕콘치 마니아인 트레이너는
        뿔 애호가와 지느러미 애호가로
        갈라져 서로 사이가 나쁘다.
      zh-Hant: |-
        狂熱愛好金魚王的訓練家
        分為角的愛好者和魚鰭的愛好者。
        兩者之間的關係很差。
      zh-Hans: |-
        狂热爱好金鱼王的训练家
        分为角的爱好者和鱼鳍的爱好者。
        相互之间的关系很差。
      en: |-
        Trainers who are crazy for Seaking are divided
        into horn enthusiasts and fin enthusiasts.
        The two groups do not get along well.
      fr: |-
        Il existe deux types de Dresseurs de Poissoroy :
        ceux qui aiment sa corne et ceux qui préfèrent
        ses nageoires. Les deux groupes se détestent.
      de: |-
        Golkings Fangemeinde spaltet sich in zwei
        Lager, die sich gegenseitig nicht riechen können:
        die Hornenthusiasten und die Flossenfans.
      es: |-
        Los fanáticos de este Pokémon pueden dividirse
        en dos grupos: los que adoran sus aletas y los
        que adoran su cuerno. No se llevan nada bien.
      it: |-
        Gli appassionati di Seaking si dividono in due
        gruppi: gli estimatori del corno e gli amanti
        delle pinne. Tra di loro non corre buon sangue.
    ultra-sun:
      ja-Hrkt: |-
        ツノは　ドリルのように　かいてんして
        かたい　いわも　グングン　くりぬく。
        オスのほうが　あざやかな　いろあい。
      ja: |-
        ツノは　ドリルのように　回転して
        硬い　岩も　グングン　くり貫く。
        オスの方が　鮮やかな　色合い。
      ko: |-
        뿔이 드릴처럼 회전하기 때문에
        단단한 바위도 쉽게 뚫는다.
        수컷이 선명한 색을 띤다.
      zh-Hant: |-
        頭上的角會像鑽頭一樣旋轉，
        就連堅硬的岩石也能輕易貫穿。
        雄性的顏色比較鮮豔。
      zh-Hans: |-
        头上的角会像钻头一样旋转，
        即便是坚硬的岩石也能一下子贯穿。
        雄性有着鲜艳的颜色。
      en: |-
        Its horn spins like a drill to steadily hollow out
        rocks—even harder ones. The coloration of the
        male is more vivid.
      fr: |-
        Il peut forer des rocs en faisant tourner sa
        corne comme une perceuse. Les mâles ont
        des couleurs plus vives que les femelles.
      de: |-
        Sein Horn rotiert wie ein Bohrer und höhlt selbst
        die härtesten Felsen aus. Männliche Golking
        erstrahlen in besonders prächtigen Farben.
      es: |-
        Es capaz de pulverizar las rocas más duras
        haciendo girar su cuerno a modo de taladro.
        Los machos presentan una coloración más viva.
      it: |-
        Facendo girare il corno come la punta
        di un trapano perfora anche la roccia.
        I maschi hanno colori più sgargianti.
    ultra-moon:
      ja-Hrkt: |-
        オスは　かわぞこで　おどって　メスに
        アピール。　１ばん　うつくしく
        まった　オスに　メスが　あつまる。
      ja: |-
        オスは　川底で　踊って　メスに
        アピール。　１番　美しく
        舞った　オスに　メスが　集まる。
      ko: |-
        수컷은 강바닥에서 춤을 추며
        암컷에게 어필한다. 가장 아름답게
        춤을 추는 수컷에게 암컷이 모여든다.
      zh-Hant: |-
        雄性會在河底跳舞，藉此吸引
        雌性的目光。雌性會聚集到
        舞跳得最美的雄性身邊。
      zh-Hans: |-
        雄性会在河底跳舞并以此来吸引雌性。
        雌性会聚集到跳得最美的雄性身边。
      en: |-
        To attract females, males dance on the river’s
        floor. The females gather around the male that
        dances most gracefully.
      fr: |-
        Les mâles dansent devant les femelles pour
        s’attirer leurs faveurs ; les plus talentueux
        gagneront leur admiration.
      de: |-
        Männliche Golking tanzen in Flussbetten, um die
        weiblichen Exemplare zu beeindrucken, die sich
        dann um den allerbesten Tänzer scharen.
      es: |-
        Los machos ejecutan una coreografía en el
        lecho del río para ganarse la atención de las
        hembras, que acuden al mejor bailarín.
      it: |-
        I maschi danzano sul letto dei fiumi cercando
        di attirare l’attenzione delle femmine, che si
        radunano attorno al miglior danzatore.
    lets-go-pikachu:
      ja-Hrkt: |-
        あたまのツノで　かわぞこにある
        いわを　くりぬき　すを　つくるのは
        オスの　やくめ　だ。
      ja: |-
        頭のツノで　川底にある
        岩を　くり抜き　巣を　作るのは
        オスの　役目　だ。
      ko: |-
        머리의 뿔로 강바닥에 있는
        돌을 파내어 둥지를 만드는 것은
        수컷의 역할이다.
      zh-Hant: |-
        雄性金魚王的職責是
        用頭上的角挖穿河底的
        石頭來建造巢穴。
      zh-Hans: |-
        雄性的职责是
        用头上的角打穿
        河里的石头筑巢。
      en: |-
        It is the male’s job to make a nest by carving out
        boulders in a stream using the horn on its head.
      fr: |-
        Le mâle utilise la corne située sur son front
        pour creuser un nid dans les rochers au fond
        des rivières.
      de: |-
        Männliche Exemplare dieses Pokémon höhlen
        mit dem Horn an ihrem Kopf Steine im Flussbett
        aus, um sich so ein Nest zu bauen.
      es: |-
        Los machos usan el cuerno de la cabeza para
        horadar rocas en el lecho del río y construir allí
        su nido.
      it: |-
        Il maschio di Seaking usa il corno che ha
        sulla testa per scavare il nido nelle rocce
        che si trovano sul letto dei fiumi.
    lets-go-eevee:
      ja-Hrkt: |-
        あたまのツノで　かわぞこにある
        いわを　くりぬき　すを　つくるのは
        オスの　やくめ　だ。
      ja: |-
        頭のツノで　川底にある
        岩を　くり抜き　巣を　作るのは
        オスの　役目　だ。
      ko: |-
        머리의 뿔로 강바닥에 있는
        돌을 파내어 둥지를 만드는 것은
        수컷의 역할이다.
      zh-Hant: |-
        雄性金魚王的職責是
        用頭上的角挖穿河底的
        石頭來建造巢穴。
      zh-Hans: |-
        雄性的职责是
        用头上的角打穿
        河里的石头筑巢。
      en: |-
        It is the male’s job to make a nest by carving out
        boulders in a stream using the horn on its head.
      fr: |-
        Le mâle utilise la corne située sur son front
        pour creuser un nid dans les rochers au fond
        des rivières.
      de: |-
        Männliche Exemplare dieses Pokémon höhlen
        mit dem Horn an ihrem Kopf Steine im Flussbett
        aus, um sich so ein Nest zu bauen.
      es: |-
        Los machos usan el cuerno de la cabeza para
        horadar rocas en el lecho del río y construir allí
        su nido.
      it: |-
        Il maschio di Seaking usa il corno che ha
        sulla testa per scavare il nido nelle rocce
        che si trovano sul letto dei fiumi.
    sword:
      ja-Hrkt: |-
        あきになると　プロポーズのため
        からだに　あぶらが　のってきて
        とても　きれいないろに　へんかする。
      ja: |-
        秋になると　プロポーズのため
        体に　脂が　のってきて
        とても　きれいな色に　変化する。
      ko: |-
        가을이 되면 짝짓기를 위해
        몸에 윤기가 돌게 되며
        매우 아름다운 색으로 변화한다.
      zh-Hant: |-
        到了秋天，體內的脂肪
        會因為要求偶而增加，
        體色也會變得非常漂亮。
      zh-Hans: |-
        到了秋天，体内的脂肪
        会因为要去求偶而增加，
        颜色也会变得非常漂亮。
      en: |-
        In autumn, its body becomes more fatty in
        preparing to propose to a mate. It takes on
        beautiful colors.
      fr: |-
        En automne, à la saison des amours, il fait
        des réserves de graisse et arbore des couleurs
        chatoyantes.
      de: |-
        Im Herbst legt es an Gewicht zu und erscheint
        in prächtigen Farben, um so einen Partner
        anzulocken.
      es: |-
        En otoño gana algo de peso para atraer a
        posibles parejas y se cubre de llamativos colores.
      it: |-
        In autunno ingrassa in previsione della stagione
        degli amori e assume colori sgargianti.
    shield:
      ja-Hrkt: |-
        ツノで　かわぞこの　いわを　くりぬき
        すをつくるのは　うみつけた　タマゴが
        ながされないように　するためだ。
      ja: |-
        ツノで　川底の　岩を　くりぬき
        巣をつくるのは　産みつけた　タマゴが
        流されないように　するためだ。
      ko: |-
        뿔로 강바닥의 바위를 파헤쳐
        둥지를 만드는 이유는 낳은 알이
        떠내려가지 않도록 하기 위함이다.
      zh-Hant: |-
        金魚王之所以會用角挖穿
        河底的岩石來築巢，是為了
        防止產下的卵被水流沖走。
      zh-Hans: |-
        金鱼王之所以会用角挖穿
        河底的岩石来筑巢，是为了
        防止产下的卵被水流冲走。
      en: |-
        Using its horn, it bores holes in riverbed
        boulders, making nests to prevent its eggs from
        washing away.
      fr: |-
        S’il fait des trous dans les rochers avec sa corne
        pour bâtir son nid, c’est pour éviter que ses Œufs
        ne soient emportés par les flots.
