hoopa:
  base_happiness: 100
  capture_rate: 3
  color: purple
  egg_groups:
    - no-eggs
  evolution_chain: hoopa
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        くうかんを　ゆがめる　リングで
        あらゆる　ものを　はなれた　ばしょへ
        とばしてしまう　トラブルメーカー。
      ja: |-
        空間を　ゆがめる　リングで
        あらゆる　ものを　離れた　場所へ
        飛ばしてしまう　トラブルメーカー。
      ko: |-
        공간을 뒤트는 링으로
        모든 것을 멀리 떨어진 곳으로
        날려버리고 마는 트러블메이커다.
      en: |-
        This troublemaker sends anything
        and everything to faraway places
        using its loop, which can warp space.
      fr: |-
        Ce fauteur de troubles est doté d’anneaux qui
        déforment l’espace et lui permettent d’expédier
        au loin n’importe quel objet.
      de: |-
        Mittels seiner Ringe, die Raumkrümmungen
        verursachen, verfrachtet dieser Unruhestifter
        alles und jeden an die entlegensten Orte.
      es: |-
        Este problemático Pokémon envía cualquier objeto a
        lugares remotos mediante unos anillos que deforman
        el espacio.
      it: |-
        È un gran combinaguai e spedisce lontano
        tutto ciò che gli capita a tiro grazie ai suoi anelli
        in grado di piegare lo spazio.
    'y':
      ja-Hrkt: |-
        きにいった　ものを　リングを　つかい
        ひみつの　すみかへ　あつめている。
        リングを　くぐって　テレポートする。
      ja: |-
        気に入った　ものを　リングを　使い
        秘密の　住処へ　集めている。
        リングを　潜って　テレポートする。
      ko: |-
        마음에 든 것을 링을 사용해
        비밀의 거처에 모으고 있다.
        링을 통해 순간이동한다.
      en: |-
        It gathers things it likes and passes them through
        its loop to teleport them to a secret place.
      fr: |-
        Il a la faculté de téléporter les choses en les faisant
        passer au travers de ses anneaux. Il envoie les objets
        qui lui plaisent dans une cachette connue de lui seul.
      de: |-
        Mithilfe seiner Ringe hortet es Dinge, die ihm gefallen,
        an einem geheimen Ort. Es teleportiert diese, indem es
        sie durch seine Ringe bewegt.
      es: |-
        Reúne los objetos que le atraen para esconderlos
        en una guarida secreta, teletransportándolos a
        través de sus anillos.
      it: |-
        Usa i suoi anelli per intrappolare qualunque cosa
        gli piaccia e teletrasportarla in un luogo segreto.
    omega-ruby:
      ja-Hrkt: |-
        しんのすがたは　きょだいな　ちからを　もっている。
        ざいほう　ほしさに　それが　かくされた　しろ　ごと
        ひきぬき　うばいさった　という　でんせつが　ある。
      ja: |-
        真の姿は　巨大な　力を　持っている。
        財宝　欲しさに　それが　隠された　城ごと
        引き抜き　奪い去った　という　伝説が　ある。
      ko: |-
        진정한 모습일 때는 거대한 힘을 가지고 있다.
        원하는 재물을 손에 넣기 위해 그것이 숨겨진
        성을 통째로 빼돌려 사라졌다는 전설이 있다.
      en: |-
        In its true form, it possess a huge amount of power.
        Legends of its avarice tell how it once carried off
        an entire castle to gain the treasure hidden within.
      fr: |-
        Il possède une puissance considérable sous son apparence
        véritable. Une légende raconte qu’il désirait si fort un trésor
        caché dans un château qu’il déroba l’édifice tout entier.
      de: |-
        In seiner wahren Gestalt verfügt es über enorme Kräfte.
        Legenden zufolge hat es einst ein ganzes Schloss gestohlen,
        weil es den darin versteckten Schatz für sich haben wollte.
      es: |-
        En su forma original, este Pokémon posee una fuerza
        descomunal. Una leyenda cuenta que una vez robó un tesoro
        del interior de una fortaleza.
      it: |-
        Quando assume la sua vera forma, acquisisce un’energia
        straordinaria. Secondo la leggenda, è talmente bramoso di
        gioielli che può rubare un castello intero per impossessarsi
        dei suoi tesori.
    alpha-sapphire:
      ja-Hrkt: |-
        ６つの　リングと　６つの　きょだいな　うで　で
        あらゆるものを　うばうと　いわれる。ちからを
        ふうじられ　ちいさな　すがたに　かえられた。
      ja: |-
        ６つの　リングと　６つの　巨大な腕で
        あらゆるものを　奪うと　いわれる。
        力を　封じられ　小さな姿に　変えられた。
      ko: |-
        6개의 링과 6개의 거대한 팔로
        수많은 것들을 빼앗는다고 전해진다. 
        힘이 봉인되어 작은 모습으로 변했다.
      en: |-
        It is said to be able to seize anything it desires
        with its six rings and six huge arms. With its power
        sealed, it is transformed into a much smaller form.
      fr: |-
        On raconte que grâce à ses six anneaux et ses six énormes
        bras, il est capable de dérober tout ce qui lui plaît.
        Mais son pouvoir a été scellé, et il a été réduit à l’état
        d’un être minuscule.
      de: |-
        Mit seinen sechs Ringen und seinen sechs riesigen Armen
        kann es alles an sich reißen, was es möchte. Wenn seine
        Kraft versiegelt wird, nimmt es jedoch eine kleinere Gestalt an.
      es: |-
        Dicen que gracias a sus seis anillos y seis enormes brazos
        puede robar todo lo que se le antoja.
        Adquirió una forma reducida cuando alguien selló su poder.
      it: |-
        Si dice che possa rubare tutto ciò che vuole grazie
        ai suoi sei anelli e alle sue sei enormi braccia.
        La sua potenza è stata sigillata, riducendo di molto
        le sue dimensioni effettive.
