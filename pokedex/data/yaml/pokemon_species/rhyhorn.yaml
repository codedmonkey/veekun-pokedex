    x:
      ja-Hrkt: |-
        あたまは　わるいが　ちからが　つよく
        こうそうビルも　たいあたりで
        コナゴナに　ふんさいする。
      ja: |-
        頭は　悪いが　力が　強く
        高層ビルも　体当たりで
        コナゴナに　粉砕する。
      ko: |-
        머리는 나쁘지만 힘이 세서
        고층 빌딩도 몸통박치기로
        산산조각 낸다.
      en: |-
        Strong, but not too bright, this Pokémon can
        shatter even a skyscraper with its charging Tackles.
      fr: |-
        Costaud mais pas très intelligent, ce Pokémon est
        capable de détruire un immeuble entier en utilisant
        sa Charge.
      de: |-
        Stark, aber nicht allzu klug, kann dieses Pokémon
        sogar Hochhäuser mit seinem Tackle-Angriff zum
        Einsturz bringen.
      es: |-
        Es muy fuerte, pero no especialmente listo. Es capaz
        de derribar rascacielos usando Placaje varias veces.
      it: |-
        Potente, benché non particolarmente brillante, con
        Azione può distruggere anche un grattacielo.
    'y':
      ja-Hrkt: |-
        ４ほんの　あしは　みじかくて
        うまく　まがれない。ただひたすらに
        とっしん　するだけだ。
      ja: |-
        ４本の　脚は　短くて
        うまく　曲がれない。ただひたすらに
        突進するだけだ。
      ko: |-
        4개의 다리는 짧아서
        잘 굽혀지지 않는다. 단지 한결같이
        돌진할 뿐이다.
      en: |-
        It is inept at turning because of its four short legs.
        It can only charge and run in one direction.
      fr: |-
        Ses petites jambes ne lui permettent pas de tourner
        facilement. Il ne peut charger que tout droit.
      de: |-
        Aufgrund seiner kurzen Beine kann es sich nicht
        umdrehen. Es kann immer nur in eine Richtung laufen.
      es: |-
        Es un poco torpe al girar debido a sus cuatro cortas
        patas. Solo puede atacar y correr en una dirección.
      it: |-
        Le quattro piccole zampe gli impediscono di voltarsi.
        Così corre e attacca in una sola direzione.
    omega-ruby:
      ja-Hrkt: |-
        ひたすら　まっすぐ　つきすすみ　こわしまくる。
        こうてつの　かたまりに　ぶつかっても　へいきだが
        １にち　たつと　ちょっと　いたみを　かんじる。
      ja: |-
        ひたすら　真っ直ぐ　突き進み　壊しまくる。
        鋼鉄の　塊に　ぶつかっても　平気だが
        １日　経つと　ちょっと　痛みを　感じる。
      ko: |-
        오로지 곧장 돌진하여 부순다.
        강철 덩어리에 부딪혀도 멀쩡하지만
        하루가 지나면 아픔을 조금 느낀다.
      en: |-
        Rhyhorn runs in a straight line, smashing everything in its path.
        It is not bothered even if it rushes headlong into a block of
        steel. This Pokémon may feel some pain from the collision the
        next day, however.
      fr: |-
        Rhinocorne charge droit devant lui, détruisant tout sur
        son passage. Il ne s’arrête jamais, même lorsqu’il charge
        un bloc d’acier. Malgré tout, il sent la douleur le lendemain.
      de: |-
        Rihorn läuft immer geradeaus und zerstampft alles, was ihm
        in die Quere kommt. Es macht ihm auch nichts aus, wenn es
        mit dem Kopf voran gegen einen Stahlklotz rennt. Am nächsten
        Tag allerdings könnte es Schmerzen haben.
      es: |-
        Rhyhorn corre en línea recta arrasando todo lo que encuentra
        en su camino. Aun estrellándose de cabeza contra un bloque
        de acero, no se vería afectado; a lo sumo, notaría algo de
        dolor al día siguiente.
      it: |-
        Rhyhorn corre diritto per la sua strada fracassando tutto ciò
        che trova. Non si scompone nemmeno scontrandosi con un
        blocco d’acciaio. Tuttavia, il giorno seguente può accusare
        qualche dolore.
    alpha-sapphire:
      ja-Hrkt: |-
        はしっているうちに　もくてきを　わすれるほど
        のうみそが　ちいさく　あたまが　わるいぞ。
        なにかを　こわすと　たまに　おもいだすらしい。
      ja: |-
        走っているうちに　目的を　忘れるほど
        脳みそが　小さく　頭が　悪いぞ。
        なにかを　壊すと　たまに　思い出すらしい。
      ko: |-
        달리고 있다가 목적을 잊을 정도로
        뇌가 작고 머리가 나쁘다.
        뭔가를 부수면 가끔 기억해내는 것 같다.
      en: |-
        Rhyhorn’s brain is very small. It is so dense, while on a run
        it forgets why it started running in the first place. It apparently
        remembers sometimes if it demolishes something.
      fr: |-
        Le cerveau de Rhinocorne est tout petit, à tel point que
        lorsqu’il attaque, il lui arrive d’oublier pourquoi il a commencé
        à charger. Il lui arrive de se souvenir qu’il a démoli certaines
        choses.
      de: |-
        Rihorns Hirn ist sehr klein. Es ist so beschränkt,
        dass es während des Laufens vergisst, warum es
        überhaupt losgelaufen ist. Manchmal erinnert es
        sich aber daran, dass es etwas zerstört hat.
      es: |-
        Rhyhorn tiene un cerebro muy pequeño. Si se pone a correr,
        por ejemplo, se le olvida qué le llevó a hacerlo. Lo que sí
        parece recordar, a veces, es si ha destrozado alguna cosa.
      it: |-
        Il cervello di Rhyhorn è così piccolo che durante la corsa
        il Pokémon non riesce neanche a ricordare dov’era diretto.
        A volte gli capita di ricordare di aver distrutto qualcosa.
    lets-go-pikachu:
      ja-Hrkt: |-
        たんさいぼうで　ひとつの　ことしか
        かんがえられない。とっしんを
        はじめると　ねむるまで　とまらない。
      ja: |-
        単細胞で　一つの　ことしか
        考えられない。突進を
        始めると　眠るまで　止まらない。
      ko: |-
        단순해서 한가지 생각밖에
        하지 못한다. 돌진을 시작하면
        잠들 때까지 멈추지 않는다.
      zh-Hant: |-
        頭腦簡單，一次只能思考
        一件事。一旦牠開始猛衝，
        在睡著之前都不會停下來。
      zh-Hans: |-
        单细胞的脑子只能思考
        一件事情。一旦它开始猛撞，
        直到睡着前都不会停止。
      en: |-
        A Pokémon with a one-track mind. Once it
        charges, it won’t stop running until it falls asleep.
      fr: |-
        Un Pokémon obstiné. S’il se met à charger,
        il s’arrête uniquement quand il s’endort.
      de: |-
        Rihorn ist sehr einfach gestrickt und kann nur
        eingleisig denken. Stürmt es einmal los, hört es
        erst auf zu laufen, wenn es ermattet einschläft.
      es: |-
        Es algo simple y testarudo, y solo tiene una cosa
        en la cabeza. Si carga contra algo, no se detiene
        hasta caer rendido.
      it: |-
        Ha una mente molto semplice e riesce a
        concentrarsi solo su una cosa alla volta. Quando
        parte alla carica, si ferma solo se si addormenta.
    lets-go-eevee:
      ja-Hrkt: |-
        たんさいぼうで　ひとつの　ことしか
