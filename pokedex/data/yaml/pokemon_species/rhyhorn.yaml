    sword:
      ja-Hrkt: |-
        あたまは　わるいが　ちからが　つよく
        こうそうビルも　たいあたりで
        コナゴナに　ふんさいする。
      ja: |-
        頭は　悪いが　力が　強く
        高層ビルも　体当たりで
        コナゴナに　粉砕する。
      ko: |-
        머리는 나쁘지만 힘이 세서
        고층 빌딩도 몸통박치기로
        산산조각 낸다.
      zh-Hant: |-
        頭腦很差但力氣很大，
        只要撞擊就能把
        高樓大廈撞得粉粹。
      zh-Hans: |-
        虽然头脑很差但力气很大，
        可以用撞击把高楼大厦撞得粉粹。
      en: |-
        Strong, but not too bright, this Pokémon can
        shatter even a skyscraper with its charging tackles.
      fr: |-
        Costaud, mais pas très intelligent, ce Pokémon
        est capable de détruire un immeuble entier
        en fonçant dessus.
      de: |-
        Dieses Pokémon ist zwar nicht besonders klug,
        aber dafür so stark, dass es durch Rammen sogar
        Hochhäuser zum Einsturz bringen kann.
      es: |-
        Su inteligencia es limitada, aunque posee una
        fuerza tan considerable que le permite incluso
        derribar rascacielos con solo embestirlos.
      it: |-
        È molto forte, benché non particolarmente
        brillante. Se si scaglia contro un grattacielo
        può raderlo al suolo.
    shield:
      ja-Hrkt: |-
        ひとつの　ことしか　おぼえられない。
        とっしんを　はじめると　りゆうは
        どうでもよくなり　すぐに　わすれる。
      ja: |-
        ひとつの　ことしか　覚えられない。
        突進を　はじめると　理由は
        どうでもよくなり　すぐに　忘れる。
      ko: |-
        한 가지만 기억할 수 있다.
        돌진하기 시작하면 이유가
        무엇이었든 금방 잊어버린다.
      zh-Hant: |-
        腦子裡只能記住一件事。
        一旦開始猛衝，不管理由是什麼
        都會很快感到無所謂而忘掉。
      zh-Hans: |-
        脑子里只能记住一件事。
        一旦开始猛冲，不管理由是什么
        都会很快感到无所谓而忘掉。
      en: |-
        It can remember only one thing at a time. Once it
        starts rushing, it forgets why it started.
      fr: |-
        Il ne peut se souvenir que d’une chose à la fois.
        S’il se met à courir, il en oublie tout de suite
        la raison.
      de: |-
        Es kann sich immer nur eine Sache merken.
        Sobald es losgestürmt ist, vergisst es
        augenblicklich den Auslöser dafür.
      es: |-
        La cabeza no le da para retener más de una cosa.
        Si se pone a correr, se le olvida al instante por
        qué empezó a hacerlo.
      it: |-
        Non è in grado di ricordare più di una cosa
        alla volta. Quando parte alla carica
        ne dimentica subito il motivo.
