    black-2:
      en: |-
        As a newborn, it can barely stand.
        However, through galloping, its
        legs are made tougher and faster.
    white-2:
      en: |-
        As a newborn, it can barely stand.
        However, through galloping, its
        legs are made tougher and faster.
    x:
      ja-Hrkt: |-
        うまれたばかりでは　たつのがやっと。
        だが　はしるほどに　あしこしは
        きたえられて　そくどが　ましていく。
      ja: |-
        生まれたばかりでは　立つのがやっと。
        だが　走るほどに　足腰は
        鍛えられて　速度が　増していく。
      ko: |-
        막 태어나서는 겨우 일어설 수 있을
        정도이지만 많이 달리면 하반신이
        단련되어 달리는 속도가 빨라진다.
      en: |-
        As a newborn, it can barely stand.
        However, through galloping, its
        legs are made tougher and faster.
      fr: |-
        Chancelantes à la naissance, ses pattes deviennent
        très vite sûres et solides à force de galoper.
      de: |-
        Neugeboren kann es kaum stehen. Durch das
        Galoppieren werden seine Beine aber schneller
        und kräftiger.
      es: |-
        Cuando nace, apenas puede tenerse en pie. Pero va
        fortaleciendo las patas en cuanto empieza a galopar.
      it: |-
        Alla nascita non riesce quasi a reggersi in piedi.
        Galoppando si rinforza e diventa più veloce.
    'y':
      ja-Hrkt: |-
        おやの　あとを　おいかけるうちに
        きょうじんな　あしこしに　なる。
        １にちじゅう　のやまを　かけまわる。
      ja: |-
        親の　あとを　追いかけるうちに
        強靭な　足腰になる。
        １日中　野山を　駆け回る。
      ko: |-
        부모의 뒤를 쫓아다니는 동안
        다리가 강인해진다.
        온종일 산과 들을 뛰어다닌다.
      en: |-
        Its legs grow strong while it chases after its parent.
        It runs in fields and mountains all day.
      fr: |-
        Il muscle ses pattes en suivant ses parents. Il arpente
        les plaines et les montagnes toute la journée.
      de: |-
        Seine Beine werden kräftig, da es seinen Eltern
        hinterherläuft. Es rennt den ganzen Tag umher.
      es: |-
        Fortalece las patas mientras sigue a sus padres. Corre
        en el campo y en la montaña todo el día.
      it: |-
        Si rafforza le zampe rincorrendo i suoi genitori.
        Corre tutto il giorno per campi e monti.
    omega-ruby:
      ja-Hrkt: |-
        うまれて　すぐは　たちあがるのも　やっとだが
        ころびながら　おやの　あとを　おいかけている
        うちに　じょうぶな　あしこしに　そだつのだ。
      ja: |-
        生まれて　すぐは　立ちあがるのも　やっとだが
        転びながら　親の　後を　追いかけている
        うちに　丈夫な　足腰に　育つのだ。
      ko: |-
        막 태어나서는 겨우 설 수 있는 정도지만
        넘어지면서 부모의 뒤를 쫓아다니는
        동안 하반신이 튼튼하게 자라난다.
      en: |-
        Ponyta is very weak at birth. It can barely stand up.
        This Pokémon becomes stronger by stumbling and falling to
        keep up with its parent.
      fr: |-
        À sa naissance, Ponyta est très faible. Il peut à peine tenir
        debout. Ce Pokémon se muscle en trébuchant et en tombant,
        lorsqu’il essaie de suivre ses parents.
      de: |-
        Nach seiner Geburt ist Ponita so schwach, dass es kaum von
        alleine aufstehen kann. Dieses Pokémon wird dadurch schnell
        stärker, dass es sich beim Versuch, mit seinen Eltern Schritt
        zu halten, immer wieder aufrappeln muss.
      es: |-
        Al nacer, Ponyta es muy débil y apenas puede ponerse en pie.
        Con todo, se va haciendo más fuerte al tropezarse y caerse
        en su intento por seguir a sus progenitores.
      it: |-
        Ponyta è molto debole alla nascita e riesce a malapena
        a reggersi in piedi. Poi si rinforza a furia di inciampare
        e cadere, cercando di tenere il passo dei suoi genitori.
    alpha-sapphire:
      ja-Hrkt: |-
        うまれて　すぐは　たちあがるのも　やっとだが
        ころびながら　おやの　あとを　おいかけている
        うちに　じょうぶな　あしこしに　そだつのだ。
      ja: |-
        生まれて　すぐは　立ちあがるのも　やっとだが
        転びながら　親の　後を　追いかけている
        うちに　丈夫な　足腰に　育つのだ。
      ko: |-
        막 태어나서는 겨우 설 수 있는 정도지만
        넘어지면서 부모의 뒤를 쫓아다니는
        동안 하반신이 튼튼하게 자라난다.
      en: |-
        Ponyta is very weak at birth. It can barely stand up.
        This Pokémon becomes stronger by stumbling and
        falling to keep up with its parent.
      fr: |-
        À sa naissance, Ponyta est très faible. Il peut à peine tenir
        debout. Ce Pokémon se muscle en trébuchant et en tombant,
        lorsqu’il essaie de suivre ses parents.
      de: |-
        Nach seiner Geburt ist Ponita sehr schwach. Es braucht sehr
        lange, bis es auf allen Vieren steht. Dieses Pokémon wird
        stärker, da es bei dem Versuch, mit seinen Eltern Schritt zu
        halten, immer wieder stolpert und hinfällt.
      es: |-
        Al nacer, Ponyta es muy débil y apenas puede ponerse en pie.
        Con todo, se va haciendo más fuerte al tropezarse y caerse
        en su intento por seguir a sus progenitores.
      it: |-
        Ponyta è molto debole alla nascita e riesce a malapena
        a reggersi in piedi. Poi si rinforza a furia di inciampare
        e cadere, cercando di tenere il passo dei suoi genitori.
    lets-go-pikachu:
      ja-Hrkt: |-
        ものすごい　ジャンプの　あとの
        ちゃくちの　しょうげきは　ヒヅメと
        あしの　きんにくで　やわらげる。
      ja: |-
        ものすごい　ジャンプの　後の
        着地の　衝撃は　ヒヅメと
        脚の　筋肉で　やわらげる。
      ko: |-
        엄청난 점프 뒤에 오는
        착지의 충격은 발굽과
        다리의 근육으로 완화한다.
      zh-Hant: |-
        在高高跳起之後，
        會用四蹄和腿上的肌肉
        來緩和落地時的衝擊。
      zh-Hans: |-
        在用力跳跃之后，会
        用蹄子和脚上的肌肉
        来缓解着地时的撞击。
      en: |-
        Capable of jumping incredibly high.
        Its hooves and sturdy legs absorb
        the impact of a hard landing.
      fr: |-
        Il est capable de sauter très haut.
        Ses sabots et ses jambes peuvent amortir
        l’impact de l’atterrissage.
      de: |-
        Es kann unglaublich hoch springen. Die Wucht
        der Landung absorbiert es mit seinen robusten
        Hufen und Beinen.
      es: |-
        Es capaz de saltar muy alto. Absorbe el impacto
        del aterrizaje con sus robustas patas y pezuñas.
      it: |-
        È capace di salti altissimi. Quando tocca
        terra, attutisce l’impatto grazie agli zoccoli
        e alle zampe muscolose.
    lets-go-eevee:
      ja-Hrkt: |-
