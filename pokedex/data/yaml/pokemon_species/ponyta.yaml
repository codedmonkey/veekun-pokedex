    sword:
      ja-Hrkt: |-
        うまれたばかりは　はしるのが　へた。
        なかまと　かけっこを　するうちに
        あしこしが　つよく　そだっていく。
      ja: |-
        生まれたばかりは　走るのが　へた。
        仲間と　かけっこを　するうちに
        足腰が　強く　育っていく。
      ko: |-
        갓 태어났을 때는 달리는 것이 서툴다.
        동료와 달리기 경주를 하는 사이에
        하반신이 튼튼하게 성장한다.
      zh-Hant: |-
        剛出生的時候不擅長奔跑，
        但隨著和夥伴們不斷地賽跑，
        會逐漸鍛鍊出強健的腳力。
      zh-Hans: |-
        刚出生的时候不擅长奔跑，
        但随着和伙伴们不断地赛跑，
        会逐渐锻炼出强健的脚力。
      en: |-
        It can’t run properly when it’s newly born.
        As it races around with others of its kind,
        its legs grow stronger.
      fr: |-
        À la naissance, il ne court pas très vite.
        C’est en faisant la course avec ses camarades
        qu’il se muscle les jambes.
      de: |-
        Nach der Geburt fällt ihm das Laufen schwer.
        Die Wettrennen, die es sich mit seinen Freunden
        liefert, stärken jedoch seine Beinmuskulatur.
      es: |-
        Al nacer es un poco lento, pero va fortaleciendo
        las patas paulatinamente al disputar carreras con
        sus congéneres.
      it: |-
        Appena nato non è un buon corridore, ma col
        tempo irrobustisce le sue zampe rincorrendo
        i suoi simili.
    shield:
      ja-Hrkt: |-
        ポニータに　みとめられると
        もえる　たてがみに　さわっても
        ふしぎと　あつくなくなるのだ。
      ja: |-
        ポニータに　認められると
        燃える　たてがみに　触っても
        不思議と　熱くなくなるのだ。
      ko: |-
        포니타에게 인정받으면
        타오르는 갈기를 만져도
        뜨거움을 느끼지 않게 된다.
      zh-Hant: |-
        得到了小火馬認可的人，
        在觸摸牠燃燒著的鬃毛時
        不會覺得燙手，真是不可思議。
      zh-Hans: |-
        得到了小火马认可的人，
        在触摸它燃烧着的鬃毛时
        不会觉得烫手，真是不可思议。
      en: |-
        If you’ve been accepted by Ponyta, its burning
        mane is mysteriously no longer hot to the touch.
      fr: |-
        Il semblerait qu’une fois qu’un Dresseur a gagné
        la confiance de Ponyta, sa crinière enflammée
        ne le brûle plus au toucher.
      de: |-
        Hat man erst einmal das Vertrauen eines Ponitas
        gewonnen, kann man seltsamerweise sogar seine
        feurige Mähne anfassen, ohne sich zu verbrennen.
      es: |-
        Por extraño que parezca, una vez que alguien
        se ha hecho merecedor de su confianza, puede
        tocarle la ardiente crin sin quemarse.
      it: |-
        Una volta conquistata la fiducia di Ponyta,
        è possibile toccare la sua criniera infuocata
        senza scottarsi.
