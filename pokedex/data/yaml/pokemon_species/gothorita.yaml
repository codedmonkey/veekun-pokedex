gothorita:
  base_happiness: 50
  capture_rate: 100
  color: purple
  egg_groups:
    - humanshape
  evolution_chain: gothita
  evolves_from: gothita
  flavor_text:
    black:
      en: |-
        They use hypnosis to control people and
        Pokémon. Tales of Gothorita leading
        people astray are told in every corner.
      fr: |-
        Hypnotise les Pokémon et les gens. Il y a
        de nombreuses légendes de gens enlevés
        dans leur sommeil par des Mesmérella.
    white:
      en: |-
        Starlight is the source of their power.
        At night, they mark star positions by
        using psychic power to float stones.
      fr: |-
        Tire son énergie de la lumière des
        étoiles et marque leur position en
        faisant léviter des pierres la nuit.
    black-2:
      en: |-
        According to many old tales, it creates
        friends for itself by controlling
        sleeping children on starry nights.
    white-2:
      en: |-
        According to many old tales, it creates
        friends for itself by controlling
        sleeping children on starry nights.
    x:
      ja-Hrkt: |-
        ほしあかりが　パワーの　みなもと。
        よるになると　サイコパワーで　いしを
        うかべて　ほしの　はいちを　しるす。
      ja: |-
        星明りが　パワーの　源。
        夜になると　サイコパワーで　石を
        浮かべて　星の　配置を　印す。
      ko: |-
        별빛이 힘의 원천이다.
        밤이 되면 사이코 파워로 돌을
        띄워 별의 배치를 표시한다.
      en: |-
        Starlight is the source of their power. At night,
        they mark star positions by using psychic power
        to float stones.
      fr: |-
        Tire son énergie de la lumière des étoiles et marque
        leur position en faisant léviter des pierres la nuit.
      de: |-
        Zieht seine Energie aus dem Sternenlicht.
        Bei Nacht bringt es Steine zum Schweben
        und bildet damit Sternzeichen nach.
      es: |-
        La luz de las estrellas origina su poder. De noche,
        marca su posición haciendo levitar piedras con su
        poder psíquico.
      it: |-
        Trae energia dalla luce delle stelle. Ne traccia la
        posizione facendo levitare le pietre con i poteri
        psichici.
    'y':
      ja-Hrkt: |-
        ほしあかりが　かがやく　よるに
        ねている　こどもたちを　あやつって
        あそぶ　はなしが　おおく　のこる。
      ja: |-
        星明かりが　輝く　夜に
        寝ている　子供たちを　操って
        遊ぶ　話が　多く　残る。
      ko: |-
        별빛이 빛나는 밤에
        잠자는 아이들을 조종해서
        논다는 이야기가 많이 남아 있다.
      en: |-
        According to many old tales, it creates friends for
        itself by controlling sleeping children on
        starry nights.
      fr: |-
        On dit qu’ils apparaissent les nuits étoilées et
        manipulent les enfants pour jouer avec eux.
      de: |-
        Erzählungen zufolge machen sie sich einen Spaß
        daraus, in sternklaren Nächten von schlafenden
        Kindern Besitz zu ergreifen.
      es: |-
        Según muchas leyendas, durante las noches
        estrelladas controlan a los niños que duermen,
        tan solo como diversión.
      it: |-
        Si racconta che nelle notti stellate, per giocare con
        i bambini addormentati, si diverta a muoverli come
        pupazzi.
    omega-ruby:
      ja-Hrkt: |-
        ほしあかりが　パワーの　みなもと。
        よるになると　サイコパワーで　いしを
        うかべて　ほしの　はいちを　しるす。
      ja: |-
        星明りが　パワーの　源。
        夜になると　サイコパワーで　石を
        浮かべて　星の　配置を　印す。
      ko: |-
        별빛이 힘의 원천이다.
        밤이 되면 사이코 파워로 돌을
        띄워 별의 배치를 표시한다.
      en: |-
        Starlight is the source of their power. At night,
        they mark star positions by using psychic power
        to float stones.
      fr: |-
        Tire son énergie de la lumière des étoiles et marque
        leur position en faisant léviter des pierres la nuit.
      de: |-
        Zieht seine Energie aus dem Sternenlicht. Bei Nacht bringt es
        Steine zum Schweben und bildet damit Sternzeichen nach.
      es: |-
        La luz de las estrellas origina su poder. De noche, marca su
        posición haciendo levitar piedras con su poder psíquico.
      it: |-
        Trae energia dalla luce delle stelle. Ne traccia la posizione
        facendo levitare le pietre con i poteri psichici.
    alpha-sapphire:
      ja-Hrkt: |-
        ほしあかりが　かがやく　よるに
        ねている　こどもたちを　あやつって
        あそぶ　はなしが　おおく　のこる。
      ja: |-
        星明かりが　輝く　夜に
        寝ている　子供たちを　操って
        遊ぶ　話が　多く　残る。
      ko: |-
        별빛이 빛나는 밤에
        잠자는 아이들을 조종해서
        논다는 이야기가 많이 남아 있다.
      en: |-
        According to many old tales, it creates friends for
        itself by controlling sleeping children on
        starry nights.
      fr: |-
        On dit qu’ils apparaissent les nuits étoilées et manipulent
        les enfants pour jouer avec eux.
      de: |-
        Erzählungen zufolge machen sie sich einen Spaß daraus,
        in sternklaren Nächten von schlafenden Kindern Besitz
        zu ergreifen.
      es: |-
        Según muchas leyendas, durante las noches estrelladas
        controlan a los niños que duermen, tan solo como diversión.
      it: |-
        Si racconta che nelle notti stellate, per giocare con i bambini
        addormentati, si diverta a muoverli come pupazzi.
    sword:
      ja-Hrkt: |-
        ほしが　かがやく　よるに　ねむった
        こどもたちを　つれさると　いわれ
        せいさいのまじょ　とも　よばれる。
      ja: |-
        星が　輝く　夜に　眠った
        子どもたちを　連れ去ると　言われ
        制裁の魔女　とも　呼ばれる。
      ko: |-
        별이 빛나는 밤에 잠이 든
        아이들을 데려간다고 전해져
        심판의 마녀라고도 불린다.
      zh-Hant: |-
        據說會在星光閃耀的夜裡
        把睡著的孩子們帶走。
        也有人稱牠為制裁魔女。
      zh-Hans: |-
        据说会在星光闪耀的夜晚
        把睡着的孩子们带走。
        也有人称它为惩罚魔女。
      en: |-
        It’s said that when stars shine in the night sky,
        this Pokémon will spirit away sleeping children.
        Some call it the Witch of Punishment.
      fr: |-
        On raconte qu’il enlève les enfants endormis
        pendant les nuits étoilées. Cela lui vaut
        d’être considéré comme un démon punisseur.
      de: |-
        In sternklaren Nächten entführt es angeblich
        schlafende Kinder aus ihren Betten. Man nennt
        es auch die „Hexe der Bestrafung“.
      es: |-
        Corre el rumor de que en las noches estrelladas
        se lleva consigo a los niños dormidos, por lo que
        recibe el sobrenombre de Bruja Castigadora.
      it: |-
        Si dice che nelle notti stellate porti via con sé
        i bambini addormentati. Per questo è chiamato
        anche “strega del castigo”.
    shield:
      ja-Hrkt: |-
        ほしの　かがやく　ばんに　もっとも
        サイコパワーが　たかまるらしい。
        うちゅうとの　かんけいは　ふめい。
      ja: |-
        星の　輝く　晩に　もっとも
        サイコパワーが　高まるらしい。
        宇宙との　関係は　不明。
      ko: |-
        별이 빛나는 밤에 가장
        사이코 파워가 높아지는 듯하다.
        우주와의 관계는 불명확하다.
      zh-Hant: |-
        哥德小童的精神力量似乎會
        在星光閃耀的夜晚達到最高點。
        牠與宇宙的關係至今不明。
      zh-Hans: |-
        哥德小童的精神力量似乎会
        在星光闪耀的夜晚达到最高点。
        它与宇宙的关系至今不明。
      en: |-
        On nights when the stars shine, this Pokémon’s
        psychic power is at its strongest. It’s unknown just
        what link Gothorita has to the greater universe.
      fr: |-
        Ses pouvoirs psychiques semblent atteindre
        leur paroxysme pendant les nuits étoilées,
        mais nul ne sait s’il a un rapport avec l’espace.
      de: |-
        An sternklaren Abenden erreicht es angeblich
        den Höhepunkt seiner Psycho-Kräfte. Seine
        genaue Verbindung zum Weltraum ist unklar.
      es: |-
        Sus poderes psíquicos alcanzan su apogeo en las
        noches estrelladas, aunque su posible vínculo con
        el espacio está envuelto en misterio.
      it: |-
        Si dice che accumuli energia psichica soprattutto
        nelle notti stellate, ma la sua connessione con
        l’universo rimane un mistero.
