fraxure:
  base_happiness: 35
  capture_rate: 60
  color: green
  egg_groups:
    - monster
    - dragon
  evolution_chain: axew
  evolves_from: axew
  flavor_text:
    black:
      en: |-
        Since a broken tusk will not grow back,
        they diligently sharpen their tusks on
        river rocks after they’ve been fighting.
      fr: |-
        Comme ses crocs brisés ne repoussent
        pas, il les aiguise après le combat grâce
        à une pierre ramassée près d’un fleuve.
    white:
      en: |-
        Their tusks can shatter rocks.
        Territory battles between Fraxure
        can be intensely violent.
      fr: |-
        Leurs crocs peuvent découper des
        rochers. Leurs querelles de territoire
        sont extrêmement violentes.
    black-2:
      en: |-
        A broken tusk will not grow back, so
        it diligently sharpens its tusks on
        river rocks after the end of a battle.
    white-2:
      en: |-
        A broken tusk will not grow back, so
        it diligently sharpens its tusks on
        river rocks after the end of a battle.
    x:
      ja-Hrkt: |-
        おおいわを　くだく　キバを　もつ。
        なわばりを　めぐる　オノンドたちの
        あらそいは　ひじょうに　はげしい。
      ja: |-
        大岩を　砕く　キバを　持つ。
        縄張りを　巡る　オノンドたちの
        争いは　非常に　激しい。
      ko: |-
        큰 바위를 부수는 이빨을 가지고 있다.
        액슨도들의 영역 싸움은
        매우 격렬하다.
      en: |-
        Their tusks can shatter rocks. Territory battles
        between Fraxure can be intensely violent.
      fr: |-
        Leurs crocs peuvent découper des rochers.
        Leurs querelles de territoire sont extrêmement
        violentes.
      de: |-
        Mit seinen Fängen kriegt es sogar Felsen klein.
        Gegen Artgenossen, die sein Revier passieren,
        geht es besonders hart vor.
      es: |-
        Sus colmillos pueden hacer añicos rocas inmensas. Las
        luchas territoriales de los Fraxure son encarnizadas.
      it: |-
        Ha zanne in grado di frantumare rocce. Le lotte per
        il territorio tra i Fraxure sono furibonde.
    'y':
      ja-Hrkt: |-
        キバは　にどと　はえかわらないので
        たたかいおわると　かわらの　いわを
        つかって　たんねんに　みがきあげる。
      ja: |-
        キバは　二度と　生え変わらないので
        戦い終わると　川原の　岩を
        使って　丹念に　磨きあげる。
      ko: |-
        이빨은 다시는 나지 않기 때문에
        싸움이 끝나면 강가에 있는 바위를
        사용해서 정성껏 손질한다.
      en: |-
        A broken tusk will not grow back, so it diligently
        sharpens its tusks on river rocks after the end of
        a battle.
      fr: |-
        Comme ses crocs brisés ne repoussent pas, il les
        aiguise avec soin après le combat sur les pierres
        des rivières.
      de: |-
        Da seine Hauer nicht mehr nachwachsen, wetzt es sie
        nach einem Kampf behutsam an den Felsen eines
        Flussbettes.
      es: |-
        Sus colmillos no vuelven a crecer, por lo que, al
        término de cada combate, los afila cuidadosamente
        con cantos de río.
      it: |-
        Le sue zanne non ricrescono più, per cui finita una
        lotta se ne prende cura e le affila diligentemente
        con pietre di fiume.
    omega-ruby:
      ja-Hrkt: |-
        おおいわを　くだく　キバを　もつ。
        なわばりを　めぐる　オノンドたちの
        あらそいは　ひじょうに　はげしい。
      ja: |-
        大岩を　砕く　キバを　持つ。
        縄張りを　巡る　オノンドたちの
        争いは　非常に　激しい。
      ko: |-
        큰 바위를 부수는 이빨을 가지고 있다.
        액슨도들의 영역 싸움은
        매우 격렬하다.
      en: |-
        Their tusks can shatter rocks. Territory battles
        between Fraxure can be intensely violent.
      fr: |-
        Leurs crocs peuvent découper des rochers.
        Leurs querelles de territoire sont extrêmement violentes.
      de: |-
        Mit seinen Fängen kriegt es sogar Felsen klein. Gegen
        Artgenossen, die sein Revier passieren, geht es besonders
        hart vor.
      es: |-
        Sus colmillos pueden hacer añicos rocas inmensas. Las luchas
        territoriales de los Fraxure son encarnizadas.
      it: |-
        Ha zanne in grado di frantumare rocce. Le lotte per il territorio
        tra i Fraxure sono furibonde.
    alpha-sapphire:
      ja-Hrkt: |-
        キバは　にどと　はえかわらないので
        たたかいおわると　かわらの　いわを
        つかって　たんねんに　みがきあげる。
      ja: |-
        キバは　二度と　生え変わらないので
        戦い終わると　川原の　岩を
        使って　丹念に　磨きあげる。
      ko: |-
        이빨은 다시는 나지 않기 때문에
        싸움이 끝나면 강가에 있는 바위를
        사용해서 정성껏 손질한다.
      en: |-
        A broken tusk will not grow back, so it diligently
        sharpens its tusks on river rocks after the end of
        a battle.
      fr: |-
        Comme ses crocs brisés ne repoussent pas, il les aiguise
        avec soin après le combat sur les pierres des rivières.
      de: |-
        Da seine Hauer nicht mehr nachwachsen, wetzt es sie nach
        einem Kampf behutsam an den Felsen eines Flussbettes.
      es: |-
        Sus colmillos no vuelven a crecer, por lo que, al término de
        cada combate, los afila cuidadosamente con cantos de río.
      it: |-
        Le sue zanne non ricrescono più, per cui finita una lotta se ne
        prende cura e le affila diligentemente con pietre di fiume.
    sword:
      ja-Hrkt: |-
        キバは　おれると　にどと　はえない。
        たたかいが　おわると　かわらの
        いわで　ていねいに　とぐ。
      ja: |-
        キバは　折れると　二度と　生えない。
        戦いが　終わると　河原の
        岩で　丁寧に　研ぐ。
      ko: |-
        어금니는 부러지면 다시 나지 않는다.
        싸움이 끝나면 강가에 있는
        바위로 정성껏 손질한다.
      zh-Hant: |-
        牙齒一旦折斷就不會再次生長。
        戰鬥結束之後會用河灘上的
        岩石仔細地磨牙。
      zh-Hans: |-
        牙齿一旦折断就不会再次生长。
        战斗结束之后会用河滩上的
        岩石仔细地磨牙。
      en: |-
        After battle, this Pokémon carefully sharpens its
        tusks on river rocks. It needs to take care of its
        tusks—if one breaks, it will never grow back.
      fr: |-
        Une fois cassés, ses crocs ne repoussent pas.
        Après les combats, il les aiguise avec soin
        sur les pierres d’un ruisseau.
      de: |-
        Da seine Hauer nicht mehr nachwachsen, wetzt
        es sie nach einem Kampf behutsam an einem
        geeigneten Felsen eines Flussbettes.
      es: |-
        Sus colmillos no vuelven a crecer, por lo que,
        al término de cada combate, los afila
        cuidadosamente con cantos de río.
      it: |-
        Se le sue zanne si spezzano, non ricrescono più.
        Finita la lotta le affila diligentemente con pietre
        di fiume.
    shield:
      ja-Hrkt: |-
        よろいの　ように　かたい　ひふ。
        たいあたりと　どうじに　キバを
        つきさす　せんぽうが　とくい　だぞ。
      ja: |-
        鎧の　ように　硬い　皮膚。
        体当たりと　同時に　キバを
        突き刺す　戦法が　得意　だぞ。
      ko: |-
        갑옷처럼 딱딱한 피부를 가졌다.
        몸통박치기와 동시에 어금니로
        찌르는 전법이 특기다.
      zh-Hant: |-
        皮膚像盔甲一樣堅硬。
        非常擅長在撞擊的同時
        用牙齒猛刺的戰法。
      zh-Hans: |-
        皮肤像盔甲一样坚硬。
        非常擅长在撞击的同时
        用牙齿猛刺的战法。
      en: |-
        Its skin is as hard as a suit of armor. Fraxure’s
        favorite strategy is to tackle its opponents,
        stabbing them with its tusks at the same time.
      fr: |-
        Son épiderme est dur comme une armure.
        Il est passé maître dans l’art de charger l’ennemi
        tout en le transperçant de ses crocs.
      de: |-
        Seine harte Haut schützt es wie eine Rüstung.
        Eine seiner besten Taktiken besteht darin, Gegner
        beim Tackle mit seinen Hauern zu durchbohren.
      es: |-
        Su piel es dura como una coraza. Su técnica
        predilecta consiste en embestir al rival para
        hincarle los colmillos.
      it: |-
        La sua pelle è dura quanto una corazza.
        La sua specialità è lanciarsi sull’avversario
        e infilzarlo con le zanne.
