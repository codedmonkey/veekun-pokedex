    x:
      ja-Hrkt: |-
        けなみが　うつくしく　ペットに
        したがる　ひとも　おおいが　すぐ
        ひっかいたり　するので　てごわいぞ。
      ja: |-
        毛並みが　美しく
        ペットにしたがる　人も　多いが　すぐ
        ひっかいたり　するので　手強いぞ。
      ko: |-
        털의 결이 아름다워 애완용으로
        기르려는 사람이 많지만, 곧잘
        할퀴려 들기 때문에 쉽지 않다.
      en: |-
        Although its fur has many admirers, it is tough
        to raise as a pet because of its fickle meanness.
      fr: |-
        Très apprécié pour sa fourrure, il est difficile à
        apprivoiser en raison de son caractère rétif.
      de: |-
        Dieses Pokémon hat sehr schönes Fell.
        Es ist jedoch ein schwer erziehbares Haustier.
      es: |-
        Aunque es muy admirado por el pelo, es difícil de
        entrenar como mascota, porque es un poco travieso.
      it: |-
        Sebbene molto amato per il suo pelo, è difficile
        addomesticarlo per la volubile crudeltà.
    'y':
      ja-Hrkt: |-
        しなやかな　きんにくの　おかげで
        あしおとひとつ　たてずに　あるける。
        えものを　かるときは　いっしゅん。
      ja: |-
        しなやかな　筋肉の　おかげで
        足音ひとつ　立てずに　歩ける。
        獲物を　狩るときは　一瞬。
      ko: |-
        부드러운 근육 덕분에
        발소리를 내지 않고 걸을 수 있다.
        먹이를 사냥할 때는 순식간이다.
      en: |-
        Its lithe muscles allow it to walk without making a
        sound. It attacks in an instant.
      fr: |-
        Ses muscles souples lui permettent de marcher sans
        un bruit et d’attaquer en l’espace d’un instant.
      de: |-
        Aufgrund seiner geschmeidigen Muskeln kann es sich
        lautlos bewegen. Es greift ohne Vorwarnung an.
      es: |-
        Sus ágiles músculos le permiten moverse sin hacer
        ruido. Ataca al instante.
      it: |-
        I muscoli flessibili gli consentono di camminare
        senza fare alcun rumore. Attacca in un lampo.
    omega-ruby:
      ja-Hrkt: |-
        たくましい　６ぽんの　ヒゲは　くうきの　うごきで
        まわりの　ようすを　キャッチする　やくわり。
        ヒゲを　つかまれると　おとなしくなって　しまう。
      ja: |-
        たくましい　６本の　ヒゲは　空気の　動きで
        周りの　様子を　キャッチする　役割。
        ヒゲを　つかまれると　大人しくなって　しまう。
      ko: |-
        튼튼한 6가닥의 수염은 공기의 움직임으로
        주변의 상태를 파악하는 역할을 한다.
        수염을 잡히면 얌전해진다.
      en: |-
        Persian has six bold whiskers that give it a look of toughness.
        The whiskers sense air movements to determine what is in the
        Pokémon’s surrounding vicinity. It becomes docile if grabbed
        by the whiskers.
      fr: |-
        Persian a six grosses vibrisses qui lui donnent un air costaud
        et lui permettent de sentir les mouvements de l’air pour savoir
        ce qui se trouve à proximité. Il devient docile lorsqu’on
        l’attrape par les moustaches.
      de: |-
        Snobilikat hat sechs dicke Schnurrhaare, wodurch es Furcht
        einflößend wirkt. Durch diese nimmt es wahr, wenn sich etwas
        in seiner Nähe bewegt. Es wird sehr zutraulich, wenn man es
        an den Schnurrhaaren berührt.
      es: |-
        Persian tiene seis llamativos bigotes que le dan un aspecto
        feroz. Además, le sirven para detectar el movimiento del aire,
        delator de la presencia cercana de algún Pokémon. Si se le
        agarra por los bigotes, se vuelve dócil.
      it: |-
        Persian è dotato di sei baffetti furbi che gli conferiscono
        un aspetto forte. I baffi captano ogni movimento dell’aria
        riconoscendo presenze vicine. Se afferrato per i baffi,
        diventa docile.
    alpha-sapphire:
      ja-Hrkt: |-
        たくましい　６ぽんの　ヒゲは　くうきの　うごきで
        まわりの　ようすを　キャッチする　やくわり。
