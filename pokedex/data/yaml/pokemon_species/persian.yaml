    sword:
      ja-Hrkt: |-
        きぐらいが　たかく　なつかせるのは
        たいへん。　きにくわない　ことが
        あると　すぐに　ツメを　たててくる。
      ja: |-
        気位が　高く　なつかせるのは
        たいへん。　気に食わない　ことが
        あると　すぐに　ツメを　立ててくる。
      ko: |-
        자존심이 세서 길들이기
        힘들다. 마음에 들지 않는 일이
        있으면 바로 발톱을 세운다.
      zh-Hant: |-
        性情高傲，很難讓牠聽話。
        只要遇到看不順眼的事，
        就會馬上豎起自己的爪子。
      zh-Hans: |-
        性情高傲，很难让它听话。
        只要遇到看不顺眼的事，
        就会马上竖起自己的爪子。
      en: |-
        Getting this prideful Pokémon to warm up to you
        takes a lot of effort, and it will claw at you the
        moment it gets annoyed.
      fr: |-
        Très fier, il est difficile à apprivoiser.
        Dès que quelque chose ne lui plaît pas,
        il sort les griffes.
      de: |-
        Es ist sehr stolz, was es nicht leicht macht, mit
        ihm Freundschaft zu schließen. Wenn ihm etwas
        missfällt, fährt es unverzüglich die Krallen aus.
      es: |-
        Trabar amistad con este Pokémon es una ardua
        tarea debido a su enorme orgullo. Cuando algo
        no le place, saca las uñas de inmediato.
      it: |-
        Conquistarsi il suo affetto è un’impresa ardua
        perché è molto altezzoso. Se qualcosa non gli
        va, tira subito fuori gli artigli.
    shield:
      ja-Hrkt: |-
        ゆうがで　じょうひんな　みのこなし。
        やばんな　ニャイキングとは　そりが
        あわず　おたがいを　みくだしている。
      ja: |-
        優雅で　上品な　身のこなし。
        野蛮な　ニャイキングとは　そりが
        あわず　お互いを　見下している。
      ko: |-
        움직임은 우아하고 품위 있다.
        야만스러운 나이킹과는
        잘 맞지 않아 서로를 멸시한다.
      zh-Hant: |-
        擁有優雅高貴的身姿。
        與野蠻的喵頭目個性不合，
        互相看不起對方。
      zh-Hans: |-
        拥有优雅高贵的身姿。
        与野蛮的喵头目性格不合，
        互相看不起对方。
      en: |-
        Its elegant and refined behavior clashes with that
        of the barbaric Perrserker. The relationship
        between the two is one of mutual disdain.
      fr: |-
        Il se comporte avec grâce et élégance,
        et ne s’entend pas avec les rustres Berserkatt :
        les deux espèces se méprisent.
      de: |-
        Sein Auftreten ist anmutig und elegant. Es kommt
        mit Mauzingers grober Art nicht zurecht. Beide
        Arten strafen sich gegenseitig mit Verachtung.
      es: |-
        Hace gala de un porte elegante y majestuoso.
        No congenia con los toscos Perrserker y ambos
        se profesan un mutuo desprecio.
      it: |-
        Ha un portamento elegante e distinto.
        Non gli va a genio la rozzezza di Perrserker
        e i due Pokémon si disprezzano a vicenda.
