        riconoscendo presenze vicine. Se afferrato per i baffi,
        diventa docile.
    sun:
      ja-Hrkt: |-
        きしょうが　あらく　めが　あうだけで
        とびかかってくる。　するどいツメに
        やられると　ふかい　きずを　おう。
      ja: |-
        気性が　荒く　目が　合うだけで
        飛び掛ってくる。　鋭いツメに
        やられると　深い　傷を　負う。
      ko: |-
        기질이 거칠어 눈이 마주치는 것만으로
        덤벼든다. 날카로운 발톱으로
        공격당하면 깊은 상처를 입는다.
      zh-Hant: |-
        性情粗暴，單單是視線對上就會
        猛撲過來。被銳利的爪子抓到的話，
        就會留下很深的傷口。
      zh-Hans: |-
        性情粗暴，只要视线对上就会
        猛扑过来。被锐利的爪子抓到的话，
        就会留下很深的伤口。
      en: |-
        It has a violent temperament. It will attack
        anything that looks it in the eye. Its sharp
        claws inflict deep wounds.
      fr: |-
        Un Pokémon très agressif, qui peut sauter à la
        gorge si on le regarde dans les yeux. Ses
        griffes acérées infligent de graves blessures.
      de: |-
        Sieht man diesem ungestümen Pokémon nur
        in die Augen, fällt es einen bereits an. Seine
        scharfen Klauen hinterlassen tiefe Wunden.
      es: |-
        De temperamento violento, ataca a cualquiera
        que lo mira directamente a los ojos. Sus afiladas
        garras infligen heridas muy profundas.
      it: |-
        È particolarmente suscettibile, tanto da
        attaccare chiunque lo guardi negli occhi.
        I suoi artigli affilati provocano profonde ferite.
    moon:
      ja-Hrkt: |-
        アローラの　ペルシアンほどではないが
        きぐらいの　たかい　せいしつ。
        なつかせるのが　かなり　むずかしい。
      ja: |-
        アローラの　ペルシアンほどではないが
        気位の　高い　性質。
        懐かせるのが　かなり　難しい。
      ko: |-
        알로라의 페르시온 정도는 아니지만
        자존심이 강하기 때문에
        길들이기가 꽤 어렵다.
      zh-Hant: |-
        還沒有達到阿羅拉的貓老大的程度，
        但是性情傲慢自大。
        要和牠變得親密相當困難。
      zh-Hans: |-
        还没有达到阿罗拉的猫老大的地位，
        但是性情傲慢自大。
        要和它变得亲密相当困难。
      en: |-
        It has a high opinion of itself, although not to
        the same extent as the Alolan Persian. It’s quite
        difficult to make friends with this Pokémon.
      fr: |-
        Un Pokémon naturellement fier, mais pas aussi
        orgueilleux que les Persian d’Alola. Il est très
        difficile à apprivoiser.
      de: |-
        Es ist von Natur aus sehr stolz, wenn auch
        nicht im gleichen Maße wie Snobilikat aus Alola.
        Sie lassen sich nur sehr schwer zähmen.
      es: |-
        Los Persian son Pokémon extremadamente
        orgullosos, en especial los de Alola.
        No es fácil hacerse amigo de este Pokémon.
      it: |-
        È un Pokémon molto altezzoso, caratteristica
        particolarmente marcata nei Persian di Alola.
        Conquistarsi il suo affetto è un’impresa ardua.
    ultra-sun:
      ja-Hrkt: |-
        アローラの　ペルシアンとは　ひたいの
        ほうせきのいろが　ちがって　みえるが
        せいぶんは　あまり　かわらないのだ。
      ja: |-
        アローラの　ペルシアンとは　額の
        宝石の色が　違って　見えるが
        成分は　あまり　変わらないのだ。
      ko: |-
        알로라의 페르시온과는
        이마의 보석 색깔이 다르지만,
        성분은 크게 다르지 않다.
      zh-Hant: |-
        額頭上的寶石顏色看起來
        和阿羅拉的貓老大不一樣，
        但其實成分沒有什麼不同。
      zh-Hans: |-
        虽然额头上的宝石颜色
        和阿罗拉猫老大的不一样，
        但成分却没什么两样。
      en: |-
        Although the jewel on its forehead appears to
        be a different color than those of Alolan
        Persian, it’s mostly made of the same material.
      fr: |-
        Malgré une composition quasiment identique,
        sa gemme est d’une couleur différente de celle
        du Persian d’Alola.
      de: |-
        Das Juwel auf seiner Stirn hat eine andere Farbe
        als jenes von Snobilikat aus Alola, doch die
        Zusammensetzung ist großteils gleich.
      es: |-
        La joya que luce en la frente presenta una
        coloración distinta a la del Persian de Alola,
        aunque la composición es casi idéntica.
      it: |-
        La gemma che ha sulla fronte è di un colore
        diverso da quella dei Persian di Alola, ma è
        composta praticamente dello stesso il materiale.
    ultra-moon:
      ja-Hrkt: |-
        おかねもちに　にんきの　ポケモン。
        ひたいの　ほうせきを　ねらって
        ハンターたちに　ねらわれることも。
      ja: |-
        お金持ちに　人気の　ポケモン。
        額の　宝石を　狙って
        ハンターたちに　狙われることも。
      ko: |-
        부자들에게 인기가 많은 포켓몬이다.
        이마에 박힌 보석 때문에
        사냥꾼들이 노리는 경우도 있다.
      zh-Hant: |-
        很受有錢人喜愛的寶可夢。
        有些獵人會為了額頭上的
        寶石而獵捕牠。
      zh-Hans: |-
        很受有钱人喜爱的宝可梦。
        有时会遭到那些打它额头
        宝石主意的猎人们袭击。
      en: |-
        This Pokémon is popular with rich people.
        It’s also targeted by hunters who are after
        the jewel in its forehead.
      fr: |-
        Un Pokémon prisé des classes aisées.
        Il est néanmoins la cible des voleurs convoitant
        la gemme qui orne son front.
      de: |-
        Unter Wohlbetuchten ein besonders beliebtes
        Pokémon. Räuberbanden haben es stets auf
        das Juwel auf seiner Stirn abgesehen.
      es: |-
        Un Pokémon de alto copete, objetivo primordial
        de ladrones que quieren apoderarse de la joya
        que luce en la frente.
      it: |-
        È molto popolare tra le persone facoltose.
        A volte viene preso di mira dai cacciatori,
        attirati dalla gemma che ha sulla fronte.
    lets-go-pikachu:
      ja-Hrkt: |-
        ひたいに　ほうせきが　かがやく！
        また　あるくすがたも　しなやかで
        おうじょのような　はなやかさがある。
      ja: |-
        額に　宝石が　輝く！
        また　歩く姿も　しなやかで
        王女のような　華やかさがある。
      ko: |-
        이마의 보석이 빛난다!
        걷는 모습도 우아하고
        왕녀와 같은 화려함이 있다.
      zh-Hant: |-
        額頭上有顆閃亮亮的寶石！
        行走的姿勢也十分優雅，
        看起來就像女王般雍容華貴。
      zh-Hans: |-
        额头上的宝石闪闪发亮！
        走路的姿态也十分优美，
        就像女王一样华丽高贵。
      en: |-
        The gem in its forehead glows on its own!
        It walks with all the grace and elegance
        of a proud queen.
      fr: |-
        La pierre sur son front brille de mille feux.
        Sa démarche est souple et majestueuse.
      de: |-
        Es trägt ein leuchtendes Juwel an der Stirn.
        Zusammen mit seinem anmutigen Gang wirkt
        es dadurch elegant wie eine Königin.
      es: |-
        La gema que tiene en la frente brilla por sí
        misma. Camina con elegancia regia.
      it: |-
        La gemma che ha in fronte emette una luce
        splendente. Ha le movenze sinuose ed eleganti
        di una regina.
    lets-go-eevee:
      ja-Hrkt: |-
        ひたいに　ほうせきが　かがやく！
        また　あるくすがたも　しなやかで
        おうじょのような　はなやかさがある。
      ja: |-
