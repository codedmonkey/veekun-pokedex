quilladin:
  base_happiness: 70
  capture_rate: 45
  color: green
  egg_groups:
    - ground
  evolution_chain: chespin
  evolves_from: chespin
  flavor_text:
    x:
      ja-Hrkt: |-
        からだを　おおう　がんじょうな　カラが
        てきの　こうげきを　はじきかえし
        するどい　トゲで　はんげきする。
      ja: |-
        体を　覆う　頑丈な　殻が
        敵の　攻撃を　弾き返し
        鋭い　トゲで　反撃する。
      ko: |-
        몸을 둘러싼 단단한 껍질이
        적의 공격을 튕겨내고
        날카로운 가시로 반격한다.
      en: |-
        It relies on its sturdy shell to deflect predators’
        attacks. It counterattacks with its sharp quills.
      fr: |-
        La carapace qui recouvre son corps le protège
        des attaques adverses, et ses piquants lui permettent
        de contre-attaquer.
      de: |-
        Der Panzer, der seinen Körper umgibt, bietet ihm
        Schutz vor Angreifern und straft direkte Angriffe
        postwendend mit spitzen Stacheln ab.
      es: |-
        Desvía los ataques de los enemigos con la robusta
        coraza que cubre su cuerpo y contraataca con sus
        dos afilados cuernos.
      it: |-
        Respinge gli attacchi dei nemici grazie al guscio che
        gli ricopre il corpo e contrattacca con gli aculei affilati.
    'y':
      ja-Hrkt: |-
        なかまどうしで　からだを　ぶつけあい
        あしこしを　きたえる。じぶんからは
        たたかわない　やさしい　せいかく。
      ja: |-
        仲間同士で　体を　ぶつけ合い
        足腰を　鍛える。
        自分からは　戦わない　優しい　性格。
      ko: |-
        동료끼리 몸을 서로 부딪쳐
        하반신을 단련한다. 자신이 먼저
        싸움을 걸지 않는 온순한 성격이다.
      en: |-
        They strengthen their lower bodies by
        running into one another. They are very
        kind and won’t start fights.
      fr: |-
        Il renforce ses membres inférieurs en se ruant
        violemment sur ses congénères. Naturellement
        paisible, il ne provoque jamais un combat.
      de: |-
        Sie stärken ihre Beinmuskeln, indem sie sich
        gegenseitig anrempeln. Sie sind sehr freundlich
        und würden niemals einen Streit anfangen.
      es: |-
        Chocan contra sus congéneres para fortalecer sus
        piernas. Debido a su carácter afable, nunca son los
        que provocan un combate.
      it: |-
        Allena la parte inferiore del corpo scontrandosi con i
        suoi simili. Ha una natura mite e non inizia mai
        una lotta per primo.
    omega-ruby:
      ja-Hrkt: |-
