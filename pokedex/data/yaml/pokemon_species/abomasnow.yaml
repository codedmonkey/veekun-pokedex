    sword:
      ja-Hrkt: |-
        おおきな　うでを　ハンマーの　ように
        ふりおろし　ユキカブリを　ねらう
        ダルマッカの　むれを　おいはらう。
      ja: |-
        大きな　腕を　ハンマーの　ように
        振り下ろし　ユキカブリを　狙う
        ダルマッカの　群れを　追い払う。
      ko: |-
        거대한 팔을 해머처럼
        내리쳐서 눈쓰개를 노리는
        달막화 무리를 내쫓는다.
      zh-Hant: |-
        會像揮動鎚子般揮下自己
        大大的手臂，趕走要襲擊
        雪笠怪的火紅不倒翁群體。
      zh-Hans: |-
        会像挥动锤子一样挥下自己
        大大的手臂，赶走要袭击
        雪笠怪的火红不倒翁群体。
      en: |-
        If it sees any packs of Darumaka going after
        Snover, it chases them off, swinging its sizable
        arms like hammers.
      fr: |-
        Il fait fuir les hordes de Darumarond qui s’en
        prennent aux Blizzi en se servant de ses grands
        bras comme de marteaux.
      de: |-
        Es schwingt seine großen Arme wie Hämmer und
        vertreibt damit Gruppen von Flampion, die es
        auf Shnebedeck abgesehen haben.
      es: |-
        Usa sus enormes brazos como si fueran martillos
        para ahuyentar a los grupos de Darumaka que
        acechan a los Snover.
      it: |-
        Agitando le grosse braccia come dei martelli
        scaccia i gruppi di Darumaka che prendono
        di mira gli Snover.
    shield:
      ja-Hrkt: |-
        ブリザードを　まきおこす　ポケモン。
        おおきな　からだを　ゆすれば
        あたりいちめん　すぐに　まっしろだ。
      ja: |-
        ブリザードを　巻き起こす　ポケモン。
        大きな　体を　揺すれば
        あたり一面　すぐに　真っ白だ。
      ko: |-
        블리자드를 일으키는 포켓몬이다.
        커다란 몸을 흔들면
        부근 일대는 금세 새하얗게 된다.
      zh-Hant: |-
        會引發暴風雪的寶可夢。
        只要牠搖動巨大的身體，
        周圍立刻會變得一片雪白。
      zh-Hans: |-
        会引发暴风雪的宝可梦。
        只要它摇动巨大的身体，
        周围立刻会变得一片雪白。
      en: |-
        This Pokémon is known to bring blizzards.
        A shake of its massive body is enough to
        cause whiteout conditions.
      fr: |-
        Ce grand Pokémon déclenche des blizzards.
        Lorsqu’il agite son corps, tout ce qui l’entoure
        se retrouve couvert de neige.
      de: |-
        Dieses Pokémon löst Blizzards aus. Wenn es
        seinen großen Körper schüttelt, wird in seiner
        Umgebung alles sofort schneeweiß.
      es: |-
        Posee la capacidad de generar ventiscas. Si agita
        su enorme cuerpo, el terreno circundante queda
        inmediatamente cubierto de nieve.
      it: |-
        Scatena bufere di neve. Se scuote il suo grosso
        corpo, imbianca il terreno circostante in un
        attimo.
    legends-arceus:
      en: |-
        A powerful Pokémon that can split huge boulders with ease.
        Dislikes associating with others and chooses to live quietly deep
        within the mountains, playing with the snow.
