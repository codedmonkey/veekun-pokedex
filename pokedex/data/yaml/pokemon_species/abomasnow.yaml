    x:
      ja-Hrkt: |-
        ブリザードを　はっせいさせて　あたり
        いちめんを　まっしろに　してしまう。
        べつめい　アイスモンスター。
      ja: |-
        ブリザードを　発生させて　あたり
        一面を　真っ白に　してしまう。
        別名　アイスモンスター。
      ko: |-
        블리자드를 발생시켜 주변
        일대를 새하얗게 만든다.
        별명은 아이스 몬스터다.
      en: |-
        It blankets wide areas in snow by whipping up
        blizzards. It is also known as “The Ice Monster.”
      fr: |-
        De larges zones sont recouvertes par la neige de ses
        blizzards. On l’appelle « monstre des glaces ».
      de: |-
        Es bedeckt weite Gebiete mit Schnee, indem es
        Blizzards auslöst. Man nennt es „Das Eismonster“.
      es: |-
        Genera ventiscas con las que cubre de nieve grandes
        áreas. Se le llama el Monstruo de Hielo.
      it: |-
        Crea bufere che ricoprono di neve ampissime aree.
        È noto anche come “Mostro dei ghiacci”.
    'y':
      ja-Hrkt: |-
        まんねんゆきが　つもる　さんみゃくで
        しずかに　くらす。ブリザードを
        はっせいさせて　すがたを　かくす。
      ja: |-
        万年雪が　積もる　山脈で
        静かに　暮らす。ブリザードを
        発生させて　姿を　隠す。
      ko: |-
        만년설이 쌓인 산맥에서
        조용히 지낸다. 블리자드를
        발생시켜 모습을 감춘다.
      en: |-
        It lives a quiet life on mountains that are perpetually
        covered in snow. It hides itself by whipping
        up blizzards.
      fr: |-
        Il hante les sommets aux neiges éternelles, et se
        cache en déclenchant des blizzards.
      de: |-
        Es haust im Gebirge, wo ewiger Schnee liegt,
        und löst Blizzards aus, um sich zu verstecken.
      es: |-
        Vive en paz en cordilleras de nieves eternas.
        Genera ventiscas para ocultarse.
      it: |-
        Vive nella pace delle cime montuose tra le nevi eterne:
        scatena bufere di neve e poi si nasconde.
    omega-ruby:
      ja-Hrkt: |-
        ブリザードを　はっせいさせて　あたり
        いちめんを　まっしろに　してしまう。
        べつめい　アイスモンスター。
      ja: |-
