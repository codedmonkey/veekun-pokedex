shelgon:
  base_happiness: 35
  capture_rate: 45
  color: white
  egg_groups:
    - dragon
  evolution_chain: bagon
  evolves_from: bagon
  flavor_text:
    ruby:
      en: |-
        Inside SHELGON’s armor-like shell, cells
        are in the midst of transformation
        to create an entirely new body.This POKéMON’s shell is extremely heavy,
        making its movements sluggish.
    sapphire:
      en: |-
        Covering SHELGON’s body are outgrowths
        much like bones. The shell is very hard
        and bounces off enemy attacks.When awaiting evolution, this POKéMON
        hides away in a cavern.
    emerald:
      en: |-
        It hardly eats while it awaits evolution.
        It becomes hardier by enduring hunger.
        Its shell peels off the instant it begins
        to evolve.
    firered:
      en: |-
        Its armored body makes all attacks bounce
        off. The armor is too tough, however,
        making it heavy and somewhat sluggish.
    leafgreen:
      en: |-
        Its armored body makes all attacks bounce
        off. The armor is too tough, however,
        making it heavy and somewhat sluggish.
    diamond:
      en: |-
        Within its rugged shell, its cells
        have begun changing. The shell
        peels off the instant it evolves.
    pearl:
      en: |-
        Within its rugged shell, its cells
        have begun changing. The shell
        peels off the instant it evolves.
    platinum:
      en: |-
        Within its rugged shell, its cells
        have begun changing. The shell
        peels off the instant it evolves.
    heartgold:
      en: |-
        It surrounds its body in an
        iron-hard shell to accumulate
        enough power to evolve.
    soulsilver:
      en: |-
        It surrounds its body in an
        iron-hard shell to accumulate
        enough power to evolve.
    black:
      en: |-
        Within its rugged shell, its cells
        have begun changing. The shell
        peels off the instant it evolves.
      fr: |-
        Ses cellules ont commencé à changer
        dans sa robuste coquille. Il la perd
        en évoluant.
    white:
      en: |-
        Within its rugged shell, its cells
        have begun changing. The shell
        peels off the instant it evolves.
      fr: |-
        Ses cellules ont commencé à changer
        dans sa robuste coquille. Il la perd
        en évoluant.
    black-2:
      en: |-
        Within its rugged shell, its cells
        have begun changing. The shell
        peels off the instant it evolves.
    white-2:
      en: |-
        Within its rugged shell, its cells
        have begun changing. The shell
        peels off the instant it evolves.
    x:
      ja-Hrkt: |-
        かたい　カラの　なかでは　さいぼうが
        へんかを　はじめている。しんかする
        しゅんかんに　カラが　はがれおちる。
      ja: |-
        硬い　殻の　中では　細胞が
        変化を　はじめている。進化する
        瞬間に　殻が　はがれ落ちる。
      ko: |-
        단단한 껍질 안은 세포가
        변화를 시작하고 있다. 진화하는
        순간에 껍질이 벗겨져 떨어진다.
      en: |-
        Within its rugged shell, its cells have begun
        changing. The shell peels off the instant it evolves.
      fr: |-
        Ses cellules ont commencé à changer dans sa
        robuste coquille. Il la perd en évoluant.
      de: |-
        Die Zellen seines Panzers fingen an, sich zu verändern.
        Er fällt ab, sobald sich das Pokémon entwickelt.
      es: |-
        Las células han empezado a cambiar dentro de su dura
        concha, que se separa cuando evoluciona.
      it: |-
        Nella sua dura corazza le cellule hanno cominciato
        a cambiare. Quando si evolve, la corazza cade.
    'y':
      ja-Hrkt: |-
        あらゆる　こうげきを　はねかえす。
        じょうぶすぎて　からだが　おもいため
        すこし　うごきが　にぶい。
      ja: |-
        あらゆる　攻撃を　跳ね返す。
        丈夫すぎて　体が　重いため
        少し　動きが　鈍い。
      ko: |-
        모든 공격을 튕겨낸다.
        너무 튼튼해서 몸이 무겁기 때문에
        약간 움직임이 둔하다.
      en: |-
        Its armored body makes all attacks bounce off.
        The armor is too tough, however, making it heavy
        and somewhat sluggish.
      fr: |-
        Son corps renforcé repousse toutes les attaques.
        Cependant, le poids important de cette armure
        empêche Drackhaus de se déplacer librement.
      de: |-
        Von seinem gepanzerten Körper prallen alle
        Angriffe ab. Die Panzerung ist jedoch zu hart,
        sodass es schwer und träge ist.
      es: |-
        La robusta capa que lo rodea repele los ataques.
        Aunque es una buena protección, lo hace lento y
        pesado.
      it: |-
        La sua corazza è capace di respingere qualsiasi
        attacco, ma lo appesantisce, rendendolo piuttosto
        pigro.
    omega-ruby:
      ja-Hrkt: |-
        かたい　カラの　ないぶは　さいぼうが　へんかして
        あたらしい　からだを　つくっている　さいちゅう。
        カラが　とても　おもいので　うごきは　にぶいぞ。
      ja: |-
        硬い　カラの　内部は　細胞が　変化して
        新しい　体を　つくっている　最中。
        カラが　とても　重いので　動きは　鈍いぞ。
      ko: |-
        단단한 껍질 내부는 세포가 변화되어
        새로운 몸을 만드는 중이다.
        껍질이 매우 무거워서 움직임이 둔하다.
      en: |-
        Inside Shelgon’s armor-like shell, cells are in the midst of
        transformation to create an entirely new body. This Pokémon’s
        shell is extremely heavy, making its movements sluggish.
      fr: |-
        À l’intérieur de la carapace blindée de Drackhaus,
        ses cellules sont en pleine transformation pour créer
        un nouveau corps. La carapace de ce Pokémon est
        très lourde, ce qui rend ses mouvements très lents.
      de: |-
        In Draschels panzerartiger Schale vollziehen seine Zellen
        eine Transformation, um einen völlig neuen Körper zu bilden.
        Die Schale dieses Pokémon ist ausgesprochen schwer,
        sodass seine Bewegungen träge wirken.
      es: |-
        Dentro de la capa acorazada de Shelgon, las células están en
        pleno proceso de creación de un cuerpo nuevo. El peso de la
        coraza le hace tener unos movimientos lentos.
      it: |-
        All’interno della corazza-armatura di Shelgon, le cellule
        sono in continua trasformazione per creare un corpo
        completamente nuovo. La corazza pesantissima rende
        difficili i movimenti.
    alpha-sapphire:
      ja-Hrkt: |-
        からだを　おおっているのは　ホネのような　もの。
        とても　かたく　てきの　こうげきを　はねかえす。
        ほらあなで　みを　ひそめ　しんかを　まっている。
      ja: |-
        体を　覆っているのは　ホネのような　もの。
        とても　硬く　敵の　攻撃を　跳ね返す。
        洞穴で　身を　潜め　進化を　待っている。
      ko: |-
        몸을 감싸고 있는 것은 뼈와 같은 것이다.
        매우 단단해서 적의 공격을 튕겨낸다.
        동굴에서 몸을 숨기고 진화를 기다리고 있다.
      en: |-
        Covering Shelgon’s body are outgrowths much like bones.
        The shell is very hard and bounces off enemy attacks.
        When awaiting evolution, this Pokémon hides away in a cavern.
      fr: |-
        Des excroissances osseuses recouvrent le corps de
        Drackhaus. Cette carapace est extrêmement dure et le
        protège des attaques ennemies. En attendant son évolution,
        ce Pokémon reste caché dans une caverne.
      de: |-
        Auf Draschels Körper befinden sich knochenähnliche
        Auswüchse. Sein Panzer ist sehr hart und wehrt jeden
        Angriff eines Gegners ab. Während es auf seine Entwicklung
        wartet, versteckt es sich in einer Höhle.
      es: |-
        Shelgon está recubierto por una especie de capa ósea: una
        coraza muy dura que hace rebotar los ataques enemigos. Este
        Pokémon se esconde en las cavernas para evolucionar.
      it: |-
        Il corpo di Shelgon è ricoperto da escrescenze simili a ossa.
        Questa corazza è così dura da proteggere completamente
        dagli attacchi nemici. Si rintana nelle grotte in attesa
        dell’evoluzione.
    sun:
      ja-Hrkt: |-
        カラの　なかでは　ばくはつてきな
        スピードで　さいぼうが　へんかし
        しんかの　じゅんびを　しているぞ。
      ja: |-
        殻の　中では　爆発的な
        スピードで　細胞が　変化し
        進化の　準備を　しているぞ。
      ko: |-
        껍질 안에서는 폭발적인
        스피드로 세포가 변화하며
        진화의 준비를 하고 있다.
      zh-Hant: |-
        細胞在殼中
        以爆發般的速度變化，
        正在為進化做準備。
      zh-Hans: |-
        细胞在壳中
        以爆发般的速度变化，
        为进化做准备。
      en: |-
        The cells within its shell transform with
        explosive speed, preparing it for evolution.
      fr: |-
        À l’intérieur de sa carapace, ses cellules
        subissent un bouleversement cataclysmique.
        Il se prépare ainsi à son évolution.
      de: |-
        In Draschels Schale vollziehen seine Zellen
        in Vorbereitung auf seine Entwicklung
        eine explosionsartige Transformation.
      es: |-
        En el interior de su coraza, las células se
        transforman a una velocidad vertiginosa para
        preparar su evolución.
      it: |-
        Le cellule all’interno della sua corazza mutano
        a velocità vertiginosa in vista dell’evoluzione.
    moon:
      ja-Hrkt: |-
        ほらあなの　おくに　じっと　ひそみ
        なにも　くわず　なにも　のまない。
        なぜ　しなないのかは　ふめいだ。
      ja: |-
        洞穴の　奥に　じっと　潜み
        何も　喰わず　何も　飲まない。
        なぜ　死なないのかは　不明だ。
      ko: |-
        동굴 깊숙한 곳에 가만히 숨어
        아무것도 먹지도 마시지도 않는다.
        어째서 죽지 않는지는 의문이다.
      zh-Hant: |-
        一動不動地潛伏在洞穴深處，
        不吃也不喝。
        不知為何不會死掉。
      zh-Hans: |-
        一动不动地潜伏在洞穴深处，
        不吃也不喝。
        不知为何不会死掉。
      en: |-
        They lurk deep within caves—motionless,
        neither eating nor drinking. Why they don’t die is
        not known.
      fr: |-
        Il se cache sans bouger au fond de sa grotte,
        sans eau ni nourriture. Les raisons de sa survie
        sont, à franchement parler, un véritable mystère.
      de: |-
        Es hält sich in den Tiefen einer Höhle versteckt,
        wo es weder trinkt noch isst. Niemand weiß so
        recht, wie es eigentlich überleben kann.
      es: |-
        Permanece quieto en el fondo de las grutas sin
        probar bocado ni beber ningún líquido. Resulta
        sorprendente que pueda sobrevivir así.
      it: |-
        Si rintana nelle grotte senza bere né mangiare
        nulla. Gli studiosi non hanno ancora capito
        come faccia a sopravvivere.
    ultra-sun:
      ja-Hrkt: |-
        たいないの　さいぼうが　めまぐるしく
        へんかしている　さいちゅう。　かたい
        カラは　ホネと　おなじ　せいぶんだ。
      ja: |-
        体内の　細胞が　目まぐるしく
        変化している　最中。　硬い
        カラは　ホネと　同じ　成分だ。
      ko: |-
        체내의 세포가 빠르게
        변화하고 있는 중이다. 단단한
        껍질은 뼈와 같은 성분이다.
      zh-Hant: |-
        體內的細胞以令人
        目不暇給的速度不斷變化。
        堅硬的外殼成分與骨骼相同。
      zh-Hans: |-
        体内的细胞正处于千变万化的时期。
        坚硬的壳与骨头的成分相同。
      en: |-
        The cells within its body are changing at a
        bewildering pace. Its hard shell is made from
        the same substance as bone.
      fr: |-
        À l’intérieur de sa carapace, dont la composition
        s’apparente à celle des os, son corps subit
        une véritable révolution cellulaire.
      de: |-
        Die Zellen in seinem Körper sind in ständigem,
        rasantem Wandel begriffen. Seine Schale
        besteht aus derselben Substanz wie Knochen.
      es: |-
        Las células de su cuerpo se transforman a una
        velocidad vertiginosa. Su dura coraza está
        formada por una especie de tejido óseo.
      it: |-
        Le cellule all’interno della dura corazza,
        composta da materiale osseo, mutano a una
        velocità vertiginosa.
    ultra-moon:
      ja-Hrkt: |-
        どうくつの　おくふかくに　すむ。
        かたい　カラの　なかに　とじこもり
        そらを　とぶ　ひを　ゆめ　みている。
      ja: |-
        洞窟の　奥深くに　棲む。
        硬い　カラの　中に　閉じこもり
        空を　飛ぶ　日を　夢見ている。
      ko: |-
        동굴 깊숙한 곳에 산다.
        단단한 껍질 속에 틀어박혀
        하늘을 나는 날을 꿈꾸고 있다.
      zh-Hant: |-
        棲息在洞窟深處。
        總是躲在堅硬的外殼裡，
        夢想著飛上天空的那一天。
      zh-Hans: |-
        栖息在洞窟的深处，
        躲在坚硬的外壳里，
        梦想着飞上天空的那一天。
      en: |-
        Shelgon lives deep within caves. It stays shut
        up in its hard shell, dreaming of the day it will
        be able to fly.
      fr: |-
        Il habite au fond des grottes et, bien à l’abri
        au creux de sa solide carapace, il rêve du jour
        où il pourra enfin s’envoler dans les cieux.
      de: |-
        Es lebt tief im Inneren von Höhlen. Von seiner
        harten Schale umgeben träumt es von dem Tag,
        an dem es am Himmel fliegt.
      es: |-
        Vive en el fondo de las grutas. Mientras se
        recluye en su dura concha, sueña con el día
        en el que pueda surcar el cielo volando.
      it: |-
        Vive nelle profondità delle grotte. Resta chiuso
        nella dura corazza sognando il giorno in cui
        sarà in grado di volare.
    sword:
      ja-Hrkt: |-
        ほねと　おなじ　せいぶんで　できた
        かたい　カラで　からだを　つつむ。
        しんかの　エネルギーを　たくわえる。
      ja: |-
        骨と　同じ　成分で　できた
        硬い　殻で　体を　包む。
        進化の　エネルギーを　蓄える。
      ko: |-
        뼈와 같은 성분으로 만들어진
        단단한 껍질로 몸을 감쌌다.
        진화의 에너지를 비축하고 있다.
      zh-Hant: |-
        用成分與骨頭相同的硬殼
        覆蓋身體。體內蓄積著
        進化所需的能量。
      zh-Hans: |-
        覆盖着身体的硬壳
        成分和骨头相同。
        正在储备进化的能量。
      en: |-
        This Pokémon has covered its body in a hard
        shell that has the same composition as bone.
        Shelgon stores energy for evolution.
      fr: |-
        Ce Pokémon emmagasine l’énergie nécessaire
        à son évolution sous sa carapace dont
        la composition est identique à celles des os.
      de: |-
        Es hüllt seinen Körper in eine harte Schale,
        die Knochengewebe gleicht, und sammelt so
        Energie für seine Entwicklung.
      es: |-
        Lo recubre una dura coraza de tejido óseo. En el
        interior, acumula energía de cara a la evolución.
      it: |-
        Il suo corpo è protetto da una dura corazza
        composta di materiale osseo.
        Accumula energia per poi evolversi.
    shield:
      ja-Hrkt: |-
        エサを　たべず　くうふくに　たえる。
        ためた　エネルギーを　つかいきると
        しんかが　はじまるらしい。
      ja: |-
        エサを　食べず　空腹に　耐える。
        溜めた　エネルギーを　使い切ると
        進化が　始まるらしい。
      ko: |-
        먹이를 먹지 않고 공복으로 버틴다.
        모은 에너지를 다 사용하면
        진화가 시작되는 듯하다.
      zh-Hant: |-
        忍耐飢餓，不吃任何食物。
        據說當牠用盡了儲存的
        能量後，就會開始進化。
      zh-Hans: |-
        可以不吃食物忍受饥饿。
        据说当它用尽积蓄的能量后，
        就会开始进化。
      en: |-
        Shelgon ignores its hunger entirely, never eating
        any food. Apparently, Shelgon will evolve once
        all its energy stores are used up.
      fr: |-
        Il se prive de nourriture, résistant à la faim.
        On dit que son évolution commence lorsque
        ses réserves d’énergie sont épuisées.
      de: |-
        Es ignoriert sein Hungergefühl und isst nichts.
        Draschels Entwicklung setzt anscheinend ein,
        wenn all seine Energiereserven aufgebraucht sind.
      es: |-
        Aguanta el hambre sin comer nada. Al parecer,
        inicia el proceso evolutivo cuando se agota toda
        la energía que tenía acumulada.
      it: |-
        Resta a digiuno, sopportando la fame.
        Sembra che l’evoluzione si inneschi quando
        esaurisce l’energia accumulata.
