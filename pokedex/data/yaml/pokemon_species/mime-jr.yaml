mime-jr:
  base_happiness: 50
  capture_rate: 145
  color: pink
  egg_groups:
    - no-eggs
  evolution_chain: mr-mime
  evolves_from: ~
  flavor_text:
    diamond:
      en: |-
        It habitually mimics foes. Once
        mimicked, the foe cannot take its
        eyes off this Pokémon.
    pearl:
      en: |-
        It likes places where people
        gather. It mimics foes to confuse
        them, then makes its getaway.
    platinum:
      en: |-
        It mimics the expressions and
        motions of those it sees to
        understand the feelings of others.
    heartgold:
      en: |-
        In an attempt to confuse its enemy,
        it mimics the enemy’s movements. Then
        it wastes no time in making itself scarce!
    soulsilver:
      en: |-
        In an attempt to confuse its enemy,
        it mimics the enemy’s movements. Then
        it wastes no time in making itself scarce!
    black:
      en: |-
        It mimics the expressions and
        motions of those it sees to
        understand the feelings of others.
      fr: |-
        Il imite les mouvements et les
        expressions des autres pour
        comprendre leurs sentiments.
    white:
      en: |-
        It mimics the expressions and
        motions of those it sees to
        understand the feelings of others.
      fr: |-
        Il imite les mouvements et les
        expressions des autres pour
        comprendre leurs sentiments.
    black-2:
      en: |-
        It mimics the expressions and
        motions of those it sees to
        understand the feelings of others.
    white-2:
      en: |-
        It mimics the expressions and
        motions of those it sees to
        understand the feelings of others.
    x:
      ja-Hrkt: |-
        あいての　うごきを　そっくりに
        まねを　して　とまどわせている
        あいだに　さっさと　にげるのだ。
      ja: |-
        相手の　動きを　そっくりに
        真似を　して　戸惑わせている
        あいだに　さっさと　逃げるのだ。
      ko: |-
        상대의 움직임을 똑같이
        흉내 내어 당황한
        사이에 재빨리 도망친다.
      en: |-
        In an attempt to confuse its enemy, it mimics the
        enemy’s movements. Then it wastes no time in
        making itself scarce!
      fr: |-
        Il déstabilise ses ennemis en imitant leurs mouvements
        et profite de leur stupeur pour décamper.
      de: |-
        Es ahmt seinen Gegner nach. Während dieser noch
        verblüfft dreinsieht, macht es sich aus dem Staub.
      es: |-
        Desconcierta a sus rivales imitando sus movimientos a
        la perfección y aprovecha para darse a la fuga.
      it: |-
        Imita i movimenti del nemico, approfittando del suo
        momento di confusione per fuggire.
    'y':
      ja-Hrkt: |-
        あいての　うごきを　モノマネする
        しゅうせい。まねを　された　あいては
        めが　はなせなくなる　という。
      ja: |-
        相手の　動きを　モノマネする
        習性。真似を　された　相手は
        目が　離せなくなる　という。
      ko: |-
        상대의 움직임을 흉내 내는
        습성이 있다. 모방을 당한 상대는
        눈을 뗄 수 없게 된다고 한다.
      en: |-
        It habitually mimics foes. Once mimicked, the foe
        cannot take its eyes off this Pokémon.
      fr: |-
        Il imite ses ennemis. Une fois imités, ils ne peuvent
        plus quitter ce Pokémon des yeux.
      de: |-
        Es ahmt seinen Gegner nach. Der kann den Blick
        danach nicht von ihm abwenden.
      es: |-
        Suele imitar a sus enemigos. Cuando lo hace, su rival
        no puede apartar los ojos de él.
      it: |-
        Imita i movimenti dei nemici. Quando un nemico viene
        imitato, non riesce più a distogliere lo sguardo da lui.
    omega-ruby:
      ja-Hrkt: |-
        あいての　うごきを　そっくりに
        まねを　して　とまどわせている
        あいだに　さっさと　にげるのだ。
      ja: |-
        相手の　動きを　そっくりに
        真似を　して　戸惑わせている
        あいだに　さっさと　逃げるのだ。
      ko: |-
        상대의 움직임을 똑같이
        흉내 내어 당황한
        사이에 재빨리 도망친다.
      en: |-
        In an attempt to confuse its enemy, it mimics the
        enemy’s movements. Then it wastes no time in
        making itself scarce!
      fr: |-
        Il déstabilise ses ennemis en imitant leurs mouvements
        et profite de leur stupeur pour décamper.
      de: |-
        Es ahmt seinen Gegner nach. Während dieser noch verblüfft
        dreinsieht, macht es sich aus dem Staub.
      es: |-
        Desconcierta a sus rivales imitando sus movimientos a la
        perfección y aprovecha para darse a la fuga.
      it: |-
        Imita i movimenti del nemico, approfittando del suo momento
        di confusione per fuggire.
    alpha-sapphire:
      ja-Hrkt: |-
        あいての　うごきを　モノマネする
        しゅうせい。まねを　された　あいては
        めが　はなせなくなる　という。
      ja: |-
        相手の　動きを　モノマネする
        習性。真似を　された　相手は
        目が　離せなくなる　という。
      ko: |-
        상대의 움직임을 흉내 내는
        습성이 있다. 모방을 당한 상대는
        눈을 뗄 수 없게 된다고 한다.
      en: |-
        It habitually mimics foes. Once mimicked, the foe
        cannot take its eyes off this Pokémon.
      fr: |-
        Il imite ses ennemis. Une fois imités, ils ne peuvent plus
        quitter ce Pokémon des yeux.
      de: |-
        Es ahmt seinen Gegner nach. Der kann den Blick danach nicht
        von ihm abwenden.
      es: |-
        Suele imitar a sus enemigos. Cuando lo hace, su rival no
        puede apartar los ojos de él.
      it: |-
        Imita i movimenti dei nemici. Quando un nemico viene imitato,
        non riesce più a distogliere lo sguardo da lui.
    ultra-sun:
      ja-Hrkt: |-
        あいての　うごきや　ひょうじょうを
        いっしょうけんめいに　まねる。
        まだまだ　うまいとは　いえない。
      ja: |-
        相手の　動きや　表情を
        一生懸命に　真似る。
        まだまだ　うまいとは　いえない。
      ko: |-
        상대의 움직임과 표정을
        열심히 흉내 낸다.
        아직 잘한다고는 할 수 없다.
      zh-Hant: |-
        會拼命模仿對方的
        動作和表情，
        但還算不上模仿得很好。
      zh-Hans: |-
        会拼命地模仿对方的动作和表情。
        但还说不上模仿得很好。
      en: |-
        It does its absolute best to mimic the
        movements and expressions of its opponents,
        but it’s still not very good at it.
      fr: |-
        Il fait de son mieux pour imiter les gestes
        et les expressions de ses adversaires,
        mais il a encore des progrès à faire.
      de: |-
        Ahmt die Bewegungen und Gesichtsausdrücke
        anderer so gut es kann nach. Leider lassen
        seine Fähigkeiten noch zu wünschen übrig.
      es: |-
        Imita los movimientos y las expresiones de otros
        tan bien como puede, aunque aún le queda
        mucho por mejorar.
      it: |-
        Ce la mette tutta per imitare i movimenti e le
        espressioni dell’avversario, ma non è ancora
        molto bravo.
    ultra-moon:
      ja-Hrkt: |-
        モノマネが　とくい。　あいてが
        おどろくと　うれしくなって　ついつい
        まねしているのを　わすれてしまう。
      ja: |-
        モノマネが　得意。　相手が
        驚くと　嬉しくなって　ついつい
        真似しているのを　忘れてしまう。
      ko: |-
        흉내내기가 특기다.
        상대가 놀라면 기쁜 나머지
        흉내 내고 있다는 사실을 잊어버린다.
      zh-Hant: |-
        擅長模仿。對方如果因此吃驚，
        牠就會很開心，甚至不知不覺
        忘了自己正在模仿這件事。
      zh-Hans: |-
        擅长模仿。如果对方因此大吃一惊，
        它就会很开心，甚至不知不觉
        忘记了自己正在模仿这件事。
      en: |-
        When this gifted mimic surprises an opponent,
        Mime Jr. feels so happy that it ends up
        forgetting it was imitating something.
      fr: |-
        Quand un adversaire reste bouche bée face
        à ses talents de mime, il est tellement content
        qu’il en oublie de continuer sa performance.
      de: |-
        Andere nachzuahmen ist sein Steckenpferd.
        Kann es sie damit verblüffen, freut es sich so
        sehr, dass es sogar das Imitieren vergisst.
      es: |-
        Es un gran imitador. Cuando logra sorprender a
        su adversario, la alegría le embarga de tal forma
        que se olvida de continuar su actuación.
      it: |-
        Le imitazioni sono la sua specialità. Se riesce a
        disorientare il nemico, la sua felicità è tale che
        si interrompe nel bel mezzo della performance.
    sword:
      ja-Hrkt: |-
        みるもの　すべての　マネを　する。
        バリコオルの　かれいな　ステップを
        ひたすら　マネして　れんしゅうする。
      ja: |-
        見るもの　すべての　真似を　する。
        バリコオルの　華麗な　ステップを
        ひたすら　真似して　練習する。
      ko: |-
        보이는 모든 것을 흉내 낸다.
        마임꽁꽁의 화려한 스텝을
        끊임없이 흉내 내며 연습한다.
      zh-Hant: |-
        會模仿一切映入眼簾的事物。
        一心一意模仿踏冰人偶
        華麗的舞步，不停地練習。
      zh-Hans: |-
        会模仿一切进入眼帘的事物。
        一心一意模仿踏冰人偶
        华丽的舞步，不停地练习。
      en: |-
        It mimics everyone it sees, but it puts extra
        effort into copying the graceful dance steps
        of Mr. Rime as practice.
      fr: |-
        Il mime tout ce qu’il voit, et s’entraîne beaucoup
        pour reproduire les pas de danse élégants
        des M. Glaquette.
      de: |-
        Dieses Pokémon ahmt alles nach, was es sieht. Es
        übt, indem es fleißig die herrlichen Tanzschritte
        von Pantifrost imitiert.
      es: |-
        Imita todo lo que ve, especialmente los gráciles
        pasos de baile de Mr. Rime, que practica con
        gran tesón.
      it: |-
        Imita chiunque veda. Si esercita con costanza
        imitando gli splendidi passi di danza di Mr. Rime.
    shield:
      ja-Hrkt: |-
        ダンスの　うまい　バリコオルに
        でしの　ように　つきしたがい
        ステップを　けんめいに　マネする。
      ja: |-
        ダンスの　うまい　バリコオルに
        弟子の　ように　付き従い
        ステップを　懸命に　真似する。
      ko: |-
        춤을 잘 추는 마임꽁꽁의
        제자인 것마냥 따라다니며
        스텝을 열심히 흉내 낸다.
      zh-Hant: |-
        像徒弟一樣跟隨著
        擅長跳舞的踏冰人偶，
        拼命模仿牠的舞步。
      zh-Hans: |-
        像徒弟一样跟随着
        擅长跳舞的踏冰人偶，
        拼命模仿它的舞步。
      en: |-
        It looks for a Mr. Rime that’s a good dancer
        and carefully copies the Mr. Rime’s steps
        like an apprentice.
      fr: |-
        Il considère les meilleurs danseurs parmi
        les M. Glaquette comme ses maîtres
        et s’évertue à mimer leurs mouvements.
      de: |-
        Es folgt dem talentierten Tänzer Pantifrost wie
        ein Schüler und imitiert seine Schritte.
      es: |-
        Su admiración por Mr. Rime, un consumado
        danzarín, lo lleva a seguirlo para aprender de él
        e imitar con esmero sus pasos de baile.
      it: |-
        Considera Mr. Rime il proprio maestro
        per le sue doti di ballerino, e ne imita
        diligentemente i passi di danza.
