barbaracle:
  base_happiness: 50
  capture_rate: 45
  color: brown
  egg_groups:
    - water3
  evolution_chain: binacle
  evolves_from: binacle
  flavor_text:
    x:
      ja-Hrkt: |-
        しんかのとき　２ひきの　カメテテが
        ７ひきに　ぶんれつした　ポケモン。
        ７ひきぶんの　パワーで　たたかう。
      ja: |-
        進化のとき　２匹の　カメテテが
        ７匹に　分裂した　ポケモン。
        ７匹分の　パワーで　戦う。
      ko: |-
        진화할 때 2마리의 거북손손이
        7마리로 분열된 포켓몬이다.
        7마리분의 파워로 싸운다.
      en: |-
        When they evolve, two Binacle multiply into seven.
        They fight with the power of seven Binacle.
      fr: |-
        Après évolution, les deux Opermine laissent place
        à sept créatures qui ont la puissance cumulée de
        sept Opermine.
      de: |-
        Es entsteht bei der entwicklungsbedingten Aufspaltung
        der beiden Bithora in sieben Vertreter ihrer Art.
        Gemeinsam verfügen sie über die siebenfache Stärke.
      es: |-
        Al evolucionar, los dos Binacle se dividen y dan lugar
        a siete criaturas que se aglomeran formando un
        Barbaracle y suman su poder al combatir.
      it: |-
        Con l’evoluzione, i due Binacle si moltiplicano e il
        Pokémon lotta con la forza di sette Binacle.
    'y':
      ja-Hrkt: |-
        てあしにも　のうが　あり　かってに
        うごけるが　ふだんは　あたまの
        ガメノデスの　めいれいに　したがう。
      ja: |-
        手足にも　脳が　あり
        勝手に　動けるが　普段は
        頭の　ガメノデスの　命令に　従う。
      ko: |-
        손과 발에도 뇌가 있어 멋대로
        움직일 수 있지만 보통은 머리인
        거북손데스의 명령에 따른다.
      en: |-
        Barbaracle’s legs and hands have minds
        of their own, and they will move independently.
        But they usually follow the head’s orders.
      fr: |-
        Ses jambes et ses bras sont dotés d’une volonté
        propre. Cependant, ils suivent généralement
        les ordres donnés.
      de: |-
        Arme und Beine verfügen über eigene Gehirne, was
        ihnen relative Bewegungsfreiheit gewährt. Sie ordnen
        sich jedoch zumeist den Befehlen des Kopfes unter.
      es: |-
        Si bien todas las extremidades de Barbaracle tienen
        cerebro propio y se mueven a su antojo, suelen
        seguir las órdenes que imparte la cabeza.
      it: |-
        I Binacle delle gambe e delle braccia hanno cervelli
        indipendenti, ma generalmente seguono le direttive
        di quello della testa.
    omega-ruby:
      ja-Hrkt: |-
        しんかのとき　２ひきの　カメテテが
        ７ひきに　ぶんれつした　ポケモン。
        ７ひきぶんの　パワーで　たたかう。
      ja: |-
        進化のとき　２匹の　カメテテが
        ７匹に　分裂した　ポケモン。
        ７匹分の　パワーで　戦う。
      ko: |-
        진화할 때 2마리의 거북손손이
        7마리로 분열된 포켓몬이다.
        7마리분의 파워로 싸운다.
      en: |-
        When they evolve, two Binacle multiply into seven.
        They fight with the power of seven Binacle.
      fr: |-
        Après évolution, les deux Opermine laissent place à sept
        créatures qui ont la puissance cumulée de sept Opermine.
      de: |-
        Es entsteht bei der entwicklungsbedingten Aufspaltung der
        beiden Bithora in sieben Vertreter ihrer Art. Gemeinsam
        verfügen sie über die siebenfache Stärke.
      es: |-
        Al evolucionar, los dos Binacle se dividen y dan lugar a siete
        criaturas que se aglomeran formando un Barbaracle y suman
        su poder al combatir.
      it: |-
        Con l’evoluzione, i due Binacle si moltiplicano e il Pokémon
        lotta con la forza di sette Binacle.
    alpha-sapphire:
      ja-Hrkt: |-
        てあしにも　のうが　あり　かってに
        うごけるが　ふだんは　あたまの
        ガメノデスの　めいれいに　したがう。
      ja: |-
        手足にも　脳が　あり
        勝手に　動けるが　普段は
        頭の　ガメノデスの　命令に　従う。
      ko: |-
        손과 발에도 뇌가 있어 멋대로
        움직일 수 있지만 보통은 머리인
        거북손데스의 명령에 따른다.
      en: |-
        Barbaracle’s legs and hands have minds
        of their own, and they will move independently.
        But they usually follow the head’s orders.
      fr: |-
        Ses jambes et ses bras sont dotés d’une volonté propre.
        Cependant, ils suivent généralement les ordres donnés.
      de: |-
        Arme und Beine verfügen über eigene Gehirne, was ihnen
        relative Bewegungsfreiheit gewährt. Sie ordnen sich jedoch
        zumeist den Befehlen des Kopfes unter.
      es: |-
        Si bien todas las extremidades de Barbaracle tienen cerebro
        propio y se mueven a su antojo, suelen seguir las órdenes
        que imparte la cabeza.
      it: |-
        I Binacle delle gambe e delle braccia hanno cervelli
        indipendenti, ma generalmente seguono le direttive
        di quello della testa.
    sword:
      ja-Hrkt: |-
        ７ひきの　カメテテが　１ぴきぶんの
        からだを　つくっている。　あたまが
        てあしに　めいれいする　しくみ。
      ja: |-
        ７匹の　カメテテが　１匹分の
        体を　つくっている。　頭が
        手足に　命令する　仕組み。
      ko: |-
        7마리의 거북손손이 1마리의
        몸을 이루고 있다. 머리가
        손발에 명령하는 구조다.
      zh-Hant: |-
        ７隻龜腳腳組成了１隻
        龜足巨鎧的身體。
        由頭部對手腳發號施令。
      zh-Hans: |-
        ７只龟脚脚组成了１只
        龟足巨铠的身体。
        由头部对手脚发号施令。
      en: |-
        Seven Binacle come together to form one
        Barbaracle. The Binacle that serves as the head
        gives orders to those serving as the limbs.
      fr: |-
        Sept Opermine s’assemblent pour former
        un Golgopathe. La tête commande les autres
        membres.
      de: |-
        Sein Körper besteht aus sieben verschiedenen
        Bithora, wobei der Kopf das Sagen über die
        anderen Gliedmaßen hat.
      es: |-
        Su cuerpo está formado por siete Binacle. El
        situado en la posición central a modo de cabeza
        suele impartir las órdenes a las extremidades.
      it: |-
        Il suo corpo è formato da sette Binacle.
        Quello che occupa la posizione della testa
        coordina gli altri.
    shield:
      ja-Hrkt: |-
        てのひらの　めだまが　ぜんごさゆうを
        みはる。　ピンチのときは　てあしが
        かってに　うごいて　てきを　たおす。
      ja: |-
        手のひらの　目玉が　前後左右を
        見張る。　ピンチのときは　手足が
        勝手に　動いて　敵を　倒す。
      ko: |-
        손바닥의 눈동자가 전후좌우를
        감시한다. 위기에 처하면 손발이
        멋대로 움직여 적을 쓰러뜨린다.
      zh-Hant: |-
        用手掌上的眼珠來觀察
        前後左右的狀況。遇上危機時
        手腳會自己動起來打倒對手。
      zh-Hans: |-
        用手掌上的眼珠来观察
        前后左右的状况。遇上危机时
        手脚会自己动起来打倒对手。
      en: |-
        Having an eye on each palm allows it to keep
        watch in all directions. In a pinch, its limbs start
        to act on their own to ensure the enemy’s defeat.
      fr: |-
        Il scrute les environs avec les yeux de ses paumes.
        En cas d’urgence, ses membres peuvent prendre
        des initiatives pour triompher de l’ennemi.
      de: |-
        Die Augen auf den Händen überwachen sein
        gesamtes Umfeld. In Notsituationen greifen
        Arme und Beine eigenständig an.
      es: |-
        Los ojos de las manos le permiten ver en todas
        direcciones. En caso de apuro, sus extremidades
        se mueven solas para derribar al enemigo.
      it: |-
        Gli occhi sulle sue mani hanno una visuale a 360
        gradi. Quando è in difficoltà, i suoi arti agiscono
        autonomamente per sconfiggere il nemico.
