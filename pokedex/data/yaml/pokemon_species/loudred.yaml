    white-2:
      en: |-
        The shock waves from its cries can
        tip over trucks. It stamps its
        feet to power up.
    x:
      ja-Hrkt: |-
        おもいきり　すいこんだ　くうきを
        はったつした　ふっきんを　つかって
        はきだすことで　おおごえを　だす。
      ja: |-
        思い切り　吸いこんだ　空気を
        発達した　腹筋を　使って
        吐き出すことで　大声を　出す。
      ko: |-
        마음껏 들이마신 공기를
        발달한 복근을 써서
        토해내 큰 소리를 낸다.
      en: |-
        It shouts loudly by inhaling air, and then uses its
        well-developed stomach muscles to exhale.
      fr: |-
        Grâce à ses puissants muscles abdominaux, il peut
        crier en expulsant l’air qu’il avait aspiré.
      de: |-
        Es atmet tief ein und nutzt seine Bauchmuskeln,
        um die Luft in einem gewaltigen Schrei auszustoßen.
      es: |-
        Aspira profundamente y luego, usando sus fuertes
        abdominales, suelta un potente vozarrón.
      it: |-
        Leva potenti grida inspirando tanta aria e poi
        sparandola fuori con tutta la forza degli addominali.
    'y':
      ja-Hrkt: |-
        おおごえの　しょうげきはで
        トラックを　ひっくりかえしてしまう。
        あしを　ふみならして　パワーアップ。
      ja: |-
        大声の　衝撃波で
        トラックを　ひっくりかえしてしまう。
        足を　踏みならして　パワーアップ。
      ko: |-
        큰 소리의 충격파로
        트럭을 뒤집어 버린다.
        발을 쿵쾅거리며 파워를 올린다.
      en: |-
        The shock waves from its cries can tip over trucks.
        It stamps its feet to power up.
      fr: |-
        L’onde de choc provoquée par son cri peut renverser
        un camion. Il trépigne pour augmenter sa force.
      de: |-
        Die Schockwellen, die durch sein Rufen entstehen,
        können einen LKW umkippen.
      es: |-
        Las ondas de sus gritos pueden voltear un camión.
        Patea el suelo para ganar potencia.
      it: |-
        Le onde d’urto dei suoi versi ribaltano anche i
        camion. Pesta i piedi per accumulare energia.
    omega-ruby:
      ja-Hrkt: |-
        もくぞうの　いえを　コナゴナに　ふきとばすほどの
        おおごえを　だして　あいてを　いためつける。
        まるい　みみが　スピーカーの　はたらきを　する。
      ja: |-
        木造の　家を　コナゴナに　吹き飛ばすほどの
        大声を　出して　相手を　痛めつける。
        丸い　耳が　スピーカーの　働きを　する。
      ko: |-
        나무로 만든 집을 산산조각 내 날려버릴 만큼
        큰 소리를 내어 상대를 혼내준다.
        둥근 귀가 스피커 역할을 한다.
      en: |-
        Loudred’s bellowing can completely decimate a wood-frame
        house. It uses its voice to punish its foes. This Pokémon’s
        round ears serve as loudspeakers.
      fr: |-
        Le hurlement de Ramboum est si fort qu’il peut faire
        s’effondrer une petite maison en bois. Il se sert de sa voix
        pour punir ses ennemis. Les oreilles rondes de ce Pokémon
        servent de haut-parleurs.
      de: |-
        Krakeelos Brüllen kann ein Holzhaus zum Einsturz bringen.
        Es setzt seine Stimme ein, um seine Gegner anzugreifen.
        Die runden Ohren dieses Pokémon dienen als Lautsprecher.
      es: |-
        Los bramidos de Loudred pueden echar abajo una casa
        reforzada con vigas de madera. Este Pokémon usa el vozarrón
        que tiene para castigar a sus rivales. Las orejas redondas le
        sirven de altavoces.
      it: |-
        I suoni assordanti emessi da Loudred sono in grado
        di abbattere anche una casa in legno. La sua voce è
        così potente da poter essere usata come attacco contro
        i nemici. Le sue orecchie tonde fungono da altoparlanti.
    alpha-sapphire:
      ja-Hrkt: |-
        あしを　ふみならしながら　おおごえを　だす。
        おおごえを　だしたあとは　しばらくの　あいだ
        なにも　きこえなくなってしまうのが　じゃくてん。
      ja: |-
        足を　踏み鳴らしながら　大声を　出す。
        大声を　出した後は　しばらくの　間
        なにも　聞こえなくなってしまうのが　弱点。
      ko: |-
        발을 동동 구르면서 큰 소리를 낸다.
        큰 소리를 낸 후에는 잠시 동안
        아무것도 듣지 못하게 되는 것이 약점이다.
      en: |-
        Loudred shouts while stamping its feet. After it finishes
        shouting, this Pokémon becomes incapable of hearing
        anything for a while. This is considered to be a weak point.
      fr: |-
        Ramboum hurle en trépignant. Quand il a fini de hurler,
        ce Pokémon reste incapable d’entendre le moindre son
        pendant un long moment. Il semble que ce soit son point
        faible.
      de: |-
        Krakeelo schreit und stampft mit seinen Füßen auf den Boden.
        Danach kann es für eine Weile nichts hören. Dies scheint die
        Schwachstelle dieses Pokémon zu sein.
      es: |-
        Loudred grita a la vez que da pisotones. Una vez que deja de
        chillar, se queda ensordecido durante un buen rato; lo que se
        considera su punto débil.
      it: |-
        Loudred urla pestando i piedi. Alla fine dei suoi strepiti è
        temporaneamente incapace di udire qualsiasi rumore.
        Questo è considerato il suo punto debole.
    sword:
      ja-Hrkt: |-
        みみは　スピーカーの　やくわり。
        いっけんやを　ふきとばす　いりょくの
        おんぱを　みみから　ほうしゃする。
      ja: |-
        耳は　スピーカーの　役割。
        一軒家を　吹きとばす　威力の
        音波を　耳から　放射する。
      ko: |-
        귀는 스피커 역할을 한다.
        집 한 채를 날려버릴 위력의
        음파를 귀에서 내뿜는다.
      zh-Hant: |-
        耳朵具有擴音器的功能。
        會從耳朵發射出威力足以
        震飛一棟房子的音波。
      zh-Hans: |-
        它的耳朵有着扬声器的功能。
        会从耳朵中发射出威力足以
        掀翻一整座房子的音波。
      en: |-
        Loudred’s ears serve as speakers, and they can
        put out sound waves powerful enough to blow
        away a house.
      fr: |-
        Ses oreilles lui servant de haut-parleurs
        peuvent émettre des ondes sonores dont
        la puissance suffit à balayer une maison.
      de: |-
        Seine Ohren fungieren als Lautsprecher. Mit ihnen
        kann es starke Schallwellen ausstoßen, die ganze
        Häuser zum Einsturz bringen.
      es: |-
        A través de las orejas, que le sirven de altavoces,
        emite ondas sonoras capaces de echar abajo una
        casa.
      it: |-
        Le sue orecchie fungono da altoparlanti e sono
        in grado di emettere onde sonore talmente
        potenti da abbattere una casa.
    shield:
      ja-Hrkt: |-
        おおごえは　ちょうかく　だけでなく
        くうきの　あつりょくとなり　てきを
        ふきとばし　ダメージを　あたえる。
      ja: |-
        大声は　聴覚だけでなく
        空気の　圧力となり　敵を
        吹きとばし　ダメージを　与える。
      ko: |-
        큰 목소리는 청각뿐만 아니라
        공기의 압력마저 변화시켜
        상대를 날려버리고 데미지를 준다.
      zh-Hant: |-
        巨大的叫聲不只會傷害聽覺，
        還會壓縮空氣造成衝擊波
        將對手震飛造成傷害。
      zh-Hans: |-
        它发出的大叫声不仅会刺激听觉，
        还会压缩空气造成冲击波
        将敌人吹飞给予伤害。
      en: |-
        The force of this Pokémon’s loud voice isn’t just
        the sound—it’s also the wave of air pressure that
        blows opponents away and damages them.
      fr: |-
        Ses hurlements n’affectent pas seulement l’ouïe ;
        ils provoquent aussi une onde de choc qui balaie
        les ennemis et leur inflige des dégâts.
      de: |-
        Sein Brüllen ist nicht nur ein Angriff aufs Gehör,
        sondern erzeugt auch Schockwellen, durch die
        Gegner weggefegt und verletzt werden.
      es: |-
        Su voz no afecta solo al oído. Sus ondas sonoras
        provocan variaciones de presión en el aire que
        hacen que sus enemigos salgan despedidos.
      it: |-
        Oltre a colpire l’udito, la sua potente voce
        produce anche delle onde d’urto con le quali
        spazza via e danneggia i nemici.
