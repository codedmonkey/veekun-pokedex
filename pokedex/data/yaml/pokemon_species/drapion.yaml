  flavor_text:
    diamond:
      en: |-
        It has the power in its clawed
        arms to make scrap of a car. The
        tips of its claws release poison.
    pearl:
      en: |-
        Its body is encased in a sturdy
        shell. Its head rotates 180
        degrees, eliminating blind spots.
    platinum:
      en: |-
        Possessing a sturdy build, it takes
        pride in its strength, taking down
        foes without using toxins.
    heartgold:
      en: |-
        It attacks people and Pokémon that
        cross the desert. This has only
        furthered its bad reputation.
    soulsilver:
      en: |-
        It attacks people and Pokémon that
        cross the desert. This has only
        furthered its bad reputation.
    black:
      en: |-
        Possessing a sturdy build, it takes
        pride in its strength, taking down
        foes without using toxins.
      fr: |-
        Fier et robuste, il met un point
        d’honneur à battre ses adversaires
        sans utiliser de poison.
    white:
      en: |-
        Possessing a sturdy build, it takes
        pride in its strength, taking down
        foes without using toxins.
      fr: |-
        Fier et robuste, il met un point
        d’honneur à battre ses adversaires
        sans utiliser de poison.
    black-2:
      en: |-
        It takes pride in its strength.
        Even though it can tear foes apart,
        it finishes them off with powerful poison.
    white-2:
      en: |-
        It takes pride in its strength.
        Even though it can tear foes apart,
        it finishes them off with powerful poison.
    x:
      ja-Hrkt: |-
        じまんの　パワーで　あいてを
        ばらばらに　できるのに　さらに
        もうどくで　とどめを　さすのだ。
      ja: |-
        自慢の　パワーで　相手を
        ばらばらに　できるのに　さらに
        猛毒で　とどめを　刺すのだ。
      ko: |-
        자랑거리인 파워로 상대를
        조각조각 낼 수 있으며 게다가
        맹독으로 마무리한다.
      en: |-
        It takes pride in its strength. Even though it can
        tear foes apart, it finishes them off with
        powerful poison.
      fr: |-
        Il met ses adversaires en pièces grâce à sa
        prodigieuse force, puis donne le coup de grâce avec
        son violent poison.
      de: |-
        Es bringt seine Gegner mit starkem Gift zur Strecke,
        obwohl es weiß, dass es stark genug ist, um sie
        zu zerfetzen.
      es: |-
        Aunque sabe que puede aplastar al rival con su gran
        fuerza, le gusta dar el golpe de gracia con su virulento
        veneno.
      it: |-
        Va fiero della sua forza con cui può fare a pezzi il
        nemico, ma in genere preferisce finirlo usando le
        sue tossine.
    'y':
      ja-Hrkt: |-
        りょううでの　ツメは　じどうしゃを
        スクラップにする　はかいりょく。
        ツメの　さきから　どくを　だす。
      ja: |-
        両腕の　ツメは　自動車を
        スクラップにする　破壊力。
        ツメの　先から　毒を　出す。
      ko: |-
        양팔의 발톱은 자동차를
        동강 내는 파괴력이 있다.
        발톱의 끝에서 독을 뿌린다.
      en: |-
        It has the power in its clawed arms to make scrap
        of a car. The tips of its claws release poison.
      fr: |-
        Il peut réduire une voiture en pièces avec ses pinces.
        Le bout de ses pinces contient du poison.
      de: |-
        In seinen Armen steckt so viel Kraft, dass es mit
        seinen giftigen Krallen Autos zerquetschen kann.
      es: |-
        Sus brazos tienen fuerza para destrozar un coche.
        La punta de sus zarpas segrega veneno.
      it: |-
        Con le zampe può accartocciare una macchina.
        Le punte degli artigli sono velenose.
    omega-ruby:
      ja-Hrkt: |-
        じまんの　パワーで　あいてを
        ばらばらに　できるのに　さらに
        もうどくで　とどめを　さすのだ。
      ja: |-
        自慢の　パワーで　相手を
        ばらばらに　できるのに　さらに
        猛毒で　とどめを　刺すのだ。
      ko: |-
        자랑거리인 파워로 상대를
        조각조각 낼 수 있으며 게다가
        맹독으로 마무리한다.
      en: |-
        It takes pride in its strength. Even though it can
        tear foes apart, it finishes them off with
        powerful poison.
      fr: |-
        Il met ses adversaires en pièces grâce à sa prodigieuse force,
        puis donne le coup de grâce avec son violent poison.
      de: |-
        Es bringt seine Gegner mit starkem Gift zur Strecke, obwohl es
        weiß, dass es stark genug ist, um sie zu zerfetzen.
      es: |-
        Aunque sabe que puede aplastar al rival con su gran fuerza,
        le gusta dar el golpe de gracia con su virulento veneno.
      it: |-
        Va fiero della sua forza con cui può fare a pezzi il nemico,
        ma in genere preferisce finirlo usando le sue tossine.
    alpha-sapphire:
      ja-Hrkt: |-
        りょううでの　ツメは　じどうしゃを
        スクラップにする　はかいりょく。
        ツメの　さきから　どくを　だす。
      ja: |-
        両腕の　ツメは　自動車を
        スクラップにする　破壊力。
        ツメの　先から　毒を　出す。
      ko: |-
        양팔의 발톱은 자동차를
        동강 내는 파괴력이 있다.
        발톱의 끝에서 독을 뿌린다.
      en: |-
        It has the power in its clawed arms to make scrap
        of a car. The tips of its claws release poison.
      fr: |-
        Il peut réduire une voiture en pièces avec ses pinces.
        Le bout de ses pinces contient du poison.
      de: |-
        In seinen Armen steckt so viel Kraft, dass es mit seinen
        giftigen Krallen Autos zerquetschen kann.
      es: |-
        Sus brazos tienen fuerza para destrozar un coche. La punta
        de sus zarpas segrega veneno.
      it: |-
        Con le zampe può accartocciare una macchina.
        Le punte degli artigli sono velenose.
    sword:
      ja-Hrkt: |-
        もうどくを　もつが　つかうことは
        まれ。　くるまも　たたきつぶす
        かいりきで　あばれまわる。
      ja: |-
        猛毒を　もつが　使うことは
        まれ。　車も　叩きつぶす
        怪力で　暴れまわる。
      ko: |-
        맹독을 지녔지만 사용하는 일은
        드물다. 자동차도 때려 부수는
        괴력으로 마구 날뛴다.
      zh-Hant: |-
        雖然擁有劇毒，但只有在
        極少數的情況下才會使用。
        會用能敲爛汽車的怪力亂打一通。
      zh-Hans: |-
        虽然拥有剧毒，但只有在
        极少数的情况下才会使用。
        会用能敲烂汽车的怪力乱打一通。
      en: |-
        Its poison is potent, but it rarely sees use. This
        Pokémon prefers to use physical force instead,
        going on rampages with its car-crushing strength.
      fr: |-
        Son poison est violent, mais il s’en sert très
        rarement. Il se déchaîne avec une telle force
        qu’il pourrait réduire une voiture en pièces.
      de: |-
        Sein Gift ist stark, aber es setzt es nur selten ein.
        Ist es richtig wütend, schlägt es mit einer Wucht
        zu, die selbst Autos zu Schrott verarbeitet.
      es: |-
        Posee un veneno muy potente, pero que usa muy
        poco. Con la extraordinaria fuerza que concentra
        al enfurecerse podría hacer añicos un coche.
      it: |-
        Le sue tossine sono letali ma se ne serve di rado.
        Semina distruzione con la sua forza prodigiosa
        che gli permette di sfasciare persino automobili.
    shield:
      ja-Hrkt: |-
        すなのあくま　と　よばれるほど
        どうもうだが　カバルドンには
        ケンカも　うらず　おとなしい。
      ja: |-
        砂の悪魔と　呼ばれるほど
        獰猛だが　カバルドンには
        ケンカも　売らず　おとなしい。
      ko: |-
        사막의 악마라고 불릴 정도로
        사납지만 하마돈에게는
        싸움도 걸지 않고 얌전하다.
      zh-Hant: |-
        雖然猙獰凶猛到被人們
        稱為沙之惡魔，但在河馬獸
        面前卻表現得低調溫順。
      zh-Hans: |-
        虽然狰狞凶猛到被人们
        称为沙之恶魔，但在河马兽
        面前却表现得低调温顺。
      en: |-
        It’s so vicious that it’s called the Sand Demon.
        Yet when confronted by Hippowdon, Drapion
        keeps a low profile and will never pick a fight.
      fr: |-
        Sa férocité lui a valu le surnom de « démon
        du désert », mais face à un Hippodocus, il est
        parfaitement docile et évite de le provoquer.
      de: |-
        Es wird auch „Wüstendämon“ genannt, weil es so
        grausam ist. Nur mit Hippoterus legt es sich nie
        an, sondern verhält sich ruhig.
      es: |-
        Su ferocidad le ha granjeado el sobrenombre
        del Diablo de la Arena, pero en presencia de
        los Hippowdon se muestra dócil y pacífico.
      it: |-
        È chiamato “demone della sabbia” per via della
        sua ferocia, ma in presenza di Hippowdon
        se ne sta tranquillo ed evita di provocarlo.
