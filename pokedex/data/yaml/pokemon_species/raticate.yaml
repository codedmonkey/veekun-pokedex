    white-2:
      en: |-
        With its long fangs, this surprisingly
        violent Pokémon can gnaw away
        even thick concrete with ease.
    x:
      ja-Hrkt: |-
        のびつづける　まえばを　けずるため
        かたい　ものを　かじる　しゅうせい。
        ブロックべいも　かじって　こわす。
      ja: |-
        伸び続ける　前歯を　削るため
        硬い　ものを　かじる　習性。
        ブロック塀も　かじって　壊す。
      ko: |-
        계속 자라는 앞니를 갈아내려고
        딱딱한 것을 갉는 습성이 있다.
        벽돌로 된 벽도 갉아서 부순다.
      en: |-
        It whittles its constantly growing fangs by gnawing
        on hard things. It can chew apart cinder walls.
      fr: |-
        Il grignote sans cesse pour apaiser la poussée de ses
        crocs. Il peut transpercer un mur de parpaings.
      de: |-
        Es wetzt seine ständig wachsenden Zähne an
        harten Dingen. Es kann Wände aus Beton zernagen.
      es: |-
        Lima sus colmillos royendo objetos duros. Con ellos
        puede destruir incluso paredes de hormigón.
      it: |-
        Si affila le zanne in perenne crescita rosicchiando
        cose dure. Riesce a frantumare persino i muri.
    'y':
      ja-Hrkt: |-
        うしろあしに　ついた　みずかきを
        つかって　かわをわたり　ひろい
        はんいで　エサを　さがしまわる。
      ja: |-
        後ろ足に　ついた　水かきを　使って
        川を　渡り　広い　範囲で
        エサを　探し回る。
      ko: |-
        뒷다리에 달린 물갈퀴를
        사용하여 강을 건너 넓은
        범위에서 먹이를 찾아다닌다.
      en: |-
        The webs on its hind legs enable it to cross rivers.
        It searches wide areas for food.
      fr: |-
        Ses pattes arrière lui permettent de traverser les
        rivières. Il est toujours en quête de nourriture.
      de: |-
        Auf der Suche nach Nahrung kann es mit den
        Schwimmhäuten an seinen Hinterbeinen
        Flüsse durchqueren.
      es: |-
        Con las membranas de las patas traseras, puede
        atravesar ríos. Busca su alimento en zonas extensas.
      it: |-
        Attraversa i fiumi con le zampe posteriori palmate.
        Perlustra vaste aree cercando cibo.
    omega-ruby:
      ja-Hrkt: |-
        じょうぶな　キバは　どんどん　のびるので
        いわや　たいぼくを　かじって　けずっている。
        いえの　カベを　かじられる　ことも　あるよ。
      ja: |-
        丈夫な　キバは　どんどん　伸びるので
        岩や　大木を　かじって　削っている。
        家の　カベを　かじられる　ことも　あるよ。
      ko: |-
        튼튼한 이빨은 계속 자라기 때문에
        바위나 큰 나무를 갉아서 갈아낸다.
        집의 벽을 갉아 놓기도 한다.
      en: |-
        Raticate’s sturdy fangs grow steadily. To keep them ground
        down, it gnaws on rocks and logs. It may even chew on the
        walls of houses.
      fr: |-
        Les crocs robustes de Rattatac poussent constamment.
        Pour éviter qu’ils raclent le sol, il se fait les dents sur
        des cailloux ou des troncs d’arbre. Il lui arrive même
        de ronger les murs des maisons.
      de: |-
        Rattikarls kräftige Zähne wachsen ständig. Deshalb nagt es
        unablässig Steine und Baumstämme an, um sie abzuwetzen.
        Manchmal knabbert es sogar Hauswände an.
      es: |-
        A Raticate le crecen los incisivos firmes y fuertes.
        Para mantenerlos afilados roe troncos y rocas, e incluso
        las paredes de las casas.
      it: |-
        Le potenti zanne di Raticate crescono in continuazione.
        Per ridurne la crescita rode rocce e tronchi. Spesso si vedono
        i segni delle sue zanne anche sui muri delle case.
    alpha-sapphire:
      ja-Hrkt: |-
        じょうぶな　キバは　どんどん　のびるので
        いわや　たいぼくを　かじって　けずっている。
        いえの　カベを　かじられる　ことも　あるよ。
      ja: |-
        丈夫な　キバは　どんどん　伸びるので
        岩や　大木を　かじって　削っている。
        家の　カベを　かじられる　ことも　あるよ。
      ko: |-
        튼튼한 이빨은 계속 자라기 때문에
        바위나 큰 나무를 갉아서 갈아낸다.
        집의 벽을 갉아 놓기도 한다.
      en: |-
        Raticate’s sturdy fangs grow steadily. To keep them
        ground down, it gnaws on rocks and logs. It may
        even chew on the walls of houses.
      fr: |-
        Les crocs robustes de Rattatac poussent constamment.
        Pour éviter qu’ils raclent le sol, il se fait les dents sur
        des cailloux ou des troncs d’arbre. Il lui arrive même
        de ronger les murs des maisons.
      de: |-
        Rattikarls kräftige Zähne wachsen immer nach. Deshalb nagt
        es ständig Steine und Baumstämme an. Manchmal knabbert es
        sogar Hauswände an.
      es: |-
        A Raticate le crecen los incisivos firmes y fuertes.
        Para mantenerlos afilados roe troncos y rocas, e incluso
        las paredes de las casas.
      it: |-
        Le potenti zanne di Raticate crescono in continuazione.
        Per ridurne la crescita rode rocce e tronchi. Spesso si vedono
        i segni delle sue zanne anche sui muri delle case.
    sun:
      ja-Hrkt: |-
        およぐのが　とくい。　うしろあしに
        ちいさな　みずかきが　ついていて
        かわや　ときに　うみを　わたることも。
      ja: |-
        泳ぐのが　得意。　後ろ足に
        小さな　水かきが　ついていて
        河や　ときに　海を　渡ることも。
      ko: |-
        수영이 특기. 뒷발에
        작은 물갈퀴가 달려있어
        강 때로는 바다를 건너기도 한다.
      zh-Hant: |-
        擅長游泳。後腳帶有小小的足蹼，
        會游過河流，有時還會渡過大海。
      zh-Hans: |-
        游泳很在行。后脚带有小小的蹼，
        会渡过河流，有时还会渡过大海。
      en: |-
        Its hind feet are webbed, so it’s a strong
        swimmer. It can cross rivers and sometimes
        even oceans.
      fr: |-
        C’est un très bon nageur. Les doigts de ses
        pattes arrière sont palmés, ce qui lui permet de
        traverser les rivières et parfois même les mers.
      de: |-
        Ein guter Schwimmer. An seinen Hinterläufen
        hat es Schwimmhäute, mit denen es Flüsse
        und manchmal sogar Meere durchquert.
      es: |-
        Es un excelente nadador. Gracias a las
        pequeñas membranas de sus patas traseras
        puede cruzar ríos y, en ocasiones, hasta mares.
      it: |-
        Abile nuotatore, attraversa fiumi e a volte
        persino il mare grazie alle minuscole membrane
        tra le dita delle zampe posteriori.
    moon:
      ja-Hrkt: |-
        みためよりも　ずっと　きょうぼうな
        せいしつ。　かおの　まえに　てを
        のばすと　かみちぎられる　かも。
      ja: |-
        見た目よりも　ずっと　凶暴な
        性質。　顔の　前に　手を
        伸ばすと　噛み千切られる　かも。
      ko: |-
        겉모습보다 훨씬 난폭한
        성질을 가졌다. 얼굴 앞에 손을
        내밀면 물어뜯길 수도 있다.
      zh-Hant: |-
        性格比外表看來殘暴得多。
        如果把手伸到牠面前，
        或許會被一口咬斷。
      zh-Hans: |-
        性格比外表看起来凶残得多。
        如果把手伸到面前，
        或许会被一口咬断。
      en: |-
        Its disposition is far more violent than its looks
        would suggest. Don’t let your hand get too close
        to its face, as it could bite your hand clean off.
      fr: |-
        Beaucoup plus agressif qu’il n’en a l’air, mieux
        vaut éviter de lui tendre la main si l’on veut la
        récupérer entière.
      de: |-
        Es ist aggressiver, als sein Äußeres vermuten
        lässt. Hält man einen Finger vor sein Gesicht,
        muss man damit rechnen, dass es hineinbeißt.
      es: |-
        No hay que dejarse engañar por su aspecto,
        pues es más feroz de lo que parece. Si alguien
        intenta tocarlo, puede llevarse un mordisco.
      it: |-
        È molto più feroce di quanto non sembri.
        Se si allunga una mano verso di lui, potrebbe
        staccarla con un morso.
    ultra-sun:
      ja-Hrkt: |-
        うしろあしの　ちいさい　みずかきで
        うみを　およいで　しまを　わたり
        てきから　にげていた　という。
      ja: |-
        後ろ足の　小さい　水かきで
        海を　泳いで　島を　渡り
        敵から　逃げていた　という。
      ko: |-
        뒷발의 작의 물갈퀴로
        바다를 헤엄쳐 섬을 건너
        적을 피해 도망쳤다고 한다.
      zh-Hant: |-
        據說牠為了躲避敵人，
        會用後腳的小蹼在海中游泳，
        渡海逃往別的島嶼。
      zh-Hans: |-
        据说会用后脚上小小的蹼
        泅水渡海，穿越岛屿
        来躲避敌人的追击。
      en: |-
        People say that it fled from its enemies by
        using its small webbed hind feet to swim
        from island to island in Alola.
      fr: |-
        Les petites palmes de ses pattes postérieures
        lui permettraient de se rendre d’île en île
        à la nage afin d’échapper à ses prédateurs.
      de: |-
        Auf der Flucht vor seinen Feinden nutzt es die
        Schwimmhäute an seinen Hinterläufen, um von
        Insel zu Insel zu schwimmen.
      es: |-
        Las pequeñas membranas que tiene en las
        patas traseras le permiten nadar entre las islas
        de Alola y escapar así de sus depredadores.
      it: |-
        Si dice che sia sfuggito ai nemici nuotando da
        un’isola all’altra grazie alle minuscole membrane
        tra le dita delle zampe posteriori.
    ultra-moon:
      ja-Hrkt: |-
        ヒゲは　バランスを　とる　たいせつな
        きかん。　どんなに　なかよくなっても
        さわられると　おこって　かみつく。
      ja: |-
        ヒゲは　バランスを　とる　大切な
        器官。　どんなに　仲良くなっても
        触られると　怒って　噛みつく。
      ko: |-
        수염은 밸런스를 잡기 위한 중요한
        기관이다. 아무리 친해져도
        만지면 화를 내며 문다.
      zh-Hant: |-
        鬍鬚是用來保持平衡的重要器官。
        就算感情再好，如果摸了牠的鬍鬚，
        牠都會生氣地咬過來。
      zh-Hans: |-
        胡须是用来保持平衡的重要器官。
        即使感情再好，只要摸了它的胡须，
        它就会发火咬你。
      en: |-
        Its whiskers are essential for maintaining its
        balance. No matter how friendly you are, it will
        get angry and bite you if you touch its whiskers.
      fr: |-
        Il se sert de ses moustaches pour garder
        l’équilibre. Que le Rattatac soit apprivoisé
        ou non, ne le touchez pas ou il vous mordrait !
      de: |-
        Mit seinen Barthaaren hält es die Balance.
        Berührt man sie, wird es wütend und beißt zu,
        egal, wie zutraulich es auch sein mag.
      es: |-
        Mantiene el equilibrio gracias a sus bigotes.
        Aunque le coja confianza a alguien, uno puede
        llevarse un mordisco si intenta tocarlo.
      it: |-
        Usa i baffi per mantenersi in equilibrio.
        Se qualcuno li sfiora, si arrabbia e morde anche
        quelli a cui è molto affezionato.
    lets-go-pikachu:
      ja-Hrkt: |-
        うしろあしにある　ちいさな　みずかきで
        かわを　およぐのは　みずのなかの
        エサを　とるためだ。
      ja: |-
        後ろ足にある　小さな　水かきで
        川を　泳ぐのは　水の中の
        エサを　捕るためだ。
      ko: |-
        뒷다리에 달린 작은 물갈퀴로
        강을 헤엄치는 이유는 물속에 있는
        먹이를 잡기 위해서다.
      zh-Hant: |-
        為了取得水中的食物，
        牠會利用後腳上的小蹼
        在河裡游泳。
      zh-Hans: |-
        它的后脚上长着
        小蹼，以便它在
        水中游泳寻找食物。
      en: |-
        Its hind feet are webbed. They act as flippers,
        so it can swim in rivers and hunt for prey.
      fr: |-
        Ses pattes arrière sont palmées. Il peut donc
        poursuivre sa proie dans les cours d’eau et
        les rivières.
      de: |-
        Die Hinterbeine dieses Pokémon verfügen über
        kleine Schwimmhäute. So kann es in Flüssen
        jagen.
      es: |-
        Gracias a las pequeñas membranas de las patas
        traseras, puede nadar por los ríos para capturar
        presas.
      it: |-
        Dispone di zampe posteriori palmate che
        gli permettono di nuotare nei fiumi in cerca
        di prede.
    lets-go-eevee:
      ja-Hrkt: |-
        うしろあしにある　ちいさな　みずかきで
        かわを　およぐのは　みずのなかの
        エサを　とるためだ。
      ja: |-
        後ろ足にある　小さな　水かきで
        川を　泳ぐのは　水の中の
        エサを　捕るためだ。
      ko: |-
        뒷다리에 달린 작은 물갈퀴로
        강을 헤엄치는 이유는 물속에 있는
        먹이를 잡기 위해서다.
      zh-Hant: |-
        為了取得水中的食物，
        牠會利用後腳上的小蹼
        在河裡游泳。
      zh-Hans: |-
        它的后脚上长着
        小蹼，以便它在
        水中游泳寻找食物。
      en: |-
        Its hind feet are webbed. They act as flippers,
        so it can swim in rivers and hunt for prey.
      fr: |-
        Ses pattes arrière sont palmées. Il peut donc
        poursuivre sa proie dans les cours d’eau et
        les rivières.
      de: |-
        Die Hinterbeine dieses Pokémon verfügen über
        kleine Schwimmhäute. So kann es in Flüssen
        jagen.
      es: |-
