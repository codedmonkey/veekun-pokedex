simipour:
  base_happiness: 70
  capture_rate: 75
  color: blue
  egg_groups:
    - ground
  evolution_chain: panpour
  evolves_from: panpour
  flavor_text:
    black:
      en: |-
        The tuft on its head holds water. When
        the level runs low, it replenishes the
        tuft by siphoning up water with its tail.
      fr: |-
        Il stocke de l’eau dans les mèches de sa
        tête. Quand il est à sec, il se ravitaille
        en aspirant de l’eau par la queue.
    white:
      en: |-
        The high-pressure water expelled
        from its tail is so powerful,
        it can destroy a concrete wall.
      fr: |-
        Le jet d’eau à haute pression qu’il
        propulse par la queue est assez puissant
        pour traverser un mur de béton.
    black-2:
      en: |-
        It prefers places with clean water.
        When its tuft runs low, it replenishes
        it by siphoning up water with its tail.
    white-2:
      en: |-
        It prefers places with clean water.
        When its tuft runs low, it replenishes
        it by siphoning up water with its tail.
    x:
      ja-Hrkt: |-
        しっぽから　こうあつの　みずを
        はっしゃすると　コンクリートの
        かべも　はかいする　いりょく。
      ja: |-
        尻尾から　高圧の　水を　発射すると
        コンクリートの　壁も
        破壊する　威力。
      ko: |-
        꼬리에서 발사하는 고압의 물은
        콘크리트 벽도 파괴할 수 있는
        위력을 지녔다.
      en: |-
        The high-pressure water expelled from its tail is so
        powerful, it can destroy a concrete wall.
      fr: |-
        Le jet d’eau à haute pression qu’il propulse par la
        queue est assez puissant pour traverser un mur de
        béton.
      de: |-
        Es schießt mit so hohem Druck Wasser
        aus seinem Schweif, dass selbst Betonwände
        den Kürzeren ziehen.
      es: |-
        Cuando lanza agua a alta presión con su cola, puede
        incluso resquebrajar una pared de cemento.
      it: |-
        Spruzza dalla coda un getto d’acqua ad alta
        pressione, con una potenza tale da distruggere
        anche pareti di cemento.
    'y':
      ja-Hrkt: |-
        みずが　きれいな　ばしょを　このむ。
        あたまに　ためこんだ　みずがへると
        しっぽから　すいあげて　ほきゅう。
      ja: |-
        水が　きれいな　場所を　好む。
        頭に　ためこんだ　水が減ると
        尻尾から　吸いあげて　補給。
      ko: |-
        물이 깨끗한 장소를 좋아한다.
        머리에 모아둔 물이 줄어들면
        꼬리에서 빨아올려 보급한다.
      en: |-
        It prefers places with clean water. When its tuft runs
        low, it replenishes it by siphoning up water with
        its tail.
      fr: |-
        Il aime les endroits où l’eau est pure. Il se ravitaille
        en eau en l’aspirant avec sa queue.
      de: |-
        Hält sich bevorzugt in reinen Gewässern auf.
        Geht ihm das Wasser in seinem Kopf aus,
        tankt es mit seinem Schweif nach.
      es: |-
        Le encantan los lugares con agua limpia. Cuando
        desciende el nivel de agua de su pelo, se abastece
        a través de su cola.
      it: |-
        Predilige i luoghi dove l’acqua è pura. Se l’acqua
        che ha sul capo diminuisce, ne aggiunge altra
        aspirandola con la coda.
    omega-ruby:
