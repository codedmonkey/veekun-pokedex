sylveon:
  base_happiness: 50
  capture_rate: 45
  color: pink
  egg_groups:
    - ground
  evolution_chain: eevee
  evolves_from: eevee
  flavor_text:
    x:
      ja-Hrkt: |-
        リボンのような　しょっかくから
        きもちを　やわらげる　はどうを
        おくりこみ　たたかいを　やめさせる。
      ja: |-
        リボンのような　触覚から
        気持ちを　和らげる　波動を　送りこみ
        戦いを　やめさせる。
      ko: |-
        리본 모양의 더듬이에서
        마음을 온화하게 하는 파동을
        보내 싸움을 그만두게 한다.
      en: |-
        It sends a soothing aura from its
        ribbonlike feelers to calm fights.
      fr: |-
        Pour arrêter le combat, il émet des ondes apaisantes
        avec ses rubans.
      de: |-
        Seinen bandförmigen Fühlern lässt
        es beruhigende Wellen entströmen,
        die das Ende von Kämpfen herbeiführen.
      es: |-
        A través de sus apéndices sensitivos con forma de
        cinta, emite unas ondas tranquilizadoras mediante las
        cuales detiene los combates.
      it: |-
        Le sue antenne simili a fiocchetti emettono onde dagli
        effetti rilassanti, grazie alle quali fa cessare le lotte.
    'y':
      ja-Hrkt: |-
        だいすきな　トレーナーの　うでに
        リボンのような　しょっかくを
        まきつけて　いっしょに　あるく。
      ja: |-
        大好きな　トレーナーの　腕に
        リボンのような　触覚を　巻きつけて
        一緒に　歩く。
      ko: |-
        좋아하는 트레이너의 팔에
        리본 모양의 더듬이를
        감고 함께 걷는다.
      en: |-
        It wraps its ribbonlike feelers around
        the arm of its beloved Trainer
        and walks with him or her.
      fr: |-
        Il enroule ses rubans sensoriels autour du bras de
        son Dresseur adoré et chemine paisiblement à
        ses côtés.
      de: |-
        Es umwickelt den Arm seines geliebten Trainers mit
        seinen bandförmigen Fühlern und geht so mit ihm
        spazieren.
      es: |-
        Enrolla sus apéndices sensoriales con forma de cinta
        en los brazos de su querido Entrenador cuando
        caminan juntos.
      it: |-
        Se si affeziona particolarmente al suo Allenatore, lo
        accompagna circondandogli amorevolmente il braccio
        con le sue antenne a forma di fiocchetto.
    omega-ruby:
      ja-Hrkt: |-
        リボンのような　しょっかくから
        きもちを　やわらげる　はどうを
        おくりこみ　たたかいを　やめさせる。
      ja: |-
        リボンのような　触覚から
        気持ちを　和らげる　波動を　送りこみ
        戦いを　やめさせる。
      ko: |-
        리본 모양의 더듬이에서
        마음을 온화하게 하는 파동을
        보내 싸움을 그만두게 한다.
      en: |-
        It sends a soothing aura from its
        ribbonlike feelers to calm fights.
      fr: |-
        Pour arrêter le combat, il émet des ondes apaisantes
        avec ses rubans.
      de: |-
        Seinen bandförmigen Fühlern lässt es beruhigende Wellen
        entströmen, die das Ende von Kämpfen herbeiführen.
      es: |-
        A través de sus apéndices sensitivos con forma de cinta,
        emite unas ondas tranquilizadoras mediante las cuales
        detiene los combates.
      it: |-
        Le sue antenne simili a fiocchetti emettono onde dagli effetti
        rilassanti, grazie alle quali fa cessare le lotte.
    alpha-sapphire:
      ja-Hrkt: |-
        だいすきな　トレーナーの　うでに
        リボンのような　しょっかくを
        まきつけて　いっしょに　あるく。
      ja: |-
        大好きな　トレーナーの　腕に
        リボンのような　触覚を　巻きつけて
        一緒に　歩く。
      ko: |-
        좋아하는 트레이너의 팔에
        리본 모양의 더듬이를
        감고 함께 걷는다.
      en: |-
        It wraps its ribbonlike feelers around
        the arm of its beloved Trainer
        and walks with him or her.
      fr: |-
        Il enroule ses rubans sensoriels autour du bras de son
        Dresseur adoré et chemine paisiblement à ses côtés.
      de: |-
        Es umwickelt den Arm seines geliebten Trainers mit seinen
        bandförmigen Fühlern und geht so mit ihm spazieren.
      es: |-
        Enrolla sus apéndices sensoriales con forma de cinta en los
        brazos de su querido Entrenador cuando caminan juntos.
      it: |-
        Se si affeziona particolarmente al suo Allenatore, lo
        accompagna circondandogli amorevolmente il braccio
        con le sue antenne a forma di fiocchetto.
    sun:
      ja-Hrkt: |-
        リボンの　ような　しょっかく　から
        てきいを　そぐ　はどうを　はなち
        えものを　ゆだんさせ　おそう。
      ja: |-
        リボンの　ような　触角　から
        敵意を　削ぐ　波動を　放ち
        獲物を　油断させ　襲う。
      ko: |-
        리본 같은 더듬이로부터
        적의를 없애는 파동을 내보내
        먹이를 방심하게 하고 덮친다.
      zh-Hant: |-
        從有如蝴蝶結的觸角裡
        釋放出削弱敵意的波動，
        令獵物大意後襲擊對方。
      zh-Hans: |-
        从蝴蝶结那样的触角里
        释放出削弱敌意的波动，
        令猎物大意后袭击对方。
      en: |-
        Its ribbonlike feelers give off an aura that
        weakens hostility in its prey, causing them
        to let down their guard. Then it attacks.
      fr: |-
        Grâce à ses antennes semblables à des rubans,
        il peut émettre des ondes neutralisant l’hostilité
        et ainsi endormir la méfiance de ses proies.
      de: |-
        Seinen bandförmigen Fühlern lässt es
        beruhigende Wellen entströmen, um
        seine Beute in Sicherheit zu wiegen.
      es: |-
        Con sus apéndices sensoriales con forma de
        cinta, puede emitir ondas que neutralizan la
        hostilidad y hacen bajar la guardia a su presa.
      it: |-
        Le sue antenne simili a fiocchetti emettono onde
        che neutralizzano l’aggressività, riuscendo così
        a far abbassare la guardia alle sue prede.
    moon:
      ja-Hrkt: |-
        えものを　みつけると　リボンじょうの
        しょっかくを　ゆらし　ゆだん　させ
        スキが　できると　とびかかる。
      ja: |-
        獲物を　見つけると　リボン状の
        触角を　揺らし　油断　させ
        スキが　できると　飛びかかる。
      ko: |-
        먹이를 발견하면 리본 모양의
        더듬이를 흔들어 방심하게 하고
        틈이 만들어지면 덤벼든다.
      zh-Hant: |-
        發現獵物後，就會搖晃
        蝴蝶結形狀的觸角讓對方大意，
        一旦有機可乘就會猛撲過去。
      zh-Hans: |-
        发现猎物后，就会摇晃
        蝴蝶结状的触角让对方大意，
        一旦出现可趁之机就会猛扑过去。
      en: |-
        When this Pokémon sights its prey, it swirls its
        ribbonlike feelers as a distraction. A moment
        later, it pounces.
      fr: |-
        Lorsqu’il trouve une proie, il agite ses antennes
        en forme de rubans pour la distraire. Ensuite,
        il passe à l’attaque.
      de: |-
        Hat es Beute entdeckt, wedelt es mit seinen
        bandförmigen Fühlern, um diese abzulenken.
        Bei Erfolg stürzt es sich auf sie.
      es: |-
        Al detectar a una presa, agita sus apéndices
        sensoriales con forma de cinta para distraerla y,
        cuando lo consigue, se abalanza sobre ella.
      it: |-
        Individuata una preda, agita le sue antenne
        simili a fiocchetti per deconcentrarla e poi
        attacca approfittando della sua distrazione.
    ultra-sun:
      ja-Hrkt: |-
        ひとたび　たたかいとなれば　じぶんの
        なんばいもある　ドラゴンポケモンにも
        いっさいひるまず　とびかかっていく。
      ja: |-
        ひとたび　戦いとなれば　自分の
        何倍もある　ドラゴンポケモンにも
        いっさい怯まず　飛びかかっていく。
      ko: |-
        한번 싸움이 나면 자신보다
        몇 배나 큰 드래곤포켓몬에게도
        전혀 기죽지 않고 덤벼든다.
      zh-Hant: |-
        一旦進入戰鬥狀態，
        即便對手是比自己大幾倍的龍寶可夢，
        也會毫不畏懼地飛撲過去。
      zh-Hans: |-
        一旦进入战斗状态，
        即使面对比自己大几倍的龙宝可梦，
        也会毫不畏惧地飞扑过去。
      en: |-
        Once a fight breaks out, it will unflinchingly
        charge at dragon Pokémon that are many times
        larger than itself.
      fr: |-
        Une fois le combat entamé, il n’hésite pas
        une seconde, même contre un Pokémon
        de type Dragon dix fois plus gros que lui.
      de: |-
        Kommt es zum Kampf, stürzt es sich furchtlos
        ins Gefecht, selbst wenn sein Gegner ein
        vielfach größeres Drachen-Pokémon ist.
      es: |-
        Cuando se enfrasca en un combate lo da todo
        sin titubear un segundo, aunque se enfrente a
        un Pokémon de tipo Dragón más grande que él.
      it: |-
        Nella lotta, parte all’attacco senza esitare
        un istante, anche quando si trova di fronte
        imponenti Pokémon di tipo Drago.
    ultra-moon:
      ja-Hrkt: |-
        トレーナーの　うでに　リボンじょうの
        しょっかくを　まきつけてくる。
        ふれると　きもちが　わかる　からだ。
      ja: |-
        トレーナーの　腕に　リボン状の
        触角を　巻きつけてくる。
        触れると　気持ちが　わかる　からだ。
      ko: |-
        트레이너의 팔에 리본 모양의
        더듬이를 휘감는다.
        닿으면 기분을 알 수 있기 때문이다.
      zh-Hant: |-
        會用緞帶般的觸角纏住
        訓練家的手臂，因為牠可以
        透過觸碰來得知對方的心情。
      zh-Hans: |-
        会用缎带般的触角缠住训练家的手臂。
        因为只要触碰后就能知道对方的心情。
      en: |-
        Sylveon wraps its ribbonlike feelers around its
        Trainer’s arm because this touch enables it to
        read its Trainer’s feelings.
      fr: |-
        Enrouler l’une de ses antennes en forme
        de ruban autour du bras de son Dresseur
        lui permet de connaître ses sentiments.
      de: |-
        Feelinara umwickelt den Arm seines Trainers mit
        seinen bandförmigen Fühlern, da es so spüren
        kann, wie es ihm geht.
      es: |-
        Al rodear el brazo de su Entrenador con los
        apéndices sensoriales en forma de cintas, es
        capaz de comprender sus sentimientos.
      it: |-
        Avvolge le sue antenne simili a fiocchetti intorno
        al braccio dell’Allenatore per comprendere i suoi
        sentimenti.
    sword:
      ja-Hrkt: |-
        リボンのような　しょっかくから
        てきいを　けす　はどうを　はっして
        あらそいを　やめさせる。
      ja: |-
        リボンのような　触角から
        敵意を　消す　波動を　発して
        争いを　やめさせる。
      ko: |-
        리본 모양의 더듬이로부터
        적의를 없애는 파동을 내보내
        싸움을 그만두게 한다.
      zh-Hant: |-
        會從蝴蝶結般的觸角裡
        釋放能夠消除敵意的波動，
        藉此平息紛爭。
      zh-Hans: |-
        会从蝴蝶结般的触角里
        释放能够消除敌意的波动，
        借此平息纷争。
      en: |-
        By releasing enmity-erasing waves from its
        ribbonlike feelers, Sylveon stops any conflict.
      fr: |-
        Grâce à ses antennes semblables à des rubans,
        il peut émettre des ondes neutralisant l’hostilité
        et ainsi mettre fin aux querelles.
      de: |-
        Mit seinen bandförmigen Fühlern sendet es
        Wellen aus, die feindselige Gefühle verklingen
        lassen. So legt es Streitereien bei.
      es: |-
        Con sus apéndices sensoriales en forma de cinta,
        puede emitir ondas que neutralizan la hostilidad
        y detener así cualquier contienda.
      it: |-
        Fa cessare le lotte grazie alle antenne simili
        a fiocchetti, che emettono onde in grado di
        placare le ostilità.
    shield:
      ja-Hrkt: |-
        おそろしい　ドラゴンポケモンを
        うつくしい　ニンフィアが　たいじする
        どうわが　ガラルちほうに　のこる。
      ja: |-
        恐ろしい　ドラゴンポケモンを
        美しい　ニンフィアが　退治する
        童話が　ガラル地方に　残る。
      ko: |-
        무서운 드래곤포켓몬을
        아름다운 님피아가 퇴치하는
        동화가 가라르지방에 남아 있다.
      zh-Hant: |-
        伽勒爾地區的童話中有著
        美麗的仙子伊布擊退了
        可怕的龍寶可夢的故事。
      zh-Hans: |-
        伽勒尔地区的童话中有着
        美丽的仙子伊布击退了
        可怕的龙宝可梦的故事。
      en: |-
        There’s a Galarian fairy tale that describes
        a beautiful Sylveon vanquishing a dreadful
        dragon Pokémon.
      fr: |-
        Un conte de Galar relate la victoire d’un beau
        Nymphali sur un terrible Pokémon Dragon.
      de: |-
        Ein in der Galar-Region überliefertes Märchen
        erzählt von einem bildhübschen Feelinara, das
        ein grässliches Drachen-Pokémon bezwingt.
      es: |-
        En un cuento infantil de Galar se narra la victoria
        de un Sylveon de extraordinaria belleza sobre un
        temible Pokémon de tipo Dragón.
      it: |-
        Una favola di Galar narra di un Sylveon di rara
        bellezza che sconfisse uno spaventoso Pokémon
        di tipo Drago.
