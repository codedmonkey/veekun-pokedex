golurk:
  base_happiness: 50
  capture_rate: 90
  color: green
  egg_groups:
    - mineral
  evolution_chain: golett
  evolves_from: golett
  flavor_text:
    black:
      en: |-
        It flies across the sky at Mach speeds.
        Removing the seal on its chest makes
        its internal energy go out of control.
      fr: |-
        Il vole à la vitesse du son. Si le
        sceau sur sa poitrine est retiré,
        il perd tout contrôle de lui-même.
    white:
      en: |-
        It is said that Golurk were ordered
        to protect people and Pokémon
        by the ancient people who made them.
      fr: |-
        Ses créateurs d’une lointaine époque
        lui auraient ordonné de protéger les
        humains et les Pokémon.
    black-2:
      en: |-
        Golurk were created to protect
        people and Pokémon.
        They run on a mysterious energy.
    white-2:
      en: |-
        Golurk were created to protect
        people and Pokémon.
        They run on a mysterious energy.
    x:
      ja-Hrkt: |-
        ゴルーグを　つくった　こだいじんから
        ひとや　ポケモンを　まもるように
        めいれいされていると　いわれている。
      ja: |-
        ゴルーグを　作った　古代人から
        人や　ポケモンを　守るように
        命令されていると　言われている。
      ko: |-
        골루그를 만든 고대인에게
        사람과 포켓몬을 지키도록
        명령받았다고 전해진다.
      en: |-
        It is said that Golurk were ordered to protect
        people and Pokémon by the ancient people who
        made them.
      fr: |-
        Ses créateurs d’une lointaine époque lui auraient
        ordonné de protéger les humains et les Pokémon.
      de: |-
        Man munkelt, sein Schöpfer habe ihm aufgetragen,
        schützend über Pokémon und Menschen zu wachen.
      es: |-
        Al parecer, aquel que antaño lo creó le ordenó
        proteger a los Pokémon y a los humanos.
      it: |-
        Si narra che gli antichi costruttori dei Golurk avessero
        ordinato loro di proteggere gli uomini e i Pokémon.
    'y':
      ja-Hrkt: |-
        マッハの　スピードで　そらを　とぶ。
        むねの　ふういんを　はがすと
        エネルギーが　ぼうそうしてしまう。
      ja: |-
        マッハの　スピードで　空を　飛ぶ。
        胸の　封印を　はがすと
        エネルギーが　暴走してしまう。
      ko: |-
        마하의 스피드로 하늘을 난다.
        가슴의 봉인을 떼어내면
        에너지가 폭주해 버린다.
      en: |-
        It flies across the sky at Mach speeds. Removing
        the seal on its chest makes its internal energy go
        out of control.
      fr: |-
        Il vole à la vitesse du son. Si le sceau sur sa poitrine
        est retiré, il perd tout contrôle de lui-même.
      de: |-
        Es jagt mit Schallgeschwindigkeit durch die Lüfte.
        Nimmt man das Siegel auf der Brust ab, gerät es
        außer Kontrolle.
      es: |-
        Vuela a velocidad mach. Pierde el control de su
        energía si se le retira el sello del pecho.
      it: |-
        Vola alla velocità del suono. Se rimuove il sigillo che
        ha sul petto, sprigiona un’energia incontrollabile.
    omega-ruby:
      ja-Hrkt: |-
        ゴルーグを　つくった　こだいじんから
        ひとや　ポケモンを　まもるように
        めいれいされていると　いわれている。
      ja: |-
        ゴルーグを　作った　古代人から
        人や　ポケモンを　守るように
        命令されていると　言われている。
      ko: |-
        골루그를 만든 고대인에게
        사람과 포켓몬을 지키도록
        명령받았다고 전해진다.
      en: |-
        It is said that Golurk were ordered to protect
        people and Pokémon by the ancient people who
        made them.
      fr: |-
        Ses créateurs d’une lointaine époque lui auraient ordonné
        de protéger les humains et les Pokémon.
      de: |-
        Man munkelt, sein Schöpfer habe ihm aufgetragen,
        schützend über Pokémon und Menschen zu wachen.
      es: |-
        Al parecer, aquel que antaño lo creó le ordenó proteger a los
        Pokémon y a los humanos.
      it: |-
        Si narra che gli antichi costruttori dei Golurk avessero
        ordinato loro di proteggere gli uomini e i Pokémon.
    alpha-sapphire:
      ja-Hrkt: |-
        マッハの　スピードで　そらを　とぶ。
        むねの　ふういんを　はがすと
        エネルギーが　ぼうそうしてしまう。
      ja: |-
        マッハの　スピードで　空を　飛ぶ。
        胸の　封印を　はがすと
        エネルギーが　暴走してしまう。
      ko: |-
        마하의 스피드로 하늘을 난다.
        가슴의 봉인을 떼어내면
        에너지가 폭주해 버린다.
      en: |-
        It flies across the sky at Mach speeds. Removing
        the seal on its chest makes its internal energy go
        out of control.
      fr: |-
        Il vole à la vitesse du son. Si le sceau sur sa poitrine est retiré,
        il perd tout contrôle de lui-même.
      de: |-
        Es jagt mit Schallgeschwindigkeit durch die Lüfte. Nimmt man
        das Siegel auf der Brust ab, gerät es außer Kontrolle.
      es: |-
        Vuela a velocidad mach. Pierde el control de su energía si se
        le retira el sello del pecho.
      it: |-
        Vola alla velocità del suono. Se rimuove il sigillo che ha sul
        petto, sprigiona un’energia incontrollabile.
    ultra-sun:
      ja-Hrkt: |-
        こだいじんが　ろうどうりょく　として
        ゴルーグを　はつめいしたといわれる。
        あるじの　めいれいに　ちゅうじつだ。
      ja: |-
        古代人が　労働力　として
        ゴルーグを　発明したといわれる。
        主の　命令に　忠実だ。
      ko: |-
        고대인이 노동력으로 활용하기 위해
        골루그를 발명했다고 전해진다.
        주인의 명령에 충실하다.
      zh-Hant: |-
        據說古代人發明泥偶巨人
        是為了當成勞動力來使用。
        牠會忠實遵從主人的命令。
      zh-Hans: |-
        据说，古代人发明了
        泥偶巨人作为他们的劳动力。
        它很忠实于主人的命令。
      en: |-
        Some say that ancient people invented Golurk
        to serve as a laborer. It follows its master’s
        orders faithfully.
      fr: |-
        Il aurait été créé dans les temps anciens pour
        servir de bête de somme. La voix de son maître
        fait loi.
      de: |-
        Es heißt, Golgantes sei von einem alten Volk
        erschaffen worden, um diesem als Arbeiter zu
        dienen. Deshalb befolgt es ergeben Befehle.
      es: |-
        Se dice que fue creado en la antigüedad para
        usarlo como mano de obra. Acata las órdenes
        de su amo sin rechistar.
      it: |-
        Pare che sia stato creato dagli antichi per
        aiutare nei lavori pesanti. Esegue gli ordini del
        suo padrone senza battere ciglio.
    ultra-moon:
      ja-Hrkt: |-
        むねの　ふういんが　とけてしまうと
        みさかいなく　あばれまわって
        まちを　がれきの　やまに　かえる。
      ja: |-
        胸の　封印が　解けてしまうと
        見境なく　暴れまわって
        街を　がれきの　山に　変える。
      ko: |-
        가슴에 있는 봉인이 풀리면
        무작정 날뛰고 다니면서
        마을을 벽돌 더미로 만들어 버린다.
      zh-Hant: |-
        胸口的封印一旦解開
        就會不顧一切地四處大鬧，
        把街道全都化成瓦礫堆。
      zh-Hans: |-
        胸口的封印如果解开，
        就会不管不顾地横冲直撞，
        把街道都变成瓦砾堆。
      en: |-
        When the seal on its chest is removed, it rages
        indiscriminately, turning the whole town around
        it into a mountain of rubble.
      fr: |-
        Gare au sceau de sa poitrine ! S’il est brisé,
        Golemastoc perd le contrôle et charge avec
        fureur. Il peut alors raser une ville entière.
      de: |-
        Löst sich das Siegel auf seiner Brust, gerät es
        völlig außer Kontrolle und legt ganze Städte in
        Schutt und Asche.
      es: |-
        Si se le desprende el sello del pecho, pierde el
        control y arrasa con todo sin miramientos: puede
        convertir un pueblo en un montón de escombros.
      it: |-
        Se il sigillo che ha sul petto viene rimosso, perde
        il controllo e distrugge tutto ciò che incontra,
        riducendo intere città in macerie.
    sword:
      ja-Hrkt: |-
        こだいじんの　おしろの　かべには
        ゴルーグが　ビームを　うつための
        ほうだいの　ような　だいざが　ある。
      ja: |-
        古代人の　お城の　壁には
        ゴルーグが　ビームを　撃つための
        砲台の　ような　台座が　ある。
      ko: |-
        고대인의 성벽에는
        골루그가 빔을 쏘기 위한
        포대와 같은 대좌가 있다.
      zh-Hant: |-
        古代人城堡的牆壁裡那
        像炮台一樣的底座是為了
        讓泥偶巨人發射光束而建的。
      zh-Hans: |-
        古代人城堡的墙壁里那
        像炮台一样的底座是为了
        让泥偶巨人发射光束而建的。
      en: |-
        Artillery platforms built into the walls of ancient
        castles served as perches from which Golurk
        could fire energy beams.
      fr: |-
        Les murs des châteaux de jadis disposaient
        de créneaux, par lesquels les Golemastoc
        pouvaient tirer leurs rayons d’énergie.
      de: |-
        In uralten Festungen finden sich heute noch
        Sockel, die Golgantes beim Abfeuern seiner
        Strahlen wohl als Halt dienen sollten.
      es: |-
        En los muros de antiguos castillos se hallan
        plataformas desde las que los Golurk podían
        disparar sus rayos como si fueran cañones.
      it: |-
        Nelle mura degli antichi castelli si trovano dei
        basamenti, simili a quelli dei cannoni, dai quali
        i Golurk potevano sparare i loro raggi.
    shield:
      ja-Hrkt: |-
        たいないに　エネルギーを　うみだす
        えいきゅうきかんが　あると　いうが
        いまだ　かいめいは　されていない。
      ja: |-
        体内に　エネルギーを　生み出す
        永久機関が　あると　いうが
        未だに　解明は　されていない。
      ko: |-
        체내에 에너지를 생성하는
        영구 기관이 있다고 하지만
        아직도 밝혀지지 않았다.
      zh-Hant: |-
        雖然有人認為牠體內
        有著生成能量的永動機，
        但至今仍未得到證實。
      zh-Hans: |-
        虽然有人认为它体内
        有着生成能量的永动机，
        但至今仍未得到证实。
      en: |-
        There’s a theory that inside Golurk is a perpetual
        motion machine that produces limitless energy,
        but this belief hasn’t been proven.
      fr: |-
        Son énergie viendrait d’un mécanisme
        à mouvement perpétuel interne, mais jusqu’à
        présent, personne n’en a la preuve.
      de: |-
        Man sagt, in seinem Körper befinde sich eine
        unerschöpfliche Energiequelle, doch bisher ist
        es niemandem gelungen, dies nachzuweisen.
      es: |-
        Se dice que su cuerpo alberga un móvil perpetuo
        que genera energía, pero no se ha constatado la
        veracidad de tamaña afirmación.
      it: |-
        Si dice che all’interno del corpo abbia un motore
        perpetuo che produce energia, ma a tutt’oggi
        non è ancora chiaro se sia così.
