    white-2:
      en: |-
        It loves to match power with
        big-bodied Pokémon. It can knock a
        truck flying with its arm thrusts.
    x:
      ja-Hrkt: |-
        りょうあしで　じめんを　ふみならして
        パワーを　ためる。はりて　いっぱつで
        １０トン　トラックを　ふっとばす。
      ja: |-
        両足で　地面を　踏み鳴らして
        パワーを　ためる。張り手　１発で
        １０トン　トラックを　吹っ飛ばす。
      ko: |-
        두 다리로 땅을 힘껏 밟아서
        파워를 모은다. 손바닥 치기 한 방으로
        10톤 트럭을 날려버린다.
      en: |-
        It stomps on the ground to build power. It can send
        a 10-ton truck flying with a straight-arm punch.
      fr: |-
        Il piétine le sol violemment pour concentrer son
        énergie. Il peut envoyer en l’air un camion de 10 t
        d’un seul coup de poing.
      de: |-
        Es stampft auf den Boden, um Energie zu
        generieren. Ein einziger Armschlag reicht aus, um
        einen 10 t schweren LKW durch die Luft zu wirbeln.
      es: |-
        Para aumentar su fuerza, da un pisotón en el suelo.
        Puede lanzar un camión de 10 toneladas por los aires
        de un puñetazo.
      it: |-
        Pesta i piedi sul terreno per accumulare energia.
        Con uno dei suoi schiaffi può far prendere il volo
        a un camion di 10 t.
    'y':
      ja-Hrkt: |-
        からだの　おおきな　ポケモンたちと
        ちからくらべをすることが　だいすき。
        はりてで　トラックを　ふっとばす。
      ja: |-
        体の　大きな　ポケモンたちと
        力比べをすることが　大好き。
        張り手で　トラックを　ぶっ飛ばす。
      ko: |-
        몸집이 큰 포켓몬들과 힘 겨루는
        것을 매우 좋아한다. 손바닥 치기로
        트럭을 멀리 날려 버린다.
      en: |-
        It loves to match power with big-bodied Pokémon.
        It can knock a truck flying with its arm thrusts.
      fr: |-
        Il aime mesurer sa force à celle des plus grands
        Pokémon. Ses coups de paume peuvent projeter
        un camion.
      de: |-
        Es liebt das Kräftemessen mit großen Pokémon. Mit
        seinem Armwurf kann es LKW durch die Luft werfen.
      es: |-
        Le encanta enfrentarse a Pokémon grandes y probar
        su fuerza. Sus brazos pueden derribar un camión.
      it: |-
        Ama confrontarsi con Pokémon grossi. Con uno dei
        suoi schiaffi, può far prendere il volo a un camion.
    omega-ruby:
      ja-Hrkt: |-
        いろんな　ばしょで　はりての　けいこに　はげむ。
        きょうれつな　はりて　こうげきを　くらうと
        でんしんばしらも　いちげきで　まっぷたつだ。
      ja: |-
        色んな　場所で　張り手の　けいこに　励む。
        強烈な　張り手　攻撃を　くらうと
        電信柱も　一撃で　真っ二つだ。
      ko: |-
        다양한 장소에서 손바닥 치기 연습에 힘쓴다.
        강렬한 손바닥 치기 공격을 맞으면
        전봇대도 한 방에 두 동강 난다.
      en: |-
        Hariyama practices its straight-arm slaps in any number of
        locations. One hit of this Pokémon’s powerful, openhanded,
        straight-arm punches could snap a telephone pole in two.
      fr: |-
        Hariyama s’entraîne à donner ses coups directs avec sa paume
        le plus souvent possible. Un seul de ces puissants coups
        de paume peut plier un poteau téléphonique en deux.
      de: |-
        Hariyama führt seinen berüchtigten Streckarm-Schlag
        überall aus. Ein Schlag von diesem Pokémon reicht aus,
        um einen Strommast zu zerlegen.
      es: |-
        Hariyama practica los empujones que da estirando los brazos
        allá por donde va. Este Pokémon puede partir por la mitad un
        poste de teléfono de un enérgico golpe con los brazos
        estirados y las manos abiertas.
      it: |-
        Hariyama sferra potenti schiaffi a braccia tese in ogni
        occasione. Un colpo delle sue violente mani aperte
        è in grado di spaccare in due un palo della luce.
    alpha-sapphire:
      ja-Hrkt: |-
        ふとった　からだは　きんにくの　かたまり。
        ぐぐっと　ぜんしんに　ちからを　こめると
        きんにくは　いわと　おなじ　かたさになるぞ。
      ja: |-
        肥った　体は　筋肉の　塊。
        ぐぐっと　全身に　力を　込めると
        筋肉は　岩と　同じ　硬さになるぞ。
      ko: |-
        살이 찐 몸은 근육 덩어리다.
        힘껏 전신에 힘을 집중하면
        근육은 바위만큼 단단해진다.
      en: |-
        Hariyama’s thick body may appear fat, but it is actually a hunk
        of solid muscle. If this Pokémon bears down and tightens all its
        muscles, its body becomes as hard as a rock.
      fr: |-
        Hariyama a l’air un peu enrobé, mais c’est en fait
        une montagne de muscles. Si ce Pokémon se raidit
        et contracte ses muscles, son corps devient dur
        comme de la pierre.
      de: |-
        Hariyamas Körper mag vielleicht fett aussehen, er besteht aber
        aus festen Muskeln. Wenn dieses Pokémon all seine Muskeln
        anspannt, wird sein Körper steinhart.
      es: |-
        Puede que parezca que Hariyama está grueso, pero en
        realidad es una mole de puro músculo. Si este Pokémon hace
        fuerza y tensa la musculatura, se pone sólido como una roca.
      it: |-
        Il robusto corpo di Hariyama può apparire grasso, ma in realtà
        è formato da una muscolatura tonica. Se contrae e tende ogni
        singolo muscolo, il suo corpo diventa duro come la roccia.
    sun:
      ja-Hrkt: |-
        かいりきで　しられるが　としおいると
        たたかうことを　やめ　マクノシタに
        けいこを　つけるように　なるのだ。
      ja: |-
        怪力で　知られるが　年老いると
        戦うことを　やめ　マクノシタに
        稽古を　つけるように　なるのだ。
      ko: |-
        괴력으로 알려졌지만 나이가 들면
        싸우는 것을 그만두고
        마크탕을 훈련시키며 지낸다.
      zh-Hant: |-
        因怪力而為人所知，
        但上了年紀後就會放棄戰鬥，
        轉而負責訓練幕下力士。
      zh-Hans: |-
        因怪力而为人所知，
        但上了年纪后就会停止战斗，
        转而负责训练幕下力士。
      en: |-
        It is known for its fantastic strength, but as it
        grows older, it focuses more on
        training Makuhita.
      fr: |-
        Malgré leur force spectaculaire, les vieux
        Hariyama préfèrent délaisser le combat au
        profit de l’entraînement des jeunes Makuhita.
      de: |-
        Es ist für seine unglaubliche Stärke bekannt,
        lässt das Kämpfen mit dem Alter aber sein und
        trainiert stattdessen Makuhita.
      es: |-
        Los Hariyama veteranos son conocidos por su
        fuerza descomunal, pero prefieren retirarse de
        la vida de combate y entrenar a los Makuhita.
      it: |-
        È famoso per la sua incredibile forza.
        In età avanzata, smette di lottare e inizia
        ad allenare i Makuhita.
    moon:
      ja-Hrkt: |-
        はりて　いっぱつで　トラックを
        ふっとばすほどの　かいりきで
        ちからくらべが　だいすき。
      ja: |-
        張り手　一発で　トラックを
        ふっ飛ばすほどの　怪力で
        力比べが　大好き。
      ko: |-
        손바닥 치기 한 번에 트럭을
        날려버릴 정도의 괴력으로
        힘겨루기를 아주 좋아한다.
      zh-Hant: |-
        擁有一巴掌就能把貨車
        打飛的怪力，
        最喜歡和對手比力氣。
      zh-Hans: |-
        有着一巴掌能把卡车打飞
        那种程度的怪力，
        非常喜欢比力气。
      en: |-
        They love to compare their freakish strength—
        strength enough to send a truck flying with a
        single slap.
      fr: |-
        Sa force herculéenne lui permet de renverser
        un camion d’une seule main. Les Hariyama
        aiment s’adonner à des concours de force pure.
      de: |-
        Hariyama ist stark genug, um mit einem einzigen
        Armschlag einen LKW durch die Luft zu wirbeln.
        Es misst gerne seine Kräfte mit anderen.
      es: |-
        Los Hariyama pueden tumbar un camión dándole
        un tortazo con la mano abierta. Les encantan
        las pruebas de fuerza.
      it: |-
        Con uno dei suoi potentissimi schiaffi può
        scaraventare lontano un camion.
        Adora le gare di forza.
    ultra-sun:
      ja-Hrkt: |-
        ちからくらべが　すきだが　やさしさも
        あわせもち　たたかった　あいてを
        ねぎらうなど　れいぎを　おもんじる。
      ja: |-
        力比べが　好きだが　優しさも
        あわせもち　戦った　相手を
        ねぎらうなど　礼儀を　重んじる。
      ko: |-
        힘겨루기를 좋아하지만,
        선한 성품도 겸비하여 대결 상대를
        치하하는 등 예의를 중시한다.
      zh-Hant: |-
        雖然喜歡和對手比力氣，
        但心地善良且注重禮儀，
        會慰勞與自己對戰的對手。
      zh-Hans: |-
        虽然喜欢比试力气，
        但心地和善且注重礼仪，
        会慰劳自己的对战对手。
      en: |-
        Although they enjoy comparing their strength,
        they’re also kind. They value etiquette, praising
        opponents they battle.
      fr: |-
        Bien qu’il aime les rapports de force, c’est aussi
        un cœur tendre qui sait respecter et féliciter
        ses adversaires pour leur combativité.
      de: |-
        Es liebt das Kräftemessen, vergisst dabei aber
        nie die Etikette und bedankt sich nach dem
        Kampf stets höflich bei seinem Gegner.
      es: |-
        Adora las competiciones de fuerza, pero el
        respeto y la cortesía hacia sus adversarios
        son muy importantes para este noble Pokémon.
      it: |-
        Adora le gare di forza, ma dà anche molta
        importanza alla gentilezza e alle buone maniere.
        Per questo ringrazia l’avversario dopo la lotta.
    ultra-moon:
      ja-Hrkt: |-
        ふとって　おおきな　ハリテヤマが
        つよいとは　かぎらない。　こがらでも
        みがるで　わざに　たけたものもいる。
      ja: |-
        太って　大きな　ハリテヤマが
        強いとは　限らない。　小柄でも
        身軽で　技に　長けたものもいる。
      ko: |-
        뚱뚱하고 큰 하리뭉이 다 강한 것은
        아니다. 작지만 몸이 가볍고
        기술이 뛰어난 하리뭉도 있다.
      zh-Hant: |-
        體型壯碩的鐵掌力士未必就很強。
        也有體型雖小，但身輕如燕
        且技巧高超的鐵掌力士存在。
      zh-Hans: |-
        体型粗壮的铁掌力士未必强大。
        即便身型矮小，也有身轻如燕，
        擅长巧力的铁掌力士。
      en: |-
        Hariyama that are big and fat aren’t necessarily
        strong. There are some small ones that move
        nimbly and use moves skillfully.
      fr: |-
        Les Hariyama les plus forts ne sont pas
        forcément les plus grands. Les petits gabarits
        aussi ont plus d’un tour dans leur sac.
      de: |-
        Hariyama sind nicht nur stark, wenn sie groß
        und schwer sind. Auch kleine und leichte
        Exemplare können Attacken effektiv einsetzen.
      es: |-
        No todos los Hariyama son grandotes, recios y
        fuertes. También los hay de menor tamaño pero
        mayor agilidad y precisión en los movimientos.
      it: |-
        Gli Hariyama non hanno bisogno di essere
        grandi e grossi per essere forti. Quelli piccoli
        sono agili ed efficaci nell’eseguire le mosse.
