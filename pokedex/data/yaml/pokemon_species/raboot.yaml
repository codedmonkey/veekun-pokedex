raboot:
  base_happiness: 50
  capture_rate: 45
  color: gray
  egg_groups:
    - ground
    - humanshape
  evolution_chain: scorbunny
  evolves_from: scorbunny
  flavor_text:
    sword:
      ja-Hrkt: |-
        ふかふかの　たいもうで　さむさに
        つよくなり　さらに　こうおんの
        ほのおわざを　だせるようになった。
      ja: |-
        ふかふかの　体毛で　寒さに
        強くなり　さらに　高温の
        炎技を　出せるようになった。
      ko: |-
        푹신푹신한 털 덕분에 추위에
        강해지고 더 높은 온도의
        불꽃 기술도 쓸 수 있게 되었다.
      zh-Hant: |-
        蓬鬆的體毛幫助牠增強了抵禦
        寒冷的能力，也使牠能夠使出
        溫度更高的火屬性招式。
      zh-Hans: |-
        蓬松的体毛帮助它增强了抵御
        寒冷的能力，也使它能够使出
        温度更高的火属性招式。
      en: |-
        Its thick and fluffy fur protects it from the cold
        and enables it to use hotter fire moves.
      fr: |-
        Son pelage épais lui permet de mieux résister
        au froid et d’augmenter la température
        de ses capacités Feu.
      de: |-
        Sein flauschiges Fell schützt es vor Kälte und
        ermöglicht es ihm, noch heißere Feuer-Attacken
        auszuteilen.
      es: |-
        Su suave pelaje lo protege del frío y le permite
        incrementar todavía más la temperatura de sus
        movimientos de tipo Fuego.
      it: |-
        Grazie alla folta pelliccia resiste al freddo
        ed è in grado di sferrare mosse infuocate
        a temperature ancora più alte.
    shield:
      ja-Hrkt: |-
        てを　つかわずに　きの　えだから
        きのみを　つみとり　リフティング。
        あしわざを　みがく　れんしゅう。
      ja: |-
        手を　使わずに　木の　枝から
        木の実を　摘み取り　リフティング。
        足技を　磨く　練習。
      ko: |-
        손을 쓰지 않고 나뭇가지에서
        나무열매를 따내고 리프팅한다.
        발 기술을 연마하는 연습이다.
      zh-Hant: |-
        會用腳把樹果從樹木上
        踢落，用來練習挑球，
        藉此鍛鍊自己的腳法。
      zh-Hans: |-
        会用脚把树果从树木上
        踢落，用来练习颠球，
        借此锻炼自己的脚法。
      en: |-
        It kicks berries right off the branches of trees
        and then juggles them with its feet, practicing
        its footwork.
      fr: |-
        Pour parfaire son jeu de jambes,
        il cueille des Baies puis drible avec,
        le tout sans se servir de ses mains.
      de: |-
        Es pflückt Beeren von Ästen, ohne seine Hände
        zu benutzen, und jongliert sie mit den Füßen.
        Damit trainiert es seine Fußfertigkeiten.
      es: |-
        Para mejorar su habilidad con los pies, toma
        bayas de las ramas de los árboles sin usar las
        manos y juega a darles toques.
      it: |-
        Per perfezionare i suoi calci, si esercita
        prendendo le bacche dai rami degli alberi
        e palleggiando senza usare le mani.
