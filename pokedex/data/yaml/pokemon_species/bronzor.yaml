  flavor_text:
    diamond:
      en: |-
        Implements shaped like it were
        discovered in ancient tombs. It is
        unknown if they are related.
    pearl:
      en: |-
        X-ray photos were taken to check
        its body structure. Nothing
        appeared, however.
    platinum:
      en: |-
        There are researchers who believe
        this Pokémon reflected like a mirror
        in the distant past.
    heartgold:
      en: |-
        Ancient people believed that the
        pattern on BRONZOR’s back
        contained a mysterious power.
    soulsilver:
      en: |-
        Ancient people believed that the
        pattern on BRONZOR’s back
        contained a mysterious power.
    black:
      en: |-
        There are researchers who believe
        this Pokémon reflected like a mirror
        in the distant past.
      fr: |-
        Certains scientifiques soutiennent
        que ce Pokémon était jadis aussi
        réfléchissant qu’un miroir.
    white:
      en: |-
        There are researchers who believe
        this Pokémon reflected like a mirror
        in the distant past.
      fr: |-
        Certains scientifiques soutiennent
        que ce Pokémon était jadis aussi
        réfléchissant qu’un miroir.
    black-2:
      en: |-
        They are found in ancient tombs.
        The patterns on their backs are
        said to be imbued with mysterious power.
    white-2:
      en: |-
        They are found in ancient tombs.
        The patterns on their backs are
        said to be imbued with mysterious power.
    x:
      ja-Hrkt: |-
        ドーミラーの　せなかの　もようには
        しんぴてきな　ちからが　やどると
        むかしの　ひとたちは　しんじていた。
      ja: |-
        ドーミラーの　背中の　模様には
        神秘的な　力が　宿ると
        昔の　人たちは　信じていた。
      ko: |-
        동미러의 등 모양에는
        신비한 힘이 깃들어 있다고
        옛날 사람들은 믿고 있었다.
      en: |-
        Ancient people believed that the pattern on
        Bronzor’s back contained a mysterious power.
      fr: |-
        Les gens croyaient autrefois que les motifs de
        son dos renfermaient une puissance mystique.
      de: |-
        Früher glaubten die Menschen, dem Muster auf
        seinem Rücken wohne eine mysteriöse Kraft inne.
      es: |-
        Antaño se creía que en los dibujos de su parte
        posterior residía una fuerza misteriosa.
      it: |-
        Nell’antichità si credeva che una forza misteriosa
        dimorasse nei disegni sul dorso di Bronzor.
    'y':
      ja-Hrkt: |-
        ふるい　おはかから　ドーミラーに
        そっくりな　どうぐが　ほりだされたが
        かんけいは　わかっていない。
      ja: |-
        古い　お墓から　ドーミラーに
        そっくりな　道具が　掘り出されたが
        関係は　わかっていない。
      ko: |-
        고대 무덤에서 동미러와
        똑 닮은 도구가 발굴되었지만
        관계는 알 수 없다.
      en: |-
        Implements shaped like it were discovered in
        ancient tombs. It is unknown if they are related.
      fr: |-
        Il rappelle des objets trouvés dans des sépultures
        anciennes. Nul ne sait s’ils sont liés.
      de: |-
        Sein Körper sieht aus, als seien Teile davon
        in alten Gräbern gefunden worden.
      es: |-
        Se descubrieron herramientas con su forma en tumbas
        antiguas, pero se desconoce si tiene relación.
      it: |-
        Il suo aspetto ricorda alcuni oggetti ritrovati in
        antiche tombe, ma non si sa se ci sia una relazione.
    omega-ruby:
      ja-Hrkt: |-
        ドーミラーの　せなかの　もようには
        しんぴてきな　ちからが　やどると
        むかしの　ひとたちは　しんじていた。
      ja: |-
        ドーミラーの　背中の　模様には
        神秘的な　力が　宿ると
        昔の　人たちは　信じていた。
      ko: |-
        동미러의 등 모양에는
        신비한 힘이 깃들어 있다고
        옛날 사람들은 믿고 있었다.
      en: |-
        Ancient people believed that the pattern on
        Bronzor’s back contained a mysterious power.
      fr: |-
        Les gens croyaient autrefois que les motifs de son dos
        renfermaient une puissance mystique.
      de: |-
        Früher glaubten die Menschen, dem Muster auf seinem Rücken
        wohne eine mysteriöse Kraft inne.
      es: |-
        Antaño se creía que en los dibujos de su parte posterior
        residía una fuerza misteriosa.
      it: |-
        Nell’antichità si credeva che una forza misteriosa dimorasse
        nei disegni sul dorso di Bronzor.
    alpha-sapphire:
      ja-Hrkt: |-
        ふるい　おはかから　ドーミラーに
        そっくりな　どうぐが　ほりだされたが
        かんけいは　わかっていない。
      ja: |-
        古い　お墓から　ドーミラーに
        そっくりな　道具が　掘り出されたが
        関係は　わかっていない。
      ko: |-
        고대 무덤에서 동미러와
        똑 닮은 도구가 발굴되었지만
        관계는 알 수 없다.
      en: |-
        Implements shaped like it were discovered in
        ancient tombs. It is unknown if they are related.
      fr: |-
        Il rappelle des objets trouvés dans des sépultures anciennes.
        Nul ne sait s’ils sont liés.
      de: |-
        Sein Körper sieht aus, als seien Teile davon in alten Gräbern
        gefunden worden.
      es: |-
        Se descubrieron herramientas con su forma en tumbas
        antiguas, pero se desconoce si tiene relación.
      it: |-
        Il suo aspetto ricorda alcuni oggetti ritrovati in antiche tombe,
        ma non si sa se ci sia una relazione.
    sword:
      ja-Hrkt: |-
        ふるい　いせきに　あらわれる。
        からだの　もようは　ガラルには
        ない　ぶんかの　もので　なぞ。
      ja: |-
        古い　遺跡に　現れる。
        体の　模様は　ガラルには
        ない　文化の　もので　謎。
      ko: |-
        오래된 유적에 나타난다.
        몸의 무늬는 가라르에 없는
        낯선 문화의 것이라 수수께끼이다.
      zh-Hant: |-
        會在古老的遺跡出現。
        身上的紋路不屬於伽勒爾文化，
        因此至今仍然謎團重重。
      zh-Hans: |-
        会在古老的遗迹出现。
        身上的纹路不属于伽勒尔文化，
        因此至今仍然谜团重重。
      en: |-
        It appears in ancient ruins. The pattern on its
        body doesn’t come from any culture in the
        Galar region, so it remains shrouded in mystery.
      fr: |-
        Il apparaît dans les ruines. Les motifs qui ornent
        son corps sont mystérieux, car ils appartiennent
        à une culture étrangère à Galar.
      de: |-
        Es erscheint in alten Ruinen. Sein Muster ist ein
        Rätsel, da es nicht aus einer in Galar
        beheimateten Kultur stammt.
      es: |-
        Puede encontrarse en ruinas antiguas. El dibujo
        que presenta en el cuerpo es un misterio, ya que
        pertenece a una cultura ajena a Galar.
      it: |-
        Appare fra le rovine antiche. Il disegno sul suo
        corpo è un mistero irrisolto, perché non ha niente
        a che fare con la cultura originaria di Galar.
    shield:
      ja-Hrkt: |-
        みがけば　ひかり　しんじつを
        うつしだすとも　いわれるが
        ドーミラーは　とても　イヤがる。
      ja: |-
        磨けば　光り　真実を
        映しだすとも　いわれるが
        ドーミラーは　とても　嫌がる。
      ko: |-
        닦으면 빛이 나며 진실을
        비춘다고 전해지지만
        동미러는 닦이는 걸 매우 싫어한다.
      zh-Hant: |-
        雖然人們說把銅鏡怪打磨到發光，
        牠就能映照出真相，
        但其實牠非常討厭被打磨。
      zh-Hans: |-
        虽然人们说把铜镜怪打磨到发光，
        它就能映照出真相，
        但其实它非常讨厌被打磨。
      en: |-
        Polishing Bronzor to a shine makes its surface
        reflect the truth, according to common lore.
        Be that as it may, Bronzor hates being polished.
      fr: |-
        On raconte qu’il se met à briller et à refléter
        la vérité quand on le polit, mais il a horreur
        de cela.
      de: |-
        Es heißt, wenn man es poliert, spiegelt sich die
        Wahrheit in ihm wider. Bronzel mag es jedoch
        überhaupt nicht, poliert zu werden.
      es: |-
        Se dice que brilla y refleja la verdad al pulirlo,
        aunque es algo que detesta.
      it: |-
        Si dice che si illumini e rifletta la verità se viene
        lucidato, ma a Bronzor dà molto fastidio.
