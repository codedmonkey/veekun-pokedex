rampardos:
  base_happiness: 70
  capture_rate: 45
  color: blue
  egg_groups:
    - monster
  evolution_chain: cranidos
  evolves_from: cranidos
  flavor_text:
    diamond:
      en: |-
        Its powerful head butt has enough
        power to shatter even the most
        durable things upon impact.
    pearl:
      en: |-
        Its skull is as hard as iron. It is
        a brute that tears down jungle
        trees while catching prey.
    platinum:
      en: |-
        If two were to smash their heads
        together, their foot-thick skulls
        would keep them from fainting.
    heartgold:
      en: |-
        Its skull withstands impacts of any
        magnitude. As a result, its brain
        never gets the chance to grow.
    soulsilver:
      en: |-
        Its skull withstands impacts of any
        magnitude. As a result, its brain
        never gets the chance to grow.
    black:
      en: |-
        If two were to smash their heads
        together, their foot-thick skulls
        would keep them from fainting.
      fr: |-
        Quand deux Charkos se rentrent
        dedans, leur crâne extrêmement
        épais les empêche de s’assommer.
    white:
      en: |-
        If two were to smash their heads
        together, their foot-thick skulls
        would keep them from fainting.
      fr: |-
        Quand deux Charkos se rentrent
        dedans, leur crâne extrêmement
        épais les empêche de s’assommer.
    black-2:
      en: |-
        If two were to smash their heads
        together, their foot-thick skulls
        would keep them from fainting.
    white-2:
      en: |-
        If two were to smash their heads
        together, their foot-thick skulls
        would keep them from fainting.
    x:
      ja-Hrkt: |-
        どんな　しょうげきにも　たえられる
        ぶあつい　ずがいこつに　おさえられて
        のうみそは　おおきく　ならなかった。
      ja: |-
        どんな　衝撃にも　耐えられる
        分厚い　頭蓋骨に　押さえられて
        脳みそは　大きく　ならなかった。
      ko: |-
        어떤 충격에도 견딜 수 있는
        두꺼운 두개골에 눌려
        뇌가 자라지 않았다.
      en: |-
        Its skull withstands impacts of any magnitude. As a
        result, its brain never gets the chance to grow.
      fr: |-
        À force de cogner son crâne pourtant hyper résistant,
        Charkos a un cerveau atrophié.
      de: |-
        Sein dicker Schädelknochen trotzt jedem Angriff.
        Gleichzeitig stoppt er jedoch sein Hirnwachstum.
      es: |-
        Tiene sesos pequeños porque su duro cráneo, que
        soporta cualquier golpe, les impide desarrollarse.
      it: |-
        Il suo spesso cranio, che sopporta qualunque
        impatto, è ridotto, e il cervello non si è sviluppato.
    'y':
      ja-Hrkt: |-
        てつのように　かたい　ずがいこつ。
        ジャングルの　きぎを　なぎたおし
        えものを　とらえる　あばれんぼう。
      ja: |-
        鉄のように　硬い　頭蓋骨。
        ジャングルの　木々を　なぎ倒し
        獲物を　捕らえる　暴れん坊。
      ko: |-
        철처럼 단단한 두개골이다.
        정글의 나무들을 넘어뜨려서
        먹이를 잡는 난동꾼이다.
      en: |-
        Its skull is as hard as iron. It is a brute that tears
        down jungle trees while catching prey.
      fr: |-
        Son crâne est dur comme du fer. Cette brute abat
        des arbres quand elle chasse sa proie dans la jungle.
      de: |-
        Sein Schädel ist hart wie Eisen. Es reißt
        Dschungelbäume nieder, während es seine Beute jagt.
      es: |-
        Su cráneo es duro como el hierro. Es tan bruto que
        destroza la jungla cuando persigue presas.
      it: |-
        Il suo cranio è duro come il ferro. È violento e abbatte
        gli alberi della giungla mentre va a caccia di prede.
    omega-ruby:
      ja-Hrkt: |-
        どんな　しょうげきにも　たえられる
        ぶあつい　ずがいこつに　おさえられて
        のうみそは　おおきく　ならなかった。
      ja: |-
        どんな　衝撃にも　耐えられる
        分厚い　頭蓋骨に　押さえられて
        脳みそは　大きく　ならなかった。
      ko: |-
        어떤 충격에도 견딜 수 있는
        두꺼운 두개골에 눌려
        뇌가 자라지 않았다.
      en: |-
        Its skull withstands impacts of any magnitude. As a
        result, its brain never gets the chance to grow.
      fr: |-
        À force de cogner son crâne pourtant hyper résistant,
        Charkos a un cerveau atrophié.
      de: |-
        Sein dicker Schädelknochen trotzt jedem Angriff. Gleichzeitig
        stoppt er jedoch sein Hirnwachstum.
      es: |-
        Tiene sesos pequeños porque su duro cráneo, que soporta
        cualquier golpe, les impide desarrollarse.
      it: |-
        Il suo spesso cranio, che sopporta qualunque impatto,
        è ridotto, e il cervello non si è sviluppato.
    alpha-sapphire:
      ja-Hrkt: |-
        てつのように　かたい　ずがいこつ。
        ジャングルの　きぎを　なぎたおし
        えものを　とらえる　あばれんぼう。
      ja: |-
        鉄のように　硬い　頭蓋骨。
        ジャングルの　木々を　なぎ倒し
        獲物を　捕らえる　暴れん坊。
      ko: |-
        철처럼 단단한 두개골이다.
        정글의 나무들을 넘어뜨려서
        먹이를 잡는 난동꾼이다.
      en: |-
        Its skull is as hard as iron. It is a brute that tears
        down jungle trees while catching prey.
      fr: |-
        Son crâne est dur comme du fer. Cette brute abat des arbres
        quand elle chasse sa proie dans la jungle.
      de: |-
        Sein Schädel ist hart wie Eisen. Es reißt Dschungelbäume
        nieder, während es seine Beute jagt.
      es: |-
        Su cráneo es duro como el hierro. Es tan bruto que destroza
        la jungla cuando persigue presas.
      it: |-
        Il suo cranio è duro come il ferro. È violento e abbatte gli
        alberi della giungla mentre va a caccia di prede.
    sun:
      ja-Hrkt: |-
        ずつきを　くりかえし　ずがいこつは
        かたく　あつくなったが　のうみそは
        ズガイドスより　ちぢんでいる。
      ja: |-
        頭突きを　繰り返し　頭がい骨は
        硬く　厚くなったが　脳味噌は
        ズガイドスより　縮んでいる。
      ko: |-
        박치기를 반복해서 두개골은
        단단하고 두꺼워졌지만
        뇌는 두개도스보다 작아졌다.
      zh-Hant: |-
        反復使出頭錘的頭蓋骨變得又硬又厚。
        但腦容量比起頭蓋龍有所縮減。
      zh-Hans: |-
        反复使出头锤的头盖骨变得又硬又厚。
        但脑子比起头盖龙有所缩减。
      en: |-
        The result of repeated headbutts is a skull
        grown thick and hard. However, its brain has
        shrunk in size compared with Cranidos’s.
      fr: |-
        À force d’enchaîner les coups de tête, sa calotte
        crânienne s’est épaissie. Son cerveau a donc dû
        rétrécir et il est plus petit que celui du Kranidos.
      de: |-
        Durch häufige Kopfstöße ist sein Schädel
        hart und dick geworden. Seine Hirnmasse litt
        darunter und ist kleiner als bei Koknodon.
      es: |-
        Debido a los continuos cabezazos que propina,
        su cráneo se ha vuelto más duro y grueso. Sin
        embargo, tiene menos sesos que Cranidos.
      it: |-
        A furia di testate, il suo cranio è diventato
        spesso e robusto, ma il cervello si è
        rimpicciolito rispetto a quello di Cranidos.
    moon:
      ja-Hrkt: |-
        ふくげんされ　しんかした　ラムパルドが
        にげだして　ずつきで　こうそうビルを
        はかいしたという　きろくが　ある。
      ja: |-
        復元され　進化した　ラムパルドが
        逃げだして　頭突きで　高層ビルを
        破壊したという　記録が　ある。
      ko: |-
        복원되어 진화한 램펄드가 도망쳐
        박치기로 고층 빌딩을
        파괴했다는 기록이 있다.
      zh-Hant: |-
        曾經有過復原進化後的
        戰槌龍逃之夭夭，
        用頭錘破壞高層建築的記錄。
      zh-Hans: |-
        曾经有过复原进化后的
        战槌龙逃之夭夭，
        用头锤破坏高层建筑的记录。
      en: |-
        Records exist of a revived fossil that evolved
        into Rampardos. It proceeded to escape and
        then destroy a skyscraper with a headbutt.
      fr: |-
        Des rapports font état d’un Charkos qui, après
        reconstitution et évolution, aurait pris la fuite en
        démolissant un gratte-ciel d’un coup de tête.
      de: |-
        Es ist die Weiterentwicklung eines fossilen
        Pokémon. Einmal entkam ein Rameidon und
        zerstörte per Kopfstoß ein ganzes Hochhaus.
      es: |-
        Corren historias de un Cranidos regenerado a
        partir de un fósil que, tras evolucionar, escapó
        y derribó un rascacielos de un cabezazo.
      it: |-
        Un Rampardos, evolutosi da un Cranidos
        rigenerato da un fossile, fuggì da un laboratorio
        e abbatté un enorme palazzo a testate.
    ultra-sun:
      ja-Hrkt: |-
        おおむかしの　ひとは　かせきを
        ほりだし　こうてつ　よりも　かたい
        ずがいこつで　かぶとを　つくっていた。
      ja: |-
        大昔の　人は　化石を
        掘り出し　鋼鉄　よりも　硬い
        頭蓋骨で　兜を　作っていた。
      ko: |-
        먼 옛날 사람은 화석을 발굴하여
        강철보다 딱딱한 두개골로
        투구를 만들었다.
      zh-Hant: |-
        古時候人們會挖出牠的化石，
        用比鋼鐵還要堅硬的
        頭蓋骨製作頭盔。
      zh-Hans: |-
        过去的人们曾在挖出化石后，
        用比钢铁还硬的头盖骨做成头盔。
      en: |-
        In ancient times, people would dig up fossils of
        this Pokémon and use its skull, which is harder
        than steel, to make helmets.
      fr: |-
        Il y a bien longtemps, les hommes fabriquaient
        des casques plus solides que l’acier à partir de
        crânes de Charkos fossilisés.
      de: |-
        Vor langer Zeit wurden die Fossilien dieses
        Pokémon ausgegraben und aus den stahlharten
        Schädeln Helme hergestellt.
      es: |-
        Los hombres de antaño que encontraban restos
        fosilizados de Rampardos usaban su cráneo,
        más duro que el metal, para fabricar cascos.
      it: |-
        In tempi antichi gli uomini si servivano dei fossili
        del cranio di questi Pokémon, più duro
        dell’acciaio, per fabbricare elmi.
    ultra-moon:
      ja-Hrkt: |-
        ずつきが　とくいな　こだいのポケモン。
        ほんとうに　のうみそが　ちいさいので
        おろかで　ほろんだというせつも　ある。
      ja: |-
        頭突きが　得意な　古代のポケモン。
        本当に　脳みそが　小さいので
        愚かで　滅んだという説も　ある。
      ko: |-
        박치기가 특기인 고대 포켓몬이다.
        뇌가 정말 작기 때문에
        멍청해서 멸종했다는 설도 있다.
      zh-Hant: |-
        擅長頭錘的古代寶可夢。
        因為大腦真的很小，所以也有說法
        認為牠是因為太笨而滅亡的。
      zh-Hans: |-
        擅长头锤的古代宝可梦。
        因为大脑真的很小，
        所以也有说法它是因愚笨而灭亡的。
      en: |-
        This ancient Pokémon used headbutts skillfully.
        Its brain was really small, so some theories
        suggest that its stupidity led to its extinction.
      fr: |-
        Pokémon préhistorique célèbre pour ses coups
        de tête puissants et son petit cerveau, son
        extinction serait due à son extrême bêtise.
      de: |-
        Dieses auf Kopfstöße spezialisierte urzeitliche
        Pokémon soll einer Theorie zufolge wegen seines
        kleinen Hirns aus Dummheit ausgestorben sein.
      es: |-
        Pokémon prehistórico especializado en dar
        cabezazos. Una teoría atribuye su extinción a
        su cerebro pequeño y a su poca inteligencia.
      it: |-
        Questo antico Pokémon eccelle nel dare testate.
        Secondo una teoria, si è estinto perché troppo
        ottuso. Il suo cervello è infatti molto piccolo.
