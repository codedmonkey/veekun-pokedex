        librement le cyberespace.
    black-2:
      en: |-
        A man-made Pokémon created using
        advanced scientific means. It can
        move freely in cyberspace.
    white-2:
      en: |-
        A man-made Pokémon created using
        advanced scientific means. It can
        move freely in cyberspace.
    x:
      ja-Hrkt: |-
        けんきゅうのすえ　うみだされた
        じんこうの　ポケモン。きほんてきな
        どうさしか　プログラムされていない。
      ja: |-
        研究の末　生み出された
        人工の　ポケモン。基本的な
        動作しか　プログラムされていない。
      ko: |-
        연구 끝에 태어난
        인공 포켓몬이다. 기본적인
        동작만 프로그램되어 있다.
      en: |-
        A man-made Pokémon that came about
        as a result of research. It is programmed
        with only basic motions.
      fr: |-
        Un Pokémon créé par l’homme après de longues
        recherches. Il ne connaît que peu de mouvements.
      de: |-
        Ein künstlich produziertes Pokémon, welches das
        Ergebnis von Forschungen ist. Es ist simpel aufgebaut.
      es: |-
        Pokémon creado por el hombre tras muchas
        investigaciones. Sus habilidades son básicas.
      it: |-
        Questo Pokémon è il risultato di una ricerca umana.
        Esegue solo i movimenti più elementari.
    'y':
      ja-Hrkt: |-
        からだが　プログラムで　できている。
        でんしくうかんを　じゆうじざいに
        いどうできる　のうりょくをもつ。
      ja: |-
        体が　プログラムで　できている。
        電子空間を　自由自在に
        移動できる　能力を持つ。
      ko: |-
        몸이 프로그램으로 만들어져 있다.
        전자 공간을 자유자재로
        이동할 수 있는 능력을 가졌다.
      en: |-
        A Pokémon that consists entirely of programming
        code. It is capable of moving freely in cyberspace.
      fr: |-
        Ce Pokémon est fait de programmes et d’algorithmes.
        Il peut survivre en milieu virtuel.
      de: |-
        Porygon besteht komplett aus Computerdaten.
        Es kann sich frei in virtuellen Welten bewegen.
      es: |-
        Un Pokémon formado por códigos de programación.
        Se mueve libre por el ciberespacio.
      it: |-
        Formato per intero da codici programmatici, può
        muoversi liberamente nel ciberspazio.
    omega-ruby:
      ja-Hrkt: |-
        ぜんしんを　プログラム　データに　もどして
        でんし　くうかんに　はいる　ことが　できる。
        コピーガードされて　いるので　コピー　できない。
      ja: |-
        全身を　プログラム　データに　戻して
        電子　空間に　入る　ことが　できる。
        コピーガードされて　いるので　コピー　できない。
      ko: |-
        전신을 프로그램 데이터로 되돌려
        전자 공간에 들어갈 수 있다.
        복사 방지가 되어 있어 복사할 수 없다.
      en: |-
        Porygon is capable of reverting itself entirely back to program
        data and entering cyberspace. This Pokémon is copy protected
        so it cannot be duplicated by copying.
      fr: |-
        Porygon est capable de se décompiler et de retourner à l’état
        de programme informatique pour entrer dans le cyberespace.
        Ce Pokémon est protégé contre le piratage, il est donc
        impossible de le copier.
      de: |-
        Porygon ist in der Lage, sich in Daten zurückzuverwandeln
        und in den Cyberspace zu gelangen. Dieses Pokémon ist
        kopiergeschützt, sodass es durch Kopieren nicht vervielfältigt
        werden kann.
      es: |-
        Porygon es capaz de convertirse otra vez en datos
        informáticos y de entrar en el ciberespacio. Tiene protección
        anticopia, así que es imposible duplicarlo.
      it: |-
        Porygon è in grado di regredire ai suoi codici di
        programmazione originari ed entrare nel cyberspazio.
        Questo Pokémon è dotato di un sistema antipirateria
        per evitarne la duplicazione illecita.
    alpha-sapphire:
      ja-Hrkt: |-
        ぜんしんを　プログラム　データに　もどして
        でんし　くうかんに　はいる　ことが　できる。
        コピーガードされて　いるので　コピー　できない。
      ja: |-
        全身を　プログラム　データに　戻して
        電子　空間に　入る　ことが　できる。
        コピーガードされて　いるので　コピー　できない。
      ko: |-
        전신을 프로그램 데이터로 되돌려
        전자 공간에 들어갈 수 있다.
        복사 방지가 되어 있어 복사할 수 없다.
      en: |-
        Porygon is capable of reverting itself entirely back to program
        data and entering cyberspace. This Pokémon is copy protected
        so it cannot be duplicated by copying.
      fr: |-
        Porygon est capable de se décompiler et de retourner à l’état
        de programme informatique pour entrer dans le cyberespace.
        Ce Pokémon est protégé contre le piratage, il est donc
        impossible de le copier.
      de: |-
        Porygon ist in der Lage, sich in Daten zurückzuverwandeln
        und in den Cyberspace zu gelangen. Dieses Pokémon ist
        kopiergeschützt, sodass es durch Kopieren nicht vervielfältigt
        werden kann.
      es: |-
        Porygon es capaz de convertirse otra vez en datos
        informáticos y de entrar en el ciberespacio. Tiene protección
        anticopia, así que es imposible duplicarlo.
      it: |-
        Porygon è in grado di regredire ai suoi codici di
        programmazione originari ed entrare nel cyberspazio.
        Questo Pokémon è dotato di un sistema antipirateria
        per evitarne la duplicazione illecita.
    sun:
      ja-Hrkt: |-
        およそ　２０ねんまえに　とうじの
        かがくりょくを　けっしゅうし
        うみだされた　じんこうの　ポケモン。
      ja: |-
        およそ　２０年前に　当時の
        科学力を　結集し
        生みだされた　人工の　ポケモン。
      ko: |-
        약 20년 전에 당시의
        과학력을 결집해서
        태어난 인공 포켓몬이다.
      zh-Hant: |-
        大約２０年前，
        集結了當時的科學力量
        創造出來的人工寶可夢。
      zh-Hans: |-
        大约２０年前，
        集当时的科学力量于一身，
        创造出来的人工宝可梦。
      en: |-
        Roughly 20 years ago, it was artificially created,
        utilizing the latest technology of the time.
      fr: |-
        Un Pokémon artificiel créé il y a vingt ans
        en utilisant des méthodes à la pointe de
        la technologie de l’époque.
      de: |-
        Dieses Pokémon wurde vor 20 Jahren künstlich
        erschaffen. Damals stellte es das Nonplusultra
        der technischen Möglichkeiten dar.
      es: |-
        Un Pokémon que fue creado por el hombre hace
        unos 20 años con los medios tecnológicos que
        había disponibles en aquel momento.
      it: |-
        Un Pokémon artificiale creato circa 20 anni fa
        sfruttando le conoscenze scientifiche più
        avanzate dell’epoca.
    moon:
      ja-Hrkt: |-
        からだを　デジタルデータか　することが
        できるので　でんのう　くうかんに
        はいりこむことが　できるのだ。
      ja: |-
        身体を　デジタルデータ化　することが
        できるので　電脳空間に
        入り込むことが　できるのだ。
      ko: |-
        몸을 디지털 데이터화 하는 것이
        가능해서 컴퓨터 공간에
        파고들어 갈 수 있다.
      zh-Hant: |-
        可將身體化為數位資料，
        所以可進入電腦空間。
      zh-Hans: |-
        因为能将身体化为数字数据，
        所以可以进入电脑空间。
      en: |-
        It can convert its body into digital data,
        which enables it to enter cyberspace.
      fr: |-
        Il peut transformer son corps en données
        numériques pour pénétrer dans le cyberespace.
      de: |-
        Es kann seinen Körper in Daten umwandeln
        und somit nach Belieben den virtuellen Raum
        betreten und verlassen.
      es: |-
        Porygon es capaz de convertirse en datos
        informáticos y de entrar en el ciberespacio.
      it: |-
        Il suo corpo può essere digitalizzato, rendendolo
        in grado di entrare nel cyberspazio.
    ultra-sun:
      ja-Hrkt: |-
        やく２０ねんまえの　かがくりょくで
        うみだされた　ポケモンなので　いまや
        じだいおくれな　ぶぶんも　おおい。
      ja: |-
        約２０年前の　科学力で
        生み出された　ポケモンなので　今や
        時代遅れな　部分も　多い。
      ko: |-
        약 20년 전의 과학 기술로 태어난
        포켓몬이기 때문에 지금은
        시대에 뒤떨어진 부분도 많다.
      zh-Hant: |-
        由於是大約２０年前的
        科學技術創造出的寶可夢，
        如今許多部分已經過時了。
      zh-Hans: |-
        由大约２０年前的科学力量
        创造出来的宝可梦，
        所以现在很多部分已经过时了。
      en: |-
        This Pokémon was created using the
        cutting-edge science of 20 years ago, so
        many parts of it have since become obsolete.
      fr: |-
        Un Pokémon artificiel créé il y a vingt ans,
        et qui est donc complètement dépassé sur
        bien des points.
      de: |-
        Dieses Pokémon wurde vor etwa 20 Jahren
        künstlich erschaffen. Ein Großteil der damals
        verwendeten Technik ist heute längst überholt.
      es: |-
        Fue creado por el hombre unos 20 años atrás
        con los medios del momento, por lo que ahora
        está desfasado en muchos aspectos.
      it: |-
        Un Pokémon creato circa 20 anni fa grazie alle
        conoscenze scientifiche dell’epoca. Molte sue
        parti sono ormai obsolete.
    ultra-moon:
      ja-Hrkt: |-
        ２０ねんまえ　うちゅうを　ゆめみた
        かがくしゃたちに　よって　つくられた。
        いまだ　そのゆめは　かなっていない。
      ja: |-
        ２０年前　宇宙を　夢見た
        科学者たちに　よって　作られた。
        未だ　その夢は　叶っていない。
      ko: |-
        20년 전 우주를 꿈꾸는
        과학자들에 의해 만들어졌다.
        아직 그 꿈은 이루지 못했다.
      zh-Hant: |-
        在２０年前被夢想著能探索
        宇宙的科學家們創造出來。
        這個夢想至今仍未實現。
      zh-Hans: |-
        由２０年前梦想着宇宙的
        科学家们创造而成。
        那梦想至今仍未实现。
      en: |-
        It was built 20 years ago by scientists who
        dreamed of exploring space. Their dreams have
        yet to come true.
      fr: |-
        Il a été conçu il y a vingt ans par des
        chercheurs qui rêvaient de conquérir l’espace.
        Ce rêve n’est toujours pas devenu réalité.
      de: |-
        Es wurde vor 20 Jahren von Wissenschaftlern
        erschaffen, die vom Erforschen des Weltraums
        träumten. Ihr Traum hat sich bisher nicht erfüllt.
      es: |-
        Fue creado hace 20 años por un grupo de
        científicos que soñaba con explorar el espacio.
        Dicho sueño aún no se ha cumplido.
      it: |-
        Un Pokémon creato 20 anni fa da alcuni
        scienziati che sognavano di esplorare lo spazio.
        Il loro sogno non è stato ancora realizzato.
    lets-go-pikachu:
      ja-Hrkt: |-
        ゆいいつ　うちゅうまで　とんでいける
        ポケモンと　きたい　されているが
        いまだに　せいこうれいは　ない。
      ja: |-
        唯一　宇宙まで　飛んでいける
        ポケモンと　期待　されているが
        未だに　成功例は　ない。
      ko: |-
        유일하게 우주까지 날아갈 수 있는
        포켓몬으로 기대를 모으고 있지만
        아직 성공한 사례는 없다.
      zh-Hant: |-
        人們期待牠會是唯一
        能夠飛上宇宙的寶可夢，
        但至今還沒有成功的案例。
      zh-Hans: |-
        人们期待它能成为唯一
        能够飞到宇宙的宝可梦，
        然而至今也努力未果。
      en: |-
        The only Pokémon that people anticipate
        can fly into space. None has managed
        the feat yet, however.
      fr: |-
        Ce Pokémon est censé être le seul à pouvoir
        voler jusque dans l’espace, mais pour l’instant,
        aucun Porygon n’y est jamais parvenu.
      de: |-
        Porygon ist das einzige Pokémon, von dem man
        sich erhofft, dass es ins Weltall fliegen kann.
        Bislang ist dies aber keinem Exemplar gelungen.
      es: |-
        Se creía que sería el único Pokémon capaz de
        volar por el espacio, pero aún no se ha visto a
        ninguno que lo haya conseguido.
      it: |-
        Si ritiene che sia l’unico Pokémon in grado
        di volare fino allo spazio, ma ad oggi non è
        ancora successo.
    lets-go-eevee:
      ja-Hrkt: |-
        ゆいいつ　うちゅうまで　とんでいける
        ポケモンと　きたい　されているが
        いまだに　せいこうれいは　ない。
      ja: |-
        唯一　宇宙まで　飛んでいける
        ポケモンと　期待　されているが
        未だに　成功例は　ない。
      ko: |-
        유일하게 우주까지 날아갈 수 있는
        포켓몬으로 기대를 모으고 있지만
        아직 성공한 사례는 없다.
      zh-Hant: |-
        人們期待牠會是唯一
        能夠飛上宇宙的寶可夢，
        但至今還沒有成功的案例。
      zh-Hans: |-
        人们期待它能成为唯一
        能够飞到宇宙的宝可梦，
        然而至今也努力未果。
      en: |-
        The only Pokémon that people anticipate
        can fly into space. None has managed
        the feat yet, however.
      fr: |-
        Ce Pokémon est censé être le seul à pouvoir
        voler jusque dans l’espace, mais pour l’instant,
        aucun Porygon n’y est jamais parvenu.
      de: |-
        Porygon ist das einzige Pokémon, von dem man
        sich erhofft, dass es ins Weltall fliegen kann.
        Bislang ist dies aber keinem Exemplar gelungen.
      es: |-
        Se creía que sería el único Pokémon capaz de
        volar por el espacio, pero aún no se ha visto a
        ninguno que lo haya conseguido.
      it: |-
        Si ritiene che sia l’unico Pokémon in grado
        di volare fino allo spazio, ma ad oggi non è
        ancora successo.
    sword:
      ja-Hrkt: |-
        さいこうの　かがくりょくを　つかい
        せかいで　はじめて　プログラムにより
        つくられた　じんこうの　ポケモン。
      ja: |-
        最高の　科学力を　使い
        世界で　はじめて　プログラムにより
        作られた　人工の　ポケモン。
      ko: |-
        최고의 과학 기술을 사용해
        세계에서 처음으로 프로그래밍되어
        만들어진 인공 포켓몬이다.
      zh-Hant: |-
        牠是以最尖端的科學力量，
        首度在世上利用程式創造
        出來的人工寶可夢。
      zh-Hans: |-
        它是世界上第一个
        由程序编成的人工宝可梦。
        运用最先进的科技制成。
      en: |-
        State-of-the-art technology was used to create
        Porygon. It was the first artificial Pokémon to be
        created via computer programming.
      fr: |-
        C’est le premier Pokémon au monde à avoir
        été créé à partir de programmes informatiques,
        grâce à une technologie de pointe.
      de: |-
        Es ist weltweit das erste künstliche Pokémon,
        das dank neuester Technologien mittels
        Computerprogrammen erschaffen wurde.
      es: |-
        Se trata del primer Pokémon del mundo creado
        a partir de códigos de programación gracias al
        uso de tecnología de vanguardia.
      it: |-
        È il primo Pokémon della storia a essere stato
        creato tramite programmi, grazie all’impiego
        di tecnologie all’avanguardia.
    shield:
      ja-Hrkt: |-
        きんねんは　でんのう　くうかんで
        だいかつやく。　あやしい　データが　
        ないか　チェックして　まわっている。
      ja: |-
        近年は　電脳空間で　大活躍。
        怪しい　データが　ないか
        チェックして　まわっている。
      ko: |-
        근래에는 컴퓨터 공간에서
        대활약한다. 수상한 데이터가
        없는지 체크하며 돌아다닌다.
      zh-Hant: |-
        近年在電腦空間大展身手。
        會四處巡邏查看
        有沒有可疑的資料。
      zh-Hans: |-
        近年来十分活跃于
        电脑空间。到处检查
        有没有可疑的数据。
      en: |-
        In recent years, this species has been very helpful
        in cyberspace. These Pokémon will go around
        checking to make sure no suspicious data exists.
      fr: |-
        Ces dernières années, il s’est rendu très utile
        dans le cyberespace, qu’il arpente pour s’assurer
        qu’il n’y a aucune donnée suspecte.
      de: |-
        In den letzten Jahren nahm es im Cyberspace
        bei der Suche nach verdächtigen Daten eine
        aktive Rolle ein.
      es: |-
        Durante los últimos años, ha estado muy activo
        en el ciberespacio comprobando que no haya
        datos sospechosos.
      it: |-
        Negli ultimi anni ha assunto un ruolo di rilevanza
        nel cyberspazio, in cui si aggira per assicurarsi
        che non ci siano dati sospetti.
