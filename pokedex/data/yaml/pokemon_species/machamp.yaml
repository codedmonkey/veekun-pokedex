machamp:
  base_happiness: 50
  capture_rate: 45
  color: gray
  egg_groups:
    - humanshape
  evolution_chain: machop
  evolves_from: machoke
  flavor_text:
    red:
      en: |-
        Using its heavy
        muscles, it throws
        powerful punchesthat can send the
        victim clear over
        the horizon.
    blue:
      en: |-
        Using its heavy
        muscles, it throws
        powerful punchesthat can send the
        victim clear over
        the horizon.
    yellow:
      en: |-
        One arm alone can
        move mountains.
        Using all fourarms, this POKéMON
        fires off awesome
        punches.
    gold:
      en: |-
        It quickly swings
        its four arms to
        rock its opponentswith ceaseless
        punches and chops
        from all angles.
    silver:
      en: |-
        It uses its four
        powerful arms to
        pin the limbs ofits foe, then
        throws the victim
        over the horizon.
    crystal:
      en: |-
        With four arms
        that react more
        quickly than itcan think, it can
        execute many
        punches at once.
    ruby:
      en: |-
        MACHAMP has the power to hurl anything
        aside. However, trying to do any work
        requiring care and dexterity causesits arms to get tangled.
        This POKéMON tends to leap into action
        before it thinks.
    sapphire:
      en: |-
        MACHAMP is known as the POKéMON that
        has mastered every kind of martial arts.
        If it grabs hold of the foe with its fourarms, the battle is all but over.
        The hapless foe is thrown far over the
        horizon.
    emerald:
      en: |-
        It is impossible to defend against punches
        and chops doled out by its four arms.
        Its fighting spirit flares up when it faces
        a tough opponent.
    firered:
      en: |-
        Its four ruggedly developed arms can
        launch a flurry of 1,000 punches in just
        two seconds.
    leafgreen:
      en: |-
        Its superpowerful punches are said to
        knock the victim flying clear over the
        horizon.
    diamond:
      en: |-
        It punches with its four arms at
        blinding speed. It can launch
        1,000 punches in two seconds.
    pearl:
      en: |-
        It can knock a train flying with a
        punch. However, it is terrible at
        delicate work using its fingers.
    platinum:
      en: |-
        Its four muscled arms slam foes
        with powerful punches and chops
        at blinding speed.
    heartgold:
      en: |-
        It quickly swings its four arms to
        rock its opponents with ceaseless
        punches and chops from all angles.
    soulsilver:
      en: |-
        It uses its four powerful arms to
        pin the limbs of its foe, then
        throws the victim over the horizon.
    black:
      en: |-
        Its four muscled arms slam foes
        with powerful punches and chops
        at blinding speed.
      fr: |-
        La puissance et la rapidité de ses
        quatre bras puissants font des
        ravages sur ses adversaires.
    white:
      en: |-
        Its four muscled arms slam foes
        with powerful punches and chops
        at blinding speed.
      fr: |-
        La puissance et la rapidité de ses
        quatre bras puissants font des
        ravages sur ses adversaires.
    black-2:
      en: |-
        Its four muscled arms slam foes
        with powerful punches and chops
        at blinding speed.
    white-2:
      en: |-
        Its four muscled arms slam foes
        with powerful punches and chops
        at blinding speed.
    x:
      ja-Hrkt: |-
        はったつした　４ほんの　うでは
        ２びょうかんに　１０００ぱつの
        パンチを　くりだすことができる。
      ja: |-
        発達した　４本の　腕は
        ２秒間に　１０００発の　パンチを
        繰り出すことができる。
      ko: |-
        발달한 4개의 팔은
        2초 동안 1000번의
        펀치를 날릴 수 있다.
      en: |-
        Its four ruggedly developed arms can launch
        a flurry of 1,000 punches in just two seconds.
      fr: |-
        Ses deux paires de bras permettent à Mackogneur
        d’envoyer une série de 1 000 coups de poing en 2 s.
      de: |-
        Seine markigen Arme können innerhalb von nur
        zwei Sekunden 1 000 Schläge verteilen.
      es: |-
        Tiene cuatro brazos tan bien desarrollados que puede
        dar una serie de 1000 puñetazos en cuestión de dos
        segundos.
      it: |-
        Le braccia eccezionalmente sviluppate sono in
        grado di assestare 1000 pugni in soli 2 secondi.
    'y':
      ja-Hrkt: |-
        ４ほんのうでで　あいての　てあしを
        おさえこみ　じゆうを　うばうと
        ちへいせんのむこうまで　なげとばす。
      ja: |-
        ４本の　腕で　相手の　手足を
        押さえこみ　自由を　奪うと
        地平線の　向こうまで　投げ飛ばす。
      ko: |-
        4개의 팔로 상대방의 손발을
        붙잡아 꼼짝 못하게 만들고
        지평선 멀리까지 던져버린다.
      en: |-
        It uses its four powerful arms to pin the limbs of its
        foe, then throws the victim over the horizon.
      fr: |-
        Il se sert de ses quatre bras pour enserrer les
        membres de sa victime puis il la projette au loin.
      de: |-
        Es setzt seine vier Arme ein, um die Glieder seiner
        Gegner festzuhalten. Dann wirft es sie hinfort.
      es: |-
        Usa sus cuatro poderosos brazos para agarrar a su
        enemigo y lanzarlo lo más lejos posible.
      it: |-
        Con le sue quattro potenti braccia afferra gli arti del
        nemico per poi lanciarlo lontano.
    omega-ruby:
      ja-Hrkt: |-
        なんでも　なげとばす　パワーを　もつが　こまかい
        さぎょうを　すると　うでが　からまってしまう。
        かんがえる　よりも　さきに　からだが　うごく。
      ja: |-
        なんでも　投げ飛ばす　パワーを　持つが　細かい
        作業を　すると　腕が　絡まってしまう。
        考える　よりも　先に　体が　動く。
      ko: |-
        무엇이든 내던질 수 있는 파워를 지녔으나
        세밀한 작업을 하면 팔이 얽히고 만다.
        생각하기보다 몸이 먼저 움직인다.
      en: |-
        Machamp has the power to hurl anything aside. However,
        trying to do any work requiring care and dexterity causes its
        arms to get tangled. This Pokémon tends to leap into action
        before it thinks.
      fr: |-
        Mackogneur est capable de déplacer n’importe quelle masse.
        Cependant, ses bras s’emmêlent dès qu’il essaie de réaliser
        un travail délicat ou minutieux. Ce Pokémon a tendance à
        cogner d’abord et à réfléchir ensuite.
      de: |-
        Machomei hat genug Kraft, um alles Mögliche zu stemmen.
        Bei Tätigkeiten, die Geschick und Sorgfalt erfordern, machen
        es ihm seine Arme jedoch nicht leicht. Dieses Pokémon neigt
        dazu, zuerst zu handeln und dann zu denken.
      es: |-
        Machamp es tan fuerte que puede derribar lo que quiera.
        Sin embargo, cuando tiene que realizar una tarea que
        requiere delicadeza y destreza, se le enredan los brazos.
        Este Pokémon pasa a la acción sin pensar.
      it: |-
        Machamp è dotato di una forza tale da riuscire a scagliare
        lontano ogni cosa. Le sue braccia sono troppo possenti per
        riuscire a eseguire qualsiasi lavoro che richieda attenzione
        e destrezza. Tende ad agire prima di pensare.
    alpha-sapphire:
      ja-Hrkt: |-
        あらゆる　かくとうぎを　マスターした　ポケモン。
        ４ほんの　うでで　つかまれたら　もう　おわり。
        ちへいせんの　むこうまで　なげとばされてしまう。
      ja: |-
        あらゆる　格闘技を　マスターした　ポケモン。
        ４本の　腕で　つかまれたら　もう　終り。
        地平線の　向こうまで　投げ飛ばされてしまう。
      ko: |-
        모든 격투기를 마스터한 포켓몬이다.
        4개의 팔에 잡히면 그대로 끝이다.
        지평선 너머까지 집어 던져 버린다.
      en: |-
        Machamp is known as the Pokémon that has mastered
        every kind of martial arts. If it grabs hold of the foe with its
        four arms, the battle is all but over. The hapless foe is thrown
        far over the horizon.
      fr: |-
        Mackogneur est célèbre, car c’est le seul Pokémon qui
        a réussi à maîtriser tous les types d’arts martiaux.
        S’il parvient à attraper son ennemi avec ses quatre bras,
        il le projette par-delà l’horizon.
      de: |-
        Machomei wurde berühmt, da es alle Arten der Kampfkunst
        beherrscht. Wenn es einen Gegner mit seinen vier Armen
        zu fassen gekriegt hat, ist der Kampf so gut wie vorbei.
        Es schleudert ihn dann nämlich weit über den Horizont hinaus.
      es: |-
        Machamp es conocido como el Pokémon que domina todas
        las artes marciales. Si agarra a su rival con los cuatro brazos
        que tiene, su enemigo no tendrá nada que hacer. El pobre
        contrincante saldrá volando hasta perderse en el horizonte.
      it: |-
        Machamp è noto per la sua maestria nella pratica di tutte
        le arti marziali. Se afferra il nemico con le sue quattro braccia
        possenti, la lotta è già decisa. Lo sventurato avversario
        verrà infatti scagliato ben oltre l’orizzonte.
    sun:
      ja-Hrkt: |-
        メガトンきゅうの　パンチを　はなち
        たちふさがる　てきを　ちへいせんの
        かなたまで　ぶっとばすのだ。
      ja: |-
        メガトン級の　パンチを　放ち
        立ちふさがる　敵を　地平線の
        彼方まで　ぶっ飛ばすのだ。
      ko: |-
        메가톤급의 펀치를 날려
        앞을 가로막는 적을 지평선
        너머까지 날려버린다.
      zh-Hant: |-
        能使出百萬噸級的拳擊，
        將擋路的敵人擊飛到
        地平線的另一端。
      zh-Hans: |-
        使出百万吨级的拳击，
        将阻挡的敌人击飞到
        地平线的另一端。
      en: |-
        It unleashes megaton-level punches that send
        opponents flying clear over the horizon.
      fr: |-
        Il est capable de donner des coups de poing
        d’une puissance d’une mégatonne, qui envoient
        ses adversaires voler jusqu’à l’horizon.
      de: |-
        Gegner, die sich ihm in den Weg stellen, werden
        mit einem Faustschlag, dessen Wucht 1 Million
        Tonnen übersteigt, gen Horizont geschleudert.
      es: |-
        Puede hacer que sus rivales se pierdan en el
        horizonte con puñetazos que llegan a alcanzar
        hasta un megatón de potencia.
      it: |-
        Sferra pugni di una potenza equivalente a
        un megaton che fanno volare oltre l’orizzonte
        i nemici che gli si parano davanti.
    moon:
      ja-Hrkt: |-
        ダンプさえ　かるがる　もちあげる。
        ただし　ゆびさきは　ぶきようで
        こまかい　しごとは　まるで　むり。
      ja: |-
        ダンプさえ　軽々　持ち上げる。
        ただし　指先は　不器用で
        細かい　仕事は　まるで　無理。
      ko: |-
        덤프트럭마저 가볍게 들어 올린다.
        그러나 손끝은 둔해서
        세밀한 작업은 전혀 못 한다.
      zh-Hant: |-
        即使是大卡車也能輕鬆舉起。
        但是手指很笨拙，
        所以細微的工作完全不行。
      zh-Hans: |-
        即使是翻斗车也能轻松举起。
        但是手指很笨拙，
        所以细微的工作完全不行。
      en: |-
        It can lift heavy loads with the greatest of ease.
        It can even heft dump trucks. But its clumsy
        fingers prevent it from doing any precision work.
      fr: |-
        Il soulève sans effort les plus gros camions à
        benne. Mais il n’est pas habile de ses mains,
        et est incapable de faire un travail de précision.
      de: |-
        Es kann mühelos Kipplaster hochheben. Da es
        jedoch Grobmotoriker ist, sollte man ihm keine
        Arbeit geben, die Fingerspitzengefühl erfordert.
      es: |-
        Puede levantar camiones pesados con gran
        facilidad, pero cuando tiene que hacer algún
        trabajo más delicado, fracasa estrepitosamente.
      it: |-
        Può sollevare senza sforzo anche un camion, ma
        è piuttosto maldestro nei lavori di precisione.
    ultra-sun:
      ja-Hrkt: |-
        ４ほんの　うでで　あいてを　とらえ
        ふくざつな　かたちに　しめあげる。
        カイリキースペシャルと　ひとはよぶ。
      ja: |-
        ４本の　腕で　相手を　捕らえ
        複雑な　形に　締め上げる。
        カイリキースペシャルと　人は呼ぶ。
      ko: |-
        4개의 팔로 상대를 붙잡아
        복잡한 모양으로 세게 조른다.
        사람들은 괴력몬 스페셜이라고 부른다.
      zh-Hant: |-
        會用４隻手臂捉住對手，
        把對手扭成複雜的姿勢，
        人們稱呼這招為怪力特技。
      zh-Hans: |-
        会用４只手臂捉住对手，
        并将其勒成一个复杂的形状。
        人称怪力式固定技。
      en: |-
        It grasps its opponents with its four arms and
        twists them up in an intricate hold. People call
        it “the Machamp special.”
      fr: |-
        Il attrape son adversaire avec ses quatre mains
        avant de le tordre de différentes façons.
        On appelle cela le Massage Spécial Mackogneur.
      de: |-
        Es ergreift seinen Gegner mit seinen vier Armen
        und hält ihn in einem komplizierten Würgegriff.
        Man nennt dies Machomeis Spezialgriff.
      es: |-
        Agarra a su rival con sus cuatro manos y lo
        inmoviliza con una llave imposible que se conoce
        como la Especial de Machamp.
      it: |-
        Afferra l’avversario con le sue quattro braccia
        e lo avvinghia in una stretta complicatissima
        comunemente chiamata “morsa di Machamp”.
    ultra-moon:
      ja-Hrkt: |-
        ４ほんの　うでで　せめも　まもりも
        どうじに　こなす。　このよの　すべての
        かくとうぎを　きわめている　という。
      ja: |-
        ４本の　腕で　攻めも　守りも
        同時に　こなす。　この世の　すべての
        格闘技を　極めている　という。
      ko: |-
        4개의 팔로 공격도 방어도
        동시에 해낸다. 이 세상의 모든
        격투기를 통달했다고 한다.
      zh-Hant: |-
        ４隻手臂能夠同時兼顧
        進攻與防守。據說牠精通
        這世上所有的格鬥技。
      zh-Hans: |-
        ４只手臂攻守兼备。
        据说它精通这世上所有的格斗技。
      en: |-
        With four arms, it can attack and defend
        simultaneously. It’s said to have mastered
        every martial art in the world.
      fr: |-
        Ses quatre bras lui permettent d’attaquer et
        de se défendre en même temps. Il maîtriserait
        tous les arts martiaux existants.
      de: |-
        Mithilfe seiner vier Arme kann es gleichzeitig
        angreifen und verteidigen. Man sagt, es
        beherrsche alle Arten der Kampfkunst.
      es: |-
        Sus cuatro brazos le permiten atacar y defender
        simultáneamente. Se dice que domina todas las
        artes marciales habidas y por haber.
      it: |-
        Grazie alle sue quattro braccia può attaccare
        e difendersi allo stesso tempo. Si dice che sia
        esperto di tutte le arti marziali del mondo.
    lets-go-pikachu:
      ja-Hrkt: |-
        １ぽんでも　やまを　うごかせる
        ちからをもった　うでを　４ほんすべて
        つかって　すごいパンチを　くりだす。
      ja: |-
        １本でも　山を　動かせる
        力をもった　腕を　４本すべて
        使って　凄いパンチを　くり出す。
      ko: |-
        하나만으로도 산을 움직일 수 있는
        힘을 가진 팔을 4개 모두 사용하여
        굉장한 펀치를 날린다.
      zh-Hant: |-
        每隻手臂都有著足以推動
        一座山的力量，會用４隻手臂
        使出威力驚人的拳擊。
      zh-Hans: |-
        仅靠1只手臂的力量便可
        推动一座山。4只手一起
        可以打出极为强力的拳击。
      en: |-
        One arm alone can move mountains.
        Using all four arms, this Pokémon
        fires off awesome punches.
      fr: |-
        Il peut bouger une montagne d’un bras, alors
        rien ne lui résiste quand il utilise les quatre
        en même temps.
      de: |-
        Es kann mit nur einem Arm Berge versetzen.
        Die geballte Kraft seiner vier Arme lässt es
        unvorstellbare Schläge austeilen.
      es: |-
        Un brazo le basta para mover montañas y, si
        usa los cuatro, asesta puñetazos de una potencia
        descomunal.
      it: |-
        Con un solo braccio riesce a muovere una
        montagna. Quando usa tutte e quattro le braccia
        sferra pugni di una potenza inimmaginabile.
    lets-go-eevee:
      ja-Hrkt: |-
        １ぽんでも　やまを　うごかせる
        ちからをもった　うでを　４ほんすべて
        つかって　すごいパンチを　くりだす。
      ja: |-
        １本でも　山を　動かせる
        力をもった　腕を　４本すべて
        使って　凄いパンチを　くり出す。
      ko: |-
        하나만으로도 산을 움직일 수 있는
        힘을 가진 팔을 4개 모두 사용하여
        굉장한 펀치를 날린다.
      zh-Hant: |-
        每隻手臂都有著足以推動
        一座山的力量，會用４隻手臂
        使出威力驚人的拳擊。
      zh-Hans: |-
        仅靠1只手臂的力量便可
        推动一座山。4只手一起
        可以打出极为强力的拳击。
      en: |-
        One arm alone can move mountains.
        Using all four arms, this Pokémon
        fires off awesome punches.
      fr: |-
        Il peut bouger une montagne d’un bras, alors
        rien ne lui résiste quand il utilise les quatre
        en même temps.
      de: |-
        Es kann mit nur einem Arm Berge versetzen.
        Die geballte Kraft seiner vier Arme lässt es
        unvorstellbare Schläge austeilen.
      es: |-
        Un brazo le basta para mover montañas y, si
        usa los cuatro, asesta puñetazos de una potencia
        descomunal.
      it: |-
        Con un solo braccio riesce a muovere una
        montagna. Quando usa tutte e quattro le braccia
        sferra pugni di una potenza inimmaginabile.
    sword:
      ja-Hrkt: |-
        ４ほんのうでを　すばやく　うごかし
        あらゆる　かくどから　やすむことなく
        パンチや　チョップを　たたきこむ。
      ja: |-
        ４本の腕を　すばやく　動かし
        あらゆる　角度から　休むことなく
        パンチや　チョップを　叩きこむ。
      ko: |-
        4개의 팔을 재빠르게 움직여서
        모든 각도에서 쉬지 않고
        펀치와 당수를 날린다.
      zh-Hant: |-
        能夠迅速活動４隻手臂，
        從各種角度毫不停歇地
        使出拳擊或手刀。
      zh-Hans: |-
        能够迅速活动４只手臂，
        从各个角度毫不停歇地
        使出拳击或手刀。
      en: |-
        It quickly swings its four arms to rock its
        opponents with ceaseless punches and chops
        from all angles.
      fr: |-
        Il peut bouger ses quatre bras à grande vitesse
        et frapper du poing ou du tranchant de la main
        dans toutes les directions sans se fatiguer.
      de: |-
        Es verwendet seine vier Arme, um seine Gegner
        unermüdlich mit schnellen Schlägen aus allen
        Winkeln einzudecken.
      es: |-
        Mueve rápidamente sus cuatro brazos para
        asestar incesantes golpes y puñetazos desde
        todos los ángulos.
      it: |-
        Agita velocemente le quattro braccia
        tempestando gli avversari di pugni
        e colpi da ogni direzione.
    shield:
      ja-Hrkt: |-
        ４ほんの　うでは　かんがえるより
        はやく　はんしゃてきに　うごき
        なんぱつもの　パンチを　くりだせる。
      ja: |-
        ４本の　腕は　考えるより
        早く　反射的に　動き
        何発もの　パンチを　繰りだせる。
      ko: |-
        4개의 팔은 생각하는 것보다
        빠르게 반사적으로 움직이며
        여러 발의 펀치를 날린다.
      zh-Hant: |-
        ４隻手臂在思考之前
        就會反射性地行動，
        使出多發拳擊。
      zh-Hans: |-
        ４只手臂在思考之前
        就会反射性地行动，
        使出多发拳击。
      en: |-
        With four arms that react more quickly than it
        can think, it can execute many punches at once.
      fr: |-
