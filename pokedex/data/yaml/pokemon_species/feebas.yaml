  capture_rate: 255
  color: brown
  egg_groups:
    - water1
    - dragon
  evolution_chain: feebas
  evolves_from: ~
  flavor_text:
    ruby:
      en: |-
        FEEBAS’s fins are ragged and
        tattered from the start of its life.
        Because of its shoddy appearance, thisPOKéMON is largely ignored.
        It is capable of living in both the sea
        and in rivers.
    sapphire:
      en: |-
        While FEEBAS’s body is in tatters,
        it has a hardy and tenacious life force
        that enables it to live anywhere.However, this POKéMON is also slow and
        dimwitted, making it an easy catch.
    emerald:
      en: |-
        FEEBAS live in ponds that are heavily
        infested with weeds. Because of its
        hopelessly shabby appearance, it
        seems as if few TRAINERS raise it.
    firered:
      en: |-
        Ridiculed for its shabby appearance,
        it is ignored by researchers. It lives in
        ponds choked with weeds.
    leafgreen:
      en: |-
        Ridiculed for its shabby appearance,
        it is ignored by researchers. It lives in
        ponds choked with weeds.
    diamond:
      en: |-
        It is famous for its shabby
        appearance. While populous, they
        tend to cluster in set locations.
    pearl:
      en: |-
        It eats anything, so it can even
        live in polluted streams and lakes.
        No one pays any attention to it.
    platinum:
      en: |-
        It is a shabby and ugly Pokémon.
        However, it is very hardy and
        can survive on little water.
    heartgold:
      en: |-
        It is the shabbiest Pokémon of all.
        It forms in schools and lives at the
        bottom of rivers.
    soulsilver:
      en: |-
        It is the shabbiest Pokémon of all.
        It forms in schools and lives at the
        bottom of rivers.
    black:
      en: |-
        It is a shabby and ugly Pokémon.
        However, it is very hardy and
        can survive on little water.
      fr: |-
        Ce Pokémon a peut-être un physique
        disgracieux, mais il est robuste et
        peut survivre dans très peu d’eau.
    white:
      en: |-
        It is a shabby and ugly Pokémon.
        However, it is very hardy and
        can survive on little water.
      fr: |-
        Ce Pokémon a peut-être un physique
        disgracieux, mais il est robuste et
        peut survivre dans très peu d’eau.
    black-2:
      en: |-
        It is a shabby and ugly Pokémon.
        However, it is very hardy and
        can survive on little water.
    white-2:
      en: |-
        It is a shabby and ugly Pokémon.
        However, it is very hardy and
        can survive on little water.
    x:
      ja-Hrkt: |-
        なんでも　たべるので　きたない
        かわや　みずうみでも　いきていける。
        だれも　ちゅうもくしない　ポケモン。
      ja: |-
        なんでも　食べるので
        汚い　川や　湖でも　生きていける。
        だれも　注目しない　ポケモン。
      ko: |-
        무엇이든 먹기 때문에 더러운
        강이나 호수에서도 살 수 있다.
        누구도 주목하지 않는 포켓몬이다.
      en: |-
        It eats anything, so it can even live in polluted
        streams and lakes. No one pays any attention to it.
      fr: |-
        Il peut vivre dans les fleuves et les lacs pollués car
        il mange de tout. Personne ne se soucie de lui.
      de: |-
        Es frisst einfach alles und kann daher
        auch in verschmutzter Umgebung leben.
        Niemand beachtet es.
      es: |-
        Come de todo, por lo que puede vivir en aguas
        contaminadas. Nadie le presta atención.
      it: |-
        Si nutre di qualsiasi cosa, pertanto vive anche in fiumi
        e laghi inquinati. È un Pokémon di scarso interesse.
    'y':
      ja-Hrkt: |-
        いちばん　みすぼらしい　ポケモン。
        みずくさの　おおい　かわぞこで
        おおぜい　あつまって　くらしている。
      ja: |-
        一番　みすぼらしい　ポケモン。
        水草の　多い　川底で
        大勢　集まって　暮らしている。
      ko: |-
        제일 볼품없는 포켓몬이다.
        수초가 많은 강바닥에
        한데 모여 살고 있다.
      en: |-
        It is the shabbiest Pokémon of all. It forms in
        schools and lives at the bottom of rivers.
      fr: |-
        Son apparence est pathétique. Il forme des bancs
        dans les rivières riches en plantes aquatiques.
      de: |-
        Das schäbigste Pokémon von allen. Es lebt auf dem
        Grund von Flüssen, wo viele Wasserpflanzen wachsen.
      es: |-
        Es el Pokémon con peor aspecto. Vive en grupos en
        lechos de ríos con abundantes plantas acuáticas.
      it: |-
        Il Pokémon più sciatto. Vive in grandi gruppi nei
        letti dei fiumi ricchi di piante acquatiche.
    omega-ruby:
      ja-Hrkt: |-
        うまれつき　ヒレが　ボロボロで　みっともないため
        だれにも　あいてに　されない　ポケモンだ。
        うみと　かわの　どちらでも　せいかつできる。
      ja: |-
        生まれつき　ヒレが　ボロボロで　みっともないため
        誰にも　相手に　されない　ポケモンだ。
        海と　川の　どちらでも　生活できる。
      ko: |-
        태어날 때부터 지느러미가 너덜너덜
        보기 흉해서 아무도 상대해주지 않는 포켓몬이다.
        바다와 강 양쪽 모두에서 생활할 수 있다.
      en: |-
        Feebas’s fins are ragged and tattered from the start of its life.
        Because of its shoddy appearance, this Pokémon is largely
        ignored. It is capable of living in both the sea and in rivers.
      fr: |-
        Les nageoires de Barpau sont abîmées et déchirées
        dès sa naissance. Ce Pokémon est généralement ignoré
        à cause de son apparence miséreuse. Il peut vivre
        dans la mer ou en eau douce.
      de: |-
        Barschwas Flossen waren schon immer zerfetzt. Wegen seines
        merkwürdigen Aussehens wird dieses Pokémon weitgehend
        ignoriert. Es kann sowohl im Meer als auch in Flüssen leben.
      es: |-
        Feebas tiene las aletas melladas y rasgadas desde que nace.
        Debido a este aspecto poco imponente, son pocos los que lo
        tienen en cuenta. Este Pokémon puede vivir tanto en agua
        salada como dulce.
      it: |-
        Le pinne di Feebas sono logore e sbrindellate fin dalla
        nascita. A causa di questo suo aspetto disordinato,
        il Pokémon è solitamente ignorato. È in grado di vivere
        in mare e nei fiumi.
    alpha-sapphire:
      ja-Hrkt: |-
        からだは　ボロボロだが　どこでも　いきていける
        しぶとい　せいめいりょくを　もつ　ポケモン。
        しかし　ノロマなので　すぐに　つかまってしまう。
      ja: |-
        体は　ボロボロだが　どこでも　生きていける
        しぶとい　生命力を　持つ　ポケモン。
        しかし　ノロマなので　すぐに　捕まってしまう。
      ko: |-
        몸은 엉망이지만 어디에서든 살아갈 수 있는
        끈질긴 생명력을 지닌 포켓몬이다.
        하지만 아둔해서 금방 붙잡힌다.
      en: |-
        While Feebas’s body is in tatters, it has a hardy and tenacious
        life force that enables it to live anywhere. However, this
        Pokémon is also slow and dimwitted, making it an easy catch.
      fr: |-
        Même si le corps de Barpau est en lambeaux, il reste tenace
        et obstiné, ce qui lui permet de survivre partout. Cependant,
        ce Pokémon est très lent et un peu bête, ce qui en fait
        une proie facile.
      de: |-
        Obwohl Barschwas Körper zerfetzt ist, besitzt es eine harte
        und zähe Lebenskraft, sodass es überall leben kann. Aber
        dieses Pokémon ist langsam und dusselig. Daher ist es leicht
        zu fangen.
      es: |-
        Aunque Feebas tenga el cuerpo mellado, posee una
        tremenda y constante fuerza vital que le permite vivir en
        cualquier lugar. Con todo, es un Pokémon lento y simplón;
        es fácil de atrapar.
      it: |-
        Sebbene abbia il corpo logoro, Feebas è molto tenace
        e resistente, potendo così vivere in ogni luogo. Tuttavia,
        questo Pokémon è anche lento e poco sveglio, il che
        lo rende una preda facile.
    sun:
      ja-Hrkt: |-
        きたない　みずでも　ぜんぜん　へいきな
        タフな　ポケモン。　でも　ボロボロで
        みすぼらしいので　にんきは　ない。
      ja: |-
        汚い　水でも　ぜんぜん　平気な
        タフな　ポケモン。　でも　ボロボロで
        みすぼらしいので　人気は　ない。
      ko: |-
        더러운 물이라도 아무렇지 않은
        터프한 포켓몬. 하지만 추레하고
        초라해서 인기는 없다.
      zh-Hant: |-
        即使在髒水裡也毫不介意的
        堅強寶可夢。但那一副破破爛爛的
        寒酸樣子並不受到歡迎。
      zh-Hans: |-
        即使在脏水里也完全不介意的
        强壮的宝可梦。但破破烂烂一副
        寒酸的样子，所以不受欢迎。
      en: |-
        A tough Pokémon that is perfectly fine even
        in dirty water. However, due to its ragged,
        shabby appearance, it isn’t popular.
      fr: |-
        Ce Pokémon n’a pas beaucoup d’adeptes, du
        fait de son air miteux. Il est pourtant robuste
        et n’a pas peur de nager en eaux troubles.
      de: |-
        Dieses robuste Pokémon fühlt sich selbst in
        verschmutztem Wasser wohl. So schäbig und
        zerfetzt es ist, so unbeliebt ist es auch.
      es: |-
        Este Pokémon es tan resistente que puede vivir
        sin problema hasta en las aguas más sucias,
        pero no es muy popular a causa de su aspecto.
      it: |-
        Non è molto popolare per via del suo misero
        aspetto, ma è molto resistente e in grado di
        vivere anche in acque inquinate.
    moon:
      ja-Hrkt: |-
        みためが　わるいので　にんきはないが
        きょういの　せいめいりょくが　あり
        けんきゅうたいしょうには　なっている。
      ja: |-
        見た目が　悪いので　人気はないが
        脅威の　生命力が　あり
        研究対象には　なっている。
      ko: |-
        겉모습이 좋지 않아 인기는 없지만
        경이로운 생명력을 지니고 있어
        연구대상이 되고 있다.
      zh-Hant: |-
        外表醜陋，所以不受歡迎。
        擁有驚人的生命力，
        因而成為了研究對象。
      zh-Hans: |-
        外表丑陋，所以不受欢迎。
        拥有惊人的生命力，
        因而成为了研究对象。
      en: |-
        Although unattractive and unpopular, this
        Pokémon’s marvelous vitality has made it a
        subject of research.
      fr: |-
        Comme il est tout de même franchement laid,
        ce Pokémon a un succès très mitigé. Sa grande
        vitalité fait néanmoins l’objet de moult études.
      de: |-
        Sein unvorteilhaftes Aussehen macht es zwar
        unbeliebt, doch seine erstaunliche Lebenskraft
        hat das Interesse der Forscher an ihm geweckt.
      es: |-
        Como su aspecto deja bastante que desear, no
        se le aprecia mucho. Aun así, su gran vitalidad
        puede ser muy interesante para la ciencia.
      it: |-
        È un Pokémon poco popolare per via del suo
        misero aspetto. Tuttavia, la sua prodigiosa
        vitalità ha attirato l’interesse dei ricercatori.
    ultra-sun:
      ja-Hrkt: |-
        ボロボロなので　だれも　つかまえない。
        まずそうなので　えものにも　されない。
        けっかてきに　どんどん　ふえていく。
      ja: |-
        ボロボロなので　誰も　捕まえない。
        まずそうなので　獲物にも　されない。
        結果的に　どんどん　増えていく。
      ko: |-
        모습이 초라해서 아무도 잡지 않는다.
        맛없어 보여서 아무도 먹지 않는다.
        결과적으로 개체 수만 점점 늘어난다.
      zh-Hant: |-
        因為破破爛爛的，誰也不會去捉牠。
        因為看起來很難吃，所以不會被當成獵物。
        於是數量就變得越來越多了。
      zh-Hans: |-
        因为破破烂烂的，谁也不要捉。
        因为看起来不好吃，也不会被当做猎物。
        结果就是，数量嗖嗖地增加起来。
      en: |-
        They look ragged, so no one catches them. They
        look like they’d taste bad, so predators won’t
        eat them. And their numbers continue to grow.
      fr: |-
        Son apparence peu ragoûtante repousse les
        prédateurs et dissuade les gens de le pêcher.
        Sa population augmente donc rapidement.
      de: |-
        Wegen ihres schäbigen Aussehens werden sie
        nicht gefangen und auch als Beute verschmäht.
        Dadurch vermehren sie sich ungehindert.
      es: |-
        Debido a su cuerpo mellado y su feo aspecto, no
        es muy apetecible como presa ni popular entre
        los Entrenadores y por eso está proliferando.
      it: |-
        Per via del suo misero aspetto, nessuno lo
        cattura e nessun predatore lo trova appetitoso.
        Per questo continua a proliferare.
    ultra-moon:
      ja-Hrkt: |-
        みすぼらしいので　たいていの　ひとは
        みむきも　しないが　ヒンバス　だけを
        あつめる　コレクターだって　いるぞ。
      ja: |-
        みすぼらしいので　大抵の　人は
        見向きも　しないが　ヒンバス　だけを
        集める　コレクターだって　いるぞ。
      ko: |-
        외모가 초라해서 대부분 사람은
        거들떠보지도 않지만 빈티나만을
        모으는 컬렉터도 있다.
      zh-Hant: |-
        因為長得很難看，大多數的人
        對牠毫無興趣。但也有
        專門收集醜醜魚的收藏家存在。
      zh-Hans: |-
        因为长得寒碜，
        大多数人看都不看，
        但是有只收集丑丑鱼的收藏家。
      en: |-
        Because of its wretched appearance, most
        people pay it no attention, but there are some
        who collect Feebas—and Feebas alone!
      fr: |-
        En raison de sa laideur, la plupart des gens
        détournent le regard quand ils le croisent.
        Il a cependant des fans qui le collectionnent.
      de: |-
        Die meisten Menschen schenken ihm wegen
        seines armseligen Äußeren keine Beachtung.
        Doch es gibt Sammler, die nur Barschwa wollen.
      es: |-
        Debido a su aspecto tan descuidado, la mayoría
        de la gente no le presta atención. Sin embargo,
        hay personas que coleccionan solo Feebas.
      it: |-
        Molti non lo degnano di uno sguardo per via del
        suo misero aspetto. Tuttavia, alcuni collezionisti
        catturano solo i Feebas.
    sword:
      ja-Hrkt: |-
        みためが　わるいので　にんきはないが
        きょういの　せいめいりょくが　あり
        けんきゅうたいしょうには　なっている。
      ja: |-
        見た目が　悪いので　人気はないが
        脅威の　生命力が　あり
        研究対象には　なっている。
      ko: |-
        겉모습이 좋지 않아 인기는 없지만
        경이로운 생명력을 지니고 있어
        연구 대상이 되고 있다.
      zh-Hant: |-
        外表醜陋，所以不受歡迎。
        擁有驚人的生命力，
        因而成為了研究對象。
      zh-Hans: |-
        外表丑陋，所以不受欢迎。
        拥有惊人的生命力，
        因而成为了研究对象。
      en: |-
        Although unattractive and unpopular, this
        Pokémon’s marvelous vitality has made it a
        subject of research.
      fr: |-
        Comme il est tout de même franchement laid,
        ce Pokémon a un succès très mitigé. Sa grande
        vitalité fait néanmoins l’objet de moult études.
      de: |-
        Sein unvorteilhaftes Aussehen macht es zwar
        unbeliebt, doch seine erstaunliche Lebenskraft
        hat das Interesse der Forscher an ihm geweckt.
      es: |-
        Su aspecto poco agraciado hace que no sea muy
        popular, pero su gran vitalidad resulta de gran
        interés para la ciencia.
      it: |-
        È un Pokémon poco popolare per via del suo
        misero aspetto. Tuttavia, la sua prodigiosa
        vitalità ha attirato l’interesse dei ricercatori.
    shield:
      ja-Hrkt: |-
        みすぼらしく　みにくい　ポケモンだが
        しぶとい　せいめいりょくを　もち
        わずかな　みずだけでも　いきのびる。
      ja: |-
        みすぼらしく　醜い　ポケモンだが
        しぶとい　生命力を　もち
        わずかな　水だけでも　生き延びる。
      ko: |-
        볼품없고 못생긴 포켓몬이지만
        강인한 생명력을 가져
        약간의 물만 있어도 살아남는다.
      zh-Hant: |-
        雖然看起來弱小又醜陋，
        但擁有頑強的生命力，
        只要少量的水就能存活。
      zh-Hans: |-
        虽然外表丑陋，
        但拥有顽强的生命力，
        只要少量的水就能存活。
      en: |-
        It is a shabby and ugly Pokémon. However, it is
        very hardy and can survive on little water.
      fr: |-
        Ce Pokémon a peut-être un physique disgracieux,
        mais il est robuste et peut survivre dans très peu
        d’eau.
      de: |-
        Ein schäbiges, ja sogar hässliches Pokémon.
        Dafür ist es abgehärtet und überlebt auch mit
        wenig Wasser.
      es: |-
        Su apariencia deja bastante que desear, pero es
        muy resistente y puede sobrevivir con poca agua.
      it: |-
        È un Pokémon dall’aspetto brutto e misero.
        Tuttavia, è molto resistente e può sopravvivere
        anche in pochissima acqua.
