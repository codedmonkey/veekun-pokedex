toxicroak:
  base_happiness: 50
  capture_rate: 75
  color: blue
  egg_groups:
    - humanshape
  evolution_chain: croagunk
  evolves_from: croagunk
  flavor_text:
    diamond:
      en: |-
        Its knuckle claws secrete a toxin
        so vile that even a scratch could
        prove fatal.
    pearl:
      en: |-
        The toxin made in its poison sacs
        is pumped to the knuckle claws
        through tubes down its arms.
    platinum:
      en: |-
        It has a poison sac at its throat.
        When it croaks, the stored poison
        is churned for greater potency.
    heartgold:
      en: |-
        Swaying and dodging the attacks of its
        foes, it weaves its flexible body in close,
        then lunges out with its poisonous claws.
    soulsilver:
      en: |-
        Swaying and dodging the attacks of its
        foes, it weaves its flexible body in close,
        then lunges out with its poisonous claws.
    black:
      en: |-
        It has a poison sac at its throat.
        When it croaks, the stored poison
        is churned for greater potency.
      fr: |-
        Quand il coasse, le poison stocké
        sous sa gorge est secoué, le
        rendant ainsi plus efficace.
    white:
      en: |-
        It has a poison sac at its throat.
        When it croaks, the stored poison
        is churned for greater potency.
      fr: |-
        Quand il coasse, le poison stocké
        sous sa gorge est secoué, le
        rendant ainsi plus efficace.
    black-2:
      en: |-
        The croaking that Toxicroak produces
        before a battle is for churning the
        poison it has stored in its poison sac.
    white-2:
      en: |-
        The croaking that Toxicroak produces
        before a battle is for churning the
        poison it has stored in its poison sac.
    x:
      ja-Hrkt: |-
        のどもとに　どくぶくろを　もつ。
        のどを　ならすと　たまった　どくは
        ねりこまれ　きょうりょくになる。
      ja: |-
        のど元に　毒袋を　持つ。
        のどを　鳴らすと　たまった　毒は
        練りこまれ　強力になる。
      ko: |-
        목 주변에 독주머니를 지녔다.
        목을 울리면 모여진 독이
        잘 섞여져서 강력해진다.
      en: |-
        It has a poison sac at its throat. When it croaks,
        the stored poison is churned for greater potency.
      fr: |-
        Quand il coasse, le poison stocké sous sa gorge est
        secoué, le rendant ainsi plus efficace.
      de: |-
        Verfügt über einen Giftsack an seiner Kehle.
        Quakt es, schäumt das Gift und wird so noch stärker.
      es: |-
        Almacena veneno en una bolsa de la garganta. Cuando
        croa, este se agita para lograr mayor potencia.
      it: |-
        Ha una sacca di veleno sulla gola. Quando gracida
        il veleno si rimescola, diventando più efficace.
    'y':
      ja-Hrkt: |-
        こぶしの　トゲからは　かすりきずでも
        いのちを　おとすほどの　もうどくを
        ぶんぴつしている。
      ja: |-
        こぶしの　トゲからは
        かすり傷でも　命を　落とすほどの
        猛毒を　分泌する。
      ko: |-
        주먹의 가시는 긁히기만 해도
        생명을 잃을 정도의 맹독을
        분비하고 있다.
      en: |-
        Its knuckle claws secrete a toxin so vile that even a
        scratch could prove fatal.
      fr: |-
        Les griffes de ses poings sécrètent une toxine si
        atroce qu’une simple égratignure peut s’avérer fatale.
      de: |-
        Die Gelenke an seinen Klauen geben ein so starkes
        Gift ab, dass selbst ein kleiner Kratzer fatal ist.
      es: |-
        Sus garras segregan una toxina tan potente que un
        simple arañazo puede ser mortal.
      it: |-
        I suoi artigli secernono una tossina così velenosa
        che persino un graffio può essere letale.
    omega-ruby:
      ja-Hrkt: |-
        のどもとに　どくぶくろを　もつ。
        のどを　ならすと　たまった　どくは
        ねりこまれ　きょうりょくになる。
      ja: |-
        のど元に　毒袋を　持つ。
        のどを　鳴らすと　たまった　毒は
        練りこまれ　強力になる。
      ko: |-
        목 주변에 독주머니를 지녔다.
        목을 울리면 모여진 독이
        잘 섞여져서 강력해진다.
      en: |-
        It has a poison sac at its throat. When it croaks,
        the stored poison is churned for greater potency.
      fr: |-
        Quand il coasse, le poison stocké sous sa gorge est secoué,
        le rendant ainsi plus efficace.
      de: |-
        Verfügt über einen Giftsack an seiner Kehle. Quakt es,
        schäumt das Gift und wird so noch stärker.
      es: |-
        Almacena veneno en una bolsa de la garganta. Cuando croa,
        este se agita para lograr mayor potencia.
      it: |-
        Ha una sacca di veleno sulla gola. Quando gracida il veleno
        si rimescola, diventando più efficace.
    alpha-sapphire:
      ja-Hrkt: |-
        こぶしの　トゲからは　かすりきずでも
        いのちを　おとすほどの　もうどくを
        ぶんぴつしている。
      ja: |-
        こぶしの　トゲからは
        かすり傷でも　命を　落とすほどの
        猛毒を　分泌する。
      ko: |-
        주먹의 가시는 긁히기만 해도
        생명을 잃을 정도의 맹독을
        분비하고 있다.
      en: |-
        Its knuckle claws secrete a toxin so vile that even a
        scratch could prove fatal.
      fr: |-
        Les griffes de ses poings sécrètent une toxine si atroce
        qu’une simple égratignure peut s’avérer fatale.
      de: |-
        Die Gelenke an seinen Klauen geben ein so starkes Gift ab,
        dass selbst ein kleiner Kratzer fatal ist.
      es: |-
        Sus garras segregan una toxina tan potente que un simple
        arañazo puede ser mortal.
      it: |-
        I suoi artigli secernono una tossina così velenosa che persino
        un graffio può essere letale.
    sword:
      ja-Hrkt: |-
        はねるように　てきに　ちかづくと
        どくのツメで　えぐるように　うつ！
        かすりキズでも　あいては　ＫＯだ。
      ja: |-
        跳ねるように　敵に　近づくと
        毒のツメで　えぐるように　打つ！
        かすり傷でも　相手は　ＫＯだ。
      ko: |-
        튀어 오르듯 상대에게 다가간 뒤
        독손톱으로 찌르듯이 공격한다!
        스치기만 해도 상대는 KO다.
      zh-Hant: |-
        一躍而起接近敵人，
        用有毒的爪子狠抓對方！
        光是擦傷就能將對手ＫＯ。
      zh-Hans: |-
        一跃而起接近敌人，
        用有毒的爪子狠抓对方！
        光是擦伤就能将对手ＫＯ。
      en: |-
        It bounces toward opponents and gouges them
        with poisonous claws. No more than a scratch
        is needed to knock out its adversaries.
      fr: |-
        Il bondit sur ses adversaires pour les transpercer
        avec ses griffes empoisonnées. Une simple
        égratignure suffit à les mettre K.O.
      de: |-
        Es nähert sich springend seinem Gegner und
        bohrt seine giftigen Klauen in ihn hinein. Schon
        ein kleiner Kratzer lässt den Gegner K.O. gehen.
      es: |-
        Se abalanza sobre el rival y lo destroza con sus
        garras venenosas. Basta un rasguño para debilitar
        al adversario.
      it: |-
        Si avvicina a balzi al nemico e lo colpisce
        con i suoi artigli avvelenati. Basta un graffio
        per mandare KO l’avversario.
    shield:
      ja-Hrkt: |-
        えものを　しとめると　ゲロゲロと
        しょうりの　おたけびを　あげる。
        ガマゲロゲと　しゅとして　ちかい。
      ja: |-
        獲物を　しとめると　ゲロゲロと
        勝利の　雄叫びを　あげる。
        ガマゲロゲと　種として　近い。
      ko: |-
        사냥감을 처리하면 개굴개굴하며
        승리를 자축하는 소리를 높인다.
        두빅굴과 가까운 종이다.
      zh-Hant: |-
        制服了獵物之後，
        便會呱呱地發出勝利的歡呼。
        與蟾蜍王是相近的物種。
      zh-Hans: |-
        制服了猎物之后，
        便会呱呱地发出胜利的欢呼。
        与蟾蜍王是相近的物种。
      en: |-
        It booms out a victory croak when its prey
        goes down in defeat. This Pokémon and
        Seismitoad are related species.
      fr: |-
        Il lance un coassement viril de victoire
        quand il parvient à terrasser sa proie.
        Il s’apparente aux Crapustule.
      de: |-
        Wenn es seine Beute erlegt, quakt es seinen
        Triumph in die Welt hinaus. Es ist artverwandt
        mit Branawarz.
      es: |-
        Cuando abate una presa, emite un croar de
        victoria a pleno pulmón. Está emparentado con
        los Seismitoad.
      it: |-
        Quando abbatte la preda, lancia un alto gracidio
        di vittoria. Come specie è affine ai Seismitoad.
    legends-arceus:
      en: |-
        Its crimson claws contain a virulent toxin. This toxin can be made
        into a tonic by diluting it, mixing it with several types of wild
        grass, and boiling it down over two days.
