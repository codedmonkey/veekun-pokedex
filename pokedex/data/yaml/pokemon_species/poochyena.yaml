    x:
      ja-Hrkt: |-
        しつこい　せいかくの　ポケモン。
        めをつけた　えものが　ヘトヘトに
        つかれるまで　おいかけまわす。
      ja: |-
        しつこい　性格の　ポケモン。
        目をつけた　獲物が　ヘトヘトに
        疲れるまで　追いかけ回す。
      ko: |-
        집요한 성격의 포켓몬이다.
        점찍은 먹이가 기진맥진
        지칠 때까지 뒤쫓아간다.
      en: |-
        A Pokémon with a persistent nature, it chases its
        chosen prey until the prey becomes exhausted.
      fr: |-
        Un Pokémon très obstiné qui poursuit sa proie jusqu’à
        ce qu’elle soit épuisée.
      de: |-
        Ein beharrliches Pokémon, das seine Beute jagt,
        bis diese erschöpft ist.
      es: |-
        Es muy persistente. Si se fija en una presa, no la
        dejará hasta que caiga agotada.
      it: |-
        Pokémon di natura ostinata. Insegue la preda
        prescelta finché questa non è esausta.
    'y':
      ja-Hrkt: |-
        するどい　きゅうかくで　ねらった
        えものは　ぜったいに　にがさない。
        とっても　しつこい　せいかくだ。
      ja: |-
        鋭い　きゅうかくで　ねらった　獲物は
        絶対に　逃がさない。
        とっても　しつこい　性格だ。
      ko: |-
        날카로운 후각으로 노린
        먹이는 절대로 놓치지 않는다.
        매우 끈질긴 성격이다.
      en: |-
        It has a very tenacious nature. Its acute sense of
        smell lets it chase a chosen prey without ever
        losing track.
      fr: |-
        Medhyèna est d’un tempérament tenace.
        Son odorat très développé lui permet de ne jamais
        perdre la trace de sa proie.
      de: |-
        Es hat ein hartnäckiges Wesen. Sein präziser
        Geruchssinn ermöglicht ihm, seiner Beute
        nachzujagen, ohne die Fährte zu verlieren.
      es: |-
        Es tenaz por naturaleza. Tiene un sentido del olfato
        tan agudo que nunca se le escapa la presa que quiere.
      it: |-
        Pokémon molto tenace. L’olfatto sviluppatissimo gli
        permette di seguire una preda senza mai perderne
        le tracce.
    omega-ruby:
      ja-Hrkt: |-
        うごく　ものを　みつけると　すぐに　かみつく。
        えものが　ヘトヘトに　なるまで　おいかけまわすが
        はんげきされると　しりごみする　ことも　あるよ。
      ja: |-
        動く　ものを　見つけると　すぐに　かみつく。
        獲物が　ヘトヘトに　なるまで　追いかけ回すが
        反撃されると　尻ごみする　ことも　あるよ。
      ko: |-
        움직이는 것을 발견하면 바로 문다.
        먹이가 기진맥진해질 때까지 쫓아다니지만
        반격당하면 뒷걸음치기도 한다.
      en: |-
        At first sight, Poochyena takes a bite at anything that moves.
        This Pokémon chases after prey until the victim becomes
        exhausted. However, it may turn tail if the prey strikes back.
      fr: |-
        Sans se poser de questions, Medhyèna essaie de mordre
        tout ce qui bouge. Ce Pokémon pourchasse sa proie jusqu’à
        ce qu’elle s’épuise. Cependant, il se peut qu’il prenne peur
        et s’enfuie si la proie riposte.
      de: |-
        Sobald Fiffyen eine Bewegung wahrnimmt, schnappt es zu.
        Es jagt seine Beute so lange, bis sie vollkommen erschöpft ist.
        Wenn sich die Beute allerdings wehrt, kann es passieren,
        dass Fiffyen klein beigibt und flieht.
      es: |-
        La primera reacción que Poochyena tiene al ver algo moverse
        es darle un mordisco. Este Pokémon persigue a su presa hasta
        que cae agotada. Aunque, a veces, sale huyendo si su presa
        le responde con un ataque.
      it: |-
        Poochyena azzanna al minimo movimento senza riflettere.
        Caccia la sua preda finché questa non è tanto stanca
        da cedere. Tuttavia, se il nemico contrattacca, Poochyena
        talvolta scappa.
    alpha-sapphire:
      ja-Hrkt: |-
        なんでも　たべる　ざっしょくせいの　ポケモン。
        からだに　くらべ　おおきな　キバが　とくちょう。
        しっぽの　けを　さかだてて　てきを　いかくする。
      ja: |-
        なんでも　食べる　雑食性の　ポケモン。
        体に　比べ　大きな　キバが　特徴。
        尻尾の　毛を　逆立てて　敵を　威嚇する。
      ko: |-
        무엇이든 먹는 잡식성인 포켓몬이다.
        몸에 비해 큰 이빨이 특징이다.
        꼬리의 털을 세우고 적을 위협한다.
      en: |-
        Poochyena is an omnivore—it will eat anything. A distinguishing
        feature is how large its fangs are compared to its body. This
        Pokémon tries to intimidate its foes by making the hair on its
        tail bristle out.
      fr: |-
        Medhyèna est omnivore. Il mange de tout. Ses crocs sont
        très gros, comparés à son corps. Ce Pokémon essaie
        d’intimider ses ennemis en hérissant les poils de sa queue.
      de: |-
        Fiffyen ist ein Allesfresser. Auffällig an diesem Pokémon
        ist das Verhältnis seiner Körpergröße zur Länge seiner Zähne.
        Es versucht Feinde einzuschüchtern, indem es die Haare
        an seinem Schweif abstehen lässt.
      es: |-
        Poochyena es un Pokémon omnívoro. Se come lo que sea.
        Le caracteriza el gran tamaño de sus colmillos respecto al
        resto del cuerpo. Este Pokémon hace que se le erice la cola
        para intentar intimidar a su rival.
      it: |-
        Poochyena è onnivoro: mangia di tutto. Una caratteristica
        distintiva è la dimensione delle zanne rispetto al corpo.
        Cerca di intimidire i nemici rizzando il pelo della coda.
