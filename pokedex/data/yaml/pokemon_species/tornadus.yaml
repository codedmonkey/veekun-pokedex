tornadus:
  base_happiness: 90
  capture_rate: 3
  color: green
  egg_groups:
    - no-eggs
  evolution_chain: tornadus
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        The lower half of its body is wrapped in
        a cloud of energy. It zooms through
        the sky at 200 mph.
      fr: |-
        Le bas de son corps est entouré d’une
        masse d’énergie semblable à un nuage.
        Il vole dans le ciel à 300 km/h.
    white:
      en: |-
        Tornadus expels massive energy from its
        tail, causing severe storms. Its power
        is great enough to blow houses away.
      fr: |-
        L’énergie dégagée par sa queue provoque
        d’énormes tempêtes dont la force peut
        renverser des maisons.
    black-2:
      en: |-
        In every direction it flies,
        creating winds so powerful,
        they blow everything away.
    white-2:
      en: |-
        In every direction it flies,
        creating winds so powerful,
        they blow everything away.
    x:
      ja-Hrkt: |-
        くものような　エネルギーたいに
        かはんしんが　つつまれている。
        じそく３００キロで　そらを　とぶ。
      ja: |-
        雲のような　エネルギー体に
        下半身が　包まれている。
        時速３００キロで　空を　飛ぶ。
      ko: |-
        구름처럼 생긴 에너지체에
        하반신이 둘러싸여 있다.
        시속 300km로 하늘을 난다.
      en: |-
        The lower half of its body is wrapped in a cloud of
        energy. It zooms through the sky at 200 mph.
      fr: |-
        Le bas de son corps est entouré d’une masse
        d’énergie semblable à un nuage. Il vole dans le ciel
        à 300 km/h.
      de: |-
        Sein Unterkörper ist in eine wolkenartige
        Energieschicht gehüllt. Es jagt mit
        bis zu 300 km/h durch die Lüfte.
      es: |-
        La parte inferior de su cuerpo, similar a una nube, está
        recubierta de un campo de energía. Vuela a 300 km/h.
      it: |-
        Ha la parte inferiore del corpo avvolta in una nuvola
        di energia. Sfreccia nei cieli a 300 km/h.
    'y':
      ja-Hrkt: |-
        トルネロスの　しっぽから　ふきだした
        エネルギーが　おおあらしを　おこす。
        みんかを　ふきとばす　パワー。
      ja: |-
        トルネロスの　尻尾から　噴き出した
        エネルギーが　大嵐を　起こす。
        民家を　吹き飛ばす　パワー。
      ko: |-
        토네로스의 꼬리에서 뿜어져 나온
        에너지가 큰 폭풍을 일으킨다.
        민가를 날려버릴 정도의 힘이다.
      en: |-
        Tornadus expels massive energy from its tail,
        causing severe storms. Its power is great enough
        to blow houses away.
      fr: |-
        L’énergie dégagée par sa queue provoque d’énormes
        tempêtes dont la force peut renverser des maisons.
      de: |-
        Mit der Energie aus seiner Rute erzeugt es wilde
        Stürme, die stark genug sind, um ganze Wohnhäuser
        davonzuwehen.
      es: |-
        La energía que desprende de su cola genera violentas
        tempestades capaces de echar abajo casas.
      it: |-
        L’energia sprigionata dalla coda di Tornadus provoca
        una violenta tempesta in grado di spazzare via le case.
