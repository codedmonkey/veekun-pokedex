    x:
      ja-Hrkt: |-
        りくでも　すいちゅうでも　くらせる。
        ちじょうでは　いつも　あせをかき
        ひふを　ぬめぬめ　させている。
      ja: |-
        陸でも　水中でも　暮らせる。
        地上では　いつも　汗をかき
        皮膚を　ぬめぬめ　させている。
      ko: |-
        육지에서도 수중에서도 살 수 있다.
        지상에서는 항상 땀을 흘려서
        피부를 미끌미끌하게 하고 있다.
      en: |-
        It can live in or out of water. When out of water,
        it constantly sweats to keep its body slimy.
      fr: |-
        Ce Pokémon amphibie transpire continuellement
        quand il est hors de l’eau afin d’hydrater son corps.
      de: |-
        Dieses Pokémon kann im Wasser und auch an Land
        leben. An Land schwitzt es sich den Körper nass.
      es: |-
        Capaz de vivir dentro o fuera del agua. Fuera del agua
        suda para mantener baboso su cuerpo.
      it: |-
        Capace di vivere dentro o fuori dall’acqua. Sulla
        terraferma suda per mantenere il suo corpo unto.
    'y':
      ja-Hrkt: |-
        ２ほんの　あしは　はったつしており
        ちじょうで　くらせるのに　なぜか
        すいちゅう　せいかつが　すき。
      ja: |-
        ２本の　脚は　発達しており
        地上で　暮らせるのに　なぜか
        水中　生活が　好き。
      ko: |-
        두 다리가 발달하여
        지상에서 살 수 있는데도 어째서인지
        수중 생활을 좋아한다.
      en: |-
        Its two legs are well developed. Even though it can
        live on the ground, it prefers living in water.
      fr: |-
        Ses deux jambes sont très développées.
        Bien qu’il puisse se déplacer sur la terre ferme,
        ce Pokémon préfère vivre sous l’eau.
      de: |-
        Seine beiden Beine sind gut entwickelt. Auch wenn
        es an Land leben kann, bevorzugt es das Leben
        im Wasser.
      es: |-
        Tiene unas extremidades inferiores muy desarrolladas.
        Aunque puede vivir en tierra, prefiere el medio
        acuático.
      it: |-
        Ha arti inferiori molto sviluppati. Può vivere anche
        sulla terraferma, ma preferisce l’acqua.
    omega-ruby:
      ja-Hrkt: |-
        いつも　からだの　ひょうめんが　えきたいで
        ぬるぬる　ぬれているため　てきに　つかまっても
        ぬるりと　すりぬけ　にげる　ことが　できるぞ。
      ja: |-
        いつも　体の　表面が　液体で
        ぬるぬる　ぬれているため　敵に　捕まっても
        ぬるりと　すり抜け　逃げる　ことが　できるぞ。
      ko: |-
        항상 몸의 표면이 액체로 미끈미끈하게
        젖어 있어서 적에게 붙잡혀도
        미끄덩 빠져나와 도망갈 수 있다.
      en: |-
        The surface of Poliwhirl’s body is always wet and slick with
        a slimy fluid. Because of this slippery covering, it can easily
        slip and slide out of the clutches of any enemy in battle.
      fr: |-
        La peau de Têtarte est toujours maintenue humide par
        un liquide huileux. Grâce à cette protection graisseuse,
        il peut facilement se glisser hors de l’étreinte de n’importe
        quel ennemi.
      de: |-
        Quaputzis Körper ist immer feucht und glitschig. Dadurch kann
        es während eines Kampfes leicht der Umklammerung eines
        Gegners entkommen.
      es: |-
        La piel de Poliwhirl está siempre húmeda y lubricada con un
        fluido viscoso. Gracias a esta película resbaladiza, puede
        escapar de las garras del enemigo, resbalándosele de las
        zarpas en pleno combate.
      it: |-
        La superficie del corpo di Poliwhirl è sempre umida e unta
        di fluido oleoso. Grazie a questa pellicola viscida, nella lotta
        riesce a sfuggire agilmente alle grinfie del nemico.
    alpha-sapphire:
