    sun:
      ja-Hrkt: |-
        りくのうえでも　ふつうに　くらせるが
        てんてきの　ポケモンが　すくないので
        みずの　なかの　せいかつを　このむ。
      ja: |-
        陸の上でも　普通に　暮らせるが
        天敵の　ポケモンが　少ないので
        水の　中の　生活を　好む。
      ko: |-
        육지 위에서도 문제없이 살 수 있지만
        천적인 포켓몬이 적어서
        물속 생활을 선호한다.
      zh-Hant: |-
        即使在陸地上也能正常生活，
        但因為天敵較少，
        所以更喜歡在水中生活。
      zh-Hans: |-
        即使在陆地上也能正常生活，
        但因为天敌的宝可梦较少，
        所以更喜欢在水中生活。
      en: |-
        Although it can live on land, it prefers to stay in
        the water, where it has fewer natural enemies.
      fr: |-
        Il est capable de vivre normalement sur la terre
        ferme, mais il préfère vivre dans l’eau, où il a
        beaucoup moins de prédateurs naturels.
      de: |-
        Es kann zwar auch an Land überleben, aber
        bevorzugt das Wasser, da es dort kaum
        natürliche Feinde hat.
      es: |-
        Puede vivir en tierra firme perfectamente, pero
        prefiere el agua, donde encuentra menos
        enemigos naturales.
      it: |-
        Può vivere anche sulla terraferma, ma preferisce
        stare in acqua, dove ha meno nemici naturali.
    moon:
      ja-Hrkt: |-
        りくじょうを　ねりあるいて
        エサの　むしポケモンを　さがす。
        たべるのは　あんぜんな　みずのなか。
      ja: |-
        陸上を　練り歩いて
        餌の　むしポケモンを　探す。
        食べるのは　安全な　水の中。
      ko: |-
        육지를 누비며
        먹이인 벌레포켓몬을 찾는다.
        먹는 곳은 안전한 물 속이다.
      zh-Hant: |-
        在陸地上到處走著，
        搜尋愛吃的蟲寶可夢，
        然後回到安全的水中享用。
      zh-Hans: |-
        在陆地上四处游走，
        搜寻猎物——虫宝可梦。
        回到安全的水中食用。
      en: |-
        It marches over the land in search of bug
        Pokémon to eat. Then it takes them underwater
        so it can dine on them where it’s safe.
      fr: |-
        Il patrouille sur la terre ferme à la recherche de
        nourriture, à savoir des Pokémon Insecte.
        Il les mange dans l’eau, où il est en sécurité.
      de: |-
        Es geht an Land, um sich auf die Suche nach
        Käfer-Pokémon zu machen. Diese nimmt es
        als Beute mit ins Wasser, wo es sie verzehrt.
      es: |-
        Sale a la superficie en busca de Pokémon
        insecto que llevarse a la boca, aunque luego
        prefiere comérselos bajo la seguridad del agua.
      it: |-
        Cammina lentamente sulla terraferma in cerca
        di Pokémon di tipo Coleottero di cui cibarsi.
        Mangia solo in acqua, dove si sente più al sicuro.
    ultra-sun:
      ja-Hrkt: |-
        りくでも　くらせるように　なったのに
        えものの　さかなポケモンが　おおい
        みずの　なかで　すごしている。
      ja: |-
        陸でも　暮らせるように　なったのに
        獲物の　さかなポケモンが　多い
        水の　中で　過ごしている。
      ko: |-
        지상에서 살 수 있게 되었는데도
        먹이인 물고기포켓몬이 많은
        수중에서 지낸다.
      zh-Hant: |-
        雖然已經能在陸地上生活，
        但還是棲息在有大量魚寶可夢
        可以獵食的水中。
      zh-Hans: |-
        虽然已经能在陆地上生活，
        但还是栖息在有大量
        鱼宝可梦可捕食的水中。
      en: |-
        Although it has become capable of living on
        land, it spends its time in the water, where
        its prey, fish Pokémon, are plentiful.
      fr: |-
        Il est enfin capable de vivre sur la terre ferme,
        mais il passe le plus clair de son temps
        à chasser dans les eaux poissonneuses.
      de: |-
        Es hat zwar gelernt, auch an Land zu überleben,
        hält sich aber trotzdem vorwiegend im Wasser
        auf, wo es nach Fisch-Pokémon jagen kann.
      es: |-
        Puede vivir en tierra firme perfectamente, pero
        prefiere el agua, donde encuentra más Pokémon
        pez que le sirven de sustento.
      it: |-
        Si è adattato anche alla terraferma, ma passa
        la maggior parte del tempo in acqua, dove trova
        molti Pokémon acquatici di cui cibarsi.
    ultra-moon:
      ja-Hrkt: |-
        ひふが　かんそうすると　げんきが
        なくなってしまうので　こまめに
        すいぶんを　ほきゅうして　あげよう。
      ja: |-
        皮膚が　乾燥すると　元気が
        なくなってしまうので　こまめに
        水分を　補給して　あげよう。
      ko: |-
        피부가 건조해지면
        기력이 없어지게 되므로
        부지런히 수분을 보충해 주자.
      zh-Hant: |-
        皮膚一旦乾燥就會
        失去活力，所以要
        經常幫牠補充水分。
      zh-Hans: |-
        皮肤干燥就会失去活力，
        所以经常给它补充水分吧。
      en: |-
        Its health suffers when its skin dries out, so be
        sure to moisturize it diligently.
      fr: |-
        Son état de santé se dégrade à mesure que
        sa peau s’assèche, aussi faut-il veiller à ce
        qu’il soit toujours bien hydraté.
      de: |-
        Trocknet seine Haut aus, verliert es an Vitalität.
        An Land sollte man daher stets darauf achten,
        es mit ausreichend Flüssigkeit zu versorgen.
      es: |-
        Cuando se le seca la piel, su salud se resiente,
        por lo que conviene asegurarse de mantenerlo
        siempre bien hidratado.
      it: |-
        Se la sua pelle si secca, perde vitalità, quindi
        è importante assicurarsi che sia costantemente
        idratato.
    lets-go-pikachu:
      ja-Hrkt: |-
        おそわれそうに　なると　おなかの
        うずまきを　つかって　あいてを
        ねむらせ　そのすきに　にげるらしい。
      ja: |-
        襲われそうに　なると　お腹の
        渦巻きを　使って　相手を
        眠らせ　その隙に　逃げるらしい。
      ko: |-
        공격당할 위기에 처하면 배에 있는
        소용돌이를 사용해 상대를
        잠들게 한 뒤 그 틈에 도망치는 듯하다.
      zh-Hant: |-
        遭到襲擊時會利用肚子
        上的漩渦圖案催眠對手，
        然後趁機逃跑。
      zh-Hans: |-
        据说它会在要被对手
        攻击时用腹部的漩涡
        让对方睡着，趁机逃跑。
      en: |-
        Under attack, it uses its belly spiral to put
        the foe to sleep. It then makes its escape.
      fr: |-
        S’il se fait attaquer, il se sert de sa spirale pour
        endormir ses ennemis. Il peut ainsi s’enfuir.
      de: |-
        Wird es angegriffen, versetzt es seine Gegner
        mit dem Spiralmuster auf seinem Bauch in den
        Schlaf und flieht.
      es: |-
        Cuando se siente intimidado, usa la espiral del
        vientre para adormecer al rival y aprovechar
        para escaparse.
      it: |-
        Quando si sente in pericolo usa la spirale
        che ha sulla pancia per addormentare
        gli avversari, poi si dà alla fuga.
    lets-go-eevee:
      ja-Hrkt: |-
        おそわれそうに　なると　おなかの
