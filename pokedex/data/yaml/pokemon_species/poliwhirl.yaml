    sword:
      ja-Hrkt: |-
        おなかの　うずは　ずっと　みていると
        ねむくなる。　こもりうた　がわりに
        こどもを　ねつかせるのにも　つかう。
      ja: |-
        お腹の　渦は　ずっと　見ていると
        眠くなる。　子守唄がわりに
        子どもを　寝つかせるのにも　使う。
      ko: |-
        배의 소용돌이를 계속 보다 보면
        잠이 온다. 자장가 대용으로
        아이를 재울 때도 사용한다.
      zh-Hant: |-
        一直盯著牠肚子上的漩渦看，
        就會想睡覺。牠會利用這花紋
        來代替搖籃曲去哄孩子睡覺。
      zh-Hans: |-
        如果一直盯着它腹部的旋涡看，
        就会变得很困。它会利用这花纹
        来代替摇篮曲去哄孩子睡觉。
      en: |-
        Staring at the swirl on its belly causes drowsiness.
        This trait of Poliwhirl’s has been used in place of
        lullabies to get children to go to sleep.
      fr: |-
        Il suffit de fixer la spirale sur son ventre pour
        s’assoupir. On se sert parfois de lui à la place
        d’une berceuse pour endormir les enfants.
      de: |-
        Wer länger auf seine Bauchspirale blickt, wird
        schläfrig. Manche Leute nutzen dies anstelle
        eines Schlaflieds, damit ihre Kinder einschlafen.
      es: |-
        Mirar fijamente la espiral de su vientre provoca
        somnolencia, por lo que puede usarse como
        alternativa a las nanas para dormir a los niños.
      it: |-
        Chi fissa a lungo il disegno spiraliforme sul ventre
        si assopisce, tant’è che Poliwhirl lo utilizza al
        posto della ninnananna per far dormire i piccoli.
    shield:
      ja-Hrkt: |-
        ぬめぬめとした　ねんえきじょうの
        あせを　かく。　てきに　つかまっても
        ぬるりと　すりぬけ　にげるのだ。
      ja: |-
        ぬめぬめとした　粘液状の
        汗を　かく。　敵に　捕まっても
        ぬるりと　すり抜け　逃げるのだ。
      ko: |-
        미끈미끈한 점액 형태의
        땀을 흘린다. 적에게 붙잡혀도
        스르륵 빠져나와 도망친다.
      zh-Hant: |-
        流的汗是又黏又滑的黏液狀。
        即使被敵人捉住，
        也能滑溜溜地輕易逃脫。
      zh-Hans: |-
        流出的汗是黏滑的粘液状。
        即使被敌人捉住，
        也能哧溜一下滑走逃脱。
      en: |-
        This Pokémon’s sweat is a slimy mucus. When
        captured, Poliwhirl can slither from its enemies’
        grasp and escape.
      fr: |-
        Il sécrète une sorte de mucus huileux qui lui
        permet d’échapper aux ennemis qui tentent
        de l’attraper.
      de: |-
        Quaputzi schwitzt glitschigen Schleim, dank dem
        es leicht der Umklammerung eines Feindes
        entkommen kann.
      es: |-
        Secreta un sudor viscoso que le sirve para
