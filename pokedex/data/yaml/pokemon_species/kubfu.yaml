kubfu:
  base_happiness: 50
  capture_rate: 3
  color: gray
  egg_groups:
    - no-eggs
  evolution_chain: kubfu
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        きびしい　たんれんを　つみ　わざを
        みがく。　たいとくした　わざによって
        しんかしたときに　すがたが　かわる。
      ja: |-
        厳しい　鍛錬を　積み　技を
        磨く。　体得した　技によって
        進化したときの　姿が　変わる。
      ko: |-
        혹독한 수련을 거듭하며 기술을
        갈고닦는다. 체득한 기술에 따라
        진화했을 때의 모습이 달라진다.
      zh-Hant: |-
        藉由累積嚴苛的鍛鍊來
        磨練招式。進化後的樣子
        會根據牠領會的招式而不同。
      zh-Hans: |-
        日积月累地进行艰苦锻炼，
        认真钻研招式。进化后的样子
        会根据所习得的招式不同而改变。
      en: |-
        Kubfu trains hard to perfect its moves. The moves
        it masters will determine which form it takes when
        it evolves.
      fr: |-
        Il suit un entraînement rigoureux pour parfaire
        ses techniques. La forme de son évolution
        dépend des capacités qu’il a assimilées.
      de: |-
        Durch rigoroses Training perfektioniert es seine
        Kampftechnik. Diese bestimmt, welche Form
        Dakuma nach der Entwicklung annimmt.
      es: |-
        Perfecciona su técnica mediante una estricta
        disciplina. Según la corriente marcial que siga,
        adoptará una forma u otra al evolucionar.
      it: |-
        Affina le sue mosse sottoponendosi a duri
        allenamenti. La forma assunta dopo l’evoluzione
        cambia a seconda delle mosse padroneggiate.
    shield:
      ja-Hrkt: |-
        あたまの　しろく　ながい　たいもうを
        ひっぱると　きあいが　たかまり
        たんでんから　パワーが　わきあがる。
      ja: |-
        頭の　白く　長い　体毛を
        引っぱると　気合が　高まり
        丹田から　パワーが　湧きあがる。
      ko: |-
        머리의 하얗고 긴 털을
        잡아당기면 기세가 고조되어
        단전에서 파워가 끓어오른다.
      zh-Hant: |-
        拉緊頭上又白又長的體毛
        就會變得氣勢高昂，
        並且由丹田湧出力量。
      zh-Hans: |-
        拉紧头上又白又长的体毛，
        就会变得斗气势高昂，
        并从丹田涌出力量。
      en: |-
        If Kubfu pulls the long white hair on its head,
        its fighting spirit heightens and power wells up
        from the depths of its belly.
      fr: |-
        Lorsqu’il tire sur les longs poils blancs
        sur sa tête, il devient plus combatif et
        de l’énergie jaillit de sous son nombril.
      de: |-
        Zieht es an dem langen weißen Fell an seinem
        Hinterkopf, steigert das seinen Kampfgeist und
        aus seiner Körpermitte steigt Kraft empor.
      es: |-
        Al tirar de los mechones blancos de la cabeza,
        acrecienta su espíritu luchador y empieza a
        acumular fuerza en el órgano de su bajo vientre.
      it: |-
        Tira i lunghi ciuffi di pelo bianco che ha sulla
        testa per incrementare il suo spirito combattivo,
        facendo sgorgare energia dal ventre.
