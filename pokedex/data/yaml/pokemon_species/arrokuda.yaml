  flavor_text:
    sword:
      ja-Hrkt: |-
        するどく　とがった　あごが　じまん。
        すこしでも　うごくものを　みつけると
        いっちょくせんに　とつげきする。
      ja: |-
        鋭く　尖った　顎が　自慢。
        少しでも　動くものを　見つけると
        一直線に　突撃する。
      ko: |-
        날카롭고 뾰족한 턱을 자랑한다.
        조금이라도 움직이는 것을 발견하면
        일직선으로 돌격한다.
      zh-Hant: |-
        尖銳的下巴是牠的驕傲。
        只要發現周圍有什麼小動作，
        就會一直線衝過去。
      zh-Hans: |-
        尖锐的下巴是它的骄傲。
        只要发现周围有什么小动作，
        就会一直线冲过去。
      en: |-
        If it sees any movement around it, this Pokémon
        charges for it straightaway, leading with its
        sharply pointed jaw. It’s very proud of that jaw.
      fr: |-
        Sa mâchoire fine et aiguisée fait sa fierté.
        À peine voit-il le moindre mouvement
        qu’il fonce dans sa direction.
      de: |-
        Sein spitz zulaufender Kiefer ist sein ganzer Stolz.
        Erblickt es etwas, das sich auch nur ein bisschen
        bewegt, setzt es geradewegs zum Stoßangriff an.
      es: |-
        Se siente muy orgulloso de su afilada mandíbula.
        En cuanto detecta el más mínimo movimiento,
        va directo al objetivo para cargar contra él.
      it: |-
        Va orgoglioso della sua mandibola appuntita.
        Appena nota il minimo movimento, parte subito
        all’attacco.
    shield:
      ja-Hrkt: |-
        はらいっぱいで　きょくたんに
        うごきが　にぶった　ところを
        ウッウに　まるのみに　される。
      ja: |-
        腹一杯で　極端に
        動きが　鈍った　ところを
        ウッウに　丸飲みに　される。
      ko: |-
        배가 불러서 현저히
        움직임이 둔해지면
        윽우지가 통째로 삼켜버린다.
      zh-Hant: |-
        吃飽了之後動作會變得
        極度遲緩，於是就被
        古月鳥整隻吞了下去。
      zh-Hans: |-
        吃饱了之后动作会变得
        极度迟缓，于是就被
        古月鸟整只吞了下去。
      en: |-
        After it’s eaten its fill, its movements become
        extremely sluggish. That’s when Cramorant
        swallows it up.
      fr: |-
        Lorsqu’il a le ventre plein, il a beaucoup
        plus de mal à se déplacer, et c’est à ce moment
        précis qu’il se fait gober par les Nigosier.
      de: |-
        Seine Bewegungsfreiheit ist stark eingeschränkt,
        wenn es vollgefressen ist. So wird es zu leichter
        Beute für Urgl, das es im Ganzen verschlingt.
      es: |-
        Cuando tiene el estómago lleno, le cuesta
        moverse y corre el riesgo de ser engullido por
        algún Cramorant.
      it: |-
        Quando ha la pancia piena i suoi movimenti
        si fanno estremamente lenti e rischia di finire
        inghiottito da un Cramorant.
