nosepass:
  base_happiness: 70
  capture_rate: 255
  color: gray
  egg_groups:
    - mineral
  evolution_chain: nosepass
  evolves_from: ~
  flavor_text:
    ruby:
      en: |-
        NOSEPASS’s magnetic nose is always
        pointed to the north. If two of these
        POKéMON meet, they cannot turntheir faces to each other when they
        are close because their magnetic noses
        repel one another.
    sapphire:
      en: |-
        NOSEPASS had been said to be completely
        unmoving, with its magnetic nose
        pointed due north.However, close observation has revealed
        that the POKéMON actually moves by a
        little over 3/8 of an inch every year.
    emerald:
      en: |-
        Its body emits a powerful magnetism.
        It feeds on prey that is pulled in by the
        force. Its magnetism is stronger in cold
        seasons.
    firered:
      en: |-
        Its magnetic nose consistently faces
        north. Travelers check NOSEPASS to get
        their bearings.
    leafgreen:
      en: |-
        Its magnetic nose consistently faces
        north. Travelers check NOSEPASS to get
        their bearings.
    diamond:
      en: |-
        Its nose is a magnet. As a result,
        this Pokémon always keeps its face
        pointing north.
    pearl:
      en: |-
        Its nose is a magnet. As a result,
        this Pokémon always keeps its face
        pointing north.
    platinum:
      en: |-
        When endangered, it may protect
        itself by raising its magnetism and
        drawing iron objects to its body.
    heartgold:
      en: |-
        If two of these meet, they cannot
        get too close because their noses
        repel each other.
    soulsilver:
      en: |-
        If two of these meet, they cannot
        get too close because their noses
        repel each other.
    black:
      en: |-
        When endangered, it may protect
        itself by raising its magnetism and
        drawing iron objects to its body.
      fr: |-
        Face au danger, il se protège en
        augmentant son magnétisme et en
        attirant tout objet métallique.
    white:
      en: |-
        When endangered, it may protect
        itself by raising its magnetism and
        drawing iron objects to its body.
      fr: |-
        Face au danger, il se protège en
        augmentant son magnétisme et en
        attirant tout objet métallique.
    black-2:
      en: |-
        Its magnetic nose always faces north
        and draws iron objects to its body
        to protect itself better.
    white-2:
      en: |-
        Its magnetic nose always faces north
        and draws iron objects to its body
        to protect itself better.
    x:
      ja-Hrkt: |-
        いつも　きたを　むいている
        じしゃくの　はなで　まわりの　てつを
        ひきよせて　まもりを　かためるのだ。
      ja: |-
        いつも　北を　向いている
        磁石の　鼻で　まわりの　鉄を
        引き寄せて　守りを　固めるのだ。
      ko: |-
        항상 북쪽을 향한다.
        자석의 코로 주변의 철을
        끌어당겨 방어를 굳힌다.
      en: |-
        Its magnetic nose always faces north and draws
        iron objects to its body to protect itself better.
      fr: |-
        Son nez polarisé lui permet de se défendre en
        augmentant son magnétisme et en attirant tout objet
        métallique.
      de: |-
        Es schützt sich mit Objekten aus Eisen, die es
        mithilfe seiner immer nach Norden zeigenden
        magnetischen Nase anzieht.
      es: |-
        Siempre apunta al norte con su nariz imantada. Con
        ella reviste su cuerpo de objetos metálicos para
        protegerse.
      it: |-
        Rafforza le sue difese attirando su di sé gli oggetti
        di ferro circostanti con il suo naso magnetico che
        indica sempre il nord.
    'y':
      ja-Hrkt: |-
        じしゃくの　はなは　いつも　きたを
        むいている。たびびとは　ノズパスを
        みて　ほうがくを　たしかめる。
      ja: |-
        磁石の　鼻は　いつも　北を
        向いている。旅人は　ノズパスを
        見て　方角を　確かめる。
      ko: |-
        자석 코는 항상 북쪽을
        향하고 있다. 여행자는 코코파스를
        보고 방향을 확인한다.
      en: |-
        Its magnetic nose consistently faces north.
        Travelers check Nosepass to get their bearings.
      fr: |-
        Son nez magnétique pointe constamment vers
        le nord. Les voyageurs l’observent pour connaître
        leur position.
      de: |-
        Seine magnetische Nase zeigt stets gen Norden.
        Reisende überprüfen Nasgnet, um sich zu orientieren.
      es: |-
        Siempre está con el pico magnético orientado hacia
        el norte. Quienes viajan toman a Nosepass como
        referencia.
      it: |-
        Ha un naso magnetico che punta sempre verso nord,
        e che i viaggiatori controllano per orientarsi.
    omega-ruby:
      ja-Hrkt: |-
        じしゃくの　はなは　いつも　きたを　むいている。
        ノズパスどうしは　じしゃくが　はんぱつしあうため
        ちかくで　かおを　あわせる　ことが　できない。
      ja: |-
        磁石の　鼻は　いつも　北を　向いている。
        ノズパス同士は　磁石が　反発しあうため
        近くで　顔を　合わせる　ことが　できない。
      ko: |-
        자석으로 된 코는 항상 북쪽을 향하고 있다.
        코코파스끼리는 자석의 반발력 때문에
        가까이에서 얼굴을 마주 볼 수가 없다.
      en: |-
        Nosepass’s magnetic nose is always pointed to the north.
        If two of these Pokémon meet, they cannot turn their faces to
        each other when they are close because their magnetic noses
        repel one another.
      fr: |-
        Le nez magnétique de Tarinor pointe toujours vers le nord.
        Si deux de ces Pokémon se rencontrent, ils ne peuvent pas
        se faire face car leurs nez magnétiques se repoussent.
      de: |-
        Nasgnet besitzt eine magnetische Nase, die immer nach
        Norden zeigt. Wenn sich zwei Nasgnet treffen, können sie
        sich einander nicht zuwenden, da ihre magnetischen Nasen
        sich gegenseitig abstoßen.
      es: |-
        Nosepass siempre está con la nariz magnética que tiene
        orientada hacia el norte. Si se encuentra con otro ejemplar
        de su especie, no puede mirarle de frente porque sus polos
        magnéticos se repelen.
      it: |-
        Il naso magnetico di Nosepass è sempre puntato verso nord.
        Quando incontra un suo simile, non riesce a guardarlo in volto
        da vicino perché i nasi magnetici si respingono l’un l’altro.
    alpha-sapphire:
      ja-Hrkt: |-
        じしゃくの　はなを　きたに　むけたまま　まったく
        うごかないと　いわれていたが　１ねんに　１センチ
        いどう　している　ことが　かんそくされた。
      ja: |-
        磁石の　鼻を　北に　向けたまま　まったく
        動かないと　いわれていたが　１年に　１センチ
        移動　している　ことが　観測された。
      ko: |-
        자석인 코를 북쪽으로 향한 채 전혀
        움직이지 않는다고 전해졌지만 1년에 1cm
        이동하는 것이 관측되었다.
      en: |-
        Nosepass had been said to be completely unmoving, with its
        magnetic nose pointed due north. However, close observation
        has revealed that the Pokémon actually moves by a little over
        3/8 of an inch every year.
      fr: |-
        On raconte que Tarinor reste complètement immobile,
        avec son nez magnétique orienté vers le nord. Cependant,
        des études minutieuses ont démontré que ce Pokémon
        se déplace de 1 cm par an.
      de: |-
        Nasgnet wurde zunächst als völlig unbeweglich beschrieben,
        da seine magnetische Nase immer nach Norden zeigt.
        Genauere Beobachtungen haben jedoch ergeben, dass es sich
        pro Jahr tatsächlich etwa um 1 cm bewegt.
      es: |-
        De Nosepass se llegó a decir que era totalmente estático;
        siempre con su nariz magnética orientada hacia el norte.
        Sin embargo, tras recientes estudios se ha visto que sí se
        mueve en realidad, apenas un centímetro al año.
      it: |-
        Pare che Nosepass sia completamente immobile, sempre
        col naso magnetico puntato verso nord. Tuttavia, studi più
        dettagliati hanno rivelato che questo Pokémon si sposta
        di 1 cm all’anno.
    sun:
      ja-Hrkt: |-
        ノズパスの　はなの　じしゃくは
        ぜったいに　くるわないので　たびする
        トレーナーの　よき　パートナーだ。
      ja: |-
        ノズパスの　鼻の　磁石は
        絶対　狂わないので　旅する
        トレーナーの　良き　パートナーだ。
      ko: |-
        코코파스의 코의 자석은
        절대로 고장 나지 않아서 여행하는
        트레이너의 좋은 파트너이다.
      zh-Hant: |-
        朝北鼻鼻子上的磁鐵絕對不會失靈，
        所以是訓練家旅行時的良伴。
      zh-Hans: |-
        朝北鼻鼻子上的磁铁绝对不会失灵，
        所以是训练家旅行时的良伴。
      en: |-
        The magnet in Nosepass’s nose provides an
        unerring compass, making it an excellent
        partner for Trainers going on a journey.
      fr: |-
        Le nez de Tarinor, qui fonctionne comme une
        boussole infaillible, en fait un allié de choix pour
        tout Dresseur Pokémon.
      de: |-
        Seine magnetische Nase ist unbeirrbar und
        erweist sich daher als ganz hervorragender
        Partner für Pokémon-Trainer auf Reisen.
      es: |-
        Los Nosepass tienen una nariz brújula infalible,
        por lo que los Entrenadores viajeros suelen
        llevar uno consigo.
      it: |-
        Il naso magnetico di Nosepass è una bussola
        infallibile e questo lo rende il compagno
        di viaggio ideale per ogni Allenatore.
    moon:
      ja-Hrkt: |-
        きょうりょくな　じりょくで　えものを
        ひきよせる。　てつを　ひきよせ
        みを　まもることも　ある。
      ja: |-
        強力な　磁力で　獲物を
        引き寄せる。　鉄を　引き寄せ
        身を　守ることも　ある。
      ko: |-
        강력한 자력으로 먹이를
        끌어당긴다. 철을 끌어당겨
        몸을 지킬 때도 있다.
      zh-Hant: |-
        用強勁的磁力把獵物吸過來。
        也會吸引並收集鐵來保護身軀。
      zh-Hans: |-
        用强劲的磁力把猎物吸过来。
        也会吸引并收集铁来保护身躯。
      en: |-
        It uses powerful magnetism to drag its prey
        toward it. It’s also been known to pull in metal,
        which it collects and uses to protect itself.
      fr: |-
        Sa puissance magnétique lui sert à attirer
        ses proies, mais également des objets
        métalliques qu’il utilise en guise de bouclier.
      de: |-
        Es nutzt sein starkes Magnetfeld, um Beute zu
        sich heranzuziehen. Ebenso zieht es Objekte
        aus Eisen an, um sich mit ihnen zu schützen.
      es: |-
        Atraen a sus presas usando su potente fuerza
        magnética. En algunos casos también atraen
        metales para proteger sus cuerpos.
      it: |-
        Il suo potente magnetismo gli permette di
        attirare le prede e anche oggetti di ferro, che
        usa per proteggersi.
    ultra-sun:
      ja-Hrkt: |-
        １ねんに　１センチしか　うごかないが
        ピンチに　おちいると　かいてんし
        いっしゅんで　ちちゅうに　もぐる。
      ja: |-
        １年に　１センチしか　動かないが
        ピンチに　陥ると　回転し
        一瞬で　地中に　潜る。
      ko: |-
        1년에 1cm밖에 움직이지 않지만
        위기에 처하면 회전하여
        순식간에 땅속으로 파고든다.
      zh-Hant: |-
        每年只會移動１公分，
        但在陷入危機時會轉動身體，
        在一瞬間潛入地底。
      zh-Hans: |-
        １年只会移动１厘米。
        但在陷入危机时会旋转身体，
        瞬间潜入地下。
      en: |-
        It moves less than an inch a year, but when
        it’s in a jam, it will spin and drill down into the
        ground in a split second.
      fr: |-
        Il ne se déplace que d’un centimètre par an,
        mais s’il se sent menacé, il virevolte et s’enfonce
        dans le sol en un instant.
      de: |-
        Es bewegt sich nur 1 cm pro Jahr, aber in
        Notlagen bohrt es sich mit seinem Körper
        blitzschnell in den Boden.
      es: |-
        Solo se desplaza un centímetro al año, pero, si
        se siente amenazado, gira sobre sí mismo y se
        hunde bajo tierra en un abrir y cerrar de ojos.
      it: |-
        Si sposta di 1 cm all’anno, ma quando si trova
        in difficoltà ruota su se stesso e in un attimo
        si nasconde sottoterra.
    ultra-moon:
      ja-Hrkt: |-
        きょうりょくな　じりょくで　えものを
        ひきよせ　うごかず　かりを　するが
        てんてきを　ひきよせることもある。
      ja: |-
        強力な　磁力で　獲物を
        引き寄せ　動かず　狩りを　するが
        天敵を　引き寄せることもある。
      ko: |-
        강력한 자력으로 먹이를 끌어당겨
        움직이지 않고 사냥을 하지만
        천적을 끌어당기는 일도 있다.
      zh-Hant: |-
        牠會動也不動地用強大的
        磁力把獵物吸過來獵捕，
        但有時也會把天敵吸來。
      zh-Hans: |-
        它会一动不动地用强力的
        磁力将猎物吸过来狩猎。
        但有时也会吸到天敌。
      en: |-
        It hunts without twitching a muscle by pulling in
        its prey with powerful magnetism. But
        sometimes it pulls natural enemies in close.
      fr: |-
        Grâce à sa force magnétique, il peut chasser
        ses proies sans se déplacer, mais il attire
        parfois ses pires ennemis.
      de: |-
        Es jagt bewegungslos, indem es Beute mit
        seinem starken Magnetfeld zu sich heranzieht.
        Manchmal sind jedoch auch Fressfeinde dabei.
      es: |-
        Su potente fuerza magnética le permite atraer a
        sus presas sin necesidad de moverse, aunque a
        veces también atrae a sus enemigos naturales.
      it: |-
        Il suo potente magnetismo gli permette di
        attirare le prede senza muoversi, ma a volte
        attrae anche i suoi nemici naturali.
