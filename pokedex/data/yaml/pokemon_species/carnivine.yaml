  flavor_text:
    diamond:
      en: |-
        It attracts prey with its sweet-
        smelling saliva, then chomps down.
        It takes a whole day to eat prey.
    pearl:
      en: |-
        Hanging from branches using its
        tentacles, it looks like a plant.
        It awaits prey, mouth wide open.
    platinum:
      en: |-
        It binds itself to trees in marshes.
        It attracts prey with its sweet-
        smelling drool and gulps them down.
    heartgold:
      en: |-
        It walks around on its tentacles in
        search of a tree branch where it
        can dangle down and ambush prey.
    soulsilver:
      en: |-
        It walks around on its tentacles in
        search of a tree branch where it
        can dangle down and ambush prey.
    black:
      en: |-
        It binds itself to trees in marshes.
        It attracts prey with its sweet-
        smelling drool and gulps them down.
      fr: |-
        Il s’accroche aux arbres des
        marais et attire ses proies avec
        sa salive à l’odeur enivrante.
    white:
      en: |-
        It binds itself to trees in marshes.
        It attracts prey with its sweet-
        smelling drool and gulps them down.
      fr: |-
        Il s’accroche aux arbres des
        marais et attire ses proies avec
        sa salive à l’odeur enivrante.
    black-2:
      en: |-
        Using its tentacles to lash itself to
        trees, it lies in wait for prey, luring it
        close with sweet-smelling drool.
    white-2:
      en: |-
        Using its tentacles to lash itself to
        trees, it lies in wait for prey, luring it
        close with sweet-smelling drool.
    x:
      ja-Hrkt: |-
        あまい　においの　だえきで　えものを
        おびきよせ　おおあごで　がぶり。
        １にち　かけて　えものを　たべる。
      ja: |-
        甘い　においの　だえきで　獲物を
        おびき寄せ　おおあごで　がぶり。
        １日　かけて　獲物を　食べる。
      ko: |-
        달콤한 냄새의 타액으로 먹이를
        끌어들여 큰 턱으로 꿀꺽한다.
        하루에 걸쳐 먹이를 먹는다.
      en: |-
        It attracts prey with its sweet-smelling saliva, then
        chomps down. It takes a whole day to eat prey.
      fr: |-
        Il attire sa proie avec sa salive odorante avant de
        la croquer. Il lui faut une journée pour l’avaler.
      de: |-
        Sein süßlich riechender Speichel zieht Beute an,
        die es frisst. Es braucht einen Tag, sie zu fressen.
      es: |-
        Atrae a sus presas con saliva de olor dulce y las
        mastica. Tarda todo un día en comérselas.
      it: |-
        Attira le prede con il dolce aroma della saliva e poi
        le ingoia. Impiega un giorno per mangiare una preda.
    'y':
      ja-Hrkt: |-
        しっちたいに　はえる　きにまきつき
        あまいかおりの　だえきで　えものを
        おびきよせては　ひとくちで　たべる。
      ja: |-
        湿地帯に　生える　木に巻きつき
        甘い香りの　だえきで　獲物を
        誘き寄せては　ひとくちで　食べる。
      ko: |-
        늪지대에서 자라는 나무에 엉겨 붙어
        달콤한 냄새의 타액으로 먹이를
        끌어들여 한입에 먹는다.
      en: |-
        It binds itself to trees in marshes. It attracts prey
        with its sweet-smelling drool and gulps them down.
      fr: |-
        Il s’accroche aux arbres des marais et attire ses proies
        avec sa salive à l’odeur enivrante.
      de: |-
        Klammert sich an Bäume in Sümpfen. Lockt Beute mit
        seinem süßlichen Speichel an und schluckt sie dann.
      es: |-
        Se cuelga de los árboles en los pantanos. Atrae a sus
        presas con su dulce olor y las engulle.
      it: |-
        Si attacca agli alberi nelle paludi. Attrae le prede
        con il dolce aroma della saliva e poi le ingoia.
