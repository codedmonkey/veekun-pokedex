camerupt:
  base_happiness: 70
  capture_rate: 150
  color: red
  egg_groups:
    - ground
  evolution_chain: numel
  evolves_from: numel
  flavor_text:
    ruby:
      en: |-
        CAMERUPT has a volcano inside its body.
        Magma of 18,000 degrees F courses
        through its body.Occasionally, the humps on this
        POKéMON’s back erupt, spewing the
        superheated magma.
    sapphire:
      en: |-
        The humps on CAMERUPT’s back are
        formed by a transformation of its
        bones. They sometimes blast out moltenmagma. This POKéMON apparently erupts
        often when it is enraged.
    emerald:
      en: |-
        A POKéMON that lives in the crater of
        a volcano. Every 10 years, the volcanoes
        on its back erupt violently. Research is
        under way on the cause of eruption.
    firered:
      en: |-
        If angered, the humps on its back erupt
        in a shower of molten lava. It lives in
        the craters of volcanoes.
    leafgreen:
      en: |-
        If angered, the humps on its back erupt
        in a shower of molten lava. It lives in
        the craters of volcanoes.
    diamond:
      en: |-
        It has volcanoes on its back. If
        magma builds up in its body, it
        shudders, then erupts violently.
    pearl:
      en: |-
        It has volcanoes on its back. If
        magma builds up in its body, it
        shudders, then erupts violently.
    platinum:
      en: |-
        It has volcanoes on its back. If
        magma builds up in its body, it
        shudders, then erupts violently.
    heartgold:
      en: |-
        It lives in the crater of a volcano.
        It is well known that the humps on
        its back erupt every 10 years.
    soulsilver:
      en: |-
        It lives in the crater of a volcano.
        It is well known that the humps on
        its back erupt every 10 years.
    black:
      en: |-
        It has volcanoes on its back. If
        magma builds up in its body, it
        shudders, then erupts violently.
      fr: |-
        Il porte des volcans sur son dos.
        Quand le magma remonte, il
        frissonne et entre en éruption.
    white:
      en: |-
        It has volcanoes on its back. If
        magma builds up in its body, it
        shudders, then erupts violently.
      fr: |-
        Il porte des volcans sur son dos.
        Quand le magma remonte, il
        frissonne et entre en éruption.
    black-2:
      en: |-
        The volcanoes on its back have a
        major eruption every 10 years--or
        whenever it becomes really angry.
    white-2:
      en: |-
        The volcanoes on its back have a
        major eruption every 10 years--or
        whenever it becomes really angry.
    x:
      ja-Hrkt: |-
        せなかの　コブの　かざんは
        １０ねんごとに　だいふんか　するが
        はげしく　おこっても　ふんかする。
      ja: |-
        背中の　コブの　火山は
        １０年ごとに　大噴火　するが
        激しく　怒っても　噴火する。
      ko: |-
        등의 혹 모양 화산은
        10년마다 대분화하나
        심하게 화가 나도 분화한다.
      en: |-
        The volcanoes on its back have a major eruption
        every 10 years--or whenever it becomes
        really angry.
      fr: |-
        Les volcans sur son dos entrent en éruption tous
        les dix ans ou chaque fois qu’il se met en colère.
      de: |-
        Seine Vulkanhöcker brechen nur alle zehn Jahre
        aus oder wenn es richtig wütend ist.
      es: |-
        Los volcanes de su joroba entran en erupción cada
        10 años o cuando Camerupt se enfada mucho.
      it: |-
        I vulcani sul suo dorso eruttano ogni dieci anni o
        quando è veramente arrabbiato.
    'y':
      ja-Hrkt: |-
        おこると　しゃくねつの　マグマを
        せなかの　コブから　ふきあげる。
        かざんの　かこうに　すみかが　ある。
      ja: |-
        怒ると　灼熱の　マグマを
        背中の　コブから　噴き上げる。
        火山の　火口に　住処が　ある。
      ko: |-
        화나면 작열하는 마그마를
        등의 혹에서 분출한다.
        화산의 분화구에 거처가 있다.
      en: |-
        If angered, the humps on its back erupt in a shower
        of molten lava. It lives in the craters of volcanoes.
      fr: |-
        S’il s’énerve, Camérupt fait jaillir de la lave en fusion
        par les bosses qui se trouvent sur son dos. Il vit dans
        les cratères des volcans.
      de: |-
        Wenn es wütend ist, regnet es aus den Höckern
        auf seinem Rücken flüssige Lava. Es lebt in den
        Kratern von Vulkanen.
      es: |-
        Cuando se enfada, las jorobas del lomo entran en
        erupción y expulsan lava. Habita los cráteres de los
        volcanes.
      it: |-
        Vive nei crateri dei vulcani. Se è adirato, erutta una
        pioggia di lava fusa dalle gobbe sul dorso.
    omega-ruby:
      ja-Hrkt: |-
        からだの　なかに　かざんを　もつ　ポケモンだ。
        からだに　たまった　せっし　１まんどの　マグマを
        ときどき　せなかの　コブから　ふきあげている。
      ja: |-
        体の　中に　火山を　持つ　ポケモンだ。
        体に　たまった　摂氏　１万度の　マグマを
        時々　背中の　コブから　噴き上げている。
      ko: |-
        몸 안에 화산을 지닌 포켓몬이다.
        몸에 모은 섭씨 1만 도의 마그마를
        가끔 등의 혹에서 뿜어 올리고 있다.
      en: |-
        Camerupt has a volcano inside its body. Magma of
        18,000 degrees Fahrenheit courses through its body.
        Occasionally, the humps on this Pokémon’s back erupt,
        spewing the superheated magma.
      fr: |-
        Le corps de Camérupt renferme un volcan. Du magma
        à 10 000 °C coule dans ses veines. De temps en temps,
        les bosses sur le dos de ce Pokémon entrent en éruption
        et crachent le magma surchauffé.
      de: |-
        Camerupt trägt einen Vulkan in seinem Körper. 10 000 °C
        heißes Magma fließt in ihm. Manchmal brechen die Höcker auf
        seinem Rücken aus und verspucken glühend heißes Magma.
      es: |-
        Camerupt encierra un volcán en su interior y magma de
        10 000 °C le recorre el cuerpo. A veces, las jorobas de la
        espalda entran en erupción y escupen el abrasivo magma.
      it: |-
        Camerupt ha un vulcano all’interno del proprio corpo.
        Nelle sue vene scorre magma liquido a 10.000 °C.
        Talvolta le gobbe che ha sulla schiena eruttano, espellendo
        magma rovente.
    alpha-sapphire:
      ja-Hrkt: |-
        せなかの　コブは　ほねが　かたちを　かえたもの。
        にえたぎった　マグマを　ときどき　ふきあげる。
        おこった　ときに　よく　ふんかする　らしい。
      ja: |-
        背中の　コブは　骨が　形を　変えたもの。
        煮えたぎった　マグマを　時々　噴き上げる。
        怒った　ときに　よく　噴火する　らしい。
      ko: |-
        등의 혹은 뼈가 변형된 것이다.
        펄펄 끓는 마그마를 가끔 뿜어 올린다.
        화났을 때 자주 분화하는 것 같다.
      en: |-
        The humps on Camerupt’s back are formed by a transformation
        of its bones. They sometimes blast out molten magma.
        This Pokémon apparently erupts often when it is enraged.
      fr: |-
        Les bosses sur le dos de Camérupt sont apparues après
        une déformation de ses os. Elles crachent parfois du magma
        en fusion. Ce Pokémon entre apparemment en éruption
        lorsqu’il est énervé.
      de: |-
        Die Höcker auf Camerupts Rücken sind durch eine
        Transformation seiner Knochen entstanden. Hin und
        wieder stoßen sie Magma aus. Dieses Pokémon bricht
        häufig aus, wenn es wütend ist.
      es: |-
        Las jorobas de Camerupt se originaron por una deformación
        de los huesos. A veces escupen magma líquido, sobre todo
        cuando el Pokémon se enfada.
      it: |-
        Le gobbe sulla schiena di Camerupt si sono formate dalla
        trasformazione delle sue ossa. Talvolta emettono magma fuso.
        Pare che questo Pokémon erutti spesso quando è infuriato.
