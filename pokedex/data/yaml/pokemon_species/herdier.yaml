herdier:
  base_happiness: 50
  capture_rate: 120
  color: gray
  egg_groups:
    - ground
  evolution_chain: lillipup
  evolves_from: lillipup
  flavor_text:
    black:
      en: |-
        It has black, cape-like fur that is
        very hard and decreases the amount
        of damage it receives.
      fr: |-
        Les poils qui entourent son corps
        comme un manteau sont extrêmement
        durs et amortissent les coups.
    white:
      en: |-
        It loyally follows its Trainer’s
        orders. For ages, they have helped
        Trainers raise Pokémon.
      fr: |-
        Il obéit fidèlement aux consignes.
        Il assiste les Dresseurs depuis
        très longtemps.
    black-2:
      en: |-
        This very loyal Pokémon
        helps Trainers, and it also
        takes care of other Pokémon.
    white-2:
      en: |-
        This very loyal Pokémon
        helps Trainers, and it also
        takes care of other Pokémon.
    x:
      ja-Hrkt: |-
        トレーナーを　たすけながら
        ほかの　ポケモンの　せわもする
        とても　ちゅうじつな　ポケモン。
      ja: |-
        トレーナーを　助けながら
        他の　ポケモンの　世話もする
        とても　忠実な　ポケモン。
      ko: |-
        트레이너를 도와주면서
        다른 포켓몬을 돌보기도 하는
        매우 충실한 포켓몬.
      en: |-
        This very loyal Pokémon helps Trainers, and it also
        takes care of other Pokémon.
      fr: |-
        Un Pokémon très loyal qui aide aussi bien les
        Dresseurs que les autres Pokémon qu’il rencontre.
      de: |-
        Dieses äußerst treue Pokémon geht nicht nur
        seinem Trainer zur Hand, sondern hilft auch
        anderen Pokémon.
      es: |-
        Este Pokémon es muy leal. No solo ayuda a
        Entrenadores, sino que también se preocupa por
        otros Pokémon.
      it: |-
        È un Pokémon molto leale, che aiuta il suo Allenatore
        e al contempo si prende cura degli altri Pokémon
        della squadra.
    'y':
      ja-Hrkt: |-
        マントのように　からだを　おおう
        くろい　たいもうは　とても　かたい。
        うけた　ダメージを　へらしてくれる。
      ja: |-
        マントのように　体を　覆う
        黒い　体毛は　とても　硬い。
        受けた　ダメージを　減らしてくれる。
      ko: |-
        매우 단단한 검은 털이
        망토처럼 몸을 둘러싸고 있다.
        입은 데미지를 줄여준다.
      en: |-
        It has black, cape-like fur that is very hard and
        decreases the amount of damage it receives.
      fr: |-
        Les poils qui entourent son corps comme un manteau
        sont extrêmement durs et amortissent les coups.
      de: |-
        Das dunkle Fell, das es wie ein Mantel umgibt,
        ist äußerst widerstandsfähig und mindert
        den Schaden durch Attacken.
      es: |-
        Un robusto pelaje cubre su cuerpo a modo de capa
        y disminuye el daño que recibe en los ataques.
      it: |-
        La pelliccia nera che lo ricopre come un manto è
        estremamente dura e ammortizza i colpi che gli
        vengono inferti.
    omega-ruby:
      ja-Hrkt: |-
        トレーナーを　たすけながら
        ほかの　ポケモンの　せわもする
        とても　ちゅうじつな　ポケモン。
      ja: |-
        トレーナーを　助けながら
        他の　ポケモンの　世話もする
        とても　忠実な　ポケモン。
      ko: |-
        트레이너를 도와주면서
        다른 포켓몬을 돌보기도 하는
        매우 충실한 포켓몬.
      en: |-
        This very loyal Pokémon helps Trainers, and it also
        takes care of other Pokémon.
      fr: |-
        Un Pokémon très loyal qui aide aussi bien les Dresseurs
        que les autres Pokémon qu’il rencontre.
      de: |-
        Dieses äußerst treue Pokémon geht nicht nur seinem Trainer
        zur Hand, sondern hilft auch anderen Pokémon.
      es: |-
        Este Pokémon es muy leal. No solo ayuda a Entrenadores,
        sino que también se preocupa por otros Pokémon.
      it: |-
        È un Pokémon molto leale, che aiuta il suo Allenatore e al
        contempo si prende cura degli altri Pokémon della squadra.
    alpha-sapphire:
      ja-Hrkt: |-
        マントのように　からだを　おおう
        くろい　たいもうは　とても　かたい。
        うけた　ダメージを　へらしてくれる。
      ja: |-
        マントのように　体を　覆う
        黒い　体毛は　とても　硬い。
        受けた　ダメージを　減らしてくれる。
      ko: |-
        매우 단단한 검은 털이
        망토처럼 몸을 둘러싸고 있다.
        입은 데미지를 줄여준다.
      en: |-
        It has black, cape-like fur that is very hard and
        decreases the amount of damage it receives.
      fr: |-
        Les poils qui entourent son corps comme un manteau sont
        extrêmement durs et amortissent les coups.
      de: |-
        Das dunkle Fell, das es wie ein Mantel umgibt, ist äußerst
        widerstandsfähig und mindert den Schaden durch Attacken.
      es: |-
        Un robusto pelaje cubre su cuerpo a modo de capa y
        disminuye el daño que recibe en los ataques.
      it: |-
        La pelliccia nera che lo ricopre come un manto è estremamente
        dura e ammortizza i colpi che gli vengono inferti.
    sun:
      ja-Hrkt: |-
        くろい　たいもうは　とても　かたくて
        どんどん　のびる。　トリミングだいが
        かかって　たいへんな　ポケモン。
      ja: |-
        黒い　体毛は　とても　硬くて
        どんどん　伸びる。　トリミング代が
        かかって　大変な　ポケモン。
      ko: |-
        검은 털은 매우 단단하며
        빠르게 자란다. 손질 비용이
        들어서 큰일인 포켓몬.
      zh-Hant: |-
        黑色的體毛非常堅硬，且會
        不斷長出，需要花錢修剪，
        是很費事的寶可夢。
      zh-Hans: |-
        黑色的体毛非常坚硬，
        会不断长出。是要花修剪费，
        很费事的宝可梦。
      en: |-
        Its dense black fur grows continuously. The high
        cost of keeping its hard fur properly groomed
        makes this a troublesome Pokémon to train.
      fr: |-
        Son poil long et très dur, pousse à une vitesse
        ahurissante, et son toilettage coûte un bras.
        Une plaie à élever.
      de: |-
        Sein dunkles Fell ist sehr widerstandsfähig und
        wächst schnell. Dadurch sind die Kosten für
        das Trimmen sehr hoch.
      es: |-
        El recio y oscuro pelaje que le cubre el lomo
        crece tan rápido que mantenerlo corto resulta
        de lo más caro.
      it: |-
        La folta pelliccia scura di questo Pokémon
        è estremamente resistente, quindi i prezzi della
        toelettatura sono sempre piuttosto alti.
    moon:
      ja-Hrkt: |-
        あるじの　めいれいに　ちゅうじつ。
        だが　したに　みている　あいての
        いうことは　ぜったいに　きかない。
      ja: |-
        主の　命令に　忠実。
        だが　下に　みている　相手の
        いうことは　絶対に　聞かない。
      ko: |-
        주인의 명령에 충실하다.
        그러나 아래라고 보는 상대가
        하는 말은 절대로 듣지 않는다.
      zh-Hant: |-
        會忠實地聽從主人的命令。
        但絕對不聽自己看不起的人
        所說的話。
      zh-Hans: |-
        对主人的命令绝对服从。
        但绝对不会听看起来
        地位不如它的对手所说的话。
      en: |-
        This Pokémon obeys its master’s orders
        faithfully. However, it refuses to listen to
        anything said by a person it doesn’t respect.
      fr: |-
        Il est entièrement dévoué aux ordres de
        son maître. En revanche, il n’obéira jamais à
        quelqu’un qu’il considère comme inférieur à lui.
      de: |-
        Es folgt geflissentlich den Befehlen seines
        Trainers. Auf jemanden, den es als unterlegen
        betrachtet, hört es jedoch nicht.
      es: |-
        Obedece sin rechistar las órdenes de su dueño.
        Ahora bien, ignora sin pudor a todo aquel que
        considere inferior.
      it: |-
        Se l’Allenatore si guadagna il suo rispetto,
        segue fedelmente le istruzioni, altrimenti
        non lo ascolta affatto.
    ultra-sun:
      ja-Hrkt: |-
        くろい　たいもうは　そだつほど
        かたく　じょうぶに　なって　ツメや
        キバも　かんたんには　とおさないぞ。
      ja: |-
        黒い　体毛は　育つほど
        硬く　丈夫に　なって　ツメや
        キバも　簡単には　通さないぞ。
      ko: |-
        검은 털은 자랄수록
        딱딱하고 튼튼해져 발톱이나
        이빨로도 쉽게 뚫을 수 없다.
      zh-Hant: |-
        黑色的體毛會隨著成長
        變得越來越堅硬結實，
        連爪子和牙齒也無法輕易穿透。
      zh-Hans: |-
        黑色的体毛会随着成长
        而变得坚硬结实，
        连爪子和牙齿也不能轻易穿透。
      en: |-
        The longer its black fur grows, the harder and
        more impervious it gets. Claws and fangs can’t
        easily penetrate it.
      fr: |-
        Son pelage sombre devient si robuste au fil
        du temps que même des crocs ou des griffes
        peinent à passer au travers.
      de: |-
        Mit zunehmendem Alter wird sein dunkles Fell
        immer widerstandsfähiger, sodass selbst Klauen
        und Fangzähne es kaum durchdringen können.
      es: |-
        Con el paso del tiempo, su oscuro pelaje se
        vuelve duro y resistente, lo que le sirve como
        ligera protección contra colmillos y cuernos.
      it: |-
        La pelliccia scura diventa più dura e resistente
        con la crescita e lo difende dagli artigli e dalle
        zanne dei nemici.
    ultra-moon:
      ja-Hrkt: |-
        おおむかしの　へきがに　すがたが
        えがかれているほど　ながい　あいだ
        ひとと　くらしを　ともに　してきた。
      ja: |-
        大昔の　壁画に　姿が
        描かれているほど　長い　間
        人と　暮らしを　ともに　してきた。
      ko: |-
        먼 옛날의 벽화에 모습이
        그려져 있을 정도로 오랫동안
        인간과 생활을 함께해 왔다.
      zh-Hant: |-
        長久以來一直與人類共同生活。
        就連遠古時代的壁畫上
        都留有牠的身影。
      zh-Hans: |-
        与人类共同生活了很长时间，
        久远到连古代的壁画上都
        描绘着它的样子。
      en: |-
        It has been living with people for so long that
        portrayals of it can be found on the walls of
        caves from long, long ago.
      fr: |-
        Cela fait si longtemps que ce Pokémon vit
        en harmonie avec les humains qu’il apparaît
        même sur des peintures rupestres antiques.
      de: |-
        Uralte Wandmalereien sprechen dafür, dass
        Terribark schon seit langer Zeit an der Seite der
        Menschen lebt.
      es: |-
        Ha convivido mucho tiempo con los humanos,
        como atestiguan las pinturas rupestres donde
        aparece representado.
      it: |-
        Vive al fianco degli esseri umani da tempo
        immemorabile, tanto che lo si trova raffigurato
        persino in antichissime pitture murali.
    sword:
      ja-Hrkt: |-
        とても　かしこく　よく　なつく。
        はじめて　ひとのパートナーに　なった
        ポケモンと　いう　せつも　あるのだ。
      ja: |-
        とても　賢く　よく　懐く。
        はじめて　人のパートナーに　なった
        ポケモンと　いう　説も　あるのだ。
      ko: |-
        매우 영리하고 금방 친해진다.
        인간의 파트너가 된
        첫 포켓몬이라는 설도 있다.
      zh-Hant: |-
        非常聰明，容易與人親近。
        甚至有人說，牠是最先
        成為人類同伴的寶可夢。
      zh-Hans: |-
        十分聪明，容易亲近。
        也有人认为它是第一种
        成为人类同伴的宝可梦。
      en: |-
        Herdier is a very smart and friendly Pokémon.
        So much so that there’s a theory that Herdier was
        the first Pokémon to partner with people.
      fr: |-
        Ce Pokémon est très intelligent et affectueux.
        Une théorie avance qu’il aurait été le premier
        à devenir le partenaire d’un être humain.
      de: |-
        Es ist sehr intelligent und zutraulich. Einer Theorie
        zufolge soll Terribark das erste Pokémon gewesen
        sein, das an der Seite von Menschen gelebt hat.
      es: |-
        Es muy inteligente y cariñoso. Existen ciertas
        teorías que lo consideran el primer Pokémon
        que se convirtió en compañero de los humanos.
      it: |-
        È molto intelligente e si affeziona con facilità.
        Secondo alcune teorie sarebbe stato il primo
        Pokémon a diventare il compagno degli umani.
    shield:
      ja-Hrkt: |-
        からだを　おおう　くろい　けは
        ぶあつく　だんりょくが　ある。
        するどい　キバも　はじきかえすぞ。
      ja: |-
        体を　覆う　黒い　毛は
        ぶ厚く　弾力が　ある。
        するどい　キバも　弾き返すぞ。
      ko: |-
        몸을 뒤덮은 검은 털은
        두껍고 탄력이 있다.
        날카로운 이빨도 튕겨낸다.
      zh-Hant: |-
        覆蓋身體的黑色體毛
        既厚實又有彈性，就連
        銳利的獠牙也會被反彈。
      zh-Hans: |-
        覆盖在身上的黑色体毛
        既厚又有弹性，甚至能
        把尖锐的牙齿也反弹回去。
      en: |-
        The black fur that covers this Pokémon’s body
        is dense and springy. Even sharp fangs bounce
        right off.
      fr: |-
        Les poils sombres qui recouvrent son dos sont
        si épais et si souples qu’ils peuvent même
        repousser des crocs acérés.
      de: |-
        Das dunkle Fell, das seinen Körper bedeckt,
        ist sehr dicht und federnd. Selbst Angriffe mit
        scharfen Fangzähnen prallen davon ab.
      es: |-
        El pelaje negro que lo recubre es tan denso y
        elástico que puede repeler incluso los colmillos
        más afilados.
      it: |-
        La pelliccia scura che ricopre il suo corpo è
        spessa ed elastica, al punto da respingere
        anche delle zanne affilate.
