    x:
      ja-Hrkt: |-
        さむくなると　あちこちから
        レディバが　たくさん　あつまって
        よりそいあい　あたためあう。
      ja: |-
        寒くなると　あちこちから
        レディバが　たくさん　集まって
        寄り添いあい　温め合う。
      ko: |-
        추워지면 여기저기로부터
        레디바가 많이 모여들어
        바싹 붙어 서로 따뜻하게 해준다.
      en: |-
        When the weather turns cold, lots of Ledyba gather
        from everywhere to cluster and keep each
        other warm.
      fr: |-
        Quand le temps se rafraîchit, de nombreux Coxy se
        réunissent pour conserver un maximum de chaleur.
      de: |-
        Wird es kalt, versammeln sich viele Ledyba von
        nah und fern, um sich gegenseitig Wärme zu schenken.
      es: |-
        Cuando llega el frío, se reúnen muchos Ledyba de
        todas partes para darse calor.
      it: |-
        Quando inizia a far freddo, i Ledyba si riuniscono
        da ogni luogo per scaldarsi tra loro.
    'y':
      ja-Hrkt: |-
        おくびょうで　すぐに　むれをつくる。
        あしから　でる　えきたいの　においで
        じぶんの　いばしょを　しらせる。
      ja: |-
        臆病で　すぐに　群れを作る。
        脚から　出る　液体の　においで
        自分の　居場所を　知らせる。
      ko: |-
        겁쟁이여서 금방 무리를 만든다.
        다리에서 나오는 액체의 냄새로
        자신이 있는 곳을 알린다.
      en: |-
        It is timid and clusters together with others.
        The fluid secreted by its feet indicates its location.
      fr: |-
        Il est timide et reste près de ses semblables. Il a
        un sens du toucher très développé.
      de: |-
        Es ist scheu und stets mit Artgenossen zusammen.
        Das Sekret an seinen Füßen führt zu seinem Standort.
      es: |-
        Es muy tímido y se refugia con los de su especie.
        Al caminar, deja una estela que indica dónde está.
      it: |-
        Timidi, stanno sempre uniti. La traccia del liquido
        che esce dalle zampe mostra dove si trovano.
    omega-ruby:
      ja-Hrkt: |-
        あしの　つけねから　だす　えきたいの　においで
        なかまと　コミュニケーションを　とっている。
        においの　ちがいで　きもちを　つたえるという。
      ja: |-
        足の　付け根から　出す　液体の　臭いで
        仲間と　コミュニケーションを　取っている。
        臭いの　違いで　気持ちを　伝えるという。
      ko: |-
        몸통과 다리의 연결 부위에서 나는 액체의 냄새로
        동료와 커뮤니케이션을 취하고 있다.
        냄새의 차이로 기분을 전한다고 한다.
      en: |-
        Ledyba secretes an aromatic fluid from where its legs join its
        body. This fluid is used for communicating with others.
        This Pokémon conveys its feelings to others by altering the
        fluid’s scent.
      fr: |-
        Coxy sécrète un fluide aromatisé sortant des articulations
        de ses pattes. Ce fluide lui permet de communiquer avec
        ses congénères. Ce Pokémon exprime ses sentiments
        en modifiant l’odeur de ce fluide.
      de: |-
        Ledyba sondert eine duftende Flüssigkeit ab. Über diese
        kommuniziert es mit anderen. Dieses Pokémon übermittelt
        seine Gefühle, indem es die Duftnote des Sekrets verändert.
      es: |-
        Ledyba segrega un fluido aromático por los seis puntos de
        unión que tiene entre las patas y el cuerpo. A través de este
        fluido se comunica con otros y les informa acerca de sus
        sentimientos variando la esencia.
      it: |-
        Dalla giuntura delle zampe col corpo Ledyba secerne
        un fluido aromatico usato per comunicare con i suoi simili.
        Questo Pokémon comunica le sue sensazioni alterando
        l’odore del fluido.
    alpha-sapphire:
      ja-Hrkt: |-
        あしの　つけねから　だす　えきたいの　においで
        なかまと　コミュニケーションを　とっている。
        においの　ちがいで　きもちを　つたえるという。
      ja: |-
        足の　付け根から　出す　液体の　臭いで
        仲間と　コミュニケーションを　取っている。
        臭いの　違いで　気持ちを　伝えるという。
      ko: |-
        몸통과 다리의 연결 부위에서 나는 액체의 냄새로
        동료와 커뮤니케이션을 취하고 있다.
        냄새의 차이로 기분을 전한다고 한다.
      en: |-
        Ledyba secretes an aromatic fluid from where its legs join its
        body. This fluid is used for communicating with others.
        This Pokémon conveys its feelings to others by altering the
        fluid’s scent.
      fr: |-
        Coxy sécrète un fluide aromatisé sortant des articulations
        de ses pattes. Ce fluide lui permet de communiquer avec
        ses congénères. Ce Pokémon exprime ses sentiments
        en modifiant l’odeur de ce fluide.
      de: |-
        Ledyba sondert eine duftende Flüssigkeit ab. Über diese
        kommuniziert es mit anderen. Dieses Pokémon übermittelt
        seine Gefühle, indem es die Duftnote des Sekrets verändert.
      es: |-
        Ledyba segrega un fluido aromático por los seis puntos de
        unión que tiene entre las patas y el cuerpo. A través de este
        fluido se comunica con otros y les informa acerca de sus
        sentimientos variando la esencia.
      it: |-
        Dalla giuntura delle zampe col corpo Ledyba secerne
        un fluido aromatico usato per comunicare con i suoi simili.
        Questo Pokémon comunica le sue sensazioni alterando
        l’odore del fluido.
    sun:
      ja-Hrkt: |-
        おくびょうで　つねに　むれていないと
        ふあん。　せなかのもようは　１ぴき
        １ぴき　びみょうに　ちがう　かたち。
      ja: |-
        臆病で　常に　群れていないと
        不安。　背中の模様は　１匹
        １匹　微妙に　違う　形。
      ko: |-
        겁이 많아 항상 무리 지어 있지
        않으면 불안하다. 등의 무늬는
        모두 미묘하게 다르게 생겼다
      zh-Hant: |-
        天性膽小，總是成群結隊，
        不然就會感到不安。背上的花紋
        每隻都有細微的不同。
      zh-Hans: |-
        因为胆小，不总是聚在一起
        就会感到不安。背后的花纹
        每只都会有细微的不同。
      en: |-
        They are timid and grow uneasy when not in a
        swarm with others of their kind. The pattern on
        their backs differs slightly from one to another.
      fr: |-
        Il est si timide qu’il est inquiet s’il n’est pas
        en groupe. Les motifs sur son dos diffèrent
        légèrement d’un individu à l’autre.
      de: |-
        Es ist scheu und fürchtet sich, wenn es nicht
        Teil des Schwarms ist. Das Muster auf seinem
        Rücken ist bei jedem Exemplar minimal anders.
      es: |-
        Es muy tímido y se siente inseguro si no está
        junto a los de su especie. El estampado de sus
        alas varía de un Ledyba a otro.
      it: |-
        È molto timido e senza il suo gruppo si sente
        perso. Il motivo sul dorso è leggermente diverso
        in ciascun esemplare.
    moon:
      ja-Hrkt: |-
        においのする　たいえきで　なかまと
        コミュニケーションする。　おこった
        ときの　においは　すっぱいぞ。
      ja: |-
        臭いのする　体液で　仲間と
        コミュニケーションする。　怒った
        ときの　臭いは　すっぱいぞ。
      ko: |-
        냄새나는 체액으로 동료와
        커뮤니케이션을 한다. 화가
        났을 때의 냄새는 시큼하다.
      zh-Hant: |-
        用帶氣味的體液與夥伴交流。
        發怒的時候，氣味會酸酸的。
      zh-Hans: |-
        用带气味的体液与伙伴交流。
        发怒的时候，气味会酸酸的。
      en: |-
        They communicate with one another using bodily
        fluids that give off odors. When they’re angry,
        their odor smells sour.
      fr: |-
        Il communique avec ses congénères grâce à un
        fluide odorant. Quand il est en colère, l’odeur
        en devient vraiment aigre.
      de: |-
        Es nutzt eine duftende Flüssigkeit, um mit seinen
        Artgenossen zu kommunizieren. Ist es wütend,
        nimmt diese einen stechenden Geruch an.
      es: |-
        Ledyba segrega un fluido aromático con el que
        se comunica con los de su especie. El olor que
        desprende cuando está enfadado es agrio.
      it: |-
        Secerne un fluido aromatico per comunicare con
        i suoi simili. Quando è arrabbiato, l’odore si fa
        pungente.
    ultra-sun:
      ja-Hrkt: |-
        さむさに　とても　よわい　ポケモン。
        おんだんな　アローラでは　とても
        いきいきした　すがたが　みられる。
      ja: |-
        寒さに　とても　弱い　ポケモン。
        温暖な　アローラでは　とても
        生き生きした　姿が　見られる。
      ko: |-
        추위에 매우 약한 포켓몬.
        온난한 알로라에서는 매우
        생기가 넘치는 모습을 볼 수 있다.
      zh-Hant: |-
        非常怕冷的寶可夢。
        在溫暖的阿羅拉可以看見
        牠生氣勃勃的樣子。
      zh-Hans: |-
        非常怕冷的宝可梦。
        在温暖的阿罗拉，
        可以看到它生气勃勃的样子。
      en: |-
        This Pokémon is very sensitive to cold. In the
        warmth of Alola, it appears quite lively.
      fr: |-
        Ce Pokémon très sensible au froid semble
        revivre lorsqu’il se trouve dans des régions
        chaudes comme Alola.
      de: |-
        Dieses Pokémon reagiert sehr empfindlich auf
        Kälte. Im warmen Klima Alolas strotzt es nur so
        vor Lebensfreude.
      es: |-
        Este Pokémon no soporta el frío. En Alola, sin
        embargo, se encuentra en su elemento y se lo
        puede ver revoloteando vivaracho por doquier.
      it: |-
        Nel clima temperato di Alola, questo Pokémon
        estremamente sensibile al freddo è arzillo
        e pieno di vita.
    ultra-moon:
      ja-Hrkt: |-
        とっても　おくびょうな　ポケモン。
        なかまと　いっしょに　リフレクターを
        はって　すを　まもって　いるのだ。
      ja: |-
        とっても　臆病な　ポケモン。
        仲間と　一緒に　リフレクターを
        張って　巣を　守って　いるのだ。
      ko: |-
        매우 겁이 많은 포켓몬이다.
        동료와 함께 리플렉터를 펼쳐서
        보금자리를 지키고 있다.
      zh-Hant: |-
        非常膽小的寶可夢。
        會和夥伴一起張開反射壁，
        藉此保護巢穴。
      zh-Hans: |-
        非常胆小的宝可梦。
        会和伙伴一起张开反射壁来保护巢穴。
      en: |-
        These very cowardly Pokémon join together and
        use Reflect to protect their nest.
      fr: |-
        Extrêmement timide, ce Pokémon défend le nid
        qu’il partage avec ses congénères en utilisant
        Protection.
      de: |-
        Es ist ein sehr scheues Pokémon. Gemeinsam
        mit seinen Artgenossen nutzt es Reflektor, um
        sein Nest zu beschützen.
      es: |-
        Un Pokémon bastante temeroso. Junto con sus
        congéneres, protege su nido usando Reflejo.
      it: |-
        È un Pokémon incredibilmente timido. Protegge
        il nido usando Riflesso assieme ai suoi simili.
