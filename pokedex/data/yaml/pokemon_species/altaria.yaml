altaria:
  base_happiness: 50
  capture_rate: 45
  color: blue
  egg_groups:
    - flying
    - dragon
  evolution_chain: swablu
  evolves_from: swablu
  flavor_text:
    ruby:
      en: |-
        ALTARIA dances and wheels through the
        sky among billowing, cotton-like clouds.
        By singing melodies in its crystal-clearvoice, this POKéMON makes its listeners
        experience dreamy wonderment.
    sapphire:
      en: |-
        ALTARIA sings in a gorgeous soprano.
        Its wings are like cotton clouds.
        This POKéMON catches updrafts with itsbuoyant wings and soars way up into
        the wild blue yonder.
    emerald:
      en: |-
        It hums in a beautiful soprano voice.
        It flies among white clouds in the blue
        sky. It launches intensely hot fireballs
        from its mouth.
    firered:
      en: |-
        If you hear a beautiful melody trilling
        deep among mountains far from people,
        it is ALTARIA’s humming.
    leafgreen:
      en: |-
        If you hear a beautiful melody trilling
        deep among mountains far from people,
        it is ALTARIA’s humming.
    diamond:
      en: |-
        It looks like a fluffy cloud when
        it is in flight. It hums with its
        soprano voice.
    pearl:
      en: |-
        It looks like a fluffy cloud when
        it is in flight. It hums with its
        soprano voice.
    platinum:
      en: |-
        If it bonds with a person, it will
        gently envelop the friend with its
        soft wings, then hum.
    heartgold:
      en: |-
        It flies gracefully through the
        sky. Its melodic humming makes
        you feel like you’re in a dream.
    soulsilver:
      en: |-
        It flies gracefully through the
        sky. Its melodic humming makes
        you feel like you’re in a dream.
    black:
      en: |-
        If it bonds with a person, it will
        gently envelop the friend with its
        soft wings, then hum.
      fr: |-
        Il aime enlacer ses amis dans ses
        ailes cotonneuses et ronronner.
    white:
      en: |-
        If it bonds with a person, it will
        gently envelop the friend with its
        soft wings, then hum.
      fr: |-
        Il aime enlacer ses amis dans ses
        ailes cotonneuses et ronronner.
    black-2:
      en: |-
        On sunny days, it flies freely through
        the sky and blends into the clouds.
        It sings in a beautiful soprano.
    white-2:
      en: |-
        On sunny days, it flies freely through
        the sky and blends into the clouds.
        It sings in a beautiful soprano.
    x:
      ja-Hrkt: |-
        おおぞらを　ゆったりと　とぶ。
        チルタリスの　うつくしい　ハミングを
        きくと　うっとり　ゆめごこちだ。
      ja: |-
        大空を　ゆったりと　飛ぶ。
        チルタリスの　美しい　ハミングを
        聴くと　うっとり　夢心地だ。
      ko: |-
        넓은 하늘을 느긋하게 난다.
        파비코리의 아름다운 콧노래를
        들으면 황홀한 꿈을 꾸는 기분이다.
      en: |-
        It flies gracefully through the sky. Its melodic
        humming makes you feel like you’re in a dream.
      fr: |-
        Il vole doucement dans le ciel. Ceux qui l’entendent
        fredonner sont comme plongés dans un rêve.
      de: |-
        Es schwebt gemächlich durch den Himmel.
        Sein wunderschönes Summen gibt einem
        das Gefühl zu träumen.
      es: |-
        Vuela pausadamente por el cielo azul. Su hermoso
        trino cautiva a todo aquel que lo escucha.
      it: |-
        Volteggia elegante nel cielo. Canticchia soavemente,
        mandando in onirica estasi chi lo ascolta.
    'y':
      ja-Hrkt: |-
        はれたひ　わたぐもに　まぎれながら
        おおぞらを　じゆうに　とびまわり
        うつくしい　ソプラノで　うたう。
      ja: |-
        晴れた日　綿雲に　まぎれながら
        大空を　自由に　飛び回り
        美しい　ソプラノで　歌う。
      ko: |-
        맑은 날 뭉게구름에 뒤섞이면서
        넓은 하늘을 자유롭게 날아다니며
        아름다운 소프라노로 노래한다.
      en: |-
        On sunny days, it flies freely through the sky and
        blends into the clouds. It sings in a
        beautiful soprano.
      fr: |-
        Il vole librement en se cachant dans les nuages.
        Son chant est digne de celui de la plus douée des
        sopranos.
      de: |-
        Bei gutem Wetter mischt es sich unter die Wolken
        und genießt die Freiheit. Es hat eine entzückende
        Sopranstimme.
      es: |-
        En días soleados, le gusta mezclarse con las nubes
        y disfrutar de la libertad del cielo mientras trina con
        voz de soprano.
      it: |-
        Nelle belle giornate, ama confondersi con le poche
        nuvole in cielo e cantare con una bellissima voce di
        soprano.
    omega-ruby:
      ja-Hrkt: |-
        わたぐもに　まぎれて　おおぞらを　まう。
        すきとおった　こえで　メロディを　さえずれば
        みみにした　ものは　うっとり　ゆめごこち。
      ja: |-
        綿雲に　紛れて　大空を　舞う。
        透き通った　声で　メロディを　さえずれば
        耳にした　ものは　うっとり　夢心地。
      ko: |-
        뭉게구름에 뒤섞여 넓은 하늘을 떠돈다.
        맑은 목소리로 멜로디를 지저귀면
        그 소리를 들은 자들은 꿈꾸는 듯한 기분이 된다.
      en: |-
        Altaria dances and wheels through the sky among billowing,
        cotton-like clouds. By singing melodies in its crystal-clear
        voice, this Pokémon makes its listeners experience dreamy
        wonderment.
      fr: |-
        Altaria danse et tournoie dans les cieux, au milieu
        des nuages gonflés et cotonneux. Ce Pokémon chante
        des mélodies de sa voix cristalline pour offrir aux auditeurs
        une expérience merveilleuse et inoubliable.
      de: |-
        Altaria tanzt und dreht sich in der Luft durch viele
        Schäfchenwolken. Indem es mit seiner kristallklaren
        Stimme Melodien singt, versetzt es seine Zuhörer in
        verträumtes Erstaunen.
      es: |-
        Altaria baila y revolotea por el cielo entre ondeantes nubes
        que parecen de algodón. Al entonar melodías con su voz
        cristalina, este Pokémon deja a sus oyentes embobados y
        admirados.
      it: |-
        Altaria danza e volteggia nel cielo tra le nubi soffici come
        batuffoli di cotone. Cantando con la sua voce cristallina,
        riesce a mandare in onirica estasi chi lo ascolta.
    alpha-sapphire:
      ja-Hrkt: |-
        うつくしい　ソプラノで　うたう　ポケモン。
        わたぐもの　ような　つばさで　じょうしょう
        きりゅうを　うけて　おおぞらへ　まいあがる。
      ja: |-
        美しい　ソプラノで　歌う　ポケモン。
        綿雲の　ような　翼で　上昇
        気流を　受けて　大空へ　舞い上がる。
      ko: |-
        아름다운 소프라노 음색으로 노래하는 포켓몬이다.
        솜구름 같은 날개로 상승기류를
        타고 넓은 하늘로 날아오른다.
      en: |-
        Altaria sings in a gorgeous soprano. Its wings are like cotton
        clouds. This Pokémon catches updrafts with its buoyant wings
        and soars way up into the wild blue yonder.
      fr: |-
        Altaria chante avec une magnifique voix de soprano. Ses ailes
        ressemblent à des nuages cotonneux. Ce Pokémon se laisse
        porter par les courants d’air ascendants et disparaît dans
        le bleu du ciel.
      de: |-
        Altaria hat eine tolle Sopran-Stimme. Seine Flügel sehen aus
        wie Schäfchenwolken. Dieses Pokémon stürzt sich in einen
        Aufwind und steigt in den Himmel empor.
      es: |-
        Altaria canta de maravilla, como una soprano. Tiene unas alas
        que parecen nubes de algodón. Este Pokémon aprovecha las
        corrientes ascendentes y remonta el vuelo con sus flamantes
        alas hacia la inmensidad del cielo azul.
      it: |-
        Altaria canta con una sublime voce di soprano. Le sue ali
        spumeggianti, che sembrano nubi di cotone, gli consentono
        di sfruttare le correnti ascensionali e di risalire verso l’infinito
        cielo blu.
    sword:
      ja-Hrkt: |-
        おおぞらを　ゆったりと　とびながら
        みみにした　ものを　うっとりさせる
        うつくしい　ハミングを　かなでる。
      ja: |-
        大空を　ゆったりと　飛びながら
        耳にした　者を　うっとりさせる
        美しい　ハミングを　奏でる。
      ko: |-
        넓은 하늘을 유유히 날면서
        듣는 이를 사로잡는
        아름다운 콧노래를 부른다.
      zh-Hant: |-
        會一邊在天空中悠然飛翔，
        一邊哼唱出令人心醉神迷
        的美妙旋律。
      zh-Hans: |-
        一边舒适地在天空中飞翔，
        一边发出优美的哼唱，
        让听到之人都为之沉醉。
      en: |-
        As it flies in a calm and relaxed manner, Altaria
        performs a humming song that would enrapture
        any audience.
      fr: |-
        Il vole doucement dans le ciel et fredonne
        de magnifiques mélodies qui enchantent
        tous ceux qui les entendent.
      de: |-
        Es schwebt gemächlich durch die Lüfte und
        lässt dabei ein wunderschönes Summen ertönen,
        das alle in seinen Bann zieht, die es hören.
      es: |-
        Mientras vuela pausadamente, emite un bello
        trino que cautiva a todo el que lo oye.
      it: |-
        Mentre si libra elegante in cielo, intona un canto
        soave che ammalia chi lo sente.
    shield:
      ja-Hrkt: |-
        やさしい　せいしつだが　おこらせると
        するどい　なきごえで　いかくして
        ようしゃない　こうげきを　くわえる。
      ja: |-
        優しい　性質だが　怒らせると
        鋭い　鳴き声で　威嚇して
        容赦ない　攻撃を　くわえる。
      ko: |-
        온순한 성질이지만 화나게 하면
        날카로운 울음소리로 위협하며
        가차 없이 공격한다.
      zh-Hant: |-
        性情溫柔，但一旦被激怒，
        就會用尖銳的叫聲威嚇對方，
        並且毫不留情地施加攻擊。
      zh-Hans: |-
        虽然性情温顺，但如果被惹怒，
        就会用尖锐的叫声威吓对方，
        并且毫不留情地发动进攻。
      en: |-
        This Pokémon has a kind disposition, but if it’s
        provoked, it will threaten opponents with shrill
        cries before attacking them without mercy.
      fr: |-
        Il est de nature aimable, mais si on le met en
        colère, il intimide son adversaire en poussant
        un cri strident et l’attaque sans pitié.
      de: |-
        Altaria ist von sanfter Natur, doch wird es
        verärgert, stößt es zur Einschüchterung schrilles
        Geschrei aus und greift dann gnadenlos an.
      es: |-
        Es de carácter amable, pero, si monta en cólera,
        intimidará al oponente con estridentes chillidos
        y atacará sin piedad.
      it: |-
        Ha un carattere gentile, ma se lo si fa arrabbiare
        emette un verso minaccioso, per poi attaccare
        senza pietà.
