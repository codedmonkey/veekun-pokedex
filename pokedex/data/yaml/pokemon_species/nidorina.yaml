    sword:
      ja-Hrkt: |-
        ひたいの　ツノは　こどもに　エサを
        あたえるときに　ささらないよう
        たいかしたと　かんがえられている。
      ja: |-
        額の　ツノは　子どもに　エサを
        与えるときに　刺さらないよう
        退化したと　考えられている。
      ko: |-
        이마의 뿔은 새끼에게 먹이를
        줄 때 찌르지 않도록
        퇴화했다고 추측되고 있다.
      zh-Hant: |-
        人們認為牠額頭上的角
        是為了避免在給孩子餵食時
        刺到孩子而退化的。
      zh-Hans: |-
        人们认为它额头上的角
        是为了防止给孩子喂食时
        刺到它们而退化的。
      en: |-
        The horn on its head has atrophied. It’s thought
        that this happens so Nidorina’s children won’t get
        poked while their mother is feeding them.
      fr: |-
        On pense que sa corne frontale s’est atrophiée
        pour lui permettre de nourrir ses petits sans
        les blesser.
      de: |-
        Man geht davon aus, dass sich das Horn auf
        ihrem Kopf zurückgebildet hat, damit sie ihre
        Jungen nicht beim Füttern verletzen.
      es: |-
        Se cree que el cuerno de la frente se le ha
        atrofiado para evitar herir a sus crías al
        alimentarlas.
      it: |-
        Si pensa che il corno sulla fronte si sia atrofizzato
        per evitare che Nidorina punga i suoi cuccioli
        quando li nutre.
    shield:
      ja-Hrkt: |-
        むれに　キケンが　せまると　なかまで
        けっそくして　ちょうおんぱの
        だいがっしょうを　おみまいするぞ。
      ja: |-
        群れに　危険が　せまると　仲間で
        結束して　超音波の　大合唱を
        おみまいするぞ。
      ko: |-
        무리에 위험이 닥치면
        동료와 결속하여
        초음파로 크게 합창한다.
      zh-Hant: |-
        有危險逼近群體時，
        會與夥伴們團結一致地
        用超音波的大合唱來攻擊。
      zh-Hans: |-
        如果族群遇到了危险，
        会和伙伴们团结起来，
        施展出超音波大合唱。
      en: |-
        If the group is threatened, these Pokémon will
        band together to assault enemies with a chorus
        of ultrasonic waves.
      fr: |-
        Si un danger menace le groupe, ces Pokémon
        se réunissent et l’affrontent en émettant
        des ultrasons en chœur.
      de: |-
        Nähert sich Gefahr, schließen sie sich mit anderen
        Artgenossen zusammen und begegnen der
        Bedrohung mit einem Chor aus Ultraschallwellen.
      es: |-
        Cuando el peligro se cierne sobre la manada,
        los miembros unen fuerzas para defenderse
        emitiendo un coro de ondas ultrasónicas.
      it: |-
        Quando il branco è minacciato da un pericolo,
        i suoi membri uniscono le forze e dispiegano
        un coro di ultrasuoni.
