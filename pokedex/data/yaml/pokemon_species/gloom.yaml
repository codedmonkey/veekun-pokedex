        每1000人裡總會有
        １個人喜歡聞這個味道。
      zh-Hans: |-
        奇臭无比！即使如此，
        一千个人里总会出现
        一个人喜欢闻这种味道。
      en: |-
        Smells incredibly foul! However, around one
        out of a thousand people enjoy sniffing
        its nose-bending stink.
      fr: |-
        Il sent très mauvais, mais une personne sur mille
        aime l’odeur de son corps nauséabond.
      de: |-
        Es riecht unglaublich widerlich. Trotzdem gibt
        es unter tausend Menschen mindestens einen,
        dem der Gestank gefällt.
      es: |-
        Huele bastante mal, pero una de cada mil
        personas aprecia su fétido olor.
      it: |-
        Puzza da levare il fiato! Tuttavia circa una
        persona su mille adora annusarne il fetido
        lezzo.
    sword:
      ja-Hrkt: |-
        めしべが　はなつ　とてつもなく
        くさい　においは　２キロさきまで
        とどき　きを　うしなわせる。
      ja: |-
        めしべが　放つ　とてつもなく
        臭い　においは　２キロ先まで
        とどき　気を　失わせる。
      ko: |-
        암술에서 내뿜는 지독하게
        구린 냄새는 2km 떨어진 곳까지
        퍼져 정신을 잃게 만든다.
      zh-Hant: |-
        雌蕊會散發一種
        極其強烈的惡臭，
        能讓２公里外的人昏倒。
      zh-Hans: |-
        雌蕊会散发一种
        极其强烈的恶臭，
        能让２公里远的人昏倒。
      en: |-
        Its pistils exude an incredibly foul odor.
        The horrid stench can cause fainting at a distance
        of 1.25 miles.
      fr: |-
        Ses pistils sécrètent une odeur incroyablement
        fétide qui fait perdre connaissance à
        ses adversaires jusqu’à 2 km à la ronde.
      de: |-
        Sein Stempel sondert einen unglaublich faulen
        Gestank ab. Dieser stechende Geruch kann selbst
        bis zu 2 km entfernte Gegner bewusstlos machen.
      es: |-
        Libera un fétido olor por los pistilos. El fuerte
        hedor hace perder el conocimiento a cualquiera
        que se encuentre en un radio de 2 km.
      it: |-
        I pistilli emanano un puzzo orribile, capace
        di far svenire chiunque nel raggio di 2 km.
    shield:
      ja-Hrkt: |-
        よだれのように　みえる　あまいミツ。
        とても　ねばねば　しており　ふれると
        いつまでも　まとわりつく。
      ja: |-
        よだれのように　見える　甘い蜜。
        とても　ねばねば　しており　触れると
        いつまでも　まとわりつく。
      ko: |-
        침처럼 보이는 달콤한 꿀은
        매우 끈적거려서
        묻으면 좀처럼 떨어지지 않는다.
      zh-Hant: |-
        看似口水的東西其實是
        甜甜的蜜。非常黏稠，
        只要碰到就會一直黏住。
      zh-Hans: |-
        看似口水的东西其实是
        甜甜的蜜。非常黏稠，
        只要碰到就会一直黏住。
      en: |-
        What appears to be drool is actually sweet honey.
        It is very sticky and clings stubbornly if touched.
      fr: |-
        Ce qui semble être sa bave est en fait du nectar
        très collant. Si on le touche, il est très difficile
        de s’en dépêtrer.
      de: |-
        Was wie Speichel aussieht, ist eigentlich Honig.
        Er ist sehr klebrig und wenn man ihn berührt,
        bekommt man ihn nicht mehr ab.
      es: |-
        Lo que parece baba es realmente un néctar muy
        pegajoso que se adhiere sin remisión al tocarlo.
      it: |-
        Ciò che sembra bava è in realtà dolce nettare.
        È molto viscoso: si appiccica appena lo si sfiora.
