    black-2:
      en: |-
        The honey it drools from its mouth
        smells so atrocious, it can curl
        noses more than a mile away.
    white-2:
      en: |-
        The honey it drools from its mouth
        smells so atrocious, it can curl
        noses more than a mile away.
    x:
      ja-Hrkt: |-
        もうれつな　クサさ！　それなのに
        １０００にんに　ひとりぐらい
        これを　このんで　かぐひとがいる。
      ja: |-
        猛烈な　クサさ！　それなのに
        １０００人に　１人ぐらい
        これを　好んで　かぐ　人がいる。
      ko: |-
        강렬한 악취가 난다! 그럼에도
        불구하고 1000명에 한 명 정도
        이 냄새를 즐겨 맡는 사람이 있다.
      en: |-
        Smells incredibly foul! However, around one out
        of a thousand people enjoy sniffing its
        nose-bending stink.
      fr: |-
        Il sent très mauvais ! Mais une personne sur 1 000
        aime la puanteur de son corps nauséabond.
      de: |-
        Dieses Pokémon sondert einen übelriechenden
        Geruch ab. Trotzdem halten einige Leute es im Haus.
      es: |-
        ¡Huele bastante mal! De todas formas, una de cada
        mil personas aprecian su fétido olor.
      it: |-
        Puzza da levare il fiato! Tuttavia circa una persona
        su mille adora annusarne il fetido lezzo.
    'y':
      ja-Hrkt: |-
        くちから　たれている　ミツは
        ２キロ　はなれていても　はなが
        まがるほど　もうれつに　くさい。
      ja: |-
        口から　たれている　ミツは
        ２キロ　離れていても　鼻が
        まがるほど　猛烈に　くさい。
      ko: |-
        입에서 흘러내리는 꿀은
        2km 떨어져 있어도 머리가
        아플 정도로 심한 악취가 난다.
      en: |-
        The honey it drools from its mouth smells so
        atrocious, it can curl noses more than a mile away.
      fr: |-
        L’odeur du nectar de sa bouche est si répugnante
        qu’elle agresse les narines à 2 km.
      de: |-
        Der Honig, den es abgibt, riecht so entsetzlich,
        dass sich sogar Nasen in 2 km Entfernung rümpfen.
      es: |-
        La miel que emana de su boca posee un hedor capaz
        de derribar enemigos a 2 km de distancia.
      it: |-
        Il fluido che fuoriesce dalla sua bocca è così
        puzzolente che si sente anche a 2 km di distanza.
    omega-ruby:
      ja-Hrkt: |-
        きけんを　かんじると　めしべの　はなつ　くさい
        においは　さらに　つよまるが　こころ　おだやかな
        ときは　くさい　においを　ださないのだ。
      ja: |-
        危険を　感じると　めしべの　放つ　くさい
        臭いが　さらに　強まるが　心が　穏やかな
        ときは　くさい　臭いを　出さないのだ。
      ko: |-
        위험을 느끼면 암술에서 내는 구린
        냄새가 더 강해지지만 마음이 평안할
        때는 구린 냄새를 내지 않는다.
      en: |-
        Gloom releases a foul fragrance from the pistil of its flower.
        When faced with danger, the stench worsens.
        If this Pokémon is feeling calm and secure, it does not
        release its usual stinky aroma.
      fr: |-
        La plupart du temps, Ortide dégage un parfum immonde du
        pistil de sa fleur. Lorsqu’il se sent en danger, la puanteur est
        encore pire. Lorsque ce Pokémon se sent bien et en sécurité,
        il ne dégage aucune odeur nauséabonde.
      de: |-
        Duflor produziert einen ekelerregenden Gestank aus
        dem Stempel seiner Blume. Wenn es in Gefahr gerät,
        wird der Gestank noch unerträglicher. Wenn sich dieses
        Pokémon in Sicherheit befindet, stößt es keinen
        Gestank aus.
      es: |-
        Gloom libera un fétido olor por el pistilo de la flor. Cuando
        está en peligro, el hedor se intensifica. Si este Pokémon está
        tranquilo y no se siente amenazado, no libera el desagradable
        olor.
      it: |-
        Gloom rilascia un odore fetido dal pistillo del suo fiore.
        Quando è in pericolo, l’olezzo peggiora. Quando invece
        si sente tranquillo e sicuro, non emana questa sostanza
        maleodorante.
    alpha-sapphire:
      ja-Hrkt: |-
        どうやら　クサイハナは　くちから　たらしている
        もうれつに　くさい　ニオイが　だいすき　らしい。
        ニオイを　かいで　さらに　みつを　あふれさせる。
      ja: |-
        どうやら　クサイハナは　口から　垂らしている
        猛烈に　臭い　ニオイが　大好き　らしい。
        ニオイを　嗅いで　さらに　みつを　あふれさせる。
      ko: |-
        아무래도 냄새꼬는 입에서 나는
        맹렬한 악취를 매우 좋아하는 것 같다.
        냄새를 맡으면 더욱 꿀이 넘쳐난다.
      en: |-
        From its mouth Gloom drips honey that smells absolutely
        horrible. Apparently, it loves the horrid stench. It sniffs the
        noxious fumes and then drools even more of its honey.
      fr: |-
        Ortide bave un miel qui sent horriblement mauvais.
        Apparemment, il adore cette odeur nauséabonde.
        Il en renifle les fumées toxiques et se met à baver
        du miel de plus belle.
      de: |-
        Aus Duflors Mund tropft übelst riechender Honig.
        Diesen Gestank scheint es zu lieben, denn es
        schnieft die giftigen Dämpfe ein und sabbert danach
        noch mehr Honig.
      es: |-
        Gloom babea un néctar que tiene un olor realmente horrible,
        aunque parece ser que a él le gusta. De hecho, aspira los
        gases nocivos y libera más néctar aún.
      it: |-
        Dalla bocca di Gloom fuoriesce una resina maleodorante
        e disgustosa. Evidentemente adora questo fetido olezzo,
        poiché lo annusa avidamente producendo poi altra resina.
    ultra-sun:
      de: |-
        Aus seinem Mund tropft übelriechender Honig.
        Bekommt man etwas davon ab, haftet sein
        Gestank selbst nach 10 Waschgängen noch an.
    ultra-moon:
      de: |-
        Der Honig, der er aus seinem Mund tropft, riecht
        zwar übel, lässt sich aber durch Trocknen und
        Erwärmen zu wirkungsvoller Medizin verarbeiten.
    lets-go-pikachu:
      ja-Hrkt: |-
        もうれつな　クサさ！　それなのに
        １０００にんに　ひとりぐらい　これを
        このんで　かぐひとがいる。
      ja: |-
        猛烈な　クサさ！　それなのに
        １０００人に　１人ぐらい　これを
        好んで　嗅ぐ人がいる。
      ko: |-
        강렬한 악취가 난다! 그럼에도
        불구하고 1000명에 한 명 정도
        이 냄새를 즐겨 맡는 사람이 있다.
      zh-Hant: |-
        味道奇臭無比！然而
        每1000人裡總會有
        １個人喜歡聞這個味道。
      zh-Hans: |-
        奇臭无比！即使如此，
        一千个人里总会出现
        一个人喜欢闻这种味道。
      en: |-
        Smells incredibly foul! However, around one
        out of a thousand people enjoy sniffing
        its nose-bending stink.
      fr: |-
        Il sent très mauvais, mais une personne sur mille
        aime l’odeur de son corps nauséabond.
      de: |-
        Es riecht unglaublich widerlich. Trotzdem gibt
        es unter tausend Menschen mindestens einen,
        dem der Gestank gefällt.
      es: |-
        Huele bastante mal, pero una de cada mil
        personas aprecia su fétido olor.
      it: |-
        Puzza da levare il fiato! Tuttavia circa una
        persona su mille adora annusarne il fetido
        lezzo.
    lets-go-eevee:
      ja-Hrkt: |-
        もうれつな　クサさ！　それなのに
