liepard:
  base_happiness: 50
  capture_rate: 90
  color: purple
  egg_groups:
    - ground
  evolution_chain: purrloin
  evolves_from: purrloin
  flavor_text:
    black:
      en: |-
        These Pokémon vanish and appear
        unexpectedly. Many Trainers are drawn
        to their beautiful form and fur.
      fr: |-
        Un Pokémon insaisissable. Son style
        et son pelage magnifique attirent de
        nombreux Dresseurs.
    white:
      en: |-
        Stealthily, it sneaks up on its target,
        striking from behind before its victim
        has a chance to react.
      fr: |-
        Il s’approche sans un bruit de sa proie
        et l’abat d’un coup par derrière
        sans jamais être repéré.
    black-2:
      en: |-
        Their beautiful form comes from
        the muscles they have developed.
        They run silently in the night.
    white-2:
      en: |-
        Their beautiful form comes from
        the muscles they have developed.
        They run silently in the night.
    x:
      ja-Hrkt: |-
        うつくしい　スタイルは　ぜんしんの
        はったつした　きんにくの　おかげ。
        おともたてずに　よるを　かけぬける。
      ja: |-
        美しい　スタイルは　全身の
        発達した　筋肉の　おかげ。
        音もたてずに　夜を　駆けぬける。
      ko: |-
        아름다운 스타일은 전신의
        발달한 근육 덕분이다.
        소리도 내지 않고 밤을 달린다.
      en: |-
        Their beautiful form comes from the muscles they
        have developed. They run silently in the night.
      fr: |-
        Sa ligne élégante cache une musculature féline
        qui lui permet de surprendre lors de ses attaques
        nocturnes.
      de: |-
        Sein anmutiges Auftreten verdankt es den Muskeln,
        die es entwickelt hat. Es prescht lautlos durch die
        Nacht.
      es: |-
        Su bella y grácil silueta le viene dada por su
        desarrollada musculatura, que le permite andar de
        noche sin hacer ruido.
      it: |-
        I muscoli tonici del suo corpo gli donano una figura
        davvero affascinante. Si aggira silenzioso nel buio
        della notte.
    'y':
      ja-Hrkt: |-
        けはいを　ころして　せっきんする。
        あいてが　きづく　まえに　はいごから
        しのびより　しとめてしまうのだ。
      ja: |-
        気配を　殺して　接近する。
        相手が　気づく　前に　背後から
        忍び寄り　しとめてしまうのだ。
      ko: |-
        기척을 지우고 접근한다.
        상대가 눈치채기 전에 뒤쪽으로
        살며시 다가가 꼼짝 못하게 한다.
      en: |-
        Stealthily, it sneaks up on its target, striking from
        behind before its victim has a chance to react.
      fr: |-
        Il s’approche sans un bruit de sa proie et l’abat
        d’un coup par-derrière sans jamais être repéré.
      de: |-
        Verbirgt seine Aura und nähert sich seinem Gegner
        völlig unbemerkt von hinten, um ihm den Garaus
        zu machen.
      es: |-
        Se aproxima evitando que lo detecten. Con sigilo, se
        acerca a su rival por la espalda y lo ataca.
      it: |-
        Si avvicina di soppiatto alle spalle del nemico
        colpendolo prima che se ne accorga.
    omega-ruby:
      ja-Hrkt: |-
        うつくしい　スタイルは　ぜんしんの
        はったつした　きんにくの　おかげ。
        おともたてずに　よるを　かけぬける。
      ja: |-
        美しい　スタイルは　全身の
        発達した　筋肉の　おかげ。
        音もたてずに　夜を　駆けぬける。
      ko: |-
        아름다운 스타일은 전신의
        발달한 근육 덕분이다.
        소리도 내지 않고 밤을 달린다.
      en: |-
        Their beautiful form comes from the muscles they
        have developed. They run silently in the night.
      fr: |-
        Sa ligne élégante cache une musculature féline qui lui permet
        de surprendre lors de ses attaques nocturnes.
      de: |-
        Sein anmutiges Auftreten verdankt es den Muskeln, die es
        entwickelt hat. Es prescht lautlos durch die Nacht.
      es: |-
        Su bella y grácil silueta le viene dada por su desarrollada
        musculatura, que le permite andar de noche sin hacer ruido.
      it: |-
        I muscoli tonici del suo corpo gli donano una figura davvero
        affascinante. Si aggira silenzioso nel buio della notte.
    alpha-sapphire:
      ja-Hrkt: |-
        けはいを　ころして　せっきんする。
        あいてが　きづく　まえに　はいごから
        しのびより　しとめてしまうのだ。
      ja: |-
        気配を　殺して　接近する。
        相手が　気づく　前に　背後から
        忍び寄り　しとめてしまうのだ。
      ko: |-
        기척을 지우고 접근한다.
        상대가 눈치채기 전에 뒤쪽으로
        살며시 다가가 꼼짝 못하게 한다.
      en: |-
        Stealthily, it sneaks up on its target, striking from
        behind before its victim has a chance to react.
      fr: |-
        Il s’approche sans un bruit de sa proie et l’abat d’un coup
        par-derrière sans jamais être repéré.
      de: |-
        Verbirgt seine Aura und nähert sich seinem Gegner völlig
        unbemerkt von hinten, um ihm den Garaus zu machen.
      es: |-
        Se aproxima evitando que lo detecten. Con sigilo, se acerca
        a su rival por la espalda y lo ataca.
      it: |-
        Si avvicina di soppiatto alle spalle del nemico colpendolo
        prima che se ne accorga.
    sword:
      ja-Hrkt: |-
        うつくしい　けなみと　スタイルに
        まどわされがちだが　きまぐれで
        きょうぼうな　ポケモンなのだ。
      ja: |-
        美しい　毛並みと　スタイルに
        惑わされがちだが　気まぐれで
        狂暴な　ポケモンなのだ。
      ko: |-
        아름다운 털과 스타일에
        쉽게 매료되지만 변덕스럽고
        흉포한 포켓몬이다.
      zh-Hant: |-
        雖然人們容易被牠美麗的
        毛皮和姿態所迷惑，但牠其實
        是一種善變而凶暴的寶可夢。
      zh-Hans: |-
        虽然人们容易被它美丽的
        毛发和身姿所迷惑，但它其实
        是一种善变而凶暴的宝可梦。
      en: |-
        Don’t be fooled by its gorgeous fur and elegant
        figure. This is a moody and vicious Pokémon.
      fr: |-
        On se laisse facilement éblouir par son pelage
        magnifique et son allure élégante, mais gare
        à son caractère imprévisible et agressif.
      de: |-
        Man wird schnell von seinem schönen Fell und
        seiner Anmut verleitet, aber es ist ein sehr
        launisches und gewalttätiges Pokémon.
      es: |-
        Bajo su hermoso pelaje y cautivador estilo, que
        puede llevar fácilmente a engaño, se oculta un
        carácter imprevisible y agresivo.
      it: |-
        Pokémon dalla magnifica pelliccia e dalle linee
        aggraziate, dietro cui si nasconde un carattere
        volubile e feroce.
    shield:
      ja-Hrkt: |-
        フォクスライと　なわばりを　めぐり
        あらそう。　おとひとつ　たてずに
        えものの　はいごに　しのびよる。
      ja: |-
        フォクスライと　縄張りを　めぐり
        争う。　音ひとつ　たてずに
        獲物の　背後に　忍び寄る。
      ko: |-
        폭슬라이와 영역을 두고
        다툰다. 소리를 전혀 내지 않고
        먹이의 배후에 접근한다.
      zh-Hant: |-
        和狐大盜爭搶地盤。
        能夠悄無聲息地
        從背後偷偷靠近獵物。
      zh-Hans: |-
        和猾大狐争抢地盘。
        能够悄无声息地
        从背后偷偷靠近猎物。
      en: |-
        This stealthy Pokémon sneaks up behind prey
        without making any sound at all. It competes with
        Thievul for territory.
      fr: |-
        Sans un bruit, il approche ses victimes
        par-derrière pour les frapper.
        Il dispute son territoire avec les Roublenard.
      de: |-
        Dieses Pokémon schleicht sich völlig geräuschlos
        von hinten an seine Beute heran. Es bestreitet
        Revierkämpfe mit Gaunux.
      es: |-
        Libra disputas territoriales con los Thievul. Se
        acerca a sus rivales por la espalda sin hacer el
        menor ruido.
      it: |-
        Si avvicina di soppiatto alla preda, attaccandola
        alle spalle all’improvviso. Spesso si contende
        il territorio con Thievul.
