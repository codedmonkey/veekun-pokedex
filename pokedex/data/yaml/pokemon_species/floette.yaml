        out the hidden power of flowers to battle.
      fr: |-
        Il survole les champs de fleurs, et prend soin de celles
        qui sont sur le point de faner. Au combat, il fait appel
        à leur force cachée.
      de: |-
        Es fliegt auf Wiesen umher und kümmert sich um welkende
        Blumen. Es setzt deren geheime Kräfte frei und nutzt diese
        zum Kämpfen.
      es: |-
        Revolotea alrededor de campos de flores y cuida de aquellas
        que empiezan a marchitarse. Usa en combate el poder oculto
        de las flores.
      it: |-
        Vola sui campi in fiore e si prende cura delle piante che si
        stanno seccando. Lotta sfruttando i poteri nascosti dei fiori.
    alpha-sapphire:
      ja-Hrkt: |-
        ていれの　いきとどいた　かだんの
