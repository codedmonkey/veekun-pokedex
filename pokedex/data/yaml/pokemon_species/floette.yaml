floette:
  base_happiness: 70
  capture_rate: 120
  color: white
  egg_groups:
    - fairy
  evolution_chain: flabebe
  evolves_from: flabebe
  flavor_text:
    x:
      ja-Hrkt: |-
        はなばたけを　とびまわり　かれかけた
        はなを　せわする。はなの　ひめられた
        ちからを　ひきだして　たたかう。
      ja: |-
        花畑を　飛び回り　枯れかけた　花を
        世話する。花の　秘められた　力を
        引き出して　戦う。
      ko: |-
        꽃밭을 날아다니며 말라가는
        꽃을 보살핀다. 꽃의 숨겨진
        힘을 끌어내어 싸운다.
      en: |-
        It flutters around fields of flowers and cares for
        flowers that are starting to wilt. It draws
        out the hidden power of flowers to battle.
      fr: |-
        Il survole les champs de fleurs, et prend soin de
        celles qui sont sur le point de faner. Au combat,
        il fait appel à leur force cachée.
      de: |-
        Es fliegt auf Wiesen umher und kümmert sich um
        welkende Blumen. Es setzt deren geheime Kräfte frei
        und nutzt diese zum Kämpfen.
      es: |-
        Revolotea alrededor de campos de flores y cuida de
        aquellas que empiezan a marchitarse. Usa en combate
        el poder oculto de las flores.
      it: |-
        Vola sui campi in fiore e si prende cura delle piante
        che si stanno seccando. Lotta sfruttando i poteri
        nascosti dei fiori.
    'y':
      ja-Hrkt: |-
        ていれの　いきとどいた　かだんの
        はなが　さくと　すがたを　あらわして
        かれんな　ダンスで　しゅくふくする。
      ja: |-
        手入れの　行き届いた　花壇の
        花が　咲くと　姿を　現して
        かれんな　ダンスで　祝福する。
      ko: |-
        빈틈없이 손질한 화단의
        꽃이 피면 모습을 드러내어
        아름다운 댄스로 축복한다.
      en: |-
        When the flowers of a well-tended flower bed bloom,
        it appears and celebrates with an elegant dance.
      fr: |-
        Quand les fleurs d’une plate-bande bien soignée
        éclosent, il apparaît et célèbre la floraison en dansant
        avec une très grande élégance.
      de: |-
        Wenn die Blumen auf einem liebevoll gepflegten
        Blumenbeet blühen, erscheint es und feiert den
        Anblick mit einem eleganten Tanz.
      es: |-
        Cuando las plantas bien cuidadas de un parterre
        florecen, hace acto de presencia e interpreta un
        baile primoroso para celebrarlo.
      it: |-
        Quando i fiori di un’aiuola ben curata sbocciano,
        appare e celebra l’evento con una danza graziosa.
    omega-ruby:
      ja-Hrkt: |-
        はなばたけを　とびまわり　かれかけた
        はなを　せわする。はなの　ひめられた
        ちからを　ひきだして　たたかう。
      ja: |-
