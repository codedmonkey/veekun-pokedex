        かれんな　ダンスで　しゅくふくする。
      ja: |-
        手入れの　行き届いた　花壇の
        花が　咲くと　姿を　現して
        かれんな　ダンスで　祝福する。
      ko: |-
        빈틈없이 손질한 화단의
        꽃이 피면 모습을 드러내어
        아름다운 댄스로 축복한다.
      en: |-
