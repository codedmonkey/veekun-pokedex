    ultra-sun:
      ja-Hrkt: |-
        はなを　そだて　じぶんの　ぶきとして
        りよう。　うつくしくさいた　はなほど
        きょうりょくなパワーを　ひめている。
      ja: |-
        花を　育て　自分の　武器として
        利用。　美しく咲いた　花ほど
        強力なパワーを　秘めている。
      ko: |-
        꽃을 길러 자신의 무기로
        이용한다. 아름답게 핀 꽃일수록
        강력한 파워를 간직하고 있다.
      zh-Hant: |-
        會培育花朵來當成自己的武器。
        開得越美麗的花朵，
        所蘊藏的力量就越強大。
      zh-Hans: |-
        会培育花朵当作自己的武器来用。
        越是开得美丽的花，
        蕴藏着的力量就越强大。
      en: |-
        It raises flowers and uses them as weapons.
        The more gorgeous the blossom, the more
        power it contains.
      fr: |-
        Il cultive des fleurs et les utilise en tant
        qu’armes. Plus une fleur est belle, plus
        elle renferme de puissance.
      de: |-
        Es kämpft mit einer Blume, die es selbst
        gezüchtet hat. Je schöner ihre Blüte, desto
        stärker die Macht, die sie birgt.
      es: |-
        Usa como arma la flor que cultiva por su cuenta
        y, cuanto mayor sea la belleza de esta, mayor
        será también el poder que oculta en su interior.
      it: |-
        Fa crescere il suo fiore e lo utilizza come arma.
        Più il fiore è bello, maggiore è il potere che
        racchiude.
    ultra-moon:
      ja-Hrkt: |-
        じぶんの　パワーを　はなに　あたえ
        こころを　こめて　せわを　する。
        かだんを　あらすものは　ゆるさない。
      ja: |-
        自分の　パワーを　花に　与え
        心を　こめて　世話を　する。
        花壇を　荒らすものは　許さない。
      ko: |-
        자신의 파워를 꽃에 주고
        진심을 담아 돌본다.
        화단을 어지럽히는 자는 용서하지 않는다.
      zh-Hant: |-
        會把自己的力量分給花，
        用心地加以照料。
        絕不會原諒破壞花壇的傢伙。
      zh-Hans: |-
        把自己的力量给花，用心地照料。
        绝不原谅那些破坏花坛者。
      en: |-
        It gives its own power to flowers, pouring its
        heart into caring for them. Floette never forgives
        anyone who messes up a flower bed.
      fr: |-
        Il fait profiter ses fleurs de ses pouvoirs et met
        tout son cœur à leur entretien. Gare à ceux qui
        ravagent ses plates-bandes !
      de: |-
        Es überträgt seine Kraft auf Blumen und pflegt
        diese mit ganzem Herzen. Es verzeiht keinem,
        der sein Blumenbeet verwüstet.
      es: |-
        Confiere su poder a las flores y cuida de ellas
        con mucho esmero; no perdona que destruyan
        los campos donde estas crecen.
      it: |-
        Trasmette il suo potere ai fiori e se ne prende
        cura con tutto il suo amore. Non ha alcuna pietà
        per chi deturpa le sue aiuole.
  form_description:
    en: |-
      Floette's five regular forms only differ in appearance.  Floette's flower is set when it is encountered, or as a Flabébé, and cannot be changed.

      Eternal Floette has higher stats, cannot evolve or breed, and learns []{move:light-of-ruin} at level 50.  It is currently not obtainable.
  forms_switchable: false
  gender_rate: '8'
  generation: generation-vi
  genus:
