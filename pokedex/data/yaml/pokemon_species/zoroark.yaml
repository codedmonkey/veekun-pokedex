zoroark:
  base_happiness: 50
  capture_rate: 45
  color: gray
  egg_groups:
    - ground
  evolution_chain: zorua
  evolves_from: zorua
  flavor_text:
    black:
      en: |-
        Bonds between these Pokémon are very
        strong. It protects the safety of its
        pack by tricking its opponents.
      fr: |-
        Ces Pokémon protègent les leurs en
        prenant l’apparence de leurs ennemis.
        Ils forment des groupes très soudés.
    white:
      en: |-
        Each has the ability to fool a large
        group of people simultaneously. They
        protect their lair with illusory scenery.
      fr: |-
        Il peut mystifier instantanément des
        foules d’humains. Il protège son habitat
        en créant des illusions de paysages.
    black-2:
      en: |-
        Stories say those who tried
        to catch Zoroark were trapped
        in an illusion and punished.
    white-2:
      en: |-
        Stories say those who tried
        to catch Zoroark were trapped
        in an illusion and punished.
    x:
      ja-Hrkt: |-
        いっぺんに　おおぜいの　ひとを
        ばかす　ちからを　もつ。まぼろしの
        けしきを　みせて　すみかを　まもる。
      ja: |-
        いっぺんに　大勢の　人を
        化かす　力を　持つ。
        幻の　景色を　見せて　住処を　守る。
      ko: |-
        한 번에 많은 사람을
        속이는 힘을 가졌다. 환영의
        경치를 보여줘 거처를 지킨다.
      en: |-
        Each has the ability to fool a large group of people
        simultaneously. They protect their lair with
        illusory scenery.
      fr: |-
        Il peut mystifier instantanément des foules d’humains.
        Il protège son habitat en créant des illusions de
        paysages.
      de: |-
        Kann auf einen Schlag große Massen von Menschen
        täuschen. Es kreiert Illusionen, um sein Revier zu
        schützen.
      es: |-
        Tiene la facultad de confundir a muchos humanos a la
        vez. Protege su guarida creando un paisaje ilusorio.
      it: |-
        Ha la capacità di trarre in inganno una folla di persone.
        Protegge la tana creando dei miraggi.
    'y':
      ja-Hrkt: |-
        あいてを　ばかす　ことで　むれの
        あんぜんを　まもってきた　ポケモン。
        なかまの　けっそくが　かたい。
      ja: |-
        相手を　化かす　ことで　群れの
        安全を　守ってきた　ポケモン。
        仲間同士の　結束が　固い。
      ko: |-
        상대를 속여 무리의
        안전을 유지해온 포켓몬이다.
        동료 간의 결속력이 강하다.
      en: |-
        Bonds between these Pokémon are very strong.
        It protects the safety of its pack by tricking
        its opponents.
      fr: |-
        Ces Pokémon protègent les leurs en prenant
        l’apparence de leurs ennemis. Ils forment des groupes
        très soudés.
      de: |-
        Seit jeher beschützt es das Rudel, indem es
        die Gestalt des Feindes annimmt. Es ist sehr
        loyal zu seinen Artgenossen.
      es: |-
        Siempre ha protegido a su manada embaucando a sus
        enemigos. Dentro de la manada están todos muy
        unidos.
      it: |-
        Protegge la sicurezza del gruppo ammaliando gli
        avversari. Dimostra forte solidarietà verso i compagni.
    omega-ruby:
      ja-Hrkt: |-
        いっぺんに　おおぜいの　ひとを
        ばかす　ちからを　もつ。まぼろしの
        けしきを　みせて　すみかを　まもる。
      ja: |-
        いっぺんに　大勢の　人を
        化かす　力を　持つ。
        幻の　景色を　見せて　住処を　守る。
      ko: |-
        한 번에 많은 사람을
        속이는 힘을 가졌다. 환영의
        경치를 보여줘 거처를 지킨다.
      en: |-
        Each has the ability to fool a large group of people
        simultaneously. They protect their lair with
        illusory scenery.
      fr: |-
        Il peut mystifier instantanément des foules d’humains.
        Il protège son habitat en créant des illusions de paysages.
      de: |-
        Kann auf einen Schlag große Massen von Menschen täuschen.
        Es kreiert Illusionen, um sein Revier zu schützen.
      es: |-
        Tiene la facultad de confundir a muchos humanos a la vez.
        Protege su guarida creando un paisaje ilusorio.
      it: |-
        Ha la capacità di trarre in inganno una folla di persone.
        Protegge la tana creando dei miraggi.
    alpha-sapphire:
      ja-Hrkt: |-
        あいてを　ばかす　ことで　むれの
        あんぜんを　まもってきた　ポケモン。
        なかまの　けっそくが　かたい。
      ja: |-
        相手を　化かす　ことで　群れの
        安全を　守ってきた　ポケモン。
        仲間同士の　結束が　固い。
      ko: |-
        상대를 속여 무리의
        안전을 유지해온 포켓몬이다.
        동료 간의 결속력이 강하다.
      en: |-
        Bonds between these Pokémon are very strong.
        It protects the safety of its pack by tricking
        its opponents.
      fr: |-
        Ces Pokémon protègent les leurs en prenant l’apparence
        de leurs ennemis. Ils forment des groupes très soudés.
      de: |-
        Seit jeher beschützt es das Rudel, indem es die Gestalt des
        Feindes annimmt. Es ist sehr loyal zu seinen Artgenossen.
      es: |-
        Siempre ha protegido a su manada embaucando a sus
        enemigos. Dentro de la manada están todos muy unidos.
      it: |-
        Protegge la sicurezza del gruppo ammaliando gli avversari.
        Dimostra forte solidarietà verso i compagni.
    ultra-sun:
      ja-Hrkt: |-
        なにかに　ばけるだけ　ではなく
        なんびゃくにんもの　ひとに
        まぼろしを　みせる　ちからをもつ。
      ja: |-
        何かに　化けるだけ　ではなく
        何百人もの　人に
        幻を　見せる　力をもつ。
      ko: |-
        둔갑술이 가능할 뿐만 아니라
        수백 명의 사람에게 환상을
        보여줄 수 있는 힘을 가졌다.
      zh-Hant: |-
        不只會幻化成其他東西，
        還擁有能夠讓數百人
        看見幻象的力量。
      zh-Hans: |-
        不只是幻化成其他东西，
        还拥有让几百人看见幻像的力量。
      en: |-
        It doesn’t just transform itself—it also has the
        power to make hundreds of people see
        its illusions.
      fr: |-
        Il est non seulement capable de changer
        d’apparence, mais il peut également créer
        des illusions pour hypnotiser les humains.
      de: |-
        Es kann nicht nur seine Gestalt verändern,
        sondern auch Illusionen erzeugen, um auf einen
        Schlag mehrere Hundert Menschen zu täuschen.
      es: |-
        No solo es capaz de transformarse, sino que
        también puede crear ilusiones para confundir
        a cientos de personas.
      it: |-
        Oltre a essere in grado di trasformarsi in
        qualsiasi cosa, ha anche il potere di creare
        miraggi, traendo in inganno centinaia di persone.
    ultra-moon:
      ja-Hrkt: |-
        にんげんに　すみかを　あばかれそうに
        なると　まぼろしを　みせて　もりを
        さまよわせ　つづける　という。
      ja: |-
        人間に　棲み処を　暴かれそうに
        なると　幻を　みせて　森を
        彷徨わせ　続ける　という。
      ko: |-
        인간에게 거처를 들킬 위기에
        처하면 환상을 보여줘서
        숲을 떠돌게 한다고 전해진다.
      zh-Hant: |-
        據說當牠的棲息地快要暴露在
        人類面前時，牠會製造出幻影，
        讓人在森林裡不斷徘徊。
      zh-Hans: |-
        据说，栖息地快要暴露在人类面前时，
        它就会制造出幻象，
        让人在森林里不断徘徊。
      en: |-
        If it thinks humans are going to discover its den,
        Zoroark shows them visions that make them
        wander around in the woods.
      fr: |-
        Les humains qui osent menacer son habitat
        finissent par errer éternellement dans les bois,
        victimes de ses illusions.
      de: |-
        Es heißt, dass es jene Menschen, die sein Revier
        zu enthüllen drohen, mit Illusionen täuscht und
        dazu bringt, unentwegt durch den Wald zu irren.
      es: |-
        Si percibe que un humano está amenazando su
        hábitat, crea visiones para aturdirlo y hacerlo
        vagar por el bosque sin cesar.
      it: |-
        Se un essere umano sta per scoprire la sua
        tana, crea dei miraggi per depistarlo, facendolo
        vagare nel bosco all’infinito.
    sword:
      ja-Hrkt: |-
        なかまおもいの　ポケモン。
        おそろしい　まぼろしを　みせて
        すみかや　むれを　まもるのだ。
      ja: |-
        仲間想いの　ポケモン。
        恐ろしい　幻を　見せて
        すみかや　群れを　守るのだ。
      ko: |-
        동료애가 깊은 포켓몬이다.
        무서운 환상을 보게 만들어서
        거처나 무리를 지킨다.
      zh-Hant: |-
        是時刻為夥伴著想的寶可夢。
        為了保護棲息地和族群的安全，
        會讓敵人看到恐怖的幻影。
      zh-Hans: |-
        时刻为伙伴着想的宝可梦。
        为保护自己的栖息地和族群，
        会让敌人看到恐怖的幻象。
      en: |-
        This Pokémon cares deeply about others of its
        kind, and it will conjure terrifying illusions to
        keep its den and pack safe.
      fr: |-
        Doté d’un grand sens de la camaraderie,
        ce Pokémon peut créer des illusions effrayantes
        pour protéger son habitat et ses congénères.
      de: |-
        Seine Artgenossen liegen ihm sehr am Herzen.
        Zoroark beschützt sein Revier und sein Rudel,
        indem es furchteinflößende Illusionen erzeugt.
      es: |-
        Cuida de sus semejantes. Provoca ilusiones
        terroríficas para proteger tanto su guarida
        como a su manada de sus adversarios.
      it: |-
        Tiene molto ai suoi simili e protegge la tana
        e il branco creando miraggi spaventosi.
    shield:
      ja-Hrkt: |-
        こどくなトレーナーは　ゾロアークに
        まぼろしを　みせるように　めいじて
        ひとりの　さみしさを　まぎらわす。
      ja: |-
        孤独なトレーナーは　ゾロアークに
        幻を　見せるように　命じて
        ひとりの　さみしさを　紛らわす。
      ko: |-
        고독한 트레이너는 조로아크에게
        환상을 보여주도록 명령하여
        혼자만의 외로움을 달랜다.
      zh-Hant: |-
        孤獨的訓練家會命令
        索羅亞克讓他看見幻影，
        藉此紓解一個人的寂寞。
      zh-Hans: |-
        孤独的训练家会命令
        索罗亚克为自己展现幻像，
        借以排遣孤身一人的寂寞。
      en: |-
        Seeking to ease the burden of their solitude,
        lonely Trainers tell Zoroark to show illusions
        to them.
      fr: |-
        Les Dresseurs en manque de compagnie
        ordonnent à Zoroark de leur montrer
        une illusion pour tromper leur solitude.
      de: |-
        Trainer, denen es an Gesellschaft fehlt, weisen
        Zoroark manchmal dazu an, ihnen eine Illusion zu
        zeigen, um sich von ihrer Einsamkeit abzulenken.
      es: |-
        Los Entrenadores solitarios le piden a Zoroark
        que les muestre ilusiones con las que combatir
        la desazón de la soledad.
      it: |-
        Gli Allenatori tristi e soli chiedono a Zoroark
        di mostrare loro dei miraggi che allevino
        la loro solitudine.
