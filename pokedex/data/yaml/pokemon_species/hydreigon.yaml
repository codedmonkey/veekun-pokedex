hydreigon:
  base_happiness: 35
  capture_rate: 45
  color: blue
  egg_groups:
    - dragon
  evolution_chain: deino
  evolves_from: zweilous
  flavor_text:
    black:
      en: |-
        This brutal Pokémon travels the skies on
        its six wings. Anything that moves seems
        like a foe to it, triggering its attack.
      fr: |-
        Un Pokémon violent qui patrouille le ciel
        avec ses six ailes et se jette sur tout
        ce qui bouge, pensant voir un ennemi.
    white:
      en: |-
        The heads on their arms do not have
        brains. They use all three heads to
        consume and destroy everything.
      fr: |-
        Les têtes sur ses bras n’ont pas
        de cerveau. Avec ses trois têtes,
        il dévore et détruit tout.
    black-2:
      en: |-
        It responds to movement by attacking.
        This scary, three-headed Pokémon
        devours everything in its path!
    white-2:
      en: |-
        It responds to movement by attacking.
        This scary, three-headed Pokémon
        devours everything in its path!
    x:
      ja-Hrkt: |-
        りょううでの　あたまは　のうみそを
        もたない。３つの　あたまで　すべてを
        たべつくし　はかいしてしまう。
      ja: |-
        両腕の　頭は　脳みそを　持たない。
        ３つの　頭で　すべてを　食べつくし
        破壊してしまう。
      ko: |-
        양팔에 있는 머리에는 뇌가
        없다. 3개의 머리로 모든 것을
        먹어치워 파괴해 버린다.
      en: |-
        The heads on their arms do not have brains.
        They use all three heads to consume and
        destroy everything.
      fr: |-
        Les têtes sur ses bras n’ont pas de cerveau.
        Avec ses trois têtes, il dévore et détruit tout.
      de: |-
        Die Köpfe an seinen beiden Armen haben kein
        eigenes Gehirn. Seine drei Mäuler kauen alles
        radikal kurz und klein.
      es: |-
        Las cabezas de sus dos brazos no tienen cerebro. Con
        sus tres cabezas destruye y devora todo a su paso.
      it: |-
        Le teste che ha sugli arti non hanno cervello.
        Distrugge e divora qualsiasi cosa usando tutte
        e tre le teste.
    'y':
      ja-Hrkt: |-
        うごく　ものに　はんのうして
        おそいかかり　３つの　あたまで
        くらいつくす　おそろしい　ポケモン。
      ja: |-
        動く　ものに　反応して
        襲いかかり　３つの　頭で
        食らいつくす　恐ろしい　ポケモン。
      ko: |-
        움직이는 것에 반응하여
        덮쳐서 3개의 머리로
        먹어치우는 무시무시한 포켓몬.
      en: |-
        It responds to movement by attacking. This scary,
        three-headed Pokémon devours everything in
        its path!
      fr: |-
        Un Pokémon effrayant. Ses trois têtes dévorent tout
        ce qui bouge jusqu’à satiété.
      de: |-
        Ein kaltblütiges Pokémon, das auf alles reagiert,
        was sich bewegt, indem es mit seinen drei Köpfen
        danach schnappt.
      es: |-
        Un Pokémon temible que ataca todo lo que se mueve
        y devora con sus tres cabezas cuanto halla a su paso.
      it: |-
        È davvero terrificante. Reagisce a ogni cosa che
        si muove, attaccandola e sbranandola con le sue
        tre teste.
    omega-ruby:
      ja-Hrkt: |-
        りょううでの　あたまは　のうみそを
        もたない。３つの　あたまで　すべてを
        たべつくし　はかいしてしまう。
      ja: |-
        両腕の　頭は　脳みそを　持たない。
        ３つの　頭で　すべてを　食べつくし
        破壊してしまう。
      ko: |-
        양팔에 있는 머리에는 뇌가
        없다. 3개의 머리로 모든 것을
        먹어치워 파괴해 버린다.
      en: |-
        The heads on their arms do not have brains.
        They use all three heads to consume and
        destroy everything.
      fr: |-
        Les têtes sur ses bras n’ont pas de cerveau. Avec ses trois
        têtes, il dévore et détruit tout.
      de: |-
        Die Köpfe an seinen beiden Armen haben kein eigenes Gehirn.
        Seine drei Mäuler kauen alles radikal kurz und klein.
      es: |-
        Las cabezas de sus dos brazos no tienen cerebro. Con sus
        tres cabezas destruye y devora todo a su paso.
      it: |-
        Le teste che ha sugli arti non hanno cervello. Distrugge
        e divora qualsiasi cosa usando tutte e tre le teste.
    alpha-sapphire:
      ja-Hrkt: |-
        うごく　ものに　はんのうして
        おそいかかり　３つの　あたまで
        くらいつくす　おそろしい　ポケモン。
      ja: |-
        動く　ものに　反応して
        襲いかかり　３つの　頭で
        食らいつくす　恐ろしい　ポケモン。
      ko: |-
        움직이는 것에 반응하여
        덮쳐서 3개의 머리로
        먹어치우는 무시무시한 포켓몬.
      en: |-
        It responds to movement by attacking. This scary,
        three-headed Pokémon devours everything in
        its path!
      fr: |-
        Un Pokémon effrayant. Ses trois têtes dévorent tout ce qui
        bouge jusqu’à satiété.
      de: |-
        Ein kaltblütiges Pokémon, das auf alles reagiert, was sich
        bewegt, indem es mit seinen drei Köpfen danach schnappt.
      es: |-
        Un Pokémon temible que ataca todo lo que se mueve y
        devora con sus tres cabezas cuanto halla a su paso.
      it: |-
        È davvero terrificante. Reagisce a ogni cosa che si muove,
        attaccandola e sbranandola con le sue tre teste.
    sword:
      ja-Hrkt: |-
        うごくもの　すべてに　くらいつく。
        サザンドラに　むらを　ほろぼされた
        という　いいつたえは　おおい。
      ja: |-
        動くもの　すべてに　食らいつく。
        サザンドラに　村を　滅ぼされた
        という　言い伝えは　多い。
      ko: |-
        움직이는 모든 것을 먹어 치운다.
        삼삼드래에게 마을이 파괴되었다는
        이야기는 많이 전해 내려온다.
      zh-Hant: |-
        會咬住一切會動的物體。
        有不少傳說裡都提到了
        三首惡龍毀滅村莊的故事。
      zh-Hans: |-
        会咬住一切会动的物体。
        有不少传说里都提到了
        三首恶龙毁灭村庄的故事。
      en: |-
        There are a slew of stories about villages that
        were destroyed by Hydreigon. It bites anything
        that moves.
      fr: |-
        Il dévore tout ce qui bouge. Bon nombre
        de légendes mentionnent des villages entiers
        rasés par un Trioxhydre.
      de: |-
        Es beißt alles, was sich bewegt. In zahlreichen
        alten Sagen wird von Trikephalo berichtet, die
        ganze Dörfer in Schutt und Asche gelegt haben.
      es: |-
        Ataca y devora todo lo que se mueve. Existen
        numerosos relatos de pueblos enteros que fueron
        arrasados por este Pokémon.
      it: |-
        Azzanna tutto ciò che si muove. Sono molte
        le storie che narrano di villaggi rasi al suolo
        da questo Pokémon.
    shield:
      ja-Hrkt: |-
        ３つの　あたまで　かわるがわる
        かみつく。　あいてが　たおれるまで
        こうげきの　てを　やすめない。
      ja: |-
        ３つの　頭で　代わるがわる
        噛みつく。　相手が　倒れるまで
        攻撃の　手を　休めない。
      ko: |-
        3개의 머리로 번갈아 가며
        물어뜯는다. 상대가 쓰러질 때까지
        공격을 멈추지 않는다.
      zh-Hant: |-
        ３個頭會輪流去咬敵人。
        在對方倒下之前，
        絕對不會停止攻擊。
      zh-Hans: |-
        ３个头会轮流去咬敌人。
        在对方倒下之前，
        绝对不会停止攻击。
      en: |-
        The three heads take turns sinking their teeth into
        the opponent. Their attacks won’t slow until their
        target goes down.
      fr: |-
        Chacune de ses trois têtes mord à tour de rôle.
        Il attaque ses adversaires sans relâche,
        jusqu’à ce qu’ils s’écroulent.
      de: |-
        Im Kampf beißen die drei Köpfe abwechselnd zu
        und lassen nicht ab, bis ihr Opfer am Boden liegt.
      es: |-
        Sus tres cabezas se alternan para dar mordiscos
        y no cejarán en su ataque hasta que el rival haya
        caído redondo.
      it: |-
        Le sue tre teste si alternano nel mordere e
        non cessa i suoi attacchi fino a quando
        l’avversario non ha più energie.
