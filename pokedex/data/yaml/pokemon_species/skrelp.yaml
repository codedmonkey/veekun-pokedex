skrelp:
  base_happiness: 50
  capture_rate: 225
  color: brown
  egg_groups:
    - water1
    - dragon
  evolution_chain: skrelp
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        くさった　かいそうに　ぎたいする。
        きづかずに　ちかよってきた　えものに
        どくえきを　あびせて　しとめる。
      ja: |-
        腐った　海藻に　擬態する。
        気づかずに　近寄ってきた　獲物に
        毒液を　浴びせて　しとめる。
      ko: |-
        썩은 해조로 위장한다.
        눈치채지 못하고 가까이 다가온
        사냥감에 독액을 끼얹어 잡는다.
      en: |-
        Camouflaged as rotten kelp, they spray
        liquid poison on prey that approaches
        unawares and then finish it off.
      fr: |-
        Il se cache parmi les algues en décomposition pour
        mieux approcher ses proies, qu’il achève en les
        aspergeant de poison.
      de: |-
        Als verfaulter Seetang getarnt, lauert es auf Beute und
        bespritzt alles und jeden, der sich ahnungslos nähert,
        mit flüssigem Gift, bevor es ihm den Rest gibt.
      es: |-
        Adopta la apariencia de algas podridas y lanza un
        líquido venenoso a las presas desprevenidas que
        pasan cerca.
      it: |-
        Si mimetizza assumendo l’aspetto della vegetazione
        marina in decomposizione. Spruzza sulle prede ignare
        un liquido velenoso per poi finirle.
    'y':
      ja-Hrkt: |-
        くさった　かいそうに　そっくり。
        てきの　めを　ごまかしながら
        しんかする　ちからを　たくわえる。
      ja: |-
        腐った　海藻に　そっくり。
        敵の　目を　ごまかしながら
        進化する　力を　蓄える。
      ko: |-
        썩은 해조와 똑같이 생겼다.
        적의 눈을 속이며
        진화할 힘을 비축한다.
      en: |-
        It looks just like rotten kelp. It hides from foes
        while storing up power for its evolution.
      fr: |-
        Sa ressemblance avec le varech pourri est
        confondante. Il se soustrait à l’attention de
        ses ennemis en attendant de pouvoir évoluer.
      de: |-
        Mit seinem an verfaulten Seetang erinnernden
        Aussehen führt es den Gegner in die Irre, während
        es selbst Energie zur Weiterentwicklung speichert.
      es: |-
        Es idéntico a un alga podrida. Mientras burla al
        enemigo, acumula energía para evolucionar.
      it: |-
        Il suo aspetto ricorda la vegetazione marina in
        decomposizione. Sfugge ai nemici mimetizzandosi e
        resta nascosto accumulando energie per l’evoluzione.
    omega-ruby:
