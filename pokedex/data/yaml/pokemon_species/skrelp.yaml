        눈치채지 못하고 가까이 다가온
        사냥감에 독액을 끼얹어 잡는다.
      en: |-
        Camouflaged as rotten kelp, they spray
        liquid poison on prey that approaches
        unawares and then finish it off.
      fr: |-
        Il se cache parmi les algues en décomposition pour mieux
        approcher ses proies, qu’il achève en les aspergeant
        de poison.
      de: |-
        Als verfaulter Seetang getarnt, lauert es auf Beute und
        bespritzt alles und jeden, der sich ahnungslos nähert,
        mit flüssigem Gift, bevor es ihm den Rest gibt.
      es: |-
        Adopta la apariencia de algas podridas y lanza un líquido
        venenoso a las presas desprevenidas que pasan cerca.
      it: |-
        Si mimetizza assumendo l’aspetto della vegetazione marina
        in decomposizione. Spruzza sulle prede ignare un liquido
        velenoso per poi finirle.
    alpha-sapphire:
      ja-Hrkt: |-
        くさった　かいそうに　そっくり。
        てきの　めを　ごまかしながら
        しんかする　ちからを　たくわえる。
      ja: |-
        腐った　海藻に　そっくり。
        敵の　目を　ごまかしながら
        進化する　力を　蓄える。
      ko: |-
        썩은 해조와 똑같이 생겼다.
        적의 눈을 속이며
        진화할 힘을 비축한다.
      en: |-
        It looks just like rotten kelp. It hides from foes
        while storing up power for its evolution.
      fr: |-
        Sa ressemblance avec le varech pourri est confondante.
        Il se soustrait à l’attention de ses ennemis en attendant
        de pouvoir évoluer.
      de: |-
        Mit seinem an verfaulten Seetang erinnernden Aussehen
        führt es den Gegner in die Irre, während es selbst Energie
        zur Weiterentwicklung speichert.
      es: |-
        Es idéntico a un alga podrida. Mientras burla al enemigo,
        acumula energía para evolucionar.
      it: |-
        Il suo aspetto ricorda la vegetazione marina in
        decomposizione. Sfugge ai nemici mimetizzandosi e resta
        nascosto accumulando energie per l’evoluzione.
    ultra-sun:
      ja-Hrkt: |-
        もくずに　まぎれ　おおきなポケモンに
        おそわれないよう　じっと　している。
        くさった　かいそうが　おもな　エサ。
      ja: |-
        藻屑に　紛れ　大きなポケモンに
        襲われないよう　じっと　している。
        腐った　海草が　主な　エサ。
      ko: |-
        수초 찌꺼기로 뒤범벅을 하고 큰 포켓몬에게
        공격당하지 않도록 가만히 있다.
        썩은 해초가 주요 먹이다.
      zh-Hant: |-
        為了不被大型寶可夢襲擊，
        總是混在海藻屑裡動也不動。
        主要的食物是腐爛的海草。
      zh-Hans: |-
        同碎藻混杂在一起，为了不被
        大型宝可梦袭击，一直一动不动的。
        以腐烂的海藻为主要食物。
      en: |-
        It vanishes into seaweed and remains perfectly
        still to avoid attacks from large Pokémon.
        Rotten seaweed is its main food source.
      fr: |-
        Il reste tapi au fond des océans, à l’abri des
        plus gros Pokémon. Il se nourrit principalement
        d’algues pourries.
      de: |-
        Es versteckt sich regungslos zwischen Algen,
        um Angriffe von großen Pokémon zu vermeiden.
        Verfaulter Seetang ist seine bevorzugte Speise.
      es: |-
        Permanece escondido e inmóvil entre las algas
        para protegerse de Pokémon más grandes. Su
        principal sustento son las algas podridas.
      it: |-
        Si nasconde immobile tra la vegetazione marina
        per sfuggire ai Pokémon più grandi. Si nutre
        prevalentemente di alghe in decomposizione.
    ultra-moon:
      ja-Hrkt: |-
        およぐのが　ヘタなので　もくずに
        まきついている。　アローラちほうでは
        ダダリンの　そばで　よく　みつかる。
      ja: |-
        泳ぐのが　下手なので　藻屑に
        巻きついている。　アローラ地方では
        ダダリンの　そばで　よく　見つかる。
      ko: |-
        헤엄을 잘 못 치기 때문에 해초를
        휘감고 있다. 알로라지방에서는
        타타륜 주변에서 자주 발견된다.
      zh-Hant: |-
        因為不擅長游泳，所以會纏在
        海藻碎屑上。在阿羅拉地區，
        經常可以在破破舵輪旁邊看見牠。
      zh-Hans: |-
        因为不擅长游泳，
        所以会缠住碎藻。在阿罗拉地区，
        经常能在破破舵轮旁边发现它。
      en: |-
        It’s not good at swimming, so it clings to the
        seaweed. In the Alola region, it’s often found
        near Dhelmise.
      fr: |-
        Comme il n’est pas très bon nageur, il se
        contente de s’entortiller autour des algues.
        À Alola, on le trouve souvent près de Sinistrail.
      de: |-
        Es wickelt sich um treibende Algenfetzen, da es
        ein schlechter Schwimmer ist. In Alola sieht man
        es oft Seite an Seite mit Moruda.
      es: |-
        Sus dotes para el nado dejan que desear y se
        enrolla en las algas. En la región de Alola se le
        suele ver acompañando a Dhelmise.
      it: |-
        È un pessimo nuotatore e preferisce restare
        avvinghiato alle alghe. Nella regione di Alola
        lo si trova spesso al fianco di Dhelmise.
    sword:
      ja-Hrkt: |-
        もくずに　まぎれて　うみを　ただよい
        かいそうを　たべにきた　ポケモンを
        しとめて　ごちそうに　するのだ。
      ja: |-
        藻屑に　紛れて　海を　漂い
        海藻を　食べに来た　ポケモンを
        しとめて　ご馳走に　するのだ。
      ko: |-
        수초 찌꺼기 틈에서 바다를 떠다니다가
        해초를 먹으러 온 포켓몬을
        꼼짝 못 하게 한 후 잡아먹는다.
      zh-Hant: |-
        會混在海藻屑裡漂浮在大海，
        並且捕獵來吃海藻的寶可夢，
        當作大餐飽吃一頓。
      zh-Hans: |-
        与碎藻混杂在一起漂浮于海中。
        会瞄准来吃海藻的宝可梦，
        了结它的性命并美餐一顿。
      en: |-
        It drifts in the ocean, blending in with floating
        seaweed. When other Pokémon come to feast on
        the seaweed, Skrelp feasts on them instead.
      fr: |-
        Il se mêle aux algues en décomposition flottant
        à la surface des océans afin de surprendre et de
        dévorer les Pokémon qui viennent s’en nourrir.
      de: |-
        Es treibt versteckt zwischen Algen durchs Meer.
        Nähert sich ein Pokémon, um diese zu essen,
        wird es von Algitt erledigt und verspeist.
      es: |-
        Vaga por el océano oculto entre las algas y da
        buena cuenta de los Pokémon que se acercan
        para alimentarse de ellas.
      it: |-
        Galleggia nel mare mimetizzandosi fra le alghe
        fluttuanti e agguanta i Pokémon che si avvicinano
        per nutrirsi.
    shield:
      ja-Hrkt: |-
        くさった　かいそうに　にているので
        うみを　ただよう　もくずの　なかに
        かくれて　てきのめを　ごまかす。
      ja: |-
        腐った　海藻に　似ているので
        海を　漂う　藻屑の　中に
        隠れて　敵の目を　ごまかす。
      ko: |-
        썩은 해초를 닮아서
        바다를 떠도는 해초 더미 안에
        숨어 적의 눈을 속인다.
      zh-Hant: |-
        看起來像是腐爛的海藻，
        因此會躲在海裡漂浮的
        藻屑裡混淆敵人的耳目。
      zh-Hans: |-
        看上去很像腐烂的海藻，
        因此会藏身于漂在海里的
        碎藻中，骗过敌人的眼睛。
      en: |-
        Skrelp looks like a piece of rotten seaweed, so it
        can blend in with seaweed drifting on the ocean
        and avoid being detected by enemies.
      fr: |-
        Ressembler à une algue en décomposition lui
        permet d’échapper à ses ennemis en se cachant
        au milieu des résidus de plantes aquatiques.
      de: |-
        Da es wie verfaulter Seetang aussieht, versteckt
        es sich zwischen den im Meer treibenden Algen,
        um sich den Blicken seiner Feinde zu entziehen.
      es: |-
        Su aspecto de alga podrida le permite ocultarse
        entre los restos que flotan a la deriva y pasar
        desapercibido ante sus enemigos.
      it: |-
        Il suo aspetto simile a quello di alghe fluttuanti
        in decomposizione gli permette di mimetizzarsi
        per sfuggire allo sguardo del nemico.
