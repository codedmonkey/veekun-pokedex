  flavor_text:
    ultra-sun:
      ja-Hrkt: |-
        クネクネうごいて　ひとに　ちかづくと
        とつぜん　あたまを　ばくはつさせた。
        ウルトラビーストの　いっしゅらしい。
      ja: |-
        クネクネ動いて　人に　近付くと
        突然　頭を　爆発させた。
        ウルトラビーストの　一種らしい。
      ko: |-
        꿈틀거리며 사람에게 다가오다
        느닷없이 머리를 폭발시킨다.
        울트라비스트의 일종인 듯하다.
      zh-Hant: |-
        會扭動著身體靠近人，
        然後突然讓頭爆炸。
        似乎是究極異獸的一種。
      zh-Hans: |-
        扭啊扭地移动着，
        靠近人后会突然让头爆炸。
        好像是究极异兽中的一种。
      en: |-
        It slithers toward people. Then, without warning,
        it triggers the explosion of its own head.
        It’s apparently one kind of Ultra Beast.
      fr: |-
        Il s’approche des gens avec son allure
        désarticulée et fait subitement exploser
        sa tête. Ce serait une Ultra-Chimère.
      de: |-
        Dieses Wesen ist vermutlich eine Ultrabestie.
        Es nähert sich Menschen tänzelnd, nur um dann
        plötzlich seinen Kopf explodieren zu lassen.
      es: |-
        Parece ser uno de los temibles Ultraentes.
        Se acerca a la gente contoneándose y hace
        explotar su propia cabeza súbitamente.
      it: |-
        Sembra che sia un’Ultracreatura. Si avvicina
        alle persone ondeggiando e fa esplodere la
        sua testa all’improvviso.
    ultra-moon:
      ja-Hrkt: |-
        ウルトラホールから　あらわれたＵＢ。
        ばくはつで　あいてを　おどろかし
        そのすきに　せいきを　うばっていた。
      ja: |-
        ウルトラホールから　現れた　ＵＢ。
        爆発で　相手を　驚かし
        その隙に　生気を　奪っていた。
      ko: |-
        울트라홀에서 나타난 UB.
        폭발로 상대를 놀라게 하고
        그 틈에 생기를 빼앗는다.
      zh-Hant: |-
        從究極之洞中出現的究極異獸。
        會用爆炸嚇唬對手，
        然後趁機奪取對方的精氣。
      zh-Hans: |-
        从究极之洞里出现的究极异兽。
        用爆炸吓唬对手，
        趁那空当夺走对方的生命气息。
      en: |-
        A UB that appeared from an Ultra Wormhole, it
        causes explosions, then takes advantage of
        opponents’ surprise to rob them of their vitality.
      fr: |-
        Cette Ultra-Chimère sortie d’une Ultra-Brèche
        provoque des explosions pour surprendre
        l’ennemi et en profite pour voler son énergie.
      de: |-
        Eine Ultrabestie, die durch eine Ultrapforte kam.
        Sie erschreckt ihre Gegner mit Explosionen
        und raubt ihnen dann ihre Lebenskraft.
      es: |-
        Un Ultraente surgido de un Ultraumbral. Crea
        una explosión para sorprender al oponente y
        aprovecha para absorber su energía vital.
      it: |-
        Ultracreatura arrivata attraverso un Ultravarco.
        Sorprende le prede con un’esplosione e ne
        approfitta per sottrarre la loro energia vitale.
