baltoy:
  base_happiness: 50
  capture_rate: 255
  color: brown
  egg_groups:
    - mineral
  evolution_chain: baltoy
  evolves_from: ~
  flavor_text:
    ruby:
      en: |-
        BALTOY moves while spinning around on
        its one foot. Primitive wall paintings
        depicting this POKéMON living amongpeople were discovered in some ancient
        ruins.
    sapphire:
      en: |-
        As soon as it spots others of its kind,
        BALTOY congregates with them and
        then begins crying noisily in unison.This POKéMON sleeps while cleverly
        balancing itself on its one foot.
    emerald:
      en: |-
        A BALTOY moves by spinning on its single
        foot. It has been depicted in murals 
        adorning the walls of a once-bustling city
        in an ancient age.
    firered:
      en: |-
        It was discovered in ancient ruins.
        While moving, it constantly spins. It
        stands on one foot even when asleep.
    leafgreen:
      en: |-
        It was discovered in ancient ruins.
        While moving, it constantly spins. It
        stands on one foot even when asleep.
    diamond:
      en: |-
        It moves by spinning on its foot.
        It is a rare Pokémon that was
        discovered in ancient ruins.
    pearl:
      en: |-
        It moves by spinning on its foot.
        It is a rare Pokémon that was
        discovered in ancient ruins.
    platinum:
      en: |-
        It moves by spinning on its foot.
        It is a rare Pokémon that was
        discovered in ancient ruins.
    heartgold:
      en: |-
        It moves while spinning around on
        its single foot. Some BALTOY have
        been seen spinning on their heads.
    soulsilver:
      en: |-
        It moves while spinning around on
        its single foot. Some BALTOY have
        been seen spinning on their heads.
    black:
      en: |-
        It moves by spinning on its foot.
        It is a rare Pokémon that was
        discovered in ancient ruins.
      fr: |-
        Il se déplace en tournoyant sur
        son pied. Ce Pokémon rare fut
        découvert dans de vieilles ruines.
    white:
      en: |-
        It moves by spinning on its foot.
        It is a rare Pokémon that was
        discovered in ancient ruins.
      fr: |-
        Il se déplace en tournoyant sur
        son pied. Ce Pokémon rare fut
        découvert dans de vieilles ruines.
    black-2:
      en: |-
        Discovered in ancient ruins, it moves
        by spinning around and forms a group
        when it finds others.
    white-2:
      en: |-
        Discovered in ancient ruins, it moves
        by spinning around and forms a group
        when it finds others.
    x:
      ja-Hrkt: |-
        いっぽんあしで　かいてん　しながら
        いどうする。さかさまに　なって
        かいてんする　ヤジロンも　みかける。
      ja: |-
        一本足で　回転しながら　移動する。
        逆さまに　なって
        回転する　ヤジロンも　見かける。
      ko: |-
        한 다리로 회전하면서
        이동한다. 거꾸로
        회전하는 오뚝군도 발견된다.
      en: |-
        It moves while spinning around on its single foot.
        Some Baltoy have been seen spinning on
        their heads.
      fr: |-
        Il se déplace en tournoyant sur son pied. Même mis
        sur la tête, il peut continuer à tourner.
      de: |-
        Es bewegt sich, indem es auf seinem Fuß kreiselt.
        Vereinzelt sieht man Puppance, die kopfüber kreiseln.
      es: |-
        Se mueve girando sobre su eje. También se le puede
        ver girando cabeza abajo.
      it: |-
        Si sposta piroettando sull’unica estremità inferiore
        del proprio corpo. Molti fanno la verticale.
    'y':
      ja-Hrkt: |-
        いっぽんあしで　かいてんしながら
        いどうする。こだいの　いせきから
        みつかった　めずらしい　ポケモン。
      ja: |-
        一本足で　回転しながら　移動する。
        古代の　遺跡から　見つかった
        珍しい　ポケモン。
      ko: |-
        한 다리로 회전하면서
        이동한다. 고대 유적에서
        발견된 희귀한 포켓몬이다.
      en: |-
        It moves by spinning on its foot. It is a rare
        Pokémon that was discovered in ancient ruins.
      fr: |-
        Il se déplace en tournoyant sur son pied. Ce Pokémon
        rare fut découvert dans de vieilles ruines.
      de: |-
        Es bewegt sich, indem es sich auf seinem Fuß dreht.
        Ein seltenes Pokémon, das in alten Ruinen lebte.
      es: |-
        Se mueve girando sobre su eje. Es un extraño
        Pokémon que fue encontrado en unas viejas ruinas.
      it: |-
        Pokémon raro che si muove roteando su se stesso.
        È stato scoperto nei pressi di antiche rovine.
    omega-ruby:
      ja-Hrkt: |-
        いっぽんあしで　かいてん　しながら　いどうする。
        ヤジロンと　にんげんが　いっしょに　くらす
        こだいの　へきがが　いせきから　はっけんされた。
      ja: |-
        一本足で　回転　しながら　移動する。
        ヤジロンと　人間が　一緒に　暮らす
        古代の　壁画が　遺跡から　発見された。
      ko: |-
        외다리로 회전하며 이동한다.
        오뚝군과 인간이 함께 사는
        고대 벽화가 유적에서 발견됐다.
      en: |-
        Baltoy moves while spinning around on its one foot. Primitive
        wall paintings depicting this Pokémon living among people
        were discovered in some ancient ruins.
      fr: |-
        Balbuto se déplace en pivotant sur son unique pied.
        Des peintures rupestres montrant ce Pokémon vivant
        avec les hommes furent découvertes dans des ruines
        très anciennes.
      de: |-
        Puppance bewegt sich, indem es sich auf seinem Fuß im Kreis
        dreht. In sehr alten Ruinen wurden primitive Wandmalereien
        entdeckt, die dieses Pokémon in Begleitung von Menschen
        zeigen.
      es: |-
        Baltoy se mueve girando alrededor de sí mismo sobre la
        extremidad inferior que tiene. En unas ruinas antiguas,
        descubrieron pinturas rupestres en las que aparecía este
        Pokémon conviviendo con personas.
      it: |-
        Baltoy si muove piroettando sull’unica estremità inferiore
        del proprio corpo. La scoperta di alcune rovine antiche
        ha portato alla luce dipinti di questo Pokémon che viveva
        a stretto contatto con gli esseri umani.
    alpha-sapphire:
      ja-Hrkt: |-
        なかまを　みつけると　すぐに　あつまって　きて
        いっせいに　なきごえを　あげるので　うるさい。
        いっぽんあしで　きように　たったまま　ねむる。
      ja: |-
        仲間を　見つけると　すぐに　集まって　きて
        一斉に　鳴き声を　あげるので　うるさい。
        一本足で　器用に　立ったまま　眠る。
      ko: |-
        동료를 발견하면 바로 모여들어
        일제히 울음소리를 내기 때문에 시끄럽다.
        외다리로 능숙하게 선 채로 잔다.
      en: |-
        As soon as it spots others of its kind, Baltoy congregates with
        them and then begins crying noisily in unison. This Pokémon
        sleeps while cleverly balancing itself on its one foot.
      fr: |-
        Dès qu’il repère ses congénères, Balbuto les rejoint et
        ils se mettent tous à crier en chœur. Ce Pokémon arrive
        à dormir en restant adroitement en équilibre.
      de: |-
        Sobald es Artgenossen bemerkt, tut sich Puppance mit ihnen
        zusammen und sie brüllen gemeinsam. Dieses Pokémon
        schläft, während es geschickt auf seinem Fuß balanciert.
      es: |-
        Al ver a más de los suyos, Baltoy se une al grupo y todos se
        ponen a chillar escandalosamente y al unísono. Este Pokémon
        duerme manteniendo hábilmente el equilibrio sobre la
        extremidad inferior que tiene.
      it: |-
        Appena incontra i propri simili, Baltoy forma un gruppo molto
        rumoroso. Questo Pokémon dorme bilanciandosi con maestria
        sull’unica estremità inferiore del proprio corpo.
    ultra-sun:
      ja-Hrkt: |-
        げんしじんが　すんでいた　ほらあなの
        かべに　ヤジロンらしき　ポケモンの
        すがたが　えがかれていた。
      ja: |-
        原始人が　住んでいた　洞穴の
        壁に　ヤジロンらしき　ポケモンの
        姿が　描かれていた。
      ko: |-
        원시인이 살았던 동굴 벽에
        오뚝군으로 추정되는
        포켓몬의 모습이 그려져 있다.
      zh-Hant: |-
        在原始人居住的洞穴裡，
        可以看見牆壁上畫著
        像是天秤偶的寶可夢。
      zh-Hans: |-
        在原始人所居住的洞穴墙壁上，
        描绘着像是天秤偶的宝可梦的样子。
      en: |-
        Depictions of Pokémon similar to Baltoy have
        been found on the walls of caves where
        primitive humans lived.
      fr: |-
        Des esquisses de Pokémon ressemblant à des
        Balbuto ont été retrouvées dans des grottes
        jadis habitées par des hommes préhistoriques.
      de: |-
        In Höhlen, in denen Urmenschen lebten, gibt es
        Wandmalereien von einem Pokémon, das wie
        Puppance aussieht.
      es: |-
        Los humanos de tiempos primitivos solían pintar
        en las cuevas donde habitaban siluetas muy
        parecidas a las de Baltoy.
      it: |-
        Nelle pareti delle grotte in cui vivevano gli uomini
        primitivi sono state trovate raffigurazioni di
        Pokémon simili ai Baltoy.
    ultra-moon:
      ja-Hrkt: |-
        なかまを　みつけると　やかましく
        なきわめき　あつまる。　おおむかしの
        ぼちから　たいりょうに　みつかる。
      ja: |-
        仲間を　見つけると　やかましく
        鳴きわめき　集まる。　大昔の
        墓地から　大量に　見つかる。
      ko: |-
        동료를 발견하면 시끄럽게
        울부짖으며 모인다. 오래된
        묘지에서 대량으로 발견된다.
      zh-Hant: |-
        只要發現夥伴就會發出
        吵雜的叫聲聚集起來。
        會大量出沒在古代的墳場裡。
      zh-Hans: |-
        如果发现了伙伴，
        就会吵吵闹闹地叫唤着聚集。
        会大量出现在古代的墓地里。
      en: |-
        When they find others of their kind, they cry
        out loudly and gather together. Large numbers
        of them can be found in old graveyards.
      fr: |-
        Quand il aperçoit des congénères, il les rejoint
        en émettant des sons stridents. On en a trouvé
        beaucoup dans de très vieux cimetières.
      de: |-
        Wenn sie Artgenossen entdecken, versammeln
        sie sich und brüllen gemeinsam. Sie wurden
        zuhauf in alten Grabstätten gefunden.
      es: |-
        Al ver a más de los suyos, se juntan y emiten
        unos chillidos estridentes. Su presencia solía ser
        numerosa en cementerios de gran antigüedad.
      it: |-
        Quando incontra i propri simili si unisce a loro
        formando un gruppo molto chiassoso. Ne sono
        stati trovati in gran numero in antichi cimiteri.
    sword:
      ja-Hrkt: |-
        いっぽんあしで　かいてん　しながら
        いどうする。　さかさまに　なって
        かいてんする　ヤジロンも　みかける。
      ja: |-
        一本足で　回転しながら　移動する。
        逆さまに　なって
        回転する　ヤジロンも　見かける。
      ko: |-
        한 다리로 회전하면서
        이동한다. 거꾸로
        회전하는 오뚝군도 발견된다.
      zh-Hant: |-
        用單腳一邊旋轉一邊移動。
        有時候也能看到
        顛倒過來旋轉的天秤偶。
      zh-Hans: |-
        会用单脚旋转着移动。
        也能看到颠倒过来旋转的天秤偶。
      en: |-
        It moves while spinning around on its single foot.
        Some Baltoy have been seen spinning on
        their heads.
      fr: |-
        Il se déplace en tournoyant sur son pied.
        On le voit parfois faire de même sur la tête.
      de: |-
        Es bewegt sich, indem es auf seinem Fuß kreiselt.
        Vereinzelt sieht man auch Puppance, die dies
        kopfüber tun.
      es: |-
        Se mueve girando una única extremidad. Se han
        avistado algunos ejemplares capaces de hacerlo
        cabeza abajo.
      it: |-
        Si sposta piroettando sull’estremità inferiore
        del proprio corpo. Alcuni Baltoy sono stati visti
        piroettare a testa in giù.
    shield:
      ja-Hrkt: |-
        こだい　いせきで　はっけんされた。
        かいてん　しながら　いどう。　よる
        ねむる　ときも　いっぽんあしだ。
      ja: |-
        古代　遺跡で　発見された。
        回転　しながら　移動。　夜
        眠る　ときも　一本足だ。
      ko: |-
        고대 유적에서 발견되었다.
        회전하면서 이동한다.
        밤에 잘 때도 다리 하나로 서 있다.
      zh-Hant: |-
        在古代遺跡被發現。
        會一邊旋轉一邊移動。
        晚上睡覺的時候也是單腳站著。
      zh-Hans: |-
        在古代遗迹被发现。
        会一边旋转一边移动。
        晚上睡觉的时候也是单脚站着。
      en: |-
        It was discovered in ancient ruins. While moving,
        it constantly spins. It stands on one foot even
        when asleep.
      fr: |-
        Ce Pokémon découvert dans des ruines anciennes
        tourne sur lui-même pour se déplacer. Il se tient
        toujours sur un pied, même quand il dort.
      de: |-
        Es wurde in antiken Ruinen entdeckt. Wenn es
        sich bewegt, dreht es sich. Auch im Schlaf steht
        es auf einem Bein.
      es: |-
        Fue hallado en unas ruinas antiguas. Se desplaza
        girando sobre sí mismo y se mantiene sobre una
        extremidad incluso cuando duerme.
      it: |-
        Scoperto in antiche rovine. Si sposta girando
        su se stesso e rimane bilanciato sull’estremità
        inferiore del suo corpo anche quando dorme.
