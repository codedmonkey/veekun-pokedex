raichu:
  base_happiness: 50
  capture_rate: 75
  color: yellow
  egg_groups:
    - ground
    - fairy
  evolution_chain: pikachu
  evolves_from: pikachu
  flavor_text:
    red:
      en: |-
        Its long tail
        serves as a
        ground to protectitself from its
        own high voltage
        power.
    blue:
      en: |-
        Its long tail
        serves as a
        ground to protectitself from its
        own high voltage
        power.
    yellow:
      en: |-
        When electricity
        builds up inside
        its body, itbecomes feisty.
        It also glows in
        the dark.
    gold:
      en: |-
        When its electric­
        ity builds, its
        muscles are stimu­lated, and it be­
        comes more aggres­
        sive than usual.
    silver:
      en: |-
        If the electric
        pouches in its
        cheeks becomefully charged,
        both ears will
        stand straight up.
    crystal:
      en: |-
        If its electric
        pouches run empty,
        it raises its tailto gather electri­
        city from the
        atmosphere.
    ruby:
      en: |-
        If the electrical sacks become
        excessively charged, RAICHU plants its
        tail in the ground and discharges.Scorched patches of ground will be
        found near this POKéMON’s nest.
    sapphire:
      en: |-
        This POKéMON exudes a weak electrical
        charge from all over its body that makes
        it take on a slight glow in darkness.RAICHU searches for electricity by
        planting its tail in the ground.
    emerald:
      en: |-
        If it stores too much electricity, its
        behavior turns aggressive. To avoid this,
        it occasionally discharges excess energy
        and calms itself down.
    firered:
      en: |-
        Its electric charges can reach even
        100,000 volts. Careless contact can cause
        even an Indian elephant to faint.
    leafgreen:
      en: |-
        Its long tail serves as a ground to
        protect itself from its own high-voltage
        power.
    diamond:
      en: |-
        It turns aggressive if it has too
        much electricity in its body. It
        discharges power through its tail.
    pearl:
      en: |-
        It can loose 100,000-volt bursts
        of electricity, instantly downing
        foes several times its size.
    platinum:
      en: |-
        Its tail discharges electricity into
        the ground, protecting it from
        getting shocked.
    heartgold:
      en: |-
        When its electricity builds, its
        muscles are stimulated, and it becomes
        more aggressive than usual.
    soulsilver:
      en: |-
        If the electric pouches in its
        cheeks become fully charged,
        both ears will stand straight up.
    black:
      en: |-
        Its tail discharges electricity into
        the ground, protecting it from
        getting shocked.
      fr: |-
        Il se protège des décharges grâce
        à sa queue qui dissipe l’électricité
        dans le sol.
    white:
      en: |-
        Its tail discharges electricity into
        the ground, protecting it from
        getting shocked.
      fr: |-
        Il se protège des décharges grâce
        à sa queue qui dissipe l’électricité
        dans le sol.
    black-2:
      en: |-
        Its tail discharges electricity into
        the ground, protecting it from
        getting shocked.
    white-2:
      en: |-
        Its tail discharges electricity into
        the ground, protecting it from
        getting shocked.
    x:
      ja-Hrkt: |-
        でんきが　たまってくると
        きんにくが　しげきされ　いつもより
        こうげきてきに　なってしまう。
      ja: |-
        電気が　たまってくると
        筋肉が　刺激され
        いつもより　攻撃的に　なってしまう。
      ko: |-
        전기가 모이면
        근육이 자극되어 여느 때보다
        공격적이 된다.
      en: |-
        When its electricity builds, its muscles are stimulated,
        and it becomes more aggressive than usual.
      fr: |-
        Quand il se charge en électricité, ses muscles se
        contractent et il devient plus agressif.
      de: |-
        Wenn es sich auflädt, zucken seine Muskeln
        und es wird aggressiver und kampflustiger.
      es: |-
        Cuando se carga de electricidad, sus músculos se
        tensan y se vuelve más agresivo de lo normal.
      it: |-
        Se l’elettricità aumenta, i muscoli sono sollecitati
        e diventa più aggressivo del solito.
    'y':
      ja-Hrkt: |-
        でんげきは　１０まんボルト。
        じぶんの　なんばいも　おおきい
        あいてを　いちげきで　きぜつさせる。
      ja: |-
        電撃は　１０万ボルト。
        自分の　何倍も　大きい　相手を
        一撃で　気絶させる。
      ko: |-
        전기의 충격은 10만 볼트다.
        자신보다 몇 배나 큰 상대를
        일격에 기절시킨다.
      en: |-
        It can loose 100,000-volt bursts of electricity,
        instantly downing foes several times its size.
      fr: |-
        Il peut terrasser des ennemis bien plus imposants en
        libérant une décharge de 100 000 V.
      de: |-
        Es kann 100 000 V mit einem Schlag freisetzen
        und so viel größere Gegner besiegen.
      es: |-
        Puede emitir ráfagas de 100 000 voltios capaces de
        acabar con rivales enormes.
      it: |-
        Può rilasciare scariche elettriche a 100.000 volt
        con cui neutralizza nemici molto più grandi di lui.
    omega-ruby:
      ja-Hrkt: |-
        でんきぶくろに　でんきが　たまりすぎた　ときは
        しっぽを　じめんに　つけて　ほうでんする。
        す　の　ちかくには　じめんに　やけこげが　ある。
      ja: |-
        電気袋に　電気が　たまり過ぎた　ときは
        尻尾を　地面に　つけて　放電する。
        巣　の　近くには　地面に　焼け焦げが　ある。
      ko: |-
        전기 주머니에 전기가 넘칠 정도로 차면
        꼬리를 땅에 닿게 하여 방전한다.
        사는 곳 근처의 땅에는 탄 흔적이 있다.
      en: |-
        If the electrical sacs become excessively charged,
        Raichu plants its tail in the ground and discharges.
        Scorched patches of ground will be found near this
        Pokémon’s nest.
      fr: |-
        Si ses joues contiennent trop d’électricité, Raichu plante
        sa queue dans le sol pour se décharger. On trouve des
        parcelles de terre brûlée à proximité du nid de ce Pokémon.
      de: |-
        Wenn seine elektrische Ladung zu groß wird, entlädt Raichu
        seine Energie ins Erdreich. Neben dem Nest dieses Pokémon
        findet man häufig versengtes Erdreich.
      es: |-
        Si las bolsas de los mofletes se le cargan demasiado, Raichu
        planta la cola en el suelo para liberar electricidad. Es común
        encontrar zonas chamuscadas cerca de la madriguera de este
        Pokémon.
      it: |-
        Se l’elettricità accumulata nelle guance diventa eccessiva,
        Raichu la scarica piantando la coda nel terreno. Vicino al suo
        nido sono presenti spesso chiazze di erba arsa.
    alpha-sapphire:
      ja-Hrkt: |-
        よわい　でんきを　ぜんしんから　だしているので
        くらやみでは　うっすら　ひかって　みえるよ。
        シッポを　じめんに　さして　でんきを　にがす。
      ja: |-
        弱い　電気を　全身から　出しているので
        暗闇では　うっすら　光って　見えるよ。
        シッポを　地面に　刺して　電気を　逃がす。
      ko: |-
        약한 전기를 온몸에서 발산하고 있기 때문에
        어두운 곳에서는 희미하게 빛난다.
        꼬리를 땅에 박고 전기를 흘려보낸다.
      en: |-
        This Pokémon exudes a weak electrical charge from all over
        its body that makes it take on a slight glow in darkness.
        Raichu plants its tail in the ground to discharge electricity.
      fr: |-
        Ce Pokémon libère un faible champ électrique tout autour
        de son corps, ce qui le rend légèrement lumineux dans le noir.
        Raichu plante sa queue dans le sol pour évacuer de
        l’électricité.
      de: |-
        Dieses Pokémon gibt eine schwache elektrische Ladung ab.
        Dadurch glüht es bei Dunkelheit leicht. Raichu entlädt
        Elektrizität, indem es sein Hinterteil in den Boden gräbt.
      es: |-
        Este Pokémon libera una débil carga eléctrica por todo su
        cuerpo que le hace brillar en la oscuridad. Raichu descarga
        electricidad plantando la cola en el suelo.
      it: |-
        Raichu emana una debole carica elettrica da tutto il corpo
        rilucendo così nell’oscurità. Scarica l’elettricità piantando
        la coda nel terreno.
    sun:
      ja-Hrkt: |-
        でんげきは　１０まんボルトに
        たっすることもあり　ヘタにさわると
        インドぞうでも　きぜつする。
      ja: |-
        電撃は　１０万ボルトに
        達することもあり　ヘタに触ると
        インド象でも　気絶する。
      ko: |-
        전격은 10만볼트에
        이르기도 해서 잘못 만지면
        인도코끼리라도 기절한다.
      zh-Hant: |-
        電擊有時候會達到十萬伏特，
        不小心碰到的話，
        連印度象也會昏厥。
      zh-Hans: |-
        电击有时候会达到十万伏特，
        不小心碰到的话，
        连印度象也会昏厥。
      en: |-
        It unleashes electric shocks that can reach
        100,000 volts. When agitated, it can knock out
        even an Indian elephant.
      fr: |-
        Ce Pokémon peut accumuler jusqu’à
        100 000 volts. Il peut ainsi assommer
        un éléphant juste en le touchant.
      de: |-
        Seine elektrischen Ladungen erreichen bis zu
        100 000 V. Bei unvorsichtigem Kontakt wird
        sogar ein indischer Elefant bewusstlos.
      es: |-
        Suelta descargas eléctricas de hasta 100 000
        voltios, con lo que es capaz de derribar al mayor
        de los Pokémon.
      it: |-
        Le sue scariche elettriche, che raggiungono
        i 100.000 volt, potrebbero far svenire persino
        un elefante indiano.
    moon:
      ja-Hrkt: |-
        でんきが　たまると　きしょうが
        あらくなる。　トレーナーでも
        ちゅうい　しないと　おそわれる。
      ja: |-
        電気が　溜まると　気性が
        荒くなる。　トレーナーでも
        注意　しないと　襲われる。
      ko: |-
        전기가 모이면 성질이
        거칠어진다. 트레이너라도
        주의하지 않으면 공격당한다.
      zh-Hant: |-
        電力積聚的話，脾氣就會變壞。
        即使是訓練家，一不留神也會被襲擊。
      zh-Hans: |-
        电力积聚的话，脾气就会变坏。
        即便是训练家，一不留神也会被袭击。
      en: |-
        It becomes aggressive when it has electricity
        stored up. At such times, even its Trainer has to
        take care to avoid being attacked.
      fr: |-
        Il devient plus agressif au fur et à mesure qu’il
        accumule de l’électricité. Même son Dresseur
        doit faire attention à ne pas se faire attaquer.
      de: |-
        Wenn es sich elektrisch auflädt, steigt seine
        Aggressivität. Selbst sein Trainer läuft dann
        Gefahr, von ihm angegriffen zu werden.
      es: |-
        Se vuelve más agresivo cuando se carga de
        electricidad. Puede incluso llegar a atacar a su
        Entrenador si este no se anda con cuidado.
      it: |-
        Quando accumula elettricità, fatica a
        controllarsi. Perfino il suo Allenatore rischia
        di essere attaccato, se non fa attenzione.
    ultra-sun:
      ja-Hrkt: |-
        からだに　でんきが　たまるに　つれ
        こうげきてきに。　じつは　でんきが
        ストレスなのではという　せつもある。
      ja: |-
        身体に　電気が　たまるに　つれ
        攻撃的に。　実は　電気が
        ストレスなのでは　という　説もある。
      ko: |-
        몸에 전기가 쌓일수록 공격적으로
        변한다. 사실은 전기가
        스트레스라는 설도 있다.
      zh-Hant: |-
        隨著體內電力的累積，
        性情會變得具有攻擊性。
        也有人認為電力對牠其實是種壓力。
      zh-Hans: |-
        随着电力在体内的积聚，它会越发地
        具有攻击性。也有说法讲到
        其实电力就是它的压力。
      en: |-
        As electricity builds up inside its body, it
        becomes more aggressive. One theory is that
        the electricity buildup is actually causing stress.
      fr: |-
        Plus il est chargé en électricité, plus il se montre
        agressif. D’aucuns pensent que ce courant
        électrique le stresse.
      de: |-
        Je mehr es sich elektrisch auflädt, desto
        aggressiver wird es. Man vermutet, dass die
        Elektrizität den Stress verursache.
      es: |-
        Se vuelve más agresivo a medida que acumula
        electricidad. Hay quien afirma que esta le
        provoca estrés.
      it: |-
        Diventa più aggressivo con l’accumularsi di
        energia elettrica. Alcuni pensano che sia
        l’elettricità stessa a causargli stress.
    ultra-moon:
      ja-Hrkt: |-
        ピカチュウの　すがたが　すきな
        トレーナーも　おおく　なかなか
        すがたを　みかけない　ポケモン。
      ja: |-
        ピカチュウの　姿が　好きな
        トレーナーも　多く　なかなか
        姿を　見かけない　ポケモン。
      ko: |-
        피카츄의 모습을 좋아하는
        트레이너도 많아서 좀처럼
        모습을 보기 힘든 포켓몬이다.
      zh-Hant: |-
        許多訓練家比較喜歡
        皮卡丘的模樣，因而使得
        這種寶可夢相當少見。
      zh-Hans: |-
        因为有很多训练家喜欢
        它进化前的皮卡丘模样，
        所以这种宝可梦十分少见。
      en: |-
        Because so many Trainers like the way Pikachu
        looks, you don’t see this Pokémon very often.
      fr: |-
        Ce Pokémon est très rare, car la plupart
        des Dresseurs lui préfèrent Pikachu.
      de: |-
        Ein eher seltenes Pokémon, da viele Trainer
        Pikachu bevorzugen.
      es: |-
        Como la mayoría de Entrenadores prefiere a
        Pikachu, no se ven muchos ejemplares de este
        Pokémon.
      it: |-
        Molti Allenatori gli preferiscono Pikachu e per
        questo non lo si vede spesso in giro.
    lets-go-pikachu:
      ja-Hrkt: |-
        からだに　でんきが　たまってくると
        こうげきてきな　せいかくにかわる。
        くらいところで　ひかってみえる。
      ja: |-
        体に　電気が　たまってくると
        攻撃的な　性格に　変わる。
        暗いところで　光って　見える。
      ko: |-
        몸에 전기가 모이면
        공격적인 성격으로 변한다.
        어두운 곳에서 빛나 보인다.
      zh-Hant: |-
        體內的電力累積到一定程度時，
        性情會變得帶有攻擊性。
        在昏暗處看起來就像是在發亮。
      zh-Hans: |-
        体内的电力累积到一定程度时，
        性格会变得带有攻击性。
        在昏暗处看起来就像是在发亮。
      en: |-
        When electricity builds up inside its body, it
        becomes feisty. It also glows in the dark.
      fr: |-
        Il devient agressif quand il emmagasine
        de l’électricité. Il brille alors dans le noir.
      de: |-
        Wenn sich in seinem Körper Elektrizität anstaut,
        wird es aggressiv. Man kann es auch im Dunkeln
        leuchten sehen.
      es: |-
        Al acumular cierta cantidad de electricidad en
        el cuerpo, se vuelve agresivo. También brilla en
        la oscuridad.
      it: |-
        Quando accumula elettricità nel suo corpo,
        si fa aggressivo. Al buio brilla di luce propria.
    lets-go-eevee:
      ja-Hrkt: |-
        からだに　でんきが　たまってくると
        こうげきてきな　せいかくにかわる。
        くらいところで　ひかってみえる。
      ja: |-
        体に　電気が　たまってくると
        攻撃的な　性格に　変わる。
        暗いところで　光って　見える。
      ko: |-
        몸에 전기가 모이면
        공격적인 성격으로 변한다.
        어두운 곳에서 빛나 보인다.
      zh-Hant: |-
        體內的電力累積到一定程度時，
        性情會變得帶有攻擊性。
        在昏暗處看起來就像是在發亮。
      zh-Hans: |-
        体内的电力累积到一定程度时，
        性格会变得带有攻击性。
        在昏暗处看起来就像是在发亮。
      en: |-
        When electricity builds up inside its body, it
        becomes feisty. It also glows in the dark.
      fr: |-
        Il devient agressif quand il emmagasine
        de l’électricité. Il brille alors dans le noir.
      de: |-
        Wenn sich in seinem Körper Elektrizität anstaut,
        wird es aggressiv. Man kann es auch im Dunkeln
        leuchten sehen.
      es: |-
        Al acumular cierta cantidad de electricidad en
        el cuerpo, se vuelve agresivo. También brilla en
        la oscuridad.
      it: |-
        Quando accumula elettricità nel suo corpo,
        si fa aggressivo. Al buio brilla di luce propria.
    sword:
      ja-Hrkt: |-
        ながい　しっぽが　アースになって
        みを　まもるため　じぶんじしんは
        こうでんあつにも　しびれないのだ。
      ja: |-
        長い　しっぽが　アースになって
        身を　守るため　自分自身は
        高電圧にも　痺れないのだ。
      ko: |-
        긴 꼬리가 어스가 되어
        몸을 지키기 때문에 자신은
        고전압에도 마비되지 않는다.
      zh-Hant: |-
        長長的尾巴能夠像接地線
        一樣保護自己，因此即使
        是高壓電也不會讓牠麻痺。
      zh-Hans: |-
        长长的尾巴能够像接地线
        一样保护自己，因此即使
        是高压电也不会让它麻痹。
      en: |-
        Its long tail serves as a ground to protect itself
        from its own high-voltage power.
      fr: |-
        Sa longue queue agit comme une prise de terre
        qui l’empêche d’être affecté par le courant
        à haute tension accumulé dans son corps.
      de: |-
        Sein langer Schweif dient ihm zur Erdung.
        So bleibt es von der lähmenden Wirkung von
        Hochspannung selbst verschont.
      es: |-
        Su larga cola le sirve como toma de tierra para
        protegerse a sí mismo del alto voltaje que genera
        su cuerpo.
      it: |-
        La sua lunga coda serve da messa a terra per
        proteggerlo dalla sua stessa alta tensione.
    shield:
      ja-Hrkt: |-
        でんきぶくろが　からっぽに　なると
        しっぽを　まっすぐ　たてて
        くうきちゅうの　でんきを　あつめる。
      ja: |-
        電気袋が　空っぽに　なると
        しっぽを　まっすぐ　立てて
        空気中の　電気を　集める。
      ko: |-
        전기 주머니가 텅 비면
        꼬리를 똑바로 세워서
        공기 중의 전기를 모은다.
      zh-Hant: |-
        如果電囊空了，
        牠就會直直地豎起尾巴，
        收集空氣中的電流。
      zh-Hans: |-
        如果电囊空了，
        它就会直直地竖起尾巴，
        收集空气中的电流。
      en: |-
        If its electric pouches run empty, it raises its tail
        to gather electricity from the atmosphere.
      fr: |-
        Si ses joues sont à court d’énergie, il lève la queue
        et capte l’électricité contenue dans l’atmosphère.
      de: |-
        Wenn der in seinen Backentaschen gespeicherte
        Strom leer ist, stellt es seinen Schweif auf, um
        Elektrizität aus der Luft zu ziehen.
      es: |-
        Cuando ha descargado las bolsas de las mejillas,
        levanta la cola y absorbe la carga eléctrica que
        hay en el ambiente.
      it: |-
        Quando le sacche elettriche sono scariche,
        rizza la coda per raccogliere elettricità
        dall’atmosfera.
