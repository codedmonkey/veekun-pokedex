        ice age. It controls frigid air of
        -328 degrees Fahrenheit.
    white-2:
      en: |-
        Its body is made of ice from the
        ice age. It controls frigid air of
        -328 degrees Fahrenheit.
    x:
      ja-Hrkt: |-
        ひょうがの　なかで　すうせんねん
        ねむっていたと　いわれている。
        マグマでも　からだは　とけない。
      ja: |-
        氷河の　中で　数千年
        眠っていたと　言われている。
        マグマでも　体は　溶けない。
      ko: |-
        빙하 안에서 몇천 년이나
        잠들어 있었다고 전해진다.
        마그마로도 몸이 녹지 않는다.
      en: |-
        It is said to have slept in a glacier for thousands of
        years. Its body can’t be melted, even by magma.
      fr: |-
        Il reposait dans un glacier depuis des milliers
        d’années. Même le magma ne peut pas le faire fondre.
      de: |-
        Es heißt, es habe Jahrtausende lang im ewigen Eis
        geschlummert. Selbst Magma schmilzt es nicht.
      es: |-
        Dicen que ha yacido durmiendo en un glaciar durante
        milenios. Ni el magma puede derretir su cuerpo.
      it: |-
        Si dice che sia rimasto a dormire nei ghiacci per
        alcuni millenni. Nemmeno il magma riuscirebbe
        a scioglierlo.
    'y':
      ja-Hrkt: |-
        ひょうがきに　できた　こおりで
        からだが　つくられている。マイナス
        ２００どの　れいきを　あやつる。
      ja: |-
        氷河期に　できた　氷で
        体が　作られている。
        マイナス２００度の　冷気を　操る。
      ko: |-
        빙하기에 생겨난 얼음으로
        몸이 만들어져 있다. 마이너스
        200도의 냉기를 다룬다.
      en: |-
        Its body is made of ice from the ice age. It controls
        frigid air of -328 degrees Fahrenheit.
      fr: |-
        Son corps est fait de glace datant de l’ère glaciaire.
        Il contrôle un air gelé de -200 °C.
      de: |-
        Sein Körper besteht aus Eis aus der Eiszeit.
        Es kontrolliert gefrorene Luft, die -200 °C kalt ist.
      es: |-
        Su cuerpo está hecho con hielo de la glaciación.
        Controla aire gélido a -200 °C.
      it: |-
        Il suo corpo è costituito da ghiaccio dell’era glaciale.
        Mantiene l’aria a una temperatura di -200 °C.
    omega-ruby:
      ja-Hrkt: |-
        ひょうがじだいに　つくられた　こおりの　からだは
        ほのおでも　とかす　ことが　できない。
        マイナス　２００どの　れいきを　あやつる。
      ja: |-
        氷河時代に　つくられた　氷の　体は
        炎でも　溶かす　ことが　できない。
        マイナス　２００度の　冷気を　操る。
      ko: |-
        빙하시대에 만들어진 얼음으로 된 몸은
        불꽃으로도 녹일 수가 없다.
        영하 200도의 냉기를 다룬다.
      en: |-
        Regice’s body was made during an ice age. The deep-frozen
        body can’t be melted, even by fire. This Pokémon controls
        frigid air of -328 degrees Fahrenheit.
      fr: |-
        Le corps de Regice fut créé pendant l’ère glaciaire.
        Son corps est tellement gelé qu’il ne peut pas fondre,
        même en le brûlant. Ce Pokémon peut contrôler l’air glacé
        jusqu’à une température de -200 °C.
      de: |-
        Regices tiefgefrorener Körper entstand während der Eiszeit.
        Es kann nicht einmal durch Feuer geschmolzen werden.
        Dieses Pokémon kontrolliert eisige Luft von -200 °C.
      es: |-
        Regice surgió durante la edad de hielo. El cuerpo de este
        Pokémon está totalmente congelado, ni siquiera el fuego
        puede derretirlo. Regice libera y regula un aire gélido de
        -200 °C.
      it: |-
        Il corpo di Regice è stato creato durante l’era glaciale.
        Il corpo congelato non può essere fuso neanche col fuoco.
        Questo Pokémon riesce a gestire perfettamente l’aria gelida
        a -200 °C.
    alpha-sapphire:
      ja-Hrkt: |-
        マイナス２００どの　れいきが　からだを　つつむ。
        ちかづいた　だけでも　こおりついて　しまうぞ。
        マグマでも　とけない　こおりの　からだを　もつ。
      ja: |-
        マイナス２００度の　冷気が　体を　包む。
        近づいた　だけでも　凍りついて　しまうぞ。
        マグマでも　溶けない　氷の　体を　持つ。
      ko: |-
        영하 200도의 냉기가 몸을 감쌌다.
        가까이 다가가기만 해도 얼어붙는다.
        마그마에도 녹지 않는 얼음으로 된 몸을 지녔다.
      en: |-
        Regice cloaks itself with frigid air of -328 degrees Fahrenheit.
        Things will freeze solid just by going near this Pokémon.
        Its icy body is so cold, it will not melt even if it is immersed
        in magma.
      fr: |-
        Regice se recouvre d’air glacé à -200 °C. Tout ce qui passe
        à proximité de ce Pokémon gèle sur place. Son corps est si
        froid qu’il ne fond jamais, même s’il plonge dans du magma.
      de: |-
        Regice umhüllt sich selbst mit kalter Luft von -200 °C.
        Alles und jeder, der sich diesem Pokémon nähert, friert
        sofort ein. Sein eisiger Körper ist so kalt, dass nicht einmal
        Magma es schmelzen könnte.
      es: |-
        Regice se rodea de un aire gélido que llega a -200 °C y deja
        congelado a todo lo que se le acerca. Es imposible derretir a
        este Pokémon; tiene una temperatura demasiado baja.
      it: |-
        Regice si avvolge in un manto d’aria alla temperatura
        di -200 °C. Ogni cosa che si avvicina a questo Pokémon
        si congela all’istante. Il suo corpo gelido non si fonde
        nemmeno se immerso nel magma.
    sword:
      ja-Hrkt: |-
        マイナス２００どまで　ひえこむ
        れいきを　あやつり　ちかづいたものを
        あっというまに　こおりづけにする。
      ja: |-
        マイナス２００度まで　冷えこむ
        冷気を　操り　近づいたものを
        あっという間に　氷漬けにする。
      ko: |-
        영하 200도까지 내려가는
        냉기를 조종해 다가오는 자를
        순식간에 얼려버린다.
      zh-Hant: |-
        能操控降至零下２００度
        的寒氣，將靠近牠的東西
        都在一瞬間就冰封起來。
      zh-Hans: |-
        会操控冰冷至零下２００度
        的冷气，将接近自己的
        家伙一下子冰镇起来。
      en: |-
        With cold air that can reach temperatures as low
        as −328 degrees Fahrenheit, Regice instantly
        freezes any creature that approaches it.
      fr: |-
        Regice gèle quiconque s’approche de lui
        en un instant avec de l’air glacé pouvant
        atteindre -200 °C.
      de: |-
        Regice kontrolliert bis zu -200 ºC kalte Luft,
        mit der es alles und jeden in seiner Nähe im
        Handumdrehen gefrieren lässt.
      es: |-
        Usa corrientes de aire gélido de hasta -200 ºC
        para congelar en un instante a cualquiera que se
        le acerque.
      it: |-
        Utilizza aria gelida fino a -200 ºC per congelare
        all’istante chiunque gli si avvicini.
    shield:
      ja-Hrkt: |-
        ぜんしんが　こおりで　できている。
        ひょうがじだいに　ぶあつい　こおりの
        したで　うまれたと　いわれている。
      ja: |-
        全身が　氷で　できている。
        氷河時代に　ぶ厚い　氷の　下で
        生まれたと　いわれている。
      ko: |-
        전신이 얼음으로 되어 있다.
        빙하 시대에 두꺼운 얼음
        아래에서 태어났다고 전해진다.
      zh-Hant: |-
        全身都是由冰塊構成。
        據說牠是在冰河時期
        誕生在厚實的冰層下。
      zh-Hans: |-
        拥有一副由冰构成的身体。
        据说是诞生于冰河时期
        冻得厚厚实实的冰块之下。
      en: |-
        This Pokémon’s body is made of solid ice. It’s
        said that Regice was born beneath thick ice in
        the ice age.
      fr: |-
        Ce Pokémon de l’ère glaciaire dont le corps
        est entièrement composé d’eau gelée serait
        né sous une épaisse couche de glace.
      de: |-
        Sein gesamter Körper besteht aus Eis. Man sagt,
        es wurde während der Eiszeit unter einer dicken
        Eisschicht geboren.
      es: |-
        Todo su cuerpo está compuesto de hielo.
        Se dice que surgió bajo una gruesa placa
        de hielo durante alguna glaciación.
      it: |-
        Il suo corpo è interamente costituito da ghiaccio.
        Si narra che nacque sotto un massiccio strato
        di ghiaccio durante l’era glaciale.
