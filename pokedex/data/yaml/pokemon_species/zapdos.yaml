    sword:
      ja-Hrkt: |-
        でんきを　じざいに　あやつる。
        まっくろな　かみなりぐもの　なかに
        すが　あると　いいつたえられている。
      ja: |-
        電気を　自在に　操る。
        真っ黒な　雷雲の　中に
        巣があると　言い伝えられている。
      ko: |-
        전기를 자유로이 조종한다.
        새까만 번개 구름 안에
        거처가 있다고 전해지고 있다.
      zh-Hant: |-
        能夠自在地操縱雷電。
        相傳牠的巢穴就在
        烏黑的雷雲之中。
      zh-Hans: |-
        能够随心所欲地操纵雷电。
        据传说，它的巢穴
        处在漆黑的雷云中。
      en: |-
        This Pokémon has complete control over
        electricity. There are tales of Zapdos nesting in
        the dark depths of pitch-black thunderclouds.
      fr: |-
        On dit que ce Pokémon capable de contrôler
        la foudre installe son nid au creux des nuages
        d’orage noirs.
      de: |-
        Zapdos kann Elektrizität manipulieren.
        Überlieferungen nach soll sein Nest inmitten
        pechschwarzer Gewitterwolken liegen.
      es: |-
        Posee el poder de controlar la electricidad a su
        antojo. Según la creencia popular, anida oculto
        en oscuros nubarrones de tormenta.
      it: |-
        È in grado di controllare l’elettricità a suo
        piacimento. Secondo le leggende,
        fa il nido fra nere nubi temporalesche.
    shield:
      ja-Hrkt: |-
        はねを　こすりあわせると　たちまち
        いかずちが　おちると　いわれている
        でんせつの　とりポケモン。
      ja: |-
        羽根を　こすり合わせると　たちまち
        雷が　落ちると　言われている
        伝説の　鳥ポケモン。
      ko: |-
        날개를 비비대면 바로
        천둥이 친다고 전해지는
        전설의 새포켓몬이다.
      zh-Hant: |-
        傳說的鳥寶可夢。
        據說只要牠磨蹭翅膀，
        立刻就會有雷電劈下。
      zh-Hans: |-
        传说的鸟宝可梦。
        据说只要它一摩擦翅膀，
        就会立刻发生落雷。
      en: |-
        Zapdos is a legendary bird Pokémon. It’s said
        that when Zapdos rubs its feathers together,
        lightning will fall immediately after.
      fr: |-
        On raconte que lorsque ce Pokémon oiseau
        légendaire fait vibrer ses plumes, le frottement
        fait tomber la foudre instantanément.
      de: |-
        Es heißt, wenn dieses Legendäre Vogel-Pokémon
        seine Flügel aneinanderreibt, brechen
        unmittelbar danach Gewitter los.
      es: |-
        Una de las aves legendarias. Dicen que, cuando
        este Pokémon frota las alas, cae al instante un
        relámpago del cielo.
      it: |-
        Si dice che quando questo leggendario
        Pokémon alato sfrega le ali fra loro,
        cada istantaneamente un fulmine.
