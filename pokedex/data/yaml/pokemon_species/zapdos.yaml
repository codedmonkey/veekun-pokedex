        Acquista forza ed energia se colpito da qualche fulmine.
    lets-go-pikachu:
      ja-Hrkt: |-
        そらが　くらくなり　いなづまが
        れんぞくして　おちていく　はてに
        でんせつの　ポケモンは　あらわれる。
      ja: |-
        空が　暗くなり　稲妻が
        連続して　落ちていく　果てに
        伝説の　ポケモンは　現れる。
      ko: |-
        하늘이 어두워지고 벼락이
        연속으로 떨어지면 이윽고
        전설의 포켓몬이 나타난다.
      zh-Hant: |-
        當天空被陰霾籠罩，
        落雷不斷時，傳說的
        寶可夢將會現身。
      zh-Hans: |-
        当天空黑暗，落雷
        不断时，这只传说的
        宝可梦就会出现。
      en: |-
        This legendary bird Pokémon is said to
        appear when the sky turns dark and lightning
        showers down.
      fr: |-
        Ce Pokémon oiseau légendaire apparaît quand
        le ciel s’assombrit et que la foudre ne cesse
        de tomber.
      de: |-
        Dieses Legendäre Vogel-Pokémon erscheint,
        wenn sich der Himmel verdunkelt und Blitze
        unablässig herunterdonnern.
      es: |-
        Este Pokémon pájaro legendario solo aparece
        cuando el cielo se torna oscuro y caen rayos
        sin cesar.
      it: |-
        Si dice che questo Pokémon alato leggendario
        appaia quando il cielo si oscura e i fulmini
        lacerano l’aria senza sosta.
    lets-go-eevee:
      ja-Hrkt: |-
