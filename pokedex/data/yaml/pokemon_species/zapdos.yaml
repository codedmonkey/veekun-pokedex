    x:
      ja-Hrkt: |-
        くもの　うえから　きょだいな
        いなずまを　おとしながら　あらわれる
        でんせつの　とりポケモンである。
      ja: |-
        雲の　上から　巨大な　稲妻を
        落としながら　現れる
        伝説の　とりポケモンである。
      ko: |-
        구름 위에서 거대한
        번개를 내리치며 나타난다.
        전설의 새포켓몬이다.
      en: |-
        A legendary bird Pokémon that is said to
        appear from clouds while dropping enormous
        lightning bolts.
      fr: |-
        L’oiseau légendaire de la foudre. Il surgit hors
        des nuages en lançant d’énormes éclairs.
      de: |-
        Ein Legendäres Vogel-Pokémon, das im Sturzflug
        aus den Wolken bricht und Blitze schleudert.
      es: |-
        Es un legendario pájaro Pokémon. Dicen que aparece
        entre las nubes lanzando enormes rayos brillantes.
      it: |-
        Uccello leggendario, si dice appaia tra le nuvole
        scagliando enormi saette.
    'y':
      ja-Hrkt: |-
        かみなりぐもの　なかに　いると
        いわれる　でんせつの　ポケモン。
        カミナリを　じざいに　あやつる。
      ja: |-
        雷雲の　中に　いると
        言われる　伝説の　ポケモン。
        雷を　自在に　操る。
      ko: |-
        번개 구름 안에 있다고
        전해지는 전설의 포켓몬이다.
        번개를 자유로이 조종한다.
      en: |-
        A legendary Pokémon that is said to live in
        thunderclouds. It freely controls lightning bolts.
      fr: |-
        Un Pokémon Oiseau légendaire dont on dit qu’il vit
        dans les nuages d’orage. Il contrôle la foudre.
      de: |-
        Ein Legendäres Vogel-Pokémon, das in
        Gewitterwolken leben soll. Es kontrolliert Blitze.
      es: |-
        Legendario Pokémon pájaro del que se dice que vive
        en los nubarrones. Controla los rayos eléctricos.
      it: |-
        Un Pokémon uccello leggendario. Si dice che viva
        tra le nubi temporalesche. Controlla i fulmini.
    omega-ruby:
      ja-Hrkt: |-
        でんきを　あやつる　でんせつの　とりポケモン。
        ふだんは　カミナリぐもの　なかで　くらしている。
        カミナリに　うたれると　ちからが　わいてくる。
      ja: |-
        電気を　操る　伝説の　鳥ポケモン。
        普段は　カミナリ雲の　中で　暮らしている。
        カミナリに　撃たれると　力が　わいてくる。
      ko: |-
        전기를 조종하는 전설의 새포켓몬이다.
        평상시는 번개 구름 속에서 지낸다.
        번개를 맞으면 힘이 솟아난다.
      en: |-
        Zapdos is a legendary bird Pokémon that has the ability to
        control electricity. It usually lives in thunderclouds.
        The Pokémon gains power if it is stricken by lightning bolts.
      fr: |-
        Électhor est un Pokémon Oiseau légendaire capable de
        contrôler l’électricité. Il vit généralement dans les nuages
        orageux. Ce Pokémon gagne en puissance lorsqu’il est
        frappé par la foudre.
      de: |-
        Zapdos ist ein Legendäres Vogel-Pokémon, das die Fähigkeit
        besitzt, Elektrizität zu manipulieren. Es lebt in Gewitterwolken.
        Dieses Pokémon nimmt Energie auf, wenn es vom Blitz
        getroffen wird.
      es: |-
        Zapdos es un Pokémon pájaro legendario que tiene la
        habilidad de controlar la electricidad. Suele vivir en
        nubarrones. Este Pokémon gana mucha fuerza si le alcanzan
        los rayos.
      it: |-
        Zapdos è un Pokémon uccello leggendario, perfettamente
        in grado di gestire l’elettricità.
        Acquista forza ed energia se colpito da qualche fulmine.
    alpha-sapphire:
      ja-Hrkt: |-
        でんきを　あやつる　でんせつの　とりポケモン。
        ふだんは　カミナリぐもの　なかで　くらしている。
