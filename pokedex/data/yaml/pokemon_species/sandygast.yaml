sandygast:
  base_happiness: 50
  capture_rate: 140
  color: brown
  egg_groups:
    - indeterminate
  evolution_chain: sandygast
  evolves_from: ~
  flavor_text:
    sun:
      ja-Hrkt: |-
        いきだおれたものの　おんねんが
        こどもが　つくった　すなやまに
        とりつき　たんじょう　したのだ。
      ja: |-
        行き倒れた者の　怨念が
        子どもが　つくった　砂山に
        取りつき　誕生　したのだ。
      ko: |-
        객사한 자의 원통함이
        아이가 만든 모래언덕에
        깃들어 탄생했다.
      zh-Hant: |-
        倒斃路邊者的怨念
        附在孩子們堆砌的沙山上
        誕生而成。
      zh-Hans: |-
        倒毙路边者的怨念
        附在孩子们堆砌的沙丘上，
        诞生而成的。
      en: |-
        Born from a sand mound playfully built by a
        child, this Pokémon embodies the grudges of
        the departed.
      fr: |-
        Ce Pokémon est né de la rancœur d’un voyageur
        mort dans l’indifférence, laquelle s’est incarnée
        dans un pâté de sable.
      de: |-
        Der Groll eines verstorbenen Reisenden fuhr in
        einen Sandhügel, den ein Kind gebaut hatte,
        und brachte dieses Pokémon in die Welt.
      es: |-
        Surgió cuando una persona murió abandonada
        en plena calle y su resentimiento poseyó un
        montículo de arena apilado por un niño.
      it: |-
        È nato quando della sabbia ammucchiata da un
        bambino è stata animata dallo spirito risentito di
        un viandante morto da solo durante un viaggio.
    moon:
      ja-Hrkt: |-
        くちのなかに　てを　いれたものを
        あやつってしまう。　すなやまの
        からだを　おおきく　させるためだ。
      ja: |-
        口の中に　手を　入れた者を
        操ってしまう。　砂山の
        身体を　大きく　させるためだ。
      ko: |-
        입안에 손을 넣은 자를
        조종한다. 모래언덕의
        몸집을 크게 만들기 위해서다.
      zh-Hant: |-
        為了讓沙山的身體變大，
        會操縱把手伸進自己嘴巴者。
      zh-Hans: |-
        将手伸入其口中就会被其操纵。
        它这样做是为了让沙丘的身体变大。
      en: |-
        It takes control of anyone who puts a hand in its
        mouth. And so it adds to the accumulation of
        its sand-mound body.
      fr: |-
        Ceux qui ont le malheur de mettre la main dans
        sa gueule deviennent ses pantins. Il est prêt à
        tout pour agrandir son corps en forme de dune.
      de: |-
        Es kann jeden kontrollieren, der seine Hand
        in sein Maul steckt, und bringt sie dann dazu,
        seinen Körper immer weiter zu vergrößern.
      es: |-
        Controla a todo aquel que ose meterle la mano
        en la boca. Su objetivo es aumentar el tamaño
        de su cuerpo en forma de duna.
      it: |-
        Prende il controllo di chiunque gli metta le mani
        nella bocca, servendosi delle vittime per
        accrescere le dimensioni del proprio corpo.
    ultra-sun:
      ja-Hrkt: |-
        あたまの　スコップは　おきにいり。
        とりかえしにきた　こどもと　ケンカ。
        ムキに　なって　なぐりあいに　なる。
      ja: |-
        頭の　スコップは　お気に入り。
        取り返しに　来た　子どもと　ケンカ。
        ムキに　なって　殴り合いに　なる。
      ko: |-
        머리의 삽을 마음에 들어한다.
        되찾으러 온 아이와 싸우다가
        열을 올리면서 치고 받고 싸운다.
      zh-Hant: |-
        很喜歡頭上的鏟子。
        會和來拿回鏟子的孩子打架，
        打著打著往往會真的互毆起來。
      zh-Hans: |-
        很喜欢头上的小铲子,
        会和回来拿的孩子打架。
        互相打着打着就当真了。
      en: |-
        It likes the shovel on its head, so Sandygast
        will get serious and fight any children who come
        to take it back.
      fr: |-
        Il tient beaucoup à la pelle sur sa tête.
        Si un enfant cherche à la récupérer, il se bat
        sans retenir ses coups pour la garder.
      de: |-
        Die Schaufel auf seinem Kopf ist sein größter
        Schatz. Versucht ein Kind, sich seine Schaufel
        zurückzuholen, gibt es diese nicht kampflos auf.
      es: |-
        Siente mucho apego por la pala de su cabeza.
        Si un niño intenta quitársela, se enfurece y pelea
        por ella.
      it: |-
        È affezionato alla paletta che ha nel capo.
        Se arriva un bambino per riprendersela,
        si scatena una vera e propria zuffa.
    ultra-moon:
      ja-Hrkt: |-
        すなあそびで　つくった　すなやまは
        かえるとき　こわさないと　たましいが
        やどり　スナバァに　なるかもしれない。
      ja: |-
        砂遊びで　作った　砂山は
        帰るとき　壊さないと　魂が
        宿り　スナバァに　なるかもしれない。
      ko: |-
        모래장난으로 만든 모래산은
        돌아갈 때 부수지 않으면 영혼이
        깃들어서 모래꿍이 될지도 모른다.
      zh-Hant: |-
        玩沙時堆成的沙山如果沒有
        在回家時破壞掉，就有可能
        被靈魂附上而變成沙丘娃。
      zh-Hans: |-
        玩沙子时堆成的沙山，
        如果没有在回家时破坏掉，
        就有可能会被魂魄附着，成为沙丘娃。
      en: |-
        If you build sand mounds when you’re playing,
        destroy them before you go home, or they
        may get possessed and become Sandygast.
      fr: |-
        Détruisez vos pâtés de sable avant de rentrer
        chez vous, sinon une âme pourrait les posséder
        et les transformer en Bacabouh.
      de: |-
        Lässt man beim Spielen gebaute Sandhaufen
        zurück, kann es vorkommen, dass sich eine
        Seele dort einnistet und ein Sankabuh entsteht.
      es: |-
        Los montículos de arena que los niños no allanan
        antes de irse a casa pueden acabar poseídos
        por un espíritu y convertirse en este Pokémon.
      it: |-
        A fine giornata bisognerebbe disperdere la
        sabbia ammucchiata, altrimenti uno spirito
        potrebbe animarla e generare un Sandygast.
    sword:
      ja-Hrkt: |-
        すなやまに　ししゃの　おんねんが
        やどり　ポケモンに　なった。
        あたまの　スコップは　おきにいり。
      ja: |-
        砂山に　死者の　怨念が　宿り
        ポケモンに　なった。
        頭の　スコップは　お気に入り。
      ko: |-
        모래산에 죽은 자의 원념이
        깃들어 포켓몬이 되었다.
        머리의 삽을 마음에 들어 한다.
      zh-Hant: |-
        死者的怨念附在沙丘上，
        從而變成的寶可夢。
        很喜歡頭上的鏟子。
      zh-Hans: |-
        死者的怨念附着在
        沙丘上，变成了宝可梦。
        很喜欢头上的小铲子。
      en: |-
        Grudges of the dead have possessed a mound of
        sand and become a Pokémon. Sandygast is fond
        of the shovel on its head.
      fr: |-
        Ce Pokémon est né lorsqu’une âme rancunière
        s’est incarnée dans un pâté de sable. Il tient
        énormément à la pelle sur sa tête.
      de: |-
        Es entstand aus einem Sandhaufen, in den der
        Groll eines Verstorbenen fuhr. Die Schaufel auf
        Sankabuhs Kopf ist sein größter Schatz.
      es: |-
        Nace de un montículo de arena poseído por el
        resentimiento de un difunto. Siente mucho apego
        por la pala de su cabeza.
      it: |-
        È nato quando uno spirito rancoroso si è
        impossessato di una montagna di sabbia.
        Tiene molto alla paletta che ha sul capo.
    shield:
      ja-Hrkt: |-
        すなはまが　おもな　すみか。
        くちのなかに　てをいれた　あいてを
        あやつり　じぶんを　おおきくする。
      ja: |-
        砂浜が　おもな　棲み処。
        口の中に　手を入れた　相手を
        操り　自分を　大きくする。
      ko: |-
        주로 모래사장에 산다.
        입안에 손을 넣은 상대를
        조종하여 자신을 크게 만든다.
      zh-Hant: |-
        主要棲息在沙灘上。會操縱
        把手伸進自己嘴巴裡的對手，
        藉此讓自己的身體變得更大。
      zh-Hans: |-
        主要栖息在沙滩上。
        操纵把手伸进自己嘴里的
        对手，从而让自己变得更大。
      en: |-
        Sandygast mainly inhabits beaches. It takes
        control of anyone who puts their hand into its
        mouth, forcing them to make its body bigger.
      fr: |-
        Il vit principalement sur les plages de sable et
        peut agrandir son corps en prenant le contrôle
        des gens qui mettent la main dans sa gueule.
      de: |-
        Für gewöhnlich lebt es an Stränden. Es kann alle
        kontrollieren, die ihre Hand in sein Maul stecken,
        und bringt sie dazu, seinen Körper zu vergrößern.
      es: |-
        Suele habitar en playas. Aumenta de tamaño al
        tomar control de todo aquel que se atreva a
        introducir la mano en su boca.
      it: |-
        Vive principalmente in spiagge sabbiose.
        Aumenta di dimensioni prendendo il controllo
        di chiunque gli metta una mano in bocca.
