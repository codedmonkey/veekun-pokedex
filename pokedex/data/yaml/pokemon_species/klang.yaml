klang:
  base_happiness: 50
  capture_rate: 60
  color: gray
  egg_groups:
    - mineral
  evolution_chain: klink
  evolves_from: klink
  flavor_text:
    black:
      en: |-
        By changing the direction in which it
        rotates, it communicates its feelings to
        others. When angry, it rotates faster.
      fr: |-
        Ils communiquent entre eux en changeant
        leur sens de rotation. Plus ils sont en
        colère, plus ils tournent vite.
    white:
      en: |-
        Spinning minigears are rotated at high
        speed and repeatedly fired away. It is
        dangerous if the gears don’t return.
      fr: |-
        Il attaque en lançant ses mini-rouages
        à grande vitesse. Il est en fâcheuse
        posture s’ils ne reviennent pas.
    black-2:
      en: |-
        A minigear and big gear comprise its
        body. If the minigear it launches at
        a foe doesn’t return, it will die.
    white-2:
      en: |-
        A minigear and big gear comprise its
        body. If the minigear it launches at
        a foe doesn’t return, it will die.
    x:
      ja-Hrkt: |-
        かいてんほうこうを　かえる　ことで
        なかまに　きもちを　つたえている。
        おこるほど　かいてんが　はやくなる。
      ja: |-
        回転方向を　変える　ことで
        仲間に　気持ちを　伝えている。
        怒るほど　回転が　速くなる。
      ko: |-
        회전 방향을 바꿔서
        동료에게 감정을 전한다.
        화가 나면 회전이 빨라진다.
      en: |-
        By changing the direction in which it rotates,
        it communicates its feelings to others. When angry,
        it rotates faster.
      fr: |-
        Ils communiquent entre eux en changeant leur sens
        de rotation. Plus ils sont en colère, plus ils tournent
        vite.
      de: |-
        Teilt Artgenossen seine Gefühlslage mit, indem es
        die Umlaufrichtung ändert. Wenn es wütend ist,
        dreht es sich schneller.
      es: |-
        Muestra sus sentimientos cambiando la dirección de su
        giro. Cuanto más se enfade, más rápido girará.
      it: |-
        Comunicano il loro stato d’animo cambiando senso di
        rotazione. Più si arrabbiano, più girano velocemente.
    'y':
      ja-Hrkt: |-
        ちびギアと　でかギアに　わかれた。
        こうげきのため　とばした　ちびギアが
        もどってこないと　しんでしまう。
      ja: |-
        ちびギアと　でかギアに　わかれた。
        攻撃のため　飛ばした　ちびギアが
        戻ってこないと　死んでしまう。
      ko: |-
        꼬마기어와 왕기어로 나뉘었다.
        공격을 위해 날린 꼬마기어가
        돌아오지 않으면 죽게 된다.
      en: |-
        A minigear and big gear comprise its body. If the
        minigear it launches at a foe doesn’t return, it
        will die.
      fr: |-
        Le plus grand des rouages projette le plus petit
        pour attaquer. Ce dernier risque de dépérir s’il ne
        revient pas.
      de: |-
        Besteht aus kleinen und großen Rädern. Kehrt ein
        kleines Rad, das es abgefeuert hat, nicht zurück,
        wird es brenzlig.
      es: |-
        Se compone de una rueda dentada grande y otra
        pequeña. Lanza la pequeña para atacar, pero se
        debilita si no regresa.
      it: |-
        È formato da un ingranaggio grande e uno piccolo.
        Attacca con quello piccolo ma, se questo non torna
        indietro, è in seria difficoltà.
    omega-ruby:
      ja-Hrkt: |-
        かいてんほうこうを　かえる　ことで
        なかまに　きもちを　つたえている。
        おこるほど　かいてんが　はやくなる。
      ja: |-
        回転方向を　変える　ことで
        仲間に　気持ちを　伝えている。
        怒るほど　回転が　速くなる。
      ko: |-
        회전 방향을 바꿔서
        동료에게 감정을 전한다.
        화가 나면 회전이 빨라진다.
      en: |-
        By changing the direction in which it rotates,
        it communicates its feelings to others. When angry,
        it rotates faster.
      fr: |-
        Ils communiquent entre eux en changeant leur sens
        de rotation. Plus ils sont en colère, plus ils tournent vite.
      de: |-
        Teilt Artgenossen seine Gefühlslage mit, indem es die
        Umlaufrichtung ändert. Wenn es wütend ist, dreht es sich
        schneller.
      es: |-
        Muestra sus sentimientos cambiando la dirección de su giro.
        Cuanto más se enfade, más rápido girará.
      it: |-
        Comunicano il loro stato d’animo cambiando senso di
        rotazione. Più si arrabbiano, più girano velocemente.
    alpha-sapphire:
      ja-Hrkt: |-
        ちびギアと　でかギアに　わかれた。
        こうげきのため　とばした　ちびギアが
        もどってこないと　しんでしまう。
      ja: |-
        ちびギアと　でかギアに　わかれた。
        攻撃のため　飛ばした　ちびギアが
        戻ってこないと　死んでしまう。
      ko: |-
        꼬마기어와 왕기어로 나뉘었다.
        공격을 위해 날린 꼬마기어가
        돌아오지 않으면 죽게 된다.
      en: |-
        A minigear and big gear comprise its body. If the
        minigear it launches at a foe doesn’t return, it
        will die.
      fr: |-
        Le plus grand des rouages projette le plus petit pour attaquer.
        Ce dernier risque de dépérir s’il ne revient pas.
      de: |-
        Besteht aus kleinen und großen Rädern. Kehrt ein kleines Rad,
        das es abgefeuert hat, nicht zurück, wird es brenzlig.
      es: |-
        Se compone de una rueda dentada grande y otra pequeña.
        Lanza la pequeña para atacar, pero se debilita si no regresa.
      it: |-
        È formato da un ingranaggio grande e uno piccolo. Attacca
        con quello piccolo ma, se questo non torna indietro, è in
        seria difficoltà.
    sword:
      ja-Hrkt: |-
        ほんきの　ときは　でかギアの　そとの
        はぐるまと　ちびギアが　がっち。
        かいてんそくどが　ひやく　するのだ。
      ja: |-
        本気の　ときは　でかギアの　外の
        歯車と　ちびギアが　合致。
        回転速度が　飛躍　するのだ。
      ko: |-
        전력을 다할 때는 왕기어의
        바깥쪽 톱니와 꼬마기어가 맞물린다.
        회전 속도를 빠르게 하기 위함이다.
      zh-Hant: |-
        如果認真起來，大齒輪外圈的
        齒輪會和小齒輪完全接合。
        此時轉速將會大幅提升。
      zh-Hans: |-
        如果认真起来，大齿轮外圈的
        齿轮会和小齿轮完全接合。
        此时转速将会大幅提升。
      en: |-
        When Klang goes all out, the minigear links up
        perfectly with the outer part of the big gear, and
        this Pokémon’s rotation speed increases sharply.
      fr: |-
        Quand le combat devient sérieux, la partie
        extérieure du grand rouage s’aligne parfaitement
        avec le petit pour accélérer leur rotation.
      de: |-
        Macht es Ernst, greift das kleine äußere Rad in
        das große Rad, was die Drehgeschwindigkeit
        merklich erhöht.
      es: |-
        Cuando se pone en serio, la parte externa de la
        rueda dentada grande se acopla a la pequeña y
        aumenta su velocidad de rotación.
      it: |-
        Quando fa sul serio, la parte esterna
        dell’ingranaggio grande si unisce a quello
        piccolo e iniziano a girare all’impazzata.
    shield:
      ja-Hrkt: |-
        こうぎょうぎじゅつの　シンボルとして
        おおくの　ガラルの　かいしゃで
        きぎょうロゴに　さいよう　される。
      ja: |-
        工業技術の　シンボルとして
        多くの　ガラルの　会社で
        企業ロゴに　採用　される。
      ko: |-
        공업 기술의 상징으로
        많은 가라르의 회사에서
        기업 로고로 채용하고 있다.
      zh-Hant: |-
        被認為是工業技術的象徵。
        有許多伽勒爾當地的公司
        選擇牠作為企業的標誌。
      zh-Hans: |-
        被认为是工业技术的象征。
        有许多伽勒尔当地的公司
        选择它作为企业的标志。
      en: |-
        Many companies in the Galar region choose
        Klang as their logo. This Pokémon is considered
        the symbol of industrial technology.
      fr: |-
        Ce Pokémon symbolisant la technologie
        industrielle est souvent utilisé dans le logo
        des entreprises de Galar.
      de: |-
        Da es symbolisch für die Industriebranche steht,
        ist es im Logo unzähliger Firmen Galars
        abgebildet.
      es: |-
        Muchas empresas de Galar usan su imagen en sus
        logotipos como símbolo de tecnología industrial.
      it: |-
        Molte imprese di Galar lo usano come logo
        in quanto simbolo della tecnologia industriale.
