corvisquire:
  base_happiness: 50
  capture_rate: 120
  color: blue
  egg_groups:
    - flying
  evolution_chain: rookidee
  evolves_from: rookidee
  flavor_text:
    sword:
      ja-Hrkt: |-
        あしで　こいしを　つかんで　なげたり
        ロープを　てきに　まきつけるなど
        どうぐを　あつかう　ちえを　もつ。
      ja: |-
        足で　小石を　つかんで　投げたり
        ロープを　敵に　巻きつけるなど
        道具を　あつかう　知恵を　もつ。
      ko: |-
        발로 돌멩이를 쥐어서 던지거나
        로프를 상대에게 휘감는 등
        도구를 다루는 지혜를 가졌다.
      zh-Hant: |-
        頭腦聰明，懂得使用工具。
        會用爪子抓起小石頭投向敵人，
        或是用繩子把敵人綑住。
      zh-Hans: |-
        头脑聪明，懂得使用工具。
        会用爪子抓起小石头投向敌人，
        或是用绳子把敌人捆住。
      en: |-
        Smart enough to use tools in battle, these
        Pokémon have been seen picking up rocks and
        flinging them or using ropes to wrap up enemies.
      fr: |-
        Il est capable d’utiliser des objets avec ses serres :
        il peut par exemple saisir et lancer des pierres
        ou même enrouler une corde autour d’un ennemi.
      de: |-
        Es weiß Objekte geschickt einzusetzen. So greift
        und wirft es zum Beispiel kleine Steine mit seinen
        Krallen oder wickelt Seile um Gegner.
      es: |-
        Su inteligencia le permite servirse de objetos. Por
        ejemplo, recoge y lanza piedras con las patas, o
        utiliza cuerdas para atrapar a su oponente.
      it: |-
        È in grado di adoperare oggetti. Ad esempio,
        sa afferrare e scagliare pietre con le zampe
        o avvolgere il nemico con una corda.
    shield:
      ja-Hrkt: |-
        きびしい　たたかいを　くぐりぬけて
        あいての　りきりょうを　せいかくに
        はんだんする　ちからが　みについた。
      ja: |-
        厳しい　戦いを　くぐり抜けて
        相手の　力量を　正確に
        判断する　力が　身についた。
      ko: |-
        혹독한 싸움을 헤쳐 나와
        상대의 역량을 정확히
        판단하는 힘을 습득했다.
      zh-Hant: |-
        歷經無數次艱難的戰鬥後，
        牠學會了該如何正確地
        判斷敵人的力量。
      zh-Hans: |-
        经历无数次艰难的战斗后，
        它学会了该如何正确地
        判断敌人的力量。
      en: |-
        The lessons of many harsh battles have taught it
        how to accurately judge an opponent’s strength.
      fr: |-
        Après avoir surmonté tant de rudes combats,
        il a appris à déterminer avec précision
        la puissance de ses adversaires.
      de: |-
        Es hat viele heftige Kämpfe überstanden und
        dabei gelernt, die Stärke seiner Gegner stets
        korrekt einzuschätzen.
      es: |-
        Tras haber librado combates muy duros, ha
        desarrollado la habilidad de determinar con
        precisión la fuerza de su adversario.
      it: |-
        Avendo affrontato lotte molto ardue, ha
        imparato a valutare con precisione la forza
        del nemico.
