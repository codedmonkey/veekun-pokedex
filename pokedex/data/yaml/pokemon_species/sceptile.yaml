    x:
      ja-Hrkt: |-
        うでに　はえた　はっぱは　たいぼくも
        すっぱり　きりたおす　きれあじ。
        みつりんの　たたかいでは　むてき。
      ja: |-
        腕に　生えた　葉っぱは　大木も
        スッパリ　切り倒す　切れ味。
        密林の　戦いでは　無敵。
      ko: |-
        팔에 자란 잎사귀는 큰 나무도
        싹둑 베어 넘어뜨리는 정도다.
        밀림의 싸움에서는 무적이다.
      en: |-
        The leaves that grow on its arms can slice down
        thick trees. It is without peer in jungle combat.
      fr: |-
        Les feuilles sur ses bras peuvent trancher des troncs
        épais. C’est le meilleur combattant des jungles.
      de: |-
        Die Blätter an seinen Armen können dicke Bäume
        fällen. Im Dschungelkampf gibt es kein stärkeres
        Pokémon.
      es: |-
        Las hojas de sus brazos pueden cortar gruesos
        árboles. Invencible en los combates en la jungla.
      it: |-
        Le foglie che crescono sulle sue braccia tagliano
        anche grandi alberi. Nel suo habitat, è imbattibile.
    'y':
      ja-Hrkt: |-
        ジャングルを　みがるに　はしりまわり
        うでに　はえた　きれあじ　するどい
        はっぱで　えものを　しとめるのだ。
      ja: |-
        ジャングルを　身軽に　走り回り
        腕に　生えた　切れ味　鋭い　葉っぱで
        獲物を　しとめるのだ。
      ko: |-
        정글을 가볍게 뛰어
        팔에 자란 예리하며 잘 드는
        잎날로 먹이를 꼼짝 못하게 한다.
      en: |-
        It agilely leaps about the jungle and uses the sharp
        leaves on its arms to strike its prey.
      fr: |-
        Il parcourt la jungle avec agilité et attaque ses proies
        grâce aux feuilles tranchantes sur ses bras.
      de: |-
        Flink zischt es durch den Dschungel. Mit den
        Blattklingen an seinen Armen schlägt es seine Beute.
      es: |-
        Corre con elegancia de un lugar a otro de la selva y
        usa las afiladas hojas de sus brazos para cazar.
      it: |-
        Percorre agile e veloce la giungla abbattendo le prede
        con le affilate foglie che ha sugli arti anteriori.
    omega-ruby:
      ja-Hrkt: |-
        からだに　はえた　はっぱは　するどい　きれあじ。
        すばやい　みのこなしで　きの　えだを　とびまわり
        てきの　ずじょうや　はいごから　おそいかかるぞ。
      ja: |-
        体に　生えた　葉っぱは　鋭い　切れ味。
        素早い　身のこなしで　木の　枝を　飛び回り
        敵の　頭上や　背後から　襲いかかるぞ。
      ko: |-
        몸에 난 잎사귀는 예리한 칼과 같다.
        빠른 몸놀림으로 나뭇가지를 뛰어다니며
        적의 머리 위나 배후에서 덮친다.
      en: |-
        The leaves growing on Sceptile’s body are very sharp edged.
        This Pokémon is very agile—it leaps all over the branches of
        trees and jumps on its foe from above or behind.
      fr: |-
        Les feuilles qui poussent sur le corps de Jungko sont
        extrêmement tranchantes. Ce Pokémon est très agile.
        Il bondit de branche en branche avant de sauter sur
        son ennemi.
      de: |-
        Die Blätter, die auf Gewaldros Körper wachsen, sind sehr
        scharfkantig. Dieses Pokémon ist sehr agil. Es hüpft von
        Ast zu Ast und springt seine Feinde von oben oder hinten an.
      es: |-
        Las hojas que le salen a Sceptile del cuerpo tienen unos
        bordes muy afilados. Este Pokémon es muy ágil, va saltando
        de rama en rama y se lanza sobre el enemigo por la espalda.
      it: |-
        Le foglie che crescono sul corpo di Sceptile hanno margini
        taglienti. Questo Pokémon è agilissimo, infatti salta da
        un ramo all’altro e piomba sui nemici sorprendendoli dall’alto.
    alpha-sapphire:
      ja-Hrkt: |-
        せなかの　タネには　じゅもくを　げんきにする
        えいようが　たくさん　つまっていると　いわれる。
        もりの　きを　だいじに　そだてている　ポケモン。
      ja: |-
        背中の　タネには　樹木を　元気にする
        栄養が　沢山　詰まっていると　いわれる。
        森の　木を　大事に　育てている　ポケモン。
      ko: |-
        등의 씨앗에는 나무를 건강하게 만드는
        영양이 많이 채워져 있다고 전해진다.
        숲의 나무를 소중히 키우고 있는 포켓몬이다.
      en: |-
        Sceptile has seeds growing on its back. They are said to be
        bursting with nutrients that revitalize trees. This Pokémon
        raises the trees in a forest with loving care.
      fr: |-
        Jungko a des graines qui lui poussent sur le dos. On dit
        qu’elles regorgent de nutriments qui revitalisent les arbres.
        Ce Pokémon s’occupe des forêts avec amour.
      de: |-
        Auf Gewaldros Rücken wachsen Samen. Darin sind Nährstoffe,
        die Bäume beleben können. Dieses Pokémon achtet mit viel
        Fürsorge darauf, dass die Bäume seines Waldes prächtig
        gedeihen.
      es: |-
        A Sceptile le crecen en la espalda unas semillas llenas de
        nutrientes que sirven para revitalizar los árboles. De hecho,
        se dedica a cuidarlos con mimo para que crezcan bien.
      it: |-
        Sulla schiena di Sceptile crescono alcuni semi che si dice
        siano ricchi di nutrienti per gli alberi. Questo Pokémon
        coltiva amorevolmente le sue piante nella foresta.
