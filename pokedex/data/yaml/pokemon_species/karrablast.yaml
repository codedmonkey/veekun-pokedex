karrablast:
  base_happiness: 50
  capture_rate: 200
  color: blue
  egg_groups:
    - bug
  evolution_chain: karrablast
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        These mysterious Pokémon evolve when
        they receive electrical stimulation while
        they are in the same place as Shelmet.
      fr: |-
        Un Pokémon mystérieux qui évolue quand
        il reçoit un stimulus électrique en étant
        proche d’un Escargaume.
    white:
      en: |-
        When they feel threatened, they spit
        an acidic liquid to drive attackers away.
        This Pokémon targets Shelmet.
      fr: |-
        Quand il sent un danger, il se défend
        en crachant un liquide acide.
        Il chasse les Escargaume.
    black-2:
      en: |-
        For some reason they evolve when
        they receive electrical energy while
        they are attacking Shelmet.
    white-2:
      en: |-
        For some reason they evolve when
        they receive electrical energy while
        they are attacking Shelmet.
    x:
      ja-Hrkt: |-
        チョボマキと　いっしょに　いるときに
        でんきてきな　しげきを　うけると
        しんかする　ふしぎな　ポケモンだ。
      ja: |-
        チョボマキと　一緒に　いるときに
        電気的な　刺激を　受けると
        進化する　不思議な　ポケモンだ。
      ko: |-
        쪼마리와 함께 있을 때
        전기적인 자극을 받으면
        진화하는 이상한 포켓몬이다.
      en: |-
        These mysterious Pokémon evolve when they
        receive electrical stimulation while they are in the
        same place as Shelmet.
      fr: |-
        Un Pokémon mystérieux qui évolue quand il reçoit un
        stimulus électrique en étant proche d’un Escargaume.
      de: |-
        Ein mysteriöses Pokémon, das sich entwickelt,
        wenn es zusammen mit Schnuthelm einen
        Stromschlag abbekommt.
      es: |-
        Si recibe un estímulo eléctrico al estar en contacto con
        un Shelmet, evoluciona.
      it: |-
        Pokémon misterioso che si evolve ricevendo uno
        stimolo elettrico se si trova in presenza di Shelmet.
    'y':
      ja-Hrkt: |-
        チョボマキを　おそっているときに
        でんきエネルギーを　あびると
        なぜだか　しんか　してしまうのだ。
      ja: |-
        チョボマキを　襲っているときに
        電気エネルギーを　浴びると
        なぜだか　進化　してしまうのだ。
      ko: |-
        쪼마리를 덮쳤을 때
        전기 에너지를 받으면
        왜인지 진화해 버린다.
      en: |-
        For some reason they evolve when they receive
        electrical energy while they are attacking Shelmet.
      fr: |-
        Pour une raison inconnue, ce Pokémon évolue
        s’il subit une décharge électrique pendant qu’il
        attaque un Escargaume.
      de: |-
        Bekommt es im Kampf gegen Schnuthelm Strom ab,
        löst dies aus unerklärlichen Gründen seine
        Entwicklung aus.
      es: |-
        Si recibe una descarga eléctrica durante un combate
        contra un Shelmet, puede evolucionar. Se desconoce
        el porqué.
      it: |-
        Per qualche motivo, si evolve a contatto dell’energia
        elettrica che si crea quando attacca Shelmet.
    omega-ruby:
      ja-Hrkt: |-
        チョボマキと　いっしょに　いるときに
        でんきてきな　しげきを　うけると
        しんかする　ふしぎな　ポケモンだ。
      ja: |-
        チョボマキと　一緒に　いるときに
        電気的な　刺激を　受けると
        進化する　不思議な　ポケモンだ。
      ko: |-
        쪼마리와 함께 있을 때
        전기적인 자극을 받으면
        진화하는 이상한 포켓몬이다.
      en: |-
        These mysterious Pokémon evolve when they
        receive electrical stimulation while they are in the
        same place as Shelmet.
      fr: |-
        Un Pokémon mystérieux qui évolue quand il reçoit un stimulus
        électrique en étant proche d’un Escargaume.
      de: |-
        Ein mysteriöses Pokémon, das sich entwickelt, wenn es
        zusammen mit Schnuthelm einen Stromschlag abbekommt.
      es: |-
        Si recibe un estímulo eléctrico al estar en contacto con un
        Shelmet, evoluciona.
      it: |-
        Pokémon misterioso che si evolve ricevendo uno stimolo
        elettrico se si trova in presenza di Shelmet.
    alpha-sapphire:
      ja-Hrkt: |-
        チョボマキを　おそっているときに
        でんきエネルギーを　あびると
        なぜだか　しんか　してしまうのだ。
      ja: |-
        チョボマキを　襲っているときに
        電気エネルギーを　浴びると
        なぜだか　進化　してしまうのだ。
      ko: |-
        쪼마리를 덮쳤을 때
        전기 에너지를 받으면
        왜인지 진화해 버린다.
      en: |-
        For some reason they evolve when they receive
        electrical energy while they are attacking Shelmet.
      fr: |-
        Pour une raison inconnue, ce Pokémon évolue s’il subit
        une décharge électrique pendant qu’il attaque un Escargaume.
      de: |-
        Bekommt es im Kampf gegen Schnuthelm Strom ab, löst dies
        aus unerklärlichen Gründen seine Entwicklung aus.
      es: |-
        Si recibe una descarga eléctrica durante un combate contra
        un Shelmet, puede evolucionar. Se desconoce el porqué.
      it: |-
        Per qualche motivo, si evolve a contatto dell’energia elettrica
        che si crea quando attacca Shelmet.
    sword:
      ja-Hrkt: |-
        でんきエネルギーに　はんのうする
        ふしぎな　たいしつ。　チョボマキと
        ともに　いると　しんかする。
      ja: |-
        電気エネルギーに　反応する
        不思議な　体質。　チョボマキと
        ともに　いると　進化する。
      ko: |-
        전기 에너지에 반응하는
        이상한 체질을 지녔다.
        쪼마리와 함께 있으면 진화한다.
      zh-Hant: |-
        有著會對電能產生反應的
        奇異體質。和小嘴蝸
        待在一起就會進化。
      zh-Hans: |-
        有着会对电能产生反应的
        奇异体质。和小嘴蜗
        待在一起就会进化。
      en: |-
        Its strange physiology reacts to electrical energy
        in interesting ways. The presence of a Shelmet
        will cause this Pokémon to evolve.
      fr: |-
        Son corps étrangement structuré a la faculté
        de réagir à l’électricité.
        Il évolue lorsqu’il croise un Escargaume.
      de: |-
        Sein Körper reagiert unerklärlicherweise auf
        Elektrizität. Die Anwesenheit von Schnuthelm
        löst bei ihm die Entwicklung aus.
      es: |-
        Su misterioso cuerpo reacciona a la energía
        eléctrica. Si se encuentra en presencia de un
        Shelmet, evoluciona.
      it: |-
        Il suo corpo reagisce misteriosamente all’energia
        elettrica. Si evolve se si trova in presenza
        di Shelmet.
    shield:
      ja-Hrkt: |-
        くちから　はきだす　えきたいで
        チョボマキの　からを　とかす。
        なかみ　だけを　いただくのだ。
      ja: |-
        口から　吐き出す　液体で
        チョボマキの　殻を　溶かす。
        中身　だけを　いただくのだ。
      ko: |-
        입에서 내뿜는 액체로
        쪼마리의 껍질을 녹여서
        내용물만 먹어 치운다.
      zh-Hant: |-
        用嘴裡吐出的液體
        來融化小嘴蝸的殼，
        只會去吃裡面的身體。
      zh-Hans: |-
        用嘴里吐出的液体
        来溶化小嘴蜗的壳，
        只会去吃里面的身体。
      en: |-
        It spits a liquid from its mouth to melt through
        Shelmet’s shell. Karrablast doesn’t eat the shell—
        it eats only the contents.
      fr: |-
        Il crache un liquide qui dissout les coquilles
        des Escargaume pour se régaler de leur contenu.
      de: |-
        Es nutzt die Flüssigkeit aus seinem Mund,
        um die Muschel von Schnuthelm aufzulösen.
        Dann verspeist es den Inhalt.
      es: |-
        Escupe un líquido corrosivo con el que disuelve
        el caparazón de los Shelmet para luego devorar
        el contenido.
      it: |-
        Scioglie la conchiglia di Shelmet con il liquido
        che spruzza dalla bocca e ne mangia il contenuto.
