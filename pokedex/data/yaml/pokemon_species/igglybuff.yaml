igglybuff:
  base_happiness: 50
  capture_rate: 170
  color: pink
  egg_groups:
    - no-eggs
  evolution_chain: jigglypuff
  evolves_from: ~
  flavor_text:
    gold:
      en: |-
        It has a very soft
        body. If it starts
        to roll, it willbounce all over
        and be impossible
        to stop.
    silver:
      en: |-
        Its extremely
        flexible and elas­
        tic body makes itbounce continuous­
        ly--anytime, any­
        where.
    crystal:
      en: |-
        Instead of walking
        with its short
        legs, it movesaround by bouncing
        on its soft,
        tender body.
    ruby:
      en: |-
        IGGLYBUFF’s vocal chords are not
        sufficiently developed. It would hurt
        its throat if it were to sing too much.This POKéMON gargles with freshwater
        from a clean stream.
    sapphire:
      en: |-
        IGGLYBUFF has a soft and plushy body
        that feels very much like a marshmallow.
        From this body wafts a gently sweetfragrance that soothes and calms the
        emotions of its foes.
    emerald:
      en: |-
        Its soft and pliable body is very bouncy.
        When it sings continuously with all its
        might, its body steadily turns a deepening
        pink color.
    firered:
      en: |-
        Its extremely flexible and elastic body
        makes it bounce continuously--anytime,
        anywhere.
    leafgreen:
      en: |-
        It has a very soft body. If it starts to
        roll, it will bounce all over and be
        impossible to stop.
    diamond:
      en: |-
        It has a soft and bouncy body.
        Once it starts bouncing, it
        becomes impossible to stop.
    pearl:
      en: |-
        It has a soft and bouncy body.
        Once it starts bouncing, it
        becomes impossible to stop.
    platinum:
      en: |-
        It has a soft and bouncy body.
        Once it starts bouncing, it
        becomes impossible to stop.
    heartgold:
      en: |-
        It has a very soft body. If it
        starts to roll, it will bounce all
        over and be impossible to stop.
    soulsilver:
      en: |-
        Its extremely flexible and
        elastic body makes it bounce
        continuously--anytime, anywhere.
    black:
      en: |-
        It has a soft and bouncy body.
        Once it starts bouncing, it
        becomes impossible to stop.
      fr: |-
        Son corps est doux et élastique.
        Quand il commence à rebondir,
        on ne peut plus l’arrêter.
    white:
      en: |-
        It has a soft and bouncy body.
        Once it starts bouncing, it
        becomes impossible to stop.
      fr: |-
        Son corps est doux et élastique.
        Quand il commence à rebondir,
        on ne peut plus l’arrêter.
    black-2:
      en: |-
        Its body has a faintly sweet scent
        and is bouncy and soft. If it bounces
        even once, it cannot stop.
    white-2:
      en: |-
        Its body has a faintly sweet scent
        and is bouncy and soft. If it bounces
        even once, it cannot stop.
    x:
      ja-Hrkt: |-
        みじかい　あしで　あるくより
        やわらかい　からだを　つかって
        とびはねながら　うごきまわる。
      ja: |-
        短い　脚で　歩くより
        やわらかい　体を　使って
        飛び跳ねながら　動き回る。
      ko: |-
        짧은 다리로 걷는 것보다는
        부드러운 몸으로
        튀어 오르며 돌아다닌다.
      en: |-
        Instead of walking with its short legs, it moves
        around by bouncing on its soft, tender body.
      fr: |-
        Plutôt que de se déplacer avec ses petites pattes,
        il rebondit avec son corps doux et moelleux.
      de: |-
        Anstatt mit seinen kurzen Beinen zu laufen, hüpft es
        mit seinem weichen und kuscheligen Körper.
      es: |-
        Para caminar, en lugar de usar los pies que tiene, opta
        por dar botes con su cuerpo redondo y blandito.
      it: |-
        Anziché camminare sulle sue corte zampe, preferisce
        rimbalzare sul suo corpo soffice e delicato.
    'y':
      ja-Hrkt: |-
        とても　やわらかい　からだ。
        いちど　ころがると　はずみまくって
        ぜんぜん　とまれなくなる。
      ja: |-
        とても　やわらかい　体。
        1度　転がると　弾みまくって
        ぜんぜん　止まれなくなる。
      ko: |-
        매우 부드러운 몸이다.
        한번 구르면 탄력이 붙어서
        전혀 멈출 수 없게 된다.
      en: |-
        It has a very soft body. If it starts to roll, it will
        bounce all over and be impossible to stop.
      fr: |-
        Son corps est très doux. Quand il commence à
        rebondir, il est impossible de l’arrêter.
      de: |-
        Sein Körper ist sehr weich. Kommt es ins Rollen,
        hüpft es herum und man kann es nicht aufhalten.
      es: |-
        Su cuerpo es muy blando. Si se pone a rodar,
        rebotará contra todo y será imposible de parar.
      it: |-
        Il suo corpo è morbidissimo. Se inizia a rotolare,
        rimbalza così forte che è impossibile fermarlo.
    omega-ruby:
      ja-Hrkt: |-
        せいたいが　まだ　じゅうぶんに　はったつして
        いないので　うたい　つづけると　ノドが　いたむ。
        きれいな　おがわの　みずで　うがいをするよ。
      ja: |-
        声帯が　まだ　十分に　発達して
        いないので　歌い　続けると　ノドが　痛む。
        きれいな　小川の　水で　うがいをするよ。
      ko: |-
        성대가 아직 충분히 발달하지
        않아 계속 노래 부르면 목이 아프다.
        깨끗한 시냇물로 양치질한다.
      en: |-
        Igglybuff’s vocal cords are not sufficiently developed. It would
        hurt its throat if it were to sing too much. This Pokémon
        gargles with freshwater from a clean stream.
      fr: |-
        Les cordes vocales de Toudoudou ne sont pas assez
        développées. S’il devait chanter trop longtemps, il se ferait
        mal à la gorge. Ce Pokémon se gargarise souvent avec
        de l’eau fraîche puisée dans un ruisseau clair.
      de: |-
        Fluffeluffs Stimmbänder sind noch nicht voll entwickelt. Wenn
        es zu viel singt, schmerzt ihm die Kehle. Dieses Pokémon
        gurgelt mit Süßwasser aus einem sauberen Fluss.
      es: |-
        Las cuerdas vocales de Igglybuff no están suficientemente
        desarrolladas. Si tuviera que cantar mucho, se haría daño en
        la garganta. Este Pokémon suele hacer gárgaras con agua
        pura de manantial.
      it: |-
        Le corde vocali di Igglybuff non sono sufficientemente
        sviluppate. Se eccede nel canto, gli viene il mal di gola.
        È solito fare i gargarismi con l’acqua corrente dei torrenti puri.
    alpha-sapphire:
      ja-Hrkt: |-
        マシュマロ　みたいな　さわりごこちの　からだから
        ほんのり　あまい　においが　ただよってくるよ。
        においは　てきの　きもちを　おだやかにする。
      ja: |-
        マシュマロ　みたいな　触り心地の　体から
        ほんのり　甘い　においが　漂ってくるよ。
        においは　敵の　気持ちを　穏やかにする。
      ko: |-
        마시멜로 같은 촉감의 몸에서
        은은하게 달콤한 냄새가 풍겨온다.
        냄새는 적의 기분을 차분하게 만든다.
      en: |-
        Igglybuff has a soft and plushy body that feels very much like
        a marshmallow. From this body wafts a gently sweet fragrance
        that soothes and calms the emotions of its foes.
      fr: |-
        Toudoudou a un corps mou et pelucheux, semblable à
        de la guimauve. Un parfum doux et sucré s’échappe de son
        corps, ce qui lui permet d’apaiser et de calmer ses ennemis.
      de: |-
        Fluffeluff hat einen weichen Körper, der sich anfühlt wie
        ein Marshmallow. Es verströmt einen süßlichen Duft,
        der die Emotionen seiner Gegner beruhigt.
      es: |-
        Igglybuff es suave y tierno, parece un merengue. Emana un
        aroma dulce y agradable que le sirve para calmar los ánimos
        de sus oponentes en combate.
      it: |-
        Igglybuff, così morbido e soffice, sembra fatto di gommapiuma
        rosa. Il suo corpo emana un lieve aroma che placa le emozioni
        e l’aggressività del nemico.
    sun:
      ja-Hrkt: |-
        うたうのが　すきだが　まだまだ　へた。
        ちゃんと　ほめてあげると　すこしずつ
        じょうずに　なっていくよ。
      ja: |-
        歌うのが　好きだが　まだまだ　下手。
        ちゃんと　ほめてあげると　少しずつ
        上手に　なっていくよ。
      ko: |-
        노래 부르기를 좋아하지만
        아직 서툴다. 제대로 칭찬해주면
        조금씩 잘하게 된다.
      zh-Hant: |-
        很喜歡唱歌，但唱得不怎麼樣。
        如果好好地稱讚牠，
        就會越唱越好哦。
      zh-Hans: |-
        喜欢唱歌，但还不怎么在行。
        如果能给予恰当的表扬，
        就会渐渐有所提高哦。
      en: |-
        It likes to sing but is not yet good at it.
        With praise and encouragement, it will get
        better little by little.
      fr: |-
        Il adore chanter, mais il n’est pas encore très
        doué. Il s’améliore progressivement si on le
        complimente suffisamment.
      de: |-
        Es liebt das Singen, ist aber noch nicht sehr gut
        darin. Lobt man es regelmäßig, verbessern sich
        seine Gesangskünste jedoch nach und nach.
      es: |-
        Le apasiona cantar, pero no se le da muy bien.
        Cuantos más elogios reciba, más mejorarán sus
        dotes de cantante.
      it: |-
        Gli piace molto cantare, ma è ancora inesperto.
        Se incoraggiato nel modo giusto, migliora
        a poco a poco.
    moon:
      ja-Hrkt: |-
        ポンポン　はずみながら　いどう。
        たくさん　うごいて　あせを　かくと
        ほんのり　あまい　たいしゅうが　する。
      ja: |-
        ポンポン　弾みながら　移動。
        たくさん　動いて　汗を　かくと
        ほんのり　甘い　体臭が　する。
      ko: |-
        통통 튀면서 이동한다.
        많이 움직여서 땀이 나면
        은은하게 달콤한 체취가 난다.
      zh-Hant: |-
        蹦蹦蹦地彈跳著移動。
        因大量運動而流汗時，
        會發出微甜的體味。
      zh-Hans: |-
        嘭嘭嘭地弹跳着移动。
        动得多了出汗的话，
        会发出微甜的体味。
      en: |-
        It moves by bouncing along. As it moves a lot,
        it sweats, and its body gives off a sweet aroma.
      fr: |-
        Il se déplace en rebondissant comme une balle.
        Quand il a beaucoup bougé et qu’il sue, son
        corps dégage une légère odeur sucrée.
      de: |-
        Es bewegt sich hüpfend umher. Gerät es
        dabei ins Schwitzen, sondert es einen
        süßlichen Duft ab.
      es: |-
        Se desplaza dando botes con su cuerpo.
        Después de hacer mucho ejercicio, empieza a
        sudar y desprende un ligero aroma dulce.
      it: |-
        Si muove rimbalzando e quando suda molto
        emana un lieve aroma dolciastro.
    ultra-sun:
      ja-Hrkt: |-
        うまくなりたくて　ずっと　うたの
        れんしゅうを　している。　ねてるときも
        ゆめの　なかで　うたっているよ。
      ja: |-
        上手くなりたくて　ずっと　歌の
        練習を　している。　寝ているときも
        夢の　中で　歌っているよ。
      ko: |-
        노래를 잘하고 싶어서
        계속 연습을 한다. 잘 때도
        꿈속에서 노래를 부른다.
      zh-Hant: |-
        為了讓歌喉變好，
        牠一直努力練習唱歌，
        就連在睡夢中也不斷歌唱。
      zh-Hans: |-
        为了能动听地歌唱，它会一直练习唱歌。
        就算是睡着了，也会在梦中不停地歌唱哦。
      en: |-
        It’s always practicing its singing because it
        wants to improve. Even when it’s asleep,
        it keeps singing in its dreams!
      fr: |-
        Il s’entraîne dur pour maîtriser le chant.
        Même quand il dort, il continue de faire
        des gammes dans ses rêves.
      de: |-
        Um seine Gesangskünste zu verbessern, übt es
        pausenlos. Selbst wenn es schon schläft, singt
        es in seinen Träumen weiter.
      es: |-
        Practica constantemente para mejorar su canto,
        llegando incluso a cantar en sueños.
      it: |-
        Si allena continuamente nel canto per migliorare.
        Anche mentre dorme, continua a cantare
        in sogno.
    ultra-moon:
      ja-Hrkt: |-
        ほうっておくと　ずーっと　うたの
        れんしゅうを　つづける。　のどを
        いためないように　やすませてあげて。
      ja: |-
        放っておくと　ずーっと　歌の
        練習を　続ける。　喉を
        痛めないように　休ませてあげて。
      ko: |-
        내버려 두면 계속해서
        노래 연습을 반복한다.
        목이 상하지 않도록 쉬게 해주자.
      zh-Hant: |-
        放著不管的話，牠就會一直
        練習唱歌。要記得讓牠休息，
        不然是會弄壞嗓子的。
      zh-Hans: |-
        如果不去管它，它就会一直练习唱歌。
        所以还是让它休息会，别伤到了嗓子。
      en: |-
        Left to its own devices, it will constantly
        practice singing. You should make it take a
        break so it doesn’t hurt its throat.
      fr: |-
        Si on le laissait faire, il passerait son temps
        à chanter. Il vaut donc mieux l’en empêcher
        pour préserver sa petite gorge.
      de: |-
        Wenn man es lässt, widmet es sich unentwegt
        dem Gesang. Zur Schonung der Stimmbänder
        werden gezielte Pausen empfohlen.
      es: |-
        Si le dejan, se pasa el día entero practicando su
        canto, así que conviene animarlo a descansar de
        vez en cuando para que no se destroce la voz.
      it: |-
        Se lasciato fare, si allena nel canto senza sosta.
        Ogni tanto è meglio fargli fare una pausa per
        evitare che si faccia male alla gola.
    sword:
      ja-Hrkt: |-
        うたを　うたうことが　だいすき。
        マシュマロのような　からだからは
        ほんのり　あまい　においが　するぞ。
      ja: |-
        歌を　歌うことが　大好き。
        マシュマロのような　体からは
        ほんのり　甘い　匂いが　するぞ。
      ko: |-
        노래 부르기를 굉장히 좋아한다.
        마시멜로 같은 몸에서는
        은은하게 달콤한 냄새가 난다.
      zh-Hant: |-
        很喜歡唱歌。
        像是棉花糖的身體會
        散發出微甜的氣味喔。
      zh-Hans: |-
        最喜欢唱歌。
        像棉花糖一样的身体
        会散发出微甜的香气。
      en: |-
        Igglybuff loves to sing. Its marshmallow-like body
        gives off a faint sweet smell.
      fr: |-
        Il adore chanter. Son corps semblable à de
        la guimauve dégage une légère odeur sucrée.
      de: |-
        Dieses Pokémon singt liebend gern. Von seinem
        Körper, der an ein Marshmallow erinnert, geht
        ein leicht süßlicher Duft aus.
      es: |-
        Le apasiona cantar. Su cuerpo suave y esponjoso
        desprende un aroma ligeramente dulce.
      it: |-
        Adora cantare. Il suo corpo simile al
        marshmallow emana una lieve e dolce fragranza.
    shield:
      ja-Hrkt: |-
        やわらかい　からだで　はずむように
        うごきまわる。　たいおんが　あがると
        からだは　こい　ピンクいろに　なる。
      ja: |-
        柔らかい　体で　弾むように
        動きまわる。　体温が　上がると
        体は　濃い　ピンク色になる。
      ko: |-
        부드러운 몸으로 통통 튀며
        움직인다. 체온이 오르면
        몸은 짙은 핑크색이 된다.
      zh-Hant: |-
        會用柔軟的身體一彈一跳地
        四處移動。體溫上升時，
        身體就會變成深粉紅色。
      zh-Hans: |-
        用柔软的身体弹跳著移动。
        当它的体温上升时，
        身体会变成深粉红色。
      en: |-
        Taking advantage of the softness of its body,
        Igglybuff moves as if bouncing. Its body turns a
        deep pink when its temperature rises.
      fr: |-
        Il se déplace en faisant rebondir son corps
        tout mou. Lorsque sa température corporelle
        augmente, il devient rose foncé.
      de: |-
        Dank seines weichen Körpers bewegt es sich stets
        hüpfend fort. Wenn Fluffeluffs Temperatur steigt,
        ändert sich seine Farbe zu einem intensiven Pink.
      es: |-
        Se desplaza dando botes con su cuerpo mullido.
        Cuando aumenta su temperatura corporal, se va
        poniendo de un color rosa cada vez más intenso.
      it: |-
        Si sposta facendo rimbalzare il suo corpo
        morbido. Quando la sua temperatura corporea
        si alza, si colora di un rosa intenso.
