barboach:
  base_happiness: 50
  capture_rate: 190
  color: gray
  egg_groups:
    - water2
  evolution_chain: barboach
  evolves_from: ~
  flavor_text:
    ruby:
      en: |-
        BARBOACH’s sensitive whiskers serve
        as a superb radar system.
        This POKéMON hides in mud, leaving onlyits two whiskers exposed while it waits
        for prey to come along.
    sapphire:
      en: |-
        BARBOACH’s body is covered with a
        slimy film. If a foe grabs it, this
        POKéMON just slips out of the enemy’sgrip.
        This POKéMON grows weak if the slimy
        coating dries up.
    emerald:
      en: |-
        Its body is covered with a slimy film.
        The film acts as a barrier to prevent germs
        in muddy water from entering the
        BARBOACH’s body.
    firered:
      en: |-
        It probes muddy riverbeds with its two
        long whiskers. A slimy film protects its
        body.
    leafgreen:
      en: |-
        It probes muddy riverbeds with its two
        long whiskers. A slimy film protects its
        body.
    diamond:
      en: |-
        It coats its entire body with a
        slimy fluid so it can squirm and
        slip away if grabbed.
    pearl:
      en: |-
        Its whiskers make a superb radar.
        They are used to locate prey,
        even in the murkiest of water.
    platinum:
      en: |-
        Its slimy body is hard to grasp. In
        one region, it is said to have been
        born from hardened mud.
    heartgold:
      en: |-
        BARBOACH uses its whiskers to
        taste things just as a person uses
        his or her tongue to taste things.
    soulsilver:
      en: |-
        BARBOACH uses its whiskers to
        taste things just as a person uses
        his or her tongue to taste things.
    black:
      en: |-
        Its slimy body is hard to grasp. In
        one region, it is said to have been
        born from hardened mud.
      fr: |-
        Son corps glissant est difficile à
        attraper. On dit qu’il a été créé
        dans de la boue solidifiée.
    white:
      en: |-
        Its slimy body is hard to grasp. In
        one region, it is said to have been
        born from hardened mud.
      fr: |-
        Son corps glissant est difficile à
        attraper. On dit qu’il a été créé
        dans de la boue solidifiée.
    black-2:
      en: |-
        Its slimy body is hard to grasp. In
        one region, it is said to have been
        born from hardened mud.
    white-2:
      en: |-
        Its slimy body is hard to grasp. In
        one region, it is said to have been
        born from hardened mud.
    x:
      ja-Hrkt: |-
        ぜんしんが　ヌルヌルの　たいえきで
        おおわれているため　つかまっても
        ぬるりと　ぬけだすことが　できる。
      ja: |-
        全身が　ヌルヌルの　体液で
        覆われているため　捕まっても
        ぬるりと　抜け出すことが　できる。
      ko: |-
        전신이 미끈미끈한 체액으로
        덮여있기 때문에 잡아도
        미끈하게 빠져나갈 수 있다.
      en: |-
        It coats its entire body with a slimy fluid so it can
        squirm and slip away if grabbed.
      fr: |-
        Il enduit son corps d’une substance visqueuse pour
        glisser et se libérer quand on l’agrippe.
      de: |-
        Es bedeckt seinen Körper mit einer schleimigen
        Substanz und kann sich so aus Umklammerungen
        winden.
      es: |-
        Recubre su cuerpo de una película viscosa que le
        permite escapar si alguien lo agarra.
      it: |-
        Il suo corpo è ricoperto da una pellicola viscida,
        che gli permette di sgusciare via, se afferrato.
    'y':
      ja-Hrkt: |-
        ヒゲは　ゆうしゅうな　レーダー。
        にごった　みずの　なかでも　ヒゲを
        つかって　エサを　みつけだす。
      ja: |-
        ヒゲは　優秀な　レーダー。
        濁った　水の　中でも　ヒゲを　使って
        エサを　見つけ出す。
      ko: |-
        수염은 우수한 레이더다.
        탁해진 물속에서도 수염을
        써서 먹이를 찾아낸다.
      en: |-
        Its whiskers make a superb radar. They are used to
        locate prey, even in the murkiest of water.
      fr: |-
        Ses barbillons font un excellent radar qui lui permet
        de repérer ses proies, même en eau trouble.
      de: |-
        Seine Barthaare sind ein hervorragendes Radar.
        Mit ihnen spürt es selbst in Dreckwasser Beute auf.
      es: |-
        Sus bigotes le sirven de radar para localizar a sus
        presas, incluso en las aguas más turbias.
      it: |-
        I suoi baffi sono un eccellente radar. Possono
        localizzare le prede persino nelle acque più torbide.
    omega-ruby:
      ja-Hrkt: |-
        びんかんな　ヒゲは　すぐれた　レーダーだ。
        ドロの　なかから　２ほんの　ヒゲだけを　だして
        えものが　ちかよってくるのを　まちかまえている。
      ja: |-
        敏感な　ヒゲは　優れた　レーダーだ。
        ドロの　中から　２本の　ヒゲだけを　出して
        獲物が　近寄ってくるのを　待ち構えている。
      ko: |-
        민감한 수염은 우수한 레이더다.
        진흙 속에서 2개의 수염만을 내놓고
        먹이가 가까이 오는 것을 기다리고 있다.
      en: |-
        Barboach’s sensitive whiskers serve as a superb radar system.
        This Pokémon hides in mud, leaving only its two whiskers
        exposed while it waits for prey to come along.
      fr: |-
        Les vibrisses sensibles de Barloche agissent comme
        un système radar sophistiqué. Ce Pokémon se cache
        dans la boue, laissant dépasser ses vibrisses, et attend
        que sa proie passe à proximité.
      de: |-
        Schmerbes empfindliche Barthaare dienen ihm als
        hervorragendes Radarsystem. Dieses Pokémon versteckt sich
        im Schlamm, sodass nur noch seine Barthaare herausgucken,
        und wartet auf Beute.
      es: |-
        Barboach tiene unos bigotes sensibles que le sirven de
        infalible radar. Este Pokémon se sumerge en lodo y solo deja
        los bigotes por fuera de la superficie, al acecho, mientras
        espera a que llegue su presa.
      it: |-
        I sensibili baffi di Barboach fungono da sistema radar
        precisissimo. Il Pokémon vive nel fango, lasciando
        esposti soltanto i due baffi mentre attende pazientemente
        che si avvicini la preda.
    alpha-sapphire:
      ja-Hrkt: |-
        からだが　ヌルヌルの　まくで　おおわれているので
        てきに　つかまれても　ヌルリと　にげだせるのだ。
        ヌルヌルが　かわくと　からだが　よわってしまう。
      ja: |-
        体が　ヌルヌルの　膜で　覆われているので
        敵に　捕まれても　ヌルリと　逃げ出せるのだ。
        ヌルヌルが　乾くと　体が　弱ってしまう。
      ko: |-
        몸이 미끈미끈한 막으로 덮여 있어서
        적에게 붙잡혀도 매끄럽게 도망칠 수 있다.
        미끈미끈한 막이 마르면 몸이 약해진다.
      en: |-
        Barboach’s body is covered with a slimy film. If a foe grabs it,
        this Pokémon just slips out of the enemy’s grip. This Pokémon
        grows weak if the slimy coating dries up.
      fr: |-
        Le corps de Barloche est couvert d’un voile visqueux.
        Lorsqu’un ennemi l’attrape, ce Pokémon peut se glisser
        hors de son étreinte. Il s’affaiblit quand la pellicule
        visqueuse de son corps s’assèche.
      de: |-
        Schmerbes Körper ist mit einem schleimigen Film bedeckt.
        Wenn ein Gegner es packen will, entgeht es seinem Griff.
        Dieses Pokémon wird geschwächt, wenn sein schleimiger
        Überzug austrocknet.
      es: |-
        Barboach está completamente recubierto por una película
        viscosa. Si lo atrapan, puede escurrirse fácilmente. Si se le
        seca la capa viscosa, este Pokémon se debilitará.
      it: |-
        Il corpo di Barboach è coperto da una pellicola viscida.
        Se un nemico cerca di afferrarlo, il Pokémon gli scivola
        via dalle grinfie. Se la pellicola viscida si secca, Barboach
        si indebolisce.
    sun:
      ja-Hrkt: |-
        ２ほんのヒゲは　びんかんなレーダー。
        どろで　にごった　みずの　なかでも
        えものの　いちを　さっちするぞ。
      ja: |-
        ２本のヒゲは　敏感なレーダー。
        泥で　濁った　水の　中でも
        獲物の　位置を　察知するぞ。
      ko: |-
        2개의 수염은 민감한 레이더이다.
        진흙으로 탁해진 물속에서도
        먹이의 위치를 감지한다.
      zh-Hant: |-
        ２根鬍子是靈敏的雷達。
        即使在因為泥濘而渾濁的水中，
        也能偵查到獵物的位置。
      zh-Hans: |-
        ２根胡子是灵敏的雷达。
        即使在泥泞浑浊的水中，
        也能侦查到猎物的位置。
      en: |-
        Its two whiskers provide a sensitive radar.
        Even in muddy waters, it can detect its
        prey’s location.
      fr: |-
        Il se sert de ses barbillons comme d’un radar
        ultra-sophistiqué. Ils lui permettent de détecter
        ses proies même dans l’eau boueuse.
      de: |-
        Seine zwei Barthaare dienen als empfindliches
        Radarsystem. Selbst in schlammigem Wasser
        kennt es so die Position seiner Beute.
      es: |-
        Sus bigotes son muy sensibles y le sirven de
        radar. Puede detectar la posición de su presa
        incluso en el agua turbia de los lodazales.
      it: |-
        I suoi baffi sono un radar sensibilissimo, in grado
        di individuare la preda persino nelle acque
        più torbide.
    moon:
      ja-Hrkt: |-
        ヌメる　からだは　つかみにくい。
        すでで　つかまえる　かずを
        きそう　おまつりが　あるほど。
      ja: |-
        ヌメる　身体は　掴みにくい。
        素手で　捕まえる　数を
        競う　お祭りが　あるほど。
      ko: |-
        미끄러운 몸은 잡기 힘들다.
        맨손으로 잡은 수를
        겨루는 축제가 있을 정도다.
      zh-Hant: |-
        滑溜溜的身體很難抓住。
        有的祭典甚至會舉辦
        看能徒手捉住多少隻的比賽。
      zh-Hans: |-
        滑溜溜的身体很难抓牢。
        甚至因此诞生了比试
        徒手捕捉量的节日。
      en: |-
        Its slippery body is hard to grasp, so much so
        that there are festivals where people compete
        to see how many they can catch barehanded.
      fr: |-
        Son corps tout visqueux le rend impossible à
        attraper. Il existe des concours d’adresse dont
        le but est d’attraper des Barloche à mains nues.
      de: |-
        Sein schleimiger Körper ist schwer zu greifen.
        Auf Volksfesten wetteifert man gar, wer mit
        bloßen Händen die meisten fangen kann.
      es: |-
        Su cuerpo es tan escurridizo que incluso hay
        competiciones para ver cuántas veces puede
        ser agarrado con las manos desnudas.
      it: |-
        Il suo corpo viscido è così difficile da afferrare
        che nelle feste popolari si fa a gara a chi riesce
        a prenderne di più a mani nude.
    ultra-sun:
      ja-Hrkt: |-
        ぜんしん　ヌメヌメ。　とりポケモンに
        ついばまれても　ぬるりと　すべって
        にげだすことが　できるのだ。
      ja: |-
        全身　ヌメヌメ。　とりポケモンに
        ついばまれても　ぬるりと　滑って
        逃げ出すことが　できるのだ。
      ko: |-
        전신이 미끈미끈하다. 
        새포켓몬이 쪼아도 미끄덩
        미끄러져 도망칠 수 있다.
      zh-Hant: |-
        全身黏黏滑滑的，
        就算被鳥寶可夢啄到，
        也可以馬上滑開溜走。
      zh-Hans: |-
        全身滑腻腻的。
        即使被鸟宝可梦啄到，
        也能哧溜一下滑着逃走。
      en: |-
        Its entire body is gooey. When pecked at by
        bird Pokémon, it slips and slides its way
        to freedom.
      fr: |-
        Son corps est tout visqueux, ce qui lui permet
        de glisser entre les serres des Pokémon oiseaux
        afin de s’échapper.
      de: |-
        Sein glitschiger Körper ermöglicht es ihm, dem
        Schnabel von Vogel-Pokémon zu entkommen.
      es: |-
        Su cuerpo viscoso y resbaladizo le permite
        escapar indemne de las garras de los Pokémon
        pájaro que intentan atraparlo.
      it: |-
        Grazie al corpo viscido, riesce a sgusciare via
        dalla presa dei Pokémon alati e fuggire.
    ultra-moon:
      ja-Hrkt: |-
        ヒゲに　しんけいが　あつまっている。
        にんげんの　はなや　ベロの　ように
        においや　あじを　かんじとるぞ。
      ja: |-
        ヒゲに　神経が　集まっている。
        人間の　鼻や　ベロの　ように
        匂いや　味を　感じとるぞ。
      ko: |-
        수염에 신경이 모여 있다.
        인간의 코나 혀와 같이
        냄새나 맛을 감지해 낸다.
      zh-Hant: |-
        鬍鬚上滿是神經，
        能像人類的鼻子和舌頭
        那樣感知氣味和味道。
      zh-Hans: |-
        胡子上布满神经。
        能像人类的鼻子和舌头那样
        感知气味和味道。
      en: |-
        Its whiskers are filled with nerves. They can
        sense smells and flavors just as a person’s nose
        or tongue would.
      fr: |-
        Ses barbillons sont des organes sensoriels :
        ils peuvent détecter le goût et les odeurs,
        comme le font la langue et le nez des humains.
      de: |-
        In seinen Barthaaren laufen Nervenstränge
        zusammen. Damit riecht und schmeckt es wie
        Menschen mit ihrer Nase und Zunge.
      es: |-
        Sus bigotes contienen terminaciones nerviosas.
        Eso les permite captar olores y sabores, como
        si fueran la nariz o la lengua de un ser humano.
      it: |-
        I suoi baffi sono ricchi di terminazioni nervose e
        percepiscono odori e sapori come il naso e la
        lingua nell’essere umano.
    sword:
      ja-Hrkt: |-
        ぬるぬるの　からだは　つかみにくい。
        ある　ちほうでは　どろが　かたまって
        ドジョッチが　うまれたと　いわれる。
      ja: |-
        ぬるぬるの　体は　掴みにくい。
        ある　地方では　泥が　固まって
        ドジョッチが　生まれたと　いわれる。
      ko: |-
        미끈미끈한 몸은 잡기 어렵다.
        어떤 지방에서는 진흙이 굳어져서
        미꾸리가 생겨났다고 전해진다.
      zh-Hant: |-
        身體滑溜溜的很難抓住。
        某個地區流傳著泥泥鰍
        是由泥土凝結而成的說法。
      zh-Hans: |-
        身体滑溜溜的很难抓住。
        某个地区流传着泥泥鳅
        是由泥土凝结而成的说法。
      en: |-
        Its slimy body is hard to grasp. In one region, it is
        said to have been born from hardened mud.
      fr: |-
        Son corps glissant est difficile à attraper.
        Dans une certaine région, on raconte qu’il est né
        à partir de boue solidifiée.
      de: |-
        Sein schleimiger Körper ist schwer zu greifen.
        In einer Region sagt man, es sei aus gehärtetem
        Schlamm entstanden.
      es: |-
        Su escurridizo cuerpo es difícil de agarrar. En
        cierta región se dice que ha nacido de barro
        endurecido.
      it: |-
        Ha un corpo viscido e difficile da afferrare.
        In una regione si dice che sia nato da fango
        indurito.
    shield:
      ja-Hrkt: |-
        ２ほんの　ながい　ヒゲで　にごった
        かわぞこを　さぐる。　ヌルヌルした
        ねんまくが　からだを　まもっている。
      ja: |-
        ２本の　長い　ヒゲで　濁った
        川底を　探る。　ヌルヌルした
        粘膜が　体を　守っている。
      ko: |-
        2개의 긴 수염으로 탁한
        강바닥을 더듬는다. 미끈미끈한
        점막으로 몸을 보호한다.
      zh-Hant: |-
        會用２根長長的鬍鬚
        探索渾濁的河底。
        用濕滑的黏膜保護著身體。
      zh-Hans: |-
        会用２根长长的胡须
        探索浑浊的河底。
        用湿滑的粘膜保护着身体。
      en: |-
        It probes muddy riverbeds with its two long
        whiskers. A slimy film protects its body.
      fr: |-
        Il sonde les bords boueux des rivières
        avec ses barbillons.
        Un film fin et visqueux protège tout son corps.
      de: |-
        Es untersucht schlammige Flussbetten mit seinen
        beiden langen Schnurrhaaren. Sein Körper wird
        von einem Schleimfilm geschützt.
      es: |-
        Examina los lechos lodosos de los ríos con los
        largos bigotes que tiene. Está protegido por una
        capa viscosa.
      it: |-
        Si serve dei lunghi baffi per saggiare i letti
        fangosi dei fiumi. Ha il corpo protetto da
        una membrana viscida.
