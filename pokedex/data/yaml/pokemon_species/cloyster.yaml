    black-2:
      en: |-
        It fights by keeping its shell
        tightly shut for protection and
        by shooting spikes to repel foes.
    white-2:
      en: |-
        It fights by keeping its shell
        tightly shut for protection and
        by shooting spikes to repel foes.
    x:
      ja-Hrkt: |-
        しおのながれが　はげしい　うみに
        せいそくしている　パルシェンの
        カラのトゲは　おおきく　するどい。
      ja: |-
        潮の　流れが　激しい　海に
        生息している　パルシェンの
        殻の　トゲは　大きく　鋭い。
      ko: |-
        조수의 흐름이 격한 바다에
        서식하고 있는 파르셀의
        껍질의 가시는 크고 날카롭다.
      en: |-
        Cloyster that live in seas with harsh tidal currents
        grow large, sharp spikes on their shells.
      fr: |-
        Les Crustabri vivant dans des mers aux courants forts
        développent des dards sur leur coquille.
      de: |-
        Austos, die im Meer mit starker Strömung leben,
        werden groß und entwickeln scharfe Stacheln.
      es: |-
        A los Cloyster que viven en las fuertes corrientes
        marinas les crecen largas y afiladas púas en la concha.
      it: |-
        Ai Cloyster che vivono in mari con forti maree
        crescono grandi aculei affilati sui gusci.
    'y':
      ja-Hrkt: |-
        カラが　ひじょうに　かたく
        ナパームだんでも　こわせない。
        こうげきするときだけ　ひらく。
      ja: |-
        殻が　非常に　硬く
        ナパーム弾でも　壊せない。
        攻撃するときだけ　開く。
      ko: |-
        껍데기가 상당히 단단하여
        네이팜탄으로도 부술 수 없다.
        공격할 때만 연다.
      en: |-
        Its shell is extremely hard. It cannot be shattered,
        even with a bomb. The shell opens only when it
        is attacking.
      fr: |-
        Sa coquille est extrêmement résistante. Rien ne peut
        la détruire, pas même une bombe. Il ne l’ouvre que
        lorsqu’il attaque.
      de: |-
        Sein Panzer ist extrem hart. Es kann nicht
        zerschmettert werden, auch nicht durch eine Bombe.
        Der Panzer öffnet sich nur, wenn es angreift.
      es: |-
        La concha que lo cubre es extremadamente dura.
        No es posible causarle rasguños y solo se abre si lo
        atacan.
      it: |-
        Neppure una bomba può scalfire il suo duro guscio,
        che apre soltanto quando sta attaccando.
    omega-ruby:
      ja-Hrkt: |-
        のみこんだ　かいすいを　うしろへ　いきおい　よく
        ふんしゃする　ことで　うみの　なかを　およぐ。
        トゲを　はっしゃする　しくみも　おなじ。
      ja: |-
        飲み込んだ　海水を　後ろへ　勢い　よく
        噴射する　ことで　海の　中を　泳ぐ。
        トゲを　発射する　仕組みも　同じ。
      ko: |-
        들이마신 바닷물을 뒤쪽으로 기운차게
        뿜어내서 바닷속을 헤엄친다.
        같은 방법으로 가시도 발사한다.
      en: |-
        Cloyster is capable of swimming in the sea. It does so by
        swallowing water, then jetting it out toward the rear.
        This Pokémon shoots spikes from its shell using the
        same system.
      fr: |-
        Crustabri est capable de se déplacer dans les fonds marins
        en avalant de l’eau et en la rejetant vers l’arrière.
        Ce Pokémon envoie des pointes en utilisant la même méthode.
      de: |-
        Austos kann im Meerwasser schwimmen, indem es Wasser
        schluckt und wieder herausspritzt. Dieses Pokémon kann
        sich auch verteidigen, indem es spitze Stacheln mithilfe
        des Wasserdrucks verschießt.
      es: |-
        Cloyster es capaz de nadar por el mar. Su técnica consiste en
        tragar agua y expulsarla por el conducto que tiene en la parte
        trasera. Este mismo sistema es el que usa para lanzar los
        pinchos que tiene alrededor de la concha.
      it: |-
        Cloyster è in grado di nuotare in mare aperto, ingerendo
        acqua dalla bocca per poi espellerla violentemente
        a mo’ di propulsore. Questo Pokémon usa lo stesso
        metodo per sparare punte dalla conchiglia.
    alpha-sapphire:
      ja-Hrkt: |-
        のみこんだ　かいすいを　うしろへ　いきおい　よく
        ふんしゃする　ことで　うみの　なかを　およぐ。
        トゲを　はっしゃする　しくみも　おなじ。
      ja: |-
        飲み込んだ　海水を　後ろへ　勢い　よく
        噴射する　ことで　海の　中を　泳ぐ。
        トゲを　発射する　仕組みも　同じ。
      ko: |-
        들이마신 바닷물을 뒤쪽으로 기운차게
        뿜어내서 바닷속을 헤엄친다.
        같은 방법으로 가시도 발사한다.
      en: |-
        Cloyster is capable of swimming in the sea. It does so by
        swallowing water, then jetting it out toward the rear. This
        Pokémon shoots spikes from its shell using the same system.
      fr: |-
        Crustabri est capable de se déplacer dans les fonds marins
        en avalant de l’eau et en la rejetant vers l’arrière.
        Ce Pokémon envoie des pointes en utilisant la même méthode.
      de: |-
        Austos kann im Meerwasser schwimmen, indem es Wasser
        schluckt und mit Druck wieder herausspritzt. Auf dieselbe
        Weise verschießt dieses Pokémon scharfe Stacheln.
      es: |-
        Cloyster es capaz de nadar por el mar. Su técnica consiste en
        tragar agua y expulsarla por el conducto que tiene en la parte
        trasera. Este mismo sistema es el que usa para lanzar los
        pinchos que tiene alrededor de la concha.
      it: |-
        Cloyster è in grado di nuotare in mare aperto, ingerendo
        acqua dalla bocca per poi espellerla violentemente
        a mo’ di propulsore. Questo Pokémon usa lo stesso
        metodo per sparare punte dalla conchiglia.
    sun:
      ja-Hrkt: |-
        かたいカラは　ナパームだん　でも
        くだけない。　カラの　なかみの
        しょうたいは　いまだ　ふめい。
      ja: |-
        硬い殻は　ナパーム弾　でも
        砕けない。　カラの　中味の
        正体は　未だ　不明。
      ko: |-
        단단한 껍질은 폭탄이라도
        깨지지 않는다. 껍질 속의
        정체는 아직 밝혀지지 않았다.
      zh-Hant: |-
        堅硬的外殼連凝固汽油彈也無法擊碎。
        殼裡的真面目至今仍然不得而知。
      zh-Hans: |-
        坚硬的外壳连燃烧弹也无法击碎。
        壳中的正身至今不明。
      en: |-
        Its hard shell cannot be shattered—not even
        by a bomb. The contents of the shell
        remain unknown.
      fr: |-
        Sa carapace peut même résister à une bombe
        au napalm. Personne ne sait ce qu’elle dissimule.
      de: |-
        Seine Schale ist so hart, dass nicht einmal eine
        Bombe sie zerschmettern kann. Bis heute weiß
        niemand, wie das Innere seiner Schale aussieht.
      es: |-
        Su dura concha es capaz de aguantar el impacto
        de una bomba. La forma de su cuerpo, oculto en
        el interior, sigue siendo un misterio.
      it: |-
        Il suo guscio non può essere scalfito neanche
        da una bomba. Nessuno sa cosa si cela
        al suo interno.
    moon:
      ja-Hrkt: |-
        カラから　ぬけた　トゲで　つくった
        ヤリが　しゅりょうみんぞくの
        こふんから　たくさん　しゅつどする。
      ja: |-
        殻から　抜けた　トゲで　造った
        ヤリが　狩猟民族の
        古墳から　たくさん　出土する。
      ko: |-
        껍질에서 떨어진 가시로 만든
        창이 수렵 민족의
        고분에서 많이 출토되었다.
      zh-Hant: |-
        從狩獵民族的古墓中大量
        出土了使用殼上拔下的尖刺
        製造而成的長矛。
      zh-Hans: |-
        从狩猎民族的古墓中大量
        出土了使用壳上拔下的尖刺
        制造而成的长矛。
      en: |-
        Excavation of the tombs of ancient hunting
        tribes has turned up many spears tipped with
        spikes that had fallen off this Pokémon’s shell.
      fr: |-
        Les archéologues qui explorent les tombes de
        chasseurs primitifs trouvent souvent des lances
        faites avec des épines tombées de sa carapace.
      de: |-
        In Gräbern alter Jägervölker werden oft Speere
        ausgegraben, welche aus abgebrochenen
        Stacheln seiner Schale gefertigt wurden.
      es: |-
        Se han desenterrado numerosas lanzas hechas
        con pinchos de la concha de Cloyster. Eran
        utilizadas por antiguos pueblos de cazadores.
      it: |-
        Nei tumuli di popoli dediti alla caccia sono state
        rinvenute lance fabbricate con aculei provenienti
        dal guscio di questo Pokémon.
    ultra-sun:
      ja-Hrkt: |-
        とても　かたいカラを　もつ。　カラに
        ついた　キズは　しだいに　もりあがり
        おおきく　するどいトゲへと　そだつ。
      ja: |-
        とても　硬いカラを　持つ。　カラに
        ついた　キズは　次第に　盛り上がり
        大きく　鋭いトゲへと　育つ。
      ko: |-
        매우 단단한 껍질을 갖고 있다.
        껍질에 생긴 상처는 점점 부풀어서
        크고 날카로운 가시로 자란다.
      zh-Hant: |-
        擁有極為堅硬的外殼。
        外殼上的傷痕會逐漸隆起，
        最後變成巨大的尖刺。
      zh-Hans: |-
        拥有非常坚硬的外壳。
        外壳上的伤痕会逐渐隆起，
        长成大大的尖刺。
      en: |-
        If areas of Cloyster’s very hard shell get
        damaged, those areas swell, gradually growing
        into large sharp spikes.
      fr: |-
        Il a une coquille à toute épreuve. En cicatrisant,
        les blessures sur ses valves forment des
        excroissances qui évoluent en dards pointus.
      de: |-
        Seine Schale ist extrem hart. Schäden an der
        Schale schwellen zunächst an und entwickeln
        sich allmählich zu großen, scharfen Stacheln.
      es: |-
        Su concha es increíblemente dura. Las heridas
        que recibe en la misma, al cicatrizar, generan
        enormes púas afiladas.
      it: |-
        Ha un guscio estremamente duro. Le parti
        danneggiate si ispessiscono fino a diventare
        dei grossi aculei affilati.
    ultra-moon:
      ja-Hrkt: |-
        ヤドンの　シッポが　だいこうぶつ。
        ときには　りくに　はいあがってまで
        ヤドンを　さがすことも　あるほど。
      ja: |-
        ヤドンの　シッポが　大好物。
        ときには　陸に　はいあがってまで
        ヤドンを　探すことも　あるほど。
      ko: |-
        야돈의 꼬리를 아주 좋아한다.
        때로는 육지에 기어 올라와서
        야돈을 찾을 때도 있을 정도다.
      zh-Hant: |-
        最愛吃呆呆獸的尾巴。
        有時甚至會爬到陸地上
        來尋找呆呆獸。
      zh-Hans: |-
        非常喜欢吃呆呆兽的尾巴。
        有时甚至会爬到陆地上
        来寻找呆呆兽。
      en: |-
        Slowpoke tails are its favorite food. It has even
        been known to come up on land to look for
        Slowpoke from time to time.
      fr: |-
        Il raffole tant des queues de Ramoloss qu’il
        lui arrive de ramper jusqu’à la terre ferme
        pour rechercher son péché mignon.
      de: |-
        Flegmon-Ruten sind seine Leibspeise. Manchmal
        kriecht es sogar an Land, nur um nach Flegmon
        zu suchen.
      es: |-
        Las colas de Slowpoke le gustan tanto que en
        ocasiones llega incluso a aventurarse en tierra
        firme en busca de este Pokémon.
      it: |-
        A volte sale sulla terraferma in cerca di
        Slowpoke perché va matto per la sua coda.
    lets-go-pikachu:
      ja-Hrkt: |-
        ダイヤモンドよりも　かたいカラで
        まもるだけでなく　ついている　トゲを
        とばしてくるので　かなり　てごわい。
      ja: |-
        ダイヤモンドよりも　硬いカラで
        守るだけでなく　ついている　トゲを
        飛ばしてくるので　かなり　手ごわい。
      ko: |-
        다이아몬드보다 단단한 껍질로
        몸을 지킬 뿐만 아니라 달린 가시를
        쏘아 대기 때문에 상당히 벅찬 상대다.
      zh-Hant: |-
        不但會用比鑽石還硬的外殼
        保護自己，還會發射殼上的
        尖刺來進行攻擊，很不好對付。
      zh-Hans: |-
        不但有比钻石还要坚硬的
        外壳保护着，还能发射
        壳上的刺，不太好对付。
      en: |-
        For protection, it uses its harder-than-diamond
        shell. It also shoots spikes from the shell.
      fr: |-
        Sa coquille, plus dure que le diamant,
        le protège. Elle peut aussi envoyer de
        redoutables volées de dards.
      de: |-
        Es wird von einer Schale geschützt, die härter als
        Diamant ist. Dieses gefährliche Pokémon feuert
        die Stacheln an seiner Schale auf Gegner ab.
      es: |-
        Se protege con su concha, que es más dura que
        un diamante. Su capacidad de lanzar pinchos lo
        convierte en un rival temible.
      it: |-
        Usa la sua conchiglia dura come il diamante
        per proteggersi e può anche scagliare gli
        aculei di cui è dotata per attaccare.
    lets-go-eevee:
      ja-Hrkt: |-
        ダイヤモンドよりも　かたいカラで
        まもるだけでなく　ついている　トゲを
        とばしてくるので　かなり　てごわい。
      ja: |-
        ダイヤモンドよりも　硬いカラで
        守るだけでなく　ついている　トゲを
        飛ばしてくるので　かなり　手ごわい。
      ko: |-
        다이아몬드보다 단단한 껍질로
        몸을 지킬 뿐만 아니라 달린 가시를
        쏘아 대기 때문에 상당히 벅찬 상대다.
      zh-Hant: |-
        不但會用比鑽石還硬的外殼
        保護自己，還會發射殼上的
        尖刺來進行攻擊，很不好對付。
      zh-Hans: |-
        不但有比钻石还要坚硬的
        外壳保护着，还能发射
        壳上的刺，不太好对付。
      en: |-
        For protection, it uses its harder-than-diamond
        shell. It also shoots spikes from the shell.
      fr: |-
        Sa coquille, plus dure que le diamant,
        le protège. Elle peut aussi envoyer de
        redoutables volées de dards.
      de: |-
        Es wird von einer Schale geschützt, die härter als
        Diamant ist. Dieses gefährliche Pokémon feuert
        die Stacheln an seiner Schale auf Gegner ab.
      es: |-
        Se protege con su concha, que es más dura que
        un diamante. Su capacidad de lanzar pinchos lo
        convierte en un rival temible.
      it: |-
        Usa la sua conchiglia dura come il diamante
        per proteggersi e può anche scagliare gli
        aculei di cui è dotata per attaccare.
    sword:
      ja-Hrkt: |-
        カラが　ひじょうに　かたく
        ナパームだんでも　こわせない。
        こうげきするときだけ　ひらく。
      ja: |-
        殻が　非常に　硬く
        ナパーム弾でも　壊せない。
        攻撃するときだけ　開く。
      ko: |-
        껍데기가 상당히 단단하여
        네이팜탄으로도 부술 수 없다.
        공격할 때만 연다.
      zh-Hant: |-
        貝殼非常堅硬，
        連凝固汽油彈都無法破壞。
        只有攻擊的時候才會張開。
      zh-Hans: |-
        贝壳非常坚硬，
        连燃烧弹都无法破坏。
        只有攻击的时候才会张开。
      en: |-
        Its shell is extremely hard. It cannot be shattered,
        even with a bomb. The shell opens only when it
        is attacking.
      fr: |-
        Sa coquille est tellement résistante que rien
        ne peut la détruire, pas même une déflagration.
        Il ne l’ouvre que lorsqu’il attaque.
      de: |-
        Seine Schale ist extrem hart und kann nicht
        einmal durch eine Bombe zerschmettert werden.
        Sie öffnet sich nur, wenn es angreift.
      es: |-
        La concha que lo cubre es extremadamente dura,
        hasta el punto de que ni siquiera una bomba
        puede destrozarla. Solo se abre cuando ataca.
      it: |-
        Neppure una bomba può scalfire il suo duro
        guscio, che apre soltanto quando sta attaccando.
    shield:
      ja-Hrkt: |-
        いちど　カラを　とじてしまうと
        どんな　かいりきの　もちぬしでも
        あけることは　ふかのうだ。
      ja: |-
        いちど　殻を　閉じてしまうと
        どんな　怪力の　持ち主でも
        開けることは　不可能だ。
      ko: |-
        한번 껍질을 닫아버리면
        어떤 괴력의 소유자도
        여는 것은 불가능하다.
      zh-Hant: |-
        一旦牠把殼閉上，
        無論是擁有什麼樣怪力的人
        都無法將其打開。
      zh-Hans: |-
        一旦它把壳闭上，
        无论是拥有什么样怪力的人
        都无法将其打开。
      en: |-
        Once it slams its shell shut, it is impossible to
        open, even by those with superior strength.
      fr: |-
        Quand il referme sa coquille, il est impossible de
        la rouvrir, même avec une force hors du commun.
      de: |-
        Ist seine Schale erst geschlossen, ist es selbst mit
        viel Kraft nicht mehr möglich, diese zu öffnen.
      es: |-
        Una vez que ha cerrado la concha, es imposible
        abrirla, independientemente de la fuerza que se
        ejerza.
      it: |-
