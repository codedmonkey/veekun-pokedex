  flavor_text:
    ruby:
      en: |-
        SEVIPER shares a generations-long
        feud with ZANGOOSE. The scars on its
        body are evidence of vicious battles.This POKéMON attacks using its sword-
        edged tail.
    sapphire:
      en: |-
        SEVIPER’s swordlike tail serves two
        purposes - it slashes foes and douses
        them with secreted poison.This POKéMON will not give up its long-
        running blood feud with ZANGOOSE.
    emerald:
      en: |-
        SEVIPER and ZANGOOSE are eternal rivals.
        It counters a ZANGOOSE’s dazzling agility
        with its swordlike tail, which also oozes
        a horrible poison.
    firered:
      en: |-
        It sharpens its swordlike tail on hard
        rocks. It hides in tall grass and strikes
        unwary prey with venomous fangs.
    leafgreen:
      en: |-
        It sharpens its swordlike tail on hard
        rocks. It hides in tall grass and strikes
        unwary prey with venomous fangs.
    diamond:
      en: |-
        For many generations, it has
        feuded with ZANGOOSE. It whets its
        bladed tail on rocks for battle.
    pearl:
      en: |-
        For many generations, it has
        feuded with ZANGOOSE. It whets its
        bladed tail on rocks for battle.
    platinum:
      en: |-
        For many generations, it has
        feuded with ZANGOOSE. It whets its
        bladed tail on rocks for battle.
    heartgold:
      en: |-
        In battle, it uses its bladed tail to
        counter any ZANGOOSE. It secretes
        a deadly venom in its tail.
    soulsilver:
      en: |-
        In battle, it uses its bladed tail to
        counter any ZANGOOSE. It secretes
        a deadly venom in its tail.
    black:
      en: |-
        For many generations, it has
        feuded with Zangoose. It whets its
        bladed tail on rocks for battle.
      fr: |-
        Le rival historique de Mangriff.
        Il affûte la lame de sa queue 
        sur les rochers avant le combat.
    white:
      en: |-
        For many generations, it has
        feuded with Zangoose. It whets its
        bladed tail on rocks for battle.
      fr: |-
        Le rival historique de Mangriff.
        Il affûte la lame de sa queue 
        sur les rochers avant le combat.
    black-2:
      en: |-
        Constant polishing makes the edge
        of the blade on its tail extremely sharp.
        It’s Zangoose’s archrival.
    white-2:
      en: |-
        Constant polishing makes the edge
        of the blade on its tail extremely sharp.
        It’s Zangoose’s archrival.
    x:
      ja-Hrkt: |-
        もうどくが　しみだしている
        するどい　きれあじの　しっぽで
        すばやい　ザングースに　たちむかう。
      ja: |-
        猛毒が　染み出している
        鋭い　切れ味の　尻尾で
        素早い　ザングースに　立ち向かう。
      ko: |-
        맹독이 배어 나오는
        예리하고 잘 드는 꼬리로
        재빠른 쟝고에게 맞선다.
      en: |-
        In battle, it uses its bladed tail to counter any
        Zangoose. It secretes a deadly venom in its tail.
      fr: |-
        Il rivalise avec Mangriff grâce à la lame affûtée de
        sa queue qui sécrète un puissant venin.
      de: |-
        Die flinken Angriffe von Sengo kontert es mit
        seinem messerscharfen Schweif, aus dem Gift austritt.
      es: |-
        Hace frente a Zangoose con su agilidad y su afilada
        cola, que está cargada con un veneno letal.
      it: |-
        Respinge gli attacchi dell’agile Zangoose con la
        coda affilatissima, che secerne un micidiale veleno.
    'y':
      ja-Hrkt: |-
        しっぽの　かたなは　いつも　いわで
        といでいるので　きれあじ　ばつぐん。
        ザングースとは　いんねんの　あいだ。
      ja: |-
        尻尾の　刀は　いつも　岩で
        研いでいるので　切れ味　ばつぐん。
        ザングースとは　因縁の　あいだ。
      ko: |-
        꼬리의 칼은 항상 바위로
        갈고 있어 날카로움이 뛰어나다.
        쟝고와는 사연이 깊은 사이다.
      en: |-
        Constant polishing makes the edge of the blade on
        its tail extremely sharp. It’s Zangoose’s archrival.
      fr: |-
        Il affûte la lame de sa queue sur des rochers pour
        la rendre bien tranchante. Le rival de longue date
        de Mangriff.
      de: |-
        Es hält die Klinge an seinem Schweif scharf,
        indem es sie ständig an Steinen wetzt. Es ist
        der Erzfeind von Sengo.
      es: |-
        Le une una relación de enemistad con Zangoose.
        Se lima con las rocas su cola en forma de espada
        para tenerla afilada.
      it: |-
        Affila di continuo la lama della sua coda sulle rocce
        per renderla taglientissima. È un acerrimo nemico di
        Zangoose.
    omega-ruby:
      ja-Hrkt: |-
        せんぞだいだい　ザングースと　たたかってきた。
        からだの　キズは　はげしい　たたかいの　しるし。
        するどい　きれあじの　しっぽで　こうげきするぞ。
      ja: |-
        先祖代々　ザングースと　戦ってきた。
        体の　キズは　激しい　戦いの　印。
        鋭い　切れ味の　尻尾で　攻撃するぞ。
      ko: |-
        조상 대대로 쟝고와 싸워왔다.
        몸의 상처는 격렬한 싸움의 증거다.
        날카롭고 예리한 꼬리로 공격한다.
      en: |-
        Seviper shares a generations-long feud with Zangoose.
        The scars on its body are evidence of vicious battles.
        This Pokémon attacks using its sword-edged tail.
      fr: |-
        Séviper se querelle avec Mangriff depuis plusieurs générations.
        Ses cicatrices sont les preuves de ses nombreux combats.
        Ce Pokémon attaque à l’aide de sa queue, aiguisée comme
        une épée.
      de: |-
        Vipitis lebt seit Generationen in Fehde mit Sengo.
        Die Narben auf seinem Körper sind Zeugen grausamer
        Kämpfe. Dieses Pokémon greift seine Gegner mit seinem
        scharfkantigen Schweif an.
      es: |-
        Seviper lleva años de gran enemistad con Zangoose. Las
        cicatrices que tiene por todo el cuerpo dan buena muestra de
        los encarnizados combates en los que se han enfrentado.
        Seviper ataca usando su cola con forma de espada.
      it: |-
        Da generazioni Seviper è in lotta contro Zangoose,
        suo nemico dichiarato. Le cicatrici sul suo corpo sono prove
        di scontri efferati. Questo Pokémon attacca usando la coda
        a forma di spada.
    alpha-sapphire:
      ja-Hrkt: |-
        かたなの　ような　しっぽは　てきを　きりさくのと
        どうじに　しみだした　もうどくを　あびせるぞ。
        しゅくてき　ザングースと　たたかい　つづける。
      ja: |-
        刀の　ような　尻尾は　敵を　切り裂くのと
        同時に　染み出した　猛毒を　浴びせるぞ。
        宿敵　ザングースと　戦い　続ける。
      ko: |-
        칼과 같은 꼬리는 적을 베어 가르는
        동시에 스며 나온 맹독을 끼얹는다.
        숙적인 쟝고와 계속하여 싸운다.
      en: |-
        Seviper’s swordlike tail serves two purposes—it slashes foes
        and douses them with secreted poison. This Pokémon will not
        give up its long-running blood feud with Zangoose.
      fr: |-
        La queue tranchante comme un sabre de Séviper a
        deux fonctions : elle peut frapper l’ennemi et lui injecter
        un poison qu’il sécrète. Ce Pokémon n’oublie jamais
        sa vieille rancune envers Mangriff.
      de: |-
        Vipitis kann mit seinem Schweif Feinden einen Hieb versetzen
        und sie mit einem abgesonderten Gift bespritzen. Dieses
        Pokémon wird in der langwährenden Blutfehde mit Sengo
        nicht nachgeben.
      es: |-
        Seviper tiene una cola que parece una espada y le sirve para
        dar un sablazo al enemigo y para envenenarlo. Este Pokémon
        se mantiene firme en la enemistad que siente hacia Zangoose.
      it: |-
        La coda a forma di spada di Seviper ha una duplice funzione:
        lacera il nemico e gli inietta un potente veleno.
        Il Pokémon non dimentica mai le lotte con il suo secolare
        nemico, Zangoose.
