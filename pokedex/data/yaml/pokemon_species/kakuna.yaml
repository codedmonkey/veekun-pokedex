    x:
      ja-Hrkt: |-
        じぶんでは　ほとんど　うごけないが
        あぶないときは　かたくなって
        みを　まもっているようだ。
      ja: |-
        自分では　ほとんど　動けないが
        危ないときは　硬くなって
        身を守っているようだ。
      ko: |-
        스스로는 거의 움직일 수 없지만
        위험할 때는 단단해져서
        몸을 보호하고 있는 것 같다.
      en: |-
        Almost incapable of moving, this Pokémon can only
        harden its shell to protect itself when it is
        in danger.
      fr: |-
        Incapable de se déplacer de lui-même, il se défend en
        durcissant sa carapace.
      de: |-
        Dieses Pokémon kann sich kaum bewegen.
        Bei drohender Gefahr verhärtet es seinen Panzer.
      es: |-
        Casi incapaz de moverse, este Pokémon solo puede
        endurecer su caparazón para protegerse.
      it: |-
        Quasi incapace di muoversi, questo Pokémon può
        solo indurire il proprio guscio per proteggersi.
    'y':
      ja-Hrkt: |-
        てんてきに　みつからないように
        はっぱの　うらや　えだの　すきまに
        かくれて　しんかの　ときを　まつ。
      ja: |-
        天敵に　見つからないように
        葉っぱの　裏や　枝の　すきまに　隠れて
        進化の　ときを　待つ。
      ko: |-
        천적에게 발견되지 않도록
        잎사귀 뒷면이나 가지의 틈새에
        숨어서 진화할 때를 기다린다.
      en: |-
        While awaiting evolution, it hides from predators
        under leaves and in nooks of branches.
      fr: |-
        Il se cache sous les feuilles et les branches pour fuir
        les prédateurs en attendant d’évoluer.
      de: |-
        Während es auf seine Entwicklung wartet, versteckt es
        sich unter Blättern und zwischen Ästen.
      es: |-
        Se esconde de sus atacantes entre las ramas de los
        árboles mientras espera a evolucionar.
      it: |-
        Si nasconde dai predatori dietro le foglie e fra i rami,
        in attesa dell’evoluzione.
    omega-ruby:
      ja-Hrkt: |-
        ほとんど　うごかず　きに　つかまっているが
        なかでは　しんかの　じゅんびで　おおいそがし。
        その　しょうこに　からだが　あつくなっているぞ。
      ja: |-
        ほとんど　動かず　木に　つかまっているが
        中では　進化の　準備で　大忙し。
        その　証拠に　体が　熱くなっているぞ。
      ko: |-
        거의 움직이지 않고 나무에 매달려 있지만
        내부는 진화 준비로 굉장히 바쁜 상태다.
        그 증거로 몸이 뜨거워져 있다.
      en: |-
        Kakuna remains virtually immobile as it clings to a tree.
        However, on the inside, it is extremely busy as it prepares for
        its coming evolution. This is evident from how hot the shell
        becomes to the touch.
      fr: |-
        Coconfort est la plupart du temps immobile et reste
        accroché à un arbre. Cependant, intérieurement, il est
        très actif, car il se prépare pour sa prochaine évolution.
        En touchant sa carapace, on peut sentir sa chaleur.
      de: |-
        Kokuna bewegt sich kaum, wenn es an einem Baum haftet.
        In seinem Inneren jedoch regt sich einiges, da es sich auf
        seine bevorstehende Entwicklung vorbereitet. Dabei wird
        seine Schale sehr heiß.
      es: |-
        Kakuna permanece prácticamente inmóvil al encaramarse a
        los árboles, aunque la actividad interna de su organismo
        tiene un ritmo frenético, pues se prepara para su evolución.
        Prueba de esto es la alta temperatura de su caparazón.
      it: |-
        Kakuna rimane praticamente immobile abbarbicato agli alberi.
        Tuttavia, internamente è intento a preparare la sua futura
        evoluzione. Lo si può capire dall’intensità del calore
        sviluppato dal guscio.
    alpha-sapphire:
      ja-Hrkt: |-
        ほとんど　うごかず　きに　つかまっているが
        なかでは　しんかの　じゅんびで　おおいそがし。
