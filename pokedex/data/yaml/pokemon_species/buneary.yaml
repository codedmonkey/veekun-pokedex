buneary:
  base_happiness: 0
  capture_rate: 190
  color: brown
  egg_groups:
    - ground
    - humanshape
  evolution_chain: buneary
  evolves_from: ~
  flavor_text:
    diamond:
      en: |-
        It slams foes by sharply uncoiling
        its rolled ears. It stings enough
        to make a grown-up cry in pain.
    pearl:
      en: |-
        When it senses danger, it perks up
        its ears. On cold nights, it sleeps
        with its head tucked into its fur.
    platinum:
      en: |-
        Its ears are always rolled up. They
        can be forcefully extended to
        shatter even a large boulder.
    heartgold:
      en: |-
        You can tell how it feels by the way
        it rolls its ears. When it’s scared,
        both ears are rolled up.
    soulsilver:
      en: |-
        You can tell how it feels by the way
        it rolls its ears. When it’s scared,
        both ears are rolled up.
    black:
      en: |-
        Its ears are always rolled up. They
        can be forcefully extended to
        shatter even a large boulder.
      fr: |-
        Ses oreilles repliées se déroulent
        avec une force capable de briser
        un gros rocher.
    white:
      en: |-
        Its ears are always rolled up. They
        can be forcefully extended to
        shatter even a large boulder.
      fr: |-
        Ses oreilles repliées se déroulent
        avec une force capable de briser
        un gros rocher.
    black-2:
      en: |-
        By extending its rolled-up ears
        and striking the ground, it can
        bound so high it surprises itself.
    white-2:
      en: |-
        By extending its rolled-up ears
        and striking the ground, it can
        bound so high it surprises itself.
    x:
      ja-Hrkt: |-
        いつも　まるめている　みみを
        いきおいよく　のばすと　おおきな
        いわも　かんたんに　こわせる。
      ja: |-
        いつも　まるめている　耳を
        勢いよく　伸ばすと　大きな
        岩も　簡単に　壊せる。
      ko: |-
        항상 말고 있는 귀를
        힘껏 늘리면 커다란
        바위도 간단히 부순다.
      en: |-
        Its ears are always rolled up. They can be forcefully
        extended to shatter even a large boulder.
      fr: |-
        Ses oreilles repliées se déroulent avec une force
        capable de briser un gros rocher.
      de: |-
        Seine Ohren sind immer aufgerollt. Mit ihnen kann
        es selbst große Felsbrocken zertrümmern.
      es: |-
        Lleva las orejas enrolladas. Cuando las extiende,
        golpea con tal fuerza que incluso puede romper rocas.
      it: |-
        Le sue orecchie sono sempre arrotolate. Può
        estenderle con forza per distruggere qualsiasi cosa.
    'y':
      ja-Hrkt: |-
        きけんを　かんじとると　りょうみみを
        たてて　けいかいする。さむい　よるは
        けがわに　かおを　うずめて　ねむる。
      ja: |-
        危険を　感じ取ると　両耳を　立てて
        警戒する。寒い　夜は
        毛皮に　顔を　埋めて　眠る。
      ko: |-
        위험을 느끼면 양쪽 귀를
        세워서 경계한다. 추운 밤에는
        털에 얼굴을 묻고 잠잔다.
      en: |-
        When it senses danger, it perks up its ears.
        On cold nights, it sleeps with its head tucked into
        its fur.
      fr: |-
        Il dresse les oreilles quand il sent un danger.
        Il dort la tête dans sa fourrure pendant les nuits
        froides.
      de: |-
        Nimmt es Gefahr wahr, richtet es seine Ohren auf.
        In kalten Nächten vergräbt es den Kopf in seinem Fell.
      es: |-
        Cuando siente peligro, levanta las orejas. En noches
        frías, duerme con la cabeza metida en el pelaje.
      it: |-
        Drizza le orecchie quando avverte un pericolo. Nelle
        notti fredde, dorme con la testa nella pelliccia.
    omega-ruby:
      ja-Hrkt: |-
        いつも　まるめている　みみを
        いきおいよく　のばすと　おおきな
        いわも　かんたんに　こわせる。
      ja: |-
        いつも　まるめている　耳を
        勢いよく　伸ばすと　大きな
        岩も　簡単に　壊せる。
      ko: |-
        항상 말고 있는 귀를
        힘껏 늘리면 커다란
        바위도 간단히 부순다.
      en: |-
        Its ears are always rolled up. They can be forcefully
        extended to shatter even a large boulder.
      fr: |-
        Ses oreilles repliées se déroulent avec une force capable de
        briser un gros rocher.
      de: |-
        Seine Ohren sind immer aufgerollt. Mit ihnen kann es selbst
        große Felsbrocken zertrümmern.
      es: |-
        Lleva las orejas enrolladas. Cuando las extiende, golpea con
        tal fuerza que incluso puede romper rocas.
      it: |-
        Le sue orecchie sono sempre arrotolate. Può estenderle
        con forza per distruggere qualsiasi cosa.
    alpha-sapphire:
      ja-Hrkt: |-
        きけんを　かんじとると　りょうみみを
        たてて　けいかいする。さむい　よるは
        けがわに　かおを　うずめて　ねむる。
      ja: |-
        危険を　感じ取ると　両耳を　立てて
        警戒する。寒い　夜は
        毛皮に　顔を　埋めて　眠る。
      ko: |-
        위험을 느끼면 양쪽 귀를
        세워서 경계한다. 추운 밤에는
        털에 얼굴을 묻고 잠잔다.
      en: |-
        When it senses danger, it perks up its ears.
        On cold nights, it sleeps with its head tucked into
        its fur.
      fr: |-
        Il dresse les oreilles quand il sent un danger. Il dort la tête
        dans sa fourrure pendant les nuits froides.
      de: |-
        Nimmt es Gefahr wahr, richtet es seine Ohren auf.
        In kalten Nächten vergräbt es den Kopf in seinem Fell.
      es: |-
        Cuando siente peligro, levanta las orejas. En noches frías,
        duerme con la cabeza metida en el pelaje.
      it: |-
        Drizza le orecchie quando avverte un pericolo. Nelle notti
        fredde, dorme con la testa nella pelliccia.
    ultra-sun:
      ja-Hrkt: |-
        てあしのちからは　よわいが　ぎゅっと
        まるめたみみを　おもいきり　のばすと
        おおきないわも　こなごなに　くだく。
      ja: |-
        手足の力は　弱いが　ぎゅっと
        丸めた耳を　おもいきり　のばすと
        大きな岩も　粉々に　砕く。
      ko: |-
        손발의 힘은 약하지만, 단단하게
        만 귀를 힘껏 뻗으면
        큰 바위도 산산조각 낸다.
      zh-Hant: |-
        手腳的力量很弱，
        但如果使勁伸長緊緊捲起的耳朵，
        就連大岩石也能粉碎。
      zh-Hans: |-
        手脚的力量很弱，
        但如果死命伸长紧紧卷起的耳朵，
        连大岩石也能粉碎。
      en: |-
        Its arms and legs are weak, but when it rolls its
        ears up tight and then unleashes them with its
        full force, it can smash boulders to dust.
      fr: |-
        Il possède peu de force dans ses membres,
        mais il lui suffit de déplier son oreille comme
        un ressort pour réduire un rocher en poussière.
      de: |-
        Seine Gliedmaßen sind schwach, doch wenn es
        seine aufgerollten Ohren mit geballter Kraft
        hervorschnellen lässt, pulverisiert es jeden Fels.
      es: |-
        Si bien sus extremidades pecan de débiles, si
        enrolla las orejas y luego las extiende, puede
        hacer añicos incluso rocas bien grandes.
      it: |-
        I suoi arti sono deboli, ma la sua forza è altrove:
        se estende di colpo l’orecchio arrotolato, può
        sbriciolare persino un macigno.
    ultra-moon:
      ja-Hrkt: |-
        かたほうの　みみを　いつも　まるめて
        いるのは　てきに　おそわれた　とき
        すぐに　はんげきする　ためだ。
      ja: |-
        片方の　耳を　いつも　丸めて
        いるのは　敵に　襲われた　とき
        すぐに　反撃する　ためだ。
      ko: |-
        한쪽 귀를 항상 말고 있는 것은
        적에게 공격당했을 때
        바로 반격하기 위해서다.
      zh-Hant: |-
        一隻耳朵之所以總是捲起來，
        是為了在遭到敵人襲擊的時候
        能夠立刻做出反擊。
      zh-Hans: |-
        一只耳朵一直卷着
        是为了被敌人袭击的时候
        能立即反击。
      en: |-
        The reason it keeps one ear rolled up is so it
        can launch a swift counterattack if it’s attacked
        by an enemy.
      fr: |-
        S’il a toujours une oreille repliée, c’est pour être
        à même de contre-attaquer dès qu’un ennemi
        tente de s’en prendre à lui.
      de: |-
        Eines seiner Ohren ist stets aufgerollt, damit es
        im Falle eines gegnerischen Angriffs jederzeit
        zurückschlagen kann.
      es: |-
        Siempre tiene una de las orejas enrollada para
        poder contraatacar de inmediato si un enemigo
        lanza su ofensiva.
      it: |-
        Tiene un orecchio sempre arrotolato per poter
        contrattaccare prontamente se un nemico lo
        prende di mira.
    sword:
      ja-Hrkt: |-
        さゆうの　みみを　まるめているときは
        からだや　こころの　ふちょうが
        げんいんなので　ケアが　ひつよう。
      ja: |-
        左右の　耳を　丸めているときは
        体や　心の　不調が
        原因なので　ケアが　必要。
      ko: |-
        양쪽 귀를 말고 있을 때는
        몸이나 마음이 좋지 않다는 뜻이므로
        관리가 필요하다.
      zh-Hant: |-
        將左右兩耳都捲起來時，
        就代表牠的身體或心情
        狀況不佳，需要照顧。
      zh-Hans: |-
        若看到它卷起左右两只耳朵，
        就说明它此时身体和心理
        状态不佳，需要呵护。
      en: |-
        If both of Buneary’s ears are rolled up, something
        is wrong with its body or mind. It’s a sure sign the
        Pokémon is in need of care.
      fr: |-
        Quand ses deux oreilles sont repliées, c’est
        signe qu’il ne se sent pas bien physiquement
        ou mentalement et qu’il a besoin de soins.
      de: |-
        Sind seine beiden Ohren aufgerollt, deutet das
        darauf hin, dass es ihm körperlich oder psychisch
        nicht gut geht und es Zuwendung braucht.
      es: |-
        Cuando enrolla ambas orejas, es señal de que
        tiene algún tipo de malestar físico o emocional
        y necesita cuidados.
      it: |-
        Se arrotola entrambe le orecchie significa che è
        afflitto da qualche disturbo fisico o emotivo.
        È segno che bisogna prendersi cura di lui.
    shield:
      ja-Hrkt: |-
        まるめた　みみを　のばす　いきおいで
        こうげきする　わざは　トレーニングを
        するほど　いりょくが　ましていく。
      ja: |-
        まるめた　耳を　伸ばす　勢いで
        攻撃する　技は　トレーニングを
        するほど　威力が　増していく。
      ko: |-
        말고 있던 귀를 뻗는 힘으로
        공격하는 기술은 트레이닝을
        할수록 위력이 커진다.
      zh-Hant: |-
        會利用把捲成團的耳朵伸直
        時的威力來使出攻擊招式。
        越訓練，招式威力就會越大。
      zh-Hans: |-
        会利用把卷卷的耳朵伸直
        时产生的威力进行攻击。
        越训练，这一招式的威力就越强。
      en: |-
        Buneary can attack by rolling up their ears and
        then striking with the force created by unrolling
        them. This attack becomes stronger with training.
      fr: |-
        Plus il s’entraîne, plus les coups qu’il assène
        en déroulant vigoureusement ses oreilles
        gagnent en puissance.
      de: |-
        Es greift an, indem es seine Ohren aufrollt und
        mit viel Schwung wieder entrollt. Durch Training
        kann Haspiror die Kraft dieser Attacke steigern.
      es: |-
        Ataca estirando con un fuerte impulso las
        orejas enrolladas. Cuanto más entrena esta
        técnica, con más potencia la ejecuta.
      it: |-
        Attacca estendendo con impeto l’orecchio
        arrotolato. Più si allena, più la potenza
        dei suoi attacchi aumenta.
