    heartgold:
      en: |-
        It loves iron ore. Groups of them
        fight for territory by bashing one
        another with their steel bodies.
    soulsilver:
      en: |-
        It loves iron ore. Groups of them
        fight for territory by bashing one
        another with their steel bodies.
    black:
      en: |-
        For food, it digs up iron ore. It
        smashes its steely body against
        others to fight over territory.
      fr: |-
        Il se nourrit du minerai de fer qu’il
        fore. Il défend son territoire en
        chargeant avec son corps d’acier.
    white:
      en: |-
        For food, it digs up iron ore. It
        smashes its steely body against
        others to fight over territory.
      fr: |-
        Il se nourrit du minerai de fer qu’il
        fore. Il défend son territoire en
        chargeant avec son corps d’acier.
    black-2:
      en: |-
        Lairon fight over territory,
        and when their steel bodies
        collide, sparks fly.
    white-2:
      en: |-
        Lairon fight over territory,
        and when their steel bodies
        collide, sparks fly.
    x:
      ja-Hrkt: |-
        てっこうせきが　だいこうぶつ。
        はがねの　からだを　ぶつけあって
        なわばり　あらそいを　する。
      ja: |-
        鉄鉱石が　大好物。
        鋼の　体を　ぶつけ合って
        縄張り　争いを　する。
      ko: |-
        철광석을 매우 좋아한다.
        강철의 몸을 서로 부딪치며
        영역 싸움을 한다.
      en: |-
        It loves iron ore. Groups of them fight for territory
        by bashing one another with their steel bodies.
      fr: |-
        Il raffole du minerai de fer. Il défend son territoire
        en chargeant avec son corps d’acier.
      de: |-
        Ist verrückt nach Eisenerz. Bei Revierkämpfen
        stoßen Stollrak einander mit ihren Stahlkörpern.
      es: |-
        Le encanta comer hierro. Lucha por su territorio
        embistiendo a sus rivales con su cuerpo de acero.
      it: |-
        Adora i minerali di ferro. Scaglia il suo corpo d’acciaio
        contro gli altri nella lotta per il territorio.
    'y':
      ja-Hrkt: |-
        はがねの　よろいを　いわに　ぶつけた
        ときに　でる　ひばなの　おおきさで
        つよさを　アピールする　しゅうせい。
      ja: |-
        鋼の　よろいを　岩に　ぶつけた
        ときに　出る　火花の　大きさで
        強さを　アピールする　習性。
      ko: |-
        강철의 갑옷을 바위에 부딪쳤을 때
        튀는 불꽃의 크기로
        강함을 어필하는 습성이 있다.
      en: |-
        It habitually shows off its strength with the size of
        sparks it creates by ramming its steel body
        into boulders.
      fr: |-
        Pour montrer sa force à ses ennemis, Galegon frotte
        son corps d’acier contre les rochers pour produire
        de gigantesques étincelles.
      de: |-
        Gelegentlich demonstriert es seine Kraft, indem es
        mit der Größe der Funken angibt, die entstehen,
        wenn es seinen stählernen Körper in Felsen rammt.
      es: |-
        Para alardear de su fuerza, hace saltar chispas
        frotando contra grandes rocas el cuerpo de acero
        que tiene.
      it: |-
        Per sfoggiare la sua potenza, crea grandi scintille
        scontrandosi contro i massi con il suo corpo d’acciaio.
    omega-ruby:
      ja-Hrkt: |-
        えいよう　まんてんの　わきみずを　おなかいっぱい
        のむ　ことで　はがねの　からだが　きたえられる。
        おいしい　わきみずの　ちかくに　すを　つくる。
      ja: |-
        栄養　満点の　わき水を　お腹いっぱい
        飲む　ことで　鋼の　体が　鍛えられる。
        美味しい　わき水の　近くに　巣を　つくる。
      ko: |-
        영양 만점인 샘물을 배 속 가득
        마셔서 강철 몸을 단련시킨다.
        맛있는 샘물 가까이에 거처를 만든다.
      en: |-
        Lairon tempers its steel body by drinking highly nutritious
        mineral springwater until it is bloated. This Pokémon makes its
        nest close to springs of delicious water.
      fr: |-
        Galegon adoucit son corps d’acier en buvant une eau minérale
        jusqu’à ce qu’il soit tout boursouflé. Ce Pokémon fait son nid
        près des sources d’eau minérale riches en nutriments.
      de: |-
        Stollrak temperiert seinen Körper, indem es ausgesprochen
        nahrhaftes Quellwasser trinkt, bis es völlig aufgebläht ist.
        Dieses Pokémon baut sein Nest in der Nähe von Quellen,
        aus denen köstliches Wasser sprudelt.
      es: |-
        Lairon templa su cuerpo de acero bebiendo agua mineral muy
        rica en nutrientes hasta que no puede más. Este Pokémon
        suele crear su nido cerca de manantiales de rica agua.
      it: |-
        Lairon tempra la sua fibra d’acciaio ingerendo dosi enormi
        di minerali altamente nutritivi presenti nell’acqua di sorgente.
        Questo Pokémon crea la propria dimora nei pressi di sorgenti
        d’acqua purissima.
    alpha-sapphire:
      ja-Hrkt: |-
        いしや　みずに　ふくまれる　てつぶんを　たべる。
        てっこうせきの　うもれた　やまに　すを　つくるが
        てつを　とりにくる　にんげんと　あらそいになる。
      ja: |-
        石や　水に　含まれている　鉄分を　食べる。
        鉄鉱石の　埋もれた　山に　巣を　つくるが
        鉄を　取りに来る　人間と　争いになる。
      ko: |-
        돌이나 물에 포함된 철 성분을 먹는다.
        철광석이 묻힌 산에 둥지를 만들지만
        철을 캐러 오는 인간과 다투게 된다.
      en: |-
        Lairon feeds on iron contained in rocks and water. It makes
        its nest on mountains where iron ore is buried. As a result,
        the Pokémon often clashes with humans mining the iron ore.
      fr: |-
        Galegon se nourrit du fer contenu dans les rochers et
        dans l’eau. Il fait son nid sur les montagnes renfermant
        du minerai de fer. Du coup, il se confronte souvent
        aux humains travaillant dans les mines.
      de: |-
        Stollrak ernährt sich von Eisen, das in Steinen und Wasser
        enthalten ist. Es baut sein Nest in Bergen, in denen Eisenerz
        abgebaut wird. Es gerät dabei häufig mit Bergarbeitern
        in Konflikt.
      es: |-
        Lairon se alimenta del hierro que hay en las rocas y el agua.
        Hace su nido en las montañas, de donde se saca el hierro.
        Por eso, se encuentra muchas veces con las personas que
        están trabajando en las minas extrayéndolo.
      it: |-
        Lairon si nutre del ferro contenuto nelle rocce e nell’acqua.
        Crea la propria dimora in montagna vicino a giacimenti ferrosi.
        Per questo motivo il Pokémon si scontra spesso con minatori
        alla ricerca di pepite di ferro.
    sword:
      ja-Hrkt: |-
        コドラが　くらす　やまは　わきみずと
        てっこうせきが　ほうふなので　ひとと
        あらそいに　なることも　おおかった。
      ja: |-
        コドラが　暮らす　山は　湧き水と
        鉄鉱石が　豊富なので　人と
        争いに　なることも　多かった。
      ko: |-
        갱도라가 사는 산은
        샘물과 철광석이 풍부하여
        사람과 다투는 일도 잦았다.
      zh-Hant: |-
        可多拉棲息的山區有
        豐富的泉水和鐵礦石，
        因此常會與人類起紛爭。
      zh-Hans: |-
        由于可多拉所栖息的山上
        有着丰富的泉水和铁矿石，
        因此经常会与人类发生争端。
      en: |-
        Lairon live in mountains brimming with spring
        water and iron ore, so these Pokémon often
        came into conflict with humans in the past.
      fr: |-
        Vivre au sein de montagnes riches en minerai
        et abondantes en eau de source lui a souvent
        valu d’entrer en conflit avec l’Homme.
      de: |-
        Stollrak leben in Bergen, die reich an Quellwasser
        und Eisenerz sind, weshalb sie oft mit Menschen
        in Konflikt gerieten.
      es: |-
        Habita en zonas ricas en hierro y con numerosos
        manantiales, por lo que en el pasado las disputas
        territoriales con los humanos eran frecuentes.
      it: |-
        I monti in cui vive sono ricchi di minerali ferrosi
        e sorgenti d’acqua. Per questo, spesso in passato
        questo Pokémon si scontrava con gli esseri umani.
    shield:
      ja-Hrkt: |-
        からだを　ぶつけあって　なわばりを
        あらそう。　はがねの　よろいは　よく
        みると　きずや　へこみが　あるのだ。
      ja: |-
        体を　ぶつけ合って　縄張りを
        争う。　鋼の　鎧は　よく
        見ると　傷や　へこみが　あるのだ。
      ko: |-
        서로 몸을 부딪치며 영역
        싸움을 한다. 강철의 갑옷은
        잘 보면 흠집과 파인 곳이 있다.
      zh-Hant: |-
        會互相碰撞身體來爭奪地盤。
        仔細看牠的鋼鐵盔甲，就會
        發現有傷痕及凹痕。
      zh-Hans: |-
        会用钢铁之躯互相撞击
        来争夺地盘。仔细看会发现
        钢铁盔甲上有伤痕和凹陷。
      en: |-
        During territorial disputes, Lairon fight by
        slamming into each other. Close inspection of
        their steel armor reveals scratches and dents.
      fr: |-
        Les Galegon se disputent les territoires en luttant
        au corps à corps, comme le montrent les éraflures
        sur leur armure d’acier.
      de: |-
        Bei Revierkämpfen prallen sie mit ihren Körpern
        gegeneinander. Betrachtet man die Stahlpanzer
        genauer, entdeckt man Kratzer und Dellen.
      es: |-
        Resuelven sus disputas territoriales embistiendo
        y golpeando con el cuerpo. En sus corazas de
        acero se pueden apreciar hendiduras y rasguños.
      it: |-
        I Lairon lottano per il territorio scagliandosi l’uno
        contro l’altro. A un’osservazione attenta, la loro
        armatura d’acciaio mostra graffi e ammaccature.
