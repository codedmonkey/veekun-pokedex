darumaka:
  base_happiness: 50
  capture_rate: 120
  color: red
  egg_groups:
    - ground
  evolution_chain: darumaka
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        When its internal fire is burning, it
        cannot calm down and it runs around.
        When the fire diminishes, it falls asleep.
      fr: |-
        Quand le feu brûle dans son corps,
        il est tout excité et court partout.
        Quand le feu s’apaise, il s’endort.
    white:
      en: |-
        Darumaka’s droppings are hot, so
        people used to put them in their
        clothes to keep themselves warm.
      fr: |-
        Les gens d’autrefois avaient l’habitude
        de mettre ses crottes brûlantes sous
        leurs vêtements pour se réchauffer.
    black-2:
      en: |-
        When it sleeps, it pulls its limbs
        into its body and its internal fire
        goes down to 1,100° F.
    white-2:
      en: |-
        When it sleeps, it pulls its limbs
        into its body and its internal fire
        goes down to 1,100° F.
    x:
      ja-Hrkt: |-
        ダルマッカの　フンは　あついので
        むかしの　ひとは　ふところに　いれて
        からだを　あたためていたのだ。
      ja: |-
        ダルマッカの　フンは　熱いので
        昔の　人は　懐に　入れて
        体を　温めていたのだ。
      ko: |-
        달막화의 배설물은 뜨거워서
        옛날 사람은 품에 넣고
        몸을 따뜻하게 하는 데 사용했다.
      en: |-
        Darumaka’s droppings are hot, so people used to
        put them in their clothes to keep themselves warm.
      fr: |-
        Les gens d’autrefois avaient l’habitude de mettre
        ses crottes brûlantes sous leurs vêtements pour se
        réchauffer.
      de: |-
        Früher nutzte man die heißen Ausscheidungen
        von Flampion, um sich den Körper zu wärmen.
      es: |-
        Como sus excrementos están muy calientes, la gente
        de antaño se los metía en los bolsillos para calentarse.
      it: |-
        Poiché i suoi escrementi sono molto caldi,
        nell’antichità gli uomini solevano conservarli in
        buste per riscaldarsi.
    'y':
      ja-Hrkt: |-
        ねるときは　てあしを　ひっこめ
        たいないで　もえている　６００どの
        ほのおも　ちいさくなり　おちつくよ。
      ja: |-
        寝るときは　手足を　ひっこめ
        体内で　燃えている　６００度の
        炎も　小さくなり　落ち着くよ。
      ko: |-
        잠잘 때는 손발을 움츠리고
        체내에 타고 있는 600도의
        불꽃도 작아져서 차분해진다.
      en: |-
        When it sleeps, it pulls its limbs into its
        body and its internal fire goes down to
        1,100 degrees Fahrenheit.
      fr: |-
        Quand il dort, ses pattes se rétractent et les flammes
        qui brûlent à 600 °C dans son corps s’apaisent.
      de: |-
        Zum Schlafen zieht es Arme und Beine ein und
        senkt seine innere Körpertemperatur auf 600 °C,
        um sich zu entspannen.
      es: |-
        Cuando se dispone a dormir, retrae sus piernas y sus
        brazos, y reduce la llama de su interior a 600 °C para
        relajarse.
      it: |-
        Quando dorme ritrae gli arti. Anche il fuoco che gli
        brucia dentro a 600 °C si affievolisce.
    omega-ruby:
      ja-Hrkt: |-
        ダルマッカの　フンは　あついので
        むかしの　ひとは　ふところに　いれて
        からだを　あたためていたのだ。
      ja: |-
        ダルマッカの　フンは　熱いので
        昔の　人は　懐に　入れて
        体を　温めていたのだ。
      ko: |-
        달막화의 배설물은 뜨거워서
        옛날 사람은 품에 넣고
        몸을 따뜻하게 하는 데 사용했다.
      en: |-
        Darumaka’s droppings are hot, so people used to
        put them in their clothes to keep themselves warm.
      fr: |-
        Les gens d’autrefois avaient l’habitude de mettre ses crottes
        brûlantes sous leurs vêtements pour se réchauffer.
      de: |-
        Früher nutzte man die heißen Ausscheidungen von Flampion,
        um sich den Körper zu wärmen.
      es: |-
        Como sus excrementos están muy calientes, la gente de
        antaño se los metía en los bolsillos para calentarse.
      it: |-
        Poiché i suoi escrementi sono molto caldi, nell’antichità
        gli uomini solevano conservarli in buste per riscaldarsi.
    alpha-sapphire:
      ja-Hrkt: |-
        ねるときは　てあしを　ひっこめ
        たいないで　もえている　６００どの
        ほのおも　ちいさくなり　おちつくよ。
      ja: |-
        寝るときは　手足を　ひっこめ
        体内で　燃えている　６００度の
        炎も　小さくなり　落ち着くよ。
      ko: |-
        잠잘 때는 손발을 움츠리고
        체내에서 타고 있는 600도의
        불꽃도 작아져서 차분해진다.
      en: |-
        When it sleeps, it pulls its limbs into its
        body and its internal fire goes down to
        1,100 degrees Fahrenheit.
      fr: |-
        Quand il dort, ses pattes se rétractent et les flammes
        qui brûlent à 600 °C dans son corps s’apaisent.
      de: |-
        Zum Schlafen zieht es Arme und Beine ein und senkt seine
        innere Körpertemperatur auf 600 °C, um sich zu entspannen.
      es: |-
        Cuando se dispone a dormir, retrae sus piernas y sus brazos,
        y reduce la llama de su interior a 600 °C para relajarse.
      it: |-
        Quando dorme ritrae gli arti. Anche il fuoco che gli brucia
        dentro a 600 °C si affievolisce.
    sword:
      ja-Hrkt: |-
        からだの　なかで　もえる　ほのおが
        パワーの　みなもと。　ひが　ちいさく
        なると　たちまち　ねむってしまう。
      ja: |-
        体の　中で　燃える　炎が
        パワーの　源。　火が　小さく
        なると　たちまち　眠ってしまう。
      ko: |-
        몸 안에서 타오르는 불꽃이
        힘의 원천이다. 불꽃이 작아지면
        금세 잠들어 버린다.
      zh-Hant: |-
        能量之源是體內的火焰。
        如果火焰變小了，
        牠馬上就會睡著。
      zh-Hans: |-
        能量之源是体内的火焰。
        如果火焰变小了，
        它马上就会睡着。
      en: |-
        It derives its power from fire burning inside
        its body. If the fire dwindles, this Pokémon will
        immediately fall asleep.
      fr: |-
        La flamme qui brûle dans son corps est sa source
        d’énergie. Si le feu s’affaiblit, il s’endort
        sur-le-champ.
      de: |-
        Das Feuer in seinem Inneren ist die Quelle seiner
        Kraft. Wird die Flamme zu klein, schläft es auf
        der Stelle ein.
      es: |-
        La llama que arde en su interior es la fuente
        de su poder. Si el fuego mengua, se sume en
        un estado de sopor de inmediato.
      it: |-
        La fiamma che brucia dentro il suo corpo è
        la fonte della sua potenza. Quando si affievolisce
        il Pokémon si addormenta all’istante.
    shield:
      ja-Hrkt: |-
        ねているときは　おしても　ひいても
        けっして　たおれない。　えんぎものの
        モチーフとして　にんきが　たかい。
      ja: |-
        寝ているときは　押しても　引いても
        けっして　倒れない。　縁起ものの
        モチーフとして　人気が　高い。
      ko: |-
        자고 있을 때는 밀어도 당겨도
        절대 쓰러지지 않는다.
        길조의 모티브로 인기가 높다.
      zh-Hant: |-
        在牠睡覺的時候，
        無論是推是拉，牠都不會倒下。
        因為象徵著吉利而大受歡迎。
      zh-Hans: |-
        在它睡觉的时候，
        无论是推是拉，它都不会倒下。
        因为象征着吉利而大受欢迎。
      en: |-
        This popular symbol of good fortune will never
        fall over in its sleep, no matter how it’s pushed
        or pulled.
      fr: |-
        On a beau le pousser ou le tirer, quand il dort,
        rien ne le fait vaciller. Cette qualité lui a valu
        de devenir un emblème pour les porte-bonheurs.
      de: |-
        Während es schläft, lässt es sich nicht mal mit
        Gewalt umstoßen. Aus diesem Grund ist es ein
        beliebtes Motiv für Glücksbringer.
      es: |-
        Cuando duerme es imposible tumbarlo por más
        que lo zarandeen. Es muy popular como amuleto
        de la suerte.
      it: |-
        Quando dorme è impossibile buttarlo giù,
        per quanto lo si spinga. I portafortuna che
        lo rappresentano sono molto popolari.
