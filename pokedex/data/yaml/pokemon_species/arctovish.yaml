arctovish:
  base_happiness: 50
  capture_rate: 45
  color: blue
  egg_groups:
    - no-eggs
  evolution_chain: arctovish
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        しゅういを　こおりつかせて　えものを
        つかまえるが　くちが　あたまの
        うえに　あるので　たべづらい。
      ja: |-
        周囲を　凍りつかせて　獲物を
        捕まえるが　口が　頭の
        上に　あるので　食べづらい。
      ko: |-
        주변을 꽁꽁 얼려서 먹이를
        잡지만 입이 머리 윗부분에
        있어서 먹기 힘들다.
      zh-Hant: |-
        雖然能透過凍結四周來捕捉獵物，
        但由於嘴長在頭頂上，
        所以吃起東西來不太方便。
      zh-Hans: |-
        虽然能通过冻结四周来捕捉猎物，
        但由于嘴长在头顶上，
        所以吃起东西来不太方便。
      en: |-
        Though it’s able to capture prey by freezing its
        surroundings, it has trouble eating the prey
        afterward because its mouth is on top of its head.
      fr: |-
        Il gèle les alentours pour capturer ses proies,
        mais comme sa bouche est sur le dessus de
        sa tête, il a beaucoup de mal à les manger.
      de: |-
        Es fängt seine Beute, indem es seine Umgebung
        einfriert, doch da sich sein Maul oben auf seinem
        Kopf befindet, ist Fressen für es sehr umständlich.
      es: |-
        Atrapa a sus presas congelando su entorno, pero
        la ubicación de la boca encima de la cabeza le
        genera dificultades para deglutirlas.
      it: |-
        Cattura le prede congelando l’ambiente
        circostante, ma avendo la bocca sopra
        la testa fatica a inghiottirle.
    shield:
      ja-Hrkt: |-
        どんな　こうげきにも　きずつかない
        つらのかわを　もつが　こきゅうが
        ふじゆうだったため　ぜつめつした。
      ja: |-
        どんな　攻撃にも　傷つかない
        面の皮を　もつが　呼吸が
        不自由だったため　絶滅した。
      ko: |-
        어떤 공격에도 상처 입지 않는
        얼굴 가죽을 가졌지만 호흡이
        자유롭지 않았던 탓에 멸종하였다.
      zh-Hant: |-
        面部的皮膚無論受到什麼攻擊
        都不會受傷，但由於呼吸起來
        不方便而滅絕了。
      zh-Hans: |-
        面部的皮肤无论受到什么攻击
        都不会受伤，但由于呼吸起来
        不方便而灭绝了。
      en: |-
        The skin on its face is impervious to attack, but
        breathing difficulties made this Pokémon go
        extinct anyway.
      fr: |-
        Aucune attaque ne pouvait égratigner la peau
        de son visage, mais il s’est éteint, car il avait
        du mal à respirer.
      de: |-
        Kein Angriff konnte seine Gesichtshaut verletzen,
        doch es war in seiner Atmung eingeschränkt und
        starb daher aus.
      es: |-
        Aunque la piel de su rostro era capaz de resistir
        cualquier ataque, su dificultad para respirar
        acabó provocando su extinción.
      it: |-
        Nessun attacco poteva scalfire la pelle del suo
        muso, ma si è estinto perché aveva difficoltà
        a respirare.
