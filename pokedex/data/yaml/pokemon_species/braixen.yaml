braixen:
  base_happiness: 70
  capture_rate: 45
  color: red
  egg_groups:
    - ground
  evolution_chain: fennekin
  evolves_from: fennekin
  flavor_text:
    x:
      ja-Hrkt: |-
        きのえだを　しっぽに　さしている。
        しっぽの　けの　まさつねつで
        えだに　ひをつけて　たたかう。
      ja: |-
        木の枝を　尻尾に　挿している。
        尻尾の　毛の　摩擦熱で
        枝に　火をつけて　戦う。
      ko: |-
        나뭇가지를 꼬리에 꽂고 있다.
        꼬리털의 마찰열로
        가지에 불을 붙여 싸운다.
      en: |-
        It has a twig stuck in its tail. With
        friction from its tail fur, it sets the
        twig on fire and launches into battle.
      fr: |-
        Il allume la branche plantée dans sa queue en la
        frottant contre son pelage et s’en sert au combat.
      de: |-
        In seinem Schweif steckt ein Zweig, den es bei Bedarf
        mit der Reibungswärme seiner Schweifhaare anzündet
        und im Kampf einsetzt.
      es: |-
        Tiene una rama enredada en la cola. Cuando la saca,
        la rama prende fuego al hacer fricción con su pelaje
        y se lanza al ataque con ella.
      it: |-
        Incendia il ramo che ha infilato nella coda grazie allo
        sfregamento del pelo per poi lanciarsi nella lotta.
    'y':
      ja-Hrkt: |-
        きのえだを　しっぽから　ひきぬくとき
        まさつで　ちゃっか。えだの　ほのおを
        ふって　なかまに　あいずを　おくる。
      ja: |-
        木の枝を　尻尾から　引き抜くとき
        摩擦で　着火。枝の　炎を　振って
        仲間に　合図を　送る。
      ko: |-
        나뭇가지를 꼬리에서 뽑을 때
        마찰로 불이 붙는다. 나뭇가지의 불꽃을
        흔들어 동료에게 신호를 보낸다.
      en: |-
        When the twig is plucked from its tail,
        friction sets the twig alight. The flame
        is used to send signals to its allies.
      fr: |-
        Quand il saisit la branche plantée dans sa queue,
        elle prend feu par friction. Il peut communiquer avec
        ses congénères en agitant ce bâton enflammé.
      de: |-
        Sein Zweig entzündet sich durch die Reibung, die beim
        Herausziehen aus seinem Schweif entsteht. Mit der
        Flamme sendet es Signale an Kameraden.
      es: |-
        Al extraer la rama que tiene en la cola, esta prende
        debido a la fricción. Usa esa rama candente para
        enviar señales a sus compañeros.
      it: |-
        Incendia il rametto che ha nella coda semplicemente
        estraendolo, grazie alla frizione del pelo. Lo usa anche
        per mandare segnali ai suoi compagni.
