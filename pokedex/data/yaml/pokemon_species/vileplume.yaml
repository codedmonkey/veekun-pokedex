    sword:
      ja-Hrkt: |-
        せかいいち　おおきな　はなびらは
        あるくたびに　ゆれて　たいりょうの
        どくかふんを　ばらまいてしまう。
      ja: |-
        世界一　大きな　花びらは
        歩くたびに　揺れて　大量の
        毒花粉を　ばらまいてしまう。
      ko: |-
        세계에서 제일 큰 꽃잎은
        걸을 때마다 흔들려 대량의
        독 꽃가루를 흩뿌린다.
      zh-Hant: |-
        身上那些全世界最大的花瓣
        會隨著牠的每個步伐搖動，
        散播大量的毒花粉。
      zh-Hans: |-
        它有着世界上最大的花瓣。
        每走一步，花瓣都会跟着摇动，
        同时撒出大量的毒花粉。
      en: |-
        It has the world’s largest petals. With every step,
        the petals shake out heavy clouds of toxic pollen.
      fr: |-
        Il possède les plus gros pétales au monde,
        qui sèment d’épais nuages de pollen toxique
        à chacun de ses pas.
      de: |-
        Es besitzt die größten Blütenblätter der Welt.
        Bei jedem Schritt streut es große Mengen an
        Giftpollen zu Boden.
      es: |-
        Tiene los pétalos más grandes del mundo. Al
        caminar, de ellos se desprenden densas nubes
        de polen tóxico.
      it: |-
        Ha i petali più grandi del mondo. Ad ogni
        suo passo, liberano fitte nubi di polline tossico.
    shield:
      ja-Hrkt: |-
        はなびらが　おおきいほど　たくさん
        かふんを　だすが　あたまが
        おもたくて　つかれてしまうという。
      ja: |-
        花びらが　大きいほど
        たくさん　花粉を　出すが
        頭が　重たくて　疲れてしまうという。
      ko: |-
        꽃잎이 클수록 많은 꽃가루를
        만들어 내지만 머리가
        무거워서 지쳐버린다고 한다.
      zh-Hant: |-
        雖然花瓣越大就能放出
        越多的花粉，但頭部也會
        隨之變重而容易疲倦。
      zh-Hans: |-
        虽然花瓣越大，
        就能放出越多的花粉，
        但这样脑袋会变沉，容易疲倦。
      en: |-
        The larger its petals, the more toxic pollen it
        contains. Its big head is heavy and hard to hold up.
      fr: |-
        Plus ses pétales sont grands, plus il produit
        de pollen toxique. Toutefois, le poids de sa tête
        le fatigue.
      de: |-
        Je größer die Blütenblätter, desto mehr giftige
        Pollen enthält die Blüte. Aber es ist auch umso
        erschöpfter, da sein Kopf so schwer wird.
      es: |-
        Cuanto mayores son sus pétalos, más tóxico es su
        polen. Le pesa la cabeza y le cuesta mantenerla
        erguida.
      it: |-
        Più grandi sono i petali, maggiore è la quantità
        di polline tossico che contengono. La testa, però,
        diventa molto pesante e fa fatica a sostenerla.
