barraskewda:
  base_happiness: 50
  capture_rate: 60
  color: brown
  egg_groups:
    - water2
  evolution_chain: arrokuda
  evolves_from: arrokuda
  flavor_text:
    sword:
      ja-Hrkt: |-
        やりの　ように　とがった　あごは
        はがねの　かたさ。　その　みは
        おどろくほど　おいしい　らしい。
      ja: |-
        槍のように　尖った　顎は
        鋼の　硬さ。　その　身は
        驚くほど　美味しいらしい。
      ko: |-
        창처럼 뾰족한 턱은 강철과 같은
        단단함을 자랑한다. 살코기는
        깜짝 놀랄 정도로 맛있다는 듯하다.
      zh-Hant: |-
        像長矛一樣尖銳的下巴
        擁有鋼鐵般的硬度。
        據說牠的肉好吃得驚人。
      zh-Hans: |-
        像长矛一样尖锐的下巴
        拥有钢铁般的硬度。
        据说它的肉好吃得惊人。
      en: |-
        This Pokémon has a jaw that’s as sharp as a spear
        and as strong as steel. Apparently Barraskewda’s
        flesh is surprisingly tasty, too.
      fr: |-
        Sa mâchoire pointue comme une lance est aussi
        dure que l’acier, et sa chair serait, contre toute
        attente, succulente.
      de: |-
        Sein Kiefer ist spitz wie ein Speer und hart wie
        Stahl. Außerdem soll Barrakiefa überraschend
        deliziös sein.
      es: |-
        Su mandíbula es tan puntiaguda como una lanza
        y tan dura como el acero. Al parecer, su carne es
        sorprendentemente deliciosa.
      it: |-
        La sua mandibola è appuntita come una lancia
        e dura come l’acciaio. Sembra che le sue carni
        siano incredibilmente deliziose.
    shield:
      ja-Hrkt: |-
        おびれを　かいてんさせ　いっきに
        とつげき。　１００ノットを　こえる
        そくどで　えものを　つらぬくぞ。
      ja: |-
        尾びれを　回転させ　一気に
        突撃。　１００ノットを　超える
        速度で　獲物を　つらぬくぞ。
      ko: |-
        꼬리지느러미를 회전시켜 단번에
        돌격한다. 100노트를 넘는
        속도로 먹이를 관통한다.
      zh-Hant: |-
        會旋轉著自己的尾鰭
        一口氣突擊。能夠以超過
        １００節的速度貫穿獵物。
      zh-Hans: |-
        会旋转着自己的尾鳍
        一口气突击。能够以超过
        １００节的速度贯穿猎物。
      en: |-
        It spins its tail fins to propel itself, surging
        forward at speeds of over 100 knots before
        ramming prey and spearing into them.
      fr: |-
        Il charge d’un coup en faisant tourner sa nageoire
        caudale. Il peut transpercer ses proies
        à une vitesse dépassant les 100 nœuds.
      de: |-
        Es lässt seine Schwanzflosse rotieren und stößt
        mit einem Mal zu. Es durchsticht seine Beute mit
        einer Geschwindigkeit von über 100 Knoten.
      es: |-
        Hace girar su aleta caudal para impulsarse y
        arremeter contra la presa, a la que ensarta a
        una velocidad que supera los 100 nudos.
      it: |-
        Fa girare rapidamente la coda e carica a tutta
        forza, trafiggendo le sue prede a una velocità
        di 100 nodi.
