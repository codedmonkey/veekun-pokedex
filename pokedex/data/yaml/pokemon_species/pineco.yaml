    x:
      ja-Hrkt: |-
        きの　かわを　かさねあわせて
        カラを　ぶあつくするのが　だいすき。
        おもくなっても　きにしない。
      ja: |-
        木の　皮を　重ね合わせて
        殻を　分厚くするのが　大好き。
        重くなっても　気にしない。
      ko: |-
        나무껍질을 짜 맞춰서
        껍질을 두껍게 하는 것을 좋아한다.
        무거워져도 신경 쓰지 않는다.
      en: |-
        It likes to make its shell thicker by adding layers of
        tree bark. The additional weight doesn’t bother it.
      fr: |-
        Il renforce sa carapace en y ajoutant des écorces
        d’arbre. Il devient alors plus lourd.
      de: |-
        Es fügt seiner Schale schichtenweise Baumrinde
        hinzu. Die zusätzliche Belastung ist ihm gleich.
      es: |-
        Le gusta engrosar su coraza añadiendo cortezas de
        árbol. El aumento de peso no le molesta.
      it: |-
        Inspessisce il guscio aggiungendo strati di corteccia.
        Non lo impensierisce l’aumento di peso.
    'y':
      ja-Hrkt: |-
        きのみに　そっくり。まちがわれて
        とりポケモンに　つつかれてしまうが
        かたい　カラで　まもられている。
      ja: |-
        木の実に　そっくり。間違われて
        とりポケモンに　つつかれてしまうが
        硬い　殻で　守られている。
      ko: |-
        나무열매와 똑 닮았다. 실수로
        새포켓몬에게 쪼이기도 하지만
        단단한 껍질이 몸을 보호하고 있다.
      en: |-
        It looks just like a pinecone. Its shell protects it
        from bird Pokémon that peck it by mistake.
      fr: |-
        Il ressemble à une pomme de pin. Sa carapace le
        protège des Pokémon Oiseaux qui le picorent par
        erreur.
      de: |-
        Es sieht aus wie ein Tannenzapfen. Seine Schale
        schützt es vor Vogel-Pokémon, die an ihm picken
        wollen.
      es: |-
        Es como una piña piñonera. Su coraza lo protege de
        los pájaros que lo picotean por error.
      it: |-
        Ha l’aspetto di una pigna. Il suo guscio lo protegge
        dai Pokémon uccello che lo beccano per errore.
    omega-ruby:
      ja-Hrkt: |-
        きの　えだに　ぶらさがり　えものを　まっている。
        きを　ゆらされて　しょくじの　じゃまを　されると
        じめんに　おちてから　いきなり　ばくはつするぞ。
      ja: |
        木の　枝に　ぶら下がり　獲物を　待っている。
        木を　揺らされて　食事の　邪魔を　されると
        地面に　落ちてから　いきなり　爆発するぞ。
      ko: |-
        나뭇가지에 매달려 먹이를 기다린다.
        나무가 흔들려 식사를 방해받으면
        땅으로 떨어진 후 느닷없이 폭발한다.
      en: |-
        Pineco hangs from a tree branch and patiently waits for prey to
        come along. If the Pokémon is disturbed while eating by
        someone shaking its tree, it drops down to the ground and
        explodes with no warning.
      fr: |-
        Pomdepik s’accroche à une branche d’arbre et attend
        patiemment que sa proie passe. Si ce Pokémon est dérangé
        pendant qu’il mange par quelqu’un qui secoue son arbre,
        il tombe au sol et explose sans prévenir.
      de: |-
        Tannza hängt an Ästen und wartet auf Beute. Wenn man
        dieses Pokémon bei einer Mahlzeit stört, indem man den
        Baum, auf dem es sich befindet, schüttelt, fällt es herunter
        und explodiert ohne Vorwarnung.
      es: |-
        Pineco permanece colgado de la rama de un árbol esperando
        pacientemente a su presa. Si alguien sacude el árbol en el
        que está mientras come y le molesta, se tira al suelo y explota
        sin dar ningún tipo de aviso.
      it: |-
        Pineco pende dal ramo di un albero e attende pazientemente
        l’arrivo della sua preda. Se l’albero viene scosso mentre
        il Pokémon mangia, Pineco cade a terra esplodendo
        senza preavviso.
    alpha-sapphire:
      ja-Hrkt: |-
        きの　えだに　ぶらさがり　えものを　まっている。
        きを　ゆらされて　しょくじの　じゃまを　されると
        じめんに　おちてから　いきなり　ばくはつするぞ。
      ja: |
        木の　枝に　ぶら下がり　獲物を　待っている。
        木を　揺らされて　食事の　邪魔を　されると
        地面に　落ちてから　いきなり　爆発するぞ。
      ko: |-
        나뭇가지에 매달려 먹이를 기다린다.
        나무가 흔들려 식사를 방해받으면
        땅으로 떨어진 후 느닷없이 폭발한다.
      en: |-
        Pineco hangs from a tree branch and patiently waits for prey to
        come along. If the Pokémon is disturbed while eating by
        someone shaking its tree, it drops down to the ground and
        explodes with no warning.
      fr: |-
        Pomdepik s’accroche à une branche d’arbre et attend
        patiemment que sa proie passe. Si ce Pokémon est dérangé
        pendant qu’il mange par quelqu’un qui secoue son arbre,
        il tombe au sol et explose sans prévenir.
      de: |-
        Tannza hängt an Ästen und wartet auf Beute. Wenn man dieses
        Pokémon bei einer Mahlzeit stört, indem man seinen Baum
        schüttelt, fällt es herunter und explodiert ohne Vorwarnung.
      es: |-
        Pineco permanece colgado de la rama de un árbol esperando
        pacientemente a su presa. Si alguien sacude el árbol en el
        que está mientras come y le molesta, se tira al suelo y explota
        sin dar ningún tipo de aviso.
      it: |-
        Pineco pende dal ramo di un albero e attende pazientemente
        l’arrivo della sua preda. Se l’albero viene scosso mentre
        il Pokémon mangia, Pineco cade a terra esplodendo
        senza preavviso.
    ultra-sun:
      ja-Hrkt: |-
        きに　ぶらさがり　じっと　えものの
        むしポケモンが　くるのを　まっている。
        アローラでの　こうぶつは　アブリーだ。
      ja: |-
        木に　ぶら下がり　じっと　獲物の
        むしポケモンが　来るのを　待っている。
        アローラでの　好物は　アブリーだ。
      ko: |-
        나무에 매달려 가만히 먹이인
        벌레포켓몬이 올 때를 기다린다.
        알로라에서 좋아하는 건 에블리다.
      zh-Hant: |-
        會掛在樹上靜靜等待被牠
        當成獵物的蟲寶可夢上門。
        在阿羅拉，牠最愛吃的是萌虻。
      zh-Hans: |-
        会挂在树上静静等待作为
        它猎物的虫宝可梦送上门来。
        在阿罗拉，它喜欢吃的是萌虻。
      en: |-
        Motionless, it hangs from trees, waiting for
        its bug Pokémon prey to come to it. Its favorite
        in Alola is Cutiefly.
      fr: |-
        Accroché à sa branche, il attend patiemment
        ses proies favorites : les Pokémon Insecte.
        Les Bombydou sont son péché mignon.
      de: |-
        Es hängt an Bäumen und wartet regungslos auf
        seine Beute, Käfer-Pokémon. In Alola ernährt es
        sich bevorzugt von Wommel.
      es: |-
        Se aposta en los árboles y espera inmóvil a
        que pase un Pokémon insecto al que atrapar.
        En Alola tiene predilección por los Cutiefly.
      it: |-
        Si ciba di Pokémon Coleottero e attende
        pazientemente le prede appeso a un ramo. Quelli
        che vivono ad Alola sono ghiotti di Cutiefly.
    ultra-moon:
      ja-Hrkt: |-
        きのかわを　だえきで　はりあわせ
        あつく　おおきくしていく。　としおいた
        クヌギダマは　とてつもない　でかさ。
      ja: |-
        木の皮を　唾液で　貼り合わせ
        厚く　大きくしていく。　年老いた
        クヌギダマは　とてつもない　でかさ。
      ko: |-
        나무껍질을 타액으로 붙여서
        몸을 두껍고 크게 만든다.
        나이를 먹은 피콘은 엄청나게 크다.
      zh-Hant: |-
        會用唾液把樹皮貼在自己身上，
        讓自己變得更厚更大。上了年紀的
        榛果球是無比巨大的。
      zh-Hans: |-
        会用唾液将树皮粘在自己身上，
        从而让自己变得又厚又大。
        上了年纪的榛果球是无比巨大的。
      en: |-
        It sticks tree bark to itself with its saliva,
        making itself thicker and larger. Elderly Pineco
        are ridiculously huge.
      fr: |-
        Il grandit en utilisant sa salive pour coller
        l’écorce des arbres sur son corps. Un Pomdepik
        âgé peut prendre des proportions démesurées.
      de: |-
        Es macht seinen Körper breiter und größer,
        indem es sich mit Speichel Baumrinde anklebt.
        Ältere Tannza sind deshalb unfassbar groß.
      es: |-
        Usa saliva para adherir corteza de árbol a su
        cuerpo y así aumentar de volumen. Con la edad
        puede alcanzar un tamaño gigantesco.
      it: |-
        Aumenta di dimensioni e spessore incollandosi
        addosso strati di corteccia con la saliva. Con il
        tempo può raggiungere dimensioni spropositate.
