  flavor_text:
    black:
      en: |-
        Its bite injects a potent poison, enough
        to paralyze large bird Pokémon that try
        to prey on it.
      fr: |-
        Sa morsure est très venimeuse.
        Elle paralyse même les grands
        Pokémon Oiseaux, ses prédateurs.
    white:
      en: |-
        It discovers what is going on around it
        by using the feelers on its head and tail.
        It is brutally aggressive.
      fr: |-
        Il sonde les alentours avec les
        antennes sur sa tête et sa queue.
        Il est extrêmement brutal.
    black-2:
      en: |-
        Using the feelers on its head and tail,
        it picks up vibrations in the air to
        determine its prey’s location and state.
    white-2:
      en: |-
        Using the feelers on its head and tail,
        it picks up vibrations in the air to
        determine its prey’s location and state.
    x:
      ja-Hrkt: |-
        あたまと　しっぽの　しょっかくで
        まわりの　ようすを　さぐる。
        ひじょうに　きょうぼうな　せいかく。
      ja: |-
        頭と　尻尾の　触角で
        まわりの　様子を　探る。
        非常に　凶暴な　性格。
      ko: |-
        머리와 꼬리의 더듬이로
        주변 상황을 살핀다.
        성격이 매우 난폭하다.
      en: |-
        It discovers what is going on around it by using the
        feelers on its head and tail. It is brutally aggressive.
      fr: |-
        Il sonde les alentours avec les antennes sur sa tête
        et sa queue. Il est extrêmement brutal.
      de: |-
        Mit seinen Ruten und den Fühlern an seinem Kopf
        tastet es die Umgebung ab. Ein überaus aggressiver
        Geselle.
      es: |-
        Percibe su entorno con su sentido del tacto, residente
        en su cabeza y cola. Su carácter es violento por
        naturaleza.
      it: |-
        Sonda l’ambiente circostante con le antenne del
        capo e della coda. Ha un carattere estremamente
        collerico.
    'y':
      ja-Hrkt: |-
        かみついて　もうどくを　あたえる。
        てんてきの　おおきな　とりポケモンも
        からだが　しびれて　うごけなくなる。
      ja: |-
        かみついて　猛毒を　与える。
        天敵の　大きな　とりポケモンも
        体が　しびれて　動けなくなる。
      ko: |-
        물어서 맹독을 퍼뜨린다.
        천적인 커다란 새포켓몬도
        몸이 마비돼서 움직일 수 없다.
      en: |-
        Its bite injects a potent poison, enough to paralyze
        large bird Pokémon that try to prey on it.
      fr: |-
        Sa morsure est très venimeuse. Elle paralyse
        même les grands Pokémon Oiseaux, ses prédateurs.
      de: |-
        Es beißt Angreifer und injiziert ihnen Gift, das selbst
        große Vogel-Pokémon, seine natürlichen Feinde,
        lähmt.
      es: |-
        Inocula un poderoso veneno al morder. Hasta sus
        enemigos acérrimos, los Pokémon pájaro, se quedan
        inmóviles.
      it: |-
        Mordendo, inietta un veleno potente. Anche i grandi
        Pokémon uccello, suoi predatori, ne rimangono
        paralizzati.
    omega-ruby:
      ja-Hrkt: |-
        あたまと　しっぽの　しょっかくで
        まわりの　ようすを　さぐる。
        ひじょうに　きょうぼうな　せいかく。
      ja: |-
