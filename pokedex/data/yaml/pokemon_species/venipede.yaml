      it: |-
        Sonda l’ambiente circostante con le antenne del capo e
        della coda. Ha un carattere estremamente collerico.
    alpha-sapphire:
      ja-Hrkt: |-
        かみついて　もうどくを　あたえる。
        てんてきの　おおきな　とりポケモンも
        からだが　しびれて　うごけなくなる。
      ja: |-
        かみついて　猛毒を　与える。
        天敵の　大きな　とりポケモンも
        体が　しびれて　動けなくなる。
      ko: |-
        물어서 맹독을 퍼뜨린다.
        천적인 커다란 새포켓몬도
        몸이 마비돼서 움직일 수 없다.
      en: |-
        Its bite injects a potent poison, enough to paralyze
        large bird Pokémon that try to prey on it.
      fr: |-
        Sa morsure est très venimeuse. Elle paralyse même les grands
        Pokémon Oiseaux, ses prédateurs.
      de: |-
        Es beißt Angreifer und injiziert ihnen Gift, das selbst große
        Vogel-Pokémon, seine natürlichen Feinde, lähmt.
      es: |-
        Inocula un poderoso veneno al morder. Hasta sus enemigos
        acérrimos, los Pokémon pájaro, se quedan inmóviles.
      it: |-
        Mordendo, inietta un veleno potente. Anche i grandi Pokémon
        uccello, suoi predatori, ne rimangono paralizzati.
    sword:
      ja-Hrkt: |-
        ヤクデは　しゅるいの　ちかい
        なかまだが　おたがいが　であうと
        おおげんかに　なるぞ。
      ja: |-
        ヤクデは　種類の　近い
        仲間だが　おたがいが　出会うと
        大げんかに　なるぞ。
      ko: |-
        태우지네와는 종류가 다른
        동료지만 서로 만나면
        큰 싸움이 된다.
      zh-Hant: |-
        雖然和燒火蚣屬於種類
        相近的夥伴，但是彼此
        撞見時就會大打一架喔。
      zh-Hans: |-
        虽然与烧火蚣是种类
        相近的伙伴，但是
        一见面就会大打一番。
      en: |-
        Venipede and Sizzlipede are similar species,
        but when the two meet, a huge fight ensues.
      fr: |-
        Bien qu’appartenant à des espèces similaires,
        les Venipatte et les Grillepattes se livrent
        à des conflits violents lorsqu’ils se croisent.
      de: |-
        Es ist zwar artverwandt mit Thermopod, aber
        jedes Mal, wenn sich die beiden über den Weg
        krabbeln, streiten sie erbittert miteinander.
      es: |-
        Aunque se trata de una especie emparentada
        con los Sizzlipede, si se encuentran ejemplares
        de ambas, entablarán una lucha encarnizada.
      it: |-
        Appartiene a una specie simile a quella di
        Sizzlipede, ma se le loro strade si incrociano
        si scatena il finimondo.
    shield:
      ja-Hrkt: |-
        キバに　もうどくを　もっている。
        くえそうな　えものを　みつけると
        あとさき　かんがえず　とびかかる。
      ja: |-
        キバに　猛毒を　もっている。
        食えそうな　獲物を　見つけると
        あとさき　考えず　跳びかかる。
      ko: |-
        이빨에 맹독을 지녔다.
        먹을 수 있는 먹이를 발견하면
        앞뒤를 가리지 않고 덤벼든다.
      zh-Hant: |-
        牙齒有劇毒。一旦發現了
        看似能吃下肚的獵物，
        就會不加思索地撲上去。
      zh-Hans: |-
        牙齿上有剧毒。一旦
        发现看上去能吃的猎物，
        就会不假思索地扑上去。
      en: |-
        Its fangs are highly venomous. If this Pokémon
        finds prey it thinks it can eat, it leaps for them
        without any thought of how things might turn out.
      fr: |-
        Ses crocs sont extrêmement venimeux.
        Dès qu’il voit une proie à son goût, il bondit
        sur elle sans penser aux conséquences.
      de: |-
        In den Fangzähnen speichert es höchst potentes
        Gift. Wenn Toxiped potenzielle Beute erspäht,
        stürzt es sich vollkommen unüberlegt auf diese.
      es: |-
        Sus colmillos contienen un veneno letal. Si
        encuentra una presa que parece comestible, se
        abalanza sobre ella sin pensárselo dos veces.
      it: |-
        Le sue zanne contengono un potente veleno.
        Se trova una preda che pensa di poter mangiare,
        la assale senza pensare alle conseguenze.
