      fr: |-
        Il sonde les alentours avec les antennes sur sa tête
        et sa queue. Il est extrêmement brutal.
      de: |-
        Mit seinen Ruten und den Fühlern an seinem Kopf tastet es
        die Umgebung ab. Ein überaus aggressiver Geselle.
      es: |-
        Percibe su entorno con su sentido del tacto, residente en su
