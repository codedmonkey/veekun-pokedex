beldum:
  base_happiness: 35
  capture_rate: 3
  color: blue
  egg_groups:
    - mineral
  evolution_chain: beldum
  evolves_from: ~
  flavor_text:
    ruby:
      en: |-
        Instead of blood, a powerful magnetic
        force courses throughout BELDUM’s
        body. This POKéMON communicates withothers by sending controlled pulses of
        magnetism.
    sapphire:
      en: |-
        BELDUM keeps itself floating by
        generating a magnetic force that
        repels earth’s natural magnetism.When it sleeps, this POKéMON anchors
        itself to a cliff using the hooks on
        its rear.
    emerald:
      en: |-
        When BELDUM gather in a swarm, they move
        in perfect unison as if they were but one
        POKéMON. They communicate with each other
        using brain waves.
    firered:
      en: |-
        It uses magnetic waves to converse with
        its kind. All the cells in its body are
        magnetic.
    leafgreen:
      en: |-
        It uses magnetic waves to converse with
        its kind. All the cells in its body are
        magnetic.
    diamond:
      en: |-
        It converses with others by using
        magnetic pulses. In a swarm, they
        move in perfect unison.
    pearl:
      en: |-
        It converses with others by using
        magnetic pulses. In a swarm, they
        move in perfect unison.
    platinum:
      en: |-
        It converses with others by using
        magnetic pulses. In a swarm, they
        move in perfect unison.
    heartgold:
      en: |-
        The magnetic force generated by
        its body repels the ground’s
        natural magnetism, letting it float. 
    soulsilver:
      en: |-
        The magnetic force generated by
        its body repels the ground’s
        natural magnetism, letting it float. 
    black:
      en: |-
        It converses with others by using
        magnetic pulses. In a swarm, they
        move in perfect unison.
      fr: |-
        Il dialogue avec les siens par 
        impulsions magnétiques. En bande,
        ils se déplacent à l’unisson.
    white:
      en: |-
        It converses with others by using
        magnetic pulses. In a swarm, they
        move in perfect unison.
      fr: |-
        Il dialogue avec les siens par 
        impulsions magnétiques. En bande,
        ils se déplacent à l’unisson.
    black-2:
      en: |-
        Its cells are all magnetic,
        and it communicates with others
        by using magnetic pulses.
    white-2:
      en: |-
        Its cells are all magnetic,
        and it communicates with others
        by using magnetic pulses.
    x:
      ja-Hrkt: |-
        からだから　でている　じりょくと
        ちじょうの　じりょくを
        はんぱつさせて　そらに　うかぶのだ。
      ja: |-
        体から　出ている　磁力と
        地上の　磁力を　反発させて
        空に　浮かぶのだ。
      ko: |-
        몸에서 나오는 자력과
        지상의 자력을
        충돌시켜 하늘에 떠오른다.
      en: |-
        The magnetic force generated by its body repels
        the ground’s natural magnetism, letting it float.
      fr: |-
        Il dégage un champ magnétique opposé à celui
        de la terre, ce qui lui permet de léviter.
      de: |-
        Es fliegt, indem es eine magnetische Kraft erzeugt,
        durch die es der natürlichen Anziehungskraft der
        Erde trotzt.
      es: |-
        Los pulsos magnéticos de su cuerpo repelen la
        gravedad, lo que le permite flotar en el aire.
      it: |-
        Riesce a fluttuare in aria grazie alla repulsione tra
        le proprie onde magnetiche e quelle della terra.
    'y':
      ja-Hrkt: |-
        じりょくの　はちょうで　なかまと
        かいわする。むれになった　ダンバルは
        いっしみだれぬ　うごきを　する。
      ja: |-
        磁力の　波長で　仲間と　会話する。
        群れになった　ダンバルは
        一糸乱れぬ　動きを　する。
      ko: |-
        자력의 파장으로 동료와
        대화한다. 무리가 된 메탕은
        한 치의 흐트러짐 없이 움직인다.
      en: |-
        It converses with others by using magnetic pulses.
        In a swarm, they move in perfect unison.
      fr: |-
        Il dialogue avec les siens par impulsions magnétiques.
        En bande, ils se déplacent à l’unisson.
      de: |-
        Es kommuniziert mit anderen durch magnetische
        Impulse. Im Schwarm bilden sie eine perfekte Einheit.
      es: |-
        Se comunican mediante pulsos magnéticos.
        Cuando van en grupos, se mueven al unísono.
      it: |-
        Comunica con i suoi simili mediante onde magnetiche.
        I gruppi di Beldum si muovono in perfetta sintonia.
    omega-ruby:
      ja-Hrkt: |-
        からだの　なかでは　けつえきの　かわりに
        きょうりょくな　じりょくが　めぐっている。
        じりょくの　はどうで　なかまと　かいわする。
      ja: |-
        体の　中では　血液の　代りに
        強力な　磁力が　巡っている。
        磁力の　波動で　仲間と　会話する。
      ko: |-
        몸 안에는 혈액 대신에
        강력한 자력이 돌고 있다.
        자력의 파동으로 동료와 대화한다.
      en: |-
        Instead of blood, a powerful magnetic force courses
        throughout Beldum’s body. This Pokémon communicates
        with others by sending controlled pulses of magnetism.
      fr: |-
        Au lieu du sang, une force magnétique très puissante coule
        dans les veines de Terhal. Ce Pokémon communique avec
        les autres en envoyant des pulsations magnétiques.
      de: |-
        Anstelle von Blut fließt eine starke magnetische Energie durch
        Tanhels Körper. Dieses Pokémon kommuniziert mit anderen,
        indem es kontrollierte magnetische Impulse aussendet.
      es: |-
        En lugar de sangre, Beldum tiene una poderosa fuerza
        magnética corriéndole por las venas. Este Pokémon se
        comunica enviando controlados impulsos magnéticos.
      it: |-
        Al posto del sangue, il corpo di Beldum è attraversato da
        una potente forza magnetica. Il Pokémon comunica con
        gli altri inviando impulsi magnetici controllati.
    alpha-sapphire:
      ja-Hrkt: |-
        からだから　でている　じりょくと　ちきゅうの
        じりょくを　はんぱつさせて　ちゅうに　うかぶ。
        おしりの　ツメを　がけに　くいこませて　ねむる。
      ja: |-
        体から　出ている　磁力と　地球の
        磁力を　反発させて　宙に　浮かぶ。
        お尻の　ツメを　崖に　食い込ませて　眠る。
      ko: |-
        몸에서 나오는 자력과 지구의
        자력을 반발시켜 공중에 뜬다.
        엉덩이의 발톱을 절벽에 박고 잔다.
      en: |-
        Beldum keeps itself floating by generating a magnetic force
        that repels earth’s natural magnetism. When it sleeps, this
        Pokémon anchors itself to a cliff using the hooks on its rear.
      fr: |-
        Terhal peut léviter en générant un champ magnétique qui
        repousse le magnétisme naturel de la terre. Lorsqu’il dort, ce
        Pokémon s’ancre à une falaise grâce à ses crochets dorsaux.
      de: |-
        Tanhel hält sich am Schweben, indem es eine magnetische
        Kraft erzeugt, die dem Erdmagnetfeld entgegenwirkt.
        Wenn es schläft, verankert sich dieses Pokémon mit den
        Haken an seinem Hinterteil an einem Felsen.
      es: |-
        Beldum se mantiene flotando en el aire gracias a la fuerza
        magnética que genera y que repele la gravedad. Para dormir,
        este Pokémon se ancla a los riscos usando los ganchos que
        tiene.
      it: |-
        Beldum fluttua nell’aria generando una forza magnetica
        contraria alla naturale forza di gravità terrestre.
        Quando dorme, si ancora alle scogliere usando i suoi
        ganci posteriori.
    sun:
      ja-Hrkt: |-
        さいぼう　すべてが　じしゃく。
        じりょくを　つかって　なかまと
        コミュニケーションを　とる。
      ja: |-
        細胞　すべてが　磁石。
        磁力を　使って　仲間と
        コミュニケーションを　取る。
      ko: |-
        모든 세포가 자석이다.
        자력을 사용해 동료와
        커뮤니케이션을 한다.
      zh-Hant: |-
        細胞全部是磁鐵。
        會使用磁力和夥伴之間進行交流。
      zh-Hans: |-
        细胞全部是磁铁。
        使用磁力和伙伴之间进行交流。
      en: |-
        Its cells are all magnets. It uses magnetism
        to communicate with others of its kind.
      fr: |-
        Toutes ses cellules sont en fait des aimants.
        Il utilise la force magnétique pour communiquer
        avec ses congénères.
      de: |-
        Seine Zellen sind magnetisch geladen.
        Es kommuniziert mit anderen, indem es
        magnetische Impulse aussendet.
      es: |-
        Todas las células de su cuerpo son imanes. Se
        comunica con los suyos mediante magnetismo.
      it: |-
        Tutte le sue cellule sono calamite.
        Il suo corpo emette onde magnetiche, tramite
        le quali comunica con i suoi simili.
    moon:
      ja-Hrkt: |-
        じりょくを　はなって　あいてを
        ひきよせた　ところで　おしりの
        ツメで　きりさくのだ。
      ja: |-
        磁力を　放って　相手を
        ひき寄せた　ところで　お尻の
        ツメで　切り裂くのだ。
      ko: |-
        자력을 발산해 상대를
        끌어들이고 엉덩이의
        발톱으로 베어 가른다.
      zh-Hant: |-
        放出磁力將對手吸到身邊，
        然後用臀部的爪子將對方割開。
      zh-Hans: |-
        放出磁力将对手吸到身边的时候，
        用臀部的爪子将对方劈开。
      en: |-
        With magnetic traction, it pulls its opponents in
        close. When they’re in range, it slashes them
        with its rear claws.
      fr: |-
        Il attire ses ennemis avec des ondes
        magnétiques et les pourfend avec ses griffes
        caudales dès qu’ils sont à portée.
      de: |-
        Es sendet magnetische Impulse aus, um Gegner
        zu sich heranzuziehen und sie dann mit den
        Krallen an seinem Hinterteil aufzuschlitzen.
      es: |-
        Atrae a sus rivales con el magnetismo que emite,
        y, cuando están cerca, los despedaza con las
        garras que tiene en la parte trasera.
      it: |-
        Attira a sé i nemici grazie alla propria forza
        magnetica per poi farli a pezzi con gli artigli
        posteriori.
    ultra-sun:
      ja-Hrkt: |-
        たいないでは　けつえきの　かわりに
        じりょくが　めぐっている。　ちょうしが
        わるいときは　じしゃくを　あげよう。
      ja: |-
        体内では　血液の　代わりに
        磁力が　巡っている。　調子が
        悪いときは　磁石を　あげよう。
      ko: |-
        체내에는 혈액을 대신하여
        자력이 돌고 있다. 몸 상태가
        좋지 않을 때는 자석을 주자.
      zh-Hant: |-
        在體內循環的不是血液而是磁力。
        當牠身體狀況不好的時候
        就拿磁鐵給牠吧。
      zh-Hans: |-
        体内循环着的不是血液而是磁力。
        身体状况不好时，就给它磁铁吧。
      en: |-
        Instead of blood, magnetism flows through its
        body. When it’s feeling bad, try giving it
        a magnet.
      fr: |-
        Son corps n’est pas traversé par du sang, mais
        par des champs magnétiques. S’il est fatigué,
        il suffit de lui donner un aimant à grignoter.
      de: |-
        Statt Blut fließt in seinem Körper magnetische
        Energie. Wenn es sich nicht gut fühlt, kann man
        ihm einen Magnet geben.
      es: |-
        En vez de torrente sanguíneo, el cuerpo de este
        Pokémon cuenta con corrientes magnéticas. Es
        recomendable darle un imán si se encuentra mal.
      it: |-
        Nel corpo di Beldum invece del sangue scorre
        una forza magnetica. Quando non si sente bene,
        basta dargli una calamita.
    ultra-moon:
      ja-Hrkt: |-
        おこらせると　あばれるだけでなく
        つよい　じりょくを　はなつので
        きかいの　たぐいは　こわれてしまう。
      ja: |-
        怒らせると　暴れるだけでなく
        強い　磁力を　放つので
        機械の　類は　壊れてしまう。
      ko: |-
        화가 나면 날뛸 뿐만 아니라
        강한 자력도 발산하기 때문에
        기계 종류는 고장 나 버린다.
      zh-Hant: |-
        如果惹牠生氣，牠不但會大鬧，
        還會放出強大的磁力，
        讓機械類的東西壞掉。
      zh-Hans: |-
        如果把它惹恼，不仅会大闹一番，
        还会放出强大的磁力，
        所以会把机械类的东西都破坏掉。
      en: |-
        If you anger it, it will do more than rampage. It
        will also burst out strong magnetism, causing
        nearby machines to break.
      fr: |-
        Quand on l’énerve, il entre dans une colère noire
        et déchaîne un puissant champ magnétique
        qui peut endommager les machines alentour.
      de: |-
        Wenn man es wütend macht, tobt es nicht nur,
        sondern sendet auch eine starke magnetische
        Kraft aus, die manche Maschinen kaputtmacht.
      es: |-
        Cuando se le provoca, no solo monta en cólera,
        sino que emite también un potente magnetismo
        que inutiliza ciertos tipos de máquinas.
      it: |-
        Quando si arrabbia diventa violento ed emette
        una potente forza magnetica che danneggia
        le macchine.
    sword:
      ja-Hrkt: |-
        じりょくを　おしりから　はっせいさせ
        てきを　いきおいよく　すいよせて
        するどい　ツメで　くしざしにする。
      ja: |-
        磁力を　お尻から　発生させ
        敵を　勢いよく　吸いよせて
        鋭い　ツメで　串刺しにする。
      ko: |-
        엉덩이에서 자력을 발생시켜서
        상대를 기세 좋게 끌어들인 뒤
        날카로운 발톱으로 찔러버린다.
      zh-Hant: |-
        會從臀部放出磁力
        將敵人迅猛地吸到身邊，
        再以銳利的爪子刺穿對方。
      zh-Hans: |-
        从臀部发出磁力，猛地
        将敌人吸过来，然后用
        锐利的爪子把对方刺穿。
      en: |-
        From its rear, Beldum emits a magnetic force that
        rapidly pulls opponents in. They get skewered on
        Beldum’s sharp claws.
      fr: |-
        Ce Pokémon peut créer un champ magnétique
        derrière lui qui attire ses ennemis avec force.
        Il les embroche alors de ses griffes acérées.
      de: |-
        Mit der Magnetkraft, die es an seinem Hinterteil
        erzeugt, zieht es Gegner ruckartig zu sich heran,
        um sie mit seinen scharfen Krallen aufzuspießen.
      es: |-
        Atrae con fuerza a sus enemigos debido al
        magnetismo que emite por la parte trasera
        y les clava sus afilados ganchos.
      it: |-
        Attira vigorosamente i nemici grazie alla potente
        forza magnetica generata dal didietro e li
        trafigge con gli artigli affilati.
    shield:
      ja-Hrkt: |-
        からだの　さいぼうは　じしゃくで
        できている。　けつえきの　かわりに
        じりょくが　ぜんしんを　めぐる。
      ja: |-
        体の　細胞は　磁石で
        できている。　血液の　代わりに
        磁力が　全身を　巡る。
      ko: |-
        몸의 세포가 자석으로
        되어 있다. 혈액 대신에
        자력이 온몸에 흐른다.
      zh-Hant: |-
        身體的細胞都由磁鐵
        構成。在全身循環的
        不是血液，而是磁力。
      zh-Hans: |-
        身体的细胞由磁铁构成。
        循环于全身的不是血液，
        而是磁力。
      en: |-
        The cells in this Pokémon’s body are composed
        of magnetic material. Instead of blood, magnetic
        forces flow through Beldum’s body.
      fr: |-
        Les cellules de son corps sont composées
        d’aimants. Une force magnétique coule
        dans ses veines à la place du sang.
      de: |-
        Die Zellen seines Körpers bestehen aus
        Magneten. Anstelle von Blut fließt magnetische
        Energie durch Tanhel.
      es: |-
        Las células de su cuerpo están hechas de imanes.
        En lugar de sangre, una fuerza magnética recorre
        su cuerpo.
      it: |-
        Nel suo corpo, le cui cellule sono composte
        da calamite, scorre forza magnetica al posto
        del sangue.
