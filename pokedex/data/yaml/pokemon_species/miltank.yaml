    x:
      ja-Hrkt: |-
        こどもが　うまれたときに
        しぼられた　ミルクには　いつもより
        えいようが　たっぷり　つまっている。
      ja: |-
        子供が　生まれたときに
        しぼられた　ミルクには　いつもより
        栄養が　たっぷり　つまっている。
      ko: |-
        새끼가 태어났을 때에
        짜낸 우유는 평상시보다
        영양이 듬뿍 담겨 있다.
      en: |-
        If it is around babies, the milk it produces contains
        much more nutrition than usual.
      fr: |-
        Si elle vient d’avoir un petit, son lait est bien plus
        nutritif que d’habitude.
      de: |-
        Wenn es gerade ein Junges hat, dann enthält
        seine Milch mehr Nährstoffe als gewöhnlich.
      es: |-
        Si tiene crías, la leche que produce contiene muchos
        más nutrientes de lo normal.
      it: |-
        Se ha appena avuto un piccolo, il latte che produce
        è molto più nutriente del normale.
    'y':
      ja-Hrkt: |-
        ミルクは　えいようまんてん。
        おとしよりや　びょうきの　ひとに
        とって　さいこうの　のみもの。
      ja: |-
        ミルクは　栄養満点。
        お年寄りや　病気の　人に　とって
        最高の　飲み物。
      ko: |-
        우유는 영양 만점이다.
        노인과 병든 사람에게
        최고의 음료수다.
      en: |-
        Its milk is packed with nutrition, making it the
        ultimate beverage for the sick or weary.
      fr: |-
        Son lait est très nutritif. C’est une boisson parfaite
        pour les malades et les personnes âgées.
      de: |-
        Aufgrund der vielen Nährstoffe stellt seine Milch
        das ideale Getränk für Kranke und Schwache dar.
      es: |-
        Su leche, rica en nutrientes, es la mejor bebida contra
        el cansancio y la enfermedad.
      it: |-
        Il suo latte è ricco di sostanze nutrienti, che ne
        fanno il miglior rimedio per chi è stanco o malato.
    omega-ruby:
      ja-Hrkt: |-
        まいにち　２０リットルの　ミルクを　だす。
        あまい　ミルクは　おとなも　こどもも　だいすき。
        にがてな　ひとは　ヨーグルトにして　たべている。
      ja: |-
        毎日　２０リットルの　ミルクを　だす。
        甘い　ミルクは　大人も　子どもも　大好き。
        苦手な　人は　ヨーグルトにして　食べている。
      ko: |-
        매일 20리터의 우유가 나온다.
        달콤한 우유는 어른도 아이도 매우 좋아한다.
        싫어하는 사람은 요구르트로 만들어 먹는다.
      en: |-
        Miltank gives over five gallons of milk on a daily basis.
        Its sweet milk is enjoyed by children and grown-ups alike.
        People who can’t drink milk turn it into yogurt and eat
        it instead.
      fr: |-
        Écrémeuh produit plus de 20 l de lait par jour.
        Son lait sucré fait le bonheur des petits et des grands.
        Les gens qui ne boivent pas de lait en font du yaourt.
      de: |-
        Miltank gibt täglich 20 l Milch. Sie ist süßlich und wird
        von Kindern und Erwachsenen gleichermaßen genossen.
        Menschen, die keine Milch trinken, essen sie stattdessen
        als Joghurt.
      es: |-
        Miltank da al día 20 l de una leche dulce que es la delicia de
        pequeños y mayores. Aquellos que no pueden tomarla, se
        decantan por los yogures.
      it: |-
        Miltank produce 20 litri di latte al giorno. Il latte è apprezzato
        da adulti e bambini perché leggermente dolce. Chi non può
        bere latte, lo usa per farne uno yogurt squisito.
    alpha-sapphire:
      ja-Hrkt: |-
        まいにち　２０リットルの　ミルクを　だす。
        あまい　ミルクは　おとなも　こどもも　だいすき。
        にがてな　ひとは　ヨーグルトにして　たべている。
      ja: |-
        毎日　２０リットルの　ミルクを　だす。
        甘い　ミルクは　大人も　子どもも　大好き。
        苦手な　人は　ヨーグルトにして　食べている。
      ko: |-
        매일 20리터의 우유가 나온다.
        달콤한 우유는 어른도 아이도 매우 좋아한다.
        싫어하는 사람은 요구르트로 만들어 먹는다.
      en: |-
        Miltank gives over five gallons of milk on a daily basis. Its
        sweet milk is enjoyed by children and grown-ups alike. People
        who can’t drink milk turn it into yogurt and eat it instead.
      fr: |-
        Écrémeuh produit plus de 20 l de lait par jour.
        Son lait sucré fait le bonheur des petits et des grands.
        Les gens qui ne boivent pas de lait en font du yaourt.
      de: |-
        Miltank gibt täglich 20 l Milch. Sie ist süßlich und wird
        von Kindern und Erwachsenen gleichermaßen genossen.
        Menschen, die keine Milch trinken, essen sie stattdessen
        als Joghurt.
      es: |-
        Miltank da al día 20 l de una leche dulce que es la delicia de
        pequeños y mayores. Aquellos que no pueden tomarla, se
        decantan por los yogures.
      it: |-
        Miltank produce 20 litri di latte al giorno. Il latte è apprezzato
        da adulti e bambini perché leggermente dolce. Chi non può
        bere latte, lo usa per farne uno yogurt squisito.
    sun:
      ja-Hrkt: |-
        そのミルクは　えいようまんてんで
        こうカロリー。　ゆえに　のみすぎると
        ミルタンクみたいな　たいけいに　なる。
      ja: |-
        そのミルクは　栄養満点で
        高カロリー。　ゆえに　飲みすぎると
        ミルタンクみたいな　体型に　なる。
      ko: |-
        그 우유는 영양 만점에
        고칼로리이다. 고로 너무 많이
        마시면 밀탱크 같은 체형이 된다.
      zh-Hant: |-
        牠的牛奶營養豐富且熱量很高。
        如果飲用過量的話
        就會變成大奶罐般的體型。
      zh-Hans: |-
        这款牛奶营养丰富且热量很高。
        所以饮用过量的话
        就会变成大奶罐那样的体型。
      en: |-
        Its milk is high in calories and packed with
        nutrients. Therefore, if you drink too much of it,
        you may wind up with a body like Miltank’s.
      fr: |-
        Son lait est aussi nutritif qu’hypercalorique.
        À consommer avec modération, sous peine de
        finir avec une silhouette « Écrémeuh-esque ».
      de: |-
        Seine Milch ist kalorienreich und enthält viele
        Nährstoffe. Trinkt man zu viel davon, hat man
        allerdings selbst bald eine Figur wie Miltank.
      es: |-
        La leche que produce Miltank tiene muchas
        calorías y es muy nutritiva. Si bebes demasiada,
        tu cuerpo se empezará a parecer al suyo.
      it: |-
        Il suo latte è ricco di sostanze nutritive e molto
        calorico. Se se ne beve troppo, si finisce per
        avere quello che si definisce “girovita Miltank”.
    moon:
      ja-Hrkt: |-
        ミルクを　とるため　そだてる　ひとが
        ほとんどだが　かなり　たくましくて
        タフなので　たたかいにも　むいている。
      ja: |-
        ミルクを　採るため　育てる　人が
        ほとんどだが　かなり　たくましくて
        タフなので　戦いにも　向いている。
      ko: |-
        우유를 얻기 위해 키우는 사람이
        대부분이지만 상당히 늠름하고
        터프해서 싸움에도 적합하다.
      zh-Hant: |-
        人們幾乎都是為了生產鮮奶而培育牠，
        但因為相當強壯和結實，
        也很適合參加戰鬥。
      zh-Hans: |-
        人们几乎都是为了采集牛奶而培育它，
        但因为相当强壮和结实，
        也会用来战斗。
      en: |-
        Most people raise it for its milk, but it’s quite
        tough and strong, so it’s also well suited
        for battle.
      fr: |-
        Ce Pokémon est surtout élevé pour son lait,
        bien que sa stature imposante en fasse un
        Pokémon de combat tout à fait respectable.
      de: |-
        Den meisten Menschen dient Miltank in erster
        Linie als Milchlieferant, doch es ist stark genug,
        um auch im Kampf eine gute Figur abzugeben.
      es: |-
        La mayoría de la gente cría Miltank por su leche,
        pero al ser tan resistente, este Pokémon
        también puede usarse para combatir.
      it: |-
        Viene allevato principalmente per il latte,
        ma poiché è piuttosto forte e robusto,
        è efficace anche nelle lotte.
    ultra-sun:
      ja-Hrkt: |-
        ひに　２０リットルの　ちちを　だす。
        ぼくそうの　しつが　よい　とちほど
        だす　ミルクは　コクがあり　うまい。
      ja: |-
        日に　２０リットルの　乳を　出す。
        牧草の　質が　良い　土地ほど
        出す　ミルクは　コクがあり　美味い。
      ko: |-
        하루에 20리터의 젖을 짠다.
        목초의 질이 좋은 산지일수록
        밀크는 진해서 맛있다.
      zh-Hant: |-
        每天能生產２０公升的鮮奶。
        當地的牧草越是優質，
        牠所生產的鮮奶就越香濃美味。
      zh-Hans: |-
        每天能产出２０升的牛奶。
        越是能长出优质牧草的土地，
        它所产出的牛奶也就越香浓可口。
      en: |-
        It produces over five gallons of milk a day. The
        higher the quality of the pastures it lives in,
        the richer and tastier its milk becomes.
      fr: |-
        Les 20 litres de lait qu’il produit chaque jour
        gagneront en saveur et en caractère s’il vit
        dans un pâturage de bonne qualité.
      de: |-
        Es gibt täglich 20 l Milch. Je besser die Qualität
        des Grases ist, desto schmackhafter ist sie.
      es: |-
        Produce 20 litros de leche al día, que es más
        sabrosa cuanto mejor sea el pasto.
      it: |-
        Produce 20 litri di latte al giorno. Più alta è la
        qualità del pascolo, più gustoso sarà il latte.
    ultra-moon:
      ja-Hrkt: |-
        ミルクは　おいしく　えいようまんてん。
        ただし　のみすぎると　おなかが
        くだることも　あるので　ちゅういだ。
      ja: |-
        ミルクは　おいしく　栄養満点。
        ただし　飲みすぎると　お腹が
        下ることも　あるので　注意だ。
      ko: |-
        우유는 맛있고 영양 만점이다.
        단 너무 마시면 배가
        아플 수도 있으므로 주의하자.
      zh-Hant: |-
        牛奶既美味又營養豐富，
        但要小心，如果喝太多了，
        有時可能會拉肚子。
      zh-Hans: |-
        牛奶很可口又富含营养。
        但要小心，如果喝多了，
        有时就会拉肚子。
      en: |-
        Its milk is delicious and chock-full of nutrients.
        However, if you drink too much, it could make
        your stomach hurt, so be careful.
      fr: |-
        Son lait est délicieux et très nutritif, mais il ne
        faut pas en abuser pour éviter d’éventuels
        petits problèmes de digestion.
      de: |-
        Seine Milch ist lecker und nahrhaft. Doch wenn
        man zu viel davon trinkt, kann man Durchfall
        bekommen.
      es: |-
        La leche de Miltank es deliciosa y nutritiva,
        pero, consumida en exceso, puede causar
        retortijones.
      it: |-
        Il suo latte è buono e ricco di sostanze nutritive,
        ma se se ne beve troppo, si rischia il mal di
        pancia.
    sword:
      ja-Hrkt: |-
        えいよう　まんてんの　ミルクを　だす
        ことから　ふるくから　にんげんと
        ポケモンの　くらしを　ささえてきた。
      ja: |-
        栄養満点の　ミルクを　出すことから
        古くから　人間と　ポケモンの
        暮らしを　支えてきた。
      ko: |-
        영양 만점의 우유를 만들어내서
        옛날부터 사람과 포켓몬의
        삶을 지탱해왔다.
      zh-Hant: |-
        由於能生產營養滿分的
        鮮奶，自古以來支持著
        人類與寶可夢的生活。
      zh-Hans: |-
        能挤出营养十足的鲜奶，
        因此从很久以前开始就一直
        支持着人类和宝可梦的生活。
      en: |-
        Miltank produces highly nutritious milk, so it’s
        been supporting the lives of people and other
        Pokémon since ancient times.
      fr: |-
        Grâce à son lait très nutritif, Écrémeuh contribue
        depuis longtemps au bien-être des humains
        et des Pokémon.
      de: |-
        Dank seiner äußerst nährstoffreichen Milch trägt
        Miltank seit langer Zeit zum Wohl von Menschen
        und Pokémon bei.
      es: |-
        Debido a la nutritiva leche que produce, ha
        contribuido al bienestar de humanos y Pokémon
        desde tiempos inmemoriales.
      it: |-
        Il suo latte altamente nutriente contribuisce
        al sostentamento di persone e Pokémon
        da tempo immemore.
    shield:
      ja-Hrkt: |-
        まいにち　ミルクを　しぼらないと
        ぐあいが　わるくなる。　ミルクの
        あじは　きせつに　よって　かわるぞ。
      ja: |-
        毎日　ミルクを　搾らないと
        具合が　悪くなる。　ミルクの　味は
        季節によって　変わるぞ。
      ko: |-
        매일 우유를 짜지 않으면
        컨디션이 나빠진다. 우유의
        맛은 계절에 따라 다르다.
      zh-Hant: |-
        如果沒有每天擠鮮奶，
        身體的狀況就會變糟。
        鮮奶的風味會隨季節改變。
      zh-Hans: |-
        如果不每天帮它挤鲜奶，
        它的身体就会不舒服。
        鲜奶的味道会随季节改变。
      en: |-
        This Pokémon needs to be milked every day,
        or else it will fall ill. The flavor of Miltank milk
        changes with the seasons.
      fr: |-
        Sa santé décline si on ne le trait pas tous les jours.
        Le goût de son lait varie selon la saison.
      de: |-
        Miltanks Gesundheit leidet darunter, wenn es
        nicht jeden Tag gemolken wird. Der Geschmack
        seiner Milch ändert sich je nach Jahreszeit.
      es: |-
        Si no se ordeña a Miltank a diario, enferma. El
        sabor de la leche que produce cambia según la
        época del año.
      it: |-
        Se non viene munto ogni giorno, la sua salute
        ne risente. Il sapore del suo latte può variare
        in base alla stagione.
