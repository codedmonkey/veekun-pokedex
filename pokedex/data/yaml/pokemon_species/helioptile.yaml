helioptile:
  base_happiness: 50
  capture_rate: 190
  color: yellow
  egg_groups:
    - monster
    - dragon
  evolution_chain: helioptile
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        さばくで　せいかつする。たいようの
        ひかりを　あびて　はつでんすれば
        エサを　たべなくても　へいきなのだ。
      ja: |-
        砂漠で　生活する。
        太陽の　光を　浴びて　発電すれば
        エサを　食べなくても　平気なのだ。
      ko: |-
        사막에서 생활한다. 태양의
        빛을 쬐고 발전하면
        먹이를 먹지 않아도 괜찮다.
      en: |-
        They make their home in deserts. They can
        generate their energy from basking in the sun,
        so eating food is not a requirement.
      fr: |-
        Ce Pokémon vit dans le désert.
        Il n’a pas besoin de se nourrir, car il est capable
        d’absorber l’énergie du soleil.
      de: |-
        Es ist in der Wüste zu Hause und wandelt
        die Energie der Sonne in Körperkraft um,
        wodurch es auch ohne Nahrung auskommt.
      es: |-
        Habita en los desiertos y, cuando toma el sol, acumula
        energía, lo que le permite vivir sin la necesidad de
        ingerir alimentos.
      it: |-
        Vive nei deserti. Può produrre energia elettrica
        sfruttando la luce solare e, grazie a essa, può
        sopravvivere anche senza mangiare.
    'y':
      ja-Hrkt: |-
        あたまの　りょうわきの　ひだには
        たいようの　ひかりを　あびると
        はつでんする　さいぼうが　あるのだ。
      ja: |-
        頭の　両わきの　ひだには
        太陽の　光を　浴びると
        発電する　細胞が　あるのだ。
      ko: |-
        머리의 양측 주름에는
        태양의 빛을 쐬면
        발전하는 세포가 있다.
      en: |-
        The frills on either side of its head have cells
        that generate electricity when exposed to sunlight.
      fr: |-
        Les plis de peau de chaque côté de sa tête sont
        dotés de cellules produisant de l’électricité quand
        elles sont exposées à la lumière du soleil.
      de: |-
        Die Zellen der Hautlappen, die sich beidseitig an
        seinem Kopf befinden, erzeugen Strom, wenn sie
        von Sonnenstrahlen beschienen werden.
      es: |-
        Bajo los pliegues situados a ambos lados de la cabeza
        residen células que, al exponerse a la luz del sol, son
        capaces de generar electricidad.
      it: |-
        Le pieghe ai due lati della testa contengono cellule
        in grado di convertire la luce solare in energia
        elettrica.
    omega-ruby:
      ja-Hrkt: |-
        さばくで　せいかつする。たいようの
        ひかりを　あびて　はつでんすれば
        エサを　たべなくても　へいきなのだ。
      ja: |-
        砂漠で　生活する。
        太陽の　光を　浴びて　発電すれば
        エサを　食べなくても　平気なのだ。
      ko: |-
        사막에서 생활한다. 태양의
        빛을 쬐고 발전하면
        먹이를 먹지 않아도 괜찮다.
      en: |-
        They make their home in deserts. They can
        generate their energy from basking in the sun,
        so eating food is not a requirement.
      fr: |-
        Ce Pokémon vit dans le désert. Il n’a pas besoin de se nourrir,
        car il est capable d’absorber l’énergie du soleil.
      de: |-
        Es ist in der Wüste zu Hause und wandelt die Energie der
        Sonne in Körperkraft um, wodurch es auch ohne Nahrung
        auskommt.
      es: |-
        Habita en los desiertos y, cuando toma el sol, acumula
        energía, lo que le permite vivir sin la necesidad de ingerir
        alimentos.
      it: |-
        Vive nei deserti. Può produrre energia elettrica sfruttando
        la luce solare e, grazie a essa, può sopravvivere anche
        senza mangiare.
    alpha-sapphire:
      ja-Hrkt: |-
        あたまの　りょうわきの　ひだには
        たいようの　ひかりを　あびると
        はつでんする　さいぼうが　あるのだ。
      ja: |-
        頭の　両わきの　ひだには
        太陽の　光を　浴びると
        発電する　細胞が　あるのだ。
      ko: |-
        머리의 양측 주름에는
        태양의 빛을 쐬면
        발전하는 세포가 있다.
      en: |-
        The frills on either side of its head have cells
        that generate electricity when exposed to sunlight.
      fr: |-
        Les plis de peau de chaque côté de sa tête sont dotés
        de cellules produisant de l’électricité quand elles sont
        exposées à la lumière du soleil.
      de: |-
        Die Zellen der Hautlappen, die sich beidseitig an seinem Kopf
        befinden, erzeugen Strom, wenn sie von Sonnenstrahlen
        beschienen werden.
      es: |-
        Bajo los pliegues situados a ambos lados de la cabeza
        residen células que, al exponerse a la luz del sol, son
        capaces de generar electricidad.
      it: |-
        Le pieghe ai due lati della testa contengono cellule in grado
        di convertire la luce solare in energia elettrica.
    sword:
      ja-Hrkt: |-
        あたまの　ひだを　ひろげ　たいようの
        ひかりで　はつでんすると　パワフルな
        でんきわざを　だせるようになる。
      ja: |-
        頭の　ひだを　広げ　太陽の
        光で　発電すると　パワフルな
        電気技を　出せるようになる。
      ko: |-
        머리에 있는 주름을 펼쳐서
        태양의 빛으로 발전하면 파워풀한
        전기 기술을 쓸 수 있게 된다.
      zh-Hant: |-
        當牠張開頭部的褶邊
        用太陽光發電，就能使出
        威力強大的電屬性招式。
      zh-Hans: |-
        当它张开头部的褶边
        用太阳光发电，就能使出
        威力强大的电属性招式。
      en: |-
        When spread, the frills on its head act like solar
        panels, generating the power behind this
        Pokémon’s electric moves.
      fr: |-
        Il absorbe les rayons du soleil en dépliant la peau
        de sa tête pour produire l’électricité nécessaire
        à ses puissantes capacités Électrik.
      de: |-
        Es breitet die Hautlappen an seinem Kopf aus,
        um mithilfe des Sonnenlichts Strom zu erzeugen
        und mächtige Elektro-Attacken einzusetzen.
      es: |-
        Extiende los pliegues de la cabeza para absorber
        la luz del sol y convertirla en electricidad, con la
        que realiza potentes ataques de tipo Eléctrico.
      it: |-
        Distende le pieghe sulla testa per raccogliere la
        luce solare e produrre energia elettrica che
        usa per sferrare potenti mosse di tipo Elettro.
    shield:
      ja-Hrkt: |-
        たいようはつでんの　しくみを　もつ。
        はつでんを　じゃま　されると
        ストレスで　よわってしまう。
      ja: |-
        太陽発電の　仕組みを　もつ。
        発電を　じゃま　されると
        ストレスで　弱ってしまう。
      ko: |-
        태양광 발전 구조를 가졌다.
        발전을 방해하면
        스트레스를 받아서 약해진다.
      zh-Hant: |-
        擁有太陽能發電的結構。
        如果有人打擾牠發電，
        牠就會因心理壓力而衰弱。
      zh-Hans: |-
        拥有太阳能发电的结构。
        如果有人打扰它发电，
        它就会因心理压力而衰弱。
      en: |-
        The sun powers this Pokémon’s electricity
        generation. Interruption of that process
        stresses Helioptile to the point of weakness.
      fr: |-
        Il peut générer de l’électricité grâce au soleil.
        Si on le dérange en pleine production d’énergie,
        cela le stresse et l’affaiblit.
      de: |-
        Es kann aus Sonnenlicht Elektrizität erzeugen.
        Unterbricht man es jedoch bei diesem Prozess,
        verliert es vor lauter Stress all seine Kraft.
      es: |-
        Es capaz de generar electricidad a partir de la
        luz del sol. Si lo interrumpen en pleno proceso,
        se pone nervioso y pierde las fuerzas.
      it: |-
        Possiede un organo con cui genera energia
        elettrica fotovoltaica. Se viene disturbato mentre
        la produce, si stressa e si indebolisce.
