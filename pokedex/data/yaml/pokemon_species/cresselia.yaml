        みかづきのけしん　と　よばれている。
      ja: |-
        クレセリアの　羽を　持って　寝ると
        楽しい　夢が　見られると　いう。
        三日月の化身　と　呼ばれている。
      ko: |-
        크레세리아의 날개를 가지고 자면
        즐거운 꿈을 꿀 수 있다고 한다.
        초승달의 화신으로 불리고 있다.
      en: |-
