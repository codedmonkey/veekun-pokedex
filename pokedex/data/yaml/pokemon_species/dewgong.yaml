    black-2:
      en: |-
        Its streamlined body has low resistance,
        and it swims around cold oceans at
        a speed of eight knots.
    white-2:
      en: |-
        Its streamlined body has low resistance,
        and it swims around cold oceans at
        a speed of eight knots.
    x:
      ja-Hrkt: |-
        ぜんしんが　まっしろな　けで
        おおわれている。さむさに　つよく
        むしろ　さむいほど　げんきになる。
      ja: |-
        全身が　真っ白な　毛で
        覆われている。寒さに　強く
        むしろ　寒いほど　元気になる。
      ko: |-
        전신이 새하얀 털로
        뒤덮여 있다. 추위에 강해서
        오히려 추울수록 힘이 넘쳐 난다.
      en: |-
        Its body is covered with a pure white fur.
        The colder the weather, the more active
        it becomes.
      fr: |-
        Son corps est recouvert d’une fourrure d’un blanc pur.
        Plus il fait froid, et plus ce Pokémon est actif.
      de: |-
        Sein Körper ist mit reinem, weißem Fell überzogen.
        Je kälter es wird, desto aktiver wird dieses Pokémon.
      es: |-
        Está recubierto de un luminoso pelaje blanco. Este
        Pokémon aumenta su actividad cuando bajan las
        temperaturas.
      it: |-
        Ha il corpo ricoperto da una candida pelliccia bianca.
        Più fa freddo, più questo Pokémon è attivo.
    'y':
      ja-Hrkt: |-
        からだは　みずの　ていこうが
        すくない　りゅうせんけい。
        さむくなるほど　げんきが　でてくる。
      ja: |-
        体は　水の　抵抗が
        少ない　流線型。
        寒くなるほど　元気が　出てくる。
      ko: |-
        몸은 물의 저항이
        적은 유선형이다.
        추워질수록 기운이 난다.
      en: |-
        Its streamlined body has little drag in water.
        The colder the temperature, the friskier it gets.
      fr: |-
        Son corps hydrodynamique glisse dans l’eau.
        Plus l’eau est froide plus il se sent à l’aise.
      de: |-
        Es verspürt kaum Widerstand im Wasser. Je niedriger
        die Temperatur, desto verspielter verhält es sich.
      es: |-
        Su aerodinámico cuerpo avanza fácilmente por el agua.
        Cuanto más fría, más diversión.
      it: |-
        Il suo corpo affusolato ha poco attrito nell’acqua.
        Le basse temperature lo rendono vivace.
    omega-ruby:
      ja-Hrkt: |-
        つめたい　こおりの　うえで　ねるのが　だいすき。
        むかし　ひょうざんで　ねむる　すがたを　みた
        ふなのりが　にんぎょと　まちがえた。
      ja: |-
        冷たい　氷の　上で　寝るのが　大好き。
        昔　氷山で　眠る　姿を　見た
        船乗りが　人魚と　間違えた。
      ko: |-
        차가운 얼음 위에서 자는 것을 매우 좋아한다.
        옛날에 빙산에서 자는 모습을 본
        뱃사람이 인어로 착각했다.
      en: |-
        Dewgong loves to snooze on bitterly cold ice. The sight of this
        Pokémon sleeping on a glacier was mistakenly thought to be a
        mermaid by a mariner long ago.
      fr: |-
        Lamantine adore piquer un roupillon à même la glace. Il y a
        très longtemps, un marin ayant aperçu ce Pokémon dormant
        sur un glacier a cru voir une sirène.
      de: |-
        Jugong liebt es, auf bitterkalten Eisschollen ein Nickerchen
        zu machen. Ein Seemann, der einmal ein solches Pokémon
        schlafend auf einem Eisberg sah, hielt es irrtümlicherweise
        für eine Meerjungfrau.
      es: |-
        A Dewgong le encanta dormitar sobre la frialdad del hielo.
        Antiguamente, algún que otro marino lo confundió con una
        sirena al verlo dormido sobre un glaciar.
      it: |-
        Dewgong adora riposare su una gelida lastra di ghiaccio.
        In passato i marinai confondevano il profilo di questo
        Pokémon addormentato sulla superficie gelata con una sirena.
    alpha-sapphire:
      ja-Hrkt: |-
        つめたい　こおりの　うえで　ねるのが　だいすき。
        むかし　ひょうざんで　ねむる　すがたを　みた
        ふなのりが　にんぎょと　まちがえた。
      ja: |-
        冷たい　氷の　上で　寝るのが　大好き。
        昔　氷山で　眠る　姿を　見た
        船乗りが　人魚と　間違えた。
      ko: |-
        차가운 얼음 위에서 자는 것을 매우 좋아한다.
        옛날에 빙산에서 자는 모습을 본
        뱃사람이 인어로 착각했다.
      en: |-
        Dewgong loves to snooze on bitterly cold ice. The sight of
        this Pokémon sleeping on a glacier was mistakenly thought
        to be a mermaid by a mariner long ago.
      fr: |-
        Lamantine adore piquer un roupillon à même la glace. Il y a
        très longtemps, un marin ayant aperçu ce Pokémon dormant
        sur un glacier a cru voir une sirène.
      de: |-
        Jugong liebt es, auf bitterkalten Eisschollen ein Nickerchen zu
        machen. Ein Seemann, der ein solches Pokémon eines Tages
        auf einem Eisberg schlafen sah, hielt es für eine Meerjungfrau.
      es: |-
        A Dewgong le encanta dormitar sobre la frialdad del hielo.
        Antiguamente, algún que otro marino lo confundió con una
        sirena al verlo dormido sobre un glaciar.
      it: |-
        Dewgong adora riposare su una gelida lastra di ghiaccio.
        In passato i marinai confondevano il profilo di questo
        Pokémon addormentato sulla superficie gelata con una sirena.
    ultra-sun:
      ja-Hrkt: |-
        ８ノットの　そくどで　うみを　およぎ
        えもので　ある　ポケモンを　さがす。
        とくに　ヨワシが　だいこうぶつ。
      ja: |-
        ８ノットの　速度で　海を　泳ぎ
        獲物である　ポケモンを　探す。
        特に　ヨワシが　大好物。
      ko: |-
        8노트의 속도로 바다를 헤엄쳐
        먹이가 되는 포켓몬을 찾는다.
        특히 약어리를 매우 좋아한다.
      zh-Hant: |-
        能以８節的速度在海中游動，
        尋找能當成獵物的寶可夢。
        弱丁魚是牠最愛吃的東西。
      zh-Hans: |-
        能以８节的速度在海里游动，
        并搜寻能当做猎物的宝可梦。
        特别喜欢吃弱丁鱼。
      en: |-
        It swims through the ocean at a speed of eight
        knots, searching for Pokémon that will become
        its prey. It’s especially fond of Wishiwashi.
      fr: |-
        Il sillonne les mers à la recherche de ses
        proies à une vitesse de 8 nœuds.
        Il raffole des Froussardine.
      de: |-
        Es schwimmt mit bis zu acht Knoten im Meer
        und sucht nach Beute. Für Lusardin hat es eine
        besondere Vorliebe.
      es: |-
        Surca los mares a velocidades de 8 nudos en
        busca de Pokémon que le sirvan de sustento.
        Siente predilección especial por los Wishiwashi.
      it: |-
        Nuota nel mare alla velocità di 8 nodi alla
        ricerca dei Pokémon di cui si nutre.
        È particolarmente ghiotto di Wishiwashi.
    ultra-moon:
      ja-Hrkt: |-
        しょくじの　あとは　すなはまで
        にっこうよくを　している。　たいおんを
        あげて　しょうかを　よく　するのだ。
      ja: |-
        食事の　後は　砂浜で
        日光浴を　している。　体温を
        あげて　消化を　よく　するのだ。
      ko: |-
        식사 후에는 모래 해변에서
        일광욕을 하고 있다. 체온을
        높여서 소화를 돕기 위함이다.
      zh-Hant: |-
        進食之後會在沙灘上
        做日光浴，藉此提高體溫
        來幫助消化。
      zh-Hans: |-
        进食后会在沙滩上晒日光浴。
        会通过提高体温来帮助消化。
      en: |-
        It sunbathes on the beach after meals. The rise
        in its body temperature helps its digestion.
      fr: |-
        Après manger, il s’étale de tout son long sur
        les plages de sable fin. Le soleil le réchauffe
        et facilite sa digestion.
      de: |-
        Nach einer Mahlzeit genießt es ein Sonnenbad
        am Strand. Durch die erhöhte Körpertemperatur
        wird seine Verdauung unterstützt.
      es: |-
        Le gusta tenderse al sol en la playa después de
        comer, ya que aumentar su temperatura
        corporal le facilita la digestión.
      it: |-
        Dopo mangiato prende il sole sulla spiaggia
        per far aumentare la sua temperatura corporea
        e favorire la digestione.
    lets-go-pikachu:
      ja-Hrkt: |-
        ぜんしん　ゆきのように　まっしろ。
        さむさに　つよく　こおりが　うかぶ
        うみも　げんきよく　およぎまわる。
      ja: |-
        全身　雪のように　真っ白。
        寒さに強く　氷が　浮かぶ
        海も　元気よく　泳ぎまわる。
      ko: |-
        온몸이 눈처럼 새하얗다.
        추위에 강해 얼음이 떠 있는
        바다도 기운차게 헤엄쳐 다닌다.
      zh-Hant: |-
        全身上下一片雪白。
        不畏寒冷，在滿是浮冰的海上
        也能元氣十足地游來游去。
      zh-Hans: |-
        全身像雪一样白。十分耐寒，
        即使是在有浮冰的大海里
        也能很精神地游来游去。
      en: |-
        Its entire body is a snowy white. Unharmed by
        even intense cold, it swims powerfully
        in icy waters.
      fr: |-
        Son corps entier est aussi blanc que la neige.
        Il résiste bien au froid et peut même nager
        au milieu des icebergs.
      de: |-
        Sein ganzer Körper ist schneeweiß. Da ihm Kälte
        nichts ausmacht, kann es selbst in Eiswasser
        kraftvoll schwimmen.
      es: |-
        Su cuerpo es blanco como la nieve. Puede nadar
        plácidamente en mares gélidos gracias a su
        resistencia al frío.
      it: |-
        Il suo corpo è bianco come la neve. Non soffre
        il freddo e nuota senza problemi anche in acque
        gelide.
    lets-go-eevee:
      ja-Hrkt: |-
