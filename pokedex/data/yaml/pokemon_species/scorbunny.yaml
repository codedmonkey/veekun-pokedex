scorbunny:
  base_happiness: 50
  capture_rate: 45
  color: white
  egg_groups:
    - ground
    - humanshape
  evolution_chain: scorbunny
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        はしりまわって　たいおんを　あげると
        ほのおエネルギーが　からだを　めぐり
        ほんらいの　ちからを　はっきできる。
      ja: |-
        走りまわって　体温を　上げると
        炎エネルギーが　体を　巡り
        本来の　力を　発揮できる。
      ko: |-
        뛰어다니며 체온을 높이면
        불꽃 에너지가 몸 안에 맴돌아
        본래의 힘을 발휘할 수 있다.
      zh-Hant: |-
        不斷奔跑使體溫升高後，
        火之能量會在牠體內循環，
        促使牠發揮出真正的力量。
      zh-Hans: |-
        不断奔跑使体温升高后，
        火之能量会在它身体循环，
        促使它发挥出真正的力量。
      en: |-
        A warm-up of running around gets fire energy
        coursing through this Pokémon’s body. Once that
        happens, it’s ready to fight at full power.
      fr: |-
        Il court pour augmenter sa température et faire
        circuler l’énergie incandescente dans son corps.
        Il peut ainsi déployer toute sa puissance.
      de: |-
        Erhöht es durch Rennen seine Körpertemperatur,
        strömt Feuer-Energie durch seinen Körper. Dann
        kann es seine wahre Kraft entfesseln.
      es: |-
        Se pone a correr para elevar su temperatura
        corporal y propagar la energía ígnea por todo
        el cuerpo. Desata así su verdadera fuerza.
      it: |-
        Quando corre, la sua temperatura corporea sale
        pervadendolo di un’energia infuocata che gli
        permette di scatenare la sua vera potenza.
    shield:
      ja-Hrkt: |-
        たたかう　じゅんびが　ととのうと
        はなの　あたまと　あしの　うらの
        にくきゅうが　こうねつを　はっする。
      ja: |-
        戦う　準備が　整うと
        鼻の　頭と　足の　裏の
        肉球が　高熱を　発する。
      ko: |-
        싸울 준비가 되면
        코끝과 발바닥의
        볼록살에서 고열을 낸다.
      zh-Hant: |-
        一旦做好了戰鬥的準備，
        牠鼻頭上和腳底的肉球
        就會散發出極度的高溫。
      zh-Hans: |-
        一旦做好了战斗的准备，
        它鼻头上和脚底的肉球
        就会发出极度的高温。
      en: |-
        It has special pads on the backs of its feet, and
        one on its nose. Once it’s raring to fight, these
        pads radiate tremendous heat.
      fr: |-
        Quand il est prêt à se battre, la partie
        qui surmonte son museau ainsi que les coussinets
        de ses pattes postérieures émettent de la chaleur.
      de: |-
        Ist es kampfbereit, verströmt es von seiner
        Nasenspitze und von den Ballen an seinen
        Läufen Hitze.
      es: |-
        Cuando se prepara para combatir, irradia calor
        por la punta de la nariz y el pelo que le recubre
        las patas.
      it: |-
        Quando si prepara a lottare, la punta del naso
        e i cuscinetti sotto le zampe irradiano calore.
