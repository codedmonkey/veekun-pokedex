    black:
      en: |-
        It loves to lurk inside holes in
        rocks. It sometimes sprays ink on
        prey by sticking out only its mouth.
      fr: |-
        Il adore se cacher dans les
        fissures de la roche. Il crache
        parfois de l’encre sur ses proies.
    white:
      en: |-
        It loves to lurk inside holes in
        rocks. It sometimes sprays ink on
        prey by sticking out only its mouth.
      fr: |-
        Il adore se cacher dans les
        fissures de la roche. Il crache
        parfois de l’encre sur ses proies.
    black-2:
      en: |-
        It has a tendency to want to be in holes.
        It prefers rock crags or pots and
        sprays ink from them before attacking.
    white-2:
      en: |-
        It has a tendency to want to be in holes.
        It prefers rock crags or pots and
        sprays ink from them before attacking.
    x:
      ja-Hrkt: |-
        あなに　はいりたがる　せいしつで
        いわあなや　ツボを　このみ　そこから
        スミを　ふきだして　こうげきする。
      ja: |-
        穴に　入りたがる　性質で
        岩穴や　ツボを　好み　そこから
        墨を　噴き出して　攻撃する。
      ko: |-
        구멍에 들어가고 싶어 하는 성질로
        바위굴이나 항아리를 좋아해 거기서
        먹물을 뿜어내 공격한다.
      en: |-
        It has a tendency to want to be in holes. It prefers
        rock crags or pots and sprays ink from them
        before attacking.
      fr: |-
        Il adore se cacher dans les fissures et les épaves,
        d’où il attaque en crachant de l’encre.
      de: |-
        Es verkriecht sich gerne in Löchern, von wo aus
        es Gegner mit Tinte beschießt. Es bevorzugt
        Felsspalten und Vasen.
      es: |-
        Tiene querencia por los agujeros. Ataca escupiendo
        tinta metido en las grietas de rocas o en recipientes.
      it: |-
        Ama rintanarsi nei vasi o nelle fessure della roccia,
        da dove attacca sparando getti d’inchiostro.
    'y':
      ja-Hrkt: |-
        がんじょうな　いしあたま。
        きゅうばんつきの　あしを　からませ
        ひたすら　あたまで　うちすえる。
      ja: |-
        頑丈な　石頭。
        吸盤つきの　脚を　絡ませ
        ひたすらに　頭で　打ちすえる。
      ko: |-
        튼튼한 돌머리다.
        빨판이 붙어 있는 다리를 휘감아
        한결같이 머리로 세게 때린다.
      en: |-
        It traps foes with the suction cups on its tentacles,
        then smashes them with its rock-hard head.
      fr: |-
        Il capture ses ennemis avec ses tentacules et les
        écrase ensuite avec sa tête dure comme la pierre.
      de: |-
        Beim Beutefang setzt es seine Tentakel ein.
        Es zermalmt seine Beute mit seinem steinharten Kopf.
      es: |-
        Atrapa a los enemigos con sus tentáculos y después
        los golpea con su dura cabeza.
      it: |-
        Cattura i nemici con le ventose dei tentacoli per poi
        colpirli con il suo capo duro come pietra.
    omega-ruby:
      ja-Hrkt: |-
        きゅうばんの　うでで　あいてに　からみつく。
        うごけなくなった　ところを　しとめるのだ。
        かなわない　ときは　スミを　はいて　にげる。
      ja: |-
        吸盤の　腕で　相手に　絡みつく。
        動けなくなった　ところを　仕留めるのだ。
        かなわない　ときは　スミを　吐いて　逃げる。
      ko: |-
        흡반이 달린 팔로 상대를 휘감는다.
        움직이지 못하게 되면 쓰러트린다.
        버거울 때는 먹물을 뿜고 도망간다.
      en: |-
        Octillery grabs onto its foe using its tentacles. This Pokémon
        tries to immobilize it before delivering the finishing blow. If the
        foe turns out to be too strong, Octillery spews ink to escape.
      fr: |-
        Octillery attrape son ennemi avec ses tentacules.
        Ce Pokémon essaie de l’immobiliser avant de lui asséner
        le coup final. Si l’ennemi s’avère trop fort, Octillery lui crache
        de l’encre à la figure et s’échappe.
      de: |-
        Octillery saugt sich mit seinen Tentakeln an einem Feind fest.
        Dieses Pokémon betäubt seinen Gegner, bevor es ihm den
        Rest gibt. Wenn ein Feind zu stark ist, speit es Tinte aus und
        flüchtet.
      es: |-
        Octillery se apodera de su enemigo con los tentáculos y lo
        deja inmovilizado antes de propinarle el golpe final. Si el
        enemigo resulta ser demasiado fuerte, Octillery expulsará tinta
        para escapar.
      it: |-
        Octillery afferra il nemico con i tentacoli immobilizzandolo
        prima di sferrare il colpo finale. Se il nemico è molto forte,
        Octillery sputa inchiostro e scappa.
    alpha-sapphire:
      ja-Hrkt: |-
        きゅうばんの　うでで　あいてに　からみつく。
        うごけなくなった　ところを　しとめるのだ。
        かなわない　ときは　スミを　はいて　にげる。
      ja: |-
        吸盤の　腕で　相手に　絡みつく。
        動けなくなった　ところを　仕留めるのだ。
        かなわない　ときは　スミを　吐いて　逃げる。
      ko: |-
        흡반이 달린 팔로 상대를 휘감는다.
        움직이지 못하게 되면 쓰러트린다.
        버거울 때는 먹물을 뿜고 도망간다.
      en: |-
        Octillery grabs onto its foe using its tentacles. This Pokémon
        tries to immobilize it before delivering the finishing blow. If the
        foe turns out to be too strong, Octillery spews ink to escape.
      fr: |-
        Octillery attrape son ennemi avec ses tentacules.
        Ce Pokémon essaie de l’immobiliser avant de lui asséner
        le coup final. Si l’ennemi s’avère trop fort, Octillery lui crache
        de l’encre à la figure et s’échappe.
      de: |-
        Octillery saugt sich mit seinen Tentakeln an einem Feind fest.
        Dieses Pokémon betäubt seinen Gegner, bevor es ihm den
        Rest gibt. Wenn ein Feind zu stark ist, speit es Tinte aus und
        flüchtet.
      es: |-
        Octillery se apodera de su enemigo con los tentáculos y lo
        deja inmovilizado antes de propinarle el golpe final. Si el
        enemigo resulta ser demasiado fuerte, Octillery expulsará tinta
        para escapar.
      it: |-
        Octillery afferra il nemico con i tentacoli immobilizzandolo
        prima di sferrare il colpo finale. Se il nemico è molto forte,
        Octillery sputa inchiostro e scappa.
    ultra-sun:
      ja-Hrkt: |-
        にげるときに　はく　スミはとくべつ。
        きゅうかくを　にぶらせる　せいぶんで
        はながきく　ポケモンも　まどわすぞ。
      ja: |-
        逃げるときに　はく　スミは特別。
        嗅覚を　鈍らせる　成分で
        鼻がきく　ポケモンも　惑わすぞ。
      ko: |-
        도망칠 때 내뿜는 먹물은 특별하다.
        후각을 둔하게 하는 성분으로
        후각이 발달한 포켓몬도 말려든다.
      zh-Hant: |-
        逃跑時吐出特別的墨汁，
        裡頭含有會讓嗅覺變遲鈍的成分，
        就算是鼻子靈敏的寶可夢也能騙過。
      zh-Hans: |-
        逃跑时吐出来的墨汁很特别。
        里面有着能让嗅觉变迟钝的成分，
        连鼻子灵敏的宝可梦也能迷惑。
      en: |-
        The ink it spits when escaping is special.
        It contains a substance that dulls the sense of
        smell, so Pokémon with keen noses get lost.
      fr: |-
        Il projette une encre spéciale quand il s’enfuit.
        Celle-ci perturbe l’odorat des Pokémon, même
        de ceux dotés d’un bon flair.
      de: |-
        Die Tinte, die es während der Flucht ausspeit,
        vermindert den Geruchssinn und verwirrt selbst
        Pokémon mit einer guten Nase.
      es: |-
        La tinta que expulsa al huir inhibe la capacidad
        olfativa del rival y afecta incluso a los Pokémon
        con el olfato más aguzado.
      it: |-
        Mentre fugge dai nemici sputa un inchiostro
        che inibisce le funzioni olfattive persino
        dei Pokémon con l’odorato più sviluppato.
    ultra-moon:
      ja-Hrkt: |-
        いわあなが　おもな　ねどこ。
        オクタンが　はく　まっくろな　スミは
        りょうりの　ざいりょうにも　なる。
      ja: |-
        岩穴が　おもな　寝床。
        オクタンが　はく　まっくろな　スミは
        料理の　材料にも　なる。
      ko: |-
        바위굴이 주된 잠자리다.
        대포무노가 뱉는 새까만 먹물은
        요리 재료로도 쓰인다.
      zh-Hant: |-
        岩洞是牠主要的棲身之處。
        章魚桶吐出的漆黑墨汁
        也可以用來當成料理用的食材。
      zh-Hans: |-
        岩洞是它主要的栖身之所。
        章鱼桶吐出的漆黑墨汁
        还会被当成制作料理时的食材。
      en: |-
        It usually sleeps in caves. The pitch-black ink
        that Octillery spits is also used for cooking.
      fr: |-
        Il dort dans les cavités rocheuses.
        L’encre noire qu’il projette sert aussi
        d’ingrédient de cuisine.
      de: |-
        Es schläft hauptsächlich in Felshöhlen. Die
        schwarze Tinte, die es ausspeit, wird auch als
        Kochzutat verwendet.
      es: |-
        Duerme principalmente en cavidades rocosas.
        La tinta negra que escupe se utiliza como
        ingrediente en la alta cocina.
      it: |-
        Ha l’abitudine di dormire nelle fessure delle
        rocce. Spara un inchiostro nerissimo che viene
        usato anche come ingrediente per cucinare.
    sword:
      ja-Hrkt: |-
        あなに　はいりたがる　せいしつで
        ほかの　ポケモンが　つくった
        すあなを　よこどりして　ねむる。
      ja: |-
        穴に　入りたがる　性質で
        ほかの　ポケモンが　作った
        巣穴を　横取りして　眠る。
      ko: |-
        구멍에 들어가고 싶어하는
        성질이 있어 다른 포켓몬이 만든
        굴을 빼앗고 그곳에서 잠을 잔다.
      zh-Hant: |-
        有著愛鑽洞的習性。
        會搶奪其他寶可夢築的
        巢穴，在裡面睡覺。
      zh-Hans: |-
        有着爱钻洞的习性。
        会抢夺其他宝可梦筑的
        巢穴，在里面睡觉。
      en: |-
        It has a tendency to want to be in holes. It
        prefers rock crags or pots and sprays ink from
        them before attacking.
      fr: |-
        Il adore se cacher dans des trous. Il n’hésite
        pas à s’approprier les trous creusés par d’autres
        Pokémon pour y dormir.
      de: |-
        Es fühlt sich instinktiv in Löchern am wohlsten und
        schläft auch am liebsten in solchen, wobei es
        mitunter die Schlafplätze von anderen einnimmt.
      es: |-
        Tiene querencia por los agujeros, hasta el punto
        de ocupar los que han hecho otros para anidar y
        dormir en ellos.
      it: |-
        Ama nascondersi nei buchi. Spesso ruba le tane
        di altri Pokémon per dormirvi.
    shield:
      ja-Hrkt: |-
        がんじょうな　いしあたま。
        きゅうばんつきの　あしを　からませ
        ひたすら　あたまで　うちすえる。
      ja: |-
        頑丈な　石頭。
        吸盤つきの　脚を　絡ませ
        ひたすら　頭で　打ちすえる。
      ko: |-
        머리가 돌처럼 단단하다.
        빨판이 붙어 있는 다리를 휘감아
        끊임없이 머리로 세게 때린다.
      zh-Hant: |-
        有著堅硬結實的腦袋。
        會用帶有吸盤的腳纏住對手，
        然後不停地用頭猛撞。
      zh-Hans: |-
        有着结实的坚硬脑袋。
        会用带吸盘的脚缠住对手，
        然后再一个劲地用头猛撞。
      en: |-
        It traps enemies with its suction-cupped
        tentacles, then smashes them with its
        rock-hard head.
      fr: |-
        Il capture ses ennemis avec ses tentacules
        et les écrase ensuite avec sa tête dure comme
        la pierre.
      de: |-
        Es umschlingt Beute mit seinen Tentakeln und
        verpasst ihr dann eine beherzte Kopfnuss mit
        seinem steinharten Schädel.
      es: |-
        Atrapa a sus enemigos con los tentáculos y
        después los golpea con su dura cabeza.
      it: |-
        Cattura i nemici con le ventose dei tentacoli per
        poi colpirli con il suo capo duro come pietra.
    legends-arceus:
      en: |-
        While Octillery still shoots water from its mouth, the drastic
        anatomical difference between it and Remoraid meant that for
        a long time, no one believed the former evolved from the latter.
