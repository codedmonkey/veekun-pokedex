    white-2:
      en: |-
        It desperately tries to keep its
        black tail hidden. It is said to be
        proof the tail hides a secret.
    x:
      ja-Hrkt: |-
        ひかりや　ショックを　きらう。
        こうげきされると　からだが　ふくらみ
        はんげきが　きょうりょくに　なる。
      ja: |-
        光や　ショックを　嫌う。
        攻撃されると　体が　ふくらみ
        反撃が　強力に　なる。
      ko: |-
        빛과 쇼크를 싫어한다.
        공격받으면 몸이 부풀어 올라
        반격이 강력해진다.
      en: |-
        It hates light and shock. If attacked, it inflates its
        body to build up its counterstrike.
      fr: |-
        Il déteste la lumière et les chocs. S’il est attaqué,
        il se gonflera pour riposter violemment.
      de: |-
        Es hasst Licht und Schläge. Wird es angegriffen,
        pumpt es sich auf, um einen Gegenschlag
        vorzubereiten.
      es: |-
        Odia la luz y las sacudidas. Si le atacan, infla su
        cuerpo para aumentar su contraataque.
      it: |-
        Odia la luce e gli shock. Se è attaccato, gonfia il
        corpo per preparare il contrattacco.
    'y':
      ja-Hrkt: |-
        まっくろな　しっぽを　かくすため
        くらやみで　ひっそりと　いきている。
        じぶんからは　こうげき　しない。
      ja: |-
        真っ黒な　尻尾を　隠すため
        暗闇で　ひっそりと　生きている。
        自分からは　攻撃しない。
      ko: |-
        새까만 꼬리를 숨기기 위해
        어둠 속에서 은밀히 지내고 있다.
        자신이 먼저 공격하는 일은 없다.
      en: |-
        To keep its pitch-black tail hidden, it lives quietly in
        the darkness. It is never first to attack.
      fr: |-
        Pour cacher sa queue noire, il vit discrètement dans
        l’obscurité. Il n’attaque jamais le premier.
      de: |-
        Es lebt in der Dunkelheit, um seinen schwarzen
        Schweif zu verstecken. Es greift nie zuerst an.
      es: |-
        Para mantener oculta su negra cola, vive en silencio
        en la oscuridad. Nunca ataca primero.
      it: |-
        Se ne sta sempre tranquillo al buio per nascondere la
        coda nera come la pece. Non attacca mai per primo.
    omega-ruby:
      ja-Hrkt: |-
        ２ひき　いじょう　あつまると　がまん　くらべを
        はじめるが　くうふくを　がまんして　しまうので
        ソーナンス　トレーナーは　ちゅういが　ひつよう。
      ja: |-
        ２匹　以上　集まると　我慢　比べを
        始めるが　空腹を　我慢して　しまうので
        ソーナンス　トレーナーは　注意が　必要。
      ko: |-
        두 마리 이상 모이면 참기 겨루기를
        시작하는데 배고픔도 참아버리기 때문에
        마자용 트레이너는 주의가 필요하다.
      en: |-
        If two or more Wobbuffet meet, they will turn competitive
        and try to outdo each other’s endurance. However, they may
        try to see which one can endure the longest without food.
        Trainers need to beware of this habit.
      fr: |-
        Si un ou plusieurs Qulbutoké se rencontrent, ils se mesurent
        les uns aux autres et font des concours d’endurance. Parfois,
        ils tentent de voir qui peut rester le plus longtemps sans
        manger. Mieux vaut être prévenu.
      de: |-
        Wenn zwei oder mehr Woingenau aufeinandertreffen,
        versuchen sie, gegenseitig ihre Geduld zu übertreffen.
        Sie möchten herausfinden, welches Pokémon es am längsten
        ohne Nahrung aushält. Darauf müssen Trainer achten.
      es: |-
        Si dos o más Wobbuffet se encuentran, se volverán
        competitivos e intentarán superarse en resistencia. Pero
        también puede que intenten aguantar sin comer; algo que
        los Entrenadores deben tener muy en cuenta.
      it: |-
        Quando due o più Wobbuffet si incontrano, diventano
        competitivi tentando di vanificare la reciproca resistenza.
        Talvolta fanno anche a gara per vedere chi resiste di più
        senza cibo. Gli Allenatori devono fare attenzione.
    alpha-sapphire:
      ja-Hrkt: |-
        ひたすら　がまんする　ポケモンだが　しっぽを
        こうげきされる　ことだけは　がまん　できない。
        あいてを　みちづれにする　チャンスを　うかがう。
      ja: |-
        ひたすら　我慢する　ポケモンだが　尻尾を
        攻撃される　ことだけは　我慢　出来ない。
        相手を　道連れにする　チャンスを　伺う。
      ko: |-
        한결같이 참는 포켓몬이지만 꼬리를
        공격당하는 것만은 참지 못한다.
        상대를 길동무로 만들 기회를 살핀다.
      en: |-
        Wobbuffet does nothing but endure attacks—it won’t attack on
        its own. However, it won’t endure an attack on its tail. When
        that happens, the Pokémon will try to take the foe with it using
        Destiny Bond.
      fr: |-
        Qulbutoké ne fait rien, à part encaisser des coups.
        Il n’attaque jamais de lui-même. Cependant, il ne supporte
        pas qu’on attaque sa queue. Lorsque ça arrive, ce Pokémon
        essaie d’entraîner son ennemi grâce à Prélèvem. Destin.
      de: |-
        Woingenau tut nichts anderes als Angriffe auszuhalten.
        Von sich aus würde es nie angreifen. Eine Attacke auf
        seinen Schweif würde es allerdings niemals dulden.
        Wenn das passiert, setzt es Abgangsbund ein.
      es: |-
        Wobbuffet no hace otra cosa que aguantar los golpes que
        recibe: nunca usa movimientos ofensivos. Pero, si le atacan
        a la cola, intentará llevarse con él al enemigo usando
        Mismo Destino.
      it: |-
        Wobbuffet non fa altro che subire le azioni nemiche:
        non agisce mai per primo. Tuttavia, non sopporta di essere
        attaccato alla coda. In questo caso cerca di trascinare
        con sé il nemico usando Destinobbligato.
    sword:
      ja-Hrkt: |-
        ひかりや　ショックを　きらう。
        こうげきされると　からだが　ふくらみ
        はんげきが　きょうりょくに　なる。
      ja: |-
        光や　ショックを　嫌う。
        攻撃されると　体が　ふくらみ
        反撃が　強力に　なる。
      ko: |-
        빛과 쇼크를 싫어한다.
        공격받으면 몸이 부풀어올라
        반격이 강력해진다.
      zh-Hant: |-
        討厭光和衝擊。
        受到攻擊時身體會膨脹，
        反擊也會因此變強。
      zh-Hans: |-
        讨厌光和冲击。
        受到攻击时，身体就会膨胀，
        反击也会因此变强。
      en: |-
        It hates light and shock. If attacked, it inflates its
        body to pump up its counterstrike.
      fr: |-
        Il déteste la lumière et les chocs. S’il est attaqué,
        il se gonfle pour riposter violemment.
      de: |-
        Es hasst Licht und Schocks. Wird es angegriffen,
        pumpt es sich auf, um einen Gegenschlag
        vorzubereiten.
      es: |-
        Odia la luz y las sacudidas. Si le atacan, infla su
        cuerpo para contraatacar con más ímpetu.
      it: |-
        Odia la luce e gli shock. Quando viene attaccato,
        gonfia il corpo per preparare il contrattacco.
    shield:
      ja-Hrkt: |-
        まっくろな　シッポを　かくすため
        くらやみで　ひっそりと　いきている。
        じぶんからは　こうげき　しない。
      ja: |-
        真っ黒な　尻尾を　隠すため
        暗闇で　ひっそりと　生きている。
        自分からは　攻撃しない。
      ko: |-
        새까만 꼬리를 숨기기 위해
        어둠 속에서 은밀히 지내고 있다.
        자신이 먼저 공격하는 일은 없다.
      zh-Hant: |-
        為了隱藏漆黑的尾巴
        而悄悄地生活在黑暗之中。
        不會主動發動攻擊。
      zh-Hans: |-
        为了隐藏漆黑的尾巴
        而悄悄地生活在黑暗之中。
        不会主动发起攻击。
      en: |-
        To keep its pitch-black tail hidden, it lives quietly
        in the darkness. It is never first to attack.
      fr: |-
        Il vit discrètement dans l’obscurité pour cacher
        sa queue noire. Il n’attaque jamais en premier.
      de: |-
        Es lebt in der Dunkelheit, um seinen schwarzen
        Schweif zu verstecken. Es greift nie zuerst an.
      es: |-
        Para mantener oculta su negra cola, vive en
        silencio en la oscuridad. Nunca ataca primero.
      it: |-
        Vive nel silenzio e nell’oscurità per nascondere
        la coda nera come la pece. Non attacca mai
        per primo.
