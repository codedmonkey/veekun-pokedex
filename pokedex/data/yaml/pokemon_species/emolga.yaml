emolga:
  base_happiness: 50
  capture_rate: 200
  color: white
  egg_groups:
    - ground
  evolution_chain: emolga
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        The energy made in its cheeks’ electric
        pouches is stored inside its membrane
        and released while it is gliding.
      fr: |-
        Il accumule dans ses membranes
        l’électricité qu’il produit dans ses
        bajoues, et la relâche tout en planant.
    white:
      en: |-
        They live on treetops and glide using
        the inside of a cape-like membrane
        while discharging electricity.
      fr: |-
        Il vit au sommet des arbres de la forêt.
        Il plane en déchargeant l’électricité de
        ses membranes semblables à une cape.
    black-2:
      en: |-
        It glides on its outstretched membrane
        while shocking foes with the electricity
        stored in the pouches on its cheeks.
    white-2:
      en: |-
        It glides on its outstretched membrane
        while shocking foes with the electricity
        stored in the pouches on its cheeks.
    x:
      ja-Hrkt: |-
        もりの　きのうえで　くらす。
        マントのような　まくの　うちがわを
        ほうでん　させながら　かっくうする。
      ja: |-
        森の　木の上で　暮らす。
        マントのような　膜の　内側を
        放電　させながら　滑空する。
      ko: |-
        숲의 나무 위에 산다.
        망토 같은 막의 안쪽을
        방전시키며 활공한다.
      en: |-
        They live on treetops and glide using the inside of
        a cape-like membrane while discharging electricity.
      fr: |-
        Il vit au sommet des arbres de la forêt. Il plane en
        déchargeant l’électricité de ses membranes
        semblables à une cape.
      de: |-
        Lebt in den Wipfeln der Waldbäume. Während es
        durch die Lüfte gleitet, entlädt es Strom aus seinen
        Fluglappen.
      es: |-
        Vive en la copa de los árboles. Produce descargas
        mientras vuela con el interior de la membrana que hace
        de capa.
      it: |-
        Vive nelle foreste sulle cime degli alberi. Plana
        usando una membrana simile a un mantello,
        elettrificata all’interno.
    'y':
      ja-Hrkt: |-
        ほほの　でんきぶくろで　つくった
        でんきを　まくの　うちがわに　ためて
        かっくうしながら　でんきを　はなつ。
      ja: |-
        ほほの　電気袋で　作った　電気を
        膜の　内側に　ためて
        滑空しながら　電気を　放つ。
      ko: |-
        볼의 전기 주머니에서 만든
        전기를 막 안쪽에 모아
        활공하며 전기를 발산한다.
      en: |-
        The energy made in its cheeks’ electric pouches is
        stored inside its membrane and released while it
        is gliding.
      fr: |-
        Il accumule dans ses membranes l’électricité qu’il
        produit dans ses bajoues, et la relâche tout en
        planant.
      de: |-
        Im Flug entlädt es Strom, den es mit seinen
        Backentaschen erzeugt und in seinen Fluglappen
        gespeichert hat.
      es: |-
        Almacena en una membrana la electricidad generada
        por sus mejillas y planea por los aires soltando
        descargas.
      it: |-
        Accumula nelle membrane l’elettricità che produce
        all’interno delle guance, poi la rilascia planando.
    omega-ruby:
      ja-Hrkt: |-
        もりの　きのうえで　くらす。
        マントのような　まくの　うちがわを
        ほうでん　させながら　かっくうする。
      ja: |-
        森の　木の上で　暮らす。
        マントのような　膜の　内側を
        放電　させながら　滑空する。
      ko: |-
        숲의 나무 위에 산다.
        망토 같은 막의 안쪽을
        방전시키며 활공한다.
      en: |-
        They live on treetops and glide using the inside of
        a cape-like membrane while discharging electricity.
      fr: |-
        Il vit au sommet des arbres de la forêt. Il plane en déchargeant
        l’électricité de ses membranes semblables à une cape.
      de: |-
        Lebt in den Wipfeln der Waldbäume. Während es durch die
        Lüfte gleitet, entlädt es Strom aus seinen Fluglappen.
      es: |-
        Vive en la copa de los árboles. Produce descargas mientras
        vuela con el interior de la membrana que hace de capa.
      it: |-
        Vive nelle foreste sulle cime degli alberi. Plana usando
        una membrana simile a un mantello, elettrificata all’interno.
    alpha-sapphire:
      ja-Hrkt: |-
        ほほの　でんきぶくろで　つくった
        でんきを　まくの　うちがわに　ためて
        かっくうしながら　でんきを　はなつ。
      ja: |-
        ほほの　電気袋で　作った　電気を
        膜の　内側に　ためて
        滑空しながら　電気を　放つ。
      ko: |-
        볼의 전기 주머니에서 만든
        전기를 막 안쪽에 모아
        활공하며 전기를 발산한다.
      en: |-
        The energy made in its cheeks’ electric pouches is
        stored inside its membrane and released while it
        is gliding.
      fr: |-
        Il accumule dans ses membranes l’électricité qu’il produit
        dans ses bajoues, et la relâche tout en planant.
      de: |-
        Im Flug entlädt es Strom, den es mit seinen Backentaschen
        erzeugt und in seinen Fluglappen gespeichert hat.
      es: |-
        Almacena en una membrana la electricidad generada por sus
        mejillas y planea por los aires soltando descargas.
      it: |-
        Accumula nelle membrane l’elettricità che produce all’interno
        delle guance, poi la rilascia planando.
    sun:
      ja-Hrkt: |-
        マントのような　まくで　かっくう。
        でんきを　まきちらして　てきも
        みかたも　かんでん　させまくる。
      ja: |-
        マントのような　膜で　滑空。
        電気を　まき散らして　敵も
        味方も　感電　させまくる。
      ko: |-
        망토 같은 막으로 활공한다.
        전기를 흩뿌려서 적도
        자기편도 전부 감전시킨다.
      zh-Hant: |-
        用斗篷一樣的翼膜滑翔。
        到處散布電流，
        讓敵人和同伴都紛紛觸電。
      zh-Hans: |-
        用斗篷一样的膜滑翔。
        到处放电，
        让敌人和同伴都纷纷触电。
      en: |-
        It glides using its cape-like membrane.
        Electrical energy scatters from it, shocking
        its friends and foes alike.
      fr: |-
        Telle une cape de super-héros, sa membrane
        de peau lui permet de planer. Il décharge alors
        son électricité sur ses ennemis... et ses alliés.
      de: |-
        Es gleitet mit seinen Fluglappen, die einem Cape
        ähneln, durch die Luft. Es entlädt ständig Strom,
        der Freund und Feind Stromschläge verpasst.
      es: |-
        Planea con su membrana, que hace las veces de
        capa. La electricidad que despide electrocuta
        sin distinción a enemigos y aliados.
      it: |-
        Si serve della membrana simile a un mantello
        per planare. Emana scariche elettriche che
        possono colpire nemici e alleati.
    moon:
      ja-Hrkt: |-
        でんげきで　きのみや　むしポケモンを
        こんがり　やいて　くう。　ツツケラが
        あけた　きのあなが　おもな　すだ。
      ja: |-
        電撃で　木の実や　むしポケモンを
        こんがり　焼いて　喰う。　ツツケラが
        空けた　木の穴が　主な　巣だ。
      ko: |-
        전격으로 나무열매나 벌레포켓몬을
        알맞게 구워서 먹는다. 콕코구리가
        뚫은 나무 구멍이 주된 서식지다.
      zh-Hant: |-
        會用電擊將樹果和蟲寶可夢
        烤得恰到好處後再吃掉。
        主要是把小篤兒挖出的樹洞當成巢穴。
      zh-Hans: |-
        用电击将树果和虫宝可梦
        烧得刚刚好后再吃掉。
        以小笃儿啄空的树洞为主要巢穴。
      en: |-
        It grills berries and bug Pokémon with electric
        shocks and makes a meal of them. It usually
        nests in the holes gouged in trees by Pikipek.
      fr: |-
        L’électricité lui sert à griller à point fruits et
        Pokémon Insecte. Il fait généralement son nid
        dans les arbres creusés par les Picassaut.
      de: |-
        Mit Strom röstet es Beeren und Käfer-Pokémon,
        bevor es sie frisst. Es lebt hauptsächlich in
        Baumhöhlen, die von Peppeck gemeißelt wurden.
      es: |-
        Suelta una descarga eléctrica para achicharrar
        bayas o Pokémon insecto. Suele habitar los
        nidos que los Pikipek horadan en los árboles.
      it: |-
        Arrostisce bacche e Pokémon Coleottero con
        scariche elettriche per poi mangiarli. Fa il nido
        nei buchi degli alberi fatti da Pikipek.
    ultra-sun:
      ja-Hrkt: |-
        でんきを　たくわえ　そらを　とぶ。
        かみなりが　とどろく　まよなかには
        そらを　うめつくすほど　いることも。
      ja: |-
        電気を　蓄え　空を　飛ぶ。
        雷が　とどろく　真夜中には
        空を　埋め尽くすほど　いることも。
      ko: |-
        전기를 모아 하늘을 난다.
        천둥이 치는 한밤중에는
        하늘을 가득 메울 정도로 많다.
      zh-Hant: |-
        蓄著電在空中飛行。
        在雷電交加的深夜裡，牠們甚至
        會密密麻麻地佈滿整個天空。
      zh-Hans: |-
        蓄着电在空中飞行。
        有时甚至会在雷鸣的深夜里，
        密密麻麻布满整个天空。
      en: |-
        They store up electricity to fly through the air.
        When thunder cracks at night, sometimes there
        are almost enough of them to blot out the sky.
      fr: |-
        Il plane dans les airs une fois qu’il est chargé en
        électricité. Les nuits où le tonnerre gronde, des
        centaines d’Emolga se regroupent dans le ciel.
      de: |-
        Es speichert Strom, um damit durch die Lüfte
        zu segeln. Ein nächtliches Blitzgewitter stellt
        sich manchmal als ein Schwarm Emolga heraus.
      es: |-
        Se carga de electricidad y se echa a volar.
        Durante las noches de tormenta eléctrica se los
        ve a centenares surcando el cielo.
      it: |-
        Si carica di energia e si alza in volo.
        Nelle notti di fulmini e tempesta, questi Pokémon
        sono così numerosi da invadere tutto il cielo.
    ultra-moon:
      ja-Hrkt: |-
        でんきを　まきちらしながら　とぶので
        とりポケモンたちが　ちかづかない。
        おかげで　エサを　ひとりじめできる。
      ja: |-
        電気を　まき散らしながら　飛ぶので
        とりポケモンたちが　近付かない。
        おかげで　エサを　ひとりじめできる。
      ko: |-
        전기를 흩뿌리면서 날기 때문에
        새포켓몬들이 다가오지 않는다.
        덕분에 먹이를 독차지할 수 있다.
      zh-Hant: |-
        會一邊到處放電一邊飛行，
        所以鳥寶可夢們不會靠近牠，
        這讓牠可以獨佔食物。
      zh-Hans: |-
        一边到处放电一边飞翔，
        因此鸟宝可梦们都不会靠近。
        得益于此，可以独占食物。
      en: |-
        As it flies, it scatters electricity around, so bird
        Pokémon keep their distance. That’s why
        Emolga can keep all its food to itself.
      fr: |-
        Les Pokémon oiseaux ne s’approchent pas de lui
        car il décharge de l’électricité en planant. Il peut
        donc garder sa nourriture pour lui tout seul.
      de: |-
        Vogel-Pokémon halten sich von ihm fern, da es
        im Flug Strom entlädt. Frei von Konkurrenz kann
        es seine Beute so für sich allein beanspruchen.
      es: |-
        Desprende descargas eléctricas mientras vuela,
        por lo que los Pokémon pájaro no se le acercan,
        y así puede quedarse la comida para él solo.
      it: |-
        Vola emettendo scariche elettriche che tengono
        alla larga gli altri Pokémon alati, e per questo
        non fa molta fatica a procurarsi il cibo.
    sword:
      ja-Hrkt: |-
        でんきを　ほとばしらせながら
        そらを　まうように　とぶ。
        かわいいが　やっかいなのだ。
      ja: |-
        電気を　ほとばしらせながら
        空を　舞うように　飛ぶ。
        可愛いが　やっかいなのだ。
      ko: |-
        전기를 내뿜으며
        하늘을 춤추듯이 난다.
        귀엽지만 성가시다.
      zh-Hant: |-
        會一邊放電一邊像是
        在空中跳舞般地飛行。
        雖然可愛，但很難纏。
      zh-Hans: |-
        一边放电一边如舞蹈般
        在空中飞翔。虽然很可爱，
        但是很难对付。
      en: |-
        As Emolga flutters through the air, it crackles
        with electricity. This Pokémon is cute, but it can
        cause a lot of trouble.
      fr: |-
        Il virevolte dans le ciel en libérant des gerbes
        d’électricité. Son vol est gracieux, mais peut
        s’avérer dangereux.
      de: |-
        Emolga fliegt anmutig durch die Lüfte und
        entlädt dabei Strom. Es ist zwar niedlich,
        kann aber auch für viel Ärger sorgen.
      es: |-
        Planea por el aire, casi como si danzara, mientras
        desprende electricidad. Resulta adorable, pero
        puede causar bastantes problemas.
      it: |-
        Vola nei cieli come danzando mentre sprigiona
        elettricità. È molto grazioso, ma può creare dei
        fastidi.
    shield:
      ja-Hrkt: |-
        あまい　きのみが　だいこうぶつ。
        ほおぶくろに　エサを　ためすぎ
        うまく　とべないときも　ある。
      ja: |-
        甘い　木の実が　大好物。
        頬袋に　エサを　溜めすぎ
        うまく　飛べないときも　ある。
      ko: |-
        달콤한 나무열매를 매우 좋아한다.
        볼주머니에 먹이를 너무 많이 넣어
        잘 날지 못할 때도 있다.
      zh-Hant: |-
        最喜歡甜甜的樹果。有時會
        因為在頰囊裡儲存了太多食物，
        結果讓自己無法好好飛行。
      zh-Hans: |-
        最喜欢甜甜的树果。有时也会
        因为在脸颊的袋子里囤了太多
        食物而无法好好飞行。
      en: |-
        This Pokémon absolutely loves sweet berries.
        Sometimes it stuffs its cheeks full of so much
        food that it can’t fly properly.
      fr: |-
        Les Baies sucrées sont son péché mignon.
        Il lui arrive d’en conserver beaucoup trop dans
        ses bajoues, ce qui l’empêche de bien planer.
      de: |-
        Emolga liebt süße Beeren. Manchmal hortet es
        so viel Futter in seinen Backentaschen, dass es
        nicht mehr richtig fliegen kann.
      es: |-
        Le encantan las bayas dulces. A veces almacena
        tanta comida en los carrillos que no puede volar
        bien.
      it: |-
        Va ghiotto di bacche dolci. A volte accumula
        troppo cibo nelle guance e fa fatica a volare.
