gigalith:
  base_happiness: 50
  capture_rate: 45
  color: blue
  egg_groups:
    - mineral
  evolution_chain: roggenrola
  evolves_from: boldore
  flavor_text:
    black:
      en: |-
        Compressing the energy from its
        internal core lets it fire off an attack
        capable of blowing away a mountain.
      fr: |-
        Il comprime de l’énergie dans son corps,
        et ses attaques sont assez puissantes
        pour renverser des montagnes.
    white:
      en: |-
        The solar energy absorbed by its body’s
        orange crystals is magnified internally
        and fired from its mouth.
      fr: |-
        Il amplifie dans son corps l’énergie du
        soleil absorbée par ses cristaux orangés
        et la projette par la bouche.
    black-2:
      en: |-
        The solar rays it absorbs are
        processed in its energy core
        and fired as a ball of light.
    white-2:
      en: |-
        The solar rays it absorbs are
        processed in its energy core
        and fired as a ball of light.
    x:
      ja-Hrkt: |-
        とりこんだ　たいようこうせんを
        エネルギーコアで　はんのう　させて
        ひかりのたまとして　うちだしてくる。
      ja: |-
        取りこんだ　太陽光線を
        エネルギーコアで　反応　させて
        光の玉として　撃ちだしてくる。
      ko: |-
        거두어들인 태양광선을
        에너지 코어로 반응시켜
        빛의 구슬로 쏘아낸다.
      en: |-
        The solar rays it absorbs are processed in its
        energy core and fired as a ball of light.
      fr: |-
        Il amplifie dans son noyau l’énergie du soleil absorbée
        par son corps et la projette en une boule de lumière.
      de: |-
        Es verarbeitet Sonnenstrahlen in seinem
        Energiekern zu Lichtkugeln weiter, um sie
        im Kampf auf seinen Gegner abzufeuern.
      es: |-
        Absorbe los rayos solares, procesa esa energía en su
        núcleo y lanza poderosas bolas de luz a sus enemigos.
      it: |-
        Assorbe i raggi solari e, grazie al suo nucleo
        energetico, li trasforma in palle di luce che poi spara.
    'y':
      ja-Hrkt: |-
        たいないの　コアで　エネルギーを
        あっしゅくして　うちだす　こうげきは
        やまを　ふきとばす　いりょく。
      ja: |-
        体内の　コアで　エネルギーを
        圧縮して　撃ち出す　攻撃は
        山を　吹き飛ばす　威力。
      ko: |-
        체내의 코어에서 에너지를
        압축하여 쏘아대는 공격은
        산을 날려버릴 만한 위력이다.
      en: |-
        Compressing the energy from its internal core
        lets it fire off an attack capable of blowing away
        a mountain.
      fr: |-
        Il comprime de l’énergie dans son corps, et ses
        attaques sont assez puissantes pour renverser des
        montagnes.
      de: |-
        Es kann ganze Berge einebnen, indem es Energie
        entlädt, die es in seinem Kern gesammelt und
        verdichtet hat.
      es: |-
        El núcleo de su cuerpo comprime la energía para
        lanzar ataques capaces de destruir una montaña.
      it: |-
        Comprime l’energia nel suo nucleo interno per poi
        spararla con una potenza che può spazzare via anche
        le montagne.
    omega-ruby:
      ja-Hrkt: |-
        とりこんだ　たいようこうせんを
        エネルギーコアで　はんのう　させて
        ひかりのたまとして　うちだしてくる。
      ja: |-
        取りこんだ　太陽光線を
        エネルギーコアで　反応　させて
        光の玉として　撃ちだしてくる。
      ko: |-
        거두어들인 태양 광선을
        에너지 코어로 반응시켜
        빛의 구슬로 쏘아낸다.
      en: |-
        The solar rays it absorbs are processed in its
        energy core and fired as a ball of light.
      fr: |-
        Il amplifie dans son noyau l’énergie du soleil absorbée
        par son corps et la projette en une boule de lumière.
      de: |-
        Es verarbeitet Sonnenstrahlen in seinem Energiekern zu
        Lichtkugeln weiter, um sie im Kampf auf seinen Gegner
        abzufeuern.
      es: |-
        Absorbe los rayos solares, procesa esa energía en su núcleo
        y lanza poderosas bolas de luz a sus enemigos.
      it: |-
        Assorbe i raggi solari e, grazie al suo nucleo energetico,
        li trasforma in palle di luce che poi spara.
    alpha-sapphire:
      ja-Hrkt: |-
        たいないの　コアで　エネルギーを
        あっしゅくして　うちだす　こうげきは
        やまを　ふきとばす　いりょく。
      ja: |-
        体内の　コアで　エネルギーを
        圧縮して　撃ち出す　攻撃は
        山を　吹き飛ばす　威力。
      ko: |-
        체내의 코어에서 에너지를
        압축하여 쏘아대는 공격은
        산을 날려버릴 만한 위력이다.
      en: |-
        Compressing the energy from its internal core
        lets it fire off an attack capable of blowing away
        a mountain.
      fr: |-
        Il comprime de l’énergie dans son corps, et ses attaques sont
        assez puissantes pour renverser des montagnes.
      de: |-
        Es kann ganze Berge einebnen, indem es Energie entlädt,
        die es in seinem Kern gesammelt und verdichtet hat.
      es: |-
        El núcleo de su cuerpo comprime la energía para lanzar
        ataques capaces de destruir una montaña.
      it: |-
        Comprime l’energia nel suo nucleo interno per poi spararla
        con una potenza che può spazzare via anche le montagne.
    sun:
      ja-Hrkt: |-
        たいようこうせんから　つくりだす
        エネルギーだんは　すごい　いりょく。
        ただ　よるや　あめのひは　うてない。
      ja: |-
        太陽光線から　つくりだす
        エネルギー弾は　凄い　威力。
        ただ　夜や　雨の日は　撃てない。
      ko: |-
        태양광선으로부터 만든
        에너지탄은 엄청난 위력이다.
        하지만 밤과 비 오는 날에는 쏠 수 없다.
      zh-Hant: |-
        利用太陽光製造出來的
        能量彈威力強大。
        但是晚上和雨天都無法發射。
      zh-Hans: |-
        从太阳光线中造出来的
        能量弹威力巨大。
        但是晚上和雨天无法射击。
      en: |-
        The blasts of energy it makes from sunbeams
        have terrifying power. However, it’s not able to
        fire its blasts at night or on rainy days.
      fr: |-
        Il absorbe les rayons solaires pour tirer des
        balles d’énergie incroyablement destructrices.
        Une arme inutilisable s’il pleut ou s’il fait nuit.
      de: |-
        Es verarbeitet Sonnenstrahlen zu Energiekugeln
        von ungeheurer Stärke. Nachts sowie bei Regen
        kann es diese jedoch nicht abfeuern.
      es: |-
        Absorbe los rayos solares y los transforma en
        poderosas bolas de energía. Sin embargo, no
        puede hacerlo de noche o en días lluviosos.
      it: |-
        Assorbe l’energia solare e la usa per sparare
        potentissime sfere di energia. Questa capacità
        diventa inutile di notte e nei giorni di pioggia.
    moon:
      ja-Hrkt: |-
        かなりの　ばりきを　もっているので
        けんせつかんけいしゃが　このんで
        パートナーに　えらぶ　ポケモンだ。
      ja: |-
        かなりの　馬力を　持っているので
        建設関係者が　好んで
        パートナーに　選ぶ　ポケモンだ。
      ko: |-
        상당한 체력을 지니고 있어
        건설 관계자가 파트너를
        선택할 때 선호하는 포켓몬이다.
      zh-Hant: |-
        因為擁有相當大的馬力，
        所以建築相關人員很喜歡
        選擇這個寶可夢當拍檔。
      zh-Hans: |-
        因为拥有相当大的马力，
        所以是深受建设相关人员喜爱，
        被选作同伴的宝可梦。
      en: |-
        Known for its hefty horsepower, this Pokémon
        is a popular partner for construction workers.
      fr: |-
        Ce Pokémon jouit d’une force physique
        hors-norme, ce qui fait de lui le meilleur allié
        des chefs de chantier.
      de: |-
        Es verfügt über gewaltige Stärke und ist
        deshalb bei Bauarbeitern sehr beliebt.
        Diese wählen es oft als Partner-Pokémon.
      es: |-
        La soberbia potencia de la que hace gala lo
        convierte en un ayudante idóneo para todo
        trabajador de la construcción.
      it: |-
        La grande forza di questo Pokémon lo rende
        un partner ideale nei lavori di edilizia.
    ultra-sun:
      ja-Hrkt: |-
        ぜんりょくで　エネルギーを　うつと
        その　パワーで　じぶんの　からだに
        むすうの　きれつが　はしる。
      ja: |-
        全力で　エネルギーを　撃つと
        その　パワーで　自分の　身体に
        無数の　亀裂が　はしる。
      ko: |-
        전력으로 에너지를 쏘면
        그 파워로 자신의 몸에
        무수한 균열이 생긴다.
      zh-Hant: |-
        如果全力射出能量，
        強大的力量會讓牠自己的身體
        產生出無數的裂痕。
      zh-Hans: |-
        如果以全力射出能量，
        那力量能让它自己的身体
        骤然产生出无数裂缝。
      en: |-
        When it fires off energy with all its might, the
        power creates countless fissures on its body.
      fr: |-
        D’innombrables fissures se dessinent à
        la surface de son corps lorsqu’il déchaîne
        toute son énergie.
      de: |-
        Wenn es mit geballter Kraft seine gesamte
        Energie entlädt, führt das dazu, dass sich auf
        seinem Körper unzählige Risse auftun.
      es: |-
        Cuando dispara energía con todas sus fuerzas,
        la potencia es tal que le provoca incontables
        fisuras por todo el cuerpo.
      it: |-
        Quando spara energia con tutte le sue forze,
        la potenza è tale da causare numerose fessure
        sul suo corpo.
    ultra-moon:
      ja-Hrkt: |-
        たいよう　こうせんを　きゅうしゅうし
        エネルギーを　うちだす。　ふだんは
        ちちゅうふかくに　みをひそめている。
      ja: |-
        太陽　光線を　吸収し
        エネルギーを　撃ち出す。　普段は
        地中深くに　身を潜めている。
      ko: |-
        태양 광선을 흡수해서
        에너지를 쏜다. 평소에는
        땅속 깊은 곳에 몸을 숨기고 있다.
      zh-Hant: |-
        會吸收太陽的光線，然後
        發射能量。平時都把自己
        藏在地底深處。
      zh-Hans: |-
        吸收太阳的光线，射出能量。
        平常都把身体藏在地底深处。
      en: |-
        It absorbs rays of sunlight and shoots out
        energy. It’s usually lurking deep beneath
        the surface.
      fr: |-
        Il peut absorber les rayons du soleil et les
        rejeter sous forme d’énergie, mais il se cache
        généralement au plus profond de la terre.
      de: |-
        Es absorbiert Sonnenstrahlen, um sie als Energie
        wieder zu entladen. Üblicherweise versteckt es
        sich tief unter der Erde.
      es: |-
        Absorbe los rayos de sol y los expulsa en forma
        de energía. Suele ocultarse en las profundidades
        subterráneas.
      it: |-
        Assorbe i raggi solari e li converte in energia
        per poi spararla. Tuttavia, in genere si rifugia
        nelle viscere della terra.
    sword:
      ja-Hrkt: |-
        たくましいので　こうじげんばや
        さいくつじょうで　ダイオウドウや
        ひとと　はたらいて　いることも。
      ja: |-
        たくましいので　工事現場や
        採掘場で　ダイオウドウや
        人と　働いて　いることも。
      ko: |-
        씩씩해서 공사 현장이나
        채굴장에서 대왕끼리동이나
        사람과 함께 일할 때도 있다.
      zh-Hant: |-
        由於擁有健壯的身體，
        有時可以在工地或採石場看到牠
        和大王銅象還有人類一起工作。
      zh-Hans: |-
        由于拥有健壮的身体，
        有时可以在工地或采石场看到它
        和大王铜象还有人类一起工作。
      en: |-
        This hardy Pokémon can often be found on
        construction sites and in mines, working
        alongside people and Copperajah.
      fr: |-
        Sa robustesse lui vaut parfois de travailler
        sur les chantiers et dans les carrières
        en compagnie des Hommes et des Pachyradjah.
      de: |-
        Aufgrund seiner Stärke arbeitet es zusammen mit
        Menschen und Patinaraja öfter mal als Aushilfe
        auf Baustellen oder in Bergwerken.
      es: |-
        Su robustez le permite colaborar con humanos
        y Copperajah en labores de construcción y
        minería.
      it: |-
        È molto robusto e per questo a volte lavora
        assieme a uomini e Copperajah nell’edilizia
        e nell’estrazione mineraria.
    shield:
      ja-Hrkt: |-
        はれた　ひに　しか　うてないが
        エネルギーだんの　はかいりょくは
        ダンプカーも　ふきとばすほど。
      ja: |-
        晴れた　日に　しか　撃てないが
        エネルギー弾の　破壊力は
        ダンプカーも　吹きとばすほど。
      ko: |-
        맑은 날에만 쏠 수 있지만
        에너지탄의 파괴력은
        덤프트럭도 날려버릴 정도다.
      zh-Hant: |-
        牠射出的能量彈具有
        能擊飛砂石車的破壞力。
        不過只有在晴天才能射擊。
      zh-Hans: |-
        它射出的能量弹具有
        可以击飞翻斗车的破坏力。
        不过只有在晴天才能射击。
      en: |-
        Although its energy blasts can blow away
        a dump truck, they have a limitation—
        they can only be fired when the sun is out.
      fr: |-
        Il est capable d’envoyer des boules d’énergie
        assez puissantes pour balayer un camion-benne,
        mais il ne peut tirer que les jours ensoleillés.
      de: |-
        Seine Energiekugeln können einen Lastwagen
        durch die Luft schleudern. Diese kann es aber
        nur bei schönem Wetter abfeuern.
      es: |-
        Las bolas de energía que lanza solo en días
        soleados son tan potentes que pueden hacer
        saltar un camión por los aires.
      it: |-
        La potenza delle sue sfere di energia è tale da
        spazzare via un camion. Tuttavia, può spararle
        solo nei giorni di sole.
