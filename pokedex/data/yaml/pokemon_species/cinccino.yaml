cinccino:
  base_happiness: 50
  capture_rate: 60
  color: gray
  egg_groups:
    - ground
  evolution_chain: minccino
  evolves_from: minccino
  flavor_text:
    black:
      en: |-
        Their white fur is coated in a special oil
        that makes it easy for them to
        deflect attacks.
      fr: |-
        Leurs poils blancs sont recouverts
        d’une graisse spéciale qui leur permet
        d’esquiver facilement les attaques.
    white:
      en: |-
        Their white fur feels amazing to touch.
        Their fur repels dust and prevents
        static electricity from building up.
      fr: |-
        La texture de ses poils blancs est
        incomparable. Elle n’attire ni la
        poussière, ni l’électricité statique.
    black-2:
      en: |-
        Cinccino’s body is coated
        in a special oil that helps it
        deflect attacks, such as punches.
    white-2:
      en: |-
        Cinccino’s body is coated
        in a special oil that helps it
        deflect attacks, such as punches.
    x:
      ja-Hrkt: |-
        しろい　たいもうは　はだざわりが
        ばつぐん。ほこりや　せいでんきを
        まったく　よせつけないのだ。
      ja: |-
        白い　体毛は　肌触りが　抜群。
        ほこりや　静電気を
        まったく　寄せつけないのだ。
      ko: |-
        하얀 털은 감촉이 정말 좋다.
        먼지나 정전기가
        전혀 생기지 않는다.
      en: |-
        Their white fur feels amazing to touch. Their fur
        repels dust and prevents static electricity from
        building up.
      fr: |-
        La texture de ses poils blancs est incomparable.
        Elle n’attire ni la poussière, ni l’électricité statique.
      de: |-
        Sein weißer Flaum fühlt sich wunderbar flauschig an
        und zieht weder Staub noch statische Elektrizität an.
      es: |-
        El pelo que cubre su cuerpo proporciona una
        agradable sensación al tocarlo. No acumula ni polvo
        ni electricidad estática.
      it: |-
        La sua pelliccia bianca è morbidissima al tatto.
        Non accumula né polvere né elettricità statica.
    'y':
      ja-Hrkt: |-
        チラチーノの　からだは　とくべつな
        あぶらで　おおわれており　パンチなど
        あいての　こうげきを　うけながす。
      ja: |-
        チラチーノの　体は　特別な
        油で　覆われており　パンチなど
        相手の　攻撃を　受け流す。
      ko: |-
        치라치노의 몸은 특별한
        기름으로 뒤덮여 있어 펀치 등
        상대의 공격을 받아넘긴다.
      en: |-
        Cinccino’s body is coated in a special oil that helps
        it deflect attacks, such as punches.
      fr: |-
        Son corps est recouvert d’une sorte de lubrifiant qui
        fait glisser les coups sur lui comme si de rien n’était.
      de: |-
        Sein Körper ist mit einem speziellen Öl überzogen,
        an dem gegnerische Hiebe und ähnliche Angriffe
        einfach abgleiten.
      es: |-
        El cuerpo de Cinccino está recubierto por una grasa
        especial que hace que los golpes y ataques enemigos
        no acierten.
      it: |-
        Il suo corpo è ricoperto di un grasso speciale sul
        quale scivolano via i colpi e i pugni dell’avversario.
    omega-ruby:
      ja-Hrkt: |-
        しろい　たいもうは　はだざわりが
        ばつぐん。ほこりや　せいでんきを
        まったく　よせつけないのだ。
      ja: |-
        白い　体毛は　肌触りが　抜群。
        ほこりや　静電気を
        まったく　寄せつけないのだ。
      ko: |-
        하얀 털은 감촉이 정말 좋다.
        먼지나 정전기가
        전혀 생기지 않는다.
      en: |-
        Their white fur feels amazing to touch. Their fur
        repels dust and prevents static electricity from
        building up.
      fr: |-
        La texture de ses poils blancs est incomparable.
        Elle n’attire ni la poussière, ni l’électricité statique.
      de: |-
        Sein weißer Flaum fühlt sich wunderbar flauschig an und zieht
        weder Staub noch statische Elektrizität an.
      es: |-
        El pelo que cubre su cuerpo proporciona una agradable
        sensación al tocarlo. No acumula ni polvo ni electricidad
        estática.
      it: |-
        La sua pelliccia bianca è morbidissima al tatto. Non accumula
        né polvere né elettricità statica.
    alpha-sapphire:
      ja-Hrkt: |-
        チラチーノの　からだは　とくべつな
        あぶらで　おおわれており　パンチなど
        あいての　こうげきを　うけながす。
      ja: |-
        チラチーノの　体は　特別な
        油で　覆われており　パンチなど
        相手の　攻撃を　受け流す。
      ko: |-
        치라치노의 몸은 특별한
        기름으로 뒤덮여 있어 펀치 등
        상대의 공격을 받아넘긴다.
      en: |-
        Cinccino’s body is coated in a special oil that helps
        it deflect attacks, such as punches.
      fr: |-
        Son corps est recouvert d’une sorte de lubrifiant qui fait
        glisser les coups sur lui comme si de rien n’était.
      de: |-
        Sein Körper ist mit einem speziellen Öl überzogen, an dem
        gegnerische Hiebe und ähnliche Angriffe einfach abgleiten.
      es: |-
        El cuerpo de Cinccino está recubierto por una grasa especial
        que hace que los golpes y ataques enemigos no acierten.
      it: |-
        Il suo corpo è ricoperto di un grasso speciale sul quale
        scivolano via i colpi e i pugni dell’avversario.
    ultra-sun:
      ja-Hrkt: |-
        しろいけは　からだから　しみだす
        あぶらで　コーティング　されており
        てきのこうげきも　つるりと　さける。
      ja: |-
        白い毛は　身体から　しみだす
        油で　コーティング　されており
        敵の攻撃も　つるりと　避ける。
      ko: |-
        하얀 털은 몸에서 나오는
        기름으로 코팅되어
        적의 공격도 매끄럽게 피한다.
      zh-Hant: |-
        體內滲出的油在
        白色的毛皮上形成覆膜，
        能滑溜溜地避開敵人的攻擊。
      zh-Hans: |-
        白色的毛发上涂满身体里渗出的油，
        连敌人的攻击也能滑溜溜地避开。
      en: |-
        The white parts of its coat are covered in an oil
        secreted from its body, so this Pokémon can
        slide right away from its enemies’ attacks.
      fr: |-
        Grâce à la sécrétion huileuse dont ses poils
        blancs sont recouverts, les attaques glissent
        sur sa fourrure comme sur de la soie.
      de: |-
        Sein weißer Flaum ist von einem Film aus
        speziellem Öl überzogen, das aus seinem Körper
        austritt. Gegnerische Angriffe gleiten daran ab.
      es: |-
        Su níveo pelaje está recubierto de una sustancia
        oleosa, secretada por su propio cuerpo, que
        hace resbalar los golpes enemigos.
      it: |-
        Schiva con facilità i colpi dei nemici, che
        scivolano sulla pelliccia bianca rivestita dal
        grasso speciale prodotto dal suo corpo.
    ultra-moon:
      ja-Hrkt: |-
        ぜんしんから　しみだす　あぶらは
        とても　なめらか。　はだあれに
        なやむひとにも　こうかてきなのだ。
      ja: |-
        全身から　染み出す　油は
        とても　なめらか。　肌荒れに
        悩む人にも　効果的なのだ。
      ko: |-
        전신에서 배어 나오는 기름은
        매우 부드럽다. 거친 피부가
        고민인 사람에게도 효과적이다.
      zh-Hant: |-
        從全身滲出的油非常滑。
        對於因為肌膚乾燥而
        煩惱的人也很有效果。
      zh-Hans: |-
        从全身渗出的油非常滑。
        对于因肌肤干燥而烦恼的人
        也很有效果。
      en: |-
        The oil that seeps from its body is really
        smooth. For people troubled by bad skin,
        this oil is an effective treatment.
      fr: |-
        Le liquide que son corps sécrète est
        étrangement huileux. C’est un remède efficace
        pour les personnes qui ont la peau sèche.
      de: |-
        Aus seinem Körper tritt besonders schmieriges
        Öl aus, das für Menschen, die unter trockener
        Haut leiden, von großem Nutzen ist.
      es: |-
        La grasa que exuda por todo el cuerpo es muy
        lubrificante y altamente apreciada por las
        personas con problemas de piel seca.
      it: |-
        Il grasso particolarmente oleoso prodotto dal
        suo corpo è molto efficace contro le irritazioni
        cutanee.
    sword:
      ja-Hrkt: |-
        チリひとつ　ゆるせない　けっぺき。
        からだ　から　しみでる　あぶらを
        すに　ぬりつけ　コーティングする。
      ja: |-
        塵ひとつ　許せない　潔癖。
        体から　染み出る　油を
        巣に　塗りつけ　コーティングする。
      ko: |-
        먼지 한 톨도 용납하지 않는 결벽증.
        몸에서 나오는 기름을
        둥지에 발라서 코팅한다.
      zh-Hant: |-
        潔癖使得牠連一絲灰塵都
        無法容忍，會把自己身上
        滲出的油塗在巢上保持清潔。
      zh-Hans: |-
        洁癖使它连一丝灰尘都
        无法容忍，会把自己身上
        渗出的油涂在巢上保持清洁。
      en: |-
        Its body secretes oil that this Pokémon spreads
        over its nest as a coating to protect it from dust.
        Cinccino won’t tolerate even a speck of the stuff.
      fr: |-
        Il ne supporte pas de voir le moindre grain
        de poussière. Il utilise l’huile qu’il sécrète pour
        recouvrir son nid d’un revêtement protecteur.
      de: |-
        Es ist sehr reinlich und duldet nicht mal das
        kleinste Staubkorn. Es beschichtet sein Nest mit
        dem Öl, das sein Körper absondert.
      es: |-
        Es tan sumamente pulcro que no puede ver ni
        una mota de polvo. La grasa que exuda por el
        cuerpo le sirve de película protectora.
      it: |-
        È un maniaco della pulizia e non sopporta la vista
        neanche di un granello di polvere. Riveste la tana
        del grasso che trasuda dal suo corpo.
    shield:
      ja-Hrkt: |-
        とくべつな　あぶらの　しみた　けは
        こうげきを　うけながす。　あぶらは
        たかねで　とりひき　されている。
      ja: |-
        特別な　油の　染みた　毛は
        攻撃を　受け流す。　油は
        高値で　取り引き　されている。
      ko: |-
        특별한 기름이 스며든 털은
        공격을 받아넘긴다. 기름은
        높은 가격에 거래되고 있다.
      zh-Hant: |-
        覆蓋著特別油脂的毛髮
        可以擋住攻擊。這種油
        以高價在市場上流通。
      zh-Hans: |-
        覆盖着特别油脂的毛发
        可以挡住攻击。这种油
        以高价在市场上流通。
      en: |-
        A special oil that seeps through their fur helps
        them avoid attacks. The oil fetches a high price
        at market.
      fr: |-
        La sécrétion huileuse de ses poils lui permet
        de dévier les attaques. Elle s’arrache à prix d’or
        sur les marchés.
      de: |-
        Sein Fell ist mit einem körpereigenen Öl bedeckt,
        das Attacken abwehren kann. Öl von Chillabell ist
        wertvoll und wird zu hohen Preisen gehandelt.
      es: |-
        Su pelaje está recubierto por una grasa especial
        que repele los ataques enemigos y por la que se
        llegan a pagar auténticas fortunas.
      it: |-
        Il grasso speciale che ricopre la sua pelliccia
        può deviare gli attacchi ed è venduto
        a caro prezzo sul mercato.
