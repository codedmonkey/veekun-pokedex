mareanie:
  base_happiness: 50
  capture_rate: 190
  color: blue
  egg_groups:
    - water1
  evolution_chain: mareanie
  evolves_from: ~
  flavor_text:
    sun:
      ja-Hrkt: |-
        あたまに　ある　どくトゲで　えものを
        ズブリ。よわったところを　１０ぽんの
        しょくしゅで　とらえ　とどめを　さす。
      ja: |-
        頭に　ある　毒トゲで　獲物を
        ズブリ。　弱ったところを　１０本の
        触手で　捕らえ　止めを　刺す。
      ko: |-
        머리에 있는 독 가시로 먹이를
        찌른다. 약해졌을 때 10개의
        촉수로 잡아서 마무리한다.
      zh-Hant: |-
        用頭上的毒刺扎進獵物身體。
        獵物變虛弱後，再用１０根觸手捉住
        並給予致命的一擊。
      zh-Hans: |-
        用头上的毒刺扎猎物。
        在其虚弱的时候，
        用１０条触手抓住，一击毙命。
      en: |-
        It plunges the poison spike on its head into its
        prey. When the prey has weakened, Mareanie
        deals the finishing blow with its 10 tentacles.
      fr: |-
        Les épines sur sa tête transpercent et
        empoisonnent l’ennemi. Ses dix tentacules
        se chargent ensuite du reste.
      de: |-
        Mit seinem Giftstachel am Kopf attackiert es
        Beute. Ist diese geschwächt, umschlingt es sie
        mit seinen zehn Tentakeln und gibt ihr den Rest.
      es: |-
        Aturde a su presa con los aguijones venenosos
        de la cabeza. Cuando esta se debilita, la rodea
        con sus diez extremidades y la remata.
      it: |-
        Trafigge e indebolisce le prede con gli aculei
        avvelenati sulla testa, per poi immobilizzarle
        con i dieci tentacoli e infliggere il colpo di grazia.
    moon:
      ja-Hrkt: |-
        かいていや　かいがんを　はいまわる。
        サニーゴの　あたまに　はえる
        サンゴが　だいこうぶつ　だぞ。
      ja: |-
        海底や　海岸を　はいまわる。
        サニーゴの　頭に　生える
        サンゴが　大好物だぞ。
      ko: |-
        해저나 해안을 기어다닌다.
        코산호의 머리에서 자라는
        산호를 아주 좋아한다.
      zh-Hant: |-
        牠會在海底和海岸爬來爬去。
        非常喜歡吃生長在太陽珊瑚
        頭上的珊瑚。
      zh-Hans: |-
        在海底和海岸爬来爬去。
        生长在太阳珊瑚头上的
        珊瑚是它非常喜欢吃的东西。
      en: |-
        It’s found crawling on beaches and seafloors.
        The coral that grows on Corsola’s head is as
        good as a five-star banquet to this Pokémon.
      fr: |-
        Il rampe le long des fonds marins et des plages
        de sable. Les cornes de corail des Corayon sont
        ses biscuits apéritifs préférés.
      de: |-
        Kriecht auf dem Meeresgrund oder am Strand
        herum. Die Korallen, die auf den Köpfen von
        Corasonn wachsen, sind seine Leibspeise.
      es: |-
        Reptan por las profundidades marinas o junto a
        la costa. Les encantan las ramas de coral que
        crecen en la cabeza de los Corsola.
      it: |-
        Si aggira sui fondali marini e sulle spiagge.
        È ghiotto dei coralli che crescono sulla testa
        dei Corsola.
    ultra-sun:
      ja-Hrkt: |-
        サニーゴのえだを　くうので　しぜんに
        おちた　えだを　あつめて　かこうする
        しょくにんたちに　にくまれている。
      ja: |-
        サニーゴの枝を　食うので　自然に
        落ちた　枝を　集めて　加工する
        職人たちに　憎まれている。
      ko: |-
        코산호의 가지를 먹기 때문에 자연스럽게
        떨어지는 가지를 모아 가공하는
        장인들의 미움을 받고 있다.
      zh-Hant: |-
        因為牠會吃太陽珊瑚的枝條，
        所以專門收集自然掉落的枝條
        來加工的工匠們很討厭牠。
      zh-Hans: |-
        因为它会吃太阳珊瑚的枝，
        所以被收集自然掉落的枝
        来加工的匠人们所厌恶。
      en: |-
        They eat Corsola branches, so Mareanie are
        hated by craftsmen who work with Corsola
        branches that have naturally fallen off.
      fr: |-
        Son amour des cornes de Corayon lui vaut
        l’hostilité des artisans qui les récoltent dans
        la nature pour en faire des objets.
      de: |-
        Die Arme von Corasonn sind seine Leibspeise.
        Handwerker, die natürlich abgefallene Arme von
        Corasonn verarbeiten, mögen sie deshalb nicht.
      es: |-
        Los artesanos intentan exterminarlo porque se
        come las ramas de los Corsola, que ellos solo
        recogen al desprenderse de forma natural.
      it: |-
        Poiché mangia i coralli dei Corsola, non è visto
        di buon occhio dagli artigiani che raccolgono
        e lavorano i rametti caduti spontaneamente.
    ultra-moon:
      ja-Hrkt: |-
        あたま　いがいの　ばしょ　なら
        ちぎれても　すぐに　さいせいする。
        ひとばん　ねむれば　もとどおりだ。
      ja: |-
        頭　以外の　場所　なら
        ちぎれても　すぐに　再生する。
        一晩　眠れば　元通りだ。
      ko: |-
        머리 이외의 곳이라면
        찢겨 나가더라도 금방 재생한다.
        하룻밤 자고 나면 원래대로 돌아온다.
      zh-Hant: |-
        如果是頭部以外的部位，
        就算被切碎也能立刻再生，
        只要睡一晚就能回復原狀。
      zh-Hans: |-
        如果是头部以外的地方，
        即使切成碎片也能立刻再生。
        只要睡一晚就能恢复原样。
      en: |-
        Aside from its head, its body parts
        regenerate quickly if they’re cut off. After a
        good night’s sleep, Mareanie is back to normal.
      fr: |-
        Une nuit lui suffit à régénérer n’importe quelle
        partie de son corps, à l’exception de sa tête,
        et ce, quelle que soit l’étendue des dégâts.
      de: |-
        Bis auf den Kopf wachsen all seine Körperteile
        schnell nach, wenn sie abgetrennt werden.
        Dafür muss es nur eine Nacht durchschlafen.
      es: |-
        Salvo la cabeza, cualquier parte del cuerpo que
        le arranquen es capaz de regenerarse en tan
        solo una noche de descanso.
      it: |-
        A condizione che la testa rimanga intatta, anche
        se gli staccano qualche pezzo si rigenera subito.
        Dopo una notte di riposo ritorna come nuovo.
    sword:
      ja-Hrkt: |-
        トゲに　さされると　まず　しびれに
        おそわれ　やがて　かきむしりたくなる
        ほどの　かゆみに　くるしむのだ。
      ja: |-
        棘に　刺されると　まず　痺れに
        襲われ　やがて　掻きむしりたくなる
        ほどの　痒みに　苦しむのだ。
      ko: |-
        가시에 찔리면 먼저 저리기
        시작하며 이윽고 마구 긁고 싶을
        정도의 가려움에 고통받는다.
      zh-Hant: |-
        要是被牠的毒刺給刺中，
        首先會發麻，接著會奇癢無比，
        讓人恨不得把皮都給抓爛。
      zh-Hans: |-
        要是被它的毒刺给刺中，
        首先会发麻，接着会奇痒无比，
        让人恨不得把皮都给抓烂。
      en: |-
        The first symptom of its sting is numbness.
        The next is an itching sensation so intense that it’s
        impossible to resist the urge to claw at your skin.
      fr: |-
        Ses piqûres causent un engourdissement qui
        se mue en démangeaisons si terribles qu’elles
        poussent la victime à se gratter jusqu’au sang.
      de: |-
        Wird man von seinen Stacheln gestochen, setzt
        zunächst Taubheit ein, gefolgt von einem nahezu
        unerträglich starken Juckreiz.
      es: |-
        La picadura de sus aguijones provoca un
        hormigueo que no tarda en convertirse en
        una picazón insoportable.
      it: |-
        Chi viene punto dai suoi aculei viene colto
        da un formicolio che diventa presto un prurito
        insopportabile.
    shield:
      ja-Hrkt: |-
        アローラちほうの　ヒドイデと　ちがい
        ガラルの　ヒドイデは　サニーゴの
        えだの　おいしさに　きづいていない。
      ja: |-
        アローラ地方の　ヒドイデと　違い
        ガラルの　ヒドイデは　サニーゴの
        枝の　美味しさに　気づいていない。
      ko: |-
        알로라지방의 시마사리와 달리
        가라르의 시마사리는 코산호의
        가지의 맛을 아직 모른다.
      zh-Hant: |-
        和阿羅拉的好壞星不同，
        伽勒爾的好壞星還沒發現到
        太陽珊瑚的枝有多好吃。
      zh-Hans: |-
        和阿罗拉的好坏星不同，
        伽勒尔的好坏星还没发现到
        太阳珊瑚的枝有多好吃。
      en: |-
        Unlike their Alolan counterparts, the Mareanie
        of the Galar region have not yet figured out
        that the branches of Corsola are delicious.
      fr: |-
        Contrairement aux Vorastérie d’Alola,
        ceux de Galar ne font pas grand cas
        des cornes de Corayon.
      de: |-
        Im Gegensatz zu den Garstella in Alola haben
        die der Galar-Region noch nicht bemerkt, wie
        köstlich die Arme von Corasonn sind.
      es: |-
        A diferencia de sus congéneres de Alola, los
        ejemplares de Galar aún no saben lo deliciosas
        que están las ramas de Corsola.
      it: |-
        A differenza dei Mareanie di Alola, quelli
        di Galar non sanno quanto siano deliziosi
        i coralli dei Corsola.
