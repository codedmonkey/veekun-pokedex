bruxish:
  base_happiness: 70
  capture_rate: 80
  color: pink
  egg_groups:
    - water2
  evolution_chain: bruxish
  evolves_from: ~
  flavor_text:
    sun:
      ja-Hrkt: |-
        あたまの　とっきから　サイコパワーを
        はなつとき　とても　みみざわりな
        はぎしりの　おとが　あたりに　ひびく。
      ja: |-
        頭の　突起から　サイコパワーを
        放つとき　とても　耳障りな
        歯ぎしりの　音が　あたりに　響く。
      ko: |-
        머리의 돌기에서 사이코 파워를
        발산할 때 아주 귀에 거슬리는
        이가는 소리가 주변에 울려 퍼진다.
      zh-Hant: |-
        從頭部的突起物發出精神力量的時候，
        周圍會響起非常刺耳的磨牙聲。
      zh-Hans: |-
        从头部的突起物放出精神力量的时候，
        周围会响起非常刺耳的磨牙声。
      en: |-
        When it unleashes its psychic power from the
        protuberance on its head, the grating sound
        of grinding teeth echoes through the area.
      fr: |-
        Lorsqu’il utilise l’appendice sur sa tête pour
        projeter ses pouvoirs psychiques, il émet un
        bruit aussi irritant qu’un grincement de dents.
      de: |-
        Wenn es über den Fortsatz an seinem Kopf
        Psycho-Kräfte freisetzt, ertönt in seiner
        Umgebung ein unangenehmes Zähneknirschen.
      es: |-
        Cuando la protuberancia que tiene en la cabeza
        emite poderes psíquicos, se escucha como un
        ruido de dientes rechinando muy molesto.
      it: |-
        Quando proietta il suo potere psichico dalla
        protuberanza sulla testa, diffonde tutto intorno
        un fastidioso rumore di denti che stridono.
    moon:
      ja-Hrkt: |-
        ねんりきで　えものを　しびれさせ
        じょうぶな　はで　かみくだく。
        シェルダーの　カラでも　よゆうだ。
      ja: |-
        念力で　獲物を　しびれさせ
        丈夫な　歯で　噛み砕く。
        シェルダーの　殻でも　よゆうだ。
      ko: |-
        염동력으로 먹이를 마비시켜
        튼튼한 이빨로 깨물어 부순다.
        셀러의 껍질도 거뜬히 부순다.
      zh-Hant: |-
        用念力令獵物麻痺後，
        再用結實的牙齒將其咬碎。
        即使是大舌貝的殼也毫不費力。
      zh-Hans: |-
        用念力让猎物麻痹，
        用结实的牙齿将其咬碎。
        即使是大舌贝的壳也不在话下。
      en: |-
        It stuns its prey with psychokinesis and then
        grinds them to mush with its strong teeth.
        Even Shellder’s shell is no match for it.
      fr: |-
        Il engourdit ses proies grâce à sa force mentale
        avant de les dévorer avec ses grosses dents.
        Il peut briser les Kokiyas sans problème.
      de: |-
        Es lähmt seine Beute mit Psycho-Kräften und
        zerkaut sie mit seinen kräftigen Zähnen. Auch
        die Schale von Muschas knackt es problemlos.
      es: |-
        Paraliza a su presa con poderes telequinéticos
        y la hace picadillo con su robusta dentadura.
        Ni siquiera Shellder se le resiste.
      it: |-
        Paralizza le prede con la telecinesi e le addenta
        con le sue robuste zanne, capaci di frantumare
        persino il guscio di uno Shellder.
    ultra-sun:
      ja-Hrkt: |-
        すなに　もぐり　あたまの　とっきから
        サイコパワーを　ほうしゃ。　あたりの
        ようすを　さぐりつつ　えものを　まつ。
      ja: |-
        砂に　潜り　頭の　突起から
        サイコパワーを　放射。　あたりの
        様子を　探りつつ　獲物を　待つ。
      ko: |-
        모래로 숨어들어 머리의 돌기에서
        사이코 파워를 방사한다. 주변의
        상태를 탐지하면서 먹이를 기다린다.
      zh-Hant: |-
        會潛藏在沙子裡，
        從頭部的突起物發射精神力量，
        在探查周圍狀況的同時等待獵物。
      zh-Hans: |-
        潜藏在沙子里，
        从头部的突起物里放射出精神力量。
        会边探查周围的情形边等待猎物。
      en: |-
        It burrows beneath the sand, radiating
        psychic power from the protuberance on its
        head. It waits for prey as it surveys the area.
      fr: |-
        Enfoui dans le sable, il projette ses pouvoirs
        psychiques via l’appendice qu’il a sur la tête,
        et scanne les environs en attendant sa proie.
      de: |-
        Es vergräbt sich im Sand und setzt über den
        Fortsatz an seinem Kopf Psycho-Kräfte frei. So
        scannt es die Gegend ab und wartet auf Beute.
      es: |-
        Oculto bajo la arena, emite poderes psíquicos
        por la protuberancia de su cabeza. Analiza el
        entorno mientras espera a que caiga su presa.
      it: |-
        Si nasconde nella sabbia ed emette il suo potere
        psichico dalla protuberanza sulla testa. Aspetta
        la preda sorvegliando l’ambiente che lo circonda.
    ultra-moon:
      ja-Hrkt: |-
        ヒドイデの　ハリも　とおさないほど
        ぶあつい　ひふ。　じょうぶな　はで
        ボリボリと　ハリを　かじって　くう。
      ja: |-
        ヒドイデの　ハリも　通さないほど
        分厚い　皮膚。　丈夫な　歯で
        ボリボリと　ハリを　かじって　食う。
      ko: |-
        시마사리의 바늘도 뚫지 못할 정도로
        두꺼운 피부를 가졌다. 튼튼한 이빨로
        어적어적 바늘을 갉아서 먹는다.
      zh-Hant: |-
        厚實的皮膚連好壞星的針
        也無法穿透。會用結實的牙齒
        把針咬碎之後吃下去。
      zh-Hans: |-
        厚实的皮肤连好坏星的针
        也穿不透。会用结实的牙齿
        嘎嘣嘎嘣地咬碎针吃下去。
      en: |-
        Its skin is thick enough to fend off Mareanie’s
        spikes. With its robust teeth, Bruxish crunches
        up the spikes and eats them.
      fr: |-
        Sa peau est si épaisse que même les épines
        de Vorastérie ne peuvent la percer. Il les croque
        bruyamment grâce à ses dents solides.
      de: |-
        Seine Haut ist so hart, dass selbst die Nadeln
        eines Garstella sie nicht durchdringen. Mit
        seinen kräftigen Zähnen zerkaut es sie einfach.
      es: |-
        Su piel es tan gruesa que ni las espinas de
        Mareanie pueden perforarla. Con su fuerte
        dentadura tritura y engulle dichas espinas.
      it: |-
        La sua pelle spessa non viene scalfita neanche
        dagli aculei dei Mareanie, che sgranocchia con
        le robuste zanne.
