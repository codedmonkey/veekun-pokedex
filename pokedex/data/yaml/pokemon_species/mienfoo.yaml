mienfoo:
  base_happiness: 50
  capture_rate: 180
  color: yellow
  egg_groups:
    - ground
    - humanshape
  evolution_chain: mienfoo
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        In fights, they dominate with onslaughts
        of flowing, continuous attacks. With
        their sharp claws, they cut enemies.
      fr: |-
        Il découpe ses ennemis avec ses griffes
        acérées et les terrasse avec ses
        enchaînements de coups hyper fluides.
    white:
      en: |-
        They have mastered elegant combos.
        As they concentrate, their battle moves
        become swifter and more precise.
      fr: |-
        Il emploie des enchaînements élégants.
        Lorsqu’il se concentre, leur vitesse
        et leur tranchant augmentent.
    black-2:
      en: |-
        It takes pride in the speed at which it
        can use moves. What it loses in power,
        it makes up for in quantity.
    white-2:
      en: |-
        It takes pride in the speed at which it
        can use moves. What it loses in power,
        it makes up for in quantity.
    x:
      ja-Hrkt: |-
        わざをくりだす　スピードが　じまん。
        たとえ　パワーは　ひくくても
        てかずの　おおさで　カバーする。
      ja: |-
        技を繰り出す　スピードが　自慢。
        たとえ　パワーは　低くても
        手数の　多さで　カバーする。
      ko: |-
        기술을 내보내는 스피드가 자랑이다.
        설령 파워는 낮더라도
        많은 공격 횟수로 커버한다.
      en: |-
        It takes pride in the speed at which it can use
        moves. What it loses in power, it makes up for
        in quantity.
      fr: |-
        Il se flatte d’être très rapide. Pour compenser la
        faiblesse de ses coups, il en assène un très grand
        nombre.
      de: |-
        Schnelle Angriffe sind seine Spezialität. Es gleicht
        seine Schwächen mit der Vielfalt seines
        Attackenrepertoires aus.
      es: |-
        La velocidad de sus ataques es su gran orgullo. Lo
        que le falta de fuerza bruta lo compensa en cantidad
        de golpes.
      it: |-
        Va fiero della rapidità delle sue mosse. Sopperisce
        a un’eventuale mancanza di potenza con il numero
        dei colpi.
    'y':
      ja-Hrkt: |-
        ながれるような　れんぞく　こうげきを
        くりだして　てきを　あっとうする。
        するどい　ツメで　てきを　きりさく。
      ja: |-
        流れるような　連続　攻撃を
        繰り出して　敵を　圧倒する。
        鋭い　ツメで　敵を　切り裂く。
      ko: |-
        물 흐르는 듯한 연속 공격을
        펼쳐서 상대를 압도한다.
        날카로운 손톱으로 상대를 베어 가른다.
      en: |-
        In fights, they dominate with onslaughts of flowing,
        continuous attacks. With their sharp claws, they
        cut enemies.
      fr: |-
        Il découpe ses ennemis avec ses griffes acérées
        et les terrasse avec ses enchaînements de coups
        hyper fluides.
      de: |-
        Es deckt seine Gegner mit filigranen Attacken in Serie
        ein und schlitzt sie mit seinen spitzen Klauen auf.
      es: |-
        Abruma a su rival con oleadas de ataques veloces.
        Corta al enemigo con sus afiladas garras.
      it: |-
        Soggioga il nemico concatenando una serie incessante
        di attacchi e lo affetta con le unghie affilate.
    omega-ruby:
      ja-Hrkt: |-
        わざをくりだす　スピードが　じまん。
        たとえ　パワーは　ひくくても
        てかずの　おおさで　カバーする。
      ja: |-
        技を繰り出す　スピードが　自慢。
        たとえ　パワーは　低くても
        手数の　多さで　カバーする。
      ko: |-
        기술을 내보내는 스피드가 자랑이다.
        설령 파워는 낮더라도
        많은 공격 횟수로 커버한다.
      en: |-
        It takes pride in the speed at which it can use
        moves. What it loses in power, it makes up for
        in quantity.
      fr: |-
        Il se flatte d’être très rapide. Pour compenser la faiblesse
        de ses coups, il en assène un très grand nombre.
      de: |-
        Schnelle Angriffe sind seine Spezialität. Es gleicht seine
        Schwächen mit der Vielfalt seines Attackenrepertoires aus.
      es: |-
        La velocidad de sus ataques es su gran orgullo. Lo que le
        falta de fuerza bruta lo compensa en cantidad de golpes.
      it: |-
        Va fiero della rapidità delle sue mosse. Sopperisce
        a un’eventuale mancanza di potenza con il numero
        dei colpi.
    alpha-sapphire:
      ja-Hrkt: |-
        ながれるような　れんぞく　こうげきを
        くりだして　てきを　あっとうする。
        するどい　ツメで　てきを　きりさく。
      ja: |-
        流れるような　連続　攻撃を
        繰り出して　敵を　圧倒する。
        鋭い　ツメで　敵を　切り裂く。
      ko: |-
        물 흐르는 듯한 연속 공격을
        펼쳐서 상대를 압도한다.
        날카로운 손톱으로 상대를 베어 가른다.
      en: |-
        In fights, they dominate with onslaughts of flowing,
        continuous attacks. With their sharp claws, they
        cut enemies.
      fr: |-
        Il découpe ses ennemis avec ses griffes acérées et les terrasse
        avec ses enchaînements de coups hyper fluides.
      de: |-
        Es deckt seine Gegner mit filigranen Attacken in Serie ein
        und schlitzt sie mit seinen spitzen Klauen auf.
      es: |-
        Abruma a su rival con oleadas de ataques veloces. Corta al
        enemigo con sus afiladas garras.
      it: |-
        Soggioga il nemico concatenando una serie incessante di
        attacchi e lo affetta con le unghie affilate.
    ultra-sun:
      ja-Hrkt: |-
        あさに　ゆっくりとした　うごきで
        いろんな　ポーズを　とる　むれの
        すがたを　みることが　できるよ。
      ja: |-
        朝に　ゆっくりとした　動きで
        いろんな　ポーズを　とる　群れの
        姿を　見ることが　できるよ。
      ko: |-
        아침에 느릿느릿 움직이며
        여러 포즈를 취하는
        무리의 모습을 볼 수 있다.
      zh-Hant: |-
        在早晨可以看見牠們
        集體用緩慢的動作
        擺出各種姿勢哦。
      zh-Hans: |-
        可以在早上看到用慢悠悠的
        动作摆出各种姿势的群体哦。
      en: |-
        They can often be seen in packs in the morning,
        slowly moving their bodies through a series
        of poses.
      fr: |-
        Au petit jour, on peut voir des meutes de
        Kungfouine qui s’entraînent en effectuant
        des mouvements lents et méthodiques.
      de: |-
        In den Morgenstunden kann man Gruppen dieses
        Pokémon dabei beobachten, wie sie mit grazilen
        Bewegungen diverse Posen einnehmen.
      es: |-
        A primera hora de la mañana pueden verse
        grupos de Mienfoo realizando movimientos
        lentos y adoptando distintas poses.
      it: |-
        Al mattino è possibile vedere gruppi di Mienfoo
        che si esercitano eseguendo movimenti lenti
        e assumendo varie posizioni.
    ultra-moon:
      ja-Hrkt: |-
        やまおくに　こもり　むれの　なかまと
        しゅぎょうに　はげむ。　むれによって
        キックや　チョップのかたが　ちがう。
      ja: |-
        山奥に　こもり　群れの　仲間と
        修行に　励む。　群れによって
        キックや　チョップの型が　違う。
      ko: |-
        산속에 들어가 무리의 동료와
        수행에 힘쓴다. 무리에 따라
        킥이나 촙의 방식이 다르다.
      zh-Hant: |-
        與群體的夥伴們一起在深山裡
        閉關修行。不同的群體有著不同的
        踢腿和手刀技法。
      zh-Hans: |-
        在山中闭关，与群体的伙伴们潜心修行。
        根据群体的不同，
        踢和劈的技法也不一样。
      en: |-
        They seclude themselves in the mountains and
        devote themselves to training. The form of their
        kicks and chops differs from pack to pack.
      fr: |-
        Il s’isole en montagne pour s’entraîner avec
        ses congénères. Les techniques de coups de
        pied ou de poing changent d’une meute à l’autre.
      de: |-
        Mit seiner Gruppe zieht es sich tief in die Berge
        zurück, um dort zu trainieren. Jede der Gruppen
        entwickelt eigene Schlag- und Tritt-Techniken.
      es: |-
        Suele recluirse con otros congéneres en las
        montañas para entrenar. Según el grupo, la
        técnica de sus patadas o puñetazos varía.
      it: |-
        Si ritira sui monti per allenarsi assieme ai suoi
        compagni. Ogni gruppo sviluppa tecniche di
        calci e pugni diverse.
    sword:
      ja-Hrkt: |-
        よくきたえられた　コジョフーは
        １ぷんで　１００かいを　こえる
        チョップを　うつことが　できる。
      ja: |-
        よく鍛えられた　コジョフーは
        １分で　１００回を　超える
        チョップを　打つことが　できる。
      ko: |-
        잘 단련된 비조푸는
        1분에 100회 이상
        촙 공격을 할 수 있다.
      zh-Hant: |-
        千錘百鍊的功夫鼬
        能夠在１分鐘內使出
        超過１００次的劈擊。
      zh-Hans: |-
        身经千锤百炼的功夫鼬
        可以在１分钟之内
        劈击１００次以上。
      en: |-
        In one minute, a well-trained Mienfoo can chop
        with its arms more than 100 times.
      fr: |-
        Les Kungfouine bien entraînés sont capables
        d’asséner plus de cent coups par minute
        du tranchant de la main.
      de: |-
        Ein gut trainiertes Lin-Fu kann in einer Minute
        über 100 Schläge ausführen.
      es: |-
        Un Mienfoo bien entrenado es capaz de
        propinar más de cien golpes por minuto.
      it: |-
        I Mienfoo più allenati sono in grado di sferrare
        più di 100 colpi al minuto con il taglio
        della mano.
    shield:
      ja-Hrkt: |-
        ちいさくても　きしょうは　あらい。
        ゆだんして　ちかづく　あいてには
        かれいな　れんだを　おみまいする。
      ja: |-
        小さくても　気性は　荒い。
        油断して　近づく　相手には
        華麗な　連打を　おみまいする。
      ko: |-
        작아도 기질은 거칠다.
        방심하고 다가간 상대에게
        화려한 연타를 먹인다.
      zh-Hant: |-
        個頭雖小，個性粗暴。
        對於漫不經心就靠近自己
        的對手會奉上華麗的連擊。
      zh-Hans: |-
        个头虽小脾气却很暴躁。
        面对疏忽大意接近自己的
        对手，会施展出华丽的连击。
      en: |-
        Though small, Mienfoo’s temperament is fierce.
        Any creature that approaches Mienfoo carelessly
        will be greeted with a flurry of graceful attacks.
      fr: |-
        De nature brutale malgré sa petite taille, il inflige
        une série de coups majestueux aux inconscients
        qui s’approchent trop près de lui.
      de: |-
        Lin-Fu ist klein, hat aber ein wildes Temperament.
        Gegnern, die sich ihm unbedacht nähern, setzt es
        mit einer eleganten Schlagfolge zu.
      es: |-
        Su apariencia menuda contrasta con su carácter
        poco afable. Abruma a los rivales que se acercan
        a él con gráciles oleadas de ataques sucesivos.
      it: |-
        Ha un temperamento turbolento, malgrado
        le dimensioni ridotte. Sferra eleganti raffiche di
        colpi contro chi gli si avvicina incautamente.
