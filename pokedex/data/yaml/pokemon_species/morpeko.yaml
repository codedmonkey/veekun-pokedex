  flavor_text:
    sword:
      ja-Hrkt: |-
        いつも　おなかを　すかせている。
        ポケットの　ような　ふくろに　いれた
        タネを　たべて　でんきを　つくる。
      ja: |-
        いつも　お腹を　すかせている。
        ポケットの　ような　袋に　入れた
        タネを　食べて　電気を　つくる。
      ko: |-
        항상 배가 고프다.
        호주머니같이 생긴 주머니에 넣어둔
        씨앗을 먹어서 전기를 만든다.
      zh-Hant: |-
        總是餓著肚子。
        會吃掉裝在像口袋一樣的
        袋子裡的種子來發電。
      zh-Hans: |-
        总是饿着肚子。
        会吃掉装在像口袋一样的
        袋子里的种子来发电。
      en: |-
        As it eats the seeds stored up in its pocket-like
        pouches, this Pokémon is not just satisfying its
        constant hunger. It’s also generating electricity.
      fr: |-
        Il a toujours un petit creux. Il grignote les graines
        qu’il a mises dans ses sortes de poches
        pour produire de l’électricité.
      de: |-
        Dieses immerzu hungrige Pokémon frisst Samen,
        die es in seinen beutelartigen Taschen verwahrt,
        und produziert so Elektrizität.
      es: |-
        Siempre tiene hambre. Se nutre de las semillas
        que guarda en una suerte de bolsillos para
        generar electricidad.
      it: |-
        Ha costantemente fame. Si nutre dei semi che
        tiene nelle sue tasche per produrre elettricità.
    shield:
      ja-Hrkt: |-
        どんなに　たべても　すぐに　おなかが
        すく。　でんきで　ローストした
        タネを　たいせつに　もちあるく。
      ja: |-
        どんなに　食べても　すぐに　お腹が
        すく。　電気で　ローストした
        タネを　大切に　持ち歩く。
      ko: |-
        아무리 먹어도 금방 배가 고프다.
        전기로 구운 씨앗을
        소중히 갖고 다닌다.
      zh-Hant: |-
        無論怎麼吃都會馬上肚子餓。
        十分珍愛自己用電烘烤過的
        種子，隨時都帶在身上。
      zh-Hans: |-
        无论怎么吃都会马上肚子饿。
        十分珍爱自己用电烘烤过的
        种子，随时都带在身上。
      en: |-
        It carries electrically roasted seeds with it as if
        they’re precious treasures. No matter how much
        it eats, it always gets hungry again in short order.
      fr: |-
        Il a beau manger, il a tout le temps faim.
        Il a toujours des graines grillées à l’électricité
        sur lui.
      de: |-
        Egal, wie viel es auch frisst, es wird sofort wieder
        hungrig. Es röstet Samen mit seiner Elektrizität
        und trägt diese dann vorsichtig mit sich herum.
      es: |-
        Siempre tiene apetito, sin importar lo mucho que
        coma. Lleva con sumo cuidado las semillas que
        ha tostado con su propia electricidad.
      it: |-
        Indipendentemente da quanto mangia, è sempre
        affamato. Tiene molto ai semi che ha arrostito
        con l’elettricità e li porta sempre con sé.
