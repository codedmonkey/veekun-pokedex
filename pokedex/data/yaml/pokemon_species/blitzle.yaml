  flavor_text:
    black:
      en: |-
        Its mane shines when it discharges
        electricity. They use their flashing
        manes to communicate with one another.
      fr: |-
        Leur crinière scintille quand ils lâchent
        une décharge électrique. Ils se servent
        de ces scintillements pour communiquer.
    white:
      en: |-
        When thunderclouds cover the sky,
        it will appear. It can catch lightning
        with its mane and store the electricity.
      fr: |-
        Il apparaît quand le ciel est à l’orage.
        Il capte les éclairs avec sa crinière
        et accumule de l’électricité.
    black-2:
      en: |-
        Its mane shines when it discharges
        electricity. They use the frequency and
        rhythm of these flashes to communicate.
    white-2:
      en: |-
        Its mane shines when it discharges
        electricity. They use the frequency and
        rhythm of these flashes to communicate.
    x:
      ja-Hrkt: |-
        かみなりぐもで　そらが　おおわれると
        あらわれる。たてがみで　カミナリを
        キャッチして　でんきを　ためる。
      ja: |-
        雷雲で　空が　覆われると
        現れる。たてがみで　雷を
        キャッチして　電気を　ためる。
      ko: |-
        번개 구름이 하늘을 뒤덮으면
        나타난다. 갈기로 번개를
        붙잡아 전기를 모은다.
      en: |-
        When thunderclouds cover the sky, it will appear.
        It can catch lightning with its mane and store
        the electricity.
      fr: |-
        Il apparaît quand le ciel est à l’orage. Il capte les
        éclairs avec sa crinière et accumule de l’électricité.
      de: |-
        Es erscheint, wenn Gewitterwolken den Himmel
        verdunkeln. Es fängt mit seiner Mähne Blitze
        und hortet ihre Energie.
      es: |-
        Aparece cuando nubes envueltas en rayos encapotan
        el cielo. Atrapa rayos con su crin y almacena
        electricidad.
      it: |-
        Appare quando il cielo si riempie di fulmini e saette.
        Accumula elettricità attirando i fulmini con la criniera.
    'y':
      ja-Hrkt: |-
        ほうでんすると　たてがみが　ひかる。
        たてがみが　かがやく　かいすうや
        リズムで　なかまと　かいわしている。
      ja: |-
        放電すると　たてがみが　光る。
        たてがみが　輝く　回数や
        リズムで　仲間と　会話している。
      ko: |-
        방전하면 갈기가 빛난다.
        갈기가 빛나는 횟수나
        리듬으로 동료와 대화한다.
      en: |-
        Its mane shines when it discharges electricity.
        They use the frequency and rhythm of these flashes
        to communicate.
      fr: |-
        Sa crinière luit quand il lâche des décharges.
        Il module leur rythme et leur nombre pour
        communiquer avec ses pairs.
      de: |-
        Um mit Artgenossen zu kommunizieren, nutzt es
        das Aufblitzen seiner Mähne beim Entladen von
        Strom als Morsecode.
      es: |-
        Su crin brilla cuando emite una descarga eléctrica.
        Se comunica con los suyos mediante el ritmo y el
        número de brillos.
      it: |-
        Se emette scariche la sua criniera brilla. Comunica
        con i suoi simili tramite il ritmo e la frequenza delle
        pulsazioni luminose.
    omega-ruby:
      ja-Hrkt: |-
