magnezone:
  base_happiness: 50
  capture_rate: 30
  color: gray
  egg_groups:
    - mineral
  evolution_chain: magnemite
  evolves_from: magneton
  flavor_text:
    diamond:
      en: |-
        It evolved from exposure to a
        special magnetic field.
        Three units generate magnetism.
    pearl:
      en: |-
        It evolved from exposure to a
        special magnetic field.
        Three units generate magnetism.
    platinum:
      en: |-
        A group tried to use scientific
        means to make MAGNEZONE evolve,
        but their efforts ended in failure.
    heartgold:
      en: |-
        Exposure to a special magnetic field
        changed MAGNETON’s molecular
        structure, turning it into MAGNEZONE.
    soulsilver:
      en: |-
        Exposure to a special magnetic field
        changed MAGNETON’s molecular
        structure, turning it into MAGNEZONE.
    black:
      en: |-
        A group tried to use scientific
        means to make Magnezone evolve,
        but their efforts ended in failure.
      fr: |-
        Des scientifiques ont essayé de
        faire évoluer un Magnézone en
        laboratoire, mais ce fut un échec.
    white:
      en: |-
        A group tried to use scientific
        means to make Magnezone evolve,
        but their efforts ended in failure.
      fr: |-
        Des scientifiques ont essayé de
        faire évoluer un Magnézone en
        laboratoire, mais ce fut un échec.
    black-2:
      en: |-
        Sometimes the magnetism emitted by
        Magnezone is too strong, making them
        attract each other so they cannot move.
    white-2:
      en: |-
        Sometimes the magnetism emitted by
        Magnezone is too strong, making them
        attract each other so they cannot move.
    x:
      ja-Hrkt: |-
        つよすぎる　じりょくを　だして
        ジバコイルどうし　ひきよせあって
        まったく　うごけなくなったりする。
      ja: |-
        強すぎる　磁力を　だして
        ジバコイル同士　引き寄せあって
        まったく　動けなくなったりする。
      ko: |-
        너무 강한 자력을 내어
        자포코일끼리 끌어당겨
        전혀 못 움직이기도 한다.
      en: |-
        Sometimes the magnetism emitted by Magnezone is
        too strong, making them attract each other so they
        cannot move.
      fr: |-
        Le champ magnétique qu’ils émettent est tel qu’ils
        ont tendance à s’attirer mutuellement et à s’empêcher
        de bouger.
      de: |-
        Gelegentlich erzeugen sie so starke Magnetfelder,
        dass sie sich gegenseitig anziehen und einander
        immobilisieren.
      es: |-
        Emiten campos magnéticos tan potentes que se atraen
        entre sí e incluso pueden llegar a inmovilizarse.
      it: |-
        A volte si attraggono l’un l’altro con la loro
        potentissima carica magnetica e poi non riescono
        più a muoversi.
    'y':
      ja-Hrkt: |-
        とくしゅな　じばの　えいきょうで
        レアコイルが　しんかした。３つの
        ユニットから　じりょくを　だす。
      ja: |-
        特殊な　磁場の　影響で
        レアコイルが　進化した。３つの
        ユニットから　磁力を　出す。
      ko: |-
        특수한 자기장의 영향으로
        레어코일이 진화했다. 3개의
        유닛에서 자력을 발산한다.
      en: |-
        It evolved from exposure to a special magnetic
        field. Three units generate magnetism.
      fr: |-
        Il a évolué suite à son exposition à un champ
        magnétique spécial. Ses 3 unités génèrent du
        magnétisme.
      de: |-
        Es entwickelte sich, als es einem besonderen
        Magnetfeld ausgesetzt wurde.
      es: |-
        Evolucionó por la exposición a un campo magnético
        especial. Tres unidades generan magnetismo.
      it: |-
        Si è evoluto in seguito all’esposizione a uno speciale
        campo magnetico. Tre unità generano magnetismo.
    omega-ruby:
      ja-Hrkt: |-
        つよすぎる　じりょくを　だして
        ジバコイルどうし　ひきよせあって
        まったく　うごけなくなったりする。
      ja: |-
        強すぎる　磁力を　だして
        ジバコイル同士　引き寄せあって
        まったく　動けなくなったりする。
      ko: |-
        너무 강한 자력을 내어
        자포코일끼리 끌어당겨
        전혀 못 움직이기도 한다.
      en: |-
        Sometimes the magnetism emitted by Magnezone is
        too strong, making them attract each other so they
        cannot move.
      fr: |-
        Le champ magnétique qu’ils émettent est tel qu’ils ont
        tendance à s’attirer mutuellement et à s’empêcher de bouger.
      de: |-
        Gelegentlich erzeugen sie so starke Magnetfelder, dass sie
        sich gegenseitig anziehen und einander immobilisieren.
      es: |-
        Emiten campos magnéticos tan potentes que se atraen entre
        sí e incluso pueden llegar a inmovilizarse.
      it: |-
        A volte si attraggono l’un l’altro con la loro potentissima
        carica magnetica e poi non riescono più a muoversi.
    alpha-sapphire:
      ja-Hrkt: |-
        とくしゅな　じばの　えいきょうで
        レアコイルが　しんかした。３つの
        ユニットから　じりょくを　だす。
      ja: |-
        特殊な　磁場の　影響で
        レアコイルが　進化した。３つの
        ユニットから　磁力を　出す。
      ko: |-
        특수한 자기장의 영향으로
        레어코일이 진화했다. 3개의
        유닛에서 자력을 발산한다.
      en: |-
        It evolved from exposure to a special magnetic
        field. Three units generate magnetism.
      fr: |-
        Il a évolué suite à son exposition à un champ magnétique
        spécial. Ses trois unités génèrent du magnétisme.
      de: |-
        Es entwickelte sich, als es einem besonderen Magnetfeld
        ausgesetzt wurde.
      es: |-
        Evolucionó por la exposición a un campo magnético especial.
        Tres unidades generan magnetismo.
      it: |-
        Si è evoluto in seguito all’esposizione a uno speciale campo
        magnetico. Tre unità generano magnetismo.
    sun:
      ja-Hrkt: |-
        ３つのユニットから　じりょくを　だす。
        よぞらを　とぶ　ジバコイルを　ＵＦＯと
        まちがえる　ほうこくが　たはつ。
      ja: |-
        ３つの　ユニットから　磁力を　だす。
        夜空を　飛ぶ　ジバコイルを　ＵＦＯと
        間違える　報告が　多発。
      ko: |-
        3개의 유닛으로부터 자력을 발산한다.
        밤하늘을 나는 자포코일을 UFO로
        착각하는 보고가 많이 발생한다.
      zh-Hant: |-
        從３個組件中放出磁力。
        經常出現把飛上夜空的自爆磁怪
        錯看成ＵＦＯ的報告。
      zh-Hans: |-
        从３个组件中放出磁力。
        经常有把飞向夜空的自爆磁怪
        错看成ＵＦＯ的报告。
      en: |-
        Three units generate magnetism. There have
        been many mistaken reports of UFO sightings
        when Magnezone flies through the night sky.
      fr: |-
        Ses trois unités émettent une force magnétique.
        Il n’est pas rare que les gens le confondent avec
        un OVNI quand il vole dans le ciel.
      de: |-
        Seine drei Bestandteile erzeugen ein Magnetfeld.
        Es kommt oft vor, dass am Himmel fliegende
        Magnezone für Ufos gehalten werden.
      es: |-
        Sus tres unidades generan un campo magnético.
        Al ser avistados volando por la noche, muchos
        los han tomado por ovnis.
      it: |-
        Le sue tre unità generano magnetismo.
        Quando vola nel cielo notturno, viene spesso
        scambiato per un UFO.
    moon:
      ja-Hrkt: |-
        かいでんぱを　はっしん　しながら
        そらを　とびまわり　みちの　でんぱを
        じゅしん　していると　いう。
      ja: |-
        怪電波を　発信　しながら
        空を　飛び回り　未知の　電波を
        受信　していると　いう。
      ko: |-
        괴전파를 발신하면서
        하늘을 날아 미지의 전파를
        수신하고 있다고 한다.
      zh-Hant: |-
        據說會一邊發送怪異電波
        一邊在空中四處飛行，
        接收未知的電波。
      zh-Hans: |-
        据说会一边在空中来回飞行，
        一边发送怪异电波
        和接收未知电波。
      en: |-
        As it zooms through the sky, this Pokémon
        seems to be receiving signals of unknown origin,
        while transmitting signals of unknown purpose.
      fr: |-
        Il vole dans le ciel en émettant et en recevant
        des ondes bien mystérieuses.
      de: |-
        Es heißt, dass es beim Herumfliegen mysteriöse
        Funkwellen aussende und unbekannte empfange.
      es: |-
        Se dice que mientras vuela emite unas ondas
        eléctricas misteriosas, a la vez que recibe otras
        ondas desconocidas.
      it: |-
        Fluttua in aria trasmettendo e ricevendo
        misteriose onde elettromagnetiche.
    ultra-sun:
      ja-Hrkt: |-
        じぶんの　テリトリーを　レーダーで
        かんし　している。　しんにゅうしゃは
        はかいこうせんで　ただちに　しょぶん。
      ja: |-
        自分の　テリトリーを　レーダーで
        監視　している。　侵入者は
        破壊光線で　ただちに　処分。
      ko: |-
        자신의 영토를 레이더로
        감시하고 있다. 침입자는
        파괴광선으로 즉시 처분한다.
      zh-Hant: |-
        用雷達監視著自己的地盤。
        一旦發現入侵者，就會立刻
        用破壞光線來解決對方。
      zh-Hans: |-
        用雷达监视着自己的领地。
        一旦发现入侵者，
        就会立即用破坏光线惩治。
      en: |-
        It uses radar to monitor its territory. Intruders
        are quickly disposed of with a hyper beam.
      fr: |-
        Il surveille son territoire à l’aide de son radar,
        et élimine rapidement tout intrus avec son
        laser destructeur.
      de: |-
        Es überwacht sein Territorium mithilfe seines
        Radars. Entdeckt es Eindringlinge, greift es sie
        unvermittelt mit einem Hyperstrahl an.
      es: |-
        Gracias a su radar detecta a cualquier intruso
        que se adentre en su territorio y lo elimina sin
        miramientos con su rayo destructor.
      it: |-
        Sorveglia il suo territorio via radar ed elimina
        immediatamente gli intrusi con un raggio
        distruttore.
    ultra-moon:
      ja-Hrkt: |-
        いまだに　うちゅうから　やってきたと
        しんじる　ひとびとも　いる。
        きょうりょくな　じりょくを　はなつ。
      ja: |-
        未だに　宇宙から　やってきたと
        信じる　人々も　いる。
        強力な　磁力を　放つ。
      ko: |-
        아직까지 우주에서 왔다고
        믿는 사람들도 있다.
        강력한 자력을 발산한다.
      zh-Hant: |-
        至今仍然有人相信
        牠來自宇宙。
        會釋放出強大的磁力。
      zh-Hans: |-
        直至今日仍有人们相信
        它是来自宇宙的。
        会释放出强力的磁力。
      en: |-
        There are still people who believe that this
        Pokémon came from outer space. It emanates
        a powerful magnetic field.
      fr: |-
        De nombreuses personnes pensent encore qu’il
        s’agit d’un Pokémon venu de l’espace. Il émet
        un champ magnétique extrêmement puissant.
      de: |-
        Manche Menschen glauben immer noch, dass
        Magnezone von einem anderen Planeten stamme.
        Es geht ein starkes Magnetfeld von ihm aus.
      es: |-
        Todavía hay quien cree hoy en día que proviene
        del espacio. Emite un campo magnético de gran
        potencia.
      it: |-
        Ancora oggi c’è chi crede che Magnezone sia
        venuto dallo spazio. Emette un’intensa forza
        magnetica.
    sword:
      ja-Hrkt: |-
        あたまの　アンテナで　うちゅうからの
        でんぱを　じゅしんして　なにものかに
        コントロールされていると　いわれる。
      ja: |-
        頭の　アンテナで　宇宙からの
        電波を　受信して　何者かに
        コントロールされていると　いわれる。
      ko: |-
        머리의 안테나로 누군가가 보낸
        전파를 우주로부터 수신하여
        조종당하고 있다고 전해진다.
      zh-Hant: |-
        據說牠頭上的天線會
        接收來自宇宙的電波，
        讓牠被未知的對象控制。
      zh-Hans: |-
        据说它通过头部的天线
        接收来自宇宙的电波，
        受到未知对象的操控。
      en: |-
        Some say that Magnezone receives signals from
        space via the antenna on its head and that it’s
        being controlled by some mysterious being.
      fr: |-
        On raconte qu’il serait contrôlé par une entité
        extraterrestre grâce à des ondes qu’il capterait
        avec l’antenne sur sa tête.
      de: |-
        Man sagt, es werde von einem Wesen aus dem
        All kontrolliert und mit der Antenne auf seinem
        Kopf empfange es von ihm Signale.
      es: |-
        Se cree que con la antena que tiene en la cabeza
        recibe señales del espacio enviadas por un ser
        que lo controla.
      it: |-
        Si dice che venga controllato tramite onde
        elettromagnetiche provenienti dallo spazio,
        che capta con l’antenna posta sulla testa.
    shield:
      ja-Hrkt: |-
        とくしゅな　じばの　えいきょうで
        からだの　ぶんしこうぞうが　へんかし
        しんかしたと　かんがえられている。
      ja: |-
        特殊な　磁場の　影響で
        体の　分子構造が　変化し
        進化したと　考えられている。
      ko: |-
        특수한 자기장의 영향으로
        몸의 분자 구조가 변화해
        진화했다고 여겨지고 있다.
      zh-Hant: |-
        人們認為牠是受到特殊
        磁場的影響，導致身體的
        分子結構發生變化才進化的。
      zh-Hans: |-
        人们认为，它是因为受到特殊
        磁场的影响，身体的分子构造
        发生了变化，才进化成这样的。
      en: |-
        It’s thought that a special magnetic field changed
        the molecular structure of this Pokémon’s body,
        and that’s what caused the Pokémon’s evolution.
      fr: |-
        On pense qu’il a évolué après avoir été exposé
        à un champ magnétique particulier qui a modifié
        la structure moléculaire de son corps.
      de: |-
        Man vermutet, es habe sich entwickelt, nachdem
        es einem besonderen Magnetfeld ausgesetzt war,
        das seine Molekularstruktur veränderte.
      es: |-
        Se piensa que estuvo expuesto a un campo
        magnético especial que alteró su estructura
        molecular e hizo que evolucionara.
      it: |-
        Si pensa che la sua struttura molecolare sia
        mutata in seguito all’esposizione a uno speciale
        campo magnetico, che ha innescato l’evoluzione.
