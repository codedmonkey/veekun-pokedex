        pas vivre en eau polluée.
    black-2:
      en: |-
        They prefer unpolluted southern seas.
        Their coral branches lose their color
        and deteriorate in dirty water.
    white-2:
      en: |-
        They prefer unpolluted southern seas.
        Their coral branches lose their color
        and deteriorate in dirty water.
    x:
      ja-Hrkt: |-
        どんどん　そだっては　はえかわる
        あたまの　さきは　きれいなので
        たからもの　として　にんきがたかい。
      ja: |-
        どんどん　育っては　生えかわる
        頭の　先は　きれいなので
        宝物として　人気が高い。
      ko: |-
        점점 자라면서 다시 돋아나는
        머리의 끝이 아름다워
        보물로서 인기가 많다.
      en: |-
        It continuously sheds and grows. The tip of its head
        is prized as a treasure because of its beauty.
      fr: |-
        Il grandit en permanence. Les exquises excroissances
        de sa tête sont très recherchées.
      de: |-
        Es häutet sich ständig und wächst. Seine Kopfspitze
        wurde als Schatz der Schönheit ausgezeichnet.
      es: |-
        Crece y muda continuamente. La parte superior de su
        cabeza es muy apreciada por su belleza.
      it: |-
        Muta la pelle e cresce di continuo. La punta che
        ha sul capo è un simbolo della sua bellezza.
    'y':
      ja-Hrkt: |-
        みなみの　きれいな　うみをこのむ。
        よごれた　うみだと　サンゴの　えだは
        いろがくすみ　ボロボロになるのだ。
      ja: |-
        南の　きれいな　海を好む。
        汚れた　海だと　サンゴの　枝は
        色がくすみ　ボロボロになるのだ。
      ko: |-
        남쪽의 깨끗한 바다를 좋아한다.
        더러운 바다면 산호 가지는
        색이 거무스레해지고 엉망이 된다.
      en: |-
        They prefer unpolluted southern seas. Their coral
        branches lose their color and deteriorate in
        dirty water.
      fr: |-
        On le trouve souvent dans les mers claires du sud.
        L’eau polluée décolore son corail et le fait dépérir.
      de: |-
        Hält sich lieber in den sauberen Seen im Süden auf.
        Seine Korallenarme verlieren in verschmutztem Wasser
        Farbe und Form.
      es: |-
        Adoran las aguas cristalinas de los mares del sur, pues
        su coral pierde color y se deteriora en aguas sucias.
      it: |-
        Preferisce i limpidi mari del sud. In quelli inquinati,
        invece, i suoi coralli si logorano e perdono il loro
        colore.
    omega-ruby:
      ja-Hrkt: |-
        サンゴの　えだは　たいようの　ひかりを　あびると
        なないろに　キラキラ　かがやき　とても　きれい。
        おれても　ひとばんで　もとどおりに　はえてくる。
      ja: |-
        サンゴの　枝は　太陽の　光を　浴びると
        七色に　キラキラ　輝き　とても　きれい。
        折れても　一晩で　元通りに　生えてくる。
      ko: |-
        산호 가지는 태양의 빛을 받으면
        일곱 빛깔로 반짝반짝 빛이 나 정말 아름답다.
        부러져도 하룻밤이면 원래대로 자라난다.
      en: |-
        Corsola’s branches glitter very beautifully in seven colors when
        they catch sunlight. If any branch breaks off, this Pokémon
        grows it back in just one night.
      fr: |-
        Les branches de Corayon brillent de sept couleurs quand
        elles sont exposées à la lumière du soleil. Si une des branches
        casse, ce Pokémon peut la faire repousser en une nuit.
      de: |-
        Wenn Corasonns Arme Sonnenlicht abbekommen, glitzern sie
        wunderschön in sieben Farben. Wenn ein Arm abbricht, wächst
        über Nacht ein neuer nach.
      es: |-
        Las ramas de Corsola brillan con belleza hasta en siete
        colores cuando les da el sol. Si se le rompe alguna, el
        Pokémon la regenera en tan solo una noche.
      it: |-
        Le ramificazioni dei Corsola brillano in sette meravigliosi
        colori se esposte alla luce del sole. Se qualche ramo
        si spezza e cade viene rigenerato nell’arco di una notte.
    alpha-sapphire:
      ja-Hrkt: |-
        あたたかい　うみに　あつまった　サニーゴは
        ちいさい　ポケモンたちの　かくれがに　なる。
        すいおんが　さがると　みなみへ　いどうする。
      ja: |-
        暖かい　海に　集まった　サニーゴは
        小さい　ポケモンたちの　隠れ家に　なる。
        水温が　下がると　南へ　移動する。
      ko: |-
        따뜻한 바다에 모인 코산호는
        작은 포켓몬들의 은신처가 된다.
        수온이 낮아지면 남쪽으로 이동한다.
      en: |-
        Clusters of Corsola congregate in warm seas where they serve
        as ideal hiding places for smaller Pokémon. When the water
        temperature falls, this Pokémon migrates to the southern seas.
      fr: |-
        Les Corayon se rassemblent dans les mers chaudes,
        offrant ainsi un abri idéal aux plus petits Pokémon.
        Quand la température baisse, ce Pokémon migre vers
        les mers du sud.
      de: |-
        Scharen von Corasonn sammeln sich im warmen Meer und
        dienen kleineren Pokémon als ideale Plätze zum Verstecken.
        Wenn die Wassertemperatur sinkt, wandert dieses Pokémon
        in die südlichen Meere ab.
      es: |-
        Las aguas templadas son el hábitat de Corsola. Allí se
        agrupan grandes bancos de estos Pokémon que sirven de
        escondite a Pokémon más pequeños. Cuando la temperatura
        del agua baja, suelen migrar a los mares del sur.
      it: |-
        I Corsola formano grandi colonie nei mari più caldi dove
        costituiscono rifugi ideali per Pokémon più piccoli. Quando
        la temperatura dell’acqua si abbassa, migrano verso i mari
        del sud.
    sun:
      ja-Hrkt: |-
        サンゴのえだが　あたまに　はえる。
        かなり　かんたんに　おれるけど
        みっかくらいで　もとに　もどるよ。
      ja: |-
        サンゴの枝が　頭に　生える。
        かなり　簡単に　折れるけど
        ３日くらいで　元に　戻るよ。
      ko: |-
        산호 가지가 머리에 자란다.
        꽤 간단히 부러지지만
        사흘 정도면 원래대로 돌아온다.
      zh-Hant: |-
        頭頂上長有珊瑚枝。
        雖然相當容易被折斷，
        但大約３天就能恢復原狀哦。
      zh-Hans: |-
        头顶上长着珊瑚枝。
        虽然相当容易折断，
        但大约３天就能恢复哦。
      en: |-
        Coral branches grow from its head.
        They break off quite easily, but they
        grow back in about three days.
      fr: |-
        Des cornes de corail poussent sur la tête
        de ce Pokémon. Elles sont assez fragiles,
        mais repoussent en trois jours seulement.
      de: |-
        Auf seinem Kopf wachsen Korallenarme, die
        ziemlich leicht abbrechen, allerdings innerhalb
        von etwa drei Tagen wieder nachwachsen.
      es: |-
        De su cabeza brotan ramas de coral. Son muy
        frágiles, pero pueden regenerarse en un lapso
        de tres días.
      it: |-
        Sul suo capo crescono dei coralli molto fragili.
        Se un ramo si spezza e cade, viene rigenerato
        nell’arco di tre giorni.
    moon:
      ja-Hrkt: |-
        あたまの　えだを　ねらい　ヒドイデが
        おいかけてくると　じぶんで　えだを
        ポキリと　おって　にげだすよ。
      ja: |-
        頭の　枝を　狙い　ヒドイデが
        追いかけてくると　自分で　枝を
        ポキリと　折って　逃げだすよ。
      ko: |-
        머리의 가지를 노리고 시마사리가
        쫓아오면 자신의 가지를
        뚝 부러뜨리고 도망친다.
      zh-Hant: |-
        襲擊頭頂枝條的好壞星
        追過來的時候，
        會果斷地自己折斷枝條逃生哦。
      zh-Hans: |-
        好坏星追过来袭击它
        头顶枝条的时候，
        会果断地自己折断枝条逃生哦。
      en: |-
        Pursued by Mareanie for the branches on its
        head, this Pokémon will sometimes snap its own
        branches off as a diversion while it escapes.
      fr: |-
        Lorsqu’il est poursuivi par des Vorastérie attirés
        par les cornes sur sa tête, il les détache de
        lui-même pour faire diversion et détaler.
      de: |-
        Drohen die Arme auf seinem Kopf von einem
        Garstella verschlungen zu werden, wirft es
        diese ab und sucht das Weite.
      es: |-
        Cuando Mareanie lo persigue para hacerse con
        sus ramas de coral, Corsola se desprende de
        ellas adrede para poder huir sin problemas.
      it: |-
        Quando è inseguito da un Mareanie attirato dai
        coralli che ha sul capo, li stacca per distrarlo
        e fuggire più agevolmente.
    ultra-sun:
      ja-Hrkt: |-
        アローラに　くらす　サニーゴは
        ピンクが　とても　あざやかで　こい。
        えいようほうふな　うみの　おかげだ。
      ja: |-
        アローラに　暮らす　サニーゴは
        ピンクが　とても　鮮やかで　濃い。
        栄養豊富な　海の　おかげだ。
      ko: |-
        알로라에 사는 코산호는
        핑크가 매우 선명하고 짙다.
        영양이 풍부한 바다 덕분이다.
      zh-Hant: |-
        生活在阿羅拉的太陽珊瑚
        身上的粉紅色非常鮮豔濃郁，
        這都是拜富含營養的大海所賜。
      zh-Hans: |-
        生活在阿罗拉的太阳珊瑚身上的
        粉红色非常鲜艳浓郁。
        这都是拜富含营养的大海所赐。
      en: |-
        The pink of Corsola that live in Alola is deep
        and vibrant, thanks to seas filled with nutrition.
      fr: |-
        Les nutriments présents dans les eaux riches
        d’Alola ont donné à Corayon cette couleur rose
        si vive et chatoyante.
      de: |-
        Aufgrund des nährstoffreichen Meeres ist das
        Pink der in Alola lebenden Corasonn besonders
        strahlend und kräftig.
      es: |-
        La coloración rosa de los ejemplares de Alola es
        extraordinariamente viva e intensa debido a la
        abundancia de nutrientes de sus aguas.
      it: |-
        I Corsola che vivono ad Alola sono di un colore
        rosa intenso e brillante grazie alle acque marine
        ricche di elementi nutritivi.
    ultra-moon:
      ja-Hrkt: |-
        てんてきの　ヒドイデが　たくさんいる
        アローラでは　あたまの　えだが
        みじかい　サニーゴが　おおいのだ。
      ja: |-
        天敵の　ヒドイデが　たくさんいる
        アローラでは　頭の　枝が
        短い　サニーゴが　多いのだ。
      ko: |-
        천적인 시마사리가 잔뜩 있는
        알로라에서는 머리의 가지가
        짧은 코산호가 많다.
      zh-Hant: |-
        在天敵好壞星大量存在的
        阿羅拉，大多數的太陽珊瑚
        頭上的枝條都短短的。
      zh-Hans: |-
        在天敌好坏星大量存在的阿罗拉，
        大多数太阳珊瑚头上的
        枝条都是短短的。
      en: |-
        In Alola, where their natural enemies Mareanie
        are plentiful, many Corsola have stubby
        branches on their heads.
      fr: |-
        À cause de la prolifération de Vorastérie,
        son prédateur naturel, le Corayon d’Alola
        a souvent les cornes courtes.
      de: |-
        In Alola gibt es viele Corasonn mit kurzen
        Korallenarmen, da es dort von ihren
        Fressfeinden Garstella nur so wimmelt.
      es: |-
        En Alola abundan los Mareanie, su enemigo
        natural, y por eso se ven muchos Corsola con
        ramas de coral más cortas de lo normal.
      it: |-
        Ad Alola, i rametti sulla testa dei Corsola sono
        spesso più corti del normale per la presenza
        massiccia di Mareanie, i loro nemici naturali.
    sword:
      ja-Hrkt: |-
        あたまに　はえた　えだは　おれても
        また　はえてくる。　きれいな　ものは
        あんざんの　おまもりに　されるよ。
      ja: |-
        頭に　生えた　枝は　折れても
        また　生えてくる。　きれいな　ものは
        安産の　お守りに　されるよ。
      ko: |-
        머리에 난 가지는 부러져도
        다시 자란다. 예쁜 것은
        순산을 기원하는 부적으로 쓰인다.
      zh-Hant: |-
        頭頂上的珊瑚枝即使折斷了
        也會再長出來。人們會把漂亮的
        珊瑚枝當成保佑孕婦的護身符。
      zh-Hans: |-
        头顶上的珊瑚枝即使折断了
        也会再长出来。人们会把漂亮的
        珊瑚枝当成保佑孕妇的护身符。
      en: |-
        It will regrow any branches that break off its
        head. People keep particularly beautiful Corsola
        branches as charms to promote safe childbirth.
      fr: |-
        Ses branches repoussent si elles sont brisées.
        Les plus belles sont offertes aux futures mamans
        comme porte-bonheurs.
      de: |-
        Die Äste auf seinem Kopf wachsen nach, wenn
        sie abbrechen. Besonders schöne abgebrochene
        Äste gelten als Glücksbringer für Geburten.
      es: |-
        Las ramas que le brotan de la cabeza se
        regeneran si se rompen. Las más bellas se
        emplean como amuleto en los partos.
      it: |-
        Se i coralli che ha sulla testa si spezzano
        crescono nuovamente. Quelli più belli vengono
        usati come portafortuna per il parto.
    shield:
      ja-Hrkt: |-
        あたたかい　うみで　くらす。
        たいこは　ガラルきんかい　にも
        かずおおく　せいそく　していた。
      ja: |-
        温かい　海で　暮らす。
        太古は　ガラル近海　にも
        数多く　生息していた。
      ko: |-
        따뜻한 바다에 서식한다.
        태고에는 가라르 근해에서도
        많은 수가 서식했었다.
      zh-Hant: |-
        在溫暖的大海裡生活。
        也曾經大量棲息於
        上古時期的伽勒爾近海。
      zh-Hans: |-
        在温暖的大海里生活。
        也曾经大量栖息于
        上古时期的伽勒尔近海。
      en: |-
        These Pokémon live in warm seas.
        In prehistoric times, many lived in the
        oceans around the Galar region as well.
      fr: |-
        Ces Pokémon habitués des mers chaudes
        se trouvaient autrefois en masse sur les côtes
        de Galar.
      de: |-
        Es lebt in warmen Meeren. Vor langer Zeit konnte
        man große Scharen dieses Pokémon auch an den
        Küsten Galars antreffen.
      es: |-
        Habita en mares cálidos. Antiguamente vivían en
        las aguas costeras de Galar un gran número de
        ejemplares.
      it: |-
        Vive nei mari più caldi. Anticamente, numerosi
        esemplari di questo Pokémon vivevano anche
        lungo le coste di Galar.
