    black:
      en: |-
        It can hover in one spot by
        flapping its wings at high speed. It
        flits about to guard its territory.
      fr: |-
        La vitesse de ses ailes lui permet
        un vol stationnaire. Il surveille
        ainsi tout son territoire.
    white:
      en: |-
        It can hover in one spot by
        flapping its wings at high speed. It
        flits about to guard its territory.
      fr: |-
        La vitesse de ses ailes lui permet
        un vol stationnaire. Il surveille
        ainsi tout son territoire.
    black-2:
      en: |-
        By flapping its wings at high speed,
        it can fly freely through the air.
        Even sudden stops are no problem.
    white-2:
      en: |-
        By flapping its wings at high speed,
        it can fly freely through the air.
        Even sudden stops are no problem.
    x:
      ja-Hrkt: |-
        かおを　うごかさずに　３６０ど
        すべてを　みわたす　めを　もつので
        まうしろの　えものも　みのがさない。
      ja: |-
        顔を　動かさずに　３６０度
        すべてを　見渡す　目を　持つので
        真後ろの　獲物も　見逃さない。
      ko: |-
        얼굴을 움직이지 않고 360도 전부
        볼 수 있는 눈을 가지고 있어서
        바로 뒤의 먹이도 놓치지 않는다.
      en: |-
        Its eyes can see 360 degrees without moving its
        head. It won’t miss prey--even those behind it.
      fr: |-
        Il voit à 360° sans avoir à tourner la tête. Il ne loupe
        jamais une proie, même dans son dos.
      de: |-
        Mit seinen Augen hat es einen Blickwinkel von
        360 Grad. Es sieht sogar Beute, die sich hinter ihm
        befindet.
      es: |-
        Su campo visual es de 360° sin girar la cabeza.
        Detecta hasta las presas que están a su espalda.
      it: |-
        Ha un campo visivo a 360 gradi senza muovere la
        testa. Riesce a vedere persino le prede alle sue spalle.
    'y':
      ja-Hrkt: |-
        こうそくで　ハネを　はばたかせると
        しょうげきは　が　はっせいして
        まわりの　まどガラスが　われていく。
      ja: |-
        高速で　羽を　羽ばたかせると
        衝撃波が　発生して
        まわりの　窓ガラスが　割れていく。
      ko: |-
        고속으로 날개를 치면
        충격파가 발생해서
        주변의 유리창이 깨진다.
      en: |-
        If it flaps its wings really fast, it can generate shock
        waves that will shatter windows in the area.
      fr: |-
        En battant des ailes très vite, il peut générer une
        violente onde de choc qui peut briser les fenêtres.
      de: |-
        Schlägt es schnell mit den Flügeln, erzeugt es
        Schockwellen, durch die sogar Fenster zerbersten.
      es: |-
        Si aletea muy rápido, genera ondas expansivas
        capaces de hacer añicos todas las ventanas próximas.
      it: |-
        Se agita le ali ad altissima velocità può generare onde
        che distruggono i vetri delle finestre nella zona.
    omega-ruby:
      ja-Hrkt: |-
        めだまを　うごかさずに　３６０ど　みわたせる。
        きゅうブレーキや　ほうこうてんかんが　とくい。
        ねらった　えものを　すばやく　おいつめていく。
      ja: |-
        目玉を　動かさずに　３６０度　見渡せる。
        急ブレーキや　方向転換が　得意。
        ねらった　獲物を　素早く　追いつめていく。
      ko: |-
        눈알을 움직이지 않고 360도를 볼 수 있다.
        급브레이크나 방향 전환이 특기다.
        노린 먹이를 빠르게 몰아넣는다.
      en: |-
        Yanma is capable of seeing 360 degrees without having to
        move its eyes. It is a great flier that is adept at making sudden
        stops and turning midair. This Pokémon uses its flying ability to
        quickly chase down targeted prey.
      fr: |-
        Yanma a un champ de vision de 360 degrés sans avoir besoin
        de bouger les yeux. Il vole incroyablement bien et peut faire
        des figures acrobatiques. Ce Pokémon descend en piqué
        sur ses proies.
      de: |-
        Yanma hat einen Blickwinkel von 360 Grad, ohne die Augen
        bewegen zu müssen. Es ist ein großartiger Flieger und geübt
        darin, plötzlich anzuhalten oder Wendemanöver vorzunehmen.
        So kann es sich blitzschnell auf Beute stürzen.
      es: |-
        Yanma tiene un ángulo de visión de 360° sin mover los ojos.
        Es un gran volador, experto en hacer repentinas paradas y
        cambios de dirección en el aire. Aprovecha la habilidad que
        tiene de volar para lanzarse sobre su presa.
      it: |-
        Yanma è dotato di un campo visivo a 360 gradi senza bisogno
        di muovere gli occhi. Grazie alle grandi ali riesce a fermarsi
        improvvisamente e virare a mezz’aria. Sfrutta la sua abilità
        in volo per abbattere la preda al suolo.
    alpha-sapphire:
      ja-Hrkt: |-
        めだまを　うごかさずに　３６０ど　みわたせる。
        きゅうブレーキや　ほうこうてんかんが　とくい。
        ねらった　えものを　すばやく　おいつめていく。
      ja: |-
        目玉を　動かさずに　３６０度　見渡せる。
        急ブレーキや　方向転換が　得意。
        ねらった　獲物を　素早く　追いつめていく。
      ko: |-
        눈알을 움직이지 않고 360도를 볼 수 있다.
        급브레이크나 방향 전환이 특기다.
        노린 먹이를 빠르게 몰아넣는다.
      en: |-
        Yanma is capable of seeing 360 degrees without having to
        move its eyes. It is a great flier that is adept at making sudden
        stops and turning midair. This Pokémon uses its flying ability
        to quickly chase down targeted prey.
      fr: |-
        Yanma a un champ de vision de 360 degrés sans avoir besoin
        de bouger les yeux. Il vole incroyablement bien et peut faire
        des figures acrobatiques. Ce Pokémon descend en piqué
        sur ses proies.
      de: |-
        Yanma hat einen Blickwinkel von 360 Grad, ohne die Augen
        bewegen zu müssen. Es ist ein großartiger Flieger und geübt
        darin, plötzlich anzuhalten oder Wendemanöver hinzulegen.
        So kann es sich blitzschnell auf Beute stürzen.
      es: |-
        Yanma tiene un ángulo de visión de 360° sin mover los ojos.
        Es un gran volador, experto en hacer repentinas paradas y
        cambios de dirección en el aire. Aprovecha la habilidad que
        tiene de volar para lanzarse sobre su presa.
      it: |-
        Yanma è dotato di un campo visivo a 360 gradi senza bisogno
        di muovere gli occhi. Grazie alle grandi ali riesce a fermarsi
        improvvisamente e virare a mezz’aria. Sfrutta la sua abilità
        in volo per abbattere la preda al suolo.
