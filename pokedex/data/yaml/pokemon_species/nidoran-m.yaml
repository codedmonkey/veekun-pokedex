    sword:
      ja-Hrkt: |-
        ひたいの　ツノには　もうどくがある。
        けいかいしんが　つよく　おおきな
        みみを　つねに　そばだてている。
      ja: |-
        額の　ツノには　猛毒がある。
        警戒心が　強く　大きな　耳を
        つねに　そばだてている。
      ko: |-
        이마의 뿔에는 맹독이 있다.
        경계심이 강해서 커다란
        귀를 늘 쫑긋 세우고 있다.
      zh-Hant: |-
        額頭的角有劇毒。
        警戒心強，隨時都
        豎著大耳朵戒備著。
      zh-Hans: |-
        额头上的角含有剧毒。
        警戒心强，无论何时都
        竖着自己大大的耳朵。
      en: |-
        The horn on a male Nidoran’s forehead contains
        a powerful poison. This is a very cautious
        Pokémon, always straining its large ears.
      fr: |-
        Sa corne frontale contient un puissant poison.
        Les grandes oreilles de ce Pokémon très prudent
        sont constamment dressées.
      de: |-
        Das Horn auf seiner Stirn enthält ein starkes Gift.
        Dieses Pokémon ist sehr vorsichtig und stellt
        seine großen Ohren stets wachsam auf.
      es: |-
        Mantiene sus grandes orejas levantadas, siempre
        alerta. Si advierte peligro, ataca inoculando una
        potente toxina con su cuerno frontal.
      it: |-
        Il corno sulla fronte è estremamente velenoso.
        Di indole circospetta, rizza costantemente le
        sue grandi orecchie.
    shield:
      ja-Hrkt: |-
        こがらだが　いさましい　せいしつ。
        なかよしの　メスを　まもるため
        みを　ていして　かかんに　たたかう。
      ja: |-
        小柄だが　勇ましい　性質。
        仲良しの　メスを　守るため
        身を　ていして　果敢に　戦う。
      ko: |-
        몸집은 작지만 용맹한 성질을 지녔다.
        친한 암컷을 지키기 위해
        몸을 던져 과감히 싸운다.
      zh-Hant: |-
        體型嬌小，但性情勇猛。
        為了保護感情好的雌性，
        會奮不顧身地勇敢戰鬥。
      zh-Hans: |-
        身材虽小，却性格勇敢。
        为了保护相好的雌性，
        会不顾生命果敢地战斗。
      en: |-
        Small but brave, this Pokémon will hold its
        ground and even risk its life in battle to protect
        the female it’s friendly with.
      fr: |-
        Malgré sa petite taille, il est très téméraire.
        Afin de protéger sa compagne, il est prêt à
        se battre et à risquer sa vie.
      de: |-
        Trotz seiner geringen Größe ist es sehr mutig.
        Um ein befreundetes Weibchen zu beschützen,
        riskiert es sein Leben und kämpft unerschrocken.
      es: |-
        Pequeño pero valiente. Arriesgaría la vida en
        combate con tal de proteger a su compañera.
      it: |-
        Impavido nonostante la corporatura minuta,
        lotta con coraggio per proteggere la femmina
        a cui è affezionato, anche a costo della vita.
