    x:
      ja-Hrkt: |-
        くさむらの　うえに　みみだけ　だして
        まわりの　けはいを　さぐる。
        もうどくの　ツノで　みを　まもる。
      ja: |-
        草むらの　上に　耳だけ　出して
        まわりの　気配を　探る。
        猛毒の　ツノで　身を　守る。
      ko: |-
        풀밭 위로 귀만 내어
        주위의 낌새를 살핀다.
        맹독의 뿔로 몸을 보호한다.
      en: |-
        It scans its surroundings by raising its ears out of
        the grass. Its toxic horn is for protection.
      fr: |-
        Il jauge le terrain en laissant ses oreilles dépasser
        de l’herbe. Il se défend avec sa corne toxique.
      de: |-
        Es untersucht die Umgebung, indem es die Ohren
        spitzt und lauscht. Sein giftiges Horn schützt es.
      es: |-
        Saca las orejas por encima de la hierba para explorar
        el territorio. Le protege su cuerno venenoso.
      it: |-
        Esamina l’ambiente circostante tendendo le orecchie
        fuori dall’erba. Si protegge con il corno velenoso.
    'y':
      ja-Hrkt: |-
        みみが　おおきく　とおくの　おとを
        きくとき　はばたくように　うごく。
        おこると　どくばりを　だす。
      ja: |-
        耳が　大きく　遠くの　音を
        聞くとき　はばたくように　動く。
        怒ると　毒針を　出す。
      ko: |-
        귀가 커서 먼 곳의 소리를
        들을 때 날개 치듯 움직인다.
        화나면 독침을 쏜다.
      en: |-
        Its large ears are flapped like wings when it is
        listening to distant sounds. It extends toxic barbs
        when angered.
      fr: |-
        Ce Pokémon agite ses oreilles comme pour entendre
        tout ce qui se passe au loin. Il déploie des aiguillons
        toxiques quand il est en colère.
      de: |-
        Seine großen Ohren schlagen wie Flügel, wenn es
        Geräusche in weiter Entfernung hört. Es fährt
        giftige Stacheln aus, wenn es verärgert ist.
      es: |-
        Cambia la orientación de las grandes orejas que
        tiene para oír mejor. Si se enfada, despliega sus
        púas venenosas.
      it: |-
        Solleva le orecchie come ali per captare rumori in
        lontananza. Quando è adirato, estende i baffi velenosi.
    omega-ruby:
      ja-Hrkt: |-
        みみを　うごかす　きんにくが　はったつしていて
        どんな　むきにも　じざいに　みみを　うごかせる。
        かすかな　ものおとも　ききもらさない　ポケモン。
      ja: |-
        耳を　動かす　筋肉が　発達していて
        どんな　向きにも　自在に　耳を　動かせる。
        かすかな　物音も　聞き漏らさない　ポケモン。
      ko: |-
        귀를 움직이는 근육이 발달되어 있어서
        어떤 방향으로든 자유로이 귀를 움직일 수 있다.
        희미한 소리도 빠트리지 않고 듣는 포켓몬이다.
      en: |-
        Nidoran♂ has developed muscles for moving its ears. Thanks
        to them, the ears can be freely moved in any direction. Even
        the slightest sound does not escape this Pokémon’s notice.
      fr: |-
        Nidoran♂ a développé des muscles pour bouger
        ses oreilles. Ainsi, il peut les orienter à sa guise.
        Ce Pokémon peut entendre le plus discret des bruits.
      de: |-
        Nidoran♂ hat Muskeln entwickelt, um seine Ohren bewegen
        zu können. Dadurch kann es sie in jede beliebige Richtung
        drehen. Diesem Pokémon entgeht nicht einmal das leiseste
        Geräusch.
      es: |-
        Nidoran♂ ha desarrollado músculos para mover las orejas y
        orientarlas en cualquier dirección. De este modo, es capaz de
        captar hasta el sonido más leve.
      it: |-
        Nidoran♂ ha sviluppato dei muscoli per muovere liberamente
        le orecchie in qualsiasi direzione. Così, questo Pokémon
        è in grado di percepire anche il più flebile fruscio.
    alpha-sapphire:
      ja-Hrkt: |-
        みみを　うごかす　きんにくが　はったつしていて
        どんな　むきにも　じざいに　みみを　うごかせる。
        かすかな　ものおとも　ききもらさない　ポケモン。
      ja: |-
        耳を　動かす　筋肉が　発達していて
        どんな　向きにも　自在に　耳を　動かせる。
        かすかな　物音も　聞き漏らさない　ポケモン。
      ko: |-
        귀를 움직이는 근육이 발달되어 있어서
        어떤 방향으로든 자유로이 귀를 움직일 수 있다.
        희미한 소리도 빠트리지 않고 듣는 포켓몬이다.
      en: |-
        Nidoran♂ has developed muscles for moving its ears. Thanks
        to them, the ears can be freely moved in any direction. Even
        the slightest sound does not escape this Pokémon’s notice.
      fr: |-
        Nidoran♂ a développé des muscles pour bouger
        ses oreilles. Ainsi, il peut les orienter à sa guise.
        Ce Pokémon peut entendre le plus discret des bruits.
      de: |-
        Nidoran♂ hat Muskeln entwickelt, um seine Ohren
        bewegen zu können. Dadurch kann es sie in jede
        beliebige Richtung wenden. Diesem Pokémon entgeht
        nicht das leiseste Geräusch.
      es: |-
        Nidoran♂ ha desarrollado músculos para mover las orejas y
        orientarlas en cualquier dirección. De este modo, es capaz de
        captar hasta el sonido más leve.
      it: |-
        Nidoran♂ ha sviluppato dei muscoli per muovere liberamente
        le orecchie in qualsiasi direzione. Così, questo Pokémon
        è in grado di percepire anche il più flebile fruscio.
    lets-go-pikachu:
      ja-Hrkt: |-
        いつも　おおきな　みみを　たてて
        まわりの　けはいを　さぐる。きけんを
        かんじたときは　どくバリを　つかう。
      ja: |-
        いつも　大きな　耳を　立てて
        まわりの　気配を　探る。危険を
        感じたときは　どくバリを　使う。
      ko: |-
        언제나 커다란 귀를 세워서
        주위의 낌새를 살핀다.
        위험을 감지하면 독침을 사용한다.
      zh-Hant: |-
        總是豎起大大的耳朵，
        探查著周遭的狀況。
        察覺到危險時會用毒針來應付。
      zh-Hans: |-
        一直竖起它的大耳朵
        感知周围的情形。当它
        察觉到危险便会使用毒针。
      en: |-
        Its large ears are always kept upright. If it senses
        danger, it will attack with a poisonous sting.
      fr: |-
        Ses grandes oreilles sont toujours dressées et
        à l’affût de ce qu’il se passe alentour. S’il est
        menacé, il se défend avec ses dards venimeux.
      de: |-
        Es stellt seine großen Ohren auf, um so seine
        Umgebung zu überwachen. Droht Gefahr,
        so greift es mit seinen Giftstacheln an.
      es: |-
        Mantiene sus grandes orejas levantadas, siempre
        alerta. Si advierte peligro, ataca con las púas
        venenosas.
      it: |-
        Rizza le orecchie enormi per sondare i dintorni.
        Se percepisce un pericolo, attacca con gli aculei
        velenosi.
    lets-go-eevee:
      ja-Hrkt: |-
        いつも　おおきな　みみを　たてて
