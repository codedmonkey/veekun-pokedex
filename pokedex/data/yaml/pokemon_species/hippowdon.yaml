        ses adversaires.
    black-2:
      en: |-
        It is surprisingly quick to anger.
        It holds its mouth agape as a
        display of its strength.
    white-2:
      en: |-
        It is surprisingly quick to anger.
        It holds its mouth agape as a
        display of its strength.
    x:
      ja-Hrkt: |-
        おおきく　くちを　あけて　じぶんの
        つよさを　アピール。たいりょうの
        すなを　まきあげて　こうげきする。
      ja: |-
        大きく　口を　開けて
        自分の　強さを　アピール。
        大量の　砂を　巻き上げて　攻撃する。
      ko: |-
        크게 입을 벌려 자신의
        강함을 어필한다. 대량의
        모래를 일으켜 공격한다.
      en: |-
        It brandishes its gaping mouth in a display of
        fearsome strength. It raises vast quantities of sand
        while attacking.
      fr: |-
        Il exhibe sa force en ouvrant grand sa mâchoire,
        et attaque en soulevant des tornades de sable.
      de: |-
        Das weit aufgerissene Maul demonstriert seine
        Stärke. Es attackiert mit gebündeltem Sand.
      es: |-
        Hace gala de su fuerza abriendo su enorme boca.
        Para atacar levanta gran cantidad de arena.
      it: |-
        Mostra la propria forza spalancando le fauci.
        Attacca sollevando immani quantità di sabbia.
    'y':
      ja-Hrkt: |-
        たいないに　ためた　すなを　からだの
        あなから　ふきあげて　きょだいな
        たつまきを　つくり　こうげきする。
      ja: |-
        体内に　ためた　砂を　体の　穴から
        噴き上げて　巨大な
        竜巻を　作り　攻撃する。
      ko: |-
        체내에 모아둔 모래를 몸의
        구멍에서 뿜어 올려 거대한
        회오리를 만들어 공격한다.
      en: |-
        It blasts internally stored sand from ports on its
        body to create a towering twister for attack.
      fr: |-
        Il emmagasine du sable qu’il expulse en tornades par
        les pores de sa peau pour attaquer.
      de: |-
        Es wirbelt im Körper gespeicherten Sand durch
        Öffnungen und generiert so einen Sandwirbelsturm.
      es: |-
        Cuando ataca, expulsa arena almacenada en su interior
        para crear un gran tornado.
      it: |-
        Immagazzina sabbia all’interno del corpo e l’espelle
        con violenza dai pori, formando enormi vortici.
    omega-ruby:
      ja-Hrkt: |-
        おおきく　くちを　あけて　じぶんの
        つよさを　アピール。たいりょうの
        すなを　まきあげて　こうげきする。
      ja: |-
        大きく　口を　開けて
        自分の　強さを　アピール。
        大量の　砂を　巻き上げて　攻撃する。
      ko: |-
        크게 입을 벌려 자신의
        강함을 어필한다. 대량의
        모래를 일으켜 공격한다.
      en: |-
        It brandishes its gaping mouth in a display of
        fearsome strength. It raises vast quantities of sand
        while attacking.
      fr: |-
        Il exhibe sa force en ouvrant grand sa mâchoire, et attaque
        en soulevant des tornades de sable.
      de: |-
        Das weit aufgerissene Maul demonstriert seine Stärke.
        Es attackiert mit gebündeltem Sand.
      es: |-
        Hace gala de su fuerza abriendo su enorme boca. Para atacar
        levanta gran cantidad de arena.
      it: |-
        Mostra la propria forza spalancando le fauci.
        Attacca sollevando immani quantità di sabbia.
    alpha-sapphire:
      ja-Hrkt: |-
        たいないに　ためた　すなを　からだの
        あなから　ふきあげて　きょだいな
        たつまきを　つくり　こうげきする。
      ja: |-
        体内に　ためた　砂を　体の　穴から
        噴き上げて　巨大な
        竜巻を　作り　攻撃する。
      ko: |-
        체내에 모아둔 모래를 몸의
        구멍에서 뿜어 올려 거대한
        회오리를 만들어 공격한다.
      en: |-
        It blasts internally stored sand from ports on its
        body to create a towering twister for attack.
      fr: |-
        Il emmagasine du sable qu’il expulse en tornades par les pores
        de sa peau pour attaquer.
      de: |-
        Es wirbelt im Körper gespeicherten Sand durch Öffnungen
        und generiert so einen Sandwirbelsturm.
      es: |-
        Cuando ataca, expulsa arena almacenada en su interior para
        crear un gran tornado.
      it: |-
        Immagazzina sabbia all’interno del corpo e l’espelle
        con violenza dai pori, formando enormi vortici.
    sword:
      ja-Hrkt: |-
        からだの　あなには　たまに　いしが
        つまる。　いしを　とってくれるので
        イシズマイを　たいせつに　まもる。
      ja: |-
        体の　穴には　たまに　石が
        詰まる。　石を　取ってくれるので
        イシズマイを　大切に　守る。
      ko: |-
        몸에 난 구멍에는 가끔 돌이
        끼인다. 돌을 빼주기 때문에
        돌살이를 소중하게 지킨다.
      zh-Hant: |-
        偶爾會有石子卡在身體的孔洞裡。
        因為石居蟹會幫忙把石子拿出來，
        所以會用心地保護牠們。
      zh-Hans: |-
        偶尔会有石子卡在身体的孔洞里。
        因为石居蟹会帮忙把石子拿出来，
        所以会用心地保护它们。
      en: |-
        Stones can get stuck in the ports on their bodies.
        Dwebble help dislodge such stones, so
        Hippowdon look after these Pokémon.
      fr: |-
        Il prend grand soin des Crabicoque,
        car ils l’aident à se débarrasser des cailloux
        qui obstruent parfois les orifices de son corps.
      de: |-
        Manchmal bleiben in den Öffnungen in seinem
        Körper Steine stecken. Lithomith entfernen diese
        Steine, deswegen genießen sie seinen Schutz.
      es: |-
        Protege con celo a los Dwebble, ya que le
        ayudan a liberarse de las piedras que a veces
        le obturan los orificios del lomo.
      it: |-
        Protegge con zelo i Dwebble, perché lo aiutano
        a liberarsi delle pietre che a volte si incastrano
        nei pori che ha sul dorso.
    shield:
      ja-Hrkt: |-
        おこらせると　かなり　きょうぼう。
        とりこんだ　すなを　ふきだして
        すなあらしを　まきおこす。
      ja: |-
        怒らせると　かなり　狂暴。
        取りこんだ　砂を　噴き出して
        砂嵐を　巻き起こす。
      ko: |-
        화나게 하면 굉장히 흉포해진다.
        들이마신 모래를 내뿜어
        모래바람을 일으킨다.
      zh-Hant: |-
        生氣的時候非常凶暴。
        會噴出儲存在體內的
        沙子來引發沙塵暴。
      zh-Hans: |-
        生气的时候非常凶暴。
        会喷出储存在体内的
        沙子来引发沙尘暴。
      en: |-
        When roused to violence by its rage, it spews out
        the quantities of sand it has swallowed and
        whips up a sandstorm.
      fr: |-
        Il entre dans une violente colère quand
        on l’énerve : il expulse le sable qu’il a accumulé
        pour provoquer de véritables tempêtes.
      de: |-
        Wenn man es wütend macht, wird es rabiat. Es
        stößt aufgenommenen Sand aus und verursacht
        damit einen Sandsturm.
      es: |-
        Puede ser muy agresivo cuando se enfada.
        Provoca auténticas tempestades de arena al
        expeler la que ha tragado.
      it: |-
        Quando si arrabbia diventa molto violento
        ed espelle la sabbia che ha immagazzinato
        provocando tempeste di sabbia.
