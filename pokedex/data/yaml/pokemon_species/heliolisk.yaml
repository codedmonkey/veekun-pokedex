    sword:
      ja-Hrkt: |-
        かつて　ほろびた　さばくの　くにで
        だいじに　されていた。　ざいほうと
        ともに　ガラルちほうへ　やってきた。
      ja: |-
        かつて　滅びた　砂漠の　国で
        大事に　されていた。　財宝と
        ともに　ガラル地方へ　やってきた。
      ko: |-
        과거에 멸망한 사막 나라에서
        소중하게 여겼었다. 보물과 함께
        가라르지방에 오게 됐다.
      zh-Hant: |-
        在如今已滅亡的沙漠之國
        曾經是人們珍視的對象。
        和財寶一起來到了伽勒爾地區。
      zh-Hans: |-
        在如今已灭亡的沙漠之国
        曾经是人们珍视的对象。
        和财宝一起来到了伽勒尔地区。
      en: |-
        A now-vanished desert culture treasured these
        Pokémon. Appropriately, when Heliolisk came to
        the Galar region, treasure came with them.
      fr: |-
        Il était révéré dans un royaume des sables
        aujourd’hui disparu. Il est arrivé à Galar
        dans une cargaison de pierres précieuses.
      de: |-
        Es wurde in einem Wüstenreich, das vor langer
        Zeit unterging, sehr respektiert. Zusammen mit
        dessen Schätzen gelangte es in die Galar-Region.
      es: |-
        Venerado por una antigua civilización del
        desierto, ahora desaparecida, llegó a Galar
        junto a sus tesoros y reliquias.
      it: |-
        Un tempo era tenuto in grande considerazione
        in un paese desertico ormai scomparso. È giunto
        a Galar in casse contenenti tesori.
    shield:
      ja-Hrkt: |-
        えりまきを　ひろげて　たいようこうを
        あびると　だいとかいで　つかわれる
        でんきを　１ぴきで　はつでんする。
      ja: |-
        襟巻を　広げて　太陽光を
        浴びると　大都会で　使われる
        電気を　１匹で　発電する。
      ko: |-
        깃을 펼쳐 태양광을 받으면
        대도시에서 사용할 수 있는
        전기를 혼자서 발전한다.
      zh-Hant: |-
        如果展開頸傘沐浴陽光，
        單憑１隻光電傘蜥就能
        製造出大城市所需的電力。
      zh-Hans: |-
        如果展开颈伞沐浴阳光，
        单凭１只光电伞蜥就能
        制造出大城市所需的电力。
      en: |-
        One Heliolisk basking in the sun with its frill
        outspread is all it would take to produce enough
        electricity to power a city.
      fr: |-
        Lorsqu’il déploie sa collerette pour emmagasiner
        la lumière du soleil, il génère à lui seul assez
        d’électricité pour alimenter une grande ville.
      de: |-
        Stellt es seine kragenartigen Hautlappen auf und
        absorbiert damit Sonnenlicht, kann ein Elezard
        genug Strom für eine Großstadt produzieren.
      es: |-
        Al extender su gorguera y exponerse a la luz
        solar, genera la energía eléctrica suficiente para
        cubrir el consumo de una metrópoli entera.
      it: |-
        L’energia prodotta da un Heliolisk quando apre
        il suo collare in un luogo soleggiato è sufficiente
        a soddisfare il fabbisogno di una metropoli.
