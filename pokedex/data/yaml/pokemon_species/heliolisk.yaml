heliolisk:
  base_happiness: 50
  capture_rate: 75
  color: yellow
  egg_groups:
    - monster
    - dragon
  evolution_chain: helioptile
  evolves_from: helioptile
  flavor_text:
    x:
      ja-Hrkt: |-
        エリマキを　ひろげて　はつでんする。
        エレザード　１ぴきで　こうそうビルで
        ひつような　でんきを　つくれるのだ。
      ja: |-
        エリマキを　広げて　発電する。
        エレザード　１匹で　高層ビルで
        必要な　電気を　作れるのだ。
      ko: |-
        목의 깃을 펼쳐 발전한다.
        일레도리자드 1마리로 고층 빌딩에
        필요한 전기를 만들어 낼 수 있다.
      en: |-
        They flare their frills and generate energy.
        A single Heliolisk can generate sufficient
        electricity to power a skyscraper.
      fr: |-
        L’électricité que produit un seul Iguolta en agitant
        sa collerette suffit à alimenter un immeuble entier.
      de: |-
        Die Strommenge, die ein Elezard mit ausgebreiteten
        Hautlappen durch Umwandlung von Sonnenstrahlen
        erzeugt, genügt zur Versorgung eines Wolkenkratzers.
      es: |-
        Extiende su gorguera y genera energía eléctrica
        suficiente para cubrir el consumo de electricidad de
        un rascacielos entero.
      it: |-
        Può produrre energia elettrica aprendo il collare. Un
        solo Pokémon di questa specie sarebbe in grado di
        illuminare un intero grattacielo.
    'y':
      ja-Hrkt: |-
        でんきで　きんにくを　しげきすると
        １００メートルを　５びょうで　はしる
        きゃくりょくに　パワーアップする。
      ja: |-
        電気で　筋肉を　刺激すると
        １００メートルを　５秒で　走る
        脚力に　パワーアップする。
      ko: |-
        전기로 근육을 자극하면
        100m를 5초 만에 달리는
        다릿심으로 파워가 올라간다.
      en: |-
        It stimulates its muscles with electricity,
        boosting the strength in its legs and enabling
        it to run 100 yards in five seconds.
      fr: |-
        Il augmente sa puissance motrice en stimulant les
        muscles de ses pattes avec des décharges
        électriques. Il peut ainsi parcourir 100 m en 5 s.
      de: |-
        Es stimuliert seine Beinmuskulatur mit Strom,
        wodurch es ihm gelingt, 100 m in fünf Sekunden
        zurückzulegen.
      es: |-
        Si estimula sus músculos a base de electricidad, sus
        piernas alcanzan una potencia tal que puede recorrer
        100 metros en apenas cinco segundos.
      it: |-
        Stimolando i suoi muscoli con l’elettricità riesce
        a percorrere 100 m in 5 secondi.
    omega-ruby:
      ja-Hrkt: |-
        エリマキを　ひろげて　はつでんする。
        エレザード　１ぴきで　こうそうビルで
        ひつような　でんきを　つくれるのだ。
      ja: |-
