azurill:
  base_happiness: 50
  capture_rate: 150
  color: blue
  egg_groups:
    - no-eggs
  evolution_chain: marill
  evolves_from: ~
  flavor_text:
    ruby:
      en: |-
        AZURILL spins its tail as if it were a
        lasso, then hurls it far. The momentum
        of the throw sends its body flying, too.Using this unique action, one of these
        POKéMON managed to hurl itself a record
        33 feet.
    sapphire:
      en: |-
        AZURILL’s tail is large and bouncy.
        It is packed full of the nutrients this
        POKéMON needs to grow.AZURILL can be seen bouncing and
        playing on its big, rubbery tail.
    emerald:
      en: |-
        Its tail, which is packed with nutrition,
        is very bouncy like a rubber ball. On sunny
        days they gather at the edge of water and
        splash about for fun.
    firered:
      en: |-
        It battles by flinging around its tail,
        which is bigger than its body. The
        tail is a flotation device in water.
    leafgreen:
      en: |-
        It battles by flinging around its tail,
        which is bigger than its body. The
        tail is a flotation device in water.
    diamond:
      en: |-
        A Pokémon that lives by water.
        It moves quickly on land by
        bouncing on its big tail.
    pearl:
      en: |-
        Its tail is filled with nutrients
        necessary for growth. It plays
        by bouncing on its tail.
    platinum:
      en: |-
        Its tail bounces like a rubber ball.
        It flings that tail around to fight
        opponents bigger than itself.
    heartgold:
      en: |-
        Its tail is packed full of the
        nutrients it needs to grow.
    soulsilver:
      en: |-
        Its tail is packed full of the
        nutrients it needs to grow.
    black:
      en: |-
        Its tail bounces like a rubber ball.
        It flings that tail around to fight
        opponents bigger than itself.
      fr: |-
        Sa queue est plus rebondissante
        qu’une balle du même nom. C’est
        aussi une massue très puissante.
    white:
      en: |-
        Its tail bounces like a rubber ball.
        It flings that tail around to fight
        opponents bigger than itself.
      fr: |-
        Sa queue est plus rebondissante
        qu’une balle du même nom. C’est
        aussi une massue très puissante.
    black-2:
      en: |-
        It swings its large, nutrient-filled
        tail around to fight opponents
        bigger than itself.
    white-2:
      en: |-
        It swings its large, nutrient-filled
        tail around to fight opponents
        bigger than itself.
    x:
      ja-Hrkt: |-
        おおきな　しっぽに　のって　はずむと
        ちじょうでは　はやく　いどうできる。
        みずべで　くらす　ポケモン。
      ja: |-
        大きな　尻尾に　乗って　弾むと
        地上では　速く　移動できる。
        水辺で　暮らす　ポケモン。
      ko: |-
        큰 꼬리에 타고 튀면
        지상에서 빨리 이동할 수 있다.
        물가에서 사는 포켓몬이다.
      en: |-
        A Pokémon that lives by water. It moves quickly on
        land by bouncing on its big tail.
      fr: |-
        Un Pokémon qui vit près de l’eau. Au sol, il se
        déplace rapidement en rebondissant sur sa grosse
        queue.
      de: |-
        Dieses Pokémon lebt am Wasser. An Land bewegt
        es sich schnell, indem es auf seinem großen
        Schweif hüpft.
      es: |-
        Vive cerca del agua. En la tierra se mueve muy rápido
        botando sobre su gran cola.
      it: |-
        Pokémon che vive nell’acqua. Si muove rapidamente
        sulla terraferma saltellando sulla grossa coda.
    'y':
      ja-Hrkt: |-
        えいようが　つまった　おおきな
        しっぽを　ふりまわして　じぶんより
        てごわい　あいてにも　たちむかう。
      ja: |-
        栄養が　つまった　大きな
        尻尾を　振り回して　自分より
        手強い　相手にも　たちむかう。
      ko: |-
        영양이 채워진 큰
        꼬리를 휘두르며 자신보다
        벅찬 상대에게도 맞선다.
      en: |-
        It swings its large, nutrient-filled tail around to fight
        opponents bigger than itself.
      fr: |-
        Il fait tournoyer sa queue, connue pour ses qualités
        nutritives, pour l’abattre comme une puissante massue
        sur l’ennemi.
      de: |-
        Es legt sich mit starken Gegnern an, indem es seinen
        großen, mit Nährstoffen gefüllten Schweif
        umherschwingt.
      es: |-
        Para hacer frente a oponentes más grandes que él,
        agita su gran cola, llena de nutrientes, de un lado a
        otro.
      it: |-
        Si scaglia contro avversari più forti di lui agitando la
        grande coda in cui conserva le sostanze di cui si nutre.
    omega-ruby:
      ja-Hrkt: |-
        なげなわの　ようりょうで　しっぽを　ふりまわし
        なげた　ときの　ちからで　とんでいく。
        さいこう　１０メートル　とんだ　きろくが　ある。
      ja: |-
        投げ縄の　要領で　尻尾を　振り回し
        投げた　ときの　力で　飛んでいく。
        最高　１０メートル　飛んだ　記録が　ある。
      ko: |-
        올가미를 쓰듯 꼬리를 휘휘 돌려
        던질 때의 힘으로 날아간다.
        최고 10m를 날아간 기록이 있다.
      en: |-
        Azurill spins its tail as if it were a lasso, then hurls it far.
        The momentum of the throw sends its body flying, too.
        Using this unique action, one of these Pokémon managed to
        hurl itself a record 33 feet.
      fr: |-
        Azurill fait tournoyer sa queue comme un lasso et l’envoie
        si fort que le reste de son corps est également projeté.
        Le record de lancer de ce Pokémon est actuellement de 10 m.
      de: |-
        Azurill schleudert seinen Schweif wie ein Lasso weit aus und
        fliegt dann selbst hinterher. Ein Azurill hat es auf diese Weise
        geschafft, die Rekordweite von 10 m zurückzulegen.
      es: |-
        Azurill enrolla la cola como si fuera un lazo y la despliega a
        continuación todo lo que puede. De esta forma, un Azurill
        llegó a lanzarse a sí mismo hasta 10 m.
      it: |-
        Azurill fa roteare la propria coda come un lazo, poi la scaglia
        lontano. Nel momento del lancio prende il volo anche
        il suo corpo. Grazie a questa tecnica unica, uno di questi
        Pokémon è riuscito a lanciarsi a 10 m di distanza.
    alpha-sapphire:
      ja-Hrkt: |-
        しっぽには　せいちょうする　ために　ひつような
        えいようが　たっぷり　つまっているぞ。
        だんりょくの　ある　しっぽに　のって　あそぶ。
      ja: |-
        尻尾には　成長する　ために　必要な
        栄養が　たっぷり　詰まっているぞ。
        弾力の　ある　尻尾に　乗って　遊ぶ。
      ko: |-
        꼬리에는 성장을 위해 필요한
        영양이 가득 채워져 있다.
        탄력 있는 꼬리에 올라가 논다.
      en: |-
        Azurill’s tail is large and bouncy. It is packed full of the
        nutrients this Pokémon needs to grow. Azurill can be seen
        bouncing and playing on its big, rubbery tail.
      fr: |-
        La grande queue d’Azurill est élastique. Elle lui permet
        de stocker les nutriments nécessaires à sa croissance.
        Parfois, on voit Azurill s’amuser à rebondir sur sa queue
        élastique.
      de: |-
        Azurills Schweif ist lang und federnd. Er ist vollgepackt
        mit Nährstoffen, die dieses Pokémon zum Wachsen braucht.
        Man kann es häufig dabei beobachten, wie es auf seinem
        gummiartigen Schweif umherhüpft und spielt.
      es: |-
        Azurill tiene una especie de pelota en la cola, que contiene los
        nutrientes necesarios para crecer. Es fácil ver a este Pokémon
        saltando y jugueteando sentado encima de la misma.
      it: |-
        Azurill è dotato di una coda lunga ed elastica. Inoltre, è ricca
        di sostanze nutritive indispensabili per la sua sopravvivenza.
        Spesso lo si vede saltellare e giocare sulla coda gommosa
        e molleggiata.
    sword:
      ja-Hrkt: |-
        ゴムまりのように　はずむ　しっぽの
        たまには　せいちょうに　ひつような
        えいようが　たっぷり　つまっている。
      ja: |-
        ゴムまりのように　弾む　しっぽの
        玉には　成長に　必要な　栄養が
        たっぷり　詰まっている。
      ko: |-
        고무공처럼 튀는 꼬리의 구슬에는
        성장에 필요한 영양분이
        가득 들어 있다.
      zh-Hant: |-
        尾巴的球狀部分能像皮球
        那樣彈跳，裡面滿滿都是
        牠在成長時所需的營養。
      zh-Hans: |-
        球形的尾巴拥有如同
        橡胶球一般的弹性，里面
        贮满了它成长所需的营养。
      en: |-
        The ball on Azurill’s tail bounces like a rubber
        ball, and it’s full of the nutrients the Pokémon
        needs to grow.
      fr: |-
        La boule située au bout de sa queue rebondit
        telle une balle de caoutchouc. Elle regorge des
        nutriments nécessaires à la croissance d’Azurill.
      de: |-
        Die Kugel an seinem Schweif kann wie ein
        Gummiball hüpfen und steckt voller Nährstoffe,
        die Azurill zum Wachsen braucht.
      es: |-
        La bola que tiene en la cola rebota como una
        pelota de goma y está repleta de los nutrientes
        que este Pokémon necesita para crecer.
      it: |-
        Nella sfera all’estremità della coda, che rimbalza
        come una palla, sono conservate le sostanze
        nutritive necessarie per la crescita del Pokémon.
    shield:
      ja-Hrkt: |-
        おとなしい　ポケモンだが　おこると
        しっぽの　おおきな　たまを　ぶんぶん
        ふりまわして　たたきつけてくるぞ。
      ja: |-
        おとなしい　ポケモンだが　怒ると
        しっぽの　大きな　玉を　ぶんぶん
        振りまわして　叩きつけてくるぞ。
      ko: |-
        얌전한 포켓몬이지만
        화가 나면 꼬리의 큰 공을 붕붕
        휘두르다 세차게 내리친다.
      zh-Hant: |-
        雖然是個性溫順的寶可夢，
        但生氣時就會大力揮甩
        尾巴上的大球來擊打對手。
      zh-Hans: |-
        虽然是种性情温顺的宝可梦，
        但生起气来，便会嗖嗖地挥舞起
        尾巴上的大球来猛烈击打对手。
      en: |-
        Although Azurill are normally docile, an angry
        one will swing around the big ball on its tail and
        try to smash its opponents.
      fr: |-
        C’est un Pokémon docile, mais si on l’énerve,
        il n’hésite pas à frapper en faisant tournoyer
        la grosse boule au bout de sa queue.
      de: |-
        Dieses Pokémon ist zwar sanftmütig, doch wenn
        es wütend wird, schwingt es die große Kugel an
        seinem Schweif und schlägt damit zu.
      es: |-
        Es un Pokémon tranquilo, pero, si se le hace
        enfadar, atacará utilizando la enorme bola que
        tiene en la cola.
      it: |-
        È un Pokémon docile, ma se si arrabbia attacca
        agitando la grossa palla che ha sulla coda.
