spectrier:
  base_happiness: 35
  capture_rate: 3
  color: black
  egg_groups:
    - no-eggs
  evolution_chain: spectrier
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        しかく　いがいの　ごかんを　つかい
        ようすを　さぐる。　けられたものは
        たましいを　ぬかれてしまうという。
      ja: |-
        視覚　以外の　五感を　使い
        様子を　探る。　蹴られたものは
        魂を　抜かれてしまうという。
      ko: |-
        시각 이외의 오감을 사용해서
        동태를 살핀다. 발에 차인 자는
        영혼이 빠져나가 버린다고 한다.
      zh-Hant: |-
        會利用視覺之外的感官
        去探測周圍的狀況。據說
        被牠踢到時靈魂就會出竅。
      zh-Hans: |-
        使用视觉以外的五感探索
        周围的情况。据说如果
        被它踢到，就会灵魂出窍。
      en: |-
        It probes its surroundings with all its senses save
        one—it doesn’t use its sense of sight. Spectrier’s
        kicks are said to separate soul from body.
      fr: |-
        Il se sert de tous ses sens pour se repérer, sauf
        celui de la vue. Un coup de ses sabots suffirait
        à séparer l’âme du corps de sa cible.
      de: |-
        Um sein Umfeld zu erkunden, nutzt es all seine
        Sinne – bis auf den Sehsinn. Wer von Phantoross
        getreten wird, verliert angeblich seine Seele.
      es: |-
        Examina su entorno con todos los sentidos, salvo
        la vista. Se dice que sus coces son capaces de
        robarle el alma a quien las recibe.
      it: |-
        Sonda l’area circostante con tutti i suoi sensi,
        esclusa la vista. Si narra che chi subisce i suoi
        calci venga privato dell’anima.
    shield:
      ja-Hrkt: |-
        やみよを　かけぬけ　ねているものの
        せいめいエネルギーを　すいとる。
        こどくと　せいじゃくを　このむ。
      ja: |-
        闇夜を　駆けぬけ　寝ているものの
        生命エネルギーを　吸い取る。
        孤独と　静寂を　好む。
      ko: |-
        어두운 밤을 달리며 잠든 자의
        생명 에너지를 흡수한다.
        고독과 정적을 좋아한다.
      zh-Hant: |-
        在漆黑的夜裡奔馳，吸取
        正在睡覺的生物的生命能量。
        喜愛孤獨與寂靜。
      zh-Hans: |-
        在黑暗的夜晚中奔跑，吸取
        正在睡觉的生物的生命能量。
        喜欢孤独和静寂。
      en: |-
        As it dashes through the night, Spectrier absorbs
        the life-force of sleeping creatures. It craves
        silence and solitude.
      fr: |-
        Ce Pokémon friand de silence et de solitude
        galope à travers les ténèbres nocturnes
        et aspire l’énergie vitale des êtres endormis.
      de: |-
        Es galoppiert durch die finstere Nacht und
        absorbiert die Lebensenergie der Schlafenden.
        Phantoross bevorzugt Einsamkeit und Stille.
      es: |-
        Amante de la quietud y la soledad, galopa por
        las tinieblas nocturnas absorbiendo la energía
        vital de toda criatura que esté durmiendo.
      it: |-
        Galoppa nelle notti buie assorbendo l’energia
        vitale delle creature addormentate.
        Ama la solitudine e la quiete.
