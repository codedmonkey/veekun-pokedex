foongus:
  base_happiness: 50
  capture_rate: 190
  color: white
  egg_groups:
    - plant
  evolution_chain: foongus
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        It lures people in with its Poké Ball
        pattern, then releases poison spores.
        Why it resembles a Poké Ball is unknown.
      fr: |-
        Grâce à sa ressemblance mystérieuse
        avec une Poké Ball, il attire ses ennemis
        et relâche des spores empoisonnées.
    white:
      en: |-
        For some reason, this Pokémon resembles
        a Poké Ball. They release poison spores
        to repel those who try to catch them.
      fr: |-
        Pour une raison inconnue, il ressemble à
        une Poké Ball. Il repousse ses ennemis
        à l’aide de spores empoisonnées.
    black-2:
      en: |-
        It lures Pokémon with its pattern
        that looks just like a Poké Ball
        then releases poison spores.
    white-2:
      en: |-
        It lures Pokémon with its pattern
        that looks just like a Poké Ball
        then releases poison spores.
    x:
      ja-Hrkt: |-
        モンスターボールに　にた　もようで
        さそい　どくほうしを　ふきかける。
        なぜ　にているかは　なぞである。
      ja: |-
        モンスターボールに　似た　模様で
        誘い　毒胞子を　吹きかける。
        なぜ　似ているかは　ナゾである。
      ko: |-
        몬스터볼을 닮은 무늬로
        유인한 후 독 포자를 뿌려댄다.
        왜 닮았는지는 불가사의다.
      en: |-
        It lures people in with its Poké Ball pattern, then
        releases poison spores. Why it resembles a
        Poké Ball is unknown.
      fr: |-
        Grâce à sa ressemblance mystérieuse avec une
        Poké Ball, il attire ses ennemis et relâche des spores
        empoisonnées.
      de: |-
        Fällt ein Trainer auf sein Äußeres herein,
        das komischerweise einem Pokéball ähnelt,
        besprüht es ihn mit Giftsporen.
      es: |-
        Gracias a su misterioso parecido a una Poké Ball, atrae
        a sus presas y lanza rápidamente esporas de veneno.
      it: |-
        Simile a una Poké Ball, adesca i nemici e sparge
        spore velenose. Da dove venga questa somiglianza
        è un vero mistero.
    'y':
      ja-Hrkt: |-
        モンスターボール　そっくりの
        もようで　ポケモンを　さそいこみ
        どくのほうしを　ふきかけてくる。
      ja: |-
        モンスターボール　そっくりの
        模様で　ポケモンを　誘いこみ
        毒の胞子を　吹きかけてくる。
      ko: |-
        몬스터볼과 똑 닮은
        무늬로 포켓몬을 유인해
        독 포자를 뿌린다.
      en: |-
        It lures Pokémon with its pattern that looks just like
        a Poké Ball, then releases poison spores.
      fr: |-
        Son apparence de Poké Ball trompe ses ennemis,
        qu’il étourdit à l’aide de ses spores empoisonnées.
      de: |-
        Es ist gemustert wie ein Pokéball. Es lockt damit
        andere Pokémon an, um sie dann mit Giftsporen
        zu besprühen.
      es: |-
        Atraen a otros Pokémon gracias a su similitud con una
        Poké Ball y los atacan expulsando esporas venenosas.
      it: |-
        Attira a sé altri Pokémon con la sua forma a
        Poké Ball e soffia su di loro le sue spore velenose.
    omega-ruby:
      ja-Hrkt: |-
        モンスターボールに　にた　もようで
        さそい　どくほうしを　ふきかける。
        なぜ　にているかは　なぞである。
      ja: |-
        モンスターボールに　似た　模様で
        誘い　毒胞子を　吹きかける。
        なぜ　似ているかは　ナゾである。
      ko: |-
        몬스터볼을 닮은 무늬로
        유인한 후 독 포자를 뿌려댄다.
        왜 닮았는지는 불가사의다.
      en: |-
        It lures people in with its Poké Ball pattern, then
        releases poison spores. Why it resembles a
        Poké Ball is unknown.
      fr: |-
        Grâce à sa ressemblance mystérieuse avec une Poké Ball,
        il attire ses ennemis et relâche des spores empoisonnées.
      de: |-
        Fällt ein Trainer auf sein Äußeres herein, das komischerweise
        einem Pokéball ähnelt, besprüht es ihn mit Giftsporen.
      es: |-
        Gracias a su misterioso parecido a una Poké Ball, atrae a sus
        presas y lanza rápidamente esporas de veneno.
      it: |-
        Simile a una Poké Ball, adesca i nemici e sparge
        spore velenose. Da dove venga questa somiglianza
        è un vero mistero.
    alpha-sapphire:
      ja-Hrkt: |-
        モンスターボール　そっくりの
        もようで　ポケモンを　さそいこみ
        どくのほうしを　ふきかけてくる。
      ja: |-
        モンスターボール　そっくりの
        模様で　ポケモンを　誘いこみ
        毒の胞子を　吹きかけてくる。
      ko: |-
        몬스터볼과 똑 닮은
        무늬로 포켓몬을 유인해
        독 포자를 뿌린다.
      en: |-
        It lures Pokémon with its pattern that looks just like
        a Poké Ball, then releases poison spores.
      fr: |-
        Son apparence de Poké Ball trompe ses ennemis, qu’il étourdit
        à l’aide de ses spores empoisonnées.
      de: |-
        Es ist gemustert wie ein Pokéball. Es lockt damit andere
        Pokémon an, um sie dann mit Giftsporen zu besprühen.
      es: |-
        Atraen a otros Pokémon gracias a su similitud con una
        Poké Ball y los atacan expulsando esporas venenosas.
      it: |-
        Attira a sé altri Pokémon con la sua forma a Poké Ball e soffia
        su di loro le sue spore velenose.
    sword:
      ja-Hrkt: |-
        モンスターボールに　よく　にた
        もようの　いみや　りゆうは
        いまだに　だれも　わからない。
      ja: |-
        モンスターボールに　よく　似た
        模様の　意味や　理由は
        いまだに　だれも　わからない。
      ko: |-
        몬스터볼을 많이 닮았는데
        그 의미와 이유는
        아직 아무도 모른다.
      zh-Hant: |-
        酷似精靈球的花紋
        究竟有什麼意義和理由，
        至今仍沒有人能了解。
      zh-Hans: |-
        关于它酷似精灵球的
        花纹的意义和理由，
        至今都无人知晓。
      en: |-
        No one knows what the Poké Ball–like pattern on
        Foongus means or why Foongus has it.
      fr: |-
        On ignore toujours l’origine ou la signification
        de sa forte ressemblance avec une Poké Ball.
      de: |-
        Bis heute kann niemand genau sagen, wieso
        Tarnpignon ein Pokéball-Muster aufweisen und
        welchen Zweck dies erfüllt.
      es: |-
        Todavía no se ha encontrado ninguna explicación
        ni razón para su gran parecido a las Poké Balls.
      it: |-
        A tutt’oggi nessuno è a conoscenza
        del significato o dell’origine del motivo simile
        a una Poké Ball che sfoggia.
    shield:
      ja-Hrkt: |-
        りょうてから　ふきだす　ほうしは
        もうどくだが　よく　かわかせば
        おなかの　くすりに　なると　いう。
      ja: |-
        両手から　吹き出す　胞子は
        猛毒だが　よく　乾かせば
        お腹の　薬に　なるという。
      ko: |-
        양손에서 내뿜는 포자는
        맹독이지만 잘 말리면
        복통약이 된다고 한다.
      zh-Hant: |-
        從雙臂噴出的孢子是劇毒，
        但據說在徹底乾燥之後，
        可以作為腸胃藥使用。
      zh-Hans: |-
        从双手喷出的孢子虽然
        含有剧毒，但据说彻底干燥后
        可以用作治疗肠胃的药。
      en: |-
        The spores released from this Pokémon’s hands
        are highly poisonous, but when thoroughly dried,
        the spores can be used as stomach medicine.
      fr: |-
        Les spores qu’il libère de ses mains sont
        très toxiques, mais si on les sèche bien,
        elles peuvent soulager les maux de ventre.
      de: |-
        Die Sporen, die es aus seinen zwei Gliedmaßen
        versprüht, sind sehr giftig. In getrockneter Form
        eignen sie sich jedoch als Magenmedizin.
      es: |-
        Las esporas que expulsa por las extremidades
        son altamente tóxicas, pero, si se secan bien,
        sirven como remedio estomacal.
      it: |-
        Le spore che rilascia dalle mani sono molto
        velenose, ma se sono essiccate pare che possano
        essere usate come farmaco gastrointestinale.
