      fr: |-
        Il fonce sur sa proie à plus de 100 km/h.
        Mais il ne peut pas dévier sa course
        et loupe souvent sa cible.
    black-2:
      en: |-
        It charges prey at speeds over
        60 mph. However, because it can
        only run straight, it often fails.
    white-2:
      en: |-
        It charges prey at speeds over
        60 mph. However, because it can
        only run straight, it often fails.
    x:
      ja-Hrkt: |-
        まっすぐ　はしる　スピードは
        じそく１００キロを　かるく　こえる。
        まがった　みちは　とても　にがて。
      ja: |-
        まっすぐ　走る　スピードは
        時速１００キロを　軽く　超える。
        曲がった　道は　とても　苦手。
      ko: |-
        똑바로 달리는 스피드는
        시속 100km를 가볍게 넘는다.
        휘어진 길은 매우 서툴다.
      en: |-
        When running in a straight line, it can easily top
        60 miles an hour. It has a tough time with
        curved roads.
      fr: |-
        Il peut courir en ligne droite à plus de 100 km/h.
        Hélas, il n’est pas doué pour prendre les virages.
      de: |-
        Auf gerader Strecke erreicht es mühelos 100 km/h.
        Nur die Kurven bereiten ihm große Schwierigkeiten.
      es: |-
        En línea recta corre a algo más de 100 km/h, pero no
        es tan hábil si hay curvas de por medio.
      it: |-
        Quando corre in rettilineo può raggiungere
        i 100 km/h, ma le curve non sono il suo forte.
    'y':
      ja-Hrkt: |-
        じそく１００キロで　えものに
        おそいかかるが　まっすぐにしか
        はしれないので　しっぱいも　おおい。
      ja: |-
        時速１００キロで　獲物に
        襲いかかるが　真っ直ぐにしか
        走れないので　失敗も　多い。
      ko: |-
        시속 100km로 먹이를
        덮치지만 똑바로밖에 달릴 수
        없어서 실패할 때도 많다.
      en: |-
        It charges prey at speeds over 60 mph. However,
        because it can only run straight, it often fails.
      fr: |-
        Il fonce sur sa proie à plus de 100 km/h. Mais il
        ne peut pas dévier sa course et loupe souvent sa
        cible.
      de: |-
        Es stürzt sich mit 100 km/h auf Beute. Aber es kann
        nur geradeaus laufen und die Jagd misslingt oft.
      es: |-
        Carga contra sus enemigos a más de 100 km/h.
        Como solo va en línea recta, falla a menudo.
      it: |-
        Carica la preda a una velocità di 100 km/h. Ma dal
        momento che va solo dritto, sbaglia spesso.
    omega-ruby:
      ja-Hrkt: |-
        まっすぐに　つっぱしり　しょうがいぶつが　ある
        ときは　ちょっかくに　おれまがって　よける。
        ゆるやかに　カーブした　みちが　とても　にがて。
      ja: |-
        真っ直ぐに　突っ走り　障害物が　ある
        ときは　直角に　折れ曲がって　避ける。
        緩やかに　カーブした　道が　とても　苦手。
      ko: |-
        똑바로 힘껏 달리며 장애물이 있을
        때는 직각으로 꺾어서 피한다.
        완만하게 굽은 길은 달리는 데 매우 서툴다.
      en: |-
        Linoone always runs full speed and only in straight lines.
        If facing an obstacle, it makes a right-angle turn to evade it.
        This Pokémon is very challenged by gently curving roads.
      fr: |-
        Linéon court très vite et toujours en ligne droite.
        Si un obstacle survient, il l’évite en prenant un angle droit.
        Ce Pokémon a beaucoup de mal à suivre les routes
        légèrement courbées.
      de: |-
        Geradaks rennt immer mit vollem Tempo und nie im Zickzack,
        sondern nur gerade. Wenn ihm ein Hindernis im Weg ist, läuft
        es rechtwinklig daran vorbei. Für dieses Pokémon stellen
        leichte Kurven eine große Herausforderung dar.
      es: |-
        Linoone siempre corre todo lo rápido que puede y solo en
        línea recta. Si encuentra un obstáculo en el camino, girará
        en ángulo recto para esquivarlo. Correr bien por caminos
        tortuosos es todo un reto para él.
      it: |-
        Linoone è solito correre a tutta velocità e sempre in linea
        retta. Davanti a un ostacolo fa una curva ad angolo retto
        per evitarlo. Questo Pokémon si trova in difficoltà su percorsi
        con curve poco accentuate.
    alpha-sapphire:
      ja-Hrkt: |-
        えもの　めがけて　いっちょくせんに　つっぱしる。
        じそく　１００キロを　こえる　スピードを　だすが
        いちど　きゅうていし　しないと　まがれないのだ。
      ja: |-
        獲物　目掛けて　一直線に　突っ走る。
        時速　１００キロを　超える　スピードを　出すが
        一度　急停止　しないと　曲がれないのだ。
      ko: |-
        먹이를 쫓아 일직선으로 질주한다.
        시속 100km를 넘는 스피드를 내지만
        한 번 급정지하지 않으면 꺾을 수 없다.
      en: |-
        When hunting, Linoone will make a beeline straight for the
        prey at a full run. While this Pokémon is capable of topping
        60 mph, it has to come to a screeching halt before it can turn.
      fr: |-
        Lorsqu’il chasse, Linéon fonce toujours tout droit sur sa proie
        à pleine vitesse. Bien que ce Pokémon puisse atteindre
        100 km/h, il doit s’arrêter en catastrophe avant de pouvoir
        tourner.
      de: |-
        Auf der Jagd rennt Geradaks so schnell es kann schnurstracks
        hinter seiner Beute her. Es erreicht zwar über 100 km/h, muss
        aber erst aus vollem Lauf zum Stehen kommen, bevor es die
        Richtung wechseln kann.
      es: |-
        Cuando Linoone caza, va directo hacia su presa a toda
        velocidad. Si por un lado puede alcanzar 100 km/h, por
        otro tiene que frenar en seco para poder cambiar de sentido.
      it: |-
        Quando caccia, Linoone si lancia rapido sulla preda. Infatti
        riesce a raggiungere la velocità di 100 km/h ma prima di
        girare è costretto a fermarsi in modo brusco e repentino.
    sword:
      ja-Hrkt: |-
        つよくて　コシの　ある　たいもう。
        ぬけげで　つくられた　シェービング
        ブラシは　ちょうこうきゅうひん。
      ja: |-
        強くて　コシの　ある　体毛。
        抜け毛で　作られた　シェービング
        ブラシは　超高級品。
      ko: |-
        강하고 탄력 있는 털을 가졌다.
        빠진 털로 만든 면도솔은
        최고의 명품이다.
      zh-Hant: |-
        體毛有著良好的韌度與質感。
        用牠身上掉下的毛製成的
        刮鬍刷是最上等的高級貨。
      zh-Hans: |-
        体毛拥有良好的韧度与质感。
        用它身上掉下来的毛制成的
        剃须刷是最上等的高级货。
      en: |-
        Its fur is strong and supple. Shaving brushes
        made with shed Linoone hairs are highly prized.
      fr: |-
        Son pelage est à la fois solide et flexible.
        Les blaireaux conçus à partir des poils de sa mue
        sont des produits de très grand luxe.
      de: |-
        Sein Fell ist kräftig und fest. Rasierpinsel, die aus
        seinen ausgefallenen Haaren hergestellt werden,
        sind absolute Luxusartikel.
      es: |-
        Posee un pelaje fuerte y firme. Las brochas de
        afeitar cuyas cerdas están hechas con el pelo
        que se le desprende son un producto de lujo.
      it: |-
        Ha un pelo forte e resistente. I pennelli da barba
        realizzati con le setole perse da questo Pokémon
        sono molto pregiati.
    shield:
      ja-Hrkt: |-
        バツグンの　しゅんぱつりょくと
        するどいツメで　エモノを　しとめる。
        まがった　みちを　はしるのは　ヘタ。
      ja: |-
        抜群の　瞬発力と
        するどいツメで　獲物を　しとめる。
        曲がった　道を　走るのは　下手。
      ko: |-
        뛰어난 순발력과 예리한
        발톱으로 먹이의 숨통을 끊는다.
        굽은 길을 달리는 게 서툴다.
      zh-Hant: |-
        用自己超群的爆發力
        和銳利的爪子來制服獵物。
        不擅長在彎曲的道路上奔跑。
      zh-Hans: |-
        用自己超群的爆发力
        和锐利的爪子来制服猎物。
        不擅长在弯曲的道路上奔跑。
      en: |-
        It uses its explosive speed and razor-sharp claws
        to bring down prey. Running along winding
        paths is not its strong suit.
      fr: |-
        Il se sert de sa force de propulsion et de
        ses griffes aiguisées pour achever ses proies.
        Il a du mal à courir sur les routes sinueuses.
      de: |-
        Es erlegt seine Beute mit schnellen Bewegungen
        und scharfen Klauen. Kurven zu nehmen bereitet
        ihm aber große Schwierigkeiten.
      es: |-
        Abate a sus presas con su vertiginosa velocidad
        y sus afiladas garras. Los trayectos sinuosos
        merman notablemente su capacidad para correr.
      it: |-
        Si serve della sua straordinaria forza esplosiva
        e dei suoi artigli affilati per abbattere la preda.
        Correre lungo strade tortuose non è il suo forte.
