  flavor_text:
    sword:
      ja-Hrkt: |-
        ガラルの　いたるところに　いる。
        さゆうの　ほっぺに　きのみを
        たくわえていないと　ふあん。
      ja: |-
        ガラルの　いたるところに　いる。
        左右の　ほっぺに　木の実を
        蓄えていないと　不安。
      ko: |-
        가라르의 여기저기에 있다.
        양쪽 볼에 나무열매를
        비축해두지 않으면 불안해한다.
      zh-Hant: |-
        在伽勒爾隨處可見。
        如果不往兩邊的頰囊裡
        塞滿樹果，就會感到不安。
      zh-Hans: |-
        在伽勒尔随处可见。
        如果不往两边的颊囊里
        塞满树果，就会感到不安。
      en: |-
        Found throughout the Galar region, this Pokémon
        becomes uneasy if its cheeks are ever completely
        empty of berries.
      fr: |-
        On le trouve partout à Galar. S’il n’a pas de Baies
        en réserve dans ses deux joues, il devient anxieux.
      de: |-
        Es ist überall in der Galar-Region anzutreffen.
        Hat es keine Beeren, die es in seinen beiden
        Backen horten kann, wird es unruhig.
      es: |-
        Este Pokémon se encuentra por todo Galar.
        No se queda tranquilo hasta que tiene ambos
        carrillos atiborrados de bayas.
      it: |-
        Si trova ovunque a Galar. Se non ha una scorta
        di bacche dentro le guance, si fa prendere
        dall’ansia.
    shield:
      ja-Hrkt: |-
        つねに　きのみを　くっているので
        みかけいじょうに　タフ。　きのみを
        ねらって　はたけに　あらわれる。
      ja: |-
        つねに　木の実を　食っているので
        見かけ以上に　タフ。　木の実を
        狙って　畑に　現れる。
      ko: |-
        항상 나무열매를 먹고 있어
        보기보다 튼튼하다. 나무열매를
        노리고 밭에 출몰한다.
      zh-Hant: |-
        由於牠無論何時都在吃樹果，
        使得牠比外表看起來還要頑強。
        會出現在田地裡尋找樹果。
      zh-Hans: |-
        由于它无论何时都在吃树果，
        使得它比外表看起来还要顽强。
        会出现在田地里寻找树果。
      en: |-
        It eats berries nonstop—a habit that has made
        it more resilient than it looks. It’ll show up on
        farms, searching for yet more berries.
      fr: |-
        Comme il mange tout le temps des Baies, il est
        plus costaud qu’il n’en a l’air. Il parcourt les
        champs à la recherche de sa précieuse denrée.
      de: |-
        Da es unentwegt Beeren futtert, ist es zäher als
        es aussieht. Man sieht es oft auf Feldern, wo es
        nach Beeren sucht.
      es: |-
        Siempre están comiendo bayas, por lo que son
        más robustos de lo que aparentan. Frecuentan
        los huertos en busca de su preciado manjar.
      it: |-
        Per via dell’abitudine di mangiare senza sosta,
        è più forte di quanto possa sembrare. Fa incetta
        di bacche nei campi coltivati.
