    alpha-sapphire:
      ja-Hrkt: |-
        よろいに　しこまれた　つるぎの
        ひとふりで　あいてを　たおす。
        ひとにらみで　てきを　だまらせる。
      ja: |-
        よろいに　仕込まれた　剣の　一振りで
        相手を　倒す。
        ひとにらみで　敵を　黙らせる。
      ko: |-
        갑옷에 내장된 검으로 한칼에
        상대를 제압한다.
        눈빛만으로 상대를 침묵시킨다.
      en: |-
