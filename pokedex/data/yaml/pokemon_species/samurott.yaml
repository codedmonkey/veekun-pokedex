samurott:
  base_happiness: 70
  capture_rate: 45
  color: blue
  egg_groups:
    - ground
  evolution_chain: oshawott
  evolves_from: dewott
  flavor_text:
    black:
      en: |-
        One swing of the sword incorporated in
        its armor can fell an opponent. A simple
        glare from one of them quiets everybody.
      fr: |-
        Il peut terrasser ses ennemis d’un coup
        de la lame enchâssée dans son armure,
        et les faire taire d’un seul regard.
    white:
      en: |-
        Part of the armor on its anterior legs
        becomes a giant sword. Its cry alone
        is enough to intimidate most enemies.
      fr: |-
        Les pièces d’armure sur ses pattes
        antérieures sont de grandes lames.
        Un simple cri peut intimider son ennemi.
    black-2:
      en: |-
        In the time it takes a foe to blink,
        it can draw and sheathe the seamitars
        attached to its front legs.
    white-2:
      en: |-
        In the time it takes a foe to blink,
        it can draw and sheathe the seamitars
        attached to its front legs.
    x:
      ja-Hrkt: |-
        てきが　まばたきする　あいだに
        まえあしに　ついた　アシガタナで
        あいてを　きりつけ　もとにもどせる。
      ja: |-
        敵が　瞬きする　あいだに
        前足に　ついた　アシガタナで
        相手を　切りつけ　元に戻せる。
      ko: |-
        상대가 눈을 깜빡이는 동안에
        앞다리에 붙어 있는 각검으로
        상대를 베고 원래대로 되돌린다.
      en: |-
        In the time it takes a foe to blink, it can draw and
        sheathe the seamitars attached to its front legs.
      fr: |-
        Il dissimule de grandes lames qu’il dégaine en un
        éclair des fourreaux de ses pattes antérieures.
      de: |-
        Ehe man sichs versieht, hat es schon das
        Langschwert aus seinen Vorderbeinen gezogen
        und seinen Gegner besiegt.
      es: |-
        En un abrir y cerrar de ojos, puede desenvainar y
        envainar los sables que hay en sus patas delanteras.
      it: |-
        Riesce a estrarre le sue spade, colpire il nemico
        e riporle al loro posto nelle zampe anteriori in un
        batter d’occhio.
    'y':
      ja-Hrkt: |-
        よろいに　しこまれた　つるぎの
        ひとふりで　あいてを　たおす。
        ひとにらみで　てきを　だまらせる。
      ja: |-
        よろいに　仕込まれた　剣の　一振りで
        相手を　倒す。
        ひとにらみで　敵を　黙らせる。
      ko: |-
        갑옷에 내장된 검으로 한칼에
        상대를 제압한다.
        눈빛만으로 상대를 침묵시킨다.
      en: |-
        One swing of the sword incorporated in its armor
        can fell an opponent. A simple glare from one of
        them quiets everybody.
      fr: |-
        Il peut terrasser ses ennemis d’un coup de la lame
        enchâssée dans son armure, et les faire taire d’un
        seul regard.
      de: |-
        Besiegt Gegner durch einen einzigen Hieb mit
        der Klinge an seinem Panzer. Ein böser Blick
        und seine Feinde verstummen.
      es: |-
        Derriba a su rival con un solo tajo del sable que lleva
        en su coraza. Acalla al enemigo con una simple
        mirada.
      it: |-
        Atterra l’avversario con un solo colpo della spada
        inserita nell’armatura. Una sua occhiata ammutolisce
        il nemico.
    omega-ruby:
      ja-Hrkt: |-
        てきが　まばたきする　あいだに
        まえあしに　ついた　アシガタナで
        あいてを　きりつけ　もとにもどせる。
      ja: |-
