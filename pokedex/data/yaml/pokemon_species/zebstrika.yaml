  flavor_text:
    black:
      en: |-
        They have lightning-like movements.
        When Zebstrika run at full speed,
        the sound of thunder reverberates.
      fr: |-
        Il réagit à la vitesse de l’éclair.
        Lorsqu’il est en plein galop, on peut
        entendre le grondement du tonnerre.
    white:
      en: |-
        This ill-tempered Pokémon is dangerous
        because when it’s angry, it shoots
        lightning from its mane in all directions.
      fr: |-
        Il est agressif et projette des charges
        électriques dans toutes les directions
        quand il est en colère. Faites attention!
    black-2:
      en: |-
        When this ill-tempered Pokémon
        runs wild, it shoots lightning
        from its mane in all directions.
    white-2:
      en: |-
        When this ill-tempered Pokémon
        runs wild, it shoots lightning
        from its mane in all directions.
    x:
      ja-Hrkt: |-
        はげしい　きしょうの　もちぬし。
        あらぶると　たてがみから　かみなりを
        しほうはっぽうに　ほうでんする。
      ja: |-
        激しい　気性の　持ち主。
        荒ぶると　たてがみから　雷を
        四方八方に　放電する。
      ko: |-
        격렬한 기질의 소유자.
        날뛰면 갈기에서 번개를
        사방팔방으로 방전한다.
      en: |-
        When this ill-tempered Pokémon runs wild, it
        shoots lightning from its mane in all directions.
      fr: |-
        De caractère violent, il envoie avec sa crinière des
        arcs électriques de tous les côtés lorsqu’il se sent
        provoqué.
      de: |-
        Ein stürmischer Geselle. Wenn es wütend ist,
        feuert es über seine Mähne in alle Richtungen
        Stromsalven ab.
      es: |-
        Es un Pokémon con mucho temperamento. Cuando se
        enoja, lanza rayos desde su crin en todas direcciones.
      it: |-
        Ha un temperamento sanguigno. Quando si arrabbia
        dalla criniera lancia saette in ogni direzione.
    'y':
      ja-Hrkt: |-
        いなずまのような　しゅんぱつりょく。
        ゼブライカが　ぜんそくりょくで
        はしると　らいめいが　ひびきわたる。
      ja: |-
        稲妻のような　瞬発力。
        ゼブライカが　全速力で　走ると
        雷鳴が　響きわたる。
      ko: |-
        천둥번개 같은 순발력을 가지고 있다.
        제브라이카가 전속력으로 달리면
        천둥소리가 울려 퍼진다.
      en: |-
        They have lightning-like movements.
        When Zebstrika run at full speed, the sound of
        thunder reverberates.
      fr: |-
        Il réagit à la vitesse de l’éclair. Lorsqu’il est en plein
        galop, on peut entendre le grondement du tonnerre.
      de: |-
        Es ist explosiv wie ein Blitz. Galoppiert es mit voller
        Geschwindigkeit drauflos, kann man Donnerhall
        vernehmen.
      es: |-
        Su velocidad se asemeja a la de un rayo. Si corre al
        máximo, se dejan oír truenos por doquier.
      it: |-
        È scattante come una saetta. Se corre alla massima
        velocità, si sente un rimbombo di tuoni.
    omega-ruby:
