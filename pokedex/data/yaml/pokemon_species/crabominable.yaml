crabominable:
  base_happiness: 70
  capture_rate: 60
  color: white
  egg_groups:
    - water3
  evolution_chain: crabrawler
  evolves_from: crabrawler
  flavor_text:
    sun:
      ja-Hrkt: |-
        トップを　めざすはずが　ゆきやまに
        まよいのぼり　さむさに　たえるうちに
        けが　はえてきて　しんかしていた。
      ja: |-
        トップを　目指すはずが　雪山に
        迷い登り　寒さに　耐えるうちに
        毛が　生えてきて　進化していた。
      ko: |-
        톱을 노리려다 설산에서
        헤매게 되고 추위를 견디던 중에
        털이 생겨서 진화했다.
      zh-Hant: |-
        原本是為了超越顛峰而深入山中修行，
        卻走錯路登上雪山，在忍受寒冷的同時，
        毛髮不斷生長而產生了進化。
      zh-Hans: |-
        应该是以登顶为目标的，却阴差阳错地
        登上了雪山，在忍耐寒冷的过程中，
        由于毛发不断生长而进化成这样。
      en: |-
        It aimed for the top but got lost and ended up
        on a snowy mountain. Being forced to endure
        the cold, this Pokémon evolved and grew fur.
      fr: |-
        Il rêvait d’atteindre le sommet d’un pic enneigé,
        mais s’est égaré en chemin. Il a dû évoluer pour
        survivre au froid et a acquis un pelage fourni.
      de: |-
        Es wollte auf eine verschneite Bergspitze,
        hat sich aber verlaufen. In der Kälte wuchs
        ihm dann ein Fell und es entwickelte sich weiter.
      es: |-
        Tras perderse intentando coronar una alta
        montaña, desarrolló una capa de pelo para
        protegerse del frío.
      it: |-
        Dopo essersi smarrito su una montagna innevata
        che voleva scalare a ogni costo, si è evoluto
        sviluppando del pelo per proteggersi dal freddo.
    moon:
      ja-Hrkt: |-
        とにかく　みさかいなく　なぐる。
        いざと　なったら　ハサミを　じせつし
        ロケットのように　はっしゃし　なぐる。
      ja: |-
        とにかく　見境なく　なぐる。
        いざと　なったら　ハサミを　自切し
        ロケットのように　発射し　なぐる。
      ko: |-
        아무튼 무작정 때린다.
        여차하면 집게를 스스로 끊어
        로켓처럼 발사해서 때린다.
      zh-Hant: |-
        不顧一切地打架。
        遇到突發危機便會自斷鉗子，
        像發射火箭一樣砸出去。
      zh-Hans: |-
        不管不顾地打架。
        遇到危机时刻，就会自断钳子，
        像发射火箭一样砸出去。
      en: |-
        It just throws punches indiscriminately. In times
        of desperation, it can lop off its own pincers
        and fire them like rockets.
      fr: |-
        Il distribue les coups de pince au petit bonheur
        la chance. En dernier recours, il les décroche et
        les envoie telles des roquettes.
      de: |-
        Schlägt erst einmal wahllos zu. Kommt es
        hart auf hart, stößt es seine Scheren ab
        und verschießt sie wie Raketen.
      es: |-
        Asesta golpes con las pinzas a diestro y
        siniestro. Si se ve en apuros, se desprende de
        ellas lanzándolas como si fueran cohetes.
      it: |-
        Sferra colpi alla cieca. Come ultima risorsa,
        si stacca le chele e le spara come razzi per
        colpire l’avversario.
    ultra-sun:
      ja-Hrkt: |-
        ハサミの　なかに　れいきを　ためて
        ぶんなぐる。　ぶあつい　こおりの
        かべも　こなごなに　してしまうぞ。
      ja: |-
        ハサミの　中に　冷気を　溜めて
        ぶん殴る。　分厚い　氷の
        壁も　粉々に　してしまうぞ。
      ko: |-
        집게 안에 냉기를 모아
        때려눕힌다. 두꺼운 얼음벽도
        가루로 만들어 버린다.
      zh-Hant: |-
        會將寒氣聚集在鉗子中
        然後用力痛毆。就算是
        厚厚的冰壁也能打得粉碎。
      zh-Hans: |-
        在钳子中积蓄冷气，然后猛殴。
        即使是很厚的冰壁也能打得粉碎。
      en: |-
        It stores coldness in its pincers and pummels its
        foes. It can even smash thick walls of ice
        to bits!
      fr: |-
        Il concentre le froid dans ses pinces avant de
        frapper. Ses coups sont suffisamment puissants
        pour réduire un épais mur de glace en morceaux.
      de: |-
        Es speichert kalte Luft in seinen Scheren. Wenn
        es mit diesen um sich schlägt, kann es selbst
        dicke Eiswände zerbröckeln.
      es: |-
        En el interior de las pinzas acumula aire gélido.
        Los golpes que asesta son capaces de hacer
        añicos incluso gruesas paredes de hielo.
      it: |-
        Accumula aria fredda all’interno delle chele
        per poi picchiare duro. Riesce a sbriciolare
        anche spessi muri di ghiaccio.
    ultra-moon:
      ja-Hrkt: |-
        かんがえるより　まず　なぐってみる。
        ゆきなだれを　パンチの　ラッシュで
        おしかえしたという　きろくも　ある。
      ja: |-
        考えるより　まず　殴ってみる。
        ゆきなだれを　パンチの　ラッシュで
        押し返したという　記録も　ある。
      ko: |-
        생각하기보다는 일단 때리고 본다.
        눈사태를 펀치 러시로
        되받아쳤다는 기록도 있다.
      zh-Hant: |-
        習慣不經過大腦先動手打了再說。
        以前曾有過用連續不斷的拳擊
        把雪崩推回去的紀錄。
      zh-Hans: |-
        比起思考，会先试着打打看。
        曾经有过用拳头猛攻
        打退雪崩的记录。
      en: |-
        Before it stops to think, it just starts pummeling.
        There are records of its turning back
        avalanches with a flurry of punches.
      fr: |-
        Agir ou réfléchir ? Crabominable choisit de
        frapper ! On raconte qu’il serait déjà parvenu
        à repousser une avalanche à coups de pince.
      de: |-
        Es denkt nicht lange nach und schlägt einfach
        zu. Laut manchen Berichten kann es mit seinen
        schnellen Schlägen selbst Lawinen stoppen.
      es: |-
        No se lo piensa dos veces a la hora de zurrar.
        Se tiene constancia de que sus puñetazos
        frenéticos han llegado a detener aludes.
      it: |-
        Attacca subito, senza pensarci due volte.
        Secondo alcune testimonianze, ha fermato
        una valanga con una raffica di pugni.
