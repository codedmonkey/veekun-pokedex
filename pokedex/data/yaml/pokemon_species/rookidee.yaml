rookidee:
  base_happiness: 50
  capture_rate: 255
  color: blue
  egg_groups:
    - flying
  evolution_chain: rookidee
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        どんな　きょうてきにも　いどみかかる
        ゆうかんな　せいしつ。　かえりうちに
        あいながらも　きたえられていく。
      ja: |-
        どんな　強敵にも　挑みかかる
        勇敢な　性質。　返り討ちに
        遭いながらも　鍛えられていく。
      ko: |-
        아무리 강한 상대라도 덤벼드는
        용감한 성격을 가졌다. 도리어
        당하면서도 점점 단련되어 간다.
      zh-Hant: |-
        性情勇敢，無論多強的敵人
        都勇於挑戰。即使在敵人的反擊中
        被打敗，也能從中得到鍛鍊。
      zh-Hans: |-
        性格勇敢，无论多强的敌人
        都勇于挑战。即使在敌人的反击中
        被打败，也能从中得到锻炼。
      en: |-
        It will bravely challenge any opponent, no matter
        how powerful. This Pokémon benefits from every
        battle—even a defeat increases its strength a bit.
      fr: |-
        Ce Pokémon brave affronte même les adversaires
        les plus redoutables. Il devient plus fort à mesure
        qu’il subit les contre-attaques.
      de: |-
        Es ist von Natur aus sehr mutig und fordert daher
        jeden noch so starken Feind heraus. Selbst wenn
        es den Kürzeren zieht, dient dies seinem Training.
      es: |-
        De naturaleza valiente, planta cara a cualquier
        rival, por muy fuerte que sea. Los contraataques
        que recibe le sirven para fortalecerse.
      it: |-
        Ha un’indole temeraria che lo porta ad attaccare
        briga anche con nemici molto forti. Diventa più
        forte a forza di subire contrattacchi.
    shield:
      ja-Hrkt: |-
        ちいさい　からだで　きびんに　とんで
        すきを　つく　せんぽうで　からだの
        おおきな　あいてを　てだまにとる。
      ja: |-
        小さい　体で　機敏に　飛んで
        隙を　突く　戦法で　体の
        大きな　相手を　手玉に取る。
      ko: |-
        작은 몸을 기민하게 날려
        틈을 노리는 전법으로
        몸집이 큰 상대를 농락한다.
      zh-Hant: |-
        嬌小的體型讓牠能敏捷地飛翔。
        攻其不備的戰法將體型巨大
        的對手玩弄於股掌之間。
      zh-Hans: |-
        娇小的体型让它能敏捷地飞翔。
        利用攻其不备的战法将体型
        巨大的对手玩弄于股掌之间。
      en: |-
        Jumping nimbly about, this small-bodied
        Pokémon takes advantage of even the slightest
        opportunity to disorient larger opponents.
      fr: |-
        Son petit corps lui permet de se jouer d’ennemis
        bien plus grands que lui en volant à toute vitesse
        pour les piquer où ils sont vulnérables.
      de: |-
        Mit seinem kleinen Körper kann es flink fliegen
        und so mithilfe von trickreichen Taktiken größere
        Gegner überlisten.
      es: |-
        Su pequeño cuerpo le permite volar a gran
        velocidad para golpear los puntos débiles de
        rivales mucho más grandes que él.
      it: |-
        Sconfigge i nemici più grossi sfruttando le sue
        piccole dimensioni per volare con agilità attorno
        a loro e colpirli nei punti deboli.
