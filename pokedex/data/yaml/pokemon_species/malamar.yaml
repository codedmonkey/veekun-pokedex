malamar:
  base_happiness: 50
  capture_rate: 80
  color: blue
  egg_groups:
    - water1
    - water2
  evolution_chain: inkay
  evolves_from: inkay
  flavor_text:
    x:
      ja-Hrkt: |-
        ポケモンで　いちばん　きょうりょくな
        さいみんじゅつを　つかう。あいてを
        いのままに　あやつってしまうのだ。
      ja: |-
        ポケモンで　一番　強力な
        催眠術を　使う。相手を　意のままに
        操ってしまうのだ。
      ko: |-
        포켓몬 중에서 가장 강력한
        최면술을 쓴다. 상대를
        자기 마음대로 조종해버린다.
      en: |-
        It wields the most compelling hypnotic powers
        of any Pokémon, and it forces others to do
        whatever it wants.
      fr: |-
        Doté des pouvoirs hypnotiques les plus puissants
        du règne des Pokémon, il manipule son adversaire
        à sa guise.
      de: |-
        Unter allen Pokémon verfügt es über die stärksten
        hypnotischen Kräfte, mit denen es Gegner nach
        Belieben kontrollieren kann.
      es: |-
        Tiene a su disposición los poderes hipnóticos más
        poderosos de entre todos los Pokémon. Controla al
        enemigo a su voluntad.
      it: |-
        È il Pokémon con il potere ipnotico più forte in
        assoluto. Può controllare a piacimento i suoi nemici.
    'y':
      ja-Hrkt: |-
        さいみんじゅつで　おびきよせて
        あたまの　しょくしゅで　からめとり
        しょうかえきを　あびせて　しとめる。
      ja: |-
        催眠術で　おびき寄せて
        頭の　触手で　絡め取り
        消化液を　浴びせて　しとめる。
      ko: |-
        최면술로 끌어들여서
        머리의 촉수로 휘감아
        소화액을 끼얹어 꼼짝 못하게 한다.
      en: |-
        It lures its prey close with hypnotic motions,
        then wraps its tentacles around it before
        finishing it off with digestive fluids.
      fr: |-
        Il attire ses ennemis en les hypnotisant, avant de les
        enserrer de ses tentacules et de les neutraliser avec
        son suc gastrique.
      de: |-
        Mit seinen hypnotischen Kräften lockt es Gegner an,
        hält sie mit den Tentakeln an seinem Kopf fest und
        zersetzt sie dann mit Verdauungssekret.
      es: |-
        Hipnotiza a su objetivo para atraerlo y lo aprisiona
        con los tentáculos de su cabeza, para asestarle el
        golpe de gracia rociándolo con sus jugos gástricos.
      it: |-
        Attira le prede con l’ipnosi, le cattura con i tentacoli
        e le finisce spruzzando loro addosso i suoi succhi
        gastrici.
    omega-ruby:
      ja-Hrkt: |-
        ポケモンで　いちばん　きょうりょくな
        さいみんじゅつを　つかう。あいてを
        いのままに　あやつってしまうのだ。
      ja: |-
        ポケモンで　一番　強力な
        催眠術を　使う。相手を　意のままに
        操ってしまうのだ。
      ko: |-
        포켓몬 중에서 가장 강력한
        최면술을 쓴다. 상대를
        자기 마음대로 조종해버린다.
      en: |-
        It wields the most compelling hypnotic powers
        of any Pokémon, and it forces others to do
        whatever it wants.
      fr: |-
        Doté des pouvoirs hypnotiques les plus puissants du règne
        des Pokémon, il manipule son adversaire à sa guise.
      de: |-
        Unter allen Pokémon verfügt es über die stärksten
        hypnotischen Kräfte, mit denen es Gegner nach Belieben
        kontrollieren kann.
      es: |-
        Tiene a su disposición los poderes hipnóticos más poderosos
        de entre todos los Pokémon. Controla al enemigo a su
        voluntad.
      it: |-
        È il Pokémon con il potere ipnotico più forte in assoluto.
        Può controllare a piacimento i suoi nemici.
    alpha-sapphire:
      ja-Hrkt: |-
        さいみんじゅつで　おびきよせて
        あたまの　しょくしゅで　からめとり
        しょうかえきを　あびせて　しとめる。
      ja: |-
        催眠術で　おびき寄せて
        頭の　触手で　絡め取り
        消化液を　浴びせて　しとめる。
      ko: |-
        최면술로 끌어들여서
        머리의 촉수로 휘감아
        소화액을 끼얹어 꼼짝 못하게 한다.
      en: |-
        It lures its prey close with hypnotic motions,
        then wraps its tentacles around it before
        finishing it off with digestive fluids.
      fr: |-
        Il attire ses ennemis en les hypnotisant, avant de les enserrer
        de ses tentacules et de les neutraliser avec son suc gastrique.
      de: |-
        Mit seinen hypnotischen Kräften lockt es Gegner an, hält sie
        mit den Tentakeln an seinem Kopf fest und zersetzt sie dann
        mit Verdauungssekret.
      es: |-
        Hipnotiza a su objetivo para atraerlo y lo aprisiona con los
        tentáculos de su cabeza, para asestarle el golpe de gracia
        rociándolo con sus jugos gástricos.
      it: |-
        Attira le prede con l’ipnosi, le cattura con i tentacoli e le
        finisce spruzzando loro addosso i suoi succhi gastrici.
    ultra-sun:
      ja-Hrkt: |-
        きょうりょくな　さいみんじゅつを
        つかう。　それを　りようし　あくじを
        はたらくものは　あとを　たたない。
      ja: |-
        強力な　さいみんじゅつを
        使う。　それを　利用し　悪事を
        働く者は　後を　絶たない。
      ko: |-
        강력한 최면술을 사용한다.
        그것을 이용해 못된 짓을
        하는 자들이 끊이지 않는다.
      zh-Hant: |-
        會使用強力的催眠術。
        利用這點來做壞事的人
        從來就沒有少過。
      zh-Hans: |-
        会使用强力的催眠术。
        用此来做坏事者源源不断。
      en: |-
        When it comes to strong hypnosis, there’s an
        endless number of people who utilize Malamar
        for their nefarious deeds.
      fr: |-
        Les personnes malintentionnées tentent
        souvent de s’approprier ses grands pouvoirs
        hypnotiques pour servir leurs mauvais desseins.
      de: |-
        Dieses Pokémon kann starke hypnotische
        Kräfte einsetzen, die ständig von Halunken für
        üble Machenschaften missbraucht werden.
      es: |-
        Posee grandes poderes hipnóticos de los que
        innumerables criminales se aprovechan para
        cometer delitos.
      it: |-
        Possiede incredibili poteri ipnotici che tanti
        malintenzionati cercano di sfruttare a proprio
        vantaggio.
    ultra-moon:
      ja-Hrkt: |-
        どうたいの　もようを　ひからせて
        エモノを　あやつり　おびき　よせる。
        ヒレさきは　ばつぐんの　きれあじ。
      ja: |-
        胴体の　模様を　光らせて
        エモノを　操り　おびき　よせる。
        ヒレ先は　抜群の　切れ味。
      ko: |-
        몸통에 있는 모양을 빛내서
        먹이를 조종해 끌어들인다.
        지느러미 끝은 굉장히 날카롭다.
      zh-Hant: |-
        會讓身體上的花紋發光，
        操縱獵物靠近自己。
        鰭的前端非常鋒利。
      zh-Hans: |-
        让身体上的花纹发光，
        操纵猎物，引诱其靠近。
        鳍的前端非常锋利。
      en: |-
        It flashes the pattern on its torso to control its
        prey and draw them in. The edges of its fins are
        supremely sharp.
      fr: |-
        Il fait briller les motifs qui ornent son corps
        afin d’attirer ses proies. L’extrémité de ses
        tentacules est aussi coupante qu’un rasoir.
      de: |-
        Mithilfe der blinkenden Muster an seinem Rumpf
        hypnotisiert es seine Beute und lockt sie an. Die
        Enden seiner Flossen sind rasiermesserscharf.
      es: |-
        Hipnotiza a su presa con las luces que emite su
        torso y la atrae hacia sí. Las puntas de sus
        tentáculos son extremadamente afiladas.
      it: |-
        Fa lampeggiare i motivi sul suo corpo per
        attirare a sé la preda. Le estremità dei suoi
        tentacoli sono affilatissime.
    sword:
      ja-Hrkt: |-
        はっこうたいの　ひかりを　みつめると
        たちまち　さいみんじょうたいになり
        カラマネロに　あやつられてしまう。
      ja: |-
        発光体の　光を　見つめると
        たちまち　催眠状態になり
        カラマネロに　操られてしまう。
      ko: |-
        발광체의 빛을 보면
        순식간에 최면 상태가 되어
        칼라마네로에게 조종당한다.
      zh-Hant: |-
        要是盯著牠的發光體看，
        就會馬上陷入催眠狀態，
        並且受到牠的控制。
      zh-Hans: |-
        要是盯着乌贼王的发光体看，
        就会马上陷入催眠状态，
        并且受到它的控制。
      en: |-
        Gazing at its luminescent spots will quickly
        induce a hypnotic state, putting the observer
        under Malamar’s control.
      fr: |-
        Il manipule à sa guise ceux qui se sont laissé
        hypnotiser en observant son corps lumineux
        trop longtemps.
      de: |-
        Blickt man in das Licht, das es mit seinem Körper
        erzeugt, wird man sofort hypnotisiert und steht
        danach unter der Kontrolle von Calamanero.
      es: |-
        Los destellos que emite sumen rápidamente en
        un estado hipnótico al observador, que queda
        bajo su control.
      it: |-
        Chi osserva troppo a lungo la luce dei motivi sul
        suo corpo viene ipnotizzato e cade sotto il suo
        controllo.
    shield:
      ja-Hrkt: |-
        れきしを　かえるほどの　だいじけんは
        カラマネロの　さいみん　のうりょくが
        かかわっていたと　いわれている。
      ja: |-
        歴史を　変えるほどの　大事件は
        カラマネロの　催眠能力が
        かかわっていたと　いわれている。
      ko: |-
        역사를 바꿀 정도의 큰 사건은
        칼라마네로의 최면 능력과
        관련이 있다고 전해진다.
      zh-Hant: |-
        據說那些能夠改變歷史
        的重大事件其實都和
        烏賊王的催眠能力有關。
      zh-Hans: |-
        据说那些能够改变历史
        的重大事件其实都和
        乌贼王的催眠能力有关。
      en: |-
        It’s said that Malamar’s hypnotic powers played
        a role in certain history-changing events.
      fr: |-
        On raconte que ses pouvoirs hypnotiques
        seraient à l’origine d’évènements qui ont
        bouleversé le cours de l’Histoire.
      de: |-
        Man erzählt sich, dass die hypnotischen Kräfte
        dieses Pokémon mit einigen geschichtsträchtigen
        Ereignissen in Verbindung stehen.
      es: |-
        Se dice que sus poderes hipnóticos han influido
        en grandes acontecimientos que han cambiado
        el curso de la historia.
      it: |-
        Si dice che il potere ipnotico di questo Pokémon
        abbia giocato un ruolo nei grandi avvenimenti
        che hanno cambiato il corso della storia.
