reshiram:
  base_happiness: 0
  capture_rate: 3
  color: white
  egg_groups:
    - no-eggs
  evolution_chain: reshiram
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        This Pokémon appears in legends.
        It sends flames into the air from its
        tail, burning up everything around it.
      fr: |-
        Un Pokémon mythique.
        Il projette de sa queue un tourbillon
        de flammes capable de tout emporter.
    white:
      en: |-
        When Reshiram’s tail flares, the
        heat energy moves the atmosphere
        and changes the world’s weather.
      fr: |-
        Quand sa queue s’embrase, l’énergie
        thermique dégagée modifie l’atmosphère
        et bouleverse la météo du monde entier.
    black-2:
      en: |-
        This legendary Pokémon can scorch
        the world with fire. It helps those
        who want to build a world of truth.
    white-2:
      en: |-
        This legendary Pokémon can scorch
        the world with fire. It helps those
        who want to build a world of truth.
    x:
      ja-Hrkt: |-
        ほのおで　せかいを　もやしつくせる
        でんせつの　ポケモン。しんじつの
        せかいを　きずく　ひとを　たすける。
      ja: |-
        炎で　世界を　燃やしつくせる
        伝説の　ポケモン。真実の
        世界を　築く　人を　助ける。
      ko: |-
        불꽃으로 세상을 태워버릴 수 있는
        전설의 포켓몬. 진실의 세계를
        구축하는 사람을 도와준다.
      en: |-
        This legendary Pokémon can scorch the world with
        fire. It helps those who want to build a world
        of truth.
      fr: |-
        Un Pokémon légendaire assez puissant pour embraser
        le monde entier. Il soutient les défenseurs de la
        Réalité.
      de: |-
        Ein Legendäres Pokémon mit der Macht, die Welt
        mit seinen Flammen einzuäschern. Hilft allen,
        die nach Wirklichkeit streben.
      es: |-
        Pokémon legendario capaz de abrasar el mundo con
        sus llamas. Ayuda a quienes persiguen un mundo
        veraz.
      it: |-
        Questo Pokémon leggendario può rendere il mondo
        un inferno di fiamme. Aiuta chi vuole costruire un
        mondo di verità.
    'y':
      ja-Hrkt: |-
        レシラムの　しっぽが　もえると
        ねつエネルギーで　たいきが　うごいて
        せかいの　てんきが　へんかする。
      ja: |-
        レシラムの　尻尾が　燃えると
        熱エネルギーで　大気が　動いて
        世界の　天気が　変化する。
      ko: |-
        레시라무의 꼬리가 불타면
        열에너지로 대기가 움직여서
        세계의 날씨가 변화된다.
      en: |-
        When Reshiram’s tail flares, the heat energy moves
        the atmosphere and changes the world’s weather.
      fr: |-
        Quand sa queue s’embrase, l’énergie thermique
        dégagée modifie l’atmosphère et bouleverse la météo
        du monde entier.
      de: |-
        Lodert das Feuer in seinem Schweif auf, gerät die
        Erdatmosphäre durch die Hitze in Wallung und
        das Weltklima ändert sich.
      es: |-
        Cuando la cola de Reshiram arde, su energía calorífica
        altera la atmósfera, y el tiempo meteorológico cambia.
      it: |-
        Quando la sua coda brucia, il calore prodotto smuove
        l’aria provocando cambiamenti climatici in tutto il
        globo.
    omega-ruby:
      ja-Hrkt: |-
        ほのおで　せかいを　もやしつくせる
        でんせつの　ポケモン。しんじつの
        せかいを　きずく　ひとを　たすける。
      ja: |-
        炎で　世界を　燃やしつくせる
        伝説の　ポケモン。真実の
        世界を　築く　人を　助ける。
      ko: |-
        불꽃으로 세상을 태워버릴 수 있는
        전설의 포켓몬. 진실의 세계를
        구축하는 사람을 도와준다.
      en: |-
        This legendary Pokémon can scorch the world with
        fire. It helps those who want to build a world
        of truth.
      fr: |-
        Un Pokémon légendaire assez puissant pour embraser
        le monde entier. Il soutient les défenseurs de la Réalité.
      de: |-
        Ein Legendäres Pokémon mit der Macht, die Welt mit seinen
        Flammen einzuäschern. Hilft allen, die nach Wirklichkeit
        streben.
      es: |-
        Pokémon legendario capaz de abrasar el mundo con sus
        llamas. Ayuda a quienes persiguen un mundo veraz.
      it: |-
        Questo Pokémon leggendario può rendere il mondo un inferno
        di fiamme. Aiuta chi vuole costruire un mondo di verità.
    alpha-sapphire:
      ja-Hrkt: |-
        レシラムの　しっぽが　もえると
        ねつエネルギーで　たいきが　うごいて
        せかいの　てんきが　へんかする。
      ja: |-
        レシラムの　尻尾が　燃えると
        熱エネルギーで　大気が　動いて
        世界の　天気が　変化する。
      ko: |-
        레시라무의 꼬리가 불타면
        열에너지로 대기가 움직여서
        세계의 날씨가 변화된다.
      en: |-
        When Reshiram’s tail flares, the heat energy moves
        the atmosphere and changes the world’s weather.
      fr: |-
        Quand sa queue s’embrase, l’énergie thermique dégagée
        modifie l’atmosphère et bouleverse la météo du monde entier.
      de: |-
        Lodert das Feuer in seinem Schweif auf, gerät die
        Erdatmosphäre durch die Hitze in Wallung und das
        Weltklima ändert sich.
      es: |-
        Cuando la cola de Reshiram arde, su energía calorífica altera
        la atmósfera, y el tiempo meteorológico cambia.
      it: |-
        Quando la sua coda brucia, il calore prodotto smuove l’aria
        provocando cambiamenti climatici in tutto il globo.
    sword:
      ja-Hrkt: |-
        しっぽから　ほのおを　ふきだして
        ジェットきのように　そらを　とぶ。
        せかいを　やきつくすと　いわれる。
      ja: |-
        しっぽから　炎を　噴き出して
        ジェット機のように　空を　飛ぶ。
        世界を　焼きつくすと　いわれる。
      ko: |-
        꼬리에서 불꽃을 분출하여
        제트기처럼 하늘을 난다.
        세계를 불태울 것이라고 전해진다.
      zh-Hant: |-
        從尾部噴出火焰，
        像噴射機那樣飛翔。
        據說牠能將世界燃燒殆盡。
      zh-Hans: |-
        从尾部喷出火焰，
        像喷气式飞机那样飞翔。
        据说它能让世界燃烧殆尽。
      en: |-
        Flames spew from its tail as it flies through the
        sky like a jet airplane. It’s said that this Pokémon
        will scorch the world.
      fr: |-
        Il vole grâce à la propulsion générée
        par les flammes de sa queue.
        Il serait capable de réduire le monde en cendres.
      de: |-
        Durch Feuerschübe aus seinem Schweif fliegt es
        schnell wie ein Düsenjet durch die Lüfte. Seine
        Flammen sollen die Welt einäschern können.
      es: |-
        Surca los cielos cual cohete a reacción
        expulsando llamas por la cola. Se cree que
        podría reducir a cenizas el mundo entero.
      it: |-
        Solca i cieli come un jet emettendo fiamme
        dalla coda. Si dice che abbia la capacità
        di ridurre in cenere il mondo intero.
    shield:
      ja-Hrkt: |-
        ひとが　しんじつを　ないがしろにして
        よくに　まみれると　ほのおで　くにを
        やきつくすと　しんわに　えがかれた。
      ja: |-
        人が　真実を　蔑ろにして
        欲に　まみれると　炎で　国を
        焼きつくすと　神話に　描かれた。
      ko: |-
        사람이 진실을 모른 체하고
        욕심으로 가득 차면 불꽃으로
        나라를 태워버린다는 신화가 있다.
      zh-Hant: |-
        在神話的敘述裡，如果人類
        蔑視真實、放縱欲望，牠就會
        用火焰燒盡他們的王國。
      zh-Hans: |-
        在神话的叙述里，如果人类
        蔑视真实、放纵欲望，它就会
        用火焰烧尽他们的王国。
      en: |-
        According to myth, if people ignore truth and
        let themselves become consumed by greed,
        Reshiram will arrive to burn their kingdoms down.
      fr: |-
        Selon un mythe, lorsque les gens ne font aucun
        cas de la Réalité et s’abandonnent à la cupidité,
        Reshiram rase le pays entier avec ses flammes.
      de: |-
        Alte Mythen warnen, dass es alle Welt in Brand
        setzen wird, wenn die Menschen die Wirklichkeit
        missachten und der Gier verfallen.
      es: |-
        Cuenta la leyenda que sus llamas reducirán a
        cenizas todo país cuyas gentes desprecien la
        verdad y estén mancilladas por la codicia.
      it: |-
        Secondo le leggende, può incenerire un intero
        paese se i suoi abitanti oltraggiano la verità
        e sono accecati dalla cupidigia.
