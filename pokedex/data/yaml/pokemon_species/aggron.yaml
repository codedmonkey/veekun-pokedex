aggron:
  base_happiness: 35
  capture_rate: 45
  color: gray
  egg_groups:
    - monster
  evolution_chain: aron
  evolves_from: lairon
  flavor_text:
    ruby:
      en: |-
        AGGRON claims an entire mountain as its
        own territory. It mercilessly beats up
        anything that violates its environment.This POKéMON vigilantly patrols its
        territory at all times.
    sapphire:
      en: |-
        AGGRON is surprisingly protective
        of its environment. If its mountain
        is ravaged by a landslide or a fire, thisPOKéMON will haul topsoil to the area,
        plant trees, and beautifully restore its
        own territory.
    emerald:
      en: |-
        Its iron horns grow longer a little at
        a time. They are used to determine the
        AGGRON’s age. The gouges in its armor are
        worn with pride as mementos from battles.
    firered:
      en: |-
        It claims a large mountain as its sole
        territory. It mercilessly thrashes those
        that violate its space.
    leafgreen:
      en: |-
        It claims a large mountain as its sole
        territory. It mercilessly thrashes those
        that violate its space.
    diamond:
      en: |-
        While seeking iron for food, it
        digs tunnels by breaking through
        bedrock with its steel horns.
    pearl:
      en: |-
        While seeking iron for food, it
        digs tunnels by breaking through
        bedrock with its steel horns.
    platinum:
      en: |-
        While seeking iron for food, it
        digs tunnels by breaking through
        bedrock with its steel horns.
    heartgold:
      en: |-
        You can tell its age by the length
        of its iron horns. It claims an
        entire mountain as its territory.
    soulsilver:
      en: |-
        You can tell its age by the length
        of its iron horns. It claims an
        entire mountain as its territory.
    black:
      en: |-
        While seeking iron for food, it
        digs tunnels by breaking through
        bedrock with its steel horns.
      fr: |-
        Il creuse des galeries à travers la
        pierre avec ses cornes d’acier pour
        trouver le fer qu’il apprécie.
    white:
      en: |-
        While seeking iron for food, it
        digs tunnels by breaking through
        bedrock with its steel horns.
      fr: |-
        Il creuse des galeries à travers la
        pierre avec ses cornes d’acier pour
        trouver le fer qu’il apprécie.
    black-2:
      en: |-
        It claims an entire mountain as its own.
        The more wounds it has, the more it has
        battled, so don’t take it lightly.
    white-2:
      en: |-
        It claims an entire mountain as its own.
        The more wounds it has, the more it has
        battled, so don’t take it lightly.
    x:
      ja-Hrkt: |-
        やまを　まるごと　なわばりに　する。
        キズが　おおい　ボスゴドラほど
        たたかっているので　あなどれない。
      ja: |-
        山を　まるごと　縄張りに　する。
        傷が　多い　ボスゴドラほど
        戦っているので　侮れない。
      ko: |-
        산을 통째로 영역으로 한다.
        상처가 많은 보스로라일수록
        많이 싸웠다는 것이므로 얕볼 수 없다.
      en: |-
        It claims an entire mountain as its own.
        The more wounds it has, the more it has battled,
        so don’t take it lightly.
      fr: |-
        Il établit son territoire sur toute une montagne.
        Ses cicatrices indiquent son expérience : plus il en a,
        plus il est fort !
      de: |-
        Ihre Reviere erstrecken sich über ganze Gebirge.
        Stolloss, die mit Narben übersät sind, sollte man
        besser meiden.
      es: |-
        Hacen de toda una montaña su territorio. Cuantas más
        cicatrices tienen, más curtidos en disputas. ¡Mucha
        atención!
      it: |-
        Sceglie come territorio intere montagne. Se ha tante
        cicatrici sul suo corpo, è meglio non scherzare con lui.
    'y':
      ja-Hrkt: |-
        はがねの　ツノで　かたい　がんばんを
        つきくずしながら　しょくりょうの
        てつを　さがして　トンネルを　ほる。
      ja: |-
        鋼の　ツノで　硬い　岩盤を
        突き崩しながら　食料の
        鉄を　探して　トンネルを　掘る。
      ko: |-
        강철의 뿔로 단단한 암반을
        무너뜨리며 식량이 되는
        철을 찾아서 터널을 판다.
      en: |-
        While seeking iron for food, it digs tunnels by
        breaking through bedrock with its steel horns.
      fr: |-
        Il creuse des galeries à travers la pierre avec ses
        cornes d’acier pour trouver le fer qu’il apprécie.
      de: |-
        Auf der Suche nach Eisen, seiner Nahrung, gräbt es
        mit seinen Stahlhörnern sogar Tunnel durch Felsen.
      es: |-
        Mientras busca hierro para comer, excava túneles en
        la roca con sus potentes cuernos de acero.
      it: |-
        Cerca ferro da mangiare scavando tunnel nella roccia
        con le sue corna d’acciaio.
    omega-ruby:
      ja-Hrkt: |-
        やま　ひとつを　じぶんの　なわばりに　していて
        あらした　あいては　ようしゃなく　たたきのめす。
        いつも　やまの　なかを　みまわり　している。
      ja: |-
        山　一つを　自分の　縄張りに　していて
        荒らした　相手は　容赦なく　たたきのめす。
        いつも　山の　中を　見回り　している。
      ko: |-
        산 하나를 자신의 영역으로 만들고
        침범한 상대는 봐주지 않고 때려눕힌다.
        항상 산속을 돌아보고 있다.
      en: |-
        Aggron claims an entire mountain as its own territory.
        It mercilessly beats up anything that violates its environment.
        This Pokémon vigilantly patrols its territory at all times.
      fr: |-
        Galeking marque son territoire autour d’une montagne
        entière. Il combat sans merci quiconque pénètre dans
        son environnement. Ce Pokémon patrouille sans arrêt
        sur son territoire.
      de: |-
        Stolloss nennt einen ganzen Berg sein Territorium. Gnadenlos
        schlägt es jeden in die Flucht, der sein Reich betritt. Dieses
        Pokémon behält sein Territorium jederzeit im Auge.
      es: |-
        Aggron marca una montaña entera como su territorio y acaba
        con todo lo que pueda ponerlo en peligro. Este Pokémon está
        continuamente patrullando la zona en defensa de su terreno.
      it: |-
        Aggron è solito delimitare un’intera montagna come suo
        territorio esclusivo ed è spietato con coloro che osano
        violare tali confini. Questo Pokémon pattuglia il proprio
        spazio senza mai abbassare la guardia.
    alpha-sapphire:
      ja-Hrkt: |-
        どしゃくずれや　やまかじで　やまが　あれると
        せっせと　つちを　はこび　きの　なえを　うえて
        じぶんの　なわばりを　きれいに　そうじする。
      ja: |-
        土砂崩れや　山火事で　山が　荒れると
        せっせと　土を　運び　木の　苗を　植えて
        自分の　縄張りを　きれいに　掃除する。
      ko: |-
        산사태나 산불로 산이 황폐해지면
        열심히 흙을 나르고 나무 모종을 심어
        자신의 영역을 깨끗히 청소한다.
      en: |-
        Aggron is protective of its environment. If its mountain is
        ravaged by a landslide or a fire, this Pokémon will haul
        topsoil to the area, plant trees, and beautifully restore its
        own territory.
      fr: |-
        Galeking est attentif à son environnement. Si sa montagne
        est ravagée par un glissement de terrain ou un incendie,
        ce Pokémon laboure la terre, plante des arbres et restaure
        le paysage.
      de: |-
        Stolloss geht sehr behutsam mit der Umwelt um. Wenn der
        Berg von Stolloss von einem Erdrutsch oder einem Feuer
        verwüstet wurde, schleppt es Erde in das Gebiet,
        pflanzt Bäume und richtet sein Territorium wieder her.
      es: |-
        Aggron es increíblemente cuidadoso con su hábitat. Si su
        montaña sufre algún corrimiento de tierras o algún incendio,
        cargará con tierra nueva, plantará árboles y restaurará con
        cuidado el terreno.
      it: |-
        Aggron difende strenuamente il proprio territorio.
        In caso di frana o incendio, questo Pokémon è in grado
        di risistemare il terreno, ripiantare gli alberi e ristabilire
        al meglio il proprio ambiente naturale.
    sword:
      ja-Hrkt: |-
        ぶあつい　てっぱんを　つらぬくほどの
        するどい　ツノを　たいあたりとともに
        くらわせて　てきを　しとめる。
      ja: |-
        ぶ厚い　鉄板を　貫くほどの
        鋭い　ツノを　体当たりとともに
        くらわせて　敵を　しとめる。
      ko: |-
        두꺼운 철판을 꿰뚫을 정도로
        예리한 뿔을 몸통박치기와 함께
        찔러넣어 상대를 처리한다.
      zh-Hant: |-
        在撞擊敵人的同時，會用
        能刺穿厚鐵板的銳利尖角
        給予對方致命的一擊。
      zh-Hans: |-
        会用能够刺穿铁板的
        锐利尖角在撞击敌人的
        同时攻击对方。
      en: |-
        Aggron has a horn sharp enough to perforate
        thick iron sheets. It brings down its opponents by
        ramming into them horn first.
      fr: |-
        Il terrasse ses ennemis en chargeant et en donnant
        des coups avec ses cornes acérées capables de
        transpercer des plaques de fer épaisses.
      de: |-
        Mit seinen spitzen Hörnern, die selbst massive
        Eisenplatten durchbohren können, rammt es seine
        Gegner und macht ihnen so den Garaus.
      es: |-
        Sus cuernos duros y afilados pueden perforar
        hasta las planchas de hierro más gruesas.
        Derriba a sus rivales cargando contra ellos.
      it: |-
        Abbatte i nemici caricandoli e speronandoli
        con le sue corna, talmente affilate da perforare
        spesse lastre di metallo.
    shield:
      ja-Hrkt: |-
        おおむかし　ボスゴドラの　つよさに
        あやかり　あたまの　かたちを　もした
        かぶとを　かぶる　おうさまが　いた。
      ja: |-
        大昔　ボスゴドラの　強さに
        あやかり　頭の　形を　模した
        かぶとを　被る　王様が　いた。
      ko: |-
        먼 옛날 어떤 왕은 보스로라의
        강함을 선망하여 머리 모양을
        본떠 만든 투구를 쓰기도 했다.
      zh-Hant: |-
        古時候有位國王將自己的頭盔
        製作成波士可多拉頭部的樣子，
        期盼為自己帶來像牠的強大力量。
      zh-Hans: |-
        很久以前，有位国王由于希望
        像波士可多拉一样强大而戴上了
        模仿它的头部制成的头盔。
      en: |-
        Long ago, there was a king who wore a helmet
        meant to resemble the head of an Aggron. He
        was trying to channel the Pokémon’s strength.
      fr: |-
        Il y a fort longtemps, un roi portait un casque
        à l’effigie de Galeking, pensant qu’il pourrait
        ainsi s’approprier sa force.
      de: |-
        Einst gab es einen König, der einen Helm in Form
        von Stolloss’ Kopf trug, in der Hoffnung, sich
        dadurch dessen Stärke aneignen zu können.
      es: |-
        En la antigüedad, hubo un monarca que llevaba
        un casco hecho a imagen de Aggron para que le
        otorgase fuerza.
      it: |-
        In tempi antichi ci fu un re che, aspirando alla
        forza di Aggron, indossava un elmo ispirato
        alla testa di questo Pokémon.
