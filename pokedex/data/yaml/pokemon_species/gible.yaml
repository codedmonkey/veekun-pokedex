      es: |-
        Vive en agujeros en las cuevas, al amparo del calor
        geotérmico. Si se acerca un enemigo, le muerde.
      it: |-
        Vive in gallerie scaldate dal calore geotermico. Se sente un
        nemico arrivare, salta fuori e lo addenta.
    alpha-sapphire:
      ja-Hrkt: |-
