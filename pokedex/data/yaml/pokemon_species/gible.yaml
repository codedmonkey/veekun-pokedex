    x:
      ja-Hrkt: |-
        ちねつで　あたためられた　よこあなで
        くらす。てきが　ちかづくと　あなから
        とびだして　おおぐちで　かみつく。
      ja: |-
        地熱で　温められた　横穴で　暮らす。
        敵が　近づくと　穴から　飛び出して
        大口で　かみつく。
      ko: |-
        지열로 데워진 구멍에서
        지낸다. 적이 가까이 오면 구멍에서
        뛰쳐나와 커다란 입으로 물어버린다.
      en: |-
        It nests in horizontal holes warmed by geothermal
        heat. Foes who get too close can expect to be
        pounced on and bitten.
      fr: |-
        Il niche dans des cavités chauffées par géothermie,
        dont il bondit pour déchiqueter tout intrus.
      de: |-
        Es lebt in Höhlen, die Erdwärme ausgesetzt sind.
        Es springt heraus und beißt, wenn Feinde sich nähern.
      es: |-
        Vive en agujeros en las cuevas, al amparo del calor
        geotérmico. Si se acerca un enemigo, le muerde.
      it: |-
        Vive in gallerie scaldate dal calore geotermico. Se
        sente un nemico arrivare, salta fuori e lo addenta.
    'y':
      ja-Hrkt: |-
        どうくつの　ちいさな　よこあなを
        ねぐらにする。えものが　ちかづくと
        すばやく　とびだして　つかまえる。
      ja: |-
        洞窟の　小さな　横穴を
        ねぐらにする。獲物が　近づくと
        素早く　飛び出して　捕まえる。
      ko: |-
        동굴의 조그만 구멍을
        보금자리로 쓴다. 먹이가 다가오면
        재빠르게 뛰쳐나가 붙잡는다.
      en: |-
        It nests in small, horizontal holes in cave walls.
        It pounces to catch prey that stray too close.
      fr: |-
        Il niche dans les petits trous horizontaux des murs
        des grottes. Il bondit pour saisir sa proie.
      de: |-
        Es nistet in kleinen Löchern in Höhlenwänden.
        Es springt Beute, die sich zu nah heranwagt, an.
      es: |-
        Anida en pequeños agujeros en las paredes de
        cuevas. Cuando una presa pasa cerca, salta hacia ella.
      it: |-
        Nidifica in piccole cavità orizzontali nelle pareti delle
        grotte. Si avventa sulle prede che si avvicinano.
    omega-ruby:
      ja-Hrkt: |-
