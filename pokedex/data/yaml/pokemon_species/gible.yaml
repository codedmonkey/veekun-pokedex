        뛰쳐나와 커다란 입으로 물어버린다.
      en: |-
        It nests in horizontal holes warmed by geothermal
        heat. Foes who get too close can expect to be
        pounced on and bitten.
      fr: |-
        Il niche dans des cavités chauffées par géothermie,
        dont il bondit pour déchiqueter tout intrus.
      de: |-
