        ねぐらにする。えものが　ちかづくと
        すばやく　とびだして　つかまえる。
      ja: |-
        洞窟の　小さな　横穴を
        ねぐらにする。獲物が　近づくと
        素早く　飛び出して　捕まえる。
      ko: |-
        동굴의 조그만 구멍을
        보금자리로 쓴다. 먹이가 다가오면
        재빠르게 뛰쳐나가 붙잡는다.
      en: |-
        It nests in small, horizontal holes in cave walls.
        It pounces to catch prey that stray too close.
      fr: |-
        Il niche dans les petits trous horizontaux des murs des grottes.
        Il bondit pour saisir sa proie.
      de: |-
        Es nistet in kleinen Löchern in Höhlenwänden.
        Es springt Beute, die sich zu nah heranwagt, an.
      es: |-
        Anida en pequeños agujeros en las paredes de cuevas.
        Cuando una presa pasa cerca, salta hacia ella.
      it: |-
        Nidifica in piccole cavità orizzontali nelle pareti delle grotte.
        Si avventa sulle prede che si avvicinano.
    sun:
      ja-Hrkt: |-
        ちねつで　あたたかい　どうくつに
        くらしている。　それでも　さむくなると
        なかまと　みを　よせあって　かたまる。
      ja: |-
        地熱で　温かい　洞窟に
        暮らしている。　それでも　寒くなると
        仲間と　身を　寄せ合って　かたまる。
      ko: |-
        지열로 따뜻한 동굴에서
        살고 있다. 그래도 추워지면
        동료들과 몸을 맞대어 뭉친다.
      zh-Hant: |-
        生活在充滿地熱的溫暖洞窟裡。
        即便如此，一旦變冷就會和
        夥伴們緊緊靠在一起。
      zh-Hans: |-
        生活在因地热而温暖的洞窟里。
        即便如此，一旦变冷就会和
        伙伴们紧紧挨在一起。
      en: |-
        It lives in caves warmed by geothermal heat.
        Even so, when the weather gets cold, it will
        huddle close with others of its kind.
      fr: |-
        On le trouve dans les cavernes bien chauffées
        par géothermie. S’il a froid malgré tout, il dort en
        tas avec ses congénères pour se réchauffer.
      de: |-
        Es lebt in Höhlen, die Erdwärme ausgesetzt sind.
        Falls es trotzdem kalt wird, rückt es eng mit
        seinen Freunden zusammen.
      es: |-
        Vive en el interior de cuevas, al amparo del calor
        geotérmico. Si aun así sigue sintiendo frío, se
        junta con sus congéneres haciendo una piña.
      it: |-
        I Gible vivono in gallerie scaldate dal calore
        geotermico. Se hanno freddo, fanno gruppo
        e rimangono appiccicati gli uni agli altri.
    moon:
      ja-Hrkt: |-
        あなぐらに　ひそみ　えものや　てきが
        よこぎると　とびだして　かみつく。
        いきおいあまり　はが　かけることも。
      ja: |-
        穴倉に　潜み　獲物や　敵が
        横切ると　飛びだして　噛みつく。
        勢い余り　歯が　欠けることも。
      ko: |-
        구멍에 숨어서 먹이나 적이
        지나가면 뛰쳐나가 문다.
        기세가 대단해 이가 빠질 때도 있다.
      zh-Hant: |-
        潛伏在地洞內，如果有獵物
        或敵人經過，就會撲出來咬住。
        有時會用力過猛而咬壞牙齒。
      zh-Hans: |-
        潜伏在地洞内，如果有猎物
        或敌人经过，就会扑出来咬住。
        有时会用力过猛牙齿豁掉。
      en: |-
        It skulks in caves, and when prey or an enemy
        passes by, it leaps out and chomps them. The
        force of its attack sometimes chips its teeth.
      fr: |-
        Il attend le passage d’une proie pour bondir
        hors de son trou et la croquer. Dans son élan,
        il se casse parfois les dents.
      de: |-
        Es verbirgt sich in kleinen Höhlen, aus denen es
        herausspringt und vorbeilaufende Gegner beißt.
        Manchmal bricht dabei ein Zahn ab.
      es: |-
        Permanece oculto en cuevas y cuando pasa una
        presa, se abalanza sobre ella y la muerde con
        tanta fuerza que hasta se le rompen los dientes.
      it: |-
        Aspetta nemici e prede in agguato nella sua
        tana. Quando gli arrivano a tiro, li addenta con
        tale forza che a volte si spezza i denti.
    ultra-sun:
      ja-Hrkt: |-
        うごくものに　はんのうし　とびついて
        かみつく。　じぶんが　きずつくことも
        あるけれど　あまり　きにしていない。
      ja: |-
        動くものに　反応し　飛びついて
        噛みつく。　自分が　傷つくことも
        あるけれど　あまり　気にしていない。
      ko: |-
        움직이는 것에 반응하여
        달려들어 덥석 문다. 자신이 상처를
        입어도 별로 신경 쓰지 않는다.
      zh-Hant: |-
        會對動的東西產生反應並撲過去咬住。
        有時會因此傷到自己，
        但牠並不怎麼在意。
      zh-Hans: |-
        会对动的东西发生反应，
        飞扑过去咬住。有时候
        会伤到自己，但也不太在意。
      en: |-
        It reacts to anything that moves—flies right at it
        and bites it. Sometimes it injures itself, but it
        doesn’t care too much.
      fr: |-
        Il saute sur tout ce qui bouge pour y planter
        ses dents. Cette manie lui vaut quelques
        blessures, mais il n’en a que faire.
      de: |-
        Wenn sich etwas in seiner Nähe bewegt, stürzt
        es sich darauf und beißt fest zu, auch wenn es
        sich dabei selbst verletzt.
      es: |-
        En cuanto percibe un objeto en movimiento, se
        lanza contra él y le asesta dentelladas. A veces
        se hiere a sí mismo, pero no le importa.
      it: |-
        Appena sente qualcosa muoversi, salta fuori
        e lo addenta. Spesso si fa male da solo,
        ma non se ne preoccupa particolarmente.
    ultra-moon:
      ja-Hrkt: |-
        アローラより　さらに　あつい　とちが
        ほんらいの　すみか。　いっしょに
        すむなら　だんぼうだいが　かかる。
      ja: |-
        アローラより　さらに　暑い　土地が
        本来の　棲み処。　一緒に
        住むなら　暖房代が　かかる。
      ko: |-
        알로라보다 더 더운 곳이
        본래 서식지다. 함께
        지내려면 난방비가 든다.
      zh-Hant: |-
        原本棲息在比阿羅拉更熱的地方。
        如果想和牠住在一起，
        暖氣費的開銷會很大。
      zh-Hans: |-
        原本栖息在比阿罗拉更热的地方。
        一起住的话，要花很多暖气费。
      en: |-
        Its original home is an area much hotter than
        Alola. If you’re planning to live with one, your
        heating bill will soar.
      fr: |-
        Il vient d’un endroit où il fait bien plus chaud
        que dans la région d’Alola. La facture de
        chauffage est donc élevée quand on vit avec lui.
      de: |-
        Es ist ein weitaus wärmeres Klima gewohnt, als
        das, was in Alola vorherrscht. Trainer dieses
        Pokémon sollten mit hohen Heizkosten rechnen.
      es: |-
        Un Pokémon habituado a un clima aún más
        cálido que el de Alola. Quien convive con un
        Gible gasta mucho dinero en calefacción.
      it: |-
        È abituato a climi più caldi di quello di Alola.
        Avere un Gible in casa significa incorrere in
        bollette del riscaldamento salate.
    sword:
      ja-Hrkt: |-
        ちねつで　あたためられた　どうくつの
        せまい　よこあなを　このむ。　そとが
        ふぶいていても　こごえずにすむのだ。
      ja: |-
        地熱で　暖められた　洞窟の
        狭い　横穴を　好む。　外が
        吹雪いていても　凍えずにすむのだ。
      ko: |-
        지열로 데워진 동굴의 좁은
        구멍을 좋아한다. 밖에 눈보라가
        쳐도 얼어붙지 않고 견딜 수 있다.
      zh-Hant: |-
        喜歡住在被地熱加溫的洞窟
        的小窄洞。這樣即使外面
        刮著暴風雪，牠也不會受凍。
      zh-Hans: |-
        喜欢因地热而温暖的
        狭窄横洞，这样一来就算
        外面刮暴风雪也不会冻着了。
      en: |-
        Gible prefers to stay in narrow holes in the sides
        of caves heated by geothermal energy. This way,
        Gible can stay warm even during a blizzard.
      fr: |-
        Il aime les cavités étroites dans les grottes
        chauffées par géothermie. Elles le tiennent au
        chaud lorsque le blizzard souffle à l’extérieur.
      de: |-
        Es mag enge Löcher in Höhlenwänden, die der
        Erdwärme ausgesetzt sind. Selbst wenn draußen
        ein Schneesturm wütet, friert es dort nicht.
      es: |-
        Vive en pequeños agujeros de cuevas calentadas
        por la energía geotérmica, por lo que no pasa
        frío ni aunque fuera se desate una ventisca.
      it: |-
        Ama le strette nicchie nelle pareti delle grotte
        scaldate dal calore geotermico. Non ha freddo
        neanche se all’esterno ci sono tormente di neve.
    shield:
      ja-Hrkt: |-
        うごくものを　みさかいなしに　おそい
        ねぐらの　よこあなに　ひきずりこむ。
        おおぐちだが　いぶくろは　ちいさめ。
      ja: |-
        動くものを　見境なしに　襲い
        ねぐらの　横穴に　引きずりこむ。
        大口だが　胃袋は　小さめ。
      ko: |-
        움직이는 것은 무조건 공격해서
        보금자리 굴로 데려간다.
        입은 크지만 위는 작은 편이다.
      zh-Hant: |-
        會不分青紅皂白地襲擊會動的東西，
        將對方拖進自己睡覺的小洞裡。
        雖然嘴巴很大，但胃卻算是小的。
      zh-Hans: |-
        遇到会动的东西就会扑上去
        将其拉回到自己住的横洞内。
        虽然嘴很大，但胃口却比较小。
      en: |-
        Gible attacks anything that moves, and it drags
        whatever it catches into the crevice that is its lair.
        Despite the big mouth, Gible’s stomach is small.
      fr: |-
        Il attaque et entraîne dans son antre tout ce qui
        bouge, sans distinction. Sa gueule est immense,
        mais son estomac est relativement petit.
      de: |-
        Es greift alles an, was sich bewegt, und zerrt es
        in sein Versteck. Kaumalat verfügt zwar über ein
        großes Maul, aber sein Magen ist relativ klein.
      es: |-
        Ataca indiscriminadamente a cualquier cosa que
        se mueva y la arrastra a su agujero. Pese a tener
        una boca enorme, su estómago es pequeño.
      it: |-
        Attacca indiscriminatamente qualunque cosa
        si muova, per poi trascinarla nella tana. La bocca
        ha dimensioni notevoli ma lo stomaco è piccolo.
    legends-arceus:
      en: |-
        It nests in caves untouched by sunlight. Its sharp teeth may fall
        out when worn away or after an impact, but they regrow within
        a few days.
