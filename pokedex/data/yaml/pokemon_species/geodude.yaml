geodude:
  base_happiness: 70
  capture_rate: 255
  color: brown
  egg_groups:
    - mineral
  evolution_chain: geodude
  evolves_from: ~
  flavor_text:
    red:
      en: |-
        Found in fields
        and mountains.
        Mistaking themfor boulders,
        people often step
        or trip on them.
    blue:
      en: |-
        Found in fields
        and mountains.
        Mistaking themfor boulders,
        people often step
        or trip on them.
    yellow:
      en: |-
        Commonly found
        near mountain
        trails, etc.If you step on
        one by accident,
        it gets angry.
    gold:
      en: |-
        Most people may
        not notice, but
        a closer lookshould reveal that
        there are many
        GEODUDE around.
    silver:
      en: |-
        It uses its arms
        to steadily climb
        steep mountainpaths. It swings
        its fists around
        if angered.
    crystal:
      en: |-
        Proud of their
        sturdy bodies,
        they bash againsteach other in a
        contest to prove
        whose is harder.
    ruby:
      en: |-
        The longer a GEODUDE lives, the more
        its edges are chipped and worn away,
        making it more rounded in appearance.However, this POKéMON’s heart will
        remain hard, craggy, and rough always.
    sapphire:
      en: |-
        When GEODUDE sleeps deeply, it buries
        itself halfway into the ground.
        It will not awaken even if hikers stepon it unwittingly.
        In the morning, this POKéMON rolls
        downhill in search of food.
    emerald:
      en: |-
        It climbs mountain paths using only the
        power of its arms. Because they look just
        like boulders lining paths, hikers may step
        on them without noticing.
    firered:
      en: |-
        Its round form makes it easy to pick up.
        Some people have used them to hurl
        at each other in a snowball fight.
    leafgreen:
      en: |-
        Found in fields and mountains. Mistaking
        them for boulders, people often step or
        trip on them.
    diamond:
      en: |-
        Many live on mountain trails
        and remain half buried while
        keeping an eye on climbers.
    pearl:
      en: |-
        It is impossible to distinguish from
        rocks. It slams against others in
        contests of hardness.
    platinum:
      en: |-
        At rest, it looks just like a rock.
        Carelessly stepping on it will make
        it swing its fists angrily.
    heartgold:
      en: |-
        Most people may not notice,
        but a closer look should reveal that
        there are many GEODUDE around.
    soulsilver:
      en: |-
        It uses its arms to steadily climb
        steep mountain paths. It swings
        its fists around if angered.
    black:
      en: |-
        At rest, it looks just like a rock.
        Carelessly stepping on it will make
        it swing its fists angrily.
      fr: |-
        Au repos, rien ne le distingue d’un
        vulgaire caillou. Malheur à ceux qui
        lui marchent dessus par mégarde!
    white:
      en: |-
        At rest, it looks just like a rock.
        Carelessly stepping on it will make
        it swing its fists angrily.
      fr: |-
        Au repos, rien ne le distingue d’un
        vulgaire caillou. Malheur à ceux qui
        lui marchent dessus par mégarde!
    black-2:
      en: |-
        At rest, it looks just like a rock.
        Carelessly stepping on it will make
        it swing its fists angrily.
    white-2:
      en: |-
        At rest, it looks just like a rock.
        Carelessly stepping on it will make
        it swing its fists angrily.
    x:
      ja-Hrkt: |-
        そうげんや　やまに　せいそくする。
        いしころに　にていて　きがつかずに
        ふんだり　つまずいたり　してしまう。
      ja: |-
        草原や　山に　生息する。
        石ころに　似ていて　気がつかず
        踏んだり　つまずいたりしてしまう。
      ko: |-
        초원이나 산에 서식한다.
        돌멩이와 닮은 탓에 알아채지 못하고
        밟거나 발이 걸려 넘어지기도 한다.
      en: |-
        Found in fields and mountains. Mistaking them for
        boulders, people often step or trip on them.
      fr: |-
        Il vit dans les plaines ou les montagnes.
        On le confond souvent avec un petit caillou.
      de: |-
        Wanderer stolpern in den Bergen häufig über dieses
        Pokémon, da es wie ein Stein aussieht.
      es: |-
        Aparecen en llanos y montañas. Como parecen rocas,
        la gente se tropieza con ellos o los pisa.
      it: |-
        Si trova nei campi e in montagna. Se confuso con
        una roccia, può succedere di inciamparvi.
    'y':
      ja-Hrkt: |-
        いしころと　みわけが　つかない。
        がんじょうな　からだを　なかまと
        ぶつけあい　かたさを　きそいあう。
      ja: |-
        石ころと　見分けが　つかない。
        頑丈な　体を　仲間と　ぶつけ合い
        硬さを　競い合う。
      ko: |-
        돌멩이와 구별되지 않는다.
        튼튼한 몸을 동료와
        서로 부딪쳐서 단단함을 겨룬다.
      en: |-
        It is impossible to distinguish from rocks. It slams
        against others in contests of hardness.
      fr: |-
        Son corps se fond dans la roche. Les Pokémon
        de cette espèce se bousculent au cours d’épreuves
        de force.
      de: |-
        Man kann es nicht von Felsbrocken unterscheiden.
        Es rempelt andere an, um sich zu beweisen.
      es: |-
        Es imposible distinguirlos de las rocas. Para probar su
        dureza, chocan entre sí en duelo.
      it: |-
        È impossibile distinguerlo dalle rocce. Si scaglia
        contro gli altri per vedere chi è più duro.
    omega-ruby:
      ja-Hrkt: |-
        ながいきの　イシツブテほど　からだの　かどは
        けずれ　まるくなっていくが　きもちは　いつまでも
        ごつごつ　とがって　あらあらしいのだ。
      ja: |-
        長生きの　イシツブテほど　体の　角は
        削れ　丸くなっていくが　気持ちは　いつまでも
        ごつごつ　とがって　荒々しいのだ。
      ko: |-
        오래 산 꼬마돌일수록 몸의 모난 부분이
        깎여 둥그렇게 되지만 마음은 언제까지나
        울퉁불퉁 뾰족하고 거칠다.
      en: |-
        The longer a Geodude lives, the more its edges are chipped
        and worn away, making it more rounded in appearance.
        However, this Pokémon’s heart will remain hard, craggy,
        and rough always.
      fr: |-
        Lorsqu’un Racaillou prend de l’âge, ses bords s’ébrèchent
        et s’usent, ce qui lui donne une apparence plus ronde.
        Cependant, le cœur de ce Pokémon reste dur, rocailleux
        et rugueux.
      de: |-
        Je länger ein Kleinstein lebt, desto mehr wird seine raue
        Oberfläche abgeschliffen, sodass es runder wird. Das Herz
        dieses Pokémon bleibt aber für immer versteinert, hart und rau.
      es: |-
        Cuanto más larga es la vida de Geodude, mayor es el desgaste
        y la erosión que sufre, y más redondeada la forma que va
        adquiriendo. Sin embargo, el corazón permanece siempre duro,
        rocoso y tosco.
      it: |-
        Col passare del tempo, i profili di Geodude diventano
        sempre più levigati, rendendolo più tondeggiante.
        Tuttavia il cuore di questo Pokémon rimane sempre duro,
        ruvido e roccioso.
    alpha-sapphire:
      ja-Hrkt: |-
        じめんに　はんぶん　うまり　ぐっすり　ねむる。
        とざんしゃに　ふまれても　まったく　おきないよ。
        あさ　エサを　さがして　さかを　ころがりおちる。
      ja: |-
        地面に　半分　埋まり　ぐっすり　眠る。
        登山者に　踏まれても　まったく　起きないよ。
        朝　エサを　探して　坂を　転がり落ちる。
      ko: |-
        땅에 반쯤 박혀서 푹 잠잔다.
        등산 중인 사람에게 밟혀도 전혀 깨지 않는다.
        아침에 먹이를 찾아 언덕을 굴러 내려온다.
      en: |-
        When Geodude sleeps deeply, it buries itself halfway into the
        ground. It will not awaken even if hikers step on it unwittingly.
        In the morning, this Pokémon rolls downhill in search of food.
      fr: |-
        Pour dormir profondément, Racaillou s’enterre à moitié
        dans le sol. Il ne se réveille pas, même si des randonneurs
        lui marchent dessus. Au petit matin, ce Pokémon roule en
        contrebas en quête de nourriture.
      de: |-
        Wenn Kleinstein tief und fest schläft, gräbt es sich selbst
        zur Hälfte im Boden ein. Selbst wenn Wanderer versehentlich
        auf Kleinstein treten, wacht es nicht auf. Am Morgen rollt es
        auf der Suche nach Nahrung den Berg herunter.
      es: |-
        Cuando Geodude duerme profundamente, se entierra a
        medias en el suelo y no se despierta ni aunque lo pisen sin
        querer. Por la mañana, se dedica a buscar comida rodando
        ladera abajo.
      it: |-
        Quando Geodude dorme profondamente si nasconde
        parzialmente nel terreno. Non si sveglia neanche se i passanti
        lo calpestano involontariamente. La mattina questo Pokémon
        rotola a valle in cerca di cibo.
    sun:
      ja-Hrkt: |-
        まるく　もちやすいが　なげあうには
        かたくて　おもい。　ゆきだまの　ように
        ぶつけあって　あそぶには　キケンだ。
      ja: |-
        丸く　持ちやすいが　投げあうには
        硬くて　重い。　雪玉の　ように
        ぶつけあって　遊ぶには　キケンだ。
      ko: |-
        동글고 들기 쉽지만 서로 던지기에는
        딱딱하고 무겁다. 눈싸움처럼
        서로 맞히며 놀기에는 위험하다.
      zh-Hant: |-
        圓圓的很容易拿在手裡，
        但要拿來互相投擲的話就太硬太重了。
        像打雪仗般互相投擲的話是很危險的。
      zh-Hans: |-
        圆圆的很容易拿，
        但要互相扔的话，又硬又重。
        像打雪仗那样扔着玩会很危险。
      en: |-
        Its round body makes it easy to pick up,
        but it is hard and heavy. It’s dangerous
        to play with them as if they were snowballs.
      fr: |-
        Il est rond comme une balle, mais aussi très
        dur et lourd. Mieux vaut ne pas le lancer sur
        quelqu’un comme si c’était une boule de neige.
      de: |-
        Trotz seiner griffigen, runden Form ist Kleinstein
        hart und schwer. Bewirft man sich damit wie
        mit Schneebällen, besteht Verletzungsgefahr!
      es: |-
        Aunque su forma invita a lanzarlo cual bola de
        nieve, su peso y dureza hacen de esta una
        actividad de riesgo nada recomendable.
      it: |-
        La forma arrotondata lo rende facilmente
        afferrabile, ma è duro e pesante. Lanciarlo
        come se fosse una palla di neve è pericoloso.
    moon:
      ja-Hrkt: |-
        そこらのみちばたに　いくらでも　いる。
        ヒマな　がくしゃが　かぞえてみたら
        １つのどうろに　１００ぴき　いた。
      ja: |-
        そこらの道端に　いくらでも　いる。
        ヒマな　学者が　数えてみたら
        １つの道路に　１００匹　いた。
      ko: |-
        길가에서 흔히 볼 수 있다.
        한가한 학자가 세어봤더니
        하나의 도로에 100마리가 있었다.
      zh-Hant: |-
        在路邊隨處可見。
        有空的學者試著數了一下，
        光是１條路上就有１００隻。
      zh-Hans: |-
        那儿的路边要多少有多少。
        有空的学者试着数了数，
        １条路上有１００只。
      en: |-
        There are plenty of them to be found along any
        road. A scholar with too much free time once
        counted a hundred of them along a single route.
      fr: |-
        On en trouve en masse sur le bas-côté des
        routes. Un universitaire qui s’ennuyait en a
        dénombré une centaine sur la même route.
      de: |-
        Man findet sie in rauen Mengen am Straßenrand.
        Ein Forscher hat in seiner Freizeit auf einer
        Straße einmal 100 Exemplare gezählt.
      es: |-
        Se encuentran en masa en las cunetas de los
        caminos. Un investigador con mucho tiempo libre
        llegó a contar una vez una centena de Geodude.
      it: |-
        Se ne trovano spesso in gran numero ai lati delle
        strade. Uno studioso senza nulla di meglio da
        fare ne ha contati 100 in un certo percorso.
    ultra-sun:
      ja-Hrkt: |-
        ながく　いきた　イシツブテは　かどが
        とれて　まんまる。　せいかくも　とても
        おちついていて　おだやか　なのだ。
      ja: |-
        長く　生きた　イシツブテは　角が
        とれて　まんまる。　性格も　とても
        落ち着いていて　穏やか　なのだ。
      ko: |-
        오래 산 꼬마돌은 모가 없이
        동그랗다. 성격도 매우
        차분하고 온화하다.
      zh-Hant: |-
        活得久的小拳石身上的稜角
        會被磨平而變得圓滾滾的，
        性格也會變得穩重而隨和。
      zh-Hans: |-
        活了很久的小拳石在身上的角
        被磨平后会变得圆滚滚的。
        性格也非常的冷静平稳。
      en: |-
        Geodude that have lived a long life have had all
        their edges smoothed out until they’re totally
        round. They also have a calm, quiet disposition.
      fr: |-
        Les aspérités de Racaillou s’adoucissent au fil
        des années, tout comme sa personnalité.
        Il devient tout lisse, tout rond, et tout calme.
      de: |-
        Mit dem Alter verliert es zunehmend seine
        Kantigkeit, bis es vollkommen rund und auch
        charakterlich immer ausgeglichener wird.
      es: |-
        Con la edad, su temperamento se amansa y su
        cuerpo se va alisando hasta adquirir una forma
        completamente redonda.
      it: |-
        Col passare degli anni le asperità del suo corpo
        vengono levigate, rendendolo perfettamente
        rotondo, e il suo carattere si fa più tranquillo.
    ultra-moon:
      ja-Hrkt: |-
        りょうてを　つかい　けわしい　がけを
        のぼる。　そのすがたを　みた　ひとが
        ボルダリングを　はじめたらしい。
      ja: |-
        両手を　使い　険しい　崖を
        登る。　その姿を　見た　人が
        ボルダリングを　始めたらしい。
      ko: |-
        양손을 사용해서 험한 절벽을
        오른다. 그 모습을 본 사람이
        볼더링을 시작했다고 한다.
      zh-Hant: |-
        會用雙手攀登險峻的山崖。
        人們似乎是在目睹牠那姿態之後
        才開始了抱石攀岩運動。
      zh-Hans: |-
        会用双手登上险峻的悬崖。
        人们好像是在看到它那身姿之后，
        才开始了抱石攀岩运动。
      en: |-
        It uses both hands to climb precipitous cliffs.
        People who see it in action have been known to
        take up bouldering.
      fr: |-
        Il grimpe les côtes escarpées à mains nues.
        C’est en le voyant à l’œuvre que des humains
        se sont mis à l’escalade de bloc.
      de: |-
        Mit den Armen erklimmt es selbst steile Hänge.
        Unter den Menschen soll diese Klettermethode
        Vorbild für den Bouldersport gewesen sein.
      es: |-
        Escala a manos desnudas las pendientes de las
        montañas. Al parecer, esta fue la fuente de
        inspiración para la práctica de la escalada libre.
      it: |-
        Scala pareti scoscese a mani nude.
        Si dice che la pratica del bouldering sia stata
        ispirata da questo Pokémon.
    lets-go-pikachu:
      ja-Hrkt: |-
        やまみち　などに　おおく　せいそく。
        きづかずに　ふみつけると
        おこりだすので　ようちゅういだ。
      ja: |-
        山道　などに　多く　生息。
        気づかずに　踏みつけると
        怒りだすので　要注意だ。
      ko: |-
        산길 등에 많이 서식한다.
        실수로 밟으면
        화를 내므로 주의가 필요하다.
      zh-Hant: |-
        大量棲息在山路之類的地方。
        不小心踩到牠會讓牠生氣，
        所以走路的時候要小心。
      zh-Hans: |-
        大多栖息于山路。由于
        不留神踩到它会使它
        大发雷霆，得多加小心。
      en: |-
        Commonly found near mountain trails and
        the like. If you step on one by accident,
        it gets angry.
      fr: |-
        On en trouve près des sentiers de montagne.
        Si vous marchez dessus par inadvertance,
        ils s’énervent et attaquent.
      de: |-
        Es hält sich gern in der Nähe von Gebirgspfaden
        auf. Tritt man versehentlich auf eins, wird es sehr
        wütend. Deshalb ist höchste Vorsicht geboten.
      es: |-
        Se suele encontrar en senderos de montaña y
        sitios parecidos. Conviene andar con cuidado
        para no pisarlo sin querer y provocar su enfado.
      it: |-
        Lo si può trovare vicino ai sentieri di montagna.
        Bisogna fare attenzione a non calpestarlo per
        sbaglio, altrimenti diventa furioso.
    lets-go-eevee:
      ja-Hrkt: |-
        やまみち　などに　おおく　せいそく。
        きづかずに　ふみつけると
        おこりだすので　ようちゅういだ。
      ja: |-
        山道　などに　多く　生息。
        気づかずに　踏みつけると
        怒りだすので　要注意だ。
      ko: |-
        산길 등에 많이 서식한다.
        실수로 밟으면
        화를 내므로 주의가 필요하다.
      zh-Hant: |-
        大量棲息在山路之類的地方。
        不小心踩到牠會讓牠生氣，
        所以走路的時候要小心。
      zh-Hans: |-
        大多栖息于山路。由于
        不留神踩到它会使它
        大发雷霆，得多加小心。
      en: |-
        Commonly found near mountain trails and
        the like. If you step on one by accident,
        it gets angry.
      fr: |-
        On en trouve près des sentiers de montagne.
        Si vous marchez dessus par inadvertance,
        ils s’énervent et attaquent.
      de: |-
        Es hält sich gern in der Nähe von Gebirgspfaden
        auf. Tritt man versehentlich auf eins, wird es sehr
        wütend. Deshalb ist höchste Vorsicht geboten.
      es: |-
        Se suele encontrar en senderos de montaña y
        sitios parecidos. Conviene andar con cuidado
        para no pisarlo sin querer y provocar su enfado.
      it: |-
        Lo si può trovare vicino ai sentieri di montagna.
        Bisogna fare attenzione a non calpestarlo per
        sbaglio, altrimenti diventa furioso.
