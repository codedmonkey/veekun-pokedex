jellicent:
  base_happiness: 50
  capture_rate: 60
  color: white
  egg_groups:
    - indeterminate
  evolution_chain: frillish
  evolves_from: frillish
  flavor_text:
    black:
      en: |-
        The fate of the ships and crew that
        wander into Jellicent’s habitat:
        all sunken, all lost, all vanished.
      fr: |-
        Les bateaux qui s’aventurent sur
        son territoire coulent, et Moyade
        aspire l’énergie vitale des marins.
    white:
      en: |-
        They propel themselves by expelling
        absorbed seawater from their bodies.
        Their favorite food is life energy.
      fr: |-
        Il se déplace en projetant l’eau de mer
        qu’il accumule dans son corps. Son plat
        préféré est l’énergie vitale.
    black-2:
      en: |-
        Its body is mostly seawater.
        It’s said there’s a castle of ships
        Jellicent have sunk on the seafloor.
    white-2:
      en: |-
        Its body is mostly seawater.
        It’s said there’s a castle of ships
        Jellicent have sunk on the seafloor.
    x:
      ja-Hrkt: |-
        からだの　ほとんどが　かいすい。
        かいていには　ブルンゲルが　しずめた
        ふねで　できた　しろが　あるという。
      ja: |-
        体の　ほとんどが　海水。
        海底には　ブルンゲルが　沈めた
        船で　できた　城が　あるという。
      ko: |-
        몸 대부분이 해수다.
        해저에는 탱탱겔이 가라앉힌
        배로 만들어진 성이 있다고 한다.
      en: |-
        Its body is mostly seawater. It’s said there’s a
        castle of ships Jellicent have sunk on the seafloor.
      fr: |-
        Il est presque entièrement fait d’eau de mer.
        On dit qu’il vit dans un palais fait des épaves des
        bateaux qu’il a coulés.
      de: |-
        Es heißt, am Meeresboden gebe es einen Palast
        aus Schiffen, die es versenkt hat. Es besteht fast
        nur aus Meerwasser.
      es: |-
        Su cuerpo se compone de agua salada. Dicen que ha
        construido un palacio en el fondo del mar con restos
        de barcos.
      it: |-
        È composto per lo più d’acqua marina. Dicono che
        si sia costruito un castello con i relitti delle navi che
        ha affondato.
    'y':
      ja-Hrkt: |-
        ブルンゲルの　すみかに　まよいこんだ
        ふねは　しずめられて　のりくみいんの
        いのちは　すいとられて　しまうのだ。
      ja: |-
        ブルンゲルの　住処に　迷いこんだ
        船は　沈められて　乗組員の　命は
        吸い取られて　しまうのだ。
      ko: |-
        탱탱겔의 거처로 길을 잃고
        들어간 배는 가라앉으며 승무원의
        생명이 흡수되어 버린다.
      en: |-
        The fate of the ships and crew that wander into
        Jellicent’s habitat: all sunken, all lost, all vanished.
      fr: |-
        Les bateaux qui s’aventurent sur son territoire
        coulent, et Moyade aspire l’énergie vitale des marins.
      de: |-
        Dringt ein Schiff in sein Revier ein, bringt es dieses
        zum Kentern und saugt die Lebensenergie aus der
        Besatzung.
      es: |-
        Jellicent hunde los barcos que acaban perdidos en su
        territorio y absorbe la energía vital de su tripulación.
      it: |-
        Affonda le sfortunate navi che si avventurano nel
        suo territorio e consuma l’energia dell’equipaggio.
    omega-ruby:
      ja-Hrkt: |-
        からだの　ほとんどが　かいすい。
        かいていには　ブルンゲルが　しずめた
        ふねで　できた　しろが　あるという。
      ja: |-
        体の　ほとんどが　海水。
        海底には　ブルンゲルが　沈めた
        船で　できた　城が　あるという。
      ko: |-
        몸 대부분이 해수다.
        해저에는 탱탱겔이 가라앉힌
        배로 만들어진 성이 있다고 한다.
      en: |-
        Its body is mostly seawater. It’s said there’s a
        castle of ships Jellicent have sunk on the seafloor.
      fr: |-
        Il est presque entièrement fait d’eau de mer. On dit qu’il vit
        dans un palais fait des épaves des bateaux qu’il a coulés.
      de: |-
        Es heißt, am Meeresboden gebe es einen Palast aus Schiffen,
        die es versenkt hat. Es besteht fast nur aus Meerwasser.
      es: |-
        Su cuerpo se compone de agua salada. Dicen que ha
        construido un palacio en el fondo del mar con restos de
        barcos.
      it: |-
        È composto per lo più d’acqua marina. Dicono che si sia
        costruito un castello con i relitti delle navi che ha affondato.
    alpha-sapphire:
      ja-Hrkt: |-
        ブルンゲルの　すみかに　まよいこんだ
        ふねは　しずめられて　のりくみいんの
        いのちは　すいとられて　しまうのだ。
      ja: |-
        ブルンゲルの　住処に　迷いこんだ
        船は　沈められて　乗組員の　命は
        吸い取られて　しまうのだ。
      ko: |-
        탱탱겔의 거처로 길을 잃고
        들어간 배는 가라앉으며 승무원의
        생명이 흡수되어 버린다.
      en: |-
        The fate of the ships and crew that wander into
        Jellicent’s habitat: all sunken, all lost, all vanished.
      fr: |-
        Les bateaux qui s’aventurent sur son territoire coulent,
        et Moyade aspire l’énergie vitale des marins.
      de: |-
        Dringt ein Schiff in sein Revier ein, bringt es dieses zum
        Kentern und saugt die Lebensenergie aus der Besatzung.
      es: |-
        Jellicent hunde los barcos que acaban perdidos en su
        territorio y absorbe la energía vital de su tripulación.
      it: |-
        Affonda le sfortunate navi che si avventurano nel suo territorio
        e consuma l’energia dell’equipaggio.
    ultra-sun:
      ja-Hrkt: |-
        ごうかきゃくせんや　タンカーの
        まわりに　つきまとい　えものを
        ひきずりこもうと　ねらっている。
      ja: |-
        豪華客船や　タンカーの
        周りに　つきまとい　獲物を
        引きずりこもうと　狙っている。
      ko: |-
        여객선이나 유조선
        주위를 맴돌며 먹이를
        끌어들이기 위해 노리고 있다.
      zh-Hant: |-
        經常纏著豪華客輪
        或是油輪不放，
        目的是把獵物拖進海裡。
      zh-Hans: |-
        会缠着豪华客轮或是油轮周围，
        目的是将猎物拖进海里。
      en: |-
        Jellicent is always hanging around fancy cruise
        ships and tankers, hoping to drag away its prey.
      fr: |-
        On le trouve souvent près des bateaux de
        croisière et des pétroliers, où il cherche
        des proies à entraîner dans les abysses.
      de: |-
        Dieses Pokémon schwimmt Kreuzfahrtschiffen
        und Tankern hinterher. Bei Gelegenheit zieht es
        Beute zu sich ins Meer.
      es: |-
        Se dedica a perseguir petroleros y cruceros, al
        acecho de presas que arrastrar al fondo del
        mar.
      it: |-
        Lo si incontra spesso vicino a navi da crociera
        e petroliere in cerca di nuove prede da
        trascinare via con sé.
    ultra-moon:
      ja-Hrkt: |-
        りょうしが　おそれる　そんざい。
        うみに　ひきずりこみ　いのちを
        うばうと　ウワサ　されている。
      ja: |-
        漁師が　恐れる　存在。
        海に　引きずりこみ　命を
        奪うと　ウワサ　されている。
      ko: |-
        어부들이 두려워하는 존재다.
        바다로 끌고 들어가 목숨을
        빼앗아간다는 소문이 있다.
      zh-Hant: |-
        漁夫們對牠十分恐懼。
        傳說中牠會把漁夫拖進海裡，
        奪走他們的性命。
      zh-Hans: |-
        它是令渔夫恐惧的存在。
        传说，它会将渔夫拖入海中，
        夺走对方的性命。
      en: |-
        Fishermen are terrified of Jellicent.
        It’s rumored to drag them into the sea
        and steal their lives away.
      fr: |-
        On raconte que ce Pokémon, redouté par
        les marins, ôte la vie de ses proies en les
        entraînant dans les abysses.
      de: |-
        Von Fischern wird es gefürchtet. Man sagt,
        es würde Menschen in die Tiefen des Meeres
        hinabzerren und ihnen das Leben rauben.
      es: |-
        Corre el rumor de que este Pokémon, tan temido
        por los marineros, es capaz de arrastrar a su
        presa al fondo del mar.
      it: |-
        È molto temuto dai pescatori.
        Si dice che trascini in mare le prede
        per rubarne l’energia vitale.
    sword:
      ja-Hrkt: |-
        からだの　ほとんどが　かいすいと
        おなじ　せいぶんで　できている。
        ちんぼつせんを　ねじろにする。
      ja: |-
        体の　ほとんどが　海水と
        同じ　成分で　できている。
        沈没船を　根城にする。
      ko: |-
        몸의 대부분이 바닷물과
        같은 성분으로 이루어져 있다.
        침몰선을 거처로 삼는다.
      zh-Hant: |-
        身體的絕大部分都由
        與海水相同的成分組成。
        會把沉船當成自己的城堡。
      zh-Hans: |-
        身体的绝大部分都由
        与海水相同的成分组成。
        会把沉船当成自己的城堡。
      en: |-
        Most of this Pokémon’s body composition is
        identical to sea water. It makes sunken ships
        its lair.
      fr: |-
        Son corps est composé presque entièrement
        d’une substance identique à l’eau de mer.
        Les épaves de navires sont ses bastions.
      de: |-
        Sein Körper besteht zum größten Teil aus den
        gleichen Elementen wie Meerwasser. Es nutzt
        versunkene Schiffe als Basis.
      es: |-
        Su cuerpo está compuesto en su mayor parte
        de agua salada. Crea su guarida con navíos
        hundidos.
      it: |-
        Il suo corpo è costituito per la maggior parte
        dagli stessi elementi che compongono l’acqua
        marina. Si serve dei relitti delle navi come tana.
    shield:
      ja-Hrkt: |-
        まんげつに　なると　むれを　ひきつれ
        かいめんに　すがたを　みせる。
        えものが　くるのを　まっているのだ。
      ja: |-
        満月に　なると　群れを　引き連れ
        海面に　姿を　見せる。
        獲物が　来るのを　待っているのだ。
      ko: |-
        보름달이 뜨면 무리를 거느리고
        해수면에 모습을 드러낸다.
        먹이가 오기를 기다리는 것이다.
      zh-Hant: |-
        每到滿月時，胖嘟嘟會
        成群結隊地來到海面上。
        這麼做是為了等待獵物上門。
      zh-Hans: |-
        每到满月时，胖嘟嘟会
        成群结队地来到海面上。
        这么做是为了等待猎物上门。
      en: |-
        Whenever a full moon hangs in the night sky,
        schools of Jellicent gather near the surface of
        the sea, waiting for their prey to appear.
      fr: |-
        Les nuits de pleine lune, ils se réunissent
        à la surface de la mer pour attendre leurs proies.
      de: |-
        Bei Vollmond treiben Apoquallyp in Schwärmen
        an die Meeresoberfläche und lauern dort ihrer
        Beute auf.
      es: |-
        Las noches de luna llena, bancos enteros de
        Jellicent emergen a la superficie y aguardan la
        llegada de alguna presa incauta.
      it: |-
        Nelle notti di luna piena emergono in massa,
        rendendosi visibili sulla superficie del mare,
        in attesa di prede.
