boldore:
  base_happiness: 50
  capture_rate: 120
  color: blue
  egg_groups:
    - mineral
  evolution_chain: roggenrola
  evolves_from: roggenrola
  flavor_text:
    black:
      en: |-
        When it overflows with power,
        the orange crystal on its body glows.
        It looks for underground water in caves.
      fr: |-
        Quand il est gonflé à bloc, ses cristaux
        orangés scintillent. Il cherche de l’eau
        souterraine dans les grottes.
    white:
      en: |-
        Because its energy was too great to be
        contained, the energy leaked and formed
        orange crystals.
      fr: |-
        L’énergie de son corps qu’il ne parvient
        pas à retenir s’écoule à l’extérieur et
        forme des cristaux orangés.
    black-2:
      en: |-
        When it is healthy, its core sticks out.
        Always facing the same way, it swiftly
        moves front to back and left to right.
    white-2:
      en: |-
        When it is healthy, its core sticks out.
        Always facing the same way, it swiftly
        moves front to back and left to right.
    x:
      ja-Hrkt: |-
        たいないに　おさまりきらずに
        もれだした　エネルギーが　かたまり
        オレンジいろの　けっしょうになった。
      ja: |-
        体内に　収まりきらず　漏れ出した
        エネルギーが　固まり
        オレンジ色の　結晶になった。
      ko: |-
        체내에서 처리되지 못하고
        빠져나온 에너지가 덩어리져서
        주황색 결정이 되었다.
      en: |-
        Because its energy was too great to be contained,
        the energy leaked and formed orange crystals.
      fr: |-
        L’énergie de son corps qu’il ne parvient pas à retenir
        s’écoule à l’extérieur et forme des cristaux orangés.
      de: |-
        Energie, die ungehindert aus seinem Körper austrat,
        hat sich an ihm zu orangefarbenen Kristallen verfestigt.
      es: |-
        La energía que no puede contener en el interior de
        su cuerpo se escapa formando cristales naranjas.
      it: |-
        L’energia sovrabbondante cerca sfogo all’esterno
        del corpo e si solidifica formando cristalli di colore
        arancione.
    'y':
      ja-Hrkt: |-
        げんきだと　コアが　とびだしてくる。
        からだの　むきを　かえることなく
        ぜんごさゆうに　すばやく　うごける。
      ja: |-
        元気だと　コアが　飛びだしてくる。
        体の　向きを　変えることなく
        前後左右に　素早く　動ける。
      ko: |-
        기운이 넘치면 핵이 튀어나온다.
        몸의 방향을 바꾸지 않고
        전후좌우로 재빠르게 움직일 수 있다.
      en: |-
        When it is healthy, its core sticks out. Always facing
        the same way, it swiftly moves front to back and left
        to right.
      fr: |-
        Quand il est en forme, son noyau devient visible.
        Il peut se déplacer dans toutes les directions sans
        se tourner.
      de: |-
        Ist es guter Dinge, kommt sein Kern zum Vorschein.
        Kann blitzschnell die Richtung ändern, ohne sich
        umdrehen zu müssen.
      es: |-
        Si se encuentra bien, deja entrever su núcleo. Puede
        cambiar rápidamente la dirección en la que avanza sin
        girarse.
      it: |-
        Se è in forma, il suo nucleo è visibile. Si sposta
        rapidamente nelle quattro direzioni senza cambiare
        orientamento.
    omega-ruby:
      ja-Hrkt: |-
        たいないに　おさまりきらずに
        もれだした　エネルギーが　かたまり
        オレンジいろの　けっしょうになった。
      ja: |-
        体内に　収まりきらず　漏れ出した
        エネルギーが　固まり
        オレンジ色の　結晶になった。
      ko: |-
        체내에서 처리되지 못하고
        빠져나온 에너지가 덩어리져서
        주황색 결정이 되었다.
      en: |-
        Because its energy was too great to be contained,
        the energy leaked and formed orange crystals.
      fr: |-
        L’énergie de son corps qu’il ne parvient pas à retenir s’écoule
        à l’extérieur et forme des cristaux orangés.
      de: |-
        Energie, die ungehindert aus seinem Körper austrat, hat sich
        an ihm zu orangefarbenen Kristallen verfestigt.
      es: |-
        La energía que no puede contener en el interior de su cuerpo
        se escapa formando cristales naranjas.
      it: |-
        L’energia sovrabbondante cerca sfogo all’esterno del corpo
        e si solidifica formando cristalli di colore arancione.
    alpha-sapphire:
      ja-Hrkt: |-
        げんきだと　コアが　とびだしてくる。
        からだの　むきを　かえることなく
        ぜんごさゆうに　すばやく　うごける。
      ja: |-
        元気だと　コアが　飛びだしてくる。
        体の　向きを　変えることなく
        前後左右に　素早く　動ける。
      ko: |-
        기운이 넘치면 핵이 튀어나온다.
        몸의 방향을 바꾸지 않고
        전후좌우로 재빠르게 움직일 수 있다.
      en: |-
        When it is healthy, its core sticks out. Always facing
        the same way, it swiftly moves front to back and left
        to right.
      fr: |-
        Quand il est en forme, son noyau devient visible. Il peut
        se déplacer dans toutes les directions sans se tourner.
      de: |-
        Ist es guter Dinge, kommt sein Kern zum Vorschein.
        Kann blitzschnell die Richtung ändern, ohne sich
        umdrehen zu müssen.
      es: |-
        Si se encuentra bien, deja entrever su núcleo. Puede cambiar
        rápidamente la dirección en la que avanza sin girarse.
      it: |-
        Se è in forma, il suo nucleo è visibile. Si sposta rapidamente
        nelle quattro direzioni senza cambiare orientamento.
    sun:
      ja-Hrkt: |-
        オレンジの　けっしょうは　エネルギーの
        かたまり。　ひとかけらで　ダンプカー
        １００だいぶんの　ねんりょうになる。
      ja: |-
        オレンジの　結晶は　エネルギーの
        塊。　ひとかけらで　ダンプカー
        １００台分の　燃料になる。
      ko: |-
        오렌지 결정은 에너지의
        덩어리다. 한 조각으로 덤프트럭
        100대분의 연료가 된다.
      zh-Hant: |-
        橙色的結晶是能量塊。
        一塊結晶可提供１００輛
        大卡車所需的燃料。
      zh-Hans: |-
        橙色的结晶是能量块。
        一块结晶可提供１００辆
        翻斗车所需的燃料。
      en: |-
        Its orange crystal is a mass of energy.
        Just one crystal fragment would provide
        enough fuel for a hundred dump trucks.
      fr: |-
        Chaque cristal orangé sur son corps est
        un condensé d’énergie pouvant fournir
        du carburant à une centaine de poids lourds.
      de: |-
        Bei seinen orangefarbenen Kristallen handelt es
        sich um verfestigte Energie. Bereits ein Splitter
        könnte 100 Kipplastern als Treibstoff reichen.
      es: |-
        Los cristales naranjas de su cuerpo son energía
        condensada. Uno solo puede suministrar
        combustible para 100 camiones.
      it: |-
        I cristalli arancioni sul suo corpo sono fatti
        di energia condensata. Un unico frammento
        potrebbe fornire carburante a 100 camion.
    moon:
      ja-Hrkt: |-
        どうくつで　ちかすいを　さがす。
        みずじたいは　とくいでは　ないので
        ちびりちびりと　ゆっくり　なめる。
      ja: |-
        洞窟で　地下水を　探す。
        水自体は　得意では　ないので
        ちびりちびりと　ゆっくり　舐める。
      ko: |-
        동굴에서 지하수를 찾는다.
        물 자체는 잘 마시지 못해서
        홀짝홀짝 천천히 핥는다.
      zh-Hant: |-
        在洞窟裡尋找地下水。
        對水的抵抗力並不好，
        所以都是一點一點慢慢舔。
      zh-Hans: |-
        在洞窟里寻找地下水。
        对水本身不是很适应，
        所以都是一点点慢慢舔。
      en: |-
        It explores caves in search of underground
        water. It’s not comfortable around water, so
        this Pokémon takes great care in lapping it up.
      fr: |-
        Il explore les grottes à la recherche de nappes
        phréatiques. L’eau étant l’une de ses faiblesses,
        il ne peut la boire que par petites lapées.
      de: |-
        Es sucht in Höhlen nach Grundwasser. Da es
        Wasser nicht gut verträgt, leckt es dieses ganz
        behutsam auf.
      es: |-
        Busca lagos subterráneos en las cuevas. Como
        le cuesta asimilar el agua, tiene que beber
        lentamente a base de lametones.
      it: |-
        Perlustra le grotte alla ricerca di falde
        sotterranee. Quando trova l’acqua, la lecca
        piano piano per poterla assorbire.
    ultra-sun:
      ja-Hrkt: |-
        からだから　あふれた　エネルギーが
        オレンジいろの　けっしょうになった。
        ダイヤモンドも　くだく　かたさだぞ。
      ja: |-
        身体から　あふれた　エネルギーが
        オレンジ色の　結晶に　なった。
        ダイヤモンドも　砕く　硬さだぞ。
      ko: |-
        몸에서 넘쳐흐르는 에너지가
        오렌지색 결정이 되었다.
        다이아몬드도 부술 정도로 견고하다.
      zh-Hant: |-
        從身體溢出的能量
        形成了橘色的結晶，
        硬度高到連鑽石都能敲碎。
      zh-Hans: |-
        从身体里溢出的能量
        变成了橙色的结晶。
        其硬度连钻石都能弄碎。
      en: |-
        The energy overflowing from its body has
        turned into orange crystals that are hard
        enough to smash diamonds.
      fr: |-
        L’énergie qui émane de son corps s’est
        transformée en cristaux orangés suffisamment
        durs pour briser le diamant.
      de: |-
        Energie, die aus seinem Körper austrat, hat sich
        zu orangefarbenen, harten Kristallen verfestigt.
        Sie können sogar Diamanten zersplittern.
      es: |-
        La energía que desprende de su cuerpo termina
        por solidificarse en cristales anaranjados, tan
        duros que pueden quebrar hasta los diamantes.
      it: |-
        L’energia che fuoriesce dal suo corpo forma dei
        cristalli arancioni talmente duri da frantumare
        anche i diamanti.
    ultra-moon:
      ja-Hrkt: |-
        オレンジの　けっしょうは　おおきな
        エネルギーの　かたまり。　かちが
        あるので　ねらわれることも　ある。
      ja: |-
        オレンジの　結晶は　大きな
        エネルギーの　塊。　価値が
        あるので　狙われることも　ある。
      ko: |-
        오렌지색 결정은 큰
        에너지의 덩어리다. 가치가
        있어 노려지는 일도 있다.
      zh-Hant: |-
        橘色的部分是大塊的
        能量結晶。因為很有價值，
        所以牠有時會被襲擊。
      zh-Hans: |-
        橙色的结晶是大大的能量块。
        因为很有价值，
        所以有时会被袭击。
      en: |-
        Its orange crystals are lumps of powerful
        energy. They’re valuable, so Boldore is
        sometimes targeted for them.
      fr: |-
        Géolithe est parfois pris pour cible à cause
        de ses cristaux orangés de grande valeur,
        formés d’énergie condensée.
      de: |-
        In den orangefarbenen Kristallen an seinem
        Körper sind große Mengen Energie gespeichert.
        Das macht sie wertvoll und heiß begehrt.
      es: |-
        Los cristales naranjas de su cuerpo son energía
        condensada. El valor que poseen es tal que lo
        convierten en un Pokémon muy codiciado.
      it: |-
        È un Pokémon molto ambito per i preziosi
        cristalli arancioni che ha sul corpo, fatti di
        energia condensata.
    sword:
      ja-Hrkt: |-
        オレンジいろの　けっしょうが
        ひかりだしたら　きをつけろ。
        エネルギーを　うちだしてくるぞ。
      ja: |-
        オレンジ色の　結晶が
        光りだしたら　気をつけろ。
        エネルギーを　撃ちだしてくるぞ。
      ko: |-
        오렌지색 결정이
        빛나기 시작하면 조심해야 한다.
        에너지를 쏘아대기 때문이다.
      zh-Hant: |-
        橘色的結晶開始發光的時候，
        一定要特別小心，因為牠
        馬上就會射出能量。
      zh-Hans: |-
        橙色的结晶开始发光的时候，
        一定特别小心，因为它
        马上就会射出能量。
      en: |-
        If you see its orange crystals start to glow, be
        wary. It’s about to fire off bursts of energy.
      fr: |-
        Mieux vaut rester sur ses gardes quand ses cristaux
        orange se mettent à briller, car cela indique
        qu’il va déchaîner son énergie pour frapper.
      de: |-
        Wenn die orangen Kristalle anfangen zu leuchten,
        ist Vorsicht vor spontanen Energieentladungen
        geboten.
      es: |-
        Cuando sus cristales anaranjados comienzan a
        brillar, conviene tener cuidado, pues es señal de
        que está a punto de liberar energía.
      it: |-
        Quando i cristalli arancioni cominciano a brillare,
        è bene fare attenzione perché è segno che
        il Pokémon sta per emettere energia.
    shield:
      ja-Hrkt: |-
        おとで　まわりの　ようすを　さぐる。
        おこらせると　からだの　むきを
        かえないまま　おってくる。
      ja: |-
        音で　まわりの　様子を　探る。
        怒らせると　体の　向きを
        変えないまま　追ってくる。
      ko: |-
        소리로 주위 상황을 살핀다.
        화나게 하면 몸의 방향을
        바꾸지 않은 채로 쫓아온다.
      zh-Hant: |-
        透過聲音來探測四周。
        要是惹牠生氣了，牠會連
        身體方向也不轉就朝你追來。
      zh-Hans: |-
        通过声音来探测四周。
        要是惹它生气了，它会连
        身体方向也不转就朝你追来。
      en: |-
        It relies on sound in order to monitor what’s in its
        vicinity. When angered, it will attack without ever
        changing the direction it’s facing.
      fr: |-
        Il sonde les environs grâce au son. Lorsqu’un
        importun le met en colère, il se lance à sa
        poursuite sans changer l’orientation de son corps.
      de: |-
        Es nimmt die Umgebung über akustische Reize
        wahr. Ärgerliche Störenfriede kann es verfolgen,
        ohne sich ihnen zuwenden zu müssen.
      es: |-
        Se vale del sonido para percibir el entorno. Si
        alguien despierta su ira, lo perseguirá sin cambiar
        la orientación del cuerpo.
      it: |-
        Perlustra la zona intorno a sé servendosi dei
        rumori. Se irritato, insegue chi lo ha importunato
        senza cambiare orientamento del corpo.
