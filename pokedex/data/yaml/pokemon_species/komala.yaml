komala:
  base_happiness: 70
  capture_rate: 45
  color: blue
  egg_groups:
    - ground
  evolution_chain: komala
  evolves_from: ~
  flavor_text:
    sun:
      ja-Hrkt: |-
        ねたまま　うまれ　ねたまま　しぬ。
        すべての　こうどうは　みている
        ゆめに　よる　ねぞう　らしい。
      ja: |-
        寝たまま　生まれ　寝たまま　死ぬ。
        すべての　行動は　みている
        夢に　よる　寝相　らしい。
      ko: |-
        잔 채 태어나고 잔 채 죽는다.
        모든 행동은 꾸고 있는
        꿈에 의한 잠버릇인 것 같다.
      zh-Hant: |-
        睡著生，睡著死。
        似乎所有的行動都是根據
        所看見的夢而引發的睡相。
      zh-Hans: |-
        睡着生，睡着死。
        似乎所有的行动都是根据
        所看见的梦而引发的睡相。
      en: |-
        It is born asleep, and it dies asleep. All its
        movements are apparently no more than the
        results of it tossing and turning in its dreams.
      fr: |-
        Il rejoint et quitte ce monde en dormant. Son
        existence se déroule comme un rêve paisible.
        Il dort du sommeil du juste toute sa vie durant.
      de: |-
        Es wird schlafend geboren und stirbt schlafend.
        Sein ganzes Leben ist ein Traum, seine einzige
        körperliche Aktivität das Umdrehen im Schlaf.
      es: |-
        Pasa la vida entera sumido en un profundo
        sueño. Toda su actividad parece reflejar los
        sueños que tiene en ese momento.
      it: |-
        Trascorre la sua intera esistenza dormendo.
        Pare che le sue azioni siano determinate
        da quello che sta sognando.
    moon:
      ja-Hrkt: |-
        だいた　きは　うまれたとき　おやから
        あたえられたもの。　よく　なつけば
        トレーナーの　うでにも　しがみつく。
      ja: |-
        抱いた　木は　生まれたとき　親から
        与えられたもの。　よく　なつけば
        トレーナーの　腕にも　しがみつく。
      ko: |-
        안고 있는 나무는 태어났을 때 부모로부터
        받은 것이다. 잘 길들이면
        트레이너의 팔에도 달라붙는다.
      zh-Hant: |-
        抱住的樹是出生時父母所贈的。
        關係親密的話，也會緊緊抱著
        訓練家的胳膊。
      zh-Hans: |-
        抱住的树干是出生时父母所给予的。
        关系亲密的话，也会紧紧抱着
        训练家的胳膊。
      en: |-
        The log it holds was given to it by its parents at
        birth. It has also been known to cling to the arm
        of a friendly Trainer.
      fr: |-
        La bûche qu’il tient est un cadeau de naissance
        de ses parents. S’il est bien apprivoisé,
        il s’accrochera au bras de son Dresseur.
      de: |-
        Den Baumstumpf bekam es zu seiner Geburt
        von seinen Eltern. Fasst es Zutrauen, klammert
        es sich aber auch am Arm seines Trainers fest.
      es: |-
        El tronco que agarra es un regalo que le dieron
        sus padres al nacer. También se aferra al brazo
        de todo aquel Entrenador con el que congenie.
      it: |-
        Il tronco che ha con sé è un dono dei genitori
        ricevuto alla nascita. Quando è molto affezionato
        al proprio Allenatore, si aggrappa al suo braccio.
    ultra-sun:
      ja-Hrkt: |-
        うまれてから　ずっと　ねむったまま。
        ふかい　ねむりに　おちているときは
        いっさい　うごかなくなる。
      ja: |-
        生まれてから　ずっと　眠ったまま。
        深い　眠りに　落ちているときは
        一切　動かなくなる。
      ko: |-
        태어날 때부터 계속 자고 있다.
        깊은 수면에 빠져 있을 때는
        일체 움직이지 않는다.
      zh-Hant: |-
        從出生那刻起就一直在睡覺。
        當進入深度睡眠的時候，
        會變得完全靜止不動。
      zh-Hans: |-
        出生后就一直都睡着。
        进入深度睡眠的时候，
        会变的一动也不动。
      en: |-
        It stays asleep from the moment it’s born.
        When it falls into a deep sleep, it stops
        moving altogether.
      fr: |-
        Il dort continuellement depuis sa naissance.
        Lorsqu’il est en phase de sommeil profond,
        il ne bouge plus d’un poil.
      de: |-
        Vom Augenblick seiner Geburt an verbringt es
        sein ganzes Leben schlafend. Wenn es extrem
        tief schläft, wird es völlig regungslos.
      es: |-
        Duerme continuamente desde que nace. Cuando
        el sueño en el que está sumido es especialmente
        profundo, se queda inmóvil.
      it: |-
        Dorme ininterrottamente fin dalla nascita.
        Quando il suo sonno è particolarmente profondo
        rimane completamente immobile.
    ultra-moon:
      ja-Hrkt: |-
        しぬまで　ずっと　ねむったままなのは
        エサの　はっぱに　ますいの　ような
        せいぶんが　ふくまれているからだ。
      ja: |-
        死ぬまで　ずっと　眠ったままなのは
        エサの　葉っぱに　麻酔の　ような
        成分が　含まれているからだ。
      ko: |-
        죽을 때까지 계속 잠들어 있는 이유는
        먹이인 잎사귀에 마취 성분이
        포함되어 있기 때문이다.
      zh-Hant: |-
        終其一生都處於睡著的狀態。
        這是因為牠所吃的葉子裡
        含有類似麻醉藥的成分。
      zh-Hans: |-
        到死都一直是睡着的状态，
        是因为吃的叶子里含有
        类似麻醉药的成分。
      en: |-
        It remains asleep from birth to death as a result
        of the sedative properties of the leaves that
        form its diet.
      fr: |-
        Ce Pokémon passe sa vie entière à dormir
        à cause des composants anesthésiants qui
        se trouvent dans les feuilles qu’il mange.
      de: |-
        Es verbringt sein Leben schlafend, bis es stirbt.
        Das liegt an den narkotisierenden Wirkstoffen,
        die in den Blättern enthalten sind, die es frisst.
      es: |-
        El motivo de su letargo vitalicio es la sustancia
        somnífera que contienen las hojas de las que
        se alimenta.
      it: |-
        Poiché le foglie di cui si nutre contengono una
        sostanza soporifera, Komala trascorre la sua
        intera vita dormendo.
