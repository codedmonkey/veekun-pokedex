galvantula:
  base_happiness: 50
  capture_rate: 75
  color: yellow
  egg_groups:
    - bug
  evolution_chain: joltik
  evolves_from: joltik
  flavor_text:
    black:
      en: |-
        When attacked, they create an
        electric barrier by spitting out
        many electrically charged threads.
      fr: |-
        Quand on l’attaque, il projette une
        multitude de fils électrifiés pour
        créer une barrière électrique.
    white:
      en: |-
        They employ an electrically charged web
        to trap their prey. While it is immobilized
        by shock, they leisurely consume it.
      fr: |-
        Il tend des pièges avec ses fils
        électriques. Il déguste tranquillement
        ses proies une fois électrocutées.
    black-2:
      en: |-
        It creates barriers from electrified silk
        that stun foes. This works as a weapon
        as well as a defense.
    white-2:
      en: |-
        It creates barriers from electrified silk
        that stun foes. This works as a weapon
        as well as a defense.
    x:
      ja-Hrkt: |-
        でんきを　おびた　いとで　わなを
        しかける。かんでんして　うごけない
        えものを　ゆっくりと　いただくのだ。
      ja: |-
        電気を　帯びた　糸で　ワナを
        仕掛ける。感電して　動けない　獲物を
        ゆっくりと　いただくのだ。
      ko: |-
        전기를 띤 실로 함정을 설치한다.
        감전돼서 움직이지 못하는
        먹이를 천천히 먹어치운다.
      en: |-
        They employ an electrically charged web to trap
        their prey. While it is immobilized by shock,
        they leisurely consume it.
      fr: |-
        Il tend des pièges avec ses fils électriques.
        Il déguste tranquillement ses proies une fois
        électrocutées.
      de: |-
        Lässt seine Beute in elektrisch geladene Fäden
        tappen. Solang diese durch den Schock
        gelähmt ist, labt es sich an ihr.
      es: |-
        Pone trampas con hilos electrificados. De este modo,
        electrocuta a sus enemigos y los inmoviliza por
        completo.
      it: |-
        Tende trappole con fili elettrificati. Consuma poi
        con comodo le prede immobilizzate dalla scarica
        elettrica.
    'y':
      ja-Hrkt: |-
        てきに　おそわれると　でんきを
        おびた　いとを　たくさん　はきだして
        でんきの　バリアを　つくる。
      ja: |-
        敵に　襲われると　電気を　帯びた
        糸を　たくさん　吐き出して
        電気の　バリアを　作る。
      ko: |-
        상대에게 공격당하면 전기를
        띤 실을 무수히 뿜어내서
        전기 배리어를 만든다.
      en: |-
        When attacked, they create an electric barrier by
        spitting out many electrically charged threads.
      fr: |-
        Quand on l’attaque, il projette une multitude de fils
        électrifiés pour créer une barrière électrique.
      de: |-
        Wird es angegriffen, spuckt es mit vielen elektrisch
        geladenen Fäden um sich und baut sich eine
        Elektrobarriere.
      es: |-
        Cuando un enemigo lo ataca, expulsa por la boca hilos
        electrificados para crear una barrera.
      it: |-
        Quando viene attaccato, espelle una rete di fili
        elettrificati per formare una barriera elettrica.
    omega-ruby:
      ja-Hrkt: |-
        でんきを　おびた　いとで　わなを
        しかける。かんでんして　うごけない
        えものを　ゆっくりと　いただくのだ。
      ja: |-
        電気を　帯びた　糸で　ワナを
        仕掛ける。感電して　動けない　獲物を
        ゆっくりと　いただくのだ。
      ko: |-
        전기를 띤 실로 함정을 설치한다.
        감전돼서 움직이지 못하는
        먹이를 천천히 먹어치운다.
      en: |-
        They employ an electrically charged web to trap
        their prey. While it is immobilized by shock,
        they leisurely consume it.
      fr: |-
        Il tend des pièges avec ses fils électriques. Il déguste
        tranquillement ses proies une fois électrocutées.
      de: |-
        Lässt seine Beute in elektrisch geladene Fäden tappen. Solang
        diese durch den Schock gelähmt ist, labt es sich an ihr.
      es: |-
        Pone trampas con hilos electrificados. De este modo,
        electrocuta a sus enemigos y los inmoviliza por completo.
      it: |-
        Tende trappole con fili elettrificati. Consuma poi con comodo
        le prede immobilizzate dalla scarica elettrica.
    alpha-sapphire:
      ja-Hrkt: |-
        てきに　おそわれると　でんきを
        おびた　いとを　たくさん　はきだして
        でんきの　バリアを　つくる。
      ja: |-
        敵に　襲われると　電気を　帯びた
        糸を　たくさん　吐き出して
        電気の　バリアを　作る。
      ko: |-
        상대에게 공격당하면 전기를
        띤 실을 무수히 뿜어내서
        전기 배리어를 만든다.
      en: |-
        When attacked, they create an electric barrier by
        spitting out many electrically charged threads.
      fr: |-
        Quand on l’attaque, il projette une multitude de fils électrifiés
        pour créer une barrière électrique.
      de: |-
        Wird es angegriffen, spuckt es mit vielen elektrisch geladenen
        Fäden um sich und baut sich eine Elektrobarriere.
      es: |-
        Cuando un enemigo lo ataca, expulsa por la boca hilos
        electrificados para crear una barrera.
      it: |-
        Quando viene attaccato, espelle una rete di fili elettrificati
        per formare una barriera elettrica.
    sword:
      ja-Hrkt: |-
        でんきを　おびた　おなかの　けを
        とばして　こうげき。　けが　ささると
        みっかみばん　ぜんしんが　しびれる。
      ja: |-
        電気を　帯びた　お腹の　毛を
        飛ばして　攻撃。　毛が　刺さると
        三日三晩　全身が　痺れる。
      ko: |-
        전기를 띤 배의 털을 날려서
        공격한다. 털에 찔리면
        삼 일 밤낮으로 전신이 마비된다.
      zh-Hant: |-
        發射腹部帶電的毛來攻擊。
        要是被牠的毛刺中，
        就會全身麻痺三天三夜。
      zh-Hans: |-
        发射腹部带电的毛来攻击。
        要是被它的毛刺中，
        就会全身麻痹三天三夜。
      en: |-
        It launches electrified fur from its abdomen as its
        means of attack. Opponents hit by the fur could
        be in for three full days and nights of paralysis.
      fr: |-
        Il attaque en projetant les poils de son abdomen
        chargés en électricité. La victime reste alors
        paralysée pendant trois jours et trois nuits.
      de: |-
        Es schießt elektrisch geladene Haare von seinem
        Abdomen. Wer getroffen wird, ist drei Tage und
        Nächte am ganzen Körper gelähmt.
      es: |-
        Ataca lanzando hilos electrificados por el
        abdomen, que inmovilizan por completo al
        enemigo durante tres días y tres noches.
      it: |-
        Attacca lanciando peli carichi di elettricità
        dall’addome. Chi viene colpito rimane
        paralizzato per tre giorni interi.
    shield:
      ja-Hrkt: |-
        とぶのが　ヘタな　ヒナを　ねらい
        とりポケモンの　すの　ちかくに
        でんきの　いとで　ワナを　はるぞ。
      ja: |-
        飛ぶのが　ヘタな　ヒナを　狙い
        鳥ポケモンの　巣の　近くに
        電気の　糸で　罠を　張るぞ。
      ko: |-
        잘 날지 못하는 새끼를 노리고
        새포켓몬 둥지 가까이에
        전기로 된 실로 함정을 만든다.
      zh-Hant: |-
        為了捕捉不太會飛的幼鳥，
        會在鳥寶可夢的巢穴附近
        用帶電的絲設下陷阱。
      zh-Hans: |-
        为了捕捉不太会飞的幼鸟，
        会在鸟宝可梦的巢穴附近
        用带电的丝设下陷阱。
      en: |-
        It lays traps of electrified threads near the nests
        of bird Pokémon, aiming to snare chicks that are
        not yet good at flying.
      fr: |-
        Il piège les oisillons qui ne savent pas encore
        voler en tissant une toile électrique près des nids
        des Pokémon oiseaux.
      de: |-
        Es spinnt Fallen aus elektrischen Fäden nahe den
        Nestern von Vogel-Pokémon, um vor allem jene
        Jungen zu fangen, die nicht gut fliegen können.
      es: |-
        Teje una tela con hilo electrificado junto a los
        nidos de Pokémon pájaro para atrapar a los
        polluelos que aún no saben volar bien.
      it: |-
        Tesse trappole di fili elettrizzati vicino ai nidi
        di Pokémon alati per catturare i piccoli che
        non sanno ancora volare.
