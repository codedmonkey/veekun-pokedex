  flavor_text:
    diamond:
      en: |-
        It can learn and speak human
        words. If they gather, they all
        learn the same saying.
    pearl:
      en: |-
        It keeps rhythm by flicking its
        tail feathers like a metronome.
        It imitates human speech.
    platinum:
      en: |-
        Its tongue is just like a human’s.
        As a result, it can cleverly mimic
        human speech.
    heartgold:
      en: |-
        It mimics the cries of other Pokémon to
        trick them into thinking it’s one of them.
        This way they won’t attack it.
    soulsilver:
      en: |-
        It mimics the cries of other Pokémon to
        trick them into thinking it’s one of them.
        This way they won’t attack it.
    black:
      en: |-
        Its tongue is just like a human’s.
        As a result, it can cleverly mimic
        human speech.
      fr: |-
        Sa langue comparable à celle
        de l’homme lui permet d’imiter
        habilement le langage humain.
    white:
      en: |-
        Its tongue is just like a human’s.
        As a result, it can cleverly mimic
        human speech.
      fr: |-
        Sa langue comparable à celle
        de l’homme lui permet d’imiter
        habilement le langage humain.
    black-2:
      en: |-
        Its tongue is just like a human’s.
        As a result, it can cleverly mimic
        human speech.
    white-2:
      en: |-
        Its tongue is just like a human’s.
        As a result, it can cleverly mimic
        human speech.
    x:
      ja-Hrkt: |-
        あいてと　おなじ　なきごえを　だす
        ことで　なかまと　おもいこませて
        おそわれない　ように　しているのだ。
      ja: |-
        相手と　同じ　鳴き声を　出す　ことで
        仲間と　思いこませて
        襲われないように　しているのだ。
      ko: |-
        상대와 같은 울음소리를 내서
        동료라고 굳게 믿게 하여
        습격당하지 않도록 하고 있다.
      en: |-
        It mimics the cries of other Pokémon to trick them
        into thinking it’s one of them. This way they won’t
        attack it.
      fr: |-
        Il reproduit le cri de ses ennemis pour faire croire
        qu’il est des leurs et éviter d’être attaqué.
      de: |-
        Es versucht Attacken zu entgehen, indem es den Ruf
        des Gegners nachahmt und einen Artgenossen mimt.
      es: |-
        Imita los sonidos de sus rivales, haciéndoles creer que
        son amigos e impidiendo que le ataquen.
      it: |-
        Imita la voce dei nemici per far credere che è dei
        loro, evitando così di essere assalito.
    'y':
      ja-Hrkt: |-
        ひとの　ことばを　おぼえて　なく。
        なかまが　いっかしょに　あつまると
        みんな　おなじ　ことばを　おぼえる。
      ja: |-
        人の　言葉を　覚えて　鳴く。
        仲間が　一か所に　集まると
        みんな　同じ　言葉を　覚える。
      ko: |-
        사람의 말을 기억해서 운다.
        동료가 한 장소에 모이면
        모두 똑같은 말을 기억한다.
      en: |-
        It can learn and speak human words. If they gather,
        they all learn the same saying.
      fr: |-
        On peut lui enseigner quelques mots. S’il s’agit
        d’un groupe, ils retiendront les mêmes phrases.
      de: |-
        Es kann die menschliche Sprache nachahmen.
        Versammeln sie sich, bringen sich alle dasselbe bei.
      es: |-
        Puede imitar el lenguaje humano. Si se juntan
        varios, todos aprenden las mismas palabras.
      it: |-
        Può imparare il linguaggio umano. Se un gruppo si
        raduna, tutti imparano le stesse parole.
    omega-ruby:
      ja-Hrkt: |-
        あいてと　おなじ　なきごえを　だす
        ことで　なかまと　おもいこませて
        おそわれない　ように　しているのだ。
      ja: |-
        相手と　同じ　鳴き声を　出す　ことで
        仲間と　思いこませて
        襲われないように　しているのだ。
      ko: |-
        상대와 같은 울음소리를 내서
        동료라고 굳게 믿게 하여
        습격당하지 않도록 하고 있다.
      en: |-
        It mimics the cries of other Pokémon to trick them
        into thinking it’s one of them. This way they won’t
        attack it.
      fr: |-
        Il reproduit le cri de ses ennemis pour faire croire qu’il est
        des leurs et éviter d’être attaqué.
      de: |-
        Es versucht Attacken zu entgehen, indem es den Ruf des
        Gegners nachahmt und einen Artgenossen mimt.
      es: |-
        Imita los sonidos de sus rivales, haciéndoles creer que son
        amigos e impidiendo que le ataquen.
      it: |-
        Imita la voce dei nemici per far credere che è dei loro,
        evitando così di essere assalito.
    alpha-sapphire:
      ja-Hrkt: |-
        ひとの　ことばを　おぼえて　なく。
        なかまが　いっかしょに　あつまると
        みんな　おなじ　ことばを　おぼえる。
      ja: |-
        人の　言葉を　覚えて　鳴く。
        仲間が　一か所に　集まると
        みんな　同じ　言葉を　覚える。
      ko: |-
        사람의 말을 기억해서 운다.
        동료가 한 장소에 모이면
        모두 똑같은 말을 기억한다.
      en: |-
        It can learn and speak human words. If they gather,
        they all learn the same saying.
      fr: |-
        On peut lui enseigner quelques mots. S’il s’agit d’un groupe,
        ils retiendront les mêmes phrases.
      de: |-
        Es kann die menschliche Sprache nachahmen.
        Versammeln sie sich, bringen sich alle dasselbe bei.
      es: |-
        Puede imitar el lenguaje humano. Si se juntan varios, todos
        aprenden las mismas palabras.
      it: |-
        Può imparare il linguaggio umano. Se un gruppo si raduna,
        tutti imparano le stesse parole.
