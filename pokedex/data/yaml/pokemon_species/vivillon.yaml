vivillon:
  base_happiness: 70
  capture_rate: 45
  color: white
  egg_groups:
    - bug
  evolution_chain: scatterbug
  evolves_from: spewpa
  flavor_text:
    x:
      ja-Hrkt: |-
        せかいには　さまざまな　はねもようの
        ビビヨンがいる。すんでいる　とちの
        きこうが　えいきょうしているようだ。
      ja: |-
        世界には　さまざまな　羽模様の
        ビビヨンがいる。住んでいる　土地の
        気候が　影響しているようだ。
      ko: |-
        세계에는 다양한 무늬의 날개를 가진
        비비용이 있다. 살고 있는 곳의
        기후에 영향을 받는 것 같다.
      en: |-
        Vivillon with many different patterns are
        found all over the world. These patterns
        are affected by the climate of their habitat.
      fr: |-
        Les ailes des Prismillon arborent différents motifs
        en fonction de leur aire d’origine. Il est possible que
        le climat y soit pour quelque chose.
      de: |-
        Vivillon kommen weltweit mit den unterschiedlichsten
        Musterungen vor. Das Klima ihres Habitats hat Einfluss
        auf ihre Flügelmusterung.
      es: |-
        En el mundo existen Vivillon con diferentes motivos en
        sus alas. El clima de cada región influye en sus rasgos.
      it: |-
        Nel mondo ne esistono diverse varietà che si
        differenziano per i motivi sulle ali. Sembra che
        questi dipendano dal clima del loro habitat.
    'y':
      ja-Hrkt: |-
        すんでいる　きこうや　ふうどによって
        はねの　もようが　ちがう　ポケモン。
        いろあざやかな　りんぷんを　まく。
      ja: |-
        住んでいる　気候や　風土によって
        羽の　模様が　違う　ポケモン。
        色鮮やかな　りんぷんを　まく。
      ko: |-
        살고 있는 장소의 기후나 풍토에 따라
        날개의 모양이 다른 포켓몬이다.
        화려한 색의 날개 가루를 뿌린다.
      en: |-
        The patterns on this Pokémon’s wings
        depend on the climate and topography
        of its habitat. It scatters colorful scales.
      fr: |-
        Selon le climat de sa région d’origine, les motifs
        de ses ailes sont différents. Il sème des écailles
        aux couleurs vives.
      de: |-
        Je nach Klima und geographischer Beschaffenheit
        seines Habitats ändert sich die Musterung seiner
        Flügel. Es verstreut bunten Flügelstaub.
      es: |-
        Las alas cambian de motivo según el clima y las
        características naturales del terreno que habite.
        Esparce escamas de lo más coloridas.
      it: |-
        I motivi sulle sue ali cambiano a seconda della zona
        e del clima in cui vive. Dal suo corpo si staccano
        scaglie dai colori vivaci.
    omega-ruby:
      ja-Hrkt: |-
        せかいには　さまざまな　はねもようの
        ビビヨンがいる。すんでいる　とちの
        きこうが　えいきょうしているようだ。
      ja: |-
        世界には　さまざまな　羽模様の
        ビビヨンがいる。住んでいる　土地の
        気候が　影響しているようだ。
      ko: |-
        세계에는 다양한 무늬의 날개를 가진
        비비용이 있다. 살고 있는 곳의
        기후에 영향을 받는 것 같다.
      en: |-
        Vivillon with many different patterns are
        found all over the world. These patterns
        are affected by the climate of their habitat.
      fr: |-
        Les ailes des Prismillon arborent différents motifs en fonction
        de leur aire d’origine. Il est possible que le climat y soit
        pour quelque chose.
      de: |-
        Vivillon kommen weltweit mit den unterschiedlichsten
        Musterungen vor. Das Klima ihres Habitats hat Einfluss
        auf ihre Flügelmusterung.
      es: |-
        En el mundo existen Vivillon con diferentes motivos en sus
        alas. El clima de cada región influye en sus rasgos.
      it: |-
        Nel mondo ne esistono diverse varietà che si differenziano
        per i motivi sulle ali. Sembra che questi dipendano dal clima
        del loro habitat.
    alpha-sapphire:
      ja-Hrkt: |-
        すんでいる　きこうや　ふうどによって
        はねの　もようが　ちがう　ポケモン。
        いろあざやかな　りんぷんを　まく。
      ja: |-
        住んでいる　気候や　風土によって
        羽の　模様が　違う　ポケモン。
        色鮮やかな　りんぷんを　まく。
      ko: |-
        살고 있는 장소의 기후나 풍토에 따라
        날개의 모양이 다른 포켓몬이다.
        화려한 색의 날개 가루를 뿌린다.
      en: |-
        The patterns on this Pokémon’s wings
        depend on the climate and topography
        of its habitat. It scatters colorful scales.
      fr: |-
        Selon le climat de sa région d’origine, les motifs de ses ailes
        sont différents. Il sème des écailles aux couleurs vives.
      de: |-
        Je nach Klima und geographischer Beschaffenheit seines
        Habitats ändert sich die Musterung seiner Flügel. Es verstreut
        bunten Flügelstaub.
      es: |-
        Las alas cambian de motivo según el clima y las características
        naturales del terreno que habite. Esparce escamas de lo más
        coloridas.
      it: |-
        I motivi sulle sue ali cambiano a seconda della zona e del
