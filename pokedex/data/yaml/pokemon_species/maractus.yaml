maractus:
  base_happiness: 50
  capture_rate: 255
  color: green
  egg_groups:
    - plant
  evolution_chain: maractus
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        It uses an up-tempo song and dance
        to drive away the bird Pokémon that
        prey on its flower seeds.
      fr: |-
        Avec une danse et des sons saccadés,
        il fait fuir ses prédateurs, les Pokémon
        Oiseaux dévoreurs de graines de fleur.
    white:
      en: |-
        Arid regions are their habitat.
        They move rhythmically, making
        a sound similar to maracas.
      fr: |-
        Il vit dans les endroits secs.
        Quand il bouge son corps en rythme,
        il fait un bruit de maracas.
    black-2:
      en: |-
        When it moves rhythmically,
        it makes a sound similar to maracas,
        making the surprised Pokémon flee.
    white-2:
      en: |-
        When it moves rhythmically,
        it makes a sound similar to maracas,
        making the surprised Pokémon flee.
    x:
      ja-Hrkt: |-
        アップテンポの　おどりと　おとで
        はなの　タネを　ねらう　てんてきの
        とりポケモンを　おいはらうのだ。
      ja: |-
        アップテンポの　踊りと　音で
        花の　タネを　ねらう　天敵の
        とりポケモンを　追い払うのだ。
      ko: |-
        템포가 빠른 춤과 소리로
        꽃씨를 노리는 천적인
        새포켓몬을 쫓아버린다.
      en: |-
        It uses an up-tempo song and dance to drive away
        the bird Pokémon that prey on its flower seeds.
      fr: |-
        Avec une danse et des sons saccadés, il fait fuir
        ses prédateurs, les Pokémon Oiseaux dévoreurs
        de graines de fleur.
      de: |-
        Verjagt Vogel-Pokémon, die auf seine Blüten
        aus sind, mit einem flotten Tänzchen und
        lauter Untermalung.
      es: |-
        Espanta a los Pokémon pájaro con un baile rápido y
        haciendo ruido para evitar que picoteen las semillas de
        sus flores.
      it: |-
        Con danze e suoni a ritmo vivace scaccia i suoi
        predatori, i Pokémon uccello, che divorano i semi
        dei suoi fiori.
    'y':
      ja-Hrkt: |-
        かんそうした　とちで　くらす。
        からだを　リズミカルに　うごかすと
        マラカスのような　おとを　かなでる。
      ja: |-
        乾燥した　土地で　暮らす。
        体を　リズミカルに　動かすと
        マラカスのような　音を　奏でる。
      ko: |-
        건조한 땅에서 산다.
        몸을 리드미컬하게 움직이면
        마라카스 같은 소리를 낸다.
      en: |-
        Arid regions are their habitat. They move
        rhythmically, making a sound similar to maracas.
      fr: |-
        Il vit dans les endroits secs. Quand il bouge son corps
        en rythme, il fait un bruit de maracas.
      de: |-
        Erzeugt durch rhythmische Bewegungen Laute,
        die dem Klang von Maracas ähneln. Lebt an
        trockenen Orten.
      es: |-
        Vive en territorio árido. Emite un sonido parecido a
        unas maracas si se mueve de forma rítmica.
      it: |-
        Vive nelle zone aride. Se muove il corpo a tempo
        produce un suono di maracas.
    omega-ruby:
      ja-Hrkt: |-
        アップテンポの　おどりと　おとで
        はなの　タネを　ねらう　てんてきの
        とりポケモンを　おいはらうのだ。
      ja: |-
        アップテンポの　踊りと　音で
        花の　タネを　ねらう　天敵の
        とりポケモンを　追い払うのだ。
      ko: |-
        템포가 빠른 춤과 소리로
        꽃씨를 노리는 천적인
        새포켓몬을 쫓아버린다.
      en: |-
        It uses an up-tempo song and dance to drive away
        the bird Pokémon that prey on its flower seeds.
      fr: |-
        Avec une danse et des sons saccadés, il fait fuir
        ses prédateurs, les Pokémon Oiseaux dévoreurs
        de graines de fleur.
      de: |-
        Verjagt Vogel-Pokémon, die auf seine Blüten aus sind,
        mit einem flotten Tänzchen und lauter Untermalung.
      es: |-
        Espanta a los Pokémon pájaro con un baile rápido y haciendo
        ruido para evitar que picoteen las semillas de sus flores.
      it: |-
        Con danze e suoni a ritmo vivace scaccia i suoi predatori,
        i Pokémon uccello, che divorano i semi dei suoi fiori.
    alpha-sapphire:
      ja-Hrkt: |-
        かんそうした　とちで　くらす。
        からだを　リズミカルに　うごかすと
        マラカスのような　おとを　かなでる。
      ja: |-
        乾燥した　土地で　暮らす。
        体を　リズミカルに　動かすと
        マラカスのような　音を　奏でる。
      ko: |-
        건조한 땅에서 산다.
        몸을 리드미컬하게 움직이면
        마라카스 같은 소리를 낸다.
      en: |-
        Arid regions are their habitat. They move
        rhythmically, making a sound similar to maracas.
      fr: |-
        Il vit dans les endroits secs. Quand il bouge son corps
        en rythme, il fait un bruit de maracas.
      de: |-
        Erzeugt durch rhythmische Bewegungen Laute, die dem Klang
        von Maracas ähneln. Lebt an trockenen Orten.
      es: |-
        Vive en territorio árido. Emite un sonido parecido a unas
        maracas si se mueve de forma rítmica.
      it: |-
        Vive nelle zone aride. Se muove il corpo a tempo produce
        un suono di maracas.
    sword:
      ja-Hrkt: |-
        マラカスの　ような　おとを　だす。
        ようきな　リズムに　とりポケモンは
        おどろき　あわて　とびさっていく。
      ja: |-
        マラカスの　ような　音を　だす。
        陽気な　リズムに　鳥ポケモンは
        驚き　慌て　飛び去っていく。
      ko: |-
        마라카스 같은 소리를 낸다.
        리듬이 경쾌해서 새포켓몬은
        깜짝 놀라 허둥지둥 날아가버린다.
      zh-Hant: |-
        會發出沙鈴般的聲音。
        鳥寶可夢會因那輕快的
        節奏而受驚飛走。
      zh-Hans: |-
        会发出沙铃般的声音。
        鸟宝可梦会因那轻快的
        节奏而受惊飞走。
      en: |-
        With noises that could be mistaken for the rattles
        of maracas, it creates an upbeat rhythm, startling
        bird Pokémon and making them fly off in a hurry.
      fr: |-
        Il produit un bruit de maracas. Quand il danse
        à un rythme enjoué, il surprend les Pokémon
        oiseaux, qui s’enfuient alors à tire-d’aile.
      de: |-
        Es erzeugt Laute, die dem Klang von Maracas
        ähneln, und weiß sich Vogel-Pokémon mit flotten
        Rhythmen vom Leib zu halten.
      es: |-
        Emite un sonido parecido a unas maracas. Se
        mueve con un ritmo marchoso para sorprender
        a los Pokémon pájaro, que huyen espantados.
      it: |-
        Emette un suono di maracas. Sfrutta il suo ritmo
        vivace per prendere alla sprovvista i Pokémon
        alati, che volano via in tutta fretta.
    shield:
      ja-Hrkt: |-
        いちねんに　いちど　タネを　まく。
        はなの　タネは　えいようまんてんで
        さばくの　きちょうな　しょくりょう。
      ja: |-
        １年に　一度　種を　まく。
        花の　種は　栄養満点で
        砂漠の　貴重な　食料。
      ko: |-
        일 년에 한 번 씨를 뿌린다.
        꽃의 씨는 영양이 매우 풍부해
        사막의 귀중한 식량이다.
      zh-Hant: |-
        一年散播一次種子。
        花的種子營養十足，
        是沙漠中貴重的食糧。
      zh-Hans: |-
        一年散播一次种子。
        花的种子营养十足，
        是沙漠中贵重的食粮。
      en: |-
        Once each year, this Pokémon scatters its seeds.
        They’re jam-packed with nutrients, making them
        a precious food source out in the desert.
      fr: |-
        Il sème les graines de ses fleurs une fois par an.
        Celles-ci abondent en nutriments et représentent
        une denrée précieuse dans le désert.
      de: |-
        Es verstreut ein Mal im Jahr Samen, die jede
        Menge Nährstoffe enthalten und in der Wüste
        als kostbares Nahrungsmittel gelten.
      es: |-
        Una vez al año, esparce sus semillas, cuyo alto
        valor nutritivo las convierte en una inestimable
        fuente de alimento en el desierto.
      it: |-
        Una volta all’anno i suoi fiori rilasciano semi
        ricchissimi di sostanze nutritive, che li rendono
        un prezioso alimento nel deserto.
