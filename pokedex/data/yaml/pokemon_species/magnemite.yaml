magnemite:
  base_happiness: 50
  capture_rate: 190
  color: gray
  egg_groups:
    - mineral
  evolution_chain: magnemite
  evolves_from: ~
  flavor_text:
    red:
      en: |-
        Uses anti-gravity
        to stay suspended.
        Appears withoutwarning and uses
        THUNDER WAVE and
        similar moves.
    blue:
      en: |-
        Uses anti-gravity
        to stay suspended.
        Appears withoutwarning and uses
        THUNDER WAVE and
        similar moves.
    yellow:
      en: |-
        It is born with
        the ability to
        defy gravity. Itfloats in air on
        powerful electro­
        magnetic waves.
    gold:
      en: |-
        It is attracted by
        electromagnetic
        waves. It mayapproach trainers
        if they are using
        their POKéGEAR.
    silver:
      en: |-
        The units at the
        sides of its body
        generate anti­gravity energy to
        keep it aloft in
        the air.
    crystal:
      en: |-
        The electricity
        emitted by the
        units on each sideof its body cause
        it to become a
        strong magnet.
    ruby:
      en: |-
        MAGNEMITE attaches itself to power
        lines to feed on electricity.
        If your house has a power outage,check your circuit breakers. You may
        find a large number of this POKéMON
        clinging to the breaker box.
    sapphire:
      en: |-
        MAGNEMITE floats in the air by emitting
        electromagnetic waves from the units
        at its sides. These waves block gravity.This POKéMON becomes incapable of
        flight if its internal electrical supply
        is depleted.
    emerald:
      en: |-
        The units at its sides are extremely
        powerful magnets. They generate enough
        magnetism to draw in iron objects from
        over 300 feet away.
    firered:
      en: |-
        It moves while constantly hovering.
        It discharges THUNDER WAVE and so on
        from the units at its sides.
    leafgreen:
      en: |-
        Uses antigravity to stay suspended.
        Appears without warning and uses THUNDER
        WAVE and similar moves.
    diamond:
      en: |-
        The units at its sides generate
        electromagnetic waves that keep it
        airborne. It feeds on electricity.
    pearl:
      en: |-
        The units at its sides generate
        electromagnetic waves that keep it
        airborne. It feeds on electricity.
    platinum:
      en: |-
        The faster the units at its sides
        rotate, the greater the magnetic
        force they generate.
    heartgold:
      en: |-
        It is attracted by electromagnetic
        waves. It may approach Trainers
        if they are using their Pokégear.
    soulsilver:
      en: |-
        The units at the sides of its body
        generate antigravity energy to
        keep it aloft in the air.
    black:
      en: |-
        The faster the units at its sides
        rotate, the greater the magnetic
        force they generate.
      fr: |-
        Plus la rotation de ses extrémités
        est rapide, plus la force du champ
        magnétique qu’il génère est grande.
    white:
      en: |-
        The faster the units at its sides
        rotate, the greater the magnetic
        force they generate.
      fr: |-
        Plus la rotation de ses extrémités
        est rapide, plus la force du champ
        magnétique qu’il génère est grande.
    black-2:
      en: |-
        The electromagnetic waves emitted by
        the units at the sides of its head expel
        antigravity, which allows it to float.
    white-2:
      en: |-
        The electromagnetic waves emitted by
        the units at the sides of its head expel
        antigravity, which allows it to float.
    x:
      ja-Hrkt: |-
        さゆうの　ユニットから
        じゅうりょくを　さえぎる　ちからを
        だすので　くうちゅうに　うかべる。
      ja: |-
        左右の　ユニットから
        重力を　さえぎる　力を
        出すので　空中に　浮かべる。
      ko: |-
        좌우의 유닛에서
        중력을 차단하는 힘을
        발휘하기에 공중에 뜰 수 있다.
      en: |-
        The units at the sides of its body generate
        antigravity energy to keep it aloft in the air.
      fr: |-
        Les parties sur les côtés de son corps génèrent
        une énergie lui permettant de léviter.
      de: |-
        Die Magneten an seinem Körper erzeugen
        ein Antigravitationsfeld, um es ständig
        in der Schwebe zu halten.
      es: |-
        Las unidades a los lados de su cuerpo generan
        energía antigravitatoria para mantenerlo en el aire.
      it: |-
        Le unità alle due estremità del corpo producono
        energia antigravitazionale con cui si mantiene
        a mezz’aria.
    'y':
      ja-Hrkt: |-
        くうちゅうに　ういたまま　いどうして
        さゆうの　ユニットから
        でんじはなどを　ほうしゃする。
      ja: |-
        空中に　浮いたまま　移動して
        左右の　ユニットから
        電磁波などを　放射する。
      ko: |-
        공중에 뜬 채로 이동하여
        좌우의 유닛에서
        전기자석파를 방사한다.
      en: |-
        It moves while constantly hovering. It discharges
        Thunder Wave and so on from the units at its sides.
      fr: |-
        Il reste constamment en sustentation pour se
        déplacer. Ce Pokémon peut envoyer de l’électricité
        par les aimants situés sur ses côtés.
      de: |-
        Es bewegt sich schwebend. Seine Magnete an den
        Seiten entladen eine Donnerwelle nach der nächsten.
      es: |-
        Está suspendido en el aire y no para de moverse. A
        través de las extremidades laterales dispara Onda
        Trueno.
      it: |-
        Si sposta restando sempre sollevato da terra. Si serve
        dei due elementi laterali per lanciare Tuononda
        e attacchi simili.
    omega-ruby:
      ja-Hrkt: |-
        でんせんに　くっついて　でんきを　たべている。
        ていでんに　なったら　ブレーカーを　しらべよう。
        コイルが　びっしり　くっついて　いるかも。
      ja: |-
        電線に　くっついて　電気を　食べている。
        停電に　なったら　ブレーカーを　調べよう。
        コイルが　びっしり　くっついて　いるかも。
      ko: |-
        전선에 들러붙어 전기를 먹고 있다.
        정전되면 누전차단기를 살펴보자.
        코일이 빽빽이 들러붙어 있을지도 모른다.
      en: |-
        Magnemite attaches itself to power lines to feed on electricity.
        If your house has a power outage, check your circuit breakers.
        You may find a large number of this Pokémon clinging to the
        breaker box.
      fr: |-
        Magnéti s’attache aux lignes à haute tension pour se charger
        en électricité. Si une maison a une panne de courant, il est
        conseillé de vérifier les fusibles car on trouve parfois ces
        Pokémon amassés sur la boîte à fusibles.
      de: |-
        Magnetilo ernährt sich von Elektrizität aus Stromleitungen.
        Dieses Pokémon hängt sich gern an Sicherungskästen.
        Wenn es in deinem Haus zu einem Stromausfall kommt,
        solltest du die Sicherungen überprüfen.
      es: |-
        Magnemite se engancha a las líneas de tensión para nutrirse
        de electricidad. Cuando se producen apagones en las casas,
        es aconsejable revisar el automático y comprobar que no hay
        Pokémon de este tipo colgados de la caja de fusibles.
      it: |-
        Magnemite si attacca alle linee elettriche per caricarsi di
        energia. In caso di assenza di corrente in casa, controllare
        gli interruttori. Potrebbero esserci dei Pokémon attaccati
        alla cassetta degli interruttori.
    alpha-sapphire:
      ja-Hrkt: |-
        さゆうの　ユニットから　でんじはを　だす　ことで
        じゅうりょくを　さえぎり　くうちゅうに　うかぶ。
        たいないの　でんきが　なくなると　とべなくなる。
      ja: |-
        左右の　ユニットから　電磁波を　出す　ことで
        重力を　遮り　空中に　浮かぶ。
        体内の　電気が　なくなると　飛べなくなる。
      ko: |-
        좌우의 유닛에서 전자파를 내어
        중력을 차단하여 공중에 뜬다.
        체내의 전기가 없어지면 날지 못하게 된다.
      en: |-
        Magnemite floats in the air by emitting electromagnetic waves
        from the units at its sides. These waves block gravity. This
        Pokémon becomes incapable of flight if its internal electrical
        supply is depleted.
      fr: |-
        Magnéti flotte dans les airs en émettant des ondes
        électromagnétiques par les aimants sur ses côtés.
        Ces ondes annulent les effets de la gravité. Ce Pokémon
        ne peut plus voler si son stock d’électricité est épuisé.
      de: |-
        Magnetilo segelt durch die Luft und sendet dabei
        elektromagnetische Wellen an beiden Seiten seines
        Körpers aus. Dieses Pokémon wird flugunfähig,
        wenn die Stromquelle in seinem Inneren erschöpft ist.
      es: |-
        Magnemite flota en el aire emitiendo ondas electromagnéticas,
        a través de las unidades de las extremidades, que bloquean
        la gravedad. Si se agota su suministro de electricidad interno,
        es incapaz de mantenerse flotando.
      it: |-
        Magnemite fluttua a mezz’aria emanando onde
        elettromagnetiche dai suoi elementi laterali. Queste onde
        bloccano la forza di gravità. Il Pokémon non riesce a rimanere
        sospeso dopo aver esaurito la carica elettrica.
    sun:
      ja-Hrkt: |-
        でんきが　ある　ばしょに　むれる。
        でんきを　おくる　てっとう　などに
        ビッシリと　はりついていることも。
      ja: |-
        電気が　ある　場所に　群れる。
        電気を　送る　鉄塔　などに
        ビッシリと　張りついていることも。
      ko: |-
        전기가 있는 장소에 무리를 짓는다.
        전기를 보내는 철탑 등에
        빈틈없이 붙어 있는 일도 있다.
      zh-Hant: |-
        會群集在有電力的地方。
        有時還會成群緊貼在
        輸送電力的鐵塔等地方。
      zh-Hans: |-
        聚集在有电的地方。
        也会密密麻麻地贴在
        输送电力的铁塔等地方。
      en: |-
        They gather in places where electricity is
        available. They can be found clinging to the
        steel towers used to support power lines.
      fr: |-
        Les Magnéti se rassemblent aux endroits où
        il y a beaucoup d’électricité, et s’agglutinent
        par exemple autour des pylônes électriques.
      de: |-
        Sie scharen sich um Orte, durch die Elektrizität
        fließt. Deshalb klammern sie sich zum Beispiel
        sehr oft in Massen an Strommasten fest.
      es: |-
        Estos Pokémon se agrupan en zonas donde hay
        electricidad. A veces hasta se los ve
        merodeando alrededor de las torres eléctricas.
      it: |-
        I Magnemite si radunano dove c’è elettricità.
        Si possono anche trovare attaccati ai tralicci
        delle linee elettriche.
    moon:
      ja-Hrkt: |-
        でんじはを　はなち　そらを　ただよう。
        でんきを　くっているときに　さわると
        ぜんしんが　ビリッと　しびれるぞ。
      ja: |-
        電磁波を　放ち　空を　漂う。
        電気を　喰っているときに　触ると
        全身が　ビリッと　痺れるぞ。
      ko: |-
        전기자석파를 발산하여 공중을 떠다닌다.
        전기를 먹고 있을 때 만지면
        전신이 찌릿하게 마비된다.
      zh-Hant: |-
        釋放出電磁波，在空中飄浮。
        如果在牠吞食電力的時候碰牠，
        全身就會被電得劈哩啪啦的。
      zh-Hans: |-
        释放出电磁波，在空中飘浮。
        如果在吞食电力的时候触碰它，
        就会全身被电得噼里啪啦的。
      en: |-
        It sends out electromagnetic waves, which let it
        float through the air. Touching it while it’s eating
        electricity will give you a full-body shock.
      fr: |-
        Il lévite en émettant des ondes électro-
        magnétiques. Si on le touche quand il s’alimente
        en énergie, on risque un choc électrique.
      de: |-
        Es sendet elektromagnetische Wellen aus und
        segelt durch die Luft. Berührt man es, während
        es Strom saugt, bekommt man einen Schlag.
      es: |-
        Flota gracias a las ondas electromagnéticas
        que desprende. Al tocarlo mientras está
        alimentándose, uno puede electrocutarse.
      it: |-
        Fluttua in aria emettendo onde
        elettromagnetiche. Se lo si tocca mentre si
        nutre di elettricità, si prende la scossa.
    ultra-sun:
      ja-Hrkt: |-
        たびたび　ていでんの　げんいんとなる
        ため　コイルが　いやがる　でんぱを
        ながす　はつでんしょも　あるほど。
      ja: |-
        たびたび　停電の　原因と　なる
        ため　コイルが　嫌がる　電波を
        流す　発電所も　あるほど。
      ko: |-
        종종 정전의 원인이 되기 때문에
        코일이 싫어하는 전파를
        내보내는 발전소도 있을 정도다.
      zh-Hant: |-
        由於小磁怪經常引發停電，
        有的發電廠甚至會特地發射
        小磁怪討厭的電波。
      zh-Hans: |-
        因为它时常会引发停电，
        所以有些发电厂会发出
        小磁怪讨厌的电波。
      en: |-
        It’s frequently the cause of power outages,
        which is why some power plants send out
        electrical signals that it can’t stand.
      fr: |-
        Ce Pokémon causant des coupures de courant,
        certaines centrales l’éloignent en diffusant
        des ondes qu’il déteste.
      de: |-
        Da Magnetilo Stromausfälle verursacht, werden
        in vielen Kraftwerken Radiowellen ausgesendet,
        die es nicht leiden kann, um es zu vertreiben.
      es: |-
        Frecuentemente son la causa de apagones, por
        lo que algunas centrales eléctricas emiten unas
        ondas que detestan para ahuyentarlos.
      it: |-
        Poiché spesso causano dei blackout, alcune
        centrali elettriche diffondono delle onde radio
        che i Magnemite non sopportano.
    ultra-moon:
      ja-Hrkt: |-
        さいきんは　でんせんが　じめんに
        うめられているためか　はつでんしょを
        おそう　コイルが　ふえている。
      ja: |-
        最近は　電線が　地面に
        埋められているためか　発電所を
        襲う　コイルが　増えている。
      ko: |-
        최근에는 전선이 땅에
        묻혀 있기 때문인지 발전소를
        습격하는 코일이 늘고 있다.
      zh-Hant: |-
        可能是因為最近電線都埋在
        地下的關係，襲擊發電廠的
        小磁怪變得越來越多了。
      zh-Hans: |-
        可能是因为最近的电线
        都被埋在了地下，所以袭击
        发电厂的小磁怪变多了。
      en: |-
        Perhaps because electrical lines are often
        buried these days, the number of Magnemite
        attacks on power plants has increased.
      fr: |-
        De nos jours, les câbles électriques sont
        enterrés, aussi les Magnéti attaquent-ils
        de plus en plus les centrales électriques.
      de: |-
        Seit Stromleitungen zunehmend unterirdisch
        verlegt werden, stürzen sich mehr und mehr
        Magnetilo direkt auf Kraftwerke.
      es: |-
        Debido a que el tendido eléctrico es ahora
        soterrado, han aumentado los asaltos a
        centrales eléctricas causados por Magnemite.
      it: |-
        Gli attacchi da parte dei Magnemite alle centrali
        elettriche sono notevolmente aumentati, forse
        perché al giorno d’oggi i cavi sono interrati.
    lets-go-pikachu:
      ja-Hrkt: |-
        うまれつき　じゅうりょくを　さえぎる
        のうりょくを　もち　でんじはを
        だしながら　くうちゅうを　いどう。
      ja: |-
        生まれつき　重力を　さえぎる
        能力を　もち　電磁波を
        出しながら　空中を　移動。
      ko: |-
        태어날 때부터 중력을 차단하는
        능력을 가지고 있어 전자파를
        내면서 공중을 이동한다.
      zh-Hant: |-
        天生擁有阻斷重力的能力。
        會一邊發出電磁波，
        一邊在空中移動。
      zh-Hans: |-
        天生就拥有遮断重力
        的能力，可以一边发出
        电磁波一边在空中移动。
      en: |-
        It is hatched with the ability to defy gravity.
        It floats while emitting powerful
        electromagnetic waves.
      fr: |-
        Sa nature défie les lois de la gravité.
        Il flotte grâce à un champ électromagnétique.
      de: |-
        Es trotzt von Geburt an der Schwerkraft und
        schwebt auf elektromagnetischen Wellen durch
        die Luft.
      es: |-
        Puede desafiar la gravedad desde su
        nacimiento. Flota en el aire gracias a las
        ondas electromagnéticas que emite.
      it: |-
        Ha l’innata capacità di contrastare la forza di
        gravità emettendo onde elettromagnetiche che
        gli permettono di spostarsi fluttuando in aria.
    lets-go-eevee:
      ja-Hrkt: |-
        うまれつき　じゅうりょくを　さえぎる
        のうりょくを　もち　でんじはを
        だしながら　くうちゅうを　いどう。
      ja: |-
        生まれつき　重力を　さえぎる
        能力を　もち　電磁波を
        出しながら　空中を　移動。
      ko: |-
        태어날 때부터 중력을 차단하는
        능력을 가지고 있어 전자파를
        내면서 공중을 이동한다.
      zh-Hant: |-
        天生擁有阻斷重力的能力。
        會一邊發出電磁波，
        一邊在空中移動。
      zh-Hans: |-
        天生就拥有遮断重力
        的能力，可以一边发出
        电磁波一边在空中移动。
      en: |-
        It is hatched with the ability to defy gravity.
        It floats while emitting powerful
        electromagnetic waves.
      fr: |-
        Sa nature défie les lois de la gravité.
        Il flotte grâce à un champ électromagnétique.
      de: |-
        Es trotzt von Geburt an der Schwerkraft und
        schwebt auf elektromagnetischen Wellen durch
        die Luft.
      es: |-
        Puede desafiar la gravedad desde su
        nacimiento. Flota en el aire gracias a las
        ondas electromagnéticas que emite.
      it: |-
        Ha l’innata capacità di contrastare la forza di
        gravità emettendo onde elettromagnetiche che
        gli permettono di spostarsi fluttuando in aria.
    sword:
      ja-Hrkt: |-
        たいないの　でんきが　きれて
        じめんに　ころがっていることもある。
        でんちを　あげると　うごきだすよ。
      ja: |-
        体内の　電気が　切れて
        地面に　転がっていることもある。
        電池を　あげると　動きだすよ。
      ko: |-
        체내의 전기가 끊겨
        땅에서 뒹굴기도 한다.
        전지를 주면 움직이기 시작한다.
      zh-Hant: |-
        有時也會因為耗盡了體內的
        電力而掉落在地面上。給牠
        電池，牠就會再次動起來喔。
      zh-Hans: |-
        有时也会因为体内的电力
        消耗完了而掉到地面上。
        给它电池它就会动起来。
      en: |-
        At times, Magnemite runs out of electricity and
        ends up on the ground. If you give batteries to a
        grounded Magnemite, it’ll start moving again.
      fr: |-
        Il lui arrive d’être à court d’électricité
        et de tomber au sol, mais il suffit de
        lui donner une batterie pour le ranimer.
      de: |-
        Manchmal geht die Elektrizität in seinem Körper
        zur Neige, woraufhin es zu Boden fällt. Eine
        Batterie bringt es wieder in Bewegung.
      es: |-
        A veces se desploman al suelo tras agotar su
        suministro eléctrico interno, pero basta una
        pequeña batería para reanimarlos.
      it: |-
        Gli capita di esaurire la sua riserva di elettricità
        e di cadere al suolo. Se gli viene data una
        batteria, torna a muoversi.
    shield:
      ja-Hrkt: |-
        でんきを　くって　いきている。
        さゆうの　ユニットから　でんじはを
        ほうしゃ　しながら　そらを　とぶ。
      ja: |-
        電気を　食って　生きている。
        左右の　ユニットから　電磁波を
        放射しながら　空を　飛ぶ。
      ko: |-
        전기를 먹으며 살아간다.
        좌우의 유닛에서 전기자석파를
        방사하며 하늘을 난다.
      zh-Hant: |-
        靠吞食電力維持生命。
        會一邊從左右的組件放射
        出電磁波，一邊在空中飛。
      zh-Hans: |-
        靠吃电来维持生命。
        会一边从左右两边的组件
        放射电磁波一边在空中飞行。
      en: |-
        It subsists on electricity. As Magnemite flies, it
        emits electromagnetic waves from the units on
        each side of its body.
      fr: |-
        Il se nourrit d’électricité et flotte dans les airs
        en libérant des ondes électromagnétiques avec
        les aimants situés de part et d’autre de son corps.
      de: |-
        Es ernährt sich von Strom und segelt durch die
        Luft, indem es mit den Magneten an seinem
        Körper elektromagnetische Wellen aussendet.
