    x:
      ja-Hrkt: |-
        あたまのはっぱから　ほのかに　あまい
        かおりが　ただよう。おとなしくて
        ひざしを　あびるのが　だいすき。
      ja: |-
        頭の　葉っぱから　ほのかに　甘い
        香りが　漂う。おとなしくて
        日差しを　浴びるのが　大好き。
      ko: |-
        머리의 잎사귀에서 살짝 달콤한
        향기가 감돈다. 얌전하며
        햇볕을 쬐는 것을 매우 좋아한다.
      en: |-
        A sweet aroma gently wafts from the leaf on its
        head. It is docile and loves to soak up sun rays.
      fr: |-
        Un doux parfum émane de la feuille placée sur sa tête.
        Il est très gentil et aime dormir au soleil.
      de: |-
        Ein süßer Duft geht von dem Blatt auf seinem Kopf
        aus. Es ist ruhig und liegt gerne in der Sonne.
      es: |-
        Un dulce aroma se desprende de la hoja de su
        cabeza. Es dócil y le encanta absorber los rayos
        de sol.
      it: |-
        Un dolce profumo si diffonde dalla sua testa.
        È docile e ama scaldarsi al sole.
    'y':
      ja-Hrkt: |-
        あたまの　はっぱで　まわりの
        おんどや　しつどを　さぐる。
        ひざしを　あびることが　だいすき。
      ja: |-
        頭の　葉っぱで　まわりの
        温度や　湿度を　探る。
        日差しを　浴びることが　大好き。
      ko: |-
        머리의 잎사귀로 주위의
        온도나 습도를 살핀다.
        햇볕을 쬐는 것을 매우 좋아한다.
      en: |-
        It uses the leaf on its head to determine the
        temperature and humidity. It loves to sunbathe.
      fr: |-
        Il jauge la température et l’humidité grâce à la feuille
        sur sa tête. Il raffole des bains de soleil.
      de: |-
        Mit dem Blatt auf seinem Kopf bestimmt es die
        Temperatur und Feuchtigkeit. Es liebt Sonnenbäder.
      es: |-
        Con la hoja de su cabeza puede medir la temperatura
        y la humedad. Le encanta tomar el sol.
      it: |-
        Usa la foglia sulla sua testa per misurare la
        temperatura e l’umidità. Ama crogiolarsi al sole.
    omega-ruby:
      ja-Hrkt: |-
        はっぱを　ふりまわして　あいてを　いかくするが
        はっぱから　あまい　かおりが　ただようので
        おたがいに　なごやかな　ふんいきに　なるよ。
      ja: |-
        葉っぱを　振り回して　相手を　威嚇するが
        葉っぱから　甘い　香りが　漂うので
        お互いに　和やかな　雰囲気に　なるよ。
      ko: |-
        잎사귀를 휘둘러 상대를 위협하지만
        잎사귀에서 달콤한 향기가 풍겨 나와
        서로 온화한 분위기가 된다.
      en: |-
        In battle, Chikorita waves its leaf around to keep the foe at
        bay. However, a sweet fragrance also wafts from the leaf,
        becalming the battling Pokémon and creating a cozy, friendly
        atmosphere all around.
      fr: |-
        Lorsqu’il se bat, Germignon secoue sa feuille pour tenir son
        ennemi à distance. Un doux parfum s’en dégage également,
        apaisant les Pokémon qui se battent et créant une atmosphère
        agréable et amicale.
      de: |-
        Im Kampf wedelt Endivie mit seinem Blatt, um den Feind
        fernzuhalten. Von dem Blatt geht auch ein süßlicher Duft aus,
        der die kämpfenden Pokémon beruhigt und eine gemütliche,
        freundliche Atmosphäre schafft.
      es: |-
        Al luchar, Chikorita agita la hoja que tiene para mantener a
        raya al rival. Pero, al mismo tiempo, libera una suave fragancia
        que apacigua el encuentro y crea un ambiente agradable y de
        amistad.
      it: |-
        Nella lotta, Chikorita sventola la sua foglia in modo da tenere
        a bada il nemico. Tuttavia, la foglia emana anche un aroma
        dolce, che calma il Pokémon avversario, creando un’atmosfera
        gradevole e rilassata tutt’attorno.
    alpha-sapphire:
      ja-Hrkt: |-
        はっぱを　ふりまわして　あいてを　いかくするが
        はっぱから　あまい　かおりが　ただようので
        おたがいに　なごやかな　ふんいきに　なるよ。
      ja: |-
