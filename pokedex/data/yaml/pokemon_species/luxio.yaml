    black-2:
      en: |-
        Strong electricity courses through
        the tips of its sharp claws. A light
        scratch causes fainting in foes.
    white-2:
      en: |-
        Strong electricity courses through
        the tips of its sharp claws. A light
        scratch causes fainting in foes.
    x:
      ja-Hrkt: |-
        いっぱつで　きぜつさせるほどの
        でんりゅうを　ツメから　ながす。
        すうひきの　グループで　くらす。
      ja: |-
        １発で　気絶させるほどの　電流を
        ツメから　流す。
        数匹の　グループで　暮らす。
      ko: |-
        발톱에서는 한 방에 적을 기절시킬
        정도로 강한 전류가 흐른다.
        여러 마리가 그룹을 이루어 산다.
      en: |-
        Its claws loose electricity with enough amperage
        to cause fainting. They live in small groups.
      fr: |-
        L’électricité libérée par ses griffes peut assommer
        l’ennemi. Il vit en petits groupes.
      de: |-
        Seine Krallen geben Elektrizität ab, die stark
        genug ist, jemanden bewusstlos zu machen.
      es: |-
        Sus garras emiten electricidad que puede debilitar a
        sus rivales. Viven en grupos pequeños.
      it: |-
        Dagli artigli rilascia un’elettricità talmente intensa
        da mandare KO il nemico. Vive in piccoli gruppi.
    'y':
      ja-Hrkt: |-
        するどい　ツメの　さきには　つよい
        でんきが　ながれており　ほんのすこし
        かするだけで　あいてをきぜつさせる。
      ja: |-
        鋭い　ツメの　先には　強い　電気が
        流れており　ほんの少し　かするだけで
        相手を気絶させる。
      ko: |-
        날카로운 발톱의 끝에는 강한
        전기가 흐르고 있어서 살짝 스치는
        것만으로 상대를 기절시킨다.
      en: |-
        Strong electricity courses through the tips of its
        sharp claws. A light scratch causes fainting in foes.
      fr: |-
        Le courant qui circule à la pointe de ses griffes est
        capable de faire perdre connaissance à ses proies.
      de: |-
        Durch die Spitzen seiner scharfen Krallen strömt
        Elektrizität. Selbst kleine Kratzer verursachen
        Ohnmacht.
      es: |-
        Por las puntas de sus garras pasa una fuerte corriente
        eléctrica. El mínimo roce debilita al enemigo.
      it: |-
        I suoi artigli rilasciano una forte corrente elettrica e
        con un solo graffio manda KO i nemici.
    omega-ruby:
      ja-Hrkt: |-
        いっぱつで　きぜつさせるほどの
        でんりゅうを　ツメから　ながす。
        すうひきの　グループで　くらす。
      ja: |-
        １発で　気絶させるほどの　電流を
        ツメから　流す。
        数匹の　グループで　暮らす。
      ko: |-
        발톱에서는 한 방에 적을 기절시킬
        정도로 강한 전류가 흐른다.
        여러 마리가 그룹을 이루어 산다.
      en: |-
        Its claws loose electricity with enough amperage
        to cause fainting. They live in small groups.
      fr: |-
        L’électricité libérée par ses griffes peut assommer l’ennemi.
        Il vit en petits groupes.
      de: |-
        Seine Krallen geben Elektrizität ab, die stark genug ist,
        jemanden bewusstlos zu machen.
      es: |-
        Sus garras emiten electricidad que puede debilitar a sus
        rivales. Viven en grupos pequeños.
      it: |-
        Dagli artigli rilascia un’elettricità talmente intensa da mandare
        KO il nemico. Vive in piccoli gruppi.
    alpha-sapphire:
      ja-Hrkt: |-
        するどい　ツメの　さきには　つよい
        でんきが　ながれており　ほんのすこし
        かするだけで　あいてをきぜつさせる。
      ja: |-
        鋭い　ツメの　先には　強い　電気が
        流れており　ほんの少し　かするだけで
        相手を気絶させる。
      ko: |-
        날카로운 발톱의 끝에는 강한
        전기가 흐르고 있어서 살짝 스치는
        것만으로 상대를 기절시킨다.
      en: |-
        Strong electricity courses through the tips of its
        sharp claws. A light scratch causes fainting in foes.
      fr: |-
        Le courant qui circule à la pointe de ses griffes est capable
        de faire perdre connaissance à ses proies.
      de: |-
        Durch die Spitzen seiner scharfen Krallen strömt Elektrizität.
        Selbst kleine Kratzer verursachen Ohnmacht.
      es: |-
        Por las puntas de sus garras pasa una fuerte corriente
        eléctrica. El mínimo roce debilita al enemigo.
      it: |-
        I suoi artigli rilasciano una forte corrente elettrica e con
        un solo graffio manda KO i nemici.
    sword:
      ja-Hrkt: |-
        しっぽを　つなげて　なかまから
        でんきエネルギーを　わけてもらうと
        より　つよい　でんげきを　はなてる。
      ja: |-
        しっぽを　つなげて　仲間から
        電気エネルギーを　分けてもらうと
        より　強い　電撃を　放てる。
      ko: |-
        꼬리를 이어서 동료로부터
        전기 에너지를 나눠 받으면
        보다 강한 전격을 내보낼 수 있다.
      zh-Hant: |-
        如果與夥伴尾巴牽尾巴，
        就能借用對方的電能，
        然後發出更強的電擊。
      zh-Hans: |-
        当把尾巴和伙伴连接在一起时，
        可以分享到对方的电能，
        从而释放出更加强力的电击。
      en: |-
        By joining its tail with that of another Luxio, this
        Pokémon can receive some of the other Luxio’s
        electricity and power up its own electric blasts.
      fr: |-
        En reliant sa queue à celles de ses congénères,
        il peut recevoir leur énergie électrique et lancer
        des décharges encore plus puissantes.
      de: |-
        Verbindet es seinen Schweif mit dem eines
        Artgenossen, absorbiert es einen Teil von dessen
        Elektrizität und teilt stärkere Stromschläge aus.
      es: |-
        Al unir la cola con otro congénere, este le
        transmite electricidad, lo que aumenta la
        potencia de sus descargas eléctricas.
      it: |-
        Se collega la coda con quella dei suoi simili per
        ricevere energia elettrica, può emettere scariche
        elettriche ancora più potenti.
    shield:
      ja-Hrkt: |-
        てきに　であうと　１００まんボルトの
        いりょくを　もつ　ツメを　あしから
        だして　たたかいに　そなえる。
      ja: |-
        敵に　出会うと　１００万ボルトの
        威力を　もつ　ツメを　足から　だして
        戦いに　備える。
      ko: |-
        적을 만나면 100만 볼트의
        위력을 가진 발톱을
        드러내어 싸움에 대비한다.
      zh-Hant: |-
        遇見敵人時會從腳伸出
        有百萬伏特威力的爪子，
        為對戰做好準備。
      zh-Hans: |-
        遇到敌人时会从脚
        伸出有着百万伏特
        威力的爪子来迎战。
      en: |-
        Upon encountering an opponent, this Pokémon
        prepares for battle by extending its claws, which
        can put out 1,000,000 volts of electricity.
      fr: |-
        Quand il croise un ennemi, il se prépare
        au combat en sortant ses griffes dont les coups
        ont une puissance qui atteint un million de volts.
      de: |-
        Sieht es Gegner, macht es sich kampfbereit,
        indem es die Krallen an den Pfoten ausfährt,
        welche eine Million Volt austeilen können.
      es: |-
        Cuando encuentra a un adversario, se prepara
        para combatir sacando las garras, que emiten
        una corriente eléctrica de un millón de voltios.
      it: |-
        Se incontra un nemico, si prepara alla lotta
        estraendo gli artigli dotati di una potenza pari
        a 1 milione di volt.
    legends-arceus:
      en: |-
        Proudly uses its electrified claws as weapons. It seems to be a
        gracious Pokémon, evenly sharing the spoils of the hunt with
        others of its kind.
