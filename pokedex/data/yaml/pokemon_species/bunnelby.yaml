bunnelby:
  base_happiness: 50
  capture_rate: 255
  color: brown
  egg_groups:
    - ground
  evolution_chain: bunnelby
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        おおきな　みみで　じめんを　ほって
        すあなを　つくる。ひとばんじゅう
        やすまずに　ほりつづけられる。
      ja: |-
        大きな　耳で　地面を　掘って
        巣穴を　作る。
        一晩中　休まずに　掘り続けられる。
      ko: |-
        커다란 귀로 땅을 파고
        보금자리를 만든다. 하룻밤 동안
        쉬지 않고 계속 팔 수 있다.
      en: |-
        They use their large ears to dig burrows.
        They will dig the whole night through.
      fr: |-
        Ses larges oreilles lui permettent de creuser
        des terriers. Il est capable de forer sans s’arrêter
        pendant toute une nuit.
      de: |-
        Mit seinen großen Ohren schaufelt es sich einen Bau.
        Es kann die ganze Nacht ohne Pause durchschaufeln.
      es: |-
        Usa sus grandes orejas para excavar en la tierra y así
        crear madrigueras. Puede pasarse una noche entera
        cavando sin parar.
      it: |-
        Scava tane nel terreno grazie alle grandi orecchie.
        Può andare avanti senza fermarsi per tutta la notte.
    'y':
      ja-Hrkt: |-
        シャベルのような　みみを　もつ。
        あなほりで　きたえた　みみは　ふとい
        ねっこを　たちきる　いりょくだ。
      ja: |-
        シャベルのような　耳を　持つ。
        穴掘りで　鍛えた　耳は
        太い　根っこを　断ち切る　威力だ。
      ko: |-
        삽과 같은 귀를 가졌다.
        구멍을 파는 데 단련된 귀는 두꺼운
        뿌리를 자를 정도의 위력이다.
      en: |-
        It has ears like shovels. Digging holes
        strengthens its ears so much that they
        can sever thick roots effortlessly.
      fr: |-
        Il est doté d’oreilles ressemblant à des pelles.
        À force de creuser des galeries, leur puissance est
        telle qu’elles peuvent trancher de grosses racines.
      de: |-
        Es besitzt schaufelähnliche Ohren, die durch ständiges
        Graben so kräftig werden, dass sie auch dicke Wurzeln
        durchtrennen können.
      es: |-
        Tiene unas orejas tan grandes que parecen palas.
        Las ha fortalecido tanto usándolas para excavar que
        son capaces de arrancar raíces bien gruesas.
      it: |-
        Usa le orecchie come pale per scavare buche
        nel terreno. Queste propaggini sono talmente potenti
        da permettergli di strappare via enormi radici.
    omega-ruby:
      ja-Hrkt: |-
        おおきな　みみで　じめんを　ほって
        すあなを　つくる。ひとばんじゅう
        やすまずに　ほりつづけられる。
      ja: |-
        大きな　耳で　地面を　掘って
        巣穴を　作る。
        一晩中　休まずに　掘り続けられる。
      ko: |-
        커다란 귀로 땅을 파고
        보금자리를 만든다. 하룻밤 동안
        쉬지 않고 계속 팔 수 있다.
      en: |-
        They use their large ears to dig burrows.
        They will dig the whole night through.
      fr: |-
        Ses larges oreilles lui permettent de creuser des terriers.
        Il est capable de forer sans s’arrêter pendant toute une nuit.
      de: |-
        Mit seinen großen Ohren schaufelt es sich einen Bau.
        Es kann die ganze Nacht ohne Pause durchschaufeln.
      es: |-
        Usa sus grandes orejas para excavar en la tierra y así crear
        madrigueras. Puede pasarse una noche entera cavando sin
        parar.
      it: |-
        Scava tane nel terreno grazie alle grandi orecchie.
        Può andare avanti senza fermarsi per tutta la notte.
    alpha-sapphire:
      ja-Hrkt: |-
        シャベルのような　みみを　もつ。
        あなほりで　きたえた　みみは　ふとい
        ねっこを　たちきる　いりょくだ。
      ja: |-
        シャベルのような　耳を　持つ。
        穴掘りで　鍛えた　耳は
        太い　根っこを　断ち切る　威力だ。
      ko: |-
        삽과 같은 귀를 가졌다.
        구멍을 파는 데 단련된 귀는 두꺼운
        뿌리를 자를 정도의 위력이다.
      en: |-
        It has ears like shovels. Digging holes
        strengthens its ears so much that they
        can sever thick roots effortlessly.
      fr: |-
        Il est doté d’oreilles ressemblant à des pelles. À force de
        creuser des galeries, leur puissance est telle qu’elles peuvent
        trancher de grosses racines.
      de: |-
        Es besitzt schaufelähnliche Ohren, die durch ständiges Graben
        so kräftig werden, dass sie auch dicke Wurzeln durchtrennen
        können.
      es: |-
        Tiene unas orejas tan grandes que parecen palas.
        Las ha fortalecido tanto usándolas para excavar que son
        capaces de arrancar raíces bien gruesas.
      it: |-
        Usa le orecchie come pale per scavare buche nel terreno.
        Queste propaggini sono talmente potenti da permettergli di
        strappare via enormi radici.
    sword:
      ja-Hrkt: |-
        みみで　あなを　ほるのが　とくい。
        ちか１０メートルに　とどく　すあなを
        ひとばんで　つくってしまう。
      ja: |-
        耳で　穴を　掘るのが　得意。
        地下１０メートルに　とどく　巣穴を
        一晩で　つくってしまう。
      ko: |-
        귀로 구멍을 파는 것이 특기다.
        지하 10m에 달하는 굴을
        하룻밤 만에 만들어버린다.
      zh-Hant: |-
        擅長用耳朵挖洞。
        只需一個晚上就能挖出
        深至地下１０公尺的巢穴。
      zh-Hans: |-
        擅长用耳朵挖洞。
        只需一个晚上就能挖出
        深至地下１０米的巢穴。
      en: |-
        It excels at digging holes. Using its ears, it can
        dig a nest 33 feet deep in one night.
      fr: |-
        Il est très doué pour creuser avec ses oreilles.
        Il peut forer un terrier atteignant dix mètres
        de profondeur en une nuit.
      de: |-
        Mit den Ohren schaufelt es Löcher. Es braucht nur
        eine Nacht, um einen 10 m tiefen Bau zu graben.
      es: |-
        Usa hábilmente las orejas para hacer hoyos. Es
        capaz de excavar una madriguera a 10 m bajo
        tierra en una sola noche.
      it: |-
        Usa abilmente le orecchie per scavare buche
        nel terreno. Gli basta una notte per scavare
        una tana profonda 10 m.
    shield:
      ja-Hrkt: |-
        きけんに　びんかん。　アーマーガアの
        はおとを　ききとると　あっというまに
        あなを　ほって　じめんに　もぐる。
      ja: |-
        危険に　敏感。　アーマーガアの
        羽音を　聴きとると　あっという間に
        穴を　掘って　地面に　潜る。
      ko: |-
        위험에 민감하다. 아머까오의
        날갯소리를 들으면 눈 깜짝할 사이에
        구멍을 파고 땅으로 숨어든다.
      zh-Hant: |-
        對危險很敏感。只要聽到
        鋼鎧鴉拍打翅膀的聲音，
        就會馬上挖洞鑽進地下藏身。
      zh-Hans: |-
        对危险很敏感。只要听到
        钢铠鸦拍打翅膀的声音，
        就会马上挖洞钻进地下藏身。
      en: |-
        It’s very sensitive to danger. The sound of
        Corviknight’s flapping will have Bunnelby
        digging a hole to hide underground in moments.
      fr: |-
        Il est sensible au danger. Lorsqu’il entend
        le battement d’ailes de Corvaillus, il creuse
        prestement un terrier et s’y cache.
      de: |-
        Es ist permanent in Alarmbereitschaft. Sobald es
        die Flügel eines Krarmors rascheln hört, gräbt es
        ein Loch und verschwindet im Boden.
      es: |-
        Está en alerta permanente. En cuanto oye el batir
        de alas de un Corviknight, cava un agujero y se
        oculta bajo tierra.
      it: |-
        È sempre all’erta contro i pericoli. Se percepisce
        il battito d’ali di Corviknight scava una buca
        e si nasconde sotto terra.
