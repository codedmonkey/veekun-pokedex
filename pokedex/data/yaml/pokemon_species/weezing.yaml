weezing:
  base_happiness: 50
  capture_rate: 60
  color: purple
  egg_groups:
    - indeterminate
  evolution_chain: koffing
  evolves_from: koffing
  flavor_text:
    red:
      en: |-
        Where two kinds
        of poison gases
        meet, 2 KOFFINGscan fuse into a
        WEEZING over many
        years.
    blue:
      en: |-
        Where two kinds
        of poison gases
        meet, 2 KOFFINGscan fuse into a
        WEEZING over many
        years.
    yellow:
      en: |-
        It lives and grows
        by absorbing dust,
        germs and poisongases that are
        contained in toxic
        waste and garbage.
    gold:
      en: |-
        If one of the twin
        KOFFING inflates,
        the other onedeflates. It con­
        stantly mixes its
        poisonous gases.
    silver:
      en: |-
        Top-grade perfume
        is made using its
        internal poisongases by diluting
        them to the high­
        est level.
    crystal:
      en: |-
        When it inhales
        poisonous gases
        from garbage, itsbody expands, and
        its insides smell
        much worse.
    ruby:
      en: |-
        WEEZING loves the gases given off by
        rotted kitchen garbage. This POKéMON
        will find a dirty, unkempt house andmake it its home. At night, when the
        people in the house are asleep, it will
        go through the trash.
    sapphire:
      en: |-
        WEEZING alternately shrinks and
        inflates its twin bodies to mix together
        toxic gases inside.The more the gases are mixed, the more
        powerful the toxins become. The
        POKéMON also becomes more putrid.
    emerald:
      en: |-
        By diluting its toxic gases with a special
        process, the highest grade of perfume can
        be extracted. To WEEZING, gases emanating
        from garbage are the ultimate feast.
    firered:
      en: |-
        Very rarely, a sudden mutation can result
        in two small KOFFING twins becoming
        conjoined as a WEEZING.
    leafgreen:
      en: |-
        Where two kinds of poison gases meet, two
        KOFFING can fuse into a WEEZING over
        many years.
    diamond:
      en: |-
        It grows by feeding on gases
        released by garbage. Though very
        rare, triplets have been found.
    pearl:
      en: |-
        It grows by feeding on gases
        released by garbage. Though very
        rare, triplets have been found.
    platinum:
      en: |-
        It grows by feeding on gases
        released by garbage. Though very
        rare, triplets have been found.
    heartgold:
      en: |-
        If one of the twin KOFFING inflates,
        the other one deflates. It constantly
        mixes its poisonous gases.
    soulsilver:
      en: |-
        Top-grade perfume is made using its
        internal poison gases by diluting
        them to the highest level.
    black:
      en: |-
        It grows by feeding on gases
        released by garbage. Though very
        rare, triplets have been found.
      fr: |-
        Il grandit en absorbant les gaz des
        détritus. Des triplés existent, bien
        qu’ils soient fort rares.
    white:
      en: |-
        It grows by feeding on gases
        released by garbage. Though very
        rare, triplets have been found.
      fr: |-
        Il grandit en absorbant les gaz des
        détritus. Des triplés existent, bien
        qu’ils soient fort rares.
    black-2:
      en: |-
        Inhaling toxic fumes from trash
        and mixing them inside its body
        lets it spread an even fouler stench.
    white-2:
      en: |-
        Inhaling toxic fumes from trash
        and mixing them inside its body
        lets it spread an even fouler stench.
    x:
      ja-Hrkt: |-
        どちらかが　ふくらむと　かたほうは
        しぼむ　ふたごの　ドガース。いつも
        たいないの　どくガスを　まぜている。
      ja: |-
        どちらかが　ふくらむと　片方は
        しぼむ　双子の　ドガース。いつも
        体内の　毒ガスを　混ぜている。
      ko: |-
        한쪽이 부풀어 오르면 다른 한쪽은
        오그라드는 쌍둥이 또가스. 항상
        체내의 독가스를 섞고 있다.
      en: |-
        If one of the twin Koffing inflates, the other one
        deflates. It constantly mixes its poisonous gases.
      fr: |-
        Si l’un des deux Smogo se gonfle, l’autre se
        dégonfle. Ils mélangent leurs gaz en permanence.
      de: |-
        Pumpt sich eines der zwei Smogon auf, lässt das
        andere Luft ab. So findet ein Giftgasaustausch statt.
      es: |-
        Si uno de los gemelos Koffing se infla, el otro se
        desinfla. Mezclan constantemente sus venenosos
        gases.
      it: |-
        Se un gemello Koffing si sgonfia, l’altro si gonfia.
        I gas velenosi dei due si mischiano continuamente.
    'y':
      ja-Hrkt: |-
        ごくまれに　とつぜんへんいで
        ふたごの　ちいさい　ドガースが
        れんけつしたまま　でることがある。
      ja: |-
        ごくまれに　突然変異で
        双子の　小さい　ドガースが
        連結したまま　出ることがある。
      ko: |-
        극히 드물게 돌연변이로
        쌍둥이인 작은 또가스가
        연결된 채로 나오는 때가 있다.
      en: |-
        Very rarely, a sudden mutation can result in two
        small Koffing twins becoming conjoined as
        a Weezing.
      fr: |-
        Il peut arriver que deux Smogo mutent et s’associent
        pour former un Smogogo, mais c’est très rare.
      de: |-
        Sehr selten führt eine plötzliche Mutation eines
        Zwillings-Smogon zu einer Verbindung zu Smogmog.
      es: |-
        En raras ocasiones, se produce una mutación y dos
        pequeños Koffing se unen formando un Weezing.
      it: |-
        Una rarissima mutazione può trasformare due
        Koffing gemelli in un Weezing.
    omega-ruby:
      ja-Hrkt: |-
        くさった　なまゴミから　でる　ガスが　だいすき。
        そうじを　しない　いえに　すみつき　かぞくが
        ねしずまった　まよなか　ゴミばこを　あさる。
      ja: |-
        腐った　生ゴミから　出る　ガスが　大好き。
        掃除を　しない　家に　すみつき　家族が
        寝静まった　真夜中　ゴミ箱を　漁る。
      ko: |-
        부패한 음식물 쓰레기에서 나온 가스를 매우 좋아한다.
        청소하지 않는 집에서 눌러살며 가족이
        모두 잠든 한밤중에 쓰레기통을 뒤진다.
      en: |-
        Weezing loves the gases given off by rotted kitchen garbage.
        This Pokémon will find a dirty, unkempt house and make it its
        home. At night, when the people in the house are asleep, it will
        go through the trash.
      fr: |-
        Smogogo adore les gaz qui se dégagent des aliments pourris
        dans les poubelles. Ce Pokémon cherche généralement
        les maisons sales et mal tenues pour y habiter.
        La nuit, quand tout le monde est endormi, il fouille les détritus.
      de: |-
        Smogmog liebt die Gase verrottender, fauler Küchenabfälle.
        Dieses Pokémon sucht sich ein vernachlässigtes, schmutziges
        Gebäude und richtet sich dort häuslich ein. Nachts, wenn die
        Menschen schlafen, wühlt es im Müll.
      es: |-
        A Weezing le encantan los gases que emanan de los
        desperdicios que quedan en la cocina. Este Pokémon busca
        casas sucias y descuidadas para crear su hogar. De noche,
        cuando los habitantes de la casa duermen, va a por la basura.
      it: |-
        Weezing adora i gas emanati dai resti alimentari in
        decomposizione. Si sente a suo agio in case sudicie
        e maltenute. La notte, mentre dormono tutti, lui si aggira
        furtivo tra i rifiuti domestici.
    alpha-sapphire:
      ja-Hrkt: |-
        ふたごの　からだを　こうごに　しぼませたり
        ふくらませたりして　どくガスを　まぜている。
        まぜるほど　どくそが　つよまり　くさくなる。
      ja: |-
        双子の　体を　交互に　しぼませたり
        膨らませたりして　毒ガスを　混ぜている。
        混ぜるほど　毒素が　強まり　臭くなる。
      ko: |-
        똑같이 생긴 몸을 교대로 오그라트리고
        부풀리면서 독가스를 섞고 있다.
        섞을수록 독소가 강해져 악취가 난다.
      en: |-
        Weezing alternately shrinks and inflates its twin bodies to mix
        together toxic gases inside. The more the gases are mixed,
        the more powerful the toxins become. The Pokémon also
        becomes more putrid.
      fr: |-
        Smogogo rétrécit ou gonfle ses deux corps pour mélanger
        les gaz toxiques qui s’y trouvent. Lorsque les gaz sont bien
        mélangés, la toxine devient très puissante. Le Pokémon
        se putréfie aussi un peu plus.
      de: |-
        Smogmog bläst seine beiden Körper abwechselnd auf
        und lässt sie wieder zusammenschrumpfen, um die giftigen
        Gase darin zu vermischen. Je mehr Gase vermischt werden,
        desto stärker werden die Toxine.
      es: |-
        Weezing reduce y agranda el doble cuerpo que tiene para
        mezclar los gases tóxicos que contiene. Cuantos más gases
        mezcle, mayor será la toxicidad y el nivel de putrefacción
        del Pokémon.
      it: |-
        Weezing gonfia e sgonfia ritmicamente il suo duplice corpo
        per miscelare i gas tossici all’interno. Più a lungo vengono
        mescolati i gas, più nocive diventano le tossine. Anche
        il Pokémon diventa ancora più putrido.
    lets-go-pikachu:
      ja-Hrkt: |-
        ゴミのなかに　ふくまれている
        どくガス　バイきん　ほこりを
        きゅうしゅうして　いきている。
      ja: |-
        ゴミの中に　含まれている
        毒ガス　バイ菌　ほこりを
        吸収して　生きている。
      ko: |-
        쓰레기 속에 포함된
        독가스, 세균, 먼지를
        흡수하며 살고 있다.
      zh-Hant: |-
        牠是靠著吸收垃圾中
        含有的毒氣、細菌和灰塵
        來維持生命。
      zh-Hans: |-
        它要靠吸收垃圾
        里的毒气、细菌和
        灰尘来维持生命。
      en: |-
        This Pokémon lives and grows by absorbing
        poison gas, dust, and germs that exist
        inside garbage.
      fr: |-
        Ce Pokémon se nourrit des gaz toxiques,
        des germes et de la poussière qu’il trouve
        dans les tas d’ordures.
      de: |-
        Smogmog ernährt sich von allerlei Müll, aus dem
        es Köstlichkeiten wie giftige Gase, Bakterien und
        Staub absorbiert.
      es: |-
        Este Pokémon se alimenta de los gases
        venenosos, los gérmenes y el polvo que
        encuentra en la basura.
      it: |-
        Vive assorbendo i gas tossici, i germi
        e la polvere che si trovano nei rifiuti.
    lets-go-eevee:
      ja-Hrkt: |-
        ゴミのなかに　ふくまれている
        どくガス　バイきん　ほこりを
        きゅうしゅうして　いきている。
      ja: |-
        ゴミの中に　含まれている
        毒ガス　バイ菌　ほこりを
        吸収して　生きている。
      ko: |-
        쓰레기 속에 포함된
        독가스, 세균, 먼지를
        흡수하며 살고 있다.
      zh-Hant: |-
        牠是靠著吸收垃圾中
        含有的毒氣、細菌和灰塵
        來維持生命。
      zh-Hans: |-
        它要靠吸收垃圾
        里的毒气、细菌和
        灰尘来维持生命。
      en: |-
        This Pokémon lives and grows by absorbing
        poison gas, dust, and germs that exist
        inside garbage.
      fr: |-
        Ce Pokémon se nourrit des gaz toxiques,
        des germes et de la poussière qu’il trouve
        dans les tas d’ordures.
      de: |-
        Smogmog ernährt sich von allerlei Müll, aus dem
        es Köstlichkeiten wie giftige Gase, Bakterien und
        Staub absorbiert.
      es: |-
        Este Pokémon se alimenta de los gases
        venenosos, los gérmenes y el polvo que
        encuentra en la basura.
      it: |-
        Vive assorbendo i gas tossici, i germi
        e la polvere che si trovano nei rifiuti.
    sword:
      ja-Hrkt: |-
        ２つの　からだで　ガスを　まぜる。
        むかしの　ガラルでは　そこらじゅうで
        すがたを　みかけたらしい。
      ja: |-
        ２つの　体で　ガスを　混ぜる。
        むかしの　ガラルでは　そこらじゅうで
        姿を　見かけたらしい。
      ko: |-
        2개의 몸에서 가스를 섞는다.
        과거의 가라르에서는 흔하게
        볼 수 있었다고 한다.
      zh-Hant: |-
        用２個身體來混合瓦斯。
        在往昔的伽勒爾似乎到處
        都能見到牠們的身影。
      zh-Hans: |-
        用２个身体来混合瓦斯。
        在往昔的伽勒尔似乎
        到处都能见到它们的身影。
      en: |-
        It mixes gases between its two bodies.
        It’s said that these Pokémon were seen
        all over the Galar region back in the day.
      fr: |-
        Il mélange des gaz dans ses deux corps.
        On raconte qu’autrefois, on en voyait partout
        dans la région de Galar.
      de: |-
        In seinen beiden Körpern vermischt es Gase.
        Man sagt, dass es früher überall in der
        Galar-Region anzutreffen gewesen sei.
      es: |-
        Usa sus dos cuerpos para mezclar gases. Según
        parece, en el pasado podían hallarse ejemplares
        por todos los rincones de Galar.
      it: |-
        Si serve del suo duplice corpo per miscelare i
        gas. Sembra che in passato lo si potesse avvistare
        un po’ ovunque nella regione di Galar.
    shield:
      ja-Hrkt: |-
        ガラルの　マタドガスよりも　くうきを
        すいこむ　ちからは　すこし　よわいが
        つくりだす　どくそは　きょうりょく。
      ja: |-
        ガラルの　マタドガスよりも　空気を
        吸いこむ　力は　少し　弱いが
        作りだす　毒素は　強力。
      ko: |-
        가라르의 또도가스보다 공기를
        흡입하는 힘은 조금 약하지만
        내뿜는 독소는 강력하다.
      zh-Hant: |-
        雖然吸入空氣的力量
        稍弱於伽勒爾的雙彈瓦斯，
        製造出的毒素卻更加強力。
      zh-Hans: |-
        虽然吸入空气的力量
        稍弱于伽勒尔的双弹瓦斯，
        制造出的毒素却更加强力。
      en: |-
        It can’t suck in air quite as well as a Galarian
        Weezing, but the toxins it creates are more
        potent than those of its counterpart.
      fr: |-
        Il ne peut pas aspirer autant d’air que le Smogogo
        de Galar, mais le poison qu’il produit est plus
        puissant.
      de: |-
        Es kann zwar nicht so viel Luft einsaugen wie die
        Smogmog aus Galar, dafür sind aber die Toxine,
        die es produziert, umso stärker.
      es: |-
        Posee una capacidad de succión inferior a la del
        Weezing de Galar, pero las toxinas que genera
        son más potentes.
      it: |-
        La sua capacità di aspirare l’aria è leggermente
        inferiore rispetto al Weezing di Galar, ma è
        in grado di produrre tossine molto potenti.
