impidimp:
  base_happiness: 50
  capture_rate: 255
  color: pink
  egg_groups:
    - fairy
    - humanshape
  evolution_chain: impidimp
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        ひとや　ポケモンが　いやがる　ときに
        はっする　マイナスエネルギーを
        はなから　すいこみ　げんきになる。
      ja: |-
        人や　ポケモンが　嫌がる　ときに
        発する　マイナスエネルギーを
        鼻から　吸いこみ　元気になる。
      ko: |-
        사람이나 포켓몬이 싫어하는 감정을
        가질 때 발생시키는 마이너스 에너지를
        코로 빨아들여서 건강해진다.
      zh-Hant: |-
        會用鼻子吸收人類或寶可夢
        情緒糟糕時產生的負能量，
        來為自己補充活力。
      zh-Hans: |-
        会用鼻子吸收人类或宝可梦
        情绪糟糕时产生的负能量，
        来为自己补充活力。
      en: |-
        Through its nose, it sucks in the emanations
        produced by people and Pokémon when they
        feel annoyed. It thrives off this negative energy.
      fr: |-
        Pour se refaire une santé, il hume l’énergie
        négative que les humains et les Pokémon
        dégagent quand ils sont irrités.
      de: |-
        Es wird kräftiger, indem es die von unzufriedenen
        Menschen und Pokémon ausgestoßene negative
        Energie einatmet.
      es: |-
        Con el fin de revitalizarse, inhala por la nariz la
        energía negativa que desprenden tanto personas
        como Pokémon cuando están descontentos.
      it: |-
        Recupera le forze inalando dal naso l’energia
        negativa emessa da persone e Pokémon quando
        sono irritati.
    shield:
      ja-Hrkt: |-
        みんかに　しのびこみ　ぬすみを
        はたらき　さらに　くやしがる　ひとの
        マイナスエネルギーも　いただくのだ。
      ja: |-
        民家に　忍びこみ　盗みを
        働き　さらに　悔しがる　人の
        マイナスエネルギーも　いただくのだ。
      ko: |-
        민가에 숨어들어 도둑질을
        하고 속상해하는 사람의
        마이너스 에너지도 얻는다.
      zh-Hant: |-
        不但會溜進民宅偷盜，
        還會吸收人們悔恨時
        的負面能量。
      zh-Hans: |-
        不但会溜进民宅偷盗，
        还会吸收人们悔恨时
        的负面能量。
      en: |-
        It sneaks into people’s homes, stealing things
        and feasting on the negative energy of the
        frustrated occupants.
      fr: |-
        Il se glisse dans les foyers pour commettre
        un larcin et en profite pour se nourrir de l’énergie
        négative des habitants contrariés.
      de: |-
        Es schleicht sich in Häuser ein und geht dort auf
        Diebeszug. Zudem verleibt es sich die negative
        Energie der deshalb verärgerten Menschen ein.
      es: |-
        Se infiltra en las casas para hurtar a sus anchas y,
        por si fuera poco, nutrirse de la energía negativa
        que liberan sus contrariados habitantes.
      it: |-
        Si intrufola nelle case, ruba, e come se non
        bastasse si nutre anche dell’energia negativa
        dei padroni di casa rattristati per il furto.
