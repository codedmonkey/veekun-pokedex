  flavor_text:
    black:
      en: |-
        Each follows its Trainer’s orders as
        best it can, but they sometimes fail to
        understand complicated commands.
      fr: |-
        Il suit scrupuleusement les consignes
        de son Dresseur, mais il a du mal à
        comprendre les ordres trop compliqués.
    white:
      en: |-
        These Pokémon live in cities. They are
        accustomed to people. Flocks often
        gather in parks and plazas.
      fr: |-
        Ces Pokémon vivent en ville. Ils sont
        peu farouches et se regroupent souvent
        dans les parcs ou sur les places.
    black-2:
      en: |-
        This very forgetful Pokémon will
        wait for a new order from its Trainer
        even though it already has one.
    white-2:
      en: |-
        This very forgetful Pokémon will
        wait for a new order from its Trainer
        even though it already has one.
    x:
      ja-Hrkt: |-
        とても　わすれっぽい　ポケモンで
        トレーナーに　めいれい　されたのに
        あたらしい　めいれいを　まっている。
      ja: |-
        とても　忘れっぽい　ポケモンで
        トレーナーに　命令　されたのに
        新しい　命令を　待っている。
      ko: |-
        매우 건망증이 심한 포켓몬으로
        트레이너에게 명령을 받았어도
        새로운 명령을 기다리고 있다.
      en: |-
        This very forgetful Pokémon will wait for a new
        order from its Trainer even though it already
        has one.
      fr: |-
        Un Pokémon très distrait qui oublie les ordres de son
        Dresseur et reste planté à en attendre de nouveaux.
      de: |-
        Wartet oft vergeblich auf Anweisungen,
        obwohl es bereits einen Befehl erhalten hat.
        Ein sehr zerstreutes Pokémon.
      es: |-
        Es un Pokémon muy despistado. Aunque reciba
        órdenes de su Entrenador, se le olvidan, y se queda
        esperando.
      it: |-
        È un Pokémon un po’ smemorato. A volte dimentica
        l’ordine appena ricevuto e allora aspetta di riceverne
        un altro.
    'y':
      ja-Hrkt: |-
        まちなかで　くらしている　ポケモン。
        ひとなつっこいので　こうえんや
        ひろばに　たくさん　あつまってくる。
      ja: |-
        街中で　暮らしている　ポケモン。
        人懐っこいので　公園や　広場に
        たくさん　集まってくる。
      ko: |-
        거리에 사는 포켓몬이다.
        사람을 잘 따라서 공원이나
        광장에 많이 모인다.
      en: |-
        These Pokémon live in cities. They are accustomed
        to people. Flocks often gather in parks and plazas.
      fr: |-
        Ces Pokémon vivent en ville. Ils sont peu farouches
        et se regroupent souvent dans les parcs ou sur
        les places.
      de: |-
        Ein Pokémon, das in der Stadt zu Hause ist. Es ist
        sehr zutraulich und bevölkert in Scharen öffentliche
        Plätze und Parks.
      es: |-
        Vive en la ciudad, pues se lleva muy bien con la gente.
        Le encantan los parques y las plazas, donde se reúne
        con otros.
      it: |-
        Pokémon che vive in città. Si affeziona facilmente
        alle persone, perciò non è strano trovarlo in parchi
        o piazze.
    omega-ruby:
      ja-Hrkt: |-
        とても　わすれっぽい　ポケモンで
        トレーナーに　めいれい　されたのに
        あたらしい　めいれいを　まっている。
      ja: |-
        とても　忘れっぽい　ポケモンで
        トレーナーに　命令　されたのに
        新しい　命令を　待っている。
      ko: |-
        매우 건망증이 심한 포켓몬으로
        트레이너에게 명령을 받았어도
        새로운 명령을 기다리고 있다.
      en: |-
        This very forgetful Pokémon will wait for a new
        order from its Trainer even though it already
        has one.
      fr: |-
        Un Pokémon très distrait qui oublie les ordres de son Dresseur
        et reste planté à en attendre de nouveaux.
      de: |-
        Wartet oft vergeblich auf Anweisungen, obwohl es bereits
        einen Befehl erhalten hat. Ein sehr zerstreutes Pokémon.
      es: |-
        Es un Pokémon muy despistado. Aunque reciba órdenes de
        su Entrenador, se le olvidan, y se queda esperando.
      it: |-
        È un Pokémon un po’ smemorato. A volte dimentica l’ordine
        appena ricevuto e allora aspetta di riceverne un altro.
    alpha-sapphire:
      ja-Hrkt: |-
        まちなかで　くらしている　ポケモン。
        ひとなつっこいので　こうえんや
        ひろばに　たくさん　あつまってくる。
      ja: |-
        街中で　暮らしている　ポケモン。
        人懐っこいので　公園や　広場に
        たくさん　集まってくる。
      ko: |-
        거리에 사는 포켓몬이다.
        사람을 잘 따라서 공원이나
        광장에 많이 모인다.
      en: |-
        These Pokémon live in cities. They are accustomed
        to people. Flocks often gather in parks and plazas.
      fr: |-
        Ces Pokémon vivent en ville. Ils sont peu farouches
        et se regroupent souvent dans les parcs ou sur les places.
      de: |-
        Ein Pokémon, das in der Stadt zu Hause ist. Es ist sehr
        zutraulich und bevölkert in Scharen öffentliche Plätze
        und Parks.
      es: |-
        Vive en la ciudad, pues se lleva muy bien con la gente. Le
        encantan los parques y las plazas, donde se reúne con otros.
      it: |-
        Pokémon che vive in città. Si affeziona facilmente alle persone,
        perciò non è strano trovarlo in parchi o piazze.
    sword:
      ja-Hrkt: |-
        ひとのすむ　ばしょに　あらわれる。
        エサを　まくと　なんびゃくひきでも
        あつまってくるので　ちゅういだぞ。
      ja: |-
        人の住む　場所に　現れる。
        エサを　まくと　何百匹でも
        集まってくるので　注意だぞ。
      ko: |-
        사람이 사는 곳에 나타난다.
        먹이를 뿌려주면 수백 마리가
        모여들기 때문에 주의해야 한다.
      zh-Hant: |-
        會出現在人類生活的地方。
        一旦撒出飼料就會有好幾百隻
        豆豆鴿聚集而來，千萬要小心。
      zh-Hans: |-
        会出现在人类生活的地方。
        一旦撒出饲料就会有好几百只
        豆豆鸽聚集而来，千万要小心。
      en: |-
        Where people go, these Pokémon follow.
        If you’re scattering food for them, be careful—
        several hundred of them can gather at once.
      fr: |-
        On en trouve là où vivent les humains.
        Mieux vaut éviter de les nourrir, sous peine
        d’en voir arriver des centaines.
      de: |-
        Es taucht dort auf, wo Menschen leben. Beim
        Füttern muss man vorsichtig sein, da sich sonst
        schnell hunderte von ihnen versammeln können.
      es: |-
        Aparece en lugares habitados por humanos.
        Conviene tener cuidado al darles de comer, ya
        que esto podría atraer a cientos de ejemplares.
      it: |-
        Appare dovunque vivano delle persone. Meglio
        essere prudenti quando gli si dà del cibo, perché
        potrebbero accorrere centinaia di esemplari.
    shield:
      ja-Hrkt: |-
        わすれっぽく　かしこくはないが
        ひとなつっこくて　まじめなので
        かわいがる　トレーナーは　おおい。
      ja: |-
        忘れっぽく　賢くはないが
        人懐っこくて　真面目なので
        かわいがる　トレーナーは　多い。
      ko: |-
        건망증이 심하고 영리하지 않지만
        사람을 잘 따르고 착실해서
        귀여워하는 트레이너가 많다.
      zh-Hant: |-
        雖然既健忘又不太聰明，
        因為性格認真且容易親近人，
        所以受到了許多訓練家的喜愛。
      zh-Hans: |-
        虽然既健忘又不太聪明，
        因为性格认真且容易亲近人，
        所以受到了许多训练家的喜爱。
      en: |-
        It’s forgetful and not very bright, but many
        Trainers love it anyway for its friendliness
        and sincerity.
      fr: |-
        Il n’est pas très malin et un peu distrait,
        mais beaucoup de Dresseurs l’apprécient pour
        son caractère affectueux et sa bonne volonté.
      de: |-
        Sie sind vergesslich und nicht besonders clever,
        aber da sie sehr zutraulich und fleißig sind, haben
        viele Trainer sie ins Herz geschlossen.
      es: |-
        Es muy olvidadizo y no demasiado avispado,
        pero muchos Entrenadores le tienen simpatía
        por su carácter afable y sincero.
      it: |-
        È un po’ smemorato e non molto sveglio.
        Tuttavia è diligente e si affeziona facilmente,
        e per questo molti Allenatori lo adorano.
