        which allows it to see into the future.
      fr: |-
        Peut prédire l’avenir s’il se concentre en fixant la flamme
        qui danse au bout de sa canne.
      de: |-
        Es kann die Zukunft vorhersehen, indem es konzentriert
        in die Flamme an der Spitze seines Zweiges blickt.
      es: |-
        Fija la mirada en la llama que arde en la punta de su bastón
        para concentrarse y prever sucesos que tienen lugar en el
        futuro.
      it: |-
        Fissando la fiamma del ramo che ha in mano, aumenta
        al massimo la concentrazione e può predire il futuro.
    alpha-sapphire:
      ja-Hrkt: |-
        せっし３０００どの　ほのおの　うずを
        ちょうのうりょくで　あやつる。
        てきを　うずで　つつみ　やきつくす。
      ja: |-
        摂氏３０００度の　炎の　渦を
