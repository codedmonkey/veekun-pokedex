delphox:
  base_happiness: 70
  capture_rate: 45
  color: red
  egg_groups:
    - ground
  evolution_chain: fennekin
  evolves_from: braixen
  flavor_text:
    x:
      ja-Hrkt: |-
        つえの　せんたんで　もえる　ほのおを
        みつめて　せいしんとういつすると
        みらいの　できごとを　みとおせる。
      ja: |-
        杖の　先端で　燃える　炎を　見つめて
        精神統一すると
        未来の　出来事を　見通せる。
      ko: |-
        지팡이 끝의 타오르는 불꽃을
        바라보며 정신을 통일하면
        미래에 일어날 일을 내다볼 수 있다.
      en: |-
        It gazes into the flame at the tip of
        its branch to achieve a focused state,
        which allows it to see into the future.
      fr: |-
        Peut prédire l’avenir s’il se concentre en fixant
        la flamme qui danse au bout de sa canne.
      de: |-
        Es kann die Zukunft vorhersehen, indem es
        konzentriert in die Flamme an der Spitze
        seines Zweiges blickt.
      es: |-
        Fija la mirada en la llama que arde en la punta de su
        bastón para concentrarse y prever sucesos que
        tienen lugar en el futuro.
      it: |-
        Fissando la fiamma del ramo che ha in mano, aumenta
        al massimo la concentrazione e può predire il futuro.
    'y':
      ja-Hrkt: |-
        せっし３０００どの　ほのおの　うずを
        ちょうのうりょくで　あやつる。
        てきを　うずで　つつみ　やきつくす。
      ja: |-
        摂氏３０００度の　炎の　渦を
        超能力で　操る。
        敵を　渦で　包み　焼きつくす。
      ko: |-
        섭씨 3000도의 불꽃 소용돌이를
        초능력으로 조종한다.
        적을 소용돌이로 감싸 불태운다.
      en: |-
        Using psychic power, it generates a
        fiery vortex of 5,400 degrees Fahrenheit,
        incinerating foes swept into this whirl of flame.
      fr: |-
        Ses pouvoirs psychiques lui permettent de créer
        des tourbillons de flammes à 3 000 °C qui
        enveloppent et consument ses ennemis.
      de: |-
        Mit seinen übernatürlichen Kräften kontrolliert es einen
        3 000 °C heißen Flammenwirbel, mit dem es seine
        Gegner umhüllt und sie verbrennt.
      es: |-
        Sus poderes psíquicos le permiten controlar vórtices
        de fuego a 3000 °C que envuelven y calcinan a sus
        enemigos.
      it: |-
        Grazie ai suoi poteri psichici, può generare un vortice
        di fiamme a 3000 °C con il quale avvolge i nemici
        e li incenerisce.
    omega-ruby:
      ja-Hrkt: |-
        つえの　せんたんで　もえる　ほのおを
        みつめて　せいしんとういつすると
        みらいの　できごとを　みとおせる。
      ja: |-
        杖の　先端で　燃える　炎を　見つめて
