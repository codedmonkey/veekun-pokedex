        うでの　ちからで　うみから　はいだし
        みずべの　えものに　おそいかかる。
        いっしゅんで　うみへ　ひきずりこむ。
      ja: |-
        腕の　力で　海から　はい出し
        水辺の　獲物に　襲いかかる。
        一瞬で　海へ　引きずりこむ。
      ko: |-
        팔 힘으로 바다에서 기어 나와
        물가에 있는 먹이를 덮친다.
        한순간에 바다로 끌고 들어간다.
      en: |-
        They crawl out of the ocean using their arms.
        They will attack prey on shore and immediately drag
        it into the ocean.
      fr: |-
        Il peut sortir de l’eau à la force de ses bras pour
        attraper des proies sur la rive. Il retourne à l’eau
        en un instant.
      de: |-
        Es schleppt sich mithilfe seiner Arme an Land,
        schnappt nach seiner Beute und zerrt sie
        augenblicklich ins Meer.
      es: |-
        Sale del mar con la fuerza de sus brazos y ataca a sus
        presas en la costa. Luego se las lleva de vuelta al mar.
      it: |-
        Striscia fuori dal mare con la sola forza dei propri
        arti. Poi attacca la preda a riva e con un guizzo la
        trascina con sé.
