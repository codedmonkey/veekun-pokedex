  flavor_text:
    black:
      en: |-
        They crawl out of the ocean using their
        arms. They will attack prey on shore and
        immediately drag it into the ocean.
      fr: |-
        Il peut sortir de l’eau à la force de ses
        bras pour attraper des proies sur la
        rive. Il retourne à l’eau en un instant.
    white:
      en: |-
        With their sucker mouths, they
        suck in prey. Then they use their fangs
        to shock the prey with electricity.
      fr: |-
        Il s’attache à ses proies avec sa
        bouche-ventouse et les électrocute
        avec ses crocs.
    black-2:
      en: |-
        It latches on to prey with its sucker
        mouth, sinking in its fangs and shocking
        the prey with powerful electricity.
    white-2:
      en: |-
        It latches on to prey with its sucker
        mouth, sinking in its fangs and shocking
        the prey with powerful electricity.
    x:
      ja-Hrkt: |-
        きゅうばんの　くちで　えものに
        すいつき　くいこませた　キバから
        でんきを　ながして　かんでんさせる。
      ja: |-
        吸盤の　口で　獲物に　吸いつき
        食いこませた　キバから
        電気を　流して　感電させる。
      ko: |-
        흡반 같은 입으로 먹이에
        달라붙은 후 박아 넣은 이빨을
        통해 전기를 흘려 감전시킨다.
      en: |-
        With their sucker mouths, they suck in prey.
        Then they use their fangs to shock the prey
        with electricity.
      fr: |-
        Il s’attache à ses proies avec sa bouche-ventouse et
        les électrocute avec ses crocs.
      de: |-
        Mit dem Saugnapf an seinem Maul hakt es sich
        an seiner Beute fest und versetzt ihr über seine
        Fangzähne Stromschläge.
      es: |-
        Pega la ventosa de su boca en su presa y la
        electrocuta con sus colmillos.
      it: |-
        Si attacca alla preda con la bocca a ventosa e la
        fulmina attraverso i denti conficcati.
    'y':
