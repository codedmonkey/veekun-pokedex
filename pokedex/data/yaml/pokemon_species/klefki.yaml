klefki:
  base_happiness: 50
  capture_rate: 75
  color: gray
  egg_groups:
    - mineral
  evolution_chain: klefki
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        カギを　あつめる　しゅうせい。
        てきに　おそわれると　ジャラジャラと
        カギを　うちならして　いかくする。
      ja: |-
        カギを　集める　習性。
        敵に　襲われると　ジャラジャラと
        カギを　打ち鳴らして　威嚇する。
      ko: |-
        열쇠를 모으는 습성이 있다.
        적에게 습격당하면 열쇠로
        짤랑짤랑 소리를 내어 위협한다.
      en: |-
        These key collectors threaten any attackers
        by fiercely jingling their keys at them.
      fr: |-
        Ce Pokémon collectionne les clés qu’il agite devant
        ses ennemis pour les intimider.
      de: |-
        Dieses Pokémon sammelt eifrig Schlüssel, mit denen
        es wild herumfuchtelt, um Gegner abzuschrecken.
      es: |-
        Tiene el hábito de coleccionar llaves. Cuando un
        enemigo lo ataca, las hace tintinear como método
        de intimidación.
      it: |-
        Ha l’abitudine di raccogliere chiavi. Quando viene
        attaccato, minaccia il nemico agitandole e facendo
        un gran chiasso.
    'y':
      ja-Hrkt: |-
        きにいった　カギは　ぜったいに
        てばなさないので　ぼうはんのために
        きんこの　カギを　もたせるのだ。
      ja: |-
        気に入った　カギは　絶対に
        手放さないので　防犯のために
        金庫の　カギを　持たせるのだ。
      ko: |-
        마음에 든 열쇠는 절대로
        손에서 놓지 않아서 방범을 위해
        금고 열쇠를 지니게 한다.
      en: |-
        It never lets go of a key that it likes,
        so people give it the keys to vaults and
        safes as a way to prevent crime.
      fr: |-
        Comme il ne se sépare jamais d’une clé qu’il trouve
        à son goût, les gens lui confient celle de leurs coffres,
        afin d’éviter de se faire voler.
      de: |-
        Da es Schlüssel, die ihm gefallen, wie seinen Augapfel
        hütet, vertrauen Menschen ihm die Schlüssel ihrer
        Tresore an, um Diebstahl vorzubeugen.
      es: |-
        Como no se separa de las llaves que le gustan bajo
        ningún concepto, la gente le encomienda las llaves
        de cajas fuertes para prevenir posibles robos.
      it: |-
        Spesso gli esseri umani affidano a questo Pokémon
        le chiavi delle loro casseforti per prevenire i furti.
        Si sa infatti che custodisce con cura le chiavi che ama.
