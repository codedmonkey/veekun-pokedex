    sun:
      ja-Hrkt: |-
        カギを　あつめる　しゅうせいが　ある。
        おだやかな　せいかくだが　みんかに
        しのびこみ　カギを　ぬすんでいく。
      ja: |-
        カギを　集める　習性が　ある。
        穏やかな　性格だが　民家に
        忍び込み　カギを　盗んでいく。
      ko: |-
        열쇠를 모으는 습성이 있다.
        온화한 성격이지만 민가에
        몰래 들어가 열쇠를 훔쳐간다.
      zh-Hant: |-
        有收集鑰匙的習慣。
        性格穩重，卻會偷偷潛入
        民居偷盜鑰匙。
      zh-Hans: |-
        有着收集钥匙的习性。
        性格稳重，却会偷偷潜入
        民宅偷盗钥匙。
      en: |-
        This even-tempered Pokémon has a habit of
        collecting keys. It will sneak into people’s homes
        to steal their keys.
      fr: |-
        Malgré son caractère paisible, ce Pokémon ne
        peut s’empêcher de se faufiler dans les foyers
        pour en voler les clés, qu’il aime collectionner.
      de: |-
        Dieses Pokémon sammelt eifrig Schlüssel,
        die es oft aus fremden Häusern entwendet.
        Ansonsten ist es aber sehr friedlich.
      es: |-
        Tiene el hábito de coleccionar llaves. Su carácter
        tranquilo no impide que le guste colarse en
        casas ajenas a robar llaves.
      it: |-
        Ha un carattere pacifico, ma non resiste alla
        tentazione di intrufolarsi nelle case per rubare
        chiavi, che adora collezionare.
    moon:
      ja-Hrkt: |-
        あたまのツノを　きんぞくの　すきまに
        つっこんで　きんぞくイオンを　すう。
        なぜか　カギを　あつめている。
      ja: |-
        頭の角を　金属の　すき間に
        突っ込んで　金属イオンを　吸う。
        なぜか　カギを　集めている。
      ko: |-
        머리의 뿔을 금속 틈에
        찔러넣고 금속 이온을 빨아들인다.
        왜인지 열쇠를 모으고 있다.
      zh-Hant: |-
        把頭上的角刺入金屬的縫隙中，
        吸取金屬離子。
        另外，不知為何在收集鑰匙。
      zh-Hans: |-
        把头上的角刺入金属的缝隙中，
        吸取金属离子。
        不知为何在收集钥匙。
      en: |-
        It inserts its horn into chinks in metal, absorbing
        metal ions. For some reason, it collects keys.
      fr: |-
        Il insère l’appendice situé sur sa tête dans les
        interstices en métal afin d’en extraire les ions.
        Il collectionne les clés pour une raison inconnue.
      de: |-
        Seinen Fortsatz steckt es gerne in metallene
        Zwischenräume, um Metall-Ionen abzusaugen.
        Sammelt aus unerfindlichen Gründen Schlüssel.
      es: |-
        Introduce el apéndice de su cabeza por los
        resquicios de los metales para absorber los
        iones. Por alguna razón, adora las llaves.
      it: |-
        Infila la sporgenza che ha sulla testa negli
        interstizi tra oggetti di metallo per assorbire ioni.
        Ha la strana abitudine di collezionare chiavi.
    ultra-sun:
      ja-Hrkt: |-
        なぜ　カギを　あつめるか　ふめいだが
        あげると　とても　よろこぶ。　ただし
        マスターキーじゃないと　イヤみたい。
      ja: |-
        なぜ　カギを　集めるか　不明だが
        あげると　とても　喜ぶ。　ただし
        マスターキーじゃないと　イヤみたい。
      ko: |-
        왜 열쇠를 모으는지 알 수 없지만
        주면 매우 기뻐한다.
        단 마스터키만 좋아하는 것 같다.
      zh-Hant: |-
        雖不知牠為何要收集鑰匙，
        但如果給牠鑰匙，牠就會很開心。
        不過，牠似乎就只喜歡萬能鑰匙。
      zh-Hans: |-
        不知为何要收集钥匙，
        但如果给它的话，就会很高兴。
        不过好像不是万能钥匙就不喜欢。
      en: |-
        Although it’s unclear why it collects keys, giving
        it a key makes Klefki very happy. However, it
        apparently only likes master keys.
      fr: |-
        Nul ne sait pourquoi il collectionne les clés,
        mais il est aux anges dès qu’on lui en donne une.
        Il n’accepte toutefois que les passe-partout.
      de: |-
        Niemand weiß, weshalb es Schlüssel sammelt,
        aber schenkt man ihm einen, freut es sich sehr.
        Es akzeptiert allerdings nur Generalschlüssel.
      es: |-
        Su afán por coleccionar llaves es un misterio y
        se alegra mucho si le regalan una, pero si esta
        no es una llave maestra, se le tuerce la cara.
      it: |-
        Per qualche motivo che nessuno sa, colleziona
        chiavi. È felicissimo quando gliene regalano una,
        ma attenzione: accetta solo i passe-partout.
    ultra-moon:
      ja-Hrkt: |-
        むかしは　こうざんに　すんでいたが
        エサの　こうぶつが　へってきたので
        ひとざとに　あらわれるようになった。
      ja: |-
        昔は　鉱山に　棲んでいたが
        エサの　鉱物が　減ってきたので
        人里に　現れるようになった。
      ko: |-
        옛날에는 광산에 살았지만
        먹이인 광물이 줄어들어서
        사람이 사는 마을에 나타나기 시작했다.
      zh-Hant: |-
        過去棲息在礦山裡，因為
        作為食物的礦物逐漸減少，
        於是開始出現在人類的聚落中。
      zh-Hans: |-
        过去一直住在矿山里，
        但因为作为食物的矿物不断减少，
        便开始出现在村落里。
      en: |-
        Long ago it lived in mines, but once the minerals
        that make up its diet became scarcer, Klefki
        began appearing in human settlements.
      fr: |-
        Il vivait autrefois dans les mines, mais quand
        les minéraux dont il se délectait se sont faits
        plus rares, il a migré vers les villages.
      de: |-
        Früher lebte es in Minen. Da sein mineralisches
        Futter dort aber immer seltener wird, findet man
        es nun auch in Menschensiedlungen.
      es: |-
        Hace tiempo solía vivir en minas, pero tras la
        disminución de los minerales que le servían de
        alimento, se trasladó a poblaciones humanas.
      it: |-
        In passato viveva nelle miniere, ma poiché i
        minerali di cui si nutre si sono fatti più rari,
        adesso è possibile incontrarlo anche nei villaggi.
    sword:
      ja-Hrkt: |-
        カギを　あつめつづける　ポケモン。
        だいじな　カギを　あずけると
        なにが　あっても　まもってくれる。
      ja: |-
        鍵を　集めつづける　ポケモン。
        大事な　鍵を　預けると
        なにが　あっても　守ってくれる。
      ko: |-
        열쇠를 계속 모으는 포켓몬이다.
        소중한 열쇠를 맡기면
        무슨 일이 있어도 지켜준다.
      zh-Hant: |-
        不斷收集鑰匙的寶可夢。
        如果把重要的鑰匙交給牠，
        無論發生什麼牠都會全力保管。
      zh-Hans: |-
        一直在收集钥匙的宝可梦。
        如果把重要的钥匙托付给它，
        无论发生什么它都会全力守护。
      en: |-
        This Pokémon is constantly collecting keys.
        Entrust a Klefki with important keys, and the
        Pokémon will protect them no matter what.
      fr: |-
        Ce Pokémon collectionne les clés.
        Si on lui en confie une particulièrement
        importante, il la protègera coûte que coûte.
      de: |-
        Dieses Pokémon sammelt unaufhörlich Schlüssel.
        Vertraut man ihm einen besonders wichtigen an,
        beschützt es diesen um jeden Preis.
      es: |-
        Un Pokémon coleccionista de llaves. Si alguien le
        confía una muy importante, la protegerá como si
        le fuese la vida en ello.
      it: |-
        Colleziona chiavi. Se gli si affida una chiave
        importante, si può star sicuri che la proteggerà
        a ogni costo.
    shield:
      ja-Hrkt: |-
        あたまのさきで　きんぞくイオンを
        すいとる。　カギに　にているのは
        すきすぎて　まねているかららしい。
      ja: |-
        頭の先で　金属イオンを　吸い取る。
        鍵に　似ているのは
        好きすぎて　まねているかららしい。
      ko: |-
        머리끝으로 금속 이온을 흡수한다.
        열쇠를 너무 좋아한 나머지 흉내를 내서
        열쇠를 닮은 모습이 되었다고 한다.
      zh-Hant: |-
        會用頭的前端吸取金屬離子。
        據說是因為愛鑰匙成癡，
        因此擬態成鑰匙的樣子。
      zh-Hans: |-
        会用头的前端吸取金属离子。
        之所以长得像钥匙，据说是因为
        太过喜欢钥匙，情不自禁进行了模仿。
      en: |-
        Klefki sucks in metal ions with the horn topping
        its head. It seems this Pokémon loves keys so
        much that its head needed to look like one, too.
      fr: |-
        Il absorbe les ions métalliques avec l’appendice
        sur sa tête. Il paraît qu’il ressemble à une clé
        car il tient à imiter cet objet qu’il aime tant.
      de: |-
        Mit dem Fortsatz an seinem Kopf saugt Clavion
        Metall-Ionen ein. Anscheinend liebt es Schlüssel
        so sehr, dass es sie mit seinem Aussehen imitiert.
      es: |-
        Según parece, absorbe iones metálicos por el
        apéndice de la cabeza para adoptar una forma
        similar a la de sus amadas llaves.
      it: |-
        Assorbe gli ioni metallici con la sporgenza
        sulla testa. Si dice che abbia modificato il suo
        aspetto per assomigliare alle sue amate chiavi.
