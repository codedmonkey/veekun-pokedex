    sword:
      ja-Hrkt: |-
        まんげつのよる　かげが　かってに
        うごきだして　わらうのは
        ゲンガーの　しわざに　ちがいない。
      ja: |-
        満月の夜　影が　勝手に
        動きだして　笑うのは
        ゲンガーの　しわざに　違いない。
      ko: |-
        보름달이 뜬 밤에 그림자가
        멋대로 움직이면서 웃는다면
        팬텀의 소행임이 틀림없다.
      zh-Hant: |-
        滿月的夜晚，如果影子
        自己動起來並露出笑容，
        那肯定是耿鬼搞的鬼。
      zh-Hans: |-
        满月的夜晚，如果影子
        自己动起来并露出笑容，
        那肯定是耿鬼搞的鬼。
      en: |-
        On the night of a full moon, if shadows move on
        their own and laugh, it must be Gengar’s doing.
      fr: |-
        Un soir de pleine lune, si une ombre se met
        à bouger et éclate de rire, c’est sûrement
        l’œuvre d’un Ectoplasma.
      de: |-
        Wenn Schatten bei Vollmond plötzlich anfangen,
        sich zu bewegen und zu lachen, steckt zweifellos
        Gengar dahinter.
      es: |-
        Las noches de luna llena, a este Pokémon le
        gusta imitar las sombras de la gente y burlarse
        de sus miedos.
      it: |-
        Se in una notte di luna piena le ombre iniziano
        a muoversi e a ridere, è senza dubbio opera
        di Gengar.
    shield:
      ja-Hrkt: |-
        やまで　そうなんしたとき
        いのちを　うばいに　くらやみから
        あらわれることが　あるという。
      ja: |-
        山で　遭難したとき
        命を　奪いに　暗闇から
        現れることが　あるという。
      ko: |-
        산에서 조난하면 목숨을
        빼앗기 위해 어둠 속에서
        나타난다고 한다.
      zh-Hant: |-
        據說牠會為了奪取
        山中遇難者的生命
        而從黑暗中出現。
      zh-Hans: |-
        据说它会为了夺取
        山中遇难者的生命
        而从黑暗中出现。
      en: |-
        It is said to emerge from darkness to steal the
        lives of those who become lost in mountains.
      fr: |-
        On dit qu’Ectoplasma surgit parfois des ténèbres
        pour prendre la vie des personnes égarées
        en montagne.
      de: |-
        Man sagt, es sei aus Dunkelheit entstanden, um
        denjenigen, die sich in den Bergen verirrt haben,
        das Leben zu rauben.
      es: |-
