gengar:
  base_happiness: 50
  capture_rate: 45
  color: purple
  egg_groups:
    - indeterminate
  evolution_chain: gastly
  evolves_from: haunter
  flavor_text:
    red:
      en: |-
        Under a full moon,
        this POKéMON
        likes to mimicthe shadows of
        people and laugh
        at their fright.
    blue:
      en: |-
        Under a full moon,
        this POKéMON
        likes to mimicthe shadows of
        people and laugh
        at their fright.
    yellow:
      en: |-
        A GENGAR is close
        by if you feel a
        sudden chill.It may be trying
        to lay a curse
        on you.
    gold:
      en: |-
        It steals heat
        from its surround­
        ings. If you feela sudden chill, it
        is certain that a
        GENGAR appeared.
    silver:
      en: |-
        To steal the life
        of its target, it
        slips into theprey's shadow and
        silently waits for
        an opportunity.
    crystal:
      en: |-
        Hiding in people's
        shadows at night,
        it absorbs theirheat. The chill it
        causes makes the
        victims shake.
    ruby:
      en: |-
        Sometimes, on a dark night, your shadow
        thrown by a streetlight will suddenly
        and startlingly overtake you.It is actually a GENGAR running past
        you, pretending to be your shadow.
    sapphire:
      en: |-
        Sometimes, on a dark night, your shadow
        thrown by a streetlight will suddenly
        and startlingly overtake you.It is actually a GENGAR running past
        you, pretending to be your shadow.
    emerald:
      en: |-
        Deep in the night, your shadow cast by
        a streetlight may suddenly overtake you.
        It is actually a GENGAR running past
        you, pretending to be your shadow.
    firered:
      en: |-
        It is said to emerge from darkness to
        steal the lives of those who become lost
        in mountains.
    leafgreen:
      en: |-
        On the night of a full moon, if shadows
        move on their own and laugh, it must be
        GENGAR’s doing.
    diamond:
      en: |-
        It hides in shadows. It is said
        that if GENGAR is hiding, it cools
        the area by nearly 10 degrees F.
    pearl:
      en: |-
        Lurking in the shadowy corners
        of rooms, it awaits chances to
        steal its prey’s life force.
    platinum:
      en: |-
        The leer that floats in darkness
        belongs to a GENGAR delighting in
        casting curses on people.
    heartgold:
      en: |-
        It steals heat from its surroundings.
        If you feel a sudden chill,
        it is certain that a GENGAR appeared.
    soulsilver:
      en: |-
        To steal the life of its target, it
        slips into the prey’s shadow and
        silently waits for an opportunity.
    black:
      en: |-
        The leer that floats in darkness
        belongs to a Gengar delighting in
        casting curses on people.
      fr: |-
        Si vous croisez un regard
        inquiétant qui perce la nuit,
        c’est sûrement un Ectoplasma.
    white:
      en: |-
        The leer that floats in darkness
        belongs to a Gengar delighting in
        casting curses on people.
      fr: |-
        Si vous croisez un regard
        inquiétant qui perce la nuit,
        c’est sûrement un Ectoplasma.
    black-2:
      en: |-
        The leer that floats in darkness
        belongs to a Gengar delighting in
        casting curses on people.
    white-2:
      en: |-
        The leer that floats in darkness
        belongs to a Gengar delighting in
        casting curses on people.
    x:
      ja-Hrkt: |-
        ものかげに　すがたを　かくす。
        ゲンガーの　ひそんでいる　へやは
        おんどが　５ど　さがると　いわれる。
      ja: |-
        物陰に　姿を　隠す。
        ゲンガーの　潜んでいる　部屋は
        温度が　５度　下がるといわれる。
      ko: |-
        그림자에 모습을 숨긴다.
        팬텀이 숨어 있는 방은
        온도가 5도 내려간다고 전해진다.
      en: |-
        It hides in shadows. It is said that if Gengar
        is hiding, it cools the area by nearly
        10 degrees Fahrenheit.
      fr: |-
        On dit que lorsqu’Ectoplasma se cache dans l’ombre,
        la température alentour chute de 5 °C.
      de: |-
        Es versteckt sich im Schatten. Man sagt, wenn sich
        ein Gengar versteckt, kühlt es sich um 5 °C ab.
      es: |-
        Se esconde entre las sombras. Se dice que donde
        Gengar acecha, la temperatura baja 5 °C.
      it: |-
        Si nasconde nell’ombra. Pare che nei luoghi in cui
        Gengar si cela, la temperatura si abbassi di 5 °C.
    'y':
      ja-Hrkt: |-
        よなか　ひとの　かげに　もぐりこみ
        すこしずつ　たいおんを　うばう。
        ねらわれると　さむけが　とまらない。
      ja: |-
        夜中　人の　影に　潜りこみ
        少しずつ　体温を　奪う。
        ねらわれると　寒気が　止まらない。
      ko: |-
        한밤중 사람의 그림자에 숨어들어
        조금씩 체온을 뺏는다.
        숨어들면 한기가 멈추지 않는다.
      en: |-
        Hiding in people’s shadows at night, it absorbs their
        heat. The chill it causes makes the victims shake.
      fr: |-
        Il se cache dans l’ombre des passants et vole leur
        chaleur. Ses victimes ressentent alors un frisson.
      de: |-
        Es versteckt sich im Schatten der Menschen und
        absorbiert deren Wärme, sodass die Menschen frieren.
      es: |-
        De noche, se oculta en las sombras y absorbe el calor
        de la gente. El frío que transmite es estremecedor.
      it: |-
        Di notte si cela nell’ombra delle vittime per assorbirne
        il calore, provocando loro un tremito.
    omega-ruby:
      ja-Hrkt: |-
        まよなか　がいとうの　あかりで　できた　かげが
        じぶんを　おいこして　いくのは　ゲンガーが
        かげに　なりすまして　はしって　いくからだ。
      ja: |-
        真夜中　街灯の　灯りで　できた　影が
        自分を　追い越して　いくのは　ゲンガーが
        影に　成りすまして　走って　いくからだ。
      ko: |-
        한밤중 가로등 빛에 생겨난 그림자가
        자신을 앞질러 가는 것은 팬텀이
        그림자인 척하며 뛰어가기 때문이다.
      en: |-
        Sometimes, on a dark night, your shadow thrown by a
        streetlight will suddenly and startlingly overtake you.
        It is actually a Gengar running past you, pretending to be
        your shadow.
      fr: |-
        Parfois, pendant les nuits noires, une ombre projetée par
        un réverbère peut tout à coup vous dépasser. Il s’agit d’un
        Ectoplasma qui court, en se faisant passer pour l’ombre
        de quelqu’un d’autre.
      de: |-
        Nachts kann es passieren, dass dich dein Schatten im Licht
        einer Straßenlaterne plötzlich überholt. Dann ist es ein Gengar,
        das an dir vorbeiläuft und sich als dein Schatten ausgibt.
      es: |-
        Si alguien ve que su sombra le adelanta de repente en una
        noche oscura, es muy probable que lo que esté viendo no sea
        su sombra, sino a un Gengar haciéndose pasar por la misma.
      it: |-
        Talvolta, nelle notti buie, può accadere che un passante
        sia improvvisamente assalito dalla propria ombra.
        È opera di Gengar, che usa avvicinarsi fingendosi un’ombra.
    alpha-sapphire:
      ja-Hrkt: |-
        まよなか　がいとうの　あかりで　できた　かげが
