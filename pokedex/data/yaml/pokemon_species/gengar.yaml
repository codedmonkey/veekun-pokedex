        sia improvvisamente assalito dalla propria ombra.
        È opera di Gengar, che usa avvicinarsi fingendosi un’ombra.
    sun:
      ja-Hrkt: |-
        とつぜん　さむけに　おそわれたら
        ゲンガーに　ねらわれた　しょうこ。
        にげるすべは　ないので　あきらめろ。
      ja: |-
        突然　寒気に　襲われたら
        ゲンガーに　狙われた　証拠。
        逃げる術は　ないので　諦めろ。
      ko: |-
        갑자기 졸음이 쏟아진다면
        팬텀이 노리고 있다는 증거다.
        도망갈 방법은 없으니 포기하자.
      zh-Hant: |-
        如果突然被寒氣侵襲，
        那就是被耿鬼盯上的證據。
        沒有逃脫之法，所以死心吧。
      zh-Hans: |-
        如果突然被寒气侵袭，
        那就是被耿鬼袭击的证据。
        没有可逃之法，所以死心吧。
      en: |-
        Should you feel yourself attacked by a sudden
        chill, it is evidence of an approaching Gengar.
        There is no escaping it. Give up.
      fr: |-
        Si vous frissonnez soudainement, c’est qu’un
        Ectoplasma en veut à votre vie. Vous ne pouvez
        y échapper. Abandonnez toute espérance.
      de: |-
        Läuft es einem plötzlich eiskalt den Rücken
        hinunter, wurde man von Gengar als nächstes
        Opfer auserkoren. Widerstand ist zwecklos.
      es: |-
        Un descenso repentino de la temperatura es
        señal de que Gengar está al acecho. Frente a
        esta situación, no hay escapatoria alguna.
      it: |-
        Se all’improvviso si prova un brivido gelido,
        è Gengar che si avvicina.
        Fuggire è impossibile, bisogna rassegnarsi.
    moon:
      ja-Hrkt: |-
        にんげんの　いのちを　ねらうのは
        ゲンガーは　ひとの　なれのはてで
        みちづれを　つくるためらしい。
      ja: |-
        人間の　命を　狙うのは
        ゲンガーは　人の　成れの果てで
        道連れを　つくるためらしい。
      ko: |-
        인간의 목숨을 노리는 이유는
        팬텀이 인간의 비참한 말로여서
        길동무를 만들기 위해서라고 한다.
      zh-Hant: |-
        據說耿鬼之所以要人類的命，
        是因為牠就是人類的末路，
        想要增加旅伴的緣故。
      zh-Hans: |-
        耿鬼之所以要夺取人类的性命，
        好像因为它是人类最终的下场，
        所以要找个同伴。
      en: |-
        It apparently wishes for a traveling companion.
        Since it was once human itself, it tries to create
        one by taking the lives of other humans.
      fr: |-
        S’il attente à la vie des humains, c’est parce
        qu’ils deviendront des Ectoplasma après la mort
        et qu’il veut les entraîner avec lui.
      de: |-
        Gengar raubt Menschen das Leben, um einen
        Begleiter an seiner Seite zu haben, der wie es
        selbst einmal ein Mensch war.
      es: |-
        Parece que el motivo por el que Gengar agrede
        a la gente es porque quiere que sus almas
        le hagan compañía.
      it: |-
        Si dice che piombi sugli esseri umani per
        impossessarsi del loro spirito affinché gli faccia
        compagnia.
    ultra-sun:
      ja-Hrkt: |-
        わるいこの　ところには　ゲンガーが
        やってくる　という　いいつたえは
        せかいじゅうで　きくことが　できる。
      ja: |-
        悪い子の　ところには　ゲンガーが
        やってくる　という　言い伝えは
        世界中で　聞くことが　できる。
      ko: |-
        못된 아이가 있는 곳에 팬텀이
        찾아온다고 하는 이야기는
        전 세계에서 들을 수 있다.
      zh-Hant: |-
        在世界各地都能聽到
        孩子如果不乖的話
        就會被耿鬼找上門的傳說。
      zh-Hans: |-
        在世界各地都能听到
        耿鬼会去找坏孩子这样的传说。
      en: |-
        You can hear tales told all over the world about
        how Gengar will pay a visit to children who
        are naughty.
      fr: |-
        Les enfants du monde entier redoutent
        la menace de l’Ectoplasma qui viendra les
        chercher s’ils ne sont pas sages.
      de: |-
        Unartige Kinder holt sich Gengar. So heißt es
        weltweit in mündlichen Überlieferungen.
      es: |-
        No es raro oír a padres de todos los rincones
        del mundo advertir a sus hijos que, si no se
        portan bien, un Gengar vendrá a por ellos.
      it: |-
        I genitori di tutto il mondo ammoniscono i
        bambini dicendo loro che, se non fanno i bravi,
        arriverà Gengar!
    ultra-moon:
      ja-Hrkt: |-
        じたくに　いても　キケン。　へやの
        すみに　できた　わずかな　くらがりに
        ひそみ　えものを　ねらっている。
      ja: |-
        自宅に　いても　危険。　部屋の
        隅に　できた　わずかな　暗がりに
        潜み　獲物を　狙っている。
      ko: |-
        집에 있어도 위험하다.
        방구석에 생긴 작은 그림자에
        숨어서 먹이를 노리고 있다.
      zh-Hant: |-
        即使待在自己家裡也很危險。
        牠會潛伏在房屋角落僅有的
        一丁點陰暗處，伺機捕捉獵物。
      zh-Hans: |-
        即使待在自己家里也很危险。
        因为它会潜伏在房屋角落里
        仅有的一点阴暗处伺机捕捉猎物。
      en: |-
        Even your home isn’t safe. Gengar will lurk in
        whatever dark corner of a room it can find and
        wait for its chance to catch its prey.
      fr: |-
        Même chez soi, on n’est pas à l’abri.
        Ectoplasma attend, tapi dans un recoin sombre,
        pour mieux bondir sur ses proies...
      de: |-
        Selbst zu Hause ist man vor Gengar nicht sicher.
        In den kleinsten Schatten der engsten Winkel
        lauert es auf Beute.
      es: |-
        Uno no está a salvo ni en su propia casa, pues
        le basta una simple sombra para aparecer y
        abalanzarse sobre su presa.
      it: |-
        Neanche casa propria è un luogo sicuro: Gengar
        si cela negli angoli bui pronto a impossessarsi
        dello spirito vitale delle sue prede.
    lets-go-pikachu:
      ja-Hrkt: |-
        とつぜん　さむけを　かんじるとき
        ゲンガーが　ちかくにいる。もしかして
        のろいを　かけるかも　しれない。
      ja: |-
        とつぜん　寒気を　感じるとき
        ゲンガーが　近くにいる。もしかして
        呪いを　かけるかも　しれない。
      ko: |-
        갑자기 한기를 느꼈다면
        팬텀이 가까이 있는 것이다.
        어쩌면 저주를 걸지도 모른다.
      zh-Hant: |-
        如果突然感覺到一陣惡寒，
        代表耿鬼就在附近。也許牠
        正在對你下詛咒也說不定。
      zh-Hans: |-
        如果你突然感到寒气逼近，
        就说明耿鬼在你身边，或许
        它已经在你身上下了诅咒。
      en: |-
        A Gengar is close by if you feel a sudden chill.
        It may be trying to lay a curse on you.
      fr: |-
        Si vous êtes pris de frissons soudains, c’est qu’un
        Ectoplasma rôde dans les parages. Il pourrait
        peut-être même vous lancer une malédiction.
      de: |-
        Läuft es einem plötzlich eiskalt den Rücken
        hinunter, ist ein Gengar in der Nähe. Womöglich
        belegt es einen dann mit einem Fluch.
      es: |-
        Sentir un escalofrío repentino es señal de que
        hay un Gengar cerca. Quien lo perciba puede
        convertirse en víctima de su maldición.
      it: |-
        Un brivido di freddo improvviso significa che
        Gengar è vicino. Meglio stare attenti, perché
        si rischia di essere colpiti da una maledizione.
    lets-go-eevee:
      ja-Hrkt: |-
        とつぜん　さむけを　かんじるとき
