lycanroc:
  base_happiness: 50
  capture_rate: 90
  color: brown
  egg_groups:
    - ground
  evolution_chain: rockruff
  evolves_from: rockruff
  flavor_text:
    sun:
      ja-Hrkt: |-
        すばやく　うごき　てきを　まどわす。
        ツメや　キバの　ほか　タテガミの
        とがった　いわも　ぶきの　ひとつ。
      ja: |-
        素早く　動き　敵を　惑わす。
        ツメや　キバの　ほか　タテガミの
        とがった　岩も　武器の　ひとつ。
      ko: |-
        재빨리 움직여 적을 어지럽힌다.
        발톱이나 이빨 외에 갈기의
        뾰족한 바위도 무기의 하나다.
      zh-Hant: |-
        快速移動迷惑敵人。
        除了爪子和牙齒之外，
        鬃毛裡的尖銳岩石也是武器之一。
      zh-Hans: |-
        快速移动迷惑敌人。
        除了爪子和牙齿之外，
        鬃毛里的尖锐岩石也是武器之一。
      en: |-
        Its quick movements confuse its enemies.
        Well equipped with claws and fangs, it also uses
        the sharp rocks in its mane as weapons.
      fr: |-
        Il fait tourner en bourrique ses ennemis à cause
        de sa vitesse. Outre ses crocs et ses griffes,
        il peut compter sur le roc acéré de sa crinière.
      de: |-
        Irritiert seine Feinde mit schnellen Bewegungen.
        Als Waffen hat es nicht nur Krallen und Hauer,
        sondern auch die spitzen Felsen seiner Mähne.
      es: |-
        Su velocidad desconcierta a sus rivales. Ataca
        con garras, colmillos y con las piedras afiladas
        de su melena.
      it: |-
        Confonde l’avversario grazie alla rapidità dei
        movimenti. Oltre ad artigli e zanne, nella lotta si
        serve anche delle pietre appuntite della criniera.
    moon:
      ja-Hrkt: |-
        ちいさいころから　しっかり　そだてると
        ぜったい　トレーナーを　うらぎらない
        たのもしい　あいぼうに　なる。
      ja: |-
        小さいころから　しっかり　育てると
        絶対　トレーナーを　裏切らない
        頼もしい　相棒に　なる。
      ko: |-
        어릴 때부터 바르게 키우면
        절대 트레이너를 배신하지 않는
        믿음직한 동료가 된다.
      zh-Hant: |-
        從小開始好好培育的話，
        會成為絕不背叛訓練家，
        值得信賴的好夥伴。
      zh-Hans: |-
        从小时候就开始好好培育的话，
        会成为绝不背叛训练家，
        值得信赖的好伙伴。
      en: |-
        When properly raised from a young age, it will
        become a trustworthy partner that will
        absolutely never betray its Trainer.
      fr: |-
        Pour peu qu’on l’élève comme il se doit, ce
        Pokémon restera à jamais fidèle à son Dresseur
        et deviendra son partenaire le plus dévoué.
      de: |-
        Zieht man dieses Pokémon von klein auf groß,
        wird es seinen Trainer niemals hintergehen und
        ihm stets ein treuer Freund sein.
      es: |-
        Si se lo entrena a conciencia desde temprana
        edad, se convierte en un leal compañero que
        jamás dejará en la estacada a su Entrenador.
      it: |-
        Se lo si allena nel modo giusto fin dalla tenera
        età, diventa un fedele compagno devoto
        al proprio Allenatore.
    ultra-sun:
      ja-Hrkt: |-
        タテガミのいわは　するどく　ナイフの
        ような　きれあじ。　じわじわ　えものを
        おいつめ　よわらせて　しとめる。
      ja: |-
        タテガミの岩は　鋭く　ナイフの
        ような　切れ味。　じわじわ　獲物を
        追い詰め　弱らせて　仕留める。
      ko: |-
        바위로 된 갈기는 날카로운 나이프처럼
        잘 잘린다. 천천히 먹이를 궁지로 몰아
        약하게 만든 후 숨통을 끊는다.
      zh-Hant: |-
        鬃毛裡的岩石像刀子一樣鋒利。
        會對獵物窮追不捨，等獵物
        筋疲力盡時再給予致命一擊。
      zh-Hans: |-
        鬃毛里的岩石像刀子一样锋利。
        会对猎物穷追不舍，
        待其慢慢虚弱后再给予致命一击。
      en: |-
        The sharp rocks in its mane can cut like knives.
        Lycanroc wears its prey down by degrees
        before finishing them off.
      fr: |-
        Les rocs de sa crinière sont aiguisés comme
        des couteaux. Il poursuit patiemment sa cible
        pour l’affaiblir et lui porter le coup de grâce.
      de: |-
        Seine steinerne Mähne ist scharf wie ein Messer.
        Es verfolgt seine Beute mit viel Geduld, bis diese
        die Kräfte verlassen, und erlegt sie dann.
      es: |-
        Su melena de piedra es tan afilada como un
        cuchillo. Hostiga a su presa sin cesar hasta
        agotarla, para luego asestarle el golpe de gracia.
      it: |-
        La sua criniera di roccia è affilata come la lama
        di un coltello. Segue la preda senza mai perderla
        di vista e quando è stanca le dà il colpo finale.
    ultra-moon:
      ja-Hrkt: |-
        タテガミの　いわは　ナイフより
        するどい　きれあじ。　かけた　はへんは
        おまもり　として　たいせつに　される。
      ja: |-
        タテガミの　岩は　ナイフより
        鋭い　切れ味。　欠けた　破片は
        お守り　として　大切に　される。
      ko: |-
        갈기에 있는 바위는 나이프보다
        예리하고 날카롭다. 떨어진 파편은
        부적으로써 소중히 여겨진다.
      zh-Hant: |-
        鬃毛裡的岩石比刀子還要鋒利。
        掉落的碎片會被人
        當成護身符好好收藏著。
      zh-Hans: |-
        鬃毛里的岩石比刀子还要锋利。
        掉落的碎片作为护身符
        而被人们收藏。
      en: |-
        The rocks in its mane are sharper than a knife.
        Fragments that break off are treasured as
        good luck charms.
      fr: |-
        Les rocs de sa crinière sont plus acérés que
        des couteaux. Les morceaux qui s’en détachent
        sont considérés comme des porte-bonheur.
      de: |-
        Seine steinerne Mähne ist schärfer als ein
        Messer. Abgebrochene Stücke gelten als
        wertvolle Glücksbringer.
      es: |-
        Su melena de piedra es más afilada incluso
        que un cuchillo. Los fragmentos que se le
        desprenden son muy codiciados como amuleto.
      it: |-
        La sua criniera di roccia è più affilata della lama
        di un coltello. Le sue schegge sono considerate
        dei preziosi portafortuna.
    sword:
      ja-Hrkt: |-
        れいせい　かつ　しんちょう。　
        たてがみの　いわの　きれあじは
        かみそりのように　するどい。
      ja: |-
        冷静　かつ　慎重。
        たてがみの　岩の　切れ味は
        剃刀のように　鋭い。
      ko: |-
        냉정하며 신중하다.
        갈기의 바위는 잘 드는
        면도날처럼 날카롭다.
      zh-Hant: |-
        個性既冷靜又慎重。
        鬃毛裡的岩石就像
        剃刀那樣鋒利。
      zh-Hans: |-
        既冷静又慎重。
        鬃毛里的岩石像
        剃刀那样锋利。
      en: |-
        This Lycanroc is calm and cautious. The rocks
        jutting from its mane are razor sharp.
      fr: |-
        C’est un Pokémon calme et prudent.
        Les pierres dans sa crinière sont aussi
        tranchantes que des lames de rasoir.
      de: |-
        Ein ruhiges Pokémon, das stets mit Bedacht
        vorgeht. Seine Steinmähne ist rasiermesserscharf.
      es: |-
        Un Pokémon tranquilo y prudente. Su melena
        de piedra es tan afilada como una cuchilla.
      it: |-
        È un Pokémon calmo e prudente. Le rocce della
        sua criniera sono affilate come lame di un rasoio.
    shield:
      ja-Hrkt: |-
        すばやい　うごきで　えものを
        じわじわ　おいつめる。　キバは
        つねに　きゅうしょを　ねらっている。
      ja: |-
        素早い　動きで　獲物を
        じわじわ　追いつめる。　キバは
        つねに　急所を　狙っている。
      ko: |-
        빠른 움직임으로 먹이를
        차츰차츰 궁지에 몰아넣는다.
        이빨은 항상 급소를 노리고 있다.
      zh-Hant: |-
        會用敏捷的動作將獵物
        一步步地逼入絕境。
        尖牙總是瞄準著對方的要害。
      zh-Hans: |-
        会用敏捷的动作将猎物
        一点一点逼入绝境。
        利齿总是瞄准着对方的要害。
      en: |-
        With swift movements, this Pokémon gradually
        backs its prey into a corner. Lycanroc’s fangs are
        always aimed toward opponents’ weak spots.
      fr: |-
        Il poursuit ses proies avec rapidité et patience.
        Une fois la cible acculée, il attaque toujours
        son point faible avec ses crocs.
      de: |-
        Es treibt seine Beute mit schnellen Bewegungen
        geduldig in die Enge. Dann stürzt es sich mit den
        Fangzähnen auf deren Schwachpunkt.
      es: |-
        Va acorralando pacientemente a su presa con
        movimientos raudos para finalmente clavarle
        los colmillos en sus puntos vitales.
      it: |-
        Intrappola gradualmente la preda avvicinandosi
        con movimenti rapidi. Le sue zanne mirano dritto
        ai punti vitali.
