deerling:
  base_happiness: 70
  capture_rate: 190
  color: pink
  egg_groups:
    - ground
  evolution_chain: deerling
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        The color and scent of their fur changes
        to match the mountain grass. When they
        sense hostility, they hide in the grass.
      fr: |-
        Son pelage prend la même couleur et la
        même odeur que les hautes herbes. S’il
        sent un ennemi, il court s’y réfugier.
    white:
      en: |-
        The turning of the seasons changes the
        color and scent of this Pokémon’s fur.
        People use it to mark the seasons.
      fr: |-
        Quand la saison change, il change de
        pelage et d’odeur. Un Pokémon qui
        annonce le passage des saisons.
    black-2:
      en: |-
        Their coloring changes according to the
        seasons and can be slightly affected by
        the temperature and humidity as well.
    white-2:
      en: |-
        Their coloring changes according to the
        seasons and can be slightly affected by
        the temperature and humidity as well.
    x:
      ja-Hrkt: |-
        きせつが　かわったとき　だけでなく
        きおんや　しつどに　よっても
        からだのいろは　すこし　へんかする。
      ja: |-
        季節が　変わったとき　だけでなく
        気温や　湿度に　よっても
        体の色は　少し　変化する。
      ko: |-
        계절이 바뀌었을 때뿐 아니라
        기온이나 습도에 따라서도
        몸의 색깔은 조금 변한다.
      en: |-
        Their coloring changes according to the seasons
        and can be slightly affected by the temperature and
        humidity as well.
      fr: |-
        Son pelage change selon la saison, et dans une
        moindre mesure en fonction de l’humidité et de la
        température.
      de: |-
        Unabhängig von der Jahreszeit ändert sich
        seine Farbe auch bei wechselnder Temperatur
        oder Luftfeuchtigkeit leicht.
      es: |-
        El color de su cuerpo cambia no solo con las
        estaciones, sino también con los cambios de humedad
        y temperatura.
      it: |-
        Il suo corpo muta non solo a seconda della stagione
        ma in misura minore anche al cambiare di temperatura
        e umidità.
    'y':
      ja-Hrkt: |-
        きせつの　かわりめに　なると
        たいもうと　においが　へんかする。
        きせつを　つげる　ポケモン。
      ja: |-
        季節の　変わり目に　なると
        体毛と　においが　変化する。
        季節を　告げる　ポケモン。
      ko: |-
        계절이 바뀌는 시기가 되면
        털과 냄새가 변화한다.
        계절을 알리는 포켓몬이다.
      en: |-
        The turning of the seasons changes the color and
        scent of this Pokémon’s fur. People use it to mark
        the seasons.
      fr: |-
        Quand la saison change, il change de pelage et
        d’odeur. Un Pokémon qui annonce le passage des
        saisons.
      de: |-
        Sein Fell und sein Geruch ändern sich mit dem
        Wechsel der Jahreszeiten. Es ist der Bote des
        Saisonwechsels.
      es: |-
        Durante los cambios de estación, su pelaje y olor
        cambian. Esto anuncia el comienzo de una estación.
      it: |-
        Al cambio di stagione, muta la pelliccia e l’odore. È un
        Pokémon che annuncia il passaggio delle stagioni.
    omega-ruby:
      ja-Hrkt: |-
        きせつが　かわったとき　だけでなく
        きおんや　しつどに　よっても
        からだのいろは　すこし　へんかする。
      ja: |-
        季節が　変わったとき　だけでなく
        気温や　湿度に　よっても
        体の色は　少し　変化する。
      ko: |-
        계절이 바뀌었을 때뿐 아니라
        기온이나 습도에 따라서도
        몸의 색깔은 조금 변한다.
      en: |-
        Their coloring changes according to the seasons
        and can be slightly affected by the temperature and
        humidity as well.
      fr: |-
        Son pelage change selon la saison, et dans une moindre
        mesure en fonction de l’humidité et de la température.
      de: |-
        Unabhängig von der Jahreszeit ändert sich seine Farbe auch
        bei wechselnder Temperatur oder Luftfeuchtigkeit leicht.
      es: |-
        El color de su cuerpo cambia no solo con las estaciones, sino
