        goes at blinding speed when it
        attacks and bites prey.
    x:
      ja-Hrkt: |-
        ふだんは　ゆっくりとした　うごきだが
        えものに　かみつくときは
        めにも　とまらない　スピードだ。
      ja: |-
        普段は　ゆっくりとした　動きだが
        獲物に　かみつくときは
        目にも　止まらない　スピードだ。
      ko: |-
        평소에는 느긋하게 움직이지만
        먹이를 물 때에는 눈에 보이지
        않는 엄청난 스피드를 낸다.
      en: |-
        It usually moves slowly, but it goes at blinding
        speed when it attacks and bites prey.
      fr: |-
        Ce Pokémon à l’air pataud est capable d’attaquer
        à la vitesse de l’éclair pour mordre sa proie.
      de: |-
        Eigentlich bewegt es sich langsam, doch seine
        Beute greift es blitzschnell an.
      es: |-
        Se suele mover lento, pero alcanza velocidades de
        vértigo al atacar y morder a sus enemigos.
      it: |-
        Di solito si muove lentamente, ma quando attacca e
        morde la preda si muove a una velocità incredibile.
    'y':
      ja-Hrkt: |-
        おおきく　ちからづよい　あごで
        かみつくと　そのまま　くびをふって
        あいてを　ずたずたに　ひきちぎる。
      ja: |-
        大きく　力強い　アゴで
        かみつくと　そのまま　首を振って
        相手を　ずたずたに　引きちぎる。
      ko: |-
        크고 힘센 턱으로
        한번 물면 그대로 목을 흔들어
        상대를 갈기갈기 찢는다.
      en: |-
        When it bites with its massive and powerful jaws,
        it shakes its head and savagely tears its victim up.
      fr: |-
        Quand il mord avec sa puissante mâchoire, il secoue
        sa tête pour déchiqueter sa pauvre victime.
      de: |-
        Wenn es mit seinem kräftigen Kiefer zubeißt, schüttelt
        es seinen Kopf und reißt seine Opfer in Stücke.
      es: |-
        Al morder con sus feroces fauces, mueve su cabeza
        despedazando salvajemente a su víctima.
      it: |-
        Mordendo con le grandi e potenti mandibole, agita
        il capo riducendo la vittima in brandelli.
    omega-ruby:
      ja-Hrkt: |-
        おおきな　くちを　あけて　あいてを　いかくする。
        きょうじんな　うしろあしで　じめんを　けって
        ものすごい　スピードで　とっしん　してくるぞ。
      ja: |-
        大きな　口を　開けて　相手を　威嚇する。
        強靭な　後ろ足で　地面を　蹴って
        ものすごい　スピードで　突進　してくるぞ。
      ko: |-
        큰 입을 열고 상대를 위협한다.
        강인한 뒷다리로 땅을 차고
        굉장한 스피드로 돌진해온다.
      en: |-
        Feraligatr intimidates its foes by opening its huge mouth.
        In battle, it will kick the ground hard with its thick and powerful
        hind legs to charge at the foe at an incredible speed.
      fr: |-
        Aligatueur impressionne ses ennemis en ouvrant son
        énorme gueule. Pendant les combats, il piétine le sol
        de ses puissantes pattes arrière avant de charger ses
        adversaires à pleine vitesse.
      de: |-
        Impergator schüchtert seine Feinde dadurch ein, dass es sein
        riesiges Maul aufreißt. Im Kampf erschüttert es den Boden mit
        seinen kräftigen Hinterbeinen, wenn es mit unglaublicher
        Geschwindigkeit auf seinen Gegner losrennt.
      es: |-
        Feraligatr intimida a sus oponentes abriendo las grandes
        fauces que tiene. En combate, golpea el suelo bruscamente
        con las gruesas y fuertes patas traseras que tiene para cargar
        contra su rival a una velocidad de vértigo.
      it: |-
        Feraligatr spaventa il nemico spalancando la sua bocca
        enorme. Nella lotta pesta pesantemente il terreno con le
        sue possenti zampe posteriori per scagliarsi contro il nemico
        a un’incredibile velocità.
    alpha-sapphire:
      ja-Hrkt: |-
        おおきな　くちを　あけて　あいてを　いかくする。
        きょうじんな　うしろあしで　じめんを　けって
