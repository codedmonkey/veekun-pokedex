    lets-go-pikachu:
      ja-Hrkt: |-
        やさしい　せいかくで　たたかいは
        このまないが　ちいさな　ツノからは
        どくが　でるので　ようちゅうい。
      ja: |-
        優しい　性格で　戦いは
        好まないが　小さな　ツノからは
        毒が　でるので　要注意。
      ko: |-
        온순한 성격이라 싸움을
        좋아하지 않지만 작은 뿔에서
        독이 나오므로 주의가 필요하다.
      zh-Hant: |-
        性情溫馴不喜歡戰鬥。
        但由於牠的小角中含有毒液，
        因此還是要小心提防。
      zh-Hans: |-
        虽然它性格温顺不喜欢战斗，
        但由于小犄角中含有毒液，
        请一定要小心提防。
      en: |-
        A mild-mannered Pokémon that does not like
        to fight. Beware—its small horn secretes venom.
      fr: |-
        Un Pokémon paisible qui n’aime pas se battre.
        Sa petite corne est empoisonnée.
      de: |-
        Es hat ein sanftes Gemüt und meidet den Kampf,
        doch da aus seinem kleinen Horn Gift austritt,
        ist trotzdem Vorsicht geboten.
      es: |-
        A este dócil Pokémon no le gusta luchar, pero
        conviene tener cuidado con su pequeño cuerno,
        ya que segrega veneno.
      it: |-
        Pokémon molto tranquillo che rifugge la lotta.
        Bisogna fare attenzione al suo piccolo corno,
        che secerne veleno.
    lets-go-eevee:
      ja-Hrkt: |-
