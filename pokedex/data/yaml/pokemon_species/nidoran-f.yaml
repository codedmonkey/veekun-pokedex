    sword:
      ja-Hrkt: |-
        オスよりも　においに　びんかん。
        ヒゲで　かざむきを　かくにんしながら
        かざしもで　エサを　さがすのだ。
      ja: |-
        オスよりも　匂いに　敏感。
        ヒゲで　風向きを　確認しながら
        風下で　エサを　探すのだ。
      ko: |-
        수컷보다 냄새에 민감하다.
        수염으로 바람의 방향을 확인하면서
        흘러온 냄새로 먹이를 찾는다.
      zh-Hant: |-
        對氣味比雄性還要敏感。
        會一邊用鬍鬚確認風向，
        一邊在下風處尋找食物。
      zh-Hans: |-
        对于气味比雄性更敏感。
        会一边用胡须确认风向，
        一边在下风处寻找食物。
      en: |-
        Females are more sensitive to smells than males.
        While foraging, they’ll use their whiskers to check
        wind direction and stay downwind of predators.
      fr: |-
        Son odorat est plus développé que celui du mâle.
        Quand Nidoran♀ cherche à manger, il reste dans
        le sens du vent, qu’il détecte avec ses vibrisses.
      de: |-
        Sie sind geruchsempfindlicher als Nidoran♂.
        Auf Nahrungssuche folgen sie der Windrichtung,
        die sie mit ihren Tasthaaren ermitteln.
      es: |-
        Posee un olfato más fino que los Nidoran♂. Usa
        los bigotes para percibir la dirección del viento y
        buscar comida a sotavento de sus depredadores.
      it: |-
        È più sensibile agli odori rispetto ai maschi.
        Capta le correnti d’aria con le vibrisse e si
        posiziona sottovento per cercare le prede.
    shield:
      ja-Hrkt: |-
        かたい　まえばで　きのみを　くだいて
        たべる。　ツノの　さきは　オスより
        すこし　まるみを　おびている。
      ja: |-
        硬い　前歯で　木の実を　砕いて　食べる。
        ツノの　先は　オスより　少し
        丸みを　帯びている。
      ko: |-
        단단한 앞니로 나무열매를
        깨물어 먹는다. 뿔의 끝은
        수컷보다 조금 둥그스름하다.
      zh-Hant: |-
        會用堅硬的門牙咬碎
        樹果後吃下。角的尖端
        會比雄性還要圓一些。
      zh-Hans: |-
        用坚硬的门牙咬碎
        树果吃。和雄性相比，
        角的尖端稍圆一些。
      en: |-
        It uses its hard incisor teeth to crush and eat
        berries. The tip of a female Nidoran’s horn is a
        bit more rounded than the tip of a male’s horn.
      fr: |-
        Ce Pokémon se nourrit de Baies en les ouvrant
        avec ses incisives. Le bout de sa corne est plus
        arrondi que celui du mâle.
      de: |-
        Mit ihren harten Vorderzähnen zerteilen sie
        Beeren, bevor sie diese essen. Die Spitze ihres
        Horns ist etwas abgerundeter als bei Männchen.
      es: |-
        Parte las bayas con sus duros incisivos para
        comérselas. La punta del cuerno de las hembras
        es más redondeada que la de los machos.
      it: |-
        Mangia le bacche frantumandole con i robusti
        incisivi. La punta del corno è leggermente più
        arrotondata rispetto a quella del maschio.
