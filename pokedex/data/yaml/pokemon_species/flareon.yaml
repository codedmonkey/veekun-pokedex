    white-2:
      en: |-
        Inhaled air is carried to its flame sac,
        heated, and exhaled as fire
        that reaches over 3,000 degrees F.
    x:
      ja-Hrkt: |-
        たいないに　ほのおぶくろを　もつ。
        たたかいが　はじまる　ちょくぜんには
        たいおんが　９００どまで　あがる。
      ja: |-
        体内に　炎袋を　持つ。
        戦いが　はじまる　直前には
        体温が　９００度まで　上がる。
      ko: |-
        체내에 불꽃 주머니를 가지고 있다.
        싸움이 시작되기 직전에는
        체온이 900도까지 올라간다.
      en: |-
        It has a flame sac in its body. Its body temperature
        tops 1,650 degrees Fahrenheit before battle.
      fr: |-
        Son corps contient une glande enflammée.
        Sa température monte à 900 °C avant le combat.
      de: |-
        In seinem Körper befindet sich eine Flamme.
        Seine Körpertemperatur liegt vor dem Kampf
        bei 900 °C.
      es: |-
        Almacena llamas en su cuerpo, que alcanza una
        temperatura de 900 °C antes de un combate.
      it: |-
        Nel corpo conserva una tasca ardente. Prima di
        lottare, la sua temperatura si innalza a 900 °C.
    'y':
      ja-Hrkt: |-
        たいないに　ほのおぶくろが　あり
        ふかく　いきを　すいこんだあと
        １７００ど　の　ひを　はく。
      ja: |-
        体内に　炎袋があり
        深く　息を　吸いこんだあと
        １７００度の　火を　吐く。
      ko: |-
        체내에 불꽃 주머니가 있어
        깊이 숨을 들이킨 후
        1700도의 불을 내뿜는다.
      en: |-
        It has a flame bag inside its body. After inhaling
        deeply, it blows out flames of nearly
        3,000 degrees Fahrenheit.
      fr: |-
        Pyroli a une poche de feu à l’intérieur de son corps.
        Après une bonne inspiration, il est capable de
        recracher des flammes à 1 700 °C.
      de: |-
        In seinem Körper hat es eine Flammentasche.
        Wenn es tief eingeatmet hat, kann es Flammen
        von bis zu 1 700 °C spucken.
      es: |-
        Almacena llamas en el interior de su cuerpo. Tras
        inhalar profundamente, las lanza a una temperatura
        de 1700 °C.
      it: |-
        Nel corpo ha una tasca infuocata. Dopo aver inspirato
        profondamente, sputa fiamme alla temperatura di
        1700 °C.
    omega-ruby:
      ja-Hrkt: |-
        ふさふさの　たいもうは　あがりすぎた　たいおんを
        くうきに　ほうねつして　さげる　きのうを　もつ。
        たいおんは　さいこう　９００ど　まで　あがるぞ。
      ja: |-
        ふさふさの　体毛は　上がり過ぎた　体温を
        空気に　放熱して　下げる　機能を　持つ。
        体温は　最高　９００度　まで　上がるぞ。
      ko: |-
        푹신한 털은 높이 오른 체온을
        공기 중으로 발산하여 낮추는 기능을 지녔다.
        체온은 최고 900도까지 올라간다.
      en: |-
        Flareon’s fluffy fur has a functional purpose—it releases heat
        into the air so that its body does not get excessively hot.
        This Pokémon’s body temperature can rise to a maximum of
        1,650 degrees Fahrenheit.
      fr: |-
        La fourrure soyeuse de Pyroli a une fonction anatomique.
        Elle rejette la chaleur dans l’air pour que son corps ne
        surchauffe pas. La température du corps de ce Pokémon
        peut atteindre 900 °C.
      de: |-
        Flamaras flauschiges Fell dient einem besonderen Zweck.
        Es gibt Hitze an die Luft ab, damit sein Körper nicht zu heiß
        wird. Die Körpertemperatur dieses Pokémon kann bis auf
        900 °C ansteigen.
      es: |-
        La suavidad del pelaje de Flareon tiene una función clara:
        libera calor para que el Pokémon no se asfixie. La temperatura
        corporal de este Pokémon puede alcanzar los 900 °C.
      it: |-
        La morbida pelliccia di Flareon ha uno scopo ben preciso:
        libera calore nell’aria in modo da abbassare la temperatura
        corporea, che nel caso di questo Pokémon può raggiungere
        anche 900 °C.
    alpha-sapphire:
      ja-Hrkt: |-
        ふさふさの　たいもうは　あがりすぎた　たいおんを
        くうきに　ほうねつして　さげる　きのうを　もつ。
        たいおんは　さいこう　９００ど　まで　あがるぞ。
      ja: |-
        ふさふさの　体毛は　上がり過ぎた　体温を
        空気に　放熱して　下げる　機能を　持つ。
        体温は　最高　９００度　まで　上がるぞ。
      ko: |-
