        공기 중으로 발산하여 낮추는 기능을 지녔다.
        체온은 최고 900도까지 올라간다.
      en: |-
        Flareon’s fluffy fur has a functional purpose—it releases heat
        into the air so that its body does not get excessively hot.
        This Pokémon’s body temperature can rise to a maximum of
        1,650 degrees Fahrenheit.
      fr: |-
        La fourrure soyeuse de Pyroli a une fonction anatomique.
        Elle rejette la chaleur dans l’air pour que son corps ne
        surchauffe pas. La température du corps de ce Pokémon
        peut atteindre 900 °C.
      de: |-
        Flamaras flauschiges Fell dient einem besonderen Zweck.
        Es gibt Hitze an die Luft ab, damit sein Körper nicht zu heiß
        wird. Die Körpertemperatur dieses Pokémon kann bis auf
        900 °C ansteigen.
      es: |-
        La suavidad del pelaje de Flareon tiene una función clara:
        libera calor para que el Pokémon no se asfixie. La temperatura
        corporal de este Pokémon puede alcanzar los 900 °C.
      it: |-
        La morbida pelliccia di Flareon ha uno scopo ben preciso:
        libera calore nell’aria in modo da abbassare la temperatura
        corporea, che nel caso di questo Pokémon può raggiungere
        anche 900 °C.
    sun:
      ja-Hrkt: |-
        きのみや　えものを　つかまえると
        ほのおを　ふいて　ウェルダンぐらいに
        なるまで　やきあげてから　ガブリ。
      ja: |-
        木の実や　獲物を　捕まえると
        炎を　吹いて　ウェルダンぐらいに
        なるまで　焼きあげてから　ガブリ。
      ko: |-
        나무열매나 먹이를 잡으면
        불꽃을 뿜어 웰던 정도가
        될 때까지 구운 다음 꿀꺽한다.
      zh-Hant: |-
        如果尋獲樹果或捕捉到獵物，
        就會噴出火焰將其烤至熟透，
        然後大口吃掉。
      zh-Hans: |-
        如果寻获树果或是捉到猎物，
        就会喷出火焰将其烤至完全熟透，
        之后大口大口吃掉。
      en: |-
        When it catches prey or finds berries, it
        breathes fire on them until they’re well done,
        and then it gobbles them up.
      fr: |-
        Après avoir trouvé une proie et quelques Baies,
        il crache du feu jusqu’à ce qu’elles soient cuites
        à point avant de les gober.
      de: |-
        Hat es Beeren oder Pokémon erbeutet, speit es
        so lange Feuer, bis beides gut durchgebraten
        ist. Danach beißt es beherzt zu.
      es: |-
        Antes de hincarle el diente a algo, ya sean
        bayas o alguna presa, lo cocina con sus llamas
        hasta que queda bien hecho.
      it: |-
        Arrostisce con le sue fiamme le prede che
        cattura e le bacche che raccoglie finché non
        sono ben cotte e poi le mangia.
    moon:
      ja-Hrkt: |-
        へいきんたいおん　７～８００ど。
        たいないに　ある　ほのおぶくろでは
        １７００どの　ほのおが　もえている。
      ja: |-
        平均体温　７～８００度。
        体内に　ある　炎袋では
        １７００度の　炎が　燃えている。
      ko: |-
        평균 체온 7~800도.
        체내에 있는 불꽃 주머니에서는
        1700도의 불꽃이 타고 있다.
      zh-Hant: |-
        平均體溫７００～８００度。
        在體內的火袋裡熊熊燃燒著
        １７００度的火焰。
      zh-Hans: |-
        平均体温７００～８００度。
        在体内的火袋里熊熊燃烧着
        １７００度的火焰。
      en: |-
        Its average body temperature is between 1,300
        and 1,500 degrees Fahrenheit. In its internal
        flame sac, temperatures reach 3,000 degrees.
      fr: |-
        Sa température moyenne est entre 700 et
        800 °C. La poche de feu à l’intérieur de son
        corps peut atteindre 1 700 °C.
      de: |-
        Seine Körpertemperatur beträgt im Durchschnitt
        700 bis 800 °C. In einem Flammensack im
        Körper erzeugt es ein Feuer von 1 700 °C.
      es: |-
        La temperatura corporal de este Pokémon ronda
        los 700 u 800 °C. Las llamas que almacena en
        su bolsa interior pueden llegar a los 1700 °C.
      it: |-
        La sua temperatura corporea media oscilla tra
        i 700 e gli 800 °C. In una sacca all’interno del
        suo corpo ardono fiamme a 1.700 °C.
    ultra-sun:
      ja-Hrkt: |-
        おおきく　くうきを　すいこむのは
        こうげきの　サイン。　１７００どの
        ほのおが　おそってくるぞ。
      ja: |-
        大きく　空気を　吸い込むのは
        攻撃の　サイン。　１７００度の
        炎が　襲ってくるぞ。
      ko: |-
        크게 공기를 들이쉬는 것은
        공격 신호다. 1700도의
        불꽃이 엄습해 온다.
      zh-Hant: |-
        當牠大口吸入空氣時，
        就是即將發動攻擊的信號，
        １７００度的火焰即將來襲。
      zh-Hans: |-
        大口吸入空气就是要攻击的前兆。
        这意味着１７００度的火焰即将来袭。
      en: |-
        If it inhales deeply, that’s a sign it’s about to
        attack. Prepare to be hit by flames of over
        3,000 degrees Fahrenheit!
      fr: |-
        Si vous le voyez inspirer profondément,
        sauvez-vous, car c’est le signe qu’il va attaquer
        en soufflant une flamme à 1 700 °C !
      de: |-
        Wenn es tief einatmet, bereitet es gerade einen
        Angriff vor. Es kann bis zu 1 700 °C heiße
        Flammen speien.
      es: |-
        Cuando inspira profundamente es señal de que
        se dispone a atacar. Expele llamaradas que
        alcanzan temperaturas de 1700 °C.
      it: |-
        Quando inspira profondamente significa che
        si sta preparando all’attacco. Sputa fiamme
        alla temperatura di 1.700 °C.
    ultra-moon:
      ja-Hrkt: |-
        こうふんすると　たいないに　ある
        ほのおぶくろに　ひが　ついて
        たいおんは　９００ど　まで　あがる。
      ja: |-
        興奮すると　体内に　ある
        炎袋に　火が　ついて
        体温は　９００度　まで　あがる。
      ko: |-
        흥분하면 체내에 있는
        불꽃 주머니에 불이 붙어서
        체온이 900도까지 오른다.
      zh-Hant: |-
        當牠興奮時，
        體內的火囊就會著火，
        體溫會上升到９００度。
      zh-Hans: |-
        兴奋时，它体内的火袋就会着火，
        体温会上升到９００度。
      en: |-
        The flame chamber inside its body ignites when
        Flareon gets agitated, reaching temperatures of
        up to 1,650 degrees Fahrenheit.
      fr: |-
        Lorsqu’il est agité, sa poche de feu interne
        s’enflamme, et sa température corporelle peut
        alors monter jusqu’à 900 °C.
      de: |-
        Ist Flamara aufgeregt, fängt der Flammensack
        in seinem Körper Feuer, wodurch seine
        Körpertemperatur auf bis zu 900 °C steigt.
      es: |-
        Cuando su ánimo se altera, las llamas que
        almacena en su bolsa interior se avivan y su
        temperatura corporal llega a los 900 °C.
      it: |-
        Quando si agita si genera del fuoco in una sacca
        interna e la sua temperatura corporea sale fino
        a raggiungere i 900 °C.
    lets-go-pikachu:
      ja-Hrkt: |-
        たいないに　ほのおぶくろが　あって
        すいこんだ　いきを　１７００どの
        ほのおにして　くちから　はきだす。
      ja: |-
        体内に　炎袋が　あって
        吸い込んだ　息を　１７００度の
        炎にして　口から　吐き出す。
      ko: |-
        체내에 불꽃 주머니가 있어
        들이마신 숨을 1700도의
        불꽃으로 바꿔 입에서 뿜어낸다.
      zh-Hant: |-
        體內有著火囊，能將吸入的
        空氣轉化成1700度的火焰，
        再從口中吐出來。
      zh-Hans: |-
        体内的火袋能让它将吸入的
        气体转化为1700度的
        火焰，接着从口中喷出。
      en: |-
        It has a flame chamber inside its body. It inhales,
        then breathes out fire that is over 3,000
        degrees Fahrenheit.
      fr: |-
        La poche de feu à l’intérieur de son corps
        transforme l’air qu’il inspire en flammes
        à 1 700 ºC qu’il recrache par la bouche.
      de: |-
        In seinem Körper befindet sich ein Flammensack.
        Dort wandelt es Luft in 1 700 ºC heiße Flammen
        um, die es über den Mund ausspeit.
      es: |-
        La bolsa en el interior de su cuerpo le permite
        convertir el aire que aspira en llamas a 1700 °C
        que luego exhala por la boca.
      it: |-
        Nel corpo ha una sacca ardente con cui
        trasforma l’aria che respira in fiamme e le emette
        dalla bocca alla temperatura di 1.700 ºC.
    lets-go-eevee:
      ja-Hrkt: |-
        たいないに　ほのおぶくろが　あって
        すいこんだ　いきを　１７００どの
        ほのおにして　くちから　はきだす。
      ja: |-
        体内に　炎袋が　あって
        吸い込んだ　息を　１７００度の
        炎にして　口から　吐き出す。
      ko: |-
