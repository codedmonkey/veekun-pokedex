        들이마신 숨을 1700도의
        불꽃으로 바꿔 입에서 뿜어낸다.
      zh-Hant: |-
        體內有著火囊，能將吸入的
        空氣轉化成1700度的火焰，
        再從口中吐出來。
      zh-Hans: |-
        体内的火袋能让它将吸入的
        气体转化为1700度的
        火焰，接着从口中喷出。
      en: |-
        It has a flame chamber inside its body. It inhales,
        then breathes out fire that is over 3,000
        degrees Fahrenheit.
      fr: |-
        La poche de feu à l’intérieur de son corps
        transforme l’air qu’il inspire en flammes
        à 1 700 ºC qu’il recrache par la bouche.
      de: |-
        In seinem Körper befindet sich ein Flammensack.
        Dort wandelt es Luft in 1 700 ºC heiße Flammen
        um, die es über den Mund ausspeit.
      es: |-
        La bolsa en el interior de su cuerpo le permite
        convertir el aire que aspira en llamas a 1700 °C
        que luego exhala por la boca.
      it: |-
        Nel corpo ha una sacca ardente con cui
        trasforma l’aria che respira in fiamme e le emette
        dalla bocca alla temperatura di 1.700 ºC.
    sword:
      ja-Hrkt: |-
        たいないに　ほのおが　たまると
        ブースターの　たいおんも　さいこう
        ９００ど　まで　あがっていく。
      ja: |-
        体内に　炎が　溜まると
        ブースターの　体温も　最高
        ９００度　まで　上がっていく。
      ko: |-
        체내에 불꽃이 쌓이면
        부스터의 체온도 최고
        900도까지 오른다.
      zh-Hant: |-
        當火焰在體內積蓄時，
        火伊布的體溫也會隨之
        上升到最高９００度。
      zh-Hans: |-
        当火焰在体内积蓄时，
        火伊布的体温也会随之
        上升到最高９００度。
      en: |-
        Once it has stored up enough heat, this
        Pokémon’s body temperature can reach up to
        1,700 degrees Fahrenheit.
      fr: |-
        Après avoir emmagasiné suffisamment de chaleur,
        sa température corporelle peut monter
        jusqu’à 900 °C.
      de: |-
        Wenn die Flamme in seinem Körper heiß genug
        brennt, kann seine Körpertemperatur bis zu
        900 ºC erreichen.
      es: |-
        Una vez que ha almacenado el calor suficiente,
        puede alcanzar una temperatura de 900 °C.
      it: |-
        Quando immagazzina abbastanza calore,
        la sua temperatura corporea può salire fino
        a 900 ºC.
    shield:
      ja-Hrkt: |-
        すいこんだ　くうきの　いちぶは
        たいないの　ほのおぶくろに　おくられ
        １７００どの　ほのおに　なる。
      ja: |-
        吸いこんだ　空気の　一部は
        体内の　炎袋に　送られ
        １７００度の　炎に　なる。
      ko: |-
        들이마신 공기 중 일부는
        체내의 불꽃 주머니로 보내져
        1700도의 불꽃이 된다.
      zh-Hant: |-
        會將吸入的空氣的一部分
        傳送到自己體內的火囊裡，
