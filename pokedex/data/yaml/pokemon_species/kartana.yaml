kartana:
  base_happiness: 0
  capture_rate: 45
  color: white
  egg_groups:
    - no-eggs
  evolution_chain: kartana
  evolves_from: ~
  flavor_text:
    sun:
      ja-Hrkt: |-
        ウルトラホールから　あらわれた　ＵＢ。
        みずから　てきを　おそわないようだが
        するどい　ぜんしんは　きょうきだ。
      ja: |-
        ウルトラホールから　現れた　ＵＢ。
        自ら　敵を　襲わないようだが
        鋭い　全身は　凶器だ。
      ko: |-
        울트라홀에서 나타난 UB이다.
        스스로 적을 덮치진 않지만
        온몸이 날카로운 흉기다.
      zh-Hant: |-
        來自究極之洞的ＵＢ。
        本身不會主動襲擊敵人，
        但是銳利的全身就是兇器。
      zh-Hans: |-
        从究极之洞出现的究极异兽。
        本身并不打算恐吓敌人，
        但是锐利的全身就是凶器。
      en: |-
        This Ultra Beast came from the Ultra Wormhole.
        It seems not to attack enemies on its own, but
        its sharp body is a dangerous weapon in itself.
      fr: |-
        Une Ultra-Chimère venue de l’Ultra-Brèche.
        Elle ne semble pas agressive, bien que son
        corps tout entier soit une arme tranchante.
      de: |-
        Eine Ultrabestie, die zwar nicht von sich aus
        anzugreifen scheint, deren rasiermesserscharfer
        Körper aber eine gefährliche Waffe darstellt.
      es: |-
        Este Ultraente surgió de un Ultraumbral. Se dice
        que no es muy agresivo, pero su afilado cuerpo
        es un arma realmente peligrosa.
      it: |-
        Un’Ultracreatura arrivata attraverso un
        Ultravarco. Non attacca di propria iniziativa,
        ma il suo corpo affilato è un’arma letale.
    moon:
      ja-Hrkt: |-
        きょだいな　てっとうを　いっとうの
        もとに　きりすてる　すがたが
        もくげきされた　ビーストの　いっしゅ。
      ja: |-
        巨大な　鉄塔を　一刀の
        もとに　切り捨てる　姿が
        目撃された　ビーストの　一種。
      ko: |-
        거대한 철탑을 단번에
        베어 버리는 모습이
        목격된 비스트의 일종.
      zh-Hant: |-
        被目擊到了一刀
        將巨大鐵塔切斷的樣子。
        是究極異獸的一種。
      zh-Hans: |-
        有人目击到了它
        一刀将巨大的铁搭切掉的样子。
        是究极异兽的一种。
      en: |-
        One of the Ultra Beast life-forms, it was
        observed cutting down a gigantic steel tower
        with one stroke of its blade.
      fr: |-
        Une espèce d’Ultra-Chimère. On l’aurait aperçue
        coupant un pylône métallique en deux d’un seul
        tranchant.
      de: |-
        Diese Ultrabestie wurde dabei beobachtet,
        wie sie einen riesigen stählernen Turm mit nur
        einem Hieb ihrer Klingen zerteilte.
      es: |-
        Varios testigos han observado como este
        Ultraente cortaba en dos una enorme torre de
        acero como si fuera mantequilla.
      it: |-
        Questa Ultracreatura è stata vista tagliare
        in due un traliccio dell’alta tensione con un
        solo colpo.
    ultra-sun:
      ja-Hrkt: |-
        かみの　ように　うすい　からだ　から
        とがれた　かたなに　にた　するどさを
        かんじる　ウルトラビーストだ。
      ja: |-
        紙の　ように　薄い　身体から
        研がれた　刀に　似た　鋭さを
        感じる　ウルトラビーストだ。
      ko: |-
        종이와 같은 얇은 몸에서
        연마한 칼 같은 예리함이
        느껴지는 울트라비스트다.
      zh-Hant: |-
        從這種究極異獸像紙一樣
        薄的身體上，可以感受到
        如同研磨過的刀刃般的鋒利度。
      zh-Hans: |-
        从纸一样薄的身体上能感觉到
        像磨过的刀刃一般的锋利度。
        是一种究极异兽。
      en: |-
        This Ultra Beast’s body, which is as thin as
        paper, is like a sharpened sword.
      fr: |-
        Le corps de cette Ultra-Chimère semble fin
        comme du papier, mais il est aussi tranchant
        qu’un sabre affûté.
      de: |-
        Der Körper dieser Ultrabestie ist dünn wie
        Papier und so scharfkantig wie eine
        geschliffene Klinge.
      es: |-
        El cuerpo de este Ultraente es fino como el
        papel y tan cortante como una espada recién
        afilada.
      it: |-
        Ultracreatura dal corpo sottile come un foglio
        di carta e affilato come la lama di una spada.
    ultra-moon:
      ja-Hrkt: |-
        このせかいでは　いしつで　きけんだが
        ほんらい　すんでいる　せかいでは
        ふつうに　みかける　せいぶつらしい。
      ja: |-
        この世界では　異質で　危険だが
        本来　棲んでいる　世界では
        普通に　見かける　生物らしい。
      ko: |-
        이 세계와는 성질이 다르고
        위험하지만 원래 살던 세계에서는
        흔히 볼 수 있는 생물인 듯하다.
      zh-Hant: |-
        在這個世界是危險的異類，
        但牠在原本棲息的世界裡
        似乎是隨處可見的普通生物。
      zh-Hans: |-
        在这个世界是异类，很危险，
        但在它原本栖息的世界，
        好像只是寻常能见的生物。
      en: |-
        Although it’s alien to this world and a danger
        here, it’s apparently a common organism in the
        world where it normally lives.
      fr: |-
        Cette créature venue d’ailleurs est dangereuse
        dans notre monde, mais il semblerait qu’elle soit
        très commune dans le sien.
      de: |-
        In dieser Welt wirkt sein Aussehen gefährlich
        und fremdartig, doch in seiner ursprünglichen
        Welt ist es ein ganz gewöhnliches Lebewesen.
      es: |-
        Para los seres de este mundo resulta extraño
        y peligroso, pero en el mundo del que procede
        es una criatura muy común.
      it: |-
        Nel nostro mondo il suo aspetto appare strano
        e minaccioso, ma sembra che in quello da cui
        proviene sia una creatura molto comune.
