        With four brains, it has the
        intelligence of a supercomputer.
    platinum:
      en: |-
        METANG combined to form it.
        With four brains, it has the
        intelligence of a supercomputer.
    heartgold:
      en: |-
        It folds its four legs when flying.
        Its four brains are said to be
        superior to a supercomputer.
    soulsilver:
      en: |-
        It folds its four legs when flying.
        Its four brains are said to be
        superior to a supercomputer.
    black:
      en: |-
        Metang combined to form it.
        With four brains, it has the
        intelligence of a supercomputer.
      fr: |-
        Il est né de la fusion de plusieurs
        Métang. Ses quatre cerveaux en
        font l’égal d’un superordinateur.
    white:
      en: |-
        Metang combined to form it.
        With four brains, it has the
        intelligence of a supercomputer.
      fr: |-
        Il est né de la fusion de plusieurs
        Métang. Ses quatre cerveaux en
        font l’égal d’un superordinateur.
    black-2:
      en: |-
        With four linked brains, it’s more
        intelligent than a supercomputer, and
        it uses calculations to analyze foes.
    white-2:
      en: |-
        With four linked brains, it’s more
        intelligent than a supercomputer, and
        it uses calculations to analyze foes.
    x:
      ja-Hrkt: |-
        ４つの　のうみそが　つらなり
        スーパーコンピュータより　すごい
        けいさんで　あいてを　ぶんせきする。
      ja: |-
        ４つの　脳みそが　連なり
        スーパーコンピュータより　すごい
        計算で　相手を　分析する。
      ko: |-
        4개의 뇌가 연결되어
        슈퍼컴퓨터보다 대단한
        계산으로 상대를 분석한다.
      en: |-
        With four linked brains, it’s more intelligent than a
        supercomputer, and it uses calculations to
        analyze foes.
      fr: |-
        Il est né de la fusion de plusieurs Terhal.
        Ses quatre cerveaux en font l’égal d’un
        superordinateur.
      de: |-
        Dank seiner vier vernetzten Hirne kann es Gegner
        besser als ein Supercomputer mit komplizierten
        Formeln analysieren.
      es: |-
        Gracias a sus cuatro cerebros, es más inteligente que
        un superordenador y analiza con precisión al enemigo.
      it: |-
        Con l’incredibile velocità di calcolo dei suoi quattro
        cervelli analizza il nemico più rapidamente di un
        supercomputer.
    'y':
      ja-Hrkt: |-
        メタングが　がったいして　うまれた。
        ４つの　のうを　もつ　メタグロスは
        スーパーコンピュータなみの　ちのう。
      ja: |-
        メタングが　合体して　生まれた。
        ４つの　脳を　持つ　メタグロスは
        スーパーコンピュータ並みの　知能。
      ko: |-
        메탕구가 합체해서 생겨났다.
        4개의 뇌를 가진 메타그로스는
        슈퍼컴퓨터 수준의 지능이다.
      en: |-
        Metang combined to form it. With four brains, it has
        the intelligence of a supercomputer.
      fr: |-
        Il est né de la fusion de plusieurs Métang.
        Ses quatre cerveaux en font l’égal d’un
        superordinateur.
      de: |-
        Mehrere Metang bilden dieses Pokémon. Mit seinen
        vier Gehirnen besitzt es die Intelligenz eines
        Supercomputers.
      es: |-
        Está formado por varios Metang. Con cuatro cerebros,
        tiene la inteligencia de un superordenador.
      it: |-
        È formato dalla fusione di due Metang. Ha quattro
        cervelli e l’intelligenza di un supercomputer.
    omega-ruby:
      ja-Hrkt: |-
        ４つの　のうみそは　スーパーコンピュータよりも
        はやく　むずかしい　けいさんの　こたえを　だす。
        ４ほんあしを　おりたたみ　くうちゅうに　うかぶ。
      ja: |-
        ４つの　脳みそは　スーパーコンピュータよりも
        速く　難しい　計算の　答えを　出す。
        ４本脚を　折りたたみ　空中に　浮かぶ。
      ko: |-
        네 개의 뇌는 슈퍼컴퓨터보다
        빨리 어려운 계산 문제를 푼다.
        네 개의 다리를 접고 공중에 떠오른다.
      en: |-
        Metagross has four brains in total. Combined, the four brains
        can breeze through difficult calculations faster than a
        supercomputer. This Pokémon can float in the air by tucking in
        its four legs.
      fr: |-
        Métalosse dispose de quatre cerveaux. Combinés,
        ces cerveaux peuvent effectuer des calculs très complexes
        plus vite qu’un ordinateur. Ce Pokémon peut flotter
        dans l’air en repliant ses jambes.
      de: |-
        Metagross hat insgesamt vier Gehirne. Diese können
        schwierige Berechnungen schneller durchführen als ein
        Supercomputer. Dieses Pokémon kann durch die
        Lüfte schweben, indem es seine vier Beine einklappt.
      es: |-
        Metagross tiene cuatro cerebros en total que, combinados,
        son capaces de resolver cálculos complicados más rápido que
        el mejor ordenador que haya. Metagross puede flotar en el
        aire si mete las patas hacia adentro.
      it: |-
        Metagross è dotato in tutto di quattro cervelli, che combinati
        assieme riescono a risolvere difficili calcoli più rapidamente
        di un supercomputer. Riesce a fluttuare nell’aria facendo
        rientrare le quattro zampe.
    alpha-sapphire:
      ja-Hrkt: |-
        ２ひきの　メタングが　がったいした　すがた。
        きょたいで　えものを　おさえつけながら
        おなかに　ある　おおきな　くちで　たべるのだ。
      ja: |-
        ２匹の　メタングが　合体した　姿。
        巨体で　獲物を　抑えつけながら
        お腹に　ある　大きな　口で　食べるのだ。
      ko: |-
        두 마리의 메탕구가 합체한 모습이다.
        거대한 체구로 먹이를 억누르며
        배에 있는 큰 입으로 먹는다.
      en: |-
        Metagross is the result of two Metang achieving fusion.
        When hunting, this Pokémon pins the prey to the ground under
        its massive body. It then eats the helpless victim using the
        large mouth on its stomach.
      fr: |-
        Métalosse est le résultat de la fusion de deux Métang.
        Lorsqu’il chasse, ce Pokémon bloque sa proie au sol, sous
        son corps massif. Il mange ensuite la victime impuissante
        avec son énorme bouche, ouverte sur son estomac.
      de: |-
        Metagross ist aus der Verschmelzung zweier Metang
        hervorgegangen. Auf der Jagd drückt es seine Beute
        mit seinem massigen Körper zu Boden. Dann frisst es
        sein hilfloses Opfer mit seinem großen Maul auf.
      es: |-
        Metagross es el resultado de la fusión de dos Metang.
        Cuando caza, acorrala a su presa, sujetándola contra el suelo
        con el cuerpo. Después, devora a la víctima indefensa con la
        gran boca del estómago.
      it: |-
        Metagross è il risultato della fusione di due Metang.
        Nella caccia questo Pokémon blocca la preda al suolo con
        il proprio corpo massiccio. Poi divora la vittima indifesa con
        la grande bocca posta sullo stomaco.
    sun:
      ja-Hrkt: |-
        ４つの　ツメと　おおきな　からだで
        えものを　しっかり　おさえつけると
        おなかの　はで　バリバリ　かじる。
      ja: |-
        ４つの　ツメと　大きな　身体で
        獲物を　しっかり　押さえつけると
        お腹の　歯で　バリバリ　かじる。
      ko: |-
        4개의 발톱과 큰 몸집으로
        먹이를 확실하게 누른 후
        배의 이빨로 으드득 씹는다.
      zh-Hant: |-
        用４隻爪子和龐大的身體
        牢牢地按住獵物後，
        用腹部的牙齒嚼食。
      zh-Hans: |-
        用４只爪子和庞大的身体
        牢牢地按住猎物后，
        用腹部的牙齿嘎嘣嘎嘣地啃咬。
      en: |-
        It firmly pins its prey using its four claws and
        large body. Then the teeth in the mouth on its
        stomach chew the prey to bits.
      fr: |-
        Avec ses quatre groupes de griffes et son
        corps imposant, il immobilise ses victimes
        pour ensuite mieux les dévorer.
      de: |-
        Mit seinen spitzen Beinkrallen und dem massigen
        Körper drückt es seine Beute zu Boden und
        zerkaut sie dann mit seinen Zähnen am Bauch.
      es: |-
        Con sus cuatro garras y su descomunal cuerpo
        aprisiona a sus presas para luego devorarlas
        con sus dientes.
      it: |-
        Blocca la preda al suolo con le quattro zampe
        artigliate e il corpo massiccio, poi la divora con i
        denti sulla pancia.
    moon:
      ja-Hrkt: |-
        ２ひきの　メタングが　れんけつ。
        ４つの　のうの　へいれつしょりで
        どんな　けいさんも　あっというま。
      ja: |-
        ２匹の　メタングが　連結。
        ４つの　脳の　並列処理で
        どんな　計算も　あっという間。
      ko: |-
        2마리의 메탕구가 연결되었다.
        4개의 뇌의 병렬처리로
        어떤 계산도 순식간이다.
      zh-Hant: |-
        ２隻金屬怪連結起來。
        透過４個腦袋的同步處理，
        只要一瞬間就可完成任何的計算。
      zh-Hans: |-
        ２只金属怪组合起来。
        通过４个大脑的并行处理，
        什么样的计算都只要一瞬间。
      en: |-
        A linkage of two Metang, this Pokémon can
        perform any calculation in a flash by utilizing
        parallel processing in its four brains.
      fr: |-
        Il est né de l’assemblage de deux Métang.
        Avec ses quatre cerveaux montés en parallèle,
        il peut résoudre n’importe quelle équation.
      de: |-
        Es ging aus der Verschmelzung zweier Metang
        hervor. Dank vier Gehirnen und paralleler Daten-
        verarbeitung sind Berechnungen im Nu gelöst.
      es: |-
        Metagross es el resultado de la fusión de dos
        Metang. Con sus cuatro cerebros funcionando
        en paralelo realiza cualquier cálculo al instante.
      it: |-
        È formato dalla fusione di due Metang.
        Grazie all’attività in parallelo dei suoi quattro
        cervelli, può risolvere qualsiasi calcolo.
    ultra-sun:
      ja-Hrkt: |-
        サイコパワーだけでなく　かいりきも
        じまん。　４ほんの　あしで　えものを
        つかみ　ツメで　うごきを　ふうじる。
      ja: |-
        サイコパワーだけでなく　怪力も
        自慢。　４本の　足で　獲物を
        つかみ　ツメで　動きを　封じる。
      ko: |-
        사이코 파워뿐만 아니라 괴력도
        겸비하고 있다. 4개의 다리로 먹이를
        붙잡고 발톱으로 움직이지 못하게 한다.
      zh-Hant: |-
        除了精神力量，也以怪力為傲。
        會用４隻腳捕捉獵物，
        再用鋼鐵爪子封鎖對方的行動。
      zh-Hans: |-
        不只是精神力量，还以怪力而自豪。
        能用４只脚抓住猎物，
        用爪子封住对方的行动。
      en: |-
        It boasts not only psychic powers but also
        fantastic strength. It grabs its prey with its four
        legs and holds them in place with its claws.
      fr: |-
        Il est aussi fier de sa force physique que de ses
        pouvoirs psychiques. Il immobilise ses proies
        avec les griffes d’acier de ses quatre pattes.
      de: |-
        Es besitzt nicht nur Psycho-Kräfte, sondern ist
        auch sehr stark. Beute packt es mit seinen vier
        Beinen und hält sie mit seinen Krallen fest.
      es: |-
        Se enorgullece tanto de su poder psíquico como
        de su gran fuerza. Agarra a sus presas con las
        cuatro extremidades metálicas y las inmoviliza.
      it: |-
        Oltre ai potenti poteri psichici, possiede una
        straordinaria forza fisica. Afferra la preda con le
        quattro zampe e la immobilizza con gli artigli.
    ultra-moon:
      ja-Hrkt: |-
        スーパーコンピュータよりも　すごい
        はんだんで　あいてを　ぶんせきし
        れいせいに　おいつめていくのだ。
      ja: |-
        スーパーコンピュータよりも　すごい
        判断で　相手を　分析し
        冷静に　追い詰めていくのだ。
      ko: |-
        슈퍼컴퓨터보다 굉장한
        판단력으로 상대를 분석하여
        냉정하게 궁지에 몰아넣는다.
      zh-Hant: |-
        會以超越超級電腦的
        判斷力分析對手，
        冷靜地將對手逼入絕境。
      zh-Hans: |-
        以超越超级计算机的
        判断力分析对手，
        冷静地将对手逼入绝境。
      en: |-
        It analyzes its opponents with more accuracy
        than a supercomputer, which enables it to
        calmly back them into a corner.
      fr: |-
        Implacable, il analyse son ennemi encore
        plus précisément qu’un superordinateur et
        le pousse dans ses derniers retranchements.
      de: |-
        Es kann seine Gegner besser analysieren als ein
        Supercomputer und treibt sie mit kühlem Kopf in
        die Enge.
      es: |-
        Analiza al enemigo con más precisión incluso
        que un superordenador y, sin inmutarse, lo pone
        contra las cuerdas.
      it: |-
        Grazie a capacità diagnostiche superiori a quelle
        di un supercomputer, analizza il nemico e lo
        mette alle strette senza scomporsi minimamente.
    sword:
      ja-Hrkt: |-
        きおんが　ひょうてんかになると
        じりょくが　つよまるので　ゆきやまに
        すむ　メタグロスは　とても　げんき。
      ja: |-
        気温が　氷点下になると
        磁力が　強まるので　雪山に　棲む
        メタグロスは　とても　元気。
      ko: |-
        기온이 영하로 내려가면
        자력이 강해지기 때문에 설산에 사는
        메타그로스는 매우 기운이 넘친다.
      zh-Hant: |-
        當氣溫下降到低於冰點時，
        磁力就會變強。因此棲息在
        雪山裡的巨金怪非常有活力。
      zh-Hans: |-
        由于当气温下降至０度
        以下时磁力会增强，栖息在
        雪山上的巨金怪特别有活力。
      en: |-
        Because the magnetic powers of these Pokémon
        get stronger in freezing temperatures, Metagross
        living on snowy mountains are full of energy.
      fr: |-
        Les Métalosse vivant sur des pics enneigés sont
        très actifs, car leur force magnétique augmente
        lorsque la température est inférieure à zéro.
      de: |-
        Metagross, die auf verschneiten Bergen leben,
        sind besonders aktiv, da Temperaturen unter
        dem Gefrierpunkt ihren Magnetismus verstärken.
      es: |-
        Su fuerza magnética se potencia en temperaturas
        bajo cero, por lo que los Metagross que habitan
        en montañas nevadas son especialmente vivaces.
      it: |-
        I Metagross che vivono sui monti innevati sono
        molto vivaci, perché la loro forza magnetica
        aumenta quando la temperatura va sottozero.
    shield:
      ja-Hrkt: |-
        ２ひきの　メタングが　がったいした
        すがた。　スーパーコンピュータなみの
        ずのうを　くしして　てきを　たおす。
      ja: |-
        ２匹の　メタングが　合体した　姿。
        スーパーコンピュータ並みの
        頭脳を　駆使して　敵を　倒す。
      ko: |-
        2마리의 메탕구가 합체한
        모습이다. 슈퍼컴퓨터 수준의
        두뇌를 사용해 적을 쓰러뜨린다.
      zh-Hant: |-
        ２隻金屬怪組合起來的
        樣子。會發揮堪比超級
        電腦的智能去打倒敵人。
      zh-Hans: |-
        ２只金属怪组合起来的样子。
        运用堪比超级计算机的
        头脑打败敌人。
      en: |-
        Metagross is the result of the fusion of two
        Metang. This Pokémon defeats its opponents
        through use of its supercomputer-level brain.
      fr: |-
        Né de la fusion de deux Métang, il vient à bout
        de ses ennemis grâce à son cerveau qui est aussi
        performant qu’un superordinateur.
      de: |-
        Dieses Pokémon entstand aus der Fusion zweier
        Metang. Es bezwingt Gegner mithilfe seiner
        Intelligenz, die der eines Supercomputers gleicht.
      es: |-
        Formado a partir de la unión de dos Metang.
        Emplea su inteligencia, comparable a la de un
        superordenador, para derrotar a sus rivales.
      it: |-
        È il risultato della fusione di due Metang.
        Per sconfiggere i nemici si serve del suo
        cervello, equiparabile a un supercomputer.
