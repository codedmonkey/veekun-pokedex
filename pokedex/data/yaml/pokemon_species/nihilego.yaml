nihilego:
  base_happiness: 0
  capture_rate: 45
  color: white
  egg_groups:
    - no-eggs
  evolution_chain: nihilego
  evolves_from: ~
  flavor_text:
    sun:
      ja-Hrkt: |-
        なぞに　つつまれた　ＵＢの　いっしゅ。
        まちゆく　ひとが　きせいされ
        あばれだす　すがたが　もくげきされた。
      ja: |-
        謎に　包まれた　ＵＢの　一種。
        街ゆく　人が　寄生され
        暴れだす　姿が　目撃された。
      ko: |-
        수수께끼에 싸인 UB의 일종.
        길을 가던 사람이 기생 당해
        난폭해지는 모습이 목격되었다.
      zh-Hant: |-
        是充滿謎團的ＵＢ的一種。
        有人曾目擊到走在街上的路人
        被寄生後暴走的模樣。
      zh-Hans: |-
        被谜团包围的究极异兽的一种。
        有人目击了街上的人们
        被寄生后暴走起来的样子。
      en: |-
        One of several mysterious Ultra Beasts. People
        on the street report observing those infested
        by it suddenly becoming violent.
      fr: |-
        L’une des mystérieuses Ultra-Chimères.
        On l’aurait vue parasiter des gens en pleine
        rue, les rendant extrêmement violents.
      de: |-
        Eine rätselhafte Ultrabestie. Einigen Berichten
        zufolge verwandelt sie harmlose Stadtbewohner
        per Symbiose in äußerst aggressive Menschen.
      es: |-
        Un Ultraente envuelto en misterio. Se dice que
        las víctimas a las que posee se vuelven
        agresivas.
      it: |-
        Una delle misteriose Ultracreature. Si riportano
        casi in cui le persone vittime di questo parassita
        hanno manifestato comportamenti violenti.
    moon:
      ja-Hrkt: |-
        ＵＢの　いっしゅ。　いしが　あるかは
        ふめいだが　ときおり　しょうじょの
        ような　しぐさを　みせる。
      ja: |-
        ＵＢの　一種。　意思が　あるかは
        不明だが　時折　少女の
        ような　仕草を　みせる。
      ko: |-
        UB의 일종. 의지가 있는지는
        불명확하지만 가끔
        소녀 같은 행동을 보인다.
      zh-Hant: |-
        ＵＢ的一種。
        是否有自主意識尚不清楚，
        但不時會展現少女般的姿態。
      zh-Hans: |-
        究极异兽中的一种。
        是否有自主意识尚不清楚，
        但时不时会展现少女般的姿态。
      en: |-
        One of the Ultra Beasts. It’s unclear whether or
        not this Pokémon is sentient, but sometimes it
        can be observed behaving like a young girl.
      fr: |-
        Nul ne sait si cette Ultra-Chimère possède
        une conscience propre, mais on l’aurait aperçue
        en train d’imiter les gestes d’une jeune fille.
      de: |-
        Eine Ultrabestie, die gelegentlich das Verhalten
        eines jungen Mädchens an den Tag legt. Es ist
        nicht bekannt, ob sie dies bewusst tut.
      es: |-
        Se desconoce si este Ultraente posee
        consciencia propia, pero en ocasiones se
        comporta como una chica joven.
      it: |-
        Una delle Ultracreature. Non è noto se abbia
        una volontà propria, ma talvolta sembra imitare
        il comportamento di una ragazzina.
    ultra-sun:
      ja-Hrkt: |-
        ＵＢと　よばれる　べつせかいの
        せいめいたい。　つよい　しんけいどくを
        もっていると　かんがえられる。
      ja: |-
        ＵＢと　呼ばれる　別世界の
        生命体。　強い　神経毒を
        持っていると　考えられる。
      ko: |-
        UB라고 불리는 다른 세계의
        생명체다. 강한 신경독을
        갖고 있을 것으로 추정된다.
      zh-Hant: |-
        被稱為究極異獸，
        是來自其他世界的生命體。
        被認為擁有強烈的神經毒。
      zh-Hans: |-
        是被称为究极异兽的
        其他世界的生命体。
        被认为拥有强力的神经毒素。
      en: |-
        A life-form from another world, it was dubbed
        a UB and is thought to produce a
        strong neurotoxin.
      fr: |-
        Une forme de vie d’un autre monde,
        communément appelée « Ultra-Chimère ».
        On la pense porteuse d’une violente neurotoxine.
      de: |-
        Eines der Lebewesen aus einer anderen Welt,
        die Ultrabestien genannt werden. Man glaubt,
        dass es über ein starkes Nervengift verfüge.
      es: |-
        Una forma de vida de otro mundo conocida
        como Ultraente. Se cree que posee una
        neurotoxina muy potente.
      it: |-
        Una delle forme di vita provenienti da un altro
        mondo, chiamate Ultracreature. Si pensa che
        produca una neurotossina.
    ultra-moon:
      ja-Hrkt: |-
        ウルトラホールから　このせかいに
        あらわれた。　ポケモンや　にんげんに
        きせいして　いきているようだ。
      ja: |-
        ウルトラホールから　この世界に
        現れた。　ポケモンや　人間に
        寄生して　生きているようだ。
      ko: |-
        울트라홀을 통해 이 세계에
        나타났다. 포켓몬이나 인간에게
        기생해서 사는 듯하다.
      zh-Hant: |-
        從究極之洞中現身來到
        這個世界。似乎會靠寄生在
        寶可夢或人類身上來生存。
      zh-Hans: |-
        从究极之洞出现，来到这个世界。
        好像会寄生在宝可梦或
        人类的身上生存下去。
      en: |-
        It appeared in this world from an Ultra
        Wormhole. Nihilego appears to be a parasite
        that lives by feeding on people and Pokémon.
      fr: |-
        Il est venu dans ce monde à travers une
        Ultra-Brèche. Tel un parasite, il aurait besoin
        d’un hôte, Pokémon ou humain, pour survivre.
      de: |-
        Anego kam durch eine Ultrapforte in diese Welt.
        Es scheint ein Parasit zu sein, der Pokémon
        und Menschen befällt.
      es: |-
        Llegó a este mundo a través de un Ultraumbral.
        Es un parásito que se aprovecha de Pokémon y
        personas.
      it: |-
        È arrivato in questo mondo attraverso un
        Ultravarco. È un parassita di Pokémon
        ed esseri umani.
