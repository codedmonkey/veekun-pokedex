    x:
      ja-Hrkt: |-
        １びょうかんに　キックを　１０ぱつ
        くりだす　あしわざの　もちぬし。
        するどい　なきごえで　いかくする。
      ja: |-
        １秒間に　キックを　１０発
        繰り出す　足技の　持ち主。
        鋭い　鳴き声で　威嚇する。
      ko: |-
        1초에 킥을 10번 날릴 정도로
        발을 사용하는 기술에 능하다.
        날카로운 울음소리로 위협한다.
      en: |-
        Its kicking mastery lets it loose 10 kicks per
        second. It emits sharp cries to intimidate foes.
      fr: |-
        Ce maître du coup de pied peut donner 10 coups
        par seconde. Ses cris aigus intimident l’ennemi.
      de: |-
        Es kann zehn Tritte pro Sekunde austeilen.
        Es gibt schrille Schreie von sich, um Gegner
        einzuschüchtern.
      es: |-
        Su habilidad le permite dar diez patadas por segundo.
        Lanza potentes gritos para intimidar.
      it: |-
        Possiede l’abilità di sferrare anche dieci calci al
        secondo. Emette urla strazianti per intimorire i nemici.
    'y':
      ja-Hrkt: |-
        たたかいに　なると　たいないの
        ほのおが　はげしく　もえあがる。
        キックは　はかいりょく　ばつぐんだ。
      ja: |-
        戦いに　なると　体内の　炎が
        激しく　燃え上がる。
        キックは　破壊力　抜群だ。
      ko: |-
        싸우게 되면 체내의
        불꽃이 세차게 타오른다.
        킥은 파괴력이 굉장하다.
      en: |-
        During a battle, the hot flame in its body increases.
        Its kicks have outstanding destructive power.
      fr: |-
        Au combat, les flammes dans son corps redoublent
        d’intensité. Ses coups de pied sont dévastateurs.
      de: |-
        Im Kampf lodert sein inneres Feuer hoch auf. Wo seine
        mächtigen Tritte landen, wächst kein Gras mehr.
      es: |-
        Al pelear, el fuego de su interior se intensifica. Es
        capaz de propinar unas patadas demoledoras.
      it: |-
        Quando lotta, il suo fuoco interiore diventa
        incandescente. Sferra calci di notevole potenza
        distruttiva.
    omega-ruby:
      ja-Hrkt: |-
        のやまを　はしりまわって　あしこしを　きたえる。
        スピードと　パワーを　かねそなえた　あしは
        １びょうかんに　１０ぱつの　キックを　くりだす。
      ja: |-
        野山を　走り回って　足腰を　鍛える。
        スピードと　パワーを　兼ね備えた　足は
        １秒間に　１０発の　キックを　繰り出す。
      ko: |-
        산과 들을 뛰어다니며 하반신을 단련한다.
        스피드와 파워를 겸비한 다리는
        1초에 10번 킥을 날린다.
      en: |-
        Combusken toughens up its legs and thighs by running
        through fields and mountains. This Pokémon’s legs possess
        both speed and power, enabling it to dole out 10 kicks in
        one second.
      fr: |-
        Galifeu muscle ses cuisses et ses mollets en courant dans les
        champs ou dans les montagnes. Les jambes de ce Pokémon
        sont très puissantes et rapides, capables de donner 10 coups
        de pied en 1 seconde.
      de: |-
        Jungglut trainiert seine Beine und Oberschenkel, indem es über
        Felder und Berge läuft. Die Beine dieses Pokémon sind sowohl
        schnell als auch kräftig, sodass es 10 Tritte pro Sekunde
        ausführen kann.
      es: |-
        Combusken fortalece las piernas corriendo por llanos y
        montañas. Este Pokémon tiene en las extremidades inferiores
        tanto fuerza como velocidad. Puede dar hasta diez patadas
        por segundo.
      it: |-
        Combusken si allena correndo in campagna e in montagna.
        Le zampe inferiori sono rapide e potenti e riescono a sferrare
        dieci calci al secondo.
    alpha-sapphire:
      ja-Hrkt: |-
        クチバシから　はきだす　しゃくねつの　ほのおと
        はかいりょく　ばつぐんの　キックで　たたかう。
        なきごえが　おおきいので　とても　やかましい。
      ja: |-
        クチバシから　吐きだす　灼熱の　炎と
        破壊力　抜群の　キックで　戦う。
        鳴き声が　大きいので　とても　やかましい。
      ko: |-
        부리에서 토해 내는 작열하는 불꽃과
        뛰어난 파괴력의 킥으로 싸운다.
        울음소리가 커서 무척 시끄럽다.
      en: |-
        Combusken battles with the intensely hot flames it spews from
        its beak and with outstandingly destructive kicks. This
        Pokémon’s cry is very loud and distracting.
      fr: |-
        Galifeu combat grâce aux flammes ardentes qu’il crache
        de son bec et à ses coups de pied destructeurs.
        Le cri de ce Pokémon est très puissant et très gênant
        pour l’adversaire.
      de: |-
        Jungglut stößt im Kampf glühend heiße Flammen aus seinem
        Schnabel aus und setzt extrem vernichtende Tritte ein.
        Das Geschrei dieses Pokémon ist sehr laut und verwirrend.
      es: |-
        Combusken lucha haciendo uso de las abrasadoras llamas
        que expulsa por el pico y de unas patadas fulminantes.
        Este Pokémon emite un sonido muy fuerte y molesto.
      it: |-
        Combusken combatte sputando fiamme roventi dal becco
        e sferrando calci dall’enorme potenza distruttiva.
        Il verso di questo Pokémon è lacerante e distrae gli avversari.
