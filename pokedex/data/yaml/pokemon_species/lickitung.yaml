    sword:
      ja-Hrkt: |-
        ネバネバした　だえきに　ふれたまま
        ほうっておくと　ものすごい　かゆみが
        はじまり　とまらなくなるぞ。
      ja: |-
        ネバネバした　唾液に　触れたまま
        放っておくと　ものすごい　痒みが
        はじまり　とまらなくなるぞ。
      ko: |-
        끈적끈적한 타액에 접촉한 후
        그대로 방치하면 굉장히 가렵고
        급기야 멈출 수 없게 된다.
      zh-Hant: |-
        沾到牠黏糊糊的唾液後
        如果放著不管，就會變得
        奇癢無比，而且癢個不停。
      zh-Hans: |-
        据说如果碰到了它黏糊糊的
        唾液却放任不管的话，就会
        变得奇痒无比，停不下来。
      en: |-
        If this Pokémon’s sticky saliva gets on you and
        you don’t clean it off, an intense itch will set in.
        The itch won’t go away, either.
      fr: |-
        Si sa salive gluante entre en contact avec la peau
        et qu’on ne l’essuie pas bien, elle provoque de
        terribles démangeaisons qui ne s’arrêtent jamais.
      de: |-
        Wäscht man sich nach der Berührung mit seinem
        klebrigen Speichel nicht, setzt bald ein starker
        Juckreiz ein, der nicht mehr zu stoppen ist.
      es: |-
        Si sus lametones no se tratan a tiempo, su saliva
        pegajosa y urticante puede provocar picores
        persistentes.
      it: |-
        La sua saliva appiccicosa provoca un prurito
        terribile che non dà tregua se le parti leccate
        non vengono ripulite.
    shield:
      ja-Hrkt: |-
        むしポケモンが　おもな　エサ。
        ながい　したで　あいてを　なめて
        しびれた　ところを　まるのみにする。
      ja: |-
        虫ポケモンが　おもな　エサ。
        長い　舌で　相手を　舐めて
        痺れた　ところを　丸飲みにする。
      ko: |-
        벌레포켓몬이 주된 먹이다.
        긴 혀로 상대를 핥아
        마비시킨 후 통째로 삼킨다.
      zh-Hant: |-
        蟲寶可夢是牠主要的食物。
        會用長長的舌頭去把對方
        舔麻痺，然後趁機一口吞下。
      zh-Hans: |-
        主要以虫宝可梦为食。
        会用长长的舌头舔对手，
        等对手麻痹后将其整个吞下。
      en: |-
        Bug Pokémon are Lickitung’s main food source.
        This Pokémon paralyzes its prey with a lick from
        its long tongue, then swallows the prey whole.
      fr: |-
        Excelangue se nourrit essentiellement de Pokémon
        Insecte. Il lèche ses ennemis avec sa longue langue
        pour les paralyser, puis les avale tout rond.
      de: |-
        Es ernährt sich vorwiegend von Käfer-Pokémon.
        Hat es diese mit der langen Zunge abgeschleckt
        und dadurch gelähmt, verschlingt es sie im Nu.
      es: |-
        Se nutre principalmente de Pokémon insecto,
        a los que paraliza primero lamiéndolos con su
        larga lengua y luego engulle de un bocado.
      it: |-
        Si nutre principalmente di Pokémon Coleottero.
        Paralizza le prede leccandole con la lunga lingua
        e le inghiotte in un boccone.
