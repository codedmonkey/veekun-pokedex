    ultra-sun:
      ja-Hrkt: |-
        ながい　ベロで　なんでも　べろりと
        なめて　たしかめている。　なめられた
        ぶぶんを　ほうっておくと　かぶれるぞ。
      ja: |-
        長い　ベロで　なんでも　ベロリと
        舐めて　確かめている。　舐められた
        部分を　放っておくと　かぶれるぞ。
      ko: |-
        긴 혀를 내밀어 몇 번이고
        핥아 확인한다. 핥은 부분을
        방치하면 염증이 생긴다.
      zh-Hant: |-
        不管什麼東西都會用長長的
        舌頭去舔舔看，被舔到的部位
        如果放著不管就會發炎。
      zh-Hans: |-
        不管是什么，都会用长舌头去舔舔看。
        被舔到的部位如果放着不管
        就会红肿发炎。
      en: |-
        It checks out whatever’s around it by licking
        everything. If you don’t clean off a spot where
        it’s licked you, you’ll break out in a rash!
      fr: |-
        Sa longue langue lui sert à goûter tout ce qui
        l’intrigue. Attention, car s’il vous lèche une partie
        du corps, vous risquez l’infection cutanée.
      de: |-
        Mit seiner langen Zunge leckt es an allem, um es
        zu prüfen. Lässt man eine abgeleckte Stelle
        unbehandelt, entwickelt sich ein Ausschlag.
      es: |-
        Identifica las cosas lamiéndolas con su larga
        lengua. Hay que tener cuidado, pues si no se
        tratan, sus lametones tienen efectos urticantes.
      it: |-
        Esamina tutto ciò che lo circonda con la sua
        lunga lingua. Le parti leccate, se trascurate,
        possono sviluppare irritazioni.
    ultra-moon:
      ja-Hrkt: |-
        よごれは　ベロで　きれいに　なめとる。
        なめたあとは　なんだか　くさいので
        ほんとうに　きれいなのかは　あやしい。
      ja: |-
        汚れは　ベロで　綺麗に　舐めとる。
        舐めたあとは　なんだか　臭いので
        本当に　綺麗なのかは　あやしい。
      ko: |-
        더러워지면 혀로 깨끗하게 핥아 낸다.
        핥고 난 뒤에도 왠지 냄새가 나서
        정말로 깨끗한지는 의심스럽다.
      zh-Hant: |-
        會用舌頭把髒污舔乾淨。
        舔過的地方會有點臭，
        是否真的乾淨令人懷疑。
      zh-Hans: |-
        会用舌头将污渍舔干净。
        舔过之后有点臭臭的，
        所以是否真的干净很令人怀疑。
      en: |-
        It licks filth clean with its tongue. Whatever it
        licks always stinks afterward, so whether it’s
        really clean is...questionable.
      fr: |-
        Il nettoie les saletés d’un coup de langue,
        mais vu l’odeur nauséabonde qui s’en dégage,
        ce n’est probablement pas très efficace.
      de: |-
        Seine Zunge leckt jede Unreinheit sauber.
        Danach haftet allerdings ein übler Geruch daran,
        was wiederum am Ergebnis zweifeln lässt.
      es: |-
        Se limpia y acicala a base de lengüetazos,
        aunque el olor que deja su saliva sugiere de
        todo menos pulcritud.
      it: |-
        Rimuove lo sporco leccandolo via, ma gli oggetti
        leccati emanano un cattivo odore che fa
        dubitare dell’efficacia della pulizia.
    lets-go-pikachu:
      ja-Hrkt: |-
        ２メートルもある　ながい　したは
        まえあしより　きように　うごかせる。
        なめられると　なぜか　しびれてくる。
      ja: |-
        ２メートルもある　長い　舌は
        前足より　器用に　動かせる。
        なめられると　なぜか　痺れてくる。
      ko: |-
        2m나 되는 긴 혀는 앞다리보다
        능숙하게 움직일 수 있다.
        혀로 핥으면 상대가 마비된다.
      zh-Hant: |-
        長達２公尺的舌頭比前腳
        還要靈活。如果被牠舔到，
        不知為何會感到麻痺。
      zh-Hans: |-
        它２米长的舌头比前肢更
        能灵活地移动。不知为何，
        被它舔到之后会觉得发麻。
      en: |-
        Its tongue spans almost seven feet and moves
        more freely than its forelegs. Its licks can
        cause paralysis.
      fr: |-
        Sa langue mesure 2 m et elle est plus agile
        que ses pattes. Son contact provoque
        la paralysie.
      de: |-
        Schlurps Zunge ist bis zu zwei Meter lang.
        Es kann sie geschickter bewegen als seine
        Vorderbeine und andere damit paralysieren.
      es: |-
        Su lengua puede llegar a medir dos metros y la
        mueve con más soltura que las patas delanteras.
        Sus lametazos pueden causar parálisis.
      it: |-
        Ha una lingua lunga circa 2 m, che può muovere
        con più scioltezza rispetto alle sue zampe
        anteriori. Le sue leccate paralizzano.
    lets-go-eevee:
      ja-Hrkt: |-
        ２メートルもある　ながい　したは
        まえあしより　きように　うごかせる。
        なめられると　なぜか　しびれてくる。
      ja: |-
        ２メートルもある　長い　舌は
