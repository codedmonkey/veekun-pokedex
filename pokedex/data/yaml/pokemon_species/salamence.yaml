    black-2:
      en: |-
        As a result of its long-held dream
        of flying, its cellular structure
        changed, and wings grew out.
    white-2:
      en: |-
        As a result of its long-held dream
        of flying, its cellular structure
        changed, and wings grew out.
    x:
      ja-Hrkt: |-
        おこらせると　てが　つけられない。
        すべての　ものを　ツメで　きりさき
        ほのおで　もやして　はかいする。
      ja: |-
        怒らせると　手が　つけられない。
        すべての　ものを　ツメで　切り裂き
        炎で　燃やして　破壊する。
      ko: |-
        화나게 하면 어쩔 도리가 없다.
        모든 것을 발톱으로 갈기갈기 찢고
        불꽃으로 태워서 파괴한다.
      en: |-
        It becomes uncontrollable if it is enraged. It
        destroys everything with shredding claws and fire.
      fr: |-
        Une fois enragé, plus rien ne peut arrêter Drattak.
        Il détruit tout ce qu’il voit en utilisant ses griffes ou
        en crachant des flammes.
      de: |-
        Wenn es wütend ist, gerät es außer Kontrolle.
        Es zerstört alles mit seinen Klauen und mit Feuer.
      es: |-
        Si se enfada, no hay forma de calmarlo; lo destruye
        todo lanzando arañazos y llamas.
      it: |-
        Quando è adirato diventa una furia. Con i suoi artigli
        laceranti e le fiammate che lancia può distruggere
        qualsiasi cosa.
    'y':
      ja-Hrkt: |-
        ひとたび　おこると　おおあばれ。
        そらを　とびながら　ちじょうの
        のやまを　ほのおで　やきはらう。
      ja: |-
        ひとたび　怒ると　大暴れ。
        空を　飛びながら　地上の
        野山を　炎で　焼き払う。
      ko: |-
        한번 화내면 크게 난동을 부린다.
        하늘을 날며 지상의
        산과 들을 불꽃으로 모조리 태운다.
      en: |-
        It’s uncontrollable if enraged. It flies around
        spouting flames and scorching fields
        and mountains.
      fr: |-
        Ses colères sont dévastatrices. Il s’envole et brûle
        tout sur son passage.
      de: |-
        Ist es einmal wütend, flippt es aus. Es fliegt über
        das Land und spuckt Feuer, das alles verbrennt.
      es: |-
        Si se enfada, no hay forma de que se calme. Echa a
        volar e incendia campos y montañas desde el cielo.
      it: |-
        Quando è adirato diventa una furia. Volteggia nel cielo
        sputando fiamme che bruciano le campagne intorno.
    omega-ruby:
      ja-Hrkt: |-
        つばさが　ほしいと　つよく　おもい　つづけてきた
        けっか　からだの　さいぼうが　とつぜんへんいを
        おこし　みごとな　つばさが　はえてきたと　いう。
      ja: |-
        翼が　欲しいと　強く　思い　続けてきた
        結果　体の　細胞が　突然変異を
        起こし　見事な　翼が　生えてきたと　いう。
      ko: |-
        날개가 갖고 싶다는 굳건한 바람이 계속된
        결과 몸의 세포가 돌연변이를
        일으켜서 멋진 날개가 돋아났다고 한다.
      en: |-
        Salamence came about as a result of a strong, long-held
        dream of growing wings. It is said that this powerful desire
        triggered a sudden mutation in this Pokémon’s cells,
        causing it to sprout its magnificent wings.
      fr: |-
        Drattak a ce physique grâce à son désir de pouvoir s’envoler.
        On dit que cette puissante envie a déclenché une soudaine
        mutation moléculaire de ce Pokémon, faisant surgir de
        splendides ailes.
      de: |-
        Es träumte sehr lange davon, dass ihm Flügel wachsen
        mögen. Dieser sehnliche Wunsch hat wohl eine plötzliche
        Mutation in den Zellen dieses Pokémon hervorgerufen,
        sodass ihm plötzlich prächtige Flügel wuchsen.
      es: |-
        Salamence surgió del profundo deseo de tener alas. Dicen
        que este fuerte deseo fue lo que causó la repentina mutación
        de las células y el crecimiento de las alas.
      it: |-
        Salamence rappresenta la realizzazione del sogno atavico
        e irrinunciabile di volare. Si dice che questo forte desiderio
        abbia scatenato l’improvvisa mutazione delle sue cellule,
        portando infine alla crescita di ali meravigliose.
    alpha-sapphire:
      ja-Hrkt: |-
        ゆめにまで　みた　つばさが　やっと　はえてきた。
        うれしい　きもちを　あらわすため　おおぞらを
        とびまわり　ほのおを　はいて　よろこんでいる。
      ja: |-
        夢にまで　見た　翼が　やっと　生えてきた。
        うれしい　気持ちを　現すため　大空を
        飛び回り　炎を　吐いて　喜んでいる。
      ko: |-
        꿈에 그리던 날개가 드디어 생겨났다.
        기쁜 마음을 표현하기 위해 넓은 하늘을
        날아다니며 불꽃을 내뿜으며 기뻐한다.
      en: |-
        By evolving into Salamence, this Pokémon finally
        realizes its long-held dream of growing wings. To express
        its joy, it flies and wheels all over the sky while spouting
        flames from its mouth.
      fr: |-
        En évoluant en Drattak, ce Pokémon réalise un rêve
        d’enfance, celui d’avoir des ailes. Pour exprimer sa joie,
        il vole et plane dans les cieux en crachant des flammes.
      de: |-
        Indem es sich zu Brutalanda entwickelt, setzt dieses
        Pokémon seinen lang gehegten Traum von Flügeln um.
        Um seine Freude zu zeigen, fliegt es durch die Luft und
        dreht sich. Dabei spuckt es Flammen aus seinem Mund.
      es: |-
        Al evolucionar Shelgon y convertirse por fin en Salamence, ve
        cumplido el sueño de su vida de tener alas. Para expresar su
        alegría, Salamence vuela y revolotea por el cielo al tiempo
        que lanza llamas por la boca.
      it: |-
        Evolvendosi in Salamence, questo Pokémon realizza finalmente
        il suo antico sogno di volare. Per esprimere la sua gioia,
        volteggia e turbina nel cielo sputando fiamme dalla bocca.
    sun:
      ja-Hrkt: |-
        おこると　われを　わすれ　あたりを
        こわしまわる。　ボーマンダが
        つかれはてるまで　はかいは　つづく。
      ja: |-
        怒ると　我を　忘れ　あたりを
        壊しまわる。　ボーマンダが
        疲れ果てるまで　破壊は　続く。
      ko: |-
        화가 나면 이성을 잃고 주변을
        부수며 돌아다닌다. 보만다가
        녹초가 될 때까지 파괴는 계속된다.
      zh-Hant: |-
        一生氣就會忘記自我，把周圍
        都破壞掉。破壞會持續不斷，
        直到暴飛龍精疲力盡。
      zh-Hans: |-
        一生气就会忘记自我，把周围
        都破坏掉。破坏会持续不断，
        直到暴飞龙精疲力尽。
      en: |-
        When angered, it loses all sense of itself and
        destroys everything around it. The destruction
        will continue until Salamence has tired itself out.
      fr: |-
        Quand il est pris de colère, il perd toute mesure
        et détruit ce qui l’entoure. Tant qu’il lui reste une
        once d’énergie, il continue de tout dévaster.
      de: |-
        Wenn es wütend ist, kann es nicht mehr klar
        denken und zerstört alles um sich herum.
        Das tut es bis zur völligen Erschöpfung.
      es: |-
        Cuando se enfada, pierde el control y destruye
        todo lo que está a su alcance. Solo se calma
        cuando se queda sin fuerzas.
      it: |-
        Se si infuria, perde completamente il controllo.
        Devasta tutto ciò che ha intorno e non si ferma
        finché non è sfinito.
    moon:
      ja-Hrkt: |-
        ついに　はえた　つばさで　おおぞらを
        かけめぐる。　うれしくて　かえんを
        はいて　いちめんを　やけのはらにする。
      ja: |-
        ついに　生えた　翼で　大空を
        駆け廻る。　うれしくて　火炎を
        吐いて　一面を　焼け野原にする。
      ko: |-
        드디어 자라난 날개로 넓은 하늘을
        날아다닌다. 기쁜 마음에 화염을
        뿜어 일대를 불태워 버린다.
      zh-Hant: |-
        用終於長出來的翅膀在浩瀚的
        天空翱翔。高興地噴出火焰，
        將大地變成一片火海。
      zh-Hans: |-
        用最后终于长出来的翅膀在浩瀚的
        天空翱翔。兴奋地喷出火焰，
        将大地变成一片燃烧的原野。
      en: |-
        It flies around on its wings, which have grown in
        at last. In its happiness, it gushes hot flames,
        burning up the fields it passes over.
      fr: |-
        Il fend l’air et virevolte dans le ciel grâce à ses
        ailes fraîchement formées. De bonheur, il crache
        du feu et dévaste toutes les cultures au sol.
      de: |-
        Nun, da ihm Flügel gewachsen sind, zieht es
        seine Kreise am Himmel. Vor Freude spuckt
        es Flammen und hinterlässt eine Brandwüste.
      es: |-
        Feliz de haber desarrollado al fin sus alas y de
        poder volar por el cielo, calcina con sus llamas
        todos los campos que sobrevuela.
      it: |-
        Volteggia nel cielo con le grandi ali cresciutegli
        con l’evoluzione. Esprime la sua gioia sputando
        fiamme e bruciando le campagne che sorvola.
    ultra-sun:
      ja-Hrkt: |-
        ついに　とべたよろこびで　おおぞらを
        かけめぐる。　つかれはて　ねむるまで
        ちじょうに　ほとんど　おりてこない。
      ja: |-
        ついに　飛べた喜びで　大空を
        駆け巡る。　疲れ果て　眠るまで
        地上に　ほとんど　降りてこない。
      ko: |-
        드디어 날 수 있다는 기쁨에 넓은 하늘을
        날아다닌다. 지쳐서 잠들기 전까지
        지상으로 거의 내려오지 않는다.
      zh-Hant: |-
        因為終於能飛的喜悅而不斷
        在天空四處翱翔。在耗盡體力
        而入睡之前，幾乎不會降落。
      zh-Hans: |-
        因为终于能飞的喜悦，
        而在天空四处疾飞。
        不到精疲力竭要睡觉就几乎不落地。
      en: |-
        Overjoyed at finally being able to fly, it flies all
        over the place and usually doesn’t land until it’s
        completely exhausted and needs to sleep.
      fr: |-
        Maintenant qu’il peut enfin voler, il passe tout
        son temps à parcourir le ciel et ne redescend
        que quand il tombe d’épuisement.
      de: |-
        Voller Freude darüber, endlich fliegen zu können,
        kreist es am Himmel. Es kommt erst wieder zu
        Boden, wenn es am Rande der Erschöpfung ist.
      es: |-
        Ahora que por fin puede volar, surca los cielos
        con una sonrisa en el rostro. No pisa tierra firme
        a no ser que tenga que dormir o esté exhausto.
      it: |-
        Esprime la sua gioia di essere finalmente in
        grado di volare scorrazzando nel cielo e scende
        a terra solo quando è sfinito e assonnato.
    ultra-moon:
      ja-Hrkt: |-
        つよく　ねがいつづけて　きた　けっか
        からだの　さいぼうが　とつぜんへんい。
        ねんがんの　つばさを　てにいれた。
      ja: |-
        強く　願い続けて　きた　結果
        身体の　細胞が　突然変異。
        念願の　翼を　手に入れた。
      ko: |-
        강하게 바라고 바란 결과
        몸의 세포가 돌연변이를 일으켜서
        염원하던 날개를 손에 넣었다.
      zh-Hant: |-
        在不斷地強烈祈求之下，
        身體的細胞發生了突變，
        讓牠得到了夢寐以求的翅膀。
      zh-Hans: |-
        因为不断强烈地祈求着，
        结果身体的细胞发生了突然变异。
        终于得到了心心念念的翅膀。
      en: |-
        Thanks to its fervent wishes, the cells in its
        body finally mutated, and at last it has its
        heart’s desire—wings.
      fr: |-
        Après avoir prié jour et nuit de tout son cœur,
        son souhait a enfin été exaucé : ses cellules
        ont muté pour donner naissance à des ailes !
      de: |-
        Als Ergebnis seines lang gehegten Wunsches
        haben seine Zellen eine plötzliche Mutation
        vollzogen und ihm sind Flügel gewachsen.
      es: |-
        Su fuerte y firme deseo de volar provocó una
        mutación repentina de su estructura celular que
        le permitió obtener las alas que tanto ansiaba.
      it: |-
        Il suo intenso desiderio di volare ha provocato
        una mutazione cellulare che ha fatto nascere le
        tanto agognate ali.
    sword:
      ja-Hrkt: |-
        そらを　とぶことを　ねがいつづけた
        けっか　つばさを　もつ　からだに
        しんかできた　めずらしい　ポケモン。
      ja: |-
        空を　飛ぶことを　願い続けた　結果
        翼を　持つ　体に　進化できた
        珍しい　ポケモン。
      ko: |-
        하늘을 나는 것을 꿈꿔온 결과
        날개를 가진 몸으로 진화하는 데
        성공한 희귀한 포켓몬.
      zh-Hant: |-
        長久夢想著要飛上天，
        進化後身上終於長出了
        翅膀的稀奇寶可夢。
      zh-Hans: |-
        一直渴望能飞上天空，
        进化后身体上终于长出了
        翅膀的珍奇宝可梦。
      en: |-
        Salamence is an unusual Pokémon in that it
        was able to evolve a body with wings just by
        constantly wishing to be able to fly.
      fr: |-
        Ce Pokémon rare a tellement souhaité
        voler qu’il s’est vu pousser des ailes
        pendant son évolution.
      de: |-
        Diesem ungewöhnlichen Pokémon sind im Zuge
        seiner Entwicklung Flügel gewachsen, nur weil es
        den sehnlichen Wunsch hatte, fliegen zu können.
      es: |-
        Un Pokémon poco común que, tras desear
        con todas sus fuerzas poder volar, consiguió
        un cuerpo alado al evolucionar.
      it: |-
        Questo insolito Pokémon è riuscito a evolversi
        in una creatura dotata di ali in seguito al suo
        intenso desiderio di librarsi nel cielo.
    shield:
      ja-Hrkt: |-
        おおぞらを　とぶ　よろこびに　ひたり
        じょうきげんだが　おこらせると
        てが　つけられない　らんぼうもの。
      ja: |-
        大空を　飛ぶ　喜びに　浸り
        上機嫌だが　怒らせると
        手が　つけられない　乱暴者。
      ko: |-
        넓은 하늘을 나는 기쁨에
        크게 들떠 있지만 화나게 하면
        손 쓸 수 없을 정도로 난폭하다.
      zh-Hant: |-
        沉浸在翱翔天空的喜悅時，
        心情會非常好。但性情粗暴，
        一旦被激怒就會一發不可收拾。
      zh-Hans: |-
        虽然在空中翱翔能够让它
        乐在其中，但是一旦被惹怒，
        就会大闹一番，不可收拾。
      en: |-
        While basking in the joy of flight generally keeps
        this Pokémon in high spirits, Salamence turns into
        an uncontrollable menace if something angers it.
      fr: |-
        Heureux de pouvoir voler dans le ciel, il est
        souvent de bonne humeur, mais il devient
        incontrôlable lorsqu’on le met en colère.
      de: |-
        Brutalanda freut sich ungemein darüber, endlich
        fliegen zu können, doch wenn es wütend wird,
        gerät es außer Kontrolle.
      es: |-
        Feliz de ver cumplido su deseo, surca los cielos
        con buen ánimo, pero, si se enfada, se vuelve
        violento e incontrolable.
      it: |-
        È generalmente di buon umore e traboccante
        di gioia per essere riuscito a volare, ma se si
        arrabbia diventa una furia incontrollabile.
