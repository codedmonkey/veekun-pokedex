cutiefly:
  base_happiness: 50
  capture_rate: 190
  color: yellow
  egg_groups:
    - bug
    - fairy
  evolution_chain: cutiefly
  evolves_from: ~
  flavor_text:
    sun:
      ja-Hrkt: |-
        はなのミツや　かふんが　エサ。
        オーラを　かんじる　ちからを　もち
        さきそうな　はなを　みわけている。
      ja: |-
        花のミツや　花粉が　餌。
        オーラを　感じる　力を　持ち
        咲きそうな　花を　見分けている。
      ko: |-
        꽃의 꿀이나 꽃가루가 먹이다.
        오라를 느끼는 힘을 지니고 있어
        필 것 같은 꽃을 구별한다.
      zh-Hant: |-
        花蜜和花粉是牠的食物。
        擁有感知氣場的力量，
        能分辨出要綻放的花。
      zh-Hans: |-
        花蜜和花粉是它的食物。
        拥有感知气场的力量，
        能分辨出要开放的花。
      en: |-
        It feeds on the nectar and pollen of flowers.
        Because it’s able to sense auras, it can identify
        which flowers are about to bloom.
      fr: |-
        Il se nourrit du nectar et du pollen des fleurs.
        Ayant la capacité de percevoir l’aura des
        choses, il sait quelles fleurs vont bientôt éclore.
      de: |-
        Es ernährt sich von Blütenstaub und Honig. Da
        es die Aura von Lebewesen wahrnehmen kann,
        spürt es, wenn eine Blume bald blühen wird.
      es: |-
        Se alimenta de néctar y polen. Es capaz de
        detectar los capullos que están a punto de
        abrirse.
      it: |-
        Si nutre di nettare e polline. È in grado di
        percepire l’aura di tutte le cose intorno a sé
        e avverte quando un fiore sta per sbocciare.
    moon:
      ja-Hrkt: |-
        はなに　にた　オーラを　もつ　ひとの
        あたまの　うえには　たくさんの
        アブリーが　あつまってくるよ。
      ja: |-
        花に　似た　オーラを　持つ　人の
        頭の　上には　たくさんの
        アブリーが　集まってくるよ。
      ko: |-
        꽃을 닮은 오라를 가진 사람의
        머리 위에는 많은
        에블리가 모여든다.
      zh-Hant: |-
        擁有像花一般氣場的人，
        頭上會有許多萌虻聚集過來哦。
      zh-Hans: |-
        拥有像花一样的气场的人，
        头上会有许多萌虻聚集过来哦。
      en: |-
        Myriads of Cutiefly flutter above the heads of
        people who have auras resembling those
        of flowers.
      fr: |-
        Ils volettent gaiement en nombre au-dessus de
        la tête de certaines personnes dont l’aura
        s’apparenterait à celle d’une fleur.
      de: |-
        Über den Köpfen von Menschen, deren Auren
        denen von Blumen gleichen, finden sich
        zahlreich Wommel ein.
      es: |-
        Revolotean en bandadas en torno a la cabeza de
        aquellas personas que cuentan con un aura
        similar a la de las flores.
      it: |-
        Svolazzano numerosi sulla testa di persone
        che emanano un’aura somigliante in qualche
        modo a quella dei fiori.
    ultra-sun:
      ja-Hrkt: |-
        はなのミツと　かふんが　こうぶつ。
        はなばたけで　エサを　めぐり
        バタフリーと　こぜりあいをしている。
      ja: |-
        花のミツと　花粉が　好物。
        花畑で　エサを　巡り
        バタフリーと　小競り合いをしている。
      ko: |-
        꽃의 꿀과 화분을 좋아한다.
        꽃밭에서 먹이를 두고
        버터플과 옥신각신한다.
      zh-Hant: |-
        喜歡吃花蜜和花粉。
        經常在花圃裡為了爭奪食物
        而和巴大蝶發生小衝突。
      zh-Hans: |-
        喜欢吃花蜜和花粉。
        会在花圃里寻找食物，
        和巴大蝶展开小冲突。
      en: |-
        Nectar and pollen are its favorite fare. In fields
        of flowers, it gets into skirmishes with
        Butterfree over food.
      fr: |-
        Il aime le nectar et le pollen, et se dispute
        ces denrées avec Papilusion dans les champs
        de fleurs.
      de: |-
        Es liebt Blütenstaub und Nektar. Schwirrt es auf
        der Suche nach Futter durch Blumenbeete,
        handelt es sich oft Reibereien mit Smettbo ein.
      es: |-
        Le encanta el néctar y el polen. Revolotea en
        busca de alimento por campos de flores, donde
        tiene sus rifirrafes con Butterfree.
      it: |-
        Adora il nettare e il polline.
        Lo si vede spesso nei prati mentre bisticcia
        con i Butterfree per accaparrarsi il cibo.
    ultra-moon:
      ja-Hrkt: |-
        いきものの　オーラを　かんじとる。
        オーラから　うごきを　さきよみ　して
        てきを　ほんろう　するのが　とくい。
      ja: |-
        生き物の　オーラを　感じ取る。
        オーラから　動きを　先読み　して
        敵を　翻弄　するのが　得意。
      ko: |-
        생물의 오라를 느낀다.
        오라를 통해 움직임을 먼저 읽어서
        적을 농락하는 것이 특기다.
      zh-Hant: |-
        能夠感知生物的氣場。
        擅長透過氣場預先判斷
        敵人的行動並玩弄對方。
      zh-Hans: |-
        能够感知生物的气场。
        很擅长从气场中预先读取
        敌人的行动，玩弄对方。
      en: |-
        Cutiefly can pick up the auras of living things. It
        skillfully reads those auras to predict its foes’
        movements and make fools of them.
      fr: |-
        Il perçoit l’aura des êtres vivants, ce qui lui
        permet de se jouer de son adversaire en
        prévoyant et en anticipant ses mouvements.
      de: |-
        Es kann die Aura von Lebewesen wahrnehmen.
        So erahnt es die Bewegungen seiner Feinde und
        kann sie geschickt an der Nase herumführen.
      es: |-
        Percibe el aura de los seres vivos. Aprovecha
        esta capacidad para juguetear con el enemigo
        anticipándose a sus movimientos.
      it: |-
        Percepisce l’aura degli esseri viventi, riuscendo
        così ad anticipare i loro movimenti. Per questo
        ha sempre la meglio sui nemici.
    sword:
      ja-Hrkt: |-
        かふんや　みつが　だいこうぶつ。
        ヒメンカの　かふんを　ねらって
        アブリーが　ちかくを　とびまわる。
      ja: |-
        花粉や　蜜が　大好物。
        ヒメンカの　花粉を　狙って
        アブリーが　近くを　飛びまわる。
      ko: |-
        꽃가루와 꿀을 아주 좋아한다.
        꼬모카의 꽃가루를 노리고
        에블리가 주변을 날아다닌다.
      zh-Hant: |-
        花粉和花蜜是萌虻的最愛。
        為了採集幼棉棉的花粉，
        萌虻會在牠們附近飛來飛去。
      zh-Hans: |-
        花粉和花蜜是萌虻的最爱。
        为了采集幼棉棉的花粉，
        萌虻会在它们附近飞来飞去。
      en: |-
        Nectar and pollen are its favorite fare. You can
        find Cutiefly hovering around Gossifleur, trying
        to get some of Gossifleur’s pollen.
      fr: |-
        Ce Pokémon raffole du pollen et du nectar.
        Il volette souvent près des Tournicoton
        pour collecter leur pollen.
      de: |-
        Es liebt Blütenstaub und Nektar. Hat ein Wommel
        es auf den Blütenstaub von Cottini abgesehen,
        schwirrt es in dessen Nähe herum.
      es: |-
        Le fascinan el néctar y el polen. Suele revolotear
        alrededor de los Gossifleur, atraído por su polen.
      it: |-
        Adora il nettare e il polline. Svolazza vicino
        a Gossifleur attirato dal suo polline.
    shield:
      ja-Hrkt: |-
        てきが　はっする　オーラから　つぎの
        こうどうを　よそくする。　こうげきを
        ひらりと　かわして　はんげきする。
      ja: |-
        敵が　発する　オーラから　つぎの
        行動を　予測する。　攻撃を
        ひらりと　かわして　反撃する。
      ko: |-
        상대가 내뿜는 오라로
        다음 행동을 예측한다.
        공격을 가볍게 피하고 반격한다.
      zh-Hant: |-
        從敵人散發出的氣場
        來判斷對方下一步的行動。
        能輕盈地躲開攻擊並進行反擊。
      zh-Hans: |-
        从敌人散发出的气场
        来判断对方下一步的行动。
        能轻盈地躲开攻击并进行反击。
      en: |-
        An opponent’s aura can tell Cutiefly what that
        opponent’s next move will be. Then Cutiefly can
        glide around the attack and strike back.
      fr: |-
        Il perçoit l’aura de son ennemi et anticipe
        ses mouvements. Il parvient ainsi à éviter
        les attaques et à riposter dans la foulée.
      de: |-
        Es nimmt die Aura seiner Feinde wahr und erahnt
        ihren nächsten Zug. So kann es Angriffen
        geschickt ausweichen und zurückschlagen.
      es: |-
        Al percibir el aura del rival, puede predecir sus
        movimientos y esquivarlos sin problema mientras
        lanza su contraataque.
      it: |-
        Prevede la prossima mossa del nemico
        percependone l’aura. Schiva agilmente
        i suoi colpi e poi contrattacca.
