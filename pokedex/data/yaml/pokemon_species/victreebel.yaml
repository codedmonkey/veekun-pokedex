    lets-go-pikachu:
      ja-Hrkt: |-
        ミツの　かおりで　えものを　さそう。
        くちのなかに　いれたものは　１にちで
        ホネまで　とかしてしまうという。
      ja: |-
        ミツの　香りで　獲物を　誘う。
        口の中に　入れたものは　１日で
        ホネまで　溶かしてしまうという。
      ko: |-
        꿀 냄새로 먹이를 끌어들인다.
        입안에 넣은 것은 하루 만에
        뼈까지 녹여버린다고 한다.
      zh-Hant: |-
        會用花蜜的香氣引誘獵物。
        據說被牠吞進了嘴裡的東西
        只要１天就會溶解到連骨頭都不剩。
      zh-Hans: |-
        用花蜜的香味引诱猎物。
        据说被它吞入嘴里的东西，
        只要1天就会溶解到连骨头都不剩。
      en: |-
        Lures prey with the sweet aroma of honey.
        Swallowed whole, the prey is dissolved in a day,
        bones and all.
      fr: |-
        Il attire ses proies avec une odeur de miel
        et les avale tout entières. Il les digère en un
        jour seulement, les os y compris.
      de: |-
        Es lockt Beute mit einem Duft an, der an Honig
        erinnert. Was in sein Maul gelangt, wird samt
        Knochen binnen eines Tages zersetzt.
      es: |-
        Atrae a su presa con un dulce aroma a miel.
        Una vez atrapada en la boca, la disuelve en tan
        solo un día, huesos incluidos.
      it: |-
        Attira le prede con il dolce aroma del miele,
        le inghiotte e nel giro di un giorno le scioglie
        completamente, ossa incluse.
