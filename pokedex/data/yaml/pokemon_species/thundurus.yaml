thundurus:
  base_happiness: 90
  capture_rate: 3
  color: blue
  egg_groups:
    - no-eggs
  evolution_chain: thundurus
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        Countless charred remains mar the
        landscape of places through which
        Thundurus has passed.
      fr: |-
        Les terres qu’il a survolées sont
        recouvertes d’innombrables traces
        des éclairs qu’il y a fait tomber.
    white:
      en: |-
        The spikes on its tail discharge immense
        bolts of lightning. It flies around the
        Unova region firing off lightning bolts.
      fr: |-
        Sa queue lance des décharges
        électriques. Il vole dans le ciel
        d’Unys et fait tomber des éclairs.
    black-2:
      en: |-
        As it flies around, it shoots lightning all
        over the place and causes forest fires.
        It is therefore disliked.
    white-2:
      en: |-
        As it flies around, it shoots lightning all
        over the place and causes forest fires.
        It is therefore disliked.
    x:
      ja-Hrkt: |-
        しっぽの　トゲから　でんげきを
        うちだす。イッシュちほうの　そらを
        とびまわり　カミナリを　おとす。
      ja: |-
        尻尾の　トゲから　電撃を
        撃ち出す。イッシュ地方の　空を
        飛び回り　雷を　落とす。
      ko: |-
        꼬리의 가시에서 전격을
        날린다. 하나지방의 하늘을
        날아다니며 번개를 내리친다.
      en: |-
        The spikes on its tail discharge immense bolts of
        lightning. It flies around the Unova region firing off
        lightning bolts.
      fr: |-
        Sa queue lance des décharges électriques. Il vole
        dans le ciel d’Unys et fait tomber des éclairs.
      de: |-
        Es greift mit elektrischer Ladung aus den Dornen
        seiner Rute an und bombardiert Einall aus der Luft
        mit Blitzen.
      es: |-
        Lanza descargas eléctricas por las púas de su cola.
        Sobrevuela Teselia dejando caer rayos.
      it: |-
        Lancia scariche elettriche dagli aculei della coda.
        Vola per i cieli di Unima scagliando fulmini.
    'y':
      ja-Hrkt: |-
        おおぞらを　とびまわりながら
        あちこちに　カミナリを　おとして
        やまかじを　おこすので　きらわれる。
      ja: |-
        大空を　飛び回りながら
        あちこちに　雷を　落として
        山火事を　起こすので　嫌われる。
      ko: |-
        넓은 하늘을 날아다니며
        여기저기 번개를 떨어뜨려
        산불을 내기 때문에 미움받는다.
      en: |-
        As it flies around, it shoots lightning all over
        the place and causes forest fires. It is
        therefore disliked.
      fr: |-
        Il vole dans le ciel d’Unys et fait tomber des éclairs,
        provoquant des incendies qui font sa mauvaise
        réputation.
      de: |-
        Es ist bei den Leuten verhasst, weil es auf seinen
        Rundflügen immer wieder Blitze erzeugt,
        die Waldbrände verursachen.
      es: |-
        Su gusto por surcar el cielo lanzando rayos y
        provocando incendios forestales le ha granjeado
        pocas simpatías.
      it: |-
        Non è molto amato perché durante il suo peregrinare
        nei cieli fa cadere fulmini qua e là che causano incendi
        nei boschi.
    omega-ruby:
