      en: |-
        This Pokémon existed 300 million years ago. Team
        Plasma altered it and attached a cannon to its back.
      fr: |-
        Un Pokémon existant depuis 300 millions d’années,
        et modifié par la Team Plasma. Il a maintenant
        un canon dans le dos.
      de: |-
        Es lebte vor 300 Millionen Jahren. Team Plasma
