  flavor_text:
    black:
      en: |-
        Over 300 million years ago, it was feared
        as the strongest of hunters.
        It has been modified by Team Plasma.
      fr: |-
        Il y a 300 millions d’années, il était
        craint comme l’ultime prédateur. Il a
        été modifié par la Team Plasma.
    white:
      en: |-
        This ancient bug Pokémon was altered
        by Team Plasma. They upgraded the
        cannon on its back.
      fr: |-
        Un Pokémon Insecte des temps anciens
        modifié par la Team Plasma. Le canon
        dans son dos a été grandement amélioré.
    black-2:
      en: |-
        This Pokémon existed 300 million years
        ago. Team Plasma altered it and
        attached a cannon to its back.
    white-2:
      en: |-
        This Pokémon existed 300 million years
        ago. Team Plasma altered it and
        attached a cannon to its back.
    x:
      ja-Hrkt: |-
        プラズマだんによって　かいぞうされた
        こだいの　むしポケモン。せなかの
        たいほうが　パワーアップした。
      ja: |-
        プラズマ団によって　改造された
        古代の　むしポケモン。
        背中の　大砲が　パワーアップした。
      ko: |-
        플라스마단에게 개조당한
        고대의 벌레포켓몬이다.
