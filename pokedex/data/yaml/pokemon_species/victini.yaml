victini:
  base_happiness: 100
  capture_rate: 3
  color: yellow
  egg_groups:
    - no-eggs
  evolution_chain: victini
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        This Pokémon brings victory. It is said
        that Trainers with Victini always win,
        regardless of the type of encounter.
      fr: |-
        Un Pokémon qui amène la victoire. On dit
        que les Dresseurs qui le possèdent
        peuvent gagner n’importe quel combat.
    white:
      en: |-
        It creates an unlimited supply of
        energy inside its body, which it
        shares with those who touch it.
      fr: |-
        Son corps produit une énergie
        sans limites qu’il peut partager
        avec ceux qu’il touche.
    black-2:
      en: |-
        When it shares the infinite energy
        it creates, that being’s entire
        body will be overflowing with power.
    white-2:
      en: |-
        When it shares the infinite energy
        it creates, that being’s entire
        body will be overflowing with power.
    x:
      ja-Hrkt: |-
        しょうりを　もたらす　ポケモン。
        ビクティニを　つれた　トレーナーは
        どんな　しょうぶにも　かてるという。
      ja: |-
        勝利を　もたらす　ポケモン。
        ビクティニを　連れた　トレーナーは
        どんな　勝負にも　勝てるという。
      ko: |-
        승리를 부르는 포켓몬이다.
        비크티니와 함께하는 트레이너는
        그 어떤 승부에서도 승리한다고 한다.
      en: |-
        This Pokémon brings victory. It is said that Trainers
        with Victini always win, regardless of the type
        of encounter.
      fr: |-
        Un Pokémon qui amène la victoire. On dit que les
        Dresseurs qui le possèdent peuvent gagner n’importe
        quel combat.
      de: |-
        Ein siegverheißendes Pokémon. Man sagt,
        Trainer, die ein Victini in ihrem Team haben,
        seien unschlagbar.
      es: |-
        Pokémon que atrae la victoria. Dicen que el
        Entrenador que lo lleve saldrá vencedor de
        cualquier batalla.
      it: |-
        Pokémon che porta la vittoria. Si dice che l’Allenatore
        che ha con sé Victini possa vincere qualsiasi lotta.
    'y':
      ja-Hrkt: |-
        ビクティニが　むげんに　うみだす
        エネルギーを　わけあたえてもらうと
        ぜんしんに　パワーが　あふれだす。
      ja: |-
        ビクティニが　無限に　生み出す
        エネルギーを　分け与えてもらうと
        全身に　パワーが　あふれ出す。
      ko: |-
        비크티니가 무한히 만들어내는
        에너지를 나누어 받으면
        전신에 파워가 넘친다.
      en: |-
        When it shares the infinite energy it creates,
        that being’s entire body will be overflowing
        with power.
      fr: |-
        L’énergie sans limites qu’il produit donne une force
        incroyable à ceux qui entrent en contact avec elle.
      de: |-
        Jeder, dem Victini seine grenzenlose Energie
        zuteilwerden lässt, strotzt nur so vor Kraft.
      es: |-
        Cuando Victini comparte su energía ilimitada, esa
        persona o Pokémon irradia abundante poder.
      it: |-
        Può condividere l’energia infinita che emana,
        donando un potere immenso a chi la riceve.
