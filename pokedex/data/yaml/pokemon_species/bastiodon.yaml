bastiodon:
  base_happiness: 70
  capture_rate: 45
  color: gray
  egg_groups:
    - monster
  evolution_chain: shieldon
  evolves_from: shieldon
  flavor_text:
    diamond:
      en: |-
        Any frontal attack is repulsed.
        It is a docile Pokémon that
        feeds on grass and berries.
    pearl:
      en: |-
        When attacked, they form a wall
        with their shieldlike faces to
        protect their young.
    platinum:
      en: |-
        When they lined up side by side, no
        foe could break through. They
        shielded their young in that way.
    heartgold:
      en: |-
        When attacked, they form a wall.
        Their rock-hard faces serve to
        protect them from the attacks.
    soulsilver:
      en: |-
        When attacked, they form a wall.
        Their rock-hard faces serve to
        protect them from the attacks.
    black:
      en: |-
        When they lined up side by side, no
        foe could break through. They
        shielded their young in that way.
      fr: |-
        En groupe, ils protègent leurs
        petits en formant autour d’eux
        une impénétrable muraille.
    white:
      en: |-
        When they lined up side by side, no
        foe could break through. They
        shielded their young in that way.
      fr: |-
        En groupe, ils protègent leurs
        petits en formant autour d’eux
        une impénétrable muraille.
    black-2:
      en: |-
        When they lined up side by side, no
        foe could break through. They
        shielded their young in that way.
    white-2:
      en: |-
        When they lined up side by side, no
        foe could break through. They
        shielded their young in that way.
    x:
      ja-Hrkt: |-
        よこいちれつに　ならぶと　どんな
        ポケモンでも　とっぱ　できない。
        そうやって　こどもを　まもっていた。
      ja: |-
        横一列に　並ぶと　どんな
        ポケモンでも　突破　できない。
        そうやって　子供を　守っていた。
      ko: |-
        옆에 한 줄로 세우면 어떤
        포켓몬이라도 돌파하지 못한다.
        그렇게 하여 아기를 지켜냈다.
      en: |-
        When they lined up side by side, no foe could
        break through. They shielded their young in
        that way.
      fr: |-
        En groupe, ils protègent leurs petits en formant autour
        d’eux une impénétrable muraille.
      de: |-
        Stellen sie sich Seite an Seite, kann kein Gegner
        hindurchbrechen. So schützen sie auch ihre Jungen.
      es: |-
        Se alineaban y creaban una barrera que ningún
        enemigo podía cruzar. Así protegían a sus crías.
      it: |-
        Se si mettono uno di fianco all’altro nessun nemico
        riesce a passare. Proteggono così i loro cuccioli.
    'y':
      ja-Hrkt: |-
        しょうめんからの　こうげきは
        すべて　はねかえす。くさや　きのみを
        たべる　おとなしい　せいかく。
      ja: |-
        正面からの　攻撃は
        すべて　跳ね返す。草や　木の実を
        食べる　おとなしい　性格。
      ko: |-
        정면에서의 공격은 전부 튕겨낸다.
        풀이나 나무열매를 먹는
        얌전한 성격이다.
      en: |-
        Any frontal attack is repulsed. It is a docile
        Pokémon that feeds on grass and berries.
      fr: |-
        Il résiste à toute attaque frontale. C’est un Pokémon
        docile qui se nourrit d’herbe et de Baies.
      de: |-
        Jeder Frontalangriff wird abgeschmettert. Dieses
        friedliche Pokémon ernährt sich von Gras und Beeren.
      es: |-
        Repele cualquier ataque frontal. Es muy dócil y se
        alimenta de hierba y bayas.
      it: |-
        Respinge qualsiasi attacco frontale. È un Pokémon
        docile che si nutre di erba e di bacche.
    omega-ruby:
      ja-Hrkt: |-
        よこいちれつに　ならぶと　どんな
        ポケモンでも　とっぱ　できない。
        そうやって　こどもを　まもっていた。
      ja: |-
        横一列に　並ぶと　どんな
        ポケモンでも　突破　できない。
        そうやって　子供を　守っていた。
      ko: |-
        일렬횡대로 죽 늘어서면 어떤
        포켓몬이라도 돌파하지 못한다.
        그렇게 하여 아기를 지켜냈다.
      en: |-
        When they lined up side by side, no foe could
        break through. They shielded their young in
        that way.
      fr: |-
        En groupe, ils protègent leurs petits en formant autour d’eux
        une impénétrable muraille.
      de: |-
        Stellen sie sich Seite an Seite, kann kein Gegner
        hindurchbrechen. So schützen sie auch ihre Jungen.
      es: |-
        Se alineaban y creaban una barrera que ningún enemigo podía
        cruzar. Así protegían a sus crías.
      it: |-
        Se si mettono uno di fianco all’altro nessun nemico riesce
        a passare. Proteggono così i loro cuccioli.
    alpha-sapphire:
      ja-Hrkt: |-
        しょうめんからの　こうげきは
        すべて　はねかえす。くさや　きのみを
        たべる　おとなしい　せいかく。
      ja: |-
        正面からの　攻撃は
        すべて　跳ね返す。草や　木の実を
        食べる　おとなしい　性格。
      ko: |-
        정면에서의 공격은 전부 튕겨낸다.
        풀이나 나무열매를 먹는
        얌전한 성격이다.
      en: |-
        Any frontal attack is repulsed. It is a docile
        Pokémon that feeds on grass and berries.
      fr: |-
        Il résiste à toute attaque frontale. C’est un Pokémon docile
        qui se nourrit d’herbe et de Baies.
      de: |-
        Jeder Frontalangriff wird abgeschmettert. Dieses friedliche
        Pokémon ernährt sich von Gras und Beeren.
      es: |-
        Repele cualquier ataque frontal. Es muy dócil y se alimenta
        de hierba y bayas.
      it: |-
        Respinge qualsiasi attacco frontale. È un Pokémon docile che
        si nutre di erba e di bacche.
    sun:
      ja-Hrkt: |-
        しょうめんからで　あれば　あらゆる
        こうげきを　ガード　できるが
        うしろを　とられると　なすすべなし。
      ja: |-
        正面からで　あれば　あらゆる
        攻撃を　ガードできるが
        後ろを　取られると　なす術なし。
      ko: |-
        정면에서라면 어떤 공격이든
        가드할 수 있지만
        뒤를 뺏기면 방법이 없다.
      zh-Hant: |-
        如果是從正面的話，
        可以防住所有的攻擊，
        但從後方遇襲的話就束手無策了。
      zh-Hans: |-
        如果是从正面的话，
        可以防住所有的攻击，
        但从后方被袭的话就束手无策了。
      en: |-
        While it can guard against any sort of attack
        from the front, it is left without recourse when
        attacked from behind.
      fr: |-
        S’il peut parer quasiment tous les assauts de
        face, il est extrêmement vulnérable aux attaques
        par-derrière.
      de: |-
        Alle möglichen Angriffe von vorn kann es
        abwehren, aber von hinten ist es schutzlos.
      es: |-
        Es capaz de repeler cualquier ataque frontal,
        pero se encuentra totalmente a merced de los
        ataques por la retaguardia.
      it: |-
        La sua difesa è impenetrabile se viene attaccato
        di fronte, ma se viene preso alle spalle
        è estremamente vulnerabile.
    moon:
      ja-Hrkt: |-
        ラムパルドと　にた　ばしょに　いた。
        ２ひきが　あらそい　ともだおれに
        なった　かせきが　みつかることも。
      ja: |-
        ラムパルドと　似た　場所に　いた。
        ２匹が　争い　共倒れに
        なった　化石が　見つかることも。
      ko: |-
        램펄드와 비슷한 장소에 있었다.
        2마리가 싸워 같이 쓰러져
        있는 화석이 발견될 때도 있다.
      zh-Hant: |-
        與戰槌龍生活在相似的地方。
        也曾發現過２隻互相爭鬥後
        同歸於盡而變成的化石。
      zh-Hans: |-
        与战槌龙生活在相似的地方。
        也曾发现过２只互相争斗
        一起倒下后变成的化石。
      en: |-
        It lived in the same environments as Rampardos.
        Their fossils have been found together—
        seemingly from after they’d fought to the finish.
      fr: |-
        Il vivait dans les mêmes zones que le Charkos.
        On trouve parfois leurs fossiles embrassés pour
        l’éternité suite à un K.O. mutuel.
      de: |-
        Es lebte in denselben Gebieten wie Rameidon.
        Manche Fossilienfunde legen nahe, dass sie sich
        erbitterte Kämpfe geliefert haben.
      es: |-
        Compartía hábitat con Rampardos. A veces se
        han encontrado fósiles de ambas especies
        yaciendo juntos tras una lucha encarnizada.
      it: |-
        In passato condivideva l’habitat con Rampardos.
        Spesso i loro scontri finivano in parità e non è
        raro trovarli fossilizzati insieme.
    ultra-sun:
      ja-Hrkt: |-
        かおのホネが　でかくて　かたいので
        ふくげんが　せいこう　するまで
        せぼねと　かんちがい　されていた。
      ja: |-
        顔の骨が　でかくて　硬いので
        復元が　成功するまで
        背骨と　勘違い　されていた。
      ko: |-
        얼굴의 뼈가 크고 딱딱해서
        복원에 성공할 때까지
        등뼈라고 잘못 알려져 있었다.
      zh-Hant: |-
        臉部的骨頭又大又硬，
        所以在復原成功之前
        一直被誤認為是脊椎骨。
      zh-Hans: |-
        脸部的骨头又大又硬，
        所以在复原成功前，
        一直被错误地认作了脊椎。
      en: |-
        The bones of its face are huge and hard, so
        they were mistaken for its spine until after this
        Pokémon was successfully restored.
      fr: |-
        Jusqu’à ce qu’on reconstitue ce Pokémon avec
        succès, on prenait les grands os solides qui
        couvrent son visage pour sa colonne vertébrale.
      de: |-
        Als man Fossilien noch nicht zurückverwandeln
        konnte, war man der Ansicht, sein großer, harter
        Gesichtsknochen sei sein Rücken.
      es: |-
        Hasta que no se regeneró por completo a este
        Pokémon, se pensaba que los grandes y recios
        huesos de su rostro eran su columna vertebral.
      it: |-
        Prima che venisse rigenerato si riteneva
        erroneamente che le grandi e solide ossa
        del muso facessero parte del dorso.
    ultra-moon:
      ja-Hrkt: |-
        やく１おくねんまえの　ポケモン。
        おそろしく　がんじょうな　かおは
        こうてついじょうの　こうどを　もつ。
      ja: |-
        約１億年前の　ポケモン。
        恐ろしく　頑丈な　顔は
        鋼鉄以上の　硬度を　持つ。
      ko: |-
        약 1억 년 전의 포켓몬이다.
        무섭게 튼튼한 얼굴은
        강철 이상의 경도를 가졌다.
      zh-Hant: |-
        大約１億年前的寶可夢。
        結實到極點的臉擁有
        超越鋼鐵的硬度。
      zh-Hans: |-
        大约１亿年前的宝可梦。
        极其结实的脸有着超越钢铁的硬度。
      en: |-
        This Pokémon is from roughly 100 million years
        ago. Its terrifyingly tough face is harder
        than steel.
      fr: |-
        Un Pokémon éteint depuis environ 100 millions
        d’années. Sa tête incroyablement solide était
        plus dure que l’acier.
      de: |-
        Dieses Pokémon lebte vor etwa 100 Millionen
        Jahren. Sein unglaublich robustes Gesicht ist
        härter als Stahl.
      es: |-
        Un Pokémon con una antigüedad de unos cien
        millones de años. Su rostro posee una dureza
        impresionante, superior incluso a la del acero.
      it: |-
        Questo Pokémon esisteva 100 milioni di anni fa.
        Il suo muso, incredibilmente resistente, può
        essere persino più duro dell’acciaio.
