    x:
      ja-Hrkt: |-
        あたまで　もえる　ほのおの　ように
        はげしい　せいかくの　ポケモン。
        すばやさでは　だれにも　まけない。
      ja: |-
        頭で　燃える　炎の　ように
        激しい　性格の　ポケモン。
        素早さでは　だれにも　負けない。
      ko: |-
        머리에서 타오르는 불꽃처럼
        과격한 성격의 포켓몬이다.
        스피드는 누구에게도 지지 않는다.
      en: |-
        Its crown of fire is indicative of its fiery nature.
        It is beaten by none in terms of quickness.
      fr: |-
        Sa couronne de feu trahit son tempérament bouillant.
        Sa vitesse est inégalée.
      de: |-
        Seine Krone aus Feuer ist Zeichen seines feurigen
        Wesens. Niemand ist schneller im Kampf als dieses
        Pokémon.
      es: |-
        Su corona de fuego demuestra su naturaleza ígnea.
        Nadie le gana en velocidad.
      it: |-
        La sua criniera di fuoco è indice della sua natura
        violenta. Nessuno può batterlo in velocità.
    'y':
      ja-Hrkt: |-
        すばやさで　あいてを　ほんろうする。
        りょうて　りょうあしを　つかった
        どくとくの　たたかい　かたを　する。
      ja: |-
        素早さで　相手を　翻弄する。
        両手　両足を　使った
        独特の　戦い方を　する。
      ko: |-
        스피드로 상대를 농락한다.
        양팔 양다리를 활용한
        독특한 방식으로 싸운다.
      en: |-
        It tosses its enemies around with agility. It uses all
        its limbs to fight in its own unique style.
      fr: |-
        Il fait voltiger ses ennemis grâce à sa vitesse et
        son style de combat spécial qui utilise ses quatre
        membres.
      de: |-
        Es hält den Gegner mit flinken Bewegungen
        zum Narren. Im Kampf setzt es alle Gliedmaßen ein.
      es: |-
        Maneja a sus rivales con tremenda agilidad. En su
        especial forma de luchar usa todos sus miembros.
      it: |-
        Confonde il nemico con la velocità. Ha uno stile di
        lotta speciale, che prevede l’uso dei quattro arti.
    omega-ruby:
      ja-Hrkt: |-
        あたまで　もえる　ほのおの　ように
        はげしい　せいかくの　ポケモン。
        すばやさでは　だれにも　まけない。
      ja: |-
        頭で　燃える　炎の　ように
        激しい　性格の　ポケモン。
        素早さでは　だれにも　負けない。
      ko: |-
