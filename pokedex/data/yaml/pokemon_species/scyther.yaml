    emerald:
      en: |-
        Its blindingly fast speed adds to the
        sharpness of its twin forearm scythes.
        The scythes can slice through thick logs
        in one wicked stroke.
    firered:
      en: |-
        It tears and shreds prey with its wickedly
        sharp scythes. It very rarely spreads its
        wings to fly.
    leafgreen:
      en: |-
        With ninja-like agility and speed, it can
        create the illusion that there is more
