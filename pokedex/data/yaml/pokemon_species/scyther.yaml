    sun:
      ja-Hrkt: |-
        ニンジャのように　すばやい　うごきで
        えものを　まどわせる。　いっしゅんの
        スキに　カマで　きりさいて　しまう。
      ja: |-
        ニンジャのように　素早い　動きで
        獲物を　惑わせる。　一瞬の
        隙に　鎌で　切り裂いて　しまう。
      ko: |-
        닌자처럼 재빠른 행동으로
        먹이를 혼란스럽게 한다. 한순간의
        빈틈에 낫으로 잘라버린다.
      zh-Hant: |-
        以忍者般敏捷的動作迷惑獵物，
        然後趁對方露出破綻的一瞬間
        用鐮刀將獵物切碎。
      zh-Hans: |-
        以忍者般敏捷的动作令猎物感到迷惑。
        然后趁对方麻痹大意的一瞬间
        用镰刀将其切碎。
      en: |-
        It confuses its prey with its quick, ninja-like
        movements. Then, in an instant, it cleaves
        them with its scythes.
      fr: |-
        Sa rapidité de ninja embrouille sa proie.
        Au moindre moment d’hésitation, il la coupe
        en deux d’un coup de tranchant.
      de: |-
        Seine schnellen, Ninja-artigen Reflexe irritieren
        seine Beute. Findet es eine Lücke in ihrer
        Defensive, schlitzt es sie mit seinen Sicheln auf.
      es: |-
        Se mueve tan rápido como un ninja, lo que
        desconcierta a sus presas. Es entonces cuando
        aprovecha para atacar con su par de guadañas.
      it: |-
        Confonde la sua preda muovendosi veloce
        come un ninja e in pochi attimi la fa a pezzi
        con le sue falci.
    moon:
      ja-Hrkt: |-
        わかいうちは　やまおくで　むれて
        くらし　カマでの　たたかいかたや
        こうそくいどうを　しゅぎょうする。
      ja: |-
        若いうちは　山奥で　群れて
        暮らし　鎌での　戦いかたや
        高速移動を　修行する。
      ko: |-
        젊을 때는 산속에 무리 지어
        살며 낫으로 싸우는 법이나
        고속이동을 수련한다.
      zh-Hant: |-
        年輕的時候在深山裡群居生活，
        修鍊用鐮刀戰鬥以及高速移動的技術。
      zh-Hans: |-
        年轻的时候，在深山里群居生活，
        修炼用镰刀进行战斗以及高速移动。
      en: |-
        While young, they live together deep in the
        mountains, training themselves in how to fight
        with their scythes and move at high speeds.
      fr: |-
        Les jeunes Insécateur se rassemblent au fond
        des montagnes pour s’entraîner à se battre
        avec leurs lames et à se déplacer à toute allure.
      de: |-
        Junge Sichlor wohnen in Gruppen tief in den
        Bergen. Dort trainieren sie ihre Schnelligkeit
        und üben den Kampf mit Sicheln.
      es: |-
        Cuando es joven, vive en grupo en las montañas,
        donde lucha con sus guadañas y practica sus
        raudos movimientos junto a sus compañeros.
      it: |-
        I giovani Scyther vivono in gruppi nei recessi
        delle montagne, dove si esercitano a lottare
        con le falci e a muoversi rapidissimi.
    ultra-sun:
      ja-Hrkt: |-
        するどい　２つの　カマは　たんなる
        ぶきでは　ない。　きように　あやつり
        えものを　さばいて　くらうのだ。
      ja: |-
        鋭い　２つの　カマは　単なる
        武器では　ない。　器用に　操り
        獲物を　さばいて　食らうのだ。
      ko: |-
        날카로운 2개의 낫은 단순한
        무기가 아니다. 요령 있게
        먹이를 발라 먹는다.
      zh-Hant: |-
        鋒利的２把鐮刀不只是武器，
        飛天螳螂會靈巧地用鐮刀
        分解獵物來進食。
      zh-Hans: |-
        ２把锋利的镰刀并不单单是武器。
        还能灵活地运用它们来
        切割猎物，然后食用。
      en: |-
        Its two sharp scythes are more than just
        weapons. It uses them with dexterity to dress
        its prey before eating.
      fr: |-
        Ses avant-bras en forme de faux ne lui servent
        pas uniquement à se battre : il les utilise aussi
        pour dépecer ses proies avant de les dévorer.
      de: |-
        Seine scharfen Sicheln sind nicht nur Waffen.
        Vor einer Mahlzeit filetiert es damit auch
        geschickt seine Beute.
      es: |-
        Sus dos guadañas no son meras armas de
        combate. También las utiliza diestramente para
        desmenuzar y devorar a sus presas.
      it: |-
        Usa le due falci affilate sia come armi durante
        la lotta, sia per sfilettare le prede prima di
        mangiarle.
    ultra-moon:
      ja-Hrkt: |-
        めにも　とまらぬ　はやわざは
        くうきを　きりさくほど。　ニンジャと
        よばれ　アローラでは　だいにんき。
      ja: |-
        目にも　止まらぬ　早業は
        空気を　切り裂くほど。　ニンジャと
        呼ばれ　アローラでは　大人気。
      ko: |-
        눈에 보이지 않는 빠른 기술은
        공기를 베어 가를 정도다. 닌자라
        불리며 알로라에서는 인기가 많다.
      zh-Hant: |-
        肉眼無法看清的迅速動作
        甚至能夠斬斷空氣。
        被稱為忍者的牠在阿羅拉很受歡迎。
      zh-Hans: |-
        连眼睛都无法看清的麻利手法
        甚至能切开空气。它被称为忍者，
        在阿罗拉非常具有人气。
      en: |-
        Some call it a ninja. Its movements—
        imperceptibly quick—are sufficient to cleave
        the air in two. It’s very popular in Alola.
      fr: |-
        Sa vitesse incroyable lui permet de trancher
        l’air. Il jouit d’une grande popularité à Alola,
        où il est surnommé « le ninja ».
      de: |-
        Mit enormer Schnelligkeit zerkleinert es alles in
        seinem Umfeld. Unter dem Spitznamen „Ninja“
        erfreut es sich in Alola großer Beliebtheit.
      es: |-
        Goza de gran popularidad en Alola. Por sus
        veloces movimientos que parecen cortar el
        aire, algunos lo llaman el Ninja.
      it: |-
        I suoi rapidissimi movimenti gli permettono
        di tagliare persino l’aria. Ad Alola è molto
        popolare ed è comunemente chiamato “ninja”.
    lets-go-pikachu:
      ja-Hrkt: |-
        くさむらから　いきなり　とびだして
        するどいカマで　きりさく　すがたは
        まるで　ニンジャの　ようだ。
      ja: |-
        草むらから　いきなり　飛び出して
        鋭いカマで　切りさく　姿は
        まるで　ニンジャの　ようだ。
      ko: |-
        풀숲에서 갑자기 튀어나와
        예리한 낫으로 베어 가르는 모습은
        마치 닌자 같다.
      zh-Hant: |-
        會從草叢中忽然撲出，
        用鋒利的鐮刀斬斷對手。
        這模樣看起來就像個忍者。
      zh-Hans: |-
        突然从草丛里窜出来，
        用锋利的镰刀斩砍的
        样子仿佛就像是忍者。
      en: |-
        Leaps out of tall grass and slices prey with its
        scythes. The movement looks like that of a ninja.
      fr: |-
        Bondissant hors de l’herbe comme un ninja,
        il lacère sa proie de ses griffes acérées.
      de: |-
        Sichlor gleicht einem Ninja, wenn es plötzlich
        aus dem hohen Gras springt und mit seinen
        scharfen, sichelförmigen Armen angreift.
      es: |-
        Se agazapa en la hierba alta y salta de repente
        sobre el enemigo para hacerlo trizas con sus
        afiladas guadañas. Se mueve como un ninja.
      it: |-
        Salta fuori all’improvviso dall’erba alta per fare
        a fettine le prede con le sue falci affilate.
        I suoi movimenti ricordano quelli di un ninja.
    lets-go-eevee:
      ja-Hrkt: |-
        くさむらから　いきなり　とびだして
        するどいカマで　きりさく　すがたは
        まるで　ニンジャの　ようだ。
      ja: |-
        草むらから　いきなり　飛び出して
        鋭いカマで　切りさく　姿は
        まるで　ニンジャの　ようだ。
      ko: |-
        풀숲에서 갑자기 튀어나와
