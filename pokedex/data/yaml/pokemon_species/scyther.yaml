        這模樣看起來就像個忍者。
      zh-Hans: |-
        突然从草丛里窜出来，
        用锋利的镰刀斩砍的
        样子仿佛就像是忍者。
      en: |-
        Leaps out of tall grass and slices prey with its
        scythes. The movement looks like that of a ninja.
      fr: |-
        Bondissant hors de l’herbe comme un ninja,
        il lacère sa proie de ses griffes acérées.
      de: |-
        Sichlor gleicht einem Ninja, wenn es plötzlich
        aus dem hohen Gras springt und mit seinen
        scharfen, sichelförmigen Armen angreift.
      es: |-
        Se agazapa en la hierba alta y salta de repente
        sobre el enemigo para hacerlo trizas con sus
        afiladas guadañas. Se mueve como un ninja.
      it: |-
        Salta fuori all’improvviso dall’erba alta per fare
        a fettine le prede con le sue falci affilate.
        I suoi movimenti ricordano quelli di un ninja.
    sword:
      ja-Hrkt: |-
        たたかいを　かさねるごとに　カマの
        きれあじは　あがる。　たいぼくも
        いっとうりょうだんに　きりさくぞ。
      ja: |-
        戦いを　重ねるごとに　鎌の
        切れ味は　上がる。
        大木も　一刀両断に　切り裂くぞ。
      ko: |-
        싸움을 거듭하면서 낫은
        점점 더 날카로워진다. 거목도
        일도양단으로 베어 가른다.
      zh-Hant: |-
        隨著牠歷經越多的對戰，
        鐮刀也就會變得越鋒利。
        連大樹也能一刀劈成兩半。
      zh-Hans: |-
        战斗的次数越多，镰刀
        就变得越锋利。就算是
        大树也能一刀劈成两段。
      en: |-
        As Scyther fights more and more battles, its
        scythes become sharper and sharper. With a
        single slice, Scyther can fell a massive tree.
      fr: |-
        Ses faux deviennent plus aiguisées à mesure
        qu’il se bat. Il peut trancher un grand arbre
        d’un seul coup.
      de: |-
        Mit jedem Kampf werden seine Sicheln schärfer.
        Es kann selbst einen massiven Baumstamm mit nur
        einem Schnitt zerteilen.
      es: |-
        Sus guadañas se vuelven más afiladas con cada
        combate. Es capaz de rebanar troncos gruesos
        de un tajo.
      it: |-
        Ad ogni lotta che affronta le sue falci diventano
        più affilate. Può tranciare in due grossi tronchi
        con un solo colpo.
    shield:
      ja-Hrkt: |-
        もりの　なかで　たくさんの　きが
        きりたおされた　ばしょを　みつけたら
        そこは　ストライクの　ナワバリだ。
      ja: |-
        森の中で　たくさんの　木が
        切り倒された　場所を　見つけたら
        そこは　ストライクの　縄張りだ。
      ko: |-
        숲속에서 많은 나무가 베인 채
        쓰러져 있는 장소를 발견했다면
