      fr: |-
        À force de trancher des objets
        solides, les faux de ses bras
        sont très aiguisées.
    black-2:
      en: |-
        The sharp scythes on its forearms
        become increasingly sharp by
        cutting through hard objects.
    white-2:
      en: |-
        The sharp scythes on its forearms
        become increasingly sharp by
        cutting through hard objects.
    x:
      ja-Hrkt: |-
        するどいカマで　えものを　きりさき
        いきのねを　とめる。ごくまれに
        ハネをつかって　とぶ。
      ja: |-
        鋭い　カマで　獲物を　切り裂き
        息の根を　止める。ごくまれに
        羽を　使って　飛ぶ。
      ko: |-
        날카로운 낫으로 먹이를 베고
        숨통을 끊는다. 매우 드물게
        날개를 사용해서 난다.
      en: |-
        It tears and shreds prey with its wickedly sharp
        scythes. It very rarely spreads its wings to fly.
      fr: |-
        Il déchiquette ses proies à l’aide de ses bras
        tranchants comme des faux. Il n’utilise ses ailes pour
        voler que très rarement.
      de: |-
        Es zerreißt und zerkleinert seine Beute mit seinen
        unglaublich scharfen Sicheln. Selten breitet es
        seine Flügel aus, um zu fliegen.
      es: |-
        Destroza a su presa con las guadañas que tiene.
        No es común que use las alas para volar.
      it: |-
        Fa a pezzi le prede con gli artigli spaventosamente
        affilati. Solo raramente spiega le ali per alzarsi in volo.
    'y':
      ja-Hrkt: |-
        きれあじ　するどい　カマをつかって
        くさむらを　きりすすむ。あまりに
        はやい　うごきで　めがおいつかない。
      ja: |-
        切れ味　鋭い　カマを　使って
        草むらを　切り進む。あまりに
        速い　動きで　目が　追いつかない。
      ko: |-
        잘 드는 예리한 낫을 써서
        풀숲을 베고 지나간다. 매우
        빠른 움직임에 눈이 따라가지 못한다.
      en: |-
        It slashes through grass with its sharp scythes,
        moving too fast for the human eye to track.
      fr: |-
        Il fauche les herbes avec ses lames acérées.
        Il bouge si vite qu’on ne peut le voir à l’œil nu.
      de: |-
        Es bewegt sich mit seinen Sensen so schnell durch
        das Gras, dass es kein Mensch sehen kann.
      es: |-
        Avanza por la hierba con sus afiladas guadañas, más
        rápido de lo que el ojo humano pueda percibir.
      it: |-
        Si fa strada tra l’erba grazie alle lame affilate,
        muovendosi troppo velocemente per l’occhio umano.
    omega-ruby:
      ja-Hrkt: |-
        めにも　とまらぬ　スピードが　りょううでの
        カマの　きれあじを　さらに　するどく　するのだ。
        ひとふり　すれば　たいぼくも　まっぷたつだ。
      ja: |-
        目にも　止まらぬ　スピードが　両腕の
        カマの　切れ味を　さらに　鋭く　するのだ。
        一振り　すれば　大木も　真っ二つだ。
      ko: |-
        눈에 보이지 않는 빠른 스피드가 양팔에
        달린 낫의 날카로움을 한층 높여준다.
        한 번 휘두르면 큰 나무도 두 동강 난다.
      en: |-
        Scyther is blindingly fast. Its blazing speed enhances the
        effectiveness of the twin scythes on its forearms.
        This Pokémon’s scythes are so effective, they can slice
        through thick logs in one wicked stroke.
      fr: |-
        Insécateur est incroyablement rapide. Sa vitesse fulgurante
        améliore l’efficacité des deux lames situées sur ses avant-bras.
        Elles sont si coupantes qu’elles peuvent trancher un énorme
        tronc d’arbre en un coup.
      de: |-
        Sichlor ist unheimlich schnell. Dadurch werden die beiden
        Sensen an seinen Unterarmen noch effektiver. Dieses
        Pokémon kann mit seinen Sensen in Sekundenschnelle
        Baumstämme zerteilen.
      es: |-
        Es espectacular ver lo rápido que es Scyther. Su increíble
        velocidad refuerza el efecto del par de guadañas que tiene
        en los brazos, que ya son de por sí contundentes; rebanan
        gruesos troncos de un tajo.
      it: |-
        Scyther è veloce come una saetta. La sua rapidità migliora
        l’efficacia delle due falci sulle zampe anteriori.
        Infatti riesce a tranciare con un colpo secco persino
        un tronco secolare.
    alpha-sapphire:
      ja-Hrkt: |-
        めにも　とまらぬ　スピードが　りょううでの
        カマの　きれあじを　さらに　するどく　するのだ。
        ひとふり　すれば　たいぼくも　まっぷたつだ。
      ja: |-
        目にも　止まらぬ　スピードが　両腕の
        カマの　切れ味を　さらに　鋭く　するのだ。
        一振り　すれば　大木も　真っ二つだ。
      ko: |-
