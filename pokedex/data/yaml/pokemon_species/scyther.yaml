scyther:
  base_happiness: 50
  capture_rate: 45
  color: green
  egg_groups:
    - bug
  evolution_chain: scyther
  evolves_from: ~
  flavor_text:
    red:
      en: |-
        With ninja-like
        agility and speed,
        it can create theillusion that
