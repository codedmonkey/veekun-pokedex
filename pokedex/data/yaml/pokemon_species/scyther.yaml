        Leaps out of tall
        grass and slices
        prey with itsscythes. The move­
        ment looks like
        that of a ninja.
    gold:
      en: |-
        It slashes through
        grass with its
        sharp scythes,moving too fast
        for the human eye
        to track.
    silver:
      en: |-
        When it moves, it
        leaves only a
        blur. If it hidesin grass, its pro­
        tective colors
        make it invisible.
    crystal:
      en: |-
        It's very proud of
        its speed. It
        moves so fast thatits opponent does
        not even know what
        knocked it down.
    ruby:
      en: |-
        SCYTHER is blindingly fast. Its blazing
