    alpha-sapphire:
      ja-Hrkt: |-
        なかまのため　きけんを　かえりみず
        たたかう。じどうしゃを　つかんだまま
        おおぞらを　まう　ことが　できる。
      ja: |-
        仲間のため　危険を　かえりみず
        戦う。自動車を　つかんだまま
        大空を　舞う　ことが　できる。
      ko: |-
        동료를 위해 위험을 무릅쓰고
        싸운다. 자동차를 붙잡은 채로
        넓은 하늘을 날 수 있다.
      en: |-
        They fight for their friends without any thought
        about danger to themselves. One can carry a car
        while flying.
      fr: |-
        Pour les siens, il combat au mépris du danger. Il est capable
        de soulever une voiture haut dans le ciel.
      de: |-
        Für Freunde stürzt es sich selbstlos in den Kampf. Es kann mit
        seinen Krallen Autos durch die Lüfte tragen.
      es: |-
        Lucha por sus compañeros sin reparar en el peligro. Es capaz
        de volar alto incluso con un coche en sus garras.
      it: |-
        Incurante del pericolo, lotta per difendere i compagni.
        Può sollevare in volo anche una pesante automobile.
    sun:
      ja-Hrkt: |-
        しさえ　おそれぬ　ゆうかんな　きしつ。
        たいこの　アローラの　ひとびとは
        そらのゆうしゃと　よび　そんけいした。
      ja: |-
        死さえ　恐れぬ　勇敢な　気質。
        太古の　アローラの　人々は
        空の勇者と　呼び　尊敬した。
      ko: |-
        죽음조차 두려워하지 않는 용감한 기질이다.
        먼 옛날에 알로라 사람들은
        하늘의 용자라고 부르며 존경했다.
      zh-Hant: |-
        連死都毫不畏懼的勇敢性格。
        太古時代，阿羅拉的人們稱之為
        天空的勇士，並尊敬著牠。
      zh-Hans: |-
        连死都毫不畏惧的勇敢性格。
        太古时代，阿罗拉的人们称之为
        天空的勇士，并尊敬着它。
      en: |-
        With its brave disposition, it fears nothing—not
        even death. Ancient Alolan people respected
        it, referring to it as “the hero of the sky.”
      fr: |-
        Rien n’effraie cet intrépide Pokémon, pas même
        la mort. Jadis, les gens d’Alola le surnommaient
        « le preux chevalier du ciel » avec respect.
      de: |-
        Dieses tapfere Pokémon fürchtet nicht einmal
        den Tod. Die Bewohner von Alola nannten es in
        grauer Vorzeit ehrfürchtig „Krieger der Lüfte“.
      es: |-
        Por su talante aguerrido, no titubea a la hora de
        jugarse el pellejo. Los antiguos habitantes de
        Alola lo veneraban como el Héroe del Cielo.
      it: |-
        Pokémon intrepido che non teme nemmeno
        la morte. Venerato nell’antica Alola, era noto
        come “l’eroe del cielo”.
    moon:
      ja-Hrkt: |-
        すみかを　ひとが　おびやかした
        かこが　あり　ウォーグルたちは
        いちがんに　なって　あらがったという。
      ja: |-
        棲みかを　人が　おびやかした
        過去が　あり　ウォーグルたちは
        一丸になって　抗ったという。
      ko: |-
        사는 곳을 사람에게 위협받은
        과거가 있어 워글들은
        한마음이 되어 저항했다고 한다.
      zh-Hant: |-
        據說過去棲息地曾經
        遭受人類的威脅，
        而勇士雄鷹們團結一致進行了抵抗。
      zh-Hans: |-
        据说，人类过去曾经
        威胁过它们的栖息地，
        勇士雄鹰们团结一致进行了抵抗。
      en: |-
        It’s thought that people disturbed their habitats
        in the past, so Braviary banded together to
        fight back.
      fr: |-
        Jadis, l’Homme a menacé son habitat. Tous les
        Gueriaigle se sont alors rassemblés et ont fait
        front commun pour repousser la menace.
      de: |-
        Als die Menschen einst ihren Lebensraum
        bedrohten, schlossen sich alle Washakwil
        zusammen und bekämpften sie.
      es: |-
        Cuando los seres humanos amenazaban su
        hábitat en el pasado, los Braviary se agrupaban
        para oponer resistencia.
      it: |-
        Il loro habitat era un tempo minacciato
        dagli uomini, ma i Braviary lottarono uniti
        per difenderlo.
    ultra-sun:
      ja-Hrkt: |-
        むこうきずの　おおい　ものほど
        ゆうかんとされ　うしろきずの　おおい
        ものは　むれで　バカに　される。
      ja: |-
        向こう傷の　多い　ものほど
        勇敢とされ　後ろ傷の　多い
        ものは　群れで　バカに　される。
      ko: |-
        안면에 상처가 많을수록
        용감하다고 평가받고 뒤에 상처가
        많으면 무리에서 무시당한다.
      zh-Hant: |-
        正面的傷越多就表示越勇敢，
        而背後受傷較多的則會
        在群體中受到輕視。
      zh-Hans: |-
        正面伤越多，就表示越勇敢，
        而背面受伤多的则会在群体中
        受到轻视。
      en: |-
        The more scars it has on its front, the more
        heroic it’s considered to be. Those with many
        scars on their back are mocked by the flock.
      fr: |-
        Les balafres ne font qu’ajouter à sa renommée,
        mais les blessures dans le dos, synonymes de
        fuite en combat, sont mal vues par la volée.
      de: |-
        Unter Washakwil gelten Narben an der Stirnseite
        als Beweis für Mut. Diejenigen, die viele Narben
        auf der Rückseite vorweisen, werden verhöhnt.
      es: |-
        Las cicatrices que surcan su frente demuestran
        su valor, pero las de su espalda son motivo de
        mofa por parte de su bandada.
      it: |-
        Gli esemplari con più cicatrici sul volto sono
        considerati i più valorosi. Quelli con cicatrici
        sul dorso, al contrario, sono derisi dal gruppo.
    ultra-moon:
      ja-Hrkt: |-
        そらのゆうしゃの　いみょうを　もつ。
        きずついても　にげることのない
        ほこりたかく　ゆうもうな　ポケモン。
      ja: |-
        空の勇者の　異名を　持つ。
        傷ついても　逃げることのない
        誇り高く　勇猛な　ポケモン。
      ko: |-
        하늘의 용자라는 별명을 가졌다.
        상처를 입어도 도망치지 않는
        긍지 높고 용맹한 포켓몬이다.
      zh-Hant: |-
        擁有空之勇者的別名。
        即使受傷也絕不會逃跑，
        是一種重視榮譽的勇猛寶可夢。
      zh-Hans: |-
        别名天空的勇士。
        即便受伤也绝不逃跑，
        是以此为傲的勇猛的宝可梦。
      en: |-
        Known as “the hero of the skies,” this
        Pokémon is so proud and so brave that it will
        never retreat, even when it’s injured.
      fr: |-
        Surnommé « le héros céleste », il est tellement
        fier qu’il préfère endurer mille souffrances
        plutôt que de choisir la fuite.
      de: |-
        Manche nennen es auch „Krieger der Lüfte“.
        Ein stolzes und unerschrockenes Pokémon, das
        eher Verletzungen erleidet, als zu fliehen.
      es: |-
        Se le conoce como Héroe del Cielo, y su orgullo
        y valía son tales que prefiere salir herido antes
        que huir de forma deshonrosa.
      it: |-
        Noto come “l’eroe del cielo”, è un Pokémon fiero
        e coraggioso che non scappa mai di fronte
        al pericolo, neanche quando è ferito.
    sword:
      ja-Hrkt: |-
        ゆうもうで　ほこりたかい　ポケモン。
        その　ゆうしを　たたえ　エンブレムの
        モチーフとして　にんきが　たかい。
      ja: |-
        勇猛で　誇り高い　ポケモン。
        その　雄姿を　称え　エンブレムの
        モチーフとして　人気が　高い。
      ko: |-
        용맹하고 긍지 높은 포켓몬.
        그 용감한 모습 때문에
        엠블럼의 모티브로 인기가 많다.
      zh-Hant: |-
        勇猛高傲的寶可夢。
        英勇的身姿使得牠成為人們
        設計紋章時的熱門題材。
      zh-Hans: |-
        勇猛高傲的宝可梦。
        英勇的身姿使得它成为人们
        设计纹章时的热门题材。
      en: |-
        Known for its bravery and pride, this majestic
        Pokémon is often seen as a motif for various
        kinds of emblems.
      fr: |-
        C’est un Pokémon fier et vaillant.
        Sa bravoure lui vaut d’être souvent utilisé
        comme emblème sur les blasons.
      de: |-
        Es ist ein furchtloses und stolzes Pokémon,
        das als Symbol des Mutes häufig auf Wappen
        abgebildet wird.
      es: |-
        Un Pokémon osado y orgulloso, cuyo majestuoso
        porte lo convierte en un motivo heráldico muy
        popular.
      it: |-
        È un Pokémon intrepido e orgoglioso.
        Appare spesso come motivo araldico per via
        del suo eroismo.
    shield:
      ja-Hrkt: |-
        ちのけが　おおく　あらっぽいので
        ガラルの　はこびやの　ざは
        アーマーガアに　うばわれた。
      ja: |-
        血の気が　多く　荒っぽいので
        ガラルの　運び屋の　座は
        アーマーガアに　奪われた。
      ko: |-
        혈기왕성하고 거칠어서
        가라르의 배달부 자리는
        아머까오에게 뺏겼다.
      zh-Hant: |-
        性情粗暴、血氣方剛，
        因此被鋼鎧鴉奪走了
        伽勒爾運送員的地位。
      zh-Hans: |-
        性格粗暴、血气方刚，
        因此被钢铠鸦夺走了
        伽勒尔运送员的地位。
      en: |-
        Because this Pokémon is hotheaded and
        belligerent, it’s Corviknight that’s taken
        the role of transportation in Galar.
      fr: |-
        Son caractère agressif et violent lui a valu
        de perdre son rôle de transporteur à Galar
        au profit de Corvaillus.
      de: |-
        Da es hitzköpfig und aggressiv ist, hat es den
        Posten als Kurier in Galar an Krarmor verloren.
      es: |-
        Su carácter agresivo e irascible le ha hecho
        perder su puesto como transportista en Galar
        en favor de los Corviknight.
      it: |-
        A causa del suo carattere irruente e violento
        ha perso il posto di corriere a Galar, che gli è
        stato rubato da Corviknight.
    legends-arceus:
      en: |-
        Screaming a bloodcurdling battle cry, this huge and ferocious
        bird Pokémon goes out on the hunt. It blasts lakes with shock
        waves, then scoops up any prey that float to the water's surface.
