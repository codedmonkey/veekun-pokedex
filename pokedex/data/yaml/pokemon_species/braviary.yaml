braviary:
  base_happiness: 50
  capture_rate: 60
  color: red
  egg_groups:
    - flying
  evolution_chain: rufflet
  evolves_from: rufflet
  flavor_text:
    black:
      en: |-
        They fight for their friends without any
        thought about danger to themselves.
        One can carry a car while flying.
      fr: |-
        Pour les siens, il combat au mépris du
        danger. Il est capable de soulever
        une voiture haut dans le ciel.
    white:
      en: |-
        The more scars they have, the more
        respect these brave soldiers of the sky 
        get from their peers.
      fr: |-
        Un chevalier du ciel brave et intrépide.
        Plus son corps porte de cicatrices, plus
        il est respecté de ses congénères.
    black-2:
      en: |-
        For the sake of its friends, this brave
        warrior of the sky will not stop battling,
        even if injured.
    white-2:
      en: |-
        For the sake of its friends, this brave
        warrior of the sky will not stop battling,
        even if injured.
    x:
      ja-Hrkt: |-
        なかまの　ためなら　どれだけ
        きずつこうとも　たたかいを　やめない
        ゆうかんな　おおぞらの　せんし。
      ja: |-
        仲間の　ためなら　どれだけ
        傷つこうとも　戦いを　やめない
        勇敢な　大空の　戦士。
      ko: |-
        동료를 위해서라면 아무리
        상처를 입더라도 싸움을 관두지 않는
        용감한 넓은 하늘의 전사.
      en: |-
        For the sake of its friends, this brave warrior of the
        sky will not stop battling, even if injured.
      fr: |-
        Un chevalier du ciel, brave et intrépide. Pour les
        siens, il combat au mépris du danger, sans jamais
        fléchir.
      de: |-
        Ein tapferer Krieger der Lüfte, der zum Schutz
        seiner Kameraden auch mit Verletzungen immer
        weiterkämpft.
      es: |-
        Un valiente guerrero del cielo que no duda en luchar
        por sus compañeros por graves que sean sus heridas.
      it: |-
        È l’intrepido guerriero del cielo. Per difendere i suoi
        simili, lotta fino all’ultimo senza badare alle ferite.
    'y':
      ja-Hrkt: |-
        なかまのため　きけんを　かえりみず
        たたかう。じどうしゃを　つかんだまま
        おおぞらを　まう　ことが　できる。
      ja: |-
        仲間のため　危険を　かえりみず
        戦う。自動車を　つかんだまま
        大空を　舞う　ことが　できる。
      ko: |-
        동료를 위해 위험을 무릅쓰고
        싸운다. 자동차를 붙잡은 채로
        넓은 하늘을 날 수 있다.
      en: |-
        They fight for their friends without any thought
        about danger to themselves. One can carry a car
        while flying.
      fr: |-
        Pour les siens, il combat au mépris du danger. Il est
        capable de soulever une voiture haut dans le ciel.
      de: |-
        Für Freunde stürzt es sich selbstlos in den Kampf. Es
        kann mit seinen Krallen Autos durch die Lüfte tragen.
      es: |-
        Lucha por sus compañeros sin reparar en el peligro.
        Es capaz de volar alto incluso con un coche en sus
        garras.
      it: |-
        Incurante del pericolo, lotta per difendere i compagni.
        Può sollevare in volo anche una pesante automobile.
    omega-ruby:
      ja-Hrkt: |-
        なかまの　ためなら　どれだけ
        きずつこうとも　たたかいを　やめない
        ゆうかんな　おおぞらの　せんし。
      ja: |-
