    black-2:
      en: |-
        Each of its nine tails is imbued
        with supernatural power, and it
        can live for a thousand years.
    white-2:
      en: |-
        Each of its nine tails is imbued
        with supernatural power, and it
        can live for a thousand years.
    x:
      ja-Hrkt: |-
        おうごんに　かがやく　たいもうと
        ９ほんの　ながい　しっぽを　もつ。
        １０００ねんは　いきると　いわれる。
      ja: |-
        黄金に　輝く　体毛と
        ９本の　長い　尻尾を　持つ。
        １０００年は　生きると　言われる。
      ko: |-
        황금빛으로 빛나는 털과
        9개의 긴 꼬리를 지녔다.
        1000년을 산다고 한다.
      en: |-
        It has nine long tails and fur that gleams gold.
        It is said to live for 1,000 years.
      fr: |-
        Il a neuf longues queues et une fourrure qui brille
        comme de l’or. On dit qu’il peut vivre 1 000 ans.
      de: |-
        Es hat neun lange Schweife und sein Fell glänzt
        gülden. Man sagt, es soll 1 000 Jahre alt werden.
      es: |-
        Tiene nueve colas y un pelaje de color dorado.
        Dicen que este Pokémon llega a vivir 1000 años.
      it: |-
        Dotato di nove code e di una pelliccia dorata,
        si dice che viva 1000 anni.
    'y':
      ja-Hrkt: |-
        あたまがよくて　しゅうねんぶかい。
        ふざけて　しっぽを　つかむと
        １０００ねん　たたられるという。
      ja: |-
        頭が良くて　執念深い。
        ふざけて　尻尾を　つかむと
        １０００年　たたられるという。
      ko: |-
        머리가 좋고 집념이 강하다.
        장난으로 꼬리를 잡으면
        1000년 동안 화를 입는다고 한다.
      en: |-
        Very smart and very vengeful. Grabbing one of its
        many tails could result in a 1,000-year curse.
      fr: |-
        Il est très intelligent et rancunier. Attrapez une de
        ses queues et il vous maudira pour 1 000 ans.
      de: |-
        Dieses Pokémon ist intelligent, aber rachsüchtig.
        Sein Schweif kann einen schweren Fluch übertragen.
      es: |-
        Muy inteligente y vengativo. Agarrar una de sus colas
        podría traer 1000 años de mala suerte.
      it: |-
        Molto elegante e vendicativo. Chi gli afferra una
        coda rischia una maledizione millenaria.
    omega-ruby:
      ja-Hrkt: |-
        まっかな　ひとみは　あやしい　ひかりを　はなち
        あいての　こころを　じざいに　あやつる。
        １０００ねんかん　いきると　いわれている。
      ja: |-
        真っ赤な　瞳は　怪しい　光を　放ち
        相手の　心を　自在に　操る。
        １０００年間　生きると　いわれている。
      ko: |-
        새빨간 눈은 괴상한 빛을 발산하여
        상대의 마음을 자유로이 조종한다.
        1000년을 산다고 전해진다.
      en: |-
        Ninetales casts a sinister light from its bright red eyes to gain
        total control over its foe’s mind. This Pokémon is said to live
        for a thousand years.
      fr: |-
        Feunard peut envoyer un inquiétant rayon avec ses yeux
        rouge vif pour prendre le contrôle de l’esprit de son ennemi.
        On raconte que ce Pokémon peut vivre 1 000 ans.
      de: |-
        Vulnona sendet einen unheimlichen Lichtstrahl aus seinen
        hellroten Augen aus, um totale Kontrolle über die Gedanken
        seines Gegners zu erlangen. Man sagt, dieses Pokémon
        könne 1 000 Jahre leben.
      es: |-
        Ninetales emite una siniestra luz a través de los brillantes ojos
        rojos que tiene, para conseguir controlar del todo la mente de
        su rival. Dicen que este Pokémon llega a vivir mil años.
      it: |-
        Ninetales emana sinistri bagliori dai luminosi occhi rossi
        per acquisire il controllo totale della mente del suo nemico.
        Si dice che possa vivere anche per mille anni.
    alpha-sapphire:
      ja-Hrkt: |-
        ９にんの　せいなる　ちからを　もった　せんにんが
        がったいして　うまれたという　でんせつが　ある。
        ちのうが　たかく　ひとの　ことばを　りかいする。
      ja: |-
        ９人の　聖なる　力を　持った　仙人が
        合体して　生まれたという　伝説が　ある。
        知能が　高く　人の　言葉を　理解する。
      ko: |-
        성스러운 힘을 지닌 9명의 신선이
        합체하여 태어났다는 전설이 있다.
        지능이 높아서 사람의 말을 이해한다.
      en: |-
        Legend has it that Ninetales came into being when
        nine wizards possessing sacred powers merged into one.
        This Pokémon is highly intelligent—it can understand
        human speech.
      fr: |-
        La légende raconte que Feunard est apparu lorsque
        neuf sorciers aux pouvoirs sacrés décidèrent de fusionner.
        Ce Pokémon est très intelligent. Il comprend la langue
        des hommes.
      de: |-
        Eine Legende besagt, dass Vulnona zu existieren begann,
        als neun Zauberer mit heiligen Kräften zu einem verschmolzen.
        Dieses Pokémon ist hochintelligent und versteht die
        menschliche Sprache.
      es: |-
        Cuenta la leyenda que Ninetales nació de la fusión de nueve
        hechiceros que tenían poderes sagrados. Este Pokémon es
        realmente inteligente. Entiende el lenguaje humano.
      it: |-
        Narra la leggenda che Ninetales sia nato dalla fusione di
        nove maghi dai sacri poteri in un’unica creatura. Questo
        Pokémon estremamente intelligente riesce a capire
        il linguaggio umano.
    sun:
      ja-Hrkt: |-
        ９にんの　せいじゃが　がったいし
        キュウコンに　なったという　でんせつも
        のこるほど　しんぴにみちた　ポケモン。
      ja: |-
        ９人の　聖者が　合体し
        キュウコンに　なったという　伝説も
        残るほど　神秘に満ちた　ポケモン。
      ko: |-
        9명의 성자가 합체하여
        나인테일이 되었다는 전설이
        남을 정도로 신비함이 가득한 포켓몬.
      zh-Hant: |-
        至今還流傳著９位聖者
        合體變成九尾的傳說，
        是充滿神秘色彩的寶可夢。
      zh-Hans: |-
        至今还流传着９位圣者
        合体变成九尾的传说，
        是充满神秘色彩的宝可梦。
      en: |-
        Legend has it that this mystical Pokémon was
        formed when nine saints coalesced into one.
      fr: |-
        L’aura mystique de ce Pokémon est telle qu’une
        légende raconte que neuf grands sages ont
        un jour fusionné pour devenir un Feunard.
      de: |-
        Einer Legende nach entstand dieses mystische
        Pokémon, als einst neun Zauberer mit heiligen
        Kräften zu einem verschmolzen.
      es: |-
        Siempre se le ha considerado un Pokémon
        místico. Una leyenda asegura que se originó
        a partir de la unión de nueve deidades.
      it: |-
        Questo Pokémon è avvolto nel mistero.
        La leggenda narra che sia nato dalla fusione
        di nove saggi.
    moon:
      ja-Hrkt: |-
        １０００ねん　いきると　いわれている。
        じんつうりきで　かえんを　じざいに
        あやつり　えものを　やきこがす。
      ja: |-
        １０００年　生きると　いわれている。
        神通力で　火炎を　自在に
        操り　獲物を　焼き焦がす。
      ko: |-
        1000년을 산다고 전해진다.
        신통력으로 화염을 자유자재로
        조종해서 먹이를 불태워버린다.
      zh-Hant: |-
        據說生存了１０００年。
        利用神通力自由地操縱火焰，
        將獵物燒焦。
      zh-Hans: |-
        据说生存了１０００年。
        利用神通力自由地操纵火焰，
        将猎物烧焦。
      en: |-
        Said to live for a thousand years, this Pokémon
        uses its supernatural abilities to manipulate fire.
        It can burn its prey to a crisp as it pleases.
      fr: |-
        On raconte que ce Pokémon vit 1 000 ans.
        Ses pouvoirs lui permettent de contrôler les
        flammes à volonté pour griller ses proies.
      de: |-
        Man sagt, es könne bis zu 1 000 Jahre alt
        werden. Mit mystischen Kräften kontrolliert es
        das Feuer und brät sich damit seine Beute.
      es: |-
        Se dice que este Pokémon llega a vivir mil años.
        Con sus poderes, es capaz de controlar el fuego
        a voluntad y calcinar a sus presas.
      it: |-
        Si dice che possa vivere mille anni.
        Grazie ai suoi poteri magici, è in grado di
        controllare le fiamme e incenerire le sue prede.
    ultra-sun:
      ja-Hrkt: |-
        しつこく　しゅうねんぶかい　せいしつ。
        １ど　うらむと　しそんを　ふくめ
        １０００ねんかん　たたりつづける。
      ja: |-
        しつこく　執念深い　性質。
        １度　恨むと　子孫を　含め
        １０００年間　祟り続ける。
      ko: |-
        끈질기고 집념이 강한 성질을 가졌다.
        한 번 원한을 사면 자손을 포함해
        1000년간 해를 입는다.
      zh-Hant: |-
        性情執拗，一旦遭到牠的怨恨，
        牠會在１０００年間不斷作祟，
        連對方的子孫都不放過。
      zh-Hans: |-
        性格执拗，爱记仇。一旦遭到它的怨恨，
        它便会在１０００年间不断作祟，
        连对方的子孙都不放过。
      en: |-
        It is vindictive and relentless by nature.
        Those who cross it even once will be cursed for
        a thousand years, along with their descendants.
      fr: |-
        Un Pokémon très rancunier. S’il est offensé,
        son ressentiment peut poursuivre le coupable
        et sa descendance pendant un millénaire.
      de: |-
        Dieses Pokémon ist sehr rachsüchtig. Wer
        seinen Groll provoziert, den verfolgt bis in seine
        Nachkommenschaft ein tausendjähriger Fluch.
      es: |-
        Un Pokémon extraordinariamente vengativo.
        Si recibe una afrenta, su rencor puede perdurar
        durante un milenio y trascender generaciones.
      it: |-
        È molto ostinato e vendicativo. Chi si attira il
        suo rancore cade vittima di una maledizione
        millenaria che si trasmette anche ai discendenti.
    ultra-moon:
      ja-Hrkt: |-
        くちから　ふいた　ゆらめく　ほのおで
        さいみん　じょうたいにして　えものを
        おそう　ひじょうに　かしこいポケモン。
      ja: |-
        口から　吹いた　揺らめく　炎で
        催眠　状態にして　獲物を
        襲う　非常に　賢いポケモン。
      ko: |-
        입에서 흔들리는 불꽃을 뿜어서
        최면 상태로 만든 후에 먹이를
        덮치는 매우 똑똑한 포켓몬이다.
      zh-Hant: |-
        會從口中吐出搖曳的火焰，
        讓獵物陷入催眠狀態後再發動襲擊。
        是一種非常聰明的寶可夢。
      zh-Hans: |-
        非常聪明的宝可梦。
        能从口中吐出摇曳的火焰来使猎物
        进入催眠状态，继而展开袭击。
      en: |-
        The flickering flames it spews from its mouth
        leave its opponents hypnotized. Then, this
        extremely intelligent Pokémon attacks.
      fr: |-
        Un Pokémon extrêmement intelligent qui crache
        des flammes vacillantes pour hypnotiser
        et capturer ses proies.
      de: |-
        Ein höchst intelligentes Pokémon. Es speit
        zuckende Flammen aus dem Mund, um seine
        Beute vor dem Angriff zu hypnotisieren.
      es: |-
        Este Pokémon es sumamente inteligente.
        Controla las llamas que expele por la boca para
        hipnotizar y capturar a sus presas.
      it: |-
        È un Pokémon estremamente intelligente.
        Dalla bocca sputa fiammelle con cui
        ipnotizza le prede prima di attaccarle.
    lets-go-pikachu:
      ja-Hrkt: |-
        ９にんの　せいじゃが　がったいして
        このポケモンに　うまれかわったと
        いいつたえに　のこっている。
      ja: |-
        ９人の　聖者が　合体して
        このポケモンに　生まれかわったと
        言い伝えに　残っている。
      ko: |-
        9명의 성자가 합체하여
        이 포켓몬으로 다시 태어났다는
        전설이 남아 있다.
      zh-Hant: |-
        傳說中這隻寶可夢
        是由９位聖人
        合而為一所誕生的。
      zh-Hans: |-
        传说这种宝可梦
        是由９位圣者
        合体之后而诞生的。
      en: |-
        According to an enduring legend, nine noble
        saints were united and reincarnated
        as this Pokémon.
      fr: |-
        Selon la légende, neuf sages se sont unis
        et incarnés dans ce Pokémon mystique.
      de: |-
        Einer Sage nach ist Vulnona die Wiedergeburt
        der Seelen von neun edlen Zauberern, die
        miteinander verschmolzen sind.
      es: |-
        De acuerdo con una antigua leyenda, este
        Pokémon es la reencarnación de nueve
        deidades que se unieron en un solo ser.
      it: |-
        Narra la leggenda che le anime di nove saggi
        si siano unite e reincarnate in questo Pokémon.
    lets-go-eevee:
      ja-Hrkt: |-
        ９にんの　せいじゃが　がったいして
        このポケモンに　うまれかわったと
        いいつたえに　のこっている。
      ja: |-
        ９人の　聖者が　合体して
        このポケモンに　生まれかわったと
        言い伝えに　残っている。
      ko: |-
        9명의 성자가 합체하여
        이 포켓몬으로 다시 태어났다는
        전설이 남아 있다.
      zh-Hant: |-
        傳說中這隻寶可夢
        是由９位聖人
        合而為一所誕生的。
      zh-Hans: |-
        传说这种宝可梦
        是由９位圣者
        合体之后而诞生的。
      en: |-
        According to an enduring legend, nine noble
        saints were united and reincarnated
        as this Pokémon.
      fr: |-
        Selon la légende, neuf sages se sont unis
        et incarnés dans ce Pokémon mystique.
      de: |-
        Einer Sage nach ist Vulnona die Wiedergeburt
        der Seelen von neun edlen Zauberern, die
        miteinander verschmolzen sind.
      es: |-
        De acuerdo con una antigua leyenda, este
        Pokémon es la reencarnación de nueve
        deidades que se unieron en un solo ser.
      it: |-
        Narra la leggenda che le anime di nove saggi
        si siano unite e reincarnate in questo Pokémon.
    sword:
      ja-Hrkt: |-
        しっぽの　いっぽん　いっぽんに
        じんつうりきが　こめられている。
        １０００ねん　いきると　いわれる。
      ja: |-
        しっぽの　１本　１本に
        神通力が　込められている。
        １０００年　生きると　言われる。
      ko: |-
        꼬리 하나하나에
        신통력이 담겨 있다.
        1000년을 산다고 한다.
      zh-Hant: |-
        每一根尾巴裡都蘊含著
        神通力。據說牠的壽命
        長達１０００年。
      zh-Hans: |-
        每一根尾巴里都蕴含着
        神通力。据说它的寿命
        长达１０００年。
      en: |-
        It is said to live 1,000 years, and each of its tails
        is loaded with supernatural powers.
      fr: |-
        On dit qu’il vit 1 000 ans et que chacune
        de ses queues a un pouvoir magique.
      de: |-
        Man sagt, es lebe 1 000 Jahre und jedem seiner
        Schweife wohnen übernatürliche Kräfte inne.
      es: |-
        Cuentan que llega a vivir hasta mil años y que
        cada una de las colas posee poderes
        sobrenaturales.
      it: |-
        Dicono che viva un millennio. Ognuna delle sue
        code è dotata di un potere magico.
    shield:
      ja-Hrkt: |-
        あたまがよくて　しゅうねんぶかい。
        ふざけて　しっぽを　つかむと
        １０００ねん　たたられるという。
      ja: |-
        頭が良くて　執念深い。
        ふざけて　しっぽを　つかむと
        １０００年　たたられるという。
      ko: |-
        머리가 좋고 집념이 강하다.
        장난으로 꼬리를 잡으면
        1000년 동안 화를 입는다고 한다.
      zh-Hant: |-
        聰明伶俐但很會記仇。
        據說如果敢亂抓牠的尾巴，
        牠就會纏著你作祟１０００年。
      zh-Hans: |-
        聪明伶俐，但爱记仇。
        据说如果敢乱抓它的尾巴，
        它就会缠着你作祟１０００年。
      en: |-
        Very smart and very vengeful. Grabbing one of
        its many tails could result in a 1,000-year curse.
      fr: |-
        Il est très intelligent et rancunier.
        Quiconque attrape une de ses queues se fera
        maudire pour 1 000 ans.
      de: |-
        Dieses Pokémon ist intelligent, aber rachsüchtig.
        Wer zum Spaß einen seiner Schweife ergreift,
        kann sich einen tausendjährigen Fluch einhandeln.
      es: |-
        Muy inteligente y vengativo. Agarrar una de sus
        colas podría traer 1000 años de mala suerte.
      it: |-
        Molto intelligente e vendicativo. Chi gli afferra
        una coda rischia una maledizione millenaria.
    legends-arceus:
      en: |-
        The coat of gleaming golden fur is quite magnificent.
        This species is said to store sacred power in its nine long tails
        and to live for a millennium.
