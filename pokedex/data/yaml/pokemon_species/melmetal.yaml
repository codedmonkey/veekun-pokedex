        추앙받았었다. 모종의 이유로
        3000년의 세월이 흘러 되살아났다.
      zh-Hant: |-
        擁有產出鐵的力量，因而受到
        人們的崇拜。不知為何，在經過
        3000年的時間後甦醒過來。
      zh-Hans: |-
        因为拥有产出铁的力量而
        受到崇拜。不知为何，经过
        3000年后突然苏醒了过来。
      en: |-
        Revered long ago for its capacity to create iron
        from nothing, for some reason it has come back
        to life after 3,000 years.
      fr: |-
        Autrefois vénéré pour son aptitude à produire
        du fer, ce Pokémon a mystérieusement ressuscité
        après 3 000 ans.
      de: |-
        Einst wurde es für seine Fähigkeit verehrt, Eisen
        erschaffen zu können. Nach 3 000 Jahren ist es
        aus einem unerfindlichen Grund wieder erwacht.
      es: |-
        En la antigüedad se le veneraba por su poder
        de crear hierro. Después de tres milenios, ha
