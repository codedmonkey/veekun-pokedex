      it: |-
        In passato era venerato perché lo si riteneva
        capace di generare ferro. È misteriosamente
        ricomparso dopo 3.000 anni di assenza.
    sword:
      ja-Hrkt: |-
        じゅみょうが　つきると　からだが
        さびて　くずれる。　やがて　ちいさな
        はへんが　メルタンに　ふっかつする。
      ja: |-
        寿命が　尽きると　体が
        錆びて　崩れる。　やがて　小さな
        破片が　メルタンに　復活する。
      ko: |-
        수명이 다하면 몸이 녹슬고
        붕괴한다. 이윽고 작은 파편이
        멜탄으로 부활한다.
      zh-Hant: |-
        壽命快到盡頭的時候，
        身體就會生鏽解體。到最後
        細小的碎片會復活為美錄坦。
      zh-Hans: |-
        寿命快到尽头的时候，
        身体就会生锈解体。到最后
        细小的碎片会复活为美录坦。
      en: |-
        At the end of its life-span, Melmetal will rust and
        fall apart. The small shards left behind will
        eventually be reborn as Meltan.
      fr: |-
        En fin de vie, son corps rouille et se brise
        en mille morceaux. Ces derniers renaissent
        ensuite sous forme de Meltan.
      de: |-
        Geht sein Leben dem Ende zu, rostet sein Körper
        und fällt auseinander. Kurz darauf erwachen die
        verbliebenen Fragmente als Meltan zum Leben.
      es: |-
        Al final de su vida, su cuerpo se oxida y se hace
        pedazos. Poco tiempo después, estos fragmentos
        que quedan dan vida a varios Meltan.
      it: |-
        Alla fine della sua esistenza, si arrugginisce e
        cade a pezzi. Dopo un po’ di tempo, i resti del
        suo corpo tornano in vita sotto forma di Meltan.
    shield:
      ja-Hrkt: |-
        えんしんりょくで　はずみを　つけて
        くりだす　おもい　ナットの　パンチは
        ポケモン　さいきょうと　いわれる。
      ja: |-
        遠心力で　弾みを　つけて
        繰りだす　重い　ナットの　パンチは
        ポケモン　最強と　いわれる。
      ko: |-
        원심력으로 힘을 더해서
        날리는 묵직한 너트 펀치는
        포켓몬 중 최강이라고 전해진다.
      zh-Hant: |-
        美錄梅塔利用離心力帶動
        沉重的螺帽揮出的拳擊
        被認為是寶可夢界之最。
      zh-Hans: |-
        美录梅塔利用离心力带动
        沉重的螺帽挥出的拳击
        被认为是宝可梦界之最。
      en: |-
        Centrifugal force is behind the punches of
        Melmetal’s heavy hex-nut arms. Melmetal is said
        to deliver the strongest punches of all Pokémon.
      fr: |-
        On dit que, grâce à la force centrifuge, les coups
        de poing qu’il assène avec ses lourds écrous
        seraient les plus dévastateurs parmi les Pokémon.
      de: |-
        Es holt mit Fliehkraft Schwung, um mit seinen
        schweren Muttern Hiebe auszuteilen, die stärker
        sein sollen als die aller anderen Pokémon.
      es: |-
        Gracias a la inercia y la fuerza centrífuga, los
        puñetazos que propina con sus pesadas tuercas
        son los más potentes del mundo Pokémon.
      it: |-
        Sferra pugni con i suoi dadi metallici sfruttando la
        forza centrifuga. Si dice che nessun altro Pokémon
        sia capace di sferrarne di altrettanto potenti.
