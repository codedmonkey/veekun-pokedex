    x:
      ja-Hrkt: |-
        ふかい　かいこうの　そこで　ねむる。
        ルギアが　はばたくと　４０にち
        あらしが　つづくと　いわれている。
      ja: |-
        深い　海溝の　底で　眠る。
        ルギアが　羽ばたくと　４０日
        嵐が　続くと　言われている。
      ko: |-
        깊은 해구의 밑바닥에서 잠잔다.
        루기아가 날개를 치면 40일 동안
        폭풍우가 계속된다고 전해진다.
      en: |-
        It sleeps in a deep-sea trench. If it flaps its wings,
        it is said to cause a 40-day storm.
      fr: |-
        Il dort dans une faille des grands fonds.
        Ses battements d’ailes génèrent une tempête de 40
        jours.
      de: |-
        Es schläft in einem Tiefseegraben. Schwingt es
        seine Flügel, entsteht ein Sturm, der 40 Tage dauert.
      es: |-
        Duerme en una dorsal marina. Si bate sus alas, puede
        causar tormentas de 40 días.
      it: |-
        Dorme in una fossa negli abissi marini. Con un
        battito d’ali provoca una tempesta di 40 giorni.
    'y':
      ja-Hrkt: |-
        うみのかみさま　と　つたえられる
        ポケモン。あらしのよる　すがたを
        みたという　はなしが　つたえられる。
      ja: |-
        海の神様と　伝えられる　ポケモン。
        嵐の　夜　姿を　見たという　話が
        伝えられる。
      ko: |-
        바다의 신이라고 전해지는
        포켓몬이다. 폭풍 치는 밤에 모습을
        봤다는 이야기가 전해져온다.
      en: |-
        It is said to be the guardian of the seas. It is
        rumored to have been seen on the night of a storm.
      fr: |-
        Il est supposé être le gardien des sept mers.
        On raconte qu’il est apparu une nuit de forte tempête.
      de: |-
        Man berichtet, es sei der Wächter der Meere und man
        habe es im Herzen eines tosenden Sturmes gesehen.
      es: |-
        Dicen que es el guardián de los mares. Hay rumores
        de que fue visto en una noche de tormenta.
      it: |-
        Viene definito il guardiano dei mari. Si dice che sia
        stato visto nelle notti di tempesta.
    omega-ruby:
      ja-Hrkt: |-
        つばさを　かるく　はばたかせた　だけで　みんかを
        ふきとばす　はかいりょくを　もっている　ために
        かいていで　ひとしれず　くらす　ように　なった。
      ja: |-
        翼を　軽く　羽ばたかせた　だけで　民家を
        吹き飛ばす　破壊力を　持っている　ために
        海底で　人知れず　暮らす　ように　なった。
      ko: |-
        가벼운 날갯짓만으로도 민가를
        날려버릴 만한 파괴력을 지니고 있어서
        해저에서 사람들 몰래 살게 됐다.
      en: |-
        Lugia’s wings pack devastating power—a light fluttering of its
        wings can blow apart regular houses. As a result, this
        Pokémon chooses to live out of sight deep under the sea.
      fr: |-
        Les ailes de Lugia renferment une puissance dévastatrice.
        Un simple battement de ses ailes peut détruire de petites
        maisons. Du coup, ce Pokémon a choisi de vivre loin de tout,
        dans les profondeurs océaniques.
      de: |-
        Lugias Flügel haben eine zerstörerische Kraft. Bereits ein
        leichtes Flattern kann Häuser hinfortwehen. Daher hat sich
        dieses Pokémon dafür entschieden, tief unter dem Meer
        zu leben, wo es niemand sieht.
      es: |-
        La fuerza que tiene Lugia en las alas es devastadora; con
        nada que las bata es capaz de derribar edificios enteros.
        Por eso mismo, prefiere vivir donde no haya nadie, en lo más
        profundo del mar.
      it: |-
        Le ali di Lugia hanno un’enorme potenza distruttiva:
        un leggero battito d’ali è in grado di abbattere una
        normale abitazione. Perciò il Pokémon ha scelto
        di vivere lontano dall’uomo, nelle profondità abissali.
    alpha-sapphire:
      ja-Hrkt: |-
        つばさを　かるく　はばたかせた　だけで　みんかを
        ふきとばす　はかいりょくを　もっている　ために
