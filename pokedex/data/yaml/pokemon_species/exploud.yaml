    white-2:
      en: |-
        Its howls can be heard over six
        miles away. It emits all sorts of
        noises from the ports on its body.
    x:
      ja-Hrkt: |-
        バクオングの　とおぼえは　１０キロ
        さきまで　とどく。からだじゅうの
        あなから　さまざまな　おとを　だす。
      ja: |-
        バクオングの　遠ぼえは　１０キロ
        先まで　届く。体中の　穴から
        さまざまな　音を　出す。
      ko: |-
        폭음룡이 짖는 소리는 10km
        전방까지 닿는다. 몸 곳곳의
        구멍에서 갖가지 소리를 낸다.
      en: |-
        Its howls can be heard over six miles away. It emits
        all sorts of noises from the ports on its body.
      fr: |-
        Son hurlement s’entend à 10 km à la ronde.
        Ses orifices émettent toutes sortes de bruits.
      de: |-
        Sein Heulen hört man in 10 km Entfernung.
        Es gibt alle Arten von Geräuschen von sich.
      es: |-
        Su aullido se puede oír a 10 km. Emite todo tipo de
        sonidos desde los tubos de su cuerpo.
      it: |-
        Le sue urla si sentono a 10 km di distanza. Emette
        diversi suoni dalle numerose aperture del suo corpo.
    'y':
      ja-Hrkt: |-
        たたかいのときに　だす　うなりごえは
        まるで　じしんの　ように
        じめんを　グラグラと　ゆらす。
      ja: |-
        戦いのときに　出す　うなり声は
        まるで　地震の　ように
        地面を　グラグラと　揺らす。
      ko: |-
        싸울 때 내는 으르렁거리는 소리는
        마치 지진처럼
        땅을 쿵쿵 울린다.
      en: |-
        Its roar in battle shakes the ground like a
        tremor--or like an earthquake has struck.
      fr: |-
        Au combat, son hurlement fait trembler le sol comme
        un séisme.
      de: |-
        Sein Grollen, das es während des Kampfs ausstößt,
        erschüttert den Boden ganz wie bei einem Erdbeben.
      es: |-
        El bramido que emite al atacar puede sacudir la tierra
        con la intensidad de un terremoto.
      it: |-
        In lotta emette ululati che possono veramente far
        tremare la terra alla stregua di un terremoto.
    omega-ruby:
      ja-Hrkt: |-
        おおごえの　しんどうで　じしんを　おこす。
        からだの　あなから　くうきを　はげしく　すいこみ
        はじめたら　おおごえを　だす　まえぶれだ。
      ja: |-
        大声の　振動で　地震を　起こす。
        体の　穴から　空気を　激しく　吸い込み
        始めたら　大声を　出す　前触れだ。
      ko: |-
        큰 소리의 진동으로 지진을 일으킨다.
        몸에 난 구멍으로 공기를 세차게 빨아들이기
        시작하면 큰 소리를 낼 조짐이다.
      en: |-
        Exploud triggers earthquakes with the tremors it creates
        by bellowing. If this Pokémon violently inhales from the
        ports on its body, it’s a sign that it is preparing to let loose
        a huge bellow.
      fr: |-
        Brouhabam peut déclencher des tremblements de terre
        grâce aux vibrations de son hurlement. Lorsque ce Pokémon
        inspire fortement, cela signifie qu’il se prépare à pousser
        un gigantesque rugissement.
      de: |-
        Krawumms kann durch sein Brüllen Erdbeben auslösen.
        Wenn dieses Pokémon durch seine Körperöffnungen kräftig
        einatmet, ist es kurz davor, ein mächtiges Brüllen von sich
        zu geben.
      es: |-
        Exploud provoca terremotos con el temblor que causa al
        levantar la voz. Cuando inhala aire por los tubos, hay que
        prestar atención, ya que está a punto de soltar un buen
        bramido.
      it: |-
        Exploud è in grado di generare terremoti con le vibrazioni
        vocali. Quando inala grandi quantità d’aria dalle numerose
        aperture del corpo, significa che si sta preparando a emettere
        un grido lancinante.
    alpha-sapphire:
      ja-Hrkt: |-
        からだの　あなから　ふえの　ような　おとを
        だして　なかまに　きもちを　つたえている。
        おおごえは　たたかう　ときしか　ださないのだ。
      ja: |-
        体の　穴から　笛の　ような　音を
        出して　仲間に　気持ちを　伝えている。
        大声は　戦う　ときしか　出さないのだ。
      ko: |-
        몸의 구멍에서 피리 같은 소리를
        내서 동료에게 기분을 전달하고 있다.
        큰 소리는 싸울 때만 낸다.
      en: |-
        Exploud communicates its feelings to the others by emitting
        whistle-like sounds from the tubes on its body. This Pokémon
        only raises its voice when it is in battle.
      fr: |-
        Brouhabam communique avec les autres en émettant
        un sifflement qui provient des tubes de son corps.
        Ce Pokémon n’élève la voix que pendant les combats.
      de: |-
        Krawumms vermittelt seinen Artgenossen seine Gefühle,
        indem es eine Art Pfeifen durch die Röhren an seinem Körper
        von sich gibt. Dieses Pokémon erhebt nur im Kampf seine
        Stimme.
      es: |-
        Exploud expresa sus sentimientos a los otros emitiendo una
        especie de silbidos a través de los tubos que tiene. Este
        Pokémon solo levanta la voz cuando está en combate.
      it: |-
        Exploud comunica le sue sensazioni emettendo
        dei fischi dai canali tubolari del suo corpo.
        Questo Pokémon alza la voce soltanto nella lotta.
    sword:
      ja-Hrkt: |-
        むかしの　ひとは　とおく　はなれた
        まち　どうしの　れんらく　ほうほうに
        バクオングの　おおごえを　つかった。
      ja: |-
        昔の　人は　遠く　離れた
        街同士の　連絡方法に
        バクオングの　大声を　使った。
      ko: |-
        옛날 사람은 멀리 떨어진
        마을끼리 연락하는 방법으로
        폭음룡의 큰 목소리를 사용했다.
      zh-Hant: |-
        以前的人曾利用爆音怪的
        大吼聲，作為與遙遠城鎮
        彼此聯絡的方法。
      zh-Hans: |-
        以前的人们曽利用
        爆音怪发出的巨响，
        与相隔遥远的城镇居民联系。
      en: |-
        In the past, people would use the loud voices of
        these Pokémon as a means of communication
        between distant cities.
      fr: |-
        Autrefois, l’Homme se servait du cri puissant
        de ce Pokémon pour communiquer d’une ville
        à l’autre sur de longues distances.
      de: |-
        Einst nutzten die Menschen das Gebrüll von
        Krawumms zur Kommunikation zwischen weit
        voneinander entfernten Dörfern.
      es: |-
        En la antigüedad, los bramidos de Exploud se
        utilizaban como medio de comunicación entre
        pueblos alejados.
      it: |-
        Un tempo la potente voce di questo Pokémon
        veniva utilizzata come mezzo di comunicazione
        tra città distanti.
    shield:
      ja-Hrkt: |-
        おおごえ　だけじゃない。　からだの
        あなから　いろいろな　ねいろを　だし
        なかまと　いしそつうを　するのだ。
      ja: |-
        大声だけじゃない。　体の　穴から
        いろいろな　音色を　出し
        仲間と　意思疎通を　するのだ。
      ko: |-
        큰 목소리만 가진 것이 아니다.
        몸의 구멍에서 다양한 소리를 내어
        동료와 의사소통을 한다.
      zh-Hant: |-
        不只會大吼，還會從
        身上的洞發出各種音色
        與夥伴們彼此溝通。
      zh-Hans: |-
        它不仅仅会大喊大叫。为了和
        伙伴相互传情达意，它会从
        身体的洞里发出各种各样的音色。
      en: |-
        This Pokémon can do more than just shout. To
        communicate with others of its kind, it’ll emit all
        sorts of sounds from the holes in its body.
      fr: |-
        Pour communiquer avec ses semblables,
        il n’utilise pas que son cri puissant ; il émet
        aussi des sons par les trous de son corps.
      de: |-
        Es nutzt nicht nur seine laute Stimme, sondern
        stößt auch über seine Körperöffnungen allerlei
        Töne aus, um mit Artgenossen zu kommunizieren.
      es: |-
        Además de sus bramidos, es capaz de emitir
        distintos tonos por los tubos de su cuerpo, que
        le permiten comunicarse con sus semejantes.
      it: |-
        Oltre a emettere potenti urla, grazie alle
        aperture del suo corpo produce suoni di tonalità
        diverse, che usa per comunicare con i suoi simili.
