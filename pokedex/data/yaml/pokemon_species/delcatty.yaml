        de sa sublime fourrure. Il ne
        possède pas de nid.
    white:
      en: |-
        It is highly popular among female
        Trainers for its sublime fur.
        It does not keep a nest.
      fr: |-
        Les femmes Dresseurs raffolent
        de sa sublime fourrure. Il ne
        possède pas de nid.
    black-2:
      en: |-
        The reason it does not have a nest
        is that it simply searches for a clean,
        comfortable place then sleeps there.
    white-2:
      en: |-
        The reason it does not have a nest
        is that it simply searches for a clean,
        comfortable place then sleeps there.
    x:
      ja-Hrkt: |-
        きたない　ばしょが　だいきらい。
        いごこちの　よい　ばしょで
        いつも　けなみを　ていれしている。
      ja: |-
        汚い　場所が　大嫌い。
        居心地の　良い　場所で
        いつも　毛並みを　手入れしている。
      ko: |-
        더러운 곳을 아주 싫어한다.
        편안한 곳에서
        늘 털을 다듬고 있다.
      en: |-
        It dislikes dirty places. It often searches for a
        comfortable place in which to groom itself.
      fr: |-
        Il déteste la saleté et passe son temps à entretenir
        sa fourrure, confortablement installé.
      de: |-
        Hasst schmutzige Orte. Behagt ihm ein Platz,
        fängt es sofort an, sein glänzendes Fell zu pflegen.
      es: |-
        No soporta los lugares sucios. Le encanta acicalarse
        el pelaje cuando está a gusto en un sitio.
      it: |-
        Detesta gli ambienti sporchi. Se ne sta sempre
        ad allisciarsi la pelliccia in luoghi accoglienti.
    'y':
      ja-Hrkt: |-
        うつくしい　けなみを　もち
        じょせいトレーナーに　だいにんき。
        きまった　すみかを　もたない。
      ja: |-
        美しい　毛並みを　持ち
        女性トレーナーに　大人気。
        決まった　住処を　持たない。
      ko: |-
        아름다운 털을 가지고 있어서 여성
        트레이너들에게 매우 인기 있다.
        정해진 거처를 갖고 있지 않다.
      en: |-
        It is highly popular among female Trainers for its
        sublime fur. It does not keep a nest.
      fr: |-
        Les femmes Dresseurs raffolent de sa sublime
        fourrure. Il ne possède pas de nid.
      de: |-
        Dieses Pokémon ist bei weiblichen Trainern
        aufgrund seines Fells beliebt.
      es: |-
        Tiene mucho éxito entre las Entrenadoras por su suave
        pelaje. No vive en un sitio fijo.
      it: |-
        Ha successo fra gli Allenatori di sesso femminile per
        la sua bellissima pelliccia. Non ha una tana fissa.
    omega-ruby:
      ja-Hrkt: |-
        マイペースで　じゆうきままな　くらしを　このむ。
        きのむくまま　エサを　たべたり　ねむったり
        しているので　１にちの　リズムが　バラバラだ。
      ja: |-
        マイペースで　自由気ままな　暮らしを　好む。
        気の向くまま　エサを　食べたり　眠ったり
        しているので　１日の　リズムが　バラバラだ。
      ko: |-
        자기 방식대로 자유로운 삶을 즐긴다.
        마음 내키는 대로 먹이를 먹고 잠을 자기
        때문에 하루의 리듬이 제각각이다.
      en: |-
        Delcatty prefers to live an unfettered existence in which it can
        do as it pleases at its own pace. Because this Pokémon eats
        and sleeps whenever it decides, its daily routines are
        completely random.
      fr: |-
        Delcatty préfère vivre une existence sans contraintes,
        au cours de laquelle chacun pourrait faire ce qu’il veut.
        Comme ce Pokémon mange et dort quand il le décide,
        son rythme de vie est totalement aléatoire.
      de: |-
        Enekoro liebt seine Eigenständigkeit. So kann es das tun,
        was es möchte, und kann selbst das Tempo bestimmen.
        Da dieses Pokémon schläft und isst, wenn es Lust dazu hat,
        ist sein Tagesablauf eher zufälliger Natur.
      es: |-
        Delcatty prefiere llevar una vida independiente y hacer lo que
        se le antoje. Como este Pokémon come y duerme según vea
        en cada momento, no se puede decir que tenga unos hábitos
        regulares en el día a día.
      it: |-
        Delcatty preferisce vivere una vita in libertà, in cui poter
        fare ciò che più gli aggrada in base alle proprie esigenze.
        Poiché anche gli orari dei pasti e del sonno sono
        completamente liberi, la sua vita quotidiana è casuale.
    alpha-sapphire:
      ja-Hrkt: |-
        きまった　すみかを　もたずに　くらす　ポケモン。
        ほかの　ポケモンが　ねどこに　ちかよって　きても
        けっして　あらそわず　ねる　ばしょを　かえる。
      ja: |-
        決まった　すみかを　持たずに　暮らす　ポケモン。
        他の　ポケモンが　寝床に　近寄って　きても
        決して　争わず　寝る　場所を　変える。
      ko: |-
        일정한 거처 없이 생활하는 포켓몬이다.
        다른 포켓몬이 잠자리에 가까이 다가와도
        절대 다투지 않고 이동하여 잔다.
      en: |-
        Delcatty sleeps anywhere it wants without keeping a permanent
        nest. If other Pokémon approach it as it sleeps, this Pokémon
        will never fight—it will just move away somewhere else.
      fr: |-
        Delcatty peut dormir n’importe où. Il n’a pas de nid
        permanent. Lorsque d’autres Pokémon lui cherchent
        des noises pendant son sommeil, il ne répond pas et
        se contente de partir dormir ailleurs.
      de: |-
        Enekoro schläft dort, wo es ihm gefällt und hat kein
        dauerhaftes Nest. Nähern sich ihm andere Pokémon,
        wenn es schläft, kämpft es nicht mit ihnen, sondern
        zieht weiter.
      es: |-
        Delcatty duerme en cualquier lugar sin tener que mantener el
        nido en un mismo sitio. Si otro Pokémon se le acerca mientras
        duerme, no se pondrá a luchar con él; simplemente se irá a
        otro sitio.
      it: |-
        Delcatty dorme dove più gli aggrada senza mai una dimora
        fissa. Se gli si avvicinano altri Pokémon, Delcatty non lotta
        mai, ma leva le tende e si sposta da un’altra parte.
