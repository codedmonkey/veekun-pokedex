alcremie:
  base_happiness: 50
  capture_rate: 100
  color: white
  egg_groups:
    - fairy
    - indeterminate
  evolution_chain: milcery
  evolves_from: milcery
  flavor_text:
    sword:
      ja-Hrkt: |-
        しんらいする　トレーナーには
        クリームで　デコレーションした
        きのみを　ふるまって　くれるのだ。
      ja: |-
        信頼する　トレーナーには
        クリームで　デコレーションした
        木の実を　ふるまって　くれるのだ。
      ko: |-
        믿을 수 있는 트레이너에게는
        크림으로 데코레이션한
        나무열매를 대접한다.
      zh-Hant: |-
        牠會把自己用鮮奶油
        裝飾過的樹果送給
        自己信任的訓練家。
      zh-Hans: |-
        它会把自己用鲜奶油
        装饰过的树果送给
        自己信任的训练家。
      en: |-
        When it trusts a Trainer, it will treat them to
        berries it’s decorated with cream.
      fr: |-
        Il offre aux Dresseurs auxquels il accorde
        toute sa confiance des Baies décorées
        avec de la crème.
      de: |-
        Es macht einem Trainer, dem es vertraut, mit
        Beeren samt Sahnedekoration eine Freude.
      es: |-
        Obsequia bayas decoradas con nata a aquellos
        Entrenadores en los que confía.
      it: |-
        Agli Allenatori di cui si fida regala bacche
        decorate con la panna.
    shield:
      ja-Hrkt: |-
        てから　うみだす　クリームは
        マホイップが　しあわせなとき
        あまみと　コクが　ふかまる。
      ja: |-
        手から　生みだす　クリームは
        マホイップが　幸せなとき
        甘味と　コクが　深まる。
      ko: |-
        손에서 나오는 크림은
        마휘핑이 행복할 때
        단맛과 감칠맛이 깊어진다.
      zh-Hant: |-
        當牠感到幸福的時候，
        手中產生出的鮮奶油
        會變得更加香濃甜美。
      zh-Hans: |-
        当它感到幸福的时候，
        手中产生出的鲜奶油
        会变得更加香浓甜美。
      en: |-
        When Alcremie is content, the cream it
        secretes from its hands becomes sweeter
        and richer.
      fr: |-
        Quand il est heureux, la crème qu’il produit
        avec ses mains devient plus sucrée
        et plus onctueuse.
      de: |-
        Die Sahne, die Pokusan aus seinen Händen
        hervorbringt, wird noch süßer und intensiver
        im Geschmack, wenn es glücklich ist.
      es: |-
        La nata que le brota de las manos es más dulce
        y sustanciosa cuando está feliz.
      it: |-
        La panna che Alcremie produce dalle mani
        è più dolce e gustosa quando è felice.
