wooloo:
  base_happiness: 50
  capture_rate: 255
  color: white
  egg_groups:
    - ground
  evolution_chain: wooloo
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        パーマの　かかった　たいもうは
        たかい　クッションせいが　ある。
        がけから　おちても　へっちゃら。
      ja: |-
        パーマの　かかった　体毛は
        高い　クッション性が　ある。
        崖から　落ちても　へっちゃら。
      ko: |-
        곱슬곱슬한 털은
        훌륭한 쿠션 역할을 한다.
        절벽에서 떨어져도 아무렇지도 않다.
      zh-Hant: |-
        捲捲的體毛彈性十足。
        就算從懸崖上掉下去，
        也不會受傷。
      zh-Hans: |-
        卷卷的体毛弹性十足。
        就算从悬崖上掉下去，
        也不会受伤。
      en: |-
        Its curly fleece is such an effective cushion that
        this Pokémon could fall off a cliff and stand right
        back up at the bottom, unharmed.
      fr: |-
        Son pelage frisé est doux et rebondi comme
        un coussin. Une telle toison le protègerait
        même s’il chutait d’une falaise.
      de: |-
        Sein stark gelocktes Fell hat eine sehr polsternde
        Wirkung. Selbst eine Klippe hinunterzufallen
        macht ihm nichts aus.
      es: |-
        Su lana rizada es tan acolchada que no se hace
        daño ni aunque se caiga por un precipicio.
      it: |-
        Il suo vello riccioluto gli fornisce una perfetta
        imbottitura. Non si farebbe nulla nemmeno
        cadendo da un precipizio.
    shield:
      ja-Hrkt: |-
        けが　のびすぎると　うごけない。
        ウールーの　たいもうで　おられた
        ぬのは　おどろくほど　じょうぶ。
      ja: |-
        毛が　伸びすぎると　動けない。
        ウールーの　体毛で　織られた
        布は　驚くほど　丈夫。
      ko: |-
        털이 많이 자라면 움직이지 못한다.
        우르의 털로 짠 천은
        놀라울 정도로 튼튼하다.
      zh-Hant: |-
        要是身上的毛長得太長就會
        不能動彈。用毛辮羊的體毛
        織成的布結實得讓人吃驚。
      zh-Hans: |-
        要是身上的毛长得太长就会
        不能动弹。用毛辫羊的体毛
        织成的布结实得让人吃惊。
      en: |-
        If its fleece grows too long, Wooloo won’t be
        able to move. Cloth made with the wool of this
        Pokémon is surprisingly strong.
      fr: |-
        Si ses poils poussent trop, il ne peut plus bouger.
        Les étoffes tissées avec son pelage
        sont étonnamment solides.
      de: |-
        Werden seine Haare zu lang, kann es sich nicht
        mehr bewegen. Der aus Wollys Wolle gewobene
        Stoff ist unglaublich robust.
      es: |-
        Si le crece el pelo demasiado, no puede
        moverse. Las telas confeccionadas con lana de
        Wooloo son sorprendentemente resistentes.
      it: |-
        Se gli cresce troppo il pelo, non riesce più a
        muoversi. Il tessuto fatto con la sua lana è
        sorprendentemente resistente.
