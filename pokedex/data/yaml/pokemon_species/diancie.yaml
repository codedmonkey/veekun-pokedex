diancie:
  base_happiness: 50
  capture_rate: 3
  color: pink
  egg_groups:
    - no-eggs
  evolution_chain: diancie
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        メレシーの　とつぜんへんい。
        ピンクいろに　かがやく　からだは
        せかいいち　うつくしいと　いわれる。
      ja: |-
        メレシーの　突然変異。
        ピンク色に　輝く　体は
        世界一　美しいと　言われる。
      ko: |-
        멜리시의 돌연변이다.
        분홍빛으로 빛나는 몸은
        세계에서 가장 아름답다고 일컬어진다.
      en: |-
        A sudden transformation of Carbink,
        its pink, glimmering body is said to be
        the loveliest sight in the whole world.
      fr: |-
        Ce Pokémon est une mutation spontanée de Strassie.
        Son corps rose et luisant est d’une beauté
        incomparable.
      de: |-
        Dieses Pokémon ist eine Mutation von Rocara.
        Sein rosafarben schimmernder Körper gilt als
        schönster Anblick überhaupt.
      es: |-
        Es una transformación súbita de Carbink. Se dice que
        su cuerpo, que irradia destellos rosados, es lo más
        bonito de este mundo.
      it: |-
        Questo Pokémon è una mutazione inaspettata di
        Carbink. Alcuni ritengono che il suo corpo rosa
        splendente sia la cosa più bella del mondo.
    'y':
      ja-Hrkt: |-
        りょうての　すきまで　くうきちゅうの
        たんそを　あっしゅくして　たくさんの
        ダイヤを　いっしゅんで　うみだす。
      ja: |-
        両手の　すきまで　空気中の　炭素を
        圧縮して　たくさんの　ダイヤを
        一瞬で　生み出す。
      ko: |-
        양손의 틈으로 공기 중의
        탄소를 압축하여 많은
        다이아를 한순간에 만들어 낸다.
      en: |-
        It can instantly create many diamonds
        by compressing the carbon in the air
        between its hands.
      fr: |-
        Il peut créer une multitude de diamants en un instant
        en serrant ses mains, simplement en compressant
        les molécules de carbone contenues dans l’air.
      de: |-
        Es kann im Nu viele Diamanten erzeugen, indem es
        luftgebundene Kohlenstoffpartikel mit seinen Händen
        komprimiert.
      es: |-
        Puede crear una gran cantidad de diamantes en un
        instante comprimiendo con las manos el carbono que
        flota en el aire.
      it: |-
        È in grado di creare una grande quantità di diamanti
        in un istante comprimendo tra le mani il carbonio
        presente nell’aria.
