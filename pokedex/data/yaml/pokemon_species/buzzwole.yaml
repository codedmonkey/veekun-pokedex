buzzwole:
  base_happiness: 0
  capture_rate: 45
  color: red
  egg_groups:
    - no-eggs
  evolution_chain: buzzwole
  evolves_from: ~
  flavor_text:
    sun:
      ja-Hrkt: |-
        べつせかいから　あらわれた　ＵＢ。
        みずからの　からだを　みせつけてくるが
        じまんなのか　いかくなのか　ふめい。
      ja: |-
        別世界から　現れた　ＵＢ。
        自らの　身体を　みせつけてくるが
        自慢なのか　いかくなのか　不明。
      ko: |-
        다른 세계에서 나타난 UB이다.
        스스로 몸을 보여주는 행동이
        자랑인지 위협인지 알 수 없다.
      zh-Hant: |-
        來自另一個世界的ＵＢ。
        會主動向人展示自己的身體，
        但不知道是想要自豪還是威嚇。
      zh-Hans: |-
        从其他世界出现的究极异兽。
        会向人展现自己的身体，
        但不知道是出于自豪还是威吓。
      en: |-
        This Ultra Beast appeared from another world.
        It shows off its body, but whether that display
        is a boast or a threat remains unclear.
      fr: |-
        Personne ne sait si cette Ultra-Chimère venue
        d’un autre monde montre ses muscles pour être
        admirée ou pour intimider ceux qu’elle rencontre.
      de: |-
        Eine Ultrabestie aus einer anderen Welt.
        Niemand weiß, ob sie ihren Körper aus Stolz
        oder zur Abschreckung stählt.
      es: |-
        Un Ultraente procedente de otro mundo. Se
        desconoce si exhibe su robusto cuerpo a modo
        de amenaza o para que lo admiren.
      it: |-
        È un’Ultracreatura arrivata da un altro mondo.
        Esibisce i propri muscoli, ma non è chiaro se
        lo faccia per orgoglio o a scopo intimidatorio.
    moon:
      ja-Hrkt: |-
        なぞの　せいぶつ　ＵＢ。　いっぱつの
        パンチで　ダンプカーを　ふんさいする
        こうけいが　もくげき　された。
      ja: |-
        謎の　生物　ＵＢ。　一発の
        パンチで　ダンプカーを　粉砕する
        光景が　目撃　された。
      ko: |-
        정체불명의 생물 UB. 한 방의
        펀치로 덤프트럭을 분쇄하는
        광경이 목격되었다.
      zh-Hant: |-
        謎一般的生物──ＵＢ。
        被目擊到了一拳把大卡車
        打得粉碎的情景。
      zh-Hans: |-
        谜一般的生物究极异兽。
        被目击到了一拳把翻斗车
        打得粉碎的光景。
      en: |-
        A mysterious life-form called an Ultra Beast.
        Witnesses saw it pulverize a dump truck with a
        single punch.
      fr: |-
        L’une des mystérieuses Ultra-Chimères.
        On l’aurait aperçue réduisant un camion à benne
        en miettes d’un seul coup de poing.
      de: |-
        Eine rätselhafte Ultrabestie, die angeblich mit
        einem einzigen Schlag einen beladenen Laster
        pulverisieren kann.
      es: |-
        Un Ultraente rodeado de misterio. Se le ha visto
        reducir a añicos un camión de un solo puñetazo.
      it: |-
        È una delle misteriose forme di vita note come
        Ultracreature ed è stata vista ridurre in frantumi
        un camion con un solo pugno.
    ultra-sun:
      ja-Hrkt: |-
        このせかいでは　いしつで　きけんだが
        ほんらい　すんでいる　せかいでは
        ふつうに　みかける　せいぶつらしい。
      ja: |-
        この世界では　異質で　危険だが
        本来　棲んでいる　世界では
        普通に　見かける　生物らしい。
      ko: |-
        이 세계와는 성질이 다르고
        위험하지만 원래 살던 세계에서는
        흔히 볼 수 있는 생물인 듯하다.
      zh-Hant: |-
        在這個世界是危險的異類，
        但在原本棲息的世界裡，
        牠似乎是常見的普通生物。
      zh-Hans: |-
        在这个世界是异类，很危险，
        但在它原本栖息的世界，
        好像只是寻常能见的生物。
      en: |-
        Although it’s alien to this world and a danger
        here, it’s apparently a common organism in the
        world where it normally lives.
      fr: |-
        Cette créature venue d’ailleurs est dangereuse
        dans notre monde, mais il semblerait qu’elle soit
        très commune dans le sien.
      de: |-
        In dieser Welt wirkt es gefährlich und
        fremdartig, doch in seiner ursprünglichen Welt
        ist es ein ganz gewöhnliches Lebewesen.
      es: |-
        Para los seres de este mundo resulta extraño
        y peligroso, pero en el mundo del que procede
        es una criatura muy común.
      it: |-
        Nel nostro mondo il suo aspetto appare strano
        e minaccioso, ma sembra che in quello da cui
        proviene sia una creatura molto comune.
    ultra-moon:
      ja-Hrkt: |-
        いじょうな　までに　ぼうちょうする
        きんにくを　みせつけてきた。
        ウルトラビーストの　いっしゅ。
      ja: |-
        異常な　までに　膨張する
        筋肉を　見せつけてきた。
        ウルトラビーストの　一種。
      ko: |-
        이상할 정도로 팽창하는
        근육을 자랑한다.
        울트라비스트의 일종.
      zh-Hant: |-
        會向對手炫耀自己
        膨脹到異常程度的肌肉。
        是究極異獸的一種。
      zh-Hans: |-
        会炫耀膨胀到异常程度的肌肉。
        是究极异兽中的一种。
      en: |-
        Buzzwole goes around showing off its
        abnormally swollen muscles. It is one kind
        of Ultra Beast.
      fr: |-
        Ce type d’Ultra-Chimère adore exhiber
        ses muscles gonflés à l’extrême.
      de: |-
        Diese Ultrabestie stellt gerne ihre extrem
        angeschwollenen Muskeln stolz zur Schau.
      es: |-
        Uno de los Ultraentes. Posee una musculatura
        excesivamente desarrollada.
      it: |-
        Una delle Ultracreature. Non fa che mettere in
        mostra i propri muscoli esageratamente gonfi.
