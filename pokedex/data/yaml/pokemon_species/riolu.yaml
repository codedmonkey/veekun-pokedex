riolu:
  base_happiness: 50
  capture_rate: 75
  color: blue
  egg_groups:
    - no-eggs
  evolution_chain: riolu
  evolves_from: ~
  flavor_text:
    diamond:
      en: |-
        The aura that emanates from its
        body intensifies to alert others
        if it is afraid or sad.
    pearl:
      en: |-
        Its body is lithe yet powerful.
        It can crest three mountains and
        cross two canyons in one night.
    platinum:
      en: |-
        It has the peculiar power of being
        able to see emotions such as joy
        and rage in the form of waves.
    heartgold:
      en: |-
        They communicate with one another
        using their auras. They are able to run
        all through the night.
    soulsilver:
      en: |-
        They communicate with one another
        using their auras. They are able to run
        all through the night.
    black:
      en: |-
        It has the peculiar power of being
        able to see emotions such as joy
        and rage in the form of waves.
      fr: |-
        Il a la faculté unique de visualiser
        les émotions telles que la joie ou
        la colère sous forme d’ondes.
    white:
      en: |-
        It has the peculiar power of being
        able to see emotions such as joy
        and rage in the form of waves.
      fr: |-
        Il a la faculté unique de visualiser
        les émotions telles que la joie ou
        la colère sous forme d’ondes.
    black-2:
      en: |-
        It uses the shapes of auras,
        which change according to emotion,
        to communicate with others.
    white-2:
      en: |-
        It uses the shapes of auras,
        which change according to emotion,
        to communicate with others.
    x:
      ja-Hrkt: |-
        かんじょうで　かたちが　かわる
        はどうを　だしあって　なかまどうし
        コミュニケーションを　とっている。
      ja: |-
        感情で　形が　変わる
        波動を　だしあって　仲間同士
        コミュニケーションを　とっている。
      ko: |-
        감정에 따라 모양이 변하는
        파동을 서로 내어 동료끼리
        커뮤니케이션을 취하고 있다.
      en: |-
        It uses the shapes of auras, which change
        according to emotion, to communicate with others.
      fr: |-
        Il communique avec ses semblables grâce à des
        ondes qui sont modulées en fonction de ses
        émotions.
      de: |-
        Es kommuniziert mit seinen Artgenossen über Wellen,
        die je nach Gefühlslage eine andere Form annehmen.
      es: |-
        Se comunica con los suyos mediante la emisión de
        unas ondas que cambian de forma en función de los
        sentimientos.
      it: |-
        Comunica con i suoi simili tramite delle onde che
        cambiano forma a seconda del sentimento che prova.
    'y':
      ja-Hrkt: |-
        からだから　はっする　はどうは
        こわいとき　かなしいときに　つよまり
        ピンチを　なかまに　つたえる。
      ja: |-
        体から　発する　波動は
        怖いとき　悲しいときに　強まり
        ピンチを　仲間に　伝える。
      ko: |-
        몸에서 발산되는 파동은
        무서울 때나 슬플 때에 강해져
        동료에게 위기를 알린다.
      en: |-
        The aura that emanates from its body intensifies to
        alert others if it is afraid or sad.
      fr: |-
        Son aura s’intensifie pour prévenir son entourage
        quand il a peur ou qu’il est triste.
      de: |-
        Die Aura, die dieses Pokémon umgibt, verstärkt sich,
        wenn es zeigen will, dass es ängstlich oder traurig ist.
      es: |-
        Su aura se intensifica para alertar a otros cuando está
        triste o tiene miedo.
      it: |-
        L’aura che emana si intensifica per comunicare agli
        altri se è triste o spaventato.
    omega-ruby:
      ja-Hrkt: |-
        かんじょうで　かたちが　かわる
        はどうを　だしあって　なかまどうし
        コミュニケーションを　とっている。
      ja: |-
        感情で　形が　変わる
        波動を　だしあって　仲間同士
        コミュニケーションを　とっている。
      ko: |-
        감정에 따라 모양이 변하는
        파동을 서로 내어 동료끼리
        커뮤니케이션을 취하고 있다.
      en: |-
        It uses the shapes of auras, which change
        according to emotion, to communicate with others.
      fr: |-
        Il communique avec ses semblables grâce à des ondes
        qui sont modulées en fonction de ses émotions.
      de: |-
        Es kommuniziert mit seinen Artgenossen über Wellen,
        die je nach Gefühlslage eine andere Form annehmen.
      es: |-
        Se comunica con los suyos mediante la emisión de unas
        ondas que cambian de forma en función de los sentimientos.
      it: |-
        Comunica con i suoi simili tramite delle onde che cambiano
        forma a seconda del sentimento che prova.
    alpha-sapphire:
      ja-Hrkt: |-
        からだから　はっする　はどうは
        こわいとき　かなしいときに　つよまり
        ピンチを　なかまに　つたえる。
      ja: |-
        体から　発する　波動は
        怖いとき　悲しいときに　強まり
        ピンチを　仲間に　伝える。
      ko: |-
        몸에서 발산되는 파동은
        무서울 때나 슬플 때에 강해져
        동료에게 위기를 알린다.
      en: |-
        The aura that emanates from its body intensifies to
        alert others if it is afraid or sad.
      fr: |-
        Son aura s’intensifie pour prévenir son entourage quand
        il a peur ou qu’il est triste.
      de: |-
        Die Aura, die dieses Pokémon umgibt, verstärkt sich,
        wenn es zeigen will, dass es ängstlich oder traurig ist.
      es: |-
        Su aura se intensifica para alertar a otros cuando está triste
        o tiene miedo.
      it: |-
        L’aura che emana si intensifica per comunicare agli altri
        se è triste o spaventato.
    sun:
      ja-Hrkt: |-
        ひとや　ポケモンの　かんじょうや
        しぜんの　ようすを　はどう　という
        なみの　かたちで　みているのだ。
      ja: |-
        人や　ポケモンの　感情や
        自然の　様子を　波動　という
        波の　形で　みているのだ。
      ko: |-
        사람과 포켓몬의 감정이나
        자연의 상태를 파동이라는
        파장의 형태로 느낀다.
      zh-Hant: |-
        以「波導」這種波的形式
        觀察人和寶可夢的感情，
        以及自然的樣子。
      zh-Hans: |-
        以“波导”这种波的形式
        观察人和宝可梦的感情，
        以及自然的样子。
      en: |-
        It can discern the physical and emotional states
        of people, Pokémon, and other natural things
        from the shape of their aura waves.
      fr: |-
        Il perçoit sous forme d’ondes les émotions
        des humains et des Pokémon, ainsi que tout ce
        qui l’entoure.
      de: |-
        Es sieht sowohl die Gefühle von Menschen
        und Pokémon als auch die ihn umgebende Natur
        in Form von Wellen, die Aura genannt werden.
      es: |-
        Percibe en forma de ondas las emociones de
        Pokémon y humanos.
      it: |-
        È in grado di percepire la natura e le emozioni
        di Pokémon ed esseri umani sotto forma di onde.
    moon:
      ja-Hrkt: |-
        ひとばんじゅう　はしっていられる
        タフさが　あり　がんばりや　だが
        まだまだ　ひよっこ　なのだ。
      ja: |-
        一晩中　走っていられる
        タフさが　あり　頑張り屋　だが
        まだまだ　ひよっ子　なのだ。
      ko: |-
        밤새 달릴 수 있는 지구력을
        갖고 있고 노력가지만
        아직 햇병아리다.
      zh-Hant: |-
        能跑整整一晚上，
        是非常堅毅努力的傢伙，
        不過仍然是毛頭小子。
      zh-Hans: |-
        能跑整整一晚上，
        是非常坚毅勤奋的家伙，
        不过仍然是毛头小子。
      en: |-
        It’s tough enough to run right through the night,
        and it’s also a hard worker, but it’s still just
        a youngster.
      fr: |-
        Comme il peut passer la nuit entière à courir,
        il paraît très robuste et persévérant, mais
        au fond, c’est encore un bébé.
      de: |-
        Dieses junge Pokémon ist bereits so robust und
        willensstark, dass es die ganze Nacht hindurch
        rennen kann.
      es: |-
        Es un Pokémon valiente y perseverante
        capaz de pasarse toda una noche corriendo,
        aunque en el fondo no es más que un bebé.
      it: |-
        Pur essendo così piccolo, ha un’incredibile
        energia che gli permette di correre anche per
        una notte intera.
    ultra-sun:
      ja-Hrkt: |-
        はどうと　よばれる　なみを　みて
        ひとや　ポケモンの　きもちを　しる。
        きけんな　あいてには　ちかづかない。
      ja: |-
        波動と　呼ばれる　波を　見て
        人や　ポケモンの　気持ちを　知る。
        危険な　相手には　近付かない。
      ko: |-
        파동이라고 불리는 파를 보면
        사람과 포켓몬의 마음을 알 수 있다.
        위험한 상대에게는 다가가지 않는다.
      zh-Hant: |-
        能夠看見被稱為波導的波動，
        藉此探知人和寶可夢的心情。
        不會靠近危險的對手。
      zh-Hans: |-
        能看见被称为波导的一种波，
        感知人和宝可梦的心情。
        不会靠近危险的对手。
      en: |-
        It knows how people and Pokémon feel by
        looking at their auras. It doesn’t approach
        dangerous opponents.
      fr: |-
        Il peut détecter les émotions des humains et
        des Pokémon grâce à leur aura. Il ne s’approche
        pas des individus qu’il juge dangereux.
      de: |-
        Durch Wellen, die Aura genannt werden, kann es
        die Gefühle von Menschen und Pokémon lesen.
        Von bedrohlichen Gegnern hält es sich fern.
      es: |-
        Percibe en forma de ondas las emociones de
        Pokémon y humanos, y jamás se acerca a quien
        le da la sensación de ser peligroso.
      it: |-
        È in grado di percepire le emozioni di Pokémon
        ed esseri umani attraverso la loro aura. Si tiene
        alla larga dagli avversari pericolosi.
    ultra-moon:
      ja-Hrkt: |-
        なかまとの　コミュニケーションに
        はどうと　よばれる　なみを　つかう。
        なかないので　てきに　ばれないのだ。
      ja: |-
        仲間との　コミュニケーションに
        波動と　呼ばれる　波を　使う。
        鳴かないので　敵に　ばれないのだ。
      ko: |-
        동료와의 커뮤니케이션에
        파동이라 불리는 파장을 사용한다.
        울지 않아서 적에게 들키지 않는다.
      zh-Hant: |-
        會使用一種被稱為波導的波
        來與夥伴溝通。因為不用發出聲音，
        所以不會被敵人發現。
      zh-Hans: |-
        会使用一种叫做波导的波
        来和伙伴交流。由于交流时无需鸣叫，
        因此不会被敌人发现。
      en: |-
        It uses waves called auras to communicate with
        others of its kind. It doesn’t make any noise
        during this time, so its enemies can’t detect it.
      fr: |-
        Il se sert d’auras pour communiquer avec
        les siens. Ses ennemis ne peuvent pas espionner
        ses conversations, car il n’émet aucun son.
      de: |-
        Es kommuniziert mit seinen Artgenossen über
        Wellen, die man Aura nennt. So verständigt es
        sich lautlos und bleibt Gegnern verborgen.
      es: |-
        En lugar de usar la voz, se comunica con los
        demás mediante ondas conocidas como auras
        y así pasa desapercibido ante sus enemigos.
      it: |-
        Comunica con i suoi simili usando onde definite
        “aura” senza emettere alcun verso, riuscendo
        così a non farsi intercettare dai nemici.
    sword:
      ja-Hrkt: |-
        ひとばんじゅう　はしっていられる
        スタミナを　もつ。　かっぱつで
        さんぽの　あいては　たいへん。
      ja: |-
        一晩中　走っていられる
        スタミナを　もつ。　活発で
        散歩の　相手は　たいへん。
      ko: |-
        밤새 달릴 수 있을 정도의
        체력을 가졌다. 활발해서
        같이 산책하는 상대에겐 고역이다.
      zh-Hant: |-
        精力充沛，可以奔跑一整夜。
        由於牠十分活潑，
        帶牠散步的人非常辛苦。
      zh-Hans: |-
        精力充沛，可以奔跑一整夜。
        由于它十分活泼，
        带它散步的人非常辛苦。
      en: |-
        It’s exceedingly energetic, with enough stamina
        to keep running all through the night. Taking it
        for walks can be a challenging experience.
      fr: |-
        Il possède assez d’endurance pour passer
        des nuits entières à courir. Il est difficile de partir
        en balade avec lui tant il déborde d’énergie.
      de: |-
        Es besitzt so viel Ausdauer, dass es die ganze
        Nacht rennen könnte. Wer mit ihm spazieren
        gehen will, kann nur schwer mit ihm Schritt halten.
      es: |-
        Su gran resistencia le permite correr durante toda
        una noche sin problema, pero tanta energía hace
        que sea sumamente complicado seguirle el ritmo.
      it: |-
        Ha una grande resistenza e una gran vitalità,
        tanto che può correre anche per una notte intera.
        Durante le passeggiate non è facile stargli dietro.
    shield:
      ja-Hrkt: |-
        あいての　かんじょう　だけでなく
        しぜんの　ようすも　はどう　という
        なみの　かたちで　かんじとる。
      ja: |-
        相手の　感情　だけでなく
        自然の　様子も　波動　という
        波の　形で　感じとる。
      ko: |-
        상대의 감정뿐만 아니라
        자연의 상태도 파동이라는
        파장의 형태로 느낀다.
      zh-Hant: |-
        除了能讀懂對手的感情，
        也能以「波導」這種形式的波
        來觀察大自然的樣子。
      zh-Hans: |-
        除了能读懂对手的感情，
        也能以“波导”这种形式的波
        来观察大自然的样子。
      en: |-
        It can use waves called auras to gauge how
        others are feeling. These same waves can also tell
        this Pokémon about the state of the environment.
      fr: |-
        Il perçoit sous forme d’aura non seulement
        les sentiments des autres, mais aussi l’état
        de la nature.
      de: |-
        Es erspürt nicht nur die Gefühle anderer, sondern
        auch den Zustand der Natur durch Wellen, die
        Aura genannt werden.
      es: |-
        Percibe los sentimientos de quienes lo rodean,
        así como las condiciones del entorno, mediante
        unas ondas conocidas como auras.
      it: |-
        Percepisce non solo le emozioni degli altri,
        ma anche le condizioni dell’ambiente naturale
        sotto forma di onde definite “aura”.
    legends-arceus:
      en: |-
        Though infantile in appearance, it has the mysterious ability to
        read the minds of humans. The pure of heart are met with
        Riolu's approval, while those of ill nature earn only its loathing.
