electrike:
  base_happiness: 50
  capture_rate: 120
  color: green
  egg_groups:
    - ground
  evolution_chain: electrike
  evolves_from: ~
  flavor_text:
    ruby:
      en: |-
        ELECTRIKE stores electricity in its
        long body hair. This POKéMON stimulates
        its leg muscles with electric charges.These jolts of power give its legs
        explosive acceleration performance.
    sapphire:
      en: |-
        ELECTRIKE runs faster than the human
        eye can follow. The friction from
        running is converted into electricity,which is then stored in this POKéMON’s
        fur.
    emerald:
      en: |-
        It generates electricity using friction
        from the atmosphere. In seasons with
        especially arid air, its entire body blazes
        with violent showers of sparks.
    firered:
      en: |-
        It stores static electricity in its fur
        for discharging. It gives off sparks if a
        storm approaches.
    leafgreen:
      en: |-
        It stores static electricity in its fur
        for discharging. It gives off sparks if a
        storm approaches.
    diamond:
      en: |-
        Using electricity stored in its fur,
        it stimulates its muscles to
        heighten its reaction speed.
    pearl:
      en: |-
        Using electricity stored in its fur,
        it stimulates its muscles to
        heighten its reaction speed.
    platinum:
      en: |-
        Using electricity stored in its fur,
        it stimulates its muscles to
        heighten its reaction speed.
    heartgold:
      en: |-
        It stores electricity in its fur. It
        gives off sparks from all over its
        body in seasons when the air is dry.
    soulsilver:
      en: |-
        It stores electricity in its fur. It
        gives off sparks from all over its
        body in seasons when the air is dry.
    black:
      en: |-
        Using electricity stored in its fur,
        it stimulates its muscles to
        heighten its reaction speed.
      fr: |-
        Il améliore ses réflexes en
        stimulant ses muscles grâce à 
        l’électricité dans sa fourrure.
    white:
      en: |-
        Using electricity stored in its fur,
        it stimulates its muscles to
        heighten its reaction speed.
      fr: |-
        Il améliore ses réflexes en
        stimulant ses muscles grâce à 
        l’électricité dans sa fourrure.
    black-2:
      en: |-
        Using electricity stored in its fur,
        it stimulates its muscles to
        heighten its reaction speed.
    white-2:
      en: |-
        Using electricity stored in its fur,
        it stimulates its muscles to
        heighten its reaction speed.
    x:
      ja-Hrkt: |-
        たいもうに　ためた　でんきを　つかい
        きんにくを　しげきすることで
        しゅんぱつりょくを　たかめる。
      ja: |-
        体毛に　ためた　電気を　使い
        筋肉を　刺激することで
        瞬発力を　高める。
      ko: |-
        털에 모은 전기를 써서
        근육을 자극함으로써
        순발력을 높인다.
      en: |-
        Using electricity stored in its fur, it stimulates its
        muscles to heighten its reaction speed.
      fr: |-
        Il améliore ses réflexes en stimulant ses muscles
        grâce à l’électricité dans sa fourrure.
      de: |-
        Die Elektrizität, die es im Fell speichert, nutzt es,
        um seine Muskeln zu stimulieren.
      es: |-
        Estimula sus músculos y aumenta sus reflejos con la
        electricidad que almacena su pelaje.
      it: |-
        L’elettricità immagazzinata nella pelliccia gli stimola
        i muscoli e aumenta la sua velocità di reazione.
    'y':
      ja-Hrkt: |-
        せいでんきを　たいもうに　たくわえて
        ほうでんする。あらしが　ちかづくと
        ぜんしんから　ひばなを　ちらす。
      ja: |-
        静電気を　体毛に　たくわえて
        放電する。嵐が　近づくと
        全身から　火花を　散らす。
      ko: |-
        정전기를 털에 비축하여
        방전한다. 폭풍이 가까이 오면
        온몸에서 불꽃을 튀긴다.
      en: |-
        It stores static electricity in its fur for discharging.
        It gives off sparks if a storm approaches.
      fr: |-
        Dynavolt stocke de l’électricité statique dans sa
        fourrure. Il produit des étincelles lorsque le temps
        devient orageux.
      de: |-
        In seinem Fell speichert es statische Elektrizität für
        spätere Entladungen. Braut sich ein Sturm zusammen,
        entlädt es Funken.
      es: |-
        Acumula electricidad estática en el pelaje para lanzar
        descargas. Cuando va a haber tormenta, suelta
        chispas.
      it: |-
        Accumula elettricità statica nella pelliccia, che poi
        scarica. Se si avvicina una tempesta, lo si vede
        scintillare.
    omega-ruby:
      ja-Hrkt: |-
        ながい　たいもうに　でんきを　ためている。
        でんりゅうで　あしの　きんにくを　しげきして
        ばくはつてきな　しゅんぱつりょくを　うみだす。
      ja: |-
        長い　体毛に　電気を　ためている。
        電流で　足の　筋肉を　刺激して
        爆発的　瞬発力を　生み出す。
      ko: |-
        긴 털에 전기를 모으고 있다.
        전류로 다리 근육을 자극하여
        폭발적인 순발력을 낸다.
      en: |-
        Electrike stores electricity in its long body hair. This Pokémon
        stimulates its leg muscles with electric charges. These jolts of
        power give its legs explosive acceleration performance.
      fr: |-
        Dynavolt stocke de l’électricité dans les poils de son corps
        allongé. Ce Pokémon stimule les muscles de ses jambes
        avec des charges électriques, ce qui le rend capable
        d’accélérations fulgurantes.
      de: |-
        Frizelbliz speichert Elektrizität in seiner langen
        Körperbehaarung. Dieses Pokémon stimuliert seine
        Beinmuskulatur durch Stromstöße. Dadurch ist es
        in der Lage, explosiv zu beschleunigen.
      es: |-
        Electrike acumula electricidad en el largo pelaje que tiene.
        Este Pokémon estimula los músculos de las patas mediante
        descargas eléctricas. Estas explosiones de energía le permiten
        acelerar de forma increíble.
      it: |-
        Electrike accumula l’elettricità nella sua folta pelliccia.
        Stimola i muscoli degli arti inferiori con cariche elettriche,
        grazie alle quali ottiene prestazioni e accelerazioni esplosive.
    alpha-sapphire:
      ja-Hrkt: |-
        めにも　とまらぬ　スピードで　はしる　ポケモン。
        くうきの　まさつで　でんきを　はっせいさせて
        ぜんしんの　たいもうに　たくわえている。
      ja: |-
        目にも　止まらぬ　スピードで　走る　ポケモン。
        空気の　摩擦で　電気を　発生させて
        全身の　体毛に　蓄えている。
      ko: |-
        눈에 안 보이는 스피드로 달리는 포켓몬이다.
        공기의 마찰로 전기를 발생시켜
        전신의 털에 비축하고 있다.
      en: |-
        Electrike runs faster than the human eye can follow.
        The friction from running is converted into electricity,
        which is then stored in this Pokémon’s fur.
      fr: |-
        Dynavolt court tellement vite que l’œil humain ne peut pas
        le suivre. La friction générée par sa course est convertie en
        électricité, puis stockée dans la fourrure de ce Pokémon.
      de: |-
        Frizelbliz rennt so schnell, dass das menschliche Auge es nicht
        wahrnehmen kann. Die Reibung, die dabei entsteht, wandelt es
        in Elektrizität um, die es in seinem Fell speichert.
      es: |-
        Electrike corre tan rápido que escapa hasta al ojo humano.
        La fricción que se origina en la carrera se transforma en
        electricidad que almacena en el pelaje.
      it: |-
        Electrike corre più velocemente di quanto l’occhio umano
        possa percepire. L’attrito dovuto alla corsa viene trasformato
        in elettricità, accumulata poi nella pelliccia del Pokémon.
    ultra-sun:
      ja-Hrkt: |-
        くうきと　たいもうの　まさつで
        せいでんきが　はっせい。　ラクライが
        はしると　バチバチと　おとが　なる。
      ja: |-
        空気と　体毛の　摩擦で
        静電気が　発生。　ラクライが
        走ると　バチバチと　音が　鳴る。
      ko: |-
        공기와 털의 마찰로
        정전기가 발생한다. 썬더라이가
        달리면 탁탁 소리가 난다.
      zh-Hant: |-
        會透過空氣和體毛的摩擦
        來產生靜電。落雷獸奔跑時
        會發出劈哩啪啦的聲音。
      zh-Hans: |-
        通过空气与体毛的摩擦产生静电。
        落雷兽如果奔跑，
        会发出噼里啪啦的声音。
      en: |-
        Friction between the air and its fur produces
        static electricity. When Electrike runs, it makes
        a crackling sound.
      fr: |-
        La friction de ses poils avec l’air génère de
        l’électricité statique quand il court et produit
        un son qui s’apparente à des crépitements.
      de: |-
        Durch die Reibung zwischen seinem Fell und
        der Luft entsteht Elektrizität. Wenn es rennt,
        verursacht es ein knisterndes Geräusch.
      es: |-
        La fricción con el aire carga su pelaje de
        electricidad estática, por lo que pueden oírse
        crepitantes chispazos cuando corre.
      it: |-
        L’attrito fra l’atmosfera e la sua pelliccia genera
        elettricità statica e quando corre si avverte
        un crepitio.
    ultra-moon:
      ja-Hrkt: |-
        ながい　たいもうが　こすれあうことで
        ぜんしんに　せいでんきが　たまる。
        スピードが　じまんの　ポケモン。
      ja: |-
        長い　体毛が　こすれあうことで
        全身に　静電気が　たまる。
        スピードが　自慢の　ポケモン。
      ko: |-
        긴 털이 마찰하는 과정에서
        전신에 정전기가 모인다.
        스피드가 특기인 포켓몬이다.
      zh-Hant: |-
        會讓長長的體毛互相摩擦，
        藉此在全身儲存靜電。
        是種以速度為傲的寶可夢。
      zh-Hans: |-
        长长的体毛，
        通过摩擦在全身储存静电。
        是以速度为傲的宝可梦。
      en: |-
        Static electricity builds up all over its body
        as strands of its long fur rub together. This
        Pokémon boasts incredible speed.
      fr: |-
        Il est très fier de sa vitesse et peut envelopper
        son corps d’électricité statique en frottant
        ses longs poils.
      de: |-
        Durch das Aneinanderreiben seiner langen
        Haare speichert sein ganzer Körper Elektrizität.
        Es ist besonders stolz auf seine Schnelligkeit.
      es: |-
        Este Pokémon genera electricidad estática
        frotando su largo pelaje. También destaca por
        su velocidad.
      it: |-
        Accumula elettricità statica in tutto il corpo
        sfregando la folta pelliccia. Il suo punto di forza
        è la velocità.
    sword:
      ja-Hrkt: |-
        せいでんきを　たいもうに　たくわえて
        ほうでんする。　あらしが　ちかづくと
        ぜんしんから　ひばなを　ちらす。
      ja: |-
        静電気を　体毛に　たくわえて
        放電する。　嵐が　近づくと
        全身から　火花を　散らす。
      ko: |-
        정전기를 털에 비축하여
        방전한다. 폭풍이 가까이 오면
        온몸에서 불꽃을 튀긴다.
      zh-Hant: |-
        會將靜電積蓄在體毛中後放電。
        當暴風雨來臨前，
        會從全身冒出火花。
      zh-Hans: |-
        会将静电储存在体毛中进行放电。
        暴风雨临近时，会从全身散发出火花。
      en: |-
        It stores static electricity in its fur for discharging.
        It gives off sparks if a storm approaches.
      fr: |-
        Il émet des décharges à partir de l’électricité
        statique accumulée dans sa fourrure. Il produit
        des étincelles lorsque le temps devient orageux.
      de: |-
        In seinem Fell speichert es statische Elektrizität
        für spätere Entladungen. Braut sich ein Sturm
        zusammen, entlädt es Funken.
      es: |-
        Acumula electricidad estática en el pelaje para
        lanzar descargas. Cuando va a haber tormenta,
        suelta chispas por todo el cuerpo.
      it: |-
        Accumula elettricità statica nella pelliccia e poi
        la rilascia. Se si avvicina una tempesta, emette
        scintille.
    shield:
      ja-Hrkt: |-
        せいでんきを　たいもうに　ためる。
        くうきの　かんそうした　きせつには
        ぜんしんから　ひばなを　ちらす。
      ja: |-
        静電気を　体毛に　溜める。
        空気の　乾燥した　季節には
        全身から　火花を　散らす。
      ko: |-
        정전기를 털에 모은다.
        공기가 건조한 계절에는
        전신에서 스파크를 뿌린다.
      zh-Hant: |-
        會在體毛中儲存靜電。
        在空氣乾燥的季節
        會從全身散發出火花。
      zh-Hans: |-
        会在体毛中储存静电。
        在空气干燥的季节
        会从全身散发出火花。
      en: |-
        It stores electricity in its fur. It gives off sparks
        from all over its body in seasons when the air is dry.
      fr: |-
        L’électricité statique s’accumule dans sa fourrure.
        Par temps sec, elle dégage des étincelles.
      de: |-
        Es speichert statische Elektrizität in seinem Fell.
        In Jahreszeiten mit trockener Luft sprüht sein
        ganzer Körper Funken.
      es: |-
        Almacena electricidad estática en su pelaje.
        En estaciones secas, suelta chispas por todo
        el cuerpo.
      it: |-
        Accumula elettricità statica nella pelliccia. Nella
        stagione secca, il suo corpo sprizza scintille.
