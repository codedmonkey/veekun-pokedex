psyduck:
  base_happiness: 50
  capture_rate: 190
  color: yellow
  egg_groups:
    - water1
    - ground
  evolution_chain: psyduck
  evolves_from: ~
  flavor_text:
    red:
      en: |-
        While lulling its
        enemies with its
        vacant look, thiswily POKéMON will
        use psychokinetic
        powers.
    blue:
      en: |-
        While lulling its
        enemies with its
        vacant look, thiswily POKéMON will
        use psychokinetic
        powers.
    yellow:
      en: |-
        Always tormented
        by headaches.
        It uses psychicpowers, but it is
        not known if it
        intends to do so.
    gold:
      en: |-
        It has mystical
        powers but doesn't
        recall that it hasused them. That is
        why it always
        looks puzzled.
    silver:
      en: |-
        If its chronic
        headache peaks, it
        may exhibit oddpowers. It seems
        unable to recall
        such an episode.
    crystal:
      en: |-
        The only time it
        can use its psy­
        chic power is whenits sleeping brain
        cells happen to
        wake.
    ruby:
      en: |-
        PSYDUCK uses a mysterious power.
        When it does so, this POKéMON 
        generates brain waves that aresupposedly only seen in sleepers.
        This discovery spurred controversy
        among scholars.
    sapphire:
      en: |-
        If it uses its mysterious power,
        PSYDUCK can’t remember having done so.
        It apparently can’t form a memory ofsuch an event because it goes into
        an altered state that is much like
        deep sleep.
    emerald:
      en: |-
        When its headache intensifies, it starts
        using strange powers. However, it has no
        recollection of its powers, so it always
        looks befuddled and bewildered.
    firered:
      en: |-
        It is constantly wracked by a headache.
        When the headache turns intense, it begins
        using mysterious powers.
    leafgreen:
      en: |-
        While lulling its enemies with its vacant
        look, this wily POKéMON will use
        psychokinetic powers.
    diamond:
      en: |-
        If its usual headache worsens, it
        starts exhibiting odd powers. It
        can’t remember doing so, however.
    pearl:
      en: |-
        It never remembers using its
        odd powers, so it always tilts
        its head in puzzlement.
    platinum:
      en: |-
        Overwhelmed by enigmatic abilities,
        it suffers a constant headache. It
        sometimes uses mysterious powers.
    heartgold:
      en: |-
        It has mystical powers but doesn’t
        recall that it has used them.
        That is why it always looks puzzled.
    soulsilver:
      en: |-
        If its chronic headache peaks, it
        may exhibit odd powers. It seems
        unable to recall such an episode.
    black:
      en: |-
        Overwhelmed by enigmatic abilities,
        it suffers a constant headache. It
        sometimes uses mysterious powers.
      fr: |-
        Ses pouvoirs déconcertants
        et mystérieux lui font subir
        de constantes migraines.
    white:
      en: |-
        Overwhelmed by enigmatic abilities,
        it suffers a constant headache. It
        sometimes uses mysterious powers.
      fr: |-
        Ses pouvoirs déconcertants
        et mystérieux lui font subir
        de constantes migraines.
    black-2:
      en: |-
        When headaches stimulate its brain
        cells, which are usually inactive,
        it can use a mysterious power.
    white-2:
      en: |-
        When headaches stimulate its brain
        cells, which are usually inactive,
        it can use a mysterious power.
    x:
      ja-Hrkt: |-
        いつも　ずつうに　なやまされている。
        この　ずつうが　はげしくなると
        ふしぎな　ちからを　つかいはじめる。
      ja: |-
        いつも　頭痛に　悩まされている。
        この　頭痛が　激しくなると
        不思議な　力を　使いはじめる。
      ko: |-
        항상 두통에 시달리고 있다.
        이 두통이 심해지면
        이상한 힘을 쓰기 시작한다.
      en: |-
        It is constantly wracked by a headache.
        When the headache turns intense,
        it begins using mysterious powers.
      fr: |-
        Ce Pokémon a tout le temps la migraine.
        Quand la douleur devient insupportable, il se met à
        utiliser ses pouvoirs psy.
      de: |-
        Es wird permanent von Kopfschmerzen geplagt.
        Wird der Schmerz stärker, setzt es geheimnisvolle
        Kräfte ein.
      es: |-
        Padece continuamente dolores de cabeza. Cuando
        son muy fuertes, empieza a usar misteriosos poderes.
      it: |-
        È costantemente tormentato dal mal di testa che,
        quando si fa particolarmente intenso, gli conferisce
        strani poteri.
    'y':
      ja-Hrkt: |-
        ふしぎな　ちからを　ひめているが
        つかった　きおくが　ないので
        いつも　くびを　かしげている。
      ja: |-
        不思議な　力を　秘めているが
        使った　記憶が　ないので
        いつも　首を　かしげている。
      ko: |-
        이상한 힘을 간직하고 있지만
        사용했던 기억이 없으므로
        항상 고개를 갸웃거리고 있다.
      en: |-
        It has mystical powers but doesn’t recall that it has
        used them. That is why it always looks puzzled.
      fr: |-
        Il ne se souvient pas qu’il a des pouvoirs psy.
        C’est pour cela qu’il a l’air si confus.
      de: |-
        Es besitzt mystische Kräfte, die es unbewusst einsetzt.
        Daher ist sein Blick immer verwirrt.
      es: |-
        Tiene poderes místicos que no recuerda haber usado.
        Por eso, siempre parece desconcertado.
      it: |-
        Ha poteri soprannaturali ma non ricorda di averli
        usati. Per questo sembra sempre perplesso.
    omega-ruby:
      ja-Hrkt: |-
        ふしぎな　ちからを　はっきしている　コダックから
        ねむっている　ときにだけ　でるはずの　のうはが
        かんそくされて　がっかいの　わだいに　なった。
      ja: |-
        不思議な　力を　発揮している　コダックから
        眠っている　ときだけ　出るはずの　脳波が
        観測されて　学会の　話題に　なった。
      ko: |-
        이상한 힘을 발휘하는 고라파덕에게서
        잠들어 있을 때만 발산되는 뇌파가
        관측되어 학회에서 화제가 되었다.
      en: |-
        Psyduck uses a mysterious power. When it does so, this
        Pokémon generates brain waves that are supposedly only seen
        in sleepers. This discovery spurred controversy
        among scholars.
      fr: |-
        Psykokwak utilise un mystérieux pouvoir. Ce Pokémon
        peut générer des ondes cérébrales normalement observées
        chez les dormeurs. Cette découverte a lancé une polémique
        dans le milieu universitaire.
      de: |-
        Enton verwendet eine geheimnisvolle Kraft. Dabei erzeugt
        es Gehirnströme, die man sonst nur von Schlafenden kennt.
        Diese Entdeckung führte zu einer kontroversen Diskussion
        unter Wissenschaftlern.
      es: |-
        Psyduck tiene un extraño poder, que consiste en generar
        ondas cerebrales iguales a las que se generan cuando se está
        dormido. Este descubrimiento levantó una gran polémica entre
        eruditos.
      it: |-
        Psyduck usa poteri misteriosi, che scatenano onde cerebrali
        rilevabili apparentemente soltanto su persone addormentate.
        Questa scoperta ha causato reazioni contrastanti tra gli
        studiosi.
    alpha-sapphire:
      ja-Hrkt: |-
        ふしぎな　ちからを　つかった　きおくが　ないのは
        ちからを　はっきした　ときは　じゅくすいしている
        ときと　おなじ　じょうたいだから　らしい。
      ja: |-
        不思議な　力を　使った　記憶が　ないのは
        力を　発揮した　ときは　熟睡している
        ときと　同じ　状態だから　らしい。
      ko: |-
        이상한 힘을 썼던 기억이 없는 것은
        힘을 발휘할 때가 숙면 중일 때와
        같은 상태이기 때문인 것 같다.
      en: |-
        If it uses its mysterious power, Psyduck can’t remember
        having done so. It apparently can’t form a memory of such
        an event because it goes into an altered state that is much
        like deep sleep.
      fr: |-
        Lorsqu’il utilise son mystérieux pouvoir, Psykokwak
        ne s’en souvient pas. Apparemment, il ne peut pas garder
        ce genre d’événement en mémoire, car il pratique ce pouvoir
        dans un état proche du sommeil profond.
      de: |-
        Enton besitzt mystische Kräfte. Wenn es sie einsetzt,
        erinnert es sich nicht mehr daran. Es kann ein solches
        Ereignis offensichtlich nicht im Gedächtnis behalten,
        da es sich in einen tiefschlafähnlichen Zustand versetzt.
      es: |-
        Psyduck no se acuerda nunca de haber usado su misterioso
        poder. Parece ser que no puede registrar en la memoria haber
        usado el ataque porque se queda inmerso en un estado
        parecido a un sueño profundo.
      it: |-
        Quando usa i suoi misteriosi poteri, Psyduck se ne dimentica
        subito. Apparentemente non riesce a ricordarsene perché entra
        in uno stato innaturale molto simile a un sonno profondo.
    sun:
      ja-Hrkt: |-
        じぶんの　いしとは　かんけいなく
        ときおり　ねんりきが　でてきて
        あたまが　いたくて　ないている。
      ja: |-
        自分の　意思とは　関係なく
        時折　念力が　でてきて
        頭が　痛くて　鳴いている。
      ko: |-
        가끔 자신의 의지와 상관없이
        염동력이 나와버린다.
        그 때문에 머리가 아파서 울곤 한다.
      zh-Hant: |-
        身體無意識地
        不時產生念力，
        讓牠因為頭痛而哭泣。
      zh-Hans: |-
        不受自己控制，
        时不时地会产生念力，
        导致头痛流泪。
      en: |-
        As a result of headaches so fierce they cause it
        to cry, it sometimes uses psychokinesis without
        meaning to.
      fr: |-
        Il arrive que des ondes psychiques fusent de
        son cerveau sans qu’il n’y soit pour rien, ce qui
        lui donne mal à la tête au point de gémir.
      de: |-
        Es weint oft, da es immer unter Kopfschmerzen
        leidet und seine Psycho-Kräfte von Zeit zu Zeit
        gegen seinen Willen ausgelöst werden.
      es: |-
        En ocasiones utiliza sus poderes psíquicos
        sin querer, lo que le provoca fuertes dolores
        de cabeza que le hacen chillar.
      it: |-
        A volte i suoi poteri psicocinetici si attivano
        in modo indipendente dalla sua volontà e gli
        causano mal di testa così forti da farlo gemere.
    moon:
      ja-Hrkt: |-
        いつも　ずつうで　なやんでいる。
        いたみが　ひどいときほど
        きょうりょくな　ねんりきを　はなつ。
      ja: |-
        いつも　頭痛で　悩んでいる。
        痛みが　ひどいときほど
        強力な　念力を　放つ。
      ko: |-
        언제나 두통에 시달리고 있다.
        고통이 심할 때 일수록
        강력한 염동력을 발산한다.
      zh-Hant: |-
        一直因頭痛而煩惱著。
        痛得越厲害，
        放出的念力越強。
      zh-Hans: |-
        一直因头痛而烦恼着。
        痛得越厉害，
        放出的念力越强。
      en: |-
        This Pokémon is troubled by constant
        headaches. The more pain it’s in, the more
        powerful its psychokinesis becomes.
      fr: |-
        Il souffre d’une migraine permanente. Plus sa
        douleur augmente, plus il émet des ondes
        psychiques intenses.
      de: |-
        Es wird permanent von Kopfschmerzen geplagt.
        Je größer diese Schmerzen sind, desto stärker
        werden seine Psycho-Kräfte.
      es: |-
        Siempre padece dolores de cabeza. Cuando
        estos llegan a niveles insoportables, desata
        un poder psíquico extraordinario.
      it: |-
        È costantemente tormentato dal mal di testa.
        Più si acuiscono, maggiore è la sua capacità
        di usare poteri psicocinetici.
    ultra-sun:
      ja-Hrkt: |-
        ねんりきを　つかうと　ずつうが
        するので　ふだんは　なるべく　なにも
        しないで　ボーっと　すごしているよ。
      ja: |-
        念力を　使うと　頭痛が
        するので　普段は　なるべく　何も
        しないで　ボーっと　過ごしているよ。
      ko: |-
        염동력을 사용하면 두통이 생겨서
        평소에는 아무것도 하지 않고
        가능한 멍하니 지낸다.
      zh-Hant: |-
        一使出念力就會頭痛，
        所以平常盡量什麼事都不做，
        整天不停地發呆。
      zh-Hans: |-
        使用念力会头痛，
        所以平时会尽量不做任何事，
        就在发呆中度过哦。
      en: |-
        Using psychokinesis gives it a headache, so it
        normally passes the time spacing out and doing
        as little as possible.
      fr: |-
        Utiliser ses pouvoirs psychiques lui donne
        de terribles migraines, aussi préfère-t-il passer
        tout son temps immobile à ne rien faire.
      de: |-
        Wenn es seine Psycho-Kräfte einsetzt, bekommt
        es Kopfschmerzen. Deshalb steht es lieber
        untätig und geistesabwesend herum.
      es: |-
        El uso de sus poderes psíquicos le provoca un
        gran dolor de cabeza, por lo que prefiere tener
        la mente en blanco y no hacer nada en absoluto.
      it: |-
        Usare i suoi poteri psicocinetici gli causa dei
        gran mal di testa, perciò passa il tempo
        cercando di fare e pensare il meno possibile.
    ultra-moon:
      ja-Hrkt: |-
        ずつうが　はっせいしている　あいだ
        のうさいぼうが　ふだんの　１０ばい
        かつどう　していることが　わかった。
      ja: |-
        頭痛が　発生している　間
        脳細胞が　普段の　１０倍
        活動　していることが　わかった。
      ko: |-
        두통이 발생하는 동안
        뇌세포가 평소의 10배나
        활동한다는 사실이 밝혀졌다.
      zh-Hant: |-
        據了解，當頭痛發生時，
        牠的腦細胞活動
        會比平時活躍１０倍。
      zh-Hans: |-
        据了解，头痛发生时，
        它的脑细胞会比平时活跃１０倍。
      en: |-
        It has been found that its brain cells are
        10 times more active when Psyduck is
        experiencing a headache.
      fr: |-
        Des scientifiques ont découvert que lorsqu’il
        souffre de migraines, ses neurones fonctionnent
        dix fois plus vite qu’en temps normal.
      de: |-
        Es wurde herausgefunden, dass die Aktivität
        seiner Hirnzellen bei Kopfschmerzen auf das
        Zehnfache ansteigt.
      es: |-
        Estudios recientes han desvelado que, cuando
        sufre un episodio de cefalea, su actividad
        neuronal es diez veces superior a lo normal.
      it: |-
        Gli scienziati hanno scoperto che quando ha
        mal di testa la sua attività cerebrale aumenta
        di dieci volte rispetto al solito.
    lets-go-pikachu:
      ja-Hrkt: |-
        いつも　ずつうに　なやまされている。
        ねんりきを　つかうが　じぶんの
        いしか　どうか　わからない。
      ja: |-
        いつも　頭痛に　悩まされている。
        念力を　使うが　自分の
        意思か　どうか　わからない。
      ko: |-
        항상 두통에 시달리고 있다.
        염력을 사용하지만 자신의
        의지인지 아닌지 알 수 없다.
      zh-Hant: |-
        總是因為頭痛所苦。
        會使用念力，但無法確認
        是不是出於牠自己的意志。
      zh-Hans: |-
        一直被头痛困扰。能使用
        念力，但不知道那是否是
        出于它自己的意识。
      en: |-
        Always tormented by headaches. It uses
        psychic powers, but whether it intends to
        do so is not known.
      fr: |-
        Il est toujours en proie à des maux de tête.
        On ignore s’il contrôle ses pouvoirs psychiques.
      de: |-
        Es wird von chronischen Kopfschmerzen geplagt.
        Ob es seine Psycho-Kräfte aus eigenem Willen
        einsetzt, ist unklar.
      es: |-
        Siempre tiene dolores de cabeza. Posee poderes
        psíquicos, pero se desconoce si los controla a
        voluntad.
      it: |-
        Ha sempre un forte mal di testa.
        Non è chiaro se utilizzi volontariamente
        i suoi poteri psicocinetici.
    lets-go-eevee:
      ja-Hrkt: |-
        いつも　ずつうに　なやまされている。
        ねんりきを　つかうが　じぶんの
        いしか　どうか　わからない。
      ja: |-
        いつも　頭痛に　悩まされている。
        念力を　使うが　自分の
        意思か　どうか　わからない。
      ko: |-
        항상 두통에 시달리고 있다.
        염력을 사용하지만 자신의
        의지인지 아닌지 알 수 없다.
      zh-Hant: |-
        總是因為頭痛所苦。
        會使用念力，但無法確認
        是不是出於牠自己的意志。
      zh-Hans: |-
        一直被头痛困扰。能使用
        念力，但不知道那是否是
        出于它自己的意识。
      en: |-
        Always tormented by headaches. It uses
        psychic powers, but whether it intends to
        do so is not known.
      fr: |-
        Il est toujours en proie à des maux de tête.
        On ignore s’il contrôle ses pouvoirs psychiques.
      de: |-
        Es wird von chronischen Kopfschmerzen geplagt.
        Ob es seine Psycho-Kräfte aus eigenem Willen
        einsetzt, ist unklar.
      es: |-
        Siempre tiene dolores de cabeza. Posee poderes
        psíquicos, pero se desconoce si los controla a
        voluntad.
      it: |-
        Ha sempre un forte mal di testa.
        Non è chiaro se utilizzi volontariamente
        i suoi poteri psicocinetici.
    sword:
      ja-Hrkt: |-
        いつも　ずつうに　なやんでいる。
        ふしぎな　ちからを　ばくはつさせると
        しばらく　いたみは　おさまるようだ。
      ja: |-
        いつも　頭痛に　悩んでいる。
        不思議な　力を　爆発させると
        しばらく　痛みは　治まるようだ。
      ko: |-
        언제나 두통에 시달린다.
        신비한 힘을 폭발시키면
        잠시 통증이 진정되는 듯하다.
      zh-Hant: |-
        總是因為頭痛而煩惱著。
        當牠讓神奇的力量爆發後，
        似乎就能暫時舒緩疼痛。
      zh-Hans: |-
        总是因为头痛而烦恼。
        让神秘的力量爆发后，
        疼痛似乎就会暂时得到缓解。
      en: |-
        Psyduck is constantly beset by headaches. If the
        Pokémon lets its strange power erupt, apparently
        the pain subsides for a while.
      fr: |-
        Il a toujours la migraine, mais la douleur semble
        s’atténuer momentanément s’il laisse exploser
        son pouvoir mystérieux.
      de: |-
        Enton leidet permanent unter Kopfschmerzen.
        Wenn es seine geheimnisvollen Kräfte freisetzt,
        sollen die Schmerzen für eine Weile nachlassen.
      es: |-
        Siempre padece dolores de cabeza. Tras desatar
        sus misteriosos poderes, la jaqueca remite unos
        instantes.
      it: |-
        È costantemente tormentato dal mal di testa,
        ma se lascia esplodere il suo misterioso potere
        pare che trovi temporaneamente sollievo.
    shield:
      ja-Hrkt: |-
        ストレスが　たまると　ずつうが
        エスカレート。　きょうりょくな
        ねんりきで　まわりを　あっとうする。
      ja: |-
        ストレスが　溜まると　頭痛が
        エスカレート。　強力な　念力で
        まわりを　圧倒する。
      ko: |-
        스트레스가 쌓이면
        두통이 심해진다. 강력한
        염동력으로 주위를 압도한다.
      zh-Hant: |-
        頭痛會隨著壓力累積而
        更加劇烈。會用強大的
        念力壓倒周圍的一切。
      zh-Hans: |-
        头痛会随着压力逐渐累积
        而不断加剧。会用强大的
        念力击垮周围的一切。
      en: |-
        As Psyduck gets stressed out, its headache gets
        progressively worse. It uses intense psychic
        energy to overwhelm those around it.
      fr: |-
        Sa migraine s’intensifie à mesure que son stress
        monte. Il libère une force psychique puissante
        qui terrasse tous ceux qui l’entourent.
      de: |-
        Wenn es sehr gestresst ist, verstärken sich seine
        Kopfschmerzen. Mit seinen Psycho-Kräften kann
        es alles in der Umgebung überwältigen.
      es: |-
        Sus dolores de cabeza empeoran a medida que
        aumenta su nivel de estrés. Su increíble poder
        psíquico puede causar estragos a su alrededor.
      it: |-
        Più è stressato, più il suo mal di testa si fa
        intenso. Con i suoi incredibili poteri psicocinetici
        travolge chiunque nelle vicinanze.
    legends-arceus:
      en: |-
        Suffers perpetual headaches. If the agony grows too great,
        Psyduck's latent power erupts, contrary to Psyduck's intent.
        Ergo, I am exploring ways to ease the pain.
