    x:
      ja-Hrkt: |-
        せわを　やかれる　ことが　きらい。
        トレーナーの　しじを　きかないので
        なかよく　なるのが　むずかしい。
      ja: |-
        世話を　焼かれる　ことが　大嫌い。
        トレーナーの　指示を　聞かないので
        仲良く　なるのが　難しい。
      ko: |-
        신세를 지는 것을 싫어한다.
        트레이너의 지시를 듣지 않아
        친해지기 어렵다.
      en: |-
        It doesn’t like to be taken care of. It’s difficult to
        bond with since it won’t listen to its Trainer.
      fr: |-
        Ce Pokémon est difficile à entraîner car il est très
        désobéissant et déteste qu’on lui rende service.
      de: |-
        Einmischung kann es gar nicht leiden. Es ist bockig
        und fasst nur schwer Zutrauen zu seinem Trainer.
      es: |-
        No le gusta que lo cuiden. Como no aprecia el apoyo
        de su Entrenador, le cuesta coger confianza con él.
      it: |-
        Molto orgoglioso. Difficile farci amicizia perché
        non ascolta mai i consigli dell’Allenatore.
    'y':
      ja-Hrkt: |-
        プライドが　たかく　ひとから
        たべものを　もらう　ことを　きらう。
        ながい　うぶげが　さむさを　ふせぐ。
      ja: |-
        プライドが　高く　人から
        食べ物を　もらう　ことを　嫌う。
        長い　産毛が　寒さを　防ぐ。
      ko: |-
        자존심이 강해서 사람에게
        먹이를 얻는 것을 싫어한다.
        긴 솜털이 추위를 막는다.
      en: |-
        Because it is very proud, it hates accepting food
        from people. Its thick down guards it from cold.
      fr: |-
        Il est fier et déteste accepter la nourriture qu’on
        lui offre. Son pelage épais le protège du froid.
      de: |-
        Es ist sehr stolz und nimmt daher kein Futter von
        anderen an. Seine dicken Daunen schützen vor Kälte.
      es: |-
        Es muy orgulloso, por lo que odia aceptar comida de
        la gente. Su grueso plumón lo protege del frío.
      it: |-
        È molto orgoglioso e odia accettare cibo dalla gente.
        Le fitte piume lo proteggono dal freddo.
