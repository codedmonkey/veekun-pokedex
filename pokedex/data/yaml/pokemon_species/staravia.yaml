    x:
      ja-Hrkt: |-
        おおきな　グループを　つくって
        こうどうする　しゅうせい。グループ
        どうしの　あらそいは　はげしい。
      ja: |-
        大きな　グループを　作って
        行動する　習性。
        グループ同士の　争いは　激しい。
      ko: |-
        큰 그룹을 만들어
        행동하는 습성이 있다.
        그룹 간의 분쟁이 격하다.
      en: |-
        They maintain huge flocks, although fierce scuffles
        break out between various flocks.
      fr: |-
        Il a coutume de se regrouper en larges volées.
        Les combats entre Étourvol sont très violents.
      de: |-
        Es neigt dazu, sich in großen Gruppen zu bewegen.
        Zwischen ihnen kommt es zu heftigen Kämpfen.
      es: |-
        Vive siempre en grandes grupos y las disputas dentro
        de ellos son muy intensas.
      it: |-
        Ha l’abitudine di riunirsi in grandi gruppi. Le zuffe
        tra gruppi sono particolarmente vivaci.
    'y':
      ja-Hrkt: |-
        もりや　そうげんに　せいそく。
        グループが　でくわすと　なわばりを
        かけた　あらそいが　はじまる。
      ja: |-
        森や　草原に　生息。
        グループが　出くわすと　なわばりを
        かけた　争いが　はじまる。
      ko: |-
        숲이나 초원에 서식한다.
        그룹이 마주치면 영역을 건
        분쟁이 시작된다.
      en: |-
        It lives in forests and fields. Squabbles over
        territory occur when flocks collide.
      fr: |-
        Il peuple les champs et les forêts. Lorsque deux
        volées se croisent, elles luttent pour le territoire.
      de: |-
        Es lebt in Wäldern und auf Wiesen. Treffen Schwärme
        aufeinander, streiten sie sich um das Revier.
      es: |-
        Vive en bosques y campos. Si dos bandadas se
        encuentran, pelean por el territorio.
      it: |-
        Vive nelle foreste e nei campi muovendosi in grandi
        gruppi. Se due gruppi si incontrano, lottano
        per il territorio.
