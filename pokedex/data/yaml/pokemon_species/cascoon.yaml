cascoon:
  base_happiness: 70
  capture_rate: 120
  color: purple
  egg_groups:
    - bug
  evolution_chain: wurmple
  evolves_from: wurmple
  flavor_text:
    ruby:
      en: |-
        CASCOON makes its protective cocoon
        by wrapping its body entirely with a
        fine silk from its mouth. Once the silkgoes around its body, it hardens.
        This POKéMON prepares for its evolution
        inside the cocoon.
    sapphire:
      en: |-
        If it is attacked, CASCOON remains
        motionless however badly it may be
        hurt. It does so because if it were tomove, its body would be weak upon
        evolution. This POKéMON will also not
        forget the pain it endured.
    emerald:
      en: |-
        To avoid detection by its enemies, it hides
        motionlessly beneath large leaves and in
        the gaps of branches. It also attaches
        dead leaves to its body for camouflage.
    firered:
      en: |-
        Its body, which is made of soft silk,
        hardens over time. When cracks appear,
        evolution is near.
    leafgreen:
      en: |-
        Its body, which is made of soft silk,
        hardens over time. When cracks appear,
        evolution is near.
    diamond:
      en: |-
        It is hot inside its cocoon. All
        the cells in its body create the
        energy for it to evolve.
    pearl:
      en: |-
        Encased within its tough cocoon, it
        endures attacks. It never forgets
        the appearance of its foes.
    platinum:
      en: |-
        It never forgets any attack it
        endured while in the cocoon.
        After evolution, it seeks payback.
    heartgold:
      en: |-
        It endures attacks with patience,
        because the more pain before
        evolution, the sturdier it becomes.
    soulsilver:
      en: |-
        It endures attacks with patience,
        because the more pain before
        evolution, the sturdier it becomes.
    black:
      en: |-
        It never forgets any attack it
        endured while in the cocoon.
        After evolution, it seeks payback.
      fr: |-
        Rancunier, il n’oublie aucune des
        attaques subies dans le cocon et
        se venge une fois qu’il a évolué.
    white:
      en: |-
        It never forgets any attack it
        endured while in the cocoon.
        After evolution, it seeks payback.
      fr: |-
        Rancunier, il n’oublie aucune des
        attaques subies dans le cocon et
        se venge une fois qu’il a évolué.
    black-2:
      en: |-
        It never forgets any attack it
        endured while in the cocoon.
        After evolution, it seeks payback.
    white-2:
      en: |-
        It never forgets any attack it
        endured while in the cocoon.
        After evolution, it seeks payback.
    x:
      ja-Hrkt: |-
        やわらかい　いとで　できた　からだは
        じかんと　ともに　かたくなっていく。
        ひびわれると　しんかは　まぢかだ。
      ja: |-
        やわらかい　糸で　できた　体は
        時間と　ともに　硬くなっていく。
        ひび割れると　進化は　間近だ。
      ko: |-
        부드러운 실로 된 몸은
        시간이 지나면서 단단해진다.
        진화가 임박하면 갈라지기 시작한다.
      en: |-
        Its body, which is made of soft silk, hardens over
        time. When cracks appear, evolution is near.
      fr: |-
        Son corps, constitué de soie fine, durcit avec le
        temps. Si vous voyez apparaître des fissures, c’est
        qu’il va très bientôt évoluer.
      de: |-
        Sein aus weicher Seide bestehender Körper erhärtet
        mit der Zeit. Sobald Risse sichtbar sind, steht die
        Entwicklung kurz bevor.
      es: |-
        Está formado por seda que se endurece poco a
        poco. Si se resquebraja el capullo, está a punto
        de evolucionar.
      it: |-
        Il corpo di soffice seta si indurisce nel corso del
        tempo. Quando appaiono crepe, l’evoluzione è vicina.
    'y':
      ja-Hrkt: |-
        マユに　こもっている　あいだに
        うけた　こうげきは　しんかしても
        わすれずに　かならず　しかえしする。
      ja: |-
        マユに　こもっている　あいだに
        受けた　攻撃は　進化しても
        忘れずに　かならず　仕返しする。
      ko: |-
        고치에 들어가 있는 사이에
        받은 공격은 진화해도
        잊지 않고 반드시 앙갚음한다.
      en: |-
        It never forgets any attack it endured while in the
        cocoon. After evolution, it seeks payback.
      fr: |-
        Rancunier, il n’oublie aucune des attaques subies
        dans le cocon et se venge une fois qu’il a évolué.
      de: |-
        Es vergisst keinen Angriff, den es im Kokon erdulden
        musste. Nach der Entwicklung sinnt es auf Rache.
      es: |-
        Jamás olvida a quienes lo atacaron mientras estaba
        en su capullo. Cuando evoluciona, busca venganza.
      it: |-
        Non dimentica mai gli attacchi subiti dentro il bozzolo.
        Dopo l’evoluzione cerca di vendicarsi.
    omega-ruby:
      ja-Hrkt: |-
        マユルドの　からだは　くちから　だした　ほそい
        いとが　からだを　つつみ　かたくなった　もの。
        マユの　なかで　しんかの　じゅんびを　している。
      ja: |-
        マユルドの　体は　口から　出した　細い
        糸が　体を　包み　硬くなった　もの。
        マユの　中で　進化の　準備を　している。
      ko: |-
        카스쿤의 몸은 입에서 나온 가는
        실이 몸을 둘러싸 딱딱해진 것이다.
        고치 안에서 진화의 준비를 하고 있다.
      en: |-
        Cascoon makes its protective cocoon by wrapping its body
        entirely with a fine silk from its mouth. Once the silk goes
        around its body, it hardens. This Pokémon prepares for its
        evolution inside the cocoon.
      fr: |-
        Blindalys fabrique son cocon protecteur en s’enveloppant
        dans la soie qui sort de sa bouche. Une fois la soie autour
        de son corps, elle se met à durcir. Ce Pokémon prépare
        son évolution à l’intérieur du cocon.
      de: |-
        Panekon baut seinen schützenden Kokon, indem es seinen
        Körper mit feiner Seide einwickelt, die aus seinem Mund
        austritt. Wenn sein Körper mit Seide bedeckt ist, wird diese
        hart. Im Kokon wartet es auf seine Entwicklung.
      es: |-
        Cascoon forma el capullo que lo protege enrollándose por
        completo en la seda que libera por la boca. Cuando está
        totalmente recubierto, se prepara para evolucionar en el
        interior del capullo.
      it: |-
        Cascoon crea il bozzolo protettivo avvolgendo interamente
        il proprio corpo con finissima seta secreta dalla bocca.
        Successivamente la seta si indurisce. A questo punto Cascoon
        si prepara all’evoluzione.
    alpha-sapphire:
      ja-Hrkt: |-
        うごくと　つよい　からだに　しんか　できないので
        どんなに　いためつけられても　じっと　している。
        そのとき　うけた　いたみは　ずっと　わすれない。
      ja: |-
        動くと　強い　体に　進化　できないので
        どんなに　痛めつけられても　じっと　している。
        そのとき　受けた　痛みは　ずっと　忘れない。
      ko: |-
        움직이면 튼튼한 몸으로 진화할 수 없어서
        아무리 괴롭혀도 가만히 있는다.
        그때 느낀 아픔을 계속 잊지 않는다.
      en: |-
        If it is attacked, Cascoon remains motionless however badly it
        may be hurt. It does so because if it were to move, its body
        would be weak upon evolution. This Pokémon will also not
        forget the pain it endured.
      fr: |-
        Lorsqu’il est attaqué, Blindalys reste immobile, même s’il a
        très mal. En effet, s’il bougeait, son corps serait affaibli lors
        de son évolution. En revanche, ce Pokémon n’oubliera pas
        la douleur endurée.
      de: |-
        Wenn es angegriffen wird, bewegt sich Panekon in
        keiner Weise, egal, wie schwer es dabei verletzt wird.
        Wenn es sich bewegen würde, wäre sein Körper zu
        schwach für seine Entwicklung. Die Schmerzen allerdings
        vergisst es nie.
      es: |-
        Si atacan a Cascoon, se queda inmóvil aunque le hayan hecho
        mucho daño, puesto que, si se moviera, perdería fuerzas para
        evolucionar. Nunca olvida el daño que le han hecho.
      it: |-
        In caso di aggressione Cascoon rimane immobile
        indipendentemente dalla violenza dell’attacco subito.
        Questo lo aiuta a evitare di indebolire il suo corpo in vista
        dell’evoluzione. Non dimentica mai il dolore provato.
    legends-arceus:
      en: |-
        The silk coating its body is thin but sufficiently strong. Cascoon's
        silk has a luster and texture superior to that of Silcoon's, and
        clothes made using Cascoon silk are regarded as top-notch.
