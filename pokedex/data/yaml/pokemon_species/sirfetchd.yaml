sirfetchd:
  base_happiness: 50
  capture_rate: 45
  color: white
  egg_groups:
    - flying
    - ground
  evolution_chain: farfetchd
  evolves_from: farfetchd
  flavor_text:
    sword:
      ja-Hrkt: |-
        れきせんを　いきぬいた　ものが
        このすがたに　しんかする。　ネギが
        かれるとき　せんじょうを　さる。
      ja: |-
        歴戦を　生き抜いた　ものが
        この姿に　進化する。　ネギが
        枯れるとき　戦場を　去る。
      ko: |-
        많은 싸움에서 살아남은 자만이
        이 모습으로 진화한다.
        파가 시들면 전장을 떠난다.
      zh-Hant: |-
        只有歷經過無數戰鬥的
        大蔥鴨才能進化成這個樣子。
        當大蔥枯萎了就會離開戰場。
      zh-Hans: |-
        只有经历过无数战斗的
        大葱鸭才能进化成这个样子。
        当大葱枯萎了就会离开战场。
      en: |-
        Only Farfetch’d that have survived many battles
        can attain this evolution. When this Pokémon’s
        leek withers, it will retire from combat.
      fr: |-
        Seuls les Canarticho ayant survécu à de nombreux
        combats atteignent ce stade d’évolution. Si son
        poireau se flétrit, il se retire du champ de bataille.
      de: |-
        Porenta, die viele Schlachten überstanden haben,
        entwickeln sich zu Lauchzelot. Verwelkt seine
        Lauchstange, zieht es sich vom Kämpfen zurück.
      es: |-
        Los ejemplares que superan numerosos combates
        evolucionan y adoptan esta forma. Abandonan el
        terreno de combate en cuanto el puerro se seca.
      it: |-
        Gli esemplari con tante lotte alle spalle si
        evolvono assumendo questa forma. Se il suo
        gambo si secca, abbandona il campo di lotta.
    shield:
      ja-Hrkt: |-
        かたいネギの　はで　こうげきを
        いなし　するどい　クキで　はんげき。
        ネギは　ぶぐで　あり　しょくざい。
      ja: |-
        硬いネギの　葉で　攻撃を
        いなし　鋭い　茎で　反撃。
        ネギは　武具であり　食材。
      ko: |-
        단단한 파잎으로 공격을 받아넘기고
        날카로운 줄기로 반격한다.
        파는 무기인 동시에 식재료다.
      zh-Hant: |-
        會用堅硬的蔥葉抵擋攻擊，
        接著用鋒利的莖反擊。
        牠的蔥既是武器也是食材。
      zh-Hans: |-
        会用坚硬的葱叶抵挡攻击，
        接着用锋利的茎反击。
        它的葱既是武器也是食材。
      en: |-
        After deflecting attacks with its hard leaf shield,
        it strikes back with its sharp leek stalk. The leek
        stalk is both weapon and food.
      fr: |-
        Il pare les attaques avec le tranchant de son
        solide poireau, et contre-attaque avec la pointe
        de la tige. Son arme est également comestible.
      de: |-
        Der Lauch dient ihm als Waffe und zur Abwehr,
        aber viele essen ihn auch. Mit den harten Blättern
        pariert es und mit der scharfen Stange kontert es.
      es: |-
        Repele ataques con las hojas de su duro puerro y
        contraataca con su tallo afilado. El puerro que le
        sirve de armamento sigue siendo comestible.
      it: |-
        Devia gli attacchi usando la dura foglia del porro
        e contrattacca con il gambo affilato. Usa il porro
        sia come arma che come cibo.
