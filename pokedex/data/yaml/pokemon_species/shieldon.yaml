shieldon:
  base_happiness: 70
  capture_rate: 45
  color: gray
  egg_groups:
    - monster
  evolution_chain: shieldon
  evolves_from: ~
  flavor_text:
    diamond:
      en: |-
        A Pokémon that lived in jungles
        around 100 million years ago. Its
        facial hide is extremely hard.
    pearl:
      en: |-
        It habitually polishes its face by
        rubbing it against tree trunks. It
        is weak to attacks from behind.
    platinum:
      en: |-
        It is outstandingly armored. As a
        result, it can eat grass and
        berries without having to fight.
    heartgold:
      en: |-
        It was generated from a fossil dug out
        of a layer of clay that was older than
        anyone knows. It has a sturdy face.
    soulsilver:
      en: |-
        It was generated from a fossil dug out
        of a layer of clay that was older than
        anyone knows. It has a sturdy face.
    black:
      en: |-
        It is outstandingly armored. As a
        result, it can eat grass and
        berries without having to fight.
      fr: |-
        Il est si bien protégé qu’il peut
        déguster Baies et herbe fraîche
        sans craindre de prédateurs.
    white:
      en: |-
        It is outstandingly armored. As a
        result, it can eat grass and
        berries without having to fight.
      fr: |-
        Il est si bien protégé qu’il peut
        déguster Baies et herbe fraîche
        sans craindre de prédateurs.
    black-2:
      en: |-
        It is outstandingly armored. As a
        result, it can eat grass and
        berries without having to fight.
    white-2:
      en: |-
        It is outstandingly armored. As a
        result, it can eat grass and
        berries without having to fight.
    x:
      ja-Hrkt: |-
        たいぼくの　みきに　こすりつけて
        かたい　かおを　みがく　しゅうせい。
        うしろからの　こうげきに　よわい。
      ja: |-
        大木の　幹に　こすりつけて
        硬い　顔を　磨く　習性。
        後ろからの　攻撃に　弱い。
      ko: |-
        큰 나무의 줄기에 비벼서
        단단한 얼굴을 닦는 습성이 있다.
        뒤로부터의 공격에 약하다.
      en: |-
        It habitually polishes its face by rubbing it against
        tree trunks. It is weak to attacks from behind.
      fr: |-
        Il a l’habitude de polir son visage en le frottant contre
        un tronc. Il craint les attaques dans le dos.
      de: |-
        Es reibt sein Gesicht an Baumstämmen, um es zu
        polieren. Es ist leicht, es von hinten anzugreifen.
      es: |-
        Se abrillanta la cara frotándola contra los árboles.
        Es vulnerable a los ataques por la espalda.
      it: |-
        Si pulisce il muso strofinandolo contro i tronchi
        degli alberi. È vulnerabile agli attacchi alle spalle.
    'y':
      ja-Hrkt: |-
        １おくねんまえの　ちそう　から
        ほりだされた　かせきから　うまれた。
        とても　がんじょうな　かおを　もつ。
      ja: |-
        １億年前の　地層から
        掘り出された　化石から　生まれた。
        とても　頑丈な　顔を　持つ。
      ko: |-
        1억 년 전의 지층에서
        발굴된 화석에서 태어났다.
        매우 튼튼한 얼굴을 가졌다.
      en: |-
        It was generated from a fossil dug out of a layer of
        clay that was older than anyone knows. It has a
        sturdy face.
      fr: |-
        Il est né d’un fossile datant de 100 millions d’années.
        Son visage est très dur.
      de: |-
        Das Fossil, aus dem es entstand, wurde aus einer
        100 Millionen Jahre alten Gesteinsschicht geborgen.
      es: |-
        Surgió de un fósil de hace 100 millones de años.
        Su protección facial es tremendamente dura.
      it: |-
        Nato da un fossile portato alla luce da uno strato di
        100 milioni di anni fa. Ha un muso resistente.
    omega-ruby:
      ja-Hrkt: |-
        たいぼくの　みきに　こすりつけて
        かたい　かおを　みがく　しゅうせい。
        うしろからの　こうげきに　よわい。
      ja: |-
        大木の　幹に　こすりつけて
        硬い　顔を　磨く　習性。
        後ろからの　攻撃に　弱い。
      ko: |-
        큰 나무의 줄기에 비벼서
        단단한 얼굴을 닦는 습성이 있다.
        뒤로부터의 공격에 약하다.
      en: |-
        It habitually polishes its face by rubbing it against
        tree trunks. It is weak to attacks from behind.
      fr: |-
        Il a l’habitude de polir son visage en le frottant contre
        un tronc. Il craint les attaques dans le dos.
      de: |-
        Es reibt sein Gesicht an Baumstämmen, um es zu polieren.
        Es ist leicht, es von hinten anzugreifen.
      es: |-
        Se abrillanta la cara frotándola contra los árboles. Es
        vulnerable a los ataques por la espalda.
      it: |-
        Si pulisce il muso strofinandolo contro i tronchi degli alberi.
        È vulnerabile agli attacchi alle spalle.
    alpha-sapphire:
      ja-Hrkt: |-
        １おくねんまえの　ちそう　から
        ほりだされた　かせきから　うまれた。
        とても　がんじょうな　かおを　もつ。
      ja: |-
        １億年前の　地層から
        掘り出された　化石から　生まれた。
        とても　頑丈な　顔を　持つ。
      ko: |-
        1억 년 전의 지층에서
        발굴된 화석에서 태어났다.
        매우 튼튼한 얼굴을 가졌다.
      en: |-
        It was generated from a fossil dug out of a layer of
        clay that was older than anyone knows. It has a
        sturdy face.
      fr: |-
        Il est né d’un fossile datant de 100 millions d’années.
        Son visage est très dur.
      de: |-
        Das Fossil, aus dem es entstand, wurde aus einer
        100 Millionen Jahre alten Gesteinsschicht geborgen.
      es: |-
        Surgió de un fósil de hace 100 millones de años.
        Su protección facial es tremendamente dura.
      it: |-
        Nato da un fossile portato alla luce da uno strato di
        100 milioni di anni fa. Ha un muso resistente.
    sun:
      ja-Hrkt: |-
        おおくの　かせきが　みつかっているが
        かおの　ぶぶんが　きずついていたり
        かけているものは　ほぼ　ない。
      ja: |-
        多くの　化石が　みつかっているが
        顔の　部分が　傷ついていたり
        欠けているものは　ほぼ　ない。
      ko: |-
        많은 화석이 발견되었지만
        얼굴 부분에 상처가 있거나
        이가 빠져 있는 것은 거의 없다.
      zh-Hant: |-
        大量的化石被發現，
        但幾乎所有化石
        臉的部位都沒有任何損傷或缺失。
      zh-Hans: |-
        大量的化石被发现，
        但是几乎没有
        脸的部分有损伤或缺失的情况。
      en: |-
        Many fossils of this Pokémon have been found,
        but almost none have shown signs of damage
        to the face.
      fr: |-
        Dans les nombreux fossiles trouvés, presque
        aucune plaque faciale ne porte de trace de
        blessure ou d’ébréchure.
      de: |-
        Es wurden viele Fossilien dieses Pokémon
        gefunden und nur bei sehr wenigen war
        das Gesicht beschädigt oder fehlte ganz.
      es: |-
        Se han encontrado innumerables fósiles de este
        Pokémon y prácticamente ninguno presenta
        daños en la parte facial.
      it: |-
        Tutti gli esemplari fossilizzati di questo
        Pokémon sono perfettamente conservati nella
        zona del muso, priva di qualsiasi scalfittura.
    moon:
      ja-Hrkt: |-
        がんじょうな　かおの　おかげで
        てきは　すくなかったと　おもわれる。
        たいこの　ジャングルに　すんでいた。
      ja: |-
        頑丈な　顔の　おかげで
        敵は　少なかったと　思われる。
        太古の　ジャングルに　棲んでいた。
      ko: |-
        튼튼한 얼굴 덕분에
        적은 적었을 것으로 여겨진다.
        태고의 정글에 살았다.
      zh-Hant: |-
        多虧那張結實的臉，
        牠的敵人應該不多。
        棲息在太古時代的叢林裡。
      zh-Hans: |-
        看来多亏了那张结实的脸，
        敌人也少了。
        栖息在太古时代的丛林里。
      en: |-
        This Pokémon lived in primeval jungles. Few
        enemies would have been willing to square off
        against its heavily armored face, so it’s thought.
      fr: |-
        Grâce à sa tête très robuste, on suppose qu’il
        n’avait que très peu d’ennemis. Il vivait dans les
        forêts primaires, il y a fort longtemps.
      de: |-
        Man nimmt an, dass es dank seines
        gepanzerten Gesichts kaum Feinde hatte.
        Es lebte vor Urzeiten im Dschungel.
      es: |-
        Debido a la extraordinaria dureza de su rostro,
        se piensa que tenía pocos enemigos. Vivía en las
        junglas prehistóricas.
      it: |-
        Viveva nelle giungle preistoriche. Si pensa
        che avesse pochi predatori per via del muso
        incredibilmente robusto.
    ultra-sun:
      ja-Hrkt: |-
        そうしょくの　おとなしい　ポケモン。
        じょうぶな　かおの　ひふで　じめんを
        ほり　きのねっこなども　くっていた。
      ja: |-
        草食の　おとなしい　ポケモン。
        丈夫な　顔の　皮膚で　地面を
        掘り　木の根っこなども　食っていた。
      ko: |-
        온순한 초식 포켓몬.
        튼튼한 얼굴 피부로 지면을
        파고들어 나무 뿌리도 먹었다.
      zh-Hant: |-
        草食性的溫馴寶可夢。
        會用結實的臉部皮膚挖掘地面，
        連樹根之類的東西也會吃。
      zh-Hans: |-
        食草的温顺宝可梦。
        用结实的脸部皮肤挖掘地面，
        连树根之类的也会吃。
      en: |-
        A mild-mannered, herbivorous Pokémon, it used
        its face to dig up tree roots to eat. The skin on
        its face was plenty tough.
      fr: |-
        Cet herbivore, très calme de nature, utilisait
        la peau durcie de son museau pour déterrer
        des racines à grignoter.
      de: |-
        Ein friedliches, pflanzenfressendes Pokémon.
        Mit seiner harten Gesichtshaut wühlte es im
        Boden und fraß Baumwurzeln.
      es: |-
        Un Pokémon herbívoro de carácter afable.
        Con su dura protección facial podía desenterrar
        las raíces de los árboles para comérselas.
      it: |-
        Era un docile Pokémon erbivoro. Si serviva del
        muso protetto dalla pelle coriacea per scavare
        nel terreno e mangiare le radici degli alberi.
    ultra-moon:
      ja-Hrkt: |-
        たいこの　ちそうから　かせきが
        みつかるが　かおの　ぶぶん　いがいが
        はっけん　されたことは　ない。
      ja: |-
        太古の　地層から　化石が
        見つかるが　顔の　部分　以外が
        発見　されたことは　ない。
      ko: |-
        태고의 지층에서 화석이
        발견되었지만 얼굴 이외의
        부분이 발견된 적은 없다.
      zh-Hant: |-
        雖然在遠古時代的地層中
        發現了牠的化石，但至今未曾
        發現臉部以外的部分。
      zh-Hans: |-
        虽然从太古时代的地层中
        发现了它的化石，
        但尚未发现除了脸以外的部分。
      en: |-
        Although its fossils can be found in layers of
        primeval rock, nothing but its face has ever
        been discovered.
      fr: |-
        On retrouve des fossiles de Dinoclier dans
        les couches sédimentaires préhistoriques, mais
        seule sa tête a résisté à l’épreuve du temps.
      de: |-
        Man findet zwar in uralten Erdschichten
        Fossilien dieses Pokémon, aber meist handelt
        es sich dabei nur um Teile des Gesichts.
      es: |-
        Los fósiles que se han encontrado hasta ahora
        en estratos prehistóricos pertenecen solo a su
        cara.
      it: |-
        Fossili di questo Pokémon sono stati trovati in
        strati geologici antichissimi. Tuttavia, gli unici
        resti pervenuti costituiscono parti del muso.
    legends-arceus:
      en: |-
        Much remains unknown about this Pokémon, as few have ever
        seen it. However, we know that it is calm and dislikes conflict,
        and it enjoys polishing its face against trees and rocks.
