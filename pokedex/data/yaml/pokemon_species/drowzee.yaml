  flavor_text:
    red:
      en: |-
        Puts enemies to
        sleep then eats
        their dreams.Occasionally gets
        sick from eating
        bad dreams.
    blue:
      en: |-
        Puts enemies to
        sleep then eats
        their dreams.Occasionally gets
