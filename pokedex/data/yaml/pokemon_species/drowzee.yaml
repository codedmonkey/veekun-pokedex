    white-2:
      en: |-
        It can tell what people are
        dreaming by sniffing with its big
        nose. It loves fun dreams.
    x:
      ja-Hrkt: |-
        ねむらせては　ユメを　たべるが
        わるい　ユメばかり　たべてると
        おなかを　こわすことが　あるらしい。
      ja: |-
        眠らせては　夢を　食べるが
        悪い　夢ばかり　食べてると
        お腹を　壊すことが　あるらしい。
      ko: |-
        잠들게 한 뒤 꿈을 먹지만
        나쁜 꿈만 먹고 있으면
        배탈이 날 때도 있는 것 같다.
      en: |-
        Puts enemies to sleep, then eats their dreams.
        Occasionally gets sick from eating only bad dreams.
      fr: |-
        Il endort ses ennemis et dévore leurs songes.
        S’il mange trop de cauchemars, il fait une indigestion.
      de: |-
        Traumato versetzt Gegner in den Schlaf und frisst
        deren Träume. Von Alpträumen wird ihm aber übel.
      es: |-
        Adormece a sus enemigos y se come sus sueños.
        A veces se pone enfermo si come pesadillas.
      it: |-
        Addormenta i suoi nemici e poi si nutre dei loro
        sogni. A volte fa indigestione di incubi.
    'y':
      ja-Hrkt: |-
        たのしいユメを　みていたはずなのに
        どんなユメか　おもいだせないとき。
        きっと　スリープに　たべられたのだ。
      ja: |-
        楽しい　夢を　見ていたはずなのに
        どんな夢か　思い出せないとき。
        きっと　スリープに　食べられたのだ。
      ko: |-
        즐거운 꿈을 꾸고 있었는데
        어떤 꿈인지 생각나지 않을 때는
        분명히 슬리프가 꿈을 먹었을 것이다.
      en: |-
        If you think that you had a good dream but you
        can’t remember it, a Drowzee has probably eaten it.
      fr: |-
        Si vous pensez avoir rêvé mais que vous ne vous en
        souvenez pas, c’est que Soporifik a tout mangé.
      de: |-
        Hast du gut geträumt und kannst dich nicht erinnern,
        hat ein Traumato deinen Traum gefressen.
      es: |-
        Si crees haber tenido un buen sueño y no puedes
        acordarte, seguro que se lo ha comido un Drowzee.
      it: |-
        Se si pensa di aver fatto un bel sogno, ma non lo
        si ricorda, magari l’ha mangiato un Drowzee.
    omega-ruby:
      ja-Hrkt: |-
        ねむっているとき　キミの　はなが　ムズムズしたら
        まくらもとに　たった　スリープが　はなの
        あなから　ゆめを　たべようとしている　あいず。
      ja: |-
        眠っているとき　キミの　鼻が　ムズムズしたら
        まくら元に　立った　スリープが　鼻の
        穴から　夢を　食べようとしている　合図。
      ko: |-
        잠들었을 때 너의 코가 근질근질하다면
        슬리프가 머리맡에 서서 콧구멍을
        통해 꿈을 먹으려고 하는 신호다.
      en: |-
        If your nose becomes itchy while you are sleeping, it’s a sure
        sign that one of these Pokémon is standing above your pillow
        and trying to eat your dream through your nostrils.
      fr: |-
        Lorsque les enfants ont le nez qui les démange en dormant,
        c’est sans doute parce que ce Pokémon se tient au-dessus
        de leur oreiller, afin d’essayer de manger leurs rêves par
        leurs narines.
      de: |-
        Wenn dir im Schlaf die Nase juckt, ist das ein sicheres
        Zeichen dafür, dass eines dieser Pokémon auf deinem
        Kissen sitzt, um deinen Traum durch deine Nasenlöcher
        hindurch zu verspeisen.
      es: |-
        Si a alguien le pica la nariz mientras duerme, seguro que es
        porque tiene a uno de estos Pokémon cerca de la almohada
        intentando sacarle los sueños por la nariz para comérselos.
      it: |-
        Drowzee è solito nutrirsi dei sogni degli altri mentre dormono,
        estraendoli dalle loro narici. Se durante il sonno si avverte
        prurito al naso, significa che Drowzee è già all’opera.
    alpha-sapphire:
      ja-Hrkt: |-
        ねむっているとき　キミの　はなが　ムズムズしたら
        まくらもとに　たった　スリープが　はなの
        あなから　ゆめを　たべようとしている　あいず。
      ja: |-
        眠っているとき　キミの　鼻が　ムズムズしたら
        まくら元に　立った　スリープが　鼻の
        穴から　夢を　食べようとしている　合図。
      ko: |-
        잠들었을 때 너의 코가 근질근질하다면
        슬리프가 머리맡에 서서 콧구멍을
        통해 꿈을 먹으려고 하는 신호다.
      en: |-
        If your nose becomes itchy while you are sleeping, it’s a sure
        sign that one of these Pokémon is standing above your pillow
        and trying to eat your dream through your nostrils.
      fr: |-
        Lorsque les enfants ont le nez qui les démange en dormant,
        c’est sans doute parce que ce Pokémon se tient au-dessus
        de leur oreiller, afin d’essayer de manger leurs rêves par
        leurs narines.
      de: |-
        Wenn dir im Schlaf die Nase juckt, ist das ein sicheres Zeichen
        dafür, dass eines dieser Pokémon über deinem Kissen
        schwebt, um deinen Traum durch deine Nasenlöcher hindurch
        zu verspeisen.
      es: |-
        Si a alguien le pica la nariz mientras duerme, seguro que es
        porque tiene a uno de estos Pokémon cerca de la almohada
        intentando sacarle los sueños por la nariz para comérselos.
      it: |-
        Drowzee è solito nutrirsi dei sogni degli altri mentre dormono,
        estraendoli dalle loro narici. Se durante il sonno si avverte
        prurito al naso, significa che Drowzee è già all’opera.
    sun:
      ja-Hrkt: |-
        ユメを　くらって　いきる　ポケモン。
        ムンナや　ムシャーナと　きょうつうの
        そせんを　もつと　かんがえられている。
      ja: |-
        夢を　喰らって　生きる　ポケモン。
        ムンナや　ムシャーナと　共通の
        祖先を　持つと　考えられている。
      ko: |-
        꿈을 먹으며 살아가는 포켓몬이다.
        몽나나 몽얌나와 선조가
        같다고 여겨지고 있다.
      zh-Hant: |-
        吞食夢來生存的寶可夢。
        被認為與食夢夢和夢夢蝕
        有著共同的祖先。
      zh-Hans: |-
        吞食梦来生存的宝可梦。
        被认为与食梦梦和梦梦蚀
        有着共同的祖先。
      en: |-
        A Pokémon that nourishes itself by eating
        dreams, it is thought to share common ancestry
        with Munna and Musharna.
      fr: |-
        Un Pokémon qui se nourrit de rêves.
        On suppose qu’il a un ancêtre commun avec
        Munna et Mushana.
      de: |-
        Es ernährt sich von Träumen. Man geht davon
        aus, dass es von demselben Vorfahren wie
        Somniam und Somnivora abstammt.
      es: |-
        Drowzee se alimenta de sueños. Se cree que
        comparte antepasados con Munna y Musharna.
      it: |-
        Si nutre dei sogni degli altri. Si pensa che abbia
        degli antenati in comune con Munna e Musharna.
    moon:
      ja-Hrkt: |-
        こと　たのしいユメは　うまいらしい。
        なつくと　いちばん　おいしかった
        ユメを　みせてくれることも　あるよ。
      ja: |-
        こと　楽しい夢は　美味いらしい。
        なつくと　一番　美味しかった
        夢を　みせてくれることも　あるよ。
      ko: |-
        특히 즐거운 꿈이 맛있다고 한다.
        친해지면 가장 맛있었던
        꿈을 보여줄 때도 있다.
      zh-Hant: |-
        聽說愉快的夢特別美味。
        變得親密後，
        有時也會讓人作最美味的夢哦。
      zh-Hans: |-
        听说愉快的梦特别美味。
        变得亲密后，
        有时也会呈现最美味的梦哦。
      en: |-
        It finds really fun dreams tasty. When it makes
        friends with people, it may show them the most
        delicious dreams it’s ever eaten.
      fr: |-
        Les rêves agréables ont meilleur goût. S’il vous
        considère comme un ami, il peut transformer les
        vôtres en ceux qu’il a trouvés les plus délicieux.
      de: |-
        Lustige Träume schmecken ihm am besten.
        Ist man nett zu ihm, zeigt es einem ab und an
        Träume, die ihm besonders gemundet haben.
      es: |-
        Los sueños divertidos son sus favoritos. Si
        consigues hacerte su amigo, es posible que te
        enseñe el sueño más delicioso que haya tenido.
      it: |-
        Sembra che sia ghiotto di sogni divertenti.
        Se si affeziona a qualcuno, gli mostra i sogni
        che ha trovato più gustosi.
    ultra-sun:
      ja-Hrkt: |-
        レジャーしせつの　ちかくで　すがたを
        みかける。　そのばん　こどもが　みる
        たのしいユメを　ねらって　いるのだ。
      ja: |-
        レジャー施設の　近くで　姿を
        見かける。　その晩　子どもが　見る
        楽しいユメを　狙って　いるのだ。
      ko: |-
        레저 시설 근처에서 볼 수 있다. 
        그날 밤 아이가 꾸는
        즐거운 꿈을 노리고 있다.
      zh-Hant: |-
        在遊樂設施附近可以看見
        牠的身影，因為牠想吃那一晚
        孩子們所做的美夢。
      zh-Hans: |-
        能在娱乐设施的附近见到其身影。
        会偷吃那晚孩子们所做的美梦。
      en: |-
        It can be spotted near recreational facilities,
        intending to eat the pleasant dreams of children
        who enjoyed themselves there that day.
      fr: |-
        Il aime musarder près des parcs d’attractions :
        après y avoir passé une bonne journée, les
        enfants font de beaux rêves, dont il se délecte.
      de: |-
        Traumato hat es auf die lustigen Träume von
        Kindern abgesehen. Man sieht es daher oft in
        der Nähe von Freizeiteinrichtungen.
      es: |-
        Se lo puede ver cerca de instalaciones lúdicas
        donde, al caer la noche, sale a la caza de los
        sueños de los niños.
      it: |-
        Ha un debole per i sogni divertenti dei bambini.
        Per questo è facile incontrarlo vicino alle
        strutture ricreative.
    ultra-moon:
      ja-Hrkt: |-
        えものを　ねむらせ　みている　ユメを
        くらう。　わるいユメは　すっぱくて
        あまり　このんで　たべないらしい。
      ja: |-
        獲物を　眠らせ　見ている　ユメを
        喰らう。　悪いユメは　すっぱくて
        あまり　好んで　食べないらしい。
      ko: |-
        먹이를 잠들게 해 보고 있는 꿈을
        먹는다. 나쁜 꿈은 시큼해서
        그다지 즐겨 먹지 않는다고 한다.
      zh-Hant: |-
        會讓獵物睡著，吃掉對方
        所做的夢。惡夢的味道是酸的，
        所以牠似乎不怎麼愛吃。
      zh-Hans: |-
        会让猎物睡着并吃掉其所做的梦。
        恶梦酸酸的，它好像不怎么喜欢吃。
      en: |-
        It puts its prey to sleep and devours their
        dreams. It seems that bad dreams taste sour,
        so Drowzee doesn’t particularly like eating them.
      fr: |-
        Il regarde ses proies dormir et avale leurs rêves.
        Les cauchemars ayant un petit goût aigrelet,
        il a tendance à les bouder.
      de: |-
        Traumato versetzt seine Beute in den Schlaf und
        frisst ihre Träume. Alpträume mag es aufgrund
        ihres säuerlichen Geschmacks nicht so gern.
      es: |-
        Duerme a sus víctimas para luego devorar sus
        sueños. Las pesadillas no son de su agrado, ya
        que al parecer tienen un regusto agrio.
      it: |-
        Addormenta le prede per mangiare i loro sogni.
        Sembra che non gradisca gli incubi a causa del
        loro sapore acido.
    lets-go-pikachu:
      ja-Hrkt: |-
        いつも　いっしょに　ねむってみると
        ときどき　むかし　たべたユメを
        みせてくれる　よるがある。
      ja: |-
        いつも　一緒に　眠ってみると
        ときどき　昔　食べたユメを
        見せてくれる　夜がある。
      ko: |-
        언제나 함께 잠들다 보면
        가끔 옛날에 먹었던 꿈을
        보여줄 때가 있다.
      zh-Hant: |-
        如果每晚和牠一起睡覺，
        有時會讓你夢見
        牠過去吃過的夢。
      zh-Hans: |-
        如果你每晚与它一起睡觉，
        它偶尔会让你梦见
        它以前吃过的梦。
      en: |-
        If you sleep by it all the time, it will sometimes
        show you dreams it had eaten in the past.
      fr: |-
        Si vous dormez tout le temps près de lui,
        il partagera parfois avec vous les rêves
        qu’il a dévorés par le passé.
      de: |-
        Wenn man immer in der Nähe eines Traumato
        schläft, zeigt es einem nachts manchmal Träume,
        die es vor langer Zeit verspeist hat.
      es: |-
        Si se duerme siempre en compañía de un
        Pokémon de esta especie, puede mostrar
        sueños que haya ingerido con anterioridad.
      it: |-
        Se si dorme sempre vicino a un Drowzee,
        può capitare di sognare uno dei sogni che
        questo Pokémon ha mangiato in passato.
    lets-go-eevee:
      ja-Hrkt: |-
        いつも　いっしょに　ねむってみると
        ときどき　むかし　たべたユメを
        みせてくれる　よるがある。
      ja: |-
        いつも　一緒に　眠ってみると
        ときどき　昔　食べたユメを
        見せてくれる　夜がある。
      ko: |-
        언제나 함께 잠들다 보면
        가끔 옛날에 먹었던 꿈을
        보여줄 때가 있다.
      zh-Hant: |-
        如果每晚和牠一起睡覺，
        有時會讓你夢見
        牠過去吃過的夢。
      zh-Hans: |-
        如果你每晚与它一起睡觉，
        它偶尔会让你梦见
        它以前吃过的梦。
      en: |-
        If you sleep by it all the time, it will sometimes
        show you dreams it had eaten in the past.
      fr: |-
        Si vous dormez tout le temps près de lui,
        il partagera parfois avec vous les rêves
        qu’il a dévorés par le passé.
      de: |-
        Wenn man immer in der Nähe eines Traumato
        schläft, zeigt es einem nachts manchmal Träume,
        die es vor langer Zeit verspeist hat.
      es: |-
        Si se duerme siempre en compañía de un
        Pokémon de esta especie, puede mostrar
        sueños que haya ingerido con anterioridad.
      it: |-
        Se si dorme sempre vicino a un Drowzee,
        può capitare di sognare uno dei sogni che
        questo Pokémon ha mangiato in passato.
