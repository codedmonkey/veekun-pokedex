pawniard:
  base_happiness: 35
  capture_rate: 120
  color: red
  egg_groups:
    - humanshape
  evolution_chain: pawniard
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        Blades comprise this Pokémon’s entire
        body. If battling dulls the blades, it
        sharpens them on stones by the river.
      fr: |-
        Tout son corps est fait de lames.
        Si une lame s’émousse, il va l’aiguiser
        contre une pierre au bord d’une rivière.
    white:
      en: |-
        They fight at Bisharp’s command.
        They cling to their prey and inflict
        damage by sinking their blades into it.
      fr: |-
        Obéissant aux directives d’un Scalproie,
        il s’agrippe à ses proies pour
        les poignarder.
    black-2:
      en: |-
        Ignoring their injuries, groups attack
        by sinking the blades that cover their
        bodies into their prey.
    white-2:
      en: |-
        Ignoring their injuries, groups attack
        by sinking the blades that cover their
        bodies into their prey.
    x:
      ja-Hrkt: |-
        ぜんしんが　はものの　ポケモン。
        たたかいで　はこぼれすると　かわらの
        てごろな　いしで　はを　とぐ。
      ja: |-
        全身が　刃物の　ポケモン。
        戦いで　刃こぼれすると
        河原の　石で　刃を　とぐ。
      ko: |-
        전신이 칼날인 포켓몬이다.
        싸움에서 칼의 이가 빠지면
        강가의 돌로 칼을 간다.
      en: |-
        Blades comprise this Pokémon’s entire body.
        If battling dulls the blades, it sharpens them on
        stones by the river.
      fr: |-
        Tout son corps est fait de lames. Si une lame
        s’émousse, il va l’aiguiser contre une pierre au bord
        d’une rivière.
      de: |-
        Sein Körper ist mit Klingen übersät, die es an Felsen
        eines Flussbettes schärft, wenn sie im Kampf
        schartig werden.
      es: |-
        Su cuerpo está provisto de hojas afiladas. Cuando se
        desgastan, las afila con cantos rodados a la orilla del
        río.
      it: |-
        Il suo intero corpo è un’arma da taglio. Se le lame
        si smussano lottando, le affila con pietre di fiume.
    'y':
      ja-Hrkt: |-
        じぶんが　きずついても　きにせず
        しゅうだんで　ぜんしんの　はものを
        くいこませ　あいてを　こうげきする。
      ja: |-
        自分が　傷ついても　気にせず
        集団で　全身の　刃物を
        食いこませ　相手を　攻撃する。
      ko: |-
        자신이 상처 입어도 신경 쓰지 않고
        집단으로 전신의 칼날을
        박아서 상대를 공격한다.
      en: |-
        Ignoring their injuries, groups attack by sinking
        the blades that cover their bodies into their prey.
      fr: |-
        Ignorant leurs propres blessures, ils se jettent en
        groupe sur l’ennemi pour le déchirer de leur corps
        fait de lames.
      de: |-
        Selbst wenn sie verletzt sind, greifen sie ihren Gegner
        unbeirrt in der Gruppe an, indem sie ihre Klingen in ihn
        hineinrammen.
      es: |-
        Ataca en grupo ignorando sus heridas y hundiendo
        en su presa las cuchillas que recubren su cuerpo.
      it: |-
        Incuranti di ferirsi, si lanciano in gruppo addosso alla
        preda infilzandola con le lame che hanno sul corpo.
    omega-ruby:
      ja-Hrkt: |-
        ぜんしんが　はものの　ポケモン。
        たたかいで　はこぼれすると　かわらの
        てごろな　いしで　はを　とぐ。
      ja: |-
        全身が　刃物の　ポケモン。
        戦いで　刃こぼれすると
        河原の　石で　刃を　とぐ。
      ko: |-
        전신이 칼날인 포켓몬이다.
        싸움에서 칼의 이가 빠지면
        강가의 돌로 칼을 간다.
      en: |-
        Blades comprise this Pokémon’s entire body.
        If battling dulls the blades, it sharpens them on
        stones by the river.
      fr: |-
        Tout son corps est fait de lames. Si une lame s’émousse,
        il va l’aiguiser contre une pierre au bord d’une rivière.
      de: |-
        Sein Körper ist mit Klingen übersät, die es an Felsen eines
        Flussbettes schärft, wenn sie im Kampf schartig werden.
      es: |-
        Su cuerpo está provisto de hojas afiladas. Cuando se
        desgastan, las afila con cantos rodados a la orilla del río.
      it: |-
        Il suo intero corpo è un’arma da taglio. Se le lame
        si smussano lottando, le affila con pietre di fiume.
    alpha-sapphire:
      ja-Hrkt: |-
        じぶんが　きずついても　きにせず
        しゅうだんで　ぜんしんの　はものを
        くいこませ　あいてを　こうげきする。
      ja: |-
        自分が　傷ついても　気にせず
        集団で　全身の　刃物を
        食いこませ　相手を　攻撃する。
      ko: |-
        자신이 상처 입어도 신경 쓰지 않고
        집단으로 전신의 칼날을
        박아서 상대를 공격한다.
      en: |-
        Ignoring their injuries, groups attack by sinking
        the blades that cover their bodies into their prey.
      fr: |-
        Ignorant leurs propres blessures, ils se jettent en groupe
        sur l’ennemi pour le déchirer de leur corps fait de lames.
      de: |-
        Selbst wenn sie verletzt sind, greifen sie ihren Gegner unbeirrt
        in der Gruppe an, indem sie ihre Klingen in ihn hineinrammen.
      es: |-
        Ataca en grupo ignorando sus heridas y hundiendo en su
        presa las cuchillas que recubren su cuerpo.
      it: |-
        Incuranti di ferirsi, si lanciano in gruppo addosso alla preda
        infilzandola con le lame che hanno sul corpo.
    ultra-sun:
      ja-Hrkt: |-
        えものを　きりさいたあとは　かわらの
        いしで　はを　とぐ。　それぞれの
        コマタナに　おきにいりの　いしがある。
      ja: |-
        獲物を　切り裂いたあとは　河原の
        石で　刃を　研ぐ。　それぞれの
        コマタナに　お気に入りの　石がある。
      ko: |-
        먹이를 베어 가른 후에는
        기와 돌로 칼날을 간다.
        자망칼마다 좋아하는 돌이 있다.
      zh-Hant: |-
        斬斷獵物之後，會用河灘上的
        石頭來磨刀。每個駒刀小兵
        各自有著自己喜歡的石頭。
      zh-Hans: |-
        在劈开猎物后，会用河滩的石头
        将刀刃磨快。不同的驹刀小兵
        都有各自喜欢的石头。
      en: |-
        After shredding its prey, it sharpens its blades
        on a stone by the river. Each Pawniard has its
        own favorite sharpening stone.
      fr: |-
        Après avoir dépecé ses ennemis, il va sur les
        berges pour aiguiser ses lames sur une pierre.
        Chaque Scalpion a d’ailleurs son caillou fétiche.
      de: |-
        Erst schlitzt es seine Beute auf, dann schärft es
        seine Klingen an den Felsen eines Flussbetts.
        Jedes Gladiantri besitzt einen Lieblingsfelsen.
      es: |-
        Tras rebanar a sus presas, afila sus cuchillas
        con piedras de río. Cada Pawniard tiene una
        piedra favorita.
      it: |-
        Dopo aver fatto a pezzi la preda, affila le sue
        lame con pietre di fiume. Ogni Pawniard ha
        le sue pietre preferite.
    ultra-moon:
      ja-Hrkt: |-
        キリキザンの　めいれいの　ままに
        てきを　おそう。　あいてを　きりさくと
        りょうての　やいばを　うちならすぞ。
      ja: |-
        キリキザンの　命令の　ままに
        敵を　襲う。　相手を　切り裂くと
        両手の　刃を　打ち鳴らすぞ。
      ko: |-
        절각참의 명령에 따라
        적을 공격한다. 상대를 베어 가르면
        양손의 칼날을 부딪친다.
      zh-Hant: |-
        遵照劈斬司令的命令
        襲擊敵人。斬斷對手時，
        就會敲響雙手的刀刃。
      zh-Hans: |-
        遵照劈斩司令的命令袭击敌人。
        如果劈开了对手，
        就会击响双手的刀刃。
      en: |-
        It follows Bisharp’s orders to a tee when it
        attacks enemies. After slashing an opponent,
        Pawniard clangs both of its blades together.
      fr: |-
        Il obéit à Scalproie au doigt et à l’œil sur le
        champ de bataille. Il fait résonner ses lames
        l’une contre l’autre une fois son ennemi tranché.
      de: |-
        Es greift seine Gegner auf Befehl von Caesurio
        an. Nachdem es seine Beute aufgeschlitzt hat,
        lässt es seine Klingen schwingend ertönen.
      es: |-
        Acata las órdenes de Bisharp a pies juntillas.
        Cuando rebana a un oponente, hace sonar las
        cuchillas de sus brazos chocándolas entre sí.
      it: |-
        Seguendo prontamente gli ordini di Bisharp, si
        lancia sul nemico e lo fa a pezzi, poi fa risuonare
        le sue lame di un clangore metallico.
    sword:
      ja-Hrkt: |-
        するどい　やいばを　あやつり　てきを
        おいつめる。　かわらの　いしで
        からだの　やいばを　ていれする。
      ja: |-
        鋭い　刃を　操り　敵を
        追い詰める。　河原の　石で
        体の　刃を　手入れする。
      ko: |-
        예리한 칼날을 다루어 상대를
        몰아넣는다. 강가에 있는 돌로
        몸에 있는 칼날을 손질한다.
      zh-Hant: |-
        揮舞銳利的刀刃將敵人
        逼向絕境。會用河灘的
        石頭來精心保養刀刃。
      zh-Hans: |-
        挥舞锐利的刀刃将敌人
        逼向绝境。会用河滩的
        石头来精心保养刀刃。
      en: |-
        It uses river stones to maintain the cutting edges
        of the blades covering its body. These sharpened
        blades allow it to bring down opponents.
      fr: |-
        Il accule ses ennemis en jouant de ses lames
        acérées, qu’il aiguise sur les pierres des berges.
      de: |-
        Es treibt Gegner mit seinen scharfen Klingen in
        die Ecke. Diese schärft es an den Felsen eines
        Flussbettes.
      es: |-
        Acorrala a los enemigos con las cuchillas de su
        cuerpo, que afila usando cantos rodados a la
        orilla del río.
      it: |-
        Incalza il nemico con le lame che ha sul corpo,
        e le mantiene sempre taglienti affilandole con
        pietre di fiume.
    shield:
      ja-Hrkt: |-
        キリキザンを　ボスとした　むれを
        つくる。　むれを　ひきいる　ことを
        ゆめみて　ひび　たんれんを　つむ。
      ja: |-
        キリキザンを　ボスとした　群れを
        つくる。　群れを　率いる　ことを
        夢見て　日々　鍛錬を　積む。
      ko: |-
        절각참을 보스로 둔 무리를
        만든다. 무리를 이끄는 날을
        꿈꾸며 날마다 단련을 계속한다.
      zh-Hant: |-
        以劈斬司令為首領組成族群。
        目標是有朝一日能統領同類，
        所以每天都在不懈地鍛鍊。
      zh-Hans: |-
        以劈斩司令为首领组成族群。
        目标是有朝一日能统领同类，
        所以每天都在不懈地锻炼。
      en: |-
        A pack of these Pokémon forms to serve a
        Bisharp boss. Each Pawniard trains diligently,
        dreaming of one day taking the lead.
      fr: |-
        Il vit en meute, sous les ordres d’un Scalproie.
        Il s’entraîne sans relâche en rêvant du jour
        où il sera chef de meute à son tour.
      de: |-
        Gladiantri bilden Gruppen mit einem Caesurio
        an der Spitze. Jedes von ihnen trainiert hart,
        um irgendwann selbst Anführer zu werden.
      es: |-
        Forman grupos encabezados por un Bisharp. Se
        entrenan a diario soñando con llegar a liderar el
        grupo algún día.
      it: |-
        Con i suoi simili forma gruppi capeggiati da
        un Bisharp. Si allena quotidianamente sognando
        un giorno di diventare il capo del gruppo.
