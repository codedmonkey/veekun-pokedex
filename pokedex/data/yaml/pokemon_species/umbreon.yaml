        the rings on its body glow faintly
        and it’s filled with a mysterious power.
    white-2:
      en: |-
        When exposed to the moon’s aura,
        the rings on its body glow faintly
        and it’s filled with a mysterious power.
    x:
      ja-Hrkt: |-
        つきの　ひかりが　イーブイの
        いでんしを　へんかさせた。
        やみに　ひそみ　えものを　まつ。
      ja: |-
        月の　光が　イーブイの
        遺伝子を　変化させた。
        闇に　潜み　獲物を　待つ。
      ko: |-
        달빛이 이브이의
        유전자를 변화시켰다.
        어둠에 숨어 먹이를 기다린다.
      en: |-
        The light of the moon changed Eevee’s genetic
        structure. It lurks in darkness for prey.
      fr: |-
        La lumière de la lune a modifié le code génétique
        d’Évoli. Il hante les ombres en quête d’une proie.
      de: |-
        Mondlicht hat die genetische Struktur von Evoli
        verändert. Im Dunkeln wartet es auf Beute.
      es: |-
        Creado cuando la luz lunar alteró la estructura
        genética de Eevee. Busca presas en la oscuridad.
      it: |-
        La luce lunare ha mutato la struttura genetica di
        Eevee. Si cela nel buio in attesa della preda.
    'y':
      ja-Hrkt: |-
        つきの　はどうを　あびると
        ぜんしんの　わっかもようが　ひかり
        ふしぎな　ちからに　あふれるのだ。
      ja: |-
        月の　波動を　浴びると
        全身の　輪っか模様が　光り
        不思議な　力に　あふれるのだ。
      ko: |-
        달의 파동을 쬐면
        전신의 고리 모양이 빛나며
        이상한 힘이 넘친다.
      en: |-
        When exposed to the moon’s aura, the rings on its
        body glow faintly and it’s filled with a
        mysterious power.
      fr: |-
        Quand il s’expose à la lumière de la lune, ses anneaux
        brillent et il développe de mystérieux pouvoirs.
      de: |-
        Wird es der Aura des Mondes ausgesetzt,
        glühen seine Ringe und es wird von einer
        mysteriösen Kraft durchströmt.
      es: |-
        Cuando lo baña la luz de la luna, los círculos de su
        pelaje brillan levemente y se ve revestido de un poder
        misterioso.
      it: |-
        Quando è esposto alla luce lunare i cerchi sul suo
        corpo brillano e si carica di uno strano potere.
    omega-ruby:
      ja-Hrkt: |-
        つきの　はどうを　うけて　しんかした　ポケモン。
        くらやみに　じっと　ひそみ　あいてを　うかがう。
        おそいかかる　とき　からだの　わっかが　ひかる。
      ja: |-
        月の　波動を　受けて　進化した　ポケモン。
        暗闇に　じっと　潜み　相手を　うかがう。
        襲いかかる　とき　体の　輪っかが　光る。
      ko: |-
        달의 파동을 받아 진화한 포켓몬이다.
        어둠 속에 가만히 숨어 상대를 살핀다.
        습격할 때 몸의 둥근 무늬가 빛난다.
      en: |-
        Umbreon evolved as a result of exposure to the moon’s waves.
        It hides silently in darkness and waits for its foes to make a
        move. The rings on its body glow when it leaps to attack.
      fr: |-
        Noctali a évolué suite à une longue exposition aux rayons
        lunaires. Il se cache dans les recoins sombres et attend
        patiemment le passage de ses ennemis. Les anneaux sur
        son corps s’illuminent au moment où il bondit.
      de: |-
        Nachtara hat sich dadurch entwickelt, dass es den Mondwellen
        ausgesetzt war. Es versteckt sich im Schutze der Dunkelheit
        und wartet darauf, dass sich ein Feind bewegt. Die Ringe an
        seinem Körper leuchten auf, wenn es angreift.
      es: |-
        Umbreon evolucionó tras haber estado expuesto a ondas
        lunares. Suele esconderse en la oscuridad en silencio y
        esperar a que su presa se mueva. Cuando se lanza al ataque,
        le brillan los anillos del cuerpo.
      it: |-
        Umbreon si è evoluto grazie all’esposizione alle onde lunari.
        Rimane nascosto silenzioso nell’oscurità in attesa di un
        movimento del suo nemico. I cerchi sul corpo brillano
        durante l’attacco.
    alpha-sapphire:
      ja-Hrkt: |-
        つきの　はどうを　うけて　しんかした　ポケモン。
        くらやみに　じっと　ひそみ　あいてを　うかがう。
        おそいかかる　とき　からだの　わっかが　ひかる。
      ja: |-
        月の　波動を　受けて　進化した　ポケモン。
        暗闇に　じっと　潜み　相手を　うかがう。
        襲いかかる　とき　体の　輪っかが　光る。
      ko: |-
        달의 파동을 받아 진화한 포켓몬이다.
        어둠 속에 가만히 숨어 상대를 살핀다.
        습격할 때 몸의 둥근 무늬가 빛난다.
      en: |-
        Umbreon evolved as a result of exposure to the moon’s waves.
        It hides silently in darkness and waits for its foes to make a
        move. The rings on its body glow when it leaps to attack.
      fr: |-
        Noctali a évolué suite à une longue exposition aux rayons
        lunaires. Il se cache dans les recoins sombres et attend
        patiemment le passage de ses ennemis. Les anneaux sur
        son corps s’illuminent au moment où il bondit.
      de: |-
        Nachtara hat sich dadurch entwickelt, dass es den Mondwellen
        ausgesetzt war. Es versteckt sich im Schutze der Dunkelheit
        und wartet darauf, dass sich ein Feind bewegt. Die Ringe an
        seinem Körper leuchten auf, wenn es angreift.
      es: |-
        Umbreon evolucionó tras haber estado expuesto a ondas
        lunares. Suele esconderse en la oscuridad en silencio y
        esperar a que su presa se mueva. Cuando se lanza al ataque,
        le brillan los anillos del cuerpo.
      it: |-
        Umbreon si è evoluto grazie all’esposizione alle onde lunari.
        Rimane nascosto silenzioso nell’oscurità in attesa di un
        movimento del suo nemico. I cerchi sul corpo brillano
        durante l’attacco.
    sun:
      ja-Hrkt: |-
        おこると　ぜんしんの　けあなから
        どくその　まじった　あせを　ふきだし
        あいての　めを　ねらう。
      ja: |-
        怒ると　全身の　毛穴から
        毒素の　混じった　汗を　吹き出し
        相手の　目を　狙う。
      ko: |-
        화가 나면 전신의 모공으로부터
        독소가 섞인 땀을 뿜어내어
        상대의 눈을 노린다.
      zh-Hant: |-
        發怒的時候會從全身的毛孔裡
        噴出混合了毒素的汗液，
        瞄準對手的眼睛發動攻擊。
      zh-Hans: |-
        发怒的时候会从全身的毛孔里
        喷出混合了毒素的汗液，
        袭击对手的眼睛。
      en: |-
        When this Pokémon becomes angry, its pores
        secrete a poisonous sweat, which it sprays at
        its opponent’s eyes.
      fr: |-
        Quand il s’énerve, ses pores sécrètent une
        sueur empoisonnée qu’il envoie dans les yeux
        de ses ennemis.
      de: |-
        Ist es wütend, feuert es tödlichen Giftschweiß
        aus all seinen Poren auf die Augen seines
        Gegners ab.
      es: |-
        Cuando se enfurece, secreta un sudor venenoso
        por los poros que lanza a los ojos de sus
        enemigos.
      it: |-
        Quando si arrabbia, spruzza dai pori un
        sudore velenoso direttamente sugli occhi
        del nemico.
    moon:
      ja-Hrkt: |-
        やみに　とけこむ　くろい　たいもう。
        じっと　えものの　スキを　うかがい
        のどぶえ　めがけて　くいかかる。
      ja: |-
        闇に　溶け込む　黒い　体毛。
        じっと　獲物の　隙を　うかがい
        喉笛　目掛けて　喰いかかる。
      ko: |-
        어둠에 녹아드는 검은 털.
        가만히 먹이의 틈을 살피며
        숨통을 노리고 덤벼든다.
      zh-Hant: |-
        黑色的體毛與黑暗融為一體。
        一動不動地等待著獵物鬆懈，
        對準咽喉一口咬住。
      zh-Hans: |-
        黑色体毛与黑暗融为一体。
        一动不动地等着猎物出现疏漏，
        然后一口咬住它的喉咙。
      en: |-
        With its black fur, it blends into the darkness.
        It bides its time, and when prey appears, this
        Pokémon goes for its throat, and then eats it.
      fr: |-
        Son pelage noir lui permet de se fondre dans
        la nuit. Il attend que sa proie baisse sa garde
        pour l’attaquer en visant la gorge.
      de: |-
        Sein schwarzes Fell verschmilzt mit der Nacht.
        Es lauert seiner Beute geduldig auf und beißt
        ihr bei erster Gelegenheit die Kehle durch.
      es: |-
        Su pelaje le permite camuflarse en la oscuridad,
        donde espera con paciencia a que su presa se
        distraiga para saltarle al cuello.
      it: |-
        Si nasconde nell’oscurità grazie al colore del
        suo pelo. Quando meno se l’aspetta, assale
        la preda puntando alla gola.
    ultra-sun:
      ja-Hrkt: |-
        やこうせいの　ポケモン。　おおきな
        ひとみは　まっくらやみでも　えものの
        すがたを　ハッキリと　とらえるぞ。
      ja: |-
        夜行性の　ポケモン。　大きな
        瞳は　真っ暗闇でも　獲物の
        姿を　ハッキリと　とらえるぞ。
      ko: |-
        야행성 포켓몬. 큰 눈동자는
        칠흑 같은 어둠에서도 먹이의
        모습을 정확하게 찾아낸다.
      zh-Hant: |-
        夜行性寶可夢。
        大大的眼睛即使在一片漆黑中
        也能看清獵物的樣子。
      zh-Hans: |-
        夜行性宝可梦。
        大大的瞳孔即便在一片漆黑中
        也能看清猎物的样子。
      en: |-
        This Pokémon is nocturnal. Even in total
        darkness, its large eyes can spot its
        prey clearly!
      fr: |-
        Les larges pupilles de ce Pokémon nocturne
        lui permettent de distinguer parfaitement ses
        proies même dans l’obscurité la plus profonde.
      de: |-
        Die Pupillen dieses nachtaktiven Pokémon sind
        groß genug, um auch in der schwärzesten Nacht
        noch seine Beute deutlich erkennen zu können.
      es: |-
        Un Pokémon de hábitos nocturnos. Sus grandes
        pupilas le permiten distinguir con total claridad
        a sus presas en la más densa oscuridad.
      it: |-
        È un Pokémon notturno. Le sue grandi pupille
        gli permettono di vedere chiaramente le prede
        anche nell’oscurità più profonda.
    ultra-moon:
      ja-Hrkt: |-
        やみよに　ひそみ　えものを　ねらう。
        おそいかかる　しゅんかん　からだの
        わっかが　にぶく　あやしく　ひかる。
      ja: |-
        闇夜に　潜み　獲物を　狙う。
        襲いかかる　瞬間　身体の
        輪っかが　鈍く　あやしく　光る。
      ko: |-
        어둠 속에 숨어 먹이를 노린다.
        습격하는 순간 몸의 둥근 무늬가
        희미하고 이상하게 빛난다.
      zh-Hant: |-
        會潛伏在黑暗裡準備襲擊獵物。
        在發動襲擊的瞬間，牠身上的
        圈圈會發出黯淡的詭異亮光。
      zh-Hans: |-
        会潜伏在暗处袭击猎物。
        在发动袭击的瞬间，它身上的
        圈圈会发出黯淡的诡异之光。
      en: |-
        It lurks in the dark of night looking for prey.
        At the moment it pounces, the rings on its
        body glow dimly but ominously.
      fr: |-
        Il se cache dans la pénombre pour chasser.
        Les anneaux sur son corps brillent d’une aura
        lugubre quand il passe à l’attaque.
      de: |-
        Es lauert seiner Beute im Schutz der Dunkelheit
        auf. Greift es an, erzeugen die Ringe an seinem
        Körper ein schwaches, ominöses Leuchten.
      es: |-
        Acecha a sus presas al amparo de la oscuridad.
        Sus círculos emiten un brillo ominoso cuando se
        dispone a saltar al ataque.
      it: |-
        Resta nascosto nell’oscurità in attesa della
        preda. Nell’istante in cui attacca, i cerchi che ha
        sul corpo brillano di una fioca luce misteriosa.
    sword:
      ja-Hrkt: |-
        おこると　ぜんしんの　けあなから
        どくその　まじった　あせを　ふきだし
        あいての　めを　ねらう。
      ja: |-
        怒ると　全身の　毛穴から
        毒素の　混じった　汗を　噴き出し
        相手の　目を　狙う。
      ko: |-
        화가 나면 전신의 모공으로부터
        독소가 섞인 땀을 뿜어내어
        상대의 눈을 노린다.
      zh-Hant: |-
        發怒的時候會從全身的毛孔裡
        噴出混合了毒素的汗液，
        瞄準對手的眼睛發動攻擊。
      zh-Hans: |-
        发怒的时候会从全身的毛孔
        喷出混合了毒素的汗液，
        袭击对手的眼睛。
      en: |-
        When this Pokémon becomes angry, its pores
        secrete a poisonous sweat, which it sprays at
        its opponent’s eyes.
      fr: |-
        Quand il s’énerve, ses pores sécrètent une sueur
        empoisonnée qu’il projette dans les yeux
        de ses ennemis.
      de: |-
        Ist es wütend, feuert es giftigen Schweiß aus all
        seinen Poren auf die Augen seines Gegners ab.
      es: |-
        Cuando se enfurece, secreta un sudor venenoso
        por los poros que lanza a los ojos de sus
        enemigos.
      it: |-
        Quando si arrabbia, spruzza dai pori un sudore
        velenoso mirando agli occhi del suo avversario.
    shield:
      ja-Hrkt: |-
        まんげつの　よるや　こうふん
        したとき　ぜんしんの　わっかもようは
        きいろく　ひかる。
      ja: |-
        満月の　夜や　興奮
        したとき　全身の　輪っか模様は
        黄色く　光る。
      ko: |-
        보름달이 뜬 밤이나 흥분했을 때
        전신의 고리 무늬가
        노랗게 빛난다.
      zh-Hant: |-
        在滿月之夜或是興奮的時候，
        牠身上圈圈一樣的花紋
        就會發出金黃色的光。
      zh-Hans: |-
        在满月之夜或是兴奋的时候，
        它身上圈圈一样的花纹
        就会发出金黄色的光。
      en: |-
        On the night of a full moon, or when it gets
        excited, the ring patterns on its body glow yellow.
      fr: |-
        Les nuits de pleine lune, ou s’il est agité,
        les anneaux sur sa peau se mettent à briller.
      de: |-
        Bei Vollmond oder bei Aufregung leuchten die
        ringförmigen Muster auf seinem Körper gelb auf.
      es: |-
        En las noches de luna llena, o cuando se exalta,
        le empiezan a brillar los anillos de color dorado.
      it: |-
        I cerchi sul corpo emettono un bagliore giallo
        quando è agitato o nelle notti di luna piena.
