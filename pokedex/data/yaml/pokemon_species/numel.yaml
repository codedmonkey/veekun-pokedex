      fr: |-
        Son dos bossu renferme une lave
        bouillonnante. Elle refroidit par 
        temps de pluie, ce qui le ralentit.
    black-2:
      en: |-
        The magma in its body reaches
        2,200 degrees F. Its hump gets smaller
        when it uses Fire-type moves.
    white-2:
      en: |-
        The magma in its body reaches
        2,200 degrees F. Its hump gets smaller
        when it uses Fire-type moves.
    x:
      ja-Hrkt: |-
        しゃくねつの　マグマを　せなかの
        コブに　ためている。あめに　あたると
        マグマが　ひえて　うごきが　にぶる。
      ja: |-
        灼熱の　マグマを　背中の
        コブに　ためている。雨に　当たると
        マグマが　冷えて　動きが　鈍る。
      ko: |-
        이글거리는 마그마를 등의
        혹에 모으고 있다. 비를 맞으면
        마그마가 식어 움직임이 둔해진다.
      en: |-
        Its humped back stores intensely hot magma.
        In rain, the magma cools, slowing its movement.
      fr: |-
        Son dos bossu renferme une lave bouillonnante.
        Elle refroidit par temps de pluie, ce qui le ralentit.
      de: |-
        In seinem Rücken speichert es sehr heißes Magma.
        Regnet es, kühlt das Magma ab und es wird
        langsamer.
      es: |-
        En su joroba almacena magma ardiente que se enfría
        cuando llueve y lo ralentiza.
      it: |-
        Nella gobba accumula magma. Quando piove, il
        magma si indurisce e il Pokémon diventa più lento.
    'y':
      ja-Hrkt: |-
        １２００どの　マグマを　たいないに
        ためこんでいる。ほのおの　わざを
        つかうと　コブは　ちいさく　しぼむ。
      ja: |-
        １２００度の　マグマを　体内に
        ためこんでいる。炎の　技を
        使うと　コブは　小さく　しぼむ。
      ko: |-
        1200도의 마그마를 체내에
        모아두고 있다. 불꽃 기술을
        사용하면 혹은 작게 쪼그라든다.
      en: |-
        The magma in its body reaches 2,200 degrees
        Fahrenheit. Its hump gets smaller when it uses
        Fire-type moves.
      fr: |-
        Son corps renferme une lave à plus de 1 200 °C.
        Sa bosse se contracte lorsqu’il utilise des capacités
        de type Feu.
      de: |-
        In seinem Körper fließt 1 200 °C heißes Magma. Nach
        Einsatz einer Feuer-Attacke schrumpft sein Höcker.
      es: |-
        Almacena en su cuerpo magma a 1200 °C. Su joroba
        mengua cuando utiliza movimientos de tipo Fuego.
      it: |-
        Nel suo corpo accumula magma che ribolle a 1200 °C.
        Dopo aver usato una mossa di tipo Fuoco, la sua
        gobba si restringe.
    omega-ruby:
      ja-Hrkt: |-
        たたかれても　きが　つかない　にぶさ　だが
        くうふくは　１びょうでも　がまん　できない。
        からだの　なかでは　マグマが　にえたぎっている。
      ja: |-
        たたかれても　気が　つかない　鈍さ　だが
        空腹は　１秒でも　我慢　できない。
        体の　中では　マグマが　煮えたぎっている。
      ko: |-
        맞아도 알아채지 못할 정도로 둔하지만
        배고픔은 단 1초도 참지 못한다.
        몸 안에는 마그마가 끓어오르고 있다.
      en: |-
        Numel is extremely dull witted—it doesn’t notice being hit.
        However, it can’t stand hunger for even a second.
        This Pokémon’s body is a seething cauldron of boiling magma.
      fr: |-
        Chamallot est terriblement lent d’esprit. Il ne remarque même
        pas quand il est touché. Il ne supporte pas d’avoir faim,
        même une seconde. Le corps de ce Pokémon est comparable
        à un chaudron de magma bouillonnant.
      de: |-
        Camaub ist nicht besonders helle. Es nimmt nicht einmal wahr,
        wenn es getroffen wurde. Ein Hungergefühl allerdings kann es
        nicht einmal eine Sekunde lang aushalten. In seinem Körper
        brodelt glühend heißes Magma.
      es: |-
        Numel tarda en percibir las cosas, no se entera ni cuando lo
        golpean, pero se da cuenta enseguida de si tiene hambre. El
        cuerpo de este Pokémon es un caldero de magma hirviendo.
      it: |-
        Numel è estremamente tardo, tanto da non notare di essere
        attaccato. Tuttavia, non sa resistere alla fame per più di
        un secondo. Il suo corpo è un calderone bollente di
        magma liquido.
    alpha-sapphire:
      ja-Hrkt: |-
        １２００どの　マグマを　からだに　ためている。
        みずに　ぬれると　マグマが　ひえて　かたまり
        おもたくなるので　うごきが　にぶって　しまう。
      ja: |-
        １２００度の　マグマを　体に　ためている。
        水に　ぬれると　マグマが　冷えて　固まり
        重たくなるので　動きが　鈍って　しまう。
      ko: |-
        1200도의 마그마를 몸에 저장하고 있다.
        물에 젖으면 마그마가 식어서 덩어리져
        무거워지므로 움직임이 둔해진다.
      en: |-
        Numel stores magma of almost 2,200 degrees Fahrenheit
        within its body. If it gets wet, the magma cools and hardens.
        In that event, the Pokémon’s body grows heavy and its
        movements become sluggish.
      fr: |-
        Chamallot stocke du magma à 1 200 °C dans son corps.
        Lorsqu’il est mouillé, le magma se refroidit et durcit. Le corps
        du Pokémon devient alors très lourd et ses mouvements
        très lents.
      de: |-
        Camaub speichert fast 1 200 °C heißes Magma in seinem
        Körper. Wenn es nass wird, kühlt das Magma ab und wird hart.
        Dadurch wird der Körper dieses Pokémon schwer und seine
        Bewegungen träge.
      es: |-
        Numel acumula en su interior un magma de 1200 °C. Si se
        moja, el magma se enfría y se solidifica. Cuando esto ocurre,
        aumenta su tamaño y se vuelve pesado y lento en sus
        movimientos.
      it: |-
        Numel accumula magma a una temperatura di 1200 °C
        all’interno del proprio corpo. Se si bagna, il magma si
        raffredda e si solidifica. Se si appesantisce diventa goffo
        nei movimenti.
