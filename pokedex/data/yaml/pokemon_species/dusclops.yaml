dusclops:
  base_happiness: 35
  capture_rate: 90
  color: black
  egg_groups:
    - indeterminate
  evolution_chain: duskull
  evolves_from: duskull
  flavor_text:
    ruby:
      en: |-
        DUSCLOPS’s body is completely hollow -
        there is nothing at all inside.
        It is said that its body is like a blackhole. This POKéMON will absorb anything
        into its body, but nothing will ever come
        back out.
    sapphire:
      en: |-
        DUSCLOPS absorbs anything, however
        large the object may be. This POKéMON
        hypnotizes its foe by waving its handsin a macabre manner and by bringing its
        single eye to bear. The hypnotized foe
        is made to do DUSCLOPS’s bidding.
    emerald:
      en: |-
        It is thought that its body is hollow with
        only a spectral ball of fire burning inside.
        However, no one has been able to
        confirm this theory as fact.
    firered:
      en: |-
        Its body is entirely hollow. When it opens
        its mouth, it sucks everything in as if it
        were a black hole.
    leafgreen:
      en: |-
        Its body is entirely hollow. When it opens
        its mouth, it sucks everything in as if it
        were a black hole.
    diamond:
      en: |-
        Its body is hollow. It is said that
        those who look into its body are
        sucked into the void.
    pearl:
      en: |-
        Its body is hollow. It is said that
        those who look into its body are
        sucked into the void.
    platinum:
      en: |-
        It seeks drifting will-o’-the-wisps
        and sucks them into its empty body.
        What happens inside is a mystery.
    heartgold:
      en: |-
        Anyone who dares peer into its body
        to see its spectral ball of fire
        will have their spirit stolen away.
    soulsilver:
      en: |-
        Anyone who dares peer into its body
        to see its spectral ball of fire
        will have their spirit stolen away.
    black:
      en: |-
        It seeks drifting will-o’-the-wisps
        and sucks them into its empty body.
        What happens inside is a mystery.
      fr: |-
        Il cherche des feux follets pour
        les avaler. Ce qui se passe alors
        dans son corps est un mystère.
    white:
      en: |-
        It seeks drifting will-o’-the-wisps
        and sucks them into its empty body.
        What happens inside is a mystery.
      fr: |-
        Il cherche des feux follets pour
        les avaler. Ce qui se passe alors
        dans son corps est un mystère.
    black-2:
      en: |-
        It seeks drifting will-o’-the-wisps
        and sucks them into its empty body.
        What happens inside is a mystery.
    white-2:
      en: |-
        It seeks drifting will-o’-the-wisps
        and sucks them into its empty body.
        What happens inside is a mystery.
    x:
      ja-Hrkt: |-
        からだの　なかで　もえている
        ひとだまを　のぞきこむと
        たましいを　すいとられてしまう。
      ja: |-
        体の　中で　燃えている
        人魂を　のぞきこむと
        魂を　吸い取られてしまう。
      ko: |-
        몸 안에서 불타고 있는
        도깨비불을 들여다보면
        영혼을 빼앗겨버린다.
      en: |-
        Anyone who dares peer into its body to see its
        spectral ball of fire will have their spirit stolen away.
      fr: |-
        Il aspire l’âme de ceux qui regardent dans son corps
        creux où rougeoie son unique œil.
      de: |-
        Blickt man direkt in den Feuerball in seinem
        Inneren, wird einem die Seele ausgesaugt.
      es: |-
        Si alguien mira los fuegos fatuos del interior de
        Dusclops, perderá su alma irremediablemente.
      it: |-
        Se si osserva troppo da vicino la palla di fuoco
        dentro Dusclops, la propria anima viene risucchiata.
    'y':
      ja-Hrkt: |-
        からだの　なかみは　くうどうに
        なっていて　のぞきこんだ　あいてを
        すいこんでしまうと　いわれている。
      ja: |-
        体の　中身は　空洞に　なっていて
        のぞきこんだ　相手を
        吸いこんでしまうと　言われている。
      ko: |-
        몸 안은 빈 공간으로
        이루어져 있어서 들여다본 상대를
        빨아들여 버린다고 전해진다.
      en: |-
        Its body is hollow. It is said that those who look
        into its body are sucked into the void.
      fr: |-
        Son corps est creux. On raconte que celui qui regarde
        à l’intérieur finira aspiré par le néant.
      de: |-
        Sein Körper ist hohl. Man sagt, dass diejenigen,
        die in den Körper blicken, hineingezogen werden.
      es: |-
        Su cuerpo está hueco. Se dice que quien mire dentro,
        será tragado por un agujero negro.
      it: |-
        Il suo corpo è vuoto. Pare che chiunque si avvicini
        per guardare dentro venga risucchiato.
    omega-ruby:
      ja-Hrkt: |-
        からだの　なかみは　くうどうで　なにも　ない。
        ブラックホールの　ように　なんでも　すいこみ
        すいこまれると　もどって　これないと　いわれる。
      ja: |-
        体の　中身は　空洞で　なにも　ない。
        ブラックホールの　ように　なんでも　吸い込み
        吸い込まれると　戻って　これないと　いわれる。
      ko: |-
        몸 안에는 텅 비어서 아무것도 없다.
        블랙홀처럼 무엇이든 빨아들이며
        빨려 들어가면 되돌아 올 수 없다고 전해진다.
      en: |-
        Dusclops’s body is completely hollow—there is nothing at all
        inside. It is said that its body is like a black hole. This
        Pokémon will absorb anything into its body, but nothing will
        ever come back out.
      fr: |-
        Le corps de Téraclope est totalement creux. Il n’y a rien
        du tout à l’intérieur. On raconte que son corps est comme
        un trou noir. Ce Pokémon peut absorber n’importe quoi,
        mais rien n’en ressort jamais.
      de: |-
        Zwirrklops Körper ist komplett hohl. Es wird auch mit einem
        Schwarzen Loch verglichen. Dieses Pokémon nimmt alles
        in seinem Körper auf, es kommt jedoch nichts wieder heraus.
      es: |-
        Dusclops está completamente hueco por dentro. Dicen que su
        cuerpo es como un agujero negro. Este Pokémon es capaz de
        absorber cualquier cosa, pero cosa que absorba, cosa que no
        dejará salir nunca más.
      it: |-
        Il corpo di Dusclops è completamente vuoto. Non contiene
        assolutamente nulla. Infatti si dice che sia una sorta di
        buco nero. Il Pokémon assorbe ogni cosa all’interno del
        proprio corpo, ma non rilascia mai nulla.
    alpha-sapphire:
      ja-Hrkt: |-
        どんな　おおきさの　ものも　すいこんで　しまう。
        あやしげな　ての　うごきと　ひとつめの　ちからで
        あいてを　さいみん　じょうたいにして　あやつる。
      ja: |-
        どんな　大きさの　ものも　吸いこんで　しまう。
        怪しげな　手の　動きと　一つ目の　力で
        相手を　催眠　状態にして　操る。
      ko: |-
        아무리 큰 것도 빨아들인다.
        괴상한 손의 움직임과 외눈의 힘으로
        상대를 최면 상태로 만들어 조종한다.
      en: |-
        Dusclops absorbs anything, however large the object may be.
        This Pokémon hypnotizes its foe by waving its hands in a
        macabre manner and by bringing its single eye to bear.
        The hypnotized foe is made to do Dusclops’s bidding.
      fr: |-
        Téraclope peut absorber des objets de toute taille.
        Ce Pokémon hypnotise son ennemi en faisant des gestes
        macabres et en attirant l’attention sur son unique œil.
        L’ennemi hypnotisé obéit ensuite aux ordres de Téraclope.
      de: |-
        Zwirrklop absorbiert alles, egal, wie groß es auch sein mag.
        Dieses Pokémon hypnotisiert seinen Gegner, indem es auf
        makabre Weise winkt und sein einziges Auge zeigt.
        Der hypnotisierte Gegner führt dann seine Befehle aus.
      es: |-
        Dusclops absorbe todo lo que pilla, al margen del tamaño que
        tenga. Este Pokémon hipnotiza a su rival moviendo las manos
        de forma macabra y usando el ojo de manera implacable.
        Una vez hipnotizado, el enemigo obedecerá.
      it: |-
        Dusclops assorbe qualsiasi cosa indipendentemente dalle sue
        dimensioni. Questo Pokémon ipnotizza il nemico con un
        macabro movimento delle mani e con il suo unico occhio,
        costringendolo a eseguire i suoi ordini.
    sword:
      ja-Hrkt: |-
        からだの　なかは　からっぽ。
        くちを　あけると　ブラックホールの
        ように　なんでも　すいこんでしまう。
      ja: |-
        体の　中は　空っぽ。
        口を　開けると　ブラックホールの
        ように　なんでも　吸いこんでしまう。
      ko: |-
        몸속은 텅 비어 있다.
        입을 열면 블랙홀처럼
        무엇이든 빨아들인다.
      zh-Hant: |-
        身體內部是空的。
        只要一張開嘴就會像
        黑洞一樣吸入所有東西。
      zh-Hans: |-
        身体内部是空的。
        只要一张开嘴就会像
        黑洞一样吸入所有东西
      en: |-
        Its body is entirely hollow. When it opens its
        mouth, it sucks everything in as if it were a
        black hole.
      fr: |-
        Son corps est complètement creux. Quand il ouvre
        la bouche, il aspire tout ce qui passe près de lui,
        à la façon d’un trou noir.
      de: |-
        Sein Körper ist vollkommen hohl. Wenn es sein
        Maul öffnet, saugt es wie ein schwarzes Loch
        alles in sich auf.
      es: |-
        Está completamente hueco. Cuando abre la
        boca, es capaz de absorber cualquier cosa,
        como si fuera un agujero negro.
      it: |-
        L’interno del suo corpo è completamente vuoto.
        Apre la bocca per risucchiare qualsiasi cosa,
        come un buco nero.
    shield:
      ja-Hrkt: |-
        さまよっている　ひとだまを　みつけ
        からっぽの　たいないに　すいこむ。
        すいこまれて　どうなるかは　なぞ。
      ja: |-
        さまよっている　人魂を　見つけ
        空っぽの　体内に　吸いこむ。
        吸いこまれて　どうなるかは　謎。
      ko: |-
        떠도는 사람의 영혼을 찾아
        텅 빈 체내로 빨아들인다.
        그 후 영혼이 어떻게 되는지는 알 수 없다.
      zh-Hant: |-
        尋找遊盪的靈魂，吸入自己
        空洞的身體裡。沒人知道
        被吸入後會發生什麼事。
      zh-Hans: |-
        寻找游走的灵魂，吸入自己
        空洞的身体里。没人知道
        被吸入后会发生什么事。
      en: |-
        It seeks drifting will-o’-the-wisps and sucks them
        into its empty body. What happens inside is
        a mystery.
      fr: |-
        Il cherche des feux follets pour les avaler.
        Ce qu’il se passe alors à l’intérieur de son corps
        vide est un mystère.
      de: |-
        Es sucht umherirrende Seelen und saugt sie in
        seinen leeren Körper. Was dann mit ihnen
        passiert, ist ein Rätsel.
      es: |-
        Busca fuegos fatuos y los absorbe en su cuerpo
        hueco. Lo que pasa dentro luego es un misterio.
      it: |-
        Va in cerca di fuochi fatui e li risucchia nel
        suo corpo vuoto. Cosa succeda all’interno
        è un mistero.
