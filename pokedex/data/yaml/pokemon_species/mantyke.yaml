mantyke:
  base_happiness: 50
  capture_rate: 25
  color: blue
  egg_groups:
    - no-eggs
  evolution_chain: mantine
  evolves_from: ~
  flavor_text:
    diamond:
      en: |-
        A friendly Pokémon that captures
        the subtle flows of seawater using
        its two antennae.
    pearl:
      en: |-
        Scientists discovered that the
        distinctive patterns on its back
        differ by region.
    platinum:
      en: |-
        People organize tours to see this
        Pokémon frolic and skim the tops
        of waves with REMORAID.
    heartgold:
      en: |-
        When it swims close to the surface of the
        ocean, people aboard ships are able to
        observe the pattern on its back.
    soulsilver:
      en: |-
        When it swims close to the surface of the
        ocean, people aboard ships are able to
        observe the pattern on its back.
    black:
      en: |-
        People organize tours to see this
        Pokémon frolic and skim the tops
        of waves with Remoraid.
      fr: |-
        On organise des excursions pour le
        voir surfer sur les vagues au côté
        des Rémoraid.
    white:
      en: |-
        People organize tours to see this
        Pokémon frolic and skim the tops
        of waves with Remoraid.
      fr: |-
        On organise des excursions pour le
        voir surfer sur les vagues au côté
        des Rémoraid.
    black-2:
      en: |-
        The pattern on its back
        varies by region. It often
        swims in a school of Remoraid.
    white-2:
      en: |-
        The pattern on its back
        varies by region. It often
        swims in a school of Remoraid.
    x:
      ja-Hrkt: |-
        せなかの　もようは　ちいきによって
        ことなっている。テッポウオの　むれに
        まざって　およぐことが　おおい。
      ja: |-
        背中の　模様は　地域によって
        異なっている。テッポウオの　群れに
        混ざって　泳ぐことが　多い。
      ko: |-
        등의 무늬는 지역에 따라
        달라진다. 총어 무리에
        섞여 헤엄치는 일이 많다.
      en: |-
        The pattern on its back varies by region.
        It often swims in a school of Remoraid.
      fr: |-
        Les motifs sur son dos sont différents selon les
        régions. On le voit souvent dans des bancs de
        Rémoraid.
      de: |-
        Ihre Rücken sind je nach Region unterschiedlich
        gemustert. Oft mischen sie sich unter
        Remoraid-Schwärme.
      es: |-
        Los símbolos de su espalda cambian según la región.
        A veces se mezcla con bancos de Remoraid y nada
        junto a ellos.
      it: |-
        Il disegno sul suo dorso cambia a seconda della
        regione. Nuota spesso assieme ai branchi di Remoraid.
    'y':
      ja-Hrkt: |-
        かいめんの　ちかくを　およぐため
        ふねの　うえから　せなかの　もようを
        かんさつする　ことが　できる。
      ja: |-
        海面の　近くを　泳ぐため
        船の　上から　背中の　模様を
        観察する　ことが　できる。
      ko: |-
        해수면 근처에서 헤엄치므로
        배 위에서 등 모양을
        관찰할 수 있다.
      en: |-
        When it swims close to the surface of the ocean,
        people aboard ships are able to observe the pattern
        on its back.
      fr: |-
        Il nage si proche de la surface que l’on peut voir
        les motifs sur son dos depuis un bateau.
      de: |-
        Da es nah an der Meeresoberfläche schwimmt, kann
        man sein Rückenmuster von Schiffen aus erspähen.
      es: |-
        Cuando nada cerca de la superficie, pueden
        observarse los dibujos de su lomo desde los barcos.
      it: |-
        Poiché Mantyke nuota in superficie, si possono
        ammirare i disegni sulla sua schiena da
        un’imbarcazione.
    omega-ruby:
      ja-Hrkt: |-
        せなかの　もようは　ちいきによって
        ことなっている。テッポウオの　むれに
        まざって　およぐことが　おおい。
      ja: |-
        背中の　模様は　地域によって
        異なっている。テッポウオの　群れに
        混ざって　泳ぐことが　多い。
      ko: |-
        등의 무늬는 지역에 따라
        달라진다. 총어 무리에
        섞여 헤엄치는 일이 많다.
      en: |-
        The pattern on its back varies by region.
        It often swims in a school of Remoraid.
      fr: |-
        Les motifs sur son dos sont différents selon les régions.
        On le voit souvent dans des bancs de Rémoraid.
      de: |-
        Ihre Rücken sind je nach Region unterschiedlich gemustert.
        Oft mischen sie sich unter Remoraid-Schwärme.
      es: |-
        Los símbolos de su espalda cambian según la región. A veces
        se mezcla con bancos de Remoraid y nada junto a ellos.
      it: |-
        Il disegno sul suo dorso cambia a seconda della regione.
        Nuota spesso assieme ai branchi di Remoraid.
    alpha-sapphire:
      ja-Hrkt: |-
        かいめんの　ちかくを　およぐため
        ふねの　うえから　せなかの　もようを
        かんさつする　ことが　できる。
      ja: |-
        海面の　近くを　泳ぐため
        船の　上から　背中の　模様を
        観察する　ことが　できる。
      ko: |-
        해수면 근처에서 헤엄치므로
        배 위에서 등 모양을
        관찰할 수 있다.
      en: |-
        When it swims close to the surface of the ocean,
        people aboard ships are able to observe the pattern
        on its back.
      fr: |-
        Il nage si proche de la surface que l’on peut voir les motifs
        sur son dos depuis un bateau.
      de: |-
        Da es nah an der Meeresoberfläche schwimmt, kann man
        sein Rückenmuster von Schiffen aus erspähen.
      es: |-
        Cuando nada cerca de la superficie, pueden observarse los
        dibujos de su lomo desde los barcos.
      it: |-
        Poiché Mantyke nuota in superficie, si possono ammirare
        i disegni sulla sua schiena da un’imbarcazione.
    ultra-sun:
      ja-Hrkt: |-
        とても　ひとなつっこく　よくなつく。
        タマンタとの　ふれあい　ツアーは
        だいにんきの　ビーチアクティビティ。
      ja: |-
        とても　人懐っこく　よく懐く。
        タマンタとの　ふれあい　ツアーは
        大人気の　ビーチアクティビティ。
      ko: |-
        매우 사람을 잘 따른다.
        타만타 체험 투어는
        인기가 많은 비치 액티비티다.
      zh-Hant: |-
        性情毫不怕生，很容易親近人。
        與小球飛魚互動的行程
        是非常受歡迎的海灘活動。
      zh-Hans: |-
        非常不认生，很容易亲近。
        与小球飞鱼的互动巡游
        是非常受欢迎的海滩活动。
      en: |-
        It’s highly friendly and easily tamed. Tours that
        take people swimming with Mantyke are a
        super-popular beach activity.
      fr: |-
        Il est très affectueux et adore les humains.
        Les excursions permettant d’aller nager avec
        lui sont très populaires auprès des touristes.
      de: |-
        Ein sehr zahmes, zutrauliches Pokémon. Touren,
        bei denen man Mantirps begegnen kann, sind
        eine beliebte Freizeitaktivität an Küstenorten.
      es: |-
        Es un Pokémon muy afable y profesa cariño por
        los humanos. Los tours para nadar con Mantyke
        se han convertido en una actividad muy popular.
      it: |-
        È molto socievole e si affeziona facilmente.
        Nuotare assieme ai Mantyke accompagnati da
        una guida è un’attività tipica delle zone balneari.
    ultra-moon:
      ja-Hrkt: |-
        ひとなつっこく　にんげんの　ふねの
        ちかくまで　よってくる。　せなかの
        もようは　ちいきによって　ことなる。
      ja: |-
        人懐っこく　人間の　船の
        近くまで　よってくる。　背中の
        模様は　地域によって　異なる。
      ko: |-
        사람을 잘 따라서 인간의 배
        근처까지 다가온다. 등의
        모양은 지역에 따라 다르다.
      zh-Hant: |-
        很親近人類，會主動靠近
        人類的船隻。背上的花紋
        依地域而有所不同。
      zh-Hans: |-
        不认生，会靠近人类的船只。
        背上的花纹根据地域而有所不同。
      en: |-
        Mantyke are friendly toward people and will
        approach boats closely. The patterns on their
        backs differ depending on their habitat.
      fr: |-
        Il s’approche souvent des bateaux pour
        sympathiser avec les humains. Le motif
        qui orne son dos varie selon son habitat.
      de: |-
        Es ist so zutraulich, dass es sich sogar Schiffen
        voller Menschen nähert. Die Rückenmuster von
        Mantirps sind in jeder Region unterschiedlich.
      es: |-
        Su carácter afable lo lleva a acercarse sin temor
        a barcos con presencia humana. Los dibujos del
        lomo cambian según la región.
      it: |-
        Si avvicina spesso alle imbarcazioni per
        socializzare con gli esseri umani. Il disegno
        sul dorso è diverso a seconda della regione.
    sword:
      ja-Hrkt: |-
        うみの　すいおんが　ひくいためか
        ガラルちほうに　すむ　タマンタは
        やや　うごきが　にぶいらしい。
      ja: |-
        海の　水温が　低いためか
        ガラル地方に　棲む　タマンタは
        やや　動きが　鈍いらしい。
      ko: |-
        바다의 수온이 낮기 때문인지
        가라르지방에 사는 타만타는
        약간 움직임이 둔한 듯하다.
      zh-Hant: |-
        也許是因為海水溫度偏低，
        伽勒爾地區的小球飛魚
        動作似乎有點遲緩。
      zh-Hans: |-
        也许是因为海水温度偏低，
        伽勒尔地区的小球飞鱼
        动作似乎有点迟缓。
      en: |-
        Mantyke living in Galar seem to be somewhat
        sluggish. The colder waters of the seas in this
        region may be the cause.
      fr: |-
        Les Babimanta vivant à Galar semblent un peu
        engourdis. Cela pourrait être dû à la basse
        température de la mer.
      de: |-
        Vielleicht liegt es an der niedrigen Temperatur
        des Meeres, aber die Mantirps der Galar-Region
        bewegen sich etwas schwerfälliger als andere.
      es: |-
        Los Mantyke que habitan en los mares de Galar
        se mueven con lentitud, posiblemente por la baja
        temperatura de las aguas de la región.
      it: |-
        I Mantyke che vivono a Galar si muovono
        lentamente, forse per via della temperatura
        del mare relativamente bassa.
    shield:
      ja-Hrkt: |-
        テッポウオの　むれに　まざって
        およぐ。　てきに　おそわれると
        むれと　いっしょに　たたかうよ。
      ja: |-
        テッポウオの　群れに　混ざって
        泳ぐ。　敵に　襲われると
        群れと　いっしょに　戦うよ。
      ko: |-
        총어 무리에 섞여서 헤엄친다.
        적에게 습격당하면
        무리와 함께 싸운다.
      zh-Hant: |-
        混在鐵炮魚的大群裡游泳。
        受到敵人襲擊的時候，
        會和鐵炮魚們並肩作戰。
      zh-Hans: |-
        混在铁炮鱼的大群里游泳。
        受到敌人袭击的时候，
        会和铁炮鱼们并肩作战。
      en: |-
        It swims along with a school of Remoraid, and
        they’ll all fight together to repel attackers.
      fr: |-
        Il nage au sein des bancs de Rémoraid.
        Lorsqu’un prédateur les attaque, il se bat
        à leurs côtés.
      de: |-
        Es mischt sich unter Remoraid-Schwärme und
        schwimmt mit ihnen. Werden diese angegriffen,
        kämpft es gemeinsam an ihrer Seite.
      es: |-
        Nada con los bancos de Remoraid y lucha junto
        a ellos cuando los ataca un enemigo.
      it: |-
        Nuota in mezzo ai banchi di Remoraid
        e lotta assieme a loro quando vengono
        attaccati.
    legends-arceus:
      en: |-
        Though ball-like in shape, this Pokémon is a proficient swimmer.
        I have discovered that if a Mantyke spends much time with
        schools of Remoraid, it will eventually achieve evolution.
