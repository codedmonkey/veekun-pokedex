    black-2:
      en: |-
        It feeds on the dark emotions of
        sadness and hatred, which make it
        grow steadily stronger.
    white-2:
      en: |-
        It feeds on the dark emotions of
        sadness and hatred, which make it
        grow steadily stronger.
    x:
      ja-Hrkt: |-
        あたまの　ツノで　うらみや　ねたみの
        かんじょうを　たべると　いわれる。
        まよなか　かっぱつに　かつどうする。
      ja: |-
        頭の　ツノで　恨みや　ねたみの
        感情を　食べると　言われる。
        真夜中　活発に　活動する。
      ko: |-
        머리의 뿔로 원한과 질투의
        감정을 먹는다고 전해진다.
        한밤중에 활발하게 활동한다.
      en: |-
        It uses its horn to feed on envy and malice--
        or so it’s said. It’s very active at night.
      fr: |-
        Ce Pokémon, très actif la nuit, utilise sa corne pour
        se repaître de rancune ou de jalousie.
      de: |-
        Man sagt, durch sein Horn ernähre es sich von
        Rachsucht und Neid. Erst nachts wird es richtig aktiv.
      es: |-
        Dicen que con su cuerno se alimenta de sentimientos
        de celos y envidia. Es muy activo a medianoche.
      it: |-
        Si dice che si nutra di rancore e invidia con il corno
        che ha sulla testa. A mezzanotte si scatena.
    'y':
      ja-Hrkt: |-
        うらみの　かんじょうが　だいすき。
        うらみを　もつ　ひとが　すむ　いえの
        のきしたに　ずらりと　ぶらさがる。
      ja: |-
        恨みの　感情が　大好き。
        恨みを　持つ　人が　住む　家の
        軒下に　ずらりと　ぶらさがる。
      ko: |-
        원망하는 감정을 매우 좋아한다.
        원한을 가지고 있는 사람이 사는 집
        처마 밑에 죽 매달려 있다.
      en: |-
        It loves vengeful emotions and hangs in rows under
        the eaves of houses where vengeful people live.
      fr: |-
        Il aime le goût de la vengeance. Les Pokémon de
        cette espèce vivent en rangs sous les gouttières
        des gens vindicatifs.
      de: |-
        Es liebt Rachegefühle. Diese Pokémon hängen sich
        an Dachrinnen von Häusern, in denen Rachsüchtige
        leben.
      es: |-
        Les atraen los sentimientos de rencor y celos.
        Suelen vivir cerca de las casas de gente vengativa.
      it: |-
        Si annida sotto le grondaie di case dove vive gente
        che cova sentimenti di vendetta, che lui adora.
    omega-ruby:
      ja-Hrkt: |-
        ねたみ　うらみの　かんじょうに　ひきよせられる。
        だれかを　うらむ　こころが　つよく　なると
        カゲボウズが　のきしたに　ずらりと　ならぶぞ。
      ja: |-
        ねたみ　恨みの　感情に　引き寄せられる。
        誰かを　恨む　心が　強く　なると
        カゲボウズが　軒下に　ずらりと　並ぶぞ。
      ko: |-
        질투와 원한의 감정에 이끌린다.
        누군가를 원망하는 마음이 강해지면
        어둠대신이 처마 밑에 죽 줄을 선다.
      en: |-
        Shuppet is attracted by feelings of jealousy and vindictiveness.
        If someone develops strong feelings of vengeance, this
        Pokémon will appear in a swarm and line up beneath the eaves
        of that person’s home.
      fr: |-
        Les Polichombr sont attirés par les sentiments de jalousie
        et les esprits revanchards. Si quelqu’un veut se venger,
        ces Pokémon apparaissent en nuée et s’alignent devant
        la porte des gens concernés.
      de: |-
        Shuppet wird durch Gefühle wie Neid und Rachsucht
        angezogen. Wenn jemand starke Rachegelüste entwickelt,
        erscheinen diese Pokémon in Scharen und reihen sich unter
        der Dachrinne des Hauses dieser Person auf.
      es: |-
        A Shuppet le atraen los sentimientos de celos y rencor.
        Si alguien desarrolla fuertes sentimientos de venganza,
        aparecerá una multitud de Shuppet que se quedará bajo
        los aleros de su casa.
      it: |-
        Shuppet è attratto dai sentimenti turpi di gelosia e vendetta.
        Se qualcuno serba un forte rancore, questi Pokémon arrivano
        a frotte per annidarsi sotto i cornicioni di casa sua.
    alpha-sapphire:
      ja-Hrkt: |-
        ひとの　こころに　ある　うらみや　ねたみ　などの
        かんじょうを　たべて　せいちょうする　ポケモン。
        うらむ　こころを　さがして　まちを　さまよう。
      ja: |-
        人の　心に　ある　うらみや　ねたみ　などの
        感情を　食べて　成長する　ポケモン。
        恨む　心を　探して　街を　さまよう。
      ko: |-
        사람의 마음속에 있는 원한과 질투 같은
        감정을 먹고 성장하는 포켓몬이다.
        원망하는 마음을 찾아 마을을 헤맨다.
      en: |-
        Shuppet grows by feeding on dark emotions, such as
        vengefulness and envy, in the hearts of people. It roams
        through cities in search of grudges that taint people.
      fr: |-
        Polichombr grandit en se nourrissant des émotions négatives
        des gens, comme le désir de vengeance ou la jalousie. Il erre
        dans les villes à la recherche des gens qui n’ont pas le moral.
      de: |-
        Shuppet wächst, indem es sich von düsteren Gefühlen
        wie Rachsucht und Neid ernährt. Es streift durch Städte
        und sucht nach Empfindungen, die als Ursache für den
        Verderb der Menschen gelten.
      es: |-
        Shuppet crece alimentándose de sentimientos negativos,
        como el rencor y la envidia, que nacen en el corazón de las
        personas. Se dedica a vagar por las ciudades en busca del
        rencor que contamina a la gente.
      it: |-
        Shuppet cresce alimentandosi di sentimenti turpi, come la
        vendetta e l’invidia, insiti nel cuore delle persone. Si aggira
        per le città in cerca del rancore che insudicia gli animi.
    ultra-sun:
      ja-Hrkt: |-
        うらみ　ねたみ　そねみの　ような
        かんじょうを　くらうので　ひとに
        よっては　ありがたい　そんざいだ。
      ja: |-
        恨み　妬み　嫉みの　ような
        感情を　食らうので　人に　よっては
        ありがたい　存在だ。
      ko: |-
        원한, 시샘, 질투 같은
        감정을 먹기 때문에 사람에게는
        고마운 존재다.
      zh-Hant: |-
        因為會吞食怨恨、嫉妒
        之類的情感，對某些人來說
        是很可貴的寶可夢。
      zh-Hans: |-
        因为会吞食类似于
        怨恨、嫉妒之类的感情，
        所以对于有的人来说是可贵的存在。
      en: |-
        It eats up emotions like malice, jealousy, and
        resentment, so some people are grateful for
        its presence.
      fr: |-
        Les gens apprécient ce Pokémon, car il se
        nourrit de leurs émotions négatives telles que
        la rancœur et la jalousie.
      de: |-
        Da es sich von Gefühlen wie Rachsucht, Neid
        und Eifersucht ernährt, sind die Menschen für
        die Existenz dieses Pokémon dankbar.
      es: |-
        Se alimenta de sentimientos negativos como la
        envidia, el rencor y el odio, así que su presencia
        es más que bienvenida por los humanos.
      it: |-
        Si nutre di sentimenti turpi come rancore, invidia
        e gelosia. Per questo, alcuni sono felici che
        esista.
    ultra-moon:
      ja-Hrkt: |-
        ひぐれに　カゲボウズが　ならぶような
        いえとは　つきあうな　と　いう
        ふるい　ことわざが　のこっている。
      ja: |-
        日暮れに　カゲボウズが　並ぶような
        家とは　付き合うな　と　いう
        古い　ことわざが　残っている。
      ko: |-
        해질녘에 어둠대신이 줄지어 있는
        집과는 어울리지 말라는
        오랜 속담이 남아 있다.
      zh-Hant: |-
        不要去跟那些在黃昏時有
        怨影娃娃在排隊的人家來往。
        這是自古流傳下來的諺語。
      zh-Hans: |-
        流传着这样的古老俗语，
        日暮时分，不要去
        排列着怨影娃娃的房子。
      en: |-
        There’s a proverb that says, “Shun the house
        where Shuppet gather in the growing dusk.”
      fr: |-
        Il existe un proverbe ancien qui dit :
        « Fuis la demeure où les Polichombr se
        rassemblent en nombre à la pénombre. »
      de: |-
        Einem alten Sprichwort zufolge soll man sich von
        Häusern fernhalten, an denen sich bei Einbruch
        der Dunkelheit Shuppet aneinanderreihen.
      es: |-
        Según un viejo proverbio, conviene mantenerse
        alejado de aquellas casas a las que se arrime
        una multitud de Shuppet cuando cae la noche.
      it: |-
        Un vecchio proverbio esorta a stare lontani
        dalle case in cui, al calar del sole, si annidano
        gli Shuppet.
