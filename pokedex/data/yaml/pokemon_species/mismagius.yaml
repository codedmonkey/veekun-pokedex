mismagius:
  base_happiness: 35
  capture_rate: 45
  color: purple
  egg_groups:
    - indeterminate
  evolution_chain: misdreavus
  evolves_from: misdreavus
  flavor_text:
    diamond:
      en: |-
        Its cries sound like incantations.
        Those hearing it are tormented
        by headaches and hallucinations.
    pearl:
      en: |-
        It chants incantations. While they
        usually torment targets, some
        chants bring happiness.
    platinum:
      en: |-
        Its cry sounds like an incantation.
        It is said the cry may rarely be
        imbued with happiness-giving power.
    heartgold:
      en: |-
        Its cries sound like incantations
        to torment the foe. It appears
        where you least expect it.
    soulsilver:
      en: |-
        Its cries sound like incantations
        to torment the foe. It appears
        where you least expect it.
    black:
      en: |-
        Its cry sounds like an incantation.
        It is said the cry may rarely be
        imbued with happiness-giving power.
      fr: |-
        Pareil à une incantation magique,
        son cri n’est que très rarement
        source de joie.
    white:
      en: |-
        Its cry sounds like an incantation.
        It is said the cry may rarely be
        imbued with happiness-giving power.
      fr: |-
        Pareil à une incantation magique,
        son cri n’est que très rarement
        source de joie.
    black-2:
      en: |-
        Its cry sounds like an incantation.
        It is said the cry may rarely be
        imbued with happiness-giving power.
    white-2:
      en: |-
        Its cry sounds like an incantation.
        It is said the cry may rarely be
        imbued with happiness-giving power.
    x:
      ja-Hrkt: |-
        じゅもんを　となえる　ポケモン。
        あいてを　くるしめるもの　だけでなく
        しあわせにする　じゅもんも　ある。
      ja: |-
        じゅもんを　唱える　ポケモン。
        相手を　苦しめるもの　だけでなく
        幸せにする　じゅもんも　ある。
      ko: |-
        주문을 외는 포켓몬이다.
        상대를 고통스럽게 하는 것뿐만
        아니라 행복하게 하는 주문도 있다.
      en: |-
        It chants incantations. While they usually torment
        targets, some chants bring happiness.
      fr: |-
        Il psalmodie des incantations. Ce sont souvent
        des malédictions, mais certaines apportent la joie.
      de: |-
        Es spricht Beschwörungen. Viele lösen Schmerzen
        aus, manche aber bringen Glück.
      es: |-
        Recita cánticos. Algunos de ellos atormentan a sus
        rivales, mientras que otros producen felicidad.
      it: |-
        Recita incantesimi che tormentano il nemico.
        Tuttavia, alcune formule portano felicità.
    'y':
      ja-Hrkt: |-
        じゅもんの　ような　あやしい
        なきごえで　あいてを　くるしめる。
        しんしゅつきぼつの　ポケモン。
      ja: |-
        じゅもんの　ような　怪しい　鳴き声で
        相手を　苦しめる。
        神出鬼没の　ポケモン。
      ko: |-
        주문 같은 수상한
        울음소리로 상대를 괴롭힌다.
        신출귀몰하는 포켓몬이다.
      en: |-
        Its cries sound like incantations to torment the foe.
        It appears where you least expect it.
      fr: |-
        Un Pokémon insaisissable qui tourmente ses ennemis
        avec son cri semblable à une incantation.
      de: |-
        Sein bizarrer, bannfluchartiger Ruf quält seine Gegner.
        Es verschwindet so plötzlich, wie es auftaucht.
      es: |-
        Atormenta a sus rivales con gritos que parecen
        conjuros. Aparece en ocasiones y lugares imprevistos.
      it: |-
        Tormenta i malcapitati con un verso simile a formule
        magiche. Appare dovunque in qualsiasi momento.
    omega-ruby:
      ja-Hrkt: |-
        じゅもんを　となえる　ポケモン。
        あいてを　くるしめるもの　だけでなく
        しあわせにする　じゅもんも　ある。
      ja: |-
        じゅもんを　唱える　ポケモン。
        相手を　苦しめるもの　だけでなく
        幸せにする　じゅもんも　ある。
      ko: |-
        주문을 외는 포켓몬이다.
        상대를 고통스럽게 하는 것뿐만
        아니라 행복하게 하는 주문도 있다.
      en: |-
        It chants incantations. While they usually torment
        targets, some chants bring happiness.
      fr: |-
        Il psalmodie des incantations. Ce sont souvent
        des malédictions, mais certaines apportent la joie.
      de: |-
        Es spricht Beschwörungen. Viele lösen Schmerzen aus,
        manche aber bringen Glück.
      es: |-
        Recita cánticos. Algunos de ellos atormentan a sus rivales,
        mientras que otros producen felicidad.
      it: |-
        Recita incantesimi che tormentano il nemico. Tuttavia, alcune
        formule portano felicità.
    alpha-sapphire:
      ja-Hrkt: |-
        じゅもんの　ような　あやしい
        なきごえで　あいてを　くるしめる。
        しんしゅつきぼつの　ポケモン。
      ja: |-
        じゅもんの　ような　怪しい　鳴き声で
        相手を　苦しめる。
        神出鬼没の　ポケモン。
      ko: |-
        주문 같은 수상한
        울음소리로 상대를 괴롭힌다.
        신출귀몰하는 포켓몬이다.
      en: |-
        Its cries sound like incantations to torment the foe.
        It appears where you least expect it.
      fr: |-
        Un Pokémon insaisissable qui tourmente ses ennemis avec
        son cri semblable à une incantation.
      de: |-
        Sein bizarrer, bannfluchartiger Ruf quält seine Gegner.
        Es verschwindet so plötzlich, wie es auftaucht.
      es: |-
        Atormenta a sus rivales con gritos que parecen conjuros.
        Aparece en ocasiones y lugares imprevistos.
      it: |-
        Tormenta i malcapitati con un verso simile a formule magiche.
        Appare dovunque in qualsiasi momento.
    sun:
      ja-Hrkt: |-
        どこからともなく　あらわれ　じゅもんを
        つぶやき　のろいを　かけたり
        おそろしい　まぼろしを　みせる。
      ja: |-
        どこからともなく　現れ　呪文を
        つぶやき　呪いを　かけたり
        恐ろしい　幻を　みせる。
      ko: |-
        예고 없이 나타나
        주문을 외워 저주를 걸거나
        무서운 환상을 보여준다.
      zh-Hant: |-
        不知從何處出現，
        碎碎念著咒文，施加詛咒，
        製造恐怖的幻象。
      zh-Hans: |-
        不知从何处出现，
        碎碎念着咒文，施加诅咒，
        制造恐怖的幻象。
      en: |-
        It appears as if from nowhere—muttering
        incantations, placing curses, and giving
        people terrifying visions.
      fr: |-
        Un Pokémon aux pouvoirs terrifiants : il sort de
        nulle part en maugréant des incantations et en
        lançant des malédictions.
      de: |-
        Es erscheint aus dem Nichts, flüstert
        Beschwörungen, spricht Flüche aus und
        erzeugt furchteinflößende Trugbilder.
      es: |-
        Aparece de la nada sin previo aviso y lanza
        conjuros por medio de cánticos. Quienes los
        escuchan pueden sufrir terroríficas visiones.
      it: |-
        Appare dal nulla recitando formule magiche
        che causano sventura o provocano spaventose
        visioni.
    moon:
      ja-Hrkt: |-
        こいの　ねがいが　かなう　のろいを
        かけることも　あるので　いのちがけで
        ムウマージを　さがすものも　いる。
      ja: |-
        恋の　願いが　かなう　呪いを
        かけることも　あるので　命懸けで
        ムウマージを　探す者も　いる。
      ko: |-
        사랑의 소원을 이뤄주는 저주를
        하는 일도 있어서 목숨을 걸고
        무우마직을 찾는 자도 있다.
      zh-Hant: |-
        因為也會施加實現戀愛願望的咒語，
        所以也有不惜性命尋找夢妖魔的人。
      zh-Hans: |-
        因为也会施加实现恋爱愿望的咒语，
        所以也有拼命寻找梦妖魔的人。
      en: |-
        Mismagius have been known to cast spells to
        make people fall in love, so some people search
        for this Pokémon as if their life depended on it.
      fr: |-
        Comme Magirêve aurait le pouvoir de réaliser
        les souhaits des amoureux, certaines personnes
        se lancent désespérément à sa poursuite.
      de: |-
        Manche Leute suchen verzweifelt nach einem
        Traunmagil, weil es mit seinen Beschwörungen
        Liebeswünsche in Erfüllung gehen lassen kann.
      es: |-
        Es capaz de lanzar hechizos y conjuros de
        amor, por lo que hay gente totalmente
        obsesionada con encontrar a un Mismagius.
      it: |-
        Conosce formule magiche e incantesimi
        d’amore. Molti fanno della sua ricerca la loro
        ragione di vita.
    ultra-sun:
      ja-Hrkt: |-
        たたりや　のろいを　ふりまくとして
        おそれられて　きた。　きまぐれに
        ひとをたすける　じゅもんも　つかう。
      ja: |-
        祟りや　呪いを　振りまくとして
        恐れられて　きた。　気まぐれに
        人を助ける　呪文も　使う。
      ko: |-
        닥치는 대로 재앙과 저주를 내려
        두려움의 대상이었다. 변덕을 부려
        사람을 돕는 주문도 사용하기도 한다.
      zh-Hant: |-
        因為會四處作祟並散播詛咒
        而被人們畏懼。有時也會
        隨性地使用幫助人的咒語。
      zh-Hans: |-
        因为四处作祟，播撒诅咒
        而被人们所恐惧。
        也会随性地使用帮助人类的咒文。
      en: |-
        Feared for its wrath and the curses it spreads,
        this Pokémon will also, on a whim, cast spells
        that help people.
      fr: |-
        Redouté pour ses sortilèges et ses malédictions,
        ce Pokémon peut néanmoins faire preuve de
        bienveillance, si l’envie lui en prend.
      de: |-
        Es wird für seine Flüche und Beschwörungen
        gefürchtet. Wenn ihm danach ist, spricht es
        auch mal Bannsprüche, die Menschen helfen.
      es: |-
        Es temido por su afición a lanzar maldiciones y
        conjuros a diestro y siniestro, pero a veces le
        da por usar la magia para ayudar a alguien.
      it: |-
        È temuto perché lancia maledizioni e causa
        sventure, ma a volte decide di usare i suoi
        incantesimi per aiutare le persone.
    ultra-moon:
      ja-Hrkt: |-
        のろいの　ことばを　つぶやいて
        ひどい　ずつうや　おそろしい
        まぼろしを　みせて　くるしめる。
      ja: |-
        呪いの　言葉を　つぶやいて
        ひどい　頭痛や　恐ろしい
        幻を　見せて　苦しめる。
      ko: |-
        저주의 말을 중얼거리며
        심한 두통이나 무서운
        환상을 보여 줘서 괴롭힌다.
      zh-Hant: |-
        會喃喃唸誦詛咒的話語，
        使對手激烈頭痛，或是看見
        恐怖的幻覺，藉此折磨對手。
      zh-Hans: |-
        会吟诵诅咒的语言，
        让对方极度头疼，或是看到
        恐怖的幻觉，深受折磨。
      en: |-
        Its muttered curses can cause awful headaches
        or terrifying visions that torment others.
      fr: |-
        Il susurre des malédictions pour tourmenter
        ses ennemis et leur infliger de terribles
        migraines ou des hallucinations terrifiantes.
      de: |-
        Es verursacht schreckliche Qualen, indem es
        Flüche flüstert, die schlimme Kopfschmerzen
        und fürchterliche Halluzinationen auslösen.
      es: |-
        Murmura conjuros para atormentar al enemigo y
        provocarle dolores de cabeza insoportables o
        visiones terroríficas.
      it: |-
        Infligge tormenti al nemico recitando formule
        malefiche che causano terribili emicranie o
        provocano spaventose visioni.
