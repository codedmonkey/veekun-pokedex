ferroseed:
  base_happiness: 50
  capture_rate: 255
  color: gray
  egg_groups:
    - plant
    - mineral
  evolution_chain: ferroseed
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        When threatened, it attacks by
        shooting a barrage of spikes, which gives
        it a chance to escape by rolling away.
      fr: |-
        Quand il sent un danger, il réagit en
        projetant toutes ses épines d’un coup
        et s’enfuit en roulant sur lui-même.
    white:
      en: |-
        They stick their spikes into cave
        walls and absorb the minerals
        they find in the rock.
      fr: |-
        Il s’accroche aux parois des grottes
        à l’aide de ses épines et absorbe les
        minéraux contenus dans la roche.
    black-2:
      en: |-
        It absorbs the iron it finds in the
        rock while clinging to the ceiling.
        It shoots spikes when in danger.
    white-2:
      en: |-
        It absorbs the iron it finds in the
        rock while clinging to the ceiling.
        It shoots spikes when in danger.
    x:
      ja-Hrkt: |-
        きけんを　さっちすると　トゲを
        いっせいに　はっしゃして　はんげき。
        その　すきに　ころがって　にげる。
      ja: |-
        危険を　察知すると　トゲを
        いっせいに　発射して　反撃。
        その　すきに　転がって　逃げる。
      ko: |-
        위험을 감지하면 가시를
        일제히 발사하여 반격한다.
        그 틈에 몸을 굴려 도망간다.
      en: |-
        When threatened, it attacks by shooting a barrage
        of spikes, which gives it a chance to escape by
        rolling away.
      fr: |-
        Quand il sent un danger, il réagit en projetant toutes
        ses épines d’un coup et s’enfuit en roulant sur
        lui-même.
      de: |-
        Fühlt es sich bedroht, wehrt es sich, indem es
        eine großzügige Salve Dornen abfeuert.
      es: |-
        Lanza numerosas púas al detectar peligro. En cuanto
        tiene ocasión, echa a rodar y se escapa.
      it: |-
        Quando avverte un pericolo, reagisce sparando
        simultaneamente tutti i suoi aculei, per poi fuggire
        via rotolando.
    'y':
      ja-Hrkt: |-
        ほらあなの　てんじょうに　つきささり
        いわの　てつぶんを　すいとる。
        きけんがせまると　トゲを　うちだす。
      ja: |-
        洞穴の　天井に　突きささり
        岩の　鉄分を　吸いとる。
        危険がせまると　トゲを　撃ち出す。
      ko: |-
        동굴 천장에 박혀서
        바위의 철분을 흡수한다.
        위험이 닥치면 바늘을 쏜다.
      en: |-
        It absorbs the iron it finds in the rock while clinging
        to the ceiling. It shoots spikes when in danger.
      fr: |-
        Il s’accroche aux parois des grottes et en absorbe
        les minéraux. Il projette ses épines en cas de danger.
      de: |-
        Hakt sich an der Decke von Höhlen fest und saugt
        die Mineralien aus dem Gestein. Bei Gefahr feuert es
        Dornen ab.
      es: |-
        Absorbe los componentes ferruginosos de las rocas al
        colgarse del techo de las cuevas. Dispara púas si se
        ve en peligro.
      it: |-
        Si conficca nelle pareti delle grotte e assorbe i
        minerali delle rocce. Quando avverte un pericolo,
        spara i suoi aculei.
    omega-ruby:
      ja-Hrkt: |-
        きけんを　さっちすると　トゲを
        いっせいに　はっしゃして　はんげき。
        その　すきに　ころがって　にげる。
      ja: |-
        危険を　察知すると　トゲを
        いっせいに　発射して　反撃。
        その　すきに　転がって　逃げる。
      ko: |-
        위험을 감지하면 가시를
        일제히 발사하여 반격한다.
        그 틈에 몸을 굴려 도망간다.
      en: |-
        When threatened, it attacks by shooting a barrage
        of spikes, which gives it a chance to escape by
        rolling away.
      fr: |-
        Quand il sent un danger, il réagit en projetant toutes
        ses épines d’un coup et s’enfuit en roulant sur lui-même.
      de: |-
        Fühlt es sich bedroht, wehrt es sich, indem es eine großzügige
        Salve Dornen abfeuert.
      es: |-
        Lanza numerosas púas al detectar peligro. En cuanto tiene
        ocasión, echa a rodar y se escapa.
      it: |-
        Quando avverte un pericolo, reagisce sparando
        simultaneamente tutti i suoi aculei, per poi fuggire
        via rotolando.
    alpha-sapphire:
      ja-Hrkt: |-
        ほらあなの　てんじょうに　つきささり
        いわの　てつぶんを　すいとる。
        きけんがせまると　トゲを　うちだす。
      ja: |-
        洞穴の　天井に　突きささり
        岩の　鉄分を　吸いとる。
        危険がせまると　トゲを　撃ち出す。
      ko: |-
        동굴 천장에 박혀서
        바위의 철분을 흡수한다.
        위험이 닥치면 바늘을 쏜다.
      en: |-
        It absorbs the iron it finds in the rock while clinging
        to the ceiling. It shoots spikes when in danger.
      fr: |-
        Il s’accroche aux parois des grottes et en absorbe
        les minéraux. Il projette ses épines en cas de danger.
      de: |-
        Hakt sich an der Decke von Höhlen fest und saugt die
        Mineralien aus dem Gestein. Bei Gefahr feuert es Dornen ab.
      es: |-
        Absorbe los componentes ferruginosos de las rocas al
        colgarse del techo de las cuevas. Dispara púas si se ve
        en peligro.
      it: |-
        Si conficca nelle pareti delle grotte e assorbe i minerali
        delle rocce. Quando avverte un pericolo, spara i suoi aculei.
    sword:
      ja-Hrkt: |-
        トゲを　とばして　みを　まもる。
        ねらった　ほうこうに　とばすには
        たくさんの　くんれんが　ひつよう。
      ja: |-
        棘を　飛ばして　身を　守る。
        狙った　方向に　飛ばすには
        たくさんの　訓練が　必要。
      ko: |-
        가시를 날려서 몸을 지킨다.
        원하는 방향으로 날리기 위해서는
        많은 훈련이 필요하다.
      zh-Hant: |-
        會發射尖刺來保護自己。
        需要反覆訓練才能將
        尖刺準確地射中目標。
      zh-Hans: |-
        会发射尖刺来保护自己。
        需要反复训练才能将
        尖刺准确地射中目标。
      en: |-
        It defends itself by launching spikes, but its
        aim isn’t very good at first. Only after a lot of
        practice will it improve.
      fr: |-
        Il se protège en projetant ses épines,
        mais il lui faut beaucoup d’entraînement
        pour réussir à tirer dans une direction précise.
      de: |-
        Es schützt sich, indem es Dornen verschießt. Ein
        Kastadur muss jahrelang trainieren, um präzise
        zielen zu können.
      es: |-
        Se defiende lanzando púas, pero para poder
        apuntar con precisión a su objetivo necesita
        ingentes sesiones de práctica.
      it: |-
        Si protegge sparando i suoi aculei, ma per
        riuscire a orientarli con precisione verso
        il bersaglio ha bisogno di allenarsi a lungo.
    shield:
      ja-Hrkt: |-
        こけむした　どうくつを　このむ。
        こけが　ふくむ　こうそが　トゲを
        おおきく　じょうぶに　はぐくむのだ。
      ja: |-
        苔むした　洞窟を　好む。
        苔が　含む　酵素が　棘を
        大きく　丈夫に　育むのだ。
      ko: |-
        이끼 낀 동굴을 좋아한다.
        이끼에 함유된 효소가 가시를
        크고 튼튼하게 만들어준다.
      zh-Hant: |-
        偏愛長著青苔的洞窟。
        青苔中所含的酵素能使牠的
        尖刺成長得又大又結實。
      zh-Hans: |-
        偏爱长着青苔的洞窟。
        青苔中所含的酶能使它的
        尖刺成长得又大又结实。
      en: |-
        Mossy caves are their preferred dwellings.
        Enzymes contained in mosses help Ferroseed’s
        spikes grow big and strong.
      fr: |-
        Il aime les grottes pleines de mousse.
        Les enzymes contenues dans ces plantes l’aident
        à obtenir des épines grandes et solides.
      de: |-
        Es fühlt sich in moosbewachsenen Höhlen wohl.
        Die im Moos enthaltenen Enzyme lassen seine
        Stacheln besonders groß und kräftig werden.
      es: |-
        Prefiere las cuevas de paredes musgosas, ya que
        las enzimas contenidas en el musgo le permiten
        desarrollar unas púas grandes y robustas.
      it: |-
        Predilige le grotte in cui cresce il muschio,
        i cui enzimi aiutano i suoi aculei a crescere
        grandi e forti.
