    sword:
      ja-Hrkt: |-
        あおく　うつくしい　はねは　こおりで
        できていると　いわれている。　ながい
        おを　たなびかせ　ゆきやまを　とぶ。
      ja: |-
        青く　美しい　羽根は　氷で
        できていると　言われている。　長い
        尾を　たなびかせ　雪山を　飛ぶ。
      ko: |-
        푸르고 아름다운 날개는 얼음으로
        되어 있다고 전해진다. 긴 꼬리를
        나부끼며 설산 위를 난다.
      zh-Hant: |-
        藍色的美麗羽毛據說是
        由冰構成的。會搖曳著
        長長的尾巴飛過雪山。
      zh-Hans: |-
        据说它那蓝色的美丽羽毛
        是由冰构成的。会飘曳着
        长尾巴飞过茫茫雪山。
      en: |-
        It’s said that this Pokémon’s beautiful blue wings
        are made of ice. Articuno flies over snowy
        mountains, its long tail fluttering along behind it.
      fr: |-
        On raconte que ses belles plumes bleues sont
        faites de glace. Sa longue queue flotte au vent
        lorsqu’il vole au-dessus des monts enneigés.
      de: |-
        Seine wunderschönen blauen Flügel sollen aus Eis
        bestehen. Es fliegt über schneebedeckte Berge,
        während sein langer Schweif hinter ihm flattert.
      es: |-
        Se dice que sus bellas alas azules se componen
        de hielo. Vuela en torno a las montañas nevadas
        con su larga cola al viento.
      it: |-
        Si dice che le sue splendide ali azzurre siano
        composte di ghiaccio. Vola fra le montagne
        innevate facendo ondeggiare la sua lunga coda.
    shield:
      ja-Hrkt: |-
        こおりを　じざいに　あやつる
        ちからを　もつ。　えいきゅうとうどの
        ゆきやまに　すんでいると　いう。
      ja: |-
        氷を　自在に　操る　力を　もつ。
        永久凍土の　雪山に
        棲んでいるという。
      ko: |-
        얼음을 자유자재로 조종하는 힘을
        가졌다. 영구 동토의 설산에
        살고 있다고 한다.
      zh-Hant: |-
        擁有能自在操縱冰的
        能力。據說是棲息在
        永凍之地的雪山中。
      zh-Hans: |-
        拥有能够自由操纵冰
        的能力。据说它栖息在
        永久冻土的雪山。
      en: |-
        This Pokémon can control ice at will. Articuno
        is said to live in snowy mountains riddled
        with permafrost.
      fr: |-
        Il possède le pouvoir de contrôler la glace.
        Selon les dires, il vivrait sur les sommets
        recouverts de neiges éternelles.
      de: |-
        Arktos ist imstande, Eis zu manipulieren.
        Man sagt, es lebe in schneebedeckten Bergen,
        wo ewiger Winter herrscht.
      es: |-
        Posee el poder de controlar el hielo a su antojo.
        Se dice que este Pokémon habita en montañas
        de nieves perpetuas.
      it: |-
        È in grado di controllare il ghiaccio a suo
        piacimento. Si dice che viva sulle montagne
        innevate nelle aree coperte da permafrost.
