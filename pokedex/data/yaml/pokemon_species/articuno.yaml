    x:
      ja-Hrkt: |-
        でんせつの　とりポケモン。
        くうきちゅうの　すいぶんを　こおらせ
        ふぶきを　つくりだすことが　できる。
      ja: |-
        伝説の　とりポケモン。
        空気中の　水分を　凍らせ
        吹雪を　作り出すことが　できる。
      ko: |-
        전설의 새포켓몬이다.
        공기 중의 수분을 얼려
        눈보라를 만들어 낼 수 있다.
      en: |-
        A legendary bird Pokémon. It can create blizzards
        by freezing moisture in the air.
      fr: |-
        Un Pokémon Oiseau légendaire. Il peut provoquer
        des blizzards en gelant l’humidité de l’air.
      de: |-
        Ein Legendäres Vogel-Pokémon. Es kann Blizzards
        verursachen, indem es Feuchtigkeit gefriert.
      es: |-
        Legendario Pokémon pájaro capaz de generar
        ventiscas congelando la humedad del aire.
      it: |-
        Un Pokémon uccello leggendario. Riesce a creare
        bufere di neve congelando l’umidità dell’aria.
    'y':
      ja-Hrkt: |-
        ゆきやまで　さむくて　しにそうなとき
        めのまえに　あらわれるといわれる
        でんせつの　れいとうポケモン。
      ja: |-
        雪山で　寒くて　死にそうなとき
        目の前に　現れるといわれる
        伝説の　ポケモン。
      ko: |-
        설산에서 추워 죽을 것 같을 때
        눈앞에 나타난다고 하는
        전설의 냉동포켓몬.
      en: |-
        A legendary bird Pokémon that is said to appear to
        doomed people who are lost in icy mountains.
      fr: |-
        Le légendaire oiseau des glaces. On dit qu’il apparaît
        aux gens perdus dans les sommets.
      de: |-
        Ein Legendäres Vogel-Pokémon, das angeblich
        in Gletschern verirrten Wanderern den Weg weist.
      es: |-
        Es un legendario pájaro Pokémon. Se aparece a la
        gente que se ha perdido en las heladas montañas.
      it: |-
        Uccello leggendario, si dice appaia per atterrire chi
        si smarrisce sui ghiacciai.
    omega-ruby:
      ja-Hrkt: |-
        こおりを　あやつる　でんせつの　とりポケモン。
        はばたく　ことで　くうきを　つめたく　ひやすので
        フリーザーが　とぶと　ゆきが　ふると　いわれる。
      ja: |-
        氷を　操る　伝説の　鳥ポケモン。
        羽ばたく　ことで　空気を　冷たく　冷やすので
        フリーザーが　飛ぶと　雪が　降ると　いわれる。
      ko: |-
        얼음을 조종하는 전설의 새포켓몬이다.
        날갯짓하면 공기가 차갑게 식기 때문에
        프리져가 날면 눈이 온다고 전해진다.
      en: |-
        Articuno is a legendary bird Pokémon that can control ice.
        The flapping of its wings chills the air. As a result, it is said
        that when this Pokémon flies, snow will fall.
      fr: |-
        Artikodin est un Pokémon Oiseau légendaire qui peut
        contrôler la glace. Le battement de ses ailes gèle l’air
        tout autour de lui. C’est pourquoi on dit que lorsque
        ce Pokémon vole, il va neiger.
      de: |-
        Arktos ist ein sagenumwobenes Vogel-Pokémon, das Eis
        manipulieren kann. Das Schlagen seiner Flügel bringt die
        Luft zum Gefrieren. Es wird behauptet, dass es zu schneien
        beginnt, wenn dieses Pokémon fliegt.
      es: |-
        Articuno es un Pokémon pájaro legendario que puede
        controlar el hielo. El batir de sus alas congela el aire. Dicen
        que consigue hacer que nieve cuando vuela.
      it: |-
        Articuno è un Pokémon uccello leggendario, perfettamente
        a suo agio tra i ghiacci. Quando batte le ali, l’aria circostante
        diventa gelida. Per questo motivo, quando nevica, si dice
        che sia passato di lì.
    alpha-sapphire:
      ja-Hrkt: |-
        こおりを　あやつる　でんせつの　とりポケモン。
