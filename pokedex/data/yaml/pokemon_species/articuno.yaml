    lets-go-pikachu:
      ja-Hrkt: |-
        ふゆぞらの　くうきに　ふくまれる
        すいぶんを　こおらせて　ゆきを
        ふらせる　でんせつの　とりポケモン。
      ja: |-
        冬空の　空気に　含まれる
        水分を　凍らせて　雪を
        降らせる　伝説の　鳥ポケモン。
      ko: |-
        겨울 하늘의 공기 중에 있는
        수분을 얼려서 눈을
        내리게 하는 전설의 새포켓몬.
      zh-Hant: |-
        傳說的鳥寶可夢。
        會讓冬天空中的空氣所含
        的水分凍結，降下雪花。
      zh-Hans: |-
        传说的鸟宝可梦。它能将
        冬日空中的空气中含有的
        水分冻结，降下雪花。
      en: |-
        A legendary bird Pokémon. It freezes water
        that is contained in winter air and makes it snow.
      fr: |-
        Un Pokémon oiseau légendaire. L’hiver, il glace
        la vapeur d’eau contenue dans l’air pour faire
        de la neige.
      de: |-
        Ein Legendäres Vogel-Pokémon, das im Winter
        die Wasserpartikel in der Luft gefrieren lässt,
        um Schnee zu erzeugen.
      es: |-
        Un Pokémon pájaro legendario. En invierno,
        crea nieve congelando la humedad del aire.
      it: |-
        Questo Pokémon alato leggendario congela
        l’umidità contenuta nell’aria invernale e fa
        cadere la neve.
    lets-go-eevee:
      ja-Hrkt: |-
        ふゆぞらの　くうきに　ふくまれる
