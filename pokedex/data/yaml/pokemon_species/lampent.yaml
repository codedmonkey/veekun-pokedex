lampent:
  base_happiness: 50
  capture_rate: 90
  color: black
  egg_groups:
    - indeterminate
  evolution_chain: litwick
  evolves_from: litwick
  flavor_text:
    black:
      en: |-
        This ominous Pokémon is feared.
        Through cities it wanders, searching
        for the spirits of the fallen.
      fr: |-
        Un Pokémon craint pour être de mauvais
        augure. Il erre dans les villes à la
        recherche d’âmes de défunts.
    white:
      en: |-
        It arrives near the moment of death
        and steals spirit from the body.
      fr: |-
        Il apparaît au moment du trépas
        et aspire l’âme à l’instant même
        où elle quitte le corps.
    black-2:
      en: |-
        The spirits it absorbs fuel its baleful
        fire. It hangs around hospitals waiting
        for people to pass on.
    white-2:
      en: |-
        The spirits it absorbs fuel its baleful
        fire. It hangs around hospitals waiting
        for people to pass on.
    x:
      ja-Hrkt: |-
        たましいを　すいとり　ひをともす。
        ひとが　しぬのを　まつため
        びょういんを　うろつくようになった。
      ja: |-
        魂を　吸いとり　火を灯す。
        人が　死ぬのを　待つため
        病院を　うろつくようになった。
      ko: |-
        영혼을 빨아들여 불을 밝힌다.
        사람이 죽는 것을 기다리기 위해
        병원을 서성거리게 되었다.
      en: |-
        The spirits it absorbs fuel its baleful fire. It hangs
        around hospitals waiting for people to pass on.
      fr: |-
        Il aspire les âmes pour entretenir sa flamme.
        Il erre dans les hôpitaux dans l’attente d’un trépas.
      de: |-
        Es nährt seine Flamme mit den Seelen seiner Opfer.
        Heutzutage irrt es auf der Suche nach Seelen durch
        Krankenhäuser.
      es: |-
        Al absorber almas, su llama se enciende. Espera a que
        la gente fallezca, así que suele deambular por los
        hospitales.
      it: |-
        La sua fiamma si accende quando risucchia gli spettri.
        Si trova spesso nei pressi dei cimiteri, dove questi
        abbondano.
    'y':
      ja-Hrkt: |-
        りんじゅうの　さいに　あらわれて
        たましいが　にくたいを　はなれると
        すかさず　すいとってしまうのだ。
      ja: |-
        臨終の　際に　現れて
        魂が　肉体を　離れると
        すかさず　吸い取ってしまうのだ。
      ko: |-
        임종 때 나타나서
        영혼이 육체를 떠나면
        재빨리 빨아들여 버린다.
      en: |-
        It arrives near the moment of death and steals spirit
        from the body.
      fr: |-
        Il apparaît au moment du trépas et aspire l’âme
        à l’instant même où elle quitte le corps.
      de: |-
        Es erscheint im Augenblick des Todes und verschlingt
        die Seele des Verblichenen, sofort nachdem sie den
        Körper verlassen hat.
      es: |-
        Aparece hacia el final de la vida y absorbe el alma
        en cuanto esta se separa del cuerpo.
      it: |-
        Appare sul finire della vita per risucchiare l’energia
        delle anime vagabonde.
    omega-ruby:
      ja-Hrkt: |-
        たましいを　すいとり　ひをともす。
        ひとが　しぬのを　まつため
        びょういんを　うろつくようになった。
      ja: |-
        魂を　吸いとり　火を灯す。
        人が　死ぬのを　待つため
        病院を　うろつくようになった。
      ko: |-
        영혼을 빨아들여 불을 밝힌다.
        사람이 죽는 것을 기다리기 위해
        병원을 서성거리게 되었다.
      en: |-
        The spirits it absorbs fuel its baleful fire. It hangs
        around hospitals waiting for people to pass on.
      fr: |-
        Il aspire les âmes pour entretenir sa flamme.
        Il erre dans les hôpitaux dans l’attente d’un trépas.
      de: |-
        Es nährt seine Flamme mit den Seelen seiner Opfer.
        Heutzutage irrt es auf der Suche nach Seelen durch
        Krankenhäuser.
      es: |-
        Al absorber almas, su llama se enciende. Espera a que la
        gente fallezca, así que suele deambular por los hospitales.
      it: |-
        La sua fiamma si accende quando risucchia gli spettri. Si trova
        spesso nei pressi dei cimiteri, dove questi abbondano.
    alpha-sapphire:
      ja-Hrkt: |-
        りんじゅうの　さいに　あらわれて
        たましいが　にくたいを　はなれると
        すかさず　すいとってしまうのだ。
      ja: |-
        臨終の　際に　現れて
        魂が　肉体を　離れると
        すかさず　吸い取ってしまうのだ。
      ko: |-
        임종 때 나타나서
        영혼이 육체를 떠나면
        재빨리 빨아들여 버린다.
      en: |-
        It arrives near the moment of death and steals spirit
        from the body.
      fr: |-
        Il apparaît au moment du trépas et aspire l’âme à l’instant
        même où elle quitte le corps.
      de: |-
        Es erscheint im Augenblick des Todes und verschlingt die
        Seele des Verblichenen, sofort nachdem sie den Körper
        verlassen hat.
      es: |-
        Aparece hacia el final de la vida y absorbe el alma en cuanto
        esta se separa del cuerpo.
      it: |-
        Appare sul finire della vita per risucchiare l’energia delle
        anime vagabonde.
    sword:
      ja-Hrkt: |-
        だれかが　しぬ　ちょくぜんに
        あらわれる　ことから　しにがみの
        つかい　として　おそれられている。
      ja: |-
        誰かが　死ぬ　直前に
        現れる　ことから　死神の使い
        として　恐れられている。
      ko: |-
        누군가가 죽기 직전에
        나타나기 때문에 사신의 사자로
        여겨져 두려움의 대상이 되었다.
      zh-Hant: |-
        由於牠會在人類臨終時出現，
        人們因此認為牠是死神
        的使者，對牠畏懼不已。
      zh-Hans: |-
        由于它会在人类临终时出现，
        人们认为它是死神的
        使者，对它畏惧不已。
      en: |-
        This Pokémon appears just before someone
        passes away, so it’s feared as an emissary
        of death.
      fr: |-
        Comme il apparaît dès qu’une personne
        est sur le point de trépasser, les gens le craignent
        et le prennent pour un messager de la mort.
      de: |-
        Es wird als Todesbote gefürchtet, da es oft in der
        Nähe von Menschen auftaucht, deren Ende kurz
        bevorsteht.
      es: |-
        Es considerado y temido como Pokémon de
        mal agüero, ya que aparece en los instantes
        previos al fallecimiento de alguien.
      it: |-
        Appare quando qualcuno sta per morire.
        Per questo motivo è considerato l’aiutante
        della divinità della morte ed è molto temuto.
    shield:
      ja-Hrkt: |-
        ランプの　ふりをして　まちなかに
        ひそむ。　しきが　ちかい　ひとを
        みつけると　そっと　あとを　つける。
      ja: |-
        ランプの　ふりをして　町中に
        潜む。　死期が　近い　人を
        見つけると　そっと　後を　つける。
      ko: |-
        램프인 척 마을 안으로
        숨어든다. 죽음이 다가온 사람을
        발견하면 조용히 뒤를 쫓는다.
      zh-Hant: |-
        偽裝成燈的樣子藏身在城鎮裡。
        一旦發現了臨近死期的人，
        便會悄悄地跟在後面。
      zh-Hans: |-
        伪装成灯的样子藏身在城镇里。
        一旦发现了临近死期的人，
        便会悄悄地跟在后面。
      en: |-
        It lurks in cities, pretending to be a lamp.
        Once it finds someone whose death is near,
        it will trail quietly after them.
      fr: |-
        Il se cache en ville en se faisant passer pour
        un lampadaire. Lorsqu’il repère une personne
        dont l’heure est proche, il la suit en catimini.
      de: |-
        Es gibt sich als Lampe aus und lungert in Städten
        herum. Entdeckt es einen Menschen, dessen
        Todesstunde naht, folgt es ihm leise.
      es: |-
        Se oculta en entornos urbanos haciéndose pasar
        por una lámpara corriente. Si se topa con alguien
        moribundo, lo sigue en silencio.
      it: |-
        Si mimetizza nel paesaggio cittadino fingendosi
        una lampada. Quando incontra una persona
        prossima alla morte, la segue silenzioso.
