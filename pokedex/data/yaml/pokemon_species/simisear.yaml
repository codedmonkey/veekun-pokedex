simisear:
  base_happiness: 70
  capture_rate: 75
  color: red
  egg_groups:
    - ground
  evolution_chain: pansear
  evolves_from: pansear
  flavor_text:
    black:
      en: |-
        It loves sweets because they become
        energy for the fire burning inside
        its body.
      fr: |-
        Il adore les aliments sucrés. Ils lui
        servent d’énergie pour alimenter le
        feu à l’intérieur de son corps.
    white:
      en: |-
        A flame burns inside its body.
        It scatters embers from its head
        and tail to sear its opponents.
      fr: |-
        Son corps est en combustion. Il
        projette des flammèches par la tête et
        la queue pour carboniser ses ennemis.
    black-2:
      en: |-
        When it gets excited, embers rise
        from its head and tail and it gets hot.
        For some reason, it loves sweets.
    white-2:
      en: |-
        When it gets excited, embers rise
        from its head and tail and it gets hot.
        For some reason, it loves sweets.
    x:
      ja-Hrkt: |-
        からだの　なかの　ほのおを　もやして
        あたまや　しっぽから　ひのこを
        まきちらせて　てきを　こがす。
      ja: |-
        体の　中の　炎を　燃やして
        頭や　尻尾から　火の粉を
        まき散らせて　敵を　焦がす。
      ko: |-
        몸속에서 태운 불꽃을
        머리나 꼬리로 흩뿌려서
        상대를 태운다.
      en: |-
        A flame burns inside its body. It scatters embers
        from its head and tail to sear its opponents.
      fr: |-
        Son corps est en combustion. Il projette des
        flammèches par la tête et la queue pour carboniser
        ses ennemis.
      de: |-
        Es entfacht in seinem Körper ein Feuer und verkohlt
        Gegner mit Funken aus seinem Kopf und Schweif.
      es: |-
        Achicharra a sus enemigos desprendiendo llamas
        por la cola y la cabeza, fruto de su desmesurado
        calor interno.
      it: |-
        Alimentando la fiamma all’interno del suo corpo,
        sparge dalla testa o dalla coda una pioggia di
        fuoco che scotta i nemici.
    'y':
      ja-Hrkt: |-
        こうふんすると　あたまや　しっぽから
        ひのこが　まいあがって　あつくなる。
        なぜか　あまいものが　だいこうぶつ。
      ja: |-
        興奮すると　頭や　尻尾から
        火の粉が　舞いあがって　熱くなる。
        なぜか　甘いものが　大好物。
      ko: |-
        흥분하면 머리나 꼬리에서
        불티가 날아올라 뜨거워진다.
        왜인지 달콤한 것을 매우 좋아한다.
      en: |-
        When it gets excited, embers rise from its head
        and tail and it gets hot. For some reason, it
        loves sweets.
      fr: |-
        Quand il est excité, des flammèches brûlantes dansent
        sur sa tête et sa queue. Il raffole des choses sucrées.
      de: |-
        Freut es sich, erhitzt sich sein Körper und aus
        seinem Kopf und Schweif sprühen Funken.
        Es liebt Süßigkeiten.
      es: |-
        Cuando se emociona, echa chispas por la cola y la
        cabeza, y calienta su cuerpo. Por alguna razón le
        encantan los dulces.
      it: |-
        Quando è concitato si scalda e iniziano a levarsi
        scintille dalla testa e dalla coda. Per qualche motivo
        adora i dolci.
    omega-ruby:
      ja-Hrkt: |-
