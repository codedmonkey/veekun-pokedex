    x:
      ja-Hrkt: |-
        おなかの　もようが　こわいかおに
        みえる。よわいてきは　そのもようを
        みただけで　にげだしてしまう。
      ja: |-
        お腹の　模様が　怖い　顔に　見える。
        弱い　敵は　その模様を
        見ただけで　逃げ出してしまう。
      ko: |-
        배의 무늬가 무서운 얼굴로
        보인다. 약한 적은 그 무늬만
        보고도 도망치고 만다.
      en: |-
        The pattern on its belly appears to be a frightening
        face. Weak foes will flee just at the sight of
        the pattern.
      fr: |-
        Les motifs sur son corps ressemblent à un visage
        menaçant. Les adversaires les plus craintifs fuient à la
        seule vue de ce Pokémon.
      de: |-
        Das Muster auf seinem Bauch ähnelt einer Fratze.
        Schwache Gegner nehmen bereits beim Anblick
        Reißaus.
      es: |-
        El dibujo que tiene en la panza aterroriza. Los rivales
        más débiles salen huyendo al verlo.
      it: |-
        Il disegno sulla pancia rappresenta una faccia
        spaventosa, capace di far fuggire i nemici più pavidi.
    'y':
      ja-Hrkt: |-
        むねをひろげ　いかく　するとき
        くちから　もれる　くうきの　おとは
        ぶきみで　あいてを　おびえさせる。
      ja: |-
        胸を　広げ　威嚇するとき
        口から　漏れる　空気の　音は
        不気味で　相手を　おびえさせる。
      ko: |-
        가슴을 펴서 위협할 때
        입에서 새는 공기 소리는
        으스스해서 상대를 겁먹게 한다.
      en: |-
        To intimidate foes, it spreads its chest wide and
        makes eerie sounds by expelling air from its mouth.
      fr: |-
        Pour apeurer ses ennemis, il gonfle sa poitrine et
        émet d’étranges sons avec sa bouche.
      de: |-
        Um Feinde einzuschüchtern, bläht es seine Brust
        auf und stößt unheimliche Laute durch sein Maul aus.
      es: |-
        Para intimidar a sus enemigos, hincha el pecho y echa
        aire por la boca emitiendo sonidos.
      it: |-
        Per terrorizzare la preda dilata il petto ed emette un
        terribile verso liberando aria dalla bocca.
    omega-ruby:
      ja-Hrkt: |-
        しめつける　ちからは　とても　きょうりょく。
        ドラムかんも　ぺしゃんこに　してしまうぞ。
        まきつかれたら　にげだす　ことは　ふかのうだ。
      ja: |-
        締めつける　力は　とても　強力。
        ドラム缶も　ぺしゃんこに　してしまうぞ。
        巻きつかれたら　逃げだす　ことは　不可能だ。
      ko: |-
        조이는 힘이 매우 강력하다.
        드럼통도 납작하게 짜부라트린다.
        휘감기면 도망가는 것이 불가능하다.
      en: |-
        This Pokémon is terrifically strong in order to constrict things
        with its body. It can even flatten steel oil drums.
        Once Arbok wraps its body around its foe, escaping its
        crunching embrace is impossible.
      fr: |-
        Ce Pokémon doté d’une force extraordinaire peut étrangler
        ses proies avec son corps. Il peut même écraser des tonneaux
        métalliques. Une fois sous l’étreinte d’Arbok, il est impossible
        de lui échapper.
      de: |-
        Dieses Pokémon ist unheimlich stark. Es kann seine Beute
        mit seinem Körper umwickeln und sogar Ölfässer zerdrücken.
        Wenn Arbok einen Gegner umwickelt, ist es unmöglich,
        seinem Würgegriff zu entkommen.
      es: |-
        Este Pokémon es tremendamente fuerte, puede oprimir
        cualquier cosa con su cuerpo y hasta es capaz de estrujar
        un barril de acero. Una vez que Arbok se enrosca a su
        víctima, no hay forma de escapar de su asfixiante abrazo.
      it: |-
        Questo Pokémon è così forte da riuscire a stritolare qualsiasi
        cosa col corpo, persino un bidone in acciaio. Se Arbok
        si avvinghia a un nemico è impossibile sfuggire a questa
        morsa fatale.
    alpha-sapphire:
      ja-Hrkt: |-
        しめつける　ちからは　とても　きょうりょく。
        ドラムかんも　ぺしゃんこに　してしまうぞ。
