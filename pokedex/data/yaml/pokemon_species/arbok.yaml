    ultra-sun:
      ja-Hrkt: |-
        さいしんの　けんきゅうで　おなかの
        もようは　２０しゅるい　いじょうの
        パターンが　あることが　はんめい。
      ja: |-
        最新の　研究で　お腹の
        模様は　２０種類　以上の
        パターンが　あることが　判明。
      ko: |-
        최근 연구에서 배 모양은
        20종류 이상의
        패턴이 있다고 판명되었다.
      zh-Hant: |-
        最新的研究結果顯示，
        牠們肚子上的花紋
        有２０種以上的不同圖案。
      zh-Hans: |-
        根据最新的研究显示，
        它们腹部的花纹有着
        ２０种以上不同的图案。
      en: |-
        The latest research has determined that there
        are over 20 possible arrangements of the
        patterns on its stomach.
      fr: |-
        Une étude récente aurait recensé plus de vingt
        motifs différents pouvant orner le devant du
        capuchon des Arbok.
      de: |-
        Jüngsten Forschungsergebnissen zufolge gibt
        es mehr als 20 verschiedene Musterungen, die
        Arboks Bauch aufweisen kann.
      es: |-
        Recientes estudios han llegado a identificar
        hasta una veintena de patrones distintos que
        puede presentar el motivo de su cuello.
      it: |-
        Secondo gli studi più recenti, esistono più di 20
        varianti del disegno che ha sul ventre.
    ultra-moon:
      ja-Hrkt: |-
        おなかの　もようで　ひるませると
        すばやく　からだで　しめあげて
        あいての　こどうが　とまるのを　まつ。
      ja: |-
        お腹の　模様で　ひるませると
        素早く　身体で　締め上げて
        相手の　鼓動が　止まるのを　待つ。
      ko: |-
        배의 무늬로 풀이 죽게 한 뒤
        재빠르게 몸으로 조여서
        상대의 고동이 멈추기를 기다린다.
      zh-Hant: |-
        用腹部的花紋使對手畏縮後，
        就會迅速地用身體纏緊對手，
        然後靜待對手心跳停止。
      zh-Hans: |-
        用腹部的花纹让对手畏缩后，
        就会快速地用身体勒住对手，
        并等着对手的心跳停止。
      en: |-
        After stunning its opponents with the pattern
        on its stomach, it quickly wraps them up in its
        body and waits for them to stop moving.
      fr: |-
        Il intimide sa proie grâce au motif situé sur
        le devant de son capuchon, puis l’enserre
        jusqu’à ce que son cœur cesse de battre.
      de: |-
        Es schüchtert seinen Gegner mit dem Muster
        auf seinem Bauch ein und nimmt ihn dann in den
        Würgegriff, bis es keinen Widerstand mehr spürt.
      es: |-
        Tras confundir a su presa con el motivo de su
        cuerpo, se enrosca a su alrededor y la aferra,
        a la espera de que su pulso se detenga.
      it: |-
        Spiazza l’avversario con il disegno sul ventre,
        poi gli si avvinghia rapidamente e aspetta che
        il suo battito cardiaco si fermi.
    lets-go-pikachu:
      ja-Hrkt: |-
        おそろしげな　おなかの　もようは
        けんきゅうのけっか　６しゅるいほど
        パターンが　かくにんされている。
      ja: |-
        恐ろしげな　お腹の　模様は
        研究の　結果　６種類ほど
        パターンが　確認されている。
      ko: |-
        무서워 보이는 배의 무늬는
        연구 결과 6종류 정도의
        패턴이 확인되었다.
      zh-Hant: |-
        根據目前已知的研究結果，
        長在牠肚子上的可怕花紋
        一共有６種不同的類型。
      zh-Hans: |-
        根据研究证实，它腹部
        那可怕的纹路大约有
        ６个种类已经得到确认。
      en: |-
        The frightening patterns on its belly have been
        studied. Six variations have been confirmed.
      fr: |-
        Des études ont révélé que les marques
        effrayantes de son corps pouvaient former
        six motifs différents.
      de: |-
        Von dem furchterregenden Muster auf seinem
        Bauch wurden durch Studien bislang sechs
        verschiedene Varianten entdeckt.
      es: |-
        Se han llegado a identificar hasta seis
        variaciones distintas de los espeluznantes
        dibujos de su piel.
      it: |-
        Gli spaventosi disegni che ha sulla pancia
        sono oggetto di studio. Ne sono state scoperte
        sei diverse variazioni.
