      fr: |-
        Ses muscles se tonifient au son
        d’une musique entraînante. Il ne
        peut pas s’empêcher de danser.
    white:
      en: |-
        If it hears festive music, all its
        muscles fill with energy. It can’t
        help breaking out into a dance.
      fr: |-
        Ses muscles se tonifient au son
        d’une musique entraînante. Il ne
        peut pas s’empêcher de danser.
    black-2:
      en: |-
        If it hears festive music, all its
        muscles fill with energy. It can’t
        help breaking out into a dance.
    white-2:
      en: |-
        If it hears festive music, all its
        muscles fill with energy. It can’t
        help breaking out into a dance.
    x:
      ja-Hrkt: |-
        ようきな　おんがくを　きくと
        からだじゅうに　ちからが　みなぎり
        おどらずには　いられなくなるのだ。
      ja: |-
        陽気な　音楽を　聴くと
        体中に　力が　みなぎり
        踊らずには　いられなくなるのだ。
      ko: |-
        경쾌한 음악을 들으면
        몸속의 힘이 넘쳐흘러
        춤추지 않고는 견딜 수 없게 된다.
      en: |-
        If it hears festive music, all its muscles fill with
        energy. It can’t help breaking out into a dance.
      fr: |-
        Ses muscles se tonifient au son d’une musique
        entraînante. Il ne peut pas s’empêcher de danser.
      de: |-
        Hört es fröhliche Musik, füllen sich seine Muskeln
        mit Energie. Es muss dann einfach tanzen.
      es: |-
        Cuando oye música alegre, sus músculos se llenan de
        energía, y no puede evitar ponerse a bailar.
      it: |-
        Se ascolta musica allegra, tutto il suo corpo si
        rivitalizza e non riesce a evitare di ballare.
    'y':
      ja-Hrkt: |-
        たのしい　おんがくの　リズムが
        ルンパッパの　さいぼうを　かっせいか
        させて　パワーを　はっきするのだ。
      ja: |-
        楽しい　音楽の　リズムが
        ルンパッパの　細胞を　活性化させて
        パワーを　発揮するのだ。
      ko: |-
        즐거운 음악의 리듬이
        로파파의 세포를 활성화시켜
        파워를 발휘한다.
      en: |-
        The rhythm of bright, festive music activates
        Ludicolo’s cells, making it more powerful.
      fr: |-
        Les cellules de Ludicolo s’activent s’il entend
        une musique entraînante, le rendant encore plus
        puissant.
      de: |-
        Der Rhythmus von Partymusik bringt das Blut von
        Kappalores in Wallung und es wird dadurch stärker.
      es: |-
        El ritmo de la música alegre y animada activa las
        células de Ludicolo y estas le dan fuerza.
      it: |-
        Le sue cellule sono sollecitate dalla musica festosa,
        che lo rende più potente.
    omega-ruby:
      ja-Hrkt: |-
        ようきな　おんがくを　みみにすると　おどりだす。
        ハイキングを　している　こどもの　がっしょうに
        さそわれて　すがたを　あらわすと　いわれている。
      ja: |-
        陽気な　音楽を　耳にすると　踊り出す。
        ハイキングを　している　子どもの　合唱に
        誘われて　姿を　現すと　いわれている。
      ko: |-
        경쾌한 음악을 들으면 춤춘다.
        하이킹하는 아이들의 합창에
        이끌려 모습을 나타낸다고 전해진다.
      en: |-
        Ludicolo begins dancing as soon as it hears cheerful,
        festive music. This Pokémon is said to appear when it
        hears the singing of children on hiking outings.
      fr: |-
        Ludicolo ne peut pas s’empêcher de danser quand il entend
        une musique joyeuse et festive. On raconte que ce Pokémon
        apparaît lorsqu’il entend les enfants chanter pendant leurs
        randonnées.
      de: |-
        Kappalores fängt sofort zu tanzen an, wenn es stimmungsvolle,
        feierliche Musik vernimmt. Dieses Pokémon erscheint
        angeblich, wenn es Kinder auf Wanderausflügen singen hört.
      es: |-
        Ludicolo empieza a bailar en cuanto oye música alegre y de
        fiesta. Dicen que este Pokémon aparece cuando oye cantar a
        los niños que van de excursión para hacer senderismo.
      it: |-
        Ludicolo inizia a ballare appena sente una musica allegra
        e festosa. Pare che questo Pokémon appaia quando sente
        il canto gioioso dei bambini durante le escursioni.
    alpha-sapphire:
      ja-Hrkt: |-
        ようきな　リズムを　きくと　からだの　さいぼうが
        かっぱつに　かつどうを　はじめる　たいしつ。
        たたかいでも　すごい　パワーを　はっきするぞ。
      ja: |-
        陽気な　リズムを　聞くと　体の　細胞が
        活発に　活動を　始める　体質。
        戦いでも　すごい　パワーを　発揮するぞ。
      ko: |-
        명랑한 리듬을 들으면 몸의 세포가
        활발하게 활동하기 시작하는 체질이다.
        싸움에서도 굉장한 파워를 발휘한다.
      en: |-
        Upon hearing an upbeat and cheerful rhythm, the cells in
        Ludicolo’s body become very energetic and active. Even
        in battle, this Pokémon will exhibit an amazing amount
        of power.
      fr: |-
        Lorsque Ludicolo entend un rythme entraînant et joyeux,
        les cellules de son corps s’activent énergiquement.
        Même pendant les combats, ce Pokémon montre énormément
        d’énergie.
      de: |-
        Wenn Kappalores einen fröhlichen Rhythmus hört, werden die
        Zellen in seinem Körper aktiviert. Auch im Kampf zeigt dieses
        Pokémon seine verblüffende Stärke.
      es: |-
        Las células de Ludicolo se revolucionan y llenan de energía
        cuando oye sonidos rítmicos y alegres. En combate hace gala
        también de esta cantidad desmesurada de energía.
      it: |-
        Quando sente un motivetto allegro e vivace, le cellule
        corporee di Ludicolo diventano attive e piene di energia.
        Anche in lotta il Pokémon dimostra una potenza incredibile.
    sword:
      ja-Hrkt: |-
        たのしい　おんがくの　リズムが
        ルンパッパの　さいぼうを　かっせいか
        させて　パワーを　はっきするのだ。
      ja: |-
        楽しい　音楽の　リズムが
        ルンパッパの　細胞を　活性化
        させて　パワーを　発揮するのだ。
      ko: |-
        즐거운 음악의 리듬이
        로파파의 세포를 활성화시켜
        파워를 발휘한다.
      zh-Hant: |-
        快樂的音樂節奏會讓
        樂天河童的細胞活性化，
        使牠發揮出強大的力量。
      zh-Hans: |-
        快乐的音乐节奏会让
        乐天河童的细胞活性化，
        使其发挥出强大的力量。
      en: |-
        The rhythm of bright, festive music activates
        Ludicolo’s cells, making it more powerful.
      fr: |-
        Les cellules de Ludicolo s’activent s’il entend
        une musique entraînante, le rendant encore
        plus puissant.
      de: |-
        Der Rhythmus von fröhlicher Musik aktiviert die
        Zellen von Kappalores und macht es so stärker.
      es: |-
        El ritmo de la música alegre estimula sus células
        y aumenta su fuerza.
      it: |-
        Le sue cellule sono sollecitate dalla musica
        festosa, che lo rende più potente.
    shield:
      ja-Hrkt: |-
        ようきな　リズムに　あわせて
        からだを　うごかす　ことで
        パワーを　ぞうふくさせて　いるのだ。
      ja: |-
        陽気な　リズムに　あわせて
        体を　動かす　ことで
        パワーを　増幅させて　いるのだ。
      ko: |-
        경쾌한 리듬에 맞춰
        몸을 움직여서
        파워를 증폭시키고 있다.
      zh-Hant: |-
        樂天河童會跟著
        歡快的音樂搖擺身體，
        藉而增強自己的力量。
      zh-Hans: |-
        乐天河童会跟着
        欢快的音乐摇摆身体，
        从而增强自己的力量。
      en: |-
        If it hears festive music, it begins moving in
        rhythm in order to amplify its power.
      fr: |-
        Il bouge son corps sur un rythme entraînant
        pour décupler ses forces.
      de: |-
        Es bewegt seinen Körper zu fröhlichen Rhythmen.
        Auf diese Weise erhöht es seine Kraft.
      es: |-
        Mover su cuerpo al ritmo de música festiva
        puede hacer que aumente su fuerza.
      it: |-
        Aumenta la propria forza danzando al ritmo
        di una musica giocosa.
