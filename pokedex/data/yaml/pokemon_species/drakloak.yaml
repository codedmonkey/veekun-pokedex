drakloak:
  base_happiness: 50
  capture_rate: 45
  color: green
  egg_groups:
    - indeterminate
    - dragon
  evolution_chain: dreepy
  evolves_from: dreepy
  flavor_text:
    sword:
      ja-Hrkt: |-
        ひこう　そくどは　じそく２００キロ。
        ドラメシヤと　いっしょに　たたかい
        ぶじに　しんかするまで　せわをする。
      ja: |-
        飛行速度は　時速２００キロ。
        ドラメシヤと　いっしょに　戦い
        無事に　進化するまで　世話をする。
      ko: |-
        비행 속도는 시속 200km.
        드라꼰과 함께 싸우며
        무사히 진화할 때까지 돌본다.
      zh-Hant: |-
        飛行速度為每小時２００公里。
        與多龍梅西亞一起戰鬥，
        到牠進化為止都會細心照顧。
      zh-Hans: |-
        飞行速度为每小时２００公里。
        与多龙梅西亚一起战斗，
        到它进化为止都会细心照顾。
      en: |-
        It’s capable of flying faster than 120 mph.
        It battles alongside Dreepy and
        dotes on them until they successfully evolve.
      fr: |-
        Il vole à une vitesse de 200 km/h et se bat
        aux côtés d’un Fantyrm, dont il prend soin
        jusqu’à son évolution.
      de: |-
        Beim Fliegen ist es bis zu 200 km/h schnell. Es
        kämpft gemeinsam mit Grolldra und kümmert
        sich bis zu dessen Entwicklung um es.
      es: |-
        Vuela a una velocidad de 200 km/h. Lucha junto
        a un Dreepy, al que cuida hasta el momento de
        su evolución.
      it: |-
        Vola a una velocità di 200 km/h. Lotta assieme
        a Dreepy e se ne prende cura fino a quando
        non si evolve.
    shield:
      ja-Hrkt: |-
        せわをする　ドラメシヤを　あたまに
        のせていないと　おちつかないので
        ほかの　ポケモンを　のせようとする。
      ja: |-
        世話をする　ドラメシヤを　頭に
        乗せていないと　落ち着かないので
        ほかの　ポケモンを　乗せようとする。
      ko: |-
        보살피는 드라꼰을 머리에
        태우지 않으면 진정하지 못하고
        다른 포켓몬을 태우려고 한다.
      zh-Hant: |-
        要是沒讓自己在照顧的多龍梅西亞
        乘在頭上就靜不下心來，甚至會
        因此試圖把別的寶可夢放到頭上。
      zh-Hans: |-
        要是没让自己在照顾的多龙梅西亚
        乘在头上就静不下心来，甚至会
        因此试图把别的宝可梦放到头上。
      en: |-
        Without a Dreepy to place on its head and
        care for, it gets so uneasy it’ll try to substitute
        any Pokémon it finds for the missing Dreepy.
      fr: |-
        Il prend soin du Fantyrm sur sa tête.
        Quand ce dernier n’est plus là, il panique
        et tente de le remplacer par un autre Pokémon.
      de: |-
        Hat es kein Grolldra auf seinem Kopf, auf das es
        aufpassen kann, wird es nervös. Dann versucht es,
        ein anderes Pokémon auf seinen Kopf zu setzen.
      es: |-
        Si no lleva un Dreepy del que cuidar encima de
        la cabeza, se intranquiliza y trata de sustituirlo
        con otro Pokémon.
      it: |-
        Se non ha un Dreepy sulla testa di cui prendersi
        cura, non riesce a stare tranquillo e cerca
        di sostituirlo con altri Pokémon.
