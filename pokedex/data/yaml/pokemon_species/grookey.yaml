grookey:
  base_happiness: 50
  capture_rate: 45
  color: green
  egg_groups:
    - ground
    - plant
  evolution_chain: grookey
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        とくべつな　スティックで　リズムを
        きざむと　くさばなを　げんきにする
        パワーが　おんぱになって　ひろがる。
      ja: |-
        特別な　スティックで　リズムを
        刻むと　草花を　元気にする
        パワーが　音波になって　広がる。
      ko: |-
        특별한 스틱으로 리듬을 타면
        화초를 생생하게 만드는 힘이
        음파가 되어 퍼진다.
      zh-Hant: |-
        當牠用特別的木棒敲奏時，
        能夠給予花草活力的力量
        就會變成音波擴散開來。
      zh-Hans: |-
        当它用特别的木棒敲奏时，
        能够给予花草活力的力量
        就会变成音波扩散开来。
      en: |-
        When it uses its special stick to strike up a beat,
        the sound waves produced carry revitalizing
        energy to the plants and flowers in the area.
      fr: |-
        Le rythme qu’il crée en tapant avec son bâton
        très spécial génère des ondes sonores
        qui ont le pouvoir de vivifier les plantes.
      de: |-
        Der Rhythmus, den es mit seinem besonderen
        Schlägel erzeugt, verbreitet Schallwellen, die
        Pflanzen neue Vitalität verleihen können.
      es: |-
        Al marcar el ritmo con su baqueta especial,
        produce unas ondas sonoras capaces de devolver
        la vitalidad a la flora.
      it: |-
        Segnando il ritmo con la sua bacchetta speciale
        diffonde onde sonore che hanno il potere
        di rinvigorire fiori e piante.
    shield:
      ja-Hrkt: |-
        スティックの　れんだで　こうげき。
        すごい　スピードで　たたくうちに
        どんどん　テンションが　あがるのだ。
      ja: |-
        スティックの　連打で　攻撃。
        すごい　スピードで　叩くうちに
        どんどん　テンションが　上がるのだ。
      ko: |-
        스틱으로 연타하여 공격한다.
        굉장한 속도로 치다 보면
        점점 텐션이 올라간다.
      zh-Hant: |-
        會用木棒連續擊打來攻擊。
        在以飛快的速度擊打的同時，
        情緒也會變得越來越高漲。
      zh-Hans: |-
        会用木棒连续击打来攻击。
        在以飞快的速度击打的同时，
        情绪也会变得越来越高涨。
      en: |-
        It attacks with rapid beats of its stick.
        As it strikes with amazing speed, it gets
        more and more pumped.
      fr: |-
        Il attaque en frappant frénétiquement avec
        son bâton. Son enthousiasme grandit à mesure
        que le rythme s’accélère.
      de: |-
        Es greift an, indem es wiederholt seinen Schlägel
        schwingt. Diese rasanten Trommelbewegungen
        bringen es immer mehr in Fahrt.
      es: |-
        Ataca golpeando sin cesar con su baqueta, con
        un entusiasmo que crece a medida que acelera
        el ritmo.
      it: |-
        Attacca percuotendo il nemico con la sua
        bacchetta, con un entusiasmo che cresce
        all’aumentare del ritmo sfrenato con cui colpisce.
