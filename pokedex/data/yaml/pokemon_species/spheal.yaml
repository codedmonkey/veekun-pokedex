spheal:
  base_happiness: 50
  capture_rate: 255
  color: blue
  egg_groups:
    - water1
    - ground
  evolution_chain: spheal
  evolves_from: ~
  flavor_text:
    ruby:
      en: |-
        SPHEAL is much faster rolling than 
        walking to get around. When groups of
        this POKéMON eat, they all clap at onceto show their pleasure. Because of this,
        their mealtimes are noisy.
    sapphire:
      en: |-
        SPHEAL always travels by rolling
        around on its ball-like body. When the
        season for ice floes arrives, thisPOKéMON can be seen rolling about on
        ice and crossing the sea.
    emerald:
      en: |-
        It is completely covered with plushy fur.
        As a result, it never feels the cold even
        when it is rolling about on ice floes or
        diving in the sea.
    firered:
      en: |-
        Its body is covered in fluffy fur. The
        fur keeps it from feeling cold while
        it is rolling on ice.
    leafgreen:
      en: |-
        Its body is covered in fluffy fur.
        The fur keeps it from feeling cold while
        it is rolling on ice.
    diamond:
      en: |-
        It rolls across ice floes to reach
        shore because its body is poorly
        shaped for swimming.
    pearl:
      en: |-
        It rolls across ice floes to reach
        shore because its body is poorly
        shaped for swimming.
    platinum:
      en: |-
        It rolls across ice floes to reach
        shore because its body is poorly
        shaped for swimming.
    heartgold:
      en: |-
        It crosses the oceans by rolling itself
        on drifting ice. Fluffy fur keeps it warm
        when the temperature is below freezing.
    soulsilver:
      en: |-
        It crosses the oceans by rolling itself
        on drifting ice. Fluffy fur keeps it warm
        when the temperature is below freezing.
    black:
      en: |-
        It rolls across ice floes to reach
        shore because its body is poorly
        shaped for swimming.
      fr: |-
        Il gagne la côte en roulant sur les
        blocs de glace car sa morphologie
        n’est pas adaptée à la nage.
    white:
      en: |-
        It rolls across ice floes to reach
        shore because its body is poorly
        shaped for swimming.
      fr: |-
        Il gagne la côte en roulant sur les
        blocs de glace car sa morphologie
        n’est pas adaptée à la nage.
    black-2:
      en: |-
        They can’t swim well yet,
        and they move much faster by rolling.
        When they’re happy, they clap fins.
    white-2:
      en: |-
        They can’t swim well yet,
        and they move much faster by rolling.
        When they’re happy, they clap fins.
    x:
      ja-Hrkt: |-
        まだ　じょうずに　およげず
        ころがったほうが　はやく　うごける。
        うれしいと　みんなで　てをたたく。
      ja: |-
        まだ　上手に　泳げず
        転がったほうが　速く　動ける。
        うれしいと　みんなで　手をたたく。
      ko: |-
        아직 능숙하게 헤엄치지 못하고
        구르는 쪽이 빨리 움직일 수 있다.
        기쁘면 다 같이 손뼉을 친다.
      en: |-
        They can’t swim well yet, and they move much
        faster by rolling. When they’re happy, they
        clap fins.
      fr: |-
        Il se déplace en roulant, car il n’est pas doué pour
        la nage. Quand il est heureux, il applaudit avec ses
        nageoires.
      de: |-
        Es ist noch kein guter Schwimmer und bewegt sich
        rollend schneller fort. Ist es froh, klatscht es mit
        seinen Flossen.
      es: |-
        Como no saben nadar muy bien, se mueven
        rápidamente rodando. Cuando están alegres, dan
        palmadas con las aletas.
      it: |-
        Non sa ancora nuotare molto bene e si muove più
        velocemente rotolando. Quando è felice batte le
        pinne.
    'y':
      ja-Hrkt: |-
        フサフサの　たいもうで　からだが
        おおわれて　いるので　こおりの
        うえを　ころがっても　つめたくない。
      ja: |-
        フサフサの　体毛で
        体が　覆われて　いるので
        氷の　上を　転がっても　冷たくない。
      ko: |-
        북실북실한 털로 몸이
        뒤덮여있기 때문에 얼음 위를
        굴러도 차갑지 않다.
      en: |-
        Its body is covered in fluffy fur. The fur keeps it
        from feeling cold while it is rolling on ice.
      fr: |-
        Son corps est couvert d’une douce fourrure.
        Elle le protège du sentiment de froid quand il se
        déplace en roulant sur la glace.
      de: |-
        Sein Körper ist mit flauschigem Fell bedeckt.
        Das Fell sorgt dafür, dass es nicht friert, auch
        wenn es sich auf dem Eis hin und her rollt.
      es: |-
        Tiene un suave pelaje que lo protege del frío cuando
        se revuelca por el hielo.
      it: |-
        Ha il corpo ricoperto di una morbida pelliccia, che
        gli permette di rotolare sul ghiaccio senza avvertire
        il freddo.
    omega-ruby:
      ja-Hrkt: |-
        あるくより　ころがる　ほうが　だんぜん　はやい。
        しょくじの　じかんは　みんなが　いっせいに　てを
        たたいて　よろこぶので　けっこう　うるさいのだ。
      ja: |-
        歩くより　転がる　ほうが　断然　速い。
        食事の　時間は　みんなが　一斉に　手を
        たたいて　喜ぶので　結構　うるさいのだ。
      ko: |-
        걷는 것보다 구르는 편이 단연 빠르다.
        식사 시간에는 모두가 일제히 손뼉을
        치며 기뻐하기 때문에 꽤 시끄럽다.
      en: |-
        Spheal is much faster rolling than walking to get around.
        When groups of this Pokémon eat, they all clap at once to
        show their pleasure. Because of this, their mealtimes are noisy.
      fr: |-
        Obalie est bien plus rapide quand il roule que quand
        il marche. Lorsque des groupes de ce Pokémon mangent,
        ils applaudissent tous en même temps pour montrer
        qu’ils sont contents. Leurs repas sont très bruyants.
      de: |-
        Seemops kann schneller rollen als laufen. Wenn Gruppen
        dieses Pokémon zusammen essen, klatschen sie gleichzeitig,
        um ihre Freude zu zeigen. Deswegen sind ihre Mahlzeiten
        sehr laut.
      es: |-
        Spheal se desplaza por el suelo más rápido rodando que
        caminando. Cuando come con otros de su especie, todos se
        ponen a aplaudir para expresar su alegría. Por eso, a veces
        son algo escandalosos.
      it: |-
        Spheal si muove molto più velocemente rotolando che non
        camminando. Quando si raggruppano per mangiare, questi
        Pokémon sbattono le zampette per dimostrare la loro gioia.
        I loro pasti sono molto rumorosi.
    alpha-sapphire:
      ja-Hrkt: |-
        いつも　ころがって　いどうする　ポケモンだ。
        りゅうひょうの　きせつに　こおりの　うえを
        ころがり　うみを　わたる　すがたを　みかける。
      ja: |-
        いつも　転がって　移動する　ポケモンだ。
        流氷の　季節に　氷の　上を
        転がり　海を　渡る　姿を　見かける。
      ko: |-
        항상 굴러서 이동하는 포켓몬이다.
        얼음이 떠다니는 계절에는 얼음 위를
        굴러 바다를 건너는 모습을 볼 수 있다.
      en: |-
        Spheal always travels by rolling around on its ball-like body.
        When the season for ice floes arrives, this Pokémon can be
        seen rolling about on ice and crossing the sea.
      fr: |-
        Obalie voyage toujours en faisant rouler son corps tout rond.
        Lorsque la saison des neiges arrive, on peut voir ce Pokémon
        rouler sur la glace et traverser la mer.
      de: |-
        Seemops bewegt sich fort, indem es seinen ballartigen Körper
        herumrollt. Wenn Eisschollen auftauchen, kann man dieses
        Pokémon dabei beobachten, wie es über das Eis rollt und
        das Meer überquert.
      es: |-
        Spheal se desplaza siempre rodando gracias al cuerpo
        esférico que tiene. Al comenzar la época glacial, es fácil verle
        rodando por superficies heladas y atravesando el mar.
      it: |-
        Spheal si muove sempre rotolando sul corpo a pallone.
        Nella stagione del disgelo lo si vede rotolare da una lastra
        di ghiaccio all’altra per attraversare il mare.
    sword:
      ja-Hrkt: |-
        ぶあつい　しぼうに　つつまれた
        みごとに　まんまるな　からだ。
        あるくより　ころがるほうが　はやい。
      ja: |-
        ぶ厚い　脂肪に　包まれた
        見事に　まんまるな　体。
        歩くより　転がるほうが　速い。
      ko: |-
        두꺼운 지방에 둘러싸인
        완벽하게 둥근 몸을 가졌다.
        걷는 것보다 굴러가는 게 더 빠르다.
      zh-Hant: |-
        身體被厚厚的脂肪包裹著，
        圓得令人讚嘆。用翻滾的
        方式移動反而比走路還要快。
      zh-Hans: |-
        圆溜溜的身体
        被厚厚的脂肪包裹着，
        滚起来比走路要快。
      en: |-
        This Pokémon’s body is covered in blubber and
        impressively round. It’s faster for Spheal to roll
        around than walk.
      fr: |-
        Grâce à son corps composé d’une épaisse
        couche de graisse qui lui donne sa forme ronde,
        il se déplace plus vite en roulant qu’en marchant.
      de: |-
        Der Körper von Seemops ist kugelrund und von
        einer dicken Speckschicht umgeben. Es kann
        schneller rollen als laufen.
      es: |-
        La gruesa capa de grasa bajo la piel le confiere
        una forma perfectamente esférica. Se desplaza
        más rápido rodando que caminando.
      it: |-
        Il suo corpo, avvolto in uno spesso strato
        lipidico, è perfettamente rotondo. Si sposta
        più velocemente rotolando che camminando.
    shield:
      ja-Hrkt: |-
        なみまに　ただよい　うみの　ようすを
        さぐる。　えものを　はっけんすると
        むれの　トドゼルガに　しらせるのだ。
      ja: |-
        波間に　漂い　海の　様子を　探る。
        獲物を　発見すると
        群れの　トドゼルガに　知らせるのだ。
      ko: |-
        파도에 떠다니며 바다의 상태를
        살핀다. 먹이를 발견하면
        무리의 씨카이저에게 알린다.
      zh-Hant: |-
        會漂浮在波浪間探查
        周圍的狀況。一旦發現獵物，
        就會通知群體的帝牙海獅。
      zh-Hans: |-
        会漂浮在波浪当中观察
        大海的状况。一旦发现猎物，
        就会通知群体里的帝牙海狮。
      en: |-
        As it drifts among the waves, Spheal probes
        the sea. As soon as it spots prey, it informs the
        Walrein in its herd.
      fr: |-
        Il scrute la mer en se laissant porter par
        les vagues. Lorsqu’il repère des proies,
        il avertit les Kaimorse du groupe.
      de: |-
        Seemops lässt sich von den Wellen treiben, um
        das Meer zu erkunden. Entdeckt es Beute, setzt
        es die Walraisa seiner Herde davon in Kenntnis.
      es: |-
        Flota entre las olas para examinar el océano.
        Si encuentra una presa, avisa enseguida a los
        Walrein de su manada.
      it: |-
        Fluttua tra le onde ispezionando il mare.
        Quando individua una preda, avverte i Walrein
        del suo gruppo.
