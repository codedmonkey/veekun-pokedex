mr-rime:
  base_happiness: 50
  capture_rate: 45
  color: purple
  egg_groups:
    - humanshape
  evolution_chain: mr-mime
  evolves_from: mr-mime
  flavor_text:
    sword:
      ja-Hrkt: |-
        タップダンスの　たつじん。
        こおりで　できた　ステッキを　ふり
        かろやかな　ステップを　ひろうする。
      ja: |-
        タップダンスの　達人。
        氷で　できた　ステッキを　振り
        軽やかな　ステップを　披露する。
      ko: |-
        탭 댄스의 달인이다.
        얼음으로 만든 지팡이를 휘두르며
        경쾌한 스텝을 선보인다.
      zh-Hant: |-
        踢踏舞的達人。
        會揮動手中的冰杖，
        向觀眾表演輕快的舞步。
      zh-Hans: |-
        踢踏舞的达人。
        会挥动手中的冰杖，
        向观众表演轻快的舞步。
      en: |-
        It’s highly skilled at tap-dancing. It waves its cane
        of ice in time with its graceful movements.
      fr: |-
        Véritable virtuose des claquettes, il se donne
        en spectacle en dansant d’un pas léger
        tout en jonglant avec sa canne de glace.
      de: |-
        Dieser begnadete Stepptänzer schwingt einen
        aus Eis geformten Gehstock und gibt mit
        leichtem Fuß seinen Tanz zum Besten.
      es: |-
        Es un bailarín consumado de claqué. Agita su
        bastón de hielo mientras exhibe su destreza con
        gráciles pasos.
      it: |-
        È un maestro del tip tap. Fa roteare il suo
        bastone di ghiaccio mentre si esibisce
        in leggiadri passi di danza.
    shield:
      ja-Hrkt: |-
        ユーモラスな　うごきで　みんなの
        にんきもの。　おなかの　もようから
        サイコパワーを　ほうしゅつする。
      ja: |-
        ユーモラスな　動きで　みんなの
        人気者。　お腹の　模様から
        サイコパワーを　放出する。
      ko: |-
        유머러스한 움직임으로 모두에게
        인기가 높다. 배의 무늬에서
        사이코 파워를 방출한다.
      zh-Hant: |-
        幽默的動作使牠獲得了
        眾人的喜愛。能從腹部的
        圖案釋放出精神力量。
      zh-Hans: |-
        幽默的动作使它获得了
        众人的喜爱。能从腹部的
        图案释放出精神力量。
      en: |-
        Its amusing movements make it very popular.
        It releases its psychic power from the pattern
        on its belly.
      fr: |-
        Ses gestes hilarants le rendent très populaire.
        Il peut libérer ses pouvoirs psychiques depuis
        le motif sur son ventre.
      de: |-
        Dank seiner unterhaltsamen Bewegungen ist es
        allseits sehr beliebt. Von dem Muster auf seinem
        Bauch sendet es Psycho-Kräfte aus.
      es: |-
        Se ha granjeado la simpatía de todo el mundo
        por sus cómicos movimientos. Emite poderes
        psíquicos por el motivo de su barriga.
      it: |-
        Le sue comiche movenze lo rendono simpatico
        a tutti. Emette poteri psichici dal motivo che ha
        sul ventre.
