keldeo:
  base_happiness: 35
  capture_rate: 3
  color: yellow
  egg_groups:
    - no-eggs
  evolution_chain: keldeo
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        By blasting water from its hooves, it can
        glide across water. It excels at using
        leg moves while battling.
      fr: |-
        Il projette de l’eau depuis ses sabots
        et se déplace ainsi à grande vitesse.
        Sa botte secrète est le coup de sabot.
    white:
      en: |-
        It crosses the world, running over
        the surfaces of oceans and rivers.
        It appears at scenic waterfronts.
      fr: |-
        Il parcourt le monde en courant à la
        surface des mers et des cours d’eau.
        Il apparaît là où l’eau est très pure.
    black-2:
      en: |-
        When it is resolute, its body fills
        with power and it becomes swifter.
        Its jumps are then too fast to follow.
    white-2:
      en: |-
        When it is resolute, its body fills
        with power and it becomes swifter.
        Its jumps are then too fast to follow.
    x:
      ja-Hrkt: |-
        うみや　かわなど　すいめんを　はしり
        せかいじゅうを　かけめぐっている。
        うつくしい　みずべに　あらわれる。
      ja: |-
        海や　川など　水面を　走り
        世界中を　駆け巡る。
        美しい　水辺に　現れる。
      ko: |-
        바다나 강 등의 수면을 달려
        세계 곳곳을 뛰어다닌다.
        아름다운 물가에 나타난다.
      en: |-
        It crosses the world, running over the surfaces of
        oceans and rivers. It appears at scenic waterfronts.
      fr: |-
        Il parcourt le monde en courant à la surface des mers
        et des cours d’eau. Il apparaît là où l’eau est très
        pure.
      de: |-
        Es kann auf dem Wasser laufen und reist auf
        Flüssen und Meeren um die Welt. Zu sehen in
        malerischen Küstengebieten.
      es: |-
        Corre por mares, ríos o cualquier superficie acuática de
        todo el mundo. Aparece en aguas límpidas.
      it: |-
        Scorrazza per il mondo muovendosi sulla superficie
        dei mari o dei fiumi. Appare nei lidi più ameni.
    'y':
      ja-Hrkt: |-
        かくごを　きめることで　ぜんしんに
        ちからが　みなぎって　すばやくなり
        とびはねると　ざんぞうが　みえる。
      ja: |-
        覚悟を　決めることで　全身に
        力が　みなぎって　素早くなり
        飛び跳ねると　残像が　みえる。
      ko: |-
        각오를 굳히는 것으로 전신에
        힘이 넘쳐흘러 재빨라지며
        뛰어오르면 잔상이 보인다.
      en: |-
        When it is resolute, its body fills with power and it
        becomes swifter. Its jumps are then too fast
        to follow.
      fr: |-
        Lorsqu’il est résolu, de l’énergie sature son corps
        et le propulse à des vitesses qui dépassent la
        perception humaine.
      de: |-
        Ist es sich seiner Sache sicher, strotzt es vor Kraft
        und seine Sprünge werden zu schnell für die
        menschliche Wahrnehmung.
      es: |-
        Cuando está decidido, su cuerpo rebosa brío, y es
        capaz de saltar más alto y correr más de lo que la
        vista alcanza.
      it: |-
        Quando è pronto a passare all’azione, si carica
        d’energia e diventa così veloce che è impossibile
        seguirlo con gli occhi.
    omega-ruby:
      ja-Hrkt: |-
        うみや　かわなど　すいめんを　はしり
        せかいじゅうを　かけめぐっている。
        うつくしい　みずべに　あらわれる。
      ja: |-
        海や　川など　水面を　走り
        世界中を　駆け巡る。
        美しい　水辺に　現れる。
      ko: |-
        바다나 강 등의 수면을 달려
        세계 곳곳을 뛰어다닌다.
        아름다운 물가에 나타난다.
      en: |-
        It crosses the world, running over the surfaces of
        oceans and rivers. It appears at scenic waterfronts.
      fr: |-
        Il parcourt le monde en courant à la surface des mers
        et des cours d’eau. Il apparaît là où l’eau est très pure.
      de: |-
        Es kann auf dem Wasser laufen und reist auf Flüssen und
        Meeren um die Welt. Zu sehen in malerischen Küstengebieten.
      es: |-
        Corre por mares, ríos o cualquier superficie acuática de todo
        el mundo. Aparece en aguas límpidas.
      it: |-
        Scorrazza per il mondo muovendosi sulla superficie dei mari
        o dei fiumi. Appare nei lidi più ameni.
    alpha-sapphire:
      ja-Hrkt: |-
        かくごを　きめることで　ぜんしんに
        ちからが　みなぎって　すばやくなり
        とびはねると　ざんぞうが　みえる。
      ja: |-
        覚悟を　決めることで　全身に
        力が　みなぎって　素早くなり
        飛び跳ねると　残像が　みえる。
      ko: |-
        각오를 굳히는 것으로 전신에
        힘이 넘쳐흘러 재빨라지며
        뛰어오르면 잔상이 보인다.
      en: |-
        When it is resolute, its body fills with power and it
        becomes swifter. Its jumps are then too fast
        to follow.
      fr: |-
        Lorsqu’il est résolu, de l’énergie sature son corps et
        le propulse à des vitesses qui dépassent la perception
        humaine.
      de: |-
        Ist es sich seiner Sache sicher, strotzt es vor Kraft und seine
        Sprünge werden zu schnell für die menschliche Wahrnehmung.
      es: |-
        Cuando está decidido, su cuerpo rebosa brío, y es capaz de
        saltar más alto y correr más de lo que la vista alcanza.
      it: |-
        Quando è pronto a passare all’azione, si carica d’energia
        e diventa così veloce che è impossibile seguirlo con gli occhi.
    sword:
      ja-Hrkt: |-
        コバルオン　テラキオン　ビリジオンに
        たたかいを　まなんだ。　せかいを
        かけめぐり　しゅぎょうを　つづける。
      ja: |-
        コバルオン　テラキオン　ビリジオンに
        戦いを　学んだ。　世界を
        駆け巡り　修行を　続ける。
      ko: |-
        코바르온 테라키온 비리디온으로부터
        싸움을 배웠다. 세계를 돌아다니며
        수행을 거듭하고 있다.
      zh-Hant: |-
        從勾帕路翁、代拉基翁和
        畢力吉翁那裡學會了戰鬥。
        馳騁全世界，不斷修行。
      zh-Hans: |-
        从勾帕路翁、代拉基翁和
        毕力吉翁那里学会了战斗。
        驰骋全世界，不断修行。
      en: |-
        Cobalion, Terrakion, and Virizion taught this
        Pokémon how to fight. It dashes across the world,
        seeking more opportunities to further its training.
      fr: |-
        Cobaltium, Terrakium et Viridium lui ont appris
        à se battre. Il poursuit son entraînement
        en parcourant le monde.
      de: |-
        Kobalium, Terrakium und Viridium haben ihm das
        Kämpfen beigebracht. Nun reist es um die Welt
        und setzt sein Training fort.
      es: |-
        Aprendió a luchar bajo la tutela de Cobalion,
        Terrakion y Virizion. Ahora recorre el mundo
        perfeccionando su destreza.
      it: |-
        Ha imparato a lottare da Cobalion, Terrakion
        e Virizion. Ora continua i suoi allenamenti
        in giro per il mondo.
    shield:
      ja-Hrkt: |-
        きびしい　たたかいを　くぐりぬけて
        ひたいの　ツノが　きたえられると
        しんの　ちからが　めざめるという。
      ja: |-
        厳しい　戦いを　潜りぬけて
        額の　ツノが　鍛えられると
        真の　力が　目覚めるという。
      ko: |-
        혹독한 싸움을 이겨내고
        이마의 뿔이 단련되면
        진정한 힘이 각성한다고 한다.
      zh-Hant: |-
        據說當牠歷經艱難的戰鬥，
        藉此鍛鍊了額頭上的角之後，
        就能激發出自己真正的力量。
      zh-Hans: |-
        据说当它挺过了艰难的战斗，
        额头上的角就能得到锻炼，
        从而激发出自己真正的力量。
      en: |-
        They say that Keldeo must survive harsh battles
        and fully develop the horn on its forehead
        before this Pokémon’s true power will awaken.
      fr: |-
        Lorsqu’il livre un combat difficile, la corne
        sur son front se renforce et se développe,
        ce qui éveillerait sa véritable puissance.
      de: |-
        Man sagt, wenn Keldeo schwere Kämpfe
        übersteht und das Horn an seiner Stirn stärker
        wird, erwache irgendwann seine wahre Kraft.
      es: |-
        A base de superar encarnizados combates, su
        cuerno se fortalece y, entonces, despierta su
        verdadero poder.
      it: |-
        Si dice che quando supera difficili battaglie
        il corno sulla sua fronte si rafforzi e solo allora
        si risvegli la sua vera forza.
