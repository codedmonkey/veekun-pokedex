gurdurr:
  base_happiness: 50
  capture_rate: 90
  color: gray
  egg_groups:
    - humanshape
  evolution_chain: timburr
  evolves_from: timburr
  flavor_text:
    black:
      en: |-
        This Pokémon is so muscular and strongly
        built that even a group of wrestlers
        could not make it budge an inch.
      fr: |-
        Même une armée de catcheurs se
        jetant sur son corps hyper musclé
        ne le ferait pas ciller.
    white:
      en: |-
        They strengthen their bodies by
        carrying steel beams. They show off
        their big muscles to their friends.
      fr: |-
        Il entretient sa forme en transportant
        une poutre en acier et fait des concours
        de culturisme avec ses camarades.
    black-2:
      en: |-
        With strengthened bodies,
        they skillfully wield steel beams
        to take down buildings.
    white-2:
      en: |-
        With strengthened bodies,
        they skillfully wield steel beams
        to take down buildings.
    x:
      ja-Hrkt: |-
        きたえあげた　きんにくの　もちぬし。
        てっこつを　たくみに　あやつって
        いっけんやを　かいたい　してくれる。
      ja: |-
        鍛えあげた　筋肉の　持ち主。
        鉄骨を　たくみに　操って
        一軒家を　解体してくれる。
      ko: |-
        단련된 근육의 소유자.
        철골을 능숙하게 조종하여
        집을 해체해준다.
      en: |-
        With strengthened bodies, they skillfully wield steel
        beams to take down buildings.
      fr: |-
        Ce Pokémon hyper musclé manipule avec habileté
        les poutres métalliques et peut démanteler un
        immeuble en un clin d’œil.
      de: |-
        Diese durchtrainierten Muskelprotze sind im
        Umgang mit Stahlträgern versiert und können
        damit ganze Häuser abreißen.
      es: |-
        Gracias a su entrenada musculatura, puede blandir
        vigas de acero sin problema para así derribar edificios
        enteros.
      it: |-
        Ha un corpo pieno di muscoli e manovra con abilità
        la sua trave d’acciaio, con cui può abbattere una
        casa intera.
    'y':
      ja-Hrkt: |-
        きたえあげた　きんにくの　からだは
        プロレスラーが　たばに　なって
        こうげきしても　びくとも　しない。
      ja: |-
        鍛え上げられた　筋肉の　体は
        プロレスラーが　束に　なって
        攻撃しても　びくとも　しない。
      ko: |-
        단련을 거듭한 근육덩어리 몸은
        프로레슬러가 단체로 공격해도
        꿈쩍도 하지 않는다.
      en: |-
        This Pokémon is so muscular and strongly built that
        even a group of wrestlers could not make it budge
        an inch.
      fr: |-
        Même une armée de catcheurs se jetant sur son
        corps hyper musclé ne le ferait pas ciller.
      de: |-
        Selbst wenn es mit voller Wucht von einem
        Profi-Ringer angegriffen wird, lässt es dies
        dank seines Muskeltrainings kalt.
      es: |-
        Sus músculos están tan desarrollados que no se
        inmuta aunque lo ataquen varios luchadores.
      it: |-
        Il suo corpo muscolosissimo resisterebbe senza
        battere ciglio all’assalto di un lottatore di wrestling.
    omega-ruby:
      ja-Hrkt: |-
        きたえあげた　きんにくの　もちぬし。
        てっこつを　たくみに　あやつって
        いっけんやを　かいたい　してくれる。
      ja: |-
        鍛えあげた　筋肉の　持ち主。
        鉄骨を　たくみに　操って
        一軒家を　解体してくれる。
      ko: |-
        단련된 근육의 소유자.
        철골을 능숙하게 조종하여
        집을 해체해준다.
      en: |-
        With strengthened bodies, they skillfully wield steel
        beams to take down buildings.
      fr: |-
        Ce Pokémon hyper musclé manipule avec habileté les poutres
        métalliques et peut démanteler un immeuble en un clin d’œil.
      de: |-
        Diese durchtrainierten Muskelprotze sind im Umgang mit
        Stahlträgern versiert und können damit ganze Häuser abreißen.
      es: |-
        Gracias a su entrenada musculatura, puede blandir vigas de
        acero sin problema para así derribar edificios enteros.
      it: |-
        Ha un corpo pieno di muscoli e manovra con abilità la sua
        trave d’acciaio, con cui può abbattere una casa intera.
    alpha-sapphire:
      ja-Hrkt: |-
        きたえあげた　きんにくの　からだは
        プロレスラーが　たばに　なって
        こうげきしても　びくとも　しない。
      ja: |-
        鍛え上げられた　筋肉の　体は
        プロレスラーが　束に　なって
        攻撃しても　びくとも　しない。
      ko: |-
        단련을 거듭한 근육덩어리 몸은
        프로레슬러가 단체로 공격해도
        꿈쩍도 하지 않는다.
      en: |-
        This Pokémon is so muscular and strongly built that
        even a group of wrestlers could not make it budge
        an inch.
      fr: |-
        Même une armée de catcheurs se jetant sur son corps
        hyper musclé ne le ferait pas ciller.
      de: |-
        Selbst wenn es mit voller Wucht von einem Profi-Ringer
        angegriffen wird, lässt es dies dank seines Muskeltrainings kalt.
      es: |-
        Sus músculos están tan desarrollados que no se inmuta
        aunque lo ataquen varios luchadores.
      it: |-
        Il suo corpo muscolosissimo resisterebbe senza battere
        ciglio all’assalto di un lottatore di wrestling.
    sword:
      ja-Hrkt: |-
        なかまや　ゴーリキーと　きんにくを
        じまん　しあう。　まけたほうは
        しばらく　すがたを　みせなくなる。
      ja: |-
        仲間や　ゴーリキーと　筋肉を
        自慢　しあう。　負けたほうは
        しばらく　姿を　見せなくなる。
      ko: |-
        동료나 근육몬과 서로
        근육을 자랑한다. 진 쪽은
        당분간 모습을 감춘다.
      zh-Hant: |-
        與其他的夥伴還有豪力
        一起比拼肌肉。輸掉的
        那一方會暫時躲起來。
      zh-Hans: |-
        与其他的伙伴还有豪力
        一起比拼肌肉。输掉的
        那一方会暂时躲起来。
      en: |-
        It shows off its muscles to Machoke and other
        Gurdurr. If it fails to measure up to the other
        Pokémon, it lies low for a little while.
      fr: |-
        Il participe à des concours de gonflette avec
        ses congénères et les Machopeur. Le perdant ne
        se montre plus en public pendant quelque temps.
      de: |-
        Strepoli und Maschock treffen sich regelmäßig
        zum Muskelvergleich. Wer schlecht abschneidet,
        lässt sich danach eine Weile nicht mehr blicken.
      es: |-
        A menudo realiza competiciones de fuerza con
        sus congéneres y con los Machoke. El perdedor
        debe pasar un tiempo sin dejarse ver.
      it: |-
        Sfoggia i suoi muscoli facendo a gara con i suoi
        simili e con Machoke. Chi perde sparisce dalla
        circolazione per un po’.
    shield:
      ja-Hrkt: |-
        てっこつを　たくみに　あやつる。
        かいたいは　とくいだが　なにかを
        くみたてるのは　にがてなのだ。
      ja: |-
        鉄骨を　たくみに　操る。
        解体は　得意だが　なにかを
        組み立てるのは　苦手なのだ。
      ko: |-
        철골을 자유자재로 다룬다.
        해체는 잘하지만 무언가를
        조립하는 것은 서툴다.
      zh-Hant: |-
        能夠靈巧地操縱鋼骨。
        雖然對拆除得心應手，
        但卻不太擅長組裝。
      zh-Hans: |-
        能够灵巧地操纵工字钢。
        虽然对拆除得心应手，
        但却不太擅长组装。
      en: |-
        Gurdurr excels at demolition—construction is not
        its forte. In any case, there’s skill in the way this
        Pokémon wields its metal beam.
      fr: |-
        Il manie la poutre métallique avec habileté.
        Il est doué pour démanteler une bâtisse, mais
        peu adroit lorsqu’il s’agit d’en construire une.
      de: |-
        Es ist gut im Tragen von Stahlträgern und im
        Abreißen von Häusern. Das Bauen dagegen
        liegt ihm nicht besonders.
      es: |-
        Blande vigas de acero con gran destreza, pero la
        construcción no se le da muy bien; de hecho, su
        especialidad es la demolición.
      it: |-
        Manovra con abilità la sua trave d’acciaio.
        È particolarmente esperto nelle demolizioni,
        mentre costruire non è il suo forte.
