        ジメジメした　日陰で　暮らす。
      ko: |-
        가장 약한 드래곤포켓몬이다.
        미끌미끌한 몸이 마르지 않도록
        축축한 그늘에서 산다.
      en: |-
        The weakest Dragon-type Pokémon,
        it lives in damp, shady places, so its
        body doesn’t dry out.
      fr: |-
        C’est le plus faible de tous les Pokémon Dragon. Pour éviter
