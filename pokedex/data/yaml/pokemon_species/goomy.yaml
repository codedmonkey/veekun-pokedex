        からだは　てきの　パンチや　キックを
        ヌルリと　すべらせてしまうのだ。
      ja: |-
        ヌメヌメの　粘膜で　覆われた　体は
        敵の　パンチや　キックを
        ヌルリと　滑らせてしまうのだ。
      ko: |-
        미끌미끌한 점막으로 덮여 있는
        몸은 적의 펀치나 킥을
        매끄럽게 미끄러뜨린다.
      en: |-
        It’s covered in a slimy membrane that makes
        any punches or kicks slide off it harmlessly.
      fr: |-
        Son corps est recouvert d’une membrane gluante,
        aussi les coups des ennemis glissent sur lui sans
        lui faire le moindre mal.
      de: |-
        Sein Körper ist von einer schleimigen Schicht umhüllt, an der
        gegnerische Tritte und Schläge abgleiten, ohne Schaden
        anzurichten.
      es: |-
        La membrana mucosa que lo recubre hace resbalar tanto los
        puñetazos como las patadas de los enemigos que lo golpean,
        gracias a su viscosidad.
      it: |-
        Il suo corpo è coperto da una membrana viscida che fa
        scivolare e devia i colpi dei nemici.
    sun:
      ja-Hrkt: |-
        もっとも　よわい　ドラゴンポケモン。
        ひふが　かわくと　いきが　できないので
        ひかげで　じーっと　しているよ。
      ja: |-
        最も　弱い　ドラゴンポケモン。
        皮膚が　乾くと　息が　できないので
        日陰で　じーっと　しているよ。
      ko: |-
        가장 약한 드래곤포켓몬.
        피부가 마르면 숨을 쉴 수 없어서
        그늘에서 가만히 있다.
      zh-Hant: |-
        最弱小的龍屬性寶可夢。
        皮膚一旦乾燥就會無法呼吸，
        因此總是靜靜地呆在遮蔭下哦。
      zh-Hans: |-
        最弱小的龙属性宝可梦。
        皮肤干燥的话就会无法呼吸，
        因此一直静静地呆在背阴处哦。
      en: |-
        The weakest of all Dragon-type Pokémon,
        it’s unable to breathe if its skin dries out,
        so it sticks to shady places.
      fr: |-
        C’est le plus faible de tous les Pokémon Dragon.
        Sa peau doit rester hydratée pour respirer, c’est
        pourquoi il préfère vivre tapi dans l’ombre.
      de: |-
        Das schwächste aller Drachen-Pokémon.
        Wenn seine Haut austrocknet, erstickt es.
        Daher hält es sich bevorzugt im Schatten auf.
      es: |-
        Es el Pokémon de tipo Dragón más débil.
        Necesita mantener la piel húmeda para respirar,
        y por eso se oculta en las sombras.
      it: |-
        È il Pokémon di tipo Drago più debole di tutti.
        La sua pelle deve restare umida per poter
        respirare e per questo si rifugia nell’ombra.
    moon:
      ja-Hrkt: |-
        ヌメヌメの　ねんまくで　みを　まもる。
        ねんまくは　ざっきんまみれ　なので
        さわったら　しっかり　てを　あらおう。
      ja: |-
        ヌメヌメの　粘膜で　身を　守る。
        粘膜は　雑菌まみれ　なので
        触ったら　しっかり　手を　洗おう。
      ko: |-
        미끌미끌한 점막으로 몸을 지킨다.
        점막은 세균투성이이므로
        만지면 반드시 손을 씻자.
      zh-Hant: |-
        用滑膩膩的黏膜保護身體。
        因為黏膜上佈滿各種細菌，
        接觸後要好好地洗手哦。
      zh-Hans: |-
        用滑腻腻的粘膜保护身体。
        因为粘膜上尽是各种细菌，
        接触后要好好地洗手哦。
      en: |-
        Its source of protection is its slimy, germ-laden
        mucous membrane. Anyone who touches it
        needs some thorough hand-washing.
      fr: |-
        Son corps est recouvert d’une membrane
        gluante protectrice, mais pleine de germes.
        Lavez-vous les mains si vous le touchez !
      de: |-
        Sein Körper ist von einer schleimigen Schutz-
        schicht umhüllt, die voller Bakterien steckt.
        Nach dem Anfassen also Hände waschen!
      es: |-
        Una membrana viscosa lo envuelve y lo protege,
        pero tiene tal cantidad de gérmenes que hay
        que lavarse bien las manos tras tocarlo.
      it: |-
        Il suo corpo è protetto da una membrana viscida
        che pullula di batteri. Meglio lavarsi bene le mani
        dopo averlo toccato!
    ultra-sun:
      ja-Hrkt: |-
        ツノで　あたりの　ようすを　さぐる。
        とても　びんかんなので　にぎられると
        ショックで　うごけなくなってしまう。
      ja: |-
        ツノで　あたりの　様子を　探る。
        とても　敏感なので　握られると
        ショックで　動けなくなってしまう。
      ko: |-
        뿔로 주변의 상황을 살핀다.
        매우 민감하여 잡으면
        쇼크로 움직일 수 없게 된다.
      zh-Hant: |-
        會用角探查周圍的狀況。
        角非常敏感，一旦被握住，
        牠就會驚嚇到無法動彈。
      zh-Hans: |-
        用角探索周围的情况。
        非常敏感，所以只要被握住，
        就会因震惊而无法动弹。
      en: |-
        It uses its horns to check out its surroundings.
        They’re very sensitive, so if you grab them, it
        will feel a strong shock and be unable to move.
      fr: |-
        Ses cornes lui permettent d’inspecter
        les alentours. Elles sont si sensibles que
        tout son corps se fige si on les pince.
      de: |-
        Mit seinen Fühlern tastet es die Umgebung ab.
        Es ist so empfindlich, dass es in Schockstarre
        verfällt, wenn man es in die Hand nimmt.
      es: |-
        Palpa los alrededores con sus cuernos. Estos
        son tan sensibles que se queda paralizado si
        alguien se los agarra.
      it: |-
        I corni con cui sonda l’ambiente circostante sono
        così sensibili che, se qualcuno glieli afferra,
        il Pokémon resta pietrificato per lo shock.
    ultra-moon:
      ja-Hrkt: |-
        からだの　ほとんどは　すいぶん。
        かんそうすると　しんでしまうので
        いつも　ひかげで　じっと　している。
      ja: |-
        身体の　ほとんどは　水分。
        乾燥すると　死んでしまうので
        いつも　日陰で　じっと　している。
      ko: |-
        몸의 대부분이 수분이다.
        건조해지면 죽어 버리므로
        언제나 그늘에서 가만히 있다.
      zh-Hant: |-
        身體絕大部分是水分，
        一旦乾燥就會死亡，
        所以總是靜靜待在陰暗處。
      zh-Hans: |-
        身体几乎都是水分。
        如果干燥就会死亡，
        所以一直都静静地呆在背阴处。
      en: |-
        Its body is mostly water. If it dries out, it will
        die, so it’s always sitting with perfect stillness
        in the shade.
      fr: |-
        Son corps est majoritairement composé d’eau.
        Il meurt s’il se dessèche, aussi préfère-t-il vivre
        tapi dans l’ombre.
      de: |-
        Sein Körper besteht fast ausschließlich aus
        Wasser. Trocknet es aus, stirbt es. Deshalb hält
        es sich immer bewegungslos im Schatten auf.
      es: |-
        La mayor parte de su cuerpo está compuesto
        por agua, por lo que muere si llega a secarse.
        Siempre se le encuentra inmóvil en la sombra.
      it: |-
        Il suo corpo è formato prevalentemente d’acqua
        e se si disidrata rischia di morire. Per questo
        se ne sta rintanato all’ombra.
    sword:
      ja-Hrkt: |-
        からだの　ほとんどが　すいぶん。
        かんそうすると　ひからびてしまう
        さいじゃくの　ドラゴンポケモン。
      ja: |-
        体の　ほとんどが　水分。
        乾燥すると　干からびてしまう
        最弱の　ドラゴンポケモン。
      ko: |-
        몸의 대부분이 수분이다.
        건조해지면 바싹 말라버리는
        가장 약한 드래곤포켓몬.
      zh-Hant: |-
        身體幾乎都是水分。
        只要環境乾燥身體就會變乾，
        是最弱的龍寶可夢。
      zh-Hans: |-
        身体几乎都是水分。
        只要环境干燥身体就会变干，
        是最弱的龙宝可梦。
      en: |-
        Because most of its body is water, it will dry up if
        the weather becomes too arid. It’s considered
        the weakest dragon Pokémon.
      fr: |-
        Son corps est principalement composé d’eau.
        S’il se déshydrate, il devient tout rabougri.
        C’est le plus faible des Pokémon Dragon.
      de: |-
        Sein Körper besteht vorwiegend aus Wasser und
        verschrumpelt daher völlig, wenn es austrocknet.
        Es ist das schwächste aller Drachen-Pokémon.
      es: |-
        Su cuerpo se compone casi exclusivamente de
        agua, por lo que se debilitaría si se deshidratase.
        Es el Pokémon de tipo Dragón más débil.
      it: |-
        Il suo corpo è composto quasi esclusivamente
        di acqua. Se si secca, avvizzisce. È il più debole
        dei Pokémon di tipo Drago.
    shield:
      ja-Hrkt: |-
        ツノは　すぐれた　かんかくきかん。
        てきの　けはいを　かんじとり　すぐに
        かくれる　ことで　いきのこってきた。
      ja: |-
        ツノは　優れた　感覚器官。
        敵の　気配を　感じ取り　すぐに
        隠れる　ことで　生き残ってきた。
      ko: |-
        뿔은 뛰어난 감각 기관이다.
        적의 기척을 느끼면 바로
        숨어들어 살아남아 왔다.
      zh-Hant: |-
        牠的觸角是優秀的感覺器官。
        只要感覺到有敵人就會立刻
        躲起來，以此存活到了現在。
      zh-Hans: |-
        它的触角是优秀的感觉器官。
        只要感觉到有敌人就会立刻
        藏起来，以此存活到了现在。
      en: |-
        Their horns are powerful sensors. As soon as
        Goomy pick up any sign of enemies, they go into
        hiding. This is how they’ve survived.
      fr: |-
        Ses cornes sont des organes sensoriels qui lui
        permettent de se cacher quand il détecte des
        ennemis. C’est grâce à cela qu’il vit toujours.
      de: |-
        Seine Fühler sind hochentwickelte Sinnesorgane.
        Da es dank ihnen Feinde sofort spüren und sich
        verstecken kann, hat es bis heute überlebt.
      es: |-
        Sus antenas son órganos sensoriales sumamente
        desarrollados. Poder esconderse nada más
        detectar enemigos le ha permitido sobrevivir.
      it: |-
        I suoi corni sono degli straordinari organi
        sensoriali. Riesce a sopravvivere nascondendosi
        non appena percepisce la presenza del nemico.
    legends-arceus:
      en: |-
        Goomy hides away in the shade of trees, where it's nice and
        humid. If the slime coating its body dries out, the Pokémon
        instantly becomes lethargic.
