goomy:
  base_happiness: 35
  capture_rate: 45
  color: purple
  egg_groups:
    - dragon
  evolution_chain: goomy
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        いちばん　よわい　ドラゴンポケモン。
        ヌメヌメの　からだが　かわかないよう
        ジメジメした　ひかげで　くらす。
      ja: |-
        一番　弱い　ドラゴンポケモン。
        ヌメヌメの　体が　乾かないよう
        ジメジメした　日陰で　暮らす。
      ko: |-
        가장 약한 드래곤포켓몬이다.
        미끌미끌한 몸이 마르지 않도록
        축축한 그늘에서 산다.
      en: |-
        The weakest Dragon-type Pokémon,
        it lives in damp, shady places, so its
        body doesn’t dry out.
      fr: |-
        C’est le plus faible de tous les Pokémon Dragon.
        Pour éviter que son corps ne se dessèche,
        il recherche les lieux humides et ombragés.
      de: |-
        Dieses schwächste aller Drachen-Pokémon lebt
        an feuchten und schattigen Plätzen, um seinen
        glitschigen Körper vor dem Austrocknen zu bewahren.
      es: |-
        Es el Pokémon de tipo Dragón más débil. Habita en
        zonas oscuras y húmedas para evitar que su viscoso
        cuerpo se seque.
      it: |-
        È il Pokémon Drago più debole di tutti. Vive in ambienti
        umidi e in ombra per evitare che il suo corpo si secchi.
    'y':
      ja-Hrkt: |-
        ヌメヌメの　ねんまくで　おおわれた
        からだは　てきの　パンチや　キックを
        ヌルリと　すべらせてしまうのだ。
      ja: |-
        ヌメヌメの　粘膜で　覆われた　体は
        敵の　パンチや　キックを
        ヌルリと　滑らせてしまうのだ。
      ko: |-
        미끌미끌한 점막으로 덮여 있는
        몸은 적의 펀치나 킥을
        매끄럽게 미끄러뜨린다.
      en: |-
        It’s covered in a slimy membrane that makes
        any punches or kicks slide off it harmlessly.
      fr: |-
        Son corps est recouvert d’une membrane gluante,
        aussi les coups des ennemis glissent sur lui sans
        lui faire le moindre mal.
      de: |-
        Sein Körper ist von einer schleimigen Schicht umhüllt,
        an der gegnerische Tritte und Schläge abgleiten, ohne
        Schaden anzurichten.
      es: |-
        La membrana mucosa que lo recubre hace resbalar
        tanto los puñetazos como las patadas de los
        enemigos que lo golpean, gracias a su viscosidad.
      it: |-
        Il suo corpo è coperto da una membrana viscida
        che fa scivolare e devia i colpi dei nemici.
    omega-ruby:
      ja-Hrkt: |-
        いちばん　よわい　ドラゴンポケモン。
