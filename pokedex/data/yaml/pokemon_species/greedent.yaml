greedent:
  base_happiness: 50
  capture_rate: 90
  color: brown
  egg_groups:
    - ground
  evolution_chain: skwovet
  evolves_from: skwovet
  flavor_text:
    sword:
      ja-Hrkt: |-
        しっぽに　きのみを　ためこむ。
        ためこみすぎて　ポロポロ　こぼすが
        にぶいので　きがつかない。
      ja: |-
        しっぽに　木の実を　溜めこむ。
        溜めこみすぎて　ポロポロ　こぼすが
        鈍いので　気がつかない。
      ko: |-
        꼬리에 나무열매를 모아둔다.
        너무 많이 모아둬서 툭툭 흘리지만
        둔감해서 눈치채지 못한다.
      zh-Hant: |-
        在尾巴裡囤積樹果。
        雖然囤過頭了就會掉出來，
        但遲鈍的牠不會發現。
      zh-Hans: |-
        在尾巴里囤积树果。
        虽然囤过头了就会掉出来，
        但是迟钝的它不会发现。
      en: |-
        It stashes berries in its tail—so many berries that
        they fall out constantly. But this Pokémon is a bit
        slow-witted, so it doesn’t notice the loss.
      fr: |-
        Il amasse tellement de Baies dans sa queue
        qu’elles tombent les unes après les autres, mais
        il est si étourdi qu’il ne s’en rend pas compte.
      de: |-
        Es hortet in seinem Schweif Beeren. Versucht es,
        zu viele unterzubringen, fallen sie heraus. Da es
        jedoch nicht allzu clever ist, bemerkt es das nicht.
      es: |-
        Se obceca tanto en acumular bayas en la cola
        que no se da ni cuenta de cuando tiene
        demasiadas y se le acaban cayendo.
      it: |-
        Conserva talmente tante bacche nella coda
        che le perde una dopo l’altra, ma non essendo
        molto perspicace non se ne rende conto.
    shield:
      ja-Hrkt: |-
        どんなに　かたい　きのみの　からも
        じまんの　はで　ボリボリ　かじる。
        ガラルでは　よく　みる　ポケモン。
      ja: |-
        どんなに　硬い　木の実の　殻も
        自慢の　歯で　ボリボリ　齧る。
        ガラルでは　よく　見る　ポケモン。
      ko: |-
        아무리 단단한 나무열매 껍질도
        이빨로 아작아작 갉아 먹는다.
        가라르에서 쉽게 볼 수 있는 포켓몬이다.
      zh-Hant: |-
        無論多麼堅硬的樹果殼
        都能用引以為傲的大牙咬碎。
        在伽勒爾是很常見的寶可夢。
      zh-Hans: |-
        无论多么坚硬的树果壳
        都能用引以为傲的大牙咬碎。
        在伽勒尔是很常见的宝可梦。
      en: |-
        Common throughout the Galar region, this
        Pokémon has strong teeth and can chew
        through the toughest of berry shells.
      fr: |-
        On rencontre souvent ce Pokémon à Galar.
        Aucune coquille de Baie ne résiste à ses incisives,
        dont il est très fier.
      de: |-
        Diesem Pokémon begegnet man häufig in Galar.
        Es ist sehr stolz auf seine Zähne, mit denen es
        jede noch so harte Beerenschale knacken kann.
      es: |-
        Sus incisivos, de fuerza y dureza extraordinarias,
        le permiten mordisquear incluso las bayas más
        duras. Es un Pokémon muy común en Galar.
      it: |-
        Un Pokémon che si incontra spesso a Galar.
        Ha denti eccezionali, con i quali rosicchia anche
        le bacche più dure.
