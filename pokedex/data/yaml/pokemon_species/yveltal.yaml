yveltal:
  base_happiness: 0
  capture_rate: 45
  color: red
  egg_groups:
    - no-eggs
  evolution_chain: yveltal
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        つばさと　おばねを　ひろげて　あかく
        かがやくとき　いきものの　いのちを
        すいとる　でんせつの　ポケモン。
      ja: |-
        翼と　尾羽を　広げて　赤く　輝くとき
        生き物の　命を　吸い取る
        伝説の　ポケモン。
      ko: |-
        날개와 꼬리를 펼치고 빨갛게
        빛날 때 살아 있는 생명을
        빨아들이는 전설의 포켓몬.
      en: |-
        When this legendary Pokémon’s wings and
        tail feathers spread wide and glow red,
        it absorbs the life force of living creatures.
      fr: |-
        Lorsque les plumes de sa queue et de ses ailes sont
        déployées et virent au rouge, ce Pokémon légendaire
        absorbe l’énergie vitale de ce qui l’entoure.
      de: |-
        Wenn Schwingen und Schwanzgefieder
        dieses Legendären Pokémon rot leuchten,
        entzieht es Lebewesen deren Energie.
      es: |-
        Pokémon legendario que, al extender sus alas y las
        plumas de la cola, emite un brillo carmesí que absorbe
        la energía vital de su enemigo.
      it: |-
        Quando le ali e le piume della coda di questo
        Pokémon leggendario sono spiegate e di colore rosso
        acceso, può assorbire l’energia degli esseri viventi.
    'y':
      ja-Hrkt: |-
        じゅみょうが　つきるとき　あらゆる
        いきものの　いのちを　すいつくし
        まゆの　すがたに　もどるという。
      ja: |-
        寿命が　つきるとき　あらゆる
        生き物の　命を　吸いつくし
        繭の　姿に　戻るという。
      ko: |-
        수명이 다할 때 모든
        생명의 목숨을 빨아들이고
        고치의 모습으로 돌아간다고 한다.
      en: |-
        When its life comes to an end, it absorbs
        the life energy of every living thing
        and turns into a cocoon once more.
      fr: |-
        Quand il sent que la fin de sa vie est proche, il aspire
        la force vitale des êtres vivants et retourne à l’état
        de cocon.
      de: |-
        Neigt sich seine Lebensspanne dem Ende zu,
        entzieht es anderen Lebewesen deren Energie
        und verwandelt sich zurück in einen Kokon.
      es: |-
        Cuando su vida se extingue, absorbe la vitalidad de
        todos los seres vivos y regresa a su forma de crisálida.
      it: |-
        Secondo la leggenda, quando la sua lunga esistenza
        giunge al termine, assorbe l’energia di tutti gli esseri
        viventi e si trasforma in un bozzolo.
    omega-ruby:
