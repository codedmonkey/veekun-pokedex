      fr: |-
        Il nageait dans les océans il y a 100 millions d’années.
        Il lui arrive de rallier la terre ferme pour attaquer ses proies.
      de: |-
        Schwamm bereits vor 100 Millionen Jahren durch die Meere.
        Ab und zu führt es die Jagd auch an Land.
      es: |-
        Ya pululaba por las aguas hace 100 millones de años.
        También va a tierra a veces en busca de alimento.
      it: |-
