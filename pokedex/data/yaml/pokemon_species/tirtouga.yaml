tirtouga:
  base_happiness: 50
  capture_rate: 45
  color: blue
  egg_groups:
    - water1
    - water3
  evolution_chain: tirtouga
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        Restored from a fossil, this Pokémon
        can dive to depths beyond half a mile.
      fr: |-
        Il a été recréé à partir d’un fossile
        préhistorique. Il peut plonger jusqu’à
        1 000 mètres de profondeur.
    white:
      en: |-
        About 100 million years ago, these
        Pokémon swam in oceans. It is thought
        they also went on land to attack prey.
      fr: |-
        Il nageait dans les océans il y a 100
        millions d’années. Il lui arrive de rallier
        la terre ferme pour attaquer ses proies.
    black-2:
      en: |-
        This Pokémon was restored from a fossil.
        It swam skillfully and dove
        to depths beyond half a mile.
    white-2:
      en: |-
        This Pokémon was restored from a fossil.
        It swam skillfully and dove
        to depths beyond half a mile.
    x:
      ja-Hrkt: |-
        およそ　１おくねんまえの　うみを
        およいでいた。りくちへ　あがって
        えものに　おそいかかる　こともある。
      ja: |-
        およそ　１億年前の　海を
        泳いでいた。陸地へ　上がって
        獲物に　襲いかかる　こともある。
      ko: |-
        약 1억 년 전 바다를
        헤엄쳐 다녔다. 육지에 올라
        먹이를 덮치는 일도 있다.
      en: |-
        About 100 million years ago, these Pokémon swam
        in oceans. It is thought they also went on land to
        attack prey.
      fr: |-
        Il nageait dans les océans il y a 100 millions
        d’années. Il lui arrive de rallier la terre ferme pour
        attaquer ses proies.
      de: |-
        Schwamm bereits vor 100 Millionen Jahren durch
        die Meere. Ab und zu führt es die Jagd auch an Land.
      es: |-
        Ya pululaba por las aguas hace 100 millones de años.
        También va a tierra a veces en busca de alimento.
      it: |-
        Nuotava nei mari 100 milioni di anni fa. A volte sale
        in superficie per aggredire le prede.
    'y':
      ja-Hrkt: |-
        こだいの　かせきから　ふっかつした。
        ふかさ　１０００メートルまで
        せんすいすることが　できる。
      ja: |-
        古代の　化石から　復活した。
        深さ　１０００メートルまで
        潜水することが　できる。
      ko: |-
        고대 화석에서 부활했다.
        1000m 깊이까지
        잠수할 수 있다.
      en: |-
        Restored from a fossil, this Pokémon can dive to
        depths beyond half a mile.
      fr: |-
        Il a été recréé à partir d’un fossile préhistorique.
        Il peut plonger jusqu’à 1 000 mètres de profondeur.
      de: |-
        Es wurde aus einem urzeitlichen Fossil reanimiert.
        Es kann in Tiefen von bis zu 1 000 m abtauchen.
      es: |-
        Ha renacido de un fósil prehistórico. Puede sumergirse
        hasta 1000 m de profundidad.
      it: |-
        Si è risvegliato da un antico fossile. Può immergersi
        fino a 1000 m di profondità.
    omega-ruby:
      ja-Hrkt: |-
        およそ　１おくねんまえの　うみを
        およいでいた。りくちへ　あがって
        えものに　おそいかかる　こともある。
      ja: |-
        およそ　１億年前の　海を
        泳いでいた。陸地へ　上がって
        獲物に　襲いかかる　こともある。
      ko: |-
        약 1억 년 전 바다를
        헤엄쳐 다녔다. 육지에 올라
        먹이를 덮치는 일도 있다.
      en: |-
        About 100 million years ago, these Pokémon swam
        in oceans. It is thought they also went on land to
