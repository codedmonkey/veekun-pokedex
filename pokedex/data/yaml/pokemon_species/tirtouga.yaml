        superficie per aggredire le prede.
    alpha-sapphire:
      ja-Hrkt: |-
        こだいの　かせきから　ふっかつした。
        ふかさ　１０００メートルまで
        せんすいすることが　できる。
      ja: |-
        古代の　化石から　復活した。
        深さ　１０００メートルまで
        潜水することが　できる。
      ko: |-
        고대 화석에서 부활했다.
        1000m 깊이까지
        잠수할 수 있다.
      en: |-
        Restored from a fossil, this Pokémon can dive to
        depths beyond half a mile.
      fr: |-
        Il a été recréé à partir d’un fossile préhistorique. Il peut
        plonger jusqu’à 1 000 mètres de profondeur.
      de: |-
        Es wurde aus einem urzeitlichen Fossil reanimiert. Es kann in
        Tiefen von bis zu 1 000 m abtauchen.
      es: |-
        Ha renacido de un fósil prehistórico. Puede sumergirse hasta
        1000 m de profundidad.
      it: |-
        Si è risvegliato da un antico fossile. Può immergersi fino
        a 1000 m di profondità.
    sun:
      ja-Hrkt: |-
        こっかくを　しらべるかぎり　およそ
        １０００メートルの　しんかいまで
        もぐっていくことが　できたようだ。
      ja: |-
        骨格を　調べる限り　およそ
        １０００メートルの　深海まで
        潜っていくことが　できたようだ。
      ko: |-
        골격을 조사해보니
        약 1000m의 심해까지
        잠수할 수 있었던 것 같다.
      zh-Hant: |-
        根據對其骨骼的調查結果，
        牠好像能潛水到大約
        １０００米的深海之中。
      zh-Hans: |-
        根据对其骨骼的调查结果，
        它似乎能潜到大约
        １０００米的深海之中。
      en: |-
        Based on studies of its skeletal structure, it can
        apparently dive to ocean depths of over half
        a mile.
      fr: |-
        L’étude de sa structure squelettique suggère
        qu’il était autrefois capable de plonger
        jusqu’à 1 000 m de profondeur.
      de: |-
        Eine Untersuchung seiner Skelettstruktur hat
        ergeben, dass es in Tiefen von bis zu 1 000 m
        abtauchen kann.
      es: |-
        A juzgar por su estructura ósea, se calcula
        que podía sumergirse hasta 1 km de
        profundidad.
      it: |-
        A giudicare dalla struttura ossea, sembra che
        fosse capace di immergersi fino a 1.000 m
        di profondità. 
    moon:
      ja-Hrkt: |-
        おおくの　かめポケモンの　せんぞと
        いわれる。　やく１おくねんまえの
        あたたかい　うみに　すんでいた。
      ja: |-
        多くの　かめポケモンの　先祖と
        いわれる。　約１億年前の
        温かい　海に　棲んでいた。
      ko: |-
        많은 거북포켓몬의 조상이라
        전해진다. 약 1억 년 전의
        따뜻한 바다에서 살았다.
      zh-Hant: |-
        據說是大部分龜寶可夢的祖先。
        曾經生活在大約１億年前的
        溫暖大海裡。
      zh-Hans: |-
        据说是大部分龟宝可梦的祖先。
        曾经生活在大约１亿年前的
        温暖大海里。
      en: |-
        Reputed to be the ancestor of most turtle
        Pokémon, it lived in warm seas approximately
        a hundred million years ago.
      fr: |-
        Ancêtre présumé de nombreuses espèces de
        Pokémon tortues, il peuplait les mers chaudes
        du monde il y a environ 100 millions d’années.
      de: |-
        Man sagt, es sei der Vorfahre der meisten
        Schildkröten-Pokémon. Es lebte vor etwa
        100 Millionen Jahren im warmen Meer.
      es: |-
        Se dice que es el predecesor de numerosos
        Pokémon tortuga. Hace unos 100 millones de
        años ya habitaba mares templados.
      it: |-
        Si dice che sia l’antenato di molti Pokémon con
        carapace. Nuotava nei mari caldi 100 milioni
        di anni fa.
    ultra-sun:
      ja-Hrkt: |-
        こだいの　かせきから　ふっかつ。
        うみに　くらしていたが　えものを
        さがして　りくにも　あがっていた。
      ja: |-
        古代の　化石から　復活。
        海に　暮らしていたが　獲物を
        探して　陸にも　あがっていた。
      ko: |-
        고대 화석에서 부활했다.
        바다에 살고 있었지만, 먹이를
        찾아 지상으로 올라왔다.
      zh-Hant: |-
        從古代的化石復活而來。
        當時是生活在海裡，
        但也會到陸地上來尋找獵物。
      zh-Hans: |-
        由古代的化石复活而来。
        曾生活在海里，
        但也会到陆地上来寻找猎物。
      en: |-
        It was restored from an ancient fossil. Tirtouga
        lived in the sea but came up onto the land to
        search for prey.
      fr: |-
        Il a été recréé à partir d’un fossile préhistorique.
        Il vivait autrefois dans la mer, mais avait su
        s’adapter pour chasser aussi sur la terre ferme.
      de: |-
        Es wurde aus einem urzeitlichen Fossil wieder
        zum Leben erweckt. Zwar lebte es im Meer, zur
        Futtersuche ging es jedoch auch an Land.
      es: |-
        Se ha logrado reconstruir a partir de fósiles.
        Aunque viviera en el mar, no dudaba en salir del
        agua a tierra firme en busca de presas.
      it: |-
        È stato rigenerato da un antico fossile.
        In passato viveva nel mare, ma per cacciare
        non esitava a spostarsi sulla terraferma.
    ultra-moon:
      ja-Hrkt: |-
        ふかさ　１０００メートルの
        しんかいから　りくち　まで　ひろい
        はんいを　かりばに　していた。
      ja: |-
        深さ　１０００メートルの
        深海から　陸地まで　広い
        範囲を　狩場に　していた。
      ko: |-
        수심 1000m의 심해에서
        육지에 이르기까지
        넓은 범위를 사냥터로 삼았다.
      zh-Hant: |-
        從１０００公尺深的深海
        一直到陸地上的廣大範圍
        都曾經是牠的獵場。
      zh-Hans: |-
        从１０００米深的深海到陆地，
        这样广阔的范围曾经都是它的狩猎场。
      en: |-
        Its hunting grounds encompassed a broad area,
        from the land to more than half a mile deep in
        the ocean.
      fr: |-
        Son terrain de chasse s’étendait sur un très
        vaste territoire, de la terre ferme jusqu’à
        1 000 m sous les mers.
      de: |-
        Sein Jagdrevier erstreckte sich einst von bis
        zu 1 000 m tiefen Meeresgebieten bis zum
        Festland.
      es: |-
        Poseía un vasto territorio de caza, que abarcaba
        desde la tierra firme hasta una profundidad
        marina de 1 km.
      it: |-
        Si immergeva fino a 1.000 m di profondità e
        il suo territorio di caccia si estendeva dagli
        abissi marini alla terraferma.
    sword:
      ja-Hrkt: |-
        こだいの　うみに　すんでいた。
        はいずることしか　できないが
        えもののために　りくにも　あがる。
      ja: |-
        古代の　海に　棲んでいた。
        這いずることしか　できないが
        獲物のために　陸にも　上がる。
      ko: |-
        고대의 바다에 살았다.
        기어 다니는 것만 가능하지만
        먹이를 위해서는 육지에 오르기도 한다.
      zh-Hant: |-
        曾經棲息在古代的海洋裡。
        雖然只能爬行，但是為了
        尋找獵物也會到陸地上來。
      zh-Hans: |-
        曾经栖息于古代的海洋。
        虽然只会爬着走，但为了
        寻找猎物也会到陆地上来。
      en: |-
        This Pokémon inhabited ancient seas. Although
        it can only crawl, it still comes up onto land in
        search of prey.
      fr: |-
        Il vivait dans la mer pendant l’ère préhistorique.
        Il lui arrive de s’aventurer sur la terre ferme pour
        chasser, bien qu’il ne puisse que ramper.
      de: |-
        Dieser Meeresbewohner der Urzeit kann sich
        außerhalb der See nur kriechend fortbewegen,
        aber für seine Beute kommt es trotzdem an Land.
      es: |-
        Vivía en los mares de hace millones de años. Sale
        a tierra para buscar presas, aunque solo se pueda
        desplazar reptando.
      it: |-
        Nell’antichità viveva nei mari. Pur essendo solo
        in grado di strisciare, sale anche sulla terraferma
        in cerca di prede.
    shield:
      ja-Hrkt: |-
        おおくの　かめポケモンの　せんぞと
        かんがえられている　ポケモン。
        かせきから　ふくげん　された。
      ja: |-
        多くの　かめポケモンの　先祖と
        考えられている　ポケモン。
        化石から　復元された。
      ko: |-
        많은 거북포켓몬의 선조로
        여겨지고 있는 포켓몬이다.
        화석에서 복원되었다.
      zh-Hant: |-
        從化石復原的寶可夢。
        被認為是許多的
        龜寶可夢的祖先。
      zh-Hans: |-
        由化石复活的宝可梦。
        人们认为它是很多
        龟宝可梦的祖先。
      en: |-
        Tirtouga is considered to be the ancestor of
        many turtle Pokémon. It was restored to life
        from a fossil.
      fr: |-
        Ancêtre présumé de nombreuses espèces
        de Pokémon tortues, il a été restauré à partir
        d’un fossile.
      de: |-
        Man vermutet, Galapaflos sei der Vorfahr vieler
        Schildkröten-Pokémon. Es wurde aus einem
        urzeitlichen Fossil wieder zum Leben erweckt.
      es: |-
        Se piensa que es el antepasado de numerosos
        Pokémon tortuga. Fue regenerado a partir de un
        fósil.
      it: |-
        Si ritiene sia l’antenato di molti Pokémon con
        carapace. È stato rigenerato da un fossile.
