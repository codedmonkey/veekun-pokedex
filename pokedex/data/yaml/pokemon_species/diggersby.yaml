diggersby:
  base_happiness: 50
  capture_rate: 127
  color: brown
  egg_groups:
    - ground
  evolution_chain: bunnelby
  evolves_from: bunnelby
  flavor_text:
    x:
      ja-Hrkt: |-
        おおきな　みみは　１トンを　こえる
        いわを　らくに　もちあげる　パワー。
        こうじげんばで　だいかつやくする。
      ja: |-
        大きな　耳は　１トンを　超える 岩を
        楽に　持ち上げる　パワー。
        工事現場で　大活躍する。
      ko: |-
        커다란 귀에는 무게가 1톤을 넘는 바위를
        가뿐히 들어 올릴 만한 파워가 있다.
        공사 현장에서 대활약한다.
      en: |-
        With their powerful ears, they can heft
        boulders of a ton or more with ease.
        They can be a big help at construction sites.
      fr: |-
        Ses grandes oreilles sont si musclées qu’il peut
        soulever un rocher d’une tonne sans broncher.
        Ce Pokémon est souvent utilisé sur les chantiers.
      de: |-
        Seine großen Ohren besitzen die Kraft, selbst Felsen,
        die 1 t schwer sind, mühelos hochzuheben.
        Es wird daher oft auf Baustellen eingesetzt.
      es: |-
        Sus grandes orejas tienen tal fuerza que con ellas
        puede levantar con facilidad rocas de más de una
        tonelada. Es de una ayuda inestimable en las obras.
      it: |-
        Con le sue grandi orecchie può sollevare facilmente
        massi da più di una tonnellata. Può essere di grande
        aiuto nei cantieri edili.
    'y':
      ja-Hrkt: |-
        ショベルカーなみの　パワーの　みみで
        かたい　がんばんも　コナゴナ。あなを
        ほりおえると　ダラダラと　すごす。
      ja: |-
        ショベルカー並みの　パワーの　耳で
        硬い　岩盤も　コナゴナ。穴を
        掘り終えると　ダラダラと　過ごす。
      ko: |-
        굴착기에 버금가는 파워의 귀로
        단단한 암반도 산산조각 낸다.
        구멍을 다 파면 빈둥빈둥 지낸다.
      en: |-
        As powerful as an excavator, its ears
        can reduce dense bedrock to rubble.
        When it’s finished digging, it lounges lazily.
      fr: |-
        Ses oreilles sont de véritables excavateurs, venant à
        bout des blocs de pierre les plus durs.
        Après l’effort, il se repose en paressant.
      de: |-
        Mit Ohren so mächtig wie ein Bagger kann es selbst
        das härteste Gestein zertrümmern. Ist es fertig mit
        Graben, lümmelt es herum.
      es: |-
        Sus orejas, tan poderosas como una excavadora,
        pueden hacer añicos hasta la roca más sólida.
        Cuando termina de cavar, se toma un respiro.
      it: |-
        Le orecchie potenti quanto una scavatrice
        gli permettono di sbriciolare anche rocce durissime.
        Quando ha finito di scavare, si rilassa beatamente.
