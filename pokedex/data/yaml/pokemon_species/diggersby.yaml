    sword:
      ja-Hrkt: |-
        ショベルカーに　まけない　パワーで
        かたい　がんばんも　ほりすすむ。
        トンネルこうじで　だいかつやく。
      ja: |-
        ショベルカーに　負けない　パワーで
        硬い　岩盤も　掘り進む。
        トンネル工事で　大活躍。
      ko: |-
        굴착기에 뒤지지 않는 파워로
        단단한 암반도 파고 들어간다.
        터널 공사에서 크게 활약한다.
      zh-Hant: |-
        力量不亞於挖掘機，
        連堅硬的岩盤也能挖掘。
        在隧道建設工程中十分活躍。
      zh-Hans: |-
        力量不亚于挖掘机，
        连坚硬的岩盘也能挖掘。
        在隧道建设工程中十分活跃。
      en: |-
        With power equal to an excavator, it can dig
        through dense bedrock. It’s a huge help during
        tunnel construction.
      fr: |-
        Aussi puissant qu’une pelleteuse, il peut venir
        à bout de la roche la plus dure. On fait souvent
        appel à lui pour forer des tunnels.
      de: |-
        Seine Stärke gleicht der eines Baggers, sodass es
        sich durch harte Gesteinsschichten graben kann.
        Es leistet großartige Arbeit beim Tunnelbau.
      es: |-
        Puede horadar incluso el duro sustrato rocoso
        con la fuerza de una excavadora, por lo que su
        ayuda resulta inestimable para construir túneles.
      it: |-
        Riesce a scavare strati rocciosi durissimi grazie
        alla sua forza pari a quella di una scavatrice.
        È di grande aiuto nei lavori di scavo dei tunnel.
    shield:
      ja-Hrkt: |-
        おなかの　たいもうは　ほおんせいに
        すぐれる。　むかしの　ひとは　ぬけた
        たいもうで　ぼうかんぎを　つくった。
      ja: |-
        お腹の　体毛は　保温性に
        優れる。　昔の　人は　抜けた
        体毛で　防寒着を　つくった。
      ko: |-
        배의 털은 보온성이 뛰어나다.
        옛날 사람들은 파르토의 몸에서
        빠진 털로 방한복을 만들었다.
      zh-Hant: |-
        肚子上的體毛保溫性能優秀。
        在過去，人們會用牠掉落的毛
        來製作保暖服裝。
      zh-Hans: |-
        肚子上的体毛保温性能优秀。
        在过去，人们会用它的落毛
        来制作保暖服装。
      en: |-
        The fur on its belly retains heat exceptionally
        well. People used to make heavy winter clothing
        from fur shed by this Pokémon.
      fr: |-
        La fourrure de son ventre est un excellent isolant
        thermique. Jadis, on fabriquait des vêtements
        chauds en se servant de sa mue.
      de: |-
        Das Fell an seinem Bauch hält es schön warm.
        Früher haben die Menschen daraus Kleidung
        gefertigt, die sie vor Kälte schützte.
      es: |-
        El pelaje de su abdomen es un aislante térmico
        excelente, tanto que antaño se usaba el que
        mudaba para confeccionar prendas de abrigo.
      it: |-
        La pelliccia sul suo addome lo mantiene caldo.
        Gli antichi confezionavano abiti termici resistenti
        al freddo con il pelo raccolto dopo la sua muta.
