    white-2:
      en: |-
        Because it can use all kinds of
        moves, many scientists believe Mew
        to be the ancestor of Pokémon.
    x:
      ja-Hrkt: |-
        あらゆる　わざを　つかうため
        ポケモンの　せんぞと　かんがえる
        がくしゃが　たくさん　いる。
      ja: |-
        あらゆる　技を　使うため
        ポケモンの　先祖と　考える
        学者が　たくさん　いる。
      ko: |-
        모든 기술을 사용하기 때문에
        포켓몬의 조상이라고 생각하는
        학자가 많다.
      en: |-
        Because it can use all kinds of moves, many
        scientists believe Mew to be the ancestor
        of Pokémon.
      fr: |-
        Nombre de scientifiques voient en lui l’ancêtre
        des Pokémon car il maîtrise toutes leurs capacités.
      de: |-
        Es beherrscht alle möglichen Attacken, daher sieht
        man in ihm den Vorfahren aller Pokémon.
      es: |-
        Varios científicos lo consideran el antecesor de los
        Pokémon porque usa todo tipo de movimientos.
      it: |-
        Poiché sa usare qualsiasi mossa, molti scienziati
        ritengono che Mew sia l’antenato di tutti i Pokémon.
    'y':
      ja-Hrkt: |-
        いでんしには　すべての　ポケモンの
        じょうほうが　ふくまれているので
        あらゆる　わざが　つかえるという。
      ja: |-
        遺伝子には　すべての　ポケモンの
        情報が　含まれているので
        あらゆる　技が　使えるという。
      ko: |-
        유전자에는 모든 포켓몬의
        정보가 담겨 있기 때문에
        모든 기술을 쓸 수 있다고 전해진다.
      en: |-
        Its DNA is said to contain the genetic codes of all
        Pokémon, so it can use all kinds of techniques.
      fr: |-
        Son ADN contient les codes génétiques de tous
        les Pokémon. Il peut utiliser nombre de techniques.
      de: |-
        Seine DNS soll den genetischen Code aller Pokémon
        beinhalten. Dadurch kann es alle Attacken erlernen.
      es: |-
        Dicen que su ADN contiene el código genético de
        todos los Pokémon, por lo que conoce cualquier
        técnica.
      it: |-
        Pare che il suo DNA contenga i codici genetici di tutti
        i Pokémon; per questo può usare qualsiasi tecnica.
    omega-ruby:
      ja-Hrkt: |-
        すべての　ポケモンの　いでんしを　もつと　いう。
        じゆうじざいに　すがたを　けすことが　できるので
        ひとに　ちかづいても　まったく　きづかれない。
      ja: |-
        すべての　ポケモンの　遺伝子を　もつと　いう。
        自由自在に　姿を　消すことが　できるので
        人に　近づいても　まったく　気づかれない。
      ko: |-
        모든 포켓몬의 유전자를 가졌다고 한다.
        자유자재로 모습을 숨길 수 있어서
        사람에게 가까이 다가가도 절대 들키지 않는다.
      en: |-
        Mew is said to possess the genetic composition of all
        Pokémon. It is capable of making itself invisible at will,
        so it entirely avoids notice even if it approaches people.
      fr: |-
        On dit que Mew possède le code génétique de tous les autres
        Pokémon. Il peut se rendre invisible à sa guise, ce qui lui
        permet de ne pas se faire remarquer quand il s’approche
        des gens.
      de: |-
        Mew soll die genetische Zusammensetzung aller Pokémon
        besitzen. Es kann sich unsichtbar machen, sodass es sich
        auch Menschen nähern kann, ohne bemerkt zu werden.
      es: |-
        Dicen que Mew posee el mapa genético de todos los
        Pokémon. Puede hacerse invisible cuando quiere, así que
        pasa desapercibido cada vez que se le acerca alguien.
      it: |-
        Si dice che Mew possegga il patrimonio genetico di tutti
        i Pokémon. È in grado di rendersi invisibile, quando vuole,
        in modo da non farsi notare nemmeno da vicino.
    alpha-sapphire:
      ja-Hrkt: |-
        すべての　ポケモンの　いでんしを　もつと　いう。
