alakazam:
  base_happiness: 50
  capture_rate: 50
  color: brown
  egg_groups:
    - humanshape
  evolution_chain: abra
  evolves_from: kadabra
  flavor_text:
    red:
      en: |-
        Its brain can out­
        perform a super­
        computer.Its intelligence
        quotient is said
        to be 5,000.
    blue:
      en: |-
        Its brain can out­
        perform a super­
        computer.Its intelligence
        quotient is said
        to be 5,000.
    yellow:
      en: |-
        A POKéMON that can
        memorize anything.
        It never forgetswhat it learns--
        that's why this
        POKéMON is smart.
    gold:
      en: |-
        Closing both its
        eyes heightens all
        its other senses.This enables it to
        use its abilities
        to their extremes.
    silver:
      en: |-
        Its brain cells
        multiply continu­
        ally until itdies. As a result,
        it remembers
        everything.
    crystal:
      en: |-
        It has an IQ of
        5000. It calcu­
        lates many thingsin order to gain
        the edge in every
        battle.
    ruby:
      en: |-
        ALAKAZAM’s brain continually grows,
        making its head far too heavy to
        support with its neck.This POKéMON holds its head up using
        its psychokinetic power instead.
    sapphire:
      en: |-
        ALAKAZAM’s brain continually grows,
        infinitely multiplying brain cells.
        This amazing brain gives this POKéMONan astoundingly high IQ of 5,000.
        It has a thorough memory of everything
        that has occurred in the world.
    emerald:
      en: |-
        While it has strong psychic abilities and
        high intelligence, an ALAKAZAM’s muscles
        are very weak. It uses psychic power to
        move its body.
    firered:
      en: |-
        It does not like physical attacks very 
        much. Instead, it freely uses extra­
        sensory powers to defeat foes.
    leafgreen:
      en: |-
        Its brain can outperform a supercomputer.
        Its IQ (intelligence quotient) is said to
        be around 5,000.
    diamond:
      en: |-
        Its superb memory lets it recall
        everything it has experienced from
        birth. Its IQ exceeds 5,000.
    pearl:
      en: |-
        Its highly developed brain is on
        par with a supercomputer. It can
        use all forms of psychic abilities.
    platinum:
      en: |-
        The spoons clutched in its hands
        are said to have been created by
        its psychic powers.
    heartgold:
      en: |-
        Closing both its eyes heightens all
        its other senses. This enables it to
        use its abilities to their extremes.
    soulsilver:
      en: |-
        Its brain cells multiply continually
        until it dies. As a result,
        it remembers everything.
    black:
      en: |-
        The spoons clutched in its hands
        are said to have been created by
        its psychic powers.
      fr: |-
        On dit que les cuillères qu’il tient
        en permanence ont été créées
        par la puissance de son esprit.
    white:
      en: |-
        The spoons clutched in its hands
        are said to have been created by
        its psychic powers.
      fr: |-
        On dit que les cuillères qu’il tient
        en permanence ont été créées
        par la puissance de son esprit.
    black-2:
      en: |-
        The spoons clutched in its hands
        are said to have been created by
        its psychic powers.
    white-2:
      en: |-
        The spoons clutched in its hands
        are said to have been created by
        its psychic powers.
    x:
      ja-Hrkt: |-
        のうさいぼうは　いつも　ぶんれつして
        しぬまで　ふえつづけるので
        あらゆることを　おぼえておける。
      ja: |-
        脳細胞は　いつも　分裂して
        死ぬまで　増え続けるので
        あらゆることを　覚えておける。
      ko: |-
        뇌세포는 항상 분열해서
        죽을 때까지 늘어나기 때문에
        모든 것을 기억해 놓을 수 있다.
      en: |-
        Its brain cells multiply continually until it dies.
        As a result, it remembers everything.
      fr: |-
        Ses cellules cérébrales se multiplient jusqu’à sa mort.
        Il se souvient donc de tout.
      de: |-
        Seine Gehirnzellen vervielfachen sich sein ganzes
        Leben lang. Daher kann es sich immer an alles
        erinnern.
      es: |-
        Sus neuronas se multiplican continuamente durante su
        vida. Por eso, siempre lo recuerda todo.
      it: |-
        Le sue cellule cerebrali si moltiplicano di continuo.
        Perciò ricorda qualsiasi cosa gli accada.
    'y':
      ja-Hrkt: |-
        スーパーコンピュータより　すばやく
        けいさんする　ずのうを　もつ。
        ちのうしすうは　だいたい５０００。
      ja: |-
        スーパーコンピュータより　素早く
        計算する　頭脳を　持つ。
        知能指数は　だいたい５０００。
      ko: |-
        슈퍼컴퓨터보다 빠르게
        계산하는 두뇌를 가졌다.
        지능지수는 약 5000이다.
      en: |-
        Its brain can outperform a supercomputer. Its IQ
        (intelligence quotient) is said to be around 5,000.
      fr: |-
        Son cerveau hors du commun peut effectuer des
        opérations à la vitesse d’un ordinateur. Il a un QI
        de 5 000.
      de: |-
        Das Gehirn dieses Pokémon ist leistungsfähiger als
        ein Computer. Sein IQ soll bei etwa 5 000 liegen.
      es: |-
        Su cerebro puede ganar al de un ordenador de alta
        gama. Tiene un coeficiente intelectual de 5000.
      it: |-
        Il suo cervello può superare un supercomputer.
        Il suo quoziente intellettivo è di 5000.
    omega-ruby:
      ja-Hrkt: |-
        のうが　どんどん　おおきくなったので　くびでは
        ささえきれないほど　あたまが　おもくなった。
        ちょうのうりょくで　あたまを　ささえているのだ。
      ja: |-
        脳が　どんどん　大きくなったので　首では
        支えきれないほど　頭が　重くなった。
        超能力で　頭を　支えているのだ。
      ko: |-
        뇌가 점점 커져서 목으로는 지탱할 수
        없을 만큼 머리가 무거워졌다.
        초능력으로 머리를 지탱하고 있다.
      en: |-
        Alakazam’s brain continually grows, making its head far too
        heavy to support with its neck. This Pokémon holds its head up
        using its psychokinetic power instead.
      fr: |-
        Le cerveau d’Alakazam grossit sans arrêt, si bien que sa tête
        devient trop lourde pour son cou. Ce Pokémon maintient sa
        tête relevée grâce à son pouvoir télékinétique.
      de: |-
        Simsalas Gehirn hört nicht auf zu wachsen, sodass sein Kopf
        zu schwer für seine Nackenmuskulatur wird. Dieses Pokémon
        hält seinen Kopf mit psychokinetischer Energie aufrecht.
      es: |-
        El cerebro de Alakazam nunca deja de crecer y por eso al
        cuello le cuesta sostener el peso de la cabeza. Este Pokémon
        usa sus poderes psicoquinéticos para mantener en alto la
        cabeza.
      it: |-
        Il cervello di Alakazam cresce in continuazione rendendo
        la sua testa troppo pesante per il collo. Pertanto è costretto
        a usare i suoi poteri psicocinetici per sostenerla.
    alpha-sapphire:
      ja-Hrkt: |-
        むげんに　ふえる　のうさいぼうが　ちのうしすう
        ５０００の　スーパーずのうを　つくりだした。
        せかいの　できごとを　すべて　きおくしている。
      ja: |-
        無限に　増える　脳細胞が　知能指数
        ５０００の　スーパー頭脳を　つくりだした。
        世界の　出来事を　すべて　記憶している。
      ko: |-
        무한히 늘어나는 뇌세포가 지능지수
        5000의 슈퍼 두뇌를 만들어냈다.
        전 세계에서 일어난 일을 모두 기억하고 있다.
      en: |-
        Alakazam’s brain continually grows, infinitely multiplying
        brain cells. This amazing brain gives this Pokémon an
        astoundingly high IQ of 5,000. It has a thorough memory
        of everything that has occurred in the world.
      fr: |-
        Le cerveau d’Alakazam grossit sans arrêt, multipliant sans
        cesse ses cellules. Ce Pokémon a un QI incroyablement
        élevé, de 5 000. Il peut garder en mémoire tout ce qui
        s’est passé dans le monde.
      de: |-
        Simsalas Hirn wächst stetig weiter und seine Gehirnzellen
        werden unendlich vervielfacht. Durch sein verblüffendes Gehirn
        erreicht dieses Pokémon einen IQ von 5 000. Es erinnert sich
        an alles, was in der Welt passiert ist.
      es: |-
        El cerebro de Alakazam siempre está creciendo y el número
        de neuronas no deja de aumentar. Este Pokémon tiene un
        cociente intelectual de 5000. Tiene archivado en su memoria
        todo lo que ha ocurrido en el mundo.
      it: |-
        Il cervello di Alakazam cresce in continuazione, moltiplicando
        all’infinito le cellule cerebrali. Questo gli assegna un
        sorprendente QI di 5000. Ricorda nei minimi dettagli
        ogni evento accaduto nel mondo.
    sun:
      ja-Hrkt: |-
        ちのうしすうは　およそ　５０００。
        つよい　ねんりきが　あふれだしており
        そばに　いるだけで　ずつうが　する。
      ja: |-
        知能指数は　およそ　５０００。
        強い　念力が　あふれだしており
        そばに　いるだけで　頭痛が　する。
      ko: |-
        지능지수는 약 5000.
        강한 염동력이 넘쳐흘러서
        곁에 있는 것만으로 두통이 생긴다.
      zh-Hant: |-
        智商大約有５０００。
        滿溢著強大的念力，
        光是在牠身旁就會頭痛不已。
      zh-Hans: |-
        智商大约有５０００。
        强大的念力满溢出来，
        光是呆在旁边就会头痛不已。
      en: |-
        It is said to have an IQ of approximately 5,000.
        Its overflowing psychokinetic powers
        cause headaches to anyone nearby.
      fr: |-
        Son Q.I. atteindrait les 5 000. Il émet des ondes
        psychiques si fortes qu’il suffit de se tenir
        près de lui pour avoir mal à la tête.
      de: |-
        Es hat einen IQ von 5 000. Seine Psycho-Kräfte
        sind so stark ausgeprägt, dass man Kopfweh
        bekommt, wenn man nur neben ihm steht.
      es: |-
        Su coeficiente intelectual ronda los 5000. Los
        poderes telequinéticos que rezuma causan
        jaquecas a cualquiera que se acerque.
      it: |-
        Ha un quoziente intellettivo di circa 5.000. I suoi
        poteri psicocinetici sono talmente intensi da
        far venire mal di testa a chi gli sta vicino.
    moon:
      ja-Hrkt: |-
        その　のうさいぼうは　しぬまで
        ふえつづける。　おいた　フーディンほど
        おおきな　あたまを　しているのだ。
      ja: |-
        その　脳細胞は　死ぬまで
        増え続ける。　老いた　フーディンほど
        大きな　頭を　しているのだ。
      ko: |-
        그 뇌세포는 죽을 때까지
        계속 늘어난다.
        늙은 후딘일수록 머리가 크다.
      zh-Hant: |-
        腦細胞到死前都會不斷地增加。
        越年老的胡地頭部就越巨大。
      zh-Hans: |-
        脑细胞会终生不断增长。
        越是年老的胡地
        越是会有巨大的脑袋。
      en: |-
        Its brain cells continue to increase in number
        until its death. The older the Alakazam, the
        larger its head.
      fr: |-
        Ses neurones se développent jusqu’à sa mort.
        Plus un Alakazam est vieux, plus sa tête
        est grosse.
      de: |-
        Seine Gehirnzellen vervielfachen sich sein
        ganzes Leben lang. Je älter ein Simsala ist,
        desto größer ist demzufolge auch sein Kopf.
      es: |-
        Las neuronas de su cerebro se multiplican sin
        descanso hasta el día de su muerte. Cuanto más
        viejo es Alakazam, más grande es su cabeza.
      it: |-
        Le sue cellule cerebrali continuano a
        moltiplicarsi per tutta la vita e man mano che
        cresce la sua testa diventa sempre più grossa.
    ultra-sun:
      ja-Hrkt: |-
        もっている　スプーンは　フーディンが
        ちょうのうりょくで　うみだしたもの。
        せかいに　１ぽんだけの　オリジナル。
      ja: |-
        持っている　スプーンは　フーディンが
        超能力で　生み出したもの。
        世界に　１本だけの　オリジナル。
      ko: |-
        지니고 있는 숟가락은 후딘이
        초능력으로 만들어 낸 것이다.
        이 세상에 1개뿐인 오리지널이다.
      zh-Hant: |-
        手中的湯匙是胡地
        用超能力製造出來的，
        是全世界獨一無二的作品。
      zh-Hans: |-
        手中的汤匙是胡地用超能力生成的。
        每把汤匙都是这世上独一无二的。
      en: |-
        Alakazam uses its psychic powers to make the
        spoons it carries. Each spoon is an original that
        there’s only one of in the whole world.
      fr: |-
        Il a lui-même créé ses cuillers avec sa propre
        force psychique. Chaque exemplaire est unique
        au monde.
      de: |-
        Die beiden Löffel hat es mithilfe seiner Psycho-
        Kräfte selbst erschaffen. Jeder von ihnen ist
        weltweit einzigartig.
      es: |-
        Las cucharas que lleva las creó él mismo con
        sus poderes psíquicos. Son únicas en el mundo
        entero.
      it: |-
        I cucchiai che ha con sé sono stati creati grazie
        ai suoi poteri psichici e sono esemplari unici
        al mondo.
    ultra-moon:
      ja-Hrkt: |-
        こころから　しんらいした　あいてには
        スプーンを　ゆずる。　このスプーンで
        たべると　なんでも　おいしいらしい。
      ja: |-
        心から　信頼した　相手には
        スプーンを　譲る。　このスプーンで
        食べると　なんでも　美味しいらしい。
      ko: |-
        진심으로 신뢰하는 상대에게는
        숟가락을 양보한다. 이 숟가락으로
        먹으면 무엇이든 맛있다고 한다.
      zh-Hant: |-
        會把湯匙交給自己打從心裡
        信任的對象。如果用這種湯匙吃東西，
        不管是什麼吃起來似乎都會很美味。
      zh-Hans: |-
        会把汤匙交给自己信任的对象。
        如果用这把汤匙吃东西的话，
        不管吃什么好像都会觉得很美味。
      en: |-
        If it trusts someone deeply, it will let them have
        one of its spoons. Anything you eat with that
        spoon is apparently delicious.
      fr: |-
        S’il a pleinement confiance en quelqu’un, il lui
        offre une cuiller en gage d’amitié. Tout ce que
        l’on mange avec cette cuiller a un goût délicieux.
      de: |-
        Wenn es volles Vertrauen in jemanden hat,
        überlässt es ihm einen Löffel. Mit diesem wird
        angeblich alles zu einer Köstlichkeit.
      es: |-
        Quien se granjea su favor recibe como presente
        una cuchara. Al parecer, todo cuanto se coma
        con ella tendrá un sabor exquisito.
      it: |-
        Chi si guadagna la sua piena fiducia ottiene in
        regalo uno dei suoi cucchiai. Se usato per
        mangiare, dà un sapore delizioso a tutti i cibi.
    lets-go-pikachu:
      ja-Hrkt: |-
        なんでも　おぼえることができる。
        たいけんした　あらゆることを
        わすれないので　あたまがいいのだ。
      ja: |-
        なんでも　覚えることができる。
        体験した　あらゆることを
        忘れないので　頭がいいのだ。
      ko: |-
        무엇이든 기억해 낸다.
        체험한 모든 것을
        잊지 않기에 머리가 좋은 것이다.
      zh-Hant: |-
        能夠記下一切的事物。
        頭腦很聰明，不會忘記
        自己經驗過的任何一件事。
      zh-Hans: |-
        什么事情都能记住。只要是
        曾经体验过的事情就绝对
        不会忘记，头脑非常聪明。
      en: |-
        A Pokémon that can memorize anything.
        It never forgets what it learns—that’s why
        this Pokémon is smart.
      fr: |-
        Ce Pokémon est très intelligent. Sa mémoire
        infaillible lui permet de retenir tout ce qu’il
        apprend.
      de: |-
        Es hat ein perfektes Gedächtnis und vergisst
        nichts. Das macht es zu einem sehr schlauen
        Pokémon.
      es: |-
        Este Pokémon lo recuerda todo y nunca olvida
        lo que aprende, de ahí que sea tan inteligente.
      it: |-
        Questo Pokémon intelligentissimo ha una
        memoria prodigiosa e non dimentica mai
        ciò che impara.
    lets-go-eevee:
      ja-Hrkt: |-
        なんでも　おぼえることができる。
        たいけんした　あらゆることを
        わすれないので　あたまがいいのだ。
      ja: |-
        なんでも　覚えることができる。
        体験した　あらゆることを
        忘れないので　頭がいいのだ。
      ko: |-
        무엇이든 기억해 낸다.
        체험한 모든 것을
        잊지 않기에 머리가 좋은 것이다.
      zh-Hant: |-
        能夠記下一切的事物。
        頭腦很聰明，不會忘記
        自己經驗過的任何一件事。
      zh-Hans: |-
        什么事情都能记住。只要是
        曾经体验过的事情就绝对
        不会忘记，头脑非常聪明。
      en: |-
        A Pokémon that can memorize anything.
        It never forgets what it learns—that’s why
        this Pokémon is smart.
      fr: |-
        Ce Pokémon est très intelligent. Sa mémoire
        infaillible lui permet de retenir tout ce qu’il
        apprend.
      de: |-
        Es hat ein perfektes Gedächtnis und vergisst
        nichts. Das macht es zu einem sehr schlauen
        Pokémon.
      es: |-
        Este Pokémon lo recuerda todo y nunca olvida
        lo que aprende, de ahí que sea tan inteligente.
      it: |-
        Questo Pokémon intelligentissimo ha una
        memoria prodigiosa e non dimentica mai
        ciò che impara.
    sword:
      ja-Hrkt: |-
        ひじょうに　たかい　ちのうを　もつ。
        うまれてから　しぬまでの　できごとを
        すべて　おぼえている　という。
      ja: |-
        非常に　高い　知能を　持つ。
        生まれてから　死ぬまでの　できごとを
        すべて　覚えている　という。
      ko: |-
        매우 높은 지능을 지녔다.
        태어나서 죽을 때까지 일어나는 일을
        모두 기억한다고 한다.
      zh-Hant: |-
        擁有非常高的智商。
        據說牠能記住從出生到死
        一輩子發生過的所有事情。
      zh-Hans: |-
        拥有非常高的智力。
        据说它记得从生到死
        发生过的所有事情。
      en: |-
        It has an incredibly high level of intelligence.
        Some say that Alakazam remembers everything
        that ever happens to it, from birth till death.
      fr: |-
        Doué d’une intelligence hors du commun,
        ce Pokémon serait capable de conserver tous
        ses souvenirs, de sa naissance jusqu’à sa mort.
      de: |-
        Es verfügt über extrem hohe Intelligenz und soll
        sich an alles erinnern können, was zwischen seiner
        Geburt und seinem Tod passiert.
      es: |-
        Posee una capacidad intelectual fuera de lo
        común que le permite recordar todo lo sucedido
        desde el instante de su nacimiento.
      it: |-
        Possiede un intelletto estremamente elevato
        e si dice sia in grado di ricordare ogni evento
        della sua vita, dalla nascita alla morte.
    shield:
      ja-Hrkt: |-
        きょうりょくな　ちょうのうりょくを
        あやつる。　りょうての　スプーンは
        その　ちからで　つくりだしたという。
      ja: |-
        強力な　超能力を　操る。
        両手の　スプーンは
        その　力で　作りだしたという。
      ko: |-
        강력한 초능력을 구사한다.
        양손에 든 숟가락은 그 힘으로
        만들어낸 것이라고 한다.
      zh-Hant: |-
        能操控強大的超能力。
        雙手中的湯匙據說就是
        用牠的力量創造出來的。
      zh-Hans: |-
        会操纵强大的超能力。
        据说它双手握着的汤勺
        就是用那力量制造出来的。
      en: |-
        Alakazam wields potent psychic powers. It’s said
        that this Pokémon used these powers to create
        the spoons it holds.
      fr: |-
        Il dispose d’immenses pouvoirs psychiques.
        On raconte qu’il s’en est servi afin de créer
        les cuillères qu’il tient dans chaque main.
      de: |-
        Simsala verfügt über extrem starke Psycho-Kräfte.
        Mit ihnen soll es die Löffel erschaffen haben,
        die es in seinen Händen hält.
      es: |-
        Posee unos poderes psíquicos extraordinarios
        con los que, según se dice, creó las cucharas
        que lleva en las manos.
      it: |-
        Padroneggia potenti poteri psichici, con i quali
        si dice abbia creato i cucchiai che tiene in mano.
  form_description: {  }
  forms_switchable: true
  gender_rate: '2'
  generation: generation-i
