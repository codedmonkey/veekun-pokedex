    white-2:
      en: |-
        It gains the ability to see the aura
        of its opponents by honing its mind
        through starvation.
    x:
      ja-Hrkt: |-
        ダンスの　ような　ゆうがな　うごきで
        こうげきを　かわして　きょうれつな
        いちげきを　あいてに　おみまいする。
      ja: |-
        ダンスの　ような　優雅な　動きで
        攻撃を　交わして　強烈な　一撃を
        相手に　お見舞いする。
      ko: |-
        춤추는 듯한 우아한 움직임으로
        공격을 피하며 상대에게
        강력한 일격을 선사한다.
      en: |-
        It elegantly avoids attacks with dance-like steps,
        then launches a devastating blow in the
        same motion.
      fr: |-
        Charmina évite les attaques en exécutant d’élégants
        pas de danse avant de lancer une attaque dévastatrice
        dans son élan.
      de: |-
        Es weicht Attacken elegant tänzerisch aus,
        um anschließend eine verheerende Attacke aus
        derselben Bewegung heraus zu lancieren.
      es: |-
        Evita los ataques moviéndose de forma elegante,
        como si bailara. Ataca dando un golpe devastador y
        moviéndose igual.
      it: |-
        Evita elegantemente gli attacchi a passo di danza, per
        poi lanciare devastanti attacchi con la stessa grazia.
    'y':
      ja-Hrkt: |-
        ヨガの　しゅぎょうで　きたえられた
        サイコパワーで　あいての　うごきを
        よそくする　ことが　できるのだ。
      ja: |-
        ヨガの　修行で　鍛えられた
        サイコパワーで　相手の　動きを
        予測する　ことが　できるのだ。
      ko: |-
        요가 수행으로 단련된
        사이코 파워로 상대의 움직임을
        예상할 수 있다.
      en: |-
        Through yoga training, it gained the psychic power
        to predict its foe’s next move.
      fr: |-
        Ses pouvoirs psy, renforcés par la pratique du yoga,
        lui permettent de prédire les mouvements ennemis.
      de: |-
        Mit Yoga-Training hat es seine Psycho-Kräfte geschärft
        und ahnt so die Attacken seiner Gegner voraus.
      es: |-
        Puede prever los movimientos de su rival usando sus
        poderes psíquicos, fortalecidos por el yoga.
      it: |-
        Conosce le mosse del nemico grazie ai poteri di
        preveggenza ottenuti con le pratiche yoga.
    omega-ruby:
      ja-Hrkt: |-
        めいそうする　ことで　からだの　エネルギーが
        たかまり　だい６かんが　するどくなる　という。
        のやまと　いったいになって　けはいを　けす。
      ja: |-
        めいそうする　ことで　体の　エネルギーが
        高まり　第６感が　鋭くなる　という。
        野山と　一体になって　気配を　消す。
      ko: |-
        명상을 하면 몸의 에너지가 높아지고
        여섯 번째 감각이 예리해진다고 한다.
        산야와 일체화되어 기척을 지운다.
      en: |-
        It is said that through meditation, Medicham heightens energy
        inside its body and sharpens its sixth sense. This Pokémon
        hides its presence by merging itself with fields and mountains.
      fr: |-
        On dit que grâce à la méditation, Charmina stocke
        de l’énergie dans son corps et affine son sixième sens.
        Ce Pokémon se cache des autres en se fondant dans
        les champs et les montagnes.
      de: |-
        Mittels Meditation erhöht Meditalis seine Körperenergie und
        schärft seinen sechsten Sinn. Dieses Pokémon verbirgt sich,
        indem es eins mit den Feldern und Bergen wird.
      es: |-
        Dicen que, a través de la meditación, Medicham aumenta su
        energía interior y agudiza su sexto sentido. Este Pokémon
        suele pasar desapercibido mimetizándose con el campo y las
        montañas.
      it: |-
        Si dice che, grazie alla meditazione, Medicham incrementi
        la propria energia fisica e affini il sesto senso. Si nasconde
        efficacemente mimetizzandosi nei campi e in montagna.
    alpha-sapphire:
      ja-Hrkt: |-
        ヨガの　ちからで　だい６かんが　はったつして
        サイコパワーを　あやつれる　ように　なった。
        １かげつかん　なにも　たべずに　めいそうする。
      ja: |-
        ヨガの　力で　第６感が　発達して
        サイコパワーを　操れる　ように　なった。
        １ヶ月間　なにも　食べずに　めいそうする。
      ko: |-
        요가의 힘으로 제6의 감각이 발달하여
        사이코 파워를 다룰 수 있게 되었다.
        1개월간 아무것도 먹지 않고 명상한다.
      en: |-
        Through the power of meditation, Medicham developed its
        sixth sense. It gained the ability to use psychokinetic powers.
        This Pokémon is known to meditate for a whole month
        without eating.
      fr: |-
        Grâce au pouvoir de la méditation, Charmina a développé
        son sixième sens. Il peut utiliser des pouvoirs télékinétiques.
        On sait que ce Pokémon peut méditer pendant un mois sans
        manger.
      de: |-
        Mittels Meditation hat Meditalis seinen sechsten Sinn
        entwickelt. So kann es seine psychokinetischen Kräfte
        nutzen. Dieses Pokémon meditiert einen ganzen Monat,
        ohne etwas zu essen.
      es: |-
        A través de la meditación, Medicham desarrolló su sexto
        sentido y aprendió a usar poderes psicoquinéticos. Se sabe
        que este Pokémon puede pasarse un mes meditando y sin
        comer.
      it: |-
        Grazie alla propria abilità meditativa Medicham ha sviluppato
        il sesto senso. Ha acquisito anche la capacità di usare i poteri
        psicocinetici. È noto per rimanere fermo in meditazione
        un mese intero senza mangiare.
