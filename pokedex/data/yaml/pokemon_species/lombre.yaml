    white-2:
      en: |-
        It has a mischievous spirit. If it
        spots an angler, it will tug on the
        fishing line to interfere.
    x:
      ja-Hrkt: |-
        ひあたりの　よい　みずべに　すむ。
        ひるまは　みずくさの　ベッドで
        ねむり　ひが　くれると　うごきだす。
      ja: |-
        日当たりの　良い　水辺に　住む。
        昼間は　水草の　ベッドで　眠り
        日が　暮れると　動き出す。
      ko: |-
        햇볕이 잘 드는 물가에 산다.
        낮에는 수초로 된 침대에서
        자고 해가 지면 활동하기 시작한다.
      en: |-
        It lives at the water’s edge where it is sunny.
        It sleeps on a bed of water-grass by day and
        becomes active at night.
      fr: |-
        Il vit au bord de l’eau dans les endroits ensoleillés.
        Le jour, il s’endort sur un tas d’algues et ne se lève
        qu’à la nuit tombée.
      de: |-
        Es lebt am Ufer, wo die Sonne scheint.
        Tagsüber schläft es in einem Bett aus Schilf
        und wird nachts aktiv.
      es: |-
        Vive en el agua y, cuando hace sol, se queda en la
        orilla. De día duerme sobre las algas y de noche entra
        en acción.
      it: |-
        Vive in riva a specchi d’acqua, in aree soleggiate.
        Di giorno dorme su di un letto di alghe, mentre la
        notte è attivo.
    'y':
      ja-Hrkt: |-
        つりびとを　みつけると
        すいちゅうから　つりいとを　ひっぱり
        ジャマして　よろこぶ　いたずらもの。
      ja: |-
        釣り人を　見つけると
        水中から　釣り糸を　引っ張り
        ジャマして　喜ぶ　いたずらもの。
      ko: |-
        낚시꾼을 발견하면
        물속에서 낚싯줄을 잡아당겨
        방해하며 좋아하는 장난꾸러기다.
      en: |-
        It has a mischievous spirit. If it spots an angler,
        it will tug on the fishing line to interfere.
      fr: |-
        C’est un mauvais plaisantin. Quand il repère un
        pêcheur, il tire sur sa ligne pour le déranger.
      de: |-
        Es hat ein spitzbübisches Wesen. Sieht es einen
        Angler, zieht es an der Angelschnur, um ihn zu ärgern.
      es: |-
        Tiene carácter travieso. Si ve un pescador, tira del
        anzuelo para confundirlo.
      it: |-
        È un po’ dispettoso. Se vede un pescatore, gli tira
        la lenza solo per dargli fastidio.
    omega-ruby:
      ja-Hrkt: |-
        ゆうぐれになると　かつどうする　やこうせい。
        つりびとを　みかけると　すいちゅうから　いとを
        ひっぱり　ジャマをしては　よろこんでいる。
      ja: |-
        夕暮れになると　活動する　夜行性。
        釣り人を　見かけると　水中から　糸を
        引っ張り　ジャマをしては　喜んでいる。
      ko: |-
        해 질 무렵이 되면 활동하는 야행성이다.
        낚시꾼을 발견하면 물속에서 줄을
        당겨 방해하고선 기뻐한다.
      en: |-
        Lombre is nocturnal—it will get active after dusk.
        It is also a mischief maker. When this Pokémon
        spots anglers, it tugs on their fishing lines from
        beneath the surface and enjoys their consternation.
      fr: |-
        Lombre est nocturne, il commence ses activités malicieuses
        et sournoises au crépuscule. Lorsque ce Pokémon repère
        des pêcheurs, il s’approche de leur ligne, tire dessus
        et se moque de leur regard perplexe.
      de: |-
        Lombrero liebt die Nacht und wird bei Einbruch der Dunkelheit
        aktiv. Es spielt auch gerne Streiche. Wenn es Angler sieht,
        zieht es unter Wasser an ihren Angelschnüren und erfreut sich
        an ihrer Entrüstung.
      es: |-
        Lombre es, además de travieso, nocturno; entra en acción de
        noche. Cuando ve a gente pescando, se pone a tirar del sedal
        por debajo del agua y se divierte viendo la cara de enfado que
        se les queda.
      it: |-
        Lombre è un Pokémon notturno, che si sveglia dopo
        il crepuscolo. È anche molto dispettoso: quando scopre
        un pescatore, inizia a tirare l’amo sott’acqua e si diverte
        a spiare la costernazione del malcapitato.
    alpha-sapphire:
      ja-Hrkt: |-
        からだじゅう　ヌルヌルした　ねんえきで　おおわれ
        その　てで　さわられると　とても　きもちわるい。
        にんげんの　こどもと　よく　まちがえられる。
      ja: |-
        体中　ヌルヌルした　粘液で　覆われ
        その　手で　触られると　とても　気持ち悪い。
        人間の　子どもと　よく　間違えられる。
      ko: |-
        몸 전체가 미끈미끈한 점액으로 덮여 있어서
        그 손에 닿으면 매우 기분 나쁘다.
        곧잘 인간의 아이로 오인된다.
      en: |-
        Lombre’s entire body is covered by a slippery, slimy film.
        It feels horribly unpleasant to be touched by this Pokémon’s
        hands. Lombre is often mistaken for a human child.
      fr: |-
        Le corps de Lombre tout entier est recouvert d’un voile
        visqueux et glissant. Toucher ce Pokémon est extrêmement
        déplaisant. On croit souvent à tort que Lombre est un enfant.
      de: |-
        Lombreros Körper ist mit einem glitschigen Film bedeckt.
        Es fühlt sich widerlich an, wenn einen dieses Pokémon mit
        seinen Händen berührt. Lombrero wird häufig für ein Kind
        gehalten.
      es: |-
        Lombre está completamente recubierto por una película
        viscosa y resbaladiza. La sensación que produce cuando
        roza a alguien con las manos es muy desagradable. A veces
        se confunde a este Pokémon con un niño pequeño.
      it: |-
        L’intero corpo di Lombre è ricoperto di una pellicola viscida
        e scivolosa. Il contatto con le sue zampe dà una sensazione
        orribile. Spesso Lombre è confuso con un bambino piccolo.
    sword:
      ja-Hrkt: |-
        ゆうぐれどきに　なると　かつどうを
        はじめる　やこうせいの　ポケモン。
        かわぞこの　みずごけを　たべる。
      ja: |-
        夕暮れどきに　なると　活動を
        はじめる　夜行性の　ポケモン。
        川底の　水苔を　食べる。
      ko: |-
        해질녘이 되면 활동을
        시작하는 야행성 포켓몬이다.
        강바닥의 이끼를 먹는다.
      zh-Hant: |-
        傍晚時開始活動的
        夜行性寶可夢。
        喜歡吃河底的水苔。
      zh-Hans: |-
        傍晚时开始活动的
        夜行性宝可梦。
        喜欢吃河底的水苔。
      en: |-
        It is nocturnal and becomes active at nightfall.
        It feeds on aquatic mosses that grow
        in the riverbed.
      fr: |-
        Ce Pokémon nocturne s’active au crépuscule.
        Il se nourrit d’algues qui poussent au fond
        des rivières.
      de: |-
        Lombrero wird erst in der Abenddämmerung
        aktiv. Es ernährt sich von Moos, das am Boden
        von Flüssen gedeiht.
      es: |-
        Este Pokémon nocturno entra en acción al caer
        la tarde. Se alimenta del musgo que crece en el
        lecho de los ríos.
      it: |-
        È un Pokémon notturno, che si sveglia dopo
        il crepuscolo. Si nutre di sfagno, che trova nei
        letti dei fiumi.
    shield:
      ja-Hrkt: |-
        ひあたりの　よい　みずべに　すむ。
        ひるまは　みずくさの　ベッドで
        ねむり　ひが　くれると　うごきだす。
      ja: |-
        日当たりの　良い　水辺に　棲む。
        昼間は　水草の　ベッドで　眠り
        日が　暮れると　動き出す。
      ko: |-
        햇볕이 잘 드는 물가에 산다.
        낮에는 수초로 된 침대에서 자고
        해가 지면 활동하기 시작한다.
      zh-Hant: |-
        住在日照充足的水邊。
        白天在水草做的床上睡覺，
        太陽下山後就會出來活動。
      zh-Hans: |-
        住在日照良好的水边。
        白天在水草做的床上睡觉，
        太阳下山后就会出来活动。
      en: |-
        It lives at the water’s edge where it is sunny.
        It sleeps on a bed of water grass by day and
        becomes active at night.
      fr: |-
        Il vit au bord de l’eau dans les endroits
        ensoleillés. Il s’endort sur un tas d’algues
        dans la journée et ne se lève qu’à la nuit tombée.
      de: |-
        Es lebt am Ufer, wo die Sonne scheint. Tagsüber
        schläft es in einem Bett aus Wasserpflanzen,
        nachts wird es dann aktiv.
      es: |-
        Vive en las riberas bañadas por el sol. De día
        duerme sobre un lecho de plantas acuáticas y de
        noche entra en acción.
      it: |-
        Vive in riva a specchi d’acqua, in aree soleggiate.
        Di giorno dorme su di un letto di piante
        acquatiche, mentre la notte è attivo.
