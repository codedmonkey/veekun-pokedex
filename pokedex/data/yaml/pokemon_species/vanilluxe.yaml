vanilluxe:
  base_happiness: 50
  capture_rate: 45
  color: white
  egg_groups:
    - mineral
  evolution_chain: vanillite
  evolves_from: vanillish
  flavor_text:
    black:
      en: |-
        Swallowing large amounts of water, they
        make snow clouds inside their bodies and
        attack their foes with violent blizzards.
      fr: |-
        Il avale de l’eau en grande quantité
        et la transforme en nuages neigeux.
        Il souffle du blizzard sur ses ennemis.
    white:
      en: |-
        If both heads get angry simultaneously,
        this Pokémon expels a blizzard, burying
        everything in snow.
      fr: |-
        Quand ses deux têtes se fâchent en même
        temps, il émet un blizzard de ses cornes
        et enfouit les alentours sous la neige.
    black-2:
      en: |-
        Swallowing large amounts of water, they
        make snow clouds inside their bodies and,
        when angry, cause violent blizzards.
    white-2:
      en: |-
        Swallowing large amounts of water, they
        make snow clouds inside their bodies and,
        when angry, cause violent blizzards.
    x:
      ja-Hrkt: |-
        ２つの　あたまが　どうじに　おこると
        ツノから　もうふぶきを　ふきだす。
        あたりを　おおゆきで　うめてしまう。
      ja: |-
        ２つの　頭が　同時に　怒ると
        ツノから　猛吹雪を　噴き出す。
        あたりを　大雪で　埋めてしまう。
      ko: |-
        두 개의 머리가 동시에 화를 내면
        뿔에서 강한 눈보라가 뿜어져 나온다.
        주변을 많은 눈으로 묻어 버린다.
      en: |-
        If both heads get angry simultaneously, this
        Pokémon expels a blizzard, burying everything
        in snow.
      fr: |-
        Quand ses deux têtes se fâchent en même temps,
        il émet un blizzard de ses cornes et enfouit les
        alentours sous la neige.
      de: |-
        Bringt man beide Köpfe in Rage, stößt sein Horn
        heftige Eisböen aus, und alles in seiner Umgebung
        versinkt in Schnee.
      es: |-
        Si sus dos cabezas se irritan al mismo tiempo, genera
        una ventisca desde su cuerno cubriendo su entorno
        con nieve.
      it: |-
        Se le due teste si arrabbiano allo stesso tempo,
        scatena una bufera dalle corna, coprendo di neve
        i dintorni.
    'y':
      ja-Hrkt: |-
        たいりょうの　みずを　のみこんで
        からだのなかで　ゆきぐもに　かえる。
        おこると　もうふぶきを　まきおこす。
      ja: |-
        大量の　水を　飲みこんで
        体の中で　雪雲に　変える。
        怒ると　猛吹雪を　まきおこす。
      ko: |-
        대량의 물을 들이마셔
        몸 안에서 눈구름으로 바꾼다.
        화나면 강한 눈보라를 일으킨다.
      en: |-
        Swallowing large amounts of water, they make
        snow clouds inside their bodies and, when angry,
        cause violent blizzards.
      fr: |-
        Il avale de grandes quantités d’eau et la transforme
        en nuages de neige. Il souffle du blizzard quand il se
        fâche.
      de: |-
        Es verschluckt Unmengen an Wasser und wandelt es
        intern in Schneewolken um. Ist es wütend, erzeugt es
        Schneestürme.
      es: |-
        Absorben grandes cantidades de agua y la
        transforman en ventisca en su cuerpo, expulsándola
        cuando se enojan.
      it: |-
        Ingoia enormi quantità d’acqua che trasforma in
        nuvole di neve. Quando si arrabbia scatena una
        terribile bufera.
    omega-ruby:
      ja-Hrkt: |-
        ２つの　あたまが　どうじに　おこると
        ツノから　もうふぶきを　ふきだす。
        あたりを　おおゆきで　うめてしまう。
      ja: |-
        ２つの　頭が　同時に　怒ると
        ツノから　猛吹雪を　噴き出す。
        あたりを　大雪で　埋めてしまう。
      ko: |-
        두 개의 머리가 동시에 화를 내면
        뿔에서 강한 눈보라가 뿜어져 나온다.
        주변을 많은 눈으로 묻어 버린다.
      en: |-
        If both heads get angry simultaneously, this
        Pokémon expels a blizzard, burying everything
        in snow.
      fr: |-
        Quand ses deux têtes se fâchent en même temps,
        il émet un blizzard de ses cornes et enfouit les alentours
        sous la neige.
      de: |-
        Bringt man beide Köpfe in Rage, stößt sein Horn heftige
        Eisböen aus, und alles in seiner Umgebung versinkt in Schnee.
      es: |-
        Si sus dos cabezas se irritan al mismo tiempo, genera una
        ventisca desde su cuerno cubriendo su entorno con nieve.
      it: |-
        Se le due teste si arrabbiano allo stesso tempo, scatena
        una bufera dalle corna, coprendo di neve i dintorni.
    alpha-sapphire:
      ja-Hrkt: |-
        たいりょうの　みずを　のみこんで
        からだのなかで　ゆきぐもに　かえる。
        おこると　もうふぶきを　まきおこす。
      ja: |-
        大量の　水を　飲みこんで
        体の中で　雪雲に　変える。
        怒ると　猛吹雪を　まきおこす。
      ko: |-
        대량의 물을 들이마셔
        몸 안에서 눈구름으로 바꾼다.
        화나면 강한 눈보라를 일으킨다.
      en: |-
        Swallowing large amounts of water, they make
        snow clouds inside their bodies and, when angry,
        cause violent blizzards.
      fr: |-
        Il avale de grandes quantités d’eau et la transforme en nuages
        de neige. Il souffle du blizzard quand il se fâche.
      de: |-
        Es verschluckt Unmengen an Wasser und wandelt es intern in
        Schneewolken um. Ist es wütend, erzeugt es Schneestürme.
      es: |-
        Absorben grandes cantidades de agua y la transforman en
        ventisca en su cuerpo, expulsándola cuando se enojan.
      it: |-
        Ingoia enormi quantità d’acqua che trasforma in nuvole
        di neve. Quando si arrabbia scatena una terribile bufera.
    sun:
      ja-Hrkt: |-
        ２つのあたま　それぞれに　のうがあり
        りょうしゃの　いけんが　いっちすると
        もうふぶきを　はいて　てきを　おそう。
      ja: |-
        ２つの頭　それぞれに　脳があり
        両者の　意見が　一致すると
        猛吹雪を　吐いて　敵を　襲う。
      ko: |-
        두 개의 머리 각각에 뇌가 있고
        각자의 의견이 일치하면
        강한 눈보라를 뿜어 적을 덮친다.
      zh-Hant: |-
        ２個頭擁有各自的大腦，
        如果兩者意見一致，
        就會噴出猛烈的暴風雪襲擊敵人。
      zh-Hans: |-
        ２个头拥有各自的大脑，
        如果两者意见一致，
        就会喷出猛烈的暴风雪袭击敌人。
      en: |-
        Each of its two heads has a brain, and when
        they are in agreement, it attacks its enemies
        by exhaling a violent blizzard.
      fr: |-
        Chacune de ses deux têtes possède un cerveau
        distinct. Elles doivent s’entendre pour que
        Sorbouboul souffle son blizzard sur l’ennemi.
      de: |-
        Seine zwei Köpfe haben je ein eigenes Gehirn.
        Sind sich beide einig, greifen sie den Gegner an,
        indem sie heftige Eisböen ausstoßen.
      es: |-
        Las dos cabezas tienen su propio cerebro.
        Cuando se ponen de acuerdo, generan una
        ventisca con la que atacan a su enemigo.
      it: |-
        Ha un cervello in ognuna delle due teste.
        Quando queste riescono a mettersi d’accordo,
        attacca il nemico scatenando una bufera.
    moon:
      ja-Hrkt: |-
        かたほうの　あたまを　うしなっても
        とくに　もんだいなく　いきられる。
        からだの　なかに　ゆきぐもを　つくる。
      ja: |-
        片方の　頭を　失っても
        特に　問題なく　生きられる。
        身体の　中に　雪雲を　つくる。
      ko: |-
        한쪽 머리를 잃어도
        특별히 문제없이 살 수 있다.
        몸속에서 눈구름을 만든다.
      zh-Hant: |-
        即使失去其中一邊的頭
        也可以毫無問題地繼續存活。
        會在身體的內部製造雪雲。
      zh-Hans: |-
        即使失去了一侧的头也不会
        有什么问题，能继续活着。
        在身体的内部制造雪云。
      en: |-
        Even if it loses one of its heads, it can live
        relatively problem-free. It makes snow clouds
        inside its body.
      fr: |-
        Il peut perdre l’une de ses têtes et continuer à
        vivre sa vie sans souci. Des flocons de neige
        sont fabriqués en permanence dans son corps.
      de: |-
        Selbst wenn es einen seiner Köpfe verliert,
        kann es ohne besondere Probleme weiterleben.
        In seinem Inneren erzeugt es Schneewolken.
      es: |-
        Pueden sobrevivir sin grandes problemas aun
        perdiendo una de las cabezas. Crean ventiscas
        en el interior de su cuerpo.
      it: |-
        Sopravvive senza problemi anche se perde una
        delle due teste. All’interno del corpo genera
        nuvole di neve.
    ultra-sun:
      ja-Hrkt: |-
        ２つの　くちから　ふぶきを　はく。
        どこでも　ゆきを　つくりだせるので
        スキーヤーや　ボーダーに　にんき。
      ja: |-
        ２つの　口から　吹雪を　吐く。
        どこでも　雪を　作りだせるので
        スキーヤーや　ボーダーに　人気。
      ko: |-
        2개의 입에서 눈보라를 뿜어낸다.
        어디에서든 눈을 만들어 내기 때문에
        스키어나 스노보더에게 인기다.
      zh-Hant: |-
        會從２張嘴裡噴出暴風雪。
        由於不管在哪裡都能造雪，
        所以很受雪上運動家的歡迎。
      zh-Hans: |-
        从２张嘴里喷出暴风雪。
        无论在哪里都能制作出雪来，
        所以很受滑雪和滑雪板爱好者欢迎。
      en: |-
        It blasts blizzards from its two mouths. It can
        create snow anywhere, so it gets a lot of love
        from skiers and snowboarders.
      fr: |-
        Ses deux bouches peuvent souffler du blizzard.
        Sa capacité à créer de la neige à volonté le rend
        populaire auprès des skieurs et snowboarders.
      de: |-
        Aus seinen zwei Mündern stößt es Eisböen aus.
        Da es praktisch überall Schnee erzeugen kann,
        ist es bei Snowboardern und Skifahrern beliebt.
      es: |-
        Expulsa ventiscas por ambas bocas y, como
        puede crear nieve en cualquier lugar, es famoso
        entre quienes practican esquí o snowboard.
      it: |-
        Produce tempeste di neve dalle due bocche.
        È amato da Sciatori e Snowboarder perché
        può creare la neve ovunque.
    ultra-moon:
      ja-Hrkt: |-
        あさひで　とけかけた　２ひきの
        バニリッチが　くっつき　さむいばんに
        ふたたび　こおったとき　うまれる。
      ja: |-
        朝日で　溶けかけた　２匹の
        バニリッチが　くっつき　寒い晩に
        再び　凍ったとき　生まれる。
      ko: |-
        아침 해에 녹아내리던 2마리의
        바닐리치가 붙어서 추운 밤에
        다시 얼어붙으면 태어난다.
      zh-Hant: |-
        因朝陽而開始融化的２隻
        多多冰貼在一起，在寒冷的夜裡
        再次凍結後，成為雙倍多多冰。
      zh-Hans: |-
        因朝阳而开始融化的
        ２只多多冰贴在一起，
        在寒冷的夜里再次冻结时诞生而成。
      en: |-
        Vanilluxe is born when two Vanillish, half-melted
        by the day’s light, stick to each other and
        freeze together in the cold return of night.
      fr: |-
        Sorbouboul est né lorsque deux Sorboul, à moitié
        fondus par le soleil, se sont collés l’un à l’autre
        et ont été soudés par la gelée nocturne.
      de: |-
        Es entsteht, wenn zwei Gelatroppo im Licht
        der Morgensonne miteinander verschmelzen
        und dann in einer kalten Nacht wieder gefrieren.
      es: |-
        Su nacimiento se produce cuando dos Vanillish
        se derriten por la mañana, se mezclan y, durante
        la gélida noche, se congelan juntos.
      it: |-
        È nato da due Vanillish parzialmente squagliatisi
        al sole, che in una fredda notte si sono uniti
        e ricongelati.
    sword:
      ja-Hrkt: |-
        いかりが　ちょうてんに　たっすると
        ふぶきを　ふきだして　てきも
        みかたも　こおりづけに　する。
      ja: |-
        怒りが　頂点に　達すると
        吹雪を　噴き出して　敵も
        味方も　氷漬けに　する。
      ko: |-
        분노가 정점에 달하면
        눈보라를 불게 하여 적도
        아군도 꽁꽁 얼려버린다.
      zh-Hant: |-
        當憤怒達到極限時，
        就會噴出暴風雪，
        把敵人和夥伴都凍成冰塊。
      zh-Hans: |-
        当愤怒达到极限时，
        就会喷出暴风雪，
        把敌人和伙伴都冻成冰块。
      en: |-
        When its anger reaches a breaking point, this
        Pokémon unleashes a fierce blizzard that freezes
        every creature around it, be they friend or foe.
      fr: |-
        Lorsqu’il a les nerfs en boule, il provoque
        un blizzard qui gèle tout le monde, alliés
        comme adversaires.
      de: |-
        Wenn es in Rage gerät, erzeugt es gewaltige
        Eisböen, die sowohl Freund als auch Feind
        zu Eisklötzen gefrieren lassen.
      es: |-
        Cuando su rabia alcanza el punto máximo,
        genera una ventisca que congela tanto a amigos
        como a enemigos.
      it: |-
        Quando è furibondo, scatena una tormenta
        di neve che congela sia alleati che nemici.
    shield:
      ja-Hrkt: |-
        たいおんは　マイナス６ど　ぜんご。
        ２ひきの　バニリッチが　くっつき
        うまれたと　いわれている。
      ja: |-
        体温は　マイナス６度　前後。
        ２匹の　バニリッチが　くっつき
        生まれたと　いわれている。
      ko: |-
        체온은 마이너스 6도 전후이다.
        2마리의 바닐리치가 붙어서
        태어났다고 한다.
      zh-Hant: |-
        體溫在零下６度左右。
        據說是由２隻多多冰
        黏在一起而誕生的。
      zh-Hans: |-
        体温在零下６度左右。
        据说是由２只多多冰
        贴在一起而诞生的。
      en: |-
        People believe this Pokémon formed when two
        Vanillish stuck together. Its body temperature is
        roughly 21 degrees Fahrenheit.
      fr: |-
        La température de son corps est d’environ
        - 6 °C. On raconte que ce Pokémon naît
        lorsque deux Sorboul se collent l’un à l’autre.
      de: |-
        Seine Körpertemperatur beträgt circa -6 ºC.
        Angeblich ist es aus der Verschmelzung von
        zwei Gelatroppo hervorgegangen.
      es: |-
        Su temperatura corporal ronda los -6 °C. Se dice
        que nace de la fusión de dos Vanillish.
      it: |-
        La sua temperatura corporea si aggira intorno
        ai -6 ºC. Si dice che sia nato dall’unione di due
        Vanillish.
