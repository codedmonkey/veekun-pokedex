aurorus:
  base_happiness: 50
  capture_rate: 45
  color: blue
  egg_groups:
    - monster
  evolution_chain: amaura
  evolves_from: amaura
  flavor_text:
    x:
      ja-Hrkt: |-
        マイナス１５０どの　れいきを
        ひしがたの　けっしょうから　だして
        てきを　つつみ　こおりづけにする。
      ja: |-
        マイナス１５０度の　冷気を
        ひし形の　結晶から　出して
        敵を　包み　氷漬けにする。
      ko: |-
        마이너스 150도의 냉기를
        마름모꼴의 결정에서 내뿜어
        적을 감싸 얼어붙게 한다.
      en: |-
        The diamond-shaped crystals on its body
        expel air as cold as -240 degrees Fahrenheit,
        surrounding its enemies and encasing them in ice.
      fr: |-
        Les cristaux qui parsèment son corps lui permettent
        de piéger ses ennemis dans la glace en émettant
        de l’air refroidi à -150 °C.
      de: |-
        Mit der -150 °C kalten Luft, die den
        diamantförmigen Kristallen auf seinem
        Körper entströmt, friert es Gegner ein.
      es: |-
        Expulsa un gas gélido a temperaturas inferiores a los
        -150 ºC a través de sus cristales romboides y congela
        así a su enemigo.
      it: |-
        Emette aria gelida a -150 °C dai cristalli romboidali che
        ha sul corpo congelando i nemici.
    'y':
      ja-Hrkt: |-
        ひしがたの　けっしょうで　こおりの
        かべを　しゅんかんてきに　つくり
        てきの　こうげきを　ふせぐのだ。
      ja: |-
        ひし形の　結晶で
        氷の　壁を　瞬間的に　作り
        敵の　攻撃を　防ぐのだ。
      ko: |-
        마름모꼴의 결정으로
        얼음벽을 순간적으로 만들어
        적의 공격을 막는다.
      en: |-
        Using its diamond-shaped crystals,
        it can instantly create a wall of
        ice to block an opponent’s attack.
      fr: |-
        En utilisant ses cristaux, il peut créer en un instant
        un mur de glace pour se protéger des attaques
        ennemies.
      de: |-
        Es nutzt seine diamantförmigen Kristalle, um im Nu
        eine Wand aus Eis zur Abwehr gegnerischer Angriffe
        zu erschaffen.
      es: |-
        Gracias a sus cristales con forma de rombo, puede
        crear al momento una barrera de hielo para bloquear
        el ataque de su enemigo.
      it: |-
        Si difende dagli attacchi dei nemici creando in pochi
        istanti un muro di ghiaccio grazie ai cristalli romboidali
        del suo corpo.
    omega-ruby:
      ja-Hrkt: |-
        マイナス１５０どの　れいきを
        ひしがたの　けっしょうから　だして
        てきを　つつみ　こおりづけにする。
      ja: |-
        マイナス１５０度の　冷気を
        ひし形の　結晶から　出して
        敵を　包み　氷漬けにする。
      ko: |-
        마이너스 150도의 냉기를
        마름모꼴의 결정에서 내뿜어
        적을 감싸 얼어붙게 한다.
      en: |-
        The diamond-shaped crystals on its body
        expel air as cold as -240 degrees Fahrenheit,
        surrounding its enemies and encasing them in ice.
      fr: |-
        Les cristaux qui parsèment son corps lui permettent de piéger
        ses ennemis dans la glace en émettant de l’air refroidi
        à -150 °C.
      de: |-
        Mit der -150 °C kalten Luft, die den diamantförmigen Kristallen
        auf seinem Körper entströmt, friert es Gegner ein.
      es: |-
        Expulsa un gas gélido a temperaturas inferiores a los -150 °C
        a través de sus cristales romboides y congela así a su
        enemigo.
      it: |-
        Emette aria gelida a -150 °C dai cristalli romboidali che ha
        sul corpo congelando i nemici.
    alpha-sapphire:
      ja-Hrkt: |-
        ひしがたの　けっしょうで　こおりの
        かべを　しゅんかんてきに　つくり
        てきの　こうげきを　ふせぐのだ。
      ja: |-
        ひし形の　結晶で
        氷の　壁を　瞬間的に　作り
        敵の　攻撃を　防ぐのだ。
      ko: |-
        마름모꼴의 결정으로
        얼음벽을 순간적으로 만들어
        적의 공격을 막는다.
      en: |-
        Using its diamond-shaped crystals,
        it can instantly create a wall of
        ice to block an opponent’s attack.
      fr: |-
        En utilisant ses cristaux, il peut créer en un instant un mur
        de glace pour se protéger des attaques ennemies.
      de: |-
        Es nutzt seine diamantförmigen Kristalle, um im Nu eine Wand
        aus Eis zur Abwehr gegnerischer Angriffe zu erschaffen.
      es: |-
        Gracias a sus cristales con forma de rombo, puede crear al
        momento una barrera de hielo para bloquear el ataque de su
        enemigo.
      it: |-
        Si difende dagli attacchi dei nemici creando in pochi istanti
        un muro di ghiaccio grazie ai cristalli romboidali del suo corpo.
    ultra-sun:
      ja-Hrkt: |-
        ひょうざんの　なかに　とうじのままの
        すがたで　こおりづけに　なった
        アマルルガが　みつかり　ニュースに。
      ja: |-
        氷山の　中に　当時のままの
        姿で　氷漬けに　なった
        アマルルガが　見つかり　ニュースに。
      ko: |-
        빙산 안에 당시의 모습 그대로
        얼어붙은 아마루르가가
        발견되어 화제를 모았다.
      zh-Hant: |-
        有人在冰山裡發現了結凍的冰雪巨龍，
        牠仍然保持著當時的模樣。
        這件事被新聞報了出來。
      zh-Hans: |-
        报道里说，在冰山中发现了
        被冻住的冰雪巨龙，
        仍保持着当时的样子。
      en: |-
        An Aurorus was found frozen solid within a
        glacier, just as it appeared long ago, which
        became quite a big event in the news.
      fr: |-
        Un Dragmara a été retrouvé dans un glacier,
        en parfait état de conservation, ce qui a fait
        la une des actualités.
      de: |-
        Kürzlich sorgte der Fund eines in einem Eisberg
        eingeschlossenen, perfekt konservierten
        Amagargas aus der Urzeit für Schlagzeilen.
      es: |-
        El descubrimiento de un Aurorus en perfecto
        estado de conservación en el interior de un
        iceberg se convirtió en noticia.
      it: |-
        Di recente ha fatto notizia il ritrovamento di
        un esemplare in perfetto stato di conservazione
        intrappolato in un iceberg.
    ultra-moon:
      ja-Hrkt: |-
        からだの　ひょうめんの　おんどは
        マイナス　１５０ど。　ふだんは
        とてもおとなしく　やさしいポケモン。
      ja: |-
        身体の　表面の　温度は
        マイナス　１５０度。　普段は
        とても大人しく　やさしいポケモン。
      ko: |-
        몸의 표면 온도는 영하 150도다.
        평소에는 매우 얌전하고
        상냥한 포켓몬이다.
      zh-Hant: |-
        身體表面的溫度是
        零下１５０度。平常是
        非常穩重溫和的寶可夢。
      zh-Hans: |-
        身体表面的温度是零下１５０度。
        平常是非常稳重温和的宝可梦。
      en: |-
        This usually quiet and kindly Pokémon has a
        surface temperature of around
        –240 degrees Fahrenheit.
      fr: |-
        La température de la surface de son corps
        est de -150 °C. Ce Pokémon est généralement
        très calme et très doux.
      de: |-
        Die Oberfläche seines Körpers ist -150 °C kalt.
        Für gewöhnlich ist es ein sehr besonnenes und
        sanftmütiges Pokémon.
      es: |-
        La superficie de su cuerpo se mantiene a una
        temperatura de -150 ºC. Por lo general, es un
        Pokémon muy dócil y afable.
      it: |-
        La superficie del suo corpo ha una temperatura
        di -150 °C. È un Pokémon generalmente molto
        tranquillo e docile.
    sword:
      ja-Hrkt: |-
        かせきから　ふくげん　された。
        アマルルガが　ほえると　よぞらに
        オーロラが　あらわれると　いう。
      ja: |-
        化石から　復元された。
        アマルルガが　吠えると　夜空に
        オーロラが　現れると　いう。
      ko: |-
        화석에서 복원됐다.
        아마루르가가 울부짖으면 밤하늘에
        오로라가 나타난다고 한다.
      zh-Hant: |-
        從化石復原的寶可夢。
        據說當冰雪巨龍吼叫時，
        夜空中就會出現極光。
      zh-Hans: |-
        从化石复原而来。
        据说当冰雪巨龙吼叫时，
        夜空中就会出现极光。
      en: |-
        Aurorus was restored from a fossil. It’s said that
        when this Pokémon howls, auroras appear in the
        night sky.
      fr: |-
        Ce Pokémon a été ressuscité à partir d’un fossile.
        On raconte qu’une aurore boréale apparaît dans
        le ciel nocturne quand il hurle à la lune.
      de: |-
        Es wurde aus einem Fossil zurückverwandelt.
        Wenn es seinen Ruf erschallen lässt, sollen
        Polarlichter am Nachthimmel erscheinen.
      es: |-
        Fue regenerado a partir de un fósil. Dicen que el
        rugido de Aurorus hace aparecer la aurora boreal
        en el cielo nocturno.
      it: |-
        È stato rigenerato da un fossile. Si dice che
        quando Aurorus ulula, nel cielo notturno
        compaia l’aurora boreale.
    shield:
      ja-Hrkt: |-
        はげしい　いかりに　かられると
        もうれつな　れいきを　ふきだして
        あたりいちめんを　こおりづけにする。
      ja: |-
        激しい　怒りに　かられると
        猛烈な　冷気を　噴き出して
        あたり一面を　氷漬けにする。
      ko: |-
        격렬한 분노에 사로잡히면
        맹렬하게 냉기를 뿜어내
        주변을 모두 얼어붙게 한다.
      zh-Hant: |-
        當牠大大地被激怒時，
        就會噴出猛烈的冰氣
        讓周圍一帶全被冰封。
      zh-Hans: |-
        当它被激怒时，
        就会喷出猛烈的冷气，
        把周围都冰封起来。
      en: |-
        When gripped by rage, Aurorus will emanate
        freezing air, covering everything around it in ice.
      fr: |-
        Lorsqu’il se laisse emporter par sa rage,
        il relâche des bourrasques glacées
        qui gèlent tout ce qui l’entoure.
      de: |-
        Wenn es von wildem Zorn erfüllt ist, entströmt
        ihm gewaltige Kälte, die seine ganze Umgebung
        einfriert.
      es: |-
        Cuando se deja llevar por la ira, emite un vaho
        extremadamente gélido que lo congela todo a
        su alrededor.
      it: |-
        Quando è in preda all’ira emette un getto
        violento di aria gelida che congela tutto ciò
        che lo circonda.
