    x:
      ja-Hrkt: |-
        しっぽを　ふりまわして　あいてを
        なぎたおし　するどい　ツメで
        ズタズタに　ひきさいてしまう。
      ja: |-
        尻尾を　振り回して
        相手を　なぎ倒し　鋭い　ツメで
        ズタズタに　ひきさいてしまう。
      ko: |-
        꼬리를 휘둘러 상대를
        쓰러트리고 날카로운 발톱으로
        갈기갈기 찢어버린다.
      en: |-
        It lashes about with its tail to knock down its foe.
        It then tears up the fallen opponent with
        sharp claws.
      fr: |-
        Il se sert de sa queue pour faire tomber ses
        adversaires. Une fois qu’ils sont au sol, il les lacère
        de ses griffes acérées.
      de: |-
        Es schlägt im Kampf mit seinem Schwanz nach
        seinen Gegnern. Anschließend zerfetzt es
        die Gegner mit seinen scharfen Klauen.
      es: |-
        Suele usar la cola para derribar a su rival. Cuando lo
        tira, se vale de sus afiladas garras para acabar con él.
      it: |-
        Fa cadere a terra il nemico colpendolo con la coda,
        per poi finirlo con gli artigli affilati.
    'y':
      ja-Hrkt: |-
        もえる　しっぽを　ふりまわすと
        まわりの　おんどが　どんどん
        あがって　あいてを　くるしめる。
      ja: |-
        燃える　尻尾を　振り回すと
        まわりの　温度が　どんどん　上がって
        相手を　苦しめる。
      ko: |-
        불타는 꼬리를 휘두르면
        주위의 온도가 점점
        올라가 상대를 괴롭게 한다.
      en: |-
        When it swings its burning tail, it elevates the air
        temperature to unbearably high levels.
      fr: |-
        En agitant sa queue, il peut élever la température à
        un niveau incroyable.
      de: |-
        Wenn Glutexo mit seinem Schwanz schwingt,
        steigt die Temperatur ins Unermessliche.
      es: |-
        Cuando balancea la ardiente cola, eleva la temperatura
        a niveles muy altos.
      it: |-
        Quando agita la sua coda infuocata porta la
        temperatura a livelli insostenibili.
    omega-ruby:
      ja-Hrkt: |-
        するどい　ツメで　ようしゃなく　たたきのめす。
        きょうてきと　むかいあうと　きぶんが　たかぶり
        しっぽの　ほのおが　あおじろく　もえあがる。
      ja: |-
        鋭い　ツメで　ようしゃなく　たたきのめす。
        強敵と　向かい合うと　気分が　たかぶり
        尻尾の　炎が　青白く　燃えあがる。
      ko: |-
        날카로운 발톱으로 봐주지 않고 때려눕힌다.
        강한 적을 만나면 기분이 고양되며
        꼬리의 불꽃이 푸르스름하게 불타오른다.
      en: |-
        Charmeleon mercilessly destroys its foes using its sharp claws.
        If it encounters a strong foe, it turns aggressive.
        In this excited state, the flame at the tip of its tail flares with a
        bluish white color.
      fr: |-
        Reptincel lacère ses ennemis sans pitié grâce à ses griffes
        acérées. S’il rencontre un ennemi puissant, il devient agressif
        et la flamme au bout de sa queue s’embrase et prend
        une couleur bleu clair.
      de: |-
        Gnadenlos besiegt Glutexo seine Gegner mit seinen
        scharfen Klauen. Wenn es auf starke Gegner trifft,
        wird es wütend und die Flamme auf seiner Schweifspitze
        flackert in einem bläulichen Ton.
      es: |-
        Charmeleon no tiene reparo en acabar con su rival usando
        las afiladas garras que tiene. Si su enemigo es fuerte, se
        vuelve agresivo, y la llama que tiene en el extremo de la cola
        empieza a arder con mayor intensidad tornándose azulada.
      it: |-
        Charmeleon distrugge il nemico senza pietà con i suoi
        artigli affilati. Quando incontra un avversario molto forte
        diventa aggressivo. In questo stato di grande agitazione
        la fiamma della coda diventa di colore bianco bluastro.
    alpha-sapphire:
      ja-Hrkt: |-
        するどい　ツメで　ようしゃなく　たたきのめす。
        きょうてきと　むかいあうと　きぶんが　たかぶり
        しっぽの　ほのおが　あおじろく　もえあがる。
      ja: |-
        鋭い　ツメで　ようしゃなく　たたきのめす。
        強敵と　向かい合うと　気分が　たかぶり
        尻尾の　炎が　青白く　燃えあがる。
      ko: |-
        날카로운 발톱으로 봐주지 않고 때려눕힌다.
        강한 적을 만나면 기분이 고양되며
        꼬리의 불꽃이 푸르스름하게 불타오른다.
      en: |-
        Charmeleon mercilessly destroys its foes using its sharp
        claws. If it encounters a strong foe, it turns aggressive.
        In this excited state, the flame at the tip of its tail flares with
        a bluish white color.
      fr: |-
        Reptincel lacère ses ennemis sans pitié grâce à ses griffes
        acérées. S’il rencontre un ennemi puissant, il devient agressif
        et la flamme au bout de sa queue s’embrase et prend
        une couleur bleu clair.
      de: |-
        Glutexo attackiert seine Feinde mit aller Gewalt und unter
        Einsatz seiner scharfen Krallen. Trifft es auf starke Gegner,
        wird es wütend und die Flamme auf seiner Schweifspitze
        flackert in einem bläulichen Ton.
      es: |-
        Charmeleon no tiene reparo en acabar con su rival usando
        las afiladas garras que tiene. Si su enemigo es fuerte, se
        vuelve agresivo, y la llama que tiene en el extremo de la cola
        empieza a arder con mayor intensidad tornándose azulada.
      it: |-
        Charmeleon distrugge il nemico senza pietà con i suoi
        artigli affilati. Quando incontra un avversario molto forte
        diventa aggressivo. In questo stato di grande agitazione
        la fiamma della coda diventa di colore bianco bluastro.
    lets-go-pikachu:
      ja-Hrkt: |-
        きょうてきと　たたかいつづけ
        エキサイトすると　あおじろい
        ほのおを　はきだすことがある。
      ja: |-
        強敵と　戦いつづけ
        エキサイトすると　青白い
        炎を　吐き出すことがある。
      ko: |-
        강한 적과 싸움을 거듭하다
        흥분하면 푸르스름한
        불꽃을 뿜어낼 때가 있다.
      zh-Hant: |-
        在與強敵戰鬥的過程中，
        如果情緒變得興奮起來，
        有時會噴出藍白色的火焰。
      zh-Hans: |-
        在与强敌战斗的过程中，
        如果情绪变得兴奋起来，
        有时会喷出青白色的烈火。
      en: |-
        Tough fights could excite this Pokémon. When
        excited, it may breathe out bluish-white flames.
      fr: |-
        Exalté quand il affronte des adversaires
        puissants, ce Pokémon en vient parfois
        à cracher des flammes bleutées.
      de: |-
        Kämpft es länger gegen starke Gegner, so gerät
        es in Aufregung und spuckt manchmal gleißend
        helle, bläuliche Flammen.
      es: |-
        Librar combates intensos lo entusiasma tanto
        que en ocasiones lanza llamas de tono blanco
        azulado.
      it: |-
        Si infervora durante le lotte più dure e talvolta
        sputa fiamme bluastre.
    lets-go-eevee:
      ja-Hrkt: |-
        きょうてきと　たたかいつづけ
        エキサイトすると　あおじろい
        ほのおを　はきだすことがある。
      ja: |-
