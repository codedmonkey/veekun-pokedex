    sword:
      ja-Hrkt: |-
        もえる　しっぽを　ふりまわし
        するどい　ツメで　あいてを
        きりさく　あらあらしい　せいかく。
      ja: |-
        燃える　しっぽを　振りまわし
        するどい　ツメで　相手を
        切り裂く　荒々しい　性格。
      ko: |-
        불타는 꼬리를 휘두르며
        날카로운 발톱으로 상대를
        베어 가르는 몹시 거친 성격이다.
      zh-Hant: |-
        揮動燃燒著火焰的尾巴，
        用鋒利的爪子撕裂對手。
        性情十分粗暴。
      zh-Hans: |-
        挥动燃烧着火焰的尾巴，
        用锋利的爪子撕裂对手。
        性格十分粗暴。
      en: |-
        It has a barbaric nature. In battle, it whips its
        fiery tail around and slashes away with sharp claws.
      fr: |-
        Il est très brutal. En combat, il se sert de
        ses griffes acérées et de sa queue enflammée
        pour mettre en pièces ses adversaires.
      de: |-
        Es ist brutal veranlagt. Im Kampf schlägt es mit
        seinem brennenden Schweif um sich und schlitzt
        Gegner mit seinen scharfen Klauen auf.
      es: |-
        Este Pokémon de naturaleza agresiva ataca en
        combate con su cola llameante y hace trizas al
        rival con sus afiladas garras.
      it: |-
        Ha un’indole feroce. Usa la coda fiammeggiante
        come una frusta e lacera l’avversario con gli
        artigli affilati.
    shield:
      ja-Hrkt: |-
        たたかいで　きもちが　たかぶると
        しゃくねつの　ほのおを　ふきながら
        あたりを　もやしてまわる。
      ja: |-
        戦いで　気持ちが　たかぶると
        灼熱の　炎を　吹きながら
        あたりを　燃やしてまわる。
      ko: |-
        싸움으로 기분이 고조되면
        작열하는 불꽃을 뿜으며
        주변을 태워버린다.
      zh-Hant: |-
        如果牠在戰鬥中亢奮起來，
        就會噴出灼熱的火焰，
        把周圍的東西燒得一乾二淨。
      zh-Hans: |-
        如果它在战斗中亢奋起来，
        就会喷出灼热的火焰，
        把周围的东西烧得一干二净。
      en: |-
        If it becomes agitated during battle, it spouts
        intense flames, incinerating its surroundings.
      fr: |-
        S’il s’excite pendant un combat, il crache
        de grandes flammes, brûlant tout ce qui
        se trouve aux alentours.
      de: |-
        Steigert es sich in einen Kampf hinein, spuckt es
        Flammen, die alles in seiner Umgebung
        niederbrennen.
      es: |-
        Si se exalta en combate, expulsa intensas
        llamaradas que incineran todo a su alrededor.
      it: |-
        Se s’infervora nella lotta, sputa potenti fiamme
        che inceneriscono l’area circostante.
