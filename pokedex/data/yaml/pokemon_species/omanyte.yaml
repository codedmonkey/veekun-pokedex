        aber durch die Menschen aus Fossilien reproduziert wurde.
        Wenn es von einem Feind angegriffen wird, zieht es sich in
        sein hartes Gehäuse zurück.
      es: |-
        Omanyte es uno de esos Pokémon ancestrales que se
        extinguieron hace muchísimo tiempo y que la gente ha
        recuperado a partir de fósiles. Si un enemigo le ataca, se
        esconderá dentro de la dura concha que tiene.
      it: |-
        Omanyte è uno degli antichi Pokémon estinti, recentemente
        rigenerati dall’uomo. In caso di aggressione da parte di
        un nemico, si ritira all’interno della sua dura corazza.
    ultra-sun:
      ja-Hrkt: |-
        こだいのうみに　いきていた　ポケモン。
        アーケオスの　エサだったようで
        はがたのついた　かせきが　みつかる。
      ja: |-
        古代の海に　生きていた　ポケモン。
        アーケオスの　エサだったようで
        歯型のついた　化石が　見つかる。
      ko: |-
        고대의 바다에 살았던 포켓몬.
        아케오스의 먹이였던 것으로 추정되며
        잇자국이 있는 화석이 발견된다.
      zh-Hant: |-
        生活在古代海洋中的寶可夢。
        似乎是始祖大鳥的食物，
        曾被發現過帶有齒痕的化石。
      zh-Hans: |-
        生活在古代海洋中的宝可梦。
        好像曾是始祖大鸟的食物，
        发现过带有齿痕的化石。
      en: |-
        Omanyte lived in the seas of antiquity. Its
        fossils have been found bearing bite marks from
        Archeops, so apparently Archeops preyed on it.
      fr: |-
        Un Pokémon qui vivait dans les mers antiques.
        Des fossiles présentant des traces de morsures
        indiquent qu’il était la proie d’Aéroptéryx.
      de: |-
        Es lebte im urzeitlichen Meer. Bissspuren auf
        seinen Fossilien deuten darauf hin, dass es
        damals von Aeropteryx gejagt wurde.
      es: |-
        Pokémon prehistórico que vivía en el océano.
        Las marcas de mordeduras en sus fósiles
        indican que solía ser presa de los Archeops.
      it: |-
        Pokémon che viveva nei mari ancestrali.
        Per via dei segni di zanne ritrovati sui fossili,
        si pensa che venisse cacciato dagli Archeops.
    ultra-moon:
      ja-Hrkt: |-
        こだいの　かせきから　ふくげんされた。
        おおむかし　うみだった　ばしょから
        かいのカセキが　はっくつ　される。
      ja: |-
        古代の　化石から　復元された。
        大昔　海だった　場所から
        かいのカセキが　発掘　される。
      ko: |-
        고대 화석에서 복원되었다.
        오랜 옛날 바다였던 곳에서
        조개화석이 발굴된다.
      zh-Hant: |-
        從古代的化石復原而來。
        在很久以前曾經是海洋的地方
        能夠發掘到牠的貝殼化石。
      zh-Hans: |-
        从古代的化石复原而来。
        在很久以前还是海洋的地方
        能发掘出它的贝壳化石。
      en: |-
        It was restored from an ancient fossil. Those
        Helix Fossils are excavated from areas that
        were once oceans long, long ago.
      fr: |-
        Un Pokémon recréé à partir d’un fossile antique.
        Ces Nautiles se trouvent en des endroits jadis
        recouverts par les flots.
      de: |-
        Es konnte durch Fossilien seines Gehäuses
        neu belebt werden, die an Orten gefunden
        wurden, an denen sich früher das Meer befand.
      es: |-
        Este Pokémon ha sido regenerado a partir de
        Fósiles Hélix hallados en estratos que
        corresponden al lecho de océanos prehistóricos.
      it: |-
        Durante scavi in luoghi anticamente sommersi
        si trovano spesso degli Helixfossili, da cui
        questo Pokémon viene rigenerato.
    lets-go-pikachu:
      ja-Hrkt: |-
        １０ぽんのあしを　うまく　くねらせて
        こだいの　うみを　ただよっていた
        ポケモンの　カセキを　ふくげんした。
      ja: |-
        １０本の足を　うまく　くねらせて
        古代の　海を　漂っていた
        ポケモンの　カセキを　復元した。
      ko: |-
        10개의 다리를 자유자재로 구불거리며
        고대의 바다를 떠돌던
        포켓몬의 화석을 복원했다.
      zh-Hant: |-
        復原自能夠靈活地扭動
        10隻腳在古代海上漂浮的
        寶可夢的化石。
      zh-Hans: |-
        用化石复原出的宝可梦，
        靠巧妙地弯曲它的10条腿
        在古代的大海里飘荡。
      en: |-
        An ancient Pokémon that was recovered from
        a fossil. It swam by cleverly twisting its
        10 tentacles about.
      fr: |-
        Un ancien Pokémon reconstitué à partir d’un
        fossile. Il nageait dans les mers antiques grâce
        à ses dix tentacules.
      de: |-
        Es wurde aus einem Fossil zurückverwandelt.
        In der Urzeit schwamm es durch geschicktes
        Bewegen seiner zehn Tentakel durch das Meer.
      es: |-
        Este antiguo Pokémon fue regenerado a partir
        de un fósil. Solía nadar en antiguos mares
        moviendo con destreza sus 10 tentáculos.
      it: |-
        Pokémon preistorico rigenerato da un fossile.
        Nuotava nei mari primordiali agitando con
        maestria i suoi dieci tentacoli.
    lets-go-eevee:
      ja-Hrkt: |-
        １０ぽんのあしを　うまく　くねらせて
