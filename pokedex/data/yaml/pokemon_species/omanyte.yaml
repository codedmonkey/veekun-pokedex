        Nuotava nei mari primordiali agitando con
        maestria i suoi dieci tentacoli.
    sword:
      ja-Hrkt: |-
        ふくげんされた　あと　にげだしたり
        にがしてしまう　ものが　いるため
        もんだいに　なりつつあるのだ。
      ja: |-
        復元されたあと　逃げだしたり
        逃がしてしまう　ものが　いるため
        問題に　なりつつあるのだ。
      ko: |-
        복원된 후 도망치거나
        놓쳐버리는 경우가 생겨서
        문제시되고 있다.
      zh-Hant: |-
        從化石復原後有些菊石獸
        會逃走，有些則被放生。
        近來這個問題越來越明顯。
      zh-Hans: |-
        从化石被复原后有些逃了出去，
        有些则被人放走。这些散逸在外
        的菊石兽越来越成问题了。
      en: |-
        Because some Omanyte manage to escape after
        being restored or are released into the wild by
        people, this species is becoming a problem.
      fr: |-
        Ce Pokémon commence à poser problème,
        car certains spécimens se sont enfuis ou
        ont été relâchés après avoir été ressuscités.
      de: |-
        Diese Pokémon entwickeln sich allmählich zu
        einem Problem, da einige wiederbelebte
        Exemplare fliehen oder freigelassen werden.
      es: |-
        Varios ejemplares han escapado o bien han sido
        liberados tras su restauración, lo que comienza a
        suscitar una serie de problemas.
      it: |-
        Questo Pokémon si sta rivelando un problema
        perché a volte fugge o viene liberato dopo
        essere stato rigenerato.
    shield:
      ja-Hrkt: |-
        ぜつめつした　こだいのポケモン。
        １０ぽんのあしで　みずを　かき
        ただようように　およぐ。
      ja: |-
        絶滅した　古代のポケモン。
        １０本の脚で　水を　かき
        漂うように　泳ぐ。
      ko: |-
        멸종한 고대의 포켓몬이다.
        10개의 다리로 물을 가르며
        떠다니듯 헤엄친다.
      zh-Hant: |-
        一度滅絕的古代寶可夢。
        會使用１０隻腳划水，
        在水中一漂一浮地游動。
      zh-Hans: |-
        已经灭绝的古代宝可梦。
        依靠１０只脚来划水，
        在水中轻盈地游曳。
      en: |-
        This Pokémon is a member of an ancient, extinct
        species. Omanyte paddles through water with its
        10 tentacles, looking like it’s just drifting along.
      fr: |-
        Un Pokémon préhistorique aujourd’hui disparu.
        Il semble flotter lorsqu’il nage en brassant l’eau
        avec ses dix tentacules.
      de: |-
        Ein einst ausgestorbenes Urzeit-Pokémon. Wenn
        es mit seinen zehn Tentakeln paddelnd durch das
        Wasser gleitet, meint man, es würde schweben.
      es: |-
        Un Pokémon de la era prehistórica, ahora
        extinto. Solía nadar moviendo sus diez tentáculos
        para desplazarse por el agua como si flotara.
      it: |-
        È un antico Pokémon ormai estinto. Quando
        nuota usando i suoi dieci tentacoli sembra
        fluttuare nell’acqua.
