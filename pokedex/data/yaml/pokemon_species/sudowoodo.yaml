      fr: |-
        Il prend l’apparence d’un arbre
        pour éviter les attaques, mais il
        déteste l’eau et fuit la pluie.
    black-2:
      en: |-
        To avoid being attacked, it does
        nothing but mimic a tree. It hates
        water and flees from rain.
    white-2:
      en: |-
        To avoid being attacked, it does
        nothing but mimic a tree. It hates
        water and flees from rain.
    x:
      ja-Hrkt: |-
        いつも　きのふりを　している。
        からだの　つくりは　しょくぶつより
        いしや　いわなどに　ちかいようだ。
      ja: |-
        いつも　木のふりを　している。
        体の　つくりは　植物より
        石や　岩などに　近いようだ。
      ko: |-
        항상 나무인 척하고 있다.
        몸의 구조는 식물보다
        돌이나 바위에 가까운 듯하다.
      en: |-
        Although it always pretends to be a tree, its
        composition appears more similar to rock than
        to vegetation.
      fr: |-
        Il fait semblant d’être un arbre. Sa composition est
        en fait plus proche de la pierre.
      de: |-
        Obwohl es vorgibt, ein Baum zu sein, kommt seine
        Zusammensetzung einem Stein näher als einer Pflanze.
      es: |-
        Aunque pretende ser un árbol, en su composición se
        parece más a una roca que a una planta.
      it: |-
        Sebbene finga di essere un albero, la composizione
        sembra più simile a quella di una roccia.
    'y':
      ja-Hrkt: |-
        おそわれないように　きのまねをする。
        みずがにがてで　あめが　ふりだすと
        いつのまにか　すがたを　けす。
      ja: |-
        襲われないように　木の真似をする。
        水が　苦手で　雨が　降り出すと
        いつの間にか　姿を　消す。
      ko: |-
        습격당하지 않도록 나무 흉내를 낸다.
        물에 약하기 때문에 비가 내리면
        어느 순간에 모습을 감춰버린다.
      en: |-
        It disguises itself as a tree to avoid attack. It hates
        water, so it will disappear if it starts raining.
      fr: |-
        Il se déguise en arbre pour éviter les problèmes.
        Il déteste l’eau et se cache par temps de pluie.
      de: |-
        Es tarnt sich als Baum, um nicht angegriffen
        zu werden. Es hasst Wasser, darum läuft es
        bei Regen weg.
      es: |-
        Se disfraza de árbol para no ser atacado. Odia el agua,
        por lo que desaparecerá si empieza a llover.
      it: |-
        Si traveste da albero per evitare gli attacchi. Odiando
        l’acqua, scompare appena inizia a piovere.
    omega-ruby:
      ja-Hrkt: |-
        てきに　おそわれない　ように　きの　ふりをする。
        りょうては　１ねんじゅう　みどりいろなので
        ふゆは　にせものだと　すぐに　ばれてしまう。
      ja: |-
        敵に　襲われない　ように　木の　ふりをする。
        両手は　１年中　緑色なので
        冬は　偽物だと　すぐに　ばれてしまう。
      ko: |-
        적에게 습격당하지 않으려 나무인 척한다.
        양손이 일 년 내내 초록빛이라
        겨울에는 가짜임이 바로 들통 난다.
      en: |-
        Sudowoodo camouflages itself as a tree to avoid being
        attacked by enemies. However, because its hands remain
        green throughout the year, the Pokémon is easily identified
        as a fake during the winter.
      fr: |-
        Simularbre se camoufle en arbre pour éviter d’être attaqué
        par ses ennemis. Mais étant donné que ses pattes restent
        vertes toute l’année, ce Pokémon est facile à repérer
        pendant l’hiver.
      de: |-
        Mogelbaum tarnt sich als Baum, um Angriffen von Feinden
        aus dem Weg zu gehen. Da seine Arme aber das ganze Jahr
        über grün bleiben, fällt seine Tarnung im Winter leicht auf.
      es: |-
        Sudowoodo se camufla adoptando la imagen de un árbol para
        que no le ataque ningún enemigo. El problema viene en
        invierno, ya que las extremidades superiores tienen color verde
        y es fácil identificarle.
      it: |-
        Sudowoodo si camuffa da albero per evitare gli attacchi
        nemici. Tuttavia, poiché gli arti superiori sono sempreverdi,
        d’inverno viene scoperto facilmente.
    alpha-sapphire:
      ja-Hrkt: |-
        てきに　おそわれない　ように　きの　ふりをする。
        りょうては　１ねんじゅう　みどりいろなので
        ふゆは　にせものだと　すぐに　ばれてしまう。
      ja: |-
        敵に　襲われない　ように　木の　ふりをする。
        両手は　１年中　緑色なので
        冬は　偽物だと　すぐに　ばれてしまう。
      ko: |-
        적에게 습격당하지 않으려 나무인 척한다.
        양손이 일 년 내내 초록빛이라
        겨울에는 가짜임이 바로 들통 난다.
      en: |-
        Sudowoodo camouflages itself as a tree to avoid being
        attacked by enemies. However, because its hands remain
        green throughout the year, the Pokémon is easily identified
        as a fake during the winter.
      fr: |-
        Simularbre se camoufle en arbre pour éviter d’être attaqué
        par ses ennemis. Mais étant donné que ses pattes restent
        vertes toute l’année, ce Pokémon est facile à repérer
        pendant l’hiver.
      de: |-
        Mogelbaum tarnt sich als Baum, um Angriffen von Feinden
        aus dem Weg zu gehen. Da seine Arme aber das ganze Jahr
        über grün bleiben, fällt seine Tarnung im Winter leicht auf.
      es: |-
        Sudowoodo se camufla adoptando la imagen de un árbol para
        que no le ataque ningún enemigo. El problema viene en
        invierno, ya que las extremidades superiores tienen color verde
        y es fácil identificarle.
      it: |-
        Sudowoodo si camuffa da albero per evitare gli attacchi
        nemici. Tuttavia, poiché gli arti superiori sono sempreverdi,
        d’inverno viene scoperto facilmente.
    sun:
      ja-Hrkt: |-
        おそわれないため　じゅもくの　マネを
        するが　きらいな　みずを　かけられて
        あわてて　にげだしていく。
      ja: |-
        襲われないため　樹木の　真似を
        するが　嫌いな　水を　かけられて
        あわてて　逃げだしていく。
      ko: |-
        공격을 당하지 않기 위해 나무인 척
        하지만 싫어하는 물을 뒤집어쓰면
        당황해서 도망가버린다.
      zh-Hant: |-
        為了不被襲擊而模仿成樹木的樣子，
        但如果被討厭的水潑到，
        就會慌慌張張地逃走。
      zh-Hans: |-
        为了不被袭击而模仿成树木的样子，
        但如果被讨厌的水泼到，
        就会慌慌张张地逃走。
      en: |-
        To avoid attack, it mimics a tree. It will run off
        if splashed with water, which it hates.
      fr: |-
        Il imite un arbre pour passer inaperçu, mais il
        déteste tellement l’eau qu’il prend ses jambes
        à son cou s’il se fait arroser.
      de: |-
        Es tarnt sich als Baum, um Angriffen aus dem
        Weg zu gehen. Es hasst jedoch Wasser und
        ergreift die Flucht, wenn man es nass macht.
      es: |-
        Se disfraza de árbol para no ser atacado. Huirá
        rápidamente si alguien le echa agua por encima,
        pues no la soporta.
      it: |-
        Si camuffa da albero per evitare gli attacchi
        nemici, ma odia l’acqua e se viene annaffiato
        scappa via.
    moon:
      ja-Hrkt: |-
        おとしよりを　ちゅうしんに　にんき。
        みどりの　ぶぶんが　おおきいほど
        マニアの　ひょうかは　あがるらしい。
      ja: |-
        お年寄りを　中心に　人気。
        緑の　部分が　大きいほど
        マニアの　評価は　あがるらしい。
      ko: |-
        노인을 중심으로 인기다.
        초록색 부분이 클수록
        마니아의 평가가 높아지는 듯하다.
      zh-Hant: |-
        很受以老年人為中心的人們歡迎。
        聽說綠色的部分越大，
        愛好者們的評價就越高。
      zh-Hans: |-
        在老年人当中很受欢迎。
        听说绿色的部分越大，
        爱好者们的评价就越高。
      en: |-
        Apparently, the larger the green parts of this
        Pokémon, the more collectors value it. It’s a
        particular favorite among elderly people.
      fr: |-
        Très populaire, notamment chez les personnes
        âgées. Plus la partie verte est grande, plus
        ses fans se l’arrachent.
      de: |-
        Es ist vor allem bei alten Leuten beliebt.
        Je größer sein Grünanteil, desto mehr wird
        es in Fankreisen geschätzt.
      es: |-
        Es bastante popular entre la gente de mayor
        edad. La pasión que le profesan los fanáticos
        es proporcional al tamaño de su parte verde.
      it: |-
        È popolare soprattutto tra gli anziani.
        Gli appassionati apprezzano in particolare
        quelli con la parte verde più sviluppata.
    ultra-sun:
      ja-Hrkt: |-
        おとしよりに　にんきで　せんもんしも
        あるほど。　あいこうかは　うでの
        ながさや　かくどに　こだわるのだ。
      ja: |-
        お年寄りに　人気で　専門誌も
        あるほど。　愛好家は　腕の
        長さや　角度に　こだわるのだ。
      ko: |-
        노인에게 인기로 전문지가
        있을 정도다. 애호가는 팔의
        길이와 각도에 신경 쓴다.
      zh-Hant: |-
        很受老人家喜愛，甚至有
        關於牠的專門雜誌。愛好者
        特別講究牠的手臂長度和角度。
      zh-Hans: |-
        很受老年人喜爱，甚至还有关于
        它的专门杂志。它的爱好者
        很讲究它手臂的长度和角度。
      en: |-
        It’s so popular with the elderly that there’s a
        magazine devoted to this Pokémon. Fans obsess
        over the particular length and angle of its arms.
      fr: |-
        Il fait l’objet de revues spécialisées tant il est
        populaire auprès des personnes âgées. Ses fans
        aiment surtout la longueur et l’angle de ses bras.
      de: |-
        Es ist sehr beliebt bei Senioren und hat sogar
        seine eigene Fachzeitschrift. Auf Länge und
        Winkel seiner Arme legen Fans besonderen Wert.
      es: |-
        Aparece en algunas revistas especializadas
        populares entre la gente mayor. Sus fans adoran
        lo largo y anguloso de sus extremidades.
      it: |-
        Gli anziani lo adorano e ci sono riviste dedicate
        a lui. Gli appassionati danno molta importanza
        alla lunghezza e all’angolatura delle sue braccia.
    ultra-moon:
      ja-Hrkt: |-
        しなやか　かつ　たくましい　うでは
        おなじポーズを　とりつづけるうちに
        きたえられた　たまもの　なのだ。
      ja: |-
        しなやか　かつ　たくましい　腕は
        同じポーズを　とり続けるうちに
        鍛えられた　賜物　なのだ。
      ko: |-
        유연하면서도 강인한 팔은
        같은 포즈를 계속해서 취하는 동안
        단련된 덕분에 얻을 수 있었다.
      zh-Hant: |-
        牠那柔韌又強壯的手臂，
        是因為長期擺著同樣姿勢
        而獲得的鍛鍊成果。
      zh-Hans: |-
        它之所以会有柔软又结实的手臂，
        是因为在长期摆出同样
        姿势的过程中得到了锻炼。
      en: |-
        The result of its holding the same pose all the
        time is arms that have become supple
        yet strong.
      fr: |-
        La souplesse et la robustesse de ses bras sont
        le fruit d’un entraînement long et rigoureux
        qui consiste en une immobilité prolongée.
      de: |-
        Mogelbaum verharrt lange in derselben Pose,
        wodurch seine Arme äußerst gelenkig und
        kräftig geworden sind.
      es: |-
        A fuerza de mantener la misma postura, sus
        extremidades se han vuelto flexibles y robustas.
      it: |-
        Mantiene la stessa posizione tutto il giorno
        e per questo le sue braccia sono diventate
        robuste e flessibili.
    sword:
      ja-Hrkt: |-
        かぜも　ないのに　ゆれている　きを
        みかけたら　それが　ウソッキー。
        あめのひは　すがたを　かくすという。
      ja: |-
        風も　ないのに　揺れている　木を
        見かけたら　それが　ウソッキー。
        雨の日は　姿を　隠すという。
      ko: |-
        바람도 불지 않는데 흔들리는 나무를
        발견했다면 그게 바로 꼬지모다.
        비가 오는 날에는 모습을 감춘다고 한다.
      zh-Hant: |-
        如果在沒風的日子看見
        樹在搖擺，那就是樹才怪。
        據說在下雨時會躲起來。
      zh-Hans: |-
        如果在没风的日子看见
        树在摇摆，那就是树才怪。
        据说在下雨时会躲起来。
      en: |-
        If a tree branch shakes when there is no wind, it’s
        a Sudowoodo, not a tree. It hides from the rain.
      fr: |-
        Si une branche remue alors qu’il n’y a pas de vent,
        c’est qu’il s’agit d’un Simularbre.
        On n’en croise jamais les jours de pluie.
      de: |-
        Bewegt ein Baum bei Windstille einen Ast,
        ist das kein Baum, sondern ein Mogelbaum.
        An Regentagen hält es sich versteckt.
      es: |-
        Quien vea agitarse un árbol sin que sople el
        viento habrá encontrado un Sudowoodo.
        En los días lluviosos, sin embargo, se esconde.
      it: |-
        Se si nota un albero ondeggiare anche se non c’è
        vento, probabilmente è un Sudowoodo. Si dice
        che nelle giornate piovose se ne stia nascosto.
    shield:
      ja-Hrkt: |-
        おそわれないように　きのまねをする。
        みずがにがてで　あめが　ふりだすと
        いつのまにか　すがたを　けす。
      ja: |-
        襲われないように　木のまねをする。
        水が　苦手で　雨が　降り出すと
        いつの間にか　姿を　消す。
      ko: |-
        습격당하지 않도록 나무 흉내를 낸다.
        물에 약하기 때문에 비가 내리면
        어느 틈에 모습을 감춰버린다.
      zh-Hant: |-
        為了不被襲擊而模仿樹的樣子。
        很討厭水，所以一開始下雨
        就會在不知不覺間消失無蹤。
      zh-Hans: |-
        为了不被袭击会模仿树的样子。
        很讨厌水，所以下雨后，
        不知什么时候就会消失。
      en: |-
        It disguises itself as a tree to avoid attack. It hates
        water, so it will disappear if it starts raining.
      fr: |-
        Il se déguise en arbre pour éviter de se faire
        attaquer. Il déteste l’eau et se cache par temps
        de pluie.
      de: |-
        Es tarnt sich als Baum, um nicht angegriffen zu
        werden. Nur bei Regen sucht es das Weite, da es
        Wasser nicht leiden kann.
      es: |-
        Finge ser un árbol para evitar que lo ataquen.
        Odia tanto el agua que desaparecerá si empieza
        a llover.
      it: |-
        Fa finta di essere un albero per evitare di essere
        attaccato. Poiché odia l’acqua, scompare appena
        inizia a piovere.
