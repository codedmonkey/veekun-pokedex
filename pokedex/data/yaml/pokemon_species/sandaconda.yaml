sandaconda:
  base_happiness: 50
  capture_rate: 120
  color: green
  egg_groups:
    - ground
    - dragon
  evolution_chain: silicobra
  evolves_from: silicobra
  flavor_text:
    sword:
      ja-Hrkt: |-
        ぜんしんを　ちぢめ　１００キロの
        すなを　はなの　あなから　ふんしゃ。
        すなが　ないと　よわきに　なるぞ。
      ja: |-
        全身を　縮め　１００キロの
        砂を　鼻の　穴から　噴射。
        砂が　ないと　弱気に　なるぞ。
      ko: |-
        온몸을 수축시킨 뒤 100kg의
        모래를 콧구멍으로 내뿜는다.
        모래가 없으면 무기력해진다.
      zh-Hant: |-
        蜷縮身體後從鼻孔裡噴射出
        １００公斤的沙子。沒有了
        沙子就會變得很懦弱。
      zh-Hans: |-
        蜷缩身体后从鼻孔里喷射出
        １００公斤的沙子。没有了
        沙子就会变得很懦弱。
      en: |-
        When it contracts its body, over 220 pounds of
        sand sprays from its nose. If it ever runs out of
        sand, it becomes disheartened.
      fr: |-
        Il peut expulser 100 kg de sable de ses narines
        en compressant tout son corps. Quand il est
        à court de sable, il a tendance à se dérober.
      de: |-
        Zieht es seinen ganzen Körper zusammen, kann
        es 100 kg Sand aus seinen Nasenlöchern feuern.
        Geht ihm der Sand aus, verliert es den Mut.
      es: |-
        Se retuerce para expulsar por los orificios nasales
        hasta 100 kg de arena. La ausencia de esta mina
        su ánimo.
      it: |-
        Può rimpicciolire il suo corpo espellendo dalle
        narici 100 kg di sabbia. Quando esaurisce la
        sabbia, viene preso dallo sconforto.
    shield:
      ja-Hrkt: |-
        どくとくの　とぐろの　まきかたは
        すなぶくろの　すなを　より　こうりつ
        よく　ふんしゃ　するため　なのだ。
      ja: |-
        独特の　とぐろの　巻き方は
        砂袋の　砂を　より　効率
        よく　噴射　するため　なのだ。
      ko: |-
        독특한 똬리 형태는
        모래주머니의 모래를 더 효율적으로
        분사하기 위함이다.
      zh-Hant: |-
        牠之所以會以獨特的方式
        盤繞自己的身體，是為了能
        更有效率地噴射沙囊中的沙子。
      zh-Hans: |-
        它之所以会以独特的方式
        盘绕自己的身体，是为了能
        更高效地喷射砂囊中的沙子。
      en: |-
        Its unique style of coiling allows it to blast sand
        out of its sand sac more efficiently.
      fr: |-
        S’il s’enroule d’une manière aussi particulière,
        c’est pour optimiser l’expulsion de sable
        par ses narines.
      de: |-
        Es rollt sich auf diese eigentümliche Weise
        zusammen, damit es den Sand aus seinem
        Sandbeutel effizienter verschießen kann.
      es: |-
        La manera tan particular que tiene de enrollarse
        sobre sí mismo le permite expulsar con mayor
        eficacia la arena que almacena en la bolsa.
      it: |-
        Il modo particolare in cui si attorciglia su se
        stesso gli permette di espellere sabbia dalla
        sua sacca in modo più efficiente.
