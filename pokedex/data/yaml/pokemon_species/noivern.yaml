        di ogni loro minima distrazione. Nell’oscurità è invincibile.
    alpha-sapphire:
      ja-Hrkt: |-
        みみから　はっする　ちょうおんぱで
        きょだいな　いわも　ふんさいする。
        くらやみに　まぎれて　おそいかかる。
      ja: |-
        耳から　発する　超音波で
        巨大な　岩も　粉砕する。
        暗闇に　紛れて　襲いかかる。
      ko: |-
        귀에서 발생하는 초음파로
        거대한 바위도 분쇄한다.
        어둠을 틈타 공격한다.
      en: |-
        The ultrasonic waves it emits from its ears
        can reduce a large boulder to pebbles.
        It swoops out of the dark to attack.
      fr: |-
        Il peut littéralement pulvériser de gros rochers grâce
        aux ultrasons émis par ses oreilles. Il surgit des ténèbres
        pour attaquer par surprise.
      de: |-
        Die Ultraschallwellen aus seinen Ohren zermalmen Felsen zu
        kleinen Kieseln. Greift stets im Schutz der Dunkelheit an.
      es: |-
        Las ondas ultrasónicas que emite por las orejas pueden hacer
        añicos incluso rocas enormes. Aprovecha la oscuridad para
        desplegar su ataque.
      it: |-
        Grazie agli ultrasuoni che emette dalle orecchie, è in grado
        di sbriciolare enormi massi. Attacca col favore dell’oscurità.
    ultra-sun:
      ja-Hrkt: |-
        らんぼうな　せいしつだが　こうぶつの
        じゅくした　くだものを　あげると
        てのひらを　かえしたように　なつく。
      ja: |-
        乱暴な　性質だが　好物の
        熟した　果物を　あげると
        手のひらを　返したように　懐く。
      ko: |-
        성질은 난폭하지만 좋아하는
        잘 익은 과일을 주면
        언제 그랬냐는 듯이 잘 따른다.
      zh-Hant: |-
        性情粗暴，但如果給牠
        愛吃的成熟水果，牠就會
        改頭換面似地變得很親近人。
      zh-Hans: |-
        性格粗暴，但如果给它
        喜爱吃的成熟水果，
        就会一反常态，变得很亲切。
      en: |-
        Although it has a violent disposition, if you give
        it a nice ripe fruit that it loves, Noivern will
        suddenly become tame.
      fr: |-
        D’ordinaire violent, il vous mange littéralement
        dans la main si vous lui donnez des fruits mûrs,
        son mets favori.
      de: |-
        Es ist von Natur aus brutal. Gibt man ihm jedoch
        seine Leibspeise, reifes Obst, ist es plötzlich
        wie ausgewechselt und wird zahm.
      es: |-
        Es de carácter violento, pero si se le da su
        alimento favorito, una fruta madura, su actitud
        cambia totalmente y se muestra muy dócil.
      it: |-
        È di indole aggressiva, ma se qualcuno gli
        offre i frutti maturi di cui va matto cambia
        completamente atteggiamento e diventa docile.
    ultra-moon:
      ja-Hrkt: |-
        いわも　くだく　ちょうおんぱで　めに
        はいる　もの　すべてに　こうげきを
        しかける　ちのけのおおい　ポケモン。
      ja: |-
        岩も　砕く　超音波で　目に
        入る　もの　すべてに　攻撃を
        仕掛ける　血の気の多い　ポケモン。
      ko: |-
        바위도 부수는 초음파로
        눈에 들어오는 모든 것에 공격을
        가하는 혈기가 왕성한 포켓몬.
      zh-Hant: |-
        會用連岩石都能粉碎的超音波
        朝目光所及的一切發動攻擊，
        是種性情暴躁的寶可夢。
      zh-Hans: |-
        用岩石都能粉碎的超音波
        将目光所及之处全都攻击一番，
        是血气方刚的宝可梦。
      en: |-
        This hot-blooded Pokémon attacks anything it
        sees with ultrasonic waves that can
        crush boulders.
      fr: |-
        Ce Pokémon sanguinaire attaque tout ce qui
        entre dans son champ de vision avec ses
        ultrasons capables de pulvériser des rochers.
      de: |-
        Dieses heißblütige Pokémon, das mithilfe von
        Ultraschallwellen Felsen zermalmen kann, greift
        alles an, was ihm unter die Augen kommt.
      es: |-
        De temperamento violento, ataca a todo el que
        se cruce en su camino con unas ondas
        ultrasónicas capaces de partir rocas.
      it: |-
        È un Pokémon aggressivo che attacca tutto ciò
        che incontra sul suo cammino con ultrasuoni
        così potenti da frantumare anche i massi.
    sword:
      ja-Hrkt: |-
        くらやみで　なにも　できない　てきを
        ねんいりに　いためつける。　ちのけが
        おおく　ざんにんな　せいしつ。
      ja: |-
        暗闇で　なにも　できない　敵を
        念入りに　痛めつける。　血の気が
        多く　残忍な　性質。
      ko: |-
        어두워서 아무것도 할 수 없는 상대를
        무자비하게 공격한다. 혈기왕성하고
        잔인한 성질을 가졌다.
      zh-Hant: |-
        會對在黑暗中無計可施的
        對手痛加打擊。
        好勇鬥狠，性情殘忍。
      zh-Hans: |-
        会对在黑暗中无计可施的
        对手痛加打击。
        好勇斗狠，性格残忍。
      en: |-
        Aggressive and cruel, this Pokémon will ruthlessly
        torment enemies that are helpless in the dark.
      fr: |-
        Il n’hésite pas à anéantir ses pauvres adversaires
        qui se retrouvent sans défense dans les ténèbres.
        Il est d’une nature cruelle et impulsive.
      de: |-
        Ein heißblütiges und brutales Pokémon. Es fügt
        seinen in der Dunkelheit wehrlosen Gegnern
        gnadenlos Verletzungen zu.
      es: |-
        Posee un carácter violento y cruel, por lo que no
        muestra reparos en aprovechar la oscuridad para
        atacar a enemigos indefensos.
      it: |-
        Non esita ad attaccare i nemici che vagano
        spaesati e indifesi nelle tenebre. Ha una natura
        impetuosa e brutale.
    shield:
      ja-Hrkt: |-
        くらやみを　とびながら　いわをも
        くだく　ちょうおんぱで　いためつけ
        するどい　キバで　とどめを　さす。
      ja: |-
        暗闇を　飛びながら　岩をも
        砕く　超音波で　痛めつけ
        鋭い　キバで　とどめを　刺す。
      ko: |-
        어둠 속을 날아다니며 바위도
        부수는 초음파로 타격을 입힌 뒤
        예리한 이빨로 숨통을 끊는다.
      zh-Hant: |-
        在黑暗中一邊飛行一邊發出
        能粉碎岩石的超音波痛擊敵人，
        然後用利齒給予致命的一擊。
      zh-Hans: |-
        在黑暗中一边飞行一边发出
        能粉碎岩石的超音波痛击敌人，
        然后用利齿给予致命的一击。
      en: |-
        Flying through the darkness, it weakens enemies
        with ultrasonic waves that could crush stone.
        Its fangs finish the fight.
      fr: |-
        Il plane dans les ténèbres, blessant ses ennemis
        à coups d’ultrasons pouvant briser des rochers
        avant de les achever de ses crocs acérés.
      de: |-
        Es fliegt durch die Dunkelheit und verletzt Feinde
        mit Ultraschallwellen, die auch Felsen zermalmen
        können. Dann erledigt es sie mit spitzen Zähnen.
      es: |-
        Vuela en la oscuridad atormentando al enemigo
        con ondas ultrasónicas capaces de partir rocas
        antes de rematarlo con sus afilados colmillos.
      it: |-
        Vola nell’oscurità ferendo gli avversari con
        ultrasuoni in grado di frantumare anche i massi,
        per poi finirli con i suoi denti affilati.
