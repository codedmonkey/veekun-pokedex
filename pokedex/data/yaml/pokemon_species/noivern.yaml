        くらやみの　たたかいでは　むてきだ。
      ja: |-
        月明かりすら　ない　闇夜を　飛び
        油断している　獲物を　襲う。
        暗闇の　戦いでは　無敵だ。
      ko: |-
        달빛조차 없는 어둠 속을 날며
        방심하고 있는 사냥감을 덮친다.
        어둠 속의 싸움에서는 무적이다.
      en: |-
