noivern:
  base_happiness: 50
  capture_rate: 45
  color: purple
  egg_groups:
    - flying
    - dragon
  evolution_chain: noibat
  evolves_from: noibat
  flavor_text:
    x:
      ja-Hrkt: |-
        つきあかりすら　ない　やみよを　とび
        ゆだんしている　えものを　おそう。
        くらやみの　たたかいでは　むてきだ。
      ja: |-
        月明かりすら　ない　闇夜を　飛び
        油断している　獲物を　襲う。
        暗闇の　戦いでは　無敵だ。
      ko: |-
        달빛조차 없는 어둠 속을 날며
        방심하고 있는 사냥감을 덮친다.
        어둠 속의 싸움에서는 무적이다.
      en: |-
        They fly around on moonless nights
        and attack careless prey. Nothing can
        beat them in a battle in the dark.
      fr: |-
        Les nuits sans lune, il quadrille le ciel à la recherche
        d’une proie. Dans l’obscurité, aucun Pokémon ne peut
        rivaliser avec lui.
      de: |-
        Es fliegt in finsterer, mondloser Nacht umher
        und macht Jagd auf achtlose Beute.
        Ist bei Dunkelheit jedem Gegner überlegen.
      es: |-
        Surca el cielo nocturno cuando ni siquiera la luna brilla
        y ataca a presas incautas. Es imbatible en combates
        que tienen lugar a oscuras.
      it: |-
        Vola nelle notti senza luna e attacca le prede
        approfittando di ogni loro minima distrazione.
        Nell’oscurità è invincibile.
    'y':
      ja-Hrkt: |-
        みみから　はっする　ちょうおんぱで
        きょだいな　いわも　ふんさいする。
        くらやみに　まぎれて　おそいかかる。
      ja: |-
        耳から　発する　超音波で
        巨大な　岩も　粉砕する。
        暗闇に　紛れて　襲いかかる。
      ko: |-
        귀에서 발생하는 초음파로
        거대한 바위도 분쇄한다.
        어둠을 틈타 공격한다.
      en: |-
        The ultrasonic waves it emits from its ears
        can reduce a large boulder to pebbles.
        It swoops out of the dark to attack.
      fr: |-
        Il peut littéralement pulvériser de gros rochers
        grâce aux ultrasons émis par ses oreilles.
        Il surgit des ténèbres pour attaquer par surprise.
      de: |-
        Die Ultraschallwellen aus seinen Ohren zermalmen
        Felsen zu kleinen Kieseln. Greift stets im Schutz der
        Dunkelheit an.
      es: |-
        Las ondas ultrasónicas que emite por las orejas
        pueden hacer añicos incluso rocas enormes.
        Aprovecha la oscuridad para desplegar su ataque.
      it: |-
        Grazie agli ultrasuoni che emette dalle orecchie, è in
        grado di sbriciolare enormi massi. Attacca col favore
        dell’oscurità.
    omega-ruby:
      ja-Hrkt: |-
        つきあかりすら　ない　やみよを　とび
