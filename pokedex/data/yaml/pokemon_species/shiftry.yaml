shiftry:
  base_happiness: 50
  capture_rate: 45
  color: brown
  egg_groups:
    - ground
    - plant
  evolution_chain: seedot
  evolves_from: nuzleaf
  flavor_text:
    ruby:
      en: |-
        SHIFTRY is a mysterious POKéMON that
        is said to live atop towering trees 
        dating back over a thousand years.It creates terrific windstorms with
        the fans it holds.
    sapphire:
      en: |-
        SHIFTRY’s large fans generate awesome
        gusts of wind at a speed close to 100
        feet per second. The whipped-up windblows anything away.
        This POKéMON chooses to live quietly
        deep in forests.
    emerald:
      en: |-
        It is said to arrive on chilly, wintry winds.
        Feared from long ago as the guardian of
        forests, this POKéMON lives in a deep
        forest where people do not venture.
    firered:
      en: |-
        A POKéMON that was feared as a forest
        guardian. It can read the foe’s mind and
        take preemptive action.
    leafgreen:
      en: |-
        A POKéMON that was feared as a forest
        guardian. It can read the foe’s mind and
        take preemptive action.
    diamond:
      en: |-
        By flapping its leafy fan, it can
        whip up gusts of 100 ft/second
        that can level houses.
    pearl:
      en: |-
        By flapping its leafy fan, it can
        whip up gusts of 100 ft/second
        that can level houses.
    platinum:
      en: |-
        By flapping its leafy fan, it can
        whip up gusts of 100 ft/second
        that can level houses.
    heartgold:
      en: |-
        It lives quietly in the deep forest.
        It is said to create chilly winter
        winds with the fans it holds.
    soulsilver:
      en: |-
        It lives quietly in the deep forest.
        It is said to create chilly winter
        winds with the fans it holds.
    black:
      en: |-
        By flapping its leafy fan, it can
        whip up gusts of 100 ft/second
        that can level houses.
      fr: |-
        D’un coup de sa feuille éventail, il
        génère des bourrasques de 30 m/s
        capables de souffler une maison.
    white:
      en: |-
        By flapping its leafy fan, it can
        whip up gusts of 100 ft/second
        that can level houses.
      fr: |-
        D’un coup de sa feuille éventail, il
        génère des bourrasques de 30 m/s
        capables de souffler une maison.
    black-2:
      en: |-
        By flapping its leafy fan, it can
        whip up gusts of 100 ft/second
        that can level houses.
    white-2:
      en: |-
        By flapping its leafy fan, it can
        whip up gusts of 100 ft/second
        that can level houses.
    x:
      ja-Hrkt: |-
        もりの　かみさまと　おそれられていた
        ポケモン。あいての　かんがえを　よみ
        さきまわりする　のうりょくを　もつ。
      ja: |-
        森の　神様と　恐れられていた
        ポケモン。相手の　考えを　読み
        先回りする　能力を　持つ。
      ko: |-
        숲의 신이라고 여겨져 두려움의
        대상이 되고 있던 포켓몬. 상대의
        생각을 읽고 앞지르는 능력을 지녔다.
      en: |-
        A Pokémon that was feared as a forest guardian.
        It can read the foe’s mind and take
        preemptive action.
      fr: |-
        Ce Pokémon est le gardien des forêts. Il peut lire
        les pensées de ses ennemis et agir en conséquence.
      de: |-
        Dieses Pokémon wurde als Wächter des Waldes
        gefürchtet. Es kann die Gedanken des Gegners
        lesen und präventiv handeln.
      es: |-
        Habita los bosques y se le tiene miedo. Es capaz
        de leer los pensamientos del rival y actuar en
        consecuencia.
      it: |-
        Un tempo era un temuto guardiano della foresta.
        Sa leggere nella mente del nemico, anticipandolo.
    'y':
      ja-Hrkt: |-
        はっぱの　うちわを　あおぐと
        ふうそく３０メートルの　とっぷうが
        まきおこり　みんかを　ふきとばす。
      ja: |-
        葉っぱの　ウチワを　あおぐと
        風速３０メートルの　突風が
        巻き起こり　民家を　吹き飛ばす。
      ko: |-
        잎사귀 부채를 부치면
        풍속 30m의 돌풍이 일어나
        민가를 날려버린다.
      en: |-
        By flapping its leafy fan, it can whip up gusts of
        100 feet per second that can level houses.
      fr: |-
        D’un coup de sa feuille éventail, il génère des
        bourrasques de 30 m/s capables de souffler une
        maison.
      de: |-
        Seine großen Fächer erzeugen Böen, die eine
        Geschwindigkeit von 30 m/s erreichen können.
      es: |-
        Con sus abanicos puede provocar vientos de 30 m/s
        capaces de levantar casas.
      it: |-
        Con le sue foglie provoca raffiche di vento della
        velocità di 30 m/s che spazzano via interi edifici.
    omega-ruby:
      ja-Hrkt: |-
        じゅれい　１０００ねんを　こえた　たいぼくの
        てっぺんに　すむと　いわれる　なぞの　ポケモン。
        はっぱの　うちわで　きょうふうを　まきおこす。
      ja: |-
        樹齢　１０００年を　超えた　大木の
        てっぺんに　すむと　いわれる　謎の　ポケモン。
        葉っぱの　団扇で　強風を　巻き起こす。
      ko: |-
        수령 1000년을 넘은 큰 나무 꼭대기에
        산다고 전해지는 불가사의한 포켓몬이다.
        잎사귀 부채로 강풍을 일으킨다.
      en: |-
        Shiftry is a mysterious Pokémon that is said to live atop
        towering trees dating back over a thousand years. It creates
        terrific windstorms with the fans it holds.
      fr: |-
        Tengalice est un mystérieux Pokémon vivant dans les cimes
        d’immenses arbres, vieux de plus de mille ans. Il peut créer
        de formidables tempêtes grâce à ses éventails.
      de: |-
        Tengulist ist ein geheimnisvolles Pokémon, das angeblich
        auf hohen Bäumen lebt, die Tausende von Jahren alt sind.
        Mit den Blätterfächern an seinen Händen kann es heftige
        Stürme erzeugen.
      es: |-
        Shiftry es un enigmático Pokémon que vive, dicen, en las
        copas de los árboles milenarios. Este Pokémon genera fuertes
        corrientes de aire con los abanicos que lleva en las manos.
      it: |-
        Shiftry è un misterioso Pokémon che vive sulla cima degli
        alberi più alti, di solito plurisecolari. Usa le foglie degli arti
        superiori come ventole per generare terribili raffiche di vento.
    alpha-sapphire:
      ja-Hrkt: |-
        おおきな　うちわは　ふうそく　３０メートルの
        きょうふうを　おこし　なんでも　ふきとばす。
        もりの　おくで　ひっそり　くらす　ポケモンだ。
      ja: |-
        大きな　団扇は　風速　３０メートルの
        強風を　起こし　なんでも　吹き飛ばす。
        森の　奥で　ひっそり　暮らす　ポケモンだ。
      ko: |-
        큰 부채는 풍속 30m의
        강풍을 일으켜 무엇이든 날려버린다.
        숲 속 깊은 곳에서 조용히 사는 포켓몬이다.
      en: |-
        Shiftry’s large fans generate awesome gusts of wind at a
        speed close to 100 feet per second. The whipped-up wind
        blows anything away. This Pokémon chooses to live quietly
        deep in forests.
      fr: |-
        Les grands éventails de Tengalice peuvent déclencher
        des bourrasques de vent allant jusqu’à 30 m/s. Le vent
        déchaîné peut tout envoyer balader. Ce Pokémon a choisi
        de vivre tranquillement dans la forêt.
      de: |-
        Tengulists große Fächer erzeugen Böen, die eine
        Geschwindigkeit von 30 m/s erreichen können und
        alles und jeden hinwegfegen können. Dieses Pokémon
        lebt still und zurückgezogen in den Tiefen der Wälder.
      es: |-
        Las grandes manos con forma de hoja que tiene Shiftry
        generan grandes corrientes de aire que pueden alcanzar
        30 m/s y barrer lo que sea. Este Pokémon opta por vivir
        tranquilo en medio del bosque.
      it: |-
        Le grandi ventole di Shiftry generano forti raffiche di vento
        alla velocità di 30 metri al secondo. La violenza del vento
        spazza via ogni cosa. Vive pacifico nel cuore della foresta.
    sword:
      ja-Hrkt: |-
        もりの　かみさまと　おそれられていた
        ポケモン。　あいての　かんがえを　よみ
        さきまわりする　のうりょくを　もつ。
      ja: |-
        森の　神様と　恐れられていた
        ポケモン。　相手の　考えを　読み
        先回りする　能力を　もつ。
      ko: |-
        숲의 신이라고 여겨져 두려움의
        대상이었던 포켓몬. 상대의 생각을 읽고
        앞서 행동하는 능력을 지녔다.
      zh-Hant: |-
        過去被視為森林之神而受到畏懼的
        寶可夢。有著讀取對手想法並
        搶先一步行動的能力。
      zh-Hans: |-
        过去被敬畏为森林之神的宝可梦。
        有着读取对手想法并
        抢先一步行动的能力。
      en: |-
        A Pokémon that was feared as a forest guardian.
        It can read the foe’s mind and take
        preemptive action.
      fr: |-
        Ce gardien des forêts inspirait la crainte.
        Il peut lire les pensées de ses ennemis et agir
        en conséquence.
      de: |-
        Dieses Pokémon wurde als „Wächter des Waldes“
        gefürchtet. Es kann die Gedanken des Gegners
        lesen und präventiv handeln.
      es: |-
        Infundía temor por su condición de guardián de
        los bosques. Es capaz de leer los pensamientos
        del rival y actuar en consecuencia.
      it: |-
        Un tempo era un temuto guardiano della foresta.
        Sa leggere nella mente del nemico anticipandolo.
    shield:
      ja-Hrkt: |-
        もりの　おくで　ひっそりと　くらす。
        おおきな　うちわを　あおぐと
        こがらしが　ふくと　いわれている。
      ja: |-
        森の　奥で　ひっそりと　暮らす。
        大きな　団扇を　あおぐと
        木枯らしが　吹くと　いわれている。
      ko: |-
        숲속에서 조용히 지낸다.
        큰 부채로 부치면
        쌀쌀한 바람이 분다고 한다.
      zh-Hant: |-
        在森林深處靜靜地生活。
        據說當牠搧動大大的團扇，
        就會刮起冬日寒風。
      zh-Hans: |-
        在森林深处静静地生活。
        据说当它扇动大大的团扇，
        就会刮起冬日寒风。
      en: |-
        It lives quietly in the deep forest. It is said to
        create chilly winter winds with the fans it holds.
      fr: |-
        Il vit caché au fond des forêts.
        On raconte qu’il fait souffler la bise
        lorsqu’il agite ses grands éventails.
      de: |-
        Es lebt in den einsamen Tiefen der Wälder. Man
        sagt, wenn es seine großen Fächer schwingt,
        jagen eisige Windböen über das Land.
      es: |-
        Vive sigiloso en lo más profundo del bosque.
        Se dice que con sus abanicos puede generar
        vientos gélidos.
      it: |-
        Vive nella calma delle foreste. Si dice che sia
        in grado di creare raffiche di vento gelido
        agitando i suoi grandi ventagli.
