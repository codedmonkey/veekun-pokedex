chandelure:
  base_happiness: 50
  capture_rate: 45
  color: black
  egg_groups:
    - indeterminate
  evolution_chain: litwick
  evolves_from: lampent
  flavor_text:
    black:
      en: |-
        It absorbs a spirit, which it then burns.
        By waving the flames on its arms,
        it puts its foes into a hypnotic trance.
      fr: |-
        Il brûle en aspirant les âmes, et
        hypnotise ses ennemis en faisant
        osciller les flammes de ses bras.
    white:
      en: |-
        Being consumed in Chandelure’s flame
        burns up the spirit, leaving the
        body behind.
      fr: |-
        Les victimes des flammes de Lugulabre
        voient leur âme aspirée jusqu’à ce que
        leur corps ne soit plus que coquille vide.
    black-2:
      en: |-
        The spirits burned up in its
        ominous flame lose their way
        and wander this world forever.
    white-2:
      en: |-
        The spirits burned up in its
        ominous flame lose their way
        and wander this world forever.
    x:
      ja-Hrkt: |-
        シャンデラの　ほのおに　つつまれると
        たましいが　すいとられ　もやされる。
        ぬけがらの　からだ　だけが　のこる。
      ja: |-
        シャンデラの　炎に　包まれると
        魂が　吸い取られ　燃やされる。
        抜け殻の　体　だけが　残る。
      ko: |-
        샹델라의 불꽃에 둘러싸이면
        영혼이 빨려가 불타버린다.
        빈 껍데기인 몸만 남는다.
      en: |-
        Being consumed in Chandelure’s flame burns up
        the spirit, leaving the body behind.
      fr: |-
        Les victimes des flammes de Lugulabre voient leur
        âme aspirée jusqu’à ce que leur corps ne soit plus
        que coquille vide.
      de: |-
        Es saugt die Seele eines jeden auf, der in seinen
        Feuerkranz gerät, bis nur noch eine leere Hülle von
        ihm übrig ist.
      es: |-
        Sus llamas absorben el alma del enemigo y la abrasan,
        dejando solo su cuerpo inerte.
      it: |-
        Le fiamme di Chandelure risucchiano lo spirito e
        lasciano il corpo come un guscio vuoto.
    'y':
      ja-Hrkt: |-
        あやしげな　ほのおで　もやされた
        たましいは　いきばを　なくし
        この　よを　えいえんに　さまよう。
      ja: |-
        怪しげな　炎で　燃やされた
        魂は　行き場を　なくし
        この　世を　永遠に　さまよう。
      ko: |-
        괴상한 불꽃으로 태워진
        영혼은 갈 곳을 잃고
        이승을 영원히 헤맨다.
      en: |-
        The spirits burned up in its ominous flame lose their
        way and wander this world forever.
      fr: |-
        Les âmes consumées par ses flammes étranges
        sont condamnées à l’errance pour l’éternité.
      de: |-
        Seelen, die das Feuer seiner schaurigen Flammen
        gekostet haben, irren bis ans Ende der Tage ziellos
        durch diese Welt.
      es: |-
        Las almas que han ardido bajo sus oscuras llamas
        vagan sin rumbo y eternamente por este mundo.
      it: |-
        Le anime bruciate dalle sue fiamme cupe perdono
        la strada e rimangono a vagare in questo mondo
        per l’eternità.
    omega-ruby:
      ja-Hrkt: |-
        シャンデラの　ほのおに　つつまれると
        たましいが　すいとられ　もやされる。
        ぬけがらの　からだ　だけが　のこる。
      ja: |-
        シャンデラの　炎に　包まれると
        魂が　吸い取られ　燃やされる。
        抜け殻の　体　だけが　残る。
      ko: |-
        샹델라의 불꽃에 둘러싸이면
        영혼이 빨려가 불타버린다.
        빈 껍데기인 몸만 남는다.
      en: |-
        Being consumed in Chandelure’s flame burns up
        the spirit, leaving the body behind.
      fr: |-
        Les victimes des flammes de Lugulabre voient leur âme aspirée
        jusqu’à ce que leur corps ne soit plus que coquille vide.
      de: |-
        Es saugt die Seele eines jeden auf, der in seinen Feuerkranz
        gerät, bis nur noch eine leere Hülle von ihm übrig ist.
      es: |-
        Sus llamas absorben el alma del enemigo y la abrasan,
        dejando solo su cuerpo inerte.
      it: |-
        Le fiamme di Chandelure risucchiano lo spirito e lasciano
        il corpo come un guscio vuoto.
    alpha-sapphire:
      ja-Hrkt: |-
        あやしげな　ほのおで　もやされた
        たましいは　いきばを　なくし
        この　よを　えいえんに　さまよう。
      ja: |-
        怪しげな　炎で　燃やされた
        魂は　行き場を　なくし
        この　世を　永遠に　さまよう。
      ko: |-
        괴상한 불꽃으로 태워진
        영혼은 갈 곳을 잃고
        이승을 영원히 헤맨다.
      en: |-
        The spirits burned up in its ominous flame lose their
        way and wander this world forever.
      fr: |-
        Les âmes consumées par ses flammes étranges sont
        condamnées à l’errance pour l’éternité.
      de: |-
        Seelen, die das Feuer seiner schaurigen Flammen gekostet
        haben, irren bis ans Ende der Tage ziellos durch diese Welt.
      es: |-
        Las almas que han ardido bajo sus oscuras llamas vagan sin
        rumbo y eternamente por este mundo.
      it: |-
        Le anime bruciate dalle sue fiamme cupe perdono la strada
        e rimangono a vagare in questo mondo per l’eternità.
    sword:
      ja-Hrkt: |-
        ふるびた　ようかんに　すみつく。
        うでの　ほのおを　あやしく　ゆらし
        あいてを　さいみんに　かけるぞ。
      ja: |-
        古びた　洋館に　棲みつく。
        腕の　炎を　妖しく　揺らし
        相手を　催眠に　かけるぞ。
      ko: |-
        오래된 양옥집에 산다.
        팔의 불꽃을 이상하게 흔들어서
        상대에게 최면을 건다.
      zh-Hant: |-
        住在古老的洋樓裡。
        詭異地搖晃手臂上的火焰，
        以此來催眠對手。
      zh-Hans: |-
        住在古老的洋楼里。
        诡异地摇晃手臂上的火焰，
        以此来催眠对手。
      en: |-
        This Pokémon haunts dilapidated mansions.
        It sways its arms to hypnotize opponents with
        the ominous dancing of its flames.
      fr: |-
        Il s’installe dans les résidences anciennes.
        Pour hypnotiser son adversaire, il agite
        les flammes de ses bras de manière inquiétante.
      de: |-
        Dieses Pokémon bewohnt gerne alte Anwesen. Es
        hypnotisiert seine Opfer, indem es die Flammen
        an seinen Armen auf unheimliche Weise schwenkt.
      es: |-
        Establece su morada en edificios antiguos.
        Mece las llamas de los brazos de forma siniestra
        para hipnotizar a sus enemigos.
      it: |-
        Infesta vecchie case. Ipnotizza l’avversario
        facendo tremolare le fiammelle sugli arti.
    shield:
      ja-Hrkt: |-
        シャンデラを　あかりの　かわりに
        していた　やしきでは　そうしきが
        たえることが　なかった　という。
      ja: |-
        シャンデラを　灯りの　かわりに
        していた　屋敷では　葬式が
        絶えることが　なかった　という。
      ko: |-
        샹델라를 등불 대용으로
        사용했던 저택에서는 장례식이
        끊이지 않았다고 한다.
      zh-Hant: |-
        據說在用水晶燈火靈
        來充當照明設備的房子裡，
        喪事會接連不斷。
      zh-Hans: |-
        据说在用水晶灯火灵
        来充当照明设备的房子里，
        丧事会接连不断。
      en: |-
        In homes illuminated by Chandelure instead of
        lights, funerals were a constant occurrence—
        or so it’s said.
      fr: |-
        On raconte que dans les manoirs éclairés
        par des Lugulabre, les funérailles s’enchaînent
        sans discontinuer.
      de: |-
        Angeblich soll früher in Häusern, wo Skelabra zur
        Beleuchtung verwendet wurden, eine Beerdigung
        auf die andere gefolgt sein.
      es: |-
        Cuentan que, en las mansiones donde se usaba
        para la iluminación, los funerales se sucedían de
        forma incesante.
      it: |-
        Si dice che nelle ville in cui i Chandelure erano
        utilizzati al posto dei lampadari i funerali
        si susseguissero senza sosta.
