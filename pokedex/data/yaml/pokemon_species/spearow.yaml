    sun:
      ja-Hrkt: |-
        ハネが　みじかく　とぶのは　にがて。
        せわしなく　うごきまわり　くさむらの
        むしポケモンを　ついばんでいる。
      ja: |-
        ハネが　短く　飛ぶのは　やや苦手。
        せわしなく　動き回り　草むらの
        むしポケモンを　ついばんでいる。
      ko: |-
        날개가 짧아 나는 것이 서툴다.
        쉴 새 없이 움직이며 풀숲의
        벌레포켓몬을 쪼아대고 있다.
      zh-Hant: |-
        翅膀很短，不太擅長飛行。
        總是忙碌地來回走動，
        啄食草叢裡的蟲寶可夢。
      zh-Hans: |-
        翅膀很短，飞行也不大在行。
        忙忙碌碌地来回走动，
        啄食草丛里的虫宝可梦。
      en: |-
        Its short wings make it inept at flying.
        It moves about hurriedly and pecks at
        Bug-type Pokémon in the tall grass.
      fr: |-
        Ses petites ailes le handicapent pour voler.
        Il préfère se déplacer en hâte et piquer les
        Pokémon Insecte dans les hautes herbes.
      de: |-
        Es kann nicht gut fliegen, da seine Flügel sehr
        kurz sind. Es rennt wild durch hohes Gras, um
        Käfer-Pokémon aufzupicken.
      es: |-
        Sus alas cortas hacen que no se le dé muy bien
        volar. Corretea apresuradamente, picoteando los
        Pokémon insecto que se encuentre en la hierba.
      it: |-
        A causa delle ali troppo corte, non riesce a
        volare bene. Scorrazza tra l’erba alta alla ricerca
        di Pokémon Coleottero da beccare.
    moon:
      ja-Hrkt: |-
        しょくよくおうせいで　よく　たべる。
        むしポケモンに　なやむ　のうかは
        オニスズメを　たいせつに　する。
      ja: |-
        食欲旺盛で　よく　食べる。
        むしポケモンに　悩む　農家は
        オニスズメを　大切に　する。
      ko: |-
        식욕이 왕성해서 잘 먹는다.
        벌레포켓몬으로 고생하는 농가에서는
        깨비참을 소중히 여긴다.
      zh-Hant: |-
        食欲旺盛所以很會吃。
        因蟲寶可夢而煩惱的農戶
        對烈雀非常重視。
      zh-Hans: |-
        食欲旺盛而吃得很多。
        因虫宝可梦而烦恼的农户
        对烈雀非常重视。
      en: |-
        Farmers whose fields are troubled by bug
        Pokémon appreciate Spearow for its vigorous
        appetite and look after it.
      fr: |-
        Il est doté d’un appétit insatiable.
        Les fermiers assaillis par des Pokémon Insecte
        prennent grand soin des Piafabec.
      de: |-
        Bauern, deren Felder von Käfer-Pokémon
        befallen sind, schätzen Habitak wegen seines
        unstillbaren Appetits ganz besonders.
      es: |-
        Tiene un apetito voraz y come con frecuencia.
        En las granjas crían Spearow para combatir
        plagas de Pokémon insecto.
      it: |-
        Ha sempre un grande appetito.
        È molto amato dagli agricoltori perché tiene
        a bada i Pokémon di tipo Coleottero.
    ultra-sun:
      ja-Hrkt: |-
        じぶんのテリトリーを　まもるためなら
        おおきな　ポケモンが　あいてでも
        むかっていく　むこうみずな　せいしつ。
      ja: |-
        自分のテリトリーを　守るためなら
        大きな　ポケモンが　相手でも
        向かっていく　向こう見ずな　性質。
      ko: |-
        자신의 영역을 지키기 위해서라면
        상대가 큰 포켓몬이라도
        덤벼드는 무모한 성질을 가졌다.
      zh-Hant: |-
        生性魯莽衝動，
        只要是為了守護自己的地盤，
        即使對手是大型寶可夢也會正面迎戰。
      zh-Hans: |-
        生性鲁莽，只要是为了保护
        自己的领地，即便对手是
        大型宝可梦，也仍会冲向对手。
      en: |-
        Its reckless nature leads it to stand up to
        others—even large Pokémon—if it has to protect
        its territory.
      fr: |-
        Un Pokémon téméraire qui n’hésite pas
        à affronter des Pokémon plus gros que lui
        pour protéger son territoire.
      de: |-
        Wenn es um die Verteidigung seines Reviers
        geht, schreckt das draufgängerische Habitak
        selbst vor großen Pokémon nicht zurück.
      es: |-
        Su temperamento temerario hace que no dude
        en enfrentarse a rivales mucho más grandes
        a la hora de defender su territorio.
      it: |-
        Temerario di natura, per difendere il proprio
        territorio non esita a lanciarsi anche contro
        avversari più grandi di lui.
    ultra-moon:
      ja-Hrkt: |-
        ハネが　みじかく　ながい　きょりを
        とべない。　せわしなく　うごき
        まわって　むしポケモンを　ついばむ。
      ja: |-
        羽が　短く　長い　距離を
        飛べない。　せわしなく　動き
        まわって　むしポケモンを　ついばむ。
      ko: |-
        날개가 짧아서 먼 거리를
        날지 못한다. 쉴 새 없이 움직이며
        벌레포켓몬을 쪼아 댄다.
      zh-Hant: |-
        翅膀很短，無法長距離飛行。
        總是不停地四處跳來跳去，
        忙著啄食蟲寶可夢。
      zh-Hans: |-
        翅膀短，无法飞远。
        会跳来跳去忙个不停地
        啄食虫宝可梦。
      en: |-
        Due to its short wings, it can’t fly long
        distances. It wanders about restlessly and
        pecks at bug Pokémon.
      fr: |-
        Ses courtes ailes ne lui permettent pas de
        voler sur de longues distances. Il quadrille
        son territoire pour picorer les Pokémon Insecte.
      de: |-
        Aufgrund seiner kurzen Flügel kann es keine
        langen Strecken fliegen. Es rennt wild durch
        die Gegend, um Käfer-Pokémon aufzupicken.
      es: |-
        Sus cortas alas le impiden volar grandes
        distancias, por lo que revolotea inquieto y
        picotea a todo Pokémon insecto que ve.
      it: |-
        A causa delle ali troppo corte, non riesce a
        volare per lunghe distanze. Scorrazza qua e là
        alla ricerca di Pokémon Coleottero da beccare.
    lets-go-pikachu:
      ja-Hrkt: |-
        たかく　とぶのは　にがて。
        なわばりを　まもるために
        もうスピードで　とびまわっている。
      ja: |-
        高く　飛ぶのは　苦手。
        縄張りを　守るために
        猛スピードで　飛びまわっている。
      ko: |-
        높이 나는 것에 서투르다.
        영역을 지키기 위해
        맹렬한 스피드로 날아다닌다.
      zh-Hant: |-
        不擅長高空飛行。
        會以超高速在地盤裡四處盤旋，
        確保自己的地盤不被侵犯。
      zh-Hans: |-
        不擅长高空飞行。
        会以超高速在地盘里四处盘旋，
        以保护自己的地盘不被侵犯。
      en: |-
        Inept at flying high. However, it can fly around
        very fast to protect its territory.
      fr: |-
        Il est incapable de voler à haute altitude.
        Il se déplace très vite pour protéger
        son territoire.
      de: |-
        In großen Höhen fällt ihm das Fliegen schwer.
        Allerdings kann es pfeilschnell umherflitzen,
        wenn es um den Schutz seines Habitats geht.
      es: |-
        A la hora de proteger su territorio, compensa su
        incapacidad para volar a gran altura con una
        increíble velocidad.
      it: |-
        Incapace di raggiungere alte quote, sorvola
        il suo territorio a gran velocità per proteggerlo.
    lets-go-eevee:
      ja-Hrkt: |-
