        Il peut survivre un an sans manger.
    black-2:
      en: |-
        It lives in arid regions and
        can go without food for a year
        while waiting for prey.
    white-2:
      en: |-
        It lives in arid regions and
        can go without food for a year
        while waiting for prey.
    x:
      ja-Hrkt: |-
        しっぽの　ツメで　えものを　はさみ
        どくを　おくりこむ。どくが　きくまで
        ぜったいに　はなさない　しゅうねん。
      ja: |-
        尻尾の　ツメで　獲物を　挟み
        毒を　送りこむ。毒が　効くまで
        絶対に　放さない　執念。
      ko: |-
        꼬리의 발톱으로 먹이를 집어
        독을 주입한다. 독이 퍼질 때까지
        절대 놓치지 않는 집념이 있다.
      en: |-
        It grips prey with its tail claws and injects poison.
        It tenaciously hangs on until the poison takes.
      fr: |-
        Il saisit sa proie avec les pinces de sa queue, lui
        injecte un poison et la retient jusqu’à ce qu’il agisse.
      de: |-
        Es greift seine Beute mit den Krallen an seinem
        Schweif und vergiftet sie. Dann wartet es ab...
      es: |-
        Agarra a sus presas con las pinzas de la cola y les
        inyecta veneno. Espera hasta que hace efecto.
      it: |-
        Afferra le prede con gli artigli della coda e non si
        allontana finché il veleno che inietta non agisce.
    'y':
      ja-Hrkt: |-
        すなの　なかに　かくれて　えものを
        まちぶせする。しっぽの　ツメから
        どくを　だして　えものを　しとめる。
      ja: |-
        砂の　中に　隠れて　獲物を
        待ち伏せする。尻尾の　ツメから
        毒を　出して　獲物を　しとめる。
      ko: |-
        모래 속에 숨어 먹이를
        기다리고 있다. 꼬리의 발톱에서
        독을 내서 먹이를 꼼짝 못하게 한다.
      en: |-
        It burrows under the sand to lie in wait for prey.
        Its tail claws can inject its prey with a
        savage poison.
      fr: |-
        Il attend, en embuscade dans le sable, et empoisonne
        ses proies avec les pinces de sa queue.
      de: |-
        Es wartet im Sand versteckt auf Beute, die es sich
        mit seinem giftigen Schweif krallt.
      es: |-
        Acecha a sus presas escondido en la arena y las
        aturde con el veneno de su cola.
      it: |-
        Si seppellisce nella sabbia e tende agguati alle prede,
        poi inietta loro il veleno dagli artigli della coda.
    omega-ruby:
      ja-Hrkt: |-
        しっぽの　ツメで　えものを　はさみ
        どくを　おくりこむ。どくが　きくまで
        ぜったいに　はなさない　しゅうねん。
      ja: |-
        尻尾の　ツメで　獲物を　挟み
        毒を　送りこむ。毒が　効くまで
        絶対に　放さない　執念。
      ko: |-
        꼬리의 발톱으로 먹이를 집어
        독을 주입한다. 독이 퍼질 때까지
        절대 놓치지 않는 집념이 있다.
      en: |-
        It grips prey with its tail claws and injects poison.
        It tenaciously hangs on until the poison takes.
      fr: |-
        Il saisit sa proie avec les pinces de sa queue, lui injecte
        un poison et la retient jusqu’à ce qu’il agisse.
      de: |-
        Es greift seine Beute mit den Krallen an seinem Schweif und
        vergiftet sie. Dann wartet es ab...
      es: |-
        Agarra a sus presas con las pinzas de la cola y les inyecta
        veneno. Espera hasta que hace efecto.
      it: |-
        Afferra le prede con gli artigli della coda e non si allontana
        finché il veleno che inietta non agisce.
    alpha-sapphire:
      ja-Hrkt: |-
        すなの　なかに　かくれて　えものを
        まちぶせする。しっぽの　ツメから
        どくを　だして　えものを　しとめる。
      ja: |-
        砂の　中に　隠れて　獲物を
        待ち伏せする。尻尾の　ツメから
        毒を　出して　獲物を　しとめる。
      ko: |-
        모래 속에 숨어 먹이를
        기다리고 있다. 꼬리의 발톱에서
        독을 내서 먹이를 꼼짝 못하게 한다.
      en: |-
        It burrows under the sand to lie in wait for prey.
        Its tail claws can inject its prey with a
        savage poison.
      fr: |-
        Il attend, en embuscade dans le sable, et empoisonne
        ses proies avec les pinces de sa queue.
      de: |-
        Es wartet im Sand versteckt auf Beute, die es sich mit seinem
        giftigen Schweif krallt.
      es: |-
        Acecha a sus presas escondido en la arena y las aturde con
        el veneno de su cola.
      it: |-
        Si seppellisce nella sabbia e tende agguati alle prede,
        poi inietta loro il veleno dagli artigli della coda.
    sword:
      ja-Hrkt: |-
        すなに　からだを　うずめ　じっと
        えものを　まちつづけている。
        ヤクデと　そせんが　ちかい。
      ja: |-
        砂に　体を　埋め　じっと
        獲物を　待ち続けている。
        ヤクデと　祖先が　近い。
      ko: |-
        모래에 몸을 파묻은 채
        가만히 먹이를 기다린다.
        태우지네와 조상이 가깝다.
      zh-Hant: |-
        將自己的身體埋在沙子裡，
        一聲不響地等待獵物。
        祖先和燒火蚣的祖先是近親。
      zh-Hans: |-
        将自己的身体埋在沙子里，
        一声不响地等待猎物。
        祖先和烧火蚣的祖先是近亲。
      en: |-
        After burrowing into the sand, it waits patiently
        for prey to come near. This Pokémon and
        Sizzlipede share common descent.
      fr: |-
        Il s’enfouit dans le sable et attend patiemment
        ses proies. Il a des ancêtres en commun
        avec Grillepattes.
      de: |-
        Dieses Pokémon vergräbt sich im Sand und
        lauert dort regungslos seiner Beute auf. Es ist
        artverwandt mit Thermopod.
      es: |-
        Se entierra en la arena y aguarda inmóvil a sus
        presas. Sus antepasados están relacionados con
        los de Sizzlipede.
      it: |-
        Si nasconde nella sabbia e aspetta immobile
        la preda. Lui e Sizzlipede hanno antenati
        in comune.
    shield:
      ja-Hrkt: |-
        どくのある　しっぽの　ツメで
        おそいかかる。　はさまれると
        どくが　しみて　うごけなくなる。
      ja: |-
        毒のある　しっぽの　ツメで
        襲いかかる。　挟まれると
        毒が　染みて　動けなくなる。
      ko: |-
        독이 있는 꼬리의 발톱으로
        덤벼든다. 집히면 독이 스며들어
        움직일 수 없게 된다.
      zh-Hant: |-
        用尾巴上帶毒的鉤爪襲擊對手。
        一旦被夾住，毒素就會擴散開來，
        導致全身無法動彈。
      zh-Hans: |-
        用尾巴上带毒的钩爪袭击对手。
        一旦被夹住，毒素就会扩散开来，
        导致全身无法动弹。
      en: |-
        It attacks using the claws on its tail. Once locked
        in its grip, its prey is unable to move as this
        Pokémon’s poison seeps in.
      fr: |-
        Il attaque avec les pinces empoisonnées
        de sa queue. Le venin se répand alors
        dans le corps de la victime et la paralyse.
      de: |-
        Es schlägt mit den giftigen Krallen an seinem
        Schweif zu. Wer von ihnen gestochen wird,
        bekommt ein lähmendes Gift injiziert.
      es: |-
        Ataca con las pinzas venenosas de la cola. Tras
        clavarlas, inyecta una toxina que inmoviliza a la
        presa.
      it: |-
        Attacca la preda afferrandola con gli artigli
        velenosi della coda, poi inietta il veleno per
        immobilizzarla.
