    x:
      ja-Hrkt: |-
        たいようの　ひかりを　あびて
        ぜんしんで　こうごうせいを　する。
        こうらは　つちが　かたくなったもの。
      ja: |-
        太陽の　光を　浴びて
        全身で　光合成を　する。
        甲羅は　土が　硬くなったもの。
      ko: |-
        태양의 빛을 쬐어
        전신으로 광합성을 한다.
        등껍질은 흙이 딱딱해진 것이다.
      en: |-
        Photosynthesis occurs across its body under the
        sun. The shell on its back is actually hardened soil.
      fr: |-
        Son corps assimile la lumière du soleil par
        photosynthèse. Sa carapace est faite de terre durcie.
      de: |-
        Im Sonnenlicht betreibt sein ganzer Körper
        Photosynthese. Sein Panzer besteht aus hartem Lehm.
      es: |-
        Realiza la fotosíntesis al bañarle los rayos de sol.
        Su concha está formada por tierra endurecida.
      it: |-
        Fa la fotosintesi su tutto il corpo esponendosi ai
        raggi solari. La sua corazza è fatta di terra compatta.
    'y':
      ja-Hrkt: |-
        ぜんしんで　こうごうせいを　して
        さんそを　つくる。のどが　かわくと
        あたまの　はっぱが　しおれてしまう。
      ja: |-
        全身で　光合成を　して
        酸素を　作る。のどが　渇くと
        頭の　葉っぱが　しおれてしまう。
      ko: |-
        전신으로 광합성을 하여
        산소를 만든다. 목이 마르면
        머리의 잎사귀가 시들어 버린다.
      en: |-
        It undertakes photosynthesis with its body, making
        oxygen. The leaf on its head wilts if it is thirsty.
      fr: |-
        Son corps produit de l’oxygène par photosynthèse.
        La feuille sur sa tête flétrit quand il a soif.
      de: |-
        Sein Körper lebt von der Photosynthese,
        die Sauerstoff freisetzt. Ist es durstig, welkt sein Blatt.
      es: |-
        Realiza la fotosíntesis para obtener oxígeno. Si tiene
        sed, las hojas de la cabeza se marchitan.
      it: |-
        È in grado di svolgere la fotosintesi e di produrre
        ossigeno. La sua foglia appassisce se ha sete.
    omega-ruby:
      ja-Hrkt: |-
