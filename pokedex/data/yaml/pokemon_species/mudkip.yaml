    black-2:
      en: |-
        To alert it, the fin on its head
        senses the flow of water. It has
        the strength to heft boulders.
    white-2:
      en: |-
        To alert it, the fin on its head
        senses the flow of water. It has
        the strength to heft boulders.
    x:
      ja-Hrkt: |-
        おおきな　おびれで　みずを　かけば
        ぐんぐん　スピードが　あがる。
        ちいさい　からだでも　ちからもち。
      ja: |-
        大きな　尾びれで　水を　かけば
        ぐんぐん　スピードが　上がる。
        小さい　体でも　力持ち。
      ko: |-
        커다란 꼬리지느러미로 물을 헤치면
        스피드가 쑥쑥 오른다.
        작은 몸이지만 힘이 장사다.
      en: |-
        Its large tail fin propels it through water with
        powerful acceleration. It is strong in spite of
        its size.
      fr: |-
        Sa grande queue en forme de nageoire lui donne
        une puissance d’accélération incroyable. Il est très
        costaud malgré sa taille.
      de: |-
        Durch den propellerartigen Einsatz seiner großen
        Schwanzflosse schwimmt es schnell durchs Wasser.
        Trotz seiner kleinen Größe ist es stark.
      es: |-
        Tiene una larga cola que le propulsa por el agua con
        mucha potencia. A pesar de ser pequeño, tiene mucha
        fuerza.
      it: |-
        La grande pinna sulla coda gli conferisce una
        straordinaria accelerazione in acqua. È minuto,
        ma forte.
    'y':
      ja-Hrkt: |-
        あたまの　ひれで　みずの　ながれを
        かんじて　まわりの　ようすを　しる。
        いわを　もちあげる　ちからもち。
      ja: |-
        頭の　ヒレで　水の　流れを
        感じて　まわりの　様子を　知る。
        岩を　持ち上げる　力持ち。
      ko: |-
        머리의 지느러미로 물의 흐름을
        느껴 주위의 상황을 파악한다.
        바위를 들어 올릴 정도로 힘이 세다.
      en: |-
        To alert it, the fin on its head senses the flow of
        water. It has the strength to heft boulders.
      fr: |-
        Il analyse le courant grâce à la nageoire sur sa tête.
        Il est assez fort pour soulever des rochers.
      de: |-
        Die Flosse auf seinem Kopf prüft die Strömung des
        Wassers. Dieses Pokémon kann Felsen heben.
      es: |-
        La aleta de su cabeza detecta las corrientes de agua
        y los peligros. Tiene fuerza para levantar rocas.
      it: |-
        Con la pinna sulla testa percepisce i movimenti
        dell’acqua e sta in guardia. Riesce a sollevare rocce.
    omega-ruby:
      ja-Hrkt: |-
        あたまの　ひれは　とても　びんかんな　レーダー。
        みずや　くうきの　うごきから　めを　つかわずに
        まわりの　ようすを　キャッチすることが　できる。
      ja: |-
        頭の　ひれは　とても　敏感な　レーダー。
        水や　空気の　動きから　目を　使わずに
        周りの　様子を　キャッチすることが　できる。
      ko: |-
        머리의 지느러미는 매우 민감한 레이더다.
        물이나 공기의 움직임을 통해 눈을 쓰지 않고
        주변의 상황을 알아낼 수 있다.
      en: |-
        The fin on Mudkip’s head acts as highly sensitive radar.
        Using this fin to sense movements of water and air, this
        Pokémon can determine what is taking place around it
        without using its eyes.
      fr: |-
        La nageoire sur la tête de Gobou lui sert de radar
        hypersensible. Il l’utilise pour sentir les mouvements
        de l’eau et de l’air. Ainsi, ce Pokémon peut savoir ce qui
        se passe autour de lui sans avoir à se servir de ses yeux.
      de: |-
        Die Flosse an Hydropis Kopf dient als hochempfindliches
        Radar. Damit kann es Bewegungen im Wasser und in der
        Luft wahrnehmen. So weiß es jederzeit, was in seiner
        Umgebung passiert, ohne dabei seine Augen zu benutzen.
      es: |-
        La aleta que tiene Mudkip en la cabeza actúa de radar y es
        muy sensible. Puede captar movimientos que se produzcan en
        el agua y en el aire, y todo lo que ocurra a su alrededor, sin
        necesidad de abrir los ojos.
      it: |-
        La pinna sulla testa di Mudkip agisce come un radar
        sensibilissimo. Usando questa pinna come sensore
        in acqua e in aria, riesce a determinare cosa succede
        attorno a lui senza bisogno di guardare.
    alpha-sapphire:
      ja-Hrkt: |-
        すいちゅうでは　ほっぺの　エラで　こきゅうする。
        ピンチに　なると　からだより　おおきな　いわを
        こなごなに　くだく　パワーを　はっきする。
      ja: |-
        水中では　ほっぺの　エラで　呼吸する。
        ピンチに　なると　体より　大きな　岩を
        粉々に　砕く　パワーを　発揮する。
      ko: |-
        물속에서는 뺨의 아가미로 호흡한다.
        위급해지면 몸보다 큰 바위를
        산산이 부숴버리는 파워를 발휘한다.
      en: |-
        In water, Mudkip breathes using the gills on its cheeks. If it is
        faced with a tight situation in battle, this Pokémon will unleash
        its amazing power—it can crush rocks bigger than itself.
      fr: |-
        Sous l’eau, Gobou peut respirer grâce aux branchies sur
        ses joues. S’il se retrouve en difficulté pendant un combat,
        ce Pokémon déchaîne ses pouvoirs incroyables. Il peut
        détruire des rochers plus gros que lui.
      de: |-
        Im Wasser atmet Hydropi durch die Kiemen
        an seinen Wangen. Wenn es im Kampf in eine
        brenzlige Situation gerät, setzt es seine
        verblüffende Kraft ein, mit der es Felsbrocken
        zerquetschen kann, die größer sind als es selbst.
      es: |-
        En el agua, Mudkip usa las branquias que tiene en los
        mofletes para respirar. Cuando tiene que enfrentarse a una
        situación delicada en combate, desata una fuerza asombrosa
        con la que puede destruir rocas incluso mayores que él.
      it: |-
        In acqua Mudkip respira usando le branchie sulle mascelle.
        In caso di situazioni critiche nella lotta scatena la sua forza
        strabiliante, riuscendo a frantumare rocce più grandi di lui.
