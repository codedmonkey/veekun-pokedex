    sword:
      ja-Hrkt: |-
        うまれたときから　せなかに
        しょくぶつの　タネが　あって
        すこしずつ　おおきく　そだつ。
      ja: |-
        生まれたときから　背中に
        植物の　タネが　あって
        少しずつ　大きく　育つ。
      ko: |-
        태어났을 때부터 등에
        식물의 씨앗이 있으며
        조금씩 크게 자란다.
      zh-Hant: |-
        從出生的時候開始
        背上就有一顆植物種子。
        這顆種子會漸漸地長大。
      zh-Hans: |-
        从出生的时候开始，
        背上就有一颗植物种子。
        这颗种子会渐渐地长大。
      en: |-
        There is a plant seed on its back right from the
        day this Pokémon is born. The seed slowly
        grows larger.
      fr: |-
        Il y a une graine sur son dos depuis sa naissance.
        Elle grossit un peu chaque jour.
      de: |-
        Dieses Pokémon trägt von Geburt an einen
        Samen auf dem Rücken, der im Laufe der Zeit
        keimt und wächst.
      es: |-
        Este Pokémon nace con una semilla en el lomo,
        que brota con el paso del tiempo.
      it: |-
        Fin dalla nascita questo Pokémon ha sulla schiena
        un seme che cresce lentamente.
    shield:
      ja-Hrkt: |-
        うまれて　しばらくの　あいだ
        せなかの　タネに　つまった
        えいようを　とって　そだつ。
      ja: |-
        生まれて　しばらくの　あいだ
        背中の　タネに　つまった
        栄養を　とって　育つ。
      ko: |-
        태어나서 얼마 동안
        등의 씨앗에 담긴
        영양을 섭취하며 자란다.
      zh-Hant: |-
        在出生後的一段時間內，
        牠會吸收背上種子裡
        儲存著的營養成長。
      zh-Hans: |-
        在出生后的一段时间内，
        它会吸收背上种子里
        储存着的营养成长。
      en: |-
        While it is young, it uses the nutrients that are
        stored in the seed on its back in order to grow.
      fr: |-
        Quand il est jeune, il absorbe les nutriments
        conservés dans son dos pour grandir
        et se développer.
      de: |-
        Nach der Geburt nimmt es für eine Weile
        Nährstoffe über den Samen auf seinem
        Rücken auf.
      es: |-
        Desde que nace, crece alimentándose de los
        nutrientes que contiene la semilla de su lomo.
      it: |-
        Appena nato, trae nutrimento dalle sostanze
        contenute nel seme sul dorso.
