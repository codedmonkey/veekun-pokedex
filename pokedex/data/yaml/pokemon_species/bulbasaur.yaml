        raggi solari il seme cresce ingrandendosi progressivamente.
    lets-go-pikachu:
      ja-Hrkt: |-
        なんにちだって　なにも　たべなくても
        げんき！　せなかのタネに　たくさん
        えいようが　あるから　へいきだ！
      ja: |-
        何日だって　なにも　食べなくても
        元気！　背中のタネに　たくさん
        栄養が　あるから　平気だ！
      ko: |-
        며칠 동안 아무것도 먹지 않아도
        건강하다! 등에 있는 씨앗에는
        많은 영양분이 있어서 문제없다!
      zh-Hant: |-
        背上的種子裡存著很多營養，
        所以就算好幾天不吃東西
        也能活得好好的！
      zh-Hans: |-
        背上的种子里储存着营养，
        所以即使好几天不吃东西
        也可以活得好好的！
      en: |-
        It can go for days without eating a single morsel.
        In the bulb on its back, it stores energy.
      fr: |-
        Il peut survivre plusieurs jours sans manger
        grâce aux nutriments contenus dans le bulbe
        sur son dos.
      de: |-
        Es kommt tagelang ohne Nahrung aus, da es
        in den Samen auf seinem Rücken Nährstoffe
        speichert.
      es: |-
        Puede sobrevivir largo tiempo sin probar
        bocado gracias a los nutrientes que guarda
        en el bulbo del lomo.
      it: |-
        Questo Pokémon può stare a lungo senza
        mangiare. Accumula energia nel bulbo che
        ha sulla schiena.
