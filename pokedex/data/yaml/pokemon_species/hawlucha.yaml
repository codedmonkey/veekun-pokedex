hawlucha:
  base_happiness: 50
  capture_rate: 100
  color: green
  egg_groups:
    - flying
    - humanshape
  evolution_chain: hawlucha
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        たいかくは　こがらだが　カイリキーや
        ハリテヤマなど　おおきな　ポケモンと
        ごかくに　たたかう　テクニシャン。
      ja: |-
        体格は　小柄だが　カイリキーや
        ハリテヤマなど　大きな　ポケモンと
        互角に　戦う　テクニシャン。
      ko: |-
        체격은 작지만 괴력몬이나
        하리뭉 등의 커다란 포켓몬과
        막상막하로 싸우는 테크니션이다.
      en: |-
        Although its body is small, its proficient
        fighting skills enable it to keep up with
        big bruisers like Machamp and Hariyama.
      fr: |-
        Malgré sa petite taille, son intelligence lui permet
        d’affronter sans trembler de grands Pokémon tels que
        les Mackogneur ou les Hariyama.
      de: |-
        Ungeachtet seines kleinen Wuchses, erweist es sich,
        dank seiner Kampftechnik, gegenüber größeren
        Gegnern wie Machomei oder Hariyama als ebenbürtig.
      es: |-
        A pesar de ser un Pokémon de pequeña estatura,
        su pericia en el combate le permite plantar cara a
        Pokémon como Machamp o Hariyama.
      it: |-
        Nonostante le piccole dimensioni, è in grado di
        tenere testa a Pokémon ben più grandi come
        Machamp o Hariyama.
    'y':
      ja-Hrkt: |-
        つばさを　つかい　くうちゅうで
        しせいを　コントロール。ふせぎにくい
        ずじょうから　こうげきを　しかける。
      ja: |-
        翼を　使い　空中で　姿勢を
        コントロール。防ぎにくい　頭上から
        攻撃を　仕掛ける。
      ko: |-
        날개를 사용해 공중에서
        자세를 컨트롤한다. 막기 어려운
        머리 위에서부터 공격해온다.
      en: |-
        With its wings, it controls its position in the air.
        It likes to attack from above, a maneuver that
        is difficult to defend against.
      fr: |-
        Il utilise ses ailes pour contrôler avec précision sa
        posture en vol. Ses attaques aériennes sont difficiles
        à parer.
      de: |-
        Es nutzt seine Flügel, um sich am Himmel in Position
        zu halten. Gegen seine Angriffe aus der Luft kann man
        sich nur schwer zur Wehr setzen.
      es: |-
        Controla su posición en el aire con las alas. Lanza
        ataques desde gran altura que resultan difíciles de
        evitar.
      it: |-
        Grazie alle sue ali riesce a controllare con la massima
        precisione i movimenti in aria e attacca dall’alto,
        in posizione di vantaggio rispetto ai nemici.
    omega-ruby:
      ja-Hrkt: |-
        たいかくは　こがらだが　カイリキーや
