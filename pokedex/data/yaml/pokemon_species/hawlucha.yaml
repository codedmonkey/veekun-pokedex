        ごかくに　たたかう　テクニシャン。
      ja: |-
        体格は　小柄だが　カイリキーや
        ハリテヤマなど　大きな　ポケモンと
        互角に　戦う　テクニシャン。
      ko: |-
        체격은 작지만 괴력몬이나
        하리뭉 등의 커다란 포켓몬과
        막상막하로 싸우는 테크니션이다.
      en: |-
        Although its body is small, its proficient
        fighting skills enable it to keep up with
        big bruisers like Machamp and Hariyama.
      fr: |-
        Malgré sa petite taille, son intelligence lui permet d’affronter
        sans trembler de grands Pokémon tels que les Mackogneur
        ou les Hariyama.
      de: |-
        Ungeachtet seines kleinen Wuchses, erweist es sich, dank
        seiner Kampftechnik, gegenüber größeren Gegnern wie
        Machomei oder Hariyama als ebenbürtig.
      es: |-
        A pesar de ser un Pokémon de pequeña estatura, su pericia
        en el combate le permite plantar cara a Pokémon como
        Machamp o Hariyama.
      it: |-
        Nonostante le piccole dimensioni, è in grado di tenere testa
        a Pokémon ben più grandi come Machamp o Hariyama.
    alpha-sapphire:
      ja-Hrkt: |-
        つばさを　つかい　くうちゅうで
        しせいを　コントロール。ふせぎにくい
        ずじょうから　こうげきを　しかける。
      ja: |-
        翼を　使い　空中で　姿勢を
        コントロール。防ぎにくい　頭上から
        攻撃を　仕掛ける。
      ko: |-
        날개를 사용해 공중에서
        자세를 컨트롤한다. 막기 어려운
        머리 위에서부터 공격해온다.
      en: |-
        With its wings, it controls its position in the air.
        It likes to attack from above, a maneuver that
        is difficult to defend against.
      fr: |-
        Il utilise ses ailes pour contrôler avec précision sa posture
        en vol. Ses attaques aériennes sont difficiles à parer.
      de: |-
        Es nutzt seine Flügel, um sich am Himmel in Position zu halten.
        Gegen seine Angriffe aus der Luft kann man sich nur schwer
        zur Wehr setzen.
      es: |-
        Controla su posición en el aire con las alas. Lanza ataques
        desde gran altura que resultan difíciles de evitar.
      it: |-
        Grazie alle sue ali riesce a controllare con la massima
        precisione i movimenti in aria e attacca dall’alto, in posizione
        di vantaggio rispetto ai nemici.
    ultra-sun:
      ja-Hrkt: |-
        すばやいわざで　あいてを　あっとう。
        ひっさつわざを　はなつ　アピールが
        ながすぎて　ピンチにおちいることも。
      ja: |-
        素早い技で　相手を　圧倒。
        必殺技を　放つ　アピールが
        長すぎて　ピンチに陥ることも。
      ko: |-
        빠른 기술로 상대를 압도한다.
        필살기를 쓰기 위한 어필이
        너무 길어서 위기에 처하기도 한다.
      zh-Hant: |-
        用速度快的招式壓倒對手。
        由於使出必殺技時的前置動作太長，
        有時會因此陷入危機。
      zh-Hans: |-
        用速度快的招式压倒对手。
        使出必杀技时的展示时间过长，
        有时候会陷入危机。
      en: |-
        It overwhelms opponents with quick moves, but
        sometimes it showboats for too long when it’s
        using a special move and gets itself into a pinch.
      fr: |-
        Il terrasse ses adversaires grâce à sa vitesse,
        mais se pavane tant avant de lancer sa botte
        secrète qu’il se retrouve parfois en difficulté.
      de: |-
        Es dominiert seine Gegner mit flinken Attacken.
        Oft wird es ihm aber zum Verhängnis, dass es
        seine Spezialtechniken zu lange in Szene setzt.
      es: |-
        Deja atónito al rival con sus rápidos ataques,
        pero se luce tanto antes de dar el golpe
        definitivo que a veces sale mal parado.
      it: |-
        Prevale sul nemico grazie alla sua rapidità, ma a
        volte per mettersi in mostra aspetta troppo a
        lanciare l’attacco finale e si trova in difficoltà.
    ultra-moon:
      ja-Hrkt: |-
        かろやかな　ジャンプで　あいての
        しかくに　まわりつつ　たたかう。
        かれいな　かんせつわざも　とくい。
      ja: |-
        軽やかな　ジャンプで　相手の
        死角に　まわりつつ　戦う。
        華麗な　関節技も　得意。
      ko: |-
        경쾌한 점프로 상대의
        사각을 돌며 싸운다.
        화려한 관절 기술도 특기다.
      zh-Hant: |-
        會用輕盈的跳躍
        跳到對手的死角來戰鬥。
        也很擅長華麗的關節技。
      zh-Hans: |-
        会用轻巧的跳跃
        跳到对手的死角来战斗。
        也很擅长华丽的关节招式。
      en: |-
        In combat, Hawlucha leaps nimbly about, taking
        advantage of its opponents’ blind spots. It’s
        also skilled at using superb submission holds.
      fr: |-
        Il combat ses adversaires en sautillant pour
        se retrouver dans leur angle mort. Il maîtrise
        de formidables techniques de clés articulaires.
      de: |-
        Im Kampf manövriert es sich mit gewandten
        Sprüngen aus dem Blickfeld seines Gegners.
        Es beherrscht auch prachtvolle Hebeltechniken.
      es: |-
        Con sus ágiles saltos y su juego de piernas,
        permanece siempre en el punto ciego del rival.
        Es un experto en llaves inmovilizadoras.
      it: |-
        Durante la lotta, si porta con agili salti negli
        angoli ciechi della visuale dell’avversario.
        È in grado di eseguire magnifiche leve articolari.
    sword:
      ja-Hrkt: |-
        みがるさを　いかした　せんぽうで
        あいての　たいりょくを　うばってから
        かれいな　おおわざを　きめる。
      ja: |-
        身軽さを　活かした　戦法で
        相手の　体力を　奪ってから
        華麗な　大技を　決める。
      ko: |-
        경쾌한 몸놀림을 활용한 전법으로
        상대의 체력을 빼앗은 뒤
        화려한 큰 기술을 먹인다.
      zh-Hant: |-
        利用發揮輕盈體型優勢的戰法，
        在消耗了對手的體力之後
        使用華麗的絕招分出勝負。
      zh-Hans: |-
        利用发挥轻盈体型优势的战法，
        在消耗了对手的体力之后
        使用华丽的绝招分出胜负。
      en: |-
        It drives its opponents to exhaustion with its agile
        maneuvers, then ends the fight with a flashy
        finishing move.
      fr: |-
        Il utilise des tactiques basées sur son agilité
        pour fatiguer son adversaire, et termine
        le combat par une magnifique frappe décisive.
      de: |-
        Durch flinke Angriffsmanöver raubt es seinen
        Gegnern ihre Kraft, um sie dann mit prachtvollen
        Spezialtechniken niederzuringen.
      es: |-
        Se vale de su agilidad para minar las fuerzas del
        rival y, una vez extenuado, remata el combate
        ejecutando una técnica formidable.
      it: |-
        Sfrutta la sua agilità per indebolire l’avversario,
        e conclude la lotta dandogli il colpo di grazia
        con una mossa grandiosa.
    shield:
      ja-Hrkt: |-
        とどめの　おおわざを　だす　まえは
        かならず　ポーズを　きめる。　その
        すきに　はんげきされる　こともある。
      ja: |-
        とどめの　大技を　出す　前は
        かならず　ポーズを　決める。　その
        隙に　反撃される　こともある。
      ko: |-
        끝을 내는 결정적인 기술을 쓰기 전에
        반드시 포즈를 취한다.
        그 틈에 반격당하기도 한다.
      zh-Hant: |-
        在使出致命的絕招之前
        一定要先擺出華麗的姿勢。
        有時也會在這一刻遭到反擊。
      zh-Hans: |-
        在使出致命的绝招之前
        一定要先摆出华丽的姿势。
        有时也会在这一刻遭到反击。
      en: |-
        It always strikes a pose before going for its
        finishing move. Sometimes opponents take
        advantage of that time to counterattack.
      fr: |-
        Il prend toujours la pose avant de donner le coup
        de grâce à son adversaire. Certains en profitent
        pour contre-attaquer.
      de: |-
        Bevor es seinem Gegner mit einer Spezialtechnik
        ein Ende setzt, posiert es stets. Diesen Moment
        nutzt so mancher für einen Gegenangriff.
      es: |-
        Siempre se exhibe con alguna pose justo antes
        de propinar el golpe de gracia, momento que
        algunos rivales aprovechan para contraatacar.
      it: |-
        Assume sempre una posa speciale prima di
        sferrare il colpo finale. A volte i nemici
        approfittano di questo istante per contrattaccare.
