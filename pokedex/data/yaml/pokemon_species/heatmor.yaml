heatmor:
  base_happiness: 50
  capture_rate: 90
  color: red
  egg_groups:
    - ground
  evolution_chain: heatmor
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        It breathes through a hole in its tail
        while it burns with an internal fire.
        Durant is its prey.
      fr: |-
        Il aspire de l’air par la queue et
        entretient un brasier dans son corps.
        C’est le prédateur des Fermite.
    white:
      en: |-
        Using their very hot, flame-covered
        tongues, they burn through Durant’s
        steel bodies and consume their insides.
      fr: |-
        Avec sa langue de feu à haute
        température, il fait fondre le corps
        d’acier des Fermite pour les dévorer.
    black-2:
      en: |-
        It draws in air through its tail,
        transforms it into fire, and uses it like
        a tongue. It melts Durant and eats them.
    white-2:
      en: |-
        It draws in air through its tail,
        transforms it into fire, and uses it like
        a tongue. It melts Durant and eats them.
    x:
      ja-Hrkt: |-
        こうおんで　もえる　ほのおの　したで
        アイアントの　はがねの　からだを
        とかして　なかみを　いただくのだ。
      ja: |-
        高温で　燃える　炎の　舌で
        アイアントの　鋼の　体を　溶かして
        中身を　いただくのだ。
      ko: |-
        뜨겁게 타오르는 불꽃의 혀로
        아이앤트의 강철 몸을
        녹여서 알맹이를 먹어치운다.
      en: |-
        Using their very hot, flame-covered tongues,
        they burn through Durant’s steel bodies and
        consume their insides.
      fr: |-
        Avec sa langue de feu à haute température, il fait
        fondre le corps d’acier des Fermite pour les dévorer.
      de: |-
        Mit seiner brandheißen Zunge bringt es Fermicula
        zum Schmelzen, um so an sein weiches Inneres
        zu gelangen.
      es: |-
        Usa su lengua de fuego para derretir la armadura de
        acero de los Durant y llegar así hasta su interior.
      it: |-
        Con la sua lingua infuocata scioglie la corazza
        d’acciaio di Durant e ne consuma l’interno.
    'y':
      ja-Hrkt: |-
        しっぽから　とりこんだ　くうきを
        ほのおにかえて　ベロのように　つかい
        アイアントを　とかして　たべるぞ。
      ja: |-
        尻尾から　取りこんだ　空気を
        炎に変えて　ベロのように　使い
        アイアントを　溶かして　食べるぞ。
      ko: |-
        꼬리에서 빨아들인 공기를
        불꽃으로 바꿔 혀처럼 사용해
        아이앤트를 녹여서 먹는다.
      en: |-
        It draws in air through its tail, transforms it into fire,
        and uses it like a tongue. It melts Durant and
        eats them.
      fr: |-
        Il aspire de l’air par la queue et le transforme en
        une langue de feu qui fait fondre les Fermite dont
        il se régale.
      de: |-
        Über den Schweif aufgesaugte Luft wird in eine
        Feuerzunge verwandelt, um damit Fermicula
        zu schmelzen und zu fressen.
      es: |-
        Absorbe aire por el orificio de su cola para prender
        una lengua de llamas con la que derrite a los Durant
        para comerlos.
      it: |-
        Converte l’aria che aspira dalla coda in una lingua
        di fiamme che usa per sciogliere i Durant prima di
        consumarli.
    omega-ruby:
      ja-Hrkt: |-
        こうおんで　もえる　ほのおの　したで
        アイアントの　はがねの　からだを
        とかして　なかみを　いただくのだ。
      ja: |-
        高温で　燃える　炎の　舌で
        アイアントの　鋼の　体を　溶かして
        中身を　いただくのだ。
      ko: |-
        뜨겁게 타오르는 불꽃의 혀로
        아이앤트의 강철 몸을
        녹여서 알맹이를 먹어치운다.
      en: |-
        Using their very hot, flame-covered tongues,
        they burn through Durant’s steel bodies and
        consume their insides.
      fr: |-
        Avec sa langue de feu à haute température, il fait fondre
        le corps d’acier des Fermite pour les dévorer.
      de: |-
        Mit seiner brandheißen Zunge bringt es Fermicula zum
        Schmelzen, um so an sein weiches Inneres zu gelangen.
      es: |-
        Usa su lengua de fuego para derretir la armadura de acero de
        los Durant y llegar así hasta su interior.
      it: |-
        Con la sua lingua infuocata scioglie la corazza d’acciaio
        di Durant e ne consuma l’interno.
    alpha-sapphire:
      ja-Hrkt: |-
        しっぽから　とりこんだ　くうきを
        ほのおにかえて　ベロのように　つかい
        アイアントを　とかして　たべるぞ。
      ja: |-
        尻尾から　取りこんだ　空気を
        炎に変えて　ベロのように　使い
        アイアントを　溶かして　食べるぞ。
      ko: |-
        꼬리에서 빨아들인 공기를
        불꽃으로 바꿔 혀처럼 사용해
        아이앤트를 녹여서 먹는다.
      en: |-
        It draws in air through its tail, transforms it into fire,
        and uses it like a tongue. It melts Durant and
        eats them.
      fr: |-
        Il aspire de l’air par la queue et le transforme en une langue
        de feu qui fait fondre les Fermite dont il se régale.
      de: |-
        Über den Schweif aufgesaugte Luft wird in eine Feuerzunge
        verwandelt, um damit Fermicula zu schmelzen und zu fressen.
      es: |-
        Absorbe aire por el orificio de su cola para prender una lengua
        de llamas con la que derrite a los Durant para comerlos.
      it: |-
        Converte l’aria che aspira dalla coda in una lingua di fiamme
        che usa per sciogliere i Durant prima di consumarli.
    sword:
      ja-Hrkt: |-
        しっぽの　あなから　くうきを
        とりこみ　ほのおを　もやす。　あなを
        ふさがれると　ぐあいが　わるくなる。
      ja: |-
        しっぽの　穴から　空気を
        取りこみ　炎を　燃やす。　穴を
        塞がれると　具合が　悪くなる。
      ko: |-
        꼬리의 구멍을 통해 공기를
        빨아들여 불꽃을 태운다.
        구멍이 막히면 상태가 나빠진다.
      zh-Hant: |-
        從尾部的孔洞吸入空氣，
        燃起火焰。如果孔洞被
        堵住了，身體就會不舒服。
      zh-Hans: |-
        从尾部的孔洞吸入空气，
        燃起火焰。如果孔洞被
        堵住了，身体就会不舒服。
      en: |-
        There’s a hole in its tail that allows it to draw in
        the air it needs to keep its fire burning. If the
        hole gets blocked, this Pokémon will fall ill.
      fr: |-
        Il aspire de l’air par le bout de sa queue
        et produit ainsi sa fameuse langue de feu.
        Si on lui bouche la queue, il se sent mal.
      de: |-
        Es saugt über das Loch in seinem Schweif Luft für
        seine Flammen ein. Eine Verstopfung des Lochs
        schlägt Furnifraß sofort auf die Gesundheit.
      es: |-
        Absorbe aire por el orificio de la cola para
        prender las llamas que expulsa. Si la abertura
        se obstruye, enferma.
      it: |-
        Aspira aria dal foro nella coda per produrre
        delle fiamme. Se il foro viene tappato, inizia
        a sentirsi male.
    shield:
      ja-Hrkt: |-
        ほのおを　ベロの　ように　つかう。
        アイアントの　かたい　がいこっかくを
        じわじわと　とかし　いただくのだ。
      ja: |-
        炎を　ベロの　ように　使う。
        アイアントの　硬い　外骨格を
        じわじわと　溶かし　いただくのだ。
      ko: |-
        불꽃을 혀처럼 사용한다.
        아이앤트의 단단한 외골격을
        조금씩 녹여 먹어 치운다.
      zh-Hant: |-
        將火焰當成舌頭來使用。
        會一點一點地熔化鐵蟻
        堅硬的外骨骼，然後把牠吃掉。
      zh-Hans: |-
        将火焰当成舌头来使用。
        会一点一点地熔化铁蚁
        坚硬的外骨骼，然后把它吃掉。
      en: |-
        A flame serves as its tongue, melting through the
        hard shell of Durant so that Heatmor can devour
        their insides.
      fr: |-
        Il se sert de sa flamme comme d’une langue.
        Il fait fondre peu à peu l’exosquelette des Fermite
        pour se délecter de leur chair.
      de: |-
        Es nutzt eine Flamme als Zunge. Damit bringt es
        die Panzer von Fermicula zum Schmelzen und
        verspeist im Anschluss ihr Inneres.
      es: |-
        Usa llamas a modo de lengua para derretir
        el duro exoesqueleto de los Durant antes de
        devorarlos.
      it: |-
        Usa la fiamma a mo’ di lingua. Liquefà il duro
        esoscheletro dei Durant e poi ne fa un sol
        boccone.
