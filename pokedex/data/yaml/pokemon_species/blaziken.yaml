    x:
      ja-Hrkt: |-
        ３０かいだての　ビルを　ジャンプで
        とびこす　ちょうやくりょく。ほのおの
        パンチが　あいてを　やきつくす。
      ja: |-
        ３０階建ての　ビルを　ジャンプで
        跳び越す　跳躍力。炎の　パンチが
        相手を　焼きつくす。
      ko: |-
        30층 빌딩을 점프로
        넘는 점프력을 가졌다.
        불꽃펀치가 상대를 태운다.
      en: |-
        It can clear a 30-story building in a leap.
        Its fiery punches scorch its foes.
      fr: |-
        Il peut bondir par-dessus un bâtiment de 30 étages.
        Ses poings enflammés brûlent ses adversaires.
      de: |-
        Mühelos springt es selbst über 30-stöckige Häuser.
        Sein Feuerschlag fügt dem Gegner Verbrennungen zu.
      es: |-
        Puede saltar edificios de 30 plantas. Con sus golpes
        de fuego quema a sus rivales.
      it: |-
        Riesce a superare un edificio di 30 piani con un salto.
        I suoi pugni di fuoco inceneriscono il nemico.
    'y':
      ja-Hrkt: |-
        きょうてきに　であうと　てくびから
        ほのおを　ふきだす。ジャンプで
        ビルを　とびこす　きゃくりょく。
      ja: |-
        強敵に　出会うと　手首から
        炎を　噴き出す。ジャンプで
        ビルで　跳び越す　脚力。
      ko: |-
        강적을 만나면 손목에서
        불꽃을 내뿜는다. 점프로
        빌딩을 뛰어넘는 다릿심을 가졌다.
      en: |-
        When facing a tough foe, it looses flames from
        its wrists. Its powerful legs let it jump clear
        over buildings.
      fr: |-
        Quand il est face à un ennemi, il laisse s’échapper
        des gerbes de flammes par ses poignets. Ses jambes
        lui permettent de sauter par-dessus les immeubles.
      de: |-
        Trifft es auf einen hartnäckigen Gegner, schießen
        Flammen aus seinen Handgelenken. Seine starken
        Beine ermöglichen ihm, über Häuser zu springen.
      es: |-
        Ante un rival difícil, expulsa llamas por las muñecas.
        Tiene mucha fuerza en las patas; hasta puede saltar
        edificios.
      it: |-
        Quando affronta un forte nemico lancia fiammate
        dai polsi. Le zampe poderose gli permettono di
        scavalcare interi palazzi.
    omega-ruby:
      ja-Hrkt: |-
        たたかいに　なると　てくびから　しゃくねつの
        ほのおを　ふきあげ　ゆうかんに　いどみかかる。
        あいてが　てごわいほど　はげしく　もえあがる。
      ja: |-
        戦いに　なると　手首から　灼熱の
        炎を　噴き上げ　勇敢に　挑みかかる、
        相手が　手強いほど　激しく　燃えあがる。
      ko: |-
        싸우게 되면 손목에서 작열하는
        불꽃을 뿜어 올려 용감히 덤벼든다.
        상대가 버거울수록 강렬히 불타오른다.
      en: |-
        In battle, Blaziken blows out intense flames from its wrists and
        attacks foes courageously. The stronger the foe, the more
        intensely this Pokémon’s wrists burn.
      fr: |-
        Au combat, Braségali envoie des flammes ardentes de
        ses poignets. Il fait preuve d’un courage exceptionnel.
        Plus l’ennemi est puissant, plus les poignets de ce Pokémon
        sont ardents.
      de: |-
        Lohgock stößt heftige Flammen aus seinen Handgelenken
        aus und greift seine Feinde mutig an. Je stärker ein Feind ist,
        desto stärker lodern die Handgelenke dieses Pokémon.
      es: |-
        En combate, Blaziken expulsa vivas llamas por las muñecas y
        ataca al enemigo con fiereza. Cuanto más fuerte sea el
        enemigo, más intensas serán las llamas.
      it: |-
        In lotta Blaziken emette fiamme micidiali coi suoi pugni,
        attaccando coraggiosamente il nemico. Più forte è il nemico,
        tanto più intenso è il fuoco proveniente dai pugni.
    alpha-sapphire:
      ja-Hrkt: |-
        きょうじんな　あしこしを　もち　３０かい　だての
        ビルも　らくらく　とびこす　ことが　できる。
        ほのおの　パンチで　あいてを　くろこげに　する。
      ja: |-
        強靭な　足腰を　持ち　３０階　建ての
        ビルも　楽々　飛び越す　ことが　できる。
        炎の　パンチで　相手を　黒焦げに　する。
      ko: |-
        강인한 하반신을 지녀 30층짜리
        빌딩도 가볍게 뛰어넘을 수 있다.
        불꽃의 펀치로 상대를 새까맣게 태운다.
      en: |-
        Blaziken has incredibly strong legs—it can easily clear a
        30-story building in one leap. This Pokémon’s blazing punches
        leave its foes scorched and blackened.
      fr: |-
        Braségali a des jambes incroyablement puissantes. Il peut
        sauter par-dessus un immeuble de trente étages. Les coups
        de poing enflammés de ce Pokémon peuvent carboniser
        ses ennemis.
      de: |-
        Lohgock besitzt unglaublich starke Beine, mit denen
        es ein 30 Stockwerke hohes Gebäude mit einem Sprung
        überwinden kann. Die flammenden Schläge dieses
        Pokémon lassen verkohlte Gegner zurück.
      es: |-
        Blaziken tiene unas piernas tan fuertes que puede saltar por
        encima de un edificio de 30 pisos con facilidad. Además, da
        unos puñetazos fulminantes que dejan al oponente
        chamuscado y lleno de tizne.
      it: |-
        Blaziken è dotato di zampe molto potenti in grado di radere
        al suolo un edificio di 30 piani in un colpo solo. I suoi pugni
        fulminei lasciano il nemico ustionato e talvolta carbonizzato.
