        옛날 사람은 전룡의 빛을 써서
        멀리 있는 동료와 신호를 주고받았다.
      en: |-
        Ampharos gives off so much light that it can be seen even from
        space. People in the old days used the light of this Pokémon
        to send signals back and forth with others far away.
      fr: |-
        Pharamp est si lumineux qu’on peut le voir de l’espace.
        Jadis, les gens utilisaient la lumière de ce Pokémon pour
        communiquer et s’envoyer des signaux à grande distance.
      de: |-
        Ampharos strahlt so viel Licht aus, dass es sogar aus dem
        Weltraum noch gesehen werden kann. In der Antike benutzten
        die Menschen das Licht dieses Pokémon dazu, Signale über
        weite Entfernungen auszutauschen.
      es: |-
        Ampharos desprende tanta luz que es posible verle hasta
        desde el espacio. Antes, la gente usaba su luz como sistema
        de comunicación para enviarse señales.
      it: |-
        Ampharos emana una luce così intensa da essere visibile
        anche dallo spazio. In passato si usava questo Pokémon
        per mandare segnali luminosi a persone molto lontane.
    ultra-sun:
      ja-Hrkt: |-
        シッポの　ひかりは　うちゅうまで
        とどくので　どこにいるか　まるわかり。
        だから　ふだんは　けしている。
      ja: |-
        シッポの　光は　宇宙まで
        届くので　どこにいるか　まるわかり。
        だから　普段は　消している。
      ko: |-
        꼬리의 빛은 우주까지 도달하여
        어디에 있든 바로 알 수 있다.
        그래서 평소에는 끄고 있다.
      zh-Hant: |-
        尾巴發出的光能直達宇宙，
        讓牠的所在位置一目了然，
        所以牠平常不會讓尾巴發光。
      zh-Hans: |-
        尾巴上的光能传至宇宙，
        所以身在何处一目了然。
        因此它平时不会让尾巴发光。
      en: |-
        The light from its tail can be seen from space.
        This is why you can always tell exactly where it
        is, which is why it usually keeps the light off.
      fr: |-
        La lumière de sa queue est si vive qu’on peut
        la voir depuis l’espace. En général, il l’éteint
        donc pour éviter de se faire repérer.
      de: |-
        Das Licht seiner Schweifspitze kann man selbst
        aus dem Weltall noch sehen. Um seinen Standort
        zu verbergen, macht es sein Licht zumeist aus.
      es: |-
        La luz que emite su cola puede verse desde el
        espacio, delatando su presencia a todos. Es por
        eso que normalmente la mantiene apagada.
      it: |-
        Questo Pokémon è facile da individuare grazie
        alla luce della sua coda, visibile anche dallo
        spazio. Per questo di solito la tiene spenta.
    ultra-moon:
      ja-Hrkt: |-
        シッポは　つよく　あかるく　かがやく。
        ふなのりたちの　みちしるべ　として
        むかしから　たいせつに　されてきた。
      ja: |-
        シッポは　強く　明るく　輝く。
        船乗りたちの　道しるべ　として
        昔から　大切に　されてきた。
      ko: |-
        꼬리는 강하고 밝게 빛난다.
        뱃사람들의 길잡이로서
        옛날부터 소중히 여겨져 왔다.
      zh-Hant: |-
        尾巴發出的耀眼光芒
        被船員們當成引路的路標，
        從過去就一直深受重視。
      zh-Hans: |-
        尾巴会发出很强的亮光。
        从以前起，它就被船员们
        当做路标而深受重视。
      en: |-
        Its tail shines bright and strong. It has been
        prized since long ago as a beacon for sailors.
      fr: |-
        Sa queue brille d’une lumière éclatante.
        Depuis des temps très anciens, il est vénéré
        comme le guide des marins.
      de: |-
        Seine Schweifspitze strahlt ein starkes, helles
        Licht aus. Auf See gilt dieses Leuchten von
        alters her als bedeutender Wegweiser.
      es: |-
        Su cola emite un brillo claro e intenso. Se lo
        venera desde tiempos remotos como guía de los
        marineros.
      it: |-
        La punta della sua coda brilla di una luce molto
        intensa che in passato era una preziosa guida
        per i marinai.
