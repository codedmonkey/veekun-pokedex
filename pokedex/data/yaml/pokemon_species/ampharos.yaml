    x:
      ja-Hrkt: |-
        しっぽのさきが　ひかりかがやく。
        ひかりは　はるか　とおくまで　とどき
        まよったものの　みちしるべとなる。
      ja: |-
        尻尾の先が　光り輝く。
        光は　はるか　遠くまで　届き
        迷った者の　道標となる。
      ko: |-
        꼬리 끝이 빛나며 반짝인다.
        빛이 아득히 먼 곳까지 닿아서
        길 잃은 자들의 이정표가 된다.
      en: |-
        The tail’s tip shines brightly and can be seen from
        far away. It acts as a beacon for lost people.
      fr: |-
        Le bout de sa queue brille si fort qu’il peut être vu
        de très loin. Il sert de balise aux gens.
      de: |-
        Seine Schweifspitze ist so hell, dass viele
        Verschollene es als Orientierungspunkt nutzen.
      es: |-
        La punta de su cola reluce brillantemente y puede ser
        vista desde lejos. Es usado como faro.
      it: |-
        La punta molto luminosa della coda è visibile da
        grandi distanze. Fa da segnale per chi si è perso.
    'y':
      ja-Hrkt: |-
        しっぽの　さきが　ひかりかがやく。
        ひかりは　はるか　とおくまで　とどき
        まよったものの　みちしるべとなる。
      ja: |-
