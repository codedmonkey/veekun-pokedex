elekid:
  base_happiness: 50
  capture_rate: 45
  color: yellow
  egg_groups:
    - no-eggs
  evolution_chain: electabuzz
  evolves_from: ~
  flavor_text:
    gold:
      en: |-
        It rotates its
        arms to generate
        electricity, butit tires easily,
        so it charges up
        only a little bit.
    silver:
      en: |-
        Even in the most
        vicious storm,
        this POKéMON playshappily if thunder
        rumbles in the
        sky.
    crystal:
      en: |-
        It loves violent
        thunder. The space
        between its hornsflickers bluish-
        white when it is
        charging energy.
    ruby:
      en: |-
        ELEKID stores electricity in its body.
        If it touches metal and accidentally
        discharges all its built-up electricity,this POKéMON begins swinging its arms
        in circles to recharge itself.
    sapphire:
      en: |-
        ELEKID stores electricity in its body.
        If it touches metal and accidentally
        discharges all its built-up electricity,this POKéMON begins swinging its arms
        in circles to recharge itself.
    emerald:
      en: |-
        If it touches metal and discharges the
        electricity it has stored in its body, an
        ELEKID begins swinging its arms in circles
        to recharge itself.
    firered:
      en: |-
        Even in the most vicious storm, this
        POKéMON plays happily if thunder rumbles
        in the sky.
    leafgreen:
      en: |-
        It rotates its arms to generate
        electricity, but it tires easily, so it
        charges up only a little bit.
    diamond:
      en: |-
        It generates electricity by
        whirling its arms. However, it
        can’t store the energy it makes.
    pearl:
      en: |-
        It generates electricity by
        whirling its arms. However, it
        can’t store the energy it makes.
    platinum:
      en: |-
        A weak electric current flows
        between its horns. Sticking a hand
        there shocks the unwary.
    heartgold:
      en: |-
        It rotates its arms to generate
        electricity, but it tires easily,
        so it only charges up a little bit.
    soulsilver:
      en: |-
        Even in the most vicious storm,
        this Pokémon plays happily if thunder
        rumbles in the sky.
    black:
      en: |-
        A weak electric current flows
        between its horns. Sticking a hand
        there shocks the unwary.
      fr: |-
        Un faible courant électrique circule
        entre ses cornes. Attention à ne
        pas y mettre la main!
    white:
      en: |-
        A weak electric current flows
        between its horns. Sticking a hand
        there shocks the unwary.
      fr: |-
        Un faible courant électrique circule
        entre ses cornes. Attention à ne
        pas y mettre la main!
    black-2:
      en: |-
        Spinning its arms around
        to generate electricity makes the area
        between its horns shine light blue.
    white-2:
      en: |-
        Spinning its arms around
        to generate electricity makes the area
        between its horns shine light blue.
    x:
      ja-Hrkt: |-
        りょううでを　ぐるぐる　ふりまわして
        でんきを　はっせいさせる。しかし
        つくった　でんきは　ためておけない。
      ja: |-
        両腕を　ぐるぐる　振り回して
        電気を　発生させる。しかし
        作った　電気は　ためておけない。
      ko: |-
        양팔을 빙글빙글 휘둘러서
        전기를 발생시킨다. 그러나
        만들어낸 전기는 모아둘 수 없다.
      en: |-
        It generates electricity by whirling its arms.
        However, it can’t store the energy it makes.
      fr: |-
        Il génère de l’électricité en battant des bras, mais
        il n’a aucun moyen de stocker cette énergie.
      de: |-
        Es bewegt seine Arme und generiert damit
        Elektrizität. Diese kann es aber nicht speichern.
      es: |-
        Genera electricidad girando los brazos. No obstante,
        es incapaz de almacenar la energía creada.
      it: |-
        Genera elettricità roteando le braccia. Tuttavia,
        non riesce a immagazzinare l’energia creata.
    'y':
      ja-Hrkt: |-
        りょううでを　ぐるぐる　まわして
        でんきを　はっせい　させると
        ツノのあいだが　あおじろく　ひかる。
      ja: |-
        両腕を　ぐるぐる　まわして
        電気を　発生させると
        ツノのあいだが　青白く　光る。
      ko: |-
        양팔을 빙글빙글 돌려
        전기를 발생시키면
        뿔 사이가 푸르스름하게 빛난다.
      en: |-
        Spinning its arms around to generate electricity
        makes the area between its horns shine light blue.
      fr: |-
        Ses cornes s’illuminent lorsqu’il fait tourner ses bras
        pour générer de l’électricité.
      de: |-
        Wenn es seine Arme kreisen lässt, um Strom
        zu erzeugen, entstehen zwischen seinen Hörnern
        hellblaue Funken.
      es: |-
        Al girar ambos brazos para generar electricidad, sus
        cuernos se iluminan con una luz blanquecina.
      it: |-
        Quando rotea le braccia per produrre elettricità, le
        sue corna si illuminano.
    omega-ruby:
      ja-Hrkt: |-
        きんぞくに　さわって　からだに　ためた　でんきが
        ほうでん　してしまうと　りょううでを　ぐるぐる
        まわして　ふたたび　でんきを　ためる。
      ja: |-
        金属に　触って　体に　ためた　電気が
        放電　してしまうと　両腕を　ぐるぐる
        回して　再び　電気を　ためる。
      ko: |-
        금속을 만져서 몸에 모은 전기가
        방전돼버리면 양손을 빙글빙글
        돌려서 다시 전기를 모은다.
      en: |-
        Elekid stores electricity in its body. If it touches metal and
        accidentally discharges all its built-up electricity, this Pokémon
        begins swinging its arms in circles to recharge itself.
      fr: |-
        Élekid stocke de l’électricité dans son corps. S’il touche
        du métal et décharge sans le faire exprès son électricité,
        ce Pokémon fait des cercles avec ses bras pour se recharger.
      de: |-
        Elekid speichert Elektrizität in seinem Körper. Wenn es Metall
        berührt und versehentlich die aufgestaute Energie entlädt,
        rotiert es mit den Armen, um sich wieder aufzuladen.
      es: |-
        Elekid acumula electricidad. Si entra en contacto con algo de
        metal y descarga accidentalmente toda la electricidad
        almacenada, empieza a agitar los brazos en círculo para volver
        a cargarse.
      it: |-
        Elekid immagazzina elettricità nel corpo. Se, a contatto
        col metallo, scarica accidentalmente l’elettricità accumulata,
        inizia a far oscillare gli arti superiori con movimenti circolari
        per ricaricarsi.
    alpha-sapphire:
      ja-Hrkt: |-
        きんぞくに　さわって　からだに　ためた　でんきが
        ほうでん　してしまうと　りょううでを　ぐるぐる
        まわして　ふたたび　でんきを　ためる。
      ja: |-
        金属に　触って　体に　ためた　電気が
        放電　してしまうと　両腕を　ぐるぐる
        回して　再び　電気を　ためる。
      ko: |-
        금속을 만져서 몸에 모은 전기가
        방전돼버리면 양손을 빙글빙글
        돌려서 다시 전기를 모은다.
      en: |-
        Elekid stores electricity in its body. If it touches metal and
        accidentally discharges all its built-up electricity, this Pokémon
        begins swinging its arms in circles to recharge itself.
      fr: |-
        Élekid stocke de l’électricité dans son corps. S’il touche
        du métal et décharge sans le faire exprès son électricité,
        ce Pokémon fait des cercles avec ses bras pour se recharger.
      de: |-
        Elekid speichert Elektrizität in seinem Körper. Wenn es Metall
        berührt und versehentlich die aufgestaute Energie entlädt,
        rotiert es mit den Armen, um sich wieder aufzuladen.
      es: |-
        Elekid acumula electricidad. Si entra en contacto con algo de
        metal y descarga accidentalmente toda la electricidad
        almacenada, empieza a agitar los brazos en círculo para volver
        a cargarse.
      it: |-
        Elekid immagazzina elettricità nel corpo. Se, a contatto
        col metallo, scarica accidentalmente l’elettricità accumulata,
        inizia a far oscillare gli arti superiori con movimenti circolari
        per ricaricarsi.
    sun:
      ja-Hrkt: |-
        いえに　いるときは　コンセントが
        ほにゅうびん　がわり。　でんきを
        ちゅうちゅう　すってるよ。
      ja: |-
        家に　いるときは　コンセントが
        ほ乳びん　代わり。　電気を
        ちゅうちゅう　吸ってるよ。
      ko: |-
        집에 있을 때는 콘센트가
        젖병 대신이다. 전기를
        쪽쪽 빨고 있다.
      zh-Hant: |-
        在家的時候，插座就相當於奶瓶。
        會啜啜地吸取電力哦。
      zh-Hans: |-
        在家的时候，插座就相当于奶瓶。
        可以从中滋滋地吸取电力哦。
      en: |-
        When it’s in a house, electrical outlets serve as
        its baby bottles. It sucks down electricity.
      fr: |-
        Ce Pokémon « tète » les prises électriques
        des maisons comme s’il s’agissait de biberons
        de lait, et ce jusqu’au dernier ampère.
      de: |-
        Daheim hängt es an der Steckdose wie an
        einem Babyfläschchen und nuckelt genüsslich
        den Strom.
      es: |-
        Cuando está en una casa, usa los enchufes de
        la pared a modo de biberones. Le encanta
        chupar electricidad.
      it: |-
        Quando si trova in una casa, succhia l’energia
        elettrica attaccandosi alle prese di corrente.
    moon:
      ja-Hrkt: |-
        でんきを　うばいにきた　トゲデマルと
        しょっちゅう　ケンカ。　けっかは
        だいたい　ごかくと　いった　ところ。
      ja: |-
        電気を　奪いにきた　トゲデマルと
        しょっちゅう　ケンカ。　結果は
        大体　互角と　いった　ところ。
      ko: |-
        전기를 빼앗으러 온
        토게데마루와 늘 싸운다.
        결과는 거의 무승부.
      zh-Hant: |-
        常常跟來搶奪電力的
        托戈德瑪爾打架。
        結果通常是不分上下。
      zh-Hans: |-
        与过来抢夺电的托戈德玛尔经常发生斗殴。
        胜负大体上可以说是不相上下。
      en: |-
        This Pokémon is constantly fighting with
        Togedemaru that try to steal its electricity.
        It’s a pretty even match.
      fr: |-
        Togedemaru et lui se disputent les mêmes
        sources d’électricité. Leurs combats
        se terminent souvent par une égalité.
      de: |-
        Es muss sich oft mit Togedemaru herumärgern,
        das ihm Strom klauen will. Ihre Raufereien enden
        jedoch meist unentschieden.
      es: |-
        Los Togedemaru siempre intentan robarles la
        electricidad, lo que suele terminar en combates
        muy reñidos.
      it: |-
        Spesso si azzuffa con i Togedemaru che
        entrano in casa per rubare l’energia elettrica.
        In genere, i loro scontri finiscono in parità.
    ultra-sun:
      ja-Hrkt: |-
        かみなりの　おちる　おとを　きくと
        ごきげん。　おちこんだときの　ために
        ろくおん　しておくと　べんりだよ。
      ja: |-
        雷の　落ちる　音を　聞くと
        ご機嫌。　落ち込んだときの　ために
        録音　しておくと　便利だよ。
      ko: |-
        번개 소리를 들으면 기분이 좋아진다.
        우울해질 때를 대비해서
        녹음해 두면 편리하다.
      zh-Hant: |-
        聽到打雷的聲音就會很高興。
        如果能先把打雷的聲音錄下來，
        當牠心情低落的時候會很好用。
      zh-Hans: |-
        听到打雷的声音会很高兴。如果事先
        将打雷的声音录下来，那么在它消沉的
        时候就能很方便地放给它听了哦。
      en: |-
        When it hears the crash of thunder, Elekid’s
        mood improves. It can be useful to record that
        sound and play it when Elekid’s feeling down.
      fr: |-
        Il adore le bruit de la foudre. Si vous
        l’enregistrez, vous pouvez le lui diffuser
        à loisir pour le mettre de bonne humeur.
      de: |-
        Elekid freut sich, wenn es Donner hört. Es lohnt
        sich, das Geräusch aufzunehmen und es ihm
        vorzuspielen, wenn es mal schlecht drauf ist.
      es: |-
        El ruido de los truenos le mejora el ánimo.
        Conviene tener a mano una grabación para
        cuando esté en horas bajas.
      it: |-
        Il rombo dei tuoni lo mette di buon umore, perciò
        è utile averne una registrazione a portata
        di mano per quando è triste.
    ultra-moon:
      ja-Hrkt: |-
        ツノが　あおじろく　ひかったときが
        じゅうでん　かんりょうの　サイン。
        さわると　ビリリと　しびれるぞ。
      ja: |-
        ツノが　青白く　光ったときが
        充電　完了の　サイン。
        触ると　ビリリと　痺れるぞ。
      ko: |-
        뿔이 푸르스름하게 빛날 때가
        충전이 완료되었다는 신호다.
        만지면 찌릿하게 저리다.
      zh-Hant: |-
        當角發出青白色亮光時，
        就代表充電已經完成了。
        如果去摸就會被電到麻痺。
      zh-Hans: |-
        当角发出青白色亮光时，
        就表示充电已经完成了。
        如果去摸，就会被电得麻麻的。
      en: |-
        When its horns shine a bluish white, that’s the
        sign it’s fully charged. You’ll get a shocking
        jolt if you touch it!
      fr: |-
        Lorsqu’il est chargé à bloc, ses cornes émettent
        une lueur bleuâtre. Attention à ne pas les
        toucher ou vous risquez l’électrocution !
      de: |-
        Seine Hörner leuchten weiß-blau, wenn es sich
        fertig aufgeladen hat. Fasst man es dann an,
        bekommt man einen Schlag und wird gelähmt.
      es: |-
        Cuando se carga de electricidad, sus cuernos
        emiten una luz blanquecina. Quien lo toque
        recibirá un potente calambrazo.
      it: |-
        Quando le corna si illuminano di una luce
        biancastra dalle sfumature blu, è carico di
        elettricità. Chi lo tocca rimane fulminato.
    sword:
      ja-Hrkt: |-
        あらしが　ちかづくと　おちつきが
        なくなる。　かみなりの　おとが
        きこえると　たまらず　さわぎだす。
      ja: |-
        嵐が　近づくと　落ち着きが
        なくなる。　雷の　音が　聞こえると
        たまらず　騒ぎだす。
      ko: |-
        폭풍우가 다가오면 안절부절못한다.
        천둥소리가 들리면
        참지 못하고 동요하기 시작한다.
      zh-Hant: |-
        暴風雨靠近時就會變得
        坐立難安。一聽到打雷聲，
        就會按捺不住地吵鬧起來。
      zh-Hans: |-
        一旦暴风雨将至
        就会变得非常浮躁。
        听到雷鸣便会难掩兴奋。
      en: |-
        When a storm approaches, this Pokémon gets
        restless. Once Elekid hears the sound of thunder,
        it gets full-on rowdy.
      fr: |-
        Il ne tient plus en place quand un orage
        approche. Lorsqu’il entend le tonnerre
        gronder, il devient tout excité.
      de: |-
        Nähert sich ein Sturm, wird Elekid unruhig.
        Sobald es Donnergrollen hört, ist es nicht
        mehr zu halten und fängt an zu toben.
      es: |-
        Cuando se acerca una tormenta, pierde la
        compostura. Si oye el sonido de un trueno,
        no se puede contener y monta un revuelo.
      it: |-
        Quando si sta per scatenare una tempesta perde
        il controllo. Si fa prendere dall’agitazione
        se sente il rombo dei tuoni.
    shield:
      ja-Hrkt: |-
        まだ　でんきを　ためるのが　へた。
        でんきを　たべるために　みんかに
        しのびこみ　コンセントを　さがす。
      ja: |-
        まだ　電気を　溜めるのが　下手。
        電気を　食べるために　民家に
        忍びこみ　コンセントを　探す。
      ko: |-
        아직 전기를 모으는 게 서툴다.
        전기를 먹기 위해 민가에
        숨어들어 콘센트를 찾는다.
      zh-Hant: |-
        還不擅長儲存電力。
        為了吸食電力，會偷偷
        潛入民宅尋找插座。
      zh-Hans: |-
        储存电力的本领还不到家。
        为了吸取电力，会偷偷
        潜入民宅寻找插座。
      en: |-
        It’s not good at storing electricity yet. This
        Pokémon sneaks into people’s homes, looking
        for electrical outlets to eat electricity from.
      fr: |-
        Il a encore du mal à emmagasiner l’électricité.
        Pour s’en nourrir, il se faufile dans les maisons
        à la recherche de prises électriques.
      de: |-
        Es kann Elektrizität noch nicht so gut speichern.
        Um sich diese einzuverleiben, schleicht es sich
        auf der Suche nach Steckdosen in fremde Häuser.
      es: |-
        No se le da bien acumular electricidad, por lo
        que se cuela en las casas en busca de enchufes
        para alimentarse.
      it: |-
        Non è ancora abile nell’immagazzinare elettricità.
        Si intrufola nelle abitazioni in cerca di prese
        di corrente, che sfrutta per nutrirsi.
