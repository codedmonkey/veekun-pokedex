zorua:
  base_happiness: 50
  capture_rate: 75
  color: gray
  egg_groups:
    - ground
  evolution_chain: zorua
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        It changes into the forms of others
        to surprise them. Apparently, it
        often transforms into a silent child.
      fr: |-
        Il a le pouvoir de prendre l’apparence
        des autres. On dit qu’il se transforme
        souvent en petit enfant silencieux.
    white:
      en: |-
        To protect themselves from danger,
        they hide their true identities by
        transforming into people and Pokémon.
      fr: |-
        Il peut se transformer en humain ou en
        d’autres Pokémon. Il se protège du
        danger en dissimulant sa vraie identité.
    black-2:
      en: |-
        It changes so it looks just
        like its foe, tricks it, and then
        uses that opportunity to flee.
    white-2:
      en: |-
        It changes so it looks just
        like its foe, tricks it, and then
        uses that opportunity to flee.
    x:
      ja-Hrkt: |-
        あいてそっくりに　ばけているように
        みせかけ　だましたり　おどろかして
        そのすきに　にげだすことが　おおい。
      ja: |-
        相手そっくりに　化けているように
        みせかけ　だましたり　驚かして
        そのすきに　逃げ出すことが　多い。
      ko: |-
        상대와 똑 닮게 둔갑한 것처럼
        보이게 하여 속이거나 놀라게 해서
        그 틈에 도망가는 일이 많다.
      en: |-
        It changes so it looks just like its foe, tricks it, and
        then uses that opportunity to flee.
      fr: |-
        Il prend l’apparence de son adversaire pour le
        désorienter et prendre la fuite grâce à la confusion
        causée.
      de: |-
        Nicht selten überrumpelt es Gegner, indem es ihre
        Gestalt annimmt und den Überraschungseffekt zur
        Flucht nutzt.
      es: |-
        Adopta la apariencia de su enemigo para engañarlo
        vilmente y aprovecha su estupor para poner tierra por
        medio.
      it: |-
        Inganna spesso il nemico assumendone la forma e
        lasciandolo esterrefatto, per poi darsi alla fuga.
    'y':
      ja-Hrkt: |-
        ひとや　ほかの　ポケモンに　ばける。
        じぶんの　しょうたいを　かくすことで
        きけんから　みを　まもっているのだ。
      ja: |-
        人や　ほかの　ポケモンに　化ける。
        自分の　正体を　隠すことで
        危険から　身を　守っているのだ。
      ko: |-
        사람이나 다른 포켓몬으로 둔갑한다.
        자신의 정체를 감추어
        위험으로부터 몸을 지키는 것이다.
      en: |-
        To protect themselves from danger, they hide their
        true identities by transforming into people
        and Pokémon.
      fr: |-
        Il peut se transformer en humain ou en d’autres
        Pokémon. Il se protège du danger en dissimulant
        sa vraie identité.
      de: |-
        Es tarnt sich als Mensch oder als andere Pokémon.
        Es schützt sich vor Gefahren, indem es seine wahre
        Gestalt geheim hält.
      es: |-
        Se transforma en humanos o en otros Pokémon.
        Se defiende del peligro ocultando su verdadera
        apariencia.
      it: |-
        Si protegge dai pericoli trasformandosi in essere
        umano o in un altro Pokémon, nascondendo così la
        sua vera identità.
    omega-ruby:
      ja-Hrkt: |-
        あいてそっくりに　ばけているように
        みせかけ　だましたり　おどろかして
        そのすきに　にげだすことが　おおい。
      ja: |-
        相手そっくりに　化けているように
        みせかけ　だましたり　驚かして
        そのすきに　逃げ出すことが　多い。
      ko: |-
        상대와 똑 닮게 둔갑한 것처럼
        보이게 하여 속이거나 놀라게 해서
        그 틈에 도망가는 일이 많다.
      en: |-
        It changes so it looks just like its foe, tricks it, and
        then uses that opportunity to flee.
      fr: |-
        Il prend l’apparence de son adversaire pour le désorienter
        et prendre la fuite grâce à la confusion causée.
      de: |-
        Nicht selten überrumpelt es Gegner, indem es ihre Gestalt
        annimmt und den Überraschungseffekt zur Flucht nutzt.
      es: |-
        Adopta la apariencia de su enemigo para engañarlo vilmente y
        aprovecha su estupor para poner tierra por medio.
      it: |-
        Inganna spesso il nemico assumendone la forma e lasciandolo
        esterrefatto, per poi darsi alla fuga.
    alpha-sapphire:
      ja-Hrkt: |-
        ひとや　ほかの　ポケモンに　ばける。
        じぶんの　しょうたいを　かくすことで
        きけんから　みを　まもっているのだ。
      ja: |-
        人や　ほかの　ポケモンに　化ける。
        自分の　正体を　隠すことで
        危険から　身を　守っているのだ。
      ko: |-
        사람이나 다른 포켓몬으로 둔갑한다.
        자신의 정체를 감추어
        위험으로부터 몸을 지키는 것이다.
      en: |-
        To protect themselves from danger, they hide their
        true identities by transforming into people
        and Pokémon.
      fr: |-
        Il peut se transformer en humain ou en d’autres Pokémon.
        Il se protège du danger en dissimulant sa vraie identité.
      de: |-
        Es tarnt sich als Mensch oder als andere Pokémon. Es schützt
        sich vor Gefahren, indem es seine wahre Gestalt geheim hält.
      es: |-
        Se transforma en humanos o en otros Pokémon. Se defiende
        del peligro ocultando su verdadera apariencia.
      it: |-
        Si protegge dai pericoli trasformandosi in essere umano o in
        un altro Pokémon, nascondendo così la sua vera identità.
    ultra-sun:
      ja-Hrkt: |-
        おくびょうな　せいしつの　ポケモンで
        なかまと　いるとき　いがいは　ほぼ
        ほかの　だれかに　ばけている。
      ja: |-
        臆病な　性質の　ポケモンで
        仲間と　いるとき　以外は　ほぼ
        他の　誰かに　化けている。
      ko: |-
        겁이 많은 포켓몬으로
        동료와 있을 때 말고는 거의
        다른 누군가로 둔갑하고 있다.
      zh-Hant: |-
        性情膽小的寶可夢。
        除了和夥伴待在一起的時候之外，
        通常都會幻化成其他東西。
      zh-Hans: |-
        性格胆小的宝可梦，
        不和伙伴呆在一起的时候，
        通常都会幻化成其他东西。
      en: |-
        This Pokémon has a cowardly disposition, so
        when it’s not around friends, it basically
        always stays transformed as something else.
      fr: |-
        Timide de nature, il change constamment
        d’apparence, sauf quand il est entouré de
        ses congénères.
      de: |-
        Ein furchtsames Pokémon, das die Gestalt eines
        anderen annimmt, wenn es sich nicht in der
        Gesellschaft seiner Artgenossen befindet.
      es: |-
        Es tan miedoso que, cuando no se halla junto a
        sus compañeros, casi siempre adopta un
        aspecto distinto.
      it: |-
        È un Pokémon molto timido. Quando non è
        circondato dai suoi simili, assume sembianze
        diverse dalle quelle abituali.
    ultra-moon:
      ja-Hrkt: |-
        ふだん　おしゃべりな　こどもが
        むくちに　なった　ときは　ゾロアが
        いれかわって　いるかも　しれないよ。
      ja: |-
        普段　おしゃべりな　子どもが
        無口に　なった　ときは　ゾロアが
        入れ替わって　いるかも　しれないよ。
      ko: |-
        평소에 수다스러운 아이가
        과묵해졌다면 조로아가
        둔갑한 것일지도 모른다.
      zh-Hant: |-
        平常很愛說話的孩子
        如果突然變得很沉默，
        就有可能是索羅亞假扮的。
      zh-Hans: |-
        平时很爱说话的孩子
        如果突然不说话了，
        或许是被索罗亚替换了哦。
      en: |-
        If a normally talkative child suddenly stops
        talking, it may have been replaced by Zorua.
      fr: |-
        Si un enfant volubile a soudain perdu sa langue,
        méfiez-vous ! C’est peut-être un Zorua qui
        a pris son apparence...
      de: |-
        Wenn man einem normalerweise geschwätzigen
        Kind begegnet, das plötzlich keinen Ton mehr
        spricht, könnte es ein verwandeltes Zorua sein.
      es: |-
        Si un niño parlanchín se vuelve taciturno, tal vez
        pueda tratarse en realidad de un Zorua que ha
        adoptado su aspecto.
      it: |-
        Se un bambino chiacchierone diventa di colpo
        taciturno, potrebbe essere in realtà uno Zorua
        che ne ha preso le sembianze.
    sword:
      ja-Hrkt: |-
        なにかに　ばける　のうりょくを
        みに　つけたのは　おくびょうな
        せいしつの　えいきょう　らしい。
      ja: |-
        なにかに　化ける　能力を
        身に　つけたのは　臆病な
        性質の　影響らしい。
      ko: |-
        무언가로 둔갑하는 능력을
        익힌 것은 겁이 많은
        성질의 영향인 듯하다.
      zh-Hant: |-
        似乎是因為性情膽小，
        因此學會了幻化成
        其他模樣的能力。
      zh-Hans: |-
        之所以学会了幻化成
        其他东西的能力，似乎是
        因为它的性格比较胆小。
      en: |-
        Zorua is a timid Pokémon. This disposition seems
        to be what led to the development of Zorua’s
        ability to take on the forms of other creatures.
      fr: |-
        À cause de sa timidité, il aurait développé
        la capacité de changer son apparence.
      de: |-
        Durch seine furchtsame Natur lernte es wohl,
        seine Gestalt zu ändern.
      es: |-
        Al parecer, fue su carácter miedoso lo que le
        llevó a desarrollar la capacidad de transformarse.
      it: |-
        Pare che abbia sviluppato l’abilità di alterare le
        sue sembianze per via della sua natura timorosa.
    shield:
      ja-Hrkt: |-
        エサを　もとめて　ひとに　ばけ
        まちに　あらわれることも　あるぞ。
        おもに　こどもに　ばけている。
      ja: |-
        エサを　もとめて　人に　化け
        町に　現れることも　あるぞ。
        おもに　子どもに　化けている。
      ko: |-
        먹이를 찾아 사람으로 둔갑하여
        마을에 나타나기도 한다.
        주로 아이로 둔갑한다.
      zh-Hant: |-
        為了尋找食物，有時還會
        幻化成人類出現在城鎮裡。
        通常都會變成小孩子。
      zh-Hans: |-
        为了寻找食物，有时甚至会
        幻化成人类出现在城镇里。
        多数情况下会幻化成小孩。
      en: |-
        Zorua sometimes transforms into a person and
        goes into cities to search for food. When Zorua
        does this, it usually takes on the form of a child.
      fr: |-
        Il lui arrive de se changer en être humain,
        surtout en enfant, pour venir chercher
        de la nourriture en ville.
      de: |-
        Auf der Suche nach Nahrung verschlägt es Zorua
        manchmal auch in Städte. Dort tarnt es sich
        üblicherweise als Menschenkind.
      es: |-
        Suele transformarse en personas, sobre todo en
        niños, y se adentra en pueblos buscando comida.
      it: |-
        Quando è in cerca di cibo, capita persino che
        appaia in città assumendo sembianze umane.
        Si trasforma principalmente in bambini.
