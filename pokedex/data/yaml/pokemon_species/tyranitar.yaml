    black-2:
      en: |-
        The quakes caused when it walks
        make even great mountains crumble
        and change the surrounding terrain.
    white-2:
      en: |-
        The quakes caused when it walks
        make even great mountains crumble
        and change the surrounding terrain.
    x:
      ja-Hrkt: |-
        かたうでを　うごかしただけで
        やまをくずし　じひびきを　おこす
        とてつもない　パワーを　ひめる。
      ja: |-
        片腕を　動かしただけで
        山を崩し　地響きを　起こす
        とてつもない　パワーを　秘める。
      ko: |-
        한쪽 팔을 움직이는 것만으로도
        산을 무너뜨리고 땅을 울리게 하는
        엄청난 힘을 감추고 있다.
      en: |-
        In just one of its mighty hands, it has the power to
        make the ground shake and mountains crumble.
      fr: |-
        D’une main seulement il a assez de force pour faire
        trembler la terre et s’écrouler une montagne.
      de: |-
        Es besitzt so viel Kraft, dass es mit nur einer Hand
        die Erde beben lassen und Berge zerbröckeln kann.
      es: |-
        En una de sus poderosas garras tiene el poder de
        hacer temblar la tierra y las montañas.
      it: |-
        Anche una sola delle sue mani può far tremare
        la terra e sbriciolare le montagne.
    'y':
      ja-Hrkt: |-
        バンギラスが　あばれると
        やまが　くずれ　かわが　うまるため
        ちずを　かきかえる　ことになる。
      ja: |-
        バンギラスが　暴れると
        山が　崩れ　川が　埋まるため
        地図を　書き換える　ことになる。
      ko: |-
        마기라스가 난동을 부리면
        산이 무너지고 강이 메워지므로
        지도를 다시 그려야 한다.
      en: |-
        If it rampages, it knocks down mountains and buries
        rivers. Maps must be redrawn afterward.
      fr: |-
        Lorsqu’il est en colère, il abat des montagnes et
        enterre des fleuves. On doit alors modifier les cartes.
      de: |-
        Bei einem Tobsuchtsanfall zerstört es ganze Gebirge
        und legt Flüsse trocken.
      es: |-
        Puede alterar el paisaje derribando montañas y
        enterrando ríos. Da mucho trabajo a los cartógrafos.
      it: |-
        Se s’infuria, abbatte le montagne e seppellisce i
        fiumi. In seguito, le mappe devono essere riscritte.
    omega-ruby:
      ja-Hrkt: |-
        じぶんの　すみかを　つくる　ために　やま　ひとつ
        くずしてしまう　ほどの　つよい　パワーを　もつ。
        たたかう　あいてを　もとめて　やまを　さまよう。
      ja: |-
        自分の　すみかを　つくる　ために　山を　一つ
        崩してしまう　ほどの　強い　パワーを　持つ。
        戦う　相手を　求めて　山を　さまよう。
      ko: |-
        자신의 거처를 만들기 위해 산 하나를
        부숴버릴 정도로 강한 파워를 지녔다.
        싸울 상대를 찾아 산을 떠돈다.
      en: |-
        Tyranitar is so overwhelmingly powerful, it can bring down a
        whole mountain to make its nest. This Pokémon wanders about
        in mountains seeking new opponents to fight.
      fr: |-
        Tyranocif est si incroyablement puissant qu’il peut abattre
        une montagne pour y faire son nid. Ce Pokémon se promène
        dans les montagnes pour y trouver de nouveaux adversaires.
      de: |-
        Despotar ist erstaunlich stark. Es kann einen ganzen Berg
        vernichten, um sein Nest zu bauen. Dieses Pokémon wandert
        in den Bergen umher und sucht nach Gegnern für einen Kampf.
      es: |-
        Tyranitar tiene una fuerza imponente; es capaz de echar abajo
        una montaña para hacer su nido. Este Pokémon suele
        merodear por las zonas de montaña en busca de nuevos
        rivales contra los que luchar.
      it: |-
        Tyranitar ha una potenza tale da abbattere anche un’intera
        montagna per crearsi la tana. Vaga tra i monti alla ricerca
        di nuovi avversari con cui lottare.
    alpha-sapphire:
      ja-Hrkt: |-
        じぶんの　すみかを　つくる　ために　やま　ひとつ
        くずしてしまう　ほどの　つよい　パワーを　もつ。
        たたかう　あいてを　もとめて　やまを　さまよう。
      ja: |-
        自分の　すみかを　つくる　ために　山を　一つ
        崩してしまう　ほどの　強い　パワーを　持つ。
        戦う　相手を　求めて　山を　さまよう。
      ko: |-
        자신의 거처를 만들기 위해 산 하나를
        부숴버릴 정도로 강한 파워를 지녔다.
        싸울 상대를 찾아 산을 떠돈다.
      en: |-
        Tyranitar is so overwhelmingly powerful, it can bring down a
        whole mountain to make its nest. This Pokémon wanders about
        in mountains seeking new opponents to fight.
      fr: |-
        Tyranocif est si incroyablement puissant qu’il peut abattre
        une montagne pour y faire son nid. Ce Pokémon se promène
        dans les montagnes pour y trouver de nouveaux adversaires.
      de: |-
        Despotar ist erstaunlich stark. Es kann einen ganzen Berg
        vernichten, um sein Nest zu bauen. Dieses Pokémon wandert
        in den Bergen umher und sucht nach Gegnern für einen Kampf.
      es: |-
        Tyranitar tiene una fuerza imponente; es capaz de echar abajo
        una montaña para hacer su nido. Este Pokémon suele
        merodear por las zonas de montaña en busca de nuevos
        rivales contra los que luchar.
      it: |-
        Tyranitar ha una potenza tale da abbattere anche un’intera
        montagna per crearsi la tana. Vaga tra i monti alla ricerca
        di nuovi avversari con cui lottare.
    ultra-sun:
      ja-Hrkt: |-
        たたかう　あいてを　もとめて　やまを
        さまよう。　であっても　かくしたが
        あいてだと　むしして　さっていく。
      ja: |-
        戦う　相手を　求めて　山を
        さ迷う。　出会っても　格下が
        相手だと　無視して　去っていく。
      ko: |-
        싸울 상대를 찾아 산을 떠돈다.
        만나도 격이 떨어지는
        상대라고 무시하고 떠나간다.
      zh-Hant: |-
        會在山中徘徊尋找對手來戰鬥，
        但如果遇到的是比自己弱小的對手，
        牠就會視若無睹地離開。
      zh-Hans: |-
        会在山中徘徊以寻求战斗对手。
        但如果遇到的是比自己弱小的对手，
        它就会视若无睹地离开。
      en: |-
        It wanders through the mountains seeking
        opponents to fight. If it finds an opponent that’s
        not worthy, Tyranitar ignores it and wanders on.
      fr: |-
        Il parcourt les montagnes à la recherche d’un
        adversaire. Si ce dernier n’est pas à la hauteur,
        il préfère l’ignorer et s’en aller.
      de: |-
        Es durchstreift die Berge auf der Suche nach
        Gegnern. Begegnet es einem, der ihm nicht
        ebenbürtig ist, ignoriert es ihn und zieht weiter.
      es: |-
        Recorre las montañas en busca de rivales para
        combatir. Si juzga que no están a su altura, los
        ignora y pasa de largo.
      it: |-
        Vaga tra i monti alla ricerca di avversari con
        cui lottare. Se però non li ritiene alla sua altezza,
        li ignora e se ne va.
    ultra-moon:
      ja-Hrkt: |-
        すすむ　みちの　まえに　やまが
        あれば　くずし　いえが　あれば
        はかいする　うごく　さいがいポケモン。
      ja: |-
        進む　道の　前に　山が
        あれば　崩し　家が　あれば
        破壊する　動く　災害ポケモン。
      ko: |-
        앞길에 산이 있으면 무너뜨리고
        집이 있으면 파괴하는
        걸어다니는 재해 포켓몬이다.
      zh-Hant: |-
        這種寶可夢是會移動的災害。
        在牠前進的道路上，不管是
        山還是房屋都會被破壞殆盡。
      zh-Hans: |-
        在前进的道路上，
        它会遇山毁山，遇楼拆楼，
        是一种会移动的灾害型宝可梦。
      en: |-
        This Pokémon is a mobile disaster, leaving
        mountains crumbled and houses destroyed in
        its wake.
      fr: |-
        Aucun obstacle n’arrête ce Pokémon lorsqu’il
        se déplace : les montagnes, il les démolit ;
        les maisons, il les anéantit.
      de: |-
        Dieses Pokémon ist ein wandelndes Desaster.
        Berge, die ihm im Weg stehen, reißt es ein und
        Häuser macht es dem Erdboden gleich.
      es: |-
        Nada puede parar a este Pokémon cuando se
        mueve: derriba montañas, arrasa edificios y
        destroza todo lo que se le ponga por delante.
      it: |-
        Provoca disastri non appena si muove.
        Se sul suo cammino incontra una montagna,
        la spiana, e se trova una casa la distrugge.
    sword:
      ja-Hrkt: |-
        どんな　こうげきにも　びくともしない
        からだを　もっているため
        どんどん　しょうぶを　しかけてくる。
      ja: |-
        どんな　攻撃にも　びくともしない
        体を　もっているため
        どんどん　勝負を　仕掛けてくる。
      ko: |-
        어떤 공격에도 꿈쩍도 하지 않는
        몸을 가졌기 때문에
        자꾸 승부를 걸어온다.
      zh-Hant: |-
        擁有無論遭受任何攻擊
        都能毫髮無傷的身體，
        因此會不斷向對手挑戰。
      zh-Hans: |-
        拥有无论遭到任何攻击
        都能毫发无伤的身体，
        因此会不断向对手挑战。
      en: |-
        Its body can’t be harmed by any sort of attack,
        so it is very eager to make challenges
        against enemies.
      fr: |-
        Son corps est invulnérable à toutes les attaques,
        c’est pourquoi il aime tant mettre ses forces
        à l’épreuve.
      de: |-
        Dank seines starken Körpers fürchtet es sich vor
        keiner Form von Angriff. Deshalb zettelt es
        ununterbrochen Kämpfe an.
      es: |-
        Casi ningún ataque hace mella en su cuerpo, por
        lo que le encanta desafiar a sus enemigos.
      it: |-
        Il suo corpo non è scalfito da alcun attacco,
        perciò sfida un avversario dietro l’altro senza
        esitazione.
    shield:
      ja-Hrkt: |-
        じひびきを　ならしながら　あるくと
        おおきな　やまでさえ　くずれ
        まわりの　ちけいは　かわってしまう。
      ja: |-
        地響きを　鳴らしながら　歩くと
        大きな　山でさえ　崩れ
        まわりの　地形は　変わってしまう。
      ko: |-
        지축을 울리면서 걸으면
        큰 산조차 무너지며
        주변의 지형은 변해버린다.
      zh-Hant: |-
        當牠帶著巨大轟鳴聲邁開腳步，
        就連大山都會為之崩裂，
        周遭的地形也會因而改變。
      zh-Hans: |-
        当它带着巨大轰鸣声迈开脚步，
        就连大山都会为之崩裂，
        周围的地形也会因此改变。
      en: |-
        The quakes caused when it walks make even
        great mountains crumble and change
        the surrounding terrain.
      fr: |-
        Son pas est si lourd qu’il fait trembler le sol
        et s’écrouler même les plus grandes montagnes,
        ce qui altère la topographie de la zone.
      de: |-
        Seine Schritte erzeugen Erdbeben, die selbst
        große Berge plätten und die Form ganzer
        Landstriche verändern.
      es: |-
        Sus estrepitosos pasos derrumban montañas
        y hacen que el terreno a su alrededor cambie
        drásticamente.
      it: |-
        Può camminare a passi così pesanti da far
        crollare perfino le montagne più grosse,
        trasformando così il paesaggio circostante.
