    white-2:
      en: |-
        Its legs are short. Whenever it
        stumbles, its stiff antennae clack
        with a xylophone-like sound.
    x:
      ja-Hrkt: |-
        しょっかくを　ぶつけあって　ならす
        おとで　なかまと　かいわをする。
        ねいろは　あきの　よの　ふうぶつし。
      ja: |-
        触覚を　ぶつけ合って　鳴らす　音で
        仲間と　会話をする。
        音色は　秋の　夜の　風物詩。
      ko: |-
        더듬이를 서로 부딪쳐 내는
        소리로 동료와 대화한다. 음색은
        가을밤의 정취를 잘 나타낸다.
      en: |-
        It chats with others using the sounds of its colliding
        antennae. These sounds are fall hallmarks.
      fr: |-
        Il communique au son de ses antennes qui
        s’entrechoquent. Ce son marque l’arrivée de
        l’automne.
      de: |-
        Diese Pokémon unterhalten sich, indem sie ihre
        Antennen aneinanderschlagen. Der Ton ist ihr
        Kennzeichen.
      es: |-
        Hablan entre sí chocando las antenas. Los sonidos
        producidos son muy característicos.
      it: |-
        Comunica con il suono prodotto dallo scontro delle
        sue antenne. Esso indica l’arrivo dell’autunno.
    'y':
      ja-Hrkt: |-
        しょっかく　どうしが　ぶつかると
        コロン　コロンと　もっきんに　にた
        ねいろを　かなでる。
      ja: |-
        触覚　同士が　ぶつかると
        コロン　コロンと　木琴に　似た
        音色を　奏でる。
      ko: |-
        더듬이가 서로 부딪히면
        딩동딩동 실로폰 같은
        음색을 연주한다.
      en: |-
        When its antennae hit each other, it sounds like the
        music of a xylophone.
      fr: |-
        Quand ses antennes s’entrechoquent, elles laissent
        échapper un bruit de xylophone.
      de: |-
        Wenn seine zwei Antennen sich berühren,
        erklingt ein Ruf wie das Spiel eines Xylophons.
      es: |-
        Si choca sus antenas, emite un sonido similar al de
        un xilófono.
      it: |-
        Le antenne, scontrandosi, producono un suono
        simile allo xilofono: klon, klon!
    omega-ruby:
