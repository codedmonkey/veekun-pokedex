woobat:
  base_happiness: 50
  capture_rate: 190
  color: blue
  egg_groups:
    - flying
    - ground
  evolution_chain: woobat
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        Its habitat is dark forests and caves.
        It emits ultrasonic waves from its
        nose to learn about its surroundings.
      fr: |-
        Il vit dans les forêts sombres et les
        grottes. Il émet des ultrasons par
        le nez pour se diriger.
    white:
      en: |-
        Suction from its nostrils enables it to
        stick to cave walls during sleep. It
        leaves a heart-shaped mark behind.
      fr: |-
        Il s’accroche aux murs des cavernes en
        se servant de son nez comme ventouse.
        Il y laisse une trace en forme de cœur.
    black-2:
      en: |-
        The heart-shaped mark left on a body
        after a Woobat has been attached to it
        is said to bring good fortune.
    white-2:
      en: |-
        The heart-shaped mark left on a body
        after a Woobat has been attached to it
        is said to bring good fortune.
    x:
      ja-Hrkt: |-
        くらい　もりや　ほらあなで　くらす。
        はなの　あなから　ちょうおんぱを
        だして　あたりの　ようすを　さぐる。
      ja: |-
        暗い　森や　洞穴で　暮らす。
        鼻の　穴から　超音波を　出して
        あたりの　様子を　探る。
      ko: |-
        어두운 숲이나 동굴에서 산다.
        콧구멍에서 초음파를 쏘아
        주변의 모습을 살핀다.
      en: |-
        Its habitat is dark forests and caves. It emits
        ultrasonic waves from its nose to learn about
        its surroundings.
      fr: |-
        Il vit dans les forêts sombres et les grottes. Il émet
        des ultrasons par le nez pour se diriger.
      de: |-
        Wohnt in dunklen Wäldern und Höhlen. Es sendet
        Ultraschallwellen mit seiner Nase aus, um die
        Gegend abzutasten.
      es: |-
        Vive en bosques oscuros y cavernas. Emite
        ultrasonidos por la nariz para saber todo lo que
        pasa a su alrededor.
      it: |-
        Vive nelle foreste buie o nelle caverne. Sonda
        l’ambiente circostante emettendo degli ultrasuoni
        dalle narici.
    'y':
      ja-Hrkt: |-
        コロモリの　はなを　おしつけた
        ところに　ハートがたの　あとがつくと
        いいことが　おこると　いわれている。
      ja: |-
        コロモリの　鼻を　押しつけた
        ところに　ハート形の　跡がつくと
        いいことが　起こると　言われている。
      ko: |-
        또르박쥐의 코가 닿은 곳에
        하트 모양의 자국이 나면
        좋은 일이 일어난다고 전해진다.
      en: |-
        The heart-shaped mark left on a body after a
        Woobat has been attached to it is said to bring
        good fortune.
      fr: |-
        Son nez est comme une ventouse. Il laisse une
        marque en forme de cœur qui, paraît-il, porte bonheur.
      de: |-
        Es verheißt Glück, wenn sich ein Fleknoil an einem
        Menschen festsaugt und auf ihm einen herzförmigen
        Fleck hinterlässt.
      es: |-
        Se dice que la marca con forma de corazón que deja
        un Woobat al incrustar su nariz trae buena suerte.
      it: |-
        Quando preme il naso contro il corpo di qualcuno
        lascia un segno a forma di cuore che, dicono, porta
        fortuna.
    omega-ruby:
      ja-Hrkt: |-
        くらい　もりや　ほらあなで　くらす。
        はなの　あなから　ちょうおんぱを
        だして　あたりの　ようすを　さぐる。
      ja: |-
        暗い　森や　洞穴で　暮らす。
        鼻の　穴から　超音波を　出して
        あたりの　様子を　探る。
      ko: |-
        어두운 숲이나 동굴에서 산다.
        콧구멍에서 초음파를 쏘아
        주변의 모습을 살핀다.
      en: |-
        Its habitat is dark forests and caves. It emits
        ultrasonic waves from its nose to learn about
        its surroundings.
      fr: |-
        Il vit dans les forêts sombres et les grottes. Il émet
        des ultrasons par le nez pour se diriger.
      de: |-
        Wohnt in dunklen Wäldern und Höhlen. Es sendet
        Ultraschallwellen mit seiner Nase aus, um die Gegend
        abzutasten.
      es: |-
        Vive en bosques oscuros y cavernas. Emite ultrasonidos por
        la nariz para saber todo lo que pasa a su alrededor.
      it: |-
        Vive nelle foreste buie o nelle caverne. Sonda l’ambiente
        circostante emettendo degli ultrasuoni dalle narici.
    alpha-sapphire:
      ja-Hrkt: |-
        コロモリの　はなを　おしつけた
        ところに　ハートがたの　あとがつくと
        いいことが　おこると　いわれている。
      ja: |-
        コロモリの　鼻を　押しつけた
        ところに　ハート形の　跡がつくと
        いいことが　起こると　言われている。
      ko: |-
        또르박쥐의 코가 닿은 곳에
        하트 모양의 자국이 나면
        좋은 일이 일어난다고 전해진다.
      en: |-
        The heart-shaped mark left on a body after a
        Woobat has been attached to it is said to bring
        good fortune.
      fr: |-
        Son nez est comme une ventouse. Il laisse une marque
        en forme de cœur qui, paraît-il, porte bonheur.
      de: |-
        Es verheißt Glück, wenn sich ein Fleknoil an einem Menschen
        festsaugt und auf ihm einen herzförmigen Fleck hinterlässt.
      es: |-
        Se dice que la marca con forma de corazón que deja un
        Woobat al incrustar su nariz trae buena suerte.
      it: |-
        Quando preme il naso contro il corpo di qualcuno lascia un
        segno a forma di cuore che, dicono, porta fortuna.
    sword:
      ja-Hrkt: |-
        どうくつを　みあげて　かべに
        ハートがたの　あとが　あれば
        コロモリが　すんでいる　しょうこ。
      ja: |-
        洞窟を　見上げて　壁に
        ハート型の　跡が　あれば
        コロモリが　棲んでいる　証拠。
      ko: |-
        동굴을 올려다봤을 때 벽에
        하트 모양 자국이 있다면
        또르박쥐가 살고 있다는 증거다.
      zh-Hant: |-
        在洞窟中，如果抬頭看到
        牆壁上留著心形的痕跡，
        就代表滾滾蝙蝠住在那裡。
      zh-Hans: |-
        在洞窟中，如果抬头看到
        墙壁上留着心形的痕迹，
        就代表滚滚蝙蝠住在那里。
      en: |-
        While inside a cave, if you look up and see lots
        of heart-shaped marks lining the walls, it’s
        evidence that Woobat live there.
      fr: |-
        La présence de marques en forme de cœur
        sur les parois des grottes indique la présence
        de Chovsourir à l’intérieur.
      de: |-
        Herzförmige Flecken an der Decke einer Höhle
        sind ein sicheres Zeichen dafür, dass sie von
        Fleknoil behaust wird.
      es: |-
        Si al alzar la vista en una cueva se ven marcas
        con forma de corazón en las paredes, es señal
        de que Woobat la ha convertido en su guarida.
      it: |-
        Se alzando lo sguardo in una grotta si vedono
        impronte a forma di cuore sulle pareti, è segno
        che vi abitano dei Woobat.
    shield:
      ja-Hrkt: |-
        ちょうおんぱを　はなちながら
        フラフラと　とびまわり　エサの
        むしポケモンを　さがしている。
      ja: |-
        超音波を　放ちながら
        フラフラと　飛びまわり　エサの
        虫ポケモンを　探している。
      ko: |-
        초음파를 발산하면서
        흔들흔들 날아다닌다.
        먹이인 벌레포켓몬을 찾고 있다.
      zh-Hant: |-
        一邊發出超音波，一邊
        飛來飛去尋找蟲寶可夢
        來填飽自己的肚子。
      zh-Hans: |-
        一边发出超音波，一边
        飞来飞去寻找虫宝可梦
        来填饱自己的肚子。
      en: |-
        It emits ultrasonic waves as it flutters about,
        searching for its prey—bug Pokémon.
      fr: |-
        Il virevolte gaiement et émet des ultrasons
        pour trouver des Pokémon Insecte à grignoter.
      de: |-
        Es fliegt umher und sendet Ultraschallwellen aus,
        um Käfer-Pokémon aufzuspüren, welche ihm als
        Nahrung dienen.
      es: |-
        Emite ultrasonidos mientras revolotea en busca
        de los Pokémon insecto con los que se sustenta.
      it: |-
        Svolazza emettendo ultrasuoni in cerca
        di Pokémon di tipo Coleottero, di cui si nutre.
