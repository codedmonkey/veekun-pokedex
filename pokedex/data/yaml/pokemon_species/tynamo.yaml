tynamo:
  base_happiness: 70
  capture_rate: 190
  color: white
  egg_groups:
    - indeterminate
  evolution_chain: tynamo
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        While one alone doesn’t have much power,
        a chain of many Tynamo can be as
        powerful as lightning.
      fr: |-
        Tout seuls, ils ne dégagent pas beaucoup
        d’électricité, mais un banc d’Anchwatt
        produit la même puissance qu’un éclair.
    white:
      en: |-
        These Pokémon move in schools. They
        have an electricity-generating organ, so
        they discharge electricity if in danger.
      fr: |-
        Ils agissent en groupes. Ils possèdent
        un organe produisant de l’électricité et
        lancent des décharges en cas de danger.
    black-2:
      en: |-
        One alone can emit only a trickle of
        electricity, so a group of them gathers
        to unleash a powerful electric shock.
    white-2:
      en: |-
        One alone can emit only a trickle of
        electricity, so a group of them gathers
        to unleash a powerful electric shock.
    x:
      ja-Hrkt: |-
        １ぴきの　でんりょくは　ちいさいが
        たくさんの　シビシラスが　つながると
        カミナリと　おなじ　いりょくになる。
      ja: |-
        １匹の　電力は　小さいが
        たくさんの　シビシラスが　つながると
        雷と　同じ　威力になる。
      ko: |-
        한 마리의 전력은 적지만
        많은 저리어가 연결되면
        번개와 같은 위력이 된다.
      en: |-
        While one alone doesn’t have much power, a chain
        of many Tynamo can be as powerful as lightning.
      fr: |-
        Tout seuls, ils ne dégagent pas beaucoup
        d’électricité, mais un banc d’Anchwatt produit la
        même puissance qu’un éclair.
      de: |-
        Allein erzeugt es nur wenig Strom, doch tritt es
        geschlossen im Schwarm auf, gleicht seine Kraft
        der eines Blitzes.
      es: |-
        La electricidad de uno solo es diminuta, pero, si
        multitud de Tynamo se conectan, consiguen la
        potencia de un rayo.
      it: |-
        La carica elettrica di un Tynamo è debole, ma se
        più esemplari si uniscono raggiungono la potenza
        di un fulmine.
    'y':
      ja-Hrkt: |-
        よわい　でんきしか　だせないので
        たくさんの　シビシラスで　あつまり
        きょうりょくな　でんきを　はなつ。
      ja: |-
        弱い　電気しか　だせないので
        たくさんの　シビシラスで　集まり
        強力な　電気を　放つ。
      ko: |-
        약한 전기밖에 낼 수 없어
        많은 저리어가 모여서
        강력한 전기를 발산한다.
      en: |-
        One alone can emit only a trickle of electricity,
        so a group of them gathers to unleash a powerful
        electric shock.
      fr: |-
        Tout seul, il ne dégage pas beaucoup d’électricité.
        Mais un banc d’Anchwatt produit des décharges
        surpuissantes.
      de: |-
        Alleine erzeugen sie nur geringe Mengen an
        Elektrizität, aber im Schwarm können sie
        mächtige Stromsalven abfeuern.
      es: |-
        Apenas puede generar energía por sí mismo, pero un
        banco de Tynamo puede crear violentas descargas
        eléctricas.
      it: |-
        Da soli producono poca elettricità, per cui formano
        dei grossi branchi se vogliono lanciare una scossa
        più potente.
    omega-ruby:
      ja-Hrkt: |-
