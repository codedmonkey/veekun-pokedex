clawitzer:
  base_happiness: 50
  capture_rate: 55
  color: blue
  egg_groups:
    - water1
    - water3
  evolution_chain: clauncher
  evolves_from: clauncher
  flavor_text:
    x:
      ja-Hrkt: |-
        みずの　ほうだんを　はっしゃする
        きょだいな　ハサミを　もつ。
        タンカーの　せんたいを　うちぬくぞ。
      ja: |-
        水の　砲弾を　発射する
        巨大な　腕を　持つ。
        タンカーの　船体を　撃ち抜くぞ。
      ko: |-
        물 포탄을 발사하는
        거대한 집게발을 지녔다.
        유조선의 선체를 뚫어 버린다.
      en: |-
        Their enormous claws launch cannonballs of
        water powerful enough to pierce tanker hulls.
      fr: |-
        Son énorme pince projette de véritables obus d’eau
        capables de transpercer la coque d’un pétrolier.
      de: |-
        Aus seinen gewaltigen Scheren feuert es
        mächtige Wassergeschosse ab, die selbst
        den Rumpf eines Tankschiffes durchdringen.
      es: |-
        Posee una enorme pinza que dispara bolas de agua
        que podrían atravesar incluso el casco de un petrolero.
      it: |-
        Ha un’enorme chela che spara proiettili d’acqua
        in grado di sfondare lo scafo di un transatlantico.
    'y':
      ja-Hrkt: |-
        ハサミの　うしろの　ノズルから
        みずを　ふきだす　すいしんりょくで
        ６０ノットの　スピードで　すすむ。
      ja: |-
        ハサミの　後ろの　ノズルから
        水を　噴き出す　推進力で
        ６０ノットの　スピードで　進む。
      ko: |-
        집게 뒤의 노즐에서
        물을 뿜어내는 추진력으로
        60노트의 스피드로 나아간다.
      en: |-
        By expelling water from the nozzle in the back
        of its claw, it can move at a speed of 60 knots.
      fr: |-
        La force de propulsion générée par l’expulsion de
        l’eau via la tuyère située à l’arrière de sa pince peut
        lui conférer une vitesse de 60 nœuds.
      de: |-
        Indem es über die Düsen am hinteren Ende seiner
        Scheren Wasser absondert, kann es sich mit einer
        Geschwindigkeit von 60 Knoten fortbewegen.
      es: |-
        El chorro de agua que dispara la tobera situada en la
        parte trasera de su pinza le permite avanzar a una
        velocidad de 60 nudos.
      it: |-
        Espellendo acqua da un foro dietro la chela riesce
        a muoversi alla velocità di 60 nodi.
    omega-ruby:
      ja-Hrkt: |-
        みずの　ほうだんを　はっしゃする
        きょだいな　ハサミを　もつ。
        タンカーの　せんたいを　うちぬくぞ。
      ja: |-
        水の　砲弾を　発射する
        巨大な　腕を　持つ。
        タンカーの　船体を　撃ち抜くぞ。
      ko: |-
        물 포탄을 발사하는
        거대한 집게발을 지녔다.
        유조선의 선체를 뚫어 버린다.
      en: |-
        Their enormous claws launch cannonballs of
        water powerful enough to pierce tanker hulls.
      fr: |-
        Son énorme pince projette de véritables obus d’eau capables
        de transpercer la coque d’un pétrolier.
      de: |-
        Aus seinen gewaltigen Scheren feuert es mächtige
        Wassergeschosse ab, die selbst den Rumpf eines
        Tankschiffes durchdringen.
      es: |-
        Posee una enorme pinza que dispara bolas de agua que
        podrían atravesar incluso el casco de un petrolero.
      it: |-
        Ha un’enorme chela che spara proiettili d’acqua in grado
        di sfondare lo scafo di un transatlantico.
    alpha-sapphire:
      ja-Hrkt: |-
        ハサミの　うしろの　ノズルから
        みずを　ふきだす　すいしんりょくで
        ６０ノットの　スピードで　すすむ。
      ja: |-
        ハサミの　後ろの　ノズルから
        水を　噴き出す　推進力で
        ６０ノットの　スピードで　進む。
      ko: |-
        집게 뒤의 노즐에서
        물을 뿜어내는 추진력으로
        60노트의 스피드로 나아간다.
      en: |-
        By expelling water from the nozzle in the back
        of its claw, it can move at a speed of 60 knots.
      fr: |-
        La force de propulsion générée par l’expulsion de l’eau
        via la tuyère située à l’arrière de sa pince peut lui conférer
        une vitesse de 60 nœuds.
      de: |-
        Indem es über die Düsen am hinteren Ende seiner Scheren
        Wasser absondert, kann es sich mit einer Geschwindigkeit
        von 60 Knoten fortbewegen.
      es: |-
        El chorro de agua que dispara la tobera situada en la parte
        trasera de su pinza le permite avanzar a una velocidad de
        60 nudos.
      it: |-
        Espellendo acqua da un foro dietro la chela riesce a muoversi
        alla velocità di 60 nodi.
    ultra-sun:
      ja-Hrkt: |-
        とりこんだ　みずを　あっしゅくして
        うちだす。　ぶあつい　てっぱんに
        あなを　あけるほどの　いりょくだ。
      ja: |-
        取り込んだ　水を　圧縮して
        撃ちだす。　分厚い　鉄板に
        穴を　開けるほどの　威力だ。
      ko: |-
        빨아들인 물을 압축해 쏜다.
        두꺼운 철판에
        구멍을 뚫을 정도로 위력적이다.
      zh-Hant: |-
        會將吸入體內的水
        壓縮之後發射出去，威力足以
        在厚厚的鐵板上打穿一個洞。
      zh-Hans: |-
        压缩吸入的水，然后射出去。
        那威力连很厚的铁板都能
        打穿一个洞。
      en: |-
        It compresses the water it has sucked up and
        then projects it with enough power to punch a
        hole right through a thick sheet of iron.
      fr: |-
        Il aspire de l’eau et la projette sous pression
        pour attaquer. Le jet est si puissant qu’il perce
        même d’épaisses plaques d’acier.
      de: |-
        Es saugt Wasser auf und feuert dieses mit
        hohem Druck als Strahl ab. Dieser ist so stark,
        dass er dicke Eisenplatten durchlöchern kann.
      es: |-
        Comprime el agua que traga y la convierte en
        proyectiles de tal potencia que atraviesan
        incluso gruesas placas de metal.
      it: |-
        Assorbe acqua che comprime e rilascia in un
        getto con una pressione tale da perforare
        anche spesse lastre d’acciaio.
    ultra-moon:
      ja-Hrkt: |-
        みぎうでの　みは　よくしまっている。
        もげた　ハサミは　しょくざい　として
        かいがいに　ゆしゅつ　される。
      ja: |-
        右腕の　身は　よく締まっている。
        もげた　ハサミは　食材　として
        海外に　輸出　される。
      ko: |-
        오른팔의 속살은 꽉 차 있다.
        떨어진 집게는 식재료로써
        해외에 수출된다.
      zh-Hant: |-
        右臂的肉非常緊實飽滿。
        脫落下來的鉗子會被
        當成食材外銷到海外。
      zh-Hans: |-
        右臂非常紧实饱满。
        掉落下来的钳子作为食材
        被销往海外。
      en: |-
        Its right arm is packed with meat. When its
        pincer falls off, it’s exported to be used as a
        cooking ingredient.
      fr: |-
        La chair de sa pince droite est très ferme.
        Les pinces tombées sont vendues à l’étranger
        comme ingrédients de cuisine.
      de: |-
        Das Fleisch in seiner rechten Schere ist sehr
        fest. Wenn sie abfällt, wird sie aufgesammelt
        und zum Verzehr ins Ausland exportiert.
      es: |-
        La pinza de su extremidad derecha es muy
        robusta. Cuando se les caen, se recogen para
        exportarlas como ingrediente culinario.
      it: |-
        La polpa della chela destra è molto soda.
        Quelle che si staccano vengono esportate come
        prodotti alimentari.
    sword:
      ja-Hrkt: |-
        きょだいな　ハサミの　しょっかくで
        えものの　いばしょを　かんちして
        みずの　ほうだんを　はっしゃする。
      ja: |-
        巨大な　ハサミの　触角で
        獲物の　居場所を　感知して
        水の　砲弾を　発射する。
      ko: |-
        거대한 집게의 더듬이로
        먹이가 있는 곳을 감지해
        물 폭탄을 발사한다.
      zh-Hant: |-
        能夠利用巨大鉗子的
        觸角探測獵物的位置，
        然後發射水砲彈。
      zh-Hans: |-
        通过巨大钳子的触角
        感知猎物的位置，
        然后对其发射水炮弹。
      en: |-
        After using the feelers on its oversized claw to
        detect the location of prey, Clawitzer launches
        a cannonball of water at its target.
      fr: |-
        Il projette des obus d’eau sur ses ennemis après
        les avoir localisés grâce aux antennes situées sur
        son énorme pince.
      de: |-
        Mit den Antennen an seiner gigantischen Schere
        erfasst es, wo sich seine Beute aufhält, und feuert
        dann Wassergeschosse auf sie ab.
      es: |-
        Las antenas de su enorme pinza le permiten
        detectar la posición de sus presas para luego
        acribillarlas a cañonazos con bolas de agua.
      it: |-
        Individua la preda con le antenne della
        sua enorme chela e la attacca sparando
        proiettili d’acqua.
    shield:
      ja-Hrkt: |-
        みぎうでは　かいすいの　ほうだんを
        はっしゃする　たいほう。　タンカーを
        しずめてしまうほどの　いりょくだ。
      ja: |-
        右腕は　海水の　砲弾を
        発射する　大砲。　タンカーを
        沈めてしまうほどの　威力だ。
      ko: |-
        오른팔은 해수 포탄을
        발사하는 대포다. 유조선을
        가라앉게 할 정도의 위력이다.
      zh-Hant: |-
        右臂是能夠發射海水
        砲彈的大砲。威力之強，
        甚至能夠擊沉油輪。
      zh-Hans: |-
        右臂是能够喷射
        海水炮弹的大炮。
        威力大到足以击沉油轮。
      en: |-
        Clawitzer’s right arm is a cannon that launches
        projectiles made of seawater. Shots from a
        Clawitzer’s cannon arm can sink a tanker.
      fr: |-
        Sa pince droite est un canon pouvant projeter
        des obus d’eau assez puissants pour couler
        un navire-citerne.
      de: |-
        Mit seiner rechten Schere, die ihm als Kanone
        dient, feuert es Geschosse aus Meerwasser ab,
        die selbst Tankschiffe versenken können.
      es: |-
        Con el cañón de su brazo derecho dispara
        proyectiles de agua marina con tanta potencia
        que son capaces de hundir un petrolero.
      it: |-
        L’arto destro è una sorta di cannone da cui
        spara proiettili d’acqua marina tanto potenti
        da affondare una petroliera.
