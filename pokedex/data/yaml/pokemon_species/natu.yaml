        deftly avoiding buds and spines.
        It seems to skip about to move.
    white-2:
      en: |-
        It picks food from cactus plants,
        deftly avoiding buds and spines.
        It seems to skip about to move.
    x:
      ja-Hrkt: |-
        はねが　そだちきって　おらず
        とびはねるようにして　いどうする。
        いつも　なにかを　みつめている。
      ja: |-
        羽が　育ちきって　おらず
        飛び跳ねるようにして　移動する。
        いつも　なにかを　見つめている。
      ko: |-
        날개가 아직 잘 발달하지 못해서
        뛰어오르는 것처럼 이동한다.
        항상 뭔가를 바라보고 있다.
      en: |-
        Because its wings aren’t yet fully grown, it has
        to hop to get around. It is always staring
        at something.
      fr: |-
        Ses ailes ne sont pas assez développées et il ne peut
        que planer péniblement. Il fixe toujours quelque
        chose.
      de: |-
        Da seine Flügel nicht voll ausgebildet sind,
        bewegt es sich hüpfend. Es starrt immer etwas an.
      es: |-
        Va dando saltitos porque sus alas no han crecido lo
        suficiente. Siempre está pendiente de algo.
      it: |-
        Poiché le sue ali non sono ancora ben sviluppate,
        deve saltellare. Sembra fissare sempre qualcosa.
    'y':
      ja-Hrkt: |-
        ふだんは　ちじょうで　エサをさがすが
        ごくたまに　きのえだに　とびのって
        きのめを　ついばんだりする。
      ja: |-
        普段は　地上で　エサを　探すが
        ごくたまに　木の枝に　飛び乗って
        木の芽を　ついばんだりする。
      ko: |-
        보통은 지상에서 먹이를 찾지만
        극히 드물게 나뭇가지에 날아 앉아
        나무의 순을 쪼아 먹기도 한다.
      en: |-
        It usually forages for food on the ground but may,
        on rare occasions, hop onto branches to peck
        at shoots.
      fr: |-
        Il cherche sa nourriture par terre, mais quelquefois
        il grimpe aux arbres pour manger.
      de: |-
        Gewöhnlich sucht es am Boden nach Futter,
        aber manchmal springt es auch auf Äste,
        um dort zu suchen.
      es: |-
        Normalmente busca comida por el suelo. En raras
        ocasiones, salta a las ramas para picotear brotes.
      it: |-
        Di solito cerca il cibo per terra, ma in rare occasioni
        può saltare sui rami e beccare i germogli.
    omega-ruby:
      ja-Hrkt: |-
        はねが　まだ　そだって　いないので　とべない。
        めを　あわせると　じっと　みつめるが　あいてが
        すこしでも　うごくと　とびはねて　にげていく。
      ja: |-
        羽が　まだ　育って　いないので　飛べない。
        目を　合わせると　じっと　見つめるが　相手が
        少しでも　動くと　飛び跳ねて　逃げていく。
      ko: |-
        날개가 아직 자라지 않아 날 수 없다.
        눈을 마주치면 가만히 쳐다보지만 상대가
        조금이라도 움직이면 뛰어올라 도망간다.
      en: |-
        Natu cannot fly because its wings are not yet fully grown.
        If your eyes meet with this Pokémon’s eyes, it will stare back
        intently at you. But if you move even slightly, it will hop away
        to safety.
      fr: |-
        Natu ne peut pas voler, car ses ailes n’ont pas encore fini de
        grandir. Si ses yeux croisent le regard de quelqu’un d’autre,
        il reste immobile et concentré. Mais si la personne en question
        détourne son regard, il s’enfuit en lieu sûr.
      de: |-
        Natu kann nicht fliegen, da seine Flügel noch nicht
        ausgewachsen sind. Wenn du diesem Pokémon in die Augen
        schaust, starrt es dich konzentriert an. Wenn du dich aber
        bewegst, hüpft es weg, um sich in Sicherheit zu bringen.
      es: |-
        Natu no puede volar porque las alas no le han crecido lo
        suficiente. Si alguien cruza la mirada con él, se la devolverá
        fijamente, aunque, si hace el mínimo movimiento, huirá dando
        saltitos para ponerse a salvo.
      it: |-
        Natu non riesce a volare a causa delle ali non ancora
        totalmente sviluppate. Se lo si guarda negli occhi,
        ricambia lo sguardo, ma al primo movimento scappa via
        per mettersi al sicuro.
    alpha-sapphire:
      ja-Hrkt: |-
        ジャンプりょくの　はったつした　ポケモン。
        おとなの　せたけ　いじょうある　たかさの　えだに
        ひらりと　とびのり　きのめを　ついばむ。
      ja: |-
        ジャンプ力の　発達した　ポケモン。
        大人の　背丈　以上ある　高さの　枝に
        ひらりと　飛び乗り　木の芽を　ついばむ。
      ko: |-
        점프력이 발달한 포켓몬이다.
        어른 키 이상의 높이인 가지에
        훌쩍 날아 앉아 나무순을 쪼아 먹는다.
      en: |-
        Natu has a highly developed jumping ability. The Pokémon
        flaps and leaps onto tree branches that are taller than
        grown-up people to pick at the tree’s new shoots.
      fr: |-
        Natu est capable de sauter très haut. Ce Pokémon bat
        des ailes et saute sur les branches élevées des arbres
        pour en récupérer les bourgeons.
      de: |-
        Natu kann hervorragend springen. Dieses Pokémon schlägt
        mit den Flügeln und springt auf Äste, die höher liegen,
        als ein Erwachsener groß ist, um an die neuen Triebe eines
        Baumes zu kommen.
      es: |-
        Natu ha desarrollado tremendamente la habilidad de saltar.
        Este Pokémon aletea y da brinquitos por las ramas altas a las
        que no alcanza nadie para hacerse con los nuevos brotes
        de los árboles.
      it: |-
        Natu ha una spiccata attitudine al salto. È in grado di
        raggiungere con un balzo rami più alti di un adulto,
        e si ciba dei germogli di cui va ghiotto.
    ultra-sun:
      ja-Hrkt: |-
        まだ　とべないが　ジャンプりょくは
        ばつぐん。　たかい　きの　えだに
        とびあがり　きのめを　ついばむ。
      ja: |-
        まだ　飛べないが　ジャンプ力は
        抜群。　高い　木の　枝に
        飛び上がり　木の芽を　ついばむ。
      ko: |-
        아직 날 수 없지만, 점프력은
        상당하다. 높은 나뭇가지에
        뛰어올라 나무순을 쪼아 먹는다.
      zh-Hant: |-
        雖然還不會飛，
        但跳躍力超群，會跳上
        高處的樹枝去啄食樹芽。
      zh-Hans: |-
        虽然还无法飞行，但跳跃力超群。
        能跳上很高的树枝啄食树芽。
      en: |-
        Although it still can’t fly, its jumping power is
        outstanding. It jumps way up into trees and
        plucks the buds from the branches.
      fr: |-
        Bien qu’il ne sache pas encore voler, il peut
        sauter jusqu’aux plus hautes branches des
        arbres pour en picorer les bourgeons.
      de: |-
        Natu kann noch nicht fliegen, aber hervorragend
        springen. So erreicht es selbst hoch liegende
        Äste, an deren Knospen es dann pickt.
      es: |-
        Aún no puede volar, pero su increíble capacidad
        de salto le permite alcanzar las ramas de los
        árboles más altos y picotear los brotes tiernos.
      it: |-
        Non sa ancora volare, ma spiccando salti
        eccezionali riesce a raggiungere anche i rami
        più alti per cibarsi dei germogli che vi crescono.
    ultra-moon:
      ja-Hrkt: |-
        こちらを　じっと　かんさつするような
        まなざし。　ちょっとでも　ちかづくと
        ぴょんぴょん　はねて　にげていく。
      ja: |-
        こちらを　じっと　観察するような
        眼差し。　ちょっとでも　近付くと
        ぴょんぴょん　はねて　逃げていく。
      ko: |-
        이쪽을 가만히 관찰하는 듯한
        눈빛이다. 조금이라도 다가가면
        통통 튀어서 도망친다.
      zh-Hant: |-
        牠的眼神似乎一直在
        觀察著這裡。但只要稍微靠近，
        牠就會蹦蹦跳跳地逃開。
      zh-Hans: |-
        它的目光仿佛一直在
        观察着这里。只要稍有靠近，
        它就会一蹦一蹦地跳着逃开。
      en: |-
        The look in its eyes gives the impression that
        it’s carefully observing you. If you approach it,
        Natu will hop away.
      fr: |-
        Son regard fixe semble dévisager les gens.
        Il s’enfuit en sautillant à la moindre tentative
        d’approche.
      de: |-
        Sein durchdringender Blick scheint einen stets
        zu beobachten. Kommt man ihm auch nur ein
        bisschen näher, ergreift es hüpfend die Flucht.
      es: |-
        Con su penetrante mirada, parece estar en
        vigilancia constante. A la mínima que se le
        acercan, sale huyendo dando botes.
      it: |-
        Sembra osservare ciò che lo circonda con
        sguardo inquisitore. Se si accenna appena ad
        avvicinarsi, scappa via saltellando.
    sword:
      ja-Hrkt: |-
        きように　きのみきを　かけのぼる。
        えださきに　できた　あたらしい
        きのめを　このんで　ついばむ。
      ja: |-
        器用に　木の幹を　駆け登る。
        枝先に　できた　新しい
        木の芽を　好んで　ついばむ。
      ko: |-
        능숙하게 나무줄기를 타고 올라간다.
        가지 끝에 새로 자란
        나무순을 즐겨 먹는다.
      zh-Hant: |-
        能夠靈巧地跳上樹幹。
        喜歡在枝頭上啄食
        新長出來的嫩芽。
      zh-Hans: |-
        能够灵巧地跳上树干。
        喜欢在枝头上啄食
        新长出来的嫩芽。
      en: |-
        It is extremely good at climbing tree trunks and
        likes to eat the new sprouts on the trees.
      fr: |-
        Il est très doué pour grimper aux arbres et ainsi
        manger les bourgeons dont il raffole.
      de: |-
        Es ist ein hervorragender Kletterer. Besonders
        gern steigt es auf Bäume und frisst die jungen
        Triebe ab.
      es: |-
        Trepa con gran habilidad por el tronco de los
        árboles, donde aprovecha para picotear los
        brotes nuevos.
      it: |-
        È molto bravo ad arrampicarsi sui tronchi degli
        alberi per mangiare i germogli appena spuntati.
    shield:
      ja-Hrkt: |-
        はねが　そだちきって　おらず
        とびはねるようにして　いどうする。
        いつも　なにかを　みつめている。
      ja: |-
        羽が　育ちきって　おらず
        飛び跳ねるようにして　移動する。
        いつも　なにかを　見つめている。
      ko: |-
        날개가 아직 잘 발달하지 못해서
        점프하듯 이동한다.
        항상 뭔가를 바라보고 있다.
      zh-Hant: |-
        翅膀還沒有完全長好，
        所以只能一跳一跳地移動。
        一直在注視著什麼。
      zh-Hans: |-
        由于羽翼未丰，
        所以会跳着移动。
        一直在注视着什么。
      en: |-
        Because its wings aren’t yet fully grown, it has to
        hop to get around. It is always staring
        at something.
      fr: |-
        Ses ailes ne sont pas assez développées
        donc il ne peut se déplacer qu’en sautillant.
        Il fixe toujours quelque chose du regard.
      de: |-
        Da seine Flügel nicht voll ausgebildet sind,
        bewegt es sich hüpfend fort. Seinen Blick hat
        es stets starr auf ein Ziel gerichtet.
      es: |-
        Se desplaza dando saltitos porque sus alas no
        han crecido lo suficiente. Siempre está mirando
        algo fijamente.
      it: |-
        Poiché le sue ali non sono ancora ben sviluppate,
        è costretto ad andarsene in giro saltellando.
        Sembra sempre intento a fissare qualcosa.
