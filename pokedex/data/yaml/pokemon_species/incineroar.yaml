incineroar:
  base_happiness: 50
  capture_rate: 45
  color: red
  egg_groups:
    - ground
  evolution_chain: litten
  evolves_from: torracat
  flavor_text:
    sun:
      ja-Hrkt: |-
        そぼうで　みがってな　せいかく。
        きぶんが　のらなければ　トレーナーの
        めいれいも　へいきで　むしするぞ。
      ja: |-
        粗暴で　身勝手な　性格。
        気分が　乗らなければ　トレーナーの
        命令も　平気で　無視するぞ。
      ko: |-
        거칠고 제멋대로인 성격이다.
        기분이 내키지 않으면 트레이너의
        명령도 아무렇지 않게 무시한다.
      zh-Hant: |-
        性格粗魯又任性。
        心情不爽的時候，連訓練家的
        命令也會冷漠地無視。
      zh-Hans: |-
        性格粗鲁又任性。
        心情不爽的时候，连训练家的
        命令也会淡定地无视。
      en: |-
        This Pokémon has a violent, selfish disposition.
        If it’s not in the mood to listen, it will ignore its
        Trainer’s orders with complete nonchalance.
      fr: |-
        Un Pokémon brutal qui n’en fait qu’à sa tête.
        Selon son humeur du moment, il lui arrive
        d’ignorer sciemment les ordres de son Dresseur.
      de: |-
        Ein raues und selbstsüchtiges Pokémon.
        Wenn es keine Lust hat, ignoriert es auch
        schon mal die Befehle seines Trainers.
      es: |-
        Posee un carácter rudo y egoísta. Si un
        Entrenador no le cae en gracia, ignora sus
        órdenes con total impasibilidad.
      it: |-
        Ha un carattere aggressivo ed egoista.
        Se ha la luna storta, non si fa problemi
        a ignorare gli ordini del proprio Allenatore.
    moon:
      ja-Hrkt: |-
        きょうれつな　パンチや　キックを
        おみまいしたあと　へその　あたりから
        ほのおを　ふきだし　とどめを　さす。
      ja: |-
        強烈な　パンチや　キックを
        お見舞いしたあと　へその　あたりから
        炎を　吹き出し　止めを　刺す。
      ko: |-
        강렬한 펀치와 킥을
        가한 후 배꼽 부근에서
        불꽃을 뿜어내 마무리한다.
      zh-Hant: |-
        在使出猛烈的拳擊或腳踢後，
        會從肚臍周圍噴出火焰，
        將敵人一擊斃命。
      zh-Hans: |-
        在使出猛烈的拳击或脚踢后，
        会从肚脐周围喷出火焰，
        将敌人一击毙命。
      en: |-
        After hurling ferocious punches and flinging
        furious kicks, it finishes opponents off by
        spewing fire from around its navel.
      fr: |-
        Après avoir asséné une pluie de coups de pied
        et de poing à son adversaire, il l’asperge de
        flammes ardentes sortant de son nombril.
      de: |-
        Nach einer Reihe heftiger Schläge und Tritte
        schießt es Feuer aus seinem Bauchnabel,
        um dem Gegner den Garaus zu machen.
      es: |-
        Descarga ráfagas de demoledores puñetazos y
        patadas sobre sus rivales, a los que luego
        remata con las llamas que manan de su vientre.
      it: |-
        Stordisce il nemico con pugni e calci di grande
        potenza per poi metterlo KO con le fiammate
        che emette dal ventre.
    ultra-sun:
      ja-Hrkt: |-
        あらっぽく　わがままだが　かくしたを
        なぶることは　つまらないので　キライ。
        かくうえの　あいてに　やるきを　だす。
      ja: |-
        荒っぽく　わがままだが　格下を
        なぶることは　つまらないので　キライ。
        格上の　相手に　やる気を　出す。
      ko: |-
        거칠고 제멋대로지만 약한 상대를
        괴롭히는 것은 재미없어서 싫어한다.
        강한 상대에게 의욕을 보인다.
      zh-Hant: |-
        個性粗魯又任性，但討厭欺負弱小
        這種無聊的事，只有在面對
        強大對手時才會拿出幹勁。
      zh-Hans: |-
        性格暴躁又任性，
        但讨厌欺凌弱小这类无聊的事。
        对于强大的对手会拿出干劲来。
      en: |-
        Although it’s rough mannered and egotistical, it
        finds beating down unworthy opponents boring.
        It gets motivated for stronger opponents.
      fr: |-
        Un Pokémon brutal qui n’en fait qu’à sa tête.
        Selon son humeur du moment, il lui arrive parfois
        d’ignorer sciemment les ordres de son Dresseur.
      de: |-
        Es ist wild und egoistisch, aber Schwächere
        anzugreifen findet es langweilig und abstoßend.
        Nur gegen Stärkere kommt es richtig in Fahrt.
      es: |-
        Este Pokémon rudo y egoísta considera aburrido
        enfrentarse a un rival inferior a él y prefiere dar
        lo mejor de sí mismo contra rivales más fuertes.
      it: |-
        Pokémon rude ed egoista. Non gli piace
        prendersela con chi non è al suo livello e
        preferisce lottare con avversari più forti di lui.
    ultra-moon:
      ja-Hrkt: |-
        とうそうしんに　ひが　つくと
        こしの　まわりに　ある　ほのおも
        ひときわ　はげしく　もえあがる。
      ja: |-
        闘争心に　火が　つくと
        腰の　まわりに　ある　炎も
        ひと際　激しく　燃えあがる。
      ko: |-
        투쟁심에 불이 붙으면
        허리 주변에 있는 불꽃도
        한층 격렬하게 타오른다.
      zh-Hant: |-
        當牠燃起鬥志的時候，
        腰部周圍的火焰也會
        燃燒得特別猛烈。
      zh-Hans: |-
        如果燃起了斗志，腰周围的火焰
        也会燃烧得格外猛烈。
      en: |-
        When its fighting spirit is set alight, the flames
        around its waist become especially intense.
      fr: |-
        Les flammes autour de ses hanches brûlent
        d’une ardeur redoublée quand sa combativité
        s’embrase.
      de: |-
        Entbrennt sein Kampfeswille, lodern die Flammen
        um seine Hüfte noch heftiger auf.
      es: |-
        Cuanto mayor es su espíritu combativo, con más
        fuerza arden las llamas que rodean su cintura.
      it: |-
        Quando arde dalla voglia di lottare, anche
        le fiamme intorno alla vita bruciano più
        intensamente.
    sword:
      ja-Hrkt: |-
        せっし２０００どを　こえる　ほのおを
        へそから　ふきだす。　ルールむようの
        らんぼうな　たたかいが　とくい。
      ja: |-
        摂氏２０００度を　超える　炎を
        へそから　噴き出す。　ルール無用の
        乱暴な　戦いが　得意。
      ko: |-
        섭씨 2000도가 넘는 불꽃을
        배꼽에서 뿜어낸다. 규칙이 없는
        난폭한 싸움을 잘 한다.
      zh-Hant: |-
        會從自己的肚臍噴出
        攝氏２０００度以上的火焰。
        擅長沒有規則限制的粗暴戰鬥。
      zh-Hans: |-
        会从自己的肚脐喷出
        摄氏２０００度以上的火焰。
        擅长没有规则限制的粗暴战斗。
      en: |-
        It excels at violent, no-holds-barred battles.
        The temperature of the flames that issue from its
        navel exceeds 3,600 degrees Fahrenheit.
      fr: |-
        Les flammes qui émanent de son nombril
        dépassent les 2 000 °C. Il n’est jamais aussi
        à l’aise que lorsque tous les coups sont permis.
      de: |-
        Aus seinem Bauchnabel schießt es über 2 000 ºC
        heißes Feuer. Seine Spezialität sind Kämpfe, bei
        denen alle Regeln über Bord geworfen werden.
      es: |-
        Las llamas que libera por el ombligo superan los
        2000 °C. Su especialidad son los combates sin
        reglas ni restricciones.
      it: |-
        Le fiamme che fuoriescono dal suo ombelico
        superano i 2.000 ºC. Dà il meglio nelle lotte
        furiose e senza regole.
    shield:
      ja-Hrkt: |-
        らんぼうな　ふるまいも　めにつくが
        ちいさい　ポケモンを　たすける
        やさしい　いちめんも　もっている。
      ja: |-
        乱暴な　ふるまいも　目につくが
        小さい　ポケモンを　助ける
        優しい　一面も　もっている。
      ko: |-
        난폭한 거동이 눈에 띄지만
        작은 포켓몬을 도와주는
        상냥한 일면도 있다.
      zh-Hant: |-
        雖然行為舉止十分粗野，
        卻也有著會去幫助
        弱小寶可夢的溫柔一面。
      zh-Hans: |-
        虽然行为举止十分粗野，
        却也有着会去帮助
        弱小宝可梦的温柔一面。
      en: |-
        Incineroar’s rough and aggressive behavior is its
        most notable trait, but the way it helps out small
        Pokémon shows that it has a kind side as well.
      fr: |-
        Bien qu’il soit parfois brutal, il sait aussi
        se montrer attentionné en venant en aide
        aux petits Pokémon.
      de: |-
        Obwohl es sich auffällig rau und wild aufführt,
        hat es auch eine freundliche Seite an sich und
        hilft kleineren Pokémon aus Notlagen.
      es: |-
        A pesar de que a menudo se comporta de forma
        violenta, tiene un lado amable que se manifiesta
        cuando ayuda a Pokémon más pequeños.
      it: |-
        Manifesta di solito un comportamento violento,
        ma possiede un lato gentile che emerge quando
        aiuta i Pokémon più piccoli.
