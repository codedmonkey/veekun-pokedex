  flavor_text:
    diamond:
      en: |-
        Its impressive tusks are made of
        ice. The population thinned when it
        turned warm after the ice age.
    pearl:
      en: |-
        Its impressive tusks are made of
        ice. The population thinned when it
        turned warm after the ice age.
    platinum:
      en: |-
        A frozen one was dug up from
        soil dating back 10,000 years. It
        woke up to much amazement.
    heartgold:
      en: |-
        A frozen MAMOSWINE was dug from ice
        dating back 10,000 years. This Pokémon
        has been around a long, long, long time.
    soulsilver:
      en: |-
        It flourished worldwide during the
        ice age but its population declined when
        the masses of ice began to dwindle.
    black:
      en: |-
        A frozen one was dug up from
        soil dating back 10,000 years. It
        woke up to much amazement.
      fr: |-
        On a libéré un spécimen de sa prison
        glacée au bout de 10 000 ans.
        Il n’en revenait pas.
    white:
      en: |-
        A frozen one was dug up from
        soil dating back 10,000 years. It
        woke up to much amazement.
      fr: |-
        On a libéré un spécimen de sa prison
        glacée au bout de 10 000 ans.
        Il n’en revenait pas.
    black-2:
      en: |-
        When the temperature rose at
        the end of the ice age, most
        Mamoswine disappeared.
    white-2:
      en: |-
        When the temperature rose at
        the end of the ice age, most
        Mamoswine disappeared.
    x:
      ja-Hrkt: |-
        １まんねんまえの　こおりの　したから
        はっけんされた　ことも　あるほど
        おおむかしから　いた　ポケモン。
      ja: |-
        １万年前の　氷の　下から
        発見された　ことも　あるほど
        大昔から　いた　ポケモン。
      ko: |-
        1만 년 전의 얼음 밑에서
        발견된 적이 있을 정도로
        오랜 옛날부터 있었던 포켓몬이다.
      en: |-
        A frozen Mamoswine was dug from ice dating back
        10,000 years. This Pokémon has been around a
        long, long, long time.
      fr: |-
        Un Pokémon si vieux qu’on l’a découvert sous
        des glaces vieilles de 10 000 ans.
      de: |-
        Es existiert schon seit Urzeiten. Mamutel wurde
        sogar schon in 10 000 Jahre altem Eis gefunden.
      es: |-
        Ya existía en la antigüedad. Se encontró uno bajo
        hielo de hace más de 10 000 años.
      it: |-
        Un Pokémon antico al punto che ne sono stati ritrovati
        degli esemplari tra i ghiacci di 10.000 anni fa.
    'y':
      ja-Hrkt: |-
        こおりで　できた　りっぱな　キバ。
        ひょうがきが　おわり　あたたかく
        なったため　かずが　へってしまった。
      ja: |-
        氷で　できた　立派な　キバ。
        氷河期が　終わり　暖かく
        なったため　数が　減ってしまった。
      ko: |-
        얼음으로 만들어진 훌륭한 이빨이
        있다. 빙하기가 끝나고 따뜻해졌기
        때문에 수가 줄어들었다.
      en: |-
        Its impressive tusks are made of ice. The population
        thinned when it turned warm after the ice age.
      fr: |-
        Ses défenses spectaculaires sont glacées. Il a failli
        disparaître dans la canicule suivant l’ère glaciaire.
      de: |-
        Die beeindruckenden Stoßzähne dieser Pokémon sind
        aus Eis. Nach der Eiszeit nahm ihre Population ab.
      es: |-
        Sus impresionantes colmillos están hechos de hielo.
        Su población se redujo tras la glaciación.
      it: |-
        Ha enormi zanne di ghiaccio. La popolazione di
        questo Pokémon è diminuita alla fine dell’era glaciale.
    omega-ruby:
      ja-Hrkt: |-
        １まんねんまえの　こおりの　したから
        はっけんされた　ことも　あるほど
        おおむかしから　いた　ポケモン。
      ja: |-
        １万年前の　氷の　下から
        発見された　ことも　あるほど
        大昔から　いた　ポケモン。
      ko: |-
        1만 년 전의 얼음 밑에서
        발견된 적이 있을 정도로
        오랜 옛날부터 있었던 포켓몬이다.
      en: |-
        A frozen Mamoswine was dug from ice dating back
        10,000 years. This Pokémon has been around a
        long, long, long time.
      fr: |-
        Un Pokémon si vieux qu’on l’a découvert sous des glaces
        vieilles de 10 000 ans.
      de: |-
        Es existiert schon seit Urzeiten. Mamutel wurde sogar schon in
        10 000 Jahre altem Eis gefunden.
      es: |-
        Ya existía en la antigüedad. Se encontró uno bajo hielo de
        hace más de 10 000 años.
      it: |-
        Un Pokémon antico al punto che ne sono stati ritrovati
        degli esemplari tra i ghiacci di 10.000 anni fa.
    alpha-sapphire:
      ja-Hrkt: |-
        こおりで　できた　りっぱな　キバ。
        ひょうがきが　おわり　あたたかく
        なったため　かずが　へってしまった。
      ja: |-
        氷で　できた　立派な　キバ。
        氷河期が　終わり　暖かく
        なったため　数が　減ってしまった。
      ko: |-
        얼음으로 만들어진 훌륭한 이빨이
        있다. 빙하기가 끝나고 따뜻해졌기
        때문에 수가 줄어들었다.
      en: |-
        Its impressive tusks are made of ice. The population
        thinned when it turned warm after the ice age.
      fr: |-
        Ses défenses spectaculaires sont glacées. Il a failli disparaître
        dans la canicule suivant l’ère glaciaire.
      de: |-
        Die beeindruckenden Stoßzähne dieser Pokémon sind aus Eis.
        Nach der Eiszeit nahm ihre Population ab.
      es: |-
        Sus impresionantes colmillos están hechos de hielo.
        Su población se redujo tras la glaciación.
      it: |-
        Ha enormi zanne di ghiaccio. La popolazione di questo
        Pokémon è diminuita alla fine dell’era glaciale.
    sword:
      ja-Hrkt: |-
        １まんねんまえの　へきがにも
        えがかれている。　ぜつめつしたと
        かんがえられていた　じきもある。
      ja: |-
        １万年前の　壁画にも
        描かれている。　絶滅したと
        考えられていた　時期もある。
      ko: |-
        1만 년 전의 벽화에도
        그려져 있다. 멸종되었다고
        여겨지던 시기도 있었다.
      zh-Hant: |-
        在１萬年前的壁畫上也能見到
        牠的身影。曾有一段時期，
        人們認為牠已經滅絕了。
      zh-Hans: |-
        在1万年前的壁画上也能见到
        它的身影。曾有一段时期，
        人们认为它已经灭绝了。
      en: |-
        This Pokémon can be spotted in wall paintings
        from as far back as 10,000 years ago. For a
        while, it was thought to have gone extinct.
      fr: |-
        On le retrouve dessiné sur des fresques murales
        vieilles de 10 000 ans. On a cru pendant un temps
        que son espèce s’était éteinte.
      de: |-
        Sie sind schon auf 10 000 Jahre alten
        Wandmalereien abgebildet. Es gab Zeiten,
        in denen man sie für ausgestorben hielt.
      es: |-
        Aparece representado en pinturas rupestres de
        hace 10 000 años. Hubo un tiempo en el que se
        lo consideró extinto.
      it: |-
        Si trova raffigurato nelle pitture rupestri
        di 10.000 anni fa. Per un periodo si riteneva
        che fosse estinto.
    shield:
      ja-Hrkt: |-
        みためどおりの　ちからもち。
        こおりのキバは　さむくなるほど
        ふとく　ながく　りっぱに　なる。
      ja: |-
        見た目どおりの　力持ち。
        氷の牙は　寒くなるほど
        太く　長く　立派に　なる。
      ko: |-
        생긴 것처럼 힘이 장사다.
        얼음으로 된 엄니는 추울수록
        굵고 길어지면서 늠름해진다.
      zh-Hant: |-
        牠的力量就如外表那樣強大。
        天氣越是寒冷，牠的冰牙
        就會長得越粗、越長、越結實。
      zh-Hans: |-
        它的力量就如外表那样强大。
        天气越是寒冷，它的冰牙
        就会长得越粗、越长、越结实。
      en: |-
        It looks strong, and that’s exactly what it is.
        As the weather grows colder, its ice tusks
        grow longer, thicker, and more impressive.
      fr: |-
        Comme son physique le laisse deviner, il est très
        fort. La taille de ses défenses de glace augmente
        à mesure que la température baisse.
      de: |-
        Es ist so stark, wie es aussieht. Je kälter es ist,
        desto dicker, länger und beeindruckender werden
        seine Stoßzähne aus Eis.
      es: |-
        Es tan fuerte como parece. Cuanto más frío hace,
        más gruesos, largos e imponentes se vuelven sus
        colmillos de hielo.
      it: |-
        È forte, proprio come il suo aspetto lascia
        intendere. Più freddo fa, più spesse e lunghe
        diventano le sue zanne di ghiaccio.
    legends-arceus:
      en: |-
        This species reached its zenith during the period known as the
        ice age. I suspect that Hisui's frigid climate is in harmony with
        Mamoswine's constitution, thus awakening hidden potential.
