gothita:
  base_happiness: 50
  capture_rate: 200
  color: purple
  egg_groups:
    - humanshape
  evolution_chain: gothita
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        Their ribbonlike feelers increase their
        psychic power. They are always staring
        at something.
      fr: |-
        Concentre des pouvoirs psychiques dans
        ses antennes semblables à des rubans,
        et regarde fixement... mais quoi?
    white:
      en: |-
        They intently observe both Trainers and
        Pokémon. Apparently, they are looking
        at something that only Gothita can see.
      fr: |-
        Fixe les Pokémon et les Dresseurs du
        regard comme s’il y avait quelque chose
        que personne d’autre ne pouvait voir.
    black-2:
      en: |-
        It stares intently at everything.
        It can become so obsessed with
        watching that it doesn’t notice attacks.
    white-2:
      en: |-
        It stares intently at everything.
        It can become so obsessed with
        watching that it doesn’t notice attacks.
    x:
      ja-Hrkt: |-
        リボンのような　しょっかくで
        サイコパワーを　ぞうふくさせる。
        なにかを　じっと　みつめている。
      ja: |-
        リボンのような　触角で
        サイコパワーを　増幅させる。
        なにかを　じっと　見つめている。
      ko: |-
        리본 모양의 더듬이로
        사이코 파워를 증폭시킨다.
        무언가를 가만히 바라보고 있다.
      en: |-
        Their ribbonlike feelers increase their psychic
        power. They are always staring at something.
      fr: |-
        Concentre des pouvoirs psychiques dans ses
        antennes semblables à des rubans, et regarde
        fixement… mais quoi ?
      de: |-
        Die schleifenförmigen Fühler erhöhen seine
        Psycho-Kräfte. Es scheint stets irgendetwas
        anzustarren.
      es: |-
        Amplifica su poder psíquico con sus antenitas en forma
        de lazo. Siempre está mirando algo fijamente.
      it: |-
        Amplifica i poteri psichici con le antenne a forma di
        fiocchetti. Il suo sguardo è sempre fisso.
    'y':
      ja-Hrkt: |-
        ポケモンや　トレーナーを　じっと
        かんさつする。ゴチムにしか　みえない
        なにかを　みつめているらしい。
      ja: |-
        ポケモンや　トレーナーを　じっと
        観察する。ゴチムにしか　見えない
        なにかを　見つめているらしい。
      ko: |-
        포켓몬이나 트레이너를 가만히
        관찰한다. 고디탱만 볼 수 있는
        무언가를 바라보고 있는 것 같다.
      en: |-
        They intently observe both Trainers and Pokémon.
        Apparently, they are looking at something that only
        Gothita can see.
      fr: |-
        Fixe les Pokémon et les Dresseurs du regard comme
        s’il y avait quelque chose que personne d’autre ne
        pouvait voir.
      de: |-
        Beobachtet andere Pokémon und Trainer mit
        durchdringendem Blick, als könne es etwas
        erkennen, das keiner sonst sieht.
      es: |-
        Clava su mirada en Pokémon y Entrenadores como
        si observara algo solo perceptible por él.
      it: |-
        Osserva con attenzione i Pokémon e gli Allenatori,
        come se contemplasse qualcosa che solo lui può
        vedere.
    omega-ruby:
      ja-Hrkt: |-
        リボンのような　しょっかくで
        サイコパワーを　ぞうふくさせる。
        なにかを　じっと　みつめている。
      ja: |-
        リボンのような　触角で
        サイコパワーを　増幅させる。
        なにかを　じっと　見つめている。
      ko: |-
        리본 모양의 더듬이로
        사이코 파워를 증폭시킨다.
        무언가를 가만히 바라보고 있다.
      en: |-
        Their ribbonlike feelers increase their psychic
        power. They are always staring at something.
      fr: |-
        Concentre des pouvoirs psychiques dans ses antennes
        semblables à des rubans, et regarde fixement… mais quoi ?
      de: |-
        Die schleifenförmigen Fühler erhöhen seine Psycho-Kräfte.
        Es scheint stets irgendetwas anzustarren.
      es: |-
        Amplifica su poder psíquico con sus antenitas en forma de
        lazo. Siempre está mirando algo fijamente.
      it: |-
        Amplifica i poteri psichici con le antenne a forma di fiocchetti.
        Il suo sguardo è sempre fisso.
    alpha-sapphire:
      ja-Hrkt: |-
        ポケモンや　トレーナーを　じっと
        かんさつする。ゴチムにしか　みえない
        なにかを　みつめているらしい。
      ja: |-
        ポケモンや　トレーナーを　じっと
        観察する。ゴチムにしか　見えない
        なにかを　見つめているらしい。
      ko: |-
        포켓몬이나 트레이너를 가만히
        관찰한다. 고디탱만 볼 수 있는
        무언가를 바라보고 있는 것 같다.
      en: |-
        They intently observe both Trainers and Pokémon.
        Apparently, they are looking at something that only
        Gothita can see.
      fr: |-
        Fixe les Pokémon et les Dresseurs du regard comme
        s’il y avait quelque chose que personne d’autre ne
        pouvait voir.
      de: |-
        Beobachtet andere Pokémon und Trainer mit durchdringendem
        Blick, als könne es etwas erkennen, das keiner sonst sieht.
      es: |-
        Clava su mirada en Pokémon y Entrenadores como si
        observara algo solo perceptible por él.
      it: |-
        Osserva con attenzione i Pokémon e gli Allenatori, come se
        contemplasse qualcosa che solo lui può vedere.
    sword:
      ja-Hrkt: |-
        まだまだ　あかちゃん　だけれど
        リボンに　にた　しょっかくに　ためた
        サイコパワーで　たたかうこともある。
      ja: |-
        まだまだ　赤ちゃん　だけれど
        リボンに　似た　触角に　溜めた
        サイコパワーで　戦うこともある。
      ko: |-
        아직 아기지만
        리본을 닮은 더듬이에 모아둔
        사이코 파워로 싸울 때도 있다.
      zh-Hant: |-
        雖然還是寶寶，有時也會
        用儲存在像蝴蝶結一樣的
        觸角裡的精神力量來戰鬥。
      zh-Hans: |-
        虽然还是宝宝，有时也会
        用储存在像蝴蝶结一样的
        触角里的精神力量来战斗。
      en: |-
        Though they’re still only babies, there’s psychic
        power stored in their ribbonlike feelers, and
        sometimes they use that power to fight.
      fr: |-
        Il n’est encore qu’un enfant, mais il lui arrive
        de se battre avec l’énergie psychique concentrée
        dans ses antennes en forme de rubans.
      de: |-
        Es ist zwar noch ein Baby, aber es weiß sich mit
        den Psycho-Kräften, die seinen schleifenförmigen
        Fühlern innewohnen, durchaus zu wehren.
      es: |-
        Pese a ser todavía un bebé, puede luchar con
        el poder psíquico que acumula en las antenitas
        en forma de lazos.
      it: |-
        Nonostante sia ancora piccolo, può lottare
        usando i poteri psichici accumulati nelle antenne
        a forma di fiocchetti.
    shield:
      ja-Hrkt: |-
        だれもいないのに　ボソッと　なく。
        ゴチムにしか　みえていない
        なにかと　はなしている　らしい。
      ja: |-
        誰もいないのに　ボソッと　鳴く。
        ゴチムにしか　見えていない
        なにかと　話している　らしい。
      ko: |-
        아무도 없는데 나직이 운다.
        고디탱에게만 보이는
        뭔가와 이야기하는 듯하다.
      zh-Hant: |-
        哥德寶寶會在看似無人的地方
        輕聲地叫。牠好像是在與某種
        只有牠才看得見的東西說話。
      zh-Hans: |-
        哥德宝宝会在看似无人的地方
        轻声地叫。它好像是在与某种
        只有它才看得见的东西说话。
      en: |-
        Even when nobody seems to be around, Gothita
        can still be heard making a muted cry. Many believe
        it’s speaking to something only it can see.
      fr: |-
        Parfois, ce Pokémon chuchote alors qu’il n’y a
        personne aux alentours. On raconte qu’il parle
        à une entité que personne ne peut voir.
      de: |-
        Manchmal stößt es Rufe aus, obwohl niemand da
        ist. Man vermutet, dass es sich mit irgendetwas
        unterhält, das für niemanden sonst sichtbar ist.
      es: |-
        A veces susurra aunque no haya nadie alrededor.
        Por eso se cree que tal vez hable con alguien o
        algo imperceptible para los demás.
      it: |-
        A volte emette versi anche se non c’è nessuno
        nei paraggi. Per questo si dice che parli con
        esseri che nessun altro può vedere.
