petilil:
  base_happiness: 50
  capture_rate: 190
  color: green
  egg_groups:
    - plant
  evolution_chain: petilil
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        The leaves on its head are very bitter.
        Eating one of these leaves is known
        to refresh a tired body.
      fr: |-
        Les feuilles sur sa tête sont très
        amères, mais elles remettent d’aplomb
        les corps les plus éreintés.
    white:
      en: |-
        Since they prefer moist, nutrient-rich
        soil, the areas where Petilil live are
        known to be good for growing plants.
      fr: |-
        Il aime les zones bien irriguées et riches
        en nutriments. On sait que là où il vit,
        les cultures sont florissantes.
    black-2:
      en: |-
        The leaves on its head grow right back
        even if they fall out. These bitter
        leaves refresh those who eat them.
    white-2:
      en: |-
        The leaves on its head grow right back
        even if they fall out. These bitter
        leaves refresh those who eat them.
    x:
      ja-Hrkt: |-
        あたまの　はっぱを　かじると
        とても　にがいが　つかれた　からだを
        げんきにする　こうかが　あるのだ。
      ja: |-
        頭の　葉っぱを　かじると
        とても　苦いが　疲れた　体を
        元気にする　効果が　あるのだ。
      ko: |-
        머리의 잎사귀를 갉아먹으면
        매우 쓰지만 지친 몸을
        회복시켜주는 효과가 있다.
      en: |-
        The leaves on its head are very bitter. Eating one
        of these leaves is known to refresh a tired body.
      fr: |-
        Les feuilles sur sa tête sont très amères, mais elles
        remettent d’aplomb les corps les plus éreintés.
      de: |-
        Die Blätter auf seinem Kopf schmecken furchtbar
        bitter, doch sie helfen ausgezeichnet gegen
        Erschöpfung.
      es: |-
        Mordisquear las hojas de su cabeza permite recuperar
        toda la vitalidad, a pesar de que están muy amargas.
      it: |-
        Le foglie che ha sul capo sono molto amare ma, se
        masticate, hanno l’effetto di rinvigorire il corpo stanco.
    'y':
      ja-Hrkt: |-
        すいぶんと　えいようの　ほうふな
        つちを　このむので　チュリネの　すむ
        とちは　さくもつの　そだちが　よい。
      ja: |-
        水分と　栄養の　豊富な
        土を　好むので　チュリネの　住む
        土地は　作物の　育ちが　良い。
      ko: |-
        치릴리는 수분과 영양이 풍부한
        땅을 좋아하기 때문에 치릴리가
        사는 토지는 작물이 잘 자란다.
      en: |-
        Since they prefer moist, nutrient-rich soil, the areas
        where Petilil live are known to be good for
        growing plants.
      fr: |-
        Il aime les zones bien irriguées et riches en
        nutriments. On sait que là où il vit, les cultures sont
        florissantes.
      de: |-
        Da es nährstoffreiche Erde bevorzugt, kann man in
        Gebieten, in denen es lebt, für gewöhnlich reiche
        Ernten erwarten.
      es: |-
        Habita tierras húmedas ricas en nutrientes donde
        la cosecha es abundante.
      it: |-
        Dato che predilige i terreni ricchi di acqua e
        nutrimento, nelle zone in cui vive Petilil i raccolti
        sono rigogliosi.
    omega-ruby:
      ja-Hrkt: |-
        あたまの　はっぱを　かじると
        とても　にがいが　つかれた　からだを
        げんきにする　こうかが　あるのだ。
      ja: |-
        頭の　葉っぱを　かじると
        とても　苦いが　疲れた　体を
        元気にする　効果が　あるのだ。
      ko: |-
        머리의 잎사귀를 갉아먹으면
        매우 쓰지만 지친 몸을
        회복시켜주는 효과가 있다.
      en: |-
        The leaves on its head are very bitter. Eating one
        of these leaves is known to refresh a tired body.
      fr: |-
        Les feuilles sur sa tête sont très amères, mais elles remettent
        d’aplomb les corps les plus éreintés.
      de: |-
        Die Blätter auf seinem Kopf schmecken furchtbar bitter,
        doch sie helfen ausgezeichnet gegen Erschöpfung.
      es: |-
        Mordisquear las hojas de su cabeza permite recuperar toda la
        vitalidad, a pesar de que están muy amargas.
      it: |-
        Le foglie che ha sul capo sono molto amare ma, se masticate,
        hanno l’effetto di rinvigorire il corpo stanco.
    alpha-sapphire:
      ja-Hrkt: |-
        すいぶんと　えいようの　ほうふな
        つちを　このむので　チュリネの　すむ
        とちは　さくもつの　そだちが　よい。
      ja: |-
        水分と　栄養の　豊富な
        土を　好むので　チュリネの　住む
        土地は　作物の　育ちが　良い。
      ko: |-
        치릴리는 수분과 영양이 풍부한
        땅을 좋아하기 때문에 치릴리가
        사는 토지는 작물이 잘 자란다.
      en: |-
        Since they prefer moist, nutrient-rich soil, the areas
        where Petilil live are known to be good for
        growing plants.
      fr: |-
        Il aime les zones bien irriguées et riches en nutriments.
        On sait que là où il vit, les cultures sont florissantes.
      de: |-
        Da es nährstoffreiche Erde bevorzugt, kann man in Gebieten,
        in denen es lebt, für gewöhnlich reiche Ernten erwarten.
      es: |-
        Habita tierras húmedas ricas en nutrientes donde la cosecha
        es abundante.
      it: |-
        Dato che predilige i terreni ricchi di acqua e nutrimento, nelle
        zone in cui vive Petilil i raccolti sono rigogliosi.
    sun:
      ja-Hrkt: |-
        あたまのはっぱは　めまいが　するほど
        にがいが　つかれた　からだに　きく。
        せんじて　のめば　もっと　きく。
      ja: |-
        頭の葉っぱは　めまいが　するほど
        苦いが　疲れた　身体に　効く。
        煎じて　飲めば　もっと　効く。
      ko: |-
        머리의 잎사귀는 현기증이 날 만큼
        쓰지만 몸이 피곤할 때 효과가 있다.
        달여먹으면 효과가 더 크다.
      zh-Hant: |-
        頭上的葉子味道苦得讓人頭昏，
        但是對疲倦的身體很有效果。
        如果煎服飲用會更有效。
      zh-Hans: |-
        头上的叶子苦得让人头晕眼花，
        但是对疲惫的身体很有效果。
        如果煎服饮用会更有效。
      en: |-
        Although the leaves on its head are bitter
        enough to cause dizziness, they provide relief
        from weariness—even more so when boiled.
      fr: |-
        Les feuilles sur sa tête sont amères à en
        cracher ses papilles, mais peuvent requinquer
        les corps les plus meurtris, surtout en infusion.
      de: |-
        Die Blätter auf seinem Kopf sind furchtbar
        bitter, helfen aber bei Erschöpfung. Als Tee
        zubereitet, sind sie noch wirksamer.
      es: |-
        Las hojas de su cabeza son tan amargas que
        casi producen náuseas, pero tienen un efecto
        revitalizante, sobre todo en forma de infusión.
      it: |-
        Le foglie che ha sul capo sono amarissime, ma
        hanno un effetto rinvigorente per il corpo.
        Bevute in infusione, sono ancora più efficaci.
    moon:
      ja-Hrkt: |-
        たまに　はっぱを　トリミングすると
        まるまるとした　りっぱな　すがたに
        そだって　いくのだ。
      ja: |-
        たまに　葉っぱを　トリミングすると
        丸々とした　立派な　姿に
        育って　いくのだ。
      ko: |-
        가끔 잎을 손질해주면
        둥글둥글한 훌륭한 모습으로
        자라난다.
      zh-Hant: |-
        如果偶爾修剪葉子，
        就會長成圓鼓鼓很華麗的樣子。
      zh-Hans: |-
        如果时不时修剪叶子，
        就会长成圆鼓鼓很华丽的样子。
      en: |-
        By pruning the leaves on its head with
        regularity, this Pokémon can be grown into a
        fine plump shape.
      fr: |-
        Il est recommandé de tailler de temps à autre
        les feuilles de Chlorobule afin qu’il acquière
        une forme parfaitement ronde et harmonieuse.
      de: |-
        Wenn man ab und zu seine Blätter schneidet,
        wächst sein Körper rund und prächtig heran.
      es: |-
        Adquiere un aspecto esplendoroso cuando se
        le recortan las hojas de la cabeza con cierta
        asiduidad.
      it: |-
        Le foglie che ha sul capo vanno spuntate di
        tanto in tanto per permettergli di crescere
        florido e pieno.
    ultra-sun:
      ja-Hrkt: |-
        あたまの　はを　てんぴで　かわかし
        せんじて　のむと　とうじの　げんきが
        もどると　おとしよりに　だいにんき。
      ja: |-
        頭の　葉を　天日で　乾かし
        煎じて　飲むと　当時の　元気が
        戻ると　お年寄りに　大人気。
      ko: |-
        머리의 잎을 햇볕에 말려
        달여 마시면 젊은 시절의 기력이
        돌아온다며 노인에게 큰 인기다.
      zh-Hant: |-
        把牠頭上的葉子放在太陽下曬乾，
        煎煮之後服用就能回復精力，
        因此很受老年人的喜愛。
      zh-Hans: |-
        如果利用阳光晒干它头上的叶子，
        再煎煮后饮用，会马上变得有活力，
        在老年人中很受欢迎。
      en: |-
        Some say if you dry the leaves on its head, boil
        them down, and drink the infusion, your vigor
        will return, so Petilil is popular with the elderly.
      fr: |-
        En raison de leurs vertus revigorantes,
        les feuilles de sa tête sont séchées au soleil
        puis bues en infusion par les personnes âgées.
      de: |-
        Sehr beliebt bei Senioren, da ein Tee aus den
        sonnengetrockneten Blättern seines Kopfes
        wie ein Schluck aus dem Jungbrunnen wirkt.
      es: |-
        Los ancianos aprecian las hojas de su cabeza,
        ya que, secadas al sol y tomadas en infusión,
        devuelven la vitalidad perdida.
      it: |-
        Le foglie che ha sul capo sono molto amate
        dagli anziani perché, essiccate al sole e bevute
        come tisana, hanno un effetto rinvigorente.
    ultra-moon:
      ja-Hrkt: |-
        きれいな　みずと　つちを　このむ。
        すみかの　かんきょうが　わるくなると
        あらたなとちへと　むれで　ひっこす。
      ja: |-
        綺麗な　水と　土を　好む。
        棲み処の　環境が　悪くなると
        新たな土地へと　群れで　引っ越す。
      ko: |-
        깨끗한 물과 흙을 좋아한다.
        서식지의 환경이 나빠지면
        새로운 장소로 무리가 이동한다.
      zh-Hant: |-
        喜歡乾淨的水和土壤。
        如果棲息地的環境變差，
        就會成群遷移到新的地方。
      zh-Hans: |-
        很喜欢干净的水和土壤。
        如果栖息地的环境变差，
        就会群体迁移到新的地方去。
      en: |-
        They prefer clean water and soil. When the
        environment they live in turns bad, the whole
        bunch will up and move to a new area.
      fr: |-
        À cheval sur la qualité de la terre et de l’eau,
        il migre avec ses congénères lorsque son
        environnement se dégrade.
      de: |-
        Sie bevorzugen sauberes Wasser und reine Erde.
        Sollten sich die Bedingungen in der Umgebung
        verschlechtern, ziehen sie in der Gruppe weiter.
      es: |-
        Prefiere el agua y la tierra sin impurezas. Si el
        entorno en el que habita empeora, emigra en
        grupo hacia un nuevo territorio.
      it: |-
        I Petilil prediligono i luoghi caratterizzati da
        terra e acqua pulite. Se il loro ambiente si
        deteriora, si trasferiscono in massa.
    sword:
      ja-Hrkt: |-
        きれいな　みずべに　あらわれる。
        あたまの　はを　にだした　しるは
        むしよけに　つかわれることもある。
      ja: |-
        きれいな　水辺に　現れる。
        頭の　葉を　煮だした　汁は
        虫よけに　使われることもある。
      ko: |-
        깨끗한 물가에 나타난다.
        머리의 잎을 우려낸 즙은
        벌레를 쫓는 데 사용하기도 한다.
      zh-Hant: |-
        會出現在乾淨的水邊。
        用牠頭上的葉子熬出的汁
        有時會被當作除蟲劑使用。
      zh-Hans: |-
        会出现在清澈的水边。
        用它头上的叶子煮出的汤
        有时会被作为驱虫剂使用。
      en: |-
        Petilil appears around sources of clean water.
        Boiling leaves from this Pokémon’s head results in
        a liquid that’s sometimes used as a bug repellent.
      fr: |-
        Il apparaît non loin des eaux propres. On utilise
        parfois les infusions préparées avec les feuilles
        de sa tête pour éloigner les insectes.
      de: |-
        Lilminip hält sich unweit von sauberem Wasser
        auf. Ein Aufguss der Blätter auf seinem Kopf wird
        auch als Mittel gegen Käfer-Pokémon eingesetzt.
      es: |-
        Aparece en lugares de aguas limpias.
        La decocción de las hojas de su cabeza se
        puede utilizar como repelente de insectos.
      it: |-
        Appare in prossimità di acque limpide. Il decotto
        ottenuto dalle foglie che ha sulla testa a volte
        viene usato come repellente per gli insetti.
    shield:
      ja-Hrkt: |-
        はの　いろが　こいほど　けんこう。
        ていれの　いきとどいた　はたけや
        かだんに　すみつくことも　ある。
      ja: |-
        葉の　色が　濃いほど　健康。
        手入れの　行き届いた　畑や
        花壇に　棲みつくことも　ある。
      ko: |-
        잎사귀의 색이 짙을수록 건강하다.
        잘 정돈된 밭이나 화단에
        자리잡고 살기도 한다.
      zh-Hant: |-
        葉子的顏色越深就越健康。
        有時也會在整理得很好的
        田地或花壇定居下來。
      zh-Hans: |-
        叶子的颜色越深就越健康。
        有时也会在被精心照料过的
        田地或花坛里定居下来。
      en: |-
        The deeper the color of a Petilil’s leaves, the
        healthier the Pokémon is. Petilil sometimes makes
        its home in a well-tended field or flowerbed.
      fr: |-
        Plus ses feuilles sont foncées, plus il est en
        bonne santé. Il s’installe parfois dans les champs
        ou les parterres de fleurs bien entretenus.
      de: |-
        Je kräftiger die Farbe seiner Blätter, desto
        gesünder ist es. Lilminip lässt sich zuweilen in gut
        gepflegten Blumenbeeten oder Feldern nieder.
      es: |-
        Cuanto más sano está este Pokémon, más intenso
        se vuelve el color de sus hojas. A veces se asienta
        en huertos o jardines de flores bien cuidados.
      it: |-
        Più il colore delle foglie è intenso, più è in salute.
        A volte si stabilisce in campi o aiuole ben curate.
    legends-arceus:
      en: |-
        The leaves on its head are highly valued for medicinal purposes.
        Dry the leaves in the sun, boil them, and then drink the bitter
        decoction for remarkably effective relief from fatigue.
