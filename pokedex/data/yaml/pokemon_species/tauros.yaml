        Tauros si lancia contro grossi tronchi per abbatterli e calmarsi.
    sun:
      ja-Hrkt: |-
        せかいの　かくちに　ケンタロスに　のり
        せいかつ　してきた　れきしが　あるが
        そのはじまりは　アローラ　だという。
      ja: |-
        世界の　各地に　ケンタロスに　乗り
        生活　してきた　歴史が　あるが
        その始まりは　アローラ　だという。
      ko: |-
        세계 각지에 켄타로스에 타서
        생활해온 역사가 있으나
        그 시초는 알로라라고 한다.
      zh-Hant: |-
        在世界各地都有騎著肯泰羅
        生活的歷史，但這一切的開端
        據說是在阿羅拉。
      zh-Hans: |-
        在世界各地都有骑着肯泰罗
        生活的历史，但这一切的开端
        据说是在阿罗拉。
      en: |-
        Historically, people in areas all over the world
        have ridden Tauros, but the practice is said to
        have started in Alola.
      fr: |-
        Beaucoup de sociétés à travers le monde ont
        appris à monter Tauros au cours de leur histoire.
        Les premières à l’avoir fait habitaient à Alola.
      de: |-
        Schon seit vielen Jahren reiten Menschen überall
        auf der Welt auf Tauros. Diese Tradition hat
        angeblich in Alola ihren Ursprung genommen.
      es: |-
        El uso de Tauros como montura se remonta a
        tiempos muy remotos. Ahora es una práctica
        muy extendida, pero parece que surgió en Alola.
      it: |-
        La storia insegna che in tutto il mondo gli esseri
        umani hanno sempre cavalcato i Tauros.
        Questa antica pratica nacque proprio ad Alola.
    moon:
      ja-Hrkt: |-
        あらっぽい　ポケモンだが
        アローラちほうの　ケンタロスは
        やや　おちつきが　あるという。
      ja: |-
        荒っぽい　ポケモンだが
        アローラ地方の　ケンタロスは
        やや　落ち着きが　あるという。
      ko: |-
        난폭한 포켓몬이지만
        알로라지방의 켄타로스는
        조금 침착하다고 한다.
      zh-Hant: |-
        性格暴躁的寶可夢，
        但是聽說阿羅拉地區的肯泰羅
        會比較穩重。
      zh-Hans: |-
        是性格暴躁的宝可梦，
        但是听说阿罗拉地区的肯泰罗会比较稳重。
      en: |-
        Although it’s known to be a fierce Pokémon,
        Tauros in the Alola region are said to possess
        a measure of calmness.
      fr: |-
        Il s’agit normalement d’un Pokémon très agressif,
        mais les Tauros natifs d’Alola sont d’une nature
        un peu plus paisible.
      de: |-
        Obwohl es sonst für seine ungestüme Art
        bekannt ist, gelten Exemplare aus Alola als
        vergleichsweise gelassen.
      es: |-
        Es un Pokémon muy famoso por su naturaleza
        violenta, aunque el Tauros de Alola parece ser
        algo más sosegado.
      it: |-
        Questo Pokémon ha un’indole violenta, ma
        sembra che i Tauros della regione di Alola
        siano più docili.
    ultra-sun:
      ja-Hrkt: |-
        しゅうだんで　せいかつする。　むれの
        なかで　１ばん　ふとく　ながく
        キズだらけの　ツノをもつのが　ボス。
      ja: |-
        集団で　生活する。　群れの
        中で　１番　太く　長く
        キズだらけの　ツノを持つのが　ボス。
      ko: |-
        집단생활을 한다. 무리 중에서
        가장 굵고 길며 상처가 많은
        뿔을 가진 것이 보스다.
      zh-Hant: |-
        會組成群體來生活。
        群體中角最粗、最長，
        且傷痕最多的就是老大。
      zh-Hans: |-
        会组成一个群体生活。
        在群体中，谁的角最粗最长，
        并伤痕累累，谁就是老大。
      en: |-
        They live in groups. The one with the longest,
        thickest, and most-scarred horns is the boss
        of the herd.
      fr: |-
        Les Tauros vivent en troupeaux menés par ceux
        dont les cornes sont les plus grosses, les plus
        longues et les plus abimées.
      de: |-
        Sie leben in Herden. Ihr Anführer ist das Tauros
        mit den kräftigsten und längsten Hörnern sowie
        den meisten Kampfspuren darauf.
      es: |-
        Vive en manadas dominadas por el ejemplar que
        luce la cornamenta más mellada y de mayor
        tamaño y grosor.
      it: |-
        I Tauros vivono in branchi capeggiati
        dall’esemplare che sfoggia le corna più grosse
        e lunghe e che mostrano più scalfitture.
    ultra-moon:
      ja-Hrkt: |-
        アローラの　ケンタロスが　ほかの
        ちほうより　すこし　おだやか　なのは
        きこうが　かんけいして　いるらしい。
      ja: |-
        アローラの　ケンタロスが　他の
        地方より　少し　穏やか　なのは
        気候が　関係して　いるらしい。
      ko: |-
        알로라의 켄타로스가 다른
        지방보다 조금 차분한 것은
        기후와 관련이 있다고 한다.
      zh-Hant: |-
        比起其他地區，阿羅拉的
        肯泰羅性情比較溫和。
        這似乎與當地的氣候有關。
      zh-Hans: |-
        比起其他地区来，
        阿罗拉的肯泰罗更温和一点。
        这好像和当地的气候有关。
      en: |-
        The climate seems to be related to the reason
        Tauros in Alola are a little calmer than those in
        other regions.
      fr: |-
        La douceur du climat local explique sans doute
        pourquoi les Tauros d’Alola sont plus paisibles
        que leurs congénères d’outre-mer.
      de: |-
        Tauros in Alola sind etwas sanftmütiger als in
        anderen Regionen. Dies ist offenbar auf das
        Klima zurückzuführen.
      es: |-
        En Alola, los Tauros muestran un carácter más
        sosegado que en otras regiones. Posiblemente,
        esto guarde relación con lo apacible del clima.
      it: |-
        I Tauros che vivono ad Alola hanno un’indole
        leggermente più docile. Sembra che questa
        particolarità sia dovuta al clima di Alola.
    lets-go-pikachu:
      ja-Hrkt: |-
        スタミナに　あふれた　あばれんぼう。
        はしりだすと　たいあたりするまで
        どこまでも　ひたすら　つきすすむ。
      ja: |-
        スタミナに　あふれた　暴れん坊。
        走りだすと　たいあたりするまで
        どこまでも　ひたすら　突き進む。
      ko: |-
        넘치는 체력의 난동꾼.
        달리기 시작하면 몸통박치기를
        할 때까지 끝없이 돌진한다.
      zh-Hant: |-
        精力十足且個性火爆。
        一旦開始奔跑，在撞到
        東西之前都不會停下腳步。
      zh-Hans: |-
        精力充沛且个性火暴。
        一旦开始奔跑，在撞到
        东西之前都不会停下脚步。
      en: |-
        A rowdy Pokémon with a lot of stamina.
        Once running, it won’t stop until it
        hits something.
      fr: |-
        Ce Pokémon brutal est très endurant.
        Rien n’arrête sa charge tant qu’il n’a pas
        pulvérisé sa cible.
      de: |-
        Es ist ungestüm und strotzt nur so vor Kraft.
        Wenn es erst einmal losprescht, rennt es so
        lange weiter, bis es mit etwas zusammenstößt.
      es: |-
        Un Pokémon violento que rebosa energía.
        Cuando echa a correr, no se detiene hasta que
        choca con algo.
      it: |-
        È un Pokémon energico e impetuoso.
        Quando comincia a correre non si ferma finché
        non va a cozzare contro qualcosa.
    lets-go-eevee:
      ja-Hrkt: |-
        スタミナに　あふれた　あばれんぼう。
        はしりだすと　たいあたりするまで
