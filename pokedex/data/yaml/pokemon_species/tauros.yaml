    x:
      ja-Hrkt: |-
        ３ぼんのしっぽで　じぶんを　たたき
        たたかう　きもちを　たかめると
        ぜんそくりょくで　つっこんでくる。
      ja: |-
        ３本の　尻尾で　自分を　たたき
        戦う　気持ちを　高めると
        全速力で　突っこんでくる。
      ko: |-
        3개의 꼬리로 자신을 때려서
        투지가 끓어오르면
        전속력으로 돌진해온다.
      en: |-
        After heightening its will to fight by whipping itself
        with its three tails, it charges at full speed.
      fr: |-
        Après s’être fouetté avec ses trois queues pour
        augmenter son agressivité, il charge.
      de: |-
        Es kämpft mit vollem Einsatz, nachdem es sich
        mit seinen drei Schweifen auspeitschte,
        um sich anzustacheln.
      es: |-
        Después de animarse a luchar fustigándose con sus
        tres colas, carga a toda velocidad.
      it: |-
        Prima si frusta con le tre code per caricarsi, poi
        parte all’attacco a tutta velocità.
    'y':
      ja-Hrkt: |-
        たいあたりしてくるとき
        ３ぼんの　しっぽで　じぶんの
        からだを　ピシピシと　たたく。
      ja: |-
        体当たりしてくるとき
        ３本の　尻尾で　自分の　体を
        ピシピシと　たたく。
      ko: |-
        몸통박치기로 공격해 올 때
        3개의 꼬리로 자신의
        몸을 가차 없이 때린다.
      en: |-
        When it is about to tackle, it whips its body
        repeatedly with its three long tails.
      fr: |-
        Juste avant d’utiliser Charge, ce Pokémon agite
        frénétiquement ses trois grandes queues.
      de: |-
        Wenn es Tackle einsetzt, geißelt es mit seinen
        drei Schwänzen wiederholt seinen Körper.
      es: |-
        Cuando va a usar Placaje, se azota repetidas veces
        con las tres colas que tiene.
      it: |-
        Prima di usare Azione si frusta il corpo ripetutamente
        con le tre lunghe code.
    omega-ruby:
      ja-Hrkt: |-
        いつも　あばれて　いないと　きが　すまない。
        たたかう　あいてが　いない　ときは　たいぼくに
        ぶちあたり　なぎたおす　ことで　きを　しずめる。
      ja: |-
        いつも　暴れて　いないと　気が　すまない。
        戦う　相手が　いない　ときは　大木に
        ぶち当たり　なぎ倒す　ことで　気を　静める。
      ko: |-
        항상 날뛰지 않으면 성에 차지 않는다.
        싸울 상대가 없을 때는 큰 나무를
        들이받아 쓰러트리고 맘을 가라앉힌다.
      en: |-
        This Pokémon is not satisfied unless it is rampaging at all
        times. If there is no opponent for Tauros to battle, it will
        charge at thick trees and knock them down to calm itself.
      fr: |-
        Ce Pokémon n’est pas satisfait s’il ne détruit pas tout sur
        son passage. Lorsque Tauros ne trouve pas d’adversaire,
        il se rue sur de gros arbres et les déracine pour passer
        ses nerfs.
      de: |-
        Dieses Pokémon ist nur zufrieden, wenn es kämpfen kann.
        Wenn Tauros keinen Gegner findet, sucht es sich robuste
        Bäume und haut sie um, um sich abzureagieren.
      es: |-
        Este Pokémon no está contento a menos que esté
        continuamente de aquí para allá. Si no hay rival que luche
        contra Tauros, se estampa contra árboles grandes para
        calmarse y los embiste para echarlos abajo.
      it: |-
        Questo Pokémon è molto insofferente e sempre alla ricerca
        della rissa. Se non trova un avversario con cui lottare,
        Tauros si lancia contro grossi tronchi per abbatterli e calmarsi.
