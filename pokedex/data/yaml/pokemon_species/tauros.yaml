    sword:
      ja-Hrkt: |-
        しっぽで　じぶんの　からだを
        たたきだしたら　きけんだぞ。
        もうスピードで　つっこんでくる。
      ja: |-
        しっぽで　自分の　体を
        叩きだしたら　危険だぞ。
        猛スピードで　突っ込んでくる。
      ko: |-
        꼬리로 자신의 몸을
        때리기 시작하면 위험하다.
        맹렬한 스피드로 덤벼든다.
      zh-Hant: |-
        如果牠開始用尾巴抽打
        自己的身體，那就危險了。
        牠會用驚人的速度猛衝過來喔。
      zh-Hans: |-
        如果它开始用尾巴拍打
        自己的身体，那就危险了。
        它会以极快的速度猛撞过来。
      en: |-
        When Tauros begins whipping itself with its tails,
        it’s a warning that the Pokémon is about to
        charge with astounding speed.
      fr: |-
        Il faut prendre garde quand un Tauros fouette
        son corps avec ses queues. Cela signifie qu’il
        s’apprête à charger à une vitesse démentielle.
      de: |-
        Peitscht es seinen Körper mit seinen Schweifen
        aus, ist Vorsicht geboten, denn es steht kurz
        davor, mit Karacho auf sein Ziel loszustürmen.
      es: |-
        Conviene tener cuidado si empieza a fustigarse
        con las colas, pues es señal de que va a cargar a
        máxima velocidad.
      it: |-
        Quando comincia a frustarsi con le sue stesse
        code è pericoloso, in quanto è segno che sta
        per partire alla carica a tutta velocità.
    shield:
      ja-Hrkt: |-
        ガラルに　くらす　ケンタロスは
        きしょうが　あらく　にんげんが
        せに　のることを　ゆるさない。
      ja: |-
        ガラルに　暮らす　ケンタロスは
        気性が　荒く　人間が
        背に　乗ることを　許さない。
      ko: |-
        가라르에 서식하는 켄타로스는
        기질이 거칠어서 사람이 등에
        올라타는 것을 허용하지 않는다.
      zh-Hant: |-
        棲息在伽勒爾的肯泰羅
        性格暴躁，絕不會允許
        人類騎到自己的背上。
      zh-Hans: |-
        栖息在伽勒尔的肯泰罗
        性格暴躁，决不允许
        人类骑在自己的背上。
      en: |-
        The Tauros of the Galar region are volatile in
        nature, and they won’t allow people to ride on
        their backs.
      fr: |-
        Les Tauros vivant à Galar ont un tempérament
        violent et ne tolèrent pas que les êtres humains
        montent sur leur dos.
      de: |-
        Die Tauros in Galar haben ein ungestümes
        Temperament und gestatten es Menschen nicht,
        auf ihrem Rücken zu reiten.
      es: |-
        Los Tauros que habitan en la región de Galar son
        de temperamento irascible y no permiten que los
        humanos monten en su lomo.
      it: |-
        I Tauros che vivono a Galar hanno un’indole
