trubbish:
  base_happiness: 50
  capture_rate: 190
  color: green
  egg_groups:
    - mineral
  evolution_chain: trubbish
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        Inhaling the gas they belch will make
        you sleep for a week. They prefer
        unsanitary places.
      fr: |-
        Il aime les endroits mal tenus.
        Le gaz qu’il rote endort
        pendant une semaine.
    white:
      en: |-
        The combination of garbage bags and
        industrial waste caused the chemical
        reaction that created this Pokémon.
      fr: |-
        Il est né de la mutation d’un
        sac poubelle contenant des
        déchets industriels.
    black-2:
      en: |-
        Wanting more garbage, they
        follow people who litter.
        They always belch poison gas.
    white-2:
      en: |-
        Wanting more garbage, they
        follow people who litter.
        They always belch poison gas.
    x:
      ja-Hrkt: |-
        ゴミぶくろが　さんぎょうはいきぶつと
        かがくへんかを　おこした　ことで
        ポケモンとして　うまれかわった。
      ja: |-
        ゴミ袋が　産業廃棄物と
        化学変化を　起こした　ことで
        ポケモンとして　生まれ変わった。
      ko: |-
        쓰레기 봉지가 산업 폐기물과
        화학적 변화를 일으켜서
        포켓몬으로 다시 태어났다.
      en: |-
        The combination of garbage bags and industrial
        waste caused the chemical reaction that created
        this Pokémon.
      fr: |-
        Il est né de la mutation d’un sac poubelle contenant
        des déchets industriels.
      de: |-
        Eine Mülltüte, der Industrieabfälle und chemische
        Reaktionen neues Leben eingehaucht haben.
      es: |-
        Pokémon nacido de la reacción química entre una
        bolsa de basura y residuos industriales.
      it: |-
        È nato da un sacchetto della spazzatura che ha
        subito un cambiamento chimico a causa delle scorie
        industriali.
    'y':
      ja-Hrkt: |-
        ふえいせいな　ばしょを　このむ。
        ゲップのように　はきだす　ガスを
        すいこむと　１しゅうかん　ねこむ。
      ja: |-
        不衛生な　場所を　好む。
        ゲップのように　吐き出す　ガスを
        吸いこむと　１週間　寝込む。
      ko: |-
        비위생적인 장소를 좋아한다.
        트림하듯이 토해내는 가스를
        들이마시면 1주일 동안 잠에 빠진다.
      en: |-
        Inhaling the gas they belch will make you sleep for
        a week. They prefer unsanitary places.
      fr: |-
        Il aime les endroits mal tenus. Le gaz qu’il rote endort
        pendant une semaine.
      de: |-
        Hat ein Faible für schmutzige Orte. Wer das Gas
        einatmet, das es mit Rülpslauten ausstößt, schläft
        eine Woche durch.
      es: |-
        Le gustan los lugares con suciedad. Quien inhala los
        gases que eructa duerme durante una semana.
      it: |-
        Predilige luoghi insalubri. Esala gas dalle fauci in
        grado di addormentare per una settimana.
    omega-ruby:
      ja-Hrkt: |-
        ゴミぶくろが　さんぎょうはいきぶつと
        かがくへんかを　おこした　ことで
        ポケモンとして　うまれかわった。
      ja: |-
        ゴミ袋が　産業廃棄物と
        化学変化を　起こした　ことで
        ポケモンとして　生まれ変わった。
      ko: |-
        쓰레기 봉지가 산업 폐기물과
        화학적 변화를 일으켜서
        포켓몬으로 다시 태어났다.
      en: |-
        The combination of garbage bags and industrial
        waste caused the chemical reaction that created
        this Pokémon.
      fr: |-
        Il est né de la mutation d’un sac poubelle contenant
        des déchets industriels.
      de: |-
        Eine Mülltüte, der Industrieabfälle und chemische Reaktionen
        neues Leben eingehaucht haben.
      es: |-
        Pokémon nacido de la reacción química entre una bolsa de
        basura y residuos industriales.
      it: |-
        È nato da un sacchetto della spazzatura che ha subito
        un cambiamento chimico a causa delle scorie industriali.
    alpha-sapphire:
      ja-Hrkt: |-
        ふえいせいな　ばしょを　このむ。
        ゲップのように　はきだす　ガスを
        すいこむと　１しゅうかん　ねこむ。
      ja: |-
        不衛生な　場所を　好む。
        ゲップのように　吐き出す　ガスを
        吸いこむと　１週間　寝込む。
      ko: |-
        비위생적인 장소를 좋아한다.
        트림하듯이 토해내는 가스를
        들이마시면 1주일 동안 잠에 빠진다.
      en: |-
        Inhaling the gas they belch will make you sleep for
        a week. They prefer unsanitary places.
      fr: |-
        Il aime les endroits mal tenus. Le gaz qu’il rote endort
        pendant une semaine.
      de: |-
        Hat ein Faible für schmutzige Orte. Wer das Gas einatmet,
        das es mit Rülpslauten ausstößt, schläft eine Woche durch.
      es: |-
        Le gustan los lugares con suciedad. Quien inhala los gases
        que eructa duerme durante una semana.
      it: |-
        Predilige luoghi insalubri. Esala gas dalle fauci in grado di
        addormentare per una settimana.
    sun:
      ja-Hrkt: |-
        ふえいせいな　ばしょが　すき。
        アローラでは　よく　ベトベターに
        おいまわされる　すがたを　みかける。
      ja: |-
        不衛生な　場所が　好き。
        アローラでは　よく　ベトベターに
        追いまわされる　姿を　みかける。
      ko: |-
        비위생적인 곳을 좋아한다.
        알로라에서는 자주 질퍽이에게
        쫓겨 다니는 모습을 볼 수 있다.
      zh-Hant: |-
        喜歡不衛生的地方。
        在阿羅拉經常可以看見牠
        被臭泥追著到處跑的樣子。
      zh-Hans: |-
        喜欢不卫生的场所。
        在阿罗拉经常可以发现
        被臭泥追着到处跑的样子。
      en: |-
        Unsanitary places are what they like best.
        They can be spotted in Alola, often with Grimer
        in hot pursuit.
      fr: |-
        Il affectionne particulièrement les endroits
        insalubres. À Alola, il n’est pas rare de voir
        des Tadmorv courir après des Miamiasme.
      de: |-
        Es liebt schmutzige Orte. In Alola sieht man oft,
        wie es von Sleima verfolgt wird.
      es: |-
        Le gustan los lugares sucios. En Alola se lo
        suele ver junto a Grimer, que lo sigue a todas
        partes.
      it: |-
        Predilige luoghi insalubri. Nella regione
        di Alola lo si vede spesso inseguito da
        Grimer.
    moon:
      ja-Hrkt: |-
        まんぷくまで　ゴミを　くらうと
        くちから　どくガスを　はきだす。
        うっかり　かぐと　そく　にゅういん。
      ja: |-
        満腹まで　ゴミを　喰らうと
        口から　毒ガスを　吐きだす。
        うっかり　かぐと　即　入院。
      ko: |-
        배가 부를 때까지 쓰레기를 먹은 후
        입에서 독가스를 토해낸다.
        실수로 맡으면 즉시 입원해야 한다.
      zh-Hant: |-
        吃垃圾吃到肚子鼓鼓之後，
        便會從嘴裡噴出毒瓦斯來。
        不小心聞到的話就得立即進醫院。
      zh-Hans: |-
        吃垃圾吃到肚子鼓鼓之后，
        从嘴里喷出毒瓦斯来。
        不小心闻到的话要立即进医院。
      en: |-
        It gorges on trash until its stomach is full. Then
        it belches toxic gas. An unlucky whiff of gas will
        put a person in the hospital.
      fr: |-
        Une fois qu’il a gobé assez d’ordures, il relâche
        un gaz toxique par la bouche. Ne le respirez
        pas, surtout s’il n’y a aucun hôpital à la ronde.
      de: |-
        Wenn es sich mit Müll vollstopft, rülpst es giftige
        Gase. Wer diese unabsichtlich einatmet, muss
        sofort ins Krankenhaus.
      es: |-
        Tras atiborrarse de basura, eructa unos gases
        venenosos capaces de llevar a cualquiera al
        hospital en caso de inhalarlos sin querer.
      it: |-
        Quando si rimpinza di spazzatura esala dalle
        fauci un gas tossico. Chi lo respira finisce
        immediatamente all’ospedale.
    ultra-sun:
      ja-Hrkt: |-
        こきゅうすると　どくガスが　もれる。
        においを　かぎつけ　ベトベトンが
        よだれを　たらして　やってくる。
      ja: |-
        呼吸すると　毒ガスが　漏れる。
        匂いを　嗅ぎつけ　ベトベトンが
        よだれを　垂らして　やってくる。
      ko: |-
        숨을 쉬면 독가스가 새어 나온다.
        냄새를 맡고 질뻐기가
        침을 흘리며 찾아온다.
      zh-Hant: |-
        呼吸時會有毒氣漏出，
        聞到這個味道的臭臭泥會
        流著口水跑過來。
      zh-Hans: |-
        呼吸的时候会有毒瓦斯漏出。
        臭臭泥闻到气味就会流着口水赶过来。
      en: |-
        Poisonous gas leaks out of it when it breathes.
        Muk that catch a whiff of that stench will
        come drooling.
      fr: |-
        Il laisse échapper un gaz toxique quand
        il respire. Les Grotadmorv, par l’odeur alléchés,
        accourent alors en salivant.
      de: |-
        Mit jedem Atemzug entweicht ihm giftiges Gas.
        Bekommt ein Sleimok davon Wind, nimmt es
        gierig sabbernd die Fährte auf und verfolgt es.
      es: |-
        Expulsa gases nocivos al respirar. Cuando Muk
        se percata del olor, acude salivando.
      it: |-
        Esala gas tossici a ogni respiro.
        Quando Muk ne sente l’odore, si dirige verso
        di lui con l’acquolina in bocca.
    ultra-moon:
      ja-Hrkt: |-
        ゲップの　ように　はきだす　ガスは
        ちいさな　こが　すいこんでしまうと
        いのちに　かかわるほど　きけん。
      ja: |-
        ゲップの　ように　吐き出す　ガスは
        小さな　子が　吸い込んでしまうと
        命に　関わるほど　危険。
      ko: |-
        트림처럼 내뱉는 가스는
        어린아이가 들이마시면
        치명적일 정도로 위험하다.
      zh-Hant: |-
        像打嗝一樣吐出的氣體
        一旦被小孩子吸進去，
        就會造成生命危險。
      zh-Hans: |-
        像打嗝一样吐出的瓦斯，
        一旦被小孩子吸入，
        就会有性命攸关的危险。
      en: |-
        If a young Pokémon or child breathes in the
        toxic gas that Trubbish belches out, it could be
        a life-threatening situation.
      fr: |-
        Le gaz toxique qu’il laisse échapper par
        sa bouche peut s’avérer dangereux pour les
        enfants et les jeunes Pokémon qui le respirent.
      de: |-
        Atmen kleine Kinder oder Pokémon das Gas ein,
        das es rülpsend ausstößt, ist nicht nur ihr
        Geruchssinn in Gefahr, sondern sogar ihr Leben.
      es: |-
        Los gases que exhala a modo de eructos
        pueden poner en peligro la vida de niños y crías
        Pokémon que los inhalen de forma accidental.
      it: |-
        Il gas tossico che gli sfugge dalla bocca può
        essere pericolosissimo se inalato da bambini
        o piccoli di Pokémon.
    sword:
      ja-Hrkt: |-
        ふえいせいな　ばしょが　すき。
        ゴミで　よごしたまま　ほうっておくと
        へやにも　あらわれて　すみつく。
      ja: |-
        不衛生な　場所が　好き。
        ゴミで　汚したまま　放っておくと
        部屋にも　現れて　棲みつく。
      ko: |-
        비위생적인 장소를 좋아한다.
        쓰레기를 어질러놓은 채 내버려 두면
        방에 나타나 그대로 눌러앉는다.
      zh-Hant: |-
        喜歡不衛生的地方。
        如果不及時清理家裡的垃圾，
        破破袋就會過來居住。
      zh-Hans: |-
        喜欢不卫生的地方。
        如果不及时清理家里的垃圾，
        破破袋就会过来居住。
      en: |-
        Its favorite places are unsanitary ones. If you
        leave trash lying around, you could even find
        one of these Pokémon living in your room.
      fr: |-
        Il raffole des endroits sales. Si on laisse traîner
        des ordures dans une pièce trop longtemps,
        il finit par en faire son domicile.
      de: |-
        Es liebt schmutzige Orte. Angeblich zieht es auch
        in menschliche Behausungen ein, wenn man zu
        viel Müll herumliegen lässt.
      es: |-
        Le gustan los lugares insalubres. Puede llegar a
        establecerse en las casas de aquellas personas
        que no hagan la limpieza con regularidad.
      it: |-
        Predilige luoghi insalubri. Sbuca fuori nelle case
        dove è stata lasciata spazzatura in giro e vi si
        stabilisce.
    shield:
      ja-Hrkt: |-
        ゴミの　つまった　ゴミぶくろから
        うまれた。　はきだす　どくガスは
        ガラルの　マタドガスの　こうぶつ。
      ja: |-
        ゴミの　詰まった　ゴミ袋から
        生まれた。　吐き出す　毒ガスは
        ガラルの　マタドガスの　好物。
      ko: |-
        쓰레기가 가득 담긴 쓰레기봉투에서
        태어났다. 내뿜는 독가스는
        가라르의 또도가스가 매우 좋아한다.
      zh-Hant: |-
        誕生自塞滿垃圾的垃圾袋裡。
        牠嘴裡噴出的毒氣
        是伽勒爾雙彈瓦斯的最愛。
      zh-Hans: |-
        诞生于塞满垃圾的垃圾袋里。
        它嘴里喷出的毒气
        是伽勒尔双弹瓦斯的最爱。
      en: |-
        This Pokémon was born from a bag stuffed with
        trash. Galarian Weezing relish the fumes belched
        by Trubbish.
      fr: |-
        Il est né d’un sac poubelle rempli d’ordures.
        Le gaz empoisonné qu’il exhale est très apprécié
        des Smogogo de Galar.
      de: |-
        Es ist aus einer überfüllten Mülltüte entstanden.
        Die Smogmog der Galar-Region sind verrückt
        nach den giftigen Gasen, die es ausstößt.
      es: |-
        Nació a partir de una rebosante bolsa de basura.
        Los gases nocivos que eructa son un manjar para
        los Weezing de Galar.
      it: |-
        È nato da un sacchetto pieno di spazzatura.
        I Weezing di Galar sono ghiotti del gas tossico
        che esala.
