        sondern auch beweglicher.
      es: |-
        Cuando le esquilan su mullido pelaje, no solo mejora su
        apariencia, sino que aumenta su agilidad.
      it: |-
        La toelettatura del manto vaporoso non solo lo rende più
        bello, ma gli consente anche di muoversi più liberamente.
    alpha-sapphire:
      ja-Hrkt: |-
        おおむかしの　カロスちほうでは
        おうさまを　ごえいする　やくめを
        あたえられた　ポケモン。
      ja: |-
        大昔の　カロス地方では
        王様を　護衛する　役目を
        与えられた　ポケモン。
      ko: |-
        먼 옛날 칼로스지방에서
        왕을 호위하는 역할을
        맡았던 포켓몬이다.
      en: |-
        Historically, in the Kalos region, these Pokémon
        were the designated guardians of the king.
      fr: |-
        Il y a fort longtemps dans la région de Kalos, ce Pokémon fut
        le gardien des rois et des reines.
      de: |-
        Vor langer Zeit wurde dieses Pokémon in der Kalos-Region
        als Leibgarde des Königs eingesetzt.
      es: |-
        Antiguamente, estos Pokémon desempeñaban el cometido de
        guardián del rey en la región de Kalos.
      it: |-
        Nell’antica Kalos, questo Pokémon aveva il compito di
        proteggere i re.
    ultra-sun:
      ja-Hrkt: |-
        たいもうを　いかに　うつくしく
        カットするか　きぞくたちの　あいだで
        きそわれた　じだいが　あった。
      ja: |-
        体毛を　いかに　美しく
        カットするか　貴族たちの　間で
        競われた　時代が　あった。
      ko: |-
        털을 얼마나 아름답게
        커트하는지 귀족들 사이에서
        경쟁하던 시대가 있었다.
      zh-Hant: |-
        曾經有過一個時代，
        貴族之間會互相比較
        誰能把牠的體毛修剪得更美麗。
      zh-Hans: |-
        曾有过一个时代，
        贵族之间会比赛
        如何把它的体毛修剪得美丽。
      en: |-
        There was an era when aristocrats would
        compete to see who could trim their Furfrou’s
        fur into the most exquisite style.
      fr: |-
        Il fut un temps où la noblesse organisait
        des concours pour déterminer quel Couafarel
        arborait la plus belle coupe.
      de: |-
        Es gab eine Zeit, in der Adlige darum stritten,
        wer seinem Coiffwaff den schönsten Schnitt
        verpassen könne.
      es: |-
        Hubo una época en la que los aristócratas
        competían entre ellos procurando que el corte
        de pelo de su Furfrou fuera el mejor de todos.
      it: |-
        In passato i nobili gareggiavano tra loro per
        stabilire quale Furfrou avesse il taglio più bello.
    ultra-moon:
      ja-Hrkt: |-
        ほうっておくと　たいもうは　どんどん
        のびつづけるが　しんらいした
        ものにしか　カットは　ゆるさない。
      ja: |-
        放っておくと　体毛は　どんどん
        伸び続けるが　信頼した
        者にしか　カットは　許さない。
      ko: |-
        가만히 두면 털이 점점
        자라지만 신뢰하는 자가 아니면
        커트를 허락하지 않는다.
      zh-Hant: |-
        如果放著不管，體毛就會
        不斷變長，但牠只允許
        信賴的人幫自己修剪。
      zh-Hans: |-
        如果置之不理，
        体毛会不断地长长，
        但只允许信赖的人修剪。
      en: |-
        Left alone, its fur will grow longer and longer,
        but it will only allow someone it trusts to cut it.
      fr: |-
        Sa fourrure pousse indéfiniment, mais il refuse
        de se faire couper la toison par une personne
        en qui il n’a pas confiance.
      de: |-
        Trimmt man sein Fell nicht regelmäßig, wächst es
        ohne Unterlass. Allerdings lässt es sich nur von
        jemandem frisieren, dem es traut.
      es: |-
        El pelo le crece sin cesar, pero solo deja que se
        lo corten aquellos de quienes se fía plenamente.
      it: |-
        Se non viene tagliato, il suo pelo continua
        a crescere a dismisura. Si lascia tosare
        solamente dalle persone di cui si fida.
  form_description:
    en: "Forms only differ in appearance.  Furfrou's trim can be changed at any time in Friseur Furfrou in Lumiose City.  It reverts to its Natural Form after five days unless trimmed again, or if it is deposited in the PC."
