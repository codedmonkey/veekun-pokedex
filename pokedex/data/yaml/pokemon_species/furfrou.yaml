furfrou:
  base_happiness: 70
  capture_rate: 160
  color: white
  egg_groups:
    - ground
  evolution_chain: furfrou
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        ボサボサの　たいもうを　かりこむと
        すがたが　うつくしくなる　だけでなく
        からだの　キレが　よくなるのだ。
      ja: |-
        ボサボサの　体毛を　刈りこむと
        姿が　美しくなる　だけでなく
        身体の　キレが　良くなるのだ。
      ko: |-
        복슬복슬한 털을 깎고 다듬으면
        모습이 아름다워질 뿐만 아니라
        몸의 움직임도 좋아진다.
      en: |-
        Trimming its fluffy fur not only makes
        it more elegant but also increases the
        swiftness of its movements.
      fr: |-
        Si son abondante fourrure gagne à être toilettée,
        ce n’est pas qu’une question de style. En effet, cela
        lui permet également de se mouvoir plus librement.
      de: |-
        Schneidet man sein Fell zurecht, wird es
        nicht nur schöner, sondern auch beweglicher.
      es: |-
        Cuando le esquilan su mullido pelaje, no solo mejora
        su apariencia, sino que aumenta su agilidad.
      it: |-
        La toelettatura del manto vaporoso non solo lo rende
        più bello, ma gli consente anche di muoversi
        più liberamente.
    'y':
      ja-Hrkt: |-
        おおむかしの　カロスちほうでは
        おうさまを　ごえいする　やくめを
        あたえられた　ポケモン。
      ja: |-
        大昔の　カロス地方では
        王様を　護衛する　役目を
        与えられた　ポケモン。
      ko: |-
        먼 옛날 칼로스지방에서
        왕을 호위하는 역할을
        맡았던 포켓몬이다.
      en: |-
        Historically, in the Kalos region, these Pokémon
        were the designated guardians of the king.
      fr: |-
        Il y a fort longtemps dans la région de Kalos,
        ce Pokémon fut le gardien des rois et des reines.
      de: |-
        Vor langer Zeit wurde dieses Pokémon in der
        Kalos-Region als Leibgarde des Königs eingesetzt.
      es: |-
        Antiguamente, estos Pokémon desempeñaban el
        cometido de guardián del rey en la región de Kalos.
      it: |-
        Nell’antica Kalos, questo Pokémon aveva il compito
        di proteggere i re.
    omega-ruby:
      ja-Hrkt: |-
        ボサボサの　たいもうを　かりこむと
        すがたが　うつくしくなる　だけでなく
        からだの　キレが　よくなるのだ。
      ja: |-
