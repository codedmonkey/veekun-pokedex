archeops:
  base_happiness: 50
  capture_rate: 45
  color: yellow
  egg_groups:
    - flying
    - water3
  evolution_chain: archen
  evolves_from: archen
  flavor_text:
    black:
      en: |-
        They are intelligent and will cooperate
        to catch prey. From the ground, they
        use a running start to take flight.
      fr: |-
        Il s’envole après avoir pris de l’élan.
        Il est assez intelligent pour chasser
        ses proies en groupe.
    white:
      en: |-
        It runs better than it flies.
        It catches prey by running at speeds
        comparable to those of an automobile.
      fr: |-
        Il est plus doué pour courir que pour
        voler. Il fonce sur ses proies aussi vite
        qu’une voiture pour les attraper.
    black-2:
      en: |-
        It runs better than it flies.
        It takes off into the sky by
        running at a speed of 25 mph.
    white-2:
      en: |-
        It runs better than it flies.
        It takes off into the sky by
        running at a speed of 25 mph.
    x:
      ja-Hrkt: |-
        ちじょうで　じょそうを　つけてから
        とびたつ。なかまと　きょうりょくして
        えものを　しとめる　ちのうを　もつ。
      ja: |-
        地上で　助走を　つけてから
        飛び立つ。仲間と　協力して
        獲物を　しとめる　知能を　持つ。
      ko: |-
        지상에서 도움닫기를 하여
        날아오른다. 동료와 협력하여
        먹이를 잡는 지능을 가졌다.
      en: |-
        They are intelligent and will cooperate to catch
        prey. From the ground, they use a running start to
        take flight.
      fr: |-
        Il s’envole après avoir pris de l’élan. Il est assez
        intelligent pour chasser ses proies en groupe.
      de: |-
        Bevor es abhebt, nimmt es am Boden Anlauf.
        Es ist schlau genug, seine Beute zusammen
        mit Artgenossen zu jagen.
      es: |-
        Levanta el vuelo tras coger carrerilla. Coopera con sus
        compañeros de bandada para atrapar a sus presas.
      it: |-
        Spicca il volo prendendo la rincorsa da terra.
        Collabora con i suoi simili per catturare le prede.
    'y':
      ja-Hrkt: |-
        とぶよりも　はしるほうが　とくいで
        じそく４０キロで　かけぬけた
        いきおいで　おおぞらに　はばたく。
      ja: |-
        飛ぶよりも　走るほうが　得意で
        時速４０キロで　駆けぬけた
        勢いで　大空に　羽ばたく。
      ko: |-
        나는 것보다 달리는 것이 특기로
        시속 40km로 달리던 기세로
        넓은 하늘로 날아오른다.
      en: |-
        It runs better than it flies. It takes off into the sky
        by running at a speed of 25 mph.
      fr: |-
        Il est plus doué pour courir que pour voler. Il doit
        s’élancer à 40 km/h avant de pouvoir s’envoler.
      de: |-
        Zu Fuß ist es schneller als in der Luft. Es muss
        ein Tempo von 40 km/h erreichen, bevor es sich
        in die Lüfte aufschwingt.
      es: |-
        Corre a mayor velocidad de la que puede volar.
        Alcanza una velocidad de 40 km/h antes de alzarse
        en vuelo hacia el cielo.
      it: |-
        È più versato nella corsa che nel volo. Si lancia in
        aria a una velocità di 40 km/h sbattendo le ali.
    omega-ruby:
      ja-Hrkt: |-
        ちじょうで　じょそうを　つけてから
        とびたつ。なかまと　きょうりょくして
        えものを　しとめる　ちのうを　もつ。
      ja: |-
        地上で　助走を　つけてから
        飛び立つ。仲間と　協力して
        獲物を　しとめる　知能を　持つ。
      ko: |-
        지상에서 도움닫기를 하여
        날아오른다. 동료와 협력하여
        먹이를 잡는 지능을 가졌다.
      en: |-
        They are intelligent and will cooperate to catch
        prey. From the ground, they use a running start to
        take flight.
      fr: |-
        Il s’envole après avoir pris de l’élan. Il est assez intelligent
        pour chasser ses proies en groupe.
      de: |-
        Bevor es abhebt, nimmt es am Boden Anlauf. Es ist schlau
        genug, seine Beute zusammen mit Artgenossen zu jagen.
      es: |-
        Levanta el vuelo tras coger carrerilla. Coopera con sus
        compañeros de bandada para atrapar a sus presas.
      it: |-
        Spicca il volo prendendo la rincorsa da terra. Collabora
        con i suoi simili per catturare le prede.
    alpha-sapphire:
      ja-Hrkt: |-
        とぶよりも　はしるほうが　とくいで
        じそく４０キロで　かけぬけた
        いきおいで　おおぞらに　はばたく。
      ja: |-
        飛ぶよりも　走るほうが　得意で
        時速４０キロで　駆けぬけた
        勢いで　大空に　羽ばたく。
      ko: |-
        나는 것보다 달리는 것이 특기로
        시속 40km로 달리던 기세로
        넓은 하늘로 날아오른다.
      en: |-
        It runs better than it flies. It takes off into the sky
        by running at a speed of 25 mph.
      fr: |-
        Il est plus doué pour courir que pour voler. Il doit s’élancer
        à 40 km/h avant de pouvoir s’envoler.
      de: |-
        Zu Fuß ist es schneller als in der Luft. Es muss ein Tempo
        von 40 km/h erreichen, bevor es sich in die Lüfte aufschwingt.
      es: |-
        Corre a mayor velocidad de la que puede volar. Alcanza una
        velocidad de 40 km/h antes de alzarse en vuelo hacia el cielo.
      it: |-
        È più versato nella corsa che nel volo. Si lancia in aria a una
        velocità di 40 km/h sbattendo le ali.
    sun:
      ja-Hrkt: |-
        とぶことも　できたようだが　おもに
        ちじょうを　かけまわっていた。
        その　じそくは　へいきん４０キロ。
      ja: |-
        飛ぶことも　できたようだが　おもに
        地上を　駆けまわっていた。
        その　時速は　平均４０キロ。
      ko: |-
        날 수도 있었지만 대부분
        지상을 뛰어다녔다.
        그 시속은 평균 40km이다.
      zh-Hant: |-
        好像也懂得飛行，
        但主要是在地上四處飛奔。
        平均時速達到４０公里。
      zh-Hans: |-
        好像也会飞行，
        但主要是在地上四处飞奔。
        平均时速达到４０公里。
      en: |-
        Although apparently able to fly, they tended
        to run along the ground, averaging speeds of
        roughly 25 mph.
      fr: |-
        Bien qu’ayant enfin acquis la capacité de voler,
        ce Pokémon préférait bien souvent courir
        sur le sol, à une vitesse moyenne de 40 km/h.
      de: |-
        Es kann anscheinend auch fliegen, bewegt sich
        aber überwiegend mit einer durchschnittlichen
        Geschwindigkeit von 40 km/h am Boden fort.
      es: |-
        Pese a haber desarrollado la capacidad de
        volar, prefería seguir corriendo por la superficie
        terrestre, con una velocidad media de 40 km/h.
      it: |-
        Nonostante sapesse volare, si spostava
        principalmente via terra a una velocità media
        di 40 km/h.
    moon:
      ja-Hrkt: |-
        むれで　かりを　していた。　えものを
        おいつめてから　べつの　なかまが
        そらから　きゅうしゅう　するのだ。
      ja: |-
        群れで　狩りを　していた。　獲物を
        追いつめてから　別の　仲間が
        空から　急襲　するのだ。
      ko: |-
        무리 지어 사냥을 했다. 먹이를
        몰아넣으면 다른 동료가
        하늘에서 급습한다.
      zh-Hant: |-
        會成群結隊進行捕獵。
        將獵物追到無路可逃時，
        其他夥伴便會從空中突然發動襲擊。
      zh-Hans: |-
        成群结队进行捕猎。
        将猎物追到无路可逃时，
        其他伙伴就会从空中发动突袭。
      en: |-
        They hunted in flocks. When one Archeops had
        the prey cornered, another would swoop on it.
      fr: |-
        Ce Pokémon avait pour habitude de chasser en
        groupe. Une partie de la volée était chargée
        d’acculer la proie, et l’autre de porter l’estoc.
      de: |-
        Es jagt in Gruppen. Sobald es die Beute in die
        Enge getrieben hat, stürzt sich ein Artgenosse
        aus der Luft auf sie.
      es: |-
        Se agrupaban en bandadas para salir de caza.
        Primero, unos arrinconaban a la presa y luego
        otros se lanzaban en picado sobre ella.
      it: |-
        Cacciava in gruppo: alcuni Pokémon
        intrappolavano la preda e i loro compagni
        la assalivano.
    ultra-sun:
      ja-Hrkt: |-
        うもうが　こまかいので　じゅくれんの
        しょくにん　でなければ　ふくげんに
        しっぱいするという　こだいのポケモン。
      ja: |-
        羽毛が　細かいので　熟練の
        職人　でなければ　復元に
        失敗するという　古代の　ポケモン。
      ko: |-
        깃털이 매우 가늘어
        숙련된 장인이 아니면 복원에
        실패한다고 전해지는 고대의 포켓몬.
      zh-Hant: |-
        古代的寶可夢。
        因為羽毛很細，若不是由熟練的
        師傅來動手，就無法成功復原。
      zh-Hans: |-
        古代的宝可梦。
        因为羽毛很细，所以如果不是
        熟练的匠人，就会复原失败。
      en: |-
        This ancient Pokémon’s plumage is delicate,
        so if anyone other than an experienced
        professional tries to restore it, they will fail.
      fr: |-
        Les plumes de ce Pokémon antique sont si fines
        que seuls les experts les plus talentueux
        peuvent leur rendre justice en le reconstituant.
      de: |-
        Aufgrund seines feinen Gefieders glückt die
        Zurückverwandlung dieses urzeitlichen Pokémon
        nur Experten mit langjähriger Erfahrung.
      es: |-
        Pokémon vetusto de plumaje tan fino que solo
        alguien con extremada pericia puede regenerar
        a partir de un fósil.
      it: |-
        È un Pokémon antico dal piumaggio molto fitto.
        Solo i più esperti riescono a rigenerarlo con
        successo.
    ultra-moon:
      ja-Hrkt: |-
        とりポケモンの　そせんと　いわれる。
        はばたく　きんにくが　まだ　よわく
        じょそうを　つけなければ　とべない。
      ja: |-
        とりポケモンの　祖先と　いわれる。
        羽ばたく　筋肉が　まだ　弱く
        助走を　つけなければ　飛べない。
      ko: |-
        새포켓몬의 조상이라 불린다.
        날갯짓하는 근육은 아직 약해서
        도움닫기를 하지 않으면 날 수 없다.
      zh-Hant: |-
        據說是鳥寶可夢的祖先。
        用來振翅的肌肉還很弱，
        必須靠助跑才能飛起來。
      zh-Hans: |-
        据说是鸟宝可梦的祖先。
        挥动翅膀的肌肉还很弱，
        必须助跑才能飞起来。
      en: |-
        Said to be an ancestor of bird Pokémon, the
        muscles it uses to flap its wings are still weak,
        so it needs a long runway in order to take off.
      fr: |-
        On dit que c’est l’ancêtre des Pokémon oiseaux.
        Les muscles de ses ailes étant assez faibles,
        il doit prendre son élan pour s’envoler.
      de: |-
        Es gilt als Urahn aller Vogel-Pokémon. Da die
        Muskeln an seinen Flügeln noch zu schwach
        sind, kann es nur mit Anlauf fliegen.
      es: |-
        Precursor de los Pokémon pájaro. Para alzar el
        vuelo necesita coger carrerilla, debido a una
        musculatura en las alas poco desarrollada.
      it: |-
        Si ritiene che sia l’antenato dei Pokémon alati.
        Ha i muscoli delle ali non ancora sviluppati
        e per volare deve prendere la rincorsa.
    sword:
      ja-Hrkt: |-
        とびたつために　じょそうする。
        その　きょりは　およそ　４キロ。
        はしるはやさは　じそく４０キロ。
      ja: |-
        飛び立つために　助走する。
        その　距離は　およそ　４キロ。
        走る速さは　時速４０キロ。
      ko: |-
        날아오르기 위해 도움닫기를 하는데
        그 거리는 약 4km다.
        도움닫기의 속도는 시속 40km다.
      zh-Hant: |-
        必須靠助跑才能飛起來。
        助跑的距離大約是４公里，
        奔跑的速度是時速４０公里。
      zh-Hans: |-
        会为了飞翔而助跑。
        助跑的距离大约为４公里，
        跑步的速度为每小时４０公里。
      en: |-
        It needs a running start to take off. If Archeops
        wants to fly, it first needs to run nearly 25 mph,
        building speed over a course of about 2.5 miles.
      fr: |-
        Pour s’envoler, il doit d’abord prendre son élan
        sur 4 km à une vitesse de 40 km/h.
      de: |-
        Um abheben zu können, muss es circa 4 km
        Anlauf nehmen und dabei eine Geschwindigkeit
        von 40 km/h erreichen.
      es: |-
        Coge carrerilla durante aproximadamente 4 km
        a una velocidad de 40 km/h para poder levantar
        el vuelo.
      it: |-
        Prende la rincorsa per volare, percorrendo
        circa 4 km a una velocità di 40 km/h.
    shield:
      ja-Hrkt: |-
        とぶことも　できるが　ちじょうで
        えものを　かることの　ほうが
        ずっと　とくい　だったようだ。
      ja: |-
        飛ぶことも　できるが　地上で
        獲物を　狩ることの　ほうが
        ずっと　得意だったようだ。
      ko: |-
        비행도 가능하지만
        지상에서 먹이를 사냥하는
        일을 훨씬 더 잘하는 듯하다.
      zh-Hant: |-
        雖然能夠飛行，
        但牠似乎更擅於
        在地上捕捉獵物。
      zh-Hans: |-
        虽然也会飞行，
        但是似乎更擅长在
        地面上捕捉猎物。
      en: |-
        Though capable of flight, Archeops was
        apparently better at hunting on the ground.
      fr: |-
        Il savait voler, mais il semble qu’il était beaucoup
        plus doué pour chasser ses proies sur la terre
        ferme.
      de: |-
        Es konnte zwar auch fliegen, schien aber sehr viel
        geschickter darin zu sein, am Boden Jagd auf
        Beute zu machen.
      es: |-
        Si bien era capaz de volar, parece ser que se le
        daba mucho mejor cazar presas en tierra firme
        que en el aire.
      it: |-
        Si sa che questo Pokémon era in grado di volare,
        ma pare che fosse molto più abile nel cacciare
        le prede a terra.
