    white-2:
      en: |-
        It makes a single pearl during
        its lifetime. The pearl is said
        to amplify psychic power.
    x:
      ja-Hrkt: |-
        いっしょうに　１かい　しんかの　とき
        サイコパワーを　ぞうふくする
        ふしぎな　しんじゅを　つくるのだ。
      ja: |-
        一生に　１回　進化の　とき
        サイコパワーを　増幅する
        不思議な　真珠を　作るのだ。
      ko: |-
        일생에 한 번 진화할 때
        사이코 파워를 증폭시키는
        이상한 진주를 만든다.
      en: |-
        When it evolves, it makes a mysterious pearl that
        amplifies psychic powers when it’s held.
      fr: |-
        Il ne produit qu’une perle durant son existence,
        quand il évolue. Elle amplifie les pouvoirs psychiques.
      de: |-
        Es entwickelt sich nur einmal im Leben, wobei es
        eine wundersame Perle erzeugt, die Psycho-Kräfte
        verstärkt.
      es: |-
        Produce durante su vida una sola perla que aumenta
        los poderes psíquicos al evolucionar.
      it: |-
        Crea una sola perla in tutta la sua vita, quando si
        evolve. Questa perla amplifica i poteri psichici.
    'y':
      ja-Hrkt: |-
        がんじょうな　カラに　まもられて
        いっしょうの　うちに　１こだけ
        みごとな　しんじゅを　つくる。
      ja: |-
        頑丈な　殻に　守られて
        一生の　うちに　１個だけ
        見事な　真珠を　作る。
      ko: |-
        단단한 껍데기로 감싸여
        평생 동안 단 1개의
        훌륭한 진주를 만든다.
      en: |-
        It is protected by a sturdy shell. Once in a lifetime,
        it makes a magnificent pearl.
      fr: |-
        Ce Pokémon ferme sa coquille pour se protéger du
        danger. Il ne crée qu’une seule perle de toute sa vie,
        mais celle-ci est magnifique.
      de: |-
        Es ist durch einen harten Panzer geschützt.
        Einmal im Leben stellt es eine bezaubernde Perle her.
      es: |-
        Está protegido por una sólida concha. Puede llegar a
        formar una perla extraordinaria.
      it: |-
        È protetto da un guscio coriaceo. Una sola volta in
        tutta la sua vita produce una magnifica perla.
    omega-ruby:
      ja-Hrkt: |-
        がんじょうな　カラは　みを　まもる　だけではなく
        えものを　はさんで　つかまえる　ことも　できる。
        そだった　パールルの　かいがらは　キズだらけ。
      ja: |-
        頑丈な　カラは　身を　守る　だけではなく
        獲物を　挟んで　捕まえる　ことも　できる。
        育った　パールルの　貝殻は　キズだらけ。
      ko: |-
        튼튼한 껍데기는 몸을 지키는 것뿐 아니라
        먹이를 집어서 잡을 수도 있다.
        성장한 진주몽의 조개껍데기는 상처투성이다.
      en: |-
        Clamperl’s sturdy shell is not only good for protection—it is
        also used for clamping and catching prey. A fully grown
        Clamperl’s shell will be scored with nicks and scratches
        all over.
      fr: |-
        La puissante coquille de Coquiperl ne sert pas qu’à
        le protéger. Elle lui permet également de pincer et
        d’attraper sa proie. Une coquille de Coquiperl adulte
        porte souvent de nombreuses égratignures et éraflures.
      de: |-
        Perlus kräftige Schale dient nicht nur dem Schutz,
        es nutzt sie auch zum Fangen von Beute. Die Schale eines
        ausgewachsenen Perlu weist viele Kerben und Kratzer auf.
      es: |-
        La sólida concha que rodea a Clamperl no solo le sirve para
        protegerse, sino también de cepo para atrapar a su presa.
        Cuando la concha alcanza su mayor tamaño, presenta
        muescas y rasguños por todas partes.
      it: |-
        La robusta conchiglia di Clamperl è un’eccellente protezione,
        ma è anche molto utile per intrappolare e catturare la preda.
        Di solito una conchiglia giunta alla sua completa maturità
        è segnata da tacche e graffi.
    alpha-sapphire:
      ja-Hrkt: |-
        かたい　かいがらに　まもられて　せいちょうする。
        ほんたいが　カラに　おさまり　きらなくなると
        しんかの　しゅんかんが　ちかづいた　しょうこ。
      ja: |-
        硬い　貝殻に　守られて　成長する。
        本体が　カラに　収まり　切らなくなると
        進化の　瞬間が　近づいた　証拠。
      ko: |-
        단단한 껍데기에 보호받으며 성장한다.
        몸이 껍데기보다 커져 버리면
        진화의 순간이 가까워진 증거다.
      en: |-
        Clamperl grows while being protected by its rock-hard shell.
        When its body becomes too large to fit inside the shell, it is
        sure evidence that this Pokémon is getting close to evolution.
      fr: |-
        Coquiperl grandit protégé par sa coquille dure comme de la
        pierre. Lorsque son corps devient trop grand pour sa coquille,
        cela signifie que ce Pokémon va bientôt évoluer.
      de: |-
        Perlu wächst, während es von seiner steinharten Schale
        geschützt wird. Wenn sein Körper zu groß für seine Schale
        wird, ist dies ein sicheres Anzeichen dafür, dass dieses
        Pokémon kurz vor seiner Entwicklung steht.
      es: |-
        Clamperl crece protegido por la sólida concha que tiene. Si
        vemos que el cuerpo no le cabe, será porque está a punto de
        evolucionar.
      it: |-
        Clamperl cresce ben protetto dalla sua conchiglia dura come
        la pietra. Quando cresce oltre la misura della conchiglia,
        significa che è prossimo all’evoluzione.
    ultra-sun:
      ja-Hrkt: |-
        こうみえて　にくしょく。　２まいの
        カラで　えものを　がっちり　はさんで
        うごかなくなるまで　はなさない。
      ja: |-
        こう見えて　肉食。　２枚の
        カラで　獲物を　がっちり　挟んで
        動かなくなるまで　離さない。
      ko: |-
        보기와는 다르게 육식이다.
        2개의 껍질로 먹이를 꽉 물고
        움직이지 않을 때까지 놓지 않는다.
      zh-Hant: |-
        別看牠長這樣，牠可是肉食性的。
        會用２片外殼牢牢夾住獵物，
        直到獵物完全不動了才會放開。
      zh-Hans: |-
        别看它长这样，它可是食肉的。
        用２片外壳牢牢夹住猎物，
        直到完全不动了才会放开。
      en: |-
        Despite its appearance, it’s carnivorous. It
        clamps down on its prey with both sides of its
        shell and doesn’t let go until they stop moving.
      fr: |-
        Malgré les apparences, c’est un carnivore qui
        attrape sa proie avec sa coquille et l’immobilise
        jusqu’à ce qu’elle ne se débatte plus.
      de: |-
        Dieses fleischfressende Pokémon klemmt seine
        Beute mit seiner Schale fest und lässt sie erst
        los, wenn sie sich nicht mehr rührt.
      es: |-
        Este Pokémon, que no aparenta ser carnívoro,
        atrapa a sus presas con ambas conchas y no
        las suelta hasta que dejan de moverse.
      it: |-
        Nonostante le apparenze, è carnivoro. Intrappola
        la preda con la conchiglia bivalve e la tiene
        stretta finché non smette di muoversi.
    ultra-moon:
      ja-Hrkt: |-
        パールルの　しんじゅは　とても
        きちょう。　シェルダーの　しんじゅの
        １０ばいいじょう　かちが　あるとも。
      ja: |-
        パールルの　真珠は　とても
        貴重。　シェルダーの　真珠の
        １０倍以上　価値が　あるとも。
      ko: |-
        진주몽의 진주는 매우 귀하다.
        셀러의 진주의 10배 이상
        가치가 있다고도 한다.
      zh-Hant: |-
        珍珠貝的珍珠非常貴重，
        據說價值是大舌貝
        所產珍珠的１０倍以上。
      zh-Hans: |-
        珍珠贝的珍珠非常贵重。
        据说，其价值或许是
        大舌贝珍珠的１０倍以上。
      en: |-
        Clamperl’s pearls are exceedingly precious.
        They can be more than 10 times as costly
        as Shellder’s pearls.
      fr: |-
        La perle de Coquiperl est tellement précieuse
        qu’elle peut valoir plus de dix fois la valeur
        de celle de Kokiyas.
      de: |-
        Seine Perle ist sehr kostbar. Es heißt, sie sei
        mindestens zehnmal so viel wert wie jene von
        Muschas.
      es: |-
        La perla que contiene vale un potosí. De hecho,
        su precio puede llegar a ser incluso más de diez
        veces superior al de la perla de Shellder.
      it: |-
        La perla di Clamperl è talmente preziosa da
        valere fino a oltre dieci volte quella di Shellder.
