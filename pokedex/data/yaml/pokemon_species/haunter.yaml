haunter:
  base_happiness: 50
  capture_rate: 90
  color: purple
  egg_groups:
    - indeterminate
  evolution_chain: gastly
  evolves_from: gastly
  flavor_text:
    red:
      en: |-
        Because of its
        ability to slip
        through blockwalls, it is said
        to be from an­
        other dimension.
    blue:
      en: |-
        Because of its
        ability to slip
        through blockwalls, it is said
        to be from an­
        other dimension.
    yellow:
      en: |-
        By licking, it
        saps the victim's
        life. It causesshaking that won't
        stop until the
        victim's demise.
    gold:
      en: |-
        In total darkness,
        where nothing is
        visible, HAUNTERlurks, silently
        stalking its next
        victim.
    silver:
      en: |-
        Its tongue is made
        of gas. If licked,
        its victim startsshaking constantly
        until death even­
        tually comes.
    crystal:
      en: |-
        It hides in the
        dark, planning to
        take the life ofthe next living
        thing that wanders
        close by.
    ruby:
      en: |-
        HAUNTER is a dangerous POKéMON.
        If one beckons you while floating in
        darkness, you must never approach it.This POKéMON will try to lick you with its
        tongue and steal your life away.
    sapphire:
      en: |-
        HAUNTER is a dangerous POKéMON.
        If one beckons you while floating in
        darkness, you must never approach it.This POKéMON will try to lick you with its
        tongue and steal your life away.
    emerald:
      en: |-
        If a HAUNTER beckons you while it is
        floating in darkness, don’t approach it.
        This POKéMON will try to lick you with its
        tongue and steal your life away.
    firered:
      en: |-
        If you get the feeling of being watched
        in darkness when nobody is around,
        HAUNTER is there.
    leafgreen:
      en: |-
        Because of its ability to slip through
        block walls, it is said to be from another
        dimension.
    diamond:
      en: |-
        It can slip through any obstacle.
        It lurks inside walls to keep an
        eye on its foes.
    pearl:
      en: |-
        It licks with its gaseous tongue
        to steal the victim’s life force.
        It lurks in darkness for prey.
    platinum:
      en: |-
        It likes to lurk in the dark and tap
        shoulders with a gaseous hand. Its
        touch causes endless shuddering.
    heartgold:
      en: |-
        In total darkness, where nothing is
        visible, HAUNTER lurks, silently
        stalking its next victim.
    soulsilver:
      en: |-
        Its tongue is made of gas. If licked,
        its victim starts shaking constantly
        until death eventually comes.
    black:
      en: |-
        It likes to lurk in the dark and tap
        shoulders with a gaseous hand. Its
        touch causes endless shuddering.
      fr: |-
        Il adore se tapir dans l’ombre et
        faire frissonner ses proies en leur
        touchant l’épaule.
    white:
      en: |-
        It likes to lurk in the dark and tap
        shoulders with a gaseous hand. Its
        touch causes endless shuddering.
      fr: |-
        Il adore se tapir dans l’ombre et
        faire frissonner ses proies en leur
        touchant l’épaule.
    black-2:
      en: |-
        It likes to lurk in the dark and tap
        shoulders with a gaseous hand. Its
        touch causes endless shuddering.
    white-2:
      en: |-
        It likes to lurk in the dark and tap
        shoulders with a gaseous hand. Its
        touch causes endless shuddering.
    x:
      ja-Hrkt: |-
        くらやみで　だれもいないのに
        みられているような　きがしたら
        そこに　ゴーストが　いるのだ。
      ja: |-
        暗闇で　だれもいないのに
        見られているような　気がしたら
        そこに　ゴーストが　いるのだ。
      ko: |-
        어둠 속에서 아무도 없는데도
        누군가가 보고 있다는 느낌이 들면
        그곳에 고우스트가 있는 것이다.
      en: |-
        If you get the feeling of being watched in darkness
        when nobody is around, Haunter is there.
      fr: |-
        Si vous avez l’impression qu’on vous surveille dans
        le noir, c’est sûrement qu’un Spectrum est dans
        le coin.
      de: |-
        Falls du im Dunkeln das Gefühl hast,
        beobachtet zu werden und niemand
        ist zu sehen, ist es bestimmt Alpollo.
      es: |-
        Cuando tienes la sensación de que te están
        observando, seguro que es porque Haunter está
        cerca.
      it: |-
        Se da soli, al buio, si ha l’impressione di essere
        osservati da qualcuno, si tratta di Haunter.
    'y':
      ja-Hrkt: |-
        ガスじょうの　したで　なめられると
        たましいを　とられてしまう。
        やみに　かくれて　えものを　ねらう。
      ja: |-
        ガス状の　舌で　なめられると
        魂を　取られてしまう。
        闇に　隠れて　獲物を　ねらう。
      ko: |-
        가스로 된 혓바닥으로 핥이게 되면
        영혼을 빼앗겨 버린다.
        어둠에 숨어 먹이를 노린다.
      en: |-
        It licks with its gaseous tongue to steal the victim’s
        life force. It lurks in darkness for prey.
      fr: |-
        Il vole l’énergie vitale de l’ennemi d’un coup de
        langue gazeuse. Il aime chasser dans l’ombre.
      de: |-
        Es beleckt seine Opfer mit seiner Zunge und stiehlt
        ihnen so Lebenskraft. Es lauert im Dunkeln auf sie.
      es: |-
        Utiliza su lengua gaseosa para chupar la vida de la
        víctima. Acecha a sus presas en la oscuridad.
      it: |-
        Lecca i nemici con la lingua tossica e sottrae la loro
        vitalità. Si cela nell’oscurità in attesa delle prede.
    omega-ruby:
      ja-Hrkt: |-
        やみに　うかぶ　ゴーストが　てまねきしても
        ぜったいに　ちかよっては　いけないよ。
        ペロリと　なめられ　いのちを　すわれてしまうぞ。
      ja: |-
        闇に　浮かぶ　ゴーストが　手招きしても
        絶対に　近寄っては　いけないよ。
        ペロリと　なめられ　命を　吸われてしまうぞ。
      ko: |-
        어둠 속에서 나타나는 고우스트가 손짓으로
        불러도 절대 가까이 가면 안 된다.
        날름 핥아져 생명을 빨린다.
      en: |-
        Haunter is a dangerous Pokémon. If one beckons you while
        floating in darkness, you must never approach it. This Pokémon
        will try to lick you with its tongue and steal your life away.
      fr: |-
        Spectrum est un Pokémon dangereux. Si l’un d’entre eux fait
        signe d’approcher, il ne faut jamais l’écouter. Ce Pokémon
        risque de sortir sa langue pour essayer de voler votre vie.
      de: |-
        Alpollo ist ein gefährliches Pokémon. Wenn es dich zu sich
        lockt, während es durch die Dunkelheit schwebt, darfst du ihm
        keinesfalls zu nahe kommen. Dieses Pokémon wird versuchen,
        an dir zu lecken und dein Leben zu stehlen.
      es: |-
        Haunter es un Pokémon peligroso. Si se ve alguno flotando
        en la oscuridad y haciendo señas, conviene no acercarse. Este
        Pokémon intentará robarle la energía a su presa a base de
        lametazos.
      it: |-
        Haunter è un Pokémon pericoloso. Se lo si vede far cenni
        mentre fluttua nell’oscurità, è meglio fuggire, poiché
        il Pokémon cercherà di leccare il malcapitato e
        succhiargli la vita.
    alpha-sapphire:
      ja-Hrkt: |-
        やみに　うかぶ　ゴーストが　てまねきしても
