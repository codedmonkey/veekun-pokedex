      de: |-
        Alpollo ist ein gefährliches Pokémon. Wenn es dir ein Zeichen
        gibt, während es durch die Dunkelheit schwebt, darfst du dich
        ihm nicht nähern. Dieses Pokémon wird versuchen, an dir zu
        lecken und dein Leben zu stehlen.
      es: |-
        Haunter es un Pokémon peligroso. Si se ve alguno flotando
        en la oscuridad y haciendo señas, conviene no acercarse. Este
        Pokémon intentará robarle la energía a su presa a base de
        lametazos.
      it: |-
        Haunter è un Pokémon pericoloso. Se lo si vede far cenni
        mentre fluttua nell’oscurità, è meglio fuggire, poiché
        il Pokémon cercherà di leccare il malcapitato e
        succhiargli la vita.
    sun:
      ja-Hrkt: |-
        くらやみから　にんげんを　ねらう。
        つめたい　したに　なめられると
        ひにひに　よわり　しに　いたる。
      ja: |-
        暗闇から　人間を　狙う。
        冷たい　舌に　舐められると
        日に日に　弱り　死に　至る。
      ko: |-
        어둠 속에서 인간을 노린다.
        차가운 혀로 핥으면
        날이 갈수록 약해져 죽음에 이른다.
      zh-Hant: |-
        會從陰暗處襲擊人類。
        如果被其冰冷的舌頭舔到，
        就會一天天虛弱至死。
      zh-Hans: |-
        从阴暗处袭击人类。
        如果被其冰冷的舌头舔到，
        就会一天天虚弱至死。
      en: |-
        It strikes at humans from total darkness.
        Those licked by its cold tongue grow weaker
        with each passing day until they die.
      fr: |-
        Il assaille les humains depuis les ténèbres.
        Une personne léchée par sa langue glaciale
        s’affaiblit jour après jour jusqu’à décéder.
      de: |-
        Es lauert Menschen im Dunkeln auf und leckt sie
        mit seiner kalten Zunge. Danach werden sie von
        Tag zu Tag schwächer, bis sie dahinscheiden.
      es: |-
        Surge de la oscuridad para atacar a la gente.
        Las víctimas de sus lametazos se debilitan
        poco a poco hasta que se les escapa la vida.
      it: |-
        Si nasconde nel buio e tende agguati agli esseri
        umani. Chi viene leccato dalla sua lingua gelida
        si indebolisce lentamente fino allo sfinimento.
    moon:
      ja-Hrkt: |-
        ひかりに　おびえ　やみよを　このむ。
        よなかも　あかるい　とかいでは
        ぜつめつの　ききに　あるという。
      ja: |-
        光に　おびえ　闇夜を　好む。
        夜中も　明るい　都会では
        絶滅の　危機に　あるという。
      ko: |-
        빛을 무서워하고 어둠을 좋아한다.
        밤중에도 밝은 도시에서는
        멸종 위기에 처해있다고 전해진다.
      zh-Hant: |-
        害怕光亮，喜歡黑夜。
        據說在深夜也燈火如晝的
        大都市中有滅絕的危險。
      zh-Hans: |-
        害怕光亮，喜欢黑夜。
        据说在即便深夜都灯火如昼的
        大都市有灭绝的危险。
      en: |-
        It fears the light and revels in the dark. It may
        be on the verge of extinction in cities that stay
        brightly lit at night.
      fr: |-
        Il a peur de la lumière et se délecte de la nuit
        noire. Dans les grandes villes où l’éclairage est
        omniprésent, il est en voie d’extinction.
      de: |-
        Es ist lichtscheu und bevorzugt die Dunkelheit.
        Aufgrund der hellen Lichter der Großstädte ist
        es dort vom Aussterben bedroht.
      es: |-
        Rehúye la luz y adora las noches oscuras. En
        las ciudades su presencia es casi inexistente,
        pues por la noche todo se ilumina.
      it: |-
        Ama l’oscurità e rifugge la luce.
        Nelle città illuminate anche di notte rischia
        di scomparire.
    ultra-sun:
      ja-Hrkt: |-
        つきのない　よる。　ゴーストは
        のろう　あいてを　さがしているので
        であるかない　ほうが　いいぞ。
      ja: |-
        月のない　夜。　ゴーストは
        呪う　相手を　探しているので
        出歩かない　方が　いいぞ。
      ko: |-
        달이 뜨지 않은 밤. 고우스트는
        저주할 상대를 찾기 때문에
        나다니지 않는 것이 좋다.
      zh-Hant: |-
        在沒有月亮的夜裡，
        鬼斯通會四處尋找詛咒的對象，
        所以不要外出比較好。
      zh-Hans: |-
        在没有月亮的晚上，
        鬼斯通会寻找可以诅咒的对象，
        所以不要外出走动比较好哦。
      en: |-
        On moonless nights, Haunter searches for
        someone to curse, so it’s best not to go out
        walking around.
      fr: |-
        Gare aux nuits sans lune ! C’est là que Spectrum
        erre à la recherche d’âmes à damner.
        Toute promenade est fortement déconseillée.
      de: |-
        In mondlosen Nächten sucht es nach Opfern,
        die es mit einem Fluch belegen kann. Zu Hause
        ist man daher am sichersten aufgehoben.
      es: |-
        Se aconseja no salir a pasear en las noches de
        luna nueva, cuando los Haunter acechan en
        busca de su próxima víctima.
      it: |-
        Nelle notti senza luna è meglio rimanere in casa:
        Haunter vaga in cerca di vittime su cui scagliare
        maledizioni!
    ultra-moon:
      ja-Hrkt: |-
        かなしい　きもちの　よるは　ひとりで
        そとに　でると　キケン。　ゴーストに
        つかまり　いえに　かえれなくなる。
      ja: |-
        悲しい　気持ちの　夜は　１人で
        外に　出ると　危険。　ゴーストに
        捕まり　家に　帰れなくなる。
      ko: |-
        슬픈 기분이 드는 밤에는 혼자
        밖에 나가면 위험하다. 고우스트에게
        붙잡혀 집에 돌아갈 수 없게 된다.
      zh-Hant: |-
        心情悲傷時在夜晚單獨外出
        是很危險的。鬼斯通會捉住你，
        讓你回不了家。
      zh-Hans: |-
        心情悲伤时单独夜出很危险。
        因为你会被鬼斯通捉住而无法回家。
      en: |-
        It’s dangerous to go outside alone on nights
        when you’re feeling sad. Haunter will catch you,
        and you won’t be able to go back home.
      fr: |-
        Évitez les balades nocturnes en solitaire en cas
        de vague à l’âme : si Spectrum vous attrape,
        vous ne pourrez plus rentrer chez vous !
      de: |-
        Von Kummer Geplagte sollten nachts nicht allein
        herumspazieren. Ansonsten lauert ihnen Alpollo
        auf und lässt sie nie mehr nach Hause zurück.
      es: |-
        Quienes se sientan tristes no deben salir solos
        por la noche, pues Haunter estará al acecho, los
        atrapará y no podrán volver a casa.
      it: |-
        È pericoloso uscire da soli la notte quando
        si è tristi: si rischia di essere presi da Haunter
        e non poter più fare ritorno a casa.
    lets-go-pikachu:
      ja-Hrkt: |-
        なめられると　いのちを　すわれる。
        からだが　ふるえて　とまらなくなり
        やがては　し　に　いたるという。
      ja: |-
        なめられると　命を　吸われる。
        体が　震えて　止まらなくなり
        やがては　死に　至るという。
      ko: |-
        핥아서 상대의 생명을 흡수한다.
        상대는 몸을 계속 벌벌 떨다가
        결국에는 죽음에 이른다고 한다.
      zh-Hant: |-
        被牠舔到時生命力會被吸走，
        身體會不受控制地不停顫抖，
        最後一命嗚呼。
      zh-Hans: |-
        被它舔到时生命力会被吸走，
        身体会不受控制地不停颤抖，
        最后一命呜呼。
      en: |-
        By licking, it saps the victim’s life. It causes
        shaking that won’t stop until the victim’s demise.
      fr: |-
        Il lèche ses ennemis pour voler leur énergie
        vitale. Ceux-ci sont alors pris de tremblements
        jusqu’à ce que mort s’ensuive.
      de: |-
        Es saugt seinen Opfern das Leben aus, indem es
        sie abschleckt. Man sagt, sie würden daraufhin
        unentwegt zittern, bis sie schließlich entschlafen.
      es: |-
        Sus lengüetazos le arrebatan la energía vital a su
        víctima y le causan unos temblores que no cesan
        hasta que fallece.
      it: |-
        Lecca la preda per assorbirne l’energia vitale.
        Si dice che la vittima venga colta da tremori
        incontrollabili e spiri entro breve.
    lets-go-eevee:
      ja-Hrkt: |-
