      it: |-
        Lecca la preda per assorbirne l’energia vitale.
        Si dice che la vittima venga colta da tremori
        incontrollabili e spiri entro breve.
    sword:
      ja-Hrkt: |-
        ガスじょうの　したで　なめられると
        からだの　ふるえが　とまらなくなり
        やがては　し　に　いたるという。
      ja: |-
        ガス状の　舌で　なめられると
        体の　震えが　止まらなくなり
        やがては　死　に　いたるという。
      ko: |-
        가스로 된 혀에 닿게 되면
        몸의 떨림이 멈추지 않게 되어
        결국에는 죽음에 이른다고 전해진다.
      zh-Hant: |-
        據說如果被牠氣體狀的舌頭舔到，
        身體就會無法停止顫抖，
        最終將會導致死亡。
      zh-Hans: |-
        据说如果被它气体状的舌头舔到，
        身体就会无法停止颤抖，
        最终将会导致死亡。
      en: |-
        Its tongue is made of gas. If licked, its victim
        starts shaking constantly until death
        eventually comes.
      fr: |-
        On raconte que quiconque est léché par sa langue
        faite de gaz est pris de tremblements jusqu’à
        ce que mort s’ensuive.
      de: |-
        Seine Zunge besteht aus Gas. Schleckt es seine
        Opfer damit ab, zittern diese unentwegt, bis sie
        schließlich entschlafen.
      es: |-
        Su lengua está hecha de gas. Si lame a su víctima,
        esta sufrirá constantes temblores hasta fallecer.
      it: |-
        Chi viene leccato dalla sua lingua gassosa
        soccombe in breve tempo scosso da tremiti
        irrefrenabili.
    shield:
      ja-Hrkt: |-
        くらやみで　だれもいないのに
        みられているような　きがしたら
        そこに　ゴーストが　いるのだ。
      ja: |-
        暗闇で　だれもいないのに
        見られているような　気がしたら
        そこに　ゴーストが　いるのだ。
      ko: |-
        어둠 속에서 아무도 없는데도
        누군가가 보고 있다는 느낌이 들면
        그곳에 고우스트가 있는 것이다.
      zh-Hant: |-
        如果黑暗中空無一人，
        但你卻感覺被什麼盯上了，
        那麼鬼斯通一定就在那裡。
      zh-Hans: |-
        如果黑暗中空空如也，
        但你却感觉被什么盯上了，
        那么鬼斯通一定就在那里。
      en: |-
        If you get the feeling of being watched in darkness
        when nobody is around, Haunter is there.
      fr: |-
        On dit que lorsque quelqu’un a l’impression
        d’être surveillé dans le noir, c’est sûrement
        qu’un Spectrum se trouve dans les parages.
      de: |-
        Falls du im Dunkeln das Gefühl hast, beobachtet
        zu werden, und niemand ist zu sehen, ist es
        bestimmt Alpollo.
      es: |-
        Cuando se tiene la sensación de ser observado
        en la oscuridad sin que haya nadie alrededor,
        seguro que es porque un Haunter anda cerca.
      it: |-
        Se da soli, al buio, si ha l’impressione di essere
        osservati da qualcuno, si tratta di Haunter.
    legends-arceus:
      en: |-
        This frightful, malevolent spirit can glide through walls,
        appearing wherever it likes. According to rumor, victims of
        a Haunter's lick will wither to death day by day.
