corphish:
  base_happiness: 50
  capture_rate: 205
  color: red
  egg_groups:
    - water1
    - water3
  evolution_chain: corphish
  evolves_from: ~
  flavor_text:
    ruby:
      en: |-
        CORPHISH were originally foreign
        POKéMON that were imported as pets.
        They eventually turned up in the wild.This POKéMON is very hardy and has
        greatly increased its population.
    sapphire:
      en: |-
        CORPHISH catches prey with its sharp
        claws. It has no likes or dislikes when it
        comes to food - it will eat anything.This POKéMON has no trouble living in
        filthy water.
    emerald:
      en: |-
        Once it grips prey with its large pincers,
        it will never let go, no matter what.
        It is a hardy POKéMON that can thrive
        in any environment.
    firered:
      en: |-
        It came from overseas. It is a very hardy
        creature that will quickly proliferate,
        even in polluted streams.
    leafgreen:
      en: |-
        It came from overseas. It is a very hardy
        creature that will quickly proliferate,
        even in polluted streams.
    diamond:
      en: |-
        Its hardy vitality enables it to
        adapt to any environment. Its
        pincers will never release prey.
    pearl:
      en: |-
        Its hardy vitality enables it to
        adapt to any environment. Its
        pincers will never release prey.
    platinum:
      en: |-
        Its hardy vitality enables it to
        adapt to any environment. Its
        pincers will never release prey.
    heartgold:
      en: |-
        It was originally a Pokémon from
        afar that escaped to the wild. It
        can adapt to the dirtiest river.
    soulsilver:
      en: |-
        It was originally a Pokémon from
        afar that escaped to the wild. It
        can adapt to the dirtiest river.
    black:
      en: |-
        Its hardy vitality enables it to
        adapt to any environment. Its
        pincers will never release prey.
      fr: |-
        Sa nature robuste lui permet de
        vivre sur n’importe quel terrain. 
        Ses pinces ne lâchent jamais prise.
    white:
      en: |-
        Its hardy vitality enables it to
        adapt to any environment. Its
        pincers will never release prey.
      fr: |-
        Sa nature robuste lui permet de
        vivre sur n’importe quel terrain. 
        Ses pinces ne lâchent jamais prise.
    black-2:
      en: |-
        No matter how dirty the water
        in the river, it will adapt and thrive.
        It has a strong will to survive.
    white-2:
      en: |-
        No matter how dirty the water
        in the river, it will adapt and thrive.
        It has a strong will to survive.
    x:
      ja-Hrkt: |-
        どんなに　みずが　よごれた
        かわでも　てきおうして　ふえていく
        タフな　せいめいりょくの　もちぬし。
      ja: |-
        どんなに　水が　汚れた
        川でも　適応して　増えていく
        タフな　生命力の　持ち主。
      ko: |-
        아무리 물이 더러운
        강이라도 적응해서 번식하는
        터프한 생명력의 소유자.
      en: |-
        No matter how dirty the water in the river, it will
        adapt and thrive. It has a strong will to survive.
      fr: |-
        Sa nature robuste lui permet de prospérer dans
        n’importe quelles eaux, aussi polluées soient-elles.
      de: |-
        Egal, wie schmutzig der Fluss ist, in dem sie leben,
        sie passen sich daran an und vermehren sich.
        Sie sind hart im Nehmen.
      es: |-
        Por sucio o contaminado que esté el río, se adaptan
        rápido y se multiplican. Poseen una gran fuerza vital.
      it: |-
        La sua grande vitalità gli permette di adattarsi e
        proliferare anche nelle acque dei fiumi più inquinati.
    'y':
      ja-Hrkt: |-
        どんな　かんきょうにも　てきおうする
        つよい　せいめいりょくの　もちぬし。
        はさんだ　えものは　はなさない。
      ja: |-
        どんな　環境にも　適応する
        強い　生命力の　持ち主。
        挟んだ　獲物は　離さない。
      ko: |-
        어떤 환경에도 적응하는
        강한 생명력의 소유자다.
        집은 먹이는 놓치지 않는다.
      en: |-
        Its hardy vitality enables it to adapt to any
        environment. Its pincers will never release prey.
      fr: |-
        Sa nature robuste lui permet de vivre sur n’importe
        quel terrain. Ses pinces ne lâchent jamais prise.
      de: |-
        Ein robustes Pokémon, das sich jeder Umgebung
        anpassen kann. Seine Zangen geben keine Beute frei.
      es: |-
        Su organismo le permite adaptarse a cualquier
        entorno. Sus pinzas nunca sueltan a su presa.
      it: |-
        La sua grande vitalità gli permette di adattarsi a ogni
        habitat. Le sue chele non rilasciano mai la preda.
    omega-ruby:
      ja-Hrkt: |-
        もともと　がいこくに　すんでいた　ポケモンを
        ペットとして　つれてきた　ものが　やせいかした。
        せいめいりょくが　つよいので　どんどん　ふえた。
      ja: |-
        元々　外国に　すんでいた　ポケモンを
        ペットとして　連れてきた　ものが　野生化した。
        生命力が　強いので　どんどん　増えた。
      ko: |-
        원래는 외국에 살던 포켓몬을
        애완용으로 데려왔던 것이 야생화됐다.
        생명력이 강해서 점점 늘어났다.
      en: |-
        Corphish were originally foreign Pokémon that were imported
        as pets. They eventually turned up in the wild. This Pokémon is
        very hardy and has greatly increased its population.
      fr: |-
        Les Écrapince étaient au départ des Pokémon étrangers
        importés comme animaux domestiques. Ils ont fini par retrouver
        leur état sauvage. Ce Pokémon est particulièrement robuste
        et sa population augmente sans arrêt.
      de: |-
        Krebscorps ist kein heimisches Pokémon, sondern wurde als
        Haustier importiert. Schließlich verwilderte es. Dieses Pokémon
        ist mittlerweile sehr robust und hat seine Population
        vergrößert.
      es: |-
        En un principio, se importaban Corphish como mascota. Pero,
        al final, se hicieron salvajes. Este Pokémon es muy resistente
        y ha aumentado su población de forma considerable.
      it: |-
        Originariamente Corphish era stato importato da altre regioni
        come Pokémon domestico. Attualmente ne sono stati
        trovati anche allo stato brado. Essendo molto resistente,
        ha moltiplicato la sua popolazione.
    alpha-sapphire:
      ja-Hrkt: |-
        するどい　ハサミで　えものを　つかまえる。
        すき　きらいが　ないので　なんでも　たべるぞ。
        きたない　みずでも　へっちゃらな　ポケモン。
      ja: |-
        鋭い　ハサミで　獲物を　捕まえる。
        好き　嫌いが　ないので　なんでも　食べるぞ。
        汚い　水でも　へっちゃらな　ポケモン。
      ko: |-
        날카로운 집게로 먹이를 잡는다.
        편식하지 않아서 뭐든지 먹는다.
        더러운 물에서도 아무렇지 않은 포켓몬이다.
      en: |-
        Corphish catches prey with its sharp claws. It has no
        likes or dislikes when it comes to food—it will eat anything.
        This Pokémon has no trouble living in filthy water.
      fr: |-
        Écrapince attrape ses proies avec ses puissantes pinces.
        Pour la nourriture, il n’est pas difficile. Il mange de tout.
        Vivre dans de l’eau sale ne dérange pas ce Pokémon.
      de: |-
        Krebscorps fängt seine Beute mit seinen scharfen Krallen.
        Es hat keine besonderen Ansprüche an seine Nahrung,
        es frisst einfach alles. Dieses Pokémon lebt gern in
        schmutzigem Wasser.
      es: |-
        Corphish atrapa a su presa con finas pinzas. En lo referente a
        comida no es delicado; se come lo que sea. Tampoco tiene
        ningún problema en vivir en aguas sucias.
      it: |-
        Corphish cattura la preda con le sue temibili chele.
        Non ha esigenze particolari riguardo al cibo, infatti mangia
        di tutto. Riesce a vivere anche in acque molto inquinate.
    ultra-sun:
      ja-Hrkt: |-
        そだてきれなく　なった　トレーナーが
        にがした　こたいが　ふえ　アローラ
        でも　よく　みかけるように　なった。
      ja: |-
        育てきれなく　なった　トレーナーが
        逃がした　個体が　増え　アローラ
        でも　よく　見かけるように　なった。
      ko: |-
        트레이너가 기를 수 없게 되어
        놓아 주었던 개체가 늘어나서
        알로라에서도 흔해졌다.
      zh-Hant: |-
        培育到一半就被訓練家
        放生的個體越來越多，
        如今在阿羅拉也能經常見到。
      zh-Hans: |-
        被没有坚持培育的训练家放生了的
        个体在增加，即使在阿罗拉也变得
        时常能见到了。
      en: |-
        Individuals that have been set free by Trainers
        who could no longer raise them have become
        common, and they can now be found in Alola.
      fr: |-
        On voit souvent des Écrapince sur les plages.
        Il s’agit en fait de Pokémon relâchés par leurs
        Dresseurs, qui ne parvenaient pas les élever.
      de: |-
        Da immer mehr Krebscorps von überforderten
        Trainern in die Freiheit entlassen werden, sieht
        man dieses Pokémon nun auch oft in Alola.
      es: |-
        Son muchos los Entrenadores que lo liberan sin
        terminar de criarlo, y su población ha crecido
        tanto que se les ha empezado a avistar en Alola.
      it: |-
        Sempre più Corphish vengono liberati da
        Allenatori che non possono più allenarli.
        Ormai si incontrano spesso anche ad Alola.
    ultra-moon:
      ja-Hrkt: |-
        かんきょうに　てきおうする　ちからが
        とてもつよい。　よどんだドブに　いる
        のは　ヒンバスと　こいつ　くらいだ。
      ja: |-
        環境に　適応する　力が
        とても強い。　淀んだドブに　いる
        のは　ヒンバスと　こいつ　くらいだ。
      ko: |-
        환경에 적응하는 힘이 매우 강하다.
        탁한 개울에 살 수 있는 건
        빈티나와 이 녀석 정도다.
      zh-Hant: |-
        對環境的適應力非常強。
        會待在混濁的臭水溝裡的，
        大概只有醜醜魚和這傢伙。
      zh-Hans: |-
        对环境的适应力非常强。
        呆在浑浊臭水沟里的
        大概就是丑丑鱼和这家伙。
      en: |-
        It can adapt very well to its environment.
        Feebas and Corphish are about the only
        Pokémon to live in stagnant ditches.
      fr: |-
        Il peut s’adapter à n’importe quel environnement.
        Barpau et lui sont d’ailleurs les seuls Pokémon
        à vivre dans l’eau des égouts !
      de: |-
        Sie sind sehr gut darin, sich an ihre Umwelt
        anzupassen. In Gräben mit trübem Wasser
        findet man nur sie und Barschwa.
      es: |-
        Posee una excelente capacidad para adaptarse
        a su entorno. Solo Corphish o Feebas habitan
        las aguas estancadas de los canales.
      it: |-
        Si adatta a ogni habitat. Insieme a Feebas, è
        l’unico Pokémon che vive nelle acque stagnanti
        dei canali.
    sword:
      ja-Hrkt: |-
        どんなに　みずが　よごれた
        かわでも　てきおうして　ふえていく
        タフな　せいめいりょくの　もちぬし。
      ja: |-
        どんなに　水が　汚れた
        川でも　適応して　増えていく
        タフな　生命力の　持ち主。
      ko: |-
        심하게 오염된 강에서도
        적응해서 번식하는
        강인한 생명력의 소유자.
      zh-Hant: |-
        有著頑強生命力的寶可夢。
        不論河裡的水有多髒
        都能適應並繁衍後代。
      zh-Hans: |-
        有着顽强生命力的宝可梦。
        不管河里的水有多脏，
        它都能适应并在那里繁衍生息。
      en: |-
        No matter how dirty the water in the river, it will
        adapt and thrive. It has a strong will to survive.
      fr: |-
        Sa nature robuste lui permet de prospérer
        dans n’importe quelles eaux, aussi polluées
        soient-elles.
      de: |-
        Egal, wie schmutzig der Fluss ist, in dem sie
        leben, sie passen sich daran an und vermehren
        sich. Sie sind hart im Nehmen.
      es: |-
        Por muy sucio o contaminado que esté el río, se
        adaptan rápido y se multiplican. Poseen una gran
        fuerza vital.
      it: |-
        La sua grande vitalità gli permette di adattarsi
        e proliferare anche nelle acque dei fiumi più
        inquinati.
    shield:
      ja-Hrkt: |-
        がいこくから　やってきた　ポケモンが
        やせいかした。　どんなに　きたない
        かわでも　てきおうしてしまう。
      ja: |-
        外国から　やってきた　ポケモンが
        野生化した。　どんなに　汚い
        川でも　適応してしまう。
      ko: |-
        외국에서 온 포켓몬이
        야생화했다. 아무리 더러운
        강이라도 적응해버린다.
      zh-Hant: |-
        來自外國的寶可夢，
        現在已經回歸了野生環境。
        不管多麼污濁的河水都能適應。
      zh-Hans: |-
        来自于外国的宝可梦，
        现在已经回归了野生环境。
        不管多么污浊的河水都能适应。
      en: |-
        It was originally a Pokémon from afar that escaped
        to the wild. It can adapt to the dirtiest river.
      fr: |-
        Un Pokémon importé, retourné à l’état sauvage.
        Il s’adapte même aux rivières les plus polluées.
      de: |-
        Es stammt eigentlich aus dem Ausland und
        verwilderte. Es passt sich auch an die dreckigsten
        Flüsse an.
      es: |-
        Si bien procede del extranjero, ahora se halla en
        estado salvaje. Puede vivir hasta en los ríos más
        sucios.
      it: |-
        Importato dall’estero, si è successivamente
        rinselvatichito. Si adatta anche ai fiumi più
        inquinati.
