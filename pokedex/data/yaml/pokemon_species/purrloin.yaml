purrloin:
  base_happiness: 50
  capture_rate: 255
  color: purple
  egg_groups:
    - ground
  evolution_chain: purrloin
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        They steal from people for fun, but their
        victims can’t help but forgive them.
        Their deceptively cute act is perfect.
      fr: |-
        Il vole les gens pour le plaisir, mais il
        est tellement mignon que ses victimes
        finissent toujours par lui pardonner.
    white:
      en: |-
        Its cute act is a ruse. When victims let
        down their guard, they find their items
        taken. It attacks with sharp claws.
      fr: |-
        Il détourne l’attention de ses victimes
        avec ses gestes mignons pour mieux les
        détrousser. En colère, il griffe.
    black-2:
      en: |-
        Their cute act is a ruse. They trick
        people and steal their valuables
        just to see the looks on their faces.
    white-2:
      en: |-
        Their cute act is a ruse. They trick
        people and steal their valuables
        just to see the looks on their faces.
    x:
      ja-Hrkt: |-
        かわいらしい　しぐさで　ゆだんさせて
        その　すきに　もちものを　うばう。
        おこると　ツメを　たてて　はんげき。
      ja: |-
        かわいらしい　仕草で　油断させて
        その　すきに　持ち物を　奪う。
        怒ると　ツメを　立てて　反撃。
      ko: |-
        귀여운 행동으로 방심하게 한 후
        그 틈에 지닌 물건을 빼앗아 간다.
        화가 나면 손톱을 세워서 반격한다.
      en: |-
        Its cute act is a ruse. When victims let down their
        guard, they find their items taken. It attacks with
        sharp claws.
      fr: |-
        Il détourne l’attention de ses victimes avec ses gestes
        mignons pour mieux les détrousser. En colère,
        il griffe.
      de: |-
        Es lenkt die Menschen durch sein süßes Verhalten ab,
        um sie zu bestehlen. Ist es wütend, kratzt es gern mal.
      es: |-
        Distrae a su oponente con movimientos gráciles y
        sustrae sus pertenencias. Cuando se enfada, ataca
        con las garras.
      it: |-
        Distrae con pose ammalianti i nemici incauti e ne
        approfitta per depredarli. Se si arrabbia, sguaina le
        unghie.
    'y':
      ja-Hrkt: |-
        ひとの　ものを　あそびで　ぬすむ。
        ぬすまれた　ひとも　あいくるしい
        しぐさに　つい　ゆるしてしまうのだ。
      ja: |-
        人の　物を　遊びで　盗む。
        盗まれた　人も　愛くるしい　仕草に
        つい　許してしまうのだ。
      ko: |-
        다른 사람의 물건을 장난삼아 훔친다.
        물건을 도둑맞은 사람도 애교 넘치는
        행동에 빠져 용서하고 만다.
      en: |-
        They steal from people for fun, but their victims
        can’t help but forgive them. Their deceptively cute
        act is perfect.
      fr: |-
        Il vole les gens pour le plaisir, mais il est tellement
        mignon que ses victimes finissent toujours par lui
        pardonner.
      de: |-
        Es stibitzt den Leuten spaßeshalber ihr Hab und Gut,
        doch dank seiner reizenden Natur kann ihm niemand
        lang böse sein.
      es: |-
        Hurta a los humanos por mera diversión, pero las
        víctimas lo perdonan al ver a este Pokémon tan
        encantador.
      it: |-
        Ruba per gioco le cose alle persone, ma è talmente
        tenero che finiscono tutti per perdonarlo.
    omega-ruby:
      ja-Hrkt: |-
        かわいらしい　しぐさで　ゆだんさせて
        その　すきに　もちものを　うばう。
        おこると　ツメを　たてて　はんげき。
      ja: |-
        かわいらしい　仕草で　油断させて
        その　すきに　持ち物を　奪う。
        怒ると　ツメを　立てて　反撃。
      ko: |-
        귀여운 행동으로 방심하게 한 후
        그 틈에 지닌 물건을 빼앗아 간다.
        화가 나면 손톱을 세워서 반격한다.
      en: |-
        Its cute act is a ruse. When victims let down their
        guard, they find their items taken. It attacks with
        sharp claws.
      fr: |-
        Il détourne l’attention de ses victimes avec ses gestes
        mignons pour mieux les détrousser. En colère, il griffe.
      de: |-
        Es lenkt die Menschen durch sein süßes Verhalten ab,
        um sie zu bestehlen. Ist es wütend, kratzt es gern mal.
      es: |-
        Distrae a su oponente con movimientos gráciles y sustrae sus
        pertenencias. Cuando se enfada, ataca con las garras.
      it: |-
        Distrae con pose ammalianti i nemici incauti e ne approfitta
        per depredarli. Se si arrabbia, sguaina le unghie.
    alpha-sapphire:
      ja-Hrkt: |-
        ひとの　ものを　あそびで　ぬすむ。
        ぬすまれた　ひとも　あいくるしい
        しぐさに　つい　ゆるしてしまうのだ。
      ja: |-
        人の　物を　遊びで　盗む。
        盗まれた　人も　愛くるしい　仕草に
        つい　許してしまうのだ。
      ko: |-
        다른 사람의 물건을 장난삼아 훔친다.
        물건을 도둑맞은 사람도 애교 넘치는
        행동에 빠져 용서하고 만다.
      en: |-
        They steal from people for fun, but their victims
        can’t help but forgive them. Their deceptively cute
        act is perfect.
      fr: |-
        Il vole les gens pour le plaisir, mais il est tellement mignon
        que ses victimes finissent toujours par lui pardonner.
      de: |-
        Es stibitzt den Leuten spaßeshalber ihr Hab und Gut, doch
        dank seiner reizenden Natur kann ihm niemand lang böse sein.
      es: |-
        Hurta a los humanos por mera diversión, pero las víctimas lo
        perdonan al ver a este Pokémon tan encantador.
      it: |-
        Ruba per gioco le cose alle persone, ma è talmente tenero
        che finiscono tutti per perdonarlo.
    sword:
      ja-Hrkt: |-
        こまった　すがたを　みるために
        ひとの　ものを　ぬすみだす。
        クスネとは　ライバルなのだ。
      ja: |-
        困った　姿を　見るために
        ひとの　ものを　盗みだす。
        クスネとは　ライバルなのだ。
      ko: |-
        곤란해하는 모습을 보기 위해
        사람의 물건을 훔친다.
        훔처우와는 라이벌 관계다.
      zh-Hant: |-
        為了要看見人們困擾的樣子
        而去偷盜他們的物品。
        和偷兒狐是競爭對手。
      zh-Hans: |-
        为了要看见人们困扰的样子
        而去偷盗他们的物品。
        和狡小狐是竞争对手。
      en: |-
        It steals things from people just to amuse itself
        with their frustration. A rivalry exists between
        this Pokémon and Nickit.
      fr: |-
        Il vole les biens des personnes rien que pour voir
        leur visage désemparé.
        Son plus grand rival est Goupilou.
      de: |-
        Es bestiehlt liebend gerne Leute, um sich an ihrer
        Frustration zu erfreuen. Mit Kleptifux verbindet
        es eine tiefe Rivalität.
      es: |-
        Sustrae las pertenencias de las personas solo
        para verlas pasar apuros. Es un rival encarnizado
        de Nickit.
      it: |-
        Ruba le cose alle persone per vederle in
        difficoltà. Nickit è il suo rivale.
    shield:
      ja-Hrkt: |-
        あいくるしい　しぐさで　ゆだんさせ
        よってきた　あいてを　いきなり
        ツメで　ひっかいて　わらっている。
      ja: |-
        愛くるしい　しぐさで　油断させ
        寄ってきた　相手を　いきなり
        ツメで　ひっかいて　笑っている。
      ko: |-
        귀여운 동작으로 방심시키고
        상대가 다가오면 갑자기
        발톱으로 할퀴고는 웃는다.
      zh-Hant: |-
        會用可愛的動作讓對手放下戒心，
        趁對方靠過來時冷不防用爪子
        猛抓，然後得意地大笑。
      zh-Hans: |-
        会用可爱的动作让对手放下戒心，
        趁对方靠过来时冷不防地用爪子
        猛抓，然后得意地大笑。
      en: |-
        Opponents that get drawn in by its adorable
        behavior come away with stinging scratches from
        its claws and stinging pride from its laughter.
      fr: |-
        Malheur à qui se laisse berner par ses gestes
        adorables : une fois les gens à sa portée,
        il les griffe sans crier gare, en ricanant.
      de: |-
        Es wiegt andere durch liebenswertes Verhalten in
        Sicherheit, kratzt sie dann plötzlich und amüsiert
        sich prächtig darüber.
      es: |-
        Una vez que ha logrado distraer al rival mediante
        sus gestos adorables, lo araña de improviso con
        las garras mientras muestra un semblante risueño.
      it: |-
        Lascia avvicinare il nemico distraendolo con
        pose ammalianti, e poi all’improvviso lo graffia
        ridendo.
