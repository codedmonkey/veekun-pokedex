    sword:
      ja-Hrkt: |-
        まわりの　かんきょうに　あわせて
        からだの　つくりを　かえていく
        のうりょくの　もちぬし。
      ja: |-
        まわりの　環境に　合わせて
        体の　つくりを　変えていく
        能力の　持ち主。
      ko: |-
        주위의 환경에 맞춰서
        몸의 구조를 바꿔나가는
        능력의 소유자다.
      zh-Hant: |-
        伊布擁有著能夠為了
        適應周遭的環境而
        改變身體構造的能力。
      zh-Hans: |-
        伊布拥有能够为了
        适应周围环境而
        改变身体构造的能力。
      en: |-
        It has the ability to alter the composition of its
        body to suit its surrounding environment.
      fr: |-
        Il a la capacité de changer la composition de
        son corps pour s’adapter à son environnement.
      de: |-
        Es ist imstande, seinen Körper perfekt an die
        jeweilige Umgebung anzupassen.
      es: |-
        Es capaz de alterar la composición de su cuerpo
        para adaptarse al entorno.
      it: |-
        Ha la capacità di alterare la propria struttura
        corporea per adattarsi all’ambiente circostante.
    shield:
      ja-Hrkt: |-
        ふあんていな　いでんしの　おかげで
        さまざまな　しんかの　かのうせいを
        ひめている　とくしゅな　ポケモン。
      ja: |-
        不安定な　遺伝子の　おかげで
        さまざまな　進化の　可能性を
        秘めている　特殊な　ポケモン。
      ko: |-
        불안정한 유전자 덕분에
        여러 가지 진화의 가능성을
        가지고 있는 특수한 포켓몬.
      zh-Hant: |-
        由於不穩定的基因，
        蘊含著各式各樣進化
        可能性的特殊寶可夢。
      zh-Hans: |-
        由于不稳定的遗传基因，
        蕴含着各种各样进化
        可能性的特殊宝可梦。
      en: |-
        Thanks to its unstable genetic makeup, this
        special Pokémon conceals many different
        possible evolutions.
      fr: |-
        L’ADN de ce Pokémon très particulier recèle
        de nombreuses possibilités d’évolution.
      de: |-
        Das Erbmaterial dieses besonderen Pokémon ist
        instabil, weshalb es das Potenzial für viele
        verschiedene Entwicklungen in sich trägt.
      es: |-
        Su irregular estructura genética alberga el secreto
        de la capacidad que posee este Pokémon tan
        especial para adoptar evoluciones muy variadas.
      it: |-
        È un Pokémon molto particolare. Dotato di un
        corredo genetico instabile, serba in sé le più
        varie possibilità evolutive.
    legends-arceus:
      en: |-
        Harbors the potential to evolve into manifold forms.
        Within Eevee lies the key to the mysteries of Pokémon
        evolution—I'm certain of it.
