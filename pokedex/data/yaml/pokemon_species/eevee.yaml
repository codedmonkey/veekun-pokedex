      fr: |-
        Son ADN particulier lui permet de
        s’adapter très rapidement à son
        environnement.
    black-2:
      en: |-
        Thanks to its unstable genetic makeup,
        this special Pokémon conceals many
        different possible evolutions.
    white-2:
      en: |-
        Thanks to its unstable genetic makeup,
        this special Pokémon conceals many
        different possible evolutions.
    x:
      ja-Hrkt: |-
        しんかのとき　すがたと　のうりょくが
        かわることで　きびしい　かんきょうに
        たいおうする　めずらしい　ポケモン。
      ja: |-
        進化のとき　姿と　能力が
        変わることで　きびしい　環境に
        対応する　珍しい　ポケモン。
      ko: |-
        진화할 때 모습과 능력이
        바뀜으로써 혹독한 환경에
        적응하는 희귀한 포켓몬이다.
      en: |-
        A rare Pokémon that adapts to harsh environments
        by taking on different evolutionary forms.
      fr: |-
        Un Pokémon rare qui s’adapte aux environnements
        hostiles en variant ses formes évolutives.
      de: |-
        Ein seltenes Pokémon, das sich seiner Umgebung
        anpasst, indem es sich in unterschiedliche Formen
        entwickelt.
      es: |-
        Un extraño Pokémon que se adapta a los entornos
        más hostiles gracias a sus diferentes evoluciones.
      it: |-
        Un Pokémon raro che si adatta agli ambienti più
        difficili assumendo diverse forme nell’evoluzione.
    'y':
      ja-Hrkt: |-
        ふあんていな　いでんしの　おかげで
        さまざまな　しんかの　かのうせいを
        ひめている　とくしゅな　ポケモン。
      ja: |-
        不安定な　遺伝子の　おかげで
        さまざまな　進化の　可能性を
        秘めている　特殊な　ポケモン。
      ko: |-
        불안정한 유전자 덕분에
        여러 가지 진화 가능성을
        간직하고 있는 특수한 포켓몬.
      en: |-
        Thanks to its unstable genetic makeup, this
        special Pokémon conceals many different
        possible evolutions.
      fr: |-
        L’ADN de ce Pokémon très particulier recèle de
        nombreuses possibilités d’évolution.
      de: |-
        Aufgrund einer genetischen Anomalie kann seine
        Entwicklung viele verschiedene Formen annehmen.
      es: |-
        Su irregular estructura genética encierra el secreto de
        su capacidad para adoptar evoluciones de lo más
        diversas.
      it: |-
        È un Pokémon molto particolare. Dotato di un corredo
        genetico instabile, serba in sé le più varie possibilità
        evolutive.
    omega-ruby:
      ja-Hrkt: |-
        くらしている　かんきょうで　とつぜんへんい　する
        ふあんていな　いでんしを　もつ　ポケモン。
        いしの　ほうしゃせんが　しんかを　ひきおこす。
      ja: |-
        暮らしている　環境で　突然変異　する
        不安定な　遺伝子を　持つ　ポケモン。
        石の　放射線が　進化を　引き起こす。
      ko: |-
        사는 환경에 따라 돌연변이하는
        불안정한 유전자를 지닌 포켓몬이다.
        돌의 방사선이 진화를 일으킨다.
      en: |-
        Eevee has an unstable genetic makeup that suddenly mutates
        due to the environment in which it lives. Radiation from various
        stones causes this Pokémon to evolve.
      fr: |-
        Évoli a une structure génétique instable qui se transforme
        en fonction de l’environnement dans lequel il vit.
        Ce Pokémon peut évoluer grâce aux radiations de
        diverses pierres.
      de: |-
        Evolis genetisches Erbmaterial ist so instabil, dass die
        Umgebung plötzliche Mutationen auslösen kann. Unter
        anderem führt die Wirkung verschiedener Steine zur
        Entwicklung dieses Pokémon.
      es: |-
        La configuración genética de Eevee le permite mutar y
        adaptarse enseguida a cualquier medio en el que viva.
        La evolución de este Pokémon suele ser posible gracias a
        las radiaciones emitidas por varias piedras.
      it: |-
        Eevee è dotato di un instabile corredo genetico che muta
        in base all’habitat naturale in cui è integrato. Le radiazioni
        di diverse pietre scatenano l’evoluzione di questo Pokémon.
    alpha-sapphire:
      ja-Hrkt: |-
        くらしている　かんきょうで　とつぜんへんい　する
        ふあんていな　いでんしを　もつ　ポケモン。
        いしの　ほうしゃせんが　しんかを　ひきおこす。
      ja: |-
        暮らしている　環境で　突然変異　する
        不安定な　遺伝子を　持つ　ポケモン。
        石の　放射線が　進化を　引き起こす。
      ko: |-
        사는 환경에 따라 돌연변이하는
        불안정한 유전자를 지닌 포켓몬이다.
        돌의 방사선이 진화를 일으킨다.
      en: |-
        Eevee has an unstable genetic makeup that suddenly mutates
        due to the environment in which it lives. Radiation from various
        stones causes this Pokémon to evolve.
      fr: |-
        Évoli a une structure génétique instable qui se transforme
        en fonction de l’environnement dans lequel il vit.
        Ce Pokémon peut évoluer grâce aux radiations de
        diverses pierres.
      de: |-
        Evolis genetisches Erbmaterial ist so instabil, dass die
        Umgebung plötzliche Mutationen auslösen kann. Unter
        anderem führt die Wirkung verschiedener Steine zur
        Entwicklung dieses Pokémon.
      es: |-
        La configuración genética de Eevee le permite mutar y
        adaptarse enseguida a cualquier medio en el que viva.
        La evolución de este Pokémon suele ser posible gracias a
        las radiaciones emitidas por varias piedras.
      it: |-
        Eevee è dotato di un instabile corredo genetico che muta
        in base all’habitat naturale in cui è integrato. Le radiazioni
        di diverse pietre scatenano l’evoluzione di questo Pokémon.
    sun:
      ja-Hrkt: |-
        アンバランス　かつ　ふあんていな
        いでんしを　もっており　さまざまな
        しんかの　かのうせいを　ひめている。
      ja: |-
        アンバランス　かつ　不安定な
        遺伝子を　持っており　様々な
        進化の　可能性を　秘めている。
      ko: |-
        언밸런스하고도 불안정한
        유전자를 가지고 있어 다양한
        진화의 가능성을 품고 있다.
      zh-Hant: |-
        擁有不平衡且不穩定的基因，
        因而蘊含著十分各種各樣的
        進化可能性。
      zh-Hans: |-
        拥有不平衡性外加不稳定的
        遗传基因，因而蕴含着各种
        各样的进化可能性。
      en: |-
        Possessing an unbalanced and unstable genetic
        makeup, it conceals many possible evolutions.
      fr: |-
        Son ADN est instable et possède de
        nombreuses possibilités d’évolution.
      de: |-
        Sein instabiles Erbmaterial ermöglicht es ihm,
        sich zu verschiedenen Pokémon zu entwickeln.
      es: |-
        Su irregular estructura genética encierra el
        secreto de su capacidad para adoptar
        evoluciones de lo más diversas.
      it: |-
        Dotato di un corredo genetico instabile,
        serba in sé varie possibilità evolutive.
    moon:
      ja-Hrkt: |-
        いま　げんざいの　ちょうさでは
        なんと　８しゅるいもの　ポケモンへ
        しんかする　かのうせいを　もつ。
      ja: |-
        今　現在の　調査では
        なんと　８種類もの　ポケモンへ
        進化する　可能性を　持つ。
      ko: |-
        지금까지 조사에 의하면
        무려 8종류의 포켓몬으로
        진화할 가능성을 갖고 있다.
      zh-Hant: |-
        根據目前的調查，
        擁有進化為多達８種
        寶可夢的可能性。
      zh-Hans: |-
        根据目前的调查，
        拥有进化为多达８种
        宝可梦的可能性。
      en: |-
        Current studies show it can evolve into an
        incredible eight different species of Pokémon.
      fr: |-
        D’après les dernières recherches, il semble que
        ce Pokémon soit capable d’évoluer en huit
        espèces différentes.
      de: |-
        Nach derzeitigem Forschungsstand kann es sich
        zu acht verschiedenen Pokémon entwickeln.
      es: |-
        Según las últimas investigaciones, Eevee es
        capaz de evolucionar a ocho especies de
        Pokémon distintas.
      it: |-
        Secondo le ultime ricerche, può evolversi in ben
        otto specie diverse.
    ultra-sun:
      ja-Hrkt: |-
        イーブイだけが　とても　ふあんていな
        いでんしを　もっている　りゆうは
        いまだ　かいめい　されて　いない。
      ja: |-
        イーブイだけが　とても　不安定な
        遺伝子を　持っている　理由は
        未だ　解明　されて　いない。
      ko: |-
        이브이만 매우 불안정한
        유전자를 갖고 있는 이유는
        아직 해명되지 않았다.
      zh-Hant: |-
        為何只有伊布有著
        極其不穩定的基因？
        理由至今仍然不明。
      zh-Hans: |-
        至今未弄清为何只有伊布
        携带着非常不稳定的遗传基因。
      en: |-
        The question of why only Eevee has such
        unstable genes has still not been solved.
      fr: |-
        À ce jour, nul ne sait pourquoi Évoli est le seul
        Pokémon dont l’ADN est instable.
      de: |-
        Evoli ist das einzige Pokémon mit einem höchst
        instabilen Erbmaterial. Die Ursache dafür ist
        nach wie vor unklar.
      es: |-
        Todavía no se ha esclarecido el motivo por el
        que es el único Pokémon que presenta un
        código genético inestable.
      it: |-
        Non si conosce ancora il motivo per cui Eevee
        sia l’unico Pokémon a possedere un corredo
        genetico così instabile.
    ultra-moon:
      ja-Hrkt: |-
        まわりの　えいきょうを　うけやすい
        いでんしを　もつ。　おやに　なった
        トレーナーの　かおにも　にてくるよ。
      ja: |-
        まわりの　影響を　受けやすい
        遺伝子を　持つ。　親に　なった
        トレーナーの　顔にも　似てくるよ。
      ko: |-
        주위의 영향을 받기 쉬운
        유전자를 가졌다. 어버이가 된
        트레이너의 얼굴에도 닮아 간다.
      zh-Hant: |-
        有著容易受到周遭影響的基因。
        就連長相都會變得和
        成為牠主人的訓練家越來越像。
      zh-Hans: |-
        有着易受周围影响的遗传基因。
        就连长相都会变得和成为
        它主人的训练家很像哦。
      en: |-
        Its genes are easily influenced by its
        surroundings. Even its face starts to look like
        that of its Trainer.
      fr: |-
        L’ADN d’Évoli est sujet aux influences de
        son environnement. Sa tête finit même par
        ressembler à celle de son Dresseur.
      de: |-
        Seine DNS-Struktur ist anfällig für Einflüsse von
        außen. Selbst die Gesichtszüge seines Trainers
        können sich in ihm wiedererkennen lassen.
      es: |-
        Su genética es muy sensible a la influencia del
        entorno, hasta el punto de que su rostro puede
        llegar a parecerse al de su Entrenador.
      it: |-
        Possiede un corredo genetico molto suscettibile
        all’influenza dell’ambiente in cui vive. Può anche
        finire per assomigliare al suo Allenatore.
    lets-go-pikachu:
      ja-Hrkt: |-
        さまざまな　すがたに　しんかする。
        イーブイの　いでんしは　しんかの
        ひみつを　ときあかす　かぎ　だ。
      ja: |-
        様々な　姿に　進化する。
        イーブイの　遺伝子は　進化の
        秘密を　解き明かす　カギだ。
      ko: |-
        다양한 모습으로 진화한다.
        이브이의 유전자는 진화의
        비밀을 밝혀낼 열쇠다.
      zh-Hant: |-
        能夠進化成許多樣子。
        伊布的基因是解開
        進化之謎的關鍵。
      zh-Hans: |-
        能进化成很多样子。
        伊布的基因也是解开
        进化之谜的关键。
      en: |-
        It can evolve into a variety of forms.
        Eevee’s genes are the key to solving
        the mysteries of Pokémon evolution.
      fr: |-
        Il peut évoluer de diverses façons. Son ADN est
        la clé pour percer le secret de l’évolution.
      de: |-
        Es kann sich auf verschiedene Weise entwickeln.
        Evolis genetischer Code ist der Schlüssel für das
        Geheimnis der Entwicklung von Pokémon.
      es: |-
        Puede evolucionar a varias especies distintas.
        Su código genético es la clave para descifrar el
        misterio de dicha evolución.
      it: |-
        Eevee può evolversi in diverse specie.
        Il suo corredo genetico è la chiave per fare luce
        sul mistero dell’evoluzione.
    lets-go-eevee:
      ja-Hrkt: |-
        さまざまな　すがたに　しんかする。
        イーブイの　いでんしは　しんかの
        ひみつを　ときあかす　かぎ　だ。
      ja: |-
