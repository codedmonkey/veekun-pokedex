swadloon:
  base_happiness: 70
  capture_rate: 120
  color: green
  egg_groups:
    - bug
  evolution_chain: sewaddle
  evolves_from: sewaddle
  flavor_text:
    black:
      en: |-
        Forests where Swadloon live have superb
        foliage because the nutrients they make
        from fallen leaves nourish the plant life.
      fr: |-
        Dans les forêts où il vit, la végétation
        pousse bien car il transforme les
        feuilles mortes en engrais.
    white:
      en: |-
        It protects itself from the cold
        by wrapping up in leaves. It stays on
        the move, eating leaves in forests.
      fr: |-
        Il se protège du froid en s’emmitouflant
        dans une feuille. Il se déplace en forêt
        et mange les feuilles tombées par terre.
    black-2:
      en: |-
        Preferring dark, damp places,
        it spends the entire day eating
        fallen leaves that lie around it.
    white-2:
      en: |-
        Preferring dark, damp places,
        it spends the entire day eating
        fallen leaves that lie around it.
    x:
      ja-Hrkt: |-
        クルマユの　すむ　もりは　くさきが
        よく　そだつ。クルマユが　おちばを
        えいようぶんに　かえているのだ。
      ja: |-
        クルマユの　住む　森は　草木が
        よく　育つ。クルマユが　落ち葉を
        栄養分に　変えているのだ。
      ko: |-
        두르쿤이 사는 숲은 초목이
        잘 자란다. 두르쿤이 낙엽을
        영양분으로 바꾸기 때문이다.
      en: |-
        Forests where Swadloon live have superb foliage
        because the nutrients they make from fallen leaves
        nourish the plant life.
      fr: |-
        Dans les forêts où il vit, la végétation pousse bien
        car il transforme les feuilles mortes en engrais.
      de: |-
        Es wandelt herabgefallenes Laub in Nährstoffe um.
        In Wäldern, wo es Folikon gibt, fühlen sich Pflanzen
        pudelwohl.
      es: |-
        La vegetación abunda en los bosques que habita. Este
        Pokémon transforma las hojas caídas en nutrientes.
      it: |-
        Le foreste in cui vive Swadloon sono lussureggianti,
        poiché trasforma le foglie morte in sostanze nutritive.
    'y':
      ja-Hrkt: |-
        はっぱで　からだを　つつみこんで
        さむさを　ふせぐ。てぢかな　おちばを
        たべながら　もりを　いどうする。
      ja: |-
        葉っぱで　体を　包みこんで
        寒さを　防ぐ。手近な　落ち葉を
        食べながら　森を　移動する。
      ko: |-
        잎사귀로 몸을 감싸
        추위를 막는다. 가까이 있는 낙엽을
        먹으며 숲을 이동한다.
      en: |-
        It protects itself from the cold by wrapping up in
        leaves. It stays on the move, eating leaves
        in forests.
      fr: |-
        Il se protège du froid en s’emmitouflant dans une
        feuille. Il se déplace en forêt et mange les feuilles
        tombées par terre.
      de: |-
        Es schützt sich vor Kälte, indem es sich in Blätter
        einwickelt. Es durchstreift Wälder und frisst
        herabgefallenes Laub.
      es: |-
        Se guarece del frío envolviéndose en hojas. Se
        desplaza por el bosque comiendo a su paso las
        hojas caídas.
      it: |-
        Si protegge dal freddo avvolgendo il corpo nelle
        foglie, che ha l’abitudine di mangiare in giro per la
        foresta.
    omega-ruby:
      ja-Hrkt: |-
