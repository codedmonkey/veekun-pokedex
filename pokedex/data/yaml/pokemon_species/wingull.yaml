wingull:
  base_happiness: 50
  capture_rate: 190
  color: white
  egg_groups:
    - water1
    - flying
  evolution_chain: wingull
  evolves_from: ~
  flavor_text:
    ruby:
      en: |-
        WINGULL has the habit of carrying prey
        and valuables in its beak and hiding
        them in all sorts of locations.This POKéMON rides the winds and flies
        as if it were skating across the sky.
    sapphire:
      en: |-
        WINGULL rides updrafts rising from the
        sea by extending its long and narrow
        wings to glide.This POKéMON’s long beak is useful for
        catching prey.
    emerald:
      en: |-
        It makes its nest on a sheer cliff at the
        edge of the sea. It has trouble keeping
        its wings flapping in flight. Instead, it
        soars on updrafts.
    firered:
      en: |-
        It rides upon ocean winds as if it were
        a glider. In the winter, it hides food
        around its nest.
    leafgreen:
      en: |-
        It rides upon ocean winds as if it were
        a glider. In the winter, it hides food
        around its nest.
    diamond:
      en: |-
        It makes its nest on steep sea
        cliffs. Riding updrafts, it soars
        to great heights.
    pearl:
      en: |-
        Catching sea winds with its long
        wings, it soars as if it were a
        glider. It folds its wings to rest.
    platinum:
      en: |-
        It soars high in the sky, riding on
        updrafts like a glider. It carries
        food tucked in its bill.
    heartgold:
      en: |-
        It soars on updrafts without
        flapping its wings. It makes a nest
        on sheer cliffs at the sea’s edge.
    soulsilver:
      en: |-
        It soars on updrafts without
        flapping its wings. It makes a nest
        on sheer cliffs at the sea’s edge.
    black:
      en: |-
        It soars high in the sky, riding on
        updrafts like a glider. It carries
        food tucked in its bill.
      fr: |-
        Il utilise les courants ascendants
        pour planer en altitude. Son bec lui
        sert à transporter la nourriture.
    white:
      en: |-
        It soars high in the sky, riding on
        updrafts like a glider. It carries
        food tucked in its bill.
      fr: |-
        Il utilise les courants ascendants
        pour planer en altitude. Son bec lui
        sert à transporter la nourriture.
    black-2:
      en: |-
        It makes its nest on sheer cliffs.
        Riding the sea breeze, it glides
        up into the expansive skies.
    white-2:
      en: |-
        It makes its nest on sheer cliffs.
        Riding the sea breeze, it glides
        up into the expansive skies.
    x:
      ja-Hrkt: |-
        ながい　つばさで　うみかぜを　うけて
        グライダーのように　かっくうする。
        やすむときは　つばさを　おりたたむ。
      ja: |-
        長い　翼で　海風を　受けて
        グライダーのように　滑空する。
        休むときは　翼を　折り畳む。
      ko: |-
        긴 날개로 바닷바람을 받아서
        글라이더처럼 활공한다.
        쉴 때는 날개를 접는다.
      en: |-
        Catching sea winds with its long wings, it soars
        as if it were a glider. It folds its wings to rest.
      fr: |-
        Il plane sur les vents marins grâce à ses longues ailes.
        Il les replie pour se reposer.
      de: |-
        Es lässt sich vom Wind der Meere treiben,
        als wäre es ein Segelflugzeug.
      es: |-
        Sus largas alas aprovechan los vientos marinos para
        planear. Cuando descansa, las pliega.
      it: |-
        Segue i venti marini con le sue lunghe ali e si libra
        in volo come un aliante. Si riposa piegando le ali.
    'y':
      ja-Hrkt: |-
        うみべの　だんがいぜっぺきに
        すを　つくる。じょうしょうきりゅうを
        りようして　おおぞらに　まいあがる。
      ja: |-
        海辺の　断崖絶壁に
        巣を　作る。上昇気流を　利用して
        大空に　舞い上がる。
      ko: |-
        해변의 낭떠러지 절벽에
        둥지를 튼다. 상승기류를
        이용하여 넓은 하늘로 날아오른다.
      en: |-
        It makes its nest on steep sea cliffs.
        Riding updrafts, it soars to great heights.
      fr: |-
        Il niche sur les falaises escarpées face à la mer.
        Il vole en altitude grâce aux courants ascendants.
      de: |-
        Es baut sein Nest auf steilen Klippen. Es nutzt die
        Aufwinde, um in größerer Höhe fliegen zu können.
      es: |-
        Anida en acantilados y alcanza gran altura
        aprovechando las corrientes ascendentes.
      it: |-
        Nidifica su scogliere a picco sul mare. Si fa trasportare
        ad alta quota dalle correnti ascensionali.
    omega-ruby:
      ja-Hrkt: |-
        エサや　だいじな　ものを　くちばしに　はさみ
        いろんな　ばしょに　かくす　しゅうせいを　もつ。
        かぜに　のって　すべる　ように　そらを　とぶ。
      ja: |-
        エサや　大事な　ものを　くちばしに　挟み
        色んな　場所に　隠す　習性を　持つ。
        風に　乗って　滑る　ように　空を　飛ぶ。
      ko: |-
        먹이나 소중한 것을 부리에 끼우고
        여러 장소에 숨기는 습성을 지녔다.
        바람을 타고 미끄러지듯 하늘을 난다.
      en: |-
        Wingull has the habit of carrying prey and valuables in its beak
        and hiding them in all sorts of locations. This Pokémon rides
        the winds and flies as if it were skating across the sky.
      fr: |-
        Goélise a l’habitude de transporter ses proies et ses objets
        de valeur dans son bec avant de les cacher. Ce Pokémon
        se laisse porter par le vent et vole comme s’il surfait
        dans les cieux.
      de: |-
        Man sieht Wingull oft mit seiner Beute oder seinen
        Besitztümern im Schnabel herumfliegen auf der Suche
        nach geeigneten Verstecken. Dieses Pokémon fliegt
        durch die Lüfte, als würde es gleiten.
      es: |-
        Wingull tiene la costumbre de llevar a su presa y objetos de
        valor en el pico, y esconderlos en distintos sitios. Este
        Pokémon vuela dejándose llevar por las corrientes de aire
        como si fuera patinando por el cielo.
      it: |-
        Wingull ha l’abitudine di trasportare prede e oggetti preziosi
        nel becco per poi nasconderli dappertutto. Questo Pokémon
        vola a cavallo dei venti planando in cielo.
    alpha-sapphire:
      ja-Hrkt: |-
        うみから　ふく　じょうしょう　きりゅうに　のり
        ほそながい　つばさを　のばして　かっくうする。
        ながい　くちばしは　エサを　とるときに　べんり。
      ja: |-
        海から　吹く　上昇　気流に　乗り
        細長い　翼を　伸ばして　滑空する。
        長い　くちばしは　エサを　取るときに　便利。
      ko: |-
        바다에서 불어오는 상승기류를 타고
        가늘고 긴 날개를 펼쳐 활공한다.
        긴 부리는 먹이를 잡을 때 편리하다.
      en: |-
        Wingull rides updrafts rising from the sea by extending its long
        and narrow wings to glide. This Pokémon’s long beak is useful
        for catching prey.
      fr: |-
        Grâce à ses ailes longues et étroites, Goélise se laisse porter
        par les courants d’air ascendants venant de la mer. Le long
        bec de ce Pokémon est bien pratique pour attraper ses proies.
      de: |-
        Wingull breitet seine langen, schmalen Flügel aus und segelt
        im Seewind. Der lange Schnabel dieses Pokémon ist ihm beim
        Jagen nach Beute sehr hilfreich.
      es: |-
        Wingull emerge del mar y asciende desplegando las largas y
        estrechas alas que posee. Este Pokémon tiene un pico largo
        que le resulta muy útil para pescar.
      it: |-
        Wingull segue le correnti ascensionali presenti sul mare
        allargando le sue ali lunghe e strette per planare.
        Il lungo becco del Pokémon è utile per catturare la preda.
    sun:
      ja-Hrkt: |-
        ホネは　かるさのために　スカスカ。
        おおきな　つばさで　かぜを　うけ
        おおぞらへと　まいあがる。
      ja: |-
        骨は　軽さのために　スカスカ。
        大きな　翼で　風を　受け
        大空へと　舞いあがる。
      ko: |-
        뼈는 무게를 줄이기 위해 비어 있다.
        큰 날개로 바람을 타고
        넓은 하늘로 날아오른다.
      zh-Hant: |-
        空心的骨頭是為了保持輕盈。
        用大大的翅膀迎著風，
        飛向浩瀚的天空。
      zh-Hans: |-
        为了轻盈，骨骼空空的。
        用大大的翅膀迎风，
        向着浩瀚天空飞翔。
      en: |-
        Its hollow bones enhance its lightness.
        It spreads its wings to the wind and soars away
        into the sky.
      fr: |-
        Son ossature légère lui confère un vol gracieux,
        tandis que le vent s’engouffre sous ses grandes
        ailes, lui permettant de s’élever au firmament.
      de: |-
        Seine Knochen sind hohl und daher sehr leicht.
        Mit seinen ausgebreiteten großen Flügeln steigt
        es hoch in den Himmel empor.
      es: |-
        Sus huesos livianos y sus grandes alas le
        permiten dejarse llevar por el viento y surcar
        los cielos grácilmente.
      it: |-
        Volteggia lieve nel cielo sfruttando le correnti
        grazie alle ossa leggere e alle grandi ali.
    moon:
      ja-Hrkt: |-
        キャモメが　とびかう　うみの　したは
        さかなポケモンが　むれているので
        りょうしは　まずキャモメを　さがす。
      ja: |-
        キャモメが　飛び交う　海の　下は
        さかなポケモンが　群れているので
        漁師は　まずキャモメを　探す。
      ko: |-
        갈모매가 어지럽게 나는 바다 아래에는
        물고기포켓몬이 무리 지어 있으므로
        어부들은 우선 갈모매부터 찾는다.
      zh-Hant: |-
        在長翅鷗飛來飛去的海底下
        聚集著成群的魚寶可夢，
        所以漁夫會先尋找長翅鷗。
      zh-Hans: |-
        在长翅鸥飞来飞去的海下面
        聚集着成群的鱼宝可梦，
        所以渔夫会先寻找长翅鸥。
      en: |-
        Fishermen keep an eye out for Wingull in the
        sky, because wherever they’re circling, the
        ocean is sure to be teeming with fish Pokémon.
      fr: |-
        Les Goélise survolent les mers qui grouillent de
        Pokémon poissons. Un grand pêcheur a dit :
        « Si tu veux une bonne prise, suis le Goélise. »
      de: |-
        Fischer halten gerne Ausschau nach Wingull,
        denn wo diese ihre Kreise ziehen, scharen sich
        unter Wasser Schwärme von Fisch-Pokémon.
      es: |-
        Suele sobrevolar los bancos de Pokémon pez,
        por lo que los pescadores siguen a Wingull
        cuando buscan buenas capturas.
      it: |-
        I pescatori li tengono d’occhio per via della
        loro abitudine di volare sui tratti di mare dove
        si radunano i Pokémon acquatici.
    ultra-sun:
      ja-Hrkt: |-
        ほそく　ながい　つばさ。　じょうしょう
        きりゅうに　のって　グライダーの
        ように　おおぞらに　まいあがるのだ。
      ja: |-
        細く　長い　翼。　上昇
        気流に　乗って　グライダーの
        ように　大空に　舞い上がるのだ。
      ko: |-
        가늘고 긴 날개다. 상승 기류를
        타고 글라이더처럼
        넓은 하늘로 높이 떠오른다.
      zh-Hant: |-
        翅膀又細又長，
        能乘著上升氣流，
        像滑翔機一般飛上天空。
      zh-Hans: |-
        翅膀又细又长。
        能乘着上升气流，
        像滑翔机一样在空中翱翔。
      en: |-
        With its long, thin wings, it catches updrafts
        and flies like a glider high up into the sky.
      fr: |-
        Grâce à ses ailes longues et fines, il se laisse
        porter par les courants ascendants pour planer
        jusqu’au firmament.
      de: |-
        Seine Flügel sind lang und schmal. Es nutzt die
        Aufwinde, um wie ein Segelflugzeug hoch in den
        Himmel emporzusteigen.
      es: |-
        Tiene alas largas y finas. Se deja llevar por las
        corrientes ascendentes y luego planea a alta
        cota grácilmente.
      it: |-
        Grazie alle ali lunghe e strette, vola in alto
        lasciandosi trasportare dalle correnti
        ascensionali come un aliante.
    ultra-moon:
      ja-Hrkt: |-
        うみべの　がけに　すをつくる。
        だいこうぶつの　ヨワシを　さがし
        うみの　うえを　せんかい　している。
      ja: |-
        海辺の　崖に　巣を作る。
        大好物の　ヨワシを　探し
        海の　上を　旋回　している。
      ko: |-
        바닷가 절벽에 둥지를 짓는다.
        가장 좋아하는 약어리를 찾아
        바다 위를 선회하고 있다.
      zh-Hant: |-
        在海邊的懸崖上築巢。
        會在海上盤旋，尋找牠
        最愛吃的弱丁魚。
      zh-Hans: |-
        在海边的悬崖上筑巢。
        会在海上盘旋，
        寻找它非常爱吃的弱丁鱼。
      en: |-
        It builds nests in cliffs by the sea. It circles the
        skies above the ocean looking for its favorite
        food—Wishiwashi.
      fr: |-
        Il fait son nid sur les falaises du littoral
        et survole la mer en cercle à la recherche
        de son mets favori : les petits Froussardine.
      de: |-
        Es baut sein Nest auf steilen Klippen und kreist
        über dem Meer auf der Suche nach Lusardin,
        seiner Lieblingsspeise.
      es: |-
        Anida en los riscos junto a la costa y sobrevuela
        el mar trazando círculos en busca de algún
        Wishiwashi que llevarse al buche.
      it: |-
        Fa il nido sulle rocce a picco lungo la costa.
        Vola sul mare in cerca delle sue prede preferite,
        i Wishiwashi.
    sword:
      ja-Hrkt: |-
        きりたった　がけに　すを　つくり
        うみかぜを　りようして　ひろいそらを
        じょうしょうし　かっくう　するのだ。
      ja: |-
        切り立った　崖に　巣を　つくり
        海風を　利用して　広い空を
        上昇し　滑空　するのだ。
      ko: |-
        깎아지른 절벽에 둥지를 만들고
        바닷바람을 이용하여
        넓은 하늘 위로 올라 활공한다.
      zh-Hant: |-
        在陡峭的岩壁上築巢，
        會藉助海風，飛升到
        廣闊的天空中滑翔。
      zh-Hans: |-
        在陡峭的岩壁上筑巢，
        会借助海风，飞升到
        广阔的天空中滑翔。
      en: |-
        It makes its nest on sheer cliffs. Riding the sea
        breeze, it glides up into the expansive skies.
      fr: |-
        Il construit son nid le long des falaises et utilise
        les courants ascendants pour planer en altitude.
      de: |-
        Es baut sein Nest an Steilhängen und nutzt die
        Seebrise, um beim Gleiten am weiten Himmel
        an Höhe zu gewinnen.
      es: |-
        Construye sus nidos en acantilados escarpados.
        Aprovecha la brisa marina para elevarse hacia el
        inmenso cielo y planear.
      it: |-
        Costruisce il nido a ridosso dei precipizi.
        Sfrutta la brezza marina per levarsi alto in cielo.
    shield:
      ja-Hrkt: |-
        くうきの　ながれを　りようして
        はばたかずに　そらへ　まいあがる。
        うみべの　がけに　すを　つくる。
      ja: |-
        空気の　流れを　利用して
        羽ばたかずに　空へ　舞い上がる。
        海辺の　崖に　巣を　つくる。
      ko: |-
        공기의 흐름을 이용하여
        날갯짓하지 않고 하늘로 날아오른다.
        해변의 절벽에 둥지를 만든다.
      zh-Hant: |-
        利用氣流，
        不拍打翅膀就能飛上天空。
        會在海邊的岩壁上築巢。
      zh-Hans: |-
        利用气流，
        不拍打翅膀就能飞上天空。
        会在海边的岩壁上筑巢。
      en: |-
        It soars on updrafts without flapping its wings.
        It makes a nest on sheer cliffs at the sea’s edge.
      fr: |-
        Il niche dans les falaises.
        En utilisant les courants d’air, il peut voler
        sans battre des ailes.
      de: |-
        Es nistet an Steilküsten und nutzt die Luftströme,
        um im Gleitflug in den Himmel emporzusteigen.
      es: |-
        Aprovecha las corrientes de aire para ganar
        altura sin necesidad de batir las alas. Anida
        en acantilados costeros.
      it: |-
        Sfrutta le correnti ascensionali per volteggiare
        nel cielo senza sbattere le ali. Fa il nido nelle
        scogliere lungo la costa.
