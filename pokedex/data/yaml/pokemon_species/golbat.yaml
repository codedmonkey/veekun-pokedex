golbat:
  base_happiness: 50
  capture_rate: 90
  color: purple
  egg_groups:
    - flying
  evolution_chain: zubat
  evolves_from: zubat
  flavor_text:
    red:
      en: |-
        Once it strikes,
        it will not stop
        draining energyfrom the victim
        even if it gets
        too heavy to fly.
    blue:
      en: |-
        Once it strikes,
        it will not stop
        draining energyfrom the victim
        even if it gets
        too heavy to fly.
    yellow:
      en: |-
        It attacks in a
        stealthy manner,
        without warning.Its sharp fangs
        are used to bite
        and suck blood.
    gold:
      en: |-
        However hard its
        victim's hide may
        be, it punctureswith sharp fangs
        and gorges itself
        with blood.
    silver:
      en: |-
        It can drink more
        than 10 ounces of
        blood at once. Ifit has too much,
        it gets heavy and
        flies clumsily.
    crystal:
      en: |-
        When it plunges
        its fangs into its
        prey, it instantlydraws and gulps
        down more than ten
        ounces of blood.
    ruby:
      en: |-
        GOLBAT loves to drink the blood of
        living things. It is particularly active
        in the pitch black of night.This POKéMON flits around in the night
        skies, seeking fresh blood.
    sapphire:
      en: |-
        GOLBAT bites down on prey with its four
        fangs and drinks the victim’s blood.
        It becomes active on inky darkmoonless nights, flying around to
        attack people and POKéMON.
    emerald:
      en: |-
        Its fangs easily puncture even thick
        animal hide. It loves to feast on the blood
        of people and POKéMON. It flits about in
        darkness and strikes from behind.
    firered:
      en: |-
        It clamps down on its prey with needle-
        sharp fangs and drains over 10 ounces of
        blood in one gulp.
    leafgreen:
      en: |-
        Once it bites, it will not stop draining
        energy from the victim even if it gets too
        heavy to fly.
    diamond:
      en: |-
        It loves the blood of humans and
        Pokémon. It flies around at night
        in search of neck veins.
    pearl:
      en: |-
        Once it starts sucking blood, it
        does not stop until it is full. It
        flies at night in search of prey.
    platinum:
      en: |-
        Its sharp fangs puncture the
        toughest of hides and have small
        holes for greedily sucking blood.
    heartgold:
      en: |-
        However hard its victim’s hide may be,
        it punctures with sharp fangs
        and gorges itself with blood.
    soulsilver:
      en: |-
        It can drink more than 10 ounces of
        blood at once. If it has too much,
        it gets heavy and flies clumsily.
    black:
      en: |-
        Its sharp fangs puncture the
        toughest of hides and have small
        holes for greedily sucking blood.
      fr: |-
        Ses crocs acérés et creux peuvent
        pénétrer la plus épaisse des peaux
        et sucer le sang de la victime.
    white:
      en: |-
        Its sharp fangs puncture the
        toughest of hides and have small
        holes for greedily sucking blood.
      fr: |-
        Ses crocs acérés et creux peuvent
        pénétrer la plus épaisse des peaux
        et sucer le sang de la victime.
    black-2:
      en: |-
        Flitting around in the dead of night,
        it sinks its fangs into its prey and
        drains a nearly fatal amount of blood.
    white-2:
      en: |-
        Flitting around in the dead of night,
        it sinks its fangs into its prey and
        drains a nearly fatal amount of blood.
    x:
      ja-Hrkt: |-
        かみついたら　さいご。しぬほど
        ちを　すいまくるので　おもたくなって
        じぶんで　とべなくなることもある。
      ja: |-
        かみついたら　最後。死ぬほど
        血を　吸いまくるので　重たくなって
        自分で　飛べなくなることもある。
      ko: |-
        물리면 끝이다. 죽을 정도로
        피를 빨아들이기 때문에 무거워져서
        날 수 없게 될 때도 있다.
      en: |-
        Once it bites, it will not stop draining energy
        from the victim even if it gets too heavy to fly.
      fr: |-
        Il mord son adversaire et absorbe toute son énergie,
        même s’il devient trop lourd pour voler.
      de: |-
        Dieses Pokémon saugt dem Gegner selbst dann noch
        Energie ab, wenn es zu schwer zum Fliegen wird.
      es: |-
        Cuando ataque, seguirá chupando energía de su
        víctima, aunque pese tanto que ya no pueda volar.
      it: |-
        Quando attacca, non smette di succhiare l’energia
        della vittima, fino a diventare troppo pesante
        per volare.
    'y':
      ja-Hrkt: |-
        ひとたび　ちを　すいはじめると
        まんぷくに　なるまで　やめない。
        くらやみを　とび　えものを　さがす。
      ja: |-
        ひとたび　血を　吸いはじめると
        満腹になるまで　やめない。
        暗闇を　飛び　獲物を　探す。
      ko: |-
        한번 피를 빨기 시작하면
        배가 부를 때까지 그만두지 않는다.
        어둠 속을 날며 먹이를 찾는다.
      en: |-
        Once it starts sucking blood, it does not stop until
        it is full. It flies at night in search of prey.
      fr: |-
        Quand il se met à sucer du sang, il ne s’arrête
        qu’une fois rassasié. C’est un chasseur nocturne.
      de: |-
        Hat es einmal angefangen Blut zu saugen, hört es
        erst wieder auf, wenn es satt ist. Es jagt nachts.
      es: |-
        Cuando chupa sangre, no para hasta hartarse.
        Por la noche sale volando a la caza de presas.
      it: |-
        Quando inizia a succhiare sangue, non smette finché
        non è sazio. Vola di notte in cerca di prede.
    omega-ruby:
      ja-Hrkt: |-
        いきものの　けつえきが　だいこうぶつ。
        とくに　まよなか　かつどうする　ことが　おおく
        いきちを　もとめて　よぞらを　とびまわる。
      ja: |-
        生き物の　血液が　大好物。
        特に　真夜中　活動する　ことが　多く
        生き血を　求めて　夜空を　飛び回る。
      ko: |-
        생물의 혈액을 매우 좋아한다.
        특히 한밤중에 활동하는 경우가 많으며
        생피를 찾아 밤하늘을 날아다닌다.
      en: |-
        Golbat loves to drink the blood of living things. It is particularly
        active in the pitch black of night. This Pokémon flits around in
        the night skies, seeking fresh blood.
      fr: |-
        Nosferalto adore boire le sang des créatures vivantes.
        Il est particulièrement actif pendant les nuits noires.
        Ce Pokémon se balade dans les cieux étoilés, à la recherche
        de sang frais.
      de: |-
        Golbat hat es auf das Blut von Lebewesen abgesehen.
        Im Schutze der Nacht wird es besonders aktiv. Dieses
        Pokémon fliegt durch die Nacht, um nach frischem Blut
        zu suchen.
      es: |-
        A Golbat le encanta chuparles la sangre a los seres vivos. Este
        Pokémon es más activo en la oscuridad de la noche. Es al caer
        la noche cuando sale a revolotear y a buscar sangre fresca.
      it: |-
        Golbat adora bere il sangue di creature viventi.
        È particolarmente attivo di notte, nella totale oscurità.
        Svolazza nel cielo notturno in cerca di sangue fresco.
    alpha-sapphire:
      ja-Hrkt: |-
        ４ほんの　キバで　かみつき　けつえきを　のむ。
        つきの　でてない　まっくらな　よるは　かっぱつに
        とびまわり　ひとや　ポケモンを　おそうぞ。
      ja: |-
        ４本の　キバで　かみつき　血液を　飲む。
        月の　出てない　真っ暗な　夜は　活発に
        飛び回り　人や　ポケモンを　襲うぞ。
      ko: |-
        4개의 이빨로 물어 혈액을 마신다.
        달이 뜨지 않은 캄캄한 밤에는 활발하게
        날아다니며 사람이나 포켓몬을 습격한다.
      en: |-
        Golbat bites down on prey with its four fangs and drinks
        the victim’s blood. It becomes active on inky dark
        moonless nights, flying around to attack people and Pokémon.
      fr: |-
        Nosferalto mord sa proie grâce à ses quatre crocs pour
        boire son sang. Il ne sort que lorsque la nuit est noire
        et sans lune, pour voleter en quête de gens et de Pokémon
        à mordre.
      de: |-
        Golbat beißt seine Beute mit seinen vier Reißzähnen und trinkt
        das Blut seiner Opfer. Es wird in Nächten aktiv, in denen nicht
        einmal der Mond scheint. Es fliegt dann durch die Dunkelheit
        und greift Menschen und Pokémon an.
      es: |-
        Golbat derriba a sus víctimas mordiéndoles con los cuatro
        colmillos que tiene y chupándoles la sangre. Solo entra en
        acción en las noches sin luna. Revolotea en la oscuridad para
        atacar a Pokémon y personas.
      it: |-
        Golbat azzanna i nemici con i suoi quattro canini e ne beve
        il sangue. È particolarmente attivo nel buio pesto delle notti
        senza luna e vola attaccando le persone e gli altri Pokémon.
    sun:
      ja-Hrkt: |-
        ふとい　キバは　ストローのように
        なかが　くうどうで　いがいに　もろい。
        ちを　すうのに　とっか　したのだ。
      ja: |-
        太い　キバは　ストローのように
        中が　空洞で　意外に　もろい。
        血を　吸うのに　特化　したのだ。
      ko: |-
        두꺼운 이빨은 빨대처럼
        속이 비어있어 의외로 약하다.
        피를 빠는데 특화된 것이다.
      zh-Hant: |-
        粗粗的牙齒像吸管一樣是中空的，
        所以意想不到地脆弱。
        這牙齒是專為吸血而演變而成的。
      zh-Hans: |-
        粗粗的牙齿像吸管一样，
        中间是空的，因而意想不到的脆弱。
        是为了吸血而特别进化的。
      en: |-
        Its thick fangs are hollow like straws, making
        them unexpectedly fragile. These fangs are
        specialized for sucking blood.
      fr: |-
        Ses crocs sont creux comme des pailles et
        étonnamment fragiles. Ils sont en revanche
        parfaits pour sucer le sang de ses victimes.
      de: |-
        Seine dicken Reißzähne sind im Inneren hohl
        wie Strohhalme und zerbrechlich. Sie sind das
        Produkt seiner Entwicklung zum Blutsauger.
      es: |-
        Succiona la sangre de sus presas con sus
        gruesos colmillos, que son huecos por dentro a
        modo de caña y más frágiles de lo que parecen.
      it: |-
        I suoi grossi canini sono cavi come cannucce
        e sorprendentemente fragili. Se ne serve per
        succhiare il sangue.
    moon:
      ja-Hrkt: |-
        ちを　すいすぎて　とべなくなり
        じめんに　おちて　ほかの　ポケモンの
        えじきに　なっていることも。
      ja: |-
        血を　吸い過ぎて　飛べなくなり
        地面に　落ちて　他の　ポケモンの
        餌食に　なっていることも。
      ko: |-
        피를 너무 빨아들여 날 수 없게 되어
        땅에 떨어져 다른 포켓몬의
        먹이가 되는 일도 있다.
      zh-Hant: |-
        也有發生過因吸血過多無法飛行
        而落到地面成為其他寶可夢的
        食物的事情。
      zh-Hans: |-
        因吸血过多无法飞行而落到
        地面成为其他宝可梦的食物，
        这样的事也有过。
      en: |-
        Sometimes they drink so much blood, they can’t
        fly anymore. Then they fall to the ground and
        become food for other Pokémon.
      fr: |-
        Il arrive qu’un Nosferalto ayant trop sucé de
        sang ne puisse plus voler et tombe au sol,
        où il est dévoré par d’autres Pokémon.
      de: |-
        Manchmal saugt es so viel Blut, dass es
        hilflos zu Boden fällt und leichte Beute für
        andere Pokémon wird.
      es: |-
        A veces chupa tanta sangre que es incapaz de
        volar y cae al suelo para acabar siendo presa
        de otros Pokémon.
      it: |-
        Se succhia troppo sangue, non riesce più
        a volare e cade a terra diventando preda
        di altri Pokémon.
    ultra-sun:
      ja-Hrkt: |-
        くうふくの　あまり　はがねポケモンに
        かみついたせいで　キバの　かけた
        ゴルバットを　たまに　みかけるぞ。
      ja: |-
        空腹の　あまり　はがねポケモンに
        噛みついたせいで　キバの　欠けた
        ゴルバットを　たまに　見かけるぞ。
      ko: |-
        배가 고픈 나머지 강철포켓몬을
        물어 버리는 바람에 이빨이 빠진
        골뱃을 가끔 볼 수 있다.
      zh-Hant: |-
        有時可以看見因為肚子太餓
        而去咬鋼屬性寶可夢，
        結果因此缺了牙齒的大嘴蝠。
      zh-Hans: |-
        因为它肚子太饿
        而去咬了钢属性宝可梦，
        所以偶尔会看见缺了牙的大嘴蝠。
      en: |-
        Every once in a while, you’ll see a Golbat that’s
        missing some fangs. This happens when hunger
        drives it to try biting a Steel-type Pokémon.
      fr: |-
        On rencontre parfois des Nosferalto édentés
        que la faim a poussés à attaquer un Pokémon
        de type Acier.
      de: |-
        Um seinen Hunger zu stillen, versucht es
        mitunter auch, in Stahl-Pokémon zu beißen,
        und bricht sich dabei die Reißzähne ab.
      es: |-
        En ocasiones se ven ejemplares a los que les
        falta algún colmillo por haber intentado morder
        a un Pokémon de tipo Acero, presas del hambre.
      it: |-
        A volte si vedono dei Golbat senza canini
        perché, spinti dalla fame, hanno provato
        ad azzannare un Pokémon di tipo Acciaio.
    ultra-moon:
      ja-Hrkt: |-
        １どに　３００シーシーの　けつえきを
        すいとる。　あまりに　たくさん　ちを
        すって　とべなくなることも　ある。
      ja: |-
        １度に　３００シーシーの　血液を
        吸い取る。　あまりに　たくさん　血を
        吸って　飛べなくなることも　ある。
      ko: |-
        한 번에 300cc의 혈액을
        빨아들인다. 너무 많은 피를
        빨아들여서 날 수 없게 되는 일도 있다.
      zh-Hant: |-
        一次能吸３００毫升的血液。
        有時會因為吸了太多的血，
        連飛都飛不起來。
      zh-Hans: |-
        一次能吸３００毫升的血液。
        有时会因吸血过多而无法飞行。
      en: |-
        They can suck down over 10 ounces of blood in
        one go. They have been known to drink so much
        blood that they can no longer fly.
      fr: |-
        Ce Pokémon peut absorber jusqu’à 300 ml
        de sang d’un coup. Victime de sa gourmandise,
        il en devient parfois trop lourd pour voler.
      de: |-
        In einem Schluck kann es bis zu 300 ml Blut
        absaugen. Manchmal trinkt es so viel, dass es
        nicht mehr fliegen kann.
      es: |-
        Es capaz de ingerir 300 cc de sangre de una
        sentada. A veces chupa tanta que es incapaz
        de volar.
      it: |-
        Può succhiare 300 cc di sangue in un colpo
        solo. Quando ne succhia troppo, non riesce
        più a volare.
    lets-go-pikachu:
      ja-Hrkt: |-
        どこから　ともなく　ちかづいてくる。
        するどいキバを　つかって　かみつくと
        どうじに　ちを　すいまくる。
      ja: |-
        どこから　ともなく　近づいてくる。
        するどいキバを　使って　かみつくと
        同時に　血を　吸いまくる。
      ko: |-
        어디선가 소리 없이 다가온다.
        날카로운 이빨로 무는
        동시에 피를 빨아들인다.
      zh-Hant: |-
        會無聲無息地靠近過來，
        用銳利的獠牙咬住對手，
        盡情吸食對手的血液。
      zh-Hans: |-
        难以察觉它会从哪里悄悄
        接近。它会用尖锐的牙
        咬住对手，同时使劲地吸血。
      en: |-
        It attacks in a stealthy manner,
        without warning. Its sharp fangs
        are used to bite and to suck blood.
      fr: |-
        Il s’approche furtivement et attaque sans crier
        gare. Ses crocs acérés lui servent à sucer le sang.
      de: |-
        Golbat nähert sich schnell und lautlos an.
        Mit seinen spitzen Zähnen beißt es zu und
        saugt seinen Opfern Blut ab.
      es: |-
        Tras aproximarse sigilosamente a su objetivo,
        utiliza sus afilados colmillos para chuparle la
        sangre.
      it: |-
        Attacca in modo repentino e furtivo. Usa i denti
        aguzzi per mordere e succhiare sangue.
    lets-go-eevee:
      ja-Hrkt: |-
        どこから　ともなく　ちかづいてくる。
        するどいキバを　つかって　かみつくと
        どうじに　ちを　すいまくる。
      ja: |-
        どこから　ともなく　近づいてくる。
        するどいキバを　使って　かみつくと
        同時に　血を　吸いまくる。
      ko: |-
        어디선가 소리 없이 다가온다.
        날카로운 이빨로 무는
        동시에 피를 빨아들인다.
      zh-Hant: |-
        會無聲無息地靠近過來，
        用銳利的獠牙咬住對手，
        盡情吸食對手的血液。
      zh-Hans: |-
        难以察觉它会从哪里悄悄
        接近。它会用尖锐的牙
        咬住对手，同时使劲地吸血。
      en: |-
        It attacks in a stealthy manner,
        without warning. Its sharp fangs
        are used to bite and to suck blood.
      fr: |-
        Il s’approche furtivement et attaque sans crier
        gare. Ses crocs acérés lui servent à sucer le sang.
      de: |-
        Golbat nähert sich schnell und lautlos an.
        Mit seinen spitzen Zähnen beißt es zu und
        saugt seinen Opfern Blut ab.
      es: |-
        Tras aproximarse sigilosamente a su objetivo,
        utiliza sus afilados colmillos para chuparle la
        sangre.
      it: |-
        Attacca in modo repentino e furtivo. Usa i denti
        aguzzi per mordere e succhiare sangue.
    sword:
      ja-Hrkt: |-
        いきものの　けつえきが　こうぶつ。
        はらぺこの　なかまに　すった　ちを
        わけあたえることも　あるという。
      ja: |-
        生き物の　血液が　好物。
        腹ペコの　仲間に　吸った　血を
        分け与えることも　あるという。
      ko: |-
        살아 있는 생물의 혈액을 좋아한다.
        굶주린 동료에게 빨아들인 피를
        나눠주기도 한다고 한다.
      zh-Hant: |-
        喜歡吸食生物的血液。
        據說還會將吸來的血
        分給空腹的夥伴。
      zh-Hans: |-
        喜欢吸食生物的血液。
        据说也会把自己吸到的血
        分给肚子饿扁了的伙伴。
      en: |-
        It loves to drink other creatures’ blood. It’s said
        that if it finds others of its kind going hungry,
        it sometimes shares the blood it’s gathered.
      fr: |-
        Le sang des êtres vivants est son péché mignon.
        On dit qu’il partage parfois ce précieux breuvage
        avec ses congénères affamés.
      de: |-
        Das Blut anderer Lebewesen ist seine Leibspeise.
        Man sagt, dass es das abgesaugte Blut manchmal
        mit hungrigen Artgenossen teilt.
      es: |-
        Le encanta chuparles la sangre a los seres vivos.
        En ocasiones comparte la preciada colecta con
        otros congéneres hambrientos.
      it: |-
        Va matto per il sangue di altre creature.
        Si dice che a volte lo condivida con i compagni
        affamati.
    shield:
      ja-Hrkt: |-
        ちいさな　あしで　きように　あるく。
        ねている　エモノに　しのびより
        キバを　つきたて　ちを　すするのだ。
      ja: |-
        小さな　脚で　器用に　歩く。
        寝ている　獲物に　忍びより
        キバを　突きたて　血を　すするのだ。
      ko: |-
        작은 다리로 능숙하게 걷는다.
        자고 있는 먹이에게 살며시 다가가
        이빨을 꽂아 피를 빨아먹는다.
      zh-Hant: |-
        能以小小的腳靈巧地步行。
        會無聲無息地靠近沉睡中的獵物，
        用獠牙咬住對方並且吸食血液。
      zh-Hans: |-
        用小而灵活的脚走路。
        会悄悄接近正在睡觉的猎物，
        用尖牙咬住对方吸取血液。
      en: |-
        Its feet are tiny, but this Pokémon walks skillfully.
        It sneaks up on sleeping prey before sinking in its
        fangs and slurping up blood.
      fr: |-
        Il se déplace habilement sur ses petites pattes,
        s’approche silencieusement de sa proie endormie,
        et lui suce le sang à l’aide de ses crocs.
      de: |-
        Golbat kann trotz seiner kleinen Beine geschickt
        laufen. Es schleicht sich an schlafende Beute an,
        stößt seine Zähne in sie und schlürft ihr Blut.
      es: |-
        Camina con soltura sobre sus pequeñas patas. Se
        acerca con sigilo a su presa mientras esta duerme
        y le clava los colmillos para chuparle la sangre.
      it: |-
        Cammina agilmente con i piccoli piedi.
        Si avvicina di soppiatto alle prede addormentate
        per azzannarle e berne il sangue.
    legends-arceus:
      en: |-
        It sinks its sharp fangs into other creatures and slurps up their
        blood. A closer look at the fangs reveals that they are hollow
        and akin to straws.
