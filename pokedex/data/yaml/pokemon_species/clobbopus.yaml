  evolution_chain: clobbopus
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        えさを　もとめ　ちじょうに　あがる。
        こうきしんおうせいで　めにしたものは
        とりあえず　しょくしゅで　なぐる。
      ja: |-
        餌を　求め　地上に　上がる。
        好奇心旺盛で　目にしたものは
        とりあえず　触手で　殴る。
      ko: |-
        먹이를 찾아 지상으로 올라온다.
        호기심이 왕성해서 눈에 들어오는 것은
        일단 촉수로 때리고 본다.
      zh-Hant: |-
        會為了尋找食物而登上陸地。
        擁有旺盛的好奇心，不管看到什麼，
        都會先用觸手打一打再說。
      zh-Hans: |-
        会为了寻找食物而登上陆地。
        拥有旺盛的好奇心，不管看到什么，
        都会先用触手打一打再说。
      en: |-
        It’s very curious, but its means of investigating
        things is to try to punch them with its tentacles.
        The search for food is what brings it onto land.
      fr: |-
        Il se rend sur la terre ferme pour se nourrir.
        Très curieux, son premier réflexe est de frapper
        tout ce qu’il voit avec ses tentacules.
      de: |-
        Zur Futtersuche kommt es an Land. Es ist sehr
        neugierig, weshalb es alles, was es sieht,
        zunächst einmal mit seinen Tentakeln haut.
      es: |-
        Emerge a tierra firme en busca de alimento. Su
        extrema curiosidad lo induce a golpear con los
        tentáculos todo lo que entra en su campo visual.
      it: |-
        Si spinge sulla terraferma in cerca di cibo.
        È molto curioso e colpisce con i tentacoli tutto
        quello che entra nel suo campo visivo.
    shield:
      ja-Hrkt: |-
        ３さいじ　くらいの　かしこさ。
        しょくしゅは　よくちぎれるが
        さいせいするので　きにしない。
      ja: |-
        ３歳児　くらいの　賢さ。
        触手は　よくちぎれるが
        再生するので　気にしない。
      ko: |-
        세 살 아이 정도의 지능을 가졌다.
        촉수는 잘 끊어지지만
        재생되기 때문에 신경 쓰지 않는다.
      zh-Hant: |-
        智商大致相當於３歲的兒童。
        雖然觸手經常斷掉，但因為
        能再生，所以牠並不在意。
      zh-Hans: |-
        智商大致相当于３岁的儿童。
        虽然触手经常断掉，但因为
        能再生，所以它并不在意。
      en: |-
        Its tentacles tear off easily, but it isn’t alarmed
        when that happens—it knows they’ll grow back.
        It’s about as smart as a three-year-old.
      fr: |-
        Il a l’intelligence d’un enfant de trois ans.
        Il perd souvent ses tentacules, mais comme
        ils repoussent, il ne s’en soucie guère.
      de: |-
        Sein Verstand ist ungefähr auf dem Level eines
        dreijährigen Kindes. Es macht ihm nichts aus, dass
        seine Tentakel oft abreißen, da sie nachwachsen.
      es: |-
        Su inteligencia es similar a la de un niño de tres
        años. Sus tentáculos se desprenden a menudo,
        pero ni se inmuta, ya que se regeneran solos.
      it: |-
        Ha l’intelligenza di un bambino di 3 anni. Gli
        si staccano spesso i tentacoli, ma poiché gli
        ricrescono naturalmente non se ne preoccupa.
