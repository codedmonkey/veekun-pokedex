grapploct:
  base_happiness: 50
  capture_rate: 45
  color: blue
  egg_groups:
    - water1
    - humanshape
  evolution_chain: clobbopus
  evolves_from: clobbopus
  flavor_text:
    sword:
      ja-Hrkt: |-
        ぜんしんが　きんにくの　かたまり。
        しょくしゅを　つかって　くりだす
        しめわざの　いりょくは　すさまじい。
      ja: |-
        全身が　筋肉の　塊。
        触手を　使って　繰りだす
        絞め技の　威力は　凄まじい。
      ko: |-
        온몸이 근육덩어리다.
        촉수를 사용해서 펼치는
        조르기 기술의 위력은 무시무시하다.
      zh-Hant: |-
        全身都是肌肉。
        會用觸手施展絞技，
        威力無與倫比。
      zh-Hans: |-
        全身都是肌肉。
        会用触手施展绞技，
        威力无与伦比。
      en: |-
        A body made up of nothing but muscle makes
        the grappling moves this Pokémon performs with
        its tentacles tremendously powerful.
      fr: |-
        Son corps est un amas de muscles.
        La puissance des prises d’étranglement
        qu’il exécute avec ses tentacules est saisissante.
      de: |-
        Sein Körper besteht gänzlich aus Muskeln.
        Die schiere Stärke seines Würgegriffs, bei dem
        es seine Tentakel einsetzt, ist sagenhaft.
      es: |-
        Todo su cuerpo es una mole de puro músculo.
        Utiliza los tentáculos para ejecutar técnicas de
        estrangulamiento con una formidable potencia.
      it: |-
        Il suo corpo è un ammasso di muscoli.
        È in grado di stritolare con una potenza
        formidabile grazie ai suoi tentacoli.
    shield:
      ja-Hrkt: |-
        おのれのうでを　ためすべく　りくに
        あがり　たいせんあいてを　さがす。
        たたかいおえると　うみに　かえる。
      ja: |-
        おのれの腕を　試すべく　陸に
        上がり　対戦相手を　探す。
        戦い終えると　海に　帰る。
      ko: |-
        자신의 실력을 시험하기 위해
        육지로 올라가 대전 상대를 찾는다.
        싸움이 끝나면 바다로 돌아간다.
      zh-Hant: |-
        會為了試自己的身手
        而登上陸地尋找對手。
        戰鬥結束後就會回到海裡。
      zh-Hans: |-
        会为了试自己的身手
        而登上陆地寻找对手。
        战斗结束后就会回到海里。
      en: |-
        Searching for an opponent to test its skills
        against, it emerges onto land. Once the battle
        is over, it returns to the sea.
      fr: |-
        Mû par le besoin de tester la force de ses bras,
        il se rend sur la terre ferme pour trouver
        un adversaire. Il retourne à l’eau après le combat.
      de: |-
        Um sein Können zu testen, kommt es an Land
        und begibt sich auf die Suche nach Gegnern.
        Sind die Kämpfe vorbei, kehrt es ins Meer zurück.
      es: |-
        Se aventura en tierra firme para buscar rivales
        contra los que luchar para medir su valía. Tras
        terminar el combate, regresa al mar.
      it: |-
        Si spinge sulla terraferma in cerca di avversari
        da sfidare per mettere alla prova la propria
        forza. Terminata la lotta, ritorna in mare.
