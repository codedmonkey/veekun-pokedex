    x:
      ja-Hrkt: |-
        はなびら　から　はっさんされる
        においには　あらそう　きもちを
        しずめる　せいぶんが　ふくまれる。
      ja: |-
        花びらから　発散される　においには
        争う　気持ちを　静める
        成分が　含まれる。
      ko: |-
        꽃잎에서 발산되는
        향기에는 다투는 마음을
        가라앉게 하는 성분이 담겨 있다.
      en: |-
        The aroma that rises from its petals contains a
        substance that calms aggressive feelings.
      fr: |-
        L’arôme qui émane de ses pétales contient
        une substance qui calme les pulsions agressives.
      de: |-
        Das Aroma aus seiner Blüte enthält Stoffe,
        die jegliche Aggressivität schwinden lassen.
      es: |-
        El olor que desprenden sus pétalos contiene una
        sustancia que calma el instinto agresivo.
      it: |-
        L’aroma che si spande dai suoi petali contiene una
        sostanza che placa gli istinti aggressivi.
    'y':
      ja-Hrkt: |-
        メガニウムが　はきだす　いきには
        かれた　くさきを　よみがえらせる
        ちからが　ひめられている。
      ja: |-
        メガニウムが　吐き出す　息には
        枯れた　草木を　よみがえらせる
        力が　秘められている。
      ko: |-
        메가니움이 뿜어내는 숨결에는
        말라 죽은 풀과 나무를 살려내는
        힘이 담겨 있다.
      en: |-
        Meganium’s breath has the power to revive dead
        grass and plants. It can make them healthy again.
      fr: |-
        Le souffle de Méganium a le pouvoir de redonner
        la santé aux plantes malades ou mortes.
      de: |-
        Meganie kann mit seinem Atem abgestorbene Gräser
        und Pflanzen reanimieren. Sie sind dann gesund.
      es: |-
        El aliento de Meganium tiene el poder de revivir los
        rastrojos, además de regenerarlos.
      it: |-
        Il respiro di Meganium può far riprendere l’erba e le
        piante morte che ricrescono rigogliose.
    omega-ruby:
      ja-Hrkt: |-
        はなの　かおりは　きもちを　おだやかにする。
        たたかいの　ときは　かおりを　はっさんさせて
        あいての　たたかう　きもちを　にぶらせるのだ。
      ja: |-
        花の　香りは　気持ちを　穏やかにする。
        戦いの　ときは　香りを　発散させて
        相手の　戦う　気持ちを　鈍らせるのだ。
      ko: |-
        꽃의 향기는 기분을 평안하게 만든다.
        싸울 때는 향기를 발산하여
        상대의 전의를 떨어뜨린다.
      en: |-
        The fragrance of Meganium’s flower soothes and calms
        emotions. In battle, this Pokémon gives off more of its
        becalming scent to blunt the foe’s fighting spirit.
      fr: |-
        Le parfum de la fleur de Méganium apaise et calme les esprits.
        Pendant les combats, ce Pokémon émet son parfum relaxant
        pour atténuer l’agressivité de l’ennemi.
      de: |-
        Der Duft von Meganies Blume besänftigt Gemüter. Im Kampf
        gibt dieses Pokémon mehr von seinem beruhigenden Duftstoff
        ab, um den Kampfgeist des Gegners zu schwächen.
      es: |-
        La fragancia de la flor de Meganium aplaca y suaviza los
        ánimos. Al luchar, este Pokémon libera mayor cantidad de
        esencia para disminuir el ánimo de combate de su oponente.
      it: |-
        L’aroma del fiore di Meganium placa le emozioni. Nella lotta
        questo Pokémon emana un profumo con effetto calmante
        per smorzare l’aggressività del nemico.
    alpha-sapphire:
