accelgor:
  base_happiness: 50
  capture_rate: 75
  color: red
  egg_groups:
    - bug
  evolution_chain: shelmet
  evolves_from: shelmet
  flavor_text:
    black:
      en: |-
        When its body dries out, it weakens.
        So, to prevent dehydration, it wraps
        itself in many layers of thin membrane.
      fr: |-
        Quand son corps s’assèche, il faiblit.
        Il s’en prémunit en s’enroulant dans
        plusieurs couches d’une fine muqueuse.
    white:
      en: |-
        Having removed its heavy shell,
        it becomes very light and can fight
        with ninja-like movements.
      fr: |-
        Il s’est bien allégé en se débarrassant
        de sa lourde carapace. Il se bat avec
        l’agilité d’un ninja.
    black-2:
      en: |-
        When its body dries out, it weakens.
        So it wraps a membrane around itself
        for protection while it spits poison.
    white-2:
      en: |-
        When its body dries out, it weakens.
        So it wraps a membrane around itself
        for protection while it spits poison.
    x:
      ja-Hrkt: |-
        おもい　カラを　ぬいだために
        みがるになった。まるで　にんじゃの
        ような　みのこなしで　たたかう。
      ja: |-
        重い　殻を　脱いだために
        身軽になった。まるで　忍者のような
        身のこなしで　戦う。
      ko: |-
        무거운 껍데기를 벗었기 때문에
        몸이 가벼워졌다. 마치 닌자 같은
        몸놀림으로 싸운다.
      en: |-
        Having removed its heavy shell, it becomes very
        light and can fight with ninja-like movements.
      fr: |-
        Il s’est bien allégé en se débarrassant de sa lourde
        carapace. Il se bat avec l’agilité d’un ninja.
      de: |-
        Seit es die schwere Muschel abgestreift hat, ist es
        viel leichter. Nun gleichen seine Kampfbewegungen
        denen eines Ninja.
      es: |-
        Se siente ligero una vez liberado de su caparazón.
        Lucha y se mueve como un ninja.
      it: |-
        Liberatosi della pesante conchiglia, è diventato
        leggero. Lotta con le movenze proprie di un ninja.
    'y':
      ja-Hrkt: |-
        からだが　かわくと　よわってしまう。
        うすい　まくを　なんじゅうも　まいて
        かんそうを　ふせいでいるのだ。
      ja: |-
        体が　乾くと　弱ってしまう。
        薄い　膜を　何重も　巻いて
        乾燥を　防いでいるのだ。
      ko: |-
        몸이 마르면 약해진다.
        얇은 막을 몇 겹이나 두르고
        건조해지는 것을 막고 있다.
      en: |-
        When its body dries out, it weakens. So, to prevent
        dehydration, it wraps itself in many layers of
        thin membrane.
      fr: |-
        Quand son corps s’assèche, il faiblit. Il s’en prémunit
        en s’enroulant dans plusieurs couches d’une fine
        muqueuse.
      de: |-
        Da es ohne Flüssigkeit an Kraft verliert, schützt es
        sich mit mehreren dünnen Hautschichten vor dem
        Austrocknen.
      es: |-
        Los ambientes secos lo debilitan. Evita la sequedad
        envolviéndose en muchas membranas finas
        superpuestas.
      it: |-
        Si indebolisce quando il corpo si secca. Previene
        l’essiccazione avvolgendosi in molti strati di sottili
        membrane.
    omega-ruby:
      ja-Hrkt: |-
        おもい　カラを　ぬいだために
        みがるになった。まるで　にんじゃの
        ような　みのこなしで　たたかう。
      ja: |-
        重い　殻を　脱いだために
        身軽になった。まるで　忍者のような
        身のこなしで　戦う。
      ko: |-
        무거운 껍데기를 벗었기 때문에
        몸이 가벼워졌다. 마치 닌자 같은
        몸놀림으로 싸운다.
      en: |-
        Having removed its heavy shell, it becomes very
        light and can fight with ninja-like movements.
      fr: |-
        Il s’est bien allégé en se débarrassant de sa lourde carapace.
        Il se bat avec l’agilité d’un ninja.
      de: |-
        Seit es die schwere Muschel abgestreift hat, ist es viel leichter.
        Nun gleichen seine Kampfbewegungen denen eines Ninja.
      es: |-
        Se siente ligero una vez liberado de su caparazón. Lucha y se
        mueve como un ninja.
      it: |-
        Liberatosi della pesante conchiglia, è diventato leggero.
        Lotta con le movenze proprie di un ninja.
    alpha-sapphire:
      ja-Hrkt: |-
        からだが　かわくと　よわってしまう。
        うすい　まくを　なんじゅうも　まいて
        かんそうを　ふせいでいるのだ。
      ja: |-
        体が　乾くと　弱ってしまう。
        薄い　膜を　何重も　巻いて
        乾燥を　防いでいるのだ。
      ko: |-
        몸이 마르면 약해진다.
        얇은 막을 몇 겹이나 두르고
        건조해지는 것을 막고 있다.
      en: |-
        When its body dries out, it weakens. So, to prevent
        dehydration, it wraps itself in many layers of
        thin membrane.
      fr: |-
        Quand son corps s’assèche, il faiblit. Il s’en prémunit
        en s’enroulant dans plusieurs couches d’une fine muqueuse.
      de: |-
        Da es ohne Flüssigkeit an Kraft verliert, schützt es sich mit
        mehreren dünnen Hautschichten vor dem Austrocknen.
      es: |-
        Los ambientes secos lo debilitan. Evita la sequedad
        envolviéndose en muchas membranas finas superpuestas.
      it: |-
        Si indebolisce quando il corpo si secca. Previene
        l’essiccazione avvolgendosi in molti strati di sottili
        membrane.
    sword:
      ja-Hrkt: |-
        すばやい　うごきで　どくを　とばし
        たたかう。　アギルダーが　しゅやくの
        えいがや　マンガは　だいにんき。
      ja: |-
        素早い　動きで　毒を　飛ばし
        戦う。　アギルダーが　主役の
        映画や　マンガは　大人気。
      ko: |-
        재빠른 움직임으로 독을 날려서
        싸운다. 어지리더가 주인공인
        영화나 만화는 인기가 많다.
      zh-Hant: |-
        行動迅速，會噴出毒液來戰鬥。
        敏捷蟲擔綱主角的電影
        和漫畫擁有極高的人氣。
      zh-Hans: |-
        行动迅速，会喷出毒液来战斗。
        敏捷虫担任主角的电影
        和漫画拥有极高的人气。
      en: |-
        It moves with blinding speed and lobs poison at
        foes. Featuring Accelgor as a main character is
        a surefire way to make a movie or comic popular.
      fr: |-
        Il se bat avec célérité en projetant du poison.
        Il est si cool qu’il est souvent le héros de films
        ou de bandes dessinées à succès.
      de: |-
        Im Kampf spuckt es mit flinken Bewegungen Gift.
        Filme und Comics mit Hydragil in der Hauptrolle
        erfreuen sich großer Beliebtheit.
      es: |-
        Lucha escupiendo veneno y moviéndose a una
        velocidad de vértigo. Ha protagonizado películas
        y cómics de gran éxito.
      it: |-
        Lotta spruzzando veleno con rapidi movimenti.
        È protagonista di fumetti e film che riscuotono
        un grandissimo successo.
    shield:
      ja-Hrkt: |-
        カラを　ぬぎすて　みがるに　なった。
        おびじょうの　ねんまくを　からだに
        まきつけ　かんそうを　ふせぐ。
      ja: |-
        殻を　脱ぎ捨て　身軽に　なった。
        帯状の　粘膜を　体に
        巻きつけ　乾燥を　防ぐ。
      ko: |-
        껍질을 벗어 몸이 가벼워졌다.
        띠 형태의 점막을 몸에 둘러
        건조해지는 것을 방지한다.
      zh-Hant: |-
        脫殼後變得更輕巧了。
        為了防止乾燥，會將
        帶狀的黏膜裹在身上。
      zh-Hans: |-
        脱壳后变得更轻巧了。
        为了防止干燥，会将
        带状的粘膜裹在身上。
      en: |-
        Discarding its shell made it nimble. To keep
        itself from dehydrating, it wraps its body in
        bands of membrane.
      fr: |-
        Il est bien plus agile sans sa coquille.
        La membrane en forme de bandelettes
        qui l’entoure l’empêche de se dessécher.
      de: |-
        Seit es seine Muschel abgestreift hat, ist es viel
        leichter und agiler. Es umhüllt sich mit einer
        Schleimhaut, die es vor dem Austrocknen schützt.
      es: |-
        Tras deshacerse del caparazón, su agilidad ha
        aumentado. Las membranas que le recubren el
        cuerpo evitan que se deshidrate.
      it: |-
        Si è liberato della conchiglia, diventando più
        leggero. Le membrane a forma di fasce che
        ricoprono il suo corpo evitano che si secchi.
