glalie:
  base_happiness: 50
  capture_rate: 75
  color: gray
  egg_groups:
    - fairy
    - mineral
  evolution_chain: snorunt
  evolves_from: snorunt
  flavor_text:
    ruby:
      en: |-
        GLALIE has a body made of rock, which it
        hardens with an armor of ice.
        This POKéMON has the ability to freezemoisture in the atmosphere into any
        shape it desires.
    sapphire:
      en: |-
        GLALIE has the ability to freely
        control ice. For example, it can
        instantly freeze its foe solid.After immobilizing its foe in ice, this
        POKéMON enjoys eating it in leisurely
        fashion.
    emerald:
      en: |-
        A GLALIE has the power to instantaneously
        freeze moisture in the atmosphere.
        A dazzling cloud of diamondlike ice
        crystals forms around its body.
    firered:
      en: |-
        It has a body of ice that won’t melt,
        even with fire. It can instantly freeze
        moisture in the atmosphere.
    leafgreen:
      en: |-
        It has a body of ice that won’t melt,
        even with fire. It can instantly freeze
        moisture in the atmosphere.
    diamond:
      en: |-
        To protect itself, it clads its
        body in an armor of ice, made
        by freezing moisture in the air.
    pearl:
      en: |-
        To protect itself, it clads its
        body in an armor of ice, made
        by freezing moisture in the air.
    platinum:
      en: |-
        It prevents prey from escaping by
        instantaneously freezing moisture
        in the air.
    heartgold:
      en: |-
        It can instantly freeze moisture in
        the atmosphere. It uses this power
        to freeze its foes.
    soulsilver:
      en: |-
        It can instantly freeze moisture in
        the atmosphere. It uses this power
        to freeze its foes.
    black:
      en: |-
        It prevents prey from escaping by
        instantaneously freezing moisture
        in the air.
      fr: |-
        Il empêche ses proies de prendre
        la fuite en gelant instantanément
        l’humidité de l’air.
    white:
      en: |-
        It prevents prey from escaping by
        instantaneously freezing moisture
        in the air.
      fr: |-
        Il empêche ses proies de prendre
        la fuite en gelant instantanément
        l’humidité de l’air.
    black-2:
      en: |-
        It prevents prey from escaping by
        instantaneously freezing moisture
        in the air.
    white-2:
      en: |-
        It prevents prey from escaping by
        instantaneously freezing moisture
        in the air.
    x:
      ja-Hrkt: |-
        くうきちゅうの　すいぶんを　こおらせ
        こおりの　そうこうで　からだを
        つつみこみ　みを　まもっている。
      ja: |-
        空気中の　水分を　凍らせ
        氷の　装甲で　体を　包みこみ
        身を　守っている。
      ko: |-
        공기 중의 수분을 얼려서
        얼음 갑옷으로 몸을
        둘러싸 몸을 보호한다.
      en: |-
        To protect itself, it clad its body in an armor of ice,
        made by freezing moisture in the air.
      fr: |-
        Il gèle l’humidité de l’air pour former une armure
        de glace protectrice autour de son corps.
      de: |-
        Um sich zu schützen, umgibt es seinen Körper
        mit einer Rüstung aus Eis.
      es: |-
        Se protege con una armadura de hielo creada por
        congelación de la humedad del aire.
      it: |-
        Per difendersi, riveste il suo corpo con un’armatura
        di ghiaccio, fatta congelando l’umidità dell’aria.
    'y':
      ja-Hrkt: |-
        くうきちゅうの　すいぶんを
        いっしゅんで　こおらせる　ちからで
        えものを　れいとうして　しまう。
      ja: |-
        空気中の　水分を
        一瞬で　凍らせる　力で
        獲物を　冷凍して　しまう。
      ko: |-
        공기 중의 수분을
        단숨에 얼게 하는 힘으로
        먹이를 냉동시켜 버린다.
      en: |-
        It can instantly freeze moisture in the atmosphere.
        It uses this power to freeze its foes.
      fr: |-
        Il a le pouvoir de geler l’humidité ambiante en un
        instant et peut ainsi pétrifier ses proies.
      de: |-
        Es kann Feuchtigkeit in der Atmosphäre gefrieren.
        Auf diese Weise macht es auch seine Beute haltbar.
      es: |-
        Congela a sus presas enfriando en un momento la
        humedad contenida en el aire que lo rodea.
      it: |-
        Capace di congelare istantaneamente l’umidità
        dell’atmosfera, finisce per surgelare la preda.
    omega-ruby:
      ja-Hrkt: |-
        いわの　からだを　こおりの　よろいで　かためた。
        くうきちゅうの　すいぶんを　こおらせて　じゆうな
        かたちに　かえる　のうりょくを　もつ　ポケモン。
      ja: |-
        岩の　体を　氷の　よろいで　かためた。
        空気中の　水分を　凍らせて　自由な
        形に　変える　能力を　持つ　ポケモン。
      ko: |-
        바위로 된 몸을 얼음 갑옷으로 단단히 했다.
        공기 중의 수분을 얼려서 자유로운
        형태로 바꾸는 능력을 지닌 포켓몬이다.
      en: |-
        Glalie has a body made of rock, which it hardens with an armor
        of ice. This Pokémon has the ability to freeze moisture in the
        atmosphere into any shape it desires.
      fr: |-
        Le corps de Oniglali est fait de rochers qu’il endurcit grâce
        à une couche de glace. Ce Pokémon a le pouvoir de geler
        l’humidité ambiante et de lui donner n’importe quelle forme.
      de: |-
        Firnontor hat einen Körper aus Stein, den es mit einem
        Panzer aus Eis noch verstärkt. Dieses Pokémon kann die
        Luftfeuchtigkeit der Atmosphäre einfrieren und in jegliche
        Form verwandeln.
      es: |-
        Glalie endurece el cuerpo rocoso que tiene con una coraza
        de hielo. Este Pokémon tiene la habilidad de congelar la
        humedad del ambiente y formar la figura que se le antoje.
      it: |-
        Il corpo di Glalie è fatto di pietra rivestita da un’armatura
        di ghiaccio. Questo Pokémon ha la capacità di congelare
        l’umidità nell’atmosfera e darle le forme più svariate.
    alpha-sapphire:
      ja-Hrkt: |-
        こおりを　じざいに　あつかう　ちからを　もつ。
        えものを　いっしゅんで　こおらせて　うごけなく
        なった　ところを　おいしく　いただくのだ。
      ja: |-
        氷を　自在に　扱う　力を　持つ。
        獲物を　一瞬で　凍らせて　動けなく
        なった　ところを　美味しく　頂くのだ。
      ko: |-
        얼음을 자유롭게 사용하는 힘을 지녔다.
        먹이를 한순간에 얼려 움직이지
        못하게 하고 맛있게 먹는다.
      en: |-
        Glalie has the ability to freely control ice. For example, it can
        instantly freeze its prey solid. After immobilizing its prey in ice,
        this Pokémon enjoys eating it in leisurely fashion.
      fr: |-
        Oniglali a le pouvoir de contrôler la glace à volonté.
        Par exemple, il peut geler sa proie sur place.
        Une fois la proie immobilisée, ce Pokémon la mange
        sans se presser.
      de: |-
        Firnontor hat die Fähigkeit, Eis zu kontrollieren. Es kann
        beispielsweise seine Beute augenblicklich einfrieren.
        Nachdem es sie im Eis bewegungsunfähig gemacht hat,
        verspeist es sie genüsslich.
      es: |-
        Glalie tiene la habilidad de controlar el hielo con total libertad.
        Por ejemplo, puede dejar a su presa totalmente congelada en
        un instante. Y, una vez helada, la devora lentamente.
      it: |-
        Glalie ha la capacità di sfruttare il ghiaccio a suo vantaggio.
        Ad esempio riesce a congelare la preda all’istante. Dopo
        averla immobilizzata nel ghiaccio, se la mangia con gusto
        e in tutta calma.
    sun:
      ja-Hrkt: |-
        とうちょう　まぢかに　ゆきやまで
        そうなんした　とざんかの　むねんが
        いわに　とりつき　うまれたと　いう。
      ja: |-
        登頂　間近に　雪山で
        遭難した　登山家の　無念が
        岩に　取りつき　生まれたと　いう。
      ko: |-
        등정을 코앞에 둔 설산에서
        조난당한 등산가의 원통함이
        바위에 씌어서 태어났다고 한다.
      zh-Hant: |-
        據說是在即將登頂時
        在雪山上罹難的登山家心中的
        遺憾附在岩石上而形成的。
      zh-Hans: |-
        据说是即将登顶雪山，
        却罹难的登山家的遗憾，
        附在岩石上诞生而成。
      en: |-
        Legend says a boulder on an icy mountain
        absorbed the distress and regrets of a
        stranded mountaineer, giving rise to Glalie.
      fr: |-
        La légende veut qu’il naisse de la détresse
        et de la rancœur des alpinistes égarés dans
        les cimes enneigées.
      de: |-
        Man sagt, Firnontor sei aus dem Unmut
        verunglückter Bergsteiger geboren, der
        von einem Felsen Besitz ergriff.
      es: |-
        Se cree que estos Pokémon surgen de la
        desazón de los montañeros perdidos en las
        cumbres nevadas.
      it: |-
        Lo sconforto degli scalatori smarritisi a un passo
        dalla vetta ha animato certe rocce di montagna
        e dato vita a questo Pokémon.
    moon:
      ja-Hrkt: |-
        おおきな　くちから　はく　れいきで
        えものは　いっしゅんで　カチコチ。
        そのまま　バリバリ　いただくのだ。
      ja: |-
        大きな　口から　吐く　冷気で
        獲物は　一瞬で　カチコチ。
        そのまま　バリバリ　頂くのだ。
      ko: |-
        커다란 입에서 뿜는 냉기로
        먹이는 한순간에 꽁꽁.
        그대로 아드득아드득 잡아먹는다.
      zh-Hant: |-
        從大大的嘴巴裡噴出寒氣，
        把獵物瞬間凍得硬梆梆的，
        然後大口咬碎享用。
      zh-Hans: |-
        从大大的嘴巴里喷出冷气，
        把猎物瞬间冻得硬邦邦的。
        就这么嘎嘣嘎嘣地享用食物。
      en: |-
        Its prey is instantaneously frozen stiff by the
        cold air it exhales from its huge mouth. While
        they’re in that frozen state, it gobbles them up.
      fr: |-
        Le souffle glacé qui sort de sa large gueule lui
        permet de congeler instantanément ses proies.
        Il les croque ensuite comme des glaçons.
      de: |-
        Mit dem Eiseshauch aus seinem riesigen Mund
        friert es seine Beute augenblicklich ein, um sie
        dann genüsslich zu verspeisen.
      es: |-
        Congela a sus presas instantáneamente con el
        aire frío que expulsa por la boca y acto seguido
        las devora.
      it: |-
        Congela le prede in un istante soffiando
        aria gelida dalla grande bocca e poi
        le sgranocchia ancora ghiacciate.
    ultra-sun:
      ja-Hrkt: |-
        えものを　こおらせ　まるかじり。
        だけど　こうぶつは　バニプッチなどの
        もともと　こおっている　ポケモンだ。
      ja: |-
        獲物を　凍らせ　丸かじり。
        だけど　好物は　バニプッチなどの
        もともと　凍っている　ポケモンだ。
      ko: |-
        먹이를 얼려 통째로 갉아먹는다.
        하지만 바닐프티처럼 처음부터
        얼어 있는 포켓몬을 더 좋아한다.
      zh-Hant: |-
        會把獵物凍住後整個拿來啃，
        但最愛吃的還是迷你冰之類
        原本就已經結凍的寶可夢。
      zh-Hans: |-
        将猎物冻住，整个咬住。
        但喜欢吃的是迷你冰等
        原本就冻着的宝可梦。
      en: |-
        It freezes its prey and chews them whole.
        However, it prefers to eat Pokémon like Vanillite
        that are already frozen.
      fr: |-
        Il gèle ses proies avant de les croquer
        goulûment, même s’il préfère largement les
        Pokémon déjà glacés, comme les Sorbébé.
      de: |-
        Es friert seine Beute ein und verschlingt sie im
        Ganzen. Am liebsten frisst es von vornherein
        gefrorene Pokémon wie Gelatini.
      es: |-
        Congela a sus presas antes de hincarles el
        diente, pero su presa favorita son los Pokémon
        que ya están congelados, como los Vanillite.
      it: |-
        Congela la preda prima di affondarvi i denti.
        Tuttavia, preferisce cibarsi di Pokémon già
        ghiacciati come Vanillite.
    ultra-moon:
      ja-Hrkt: |-
        さほど　かたくない　いわがほんたい。
        くうきちゅうの　すいぶんを　こおらせ
        こおりの　そうこうを　みにまとう。
      ja: |-
        さほど　硬くない　岩が本体。
        空気中の　水分を　凍らせ
        氷の　装甲を　身にまとう。
      ko: |-
        그다지 단단하지 않은 바위가 본체다.
        공기 중의 수분을 얼려
        얼음의 장갑을 몸에 두른다.
      zh-Hant: |-
        本體是不怎麼堅硬的岩石。
        會讓空氣中的水分凍結，
        為自己裹上一層冰之裝甲。
      zh-Hans: |-
        不那么坚硬的岩石是它的本体。
        能够冻住空气中的水分，
        将冰之装甲裹在身上。
      en: |-
        Its actual body is a rock that isn’t particularly
        hard. Glalie absorbs moisture from the air and
        drapes itself in an armor of ice.
      fr: |-
        Il gèle les particules d’eau présentes dans l’air
        pour se couvrir d’une carapace de glace et ainsi
        pallier la fragilité de son corps.
      de: |-
        Dieses Pokémon besteht aus einem nicht allzu
        harten Felsen. Es lässt die Feuchtigkeit in der
        Luft gefrieren und hüllt sich in einen Eispanzer.
      es: |-
        Su cuerpo rocoso no es excesivamente duro.
        Congela la humedad del ambiente para cubrirse
        con una armadura de hielo protectora.
      it: |-
        Poiché il suo corpo è fatto di una pietra non
        particolarmente dura, congela l’umidità intorno
        a lui per rivestirsi di un’armatura di ghiaccio.
    sword:
      ja-Hrkt: |-
        ほのおでも　とけない　こおりの
        からだ。　くうきちゅうの　すいぶんを
        いっしゅんで　こおらせてしまう。
      ja: |-
        炎でも　溶けない　氷の
        体。　空気中の　水分を
        一瞬で　凍らせてしまう。
      ko: |-
        불꽃에도 녹지 않는 얼음으로 된 몸.
        공기 중의 수분을
        순식간에 얼려버린다.
      zh-Hant: |-
        擁有火焰也無法融化的
        冰之軀體。能讓空氣中的
        水分在一瞬間凍結。
      zh-Hans: |-
        拥有火焰也无法融化的
        冰之躯体。能让空气中的
        水分在一瞬间冻结。
      en: |-
        It has a body of ice that won’t melt, even with
        fire. It can instantly freeze moisture in
        the atmosphere.
      fr: |-
        Son corps constitué de glace ne peut pas fondre,
        même s’il est exposé au feu. Il peut geler
        l’humidité contenue dans l’air instantanément.
      de: |-
        Seinen Eiskörper bringt nichts zum Schmelzen,
        auch Feuer nicht. Es kann Feuchtigkeit in der
        Luft sofort in Eis verwandeln.
      es: |-
        Ni siquiera el fuego puede derretir su cuerpo
        de hielo. Es capaz de congelar en un instante
        la humedad del ambiente.
      it: |-
        Neppure il fuoco riesce a sciogliere il suo corpo
        di ghiaccio. Può congelare istantaneamente
        l’umidità dell’atmosfera.
    shield:
      ja-Hrkt: |-
        くうきちゅうの　すいぶんを
        いっしゅんで　こおらせる　ちからで
        えものを　れいとうして　しまう。
      ja: |-
        空気中の　水分を
        一瞬で　凍らせる　力で
        獲物を　冷凍して　しまう。
      ko: |-
        공기 중의 수분을
        단숨에 얼게 하는 힘으로
        먹이를 냉동시켜 버린다.
      zh-Hant: |-
        會用可讓空氣中的水分
        瞬間凍結的力量，
        將獵物冰凍起來。
      zh-Hans: |-
        用令空气中的水分
        瞬间冻结的力量，
        将猎物冰冻起来。
      en: |-
        It can instantly freeze moisture in the
        atmosphere. It uses this power to freeze its foes.
      fr: |-
        Il a le pouvoir de geler l’humidité ambiante
        en un instant et peut ainsi immobiliser ses proies.
      de: |-
        Es kann Feuchtigkeit in der Luft augenblicklich
        zum Gefrieren bringen und nutzt dies, um seine
        Beute zu Eis erstarren zu lassen.
      es: |-
        Congela a sus presas helando en un momento la
        humedad contenida en el aire que lo rodea.
      it: |-
        È capace di ghiacciare istantaneamente
        l’umidità dell’atmosfera. Sfrutta questo
        potere per congelare la preda.
    legends-arceus:
      en: |-
        It covers its body with an armor of ice harder than steel. Uses its
        breath to freeze prey, which it then devours as if they were
        frozen desserts.
