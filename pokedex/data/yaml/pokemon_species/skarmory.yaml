      fr: |-
        Son corps est prisonnier d’une armure
        dure comme l’acier, mais il vole à plus
        de 300 km/h.
    black-2:
      en: |-
        Its heavy-looking iron body is
        actually thin and light, so it can
        fly at speeds over 180 mph.
    white-2:
      en: |-
        Its heavy-looking iron body is
        actually thin and light, so it can
        fly at speeds over 180 mph.
    x:
      ja-Hrkt: |-
        いばらの　なかに　すをつくる。
        トゲで　きずつきながら　そだてられた
        ヒナの　ハネは　かたくなる。
      ja: |-
        いばらの　中に　巣を作る。
        トゲで　傷つきながら　育てられた
        ヒナの　羽は　硬くなる。
      ko: |-
        가시나무 안에 둥지를 만든다.
        가시에 상처를 입어가며 자라난
        새끼들의 날개는 단단해진다.
      en: |-
        After nesting in bramble bushes, the wings of its
        chicks grow hard from scratches by thorns.
      fr: |-
        Comme il fait son nid dans les ronces, ses petits
        s’endurcissent à force d’être sans cesse éraflés.
      de: |-
        Die dornigen Zweige seines Nests bewirken,
        dass die Flügel seiner Jungen fest und hart werden.
      es: |-
        Después de anidar en zarzas, las alas de sus polluelos
        crecen fortalecidas por los rasguños.
      it: |-
        Facendo il nido tra i rovi, le ali dei suoi piccoli si
        rinforzano per i graffi causati dalle spine.
    'y':
      ja-Hrkt: |-
        てつのような　かたい　よろいに
        おおわれている。じそく３００キロの
        スピードで　おおぞらを　とびまわる。
      ja: |-
        鉄のような　硬い　よろいに
        覆われている。時速３００キロの
        スピードで　大空を　飛び回る。
      ko: |-
        철 같은 단단한 갑옷으로
        덮여 있다. 시속 300km의
        스피드로 넓은 하늘을 날아다닌다.
      en: |-
        Despite being clad entirely in iron-hard armor,
        it flies at speeds over 180 mph.
      fr: |-
        Son corps est prisonnier d’une armure dure comme
        l’acier, mais il vole à plus de 300 km/h.
      de: |-
        Es wird komplett von einer eisenharten Rüstung
        geschützt. Wenn es fliegt, erreicht es bis zu 300 km/h.
      es: |-
        Una armadura de hierro cubre por completo su cuerpo.
        Vuela a más de 300 km/h.
      it: |-
        È interamente rivestito da un’armatura dura come
        l’acciaio. Vola alla velocità di 300 km/h.
    omega-ruby:
      ja-Hrkt: |-
        ぜんしんが　かたい　ヨロイに　おおわれている。
        じそく　３００キロの　スピードで　そらを　とび
        かたなの　きれあじを　もつ　ハネで　きりさく。
      ja: |-
        全身が　硬い　ヨロイに　覆われている。
        時速　３００キロの　スピードで　空を　飛び
        刀の　切れ味を　持つ　ハネで　切り裂く。
      ko: |-
        전신이 단단한 갑옷으로 둘러싸여 있다.
        시속 300km의 스피드로 하늘을 날아
        칼날 같은 날카로운 날개로 베어낸다.
      en: |-
        Skarmory is entirely encased in hard, protective armor.
        This Pokémon flies at close to 190 mph. It slashes foes with
        its wings that possess swordlike cutting edges.
      fr: |-
        Airmure est entièrement recouvert d’une armure très dure.
        Ce Pokémon peut voler à plus de 300 km/h. Il peut mettre
        ses ennemis en pièces grâce à ses ailes tranchantes comme
        des sabres.
      de: |-
        Panzaeron ist komplett in einen harten, schützenden Panzer
        eingehüllt. Dieses Pokémon fliegt bis zu 300 km/h schnell.
        Es greift seine Feinde mit seinen messerscharfen Flügeln an.
      es: |-
        Skarmory está totalmente encerrado en el interior de una
        fuerte coraza protectora. En vuelo, puede llegar a alcanzar los
        300 km/h y usa las afiladas alas que tiene para azotar al rival.
      it: |-
        Skarmory è interamente corazzato all’interno di una dura
        armatura di protezione. Vola alla velocità di 300 km/h.
        Lacera il nemico con le sue ali taglienti come la lama
        di una spada.
    alpha-sapphire:
      ja-Hrkt: |-
        たたかいを　くりかえして　ボロボロに　なった
        はがねの　ハネは　１ねんに　１かい　はえかわり
        もとどおりの　きれあじを　とりもどすのだ。
      ja: |-
        戦いを　繰り返して　ボロボロに　なった
        鋼の　ハネは　１年に　１回　生えかわり
        元通りの　切れ味を　取り戻すのだ。
      ko: |-
        싸움을 반복하여 너덜너덜해진
        강철의 날개는 1년에 1회 다시 돋아나
        원래의 날카로움을 되찾는다.
      en: |-
        Skarmory’s steel wings become tattered and bashed in from
        repeated battles. Once a year, the battered wings grow back
        completely, restoring the cutting edges to their pristine state.
      fr: |-
        Les ailes d’acier d’Airmure s’abîment et se cabossent à force
        de se battre. Une fois par an, les ailes endommagées
        repoussent complètement, rendant à leurs bords tranchants
        leur état d’origine.
      de: |-
        Panzaerons Stahlflügel bekommen in den vielen Kämpfen,
        die es austrägt, Risse und Beulen. Einmal im Jahr wachsen
        seine Flügel komplett nach und werden wiederhergestellt.
      es: |-
        A Skarmory se le quedan las alas abolladas y desgarradas
        tras varios combates. Una vez al año, le vuelven a crecer
        completamente con los bordes cortantes que tenían en un
        principio restaurados.
      it: |-
        Le ali d’acciaio di Skarmory portano i segni e le ammaccature
        delle lotte. Una volta l’anno le ali ricrescono completamente,
        ripristinando il filo tagliente delle lame.
    sun:
      ja-Hrkt: |-
        せいちょうのたび　ぬけおちる　ハネは
        うすく　するどい。　むかしの　せんしは
        かたな　として　りようした。
      ja: |-
        成長の度　抜け落ちる　羽は
        薄く　鋭い。　昔の　戦士は
        刀　として　利用した。
      ko: |-
        성장할 때마다 빠지는 날개는
        얇고 날카롭다. 옛 전사들은
        칼로 이용했다.
      zh-Hant: |-
        每次成長都會脫落的羽毛
        又薄又銳利。古時的戰士
        將之當作刀來使用。
      zh-Hans: |-
        每次成长都会脱落的羽毛
        又薄又锐利。过去的战士
        将之当做刀来使用。
      en: |-
        Its feathers, which fall off as it grows, are thin
        and sharp. In times long past, warriors used
        them as swords.
      fr: |-
        Ce Pokémon perd ses plumes fines et acérées
        durant sa croissance. Jadis, les guerriers s’en
        servaient pour fabriquer des lames.
      de: |-
        Die im Zuge seines Wachstums abgefallenen
        Federn sind sehr scharf. Krieger verwendeten
        sie früher als Schwerter.
      es: |-
        Las plumas que se le caen cuando lucha son
        delgadas y afiladas. Guerreros de antaño las
        usaban a modo de espada.
      it: |-
        Le piume che perde nella crescita sono sottili
        e taglienti. In passato, i guerrieri le usavano
        per fabbricare le spade.
    moon:
      ja-Hrkt: |-
        てつの　からだは　がんじょうだが
        さびやすいので　あめの　ひは
        すあなで　じっと　しているよ。
      ja: |-
        鉄の　身体は　頑丈だが
        さびやすいので　雨の　日は
        巣穴で　じっと　しているよ。
      ko: |-
        철로 된 몸은 튼튼하지만
        녹슬기 쉬워서 비가 내리는 날엔
        둥지에서 가만히 있다.
      zh-Hant: |-
        鐵的身體十分結實，
        但很容易生銹，
        所以下雨天會一直留在巢穴哦。
      zh-Hans: |-
        铁的身体十分结实，
        但很容易生锈，
        所以下雨天会一直呆在巢穴哦。
      en: |-
        Its metal body is sturdy, but it does rust rather
        easily. So on rainy days, this Pokémon prefers
        to stay put in its nest.
      fr: |-
        Son plumage d’acier, bien que très résistant,
        est sujet à la rouille. C’est pourquoi ce Pokémon
        préférera rester au nid les jours de pluie.
      de: |-
        Sein stählerner Körper ist robust, aber anfällig
        für Rost. Regnerische Tage verbringt es daher
        geduldig in seinem Nest.
      es: |-
        Su cuerpo metálico es muy robusto, pero se
        oxida con facilidad, por lo que suele quedarse
        descansando en su nido cuando llueve.
      it: |-
        Il suo corpo d’acciaio è molto robusto, ma si
        arrugginisce facilmente, quindi quando piove
        deve starsene rintanato.
    ultra-sun:
      ja-Hrkt: |-
        ぬけおちた　つばさを　かこうして
        つくる　ほうちょうは　いちりゅうの
        りょうりにんも　なっとくのきれあじ。
      ja: |-
        抜け落ちた　翼を　加工して
        作る　包丁は　一流の
        料理人も　納得の切れ味。
      ko: |-
        빠진 날개를 가공해서
        만드는 식칼은 일류 요리사도
        인정할 정도로 날카롭다.
      zh-Hant: |-
        將牠脫落下來的翅膀
        加工製成的菜刀，鋒利程度
        足以讓一流廚師也點頭認可。
      zh-Hans: |-
        用其脱落的翅膀加工制成的菜刀，
        锋利得足以让一流厨师都点头认可。
      en: |-
        The wing feathers it sheds can be processed
        and made into knives whose sharpness is
        recognized by the finest chefs.
      fr: |-
        Les couteaux fabriqués à partir des plumes
        de ce Pokémon sont appréciés des plus grands
        chefs cuisiniers pour leur tranchant acéré.
      de: |-
        Die Federn, die ihm ausfallen, werden zu
        Küchenmessern verarbeitet, mit deren Schärfe
        auch erstklassige Köche zufrieden sind.
      es: |-
        Los cuchillos fabricados con las plumas que se
        le caen son reconocidos entre los cocineros más
        prestigiosos por la gran calidad de sus filos.
      it: |-
        Le piume che perde vengono usate per
        fabbricare coltelli affilatissimi, particolarmente
        apprezzati dai migliori cuochi.
    ultra-moon:
      ja-Hrkt: |-
        はがねの　よろいを　みに　まとう。
        おもそうに　みえるが　さいだい
        ３００キロの　そくどで　とべるぞ。
      ja: |-
        鋼の　鎧を　身に　まとう。
        重そうに　見えるが　最大
        ３００キロの　速度で　飛べるぞ。
      ko: |-
        강철의 갑옷을 몸에 걸친다.
        무거워 보이지만 최고
        300km의 속도로 날 수 있다.
      zh-Hant: |-
        全身披著鋼鐵鎧甲。
        看起來很重，但牠能以
        最高３００公里的時速飛行。
      zh-Hans: |-
        全身披着钢甲。
        虽然看上去很重，但最快能以
        每小时３００公里的速度飞行。
      en: |-
        Its body is draped in steel armor. It looks heavy,
        but it can fly at speeds of up to 185 miles
        an hour!
      fr: |-
        Il peut paraître lourd, avec son armure d’acier,
        mais il est en fait capable de voler à une vitesse
        de 300 km/h.
      de: |-
        Durch seinen stählernen Panzer sieht es zwar
        schwer aus, aber dennoch kann es bis zu
        300 km/h schnell fliegen.
      es: |-
        Su cuerpo está recubierto de una coraza
        metálica que, por pesada que parezca, no le
        impide volar a 300 km/h.
      it: |-
        L’armatura d’acciaio di cui è rivestito lo fa
        sembrare pesante, ma nonostante questa può
        volare a una velocità di 300 km/h.
    sword:
      ja-Hrkt: |-
        するどい　ハネは　つるぎに　まさる
        きれあじ。　ナワバリを　めぐって
        アーマーガアと　はげしく　あらそう。
      ja: |-
        鋭い　羽根は　剣に　勝る　切れ味。
        縄張りを　めぐって
        アーマーガアと　激しく　争う。
      ko: |-
        날카로운 날개는 검보다
        예리하다. 영역을 두고
        아머까오와 격렬하게 싸운다.
      zh-Hant: |-
        尖銳的羽毛比劍還要
        更鋒利。會和鋼鎧鴉
        為了爭地盤而激烈爭鬥。
      zh-Hans: |-
        锐利的羽毛比剑还要锋利。
        与钢铠鸦为领地
        展开激烈的争斗。
      en: |-
        The pointed feathers of these Pokémon are
        sharper than swords. Skarmory and Corviknight
        fight viciously over territory.
      fr: |-
        Ses plumes sont plus tranchantes que des lames.
        Il se dispute violemment son territoire avec
        les Corvaillus.
      de: |-
        Seine spitzen Federn sind schärfer als jedes
        Schwert. Es liefert sich erbitterte Revierkämpfe
        mit Krarmor.
      es: |-
        Sus afiladas plumas son más cortantes que el filo
        de una espada. Tiene disputas territoriales muy
        agresivas con Corviknight.
      it: |-
        Le sue piume affilate sono più taglienti di una
        spada. Ha violenti scontri con Corviknight per
        il controllo del territorio.
    shield:
      ja-Hrkt: |-
        ぬけおちた　ハネから　つるぎが
        つくられることから　もんしょうの
        ずあんとして　にんきが　たかい。
      ja: |-
        抜け落ちた　羽根から　剣が
        作られることから　紋章の
        図案として　人気が　高い。
      ko: |-
        빠진 깃털로 검을
        만들 수 있어서 문장
        도안으로 인기가 많다.
      zh-Hant: |-
        由於牠脫落下來的羽毛
        能夠製成劍，因此作為
        家徽的圖案也很有人氣。
      zh-Hans: |-
        由于它身上掉落下来的羽毛
        可以用来制剑，因此作为纹章
        的图案也很有人气。
      en: |-
        People fashion swords from Skarmory’s shed
        feathers, so this Pokémon is a popular element
        in heraldic designs.
      fr: |-
        Ce Pokémon orne souvent les blasons,
        car les plumes qu’il perd sont utilisées
        pour forger des épées.
      de: |-
        Es wird gern als Vorlage für Wappenmotive
        genutzt, da aus den Federn, die ihm ausfallen,
        Schwerter hergestellt werden.
      es: |-
        Aparece a menudo en escudos heráldicos, pues
        se pueden forjar espadas a partir de las plumas
        que pierde.
      it: |-
        Le piume perse da Skarmory sono utilizzate per
        produrre spade. Per questo è molto apprezzato
        come motivo degli stemmi nobiliari.
