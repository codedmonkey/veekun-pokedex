    x:
      ja-Hrkt: |-
        テレパシーで　きもちを　かよわせる。
        ひかりを　くっせつさせる　うもうで
        からだを　つつみ　すがたを　けす。
      ja: |-
        テレパシーで　気持ちを　通わせる。
        光を　屈折させる　羽毛で
        体を　包み　姿を　消す。
      ko: |-
        텔레파시로 마음이 통한다.
        빛을 굴절시키는 깃털로
        몸을 둘러싸 모습을 지운다.
      en: |-
        It communicates using telepathy. Its body is
        covered in down that refracts light to make
        it invisible.
      fr: |-
        Il est doué d’empathie. Le duvet qui recouvre son
        corps réfléchit la lumière et le rend invisible.
      de: |-
        Es kommuniziert durch Telepathie. Sein Daunenkleid
        bricht das Licht, sodass es unsichtbar wird.
      es: |-
        Se comunica por telepatía. Su plumaje refleja la luz, lo
        que le permite hacerse invisible.
      it: |-
        Sa comunicare telepaticamente. Le piume sul suo
        corpo riflettono la luce e lo rendono invisibile.
    'y':
      ja-Hrkt: |-
        テレパシーで　にんげんと　きもちを
        かよわせる。ひかりを　くっせつさせる
        うもうで　べつの　すがたに　かわる。
      ja: |-
        テレパシーで　人間と　気持ちを
        通わせる。光を　屈折させる
        羽毛で　別の　姿に　変わる。
      ko: |-
        텔레파시로 인간과 마음을
        교감한다. 빛을 굴절시키는
        깃털로 다른 모습으로 변신한다.
      en: |-
        It can telepathically communicate with people. It
        changes its appearance using its down that
        refracts light.
      fr: |-
        Latias peut communiquer avec les gens par télépathie.
        Il change son apparence en renvoyant la lumière.
      de: |-
        Mittels Telepathie kann es mit Menschen
        kommunizieren. Mit seinen Daunen, die das Licht
        brechen, kann es sein Aussehen verändern.
      es: |-
        Se comunica por telepatía con la gente. Cambia de
        aspecto refractando luz con el plumaje.
      it: |-
        Sa comunicare telepaticamente con gli umani. Si serve
        della luce riflessa dal piumaggio per cambiare aspetto.
    omega-ruby:
      ja-Hrkt: |-
        にんげんの　こころを　びんかんに　かんじとる。
        てきいを　キャッチすると　ぜんしんの　はねを
        さかだてて　はげしく　なきごえで　いかくする。
      ja: |-
        人間の　心を　敏感に　感じとる。
        敵意を　キャッチすると　全身の　羽を
        逆立てて　激しく　鳴き声で　威嚇する。
      ko: |-
        인간의 마음을 민감히 감지해낸다.
        적의를 느끼면 전신의 깃털을
        곤두세우고 격렬한 울음소리로 위협한다.
      en: |-
        Latias is highly sensitive to the emotions of people. If it senses
        any hostility, this Pokémon ruffles the feathers all over its body
        and cries shrilly to intimidate the foe.
      fr: |-
        Latias est extrêmement sensible aux émotions des gens.
        S’il ressent une hostilité, ce Pokémon ébouriffe ses plumes
        et pousse un cri strident pour intimider son ennemi.
      de: |-
        Latias ist in höchstem Maße empfindlich gegenüber den
        Emotionen der Menschen. Wenn es einen Anflug von
        Feindseligkeit wahrnimmt, werden seine Federn zerzaust
        und es stößt schrille Schreie aus, um seinen Gegner
        einzuschüchtern.
      es: |-
        Latias es muy sensible a los sentimientos de la gente. Si
        detecta algún ápice de hostilidad, desplegará las plumas que
        tiene por todo el cuerpo y se pondrá a chillar para intimidar al
        enemigo.
      it: |-
        Latias è sensibilissimo alle emozioni delle persone.
        Se percepisce una certa ostilità, questo Pokémon arruffa
        le piume su tutto il corpo ed emette un grido lancinante
        per intimidire il nemico.
    alpha-sapphire:
      ja-Hrkt: |-
        ちのうが　たかく　ひとの　ことばを　りかいする。
        ガラスの　ような　うもうで　からだを　つつみこみ
        ひかりを　くっせつさせて　すがたを　かえる。
      ja: |-
        知能が　高く　人の　言葉を　理解する。
        ガラスの　ような　羽毛で　体を　包み込み
        光を　屈折させて　姿を　変える。
      ko: |-
        지능이 높아 사람의 말을 이해한다.
        몸을 감싼 유리 같은 깃털로
        빛을 굴절시켜 모습을 바꾼다.
      en: |-
        Latias is highly intelligent and capable of understanding
        human speech. It is covered with a glass-like down.
        The Pokémon enfolds its body with its down and refracts
        light to alter its appearance.
      fr: |-
        Latias est très intelligent et comprend le langage des hommes.
        Il est recouvert d’une espèce de duvet ressemblant à du verre.
        Ce Pokémon s’enveloppe dans ce duvet et reflète la lumière
        pour changer son apparence.
      de: |-
        Latias ist sehr intelligent und kann die menschliche
        Sprache verstehen. Es ist mit gläsernen Daunen bedeckt.
        Dieses Pokémon umhüllt seinen Körper mit den Daunen
        und kann Licht brechen, um seine Gestalt zu verändern.
      es: |-
        Latias tiene un nivel de inteligencia tan alto que es capaz de
        entender el lenguaje humano. Este Pokémon usa el plumón
        cristalizado del que está cubierto como peto para refractar la
        luz y cambiar de aspecto.
      it: |-
        Estremamente intelligente, Latias è in grado di capire
        il linguaggio umano. Il suo corpo è ricoperto di piumino
        vetroso che usa per rifrangere la luce e mutare il proprio
        aspetto.
