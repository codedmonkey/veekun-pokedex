lunala:
  base_happiness: 0
  capture_rate: 45
  color: purple
  egg_groups:
    - no-eggs
  evolution_chain: cosmog
  evolves_from: cosmoem
  flavor_text:
    sun:
      ja-Hrkt: |-
        コスモッグが　しんかした　♀だと
        いわれる。　だい３の　めが　うかぶとき
        べつせかいへと　とびさっていく。
      ja: |-
        コスモッグが　進化した　♀だと
        いわれる。　第３の　眼が　浮かぶとき
        別世界へと　飛び去っていく。
      ko: |-
        코스모그가 진화한 암컷이라고
        전해진다. 제3의 눈이 떠오를 때
        다른 세계로 날아간다.
      zh-Hant: |-
        據說是科斯莫古進化後的♀。
        當第３隻眼浮現時，
        就會飛去另一個世界。
      zh-Hans: |-
        据说是科斯莫古进化后的♀。
        当第３只眼浮现时，
        就会飞去其他世界。
      en: |-
        It is said to be a female evolution of Cosmog.
        When its third eye activates, away it flies to
        another world.
      fr: |-
        On suppose que c’est l’évolution de Cosmog
        lorsqu’il s’agit d’une femelle. Son troisième œil
        apparaît quand il s’envole vers un autre monde.
      de: |-
        Es heißt, es sei die weibliche Endstufe der
        Entwicklungsreihe von Cosmog. Ist sein drittes
        Auge aktiviert, zieht es in eine andere Welt.
      es: |-
        Se dice que es la evolución final hembra de
        Cosmog. Su tercer ojo aparece cuando se
        traslada a un mundo distinto.
      it: |-
        Si dice che sia l’evoluzione femminile di Cosmog.
        Quando il suo terzo occhio si manifesta, significa
        che sta volando verso un altro mondo.
    moon:
      ja-Hrkt: |-
        べつせかいに　すむと　いわれる。
        ひかりを　くらいつづけ　まひるも
        やみよの　ように　かげらせる。
      ja: |-
        別世界に　棲むと　いわれる。
        光を　喰らい続け　真昼も
        闇夜の　ように　翳らせる。
      ko: |-
        다른 세계에 산다고 전해진다.
        빛을 계속 먹어치워 한낮에도
        깜깜한 밤처럼 어둡게 만든다.
      zh-Hant: |-
        據說是棲息在其他世界。
        不斷吞食光線，
        令白晝也昏暗得好像午夜一樣。
      zh-Hans: |-
        据说是栖息在其他世界的。
        不断吞食光线，
        会令白昼也昏暗得好像午夜一般。
      en: |-
        Said to live in another world, this Pokémon
        devours light, drawing the moonless dark veil of
        night over the brightness of day.
      fr: |-
        Cet être mystérieux viendrait d’un autre
        monde. Il absorbe continuellement la lumière,
        transformant le jour en nuit noire.
      de: |-
        Man sagt, es komme aus einer anderen Welt.
        Es verschlingt unaufhörlich Licht und sorgt
        so auch am helllichten Tag für Dunkelheit.
      es: |-
        Se dice que vive en otro mundo. Devora la luz
        con tamaña fruición que es capaz de provocar
        la penumbra más absoluta en pleno día.
      it: |-
        Si dice che viva in un altro mondo.
        Assorbe la luce facendo calare le tenebre anche
        sulle giornate più luminose.
    ultra-sun:
      ja-Hrkt: |-
        はるか　おおむかしの　ぶんけんに
        つきを　さそいし　けものと　いう
        なまえで　きろくが　のこっている。
      ja: |-
        遥か　大昔の　文献に
        月を　誘いし　獣と　いう
        名前で　記録が　残っている。
      ko: |-
        먼 옛날 문헌에
        달을 현혹하는 짐승이라는
        이름으로 기록되어 있다.
      zh-Hant: |-
        在遙遠過去的文獻裡，
        牠被人們以邀引月亮之獸
        的名字記錄了下來。
      zh-Hans: |-
        在遥远过去的文献里，
        以邀引月亮之兽为名留下了记录。
      en: |-
        Records of it exist in writings from long, long
        ago, where it was known by the name
        “the beast that calls the moon.”
      fr: |-
        Des documents extrêmement anciens
        le décrivent comme « celui qui invite la lune ».
      de: |-
        In Schriftstücken aus längst vergangenen
        Zeiten wird es als „Mondbringer“ bezeichnet.
      es: |-
        Aparece en obras de la literatura antigua en las
        que se refieren a él como la “criatura que invoca
        a la luna”.
      it: |-
        In antichissimi documenti si parla di lui come
        della “creatura che evoca la luna”.
    ultra-moon:
      ja-Hrkt: |-
        いせかいに　つうじる　あな　から
        みちの　ちからや　せいめいを　この
        せかいに　よびよせることも　ある。
      ja: |-
        異世界に　通じる　穴　から
        未知の　力や　生命を　この
        世界に　呼び寄せることも　ある。
      ko: |-
        다른 세계로 통하는 구멍을 통해
        미지의 힘이나 생명을
        이 세계로 불러들이는 경우도 있다.
      zh-Hant: |-
        有時會從通往異世界的
        洞穴裡把未知的力量和生命
        召喚到這個世界來。
      zh-Hans: |-
        有时候会从通往异世界的
        洞穴里把未知的力量和生命
        召唤到这个世界来。
      en: |-
        It sometimes summons unknown powers and
        life-forms here to this world from holes that
        lead to other worlds.
      fr: |-
        Il lui arrive d’invoquer dans ce monde
        des créatures et des puissances inconnues
        via une brèche menant à d’autres dimensions.
      de: |-
        Öffnet es eine Ultrapforte, ebnet es mitunter
        für fremde Kräfte und Lebewesen den Weg in
        unsere Welt.
      es: |-
        A veces, las fisuras interdimensionales que crea
        sirven de pasaje para fuerzas y formas de vida
        desconocidas.
      it: |-
        A volte gli Ultravarchi che apre servono da
        passaggio verso il nostro mondo per forze
        e forme di vita sconosciute.
    sword:
      ja-Hrkt: |-
        つきを　さそいし　けもの　という
        なまえを　もつ。　あらゆる　ひかりを
        エネルギーに　かえて　いきている。
      ja: |-
        月を　誘いし　獣　という
        名前を　もつ。　あらゆる　光を
        エネルギーに　変えて　生きている。
      ko: |-
        달을 현혹하는 짐승이라는
        이름을 가졌다. 모든 빛을
        에너지로 변환해서 살고 있다.
      zh-Hant: |-
        被稱為邀引月亮之獸。
        透過將一切的光轉化為
        能量來維持生命。
      zh-Hans: |-
        被称为邀引月亮之兽。
        通过将一切的光转化为
        能量来维持生命。
      en: |-
        Known as the Beast That Calls the Moon, this
        Pokémon lives by taking in any and all light and
        converting it into its own energy.
      fr: |-
        Il a pour surnom « celui qui invite la lune ».
        Il vit en transformant toutes sortes de lumière
        en énergie.
      de: |-
        Ihm wurde der Name „Mondbringer“ verliehen.
        Solange es lebt, wandelt es jedes Licht in
        Energie um.
      es: |-
        Lo llaman la Criatura que Invoca a la Luna.
        Convierte cualquier forma de luz en energía
        para sustentarse.
      it: |-
        Viene chiamato “la creatura che evoca la luna”.
        Converte qualsiasi tipo di luce in energia
        per sostentarsi.
    shield:
      ja-Hrkt: |-
        しゅういの　ひかりを　すべて　うばい
        みずからは　まんげつの　すがたとなり
        やみよに　ひかりを　はなつ。
      ja: |-
        周囲から　光を　すべて　奪い
        自らは　満月の　姿となり
        闇夜に　光を　放つ。
      ko: |-
        주위의 빛을 모두 빼앗아
        자신 스스로 만월의 모습이 되어
        밤하늘에 빛을 발산한다.
      zh-Hant: |-
        奪走四周所有的光，
        自己則變身為滿月的模樣，
        在黑夜中散發出光芒。
      zh-Hans: |-
        夺走四周所有的光，
        自己则变身为满月的模样，
        在黑夜中散发出光芒。
      en: |-
        It steals the light from its surroundings and then
        becomes the full moon, showering its own light
        across the night sky.
      fr: |-
        Il capture toute la lumière qui l’entoure pour
        prendre la forme de la pleine lune et éclairer
        les ténèbres nocturnes.
      de: |-
        Es raubt seiner Umgebung all ihr Licht und nimmt
        die Gestalt des Vollmondes an. So leuchtet es in
        der Dunkelheit der Nacht.
      es: |-
        Devora toda la luz que haya a su alrededor y
        adopta la forma de una luna llena que ilumina la
        oscura noche.
      it: |-
        Assorbe tutta la luce che lo circonda
        per assumere la forma di una splendente
        luna piena che illumina l’oscurità notturna.
