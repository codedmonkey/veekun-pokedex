        l’Océan Pacifique.
    black-2:
      en: |-
        With its extremely tough muscles,
        it can keep swimming in the Pacific
        Ocean without resting.
    white-2:
      en: |-
        With its extremely tough muscles,
        it can keep swimming in the Pacific
        Ocean without resting.
    x:
      ja-Hrkt: |-
        きょうじんな　きんにくを　もつ。
        たいへいようを　やすむことなく
        およぎつづけることが　できるのだ。
      ja: |-
        強靭な　筋肉を　持つ。
        太平洋を　休むことなく
        泳ぎ続けることが　できるのだ。
      ko: |-
        강인한 근육을 가지고 있다.
        태평양을 쉬지 않고
        계속 헤엄칠 수 있다.
      en: |-
        With its extremely tough muscles, it can keep
        swimming in the Pacific Ocean without resting.
      fr: |-
        Il possède de sacrés biscoteaux. Il peut parcourir
        sans relâche l’océan Pacifique.
      de: |-
        Es hat extrem starke Muskeln und kann durch den
        Ozean schwimmen, ohne sich ausruhen zu müssen.
      es: |-
        Tiene músculos muy desarrollados. Es capaz de nadar
        en el océano sin descanso.
      it: |-
        Ha dei muscoli tanto sviluppati da riuscire ad
        attraversare a nuoto interi oceani senza fermarsi.
    'y':
      ja-Hrkt: |-
        クロールや　バタフライが　とくいで
        オリンピックの　せんしゅでも
        ぐんぐんと　おいぬいていく。
      ja: |-
        クロールや　バタフライが　得意で
        オリンピックの　選手でも
        ぐんぐんと　追い抜いていく。
      ko: |-
        자유형이나 접영을 잘하여
        올림픽 선수도 제치고
        쑥쑥 앞질러 나아간다.
      en: |-
        A swimmer adept at both the front crawl and
        breaststroke. Easily overtakes the best
        human swimmers.
      fr: |-
        Excellent nageur, il pratique le crawl ou la nage
        papillon mieux qu’un champion olympique.
      de: |-
        Dieses Pokémon ist ein meisterhafter Schwimmer.
        Seine Techniken schlagen selbst Olympiasieger.
      es: |-
        Experto nadador tanto a braza como a crol. Gana
        fácilmente a los nadadores profesionales.
      it: |-
        Esperto nuotatore di rana, crawl e altri stili, supera
        facilmente i migliori nuotatori umani.
    omega-ruby:
      ja-Hrkt: |-
        はったつした　きょうじんな　きんにくは　どんなに
        うんどうしても　つかれる　ことは　ない。
        たいへいようも　かるく　おうだん　できるほどだ。
      ja: |-
        発達した　強靭な　筋肉は　どんなに
        運動しても　疲れる　ことは　ない。
        太平洋も　軽く　横断　できるほどだ。
      ko: |-
        강인하게 발달한 근육은 아무리
        운동해도 지치는 일이 없다.
        태평양도 가볍게 횡단할 수 있을 정도다.
      en: |-
        Poliwrath’s highly developed, brawny muscles never grow
        fatigued, however much it exercises. It is so tirelessly strong,
        this Pokémon can swim back and forth across the ocean
        without effort.
      fr: |-
        Les muscles solides et surdéveloppés de Tartard ne se
        fatiguent jamais, quels que soient les efforts qu’il produit.
        Ce Pokémon est tellement endurant qu’il peut traverser
        un océan à la nage avec une étonnante facilité.
      de: |-
        Quappo besitzt hochentwickelte, starke Muskeln, die niemals
        ermüden, egal, wie sehr es sie auch beansprucht. Es ist so
        kräftig, dass es mühelos große Ozeane durchschwimmen kann.
      es: |-
        Poliwrath tiene unos músculos fornidos y muy desarrollados,
        por lo que nunca se agota. Es tan fuerte e incansable que
        cruzar el océano a nado no le supone ningún esfuerzo.
      it: |-
        Poliwrath è dotato di muscoli molto sviluppati e robusti.
        Per quanto si alleni, non si stanca mai.
        Questo Pokémon è così infaticabile e forte che riesce
        ad attraversare a nuoto interi oceani.
    alpha-sapphire:
      ja-Hrkt: |-
        はったつした　きょうじんな　きんにくは　どんなに
