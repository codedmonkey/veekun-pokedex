        Per quanto si alleni, non si stanca mai.
        Questo Pokémon è così infaticabile e forte che riesce
        ad attraversare a nuoto interi oceani.
    sun:
      ja-Hrkt: |-
        アローラの　ニョロボンは　ひらおよぎが
        とくい。　ニョロボンの　マネで
        およぎを　まなぶ　こどもも　おおい。
      ja: |-
        アローラの　ニョロボンは　平泳ぎが
        得意。　ニョロボンの　マネで
        泳ぎを　学ぶ　子どもも　多い。
      ko: |-
        알로라의 강챙이는 평영을
        잘한다. 강챙이 흉내로
        헤엄을 배우는 아이들도 많다.
      zh-Hant: |-
        阿羅拉的蚊香泳士擅長蛙泳。
        模仿蚊香泳士學習游泳的孩子也有很多。
      zh-Hans: |-
        阿罗拉的蚊香泳士擅长蛙泳。
        模仿蚊香泳士学习游泳的孩子也很多。
      en: |-
        Poliwrath in the Alola region are strong
        swimmers that use the breaststroke. Many
        children learn to swim by imitating Poliwrath.
      fr: |-
        Les Tartard d’Alola nagent la brasse avec
        habileté. Beaucoup d’enfants apprennent à
        nager en les imitant.
      de: |-
        Quappo, die aus Alola stammen, sind besonders
        gut im Brustschwimmen. Viele Kinder lernen
        Schwimmen, indem sie Quappo nachahmen.
      es: |-
        A los Poliwrath de Alola se les da de maravilla
        nadar a braza. Muchos niños imitan a este
        Pokémon para aprender a nadar.
      it: |-
        I Poliwrath di Alola sono specialisti del nuoto
        a rana. Molti bambini imparano a nuotare
        imitandoli.
    moon:
      ja-Hrkt: |-
        たいしぼうりつは　だいたい０％。
        ぜんしん　きんにくで　おもいので
        およぐ　ちからが　はったつした。
      ja: |-
        体脂肪率は　大体０％。
        全身が　筋肉で　重いので
        泳ぐ　力が　発達した。
      ko: |-
        체지방률은 거의 0%
        전신이 근육인 관계로 무거워서
        헤엄치는 힘이 발달했다.
      zh-Hant: |-
        體脂肪率基本是０％。
        因全身都是肌肉而且很重，
        所以游泳能力很發達。
      zh-Hans: |-
        体脂率基本是０％。
        因全身都是肌肉且很重，
        所以游泳能力很发达。
      en: |-
        Its percentage of body fat is nearly zero. Its
        body is entirely muscle, which makes it heavy
        and forces its swimming prowess to develop.
      fr: |-
        Il a un indice de masse grasse proche de zéro.
        Comme il est plein de muscles, il est très lourd
        et a dû apprendre à nager pour se déplacer.
      de: |-
        Sein Körperfettanteil geht gegen null. Es ist sehr
        schwer, besteht aber fast nur aus Muskeln. So
        konnte es seine Schwimmfähigkeiten ausbauen.
      es: |-
        Tiene prácticamente un 0% de grasa corporal.
        Es un excelente nadador debido a la fuerza que
        posee, ya que su cuerpo es todo músculo.
      it: |-
        Ha una percentuale di grasso corporeo pari a
        zero ed è tutto muscoli. Ha sviluppato una
        grande forza per potersi spostare nuotando.
    ultra-sun:
      ja-Hrkt: |-
        みずポケモンの　なかでも　かなり
        およぎは　たっしゃな　ぶるい　なのに
        ふだんは　りくで　すごしている。
      ja: |-
        みずポケモンの　中でも　かなり
        泳ぎは　達者な　部類　なのに
        普段は　陸で　過ごしている。
      ko: |-
        물포켓몬 중에서도 수영 실력이
        매우 뛰어난 부류인데도
        평상시에는 지상에서 지낸다.
      zh-Hant: |-
        在水屬性寶可夢中是屬於
        游泳健將那一類型，
        但平時卻生活在陸地上。
      zh-Hans: |-
        虽然在水宝可梦中是属于
        游泳健将那一类的，
        但平时却生活在陆地上。
      en: |-
        It’s quite a gifted swimmer, even among
        Water-type Pokémon, but it normally spends its
        time on land.
      fr: |-
        Bien qu’il fasse partie des Pokémon de type Eau
        les plus doués pour la nage, il reste en général
        sur la terre ferme.
      de: |-
        Selbst unter den Wasser-Pokémon gilt es als
        hervorragender Schwimmer. Dennoch hält es
        sich vorwiegend an Land auf.
      es: |-
        Pese a ser uno de los mejores nadadores entre
        los Pokémon acuáticos, pasa la mayor parte del
        tiempo en tierra firme.
      it: |-
        È un nuotatore particolarmente abile anche
        rispetto ad altri Pokémon che vivono in acqua,
        ma di solito vive sulla terraferma.
    ultra-moon:
      ja-Hrkt: |-
        およぎで　きたえた　きんにくは
        ふとく　たくましい。　せいけんづきで
        おおきな　いわも　こなごなに　する。
      ja: |-
        泳ぎで　鍛えた　筋肉は
        太く　たくましい。　正拳突きで
        大きな　岩も　粉々に　する。
      ko: |-
        수영으로 단련한 근육은
        두텁고 강하다. 정권 지르기로
        큰 바위도 가루로 만들어 버린다.
      zh-Hant: |-
        靠著游泳鍛鍊出的肌肉
        非常粗壯結實。牠使出的
        正拳就連巨大的岩石也能擊碎。
      zh-Hans: |-
        通过游泳锻炼出来的肌肉结实又健硕。
        正面直拳连巨大的岩石都能击碎。
      en: |-
        The muscles it has developed through swimming
        are thick and powerful. When it lands a square
        punch, it can turn huge boulders to dust.
      fr: |-
        Son impressionnante musculature a été sculptée
        par sa nage vigoureuse. Un direct du droit lui
        suffit à réduire un gros rocher en miettes.
      de: |-
        Dank seines Schwimmtrainings ist es ein wahres
        Muskelpaket. Ein Faustschlag reicht ihm aus, um
        selbst riesige Felsen zu zertrümmern.
      es: |-
        Horas de nado han cincelado una musculatura
        impresionante, hasta el punto de ser capaz de
        pulverizar rocas de un puñetazo.
      it: |-
        È dotato di muscoli vigorosi, sviluppatisi
        grazie al nuoto. Con un pugno può mandare
        in frantumi anche un grosso masso.
    lets-go-pikachu:
      ja-Hrkt: |-
        ぜんしんの　きんにくを　つかった
        パワフルな　およぎで　せかいレベルの
        せんしゅも　おいぬいていく。
      ja: |-
        全身の　筋肉を　使った
        パワフルな　泳ぎで　世界レベルの
        選手も　追い抜いていく。
      ko: |-
        전신의 근육을 사용한
        파워풀한 헤엄으로 세계 레벨급
        선수도 앞질러 간다.
      zh-Hant: |-
        會用全身上下強而有力的肌肉
        來游泳，就算對手是世界級的
        游泳選手也能輕鬆超越。
      zh-Hans: |-
        他会用全身的肌肉
        奋力游泳，连世界级的
        选手都甘拜下风。
      en: |-
        Swims powerfully using all the muscles in its
        body. It can even overtake world-class swimmers.
      fr: |-
        Son corps très musclé lui permet de nager plus
        rapidement qu’un champion de natation.
      de: |-
        Seine beherzte Schwimmtechnik erfordert
        vollen Körpereinsatz und ermöglicht es ihm,
        selbst Weltmeister zu schlagen.
      es: |-
        La fuerza que le confiere toda la musculatura
        del cuerpo le permite nadar con tal impulso que
        puede rebasar hasta a nadadores profesionales.
      it: |-
        Nuota velocissimo usando tutti i muscoli.
        Riesce persino a battere atleti di caratura
        mondiale.
    lets-go-eevee:
      ja-Hrkt: |-
        ぜんしんの　きんにくを　つかった
        パワフルな　およぎで　せかいレベルの
        せんしゅも　おいぬいていく。
      ja: |-
        全身の　筋肉を　使った
        パワフルな　泳ぎで　世界レベルの
        選手も　追い抜いていく。
      ko: |-
        전신의 근육을 사용한
        파워풀한 헤엄으로 세계 레벨급
        선수도 앞질러 간다.
      zh-Hant: |-
        會用全身上下強而有力的肌肉
        來游泳，就算對手是世界級的
        游泳選手也能輕鬆超越。
      zh-Hans: |-
        他会用全身的肌肉
        奋力游泳，连世界级的
        选手都甘拜下风。
      en: |-
        Swims powerfully using all the muscles in its
        body. It can even overtake world-class swimmers.
      fr: |-
        Son corps très musclé lui permet de nager plus
        rapidement qu’un champion de natation.
      de: |-
        Seine beherzte Schwimmtechnik erfordert
        vollen Körpereinsatz und ermöglicht es ihm,
        selbst Weltmeister zu schlagen.
      es: |-
        La fuerza que le confiere toda la musculatura
        del cuerpo le permite nadar con tal impulso que
        puede rebasar hasta a nadadores profesionales.
      it: |-
        Nuota velocissimo usando tutti i muscoli.
        Riesce persino a battere atleti di caratura
        mondiale.
    sword:
      ja-Hrkt: |-
        ぜんしんが　きんにくの　かたまり。
        さむい　うみでも　たくましい　うでで
        りゅうひょうを　くだき　つきすすむ。
      ja: |-
        全身が　筋肉の　塊。
        寒い　海でも　たくましい　腕で
        流氷を　砕き　突き進む。
      ko: |-
        전신이 근육 덩어리다.
        추운 바다에서도 늠름한 팔로
        유빙을 부수며 힘차게 나아간다.
      zh-Hant: |-
        全身都是肌肉。即使是在
        寒冷的大海也能用結實的手臂
        擊碎浮冰，奮勇前進。
      zh-Hans: |-
        全身都是肌肉。即使是在
        寒冷的大海中也能用健壮的
        手臂击碎浮冰，奋勇前进。
      en: |-
        Its body is solid muscle. When swimming through
        cold seas, Poliwrath uses its impressive arms to
        smash through drift ice and plow forward.
      fr: |-
        Cette véritable montagne de muscles peut
        se frayer un chemin même dans les eaux glaciales
        en éclatant la banquise avec ses bras robustes.
      de: |-
        Sein ganzer Körper besteht fast nur aus Muskeln.
        In kalten Meeren zerschlägt es mit seinen starken
        Armen Treibeis, um voranzukommen.
      es: |-
        Su cuerpo es puro músculo. Logra abrirse paso
        por aguas gélidas partiendo el hielo con sus
        fornidos brazos.
      it: |-
        Il suo corpo è un ammasso di muscoli. Nuota
        anche nei mari più freddi frantumando il ghiaccio
        fluttuante con le braccia vigorose per farsi strada.
    shield:
      ja-Hrkt: |-
        およぎ　だけでなく　かくとうぎも
        とくい。　きたえあげた　うでから
        ごうかいな　パンチを　くりだす。
      ja: |-
        泳ぎ　だけでなく　格闘技も　得意。
        鍛えあげた　腕から
        豪快な　パンチを　繰りだす。
      ko: |-
        헤엄뿐만 아니라 격투기도
        특기다. 단련한 팔로
        호쾌하게 펀치를 날린다.
      zh-Hant: |-
        除了游泳之外，也擅長使用
        格鬥技。完美鍛鍊的手臂
        可以使出豪邁的拳擊。
      zh-Hans: |-
        除了游泳还擅长格斗技。
        能用经过锻炼的手臂
        使出豪迈强力的拳击。
      en: |-
        Poliwrath is skilled at both swimming and martial
        arts. It uses its well-trained arms to dish out
        powerful punches.
      fr: |-
        Aussi habile à la nage qu’au combat, il peut
        donner de vigoureux coups de poing avec
        ses bras musclés.
      de: |-
        Es ist sowohl ein begnadeter Schwimmer als auch
        Kampfsportler. Mit seinen durchtrainierten Armen
        teilt es kräftige Schläge aus.
      es: |-
        No solo es un experto nadador, sino que también
        domina las artes marciales. Propina enérgicos
        puñetazos gracias a sus musculosos brazos.
      it: |-
