orbeetle:
  base_happiness: 50
  capture_rate: 45
  color: red
  egg_groups:
    - bug
  evolution_chain: blipbug
  evolves_from: dottler
  flavor_text:
    sword:
      ja-Hrkt: |-
        かしこい　ポケモンとして　ゆうめい。
        おおきな　のうみそは　きょうりょくな
        サイコパワーを　もつ　あかし。
      ja: |-
        賢い　ポケモンとして　有名。
        大きな　脳みそは　強力な
        サイコパワーを　もつ　証し。
      ko: |-
        똑똑한 포켓몬으로 유명하다.
        커다란 두뇌는 강력한
        사이코 파워를 가졌다는 증거다.
      zh-Hant: |-
        以頭腦聰慧而聞名。
        大大的腦子是牠擁有
        出眾精神力量的證明。
      zh-Hans: |-
        以头脑聪慧而闻名。
        大大的脑子是它拥有
        出众精神力量的证明。
      en: |-
        It’s famous for its high level of intelligence, and
        the large size of its brain is proof that it also
        possesses immense psychic power.
      fr: |-
        Il est renommé pour son intelligence.
        Son gros cerveau est un indicateur de la puissance
        de ses pouvoirs psychiques.
      de: |-
        Es ist allseits als sehr schlaues Pokémon bekannt.
        Sein großes Gehirn ist ein Indiz dafür, dass es
        über mächtige Psycho-Kräfte verfügt.
      es: |-
        Este Pokémon es conocido por su inteligencia.
        El gran tamaño de su cerebro es un indicio de
        la magnitud de sus poderes psíquicos.
      it: |-
        Questo Pokémon è famoso per la sua
        intelligenza. Il cervello molto sviluppato è
        una spia dei suoi fenomenali poteri psichici.
    shield:
      ja-Hrkt: |-
        サイコパワーを　はなち　しゅういを
        しらべている。　かんそくはんいは
        しゅうい　１０キロにも　たっするぞ。
      ja: |-
        サイコパワーを　放ち　周囲を
        調べている。　観測範囲は
        周囲　１０キロにも　達するぞ。
      ko: |-
        사이코 파워를 발산해 주위를
        조사한다. 관측 범위는
        주변 10km에 달한다.
      zh-Hant: |-
        釋放出精神力量來調查
        周圍的情況。牠的偵測範圍
        甚至可以達到方圓１０公里。
      zh-Hans: |-
        释放出精神力量来调查
        周围的情况。它的侦测范围
        甚至可以达到方圆１０公里。
      en: |-
        It emits psychic energy to observe and study
        what’s around it—and what’s around it can
        include things over six miles away.
      fr: |-
        Il déploie ses pouvoirs psychiques pour sonder
        les alentours, sur un rayon pouvant atteindre
        10 km.
      de: |-
        Indem es Psycho-Kräfte ausstrahlt, erfasst es die
        Umgebung. Seine Observation umfasst dabei
        einen beeindruckenden Umkreis von 10 km.
      es: |-
        Se sirve de sus poderes psíquicos, con los que
        es capaz de percibir lo que ocurre en un radio
        de 10 km, para examinar sus alrededores.
      it: |-
        Grazie ai suoi poteri psichici è in grado di tenere
        sotto controllo la situazione in un’area di ben
        10 km attorno a lui.
