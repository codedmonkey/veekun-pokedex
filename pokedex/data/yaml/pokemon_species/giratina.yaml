    x:
      ja-Hrkt: |-
        じょうしきの　つうようしない
        このよの　うらがわにあると　いわれる
        やぶれたせかいに　せいそくする。
      ja: |-
        常識の　通用しない
        この世の　裏側にあると　言われる
        破れた世界に　生息する。
      ko: |-
        상식이 통하지 않는
        이 세상의 이면에 있다고 불리는
        깨어진 세계에 서식한다.
      en: |-
        This Pokémon is said to live in a world on the
        reverse side of ours, where common knowledge is
        distorted and strange.
      fr: |-
        Il vit dans le Monde Distorsion, un monde à l’opposé
        du nôtre qui échappe au sens commun.
      de: |-
        Es lebt in einer Zerrwelt, die auf der Kehrseite
        der unseren liegt und die sich aller Logik entzieht.
      es: |-
        Vive en el Mundo Distorsión, un mundo opuesto al
        nuestro y cuyas leyes desafían el sentido común.
      it: |-
        Vive nel Mondo Distorto che, sfidando l’ordine
        cosmico, si trova sul lato opposto al nostro.
    'y':
      ja-Hrkt: |-
        あばれもの　ゆえ　おいだされたが
        やぶれたせかいと　いわれる　ばしょで
        しずかに　もとのせかいを　みていた。
      ja: |-
        暴れ者　ゆえ　追い出されたが
        破れた世界と　言われる　場所で
        静かに　元の世界を　見ていた。
      ko: |-
        난폭하다는 이유로 쫓겨났지만
        깨어진 세계라고 전해지는 장소에서
        조용히 원래 세계를 보고 있었다.
      en: |-
        It was banished for its violence. It silently gazed
        upon the old world from the Distortion World.
      fr: |-
        Sa grande violence lui a valu d’être banni.
        Il observe les hommes en silence depuis le Monde
        Distorsion.
      de: |-
        Es wurde aufgrund seines Verhaltens verbannt.
        Aus der Zerrwelt schaut es auf die alte Welt.
      es: |-
        Fue desterrado por su violencia. Observa el mundo
        en silencio desde el Mundo Distorsión.
      it: |-
        È stato bandito per la sua violenza. Osserva il
        vecchio mondo in silenzio dal Mondo Distorto.
