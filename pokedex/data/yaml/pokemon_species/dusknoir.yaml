  flavor_text:
    diamond:
      en: |-
        The antenna on its head captures
        radio waves from the world of spirits
        that command it to take people there.
    pearl:
      en: |-
        The antenna on its head captures
        radio waves from the world of spirits
        that command it to take people there.
    platinum:
      en: |-
        It is said to take lost spirits
        into its pliant body and guide
        them home.
    heartgold:
      en: |-
        This feared Pokémon is said to travel to
        worlds unknown. Some even believe that
        it takes lost spirits along with it.
    soulsilver:
      en: |-
        This feared Pokémon is said to travel to
        worlds unknown. Some even believe that
        it takes lost spirits along with it.
    black:
      en: |-
        It is said to take lost spirits
        into its pliant body and guide
        them home.
      fr: |-
        Son corps se replie sur lui-même
        pour emprisonner les esprits
        perdus et les ramener chez eux.
    white:
      en: |-
        It is said to take lost spirits
        into its pliant body and guide
        them home.
      fr: |-
        Son corps se replie sur lui-même
        pour emprisonner les esprits
        perdus et les ramener chez eux.
    black-2:
      en: |-
        It is said to take lost spirits
        into its pliant body and guide
        them home.
    white-2:
      en: |-
        It is said to take lost spirits
        into its pliant body and guide
        them home.
    x:
      ja-Hrkt: |-
        だんりょくのある　からだの　なかに
        いきばのない　たましいを　とりこんで
        あのよに　つれていくと　いわれる。
      ja: |-
        弾力のある　体の　中に
        行き場のない　魂を　取りこんで
        あの世に　連れていくと　言われる。
      ko: |-
        탄력 있는 몸 안에
        갈 곳 없는 영혼을 가두어
        저승으로 데려간다고 전해진다.
      en: |-
        It is said to take lost spirits into its pliant body and
        guide them home.
      fr: |-
        Son corps se replie sur lui-même pour emprisonner
        les esprits perdus et les ramener chez eux.
      de: |-
        Man sagt, dass es verlorene Seelen in seinem
        biegsamen Körper nach Hause geleite.
      es: |-
        Se dice que recoge en su cuerpo flexible a los
        espíritus extraviados y los guía hasta casa.
      it: |-
        Si dice che accolga gli spiriti smarriti nel suo corpo
        flessibile per riportarli a casa.
    'y':
      ja-Hrkt: |-
        あたまの　アンテナで　れいかいからの
        でんぱを　じゅしん。しじを　うけて
        ひとを　れいかいへ　つれていくのだ。
      ja: |-
        頭の　アンテナで　霊界からの
        電波を　受信。指示を　受けて
        人を　霊界へ　連れて行くのだ。
      ko: |-
        머리의 안테나로 영계로부터의
        전파를 수신한다. 지시를 받아
        사람을 영계로 데리고 간다.
      en: |-
        The antenna on its head captures radio waves from
        the world of spirits that command it to take
        people there.
      fr: |-
        L’antenne sur sa tête capte les ondes radio du monde
        des esprits lui ordonnant d’y porter des gens.
      de: |-
        Die Antenne auf seinem Kopf empfängt Radiowellen
        aus einer anderen Dimension.
      es: |-
        La antena de la cabeza capta ondas de otra dimensión
        que le incitan a llevarse allí a la gente.
      it: |-
        Capta con l’antenna onde che arrivano dal mondo
        degli spiriti, che gli ordinano di portare lì le persone.
    omega-ruby:
      ja-Hrkt: |-
        だんりょくのある　からだの　なかに
        いきばのない　たましいを　とりこんで
        あのよに　つれていくと　いわれる。
      ja: |-
        弾力のある　体の　中に
        行き場のない　魂を　取りこんで
        あの世に　連れていくと　言われる。
      ko: |-
        탄력 있는 몸 안에
        갈 곳 없는 영혼을 가두어
        저승으로 데려간다고 전해진다.
      en: |-
        It is said to take lost spirits into its pliant body and
        guide them home.
      fr: |-
        Son corps se replie sur lui-même pour emprisonner les esprits
        perdus et les ramener chez eux.
      de: |-
        Man sagt, dass es verlorene Seelen in seinem biegsamen
        Körper nach Hause geleite.
      es: |-
        Se dice que recoge en su cuerpo flexible a los
        espíritus extraviados y los guía hasta casa.
      it: |-
        Si dice che accolga gli spiriti smarriti nel suo corpo flessibile
        per riportarli a casa.
    alpha-sapphire:
      ja-Hrkt: |-
        あたまの　アンテナで　れいかいからの
        でんぱを　じゅしん。しじを　うけて
        ひとを　れいかいへ　つれていくのだ。
      ja: |-
        頭の　アンテナで　霊界からの
        電波を　受信。指示を　受けて
        人を　霊界へ　連れて行くのだ。
      ko: |-
        머리의 안테나로 영계로부터의
        전파를 수신한다. 지시를 받아
        사람을 영계로 데리고 간다.
      en: |-
        The antenna on its head captures radio waves from
        the world of spirits that command it to take
        people there.
      fr: |-
        L’antenne sur sa tête capte les ondes radio du monde
        des esprits lui ordonnant d’y porter des gens.
      de: |-
        Die Antenne auf seinem Kopf empfängt Radiowellen aus einer
        anderen Dimension.
      es: |-
        La antena de la cabeza capta ondas de otra dimensión que
        le incitan a llevarse allí a la gente.
      it: |-
        Capta con l’antenna onde che arrivano dal mondo degli spiriti,
        che gli ordinano di portare lì le persone.
    sword:
      ja-Hrkt: |-
        いしが　あるのか　わかっていない。
        れいかいからの　でんぱに　したがい
        ひとや　ポケモンを　つれさるのだ。
      ja: |-
        意思が　あるのか　わかっていない。
        霊界からの　電波に　従い
        人や　ポケモンを　連れ去るのだ。
      ko: |-
        의지가 있는 것인지 알 수 없다.
        영계로부터의 전파에 따라
        사람이나 포켓몬을 데리고 간다.
      zh-Hant: |-
        沒人知道牠是否擁有意識。
        會從來自靈界的電波中接受指示，
        將人和寶可夢帶走。
      zh-Hans: |-
        没人知道它是否拥有意识。
        会从来自灵界的电波中接受指示，
        将人和宝可梦带走。
      en: |-
        At the bidding of transmissions from the spirit
        world, it steals people and Pokémon away.
        No one knows whether it has a will of its own.
      fr: |-
        Nul ne sait s’il est doté d’une volonté propre.
        Les ondes du monde des esprits le poussent
        à conduire humains et Pokémon vers l’au-delà.
      de: |-
        Niemand weiß, ob es einen eigenen Willen hat.
        Über Radiowellen empfängt es Befehle aus dem
        Jenseits, Menschen und Pokémon zu entführen.
      es: |-
        Se desconoce si posee voluntad propia. Capta
        ondas de otra dimensión que le incitan a llevarse
        allí a humanos y Pokémon.
      it: |-
        Non si sa se abbia una volontà propria. Segue le
        onde che provengono dal mondo degli spiriti e
        vi conduce persone e Pokémon.
    shield:
      ja-Hrkt: |-
        ねらった　あいてを　はらのくちで
        まるのみ。　たましいだけを　くい
        にくたいは　はきだし　さっていく。
      ja: |-
        狙った　相手を　腹の口で
        丸飲み。　魂だけを　食い
        肉体は　吐き出し　去っていく。
      ko: |-
        노린 상대를 배의 입으로
        통째로 삼킨다. 영혼만 먹은 뒤
        육체는 뱉어내고 떠난다.
      zh-Hant: |-
        用腹部的嘴將獵物整個吞下。
        只會吃掉對方的魂魄，
        離去時會把肉體吐出來。
      zh-Hans: |-
        用腹部的嘴将猎物整个吞下。
        只会吃掉对方的魂魄，
        离去时会把肉体吐出来。
      en: |-
        With the mouth on its belly, Dusknoir swallows its
        target whole. The soul is the only thing eaten—
        Dusknoir disgorges the body before departing.
      fr: |-
        Il dévore l’âme de ses ennemis en les
        engloutissant dans sa bouche ventrale.
        Il recrache ensuite leur enveloppe corporelle.
      de: |-
        Es verschluckt Beute im Ganzen mit dem Maul
        an seinem Bauch, verspeist aber nur ihre Seele.
        Den Körper spuckt es wieder aus.
      es: |-
        Engulle a los rivales con la boca del estómago y,
        tras haber devorado el alma, escupe el cuerpo.
      it: |-
        Divora la preda in un boccone con la bocca che
        ha sulla pancia, si nutre del suo spirito e ne sputa
        fuori il corpo.
    legends-arceus:
      en: |-
        Comes to those whose lives have come to an end and escorts
        their souls to the afterlife. Known to mistakenly take the souls of
        those who yet have life left in them, albeit rarely.
