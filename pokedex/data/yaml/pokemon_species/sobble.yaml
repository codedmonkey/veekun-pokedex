sobble:
  base_happiness: 50
  capture_rate: 45
  color: blue
  egg_groups:
    - water1
    - ground
  evolution_chain: sobble
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        おびえると　タマネギ１００コぶんの
        さいるいせいぶんを　もつ　なみだを
        ながして　もらいなき　させる。
      ja: |-
        怯えると　玉ねぎ１００個分の
        催涙成分を　もつ　涙を
        流して　もらい泣き　させる。
      ko: |-
        겁을 먹으면 양파 100개와 맞먹는
        최루 성분의 눈물을 흘려서
        상대도 덩달아 울게 만든다.
      zh-Hant: |-
        害怕時流下的淚水中含有
        相當於１００顆洋蔥的催淚成分，
        能讓對手淚流不止。
      zh-Hans: |-
        害怕时流下的泪水中含有
        相当于１００颗洋葱的催泪成分，
        能让对手泪流不止。
      en: |-
        When scared, this Pokémon cries. Its tears pack
        the chemical punch of 100 onions, and attackers
        won’t be able to resist weeping.
      fr: |-
        Quand il a peur, il pleure des larmes contenant
        une substance lacrymogène d’une puissance
        équivalente à celle de cent oignons.
      de: |-
        Hat es Angst, vergießt es Tränen, die Reizstoffe
        enthalten, welche andere ebenfalls zum Weinen
        bringen. Sie sind so stark wie 100 Zwiebeln.
      es: |-
        Cuando se espanta, libera unas lágrimas con un
        factor lacrimógeno equivalente a 100 cebollas
        para hacer llorar también al rival.
      it: |-
        Se si spaventa, produce lacrime con un fattore
        lacrimogeno cento volte più potente di quello di
        una cipolla per far piangere anche i nemici.
    shield:
      ja-Hrkt: |-
        ひふの　いろは　ぬれると　かわる。
        カモフラージュ　されたかの　ように
        すがたが　みえなく　なるのだ。
      ja: |-
        皮膚の　色は　濡れると　変わる。
        カモフラージュ　されたかの　ように
        姿が　見えなく　なるのだ。
      ko: |-
        젖으면 피부색이 변한다.
        위장한 것처럼
        모습이 보이지 않게 된다.
      zh-Hant: |-
        皮膚在濕掉時會變色，
        彷彿像是隱身了一樣，
        誰都看不見牠的身影。
      zh-Hans: |-
        皮肤在湿掉时会变色，
        仿佛像是隐身了一样，
        谁都看不见它的身影。
      en: |-
        When it gets wet, its skin changes color,
        and this Pokémon becomes invisible as if
        it were camouflaged.
      fr: |-
        Sa peau change de couleur et le rend invisible
        quand elle est mouillée, comme un camouflage.
      de: |-
        Wird seine Haut feucht, ändert sich ihre Farbe.
        Dies dient ihm zur Tarnung, da man es dann
        nicht mehr sehen kann.
      es: |-
        Al mojarse, su piel cambia de color y pasa a ser
        invisible, como si se hubiese camuflado.
      it: |-
        Quando si bagna, la pelle cambia colore e lo
        rende invisibile, come se si fosse mimetizzato.
