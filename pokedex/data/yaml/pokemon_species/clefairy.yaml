        춤을 추는 모습을 보면
        행복해진다고 전해진다.
      zh-Hant: |-
        據說如果在滿月的夜晚
        看見皮皮們聚在一起跳舞，
        就能得到幸福。
      zh-Hans: |-
        据说在满月的夜晚，
        如果能看到皮皮们聚在一起跳舞，
        就能得到幸福。
      en: |-
        It is said that happiness will come to those who
        see a gathering of Clefairy dancing under a
        full moon.
      fr: |-
        On dit que ceux qui voient danser un groupe
        de Mélofée sous la pleine lune connaîtront
        un grand bonheur.
      de: |-
        Eine Ansammlung von Piepi bei Vollmond tanzen
        zu sehen, soll ein glückliches Leben verheißen.
      es: |-
        Se dice que la felicidad llegará a quien vea un
        grupo de Clefairy bailando a la luz de la luna
        llena.
      it: |-
        Si dice che vedere un gruppo di Clefairy ballare
        con la luna piena sia di ottimo auspicio.
    shield:
      ja-Hrkt: |-
        あいくるしい　しぐさと　なきごえで
        かわいいと　だいにんきの　ポケモン。
        だが　めったに　みつからない。
      ja: |-
        愛くるしい　しぐさと　鳴き声で
        かわいいと　大人気の　ポケモン。
        だが　めったに　見つからない。
      ko: |-
        애교 있는 몸동작과 울음소리로
        귀엽다고 많은 인기를 누리는 포켓몬.
        그러나 좀처럼 눈에 띄지 않는다.
      zh-Hant: |-
        因可愛的舉止和叫聲
        而廣受歡迎的寶可夢。
        不過很少被人發現。
      zh-Hans: |-
        因可爱的举止和叫声
        而广受欢迎的宝可梦。
        不过很少被人发现。
      en: |-
        Its adorable behavior and cry make it highly popular.
        However, this cute Pokémon is rarely found.
      fr: |-
        Son comportement et son cri adorables font de
        lui un Pokémon très populaire. Malheureusement,
        il est difficile d’en croiser un spécimen.
      de: |-
        Aufgrund seines reizenden Wesens und seines
        Rufes erfreut sich dieses Pokémon großer
        Beliebtheit. Leider ist es auch sehr selten.
