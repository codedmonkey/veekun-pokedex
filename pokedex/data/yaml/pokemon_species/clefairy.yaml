    sword:
      ja-Hrkt: |-
        まんげつのよる　ピッピが　あつまって
        ダンスを　おどるようすを　みると
        しあわせに　なれると　いわれている。
      ja: |-
        満月の夜　ピッピが　集まって
        ダンスを　踊るようすを　見ると
        しあわせに　なれると　言われている。
      ko: |-
