    soulsilver:
      en: |-
        Its adorable behavior and cry
        make it highly popular. However,
        this cute Pokémon is rarely found.
    black:
      en: |-
        It is said that happiness will come
        to those who see a gathering of
        Clefairy dancing under a full moon.
      fr: |-
        On dit que ceux qui voient danser
        un groupe de Mélofée sous la pleine
        lune connaîtront un grand bonheur.
    white:
      en: |-
        It is said that happiness will come
        to those who see a gathering of
        Clefairy dancing under a full moon.
      fr: |-
        On dit que ceux qui voient danser
        un groupe de Mélofée sous la pleine
        lune connaîtront un grand bonheur.
    black-2:
      en: |-
        On nights with a full moon, Clefairy
        gather from all over and dance.
        Bathing in moonlight makes them float.
    white-2:
      en: |-
        On nights with a full moon, Clefairy
        gather from all over and dance.
        Bathing in moonlight makes them float.
    x:
      ja-Hrkt: |-
        まんげつのよる　ピッピが　あつまって
        ダンスを　おどるようすを　みると
        しあわせに　なれると　いわれている。
      ja: |-
        満月の夜　ピッピが　集まって
        ダンスを　踊る様子を　見ると
        幸せに　なれると　言われている。
      ko: |-
        보름달 밤에 삐삐가 모여
        춤을 추는 모습을 보면
        행복해진다고 전해진다.
      en: |-
        It is said that happiness will come to those who see
        a gathering of Clefairy dancing under a full moon.
      fr: |-
        On dit que ceux qui voient danser un groupe de
        Mélofée sous la pleine lune connaîtront un grand
        bonheur.
      de: |-
        Eine Ansammlung von Piepi bei Vollmond tanzen
        zu sehen, soll Freude verheißen.
      es: |-
        Se dice que la felicidad llegará a quien vea a un grupo
        de Clefairy bailando a la luz de la luna llena.
      it: |-
        Si dice che vedere un gruppo di Clefairy ballare
        con la luna piena sia di ottimo auspicio.
    'y':
      ja-Hrkt: |-
        せなかの　つばさに　つきのひかりを
        あつめることで　くうちゅうに
        うかぶことが　できるらしい。
      ja: |-
        背中の　翼に　月の光を
        集めることで　空中に
        浮かぶことが　できるらしい。
      ko: |-
        등의 날개에 달빛을
        모으면 공중에
        떠오를 수 있다는 듯하다.
      en: |-
        The moonlight that it stores in the wings on its back
        apparently gives it the ability to float in midair.
      fr: |-
        La lumière de la lune qu’il emmagasine dans ses ailes
        dorsales lui permet de flotter dans les airs.
      de: |-
        Aufgrund des gespeicherten Mondlichts in seinen
        Flügeln auf dem Rücken kann es in der Luft schweben.
      es: |-
        La luz de luna que guarda en las alas de su lomo
        parece darle la habilidad de flotar en el aire.
      it: |-
        Sembra che la luce lunare che raccoglie nelle ali
        sul dorso gli permetta di volare a mezz’aria.
    omega-ruby:
      ja-Hrkt: |-
        まんげつの　よるは　げんき　いっぱいに　あそぶ。
        あけがた　つかれた　ピッピたちは　しずかな
        やまおくで　なかまたちと　よりそって　ねむる。
      ja: |-
        満月の　夜は　元気　いっぱいに　遊ぶ。
        明け方　疲れた　ピッピたちは　静かな
        山奥で　仲間たちと　寄り添って　眠る。
      ko: |-
        보름달 밤에는 기운차게 논다.
        동틀 녘에 지친 삐삐들은 조용한
        산속에서 동료와 바짝 붙어 잠잔다.
      en: |-
        On every night of a full moon, groups of this Pokémon come
        out to play. When dawn arrives, the tired Clefairy return to their
        quiet mountain retreats and go to sleep nestled up against
        each other.
      fr: |-
        Les nuits de pleine lune, des groupes de ces Pokémon
        sortent jouer. Lorsque l’aube commence à poindre,
        les Mélofée fatigués rentrent dans leur retraite montagneuse
        et vont dormir, blottis les uns contre les autres.
      de: |-
        In Vollmondnächten sammeln sich einige dieser Pokémon,
        um zu spielen. Wird es Tag, kehrt Piepi zu seinem Zufluchtsort
        in den Bergen zurück und schläft eingekuschelt neben seinen
        Artgenossen ein.
      es: |-
        Siempre que hay luna llena, salen en grupo para jugar.
        Al amanecer, los Clefairy, agotados, regresan a sus refugios
        de montaña para dormir acurrucados unos con otros.
      it: |-
        In ogni notte di luna piena questi Pokémon escono in gruppo
        a giocare. All’alba i Clefairy tornano stanchi nella quiete
        delle loro tane montane e vanno a dormire stretti fra loro.
    alpha-sapphire:
      ja-Hrkt: |-
        まんげつの　よるは　げんき　いっぱいに　あそぶ。
        あけがた　つかれた　ピッピたちは　しずかな
