        sortent jouer. Lorsque l’aube commence à poindre,
        les Mélofée fatigués rentrent dans leur retraite montagneuse
        et vont dormir, blottis les uns contre les autres.
      de: |-
        In Vollmondnächten zeigt sich dieses Pokémon. Wenn es Tag
        wird, kehrt Piepi zu seinem Zufluchtsort in den Bergen zurück
        und schläft eingekuschelt neben seinen Artgenossen ein.
      es: |-
        Siempre que hay luna llena, salen en grupo para jugar.
        Al amanecer, los Clefairy, agotados, regresan a sus refugios
        de montaña para dormir acurrucados unos con otros.
      it: |-
        In ogni notte di luna piena questi Pokémon escono in gruppo
        a giocare. All’alba i Clefairy tornano stanchi nella quiete
        delle loro tane montane e vanno a dormire stretti fra loro.
    sun:
      ja-Hrkt: |-
        あいくるしい　しぐさと　すがたで
        ろうにゃくなんにょ　とわずに
        にんきだが　そのかずは　すくない。
      ja: |-
        愛くるしい　仕草と　姿で
        老若男女　問わずに
        人気だが　その数は　少ない。
      ko: |-
        사랑스러운 몸짓과 모습으로
        남녀노소 가리지 않고
        인기가 있지만, 그 수는 적다.
      zh-Hant: |-
        因為可愛的舉止和模樣，
        不論男女老幼都很喜歡牠。
        但數量很稀少。
      zh-Hans: |-
        因为可爱的举止和样子，
        不论男女老幼都很喜欢它。
        但数量稀少。
      en: |-
        Its adorable behavior and appearance make it
        popular with men and women, young and old.
        Its numbers are few, however.
      fr: |-
        Son apparence et ses mimiques charmantes lui
        ont valu de nombreux fans de tous âges, mais
        il reste un Pokémon relativement rare.
      de: |-
        Dank seiner verspielten Art und seines süßen
        Aussehens ist es bei Jung und Alt sehr beliebt.
        Dieses Pokémon ist jedoch selten.
      es: |-
        Tanto niños como adultos de todas las edades
        los encuentran adorables por su aspecto y su
        comportamiento. No quedan muchos ejemplares.
      it: |-
        È amato da donne e uomini di tutte le età per
        il suo aspetto adorabile e le sue graziose
        movenze. Ne esistono solo pochi esemplari.
    moon:
      ja-Hrkt: |-
        まんげつの　ばんに　あつまって
        なかまと　ダンス。　そのしゅういは
        いじょうな　じばに　つつまれる。
      ja: |-
        満月の　晩に　集まって
        仲間と　ダンス。　その周囲は
        異常な　磁場に　包まれる。
      ko: |-
        보름달 밤에 모여서
        동료와 춤을 춘다. 그 주변은
        이상한 자기장으로 둘러싸인다.
      zh-Hant: |-
        在月圓之夜聚集，和夥伴一起跳舞。
        周圍被異常的磁場包圍著。
      zh-Hans: |-
        在月圆之夜聚集，和伙伴一起跳舞。
        那周围也会被异常的磁场包围。
      en: |-
        On nights with a full moon, they gather together
        and dance. The surrounding area is enveloped
        in an abnormal magnetic field.
      fr: |-
        Ce Pokémon retrouve ses congénères et danse
        lors des nuits de pleine lune. Un champ
        magnétique mystérieux s’étend alors alentour.
      de: |-
        Bei Vollmond versammeln sie sich und tanzen
        gemeinsam. Um sie herum entsteht dadurch
        ein ungewöhnliches Magnetfeld.
      es: |-
        Cuando hay luna llena, los Clefairy salen en
        grupo a bailar. A su alrededor se genera un
        misterioso campo magnético.
      it: |-
        Nelle notti di luna piena, i Clefairy si radunano
        per danzare. Intorno a loro si crea un misterioso
        campo magnetico.
    ultra-sun:
      ja-Hrkt: |-
        にんきだが　かずが　すくないので
        きちょう。　むやみに　みせびらかすと
        どろぼうに　ねらわれるぞ。
      ja: |-
        人気だが　数が　少ないので
        貴重。　むやみに　見せびらかすと
        泥棒に　狙われるぞ。
      ko: |-
        인기가 있지만, 개체 수가 적어
        귀하다. 함부로 자랑하다가는
        도둑의 타깃이 된다.
      zh-Hant: |-
        深受人們喜愛，但因為數量稀少
        所以十分珍貴。如果隨便把牠
        帶出來炫耀，就會被小偷盯上哦。
      zh-Hans: |-
        虽然深受人们的喜爱，但由于数量稀少
        故而十分珍贵。如果随便把它
        带出来炫耀，就会被小偷盯上哦。
      en: |-
        They’re popular, but they’re rare. Trainers who
        show them off recklessly may be targeted
        by thieves.
      fr: |-
        Il est très rare en dépit de sa popularité. Ne le
        laissez pas sans surveillance, car il risquerait
        de se faire dérober par un voleur de Pokémon !
      de: |-
        Dieses beliebte Pokémon hat Seltenheitswert.
        Wer leichtsinnig damit prahlt, eins zu haben,
        könnte in das Visier von Dieben geraten.
      es: |-
        Es muy popular y la escasez de ejemplares lo
        hace muy valioso. Quien presume mucho de
        tener uno se arriesga a que se lo roben.
      it: |-
        Questo Pokémon molto popolare è piuttosto raro
        e prezioso. È meglio evitare di metterlo troppo in
        mostra, o si corre il rischio di farselo rubare.
    ultra-moon:
      ja-Hrkt: |-
        つきあかりを　あびた　つばさは
        あわく　かがやき　はばたかなくとも
        ちゅうに　うかんで　まいおどる。
      ja: |-
        月明かりを　浴びた　翼は
        淡く　輝き　羽ばたかなくとも
        宙に　浮かんで　舞い踊る。
      ko: |-
        달빛에 비친 날개는 희미하게
        빛나고 날갯짓하지 않아도
        허공을 떠다니며 춤을 춘다.
      zh-Hant: |-
        沐浴著月光的翅膀會發出
        淡淡的光輝，不需要振翅
        就能浮在空中翩翩起舞。
      zh-Hans: |-
        沐浴着月光的翅膀会发出
        淡淡的光辉。即便不挥动翅膀，
        它也能浮在空中翩翩起舞。
      en: |-
        Bathed in moonlight, its wings glow faintly.
        Without even flapping, Clefairy rises into the air,
        where it dances around.
      fr: |-
        Quand ses ailes absorbent la lumière de la lune,
        elles brillent légèrement et le font léviter pour
        lui permettre de danser dans les airs.
      de: |-
        Im Mondlicht erstrahlen seine Flügel in sanftem
        Schein und lassen es auch ohne Flügelschlag
        in der Luft schwebend tanzen.
      es: |-
        Cuando la luz de la luna baña sus alas, estas
        emiten un tenue brillo y, sin batirlas siquiera,
        levita en el aire y comienza a bailar.
      it: |-
        Danza librandosi a mezz’aria senza sbattere
        le ali, che al chiarore della luna emettono un
        debole scintillio.
    lets-go-pikachu:
      ja-Hrkt: |-
        すがたや　しぐさが　あいくるしく
        にんきだが　かずが　すくないのか
        なかなか　はっけん　できない。
      ja: |-
        姿や　仕草が　愛くるしく
        人気だが　数が　少ないのか
        なかなか　発見　できない。
      ko: |-
        모습과 행동이 사랑스러워서
        인기가 높지만 수가 적어서인지
        좀처럼 발견되지 않는다.
      zh-Hant: |-
        可愛的外型和動作使牠深受歡迎。
        但可能因為數量稀少的緣故，
        人們很難發現牠的蹤跡。
      zh-Hans: |-
        因外形和动作可爱而深受
        大家的喜爱。但或许是由于
        数量稀少，它们很难被发现。
      en: |-
        Adored for their cute looks and playfulness.
        They are thought to be rare, as they
        do not appear often.
      fr: |-
        Adoré pour son aspect mignon et joyeux,
        on le suppose rare, car on en voit très peu
        de spécimens.
      de: |-
        Wegen seines reizenden Aussehens und Wesens
        ist Piepi beliebt, aber man sieht es nur selten,
        da es anscheinend nicht viele Exemplare gibt.
      es: |-
        Su aspecto jovial y sus ademanes lo hacen
        adorable y muy popular, aunque no suelen verse
        a menudo, tal vez porque su número sea escaso.
      it: |-
        È molto amato per l’aspetto adorabile
        e le graziose movenze, ma non si vede
        spesso perché ne esistono pochi esemplari.
    lets-go-eevee:
      ja-Hrkt: |-
