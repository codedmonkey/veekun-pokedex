goodra:
  base_happiness: 35
  capture_rate: 45
  color: purple
  egg_groups:
    - dragon
  evolution_chain: goomy
  evolves_from: sliggoo
  flavor_text:
    x:
      ja-Hrkt: |-
        ひとなつっこい　ドラゴンポケモン。
        だいすきな　トレーナーに　だきついて
        ねんえきで　ヌルヌルにしてしまう。
      ja: |-
        人懐っこい　ドラゴンポケモン。
        大好きな　トレーナーに　抱き着いて
        粘液で　ヌルヌルにしてしまう。
      ko: |-
        사람을 잘 따르는 드래곤포켓몬이다.
        좋아하는 트레이너에게 달려들어
        미끈미끈한 점액투성이로 만들어 버린다.
      en: |-
        This very friendly Dragon-type Pokémon
        will hug its beloved Trainer, leaving
        that Trainer covered in sticky slime.
      fr: |-
        Ce Pokémon Dragon peu farouche aime faire la fête
        à son Dresseur adoré, le couvrant au passage de
        sa bave collante.
      de: |-
        Dieses äußerst freundliche Drachen-Pokémon
        neigt dazu, seinen geliebten Trainer zu umarmen
        und so mit einer dicken Schleimschicht zu umhüllen.
      es: |-
        Pokémon de tipo Dragón muy afable al que le gusta
        abrazar con efusión a su Entrenador, aunque después
        lo deja totalmente pringado.
      it: |-
        Un Pokémon Drago davvero amichevole. Ama fare le
        feste al suo Allenatore lasciandolo ricoperto di bava.
    'y':
      ja-Hrkt: |-
        のびちぢみする　ツノで　こうげき。
        プロボクサー　１００にんぶんの
        パンチに　ひってきする　いりょく。
      ja: |-
        伸び縮みする　ツノで　攻撃。
        プロボクサー　１００人分の
        パンチに　匹敵する　威力。
      ko: |-
        늘었다 줄었다 하는 뿔로 공격한다.
        프로 복서 100명분의
        펀치에 필적하는 위력을 가졌다.
      en: |-
        It attacks with retractable horns.
        It throws a punch that’s the equivalent
        of the force of a hundred pro boxers.
      fr: |-
        Il attaque grâce à ses cornes extensibles.
        Ses coups sont aussi puissants que ceux de 100
        boxeurs professionnels réunis.
      de: |-
        Es greift den Gegner mit ausfahrbaren Fühlern an.
        Seine Stärke ist vergleichbar mit der Durchschlagskraft
        der Faustschläge von 100 Profiboxern.
      es: |-
        Ataca con sus antenas retráctiles, desplegando
        una fuerza comparable a los puñetazos de 100
        boxeadores profesionales.
      it: |-
        Attacca con i corni che possono allungarsi e
        accorciarsi. Ha una forza pari a quella di 100 pugili
        professionisti.
    omega-ruby:
