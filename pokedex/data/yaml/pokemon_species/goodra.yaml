    sun:
      ja-Hrkt: |-
        すごく　ひとなつっこい　ポケモン。
        かまわないでいると　さみしくて
        ヌルヌルの　なみだを　ながし　なく。
      ja: |-
        すごく　人懐っこい　ポケモン。
        構わないでいると　寂しくて
        ヌルヌルの　涙を　流し　鳴く。
      ko: |-
        굉장히 사람을 잘 따르는 포켓몬이다.
        신경을 안 쓰고 있으면 외로워서
        미끈미끈한 눈물을 흘리며 운다.
      zh-Hant: |-
        和人非常親近的寶可夢。
        沒人理睬的話就會很寂寞，
        流著黏糊糊的眼淚鳴叫。
      zh-Hans: |-
        和人非常亲近的宝可梦。
        不管它的话，就会很寂寞，
        流着黏糊糊的眼泪鸣叫。
      en: |-
        An amazingly friendly Pokémon, but if left to
        itself, loneliness overcomes it, and it oozes
        gooey tears.
      fr: |-
        Ce Pokémon adore la compagnie humaine.
        Si son Dresseur ne lui donne pas assez d’amour,
        il pleure à grosses larmes visqueuses.
      de: |-
        Dieses äußerst freundliche Pokémon benötigt
        sehr viel Aufmerksamkeit, sonst fühlt es sich
        einsam und weint schleimige Tränen.
      es: |-
        Es muy afable y cariñoso. Si lo ignoran, le invade
        la tristeza y llora lágrimas viscosas.
      it: |-
        Questo Pokémon adora la compagnia e, se viene
        trascurato, si rattrista e si mette a piangere
        versando viscidi lacrimoni.
    moon:
      ja-Hrkt: |-
        おとなしいからと　からかうと
        ツノで　おもいきり　つかれ
        ふとい　しっぽで　なぎはらわれる。
      ja: |-
        大人しいからと　からかうと
        角で　思い切り　突かれ
        太い　尻尾で　薙ぎ払われる。
      ko: |-
        얌전하다고 놀리면
        뿔에 힘껏 찔리고
        굵은 꼬리로 내동댕이쳐진다.
      zh-Hant: |-
        如果因為牠性情溫順
        就去戲弄牠，會被牠用角狠戳，
        再用粗粗的尾巴掃倒。
      zh-Hans: |-
        因为很温顺就去戏弄的话，
        就会被它用角狠狠戳，
        用粗粗的尾巴扫荡。
      en: |-
        It gets picked on because it’s meek. But then,
        whoever teased it gets to feel the full force of
        its horns and a good swatting from its thick tail.
      fr: |-
        Ceux qui l’importunent en le pensant inoffensif
        peuvent vite se retrouver du mauvais côté de
        ses cornes et goûter de sa puissante queue.
      de: |-
        Wer dieses Pokémon nicht ernst nimmt,
        bekommt es mit seinen Fühlern zu tun oder
        wird von seinem Schwanz umgehauen.
      es: |-
        Golpea con sus antenas retráctiles y derriba con
        su gruesa cola a aquellos que se burlan de él
        creyendo que es inofensivo.
      it: |-
        Chi lo prende in giro credendolo inoffensivo
        potrebbe ritrovarsi ad assaggiare la potenza
        dei suoi corni e della sua grossa coda.
    ultra-sun:
      ja-Hrkt: |-
        とっても　ひとなつっこい。　なつくと
        ネバネバの　ねんえきに　まみれた
        からだで　だきついてくるが　がまんだ。
      ja: |-
        とっても　人懐っこい。　懐くと
        ネバネバの　粘液に　まみれた
        身体で　抱きついてくるが　我慢だ。
      ko: |-
        매우 사람을 잘 따른다. 친밀해지면
        끈적끈적한 점액투성이인
        몸으로 끌어안으려 하지만 참아야 한다.
      zh-Hant: |-
        和人非常親近。變得親密後，
        會用沾滿黏糊糊黏液的身體
        抱上來，這時就只能忍耐了。
      zh-Hans: |-
        和人非常亲近。变得亲密后，
        会用被黏糊糊的黏液包裹着的身体
        抱住人的身体，要忍耐哦。
      en: |-
        It’s very friendly toward people. If you grow
        close to it, Goodra will hug you with its sticky,
        slime-covered body. Don’t get mad.
      fr: |-
        Très câlin, ce Pokémon a tendance à se frotter
        aux gens auxquels il s’attache avec son corps
        visqueux. Dresseurs de Muplodocus, tenez bon.
      de: |-
        Dieses freundliche Pokémon hat die Eigenart,
        mit seinem schleimigen, klebrigen Körper all jene
        zu umarmen, die es mag.
      es: |-
        Un Pokémon muy amistoso que demuestra su
        afecto con abrazos viscosos y gelatinosos. Se
        necesita algo de estoicismo para no apartarse.
      it: |-
        È molto socievole e se si affeziona a qualcuno lo
        abbraccia ricoprendolo di bava appiccicosa.
        Ci vuole pazienza con questo Pokémon...
    ultra-moon:
      ja-Hrkt: |-
        ヌルヌルの　ひふの　したには
        ぶあつい　しぼうの　そうが　あり
        てきの　こうげきを　うけながす。
      ja: |-
        ヌルヌルの　皮膚の　下には
        分厚い　脂肪の　層が　あり
        敵の　攻撃を　受け流す。
      ko: |-
        미끈미끈한 피부 아래에는
        두꺼운 지방층이 있어
        적의 공격을 받아넘긴다.
      zh-Hant: |-
        黏糊糊的皮膚下面
        有很厚的脂肪層，
        讓敵人的攻擊起不了作用。
      zh-Hans: |-
        黏糊糊的皮肤下面有很厚的脂肪层，
        可以卸掉敌人的攻击。
      en: |-
        Underneath its slimy skin is a thick layer of fat,
        and the combination of the two makes enemies’
        attacks slide right off.
      fr: |-
        Une épaisse couche de graisse se trouve sous
        sa peau visqueuse et lui permet d’encaisser
        les attaques ennemies.
      de: |-
        Unter seiner schleimigen Haut befindet sich eine
        dicke Speckschicht, die gegnerische Angriffe
        abfängt.
      es: |-
        Debajo de su resbaladiza piel cuenta con una
        voluminosa capa de grasa que le permite
        bloquear los ataques enemigos.
      it: |-
        Sotto la sua pelle viscosa c’è uno spesso strato
        di grasso che assorbe i colpi dei nemici.
    sword:
      ja-Hrkt: |-
        トレーナーの　しじが　りかいできずに
        キョトンとする　ことが　たまに　あり
        その　ようすが　かわいいと　にんき。
      ja: |-
        トレーナーの　指示が　理解できずに
        キョトンとする　ことが　たまに　あり
        その　様子が　かわいいと　人気。
      ko: |-
        트레이너의 지시를 이해하지 못하고
        어리둥절해하는 경우가 가끔 있으며
        그 모습이 귀여워서 인기가 많다.
      zh-Hant: |-
        有時會因為無法理解
        訓練家的指令而目瞪口呆。
        那可愛的舉止讓牠深受歡迎。
      zh-Hans: |-
        有时会因为无法理解
        训练家的指令而目瞪口呆。
        那可爱的举止让它深受欢迎。
      en: |-
        Sometimes it misunderstands instructions and
        appears dazed or bewildered. Many Trainers
        don’t mind, finding this behavior to be adorable.
      fr: |-
        Il arrive qu’il ne comprenne pas les ordres
        de son Dresseur et qu’il le regarde d’un air ahuri.
        Cette réaction adorable l’a rendu populaire.
      de: |-
        Es kommt vor, dass es die Befehle seines Trainers
        nicht versteht und nur verblüfft dreinschaut.
        Dieser putzige Anblick hat es beliebt gemacht.
      es: |-
        A veces no entiende las instrucciones de su
        Entrenador y se queda como abstraído, pero
        mucha gente encuentra este rasgo adorable.
      it: |-
        A volte non capisce gli ordini del suo Allenatore
        e rimane immobile con un’aria stupita. Molti lo
        trovano adorabile proprio per questo.
    shield:
      ja-Hrkt: |-
        ながい　ツノを　のばす　いきおいで
        こうげき。　いりょくは　ヘビーきゅう
        ボクサーの　パンチの　１００ばいだ。
      ja: |-
        長い　ツノを　伸ばす　勢いで
        攻撃。　威力は　ヘビー級
        ボクサーの　パンチの　１００倍だ。
      ko: |-
        긴 뿔을 기세 좋게 늘여서
        공격한다. 위력은 헤비급
        복서 펀치의 100배다.
      zh-Hant: |-
        用伸長角產生的力道來
        攻擊對手，產生的威力比
        重量級拳擊手的拳擊還強１００倍。
      zh-Hans: |-
        用伸长角产生的力道来
        攻击对手，产生的威力比
        重量级拳击手的拳击还强１００倍。
      en: |-
        Its form of offense is forcefully stretching out its
        horns. The strikes land 100 times harder than any
        blow from a heavyweight boxer.
      fr: |-
        Il attaque à l’aide de ses longues cornes.
        Ses coups sont cent fois plus puissants
        que ceux d’un champion poids lourds de boxe.
      de: |-
        Es greift mit seinen ausfahrbaren Fühlern an,
        deren Durchschlagskraft hundertmal so stark wie
        der Faustschlag eines Schwergewichtsboxers ist.
      es: |-
        Ataca extendiendo sus largas antenas. La fuerza
        que despliega es 100 veces superior a la del
        puñetazo de un boxeador de peso pesado.
      it: |-
        Distende i suoi lunghi corni e si lancia all’attacco
        con una potenza 100 volte superiore al pugno
        di un peso massimo.
    legends-arceus:
      en: |-
        Able to freely control the hardness of its metallic shell.
        It loathes solitude and is extremely clingy—it will fume and
        run riot if those dearest to it ever leave its side.
