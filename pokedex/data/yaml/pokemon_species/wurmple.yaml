wurmple:
  base_happiness: 70
  capture_rate: 255
  color: red
  egg_groups:
    - bug
  evolution_chain: wurmple
  evolves_from: ~
  flavor_text:
    ruby:
      en: |-
        Using the spikes on its rear end,  
        WURMPLE peels the bark off trees and
        feeds on the sap that oozes out.This POKéMON’s feet are tipped with
        suction pads that allow it to cling to
        glass without slipping.
    sapphire:
      en: |-
        WURMPLE is targeted by SWELLOW as
        prey. This POKéMON will try to resist by
        pointing the spikes on its rear at theattacking predator.
        It will weaken the foe by leaking poison
        from the spikes.
    emerald:
      en: |-
        It sticks to tree branches and eats
        leaves. The thread it spits from its mouth,
        which becomes gooey when it touches
        air, slows the movement of its foes.
    firered:
      en: |-
        It lives amidst tall grass and in forests.
        When attacked, it resists by pointing its
        venomous spikes at the foe.
    leafgreen:
      en: |-
        It lives amidst tall grass and in forests.
        When attacked, it resists by pointing its
        venomous spikes at the foe.
    diamond:
      en: |-
        It loves to eat leaves. If it is
        attacked by a STARLY, it will defend
        itself with its spiked rear.
    pearl:
      en: |-
        It spits a white silk that turns
        sticky when it contacts air. It is
        used to immobilize foes.
    platinum:
      en: |-
        Often targeted by bird Pokémon,
        it desperately resists by releasing
        poison from its tail spikes.
    heartgold:
      en: |-
        It lives among the tall grass and in
        forests. It repels attacks by 
        raising up the spikes on its rear.
    soulsilver:
      en: |-
        It lives among the tall grass and in
        forests. It repels attacks by 
        raising up the spikes on its rear.
    black:
      en: |-
        Often targeted by bird Pokémon,
        it desperately resists by releasing
        poison from its tail spikes.
      fr: |-
        Cible favorite des Pokémon Oiseaux,
        il tente de se protéger avec ses
        épines venimeuses.
    white:
      en: |-
        Often targeted by bird Pokémon,
        it desperately resists by releasing
        poison from its tail spikes.
      fr: |-
        Cible favorite des Pokémon Oiseaux,
        il tente de se protéger avec ses
        épines venimeuses.
    black-2:
      en: |-
        Often targeted by bird Pokémon,
        it desperately resists by releasing
        poison from its tail spikes.
    white-2:
      en: |-
        Often targeted by bird Pokémon,
        it desperately resists by releasing
        poison from its tail spikes.
    x:
      ja-Hrkt: |-
        はっぱが　だいこうぶつ。
        ムックルに　おそわれたときは
        おしりの　トゲで　げきたいする。
      ja: |-
        葉っぱが　大好物。
        ムックルに　襲われたときは
        お尻の　トゲで　撃退する。
      ko: |-
        잎사귀를 매우 좋아한다.
        찌르꼬에게 습격당했을 때는
        엉덩이의 가시로 물리친다.
      en: |-
        It loves to eat leaves. If it is attacked by a Starly,
        it will defend itself with its spiked rear.
      fr: |-
        Il adore manger des feuilles. Si un Étourmi l’attaque,
        il riposte avec les piquants de son postérieur.
      de: |-
        Es isst am liebsten Blätter. Wird es von einem
        Staralili angegriffen, verteidigt es sich mit Stacheln.
      es: |-
        Le encanta comer hojas. Si le ataca un Starly, se
        defenderá con sus púas.
      it: |-
        Ama mangiare le foglie. Se Starly lo attacca, si
        difende con gli aculei che ha sulla parte posteriore.
    'y':
      ja-Hrkt: |-
        もりや　くさむらに　せいそく。
        てきに　おそわれた　ときは　おしりの
        どくの　トゲで　たいこうする。
      ja: |-
        森や　草むらに　生息。
        敵に　襲われた　ときは　お尻の
        毒の　トゲで　対抗する。
      ko: |-
        숲과 수풀에 서식한다.
        적에게 습격당했을 때는 엉덩이의
        독가시로 대항한다.
      en: |-
        It lives among the tall grass and in forests. It repels
        attacks by raising up the spikes on its rear.
      fr: |-
        Il habite les forêts et les hautes herbes. Attaqué,
        il riposte avec les piquants de son postérieur.
      de: |-
        Es haust in Wäldern und auf Wiesen. Bei Angriffen
        wehrt es sich mit den Giftstacheln auf seinem
        Hinterteil.
      es: |-
        Vive en bosques y zonas de hierba alta. Si le atacan,
        se defiende con las púas venenosas de su cola.
      it: |-
        Vive nelle foreste e tra l’erba alta. Se è attaccato,
        usa gli aculei velenosi che ha sulla parte posteriore.
    omega-ruby:
      ja-Hrkt: |-
        おしりの　トゲで　きの　かわを　はがして
        しみだした　じゅえきを　しょくりょうに　する。
        きゅうばんの　あしは　ガラスでも　すべらない。
      ja: |-
        お尻の　トゲで　木の　皮を　はがして
        染み出した　樹液を　食料に　する。
        吸盤の　足は　ガラスでも　滑らない。
      ko: |-
        엉덩이의 가시로 나무의 껍질을 벗기고
        배어 나온 수액을 식량으로 삼는다.
        흡반이 달린 다리는 유리에서도 미끄러지지 않는다.
      en: |-
        Using the spikes on its rear end, Wurmple peels the bark off
        trees and feeds on the sap that oozes out. This Pokémon’s
        feet are tipped with suction pads that allow it to cling to glass
        without slipping.
      fr: |-
        À l’aide de ses pointes arrière, Chenipotte déchire l’écorce
        des arbres et mange la sève qui coule dessus.
        Les pattes de ce Pokémon sont dotées de coussinets à
        ventouses pour adhérer aux parois en verre sans en glisser.
      de: |-
        Waumpel kann mit den Stacheln an seinem Hinterteil die Rinde
        von Bäumen entfernen und ernährt sich von dem austretenden
        Saft. An den Füßen dieses Pokémon befinden sich Saugnäpfe,
        mit denen es auch an Glas nicht abrutscht.
      es: |-
        Wurmple usa las púas del lomo para raspar los troncos de los
        árboles, quitarles la corteza y beber la savia que emanan. Este
        Pokémon tiene unas ventosas rematándole los pies, con las
        que se adhiere al cristal sin resbalarse.
      it: |-
        Grazie agli aculei sulla parte posteriore del corpo, Wurmple
        scorteccia i tronchi degli alberi e si nutre della loro linfa.
        Le sue zampe sono dotate di ventose che gli consentono
        di attaccarsi ai vetri senza scivolare.
    alpha-sapphire:
      ja-Hrkt: |-
        エサにしようと　つかまえにきた　オオスバメに
        おしりの　トゲを　むけて　ていこうする。
        しみだした　どくで　あいてを　よわらせるぞ。
      ja: |-
        エサにしようと　捕まえにきた　オオスバメに
        お尻の　トゲを　向けて　抵抗する。
        染み出した　毒で　相手を　弱らせるぞ。
      ko: |-
        먹이로 삼으려고 다가온 스왈로에게
        엉덩이의 가시를 들이밀고 저항한다.
        배어 나온 독으로 상대를 약하게 만든다.
      en: |-
        Wurmple is targeted by Swellow as prey. This Pokémon
        will try to resist by pointing the spikes on its rear at the
        attacking predator. It will weaken the foe by leaking poison
        from the spikes.
      fr: |-
        Chenipotte est la proie de Hélédelle. Ce Pokémon essaie de
        résister en dirigeant les pointes de son dos vers le prédateur.
        Il affaiblit son ennemi en lui injectant du poison.
      de: |-
        Waumpel wird von Schwalboss als Beute angesehen.
        Dieses Pokémon wehrt sich gegen angreifende Räuber,
        indem es die Stacheln an seinem Hinterteil auf sie richtet.
        Es schwächt seine Gegner mit dem Gift, das aus den
        Stacheln austritt.
      es: |-
        Wurmple es la presa preferida de Swellow. La forma que tiene
        de intentar defenderse es apuntar con las púas del lomo al
        amenazante enemigo y debilitarlo inyectándole veneno.
      it: |-
        Wurmple è la preda favorita di Swellow. Questo Pokémon
        cerca di resistere puntando gli aculei irti sulla schiena contro
        il predatore che attacca. Poi indebolisce il nemico emettendo
        veleno da questi aculei.
    legends-arceus:
      en: |-
        Likes sap and is abundant in the wild. Why it evolves into
        various different forms is unknown. One cannot tell from a
        Wurmple's appearance which form it will take when it evolves.
