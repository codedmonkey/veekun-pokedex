    x:
      ja-Hrkt: |-
        コノハナが　かなでる　くさぶえの
        ねいろは　ひとを　ふあんにさせる。
        もりの　おくに　すんでいる。
      ja: |-
        コノハナが　奏でる　草笛の　音色は
        人を　不安にさせる。
        森の　奥に　住んでいる。
      ko: |-
        잎새코가 연주하는 풀피리의
        음색은 사람을 불안하게 만든다.
        숲 속에서 살고 있다.
      en: |-
        The sound of its grass flute makes its listeners
        uneasy. It lives deep in forests.
      fr: |-
        Le son de sa flûte d’herbe déstabilise l’auditeur.
        Il vit au plus profond des forêts.
      de: |-
        Der Ton seiner Grasflöte beunruhigt die,
        die ihn hören. Es lebt tief in den Wäldern.
      es: |-
        Cuando usa la hoja de su cabeza como flauta, asusta
        a la gente. Vive en lo más profundo de los bosques.
      it: |-
        Il fischio del suo flauto di foglia mette a disagio chi
        lo sente. Vive nelle foreste più fitte.
    'y':
      ja-Hrkt: |-
        もりの　おくふかくに　せいそく。
        あたまの　はっぱで　ふえを　つくり
        ふあんに　させる　ねいろを　だす。
      ja: |-
        森の　奥深くに　生息。
        頭の　葉っぱで　笛を　作り
        不安に　させる　音色を　出す。
      ko: |-
        깊은 숲 속에서 서식한다.
        머리의 잎날로 피리를 만들어
        불안하게 만드는 음색을 낸다.
      en: |-
        It lives deep in forests. With the leaf on its head,
        it makes a flute whose song makes
        listeners uneasy.
      fr: |-
        Il vit au plus profond des forêts. Le son de sa flûte,
        faite avec la feuille de sa tête, est inquiétant.
      de: |-
        Lebt tief im Wald. Es baut sich eine Flöte aus den
        Blättern seines Kopfes. Ihr Ton verbreitet Schrecken.
      es: |-
        Vive en lo más profundo del bosque. Utiliza la hoja de
        su cabeza como flauta con un sonido perturbador.
      it: |-
        Vive nelle foreste più fitte. Con la foglia che ha in
        testa, crea un flauto dal suono inquietante.
    omega-ruby:
      ja-Hrkt: |-
        うっそうと　しげった　もりに　すむ　ポケモン。
        たまに　もりを　でては　ひとを　おどろかせる。
        ながい　はなを　つかまれるのは　だいきらい。
      ja: |-
        うっそうと　茂った　森に　すむ　ポケモン。
        たまに　森を　出ては　人を　驚かせる。
        長い　鼻を　つかまれるのは　大嫌い。
      ko: |-
        울창하게 우거진 숲에 사는 포켓몬이다.
        가끔 숲을 나와 사람들을 놀라게 한다.
        긴 코가 잡히는 걸 매우 싫어한다.
      en: |-
        Nuzleaf live in densely overgrown forests. They occasionally
        venture out of the forest to startle people. This Pokémon
        dislikes having its long nose pinched.
      fr: |-
        Les Pifeuil vivent dans des forêts très densément boisées.
        Il leur arrive de sortir de la forêt pour faire peur aux gens.
        Ce Pokémon déteste qu’on lui pince son grand nez.
      de: |-
        Blanas lebt in dichten Wäldern. Manchmal wagt es sich aus
        dem Wald heraus, um Menschen zu erschrecken. Dieses
        Pokémon mag es überhaupt nicht, wenn man seine lange
        Nase zwickt.
      es: |-
        Nuzleaf habita bosques muy poblados y, en ocasiones, se
        atreve a salir para asustar a la gente. A este Pokémon no le
        gusta nada que le pellizquen la nariz.
      it: |-
        Nuzleaf vive in foreste molto fitte. A volte si avventura fuori
        dalla foresta per spaventare le persone. Questo Pokémon
        si irrita molto se qualcuno tenta di pizzicargli il lungo naso.
    alpha-sapphire:
      ja-Hrkt: |-
        あたまの　はっぱを　ぬいて　くさぶえを　つくる。
        コノハナが　かなでる　くさぶえの　ねいろは
        もりで　まよった　ひとを　ふあんにさせる。
      ja: |-
        頭の　葉っぱを　抜いて　草笛を　つくる。
        コノハナが　奏でる　草笛の　音色は
        森で　迷った　人を　不安にさせる。
      ko: |-
        머리의 잎사귀를 뽑아 풀피리를 만든다.
        잎새코가 연주하는 풀피리의 음색은
        숲에서 길을 잃은 사람을 불안하게 한다.
      en: |-
        This Pokémon pulls out the leaf on its head and makes a flute
        with it. The sound of Nuzleaf’s flute strikes fear and uncertainty
        in the hearts of people lost in a forest.
      fr: |-
        Ce Pokémon se sert de la feuille sur sa tête pour jouer
        de la flûte. Le son de la flûte de Pifeuil effraie et
        décontenance les gens perdus en forêt.
      de: |-
        Dieses Pokémon reißt das Blatt auf seinem Kopf heraus und
        benutzt es als Flöte. Diese Geräusche jagen den Menschen,
        die sich im Wald verirrt haben, Angst ein.
      es: |-
        Nuzleaf saca la hoja que tiene en la cabeza y la usa como
        flauta. El sonido que emite infunde miedo e incertidumbre a
        quien se encuentre perdido por el bosque.
      it: |-
        Nuzleaf crea una sorta di flauto con la foglia che ha sul capo.
        Il suono di questo flauto fa crescere la paura e l’incertezza
        nel cuore di coloro che si sono persi nella foresta.
    sword:
      ja-Hrkt: |-
        もりの　おくふかくに　せいそく。
        あたまの　はっぱで　ふえを　つくり
        ふあんに　させる　ねいろを　だす。
      ja: |-
        森の　奥深くに　生息。
        頭の　葉っぱで　笛を　作り
        不安に　させる　音色を　出す。
      ko: |-
        깊은 숲속에서 서식한다.
        머리의 이파리로 피리를 만들어
        불안하게 만드는 음색을 낸다.
      zh-Hant: |-
        棲息在森林深處。
        會用頭上的葉子做成笛子，
        吹出令人感到不安的音色。
      zh-Hans: |-
        栖息于森林的深处。
        会用头上的叶子做成笛子，
        吹出令人感到不安的音色。
      en: |-
        It lives deep in forests. With the leaf on its head,
        it makes a flute whose song makes listeners uneasy.
      fr: |-
        Il vit au plus profond des forêts.
        Sa flûte faite avec la feuille de sa tête
        émet un son inquiétant.
      de: |-
        Es lebt tief im Wald. Aus dem Blatt auf seinem
        Kopf kann es sich eine Flöte bauen, deren Klang
        Unruhe verbreitet.
      es: |-
        Vive en lo más profundo del bosque. Utiliza la
        hoja de la cabeza como flauta para emitir un
        sonido perturbador.
      it: |-
        Vive nelle foreste più fitte. Con la foglia che ha
        in testa, crea un flauto dal suono inquietante.
    shield:
      ja-Hrkt: |-
        コノハナの　ふく　くさぶえの　おとは
        きいた　ものを　ふあんに　させる。
        たいぼくに　あいた　あなで　くらす。
      ja: |-
        コノハナの　吹く　草笛の　音は
        聞いた　ものを　不安に　させる。
        大木に　開いた　穴で　暮らす。
      ko: |-
        잎새코가 부는 풀피리 소리는
        듣는 이를 불안하게 만든다.
        큰 나무의 비어 있는 구멍에 산다.
      zh-Hant: |-
        長鼻葉居住在大樹上的洞穴裡，
        牠吹奏出的草笛聲
        會讓聽到的人感到不安。
      zh-Hans: |-
        长鼻叶居住在大树上的洞穴里，
        它吹奏出的草笛声
        会让听到的人感到不安。
      en: |-
        They live in holes bored in large trees. The sound
        of Nuzleaf’s grass flute fills listeners with dread.
      fr: |-
        Il vit dans les trous des grands arbres.
        Le sifflement qu’il produit avec sa feuille
        suffit à remplir ses adversaires d’effroi.
      de: |-
        Sie leben in Löchern, die sie in große Bäume
        gebohrt haben. Der Ton ihrer Grasflöten erfüllt
        Zuhörer mit Unruhe.
      es: |-
        Vive en las oquedades de los árboles grandes.
        El sonido que emite al usar la hoja de la cabeza
        como flauta asusta a quienes lo escuchan.
      it: |-
        Vive in buchi scavati in grandi alberi. Il suono
        del suo flauto di foglia inquieta chi lo ascolta.
