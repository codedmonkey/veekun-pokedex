    x:
      ja-Hrkt: |-
        からだは　なないろに　かがやき
        とんだあとに　にじが　できると
        しんわに　のこされている　ポケモン。
      ja: |-
        体は　七色に　輝き
        飛んだあとは　虹が　できると
        神話に　残されている　ポケモン。
      ko: |-
        몸은 일곱 빛으로 빛나고
        날아간 자리에는 무지개가 생긴다는
        신화 속에 남아 있는 포켓몬이다.
      en: |-
        A legend says that its body glows in seven colors.
        A rainbow is said to form behind it when it flies.
      fr: |-
        Son corps brille des sept couleurs de l’arc-en-ciel,
        arc-en-ciel qui se constitue derrière lui quand il vole.
      de: |-
        Sein Körper soll in sieben Farben leuchten. Im Flug
        zieht es einen Regenbogen hinter sich her.
      es: |-
        Cuenta la leyenda que brilla en siete colores. Dicen
        que deja un arcoíris tras de sí al volar.
      it: |-
        Narra la leggenda che il suo corpo brilli di sette
        colori. Volando lascia un arcobaleno dietro di sé.
    'y':
      ja-Hrkt: |-
        こころただしき　トレーナーの　まえに
        なないろの　つばさを　ひからせながら
        すがたをあらわすと　つたえられる。
      ja: |-
        心正しき　トレーナーの　前に
        七色の　翼を　光らせながら
        姿を　現すと　伝えられる。
      ko: |-
        마음이 올바른 트레이너의 앞에
        무지개색의 날개를 빛내며
        모습을 드러낸다고 전해진다.
      en: |-
        It will reveal itself before a pure-hearted Trainer by
        shining its bright, rainbow-colored wings.
      fr: |-
        Il ne se montre qu’à un Dresseur au cœur pur en
        dévoilant ses magnifiques ailes colorées.
      de: |-
        Es wird sich dem Trainer offenbaren, der reinen
        Herzens ist, und ihm seine bunten Schwingen zeigen.
      es: |-
        Se revelará ante Entrenadores de corazón puro
        mostrando sus brillantes alas arcoíris.
      it: |-
        Può mostrarsi a un Allenatore puro di cuore spiegando
        le ali, che hanno i colori dell’arcobaleno.
    omega-ruby:
      ja-Hrkt: |-
        ひかりの　あたる　かくどに　よって　なないろに
        かがやく　ハネは　しあわせを　もたらすと　いう。
        にじの　ふもとに　すむと　いわれている。
      ja: |-
        光の　当たる　角度に　よって　七色に
        輝く　ハネは　幸せを　もたらすと　いう。
        虹の　ふもとに　すむと　いわれている。
      ko: |-
        빛이 닿는 각도에 따라 일곱 빛깔로
        반짝이는 깃털은 행복을 가져다준다고 한다.
        무지개 끝에 산다고 전해진다.
      en: |-
        Ho-Oh’s feathers glow in seven colors depending on the angle
        at which they are struck by light. These feathers are said to
        bring happiness to the bearers. This Pokémon is said to live at
        the foot of a rainbow.
      fr: |-
        Les plumes de Ho-Oh brillent de sept couleurs selon
        l’orientation de son corps par rapport à la lumière.
        On raconte que ces plumes portent bonheur. On dit
        aussi que ce Pokémon vit au pied d’un arc-en-ciel.
      de: |-
        Ho-Ohs Federn leuchten in sieben Farben, je nachdem aus
        welchem Winkel das Licht auf sie fällt. Die Federn sollen ihrem
        Besitzer Glück bringen. Dieses Pokémon lebt am Fuße eines
        Regenbogens.
      es: |-
        El plumaje de Ho-Oh contiene siete colores que pueden
        apreciarse según el ángulo desde el que les dé la luz. Dicen
        que sus plumas dan felicidad a quienes las llevan y, también,
        que este Pokémon vive a los pies del arco iris.
      it: |-
        Il piumaggio di Ho-Oh brilla in sette colori a seconda
        dell’angolazione dei raggi luminosi. Si dice che le sue
        piume portino felicità a chi le possiede. Si narra che viva
        ai piedi di un arcobaleno.
    alpha-sapphire:
      ja-Hrkt: |-
