scrafty:
  base_happiness: 50
  capture_rate: 90
  color: red
  egg_groups:
    - ground
    - dragon
  evolution_chain: scraggy
  evolves_from: scraggy
  flavor_text:
    black:
      en: |-
        Groups of them beat up anything
        that enters their territory. Each can
        spit acidic liquid from its mouth.
      fr: |-
        Ils se regroupent pour rosser ceux
        qui pénètrent sur leur territoire.
        Ils crachent un venin corrosif.
    white:
      en: |-
        It can smash concrete blocks with its
        kicking attacks. The one with the biggest
        crest is the group leader.
      fr: |-
        La plus grande crête détermine le
        meneur du groupe. Il détruit des
        blocs de béton à coups de pied.
    black-2:
      en: |-
        It pulls up its shed skin to protect
        itself while it kicks. The bigger the
        crest, the more respected it is.
    white-2:
      en: |-
        It pulls up its shed skin to protect
        itself while it kicks. The bigger the
        crest, the more respected it is.
    x:
      ja-Hrkt: |-
        だっぴした　かわを　ずりあげて
        ダメージを　へらしつつ　キック！
        とさかが　おおきいほど　えらそうだ。
      ja: |-
        脱皮した　皮を　ずりあげて
        ダメージを　減らしつつ　キック！
        とさかが　大きいほど　偉そうだ。
      ko: |-
        탈피한 가죽을 끌어 올려
        데미지를 줄이면서 킥!
        볏이 클수록 거만하다.
      en: |-
        It pulls up its shed skin to protect itself while
        it kicks. The bigger the crest, the more respected
        it is.
      fr: |-
        Son baggy de peau le protège quand il donne
        des coups de pied. Les meneurs sont ceux qui ont
        la plus grande crête.
      de: |-
        Es wehrt Angriffe mit seiner alten Haut ab
        und kontert mit Tritten. Sein Ego entspricht
        der Größe seines Kamms.
      es: |-
        Se protege de los ataques con la muda de su piel
        mientras reparte patadas. Cuanto mayor es su cresta,
        más se le respeta.
      it: |-
        Quando tira calci, si protegge dai danni con la pelle
        della muta. Più grande è la cresta e più arie si dà.
    'y':
      ja-Hrkt: |-
        とさかの　おおきさで　グループの
        リーダーを　きめる。キックこうげきで
        コンクリートブロックを　はかいする。
      ja: |-
        トサカの　大きさで　グループの
        リーダーを　決める。キック攻撃で
        コンクリートブロックを　破壊する。
      ko: |-
        볏의 크기로 그룹의
        리더를 정한다. 발차기로
        콘크리트 블록을 파괴한다.
      en: |-
        It can smash concrete blocks with its kicking
        attacks. The one with the biggest crest is the
        group leader.
      fr: |-
        La plus grande crête détermine le meneur du groupe.
        Il détruit des blocs de béton à coups de pied.
      de: |-
        Wählt seinen Anführer über die Größe des Kamms
        auf dem Kopf. Ein Tritt von ihm reicht,
        um Betonblöcke zu zertrümmern.
      es: |-
        El líder del grupo es aquel cuya cresta es mayor.
        Es capaz de romper bloques de cemento con sus
        potentes patadas.
      it: |-
        Il capo del gruppo viene scelto in base alla grandezza
        della cresta. Spacca blocchi di cemento con dei calci.
    omega-ruby:
      ja-Hrkt: |-
        だっぴした　かわを　ずりあげて
        ダメージを　へらしつつ　キック！
        とさかが　おおきいほど　えらそうだ。
      ja: |-
        脱皮した　皮を　ずりあげて
        ダメージを　減らしつつ　キック！
        とさかが　大きいほど　偉そうだ。
      ko: |-
        탈피한 가죽을 끌어 올려
        데미지를 줄이면서 킥!
        볏이 클수록 거만하다.
      en: |-
        It pulls up its shed skin to protect itself while
        it kicks. The bigger the crest, the more respected
        it is.
      fr: |-
        Son baggy de peau le protège quand il donne des coups
        de pied. Les meneurs sont ceux qui ont la plus grande crête.
      de: |-
        Es wehrt Angriffe mit seiner alten Haut ab und kontert mit
        Tritten. Sein Ego entspricht der Größe seines Kamms.
      es: |-
        Se protege de los ataques con la muda de su piel mientras
        reparte patadas. Cuanto mayor es su cresta, más se le
        respeta.
      it: |-
        Quando tira calci, si protegge dai danni con la pelle
        della muta. Più grande è la cresta e più arie si dà.
    alpha-sapphire:
      ja-Hrkt: |-
        とさかの　おおきさで　グループの
        リーダーを　きめる。キックこうげきで
        コンクリートブロックを　はかいする。
      ja: |-
        トサカの　大きさで　グループの
        リーダーを　決める。キック攻撃で
        コンクリートブロックを　破壊する。
      ko: |-
        볏의 크기로 그룹의
        리더를 정한다. 발차기로
        콘크리트 블록을 파괴한다.
      en: |-
        It can smash concrete blocks with its kicking
        attacks. The one with the biggest crest is the
        group leader.
      fr: |-
        La plus grande crête détermine le meneur du groupe.
        Il détruit des blocs de béton à coups de pied.
      de: |-
        Wählt seinen Anführer über die Größe des Kamms auf dem
        Kopf. Ein Tritt von ihm reicht, um Betonblöcke zu zertrümmern.
      es: |-
        El líder del grupo es aquel cuya cresta es mayor. Es capaz
        de romper bloques de cemento con sus potentes patadas.
      it: |-
        Il capo del gruppo viene scelto in base alla grandezza della
        cresta. Spacca blocchi di cemento con dei calci.
    ultra-sun:
      ja-Hrkt: |-
        そぼうだが　じぶんの　かぞくや
        むれのなかまや　なわばりを　とっても
        たいせつにしている　ポケモンなのだ。
      ja: |-
        粗暴だが　自分の　家族や
        群れの仲間や　縄張りを　とっても
        大切にしている　ポケモンなのだ。
      ko: |-
        거칠고 난폭하지만, 자신의 가족과
        무리 동료의 영역을 매우
        소중히 여기는 포켓몬이다.
      zh-Hant: |-
        性情很粗暴，但牠是一種
        對自己的家族、群體的夥伴
        以及地盤十分重視的寶可夢。
      zh-Hans: |-
        性格粗鲁，但是对于自己的家族、
        群体的伙伴和领地，非常重视。
      en: |-
        This Pokémon may be rude, but it takes very
        good care of its family, its friends, and its turf.
      fr: |-
        Ses airs de gros dur cachent en fait un grand
        cœur dévoué à sa famille, sa bande et
        son territoire.
      de: |-
        Diesem ungestümen Pokémon liegen Freunde,
        Familie und Revier sehr am Herzen.
      es: |-
        A pesar de su apariencia chulesca, se preocupa
        mucho por los miembros de su familia, el resto
        del grupo y su territorio.
      it: |-
        È un Pokémon violento, ma al tempo stesso
        molto dedito alla famiglia, ai membri del proprio
        gruppo e al suo territorio.
    ultra-moon:
      ja-Hrkt: |-
        つばを　はいて　あいてを　ちょうはつ。
        きまった　なわばりを　もっており
        いっしょう　そこを　はなれず　すごす。
      ja: |-
        唾を　吐いて　相手を　挑発。
        決まった　縄張りを　もっており
        一生　そこを　離れず　過ごす。
      ko: |-
        침을 뱉어서 상대를 도발한다.
        정해진 영역을 가지고 있으며
        평생 그곳을 벗어나지 않고 산다.
      zh-Hant: |-
        會吐口水來挑釁對手。
        有著固定的地盤，會待在
        裡頭度過一生，永不離開。
      zh-Hans: |-
        吐出唾沫挑衅对手。
        有着固定的领地，
        会在那儿度过一生，永不离开。
      en: |-
        It taunts its opponents by spitting. It has a
        certain territory that it never leaves its whole
        life long.
      fr: |-
        Il provoque ses ennemis en crachant.
        Il passe toute sa vie sans s’aventurer hors
        des frontières bien définies de son territoire.
      de: |-
        Es provoziert Gegner, indem es sie anspuckt.
        Jedes Exemplar besitzt sein eigenes Revier,
        das es niemals verlässt.
      es: |-
        Provoca a su rival escupiéndole. No se aventura
        fuera de su propio territorio, donde pasa toda la
        vida.
      it: |-
        Provoca il nemico sputandogli addosso.
        Quando conquista un territorio, non lo
        abbandona più per tutta la vita.
    sword:
      ja-Hrkt: |-
        やるきの　なさげな　キックは
        ローブシンの　もつ　コンクリートも
        くだくほどの　はかいりょく。
      ja: |-
        やる気の　なさげな　キックは
        ローブシンの　もつ　コンクリートも
        砕くほどの　破壊力。
      ko: |-
        의욕이 없어 보이는 킥은
        노보청이 들고 있는 콘크리트도
        부술 정도의 파괴력을 지녔다.
      zh-Hant: |-
        牠看似無精打采的踢擊
        其實擁有足以擊碎修建老匠
        手中混凝土的破壞力。
      zh-Hans: |-
        它看似无精打采的踢击
        其实拥有足以击碎修建老匠
        手中混凝土的破坏力。
      en: |-
        As halfhearted as this Pokémon’s kicks may seem,
        they pack enough power to shatter Conkeldurr’s
        concrete pillars.
      fr: |-
        Son coup de pied nonchalant possède une force
        de destruction si grande qu’il peut briser
        les piliers en béton de Bétochef.
      de: |-
        Selbst seine halbherzigen Tritte sind stark
        genug, um die Betonpfeiler eines Meistagrif
        zu zertrümmern.
      es: |-
        Las patadas que propina con aparente desgana
        poseen una fuerza capaz de destrozar incluso los
        pilares de hormigón que llevan los Conkeldurr.
      it: |-
        Pur se tirati con aria svogliata, i suoi calci sono
        così distruttivi da sgretolare perfino i pilastri di
        cemento di Conkeldurr.
    shield:
      ja-Hrkt: |-
        とても　あらっぽい　せいかくだが
        かぞくや　なかまや　なわばりは
        たいせつにする　ところがある。
      ja: |-
        とても　荒っぽい　性格だが
        家族や　仲間や　縄張りは
        大切にする　ところがある。
      ko: |-
        매우 거친 성격이지만
        가족과 동료와 영역은
        소중히 여긴다.
      zh-Hant: |-
        雖然性情非常粗魯，
        但也有重視家族、
        夥伴和地盤的一面。
      zh-Hans: |-
        虽然性格非常粗鲁，
        但也有重视家族、
        伙伴和领地的另一面。
      en: |-
        While mostly known for having the temperament
        of an aggressive ruffian, this Pokémon takes very
        good care of its family, friends, and territory.
      fr: |-
        Il est de nature violente, mais au fond de lui,
        il tient à sa famille, à ses amis et à son territoire.
      de: |-
        Es gibt sich gerne wild, aber seine Familie, seine
        Kameraden und sein Revier liegen ihm sehr am
        Herzen.
      es: |-
        A pesar de su carácter agresivo, se muestra muy
        protector con sus allegados y su territorio.
      it: |-
        Ha un’indole estremamente aggressiva, ma se
        si tratta della sua famiglia, dei suoi compagni e
        del suo territorio, diventa molto protettivo.
