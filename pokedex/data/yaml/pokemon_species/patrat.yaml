patrat:
  base_happiness: 70
  capture_rate: 255
  color: brown
  egg_groups:
    - ground
  evolution_chain: patrat
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        Using food stored in cheek pouches,
        they can keep watch for days. They use
        their tails to communicate with others.
      fr: |-
        Ils stockent à manger dans leurs
        bajoues et font le guet indéfiniment. Ils
        se font des signes en remuant la queue.
    white:
      en: |-
        Extremely cautious, they take shifts to
        maintain a constant watch of their nest.
        They feel insecure without a lookout.
      fr: |-
        Ils sont très inquiets et se relaient
        pour surveiller le territoire autour de
        leur nid. Sans guetteurs, ils ont peur.
    black-2:
      en: |-
        Extremely cautious, one of them
        will always be on the lookout, but it
        won’t notice a foe coming from behind.
    white-2:
      en: |-
        Extremely cautious, one of them
        will always be on the lookout, but it
        won’t notice a foe coming from behind.
    x:
      ja-Hrkt: |-
        ほほの　ふくろに　エサを　ためこみ
        なんにちも　みはりを　つづける。
        しっぽで　なかまに　あいずする。
      ja: |-
        ほほの　袋に　エサを　ためこみ
        何日も　見張りを　続ける。
        尻尾で　仲間に　合図する。
      ko: |-
        볼의 주머니에 먹이를 모아두고
        며칠이고 망보기를 계속한다.
        꼬리로 동료에게 신호한다.
      en: |-
        Using food stored in cheek pouches, they can keep
        watch for days. They use their tails to communicate
        with others.
      fr: |-
        Ils stockent à manger dans leurs bajoues et font
        le guet indéfiniment. Ils se font des signes en remuant
        la queue.
      de: |-
        Hortet in seinen Backentaschen Futter, um tagelang
        Wache stehen zu können, und gibt Kameraden über
        seine Rute Signale.
      es: |-
        Almacena víveres en unas bolsas en sus mofletes y
        vigila durante días. Hace señales con la cola a sus
        compañeros.
      it: |-
        Immagazzina cibo nelle guance e monta la guardia
        per molti giorni di seguito. Usa la coda per fare
        segnali ai compagni.
    'y':
      ja-Hrkt: |-
        けいかいしんが　つよく　かならず
        いっぴきは　みはりを　しているのだが
        うしろからの　てきには　きづかない。
      ja: |-
        警戒心が　強く　かならず
        １匹は　見張りを　しているのだが
        後ろからの　敵には　気づかない。
      ko: |-
        경계심이 강해서 반드시
        한 마리는 망을 보고 있으나
        뒤에서 오는 상대는 알아차리지 못한다.
      en: |-
        Extremely cautious, one of them will always be on
        the lookout, but it won’t notice a foe coming
        from behind.
      fr: |-
        Très prudent, il surveille attentivement son territoire,
        mais oublie souvent de regarder derrière lui.
      de: |-
        Eines dieser vorsichtigen Pokémon steht immer vor
        ihrem Bau Wache. Nähert sich jedoch ein Feind
        von hinten, ist es aus.
      es: |-
        Aunque es un Pokémon muy precavido y siempre hay
        uno montando guardia, si se acercan por detrás, no se
        dará cuenta.
      it: |-
        Sono molto guardinghi e almeno uno del branco è
        sempre di guardia. Non vedono però il nemico se li
        attacca da dietro.
    omega-ruby:
