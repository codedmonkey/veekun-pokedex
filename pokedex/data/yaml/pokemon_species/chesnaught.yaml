chesnaught:
  base_happiness: 70
  capture_rate: 45
  color: green
  egg_groups:
    - ground
  evolution_chain: chespin
  evolves_from: quilladin
  flavor_text:
    x:
      ja-Hrkt: |-
        たいあたりで　５０トンの　せんしゃを
        ひっくりかえす　パワー。じぶんが
        たてと　なって　なかまを　まもる。
      ja: |-
        体当たりで　５０トンの　戦車を
        ひっくり返す　パワー。
        自分が　盾となって　仲間を　守る。
      ko: |-
        몸통박치기로 50톤 전차를
        뒤집는 파워를 지녔다. 자신이
        방패가 되어 동료를 지킨다.
      en: |-
        Its Tackle is forceful enough to flip a 50-ton tank.
        It shields its allies from danger with its own body.
      fr: |-
        Il est si puissant qu’il pourrait renverser un char de
        50 t d’un seul assaut. Il se sert de son corps comme
        d’un bouclier pour protéger ses alliés.
      de: |-
        Es ist so stark, dass es selbst 50 t schwere Panzer
        umkippen kann. Es schützt seine Artgenossen,
        indem es sich ihnen als Schild anbietet.
      es: |-
        Su fuerza es tal que, de un empellón, puede hacer
        volcar un tanque de 50 toneladas. Protege a sus
        aliados cuando hace de escudo.
      it: |-
        Attaccando può rovesciare un carro armato da 50 t.
        Protegge gli alleati facendo loro scudo con il proprio
        corpo.
    'y':
      ja-Hrkt: |-
        かおの　まえで　こぶしを　あわせて
        ぼうぎょの　ポーズを　とると
        ばくだんの　ちょくげきも　たえる。
      ja: |-
        顔の　前で　こぶしを　合わせて
        防御の　ポーズを　とると
        爆弾の　直撃も　耐える。
      ko: |-
        얼굴 앞에 주먹을 맞대어
        방어 포즈를 취하면
        폭탄의 직격도 견뎌낸다.
      en: |-
        When it takes a defensive posture with its fists
        guarding its face, it could withstand a bomb blast.
      fr: |-
        Il se défend en joignant ses poings devant son visage.
        Dans cette posture, il peut même résister à l’onde de
        choc d’une explosion.
      de: |-
        Wenn es seine Fäuste vors Gesicht hält und so eine
        Verteidigungshaltung einnimmt, kann es selbst eine
        Explosion überstehen.
      es: |-
        Cuando adopta una postura defensiva juntando
        ambos puños delante de la cara, es capaz de
        resistir incluso el impacto directo de una bomba.
      it: |-
        In posizione difensiva, con i pugni in guardia, è in
        grado di resistere persino a un’esplosione diretta.
    omega-ruby:
      ja-Hrkt: |-
        たいあたりで　５０トンの　せんしゃを
        ひっくりかえす　パワー。じぶんが
