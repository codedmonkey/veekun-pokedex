coalossal:
  base_happiness: 50
  capture_rate: 45
  color: black
  egg_groups:
    - mineral
  evolution_chain: rolycoly
  evolves_from: carkol
  flavor_text:
    sword:
      ja-Hrkt: |-
        ふだんは　おだやかだが　にんげんが
        こうざんを　あらすと　いかりくるい
        １５００どの　ほのおで　やきつくす。
      ja: |-
        普段は　穏やかだが　人間が
        鉱山を　荒らすと　怒りくるい
        １５００度の　炎で　焼きつくす。
      ko: |-
        평소에는 온화하지만 인간이
        광산을 훼손시키면 격분해서
        1500도의 불꽃으로 태워버린다.
      zh-Hant: |-
        平時性情溫和，但在人類
        破壞礦山時會大發雷霆，
        用１５００度的大火將他們燒盡。
      zh-Hans: |-
        平时性情温和，但在人类
        破坏矿山时会大发雷霆，
        用１５００度的大火将他们烧尽。
      en: |-
        It’s usually peaceful, but the vandalism of mines
        enrages it. Offenders will be incinerated with
        flames that reach 2,700 degrees Fahrenheit.
      fr: |-
        Il est d’une nature paisible, mais si les humains
        tentent de piller ses mines, il enrage et brûle
        tout avec des flammes à 1 500 °C.
      de: |-
        Meist ist es friedfertig, aber wenn Menschen
        eine Mine zugrunde richten, sieht es rot und
        verbrennt sie mit 1 500 ºC heißen Flammen.
      es: |-
        Aunque es de carácter sereno, monta en cólera
        si ve a seres humanos dañando una mina y reduce
        todo a cenizas con sus llamas a 1500 °C.
      it: |-
        Di solito è tranquillo, ma se gli esseri umani
        danneggiano la sua miniera va su tutte le furie e
        brucia tutto emettendo fiamme a 1.500 ºC.
    shield:
      ja-Hrkt: |-
        たたかいになると　せきたんの　やまが
        まっかに　もえあがり　ひのこを
        まきちらして　しゅういを　こがす。
      ja: |-
        戦いになると　石炭の　山が
        真っ赤に　燃え上がり　火の粉を
        まき散らして　周囲を　焦がす。
      ko: |-
        싸우게 되면 석탄으로 된 산이
        새빨갛게 타올라 불똥을
        흩뿌려 주위를 태운다.
      zh-Hant: |-
        進入戰鬥狀態後，
        牠會把煤炭山燃燒得通紅，
        飛撒火花來燒焦四周。
      zh-Hans: |-
        进入战斗状态后，
        它会把煤炭山燃烧得通红，
        飞撒火花来烧焦四周。
      en: |-
        While it’s engaged in battle, its mountain of coal
        will burn bright red, sending off sparks that
        scorch the surrounding area.
      fr: |-
        Lorsqu’il s’engage dans un combat, son tas
        de charbon brûle et vire au rouge, ce qui répand
        de petites étincelles qui calcinent ce qui l’entoure.
      de: |-
        Kommt es zum Kampf, so lodert sein Kohleberg
        tiefrot auf und es sprüht glühende Funken, die
        seine Umgebung versengen.
      es: |-
        Cuando se enzarza en un combate, la montaña
        de carbón arde al rojo vivo y esparce chispas
        que calcinan todo lo que le rodea.
      it: |-
        Quando lotta, la montagna di carbone brucia
        con bagliori rossastri e sparge scintille che
        anneriscono tutta l’area circostante.
