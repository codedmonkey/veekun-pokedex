    x:
      ja-Hrkt: |-
        すごい　ちせいと　ひらめきを
        もっている。どんなときでも　あわてず
        さわがず　のんびりとしている。
      ja: |-
        すごい　知性と　ひらめきを
        持っている。どんなときでも　あわてず
        騒がず　のんびりとしている。
      ko: |-
        대단한 지성과 번뜩이는 재치를
        가지고 있다. 어떤 때라도 당황하거나
        소란 피우지 않고 느긋하게 있다.
      en: |-
        It has incredible intellect and intuition. Whatever
        the situation, it remains calm and collected.
      fr: |-
        D’une grande intelligence, il sait rester calme, même
        en situation stressante.
      de: |-
        Sein feines Gespür und Intellekt zeichnen es aus.
        Es bleibt in jeder Situation gelassen und besonnen.
      es: |-
        Su intelecto e intuición son increíbles. No pierde la
        compostura en ninguna situación.
      it: |-
        Dotato di incredibile intelligenza e intuito, sa restare
        calmo e padrone di sé in ogni situazione.
    'y':
      ja-Hrkt: |-
        かまれたとき　あたまに　しみこんだ
        どくそに　よって　ただならない
        のうりょくに　めざめた　ヤドン。
      ja: |-
        かまれたとき　頭に　染みこんだ
        毒素に　よって　ただならない
        能力に　目覚めた　ヤドン。
      ko: |-
        물렸을 때 머리에 깊게 스며든
        독소에 의해 심상치 않은
        능력에 눈을 뜬 야돈이다.
      en: |-
        When its head was bitten, toxins entered
        Slowpoke’s head and unlocked an
        extraordinary power.
      fr: |-
        Une fois sa tête mordue, des toxines ont envahi
        Ramoloss et lui ont conféré des pouvoirs immenses.
      de: |-
        Als Flegmon in den Kopf gebissen wurde, floss Gift
        in seinen Kopf und setzte eine gewaltige Kraft frei.
      es: |-
        Al ser mordido en la cabeza, Slowpoke absorbió unas
        toxinas que liberaron su oculto poder.
      it: |-
        Quando la testa di Slowpoke fu morsa, vi penetrarono
        delle tossine che produssero un enorme potere.
    omega-ruby:
      ja-Hrkt: |-
        せかいの　ふしぎを　かいめい　するため　まいにち
        けんきゅう　しているが　あたまの　シェルダーが
        はずれると　ぜんぶ　わすれてしまう　らしい。
      ja: |-
        世界の　不思議を　解明　するため　毎日
        研究　しているが　頭の　シェルダーが
        外れると　全部　忘れてしまう　らしい。
      ko: |-
        세계의 불가사의를 밝혀내기 위해 매일
        연구하고 있지만 머리에 있는 셀러가
        벗겨지면 전부 잊어버리는 것 같다.
      en: |-
        Slowking undertakes research every day in an effort to solve
        the mysteries of the world. However, this Pokémon apparently
        forgets everything it has learned if the Shellder on its head
        comes off.
      fr: |-
        Tous les jours, Roigada entreprend des recherches pour
        résoudre les mystères du monde. Cependant, ce Pokémon
        oublie tout ce qu’il a appris si le Kokiyas qui se trouve
        sur sa tête s’en va.
      de: |-
        Laschoking betreibt jeden Tag Forschung, um die Geheimnisse
        der Welt zu lüften. Dieses Pokémon vergisst aber alles, was es
        bereits herausgefunden hat, wenn das Muschas auf seinem
        Kopf abfällt.
      es: |-
        Slowking dedica cada día tiempo a investigar, en un intento
        por resolver los misterios del mundo. Aunque, según parece,
        a este Pokémon se le olvida todo lo que ha aprendido si se
        separa del Shellder que lleva en la cabeza.
      it: |-
        Ogni giorno Slowking cerca di comprendere e svelare i misteri
        del mondo. Tuttavia, pare che questo Pokémon dimentichi
        tutto ciò che ha imparato se perde lo Shellder che ha
        sul capo.
    alpha-sapphire:
      ja-Hrkt: |-
        せかいの　ふしぎを　かいめい　するため　まいにち
        けんきゅう　しているが　あたまの　シェルダーが
        はずれると　ぜんぶ　わすれてしまう　らしい。
      ja: |-
        世界の　不思議を　解明　するため　毎日
        研究　しているが　頭の　シェルダーが
        外れると　全部　忘れてしまう　らしい。
      ko: |-
        세계의 불가사의를 밝혀내기 위해 매일
        연구하고 있지만 머리에 있는 셀러가
        벗겨지면 전부 잊어버리는 것 같다.
      en: |-
        Slowking undertakes research every day in an effort to solve
        the mysteries of the world. However, this Pokémon apparently
        forgets everything it has learned if the Shellder on its head
        comes off.
      fr: |-
        Tous les jours, Roigada entreprend des recherches pour
        résoudre les mystères du monde. Cependant, ce Pokémon
        oublie tout ce qu’il a appris si le Kokiyas qui se trouve
        sur sa tête s’en va.
      de: |-
        Laschoking betreibt jeden Tag Forschung, um die Geheimnisse
        der Welt zu lüften. Dieses Pokémon vergisst aber alles, was es
        bereits herausgefunden hat, wenn das Muschas auf seinem
        Kopf abfällt.
      es: |-
        Slowking dedica cada día tiempo a investigar, en un intento
        por resolver los misterios del mundo. Aunque, según parece,
        a este Pokémon se le olvida todo lo que ha aprendido si se
        separa del Shellder que lleva en la cabeza.
      it: |-
        Ogni giorno Slowking cerca di comprendere e svelare i misteri
        del mondo. Tuttavia, pare che questo Pokémon dimentichi
        tutto ciò che ha imparato se perde lo Shellder che ha
        sul capo.
    sun:
      ja-Hrkt: |-
        かまれた　どくその　えいきょうで
        てんさいてき　ずのうの　もちぬしに。
        サイコパワーを　じざいに　あやつる。
      ja: |-
        噛まれた　毒素の　影響で
        天才的　頭脳の　持ち主に。
        サイコパワーを　自在に　操る。
      ko: |-
        물린 독소의 영향으로
        천재적인 두뇌를 가지게 되었다.
        사이코 파워를 자유자재로 다룬다.
      zh-Hant: |-
        受被咬到時的毒素影響，
        擁有天才的頭腦。
        能自由自在地操縱精神力量。
      zh-Hans: |-
        受被咬到的毒素影响，
        拥有天才的头脑。
        能自由自在地操纵精神力量。
      en: |-
        A poisonous bite reacted with its system,
        blessing it with the enhanced intellect of a
        genius. It has full control of its psychic powers.
      fr: |-
        Les toxines injectées dans son corps quand
        il s’est fait mordre ont fait de lui un génie.
        Ses pouvoirs psy ont été grandement amplifiés.
      de: |-
        Durch einen giftigen Biss wurde es zu einer
        wahren Intelligenzbestie. Es verfügt über
        Psycho-Kräfte.
      es: |-
        El veneno de Shellder le confiere una inteligencia
        brillante. Puede utilizar sus poderes psíquicos
        con gran destreza.
      it: |-
        Il morso velenoso di Shellder gli ha conferito
        un’intelligenza straordinaria. È in grado di usare
        i suoi poteri psichici con grande maestria.
    moon:
      ja-Hrkt: |-
        まよったら　ヤドキングにきけ　という
        ことわざが　のこる　ちいきも　あるほど
        かしこいことで　ゆうめい　なのだ。
      ja: |-
        迷ったら　ヤドキングに聞け　という
        ことわざが　残る　地域も　あるほど
        賢いことで　有名　なのだ。
      ko: |-
        갈피를 못 잡을 때는 야도킹에게 물어보라는
        속담이 남아있는 지역도 있을 정도로
        똑똑한 것으로 유명하다.
      zh-Hant: |-
        迷路就問呆呆王，
        也有地區流傳著這樣的俗語，
        可見牠因聰明而廣為人知。
      zh-Hans: |-
        迷路就问呆呆王，
        也有地区流传着这样的俗语，
        可见它因聪明而广为人知。
      en: |-
        This Pokémon is so famed for its intellect that a
        proverb still persists in some regions: “When in
        doubt, ask Slowking.”
      fr: |-
        Il est tellement intelligent qu’il existe un
        proverbe dans certaines régions qui dit :
        « Si tu ne sais pas, demande au Roigada. »
      de: |-
        Es ist so berühmt für seine Intelligenz, dass
        sich vielerorts das Sprichwort „Nicht verzagen,
        Laschoking fragen!“ durchgesetzt hat.
      es: |-
        Es muy famoso por su inteligencia y, en algunas
        regiones, hasta tienen un refrán que dice:
        “En caso de duda, pregúntale a Slowking”.
      it: |-
        È famoso per la sua grande intelligenza.
        In alcune regioni si dice comunemente:
        “Nel dubbio, chiedi a Slowking”.
    ultra-sun:
      ja-Hrkt: |-
        あたまの　なかでは　つねに　せかいを
        かえるような　アイデアが　わきだして
        いるが　ひらめくはじから　わすれる。
      ja: |-
        頭の　中では　常に　世界を
        変えるような　アイデアが　わきだして
        いるが　ひらめく端から　忘れる。
      ko: |-
        머릿속으로는 항상 세계를 바꿀
        정도의 아이디어가 넘쳐 흐르지만
        번뜩이는 순간 잊어버린다.
      zh-Hant: |-
        腦海中不停湧現各種
        足以改變世界的點子，
        但牠馬上就會忘了那些點子。
      zh-Hans: |-
        脑海中经常会涌现出一些
        像是改变世界的想法，
        但不久后会依次忘记。
      en: |-
        It’s constantly coming up with new ideas that
        would change the world, but as soon as it
        hits upon a new idea, it forgets it.
      fr: |-
        Il trouve tout le temps des idées formidables
        qui pourraient changer le monde, mais il les
        oublie dans la foulée.
      de: |-
        In seinem Kopf kommen ihm ständig große Ideen,
        die die Welt verändern könnten. Leider vergisst
        es sie jedoch viel zu schnell wieder.
      es: |-
        A menudo se le ocurren ideas geniales que
        cambiarían el mundo, pero tan pronto como las
        tiene se le olvidan.
      it: |-
        Ha sempre un sacco di idee che potrebbero
        cambiare il mondo, ma le dimentica un attimo
        dopo che gli sono venute in mente.
    ultra-moon:
      ja-Hrkt: |-
        うみの　けんじゃと　よばれる。
        ヤレユータンと　ちえくらべを　するが
        けっかは　だいたい　ひきわけ。
      ja: |-
        海の　賢者と　呼ばれる。
        ヤレユータンと　知恵比べを　するが
        結果は　だいたい　引き分け。
      ko: |-
        바다의 현자라고 불린다.
        하랑우탄과 지혜를 겨루지만
        결과는 대체로 무승부다.
      zh-Hant: |-
        被稱為大海的賢者。
        會與智揮猩比拼智力，
        但結果大多是不分上下。
      zh-Hans: |-
        被称为大海的贤者。
        虽然会去和智挥猩比拼智力，
        但结果多是不分上下。
      en: |-
        It’s called “the sage of the sea.” It engages in
        battles of wits with Oranguru, but the result is
        usually a draw.
      fr: |-
        On l’appelle « le Grand Sage des mers ».
        Ses fréquents concours d’intelligence avec
        Gouroutan se terminent souvent par une égalité.
      de: |-
        Man nennt es auch den „Weisen des Meeres“.
        Es liefert sich mit Kommandutan epische
        Quiz-Duelle, die zumeist im Gleichstand enden.
      es: |-
        Lo llaman el Sabio del Mar. Disfruta librando
        duelos de inteligencia con Oranguru que suelen
        terminar en tablas.
      it: |-
        È chiamato “il saggio del mare”. Rivaleggia per
        intelligenza con Oranguru e quasi sempre
        le loro sfide finiscono in parità.
    sword:
      ja-Hrkt: |-
        シェルダーの　どくそが　ヤドンの
        のうみそを　かけめぐり　きせきてきに
        ひめた　ちのうを　かくせいさせた。
      ja: |-
        シェルダーの　毒素が　ヤドンの
        脳みそを　駆けめぐり　奇跡的に
        秘めた　知能を　覚醒させた。
      ko: |-
        셀러의 독소가 야돈의
        뇌를 돌아다니면서 숨겨진 지능을
        기적적으로 각성시켰다.
      zh-Hant: |-
        大舌貝的毒素竄遍了
        呆呆獸的大腦，奇蹟似地
        使牠潛藏的智能覺醒了。
      zh-Hans: |-
        大舌贝的毒素流遍了
        呆呆兽的脑子，奇迹般地
        唤醒了它潜在的智慧。
      en: |-
        Miraculously, this former Slowpoke’s latent
        intelligence was drawn out when Shellder poison
        raced through its brain.
      fr: |-
        Les toxines du Kokiyas ont imprégné le cerveau
        du Ramoloss, réveillant en lui une intelligence
        insoupçonnée, comme par miracle.
      de: |-
        Das Gift von Muschas drang in Flegmons Gehirn
        ein und erweckte dabei wie durch ein Wunder
        bisher verborgene Intelligenz in ihm.
      es: |-
        Las toxinas del Shellder impregnaron el cerebro
        del anfitrión y despertaron el increíble intelecto
        oculto que poseía Slowpoke.
      it: |-
        Le tossine secrete da Shellder sono entrate in
        circolo nel cervello di Slowpoke con il prodigioso
        risultato di risvegliare capacità intellettive latenti.
    shield:
      ja-Hrkt: |-
        たずねれば　どんな　なんだいでも
        かいけつしてくれるが　ヤドキングの
        ことばは　だれも　りかいできない。
      ja: |-
        尋ねれば　どんな　難題でも
        解決してくれるが　ヤドキングの
        言葉は　だれも　理解できない。
      ko: |-
        아무리 어려운 문제를 물어봐도
        모두 해결해주지만
        그 누구도 야도킹의 말을 이해하지 못한다.
      zh-Hant: |-
        只要開口提問，任何難題
        牠都會幫忙解開，但是無人
        能夠理解呆呆王的語言。
      zh-Hans: |-
        虽然无论向呆呆王提出
        什么难题它都会帮忙解决，
        但是谁都无法理解它的语言。
      en: |-
        Slowking can solve any problem presented to it,
        but no one can understand a thing Slowking says.
      fr: |-
        Il est capable de résoudre tous les problèmes
        qu’on lui présente, mais personne ne parvient
        à comprendre ce qu’il dit.
      de: |-
        Bittet man es darum, löst es jedes noch so
        schwere Problem für einen. Jedoch ist niemand in
        der Lage, Laschokings Sprache zu verstehen.
      es: |-
        Es capaz de dar respuesta a cualquier cuestión
        que se le formule, pero, por desgracia, nadie
        logra descifrar una sola palabra de lo que dice.
      it: |-
        È in grado di risolvere qualsiasi problema
        gli venga sottoposto, ma nessuno riesce a
        comprendere le sue parole.
