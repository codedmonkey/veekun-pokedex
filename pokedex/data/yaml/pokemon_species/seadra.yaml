      zh-Hans: |-
        摸它的背鳍会导致麻痹。
        为了避免在睡觉时被水冲走，
        它会用尾巴缠住珊瑚。
      en: |-
        Touching the back fin causes numbness. It hooks
        its tail to coral to stay in place while sleeping.
      fr: |-
        Le contact de ses nageoires dorsales engourdit.
        Il ancre sa queue au corail quand il dort pour
        éviter que le courant ne l’emporte.
      de: |-
        Eine Berührung seiner Rückenflossen betäubt. Es
        klammert sich mit dem Schwanz an Korallen fest,
        um sich im Schlaf vor der Strömung zu schützen.
      es: |-
        Tocar sus aletas dorsales causa entumecimiento.
        Mientras duerme se agarra al coral con la cola
        para que no se lo lleve la corriente.
      it: |-
        Il contatto con la sua pinna dorsale causa
        stordimento. Dorme con la coda avvolta intorno
        al corallo per non farsi portare via dalla corrente.
    sword:
      ja-Hrkt: |-
        オスが　こどもを　そだてる。
        こそだてちゅうは　せなかの　トゲの
        どくそが　つよく　こくなるのだ。
      ja: |-
        オスが　子どもを　育てる。
        子育て中は　背中の　トゲの　毒素が
        強く　濃くなるのだ。
      ko: |-
        수컷이 새끼를 기른다.
        새끼를 기르는 동안 등에 난
        가시의 독소는 강해지고 짙어진다.
      zh-Hant: |-
        是由雄性來養育孩子。
        在育兒時，背上刺的
        毒素會變得更強更濃。
      zh-Hans: |-
        由雄性来抚育孩子。
        育儿时，背上刺的毒素
        浓度会增加，变得更烈。
      en: |-
        It’s the males that raise the offspring. While
        Seadra are raising young, the spines on their
        backs secrete thicker and stronger poison.
      fr: |-
        Les mâles s’occupent des petits, et tant qu’ils en
        ont à élever, le venin contenu dans leurs épines
        dorsales devient beaucoup plus fort.
      de: |-
        Männlichen Seemon obliegt es, den Nachwuchs
        großzuziehen. In diesem Zeitraum ist das Gift in
        ihren Rückenstacheln stärker und dickflüssiger.
      es: |-
        En esta especie, es el macho quien se ocupa de
        la prole. Durante la época de cría, el veneno de
        las púas de su espalda se vuelve más potente.
      it: |-
        Il maschio si occupa dei piccoli. Quando li alleva,
        il veleno degli aculei dorsali diventa denso e
        potente.
    shield:
      ja-Hrkt: |-
        ほそい　くちだが　きゅういんりょくは
        つよい。　くちより　おおきな　エサも
        いっしゅんで　すいこみ　たべるぞ。
      ja: |-
        細い　口だが　吸引力は　強い。
        口より　大きな　エサも
        一瞬で　吸いこみ　食べるぞ。
      ko: |-
        입은 가늘지만 흡인력은 강하다.
        입보다 큰 먹이도
        순식간에 빨아들여 먹는다.
      zh-Hant: |-
        嘴部雖然細，但吸力卻很強。
        就算是比嘴還要大的食物，
        也都能瞬間吸進口裡吃掉。
      zh-Hans: |-
        嘴巴虽然细，吸引力却很强。
        就算是比嘴巴还大的猎物，
        也能一瞬间吸进嘴里吃掉。
      en: |-
        Seadra’s mouth is slender, but its suction power
        is strong. In an instant, Seadra can suck in food
        that’s larger than the opening of its mouth.
      fr: |-
        Sa puissance de succion est si forte qu’il peut
        aspirer en un instant ses proies pour les manger,
        même si elles sont plus grosses que sa bouche.
      de: |-
        Selbst Beute, die größer als sein kleiner Mund ist,
        kann es dank dessen starker Saugkraft im Nu
        einsaugen und verspeisen.
      es: |-
        Su estrecho morro posee tal fuerza de succión
        que es capaz de aspirar presas de mayor tamaño
        y engullirlas enteras.
      it: |-
        Nonostante la misura ridotta, la sua bocca
        ha un potere aspirante tale da permettergli di
        risucchiare e inghiottire grosse prede all’istante.
