    x:
      ja-Hrkt: |-
        うかつに　さわろうとすると
        からだじゅうに　はえる　トゲに
        さされて　きぜつすることも　ある。
      ja: |-
        うかつに　触ろうとすると
        体中に　生える　トゲに　刺されて
        気絶することもある。
      ko: |-
        섣불리 만지려고 하면
        몸 전체에서 돋아나는 가시에
        찔려 기절할 수도 있다.
      en: |-
        Its body bristles with sharp spikes. Carelessly trying
        to touch it could cause fainting from the spikes.
      fr: |-
        Son corps est recouvert de pointes tranchantes.
        Il faut la plus grande attention pour le saisir, sous
        peine de se faire piquer.
      de: |-
        Sein Körper ist mit scharfen Stacheln gespickt.
        Wenn man sorglos ist und es berührt, kann man
        durch die Stacheln bewusstlos werden.
      es: |-
        Las afiladas púas que le recubren el cuerpo se le
        erizan y pueden causar el debilitamiento con solo
        tocarlo.
      it: |-
        Ha il corpo ispido di aculei pungenti. Un contatto
        fortuito può causare uno svenimento.
    'y':
      ja-Hrkt: |-
        ハネと　しっぽを　すばやく　うごかし
        まえを　むいたまま　うしろへ
        およぐことも　できる　ポケモン。
      ja: |-
        羽と　尻尾を　素早く　動かし
        前を　向いたまま　後ろへ
        泳ぐこともできる　ポケモン。
      ko: |-
        날개와 꼬리를 재빠르게 움직여
        앞을 향한 채 뒤로
        헤엄칠 수 있는 포켓몬이다.
      en: |-
        It is capable of swimming backwards by rapidly
        flapping its winglike pectoral fins and stout tail.
      fr: |-
        Il peut nager à l’envers en agitant ses petites
        nageoires pectorales.
      de: |-
        Dieses Pokémon kann rückwärts schwimmen,
        indem es Flügel und Schwanz als Flossen einsetzt.
      es: |-
        Puede nadar hacia atrás moviendo rápidamente las
        aletas pectorales y la robusta cola que tiene.
      it: |-
        È capace di nuotare all’indietro agitando rapidamente
        le pinne pettorali e la robusta coda.
    omega-ruby:
      ja-Hrkt: |-
        サンゴの　えだの　すきまに　もぐって　ねむる。
        シードラに　きづかず　サンゴを　とろうとして
        どくの　トゲに　さされてしまう　ことが　ある。
      ja: |-
        サンゴの　枝の　すき間に　潜って　眠る。
        シードラに　気づかず　サンゴを　取ろうとして
        毒の　トゲに　刺されてしまう　ことが　ある。
      ko: |-
        산호 가지 사이로 들어가 잠잔다.
        시드라가 있는 줄 모르고 산호를
        잡으려다 독가시에 찔리곤 한다.
      en: |-
        Seadra sleeps after wriggling itself between the branches of
        coral. Those trying to harvest coral are occasionally stung by
        this Pokémon’s poison barbs if they fail to notice it.
      fr: |-
        Hypocéan s’accroche aux récifs de corail avant de s’endormir.
        Les pêcheurs de coraux se font parfois piquer par les aiguillons
        de ce Pokémon lorsqu’ils ne font pas attention.
      de: |-
        Sobald sich Seemon um eine Koralle gewickelt hat, schläft es.
        Von Zeit zu Zeit werden Menschen durch die Widerhaken
        dieses Pokémon verletzt, wenn sie versuchen, Korallen zu
        ernten und es dabei nicht bemerken.
      es: |-
        Seadra se echa a dormir tras abrirse un hueco entre las ramas
        de los corales. Los pescadores de coral suelen pincharse con
        las púas venenosas de estos Pokémon si no los ven.
      it: |-
        Seadra dorme dopo essersi sistemato tra i rami di un corallo.
        I cercatori di corallo spesso rischiano di essere punti dai suoi
        aculei velenosi se non si accorgono della sua presenza.
    alpha-sapphire:
      ja-Hrkt: |-
        からだを　かいてんさせて　うずまきを　つくる。
        ぎょせんも　のみこまれる　ほどの　げきりゅうで
        えものを　よわらせてから　まるごと　のみこむ。
      ja: |-
        体を　回転させて　渦巻きを　つくる。
        漁船も　のみこまれる　ほどの　激流で
        獲物を　弱らせてから　丸ごと　のみこむ。
      ko: |-
        몸을 회전시켜 소용돌이를 만든다.
        어선도 집어삼킬 만한 격류로
        먹이를 약하게 만들고 통째로 삼킨다.
      en: |-
        Seadra generates whirlpools by spinning its body.
        The whirlpools are strong enough to swallow even
        fishing boats. This Pokémon weakens prey with
        these currents, then swallows it whole.
      fr: |-
        Hypocéan déclenche des tourbillons en faisant tournoyer
        son corps. Ces tourbillons sont assez puissants pour engloutir
        des bateaux de pêche. Ce Pokémon affaiblit sa proie grâce à
        ces courants, puis l’avale en une bouchée.
      de: |-
        Seemon erzeugt Strudel, indem es sich schnell um die eigene
        Achse dreht. Diese Strudel können sogar Fischerboote in die
        Tiefe reißen. Damit schwächt es Beute, bevor es sie im Ganzen
        verschlingt.
      es: |-
        Seadra gira sobre sí mismo y crea unos remolinos lo
        suficientemente fuertes como para engullir barcos de pesca.
        Este Pokémon aprovecha las corrientes que crea para debilitar
        a su presa y tragársela de una vez.
      it: |-
        Roteando turbinosamente, Seadra genera vortici così forti da
        riuscire a inghiottire persino un peschereccio. In questo modo
        il Pokémon indebolisce le prede e poi le inghiotte intere.
    lets-go-pikachu:
      ja-Hrkt: |-
        せびれに　さわると　しびれてしまう。
        ねむるときは　ながされないように
        シッポを　さんごに　まきつける。
      ja: |-
        背びれに　さわると　痺れてしまう。
        眠るときは　流されないように
        シッポを　さんごに　巻きつける。
      ko: |-
        등지느러미를 건드리면 마비된다.
        잘 때는 물살에 떠내려가지 않도록
        꼬리를 산호에 휘감는다.
      zh-Hant: |-
        碰到牠的背鰭會導致麻痺。
        睡覺時會用尾巴纏住珊瑚，
        以免被水流沖走。
      zh-Hans: |-
        摸它的背鳍会导致麻痹。
        为了避免在睡觉时被水冲走，
        它会用尾巴缠住珊瑚。
      en: |-
        Touching the back fin causes numbness. It hooks
        its tail to coral to stay in place while sleeping.
      fr: |-
        Le contact de ses nageoires dorsales engourdit.
        Il ancre sa queue au corail quand il dort pour
        éviter que le courant ne l’emporte.
      de: |-
        Eine Berührung seiner Rückenflossen betäubt. Es
        klammert sich mit dem Schwanz an Korallen fest,
        um sich im Schlaf vor der Strömung zu schützen.
      es: |-
        Tocar sus aletas dorsales causa entumecimiento.
        Mientras duerme se agarra al coral con la cola
        para que no se lo lleve la corriente.
      it: |-
        Il contatto con la sua pinna dorsale causa
        stordimento. Dorme con la coda avvolta intorno
        al corallo per non farsi portare via dalla corrente.
    lets-go-eevee:
      ja-Hrkt: |-
        せびれに　さわると　しびれてしまう。
        ねむるときは　ながされないように
        シッポを　さんごに　まきつける。
      ja: |-
        背びれに　さわると　痺れてしまう。
        眠るときは　流されないように
        シッポを　さんごに　巻きつける。
      ko: |-
