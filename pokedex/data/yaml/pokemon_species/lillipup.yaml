lillipup:
  base_happiness: 50
  capture_rate: 255
  color: brown
  egg_groups:
    - ground
  evolution_chain: lillipup
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        It faces strong opponents with great
        courage. But, when at a disadvantage in
        a fight, this intelligent Pokémon flees.
      fr: |-
        Il fait vaillamment face à des ennemis
        très puissants, mais il est intelligent
        et évite les combats trop inégaux.
    white:
      en: |-
        The long hair around its face provides
        an amazing radar that lets it sense
        subtle changes in its surroundings.
      fr: |-
        Les longs poils de son museau font
        un excellent radar qui analyse les
        alentours avec une grande acuité.
    black-2:
      en: |-
        Though it is a very brave Pokémon,
        it’s also smart enough to check its
        foe’s strength and avoid battle.
    white-2:
      en: |-
        Though it is a very brave Pokémon,
        it’s also smart enough to check its
        foe’s strength and avoid battle.
    x:
      ja-Hrkt: |-
        かおを　おおう　ながい　けは
        すぐれた　レーダー。しゅういの
        ようすを　びんかんに　さっちする。
      ja: |-
        顔を　覆う　長い　毛は
        優れた　レーダー。周囲の　様子を
        敏感に　察知する。
      ko: |-
        얼굴을 둘러싼 긴 털은
        우수한 레이더다. 주위
        상황을 민감히 살핀다.
      en: |-
        The long hair around its face provides an amazing
        radar that lets it sense subtle changes in
        its surroundings.
      fr: |-
        Les longs poils de son museau font un excellent
        radar qui analyse les alentours avec une grande
        acuité.
      de: |-
        Das lange Fell um sein Gesicht fungiert als
        Hightech-Radar, mit dem es fein säuberlich
        seine Umgebung abtastet.
      es: |-
        Los mechones que cubren su cara actúan como un
        magnífico radar para detectar con precisión lo que hay
        a su alrededor.
      it: |-
        I lunghi peli che gli coprono il volto sono un radar
        molto sensibile alle variazioni dell’ambiente
        circostante.
    'y':
      ja-Hrkt: |-
        ゆうもうな　ポケモンだが　あいての
        つよさを　たしかめて　たたかいを
        さける　かしこさも　あわせもつ。
      ja: |-
        勇猛な　ポケモンだが　相手の
        強さを　確かめて　戦いを
        避ける　賢さも　併せ持つ。
      ko: |-
        용맹한 포켓몬이지만 상대의
        강함을 확인하고 싸움을
        피하는 영리함도 함께 갖추고 있다.
      en: |-
        Though it is a very brave Pokémon, it’s also smart
        enough to check its foe’s strength and avoid battle.
      fr: |-
        Bien que vaillant, il a aussi l’intelligence d’analyser
        toutes les situations et de fuir quand il anticipe une
        défaite.
      de: |-
        Ein tapferes Pokémon, das jedoch klug genug ist,
        seinen Gegner zu mustern, bevor es sich auf einen
        Kampf einlässt.
      es: |-
        Aunque se trata de un Pokémon valeroso, también es
        lo bastante inteligente como para escapar si el rival es
        muy fuerte.
      it: |-
        È un Pokémon molto intrepido, ma ha l’intelligenza
        di valutare la forza del nemico prima di decidere se
        lottare o no.
    omega-ruby:
      ja-Hrkt: |-
        かおを　おおう　ながい　けは
        すぐれた　レーダー。しゅういの
        ようすを　びんかんに　さっちする。
      ja: |-
        顔を　覆う　長い　毛は
        優れた　レーダー。周囲の　様子を
        敏感に　察知する。
      ko: |-
        얼굴을 둘러싼 긴 털은
        우수한 레이더다. 주위
        상황을 민감히 살핀다.
      en: |-
        The long hair around its face provides an amazing
        radar that lets it sense subtle changes in
        its surroundings.
      fr: |-
        Les longs poils de son museau font un excellent radar
        qui analyse les alentours avec une grande acuité.
      de: |-
        Das lange Fell um sein Gesicht fungiert als Hightech-Radar,
        mit dem es fein säuberlich seine Umgebung abtastet.
      es: |-
        Los mechones que cubren su cara actúan como un magnífico
        radar para detectar con precisión lo que hay a su alrededor.
      it: |-
        I lunghi peli che gli coprono il volto sono un radar molto
        sensibile alle variazioni dell’ambiente circostante.
    alpha-sapphire:
      ja-Hrkt: |-
        ゆうもうな　ポケモンだが　あいての
        つよさを　たしかめて　たたかいを
        さける　かしこさも　あわせもつ。
      ja: |-
        勇猛な　ポケモンだが　相手の
        強さを　確かめて　戦いを
        避ける　賢さも　併せ持つ。
      ko: |-
        용맹한 포켓몬이지만 상대의
        강함을 확인하고 싸움을
        피하는 영리함도 함께 갖추고 있다.
      en: |-
        Though it is a very brave Pokémon, it’s also smart
        enough to check its foe’s strength and avoid battle.
      fr: |-
        Bien que vaillant, il a aussi l’intelligence d’analyser toutes
        les situations et de fuir quand il anticipe une défaite.
      de: |-
        Ein tapferes Pokémon, das jedoch klug genug ist, seinen
        Gegner zu mustern, bevor es sich auf einen Kampf einlässt.
      es: |-
        Aunque se trata de un Pokémon valeroso, también es lo
        bastante inteligente como para escapar si el rival es muy
        fuerte.
      it: |-
        È un Pokémon molto intrepido, ma ha l’intelligenza di valutare
        la forza del nemico prima di decidere se lottare o no.
    sun:
      ja-Hrkt: |-
        キャンキャン　ほえたり　しないので
        マンションぐらしの　トレーナーに
        にんきの　たかい　ポケモン。
      ja: |-
        キャンキャン　吠えたり　しないので
        マンション暮らしの　トレーナーに
        人気の　高い　ポケモン。
      ko: |-
        컹컹 짖거나 하지 않으므로
        맨션에 사는 트레이너에게
        인기가 많은 포켓몬이다.
      zh-Hant: |-
        因為不會汪汪汪地叫個不停，
        所以很受住公寓的訓練家們的歡迎。
      zh-Hans: |-
        因为不会汪汪汪地叫个不停，
        所以对于住在公寓里的训练家
        是人气很高的宝可梦。
      en: |-
        Because it doesn’t yelp, it’s extremely popular
        with Trainers who live in apartment buildings.
      fr: |-
        Très sage, il n’aboie et ne mord pas sans raison,
        ce qui en fait un Pokémon domestique très
        apprécié des Dresseurs casaniers.
      de: |-
        Es jault nicht, weswegen es bei Trainern, die in
        Apartmenthäusern wohnen, sehr beliebt ist.
      es: |-
        No suele ladrar mucho, por lo que resulta muy
        popular entre los Entrenadores que viven
        en apartamentos.
      it: |-
        Niente affatto rumoroso, è molto popolare
        tra gli Allenatori che vivono nei condomini.
    moon:
      ja-Hrkt: |-
        かおを　おおう　けは　レーダーの
        やくめを　もっており　たたかう
        あいての　ようすを　さぐるのだ。
      ja: |-
        顔を　覆う　毛は　レーダーの
        役目を　持っており　戦う
        相手の　様子を　探るのだ。
      ko: |-
        얼굴을 둘러싼 털은
        레이더 역할을 하여
        싸우는 상대의 상태를 살핀다.
      zh-Hant: |-
        覆蓋著臉部的毛擁有雷達的功能，
        用來探測戰鬥對手的狀況。
      zh-Hans: |-
        覆盖着脸部的毛拥有雷达的功能，
        用来探索战斗对手的样子。
      en: |-
        The long fur surrounding its face functions as
        radar, enabling it to probe the condition of its
        battle opponents.
      fr: |-
        Les poils qui masquent son visage lui servent
        de radar, et lui permettent ainsi d’évaluer
        la position et la puissance de ses ennemis.
      de: |-
        Das Fell auf seinem Gesicht fungiert als Radar,
        mit dem es Gegner aufspürt.
      es: |-
        Los mechones que le cubren el rostro actúan
        como un radar con el que averiguan la
        envergadura de posibles contrincantes.
      it: |-
        I lunghi peli che gli coprono il muso fungono
        da radar e gli permettono di capire le condizioni
        del nemico durante le lotte.
    ultra-sun:
      ja-Hrkt: |-
        はんだんりょくに　すぐれた　ポケモン。
        かてない　あいてと　はんだんしたら
        さっさと　シッポを　まいて　にげる。
      ja: |-
        判断力に　優れた　ポケモン。
        勝てない　相手と　判断したら
        さっさと　シッポを　巻いて　逃げる。
      ko: |-
        판단력이 뛰어난 포켓몬.
        이길 수 없는 상대라고 판단되면
        바로 꼬리를 내리고 도망친다.
      zh-Hant: |-
        擁有優秀判斷力的寶可夢。
        一旦判斷自己無法戰勝對手，
        就會立刻夾著尾巴逃走，
      zh-Hans: |-
        是拥有优秀判断力的宝可梦。
        如果判断出自己无法战胜对手，
        就会立即夹着尾巴逃走。
      en: |-
        This Pokémon has excellent judgment.
        If it decides it can’t defeat an opponent,
        it immediately turns tail and vamooses.
      fr: |-
        Réputé pour sa grande perspicacité, il s’enfuit
        la queue entre les pattes s’il s’estime trop faible
        pour gagner.
      de: |-
        Ein Pokémon mit ausgeprägtem Urteilsvermögen.
        Befindet es seinen Gegner für zu stark, zieht es
        den Schwanz ein und sucht sofort das Weite.
      es: |-
        Este Pokémon destaca por su perspicacia. Si
        percibe que no lleva las de ganar, no duda en
        huir con el rabo entre las piernas.
      it: |-
        È molto perspicace e capisce al volo se può
        competere con l’avversario. Se sa di non
        poterlo battere, fugge con la coda fra le gambe.
    ultra-moon:
      ja-Hrkt: |-
        かしこく　トレーナーの　いうことを
        すなおに　きくので　しょしんしゃでも
        そだてやすいと　にんきの　ポケモン。
      ja: |-
        賢く　トレーナーの　いうことを
        素直に　聞くので　初心者でも
        育てやすいと　人気の　ポケモン。
      ko: |-
        영리해서 트레이너가 하는 말을
        잘 따르기 때문에 초보자라도
        키우기 쉬워서 인기 있는 포켓몬이다.
      zh-Hant: |-
        聰明的牠會忠實地聽從訓練家的吩咐，
        所以即使是新手也很容易培育。
        是很受歡迎的寶可夢。
      zh-Hans: |-
        很聪明，会忠实地听从训练家的吩咐，
        所以即便是新手也很容易培育。
        是很受欢迎的宝可梦。
      en: |-
        This Pokémon is popular with beginners
        because it’s intelligent, obedient to its Trainer’s
        commands, and easy to raise.
      fr: |-
        Sa docilité en fait un Pokémon facile à élever.
        Il est notamment populaire auprès des
        Dresseurs débutants.
      de: |-
        Dieses pfiffige Pokémon ist besonders bei
        Anfängern beliebt, da es den Befehlen seines
        Trainers brav folgt und leicht zu trainieren ist.
      es: |-
        Este inteligente Pokémon es muy popular, ya que
        obedece sin rechistar a su Entrenador e incluso
        los novatos pueden entrenarlo sin problemas.
      it: |-
        È molto popolare per la sua intelligenza e per la
        docilità nel seguire le istruzioni, che lo rendono
        adatto anche agli Allenatori principianti.
    sword:
      ja-Hrkt: |-
        ゆうかん　かつ　しんちょう。
        かおを　おおう　やわらかい　けで
        まわりの　じょうほうを　キャッチ。
      ja: |-
        勇敢　かつ　慎重。
        顔を　覆う　柔らかい　毛で
        まわりの　情報を　キャッチ。
      ko: |-
        용감하고 신중하다.
        얼굴을 덮고 있는 부드러운 털로
        주변의 정보를 캐치한다.
      zh-Hant: |-
        個性勇敢且慎重。
        會用覆蓋著臉部的軟毛
        獲取周遭的資訊。
      zh-Hans: |-
        勇敢而慎重。
        用覆盖着脸部的软毛
        来获取周围的信息。
      en: |-
        This Pokémon is courageous but also cautious.
        It uses the soft fur covering its face to collect
        information about its surroundings.
      fr: |-
        Ce Pokémon est courageux, mais prudent.
        Les poils doux qui recouvrent son visage
        lui permettent de sonder les alentours.
      de: |-
        Es ist zwar tapfer, aber auch vorsichtig. Mit dem
        weichen Fell, das sein Gesicht bedeckt, nimmt
        Yorkleff Informationen über seine Umgebung auf.
      es: |-
        Es valiente pero cauto. Usa el suave pelaje que le
        recubre el rostro para obtener información sobre
        su entorno.
      it: |-
        Coraggioso e al contempo prudente. Capta
        informazioni sull’ambiente circostante grazie
        ai morbidi peli che gli ricoprono il muso.
    shield:
      ja-Hrkt: |-
        なみの　こども　よりも　ずっと
        りこう。　うけた　あいじょうも
        された　しうちも　わすれないのだ。
      ja: |-
        並みの　子ども　よりも　ずっと
        利口。　受けた　愛情も
        された　仕打ちも　忘れないのだ。
      ko: |-
        또래의 아이보다 훨씬
        영리하다. 사랑받은 것도
        혼난 것도 잊지 않는다.
      zh-Hant: |-
        比一般的小孩子都還要聰明。
        對於自己得到的關愛，
        或是受到的傷害牠都不會忘記。
      zh-Hans: |-
        比普通的小孩子还要
        聪明许多。对于得到的关爱
        和受到的伤害都不会忘怀。
      en: |-
        This Pokémon is far brighter than the average
        child, and Lillipup won’t forget the love it
        receives or any abuse it suffers.
      fr: |-
        Ce Pokémon est plus intelligent que la plupart
        des enfants. Il n’oublie ni l’affection qu’il a reçue
        ni les mauvais traitements qu’il a pu subir.
      de: |-
        Yorkleff ist deutlich intelligenter als die meisten
        Kinder und vergisst nie, wenn man ihm Zuneigung
        entgegenbringt oder es schlecht behandelt.
      es: |-
        Muestra una inteligencia muy superior a la media
        de los niños humanos. No olvida ni el amor ni los
        malos tratos que recibe.
      it: |-
        È molto più intelligente di un bambino. Non
        scorda né l’affetto ricevuto né i maltrattamenti
        subiti.
