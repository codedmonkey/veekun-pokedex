naganadel:
  base_happiness: 0
  capture_rate: 45
  color: purple
  egg_groups:
    - no-eggs
  evolution_chain: poipole
  evolves_from: poipole
  flavor_text:
    ultra-sun:
      ja-Hrkt: |-
        たいないに　すうひゃくリットルの
        どくえきを　ためている。　ＵＢと
        よばれる　せいぶつの　いっしゅ。
      ja: |-
        体内に　数百リットルの
        毒液を　ためている。
        ＵＢと　呼ばれる　生物の　一種。
      ko: |-
        체내에 수백 리터의
        독액을 갖고 있다.
        UB라고 불리는 생물의 일종이다.
      zh-Hant: |-
        體內儲存著數百公升的毒液，
        是被稱為究極異獸的生物
        中的一種。
      zh-Hans: |-
        体内储存着几百升的毒液。
        是被称为究极异兽的生物中的一种。
      en: |-
        It stores hundreds of liters of poisonous liquid
        inside its body. It is one of the organisms known
        as UBs.
      fr: |-
        Son corps contient des hectolitres de poison.
        Il fait partie de ces créatures que l’on nomme
        « Ultra-Chimères ».
      de: |-
        Eines der Lebewesen, die Ultrabestien genannt
        werden. In seinem Körper bewahrt es Hunderte
        Liter giftiger Flüssigkeit auf.
      es: |-
        Una de las temibles criaturas conocidas como
        Ultraentes. En su cuerpo almacena cientos
        de litros de veneno.
      it: |-
        È una delle forme di vita note come
        Ultracreature. Il suo corpo contiene
        centinaia di litri di veleno.
    ultra-moon:
      ja-Hrkt: |-
        ウルトラビーストの　いっしゅ。
        どくばりから　ねんどが　たかく
        ひかる　どくえきを　はっしゃする。
      ja: |-
        ウルトラビーストの　一種。
        毒針から　粘度が　高く
        光る　毒液を　発射する。
      ko: |-
        울트라비스트의 일종.
        독침에서 점도가 높고
        빛나는 독액을 발사한다.
      zh-Hant: |-
        究極異獸的一種。
        會從毒針發射出
        黏度很高的發光毒液。
      zh-Hans: |-
        究极异兽中的一种。
        会从毒针发射出
        黏性很大又发光的毒液。
      en: |-
        One kind of Ultra Beast, it fires a glowing,
        venomous liquid from its needles. This liquid
        is also immensely adhesive.
      fr: |-
        Cette Ultra-Chimère utilise son aiguillon pour
        sécréter un venin toxique, luisant et gluant.
      de: |-
        Diese Ultrabestie verschießt aus ihren
        Giftstacheln ein leuchtendes, dickflüssiges Gift.
      es: |-
        Uno de los Ultraentes. Su aguijón segrega un
        líquido tóxico cuya viscosidad le da una
        apariencia brillante.
      it: |-
        Una delle Ultracreature. Il luminoso liquido
        tossico che emette dagli aculei è caratterizzato
        da un’elevata viscosità.
