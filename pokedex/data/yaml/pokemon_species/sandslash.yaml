sandslash:
  base_happiness: 50
  capture_rate: 90
  color: yellow
  egg_groups:
    - ground
  evolution_chain: sandshrew
  evolves_from: sandshrew
  flavor_text:
    red:
      en: |-
        Curls up into a
        spiny ball when
        threatened. Itcan roll while
        curled up to
        attack or escape.
    blue:
      en: |-
        Curls up into a
        spiny ball when
        threatened. Itcan roll while
        curled up to
        attack or escape.
    yellow:
      en: |-
        It is skilled at
        slashing enemies
        with its claws.If broken, they
        start to grow back
        in a day.
    gold:
      en: |-
        In an attempt to
        hide itself, it
        will run aroundat top speed to
        kick up a blinding
        dust storm.
    silver:
      en: |-
        If it digs at an
        incredible pace,
        it may snap offits spikes and
        claws. They grow
        back in a day.
    crystal:
      en: |-
        Adept at climbing
        trees, it rolls
        into a spiny ball,then attacks its
        enemies from
        above.
    ruby:
      en: |-
        SANDSLASH’s body is covered by tough
        spikes, which are hardened sections of
        its hide. Once a year, the old spikes fallout, to be replaced with new spikes that
        grow out from beneath the old ones.
    sapphire:
      en: |-
        SANDSLASH can roll up its body as if it
        were a ball covered with large spikes.
        In battle, this POKéMON will try to makethe foe flinch by jabbing it with its
        spines. It then leaps at the stunned
        foe to tear wildly with its sharp claws.
    emerald:
      en: |-
        It curls up in a ball to protect itself from
        enemy attacks. It also curls up to prevent
        heatstroke during the daytime when
        temperatures rise sharply.
    firered:
      en: |-
        It is adept at attacking with the spines
        on its back and its sharp claws while
        quickly scurrying about.
    leafgreen:
      en: |-
        Curls up into a spiny ball when
        threatened. It can roll while curled up
        to attack or escape.
    diamond:
      en: |-
        It curls up, then rolls into foes
        with its back. Its sharp spines
        inflict severe damage.
    pearl:
      en: |-
        It curls up, then rolls into foes
        with its back. Its sharp spines
        inflict severe damage.
    platinum:
      en: |-
        It curls up, then rolls into foes
        with its back. Its sharp spines
        inflict severe damage.
    heartgold:
      en: |-
        In an attempt to hide itself,
        it will run around at top speed to
        kick up a blinding dust storm.
    soulsilver:
      en: |-
        If it digs at an incredible pace,
        it may snap off its spikes and
        claws. They grow back in a day.
    black:
      en: |-
        It curls up, then rolls into foes
        with its back. Its sharp spines
        inflict severe damage.
      fr: |-
        Il se met en boule pour percuter
        l’ennemi. Ses épines aiguisées
        font beaucoup de dégâts.
    white:
      en: |-
        It curls up, then rolls into foes
        with its back. Its sharp spines
        inflict severe damage.
      fr: |-
        Il se met en boule pour percuter
        l’ennemi. Ses épines aiguisées
        font beaucoup de dégâts.
    black-2:
      en: |-
        The spikes on its body are made
        up of its hardened hide. It rolls up
        and attacks foes with its spikes.
    white-2:
      en: |-
        The spikes on its body are made
        up of its hardened hide. It rolls up
        and attacks foes with its spikes.
    x:
      ja-Hrkt: |-
        すごい　いきおいで　じめんをほると
        トゲや　ツメが　おれてしまうが
        つぎのひには　はえそろっている。
      ja: |-
        すごい　勢いで　地面を掘ると
        トゲや　ツメが　折れてしまうが
        次の日には　生えそろっている。
      ko: |-
        굉장한 기세로 지면을 파면
        가시와 발톱이 부러져 버리지만
        다음 날에는 바로 돋아나 있다.
      en: |-
        If it digs at an incredible pace, it may snap off
        its spikes and claws. They grow back in a day.
      fr: |-
        Il creuse si vite qu’il peut briser ses épines et ses
        griffes. Mais elles repoussent en une journée.
      de: |-
        Wenn es schnell gräbt, können seine Stacheln und
        Krallen abbrechen. Sie wachsen binnen eines Tages
        nach.
      es: |-
        Si cava a gran velocidad, puede que se le caigan las
        garras y púas. Vuelven a crecerle en un día.
      it: |-
        Se scava molto velocemente gli si consumano le
        punte e gli artigli, ma gli ricrescono in un giorno.
    'y':
      ja-Hrkt: |-
        せなかを　まるめると　トゲトゲの
        ボールみたいだ。そのまま　ころがって
        ぶつかってきたり　にげたりする。
      ja: |-
        背中を　まるめると　トゲトゲの
        ボールみたいだ。そのまま　転がって
        ぶつかってきたり　逃げたりする。
      ko: |-
        등을 구부리면 뾰족뾰족한
        공 같다. 그대로 굴러서
        부딪쳐 오거나 도망간다.
      en: |-
        Curls up into a spiny ball when threatened. It can
        roll while curled up to attack or escape.
      fr: |-
        Il se roule en boule hérissée de piques s’il est
        menacé. Il peut ainsi s’enfuir ou attaquer.
      de: |-
        Bei Gefahr igelt sich dieses Pokémon ein.
        Zusammengerollt kann es angreifen oder fliehen.
      es: |-
        Ante el peligro, se acurruca en un espinoso ovillo.
        De esta forma puede rodar para atacar o escapar.
      it: |-
        Se in pericolo si chiude a riccio. In questa forma
        può rotolare, attaccare e scappare.
    omega-ruby:
      ja-Hrkt: |-
        からだの　トゲは　ひふが　かたくなったもの。
        １ねんに　１かい　ふるい　トゲが　ぬけおちて
        あたらしい　トゲが　したから　はえてくる。
      ja: |-
        体の　トゲは　皮膚が　硬くなったもの。
        １年に　１回　古い　トゲが　抜け落ちて
        新しい　トゲが　下から　生えてくる。
      ko: |-
        몸의 가시는 피부가 딱딱해진 것이다.
        1년에 1회 오래된 가시가 빠지고
        새로운 가시가 밑에서 돋아난다.
      en: |-
        Sandslash’s body is covered by tough spikes, which are
        hardened sections of its hide. Once a year, the old spikes
        fall out, to be replaced with new spikes that grow out from
        beneath the old ones.
      fr: |-
        Le corps de Sablaireau est recouvert de pointes très dures,
        qui sont des extensions de sa peau. Une fois par an,
        ce Pokémon mue et les vieilles pointes tombent, remplacées
        par de nouvelles.
      de: |-
        Sandamers Körper ist übersät mit spitzen Stacheln,
        die eigentlich Hauthärtungen darstellen. Einmal im Jahr
        fallen die alten Stacheln aus und werden durch neue ersetzt.
      es: |-
        Sandslash está recubierto de duras púas que son partes
        endurecidas de la piel. Suele mudarlas una vez al año; debajo
        de las viejas púas crecen unas nuevas que las sustituyen.
      it: |-
        Il corpo di Sandslash è ricoperto da aculei coriacei, costituiti
        da parti di corazza indurita. I vecchi aculei cadono una volta
        all’anno per essere sostituiti dai nuovi che crescono sotto
        i precedenti.
    alpha-sapphire:
      ja-Hrkt: |-
        せなかを　まるめると　トゲトゲの　ボールみたい。
        トゲに　さされて　ひるんだ　あいてに　とびかかり
        するどい　ツメで　ばりばり　ひっかきまくるぞ。
      ja: |-
        背中を　丸めると　トゲトゲの　ボールみたい。
        トゲに　刺されて　ひるんだ　相手に　飛びかかり
        鋭い　ツメで　ばりばり　引っかきまくるぞ。
      ko: |-
        등을 둥그렇게 말면 뾰족뾰족한 공 같다.
        가시에 찔려 풀죽은 상대에게 덤벼들어
        날카로운 발톱으로 박박 할퀴어 놓는다.
      en: |-
        Sandslash can roll up its body as if it were a ball covered
        with large spikes. In battle, this Pokémon will try to make
        the foe flinch by jabbing it with its spines. It then leaps at
        the stunned foe to tear wildly with its sharp claws.
      fr: |-
        Sablaireau peut enrouler son corps pour prendre la forme
        d’une balle hérissée de pointes. Ce Pokémon essaie de faire
        peur à son ennemi en le frappant avec ses pointes.
        Puis, il se rue sur lui avec ses griffes acérées.
      de: |-
        Sandamer kann sich zu einem Ball mit langen Stacheln
        zusammenrollen. Im Kampf schlägt es seine Gegner in die
        Flucht, indem es sie mit seinen Stacheln sticht. Dann springt
        es sie an und schlägt mit seinen scharfen Klauen zu.
      es: |-
        Sandslash puede enroscarse y convertirse en una bola de
        largas púas. En combate, este Pokémon hace retroceder a
        sus rivales clavándoselas. Acto seguido, aprovecha para
        echarse sobre ellos y atacarlos con sus afiladas garras.
      it: |-
        Sandslash arrotola il proprio corpo come fosse una sfera
        ricoperta di grandi aculei, che usa in lotta per far tentennare
        il nemico. Poi gli si scaglia contro per colpirlo selvaggiamente
        con gli artigli affilati.
    sun:
      ja-Hrkt: |-
        するどいが　やや　もろい　ツメや
        トゲは　よく　おれる。　よくじつには
        はえそろうので　きに　しなくてよい。
      ja: |-
        鋭いが　やや　もろい　ツメや
        トゲは　よく　折れる。　翌日には
        生えそろうので　気に　しなくてよい。
      ko: |-
        날카롭지만 약간 약한 발톱이나
        가시는 자주 부러진다. 다음 날에는 다시
        돋아나기 때문에 신경 쓰지 않아도 된다.
      zh-Hant: |-
        銳利卻有點脆弱的爪子和
        尖刺經常折斷。但因為第二天
        就會長回來，所以不必在意。
      zh-Hans: |-
        虽然锐利却有点儿脆弱的爪子
        和刺经常会折断。因为第二天
        就会长好，所以不必在意。
      en: |-
        Although they are sharp, its claws and spikes
        often break off. They grow back the next day,
        so it is not bothered by the temporary loss.
      fr: |-
        Ses griffes et épines sont tranchantes, mais
        elles se brisent facilement. Cela dit, il n’en a
        que faire, puisqu’elles repoussent le lendemain.
      de: |-
        Seine Krallen und Stacheln sind scharf, aber
        auch spröde und brechen oft ab. Sie wachsen
        jedoch innerhalb eines Tages wieder nach.
      es: |-
        No suele inquietarse por el hecho de que sus
        afiladas garras y púas se rompan con facilidad,
        ya que estas vuelven a crecer al día siguiente.
      it: |-
        I suoi artigli e aculei sono molto affilati, ma
        anche piuttosto fragili e si spezzano spesso.
        Tuttavia, ricrescono nel giro di un giorno.
    moon:
      ja-Hrkt: |-
        ツメで　きに　のぼり　えものが
        あらわれると　からだを　まるめて
        トゲのボールに　なって　らっかする。
      ja: |-
        ツメで　木に　登り　獲物が
        現れると　身体を　丸めて
        トゲのボールに　なって　落下する。
      ko: |-
        발톱으로 나무에 올라 먹이가
        나타나면 몸을 둥글게 만들어
        가시 공이 되어 낙하한다.
      zh-Hant: |-
        用爪子爬上樹，當獵物出現時，
        身體就蜷縮成尖刺球從高處落下。
      zh-Hans: |-
        用爪子爬上树，当猎物出现时，
        身体就蜷缩成尖刺球从高处落下。
      en: |-
        It uses its claws to climb trees and then curls
        its body into a spiny ball, ready to drop onto
        any prey that appears.
      fr: |-
        Il escalade les arbres avec ses griffes. Quand
        une proie passe à proximité, il se laisse tomber
        dessus toutes épines dressées.
      de: |-
        Es erklimmt mit seinen Krallen Bäume, rollt sich
        ein und wartet, bis Beute erscheint. Dann stürzt
        es sich als stachelige Kugel auf sie herab.
      es: |-
        Trepa a los árboles con sus garras. Cuando
        avista una presa, se convierte en una bola de
        púas y se deja caer sobre ella.
      it: |-
        Si arrampica sugli alberi con gli artigli affilati e,
        avvistata la preda, si raggomitola diventando
        una sfera irta di aculei e le piomba addosso.
    ultra-sun:
      ja-Hrkt: |-
        よく　ツメや　ツノが　おれてしまう。
        おれた　ツメや　ツノで　つちを
        たがやす　どうぐが　つくられる。
      ja: |-
        よく　ツメや　ツノが　折れてしまう。
        折れた　ツメや　ツノで　土を
        耕す　道具が　作られる。
      ko: |-
        발톱과 뿔이 잘 부러진다.
        부러진 발톱과 뿔은 땅을
        일구는 도구로 만들어진다.
      zh-Hant: |-
        爪子和尖刺經常折斷。
        折斷的爪子和尖刺被人們用來
        製作成耕作土地的工具。
      zh-Hans: |-
        爪子和角经常会折断。
        折断的爪子和角会被制作成
        用来耕作土地的用具。
      en: |-
        Its claws and horns often break off. The broken
        claws and horns can be used to carve plows for
        tilling farm fields.
      fr: |-
        Ses épines et ses griffes se cassent souvent.
        Ces pointes brisées peuvent servir d’outils
        pour creuser le sol.
      de: |-
        Seine Krallen und Stacheln brechen oft ab. Sie
        werden dann zu Werkzeugen für den Ackerbau
        verarbeitet.
      es: |-
        Sus garras y púas se caen con frecuencia y
        pueden recogerse para elaborar aperos de
        labranza.
      it: |-
        I suoi aculei si spezzano spesso.
        Una volta recuperati, si possono usare per
        fabbricare attrezzi per coltivare la terra.
    ultra-moon:
      ja-Hrkt: |-
        ふとい　ツメの　おかげで　きのぼりが
        とくいだ。　そのまま　きの　うえを
        ねどこにする　サンドパンも　おおい。
      ja: |-
        太い　ツメの　おかげで　木登りが
        得意だ。　そのまま　木の　上を
        寝床にする　サンドパンも　多い。
      ko: |-
        굵은 발톱 덕분에 나무타기가
        특기다. 나무 위에 올라가서
        잠을 자는 고지도 많다.
      zh-Hant: |-
        擅長用厚實的爪子來爬樹。
        也有許多穿山王會直接把
        樹上當成睡覺的地方。
      zh-Hans: |-
        得益于粗粗的爪子，所以它很
        擅长爬树。也有很多穿山王
        会直接把树上当成睡觉的地方。
      en: |-
        Thanks to its thick claws, it’s good at climbing
        trees. There are plenty of Sandslash that park
        themselves in trees and go right to sleep.
      fr: |-
        Ses grosses griffes lui permettent de grimper
        aux arbres sans peine. Il n’est pas rare de voir
        un Sablaireau endormi dans les frondaisons.
      de: |-
        Mit seinen Krallen kann es gut Bäume erklimmen.
        Häufig macht es die Baumkrone dann gleich zu
        seinem Schlafplatz.
      es: |-
        Sus gruesas garras le permiten escalar árboles
        con gran agilidad. De hecho, no es extraño ver
        ejemplares durmiendo entre el follaje.
      it: |-
        Grazie ai suoi grossi artigli può arrampicarsi
        sugli alberi con estrema facilità. Non è raro
        vederlo dormire fra i rami.
    lets-go-pikachu:
      ja-Hrkt: |-
        ツメで　ひっかくのが　とくいだが
        たたかっているうち　おれることも。
        つぎのひには　また　のびてくるぞ。
      ja: |-
        ツメで　ひっかくのが　得意だが
        戦っているうち　折れることも。
        次の日には　また　伸びてくるぞ。
      ko: |-
        발톱으로 할퀴는 것이 특기지만
        싸우다가 부러질 때도 있다.
        다음날이면 다시 자라난다.
      zh-Hant: |-
        擅長用爪子來抓敵人。
        爪子有時會在戰鬥中折斷，
        但到了隔天就會長回來。
      zh-Hans: |-
        它很擅长用爪子抓伤敌人。
        虽然在战斗中偶尔会折断爪子，
        但到第二天就会长出新的来。
      en: |-
        It is skilled at slashing enemies with its claws.
        If broken, they start to grow back in a day.
      fr: |-
        Ses griffes sont redoutables. Si l’une d’elles
        se casse en combat, elle repousse en un jour.
      de: |-
        Es greift Gegner mit seinen scharfen Klauen an.
        Brechen diese im Kampf ab, wachsen sie binnen
        eines Tages nach.
      es: |-
        Utiliza hábilmente las garras en combate, por
        lo que suelen rompérsele. Aun así, solo tardan
        un día en volverle a crecer.
      it: |-
        È abilissimo a graffiare i nemici con i suoi
        artigli affilati. Se si rompono, ricrescono in un
        giorno.
    lets-go-eevee:
      ja-Hrkt: |-
        ツメで　ひっかくのが　とくいだが
        たたかっているうち　おれることも。
        つぎのひには　また　のびてくるぞ。
      ja: |-
        ツメで　ひっかくのが　得意だが
        戦っているうち　折れることも。
        次の日には　また　伸びてくるぞ。
      ko: |-
        발톱으로 할퀴는 것이 특기지만
        싸우다가 부러질 때도 있다.
        다음날이면 다시 자라난다.
      zh-Hant: |-
        擅長用爪子來抓敵人。
        爪子有時會在戰鬥中折斷，
        但到了隔天就會長回來。
      zh-Hans: |-
        它很擅长用爪子抓伤敌人。
        虽然在战斗中偶尔会折断爪子，
        但到第二天就会长出新的来。
      en: |-
        It is skilled at slashing enemies with its claws.
        If broken, they start to grow back in a day.
      fr: |-
        Ses griffes sont redoutables. Si l’une d’elles
        se casse en combat, elle repousse en un jour.
      de: |-
        Es greift Gegner mit seinen scharfen Klauen an.
        Brechen diese im Kampf ab, wachsen sie binnen
        eines Tages nach.
      es: |-
        Utiliza hábilmente las garras en combate, por
        lo que suelen rompérsele. Aun así, solo tardan
        un día en volverle a crecer.
      it: |-
        È abilissimo a graffiare i nemici con i suoi
        artigli affilati. Se si rompono, ricrescono in un
        giorno.
    sword:
      ja-Hrkt: |-
        しつどが　ひくい　とちで　くらす
        サンドパンほど　せなかの　トゲの
        てざわりは　かたく　なめらかになる。
      ja: |-
        湿度が　低い　土地で　暮らす
        サンドパンほど　背中の　棘の
        手触りは　硬く　滑らかになる。
      ko: |-
        습도가 낮은 땅에서 사는
        고지일수록 등에 난 가시의
        감촉은 단단하고 매끄럽다.
      zh-Hant: |-
        越是在濕度低的地方
        生活的穿山王，背上尖刺的
        觸感就會越堅硬光滑。
      zh-Hans: |-
        越是在湿度低的地方生活的
        穿山王，背上的尖刺摸起来
        就越是坚硬光滑。
      en: |-
        The drier the area Sandslash lives in, the harder
        and smoother the Pokémon’s spikes will feel
        when touched.
      fr: |-
        Plus son habitat est sec, plus ses épines
        dorsales deviennent dures et lisses.
      de: |-
        Je trockener das Gebiet ist, in dem Sandamer
        lebt, desto härter und glatter fühlen sich die
        Stacheln an seinem Rücken an.
      es: |-
        Cuanto más seco es el terreno en el que habita,
        más duras y lisas se vuelven las púas que le
        recubren la espalda.
      it: |-
        Più secco è il territorio dove Sandslash vive,
        più i suoi aculei dorsali diventano lisci e duri.
    shield:
      ja-Hrkt: |-
        するどい　ツメを　ひっかけて　きを
        のぼる。　したで　まつ　サンドたちに
        きのみを　おとし　わけあたえるのだ。
      ja: |-
        鋭い　ツメを　ひっかけて　木を
        登る。　下で　待つ　サンドたちに
        木の実を　落とし　分け与えるのだ。
      ko: |-
        날카로운 발톱으로 찍으며 나무에 오른다.
        아래에서 기다리는 모래두지들에게
        나무열매를 떨어뜨려 나눠준다.
      zh-Hant: |-
        會用銳利的爪子當作鉤子來爬樹。
        這是為了將樹果擊落，
        分給在樹下等待的穿山鼠們。
      zh-Hans: |-
        会将锐利的爪子钩在树上爬树。
        这是为了设法使树果掉落，
        分给等在树下的穿山鼠们。
      en: |-
        It climbs trees by hooking on with its sharp claws.
        Sandslash shares the berries it gathers, dropping
        them down to Sandshrew waiting below the tree.
      fr: |-
        Il grimpe aux arbres grâce à ses griffes acérées
        et fait tomber des Baies pour les Sabelette
        qui attendent au sol.
      de: |-
        Mit seinen scharfen Krallen klettert es auf Bäume
        und wirft unten wartenden Sandan Beeren zu,
        die sie sich dann teilen.
      es: |-
        Trepa a los árboles con sus afiladas garras y deja
        caer bayas para los Sandshrew que esperan
        debajo.
      it: |-
        Si arrampica sugli alberi utilizzando i suoi artigli
        affilati per poi condividere le bacche che trova
        con i Sandshrew, che aspettano sotto.
