    x:
      ja-Hrkt: |-
        はったつした　ふとももの　きんにくが
        きょういてきな　しゅんぱつりょくと
        ちょうやくりょくを　うみだすぞ。
      ja: |-
        発達した　太ももの　筋肉が
        驚異的な　瞬発力と
        跳躍力を　生み出すぞ。
      ko: |-
        발달한 넓적다리의 근육이
        경이로운 순발력과
        도약력을 만들어 낸다.
      en: |-
        Its strongly developed thigh muscles give it
        astounding agility and jumping performance.
      fr: |-
        Les muscles surdéveloppés de ses cuisses permettent
        à Massko de sauter incroyablement haut.
      de: |-
        Seine stark entwickelten Oberschenkelmuskeln
        verleihen ihm außergewöhnliche Agilität und
        Sprungkraft.
      es: |-
        Los desarrollados músculos que tiene en las
        extremidades inferiores le hacen ser muy ágil y le
        permiten dar grandes saltos.
      it: |-
        I muscoli delle zampe estremamente sviluppati gli
        permettono di saltare fino a grandi altezze.
    'y':
      ja-Hrkt: |-
        みつりんに　せいそくする。
        えだから　えだへ　とびうつりながら
        いどうして　えものに　せっきんする。
      ja: |-
        密林に　生息する。
        枝から　枝へ　飛び移りながら
        移動して　獲物に　接近する。
      ko: |-
        밀림에 서식한다.
        가지에서 가지로 뛰어 옮겨가며
        이동해서 먹이에 접근한다.
      en: |-
        It lives in dense jungles. While closing in on its
        prey, it leaps from branch to branch.
      fr: |-
        Il vit dans les jungles denses. Il saute de branche
        en branche pour approcher de sa proie.
      de: |-
        Es lebt im dichten Dschungel. Es springt von
        Ast zu Ast, wenn es sich einer Beute nähert.
      es: |-
        Vive en selvas frondosas. Salta de rama en rama para
        acercarse a sus presas.
      it: |-
        Vive in giungle fitte. Si avvicina alle prede saltando
        di ramo in ramo.
    omega-ruby:
      ja-Hrkt: |-
        からだから　はえた　はっぱは　もりの　なかで
        てきから　すがたを　かくす　ときに　べんり。
        みつりんに　くらす　きのぼりの　めいしゅ。
      ja: |-
        体から　生えた　葉っぱは　森の　中で
        敵から　姿を　隠す　ときに　便利。
        密林に　暮らす　木登りの　名手。
      ko: |-
        몸에서 난 잎사귀는 숲 속에서
        적으로부터 몸을 숨길 때 편리하다.
        밀림에 사는 나무 타기의 명수다.
      en: |-
        The leaves growing out of Grovyle’s body are convenient for
        camouflaging it from enemies in the forest. This Pokémon is a
        master at climbing trees in jungles.
      fr: |-
        Les feuilles qui poussent sur le corps de Massko sont
        bien pratiques lorsqu’il veut se camoufler dans la forêt.
        Ce Pokémon est passé maître dans l’art de grimper
        aux arbres.
      de: |-
        Reptain kann sich mit den Blättern, die aus seinem
        Körper herauswachsen, im Wald hervorragend tarnen.
        Dieses Pokémon ist ein wahrer Meister darin, auf die
        Bäume des Dschungels zu klettern.
      es: |-
        Las hojas que Grovyle tiene por el cuerpo le resultan muy
        útiles para camuflarse en el bosque y esconderse de los
        enemigos. A este Pokémon no hay quien lo supere subiendo
        a los árboles del bosque.
      it: |-
        Le foglie che crescono sul corpo di Grovyle sono utili per
        mimetizzarsi contro i nemici nella foresta.
        Questo Pokémon sa arrampicarsi sugli alberi della giungla
        con una maestria senza pari.
    alpha-sapphire:
      ja-Hrkt: |-
        えだから　えだへ　みがるに　とびまわる。
        どんなに　すばやい　ポケモンも　もりの　なかで
        ジュプトルを　つかまえる　ことは　ふかのうだ。
      ja: |-
        枝から　枝へ　身軽に　飛び回る。
        どんなに　素早い　ポケモンも　森の　中で
        ジュプトルを　捕まえる　ことは　不可能だ。
      ko: |-
        가지에서 가지로 가볍게 뛰어다닌다.
        아무리 빠른 포켓몬도 숲 속에서
        나무돌이를 잡기란 불가능하다.
      en: |-
        This Pokémon adeptly flies from branch to branch in trees.
        In a forest, no Pokémon can ever hope to catch a fleeing
        Grovyle however fast they may be.
      fr: |-
        Ce Pokémon vole de branche en branche avec brio.
        En forêt, aucun Pokémon, même le plus rapide, ne peut
        espérer attraper un Massko qui s’enfuit.
      de: |-
        Dieses Pokémon fliegt geschickt von Ast zu Ast. Keinem
        Pokémon wird es jemals gelingen, ein Reptain zu erwischen.
        Da kann es noch so schnell sein.
      es: |-
        Este Pokémon revolotea de rama en rama con maestría.
        Cuando Grovyle va volando por el bosque, no hay quien lo
        alcance por muy rápido que sea.
      it: |-
        Grovyle vola di ramo in ramo e di albero in albero. Non c’è
        nessun Pokémon nella foresta in grado di catturarlo in volo:
        la sua velocità è impressionante!
