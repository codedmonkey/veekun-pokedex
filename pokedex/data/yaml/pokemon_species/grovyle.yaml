    sapphire:
      en: |-
        This POKéMON adeptly flies from branch
        to branch in trees.
        In a forest, no POKéMON can ever hopeto catch a fleeing GROVYLE however
        fast they may be.
    emerald:
      en: |-
        Leaves grow out of this POKéMON’s body.
        They help obscure a GROVYLE from the eyes
        of its enemies while it is in a thickly
        overgrown forest.
    firered:
