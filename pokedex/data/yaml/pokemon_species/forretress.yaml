    white-2:
      en: |-
        It is encased in a steel shell. Its
        peering eyes are all that can be
        seen of its mysterious innards.
    x:
      ja-Hrkt: |-
        こうてつの　カラで　まもられている。
        すきまから　めだまが　のぞいているが
        なかみの　しょうたいは　なぞのまま。
      ja: |-
        鋼鉄の　殻で　守られている。
        すきまから　目玉が　のぞいているが
        中身の　正体は　ナゾのまま。
      ko: |-
        강철 껍질이 몸을 보호하고 있다.
        틈새에서 엿보고 있는 눈이 있지만
        내용물의 정체는 수수께끼다.
      en: |-
        It is encased in a steel shell. Its peering eyes are
        all that can be seen of its mysterious innards.
      fr: |-
        Il est prisonnier d’une coquille d’acier. Ses yeux
        vigilants sont la seule partie visible de son corps.
      de: |-
        Dieses Pokémon ist von einer Stahlhülle umgeben.
        Seine stechenden Augen sind alles, was man von
        ihm sieht.
      es: |-
        Se protege con su concha de acero de tal manera que
        solo se pueden ver sus ojos.
      it: |-
        È incassato in una conchiglia d’acciaio. A parte gli
        occhi scrutatori, nessuno sa cosa ci sia all’interno.
    'y':
      ja-Hrkt: |-
        きに　くっついたまま　うごかない。
        かたいカラの　はへんを　ばらまいて
        ちかづくものを　おいはらう。
      ja: |-
        木に　くっついたまま　動かない。
        硬い殻の　破片を　ばらまいて
        近づくものを　追い払う。
      ko: |-
        나무에 붙어 있는 채로 안 움직인다.
        단단한 껍질 파편을 흩뿌려서
        다가오는 자를 쫓아버린다.
      en: |-
        It remains immovably rooted to its tree. It scatters
        pieces of its hard shell to drive its enemies away.
      fr: |-
        Il est totalement fixé à son arbre. Il lance des
        morceaux de sa carapace pour faire fuir son ennemi.
      de: |-
        Es bleibt stets bei seinem Baum. Es verstreut Teile
        seiner Schale, um so seine Feinde zu verjagen.
      es: |-
        Permanece inmóvil agarrado a su árbol. Dispara trozos
        de su dura coraza para alejar al enemigo.
      it: |-
        Rimane saldamente attaccato al suo albero. Tiene
        lontani i nemici lanciando pezzi del duro guscio.
    omega-ruby:
      ja-Hrkt: |-
        こうてつの　カラの　なかに　ほんたいが　いる。
        えものを　つかまえる　ときに　カラが　ひらくが
        あまりの　はやさに　なかみは　みえないのだ。
      ja: |-
        鋼鉄の　カラの　中に　本体が　いる。
        獲物を　捕まえる　ときに　カラが　開くが
        あまりの　速さに　中身は　見えないのだ。
      ko: |-
        강철 껍질 안에 본체가 있다.
        먹이를 잡을 때 껍질이 열리지만
        너무 빨라서 안이 보이진 않는다.
      en: |-
        Forretress conceals itself inside its hardened steel shell.
        The shell is opened when the Pokémon is catching prey,
        but it does so at such a quick pace that the shell’s inside
        cannot be seen.
      fr: |-
        Foretress se cache dans sa carapace en acier trempé.
        La carapace s’ouvre quand il attrape sa proie, mais cela se
        passe tellement vite qu’il est impossible de voir à l’intérieur.
      de: |-
        Forstellka versteckt sich in seiner stahlharten Schale.
        Die Schale öffnet sich, wenn es nach Beute schnappt.
        Dies geht jedoch so schnell, dass man das Innere der
        Schale nicht zu Gesicht bekommt.
      es: |-
        Forretress se esconde dentro de su concha de acero
        reforzada. Solo la abre cuando va a atrapar a su presa, pero
        ocurre tan rápido que no da tiempo de ver su interior.
      it: |-
        Forretress si nasconde all’interno della sua conchiglia
        d’acciaio temprato. La conchiglia si apre soltanto per catturare
        la preda, ma il Pokémon ha una rapidità tale che non è
        possibile osservarne l’interno.
    alpha-sapphire:
      ja-Hrkt: |-
        こうてつの　カラの　なかに　ほんたいが　いる。
        えものを　つかまえる　ときに　カラが　ひらくが
        あまりの　はやさに　なかみは　みえないのだ。
      ja: |-
        鋼鉄の　カラの　中に　本体が　いる。
        獲物を　捕まえる　ときに　カラが　開くが
        あまりの　速さに　中身は　見えないのだ。
      ko: |-
        강철 껍질 안에 본체가 있다.
        먹이를 잡을 때 껍질이 열리지만
        너무 빨라서 안이 보이진 않는다.
      en: |-
        Forretress conceals itself inside its hardened steel shell.
        The shell is opened when the Pokémon is catching prey,
        but it does so at such a quick pace that the shell’s inside
        cannot be seen.
      fr: |-
        Foretress se cache dans sa carapace en acier trempé.
        La carapace s’ouvre quand il attrape sa proie, mais cela se
        passe tellement vite qu’il est impossible de voir à l’intérieur.
      de: |-
        Forstellka versteckt sich in seiner stahlharten Schale.
        Die Schale öffnet sich, wenn es nach Beute schnappt.
        Dies geht jedoch so schnell, dass man das Innere der
        Schale nicht zu Gesicht bekommt.
      es: |-
        Forretress se esconde dentro de su concha de acero
        reforzada. Solo la abre cuando va a atrapar a su presa, pero
        ocurre tan rápido que no da tiempo de ver su interior.
      it: |-
        Forretress si nasconde all’interno della sua conchiglia
        d’acciaio temprato. La conchiglia si apre soltanto per catturare
        la preda, ma il Pokémon ha una rapidità tale che non è
        possibile osservarne l’interno.
    ultra-sun:
      ja-Hrkt: |-
        なにかが　ちかづくだけで　こうてつの
        カラのはへんを　うちだし　こうげき。
        いしは　なく　じょうけんはんしゃだ。
      ja: |-
        なにかが　近付くだけで　鋼鉄の
        カラの破片を　撃ちだし　攻撃。
        意思は　なく　条件反射だ。
      ko: |-
        무엇이든 다가오기만 하면
        강철 껍질의 파편을 쏘며 공격한다.
        의지가 없는 조건 반사다.
      zh-Hant: |-
        只要有東西靠近，牠就會
        發射鋼鐵外殼的碎片來攻擊。
        這是一種與意識無關的條件反射。
      zh-Hans: |-
        只要一有东西靠近，它就会射出
        钢铁外壳的碎片进行攻击。
        这是一种无意识的条件反射。
      en: |-
        When something approaches it, it fires off
        fragments of its steel shell in attack. This is not
        a conscious action but a conditioned reflex.
      fr: |-
        Il attaque tout ce qui s’approche d’un peu trop
        près en lançant des morceaux de sa coquille
        d’acier. Il n’a aucun contrôle sur ce réflexe.
      de: |-
        Kommt ihm irgendetwas zu nahe, feuert es Teile
        seiner stählernen Schale ab. Das geschieht
        jedoch aus Reflex, nicht aus eigenem Willen.
      es: |-
        Cuando algo se le acerca, ataca disparando
        fragmentos de su coraza de acero. Se trata de
        un puro acto reflejo.
      it: |-
        Scaglia frammenti del suo guscio d’acciaio
        temprato contro qualunque cosa gli si avvicini,
        ma si tratta di un riflesso involontario.
    ultra-moon:
      ja-Hrkt: |-
        えものを　のみこむ　いっしゅんだけ
        カラの　なかみが　あらわれるが　その
        すがたを　みたものは　まだいない。
      ja: |-
        獲物を　呑み込む　一瞬だけ
        カラの　中身が　現れるが　その
        姿を　見た者は　まだいない。
      ko: |-
        먹이를 삼키는 순간에는
        껍질 안의 모습이 나타나지만
        그 모습을 본 자는 아직 없다.
      zh-Hant: |-
        只有在吞下獵物的瞬間，
        殼裡的身體才會出現。
        至今還沒有人見過牠的真面目。
      zh-Hans: |-
        仅在吞下猎物的瞬间，壳里面的
        身体才会出现，但至今仍未有
        人或宝可梦见过其真面目。
      en: |-
        In the moment that it gulps down its prey, the
        inside of its shell is exposed, but to this day,
        no one has ever seen that sight.
      fr: |-
        On ne peut voir l’intérieur de sa carapace que
        lorsqu’il engloutit sa nourriture, mais il est si
        rapide que personne n’a encore jamais réussi.
      de: |-
        Sein Inneres ist nur kurz sichtbar, wenn es flugs
        seine Beute verschlingt. Bisher hat es noch kein
        Mensch geschafft, einen Blick hineinzuwerfen.
      es: |-
        El momento en el que engulle a su presa es el
        único instante donde muestra su cuerpo, pero
        hasta ahora ningún humano lo ha visto.
      it: |-
        L’istante in cui ingoia la preda è l’unico momento
        in cui è possibile sbirciare nella sua conchiglia.
        Nessuno sa esattamente come sia fatto.
