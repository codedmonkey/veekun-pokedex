beartic:
  base_happiness: 50
  capture_rate: 60
  color: white
  egg_groups:
    - ground
  evolution_chain: cubchoo
  evolves_from: cubchoo
  flavor_text:
    black:
      en: |-
        It can make its breath freeze at will.
        Very able in the water, it swims around
        in northern seas and catches prey.
      fr: |-
        Il fait lui-même geler son haleine. Il
        est bon nageur et sillonne les mers
        du nord à la recherche de ses proies.
    white:
      en: |-
        It freezes its breath to create
        fangs and claws of ice to fight with.
        Cold northern areas are its habitat.
      fr: |-
        Il gèle son haleine et en fait des crocs
        et des griffes de glace pour combattre.
        Il vit dans les terres gelées du nord.
    black-2:
      en: |-
        They love the cold seas of the north.
        They create pathways across the ocean
        waters by freezing their own breath.
    white-2:
      en: |-
        They love the cold seas of the north.
        They create pathways across the ocean
        waters by freezing their own breath.
    x:
      ja-Hrkt: |-
        きたの　つめたい　うみを　このむ。
        くちから　はきだした　いきをこおらせ
        うみのうえに　みちをつくり　あるく。
      ja: |-
        北の　冷たい　海を　好む。
        口から　吐きだした　息を凍らせ
        海の上に　道をつくり　歩く。
      ko: |-
        북쪽의 차가운 바다를 좋아한다.
        입에서 내뿜는 숨을 얼려
        바다 위에 길을 만들어 걷는다.
      en: |-
        They love the cold seas of the north. They create
        pathways across the ocean waters by freezing their
        own breath.
      fr: |-
        Il aime les mers glaciales du nord. Il y trace son
        chemin en créant des îlots de glace pour éviter de
        nager.
      de: |-
        Es liebt die kalten Meere im Norden und überquert
        ihre Flächen auf Stegen, die es mit seinem
        gefrorenen Atem baut.
      es: |-
        Adoran los mares gélidos del norte. Congelan su
        aliento para crear sendas por las que caminar sobre
        las aguas.
      it: |-
        Predilige i freddi mari del nord. Crea strade di
        ghiaccio soffiando con il suo alito gelido sulla
        superficie del mare.
    'y':
      ja-Hrkt: |-
        はく　いきを　こおらせて　こおりの
        キバや　ツメを　つくり　たたかう。
        きたの　さむい　とちで　くらす。
      ja: |-
        吐く　息を　凍らせて　氷の　キバや
        ツメを　作り　戦う。
        北の　寒い　土地で　暮らす。
      ko: |-
        내뱉는 숨을 얼려 얼음 이빨이나
        손톱을 만들어서 싸운다.
        추운 북쪽 땅에서 산다.
      en: |-
        It freezes its breath to create fangs and claws of ice
        to fight with. Cold northern areas are its habitat.
      fr: |-
        Il gèle son haleine et en fait des crocs et des griffes
        de glace pour combattre. Il vit dans les terres gelées
        du nord.
      de: |-
        Kämpft mit Reißzähnen aus Eis, die es aus gefrorenem
        Atem herstellt. Es lebt im Norden, wo es kalt ist.
      es: |-
        Congela su aliento y crea colmillos y garras de hielo
        para combatir. Vive en las gélidas tierras del norte.
      it: |-
        Lotta usando zanne o artigli creati congelando il suo
        stesso respiro. Vive nelle fredde regioni del nord.
    omega-ruby:
      ja-Hrkt: |-
        きたの　つめたい　うみを　このむ。
        くちから　はきだした　いきをこおらせ
        うみのうえに　みちをつくり　あるく。
      ja: |-
        北の　冷たい　海を　好む。
        口から　吐きだした　息を凍らせ
        海の上に　道をつくり　歩く。
      ko: |-
        북쪽의 차가운 바다를 좋아한다.
        입에서 내뿜는 숨을 얼려
        바다 위에 길을 만들어 걷는다.
      en: |-
        They love the cold seas of the north. They create
        pathways across the ocean waters by freezing their
        own breath.
      fr: |-
        Il aime les mers glaciales du nord. Il y trace son chemin
        en créant des îlots de glace pour éviter de nager.
      de: |-
        Es liebt die kalten Meere im Norden und überquert ihre
        Flächen auf Stegen, die es mit seinem gefrorenen Atem baut.
      es: |-
        Adoran los mares gélidos del norte. Congelan su aliento para
        crear sendas por las que caminar sobre las aguas.
      it: |-
        Predilige i freddi mari del nord. Crea strade di ghiaccio
        soffiando con il suo alito gelido sulla superficie del mare.
    alpha-sapphire:
      ja-Hrkt: |-
        はく　いきを　こおらせて　こおりの
        キバや　ツメを　つくり　たたかう。
        きたの　さむい　とちで　くらす。
      ja: |-
        吐く　息を　凍らせて　氷の　キバや
        ツメを　作り　戦う。
        北の　寒い　土地で　暮らす。
      ko: |-
        내뱉는 숨을 얼려 얼음 이빨이나
        손톱을 만들어서 싸운다.
        추운 북쪽 땅에서 산다.
      en: |-
        It freezes its breath to create fangs and claws of ice
        to fight with. Cold northern areas are its habitat.
      fr: |-
        Il gèle son haleine et en fait des crocs et des griffes de glace
        pour combattre. Il vit dans les terres gelées du nord.
      de: |-
        Kämpft mit Reißzähnen aus Eis, die es aus gefrorenem Atem
        herstellt. Es lebt im Norden, wo es kalt ist.
      es: |-
        Congela su aliento y crea colmillos y garras de hielo para
        combatir. Vive en las gélidas tierras del norte.
      it: |-
        Lotta usando zanne o artigli creati congelando il suo stesso
        respiro. Vive nelle fredde regioni del nord.
    sword:
      ja-Hrkt: |-
        といきを　こおらせ　つくった　キバは
        はがねより　かたい。　さむい　うみを
        エサを　さがして　およぎまわる。
      ja: |-
        吐息を　凍らせ　つくった　キバは
        鋼より　硬い。　寒い　海を
        エサを　探して　泳ぎまわる。
      ko: |-
        숨결을 얼려서 만든 송곳니는
        강철보다도 단단하다. 먹이를 찾아
        추운 바다를 헤엄쳐 다닌다.
      zh-Hant: |-
        吐出的氣息凍結而成的冰牙
        比鋼鐵還硬。為了尋找食物，
        會在寒冷的海裡游動徘徊。
      zh-Hans: |-
        吐出的气息冻结而成的冰牙
        比钢铁还硬。为了寻找食物，
        会在寒冷的海里游动徘徊。
      en: |-
        It swims through frigid seas, searching for prey.
        From its frozen breath, it forms icy fangs that
        are harder than steel.
      fr: |-
        Les crocs qu’il façonne en gelant son souffle
        sont plus durs que l’acier. Il sillonne les eaux
        des mers glaciales à la recherche de nourriture.
      de: |-
        Die Reißzähne, die es aus gefrorenem Atem
        erzeugt hat, sind härter als Stahl. Es schwimmt
        auf der Suche nach Futter durch die Eismeere.
      es: |-
        Congela su aliento y crea colmillos de hielo más
        duros que el acero. Nada en mares de aguas frías
        en busca de alimento.
      it: |-
        Le zanne che crea congelando il suo respiro
        sono più dure dell’acciaio. Nuota nelle acque
        gelide del mare in cerca di cibo.
    shield:
      ja-Hrkt: |-
        つめたい　うみを　げんきに　およぐ。
        つかれたときは　といきで　かいすいを
        こおらせて　そのうえで　やすむぞ。
      ja: |-
        冷たい　海を　元気に　泳ぐ。
        疲れたときは　吐息で　海水を
        凍らせて　その上で　休むぞ。
      ko: |-
        차가운 바다에서 씩씩하게 헤엄친다.
        지치면 한숨을 내쉬어 바다를
        얼린 뒤 그 위에서 쉰다.
      zh-Hant: |-
        在冰冷的大海裡精力十足地游泳。
        感到疲勞的時候會吐出氣息
        凍結海水，在冰面上休息。
      zh-Hans: |-
        在冰冷的大海里精力十足地游泳。
        感到疲劳的时候会吐出气息
        冻结海水，在冰面上休息。
      en: |-
        It swims energetically through frigid seas.
        When it gets tired, it freezes the seawater
        with its breath so it can rest on the ice.
      fr: |-
        Il sillonne les mers glaciales avec aisance.
        Quand il est fatigué, il gèle l’eau de mer
        d’un souffle et se repose sur l’iceberg improvisé.
      de: |-
        Es schwimmt fröhlich durch kalte Meere. Wenn
        es müde wird, gefriert es mit seinem Eisatem die
        Wasseroberfläche und ruht sich darauf aus.
      es: |-
        Nada plácidamente en mares fríos. Cuando se
        cansa, congela el agua con su aliento y reposa
        sobre el hielo.
      it: |-
        Nuota tranquillo nelle acque gelide del mare.
        Se è stanco, congela l’acqua con il suo soffio
        glaciale creando una piattaforma su cui riposare.
