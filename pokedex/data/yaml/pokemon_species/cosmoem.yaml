cosmoem:
  base_happiness: 0
  capture_rate: 45
  color: blue
  egg_groups:
    - no-eggs
  evolution_chain: cosmog
  evolves_from: cosmog
  flavor_text:
    sun:
      ja-Hrkt: |-
        しんだように　まったく　うごかないが
        ふれると　ほのかに　あたたかい。
        おおむかしは　ほしのマユと　よばれた。
      ja: |-
        死んだように　まったく　動かないが
        触れると　ほのかに　温かい。
        大昔は　星の繭と　呼ばれた。
      ko: |-
        죽은 것처럼 전혀 움직이지 않지만
        만지면 어렴풋이 따뜻하다.
        아주 옛날에는 달의 고치로 불렸다.
      zh-Hant: |-
        就像死去一樣動也不動，
        但觸碰後會感到些許溫暖。
        在遙遠的過去被稱為星之繭。
      zh-Hans: |-
        就像死了一般几乎不动，
        但触碰后有些许温暖。
        在遥远的过去被称为星之茧。
      en: |-
        Motionless as if dead, its body is faintly warm to
        the touch. In the distant past, it was called the
        cocoon of the stars.
      fr: |-
        On pourrait le croire mort car il ne bouge pas
        du tout. Au toucher, il reste tiède. On le
        surnomme « cocon céleste » depuis l’Antiquité.
      de: |-
        Es ist völlig reglos, als wäre es tot. Berührt man
        es, fühlt es sich jedoch leicht warm an. Vor
        langer Zeit wurde es „Sternenkokon“ genannt.
      es: |-
        Permanece inmóvil, como si estuviera muerto,
        aunque al tocarlo se percibe un ligero calor.
        Antaño se le llamaba Crisálida de las Estrellas.
      it: |-
        Resta completamente immobile, come se fosse
        morto, ma al tatto si percepisce un lieve tepore.
        Nell’antichità era chiamato “Bozzolo di stella”.
    moon:
      ja-Hrkt: |-
        かたいカラの　なかで　くろいコアに
        なにかが　あつまり　つづけている。
        べつせかいの　ポケモンと　いわれる。
      ja: |-
        硬いカラの　中で　黒いコアに
        なにかが　集まり　続けている。
        別世界の　ポケモンと　いわれる。
      ko: |-
        단단한 껍질 안의 검은 코어에
        무언가가 계속 모여들고 있다.
        다른 세계의 포켓몬으로 전해진다.
      zh-Hant: |-
        在堅硬的外殼內，有著某種東西
        在不斷地向黑色核心聚集著。
        據說是屬於其他世界的寶可夢。
      zh-Hans: |-
        在坚硬外壳内，有什么
        在源源不断地向黑色内核聚集着。
        据说是其他世界的宝可梦。
      en: |-
        There’s something accumulating around the
        black core within its hard shell. People think
        this Pokémon may come from another world.
      fr: |-
        Sous sa lourde carapace, il amasse secrètement
        quelque chose en son sombre noyau.
        Il viendrait d’un autre monde.
      de: |-
        Unter seiner harten Schale häuft sich
        unaufhörlich etwas in seinem schwarzen Kern
        an. Es soll aus einer anderen Welt stammen.
      es: |-
        Se dice que es un Pokémon procedente de otro
        mundo. Alrededor del núcleo negro que alberga
        su duro caparazón parece acumularse algo.
      it: |-
        Nel nucleo nero all’interno del suo duro
        esoscheletro continua ad accumularsi qualcosa.
        Si dice che provenga da un altro mondo.
    ultra-sun:
      ja-Hrkt: |-
        たいこ　アローラを　しはい　していた
        おうさまは　ほしのまゆと　よんで
        あがめるための　さいだんを　つくった。
      ja: |-
        太古　アローラを　支配　していた
        王様は　星の繭と　呼んで
        崇めるための　祭壇を　作った。
      ko: |-
        먼 옛날 알로라를 지배하던
        왕은 별의 고치라고 부르며
        숭상하기 위한 제단을 만들었다.
      zh-Hant: |-
        太古時代支配著阿羅拉的國王
        稱呼牠為星之繭，
        為了崇拜牠而建造了祭壇。
      zh-Hans: |-
        太古时代支配着阿罗拉的国王，
        称之为星之茧，
        因为崇拜它而建造了祭坛。
      en: |-
        The king who ruled Alola in times of antiquity
        called it the “cocoon of the stars” and built
        an altar to worship it.
      fr: |-
        Un antique roi d’Alola lui a donné le surnom
        de « cocon céleste » et a même érigé un autel
        en son honneur.
      de: |-
        Ein vor Urzeiten über Alola herrschender König
        nannte es „Sternenkokon“ und erbaute ihm zu
        Ehren ein Podium.
      es: |-
        En la antigüedad, un rey de Alola lo apodó
        Crisálida de las Estrellas y erigió un altar en su
        honor.
      it: |-
        Un antico re di Alola gli diede il nome di
        “Bozzolo di stella” e costruì un altare
        per venerarlo.
    ultra-moon:
      ja-Hrkt: |-
        ひかりを　すいながら　せいちょうを
        つづけている。　きんいろの　からは
        おどろくほどに　がんじょう。
      ja: |-
        光を　吸いながら　成長を
        続けている。　金色の　カラは
        驚くほどに　頑丈。
      ko: |-
        빛을 흡수하면서 성장을
        계속하고 있다. 금색의 껍질은
        놀라울 정도로 튼튼하다.
      zh-Hant: |-
        一邊吸收光一邊不斷成長。
        金色的外殼堅硬到
        令人驚異的程度。
      zh-Hans: |-
        一边吸收光，一边不断成长。
        金色的外壳坚硬得令人吃惊。
      en: |-
        As it absorbs light, Cosmoem continues to grow.
        Its golden shell is surprisingly solid.
      fr: |-
        Il continue à grandir en absorbant de la lumière.
        Sa carapace dorée est étonnamment solide.
      de: |-
        Es nimmt Licht in sich auf und wächst so immer
        weiter. Seine goldene Schale ist überraschend
        hart.
      es: |-
        Crece continuamente gracias a la luz que
        absorbe. Su caparazón dorado es más duro de
        lo que parece.
      it: |-
        Continua a crescere assorbendo la luce.
        Il suo esoscheletro dorato è incredibilmente
        duro.
    sword:
      ja-Hrkt: |-
        じんちを　こえた　かたさの　カラに
        つつまれている。　ほしの　ひかりを
        あびて　せいちょうする。
      ja: |-
        人知を　超えた　硬さの　殻に
        包まれている。　星の　光を
        浴びて　成長する。
      ko: |-
        인간의 지식을 뛰어넘는 강도를 가진
        껍질에 둘러싸여 있다.
        별의 빛을 받아서 성장한다.
      zh-Hant: |-
        將牠包裹起來的外殼擁有
        超越人類認知範圍的硬度。
        透過沐浴星光而成長。
      zh-Hans: |-
        将它包裹起来的外壳拥有
        超越人类认知范围的硬度。
        通过沐浴星光而成长。
      en: |-
        The absorption of starlight fuels this Pokémon’s
        growth. The shell that encases it is harder than
        any known material.
      fr: |-
        La carapace qui le recouvre est plus dure
        que tout ce qui est connu par l’Homme.
        Il grandit en absorbant la lumière des étoiles.
      de: |-
        Es wird von einer Schale umhüllt, deren Härte
        Menschen vor ein Rätsel stellt. Es wächst, indem
        es in Sternenlicht badet.
      es: |-
        Está recubierto de un caparazón de una dureza
        que escapa al entendimiento humano. Crece al
        exponerse a la luz de las estrellas.
      it: |-
        Il suo esoscheletro è più duro di qualunque
        cosa che gli esseri umani conoscano.
        Cresce assorbendo la luce delle stelle.
    shield:
      ja-Hrkt: |-
        たいきの　チリを　すごい　いきおいで
        すいこみ　しんかの　エネルギーを
        コアで　けんめいに　つくっている。
      ja: |-
        大気の　塵を　すごい　勢いで
        吸いこみ　進化の　エネルギーを
        コアで　懸命に　つくっている。
      ko: |-
        대기의 티끌을 굉장한 기세로
        빨아들여 진화 에너지를
        코어에서 열심히 만들고 있다.
      zh-Hant: |-
        以驚人的氣勢吸入
        大氣中的塵埃，努力用
        內核製造著進化的能源。
      zh-Hans: |-
        以惊人的气势吸入
        大气中的尘埃，努力用
        内核制造着进化的能源。
      en: |-
        It sucks in dust from the air at an astounding rate,
        frantically building up energy within its core as
        preparation for evolution.
      fr: |-
        Il aspire avec force la poussière de l’atmosphère
        et travaille sans relâche pour produire dans
        son noyau l’énergie nécessaire à son évolution.
      de: |-
        Es zieht mit unglaublicher Wucht Staub aus der
        Luft und produziert damit in seinem Kern fleißig
        Energie für seine Entwicklung.
      es: |-
        Absorbe impetuoso polvo de la atmósfera y
        pone todo su empeño en crear en su núcleo
        la energía necesaria para evolucionar.
      it: |-
        Aspira con forza il pulviscolo dell’atmosfera
        e produce alacremente l’energia necessaria
        alla propria evoluzione nel suo nucleo.
