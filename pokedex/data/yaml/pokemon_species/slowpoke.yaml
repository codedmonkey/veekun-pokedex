    sword:
      ja-Hrkt: |-
        まぬけで　どんかん。　しっぽを
        たべられても　いたみを　かんじないし　
        はえかわったことにも　きづかない。
      ja: |-
        まぬけで　鈍感。　しっぽを
        食べられても　痛みを　感じないし
        生えかわったことにも　気づかない。
      ko: |-
        멍청하고 둔감하다.
        꼬리를 먹혀도 아픔을 느끼지 못하고
        꼬리가 다시 자라도 눈치채지 못한다.
      zh-Hant: |-
        呆頭呆腦而且遲鈍。尾巴
        被吃掉也不會感到疼痛，
        甚至不會發現它又長出來了。
      zh-Hans: |-
        又呆又迟钝。即使尾巴被吃了
        也感受不到疼痛，甚至不会
        注意到又长出了新尾巴。
      en: |-
        Slow-witted and oblivious, this Pokémon won’t
        feel any pain if its tail gets eaten. It won’t notice
        when its tail grows back, either.
      fr: |-
        Il est si bête et si lent qu’il n’a pas mal lorsqu’on
        mange un morceau de sa queue. Il ne remarque
        même pas quand elle repousse.
      de: |-
        Es ist so träge und unempfindlich, dass es keinen
        Schmerz verspürt, wenn seine Rute gegessen wird.
        Es bemerkt nicht einmal, dass sie nachwächst.
      es: |-
        Es lento y abstraído. Aunque le devoren la cola,
        ni siquiera se percata, ya que no siente ningún
        dolor. Tampoco nota cuando le vuelve a crecer.
      it: |-
        Poco sveglio e privo di intuito. Se gli mangiano
        la coda non sente alcun dolore, e non si accorge
        nemmeno quando gli ricresce.
    shield:
      ja-Hrkt: |-
        しっぽを　みずに　ひたすと　あまみが
        にじみでるので　それを　エサに
        ポケモンを　おびきよせ　つりあげる。
      ja: |-
        しっぽを　水に　浸すと　甘味が
        にじみ出るので　それを　エサに
        ポケモンを　おびき寄せ　釣りあげる。
      ko: |-
        꼬리를 물에 담가두면
        단맛이 배어 나오기 때문에
        이를 미끼로 포켓몬을 유인해서 낚는다.
      zh-Hant: |-
        尾巴浸在水裡時會滲出
        甜味，牠會以此當誘餌
        來吸引並且釣起寶可夢。
      zh-Hans: |-
        把尾巴泡在水里后会有甜味渗出，
        因此它会以尾巴为诱饵
        吸引宝可梦并将其钓起。
      en: |-
        When this Pokémon’s tail is soaked in water,
        sweetness seeps from it. Slowpoke uses this trait
        to lure in and fish up other Pokémon.
      fr: |-
