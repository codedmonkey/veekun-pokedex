    sun:
      ja-Hrkt: |-
        ながい　しっぽは　よくちぎれる。
        とくに　いたみも　かんじないし
        すぐに　はえるので　きにしない。
      ja: |-
        長い　尻尾は　よく千切れる。
        特に　痛みも　感じないし
        すぐに　生えるので　気にしない。
      ko: |-
        긴 꼬리는 잘 잘린다.
        특별히 아픔도 느끼지 않고
        바로 자라기 때문에 신경 쓰지 않는다.
      zh-Hant: |-
        長長的尾巴經常斷掉。
        因為不會感到什麼疼痛，
        而且馬上又會長出來，所以並不在意。
      zh-Hans: |-
        长长的尾巴经常被揪断。
        因为也不会觉得特别痛，
        马上会长出来，所以并不在意。
      en: |-
        Its long tail often breaks off. It doesn’t really
        feel any pain, though, and the tail grows back,
        so Slowpoke isn’t particularly bothered.
      fr: |-
        Souvent, sa longue queue se coupe toute seule.
        Cela ne lui cause aucune douleur et une autre
        pousse aussitôt, donc il n’y a pas à s’en faire.
      de: |-
        Seine Rute bricht sehr leicht ab. Dies kümmert
        es jedoch wenig, da es dabei keine Schmerzen
        spürt und sie sofort wieder nachwächst.
      es: |-
        Pierde la cola con frecuencia, pero, como no
        le duele y le crece de nuevo rápidamente, no
        le da ninguna importancia.
      it: |-
        La sua lunga coda si spezza facilmente, ma
        senza causargli dolore. Inoltre, ricresce sempre,
        quindi il Pokémon non sembra preoccuparsene.
    moon:
      ja-Hrkt: |-
        ヤドンのしっぽを　ほしたあと
        しおみずで　にこんだ　りょうりは
        アローラの　かていの　あじ。
      ja: |-
        ヤドンの尻尾を　干したあと
        塩水で　煮込んだ　料理は
        アローラの　家庭の　味。
      ko: |-
        야돈의 꼬리를 말린 뒤
        소금물에 푹 끓인 요리는
        알로라의 가정식 메뉴다.
      zh-Hant: |-
        把呆呆獸的尾巴曬乾
        再用鹽水煮成的小菜，
        是阿羅拉的家常美味。
      zh-Hans: |-
        把呆呆兽的尾巴晒干后
        再用盐水煮成的小菜，
        是阿罗拉的家常美味。
      en: |-
        Alolan home cooking involves drying Slowpoke
        tails and then simmering them into a salty stew.
      fr: |-
        Une recette traditionnelle d’Alola consiste à
        faire sécher des queues de Ramoloss puis à
        les faire bouillir dans de l’eau salée.
      de: |-
        In Alola bereiten viele Familien Flegmon-Ruten
        zu, indem sie diese zuerst trocknen und dann
        in Salzwasser kochen.
      es: |-
        Un plato típico de la cocina de Alola son las
        colas de Slowpoke desecadas y cocinadas
        en agua salada.
      it: |-
        La coda di Slowpoke essiccata e bollita a fuoco
        lento in acqua salata è un piatto tipico della
        cucina di Alola.
    ultra-sun:
      ja-Hrkt: |-
        あくびを　すると　あめが　ふる
        という　いいつたえ　から　ヤドンを
        まつっている　ちいきが　あるという。
      ja: |-
        あくびを　すると　雨が　降る
        という　言い伝え　から　ヤドンを
        まつっている　地域が　あるという。
      ko: |-
        하품을 하면 비가 온다는
        구전 때문에 야돈을
        받을어 모시는 지역도 있다고 한다.
      zh-Hant: |-
        傳說當呆呆獸打呵欠時
        就會開始下雨，所以據說
        有些地區會祭祀呆呆獸。
      zh-Hans: |-
        有传说讲呆呆兽打哈欠
        就会下雨，所以据说
        有些地方会供奉呆呆兽。
      en: |-
        There are some places where Slowpoke is
        worshiped because of a long-standing belief
        that whenever Slowpoke yawns, it rains.
      fr: |-
        Ce Pokémon, vénéré et considéré comme un
        devin dans certaines régions, a donné naissance
        au dicton : Ramoloss a bâillé, attention à l’ondée.
      de: |-
        Einer Legende zufolge soll Flegmons Gähnen
        Regen herbeiführen. In manchen Regionen wird
        ihm deswegen gehuldigt.
      es: |-
        La leyenda afirma que su bostezo atrae las
        lluvias, por lo que en ciertas regiones lo
        consideran prácticamente una deidad.
      it: |-
        Secondo una leggenda, quando sbadiglia piove.
        Sembra che in alcune regioni venga venerato
        per questo motivo.
    ultra-moon:
      ja-Hrkt: |-
        しぜんにちぎれ　そこらに　おちている
        シッポは　てがるで　きちょうな
        しょくりょうの　ひとつ　だった。
      ja: |-
        自然にちぎれ　そこらに　落ちている
        シッポは　手軽で　貴重な
        食料の　ひとつ　だった。
      ko: |-
        주변에 자연스럽게 떨어져 있는
        꼬리는 손쉽게 얻을 수 있는
        귀중한 식재료 중 하나였다.
      zh-Hant: |-
        自然斷裂後脫落的尾巴
        是一種容易取得但又
        十分貴重的食材。
      zh-Hans: |-
        会自然断裂并脱落下来的尾巴
        是一种容易得到又十分贵重的食材。
      en: |-
        Although their tails, which fall off naturally, can
        easily be found lying around, they’re a precious
        ingredient for cooking.
      fr: |-
        Les queues de Ramoloss parfois retrouvées
        dans la nature étaient un ingrédient de cuisine
        particulièrement prisé.
      de: |-
        Von selbst abgefallene Flegmon-Ruten scheinen
        überall herumzuliegen. Dennoch gilt dieses
        einfache Nahrungsmittel als hochwertig.
      es: |-
        Su cola se desprende con facilidad de forma
        natural y es un ingrediente muy valorado en la
        elaboración de platos de alta cocina.
      it: |-
        Le code di Slowpoke si staccano naturalmente
        e cadono qua e là. Vengono raccolte e usate
        come preziosi ingredienti in cucina.
    lets-go-pikachu:
      ja-Hrkt: |-
        とても　まぬけで　うごきも　にぶい。
        じかんの　ながれを　きにすることなく
        のんびりと　いきている。
      ja: |-
        とても　間抜けで　動きも　鈍い。
        時間の　流れを　気にすることなく
        のんびりと　生きている。
      ko: |-
        매우 멍청하고 움직임도 둔하다.
        시간의 흐름을 의식하지 않고
        느긋하게 살고 있다.
      zh-Hant: |-
        呆頭呆腦而且動作遲鈍。
        從不在意時間的流逝，
        總是悠閒度日。
      zh-Hans: |-
        非常呆，动作也很缓慢。
        从不在意时间的流逝，
        过着悠闲的生活。
      en: |-
        Incredibly slow and sluggish. It is quite content
        to loll about without worrying about the time.
      fr: |-
        Lent et stupide, il aime se la couler douce
        sans se soucier du temps qui passe.
      de: |-
        Dieses Pokémon ist unglaublich faul und träge.
        Es faulenzt den ganzen Tag lang und schert sich
        nicht um die verstrichene Zeit.
      es: |-
        Es increíblemente lento y perezoso. Se toma las
        cosas con calma, sin preocuparse por el paso
        del tiempo.
      it: |-
        Non è molto sveglio ed è lento nei movimenti.
        Dorme e poltrisce tutto il giorno, incurante
        del tempo che passa.
    lets-go-eevee:
