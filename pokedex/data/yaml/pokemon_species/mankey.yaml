    x:
      ja-Hrkt: |-
        いみもなく　おこって　あばれだすと
        なかまの　くべつも　つかなくなるので
        ちかよるのは　ひじょうに　きけんだ。
      ja: |-
        意味もなく　怒って　暴れ出すと
        仲間の　区別も　つかなくなるので
        近寄るのは　非常に　危険だ。
      ko: |-
        이유 없이 화내고 날뛰기 시작하면
        동료도 구별하지 못하기 때문에
        가까이 가는 것은 매우 위험하다.
      en: |-
        It’s unsafe to approach if it gets violently enraged
        for no reason and can’t distinguish friends
        from foes.
      fr: |-
        Il ne peut dissocier ses amis de ses ennemis et a
        tendance à enrager lorsqu’on l’approche.
      de: |-
        Da es grundlos angreift und nicht zwischen Freund
        oder Feind unterscheidet, ist es sehr gefährlich.
      es: |-
        Es peligroso acercarse si se enfada sin razón aparente,
        ya que no distingue entre amigos y enemigos.
      it: |-
        Se è tanto arrabbiato da non riuscire più a distinguere
        gli amici dai nemici, è pericoloso avvicinarsi.
    'y':
      ja-Hrkt: |-
        きのうえで　せいかつしている。
        むれの　１ぴきが　おこりはじめると
        ぜんいんが　いみもなく　あばれだす。
      ja: |-
        木の上で　生活している。
        群れの　１匹が　怒り出すと
        全員が　意味もなく　暴れ出す。
      ko: |-
        나무 위에서 생활하고 있다.
        무리 중 1마리가 화내기 시작하면
        모두 아무 의미도 없이 난동을 부린다.
      en: |-
        It lives in treetop colonies. If one becomes
        enraged, the whole colony rampages for no reason.
      fr: |-
        Ils vivent en colonies sylvestres. Quand un Férosinge
        s’énerve, toute la colonie suit son exemple.
      de: |-
        Es lebt mit anderen in Baumkronen. Wird eines von
        ihnen wütend, werden alle anderen auch wütend.
      es: |-
        Vive en colonias en los árboles. Si uno se enfada, el
        resto de la manada ataca sin motivo.
      it: |-
        Vive in colonie sugli alberi. Se uno si adira, l’intera
        colonia comincia ad agire violentemente senza motivo.
    omega-ruby:
      ja-Hrkt: |-
        からだが　ふるえ　はないきが　あらくなれば
        おこりだす　まえぶれ　なのだが　あっというまに
        はげしく　おこるので　にげだす　ひまは　ない。
      ja: |-
        体が　震え　鼻息が　荒くなれば
        怒りだす　前触れ　なのだが　あっという間に
        激しく　怒るので　逃げ出す　暇は　ない。
      ko: |-
        몸이 떨리며 콧김이 거칠어지면
        화를 낼 조짐이지만 순식간에 격렬하게
        화를 내기 때문에 도망갈 틈이 없다.
      en: |-
        When Mankey starts shaking and its nasal breathing turns
        rough, it’s a sure sign that it is becoming angry. However,
        because it goes into a towering rage almost instantly,
        it is impossible for anyone to flee its wrath.
      fr: |-
        Lorsque Férosinge commence à trembler et que sa respiration
        devient haletante, cela signifie qu’il est en colère. En outre,
        la moutarde lui monte au nez tellement vite qu’il est presque
        impossible d’échapper à sa colère.
      de: |-
        Wenn Menki sich schüttelt und schwer durch die Nase atmet,
        dann ist es wütend. Da es blitzartig in Raserei gerät, ist es
        unmöglich, seinem Zorn zu entkommen.
      es: |-
        Cuando Mankey empieza a temblar y a respirar con más
        intensidad, seguro que va a enfadarse. Aunque prever su
        enfado no sirve de nada porque alcanza un estado de rabia
        tan rápido que no hay escapatoria.
      it: |-
        Quando Mankey inizia a tremare e la sua respirazione
        nasale diventa pesante significa che si sta infuriando.
        Tuttavia, a causa dei suoi repentini attacchi d’ira,
        è impossibile per chiunque sfuggire alla sua furia.
    alpha-sapphire:
      ja-Hrkt: |-
