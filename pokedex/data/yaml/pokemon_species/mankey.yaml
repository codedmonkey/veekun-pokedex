        Tuttavia, a causa dei suoi repentini attacchi d’ira,
        è impossibile per chiunque sfuggire alla sua furia.
    sun:
      ja-Hrkt: |-
        まえぶれもなく　とつぜん　おこる。
        あばれまくって　だれも　いなくなると
        こどくに　たえられなくて　またおこる。
      ja: |-
        前触れもなく　突然　怒る。
        暴れまくって　誰も　いなくなると
        孤独に　耐えられなくて　また怒る。
      ko: |-
        예고 없이 갑자기 화낸다. 마구
        난동을 부려 모두가 곁을 떠나면
        고독을 참지 못하고 또 화낸다.
      zh-Hant: |-
        會沒有任何徵兆突然發怒。
        大肆胡鬧把周圍的一切都趕走之後，
        又會因受不了孤獨而再次發怒。
      zh-Hans: |-
        会没有任何征兆突然发怒。
        如果大肆胡闹后谁都不在了的话，
        又会因无法忍受孤独而再次发怒。
      en: |-
        It can spontaneously become enraged. Everyone
        near it clears out as it rampages, and the
        resulting loneliness makes it angrier still.
      fr: |-
        Quand il pique soudain une terrible colère, tout
        le monde autour de lui s’enfuit. Mais il supporte
        mal la solitude, et ça l’énerve encore davantage.
      de: |-
        Es rastet häufig völlig unvermittelt aus. Danach
        findet es sich oft mutterseelenallein wieder.
        Das macht es schließlich noch wütender.
      es: |-
        Se enfada sin razón aparente. Cuando todos lo
        dejan solo para no tener que lidiar con su ira,
        Mankey se enoja más aún.
      it: |-
        È soggetto ad attacchi di rabbia improvvisi e se
        tutti attorno a lui si dileguano, si arrabbia ancora
        di più per la stizza di essere rimasto solo.
    moon:
      ja-Hrkt: |-
        いかりちらして　つかれて　ねむるが
        ゆめの　なかで　はらをたて　いかりで
        めざめ　めざめたことに　またいかる。
      ja: |-
        怒り散らして　疲れて　眠るが
        夢の　中で　腹を立て　怒りで
        目覚め　目覚めたことに　また怒る。
      ko: |-
        마구 화를 내다 지쳐서 잠이 들지만
        꿈속에서 화를 내서 분노로 일어나고
        일어났다는 사실에 또 화를 낸다.
      zh-Hant: |-
        發洩完怒氣後累得睡著了，
        但卻在夢裡生氣而醒來，
        然後又因為醒來而再次發怒了。
      zh-Hans: |-
        发泄完怒气后累得睡着了，
        却在梦里发怒而醒来，
        于是又因为醒来而再次发怒了。
      en: |-
        Its raging tires it out and causes it to fall asleep,
        but the anger resonating in its dreams causes it
        to wake up—which infuriates it all over again.
      fr: |-
        Fatigué de sa colère permanente, il lui arrive
        de dormir, mais il rêve de ses frustrations, se
        réveille, et se met en colère d’avoir été réveillé.
      de: |-
        Es ärgert sich, bis es vor Erschöpfung eindöst.
        Doch selbst im Traum findet es keine Ruhe, also
        wacht es wieder auf und wird noch wütender.
      es: |-
        Tras desatar su ira, le entra sueño y se duerme.
        Sin embargo, sus pesadillas lo atormentan aún
        más, por lo que se despierta de muy mal humor.
      it: |-
        Quando si infuria si stanca così tanto che si
        addormenta, ma si arrabbia anche in sogno,
        e si risveglia ancora più arrabbiato.
    ultra-sun:
      ja-Hrkt: |-
        ちょっとしたことで　すぐ　おこる。
        ストレスを　ためこまないので
        かなり　ながいきする　ポケモンだ。
      ja: |-
        ちょっとしたことで　すぐ　怒る。
        ストレスを　ため込まないので
        かなり　長生きする　ポケモンだ。
      ko: |-
        작은 일에도 금방 화를 낸다.
        스트레스를 쌓아 두지 않아서
        꽤 오래 사는 포켓몬이다.
      zh-Hant: |-
        遇到一點小事就會發怒。
        因為從不累積壓力，
        因此這種寶可夢相當長壽。
      zh-Hans: |-
        该宝可梦会因一点小事而立刻动怒。
        由于不会积累压力，
        所以能活相当长的时间。
      en: |-
        The smallest of things could cause it to lose its
        temper. Because it doesn’t hold in its stress,
        this Pokémon can live a long time.
      fr: |-
        La moindre contrariété le rend furieux. Comme
        rien ne l’atteint durablement, il n’accumule
        pas de stress et peut vivre très vieux.
      de: |-
        Selbst Kleinigkeiten regen es sofort auf. Da es
        Stress aber nicht in sich hineinfrisst, erfreut es
        sich eines langen Lebens.
      es: |-
        Se encoleriza enseguida por cualquier minucia.
        Por otro lado, al no acumular estrés, suele gozar
        de una vida longeva.
      it: |-
        Basta un nonnulla per farlo andare su tutte
        le furie. Tuttavia, non accumula stress e vive
        molto a lungo.
    ultra-moon:
      ja-Hrkt: |-
        １ぴきが　おこりだすと　まわりも
        おこりだすので　マンキーの　むれに
        せいじゃくが　おとずれることは　ない。
      ja: |-
        １匹が　怒りだすと　まわりも
        怒りだすので　マンキーの　群れに
        静寂が　訪れることは　ない。
      ko: |-
        1마리가 화를 내면 주변에서도
        화를 내기 때문에 망키 무리가
        조용해지는 일은 없다.
      zh-Hant: |-
        只要有１隻發怒，周圍的
        猴怪也會跟著開始發起怒來，
        所以猴怪群從沒有一刻是安靜的。
      zh-Hans: |-
        只要有１只发怒，
        周围的猴怪也会跟着发怒，
        所以猴怪群里没有一刻是安静的。
      en: |-
        If one gets angry, all the others around it will
        get angry, so silence is a rare visitor in a troop
        of Mankey.
      fr: |-
        Il suffit qu’un Férosinge s’énerve pour que
        ses congénères en fassent de même, aussi
        leurs groupes ne connaissent-ils jamais la paix.
      de: |-
        Wird es wütend, färbt das auch auf seine
        Kameraden ab. In einer Schar von Menki kehrt
        daher niemals Ruhe ein.
      es: |-
        Cuando un ejemplar se enfada, contagia su ira
        al resto, por lo que los grupos de Mankey
        desconocen el concepto de vida reposada.
      it: |-
        Se uno di loro si arrabbia, si infuriano anche
        i Mankey che gli stanno intorno. Per questo
        nelle loro colonie non regna mai il silenzio.
    lets-go-pikachu:
      ja-Hrkt: |-
        みがるで　きのうえで　せいかつする。
        ふとしたことで　きげんが　わるくなり
        まわりに　いるものに　とびかかる。
      ja: |-
        身軽で　木の上で　生活する。
        ふとしたことで　機嫌が　悪くなり
        まわりに　いるものに　飛びかかる。
      ko: |-
        몸이 가벼워 나무 위에서 생활한다.
        사소한 일로 기분이 나빠져
        주변에 있는 것에 덤벼든다.
      zh-Hant: |-
        體態輕盈的牠居住在樹上。
        常因為一些小事而生氣，
        往身邊的東西飛撲過去。
      zh-Hans: |-
        身体轻盈，在树上生活。
        常因鸡毛蒜皮的小事发火
        而飞扑到周围的东西上。
      en: |-
        An agile Pokémon that lives in trees. It angers
        easily and will not hesitate to attack anything.
      fr: |-
        Agile et rapide, ce Pokémon vit dans les arbres.
        Il s’énerve facilement et s’attaque à tout ce qui
        bouge quand il est en colère.
      de: |-
        Es ist sehr agil und lebt auf Bäumen. Aufgrund
        seiner hitzköpfigen Natur wird es schnell wütend,
        was dazu führt, dass es alles und jeden angreift.
      es: |-
        Este ágil Pokémon vive en los árboles. Se enfada
        con facilidad y, cuando lo hace, se abalanza
        contra todo lo que se encuentre a su alrededor.
      it: |-
        Un Pokémon agile che vive sugli alberi.
        È molto irascibile e non esita ad attaccare
        chiunque gli capiti a tiro.
    lets-go-eevee:
      ja-Hrkt: |-
        みがるで　きのうえで　せいかつする。
