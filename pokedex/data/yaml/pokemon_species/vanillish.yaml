vanillish:
  base_happiness: 50
  capture_rate: 120
  color: white
  egg_groups:
    - mineral
  evolution_chain: vanillite
  evolves_from: vanillite
  flavor_text:
    black:
      en: |-
        Snowy mountains are this Pokémon’s
        habitat. During an ancient ice age, they
        moved to southern areas.
      fr: |-
        Un Pokémon qui vit dans les montagnes
        enneigées. Il a émigré au sud durant
        l’ère glaciaire, il y a bien longtemps.
    white:
      en: |-
        It conceals itself from enemy eyes
        by creating many small ice particles
        and hiding among them.
      fr: |-
        Il se cache de ses ennemis en
        émettant une myriade de petites
        particules de glace.
    black-2:
      en: |-
        They cool down the surrounding air
        and create ice particles, which
        they use to freeze their foes.
    white-2:
      en: |-
        They cool down the surrounding air
        and create ice particles, which
        they use to freeze their foes.
    x:
      ja-Hrkt: |-
        あたりの　くうきを　ひやして
        こおりの　つぶを　はっせい　させて
        てきの　からだを　こおりつかせる。
      ja: |-
        辺りの　空気を　冷やして
        氷の　粒を　発生　させて
        敵の　体を　凍りつかせる。
      ko: |-
        주변 공기를 차갑게 해서
        얼음 알갱이를 발생시켜서
        상대의 몸을 얼려버린다.
      en: |-
        They cool down the surrounding air and create ice
        particles, which they use to freeze their foes.
      fr: |-
        Il pétrifie ses ennemis en refroidissant l’air ambiant
        et en le changeant en une myriade de petites
        particules de glace.
      de: |-
        Es produziert Eiskörner, indem es die Luft um sich
        herum abkühlt, und zieht mit ihnen eine Eisschicht
        um seinen Gegner.
      es: |-
        Enfrían el aire a su alrededor y crean partículas de
        hielo mediante las cuales congelan a sus oponentes.
      it: |-
        Congela il corpo del nemico con granelli di ghiaccio
        che genera raffreddando l’aria circostante.
    'y':
      ja-Hrkt: |-
        ゆきやまに　せいそくする　ポケモン。
        おおむかし　ひょうがきの　ときに
        みなみの　とちへ　いどうしてきた。
      ja: |-
        雪山に　生息する　ポケモン。
        大昔　氷河期の　ときに
        南の　土地に　移動してきた。
      ko: |-
        설산에 서식하는 포켓몬이다.
        먼 옛날 빙하기 때
        남쪽 땅으로 이동해 왔다.
      en: |-
        Snowy mountains are this Pokémon’s habitat.
        During an ancient ice age, they moved to
        southern areas.
      fr: |-
        Un Pokémon qui vit dans les montagnes enneigées.
        Il a émigré au sud durant l’ère glaciaire, il y a bien
        longtemps.
      de: |-
        Es lebt auf schneebedeckten Bergen. Vor vielen
        Jahren fand es während einer Eiszeit seinen Weg
        in den Süden.
      es: |-
        Vive en las cumbres nevadas. Migró hacia el sur
        durante la era glaciar hace muchísimos años.
      it: |-
        Vive sulle montagne innevate. Durante le antiche
        glaciazioni si è spostato nelle regioni del sud.
    omega-ruby:
      ja-Hrkt: |-
        あたりの　くうきを　ひやして
        こおりの　つぶを　はっせい　させて
        てきの　からだを　こおりつかせる。
      ja: |-
        辺りの　空気を　冷やして
        氷の　粒を　発生　させて
        敵の　体を　凍りつかせる。
      ko: |-
        주변 공기를 차갑게 해서
        얼음 알갱이를 발생시켜서
        상대의 몸을 얼려버린다.
      en: |-
        They cool down the surrounding air and create ice
        particles, which they use to freeze their foes.
      fr: |-
        Il pétrifie ses ennemis en refroidissant l’air ambiant et en le
        changeant en une myriade de petites particules de glace.
      de: |-
        Es produziert Eiskörner, indem es die Luft um sich herum
        abkühlt, und zieht mit ihnen eine Eisschicht um seinen Gegner.
      es: |-
        Enfrían el aire a su alrededor y crean partículas de hielo
        mediante las cuales congelan a sus oponentes.
      it: |-
        Congela il corpo del nemico con granelli di ghiaccio che
        genera raffreddando l’aria circostante.
    alpha-sapphire:
      ja-Hrkt: |-
        ゆきやまに　せいそくする　ポケモン。
        おおむかし　ひょうがきの　ときに
        みなみの　とちへ　いどうしてきた。
      ja: |-
        雪山に　生息する　ポケモン。
        大昔　氷河期の　ときに
        南の　土地に　移動してきた。
      ko: |-
        설산에 서식하는 포켓몬이다.
        먼 옛날 빙하기 때
        남쪽 땅으로 이동해 왔다.
      en: |-
        Snowy mountains are this Pokémon’s habitat.
        During an ancient ice age, they moved to
        southern areas.
      fr: |-
        Un Pokémon qui vit dans les montagnes enneigées.
        Il a émigré au sud durant l’ère glaciaire, il y a bien
        longtemps.
      de: |-
        Es lebt auf schneebedeckten Bergen. Vor vielen Jahren fand
        es während einer Eiszeit seinen Weg in den Süden.
      es: |-
        Vive en las cumbres nevadas. Migró hacia el sur durante la era
        glaciar hace muchísimos años.
      it: |-
        Vive sulle montagne innevate. Durante le antiche glaciazioni
        si è spostato nelle regioni del sud.
    sun:
      ja-Hrkt: |-
        あつい　ひには　からだが　とける。
        こおらせれば　もとに　もどるけど
        からだの　かたちは　すこし　ゆがむ。
      ja: |-
        暑い　日には　身体が　溶ける。
        凍らせれば　元に　戻るけど
        身体の　形は　少し　歪む。
      ko: |-
        더운 날에는 몸이 녹는다.
        얼리면 다시 돌아오지만
        몸 형태는 조금 일그러진다.
      zh-Hant: |-
        在炎熱的天氣裡身體會溶化。
        如果冰凍起來就會恢復原狀，
        但身體的形狀會稍稍歪掉。
      zh-Hans: |-
        在炎热的天气里身体会融化。
        如果让它冻住就会恢复原状，
        但身体的形状会稍稍歪掉。
      en: |-
        Hot days cause its body to melt. It can be
        restored by refreezing it, but the process
        leaves its body slightly warped.
      fr: |-
        Son corps fond les jours de canicule. Il suffit
        heureusement de le congeler pour qu’il reprenne
        forme, mais il restera un tantinet flagada.
      de: |-
        An heißen Tagen schmilzt sein Körper. Friert
        man es ein, nimmt es seine alte Gestalt wieder
        an, aber sein Körper ist leicht verbogen.
      es: |-
        Su cuerpo se derrite en los días calurosos. Al
        congelarse recobra su aspecto original, aunque
        ligeramente deformado.
      it: |-
        Si scioglie nelle giornate calde. Riprende le
        proprie sembianze se viene congelato, pur
        rimanendo leggermente deformato.
    moon:
      ja-Hrkt: |-
        ひょうがきから　そんざい　している。
        こおりの　つぶを　あやつって　てきを
        こおらせたあと　ずつきで　くだく。
      ja: |-
        氷河期から　存在　している。
        氷の　粒を　操って　敵を
        凍らせたあと　頭突きで　砕く。
      ko: |-
        빙하기 때부터 존재해왔다.
        얼음 결정을 조종하여 적을
        얼린 뒤 박치기로 부순다.
      zh-Hant: |-
        從冰河時期就已經存在。
        操縱冰粒讓敵人凍僵後，
        再用頭錘將對方打碎。
      zh-Hans: |-
        从冰河时期就已经存在了。
        操纵冰粒让敌人冻住后，
        用头锤将对方打碎。
      en: |-
        This Pokémon has existed since the Ice Age. It
        controls particles of ice, freezes its opponents,
        and then shatters them with a headbutt.
      fr: |-
        Déjà présent à l’ère glaciaire, ce Pokémon peut
        contrôler les particules de glace pour geler ses
        ennemis, qu’il éclate ensuite d’un coup de boule.
      de: |-
        Dieses Pokémon existiert seit der Eiszeit.
        Es friert seine Gegner mit Eiskörnern ein und
        zerschmettert sie dann mit einem Kopfstoß.
      es: |-
        Sus orígenes se remontan a la era glacial. Usa
        partículas de hielo para congelar a su enemigo y
        hacerlo después añicos de un cabezazo.
      it: |-
        Le sue origini risalgono all’era glaciale.
        Usa granelli di ghiaccio per congelare
        i nemici, che poi riduce in frantumi a testate.
    ultra-sun:
      ja-Hrkt: |-
        こおりの　つぶを　ふきかけて　てきの
        からだを　こおらせる。　アローラの
        バニリッチは　ぜんたいてきに　こがら。
      ja: |-
        氷の粒を　吹きかけて　敵の
        身体を　凍らせる。　アローラの
        バニリッチは　全体的に　小柄。
      ko: |-
        얼음 입자를 세게 내뿜어
        적의 몸을 얼린다. 알로라의
        바닐리치는 전체적으로 몸집이 작다.
      zh-Hant: |-
        會噴出冰粒凍住敵人的身體。
        棲息在阿羅拉的多多冰
        整體來說體型比較小。
      zh-Hans: |-
        喷出冰粒，冻住敌人的身体。
        阿罗拉的多多冰整体都是小型的。
      en: |-
        It sprays its enemies with grains of ice to freeze
        them. Most Vanillish in Alola are smaller
        than average.
      fr: |-
        Il souffle des particules de glace pour geler
        ses ennemis. Les Sorboul d’Alola sont plus
        petits que la moyenne.
      de: |-
        Es friert seine Gegner ein, indem es ihre Körper
        mit einem Atem aus Eiskörnern bedeckt. In Alola
        findet man vergleichsweise kleine Exemplare.
      es: |-
        Exhala partículas de hielo para congelar a sus
        rivales. Los Vanillish de la región de Alola son
        más pequeños que el resto.
      it: |-
        Congela i nemici cospargendoli di granelli di
        ghiaccio. I Vanillish che vivono ad Alola sono
        più piccoli della media.
    ultra-moon:
      ja-Hrkt: |-
        ひょうがきを　いきぬいた　とても
        たくましい　ポケモン。　こと　あつい
        ちほうでは　ばつぐんの　にんき。
      ja: |-
        氷河期を　生き抜いた　とても
        たくましい　ポケモン。　こと　暑い
        地方では　抜群の　人気。
      ko: |-
        빙하기에 꿋꿋하게 살아남은
        매우 강인한 포켓몬. 특히 더운
        지방에서는 뛰어난 인기를 자랑한다.
      zh-Hant: |-
        從冰河期生存下來，
        是非常強壯的寶可夢。
        在天氣炎熱的地方極受歡迎。
      zh-Hans: |-
        从冰河时期生存下来，
        非常魁梧的宝可梦。
        特别是在炎热的地方，极受欢迎。
      en: |-
        This hearty Pokémon survived the Ice Age.
        It’s incredibly popular in very hot regions.
      fr: |-
        Ce robuste Pokémon a survécu à l’ère glaciaire.
        Il est extrêmement populaire dans les régions
        chaudes.
      de: |-
        Gelatroppo sind so widerstandsfähig, dass sie
        sogar eine Eiszeit überdauerten. In warmen
        Regionen erfreuen sie sich großer Beliebtheit.
      es: |-
        Un Pokémon muy resistente que logró sobrevivir
        a la glaciación. En las regiones cálidas goza de
        gran popularidad.
      it: |-
        Un Pokémon incredibilmente robusto, rimasto
        inalterato fin dall’era glaciale. È popolarissimo
        tra gli abitanti delle regioni più calde.
    sword:
      ja-Hrkt: |-
        きれいな　みずを　のんで　こおりの
        からだを　おおきくする。　てんきの
        よい　ひは　あまり　みかけない。
      ja: |-
        きれいな　水を　飲んで　氷の
        体を　大きくする。　天気の
        良い　日は　あまり　見かけない。
      ko: |-
        깨끗한 물을 마셔서 얼음으로 된
        몸을 크게 만든다. 날씨가 맑은
        날에는 잘 발견되지 않는다.
      zh-Hant: |-
        透過喝下乾淨的水
        來讓自己的冰雪身軀成長。
        天氣好的時候很少看到牠。
      zh-Hans: |-
        通过喝下干净的水
        来让自己的冰雪身躯成长。
        天气好的时候很少看到它。
      en: |-
        By drinking pure water, it grows its icy body.
        This Pokémon can be hard to find on days with
        warm, sunny weather.
      fr: |-
        Il boit de l’eau pure pour gonfler son corps
        de glace. On le voit rarement les jours ensoleillés.
      de: |-
        Es vergrößert seinen Eiskörper, indem es klares
        Wasser trinkt. Bei gutem Wetter ist es eher selten
        anzutreffen.
      es: |-
        Bebe agua pura para agrandar su cuerpo de
        hielo. Apenas se ven ejemplares durante los
        días soleados.
      it: |-
        Beve acqua pura per ingrandire il suo corpo
        di ghiaccio. Non si fa vedere in giro nei giorni
        di bel tempo.
    shield:
      ja-Hrkt: |-
        マイナス１００どの　れいきで
        てきを　こおらせるが　いのちまでは
        うばわない　やさしい　きしつ。
      ja: |-
        マイナス１００度の　冷気で
        敵を　凍らせるが　命までは
        奪わない　優しい　気質。
      ko: |-
        마이너스 100도의 냉기로
        적을 얼리지만 목숨은
        뺏지 않는 상냥한 기질을 가졌다.
      zh-Hant: |-
        性情和善，雖然會用
        零下１００度的冷氣凍住敵人，
        但並不會傷及牠們的性命。
      zh-Hans: |-
        性格和善，虽然会用
        零下１００度的冷气冻住敌人，
        但并不会伤及它们的性命。
      en: |-
        It blasts enemies with cold air reaching −148
        degrees Fahrenheit, freezing them solid. But it
        spares their lives afterward—it’s a kind Pokémon.
      fr: |-
        Bien qu’il gèle ses ennemis en soufflant de l’air
        à - 100 °C, sa gentillesse l’empêche de leur ôter
        la vie.
      de: |-
        Dieses Pokémon ist gutmütig. Es friert zwar
        Gegner mit kalter Luft von -100 ºC ein, raubt
        ihnen aber nie das Leben.
      es: |-
        Congela a sus enemigos con un vaho a -100 °C,
        pero no llega a arrebatarles la vida debido a su
        carácter benévolo.
      it: |-
        Congela i nemici con il suo fiato a -100 ºC,
        ma la sua indole gentile gli impedisce
        di infliggere loro danni letali.
