swanna:
  base_happiness: 70
  capture_rate: 45
  color: white
  egg_groups:
    - water1
    - flying
  evolution_chain: ducklett
  evolves_from: ducklett
  flavor_text:
    black:
      en: |-
        Swanna start to dance at dusk.
        The one dancing in the middle is
        the leader of the flock.
      fr: |-
        Ils se mettent à danser à la tombée
        de la nuit. Le Lakmécygne qui danse
        au centre est le chef de la troupe.
    white:
      en: |-
        It administers sharp, powerful pecks
        with its bill. It whips its long neck to
        deliver forceful repeated strikes.
      fr: |-
        Ses coups de bec sont très efficaces.
        Il plie son long cou et en inflige un
        douloureux enchaînement.
    black-2:
      en: |-
        Despite their elegant appearance,
        they can flap their wings strongly
        and fly for thousands of miles.
    white-2:
      en: |-
        Despite their elegant appearance,
        they can flap their wings strongly
        and fly for thousands of miles.
    x:
      ja-Hrkt: |-
        ゆうがな　みかけに　よらず
        つばさで　ちからづよく　はばたき
        すうせんキロ　とびつづけられる。
      ja: |-
        優雅な　みかけに　よらず
        翼で　力強く　羽ばたき
        数千キロ　飛び続けられる。
      ko: |-
        우아한 외모와 다르게
        날개로 힘차게 날개 치며
        수천 km를 계속 날 수 있다.
      en: |-
        Despite their elegant appearance, they can flap
        their wings strongly and fly for thousands of miles.
      fr: |-
        Un Pokémon gracieux, mais aussi robuste. Il peut
        voler des milliers de kilomètres grâce à ses ailes
        puissantes.
      de: |-
        Sie wirken zerbrechlich, aber ihre starken Schwingen
        tragen sie in einem Stück bis zu 1 000 km weit.
      es: |-
        Aunque no lo parezca por su grácil elegancia, puede
        batir con fuerza las alas y volar durante miles de
        kilómetros.
      it: |-
        Non è solo elegante. Con il poderoso battito d’ali
        riesce a volare per migliaia di chilometri senza fermarsi.
    'y':
      ja-Hrkt: |-
        よあけと　ともに　スワンナたちは
        おどりはじめる。まんなかで　おどる
        スワンナが　むれの　リーダー。
      ja: |-
        夜明けと　ともに　スワンナたちは
        踊りはじめる。真ん中で　踊る
        スワンナが　群れの　リーダー。
      ko: |-
        새벽이 오면 스완나들이
        춤추기 시작한다. 한가운데에서 춤추는
        스완나가 무리의 우두머리다.
      en: |-
        Swanna start to dance at dusk. The one dancing in
        the middle is the leader of the flock.
      fr: |-
        Ils se mettent à danser à la tombée de la nuit.
        Le Lakmécygne qui danse au centre est le chef de
        la troupe.
      de: |-
        Wenn der Morgen dämmert, fangen sie an zu tanzen.
        Das Swaroness in der Mitte führt die Gruppe an.
      es: |-
        Comienzan a danzar al amanecer. El líder de la
        bandada se sitúa en el centro.
      it: |-
        Gli Swanna iniziano a ballare quando sorge il sole.
        Il capo del gruppo balla sempre al centro.
    omega-ruby:
      ja-Hrkt: |-
        ゆうがな　みかけに　よらず
