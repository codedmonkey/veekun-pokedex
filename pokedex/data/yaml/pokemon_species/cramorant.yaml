cramorant:
  base_happiness: 50
  capture_rate: 45
  color: blue
  egg_groups:
    - water1
    - flying
  evolution_chain: cramorant
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        あいてを　いちげきで　うちまかすほど
        パワフルだが　わすれっぽいので
        たたかっている　あいてを　わすれる。
      ja: |-
        相手を　一撃で　打ち負かすほど
        パワフルだが　忘れっぽいので
        戦っている　相手を　忘れる。
      ko: |-
        상대를 일격에 쓰러뜨릴 정도로
        파워풀하지만 건망증이 심해서
        싸우고 있는 상대를 잊어버린다.
      zh-Hant: |-
        雖然擁有一擊定勝負的威力，
        但因為記性實在太差，
        對戰還沒結束就會忘記對手是誰。
      zh-Hans: |-
        虽然拥有一击定胜负的威力，
        由于记性实在太差，
        对战还没结束就会忘记对手是谁。
      en: |-
        It’s so strong that it can knock out some
        opponents in a single hit, but it also may
        forget what it’s battling midfight.
      fr: |-
        Il est assez puissant pour terrasser un ennemi
        d’un seul coup, mais il est tellement nigaud
        qu’il oublie contre qui il se bat.
      de: |-
        Es ist so stark, dass es seine Gegner mit einem
        Angriff vernichten könnte, aber zerstreut wie es
        ist, vergisst es öfters, wen es gerade bekämpft.
      es: |-
        Su colosal potencia le permite machacar al rival
        de un solo golpe, aunque su carácter despistado
        lo lleva a olvidarse de su presencia.
      it: |-
        È così potente che può sconfiggere l’avversario
        in un colpo solo, ma è talmente smemorato che
        si dimentica perfino con chi stava lottando.
    shield:
      ja-Hrkt: |-
        くいしんぼうで　エサの　サシカマスを
        まるのみするが　たまに　まちがえて
        ほかの　ポケモンに　くらいつく。
      ja: |-
        食いしん坊で　エサの　サシカマスを
        丸飲みするが　たまに　間違えて
        ほかの　ポケモンに　食らいつく。
      ko: |-
        먹보이다. 먹이인 찌로꼬치를
        통째로 삼키지만 가끔 실수로
        다른 포켓몬을 먹어버린다.
      zh-Hant: |-
        非常貪吃，會把刺梭魚整隻
        吞進嘴裡。偶爾也會搞錯對象
        去咬其他的寶可夢。
      zh-Hans: |-
        非常贪吃，会把刺梭鱼整只
        吞进嘴里。偶尔也会搞错对象
        去咬其他的宝可梦。
      en: |-
        This hungry Pokémon swallows Arrokuda whole.
        Occasionally, it makes a mistake and tries to
        swallow a Pokémon other than its preferred prey.
      fr: |-
        Très glouton, il avale les Embrochet d’une seule
        bouchée, mais il lui arrive de se tromper
        et de tenter de gober un autre Pokémon.
      de: |-
        Es ist ein Vielfraß, der seine Beute, Pikuda,
        im Ganzen verschlingt. Manchmal erwischt es
        jedoch irrtümlicherweise ein anderes Pokémon.
      es: |-
        Traga Arrokuda enteros debido a su glotonería,
        tan notable que en ocasiones ingiere hasta otros
        Pokémon sin querer.
      it: |-
        È molto ingordo e ingoia tutti interi gli Arrokuda
        di cui si nutre. A volte ingoia anche altri
        Pokémon per sbaglio.
