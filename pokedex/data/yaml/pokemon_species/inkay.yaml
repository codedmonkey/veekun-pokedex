inkay:
  base_happiness: 50
  capture_rate: 190
  color: blue
  egg_groups:
    - water1
    - water2
  evolution_chain: inkay
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        はっこうたいの　てんめつを　みつめた
        あいては　めが　くらみ　たたかう
        きもちが　なくなってしまうのだ。
      ja: |-
        発光体の　点滅を　見つめた　相手は
        目が　くらみ　戦う　気持ちが
        なくなってしまうのだ。
      ko: |-
        깜빡이는 발광체를 바라본
        상대는 눈앞이 어두컴컴해져
        전의를 상실해버리고 만다.
      en: |-
        Opponents who stare at the flashing of the
        light-emitting spots on its body become
        dazed and lose their will to fight.
      fr: |-
        Éblouis par les points lumineux qui clignotent sur son
        corps, les ennemis perdent toute envie de se battre.
      de: |-
        Gegner, die auf die blinkenden Punkte an seinem
        Körper blicken, werden geblendet und verlieren den
        Willen zu kämpfen.
      es: |-
        Los enemigos que contemplan el titilante fulgor de su
        brillante cuerpo terminan mareándose y pierden las
        ganas de continuar combatiendo.
      it: |-
        I nemici che guardano la luce lampeggiante emessa
        dal suo corpo rimangono abbagliati e perdono il loro
        spirito combattivo.
    'y':
      ja-Hrkt: |-
        ひかりの　てんめつで　おそってきた
        てきの　せんいを　なくしてしまう。
        その　すきに　すがたを　かくすのだ。
      ja: |-
        光の　点滅で　襲ってきた　敵の
        戦意を　なくしてしまう。
        その　すきに　姿を　くらますのだ。
      ko: |-
        빛을 깜박여서 덮쳐온
        적의 전의를 잃게 한다.
        그 틈에 모습을 감춘다.
      en: |-
        It flashes the light-emitting spots on its body,
        which drains its opponent’s will to fight.
        It takes the opportunity to scuttle away and hide.
      fr: |-
        Il ébranle le moral des ennemis lui cherchant noise
        grâce aux clignotements qu’il émet.
        Il profite de cette diversion pour se cacher.
      de: |-
        Mit den blinkenden Punkten auf seinem Körper raubt
        es Gegnern den Kampfeswillen. Es nutzt diese
        Gelegenheit, um sich zu verstecken.
      es: |-
        La luz intermitente que emite aplaca el ánimo de
        lucha del enemigo. Aprovecha la ocasión para
        esconderse.
      it: |-
        Fa lampeggiare i motivi sul suo corpo in una sequenza
        ipnotica per far perdere lo spirito combattivo ai nemici,
        riuscendo così a fuggire.
    omega-ruby:
      ja-Hrkt: |-
