        per far perdere lo spirito combattivo ai nemici, riuscendo così
        a fuggire.
    ultra-sun:
      ja-Hrkt: |-
        ひかりを　てんめつさせて　えものを
        おびきよせると　ながい　しょくしゅで
        からめとり　うごきを　ふうじるぞ。
      ja: |-
        光を　点滅させて　獲物を
        おびきよせると　長い　触手で
        絡めとり　動きを　封じるぞ。
      ko: |-
        빛을 깜박여 먹이를 꾀어내고
        긴 촉수로 포박하여
        움직이지 못하게 한다.
      zh-Hant: |-
        會利用閃爍的光吸引獵物靠近，
        然後用長長的觸手纏住對手，
        封鎖獵物的行動。
      zh-Hans: |-
        闪烁着光，让猎物受诱惑靠近后，
        会用长长的触手缠住对方，
        封住其行动。
      en: |-
        It draws prey near with its blinking lights and
        then wraps them up in its long tentacles and
        holds them in place.
      fr: |-
        Il attire ses proies en faisant clignoter
        son corps, puis les immobilise en les enserrant
        de ses longs tentacules.
      de: |-
        Mit den blinkenden Punkten auf seinem Körper
        lockt es Beute an, um sie dann mit seinen langen
        Tentakeln bewegungsunfähig zu machen.
      es: |-
        Los destellos que emite atraen a su presa, a la
        que rodea con sus largos tentáculos e inmoviliza
        por completo.
      it: |-
        Attira a sé la preda con luci lampeggianti
        per poi immobilizzarla avvinghiandola con
        i suoi tentacoli.
    ultra-moon:
      ja-Hrkt: |-
        なかまと　じょうほう　こうかんを
        するとき　からだの　はっこうたいを
        ふくざつな　リズムで　ひからせる。
      ja: |-
        仲間と　情報　交換を
        するとき　身体の　発光体を
        複雑な　リズムで　光らせる。
      ko: |-
        동료와 정보 교환을 할 때
        몸의 발광체를
        복잡한 리듬으로 빛낸다.
      zh-Hant: |-
        與夥伴交換訊息時，
        會讓身上的發光體
        以複雜的節奏發光。
      zh-Hans: |-
        与伙伴交换信息时，
        会让身上的发光体
        以复杂的节奏发光。
      en: |-
        When exchanging information with others of its
        kind, it flashes the light-emitting spots on its
        body in a complex rhythm.
      fr: |-
        Il fait clignoter ses points lumineux à différentes
        fréquences pour échanger des informations
        avec ses congénères.
      de: |-
        Wenn es mit seinen Artgenossen kommuniziert,
        lässt es die leuchtenden Punkte auf seinem
        Körper in einem komplexen Rhythmus blinken.
      es: |-
        Los complejos patrones de destellos que emite
        con sus órganos luminosos le permiten
        comunicarse con sus congéneres.
      it: |-
        Scambia informazioni con i suoi simili facendo
        lampeggiare i motivi sul suo corpo in sequenze
        complesse.
    sword:
      ja-Hrkt: |-
        かいてんしながら　はっこうたいを
        てんめつ。　ひかりの　パターンで
        なかまと　コミュニケーションする。
      ja: |-
        回転しながら　発光体を
        点滅。　光の　パターンで
        仲間と　コミュニケーションする。
      ko: |-
        회전하면서 발광체를
        깜빡인다. 빛의 패턴으로
        동료와 의사소통한다.
      zh-Hant: |-
        旋轉著閃爍自己的發光體。
        透過改變閃爍的方式
        來和其他夥伴交流。
      zh-Hans: |-
        旋转着闪烁自己的发光体。
        通过改变闪烁的方式
        来和其他伙伴交流。
      en: |-
        It spins while making its luminescent spots flash.
        These spots allow it to communicate with others
        by using different patterns of light.
      fr: |-
        Il fait clignoter son corps lumineux en tournoyant.
        Il communique avec ses congénères à l’aide
        de signaux de lumière.
      de: |-
        Es dreht sich und lässt dabei Punkte auf seinem
        Körper blinken. Durch bestimmte Lichtmuster
        kann es mit seinen Artgenossen kommunizieren.
      es: |-
        Gira sobre sí mismo emitiendo luz intermitente
        con la que crea señales para comunicarse con
        los suyos.
      it: |-
        Gira su se stesso facendo lampeggiare i motivi
        che ha sul corpo. Comunica con i suoi simili
        emettendo segnali luminosi.
    shield:
      ja-Hrkt: |-
        てきに　はっこうたいの　てんめつを
        あびせて　せんいを　なくしてしまう。
        その　すきに　にげだすのだ。
      ja: |-
        敵に　発光体の　点滅を
        浴びせて　戦意を　なくしてしまう。
        その　隙に　逃げ出すのだ。
      ko: |-
        상대를 향해 발광체를 깜빡여서
        전의를 상실시킨다.
        그 틈에 도망간다.
      zh-Hant: |-
        會讓敵人看到自己閃爍的
        發光體來讓對方喪失戰意，
        然後趁機逃之夭夭。
      zh-Hans: |-
        会让敌人看到自己闪烁的
        发光体来让对方丧失战意，
        然后趁机逃之夭夭。
      en: |-
        By exposing foes to the blinking of its
        luminescent spots, Inkay demoralizes them,
        and then it seizes the chance to flee.
      fr: |-
        Il sape la combativité de son adversaire en faisant
        clignoter son corps lumineux, puis profite
        de cet instant de répit pour s’enfuir.
      de: |-
        Es lässt die Punkte auf seinem Körper blinken,
        um Gegnern den Kampfeswillen zu rauben.
        Diesen Moment nutzt es dann, um zu fliehen.
      es: |-
        Los destellos de luz intermitente que emite
        aplacan el ánimo de lucha del enemigo, tras lo
        que aprovecha para esconderse.
      it: |-
        Fa perdere ai nemici lo spirito combattivo
        grazie alla luce lampeggiante che emette
        dal suo corpo e ne approfitta per scappare.
