        combattivo.
    alpha-sapphire:
      ja-Hrkt: |-
        ひかりの　てんめつで　おそってきた
        てきの　せんいを　なくしてしまう。
        その　すきに　すがたを　かくすのだ。
      ja: |-
        光の　点滅で　襲ってきた　敵の
        戦意を　なくしてしまう。
        その　すきに　姿を　くらますのだ。
      ko: |-
        빛을 깜박여서 덮쳐온
        적의 전의를 잃게 한다.
        그 틈에 모습을 감춘다.
      en: |-
