beheeyem:
  base_happiness: 50
  capture_rate: 90
  color: brown
  egg_groups:
    - humanshape
  evolution_chain: elgyem
  evolves_from: elgyem
  flavor_text:
    black:
      en: |-
        It can manipulate an opponent’s memory.
        Apparently, it communicates by flashing
        its three different-colored fingers.
      fr: |-
        Il peut manipuler les souvenirs de
        ses ennemis et fait clignoter ses doigts
        tricolores pour discuter avec ses amis.
    white:
      en: |-
        It uses psychic power
        to control an opponent’s brain
        and tamper with its memories.
      fr: |-
        Il manipule l’esprit avec ses pouvoirs
        psychiques et peut modifier les images
        conservées dans les souvenirs.
    black-2:
      en: |-
        Apparently, it communicates by flashing
        its three fingers, but those patterns
        haven’t been decoded.
    white-2:
      en: |-
        Apparently, it communicates by flashing
        its three fingers, but those patterns
        haven’t been decoded.
    x:
      ja-Hrkt: |-
        ゆびさきを　てんめつ　させて
        かいわするらしいが　その　パターンは
        まだ　かいどく　できていない。
      ja: |-
        指先を　点滅　させて
        会話するらしいが　その　パターンは
        まだ　解読　できていない。
      ko: |-
        손끝을 점멸시켜서
        대화하는 듯하나 그 패턴은
        아직 해독하지 못했다.
      en: |-
        Apparently, it communicates by flashing its three
        fingers, but those patterns haven’t been decoded.
      fr: |-
        Il fait clignoter ses doigts tricolores pour communiquer
        avec ses semblables. Son langage reste un mystère.
      de: |-
        Es spricht, indem es seine Fingerspitzen leuchten
        lässt, doch noch konnte der Code dahinter nicht
        entziffert werden.
      es: |-
        Parece que se comunica haciendo brillar sus dedos
        tricolores, pero nadie ha conseguido descifrar aún su
        patrón.
      it: |-
        Dialoga con i suoi simili tramite le luci sui suoi arti,
        ma il suo linguaggio è ancora un mistero.
    'y':
      ja-Hrkt: |-
        サイコパワーで　あいての　のうみそを
        あやつり　きおくする　えいぞうを
        ちがう　ものに　かきかえてしまう。
      ja: |-
        サイコパワーで　相手の　脳みそを
        操り　記憶する　映像を
        違う　ものに　書き換えてしまう。
      ko: |-
        사이코 파워로 상대의 뇌를
        조종하여 기억된 영상을
        다른 것으로 바꿔 버린다.
      en: |-
        It uses psychic power to control an opponent’s
        brain and tamper with its memories.
      fr: |-
        Il manipule l’esprit avec ses pouvoirs psychiques
        et peut modifier les images conservées dans les
        souvenirs.
      de: |-
        Es manipuliert die Gehirne seiner Gegner mit
        Psycho-Kräften, indem es die Bilder ihrer
        Erinnerungen umgestaltet.
      es: |-
        Controla el cerebro del rival con su poder psíquico y
        manipula sus recuerdos.
      it: |-
        Controlla il cervello dell’avversario con poteri psichici
        e ne sostituisce i ricordi.
    omega-ruby:
      ja-Hrkt: |-
        ゆびさきを　てんめつ　させて
        かいわするらしいが　その　パターンは
        まだ　かいどく　できていない。
      ja: |-
        指先を　点滅　させて
        会話するらしいが　その　パターンは
        まだ　解読　できていない。
      ko: |-
        손끝을 점멸시켜서
        대화하는 듯하나 그 패턴은
        아직 해독하지 못했다.
      en: |-
        Apparently, it communicates by flashing its three
        fingers, but those patterns haven’t been decoded.
      fr: |-
        Il fait clignoter ses doigts tricolores pour communiquer
        avec ses semblables. Son langage reste un mystère.
      de: |-
        Es spricht, indem es seine Fingerspitzen leuchten lässt,
        doch noch konnte der Code dahinter nicht entziffert werden.
      es: |-
        Parece que se comunica haciendo brillar sus dedos tricolores,
        pero nadie ha conseguido descifrar aún su patrón.
      it: |-
        Dialoga con i suoi simili tramite le luci sui suoi arti, ma il suo
        linguaggio è ancora un mistero.
    alpha-sapphire:
      ja-Hrkt: |-
        サイコパワーで　あいての　のうみそを
        あやつり　きおくする　えいぞうを
        ちがう　ものに　かきかえてしまう。
      ja: |-
        サイコパワーで　相手の　脳みそを
        操り　記憶する　映像を
        違う　ものに　書き換えてしまう。
      ko: |-
        사이코 파워로 상대의 뇌를
        조종하여 기억된 영상을
        다른 것으로 바꿔 버린다.
      en: |-
        It uses psychic power to control an opponent’s
        brain and tamper with its memories.
      fr: |-
        Il manipule l’esprit avec ses pouvoirs psychiques et peut
        modifier les images conservées dans les souvenirs.
      de: |-
        Es manipuliert die Gehirne seiner Gegner mit Psycho-Kräften,
        indem es die Bilder ihrer Erinnerungen umgestaltet.
      es: |-
        Controla el cerebro del rival con su poder psíquico y manipula
        sus recuerdos.
      it: |-
        Controlla il cervello dell’avversario con poteri psichici e ne
        sostituisce i ricordi.
    ultra-sun:
      ja-Hrkt: |-
        サイコパワーで　あいての　きおくを
        かきかえてしまう。　あなたも　すでに
        かきかえられているかも　しれない。
      ja: |-
        サイコパワーで　相手の　記憶を
        書き換えてしまう。　あなたも　既に
        書き換えられているかも　しれない。
      ko: |-
        사이코 파워로 상대 기억을
        바꿔 버린다. 당신도 이미
        바뀐 기억일지도 모른다.
      zh-Hant: |-
        會用精神力量竄改
        對手的記憶。你的記憶
        說不定也已經被竄改了。
      zh-Hans: |-
        会用精神力量改写对手的记忆。
        你说不定也已经被改写了。
      en: |-
        With its psychic powers, it rewrites its
        opponents’ memories. You, too, may have
        already had your memories rewritten.
      fr: |-
        Il peut modifier les souvenirs avec ses pouvoirs
        psychiques. Vous ne le savez pas encore,
        mais vous avez peut-être déjà tout oublié...
      de: |-
        Mithilfe seiner Psycho-Kräfte gestaltet es die
        Erinnerungen anderer um. Man weiß nie, ob es
        einen selbst bereits erwischt hat.
      es: |-
        Es capaz de alterar los recuerdos de sus rivales
        gracias a su poder psíquico. De hecho, quizá ya
        haya alterado los tuyos y no lo sepas.
      it: |-
        Modifica i ricordi degli avversari servendosi dei
        suoi poteri psichici. E chissà... può darsi che
        abbia già alterato anche la tua memoria!
    ultra-moon:
      ja-Hrkt: |-
        つよい　サイコパワーを　もっている。
        ３しょくに　ひかる　ゆびで　あいてを
        あやつり　きおくを　かきかえてしまう。
      ja: |-
        強い　サイコパワーを　持っている。
        ３色に　光る　指で　相手を
        操り　記憶を　書き換えてしまう。
      ko: |-
        강한 사이코 파워를 가지고 있다.
        3가지 색으로 빛나는 손가락으로
        상대를 조종해 기억을 바꿔 버린다.
      zh-Hant: |-
        擁有強大的精神力量。
        會用發出３色光輝的手指
        操縱對手，改寫記憶。
      zh-Hans: |-
        拥有强大的精神力量。
        会用发着３色光的手指
        操纵对手，改写记忆。
      en: |-
        It has strong psychic powers. Using its fingers
        that flash three different colors, it controls its
        opponents and rewrites their memories.
      fr: |-
        Ses pouvoirs psychiques sont redoutables.
        Il peut contrôler ses adversaires et modifier
        leurs souvenirs grâce à ses doigts tricolores.
      de: |-
        Es verfügt über mächtige Psycho-Kräfte. Seine
        in drei Farben leuchtenden Finger manipulieren
        andere und gestalten ihre Erinnerungen um.
      es: |-
        Este Pokémon, de un poder psíquico increíble,
        controla a sus oponentes y altera sus recuerdos
        mediante la luz de sus dedos tricolores.
      it: |-
        È dotato di potenti poteri psichici. Controlla
        l’avversario tramite le dita, che emettono luci
        di tre colori in grado di modificare i ricordi.
    sword:
      ja-Hrkt: |-
        オーベムが　あらわれた　ぼくじょう
        からは　いつのまにか　バイウールーが
        １ぴき　すがたを　けしてしまう。
      ja: |-
        オーベムが　現れた　牧場
        からは　いつの間にか　バイウールーが
        １匹　姿を　消してしまう。
      ko: |-
        벰크가 나타난 목장에서는
        배우르 1마리가
        어느샌가 모습을 감춘다.
      zh-Hant: |-
        如果大宇怪出現在牧場裡，
        那麼就會有１隻毛毛角羊
        在不知不覺間消失。
      zh-Hans: |-
        如果大宇怪出现在牧场里，
        那么就会有１只毛毛角羊
        在不知不觉间消失。
      en: |-
        Whenever a Beheeyem visits a farm,
        a Dubwool mysteriously disappears.
      fr: |-
        À chaque fois que Neitram se matérialise
        dans une pâture, un Moumouflon disparaît
        dans des circonstances mystérieuses.
      de: |-
        Jedes Mal, wenn ein Megalon auf einer Farm
        auftaucht, verschwindet bald darauf ein Zwollock
        unter mysteriösen Umständen.
      es: |-
        Por algún extraño motivo, siempre que se avista
        un Beheeyem en una granja desaparece un
        Dubwool.
      it: |-
        Per qualche strano motivo, nelle fattorie in cui
        compare un Beheeyem sparisce sempre
        un Dubwool.
    shield:
      ja-Hrkt: |-
        あいての　きおくを　そうさできる。
        むぎばたけの　うえを　さまよう
        すがたが　ときおり　もくげきされる。
      ja: |-
        相手の　記憶を　操作できる。
        麦畑の　上を　さまよう
        姿が　ときおり　目撃される。
      ko: |-
        상대의 기억을 조작할 수 있다.
        보리밭 위를 떠도는
        모습이 가끔 목격된다.
      zh-Hant: |-
        能控制對方的記憶。
        經常有人看到牠
        在麥田的上方徘徊。
      zh-Hans: |-
        能控制对方的记忆。
        经常有人看到它
        在麦田的上方徘徊。
      en: |-
        Sometimes found drifting above wheat fields,
        this Pokémon can control the memories of
        its opponents.
      fr: |-
        Il peut manipuler les souvenirs de son adversaire
        à loisir. Parfois, on l’aperçoit en train de
        vagabonder au-dessus des champs de blé.
      de: |-
        Es kann die Gedanken anderer manipulieren.
        Manchmal wird es dabei beobachtet, wie es
        über Weizenfelder gleitet.
      es: |-
        Es capaz de manipular los recuerdos del rival.
        Se lo avista en ocasiones vagando por campos
        de trigo.
      it: |-
        Può manipolare la memoria dell’avversario.
        A volte lo si vede vagare sopra i campi di grano.
