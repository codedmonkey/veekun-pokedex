        3 000 m en retenant son souffle.
    black-2:
      en: |-
        It can sometimes knock out opponents
        with the shock created by breaching and
        crashing its big body onto the water.
    white-2:
      en: |-
        It can sometimes knock out opponents
        with the shock created by breaching and
        crashing its big body onto the water.
    x:
      ja-Hrkt: |-
        おおきな　からだを　なみのうえで
        ジャンプさせ　しょうげきを　うみだし
        あいてを　きぜつ　させることがある。
      ja: |-
        大きな　体を　波の上で
        ジャンプさせ　衝撃を　生みだし
        相手を　気絶　させることがある。
      ko: |-
        커다란 몸을 파도 위에서
        점프시켜 충격을 만들어
        상대를 기절시킬 때가 있다.
      en: |-
        It can sometimes knock out opponents with the
        shock created by breaching and crashing its big
        body onto the water.
      fr: |-
        L’énorme fracas résultant de ses sauts par-dessus
        les vagues peut faire perdre connaissance à ses
        adversaires.
      de: |-
        Springt es mit seinem gewaltigen Körper von einer
        Welle ab, kann es Gegner allein mit der Wucht des
        Aufpralls besiegen.
      es: |-
        Puede dejar fuera de combate a sus oponentes con el
        impacto de su enorme cuerpo al caer en el agua tras
        un salto.
      it: |-
        L’impatto creato dai suoi salti fuori e dentro l’acqua
        può arrivare a mandare KO un avversario.
    'y':
      ja-Hrkt: |-
        いちばん　おおきい　ポケモン。
        いきつぎせずに　３０００メートルの
        ふかさまで　もぐることが　できる。
      ja: |-
        一番　大きい　ポケモン。
        息つぎせずに　３０００メートルの
        深さまで　潜ることが　できる。
      ko: |-
        제일 큰 포켓몬이다.
        숨을 들이쉬지 않고 3000m의
        깊이까지 잠수할 수 있다.
      en: |-
        The biggest of all Pokémon. It can dive to a depth
        of almost 10,000 feet on only one breath.
      fr: |-
        Le plus grand des Pokémon. Il peut plonger à
        une profondeur de 3 000 m en retenant son souffle.
      de: |-
        Das größte Pokémon. Es kann mit nur einem Atemzug
        in Tiefen bis 3 000 m tauchen.
      es: |-
        Es el más grande de los Pokémon. Puede nadar a una
        profundidad de 3000 m aguantando la respiración.
      it: |-
        Il Pokémon più grande che esista. Dopo aver inalato
        aria, si immerge a una profondità di 3000 m.
    omega-ruby:
      ja-Hrkt: |-
        みつかった　なかでは　さいだいの　ポケモン。
        おおうなばらを　ゆったりと　およぎ　おおきな
        くちで　いっきに　たいりょうの　エサを　たべる。
      ja: |-
        見つかった　中では　最大の　ポケモン。
        大海原を　ゆったりと　泳ぎ　大きな
        口で　一気に　大量の　エサを　食べる。
      ko: |-
        발견된 것 중 가장 큰 포켓몬이다.
        크고 넓은 바다를 느긋이 헤엄치며
        큰 입으로 한 번에 대량의 먹이를 먹는다.
      en: |-
        Wailord is the largest of all identified Pokémon up to now.
        This giant Pokémon swims languorously in the vast open sea,
        eating massive amounts of food at once with its enormous
        mouth.
      fr: |-
        Wailord est le plus grand Pokémon découvert à ce jour.
        Ce Pokémon géant nage lascivement dans les grandes
        étendues maritimes, avalant d’énormes quantités
        de nourriture en une seule de ses monstrueuses bouchées.
      de: |-
        Wailord ist bisher das größte aller identifizierten Pokémon.
        Es schwimmt reglos auf dem offenen Meer und nimmt mit
        seinem enormen Maul riesige Mengen an Nahrung auf.
      es: |-
        Wailord es el mayor Pokémon registrado hasta la fecha. Este
        coloso va nadando lánguidamente por el ancho mar con la
        boca abierta para que penetre la mayor cantidad posible de
        alimento.
      it: |-
        Wailord è il più grande tra tutti i Pokémon finora identificati.
        Con la sua gigante mole nuota dolcemente nella vastità
        del mare aperto, ingoiando enormi quantità di cibo con
        la bocca enorme.
    alpha-sapphire:
      ja-Hrkt: |-
        えものを　おいたてる　ために　すいちゅうから
        ジャンプして　おおきな　みずしぶきを　あげる。
        むれで　ジャンプする　すがたは　だいはくりょく。
      ja: |-
        獲物を　追い立てる　ために　水中から
        ジャンプして　大きな　水しぶきを　あげる。
        群れで　ジャンプする　姿は　大迫力。
      ko: |-
        먹이를 몰아가기 위해서 물속부터
        점프하여 큰 물보라를 일으킨다.
        무리로 점프하는 모습은 박력이 넘친다.
      en: |-
        When chasing prey, Wailord herds them by leaping out of the
        water and making a humongous splash. It is breathtaking to
        see this Pokémon leaping out of the sea with others in its pod.
      fr: |-
        Lorsqu’il chasse ses proies, Wailord les rassemble en sautant
        hors de l’eau et en créant une énorme vague. La vue de
        plusieurs de ces Pokémon bondissant hors de l’eau laisse
        généralement sans voix.
      de: |-
        Wailord jagt seine Beute, indem es aus dem Meer
        herausspringt und ein gewaltiges Platschen erzeugt.
        Es ist atemberaubend, eine Gruppe dieser Pokémon
        aus dem Wasser springen zu sehen.
      es: |-
        Wailord caza con otros miembros de su especie. Es
        espectacular ver cómo saltan y chapotean en el agua para
        agrupar a sus presas. Realmente impresiona ver cómo
        impactan contra el agua.
      it: |-
        Cacciando le prede, i Wailord eseguono balzi e tuffi
        spettacolari in acqua. È davvero uno spettacolo mozzafiato
        vedere questi Pokémon esibirsi in branco.
    sun:
      ja-Hrkt: |-
        むれで　えものを　おう　しゅうせい。
        おおきな　くちで　ヨワシの　むれごと
        いっきに　のみこんでしまうぞ。
      ja: |-
        群れで　獲物を　追う　習性。
        大きな　口で　ヨワシの　群れごと
        一気に　呑み込んでしまうぞ。
      ko: |-
        무리 지어 먹이를 쫓는 습성이 있다.
        큰 입으로 약어리의 무리를
        통째로 삼켜버린다.
      zh-Hant: |-
        有成群結隊追逐獵物的習性。
        會用大大的嘴巴將整群的弱丁魚
        一口氣吞下。
      zh-Hans: |-
        有成群结队追逐猎物的习性。
        用大大的嘴巴将弱丁鱼群
        一口气尽数吞下。
      en: |-
        Wailord pursue their prey in pods. With their
        large mouths, they can swallow entire schools
        of Wishiwashi whole.
      fr: |-
        Il a pour habitude de chasser en groupe.
        Sa large gueule lui permet d’engloutir un banc
        de Froussardine d’un seul coup.
      de: |-
        Wailord jagt seine Beute in der Gruppe. Mit
        seinem enormen Maul kann es ganze Schwärme
        von Lusardin auf einmal verschlingen.
      es: |-
        Tienen el hábito de cazar en grupo. Con sus
        tremendas bocas pueden engullir de un trago
        bancos enteros de Wishiwashi.
      it: |-
        Ha l’abitudine di cacciare le prede in branco.
        Con la sua enorme bocca può inghiottire
        in un colpo solo un banco di Wishiwashi.
    moon:
      ja-Hrkt: |-
        とにかく　どでかいので　にんき。
        ホエルオーウォッチングは　かくちで
        にんきの　かんこうプラン　なのだ。
      ja: |-
        とにかく　どでかいので　人気。
        ホエルオーウォッチングは　各地で
        人気の　観光プラン　なのだ。
      ko: |-
        어찌 됐든 거대해서 인기가 있다.
        고래왕 워칭은 각지에서
        인기 있는 관광 코스다.
      zh-Hant: |-
        因為無比巨大而受歡迎。
        觀看吼鯨王的生態在各地都是
        非常受歡迎的遊覽項目。
      zh-Hans: |-
        总之，因为超级巨大而受欢迎。
        观看吼鲸王在各地都是
        非常受欢迎的游览项目。
      en: |-
        Its immense size is the reason for its popularity.
        Wailord watching is a favorite sightseeing
        activity in various parts of the world.
      fr: |-
        Sa taille fait de lui un Pokémon fascinant.
        Les sites touristiques proposant d’observer
        les Wailord ont toujours beaucoup de succès.
      de: |-
        Es ist allein schon aufgrund seiner schieren
        Größe sehr beliebt. Wailord-Watching gilt
        vielerorts als beliebte Touristenattraktion.
      es: |-
        Su descomunal tamaño lo convierte en un
        Pokémon muy popular. Los enclaves turísticos
        donde se observan Wailord son todo un éxito.
      it: |-
        È molto amato per la sua enorme stazza.
        Il Wailord watching è un’attività turistica
        popolare in tutto il mondo.
    ultra-sun:
      ja-Hrkt: |-
        あまりに　たくさん　さかなポケモンを
        くらうので　かずが　ふえすぎると
        りょうしたちに　おいはらわれている。
      ja: |-
        あまりに　たくさん　さかなポケモンを
        食らうので　数が　増えすぎると
        漁師たちに　追い払われている。
      ko: |-
        너무 많은 물고기포켓몬을
        먹기 때문에 개체 수가 많이 늘어나면
        어부들에게 내쫓긴다.
      zh-Hant: |-
        因為會吃掉太多的魚寶可夢，
        一旦牠們的數量增加得太多，
        就會遭到漁夫們的驅趕。
      zh-Hans: |-
        因为会吃太多的鱼宝可梦，
        所以数量增加过多的话，会被渔夫们驱赶。
      en: |-
        They eat so many fish Pokémon that when
        Wailord become too numerous, fishermen have
        to chase them off.
      fr: |-
        Les Wailord se sont multipliés à force de se
        gaver de Pokémon poissons, tant et si bien que
        les pêcheurs doivent les renvoyer vers le large.
      de: |-
        Sie verzehren Unmengen an Fisch-Pokémon,
        weshalb sie von Fischern vertrieben werden,
        wenn sie sich zu stark vermehren.
      es: |-
        Debido a su voraz apetito por los Pokémon pez,
        los pescadores se ven obligados a controlar su
        número si proliferan demasiado.
      it: |-
        Si nutrono di enormi quantità di Pokémon
        acquatici. Quando diventano troppo numerosi,
        i pescatori li allontanano.
    ultra-moon:
      ja-Hrkt: |-
        ちいさな　ホエルコが　サメハダーや
        ダダリンに　おそわれると　むれの
        なかまが　いちがんになって　まもる。
      ja: |-
        小さな　ホエルコが　サメハダーや
        ダダリンに　襲われると　群れの
        仲間が　一丸になって　守る。
      ko: |-
        작은 고래왕자가 샤크니아나
        타타륜에게 공격당하면 무리의
        동료들이 한마음이 되어 지켜 준다.
      zh-Hant: |-
        當體型小的吼吼鯨被巨牙鯊
        或破破舵輪襲擊時，群體的夥伴
        就會團結起來一起守護。
      zh-Hans: |-
        小小的吼吼鲸如果被
        巨牙鲨和破破舵轮袭击的话，
        群体伙伴就会团结一致来守护。
      en: |-
        When a small Wailmer is attacked by Sharpedo
        or Dhelmise, its whole pod works together to
        protect it.
      fr: |-
        Si un petit Wailmer vient à se faire attaquer par
        un Sharpedo ou un Sinistrail, les Wailord du banc
        se regroupent autour de lui pour le protéger.
      de: |-
        Wenn ein kleines Wailmer von Tohaido oder
        Moruda angegriffen wird, schließt sich der Rest
        seiner Gruppe zusammen und beschützt es.
      es: |-
        Cuando un Sharpedo o un Dhelmise acechan a
        un pequeño Wailmer, el banco entero de Wailord
        se une para protegerlo.
      it: |-
        Se un piccolo Wailmer viene attaccato da uno
        Sharpedo o da un Dhelmise, gli altri Wailord
        gli si raggruppano attorno per proteggerlo.
    sword:
      ja-Hrkt: |-
        おおきな　からだを　なみのうえで
        ジャンプさせ　しょうげきを　うみだし
