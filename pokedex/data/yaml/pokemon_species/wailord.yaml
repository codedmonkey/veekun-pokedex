        점프해서 그 충격으로
        상대를 기절시킬 때가 있다.
      zh-Hant: |-
        有時會讓大大的身體
        在波浪上跳躍，藉此
        製造出衝擊讓對手昏迷。
      zh-Hans: |-
        有时会让大大的身体在波浪上跳跃，
        并以此来产生冲击让对手昏迷。
      en: |-
        It can sometimes knock out opponents
        with the shock created by breaching and
        crashing its big body onto the water.
      fr: |-
        L’énorme fracas causé par ses sauts par-dessus
        les vagues peut faire perdre connaissance
        à ses adversaires.
      de: |-
        Springt es mit seinem gewaltigen Körper von
        einer Welle ab, kann es Gegner allein mit der
        Wucht des Aufpralls besiegen.
      es: |-
        Puede dejar fuera de combate a sus oponentes
        con el impacto de su enorme cuerpo al caer en
        el agua tras uno de sus saltos.
      it: |-
        Con l’impatto creato dal suo enorme corpo
        quando salta sulle onde è perfino in grado di far
        perdere i sensi all’avversario.
    shield:
      ja-Hrkt: |-
