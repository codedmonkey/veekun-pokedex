        ホエルオーウォッチングは　各地で
        人気の　観光プラン　なのだ。
      ko: |-
        엄청나게 거대해서 인기가 있다.
        고래왕 워칭은 각지에서
        인기 있는 관광 코스다.
      zh-Hant: |-
