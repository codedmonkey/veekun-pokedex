golett:
  base_happiness: 50
  capture_rate: 190
  color: green
  egg_groups:
    - mineral
  evolution_chain: golett
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        The energy that burns inside it
        enables it to move, but no one has yet
        been able to identify this energy.
      fr: |-
        Il se meut grâce à l’énergie stockée
        dans son corps. Personne ne sait d’où
        vient cette énergie mystérieuse.
    white:
      en: |-
        These Pokémon are thought to have been
        created by the science of an ancient
        and mysterious civilization.
      fr: |-
        On pense que ce Pokémon est
        le produit de la technologie
        d’une civilisation ancienne.
    black-2:
      en: |-
        Ancient science fashioned this
        Pokémon from clay. It’s been
        active for thousands of years.
    white-2:
      en: |-
        Ancient science fashioned this
        Pokémon from clay. It’s been
        active for thousands of years.
    x:
      ja-Hrkt: |-
        たいないで　もえる　エネルギーに
        よって　かつどうしているが　どんな
        エネルギーなのかは　ふめいである。
      ja: |-
        体内で　燃える　エネルギーに　よって
        活動しているが　どんな
        エネルギーなのかは　不明である。
      ko: |-
        체내에서 불타는 에너지로
        인해 활동하고 있지만 어떤
        에너지인지는 불명이다.
      en: |-
        The energy that burns inside it enables it to move,
        but no one has yet been able to identify
        this energy.
      fr: |-
        Il se meut grâce à l’énergie stockée dans son corps.
        Personne ne sait d’où vient cette énergie mystérieuse.
      de: |-
        Es wird durch eine Energie angetrieben, die seinem
        Körper entspringt. Keiner weiß jedoch, woher diese
        Energie stammt.
      es: |-
        Se mueve gracias a la energía que quema dentro de su
        cuerpo, pero el origen de esta energía es incierto.
      it: |-
        Si muove grazie all’energia che gli brucia dentro,
        ma nessuno sa di che tipo di energia si tratti.
    'y':
      ja-Hrkt: |-
        こだいの　かがくりょくに　よって
        ねんどから　つくられた　ポケモン。
        すうせんねん　うごきつづける。
      ja: |-
        古代の　科学力に　よって
        粘土から　つくられた　ポケモン。
        数千年　動き続ける。
      ko: |-
        고대 과학의 힘으로
        점토에서 만들어진 포켓몬.
        수천 년 동안 계속 움직일 수 있다.
      en: |-
        Ancient science fashioned this Pokémon from clay.
        It’s been active for thousands of years.
      fr: |-
        Ce Pokémon fait de terre glaise, produit de la
        technologie d’une civilisation antique, vit depuis
        des millénaires.
      de: |-
        Es wurde von einer uralten Kultur aus Lehm erschaffen
        und kann mehrere Jahrtausende in Bewegung bleiben.
      es: |-
        Un Pokémon creado a partir del barro gracias a la
        ciencia de antaño. Lleva activo miles de años.
      it: |-
        È stato creato dall’argilla usando antiche conoscenze
        scientifiche. È vivo da più di 1000 anni.
    omega-ruby:
      ja-Hrkt: |-
        たいないで　もえる　エネルギーに
        よって　かつどうしているが　どんな
        エネルギーなのかは　ふめいである。
      ja: |-
        体内で　燃える　エネルギーに　よって
        活動しているが　どんな
        エネルギーなのかは　不明である。
      ko: |-
        체내에서 불타는 에너지로
        인해 활동하고 있지만 어떤
        에너지인지는 불명이다.
      en: |-
        The energy that burns inside it enables it to move,
        but no one has yet been able to identify
        this energy.
      fr: |-
        Il se meut grâce à l’énergie stockée dans son corps.
        Personne ne sait d’où vient cette énergie mystérieuse.
      de: |-
        Es wird durch eine Energie angetrieben, die seinem Körper
        entspringt. Keiner weiß jedoch, woher diese Energie stammt.
      es: |-
        Se mueve gracias a la energía que quema dentro de su
        cuerpo, pero el origen de esta energía es incierto.
      it: |-
        Si muove grazie all’energia che gli brucia dentro, ma nessuno
        sa di che tipo di energia si tratti.
    alpha-sapphire:
      ja-Hrkt: |-
        こだいの　かがくりょくに　よって
        ねんどから　つくられた　ポケモン。
        すうせんねん　うごきつづける。
      ja: |-
        古代の　科学力に　よって
        粘土から　つくられた　ポケモン。
        数千年　動き続ける。
      ko: |-
        고대 과학의 힘으로
        점토에서 만들어진 포켓몬.
        수천 년 동안 계속 움직일 수 있다.
      en: |-
        Ancient science fashioned this Pokémon from clay.
        It’s been active for thousands of years.
      fr: |-
        Ce Pokémon fait de terre glaise, produit de la technologie
        d’une civilisation antique, vit depuis des millénaires.
      de: |-
        Es wurde von einer uralten Kultur aus Lehm erschaffen
        und kann mehrere Jahrtausende in Bewegung bleiben.
      es: |-
        Un Pokémon creado a partir del barro gracias a la ciencia de
        antaño. Lleva activo miles de años.
      it: |-
        È stato creato dall’argilla usando antiche conoscenze
        scientifiche. È vivo da più di 1000 anni.
    ultra-sun:
      ja-Hrkt: |-
        なぞのエネルギーによって　かつどう。
        こだいから　うごきつづけているので
        そろそろ　パワーが　つきるとも。
      ja: |-
        謎の　エネルギーに　よって　活動。
        古代から　動き続けているので
        そろそろ　パワーが　尽きるとも。
      ko: |-
        수수께끼의 에너지로 활동한다.
        고대부터 계속 움직였기 때문에
        슬슬 파워가 다할 때가 됐을지도 모른다.
      zh-Hant: |-
        靠著神秘的能量來活動。
        因為從古代開始就持續活動，
        有可能就快要耗盡力量了。
      zh-Hans: |-
        因谜一般的能量而活动。
        因为从古代开始就持续活动，
        说不定很快就会用尽力量。
      en: |-
        Its movements are powered by a mysterious
        energy. It has continued to move since ancient
        times, so its power may soon run out.
      fr: |-
        Une mystérieuse énergie l’alimente depuis
        l’Antiquité, mais, qui sait ? Cette énergie
        n’est peut-être pas éternelle...
      de: |-
        Es wird seit uralten Zeiten durch eine Energie
        rätselhaften Ursprungs angetrieben. Manche
        gehen davon aus, dass diese bald erschöpft ist.
      es: |-
        Se mueve gracias a una misteriosa energía, pero,
        habiendo estado activo desde la antigüedad,
        dicha energía podría agotarse tarde o temprano.
      it: |-
        È animato da un’energia misteriosa, ma essendo
        in funzione fin dall’antichità si sospetta che
        potrebbe esaurirsi presto.
    ultra-moon:
      ja-Hrkt: |-
        こだいじんが　しもべに　するため
        ねんどを　こねて　こしらえたらしいが
        エネルギーげんは　ふめいだ。
      ja: |-
        古代人が　しもべに　するため
        粘土を　こねて　こしらえたらしいが
        エネルギー源は　不明だ。
      ko: |-
        고대인이 부하로 삼기 위해
        점토를 빚어서 만들었다고 하나
        에너지원은 불명확하다.
      zh-Hant: |-
        古代人之所以捏黏土製造牠，
        似乎是為了當成僕人使喚。
        能量來源至今不明。
      zh-Hans: |-
        古代人捏制黏土制作它
        好像是为了让其当仆人。
        但它的能量源尚不明确。
      en: |-
        Although ancient people apparently built it by
        working with clay, the source of its energy
        is unclear.
      fr: |-
        Les anciens, désirant avoir un serviteur,
        l’auraient façonné avec de l’argile. En revanche,
        on ignore toujours d’où provient son énergie.
      de: |-
        Ein uraltes Volk hat dieses Pokémon aus Lehm
        erschaffen, um es zu seinem Diener zu machen.
        Der Ursprung seiner Energie ist unbekannt.
      es: |-
        Se dice que fue creado antiguamente a partir de
        arcilla para usarlo como sirviente, pero se
        desconoce cuál es su fuente de energía.
      it: |-
        Un popolo antico lo ha creato modellando
        l’argilla per farne un servitore. La fonte
        dell’energia che lo anima è sconosciuta.
    sword:
      ja-Hrkt: |-
        ねんどから　うみだされた　こだいの
        ポケモン。　なぜか　おおいわを
        ならべつづける　ものも　いる。
      ja: |-
        粘土から　生み出された　古代の
        ポケモン。　なぜか　大岩を
        並べ続ける　ものも　いる。
      ko: |-
        점토에서 만들어진 고대의
        포켓몬. 어째선지 큰 바위를
        늘어놓기만 하는 녀석도 있다.
      zh-Hant: |-
        誕生自黏土的古代寶可夢。
        不知為何，有一些泥偶小人
        會不斷地把大石頭排列起來。
      zh-Hans: |-
        诞生自黏土的古代宝可梦。
        不知为何，有一些泥偶小人
        会不断地把大石头排列起来。
      en: |-
        They were sculpted from clay in ancient times.
        No one knows why, but some of them are driven
        to continually line up boulders.
      fr: |-
        Ce Pokémon très ancien a été façonné avec
        de l’argile. On ne sait pourquoi certains spécimens
        n’ont de cesse d’aligner de grosses pierres.
      de: |-
        Sie bestehen aus Lehm und existieren schon sehr
        lange. Einige von ihnen haben den unerklärlichen
        Drang, große Felsen aneinanderzureihen.
      es: |-
        Un antiguo Pokémon creado a partir del barro.
        Se desconoce el motivo por el que algunos
        ejemplares colocan rocas grandes en hileras.
      it: |-
        È un Pokémon antico creato dall’argilla. Non si
        sa perché, ma ad alcuni esemplari piace creare
        file interminabili di grandi rocce.
    shield:
      ja-Hrkt: |-
        ねんどから　つくられた　ポケモン。
        なんぜんねんも　まえの　あるじの
        めいれいを　いまも　まもっている。
      ja: |-
        粘土から　つくられた　ポケモン。
        何千年も　前の　主の
        命令を　今も　守っている。
      ko: |-
        점토로 만들어진 포켓몬이다.
        수천 년 전 주인의 명령을
        지금도 따르고 있다.
      zh-Hant: |-
        用黏土製成的寶可夢。
        即使現在也一直遵循著
        數千年前主人的命令。
      zh-Hans: |-
        用黏土制成的宝可梦。
        即使现在也一直遵循着
        数千年前主人的命令。
      en: |-
        This Pokémon was created from clay. It received
        orders from its master many thousands of years
        ago, and it still follows those orders to this day.
      fr: |-
        Ce Pokémon fait d’argile continue de respecter
        les ordres que son maître lui a donnés il y a
        quelques millénaires.
      de: |-
        Golbit wurde aus Lehm erschaffen. Es führt heute
        noch Befehle aus, die ihm vor Jahrtausenden
        von seinem Meister aufgetragen wurden.
      es: |-
        Fue creado a partir del barro para emplearlo
        como sirviente. Todavía acata las órdenes que
        le dio su amo hace milenios.
      it: |-
        È stato creato modellando dell’argilla.
        Segue ancora gli ordini che il suo padrone
        gli ha impartito molti secoli or sono.
