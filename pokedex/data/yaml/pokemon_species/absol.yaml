absol:
  base_happiness: 35
  capture_rate: 30
  color: white
  egg_groups:
    - ground
  evolution_chain: absol
  evolves_from: ~
  flavor_text:
    ruby:
      en: |-
        Every time ABSOL appears before people,
        it is followed by a disaster such as an
        earthquake or a tidal wave.As a result, it came to be known as the
        disaster POKéMON.
    sapphire:
      en: |-
        ABSOL has the ability to foretell the
        coming of natural disasters.
        It lives in a harsh, rugged mountainenvironment. This POKéMON very rarely
        ventures down from the mountains.
    emerald:
      en: |-
        It sharply senses even subtle changes in
        the sky and the land to predict natural
        disasters. It is a long-lived POKéMON that
        has a life-span of 100 years.
    firered:
      en: |-
        It appears when it senses an impending
        natural disaster. As a result, it was
        mistaken as a doom-bringer.
    leafgreen:
      en: |-
        It appears when it senses an impending
        natural disaster. As a result, it was
        mistaken as a doom-bringer.
    diamond:
      en: |-
        It senses coming disasters and
        appears before people only to
        warn them of impending danger.
    pearl:
      en: |-
        It senses coming disasters and
        appears before people only to
        warn them of impending danger.
    platinum:
      en: |-
        Rumored to sense disasters with its
        horn, it became a target. It fled
        deep into the mountains.
    heartgold:
      en: |-
        It has the ability to foretell
        natural disasters. Its life span is
        over a hundred years.
    soulsilver:
      en: |-
        It has the ability to foretell
        natural disasters. Its life span is
        over a hundred years.
    black:
      en: |-
        Rumored to sense disasters with its
        horn, it became a target. It fled
        deep into the mountains.
      fr: |-
        La capacité de sa corne à sentir
        les catastrophes ayant trop attiré
        l’attention sur lui, il vit reclus.
    white:
      en: |-
        Rumored to sense disasters with its
        horn, it became a target. It fled
        deep into the mountains.
      fr: |-
        La capacité de sa corne à sentir
        les catastrophes ayant trop attiré
        l’attention sur lui, il vit reclus.
    black-2:
      en: |-
        It appears from deep in the mountains
        to warn people about upcoming disasters
        it has sensed with its horn.
    white-2:
      en: |-
        It appears from deep in the mountains
        to warn people about upcoming disasters
        it has sensed with its horn.
    x:
      ja-Hrkt: |-
        さいがいを　よかんする。
        きけんを　しらせる　ときだけ
        ひとまえに　あらわれるという。
      ja: |-
        災害を　予感する。
        危険を　知らせる　ときだけ
        人前に　現れるという。
      ko: |-
        재해의 위험을 감지한다.
        위험을 알리는 때에만
        사람 앞에 나타난다고 한다.
      en: |-
        It senses coming disasters and appears before
        people only to warn them of impending danger.
      fr: |-
        Il pressent les catastrophes et n’apparaît aux gens
        que pour les prévenir d’un danger imminent.
      de: |-
        Es spürt drohende Katastrophen und erscheint nur
        dann, wenn es andere vor der Gefahr warnen will.
      es: |-
        Presiente desastres inminentes y se aparece a la gente
        para advertir del peligro.
      it: |-
        Percepisce i disastri naturali imminenti e si mostra
        solo per avvertire la gente del pericolo.
    'y':
      ja-Hrkt: |-
        さいがいの　よちょうを　かんじると
        すがたを　みせる　ために　わざわいを
        よぶ　ポケモンと　ごかいされていた。
      ja: |-
        災害の　予兆を　感じると
        姿を　見せる　ために　災いを　呼ぶ
        ポケモンと　誤解されていた。
      ko: |-
        재해의 징조를 느끼면 모습을
        보이기 때문에 재앙을 부르는
        포켓몬으로 오해받고 있었다.
      en: |-
        It appears when it senses an impending natural
        disaster. As a result, it was mistaken as a
        doom bringer.
      fr: |-
        Absol apparaît dès qu’une catastrophe naturelle est
        sur le point de se produire. Pour cette raison,
        les gens ont longtemps pensé qu’il portait malheur.
      de: |-
        Es taucht auf, wenn es spürt, dass eine
        Naturkatastrophe kurz bevorsteht. Daher wurde es
        irrtümlicherweise für einen Unheilsboten gehalten.
      es: |-
        Aparece cuando prevé una catástrofe natural
        inminente, por eso dicen que trae mala suerte.
      it: |-
        Appare quando avverte un imminente disastro
        naturale. Ciò ha fatto credere che portasse sfortuna.
    omega-ruby:
      ja-Hrkt: |-
        アブソルが　ひとまえに　あらわれると　かならず
        じしんや　つなみなどの　さいがいが　おこったので
        わざわいポケモン　という　べつめいで　よばれた。
      ja: |-
        アブソルが　人前に　現れると　必ず
        地震や　津波などの　災害が　起こったので
        災いポケモン　という　別名で　呼ばれた。
      ko: |-
        앱솔이 사람들 앞에 나타나면 반드시
        지진이나 해일 등의 재해가 일어나서
        재난포켓몬이라는 별명으로 불렸다.
      en: |-
        Every time Absol appears before people, it is followed by a
        disaster such as an earthquake or a tidal wave. As a result,
        it came to be known as the disaster Pokémon.
      fr: |-
        Chaque fois qu’Absol apparaît devant des gens,
        une catastrophe comme un tremblement de terre
        ou un raz-de-marée survient peu de temps après.
        Il est devenu tristement célèbre sous l’appellation
        de Pokémon désastreux.
      de: |-
        Jedes Mal, wenn Absol sich den Menschen zeigt, endet dies
        in einer Katastrophe wie Erdbeben oder Sturmflut. Deswegen
        ist es auch als das Desaster-Pokémon bekannt.
      es: |-
        Cada vez que Absol aparece ante la gente, ocurre una
        catástrofe natural como un terremoto o un maremoto. Por esta
        razón se le conoce como el Pokémon de las catástrofes.
      it: |-
        Ogni volta che compare Absol, segue un disastro come
        un terremoto o un maremoto. Per questo motivo è noto
        come il Pokémon dei disastri.
    alpha-sapphire:
      ja-Hrkt: |-
        しぜんさいがいを　キャッチする　ちからを　もつ。
        けわしい　さんがくちたいに　せいそくし
        めったに　やまの　ふもとには　おりてこない。
      ja: |-
        自然災害を　キャッチする　力を　持つ。
        険しい　山岳地帯に　生息し
        滅多に　山の　ふもとには　降りてこない。
      ko: |-
        자연재해를 감지하는 힘을 지녔다.
        험한 산악 지대에 서식하며
        좀처럼 산기슭에는 내려오지 않는다.
      en: |-
        Absol has the ability to foretell the coming of natural disasters.
        It lives in a harsh, rugged mountain environment. This
        Pokémon very rarely ventures down from the mountains.
      fr: |-
        Absol a le pouvoir de prédire les catastrophes naturelles.
        Il vit dans un milieu montagneux aride et accidenté.
        Ce Pokémon s’éloigne très rarement des montagnes.
      de: |-
        Absol kann bevorstehende Naturkatastrophen voraussagen.
        Es lebt auf einem kargen, zerklüfteten Berg. Dieses Pokémon
        wagt sich nur sehr selten ins Tal herunter.
      es: |-
        Absol tiene la habilidad de predecir las catástrofes naturales.
        Este Pokémon vive en hábitats montañosos, hostiles y
        accidentados de los que rara vez se aleja.
      it: |-
        Absol ha l’abilità di predire le catastrofi naturali. Vive negli
        ambienti montani più aspri e inospitali. Soltanto raramente
        si allontana dalle montagne per avventurarsi a valle.
    sun:
      ja-Hrkt: |-
        めいしんが　はびこる　むかし
        わざわいを　もたらすと　いみきらわれ
        やまの　おくへと　おいやられた。
      ja: |-
        迷信が　はびこる　昔
        災いを　もたらすと　忌み嫌われ
        山の　奥へと　追いやられた。
      ko: |-
        미신이 만연했던 옛날에
        재앙을 초래한다고 미움을 받아
        산속으로 쫓겨났다.
      zh-Hant: |-
        在迷信橫行的過去，
        因被認為會招來災禍而遭到厭惡，
        並被趕到了深山中去。
      zh-Hans: |-
        在迷信盛行的过去，
        因被认为会招来灾祸而遭到厌恶，
        并被赶到深山中去。
      en: |-
        Long ago, superstitions were spread about it,
        saying it brought disaster. This fed a hatred
        of it, and it was driven deep into the mountains.
      fr: |-
        Autrefois la cible de superstitions le rendant
        responsable des catastrophes, il s’est retiré
        dans les montagnes pour y échapper.
      de: |-
        Aus Aberglauben war Absol einst
        als Unheilsbote verhasst und wurde
        in die tiefsten Berge vertrieben.
      es: |-
        Repudiado por las supersticiones de antaño
        que lo proclamaban heraldo de catástrofes
        naturales, tuvo que refugiarse en las montañas.
      it: |-
        In un antico passato dominato dalle superstizioni
        era odiato perché ritenuto latore di disastri.
        Questo l’ha costretto a rifugiarsi sulle montagne.
    moon:
      ja-Hrkt: |-
        わざわいを　もたらすと　いわれるが
        じっさいには　おだやかな　せいしつ。
        さいがいの　ききを　ひとに　つたえる。
      ja: |-
        災いを　もたらすと　いわれるが
        実際には　おだやかな　性質。
        災害の　危機を　人に　伝える。
      ko: |-
        재앙을 가져온다고 전해지지만
        실제로는 온화한 성질이다.
        재해의 위기를 사람들에게 알린다.
      zh-Hant: |-
        被認為會帶來災禍，
        但實際上性格很溫和。
        會將災害危機的警訊傳達給人們。
      zh-Hans: |-
        被认为会带来灾祸，
        而实际上性格很温和。
        会向人传递灾害危机的信息。
      en: |-
        Although it’s said to bring disaster, in actuality,
        this Pokémon possesses a calm disposition and
        warns people of any crises that loom.
      fr: |-
        On le dit annonciateur de catastrophes, mais
        c’est en fait un Pokémon paisible. Il prévient les
        hommes de l’imminence des cataclysmes.
      de: |-
        Es heißt, Absol sei ein Unheilsbote, doch in
        Wahrheit hat es ein sanftes Wesen. Es warnt
        die Menschen vor drohenden Katastrophen.
      es: |-
        Se rumorea que es portador de calamidades,
        pero en realidad tiene un carácter muy dócil.
        Alerta a los humanos cuando vienen catástrofes.
      it: |-
        Si dice che sia latore di disgrazie. In realtà
        ha un carattere molto gentile e avvisa gli esseri
        umani di disastri naturali imminenti.
    ultra-sun:
      ja-Hrkt: |-
        ふきつなのは　みためだけ。　たはたを
        まもってくれたり　いへんを　ひとに
        つげてくれる　ありがたい　そんざい。
      ja: |-
        不吉なのは　見た目だけ。　田畑を
        守ってくれたり　異変を　人に
        告げてくれる　ありがたい　存在。
      ko: |-
        비록 겉모습은 불길하지만
        논밭을 지키거나 이변을 사람에게
        알려 주는 고마운 존재다.
      zh-Hant: |-
        牠只有外表看起來不吉祥。其實牠會幫忙
        守護田地，還會在災害發生時發出警告，
        是種對人們很有助益的寶可夢。
      zh-Hans: |-
        不祥的只是它的外表。
        实际上它是会帮忙守护田地，
        或是告知人们异变的难能可贵的存在。
      en: |-
        The only thing unlucky about Absol is its
        appearance. It protects fields and warns people
        of disaster, so one ought to be grateful for it.
      fr: |-
        Contrairement à ce que son apparence suggère,
        il s’agit d’un Pokémon bienveillant qui protège
        les champs et annonce les catastrophes.
      de: |-
        Nur sein Erscheinen ist unheilvoll. Die Menschen
        sind ihm dankbar, weil es ihre Felder beschützt
        und sie vor drohenden Katastrophen warnt.
      es: |-
        Aunque su apariencia sea siniestra, en realidad
        le agradecen que alerte de cualquier catástrofe
        inminente y que proteja los cultivos.
      it: |-
        Nonostante l’aspetto inquietante, è un Pokémon
        benevolo che protegge i campi e avvisa gli
        esseri umani di calamità naturali imminenti.
    ultra-moon:
      ja-Hrkt: |-
        ろうじんは　わざわいポケモンと　よび
        いみきらうが　さいがいを　よち　する
        ちからに　かんしんが　たかまっている。
      ja: |-
        老人は　わざわいポケモンと　呼び
        忌み嫌うが　災害を　予知　する
        力に　関心が　高まっている。
      ko: |-
        노인들은 재난포켓몬이라고 부르며
        미워하지만 재해를 예지하는
        능력에 관심이 높아지고 있다.
      zh-Hant: |-
        老人們稱呼牠為災禍寶可夢，
        對牠十分忌諱。但目前牠預知
        災害的能力正越來越受到重視。
      zh-Hans: |-
        老人们称之为灾祸宝可梦，
        对它很忌惮。但人们对它
        预知灾害的能力非常感兴趣。
      en: |-
        The elderly call it the disaster Pokémon and
        detest it, but interest in its power to predict
        disasters is on the rise.
      fr: |-
        Les anciens le détestent et le nomment « le
        Pokémon Désastre », mais d’autres l’apprécient
        pour son aptitude à prédire les catastrophes.
      de: |-
        Alte Leute verabscheuen es als das Desaster-
        Pokémon, aber seine Fähigkeit, Katastrophen
        vorherzusagen, findet immer mehr Anerkennung.
      es: |-
        Pese a que los ancianos lo repudian tildándolo
        de Pokémon Catástrofe, cada vez es mayor el
        interés por su capacidad de prever desastres.
      it: |-
        Gli anziani lo detestano chiamandolo “il Pokémon
        dei disastri”, ma la sua capacità di predire i
        cataclismi desta sempre più interesse.
    sword:
      ja-Hrkt: |-
        かぜのように　のやまを　かけぬける。
        ゆみなりの　ツノは　しぜんさいがいの
        よちょうを　びんかんに　かんじとる。
      ja: |-
        風のように　野山を　駆けぬける。
        弓なりの　ツノは　自然災害の
        予兆を　敏感に　感じとる。
      ko: |-
        바람처럼 산과 들을 달려나간다.
        초승달 모양의 뿔은 자연재해의
        징조를 민감하게 감지한다.
      zh-Hant: |-
        如風般地奔馳在山野中。
        形狀如弓的角能夠敏銳
        感應到自然災害的預兆。
      zh-Hans: |-
        如风一般在山野中奔跑。
        能用它像弓一样的角
        来感知自然灾害的预兆。
      en: |-
        Swift as the wind, Absol races through fields and
        mountains. Its curved, bow-like horn is acutely
        sensitive to the warning signs of natural disasters.
      fr: |-
        Il court par monts et par vaux, rapide comme
        le vent. Sa corne arquée lui permet de percevoir
        les signes avant-coureurs des cataclysmes.
      de: |-
        Schnell wie der Wind rauscht es über Felder
        und Berge. Sein gebogenes Horn ist sehr sensibel
        gegenüber herannahenden Naturkatastrophen.
      es: |-
        Corre por montañas y prados a la velocidad del
        viento. Su cuerno curvado tiene tal sensibilidad
        que puede predecir catástrofes naturales.
      it: |-
        Corre veloce come il vento attraverso colline
        e campi. Il suo corno ricurvo è in grado di
        prevedere con precisione le calamità naturali.
    shield:
      ja-Hrkt: |-
        きけんを　さっちする　のうりょくを
        もつがゆえに　ひとからは　わざわいを
        もたらす　ポケモンと　ごかいされた。
      ja: |-
        危険を　察知する　能力を
        持つがゆえに　人からは　災いを
        もたらす　ポケモンと　誤解された。
      ko: |-
        위험을 감지하는 능력이 있어
        사람들로부터 재앙을 불러오는
        포켓몬이라는 오해를 샀다.
      zh-Hant: |-
        由於擁有察覺危險的能力，
        因此牠被人們誤解是
        會招來災禍的寶可夢。
      zh-Hans: |-
        由于拥有感知危险的能力，
        因此它被人们误解为是
        会招来灾祸的宝可梦。
      en: |-
        Because of this Pokémon’s ability to detect
        danger, people mistook Absol as a bringer
        of doom.
      fr: |-
        Sa capacité à pressentir le danger lui a autrefois
        valu la réputation de porter malheur.
      de: |-
        Absol kann Gefahr verspüren, weshalb Menschen
        irrtümlicherweise dachten, dieses Pokémon
        bringe ihnen Unheil.
      es: |-
        Debido a su capacidad para predecir desastres,
        se lo ha considerado desacertadamente un
        Pokémon portador de desgracias.
      it: |-
        A causa della sua capacità di percepire i disastri
        è stato considerato erroneamente un Pokémon
        portatore di disgrazie.
