shelmet:
  base_happiness: 50
  capture_rate: 200
  color: red
  egg_groups:
    - bug
  evolution_chain: shelmet
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        When attacked, it defends itself by
        closing the lid of its shell. It can spit
        a sticky, poisonous liquid.
      fr: |-
        Quand on l’attaque, il referme sa
        visière pour se défendre, et
        projette un poison visqueux.
    white:
      en: |-
        It evolves when bathed in an
        electric-like energy along with
        Karrablast. The reason is still unknown.
      fr: |-
        Il évolue quand il baigne dans une
        énergie électrique avec un Carabing.
        La cause en est inconnue.
    black-2:
      en: |-
        When it and Karrablast are together,
        and both receive electrical stimulation,
        they both evolve.
    white-2:
      en: |-
        When it and Karrablast are together,
        and both receive electrical stimulation,
        they both evolve.
    x:
      ja-Hrkt: |-
        カブルモと　いっしょに　いるときに
        でんきてきな　しげきを　うけると
        おたがいの　からだが　しんかする。
      ja: |-
        カブルモと　一緒に　いるときに
        電気的な　刺激を　受けると
        お互いの　体が　進化する。
      ko: |-
        딱정곤과 함께 있을 때
        전기적인 자극을 받으면
        서로의 몸이 진화한다.
      en: |-
        When it and Karrablast are together, and both
        receive electrical stimulation, they both evolve.
      fr: |-
        S’il est à proximité d’un Carabing et que les deux
        reçoivent une décharge électrique, ils évoluent en
        même temps.
      de: |-
        Hält sich ein Laukaps in seiner Nähe auf
        und kommen beide mit Strom in Berührung,
        entwickeln sie sich.
      es: |-
        Si está junto a Karrablast, y ambos reciben una
        descarga eléctrica, evolucionan los dos a la vez.
      it: |-
        Quando incontra Karrablast si crea della corrente
        elettrica che stimola entrambi i Pokémon causandone
        l’evoluzione.
    'y':
      ja-Hrkt: |-
        カブルモと　ともに　でんきてきな
        エネルギーを　あびると　しんかする。
        りゆうは　かいめいされていない。
      ja: |-
        カブルモと　ともに　電気的な
        エネルギーを　浴びると　進化する。
        理由は　解明されていない。
      ko: |-
        딱정곤과 함께 전기적인
        에너지를 받으면 진화한다.
        그 이유는 알려지지 않았다.
      en: |-
        It evolves when bathed in an electric-like energy
        along with Karrablast. The reason is still unknown.
      fr: |-
        Il évolue quand il baigne dans une énergie électrique
        avec un Carabing. La cause en est inconnue.
      de: |-
        Führt man ihm zusammen mit Laukaps elektrische
        Energie zu, entwickelt es sich. Niemand kennt den
        Grund dafür.
      es: |-
        Evoluciona si entra en contacto con energía eléctrica
        junto a Karrablast. Aún no se ha esclarecido el porqué.
      it: |-
        Se riceve una scarica elettrica assieme a Karrablast,
        si evolve. Il motivo non è chiaro.
    omega-ruby:
      ja-Hrkt: |-
        カブルモと　いっしょに　いるときに
        でんきてきな　しげきを　うけると
        おたがいの　からだが　しんかする。
      ja: |-
        カブルモと　一緒に　いるときに
        電気的な　刺激を　受けると
        お互いの　体が　進化する。
      ko: |-
        딱정곤과 함께 있을 때
        전기적인 자극을 받으면
        서로의 몸이 진화한다.
      en: |-
        When it and Karrablast are together, and both
        receive electrical stimulation, they both evolve.
      fr: |-
        S’il est à proximité d’un Carabing et que les deux reçoivent
        une décharge électrique, ils évoluent en même temps.
      de: |-
        Hält sich ein Laukaps in seiner Nähe auf und kommen beide
        mit Strom in Berührung, entwickeln sie sich.
      es: |-
        Si está junto a Karrablast, y ambos reciben una descarga
        eléctrica, evolucionan los dos a la vez.
      it: |-
        Quando incontra Karrablast si crea della corrente elettrica
        che stimola entrambi i Pokémon causandone l’evoluzione.
    alpha-sapphire:
      ja-Hrkt: |-
        カブルモと　ともに　でんきてきな
        エネルギーを　あびると　しんかする。
        りゆうは　かいめいされていない。
      ja: |-
        カブルモと　ともに　電気的な
        エネルギーを　浴びると　進化する。
        理由は　解明されていない。
      ko: |-
        딱정곤과 함께 전기적인
        에너지를 받으면 진화한다.
        그 이유는 알려지지 않았다.
      en: |-
        It evolves when bathed in an electric-like energy
        along with Karrablast. The reason is still unknown.
      fr: |-
        Il évolue quand il baigne dans une énergie électrique
        avec un Carabing. La cause en est inconnue.
      de: |-
        Führt man ihm zusammen mit Laukaps elektrische Energie zu,
        entwickelt es sich. Niemand kennt den Grund dafür.
      es: |-
        Evoluciona si entra en contacto con energía eléctrica junto a
        Karrablast. Aún no se ha esclarecido el porqué.
      it: |-
        Se riceve una scarica elettrica assieme a Karrablast, si evolve.
        Il motivo non è chiaro.
    sword:
      ja-Hrkt: |-
        てきに　おそわれると　カラの　フタを
        がっちり　しめて　みを　まもる。
        ただし　カブルモには　あけられる。
      ja: |-
        敵に　襲われると　殻の　蓋を
        がっちり　閉めて　身を　守る。
        ただし　カブルモには　開けられる。
      ko: |-
        상대에게 공격받으면 껍질의 뚜껑을
        꽉 닫아서 몸을 지킨다.
        단, 딱정곤에게는 열리고 만다.
      zh-Hant: |-
        一旦被敵人襲擊，
        便會關上殼蓋保護自己。
        不過蓋蓋蟲能打得開。
      zh-Hans: |-
        一旦被敌人袭击，
        便会关上壳盖保护自己。
        不过盖盖虫能打得开。
      en: |-
        When attacked, it tightly shuts the lid of its shell.
        This reaction fails to protect it from Karrablast,
        however, because they can still get into the shell.
      fr: |-
        Il se recroqueville dans sa carapace en fermant
        la visière lorsque des ennemis approchent.
        Carabing peut néanmoins en forcer l’entrée.
      de: |-
        Wird es angegriffen, schließt es, so fest es kann,
        das Visier seiner Muschel. Gegen Laukaps erweist
        sich dieser Schutz allerdings als nutzlos.
      es: |-
        Cierra a cal y canto la visera de su caparazón al
        ser atacado. Solo los Karrablast pueden abrirla.
      it: |-
        Quando viene attaccato, si rinchiude nella
        conchiglia sigillando la visiera per proteggersi.
        Solo Karrablast riesce a superare queste difese.
    shield:
      ja-Hrkt: |-
        でんき　エネルギーに　はんのうする
        ふしぎな　たいしつ。　カブルモと
        ともに　いると　なぜか　しんかする。
      ja: |-
        電気　エネルギーに　反応する
        不思議な　体質。　カブルモと
        ともに　いると　なぜか　進化する。
      ko: |-
        전기 에너지에 반응하는 신비한
        체질을 지녔다. 딱정곤과 함께
        있으면 무슨 이유인지 진화한다.
      zh-Hant: |-
        有著會對電能產生反應
        的奇異體質。不知為何，
        和蓋蓋蟲待在一起就會進化。
      zh-Hans: |-
        有着会对电能产生反应
        的奇异体质。不知为何，
        和盖盖虫待在一起就会进化。
      en: |-
        It has a strange physiology that responds to
        electricity. When together with Karrablast,
        Shelmet evolves for some reason.
      fr: |-
        Il a l’étrange faculté de réagir à l’énergie
        électrique. On ne sait trop pourquoi, mais quand
        il se trouve aux côtés de Carabing, il évolue.
      de: |-
        Sein Körper reagiert unerklärlicherweise auf
        Elektrizität. Es heißt, die Anwesenheit von
        Laukaps löse bei ihm die Entwicklung aus.
      es: |-
        Debido a su peculiar constitución, reacciona
        ante la energía eléctrica. Por alguna misteriosa
        razón, evoluciona en presencia de Karrablast.
      it: |-
        Il suo corpo reagisce misteriosamente all’energia
        elettrica. Pare che si evolva se si trova in
        presenza di Karrablast.
