  flavor_text:
    ruby:
      en: |-
        SOLROCK is a new species of POKéMON
        that is said to have fallen from space.
        It floats in air and moves silently.In battle, this POKéMON releases
        intensely bright light.
    sapphire:
      en: |-
        Sunlight is the source of SOLROCK’s
        power. It is said to possess the ability
        to read the emotions of others.This POKéMON gives off intense heat
        while rotating its body.
    emerald:
      en: |-
        Solar energy is the source of this 
        POKéMON’s power. On sunny days, groups of
        SOLROCK line up facing the sun and absorb
        its light.
    firered:
      en: |-
        It absorbs solar energy during the day.
        Always expressionless, it can sense what
        its foe is thinking.
    leafgreen:
      en: |-
        It absorbs solar energy during the day.
        Always expressionless, it can sense what
        its foe is thinking.
    diamond:
      en: |-
        A new Pokémon species, rumored
        to be from the sun. It gives off
        light while spinning.
    pearl:
      en: |-
        A new Pokémon species, rumored
        to be from the sun. It gives off
        light while spinning.
    platinum:
      en: |-
        A new Pokémon species, rumored
        to be from the sun. It gives off
        light while spinning.
    heartgold:
      en: |-
        When it rotates itself, it gives off
        light similar to the sun, thus
        blinding its foes.
    soulsilver:
      en: |-
        When it rotates itself, it gives off
        light similar to the sun, thus
        blinding its foes.
    black:
      en: |-
        A new Pokémon species, rumored
        to be from the sun. It gives off
        light while spinning.
      fr: |-
        Le bruit court que cette nouvelle
        espèce vient du soleil. Il produit
        de la lumière en tournoyant.
    white:
      en: |-
        A new Pokémon species, rumored
        to be from the sun. It gives off
        light while spinning.
      fr: |-
        Le bruit court que cette nouvelle
        espèce vient du soleil. Il produit
        de la lumière en tournoyant.
    black-2:
      en: |-
        Solar energy is the source of its power,
        so it is strong during the daytime.
        When it spins, its body shines.
    white-2:
      en: |-
        Solar energy is the source of its power,
        so it is strong during the daytime.
        When it spins, its body shines.
    x:
      ja-Hrkt: |-
        たいようエネルギーが　パワーの
        みなもと　なので　ひるまは　つよい。
        かいてんすると　からだが　ひかる。
      ja: |-
        太陽エネルギーが　パワーの
        源　なので　昼間は　強い。
        回転すると　体が　光る。
      ko: |-
        태양 에너지가 파워의
        근원이라서 낮에는 강하다.
        회전하면 몸이 빛난다.
      en: |-
        Solar energy is the source of its power,
        so it is strong during the daytime.
        When it spins, its body shines.
      fr: |-
        Il tire sa force de l’énergie solaire.
        Il est donc particulièrement à l’aise en journée.
        Il s’illumine quand il tourne.
      de: |-
        Da es seine Energie aus Sonnenlicht gewinnt,
        ist es tagsüber am stärksten. Wenn es sich dreht,
        leuchtet es.
      es: |-
        Usa el sol como fuente de energía, por lo que es más
        poderoso de día. Brilla al rotar.
      it: |-
        L’energia solare è la fonte della sua potenza, per cui
        è più forte di giorno. Emana luce quando ruota su
        se stesso.
    'y':
      ja-Hrkt: |-
        ひるまに　たいよう　エネルギーを
        たくわえる。いつも　むひょうじょう。
        あいての　かんがえを　よみとる。
      ja: |-
        昼間に　太陽エネルギーを
        たくわえる。いつも　無表情。
        相手の　考えを　読み取る。
      ko: |-
        낮 동안 태양 에너지를
        비축한다. 항상 무표정으로
        상대의 생각을 읽어낸다.
      en: |-
        It absorbs solar energy during the day. Always
        expressionless, it can sense what its foe is thinking.
      fr: |-
        Solaroc absorbe l’énergie du soleil pendant la
        journée. Toujours impassible, il parvient à lire
        les pensées de ses ennemis.
      de: |-
        Tagsüber absorbiert es Sonnenlicht. Ohne je seinen
        Ausdruck zu verändern, kann es die Gedanken des
        Gegners lesen.
      es: |-
        De día, absorbe energía solar. No es nada expresivo,
        pero capta perfectamente lo que piensa su rival.
      it: |-
        Durante il giorno assorbe la luce solare. Sempre
        perfettamente inespressivo, può leggere nel pensiero
        del nemico.
    omega-ruby:
      ja-Hrkt: |-
        うちゅうから　おちてきたと　いわれる　しんしゅ。
        くうちゅうに　うかび　おともなく　いどうする。
        たたかいに　なると　つよい　ひかりを　はなつ。
      ja: |-
        宇宙から　落ちてきたと　いわれる　新種。
        空中に　浮かび　音もなく　移動する。
        戦いに　なると　強い　光を　放つ。
      ko: |-
        우주에서 떨어졌다고 전해지는 새로운 종이다.
        공중에 떠서 소리 없이 이동한다.
        싸울 때는 강한 빛을 발산한다.
      en: |-
        Solrock is a new species of Pokémon that is said to have fallen
        from space. It floats in air and moves silently. In battle, this
        Pokémon releases intensely bright light.
      fr: |-
        Solaroc est une nouvelle espèce de Pokémon. On raconte
        qu’il serait tombé de l’espace. Il flotte dans les airs et
        se déplace silencieusement. Au combat, ce Pokémon
        libère une lumière intense.
      de: |-
        Sonnfel ist eine neue Pokémon-Art, die angeblich aus dem
        Weltall kam. Es gleitet durch die Luft und bewegt sich leise.
        Im Kampf setzt dieses Pokémon sehr helles Licht ein.
      es: |-
        Solrock pertenece a una nueva especie de Pokémon a la que
        se le atribuye una procedencia extraterrestre. Este Pokémon
        permanece flotando en el aire y se mueve muy despacio. Al
        luchar, desprende una luz viva e intensa.
      it: |-
        Solrock è una nuova specie di Pokémon che pare sia
        precipitata dallo spazio. Fluttua a mezz’aria spostandosi
        silenziosamente. In lotta emana una luce estremamente
        intensa.
    alpha-sapphire:
      ja-Hrkt: |-
        たいよう　こうせんが　パワーの　みなもと。
        あいての　こころを　よみとると　いわれている。
        からだを　かいてんさせて　こうねつを　はなつ。
      ja: |-
        太陽　光線が　パワーの　源。
        相手の　心を　読み取ると　いわれている。
        体を　回転させて　高熱を　放つ。
      ko: |-
        태양 광선이 파워의 원천이다.
        상대의 마음을 읽어낸다고 전해지고 있다.
        몸을 회전시켜 고열을 발산한다.
      en: |-
        Sunlight is the source of Solrock’s power. It is said to possess
        the ability to read the emotions of others. This Pokémon gives
        off intense heat while rotating its body.
      fr: |-
        La lumière du soleil est à l’origine du pouvoir de Solaroc.
        On raconte qu’il peut lire les pensées d’autrui. Ce Pokémon
        peut libérer une chaleur insoutenable en faisant tournoyer
        son corps.
      de: |-
        Aus Sonnenlicht zieht Sonnfel seine Energie.
        Es kann angeblich die Emotionen anderer sehen.
        Dieses Pokémon gibt eine starke Hitze ab,
        wenn es sich um die eigene Achse dreht.
      es: |-
        La fuente de energía de Solrock es la luz del sol. Dicen que
        tiene la habilidad de leer la mente de los demás. Al rotar,
        libera mucho calor.
      it: |-
        La luce solare è la fonte primaria dell’energia di Solrock.
        Pare che riesca a carpire i pensieri degli altri. Il Pokémon
        emana un calore intenso roteando vorticosamente.
    sword:
      ja-Hrkt: |-
        からだを　かいてん　させると
        たいようの　ような　ひかりを　はなち
        てきの　めを　くらませる。
      ja: |-
        体を　回転　させると
        太陽の　ような　光を　放ち
        敵の　目を　眩ませる。
      ko: |-
        몸을 회전시키면
        태양과 같은 빛을 발산해
        적의 눈을 멀게 한다.
      zh-Hant: |-
        當牠旋轉自己的身體時，
        會發出太陽般的光芒，
        讓敵人的眼睛暫時失明。
      zh-Hans: |-
        当它旋转自己的身体时，
        会发出太阳般的光芒，
        让敌人的眼睛暂时失明。
      en: |-
        When it rotates itself, it gives off light similar to
        the sun, thus blinding its foes.
      fr: |-
        Il produit une lumière aussi aveuglante
        que le soleil quand il se met à tournoyer.
      de: |-
        Es rotiert um die eigene Achse und strahlt dabei
        sonnengleiches Licht aus, mit dem es den Gegner
        blendet.
      es: |-
        Al girar emite una luz como la del sol, con la que
        consigue deslumbrar a sus enemigos.
      it: |-
        Ruota vorticosamente su se stesso per emanare
        una luce abbagliante che acceca il nemico.
    shield:
      ja-Hrkt: |-
        たいようエネルギーが　パワーの
        みなもと　なので　ひるまは　つよい。
        かいてんすると　からだが　ひかる。
      ja: |-
        太陽エネルギーが　パワーの
        源　なので　昼間は　強い。
        回転すると　体が　光る。
      ko: |-
        태양 에너지가 파워의
        근원이라서 낮에는 강하다.
        회전하면 몸이 빛난다.
      zh-Hant: |-
        太陽能量是力量的來源，
        所以在白天裡很強。
        旋轉時身體會發光。
      zh-Hans: |-
        太阳能量是其力量之源，
        所以白天会很强。
        旋转时身体会发光。
      en: |-
        Solar energy is the source of its power, so it is
        strong during the daytime. When it spins, its
        body shines.
      fr: |-
        Tirant sa force de l’énergie solaire, il est
        particulièrement puissant pendant la journée.
        Il s’illumine quand il tourne.
      de: |-
        Da es seine Energie aus Sonnenlicht gewinnt,
        ist es tagsüber am stärksten. Wenn es sich dreht,
        leuchtet es.
      es: |-
        Usa el sol como fuente de energía, por lo que es
        más poderoso de día. Brilla al rotar.
      it: |-
        L’energia solare è la fonte della sua potenza,
        per cui è più forte di giorno. Emana luce quando
        ruota su se stesso.
