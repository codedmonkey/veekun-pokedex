grimmsnarl:
  base_happiness: 50
  capture_rate: 45
  color: purple
  egg_groups:
    - fairy
    - humanshape
  evolution_chain: impidimp
  evolves_from: morgrem
  flavor_text:
    sword:
      ja-Hrkt: |-
        かみのけを　ぜんしんに　まきつけると
        きんりょくが　アップ。　カイリキーを
        ねじふせる　パワーを　はっきする。
      ja: |-
        髪の毛を　全身に　巻きつけると
        筋力が　アップ。　カイリキーを
        ねじ伏せる　パワーを　発揮する。
      ko: |-
        머리카락을 전신에 휘감아
        근력이 올랐다. 괴력몬을
        압도하는 파워를 발휘한다.
      zh-Hant: |-
        透過用頭髮裹住全身，
        讓肌肉的力量向上提升。
        能發揮出足以壓倒怪力的力量。
      zh-Hans: |-
        通过用头发裹住全身，
        让肌肉的力量向上提升。
        能发挥出足以压倒怪力的力量。
      en: |-
        With the hair wrapped around its body helping to
        enhance its muscles, this Pokémon can overwhelm
        even Machamp.
      fr: |-
        Il enroule ses cheveux autour de son corps pour
        augmenter sa masse musculaire, ce qui lui donne
        assez de force pour enserrer un Mackogneur.
      de: |-
        Wickelt es seine Haare um den ganzen Körper,
        verstärkt dies seine Muskelkraft. Das macht es so
        stark, dass es sogar Machomei bezwingen könnte.
      es: |-
        Cuando enrolla sus cabellos por todo el cuerpo,
        aumenta su potencia muscular. Posee una fuerza
        capaz de someter a Machamp.
      it: |-
        Se avvolge il corpo con i capelli, la sua potenza
        muscolare aumenta. La sua forza gli permette
        di immobilizzare a terra anche Machamp.
    shield:
      ja-Hrkt: |-
        かみのけは　きんにくせんいの　ように
        はたらき　ほどけると　しょくしゅの
        うごきで　あいてを　からめとる。
      ja: |-
        髪の毛は　筋肉繊維の　ように
        働き　ほどけると　触手の
        動きで　相手を　絡めとる。
      ko: |-
        머리카락은 근섬유의 역할을 하며
        매듭이 풀어지면 촉수와 같은
        움직임으로 상대를 묶어버린다.
      zh-Hant: |-
        毛髮能發揮肌肉纖維般的作用。
        伸展開來時會像觸手那樣
        把對手纏繞起來。
      zh-Hans: |-
        毛发能发挥肌肉纤维般的作用。
        伸展开来时会像触手那样
        把对手缠绕起来。
      en: |-
        Its hairs work like muscle fibers. When its hairs
        unfurl, they latch on to opponents, ensnaring
        them as tentacles would.
      fr: |-
        Ses cheveux sont comme des muscles filandreux
        qu’il peut détacher pour saisir ses adversaires,
        tels des tentacules.
      de: |-
        Seine Haare funktionieren wie Muskelfasern.
        Es kann diese vom Körper lösen und wie Tentakel
        verwenden, um Gegner einzufangen.
      es: |-
        Su cabello desempeña una función similar a la de
        fibras musculares. Al soltárselo, su movimiento
        tentacular le permite reducir a su objetivo.
      it: |-
        I sui capelli svolgono una funzione simile a quella
        delle fibre muscolari. Li può sciogliere e usare
        come dei tentacoli per avvinghiare il nemico.
