alomomola:
  base_happiness: 70
  capture_rate: 75
  color: pink
  egg_groups:
    - water1
    - water2
  evolution_chain: alomomola
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        The special membrane enveloping
        Alomomola has the ability to heal wounds.
      fr: |-
        La membrane spéciale qui entoure
        son corps a la capacité de guérir
        les blessures.
    white:
      en: |-
        Floating in the open sea is how they live.
        When they find a wounded Pokémon,
        they embrace it and bring it to shore.
      fr: |-
        Il vit en dérivant dans les grands
        océans. Quand il trouve des Pokémon
        blessés, il les ramène jusqu’à la côte.
    black-2:
      en: |-
        It gently holds injured and weak
        Pokémon in its fins. Its special
        membrane heals their wounds.
    white-2:
      en: |-
        It gently holds injured and weak
        Pokémon in its fins. Its special
        membrane heals their wounds.
    x:
      ja-Hrkt: |-
        おおうなばらを　ただよって　くらす。
        きずついた　ポケモンを　みつけると
        だきかかえて　きしまで　はこぶ。
      ja: |-
        大海原を　漂って　暮らす。
        傷ついた　ポケモンを　見つけると
        抱きかかえて　岸まで　運ぶ。
      ko: |-
        넓은 바다를 떠돌아다니며 산다.
        상처 입은 포켓몬을 발견하면
        안고서 물가까지 옮긴다.
      en: |-
        Floating in the open sea is how they live.
        When they find a wounded Pokémon,
        they embrace it and bring it to shore.
      fr: |-
        Il vit en dérivant dans les grands océans. Quand il
        trouve des Pokémon blessés, il les ramène jusqu’à
        la côte.
      de: |-
        Es treibt durch den Ozean. Findet es ein verletztes
        Pokémon, nimmt es dieses auf und trägt es zurück
        an Land.
      es: |-
        Vive flotando a la deriva en mar abierto. Siempre que
        encuentra un Pokémon herido, lo abraza y lo lleva a la
        costa.
      it: |-
        Vive in mare aperto trasportato dalle onde. Se si
        imbatte in un Pokémon ferito, lo riaccompagna a riva.
    'y':
      ja-Hrkt: |-
        きずついたり　よわった　ポケモンを
        ヒレで　やさしく　かかえながら
        とくしゅな　ねんまくで　なおすのだ。
      ja: |-
        傷ついたり　弱った　ポケモンを
        ヒレで　優しく　抱えながら
        特殊な　粘膜で　治すのだ。
      ko: |-
        상처 입거나 약해진 포켓몬을
        지느러미로 부드럽게 안으며
        특수한 점막으로 치료한다.
      en: |-
        It gently holds injured and weak Pokémon in its
        fins. Its special membrane heals their wounds.
      fr: |-
        Il berce les Pokémon blessés dans ses nageoires et
        les guérit grâce à la membrane dont il est recouvert.
      de: |-
        Es umarmt verletzte und geschwächte Pokémon
        liebevoll mit seinen Flossen und heilt sie mit einem
        speziellen Schleim.
      es: |-
        Abraza gentilmente con sus aletas a Pokémon que
        están lastimados y cura sus heridas con su membrana
        especial.
      it: |-
        Abbraccia dolcemente con le sue pinne i Pokémon
        deboli o feriti e li guarisce grazie a una speciale
        membrana mucosa.
    omega-ruby:
      ja-Hrkt: |-
        おおうなばらを　ただよって　くらす。
        きずついた　ポケモンを　みつけると
        だきかかえて　きしまで　はこぶ。
      ja: |-
        大海原を　漂って　暮らす。
        傷ついた　ポケモンを　見つけると
        抱きかかえて　岸まで　運ぶ。
      ko: |-
        넓은 바다를 떠돌아다니며 산다.
        상처 입은 포켓몬을 발견하면
        안고서 물가까지 옮긴다.
      en: |-
        Floating in the open sea is how they live.
        When they find a wounded Pokémon,
        they embrace it and bring it to shore.
      fr: |-
        Il vit en dérivant dans les grands océans. Quand il trouve
        des Pokémon blessés, il les ramène jusqu’à la côte.
      de: |-
        Es treibt durch den Ozean. Findet es ein verletztes Pokémon,
        nimmt es dieses auf und trägt es zurück an Land.
      es: |-
        Vive flotando a la deriva en mar abierto. Siempre que
        encuentra un Pokémon herido, lo abraza y lo lleva a la
        costa.
      it: |-
        Vive in mare aperto trasportato dalle onde. Se si imbatte
        in un Pokémon ferito, lo riaccompagna a riva.
    alpha-sapphire:
      ja-Hrkt: |-
        きずついたり　よわった　ポケモンを
        ヒレで　やさしく　かかえながら
        とくしゅな　ねんまくで　なおすのだ。
      ja: |-
        傷ついたり　弱った　ポケモンを
        ヒレで　優しく　抱えながら
        特殊な　粘膜で　治すのだ。
      ko: |-
        상처 입거나 약해진 포켓몬을
        지느러미로 부드럽게 안으며
        특수한 점막으로 치료한다.
      en: |-
        It gently holds injured and weak Pokémon in its
        fins. Its special membrane heals their wounds.
      fr: |-
        Il berce les Pokémon blessés dans ses nageoires et les guérit
        grâce à la membrane dont il est recouvert.
      de: |-
        Es umarmt verletzte und geschwächte Pokémon liebevoll mit
        seinen Flossen und heilt sie mit einem speziellen Schleim.
      es: |-
        Abraza gentilmente con sus aletas a Pokémon que están
        lastimados y cura sus heridas con su membrana especial.
      it: |-
        Abbraccia dolcemente con le sue pinne i Pokémon deboli
        o feriti e li guarisce grazie a una speciale membrana mucosa.
    sun:
      ja-Hrkt: |-
        きずついた　ポケモンを　だきしめ
        とくしゅな　ねんえきで　きずを
        ふさぐ。　そのりゆうは　ふめい。
      ja: |-
        傷ついた　ポケモンを　抱きしめ
        特殊な　粘液で　傷を
        ふさぐ。　その理由は　不明。
      ko: |-
        다친 포켓몬을 끌어안아
        특수한 점액으로 상처를
        덮는다. 그 이유는 불명이다.
      zh-Hant: |-
        抱著受傷的寶可夢，
        用特殊的黏液敷傷口。
        但理由不明。
      zh-Hans: |-
        抱着受伤的宝可梦，
        用特殊的粘液敷伤口。
        但其中的理由不太清楚。
      en: |-
        It uses its special mucus to close the wounds of
        injured Pokémon. The reason for this behavior
        remains unknown.
      fr: |-
        Il recueille les Pokémon blessés et referme
        leurs plaies grâce à son mucus spécial.
        Par pur altruisme ? Nul ne le sait.
      de: |-
        Es umarmt verletzte Pokémon und bedeckt ihre
        Wunden mit einem speziellen Schleim. Niemand
        weiß, warum es das tut.
      es: |-
        Se acerca a los Pokémon heridos y cura sus
        heridas con la mucosidad especial que segrega.
        Se desconoce el motivo de este comportamiento.
      it: |-
        Abbraccia i Pokémon feriti e li guarisce grazie a
        uno speciale liquido viscoso.
        Non si sa perché lo faccia.
    moon:
      ja-Hrkt: |-
        おおうなばらを　ただよって　くらす。
        ママンボウの　まわりには　おおくの
        みずポケモンが　あつまってくる。
      ja: |-
        大海原を　漂って　暮らす。
        ママンボウの　周りには　多くの
        みずポケモンが　集まってくる。
      ko: |-
        넓은 바다를 떠돌아다니며 산다.
        맘복치 주변에는 많은
        물포켓몬들이 모여든다.
      zh-Hant: |-
        漂浮在汪洋大海上生活。
        保母曼波的周圍
        會聚集起許多水屬性寶可夢。
      zh-Hans: |-
        漂浮在汪洋大海上生活。
        保姆曼波的周围
        会聚集起许多水属性宝可梦。
      en: |-
        They float upon the open sea. Many water
        Pokémon gather in the area around Alomomola.
      fr: |-
        Il se laisse dériver au gré des courants
        océaniques profonds. De nombreux Pokémon
        Eau se rassemblent toujours autour de lui.
      de: |-
        Es treibt durch den Ozean. Um Mamolida
        versammeln sich stets viele Wasser-Pokémon.
      es: |-
        Vive flotando a la deriva en mar abierto. Muchos
        Pokémon de tipo Agua se arremolinan a su
        alrededor.
      it: |-
        Vive in mare aperto, lasciandosi trasportare
        dalle onde. Attorno gli si radunano molti
        Pokémon di tipo Acqua.
    ultra-sun:
      ja-Hrkt: |-
        りょうしは　ながい　こうかいの　とき
        つれていく。　ママンボウが　いれば
        いしゃも　くすりも　いらないからだ。
      ja: |-
        漁師は　長い　航海の　とき
        連れていく。　ママンボウが　いれば
        医者も　薬も　いらないからだ。
      ko: |-
        어부가 긴 항해를 할 때
        데려간다. 맘복치가 있으면
        의사도 약도 필요 없기 때문이다.
      zh-Hant: |-
        漁夫在長程航海時會帶著牠。
        有保母曼波在身邊
        就不需要醫生或藥物了。
      zh-Hans: |-
        渔夫在长距离航海时会带着它。
        因为有了保姆曼波，
        医生和药都不需要了。
      en: |-
        Fishermen take them along on long voyages,
        because if you have an Alomomola with you,
        there’ll be no need for a doctor or medicine.
      fr: |-
        Ses talents de guérisseur sont tels que
        les marins l’emportent quand ils embarquent
        pour une longue traversée.
      de: |-
        Auf langen Seereisen lassen sich Fischer von
        Mamolida begleiten. So ersparen Sie sich nämlich
        einen Arzt und Medizin.
      es: |-
        Los pescadores siempre lo llevan consigo en las
        travesías largas, porque al tener un Alomomola
        no les hacen falta ni medicinas ni médicos.
      it: |-
        I pescatori li portano sempre con sé quando
        partono per lunghe traversate, perché dove c’è
        un Alomomola non servono medici né medicine.
    ultra-moon:
      ja-Hrkt: |-
        よわった　ポケモンを　たすけるのは
        それを　ねらう　ポケモンに
        じぶんも　おそわれるから　らしい。
      ja: |-
        弱った　ポケモンを　助けるのは
        それを　狙う　ポケモンに
        自分も　襲われるから　らしい。
      ko: |-
        약해진 포켓몬을 도와주는 것은
        이를 노리고 오는 포켓몬에게
        자신도 공격받기 때문이라고 한다.
      zh-Hant: |-
        之所以救助衰弱的寶可夢，
        好像是因為自己也會被
        盯上牠們的寶可夢襲擊。
      zh-Hans: |-
        之所以会救助体弱的宝可梦，
        好像是因为盯上它们的
        宝可梦也会攻击它自己。
      en: |-
        The reason it helps Pokémon in a weakened
        condition is that any Pokémon coming after
        them may also attack Alomomola.
      fr: |-
        On pense qu’il protège les Pokémon affaiblis
        parce qu’il partage avec eux les mêmes
        prédateurs.
      de: |-
        Mamolida kümmert sich offenbar um verletzte
        Pokémon, um nicht selbst von denen angegriffen
        zu werden, die es auf diese abgesehen haben.
      es: |-
        Se cree que ayuda a los Pokémon heridos y
        debilitados de forma que los depredadores
        naturales de estos no le ataquen a él también.
      it: |-
        Sembra che aiuti i Pokémon indeboliti per
        non rischiare di essere attaccato da eventuali
        loro predatori.
