frillish:
  base_happiness: 50
  capture_rate: 190
  color: white
  egg_groups:
    - indeterminate
  evolution_chain: frillish
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        With its thin, veil-like arms wrapped
        around the body of its opponent,
        it sinks to the ocean floor.
      fr: |-
        Il s’enfonce dans les profondeurs de la
        mer en emmenant son ennemi, qu’il ligote
        avec ses bras fins comme des voiles.
    white:
      en: |-
        They paralyze prey with poison,
        then drag them down to their lairs,
        five miles below the surface.
      fr: |-
        Il paralyse ses proies avec du poison et
        les entraîne jusqu’à son antre, qu’on
        dit situé à 8 000 m de profondeur.
    black-2:
      en: |-
        If its veil-like arms stun and wrap
        a foe, that foe will be dragged miles
        below the surface, never to return.
    white-2:
      en: |-
        If its veil-like arms stun and wrap
        a foe, that foe will be dragged miles
        below the surface, never to return.
    x:
      ja-Hrkt: |-
        えものを　どくで　しびれさせて
        ８０００メートルの　しんかいに
        あるという　すみかに　つれていく。
      ja: |-
        獲物を　毒で　しびれさせて
        ８０００メートルの　深海に
        あるという　住処に　連れていく。
      ko: |-
        먹이를 독으로 마비시켜
        8000m 심해에
        있다는 거처로 데려간다.
      en: |-
        They paralyze prey with poison, then drag them
        down to their lairs, five miles below the surface.
      fr: |-
        Il paralyse ses proies avec du poison et les entraîne
        jusqu’à son antre, qu’on dit situé à 8 000 m de
        profondeur.
      de: |-
        Es lähmt seine Beute mit Gift und verschleppt sie
        in seinen Unterschlupf, 8 km unter dem Meeresspiegel.
      es: |-
        Paraliza a sus presas con veneno y las lleva a su
        morada, que se encuentra a 8000 m en el fondo del
        mar.
      it: |-
        Paralizza la preda con il veleno e la porta nella sua
        dimora a 8000 m in fondo al mare.
    'y':
      ja-Hrkt: |-
        ベールの　ような　てあしを　まきつけ
        しびれさせると　８０００メートルの
        しんかいに　つれこんで　ころすのだ。
      ja: |-
        ベールの　ような　手足を　巻きつけ
        しびれさせると　８０００メートルの
        深海に　連れこんで　殺すのだ。
      ko: |-
        베일 같은 손발을 휘감아
        마비시켜서 8000m의
        심해에 데려가 끝장낸다.
      en: |-
        If its veil-like arms stun and wrap a foe, that foe will
        be dragged miles below the surface, never
        to return.
      fr: |-
        Il enserre ses proies dans ses voiles et les entraîne
        sous la surface de la mer jusqu’à plus de 8 000 m
        de profondeur.
      de: |-
        Es schlingt seine schleierartigen Arme um seine
        Beute und entführt sie 8 000 m in die Tiefe,
        wo es sie schließlich tötet.
      es: |-
        Rodea a sus presas con sus tentáculos, las entumece
        y las arrastra a 8000 m de profundidad hasta que las
        ahoga.
      it: |-
        Paralizza la preda con i suoi tentacoli a forma di velo
        e poi la trascina a 8000 m sotto il livello del mare.
    omega-ruby:
      ja-Hrkt: |-
        えものを　どくで　しびれさせて
        ８０００メートルの　しんかいに
        あるという　すみかに　つれていく。
      ja: |-
        獲物を　毒で　しびれさせて
        ８０００メートルの　深海に
        あるという　住処に　連れていく。
      ko: |-
        먹이를 독으로 마비시켜
        8000m 심해에
        있다는 거처로 데려간다.
      en: |-
        They paralyze prey with poison, then drag them
        down to their lairs, five miles below the surface.
      fr: |-
        Il paralyse ses proies avec du poison et les entraîne jusqu’à
        son antre, qu’on dit situé à 8 000 m de profondeur.
      de: |-
        Es lähmt seine Beute mit Gift und verschleppt sie in seinen
        Unterschlupf, 8 km unter dem Meeresspiegel.
      es: |-
        Paraliza a sus presas con veneno y las lleva a su morada, que
        se encuentra a 8000 m en el fondo del mar.
      it: |-
        Paralizza la preda con il veleno e la porta nella sua dimora
        a 8000 m in fondo al mare.
    alpha-sapphire:
      ja-Hrkt: |-
        ベールの　ような　てあしを　まきつけ
        しびれさせると　８０００メートルの
        しんかいに　つれこんで　ころすのだ。
      ja: |-
        ベールの　ような　手足を　巻きつけ
        しびれさせると　８０００メートルの
        深海に　連れこんで　殺すのだ。
      ko: |-
        베일 같은 손발을 휘감아
        마비시켜서 8000m의
        심해에 데려가 끝장낸다.
      en: |-
        If its veil-like arms stun and wrap a foe, that foe will
        be dragged miles below the surface, never
        to return.
      fr: |-
        Il enserre ses proies dans ses voiles et les entraîne
        sous la surface de la mer jusqu’à plus de 8 000 m
        de profondeur.
      de: |-
        Es schlingt seine schleierartigen Arme um seine Beute und
        entführt sie 8 000 m in die Tiefe, wo es sie schließlich tötet.
      es: |-
        Rodea a sus presas con sus tentáculos, las entumece y las
        arrastra a 8000 m de profundidad hasta que las ahoga.
      it: |-
        Paralizza la preda con i suoi tentacoli a forma di velo e poi
        la trascina a 8000 m sotto il livello del mare.
    ultra-sun:
      ja-Hrkt: |-
        ベールのような　てあしを　まきつけ
        およいでいる　えものを
        しんかいに　ひきずりこんでしまう。
      ja: |-
        ベールのような　手足を　巻きつけ
        泳いでいる　獲物を
        深海に　引きずりこんでしまう。
      ko: |-
        베일 같은 손발을 휘감아
        헤엄치는 먹이를
        심해로 끌고 간다.
      zh-Hant: |-
        會用薄紗般的手腳纏住
        正在游泳的獵物，
        將對方拖進深海。
      zh-Hans: |-
        会用薄纱般的手脚缠住
        正在游泳的猎物，
        将其拖入深海之中。
      en: |-
        It wraps its veillike arms and legs around prey
        swimming by and drags them down to the
        depths of the ocean.
      fr: |-
        Il enroule ses membres en forme de voiles
        autour de ses proies, puis les entraîne dans
        les abysses.
      de: |-
        Durch das Meer schwimmende Beute umschlingt
        es mit seinen schleierartigen Armen und zieht
        sie in die Tiefe.
      es: |-
        Hace uso de sus extremidades en forma de velo
        para atrapar a su presa cuando está nadando y
        arrastrarla al fondo del mar.
      it: |-
        Con i suoi tentacoli a forma di velo avvolge
        la sua preda mentre nuota e la trascina con sé
        sul fondo del mare.
    ultra-moon:
      ja-Hrkt: |-
        てきを　しびれさせ　おぼれさせるため
        ベールの　ような　てあしには　めには
        みえない　どくばりが　たくさん。
      ja: |-
        敵を　痺れさせ　溺れさせるため
        ベールの　ような　手足には
        目には　見えない　毒針が　たくさん。
      ko: |-
        적을 마비시켜서 물에 빠뜨리기 위해
        베일 같은 손발에는 눈에
        보이지 않는 독침이 잔뜩 있다.
      zh-Hant: |-
        為了讓敵人麻痺而溺斃，
        牠那薄紗般的手腳上長著
        許多肉眼看不見的毒針。
      zh-Hans: |-
        为了麻痹敌人，让其溺毙，
        薄纱般的手脚上有许多
        肉眼无法看到的毒针。
      en: |-
        Using the invisible poison spikes on its veillike
        arms and legs, it paralyzes its enemies and
        causes them to drown.
      fr: |-
        Ses membres en forme de voiles sont couverts
        de dards venimeux invisibles qui lui servent
        à paralyser ses ennemis avant de les noyer.
      de: |-
        Mit bloßem Auge nicht sichtbare Giftstacheln
        bedecken seine schleierartigen Arme. Mit ihnen
        lähmt es seine Beute, bevor es sie ertränkt.
      es: |-
        Paraliza y ahoga a sus enemigos con sus
        tentáculos en forma de velo, cubiertos de
        multitud de púas venenosas imperceptibles.
      it: |-
        I suoi tentacoli a forma di velo sono ricoperti
        da invisibili pungiglioni velenosi con i quali
        paralizza il nemico per poi annegarlo.
    sword:
      ja-Hrkt: |-
        ベールの　ような　てあしで　エモノを
        だきかかえ　８０００メートルの
        しんかいへと　ひきずりこむ。
      ja: |-
        ベールの　ような　手足で　獲物を
        抱きかかえ　８０００メートルの
        深海へと　引きずり込む。
      ko: |-
        베일과도 같은 손발로 먹이를
        끌어안아 8000m 아래의
        심해로 끌고 들어간다.
      zh-Hant: |-
        會用薄紗般的手腳
        纏住獵物，將對手拖進
        ８０００公尺深的海中。
      zh-Hans: |-
        会用薄纱般的手脚
        缠住猎物，将对手拖进
        ８０００米深的海中。
      en: |-
        It envelops its prey in its veillike arms and draws
        it down to the deeps, five miles below the
        ocean’s surface.
      fr: |-
        Il utilise ses membres en forme de voiles
        pour enlacer ses proies et les entraîner à 8 000 m
        de profondeur sous la surface de l’eau.
      de: |-
        Es hält seine Beute mit seinen schleierartigen
        Armen fest und zerrt sie 8 000 m tief ins Meer.
      es: |-
        Atenaza a las presas con sus tentáculos en forma
        de velo y las sumerge a 8000 m de profundidad.
      it: |-
        Agguanta la preda con i suoi tentacoli a forma di
        velo e poi la trascina a 8.000 m sotto il livello
        del mare.
    shield:
      ja-Hrkt: |-
        かいていに　しずんだ　こだいとしの
        じゅうみんが　ポケモンに　なったと
        いう　いいつたえが　のこされている。
      ja: |-
        海底に　沈んだ　古代都市の
        住民が　ポケモンに　なったと
        いう　言い伝えが　残されている。
      ko: |-
        해저에 가라앉은 고대 도시의
        주민이 포켓몬이 되었다는
        전설이 남아 있다.
      zh-Hant: |-
        據流傳至今的傳說所述，
        牠是由沉沒到海底的古代都市
        的居民變成的寶可夢。
      zh-Hans: |-
        据流传至今的传说里所述，
        它是由沉没到海底的古代都市
        的居民变成的宝可梦。
      en: |-
        Legend has it that the residents of a sunken
        ancient city changed into these Pokémon.
      fr: |-
        Certaines légendes racontent que les Viskuse
        sont les habitants d’une ancienne cité engloutie
        qui ont été changés en Pokémon.
      de: |-
        Einer Sage nach sind Quabbel in Wirklichkeit
        Bewohner einer uralten, im Meer versunkenen
        Stadt, die zu Pokémon wurden.
      es: |-
        Cuenta la leyenda que los Frillish son en realidad
        los habitantes de una antigua ciudad sumergida
        convertidos en Pokémon.
      it: |-
        La leggenda narra che i Frillish siano in realtà gli
        abitanti di un’antica città sommersa che si sono
        trasformati in Pokémon.
