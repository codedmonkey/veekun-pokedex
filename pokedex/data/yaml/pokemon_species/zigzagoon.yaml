zigzagoon:
  base_happiness: 50
  capture_rate: 255
  color: brown
  egg_groups:
    - ground
  evolution_chain: zigzagoon
  evolves_from: ~
  flavor_text:
    ruby:
      en: |-
        ZIGZAGOON restlessly wanders
        everywhere at all times. This POKéMON
        does so because it is very curious.It becomes interested in anything
        that it happens to see.
    sapphire:
      en: |-
        The hair on ZIGZAGOON’s back is 
        bristly. It rubs the hard back hair
        against trees to leave its territorialmarkings.
        This POKéMON may play dead to fool foes
        in battle.
    emerald:
      en: |-
        Rubbing its nose against the ground, it
        always wanders about back and forth in
        search of something. It is distinguished
        by the zigzag footprints it leaves.
    firered:
      en: |-
        A POKéMON with abundant curiosity.
        It shows an interest in everything, so it
        always zigs and zags.
    leafgreen:
      en: |-
        A POKéMON with abundant curiosity.
        It shows an interest in everything, so it
        always zigs and zags.
    diamond:
      en: |-
        It walks in zigzag fashion. It is
        good at finding items in the
        grass and even in the ground.
    pearl:
      en: |-
        It walks in zigzag fashion. It is
        good at finding items in the
        grass and even in the ground.
    platinum:
      en: |-
        It walks in zigzag fashion. It is
        good at finding items in the
        grass and even in the ground.
    heartgold:
      en: |-
        It gets interested in everything,
        which is why it zigs and zags.
        It is good at finding items.
    soulsilver:
      en: |-
        It gets interested in everything,
        which is why it zigs and zags.
        It is good at finding items.
    black:
      en: |-
        It walks in zigzag fashion. It is
        good at finding items in the
        grass and even in the ground.
      fr: |-
        Il marche en zigzaguant et n’a
        pas son pareil pour trouver des
        objets dans l’herbe ou sous terre.
    white:
      en: |-
        It walks in zigzag fashion. It is
        good at finding items in the
        grass and even in the ground.
      fr: |-
        Il marche en zigzaguant et n’a
        pas son pareil pour trouver des
        objets dans l’herbe ou sous terre.
    black-2:
      en: |-
        It walks in zigzag fashion. It is
        good at finding items in the
        grass and even in the ground.
    white-2:
      en: |-
        It walks in zigzag fashion. It is
        good at finding items in the
        grass and even in the ground.
    x:
      ja-Hrkt: |-
        ジグザグに　あるいて　くさかげや
        じめんに　うまっている　たからものを
        みつけるのが　とくいな　ポケモン。
      ja: |-
        ジグザグに　歩いて　草陰や
        地面に　埋まっている　宝物を
        見つけるのが　得意な　ポケモン。
      ko: |-
        지그재그로 걸어서 풀숲이나
        땅에 묻혀 있는 보물을
        찾아내는 것이 특기인 포켓몬이다.
      en: |-
        It walks in zigzag fashion. It’s good at finding
        items in the grass and even in the ground.
      fr: |-
        Il marche en zigzaguant et n’a pas son pareil pour
        trouver des objets dans l’herbe ou sous terre.
      de: |-
        Es läuft im Zickzack. Es hat das Talent, Items
        im Gras, aber auch im Boden, zu finden.
      es: |-
        Se mueve en zigzag. Se le da bien encontrar
        objetos ocultos en la hierba e incluso enterrados.
      it: |-
        Avanza a zigzag. È bravo a trovare strumenti
        nell’erba e sul terreno.
    'y':
      ja-Hrkt: |-
        こうきしん　おうせいな　ポケモン。
        なににでも　きょうみを　もつので
        いつも　ジグザグに　あるいている。
      ja: |-
        好奇心　旺盛な　ポケモン。
        なににでも　興味を　持つので
        いつも　ジグザグに　歩いている。
      ko: |-
        호기심이 왕성한 포켓몬.
        무엇이든지 흥미를 가지므로
        항상 지그재그로 걷고 있다.
      en: |-
        A Pokémon with abundant curiosity. It shows an
        interest in everything, so it always zigzags.
      fr: |-
        Un Pokémon d’une curiosité insatiable. Il montre
        de l’intérêt pour tout ce qui l’entoure et passe d’un
        endroit à un autre en zigzaguant pour tout regarder.
      de: |-
        Ein sehr neugieriges Pokémon. Es zeigt an allem
        Interesse, daher läuft es zickzack.
      es: |-
        Es un Pokémon muy inquieto, se interesa por todo.
        Siempre está de aquí para allá.
      it: |-
        L’estrema curiosità lo porta a spostarsi di continuo
        in ogni direzione.
    omega-ruby:
      ja-Hrkt: |-
        いつも　あっち　こっちへ　ジグザグ　あるくのは
        こうきしんが　とても　つよくて　めに　うつる
        いろんな　ものに　きょうみを　もつからだ。
      ja: |-
        いつも　あっち　こっちへ　ジグザグ　歩くのは
        好奇心が　とても　強くて　目に　映る
        色んな　ものに　興味を　持つからだ。
      ko: |-
        항상 이쪽저쪽 지그재그로 걷는 것은
        호기심이 매우 강해서 눈에 비친
        여러 가지 것들에 흥미를 느끼기 때문이다.
      en: |-
        Zigzagoon restlessly wanders everywhere at all times.
        This Pokémon does so because it is very curious. It becomes
        interested in anything that it happens to see.
      fr: |-
        Zigzaton se promène nerveusement un peu partout. En effet,
        ce Pokémon est très curieux. Tout ce qu’il voit l’intéresse.
      de: |-
        Zigzachs ist ein rastloser Wanderer. Dieses Pokémon
        ist nämlich sehr neugierig und es inspiziert alles, was ihm
        zufällig begegnet.
      es: |-
        Zigzagoon está todo el día dando vueltas de aquí para allá.
        Es un Pokémon muy inquieto. Se interesa por todo lo que se
        encuentra en su camino.
      it: |-
        Zigzagoon scorrazza a destra e a manca senza sosta,
        a causa della sua indole molto curiosa. Qualunque cosa
        veda riesce ad attirare la sua attenzione.
    alpha-sapphire:
      ja-Hrkt: |-
        せなかの　かたい　けを　じゅもくに　こすりつけ
        じぶんの　なわばりで　ある　しるしを　つける。
        しんだ　ふりを　して　てきの　めを　ごまかすぞ。
      ja: |-
        背中の　硬い　毛を　樹木に　こすりつけ
        自分の　縄張りで　ある　印を　つける。
        死んだ　ふりを　して　敵の　目を　誤魔化すぞ。
      ko: |-
        등의 뻣뻣한 털을 나무에 문질러서
        자신의 영역이란 표시를 해둔다.
        죽은 척하며 적의 눈을 속인다.
      en: |-
        The hair on Zigzagoon’s back is bristly. It rubs the hard back
        hair against trees to leave its territorial markings. This Pokémon
        may play dead to fool foes in battle.
      fr: |-
        Les poils sur le dos de Zigzaton sont durs. Il frotte son dos
        contre les arbres pour marquer son territoire. Ce Pokémon
        fait parfois le mort pour tromper ses ennemis au combat.
      de: |-
        Das Haar auf Zigzachs’ Rücken ist struppig. Es reibt seine
        Rückenborsten an Bäumen, um sein Revier zu markieren.
        Dieses Pokémon stellt sich im Kampf schon einmal tot,
        um seine Feinde reinzulegen.
      es: |-
        Zigzagoon tiene erizado el pelo del lomo, y suele frotárselo
        contra los árboles para marcar su territorio. Este Pokémon
        hace como si estuviera debilitado para engañar a sus
        enemigos en combate.
      it: |-
        La schiena di Zigzagoon è caratterizzata da una folta pelliccia
        rizzata. Per delimitare il suo territorio strofina il suo pelo irsuto
        contro i tronchi degli alberi. Per confondere i nemici, in lotta
        si finge morto.
    sword:
      ja-Hrkt: |-
        かたい　たいもうを　きに　こすりつけ
        ナワバリの　しるしを　つける。
        ガラルの　ジグザグマより　おんこう。
      ja: |-
        硬い　体毛を　木に　こすりつけ
        縄張りの　印を　付ける。
        ガラルの　ジグザグマより　温厚。
      ko: |-
        뻣뻣한 털을 나무에 문질러서
        영역을 표시한다.
        가라르의 지그제구리보다 온순하다.
      zh-Hant: |-
        會用背上的硬毛摩擦樹木，
        留下代表自己地盤的標記。
        性情比伽勒爾的蛇紋熊溫馴。
      zh-Hans: |-
        会用背上的硬毛摩擦树木，
        留下代表自己地盘的标记。
        性情比伽勒尔的蛇纹熊温驯。
      en: |-
        It marks its territory by rubbing its bristly fur on
        trees. This variety of Zigzagoon is friendlier and
        calmer than the kind native to Galar.
      fr: |-
        Il frotte son pelage dur sur les arbres pour
        marquer son territoire. Il est plus docile
        que son cousin de Galar.
      de: |-
        Sie markieren ihr Revier, indem sie ihr hartes Fell
        an Bäumen reiben. Sie sind weniger aggressiv als
        die Zigzachs der Galar-Region.
      es: |-
        Frota su pelo hirsuto contra los árboles con el fin
        de marcar su territorio. Tiene un carácter más
        afable que el Zigzagoon de Galar.
      it: |-
        Strofina la sua pelliccia ispida contro i tronchi
        degli alberi per delimitare il suo territorio. Ha un
        carattere più pacifico dello Zigzagoon di Galar.
    shield:
      ja-Hrkt: |-
        ガラルの　ジグザグマが　ほかの
        ちいきに　てきおうした　すがた。
        さがしものを　みつけるのが　とくい。
      ja: |-
        ガラルの　ジグザグマが　ほかの
        地域に　適応した　姿。
        探し物を　見つけるのが　得意。
      ko: |-
        가라르의 지그제구리가
        다른 지역에 적응한 모습이다.
        물건을 찾는 게 특기다.
      zh-Hant: |-
        伽勒爾的蛇紋熊適應了
        其他地區環境後的樣子。
        十分擅長找東西。
      zh-Hans: |-
        伽勒尔的蛇纹熊适应了
        其他地区环境后的样子。
        十分擅长找东西。
      en: |-
        Zigzagoon that adapted to regions outside
        Galar acquired this appearance. If you’ve lost
        something, this Pokémon can likely find it.
      fr: |-
        Le Zigzaton de Galar a adopté cette forme
        dans les autres régions.
        Il est très doué pour dénicher des choses.
      de: |-
        Diese Form nahmen die Zigzachs Galars an, um
        sich an andere Regionen anzupassen. Sie haben
        ein Talent dafür, Dinge aufzuspüren.
      es: |-
        El Zigzagoon de Galar desarrolló este aspecto
        tras adaptarse a otras regiones. Muestra una gran
        habilidad a la hora de encontrar cosas.
      it: |-
        Lo Zigzagoon di Galar ha assunto questo aspetto
        negli altri territori in cui si è diffuso. Ritrovare
        gli oggetti smarriti è la sua specialità.
