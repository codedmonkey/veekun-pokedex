    black-2:
      en: |-
        It’s small, but its body temperature
        is over 1,100 degrees F. Embers escape
        its mouth and nose when it breathes.
    white-2:
      en: |-
        It’s small, but its body temperature
        is over 1,100 degrees F. Embers escape
        its mouth and nose when it breathes.
    x:
      ja-Hrkt: |-
        こがらだが　たいおんは　６００ど。
        いきを　すったり　はいたりするたび
        くちと　はなから　ひのこが　もれる。
      ja: |-
        小柄だが　体温は　６００度。
        息を　吸ったり　吐いたりするたび
        口と　鼻から　火の粉が　漏れる。
      ko: |-
        작은 몸이지만 체온은 600도다.
        숨을 들이쉬고 내쉴 때마다
        입과 코에서 불꽃이 샌다.
      en: |-
        It’s small, but its body temperature is over
        1,100 degrees Fahrenheit. Embers escape its
        mouth and nose when it breathes.
      fr: |-
        La température de son corps peut atteindre 600 °C.
        Son nez et sa bouche laissent échapper des
        flammèches.
      de: |-
        Seine Körpertemperatur misst 600 °C.
        Beim Ein- und Ausatmen springen
        glühende Kohlenstücke aus seinem Mund.
      es: |-
        Es pequeño, pero su cuerpo puede llegar a alcanzar
        600 °C. Cuando inspira y espira, expulsa llamas por la
        nariz y por la boca.
      it: |-
        È di piccole dimensioni, ma la temperatura del suo
        corpo è di 600 °C. Quando respira emette scintille
        da naso e bocca.
    'y':
      ja-Hrkt: |-
        マグマのような　けつえきが
        たいないに　ながれているため
        たいおんは　６００どにも　なる。
      ja: |-
        マグマのような　血液が
        体内に　流れているため
        体温は　６００度にも　なる。
      ko: |-
        마그마 같은 혈액이
        체내에 흐르고 있기 때문에
        체온은 600도나 된다.
      en: |-
        Its magma-like blood circulates throughout
        its body. Its body’s heat can top
        1,100 degrees Fahrenheit.
      fr: |-
        Son sang est chaud comme du magma et la
        température de son corps peut atteindre 600 °C.
      de: |-
        Durch seinen Körper fließt magmaartiges Blut.
        Die Körpertemperatur kann auf ca. 600 °C steigen.
      es: |-
        Su sangre es como magma y su temperatura corporal
        puede alcanzar los 600 °C.
      it: |-
        Il suo sangue assomiglia al magma. La sua
        temperatura corporea raggiunge i 600 °C.
    omega-ruby:
      ja-Hrkt: |-
        きいろい　ほのおを　くちから　ふいている　ときは
        けんこうな　しょうこだが　つかれていると　くろい
        けむりが　まざる　ように　なるぞ。
      ja: |-
        黄色い　炎を　口から　吹いている　ときは
        健康な　証拠だが　疲れていると　黒い
        煙が　混ざる　ように　なるぞ。
      ko: |-
        노란색 불꽃이 입에서 뿜어져 나오는 것은
        건강하다는 증거이지만 지쳐 있을 때는
        검은 연기가 섞이게 된다.
      en: |-
        Magby’s state of health is determined by observing the fire it
        breathes. If the Pokémon is spouting yellow flames from its
        mouth, it is in good health. When it is fatigued, black smoke
        will be mixed in with the flames.
      fr: |-
        L’état de santé de Magby peut être deviné selon le type
        de flamme qu’il crache. Si ce Pokémon crache des flammes
        jaunes, c’est qu’il est en bonne santé. Lorsqu’il est fatigué,
        de la fumée noire s’ajoute aux flammes.
      de: |-
        Magbys Gesundheitszustand kann man am Feuer erkennen,
        das es ausatmet. Wenn es gelbe Flammen ausstößt, ist es in
        guter Verfassung. Ist es erschöpft, vermischen sich die
        Flammen mit schwarzem Rauch.
      es: |-
        El estado de salud de Magby se puede determinar observando
        el fuego que emana al respirar. Si las llamas que echa por la
        boca son amarillas, está bien. Pero, si además de las llamas
        sale humo negro, está cansado.
      it: |-
        Lo stato di salute di Magby si evince osservando il fuoco
        che emette dalla bocca. Se sputa fiamme gialle, gode
        di buona salute, mentre se è stanco o affaticato, le fiamme
        sono miste a fumo nero.
    alpha-sapphire:
      ja-Hrkt: |-
        きいろい　ほのおを　くちから　ふいている　ときは
        けんこうな　しょうこだが　つかれていると　くろい
        けむりが　まざる　ように　なるぞ。
      ja: |-
        黄色い　炎を　口から　吹いている　ときは
        健康な　証拠だが　疲れていると　黒い
        煙が　混ざる　ように　なるぞ。
      ko: |-
        노란색 불꽃이 입에서 뿜어져 나오는 것은
        건강하다는 증거이지만 지쳐 있을 때는
        검은 연기가 섞이게 된다.
      en: |-
        Magby’s state of health is determined by observing the fire it
        breathes. If the Pokémon is spouting yellow flames from its
        mouth, it is in good health. When it is fatigued, black smoke
        will be mixed in with the flames.
      fr: |-
        L’état de santé de Magby peut être deviné selon le type
        de flamme qu’il crache. Si ce Pokémon crache des flammes
        jaunes, c’est qu’il est en bonne santé. Lorsqu’il est fatigué,
        de la fumée noire s’ajoute aux flammes.
      de: |-
        Magbys Gesundheitszustand kann man am Feuer erkennen,
        das es ausatmet. Wenn es gelbe Flammen ausstößt, ist es in
        guter Verfassung. Ist es erschöpft, vermischen sich die
        Flammen mit schwarzem Rauch.
      es: |-
        El estado de salud de Magby se puede determinar observando
        el fuego que emana al respirar. Si las llamas que echa por la
        boca son amarillas, está bien. Pero, si además de las llamas
        sale humo negro, está cansado.
      it: |-
        Lo stato di salute di Magby si evince osservando il fuoco
        che emette dalla bocca. Se sputa fiamme gialle, gode
        di buona salute, mentre se è stanco o affaticato, le fiamme
        sono miste a fumo nero.
    sun:
      ja-Hrkt: |-
        かざんちたいで　おおく　みかける。
        ヘタに　エサを　あげると　よろこび
        こうふんして　６００どの　ひを　ふく。
      ja: |-
        火山地帯で　多く　みかける。
        ヘタに　餌を　あげると　喜び
        興奮して　６００度の　火を　吹く。
      ko: |-
        화산지대에서 많이 보인다.
        어설프게 먹이를 주면 좋아하며
        흥분해서 600도의 불을 뿜는다.
      zh-Hant: |-
        經常能在火山地帶發現牠的蹤影。
        如果隨意餵牠東西吃的話，
        牠會很高興並激動得噴出６００度的火焰。
      zh-Hans: |-
        在火山地带经常能见到。
        如果冒失地给了它食物的话会很高兴，
        激动地喷出６００度的火。
      en: |-
        Many of these Pokémon can be seen in areas
        with volcanic activity. Feeding can get them so
        excited, they exhale flames of 1,100 degrees F.
      fr: |-
        Ce Pokémon est souvent aperçu dans les
        régions volcaniques. Donnez-lui à manger
        et il vous déclarera sa flamme... littéralement.
      de: |-
        Häufig in Vulkangebieten anzutreffen. Füttert
        man es, kann es sein, dass es vor lauter
        Freude 600 °C heißes Feuer ausstößt.
      es: |-
        Es fácil encontrarse con un Magby en áreas
        cercanas a volcanes. Si se le da comida, se
        emociona y expulsa fuego a 600 °C.
      it: |-
        Viene spesso avvistato nelle zone vulcaniche.
        Quando gli si dà da mangiare, si entusiasma
        e sputa fiamme a 600 °C.
    moon:
      ja-Hrkt: |-
        ブビィと　くらす　ゆうめいな
        とうげいかが　いる。　やわらかい
        ほのおが　いいさくひんを　うむらしい。
      ja: |-
        ブビィと　暮らす　有名な
        陶芸家が　いる。　柔らかい
        炎が　いい作品を　生むらしい。
      ko: |-
        마그비와 사는 유명한
        도예가가 있다. 부드러운
        불꽃이 좋은 작품을 만드는 듯하다.
      zh-Hant: |-
        有位著名的陶藝家和鴨嘴寶寶
        一起生活。用牠柔和的火似乎能
        創作出很棒的作品。
      zh-Hans: |-
        有和鸭嘴宝宝一起生活的
        著名的陶艺家。
        听说会用柔和的火创作出很棒的作品。
      en: |-
        A famous potter lives with a Magby.
        Apparently its soft flames produce fine works.
      fr: |-
        Magby est le partenaire privilégié d’un potier
        extrêmement célèbre. Sa flamme légère l’aiderait
        à créer des œuvres d’un raffinement exquis.
      de: |-
        Ein berühmter Kunstkeramiker hat ein Magby
        als Mitbewohner. Seine Kunstwerke profitieren
        von den sanften Flammen, die es ausstößt.
      es: |-
        Hay reputados alfareros que viven con Magby.
        Al parecer, sus suaves llamas son ideales para
        cocer grandes obras de alfarería.
      it: |-
        Pare che alcuni famosi vasai lavorino assieme
        a questi Pokémon, creando delle opere stupende
        grazie alle fiamme che producono.
    ultra-sun:
      ja-Hrkt: |-
        はなから　ちょろちょろと　ほのおが
        もれているときは　かぜを　ひいている。
        マグマのなかで　やすませて　あげてね。
      ja: |-
        鼻から　ちょろちょろと　炎が
        漏れているときは　風邪を　ひいている。
        マグマの中で　休ませて　あげてね。
      ko: |-
        코에서 불꽃이 줄줄 흐른다면
        감기에 걸린 것이다.
        마그마에서 쉬게 해 주자.
      zh-Hant: |-
        當火焰像打開水龍頭似地不停從
        鼻子冒出來時，就代表牠感冒了。
        這時就讓牠待在熔岩裡休息吧。
      zh-Hans: |-
        当火焰哧溜哧溜地从鼻子里
        漏出来时，就表示它感冒了。
        这时就让它去熔岩里休息会吧。
      en: |-
        When flames drip from its nose, that means it
        has a cold. Have it lie down for a nice rest in
        some magma.
      fr: |-
        Lorsque de petites flammes s’échappent
        de son nez, c’est qu’il est enrhumé. Le meilleur
        remède est encore de lui donner un bain de lave.
      de: |-
        Wenn es kleine Flammen aus seiner Nase
        ausstößt, ist es erkältet. Dann sollte man ihm
        eine Ruhepause in Magma gönnen.
      es: |-
        Cuando se le escapan pequeñas llamaradas por
        el hocico significa que está resfriado y el mejor
        remedio es un buen baño de magma.
      it: |-
        Quando dalle narici escono piccole fiamme
        tremule, significa che è raffreddato. In questi
        casi bisogna farlo riposare nel magma.
    ultra-moon:
      ja-Hrkt: |-
        たいおんは　つねに　６００どぜんご。
        ブビィが　おっこちると　ちいさな
        いけ　くらいなら　ひあがってしまう。
      ja: |-
        体温は　常に　６００度前後。
        ブビィが　落っこちると　小さな
        池　くらいなら　干上がってしまう。
      ko: |-
        체온은 항상 600도 전후다.
        마그비가 물에 떨어지면 작은
        연못 정도는 말라붙어 버린다.
      zh-Hant: |-
        體溫隨時保持在６００度左右。
        如果鴨嘴寶寶掉進小池塘裡，
        整池水馬上就會蒸發殆盡。
      zh-Hans: |-
        体温经常在６００度左右。
        如果鸭嘴宝宝掉到池塘里，
        池塘里的水就会被蒸发干净。
      en: |-
        Its body temperature is always around 1,100
        degrees Fahrenheit. If Magby falls into a small-
        enough pond, the whole thing will dry up.
      fr: |-
        Sa température corporelle est d’environ 600 °C.
        S’il tombe dans une mare, celle-ci s’évapore
        et il n’en reste plus rien.
      de: |-
        Seine Körpertemperatur liegt immer bei etwa
        600 °C. Wenn es in einen kleinen See fällt,
        trocknet dieser komplett aus.
      es: |-
        Su temperatura corporal ronda los 600 °C. Si
        cae en un pequeño estanque, es capaz de
        evaporarlo por completo.
      it: |-
        Ha una temperatura corporea di circa 600 °C.
        Se cade in un piccolo stagno, può farlo
        evaporare completamente.
    sword:
      ja-Hrkt: |-
        まだまだ　ちいさく　おくびょう。
        こうふんしたり　びっくりすると
        はなや　くちから　ひが　もれる。
      ja: |-
        まだまだ　小さく　臆病。
        興奮したり　びっくりすると
        鼻や　口から　火が　もれる。
      ko: |-
        아직은 작고 겁이 많다.
        흥분하거나 놀라면
        코나 입에서 불꽃이 새어 나온다.
      zh-Hant: |-
        體型還很小，且性情膽小。
        興奮或吃驚的時候，就會
        從鼻子和嘴巴裡冒出火焰。
      zh-Hans: |-
        不但身材很小，而且还很胆小。
        每次感到兴奋或是吃惊的时候，
        都会从嘴巴和鼻子里冒出火花。
      en: |-
        This Pokémon is still small and timid.
        Whenever Magby gets excited or surprised,
        flames leak from its mouth and its nose.
      fr: |-
        Ce n’est encore qu’un petit Pokémon craintif.
        Lorsqu’il est excité ou étonné, du feu s’échappe
        de son nez ou de sa bouche.
      de: |-
        Es ist noch klein und furchtsam. Wenn es sich
        aufregt oder erschrickt, entweichen Flammen aus
        seinem Mund und seiner Nase.
      es: |-
        Como todavía es pequeño, se asusta fácilmente.
        Cuando se emociona o se sorprende, se le
        escapa fuego por la nariz y por la boca.
      it: |-
        È ancora piccolo e si intimorisce facilmente.
        Quando si emoziona o si spaventa, emette fuoco
        dalla bocca o dal naso.
    shield:
      ja-Hrkt: |-
        かざんの　まわりに　すんでいる。
        いちにちの　おわりには　マグマに
        つかり　つかれを　いやしている。
      ja: |-
        火山の　まわりに　棲んでいる。
        １日の　終わりには　マグマに　浸かり
        疲れを　癒している。
      ko: |-
        화산 주위에 살고 있다.
        하루를 마칠 때에는
        마그마에 잠겨 피로를 푼다.
      zh-Hant: |-
        棲息在火山的周圍。
        在一天結束時，會泡進
        熔岩中讓身體舒緩疲勞。
      zh-Hans: |-
        栖息在火山地带。
        会浸泡在岩浆中，
        疗愈一整天的疲劳。
      en: |-
        This Pokémon makes its home near volcanoes.
        At the end of the day, Magby soaks in magma,
        resting and recovering from the day’s fatigue.
      fr: |-
        Il vit près des volcans. À la fin de la journée,
        il se détend dans un bon bain de magma.
      de: |-
        Es lebt in der Nähe von Vulkanen. Nach einem
        anstrengenden Tag badet es in Magma und
        schöpft so neue Energie.
      es: |-
        Vive en los alrededores de los volcanes.
        Al final del día, se baña en magma para
        aliviar el cansancio.
      it: |-
        Vive nei pressi dei vulcani. Dopo una faticosa
        giornata, si gode un rilassante bagno nel magma.
