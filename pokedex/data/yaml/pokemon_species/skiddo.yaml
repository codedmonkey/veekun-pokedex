        최초의 포켓몬이라고 한다.
        온화한 성격의 포켓몬이다.
      en: |-
        Thought to be one of the first Pokémon to live in
        harmony with humans, it has a placid disposition.
      fr: |-
        Ce Pokémon paisible serait le premier à avoir jamais cohabité
        avec les humains.
      de: |-
        Man sagt, es sei eines der ersten Pokémon, die mit Menschen
        zusammengelebt haben. Es ist sehr ruhig und friedfertig.
      es: |-
        Se dice que fue la primera especie de Pokémon que se
