        ting wet.
    crystal:
      en: |-
        The bubble-like
        pattern on its
        stomach helps itcamouflage itself
        when it's in the
        water.
    ruby:
      en: |-
        AZUMARILL’s long ears are indispensable
        sensors. By focusing its hearing, this
        POKéMON can identify what kinds ofprey are around, even in rough and
        fast-running rivers.
    sapphire:
      en: |-
        AZUMARILL can make balloons out of
        air. It makes these air balloons if it
        spots a drowning POKéMON.The air balloons enable the POKéMON in
        trouble to breathe.
    emerald:
      en: |-
        It lives in water virtually all day long.
        Its body color and pattern act as
        camouflage that makes it tough for
        enemies to spot in water.
    firered:
      en: |-
        When it plays in water, it rolls up its
        elongated ears to prevent their insides
        from getting wet.
    leafgreen:
      en: |-
        By keeping still and listening intently, it
        can even tell what is in wild, fast-moving
        rivers.
    diamond:
      en: |-
        It lives in rivers and lakes. In
        water, its coloring and patterns
        trick the vision of foes.
    pearl:
      en: |-
        Its long ears are superb sensors.
        It can distinguish the movements
        of living things on riverbeds.
    platinum:
      en: |-
        It can spend all day in water,
        since it can inhale and store
        a large volume of air.
    heartgold:
      en: |-
        By keeping still and listening
        intently, it can tell what is in even
        wild, fast-moving rivers.
    soulsilver:
      en: |-
        When it plays in water, it rolls up
        its elongated ears to prevent their
        insides from getting wet.
    black:
      en: |-
        It can spend all day in water,
        since it can inhale and store
        a large volume of air.
      fr: |-
        Ses poumons peuvent contenir
        assez d’air pour lui permettre de
        passer une journée sous l’eau.
    white:
      en: |-
        It can spend all day in water,
        since it can inhale and store
        a large volume of air.
      fr: |-
        Ses poumons peuvent contenir
        assez d’air pour lui permettre de
        passer une journée sous l’eau.
    black-2:
      en: |-
        Its long ears are superb sensors.
        It can distinguish the movements of
        things in water and tell what they are.
    white-2:
      en: |-
        Its long ears are superb sensors.
        It can distinguish the movements of
        things in water and tell what they are.
    x:
      ja-Hrkt: |-
        ながい　みみは　すぐれた　センサー。
        かわぞこで　うごく　いきものの
        おとを　ききわける　ことが　できる。
      ja: |-
        長い　耳は　優れた　センサー。
        川底で　動く　生き物の　音を
        聞き分ける　ことが　できる。
      ko: |-
        긴 귀는 우수한 센서다.
        강바닥에서 움직이는 생명체의
        소리를 분간할 수 있다.
      en: |-
        Its long ears are superb sensors. It can distinguish
        the movements of living things on riverbeds.
      fr: |-
        Ses longues oreilles font un radar efficace.
        Elles décèlent les mouvements dans le lit des rivières.
      de: |-
        Seine langen Ohren sind hervorragende Sensoren.
        Mit ihnen kann es Bewegungen im Fluss wahrnehmen.
      es: |-
        Sus largas orejas son sensores que pueden percibir
        movimientos de seres vivos en el lecho del río.
      it: |-
        Le lunghe orecchie sono ottimi sensori. Distingue
        i movimenti di esseri viventi sui fondali fluviali.
    'y':
      ja-Hrkt: |-
        おなかの　あわのような　もようは
        みずの　なかで　じぶんの　すがたを
        カモフラージュ　してくれる。
      ja: |-
        お腹の　泡のような　模様は
        水の　中で　自分の　姿を
        カモフラージュ　してくれる。
      ko: |-
        배의 거품 같은 무늬는
        물속에서 자신의 모습을
        위장하게 해준다.
      en: |-
        The bubble-like pattern on its stomach helps it
        camouflage itself when it’s in the water.
      fr: |-
        Les motifs sur son ventre lui permettent de se
        camoufler lorsqu’il est dans l’eau.
      de: |-
        Das blasenähnliche Muster auf seinem Bauch hilft
        ihm, sich perfekt zu tarnen, wenn es im Wasser ist.
      es: |-
        Gracias al dibujo que tiene en el estómago, le resulta
        bastante fácil camuflarse en el agua.
      it: |-
        Le bolle disegnate sulla pancia gli permettono di
        mimetizzarsi quando si trova in acqua.
    omega-ruby:
      ja-Hrkt: |-
        ながい　みみは　マリルリの　だいじな　センサー。
        みみを　すませば　ながれの　はげしい　かわでも
        そこに　いる　えものの　しゅるいが　わかるぞ。
      ja: |-
        長い　耳は　マリルリの　大事な　センサー。
        耳を　澄ませば　流れの　激しい　川でも
        そこに　いる　獲物の　種類が　わかるぞ。
      ko: |-
        긴 귀는 마릴리의 중요한 센서다.
        귀를 기울이면 물살이 격한 강에서도
        그곳에 있는 먹이의 종류를 안다.
      en: |-
        Azumarill’s long ears are indispensable sensors. By focusing its
        hearing, this Pokémon can identify what kinds of prey are
        around, even in rough and fast-running rivers.
      fr: |-
        Les longues oreilles d’Azumarill sont des capteurs
        indispensables. Lorsqu’il se concentre pour écouter,
        ce Pokémon peut identifier les proies aux alentours,
        même dans les cours d’eau à fort courant ou les rapides.
      de: |-
        Azumarills lange Ohren dienen ihm als unentbehrliche
        Sensoren. Wenn es sein Gehör fokussiert, kann dieses
        Pokémon auch in reißenden Flüssen identifizieren,
        welche Art von Beute sich in seiner Nähe befindet.
      es: |-
        Azumarill puede hacer burbujas de aire si ve a algún Pokémon
        que esté a punto de ahogarse. Estas burbujas de aire son
        básicas para que los Pokémon puedan seguir respirando.
      it: |-
        Le lunghe orecchie di Azumarill sono sensori indispensabili.
        Concentrandosi sull’udito, è in grado di identificare che tipo
        di prede ci siano nelle vicinanze, anche in torrenti rapidi
        e impetuosi.
    alpha-sapphire:
      ja-Hrkt: |-
        くうきの　ふうせんを　つくる　ことが　できる。
        ポケモンが　おぼれていると　くうきだまを　だして
        こきゅうが　できる　ように　してあげるのだ。
      ja: |-
        空気の　風船を　つくる　ことが　できる。
        ポケモンが　おぼれていると　空気玉を　出して
        呼吸が　できる　ように　してあげるのだ。
      ko: |-
        공기로 풍선을 만들 수 있다.
        포켓몬이 물에 빠져 있으면 공기 방울을
        만들어내 호흡을 할 수 있게 해준다.
      en: |-
        Azumarill can make balloons out of air. It makes these air
        balloons if it spots a drowning Pokémon. The air balloons
        enable the Pokémon in trouble to breathe.
      fr: |-
        Azumarill peut faire des bulles d’air. Il fabrique ces bulles
        lorsqu’il voit un Pokémon en train de se noyer. Les bulles
        d’air permettent au Pokémon en difficulté de respirer.
      de: |-
        Azumarill kann aus Luft Ballons machen. Diese Luft-Ballons
        erzeugt es, wenn es ein ertrinkendes Pokémon erspäht.
        Durch die Ballons kann das Pokémon, das in Schwierigkeiten
        geraten ist, atmen.
      es: |-
        Azumarill puede hacer burbujas de aire si ve a algún Pokémon
        que esté a punto de ahogarse. Estas burbujas de aire son
        básicas para que los Pokémon puedan seguir respirando.
      it: |-
        Azumarill riesce a creare bolle d’aria in grado di aiutare
        un Pokémon che sta per affogare. Quando ne vede uno,
        Azumarill gli manda una bolla per aiutarlo a respirare.
    sword:
      ja-Hrkt: |-
        １にちの　ほとんどを　すいちゅうで
        すごす。　はれた　ひには　すいめんに
        うかんで　ひなたぼっこを　する。
      ja: |-
        １日の　ほとんどを　水中で　すごす。
        晴れた　日には　水面に　浮かんで
        日向ぼっこをする。
      ko: |-
        하루의 대부분을 물속에서
        지낸다. 맑은 날에는
        수면으로 올라와서 햇볕을 쬔다.
      zh-Hant: |-
        整天幾乎都是在水中
        度過。天氣晴朗時會
        浮在水面上曬太陽。
      zh-Hans: |-
        一天大部分的时间都在
        水中度过。天晴时会
        浮到水面上晒太阳。
      en: |-
        It spends most of its time in the water. On sunny
        days, Azumarill floats on the surface of the water
        and sunbathes.
      fr: |-
        Il passe la majeure partie de la journée
        dans l’eau. Quand il fait beau, il flotte
        à la surface pour prendre un bain de soleil.
      de: |-
        Es verbringt fast den ganzen Tag im Wasser.
        Bei schönem Wetter lässt sich Azumarill an der
        Oberfläche treiben und badet im Sonnenschein.
      es: |-
        Pasa la mayor parte del tiempo en el agua. Los
        días despejados, aprovecha para tomar el sol
        flotando en la superficie.
      it: |-
        Passa la maggior parte della giornata in acqua.
        Se è bel tempo galleggia in superficie per
        prendere il sole.
    shield:
      ja-Hrkt: |-
        くうきが　つまった　あわを　つくる。
        ルリリが　かわで　あそぶときは
        この　あわで　つつんで　あげるのだ。
      ja: |-
        空気が　詰まった　泡を　作る。
        ルリリが　川で　遊ぶときは
        この　泡で　包んであげるのだ。
      ko: |-
        공기로 가득 찬 거품을 만든다.
        루리리가 강에서 놀 때는
        이 거품으로 감싸준다.
      zh-Hant: |-
        會製作填滿空氣的泡泡。
        當露力麗到河裡玩耍的時候，
        牠就會用泡泡把露力麗包起來。
      zh-Hans: |-
        会制作填满空气的泡泡。
        当露力丽在河里玩的时候，
        它就会用这个泡泡包住露力丽。
      en: |-
        These Pokémon create air-filled bubbles. When
        Azurill play in rivers, Azumarill will cover them
        with these bubbles.
      fr: |-
        Il crée des bulles d’air dont il enveloppe
        gentiment les Azurill venus jouer dans la rivière.
      de: |-
        Azumarill kann mit Luft gefüllte Blasen erzeugen,
        in die es Azurill einhüllt, wenn diese im Fluss
        spielen.
      es: |-
        Crea burbujas llenas de aire con las que cubre a
        los Azurill cuando juegan en el río.
      it: |-
        Crea delle bolle d’aria con cui avvolge
        dolcemente gli Azurill che giocano nel fiume.
