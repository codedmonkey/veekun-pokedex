    x:
      ja-Hrkt: |-
        タマゴから　すがたを　あらわして
        せかいの　すべてを　うみだしたと
        シンオウしんわに　かたられている。
      ja: |-
        タマゴから　姿を　現して
        世界の　すべてを　生み出したと
        シンオウ神話に　語られている。
      ko: |-
        알에서 모습을 나타내
        모든 세계를 창조했다고
        신오신화에서 묘사된다.
      en: |-
        According to the legends of Sinnoh, this Pokémon
        emerged from an egg and shaped all there is in
        this world.
      fr: |-
        La mythologie de Sinnoh veut qu’il soit apparu sous
        forme d’Œuf et ait créé le monde.
      de: |-
        In den Legenden Sinnohs heißt es, es sei aus
        einem Ei geschlüpft und hätte die gesamte Welt
        geschaffen.
      es: |-
        Según la mitología de Sinnoh, Arceus surgió de un
        huevo y después creó todo el mundo.
      it: |-
        Secondo la mitologia di Sinnoh, Arceus è nato da
        un uovo e poi ha creato il mondo.
    'y':
      ja-Hrkt: |-
        うちゅうが　まだ　ない　ころに
        さいしょに　うまれた　ポケモンと
        しんわの　なかで　かたられている。
      ja: |-
        宇宙が　まだ　ない　ころに
        最初に　生まれた　ポケモンと
        神話の　中で　語られている。
      ko: |-
        우주가 아직 생기지 않았을 무렵에
        처음으로 태어난 포켓몬이라고
        신화 속에서 묘사된다.
      en: |-
        It is told in mythology that this Pokémon was born
        before the universe even existed.
      fr: |-
        Dans la mythologie, ce Pokémon existait déjà avant
        la formation de l’univers.
      de: |-
        Die Mythologie erzählt, dass dieses Pokémon geboren
        wurde, bevor das Universum überhaupt existierte.
      es: |-
        La mitología cuenta que este Pokémon nació antes
        de que el Universo existiera.
      it: |-
        Nei racconti mitologici si dice che questo Pokémon
        sia nato ancor prima dell’universo.
