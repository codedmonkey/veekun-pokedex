  flavor_text:
    sword:
      ja-Hrkt: |-
        みがきあげた　きんぞくの　ような
        からだは　かるいうえに　かたいが
        さびやすいのが　けってんなのだ。
      ja: |-
        磨きあげた　金属の　ような
        体は　軽いうえに　硬いが
        錆びやすいのが　欠点なのだ。
      ko: |-
        윤이 나는 금속과도 같은
        몸은 가벼우면서도 튼튼하지만
        녹슬기 쉽다는 것이 흠이다.
      zh-Hant: |-
        身體猶如打磨過的金屬，
        雖然輕而堅硬，卻有著
        容易生鏽的弱點。
      zh-Hans: |-
        身体犹如打磨过的金属，
        虽然轻而坚硬，却有着
        容易生锈的弱点。
      en: |-
        Its body resembles polished metal, and it’s both
        lightweight and strong. The only drawback is that
        it rusts easily.
      fr: |-
        Son corps, semblable à du métal poli,
        allie légèreté et solidité.
        Malheureusement, il rouille facilement.
      de: |-
        Sein an aufpoliertes Metall erinnernder Körper ist
        nicht nur leicht, sondern auch robust. Er hat
        jedoch den Nachteil, schnell zu rosten.
      es: |-
        Su cuerpo, similar a un metal pulido, es tan ligero
        como robusto. Sin embargo, tiene el defecto de
        que se oxida con facilidad.
      it: |-
        Il suo corpo simile a metallo lucidato è leggero
        e resistente, ma ha il difetto di arrugginire
        facilmente.
    shield:
      ja-Hrkt: |-
        とくしゅな　きんぞくの　からだは
        かるく　みのこなしは　ばつぐん。
        あめが　にがてで　どうくつに　すむ。
      ja: |-
        特殊な　金属の　体は
        軽く　身のこなしは　抜群。
        雨が　苦手で　洞窟に　棲む。
      ko: |-
        금속으로 된 특수한 몸은
        가벼워서 몸놀림이 뛰어나다.
        비를 싫어해 동굴에 산다.
      zh-Hant: |-
        由特殊金屬構成的身體
        十分輕盈，能夠靈活地活動。
        不喜歡下雨，所以住在洞窟裡。
      zh-Hans: |-
        由特殊金属构成的身体
        十分轻盈，能够灵活地活动。
        不喜欢下雨，所以住在洞窟里。
      en: |-
        The special metal that composes its body is very
        light, so this Pokémon has considerable agility.
        It lives in caves because it dislikes the rain.
      fr: |-
        Son corps, composé d’un métal spécial, est léger
        et lui offre une excellente mobilité. Il est toutefois
        sensible à la pluie et vit donc dans les grottes.
      de: |-
        Es ist sehr beweglich, weil sein Körper aus einem
        speziellen, leichten Metall besteht. Da es Regen
        nicht mag, lebt es in Höhlen.
      es: |-
        Hace gala de una agilidad extraordinaria, ya que
        su cuerpo está compuesto de un metal especial.
        Detesta la lluvia, por lo que habita en cuevas.
      it: |-
        Il suo corpo fatto di un metallo speciale è
        leggero e gli conferisce un’andatura impeccabile.
        Vive nelle grotte perché odia la pioggia.
