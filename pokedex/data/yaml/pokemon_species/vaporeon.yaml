    x:
      ja-Hrkt: |-
        きれいな　みずべを　このんでいる。
        さいぼうが　みずのぶんしに　にており
        みずに　とけることもできる。
      ja: |-
        きれいな　水辺を　好んでいる。
        細胞が　水の　分子に　似ており
        水に　溶けることもできる。
      ko: |-
        아름다운 물가를 좋아한다.
        세포가 물의 분자구조와 닮아서
        물에 녹는 것도 가능하다.
      en: |-
        It prefers beautiful shores. With cells similar to
        water molecules, it could melt in water.
      fr: |-
        Il préfère les belles plages. Il peut se dissoudre à
        volonté grâce à ses cellules proches de l’eau.
      de: |-
        Es liebt schöne Ufer. Da seine Zellstruktur
        Wassermolekülen ähnlich ist, kann es mit
        Wasser verschmelzen.
      es: |-
        Prefiere las bellas costas. Con células parecidas al
        agua, podría fundirse en la misma.
      it: |-
        Preferisce stare sulla costa. In acqua le sue cellule
        simili a molecole acquee si possono scomporre.
    'y':
      ja-Hrkt: |-
        すいちゅうでの　せいかつに　てきした
        からだに　しんかした。
        みずに　とけると　みえなくなる。
      ja: |-
        水中での　生活に　適した
        体に　進化した。
        水に　溶けると　見えなくなる。
      ko: |-
        수중에서의 생활에 적합한
        몸으로 진화했다.
        물에 녹으면 보이지 않게 된다.
      en: |-
        It has evolved to be suitable for an aquatic life.
        It can invisibly melt away into water.
      fr: |-
        Il a évolué pour s’adapter au milieu aquatique.
        Il peut se fondre et disparaître dans l’élément liquide.
      de: |-
        Es hat sich so entwickelt, dass es im Wasser
        leben kann. Im Wasser selbst wird es unsichtbar.
      es: |-
        Ha evolucionado para adaptarse a la vida acuática.
        Se mimetiza a la perfección con el agua.
      it: |-
        Si è evoluto per adattarsi alla vita acquatica. Si può
        sciogliere nell’acqua diventando invisibile.
    omega-ruby:
      ja-Hrkt: |-
        とつぜんへんいに　より　すいちゅうで　せいかつ
        できる　ように　ヒレと　エラが　はえてきた。
        みずを　じざいに　あやつる　ちからを　もつ。
      ja: |-
        突然変異に　より　水中で　生活
        できる　ように　ヒレと　エラが　生えてきた。
        水を　自在に　操る　力を　持つ。
      ko: |-
        돌연변이로 인해 물속에서 생활할 수
        있도록 지느러미와 아가미가 생겨났다.
        물을 자유로이 조종하는 힘을 지녔다.
      en: |-
        Vaporeon underwent a spontaneous mutation and grew fins
        and gills that allow it to live underwater. This Pokémon has the
        ability to freely control water.
      fr: |-
        Aquali a subi une mutation spontanée. Des nageoires et
        des branchies sont apparues sur son corps, ce qui lui permet
        de vivre dans les fonds marins. Ce Pokémon peut contrôler
        l’eau à volonté.
      de: |-
        Aquana hat eine spontane Mutation durchgemacht und ihm
        sind Flossen und Kiemen gewachsen. Dadurch kann es unter
        Wasser leben. Dieses Pokémon kann Wasser nach Belieben
        manipulieren.
      es: |-
        Vaporeon sufrió una mutación repentina y desarrolló aletas y
        branquias que le permiten vivir bajo el agua. Asimismo, este
        Pokémon tiene la habilidad de controlar las aguas.
      it: |-
        Vaporeon, frutto di una mutazione naturale, ha sviluppato
        pinne e branchie per poter vivere sott’acqua. Questo
        Pokémon ha la capacità di sfruttare l’acqua a suo vantaggio.
    alpha-sapphire:
      ja-Hrkt: |-
        とつぜんへんいに　より　すいちゅうで　せいかつ
        できる　ように　ヒレと　エラが　はえてきた。
        みずを　じざいに　あやつる　ちからを　もつ。
      ja: |-
        突然変異に　より　水中で　生活
        できる　ように　ヒレと　エラが　生えてきた。
        水を　自在に　操る　力を　持つ。
      ko: |-
        돌연변이로 인해 물속에서 생활할 수
        있도록 지느러미와 아가미가 생겨났다.
        물을 자유로이 조종하는 힘을 지녔다.
      en: |-
        Vaporeon underwent a spontaneous mutation and grew fins
        and gills that allow it to live underwater. This Pokémon has
        the ability to freely control water.
      fr: |-
        Aquali a subi une mutation spontanée. Des nageoires et
        des branchies sont apparues sur son corps, ce qui lui permet
        de vivre dans les fonds marins. Ce Pokémon peut contrôler
        l’eau à volonté.
      de: |-
        Aquana hat eine spontane Mutation durchlaufen. Ihm sind
        Flossen und Kiemen gewachsen. Dadurch kann es unter
        Wasser leben. Dieses Pokémon kann Wasser nach Belieben
        manipulieren.
      es: |-
        Vaporeon sufrió una mutación repentina y desarrolló aletas y
        branquias que le permiten vivir bajo el agua. Asimismo, este
        Pokémon tiene la habilidad de controlar las aguas.
      it: |-
        Vaporeon, frutto di una mutazione naturale, ha sviluppato
        pinne e branchie per poter vivere sott’acqua. Questo
        Pokémon ha la capacità di sfruttare l’acqua a suo vantaggio.
    sun:
      ja-Hrkt: |-
        さいぼうこうぞうが　みずの　ぶんしに
        よく　にている。　みずべに　すむので
        にんぎょに　まちがわれることも。
      ja: |-
        細胞構造が　水の　分子に
        よく　似ている。　水辺に　棲むので
        人魚に　間違われることも。
      ko: |-
        세포구조가 물 분자와
        아주 닮았다. 물가에 살아서
        인어로 착각하기도 한다.
      zh-Hant: |-
        細胞構造與水分子非常相似。
        由於在水邊棲息，有時候
        會被誤認為是人魚。
      zh-Hans: |-
        细胞构造与水分子非常相似。
        在水边栖息，所以有时候
        会被错认为是人鱼。
      en: |-
        Its cells are composed of units much like water
        molecules. It lives close to water and is often
        mistaken for a mermaid.
      fr: |-
        La structure de ses cellules ressemble à celle
        des molécules d’eau. Il vit sur les rives, et il
        arrive qu’il soit pris pour une sirène.
      de: |-
        Seine Zellstruktur ist der von Wassermolekülen
        ähnlich. Es lebt in der Nähe von Ufern, daher
        wird es oft mit einer Meerjungfrau verwechselt.
      es: |-
        Su composición celular es muy parecida a la
        estructura molecular del agua. Vive cerca de
        ríos y mares y a veces lo toman por una sirena.
      it: |-
        La sua struttura cellulare è simile a quella delle
        molecole d’acqua. Vive sulle rive dei mari e dei
        laghi e a volte viene scambiato per una sirena.
    moon:
      ja-Hrkt: |-
        みずのなかに　とけこんで　けはいを
        かくし　えものの　さかなポケモンが
        くるのを　じっと　まちかまえている。
      ja: |-
        水の中に　溶け込んで　気配を
        隠し　獲物の　さかなポケモンが
        来るのを　じっと　待ち構えている。
      ko: |-
        물속에 녹아들어 기척을
        숨기고 먹이인 물고기포켓몬이
        오는 것을 가만히 기다리고 있다.
      zh-Hant: |-
        與水融為一體，隱藏自己的氣息，
        一動不動地埋伏著等待獵物
        ──魚寶可夢的到來。
      zh-Hans: |-
        与水融为一体，隐藏自己的气息，
        一动不动地埋伏着等待猎物
        ——鱼宝可梦的到来。
      en: |-
        Blending in with the water and erasing all signs
        of its presence, it patiently waits for its prey,
        fish Pokémon.
      fr: |-
        Ce Pokémon plonge dans l’eau et y reste caché
        jusqu’à ce qu’un Pokémon poisson passe à
        sa portée.
      de: |-
        Es wird eins mit dem Wasser und somit
        unsichtbar. So wartet es heimlich, still und leise
        auf Fisch-Pokémon, die es sich als Beute fängt.
      es: |-
        Se funde con el agua y se oculta por completo.
        Entonces espera pacientemente a que aparezca
        algún Pokémon pez para atraparlo.
      it: |-
        Si nasconde alle prede dissolvendosi nell’acqua
        e aspetta paziente che arrivi un Pokémon
        acquatico per catturarlo.
    ultra-sun:
      ja-Hrkt: |-
        きれいな　みずべが　おもな　すみか。
        がいてきに　おそわれそうに　なると
        みずに　とびこみ　すがたを　かくす。
      ja: |-
        綺麗な　水辺が　主な　棲み処。
        外敵に　襲われそうに　なると
        水に　飛び込み　姿を　隠す。
      ko: |-
        아름다운 물가가 주요 서식지다.
        외적에게 습격당할 상황이 되면
        물로 뛰어들어 모습을 감춘다.
      zh-Hant: |-
        主要的棲息地是乾淨的水邊。
        一旦有遭到外敵侵襲的危險，
        就會跳進水中躲起來。
      zh-Hans: |-
        美丽的水边是其主要的栖息地。
        如果感觉有外敌来袭，
        它就会跳入水中躲起来。
      en: |-
        Clean, clear waters are its usual habitat. When
        it’s about to be attacked by an invading enemy,
        it dives into the water to hide.
      fr: |-
        On le trouve principalement dans les sources
        limpides. Lorsqu’un ennemi est sur le point
        de l’attaquer, il plonge se réfugier dans l’eau.
      de: |-
        Es lebt meist an klaren Gewässern. Wittert es
        einen feindlichen Angriff, verschwindet es ins
        Wasser und macht sich unsichtbar.
      es: |-
        Suele habitar en cuerpos de agua cristalina. Si
        advierte un posible ataque enemigo, se sumerge
        bajo el agua para ocultarse.
      it: |-
        Vive principalmente sulle rive più belle.
        Quando percepisce la presenza di un predatore
        si tuffa rapidamente nell’acqua per nascondersi.
    ultra-moon:
      ja-Hrkt: |-
        ヒレで　まわりの　すいぶんを　かんち
        している。　こきざみに　ふるえだすと
        すうじかんご　には　あめが　ふる。
      ja: |-
        ヒレで　まわりの　水分を　感知
        している。　小刻みに　震えだすと
        数時間後には　雨が　降る。
      ko: |-
        지느러미로 주변의 수분을
        감지한다. 조금씩 떨기 시작하면
        수 시간 후에는 비가 내린다.
      zh-Hant: |-
        會用鰭感知周圍的水分。
        如果牠開始微微顫抖，
        幾個小時之後就會下雨。
      zh-Hans: |-
        会通过鳍来感知周围的水分。
        如果它开始微微颤抖，
        那么数小时后就会下雨。
      en: |-
        It detects nearby moisture with its fin. When its
        fin begins trembling rapidly, that means rain will
        fall in a few hours.
      fr: |-
        Il perçoit l’humidité ambiante grâce aux ailerons
        de sa tête. S’ils frémissent, c’est qu’il pleuvra
        d’ici quelques heures.
      de: |-
        Mit seinen Flossen nimmt es die Feuchtigkeit in
        seiner Umgebung wahr. Vibrieren diese, beginnt
        es in den nächsten Stunden zu regnen.
      es: |-
        Sus aletas detectan la humedad del ambiente.
        Si comienzan a vibrar, es señal de que lloverá
        en las próximas horas.
      it: |-
        Riesce a percepire l’umidità circostante con
        le pinne. Se cominciano a vibrare vuol dire
        che pioverà nel giro di poche ore.
    lets-go-pikachu:
      ja-Hrkt: |-
        さいぼうそしきが　みずの　ぶんしに
        にているため　みずに　とけると
        すがたが　みえなく　なってしまう。
      ja: |-
        細胞組織が　水の　分子に
        似ているため　水に　溶けると
        姿が　見えなく　なってしまう。
      ko: |-
        세포 조직이 물 분자와
        비슷하기 때문에 물에 녹아들면
        모습이 보이지 않게 된다.
      zh-Hant: |-
        細胞組織與水分子相似，
        因此當牠溶入水中後，
        就完全看不見牠的樣子了。
      zh-Hans: |-
        它的细胞与水分子
        相似，在它溶入于水后，
        你就完全看不见它了。
      en: |-
        Its cell structure is similar to water molecules.
        It melts into the water and becomes invisible.
      fr: |-
        Sa structure moléculaire est semblable à celle
        de l’eau. Il est invisible en milieu aquatique.
      de: |-
        Seine Zellstruktur ähnelt der molekularen
        Zusammensetzung von Wasser. Daher wird es
        im Wasser unsichtbar.
      es: |-
        Su estructura celular se parece a las moléculas
        de agua, por eso es invisible cuando está en
        este elemento.
      it: |-
        La sua struttura cellulare è simile a quella
        delle molecole dell’acqua. Quando si immerge
        diventa invisibile.
    lets-go-eevee:
      ja-Hrkt: |-
        さいぼうそしきが　みずの　ぶんしに
        にているため　みずに　とけると
        すがたが　みえなく　なってしまう。
      ja: |-
        細胞組織が　水の　分子に
        似ているため　水に　溶けると
        姿が　見えなく　なってしまう。
      ko: |-
        세포 조직이 물 분자와
        비슷하기 때문에 물에 녹아들면
        모습이 보이지 않게 된다.
      zh-Hant: |-
        細胞組織與水分子相似，
        因此當牠溶入水中後，
        就完全看不見牠的樣子了。
      zh-Hans: |-
        它的细胞与水分子
        相似，在它溶入于水后，
        你就完全看不见它了。
      en: |-
        Its cell structure is similar to water molecules.
        It melts into the water and becomes invisible.
      fr: |-
        Sa structure moléculaire est semblable à celle
        de l’eau. Il est invisible en milieu aquatique.
      de: |-
        Seine Zellstruktur ähnelt der molekularen
        Zusammensetzung von Wasser. Daher wird es
        im Wasser unsichtbar.
      es: |-
        Su estructura celular se parece a las moléculas
        de agua, por eso es invisible cuando está en
        este elemento.
      it: |-
        La sua struttura cellulare è simile a quella
        delle molecole dell’acqua. Quando si immerge
        diventa invisibile.
    sword:
      ja-Hrkt: |-
        シャワーズの　ぜんしんの　ひれが
        こきざみに　ふるえはじめるのは
        すうじかんごに　あめがふる　しるし。
      ja: |-
        シャワーズの　全身の　ひれが
        小刻みに　震えはじめるのは
        数時間後に　雨が降る　しるし。
      ko: |-
        샤미드의 모든 지느러미가
        조금씩 떨리기 시작했다면
        몇 시간 뒤에 비가 내린다는 표시다.
      zh-Hant: |-
        當水伊布開始微微顫動
        牠全身上下的鰭，就表示
        幾個小時之後要下雨了。
      zh-Hans: |-
        当水伊布开始微微颤动
        它全身上下的鳍，就表示
        几个小时之后要下雨了。
      en: |-
        When Vaporeon’s fins begin to vibrate, it is a
        sign that rain will come within a few hours.
      fr: |-
        Quand ses nageoires se mettent à vibrer,
        c’est le signe qu’il va pleuvoir dans les heures
        qui suivent.
      de: |-
        Wenn seine Flossen beginnen zu vibrieren,
        ist das ein sicheres Zeichen dafür, dass in den
        nächsten Stunden Regen aufziehen wird.
      es: |-
        Cuando las aletas de Vaporeon comienzan a
        vibrar, significa que lloverá en las próximas
        horas.
      it: |-
        Se le pinne di Vaporeon iniziano a vibrare,
        vuol dire che pioverà nel giro di poche ore.
    shield:
      ja-Hrkt: |-
        からだの　さいぼうの　つくりが
        みずの　ぶんしと　にている。
        みずに　とけると　みえなくなる。
      ja: |-
        体の　細胞の　つくりが
        水の　分子と　似ている。
        水に　溶けると　見えなくなる。
      ko: |-
        몸의 세포 구조가
        물 분자와 닮았다.
        물에 녹으면 보이지 않는다.
      zh-Hant: |-
        身體細胞的結構與水分子相似。
        牠能和水融為一體，
        讓別人無法看見牠。
      zh-Hans: |-
        身体细胞的结构与水分子相似。
        它能和水融为一体，
        让别人无法看见它。
      en: |-
        Its body’s cellular structure is similar to the
        molecular composition of water. It can melt
        invisibly in water.
      fr: |-
        Sa structure cellulaire est similaire à la composition
        moléculaire de l’eau. Une fois dans cet élément,
        il devient indétectable à l’œil nu.
      de: |-
        Seine Zellstruktur ähnelt der molekularen
        Zusammensetzung von Wasser, weshalb es sich
        in Gewässern unsichtbar machen kann.
      es: |-
        La composición celular de su cuerpo es tan
        similar a la estructura molecular del agua que
        se vuelve invisible al fundirse en ella.
      it: |-
        La sua composizione cellulare è simile
        a quella delle molecole d’acqua, in cui
        si può dissolvere diventando invisibile.
