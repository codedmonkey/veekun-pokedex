litwick:
  base_happiness: 50
  capture_rate: 190
  color: white
  egg_groups:
    - indeterminate
  evolution_chain: litwick
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        Litwick shines a light that absorbs the
        life energy of people and Pokémon,
        which becomes the fuel that it burns.
      fr: |-
        Sa flamme brûle en consumant
        l’énergie vitale des gens et
        des Pokémon.
    white:
      en: |-
        While shining a light and pretending
        to be a guide, it leeches off the life
        force of any who follow it.
      fr: |-
        Il fait semblant de guider ses victimes
        à la lueur de sa flamme, mais c’est pour
        mieux aspirer leur énergie vitale.
    black-2:
      en: |-
        Its flame is usually out, but it starts
        shining when it absorbs life force
        from people or Pokémon.
    white-2:
      en: |-
        Its flame is usually out, but it starts
        shining when it absorbs life force
        from people or Pokémon.
    x:
      ja-Hrkt: |-
        あかりを　ともして　みちあんないを
        するように　みせかけながら
        せいめいりょくを　すいとっている。
      ja: |-
        明かりを　灯して　道案内を
        するように　見せかけながら
        生命力を　吸い取っている。
      ko: |-
        빛을 밝혀 길 안내를
        하는 것처럼 가장하여
        생명력을 빨아들이고 있다.
      en: |-
        While shining a light and pretending to be a guide,
        it leeches off the life force of any who follow it.
      fr: |-
        Il fait semblant de guider ses victimes à la lueur de
        sa flamme, mais c’est pour mieux aspirer leur énergie
        vitale.
      de: |-
        Es entzündet ein Licht und gibt vor, dem Gegner
        den Weg zu weisen, doch eigentlich saugt es ihm
        seine Lebensenergie ab.
      es: |-
        Finge ser una luz guía en el camino, pero en realidad
        solo quiere absorber la energía vital de quien lo sigue.
      it: |-
        Mentre fa luce col pretesto di fare loro da guida,
        assorbe energia vitale dalle sue prede.
    'y':
      ja-Hrkt: |-
        ヒトモシの　ともす　あかりは
        ひとや　ポケモンの　せいめいりょくを
        すいとって　もえているのだ。
      ja: |-
        ヒトモシの　灯す　明かりは
        人や　ポケモンの　生命力を
        吸い取って　燃えているのだ。
      ko: |-
        불켜미가 밝히는 빛은
        사람과 포켓몬의 생명력을
        빨아들여 불타고 있다.
      en: |-
        Litwick shines a light that absorbs the life energy of
        people and Pokémon, which becomes the fuel that
        it burns.
      fr: |-
        Sa flamme brûle en consumant l’énergie vitale
        des gens et des Pokémon.
      de: |-
        Es entfacht eine Flamme, die von der Lebensenergie
        eines Menschen oder eines Pokémon zehrt.
      es: |-
        La luz que desprende absorbe la energía vital de
        humanos y Pokémon.
      it: |-
        La luce che emana brucia consumando l’energia di
        esseri umani e Pokémon.
    omega-ruby:
      ja-Hrkt: |-
        あかりを　ともして　みちあんないを
