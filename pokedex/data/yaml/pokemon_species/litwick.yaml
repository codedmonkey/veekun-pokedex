      fr: |-
        Il fait semblant de guider ses victimes à la lueur de sa flamme,
        mais c’est pour mieux aspirer leur énergie vitale.
      de: |-
        Es entzündet ein Licht und gibt vor, dem Gegner den Weg zu
        weisen, doch eigentlich saugt es ihm seine Lebensenergie ab.
      es: |-
        Finge ser una luz guía en el camino, pero en realidad solo
        quiere absorber la energía vital de quien lo sigue.
      it: |-
        Mentre fa luce col pretesto di fare loro da guida, assorbe
        energia vitale dalle sue prede.
    alpha-sapphire:
      ja-Hrkt: |-
        ヒトモシの　ともす　あかりは
        ひとや　ポケモンの　せいめいりょくを
        すいとって　もえているのだ。
      ja: |-
        ヒトモシの　灯す　明かりは
        人や　ポケモンの　生命力を
        吸い取って　燃えているのだ。
      ko: |-
        불켜미가 밝히는 빛은
        사람과 포켓몬의 생명력을
        빨아들여 불타고 있다.
      en: |-
        Litwick shines a light that absorbs the life energy of
        people and Pokémon, which becomes the fuel that
        it burns.
      fr: |-
        Sa flamme brûle en consumant l’énergie vitale des gens
        et des Pokémon.
      de: |-
        Es entfacht eine Flamme, die von der Lebensenergie eines
        Menschen oder eines Pokémon zehrt.
      es: |-
        La luz que desprende absorbe la energía vital de humanos y
        Pokémon.
      it: |-
        La luce che emana brucia consumando l’energia di esseri
        umani e Pokémon.
    sword:
      ja-Hrkt: |-
        ほのおで　ねっせられた　からだは
        ほんのり　あたたかい。　まいごの
        てを　ひき　れいかいへと　いざなう。
      ja: |-
        炎で　熱せられた　体は
        ほんのり　温かい。　迷子の
        手を　引き　霊界へと　誘う。
      ko: |-
        불꽃으로 뜨거워진 몸은
        약간 따뜻하다. 미아의
        손을 잡고 영계로 데리고 간다.
      zh-Hant: |-
        頭上燃燒著的燭光讓牠的身體
        保持微熱。會拉著迷路孩子的手，
        將他們帶向靈界。
      zh-Hans: |-
        头上燃烧着的烛光让它的身体
        保持微热。会拉着迷路孩子的手，
        将他们带向灵界。
      en: |-
        The flame on its head keeps its body slightly
        warm. This Pokémon takes lost children by the
        hand to guide them to the spirit world.
      fr: |-
        Son corps est tiède, réchauffé par sa flamme.
        Il prend les personnes égarées par la main
        et les guide vers le monde des esprits.
      de: |-
        Seine Flamme wärmt seinen Körper leicht.
        Wer vom Weg abkommt, wird von ihm an der
        Hand genommen und ins Jenseits gelockt.
      es: |-
        El calor de la llama hace que su cuerpo esté
        algo tibio. Toma de la mano a quien se pierde
        para llevárselo a su mundo de espíritus.
      it: |-
        La sua fiamma gli riscalda il corpo rendendolo
        leggermente tiepido. Prende per mano chi si
        è smarrito per condurlo nel mondo degli spiriti.
    shield:
      ja-Hrkt: |-
        すいとる　いのちが　わかければ
        わかいほど　あたまの　ほのおは
        おおきく　あやしく　もえあがる。
      ja: |-
        吸い取る　命が　若ければ
        若いほど　頭の　炎は
        大きく　妖しく　燃え上がる。
      ko: |-
        흡수하는 생명이 젊으면
        젊을수록 머리의 불꽃은
        크고 괴이하게 타오른다.
      zh-Hant: |-
        吸取到的靈魂越年輕，
        頭上的燭光就會
        燃燒得越旺越詭異。
      zh-Hans: |-
        吸取到的灵魂越年轻，
        头上的烛光就会
        燃烧得越旺越诡异。
      en: |-
        The younger the life this Pokémon absorbs,
        the brighter and eerier the flame on its
        head burns.
      fr: |-
        Plus les victimes dont il aspire l’énergie vitale
        sont jeunes, plus sa flamme grandit et luit
        lugubrement.
      de: |-
        Je jünger das Opfer, dem es die Lebensenergie
        entzieht, desto höher und unheimlicher brennt
        die Flamme auf seinem Kopf.
      es: |-
        Cuanto más joven sea la energía vital que ha
        absorbido, mayor tamaño tendrá la llama de
        la cabeza y más siniestro será su brillo.
      it: |-
        Più giovane è la vittima da cui ha assorbito
        l’energia vitale, più grande e sinistra è la
        fiamma che gli brilla sul capo.
