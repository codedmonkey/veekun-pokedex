    white-2:
      en: |-
        It can launch a rock held in its
        hand like a missile by tightening
        then expanding muscles instantly.
    x:
      ja-Hrkt: |-
        てのひらの　あなから　イシツブテを
        はっしゃ。ぜんしんの　プロテクターは
        かざんの　ふんかにも　たえられる。
      ja: |-
        手のひらの　穴から　イシツブテを
        発射。全身の　プロテクターは
        火山の　噴火にも　耐えられる。
      ko: |-
        손바닥의 구멍에서 꼬마돌을
        발사한다. 전신의 프로텍터는
        화산의 분화도 견뎌낸다.
      en: |-
        From holes in its palms, it fires out Geodude.
        Its carapace can withstand volcanic eruptions.
      fr: |-
        Ses paumes projettent des Racaillou, et son corps
        couvert de Protecteurs résiste même à une éruption
        volcanique.
      de: |-
        Es feuert Kleinstein aus seinen Handflächen.
        Durch seinen Schützer erträgt es sogar
        Vulkanausbrüche.
      es: |-
        Lanza Geodude por los agujeros de las manos.
        Gracias a Protector resiste erupciones volcánicas.
      it: |-
        Mette dei Geodude nelle cavità dei palmi e li lancia.
        Usa Copertura per resistere alle eruzioni vulcaniche.
    'y':
      ja-Hrkt: |-
        いわを　てのひらの　あなに　つめて
        きんにくの　ちからで　はっしゃする。
        まれに　イシツブテを　とばす。
      ja: |-
        岩を　手のひらの　穴に　つめて
        筋肉の　力で　発射する。
        まれに　イシツブテを　飛ばす。
      ko: |-
        바위를 손바닥의 구멍에 채워서
        근육의 힘으로 발사한다.
        드물게 꼬마돌을 날린다.
      en: |-
        It puts rocks in holes in its palms and uses its
        muscles to shoot them. Geodude are shot at
        rare times.
      fr: |-
        Il bande ses muscles pour projeter des pierres ou
        des Racaillou depuis le creux de ses paumes.
      de: |-
        Es legt Steine in die Löcher seiner Hände und wirft sie
        mit Muskelkraft. Sogar Georok werden verwendet.
      es: |-
        Pone rocas en los agujeros de sus manos y las lanza
        con los músculos. A veces lanza Geodude.
      it: |-
        Mette rocce nelle cavità dei suoi palmi e le getta
        con tutta la sua forza. Talvolta lancia Geodude.
    omega-ruby:
      ja-Hrkt: |-
        てのひらの　あなから　イシツブテを
        はっしゃ。ぜんしんの　プロテクターは
        かざんの　ふんかにも　たえられる。
      ja: |-
        手のひらの　穴から　イシツブテを
        発射。全身の　プロテクターは
        火山の　噴火にも　耐えられる。
      ko: |-
        손바닥의 구멍에서 꼬마돌을
        발사한다. 전신의 프로텍터는
        화산의 분화도 견뎌낸다.
      en: |-
        From holes in its palms, it fires out Geodude.
        Its carapace can withstand volcanic eruptions.
      fr: |-
        Ses paumes projettent des Racaillou, et son corps couvert
        de Protecteurs résiste même à une éruption volcanique.
      de: |-
        Es feuert Kleinstein aus seinen Handflächen. Durch seinen
        Schützer erträgt es sogar Vulkanausbrüche.
      es: |-
        Lanza Geodude por los agujeros de las manos. Gracias a
        Protector resiste erupciones volcánicas.
      it: |-
        Mette dei Geodude nelle cavità dei palmi e li lancia.
        Usa Copertura per resistere alle eruzioni vulcaniche.
    alpha-sapphire:
      ja-Hrkt: |-
        いわを　てのひらの　あなに　つめて
        きんにくの　ちからで　はっしゃする。
        まれに　イシツブテを　とばす。
      ja: |-
        岩を　手のひらの　穴に　つめて
        筋肉の　力で　発射する。
        まれに　イシツブテを　飛ばす。
      ko: |-
        바위를 손바닥의 구멍에 채워서
        근육의 힘으로 발사한다.
        드물게 꼬마돌을 날린다.
      en: |-
        It puts rocks in holes in its palms and uses its
        muscles to shoot them. Geodude are shot at
        rare times.
      fr: |-
        Il bande ses muscles pour projeter des pierres ou
        des Racaillou depuis le creux de ses paumes.
      de: |-
        Es legt Steine in die Löcher seiner Hände und wirft sie
        mit Muskelkraft. Sogar Georok werden verwendet.
      es: |-
        Pone rocas en los agujeros de sus manos y las lanza con los
        músculos. A veces lanza Geodude.
      it: |-
        Mette rocce nelle cavità dei suoi palmi e le getta con tutta
        la sua forza. Talvolta lancia Geodude.
    sword:
      ja-Hrkt: |-
        ての　あなに　いわや　ダンゴロを
        つめて　はっしゃ。　そうてんできる
        かずは　かたうでに　つき　３つ。
      ja: |-
        手の　穴に　岩や　ダンゴロを
        詰めて　発射。　装填できる
        数は　片腕に　つき　３つ。
      ko: |-
        손에 난 구멍에 바위나 단굴을
        끼운 뒤 발사한다. 장전할 수 있는
        수는 한쪽 팔당 3개씩이다.
      zh-Hant: |-
        會在手掌的洞裡塞進岩石和
        石丸子發射出去，每隻手裡
        可以裝填３個。
      zh-Hans: |-
        会在手掌的洞里塞进岩石和
        石丸子发射出去，每只手里
        可以装填３个。
      en: |-
        It can load up to three projectiles per arm into
        the holes in its hands. What launches out of those
        holes could be either rocks or Roggenrola.
      fr: |-
        Il met des rochers ou des Nodulithe dans le creux
        de ses mains et les tire comme des obus.
        Il peut ainsi en charger trois par bras.
      de: |-
        Es bestückt die Vertiefungen in seinen Händen
        mit Felsen oder Kiesling und feuert sie daraus ab.
        In jeder Hand hat es Platz für drei Geschosse.
      es: |-
        Introduce rocas o Roggenrola en las cavidades
        de las manos y los dispara con fuerza. Es capaz
        de cargar hasta tres proyectiles en cada brazo.
      it: |-
        Inserisce delle rocce o dei Roggenrola nelle
        cavità dei suoi palmi e poi li lancia. Può caricarne
        fino a tre per braccio.
    shield:
      ja-Hrkt: |-
        プロテクターで　こうげきを　はじき
        あいてが　ひるんだ　ところを
        じまんの　ドリルで　つらぬく。
      ja: |-
        プロテクターで　攻撃を　弾き
        相手が　ひるんだ　ところを
        自慢の　ドリルで　つらぬく。
      ko: |-
        프로텍터로 공격을 튕겨내고
        상대가 풀이 죽으면
        특징적인 드릴로 관통한다.
      zh-Hant: |-
        用護具彈開敵人的攻擊，
        在對手畏縮時用自己
        引以為傲的鑽頭貫穿對方。
      zh-Hans: |-
        用护具弹开敌人的攻击，
        在对手畏缩时用自己
        引以为傲的钻头贯穿对方。
      en: |-
        It relies on its carapace to deflect incoming
        attacks and throw its enemy off balance. As soon
        as that happens, it drives its drill into the foe.
      fr: |-
        Il repousse les attaques avec ses Protecteurs et
        profite du moment où l’adversaire est déstabilisé
        pour le transpercer avec sa vrille, dont il est fier.
      de: |-
        Mit seinem Schützer wehrt es Angriffe ab und
        durchsticht dann den verdutzten Gegner mit
        seinem Bohrer, auf den es sehr stolz ist.
      es: |-
        Repele los ataques usando un Protector y
        aprovecha el momento en que el rival baja
        la guardia para perforarlo con su taladro.
      it: |-
        Respinge gli attacchi con la sua Copertura
        e approfitta del momento di esitazione
        dell’avversario per perforarlo con il suo trapano.
    legends-arceus:
      en: |-
        This Pokémon evolved through use of a curious item. Its rocklike
        hide is composed of a mysterious substance and can withstand a
        blow from a masterwork sword with nary a scratch.
