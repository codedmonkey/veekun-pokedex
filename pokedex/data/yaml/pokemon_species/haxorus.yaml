haxorus:
  base_happiness: 35
  capture_rate: 45
  color: yellow
  egg_groups:
    - monster
    - dragon
  evolution_chain: axew
  evolves_from: fraxure
  flavor_text:
    black:
      en: |-
        They are kind but can be relentless
        when defending territory. They challenge
        foes with tusks that can cut steel.
      fr: |-
        Il est doux, mais ne pardonne pas à ceux
        qui viennent saccager son territoire.
        Ses crocs peuvent découper de l’acier.
    white:
      en: |-
        Their sturdy tusks will stay sharp even
        if used to cut steel beams. These
        Pokémon are covered in hard armor.
      fr: |-
        Ses crocs sont tellement puissants
        qu’ils peuvent découper l’acier sans
        s’émousser. Son armure est très solide.
    black-2:
      en: |-
        Its tusks are incredibly destructive.
        They can easily slice through a thick,
        sturdy steel column every time.
    white-2:
      en: |-
        Its tusks are incredibly destructive.
        They can easily slice through a thick,
        sturdy steel column every time.
    x:
      ja-Hrkt: |-
        やさしい　せいかくだが　なわばりを
        あらす　ものには　ようしゃしない。
        てつを　きる　キバで　いどみかかる。
      ja: |-
        優しい　性格だが　縄張りを　荒らす
        者には　容赦しない。
        鉄を　切る　キバで　挑みかかる。
      ko: |-
        상냥한 성격이지만 영역을
        어지럽히는 자는 용서하지 않는다.
        철을 자르는 이빨로 덤벼든다.
      en: |-
        They are kind but can be relentless when defending
        territory. They challenge foes with tusks that can
        cut steel.
      fr: |-
        Il est doux, mais ne pardonne pas à ceux qui viennent
        saccager son territoire. Ses crocs peuvent découper
        de l’acier.
      de: |-
        Hat eine eher sanfte Natur, doch bei Eindringlingen
        kennt es keine Gnade. Seine Stoßzähne
        durchbohren sogar Eisen.
      es: |-
        Es gentil, pero no perdona a todo el que ose invadir
        su territorio. Su mayor baza son sus colmillos, que
        cortan el acero.
      it: |-
        Ha un carattere gentile, ma non perdona chi devasta
        il suo territorio. Le sue zanne possono tagliare
        l’acciaio.
    'y':
      ja-Hrkt: |-
        てっこつを　きりつけても　はこぼれ
        しない　がんじょうな　キバを　もつ。
        かたい　よろいに　おおわれている。
      ja: |-
        鉄骨を　切りつけても　刃こぼれ
        しない　頑丈な　キバを　持つ。
        硬い　よろいに　覆われている。
      ko: |-
        철골을 두 동강 내도 상처 하나
        안 나는 튼튼한 이빨을 가지고 있다.
        단단한 갑옷에 덮여 있다.
      en: |-
        Their sturdy tusks will stay sharp even if used to cut
        steel beams. These Pokémon are covered in
        hard armor.
      fr: |-
        Ses crocs sont tellement puissants qu’ils peuvent
        découper l’acier sans s’émousser. Son armure est
        très solide.
      de: |-
        Wenn es mit seinen robusten Hauern Stahl durchbohrt,
        bleiben diese unversehrt. Es ist von einem festen
        Panzer umgeben.
      es: |-
        Sus colmillos no se quiebran ni aunque los hinque
        en un armazón de acero. Está protegido por una
        resistente armadura.
      it: |-
        Ha forti zanne che non si spezzano neanche quando
        trancia travi d’acciaio. È protetto da una resistente
        armatura.
    omega-ruby:
      ja-Hrkt: |-
        やさしい　せいかくだが　なわばりを
        あらす　ものには　ようしゃしない。
        てつを　きる　キバで　いどみかかる。
      ja: |-
        優しい　性格だが　縄張りを　荒らす
        者には　容赦しない。
        鉄を　切る　キバで　挑みかかる。
      ko: |-
        상냥한 성격이지만 영역을
        어지럽히는 자는 용서하지 않는다.
        철을 자르는 이빨로 덤벼든다.
      en: |-
        They are kind but can be relentless when defending
        territory. They challenge foes with tusks that can
        cut steel.
      fr: |-
        Il est doux, mais ne pardonne pas à ceux qui viennent
        saccager son territoire. Ses crocs peuvent découper de l’acier.
      de: |-
        Hat eine eher sanfte Natur, doch bei Eindringlingen kennt es
        keine Gnade. Seine Stoßzähne durchbohren sogar Eisen.
      es: |-
        Es gentil, pero no perdona a todo el que ose invadir su
        territorio. Su mayor baza son sus colmillos, que cortan
        el acero.
      it: |-
        Ha un carattere gentile, ma non perdona chi devasta il suo
        territorio. Le sue zanne possono tagliare l’acciaio.
    alpha-sapphire:
      ja-Hrkt: |-
        てっこつを　きりつけても　はこぼれ
        しない　がんじょうな　キバを　もつ。
        かたい　よろいに　おおわれている。
      ja: |-
        鉄骨を　切りつけても　刃こぼれ
        しない　頑丈な　キバを　持つ。
        硬い　よろいに　覆われている。
      ko: |-
        철골을 두 동강 내도 상처 하나
        안 나는 튼튼한 이빨을 가지고 있다.
        단단한 갑옷에 덮여 있다.
      en: |-
        Their sturdy tusks will stay sharp even if used to cut
        steel beams. These Pokémon are covered in
        hard armor.
      fr: |-
        Ses crocs sont tellement puissants qu’ils peuvent découper
        l’acier sans s’émousser. Son armure est très solide.
      de: |-
        Wenn es mit seinen robusten Hauern Stahl durchbohrt, bleiben
        diese unversehrt. Es ist von einem festen Panzer umgeben.
      es: |-
        Sus colmillos no se quiebran ni aunque los hinque en un
        armazón de acero. Está protegido por una resistente
        armadura.
      it: |-
        Ha forti zanne che non si spezzano neanche quando trancia
        travi d’acciaio. È protetto da una resistente armatura.
    sword:
      ja-Hrkt: |-
        がんじょうな　おおキバが　じまん。
        きょうどを　たもつため　つちを
        なめて　ミネラルを　ほきゅうする。
      ja: |-
        頑丈な　大キバが　自慢。
        強度を　保つため　土を
        舐めて　ミネラルを　補給する。
      ko: |-
        튼튼하고 큰 어금니가 특징이다.
        강도를 유지하기 위해 흙을
        핥아서 미네랄을 보충한다.
      zh-Hant: |-
        堅固的大牙是牠的驕傲。
        為了保持牙齒的強度，
        會舔泥土來補充礦物質。
      zh-Hans: |-
        坚固的大牙是它的骄傲。
        为了保持牙齿的强度，
        会舔泥土来补充矿物质。
      en: |-
        Its resilient tusks are its pride and joy. It licks up
        dirt to take in the minerals it needs to keep its
        tusks in top condition.
      fr: |-
        Ses longs crocs robustes sont sa plus grande
        fierté. Il lèche le sol pour en absorber
        les minéraux et ainsi renforcer sa dentition.
      de: |-
        Seine riesigen, robusten Hauer sind sein größter
        Stolz. Es hält sie kräftig und gesund, indem es
        an Erde leckt, um Mineralstoffe aufzunehmen.
      es: |-
        Su mayor baza son sus colmillos, de gran tamaño
        y robustez. Lame la tierra en busca de minerales
        para mantenerlos fuertes y resistentes.
      it: |-
        Va fiero delle sue zanne grandi e robuste,
        e assorbe i minerali necessari a mantenerle
        in ottime condizioni leccando la terra.
    shield:
      ja-Hrkt: |-
        おんこうな　せいしつだが　おこると
        こわい。　てっこつをも　きりさく
        じまんの　キバを　おみまい　するぞ。
      ja: |-
        温厚な　性質だが　怒ると
        怖い。　鉄骨をも　切り裂く
        自慢の　キバを　おみまい　するぞ。
      ko: |-
        온화한 성격이지만 화가 나면
        무섭다. 철골도 베어 가르는
        튼튼한 어금니를 보여 줄 것이다.
      zh-Hant: |-
        性情溫和，但生起氣來非常恐怖。
        會用自己那引以為傲，可以
        削鐵如泥的牙齒攻擊敵人。
      zh-Hans: |-
        性格温和，但生起气来非常恐怖。
        会用自己那引以为傲，可以
        削铁如泥的牙齿攻击敌人。
      en: |-
        While usually kindhearted, it can be terrifying if
        angered. Tusks that can slice through steel beams
        are how Haxorus deals with its adversaries.
      fr: |-
        D’un naturel doux, il est cependant redoutable
        lorsqu’il se fâche. Il est très fier de ses crocs
        qui peuvent même découper des poutres d’acier.
      de: |-
        Es ist von Natur aus sanftmütig, aber wehe dem,
        der es wütend macht. Seine Stoßzähne reißen
        selbst Stahlträger in Stücke.
      es: |-
        Amable por naturaleza, infunde auténtico pavor
        al enfadarse. Su mayor baza son los colmillos,
        con los que puede cortar un armazón de acero.
      it: |-
        È di natura mite, ma se si arrabbia sono guai.
        Le zanne, di cui va fiero, possono fare a pezzi
        anche il cemento armato.
