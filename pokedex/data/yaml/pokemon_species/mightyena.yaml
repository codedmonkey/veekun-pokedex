    x:
      ja-Hrkt: |-
        すぐれた　トレーナーの　めいれいには
        ぜったい　ふくじゅう。おおむかしに
        むれで　こうどうしていた　なごり。
      ja: |-
        優れた　トレーナーの　命令には
        絶対に　服従。大昔に
        群れで　行動していた　名残り。
      ko: |-
        우수한 트레이너의 명령에는
        절대복종한다. 먼 옛날
        무리를 지어 행동했던 영향이다.
      en: |-
        It will always obey the commands of a skilled
        Trainer. Its behavior arises from its living in packs
        in ancient times.
      fr: |-
        Il obéit toujours aux ordres de son Dresseur si celui-ci
        est très doué. Son comportement vient de l’époque
        reculée où il vivait en meute.
      de: |-
        Es wird stets die Befehle eines begabten Trainers
        befolgen. Dieses Verhalten geht darauf zurück,
        dass es früher im Rudel lebte.
      es: |-
        Siempre obedece a los buenos Entrenadores. Está
        acostumbrado a vivir en jaurías en estado salvaje.
      it: |-
        La sua eccezionale obbedienza verso gli Allenatori
        esperti deriva dall’antica abitudine di vivere in branchi.
    'y':
      ja-Hrkt: |-
        １０ひき　ていどの　むれを　つくって
        いっしみだれぬ　チームワークで
        えものを　おいつめて　しとめるのだ。
      ja: |-
        １０匹　程度の　群れを　作って
        一糸乱れぬ　チームワークで
        獲物を　追いつめて　しとめるのだ。
      ko: |-
        10마리 정도의 무리를 이루어
        한 치의 흐트러짐 없는 팀워크로
        먹이를 쫓아 꼼짝 못하게 한다.
      en: |-
        It chases down prey in a pack of around ten.
        They defeat foes with perfectly
        coordinated teamwork.
      fr: |-
        Les Grahyèna forment des meutes de dix qui
        excellent au travail de groupe pour capturer leurs
        proies.
      de: |-
        Es jagt in Rudeln von ungefähr zehn Magnayen. Beim
        Einkreisen der Beute arbeiten sie perfekt zusammen.
      es: |-
        Forman manadas de diez individuos y cercan a sus
        presas valiéndose de un trabajo en equipo impecable.
      it: |-
        Una decina di Mightyena per branco cacciano e
        sconfiggono il nemico con un perfetto lavoro di
        gruppo.
    omega-ruby:
      ja-Hrkt: |-
        どうもうな　うなりごえを　あげながら　しせいを
        ひくく　している　ときは　こうげきの　まえぶれ。
        するどく　とがった　キバで　がぶりと　かみつく。
      ja: |-
        どう猛な　うなり声を　あげながら　姿勢を
        低く　している　ときは　攻撃の　前触れ。
        鋭く　とがった　キバで　がぶりと　かみつく。
      ko: |-
        사납게 으르렁거리는 소리를 내며 자세를
        낮추고 있는 것은 공격의 전조이다.
        날카롭고 뾰족한 이빨로 덥석 문다.
      en: |-
        Mightyena gives obvious signals when it is preparing to attack.
        It starts to growl deeply and then flattens its body.
        This Pokémon will bite savagely with its sharply pointed fangs.
      fr: |-
        On peut facilement deviner quand Grahyèna se prépare à
        attaquer. Il grogne et se met à plat ventre. Ce Pokémon mord
        sauvagement ses ennemis avec ses crocs acérés.
      de: |-
        Magnayen sendet deutliche Signale aus, wenn es sich auf
        einen Angriff vorbereitet. Es knurrt heftig und macht sich flach.
        Dieses Pokémon kann mit seinen spitzen Zähnen brutal
        zubeißen.
      es: |-
        Es muy fácil prever cuándo va a atacar Mightyena; se pone
        a gruñir con fuerza y se estira. Este Pokémon da unos
        mordiscos tremendos con los afilados colmillos que tiene.
      it: |-
        Mightyena invia chiari segnali quando sta preparando
        un attacco. Inizia a ringhiare cupo e si appiattisce.
        Morde selvaggiamente con le zanne appuntite e affilate.
    alpha-sapphire:
      ja-Hrkt: |-
        グループで　こうどうしていた　やせいの　ちが
        のこっているので　すぐれた　トレーナー　だけを
        リーダーと　みとめて　めいれいに　したがう。
      ja: |-
        グループで　行動していた　野生の　血が
        残っているので　優れた　トレーナー　だけを
        リーダーと　認めて　命令に　従う。
      ko: |-
        그룹으로 행동하던 야생의 피가
        남아 있어서 우수한 트레이너만을
        리더로서 인정하고 명령을 따른다.
      en: |-
        Mightyena travel and act as a pack in the wild. The memory
        of its life in the wild compels the Pokémon to obey only
        those Trainers that it recognizes to possess superior skill.
      fr: |-
        Les Grahyèna vivent et se déplacent en meute.
        Leurs réminiscences de la vie sauvage les poussent à n’obéir
        qu’aux Dresseurs qu’ils considèrent comme réellement
        talentueux.
      de: |-
        Magnayen zieht in Gruppen durch die Wildnis.
        Durch seine Erfahrungen in der Wildnis hört es nur
        auf Trainer, die außergewöhnliche Fähigkeiten haben.
      es: |-
        Mightyena se desplaza y vive con su jauría en estado salvaje.
        Por eso, acostumbrado a esta libertad, obedece al Entrenador
        al que considere realmente dotado de habilidades superiores
        al resto.
      it: |-
        Allo stato brado Mightyena si sposta e agisce soltanto
        assieme al suo branco. A causa della sua natura selvatica
        obbedisce solo a quegli Allenatori che considera possedere
        abilità superiori.
