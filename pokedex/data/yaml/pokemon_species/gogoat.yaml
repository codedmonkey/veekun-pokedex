gogoat:
  base_happiness: 70
  capture_rate: 45
  color: brown
  egg_groups:
    - ground
  evolution_chain: skiddo
  evolves_from: skiddo
  flavor_text:
    x:
      ja-Hrkt: |-
        ツノを　にぎる　わずかな　ちがいから
        トレーナーの　きもちを　よみとるので
        いったいとなって　はしれるのだ。
      ja: |-
        ツノを　握る　わずかな　違いから
        トレーナーの　気持ちを　読み取るので
        一体となって　走れるのだ。
      ko: |-
        뿔을 잡을 때 느껴지는 작은 차이로
        트레이너의 마음을 읽어낼 수 있기에
        하나가 되어 달릴 수 있는 것이다.
      en: |-
        It can tell how its Trainer is feeling by
        subtle shifts in the grip on its horns.
        This empathic sense lets them run as if one being.
      fr: |-
        Quand son Dresseur le tient par une corne, il est
        capable de deviner ses plus subtils changements
        d’humeur et de s’y adapter.
      de: |-
        Es kann die Stimmung seines Trainers an der kleinsten
        Veränderung dessen Griffes um seine Hörner ablesen
        und galoppiert sofort los, wenn dieser es wünscht.
      es: |-
        Percibe los sentimientos del Entrenador por la forma
        en la que agarra sus cuernos, aunque sean variaciones
        sutiles, y así avanzan como si fueran un solo ente.
      it: |-
        È in grado di intuire gli stati d’animo del suo Allenatore
        dal modo in cui questi gli afferra le corna. Questo
        permette a entrambi di correre in perfetta armonia.
    'y':
      ja-Hrkt: |-
        さんがくちたいで　せいかつする。
        ツノを　ぶつけあう　ちからくらべの
        しょうしゃが　むれの　リーダーだ。
      ja: |-
        山岳地帯で　生活する。
        ツノを　ぶつけ合う　力比べの　勝者が
        群れの　リーダーだ。
      ko: |-
        산악 지대에서 생활한다.
        뿔을 서로 부딪쳐서 힘을 겨루어
        승자가 무리의 리더가 된다.
      en: |-
        They inhabit mountainous regions.
        The leader of the herd is decided by
        a battle of clashing horns.
      fr: |-
        Ce Pokémon vit dans les régions montagneuses.
        Le chef du troupeau s’impose à l’issue d’un combat
        de cornes.
      de: |-
        Sie leben im Gebirge. Der Herdenanführer wird durch
        ein Kräftemessen gewählt, bei dem die Anwärter ihre
        Hörner gegeneinander rammen.
      es: |-
        Habita en regiones montañosas. El líder de la manada
        se decide en una demostración de fuerza en la que los
        contendientes luchan con los cuernos.
      it: |-
        Vive in regioni montuose. Questi Pokémon
        stabiliscono il leader del gruppo confrontandosi
        a cornate.
    omega-ruby:
      ja-Hrkt: |-
        ツノを　にぎる　わずかな　ちがいから
        トレーナーの　きもちを　よみとるので
        いったいとなって　はしれるのだ。
