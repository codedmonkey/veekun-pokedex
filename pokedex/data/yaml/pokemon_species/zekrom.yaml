  flavor_text:
    black:
      en: |-
        Concealing itself in lightning clouds,
        it flies throughout the Unova region.
        It creates electricity in its tail.
      fr: |-
        Sa queue produit de l’électricité.
        Il dissimule son corps dans un nuage
        électrique et plane dans le ciel d’Unys.
    white:
      en: |-
        This Pokémon appears in legends.
        In its tail, it has a giant generator
        that creates electricity.
      fr: |-
        Un Pokémon mythique.
        Il possède dans sa queue un énorme
        générateur qui produit de l’électricité.
    black-2:
      en: |-
        This legendary Pokémon can scorch
        the world with lightning. It assists
        those who want to build an ideal world.
    white-2:
      en: |-
        This legendary Pokémon can scorch
        the world with lightning. It assists
        those who want to build an ideal world.
    x:
      ja-Hrkt: |-
        いなずまで　せかいを　やきつくせる
        でんせつの　ポケモン。りそうの
        せかいを　つくる　ひとを　ほさする。
      ja: |-
        稲妻で　世界を　焼きつくせる
        伝説の　ポケモン。理想の
        世界を　つくる　人を　補佐する。
      ko: |-
        번개로 세상을 태워버릴 수 있는
        전설의 포켓몬. 이상의 세계를
        구축하는 사람을 보좌한다.
      en: |-
        This legendary Pokémon can scorch the world with
        lightning. It assists those who want to build an
        ideal world.
      fr: |-
        Un Pokémon légendaire assez puissant pour foudroyer
        le monde entier. Il soutient ceux qui suivent leur Idéal.
      de: |-
        Ein Legendäres Pokémon mit der Macht, die Welt
        durch Donner einzuäschern. Hilft allen, die einer
        Welt der Wünsche harren.
      es: |-
        Pokémon legendario capaz de chamuscar el mundo
        con sus rayos. Ayuda a quienes persiguen un mundo
        de ideales.
      it: |-
        Questo Pokémon leggendario può riempire il mondo
        di fulmini e saette. Aiuta chi vuole costruire un mondo
        ideale.
    'y':
      ja-Hrkt: |-
        しっぽで　でんきを　つくりだす。
        ぜんしんを　かみなりぐもに　かくして
        イッシュちほうの　そらを　とぶ。
      ja: |-
        尻尾で　電気を　作り出す。
        全身を　雷雲に　隠して
        イッシュ地方の　空を　飛ぶ。
      ko: |-
        꼬리로 전기를 만들어 낸다.
        전신을 번개 구름에 숨기고
        하나지방의 하늘을 난다.
      en: |-
        Concealing itself in lightning clouds, it flies
        throughout the Unova region. It creates electricity
        in its tail.
      fr: |-
        Sa queue produit de l’électricité. Il dissimule son
        corps dans un nuage électrique et plane dans le ciel
        d’Unys.
      de: |-
        Sein Schweif erzeugt Strom. Es verbirgt sich hinter
        dichten Gewitterwolken und fliegt durch den Luftraum
        über Einall.
      es: |-
        Genera electricidad con su cola y, para ocultarse,
        sobrevuela Teselia envuelto en nubes de rayos.
      it: |-
        Produce elettricità con la coda. Vola nei cieli di
        Unima nascosto fra lampi e saette.
    omega-ruby:
      ja-Hrkt: |-
        いなずまで　せかいを　やきつくせる
        でんせつの　ポケモン。りそうの
        せかいを　つくる　ひとを　ほさする。
      ja: |-
        稲妻で　世界を　焼きつくせる
        伝説の　ポケモン。理想の
        世界を　つくる　人を　補佐する。
      ko: |-
        번개로 세상을 태워버릴 수 있는
        전설의 포켓몬. 이상의 세계를
        구축하는 사람을 보좌한다.
      en: |-
        This legendary Pokémon can scorch the world with
        lightning. It assists those who want to build an
        ideal world.
      fr: |-
        Un Pokémon légendaire assez puissant pour foudroyer
        le monde entier. Il soutient ceux qui suivent leur Idéal.
      de: |-
        Ein Legendäres Pokémon mit der Macht, die Welt durch
        Donner einzuäschern. Hilft allen, die einer Welt der Wünsche
        harren.
      es: |-
        Pokémon legendario capaz de chamuscar el mundo con sus
        rayos. Ayuda a quienes persiguen un mundo de ideales.
      it: |-
        Questo Pokémon leggendario può riempire il mondo di fulmini
        e saette. Aiuta chi vuole costruire un mondo ideale.
    alpha-sapphire:
      ja-Hrkt: |-
        しっぽで　でんきを　つくりだす。
        ぜんしんを　かみなりぐもに　かくして
        イッシュちほうの　そらを　とぶ。
      ja: |-
        尻尾で　電気を　作り出す。
        全身を　雷雲に　隠して
        イッシュ地方の　空を　飛ぶ。
      ko: |-
        꼬리로 전기를 만들어 낸다.
        전신을 번개 구름에 숨기고
        하나지방의 하늘을 난다.
      en: |-
        Concealing itself in lightning clouds, it flies
        throughout the Unova region. It creates electricity
        in its tail.
      fr: |-
        Sa queue produit de l’électricité. Il dissimule son corps
        dans un nuage électrique et plane dans le ciel d’Unys.
      de: |-
        Sein Schweif erzeugt Strom. Es verbirgt sich hinter dichten
        Gewitterwolken und fliegt durch den Luftraum über Einall.
      es: |-
        Genera electricidad con su cola y, para ocultarse, sobrevuela
        Teselia envuelto en nubes de rayos.
      it: |-
        Produce elettricità con la coda. Vola nei cieli di Unima
        nascosto fra lampi e saette.
    sword:
      ja-Hrkt: |-
        しっぽの　ないぶが　モーターのように
        まわると　なんぼんもの　イナズマが
        はっせいして　しゅういを　つらぬく。
      ja: |-
        しっぽの　内部が　モーターのように
        回ると　何本もの　稲妻が
        発生して　周囲を　つらぬく。
      ko: |-
        꼬리 내부가 모터처럼
        회전하면 여러 갈래의 번개가
        발생하여 주위를 관통한다.
      zh-Hant: |-
        當尾巴的內部像馬達那樣
        旋轉起來，就能製造出
        好幾道閃電，穿透周圍的一切。
      zh-Hans: |-
        当尾巴的内部像马达那样
        旋转起来，就能制造出
        好几道闪电，穿透周围的一切。
      en: |-
        When the interior part of its tail spins like a
        motor, Zekrom can generate many bolts of
        lightning to blast its surroundings.
      fr: |-
        Lorsque sa queue se met à tourner comme
        un réacteur, il produit des éclairs qui transpercent
        tout autour de lui.
      de: |-
        Rotiert das Innere seines Schweifs wie eine
        Turbine, werden dadurch unzählige Blitze
        erzeugt, welche die Umgebung durchzucken.
      es: |-
        Cuando el interior de su cola comienza a girar
        como una turbina, es capaz de descargar rayos
        que lo destruyen todo a su alrededor.
      it: |-
        Quando l’interno della sua coda inizia a girare
        come una turbina, emette lampi e saette che
        squarciano l’aria tutta intorno.
    shield:
      ja-Hrkt: |-
        ひとが　ただしい　こころを　なくすと
        はげしい　いかずちを　おとし　くにを
        ほろぼすと　しんわに　えがかれた。
      ja: |-
        人が　正しい　心を　なくすと
        激しい　雷を　落とし　国を
        亡ぼすと　神話に　描かれた。
      ko: |-
        사람이 올바른 마음을 잃으면
        격렬한 천둥으로 나라를
        멸망시킨다는 신화가 있다.
      zh-Hant: |-
        在神話的敘述裡，如果人類
        失去了正義之心，牠就會用
        狂暴的雷電毀滅他們的王國。
      zh-Hans: |-
        在神话的描述里，如果人类
        失去了正义之心，它就会用
        狂暴的雷电毁灭他们的王国。
      en: |-
        Mythology tells us that if people lose the
        righteousness in their hearts, their kingdoms
        will be razed by Zekrom’s lightning.
      fr: |-
        Selon la légende, lorsque les gens perdent tout
        sens de ce qui est juste, Zekrom réduit le pays
        entier en cendres avec de terribles éclairs.
      de: |-
        Viele Mythen besingen den Donner, mit dem es
        die Welt vernichten wird, wenn die Menschen
        den Sinn für die Gerechtigkeit verlieren.
      es: |-
        Según las leyendas, la furia de sus rayos
        fulminará todo país cuyas gentes hayan perdido
        el sentido de la justicia.
      it: |-
        Secondo le leggende, può radere al suolo
        un intero paese con fulmini terribili se i suoi
        abitanti hanno perso il senso della giustizia.
