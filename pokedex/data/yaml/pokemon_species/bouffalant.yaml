bouffalant:
  base_happiness: 50
  capture_rate: 45
  color: brown
  egg_groups:
    - ground
  evolution_chain: bouffalant
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        Their fluffy fur absorbs damage,
        even if they strike foes with a
        fierce headbutt.
      fr: |-
        Son pelage fourni absorbe les chocs
        et lui permet d’asséner sans broncher
        le plus violent des coups de tête.
    white:
      en: |-
        They charge wildly and headbutt
        everything. Their headbutts have enough
        destructive force to derail a train.
      fr: |-
        Il charge tout ce qui bouge sans
        réfléchir. Il peut faire dérailler
        un train en marche.
    black-2:
      en: |-
        They are known to charge so wildly
        that if a train were to enter their
        territory, they would send it flying.
    white-2:
      en: |-
        They are known to charge so wildly
        that if a train were to enter their
        territory, they would send it flying.
    x:
      ja-Hrkt: |-
        みさかいなく　とっしんして　ずつきを
        くらわせる。はしっている　れっしゃを
        だっせんさせる　はかいりょく。
      ja: |-
        見境なく　突進して　頭突きを
        食らわせる。走っている　列車を
        脱線させる　破壊力。
      ko: |-
        무작정 돌진하여 박치기를
        한다. 달리고 있는 열차를
        탈선시킬 정도의 파괴력이다.
      en: |-
        They charge wildly and headbutt everything.
        Their headbutts have enough destructive force to
        derail a train.
      fr: |-
        Il charge tout ce qui bouge sans réfléchir. Il peut faire
        dérailler un train en marche.
      de: |-
        Rammt seine Gegner ohne Rücksicht auf Verluste
        mit dem Kopf und vermag damit sogar Züge
        zum Entgleisen zu bringen.
      es: |-
        Embiste con la cabeza sin distinción. Su potencia es
        capaz de hacer descarrilar un tren en marcha.
      it: |-
        Sferra testate contro tutto e tutti. Ha una forza
        distruttiva tale da far deragliare un treno in corsa.
    'y':
      ja-Hrkt: |-
        はげしい　ずつきを　くらわせても
        ふさふさの　たいもうが　ダメージを
        きゅうしゅうして　くれるのだ。
      ja: |-
        激しい　頭突きを　食らわせても
        ふさふさの　体毛が
        ダメージを　吸収して　くれるのだ。
      ko: |-
        세찬 박치기를 당해도
        탐스러운 털이 데미지를
        흡수해 준다.
      en: |-
        Their fluffy fur absorbs damage, even if they strike
        foes with a fierce headbutt.
      fr: |-
        Son pelage fourni absorbe les chocs et lui permet
        d’asséner sans broncher le plus violent des coups
        de tête.
      de: |-
        Sein zotteliges Fell fängt selbst nach einer seiner
        wuchtigen Rempelattacken einiges an Schaden ab.
      es: |-
        Aunque encaje un cabezazo violento, su pelaje
        absorbe el daño.
      it: |-
        Anche se riceve una violenta testata, la folta pelliccia
        minimizza l’impatto.
    omega-ruby:
      ja-Hrkt: |-
        みさかいなく　とっしんして　ずつきを
        くらわせる。はしっている　れっしゃを
        だっせんさせる　はかいりょく。
      ja: |-
        見境なく　突進して　頭突きを
        食らわせる。走っている　列車を
        脱線させる　破壊力。
      ko: |-
        무작정 돌진하여 박치기를
        한다. 달리고 있는 열차를
        탈선시킬 정도의 파괴력이다.
      en: |-
        They charge wildly and headbutt everything.
        Their headbutts have enough destructive force to
        derail a train.
      fr: |-
        Il charge tout ce qui bouge sans réfléchir. Il peut faire dérailler
        un train en marche.
      de: |-
        Rammt seine Gegner ohne Rücksicht auf Verluste mit dem Kopf
        und vermag damit sogar Züge zum Entgleisen zu bringen.
      es: |-
        Embiste con la cabeza sin distinción. Su potencia es capaz de
        hacer descarrilar un tren en marcha.
      it: |-
        Sferra testate contro tutto e tutti. Ha una forza distruttiva tale
        da far deragliare un treno in corsa.
    alpha-sapphire:
      ja-Hrkt: |-
        はげしい　ずつきを　くらわせても
        ふさふさの　たいもうが　ダメージを
        きゅうしゅうして　くれるのだ。
      ja: |-
        激しい　頭突きを　食らわせても
        ふさふさの　体毛が
        ダメージを　吸収して　くれるのだ。
      ko: |-
        세차게 박치기를 해도
        탐스러운 털이 데미지를
        흡수해 준다.
      en: |-
        Their fluffy fur absorbs damage, even if they strike
        foes with a fierce headbutt.
      fr: |-
        Son pelage fourni absorbe les chocs et lui permet d’asséner
        sans broncher le plus violent des coups de tête.
      de: |-
        Sein zotteliges Fell fängt selbst nach einer seiner wuchtigen
        Rempelattacken einiges an Schaden ab.
      es: |-
        Aunque encaje un cabezazo violento, su pelaje absorbe el
        daño.
      it: |-
        Anche se riceve una violenta testata, la folta pelliccia
        minimizza l’impatto.
    sword:
      ja-Hrkt: |-
        ずつきだけで　くるまを　つぶす。
        あたまの　けが　おおきいほど
        むれでの　ちいが　あがるのだ。
      ja: |-
        頭突きだけで　車を　潰す。
        頭の　毛が　大きいほど
        群れでの　地位が　上がるのだ。
      ko: |-
        박치기만으로 자동차를 부순다.
        머리의 털이 풍성할수록
        무리에서 지위가 올라간다.
      zh-Hant: |-
        只用頭錘就能壓扁汽車。
        頭部的那團毛越大一團，
        在群體裡的地位就會越高。
      zh-Hans: |-
        仅凭头锤就能把汽车撞个
        粉碎。头上那团毛的体积越大，
        在族群中的地位就会越高。
      en: |-
        These Pokémon can crush a car with no more
        than a headbutt. Bouffalant with more hair on
        their heads hold higher positions within the herd.
      fr: |-
        Il peut détruire une voiture d’un coup de tête.
        Plus sa crinière est volumineuse, plus son rang
        au sein du troupeau est élevé.
      de: |-
        Mit nur einem Kopfstoß kann es ein Auto
        zerstören. Je größer das Fellbüschel an Bisofanks
        Kopf, desto höher ist sein Rang in der Herde.
      es: |-
        Puede destrozar un coche de un solo testarazo.
        Cuanto más abundante sea su melena, mayor
        rango tendrá en la jerarquía de la manada.
      it: |-
        Può distruggere un’automobile a testate. Più
        la criniera è voluminosa, più prominente è la sua
        posizione nella mandria.
    shield:
      ja-Hrkt: |-
        ２０ぴきていどの　むれで　くらす。
        むれを　うらぎった　バッフロンは
        なぜか　あたまの　けが　ぬける。
      ja: |-
        ２０匹程度の　群れで　暮らす。
        群れを　裏切った　バッフロンは
        なぜか　頭の　毛が　抜ける。
      ko: |-
        20마리 정도가 무리 지어 산다.
        무리를 배신한 버프론은
        어째서인지 머리털이 빠진다.
      zh-Hant: |-
        會組成約２０隻的群體一起生活。
        不知為何，背叛了群體的
        爆炸頭水牛頭上的毛會脫落。
      zh-Hans: |-
        会以约２０只的规模群居。
        不知为何，背叛了族群的
        爆炸头水牛脑袋上的毛会脱落。
      en: |-
        These Pokémon live in herds of about 20
        individuals. Bouffalant that betray the herd will
        lose the hair on their heads for some reason.
      fr: |-
        Les Frison vivent en troupeau d’une vingtaine
        d’individus. Pour une raison inconnue, si l’un
        d’eux trahit le groupe, il perd sa crinière.
      de: |-
        Es lebt in Gruppen von circa 20 Artgenossen.
        Verrät ein Bisofank seine Herde, fällt ihm aus
        unbekannten Gründen das Fell am Kopf aus.
      es: |-
        Forman manadas de unos veinte individuos. Se
        desconoce el motivo, pero los que traicionan la
        confianza del grupo pierden la melena.
      it: |-
        Vive in mandrie di circa 20 esemplari.
        Per qualche motivo, i Bouffalant che tradiscono
        il gruppo perdono la chioma.
