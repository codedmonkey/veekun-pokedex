whimsicott:
  base_happiness: 50
  capture_rate: 75
  color: green
  egg_groups:
    - fairy
    - plant
  evolution_chain: cottonee
  evolves_from: cottonee
  flavor_text:
    black:
      en: |-
        Like the wind, it can slip through any
        gap, no matter how small. It leaves
        balls of white fluff behind.
      fr: |-
        Il se faufile comme le vent par les
        espaces les plus étroits, en laissant
        une touffe de poils blancs.
    white:
      en: |-
        Riding whirlwinds, they appear.
        These Pokémon sneak through gaps into
        houses and cause all sorts of mischief.
      fr: |-
        Il apparaît dans un tourbillon de vent,
        s’introduit dans les maisons par les
        interstices et y joue de mauvais tours.
    black-2:
      en: |-
        They appear along with whirlwinds. They
        pull pranks, such as moving furniture
        and leaving balls of cotton in homes.
    white-2:
      en: |-
        They appear along with whirlwinds. They
        pull pranks, such as moving furniture
        and leaving balls of cotton in homes.
    x:
      ja-Hrkt: |-
        つむじかぜと　ともに　あらわれて
        いえのなかの　かぐを　うごかしたり
        わたを　のこす　いたずらをする。
      ja: |-
        つむじかぜと　ともに　現われて
        家の　中の　家具を　動かしたり
        綿を　残す　いたずらをする。
      ko: |-
        회오리바람과 함께 나타나
        집 안의 가구를 움직이거나
        솜을 남기는 장난을 친다.
      en: |-
        They appear along with whirlwinds. They pull
        pranks, such as moving furniture and leaving balls
        of cotton in homes.
      fr: |-
        Il apparaît dans un tourbillon de vent, s’introduit dans
        les maisons et y joue de mauvais tours.
      de: |-
        Sie erscheinen mit Orkanböen und spielen den
        Leuten Streiche, indem sie in Häusern Möbel
        verrücken oder Watte verstreuen.
      es: |-
        Aparecen en medio de un torbellino y entran en las
        casas para descolocar los muebles o esparcir algodón
        por doquier.
      it: |-
        Appare con un vortice d’aria, facendo piccoli dispetti
        come spostare i mobili nelle case o lasciare cotone
        ovunque.
    'y':
      ja-Hrkt: |-
        どんなに　ほそい　すきまでも
        かぜのように　くぐりぬけてしまう。
        しろい　けだまを　のこしていく。
      ja: |-
        どんなに　細い　すきまでも
        風のように　潜り抜けてしまう。
        白い　毛玉を　残していく。
      ko: |-
        아무리 좁은 틈이라도
        바람처럼 빠져나간다.
        하얀 털 뭉치를 남기고 간다.
      en: |-
        Like the wind, it can slip through any gap,
        no matter how small. It leaves balls of white
        fluff behind.
      fr: |-
        Il se faufile comme le vent par les espaces les plus
        étroits, en laissant une touffe de poils blancs.
      de: |-
        Passiert wie ein Luftzug mühelos jeden noch so engen
        Spalt und hinterlässt dort nichts als ein weißes
        Fellknäuel.
      es: |-
        Es capaz de atravesar las más mínimas fisuras. A su
        paso, deja bolitas blancas de pelo.
      it: |-
        Si infiltra nelle fessure più sottili, come un soffio di
        vento, lasciando dietro di sé dei batuffoli bianchi.
    omega-ruby:
      ja-Hrkt: |-
        つむじかぜと　ともに　あらわれて
        いえのなかの　かぐを　うごかしたり
        わたを　のこす　いたずらをする。
      ja: |-
        つむじかぜと　ともに　現われて
        家の　中の　家具を　動かしたり
        綿を　残す　いたずらをする。
      ko: |-
        회오리바람과 함께 나타나
        집 안의 가구를 움직이거나
        솜을 남기는 장난을 친다.
      en: |-
        They appear along with whirlwinds. They pull
        pranks, such as moving furniture and leaving balls
        of cotton in homes.
      fr: |-
        Il apparaît dans un tourbillon de vent, s’introduit dans
        les maisons et y joue de mauvais tours.
      de: |-
        Sie erscheinen mit Orkanböen und spielen den Leuten
        Streiche, indem sie in Häusern Möbel verrücken oder
        Watte verstreuen.
      es: |-
        Aparecen en medio de un torbellino y entran en las casas para
        descolocar los muebles o esparcir algodón por doquier.
      it: |-
        Appare con un vortice d’aria, facendo piccoli dispetti come
        spostare i mobili nelle case o lasciare cotone ovunque.
    alpha-sapphire:
      ja-Hrkt: |-
        どんなに　ほそい　すきまでも
        かぜのように　くぐりぬけてしまう。
        しろい　けだまを　のこしていく。
      ja: |-
        どんなに　細い　すきまでも
        風のように　潜り抜けてしまう。
        白い　毛玉を　残していく。
      ko: |-
        아무리 좁은 틈이라도
        바람처럼 빠져나간다.
        하얀 털 뭉치를 남기고 간다.
      en: |-
        Like the wind, it can slip through any gap,
        no matter how small. It leaves balls of white
        fluff behind.
      fr: |-
        Il se faufile comme le vent par les espaces les plus étroits,
        en laissant une touffe de poils blancs.
      de: |-
        Passiert wie ein Luftzug mühelos jeden noch so engen Spalt
        und hinterlässt dort nichts als ein weißes Fellknäuel.
      es: |-
        Es capaz de atravesar las más mínimas fisuras. A su paso,
        deja bolitas blancas de pelo.
      it: |-
        Si infiltra nelle fessure più sottili, come un soffio di vento,
        lasciando dietro di sé dei batuffoli bianchi.
    sun:
      ja-Hrkt: |-
        かぜに　のり　みんかに　しんにゅう。
        へやじゅうを　わたまみれに　すると
        ニコニコ　わらって　さっていく。
      ja: |-
        風に　乗り　民家に　侵入。
        部屋中を　綿まみれに　すると
        ニコニコ　笑って　去っていく。
      ko: |-
        바람을 타고 민가에 침입한다.
        방 안을 솜투성이로 만들고
        싱글벙글 웃으며 떠난다.
      zh-Hant: |-
        乘著風侵入民居。
        把房間裡弄得滿是棉絮後，
        就會嘻嘻哈哈地笑著離去。
      zh-Hans: |-
        乘着风侵入民居。
        把房间里弄得满是棉花后，
        咯咯咯地笑着离去。
      en: |-
        It rides on the wind and slips into people’s
        homes. After it has turned a room into a cotton-
        filled mess, it giggles to itself and takes off.
      fr: |-
        Il s’introduit chez les gens à la faveur d’un
        courant d’air, répand du coton aux quatre coins
        de la pièce puis repart comme si de rien n’était.
      de: |-
        Über Luftzüge dringt es in Häuser ein, verstreut
        in allen Zimmern Watte und macht sich dann
        lächelnd davon.
      es: |-
        Entra en las casas con las corrientes de aire y
        esparce algodón por todas partes. Desaparece
        entre risas tras su travesura.
      it: |-
        Entra nelle case trasportato dal vento.
        Dopo averle riempite di cotone, se ne va
        ridendo felice.
    moon:
      ja-Hrkt: |-
        かぜに　のって　あらわれるが
        あまりに　かぜが　つよすぎると
        あたまの　わたが　ちぎれてしまう。
      ja: |-
        風に　乗って　現れるが
        あまりに　風が　強すぎると
        頭の　綿が　千切れてしまう。
      ko: |-
        바람을 타고 나타나지만
        바람이 너무 강하면
        머리의 솜이 흩어져 버린다.
      zh-Hant: |-
        乘著風出現，
        但如果風力過強，
        頭上的棉花就會被風扯掉。
      zh-Hans: |-
        乘着风出现，
        但如果风力过强，
        头上的棉花就会被风扯掉。
      en: |-
        This Pokémon appears, riding upon the wind.
        But if the wind gusts up, it’ll blow the cotton on
        this Pokémon’s head clean off.
      fr: |-
        Ce Pokémon se déplace au gré du vent. Lorsqu’il
        souffle trop fort, il arrive que Farfaduvet perde
        le coton qu’il porte sur sa tête.
      de: |-
        Es reitet auf dem Wind, doch wenn dieser
        zu stark ist, wird die Watte an seinem Kopf
        abgerissen.
      es: |-
        Aparece al levantarse el viento, pero, cuando
        este arrecia, pierde el algodón de la cabeza.
      it: |-
        Si sposta fluttuando nell’aria.
        Se il vento è troppo forte, perde il cotone che ha
        sulla testa.
    ultra-sun:
      ja-Hrkt: |-
        みんかに　しのびこみ　たいせつな
        ものを　かくしたり　へやじゅうに
        わたを　まきちらす　やっかいものだ。
      ja: |-
        民家に　忍び込み　大切な
        ものを　隠したり　部屋中に
        綿を　まき散らす　厄介者だ。
      ko: |-
        민가에 몰래 들어가 소중한 물건을
        감추거나 솜을 방 안에 여기저기
        흩트러 놓는 성가신 존재이다.
      zh-Hant: |-
        會潛入人們家裡藏起重要的東西，
        或是把棉花撒得滿屋子都是，
        是個麻煩的傢伙。
      zh-Hans: |-
        潜入民居，藏起重要的东西，
        或是在屋子里到处撒棉花，
        是个捣蛋的家伙。
      en: |-
        This nuisance sneaks into people’s homes,
        where it hides important things and scatters
        cotton all over the place.
      fr: |-
        Ce petit chenapan s’introduit chez les gens,
        cache leurs affaires et répand du coton aux
        quatre coins de la pièce.
      de: |-
        Ein Störenfried, der heimlich in Wohnhäuser
        eindringt und dann wichtige Dinge versteckt
        sowie in allen Zimmern Watte verstreut.
      es: |-
        Este travieso Pokémon entra sigilosamente en
        las casas, esconde los objetos valiosos y
        dispersa bolas de algodón por todas partes.
      it: |-
        È dispettoso e ama entrare di soppiatto nelle
        case, nascondendo oggetti importanti e
        spargendo cotone ovunque.
    ultra-moon:
      ja-Hrkt: |-
        とくていの　すみかを　もたない。
        つむじかぜに　のって　あちこちに
        あらわれては　イタズラを　するのだ。
      ja: |-
        特定の　棲み処を　持たない。
        つむじ風に　乗って　あちこちに
        現れては　イタズラを　するのだ。
      ko: |-
        특정한 서식지가 정해져 있지 않다.
        회오리바람을 타고 여기저기에
        나타나서는 장난을 친다.
      zh-Hant: |-
        沒有特定的棲息地。
        會乘著旋風移動，
        到處現身去惡作劇。
      zh-Hans: |-
        并没有特定的栖息地。
        乘着旋风到处现身，搞恶作剧。
      en: |-
        Whimsicott doesn’t live in a fixed location. It
        floats around on whirling winds, appearing all
        over the place to perform its mischief.
      fr: |-
        Ce Pokémon sans domicile fixe se laisse porter
        par les tornades et sème la zizanie partout où
        il passe.
      de: |-
        Es lässt sich nirgends nieder, sondern reitet
        wohin auch immer Orkanböen es tragen und
        spielt den Leuten dann Streiche.
      es: |-
        Este Pokémon no vive en un lugar determinado,
        sino que se deja llevar por los torbellinos para
        desplazarse y realizar sus travesuras.
      it: |-
        Non ha un habitat fisso e si sposta fluttuando
        trasportato dai vortici d’aria, facendo dispetti
        ovunque va.
    sword:
      ja-Hrkt: |-
        ワタを　まきちらし　イタズラする。
        みずを　かけると　おもくなって
        うごけなくなり　かんねんするぞ。
      ja: |-
        綿を　まき散らし　イタズラする。
        水を　かけると　重くなって
        動けなくなり　観念するぞ。
      ko: |-
        솜을 흩뿌리며 장난을 친다.
        물을 끼얹으면 무거워져서
        움직일 수 없게 되어 포기한다.
      zh-Hant: |-
        喜歡到處撒棉花搗蛋。
        沾水之後就會變重而
        動彈不得，只能聽天由命。
      zh-Hans: |-
        喜欢到处撒棉花捣蛋。
        沾水之后就会变重而
        动弹不得，只能听天由命。
      en: |-
        It scatters cotton all over the place as a prank. If
        it gets wet, it’ll become too heavy to move and
        have no choice but to answer for its mischief.
      fr: |-
        Il joue de mauvais tours en répandant son coton.
        Si on le mouille, il s’alourdit et ne peut plus
        bouger, ce qui l’oblige à s’avouer vaincu.
      de: |-
        Es verstreut Watte, um Leute zu ärgern. Es hört
        damit auf, wenn es nass wird, weil es dann zu
        schwer ist und sich nicht mehr bewegen kann.
      es: |-
        Este travieso Pokémon se divierte esparciendo
        bolas de algodón. Al mojarlo, su peso aumenta
        tanto que no logra moverse y se da por vencido.
      it: |-
        Si diverte a spargere cotone ovunque. Se gli si
        versa dell’acqua addosso, diventa troppo
        pesante per muoversi e si arrende.
    shield:
      ja-Hrkt: |-
        ひのひかりを　あびるたび　ワタが
        ふくらんでいく。　ふくらみすぎると
        ちぎって　あたりに　まきちらす。
      ja: |-
        日の光を　浴びるたび　綿が
        膨らんでいく。　膨らみすぎると
        ちぎって　あたりに　まき散らす。
      ko: |-
        햇빛을 받을수록 솜이
        부풀어 오른다. 너무 부풀면
        찢어져 주위로 흩어진다.
      zh-Hant: |-
        每當沐浴陽光，身上的棉花
        就會膨脹。如果膨脹過了頭，
        牠就會把棉花扯開到處亂撒。
      zh-Hans: |-
        每当沐浴阳光，身上的棉花
        就会膨胀。如果膨胀过了头，
        它就会把棉花扯开到处乱撒。
      en: |-
        As long as this Pokémon bathes in sunlight, its
        cotton keeps growing. If too much cotton fluff
        builds up, Whimsicott tears it off and scatters it.
      fr: |-
        Son coton se met à gonfler sous les rayons
        du soleil. Quand il est trop volumineux,
        il s’effiloche et se répand aux alentours.
      de: |-
        Sonnenlicht lässt seine Wolle anwachsen. Wird
        das Volumen zu groß, zupft es die Wolle ab und
        verstreut sie überall in der Gegend.
      es: |-
        Su algodón se expande cuando recibe los rayos
        del sol, pero acaba desprendiéndose si se vuelve
        demasiado voluminoso.
      it: |-
        Il cotone sul suo corpo si gonfia con la luce
        del sole. Quando diventa eccessivamente
        voluminoso, si stacca disperdendosi ovunque.
