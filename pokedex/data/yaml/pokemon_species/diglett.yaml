        per la coltivazione di squisite verdure.
    sun:
      ja-Hrkt: |-
        ちかで　きのねを　かじる。　そだてる
        やさいの　ひんしゅに　よっては
        のうかに　がいを　なす　ポケモン。
      ja: |-
        地下で　木の根を　かじる。　育てる
        野菜の　品種に　よっては
        農家に　害を　なす　ポケモン。
      ko: |-
        지하에서 나무뿌리를 갉아먹는다.
        키우는 채소의 품종에 따라서는
        농가에 해를 끼치는 포켓몬이다.
      zh-Hant: |-
        會在地下嚼食樹根。根據種植
        的蔬菜品種不同，有時會對農家
        造成災害的寶可夢。
      zh-Hans: |-
        在地下啃食树根。
        因有些品种的蔬菜会遭其啃食，
        是可能对农户造成灾害的宝可梦。
      en: |-
        It chews on plant roots underground.
        Farmers whose vegetables are vulnerable
        find it can be quite a pest.
      fr: |-
        Il mange les racines souterraines des arbres,
        et cause beaucoup de soucis aux fermiers
        qui cultivent certains légumes.
      de: |-
        Es knabbert im Erdreich die Wurzeln von Bäumen
        und Pflanzen an. Bei manchen Gemüsesorten
        kann dies zu Ernteschäden führen.
      es: |-
        Le gusta mordisquear las raíces subterráneas
        de las plantas. Puede causar estragos en las
        granjas según el tipo de cultivos.
      it: |-
        Vive nutrendosi delle radici che trova
        sottoterra. Causa problemi agli agricoltori
        per la coltivazione di certe verdure.
    moon:
      ja-Hrkt: |-
        ディグダが　すむ　とちは　たがやされ
        フンで　ゆたかに　なるため　おおくの
        のうかが　たいせつに　そだてている。
      ja: |-
        ディグダが　棲む　土地は　耕され
        フンで　豊かに　なるため　多くの
        農家が　大切に　育てている。
      ko: |-
        디그다가 사는 땅은 일궈져 있으며
        배설물로 비옥해져서 많은
        농가에서 소중히 기르고 있다.
      zh-Hant: |-
        地鼠棲息的土地會被翻掘，
        並因糞便而變得肥沃，所以很多
        農戶把牠們當成寶貝培育著。
      zh-Hans: |-
        地鼠会疏松栖息的土地，
        其粪便也会让土壤肥沃，
        所以很多农户会精心培育它们。
      en: |-
        Many farmers cherish and nurture Diglett
        because its droppings enrich the soil it lives in.
      fr: |-
        Ce Pokémon laboure le sol et le fertilise avec
        ses déjections. Pour cette raison, beaucoup
        d’agriculteurs l’élèvent avec soin.
      de: |-
        Digda wird gerne auf Farmen gezüchtet, da es
        das Erdreich, in dem es wohnt, gut durchpflügt
        und mit seinen Ausscheidungen düngt.
      es: |-
        En muchas granjas crían Diglett, pues dejan la
        tierra perfectamente labrada y abonada, y así
        las cosechas son mucho más productivas.
      it: |-
        È allevato in molte aziende agricole perché,
        vivendo sottoterra, ara il terreno e lo concima
        con i suoi escrementi.
    ultra-sun:
      ja-Hrkt: |-
        ちかに　トンネルを　ほって　いどう。
        ひかりが　きらいなので　ちじょうに
        でてくるのは　ひが　しずんでから。
      ja: |-
        地下に　トンネルを　掘って　移動。
        光が　嫌いなので　地上に
        出てくるのは　日が　沈んでから。
      ko: |-
        지하에 터널을 파서 이동한다.
        빛을 싫어해서 해가 진 후에
        지상으로 나온다.
      zh-Hant: |-
        會在地下挖隧道來移動。
        由於討厭陽光，所以總是在
        太陽下山後才來到地上。
      zh-Hans: |-
        会在地下挖掘隧道移动。
        由于讨厌光线，所以会在
        太阳落山后来到地上。
      en: |-
        It travels through tunnels that it digs
        underground. It hates sunlight, so it comes
        out only after the sun goes down.
      fr: |-
        Il se déplace en creusant des tunnels.
        Il déteste la lumière et n’apparaît à la
        surface qu’une fois le soleil couché.
      de: |-
        Es gräbt unterirdische Tunnel und bewegt sich
        darin fort. Da es Licht verabscheut, taucht es
        erst nachts wieder an der Oberfläche auf.
      es: |-
        Se desplaza excavando túneles subterráneos.
        No soporta la luz brillante, por lo que solo sale
        a la superficie tras la puesta de sol.
      it: |-
        Si sposta scavando gallerie nel terreno.
        Odia la luce e sale in superficie solo dopo
        il tramonto.
    ultra-moon:
      ja-Hrkt: |-
        のうかでは　さくもつの　まわりに
        ディグダの　こうぶつの　きを　うえて
        じめんを　たがやして　もらっているよ。
      ja: |-
        農家では　作物の　まわりに
        ディグダの　好物の　木を　植えて
        地面を　耕して　もらっているよ。
      ko: |-
        농가에서는 작물 주변에
        디그다가 좋아하는 나무를 심어서
        땅을 일구게 하고 있다.
      zh-Hant: |-
        農民們會在農作物周圍
        種上地鼠喜歡的樹木，
        藉此讓牠們來耕作土地。
      zh-Hans: |-
        农户会在农作物周围
        种上地鼠喜食的树木，
        并以此来让它们耕作土地哦。
      en: |-
        Around their crops, farmers plant the kind of
        tree that Diglett like to eat as a way of getting
        Diglett to plow the fields for them.
      fr: |-
        Pour encourager les Taupiqueur à labourer leurs
        champs, les agriculteurs les bordent d’arbres
        appréciés de ces Pokémon.
      de: |-
        Auf Farmen werden Digdas Lieblingsbäume um
        die Feldfrüchte herum gepflanzt. Im Gegenzug
        durchpflügen sie dafür den Boden.
      es: |-
        Muchos agricultores flanquean sus campos con
        árboles del agrado de los Diglett para atraerlos
        y fomentar así que labren la tierra.
      it: |-
        Gli agricoltori piantano attorno ai campi gli alberi
        amati da questi Pokémon per fare in modo che
        arino il terreno per loro.
    lets-go-pikachu:
      ja-Hrkt: |-
        くらいところを　このむ。ほとんど
        ちちゅうですごすが　どうくつでは
        よく　かおを　だしている。
      ja: |-
        暗いところを　好む。ほとんど
        地中で過ごすが　洞窟では
        よく　顔を　出している。
      ko: |-
        어두운 곳을 좋아한다.
        거의 땅속에서 지내지만 동굴에서는
        자주 얼굴을 내밀고 있다.
      zh-Hant: |-
        喜歡待在陰暗的地方。
        大部分時間都待在地下，
        只有在洞窟裡會經常探頭出來。
      zh-Hans: |-
        喜欢阴暗的地方。
        大部分时间都待在地下，
        只有在洞窟里会经常探头出来。
      en: |-
        It prefers dark places. It spends most of its time
        underground, though it may pop up in caves.
      fr: |-
        Il aime les lieux sombres. Il passe la majeure
        partie de son temps sous terre mais il remonte
        souvent dans les cavernes.
      de: |-
        Digda bevorzugt dunkle Orte. Es hält sich meist
        unter der Erdoberfläche auf, kommt aber auch
        oft in Höhlen zum Vorschein.
      es: |-
        Prefiere los lugares oscuros. Pasa la mayor parte
        del tiempo bajo tierra, pero también se avista
        con frecuencia en cuevas.
      it: |-
        Ama i luoghi bui e vive soprattutto sottoterra,
        ma esce spesso allo scoperto nelle grotte.
    lets-go-eevee:
      ja-Hrkt: |-
        くらいところを　このむ。ほとんど
