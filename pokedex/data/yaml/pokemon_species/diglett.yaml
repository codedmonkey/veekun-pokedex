    sword:
      ja-Hrkt: |-
        ディグダが　とおったあとの　だいちは
        ほどよく　たがやされて
        さいこうの　はたけに　なる。
      ja: |-
        ディグダが　通ったあとの　大地は
        ほどよく　耕されて
        最高の　畑に　なる。
      ko: |-
        디그다가 지나간 뒤의
        대지는 알맞게 땅이 일궈져
        최고의 밭이 된다.
      zh-Hant: |-
        地鼠經過之後的土壤
        會得到適當的翻動，
        成為最適合耕種的田地。
      zh-Hans: |-
        地鼠经过之后的土壤
        会得到适当的翻动，
        成为最适合耕种的田地。
      en: |-
        If a Diglett digs through a field, it leaves the soil
        perfectly tilled and ideal for planting crops.
      fr: |-
        Si un Taupiqueur creuse un tunnel sous un champ,
        il retourne la terre et améliore les récoltes.
      de: |-
        Bewegt sich ein Digda unterirdisch fort, pflügt es
        dabei den Erdboden gleich mit und bereitet so
        den Anbau von Feldfrüchten vor.
      es: |-
        Si un Diglett excava un terreno, lo deja
        perfectamente arado y preparado para
        sembrarlo.
      it: |-
        Se Diglett attraversa un terreno nel corso dei
        suoi scavi, lo lascia perfettamente lavorato e
        pronto per la semina.
    shield:
      ja-Hrkt: |-
        ちちゅうの　あさいところを　いどう。
        ほりすすんだあとは　じめんが
        もりあがっているので　すぐわかる。
      ja: |-
        地中の　浅いところを　移動。
        掘り進んだあとは　地面が
        盛り上がっているので　すぐわかる。
      ko: |-
        얕은 땅속을 이동한다.
        굴을 파며 다닌 곳은 지면이
        솟아 있기 때문에 바로 알 수 있다.
      zh-Hant: |-
        在地下較淺的地方移動。
        被牠挖掘過的地面會鼓起來，
        所以非常容易發現。
      zh-Hans: |-
        在地下较浅的地方移动。
        被它挖掘过的地面会鼓起来，
        所以非常容易发现。
      en: |-
        It burrows through the ground at a shallow depth.
        It leaves raised earth in its wake, making it easy
        to spot.
      fr: |-
        Ce Pokémon creuse sous terre à faible profondeur.
        La terre qu’il laisse dans son sillage le rend facile
        à repérer.
      de: |-
        Es gräbt sich in geringer Tiefe durch den
        Erdboden. Da es dabei durchwühlte Erde an der
        Oberfläche hinterlässt, ist es leicht zu finden.
      es: |-
        Este Pokémon avanza horadando la tierra a poca
