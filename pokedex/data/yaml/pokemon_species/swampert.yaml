    white-2:
      en: |-
        It can swim while towing a large
        ship. It bashes down foes with a
        swing of its thick arms.
    x:
      ja-Hrkt: |-
        いわの　ように　かたい　うでを
        ひとふり　するだけで　きょだいな
        いわを　コナゴナに　くだくぞ。
      ja: |-
        岩の　ように　硬い　腕を
        一振り　するだけで　巨大な　岩を
        コナゴナに　砕くぞ。
      ko: |-
        돌처럼 딱딱한 팔을
        한 번 휘두르는 것만으로 거대한
        돌을 조각조각으로 부순다.
      en: |-
        Its arms are hard as rock. With one swing, it can
        break a boulder into pieces.
      fr: |-
        Un seul coup de ses puissants bras suffit pour
        pulvériser même les plus gros rochers.
      de: |-
        Schon ein Hieb seiner steinharten Arme schlägt
        selbst den stärksten Felsen zu Bruch.
      es: |-
        Con sus brazos duros como el acero puede partir
        rocas gigantescas en mil pedazos de un solo golpe.
      it: |-
        Ha braccia dure come roccia, capaci di frantumare
        in mille pezzi un masso con un colpo solo.
    'y':
      ja-Hrkt: |-
        おおがたせんを　ひっぱって　およぐ
        パワーの　もちぬし。ふとい　うでの
        ひとふりで　あいてを　たたきのめす。
      ja: |-
        大型船を　引っ張って　泳ぐ
        パワーの　持ち主。太い　腕の
        一振りで　相手を　たたきのめす。
      ko: |-
        큰 배를 끌며 헤엄치는
        파워의 소유자이다. 굵은 팔을
        한 번 휘둘러 상대를 때려눕힌다.
      en: |-
        It can swim while towing a large ship. It bashes
        down foes with a swing of its thick arms.
      fr: |-
        Il peut traîner un grand bateau en nageant.
        Il assomme l’ennemi d’un grand coup de ses bras
        épais.
      de: |-
        Es kann im Schwimmen ein großes Schiff ziehen.
        Seine Gegner schlägt es mit Schlägen seiner Arme
        zurück.
      es: |-
        Puede nadar y arrastrar un barco grande. Golpea a sus
        enemigos con sus gruesos brazos.
      it: |-
        Nuotando riesce a trainare una grande nave. Con le
        braccia vigorose abbatte i nemici in un sol colpo.
    omega-ruby:
      ja-Hrkt: |-
        おもさ　１トンいじょう　ある　いわの　かたまりを
        かるがる　ひっぱる　パワーを　もつ　ポケモンだ。
        にごった　すいちゅうも　みとおす　しりょく。
      ja: |-
        重さ　１トン以上　ある　岩の　塊を
        軽々　引っ張る　パワーを　持つ　ポケモンだ。
        濁った　水中も　見通す　視力。
      ko: |-
        무게 1톤 이상인 바위 덩어리를
        가볍게 잡아당기는 파워를 지닌 포켓몬이다.
        탁해진 물속도 들여다볼 수 있는 시력을 지녔다.
      en: |-
        Swampert is very strong. It has enough power to easily drag a
        boulder weighing more than a ton. This Pokémon also has
        powerful vision that lets it see even in murky water.
      fr: |-
        Laggron est très fort. Tellement fort qu’il peut aisément
        tirer un rocher pesant plus d’une tonne. Ce Pokémon
        est également doté d’une vue si efficace qu’il peut même
        voir à travers l’eau trouble.
      de: |-
        Sumpex ist sehr stark. Es kann mit Leichtigkeit einen Felsblock
        bewegen, der über eine Tonne wiegt. Weiterhin ist es mit
        einem exzellenten Sehvermögen ausgestattet, wodurch es
        auch in trüben Gewässern sehen kann.
      es: |-
        Swampert es muy fuerte. Puede arrastrar una roca que pese
        más de una tonelada sin ningún problema. Este Pokémon
        tiene el sentido de la vista muy desarrollado. Es capaz de ver
        hasta en aguas cenagosas.
      it: |-
        Swampert è molto forte. Ha una forza tale da riuscire a
        trascinare un masso del peso di 1 tonnellata senza
        fatica. La sua vista è così acuta da riuscire a penetrare
        anche l’acqua più torbida.
    alpha-sapphire:
      ja-Hrkt: |-
        ラグラージは　なみおとや　しおかぜの　わずかな
        ちがいを　ヒレで　かんじ　あらしを　よかんする。
        あらしになると　いわを　つみあげ　すを　まもる。
      ja: |-
        ラグラージは　波音や　潮風の　わずかな
        違いを　ヒレで　感じ　嵐を　予感する。
        嵐になると　岩を　積み上げ　巣を　守る。
      ko: |-
        대짱이는 파도 소리나 바닷바람의 아주 작은
        차이를 지느러미로 감지하여 태풍을 예감한다.
        태풍이 불면 바위를 쌓아서 둥지를 지킨다.
      en: |-
        Swampert predicts storms by sensing subtle differences in the
        sounds of waves and tidal winds with its fins. If a storm is
        approaching, it piles up boulders to protect itself.
      fr: |-
        Laggron peut prédire l’arrivée des tempêtes en utilisant
        ses nageoires pour sentir les variations dans les vagues
        et les marées. Si une tempête s’approche, il empile
        des rochers pour protéger son habitat.
      de: |-
        Sumpex kann Stürme voraussagen, indem es feine
        Veränderungen der Geräusche von Wellen und Wind
        mit seinen Flossen wahrnimmt. Wenn eine Sturmfront
        aufzieht, häuft es Felsbrocken an, um sich zu schützen.
      es: |-
        Swampert puede predecir tormentas al percibir con las aletas
        los sutiles cambios que producen las olas y las corrientes.
        Si está a punto de estallar una tormenta, empezará a apilar
        piedras para resguardarse.
      it: |-
        Swampert prevede le tempeste poiché grazie alle pinne
        percepisce le sottili differenze nel suono delle onde e dei
        venti dovuti alle maree. In caso di burrasca imminente,
        crea delle pile di massi per proteggere la tana.
