silvally:
  base_happiness: 0
  capture_rate: 3
  color: gray
  egg_groups:
    - no-eggs
  evolution_chain: type-null
  evolves_from: type-null
  flavor_text:
    sun:
      ja-Hrkt: |-
        パートナーとの　しんらいで　かくせい。
        じざいに　タイプを　チェンジする
        のうりょくを　はっきし　たたかう。
      ja: |-
        パートナーとの　信頼で　覚醒。
        自在に　タイプを　チェンジする
        能力を　発揮し　戦う。
      ko: |-
        파트너와의 신뢰로 각성한다.
        자유자재로 타입을 바꾸는
        능력을 발휘하며 싸운다.
      zh-Hant: |-
        因為與同伴之間的信賴而覺醒。
        發揮自由變換屬性的能力進行戰鬥。
      zh-Hans: |-
        因为与同伴之间的信赖而觉醒。
        发挥自由变换属性的能力进行战斗。
      en: |-
        Its trust in its partner is what awakens it.
        This Pokémon is capable of changing its type,
        a flexibility that is well displayed in battle.
      fr: |-
        La confiance qu’il place en son Dresseur a
        réveillé ses pouvoirs. Il est à présent capable
        de changer de type à loisir durant le combat.
      de: |-
        Das Vertrauen zu seinem Trainer weckt seine
        Kräfte. Es kann seinen Typ im Kampf nach
        Belieben wechseln.
      es: |-
        La confianza con su Entrenador ha despertado
        su potencial. Ahora es capaz de cambiar de tipo
        a voluntad durante el combate.
      it: |-
        La fiducia nel proprio Allenatore gli consente
        di risvegliare il suo potere nascosto. Durante
        la lotta può cambiare il suo tipo a piacimento.
    moon:
      ja-Hrkt: |-
        そのなは　タイプ：ヌルを　はじめて
        このすがたに　しんか　させた
        しょうねんに　よって　なづけられた。
      ja: |-
        その名は　タイプ：ヌルを　初めて
        この姿に　進化　させた
        少年に　よって　名づけられた。
      ko: |-
        그 이름은 타입:널을 처음으로
        이 모습으로 진화시킨
        소년에 의해 지어졌다.
      zh-Hant: |-
        這個名字是由第一個
        讓「屬性：空」進化成
        這個樣子的少年所取名的。
      zh-Hans: |-
        这个名字是由第一个
        让“属性：空”进化成
        这个样子的少年来取的。
      en: |-
        Although its name was Type: Null at first, the
        boy who evolved it into this form gave it the
        name by which it is now known.
      fr: |-
        Son nom lui a été donné par le jeune homme
        qui a le premier réussi à faire évoluer Type:0.
      de: |-
        Seinen Namen hat es von dem Jungen erhalten,
        der es Typ:Null zum ersten Mal ermöglichte,
        sich zu entwickeln.
      es: |-
        Debe su nombre al joven que hizo evolucionar
        por primera vez a Código Cero para que
        adquiriese este aspecto.
      it: |-
        Deve il suo nome al ragazzo che ha fatto
        evolvere Tipo Zero per la prima volta.
    ultra-sun:
      ja-Hrkt: |-
        かくせいし　しんかした　すがた。
        おもい　マスクから　ときはなたれ
        スピードが　おおはばに　アップ。
      ja: |-
        覚醒し　進化した　姿。
        重い　マスクから　解き放たれ
        スピードが　大幅に　アップ。
      ko: |-
        각성으로 진화한 모습이다.
        무거운 마스크에서 벗어나
        스피드가 크게 올라갔다.
      zh-Hant: |-
        覺醒進化之後的模樣。
        從沉重的面罩中獲得解放，
        速度大幅提升。
      zh-Hans: |-
        觉醒进化后的样子。
        从沉重的面罩里被解放出来，
        速度大幅提升。
      en: |-
        This is its form once it has awakened and
        evolved. Freed from its heavy mask, its speed is
        greatly increased.
      fr: |-
        Il a réveillé tout son potentiel et a évolué.
        Briser son lourd masque a décuplé sa vitesse.
      de: |-
        Nun, da es erwacht ist und im Verlauf der
        Entwicklung seine schwere Maske verlor, hat es
        deutlich an Geschwindigkeit hinzugewonnen.
      es: |-
        Esta es la forma que adopta tras evolucionar y
        despertar todo su potencial. Al deshacerse de
        su máscara, su velocidad ha aumentado mucho.
      it: |-
        Ha risvegliato il suo potere nascosto e si è
        evoluto. Svincolato dalla pesante maschera,
        la sua velocità è notevolmente aumentata.
    ultra-moon:
      ja-Hrkt: |-
        せいぎょマスクを　はかい　できたのは
        パートナーとの　きずなに　よって
        つよい　せいしんりょくを　えたからだ。
      ja: |-
        制御マスクを　破壊　できたのは
        パートナーとの　絆に　よって
        強い　精神力を　得たからだ。
      ko: |-
        제어마스크를 파괴할 수 있었던 것은
        파트너와의 유대를 통해
        강한 정신력을 얻었기 때문이다.
      zh-Hant: |-
        之所以能破壞控制面罩，
        是因為牠透過與夥伴的羈絆，
        獲得了強大的精神力。
      zh-Hans: |-
        能够破坏控制面罩，
        是因为通过与同伴的牵绊
        而获得了强大的精神力。
      en: |-
        Through the bond it formed with its Trainer, its
        will was strengthened, and it was able to
        destroy its control mask.
      fr: |-
        Il a réussi à briser son masque grâce à la force
        mentale qu’il a acquise en établissant un lien
        puissant avec son Dresseur.
      de: |-
        Es konnte seine Kontrollmaske nur zerbrechen,
        weil die besondere Bindung zu seinem Trainer
        ihm die nötige Willensstärke verlieh.
      es: |-
        Se ha liberado de la máscara de contención
        gracias a su fortaleza mental, fruto del
        estrecho vínculo con su Entrenador.
      it: |-
        Il legame di fiducia con il proprio Allenatore
        gli ha permesso di acquistare una grande
        forza d’animo e distruggere la maschera.
    sword:
      ja-Hrkt: |-
        パートナーとの　つよい　きずなにより
        ひめた　のうりょくが　かくせいした。
        じざいに　タイプを　かえられる。
      ja: |-
        パートナーとの　強い　絆により
        秘めた　能力が　覚醒した。
        自在に　タイプを　変えられる。
      ko: |-
        파트너와의 강한 유대에 의해
        숨겨진 능력을 각성했다.
        자유자재로 타입을 바꿀 수 있다.
      zh-Hant: |-
        與夥伴間深厚的牽絆讓
        蘊藏在自己體內的力量覺醒。
        可以隨意改變屬性。
      zh-Hans: |-
        与伙伴间深厚的牵绊让
        蕴藏在自己体内的力量觉醒。
        可以随意改变属性。
      en: |-
        A solid bond of trust between this Pokémon and
        its Trainer awakened the strength hidden within
        Silvally. It can change its type at will.
      fr: |-
        Un lien fort avec son Dresseur lui a permis
        de libérer tout son potentiel.
        Il peut changer de type à volonté.
      de: |-
        Seine wahren Kräfte wurden durch eine starke
        Bindung zu seinem Trainer erweckt. Es kann
        seinen Typ nach Belieben wechseln.
      es: |-
        Gracias a los fuertes vínculos que lo unen a su
        Entrenador, ha despertado todo su potencial.
        Es capaz de cambiar de tipo a voluntad.
      it: |-
        Lo stretto legame con il suo Allenatore ha
        risvegliato il suo potere nascosto.
        Può cambiare tipo a suo piacimento.
    shield:
      ja-Hrkt: |-
        ほんらいの　ちからを　ときはなつ
        さいごの　ファクターは　しんらいする
        トレーナーとの　きずな　だった。
      ja: |-
        本来の　力を　解き放つ
        最後の　ファクターは　信頼する
        トレーナーとの　絆　だった。
      ko: |-
        본래의 힘을 해방하게 하는
        마지막 요소는 신뢰하는
        트레이너와의 유대였다.
      zh-Hant: |-
        與所信賴的訓練家之間的牽絆
        是解放牠真正力量的
        最後一個要素。
      zh-Hans: |-
        与所信赖的训练家之间的牵绊
        是解放它真正力量的
        最后一个要素。
      en: |-
        The final factor needed to release this
        Pokémon’s true power was a strong bond
        with a Trainer it trusts.
      fr: |-
        La relation de confiance qui le lie à son Dresseur
        est le facteur décisif qui lui permet de libérer
        tout son potentiel.
      de: |-
        Der entscheidende Faktor, durch den es seine
        wahren Kräfte freisetzen kann, ist die enge
        Bindung zu einem Trainer, dem es vertraut.
      es: |-
        El factor decisivo que le ha permitido liberar
        toda su fuerza ha sido el estrecho vínculo y la
        confianza que profesa a su Entrenador.
      it: |-
        Il fattore decisivo che permette di liberare la sua
        vera potenza è il legame di fiducia che lo unisce
        al suo Allenatore.
