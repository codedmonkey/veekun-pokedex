kirlia:
  base_happiness: 35
  capture_rate: 120
  color: white
  egg_groups:
    - humanshape
    - indeterminate
  evolution_chain: ralts
  evolves_from: ralts
  flavor_text:
    ruby:
      en: |-
        It is said that a KIRLIA that is
        exposed to the positive emotions of
        its TRAINER grows beautiful.This POKéMON controls psychokinetic
        powers with its highly developed brain.
    sapphire:
      en: |-
        KIRLIA uses the horns on its head
        to amplify its psychokinetic power.
        When the POKéMON uses its power,the air around it becomes distorted,
        creating mirages of nonexistent
        scenery.
    emerald:
      en: |-
        A KIRLIA has the psychic power to create 
        a rip in the dimensions and see into the
        future. It is said to dance with pleasure
        on sunny mornings.
    firered:
      en: |-
        The cheerful spirit of its TRAINER gives
        it energy for its psychokinetic power.
        It spins and dances when happy.
    leafgreen:
      en: |-
        The cheerful spirit of its TRAINER gives
        it energy for its psychokinetic power.
        It spins and dances when happy.
    diamond:
      en: |-
        It is highly perceptive of its
        Trainer’s feelings. It dances when
        it is feeling happy.
    pearl:
      en: |-
        It is highly perceptive of its
        Trainer’s feelings. It dances when
        it is feeling happy.
    platinum:
      en: |-
        If its Trainer becomes happy, it
        overflows with energy, dancing
        joyously while spinning about.
    heartgold:
      en: |-
        It has a psychic power that
        enables it to distort the space
        around it and see into the future.
    soulsilver:
      en: |-
        It has a psychic power that
        enables it to distort the space
        around it and see into the future.
    black:
      en: |-
        If its Trainer becomes happy, it
        overflows with energy, dancing
        joyously while spinning about.
      fr: |-
        Quand il sent la joie de son
        Dresseur, il se met à danser,
        débordant d’énergie.
    white:
      en: |-
        If its Trainer becomes happy, it
        overflows with energy, dancing
        joyously while spinning about.
      fr: |-
        Quand il sent la joie de son
        Dresseur, il se met à danser,
        débordant d’énergie.
    black-2:
      en: |-
        If its Trainer becomes happy, it
        overflows with energy, dancing
        joyously while spinning about.
    white-2:
      en: |-
        If its Trainer becomes happy, it
        overflows with energy, dancing
        joyously while spinning about.
    x:
      ja-Hrkt: |-
        トレーナーの　あかるい　きもちが
        サイコパワーの　みなもと。たのしい
        きぶんに　なると　クルクル　おどる。
      ja: |-
        トレーナーの　明るい　気持ちが
        サイコパワーの　源。楽しい
        気分に　なると　クルクル　踊る。
      ko: |-
        트레이너의 밝은 마음이
        사이코 파워의 근원이다.
        즐거워지면 빙글빙글 춤춘다.
      en: |-
        The cheerful spirit of its Trainer gives it energy for
        its psychokinetic power. It spins and dances
        when happy.
      fr: |-
        Ce Pokémon tire ses pouvoirs psy du soutien de son
        Dresseur. Il danse et tourne sur lui-même quand il est
        content.
      de: |-
        Die fröhliche Stimmung seines Trainers verleiht ihm
        Energie für psychokinetische Kraft. Wenn es
        glücklich ist, tanzt und dreht es sich.
      es: |-
        Al percibir la alegría de su Entrenador refuerza sus
        ataques psicoquinéticos. Cuando está contento, da
        vueltas y baila.
      it: |-
        Lo spirito gioioso è alla base dei suoi poteri
        psicocinetici. Quando è felice si lancia in danze
        e piroette.
    'y':
      ja-Hrkt: |-
        サイコパワーを　あやつり　まわりの
        くうかんを　ねじまげる　ことで
        みらいを　みとおす　ことが　できる。
      ja: |-
        サイコパワーを　操り　まわりの　空間を
        ねじ曲げる　ことで
        未来を　見通す　ことが　できる。
      ko: |-
        사이코 파워를 조작해 주변의
        공간을 비틀고 구부려
        미래를 내다볼 수 있다.
      en: |-
        It has a psychic power that enables it to distort the
        space around it and see into the future.
      fr: |-
        Il peut distordre l’espace-temps grâce à ses pouvoirs
        psy et ainsi voir l’avenir.
      de: |-
        Seine Psycho-Kräfte erlauben es ihm, den Raum
        um sich zu verformen und so in die Zukunft zu sehen.
      es: |-
        Con sus poderes psíquicos puede deformar el espacio
        a su alrededor y predecir el futuro.
      it: |-
        Usa i suoi poteri psichici per dare all’aria circostante
        un aspetto distorto e prevedere l’avvenire.
    omega-ruby:
      ja-Hrkt: |-
        トレーナーの　あかるい　かんじょうに　ふれている
        キルリアは　うつくしく　せいちょうすると　いう。
        はったつした　のうで　サイコパワーを　あやつる。
      ja: |-
        トレーナーの　明るい　感情に　触れている
        キルリアは　美しく　成長すると　いう。
        発達した　脳で　サイコパワーを　操る。
      ko: |-
        트레이너의 긍정적인 감정에 닿은
        킬리아는 아름답게 성장한다고 한다.
        발달한 뇌로 사이코 파워를 다룬다.
      en: |-
        It is said that a Kirlia that is exposed to the positive emotions
        of its Trainer grows beautiful. This Pokémon controls
        psychokinetic powers with its highly developed brain.
      fr: |-
        On dit qu’un Kirlia exposé aux émotions positives de
        son Dresseur devient très beau. Le cerveau surdéveloppé
        de ce Pokémon lui permet de contrôler les forces
        télékinétiques.
      de: |-
        Man sagt, dass ein Kirlia, das häufig positive Emotionen
        seines Trainers wahrnimmt, sehr schön wird. Dieses
        Pokémon kontrolliert psychokinetische Energie mit
        seinem hochentwickelten Gehirn.
      es: |-
        Dicen que, al recibir los sentimientos positivos de su
        Entrenador, Kirlia crece con gran belleza. Este Pokémon
        controla poderes psicoquinéticos gracias al desarrollado
        cerebro que tiene.
      it: |-
        Si dice che Kirlia cresca molto bene se viene esposto alle
        emozioni positive del suo Allenatore. Questo Pokémon
        è dotato di poteri psicocinetici grazie al suo cervello
        altamente sviluppato.
    alpha-sapphire:
      ja-Hrkt: |-
        あたまの　ツノで　ぞうふくされた　サイコパワーが
        つかわれるとき　まわりの　くうかんが　ねじまがり
        げんじつには　ない　けしきが　みえると　いう。
      ja: |-
        頭の　ツノで　増幅された　サイコパワーが
        使われるとき　周りの　空間が　ねじ曲がり
        現実には　ない　景色が　見えると　いう。
      ko: |-
        머리의 뿔로 증폭된 사이코 파워를
        사용할 때 주변의 공간이 비틀어져
        현실에는 없는 풍경이 보인다고 한다.
      en: |-
        Kirlia uses the horns on its head to amplify its psychokinetic
        power. When the Pokémon uses its power, the air around it
        becomes distorted, creating mirages of nonexistent scenery.
      fr: |-
        Kirlia utilise ses cornes pour amplifier ses pouvoirs
        télékinétiques. Lorsque ce Pokémon utilise son pouvoir,
        l’air ambiant se déforme et crée des mirages de paysages
        qui n’existent pas.
      de: |-
        Kirlia benutzt die Hörner an seinem Kopf dazu, seine
        psychokinetische Energie zu verstärken. Wenn dieses
        Pokémon seine spezielle Kraft einsetzt, wird die Luft
        verformt und ein Trugbild einer Landschaft erzeugt.
      es: |-
        Kirlia usa los cuernos para amplificar los poderes de
        psicoquinesia que tiene. Cuando los usa, altera el ambiente,
        lo transforma y crea espejismos.
      it: |-
        Kirlia usa le corna sul capo per amplificare i suoi poteri
        psicocinetici. Quando il Pokémon usa tali poteri, l’aria
        circostante assume un aspetto distorto, creando miraggi
        di scenari inesistenti.
    sword:
      ja-Hrkt: |-
        トレーナーが　よろこぶと　キルリアに
        エネルギーが　みちあふれ
        たのしそうに　くるくると　おどる。
      ja: |-
        トレーナーが　喜ぶと　キルリアに
        エネルギーが　満ちあふれ
        楽しそうに　くるくると　踊る。
      ko: |-
        트레이너가 기뻐하면
        킬리아에게 에너지가 넘쳐나서
        기쁜 듯이 빙글빙글 춤춘다.
      zh-Hant: |-
        當訓練家高興的時候，
        奇魯莉安會充滿能量，
        開心地轉著圈跳舞。
      zh-Hans: |-
        当训练家高兴的时候，
        奇鲁莉安会充满能量，
        开心地转着圈跳舞。
      en: |-
        If its Trainer becomes happy, it overflows with
        energy, dancing joyously while spinning about.
      fr: |-
        Quand il ressent la joie de son Dresseur,
        il déborde d’énergie et se met à danser
        en tournant sur lui-même.
      de: |-
        Wenn sich sein Trainer freut, tanzt es in einem
        Schwall von Energie fröhlich kreisend umher.
      es: |-
        Si su Entrenador está contento, desborda energía
        y baila alegremente dando giros.
      it: |-
        Quando il suo Allenatore si sente felice, trabocca
        di energia e inizia a ballare girando su se stesso.
    shield:
      ja-Hrkt: |-
        サイコパワーを　あやつり　まわりの
        くうかんを　ねじまげる　ことで
        みらいを　みとおす　ことが　できる。
      ja: |-
        サイコパワーを　操り　まわりの
        空間を　ねじ曲げる　ことで
        未来を　見通す　ことが　できる。
      ko: |-
        사이코 파워를 조작해
        주변의 공간을 일그러뜨려
        미래를 내다볼 수 있다.
      zh-Hant: |-
        能夠操縱精神力量
        來扭曲周圍的空間，
        讓自己看見未來。
      zh-Hans: |-
        可以通过操纵精神力量
        扭曲周围的空间来看清未来。
      en: |-
        It has a psychic power that enables it to distort
        the space around it and see into the future.
      fr: |-
        Il peut distordre l’espace-temps grâce
        à ses pouvoirs psychiques et ainsi voir l’avenir.
      de: |-
        Seine Psycho-Kräfte erlauben es ihm, den Raum
        um sich selbst zu verformen und so in die Zukunft
        zu sehen.
      es: |-
        Con sus poderes psíquicos puede deformar
        el espacio a su alrededor y predecir el futuro.
      it: |-
        Sfruttando i suoi poteri psichici può distorcere
        lo spazio circostante per prevedere l’avvenire.
    legends-arceus:
      en: |-
        It resembles a maiden in appearance, but it wields strange
        powers to project visions of paradise. I suspect the crimson
        ornaments on its head are the key to its abilities.
