pichu:
  base_happiness: 50
  capture_rate: 190
  color: yellow
  egg_groups:
    - no-eggs
  evolution_chain: pikachu
  evolves_from: ~
  flavor_text:
    gold:
      en: |-
        It is not yet
        skilled at storing
        electricity.It may send out a
        jolt if amused
        or startled.
    silver:
      en: |-
        Despite its small
        size, it can zap
        even adult humans.However, if it
        does so, it also
        surprises itself.
    crystal:
      en: |-
        It is unskilled at
        storing electric
        power. Any kind ofshock causes it to
        discharge energy
        spontaneously.
    ruby:
      en: |-
        PICHU charges itself with electricity
        more easily on days with thunderclouds
        or when the air is very dry.You can hear the crackling of static
        electricity coming off this POKéMON.
    sapphire:
      en: |-
        When PICHU plays with others, it may
        short out electricity with another
        PICHU, creating a shower of sparks.In that event, this POKéMON will begin
        crying, startled by the flash of sparks.
    emerald:
      en: |-
        It is still inept at retaining electricity.
        When it is startled, it discharges power
        accidentally. It gets better at holding
        power as it grows older.
    firered:
      en: |-
        Despite its small size, it can zap even
        adult humans. However, if it does so, it
        also surprises itself.
    leafgreen:
      en: |-
        It is not yet skilled at storing
        electricity. It may send out a jolt if
        amused or startled.
    diamond:
      en: |-
        The electric pouches on its cheeks
        are still small. They cannot store
        much electricity yet.
    pearl:
      en: |-
        It plays with others by touching
        tails and setting off sparks. This
        appears to be a test of courage.
    platinum:
      en: |-
        The electric sacs in its cheeks are
        small. If even a little electricity
        leaks, it becomes shocked.
    heartgold:
      en: |-
        It is not yet skilled at storing
        electricity. It may send out a
        jolt if amused or startled.
    soulsilver:
      en: |-
        Despite its small size, it can zap
        even adult humans. However, if it
        does so, it also surprises itself.
    black:
      en: |-
        The electric sacs in its cheeks are
        small. If even a little electricity
        leaks, it becomes shocked.
      fr: |-
        Les poches électriques de ses
        joues sont encore petites, mais
        risquent de l’électrocuter.
    white:
      en: |-
        The electric sacs in its cheeks are
        small. If even a little electricity
        leaks, it becomes shocked.
      fr: |-
        Les poches électriques de ses
        joues sont encore petites, mais
        risquent de l’électrocuter.
    black-2:
      en: |-
        The electric sacs in its cheeks are
        small. If even a little electricity
        leaks, it becomes shocked.
    white-2:
      en: |-
        The electric sacs in its cheeks are
        small. If even a little electricity
        leaks, it becomes shocked.
    x:
      ja-Hrkt: |-
        なかまと　しっぽの　さきを　あわせて
        ひばなを　とばす　あそびをする。
        どきょうだめしを　しているらしい。
      ja: |-
        仲間と　尻尾の　先を　あわせて
        火花を　飛ばす　遊びをする。
        度胸試しを　しているらしい。
      ko: |-
        동료와 꼬리의 끝을 맞추면서
        불티를 튀기는 놀이를 한다.
        담력 시험을 하고 있는 듯하다.
      en: |-
        It plays with others by touching tails and setting off
        sparks. This appears to be a test of courage.
      fr: |-
        Il prouve son courage en touchant la queue électrifiée
        de ses pairs.
      de: |-
        Sie spielen miteinander, indem sie ihre Schweifspitzen
        aneinanderhalten und Funken fliegen lassen.
      es: |-
        Cuando juegan, se tocan las colas y emiten chispas.
        Al parecer, es una prueba de valor.
      it: |-
        Quando le code dei Pichu si toccano, fanno
        scintille. Pare che si tratti di una prova di coraggio.
    'y':
      ja-Hrkt: |-
        まだまだ　でんきを　ためるのがへた。
        おどろいたり　わらったりすると
        すぐに　ほうでん　してしまう。
      ja: |-
        まだまだ　電気を　ためるのが下手。
        驚いたり　笑ったりすると
        すぐに　放電　してしまう。
      ko: |-
        아직 전기를 모으는 게 서툴다.
        놀라거나 웃으면
        바로 방전돼 버린다.
      en: |-
        It is not yet skilled at storing electricity.
        It may send out a jolt if amused or startled.
      fr: |-
        Il ne sait pas encore stocker l’électricité. Il envoie
        des décharges par jeu ou par peur.
      de: |-
        Es kann noch nicht mit Elektrizität umgehen.
        Es wirft Blitze, wenn es sich freut oder erstaunt ist.
      es: |-
        Todavía no domina el almacenamiento de electricidad
        y descargará un rayo si se divierte o asusta.
      it: |-
        Non è ancora bravo a immagazzinare elettricità. Se
        si emoziona oppure è divertito ne perde un po’.
    omega-ruby:
      ja-Hrkt: |-
        かみなりぐもが　でている　ときや　くうきの
        かんそうした　ひは　でんきが　たまりやすい。
        パチパチ　せいでんきの　おとが　なっているよ。
      ja: |-
        雷雲が　でている　ときや　空気の
        乾燥した　日は　電気が　たまりやすい。
        パチパチ　静電気の　音が　鳴っているよ。
      ko: |-
        번개 구름이 있을 때나 공기가
        건조한 날은 전기가 쉽게 모인다.
        타다닥 정전기 소리가 난다.
      en: |-
        Pichu charges itself with electricity more easily on days with
        thunderclouds or when the air is very dry. You can hear the
        crackling of static electricity coming off this Pokémon.
      fr: |-
        Pichu se charge plus facilement en électricité les jours d’orage
        ou lorsque l’air est très sec. On peut entendre le crépitement
        de l’électricité statique générée par ce Pokémon.
      de: |-
        An Gewittertagen oder Tagen, an denen die Luft sehr trocken
        ist, kann sich Pichu leichter mit Elektrizität aufladen. Dann kann
        man das Knistern statischer Aufladung hören.
      es: |-
        A Pichu le resulta más fácil cargarse de electricidad en días
        de nubarrones o cuando sopla un aire muy seco. Es posible
        oír la electricidad estática que emana de este Pokémon.
      it: |-
        Pichu si carica di elettricità più facilmente in caso di cielo
        coperto da nubi temporalesche o aria molto secca. Spesso
        si può percepire lo scoppiettio della sua carica elettrostatica.
    alpha-sapphire:
      ja-Hrkt: |-
        なかまと　あそんでいるとき　おたがいの　でんきが
        ショートして　ひばなを　だす　ことが　あるぞ。
        ひばなに　びっくり　すると　なきだしてしまうよ。
      ja: |-
        仲間と　遊んでいるとき　お互いの　電気が
        ショートして　火花を　出す　ことが　あるぞ。
        火花に　びっくり　すると　泣き出してしまうよ。
      ko: |-
        동료와 놀고 있을 때 서로의 전기가
        합선되어 불꽃이 일어나는 일이 있다.
        불꽃에 깜짝 놀라면 울기 시작한다.
      en: |-
        When Pichu plays with others, it may short out electricity with
        another Pichu, creating a shower of sparks. In that event, this
        Pokémon will begin crying, startled by the flash of sparks.
      fr: |-
        Lorsque Pichu joue, il lui arrive de faire des courts-circuits
        avec un autre Pichu, créant ainsi une gerbe d’étincelles.
        Du coup, ce Pokémon prend peur et se met à pleurer.
      de: |-
        Wenn Pichu mit anderen spielt, kann es einen Kurzschluss
        mit einem seiner Artgenossen erzeugen, sodass die Funken
        sprühen. Dann beginnt es zu weinen, weil es vor den Funken
        erschrickt.
      es: |-
        Cuando Pichu juega con otros, puede liberar electricidad y
        producir una auténtica lluvia de chispas. Cuando esto ocurre,
        chilla asustado por tanta chispa.
      it: |-
        Quando Pichu gioca con i suoi simili, la sua elettricità crea
        una pioggia di scintille, scontrandosi con quella degli altri.
        In questo caso, inizia a lacrimare accecato dalla luce
        delle scintille.
    sun:
      ja-Hrkt: |-
        まだ　でんきを　あつかうのが　ヘタ。
        ちょっと　めを　はなすと　じぶんの
        でんきで　しびれていることも。
      ja: |-
        まだ　電気を　扱うのが　ヘタ。
        ちょっと　目を　離すと　自分の
        電気で　しびれていることも。
      ko: |-
        아직 전기를 다루는 것이 서툴다.
        잠시 한눈팔면 자기의 전기에
        마비되어 있을 때도 있다.
      zh-Hant: |-
        還未能熟練地操縱電力。
        有時候稍不留神就會被
        自己的電麻痺到。
      zh-Hans: |-
        运用电的水平还不够。
        稍不留神就被自己的电
        麻到也时有发生。
      en: |-
        It is not yet skilled at controlling electricity.
        If you take your eyes off it, it may shock itself.
      fr: |-
        Il ne contrôle pas encore bien son électricité.
        Si on le laisse sans surveillance, il est capable
        de s’électrocuter lui-même.
      de: |-
        Es ist noch nicht sehr geübt im Umgang mit
        Elektrizität. Lässt man es kurz aus den Augen,
        lähmt es sich schon mal versehentlich selbst.
      es: |-
        No controla muy bien la electricidad. Como su
        Entrenador se descuide, Pichu puede acabar
        paralizado por sus propias descargas.
      it: |-
        Non sa ancora controllare bene l’elettricità.
        Se non lo si tiene d’occhio, rischia di darsi
        la scossa da solo.
    moon:
      ja-Hrkt: |-
        かわいいけれど　いっしょに　くらすなら
        でんきショックで　ビリビリに　される
        かくごを　しなければ　いけないのだ。
      ja: |-
        可愛いけれど　一緒に暮らすなら
        電気ショックで　ビリビリに　される
        覚悟を　しなければ　いけないのだ。
      ko: |-
        귀엽지만 같이 산다면
        전기쇼크로 찌릿찌릿해질
        각오를 해야 한다.
      zh-Hant: |-
        雖然很可愛，但如果一起生活的話，
        就必須有隨時被電擊電得麻麻的覺悟。
      zh-Hans: |-
        虽然很可爱，但如果一起生活的话，
        就必须有被电击电得麻麻的觉悟。
      en: |-
        Despite this Pokémon’s cute appearance, those
        who want to live with one should prepare to be
        on the receiving end of its electric jolts.
      fr: |-
        Bien qu’il soit adorable, il faut être prêt à
        supporter ses décharges électriques répétées
        si l’on veut vivre avec un Pichu.
      de: |-
        Pichu sind sehr niedlich, aber wer mit einem
        zusammenleben will, sollte sich besser auf
        regelmäßige Stromschläge gefasst machen.
      es: |-
        Es un Pokémon adorable, pero cuando se
        convive con él, uno tiene que estar preparado
        para recibir alguna que otra descarga eléctrica.
      it: |-
        È molto carino, ma quando si sta con lui, bisogna
        rassegnarsi a prendere la scossa a causa delle
        sue scariche elettriche.
    ultra-sun:
      ja-Hrkt: |-
        まだまだ　でんきを　つかうのが　へた。
        おどろいたり　きもちが　たかぶると
        すぐに　ほうでん　してしまうのだ。
      ja: |-
        まだまだ　電気を　使うのが　下手。
        驚いたり　気持ちが　高ぶると
        すぐに　放電　してしまうのだ。
      ko: |-
        여전히 전기 사용에 서툴다.
        놀라거나 흥분하게 되면
        바로 방전돼 버린다.
      zh-Hant: |-
        還不擅長運用電力，
        一旦吃驚或是情緒高漲
        就會馬上開始放電。
      zh-Hans: |-
        仍旧很不擅长使用电力。
        一旦吃惊或是情绪高涨，
        就会立刻开始放电。
      en: |-
        It still can’t use electricity well. When it’s
        surprised or excited, it discharges
        electricity unintentionally.
      fr: |-
        Il ne contrôle pas encore bien l’électricité,
        et laisse échapper des décharges lorsqu’il
        est surpris ou en proie à de fortes émotions.
      de: |-
        Es ist noch nicht sehr geübt im Umgang mit
        Elektrizität. Wenn es erschrickt oder aufgeregt
        ist, wirft es mit Blitzen um sich.
      es: |-
        Aún no controla muy bien la electricidad, por lo
        que suele emitir descargas involuntarias cuando
        lo sorprenden o siente alguna emoción intensa.
      it: |-
        Non sa ancora controllare bene l’elettricità.
        Se è emozionato o sorpreso, rilascia delle
        scariche.
    ultra-moon:
      ja-Hrkt: |-
        ほっぺに　でんきぶくろが　ある。
        じゅうでん　できているときは
        げんきいっぱい　あそびまわる。
      ja: |-
        ほっぺに　電気袋が　ある。
        充電　できているときは
        元気いっぱい　遊びまわる。
      ko: |-
        볼에 전기 주머니가 있다.
        충전된 상태에서는
        활발하게 돌아다닌다.
      zh-Hant: |-
        臉頰上有電力囊。
        當電力充飽的時候，
        會活力十足地四處玩耍。
      zh-Hans: |-
        脸颊上有电力袋。
        充满电时就会精神十足地四处玩耍。
      en: |-
        It has electric sacs in its cheeks. When they’re
        fully charged, Pichu plays very energetically.
      fr: |-
        Les poches de ses joues renferment de
        l’électricité. Lorsqu’elles sont chargées, il a
        tellement d’énergie qu’il ne pense qu’à jouer.
      de: |-
        In den Backentaschen speichert es Elektrizität.
        Sind diese vollständig aufgeladen, wirbelt es
        beim Spielen voller Energie herum.
      es: |-
        Posee sacos eléctricos en los carrillos. Cuando
        se cargan por completo, se siente pletórico de
        energía y corre y juguetea sin parar.
      it: |-
        Ha due sacche elettriche sulle guance.
        Quando sono completamente cariche, gioca
        scorrazzando qua e là pieno di energie.
    sword:
      ja-Hrkt: |-
        ちいさくても　おとなを　ビリビリ
        させるほどの　でんげきを　はなてる。
        ただし　じぶんも　おどろいてしまう。
      ja: |-
        小さくても　大人を　ビリビリ
        させるほどの　電撃を　放てる。
        ただし　自分も　驚いてしまう。
      ko: |-
        작아도 어른을 찌릿찌릿
        감전시킬 정도의 전기를 낸다.
        단, 자신도 놀라 어찌할 줄 모른다.
      zh-Hant: |-
        身形小巧，卻能夠釋放出
        足以讓成年人麻痺的電擊，
        但是連牠自己也會嚇一跳。
      zh-Hans: |-
        身体小巧，却能够释放出
        足以让成年人麻痹的电击，
        但是连它自己也会吓一跳。
      en: |-
        Despite its small size, it can zap even adult
        humans. However, if it does so, it also
        surprises itself.
      fr: |-
        Malgré sa petite taille, il peut électrocuter
        de grandes personnes, ce qui le surprend
        également.
      de: |-
        Obwohl es so klein ist, kann es genug Elektrizität
        freisetzen, um sogar einen Erwachsenen zu
        überwältigen. Tritt dies ein, ist es selbst erstaunt.
      es: |-
        A pesar de su pequeño tamaño, puede soltar
        descargas capaces de electrocutar a un adulto,
        si bien él también acaba sobresaltado.
      it: |-
        Nonostante sia minuto, può folgorare anche
        una persona adulta... ma quando lo fa,
        si sorprende da solo.
    shield:
      ja-Hrkt: |-
        ほほの　でんきぶくろは　ちいさく
        ちょっとでも　でんきが　あふれると
        じぶんじしんが　しびれてしまう。
      ja: |-
        頬の　電気袋は　小さく
        ちょっとでも　電気が　あふれると
        自分自身が　痺れてしまう。
      ko: |-
        볼의 전기 주머니가 작아서
        조금이라도 전기가 넘치게 되면
        자기 자신이 감전되어 버린다.
      zh-Hant: |-
        臉頰上的電囊還很小，
        如果囊裡的電太多了，
        就會漏出來電到自己。
      zh-Hans: |-
        脸颊上的电囊还很小，
        如果囊里的电太多了，
        就会漏出来电到自己。
      en: |-
        The electric sacs in its cheeks are small. If even a
        little electricity leaks, it becomes shocked.
      fr: |-
        Les poches électriques de ses joues sont
        très petites. Lorsqu’elles sont surchargées,
        il s’électrocute lui-même.
      de: |-
        Tritt auch nur eine geringe Menge Elektrizität aus
        seinen kleinen Backentaschen aus, bekommt es
        einen Schlag.
      es: |-
        Las bolsas de electricidad de sus mejillas son muy
        pequeñas y, a poco que se desborden, recibe
        una fuerte descarga.
      it: |-
        Le sacche elettriche sulle sue guance sono molto
        piccole e, se fuoriesce anche solo un po’
        di elettricità, resta fulminato.
