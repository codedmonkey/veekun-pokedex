eelektrik:
  base_happiness: 70
  capture_rate: 60
  color: blue
  egg_groups:
    - indeterminate
  evolution_chain: tynamo
  evolves_from: tynamo
  flavor_text:
    black:
      en: |-
        They coil around foes and shock them
        with electricity-generating organs that
        seem simply to be circular patterns.
      fr: |-
        Ses taches rondes émettent de
        l’électricité. Il s’enroule autour
        de ses proies et les électrocute.
    white:
      en: |-
        These Pokémon have a big appetite.
        When they spot their prey, they attack
        it and paralyze it with electricity.
      fr: |-
        Un Pokémon doté d’un gros appétit. Il
        paralyse ses proies avec des décharges
        électriques avant de les manger.
    black-2:
      en: |-
        It wraps itself around its prey and
        paralyzes it with electricity from the
        round spots on its sides. Then it chomps.
    white-2:
      en: |-
        It wraps itself around its prey and
        paralyzes it with electricity from the
        round spots on its sides. Then it chomps.
    x:
      ja-Hrkt: |-
        あいてに　まきつき　まるい
        はんてんから　でんきを　ながして
        しびれたところを　まるかじりする。
      ja: |-
        相手に　巻きつき　まるい
        はん点から　電気を　流して
        しびれたところを　まるかじりする。
      ko: |-
        상대를 휘감고 동그란
        반점에서 전기를 흘려보내
        마비시킨 뒤 통째로 문다.
      en: |-
        It wraps itself around its prey and paralyzes it with
        electricity from the round spots on its sides.
        Then it chomps.
      fr: |-
        Ses taches émettent de l’électricité quand il s’enroule
        autour de ses proies pour les paralyser avant de les
        dévorer.
      de: |-
        Schlingt sich um Gegner, lähmt sie über die rund
        gemaserten Flächen an seinem Körper mit Strom
        und beißt beherzt zu.
      es: |-
        Se enrolla alrededor de su presa, la paraliza con la
        electricidad de sus marcas circulares y le asesta
        mordiscos.
      it: |-
        Si avvinghia alla preda e la paralizza rilasciando
        elettricità dalle macchie tonde, poi la ingoia intera.
    'y':
      ja-Hrkt: |-
        しょくよく　おうせいな　ポケモン。
        えものを　みつけると　おそいかかり
        でんきで　しびれさせてから　たべる。
      ja: |-
        食欲　旺盛な　ポケモン。
        獲物を　見つけると　襲いかかり
        電気で　しびれさせてから　食べる。
      ko: |-
        식욕이 왕성한 포켓몬이다.
        먹이를 발견하면 덮쳐서
        전기로 마비시킨 후 먹는다.
      en: |-
        These Pokémon have a big appetite. When they
        spot their prey, they attack it and paralyze it
        with electricity.
      fr: |-
        Un Pokémon doté d’un gros appétit. Il paralyse
        ses proies avec des décharges électriques avant
        de les manger.
      de: |-
        Hat es seine Beute erspäht, lähmt es sie mit Elektrizität
        und verspeist sie anschließend.
      es: |-
        Pokémon de apetito voraz. En cuanto encuentra una
        presa, la paraliza con electricidad y la engulle.
      it: |-
        Pokémon dal grande appetito. Quando attacca,
        immobilizza il nemico paralizzandolo con l’elettricità.
    omega-ruby:
      ja-Hrkt: |-
