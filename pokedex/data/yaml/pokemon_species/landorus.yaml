    legends-arceus:
      en: |-
        When the incarnations of wind and of lightning clash, Landorus
        arrives to quell the conflict. After the tempests and thunderbolts
        abate, the land is sure to be blessed with bountiful harvests.
  form_description:
    en: |-
      Forms have different stats and abilities.  Landorus switches forms when the []{item:reveal-glass} is used on it.

      The Reveal Glass may be obtained by taking a Therian Landorus to []{location:abundant-shrine}.  (Landorus can be obtained in Therian Forme from the Dream Radar.)
