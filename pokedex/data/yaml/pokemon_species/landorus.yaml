landorus:
  base_happiness: 90
  capture_rate: 3
  color: brown
  egg_groups:
    - no-eggs
  evolution_chain: landorus
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        Lands visited by Landorus grant such
        bountiful crops that it has been hailed
        as “The Guardian of the Fields.”
      fr: |-
        Il fait fructifier les cultures partout
        où il passe, c’est pourquoi on l’appelle
        “le dieu des moissons”.
    white:
      en: |-
        The energy that comes pouring from its
        tail increases the nutrition in the soil,
        making crops grow to great size.
      fr: |-
        L’énergie déversée par sa queue
        enrichit les sols en nutriments et
        favorise les cultures.
    black-2:
      en: |-
        From the forces of lightning and wind,
        it creates energy to give nutrients to
        the soil and make the land abundant.
    white-2:
      en: |-
        From the forces of lightning and wind,
        it creates energy to give nutrients to
        the soil and make the land abundant.
    x:
      ja-Hrkt: |-
        ランドロスの　おとずれる　とちは
        さくもつが　たくさん　みのるため
        はたけのかみさま　と　いわれている。
      ja: |-
        ランドロスが　訪れる　土地は
        作物が　たくさん　実るため
        畑の神様　と　言われている。
      ko: |-
        랜드로스가 찾아온 땅에는
        작물에 열매가 많이 열리기 때문에
        농지의 신이라고 전해진다.
      en: |-
        Lands visited by Landorus grant such bountiful
        crops that it has been hailed as “The Guardian of
        the Fields.”
      fr: |-
        Il fait fructifier les cultures partout où il passe, c’est
        pourquoi on l’appelle « le dieu des moissons ».
      de: |-
        Da an Orten, wo es sich blicken lässt, mit reicher
        Ernte zu rechnen ist, nennt man es auch den
        „Herrn des Ackerbaus“.
      es: |-
        Lo consideran una deidad de las cosechas porque los
        cultivos crecen en abundancia en las tierras por las
        que pasa.
      it: |-
        Poiché le terre che visita producono abbondanti
        raccolti, è considerato una benedizione per i campi.
    'y':
      ja-Hrkt: |-
        かぜや　かみなりを　とりこみ　かえた
        エネルギーが　つちに　えいようを
        あたえて　だいちを　ゆたかに　する。
      ja: |-
        風や　雷を　取りこみ　変えた
        エネルギーが　土に　栄養を
        与えて　大地を　豊かに　する。
      ko: |-
        바람이나 번개를 거둬들여 바꾼
        에너지가 흙에 영양을
        주어 대지를 풍족하게 한다.
      en: |-
        From the forces of lightning and wind, it creates
        energy to give nutrients to the soil and make the
        land abundant.
      fr: |-
        Il utilise l’énergie qu’il tire du vent et de la foudre
        pour enrichir les sols en nutriments pour les cultures.
      de: |-
        Seine aus Wind und Donner gewonnene Energie
        sorgt für reiche Ernten, da sie den Boden mit
        Nährstoffen anreichert.
      es: |-
        Utiliza energía que obtiene del viento y del relámpago
        para nutrir el suelo y generar abundantes cosechas.
      it: |-
        Rende fertile la terra trasformando l’energia del vento
        e dei fulmini in nutrimento per il suolo.
    omega-ruby:
