sawsbuck:
  base_happiness: 70
  capture_rate: 75
  color: brown
  egg_groups:
    - ground
  evolution_chain: deerling
  evolves_from: deerling
  flavor_text:
    black:
      en: |-
        They migrate according to the seasons.
        People can tell the season by looking at
        Sawsbuck’s horns.
      fr: |-
        Il change d’habitat selon les saisons.
        Les gens constatent le passage des
        saisons en regardant ses ramures.
    white:
      en: |-
        The plants growing on its horns change
        according to the season. The leaders of
        the herd possess magnificent horns.
      fr: |-
        Le feuillage qui pousse sur sa ramure
        change au fil des saisons. Celui qui a
        la plus belle dirige le troupeau.
    black-2:
      en: |-
        They migrate according to the seasons,
        so some people call Sawsbuck
        the harbingers of spring.
    white-2:
      en: |-
        They migrate according to the seasons,
        so some people call Sawsbuck
        the harbingers of spring.
    x:
      ja-Hrkt: |-
        きせつに　よって　すみかを　かえる。
        ひとびとは　メブキジカの　ツノで
        きせつの　うつりかわりを　かんじる。
      ja: |-
        季節によって　住処を　変える。
        人々は　メブキジカの　ツノで
        季節の　移り変わりを　感じる。
      ko: |-
        계절에 따라 거처를 바꾼다.
        사람들은 바라철록의 뿔에서
        계절의 변화를 느낀다.
      en: |-
        They migrate according to the seasons. People can
        tell the season by looking at Sawsbuck’s horns.
      fr: |-
        Il change d’habitat selon les saisons. Les gens
        constatent le passage des saisons en regardant
        ses ramures.
      de: |-
        An seinem Geweih kann man ablesen, wann eine
        neue Jahreszeit beginnt. Sein Revier wechselt mit
        jeder neuen Jahreszeit.
      es: |-
        Cambia de morada dependiendo de las estaciones.
        Observando sus cuernos, la gente sabe cuándo estas
        van a cambiar.
      it: |-
        Cambia dimora a seconda delle stagioni. Gli uomini
        si accorgono del cambio di stagione osservando le
        sue corna.
    'y':
      ja-Hrkt: |-
        きせつの　うつりかわりと　ともに
        すみかを　かえるので　メブキジカが
        はるをはこぶと　いう　ひともいる。
      ja: |-
        季節の　移り変わりと　ともに
        住処を　変えるので　メブキジカが
        春を運ぶと　いう　人もいる。
      ko: |-
        계절의 변화와 함께
        거처를 바꾸기에 바라철록이
        봄을 나른다고 말하는 사람도 있다.
      en: |-
        They migrate according to the seasons, so some
        people call Sawsbuck the harbingers of spring.
      fr: |-
        Il change d’habitat selon les saisons. Certains disent
        même qu’il est celui qui apporte le printemps.
      de: |-
        Mancherorts sagt man, sie brächten den Frühling,
        da sie je nach Jahreszeit ihr Revier wechseln.
      es: |-
        Migra con el cambio de estación, por lo que hay
        quien considera a Sawsbuck el heraldo de la
        primavera.
      it: |-
        Si spostano da un luogo all’altro al mutare delle
        stagioni. Per questo alcuni dicono che portano con
        sé la primavera.
    omega-ruby:
      ja-Hrkt: |-
        きせつに　よって　すみかを　かえる。
        ひとびとは　メブキジカの　ツノで
        きせつの　うつりかわりを　かんじる。
      ja: |-
        季節によって　住処を　変える。
        人々は　メブキジカの　ツノで
        季節の　移り変わりを　感じる。
      ko: |-
        계절에 따라 거처를 바꾼다.
        사람들은 바라철록의 뿔에서
        계절의 변화를 느낀다.
      en: |-
        They migrate according to the seasons. People can
        tell the season by looking at Sawsbuck’s horns.
      fr: |-
        Il change d’habitat selon les saisons. Les gens constatent
        le passage des saisons en regardant ses ramures.
      de: |-
        An seinem Geweih kann man ablesen, wann eine neue
        Jahreszeit beginnt. Sein Revier wechselt mit jeder neuen
        Jahreszeit.
      es: |-
        Cambia de morada dependiendo de las estaciones.
        Observando sus cuernos, la gente sabe cuándo estas
