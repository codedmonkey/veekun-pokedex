    alpha-sapphire:
      ja-Hrkt: |-
        きせつの　うつりかわりと　ともに
        すみかを　かえるので　メブキジカが
        はるをはこぶと　いう　ひともいる。
      ja: |-
        季節の　移り変わりと　ともに
        住処を　変えるので　メブキジカが
        春を運ぶと　いう　人もいる。
      ko: |-
        계절의 변화와 함께
        거처를 바꾸기에 바라철록이
        봄을 나른다고 말하는 사람도 있다.
      en: |-
        They migrate according to the seasons, so some
