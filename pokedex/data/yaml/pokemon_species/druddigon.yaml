druddigon:
  base_happiness: 50
  capture_rate: 45
  color: red
  egg_groups:
    - monster
    - dragon
  evolution_chain: druddigon
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        It warms its body by absorbing sunlight
        with its wings. When its body temperature
        falls, it can no longer move.
      fr: |-
        Il utilise ses ailes pour emmagasiner la
        chaleur du soleil. Si la température de
        son corps baisse, il ne peut plus bouger.
    white:
      en: |-
        It races through narrow caves, using
        its sharp claws to catch prey. The skin
        on its face is harder than a rock.
      fr: |-
        Il sillonne les grottes étroites,
        capturant ses proies avec ses griffes
        acérées. Sa face est dure comme le roc.
    black-2:
      en: |-
        It runs through the narrow tunnels
        formed by Excadrill and Onix.
        It uses its sharp claws to catch prey.
    white-2:
      en: |-
        It runs through the narrow tunnels
        formed by Excadrill and Onix.
        It uses its sharp claws to catch prey.
    x:
      ja-Hrkt: |-
        せまい　ほらあなを　はしりまわり
        えものを　するどい　ツメで　ほかく。
        かおの　ひふは　いわより　かたい。
      ja: |-
        狭い　洞穴を　走り回り
        獲物を　鋭い　ツメで　捕獲。
        顔の　皮膚は　岩より　硬い。
      ko: |-
        좁은 동굴을 뛰어다니며
        날카로운 손톱으로 먹이를 잡는다.
        얼굴 피부는 바위보다 단단하다.
      en: |-
        It races through narrow caves, using its sharp claws
        to catch prey. The skin on its face is harder than
        a rock.
      fr: |-
        Il sillonne les grottes étroites, capturant ses proies
        avec ses griffes acérées. Sa face est dure comme
        le roc.
      de: |-
        Es jagt durch enge Höhlengänge und spießt seine
        Gegner mit spitzen Klauen auf. Seine Kopfhaut ist
        fester als Stein.
      es: |-
        Corre por estrechas cavernas y atrapa a sus presas con
        sus afiladas garras. La piel de la cara es más dura que
        una roca.
      it: |-
        Percorre le grotte anguste catturando le prede con
        gli artigli affilati. La pelle del muso è più dura della
        roccia.
    'y':
      ja-Hrkt: |-
        にっこうを　つばさで　うけて
        からだを　あたためる。たいおんが
        さがると　うごけなくなってしまう。
      ja: |-
        日光を　翼で　受けて　体を　温める。
        体温が　下がると
        動けなくなってしまう。
      ko: |-
        날개로 햇빛을 받아
        몸을 따뜻하게 한다. 체온이
        내려가면 움직일 수 없게 된다.
      en: |-
        It warms its body by absorbing sunlight with its
        wings. When its body temperature falls, it can no
        longer move.
      fr: |-
        Il utilise ses ailes pour emmagasiner la chaleur du
        soleil. Si la température de son corps baisse, il ne
        peut plus bouger.
      de: |-
        Es erwärmt seinen Körper, indem es mit den Flügeln
        das Sonnenlicht einfängt. Kühlt sein Körper ab,
        erstarrt es.
      es: |-
        Calienta su cuerpo absorbiendo los rayos de sol por
        las alas. No se puede mover si baja su temperatura
        corporal.
      it: |-
        Si riscalda assorbendo la luce del sole dalle ali.
        Quando la sua temperatura si abbassa, non riesce
        più a muoversi.
    omega-ruby:
      ja-Hrkt: |-
        せまい　ほらあなを　はしりまわり
        えものを　するどい　ツメで　ほかく。
        かおの　ひふは　いわより　かたい。
      ja: |-
        狭い　洞穴を　走り回り
        獲物を　鋭い　ツメで　捕獲。
        顔の　皮膚は　岩より　硬い。
      ko: |-
        좁은 동굴을 뛰어다니며
        날카로운 손톱으로 먹이를 잡는다.
        얼굴 피부는 바위보다 단단하다.
      en: |-
        It races through narrow caves, using its sharp claws
        to catch prey. The skin on its face is harder than
        a rock.
      fr: |-
        Il sillonne les grottes étroites, capturant ses proies avec
        ses griffes acérées. Sa face est dure comme le roc.
      de: |-
        Es jagt durch enge Höhlengänge und spießt seine Gegner
        mit spitzen Klauen auf. Seine Kopfhaut ist fester als Stein.
      es: |-
        Corre por estrechas cavernas y atrapa a sus presas con sus
        afiladas garras. La piel de la cara es más dura que una roca.
      it: |-
        Percorre le grotte anguste catturando le prede con gli
        artigli affilati. La pelle del muso è più dura della roccia.
    alpha-sapphire:
      ja-Hrkt: |-
        にっこうを　つばさで　うけて
        からだを　あたためる。たいおんが
        さがると　うごけなくなってしまう。
      ja: |-
        日光を　翼で　受けて　体を　温める。
        体温が　下がると
        動けなくなってしまう。
      ko: |-
        날개로 햇빛을 받아
        몸을 따뜻하게 한다. 체온이
        내려가면 움직일 수 없게 된다.
      en: |-
        It warms its body by absorbing sunlight with its
        wings. When its body temperature falls, it can no
        longer move.
      fr: |-
        Il utilise ses ailes pour emmagasiner la chaleur du soleil.
        Si la température de son corps baisse, il ne peut plus bouger.
      de: |-
        Es erwärmt seinen Körper, indem es mit den Flügeln
        das Sonnenlicht einfängt. Kühlt sein Körper ab, erstarrt es.
      es: |-
        Calienta su cuerpo absorbiendo los rayos de sol por las alas.
        No se puede mover si baja su temperatura corporal.
      it: |-
        Si riscalda assorbendo la luce del sole dalle ali. Quando la sua
        temperatura si abbassa, non riesce più a muoversi.
    ultra-sun:
      ja-Hrkt: |-
        あかい　かおの　ひふは　いわよりも
        かたい。　せまい　どうくつの　なかで
        てきに　むかって　かおから　とつげき。
      ja: |-
        赤い　顔の　皮膚は　岩よりも
        硬い。　狭い　洞窟の　中で
        敵に　向かって　顔から　突撃。
      ko: |-
        빨간 얼굴의 피부는 바위보다
        딱딱하다. 좁은 동굴 안에서
        적을 향해 얼굴로 돌격한다.
      zh-Hant: |-
        臉上的紅色皮膚比岩石
        還要堅硬。在狹窄的洞窟中，
        會用臉朝著敵人發動突襲。
      zh-Hans: |-
        红色脸孔上的皮肤比岩石还要硬。
        在狭窄的洞窟中，
        会用脸朝向敌人发动突击。
      en: |-
        The red skin on its face is harder than rock.
        In narrow caves, it squares off against its
        enemies and charges face-first right into them.
      fr: |-
        La peau rouge de sa gueule est dure comme
        le roc. Il accule ses ennemis dans les boyaux
        des cavernes et les attaque à coups de tête.
      de: |-
        Seine rote Kopfhaut ist fester als Stein. Es jagt
        seine Gegner durch enge Höhlengänge und
        stürmt mit dem Kopf voran auf sie zu.
      es: |-
        La piel roja de su cara es más dura que una
        roca. La usa para atacar a sus enemigos cuando
        los acorrala en cuevas angostas.
      it: |-
        La pelle rossa del muso è più dura della pietra.
        Affronta i nemici in grotte anguste lanciandosi
        contro di loro e colpendoli a testate.
    ultra-moon:
      ja-Hrkt: |-
        ディグダや　ダグトリオが　ほった
        トンネルに　しんにゅう。　えものが
        とおるのを　しずかに　まっている。
      ja: |-
        ディグダや　ダグトリオが　掘った
        トンネルに　侵入。　獲物が
        通るのを　静かに　待っている。
      ko: |-
        디그다나 닥트리오가 판 터널에
        침입한다. 먹이가 지나가기를
        조용히 기다리고 있다.
      zh-Hant: |-
        會入侵地鼠或三地鼠
        挖掘的隧道，靜靜地
        等待著獵物經過。
      zh-Hans: |-
        会入侵地鼠或三地鼠挖掘的隧道。
        静静地等待着猎物的经过。
      en: |-
        It infiltrates tunnels that Pokémon like Diglett
        and Dugtrio have dug and quietly waits for prey
        to pass through.
      fr: |-
        Il se faufile dans les tunnels creusés par les
        Taupiqueur et les Triopikeur. Il attend ensuite
        tranquillement qu’une proie passe à sa portée.
      de: |-
        Es dringt in Schächte ein, die von Digda oder
        Digdri gegraben wurden. Dort wartet es still
        und geduldig auf seine Beute.
      es: |-
        Aprovecha los túneles excavados por los Diglett
        y Dugtrio para esperar tranquilamente en su
        interior a que alguna presa pase cerca.
      it: |-
        Si intrufola nei tunnel scavati dai Diglett e dai
        Dugtrio aspettando in silenzio l’arrivo di una
        preda.
    sword:
      ja-Hrkt: |-
        あなぐらに　すむ。　からだが
        ひえると　うごけなくなるので
        にっこうよくは　かかさない。
      ja: |-
        あなぐらに　棲む。　体が　冷えると
        動けなくなるので
        日光浴は　欠かさない。
      ko: |-
        토굴에 산다. 몸이 차가워지면
        움직이지 못하기 때문에
        일광욕을 거르지 않는다.
      zh-Hant: |-
        居住在地洞裡。如果
        身體受涼就會無法動彈，
        因此一定會做日光浴。
      zh-Hans: |-
        生活在地洞里。因为
        身体受凉就会无法动弹，
        所以日光浴必不可缺。
      en: |-
        Druddigon lives in caves, but it never skips
        sunbathing—it won’t be able to move if its body
        gets too cold.
      fr: |-
        Il vit sous terre, mais il doit impérativement
        s’exposer au soleil, car il devient incapable
        de bouger lorsque son corps se refroidit.
      de: |-
        Shardrago lebt in Grotten. Kühlt sein Körper ab,
        erstarrt es, weshalb es regelmäßig Sonnenbäder
        nehmen muss.
      es: |-
        Habita en túneles. Pierde la movilidad si baja su
        temperatura corporal, por lo que aprovecha la
        menor oportunidad para tomar el sol.
      it: |-
        Vive in cavità sotterranee, ma poiché non riesce
        più a muoversi se il suo corpo si raffredda, non
        può fare a meno dei bagni di sole.
    shield:
      ja-Hrkt: |-
        きょうぼうで　ずるがしこい。
        ほかの　ポケモンが　ほった
        すあなを　うばって　すみかにする。
      ja: |-
        凶暴で　ずる賢い。
        ほかの　ポケモンが　掘った
        巣穴を　奪って　すみかにする。
      ko: |-
        난폭하고 교활하다.
        다른 포켓몬이 파낸
        굴을 빼앗아 거처로 삼는다.
      zh-Hant: |-
        性情凶暴且狡猾。會搶奪
        其他寶可夢挖好的巢穴，
        來當作是自己的窩。
      zh-Hans: |-
        性情凶暴而狡猾。
        会把其他宝可梦挖出的巢穴
        抢来当做自己的住处。
      en: |-
        Druddigon are vicious and cunning. They take up
        residence in nests dug out by other Pokémon,
        treating the stolen nests as their own lairs.
      fr: |-
        Féroce et perfide, Drakkarmin s’approprie
        les terriers creusés par d’autres Pokémon
        pour en faire son antre.
      de: |-
        Shardrago ist grausam und gerissen. Es nimmt die
        selbstgegrabenen Höhlen anderer Pokémon ein,
        um sie zu seinem Unterschlupf zu machen.
      es: |-
        Posee una personalidad despiadada y ladina.
        Se apropia de los túneles excavados por otros
        Pokémon y los habita.
      it: |-
        Brutale e scaltro, si appropria delle tane scavate
        da altri Pokémon facendone la propria dimora.
