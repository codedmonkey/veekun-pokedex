zweilous:
  base_happiness: 35
  capture_rate: 45
  color: blue
  egg_groups:
    - dragon
  evolution_chain: deino
  evolves_from: deino
  flavor_text:
    black:
      en: |-
        After it has eaten up all the food in
        its territory, it moves to another
        area. Its two heads do not get along.
      fr: |-
        Quand il a mangé tout ce qui traînait sur
        son territoire, il migre vers d’autres
        horizons. Ses 2 têtes s’entendent mal.
    white:
      en: |-
        Since their two heads do not get along
        and compete with each other for food,
        they always eat too much.
      fr: |-
        Ses deux têtes s’entendent mal. Même en
        mangeant, elles se cherchent des noises
        et dévorent à qui mieux mieux.
    black-2:
      en: |-
        The two heads do not get along.
        Whichever head eats more than
        the other gets to be the leader.
    white-2:
      en: |-
        The two heads do not get along.
        Whichever head eats more than
        the other gets to be the leader.
    x:
      ja-Hrkt: |-
        ２つの　あたまは　なかが　わるく
        あいてより　おおく　たべることで
        しゅどうけんを　にぎろうと　する。
      ja: |-
        ２つの　頭は　仲が　悪く
        相手より　多く　食べることで
        主導権を　握ろうと　する。
      ko: |-
        2개의 머리는 사이가 나빠서
        상대보다 많이 먹는 것으로
        주도권을 잡으려고 한다.
      en: |-
        The two heads do not get along. Whichever head
        eats more than the other gets to be the leader.
      fr: |-
        Ses deux têtes s’entendent mal et sont en
        compétition permanente pour savoir qui mangera le
        plus et qui sera le chef.
      de: |-
        Seine zwei Köpfe sind sich spinnefeind.
        Beide versuchen, über Fresswettbewerbe
        die Oberhand zu gewinnen.
      es: |-
        Sus dos cabezas se llevan fatal, y la que consigue
        comer más que la otra es la que lleva la voz cantante.
      it: |-
        Le due teste non vanno d’accordo e si contendono la
        posizione di comando in base a quale mangia di più.
    'y':
      ja-Hrkt: |-
        なわばりの　エサを　たべつくすと
        ほかの　とちへ　いどうする。
        ２つの　あたまは　なかが　わるい。
      ja: |-
        縄張りの　エサを　食べつくすと
        ほかの　土地へ　移動する。
        ２つの　頭は　仲が　悪い。
      ko: |-
        영역 안의 먹이를 다 먹어치우면
        다른 지역으로 이동한다.
        두 머리는 사이가 나쁘다.
      en: |-
        After it has eaten up all the food in its territory,
        it moves to another area. Its two heads do not
        get along.
      fr: |-
        Quand il a mangé tout ce qui traînait sur son territoire,
        il migre vers d’autres horizons. Ses 2 têtes
        s’entendent mal.
      de: |-
        Wenn es sein Revier leergejagt hat, sucht es sich ein
        neues. Seine beiden Köpfe liegen ständig im Streit.
      es: |-
        Cambia de morada siempre que termina con la comida
        de una zona. Sus dos cabezas se llevan fatal.
      it: |-
        Quando ha consumato tutto il cibo di un territorio, si
        sposta altrove. Le sue due teste non vanno d’accordo.
    omega-ruby:
      ja-Hrkt: |-
        ２つの　あたまは　なかが　わるく
        あいてより　おおく　たべることで
        しゅどうけんを　にぎろうと　する。
      ja: |-
        ２つの　頭は　仲が　悪く
        相手より　多く　食べることで
        主導権を　握ろうと　する。
      ko: |-
        2개의 머리는 사이가 나빠서
        상대보다 많이 먹는 것으로
        주도권을 잡으려고 한다.
      en: |-
        The two heads do not get along. Whichever head
        eats more than the other gets to be the leader.
      fr: |-
        Ses deux têtes s’entendent mal et sont en compétition
        permanente pour savoir qui mangera le plus et qui sera
        le chef.
      de: |-
        Seine zwei Köpfe sind sich spinnefeind. Beide versuchen,
        über Fresswettbewerbe die Oberhand zu gewinnen.
      es: |-
        Sus dos cabezas se llevan fatal, y la que consigue comer más
        que la otra es la que lleva la voz cantante.
      it: |-
        Le due teste non vanno d’accordo e si contendono la
        posizione di comando in base a quale mangia di più.
    alpha-sapphire:
      ja-Hrkt: |-
        なわばりの　エサを　たべつくすと
        ほかの　とちへ　いどうする。
        ２つの　あたまは　なかが　わるい。
      ja: |-
        縄張りの　エサを　食べつくすと
        ほかの　土地へ　移動する。
        ２つの　頭は　仲が　悪い。
      ko: |-
        영역 안의 먹이를 다 먹어치우면
        다른 지역으로 이동한다.
        두 머리는 사이가 나쁘다.
      en: |-
        After it has eaten up all the food in its territory,
        it moves to another area. Its two heads do not
        get along.
      fr: |-
        Quand il a mangé tout ce qui traînait sur son territoire, il migre
        vers d’autres horizons. Ses 2 têtes s’entendent mal.
      de: |-
        Wenn es sein Revier leergejagt hat, sucht es sich ein neues.
        Seine beiden Köpfe liegen ständig im Streit.
      es: |-
        Cambia de morada siempre que termina con la comida de una
        zona. Sus dos cabezas se llevan fatal.
      it: |-
        Quando ha consumato tutto il cibo di un territorio, si sposta
        altrove. Le sue due teste non vanno d’accordo.
    sword:
      ja-Hrkt: |-
        ナワバリを　あるきまわって
        エサを　さがす。　２つの　あたまは
        どちらに　すすむか　よく　もめる。
      ja: |-
        縄張りを　歩きまわって
        エサを　探す。　２つの　頭は
        どちらに　進むか　よく　もめる。
      ko: |-
        영역을 돌아다니며
        먹이를 찾는다. 2개의 머리는
        어느 쪽으로 갈지로 자주 다툰다.
      zh-Hant: |-
        在自己的領地走來走去，
        尋找食物。２個頭時常會
        為了前進的方向而爭吵。
      zh-Hans: |-
        在自己的领地走来走去，
        寻找食物。２个头时常会
        为了前进的方向而争吵。
      en: |-
        While hunting for prey, Zweilous wanders its
        territory, its two heads often bickering over
        which way to go.
      fr: |-
        Il cherche des proies en arpentant son territoire.
        Ses deux têtes se disputent souvent pour savoir
        quelle direction prendre.
      de: |-
        Es durchstreift sein Revier auf der Suche nach
        Beute. Die zwei Köpfe streiten sich oft darüber,
        welche Richtung sie einschlagen sollten.
      es: |-
        Rastrea su territorio en busca de alimento.
        A menudo sus dos cabezas son incapaces de
        acordar hacia qué dirección avanzar.
      it: |-
        Perlustra il suo territorio in cerca di cibo. Le due
        teste si trovano spesso in disaccordo quando
        devono decidere in che direzione andare.
    shield:
      ja-Hrkt: |-
        １つの　エサを　２つの　あたまで
        うばいあう。　だれとも　たたかって
        いないのに　いつも　キズだらけだ。
      ja: |-
        １つの　エサを　２つの　頭で
        奪い合う。　誰とも　戦って
        いないのに　いつも　傷だらけ。
      ko: |-
        1개의 먹이를 2개의 머리가
        서로 뺏는다. 누구랑 싸운 것도
        아닌데 언제나 상처투성이다.
      zh-Hant: |-
        ２個頭會爭搶同一個食物。
        明明沒有去和別人戰鬥，
        卻總是遍體鱗傷。
      zh-Hans: |-
        ２个头会争抢同一个食物。
        明明没有去和别人战斗，
        却总是遍体鳞伤。
      en: |-
        Their two heads will fight each other over a
        single piece of food. Zweilous are covered in
        scars even without battling others.
      fr: |-
        Ses deux têtes se disputent la même proie.
        Il est toujours couvert de blessures, même
        s’il n’a affronté personne.
      de: |-
        Sein Körper weist immer Narben auf, selbst wenn
        es gar nicht gekämpft hat. Die beiden Köpfe
        nehmen sich ständig gegenseitig das Futter weg.
      es: |-
        Las dos cabezas se disputan la comida con
        brutalidad. Por eso siempre está cubierto de
        heridas, aunque no haya combatido contra nadie.
      it: |-
        Le due teste si rubano il cibo a vicenda.
        È sempre ricoperto di ferite, anche se non
        ha lottato con nessuno.
