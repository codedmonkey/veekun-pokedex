    sun:
      ja-Hrkt: |-
        はいきょに　なった　たてものに
        あやしいひかりが　ともっていたら
        そこに　ゴースが　ひそんでいる。
      ja: |-
        廃墟に　なった　建物に
        怪しい光が　灯っていたら
        そこに　ゴースが　潜んでいる。
      ko: |-
        폐허가 된 건물에
        수상한 빛이 비친다면
        그곳에 고오스가 살고 있다.
      zh-Hant: |-
        如果在已成廢墟的
        建築物裡亮著怪異的光，
        代表那裡潛藏著鬼斯。
      zh-Hans: |-
        如果在已成废墟的
        建筑物里亮着怪异的光，
        说明那里潜藏着鬼斯。
      en: |-
        Should a strange light be seen flickering
        in an abandoned building, Gastly is lurking there.
      fr: |-
        Lorsqu’on aperçoit une lueur diaphane dans
        un bâtiment désaffecté, c’est qu’un Fantominus
        s’y terre.
      de: |-
        Flackert in einem verlassenen alten Gebäude
        plötzlich ein rätselhaftes Licht auf, hält sich
        dort ein Nebulak versteckt.
      es: |-
        Si se aprecia una tenue luz en el interior de un
        edificio abandonado, suele ser indicio de que
        un Gastly mora en él.
      it: |-
        Gli strani bagliori che a volte si scorgono negli
        edifici abbandonati potrebbero indicare la
        presenza di Gastly.
    moon:
      ja-Hrkt: |-
        そのすがたは　ほとんど　みえないが
        ゴースが　ちかくに　あらわれると
        かすかに　あまい　においが　する。
      ja: |-
        その姿は　ほとんど　みえないが
        ゴースが　近くに　現れると
        微かに　甘い　匂いが　する。
      ko: |-
        그 모습은 거의 보이지 않지만
        고오스가 근처에 나타나면
        희미하게 달콤한 향기가 난다.
      zh-Hant: |-
        幾乎沒人能看到鬼斯的模樣，
        但牠在近處出現時，
        會聞到淡淡的甜香味。
      zh-Hans: |-
        它的样子几乎看不到，
        但鬼斯一旦出现，
        附近就会发出淡淡的甜香味。
      en: |-
        Although Gastly is barely visible, when it’s near,
        a faint sweet smell lingers.
      fr: |-
        Il est presque invisible, mais lorsqu’il se
        manifeste à proximité, une étrange odeur
        sucrée flotte dans l’air.
      de: |-
        Dass sich ein Nebulak in der Nähe aufhält,
        erkennt man hauptsächlich an einem süßlichen
        Duft. Sehen kann man es fast gar nicht.
      es: |-
        El cuerpo de Gastly es casi invisible. Aun así,
        puede percibirse su presencia cuando está
        cerca, pues desprende un sutil olor dulce.
      it: |-
        È molto difficile scorgere la sua sagoma,
        ma è facilmente riconoscibile per via dell’odore
        vagamente dolciastro che emana.
    ultra-sun:
      ja-Hrkt: |-
        はかばで　はっせいする　ガスに
        おんねんが　やどるうち　やがて
        ポケモンに　なったと　いわれている。
      ja: |-
        墓場で　発生する　ガスに
        怨念が　宿るうち　やがて
        ポケモンに　なったと　いわれている。
      ko: |-
        무덤에서 발생한 가스에
        원념이 머물러 이윽고
        포켓몬이 되었다고 전해진다.
      zh-Hant: |-
        據說怨念寄宿在
        墳場產生的瓦斯裡，
        最後變成了寶可夢。
      zh-Hans: |-
        据说是怨念寄宿在了
        墓地散发出的气体中，
        并最终变成了宝可梦。
      en: |-
        It’s said that gas emanating from a graveyard
        was possessed by the grievances of the
        deceased and thus became a Pokémon.
      fr: |-
        Ce Pokémon serait né des émanations gazeuses
        des cimetières et de la rancœur qui les habite.
      de: |-
        Es heißt, dieses Pokémon sei aus einem tiefen
        Groll entstanden, der Gasen innewohnte, die auf
        Friedhöfen ausgeströmt waren.
      es: |-
        Se dice que su origen son nubes de gas
        provenientes de un cementerio que cobraron
        vida al verse imbuidas de rencor.
      it: |-
        Si dice che questo Pokémon sia nato quando
        i gas esalati da un cimitero sono stati
        animati da un sentimento di rancore.
    ultra-moon:
      ja-Hrkt: |-
        からだの　９５パーセントは　どくガス。
        のこりの　５パーセントは　どくガスで
        しんだものの　たましいだと　いわれる。
      ja: |-
        身体の　９５パーセントは　毒ガス。
        残りの　５パーセントは　毒ガスで
        死んだ者の　魂だと　いわれる。
      ko: |-
        몸의 95퍼센트는 독가스다.
        남은 5퍼센트는 독가스에 의해
        죽은 이들의 영혼이라고 전해진다.
      zh-Hant: |-
        身體的９５％是由毒氣構成。
        剩下的５％據說是死於毒氣的
        死者的靈魂。
      zh-Hans: |-
        身体的９５％是毒瓦斯。
        剩下的５％据说是死于
        毒瓦斯的死者的灵魂。
      en: |-
        Poisonous gas comprises 95% of its body. It’s
        said that the remaining 5% is made up of the
        souls of those who died from the gas.
      fr: |-
        Il est composé à 95 % de gaz toxiques. Les 5 %
        restants ? Aux dires de certains, il s’agirait d’un
        mélange de gaz toxiques et d’âmes damnées.
      de: |-
        Es besteht zu 95 % aus Giftgas. Die restlichen
        5 % bestehen aus Seelen von Opfern giftiger
        Gase.
      es: |-
        Su cuerpo está formado en un 95% por gas
        venenoso. El 5% restante corresponde a las
        almas de quienes fallecieran a causa del gas.
      it: |-
        Il 95% del suo corpo è composto da gas tossici.
        Si dice che la percentuale restante sia l’anima
        di qualcuno morto intossicato.
    lets-go-pikachu:
      ja-Hrkt: |-
        ふるくなって　だれも　すまなくなった
        たてものに　はっせいするらしい。
        かたちは　あいまいで　ガスのよう。
      ja: |-
        古くなって　誰も　住まなくなった
        建物に　発生するらしい。
        形は　あいまいで　ガスのよう。
      ko: |-
        오래되어 아무도 살지 않는
        건물에 나타나는 듯하다.
        형태는 모호하고 가스 같다.
      zh-Hant: |-
        似乎會從老舊無人居住的
        建築物中出現。看起來像是
        一團氣體，沒有明確的形體。
      zh-Hans: |-
        它似乎会在没人居住的
        旧屋子里出现。形状不清，
        仿佛就像是气体一样。
      en: |-
        Said to appear in decrepit, deserted buildings.
        It has no real shape, as it appears to be
        made of a gas.
      fr: |-
        On en trouve dans les maisons en ruine.
        Composé de gaz, il ne possède pas de forme
        définie.
      de: |-
        Es heißt, es erscheine in alten, verlassenen
        Gebäuden. Sein Körper hat keine feste Form
        und erinnert an Gas.
      es: |-
        Según dicen, aparece en edificios antiguos y
        deshabitados. Su cuerpo, de aspecto gaseoso,
        carece de una forma definida.
      it: |-
        Si dice che appaia nelle case diroccate
        e abbandonate. Il suo corpo sembra fatto
        di gas e non ha una forma definita.
    lets-go-eevee:
      ja-Hrkt: |-
        ふるくなって　だれも　すまなくなった
