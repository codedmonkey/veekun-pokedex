    sword:
      ja-Hrkt: |-
        ガスから　うまれた　せいめいたい。
        どくをふくんだ　ガスの　からだに
        つつまれると　だれでも　きぜつする。
      ja: |-
        ガスから　生まれた　生命体。
        毒を含んだ　ガスの　体に
        包まれると　だれでも　気絶する。
      ko: |-
        가스에서 태어난 생명체다.
        독을 포함한 가스의 몸에
        둘러싸이면 누구든지 기절한다.
      zh-Hant: |-
        從氣體中誕生的生命體。
        若被牠那有毒氣體形成的身體裹住，
        不管是誰都會昏迷。
      zh-Hans: |-
        从气体中诞生的生命体。
        如果被含毒的气体状身体裹住的话，
        不管是谁都会昏迷过去。
      en: |-
        Born from gases, anyone would faint if engulfed
        by its gaseous body, which contains poison.
      fr: |-
        Le corps de ce Pokémon s’est formé à partir
        de gaz si toxiques qu’ils pourraient faire perdre
        connaissance à n’importe qui.
      de: |-
        Es ist aus Gasen entstanden. Wird jemand in
        seinen gasförmigen, giftigen Körper gehüllt,
        so fällt er in Ohnmacht.
      es: |-
        Nació a partir de gases venenosos que asfixiarían
        a cualquiera que se viera envuelto en ellos.
      it: |-
        Generato da sostanze gassose, fa perdere i sensi
        a chiunque respiri i gas tossici di cui è costituito.
    shield:
      ja-Hrkt: |-
        うすい　ガスのような　からだで
        どこにでも　しのびこむが
        かぜが　ふくと　ふきとばされる。
      ja: |-
        薄い　ガスのような　体で
        どこにでも　忍びこむが
        風が　吹くと　吹きとばされる。
      ko: |-
        몸은 옅은 가스로 되어 있어
        어디든지 숨어들어 가지만
        바람이 불면 날아가 버린다.
      zh-Hant: |-
        能用稀薄氣體狀的
        身體潛入任何地方，
        但只要起風就會被吹跑。
      zh-Hans: |-
        能用稀薄气体状的
        身体潜入任何地方，
        但只要起风就会被吹跑。
      en: |-
        With its gas-like body, it can sneak into any place
        it desires. However, it can be blown away by wind.
      fr: |-
        Son corps gazéiforme lui permet de se glisser
        n’importe où, mais au moindre coup de vent,
        il s’envole.
      de: |-
        Aufgrund seines an Gas erinnernden Körpers
        kommt es an jeden Ort. Es kann jedoch vom
        Wind davongeweht werden.
      es: |-
        Con su cuerpo gaseoso puede colarse por donde
        quiera, aunque con un golpe de viento sale
        despedido.
      it: |-
        Il suo corpo gassoso può infilarsi ovunque, ma
        un colpo di vento lo può spazzare via.
