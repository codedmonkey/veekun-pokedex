zubat:
  base_happiness: 50
  capture_rate: 255
  color: purple
  egg_groups:
    - flying
  evolution_chain: zubat
  evolves_from: ~
  flavor_text:
    red:
      en: |-
        Forms colonies in
        perpetually dark
        places. Usesultrasonic waves
        to identify and
        approach targets.
    blue:
      en: |-
        Forms colonies in
        perpetually dark
        places. Usesultrasonic waves
        to identify and
        approach targets.
    yellow:
      en: |-
        Emits ultrasonic
        cries while it
        flies. They actas a sonar used
        to check for ob­
        jects in its way.
    gold:
      en: |-
        While flying, it
        constantly emits
        ultrasonic wavesfrom its mouth to
        check its sur­
        roundings.
    silver:
      en: |-
        Capable of flying
        safely in dark
        places, it emitsultrasonic cries
        to check for any
        obstacles.
    crystal:
      en: |-
        During the day, it
        gathers with
        others and hangsfrom the ceilings
        of old buildings
        and caves.
    ruby:
      en: |-
        ZUBAT remains quietly unmoving in a
        dark spot during the bright daylight
        hours. It does so because prolongedexposure to the sun causes its body to
        become slightly burned.
    sapphire:
      en: |-
        ZUBAT avoids sunlight because exposure
        causes it to become unhealthy.
        During the daytime, it stays in caves orunder the eaves of old houses, sleeping
        while hanging upside down.
    emerald:
      en: |-
        While living in pitch-black caverns, their
        eyes gradually grew shut and deprived
        them of vision. They use ultrasonic waves
        to detect obstacles.
    firered:
      en: |-
        It has no eyes. Instead, it relies on
        its ultrasonic cries for echo location to
        flit about in darkness.
    leafgreen:
      en: |-
        It forms colonies in perpetually dark 
        places and uses ultrasonic waves to  
        identify and approach targets.
    diamond:
      en: |-
        Even though it has no eyes, it can
        sense obstacles using ultrasonic
        waves it emits from its mouth.
    pearl:
      en: |-
        Disliking sunlight, it sleeps
        deep in forests and caves
        until sundown.
    platinum:
      en: |-
        It checks its surroundings and
        location using reflections of the
        ultrasonic waves from its mouth.
    heartgold:
      en: |-
        While flying, it constantly emits
        ultrasonic waves from its mouth to
        check its surroundings.
    soulsilver:
      en: |-
        Capable of flying safely in dark
        places, it emits ultrasonic cries
        to check for any obstacles.
    black:
      en: |-
        It checks its surroundings and
        location using reflections of the
        ultrasonic waves from its mouth.
      fr: |-
        Il se repère dans l’espace grâce
        aux ultrasons émis par sa gueule.
    white:
      en: |-
        It checks its surroundings and
        location using reflections of the
        ultrasonic waves from its mouth.
      fr: |-
        Il se repère dans l’espace grâce
        aux ultrasons émis par sa gueule.
    black-2:
      en: |-
        It does not need eyes, because it
        emits ultrasonic waves to check
        its surroundings while it flies.
    white-2:
      en: |-
        It does not need eyes, because it
        emits ultrasonic waves to check
        its surroundings while it flies.
    x:
      ja-Hrkt: |-
        くちから　だす　ちょうおんぱで
        りょうめが　なくても　まわりの
        しょうがいぶつを　さっちできる。
      ja: |-
        口から　出す　超音波で
        両目が　なくても
        まわりの　障害物を　察知できる。
      ko: |-
        입에서 내는 초음파로
        두 눈이 없어도 주위의
        장애물을 탐색할 수 있다.
      en: |-
        Even though it has no eyes, it can sense obstacles
        using ultrasonic waves it emits from its mouth.
      fr: |-
        Bien que dépourvu d’yeux, il repère les obstacles
        grâce aux ultrasons émis par sa gueule.
      de: |-
        Obwohl es keine Augen hat, kann es Hindernisse
        mithilfe von Ultraschallwellen wahrnehmen.
      es: |-
        Aunque carezca de ojos, puede detectar obstáculos
        con las ondas ultrasónicas que emite su boca.
      it: |-
        Non ha occhi, ma avverte gli ostacoli con le onde
        ultrasoniche che emette dalla bocca.
    'y':
      ja-Hrkt: |-
        りょうほうの　めが　そんざいしない。
        くちから　ちょうおんぱを　だして
        くらやみを　とびまわる。
      ja: |-
        両方の　目が　存在しない。
        口から　超音波を　出して
        暗闇を　飛び回る。
      ko: |-
        양쪽 눈이 존재하지 않는다.
        입에서 초음파를 내어
        어둠 속을 날아다닌다.
      en: |-
        It has no eyes. Instead, it relies on its ultrasonic
        cries for echolocation to flit about in darkness.
      fr: |-
        Comme il ne possède pas d’yeux, il n’utilise que
        ses ultrasons pour se déplacer dans les ténèbres.
      de: |-
        Es hat keine Augen. Zur Orientierung nutzt es seine
        Ultraschallwellen-Schreie, um in der Dunkelheit
        zu fliegen.
      es: |-
        No tiene ojos. Se guía por las ondas ultrasónicas que
        emite. El eco le indica por dónde tiene que ir en la
        oscuridad.
      it: |-
        Non ha occhi, ma si sposta agilmente nella notte
        emettendo ultrasuoni la cui eco lo avverte degli
        ostacoli.
    omega-ruby:
      ja-Hrkt: |-
        ひるま　くらやみで　じっと　しているのは
        たいようの　ひかりを　ながい　じかん　あびると
        ぜんしんが　かるく　やけどしてしまうからだ。
      ja: |-
        昼間　暗闇で　じっと　しているのは
        太陽の　光を　長い　時間　浴びると
        全身が　軽く　火傷してしまうからだ。
      ko: |-
        낮에 어두운 곳에서 가만히 있는 것은
        긴 시간 동안 햇빛을 받으면
        전신에 가벼운 화상을 입기 때문이다.
      en: |-
        Zubat remains quietly unmoving in a dark spot during the bright
        daylight hours. It does so because prolonged exposure to the
        sun causes its body to become slightly burned.
      fr: |-
        Nosferapti reste calme et immobile dans un coin sombre
        pendant la journée. En effet, une exposition trop longue
        à la lumière du soleil lui brûle légèrement la peau.
      de: |-
        Tagsüber bleibt Zubat an einem dunklen Ort und bewegt sich
        kaum. Wenn es dem Sonnenlicht längere Zeit ausgesetzt wird,
        zieht es sich Verbrennungen an seinem Körper zu.
      es: |-
        Durante el día, Zubat permanece inmóvil y a oscuras. Si este
        Pokémon pasara mucho tiempo expuesto al sol, correría el
        peligro de sufrir quemaduras.
      it: |-
        Zubat rimane perfettamente immobile al buio durante le ore
        diurne più luminose. Infatti la prolungata esposizione al sole
        gli provoca delle bruciature.
    alpha-sapphire:
      ja-Hrkt: |-
        たいようの　ひかりを　あびると　たいちょうが
        わるくなるので　ひるまは　どうくつや　ふるびた
        いえの　のきしたに　ぶらさがって　ねている。
      ja: |-
        太陽の　光を　浴びると　体調が
        悪くなるので　昼間は　洞窟や　古びた
        家の　軒下に　ぶら下がって　寝ている。
      ko: |-
        태양의 빛을 받으면 몸 상태가
        나빠지기 때문에 낮에는 동굴이나 오래된
        집의 처마 밑에 매달려 자고 있다.
      en: |-
        Zubat avoids sunlight because exposure causes it to become
        unhealthy. During the daytime, it stays in caves or under
        the eaves of old houses, sleeping while hanging upside down.
      fr: |-
        Nosferapti évite la lumière du soleil, car ça le rend malade.
        Pendant la journée, il reste dans les cavernes ou à l’ombre
        des vieilles maisons, où il dort, la tête à l’envers.
      de: |-
        Zubat meidet Sonnenlicht, da es dadurch krank würde.
        Am Tage hält es sich in Höhlen oder unter den Dachrinnen
        alter Häuser auf. Dort schläft es mit dem Kopf nach unten.
      es: |-
        Zubat evita la luz del día porque le resulta perjudicial para la
        salud. Durante el día, permanece en cuevas o bajo los aleros
        de las casas viejas durmiendo colgado de las patas, cabeza
        abajo.
      it: |-
        Zubat evita la luce del sole perché nociva per la sua salute.
        Durante il giorno sta rintanato in grotte o sotto i cornicioni
        di vecchie case, dormendo appeso a testa in giù.
    sun:
      ja-Hrkt: |-
        ひるまは　ほらあなで　ねている。
        めが　ないので　ちょうおんぱで
        まわりを　かくにんしながら　とぶ。
      ja: |-
        昼間は　洞穴で　寝ている。
        目が　ないので　超音波で
        周りを　確認しながら　飛ぶ。
      ko: |-
        낮에는 동굴에서 자고 있다.
        눈이 없어서 초음파로
        주변을 확인하면서 날아다닌다.
      zh-Hant: |-
        白天在洞穴裡睡覺。
        由於沒有眼睛，會利用超音波
        一邊確認周圍環境一邊飛行。
      zh-Hans: |-
        白天在洞穴里睡觉。
        因为没有眼睛，所以用超音波
        一边探测周围，一边飞行。
      en: |-
        It sleeps in caves during the day. It has no eyes,
        so to check its surroundings while flying, it
        emits ultrasonic waves.
      fr: |-
        Il dort dans des grottes pendant la journée.
        Comme il n’a pas d’yeux, il vole en se repérant
        grâce à ses ultrasons.
      de: |-
        Tagsüber schläft es in Höhlen. Da es keine
        Augen hat, erschließt es sich seine Umgebung
        im Flug durch das Aussenden von Schallwellen.
      es: |-
        Duerme en cuevas durante el día. Como no tiene
        ojos, se guía emitiendo ultrasonidos cuando
        vuela.
      it: |-
        Di giorno dorme dentro le grotte.
        Non ha occhi e quando vola emette ultrasuoni
        tramite i quali percepisce l’ambiente circostante.
    moon:
      ja-Hrkt: |-
        ひの　ひかりを　あびると　ヤケドする。
        つかう　ちょうおんぱの　しんどうは
        むれに　よって　びみょうに　ちがう。
      ja: |-
        日の　光を　浴びると　火傷する。
        使う　超音波の　振動は
        群れに　よって　微妙に　違う。
      ko: |-
        햇빛을 받으면 화상을 입는다.
        사용하는 초음파의 진동은
        무리에 따라 조금씩 다르다.
      zh-Hant: |-
        如果被陽光照射到就會灼傷。
        所使用的超音波的振動
        會因群體不同而有細微差異。
      zh-Hans: |-
        如果被阳光照射到就会灼伤。
        所使用的超音波的振动
        会因群体不同而有细微差异。
      en: |-
        When exposed to sunlight, they suffer burns.
        The frequency of their ultrasonic waves can
        differ slightly from colony to colony.
      fr: |-
        S’il vole en journée, la lumière du soleil brûle
        sa peau. La fréquence de ses ultrasons est
        légèrement différente d’un groupe à l’autre.
      de: |-
        Sonnenlicht verursacht bei ihm Verbrennungen.
        Die Frequenz seiner Ultraschallwellen variiert
        von Schwarm zu Schwarm.
      es: |-
        Si se expone al sol, puede sufrir quemaduras.
        La vibración de las ondas ultrasónicas que emite
        varía, curiosamente, de una colonia a otra.
      it: |-
        L’esposizione alla luce del sole gli provoca delle
        bruciature. La frequenza degli ultrasuoni che
        emette varia da un gruppo all’altro.
    ultra-sun:
      ja-Hrkt: |-
        めだまが　ないので　めは　みえない。
        くちから　だす　ちょうおんぱで
        まわりの　ようすを　うかがっている。
      ja: |-
        目玉が　ないので　目は　見えない。
        口から　出す　超音波で
        周りの　様子を　うかがっている。
      ko: |-
        눈이 없어서 보지 못한다.
        입으로 초음파를 발산하여
        주변의 상황을 파악한다.
      zh-Hant: |-
        因為沒有眼珠所以看不見東西。
        會從口中發出超音波
        來探測周圍的狀況。
      zh-Hans: |-
        因为没有眼珠，所以无法视物。
        会从口中发出超音波
        来探测周围的情况。
      en: |-
        It has no eyeballs, so it can’t see. It checks its
        surroundings via the ultrasonic waves it emits
        from its mouth.
      fr: |-
        Dépourvu d’yeux, il se repère dans l’espace
        grâce aux ultrasons qu’il émet avec sa bouche.
      de: |-
        Da es keine Augäpfel hat, ist es blind. Mithilfe
        von Ultraschallwellen, die es aus dem Mund
        aussendet, erkundet es seine Umgebung.
      es: |-
        Como carece de ojos y no puede ver, emite
        ultrasonidos que le permiten escrutar el entorno
        y orientarse.
      it: |-
        Non ha occhi e non può vedere, ma è in
        grado di percepire l’ambiente circostante
        emettendo ultrasuoni dalla bocca.
    ultra-moon:
      ja-Hrkt: |-
        にっこうを　あびると　ヤケドするほど
        ひふが　うすい。　さむくなると　むれて
        からだを　よせあい　あたためあうのだ。
      ja: |-
        日光を　浴びると　ヤケドするほど
        皮膚が　薄い。　寒くなると　群れて
        身体を　寄せあい　暖めあうのだ。
      ko: |-
        햇빛을 받으면 화상을 입을 정도로
        피부가 얇다. 추워지면 무리 지어
        서로 몸을 기대서 체온을 나눈다.
      zh-Hant: |-
        皮膚薄到只要被陽光照射到
        就會曬傷。當天氣變冷時，
        會成群靠在一起互相取暖。
      zh-Hans: |-
        皮肤薄到只要被阳光照射到就会晒伤。
        天气变冷后，就会抱团取暖。
      en: |-
        Their skin is so thin that they’ll be burned if
        sunlight hits them. When it gets cold out, they
        gather together to warm one another’s bodies.
      fr: |-
        Sa peau est si fine que la lumière du soleil
        lui cause des brûlures. Lorsqu’il fait froid, ses
        congénères et lui se serrent pour se réchauffer.
      de: |-
        Seine dünne Haut erleidet bei Sonnenlicht
        Verbrennungen. Bei Kälte schmiegt es sich
        an seine Artgenossen, um sich zu wärmen.
      es: |-
        Su piel es tan fina que, si se expone al sol,
        puede sufrir quemaduras. Cuando hace frío,
        se junta con los suyos para entrar en calor.
      it: |-
        Ha una pelle così sottile che la luce solare
        gli provoca delle bruciature. Quando fa freddo
        si stringe ai suoi simili per scaldarsi.
    lets-go-pikachu:
      ja-Hrkt: |-
        くちから　ちょうおんぱを　だしながら
        とぶのは　まえに　なにが　あるのか
        しらべながら　とんでいるからだ。
      ja: |-
        口から　超音波を　出しながら
        飛ぶのは　前に　なにが　あるのか
        調べながら　飛んでいるからだ。
      ko: |-
        입에서 초음파를 내보내면서
        나는 것은 앞에 무엇이 있는지
        확인하면서 날기 때문이다.
      zh-Hant: |-
        會一邊飛行一邊從口中
        發出超音波，這麼做是為了
        在飛行時探查前方有什麼東西。
      zh-Hans: |-
        由于需要调查前方的
        状况，它会一边从嘴里
        发出超音波一边飞行。
      en: |-
        Emits ultrasonic cries while it flies. They act as
        a sonar used to check for objects in its way.
      fr: |-
        Il émet des ultrasons pour se diriger et
        éviter les obstacles sur son trajet.
      de: |-
        Zubat stößt während des Fluges Ultraschalllaute
        aus, um Hindernisse zu orten.
      es: |-
        Emite ultrasonidos que utiliza como sonar para
        evitar obstáculos cuando vuela.
      it: |-
        Durante il volo emette degli ultrasuoni
        dalla bocca per localizzare gli ostacoli
        sul suo percorso.
    lets-go-eevee:
      ja-Hrkt: |-
        くちから　ちょうおんぱを　だしながら
        とぶのは　まえに　なにが　あるのか
        しらべながら　とんでいるからだ。
      ja: |-
        口から　超音波を　出しながら
        飛ぶのは　前に　なにが　あるのか
        調べながら　飛んでいるからだ。
      ko: |-
        입에서 초음파를 내보내면서
        나는 것은 앞에 무엇이 있는지
        확인하면서 날기 때문이다.
      zh-Hant: |-
        會一邊飛行一邊從口中
        發出超音波，這麼做是為了
        在飛行時探查前方有什麼東西。
      zh-Hans: |-
        由于需要调查前方的
        状况，它会一边从嘴里
        发出超音波一边飞行。
      en: |-
        Emits ultrasonic cries while it flies. They act as
        a sonar used to check for objects in its way.
      fr: |-
        Il émet des ultrasons pour se diriger et
        éviter les obstacles sur son trajet.
      de: |-
        Zubat stößt während des Fluges Ultraschalllaute
        aus, um Hindernisse zu orten.
      es: |-
        Emite ultrasonidos que utiliza como sonar para
        evitar obstáculos cuando vuela.
      it: |-
        Durante il volo emette degli ultrasuoni
        dalla bocca per localizzare gli ostacoli
        sul suo percorso.
    sword:
      ja-Hrkt: |-
        くちから　だす　ちょうおんぱで
        まわりの　ようすを　さぐる。　せまい
        どうくつも　きように　とびまわる。
      ja: |-
        口から　出す　超音波で
        まわりの　様子を　探る。
        狭い　洞窟も　器用に　飛びまわる。
      ko: |-
        입에서 내보내는 초음파로
        주위의 상황을 살핀다. 좁은
        동굴에서도 능숙하게 날아다닌다.
      zh-Hant: |-
        會利用從口中發出的超音波
        探查周圍的狀況。在狹窄的
        洞窟裡也能靈巧地飛來飛去。
      zh-Hans: |-
        通过嘴里发出的超音波
        来探查周围的情况。就算在
        狭窄的洞窟里也能灵活地飞行。
      en: |-
        It emits ultrasonic waves from its mouth to check
        its surroundings. Even in tight caves, Zubat flies
        around with skill.
      fr: |-
        Il sonde les environs en émettant des ultrasons
        avec sa bouche, et peut ainsi se frayer un chemin
        même dans les grottes les plus étroites.
      de: |-
        Über den Mund stößt es Ultraschallwellen aus,
        um seine Umgebung zu erkunden. So kann es
        selbst in engen Höhlen geschickt umherfliegen.
      es: |-
        Emite ondas ultrasónicas por la boca para
        escrutar el entorno, lo que le permite volar con
        pericia por cuevas angostas.
      it: |-
        Sonda l’ambiente circostante emettendo
        ultrasuoni dalla bocca. In questo modo riesce
        a volteggiare agilmente anche in caverne strette.
    shield:
      ja-Hrkt: |-
        ひの　あたらない　どうくつに　すむ。
        あさになると　なかまで　あつまり
        からだを　あたためあいながら　ねる。
      ja: |-
        陽の　当たらない　洞窟に　棲む。
        朝になると　仲間で　集まり
        体を　温めあいながら　寝る。
      ko: |-
        볕이 들지 않는 동굴에 산다.
        아침이 되면 동료들끼리 모여
        서로의 온기를 나누면서 잔다.
      zh-Hant: |-
        棲息在陽光照射不到的洞窟裡。
        到了早上就會和夥伴相聚，
        一邊互相取暖一邊睡覺。
      zh-Hans: |-
        栖息在晒不到阳光的洞窟里。
        到了早晨便会和同伴聚集起来，
        一边互相取暖一边睡觉。
      en: |-
        Zubat live in caves, down where the sun’s light
        won’t reach. In the morning, they gather together
        to keep each other warm as they sleep.
      fr: |-
        Ils vivent dans les grottes où la lumière du jour
        ne perce jamais. Le matin, ils se blottissent les uns
        contre les autres pour se réchauffer et dormir.
      de: |-
        Zubat leben tief in Höhlen, wo das Sonnenlicht
        sie nicht erreicht. Bei Tagesanbruch rücken sie
        zusammen, um sich im Schlaf zu wärmen.
      es: |-
        Habitan en cuevas donde no llegan los rayos del
        sol. De día, se acurrucan unos junto a otros para
        entrar en calor mientras duermen.
      it: |-
        Vive in grotte mai rischiarate dalla luce del sole.
        Quando si fa giorno, si raggruppa con i suoi
        simili per scaldarsi mentre dorme.
