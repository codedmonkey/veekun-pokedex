    x:
      ja-Hrkt: |-
        キバは　ぬけても　つぎから　つぎに
        はえてくる。いつも　くちのなかには
        ４８ぽんの　キバが　そろっている。
      ja: |-
        キバは　抜けても　次から　次に
        生えてくる。いつも　口の中には
        ４８本の　キバが　そろっている。
      ko: |-
        이빨이 빠져도 계속해서
        자란다. 항상 입안에는
        48개의 이빨이 나 있다.
      en: |-
        If it loses a fang, a new one grows back in its
        place. There are always 48 fangs lining its mouth.
      fr: |-
        Quand il perd un croc, il en repousse un autre.
        Sa bouche est en permanence composée de 48
        dents.
      de: |-
        Verliert es einen seiner Zähne, wächst ein neuer
        nach. Es hat immer 48 Zähne in seinem Kiefer.
      es: |-
        Si pierde un colmillo, le crecerá otro en su lugar.
        Siempre tiene 48 colmillos en su boca.
      it: |-
        Se perde un dente gliene ricresce un altro. La sua
        bocca contiene sempre 48 denti.
    'y':
      ja-Hrkt: |-
        いちど　かみつくと　キバが
        ぬけるまで　ぜったいに　はなさない。
        ぬけた　キバは　すぐに　はえてくる。
      ja: |-
        一度　かみつくと　キバが
        抜けるまで　絶対に　離さない。
        抜けた　キバは　すぐに　生えてくる。
      ko: |-
        한번 물면 이빨이
        빠질 때까지 절대 놓지 않는다.
        빠진 이빨은 바로 자라난다.
      en: |-
        Once it bites down, it won’t let go until it loses its
        fangs. New fangs quickly grow into place.
      fr: |-
        Quand il mord, il ne lâche pas prise avant que
        ses crocs se brisent. Ils repoussent par la suite.
      de: |-
        Hat es einmal zugebissen, lässt es erst los, wenn es
        seine Zähne verliert, die schnell nachwachsen.
      es: |-
        Cuando muerde algo, no lo suelta hasta que pierde
        sus colmillos. Estos se regeneran rápidamente.
      it: |-
        Quando azzanna il nemico, non molla la presa finché
        non gli cadono le zanne, che però ricrescono subito.
    omega-ruby:
      ja-Hrkt: |-
        いちど　かみついたら　ぜったいに　はなさない。
        キバの　さきが　つりばり　みたいに　そりかえって
        いるので　いちど　ささると　ぬけなく　なるのだ。
      ja: |-
        一度　かみついたら　絶対に　離さない。
        キバの　先が　釣り針　みたいに　反り返って
        いるので　一度　刺さると　抜けなく　なるのだ。
      ko: |-
        한 번 물고 늘어지면 절대로 놓지 않는다.
        이빨 끝이 낚싯바늘처럼 휘어져
        있어서 한 번 들어가면 빠지지 않는다.
      en: |-
        Once Croconaw has clamped its jaws on its foe, it will
        absolutely not let go. Because the tips of its fangs are forked
        back like barbed fishhooks, they become impossible to remove
        when they have sunk in.
      fr: |-
        Une fois que Crocrodil a refermé sa mâchoire sur son ennemi,
        il est impossible de le faire lâcher prise. Ses crocs sont
        recourbés comme des hameçons et ne peuvent pas être
        retirés une fois enfoncés.
      de: |-
        Wenn Tyracroc einen Feind mit seinen Kiefern eingeklemmt
        hat, lässt es ihn nicht mehr los. Da seine Zahnspitzen wie
        Angelhaken gebogen sind, kann man sie nicht mehr entfernen,
        wenn sie sich verfangen haben.
      es: |-
        Una vez que Croconaw le ha clavado los colmillos a su presa,
        es imposible que escape porque los tiene hacia adentro como
        si fueran anzuelos. Cuando Croconaw hinca los dientes, no
        hay escapatoria.
      it: |-
        Una volta azzannato il nemico, Croconaw non molla la presa
        facilmente. Le zanne a punta ricurva all’indietro, a mo’ di
        amo da pesca, rendono impossibile estrarle quando sono
        conficcate in profondità.
    alpha-sapphire:
      ja-Hrkt: |-
        いちど　かみついたら　ぜったいに　はなさない。
        キバの　さきが　つりばり　みたいに　そりかえって
        いるので　いちど　ささると　ぬけなく　なるのだ。
      ja: |-
