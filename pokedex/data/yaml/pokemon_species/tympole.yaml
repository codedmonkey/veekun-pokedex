  flavor_text:
    black:
      en: |-
        They warn others of danger by
        vibrating their cheeks to create
        a high-pitched sound.
      fr: |-
        Il prévient ses camarades du danger en
        faisant vibrer ses joues pour générer
        un signal d’alarme très aigu.
    white:
      en: |-
        By vibrating its cheeks, it emits sound
        waves imperceptible to humans. It uses
        the rhythm of these sounds to talk.
      fr: |-
        Il fait vibrer ses joues pour émettre
        des sons imperceptibles pour l’homme.
        Il communique grâce à leur rythme.
    black-2:
      en: |-
        By vibrating its cheeks, it emits
        sound waves imperceptible to humans
        and warns others of danger.
    white-2:
      en: |-
        By vibrating its cheeks, it emits
        sound waves imperceptible to humans
        and warns others of danger.
    x:
      ja-Hrkt: |-
        ほほの　しんどうまくを　ふるわせ
        ひとには　きこえない　おんぱを　だし
        なかまたちに　きけんを　つたえる。
      ja: |-
        ほほの　振動膜を　震わせ
        人には　きこえない　音波を　だし
        仲間たちに　危険を　伝える。
      ko: |-
        볼의 진동막을 떨어
        사람에게는 들리지 않는 음파를 내어
        동료에게 위험을 전달한다.
      en: |-
        By vibrating its cheeks, it emits sound waves
        imperceptible to humans and warns others
        of danger.
      fr: |-
        Il fait vibrer ses joues pour émettre des sons
        inaudibles pour les humains et alerter ses semblables
        des dangers.
      de: |-
        Erzeugt mit seinen Wangen für Menschen
        unhörbare Schallwellen, um Artgenossen
        vor Gefahr zu warnen.
      es: |-
        Emite sonidos imperceptibles para los humanos con la
        vibración de sus mejillas y advierte de algún peligro a
        los suyos.
      it: |-
        Fa vibrare le membrane sulle guance per emettere
        onde sonore impercettibili agli umani con cui
        segnala un pericolo.
    'y':
      ja-Hrkt: |-
        ほほを　しんどうさせて　ひとには
        きこえない　おんぱを　だす。
        おんぱの　リズムで　かいわする。
      ja: |-
        ほほを　振動させて
        人には　聞こえない　音波を　出す。
        音波の　リズムで　会話する。
      ko: |-
        볼을 진동시켜서 사람에게는
        들리지 않는 음파를 낸다.
        음파의 리듬으로 대화를 나눈다.
      en: |-
        By vibrating its cheeks, it emits sound waves
        imperceptible to humans. It uses the rhythm of
        these sounds to talk.
      fr: |-
        Il fait vibrer ses joues pour émettre des sons
        imperceptibles pour l’homme. Il communique grâce
        à leur rythme.
      de: |-
        Erzeugt mit seinen Wangen für Menschen unhörbare
        Schallwellen. Es verständigt sich über den Rhythmus
        dieser Wellen.
      es: |-
        Emite sonidos imperceptibles para los humanos
        con la vibración de sus mejillas y se comunica
        con el ritmo de los mismos.
      it: |-
        Facendo vibrare le guance, emette onde sonore
        che gli uomini non sentono. Conversa al ritmo di
        queste onde.
    omega-ruby:
      ja-Hrkt: |-
        ほほの　しんどうまくを　ふるわせ
        ひとには　きこえない　おんぱを　だし
        なかまたちに　きけんを　つたえる。
      ja: |-
        ほほの　振動膜を　震わせ
        人には　きこえない　音波を　だし
        仲間たちに　危険を　伝える。
      ko: |-
        볼의 진동막을 떨어
        사람에게는 들리지 않는 음파를 내어
        동료에게 위험을 전달한다.
      en: |-
        By vibrating its cheeks, it emits sound waves
        imperceptible to humans and warns others
        of danger.
      fr: |-
        Il fait vibrer ses joues pour émettre des sons inaudibles
        pour les humains et alerter ses semblables des dangers.
      de: |-
        Erzeugt mit seinen Wangen für Menschen unhörbare
        Schallwellen, um Artgenossen vor Gefahr zu warnen.
      es: |-
        Emite sonidos imperceptibles para los humanos con la
        vibración de sus mejillas y advierte de algún peligro a
        los suyos.
      it: |-
        Fa vibrare le membrane sulle guance per emettere onde
        sonore impercettibili agli umani con cui segnala un pericolo.
    alpha-sapphire:
      ja-Hrkt: |-
        ほほを　しんどうさせて　ひとには
        きこえない　おんぱを　だす。
        おんぱの　リズムで　かいわする。
      ja: |-
        ほほを　振動させて
        人には　聞こえない　音波を　出す。
        音波の　リズムで　会話する。
      ko: |-
        볼을 진동시켜서 사람에게는
        들리지 않는 음파를 낸다.
        음파의 리듬으로 대화를 나눈다.
      en: |-
        By vibrating its cheeks, it emits sound waves
        imperceptible to humans. It uses the rhythm of
        these sounds to talk.
      fr: |-
        Il fait vibrer ses joues pour émettre des sons imperceptibles
        pour l’homme. Il communique grâce à leur rythme.
      de: |-
        Erzeugt mit seinen Wangen für Menschen unhörbare
        Schallwellen. Es verständigt sich über den Rhythmus
        dieser Wellen.
      es: |-
        Emite sonidos imperceptibles para los humanos con la
        vibración de sus mejillas y se comunica con el ritmo de los
        mismos.
      it: |-
        Facendo vibrare le guance, emette onde sonore che gli uomini
        non sentono. Conversa al ritmo di queste onde.
    sword:
      ja-Hrkt: |-
        きれいな　はもんが　ひろがる
        みずの　したでは　オタマロが
        かんだかい　こえで　ないている。
      ja: |-
        きれいな　波紋が　広がる
        水の　下では　オタマロが
        甲高い　声で　鳴いている。
      ko: |-
        아름다운 파문이 펼쳐지는
        물 아래에는 동챙이가
        날카로운 소리로 울고 있다.
      zh-Hant: |-
        如果水面上擴散開美麗的
        波紋，就代表有圓蝌蚪正在
        水面下用高昂的聲音鳴叫。
      zh-Hans: |-
        如果水面上扩散开美丽的
        波纹，就代表有圆蝌蚪正在
        水下面用高昂的声音鸣叫。
      en: |-
        Graceful ripples running across the water’s
        surface are a sure sign that Tympole are singing
        in high-pitched voices below.
      fr: |-
        Lorsqu’un Tritonde pousse des cris aigus
        sous l’eau, des ondes ravissantes se propagent
        à la surface.
      de: |-
        Man sagt, wenn auf Wasseroberflächen schöne
        Kräuselwellen zu sehen sind, liege das an
        Schallquap, die unter Wasser schrill rufen.
      es: |-
        El agudo canto de los Tympole bajo el agua
        crea hermosas ondas que se extienden por la
        superficie.
      it: |-
        Tympole canta sott’acqua con la sua voce acuta
        formando delicate increspature sulla superficie.
    shield:
      ja-Hrkt: |-
        おんぱで　なかまと　れんらくする。
        けいかいの　なきごえは　ひとや
        ほかの　ポケモンには　きこえない。
      ja: |-
        音波で　仲間と　連絡する。
        警戒の　鳴き声は　人や
        ほかの　ポケモンには　聞こえない。
      ko: |-
        음파로 동료와 연락한다.
        경계하는 울음소리는 사람이나
        다른 포켓몬에게 들리지 않는다.
      zh-Hant: |-
        透過音波來聯繫夥伴。
        人類和其他寶可夢都
        聽不見牠發出的警告聲。
      zh-Hans: |-
        通过音波来联系伙伴。
        人类和其他宝可梦都
        听不见它发出的警告声。
      en: |-
        It uses sound waves to communicate with
        others of its kind. People and other Pokémon
        species can’t hear its cries of warning.
      fr: |-
        Il communique avec ses compagnons en émettant
        des ondes. Son cri d’alerte est inaudible
        pour les humains et les autres Pokémon.
      de: |-
        Es kommuniziert mit seinen Artgenossen über
        Schallwellen. Seine Warnrufe sind für Menschen
        und andere Pokémon nicht hörbar.
      es: |-
        Se comunica con los suyos mediante ondas
        sonoras. Su grito de alerta es imperceptible para
        los humanos y el resto de los Pokémon.
      it: |-
        Comunica con i suoi simili tramite onde sonore.
        Il suo grido d’allerta è impercettibile agli esseri
        umani e agli altri Pokémon.
