    white-2:
      en: |-
        It transforms the kindness and joy
        of others into happiness, which it
        stores in its shell.
    x:
      ja-Hrkt: |-
        カラのなかに　しあわせが　たくさん
        つまっているらしく　やさしくされると
        こううんを　わけあたえる　という。
      ja: |-
        殻の中に　幸せが　たくさん
        つまっているらしく　優しくされると
        幸運を　分け与える　という。
      ko: |-
        껍질 안에 행복이 가득
        차 있어서 상냥하게 대하면
        행운을 나누어 준다고 한다.
      en: |-
        The shell seems to be filled with joy. It is said that
        it will share good luck when treated kindly.
      fr: |-
        Sa coquille est remplie de joie. On dit que s’il est
        bien traité, il porte chance.
      de: |-
        Seine Schale ist voll von Freude. Es teilt sein
        Glück, wenn man es freundlich und gut behandelt.
      es: |-
        El cascarón parece estar lleno de alegría. Dicen que
        trae buena suerte si es tratado con cariño.
      it: |-
        Il suo guscio sembra ricolmo di gioia. Si dice che
        porti fortuna se lo si tratta bene.
    'y':
      ja-Hrkt: |-
        ねている　トゲピーを　うまく
        たたせることが　できれば　しあわせに
        なれるとの　いいつたえがある。
      ja: |-
        寝ている　トゲピーを　うまく
        立たせることが　できれば　幸せに
        なれるとの　言い伝えがある。
      ko: |-
        자고 있는 토게피를 잘
        세울 수 있다면 행복해질 수
        있다는 이야기가 전해진다.
      en: |-
        A proverb claims that happiness will come to
        anyone who can make a sleeping Togepi stand up.
      fr: |-
        Un proverbe nous enseigne que le bonheur touchera
        celui qui peut faire tenir debout un Togepi endormi.
      de: |-
        Ein Sprichwort besagt, dass Glück dem widerfährt,
        dem es gelingt, ein schlafendes Togepi zu wecken.
      es: |-
        Dice el proverbio que quien despierte a un Togepi de
        su sueño, alcanzará la felicidad.
      it: |-
        Un proverbio dice che chi riuscirà a far alzare un
        Togepi dormiente sarà baciato dalla fortuna.
    omega-ruby:
      ja-Hrkt: |-
        ひとや　ポケモンが　はっしている　やさしさや
        たのしい　きもちを　エネルギーに　している。
        カラの　なかに　ためた　しあわせを　わけている。
      ja: |-
        人や　ポケモンが　発している　優しさや
        楽しい　気持ちを　エネルギーに　している。
        カラの　中に　ためた　幸せを　分けている。
      ko: |-
        사람이나 포켓몬이 발산하는 상냥함이나
        즐거운 마음을 에너지로 삼는다.
        껍질 안에 모은 행복을 나눈다.
      en: |-
        As its energy, Togepi uses the positive emotions of
        compassion and pleasure exuded by people and Pokémon.
        This Pokémon stores up feelings of happiness inside its shell,
        then shares them with others.
      fr: |-
        L’énergie de Togepi provient des émotions positives et
        du plaisir exprimé par les gens et les Pokémon.
        Ce Pokémon accumule les sentiments de bonheur dans
        sa coquille, puis les partage avec les autres.
      de: |-
        Togepi nutzt die positiven Emotionen, wie Freude und
        Mitgefühl, von Menschen und Pokémon als Energie. Dieses
        Pokémon speichert Glücksgefühle in seiner Schale und teilt
        sie mit anderen.
      es: |-
        Togepi usa los sentimientos positivos de compasión y alegría
        que desprenden las personas y los Pokémon. Este Pokémon
        almacena sentimientos de felicidad en su interior y después
        los comparte con otros.
      it: |-
        Togepi ricava la sua energia dai nobili sentimenti di affetto
        e generosità emanati dai Pokémon e dall’uomo.
        Togepi immagazzina le sensazioni di felicità dentro il suo
        guscio e le divide con gli altri.
    alpha-sapphire:
      ja-Hrkt: |-
        ひとや　ポケモンが　はっしている　やさしさや
        たのしい　きもちを　エネルギーに　している。
        カラの　なかに　ためた　しあわせを　わけている。
      ja: |-
        人や　ポケモンが　発している　優しさや
        楽しい　気持ちを　エネルギーに　している。
        カラの　中に　ためた　幸せを　分けている。
      ko: |-
        사람이나 포켓몬이 발산하는 상냥함이나
        즐거운 마음을 에너지로 삼는다.
        껍질 안에 모은 행복을 나눈다.
      en: |-
        As its energy, Togepi uses the positive emotions of
        compassion and pleasure exuded by people and Pokémon.
        This Pokémon stores up feelings of happiness inside its shell,
        then shares them with others.
      fr: |-
        L’énergie de Togepi provient des émotions positives et
        du plaisir exprimé par les gens et les Pokémon.
        Ce Pokémon accumule les sentiments de bonheur dans
        sa coquille, puis les partage avec les autres.
      de: |-
        Togepi benutzt die positiven Emotionen Freude und
        Mitgefühl von Menschen und Pokémon als Energie.
        Dieses Pokémon speichert Glücksgefühle in seiner
        Schale und teilt sie mit anderen.
      es: |-
        Togepi usa los sentimientos positivos de compasión y alegría
        que desprenden las personas y los Pokémon. Este Pokémon
        almacena sentimientos de felicidad en su interior y después
        los comparte con otros.
      it: |-
        Togepi ricava la sua energia dai nobili sentimenti di affetto
        e generosità emanati dai Pokémon e dall’uomo.
        Togepi immagazzina le sensazioni di felicità dentro il suo
        guscio e le divide con gli altri.
    sword:
      ja-Hrkt: |-
        カラのなかに　しあわせが　たくさん
        つまっているらしく　やさしくされると
        こううんを　わけあたえる　という。
      ja: |-
        殻の中に　幸せが　たくさん
        つまっているらしく　優しくされると
        幸運を　分け与える　という。
      ko: |-
        껍질 안에 행복이 가득 차 있어서
        상냥하게 대해준 사람에게
        행운을 나누어 준다고 한다.
      zh-Hant: |-
        殼內好像塞滿了許多幸福，
        據說只要溫柔地對待牠，
        牠就會把幸運分給對方。
      zh-Hans: |-
        壳内好像塞满了很多幸福，
        据说如果能温柔对待它，
        它就会把幸运分给对方。
      en: |-
        The shell seems to be filled with joy. It is said
        that it will share good luck when treated kindly.
      fr: |-
        Sa coquille est remplie de joie.
        On dit que s’il est bien traité, il porte chance.
      de: |-
        Seine Schale ist voll von Freude. Es heißt,
        wenn man es freundlich und gut behandelt,
        teile es sein Glück.
      es: |-
        El cascarón parece estar lleno de alegría. Dicen
        que trae buena suerte si se le trata con cariño.
      it: |-
        Sembra che il suo guscio sia ricolmo di felicità.
        Si dice che porti fortuna se lo si tratta bene.
    shield:
      ja-Hrkt: |-
        こううんの　シンボル。
        カラの　なかには　しあわせが
        たくさん　つまっている　という。
      ja: |-
        幸運の　シンボル。
        殻の　中には　幸せが
        たくさん　つまっている　という。
      ko: |-
        행운의 상징이다.
        껍질 안에는 행복이
        가득 담겨 있다고 한다.
      zh-Hant: |-
        好運的象徵。
        據說在牠的殼裡
        裝著滿滿的幸福。
      zh-Hans: |-
        好运的象征。
        据说在它的壳里
        装着满满的幸福。
      en: |-
        It is considered to be a symbol of good luck.
        Its shell is said to be filled with happiness.
      fr: |-
        C’est un symbole de chance.
        On dit que sa coquille est remplie de joie.
      de: |-
        Es gilt als Glücksbringer. Man sagt, seine Schale
        sei voll von purer Freude.
      es: |-
        Se lo considera un símbolo de buena suerte y,
        según se dice, su cascarón está lleno de alegría.
      it: |-
        Viene considerato un simbolo di buona fortuna.
        Si dice che il suo guscio sia ricolmo di felicità.
    legends-arceus:
      en: |-
        This ovate creature is frequently mistaken for a moving egg
        when encountered out in the fields or in the mountains.
        Its guileless smile soothes the soul.
