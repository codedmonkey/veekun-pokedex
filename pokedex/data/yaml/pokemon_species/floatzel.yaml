    black-2:
      en: |-
        It is a common sight around
        fishing ports. It is known to
        rescue people and carry off prey.
    white-2:
      en: |-
        It is a common sight around
        fishing ports. It is known to
        rescue people and carry off prey.
    x:
      ja-Hrkt: |-
        はったつした　うきぶくろで　うかぶ。
        おぼれた　ひとを　きゅうじょする
        てつだいを　している　ポケモンだ。
      ja: |-
        発達した　浮き袋で　浮かぶ。
        おぼれた　人を　救助する
        手伝いを　している　ポケモンだ。
      ko: |-
        발달한 부낭으로 뜬다.
        물에 빠진 사람을 구조하는 것을
        돕는 포켓몬이다.
      en: |-
        It floats using its well-developed flotation sac.
        It assists in the rescues of drowning people.
      fr: |-
        Il flotte grâce à sa bouée très développée. Il vole au
        secours des gens sur le point de se noyer.
      de: |-
        Es treibt mithilfe einer Art Rettungsring auf dem
        Wasser und hilft dem, der zu ertrinken droht.
      es: |-
        Nada gracias a su flotador. Ayuda en los rescates de
        gente que se está ahogando.
      it: |-
        Nuota con il suo grosso galleggiante e aiuta a
        soccorrere chi sta per annegare.
    'y':
      ja-Hrkt: |-
        すいちゅうの　えものを　おいかける
        うちに　うきぶくろが　はったつした。
        ゴムボートのように　ひとを　のせる。
      ja: |-
        水中の　獲物を　追いかける　うちに
        浮き袋が　発達した。
        ゴムボートのように　人を　乗せる。
      ko: |-
        수중의 먹이를 쫓아가는
        사이에 부낭이 발달했다.
        고무보트처럼 사람을 태운다.
      en: |-
        Its flotation sac developed as a result of pursuing
        aquatic prey. It can double as a rubber raft.
      fr: |-
        Il a développé une bouée pour poursuivre ses proies
        aquatiques. Elle fait office de canot gonflable.
      de: |-
        Da es seit jeher Beute im Wasser jagt,
        entwickelte es einen Rettungsring.
      es: |-
        Su flotador se desarrolló a raíz de perseguir presas
        acuáticas. También sirve como balsa.
      it: |-
        Il suo galleggiante, che funge da gommone, si è
        sviluppato perché caccia le prede nell’acqua.
    omega-ruby:
      ja-Hrkt: |-
        はったつした　うきぶくろで　うかぶ。
