dracovish:
  base_happiness: 50
  capture_rate: 45
  color: green
  egg_groups:
    - no-eggs
  evolution_chain: dracovish
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        ずばぬけた　きゃくりょくと　アゴの
        ちからで　こだいでは　むてきだったが
        えものを　とりつくし　ぜつめつした。
      ja: |-
        ずば抜けた　脚力と　顎の
        力で　古代では　無敵だったが
        獲物を　獲り尽くし　絶滅した。
      ko: |-
        뛰어난 다리와 턱의 힘 덕분에
        고대에는 무적이었으나
        먹이를 모두 잡아먹어버려서 멸종했다.
      zh-Hant: |-
        超乎尋常的腳力和顎力讓牠在
        古代所向無敵。但由於捕盡獵物，
        導致牠們自己也滅絕了。
      zh-Hans: |-
        超乎寻常的脚力和颚力让它在
        古代所向无敌。但由于捕尽猎物，
        导致它们自己也灭绝了。
      en: |-
        Powerful legs and jaws made it the apex predator
        of its time. Its own overhunting of its prey was
        what drove it to extinction.
      fr: |-
        La force de ses pattes et de ses mâchoires
        le rendait presque invincible, mais à trop chasser
        ses proies, celles-ci ont disparu, et lui avec.
      de: |-
        Dank der enormen Kraft seiner Beine und seines
        Kiefers war es in der Urzeit unbesiegbar, doch es
        fing seine Beute restlos weg und starb daher aus.
      es: |-
        Su excelente capacidad motriz y la fuerza de su
        mandíbula lo hacían antaño invencible, pero dar
        caza a todas sus presas propició su extinción.
      it: |-
        Anticamente era invincibile grazie all’incredibile
        potenza delle sue gambe e delle sue mascelle,
        ma si è estinto dopo aver esaurito tutte le prede.
    shield:
      ja-Hrkt: |-
        じそく６０キロを　こえる　じまんの
        きゃくりょくで　はしれるが
        すいちゅうでしか　こきゅうできない。
      ja: |-
        時速６０キロを　超える　自慢の
        脚力で　走れるが
        水中でしか　呼吸できない。
      ko: |-
        특유의 다릿심으로 시속 60km
        이상으로 달릴 수 있지만
        물속에서만 호흡할 수 있다.
      zh-Hant: |-
        雖然能用自豪的腳力
        以６０公里的時速奔跑，
        但是只能在水中呼吸。
      zh-Hans: |-
        虽然能用自豪的脚力
        以６０公里的时速奔跑，
        但是只能在水中呼吸。
      en: |-
        Its mighty legs are capable of running at
        speeds exceeding 40 mph, but this Pokémon
        can’t breathe unless it’s underwater.
      fr: |-
        Ses pattes robustes lui permettent de courir
        à plus de 60 km/h, mais en revanche, il ne peut
        respirer que sous l’eau.
      de: |-
        Seine außergewöhnlich kräftigen Beine lassen es
        zwar über 60 km/h schnell laufen, doch atmen
        kann es nur unter Wasser.
      es: |-
        Exhibe con orgullo su inmensa capacidad motriz,
        que le permite superar los 60 km/h, pero solo
        puede respirar bajo el agua.
      it: |-
        Vanta gambe molto potenti che gli permettono
        di correre a una velocità superiore a 60 km/h,
        ma può respirare solo sott’acqua.
