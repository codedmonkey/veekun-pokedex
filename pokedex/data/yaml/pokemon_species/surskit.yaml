    black-2:
      en: |-
        It appears as if it is skating on
        water. It draws prey with a sweet
        scent from the tip of its head.
    white-2:
      en: |-
        It appears as if it is skating on
        water. It draws prey with a sweet
        scent from the tip of its head.
    x:
      ja-Hrkt: |-
        ふだんは　いけに　すんでいるが
        ゆうだちの　あとには　まちなかの
        みずたまりに　すがたを　あらわす。
      ja: |-
        普段は　池に　住んでいるが
        夕立の　後には　街中の
        水たまりに　姿を　現す。
      ko: |-
        보통은 연못에서 살고 있지만
        소나기가 온 뒤에는 마을 안의
        물웅덩이에 모습을 드러낸다.
      en: |-
        They usually live on ponds, but after an evening
        shower, they may appear on puddles in towns.
      fr: |-
        Ils vivent généralement dans les étangs mais, après
        des averses passagères, on peut en trouver dans
        des flaques au milieu des villes.
      de: |-
        Normalerweise leben sie in Teichen, aber nach
        einem Schauer am Abend kann man sie auch in
        Pfützen in den Städten finden.
      es: |-
        Vive en estanques, pero cuando se desata una
        tormenta puede aparecer en los charcos que se
        forman en las ciudades.
      it: |-
        Normalmente vivono negli stagni, ma dopo un
        acquazzone è possibile trovarli anche in città,
        nelle pozzanghere.
    'y':
      ja-Hrkt: |-
        すいめんを　すべるように　あるく。
        あたまの　さきから　あまい　においを
        だして　えものを　さそう。
      ja: |-
        水面を　滑るように　歩く。
        頭の　先から　甘い　においを
        出して　獲物を　誘う。
      ko: |-
        수면을 미끄러지듯이 걷는다.
        머리끝에서 달콤한 냄새를
        내어 먹이를 끌어들인다.
      en: |-
        It appears as if it is skating on water. It draws prey
        with a sweet scent from the tip of its head.
      fr: |-
        Il semble patiner sur l’eau. Le parfum diffusé par
        le sommet de sa tête sert à attirer ses proies.
      de: |-
        Scheinbar reitet es auf dem Wasser. Es lockt seine
        Beute mit einem süßen Duft an.
      es: |-
        Parece que patina sobre el agua. Atrae a las presas
        con el suave aroma de su cabeza.
      it: |-
        Cammina a pelo d’acqua. Dall’aculeo sulla testa
        emana un dolce aroma con cui attira le prede.
    omega-ruby:
      ja-Hrkt: |-
        つまさきから　あぶらが　にじみでて　いるので
        みずの　うえを　すべる　ように　あるけるのだ。
        いけや　みずうみの　びせいぶつを　たべている。
      ja: |-
        つま先から　油が　にじみ出て　いるので
        水の　上を　滑る　ように　歩けるのだ。
        池や　湖の　微生物を　食べている。
      ko: |-
        발끝에서 기름이 배어 나와
        물 위를 미끄러지듯 걸을 수 있다.
        연못이나 호수의 미생물을 먹고 있다.
      en: |-
        From the tips of its feet, Surskit secretes an oil that enables it
        to walk on water as if it were skating. This Pokémon feeds on
        microscopic organisms in ponds and lakes.
      fr: |-
        Du bout de ses pattes, Arakdo sécrète une huile lui
        permettant de marcher sur l’eau, comme s’il glissait.
        Ce Pokémon se nourrit des organismes microscopiques
        présents dans les lacs et les étangs.
      de: |-
        Gehweiher scheidet aus seinen Zehen ein Öl aus, das es ihm
        ermöglicht, über Wasser zu gleiten. Dieses Pokémon ernährt
        sich von Mikroorganismen aus Teichen und Seen.
      es: |-
        Surskit segrega un aceite por la punta de las patas que le
        permite caminar sobre el agua como si fuera patinando. Este
        Pokémon se alimenta de microorganismos en charcas y lagos.
      it: |-
        Dalla punta delle zampe Surskit secerne un olio che gli
        consente di camminare sul pelo dell’acqua come se
        stesse pattinando. Si ciba di organismi microscopici
        in stagni e laghi.
    alpha-sapphire:
      ja-Hrkt: |-
        きけんを　かんじると　あたまの　さきっぽから
        みずあめのような　あまい　えきたいを　だす。
        これが　こうぶつの　ポケモンも　いるよ。
      ja: |-
        危険を　感じると　頭の　先っぽから
        水あめのような　甘い　液体を　出す。
        これが　好物の　ポケモンも　いるよ。
      ko: |-
        위험을 감지하면 머리끝에서
        물엿같이 달콤한 액체가 나온다.
        이것을 좋아하는 포켓몬도 있다.
      en: |-
        If Surskit senses danger, it secretes a thick, sugary syrup from
        the tip of its head. There are some Pokémon that love eating
        this syrup.
      fr: |-
        Lorsque Arakdo se sent en danger, le haut de sa tête sécrète
        un sirop épais et sucré. Certains Pokémon adorent boire
        de ce sirop.
      de: |-
        Wenn Gehweiher Gefahr wittert, scheidet es einen
        dickflüssigen Sirup aus seinem Kopf aus. Es gibt einige
        Pokémon, die ganz wild auf diesen Sirup sind.
      es: |-
        Cuando Surskit siente que hay peligro, segrega un néctar
        espeso y dulce por la cabeza. Hay Pokémon a los que les
        encanta bebérselo.
      it: |-
        In caso di pericolo Surskit secerne un fluido denso e
        zuccheroso dall’aculeo posto sulla sommità del capo.
        Esistono Pokémon che adorano cibarsi di questo fluido.
    sun:
      ja-Hrkt: |-
        すいめんを　すべるように　いどう。
        エサを　もとめて　シズクモと
        ケンカすることも　しばしば。
      ja: |-
        水面を　滑るように　移動。
        餌を　求めて　シズクモと
        ケンカすることも　しばしば。
      ko: |-
        수면을 미끄러지듯 이동한다.
        먹이를 구하고자 물거미와
        싸우는 일도 가끔씩 있다.
      zh-Hant: |-
        在水面像滑行一樣移動。
        偶爾會為了爭奪食物
        而和滴蛛打架。
      zh-Hans: |-
        在水面像滑行一样移动。
        为了寻找食物，
        几次三番和滴蛛打架。
      en: |-
        It moves as if skating on the surface of the
        water. It often fights with Dewpider over food.
      fr: |-
        Ce Pokémon se déplace en glissant à la surface
        de l’eau. Les Arakdo se chamaillent souvent
        avec les Araqua pour de la nourriture.
      de: |-
        Es scheint, als würde es übers Wasser gleiten.
        Auf der Suche nach Futter gerät es immer
        wieder mit Araqua aneinander.
      es: |-
        Se mueve como si patinara sobre el agua.
        Suele pelearse con Dewpider por la comida.
      it: |-
        Si muove scivolando sul pelo dell’acqua come
        se stesse pattinando. Spesso si scontra con
        i Dewpider per il cibo.
    moon:
      ja-Hrkt: |-
        きけんが　およぶと　あたまの　さきから
        あまいあじの　えきたいが　にじみだす。
        とりポケモンが　きらいな　あじだ。
      ja: |-
        危険が　及ぶと　頭の　先から
        甘い味の　液体が　にじみだす。
        とりポケモンが　嫌いな味だ。
      ko: |-
        위험에 처하면 머리끝에서
        달콤한 액체가 배어 나온다.
        새포켓몬이 싫어하는 맛이다.
      zh-Hant: |-
        危險來臨時，會從頭的頂端
        滲出有甜味的液體。
        是鳥寶可夢討厭的味道。
      zh-Hans: |-
        危险来临时，会从头的顶端
        渗出有甜味的液体。
        鸟宝可梦讨厌它的味道。
      en: |-
        When this Pokémon senses danger, a sweet
        fluid oozes from the tip of its head. The taste
        of it disgusts bird Pokémon.
      fr: |-
        Dès qu’il se sent en danger, le sommet de sa
        tête sécrète un liquide sucré, qui a le don de
        provoquer le dégoût chez les Pokémon oiseaux.
      de: |-
        Wittert es Gefahr, scheidet es eine süßliche
        Flüssigkeit aus seinem Kopf aus. Vogel-Pokémon
        behagt dieser Geschmack überhaupt nicht.
      es: |-
        Si se encuentra en peligro, segrega un líquido
        dulce que los Pokémon pájaro encuentran
        desagradable.
      it: |-
        Quando si sente minacciato, secerne dalla punta
        della testa un liquido dal sapore dolciastro che
        i Pokémon alati detestano.
    ultra-sun:
      ja-Hrkt: |-
        ピンチに　なると　とっきから　あまい
        しるを　だす。　これを　あつめた
        シロップは　パンにつけると　うまい。
      ja: |-
        ピンチに　なると　突起から　甘い
        汁を　出す。　これを　集めた
        シロップは　パンにつけると　美味い。
      ko: |-
        위기를 맞으면 돌기에서
        달콤한 액체가 나온다. 이것을 모은
        시럽을 빵에 바르면 맛있다.
      zh-Hant: |-
        遇到危險時會從突起的部分
        流出甜甜的汁液。把這種汁液
        製成的糖漿塗在麵包上會很可口。
      zh-Hans: |-
        如果遇到危险，就会从突起的
        地方分泌出甜汁。收集它制成糖浆，
        然后涂抹在面包上就会非常可口。
      en: |-
        If it’s in a pinch, it will secrete a sweet liquid
        from the tip of its head. Syrup made from
        gathering that liquid is tasty on bread.
      fr: |-
        En cas de danger, il sécrète un liquide sucré
        du sommet de sa tête. Le sirop fabriqué à partir
        de ce liquide est délicieux étalé sur du pain !
      de: |-
        In Gefahrensituationen scheidet es eine süße
        Flüssigkeit aus seinem Fortsatz aus. Der daraus
        hergestellte Sirup schmeckt köstlich auf Brot.
      es: |-
        Si se siente amenazado, segrega un líquido
        dulce por la cabeza. El sirope elaborado con
        ese líquido resulta delicioso untado en pan.
      it: |-
        Quando è in difficoltà, secerne un liquido dolce
        dalla punta della testa. Lo sciroppo ricavato da
        questo liquido è ottimo da spalmare sul pane.
    ultra-moon:
      ja-Hrkt: |-
        みずくさの　おおい　いけや　ぬまに
        すむ。　せいそくちも　くう　エサも　
        ちかい　シズクモと　よく　あらそう。
      ja: |-
        水草の　多い　池や　沼に
        棲む。　棲息地も　食う　エサも
        近い　シズクモと　よく　争う。
      ko: |-
        물풀이 많은 연못이나 늪에 산다.
        서식지도 먹는 먹이도 비슷한
        물거미와 자주 싸운다.
      zh-Hant: |-
        棲息在水草叢生的池塘或沼澤。
        經常和棲息地以及食物都與
        自己相近的滴蛛互相爭鬥。
      zh-Hans: |-
        栖息在水草丛生的池塘或沼泽里。
        会经常和栖息地以及食物
        都与自己相近的滴蛛争斗。
      en: |-
        It lives in ponds and marshes that feature lots
        of plant life. It often fights with Dewpider,
        whose habitat and diet are similar.
      fr: |-
        Il vit dans les lacs ou les marais où prospèrent
        les plantes hydrophiles. Il se dispute souvent
        proies et territoire avec son voisin, Araqua.
      de: |-
        Es lebt in pflanzenreichen Teichen und Sümpfen
        und streitet sich oft mit Araqua, da sie ähnliche
        Habitate haben und ähnliches Futter fressen.
      es: |-
        Vive en estanques y pantanales donde abunde
        la flora acuática y compite fieramente con los
        Dewpider por el territorio y el sustento.
      it: |-
        Vive tra le piante acquatiche di stagni e paludi.
        Spesso lotta con i Dewpider per contendersi
        il cibo e il territorio.
