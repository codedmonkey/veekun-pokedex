tangrowth:
  base_happiness: 50
  capture_rate: 30
  color: blue
  egg_groups:
    - plant
  evolution_chain: tangela
  evolves_from: tangela
  flavor_text:
    diamond:
      en: |-
        It ensnares prey by extending
        arms made of vines. Losing arms to
        predators does not trouble it.
    pearl:
      en: |-
        It ensnares prey by extending
        arms made of vines. Losing arms to
        predators does not trouble it.
    platinum:
      en: |-
        Its arms are made of plants that
        bind themselves to things. They
        grow back right away if cut.
    heartgold:
      en: |-
        When it remains still, it appears to be a
        large shrub. Unsuspecting prey that
        wander near get ensnared by its vines.
    soulsilver:
      en: |-
        Its vines grow so profusely that, in the
        warm season, you can’t even see
        its eyes.
    black:
      en: |-
        Its arms are made of plants that
        bind themselves to things. They
        grow back right away if cut.
      fr: |-
        Ses bras sont en fait des plantes
        qui s’attachent à tout ce qu’elles
        touchent et peuvent repousser.
    white:
      en: |-
        Its arms are made of plants that
        bind themselves to things. They
        grow back right away if cut.
      fr: |-
        Ses bras sont en fait des plantes
        qui s’attachent à tout ce qu’elles
        touchent et peuvent repousser.
    black-2:
      en: |-
        Even if one of its arms is eaten,
        it’s fine. The Pokémon regenerates
        quickly and will go right back to normal.
    white-2:
      en: |-
        Even if one of its arms is eaten,
        it’s fine. The Pokémon regenerates
        quickly and will go right back to normal.
    x:
      ja-Hrkt: |-
        しょくぶつの　ツルで　できた　うでを
        のばして　えものを　からめとる。
        うでを　たべられても　へっちゃら。
      ja: |-
        植物の　ツルで　できた　腕を
        伸ばして　獲物を　絡め取る。
        腕を　食べられても　へっちゃら。
      ko: |-
        식물의 덩굴로 이루어진 팔을
        늘여서 먹이를 포박한다.
        팔을 먹혀도 아무렇지도 않다.
      en: |-
        It ensnares prey by extending arms made of vines.
        Losing arms to predators does not trouble it.
      fr: |-
        Il ligote sa proie en étirant ses bras en lianes. Il ne
        craint pas de perdre un bras face à un ennemi.
      de: |-
        Es umwickelt Beute, indem es seine Arme,
        die aus Ranken bestehen, verlängert.
      es: |-
        Atrapa a su presa desplegando las ramas de sus
        brazos, que no le importa perder ante depredadores.
      it: |-
        Intrappola le prede con gli arti, che sono costituiti
        da liane. Se ne perde uno, non si turba affatto.
    'y':
      ja-Hrkt: |-
        あたたかい　きせつに　なると
        めだまも　かくれて　しまうほど
        しょくぶつの　ツルが　のびつづける。
      ja: |-
        暖かい　季節に　なると
        目玉も　隠れてしまうほど
        植物の　ツルが　伸び続ける。
      ko: |-
        따뜻한 계절이 오면
        눈이 보이지 않을 정도로
        식물의 덩굴이 계속 자란다.
      en: |-
        Its vines grow so profusely that, in the warm
        season, you can’t even see its eyes.
      fr: |-
        Lorsque vient la belle saison, ses lianes sont si
        luxuriantes qu’elles cachent ses yeux.
      de: |-
        In warmen Jahreszeiten wuchern seine Ranken
        so dicht, dass man nicht einmal mehr seine Augen
        erkennt.
      es: |-
        Cuando llega el calor, se cubre por completo con sus
        lianas y no se le pueden ver ni los ojos.
      it: |-
        Nella stagione calda, le sue liane crescono al punto
        da coprirgli gli occhi.
    omega-ruby:
      ja-Hrkt: |-
        しょくぶつの　ツルで　できた　うでを
        のばして　えものを　からめとる。
        うでを　たべられても　へっちゃら。
      ja: |-
        植物の　ツルで　できた　腕を
        伸ばして　獲物を　絡め取る。
        腕を　食べられても　へっちゃら。
      ko: |-
        식물의 덩굴로 이루어진 팔을
        늘여서 먹이를 포박한다.
        팔을 먹혀도 아무렇지도 않다.
      en: |-
        It ensnares prey by extending arms made of vines.
        Losing arms to predators does not trouble it.
      fr: |-
        Il ligote sa proie en étirant ses bras en lianes. Il ne craint pas
        de perdre un bras face à un ennemi.
      de: |-
        Es umwickelt Beute, indem es seine Arme, die aus Ranken
        bestehen, verlängert.
      es: |-
        Atrapa a su presa desplegando las ramas de sus brazos, que
        no le importa perder ante depredadores.
      it: |-
        Intrappola le prede con gli arti, che sono costituiti da liane.
        Se ne perde uno, non si turba affatto.
    alpha-sapphire:
      ja-Hrkt: |-
        あたたかい　きせつに　なると
        めだまも　かくれて　しまうほど
        しょくぶつの　ツルが　のびつづける。
      ja: |-
        暖かい　季節に　なると
        目玉も　隠れてしまうほど
        植物の　ツルが　伸び続ける。
      ko: |-
        따뜻한 계절이 오면
        눈이 보이지 않을 정도로
        식물의 덩굴이 계속 자란다.
      en: |-
        Its vines grow so profusely that, in the warm
        season, you can’t even see its eyes.
      fr: |-
        Lorsque vient la belle saison, ses lianes sont si luxuriantes
        qu’elles cachent ses yeux.
      de: |-
        In warmen Jahreszeiten wuchern seine Ranken so dicht,
        dass man nicht einmal mehr seine Augen erkennt.
      es: |-
        Cuando llega el calor, se cubre por completo con sus lianas
        y no se le pueden ver ni los ojos.
      it: |-
        Nella stagione calda, le sue liane crescono al punto da
        coprirgli gli occhi.
    sword:
      ja-Hrkt: |-
        じざいに　のびる　２ほんの　うでは
        じつは　ツルが　たばになったものと
        さいきんの　けんきゅうで　わかった。
      ja: |-
        自在に　伸びる　２本の　腕は
        じつは　ツルが　束になったものと
        最近の　研究で　わかった。
      ko: |-
        자유자재로 늘어나는 2개의 팔은
        덩굴이 뭉쳐진 것이었다는 사실이
        최근 연구로 밝혀졌다.
      zh-Hant: |-
        最近的研究發現，牠這雙
        能夠自由伸縮的手臂其實
        是由成束的藤蔓形成的。
      zh-Hans: |-
        最近的研究表明，它那
        能够自由伸长的２个手臂
        其实是由藤蔓聚集而成的。
      en: |-
        Tangrowth has two arms that it can extend as it
        pleases. Recent research has shown that these
        arms are, in fact, bundles of vines.
      fr: |-
        La science a récemment découvert que
        les deux bras qu’il peut allonger à volonté
        sont en fait des lianes entrelacées.
      de: |-
        Jüngsten Erkenntnissen zufolge bestehen seine
        zwei Arme, die es beliebig verlängern kann,
        aus gebündelten Ranken.
      es: |-
        Se ha descubierto recientemente que los dos
        brazos que estira a voluntad son en realidad
        lianas enredadas entre sí.
      it: |-
        Può estendere le braccia a piacimento.
        In seguito a recenti ricerche si è scoperto
        che sono in realtà fasci di liane.
    shield:
      ja-Hrkt: |-
        あたたかい　とちで　くらす　ものほど
        ツルの　のびが　はやい。　のびると
        みずから　ちぎって　みじかくする。
      ja: |-
        暖かい　土地で　暮らす　ものほど
        ツルの　伸びが　早い。　伸びると
        自ら　ちぎって　短くする。
      ko: |-
        따듯한 땅에서 살수록
        덩굴의 성장이 빠르다. 길어지면
        스스로 잘라내어 짧게 만든다.
      zh-Hant: |-
        棲息的地方越溫暖，藤蔓就會
        長得越快。當藤蔓變得太長時，
        就會自己扯斷它來調整長度。
      zh-Hans: |-
        栖息的地域越是温暖，藤蔓
        生长得就越快。藤蔓变长后，
        它会亲手将其扯断使其变短。
      en: |-
        Vine growth is accelerated for Tangrowth living in
        warm climates. If the vines grow long, Tangrowth
        shortens them by tearing parts of them off.
      fr: |-
        Ses lianes poussent plus rapidement s’il vit
        sous un climat chaud. Quand elles deviennent
        trop longues, il se les coupe.
      de: |-
        Je wärmer sein Lebensraum ist, desto schneller
        wachsen seine Ranken. Werden sie zu lang,
        kürzt Tangoloss sie, indem es sie abreißt.
      es: |-
        Las lianas le crecen más rápidamente si vive
        en regiones cálidas. Cuando alcanzan cierta
        longitud, se las corta.
      it: |-
        Più il territorio in cui vive è caldo, più le sue liane
        crescono velocemente. Quando si allungano
        troppo, le taglia per accorciarle.
