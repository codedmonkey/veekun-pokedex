drilbur:
  base_happiness: 50
  capture_rate: 120
  color: gray
  egg_groups:
    - ground
  evolution_chain: drilbur
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        It can dig through the ground
        at a speed of 30 mph. It could give
        a car running aboveground a good race.
      fr: |-
        Il peut creuser à plus de 50 km/h et
        faire la course avec une voiture roulant
        sur le terrain qu’il creuse.
    white:
      en: |-
        It makes its way swiftly through the soil
        by putting both claws together and
        rotating at high speed.
      fr: |-
        Il se propulse à grande vitesse sous
        la terre en joignant ses griffes et
        en tourbillonnant sur lui-même.
    black-2:
      en: |-
        By spinning its body, it can dig
        straight through the ground
        at a speed of 30 mph.
    white-2:
      en: |-
        By spinning its body, it can dig
        straight through the ground
        at a speed of 30 mph.
    x:
      ja-Hrkt: |-
        りょうての　ツメを　かさねあわせて
        からだを　こうそく　かいてんさせると
        もうスピードで　ちちゅうを　すすむ。
      ja: |-
        両手の　ツメを　重ね合わせて
        体を　高速　回転させると
        猛スピードで　地中を　進む。
      ko: |-
        양손의 손톱을 서로 겹치고
        몸을 고속 회전시키면서
        맹렬한 속도로 땅속을 헤쳐나간다.
      en: |-
        It makes its way swiftly through the soil by putting
        both claws together and rotating at high speed.
      fr: |-
        Il se propulse à grande vitesse sous la terre en
        joignant ses griffes et en tourbillonnant sur lui-même.
      de: |-
        Es führt seine beiden Klauen zusammen, dreht sich
        rapide um die eigene Achse und gräbt sich ratzfatz
        durch das Erdreich.
      es: |-
        Cuando junta las garras y comienza a dar vueltas
        frenéticas, avanza bajo tierra a gran velocidad.
      it: |-
        Sfreccia a gran velocità sotto terra, avvitandosi su
        se stesso, mentre si apre un passaggio scavando
        con le unghie.
    'y':
      ja-Hrkt: |-
        からだを　スピンさせることで
        じそく５０キロの　スピードのまま
        まっすぐ　じめんを　ほりすすむ。
      ja: |-
        体を　スピンさせることで
        時速５０キロの　スピードのまま
        まっすぐ　地面を　掘り進む。
      ko: |-
        몸을 스핀시켜서
        시속 50km의 스피드를 유지하며
        똑바로 땅을 파서 나아간다.
      en: |-
        By spinning its body, it can dig straight through the
        ground at a speed of 30 mph.
      fr: |-
        Il tourbillonne sur lui-même pour se déplacer sous
        terre. Il peut atteindre les 50 km/h en ligne droite.
      de: |-
        Es gräbt sich mit 50 km/h schnurstracks durch
        das Erdreich, indem es sich rapide um die eigene
        Achse dreht.
      es: |-
        Puede girar su cuerpo a una velocidad de 50 km/h y,
        si la mantiene, puede perforar el suelo y atravesarlo.
      it: |-
        Quando gira su se stesso, scava la terra scendendo
        in verticale alla velocità di 50 km/h.
    omega-ruby:
      ja-Hrkt: |-
        りょうての　ツメを　かさねあわせて
        からだを　こうそく　かいてんさせると
        もうスピードで　ちちゅうを　すすむ。
      ja: |-
        両手の　ツメを　重ね合わせて
        体を　高速　回転させると
        猛スピードで　地中を　進む。
      ko: |-
        양손의 손톱을 서로 겹치고
        몸을 고속 회전시키면서
        맹렬한 속도로 땅속을 헤쳐나간다.
      en: |-
        It makes its way swiftly through the soil by putting
        both claws together and rotating at high speed.
      fr: |-
        Il se propulse à grande vitesse sous la terre en joignant
        ses griffes et en tourbillonnant sur lui-même.
      de: |-
        Es führt seine beiden Klauen zusammen, dreht sich rapide um
        die eigene Achse und gräbt sich ratzfatz durch das Erdreich.
      es: |-
        Cuando junta las garras y comienza a dar vueltas frenéticas,
        avanza bajo tierra a gran velocidad.
      it: |-
        Sfreccia a gran velocità sotto terra, avvitandosi su se stesso,
        mentre si apre un passaggio scavando con le unghie.
    alpha-sapphire:
      ja-Hrkt: |-
        からだを　スピンさせることで
        じそく５０キロの　スピードのまま
        まっすぐ　じめんを　ほりすすむ。
      ja: |-
        体を　スピンさせることで
        時速５０キロの　スピードのまま
        まっすぐ　地面を　掘り進む。
      ko: |-
        몸을 스핀시켜서
        시속 50km의 스피드를 유지하며
        똑바로 땅을 파서 나아간다.
      en: |-
        By spinning its body, it can dig straight through the
        ground at a speed of 30 mph.
      fr: |-
        Il tourbillonne sur lui-même pour se déplacer sous terre.
        Il peut atteindre les 50 km/h en ligne droite.
      de: |-
        Es gräbt sich mit 50 km/h schnurstracks durch das Erdreich,
        indem es sich rapide um die eigene Achse dreht.
      es: |-
        Puede girar su cuerpo a una velocidad de 50 km/h y, si la
        mantiene, puede perforar el suelo y atravesarlo.
      it: |-
        Quando gira su se stesso, scava la terra scendendo in verticale
        alla velocità di 50 km/h.
    sword:
      ja-Hrkt: |-
        りょうての　ツメを　かさねあわせ
        からだを　こうそくかいてん　させると
        えもの　めがけて　つっこむのだ。
      ja: |-
        両手の　ツメを　重ね合わせ
        体を　高速回転　させると
        獲物　めがけて　突っ込むのだ。
      ko: |-
        양손의 손톱을 서로 겹치고
        몸을 고속으로 회전시킨 뒤
        먹이를 향해 돌진한다.
      zh-Hant: |-
        會將雙掌上的爪子併攏，
        並讓身體高速旋轉，
        瞄準獵物衝過去。
      zh-Hans: |-
        会将双掌上的爪子并拢，
        并让身体高速旋转，
        瞄准猎物冲过去。
      en: |-
        It brings its claws together and whirls around at
        high speed before rushing toward its prey.
      fr: |-
        Il fonce sur ses proies en joignant ses griffes
        et en tourbillonnant sur lui-même.
      de: |-
        Es führt seine beiden Klauen zusammen, dreht
        sich rapide um die eigene Achse und stürzt sich
        auf seine Beute.
      es: |-
        Tras juntar las garras, se abalanza sobre su presa
        haciendo rotar el cuerpo a gran velocidad.
      it: |-
        Congiunge le unghie e si avvita su se stesso
        a gran velocità per poi lanciarsi sulla preda.
    shield:
      ja-Hrkt: |-
        ツメで　ちちゅうを　ほりすすむので
        そだてた　やさいが　いたむと
        のうぎょうかんけいしゃは　きらう。
      ja: |-
        ツメで　地中を　掘り進むので
        育てた　野菜が　傷むと
        農業関係者は　嫌う。
      ko: |-
        손톱으로 땅속을 파고 다니면서
        키우는 채소를 해치기 때문에
        농업 종사자들이 싫어한다.
      zh-Hant: |-
        會用爪子在地底挖掘前進。
        一些農民因為擔心牠會
        因此糟蹋蔬菜而討厭牠。
      zh-Hans: |-
        会用爪子在地底挖掘前进。
        一些农民因为担心它会
        因此糟蹋蔬菜而讨厌它。
      en: |-
        It’s a digger, using its claws to burrow through the
        ground. It causes damage to vegetable crops, so
        many farmers have little love for it.
      fr: |-
        Les cultivateurs le détestent, car il abîme leurs
        légumes en creusant la terre avec ses griffes.
      de: |-
        Ein Pokémon, das sich bei Landwirten mäßiger
        Beliebtheit erfreut, da es beim Graben durchs
        Erdreich gelegentlich ihre Ernten ruiniert.
      es: |-
        Su costumbre de horadar túneles bajo tierra le
        ha granjeado la antipatía de los agricultores,
        ya que puede echar a perder cosechas enteras.
      it: |-
        Non è ben visto dagli agricoltori per la sua
        abitudine di scavare cunicoli sottoterra
        con le unghie, rovinando gli ortaggi.
