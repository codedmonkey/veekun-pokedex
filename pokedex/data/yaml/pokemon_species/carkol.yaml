carkol:
  base_happiness: 50
  capture_rate: 120
  color: black
  egg_groups:
    - mineral
  evolution_chain: rolycoly
  evolves_from: rolycoly
  flavor_text:
    sword:
      ja-Hrkt: |-
        たいないで　せきたんを　つくりだす。
        むかしの　ガラルでは　おとした
        せきたんを　せいかつに　りようした。
      ja: |-
        体内で　石炭を　つくりだす。
        昔の　ガラルでは　落とした
        石炭を　生活に　利用した。
      ko: |-
        체내에서 석탄을 만들어 낸다.
        과거의 가라르에서는 떨어뜨린
        석탄을 생활에 이용했다.
      zh-Hant: |-
        能在體內製造煤炭。
        在過去，伽勒爾人曾經用
        牠身上掉下來的煤炭生活。
      zh-Hans: |-
        能在体内制造煤炭。
        在过去，伽勒尔人曾经用
        它身上掉下来的煤炭生活。
      en: |-
        It forms coal inside its body. Coal dropped by
        this Pokémon once helped fuel the lives of
        people in the Galar region.
      fr: |-
        Il produit du charbon dans son corps. Jadis, les
        habitants de Galar ramassaient ce charbon au sol
        et s’en servaient pour leurs besoins quotidiens.
      de: |-
        Es produziert Steinkohle in seinem Körper.
        Die von ihm abfallende Kohle wurde früher in
        der Galar-Region fürs tägliche Leben genutzt.
      es: |-
        Forma carbón en el interior de su cuerpo. Los
        antiguos habitantes de Galar lo aprovechaban
        para sus labores diarias.
      it: |-
        Gli antichi abitanti di Galar usavano il carbone
        prodotto da questo Pokémon all’interno del suo
        corpo per le loro necessità quotidiane.
    shield:
      ja-Hrkt: |-
        あしを　こうそくで　かいてんさせて
        じそく３０キロで　はしる。　せっし
        １０００どの　ほのおを　ふきだす。
      ja: |-
        脚を　高速で　回転させて
        時速３０キロで　走る。　摂氏
        １０００度の　炎を　噴き出す。
      ko: |-
        다리를 고속으로 회전시켜
        시속 30km로 달린다.
        섭씨 1000도의 불꽃을 내뿜는다.
      zh-Hant: |-
        能透過高速旋轉自己的腳，
        以３０公里的時速奔跑。
        能噴出攝氏１０００度的火焰。
      zh-Hans: |-
        能通过高速旋转自己的脚，
        以３０公里的时速奔跑。
        能喷出１０００度的火焰。
      en: |-
        By rapidly rolling its legs, it can travel at over
        18 mph. The temperature of the flames it
        breathes exceeds 1,800 degrees Fahrenheit.
      fr: |-
        Il peut faire tourner ses pattes très vite
        pour se déplacer à une vitesse de 30 km/h.
        Il peut aussi souffler des flammes à 1 000 °C.
      de: |-
        Es dreht seine Füße mit hoher Geschwindigkeit
        und kann sich dadurch bis zu 30 km/h schnell
        bewegen. Es speit 1 000 ºC heiße Flammen.
      es: |-
        Gira las patas a gran velocidad para correr a
        unos 30 km/h. Emite llamas a una temperatura
        de 1000 °C.
      it: |-
        Corre a 30 km/h facendo girare velocemente
        le zampe. Emette fiamme a 1.000 ºC.
