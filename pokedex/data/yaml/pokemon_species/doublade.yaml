doublade:
  base_happiness: 50
  capture_rate: 90
  color: brown
  egg_groups:
    - mineral
  evolution_chain: honedge
  evolves_from: honedge
  flavor_text:
    x:
      ja-Hrkt: |-
        しんかして　２ほんに　ぶんれつした。
        テレパシーで　かいわして　れんけい
        こうげきで　てきを　きりきざむ。
      ja: |-
        進化して　２本に　分裂した。
        テレパシーで　会話して
        連係攻撃で　敵を　切り刻む。
      ko: |-
        진화하여 2자루로 분열되었다.
        텔레파시로 서로 대화하며
        연계 공격으로 적을 조각낸다.
      en: |-
        When Honedge evolves, it divides into two swords,
        which cooperate via telepathy to coordinate attacks
        and slash their enemies to ribbons.
      fr: |-
        En évoluant, Monorpale se divise en deux épées qui
        communiquent par télépathie pour mieux découper
        leur adversaire en morceaux.
      de: |-
        Bei seiner Entwicklung hat es sich in zwei Schwerter
        geteilt. Es begegnet seinen Gegnern mit Attacken,
        die es mittels Telepathie koordiniert.
      es: |-
        Al evolucionar se divide en dos espadas.
        Se comunican entre sí mediante telepatía y
        coordinan los ataques para rebanar al enemigo.
      it: |-
        Sdoppiatesi con l’evoluzione, le due parti comunicano
        telepaticamente per lanciarsi in un attacco coordinato.
    'y':
      ja-Hrkt: |-
        ２ほんの　つるぎによる　ふくざつな
        れんぞく　こうげきを　ふせぐことは
        けんの　たつじんでも　ふかのうだ。
      ja: |-
        ２本の　剣による
        複雑な　連続攻撃を　防ぐことは
        剣の　達人でも　不可能だ。
      ko: |-
        2자루의 검에 의한 복잡한
        연속 공격을 막는 것은
        검의 달인일지라도 불가능하다.
      en: |-
        The complex attack patterns of its two swords
        are unstoppable, even for an opponent
        greatly accomplished at swordplay.
      fr: |-
        Même les sabreurs chevronnés sont incapables
        de parer les assauts continus et complexes menés
        de concert par ces deux épées.
      de: |-
        Nicht einmal ein Meister des Schwertkampfs kann
        den komplizierten aufeinanderfolgenden Angriffen
        der zwei Schwerter ausweichen.
      es: |-
        Ni siquiera el espadachín más ducho conseguiría
        esquivar los complejos ataques que encadenan
        ambas espadas a la vez.
      it: |-
        I fendenti vorticosi e velocissimi delle due spade
        possono mettere in ginocchio anche gli spadaccini
        più esperti.
    omega-ruby:
      ja-Hrkt: |-
        しんかして　２ほんに　ぶんれつした。
        テレパシーで　かいわして　れんけい
        こうげきで　てきを　きりきざむ。
      ja: |-
        進化して　２本に　分裂した。
        テレパシーで　会話して
        連係攻撃で　敵を　切り刻む。
      ko: |-
        진화하여 2자루로 분열되었다.
        텔레파시로 서로 대화하며
        연계 공격으로 적을 조각낸다.
      en: |-
        When Honedge evolves, it divides into two swords,
        which cooperate via telepathy to coordinate attacks
        and slash their enemies to ribbons.
      fr: |-
        En évoluant, Monorpale se divise en deux épées qui
        communiquent par télépathie pour mieux découper
        leur adversaire en morceaux.
      de: |-
        Bei seiner Entwicklung hat es sich in zwei Schwerter geteilt.
        Es begegnet seinen Gegnern mit Attacken, die es mittels
        Telepathie koordiniert.
      es: |-
        Al evolucionar se divide en dos espadas. Se comunican entre
        sí mediante telepatía y coordinan los ataques para rebanar al
        enemigo.
      it: |-
        Sdoppiatesi con l’evoluzione, le due parti comunicano
        telepaticamente per lanciarsi in un attacco coordinato.
    alpha-sapphire:
      ja-Hrkt: |-
        ２ほんの　つるぎによる　ふくざつな
        れんぞく　こうげきを　ふせぐことは
        けんの　たつじんでも　ふかのうだ。
      ja: |-
        ２本の　剣による
        複雑な　連続攻撃を　防ぐことは
        剣の　達人でも　不可能だ。
      ko: |-
        2자루의 검에 의한 복잡한
        연속 공격을 막는 것은
        검의 달인일지라도 불가능하다.
      en: |-
        The complex attack patterns of its two swords
        are unstoppable, even for an opponent
        greatly accomplished at swordplay.
      fr: |-
        Même les sabreurs chevronnés sont incapables de parer
        les assauts continus et complexes menés de concert
        par ces deux épées.
      de: |-
        Nicht einmal ein Meister des Schwertkampfs kann
        den komplizierten aufeinanderfolgenden Angriffen
        der zwei Schwerter ausweichen.
      es: |-
        Ni siquiera el espadachín más ducho conseguiría esquivar los
        complejos ataques que encadenan ambas espadas a la vez.
      it: |-
        I fendenti vorticosi e velocissimi delle due spade possono
        mettere in ginocchio anche gli spadaccini più esperti.
    sword:
      ja-Hrkt: |-
        しんかして　ふたごに　なった。
        やいばを　こすりあわせて　ならす
        きんぞくおんで　あいてを　いかく。
      ja: |-
        進化して　双子に　なった。
        刃を　擦り合わせて　鳴らす
        金属音で　相手を　威嚇。
      ko: |-
        진화해서 쌍둥이가 되었다.
        칼날을 맞부딪혀서 내는
        금속음으로 상대를 위협한다.
      zh-Hant: |-
        進化之後變成了雙胞胎。
        用互相摩擦劍刃發出的
        聲音來威嚇對手。
      zh-Hans: |-
        进化之后变成了双胞胎。
        用互相摩擦剑刃发出的
        金属音来威吓对手。
      en: |-
        Honedge evolves into twins. The two blades
        rub together to emit a metallic sound that
        unnerves opponents.
      fr: |-
        Il s’est dédoublé en évoluant.
        Il intimide ses ennemis à grands coups de bruits
        métalliques en entrechoquant ses deux lames.
      de: |-
        Bei der Entwicklung hat es sich verdoppelt. Es
        reibt seine Klingen aneinander, um Gegner mit
        einem metallenen Geräusch einzuschüchtern.
      es: |-
        Su espada se duplicó durante su proceso de
        evolución. Intimida a los rivales con el chirrido
        metálico que produce al frotar ambas hojas.
      it: |-
        Si è duplicato con l’evoluzione. Minaccia
        l’avversario con il suono metallico che
        produce sfregando le sue due lame.
    shield:
      ja-Hrkt: |-
        ２ほんの　つるぎは　こうげきと
        ぼうぎょが　めまぐるしく　いれかわる
        せんぽうで　えものを　しとめる。
      ja: |-
        ２本の　剣は　攻撃と
        防御が　目まぐるしく　入れ替わる
        戦法で　獲物を　しとめる。
      ko: |-
        2자루의 검이 공격과 방어를
        어지러울 정도로 빠르게 바꾸는
        전법으로 먹이의 숨통을 끊는다.
      zh-Hant: |-
        ２把劍會用令人眼花繚亂的
        速度不斷交替攻擊和防禦，
        藉以制服獵物。
      zh-Hans: |-
        ２把剑会用令人眼花缭乱的
        速度不断交替攻击和防御，
        借以制服猎物。
      en: |-
        The two swords employ a strategy of rapidly
        alternating between offense and defense to
        bring down their prey.
      fr: |-
        Ses deux lames abattent leurs proies
        en enchaînant les attaques et les parades
        à un rythme effréné.
      de: |-
        Seine zwei Schwerter wechseln sich in einer
        hektischen Aufeinanderfolge von Angriff und
        Verteidigung ab, um seine Beute zu erlegen.
      es: |-
        Su táctica para abatir a las presas consiste en
        alternar ataque y defensa de forma frenética
        entre ambas espadas.
      it: |-
        Le due spade abbattono la preda alternando
        mosse di attacco e di difesa a un ritmo
        vertiginoso.
