copperajah:
  base_happiness: 50
  capture_rate: 90
  color: green
  egg_groups:
    - ground
    - mineral
  evolution_chain: cufant
  evolves_from: cufant
  flavor_text:
    sword:
      ja-Hrkt: |-
        みどりのひふは　みずにも　つよい。
        むかし　ほかのとちから　やってきて
        ひとと　いっしょに　はたらいた。
      ja: |-
        緑の皮膚は　水にも　強い。
        昔　ほかの土地から　やってきて
        人と　いっしょに　働いた。
      ko: |-
        녹색 피부는 물에도 강하다.
        오래전에 다른 지방에서 오게 되어
        사람과 함께 일했다.
      zh-Hant: |-
        綠色的皮膚非常耐水。
        在很久以前從其他地區過來，
        之後便一直與人類一起工作。
      zh-Hans: |-
        绿色的皮肤非常耐水。
        在很久以前从其他地区过来，
        之后便一直与人类一起工作。
      en: |-
        They came over from another region long
        ago and worked together with humans.
        Their green skin is resistant to water.
      fr: |-
        Sa peau verte résiste bien à l’eau.
        Il s’est installé dans la région il y a longtemps
        et a travaillé en coopération avec les Hommes.
      de: |-
        Seine grüne Haut ist wasserresistent. Es kam
        vor langer Zeit aus einer anderen Region und
        verrichtete mit den Menschen Arbeiten.
      es: |-
        Su piel verdosa es resistente al agua. Proviene
        de tierras lejanas y presta ayuda a las personas
        en la realización de ciertos trabajos.
      it: |-
        La sua pelle verde è resistente all’acqua.
        Originario di un’altra regione, è giunto a Galar
        in passato per lavorare insieme agli esseri umani.
    shield:
      ja-Hrkt: |-
        むれを　つくって　くらしている。
        はなの　あくりょくは　おおいわも
        こなごなに　くだくほど　つよい。
      ja: |-
        群れを　つくって　暮らしている。
        鼻の　握力は　大岩も
        粉々に　砕くほど　強い。
      ko: |-
        무리를 지어 생활한다.
        코의 악력은 큰 바위도
        산산이 부술 정도로 강하다.
      zh-Hant: |-
        群居的寶可夢。
        鼻子的握力十分強勁，
        甚至能把大石頭弄得粉碎。
      zh-Hans: |-
        群居的宝可梦。
        鼻子的握力十分强劲，
        甚至能把大石头弄得粉碎。
      en: |-
        These Pokémon live in herds. Their trunks have
        incredible grip strength, strong enough to crush
        giant rocks into powder.
      fr: |-
        Ces Pokémon vivent en troupeau.
        L’étreinte de leur trompe est si forte qu’elle suffit
        à réduire un rocher en poussière.
      de: |-
        Diese Pokémon leben in Herden. Drücken sie mit
        ihren kräftigen Rüsseln zu, können sie selbst
        massive Felsen zu Staub zermahlen.
      es: |-
        Viven en manadas. La fuerza prensil de su trompa
        es tan extraordinaria que le permite hacer añicos
        incluso grandes rocas.
      it: |-
        Vive in gruppo. La stretta della sua proboscide
        è così forte da mandare in frantumi anche le
        rocce più grandi.
