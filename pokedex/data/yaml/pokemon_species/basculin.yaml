basculin:
  base_happiness: 50
  capture_rate: 25
  color: green
  egg_groups:
    - water2
  evolution_chain: basculin
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        Red and blue Basculin get along so
        poorly, they’ll start fighting instantly.
        These Pokémon are very hostile.
      fr: |-
        Les bleus et les rouges se détestent
        cordialement et se battent dès qu’ils
        s’aperçoivent. Un Pokémon très violent.
    white:
      en: |-
        Red and blue Basculin usually do not
        get along, but sometimes members of one
        school mingle with the other’s school.
      fr: |-
        Les rouges et les bleus se détestent,
        mais il y en a toujours un ou deux
        dans un groupe de l’autre couleur.
    black-2:
      en: |-
        Red- and blue-striped Basculin are
        very violent and always fighting.
        They are also remarkably tasty.
    white-2:
      en: |-
        Red- and blue-striped Basculin are
        very violent and always fighting.
        They are also remarkably tasty.
    x:
      ja-Hrkt: |-
        とても　らんぼうで　いつも　あかと
        あおの　バスラオは　あらそっている。
        たべると　いがいと　おいしいらしい。
      ja: |-
        とても　乱暴で　いつも　あかと
        あおの　バスラオは　争っている。
        食べると　意外と　おいしいらしい。
      ko: |-
        아주 난폭하고 항상 빨강과
        파랑의 배쓰나이는 다투고 있다.
        먹으면 의외로 맛있다고 한다.
      en: |-
        Red- and blue-striped Basculin are very violent and
        always fighting. They are also remarkably tasty.
      fr: |-
        Les rouges et les bleus se détestent et se battent
        dès qu’ils s’aperçoivent. Un Pokémon violent mais
        délicieux.
      de: |-
        Sie gelten als Delikatesse. Aufgrund ihrer brutalen
        Natur liegen rot und blau gestreifte Exemplare
        immer im Clinch.
      es: |-
        Los de color azul y los de color rojo siempre se
        pelean. Son muy violentos, pero su sabor es
        excepcional.
      it: |-
        I Basculin con la linea rossa e quelli con la linea
        blu sono molto violenti e litigano spesso.
    'y':
      ja-Hrkt: |-
        あかと　あおの　バスラオは　なかが
        わるいが　なぜか　いろの　ちがう
        こたいが　むれに　まぎれこんでいる。
      ja: |-
        赤と　青の　バスラオは　仲が　悪いが
        なぜか　色の　違う　個体が
        群れに　紛れこんでいる。
      ko: |-
        빨강과 파랑 배쓰나이는 사이가
        나쁨에도 불구하고 같은 무리에
        다른 색 개체가 섞여 있다.
      en: |-
        Red and blue Basculin usually do not get along,
        but sometimes members of one school mingle with
        the other’s school.
      fr: |-
        Les rouges et les bleus se détestent, mais il y en
        a toujours un ou deux dans un groupe de l’autre
        couleur.
      de: |-
        Rot gestreifte und blau gestreifte Exemplare sind
        sich feindlich gesonnen. Doch ist jeder Schwarm
        bunt gemischt.
      es: |-
        Los Basculin con la raya roja y aquellos con la raya
        azul se llevan fatal, pero algunos tienden a agruparse.
      it: |-
        I Basculin con la linea rossa e quelli con la linea blu
        non vanno d’accordo ma, chissà perché, in gruppo
        si mescolano.
    omega-ruby:
      ja-Hrkt: |-
        とても　らんぼうで　いつも　あかと
        あおの　バスラオは　あらそっている。
        たべると　いがいと　おいしいらしい。
      ja: |-
        とても　乱暴で　いつも　あかと
        あおの　バスラオは　争っている。
        食べると　意外と　おいしいらしい。
      ko: |-
        아주 난폭하고 항상 빨강과
        파랑의 배쓰나이는 다투고 있다.
        먹으면 의외로 맛있다고 한다.
      en: |-
        Red- and blue-striped Basculin are very violent and
        always fighting. They are also remarkably tasty.
      fr: |-
        Les rouges et les bleus se détestent et se battent dès qu’ils
        s’aperçoivent. Un Pokémon violent mais délicieux.
      de: |-
        Sie gelten als Delikatesse. Aufgrund ihrer brutalen Natur
        liegen rot und blau gestreifte Exemplare immer im Clinch.
      es: |-
        Los de color azul y los de color rojo siempre se pelean. Son
        muy violentos, pero su sabor es excepcional.
      it: |-
        I Basculin con la linea rossa e quelli con la linea blu sono
        molto violenti e litigano spesso.
    alpha-sapphire:
      ja-Hrkt: |-
        あかと　あおの　バスラオは　なかが
        わるいが　なぜか　いろの　ちがう
        こたいが　むれに　まぎれこんでいる。
      ja: |-
        赤と　青の　バスラオは　仲が　悪いが
        なぜか　色の　違う　個体が
        群れに　紛れこんでいる。
      ko: |-
        빨강과 파랑 배쓰나이는 사이가
        나쁨에도 불구하고 같은 무리에
        다른 색 개체가 섞여 있다.
      en: |-
        Red and blue Basculin usually do not get along,
        but sometimes members of one school mingle with
        the other’s school.
      fr: |-
        Les rouges et les bleus se détestent, mais il y en a toujours
        un ou deux dans un groupe de l’autre couleur.
      de: |-
        Rot gestreifte und blau gestreifte Exemplare sind sich feindlich
        gesonnen. Doch ist jeder Schwarm bunt gemischt.
      es: |-
        Los Basculin con la raya roja y aquellos con la raya azul se
        llevan fatal, pero algunos tienden a agruparse.
      it: |-
        I Basculin con la linea rossa e quelli con la linea blu non vanno
        d’accordo ma, chissà perché, in gruppo si mescolano.
    ultra-sun:
      ja-Hrkt: |-
        らんぼうかつ　どうもうな　ポケモン。
        あかとあおの　バスラオは　なわばりを
        めぐって　いつも　ケンカしている。
      ja: |-
        乱暴かつ　獰猛な　ポケモン。
        赤と　青の　バスラオは　縄張りを
        巡って　いつも　ケンカしている。
      ko: |-
        난폭하고 사나운 포켓몬.
        빨강과 파랑의 배쓰나이는
        영역을 두고 언제나 싸운다.
      zh-Hant: |-
        性情粗暴且凶猛的寶可夢。
        紅色和藍色的野蠻鱸魚
        總是為了爭奪地盤而打架。
      zh-Hans: |-
        是性格粗暴又凶猛的宝可梦。
        红色和蓝色的野蛮鲈鱼
        总是为了领地问题打架。
      en: |-
        Savage, violent Pokémon, red and blue Basculin
        are always fighting each other over territory.
      fr: |-
        C’est un Pokémon d’une grande férocité.
        Les Bargantua bleus et les Bargantua rouges
        se livrent une guerre territoriale sans merci.
      de: |-
        Ein wildes und brutales Pokémon. Rot gestreifte
        und blau gestreifte Barschuft tragen ständig
        Kämpfe um ihr Territorium aus.
      es: |-
        Este Pokémon tiene un carácter violento y feroz.
        Las peleas entre los de color azul y los de color
        rojo para marcar territorio son frecuentes.
      it: |-
        È un Pokémon particolarmente violento e feroce.
        I Basculin con la linea rossa e quelli con la linea
        blu litigano spesso per il territorio.
    ultra-moon:
      ja-Hrkt: |-
        らんぼう　なので　バスラオの　むれが
        あらわれた　みずうみには　ヘイガニや
        シザリガーくらいしか　いなくなるぞ。
      ja: |-
        乱暴　なので　バスラオの　群れが
        現れた　湖には　ヘイガニや
        シザリガーくらいしか　いなくなるぞ。
      ko: |-
        난폭해서 배쓰나이 무리가
        나타난 호수에는 가재군이나
        가재장군 정도밖에 남지 않게 된다.
      zh-Hant: |-
        因為性情粗暴，在野蠻鱸魚群
        出沒的湖裡，就只有龍蝦小兵
        或鐵螯龍蝦之類的能夠留下來。
      zh-Hans: |-
        因为性格粗暴，在野蛮鲈鱼群
        出现的湖里，就只有龙虾小兵
        和铁螯龙虾之类的能留下来。
      en: |-
        When a school of Basculin appears in a lake,
        everything else disappears, except for Corphish
        and Crawdaunt. That’s how violent Basculin are.
      fr: |-
        Il est si violent que tous les Pokémon
        disparaissent des lacs où un banc de Bargantua
        s’installe, à part les Écrapince et les Colhomard.
      de: |-
        Dieses Pokémon ist so brutal, dass in Seen
        neben einem Schwarm Barschuft nur noch
        Krebscorps und Krebutack bestehen können.
      es: |-
        Es tan violento que en los lagos donde aparece
        un banco de Basculin solo son capaces de
        quedarse Corphish o Crawdaunt.
      it: |-
        I Basculin sono così violenti che, quando
        arrivano in gruppo in un lago, tutti i Pokémon
        spariscono a parte i Corphish e i Crawdaunt.
    sword:
      ja-Hrkt: |-
        タフな　ファイトが　つりびとに
        だいにんき。　むだんで　いけに
        はなすので　どんどん　ふえる。
      ja: |-
        タフな　ファイトが　釣り人に
        大人気。　無断で　池に
        放すので　どんどん　増える。
      ko: |-
        힘이 세기 때문에 낚시꾼들에게
        인기가 많다. 무단으로 연못에 놓아줘서
        점점 개체 수가 늘어나고 있다.
      zh-Hant: |-
        牠上鉤時頑強的抵抗深受釣魚者
        喜愛。由於人們擅自把牠們
        放生到池塘裡，數量越來越多。
      zh-Hans: |-
        它上钩时顽强的抵抗深受垂钓者
        的喜爱。由于人们擅自把它们
        放生到池塘里，数量越来越多。
      en: |-
        Anglers love the fight this Pokémon puts up on
        the hook. And there are always more to catch—
        many people release them into lakes illicitly.
      fr: |-
        Le capturer est un défi que les Pêcheurs aiment
        relever. Ils vont jusqu’à en libérer illégalement
        dans les lacs, ce qui conduit à leur prolifération.
      de: |-
        Sie sind bei Anglern beliebt, weil sie ihnen harte
        Kämpfe liefern. Sie werden oft illegal in Teichen
        ausgesetzt, wodurch sie sich schneller verbreiten.
      es: |-
        Muy popular entre los Pescadores por su fiereza.
        Ha proliferado debido a la introducción ilegal de
        ejemplares en los lagos.
      it: |-
        È popolare tra i pescatori per le sue lotte audaci.
        Continua a proliferare perché numerosi esemplari
        vengono rilasciati nei laghi senza permesso.
    shield:
      ja-Hrkt: |-
        むかしは　しょくたくに　のぼった。
        あかすじの　バスラオの　みは
        あぶらが　おおく　わかものむき。
      ja: |-
        むかしは　食卓に　のぼった。
        赤筋の　バスラオの　身は
        脂が　多く　若者むき。
      ko: |-
        옛날에는 식탁에 올랐다.
        적색근 배쓰나이의 살코기는
        기름이 많아 젊은 층이 좋아한다.
      zh-Hant: |-
        從前也曾經登上餐桌。
        紅條紋野蠻鱸魚的肉脂肪含量高，
        適合年輕人食用。
      zh-Hans: |-
        从前也曾经登上餐桌。
        红条纹野蛮鲈鱼的肉脂肪含量高，
        适合年轻人食用。
      en: |-
        In the past, it often appeared on the dinner
        table. The meat of red-striped Basculin is on the
        fatty side, and it’s more popular with the youth.
      fr: |-
        On l’utilisait autrefois en cuisine.
        La chair grasse des Bargantua à motif rouge
        était plutôt destinée aux jeunes.
      de: |-
        Früher standen sie oft auf dem Speiseplan. Das
        Fleisch rotliniger Exemplare war wegen seines
        hohen Fettanteils bei jungen Leuten sehr beliebt.
      es: |-
        Un alimento básico de la dieta de antaño. A los
        jóvenes se les daba Basculin de raya roja por su
        alto contenido en ácidos grasos.
      it: |-
        Utilizzati in passato in cucina, i Basculin Forma
        Linearossa erano ritenuti adatti ai giovani
        per la loro carne ad alto contenuto di grassi.
