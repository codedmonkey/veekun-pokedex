    black:
      en: |-
        Its body is as hard as bedrock.
        By venting pressurized gas, it can
        launch itself like a rocket.
      fr: |-
        Son corps est dur comme la pierre
        souterraine. Il file comme une
        fusée en expulsant des gaz.
    white:
      en: |-
        Its body is as hard as bedrock.
        By venting pressurized gas, it can
        launch itself like a rocket.
      fr: |-
        Son corps est dur comme la pierre
        souterraine. Il file comme une
        fusée en expulsant des gaz.
    black-2:
      en: |-
        This pupa flies around wildly
        by venting with great force the
        gas pressurized inside its body.
    white-2:
      en: |-
        This pupa flies around wildly
        by venting with great force the
        gas pressurized inside its body.
    x:
      ja-Hrkt: |-
        がんばんのような　かたい　からだ。
        あっしゅくした　ガスを　ふんしゃして
        まるで　ロケットのように　とびだす。
      ja: |-
        岩盤のような　硬い　体。
        圧縮した　ガスを　噴射して
        まるで　ロケットのように　飛び出す。
      ko: |-
        암반 같은 단단한 몸이다.
        압축한 가스를 분사해서
        마치 로켓같이 날아간다.
      en: |-
        Its body is as hard as bedrock. By venting
        pressurized gas, it can launch itself like a rocket.
      fr: |-
        Son corps est dur comme la pierre souterraine.
        Il file comme une fusée en expulsant des gaz.
      de: |-
        Sein Körper ist hart wie Fels. Es lässt mit
        Hochdruck Gas ab, um wie eine Rakete nach
        oben zu schießen.
      es: |-
        Su cuerpo es duro como la roca. Se autopropulsa
        como un cohete soltando los gases de su interior.
      it: |-
        Il suo corpo è duro come la roccia. Riesce a muoversi
        come un razzo espellendo gas con tutta la sua forza.
    'y':
      ja-Hrkt: |-
        がんばんのような　かたい　カラに
        おおわれているが　ちからは　つよく
        あばれると　やまも　くずれてしまう。
      ja: |-
        岩盤のような　硬い　殻に
        覆われているが　力は　強く
        暴れると　山も　崩れてしまう。
      ko: |-
        암반 같은 단단한 껍질로
        둘러싸여 있지만 힘이 강해서
        난동을 부리면 산도 무너져버린다.
      en: |-
        Its shell is as hard as sheet rock, and it is also very
        strong. Its thrashing can topple a mountain.
      fr: |-
        Sa carapace est aussi dure que la pierre et il est très
        fort. Ses coups peuvent raser une montagne.
      de: |-
        Es ist sehr stark und sein Panzer ist steinhart. Setzt es
        Fuchtler ein, kann es einen Berg umstürzen.
      es: |-
        Su caparazón es duro como una piedra y muy
        resistente. Su Golpe puede derribar montañas.
      it: |-
        Fortissimo e con un guscio duro come roccia.
        Ha un Colpo capace di abbattere una montagna.
    omega-ruby:
      ja-Hrkt: |-
        たいないで　つくりだした　ガスを　あっしゅくして
        いきおいよく　ふんしゃする　ことで　とんでいく。
        こうてつに　ぶつかっても　へいきな　ボディだ。
      ja: |-
        体内で　つくりだした　ガスを　圧縮して
        勢いよく　噴射する　ことで　飛んでいく。
        鋼鉄に　ぶつかっても　平気な　ボディだ。
      ko: |-
        체내에서 만들어낸 가스를 압축하여
        기운차게 분사해서 날아간다.
        강철에 부딪혀도 멀쩡한 몸이다.
      en: |-
        Pupitar creates a gas inside its body that it compresses and
        forcefully ejects to propel itself like a jet. The body is very
        durable—it avoids damage even if it hits solid steel.
      fr: |-
        Ymphect crée un gaz dans son corps qu’il comprime
        puissamment pour se propulser, comme un avion à réaction.
        Son corps est très solide. Il ne l’endommage pas,
        même lorsqu’il frappe de l’acier trempé.
      de: |-
        Pupitar erzeugt in seinem Körper ein Gas, das es komprimiert
        und kraftvoll ausstößt, um sich wie ein Düsenflugzeug
        anzutreiben. Sein Körper ist sehr robust und er hält auch
        massivem Stahl stand.
      es: |-
        Pupitar crea un gas en su interior que comprime y expulsa
        violentamente a modo de autopropulsión. Tiene un cuerpo
        resistente que se mantiene inalterable hasta cuando se golpea
        contra duro acero.
      it: |-
        All’interno del suo corpo Pupitar genera un gas che comprime
        ed espelle con forza come il propulsore di un jet. Il suo corpo
        è estremamente resistente, anche in caso di impatto con
        acciaio massiccio.
    alpha-sapphire:
      ja-Hrkt: |-
        たいないで　つくりだした　ガスを　あっしゅくして
        いきおいよく　ふんしゃする　ことで　とんでいく。
        こうてつに　ぶつかっても　へいきな　ボディだ。
      ja: |-
        体内で　つくりだした　ガスを　圧縮して
        勢いよく　噴射する　ことで　飛んでいく。
        鋼鉄に　ぶつかっても　平気な　ボディだ。
      ko: |-
        체내에서 만들어낸 가스를 압축하여
        기운차게 분사해서 날아간다.
        강철에 부딪혀도 멀쩡한 몸이다.
      en: |-
        Pupitar creates a gas inside its body that it compresses and
        forcefully ejects to propel itself like a jet. The body is very
        durable—it avoids damage even if it hits solid steel.
      fr: |-
        Ymphect crée un gaz dans son corps qu’il comprime
        puissamment pour se propulser, comme un avion à réaction.
        Son corps est très solide. Il ne l’endommage pas,
        même lorsqu’il frappe de l’acier trempé.
      de: |-
        Pupitar erzeugt in seinem Körper ein Gas, das es komprimiert
        und kraftvoll ausstößt, um sich wie ein Düsenflugzeug
        anzutreiben. Sein Körper ist robust und hält auch Angriffen mit
        massivem Stahl stand.
      es: |-
        Pupitar crea un gas en su interior que comprime y expulsa
        violentamente a modo de autopropulsión. Tiene un cuerpo
        resistente que se mantiene inalterable hasta cuando se golpea
        contra duro acero.
      it: |-
        All’interno del suo corpo Pupitar genera un gas che comprime
        ed espelle con forza come il propulsore di un jet. Il suo corpo
        è estremamente resistente, anche in caso di impatto con
        acciaio massiccio.
    ultra-sun:
      ja-Hrkt: |-
        しんかを　まてず　あっしゅくガスで
        とびまわり　あばれて　ストレスを
        かいしょうする　めいわくな　ポケモン。
      ja: |-
        進化を　待てず　圧縮ガスで
        飛びまわり　暴れて　ストレスを
        解消する　迷惑な　ポケモン。
      ko: |-
        진화를 기다리지 못하고 압축가스로
        날아다니며 날뛰어 스트레스를
        해소하는 성가신 포켓몬.
      zh-Hant: |-
        等不及進化，就會用壓縮氣體
        四處亂飛大鬧來抒解壓力，
        是種令人頭痛的寶可夢。
      zh-Hans: |-
        它是令人头痛的宝可梦。
        不等进化完成就会利用压缩气体
        四处乱飞大闹来纾解压力。
      en: |-
        This troublesome Pokémon can’t wait to evolve,
        so it relieves its stress by wildly propelling itself
        around using compressed gas.
      fr: |-
        Impatient d’évoluer, il évacue son stress en
        libérant des gaz sous haute pression qui le
        font bondir dans tous les sens. Une vraie plaie !
      de: |-
        Es kann seine Entwicklung nicht erwarten und
        stört andere, wenn es zum Stressabbau mithilfe
        von komprimiertem Gas durch die Luft zischt.
      es: |-
        Este Pokémon está impaciente por evolucionar
        y libera tensiones expulsando gas comprimido
        con el que se propulsa. Un verdadero incordio.
      it: |-
        In attesa dell’evoluzione, sfoga la sua
        impazienza svolazzando ovunque spinto dal gas
        compresso che espelle, dando fastidio a tutti.
    ultra-moon:
      ja-Hrkt: |-
        あばれまわる　きけんな　サナギ。
        がんばんの　ような　カラの　なかでは
        つぎの　からだが　できあがりつつある。
      ja: |-
        暴れまわる　危険な　サナギ。
        岩盤の　ような　カラの　中では
        次の　身体が　できあがりつつある。
      ko: |-
        마구 날뛰는 위험한 번데기다.
        암반 같은 껍질 속에서는
        다음 몸이 만들어지고 있다.
      zh-Hant: |-
        會到處大鬧，是種很危險的蛹。
        在彷彿岩盤一般的外殼裡，
        新的身體正在逐漸成形。
      zh-Hans: |-
        会到处胡闹，相当危险的蛹。
        在岩盘一样的外壳内，
        新的身体正在逐渐成形。
      en: |-
        This dangerous pupa thrashes about. Its shell is
        as hard as bedrock, containing its gradually
        forming new body within.
      fr: |-
        Cette chrysalide est très dangereuse.
        À l’intérieur de cette carapace solide comme
        le roc, son nouveau corps se développe.
      de: |-
        Pupitar ist wild und gefährlich. In seinem
        steinharten Panzer arbeitet es an der
        Fertigstellung seines nächsten Körpers.
      es: |-
        Posee un enorme poder destructivo. Dentro de
        su caparazón duro como la roca, su cuerpo
        experimenta una metamorfosis.
      it: |-
        È una pericolosa crisalide che semina
        distruzione. All’interno del guscio duro come
        una roccia si sta formando il suo nuovo corpo.
    sword:
      ja-Hrkt: |-
        カラに　おおわれているが　じゆうに
        とびまわれる。　かたさと　はやさを
        もつので　はかいりょく　ばつぐんだ。
      ja: |-
        殻に　被われているが　自由に
        飛びまわれる。　硬さと　速さを
        もつので　破壊力　抜群だ。
      ko: |-
        껍질에 덮여 있지만 자유로이
        뛰어다닌다. 단단함과 스피드를
        지니고 있어서 파괴력이 대단하다.
      zh-Hant: |-
        被外殼覆蓋，但能自由自在地
        跳來跳去。兼具硬度與速度，
        因此破壞力超群。
      zh-Hans: |-
        被外壳覆盖，但能自由自在地
        跳来跳去。兼具硬度和速度，
        因此破坏力超群。
      en: |-
        Even sealed in its shell, it can move freely.
        Hard and fast, it has outstanding
        destructive power.
      fr: |-
        Il peut se déplacer même s’il est coincé
        dans sa coquille. Sa robustesse et sa vitesse
        lui confèrent un terrible pouvoir de destruction.
      de: |-
        Trotz seiner harten Schale kann es sich frei
        bewegen. Es ist flink und äußerst zerstörerisch.
      es: |-
        Se mueve libremente aun encerrado en la coraza.
        Su enorme poder destructivo se une a su dureza
        y rapidez.
      it: |-
        Può muoversi liberamente anche se è chiuso
        nel guscio. Resistente e rapido, ha un enorme
        potere distruttivo.
    shield:
      ja-Hrkt: |-
        さなぎだが　じっと　していない。
        がんじょうな　カラの　したでは
        すでに　てあしが　できている。
      ja: |-
        さなぎだが　じっと　していない。
        頑丈な　殻の　下では
        すでに　手足が　できている。
      ko: |-
        번데기지만 가만히 있지 않는다.
        단단한 껍질 안에는
        이미 팔다리가 만들어져 있다.
      zh-Hant: |-
        雖然是蛹卻不會呆著不動。
        在堅硬的甲殼之下
        已經長出了手腳。
      zh-Hans: |-
        虽然是蛹却不会呆着不动。
        在坚硬的甲壳之下
        已经长出了手脚。
      en: |-
        It will not stay still, even while it’s a pupa.
        It already has arms and legs under its solid shell.
      fr: |-
        Malgré son état de chrysalide, il ne reste pas
        immobile. Sous sa solide carapace, ses pattes
        sortent déjà.
      de: |-
        Obwohl es sich noch im Puppenstadium befindet,
        bewegt es sich rege. Es hat schon Arme und
        Beine unter seinem harten Panzer.
      es: |-
        No se está quieto ni aun siendo una pupa. Sus
        extremidades ya se han formado bajo su robusta
        coraza.
      it: |-
        È una crisalide ma non sta mai fermo. Gli arti
        sono già formati sotto il duro guscio.
