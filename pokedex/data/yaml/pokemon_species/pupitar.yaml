pupitar:
  base_happiness: 35
  capture_rate: 45
  color: gray
  egg_groups:
    - monster
  evolution_chain: larvitar
  evolves_from: larvitar
  flavor_text:
    gold:
      en: |-
        Its shell is as
        hard as sheet
        rock, and it isalso very strong.
        Its THRASHING can
        topple a mountain.
    silver:
      en: |-
        Even sealed in its
        shell, it can move
        freely. Hard andfast, it has out­
        standing destruc­
        tive power.
    crystal:
      en: |-
        It will not stay
        still, even while
        it's a pupa. Italready has arms
        and legs under its
        solid shell.
    ruby:
      en: |-
        PUPITAR creates a gas inside its body
        that it compresses and forcefully
        ejects to propel itself like a jet.The body is very durable - it avoids
        damage even if it hits solid steel.
    sapphire:
      en: |-
        PUPITAR creates a gas inside its body
        that it compresses and forcefully
        ejects to propel itself like a jet.The body is very durable - it avoids
        damage even if it hits solid steel.
    emerald:
      en: |-
        A PUPITAR creates a gas inside its body
        that it ejects under compression to propel
        itself like a jet. Its body can withstand
        a collision with solid steel.
    firered:
      en: |-
        Even sealed in its shell, it can move
        freely. Hard and fast, it has outstanding
