dracozolt:
  base_happiness: 50
  capture_rate: 45
  color: green
  egg_groups:
    - no-eggs
  evolution_chain: dracozolt
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        こだいでは　たくましい　かはんしんで
        むてきだったが　エサの　しょくぶつを
        たべつくしてしまい　ぜつめつした。
      ja: |-
        古代では　たくましい　下半身で
        無敵だったが　餌の　植物を
        食べつくしてしまい　絶滅した。
      ko: |-
        고대에는 튼튼한 하반신 덕분에
        무적이었으나 먹이인 식물을
        모두 먹어버려서 멸종했다.
      zh-Hant: |-
        在遠古時代曾憑藉自己強大的
        下半身而所向無敵，但因吃光了
        賴以為生的植物而滅絕了。
      zh-Hans: |-
        在远古时代曾凭借自己强大的
        下半身而所向无敌，但因吃光了
        赖以为生的植物而灭绝了。
      en: |-
        In ancient times, it was unbeatable thanks to its
        powerful lower body, but it went extinct anyway
        after it depleted all its plant-based food sources.
      fr: |-
        Jadis, la partie inférieure de son corps musclé
        le rendait invincible, mais il s’est éteint après avoir
        mangé toutes les plantes dont il se nourrissait.
      de: |-
        Dank seines kräftigen Unterkörpers war es in
        der Urzeit unbesiegbar, doch es fraß seine
        Pflanzennahrung restlos auf und starb daher aus.
      es: |-
        La robustez de su tren inferior lo hacía invencible
        en la antigüedad, pero se extinguió tras comerse
        todas las plantas de las que se nutría.
      it: |-
        Nell’antichità era invincibile grazie alla possente
        parte inferiore del corpo, ma si è estinto perché
        ha mangiato tutte le piante di cui si nutriva.
    shield:
      ja-Hrkt: |-
        しっぽの　たくましい　きんにくで
        はつでんする。　かはんしんに　くらべ
        じょうはんしんが　ちいさすぎる。
      ja: |-
        しっぽの　たくましい　筋肉で
        発電する。　下半身に　くらべ
        上半身が　小さすぎる。
      ko: |-
        꼬리의 억센 근육으로
        발전한다. 하반신에 비해
        상반신이 너무 작다.
      zh-Hant: |-
        會用尾部結實的肌肉
        發電。與下半身相比，
        上半身真的太小了。
      zh-Hans: |-
        会用尾部结实的肌肉
        发电。与下半身相比，
        上半身真的太小了。
      en: |-
        The powerful muscles in its tail generate its
        electricity. Compared to its lower body,
        its upper half is entirely too small.
      fr: |-
        Il envoie des décharges avec les muscles puissants
        de sa queue. La partie supérieure de son corps
        est trop petite par rapport à la partie inférieure.
      de: |-
        Mit den kräftigen Muskeln in seinem Schwanz
        erzeugt es Elektrizität. Sein Oberkörper ist im
        Vergleich zu seinem Unterkörper zu klein.
      es: |-
        Produce electricidad con la robusta musculatura
        de la cola. El tamaño de la parte superior del
        cuerpo palidece en comparación con la inferior.
      it: |-
        Produce elettricità con i possenti muscoli della
        coda. La parte superiore del suo corpo è troppo
        piccola se paragonata a quella inferiore.
