        its back smells stronger. The
        scent attracts other Pokémon.
    x:
      ja-Hrkt: |-
        おおきな　はなびらを　ひろげ
        たいようの　ひかりを　あびていると
        からだに　げんきが　みなぎっていく。
      ja: |-
        大きな　花びらを　広げ
        太陽の　光を　浴びていると
        体に　元気が　みなぎっていく。
      ko: |-
        큰 꽃잎을 펼쳐
        햇빛을 받고 있으면
        몸에 힘이 넘쳐흐른다.
      en: |-
        By spreading the broad petals of its flower
        and catching the sun’s rays, it fills its body
        with power.
      fr: |-
        Ses pétales lui servent à capter la lumière du soleil.
        Il peut ainsi en canaliser l’énergie.
      de: |-
        Es spreizt die breiten Blätter seiner Blüte,
        um seinen Körper mit Sonnenenergie
        zu durchfluten.
      es: |-
        Llena su cuerpo de energía con los rayos solares que
        captan los anchos pétalos de su flor.
      it: |-
        Si riempie di energia grazie ai grandi petali del fiore,
        che spalanca catturando i raggi solari.
    'y':
      ja-Hrkt: |-
        あめの　ふった　よくじつは　せなかの
        はなの　かおりが　つよまる。かおりに
        さそわれ　ポケモンが　あつまる。
      ja: |-
        雨の　降った　翌日は
        背中の　花の　香りが　強まる。
        香りに　誘われ　ポケモンが　集まる。
      ko: |-
        비가 내린 다음 날은 등의
        꽃향기가 강해진다. 향기에
        이끌려 포켓몬이 모여든다.
      en: |-
        After a rainy day, the flower on its back smells
        stronger. The scent attracts other Pokémon.
      fr: |-
        Le parfum de sa fleur se fait plus pénétrant les
        lendemains de pluie. Cela appâte les autres Pokémon.
      de: |-
        Nach einem Regentag riecht die Blume auf seinem
        Rücken intensiver. Das Aroma zieht andere
        Pokémon an.
      es: |-
        Después de un día de lluvia, la flor de su lomo tiene
        un aroma más potente y atrae a otros Pokémon.
      it: |-
        Dopo la pioggia, il fiore sul suo dorso emana un
        profumo più intenso e attira gli altri Pokémon.
    omega-ruby:
      ja-Hrkt: |-
        じゅうぶんな　えいようと　たいようの　ひかりが
        はなの　いろを　あざやかに　すると　いわれる。
        はなの　かおりは　ひとの　こころを　いやす。
      ja: |-
        十分な　栄養と　太陽の　光が
        花の　色を　鮮やかに　すると　いわれる。
        花の　香りは　人の　心を　癒す。
      ko: |-
        충분한 영양분과 태양의 빛이
        꽃의 색을 선명하게 만든다고 한다.
        꽃의 향기는 사람의 마음을 치유한다.
      en: |-
        There is a large flower on Venusaur’s back. The flower is said
        to take on vivid colors if it gets plenty of nutrition and sunlight.
        The flower’s aroma soothes the emotions of people.
      fr: |-
        Une belle fleur se trouve sur le dos de Florizarre.
        Elle prend une couleur vive lorsqu’elle est bien nourrie et bien
        ensoleillée. Le parfum de cette fleur peut apaiser les gens.
      de: |-
        Bisaflor hat eine Blume auf seinem Rücken. Wenn sie
        viel Nahrung und Sonne aufnimmt, verfärbt sie sich bunt.
        Der Duft der Blume mildert die Emotionen der Menschen.
      es: |-
        Venusaur tiene una flor enorme en el lomo que, según
        parece, adquiere unos colores muy vivos si está bien
        nutrido y le da mucho el sol. El aroma delicado de la flor
        tiene un efecto relajante en el ánimo de las personas.
      it: |-
        C’è un grande fiore sulla schiena di Venusaur. Si dice che
        i colori diventino più vividi con il giusto nutrimento e i
        raggi solari. Il suo profumo calma le reazioni emotive
        delle persone.
    alpha-sapphire:
      ja-Hrkt: |-
        じゅうぶんな　えいようと　たいようの　ひかりが
        はなの　いろを　あざやかに　すると　いわれる。
        はなの　かおりは　ひとの　こころを　いやす。
      ja: |-
        十分な　栄養と　太陽の　光が
        花の　色を　鮮やかに　すると　いわれる。
        花の　香りは　人の　心を　癒す。
      ko: |-
        충분한 영양분과 태양의 빛이
        꽃의 색을 선명하게 만든다고 한다.
        꽃의 향기는 사람의 마음을 치유한다.
      en: |-
        There is a large flower on Venusaur’s back. The flower is said
        to take on vivid colors if it gets plenty of nutrition and sunlight.
        The flower’s aroma soothes the emotions of people.
      fr: |-
        Une belle fleur se trouve sur le dos de Florizarre.
        Elle prend une couleur vive lorsqu’elle est bien nourrie et bien
        ensoleillée. Le parfum de cette fleur peut apaiser les gens.
      de: |-
        Bisaflor hat eine Blume auf seinem Rücken. Wenn sie viel
        Nahrung und Sonne aufnimmt, verfärbt sie sich bunt.
        Der Duft der Blume besänftigt die Gemüter der Menschen.
      es: |-
        Venusaur tiene una flor enorme en el lomo que, según
        parece, adquiere unos colores muy vivos si está bien
        nutrido y le da mucho el sol. El aroma delicado de la flor
        tiene un efecto relajante en el ánimo de las personas.
      it: |-
        C’è un grande fiore sulla schiena di Venusaur. Si dice che
        i colori diventino più vividi con il giusto nutrimento e i
        raggi solari. Il suo profumo calma le reazioni emotive
        delle persone.
    lets-go-pikachu:
      ja-Hrkt: |-
        せなかに　はえた　おおきな　ハナは
        たいようの　ひかりを　きゅうしゅうし
        エネルギーに　へんかん　できる。
      ja: |-
        背中に　生えた　大きな　ハナは
        太陽の　光を　吸収し
        エネルギーに　変換　できる。
      ko: |-
        등 위에 활짝 핀 큰 꽃은
        태양 빛을 흡수해서
        에너지로 변환할 수 있다.
      zh-Hant: |-
        長在背上的大花
        能夠吸收太陽光，
        並轉換成能量。
      zh-Hans: |-
        它背上开出的大花
        能够吸收太阳光
        并将其转换为能量。
      en: |-
        The flower on its back catches the sun’s rays.
        The sunlight is then absorbed and
        used for energy.
      fr: |-
        Les pétales de sa fleur dorsale absorbent les
        rayons du soleil pour les convertir en énergie.
      de: |-
        Die große Blume auf seinem Rücken absorbiert
        Sonnenlicht und kann dieses in Energie
        umwandeln.
      es: |-
        La flor que tiene en el lomo puede recoger los
        rayos solares para transformarlos en energía.
      it: |-
        Il grande fiore che ha sulla schiena può assorbire
        i raggi solari e trasformarli in energia.
    lets-go-eevee:
      ja-Hrkt: |-
        せなかに　はえた　おおきな　ハナは
        たいようの　ひかりを　きゅうしゅうし
        エネルギーに　へんかん　できる。
      ja: |-
        背中に　生えた　大きな　ハナは
        太陽の　光を　吸収し
        エネルギーに　変換　できる。
      ko: |-
        등 위에 활짝 핀 큰 꽃은
        태양 빛을 흡수해서
        에너지로 변환할 수 있다.
      zh-Hant: |-
        長在背上的大花
        能夠吸收太陽光，
        並轉換成能量。
      zh-Hans: |-
        它背上开出的大花
        能够吸收太阳光
        并将其转换为能量。
      en: |-
        The flower on its back catches the sun’s rays.
        The sunlight is then absorbed and
        used for energy.
      fr: |-
        Les pétales de sa fleur dorsale absorbent les
        rayons du soleil pour les convertir en énergie.
      de: |-
        Die große Blume auf seinem Rücken absorbiert
        Sonnenlicht und kann dieses in Energie
        umwandeln.
      es: |-
        La flor que tiene en el lomo puede recoger los
        rayos solares para transformarlos en energía.
      it: |-
        Il grande fiore che ha sulla schiena può assorbire
        i raggi solari e trasformarli in energia.
    sword:
      ja-Hrkt: |-
        たいようエネルギーを　えいようにして
        おおきなハナが　ひらく。　ひなたに
        ひきよせられるように　いどうする。
      ja: |-
        太陽エネルギーを　栄養にして
        大きな花が　開く。　日なたに
        引き寄せられるように　移動する。
      ko: |-
        태양에너지를 양분으로
        큰 꽃을 피운다. 양지를 향해
        이끌려가듯이 이동한다.
      zh-Hant: |-
        把太陽的能源當成養分，
        開出碩大的花朵。總是
        朝著有陽光的地方移動。
      zh-Hans: |-
        把太阳的能源当成养分，
        开出硕大的花朵。总是
        朝着有阳光的地方移动。
      en: |-
        Its plant blooms when it is absorbing solar
        energy. It stays on the move to seek sunlight.
      fr: |-
        Sa plante donne une grosse fleur quand
        elle absorbe les rayons du soleil. Il est toujours
        à la recherche des endroits les plus ensoleillés.
      de: |-
        Es nutzt Solarenergie als Nahrung und bringt so
        seine große Blume zum Blühen. Es geht dorthin,
        wo die Sonne scheint.
      es: |-
        La planta florece cuando absorbe energía solar,
        lo cual le obliga a buscar siempre la luz del sol.
      it: |-
        Il fiore sboccia assorbendo energia solare.
        Si muove continuamente in cerca di luce.
    shield:
      ja-Hrkt: |-
        はなから　うっとりする　かおりが
        ただよい　たたかうものの　きもちを
        なだめてしまう。
      ja: |-
        花から　うっとりする　香りが
        ただよい　戦うものの　気持ちを
        なだめてしまう。
      ko: |-
        꽃에서 황홀한 향기가
        퍼져 나와 싸우는 자의
        기분을 달래준다.
      zh-Hant: |-
        花朵散發出的迷人香味，
        能安撫激動的心情，
        甚至消弭鬥爭。
      zh-Hans: |-
        花朵散发出的迷人香味
        能安抚激动的心情，
        甚至消弭斗争。
      en: |-
        A bewitching aroma wafts from its flower.
        The fragrance becalms those engaged
        in a battle.
      fr: |-
        Une douce senteur émane de sa plante.
        Cette fragrance calme tous ceux qui sont
        engagés dans un combat.
      de: |-
        Die Blume verströmt einen zauberhaften Duft.
        Er beschwichtigt erhitzte Kämpfer.
      es: |-
        La flor que tiene en el lomo libera un delicado
        aroma, que tiene un efecto relajante en combate.
      it: |-
        Il suo fiore emana una fragranza inebriante
        capace di placare l’animo di chi è impegnato
        nella lotta.
