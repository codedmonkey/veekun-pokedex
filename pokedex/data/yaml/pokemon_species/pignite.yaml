pignite:
  base_happiness: 70
  capture_rate: 45
  color: red
  egg_groups:
    - ground
  evolution_chain: tepig
  evolves_from: tepig
  flavor_text:
    black:
      en: |-
        When its internal fire flares up, its
        movements grow sharper and faster.
        When in trouble, it emits smoke.
      fr: |-
        Quand le feu dans son corps s’embrase,
        sa vitesse et son agilité augmentent.
        En cas d’urgence, il crache de la fumée.
    white:
      en: |-
        Whatever it eats becomes fuel for the
        flame in its stomach. When it is angered,
        the intensity of the flame increases.
      fr: |-
        Ce qu’il mange devient du combustible
        pour le feu dans son estomac.
        La colère vivifie ses flammes.
    black-2:
      en: |-
        The more it eats, the more fuel it has
        to make the fire in its stomach stronger.
        This fills it with even more power.
    white-2:
      en: |-
        The more it eats, the more fuel it has
        to make the fire in its stomach stronger.
        This fills it with even more power.
    x:
      ja-Hrkt: |-
        たべるほどに　もやすものが　ふえて
        いぶくろないの　ほのおが　つよまり
        パワーも　どんどん　あふれだすのだ。
      ja: |-
        食べるほどに　燃やすものが　増えて
        胃袋内の　炎が　強まり
        パワーも　どんどん　あふれ出すのだ。
      ko: |-
        먹을수록 태울 것이 많아져
        위 속의 불꽃이 강해지고
        파워도 점점 넘치게 된다.
      en: |-
        The more it eats, the more fuel it has to make the
        fire in its stomach stronger. This fills it with even
        more power.
      fr: |-
        Plus il a mangé de Baies, plus il a de combustible,
        et il peut donc dégager davantage de flammes et
        de puissance.
      de: |-
        Je mehr es frisst, desto stärker werden
        die Flammen in seinem Magen.
        Dies führt zu rapiden Energieschüben.
      es: |-
        Cuanto más come, más combustible tiene en su interior
        para avivar sus llamas, con lo que también aumenta su
        poder.
      it: |-
        Più mangia e più le fiamme che bruciano nel suo
        stomaco si rinvigoriscono, aumentando così il suo
        potere.
    'y':
      ja-Hrkt: |-
        たいないの　ほのおが　もえあがると
        うごきの　キレと　スピードが　ます。
        ピンチになると　けむりを　ふきだす。
      ja: |-
        体内の　炎が　燃え上がると
        動きの　キレと　スピードが　増す。
        ピンチになると　煙を　噴き出す。
      ko: |-
        체내의 불꽃이 타오르면
        움직임이 더 빠르고 예리해진다.
        위급해지면 연기를 뿜어낸다.
      en: |-
        When its internal fire flares up, its movements grow
        sharper and faster. When in trouble, it emits smoke.
      fr: |-
        Quand le feu dans son corps s’embrase, sa vitesse et
        son agilité augmentent. En cas d’urgence, il crache de
        la fumée.
      de: |-
        Lodert das Feuer in ihm auf, bewegt es sich
        geschmeidiger und schneller. Bei Gefahr
        lässt es ordentlich Dampf ab.
      es: |-
        Cuando las llamas de su interior se avivan, aumenta su
        velocidad y agilidad. Emite humo si está en peligro.
      it: |-
        Quando la fiamma interna arde intensa, diventa più
        rapido e scattante. Nei momenti critici esala fumo.
    omega-ruby:
      ja-Hrkt: |-
        たべるほどに　もやすものが　ふえて
        いぶくろないの　ほのおが　つよまり
        パワーも　どんどん　あふれだすのだ。
      ja: |-
        食べるほどに　燃やすものが　増えて
        胃袋内の　炎が　強まり
        パワーも　どんどん　あふれ出すのだ。
      ko: |-
        먹을수록 태울 것이 많아져
        위 속의 불꽃이 강해지고
        파워도 점점 넘치게 된다.
      en: |-
        The more it eats, the more fuel it has to make the
        fire in its stomach stronger. This fills it with even
        more power.
      fr: |-
        Plus il a mangé de Baies, plus il a de combustible, et il peut
        donc dégager davantage de flammes et de puissance.
      de: |-
        Je mehr es frisst, desto stärker werden die Flammen in
        seinem Magen. Dies führt zu rapiden Energieschüben.
      es: |-
        Cuanto más come, más combustible tiene en su interior para
        avivar sus llamas, con lo que también aumenta su poder.
      it: |-
        Più mangia e più le fiamme che bruciano nel suo stomaco
        si rinvigoriscono, aumentando così il suo potere.
    alpha-sapphire:
      ja-Hrkt: |-
        たいないの　ほのおが　もえあがると
        うごきの　キレと　スピードが　ます。
        ピンチになると　けむりを　ふきだす。
      ja: |-
        体内の　炎が　燃え上がると
        動きの　キレと　スピードが　増す。
        ピンチになると　煙を　噴き出す。
      ko: |-
        체내의 불꽃이 타오르면
        움직임이 더 빠르고 예리해진다.
        위급해지면 연기를 뿜어낸다.
      en: |-
        When its internal fire flares up, its movements grow
        sharper and faster. When in trouble, it emits smoke.
      fr: |-
        Quand le feu dans son corps s’embrase, sa vitesse et
        son agilité augmentent. En cas d’urgence, il crache de
        la fumée.
      de: |-
        Lodert das Feuer in ihm auf, bewegt es sich geschmeidiger
        und schneller. Bei Gefahr lässt es ordentlich Dampf ab.
      es: |-
        Cuando las llamas de su interior se avivan, aumenta su
        velocidad y agilidad. Emite humo si está en peligro.
      it: |-
        Quando la fiamma interna arde intensa, diventa più rapido
        e scattante. Nei momenti critici esala fumo.
