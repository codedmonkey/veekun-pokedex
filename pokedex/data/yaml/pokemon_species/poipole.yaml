  flavor_text:
    ultra-sun:
      ja-Hrkt: |-
        いせかいに　おいては　たびだちの
        パートナーに　えらばれるほど
        したしまれている　ウルトラビースト。
      ja: |-
        異世界に　おいては　旅立ちの
        パートナーに　選ばれるほど
        親しまれている　ウルトラビースト。
      ko: |-
        다른 세계에서는 여행
        파트너로 삼을 정도로
        친근한 울트라비스트다.
      zh-Hant: |-
        在異世界是人們十分熟悉的
        究極異獸，有時甚至會被選為
        踏上旅程時的夥伴。
      zh-Hans: |-
        在异世界是亲切的究极异兽，
        甚至能被选为踏上旅程的同伴。
      en: |-
        This Ultra Beast is well enough liked to be
        chosen as a first partner in its own world.
      fr: |-
        Dans son monde, cette Ultra-Chimère est fort
        appréciée pour son naturel conciliant, qui fait
        d’elle un compagnon de voyage idéal.
      de: |-
        Diese Ultrabestie wird in der Welt, aus der sie
        kommt, so gemocht, dass sie oft als Partner für
        Reisen gewählt wird.
      es: |-
        En su mundo, este Ultraente se considera tan
        entrañable como para ser elegido compañero de
        viaje.
      it: |-
        Un’Ultracreatura talmente socievole da essere
        spesso scelta come compagno di viaggio nel
        mondo da cui proviene.
    ultra-moon:
      ja-Hrkt: |-
        いせかいに　すむ　ウルトラビースト。
        あたまの　どくばりから　どくえきを
        あいてに　かけて　ケラケラ　わらう。
      ja: |-
        異世界に　棲む　ウルトラビースト。
        頭の　毒針から　毒液を
        相手に　かけて　ケラケラ　笑う。
      ko: |-
        다른 세계에 사는 울트라비스트.
        머리의 독침에서 나온 독액을
        상대에게 끼얹고 깔깔 웃는다.
      zh-Hant: |-
        棲息在異世界的究極異獸。
        會從頭上的毒針朝對手
        噴出毒液，然後放聲大笑。
      zh-Hans: |-
        栖息在异世界的究极异兽。
        会从头部的毒针朝对手
        喷出毒液，咯咯咯大笑。
      en: |-
        An Ultra Beast that lives in a different world, it
        cackles wildly as it sprays its opponents with
        poison from the needles on its head.
      fr: |-
        Cette Ultra-Chimère venue d’un autre monde
        ricane lorsqu’elle asperge ses proies de venin
        grâce au dard qu’elle a sur la tête.
      de: |-
        Diese Ultrabestie aus einer anderen Welt
        besprüht Gegner laut lachend mit einer giftigen
        Flüssigkeit aus den Stacheln auf ihrem Kopf.
      es: |-
        Un Ultraente originario de otro mundo. Se burla
        del oponente mientras lo rocía de veneno con el
        aguijón que tiene en la cabeza.
      it: |-
        Un’Ultracreatura che vive in un altro mondo.
        Sghignazza felice quando avvelena gli avversari
        con il pungiglione che ha sul capo.
