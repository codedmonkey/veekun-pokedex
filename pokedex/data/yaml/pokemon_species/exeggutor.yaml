    sword:
      ja-Hrkt: |-
        ３つの　あたまは　べつのことを
        かんがえている。　じぶんいがいは
        あまり　きょうみがない　ようだ。
      ja: |-
        ３つの　頭は　べつのことを
        考えている。　自分以外は
        あまり　興味がない　ようだ。
      ko: |-
        3개의 머리는 서로 다른
        생각을 하고 있다. 자신 외에는
        별로 흥미가 없는 듯하다.
      zh-Hant: |-
        ３顆頭都想著不同的事。
        對自己以外的事情
        似乎都沒什麼興趣。
      zh-Hans: |-
        ３个脑袋分别在想不同的事。
        似乎对自己以外的事物
        没有什么兴趣。
      en: |-
        Each of Exeggutor’s three heads is thinking
        different thoughts. The three don’t seem to be
        very interested in one another.
      fr: |-
        Chacune de ses trois têtes pense de manière
        autonome. Elles ne semblent s’intéresser
        qu’à elles-mêmes.
      de: |-
        Jeder der drei Köpfe hat einen eigenen Willen
        und scheint sich nur für sich selbst zu
        interessieren.
      es: |-
        Cada una de las tres cabezas piensa de forma
        independiente y apenas muestra interés por el
        resto.
      it: |-
        Le sue tre teste ragionano in modo indipendente.
        Sembra che ciascuna pensi solo a sé.
    shield:
      ja-Hrkt: |-
        ３つの　あたまが　いちがんと　なって
        うつ　サイコパワーは　きょうりょく。
        そらが　くもると　うごきが　にぶる。
      ja: |-
        ３つの　頭が　一丸となって
        撃つ　サイコパワーは　強力。
        空が　曇ると　動きが　鈍る。
      ko: |-
        3개의 머리가 똘똘 뭉쳐서 쏘는
        사이코 파워는 강력하다.
        날씨가 흐리면 움직임이 둔하다.
      zh-Hant: |-
        ３顆頭團結一致發出的
        精神力量威力強大。天氣
        變陰時動作就會變得遲緩。
      zh-Hans: |-
        ３个脑袋联合起来
        能使出强大的精神力量。
        天气变阴时动作会变得迟钝。
      en: |-
        When they work together, Exeggutor’s three
        heads can put out powerful psychic energy.
        Cloudy days make this Pokémon sluggish.
      fr: |-
        Les attaques psychiques lancées par ses trois
        têtes à l’unisson sont très puissantes. Par temps
        nuageux, ses mouvements sont plus lents.
      de: |-
        Seine drei Köpfe setzen mächtige Psycho-Kräfte
        frei, wenn sie als Einheit agieren. Zieht sich der
        Himmel zu, bewegt es sich nur noch schwerfällig.
      es: |-
        Puede lanzar ataques psíquicos de gran potencia
        si sus tres cabezas se ponen de acuerdo. Cuando
