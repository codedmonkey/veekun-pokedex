    sun:
      ja-Hrkt: |-
        それぞれの　あたまに　いしが　あり
        テレパシーで　はなしあい　みんなで
        なにを　するのか　きめている。
      ja: |-
        それぞれの　頭に　意思が　あり
        テレパシーで　話し合い　みんなで
        なにを　するのか　決めている。
      ko: |-
        각각의 머리에 의지가 있어
        텔레파시로 대화하여 모두와
        무엇을 할건지 정한다.
      zh-Hant: |-
        每個腦袋各有各的思想，
        會通過心靈感應來交談，
        決定大家要做什麼。
      zh-Hans: |-
        各个脑袋里有各自的思想，
        通过心灵感应来交谈，
        决定大家要做什么。
      en: |-
        Each of its heads has its own will. They use
        telepathy to discuss their plans before coming
        to a joint decision.
      fr: |-
        Chaque tête a sa volonté propre. Toutes
        discutent ensemble par télépathie et décident
        de ce qu’elles vont faire d’un commun accord.
      de: |-
        Jeder seiner Köpfe hat einen eigenen Willen.
        Sie kommunizieren telepathisch miteinander,
        um gemeinsam Entscheidungen zu treffen.
      es: |-
        Cada una de sus cabezas piensa de forma
        individual. Para tomar decisiones, se comunican
        entre ellas telepáticamente.
      it: |-
        Le tre teste ragionano autonomamente e
        comunicano tramite telepatia per prendere
        decisioni in comune.
    moon:
      ja-Hrkt: |-
        あるじきが　くると　３つの　あたまの
        どれかが　おちる。　それが　やがて
        タマタマへと　せいちょう　していく。
      ja: |-
        ある時期が　くると　３つの　頭の
        どれかが　落ちる。　それが　やがて
        タマタマへと　成長　していく。
      ko: |-
        어느 시기가 되면 3개의 머리 중
        하나가 떨어진다. 그것이 그대로
        아라리로 성장해간다.
      zh-Hant: |-
        某個時期到來的時候，
        ３個頭的某一個便會掉落，
        不久就會成長為蛋蛋。
      zh-Hans: |-
        某个时期到来的时候，
        ３个头的某一个会掉落。
        之后不久就会成长为蛋蛋。
      en: |-
        When the time comes, one of its three heads
        falls off. Before long, the fallen head grows into
        an Exeggcute.
      fr: |-
        À un certain moment de sa vie, l’une des trois
        têtes tombe. Elle germera en un nouveau
        Noeunoeuf.
      de: |-
        Zu einer bestimmten Jahreszeit fällt einer seiner
        drei Köpfe ab. Dieser wird schließlich zu einem
        neuen Owei.
      es: |-
        En algún momento de su vida, una de sus tres
        cabezas se desprende y se transforma en un
        nuevo Exeggcute.
      it: |-
        Durante la crescita, una delle sue tre teste
        cade e dà vita a un nuovo Exeggcute.
    ultra-sun:
      ja-Hrkt: |-
        サイコパワーで　てきを　むかえうつ。
        ３つのあたま　それぞれが　ねんりきを
        はなつので　そのいりょくは　３ばいだ。
      ja: |-
        サイコパワーで　敵を　迎え撃つ。
        ３つの頭　それぞれが　念力を
        放つので　その威力は　３倍だ。
      ko: |-
        사이코 파워로 적을 대적한다.
        3개의 머리가 각각 염동력을
        발산해서 그 위력은 3배가 된다.
      zh-Hant: |-
        會用精神力量迎戰敵人。
        ３個頭會分別發出念力，
        所以威力也會變成３倍。
      zh-Hans: |-
        会用精神力量来迎击敌人。
        ３个脑袋会分别放出念力，
        所以威力也会变成３倍。
      en: |-
        It engages its enemies using psychic powers.
        Each of its three heads fires off psychokinetic
        energy, tripling its power.
      fr: |-
        Il frappe ses adversaires de ses pouvoirs
        psychiques. Comme il a trois têtes, la puissance
        de ses attaques s’en voit triplée.
      de: |-
        Gegen Feinde setzt es Psycho-Kräfte ein. Seine
        drei Köpfe greifen unabhängig voneinander an,
        wodurch sich der Gesamtangriff verdreifacht.
      es: |-
        Ataca al rival con poderes psíquicos. Como tiene
        tres cabezas, la potencia de sus ataques se ve
        triplicada.
      it: |-
        Attacca l’avversario emettendo onde
        psicocinetiche da ogni testa. La potenza
        complessiva risulta triplicata.
    ultra-moon:
      ja-Hrkt: |-
        ３つのあたまは　みな　べつの　ことを
        かんがえている。　いきたい　ほうこうが
        ちがうと　みうごきが　とれなくなる。
      ja: |-
        ３つの頭は　皆　別の　ことを
        考えている。　行きたい　方向が
        違うと　身動きが　とれなくなる。
      ko: |-
        3개의 머리는 모두 다른 생각을
        하고 있다. 가고 싶은 방향이
        다르면 움직일 수 없게 된다.
      zh-Hant: |-
        ３個頭分別想著不同的事。
        如果每個頭想去的方向不同，
        就會在原地無法動彈。
      zh-Hans: |-
        ３个脑袋分别想着不同的事情。
        如果每个脑袋想去的方向不同，
        身体就会无法动弹。
      en: |-
        Each of its three heads has its own thoughts.
        When they want to go in different directions,
        Exeggutor becomes unable to move.
      fr: |-
        Ses trois têtes pensent indépendamment.
        Si elles ne se mettent pas d’accord sur le
        chemin à emprunter, Noadkoko fait du surplace.
      de: |-
        Jeder seiner drei Köpfe hat einen eigenen Willen.
        Können sie sich nicht auf eine Richtung einigen,
        bleibt es wie angewurzelt auf der Stelle stehen.
      es: |-
        Sus tres cabezas poseen juicio propio. Si no se
        ponen de acuerdo en qué dirección tomar,
        Exeggutor se quedará plantado en el sitio.
      it: |-
        Le sue tre teste ragionano in modo indipendente.
        Quando vogliono andare in direzioni diverse,
        Exeggutor non riesce più a muoversi.
    lets-go-pikachu:
      ja-Hrkt: |-
        なきごえが　にぎやかなのは　３つある
        あたまが　それぞれ　すきなことを
        かんがえているからだ。
      ja: |-
        鳴き声が　にぎやかなのは　３つある
        頭が　それぞれ　好きなことを
        考えているからだ。
      ko: |-
        울음소리가 시끄러운 것은
        3개의 머리가 좋아하는 것에 대해
        따로따로 생각하고 있기 때문이다.
      zh-Hant: |-
        之所以會一直叫個不停，
        是因為３顆頭各自在想著
        自己喜歡的東西。
      zh-Hans: |-
        由于三个头各自都在
        思考自己喜欢的事情，
        所以它的叫声非常吵闹。
      en: |-
        Its cries are very noisy. This is because each of
        the three heads thinks about whatever it likes.
      fr: |-
        Si son cri est aussi bruyant, c’est parce que
        chacune de ses trois têtes dit ce qu’elle pense.
      de: |-
        Der Schrei dieses Pokémon ist ohrenbetäubend,
        weil jeder seiner drei Köpfe sagt, was er denkt.
      es: |-
        El estrépito que causa se debe a que cada
        una de las tres cabezas habla y actúa de forma
        independiente, sin tener en cuenta a las demás.
      it: |-
        Il suo verso chiassoso è dovuto alla confusione
        creata dalle tre teste che pensano ognuna per
        conto proprio.
    lets-go-eevee:
      ja-Hrkt: |-
        なきごえが　にぎやかなのは　３つある
        あたまが　それぞれ　すきなことを
        かんがえているからだ。
      ja: |-
