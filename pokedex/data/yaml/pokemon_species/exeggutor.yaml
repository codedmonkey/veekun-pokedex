    white-2:
      en: |-
        It is called “The Walking Jungle.”
        If a head grows too big, it falls
        off and becomes an Exeggcute.
    x:
      ja-Hrkt: |-
        ３つの　あたまは　かんがえることは
        べつべつでも　なかよし　なので
        ケンカしたり　しないらしい。
      ja: |-
        ３つの　頭は　考えることは
        別々でも　仲良しなので
        ケンカしたり　しないらしい。
      ko: |-
        3개의 머리는 생각하는 것이
        각각 다르지만 사이가 좋아서
        싸우지 않는 것 같다.
      en: |-
        Its three heads think independently. However,
        they are friendly and never appear to squabble.
      fr: |-
        Ses trois têtes sont autonomes. Elles semblent
        toutefois en harmonie et ne se disputent jamais.
      de: |-
        Seine drei Köpfe denken unabhängig voneinander.
        Dennoch sind sie nett zueinander und streiten nie.
      es: |-
        Sus tres cabezas piensan de forma independiente.
        Sin embargo, son amigas y no suelen discutir nunca.
      it: |-
        Ha tre teste che ragionano autonomamente.
        Ma sono amichevoli e non litigano mai tra di loro.
    'y':
      ja-Hrkt: |-
        あるく　ねったいうりんと　よばれる。
        おおきくなった　あたまの　ひとつが
        じめんに　おちると　タマタマになる。
      ja: |-
        歩く　熱帯雨林と　呼ばれる。
        大きくなった　頭の　ひとつが
        地面に　落ちると　タマタマになる。
      ko: |-
        걸어 다니는 열대 우림이라고
        불린다. 크게 자란 머리 중 하나가
        땅에 떨어지면 아라리가 된다.
      en: |-
        It is called “The Walking Jungle.” If a head grows
        too big, it falls off and becomes an Exeggcute.
      fr: |-
        On l’appelle « jungle sur pattes ». Si une tête devient
        trop grosse, elle tombe et produit un Noeunoeuf.
      de: |-
        Man nennt es den „Laufenden Dschungel“. Wird ein
        Kopf zu groß, fällt er ab und wird zu einem Owei.
      es: |-
        Se le llama la Selva Andante. Si una cabeza crece
        demasiado, se cae y forma un Exeggcute.
      it: |-
        Noto come “Giungla in moto”. Se una testa diventa
        troppo grande, cade e si trasforma in Exeggcute.
    omega-ruby:
      ja-Hrkt: |-
        なんごく　うまれの　ナッシーの　あたまは　つよい
        ひざしを　いっぱい　あびて　どんどん　そだち
        じめんに　おちると　タマタマに　なると　いう。
      ja: |-
        南国　生まれの　ナッシーの　頭は　強い
        日差しを　いっぱい　浴びて　どんどん　育ち
        地面に　落ちると　タマタマに　なると　いう。
      ko: |-
        남쪽 나라 태생인 나시의 머리는 강한
        햇빛을 잔뜩 받고 점점 자라
        땅에 떨어지면 아라리가 된다고 한다.
      en: |-
        Exeggutor originally came from the tropics. Its heads
        steadily grow larger from exposure to strong sunlight.
        It is said that when the heads fall off, they group together
        to form Exeggcute.
      fr: |-
        Noadkoko vient des tropiques. À force de vivre sous un soleil
        ardent, ses têtes ont rapidement grandi. On raconte que
        lorsque ses têtes tombent, elles se rassemblent et forment
        un Noeunoeuf.
      de: |-
        Kokowei stammt ursprünglich aus den Tropen. Seine Köpfe
        wachsen stetig, wenn es starkem Sonnenlicht ausgesetzt ist.
        Wenn seine Köpfe abfallen, bilden sie zusammen ein Owei.
      es: |-
        Exeggutor es originario del trópico. Cuando se expone a un
        sol intenso, le empiezan a crecer las cabezas. Hay quien dice
        que, cuando las cabezas caen al suelo, se unen para formar
        un Exeggcute.
      it: |-
        Exeggutor è originario dei tropici. Le teste crescono
        costantemente se esposte a forte luce solare.
        Pare che quando le teste cadono, si uniscano per formare
        un Exeggcute.
    alpha-sapphire:
      ja-Hrkt: |-
        なんごく　うまれの　ナッシーの　あたまは　つよい
