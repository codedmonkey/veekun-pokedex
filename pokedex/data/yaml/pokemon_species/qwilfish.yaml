        form makes it a poor swimmer.
    x:
      ja-Hrkt: |-
        ぜんしんの　どくばりを　とばすため
        １０リットルの　みずを　いっきに
        のみこみ　からだを　ふくらませる。
      ja: |-
        全身の　毒針を　飛ばすため
        １０リットルの　水を　一気に
        飲みこみ　体を　ふくらませる。
      ko: |-
        전신의 독침을 날리기 위해
        10리터의 물을 단번에
        마시고 몸을 부풀린다.
      en: |-
        To fire its poison spikes, it must inflate its body by
        drinking over 2.6 gallons of water all at once.
      fr: |-
        Pour tirer ses dards empoisonnés, il gonfle son corps
        en buvant 10 l d’eau subitement.
      de: |-
        Um seine Giftstacheln abzufeuern, muss es
        seinen Körper aufpumpen, indem es 10 l trinkt.
      es: |-
        Para arrojar sus venenosas púas, infla su cuerpo
        bebiendo hasta diez litros de agua de una sola vez.
      it: |-
        Per sparare le punte velenose, gonfia il corpo
        bevendo più di 10 l d’acqua in una volta.
    'y':
      ja-Hrkt: |-
        ぜんしんの　ちいさな　ハリは
        うろこが　へんかしたもの。
        ささると　どくで　きをうしなう。
      ja: |-
        全身の　小さな　針は
        ウロコが　変化したもの。
        刺さると　毒で　気を失う。
      ko: |-
        전신의 작은 바늘은
        비늘이 변화한 것이다.
        찔리면 독 때문에 정신을 잃게 된다.
      en: |-
        The small spikes covering its body developed from
        scales. They inject a toxin that causes fainting.
      fr: |-
        Son corps est recouvert de pics provenant de ses
        écailles. Ils sécrètent un poison étourdissant.
      de: |-
        Die kleinen Stacheln an seinem Körper sind aus
        Schuppen entstanden. Damit injiziert es Gift.
      es: |-
        Las pequeñas púas que cubren su cuerpo eran
        escamas. Inyectan una toxina que debilita.
      it: |-
        I piccoli aculei che coprono il suo corpo si sono
        formati dalle squame. Contengono una tossina che
        fa svenire.
    omega-ruby:
      ja-Hrkt: |-
        のみこんだ　みずの　ちからを　りようして
        ぜんしんの　どくばりを　いっせいに　うちだす。
        およぐのは　ちょっと　にがてな　ポケモンだ。
      ja: |-
        飲み込んだ　水の　力を　利用して
        全身の　毒針を　一斉に　打ち出す。
        泳ぐのは　ちょっと　苦手な　ポケモンだ。
      ko: |-
        들이마신 물의 힘을 이용하여
        전신의 독침을 일제히 쏘아댄다.
        헤엄치는 것이 조금 서툰 포켓몬이다.
      en: |-
        Qwilfish sucks in water, inflating itself. This Pokémon
        uses the pressure of the water it swallowed to shoot toxic
        quills all at once from all over its body. It finds swimming
        somewhat challenging.
      fr: |-
        Qwilfish se gonfle en aspirant de l’eau. Ce Pokémon utilise
        la pression de l’eau avalée pour envoyer d’un coup les pointes
        toxiques de son corps. Nager lui demande un gros effort.
      de: |-
        Baldorfish saugt Wasser ein, um sich aufzublasen. Dieses
        Pokémon nutzt den Druck des Wassers dazu, giftige Stacheln
        aus seinem Körper zu verschießen. Es betrachtet Schwimmen
        als eine echte Herausforderung.
      es: |-
        Qwilfish bebe agua y se hincha, y a continuación usa la
        presión del agua que ha tragado para lanzar púas tóxicas
        por todo el cuerpo. Para este Pokémon nadar es una especie
        de desafío.
      it: |-
        Qwilfish si gonfia assorbendo acqua. Poi usa la pressione
        dell’acqua ingerita per sparare i suoi aculei velenosi
        tutti insieme in un colpo solo.
        Non si può certo dire che sia un grande nuotatore.
    alpha-sapphire:
      ja-Hrkt: |-
        のみこんだ　みずの　ちからを　りようして
        ぜんしんの　どくばりを　いっせいに　うちだす。
        およぐのは　ちょっと　にがてな　ポケモンだ。
      ja: |-
        飲み込んだ　水の　力を　利用して
        全身の　毒針を　一斉に　打ち出す。
        泳ぐのは　ちょっと　苦手な　ポケモンだ。
      ko: |-
        들이마신 물의 힘을 이용하여
        전신의 독침을 일제히 쏘아댄다.
        헤엄치는 것이 조금 서툰 포켓몬이다.
      en: |-
        Qwilfish sucks in water, inflating itself. This Pokémon
        uses the pressure of the water it swallowed to shoot toxic
        quills all at once from all over its body. It finds swimming
        somewhat challenging.
      fr: |-
        Qwilfish se gonfle en aspirant de l’eau. Ce Pokémon utilise
        la pression de l’eau avalée pour envoyer d’un coup les pointes
        toxiques de son corps. Nager lui demande un gros effort.
      de: |-
        Baldorfish saugt Wasser ein, um sich aufzublasen.
        Dieses Pokémon nutzt den Druck des Wassers dazu,
        giftige Stacheln zu verschießen. Es betrachtet Schwimmen
        als eine echte Herausforderung.
      es: |-
        Qwilfish bebe agua y se hincha, y a continuación usa la
        presión del agua que ha tragado para lanzar púas tóxicas
        por todo el cuerpo. Para este Pokémon nadar es una especie
        de desafío.
      it: |-
        Qwilfish si gonfia assorbendo acqua. Poi usa la pressione
        dell’acqua ingerita per sparare i suoi aculei velenosi
        tutti insieme in un colpo solo.
        Non si può certo dire che sia un grande nuotatore.
    sword:
      ja-Hrkt: |-
        あいてが　おおきいほど　からだが
        はれつする　げんかいまで　みずを
        のみこみ　からだを　ふくらませる。
      ja: |-
        相手が　大きいほど　体が
        破裂する　限界まで　水を
        飲みこみ　体を　膨らませる。
      ko: |-
        상대가 크면 클수록 몸이
        터지기 직전까지 물을
        들이마셔서 몸을 부풀린다.
      zh-Hant: |-
        對手的體型越是巨大，牠就會
        喝下越多的水使身體膨脹，
        彷彿馬上就要破裂一般。
      zh-Hans: |-
        对手的体型越是巨大，它就会
        喝下越多的水使身体膨胀，
        仿佛马上就要破裂一般。
      en: |-
        When faced with a larger opponent, it swallows
        as much water as it can to match the
        opponent’s size.
      fr: |-
        Lorsqu’il est confronté à plus gros que lui,
        il avale autant d’eau que possible pour égaler
        le gabarit de son adversaire.
      de: |-
        Sieht es sich einem größeren Feind gegenüber,
        schluckt es massenweise Wasser, um seinen
        Körper aufzublähen und größer zu wirken.
      es: |-
        Cuando su rival es mayor que él, infla el cuerpo
        bebiendo agua hasta casi reventar para lograr
        igualarlo en tamaño.
      it: |-
        Se incontra un nemico più grande, ingoia acqua
        gonfiando il corpo fino quasi a scoppiare.
    shield:
      ja-Hrkt: |-
        ぜんしんの　ちいさな　ハリは
        うろこが　へんかしたもの。
        ささると　どくで　きをうしなう。
      ja: |-
        全身の　小さな　針は
        ウロコが　変化したもの。
        刺さると　毒で　気を失う。
      ko: |-
        전신의 작은 바늘은
        비늘이 변화한 것이다.
        찔리면 독 때문에 정신을 잃게 된다.
      zh-Hant: |-
        全身上下的小針是由鱗片
        變化而來的。如果被刺中的話，
        就會中毒並陷入昏迷。
      zh-Hans: |-
        全身上下的小针都是由鳞片
        变化而来的。如果被刺中的话，
        就会因中毒而昏迷。
      en: |-
        The small spikes covering its body developed
        from scales. They inject a toxin that causes fainting.
      fr: |-
        Ses petites épines étaient autrefois des écailles.
        Elles sécrètent des toxines pouvant faire
        perdre connaissance.
      de: |-
        Die kleinen Stacheln an seinem Körper sind aus
        Schuppen entstanden. Damit injiziert es Gift,
        das zu Ohnmacht führt.
      es: |-
        Las pequeñas púas que cubren su cuerpo eran
        escamas. Inyectan una toxina que hace perder
        el conocimiento.
      it: |-
        I piccoli aculei che coprono il suo corpo si sono
        formati dalle squame. Contengono una tossina
        che fa svenire.
    legends-arceus:
      en: |-
        Fishers detest this troublesome Pokémon because it sprays
        poison from its spines, getting it everywhere. A different form
        of Qwilfish lives in other regions.
