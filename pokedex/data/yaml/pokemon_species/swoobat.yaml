swoobat:
  base_happiness: 50
  capture_rate: 45
  color: blue
  egg_groups:
    - flying
    - ground
  evolution_chain: woobat
  evolves_from: woobat
  flavor_text:
    black:
      en: |-
        It emits sound waves of various
        frequencies from its nose, including
        some powerful enough to destroy rocks.
      fr: |-
        Il émet des ondes sonores de
        différentes fréquences par le nez.
        Certaines peuvent briser des rochers.
    white:
      en: |-
        Anyone who comes into contact with the
        ultrasonic waves emitted by a courting
        male experiences a positive mood shift.
      fr: |-
        Le mâle courtise la femelle à l’aide
        d’ultrasons. Les écouter met de très
        bonne humeur.
    black-2:
      en: |-
        It shakes its tail vigorously when it
        emits ultrasonic waves strong enough
        to reduce concrete to rubble.
    white-2:
      en: |-
        It shakes its tail vigorously when it
        emits ultrasonic waves strong enough
        to reduce concrete to rubble.
    x:
      ja-Hrkt: |-
        コンクリートも　こわせるほどの
        つよい　ちょうおんぱを　だすとき
        しっぽが　はげしく　ふるえる。
      ja: |-
        コンクリートも　壊せるほどの
        強い　超音波を　出すとき
        尻尾が　激しく　震える。
      ko: |-
        콘크리트도 부술 정도로
        강한 초음파를 낼 때
        꼬리가 심하게 흔들린다.
      en: |-
        It shakes its tail vigorously when it emits ultrasonic
        waves strong enough to reduce concrete to rubble.
      fr: |-
        Sa queue s’agite frénétiquement quand il émet ses
        ultrasons assez puissants pour pulvériser du béton.
      de: |-
        Beim Abfeuern seiner Ultraschallwellen, mit denen
        es selbst Beton zertrümmern kann, wedelt es eifrig
        mit dem Schweif.
      es: |-
        Cuando emite ondas ultrasónicas, que incluso pueden
        reventar el cemento, agita su cola con vehemencia.
      it: |-
        Quando emette delle onde ultrasoniche così forti da
        rompere il cemento, la coda gli oscilla con forza.
    'y':
      ja-Hrkt: |-
        オスが　メスに　きゅうあいするとき
        はっする　ちょうおんぱを　あびると
        とても　たのしい　きぶんになる。
      ja: |-
        オスが　メスに　求愛するとき
        発する　超音波を　浴びると
        とても　楽しい　気分になる。
      ko: |-
        수컷이 암컷에게 구애할 때
        발사하는 초음파에 노출되면
        기분이 매우 즐거워진다.
      en: |-
        Anyone who comes into contact with the ultrasonic
        waves emitted by a courting male experiences a
        positive mood shift.
      fr: |-
        Le mâle courtise la femelle à l’aide d’ultrasons.
        Les écouter met de très bonne humeur.
      de: |-
        Wer den Ultraschallwellen eines Männchens in der Balz
        ausgesetzt wird, verfällt in eine euphorische Stimmung.
      es: |-
        Todos rebosan de alborozo cuando perciben las ondas
        ultrasónicas emitidas por el macho para cortejar a la
        hembra.
      it: |-
        È molto piacevole essere investiti dalle onde
        ultrasoniche che il maschio emette quando corteggia
        la femmina.
    omega-ruby:
      ja-Hrkt: |-
        コンクリートも　こわせるほどの
        つよい　ちょうおんぱを　だすとき
        しっぽが　はげしく　ふるえる。
      ja: |-
        コンクリートも　壊せるほどの
        強い　超音波を　出すとき
        尻尾が　激しく　震える。
      ko: |-
        콘크리트도 부술 정도로
        강한 초음파를 낼 때
        꼬리가 심하게 흔들린다.
      en: |-
        It shakes its tail vigorously when it emits ultrasonic
        waves strong enough to reduce concrete to rubble.
      fr: |-
        Sa queue s’agite frénétiquement quand il émet ses ultrasons
        assez puissants pour pulvériser du béton.
      de: |-
        Beim Abfeuern seiner Ultraschallwellen, mit denen es selbst
        Beton zertrümmern kann, wedelt es eifrig mit dem Schweif.
      es: |-
        Cuando emite ondas ultrasónicas, que incluso pueden
        reventar el cemento, agita su cola con vehemencia.
      it: |-
        Quando emette delle onde ultrasoniche così forti da rompere
        il cemento, la coda gli oscilla con forza.
    alpha-sapphire:
      ja-Hrkt: |-
        オスが　メスに　きゅうあいするとき
        はっする　ちょうおんぱを　あびると
        とても　たのしい　きぶんになる。
      ja: |-
        オスが　メスに　求愛するとき
        発する　超音波を　浴びると
        とても　楽しい　気分になる。
      ko: |-
        수컷이 암컷에게 구애할 때
        발사하는 초음파에 노출되면
        기분이 매우 즐거워진다.
      en: |-
        Anyone who comes into contact with the ultrasonic
        waves emitted by a courting male experiences a
        positive mood shift.
      fr: |-
        Le mâle courtise la femelle à l’aide d’ultrasons. Les écouter
        met de très bonne humeur.
      de: |-
        Wer den Ultraschallwellen eines Männchens in der Balz
        ausgesetzt wird, verfällt in eine euphorische Stimmung.
      es: |-
        Todos rebosan de alborozo cuando perciben las ondas
        ultrasónicas emitidas por el macho para cortejar a la hembra.
      it: |-
        È molto piacevole essere investiti dalle onde ultrasoniche
        che il maschio emette quando corteggia la femmina.
    sword:
      ja-Hrkt: |-
        ちょうきょうりょくな　おんぱを
        はなったあとは　つかれて
        しばらく　とべなくなるよ。
      ja: |-
        超強力な　音波を
        放ったあとは　疲れて
        しばらく　飛べなくなるよ。
      ko: |-
        아주 강력한 음파를
        내보낸 후에는 지쳐서
        당분간 날 수 없게 된다.
      zh-Hant: |-
        在發出極其強力的
        音波後會陷入疲勞，
        暫時無法飛行。
      zh-Hans: |-
        在发出极其强力的
        音波后会陷入疲劳，
        暂时无法飞行。
      en: |-
        Emitting powerful sound waves tires it out.
        Afterward, it won’t be able to fly for a
        little while.
      fr: |-
        Émettre des ondes sonores ultra-puissantes
        le fatigue tellement qu’il n’a plus de forces
        pour voler.
      de: |-
        Hat es besonders starke Ultraschallwellen
        ausgestoßen, wird es so müde, dass es für
        eine Weile nicht fliegen kann.
      es: |-
        Tras emitir sus potentísimas ondas, queda tan
        exhausto que es incapaz de volar durante un
        tiempo.
      it: |-
        Dopo aver emesso delle potentissime onde
        sonore è così stanco da non poter volare per
        un po’.
    shield:
      ja-Hrkt: |-
        はなの　かたちが　おめでたいと
        こうふくを　よぶ　シンボルとして
        まつる　ちいきも　あるという。
      ja: |-
        鼻の　形が　おめでたいと
        幸福を　呼ぶ　シンボルとして
        祭る　地域も　あるという。
      ko: |-
        코의 모양이 복스럽다고
        행복을 부르는 상징으로
        여기는 지역도 있다고 한다.
      zh-Hant: |-
        據說有些地區的人覺得
        牠鼻子的形狀很吉利，
        而把牠當成幸福的象徵來祭拜。
      zh-Hans: |-
        据说有些地区的人觉得
        它鼻子的形状很吉利，
        而把它当成幸福的象征来祭拜。
      en: |-
        The auspicious shape of this Pokémon’s nose
        apparently led some regions to consider
        Swoobat a symbol of good luck.
      fr: |-
        Certaines contrées le vénèrent et pensent
        que la forme de son nez est un symbole
        de chance et de bonheur.
      de: |-
        Es wird in manchen Regionen für seine Nasenform
        verehrt, die angeblich Glück bringen soll.
      es: |-
        En algunas regiones se venera a este Pokémon,
        ya que consideran la forma de su nariz como un
        símbolo de felicidad.
      it: |-
        Si dice che in alcune regioni venga venerato
        per via della forma del suo naso, ritenuta
        di buon auspicio.
