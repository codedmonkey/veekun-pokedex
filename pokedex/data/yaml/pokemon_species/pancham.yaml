        sguardo di sfida non è molto efficace. Ha il vizio di masticare
        una foglia.
    alpha-sapphire:
      ja-Hrkt: |-
        いっしょうけんめい　こわい　かおで
        あいてを　にらみつけるが　あたまを
        なでられると　つい　にやけてしまう。
      ja: |-
        一生懸命　怖い　顔で　相手を
        にらみつけるが　頭を　なでられると
        つい　にやけてしまう。
      ko: |-
        무서운 얼굴로 열심히
        상대를 노려보지만 머리를
        쓰다듬어주면 금방 해죽거린다.
      en: |-
        It does its level best to glare and pull a scary face,
        but it can’t help grinning if anyone pats its head.
      fr: |-
        Il fait de son mieux pour avoir un air patibulaire, mais il sourit
        béatement dès qu’on lui caresse la tête.
      de: |-
        Es gibt alles, um ein finsteres Gesicht zu machen und
        sein Gegenüber böse anzustarren, aber wenn es am
        Kopf gestreichelt wird, muss es unwillkürlich grinsen.
      es: |-
