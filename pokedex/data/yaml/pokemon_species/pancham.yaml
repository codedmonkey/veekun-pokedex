pancham:
  base_happiness: 50
  capture_rate: 220
  color: white
  egg_groups:
    - ground
    - humanshape
  evolution_chain: pancham
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        てきに　なめられないよう　がんばって
        にらみつけるが　こうかは　うすい。
        くわえた　はっぱが　トレードマーク。
      ja: |-
        敵に　なめられないよう　がんばって
        にらみつけるが　効果は　薄い。
        くわえた　葉っぱが　トレードマーク。
      ko: |-
        적이 얕잡아 보지 못하도록 열심히
        노려보지만, 효과가 약하다.
        물고 있는 잎사귀가 트레이드마크다.
      en: |-
        It does its best to be taken seriously by its enemies,
        but its glare is not sufficiently intimidating.
        Chewing on a leaf is its trademark.
      fr: |-
        Il fait son possible pour intimider ses adversaires
        avec un regard menaçant, mais sans succès. Il a
        l’habitude de constamment mâcher une feuille.
      de: |-
        Es starrt den Gegner finster an, um nicht unterschätzt
        zu werden, hat aber nur wenig Erfolg damit.
        Das Kauen auf einem Blatt ist sein Markenzeichen.
      es: |-
        Se esfuerza mucho para que el enemigo no lo
        menosprecie, pero su mirada no intimida demasiado.
        Se caracteriza por mascar siempre una hoja.
      it: |-
        Fa di tutto per farsi prendere sul serio dai nemici,
        ma il suo sguardo di sfida non è molto efficace.
        Ha il vizio di masticare una foglia.
    'y':
      ja-Hrkt: |-
        いっしょうけんめい　こわい　かおで
        あいてを　にらみつけるが　あたまを
        なでられると　つい　にやけてしまう。
      ja: |-
        一生懸命　怖い　顔で　相手を
        にらみつけるが　頭を　なでられると
        つい　にやけてしまう。
      ko: |-
        무서운 얼굴로 열심히
        상대를 노려보지만 머리를
        쓰다듬어주면 금방 해죽거린다.
      en: |-
        It does its level best to glare and pull a scary face,
        but it can’t help grinning if anyone pats its head.
      fr: |-
        Il fait de son mieux pour avoir un air patibulaire,
        mais il sourit béatement dès qu’on lui caresse la tête.
      de: |-
        Es gibt alles, um ein finsteres Gesicht zu machen und
        sein Gegenüber böse anzustarren, aber wenn es am
        Kopf gestreichelt wird, muss es unwillkürlich grinsen.
      es: |-
        Se desvive tratando de fulminar a su rival con una
        mirada aterradora, pero en cuanto le acarician la
        cabeza, no puede evitar sonreír de oreja a oreja.
      it: |-
        Ce la mette tutta per intimorire i nemici con uno
        sguardo truce, ma appena qualcuno gli accarezza
        la testa, diventa un tenerone.
    omega-ruby:
      ja-Hrkt: |-
        てきに　なめられないよう　がんばって
        にらみつけるが　こうかは　うすい。
        くわえた　はっぱが　トレードマーク。
      ja: |-
        敵に　なめられないよう　がんばって
        にらみつけるが　効果は　薄い。
        くわえた　葉っぱが　トレードマーク。
      ko: |-
        적이 얕잡아 보지 못하도록 열심히
        노려보지만, 효과가 약하다.
        물고 있는 잎사귀가 트레이드마크다.
      en: |-
        It does its best to be taken seriously by its enemies,
        but its glare is not sufficiently intimidating.
        Chewing on a leaf is its trademark.
      fr: |-
