        aterradora, pero en cuanto le acarician la cabeza, no puede
        evitar sonreír de oreja a oreja.
      it: |-
        Ce la mette tutta per intimorire i nemici con uno sguardo
        truce, ma appena qualcuno gli accarezza la testa, diventa
        un tenerone.
    sun:
      ja-Hrkt: |-
        おやぶんの　ように　したっている
        ゴロンダの　しぐさを　まねながら
        いちにんまえに　なっていくぞ。
      ja: |-
        親分の　ように　慕っている
        ゴロンダの　仕草を　真似ながら
        一人前に　なっていくぞ。
      ko: |-
        형님처럼 의지하며 따르는
        부란다의 행동을 따라 하면서
        성장해 간다.
      zh-Hant: |-
        不斷模仿被自己當成老大哥般
        敬仰著的流氓熊貓的舉止，
        由此漸漸變得獨當一面。
      zh-Hans: |-
        模仿像头领那样敬仰着的
        流氓熊猫的举止，
        渐渐变得独当一面。
      en: |-
        It grows up imitating the behavior of Pangoro,
        which it looks up to as a leader.
      fr: |-
        Il grandit en copiant les poses et les mimiques
        de ce gros cador de Pandarbare, qu’il considère
        comme son mentor.
      de: |-
        Pandagro ist sein großes Vorbild, das es stets
        nachahmt. Dabei ist es so eifrig, dass es daran
        wächst.
      es: |-
        En su afán por madurar, toma como modelo a
        Pangoro, hacia el que profesa sumo respeto.
        Para él es como una especie de mentor.
      it: |-
        Aspira a diventare un Pokémon rispettato e
        temuto imitando Pangoro, che considera il suo
        mentore.
    moon:
      ja-Hrkt: |-
        くわえている　はっぱに　いみは　なく
        ただの　かっこつけ。　やんちゃなので
        しろうとトレーナーには　むかない。
      ja: |-
        咥えている　葉っぱに　意味は　なく
        ただの　かっこつけ。　やんちゃなので
        素人トレーナーには　向かない。
      ko: |-
        물고 있는 나뭇잎은 특별한 의미 없이
        그냥 멋이다. 개구쟁이라
        초급 트레이너에게는 적합하지 않다.
      zh-Hant: |-
        嘴裡叼著的葉子沒有任何意義，
        只是為了裝酷。因為很頑皮，
        所以不適合沒經驗的訓練家。
      zh-Hans: |-
        嘴里叼着的叶子没有任何意义，
        只是为了装酷。因为很顽皮，
        所以不适合没经验的训练家。
      en: |-
        There’s no point to the leaf in its mouth, aside
        from an effort to look cool. It’s mischievous,
        so it’s not well suited to inexperienced Trainers.
      fr: |-
        C’est juste pour se donner un air qu’il mâche
        une feuille. Comme c’est un petit galopin,
        il est déconseillé aux Dresseurs inexpérimentés.
      de: |-
        Das Kauen auf einem Blatt ist sein Marken-
        zeichen. Dieses sehr ungezogene Pokémon
        dürfte frischgebackene Trainer überfordern.
      es: |-
        Solo masca la hoja que lleva porque le gusta el
        aire que le confiere. Su carácter pícaro lo hace
        incompatible con los Entrenadores novatos.
      it: |-
        Tiene in bocca una foglia per darsi un tono.
        Essendo piuttosto birichino, non è molto adatto
        per gli Allenatori inesperti.
    ultra-sun:
      ja-Hrkt: |-
        ゴロンダの　あとを　こぶんの　ように
        ついていく。　おおきな　しっぱいを
        すると　はっぱを　とられてしまう。
      ja: |-
        ゴロンダの　あとを　子分の　ように
        ついていく。　大きな　失敗を
        すると　葉っぱを　取られてしまう。
      ko: |-
        부란다의 뒤를 부하처럼
        따라다닌다. 큰 실패를 하면
        잎사귀를 빼앗겨 버린다.
      zh-Hant: |-
        像跟班似地跟在流氓熊貓後面。
        如果犯了重大的錯誤，
        葉子就會被沒收。
      zh-Hans: |-
        像跟班那样跟在流氓熊猫后头。
        如果犯了重大错误，
        叶子就会被拿走。
      en: |-
        It follows Pangoro around like a henchman.
        When Pancham makes a big mistake, its leaf
        gets taken away.
      fr: |-
        Il suit Pandarbare comme son ombre et
        le considère comme son chef. S’il fait
        une grosse bêtise, on lui confisque sa feuille.
      de: |-
        Es folgt treu seinem großen Vorbild, Pandagro.
        Begeht Pam-Pam einen schwerwiegenden
        Fehler, nimmt ihm Pandagro sein Blatt ab.
      es: |-
        Sigue los pasos de Pangoro, a quien considera
        su maestro. En caso de cometer un grave error,
        este le arrebata la hierba de la boca.
      it: |-
        Segue Pangoro ovunque come un discepolo.
        Se commette gravi errori, gli viene confiscata
        la foglia che tiene in bocca.
    ultra-moon:
      ja-Hrkt: |-
        あいてを　ビビらせようと　ひっし。
        いっしょうけんめい　にらんできたら
        こわがるふりを　してあげよう。
      ja: |-
        相手を　ビビらせようと　必死。
        一生懸命　睨んできたら
        怖がるふりを　してあげよう。
      ko: |-
        상대를 겁먹게 하려고 필사적이다.
        열심히 노려 본다면
        겁먹은 척을 해 주자.
      zh-Hant: |-
        拼命地想讓對手害怕。
        如果牠用盡全力瞪著你看，
        就裝作自己很害怕吧。
      zh-Hans: |-
        拼命地想让对手惧怕。
        如果它用尽全力瞪着你的话，
        就装作自己很害怕吧。
      en: |-
        It’s desperate to intimidate its opponents.
        Be nice and pretend to be scared if you
        catch it glaring at you intensely.
      fr: |-
        Il essaie à tout prix d’intimider son adversaire.
        S’il vous fait les gros yeux, faites-lui plaisir
        et prenez l’air apeuré !
      de: |-
        Mit seinem finsteren Blick versucht es, seinen
        Gegner einzuschüchtern. Manchmal sollte man
        ihm den Gefallen tun und verängstigt reagieren.
      es: |-
        Intenta amedrentar a su oponente a toda costa.
        Si fija la mirada en alguien, solo hay que
        aparentar tener miedo para hacerlo feliz.
      it: |-
        Cerca di intimorire l’avversario a tutti i costi.
        A volte fissa le persone per spaventarle e, per
        farlo felice, basta far finta di aver paura.
    sword:
      ja-Hrkt: |-
        おやぶんと　したう　ゴロンダの
        まねを　する　ことで　たたかいかたや
        えものの　つかまえかたを　まなぶ。
      ja: |-
        親分と　慕う　ゴロンダの
        真似を　する　ことで　戦い方や
        獲物の　捕まえ方を　学ぶ。
      ko: |-
        형님처럼 따르는 부란다를
        따라 하면서 싸우는 법과
        먹이를 잡는 법을 배운다.
      zh-Hant: |-
        會模仿自己敬為頭領的
        流氓熊貓，向牠學習戰鬥
        及捕捉獵物的方法。
      zh-Hans: |-
        会模仿自己敬为头头的
        霸道熊猫，向它学习战斗
        及捕捉猎物的方法。
      en: |-
        It chooses a Pangoro as its master and then
        imitates its master’s actions. This is how it learns
        to battle and hunt for prey.
      fr: |-
        C’est en copiant son mentor, Pandarbare,
        qu’il apprend toutes les ficelles du métier,
        de l’art du combat à la capture des proies.
      de: |-
        Es imitiert sein großes Vorbild Pandagro, wo es
        nur kann. So lernt es, wie man kämpft und jagt.
      es: |-
        Sigue los pasos de Pangoro, a quien considera su
        mentor. A base de imitarlo, aprende a combatir y
        a cazar presas.
      it: |-
        Considera Pangoro il suo capo e lo prende a
        modello, imitandolo e imparando così a
        lottare e a cacciare le prede.
    shield:
      ja-Hrkt: |-
        なめられないように　いつも　あいてを
        にらみつけているが　きが　ゆるむと
        つい　わらいがおに　なってしまう。
      ja: |-
        なめられないように　いつも　相手を
        睨みつけているが　気が　緩むと
        つい　笑い顔に　なってしまう。
      ko: |-
        얕잡아 보이지 않으려고 언제나
        상대를 노려보고 있지만 방심하면
        금방 웃는 얼굴이 되어버린다.
      zh-Hant: |-
        為了不被小看而一直瞪著對手，
        然而繃緊的神經一旦稍有放鬆，
        牠就會在無意中露出笑臉。
      zh-Hans: |-
        为了不被小看而一直瞪着对手，
        然而绷紧的神经一旦稍有放松，
        它就会在无意中露出笑脸。
      en: |-
        Wanting to make sure it’s taken seriously,
        Pancham’s always giving others a glare.
        But if it’s not focusing, it ends up smiling.
      fr: |-
        Il dévisage toujours ses adversaires d’un air
        renfrogné pour être pris au sérieux, mais dès que
        la tension retombe, son sourire reprend le dessus.
      de: |-
        Es starrt den Gegner finster an, um nicht
        unterschätzt zu werden, doch wenn es sich
        entspannt, muss es unwillkürlich grinsen.
      es: |-
        Siempre lanza una mirada fulminante al rival para
        que no lo menosprecie, pero en cuanto se relaja
        esboza sin querer una sonrisa.
      it: |-
        Fa il duro e guarda tutti in cagnesco per
        essere preso sul serio, ma quando è
        rilassato gli sfugge sempre un sorriso.
