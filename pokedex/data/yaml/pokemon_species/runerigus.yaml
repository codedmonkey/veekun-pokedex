runerigus:
  base_happiness: 50
  capture_rate: 90
  color: gray
  egg_groups:
    - mineral
    - indeterminate
  evolution_chain: yamask
  evolves_from: yamask
  flavor_text:
    sword:
      ja-Hrkt: |-
        つよい　のろいを　こめて　かかれた
        こだいの　えが　デスマスの
        たましいを　とりこみ　うごきだした。
      ja: |-
        強い　呪いを　こめて　描かれた
        古代の　絵が　デスマスの
        魂を　取り込み　動きだした。
      ko: |-
        강한 저주를 담아 그린
        고대의 그림이 데스마스의 영혼을
        흡수해서 움직이기 시작했다.
      zh-Hant: |-
        被注入了強烈詛咒的古代繪畫
        在吸進哭哭面具的靈魂後
        就開始動起來了。
      zh-Hans: |-
        被注入了强烈诅咒的古代绘画
        在吸进哭哭面具的灵魂后
        就开始动起来了。
      en: |-
        A powerful curse was woven into an ancient
        painting. After absorbing the spirit of a Yamask,
        the painting began to move.
      fr: |-
        Les motifs antiques qui ont été gravés
        en y incorporant une puissante malédiction
        ont aspiré l’âme de Tutafeh avant de prendre vie.
      de: |-
        Eine antike Malerei, die mit einem mächtigen
        Fluch versehen wurde, nahm die Seele eines
        Makabaja auf und erwachte zum Leben.
      es: |-
        Una poderosa maldición pesa sobre esta antigua
        imagen grabada, que ha cobrado vida tras
        adueñarse del alma de Yamask.
      it: |-
        Un antico disegno afflitto da una potente
        maledizione ha preso vita, imprigionando
        l’anima di Yamask.
    shield:
      ja-Hrkt: |-
        かげの　ような　からだに　ふれては
        いけない。　えに　きざまれた
        おそろしい　きおくを　みせられるぞ。
      ja: |-
        影の　ような　体に　触れては
        いけない。　絵に　刻まれた
        恐ろしい　記憶を　見せられるぞ。
      ko: |-
        그림자 같은 몸을 만지면 안 된다.
        그림에 새겨진 무서운 기억을
        보게 되기 때문이다.
      zh-Hant: |-
        絕對不能觸摸牠影子般的
        身體，否則牠會讓你看到
        印刻在牠畫中的恐怖記憶。
      zh-Hans: |-
        绝对不能触摸它影子般的
        身体，否则它会让你看到
        印刻在它画中的恐怖记忆。
      en: |-
        Never touch its shadowlike body, or you’ll be
        shown the horrific memories behind the picture
        carved into it.
      fr: |-
        Quiconque touchera son corps semblable
        à une ombre devra endurer la vision des souvenirs
        effroyables gravés dans ses motifs.
      de: |-
        Man sollte seinen schattenhaften Körper nicht
        berühren, sonst zeigt es einem die schauerlichen
        Erinnerungen, die in sein Bild eingraviert wurden.
      es: |-
        Su cuerpo, similar a una sombra, no debe tocarse
        bajo ningún concepto o se visualizarán los
        horribles recuerdos impregnados en la imagen.
      it: |-
        Non bisogna toccare il suo corpo simile a
        un’ombra, o si vedranno i propri ricordi più
        terribili imprigionati nel suo motivo.
