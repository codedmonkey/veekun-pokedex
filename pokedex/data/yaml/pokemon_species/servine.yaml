servine:
  base_happiness: 70
  capture_rate: 45
  color: green
  egg_groups:
    - ground
    - plant
  evolution_chain: snivy
  evolves_from: snivy
  flavor_text:
    black:
      en: |-
        It moves along the ground as if sliding.
        Its swift movements befuddle its foes,
        and it then attacks with a vine whip.
      fr: |-
        Il court comme s’il glissait sur le sol.
        Il déroute l’ennemi par ses mouvements
        et l’assomme d’un coup de liane.
    white:
      en: |-
        They avoid attacks by sinking into the
        shadows of thick foliage. They retaliate
        with masterful whipping techniques.
      fr: |-
        Il évite les coups en se cachant dans la
        végétation luxuriante et contre-attaque
        habilement avec un bon coup de liane.
    black-2:
      en: |-
        When it gets dirty, its leaves
        can’t be used in photosynthesis,
        so it always keeps itself clean.
    white-2:
      en: |-
        When it gets dirty, its leaves
        can’t be used in photosynthesis,
        so it always keeps itself clean.
    x:
      ja-Hrkt: |-
        じめんを　すべるように　はしる。
        すばやい　うごきで　てきを　まどわせ
        つるのムチで　しとめるのだ。
      ja: |-
        地面を　滑るように　走る。
        素早い　動きで　敵を　まどわせ
        つるのムチで　しとめるのだ。
      ko: |-
        땅을 미끄러지듯 달린다.
        빠른 움직임으로 상대를 혼란시키고
        덩굴채찍으로 꼼짝 못하게 한다.
      en: |-
        It moves along the ground as if sliding. Its swift
        movements befuddle its foes, and it then attacks
        with a vine whip.
      fr: |-
        Il court comme s’il glissait sur le sol. Il déroute
        l’ennemi par ses mouvements et l’assomme d’un
        coup de liane.
      de: |-
        Huscht beinahe gleitend über den Boden
        und täuscht Gegner mit agilen Manövern,
        bis es mithilfe seiner Efeurute obsiegt.
      es: |-
        Parece que se desliza al correr. Engaña a sus rivales
        con su velocidad y los fustiga con su látigo.
      it: |-
        Corre quasi scivolando sulle superfici. Confonde il
        nemico con i rapidi movimenti, per poi attaccarlo
        con una frustata.
    'y':
      ja-Hrkt: |-
        からだが　よごれると　はっぱで
        こうごうせいが　できなくなるので
        いつも　せいけつに　している。
      ja: |-
        体が　汚れると　葉っぱで
        光合成が　できなくなるので
        いつも　清潔に　している。
      ko: |-
        몸이 더러워지면 잎으로
        광합성을 할 수 없기 때문에
        항상 청결하게 하고 있다.
      en: |-
        When it gets dirty, its leaves can’t be used in
        photosynthesis, so it always keeps itself clean.
      fr: |-
        La saleté l’empêchant d’utiliser la photosynthèse,
        il prend grand soin d’être toujours propre.
      de: |-
        Es achtet stets auf Reinlichkeit, da es mit schmutzigen
        Blättern keine Photosynthese betreiben kann.
      es: |-
        Cuando su cuerpo está sucio, no puede realizar la
        fotosíntesis con sus hojas, así que cuida mucho su
        higiene personal.
      it: |-
        Se si sporca, le sue foglie non possono più effettuare
        la fotosintesi, perciò si tiene sempre molto pulito.
    omega-ruby:
      ja-Hrkt: |-
