    alpha-sapphire:
      ja-Hrkt: |-
        からだが　よごれると　はっぱで
        こうごうせいが　できなくなるので
        いつも　せいけつに　している。
      ja: |-
        体が　汚れると　葉っぱで
        光合成が　できなくなるので
        いつも　清潔に　している。
      ko: |-
        몸이 더러워지면 잎으로
        광합성을 할 수 없기 때문에
        항상 청결하게 하고 있다.
      en: |-
        When it gets dirty, its leaves can’t be used in
