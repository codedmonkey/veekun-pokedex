tyrantrum:
  base_happiness: 50
  capture_rate: 45
  color: red
  egg_groups:
    - monster
    - dragon
  evolution_chain: tyrunt
  evolves_from: tyrunt
  flavor_text:
    x:
      ja-Hrkt: |-
        ぶあつい　てっぱんを　かみのように
        かみちぎる　おおあごで　こだいの
        せかいでは　むてきを　ほこった。
      ja: |-
        分厚い　鉄板を　紙のように
        かみちぎる　おおあごで　古代の
        世界では　無敵を　誇った。
      ko: |-
        두꺼운 철판을 종잇장처럼
        물어뜯는 커다란 턱 덕분에
        고대 세계에서는 무적이었다.
      en: |-
        Thanks to its gargantuan jaws, which could shred
        thick metal plates as if they were paper, it was
        invincible in the ancient world it once inhabited.
      fr: |-
        Dans les temps anciens, aucun Pokémon ne pouvait
        rivaliser avec lui. Ses puissantes mâchoires peuvent
        réduire une épaisse plaque de métal en confettis.
      de: |-
        Aufgrund der Zerstörungskraft seines Kiefers,
        der Stahl zerreißen kann, als wäre es Papier,
        galt es in seiner Zeit als unbesiegbar.
      es: |-
        En el mundo antiguo en el que habitaba no tenía
        rivales gracias a sus mandíbulas, con las que podría
        despedazar con facilidad gruesas placas de acero.
      it: |-
        Grazie alle enormi fauci, che gli permettevano di
        masticare una lastra di metallo come se fosse carta,
        era il più forte dei Pokémon preistorici.
    'y':
      ja-Hrkt: |-
        １おくねんまえの　せかいでは
        むてきを　ほこり　おうさまのように
        ふるまっていた　ポケモンだ。
      ja: |-
        １億年前の　世界では
        無敵を　ほこり　王様のように
        ふるまっていた　ポケモン。
      ko: |-
        1억 년 전 세계에서는
        무적을 뽐내며 왕처럼
        행동하던 포켓몬이다.
      en: |-
        Nothing could stop this Pokémon
        100 million years ago,
        so it behaved like a king.
      fr: |-
        Il y a 100 millions d’années, ce Pokémon régnait en
        maître absolu. Personne ne pouvait se mesurer à lui.
      de: |-
        Vor 100 Millionen Jahren gab es niemanden, der sich
        mit ihm hätte messen können, weshalb sich dieses
        Pokémon wie ein König verhielt.
      es: |-
        Hace 100 millones de años, este Pokémon se
        comportaba como un rey, sin nadie que osase
        hacerle frente.
      it: |-
        Nell’era preistorica era il fiero re incontrastato
        di tutti i Pokémon.
    omega-ruby:
      ja-Hrkt: |-
        ぶあつい　てっぱんを　かみのように
        かみちぎる　おおあごで　こだいの
        せかいでは　むてきを　ほこった。
      ja: |-
        分厚い　鉄板を　紙のように
        かみちぎる　おおあごで　古代の
        世界では　無敵を　誇った。
      ko: |-
        두꺼운 철판을 종잇장처럼
        물어뜯는 커다란 턱 덕분에
        고대 세계에서는 무적이었다.
      en: |-
        Thanks to its gargantuan jaws, which could shred
        thick metal plates as if they were paper, it was
        invincible in the ancient world it once inhabited.
      fr: |-
        Dans les temps anciens, aucun Pokémon ne pouvait
        rivaliser avec lui. Ses puissantes mâchoires peuvent
        réduire une épaisse plaque de métal en confettis.
      de: |-
        Aufgrund der Zerstörungskraft seines Kiefers, der Stahl
        zerreißen kann, als wäre es Papier, galt es in seiner Zeit
        als unbesiegbar.
      es: |-
        En el mundo antiguo en el que habitaba no tenía rivales
        gracias a sus mandíbulas, con las que podría despedazar
        con facilidad gruesas placas de acero.
      it: |-
        Grazie alle enormi fauci, che gli permettevano di masticare
        una lastra di metallo come se fosse carta, era il più forte
        dei Pokémon preistorici.
    alpha-sapphire:
      ja-Hrkt: |-
        １おくねんまえの　せかいでは
        むてきを　ほこり　おうさまのように
        ふるまっていた　ポケモンだ。
      ja: |-
        １億年前の　世界では
        無敵を　ほこり　王様のように
        ふるまっていた　ポケモン。
      ko: |-
        1억 년 전 세계에서는
        무적을 뽐내며 왕처럼
        행동하던 포켓몬이다.
      en: |-
        Nothing could stop this Pokémon
        100 million years ago,
        so it behaved like a king.
      fr: |-
        Il y a 100 millions d’années, ce Pokémon régnait en
        maître absolu. Personne ne pouvait se mesurer à lui.
      de: |-
        Vor 100 Millionen Jahren gab es niemanden, der sich mit ihm
        hätte messen können, weshalb sich dieses Pokémon wie ein
        König verhielt.
      es: |-
        Hace 100 millones de años, este Pokémon se comportaba
        como un rey, sin nadie que osase hacerle frente.
      it: |-
        Nell’era preistorica era il fiero re incontrastato di tutti
        i Pokémon.
    ultra-sun:
      ja-Hrkt: |-
        かんぜんな　ふくげんは　ふかのうで
        じつは　ぜんしんに　うもうの　ような
        けが　あるのではという　せつがある。
      ja: |-
        完全な　復元は　不可能で
        実は　全身に　羽毛の　ような
        毛が　あるのではという　説がある。
      ko: |-
        완전한 복원은 불가능해서
        사실은 전신에 깃털 같은
        털이 있을 것이라는 설도 있다.
      zh-Hant: |-
        要完全復原牠是不可能的。
        有人說牠全身上下
        其實覆滿了羽毛般的體毛。
      zh-Hans: |-
        有说法，要完全复原是不可能的，
        实际上它全身都是羽毛一样的毛发。
      en: |-
        Complete restoration is impossible, allowing
        room for theories that its entire body was
        once covered in a feather-like coat.
      fr: |-
        La reconstitution de Pokémon est un art
        imparfait. D’aucuns pensent même qu’il était en
        fait couvert d’une robe semblable à un plumage.
      de: |-
        Es kann nicht originalgetreu aus Fossilien
        zurückverwandelt werden. Theorien zufolge
        umgab seinen Körper einst eine Art Federkleid.
      es: |-
        Según algunas teorías, este Pokémon no es una
        recreación exacta del de épocas pasadas, ya
        que debería estar recubierto de plumas.
      it: |-
        Sembra che non si riesca a rigenerarlo alla
        perfezione. Secondo alcune teorie il suo corpo
        era ricoperto da un manto simile a un piumaggio.
    ultra-moon:
      ja-Hrkt: |-
        こだいの　おうじゃ。　おおアゴの
        ちからは　すさまじく　じどうしゃも
        かんたんに　かみちぎってしまう。
      ja: |-
        古代の　王者。　大アゴの
        力は　凄まじく　自動車も
        簡単に　噛みちぎってしまう。
      ko: |-
        고대의 왕. 큰 턱은
        힘이 엄청나서 자동차도
        간단하게 물어뜯어 버린다.
      zh-Hant: |-
        古代的王者。
        大顎的力量非常驚人，
        連汽車也能輕易咬碎。
      zh-Hans: |-
        是古代的王者。
        大颚的力量很惊人，
        连汽车也能轻易咬碎。
      en: |-
        The king of the ancient world, it can easily
        crunch a car with the devastating strength
        of its enormous jaws.
      fr: |-
        Il régnait sur le monde en maître incontesté.
        Sa mâchoire est si puissante qu’il n’a aucun
        mal à croquer une voiture.
      de: |-
        Ein urzeitlicher Regent. Mit seinem extrem
        starken Kiefer kann Monargoras selbst Autos
        spielend leicht durchbeißen.
      es: |-
        Antaño era considerado un rey indiscutible. El
        brutal poder de su mandíbula le permite triturar
        un coche con suma facilidad.
      it: |-
        Regnava incontrastato nell’era preistorica.
        La sua enorme mandibola è così potente che
        può masticare facilmente anche un’automobile.
    sword:
      ja-Hrkt: |-
        やく１おくねんまえの　ポケモン。
        きょうぼうだが　どうどうとした
        ふるまいは　おうじゃの　ふうかく。
      ja: |-
        約１億年前の　ポケモン。
        凶暴だが　堂々とした　ふるまいは
        王者の　風格。
      ko: |-
        약 1억 년 전의 포켓몬이다.
        난폭하지만 당당하게 행동하는 모습은
        마치 왕의 품격을 지닌 듯하다.
      zh-Hant: |-
        大約１億年前的寶可夢。
        雖然凶暴，但威風堂堂，
        有王者的風範。
      zh-Hans: |-
        大约１亿年前的宝可梦。
        虽然凶暴，堂堂正正的
        举止却略显王者之风。
      en: |-
        This Pokémon is from about 100,000,000
        years ago. It has the presence of a king, vicious
        but magnificent.
      fr: |-
        Ce Pokémon a vécu il y a 100 millions d’années.
        Il est très violent, mais sa contenance noble lui
        donne des airs de royauté.
      de: |-
        Es lebte vor 100 Millionen Jahren. Sein brutales,
        aber imposantes Verhalten verleiht ihm eine
        königliche Ausstrahlung.
      es: |-
        Este Pokémon vivió hace cien millones de años.
        A pesar de su ferocidad, posee una firmeza y una
        presencia dignas de un rey.
      it: |-
        Questo Pokémon è esistito 100 milioni d’anni fa.
        È molto feroce, ma il suo atteggiamento solenne
        rivela una personalità degna di un re.
    shield:
      ja-Hrkt: |-
        おおあごは　ひとかみするだけで
        じどうしゃも　こなごなに　する。
        こだいの　せかいの　おうじゃ。
      ja: |-
        大顎は　ひと噛みするだけで
        自動車も　粉々に　する。
        古代の　世界の　王者。
      ko: |-
        큰 턱은 살짝 물기만 해도
        자동차를 산산조각 낸다.
        고대 세계의 왕이다.
      zh-Hant: |-
        只要牠的大顎一咬，
        就連汽車也會被粉碎。
        是古代世界的王者。
      zh-Hans: |-
        如果被它的大颚咬到，
        连汽车都会变得粉碎。
        是古代世界的王者。
      en: |-
        A single bite of Tyrantrum’s massive jaws will
        demolish a car. This Pokémon was the king of the
        ancient world.
      fr: |-
        Ce Pokémon peut réduire une voiture en miettes
        d’un seul coup de mâchoire. Il était considéré
        comme le roi du monde préhistorique.
      de: |-
        Ein Biss seines starken Kiefers reicht, um ein Auto
        zu zermalmen. Dieses Pokémon war der Regent
        der Urzeit.
      es: |-
        Puede hacer trizas un coche de un solo mordisco
        gracias a sus potentes mandíbulas. Antaño era
        considerado un rey.
      it: |-
        Grazie alla sua mandibola può ridurre in frantumi
        un’auto con un morso solo. Regnava incontrastato
        nell’era preistorica.
