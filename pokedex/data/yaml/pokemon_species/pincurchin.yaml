pincurchin:
  base_happiness: 50
  capture_rate: 75
  color: purple
  egg_groups:
    - water1
    - indeterminate
  evolution_chain: pincurchin
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        トゲの　さきから　でんきを　はなつ。
        するどい　はで　いわに　ついた
        かいそうを　こそいで　たべる。
      ja: |-
        棘の　先から　電気を　放つ。
        鋭い　歯で　岩に　ついた
        海藻を　こそいで　食べる。
      ko: |-
        가시 끝에서 전기를 발산한다.
        날카로운 이빨로 바위에 붙은
        해초를 갉아 먹는다.
      zh-Hant: |-
        能從刺的尖端放電。
        會用銳利的牙齒刮取
        附在岩石上的海藻來吃。
      zh-Hans: |-
        能从刺的尖端放电。
        会用锐利的牙齿刮取
        附在岩石上的海藻吃。
      en: |-
        It feeds on seaweed, using its teeth to scrape it
        off rocks. Electric current flows from the tips of
        its spines.
      fr: |-
        Il libère de l’électricité depuis la pointe de ses
        épines, et se nourrit des algues accrochées aux
        rochers en les arrachant avec ses dents aiguisées.
      de: |-
        Aus den Spitzen seiner Stacheln setzt es
        Elektrizität frei. Mit seinen scharfen Zähnen
        schabt es Algen von Steinen ab und frisst sie.
      es: |-
        Libera electricidad por la punta de las púas.
        Con sus afilados dientes raspa las algas pegadas
        a las rocas para ingerirlas.
      it: |-
        Sprigiona elettricità dalla punta dei suoi aculei.
        Usa i denti affilati per raschiare dalle rocce
        le alghe di cui si nutre.
    shield:
      ja-Hrkt: |-
        トゲの　１ぽん　１ぽんに　でんきを
        たくわえる。　おれた　トゲでも
        ３じかんは　ほうでんを　つづけるぞ。
      ja: |-
        棘の　１本　１本に　電気を
        蓄える。　折れた　棘でも
        ３時間は　放電を　続けるぞ。
      ko: |-
        가시 하나하나에 전기를
        비축하고 있다. 부러진 가시도
        3시간 동안 방전을 계속한다.
      zh-Hant: |-
        每根刺裡都儲存著電力。
        即使是折斷的刺也至少
        能持續放電３小時。
      zh-Hans: |-
        每根刺里都储存着电力。
        即使是折断的刺也至少
        能连续放电３小时。
      en: |-
        It stores electricity in each spine. Even if one gets
        broken off, it still continues to emit electricity for
        at least three hours.
      fr: |-
        Chacune de ses épines est chargée en électricité.
        S’il en perd une, celle-ci continue d’émettre
        un courant électrique pendant trois heures.
      de: |-
        In jedem einzelnen seiner Stacheln speichert es
        Elektrizität. Selbst abgebrochene Stacheln sind
        noch drei Stunden lang geladen.
      es: |-
        Acumula electricidad en cada una de sus púas.
        Aunque estas se rompan, son capaces de seguir
        descargando energía durante 3 h.
      it: |-
        Ogni singolo aculeo è carico di elettricità.
        Quando se ne rompe uno, continua a emettere
        scariche elettriche per tre ore.
