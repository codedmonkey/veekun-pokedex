        Quando si sente minacciato si illumina.
    alpha-sapphire:
      ja-Hrkt: |-
        きけんを　かんじると　ぜんしんの
        たいもうが　ひかる。あいてが　めを
        くらませている　あいだに　にげる。
      ja: |-
        危険を　感じると　全身の
        体毛が　光る。相手が　目を
        くらませている　あいだに　逃げる。
      ko: |-
        위험을 느끼면 전신의 털이
        빛난다. 그로 인해 상대가 앞을
        보지 못하는 동안 도망친다.
      en: |-
        All of its fur dazzles if danger is sensed. It flees
        while the foe is momentarily blinded.
      fr: |-
        Sa fourrure étincelle en cas de danger. Il profite du fait que
        l’ennemi est aveuglé pour s’enfuir.
      de: |-
        In Gefahr blendet es seinen Gegner mit seinem Fell und flieht,
        während der Gegner einen Moment blind ist.
      es: |-
        Si siente peligro, todo su pelaje brilla. Aprovecha la ceguera
        temporal de su rival para huir.
      it: |-
        In caso di pericolo, la sua pelliccia si illumina. Il nemico rimane
        accecato e lui ne approfitta per fuggire.
    sword:
      ja-Hrkt: |-
        きんにくの　しゅうしゅくで　でんきを
        つくる。　むしゃぶるいは　はげしく
        はつでんしている　しょうこ。
      ja: |-
        筋肉の　収縮で　電気を　つくる。
        武者震いは　激しく
        発電している　証拠。
      ko: |-
        근육을 수축해서 전기를 만든다.
        몸을 떠는 것은 격렬하게
        전기를 발생시키고 있다는 증거다.
      zh-Hant: |-
        能利用肌肉的伸縮來產生
        電流。當牠全身都在抖動時，
        就代表牠正在激烈地發電。
      zh-Hans: |-
        靠伸缩肌肉来制造电能。
        如果看到它兴奋地浑身颤抖，
        就说明它正在猛烈发电。
      en: |-
        This Pokémon generates electricity by contracting
        its muscles. Excited trembling is a sign that Shinx
        is generating a tremendous amount of electricity.
      fr: |-
        Il produit de l’électricité en contractant ses
        muscles. S’il tremble d’excitation, c’est le signe
        qu’il est en train d’en générer en grande quantité.
      de: |-
        Durch Muskelkontraktionen erzeugt es Strom.
        Heftiges Zittern ist bei Sheinux ein Anzeichen
        dafür, dass es sehr viel Elektrizität generiert.
      es: |-
        Produce energía eléctrica al contraer los
        músculos. Si tiembla de emoción, significa que
        está generando gran cantidad de electricidad.
      it: |-
        Produce elettricità contraendo i muscoli.
        Quando è scosso da tremiti, è segno che
        ne sta generando in notevole quantità.
    shield:
      ja-Hrkt: |-
        たいもうが　でんきで　はっこうする。
        あかるく　ひかる　しっぽの　さきを
        ふって　なかまに　サインを　おくる。
      ja: |-
        体毛が　電気で　発光する。
        明るく　光る　しっぽの　先を　振って
        仲間に　サインを　送る。
      ko: |-
        털이 전기로 빛난다.
        밝게 빛나는 꼬리 끝을 흔들어
        동료에게 신호를 보낸다.
      zh-Hant: |-
        體毛通電就會發光。
        會揮動明亮發光的尾巴
        前端來向夥伴打信號。
      zh-Hans: |-
        体毛通电后就会发光。
        会摇晃明亮发光的尾巴
        尖端来向伙伴发送信号。
      en: |-
        Electricity makes this Pokémon’s fur glow. Shinx
        sends signals to others of its kind by shaking the
        tip of its tail while the tail tip is shining brightly.
      fr: |-
        Sa fourrure s’illumine grâce à l’électricité.
        Il agite l’extrémité lumineuse de sa queue
        pour envoyer des signes à ses congénères.
      de: |-
        Es bringt sein Fell mit Elektrizität zum Glühen.
        Um seinen Artgenossen Signale zu übermitteln,
        wedelt es mit seiner leuchtenden Schweifspitze.
      es: |-
        Su pelaje brilla gracias a la electricidad. Envía
        señales a sus semejantes agitando la punta
        luminosa de la cola.
      it: |-
        La sua pelliccia irradia luce per via
        dell’elettricità. Invia segnali ai suoi simili
        agitando la punta luminosa della coda.
    legends-arceus:
      en: |-
        Shakes its body to generate electricity. Its stature belies its
        aggression—one must be patient to tame this Pokémon.
