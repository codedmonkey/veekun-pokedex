    x:
      ja-Hrkt: |-
        からだを　うごかすたびに　きんにくが
        のびちぢみして　でんきが　うまれる。
        ピンチになると　からだが　かがやく。
      ja: |-
        体を　動かすたびに　筋肉が
        伸び縮みして　電気が　生まれる。
        ピンチになると　体が　輝く。
      ko: |-
        몸을 움직일 때마다 근육이 늘어났다
        줄어들었다 하여 전기가 발생한다.
        궁지에 몰리면 몸이 빛난다.
      en: |-
        The extension and contraction of its muscles
        generates electricity. It glows when in trouble.
      fr: |-
        Ses muscles génèrent un courant électrique lorsqu’ils
        travaillent. Il s’illumine en cas de danger.
      de: |-
        Es erzeugt Elektrizität durch das Strecken und
        Zusammenziehen seiner Muskeln. Bei Bedrohung
        glüht es.
      es: |-
        La extensión y contracción de sus músculos genera
        electricidad. Brilla cuando está en peligro.
      it: |-
        Produce elettricità contraendo e rilassando i muscoli.
        Quando si sente minacciato si illumina.
    'y':
      ja-Hrkt: |-
        きけんを　かんじると　ぜんしんの
        たいもうが　ひかる。あいてが　めを
        くらませている　あいだに　にげる。
      ja: |-
        危険を　感じると　全身の
        体毛が　光る。相手が　目を
        くらませている　あいだに　逃げる。
      ko: |-
        위험을 느끼면 전신의 털이
        빛난다. 그로 인해 상대가 앞을
        보지 못하는 동안 도망친다.
      en: |-
        All of its fur dazzles if danger is sensed. It flees
        while the foe is momentarily blinded.
      fr: |-
        Sa fourrure étincelle en cas de danger. Il profite du
        fait que l’ennemi est aveuglé pour s’enfuir.
      de: |-
        In Gefahr blendet es seinen Gegner mit seinem Fell
        und flieht, während der Gegner einen Moment
        blind ist.
      es: |-
        Si siente peligro, todo su pelaje brilla. Aprovecha la
        ceguera temporal de su rival para huir.
      it: |-
        In caso di pericolo, la sua pelliccia si illumina. Il
        nemico rimane accecato e lui ne approfitta per fuggire.
    omega-ruby:
      ja-Hrkt: |-
        からだを　うごかすたびに　きんにくが
        のびちぢみして　でんきが　うまれる。
        ピンチになると　からだが　かがやく。
      ja: |-
