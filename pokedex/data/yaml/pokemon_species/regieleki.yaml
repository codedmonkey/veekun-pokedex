regieleki:
  base_happiness: 35
  capture_rate: 3
  color: yellow
  egg_groups:
    - no-eggs
  evolution_chain: regieleki
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        でんきエネルギーの　かたまり。
        からだの　リングを　はずすと　ひめた
        ちからが　ときはなたれるらしい。
      ja: |-
        電気エネルギーの　塊。
        体の　リングを　外すと　秘めた
        力が　解き放たれるらしい。
      ko: |-
        전기 에너지 덩어리다.
        몸에 있는 링을 해제하면
        숨겨진 힘이 해방된다고 한다.
      zh-Hant: |-
        由電能凝聚而成的寶可夢。
        據說拿下牠身上的圓環後，
        就會解放牠潛藏的力量。
      zh-Hans: |-
        由电能聚集而成。
        据说在解开身上的圆环后
        会释放出隐藏的力量。
      en: |-
        This Pokémon is a cluster of electrical energy.
        It’s said that removing the rings on Regieleki’s
        body will unleash the Pokémon’s latent power.
      fr: |-
        Son corps est un véritable concentré d’énergie
        électrique. On raconte que si on lui retire
        ses anneaux, sa puissance cachée se libère.
      de: |-
        Es besteht aus gebündelter elektrischer Energie.
        Werden die Ringe an seinem Körper entfernt,
        setzt das angeblich seine verborgenen Kräfte frei.
      es: |-
        Su cuerpo entero es energía eléctrica. Por lo
        visto, quitarle los anillos que lleva libera su
        poder oculto.
      it: |-
        È un agglomerato di energia elettrica. Si dice
        che rimuovere gli anelli che ha attorno al corpo
        liberi la sua potenza latente.
    shield:
      ja-Hrkt: |-
        ぜんしんが　でんきエネルギーを
        つくる　きかん。　ガラルぜんどの
        でんきを　つくりだすことができる。
      ja: |-
        全身が　電気エネルギーを
        作る　器官。　ガラル全土の
        電気を　作りだすことができる。
      ko: |-
        온몸이 전기 에너지를 만드는 기관이다.
        가라르 전 지역에서 사용하는 양의
        전기를 만들어 낼 수 있다.
      zh-Hant: |-
        全身都是能發電的器官。
        牠製造的電能可以滿足
        伽勒爾全域的電力需求。
      zh-Hans: |-
        整个身体是制造电能的
        器官。可以制造出
        伽勒尔全域所需的电力。
      en: |-
        Its entire body is made up of a single organ that
        generates electrical energy. Regieleki is capable
        of creating all Galar’s electricity.
      fr: |-
        Son corps est entièrement composé d’organes
        générant de l’électricité. Il peut produire
        assez d’énergie pour alimenter tout Galar.
      de: |-
        Sein Körper besteht aus einem Organ, das
        elektrische Energie erzeugt. Regieleki kann genug
        Strom produzieren, um ganz Galar zu versorgen.
      es: |-
        Todo su cuerpo es un órgano electrógeno, cuya
        potencia sería suficiente para abastecer la región
        de Galar por completo.
      it: |-
        Il suo corpo è costituito interamente da un
        organo che produce energia elettrica.
        Fornisce corrente all’intera regione di Galar.
