arctozolt:
  base_happiness: 50
  capture_rate: 45
  color: blue
  egg_groups:
    - no-eggs
  evolution_chain: arctozolt
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        こおりづけの　じょうはんしんが
        ふるえると　でんきが　つくられる。
        あるくことが　ひじょうに　にがて。
      ja: |-
        氷漬けの　上半身が
        震えると　電気が　つくられる。
        歩くことが　非常に　苦手。
      ko: |-
        꽁꽁 언 상반신이 진동하면
        전기가 만들어진다.
        걷는 것이 매우 서툴다.
      zh-Hant: |-
        牠凍成冰的上半身
        在顫抖時可以產生電能。
        非常不擅長走路。
      zh-Hans: |-
        它冻成冰的上半身
        在颤抖后可以产生电能。
        非常不擅长走路。
      en: |-
        The shaking of its freezing upper half is what
        generates its electricity. It has a hard time
        walking around.
      fr: |-
        Quand la partie supérieure de son corps, couverte
        de glace, frissonne, il produit de l’électricité.
        Il éprouve de grandes difficultés à marcher.
      de: |-
        Durch das Zittern seines gefrorenen Oberkörpers
        entsteht Elektrizität. Das Laufen fällt ihm äußerst
        schwer.
      es: |-
        La parte superior del cuerpo está congelada y,
        al temblar, genera electricidad. Camina con suma
        dificultad.
      it: |-
        La parte superiore del suo corpo è ghiacciata
        e quando trema produce elettricità. Cammina
        con estrema difficoltà.
    shield:
      ja-Hrkt: |-
        こだいの　うみべで　くらし　エサを
        からだの　こおりで　ほぞん　できたが
        うごきが　にぶいため　ぜつめつした。
      ja: |-
        古代の　海辺で　暮らし　餌を
        体の　氷で　保存できたが
        動きが　鈍いため　絶滅した。
      ko: |-
        고대의 해변에 살며 먹이를
        몸의 얼음으로 보존시켰지만
        움직임이 둔해 멸종하였다.
      zh-Hant: |-
        曾經生活在古代的海邊，
        能用身體的冰來保存食物，
        但由於動作太遲緩而滅絕了。
      zh-Hans: |-
        曾经生活在古代的海边，
        能用身体的冰来保存食物，
        但由于动作太迟缓而灭绝了。
      en: |-
        This Pokémon lived on prehistoric seashores and
        was able to preserve food with the ice on its
        body. It went extinct because it moved so slowly.
      fr: |-
        Autrefois, il vivait en bord de mer et conservait
        sa nourriture dans la glace de son corps,
        mais il s’est éteint, car il avait du mal à se déplacer.
      de: |-
        In der Urzeit lebte es am Strand und konnte mit
        seinem kalten Körper Futter haltbar machen.
        Es starb wegen seiner trägen Bewegungen aus.
      es: |-
        Antiguamente vivía en el mar y usaba el hielo del
        cuerpo para conservar los alimentos. Su extrema
        lentitud, sin embargo, lo condenó a la extinción.
      it: |-
        Anticamente viveva in riva al mare conservando
        il cibo grazie al ghiaccio del suo corpo, ma si è
        estinto a causa della sua estrema lentezza.
