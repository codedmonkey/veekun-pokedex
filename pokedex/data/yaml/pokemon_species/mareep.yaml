        and the tip of its tail glows slightly.
    x:
      ja-Hrkt: |-
        ふわふわの　たいもうは　せいでんきが
        たまると　２ばいに　ふくらむ。
        さわると　かんでんしてしまう。
      ja: |-
        ふわふわの　体毛は　静電気が
        たまると　２倍に　ふくらむ。
        触ると　感電してしまう。
      ko: |-
        푹신푹신한 털은 정전기가
        쌓이면 2배로 부풀어 오른다.
        만지면 감전되어 버린다.
      en: |-
        Its fluffy coat swells to double when static
        electricity builds up. Touching it can be shocking.
      fr: |-
        Sa laine fournie enfle lorsqu’il accumule de
        l’électricité statique. Son contact peut choquer.
      de: |-
        Sein weiches Fell wird doppelt so dick,
        wenn sich Elektrizität aufbaut.
      es: |-
        Su pelaje lanudo dobla su volumen al acumular
        electricidad estática. Tocarlo puede dar calambre.
      it: |-
        Se il manto è carico d’elettricità, le sue dimensioni
        raddoppiano e può dare la scossa.
    'y':
      ja-Hrkt: |-
        ふかふかの　たいもうは　くうきを
        たくさん　ふくんで　なつは　すずしく
        ふゆは　あたたかいのが　とくちょう。
      ja: |-
        ふかふかの　体毛は　空気を
        たくさん　含んで　夏は　涼しく
        冬は　温かいのが　特徴。
      ko: |-
        푹신푹신한 털은 공기를
        가득 품고 있어 여름은 시원하고
        겨울은 따뜻한 것이 특징이다.
      en: |-
        It stores lots of air in its soft fur, allowing it to stay
        cool in summer and warm in winter.
      fr: |-
        Il garde une grande quantité d’air dans sa toison pour
        ne pas subir les variations de température.
      de: |-
        Es speichert viel Luft in seinem weichen Pelz.
        Dadurch ist es im Sommer kalt und im Winter warm.
      es: |-
        Almacena aire en el lanudo pelaje que tiene. Así, se
        mantiene fresco en verano y caliente en invierno.
      it: |-
        L’aria che raccoglie nella pelliccia gli permette di
        stare fresco d’estate e caldo d’inverno.
    omega-ruby:
      ja-Hrkt: |-
        たいもうが　こすれて　せいでんきが　たまる。
        でんりょくが　たくさん　たまるほど　しっぽの
        さきに　ついた　でんきゅうが　あかるく　ひかる。
      ja: |-
        体毛が　こすれて　静電気が　たまる。
        電力が　沢山　たまるほど　尻尾の
        先に　ついた　電球が　明るく　光る。
      ko: |-
        털의 마찰로 정전기가 모인다.
        전력이 많이 모일수록 꼬리
        끝에 붙은 전구가 밝게 빛난다.
      en: |-
        Mareep’s fluffy coat of wool rubs together and builds a static
        charge. The more static electricity is charged, the more brightly
        the lightbulb at the tip of its tail glows.
      fr: |-
        L’épaisse fourrure cotonneuse de Wattouat se charge
        d’électricité statique lorsqu’on la frotte. Plus elle est chargée,
        plus l’ampoule au bout de sa queue est lumineuse.
      de: |-
        Voltilamms flauschiges, wollenes Fell erzeugt Reibung und
        statische Aufladung. Je höher die elektrische Ladung wird,
        desto heller leuchtet die Glühbirne an seinem Schweif.
      es: |-
        Mareep tiene un pelaje lanudo suave que produce carga
        estática por el roce. Cuanto más se carga de electricidad
        estática, más brilla la bombilla que tiene en el extremo de la
        cola.
      it: |-
        Il morbido manto lanoso di Mareep genera una carica
        elettrostatica mediante sfregamento. La luminosità
        della lampadina sulla punta della coda dipende dalla
        potenza della carica elettrica.
    alpha-sapphire:
      ja-Hrkt: |-
        たいもうが　こすれて　せいでんきが　たまる。
        でんりょくが　たくさん　たまるほど　しっぽの
        さきに　ついた　でんきゅうが　あかるく　ひかる。
      ja: |-
        体毛が　こすれて　静電気が　たまる。
        電力が　沢山　たまるほど　尻尾の
        先に　ついた　電球が　明るく　光る。
      ko: |-
        털의 마찰로 정전기가 모인다.
        전력이 많이 모일수록 꼬리
        끝에 붙은 전구가 밝게 빛난다.
      en: |-
        Mareep’s fluffy coat of wool rubs together and builds a static
        charge. The more static electricity is charged, the more brightly
        the lightbulb at the tip of its tail glows.
      fr: |-
        L’épaisse fourrure cotonneuse de Wattouat se charge
        d’électricité statique lorsqu’on la frotte. Plus elle est chargée,
        plus l’ampoule au bout de sa queue est lumineuse.
      de: |-
        Voltilamms flauschiges, wollenes Fell erzeugt Reibung und
        statische Aufladung. Je höher die elektrische Ladung wird,
        desto heller leuchtet die Glühbirne an seinem Schweif.
      es: |-
        Mareep tiene un pelaje lanudo suave que produce carga
        estática por el roce. Cuanto más se carga de electricidad
        estática, más brilla la bombilla que tiene en el extremo de la
        cola.
      it: |-
        Il morbido manto lanoso di Mareep genera una carica
        elettrostatica mediante sfregamento. La luminosità
        della lampadina sulla punta della coda dipende dalla
        potenza della carica elettrica.
    ultra-sun:
      ja-Hrkt: |-
        メリープの　けで　つくった　いふくは
        せいでんきが　たまりやすい　ので
        とくしゅな　かこうが　されている。
      ja: |-
        メリープの　毛で　作った　衣服は
        静電気が　たまりやすい　ので
        特殊な　加工が　されている。
      ko: |-
        메리프의 털로 만든 의복은
        정전기가 잘 일어나기 때문에
        특수한 가공이 되어 있다.
      zh-Hant: |-
        用咩利羊的毛製成的
        衣服很容易起靜電，
        所以會經過特殊加工。
      zh-Hans: |-
        用咩利羊的毛制成的
        衣服容易起静电，
        所以会做特殊加工。
      en: |-
        Clothing made from Mareep’s fleece is easily
        charged with static electricity, so a special
        process is used on it.
      fr: |-
        En raison de leur tendance à stocker l’électricité
        statique, les vêtements en laine de Wattouat
        subissent un traitement spécial.
      de: |-
        Kleidung aus Voltilamms Wolle erfordert eine
        spezielle Verarbeitung, da sie ansonsten zu
        elektrostatischer Aufladung neigt.
      es: |-
        Las prendas elaboradas con la lana de Mareep
        se cargan fácilmente de electricidad estática y
        requieren de tratamientos especiales.
      it: |-
        Gli indumenti fatti con lana di Mareep si caricano
        molto facilmente di elettricità statica e per
        questo necessitano di un trattamento speciale.
    ultra-moon:
      ja-Hrkt: |-
        わたげが　こすれ　でんきが　たまる。
        かわいいからと　すでで　さわると
        バチッと　しびれて　いたいのだ。
      ja: |-
        綿毛が　こすれ　電気が　たまる。
        かわいいからと　素手で　触ると
        バチッと　痺れて　痛いのだ。
      ko: |-
        솜털이 마찰하여 전기가 모인다.
        귀엽다고 맨손으로 만지면
        따끔하게 저리고 아프다.
      zh-Hant: |-
        會累積絨毛摩擦時所產生的電力。
        如果因為牠可愛而直接用手去摸，
        就會被電得又麻又痛。
      zh-Hans: |-
        绒毛摩擦产生的电力会被储存起来。
        如果觉得可爱而直接用手碰它的话，
        就会被啪地一下电得又麻又痛。
      en: |-
        Rubbing its fleece generates electricity.
        You’ll want to pet it because it’s cute, but if you
        use your bare hand, you’ll get a painful shock.
      fr: |-
        Il a beau être mignon, sa laine génère de
        l’électricité quand on la frotte. Tentez de le
        caresser, et il vous mettra vite au courant !
      de: |-
        Seine Wolle lädt sich durch Reibung elektrisch
        auf. Streichelt man dieses süße Pokémon mit
        bloßer Hand, bekommt man einen Elektroschock.
      es: |-
        Su lana acumula electricidad estática con la
        fricción. Al ser tan adorable, la gente se acerca
        para acariciarlo y se lleva un doloroso chispazo.
      it: |-
        La lana di Mareep genera elettricità se sfregata.
        Chi lo tocca a mani nude, tentato dal suo
        aspetto adorabile, riceve una dolorosa scossa.
