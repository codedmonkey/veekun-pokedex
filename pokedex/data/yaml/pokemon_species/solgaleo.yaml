solgaleo:
  base_happiness: 0
  capture_rate: 45
  color: white
  egg_groups:
    - no-eggs
  evolution_chain: cosmog
  evolves_from: cosmoem
  flavor_text:
    sun:
      ja-Hrkt: |-
        べつせかいに　すむと　いわれる。
        ぜんしんから　はげしいひかりを　はなち
        やみよも　まひるのように　てらすのだ。
      ja: |-
        別世界に　棲むと　いわれる。
        全身から　激しい光を　放ち
        闇夜も　真昼のように　照らすのだ。
      ko: |-
        다른 세계에 산다고 전해진다.
        온몸에서 격렬한 빛을 내뿜어
        깜깜한 밤도 한낮처럼 비춘다.
      zh-Hant: |-
        傳說中棲息在另一個世界裡。
        當全身釋放出強烈的光芒時，
        能將暗夜照亮如白晝。
      zh-Hans: |-
        据说是栖息在其他世界的。
        全身放出猛烈的光芒，
        即使是暗夜也会照得如同白昼。
      en: |-
        It is said to live in another world. The intense
        light it radiates from the surface of its body can
        make the darkest of nights light up like midday.
      fr: |-
        Il viendrait d’un autre monde. Tout son corps
        émet une puissante lumière qui peut changer
        la nuit la plus noire en un jour radieux.
      de: |-
        Es heißt, es komme aus einer anderen Welt.
        Sein ganzer Körper leuchtet strahlend hell
        und macht die finsterste Nacht zum Tage.
      es: |-
        Se cree que proviene de otro mundo. El brillo
        que emite su cuerpo es tal que puede hacer
        que la noche más profunda parezca pleno día.
      it: |-
        Si dice che viva in un altro mondo. Dal corpo
        emette una luce così accecante da illuminare
        a giorno anche la notte più buia.
    moon:
      ja-Hrkt: |-
        コスモッグが　しんかした　♂だと
        いわれる。　だい３の　めが　うかぶとき
        べつせかいへと　かけぬけていく。
      ja: |-
        コスモッグが　進化した　♂だと
        いわれる。　第３の　眼が　浮かぶとき
        別世界へと　駆け抜けていく。
      ko: |-
        코스모그가 진화한 수컷이라고
        전해진다. 제3의 눈이 뜰 때
        다른 세계로 달려나간다.
      zh-Hant: |-
        據說是科斯莫古進化後的♂。
        當第３隻眼浮現時，
        就會奔向其他世界。
      zh-Hans: |-
        据说是科斯莫古进化后的♂。
        当第３只眼浮现时，
        就会奔向其他世界。
      en: |-
        This Pokémon is said to be a male evolution of
        Cosmog. At the activation of its third eye, it
        departs for another world.
      fr: |-
        On suppose que c’est l’évolution de Cosmog
        lorsqu’il s’agit d’un mâle. Son troisième œil
        apparaît quand il s’en va vers un autre monde.
      de: |-
        Es heißt, es sei die männliche Endstufe der
        Entwicklungsreihe von Cosmog. Ist sein drittes
        Auge aktiviert, zieht es in eine andere Welt.
      es: |-
        Se dice que es la evolución final macho de
        Cosmog. Cuando su tercer ojo se abre, parte
        hacia otro mundo.
      it: |-
        Si dice che sia l’evoluzione maschile di Cosmog.
        Quando il suo terzo occhio si manifesta, significa
        che è in viaggio verso un altro mondo.
    ultra-sun:
      ja-Hrkt: |-
        ウルトラホールを　ひらいた　けっか
        いせかいの　エネルギーや　せいめいを
        このせかいに　よぶことも　あるのだ。
      ja: |-
        ウルトラホールを　開いた　結果
        異世界の　エネルギーや　生命を
        この世界に　呼ぶことも　あるのだ。
      ko: |-
        울트라홀을 연 결과
        다른 세계의 에너지나 생명을
        이 세계로 부르기도 한다.
      zh-Hant: |-
        打開究極之洞的後果，
        是有可能把異世界的能量和生命
        召喚到這個世界來。
      zh-Hans: |-
        打开了究极之洞的结果是，
        把异世界的能量和生命召唤到
        这个世界的事也时有发生。
      en: |-
        Sometimes the result of its opening an Ultra
        Wormhole is that energy and life-forms from
        other worlds are called here to this world.
      fr: |-
        Lorsqu’il ouvre une Ultra-Brèche, il arrive que
        de l’énergie et des formes de vie d’autres
        mondes se retrouvent dans le nôtre.
      de: |-
        Öffnet es eine Ultrapforte, ebnet es mitunter
        für fremde Energie und Lebewesen den Weg in
        unsere Welt.
      es: |-
        Es capaz de crear Ultraumbrales a través de los
        cuales formas de vida y energía procedentes de
        otros mundos acuden al nuestro.
      it: |-
        A volte gli Ultravarchi che apre servono da
        passaggio verso il nostro mondo per energia
        e forme di vita.
    ultra-moon:
      ja-Hrkt: |-
        はるか　おおむかしの　ぶんけんに
        たいようを　くらいし　けものと　いう
        なまえで　きろくが　のこっている。
      ja: |-
        遥か　大昔の　文献に
        太陽を　喰らいし　獣と　いう
        名前で　記録が　残っている。
      ko: |-
        아득히 먼 옛날의 문헌에
        태양을 삼키는 짐승이라는
        이름으로 기록이 남아 있다.
      zh-Hant: |-
        在遙遠過去的文獻中，
        留有牠是吞食太陽之獸
        的相關紀錄。
      zh-Hans: |-
        在遥远过去的文献里，
        以吞食太阳之兽为名留下了记录。
      en: |-
        In writings from the distant past, it’s called by
        the name “the beast that devours the sun.”
      fr: |-
        Des documents extrêmement anciens
        le décrivent comme « celui qui dévore le soleil ».
      de: |-
        In Schriftstücken aus längst vergangenen
        Zeiten wird es als „Sonnenverschlinger“
        bezeichnet.
      es: |-
        Aparece en obras de la literatura antigua en las
        que se refieren a él como “la criatura que se
        nutre del sol”.
      it: |-
        In antichissimi documenti si parla di lui come
        della “creatura che si nutre di sole”.
    sword:
      ja-Hrkt: |-
        ぜんしんから　ひかりを　はっして
        まるで　たいようの　すがたになると
        やみを　けして　せかいを　てらす。
      ja: |-
        全身から　光を　発して
        まるで　太陽の　姿になると
        闇を　消して　世界を　照らす。
      ko: |-
        전신에서 빛을 발산해서
        마치 태양 같은 모습이 되면
        어둠을 물리치고 세상을 비춘다.
      zh-Hant: |-
        當牠全身放出猛烈的光芒，
        變成如同太陽一般的身姿時，
        便會抹去黑暗，照亮世界。
      zh-Hans: |-
        当它全身放出猛烈的光芒，
        变成如同太阳一般的身姿时，
        便会抹去黑暗，照亮世界。
      en: |-
        When light radiates from its body, this Pokémon
        could almost appear to be the sun. It will dispel
        any darkness and light up the world.
      fr: |-
        Quand tout son corps émet de la lumière
        et qu’il prend la forme du soleil, il peut repousser
        les ténèbres et illuminer le monde.
      de: |-
        Wenn sein ganzer Körper Licht ausstrahlt, nimmt
        es eine sonnenähnliche Gestalt an, und kann so
        das Dunkel vertreiben und die Welt erhellen.
      es: |-
        Es capaz de eliminar toda oscuridad e iluminar el
        mundo entero irradiando luz por todo el cuerpo
        como si de un sol se tratara.
      it: |-
        Il suo corpo emette una luce abbagliante che,
        al pari del sole, è in grado di spazzare via
        le tenebre e illuminare il mondo.
    shield:
      ja-Hrkt: |-
        たいようを　くらいし　けもの　と
        かつて　よばれた。　むじんぞうの
        ひかりエネルギーを　ほうしゅつする。
      ja: |-
        太陽を　食らいし　獣　と
        かつて　呼ばれた。　無尽蔵の
        光エネルギーを　放出する。
      ko: |-
        태양을 삼키는 짐승이라고
        불렸다. 굉장한 양의
        빛 에너지를 방출한다.
      zh-Hant: |-
        曾經被稱為
        吞食太陽之獸。
        能釋放出無盡的光能。
      zh-Hans: |-
        曾经被称为
        吞食太阳之兽。
        能释放出无尽的光能。
      en: |-
        Solgaleo was once known as the Beast That
        Devours the Sun. Energy in the form of light
        radiates boundlessly from it.
      fr: |-
        Jadis, on le surnommait « celui qui dévore
        le soleil ». Une lumière inextinguible rayonne
        de son corps.
      de: |-
        Einst wurde es „Sonnenverschlinger“ genannt.
        Es strahlt unerschöpfliche Lichtenergie aus.
      es: |-
        Antiguamente era conocido como la Criatura
        que se Nutre del Sol. Emite sin cesar una energía
        luminosa.
      it: |-
        Un tempo veniva chiamato “la creatura che
        si nutre di sole”. Emana dal corpo un’energia
        luminosa inesauribile.
