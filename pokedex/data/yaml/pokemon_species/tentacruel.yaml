    sapphire:
      en: |-
        TENTACRUEL has tentacles that can be
        freely elongated and shortened at will.
        It ensnares prey with its tentacles andweakens the prey by dosing it with a
        harsh toxin. It can catch up to 80
        prey at the same time.
    emerald:
      en: |-
        It lives in complex rock formations on
        the ocean floor and traps prey using its
        80 tentacles. Its red orbs glow when it
        grows excited or agitated.
    firered:
      en: |-
        It has 80 tentacles that move about
        freely. They can sting, causing poisoning
        and sharp, stabbing pain.
    leafgreen:
      en: |-
        The tentacles are normally kept short.
        On hunts, they are extended to ensnare
        and immobilize prey.
    diamond:
      en: |-
        With 80 tentacles for ensnaring
        victims, it prevents escape until
        the prey is weakened by poison.
    pearl:
      en: |-
        It alerts others to danger by
        stridently flashing the red orbs
        on its head.
    platinum:
      en: |-
        It extends its 80 tentacles to
        form an encircling poisonous net
        that is difficult to escape.
    heartgold:
      en: |-
        Its 80 tentacles absorb water and
        stretch almost endlessly to
        constrict its prey and enemies.
    soulsilver:
      en: |-
        In battle, it extends all 80 of
        its tentacles to entrap its opponent
        inside a poisonous net.
    black:
      en: |-
        It extends its 80 tentacles to
        form an encircling poisonous net
        that is difficult to escape.
      fr: |-
        Ses 80 tentacules lui permettent
        d’emprisonner ses adversaires
        dans un redoutable filet venimeux.
    white:
      en: |-
        It extends its 80 tentacles to
        form an encircling poisonous net
        that is difficult to escape.
      fr: |-
        Ses 80 tentacules lui permettent
        d’emprisonner ses adversaires
        dans un redoutable filet venimeux.
    black-2:
      en: |-
        It extends its 80 tentacles to
        form an encircling poisonous net
        that is difficult to escape.
    white-2:
      en: |-
        It extends its 80 tentacles to
        form an encircling poisonous net
        that is difficult to escape.
    x:
      ja-Hrkt: |-
        しょくしゅは　ふだん　みじかくて
        えものを　さすときに　ながく
        のびて　からみつくのだ。
      ja: |-
        触手は　普段　短くて
        獲物を　刺すときに
        長く　伸びて　絡みつくのだ。
      ko: |-
        촉수는 평소에는 짧고
        먹이를 찌를 때
        길게 늘어나 휘감는다.
      en: |-
        The tentacles are normally kept short. On hunts,
        they are extended to ensnare and immobilize prey.
      fr: |-
        Ses tentacules sont rétractés au repos. En situation
        de chasse, ils s’allongent pour prendre ses proies
        au piège.
      de: |-
        Dieses Pokémon kann die Tentakel bei der Jagd
        ausfahren, um die Beute leichter zu fangen.
      es: |-
        Cuando caza, extiende los cortos tentáculos que tiene
        para atrapar e inmovilizar a su presa.
      it: |-
        I corti tentacoli si estendono durante la caccia
        per catturare e immobilizzare la preda.
    'y':
      ja-Hrkt: |-
        ８０ぽん　の　しょくしゅが　じゆうに
        うごく。さされると　どくに　おかされ
        するどい　いたみが　はしる。
      ja: |-
        ８０本の　触手が　自由に　動く。
        刺されると　毒に　侵され
        鋭い　痛みが　走る。
      ko: |-
        80개의 촉수를 자유롭게
        움직인다. 찔리면 독이 퍼져
        극심한 고통을 겪게 된다.
      en: |-
        It has 80 tentacles that move about freely.
        They can sting, causing poisoning and sharp,
        stabbing pain.
      fr: |-
        Les 80 tentacules que Tentacruel laisse s’agiter
        lui permettent d’injecter du poison dans le corps
        de ses ennemis mais aussi de les trancher.
      de: |-
        Es verfügt über 80 Tentakel, die es frei bewegen kann.
        Damit kann es zustechen und so Vergiftung und starke
        Schmerzen verursachen.
      es: |-
        Tiene 80 tentáculos que se mueven a su aire. Con
        ellos, pica, envenena y causa un dolor agudo e
        intenso.
      it: |-
        Il contatto con i suoi 80 tentacoli, che si muovono
        liberamente, avvelena la vittima e causa un dolore
        lancinante.
    omega-ruby:
      ja-Hrkt: |-
        あたまの　あかい　たまが　ひかるとき　はげしい
        ちょうおんぱが　あたりに　はっしゃ　される。
        そのとき　かいめんが　はげしく　なみうつという。
      ja: |-
        頭の　赤い　玉が　光るとき　激しい
        超音波が　あたりに　発射　される。
        そのとき　海面が　激しく　波打つという。
      ko: |-
        머리의 붉은 구슬이 반짝일 때 격렬한
        초음파가 주변에 발사된다.
        그때 바다가 격렬히 파도친다고 한다.
      en: |-
        Tentacruel has large red orbs on its head. The orbs glow
        before lashing the vicinity with a harsh ultrasonic blast.
        This Pokémon’s outburst creates rough waves around it.
      fr: |-
        Tentacruel a deux gros globes sur la tête. Les globes
        s’illuminent lorsqu’il va envoyer un violent rayon d’ultrasons.
        Lorsque ce Pokémon se déchaîne, il crée d’énormes vagues
        autour de lui.
      de: |-
        Tentoxa hat große, rote Kugeln auf seinem Kopf.
        Sie glühen auf, bevor sie seine Gegner mit Ultraschall
        erschüttern. Ein Ausbruch dieses Pokémon erzeugt
        starke Wellen in seiner Umgebung.
      es: |-
        Tentacruel tiene unas enormes esferas rojas en la cabeza, que
        brillan antes de lanzar una descarga ultrasónica a lo que le
        rodea. Este estallido crea unas olas tremendas a su alrededor.
      it: |-
        Tentacruel ha due grandi sfere rosse sulla testa.
        Le sfere brillano prima di emettere potenti ultrasuoni.
        Gli attacchi di questo Pokémon creano onde impetuose
        nei dintorni.
    alpha-sapphire:
      ja-Hrkt: |-
        じゆうに　のびちぢみする　しょくしゅで　えものを
        からめとり　もうどくを　あたえて　よわらせる。
        いっぺんに　８０ぴきの　えものを　つかまえるぞ。
      ja: |-
        自由に　伸び縮みする　触手で　獲物を
        絡め取り　猛毒を　与えて　弱らせる。
        いっぺんに　８０匹の　獲物を　捕まえるぞ。
      ko: |-
        자유롭게 늘었다 줄었다 하는 촉수로 먹이를
        휘감아 맹독을 주입해 약하게 만든다.
        한 번에 80마리의 먹이를 잡는다.
      en: |-
        Tentacruel has tentacles that can be freely elongated
        and shortened at will. It ensnares prey with its tentacles
        and weakens the prey by dosing it with a harsh toxin.
        It can catch up to 80 prey at the same time.
      fr: |-
        Les tentacules de Tentacruel peuvent s’allonger et se rétracter
        à volonté. Il serre sa proie dans ses tentacules et l’affaiblit
        en lui injectant une toxine. Il peut attraper jusqu’à 80 proies
        en même temps.
      de: |-
        Tentoxa besitzt Tentakel, die es jederzeit ausfahren und
        einziehen kann. Es fängt damit Beute und schwächt diese,
        indem es ihr ein starkes Gift verabreicht. Es kann bis zu
        80 Opfer gleichzeitig fangen.
      es: |-
        Tentacruel tiene unos tentáculos que puede alargar o acortar.
        Los usa para atrapar a su presa y debilitarla mediante una
        sustancia muy tóxica. Puede llegar a atrapar hasta a 80 presas
        a la vez.
      it: |-
        Tentacruel è dotato di tentacoli che si allungano e accorciano
        in base alle sue esigenze. Intrappola la preda con i tentacoli
        e la indebolisce con un potente veleno. Riesce a catturare
        fino a 80 prede contemporaneamente.
    sun:
      ja-Hrkt: |-
        どくのしょくしゅは　ふつう　８０ぽん。
        ながく　いきているもの　ほど
        その　ほんすうは　へっていく。
      ja: |-
        毒の触手は　普通　８０本。
        長く　生きているもの　ほど
        その　本数は　減っていく。
      ko: |-
        독 촉수는 보통 80개다.
        오래 산 포켓몬일수록
        그 개수는 줄어든다.
      zh-Hant: |-
        有毒的觸手通常有８０根。
        活得越久，觸手的數量就越少。
      zh-Hans: |-
        有毒的触手通常是８０根。
        活得越久，触手的数量就越会减少。
      en: |-
        Normally, it has 80 poisonous tentacles.
        The longer one has been alive, the fewer
        tentacles it will have.
      fr: |-
        Ce Pokémon a en moyenne 80 tentacules
        venimeux. Plus un spécimen vit longtemps,
        moins il lui en reste.
      de: |-
        Es hat für gewöhnlich 80 giftige Tentakel.
        Mit dem Alter verliert es diese jedoch nach
        und nach.
      es: |-
        Lo normal es que tenga 80 tentáculos
        venenosos. Conforme se hace viejo, va
        perdiendo extremidades.
      it: |-
        Ha circa 80 tentacoli velenosi, il cui numero
        si riduce quando vive molto a lungo.
    moon:
      ja-Hrkt: |-
        まれに　たいりょうはっせい　すると
        あたりの　うみから　さかなポケモンが
        いっさい　いなくなってしまう。
      ja: |-
        まれに　大量発生　すると
        あたりの　海から　さかなポケモンが
        一切　いなくなってしまう。
      ko: |-
        드물게 대량 발생하면
        주변 바다에서 물고기포켓몬이
        모두 사라져 버리고 만다.
      zh-Hant: |-
        罕見地大量出現時，
        周圍海域的魚寶可夢
        會一隻不剩地全部消失。
      zh-Hans: |-
        很罕见地大量出现时，
        周围海域的鱼宝可梦
        会变得一只都不剩。
      en: |-
        Although these Pokémon are rare, when a large
        outbreak of them occurs, all fish Pokémon
        disappear from the surrounding sea.
      fr: |-
        Il arrive qu’une foule de Tentacruel se regroupe
        en masse dans la mer. Lorsque cela arrive, tous
        les Pokémon poissons alentour disparaissent.
      de: |-
        In äußerst seltenen Fällen bilden sie einen
        Schwarm und rotten alle Fisch-Pokémon
        in der näheren Umgebung aus.
      es: |-
        En ocasiones, los Tentacruel se concentran en
        grandes bancos. Si eso ocurre, los Pokémon pez
        de su alrededor desaparecen sin dejar rastro.
      it: |-
        Accade di rado, ma una comparsa massiccia
        di Tentacruel può far piazza pulita di tutti
        i Pokémon acquatici nel mare circostante.
    ultra-sun:
      ja-Hrkt: |-
        あかい　たまから　ちょうおんぱを
        はっせいさせ　えものを　よわらせると
        ８０ぽんの　しょくしゅを　まきつける。
      ja: |-
        赤い　玉から　超音波を
        発生させ　獲物を　弱らせると
        ８０本の　触手を　巻きつける。
      ko: |-
        붉은 구슬로 초음파를 발생시켜
        먹이가 약해지면
        80개의 촉수로 휘감는다.
      zh-Hant: |-
        會從紅色珠子中發出超音波，
        使獵物變得虛弱，
        然後用８０根觸手纏住獵物。
      zh-Hans: |-
        从红色珠子中发出超音波
        使猎物变得虚弱后，
        就会用８０根触手缠住对手。
      en: |-
        It fires off ultrasonic waves from its red orbs
        to weaken its prey, and then it wraps them up
        in its 80 tentacles.
      fr: |-
        Il émet des ultrasons par ses globes rouges afin
        d’affaiblir ses proies, puis les enserre de ses
        80 tentacules.
      de: |-
        Mit Ultraschallwellen aus seinen roten Kugeln
        schwächt es zunächst seine Beute, um sie dann
        mit seinen 80 Tentakeln fest zu umwickeln.
      es: |-
        Emite ondas ultrasónicas por sus esferas rojas
        que inmovilizan a su presa para luego proceder
        a rodearla con sus 80 tentáculos.
      it: |-
        Indebolisce la preda emettendo ultrasuoni
        dalle sfere rosse per poi avvolgerla con i suoi
        80 tentacoli.
    ultra-moon:
      ja-Hrkt: |-
        あかい　たまを　ひからせて　なかまと
        こうしん　している。　てんめつは
        けいかいを　しらせる　あいずなのだ。
      ja: |-
        紅い　玉を　光らせて　仲間と
        交信　している。　点滅は
        警戒を　知らせる　合図なのだ。
      ko: |-
        붉은 구슬을 빛내서 동료와
        교신하고 있다. 깜빡이는 것은
        경계를 알리는 신호다.
      zh-Hant: |-
        透過讓紅色珠子發光來與
        夥伴交流。閃爍的光芒是
        用來通知警戒狀況的信號。
      zh-Hans: |-
        能让红色珠子发光来与伙伴交流。
        忽明忽暗的闪光是用来
        告知要保持警惕的信号。
      en: |-
        It communicates with others of its kind by
        lighting up the red orbs on its head. When
        the orbs are blinking, it’s a warning sign.
      fr: |-
        Il communique avec ses congénères en faisant
        briller ses globes rouges. Il les fait clignoter
        s’il veut leur envoyer un avertissement.
      de: |-
        Wenn Tentoxa untereinander kommunizieren,
        glühen ihre roten Kugeln. Ein wiederholtes
        Aufleuchten steht für ein Warnsignal.
      es: |-
        Se comunica con los suyos mediante el brillo de
        sus esferas rojas. Un parpadeo, por ejemplo, es
        señal de advertencia.
      it: |-
        Comunica con i suoi simili facendo brillare
        le sfere rosse. Le fa lampeggiare per segnalare
        agli altri di fare attenzione.
    lets-go-pikachu:
      ja-Hrkt: |-
        ８０ぽんの　しょくしゅを　じゆうに
        のびちぢみさせ　えものに　まきつき
        どくを　あたえて　よわらせる。
      ja: |-
        ８０本の　触手を　自由に
        伸び縮みさせ　獲物に　巻きつき
        毒を　あたえて　弱らせる。
      ko: |-
        80개의 촉수를 자유자재로
        늘이고 줄여 먹이를 휘감은 뒤
        독을 주입해서 약하게 만든다.
      zh-Hant: |-
        能夠自由伸縮身上的80根觸手，
        纏住獵物並讓獵物中毒，
        使對手失去抵抗力。
      zh-Hans: |-
        它能让80条触手自由
        伸缩，靠缠住猎物后
        注入毒素来让其变弱。
      en: |-
        Its 80 tentacles can stretch and contract freely.
        They wrap around prey and weaken it
        with poison.
      fr: |-
        Ses 80 tentacules peuvent s’allonger et se
        rétracter à volonté. Il les utilise pour enserrer
        sa proie et l’affaiblir avec une toxine.
      de: |-
        Beute umwickelt es mit seinen 80 Tentakeln, die
        es nach Belieben ausfahren oder einziehen kann.
        Danach schwächt es sie mit Gift.
      es: |-
        Puede estirar y contraer con total libertad sus
        80 tentáculos, con los que atrapa a su presa y
        le inyecta un veneno debilitante.
      it: |-
        Usa gli 80 tentacoli, che può allungare
        e ritrarre a piacimento, per avvolgere la
        preda e indebolirla con il veleno.
    lets-go-eevee:
      ja-Hrkt: |-
        ８０ぽんの　しょくしゅを　じゆうに
        のびちぢみさせ　えものに　まきつき
        どくを　あたえて　よわらせる。
      ja: |-
        ８０本の　触手を　自由に
        伸び縮みさせ　獲物に　巻きつき
        毒を　あたえて　弱らせる。
      ko: |-
        80개의 촉수를 자유자재로
        늘이고 줄여 먹이를 휘감은 뒤
        독을 주입해서 약하게 만든다.
      zh-Hant: |-
        能夠自由伸縮身上的80根觸手，
        纏住獵物並讓獵物中毒，
        使對手失去抵抗力。
      zh-Hans: |-
        它能让80条触手自由
        伸缩，靠缠住猎物后
        注入毒素来让其变弱。
      en: |-
        Its 80 tentacles can stretch and contract freely.
        They wrap around prey and weaken it
        with poison.
      fr: |-
        Ses 80 tentacules peuvent s’allonger et se
        rétracter à volonté. Il les utilise pour enserrer
        sa proie et l’affaiblir avec une toxine.
      de: |-
        Beute umwickelt es mit seinen 80 Tentakeln, die
        es nach Belieben ausfahren oder einziehen kann.
        Danach schwächt es sie mit Gift.
      es: |-
        Puede estirar y contraer con total libertad sus
        80 tentáculos, con los que atrapa a su presa y
        le inyecta un veneno debilitante.
      it: |-
        Usa gli 80 tentacoli, che può allungare
        e ritrarre a piacimento, per avvolgere la
        preda e indebolirla con il veleno.
    sword:
      ja-Hrkt: |-
        あたまの　あかい　たまの　ひかりが
        つよくなったら　ようちゅうい。
        ちょうおんぱを　はなつ　まえぶれだ。
      ja: |-
        頭の　赤い　玉の　光が
        強くなったら　要注意。
        超音波を　放つ　前触れだ。
      ko: |-
        머리의 빨간 구슬이
        밝게 빛나면 주의가 필요하다.
        초음파를 발산하려는 전조다.
      zh-Hant: |-
        當牠頭上紅色珠子的光芒
        變強時，就得提高警覺了。
        那是牠發射超音波的前兆。
      zh-Hans: |-
        如果看到它头上红色珠子
        发出的光变强了，就需要提高警惕。
        那是它即将释放超音波的前兆。
      en: |-
        When the red orbs on Tentacruel’s head glow
        brightly, watch out. The Pokémon is about to
        fire off a burst of ultrasonic waves.
      fr: |-
        Il faut faire attention lorsque les globes rouges
        sur sa tête se mettent à briller intensément,
        car c’est qu’il s’apprête à émettre des ultrasons.
      de: |-
        Leuchten die roten Kugeln auf seinem Kopf stark
        auf, ist Vorsicht geboten, da es kurz danach
        Ultraschallwellen ausstoßen wird.
      es: |-
        Si las esferas rojas que tiene a ambos lados de la
        cabeza brillan con intensidad, indica que está a
        punto de lanzar ondas ultrasónicas.
      it: |-
        Meglio fare attenzione quando le sfere rosse
        che ha sulla testa brillano intensamente, perché
        vuol dire che sta per emettere ultrasuoni.
    shield:
      ja-Hrkt: |-
        ８０ぽんの　しょくしゅは　のびちぢみ
        じゆう。　あみの　ように　ひろげて
        エモノを　とらえ　どくバリを　さす。
      ja: |-
        ８０本の　触手は　伸び縮み　自由。
        網のように　広げて
        獲物を　捕らえ　毒バリを　刺す。
      ko: |-
        80개의 촉수는 자유롭게 늘어났다가
        줄어든다. 그물처럼 펼쳐서
        먹이를 잡고 독바늘로 찌른다.
      zh-Hant: |-
        能夠自由伸縮身上的８０根觸手。
        會像撒網般張開觸手捕捉獵物，
        並用毒針注入劇毒。
      zh-Hans: |-
        ８０根触手伸缩自如。
        会像撒网那样伸开触手
        抓住猎物并刺入毒针。
      en: |-
        Its 80 tentacles can stretch and shrink freely.
        Tentacruel ensnares prey in a net of spread-out
        tentacles, delivering venomous stings to its catch.
      fr: |-
        Il peut allonger ses 80 tentacules à volonté et
        les utiliser comme un filet pour attraper sa proie
        et la transpercer de ses pics empoisonnés.
      de: |-
        Tentoxa kann seine 80 Tentakel beliebig
        ausfahren und einziehen. Es breitet sie netzartig
        aus, um Beute zu fangen und dann zu vergiften.
      es: |-
        Puede estirar y contraer con total libertad sus
        80 tentáculos. Con ellos atrapa a sus presas y
        les inyecta un veneno debilitante.
      it: |-
        Può allungare e accorciare a piacere i suoi 80
        tentacoli. Li estende a mo’ di rete per catturare
        le prede, che trafigge con aculei velenosi.
    legends-arceus:
      en: |-
        It has 80 tentacles, each with a venomous tip. These tentacles
        are also extendible, lengthening when Tentacruel attempts to
        catch prey. Use caution.
