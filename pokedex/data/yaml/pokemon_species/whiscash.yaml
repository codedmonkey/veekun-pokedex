whiscash:
  base_happiness: 50
  capture_rate: 75
  color: blue
  egg_groups:
    - water2
  evolution_chain: barboach
  evolves_from: barboach
  flavor_text:
    ruby:
      en: |-
        WHISCASH is extremely territorial.
        Just one of these POKéMON will claim a
        large pond as its exclusive territory.If a foe approaches it, it thrashes
        about and triggers a massive
        earthquake.
    sapphire:
      en: |-
        If WHISCASH goes on a wild rampage,
        it sets off a quake-like tremor with a
        radius of over three miles.This POKéMON has the ability to predict
        real earthquakes.
    emerald:
      en: |-
        Mysteriously, it can foretell earthquakes.
        In the daytime, it sleeps in mud at the
        bottom of a pond. When it awakens, it
        continually feeds throughout the night.
    firered:
      en: |-
        It makes its nest at the bottom of 
        swamps. It will eat anything - if it is
        alive, WHISCASH will eat it.
    leafgreen:
      en: |-
        It makes its nest at the bottom of 
        swamps. It will eat anything - if it is
        alive, WHISCASH will eat it.
    diamond:
      en: |-
        It is very territorial. It repels
        foes by setting off tremors that
        extend over a three-mile radius.
    pearl:
      en: |-
        As a result of causing tremors by
        thrashing about, it developed the
        ability to foretell real quakes.
    platinum:
      en: |-
        It is extremely protective of its
        territory. If any foe approaches,
        it attacks using vicious tremors.
    heartgold:
      en: |-
        It claims a large swamp to itself.
        If a foe comes near it, it sets off
        tremors by thrashing around.
    soulsilver:
      en: |-
        It claims a large swamp to itself.
        If a foe comes near it, it sets off
        tremors by thrashing around.
    black:
      en: |-
        It is extremely protective of its
        territory. If any foe approaches,
        it attacks using vicious tremors.
      fr: |-
        Il défend férocement son territoire
        en déclenchant des secousses
        terribles.
    white:
      en: |-
        It is extremely protective of its
        territory. If any foe approaches,
        it attacks using vicious tremors.
      fr: |-
        Il défend férocement son territoire
        en déclenchant des secousses
        terribles.
    black-2:
      en: |-
        It is extremely protective of its
        territory. If any foe approaches,
        it attacks using vicious tremors.
    white-2:
      en: |-
        It is extremely protective of its
        territory. If any foe approaches,
        it attacks using vicious tremors.
    x:
      ja-Hrkt: |-
        おおきな　ぬまを　なわばりにする。
        てきが　ちかづくと　おおあばれして
        おおきな　じしんを　おこすのだ。
      ja: |-
        大きな　沼を　縄張りにする。
        敵が　近づくと　大暴れして
        大きな　地震を　起こすのだ。
      ko: |-
        큰 늪을 영역으로 한다.
        적이 가까이 오면 크게 난동 부려서
        큰 지진을 일으킨다.
      en: |-
        It claims a large swamp to itself. If a foe comes
        near it, it sets off tremors by thrashing around.
      fr: |-
        Il a besoin d’un étang entier pour vivre. Si un ennemi
        s’approche, il s’énerve et déclenche un séisme.
      de: |-
        Sein Revier hat es im Sumpfland. Nähert sich ein Feind,
        zappelt es wie wild und erzeugt so Erdbeben.
      es: |-
        Habita en grandes pantanos. Si se acerca un enemigo,
        se alborota y causa temblores monumentales.
      it: |-
        Stabilisce il suo territorio nelle grandi paludi. Se
        il nemico gli si accosta, provoca un terremoto.
    'y':
      ja-Hrkt: |-
        ぬまの　そこに　すみかを　つくる。
        いきものなら　すききらい　なく
        なんでも　たべてしまう　おおぐらい。
      ja: |-
        沼の　底に　住処を　作る。
        生き物なら　好き嫌いなく
        なんでも　食べてしまう　大食らい。
      ko: |-
        늪 바닥에 거처를 만든다.
        살아 있는 것이라면 좋고 싫고 없이
        뭐든 먹어버리고 마는 대식가다.
      en: |-
        It makes its nest at the bottom of swamps.
        It will eat anything--if it is alive, Whiscash will eat it.
      fr: |-
        Il fait son nid au fond des marais. Il ne se pose pas
        de questions et avale toutes les créatures qui passent
        près de lui.
      de: |-
        Sein Nest baut es am Grund von Sümpfen. Es frisst
        alles, wenn es nur lebendig ist. Welsar frisst einfach
        alles.
      es: |-
        Construye su nido en el fondo de los pantanos.
        Es capaz de comerse cualquier cosa.
      it: |-
        Nidifica nel letto delle paludi. È in grado di mangiare
        qualsiasi essere vivente.
    omega-ruby:
      ja-Hrkt: |-
        なわばり　いしきが　とても　つよい　ポケモン。
        おおきな　ぬま　ぜんぶを　なわばりに　している。
        てきが　ちかづくと　あばれて　じしんを　おこす。
      ja: |-
        縄張り　意識が　とても　強い　ポケモン。
        大きな　沼　全部を　縄張りに　している。
        敵が　近づくと　暴れて　地震を　起こす。
      ko: |-
        영역에 대한 집착이 매우 강한 포켓몬이다.
        큰 늪 전부를 영역으로 삼는다.
        적이 다가오면 날뛰어 지진을 일으킨다.
      en: |-
        Whiscash is extremely territorial. Just one of these Pokémon
        will claim a large pond as its exclusive territory. If a foe
        approaches it, it thrashes about and triggers a massive
        earthquake.
      fr: |-
        Quand il s’agit de territoire, Barbicha est très possessif.
        Un seul de ces Pokémon réclame parfois un étang entier.
        Si un ennemi s’approche, il fonce sur lui et déclenche
        un violent tremblement de terre.
      de: |-
        Welsar legt viel Wert auf sein Territorium. Ein einzelnes
        Pokémon dieser Art nennt einen Teich sein Eigen. Wenn
        sich ein Feind nähert, schlägt es um sich und verursacht
        ein gewaltiges Erdbeben.
      es: |-
        Whiscash defiende su territorio a toda costa. Es capaz de
        apoderarse de un estanque entero para sí solo. Si alguien se
        le acerca, se revolverá y provocará un terremoto devastador.
      it: |-
        Whiscash è estremamente legato all’area in cui vive e
        delimita laghi enormi come proprio territorio. All’avvicinarsi
        di un nemico, s’infuria scatenando terribili terremoti.
    alpha-sapphire:
      ja-Hrkt: |-
        おおあばれ　すると　ぬまの　しゅうい　５キロの
        はんいで　じしんの　ような　ゆれが　おこる。
        ほんとうの　じしんを　よちする　ちからも　もつ。
      ja: |-
        大暴れ　すると　沼の　周囲　５キロの
        範囲で　地震の　ような　揺れが　起こる。
        本当の　地震を　予知する　力も　持つ。
      ko: |-
        크게 난동 부리면 늪 주변 5km
        범위에 지진처럼 흔들림이 일어난다.
        진짜 지진을 예지하는 힘도 지녔다.
      en: |-
        If Whiscash goes on a wild rampage, it sets off a quake-like
        tremor with a radius of over three miles. This Pokémon has
        the ability to predict real earthquakes.
      fr: |-
        Lorsque Barbicha se déchaîne, il déclenche des secousses
        sismiques dans un rayon de plus de 5 km autour de lui.
        Ce Pokémon a le pouvoir de prédire les véritables
        tremblements de terre.
      de: |-
        Wenn Welsar auf einen wilden Beutezug geht, erzeugt
        es ein Beben mit einem Radius von 5 km. Dieses Pokémon
        kann wirkliche Erdbeben voraussehen.
      es: |-
        Si Whiscash entra en estado de cólera salvaje, provoca un
        temblor sísmico de un radio de 5 km. Este Pokémon tiene
        la habilidad de predecir terremotos de verdad.
      it: |-
        Se Whiscash si infuria, è in grado di scatenare una specie
        di terremoto del raggio di 5 km. Inoltre ha la capacità di
        prevedere i terremoti reali.
    sun:
      ja-Hrkt: |-
        うごくものなら　なんでも　くいつく
        おおぐらい。　ふだんは　ぬまぞこで
        じっと　えものを　まちかまえている。
      ja: |-
        動くものなら　なんでも　喰いつく
        大食らい。　普段は　沼底で
        じっと　獲物を　待ち構えている。
      ko: |-
        움직이는 것이라면 뭐든지 먹으려는
        대식가다. 평소에는 늪 바닥에서
        가만히 먹이를 기다리고 있다.
      zh-Hant: |-
        只要是會動的東西，無論什麼都會
        咬住不放大吃特吃。平常會靜靜埋伏
        在沼澤底部動也不動地等待著獵物。
      zh-Hans: |-
        只要是动的东西，无论什么都会
        咬住不放大吃特吃。平常就一直埋伏
        在沼泽底部一动不动地等待着猎物。
      en: |-
        A glutton that devours anything that moves,
        it quietly lurks at the bottom of swamps,
        lying in wait for prey.
      fr: |-
        Ce glouton dévore tout ce qui bouge.
        La plupart du temps, il reste tapi au fond de
        son marais, en guettant sa proie.
      de: |-
        Es frisst einfach alles, was ihm vor die Kiemen
        kommt. Normalerweise verharrt es im Schlamm
        und wartet auf Beute.
      es: |-
        Es un Pokémon muy voraz que se come todo lo
        que se mueve. Suele quedarse quieto en el
        lecho del río esperando a sus presas.
      it: |-
        Incredibilmente vorace, mangia qualunque
        essere vivente. Attende immobile le prede
        sul fondo delle paludi.
    moon:
      ja-Hrkt: |-
        ナマズンの　むれが　すいめんを
        はねる　こうけいは　じしんの
        まえぶれと　しんじられている。
      ja: |-
        ナマズンの　群れが　水面を
        跳ねる　光景は　地震の
        前触れと　信じられている。
      ko: |-
        메깅 무리가 수면을
        튀어 오르는 광경은 지진의
        전조로 여기고 있다.
      zh-Hant: |-
        成群的鯰魚王在水面上跳躍的景象
        被認為是地震的先兆。
      zh-Hans: |-
        成群的鲶鱼王在水面上跳跃的景象
        被认为是地震的前兆。
      en: |-
        Sighting Whiscash leaping from the water
        is believed to herald an earthquake.
      fr: |-
        On dit que lorsqu’un banc de Barbicha jaillit
        hors de l’eau, un tremblement de terre est
        sur le point de se produire.
      de: |-
        Man glaubt, der Anblick eines über die
        Wasseroberfläche springenden Welsar-
        Schwarms sei ein Vorbote für ein Erdbeben.
      es: |-
        Se cree que cuando los bancos de Whiscash
        saltan sobre la superficie del agua, es señal
        premonitoria de un terremoto.
      it: |-
        Si dice che se si vedono gruppi di Whiscash
        saltare fuori dall’acqua sia segno di un
        terremoto imminente.
    ultra-sun:
      ja-Hrkt: |-
        はげしく　じめんを　ゆらし　あいてを
        いかくする。　ぬまぞこの　えものは
        どろごと　まるのみにして　しまう。
      ja: |-
        激しく　地面を　揺らし　相手を
        威嚇する。　沼底の　獲物は
        泥ごと　丸呑みにして　しまう。
      ko: |-
        격렬하게 지면을 흔들어 상대를
        위협한다. 늪 바닥의 먹이는
        진흙과 함께 통째로 삼켜 버린다.
      zh-Hant: |-
        會猛烈地搖晃地面來威嚇對手。
        獵食沼澤底部的獵物時，
        會把獵物連同泥巴整個吞下去。
      zh-Hans: |-
        猛烈地摇晃地面，威吓对手。
        会将沼泽底部的猎物连同泥巴
        一起整个吞下。
      en: |-
        Whiscash shakes the ground at high intensities
        to intimidate its opponents. It swallows its prey
        whole—along with mud from the swamp floor.
      fr: |-
        Il subjugue ses adversaires en déclenchant de
        violents séismes. Il racle le fond des marais pour
        se nourrir, avalant proies et vase au passage.
      de: |-
        Es schüchtert seine Gegner ein, indem es den
        Boden beben lässt. Seine Beute verschluckt es
        mitsamt dem Schlamm, in dem sie sich aufhält.
      es: |-
        Provoca fuertes temblores de tierra con los que
        intimida a sus rivales. Al engullir a las presas del
        fondo del cenagal también traga bastante lodo.
      it: |-
        Intimorisce il nemico scatenando una specie di
        terremoto. Si nutre sul fondo delle paludi e
        inghiotte prede e fango insieme.
    ultra-moon:
      ja-Hrkt: |-
        しりょくは　あまりよくない。　ヒゲで
        みずの　しんどうを　かんちして
        えものの　いちを　つきとめるのだ。
      ja: |-
        視力は　あまりよくない。　ヒゲで
        水の　振動を　感知して
        獲物の　位置を　つきとめるのだ。
      ko: |-
        시력은 그다지 좋지 않다.
        수염으로 물의 진동을 감지해서
        먹이의 위치를 찾아낸다.
      zh-Hant: |-
        視力不太好。會透過
        鬍鬚來感知水的振動，
        藉此掌握獵物的位置。
      zh-Hans: |-
        它的视力不太好。
        会通过胡子来感知水的振动，
        掌握猎物的位置。
      en: |-
        Its vision is not that good. It senses vibrations in
        the water with its whiskers to determine the
        location of its prey.
      fr: |-
        Sa vision n’étant pas très bonne, il utilise ses
        barbillons pour capter les vibrations de l’eau
        et repérer ses proies.
      de: |-
        Seine Sehkraft ist schlecht. Es nimmt mit seinen
        Barthaaren Schwingungen im Wasser wahr und
        spürt so seine Beute auf.
      es: |-
        Como su vista no es muy aguda, utiliza los
        barbillones para detectar las vibraciones que se
        producen en el agua y localizar así a su presa.
      it: |-
        Poiché la sua vista non è molto sviluppata,
        individua la posizione della preda percependo
        le vibrazioni dell’acqua con i baffi.
    sword:
      ja-Hrkt: |-
        ぬまの　そこに　すみかを　つくる。
        いきものなら　すききらい　なく
        なんでも　たべてしまう　おおぐらい。
      ja: |-
        沼の　底に　すみかを　つくる。
        生き物なら　好き嫌いなく
        なんでも　食べてしまう　大食らい。
      ko: |-
        늪 바닥에 거처를 만든다.
        살아 있는 것이라면 가리지 않고
        뭐든 먹어버리고 마는 대식가다.
      zh-Hant: |-
        會在沼澤底部建造居所。
        只要是活著的東西都會吃下肚，
        是個不挑食的大胃王。
      zh-Hans: |-
        会在沼泽底部筑巢。
        只要是活物就来者不拒，
        是什么都吃的大胃王。
      en: |-
        It makes its nest at the bottom of swamps. It will
        eat anything—if it is alive, Whiscash will eat it.
      fr: |-
        Il fait son nid au fond des marais.
        Il ne se pose pas de question et avale
        toutes les créatures qui passent près de lui.
      de: |-
        Dieses Pokémon baut sein Nest am Grund von
        Sümpfen. Es ist ein Vielfraß und verspeist
        Lebewesen aller Art.
      es: |-
        Construye su nido en el fondo de los pantanos.
        Es tan voraz que no le hace ascos a ningún tipo
        de comida, siempre que se trate de seres vivos.
      it: |-
        Nidifica nel letto delle paludi. Incredibilmente
        vorace, mangia qualunque essere vivente senza
        distinzione di sorta.
    shield:
      ja-Hrkt: |-
        おおきな　ぬまを　なわばりにする。
        てきが　ちかづくと　おおあばれして
        おおきな　じしんを　おこすのだ。
      ja: |-
        大きな　沼を　縄張りにする。
        敵が　近づくと　大暴れして
        大きな　地震を　起こすのだ。
      ko: |-
        큰 늪을 영역으로 한다.
        적이 가까이 오면 크게 난동부려서
        큰 지진을 일으킨다.
      zh-Hant: |-
        把大沼澤當成自己的地盤。
        敵人一旦接近就會變得十分粗暴，
        並引起大地震。
      zh-Hans: |-
        会将大沼泽划为自己的领地。
        如果有敌人接近的话，它就会狂暴起来，
        并引发大地震。
      en: |-
        It claims a large swamp to itself. If a foe comes
        near it, it sets off tremors by thrashing around.
      fr: |-
        Il a besoin d’un marais entier pour vivre.
        Si un ennemi s’approche, il s’énerve et déclenche
        un séisme.
      de: |-
        Sein Revier hat es im Sumpfland. Nähert sich
        ein Feind, zappelt es wie wild und erzeugt so
        Erdbeben.
      es: |-
        Habita en grandes pantanos. Si se acerca un
        enemigo, monta en cólera y causa temblores
        monumentales.
      it: |-
        Stabilisce il suo territorio nelle grandi paludi.
        Se un nemico si avvicina, si scatena provocando
        grossi terremoti.
