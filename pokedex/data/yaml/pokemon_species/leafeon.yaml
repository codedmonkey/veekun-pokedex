        photosynthesis to produce clean air.
    black:
      en: |-
        It basically does not fight. With
        cells similar to those of plants, it
        can perform photosynthesis.
      fr: |-
        Il utilise la photosynthèse comme
        une plante et a aussi tendance à
        éviter le combat à tout prix.
    white:
      en: |-
        It basically does not fight. With
        cells similar to those of plants, it
        can perform photosynthesis.
      fr: |-
        Il utilise la photosynthèse comme
        une plante et a aussi tendance à
        éviter le combat à tout prix.
    black-2:
      en: |-
        With cells similar to those of plants,
        it performs photosynthesis inside its
        body and creates pure air.
    white-2:
      en: |-
        With cells similar to those of plants,
        it performs photosynthesis inside its
        body and creates pure air.
    x:
      ja-Hrkt: |-
        はれた　ひに　ねている　リーフィアは
        こうごうせいを　して　きれいな
        くうきを　つくりだしているのだ。
      ja: |-
        晴れた　日に　寝ている　リーフィアは
        光合成を　して　きれいな　空気を
        作り出しているのだ。
      ko: |-
        맑은 날에 잠든 리피아는
        광합성을 해서 깨끗한
        공기를 만들고 있다.
      en: |-
        When you see Leafeon asleep in a patch of
        sunshine, you’ll know it is using photosynthesis
        to produce clean air.
      fr: |-
        Un Phyllali qui dort par beau temps produit un air frais
        et pur par photosynthèse.
      de: |-
        An klaren Tagen erzeugt Folipurba saubere Luft,
        indem es Photosynthese betreibt.
      es: |-
        En días soleados duerme y hace la fotosíntesis,
        emitiendo aire puro a su alrededor.
      it: |-
        Nelle belle giornate si sdraia al sole e usa la
        fotosintesi, producendo aria pulita.
    'y':
      ja-Hrkt: |-
        しょくぶつのように　こうごうせいを
        するため　リーフィアの　まわりは
        すんだ　くうきに　つつまれている。
      ja: |-
        植物のように　光合成を　するため
        リーフィアの　まわりは
        澄んだ　空気に　包まれている。
      ko: |-
        식물처럼 광합성을 하기
        때문에 리피아의 주위는
        맑은 공기로 둘러싸여 있다.
      en: |-
        Just like a plant, it uses photosynthesis. As a result,
        it is always enveloped in clear air.
      fr: |-
        Il utilise la photosynthèse comme une plante.
        C’est pourquoi il est toujours entouré d’air pur.
      de: |-
        Genau wie eine Pflanze führt es die Photosynthese
        aus. Deshalb ist es ständig von reiner Luft umgeben.
      es: |-
        Al igual que una planta, hace la fotosíntesis. Como
        consecuencia, siempre está rodeado de aire puro.
      it: |-
        Usa la fotosintesi, proprio come una pianta.
        Pertanto è sempre circondato da aria pulita.
    omega-ruby:
      ja-Hrkt: |-
        はれた　ひに　ねている　リーフィアは
        こうごうせいを　して　きれいな
        くうきを　つくりだしているのだ。
      ja: |-
        晴れた　日に　寝ている　リーフィアは
        光合成を　して　きれいな　空気を
        作り出しているのだ。
      ko: |-
        맑은 날에 잠든 리피아는
        광합성을 해서 깨끗한
        공기를 만들고 있다.
      en: |-
        When you see Leafeon asleep in a patch of
        sunshine, you’ll know it is using photosynthesis
        to produce clean air.
      fr: |-
        Un Phyllali qui dort par beau temps produit un air frais et pur
        par photosynthèse.
      de: |-
        An klaren Tagen erzeugt Folipurba saubere Luft, indem es
        Photosynthese betreibt.
      es: |-
        En días soleados duerme y hace la fotosíntesis, emitiendo aire
        puro a su alrededor.
      it: |-
        Nelle belle giornate si sdraia al sole e usa la fotosintesi,
        producendo aria pulita.
    alpha-sapphire:
      ja-Hrkt: |-
        しょくぶつのように　こうごうせいを
        するため　リーフィアの　まわりは
        すんだ　くうきに　つつまれている。
      ja: |-
        植物のように　光合成を　するため
        リーフィアの　まわりは
        澄んだ　空気に　包まれている。
      ko: |-
        식물처럼 광합성을 하기
        때문에 리피아의 주위는
        맑은 공기로 둘러싸여 있다.
      en: |-
        Just like a plant, it uses photosynthesis. As a result,
        it is always enveloped in clear air.
      fr: |-
        Il utilise la photosynthèse comme une plante. C’est pourquoi
        il est toujours entouré d’air pur.
      de: |-
        Genau wie eine Pflanze führt es die Photosynthese aus.
        Deshalb ist es ständig von reiner Luft umgeben.
      es: |-
        Al igual que una planta, hace la fotosíntesis. Como
        consecuencia, siempre está rodeado de aire puro.
      it: |-
        Usa la fotosintesi, proprio come una pianta.
        Pertanto è sempre circondato da aria pulita.
    sun:
      ja-Hrkt: |-
        さいぼうこうせいは　どうぶつ　より
        しょくぶつに　ちかい。　こうごうせいで
        くわずとも　エネルギーを　えられる。
      ja: |-
        細胞構成は　動物　より
        植物に　近い。　光合成で
        喰わずとも　エネルギーを　得られる。
      ko: |-
        세포구성은 동물보다는
        식물에 가깝다. 광합성을 통해
        안 먹어도 에너지를 얻을 수 있다.
      zh-Hant: |-
        比起動物，細胞構成
        更接近植物。靠著光合作用，
        就算不吃東西也能獲得能量。
      zh-Hans: |-
        比起动物，细胞构成
        更接近植物。用光合作用，
        就算不吃也能获得能量。
      en: |-
        Its cellular composition is closer to that of a
        plant than an animal. It uses photosynthesis to
        produce its energy supply without eating food.
      fr: |-
        Sa structure cellulaire est plus proche de celle
        des végétaux que de celle des animaux.
        Il produit de l’énergie par photosynthèse.
      de: |-
        Seine Zellstruktur ähnelt jener von Pflanzen.
        Durch Photosynthese kann es ohne
        Nahrungsaufnahme Energie gewinnen.
      es: |-
        Su estructura celular se asemeja más a la de las
        plantas que a la de los animales. Puede obtener
        energía sin alimentos gracias a la fotosíntesis.
      it: |-
        Le sue cellule hanno caratteristiche molto simili
        a quelle dei vegetali. Può ricavare energia vitale
        tramite fotosintesi.
    moon:
      ja-Hrkt: |-
        わかい　リーフィアほど　ツンと　くる
        あおくさい　におい。　としおいると
        おちばの　ような　においに　なる。
      ja: |-
        若い　リーフィアほど　ツンと　くる
        青臭い　匂い。　年老いると
        落ち葉の　ような　匂いになる。
      ko: |-
        어린 리피아일수록 코를 찌르는
        풋내가 난다. 나이를 먹으면
        낙엽 같은 냄새로 바뀐다.
      zh-Hant: |-
        越是年幼的葉伊布，
        越是有刺鼻的青草味。
        年老後就會變成好像落葉的味道。
      zh-Hans: |-
        越是年幼的叶伊布，
        越是有冲鼻的青草香味。
        年老后就变成好像落叶的味道。
      en: |-
        The younger they are, the more they smell like
        fresh grass. With age, their fragrance takes on
        the odor of fallen leaves.
      fr: |-
        Les jeunes Phyllali sentent l’herbe fraîche.
        Avec l’âge, ce parfum se mue en une odeur
        de feuilles mortes.
      de: |-
        Junge Folipurba riechen stark nach frischem
        Gras, ältere hingegen verströmen den Geruch
        von herabgefallenem Laub.
      es: |-
        Los Leafeon jóvenes desprenden un intenso
        aroma a hierba fresca, mientras que el olor de
        los mayores es más semejante a la hojarasca.
      it: |-
        Quando è giovane emette un forte profumo
        d’erba fresca, ma nella vecchiaia odora di
        foglie morte.
    ultra-sun:
      ja-Hrkt: |-
        あらそいは　このまないが　なかまを
        まもるためならば　シッポの　はっぱを
        とがらせ　やいばにかえて　たたかう。
      ja: |-
        争いは　好まないが　仲間を
        守るためならば　シッポの　葉っぱを
        尖らせ　刃に変えて　戦う。
      ko: |-
        다툼을 좋아하지 않지만 동료를
        지키기 위해서라면 꼬리의 잎사귀를
        날카로운 칼날로 만들어 싸운다.
      zh-Hant: |-
        本性並不好鬥，但若是為了
        保護夥伴，牠會讓尾巴上的
        葉片變尖，形成刀刃來戰鬥。
      zh-Hans: |-
        本身并不好斗，但如果是为了
        保护伙伴，就会削尖尾巴上的叶片，
        变成刀刃来作战。
      en: |-
        Although it doesn’t like disputes, it will sharpen
        the leaf on its tail into a blade and fight if it has
        to protect its friends.
      fr: |-
        Il n’aime pas le conflit, mais s’il doit protéger
        ses amis, il peut raidir sa queue en forme de
        feuille et la rendre aussi tranchante qu’une lame.
      de: |-
        Folipurba kämpft nicht gerne, aber sollten sich
        seine Kameraden in Gefahr befinden, verwendet
        es seinen blattartigen Schweif wie eine Klinge.
      es: |-
        A pesar de evitar a toda costa los combates, si
        ha de proteger a sus amigos, no duda en usar la
        hoja de la cola como una afilada espada.
      it: |-
        Non ama battersi, ma se deve difendere i suoi
        compagni non esita a lottare trasformando
        la foglia della coda in una lama affilata.
    ultra-moon:
      ja-Hrkt: |-
        こうごうせいで　えいよう　ほきゅう。
        キレイな　かわが　ながれる　もりの
        おくふかくで　しずかに　くらしている。
      ja: |-
        光合成で　栄養　補給。
        キレイな　川が　流れる　森の
        奥深くで　静かに　暮らしている。
      ko: |-
        광합성으로 영양을 보충한다.
        깨끗한 강이 흐르는 숲의
        깊은 곳에 조용하게 살고 있다.
      zh-Hant: |-
        靠光合作用補充營養。
        在有著清澈河流的森林深處
        靜靜地生活著。
      zh-Hans: |-
        通过光合作用补充营养。
        在有清澈河流的森林深处
        静静地生活着。
      en: |-
        It gets its nutrition from photosynthesis. It lives
        a quiet life deep in forests where clean
        rivers flow.
      fr: |-
        Il vit dans le calme des forêts profondes
        traversées par de jolis ruisseaux, où il se
        nourrit de lumière et d’eau fraîche.
      de: |-
        Mittels Photosynthese versorgt es sich mit
        Nährstoffen. Es lebt abgeschieden in dichten,
        von glitzernden Bächen durchzogenen Wäldern.
      es: |-
        Realiza la fotosíntesis para obtener nutrientes.
        Habita en la apacible espesura de los bosques
        bañados por arroyos de agua cristalina.
      it: |-
        Si nutre grazie alla fotosintesi. Vive nel cuore
        delle foreste dove scorrono fiumi limpidi,
        in luoghi immersi nella pace e nella tranquillità.
    sword:
      ja-Hrkt: |-
        はっぱから　ただよう　クセのある
        かおりは　ガラルじんの　このみ。
        こうすいに　かこうされ　にんき。
      ja: |-
        葉っぱから　漂う　クセのある
        香りは　ガラル人の　好み。
        香水に　加工され　人気。
      ko: |-
        잎사귀에서 나는 독특한 향기는
        가라르인들의 취향에 맞다.
        향수로 가공되어 인기가 높다.
      zh-Hant: |-
        伽勒爾人對牠的葉片散發出的
        獨特香氣情有獨鍾。用這種
        香氣加工出的香水非常受歡迎。
      zh-Hans: |-
        伽勒尔人对它叶片散发出的
        独特香气情有独钟。用这种
        香气加工出的香水非常受欢迎。
      en: |-
        Galarians favor the distinctive aroma that drifts
        from this Pokémon’s leaves. There’s a popular
        perfume made using that scent.
      fr: |-
        Les habitants de Galar adorent l’odeur unique
        qui se dégage de ses feuilles, aussi entrent-elles
        dans la composition d’un parfum très populaire.
      de: |-
        Die Bewohner Galars mögen den eigentümlichen
        Geruch, den seine Blätter verströmen. Als Parfüm
        ist er sehr beliebt.
      es: |-
        El peculiar aroma que desprenden sus hojas es
        muy apreciado por los habitantes de Galar y se
        usa en la elaboración de codiciados perfumes.
      it: |-
        La singolare fragranza emanata dalle sue foglie
        è molto apprezzata a Galar e i profumi che se
        ne ricavano sono molto popolari.
    shield:
      ja-Hrkt: |-
        シッポは　するどく　やいばのよう。
        たいぼくも　まっぷたつに　する
        ばつぐんの　きれあじを　ほこる。
      ja: |-
        しっぽは　鋭く　刃のよう。
        大木も　真っ二つに　する
        抜群の　切れ味を　誇る。
      ko: |-
        꼬리는 날카로운 칼날 같다.
        큰 나무도 두 동강 내는
        탁월한 예리함을 자랑한다.
      zh-Hant: |-
        尾巴如同銳利的刀刃，
        鋒利得無與倫比，
        連大樹都能一刀兩斷。
      zh-Hans: |-
        尾巴好似锐利的刀刃，
        锋利得无与伦比，
        连大树都能一斩为二。
      en: |-
        This Pokémon’s tail is blade sharp, with a
        fantastic cutting edge that can slice right
        though large trees.
      fr: |-
        Grâce à sa queue aussi effilée qu’une lame, il est
        capable de fendre en deux des arbres immenses.
      de: |-
        Sein Schweif ist scharf wie eine Klinge. Es ist stolz
        darauf, dass es damit selbst einen großen Baum
        sauber zweiteilen kann.
      es: |-
        Se siente muy orgulloso de su cola afilada como
        una espada, con la que es capaz de cortar en dos
        el tronco de un árbol grueso.
      it: |-
        Va molto fiero della sua coda affilata come
        una lama, con cui può tranciare in due persino
        un grosso albero.
