roselia:
  base_happiness: 50
  capture_rate: 150
  color: green
  egg_groups:
    - fairy
    - plant
  evolution_chain: roselia
  evolves_from: budew
  flavor_text:
    ruby:
      en: |-
        ROSELIA shoots sharp thorns as
        projectiles at any opponent that tries
        to steal the flowers on its arms.The aroma of this POKéMON brings
        serenity to living things.
    sapphire:
      en: |-
        On extremely rare occasions, a ROSELIA
        is said to appear with its flowers in
        unusual colors.The thorns on this POKéMON’s head
        contain a vicious poison.
    emerald:
      en: |-
        A ROSELIA that drinks nutritionally rich
        springwater blooms with lovely flowers.
        The fragrance of its flowers has the
        effect of making its foes careless.
    firered:
      en: |-
        Its flowers give off a relaxing fragrance.
        The stronger its aroma, the healthier
        the ROSELIA is.
    leafgreen:
      en: |-
        Its flowers give off a relaxing fragrance.
        The stronger its aroma, the healthier
        the ROSELIA is.
    diamond:
      en: |-
        ROSELIA raised on clean drinking
        water are known to grow vividly
        colored flowers.
    pearl:
      en: |-
        The beautiful flowers on its arms
        have toxic thorns. Don’t even
        think about picking those flowers.
    platinum:
      en: |-
        The more healthy the ROSELIA, the
        more pleasant its flowers’ aroma.
        Its scent deeply relaxes people.
    heartgold:
      en: |-
        ROSELIA that drink nutritionally
        rich springwater are said to reveal
        rare coloration when they bloom.
    soulsilver:
      en: |-
        ROSELIA that drink nutritionally
        rich springwater are said to reveal
        rare coloration when they bloom.
    black:
      en: |-
        The more healthy the Roselia, the
        more pleasant its flowers’ aroma.
        Its scent deeply relaxes people.
      fr: |-
        Plus le Rosélia est en bonne santé
        et plus son parfum est agréable et
        relaxant pour son entourage.
    white:
      en: |-
        The more healthy the Roselia, the
        more pleasant its flowers’ aroma.
        Its scent deeply relaxes people.
      fr: |-
        Plus le Rosélia est en bonne santé
        et plus son parfum est agréable et
        relaxant pour son entourage.
    black-2:
      en: |-
        It uses the different poisons in each
        hand separately when it attacks. The
        stronger its aroma, the healthier it is.
    white-2:
      en: |-
        It uses the different poisons in each
        hand separately when it attacks. The
        stronger its aroma, the healthier it is.
    x:
      ja-Hrkt: |-
        みぎてと　ひだりてで　２しゅるいの
        どくを　つかいわけて　こうげきする。
        かおりが　つよいほど　げんきだ。
      ja: |-
        右手と　左手で　２種類の
        毒を　使いわけて　攻撃する。
        香りが　強いほど　元気だ。
      ko: |-
        오른손과 왼손으로 2종류의
        독을 구별하여 공격한다.
        향기가 강할수록 기운이 넘친다.
      en: |-
        It uses the different poisons in each hand
        separately when it attacks. The stronger its aroma,
        the healthier it is.
      fr: |-
        Chacune de ses mains sécrète un poison différent.
        Plus un Rosélia est en bonne santé, plus ses parfums
        sont puissants.
      de: |-
        Aus seinen Händen verströmt es jeweils
        ein anderes Gift. Je stärker Roselia duftet,
        desto gesünder ist es.
      es: |-
        Ataca con sus manos, en las que tiene un tipo de
        veneno diferente en cada una. Cuanto más aroma,
        mejor salud tiene.
      it: |-
        Attacca usando abilmente i due tipi di veleno delle
        estremità dei suoi arti. Più è forte la sua fragranza,
        più è in salute.
    'y':
      ja-Hrkt: |-
        えいよう　まんてんの　わきみずを
        のんだ　ロゼリアは　めずらしい
        いろの　はなを　さかせる　らしい。
      ja: |-
        栄養満点の　わき水を
        飲んだ　ロゼリアは　珍しい　色の
        花を　咲かせる　らしい。
      ko: |-
        영양 만점의 샘물을
        마신 로젤리아는 희귀한
        색의 꽃을 피우는 듯하다.
      en: |-
        Roselia that drink nutritionally rich springwater are
        said to reveal rare coloration when they bloom.
      fr: |-
        Les Rosélia arrosés avec une eau de source riche
        en nutriments prendraient des couleurs uniques.
      de: |-
        Gibt man ihm besonders nahrhaftes Quellwasser
        zu trinken, entwickelt es Blüten in seltenen Farben.
      es: |-
        Se dice que le brotan flores de colores poco usuales
        si bebe agua de manantial rica en nutrientes.
      it: |-
        Beve solo acqua di fonte, ricca di sostanze nutritive,
        che conferisce ai suoi fiori dei colori preziosi.
    omega-ruby:
      ja-Hrkt: |-
        りょうての　はなを　ねらう　あいてには
        するどい　トゲを　とばして　こうげきする。
        はなの　かおりは　きもちを　なごませる。
      ja: |-
        両手の　花を　ねらう　相手には
        鋭い　トゲを　飛ばして　攻撃する。
        花の　香りは　気持ちを　和ませる。
      ko: |-
        양손의 꽃을 노리는 상대에게는
        날카로운 가시를 날려 공격한다.
        꽃의 향기는 기분을 누그러트린다.
      en: |-
        Roselia shoots sharp thorns as projectiles at any opponent that
        tries to steal the flowers on its arms. The aroma of this
        Pokémon brings serenity to living things.
      fr: |-
        Rosélia utilise ses épines pointues comme projectiles
        si on tente de cueillir les fleurs sur ses bras. Le parfum de ce
        Pokémon apporte sérénité et plénitude à ceux qui le sentent.
      de: |-
        Roselia verschießt scharfe Stacheln auf jeden Feind,
        der versucht, die Blumen an seinen Armen zu stehlen.
        Der Duft dieses Pokémon beruhigt Lebewesen.
      es: |-
        Roselia lanza finas espinas a todo el que se le acerca con
        intención de robarle las flores de los brazos. El aroma de este
        Pokémon resulta relajante a los seres vivos.
      it: |-
        Roselia spara spine molto affilate come fossero proiettili
        a tutti coloro che tentano di rubargli i fiori dal braccio.
        Il profumo di questo Pokémon infonde serenità a tutti
        gli esseri viventi.
    alpha-sapphire:
      ja-Hrkt: |-
        ごく　まれに　めずらしい　いろの　はなを
        さかせている　ロゼリアが　いると　いわれる。
        あたまの　トゲは　もうどくを　もっているぞ。
      ja: |-
        ごく　まれに　珍しい　色の　花を
        咲かせている　ロゼリアが　いると　いわれる。
        頭の　トゲは　猛毒を　持っているぞ。
      ko: |-
        아주 드물게 희귀한 색의 꽃을
        피우는 로젤리아가 있다고 전해진다.
        머리의 가시는 맹독을 지니고 있다.
      en: |-
        On extremely rare occasions, a Roselia is said to appear with
        its flowers in unusual colors. The thorns on this Pokémon’s
        head contain a vicious poison.
      fr: |-
        En de très rares occasions, on dit qu’un Rosélia peut
        apparaître en arborant des fleurs aux couleurs inhabituelles.
        Les épines sur la tête de ce Pokémon contiennent un
        dangereux poison.
      de: |-
        Nur sehr selten bekommt man Roselia mit seinen
        ungewöhnlich farbigen Blumen zu Gesicht. Die Dornen
        am Kopf dieses Pokémon enthalten ein grausames Gift.
      es: |-
        Dicen que, en muy raras ocasiones, aparece un ejemplar de
        Roselia con las flores de colores muy poco comunes. Las
        espinas que este Pokémon tiene en la cabeza contienen un
        veneno extremadamente peligroso.
      it: |-
        In qualche rarissima occasione, Roselia è stato visto con fiori
        dai colori inconsueti. Le spine sulla testa di questo Pokémon
        contengono un veleno micidiale.
    sword:
      ja-Hrkt: |-
        はなの　かおりを　かぐと　きもちが
        リラックスする。　かおりの　つよい
        ロゼリアは　げんきな　しょうこ。
      ja: |-
        花の　香りを　かぐと　気持ちが
        リラックスする。　香りの　強い
        ロゼリアは　元気な　証拠。
      ko: |-
        꽃향기를 맡으면 기분이
        편안해진다. 향이 강하면
        건강한 로젤리아라는 뜻이다.
      zh-Hant: |-
        只要聞到牠的花香，
        就能放鬆心情。濃郁的香味
        是毒薔薇有活力的證明。
      zh-Hans: |-
        只要闻到它的花香，
        就能放松心情。浓郁的香味
        是毒蔷薇有活力的证明。
      en: |-
        Its flowers give off a relaxing fragrance.
        The stronger its aroma, the healthier
        the Roselia is.
      fr: |-
        Ses fleurs dégagent un parfum relaxant.
        Plus cet arôme est fort, meilleure est la santé
        de Rosélia.
      de: |-
        Seine Blüten verströmen einen entspannenden
        Duft. Je stärker dieser Duft ist, desto gesünder
        ist Roselia.
      es: |-
        Las flores que tiene emanan un aroma relajante.
        Cuanto más intenso, mejor es su estado de salud.
      it: |-
        Dai suoi fiori si diffonde una fragranza rilassante.
        Più è intenso il suo profumo, più il Pokémon
        è in salute.
    shield:
      ja-Hrkt: |-
        みぎてと　ひだりてで　２しゅるいの
        どくを　つかいわけて　こうげきする。
        かおりが　つよいほど　げんきだ。
      ja: |-
        右手と　左手で　２種類の
        毒を　使いわけて　攻撃する。
        香りが　強いほど　元気だ。
      ko: |-
        오른손과 왼손으로 2종류의
        독을 구별하여 공격한다.
        향기가 강할수록 기운이 넘친다.
      zh-Hant: |-
        會用右手和左手分別施放
        ２種不同的毒來進行攻擊。
        香氣越濃越有活力。
      zh-Hans: |-
        会用右手和左手分别放出
        ２种不同的毒来进行攻击。
        香气越浓越有精神。
      en: |-
        It uses the different poisons in each hand
        separately when it attacks. The stronger its
        aroma, the healthier it is.
      fr: |-
        Ses mains sécrètent chacune un poison différent
        dont il se sert pour attaquer. Plus le parfum
        de Rosélia est intense, plus sa santé est bonne.
      de: |-
        Seine Hände scheiden beim Angriff jeweils ein
        anderes Gift aus. Je stärker Roselia duftet, desto
        gesünder ist es.
      es: |-
        Ataca con sus manos, cada una de las cuales
        contiene un tipo de veneno diferente. Cuanto
        más intenso es su aroma, mejor salud tiene.
      it: |-
        Attacca usando abilmente i suoi arti, che
        contengono veleni diversi. Più è forte la sua
        fragranza, più è in salute.
