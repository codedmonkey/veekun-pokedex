    x:
      ja-Hrkt: |-
        ひかりの　とどかない　しんかいに
        せいそく。こざかなに　にた　しっぽを
        ひからせて　えものを　さそいだす。
      ja: |-
        光の　届かない　深海に　生息。
        小魚に　似た　尻尾を　光らせて
        獲物を　誘い出す。
      ko: |-
        빛이 닿지 않는 심해에 서식한다.
        작은 생선처럼 생긴 꼬리를
        빛내어 먹잇감을 유인한다.
      en: |-
        It lives deep in the sea where no light ever filters
        down. It lights up its small fishlike tail to
        attract prey.
      fr: |-
        Il vit dans les abysses, là où la lumière ne va jamais.
        Il allume le bout de sa queue, qui ressemble à un
        poisson, pour attirer ses proies.
      de: |-
        Es lebt tief im Meer, wo Sonnenlicht nie vordringt.
        Beim Beutefang leuchtet sein fischartiger Schwanz,
        um Beute anzulocken.
      es: |-
        Vive en los abismos marinos, donde no se filtra la luz.
        Tiene una cola en forma de pez, que enciende para
        atraer a su presa.
      it: |-
        Vive in mare a grandi profondità, dove non filtra
        nessuna luce. Attira le prede illuminando la codina
        a forma di pesce.
    'y':
      ja-Hrkt: |-
        しんかいに　せいそくする　ポケモン。
        こざかなの　かたちをした　しっぽで
        えものを　おびきよせ　つかまえる。
      ja: |-
        深海に　生息する　ポケモン。
        小魚の　形をした　尻尾で
        獲物を　誘き寄せ　捕まえる。
      ko: |-
        심해에 서식하는 포켓몬이다.
        작은 물고기 형태를 한 꼬리로
        먹이를 끌어들여 붙잡는다.
      en: |-
        It lives deep in the sea. With a tail shaped like a
        small fish, it attracts unsuspecting prey.
      fr: |-
        Il vit loin sous la mer. Il appâte les proies crédules
        avec sa queue qui rappelle un petit poisson.
      de: |-
        Es lebt tief im Meer. Sein Schweif ist wie ein kleiner
        Fisch geformt. Mit ihm lockt es Beute an.
      es: |-
        Vive en los fondos marinos. Atrae a sus confiadas
        presas con la cola, que tiene forma de pez.
      it: |-
        Vive nei mari profondi. Con la coda a forma di
        pesciolino attrae prede ignare del pericolo.
    omega-ruby:
      ja-Hrkt: |-
        とても　ふかい　うみの　そこに　すんでいるため
        ながい　あいだ　ひとに　みつからなかった。
        くらい　しんかいでも　よく　みえる　めを　もつ。
      ja: |-
        とても　深い　海の　底に　すんでいるため
        長い　間　人に　見つからなかった。
        暗い　深海でも　よく　見える　目を　持つ。
      ko: |-
        매우 깊은 바다 밑에 살고 있어서
        오랫동안 사람에게 발견되지 않았다.
        어두운 심해에서도 잘 볼 수 있는 눈을 지녔다.
      en: |-
        Huntail’s presence went unnoticed by people for a long
        time because it lives at extreme depths in the sea.
        This Pokémon’s eyes can see clearly even in the murky
        dark depths of the ocean.
      fr: |-
        L’existence de Serpang fut longtemps ignorée, car il vit
        dans les profondeurs abyssales des océans. Les yeux
        de ce Pokémon sont excellents et peuvent même voir
        à travers les eaux troubles des grandes profondeurs.
      de: |-
        Aalabyss entging lange der Aufmerksamkeit des Menschen,
        da es in extremen Tiefen des Meeres lebt. Die Augen dieses
        Pokémon können selbst in den dunklen und trüben Tiefen des
        Meeres einwandfrei sehen.
      es: |-
        Huntail ha pasado desapercibido durante mucho tiempo por
        vivir en las profundidades del mar. El sentido de la vista de
        este Pokémon le permite ver en las oscuras y turbias aguas
        submarinas.
      it: |-
        L’esistenza di Huntail è rimasta a lungo sconosciuta perché
        vive solo in mare a incredibili profondità.
        Con la sua vista così acuta riesce a vedere chiaramente
        persino nel buio pesto dei fondali marini.
    alpha-sapphire:
      ja-Hrkt: |-
        さかなの　かたちをした　シッポで　おびきよせ
        おおきな　くちで　エサを　まるのみ　する。
        ヘビのように　からだを　くねらせて　およぐ。
      ja: |-
        魚の　形をした　シッポで　おびき寄せ
        大きな　口で　エサを　丸のみ　する。
        ヘビのように　体を　くねらせて　泳ぐ。
      ko: |-
        물고기 모양 꼬리로 유인하여
        큰 입으로 먹이를 통째로 삼킨다.
        뱀처럼 몸을 구부리며 헤엄친다.
      en: |-
        Huntail’s tail is shaped like a fish. It uses the tail to attract
        prey, then swallows the prey whole with its large, gaping
        mouth. This Pokémon swims by wiggling its slender body
        like a snake.
      fr: |-
        La queue de Serpang est en forme de poisson. Il l’utilise pour
        attirer sa proie qu’il avale en une fois grâce à sa bouche
        béante. Ce Pokémon nage en tortillant son corps comme
        un serpent.
      de: |-
        Aalabyss’ Schweif ist wie ein Fisch geformt. Es benutzt ihn,
        um Beute anzuziehen und schluckt diese dann im Ganzen
        herunter. Beim Schwimmen bewegt es seinen schlanken Körper
        wie eine Schlange.
      es: |-
        Huntail tiene una cola en forma de pez, que usa para atraer a
        su presa. Una vez que la tiene cerca, la engulle sin más. Este
        Pokémon nada haciendo serpentear el cuerpo como si fuera
        un reptil.
      it: |-
        La coda di Huntail è a forma di pesce. Il Pokémon la usa
        come esca per la preda, che poi ingoia intera con l’enorme
        bocca spalancata. Nuota facendo ondeggiare il corpo
        snello a forma di serpente.
    ultra-sun:
      ja-Hrkt: |-
        およぐちからは　あまり　つよくない。
        シッポを　ふって　えものを　よびよせ
        ちかよったところを　ガブリと　いく。
      ja: |-
        泳ぐ力は　あまり　強くない。
        シッポを　振って　獲物を　呼び寄せ
        近寄ったところを　ガブリと　いく。
      ko: |-
        헤엄치는 힘은 그다지 강하지 않다.
        꼬리를 흔들어 먹이를 유인해
        다가오면 덥석 문다.
      zh-Hant: |-
        游泳能力不怎麼強，
        會揮動尾巴來吸引獵物，
        趁獵物靠近的時候一口咬住。
      zh-Hans: |-
        游泳能力不太强。
        会挥动尾巴来吸引猎物，
        在很接近的时候一口咬住。
      en: |-
        It’s not the strongest swimmer. It wags its tail to
        lure in its prey and then gulps them down as
        soon as they get close.
      fr: |-
        Ce piètre nageur se sert de sa queue pour
        appâter ses proies. Il les gobe si elles
        approchent de trop près.
      de: |-
        Schwimmen ist nicht seine Stärke. Es schwingt
        seinen Schweif, um Beute anzulocken und
        verschluckt sie im Ganzen, wenn sie sich nähert.
      es: |-
        Curiosamente, no es un gran nadador. Agita la
        cola para atraer a sus presas y, cuando estas
        se acercan, las engulle de golpe.
      it: |-
        Non è un grande nuotatore. Attira la preda
        agitando la coda, e non appena si avvicina
        la ingoia in un boccone.
    ultra-moon:
      ja-Hrkt: |-
        しんかいに　せいそく。　ハンテールが
        はまに　うちあがると　ふきつなことが
        おこるという　いいつたえが　ある。
      ja: |-
        深海に　生息。　ハンテールが
        浜に　打ちあがると　不吉なことが
        起こるという　言い伝えが　ある。
      ko: |-
        심해에 서식한다. 헌테일이
        해변에 올라오면 불길한 일이
        일어난다는 전설이 있다.
      zh-Hant: |-
        棲息在深海中。傳說如果
        有獵斑魚被沖上沙灘，
        就會有不好的事發生。
      zh-Hans: |-
        栖息在深海中。
        传说，如果猎斑鱼被冲上沙滩，
        就会有不祥的事情发生。
      en: |-
        Deep seas are their habitat. According to
        tradition, when Huntail wash up onshore,
        something unfortunate will happen.
      fr: |-
        Il habite dans les profondeurs de l’océan.
        Un Serpang trouvé sur la plage serait
        un mauvais présage.
      de: |-
        Es lebt in der Tiefsee. Einer Überlieferung
        zufolge geschieht etwas Unheilvolles, wenn
        ein Aalabyss am Strand auftaucht.
      es: |-
        Vive en los fondos marinos. Según una leyenda,
        que un Huntail aparezca varado en la playa es
        señal de mal augurio.
      it: |-
        Vive nelle profondità marine. Secondo le
        leggende, quando un Huntail si arena sulla riva
        è segno che sta per accadere una disgrazia.
