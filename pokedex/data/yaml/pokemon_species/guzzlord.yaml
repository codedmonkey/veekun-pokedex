guzzlord:
  base_happiness: 0
  capture_rate: 45
  color: black
  egg_groups:
    - no-eggs
  evolution_chain: guzzlord
  evolves_from: ~
  flavor_text:
    sun:
      ja-Hrkt: |-
        やまを　くらい　けずり　ビルを
        のみこむ　すがたが　ほうこく　された。
        ウルトラビーストの　いっしゅ。
      ja: |-
        山を　喰らい　削り　ビルを
        飲みこむ　姿が　報告　された。
        ウルトラビーストの　一種。
      ko: |-
        산을 깎아 먹고 빌딩을
        삼키는 모습이 보고되었다.
        울트라비스트 중 하나이다.
      zh-Hant: |-
        報告指出有人見過牠
        削山吞樓的模樣。
        是究極異獸的一種。
      zh-Hans: |-
        有人报告过它啃噬山体，
        以及吞掉大楼的模样。
        是究极异兽的一种。
      en: |-
        It has gobbled mountains and swallowed whole
        buildings, according to reports. It’s one of the
        Ultra Beasts.
      fr: |-
        Une espèce d’Ultra-Chimère.
        On l’aurait aperçue dévorant des montagnes
        et des gratte-ciel.
      de: |-
        Eine Ultrabestie, die einigen Berichten zufolge
        ganze Berge vertilgt und selbst mehrstöckige
        Gebäude verschlingen kann.
      es: |-
        Se dice que este Ultraente ha sido avistado
        devorando montañas enteras y tragándose
        prominentes edificios.
      it: |-
        Stando alle testimonianze, è in grado di divorare
        intere montagne e di inghiottire edifici in un solo
        boccone. È una delle Ultracreature.
    moon:
      ja-Hrkt: |-
        きけんせいぶつ　ビーストの　いっしゅ。
        つねに　なにかを　くらっているようだが
        なぜか　フンは　みはっけん。
      ja: |-
        危険生物　ビーストの　一種。
        つねに　なにかを　喰らっているようだが
        なぜか　フンは　未発見。
      ko: |-
        위험생물 비스트의 일종.
        항상 무언가를 먹고 있는 듯하지만
        왜인지 배설물은 발견되지 않았다.
      zh-Hant: |-
        危險生物，是究極異獸的一種。
        好像一直都在吃著什麼，
        但不知為何從未發現過糞便。
      zh-Hans: |-
        危险生物，究极异兽的一种。
        好像一直都在吃着什么，
        但不知为何从没发现过粪便。
      en: |-
        A dangerous Ultra Beast, it appears to be eating
        constantly, but for some reason its droppings
        have never been found.
      fr: |-
        L’une des dangereuses Ultra-Chimères.
        Elle est constamment en train de manger,
        mais ne semble pas produire d’excréments.
      de: |-
        Eine gefährliche Ultrabestie, die ununterbrochen
        mit Fressen beschäftigt zu sein scheint.
        Es wurden jedoch nie Exkremente gefunden.
      es: |-
        Un Ultraente extremadamente peligroso. Engulle
        todo lo que encuentra, pero, por alguna razón,
        no se han encontrado excrementos suyos.
      it: |-
        È una delle pericolose Ultracreature.
        Mangia continuamente, ma per qualche strano
        motivo non produce escrementi.
    ultra-sun:
      ja-Hrkt: |-
        このせかいでは　いしつで　きけんだが
        ほんらい　すんでいる　せかいでは
        ふつうに　みかける　せいぶつらしい。
      ja: |-
        この世界では　異質で　危険だが
        本来　棲んでいる　世界では
        普通に　見かける　生物らしい。
      ko: |-
        이 세계와는 성질이 다르고
        위험하지만 원래 살던 세계에서는
        흔히 볼 수 있는 생물인 듯하다.
      zh-Hant: |-
        在這個世界是危險的異類，
        但在原本棲息的世界裡，
        牠似乎是常見的普通生物。
      zh-Hans: |-
        在这个世界是异类，很危险，
        但在它原本栖息的世界，
        好像只是寻常能见的生物。
      en: |-
        Although it’s alien to this world and a danger
        here, it’s apparently a common organism in the
        world where it normally lives.
      fr: |-
        Cette créature venue d’ailleurs est dangereuse
        dans notre monde, mais il semblerait qu’elle soit
        très commune dans le sien.
      de: |-
        In dieser Welt wirkt sein Aussehen gefährlich
        und fremdartig, doch in seiner ursprünglichen
        Welt ist es ein ganz gewöhnliches Lebewesen.
      es: |-
        Para los seres de este mundo resulta extraño
        y peligroso, pero en el mundo del que procede
        es una criatura muy común.
      it: |-
        Nel nostro mondo il suo aspetto appare strano
        e minaccioso, ma sembra che in quello da cui
        proviene sia una creatura molto comune.
    ultra-moon:
      ja-Hrkt: |-
        ＵＢと　よばれる　みちの　せいめい。
        つねに　はらを　すかせているのか
        ずっと　なにかを　くらっている。
      ja: |-
        ＵＢと　呼ばれる　未知の　生命。
        常に　腹を　すかせているのか
        ずっと　なにかを　喰らっている。
      ko: |-
        UB라고 불리는 미지의 생명체.
        늘 배가 고픈 상태인 것인지
        계속해서 무언가를 먹고 있다.
      zh-Hant: |-
        被稱為究極異獸的未知生命。
        不知是否總覺得肚子餓，
        牠隨時都在吃東西。
      zh-Hans: |-
        被称为究极异兽的未知生命。
        不知是不是经常觉得肚子饿，
        一直都在吃着什么东西。
      en: |-
        An unknown life-form called a UB. It may be
        constantly hungry—it is certainly always
        devouring something.
      fr: |-
        Cette créature inconnue appelée
        « Ultra-Chimère » semble constamment
        affamée : elle mange en permanence.
      de: |-
        Eine unbekannte Lebensform, die zu den
        Ultrabestien gehört. Sie scheint immer hungrig
        zu sein, da sie ununterbrochen frisst.
      es: |-
        Uno de los extraños Ultraentes. Siempre está
        comiendo algo, como poseído de un hambre
        insaciable.
      it: |-
        Una misteriosa forma di vita nota come
        Ultracreatura. Mangia in continuazione, come
        se fosse costantemente affamata.
