    x:
      ja-Hrkt: |-
        なんまんねんも　ちかの　あつりょくで
        きたえられた　きんぞくの　ボディは
        きずひとつ　つかない。
      ja: |-
        何万年も　地下の　圧力で
        鍛えられた　金属の　ボディは
        傷ひとつ　つかない。
      ko: |-
        몇만 년 동안 지하의 압력에 의해서
        단련된 금속의 몸은
        상처 하나 입지 않는다.
      en: |-
        Tempered by pressure underground over tens of
        thousands of years, its body cannot be scratched.
      fr: |-
        Son corps invulnérable fut forgé par la pression
        souterraine durant des dizaines de milliers d’années.
      de: |-
        Im Laufe der Jahrtausende, die es unterirdisch lebte,
        wurde sein Körper durch Druck und Wärme hart.
      es: |-
        Su cuerpo ha estado sometido a la presión subterránea
        durante miles de años y no puede arañarse.
      it: |-
        La pressione subita sottoterra per decine di migliaia
        di anni ha reso il suo corpo resistentissimo.
    'y':
      ja-Hrkt: |-
        どんな　きんぞく　よりも　かたいと
        いわれる　からだ。ちょうさの　けっか
        からだの　なかは　くうどう　だった。
      ja: |-
        どんな　金属よりも　硬いと
        言われる　体。調査の　結果
        体の　中は　空洞だった。
      ko: |-
        어떤 금속보다도 딱딱하다고
        전해지는 몸이다. 조사 결과
        몸 안은 비어 있었다.
      en: |-
        Its body is said to be harder than any kind of metal.
        A study has revealed that its body is hollow.
      fr: |-
        Son corps, plus dur que n’importe quel métal, serait
        creux selon les dernières analyses scientifiques.
      de: |-
        Sein Körper ist härter als jedes andere Metall.
        Untersuchungen zufolge ist es innen hohl.
      es: |-
        Se dice que su cuerpo es más duro que cualquier
        metal. Su interior es hueco, según ciertos estudios.
      it: |-
        Ha un corpo più duro di qualunque metallo.
        Una ricerca ha stabilito che all’interno è cavo.
    omega-ruby:
      ja-Hrkt: |-
        どんな　きんぞくよりも　かたい　からだを　もつ。
        からだの　なかは　くうどうに　なっているらしく
        たべている　ものも　わからない　ポケモンだ。
      ja: |-
        どんな　金属よりも　硬い　体を　持つ。
        体の　中は　空洞に　なっているらしく
        食べている　ものも　分からない　ポケモンだ。
      ko: |-
        어떤 금속보다도 단단한 몸을 지녔다.
        몸 안은 비어 있는 듯하며
        먹는 것도 알려지지 않은 포켓몬이다.
      en: |-
        Registeel has a body that is harder than any kind of metal.
        Its body is apparently hollow. No one has any idea what this
        Pokémon eats.
      fr: |-
        Le corps de Registeel est plus dur que n’importe quel métal
        existant. Il est apparemment creux. Personne ne sait ce que
        ce Pokémon mange.
      de: |-
        Registeel hat einen Körper, der härter ist als jede Art von
        Metall. Sein Körper scheint hohl zu sein. Niemand hat eine
        Ahnung, was dieses Pokémon wohl frisst.
      es: |-
        No hay metal que supere en dureza el cuerpo de Registeel,
        que tiene aspecto de estar hueco. Nadie sabe de qué se
        alimenta este Pokémon.
      it: |-
        Registeel ha un corpo più duro di ogni tipo di metallo.
        Pare inoltre che all’interno sia totalmente vuoto.
        Nessuno sa cosa mangi questo Pokémon.
    alpha-sapphire:
      ja-Hrkt: |-
        むかし　ひとによって　ふういんされた　ポケモン。
        からだを　つくる　きんぞくは　ちきゅうじょうに
        そんざいしない　ぶっしつと　かんがえられている。
      ja: |-
        昔　人によって　封印された　ポケモン。
        体を　つくる　金属は　地球上に
        存在しない　物質と　考えられている。
      ko: |-
        오래전 사람에게 봉인된 포켓몬이다.
        몸을 이루고 있는 금속은 지구 상에
        존재하지 않는 물질이라고 여겨진다.
      en: |-
        Registeel was imprisoned by people in ancient times.
        The metal composing its body is thought to be a curious
        substance that is not of this earth.
      fr: |-
        Il y a très longtemps, Registeel fut emprisonné par les
        hommes. On pense que l’étrange métal qui compose
        son corps provient d’une autre planète.
      de: |-
        Registeel wurde vor langer Zeit von den Menschen
        eingesperrt. Das Metall, aus dem sein Körper besteht,
        ist eine seltsame Substanz, die nicht von dieser Welt sein soll.
      es: |-
        Hace mucho tiempo Registeel estuvo preso. La gente piensa
        que el metal del que está hecho es una curiosa sustancia
        extraterrestre.
      it: |-
        Registeel è stato imprigionato dagli esseri umani
        nell’antichità. Pare che il metallo di cui è composto
        provenga dallo spazio.
    sword:
      ja-Hrkt: |-
        のびちぢみする　やわらかさも　あるが
        どんな　きんぞくよりも　がんじょうな
        ふしぎな　ぶっしつで　できている。
      ja: |-
        伸び縮みする　柔らかさも　あるが
        どんな　金属よりも　頑丈な
        不思議な　物質で　できている。
      ko: |-
        늘었다 줄었다 하는 유연함도 갖췄지만
        어떤 금속보다도 튼튼한
        신비한 물질로 이루어져 있다.
      zh-Hant: |-
        構成牠身體的神奇物質
        具有能夠伸縮的柔軟性，
        但卻比任何金屬都還要堅韌。
      zh-Hans: |-
        虽然也拥有能伸能缩的柔软性，
        但它其实是由比任何金属
        都要结实的神秘物质构成的。
      en: |-
        Registeel’s body is made of a strange material
        that is flexible enough to stretch and shrink but
        also more durable than any metal.
      fr: |-
        Il est fait d’une matière mystérieuse plus solide
        que n’importe quel métal, mais assez souple
        pour pouvoir s’étirer ou se rétrécir.
      de: |-
        Es besteht aus einer seltsamen Substanz, die
        robuster als jedes Metall, jedoch zugleich auch
        weich und elastisch ist.
      es: |-
        Está hecho de una misteriosa sustancia que, pese
        a ser más dura que cualquier metal, se contrae y
        dilata con facilidad.
      it: |-
        È composto da un materiale misterioso più
        resistente di qualsiasi metallo, ma al contempo
        abbastanza morbido da essere elastico.
    shield:
      ja-Hrkt: |-
        ちかの　マントルの　なかで　うまれて
        およそ　１まんねんまえに　ちじょうに
        でてきたと　うわさされている。
      ja: |-
        地下の　マントルの　中で　生まれて
        およそ　１万年前に　地上に
        出てきたと　噂されている。
      ko: |-
        땅속 맨틀에서 태어나
        약 1만 년 전에 지상으로
        올라왔다는 이야기가 있다.
      zh-Hant: |-
        據說牠誕生於地底的
        地幔中，並且在大約
        １萬年前出現在地表。
      zh-Hans: |-
        据说诞生于地幔之中，
        在距今约１万年前
        现身于地面之上。
      en: |-
        It’s rumored that this Pokémon was born deep
        underground in the planet’s mantle and that it
        emerged onto the surface 10,000 years ago.
      fr: |-
        Il paraît qu’il est né dans le manteau terrestre
        et qu’il en a émergé il y a environ 10 000 ans.
      de: |-
        Gerüchten zufolge wurde dieses Pokémon tief
        im Mantel des Planeten geboren und kam vor
        etwa 10 000 Jahren an die Oberfläche.
      es: |-
        Dicen que se formó en el manto terrestre y
        ascendió a la superficie hace aproximadamente
        diez mil años.
      it: |-
        Si dice che sia nato nel mantello terrestre e
        che sia salito in superficie circa 10.000 anni fa.
