seismitoad:
  base_happiness: 50
  capture_rate: 45
  color: blue
  egg_groups:
    - water1
  evolution_chain: tympole
  evolves_from: palpitoad
  flavor_text:
    black:
      en: |-
        They shoot paralyzing liquid from their
        head bumps. They use vibration to hurt
        their opponents.
      fr: |-
        Il fait gicler un liquide paralysant des
        pustules sur sa tête, et attaque
        ses ennemis à coups de vibrations.
    white:
      en: |-
        It increases the power of its punches by
        vibrating the bumps on its fists. It can
        turn a boulder to rubble with one punch.
      fr: |-
        Son coup de poing est plus fort quand il
        fait vibrer la pustule dessus. Il peut
        briser un gros rocher d’un coup.
    black-2:
      en: |-
        By putting power into its bumps,
        it creates vibrations and increases
        the power of its punches.
    white-2:
      en: |-
        By putting power into its bumps,
        it creates vibrations and increases
        the power of its punches.
    x:
      ja-Hrkt: |-
        こぶしの　コブを　しんどうさせると
        パンチの　いりょくが　ばいぞうする。
        いちげきで　おおいわを　ふんさい。
      ja: |-
        こぶしの　コブを　振動させると
        パンチの　威力が　倍増する。
        一撃で　大岩を　粉砕。
      ko: |-
        주먹의 혹을 진동시켜
        펀치의 위력을 배가시킨다.
        일격에 큰 바위를 부스러뜨린다.
      en: |-
        It increases the power of its punches by vibrating
        the bumps on its fists. It can turn a boulder to
        rubble with one punch.
      fr: |-
        Son coup de poing est plus fort quand il fait vibrer
        la pustule dessus. Il peut briser un gros rocher d’un
        coup.
      de: |-
        Wenn es die Beulen an seinen Fäusten zum
        Schwingen bringt, kann es doppelt so fest
        zuschlagen und Felsen zertrümmern.
      es: |-
        Aumenta la potencia de sus puñetazos haciendo vibrar
        sus puños. Es capaz de quebrar una roca de un solo
        golpe.
      it: |-
        Facendo vibrare le protuberanze sui pugni, ne
        raddoppia la potenza. Frantuma enormi massi con
        un colpo.
    'y':
      ja-Hrkt: |-
        あたまの　コブから　しんけいを
        マヒさせる　えきたいを　とばす。
        しんどうで　あいてを　くるしめる。
      ja: |-
        頭の　コブから　神経を　マヒさせる
        液体を　飛ばす。
        振動で　相手を　苦しめる。
      ko: |-
        머리의 혹에서 신경을
        마비시키는 액체를 날린다.
        진동으로 상대를 괴롭힌다.
      en: |-
        They shoot paralyzing liquid from their head bumps.
        They use vibration to hurt their opponents.
      fr: |-
        Il fait gicler un liquide paralysant des pustules sur
        sa tête, et attaque ses ennemis à coups de vibrations.
      de: |-
        Es schießt eine lähmende Flüssigkeit aus den Beulen
        auf seinem Kopf. Es plagt seine Gegner mit
        Schallwellen.
      es: |-
        Despide un líquido paralizador por los bultos de su
        cabeza. Atormenta a sus oponentes con enormes
        vibraciones.
      it: |-
        Dalle escrescenze che ha sulla testa spara un liquido
        che paralizza i nervi. Usa le vibrazioni per attaccare il
        nemico.
    omega-ruby:
      ja-Hrkt: |-
        こぶしの　コブを　しんどうさせると
        パンチの　いりょくが　ばいぞうする。
        いちげきで　おおいわを　ふんさい。
      ja: |-
        こぶしの　コブを　振動させると
        パンチの　威力が　倍増する。
        一撃で　大岩を　粉砕。
      ko: |-
        주먹의 혹을 진동시켜
        펀치의 위력을 배가시킨다.
        일격에 큰 바위를 부스러뜨린다.
      en: |-
        It increases the power of its punches by vibrating
        the bumps on its fists. It can turn a boulder to
        rubble with one punch.
      fr: |-
        Son coup de poing est plus fort quand il fait vibrer la pustule
        dessus. Il peut briser un gros rocher d’un coup.
      de: |-
        Wenn es die Beulen an seinen Fäusten zum Schwingen bringt,
        kann es doppelt so fest zuschlagen und Felsen zertrümmern.
      es: |-
        Aumenta la potencia de sus puñetazos haciendo vibrar sus
        puños. Es capaz de quebrar una roca de un solo golpe.
      it: |-
        Facendo vibrare le protuberanze sui pugni, ne raddoppia
        la potenza. Frantuma enormi massi con un colpo.
    alpha-sapphire:
      ja-Hrkt: |-
        あたまの　コブから　しんけいを
        マヒさせる　えきたいを　とばす。
        しんどうで　あいてを　くるしめる。
      ja: |-
        頭の　コブから　神経を　マヒさせる
        液体を　飛ばす。
        振動で　相手を　苦しめる。
      ko: |-
        머리의 혹에서 신경을
        마비시키는 액체를 날린다.
        진동으로 상대를 괴롭힌다.
      en: |-
        They shoot paralyzing liquid from their head bumps.
        They use vibration to hurt their opponents.
      fr: |-
        Il fait gicler un liquide paralysant des pustules sur sa tête,
        et attaque ses ennemis à coups de vibrations.
      de: |-
        Es schießt eine lähmende Flüssigkeit aus den Beulen
        auf seinem Kopf. Es plagt seine Gegner mit Schallwellen.
      es: |-
        Despide un líquido paralizador por los bultos de su cabeza.
        Atormenta a sus oponentes con enormes vibraciones.
      it: |-
        Dalle escrescenze che ha sulla testa spara un liquido che
        paralizza i nervi. Usa le vibrazioni per attaccare il nemico.
    sword:
      ja-Hrkt: |-
        ぜんしんの　コブを　ふるわせて
        じしんのような　ゆれを　おこす。
        グレッグルと　ちかい　しゅるい。
      ja: |-
        全身の　コブを　震わせて
        地震のような　揺れを　起こす。
        グレッグルと　近い　種類。
      ko: |-
        전신의 혹을 진동시켜서
        지진과 같은 흔들림을 일으킨다.
        삐딱구리와 가까운 종이다.
      zh-Hant: |-
        透過震動全身的瘤
        來引發地震般的晃動。
        與不良蛙是相近的物種。
      zh-Hans: |-
        通过震动全身的瘤，
        引发地震般的晃动。
        与不良蛙是相近的物种。
      en: |-
        The vibrating of the bumps all over its body
        causes earthquake-like tremors. Seismitoad and
        Croagunk are similar species.
      fr: |-
        En faisant vibrer tous les pustules de son corps,
        il peut provoquer des secousses similaires à celles
        d’un séisme. Il est proche des Cradopaud.
      de: |-
        Die Beulen, die seinen ganzen Körper bedecken,
        können Erschütterungen auf Erdbebenstärke
        erzeugen. Es ist artverwandt mit Glibunkel.
      es: |-
        Cuando hace vibrar los bultos de su cuerpo,
        provoca sacudidas que parecen terremotos.
        Está emparentado con los Croagunk.
      it: |-
        Fa vibrare le protuberanze su tutto il corpo
        provocando delle scosse simili a un terremoto.
        Come specie è affine ai Croagunk.
    shield:
      ja-Hrkt: |-
        コブが　おこす　バイブレーションが
        マッサージに　よいと　ろうじんに
        だいにんきの　ポケモンだ。
      ja: |-
        コブが　起こす　バイブレーションが
        マッサージに　良いと　老人に
        大人気の　ポケモンだ。
      ko: |-
        혹이 일으키는 바이브레이션이
        마사지에 좋다고 노인에게
        인기가 높은 포켓몬이다.
      zh-Hant: |-
        在老年人之間廣受歡迎。
        因為他們覺得牠身上的瘤
        發出的震動拿來按摩剛剛好。
      zh-Hans: |-
        在老年人之间广受欢迎。
        因为他们觉得它身上的瘤
        发出的震动拿来按摩刚刚好。
      en: |-
        This Pokémon is popular among the elderly,
        who say the vibrations of its lumps are great
        for massages.
      fr: |-
        Ce Pokémon est un excellent masseur grâce
        aux vibrations de ses pustules. Les personnes
        âgées l’apprécient particulièrement.
      de: |-
        Es erfreut sich großer Beliebtheit bei Senioren,
        seit bekannt wurde, dass sich seine vibrierenden
        Beulen zur Massagetherapie einsetzen lassen.
      es: |-
        Las vibraciones de sus bultos resultan perfectas
        para dar masajes, lo que lo ha hecho muy
        popular entre la tercera edad.
      it: |-
        Particolarmente amato dagli anziani per via
        delle vibrazioni prodotte dalle protuberanze
        sui suoi pugni, perfette per fare massaggi.
