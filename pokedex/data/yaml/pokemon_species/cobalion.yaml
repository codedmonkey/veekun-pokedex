  flavor_text:
    black:
      en: |-
        This legendary Pokémon battled against
        humans to protect Pokémon.
        Its personality is calm and composed.
      fr: |-
        Un Pokémon légendaire qui a combattu
        les humains pour protéger les Pokémon.
        Il est d’un naturel calme et posé.
    white:
      en: |-
        It has a body and heart of steel.
        Its glare is sufficient to make even
        an unruly Pokémon obey it.
      fr: |-
        Il possède un corps et un cœur de fer.
        Il peut mater les Pokémon les plus
        agressifs d’un simple regard.
    black-2:
      en: |-
        It has a body and heart of steel.
        It worked with its allies to punish
        people when they hurt Pokémon.
    white-2:
      en: |-
        It has a body and heart of steel.
        It worked with its allies to punish
        people when they hurt Pokémon.
    x:
      ja-Hrkt: |-
        はがねの　からだと　こころを　もつ。
        にらみつけるだけで　きょうぼうな
        ポケモンも　したがわせてしまう。
      ja: |-
        鋼の　体と　心を　持つ。
        にらみつけるだけで　凶暴な
        ポケモンも　従わせてしまう。
      ko: |-
        강철의 몸과 마음을 지녔다.
        째려보기만 해도 난폭한
        포켓몬마저도 따르게 된다.
      en: |-
        It has a body and heart of steel. Its glare is
        sufficient to make even an unruly Pokémon obey it.
      fr: |-
        Il possède un corps et un cœur de fer. Il peut mater
        les Pokémon les plus agressifs d’un simple regard.
      de: |-
        Sein Körper und sein Herz sind aus Stahl. Ein böser
        Blick genügt und selbst die wildesten Pokémon
        unterwerfen sich ihm.
      es: |-
        Posee un cuerpo y un corazón de acero. Basta una
        mirada suya para que Pokémon violentos le
        obedezcan.
      it: |-
        Ha un corpo e uno spirito d’acciaio. Gli basta lo
        sguardo per farsi ubbidire anche dai Pokémon più
        feroci.
    'y':
      ja-Hrkt: |-
        はがねの　こころと　からだを　もつ。
        ひとが　ポケモンを　きずつけたとき
        なかまとともに　ひとを　こらしめた。
      ja: |-
        鋼の　心と　体を　持つ。
        人が　ポケモンを　傷つけたとき
        仲間とともに　人を　こらしめた。
      ko: |-
        강철의 마음과 몸을 지녔다.
        사람이 포켓몬을 상처 입혔을 때
        동료와 함께 사람을 벌했다.
      en: |-
        It has a body and heart of steel. It worked with its
        allies to punish people when they hurt Pokémon.
      fr: |-
        Un corps et un cœur en acier trempé, jadis au service
        de la défense des Pokémon blessés par les humains.
      de: |-
        Sein Körper und Herz sind aus Stahl. Gemeinsam
        mit seinen Gefährten bestrafte es alle Menschen,
        die Pokémon verletzen.
      es: |-
        Posee cuerpo y alma de acero. Junto con sus
        compañeros, castiga a aquellas personas que hacen
        daño a Pokémon.
      it: |-
        Ha un corpo e uno spirito d’acciaio. È comparso con
        i suoi compagni per punire coloro che un tempo
        ferirono i Pokémon.
