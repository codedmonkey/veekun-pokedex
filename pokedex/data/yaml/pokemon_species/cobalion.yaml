    sword:
      ja-Hrkt: |-
        テラキオン　ビリジオンと　ともに
        イッシュちほうの　ポケモンを　まもり
        ひとと　たたかった　でんせつがある。
      ja: |-
        テラキオン　ビリジオンと　ともに
        イッシュ地方の　ポケモンを　守り
        人と　戦った　伝説がある。
      ko: |-
        테라키온 비리디온과 함께
        하나지방의 포켓몬을 지키기 위해
        인간에 맞서 싸웠다는 전설이 있다.
      zh-Hant: |-
        傳說牠曾經與代拉基翁和
        畢力吉翁一起，為了保護
        合眾地區的寶可夢而與人類作戰。
      zh-Hans: |-
        传说它曾经与代拉基翁和
        毕力吉翁一起，为了保护
        合众地区的宝可梦而与人类作战。
      en: |-
        This Pokémon appears in a legend alongside
        Terrakion and Virizion, fighting against humans in
        defense of the Unova region’s Pokémon.
      fr: |-
        Selon la légende, il aurait défié les Hommes,
        aux côtés de Terrakium et de Viridium,
        pour protéger les Pokémon d’Unys.
      de: |-
        Legenden zufolge kämpfte es einst zusammen mit
        Terrakium und Viridium gegen die Menschen, um
        die Pokémon der Einall-Region zu beschützen.
      es: |-
        Cuenta una leyenda que combatió contra los
        humanos junto a Terrakion y Virizion para
        proteger a los Pokémon de Teselia.
      it: |-
        La leggenda narra che abbia lottato assieme
        a Terrakion e Virizion contro gli esseri umani
        per proteggere i Pokémon di Unima.
    shield:
      ja-Hrkt: |-
        うまれながら　リーダーの　ふうかくを
        みにつける。　きょうぼうな　あいても
        コバルオンの　まえでは　おとなしい。
      ja: |-
        生まれながら　リーダーの　風格を
        身につける。　狂暴な　相手も
        コバルオンの　前では　おとなしい。
      ko: |-
        태어나면서부터 리더의 품격을
        몸에 지녔다. 흉포한 상대도
        코바르온의 앞에서는 온순하다.
      zh-Hant: |-
        生來就具有領導風範。
        即使是性情狂暴的寶可夢，
        在勾帕路翁面前也會變得溫順。
      zh-Hans: |-
        生来就具有领导风范。
        即使是性格狂暴的宝可梦，
        在勾帕路翁面前也会变得温顺。
      en: |-
        From the moment it’s born, this Pokémon
        radiates the air of a leader. Its presence will
        calm even vicious foes.
      fr: |-
        Dès la naissance, il a un air de chef.
        Même le plus terrible des adversaires file doux
        face à lui.
      de: |-
        Kobalium ist der geborene Anführer. Selbst die
        gefährlichsten Gegner unterwerfen sich ihm.
      es: |-
        Un líder nato. Incluso los Pokémon más agresivos
        se muestran dóciles en su presencia.
      it: |-
        È un leader nato. Al suo cospetto anche
        i Pokémon più feroci assumono un
        atteggiamento reverenziale.
