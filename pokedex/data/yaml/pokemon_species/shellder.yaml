    sword:
      ja-Hrkt: |-
        ２まいのカラを　あけたり　とじたり
        することで　うしろむきに　およぐ。
        そのスピードは　けっこう　はやい。
      ja: |-
        ２枚の殻を　開けたり　閉じたり
        することで　後ろ向きに　泳ぐ。
        そのスピードは　けっこう　速い。
      ko: |-
        2개의 껍질을 여닫아서
        뒤쪽으로 헤엄친다.
        그 스피드는 제법 빠르다.
      zh-Hant: |-
        透過２片貝殼的不斷開合
        來向後方游動。
        游動的速度相當快。
      zh-Hans: |-
        通过２片贝壳的不断开合
        来向后方游动。
        游动的速度相当快。
      en: |-
        It swims facing backward by opening and closing
        its two-piece shell. It is surprisingly fast.
      fr: |-
        Il nage vers l’arrière à grande vitesse en ouvrant
        puis refermant sa coquille.
      de: |-
        Es schwimmt rückwärts, indem es seine Schale
        öffnet und schließt, und ist damit überraschend
        schnell.
      es: |-
        Nada hacia atrás abriendo y cerrando su concha.
        Es sorprendentemente rápido.
      it: |-
        Nuota all’indietro aprendo e chiudendo le
        due valve. È sorprendentemente rapido.
    shield:
      ja-Hrkt: |-
        かたいカラは　どんな　こうげきも
        はねかえす。　ひらいた　ときに
        なかを　こうげき　されると　よわい。
      ja: |-
        硬い　殻は　どんな　攻撃も
        跳ねかえす。　開いたときに
        中を　攻撃されると　弱い。
      ko: |-
        단단한 껍데기는 어떤 공격도
        튕겨낸다. 껍데기를 열었을 때
        안쪽을 공격당하는 것에는 약하다.
      zh-Hant: |-
        堅硬的殼能反彈任何攻擊。
        如果在殼張開時被攻擊到內部，
        就會變得十分脆弱。
      zh-Hans: |-
        坚硬的壳能反弹任何攻击。
        壳打开时，如果里面的部分
        受到攻击，就会变得很脆弱。
      en: |-
        Its hard shell repels any kind of attack. It is
        vulnerable only when its shell is open.
      fr: |-
        Sa coquille est si résistante qu’elle repousse
        toutes les attaques. En revanche, il est vulnérable
        quand celle-ci s’ouvre.
      de: |-
        Eine harte Schale schützt dieses Pokémon.
        Nur wenn es diese öffnet, wird es verwundbar.
      es: |-
        La concha lo protege de cualquier tipo de
        ataque. Solo es vulnerable cuando se abre.
      it: |-
        La sua conchiglia dura respinge ogni tipo
        di attacco. È vulnerabile solo quando apre
        le valve.
