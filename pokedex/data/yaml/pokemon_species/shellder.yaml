    x:
      ja-Hrkt: |-
        かたいカラは　どんな　こうげきも
        はねかえす。ひらいた　ときに
        なかを　こうげき　されると　よわい。
      ja: |-
        硬い　殻は　どんな　攻撃も
        跳ね返す。開いたときに
        中を　攻撃されると　弱い。
      ko: |-
        단단한 껍데기는 어떤 공격도
        튕겨낸다. 껍데기를 벌리고 있을 때
        안쪽을 공격당하는 것에는 약하다.
      en: |-
        Its hard shell repels any kind of attack.
        It is vulnerable only when its shell is open.
      fr: |-
        Protégé par une carapace très résistante, il est
        vulnérable quand celle-ci s’ouvre.
      de: |-
        Eine harte Schale schützt dieses Pokémon.
        Nur wenn es diese öffnet, wird es verwundbar.
      es: |-
        La concha lo protege de cualquier tipo de ataque.
        Solo es vulnerable cuando se abre.
      it: |-
        La sua conchiglia dura respinge ogni tipo di attacco.
        È vulnerabile solo quando apre il guscio.
    'y':
      ja-Hrkt: |-
        カラで　はさみこむのは
        やわらかい　なかみを　さらけだすので
        いちか　ばちかの　しゅだん　なのだ。
      ja: |-
        殻で　挟みこむのは
        やわらかい　中身を　さらけ出すので
        一か八かの　手段なのだ。
      ko: |-
        껍데기로 물어 공격하는 것은
        부드러운 안쪽이 드러나므로
        궁지에 몰렸을 때 쓰는 수단이다.
      en: |-
        Clamping on to an opponent reveals its vulnerable
        parts, so it uses this move only as a last resort.
      fr: |-
        Il se referme sur un ennemi pour attaquer, mais ceci
        le rend vulnérable et il ne le fait que rarement.
      de: |-
        Da es seine verwundbarste Stelle beim Klammern
        preisgibt, tut es dies nur in wirklichen Notfällen.
      es: |-
        Cuando atenaza a sus enemigos, se vuelve vulnerable.
        Por eso solo utiliza esta técnica como último recurso.
      it: |-
        Mentre attanaglia il nemico diviene vulnerabile,
        perciò usa questa tecnica come ultima risorsa.
    omega-ruby:
      ja-Hrkt: |-
        よるに　なると　おおきな　ベロで　かいていの
        すなに　あなを　ほり　そのなかで　ねむる。
        カラを　とじて　ねむるが　ベロは　だしたまま。
      ja: |-
        夜に　なると　大きな　ベロで　海底の
        砂に　穴を　掘り　その中で　眠る。
        カラを　閉じ　眠るが　ベロは　出したまま。
      ko: |-
        밤이 되면 큰 혀로 해저의
        모래에 구멍을 뚫고 그 안에서 잔다.
        혀를 내민 채로 껍질을 닫고 잠든다.
      en: |-
        At night, this Pokémon uses its broad tongue to burrow a hole
        in the seafloor sand and then sleep in it. While it is sleeping,
        Shellder closes its shell, but leaves its tongue hanging out.
      fr: |-
        La nuit, ce Pokémon utilise sa grande langue pour creuser
        un trou dans le sable des fonds marins afin d’y dormir.
        Une fois endormi, Kokiyas referme sa coquille, mais laisse
        sa langue dépasser.
      de: |-
        Nachts benutzt dieses Pokémon seine breite Zunge, um ein
        Loch in den Meeresboden zu graben. Darin schläft es.
        Dabei schließt es seine Schale, aber die Zunge hängt heraus.
      es: |-
        Por la noche, este Pokémon usa la ancha lengua que tiene
        para hacer un agujero en el fondo del mar y echarse a dormir.
        Mientras duerme, Shellder cierra la concha, pero deja la
        lengua por fuera.
      it: |-
        Di notte Shellder usa la sua lingua larga per scavare una buca
        sul fondo del mare e infilarcisi per dormire.
        Quando dorme chiude la conchiglia ma lascia la lingua fuori
        a penzoloni.
    alpha-sapphire:
      ja-Hrkt: |-
        よるに　なると　おおきな　ベロで　かいていの
        すなに　あなを　ほり　そのなかで　ねむる。
        カラを　とじて　ねむるが　ベロは　だしたまま。
      ja: |-
        夜に　なると　大きな　ベロで　海底の
        砂に　穴を　掘り　その中で　眠る。
        カラを　閉じ　眠るが　ベロは　出したまま。
      ko: |-
        밤이 되면 큰 혀로 해저의
        모래에 구멍을 뚫고 그 안에서 잔다.
        혀를 내민 채로 껍질을 닫고 잠든다.
      en: |-
        At night, this Pokémon uses its broad tongue to burrow a hole
        in the seafloor sand and then sleep in it. While it is sleeping,
        Shellder closes its shell, but leaves its tongue hanging out.
      fr: |-
        La nuit, ce Pokémon utilise sa grande langue pour creuser
        un trou dans le sable des fonds marins afin d’y dormir.
        Une fois endormi, Kokiyas referme sa coquille, mais laisse
        sa langue dépasser.
      de: |-
        Nachts verwendet dieses Pokémon seine breite Zunge, um ein
        Loch in den Meeresboden zu graben. Darin schläft es. Dabei
        schließt es seine Schale, lässt aber seine Zunge heraushängen.
      es: |-
        Por la noche, este Pokémon usa la ancha lengua que tiene
        para hacer un agujero en el fondo del mar y echarse a dormir.
        Mientras duerme, Shellder cierra la concha, pero deja la
        lengua por fuera.
      it: |-
        Di notte Shellder usa la sua lingua larga per scavare una buca
        sul fondo del mare e infilarcisi per dormire.
        Quando dorme chiude la conchiglia ma lascia la lingua fuori
        a penzoloni.
    sun:
      ja-Hrkt: |-
        カラの　こうどは　ダイヤモンドを
        こえる。　むかしのひとは　カラを
        あつめて　たてを　つくっていた。
      ja: |-
        殻の　硬度は　ダイヤモンドを
        超える。　昔の人は　カラを
        集めて　盾を　造っていた。
      ko: |-
        껍질의 강도는 다이아몬드보다
        높다. 옛날 사람은 껍질을
        모아서 방패를 만들었었다.
      zh-Hant: |-
        殼的硬度超越鑽石。
        古時的人會收集殼來做成盾牌。
      zh-Hans: |-
        壳的硬度超过钻石。
        过去，人们会收集壳来做成盾牌。
      en: |-
        The hardness of its shell surpasses the
        hardness of a diamond. In days gone by,
        people used the shells to make shields.
      fr: |-
        Sa coquille est plus dure que le diamant.
        Dans l’Antiquité, elle a été utilisée comme
        bouclier.
      de: |-
        Ihre Schalen sind härter als Diamanten.
        Vor langer Zeit sammelte man die Schalen
        von Muschas und machte Schilde daraus.
      es: |-
        Su concha, más dura que un diamante, se
        empleaba en la antigüedad para la fabricación
        de escudos.
      it: |-
        La conchiglia esterna è più dura del diamante.
        In passato era usata per costruire scudi.
    moon:
      ja-Hrkt: |-
        つねに　だしっぱなしの　ベロを
        きように　つかって　かいていの　すなを
        ほりおこし　エサを　さがす。
      ja: |-
        常に　出しっぱなしの　ベロを
        器用に　使って　海底の
        砂を　掘り起し　餌を　探す。
      ko: |-
        항상 내밀고 있는 혀를
        능숙히 사용하여 해저의 모래를
        파내 먹이를 찾는다.
      zh-Hant: |-
        靈活運用總是伸出的舌頭
        挖掘海底的沙子，尋找食物。
      zh-Hans: |-
        灵活地运用一直伸着的舌头
        挖掘海底的沙子，寻找食物。
      en: |-
        This Pokémon’s tongue is always hanging out.
        It uses its tongue with great dexterity to dig up
        sand from the seabed in its search for food.
      fr: |-
        Il utilise sa langue protubérante avec habileté
        pour creuser le sable au fond de la mer et
        trouver sa nourriture.
      de: |-
        Seine Zunge hängt immer aus seiner Schale.
        Es sucht nach Beute, indem es mit ihr gezielt
        den Sand am Meeresboden aufwirbelt.
      es: |-
        Este Pokémon usa su lengua diestramente para
        excavar en el fondo del mar y buscar alimento.
      it: |-
        Con la lingua che gli sporge sempre a penzoloni
        scava abilmente sul fondo del mare in cerca
        di cibo.
    ultra-sun:
      ja-Hrkt: |-
        カラの　なかに　たまった　すなは
        やがて　しんじゅに　かわるが
        じゃま　なので　はきだして　すてる。
      ja: |-
        カラの　中に　たまった　砂は
        やがて　真珠に　変わるが
        邪魔　なので　吐き出して　捨てる。
      ko: |-
        껍질 안에 쌓인 모래는
        이윽고 진주가 되지만
        방해가 되기 때문에 뱉어 버린다.
      zh-Hant: |-
        堆積在殼中的沙子
        最後會變成珍珠，
        但會因為佔空間而被牠吐掉。
      zh-Hans: |-
        虽然留在壳里的沙子终会变成珍珠，
        但会因为碍事而被它吐掉。
      en: |-
        The sand that accumulates inside its shell
        eventually becomes a pearl. But the pearl gets
        in the way, so it spits it out and discards it.
      fr: |-
        Avec le temps, les grains de sable accumulés
        dans sa coquille se changent en perles, mais
        comme elles le gênent, il préfère les recracher.
      de: |-
        Der Sand, der sich in Muschas’ Schale sammelt,
        entwickelt sich zu Perlen. Da es diese als
        störend empfindet, spuckt es sie einfach aus.
      es: |-
        La arena que acumula en su interior termina por
        transformarse en una perla, pero la escupe
        porque le supone un estorbo.
      it: |-
        Con il tempo, la sabbia che si accumula
        nel guscio forma delle perle. Poiché gli danno
        noia, il Pokémon le sputa via.
    ultra-moon:
      ja-Hrkt: |-
        カラを　とじているときも　ベロだけは
        だしっぱなし。　つよく　ひっぱると
        おどろき　カラを　ひらいてしまうよ。
      ja: |-
        カラを　閉じているときも　ベロだけは
        出しっぱなし。　強く　引っ張ると
        驚き　カラを　開いてしまうよ。
      ko: |-
        껍질을 닫고 있을 때도 혀만은
        내밀고 있다. 세게 잡아당기면
        놀라서 껍질을 연다.
      zh-Hant: |-
        就算是在緊閉貝殼的時候，舌頭部分
        也會一直露出來。如果用力拉舌頭，
        牠就會嚇得把殼打開。
      zh-Hans: |-
        就算是在紧闭贝壳的时候，舌头也会
        一直露在外面。如果强行拉拽舌头，
        它就会吓得打开贝壳哦。
      en: |-
        Even when its shell is closed, its tongue still
        hangs out. If you give its tongue a good yank,
        the shock will cause Shellder to open its shell.
      fr: |-
        Sa langue dépasse même quand sa coquille est
        fermée. Si on tire fort dessus, cette dernière
        s’ouvre sous l’effet de la surprise.
      de: |-
        Seine Zunge lässt es selbst bei geschlossener
        Schale immer heraushängen. Zieht man fest
        daran, öffnet es vor Schreck seine Schale.
      es: |-
        Siempre tiene la lengua fuera, aun con la concha
        cerrada. Si uno tira de ella con fuerza, la abrirá
        del susto.
      it: |-
        La lingua gli sporge a penzoloni anche quando la
        conchiglia è chiusa. Se gliela si tira con forza,
        Shellder apre la conchiglia per la sorpresa.
    lets-go-pikachu:
      ja-Hrkt: |-
        どんな　こうげきにも　たえる
        かたいカラだが　ひらくと　やわらかい
        なかみが　むきだしになる。
      ja: |-
        どんな　攻撃にも　耐える
        硬いカラだが　開くと　柔らかい
        中身が　むきだしになる。
      ko: |-
        어떤 공격에도 견디는
        단단한 껍질을 가졌지만
        열면 부드러운 몸이 드러난다.
      zh-Hant: |-
        堅硬的外殼能夠抵擋任何攻擊。
        然而只要外殼一打開，
        就會露出裡頭柔軟的身體。
      zh-Hans: |-
        它的硬壳可以承受任何
        攻击，但是一旦硬壳打开，
        它柔软的内部就会完全暴露。
      en: |-
        The shell can withstand any attack. However,
        when it is open, the tender body is exposed.
      fr: |-
        Sa coquille le protège de toute attaque.
        Si elle s’ouvre, son corps fragile devient
        vulnérable.
      de: |-
        Seine Schale ist hart genug, um allen Attacken
        standzuhalten. Wenn sie offen ist, kommt sein
        weiches Inneres zum Vorschein.
      es: |-
        La dura concha que lo recubre resiste cualquier
        ataque, por lo que su frágil cuerpo solo queda
        expuesto cuando esta se abre.
      it: |-
        La sua conchiglia è capace di resistere a
        qualsiasi attacco, ma quando si apre
        il Pokémon diventa molto vulnerabile.
    lets-go-eevee:
      ja-Hrkt: |-
        どんな　こうげきにも　たえる
        かたいカラだが　ひらくと　やわらかい
        なかみが　むきだしになる。
      ja: |-
        どんな　攻撃にも　耐える
        硬いカラだが　開くと　柔らかい
