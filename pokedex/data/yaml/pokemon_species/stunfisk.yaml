stunfisk:
  base_happiness: 70
  capture_rate: 75
  color: brown
  egg_groups:
    - water1
    - indeterminate
  evolution_chain: stunfisk
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        Its skin is very hard, so it is unhurt
        even if stepped on by sumo wrestlers.
        It smiles when transmitting electricity.
      fr: |-
        Sa peau est si dure qu’il peut se faire
        piétiner par un sumo sans rien sentir.
        Il sourit en émettant de l’électricité.
    white:
      en: |-
        It conceals itself in the mud of the
        seashore. Then it waits. When prey touch
        it, it delivers a jolt of electricity.
      fr: |-
        Tapi dans la boue ou les sédiments,
        il attend sa proie patiemment et la
        paralyse avec une décharge électrique.
    black-2:
      en: |-
        When its opponent can’t be paralyzed,
        it contorts itself with unexpected speed
        and flops away.
    white-2:
      en: |-
        When its opponent can’t be paralyzed,
        it contorts itself with unexpected speed
        and flops away.
    x:
      ja-Hrkt: |-
        ひふが　かたいので　すもうとりに
        ふまれても　へいき。でんきを
        ながすとき　わらいがおに　なる。
      ja: |-
        皮膚が　硬いので
        相撲取りに　踏まれても　平気。
        電気を　流すとき　笑い顔に　なる。
      ko: |-
        피부가 단단해서 씨름꾼에게
        밟혀도 아무렇지 않다. 전기를
        흘려보낼 때 웃는 얼굴이 된다.
      en: |-
        Its skin is very hard, so it is unhurt even if stepped
        on by sumo wrestlers. It smiles when
        transmitting electricity.
      fr: |-
        Sa peau est si dure qu’il peut se faire piétiner par
        un sumo sans rien sentir. Il sourit en émettant de
        l’électricité.
      de: |-
        Dank seiner dicken Haut hält es selbst das Gewicht
        eines Sumoringers aus. Wenn es Stromschläge
        verteilt, grinst es.
      es: |-
        Ni un pisotón de un luchador de sumo lo aplastaría
        gracias a su piel sólida. Sonríe al soltar descargas
        eléctricas.
      it: |-
        Ha la pelle così dura che un lottatore di sumo
        potrebbe calpestarlo senza fargli male. L’elettricità
        gli fa il solletico.
    'y':
      ja-Hrkt: |-
        うみべの　どろに　うまって　えものを
        まちかまえる。えものが　さわったとき
        でんきを　だして　しびれさせるのだ。
      ja: |-
        海辺の　泥に　埋まって　獲物を
        待ち構える。獲物が　触ったとき
        電気を　出して　しびれさせるのだ。
      ko: |-
        바닷가 펄 속에 묻혀 먹이를
        기다린다. 먹이가 몸에 닿으면
        전기를 써서 마비시킨다.
      en: |-
        It conceals itself in the mud of the seashore.
        Then it waits. When prey touch it, it delivers a jolt
        of electricity.
      fr: |-
        Tapi dans la boue ou les sédiments, il attend sa proie
        patiemment et la paralyse avec une décharge
        électrique.
      de: |-
        Es vergräbt sich im Morast am Meeresboden. Wird es
        von seiner Beute gestreift, lähmt es sie mit Strom.
      es: |-
        Acecha a sus presas oculto en la arena húmeda de
        la playa. Las paraliza con una descarga eléctrica
        cuando lo tocan.
      it: |-
        Attende al varco le prede, sepolto nel fango in riva
        al mare. Se lo sfiorano, le paralizza con una scarica
        elettrica.
    omega-ruby:
      ja-Hrkt: |-
        ひふが　かたいので　すもうとりに
        ふまれても　へいき。でんきを
        ながすとき　わらいがおに　なる。
      ja: |-
        皮膚が　硬いので
        相撲取りに　踏まれても　平気。
        電気を　流すとき　笑い顔に　なる。
      ko: |-
        피부가 단단해서 씨름꾼에게
        밟혀도 아무렇지 않다. 전기를
        흘려보낼 때 웃는 얼굴이 된다.
      en: |-
        Its skin is very hard, so it is unhurt even if stepped
        on by sumo wrestlers. It smiles when
        transmitting electricity.
      fr: |-
        Sa peau est si dure qu’il peut se faire piétiner par un sumo
        sans rien sentir. Il sourit en émettant de l’électricité.
      de: |-
        Dank seiner dicken Haut hält es selbst das Gewicht eines
        Sumoringers aus. Wenn es Stromschläge verteilt, grinst es.
      es: |-
        Ni un pisotón de un luchador de sumo lo aplastaría gracias a
        su piel sólida. Sonríe al soltar descargas eléctricas.
      it: |-
        Ha la pelle così dura che un lottatore di sumo potrebbe
        calpestarlo senza fargli male. L’elettricità gli fa il solletico.
    alpha-sapphire:
      ja-Hrkt: |-
        うみべの　どろに　うまって　えものを
        まちかまえる。えものが　さわったとき
        でんきを　だして　しびれさせるのだ。
      ja: |-
        海辺の　泥に　埋まって　獲物を
        待ち構える。獲物が　触ったとき
        電気を　出して　しびれさせるのだ。
      ko: |-
        바닷가 펄 속에 묻혀 먹이를
        기다린다. 먹이가 몸에 닿으면
        전기를 써서 마비시킨다.
      en: |-
        It conceals itself in the mud of the seashore.
        Then it waits. When prey touch it, it delivers a jolt
        of electricity.
      fr: |-
        Tapi dans la boue ou les sédiments, il attend sa proie
        patiemment et la paralyse avec une décharge électrique.
      de: |-
        Es vergräbt sich im Morast am Meeresboden. Wird es von
        seiner Beute gestreift, lähmt es sie mit Strom.
      es: |-
        Acecha a sus presas oculto en la arena húmeda de la playa.
        Las paraliza con una descarga eléctrica cuando lo tocan.
      it: |-
        Attende al varco le prede, sepolto nel fango in riva al mare.
        Se lo sfiorano, le paralizza con una scarica elettrica.
    sword:
      ja-Hrkt: |-
        ひがたが　すみか。　どろに　すむ
        さいきんに　よって　でんきを　つくる
        きかんが　はったつした。
      ja: |-
        干潟が　すみか。　泥に　棲む
        細菌に　よって　電気を　つくる
        器官が　発達した。
      ko: |-
        갯벌이 보금자리다.
        진흙 속에 사는 세균에 의해
        전기를 만드는 기관이 발달했다.
      zh-Hant: |-
        潮間帶便是牠的巢穴。
        製造電的器官由於
        泥裡的細菌而發達起來。
      zh-Hans: |-
        潮间带便是它的巢穴。
        制造电的器官由于
        泥里的细菌而发达起来。
      en: |-
        Thanks to bacteria that lived in the mud flats with
        it, this Pokémon developed the organs it uses to
        generate electricity.
      fr: |-
        Les vasières sont son habitat de prédilection.
        Il a développé un organe générant de l’électricité
        grâce aux bactéries présentes dans la boue.
      de: |-
        Dieses Pokémon lebt im Morast. Dank der
        dortigen Bakterien hat es ein Organ entwickelt,
        mit dem es Strom erzeugen kann.
      es: |-
        Vive en humedales costeros. Ha desarrollado un
        órgano que produce electricidad gracias a una
        bacteria que vive en el lodo.
      it: |-
        Abita i fondali che emergono durante la bassa
        marea. Ha sviluppato un organo che produce
        elettricità grazie a un batterio che vive nel fango.
    shield:
      ja-Hrkt: |-
        からだの　きいろい　もようから
        つよい　でんきを　はなつとき
        なぜか　すこし　ほほえんでいる。
      ja: |-
        体の　黄色い　模様から
        強い　電気を　放つとき
        なぜか　すこし　微笑んでいる。
      ko: |-
        몸의 노란 무늬에서
        강한 전기를 발산할 때
        무슨 이유인지 살짝 웃고 있다.
      zh-Hant: |-
        當從身上的黃色斑紋
        裡釋放出強大電流時，
        牠會莫名地露出微笑。
      zh-Hans: |-
        当从身上的黄色斑纹
        里释放出强大电流时，
        它会莫名地露出微笑。
      en: |-
        For some reason, this Pokémon smiles slightly
        when it emits a strong electric current from the
        yellow markings on its body.
      fr: |-
        Lorsque les parties jaunes de son corps envoient
        une puissante décharge électrique, il ébauche
        un sourire. Personne ne sait pourquoi.
      de: |-
        Es verteilt über das gelbe Muster auf seinem
        Körper starke Stromstöße. Immer wenn es Strom
        absondert, grinst es. Niemand weiß, wieso.
      es: |-
        Se desconoce la razón, pero esboza una leve
        sonrisa al liberar potentes descargas eléctricas
        a través de las zonas amarillentas de su cuerpo.
      it: |-
        Per qualche strano motivo accenna sempre
        un sorriso quando rilascia una forte scarica
        elettrica dai motivi gialli sul suo corpo.
