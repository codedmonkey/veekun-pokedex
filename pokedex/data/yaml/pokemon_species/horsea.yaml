    x:
      ja-Hrkt: |-
        すいめんから　いきおいよく　スミを
        はっしゃして　とんでいる　ムシを
        うちおとす　ことが　あるという。
      ja: |-
        水面から　勢いよく　墨を　発射して
        飛んでいる　虫を
        撃ち落とすことがあるという。
      ko: |-
        수면에서 힘차게 먹물을
        발사해서 날고 있는 벌레를
        맞춰서 떨어뜨릴 때가 있다고 한다.
      en: |-
        Known to shoot down flying bugs with precision
        blasts of ink from the surface of the water.
      fr: |-
        Il abat les insectes volants en leur tirant un jet
        d’encre depuis la surface de l’eau. Ses tirs sont
        toujours précis.
      de: |-
        Dieses Pokémon schießt mit Tinte auf über der
        Wasseroberfläche fliegende Insekten.
      es: |-
        Es famoso por derribar a bichos voladores lanzando
        tinta desde la superficie del agua.
      it: |-
        È noto per i suoi attacchi ai volatili con getti
        d’inchiostro dalla superficie dell’acqua.
    'y':
      ja-Hrkt: |-
        サンゴの　かげに　すみかを　つくる。
        きけんを　かんじると　くちから
        まっくろい　スミを　はいて　にげる。
      ja: |-
        サンゴの　陰に　住処を　作る。
        危険を　感じると　口から
        真っ黒い　墨を　吐いて　逃げる。
      ko: |-
        산호의 그늘에 거처를 만든다.
        위험을 느끼면 입에서
        새까만 먹물을 내뿜고 도망간다.
      en: |-
        It makes its nest in the shade of corals. If it senses
        danger, it spits murky ink and flees.
      fr: |-
        Il niche à l’ombre du corail. Quand il se sent menacé,
        il disparaît dans un nuage d’encre opaque.
      de: |-
        Im Schatten von Korallen legt es sein Nest an.
        Bei Gefahr versprüht es Tinte und flieht.
      es: |-
        Hace su nido entre los corales. Si se siente en peligro,
        escupe tinta y huye.
      it: |-
        Crea la sua tana all’ombra dei coralli. Se avverte un
        pericolo, spruzza inchiostro nero e fugge.
    omega-ruby:
      ja-Hrkt: |-
        ちいさな　ムシや　いわばの　コケを　たべる。
        かいりゅうが　はやく　なると　しっぽを　いわばや
        サンゴに　まきつけ　ながされない　ように　する。
      ja: |-
        小さな　ムシや　岩場の　コケを　食べる。
        海流が　速く　なると　尻尾を　岩場や
        サンゴに　巻きつけ　流されない　ように　する。
      ko: |-
        작은 벌레나 바위의 이끼를 먹는다.
        해류가 빨라지면 꼬리로 바위나
        산호를 휘감아 떠내려가지 않게 한다.
      en: |-
        Horsea eats small insects and moss off of rocks. If the ocean
        current turns fast, this Pokémon anchors itself by wrapping its
        tail around rocks or coral to prevent being washed away.
      fr: |-
        Hypotrempe mange des petits insectes et de la mousse
        trouvée sur les cailloux. Lorsque les courants océaniques
        sont trop forts, ce Pokémon peut s’ancrer en accrochant
        sa queue aux rochers ou aux coraux.
      de: |-
        Seeper ernährt sich von kleinen Insekten und dem Moos auf
        Steinen. Bei unruhiger See verankert sich dieses Pokémon
        mit seinem Schweif an Steinen oder Korallen, damit es nicht
        weggespült wird.
      es: |-
        Horsea come insectos pequeños y el musgo de las rocas. Si
        las corrientes del océano cobran fuerza, este Pokémon se
        anclará con la cola a rocas o corales para evitar que las aguas
        lo arrastren.
      it: |-
        Horsea si nutre di piccoli insetti e del muschio trovato
        sugli scogli. Se la corrente oceanica si fa rapida, avvolge
        la coda attorno agli spuntoni di roccia o ai coralli per evitare
        di essere spazzato via.
    alpha-sapphire:
      ja-Hrkt: |-
        きけんを　かんじると　はんしゃてきに　くちから
        まっくろい　スミを　はきだして　にげるぞ。
        せびれを　きように　うごかして　およぐ。
      ja: |-
        危険を　感じると　反射的に　口から
        真っ黒い　スミを　吐き出して　逃げるぞ。
        背びれを　器用に　動かして　泳ぐ。
      ko: |-
        위험을 감지하면 반사적으로 입에서
        새까만 먹물을 뿜어내고 도망간다.
        등지느러미를 능숙히 움직여 헤엄친다.
      en: |-
        If Horsea senses danger, it will reflexively spray a dense
        black ink from its mouth and try to escape. This Pokémon
        swims by cleverly flapping the fin on its back.
      fr: |-
        Lorsque Hypotrempe sent un danger, il libère instinctivement
        une épaisse encre noire pour pouvoir s’échapper.
        Ce Pokémon nage en agitant sa nageoire dorsale.
      de: |-
        Wenn Seeper Gefahr wittert, versprüht es reflexartig eine
        tiefschwarze Tinte aus seinem Mund und ergreift die Flucht.
        Dieses Pokémon kann schwimmen, indem es geschickt mit
        der Flosse auf seinem Rücken schlägt.
      es: |-
        Si Horsea siente peligro, echará por la boca una densa tinta
        negra inconscientemente e intentará huir. Este Pokémon nada
        muy bien batiendo la aleta que tiene en el lomo.
      it: |-
        Avvertendo il pericolo, Horsea spruzza istintivamente una nube
        d’inchiostro nero dalla bocca, tentando poi la fuga. Questo
        Pokémon nuota agitando abilmente la pinna sulla schiena.
    lets-go-pikachu:
      ja-Hrkt: |-
        みに　きけんを　かんじたときは
        くちから　みずや　とくしゅなスミを
        いきおいよく　はきだす。
      ja: |-
        身に　危険を　感じたときは
        口から　水や　特殊なスミを
        勢いよく　吐き出す。
      ko: |-
        신변에 위험을 느끼면
        입에서 물이나 특수한 먹물을
        힘차게 뿜어낸다.
      zh-Hant: |-
        當遇上生命危險的時候，
        會從口中噴出強勁的水流
        和特殊的墨汁。
      zh-Hans: |-
        在感到危险时会从
        嘴里用力地喷出水
        或者特殊的墨汁。
      en: |-
        If it senses any danger, it will vigorously spray
        water or a special type of ink from its mouth.
      fr: |-
        Lorsqu’il est menacé, ce Pokémon crache une
        encre spéciale ou de l’eau pour se défendre.
      de: |-
        Wenn Seeper sich in Gefahr wähnt, sprüht es
        zur Verteidigung entweder Wasser oder eine
        spezielle Tinte kraftvoll aus seinem Mund.
      es: |-
        Si se siente en peligro, arrojará un potente
        chorro de agua o de una tinta especial por la
        boca.
      it: |-
        Se si sente minacciato, sputa dalla bocca
        un inchiostro speciale o un potente
        getto d’acqua per difendersi.
    lets-go-eevee:
      ja-Hrkt: |-
        みに　きけんを　かんじたときは
