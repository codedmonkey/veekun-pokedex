        boca.
      it: |-
        Se si sente minacciato, sputa dalla bocca
        un inchiostro speciale o un potente
        getto d’acqua per difendersi.
    sword:
      ja-Hrkt: |-
        しおの　ながれが　おだやかな　うみに
        すむ。　おそわれると　まっくろな
        スミをはいて　そのすきに　にげだす。
      ja: |-
        潮の　流れが　穏やかな　海に　棲む。
        襲われると　真っ黒な　墨を吐いて
        その隙に　逃げだす。
      ko: |-
        잔잔하게 흐르는 고요한 바다에
        산다. 습격당하면 새까만
        먹물을 내뿜고 그 틈에 도망친다.
      zh-Hant: |-
        棲息在海流平穩的海域。
        被襲擊時會吐出漆黑的
        墨汁，然後趁機逃走。
      zh-Hans: |-
        栖息在海浪平稳的海里。
        受到袭击时，会喷出漆黑墨汁
        并趁机逃跑。
      en: |-
        Horsea makes its home in oceans with gentle
        currents. If this Pokémon is under attack, it spits
        out pitch-black ink and escapes.
      fr: |-
        Il vit dans les mers calmes. Quand on l’attaque,
        il crache de l’encre noire et profite de la diversion
        pour s’enfuir.
      de: |-
        Es lebt in Meeren mit ruhigem Gezeitenstrom.
        Wird es angegriffen, versprüht es tiefschwarze
        Tinte und ergreift daraufhin die Flucht.
      es: |-
        Habita en mares de aguas tranquilas. Si se siente
        en peligro, expulsará por la boca una densa tinta
        negra para poder huir.
      it: |-
        Vive in mari dalle correnti tranquille. Quando
        viene attaccato spruzza inchiostro nero e ne
        approfitta per fuggire.
    shield:
      ja-Hrkt: |-
        すいちゅうを　おどるように　およいで
        うずを　つくる。　なかまと　うずの
        おおきさを　きそって　あそぶ。
      ja: |-
        水中を　踊るように　泳いで
        渦を　つくる。　仲間と　渦の
        大きさを　競って　遊ぶ。
      ko: |-
        물속에서 춤추듯이 헤엄쳐
        소용돌이를 만든다. 동료와
        소용돌이의 크기를 겨루며 논다.
      zh-Hant: |-
        會在水中跳舞似地游動來
        製造漩渦。玩耍時會和夥伴
        比賽誰做出的漩渦比較大。
      zh-Hans: |-
        会像跳舞一样在水中游动
        以制造漩涡。作为娱乐，
        会和伙伴比拼谁的漩涡更大。
      en: |-
        They swim with dance-like motions and cause
        whirlpools to form. Horsea compete to see which
        of them can generate the biggest whirlpool.
      fr: |-
        Hypotrempe crée des tourbillons en dansant
        sous l’eau. Il s’amuse à comparer la taille des
        remous qu’il fait avec ceux de ses congénères.
      de: |-
        Es schwimmt elegant wie ein Tänzer und erzeugt
        dabei Wasserstrudel. Mit Artgenossen wetteifert
        es darum, wer den größten Strudel formen kann.
      es: |-
        Nada con la gracilidad de un bailarín, creando
        remolinos a su paso, y juega con sus congéneres
        a ver quién forma el más grande.
      it: |-
        Nuota come se danzasse nell’acqua creando
        mulinelli. Gioca con i suoi simili facendo a gara
        a chi ne crea di più grandi.
