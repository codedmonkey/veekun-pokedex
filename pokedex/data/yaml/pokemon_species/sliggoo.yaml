sliggoo:
  base_happiness: 35
  capture_rate: 45
  color: purple
  egg_groups:
    - dragon
  evolution_chain: goomy
  evolves_from: goomy
  flavor_text:
    x:
      ja-Hrkt: |-
        なんでも　とかしてしまう　ねんえきを
        ぶんぴつして　てきを　げきたいする。
        めだまは　たいかして　みえていない。
      ja: |-
        なんでも　溶かしてしまう　粘液を
        分泌して　敵を　撃退する。
        目玉は　退化して　見えていない。
      ko: |-
        무엇이든 녹여버리는 점액을
        분비해 적을 격퇴한다.
        눈은 퇴화하여 보이지 않는다.
      en: |-
        It drives away opponents by excreting a
        sticky liquid that can dissolve anything.
        Its eyes devolved, so it can’t see anything.
      fr: |-
        Il repousse ses ennemis en sécrétant un fluide
        qui dissout tout ce qu’il touche. Suite à une
        dégénérescence de ses yeux, il est aveugle.
      de: |-
        Es verjagt Gegner durch Absonderung eines alles
        zersetzenden Schleims. Die zurückgebildeten
        Augäpfel des Pokémon gewähren ihm keine Sicht.
      es: |-
        Segrega una mucosidad que corroe todo lo que toca
        y consigue así ahuyentar al enemigo. Sus ojos han
        involucionado, por lo que no puede ver.
      it: |-
        Respinge i nemici secernendo un liquido vischioso
        in grado di sciogliere qualunque cosa. I suoi occhi
        hanno subito una degenerazione che lo ha reso cieco.
    'y':
      ja-Hrkt: |-
        ４ほんの　ツノは　こうせいのうの
        レーダー。みみや　はなの　かわりに
        おとや　においを　かんじとる。
      ja: |-
        ４本の　ツノは　高性能の　レーダー。
        耳や　鼻の　かわりに
        音や　においを　感じ取る。
      ko: |-
        4개의 뿔은 고성능의
        레이더이다. 귀나 코를 대신해서
        소리나 냄새를 느낀다.
      en: |-
        Its four horns are a high-performance radar system.
        It uses them to sense sounds and smells,
        rather than using ears or a nose.
      fr: |-
        Ses quatre cornes constituant un radar extrêmement
        puissant, il n’a besoin ni de nez ni d’oreilles pour
        percevoir les sons et les odeurs.
      de: |-
        Seine vier Fühler fungieren als hochleistungsfähiges
        Radarsystem. Es setzt sie anstelle von Nase und Ohren
        zur Wahrnehmung von Gerüchen und Geräuschen ein.
      es: |-
        Sus cuatro antenas constituyen un radar de gran
        potencia. Hacen las veces de nariz y oídos para
        percibir tanto ruidos como olores.
      it: |-
        I quattro corni di questo Pokémon sono simili a un
        potente radar e fungono da organi sensoriali al posto
        di orecchie e naso.
    omega-ruby:
      ja-Hrkt: |-
        なんでも　とかしてしまう　ねんえきを
        ぶんぴつして　てきを　げきたいする。
        めだまは　たいかして　みえていない。
      ja: |-
