        Hacen las veces de nariz y oídos para percibir tanto ruidos
        como olores.
      it: |-
        I quattro corni di questo Pokémon sono simili a un potente
        radar e fungono da organi sensoriali al posto di orecchie
        e naso.
    sun:
      ja-Hrkt: |-
        エサと　なかまの　くべつが　あいまい。
        なかよくなっても　へいきで　とかして
        くらおうと　してくることが　ある。
      ja: |-
        餌と　仲間の　区別が　曖昧。
        仲良くなっても　平気で　溶かして
        喰らおうと　してくることが　ある。
      ko: |-
        먹이와 동료의 구별이 애매하다.
        사이가 좋아져도 아무렇지 않게 녹여서
        먹어버리려고 하는 경우가 있다.
      zh-Hant: |-
        獵物和夥伴的區別模糊不清。
        即使關係親密，有時候也會
        淡定地將對方溶解吸食。
      zh-Hans: |-
        食物和伙伴的区别模糊不清。
        即使关系很好，有时候也会
        淡定地将对方溶解吸食。
      en: |-
        It has trouble drawing a line between friends
        and food. It will calmly try to melt and eat even
        those it gets along well with.
      fr: |-
        Comme il a du mal à distinguer ses alliés de
        ses proies, la faim peut parfois le pousser
        à asperger ses amis de son solvant.
      de: |-
        Die Grenze zwischen Freund und Fressen
        ist bei diesem Pokémon fließend.
        Als Freund geschätzt, zu Suppe zersetzt!
      es: |-
        Le cuesta distinguir a sus presas de sus
        aliados, por eso no es raro que se coma a uno
        de los suyos de vez en cuando sin inmutarse.
      it: |-
        A volte non riesce a distinguere bene le prede
        dagli amici e, se ha fame, può capitare che
        cerchi di sciogliere un alleato per mangiarselo.
    moon:
      ja-Hrkt: |-
        はが　ないので　なんでも　とかす
        ねんえきを　えものに　かけて
        とかしてから　すすって　くらう。
      ja: |-
        歯が　ないので　なんでも　溶かす
        粘液を　獲物に　かけて
        溶かしてから　すすって　喰らう。
      ko: |-
        이빨이 없어서 무엇이든 녹이는
        점액을 먹이에 뿌려서
        녹인 다음에 마신다.
      zh-Hant: |-
        因為沒有牙齒，
        所以會釋放可溶解任何物體的黏液，
        將獵物溶化後再吸食。
      zh-Hans: |-
        因为没有牙齿，
        所以会释放可溶解任何物体的粘液，
        将猎物溶化后再吸食。
      en: |-
        This Pokémon’s mucous can dissolve anything.
        Toothless, it sprays mucous on its prey. Once
        they’re nicely dissolved, it slurps them up.
      fr: |-
        Comme il n’a pas de dent, il sécrète un solvant
        dont il asperge ses proies pour les liquéfier et
        les boire en smoothie.
      de: |-
        Da es keine Zähne hat, sondert es einen alles
        zersetzenden Schleim auf seine Beute ab.
        Danach schlürft es diese genüsslich auf.
      es: |-
        Al carecer de dientes, segrega una mucosidad
        que disuelve a sus presas para facilitar su
        posterior ingestión.
      it: |-
        Rimedia alla mancanza di denti spruzzando un
        potentissimo liquido corrosivo sulle prede per
        scioglierle e berle come un succo.
    ultra-sun:
      ja-Hrkt: |-
        のそのそ　はって　いどうする。
        うずじょうの　とっきは　のうみそや
        ないぞうが　つまっている　ぶぶん。
      ja: |-
        のそのそ　這って　移動する。
        渦状の　突起は　脳みそや
        内臓が　詰まっている　部分。
      ko: |-
        느릿느릿 기어서 이동한다.
        나선의 돌기는 뇌와
        내장으로 꽉 차 있다.
      zh-Hant: |-
        慢吞吞地爬行著移動。
        漩渦狀的突起部分
        裝著牠的大腦和內臟。
      zh-Hans: |-
        慢吞吞地爬行移动。
        旋涡状的突起里装着大脑和内脏。
      en: |-
        It crawls along sluggishly. The swirly protrusion
        on its back is filled with its brain and
        other organs.
      fr: |-
        Il se déplace en rampant lentement.
        Ses organes et son cerveau se trouvent dans
        sa protubérance dorsale en forme de spirale.
      de: |-
        Es bewegt sich gemächlich kriechend fort.
        Der spiralförmige Fortsatz beherbergt sein
        Gehirn und seine inneren Organe.
      es: |-
        Este Pokémon se arrastra con lentitud. La
        protuberancia en espiral de su espalda contiene
        tanto el cerebro como los órganos internos.
      it: |-
        Si sposta strisciando lentamente.
        La protuberanza a forma di spirale sul dorso
        contiene il cervello e i suoi organi interni.
    ultra-moon:
      ja-Hrkt: |-
        ぜんしんが　なんでも　ドロドロに
        とかす　ねんえきで　つつまれている。
        さわるときは　てぶくろを　しよう。
      ja: |-
        全身が　何でも　ドロドロに
        溶かす　粘液で　包まれている。
        触るときは　手袋を　しよう。
      ko: |-
        전신이 무엇이든 흐물흐물하게
        녹이는 점액으로 둘러싸여 있다.
        만질 때는 장갑을 끼자.
      zh-Hant: |-
        全身包裹著能把一切東西
        溶解成黏糊的黏液。
        觸摸牠時記得戴上手套。
      zh-Hans: |-
        全身包裹着能把所有东西
        都溶解得黏腻腻的黏液。
        接触的时候戴上手套吧。
      en: |-
        Its entire body is covered with gooey mucus
        that can dissolve anything. Be sure to put
        gloves on if you’re going to touch it.
      fr: |-
        Son corps est recouvert d’un mucus capable
        de faire fondre n’importe quoi. Pensez à mettre
        des gants adaptés si vous voulez le toucher !
      de: |-
        Sein Körper ist von einem alles zersetzenden
        Schleim bedeckt. Will man diesen berühren,
        sollte man vorher Schutzhandschuhe anziehen.
      es: |-
        Su cuerpo está recubierto por una mucosidad
        que puede disolver cualquier material, así que
        es mejor usar guantes especiales para tocarlo.
      it: |-
        Il suo corpo è ricoperto da un liquido vischioso
        in grado di sciogliere qualsiasi cosa e per
        toccarlo bisogna indossare guanti speciali.
    sword:
      ja-Hrkt: |-
        なんでも　とかしてしまう　ねんえきで
        ほご　されているため　よわくても
        ほしょくされず　いきのこってきた。
      ja: |-
        なんでも　溶かしてしまう　粘液で
        保護されているため　弱くても
        捕食されず　生き残ってきた。
      ko: |-
        무엇이든 녹여버리는 점액으로
        몸을 보호하기 때문에 약하지만
        먹히지 않고 살아남을 수 있었다.
      zh-Hant: |-
        雖然弱小，但牠擁有可以
        融化一切的黏液來保護自己，
        因此未被捕食並得以存活至今。
      zh-Hans: |-
        虽然弱小，但它拥有可以
        融化一切的粘液来保护自己，
        因此未被捕食并得以存活至今。
      en: |-
        Although this Pokémon isn’t very strong, its body
        is coated in a caustic slime that can melt through
        anything, so predators steer clear of it.
      fr: |-
        Étant donné sa faiblesse, c’est uniquement
        grâce à son fluide pouvant tout dissoudre
        qu’il a échappé à une extinction quasi certaine.
      de: |-
        Da sein alles zersetzender Schleim es schützt,
        konnte es sich bis heute gegen seine Fressfeinde
        behaupten, obwohl es recht schwach ist.
      es: |-
        Segrega una mucosidad que corroe todo lo que
        toca. Esto le ha permitido protegerse y evitar la
        extinción a pesar de su debilidad intrínseca.
      it: |-
        È un Pokémon debole. Ha evitato l’estinzione
        grazie al suo muco corrosivo.
    shield:
      ja-Hrkt: |-
        せなかの　とっきの　なかに　ちいさな
        のうみそが　ある。　えさと　てきから
        にげることしか　かんがえていない。
      ja: |-
        背中の　突起の　中に　小さな
        脳みそが　ある。　エサと　敵から
        逃げることしか　考えていない。
      ko: |-
        등의 돌기 안에 작은 뇌가 있다.
        먹이에 대한 생각과
        적으로부터 도망치는 생각만 한다.
      zh-Hant: |-
        背上的突起物裡裝著牠
        小小的腦子，裡面只想著
        吃飯和逃離敵人這兩件事。
      zh-Hans: |-
        背上的突起物里装着它
        小小的脑子，里面只想着
        吃饭和逃离敌人这两件事。
      en: |-
        The lump on its back contains its tiny brain.
        It thinks only of food and escaping its enemies.
      fr: |-
        Son petit cerveau est caché dans la bosse qui
        est sur son dos. Il ne pense pas à grand-chose,
        si ce n’est à se nourrir et à fuir devant ses ennemis.
      de: |-
        In dem Fortsatz auf seinem Rücken befindet sich
        sein winziges Gehirn. Es kann nur ans Fressen
        und an die Flucht vor seinen Feinden denken.
      es: |-
        La protuberancia del lomo contiene su pequeño
        cerebro, que solo piensa en buscar comida y huir
        de los enemigos.
      it: |-
        Nella protuberanza che ha sulla schiena si trova
        un piccolo cervello. Pensa solo a mangiare e a
        scappare dai nemici.
    legends-arceus:
      en: |-
        A creature given to melancholy. I suspect its metallic shell
        developed as a result of the mucus on its skin reacting with
        the iron in Hisui's water.
