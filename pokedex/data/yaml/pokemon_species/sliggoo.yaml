        degenerazione che lo ha reso cieco.
    alpha-sapphire:
      ja-Hrkt: |-
        ４ほんの　ツノは　こうせいのうの
        レーダー。みみや　はなの　かわりに
        おとや　においを　かんじとる。
      ja: |-
        ４本の　ツノは　高性能の　レーダー。
        耳や　鼻の　かわりに
        音や　においを　感じ取る。
      ko: |-
        4개의 뿔은 고성능의
        레이더이다. 귀나 코를 대신해서
        소리나 냄새를 느낀다.
      en: |-
        Its four horns are a high-performance radar system.
        It uses them to sense sounds and smells,
        rather than using ears or a nose.
      fr: |-
        Ses quatre cornes constituant un radar extrêmement puissant,
        il n’a besoin ni de nez ni d’oreilles pour percevoir les sons et
        les odeurs.
      de: |-
        Seine vier Fühler fungieren als hochleistungsfähiges
        Radarsystem. Es setzt sie anstelle von Nase und Ohren
        zur Wahrnehmung von Gerüchen und Geräuschen ein.
      es: |-
