gliscor:
  base_happiness: 70
  capture_rate: 30
  color: purple
  egg_groups:
    - bug
  evolution_chain: gligar
  evolves_from: gligar
  flavor_text:
    diamond:
      en: |-
        It observes prey while hanging
        inverted from branches. When the
        chance presents itself, it swoops!
    pearl:
      en: |-
        It observes prey while hanging
        inverted from branches. When the
        chance presents itself, it swoops!
    platinum:
      en: |-
        If it succeeds in catching even a
        faint breeze properly, it can circle
        the globe without flapping once.
    heartgold:
      en: |-
        Its flight is soundless. It uses its
        lengthy tail to carry off its prey...
        Then its elongated fangs do the rest.
    soulsilver:
      en: |-
        Its flight is soundless. It uses its
        lengthy tail to carry off its prey...
        Then its elongated fangs do the rest.
    black:
      en: |-
        If it succeeds in catching even a
        faint breeze properly, it can circle
        the globe without flapping once.
      fr: |-
        Le plus petit courant d’air peut lui
        donner assez d’élan pour faire le
        tour du monde sans un coup d’aile.
    white:
      en: |-
        If it succeeds in catching even a
        faint breeze properly, it can circle
        the globe without flapping once.
      fr: |-
        Le plus petit courant d’air peut lui
        donner assez d’élan pour faire le
        tour du monde sans un coup d’aile.
    black-2:
      en: |-
        It dances silently through the sky.
        When it approaches prey, it can
        land a critical hit in an instant.
    white-2:
      en: |-
        It dances silently through the sky.
        When it approaches prey, it can
        land a critical hit in an instant.
    x:
      ja-Hrkt: |-
        しっぽで　きのえだに　ぶらさがり
        えものを　かんさつする。すきを
        みて　じょうくうから　おそいかかる。
      ja: |-
        尻尾で　木の枝に　ぶら下がり
        獲物を　観察する。すきを　見て
        上空から　襲いかかる。
      ko: |-
        꼬리로 나뭇가지에 매달려
        먹이를 관찰한다. 틈을
        봐서 상공에서 덮친다.
      en: |-
        It observes prey while hanging inverted from
        branches. When the chance presents itself,
        it swoops!
      fr: |-
        Il guette sa proie, pendu à une branche la tête en bas,
        et s’en saisit à la première occasion.
      de: |-
        Es hängt kopfüber von einem Ast und beobachtet
        seine Beute. Bei Gelegenheit stürzt es sich auf sie.
      es: |-
        Espera a sus presas colgado de una rama bocabajo.
        Cuando llega su oportunidad, se lanza en picado.
      it: |-
        Sta appeso ai rami con la testa in giù. Alla prima
        occasione, si butta a capofitto sulla preda.
    'y':
      ja-Hrkt: |-
        はおとを　たてずに　そらを　とぶ。
        ながい　しっぽで　えものを　つかまえ
        キバで　きゅうしょを　ひとつき。
      ja: |-
        羽音を　立てずに　空を　飛ぶ。
        長い　尻尾で　獲物を　捕まえ
        キバで　急所を　一突き。
      ko: |-
        날갯소리를 내지 않고 하늘을 난다.
        긴 꼬리로 먹이를 잡아
        송곳니로 급소를 공격한다.
      en: |-
        Its flight is soundless. It uses its lengthy tail to
        carry off its prey... Then its elongated fangs do
        the rest.
      fr: |-
        Il vole sans un bruit, et capture ses proies avec sa
        queue pour leur infliger une morsure critique.
      de: |-
        Es fliegt völlig lautlos. Erst fängt es seine Beute mit
        seinem langen Schweif, dann saugt es sie aus.
      es: |-
        Vuela sin hacer nada de ruido. Con su larga cola
        captura a sus presas y las muerde con sus colmillos.
      it: |-
        Vola senza far rumore. Afferra le prede con la lunga
        coda e perfora il loro punto vitale con i canini.
    omega-ruby:
      ja-Hrkt: |-
        しっぽで　きのえだに　ぶらさがり
