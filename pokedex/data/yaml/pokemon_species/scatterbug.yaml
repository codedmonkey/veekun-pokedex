scatterbug:
  base_happiness: 70
  capture_rate: 255
  color: black
  egg_groups:
    - bug
  evolution_chain: scatterbug
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        とりポケモンに　おそわれると
        くろい　こなを　まきちらす。
        ふれると　マヒする　どくのこなだ。
      ja: |-
        とりポケモンに　襲われると
        黒い　粉を　まき散らす。
        触れると　マヒする　毒の粉だ。
      ko: |-
        새포켓몬에게 습격당하면
        검은 가루를 흩뿌린다.
        만지면 마비되는 독가루다.
      en: |-
        When under attack from bird Pokémon,
        it spews a poisonous black powder
        that causes paralysis on contact.
      fr: |-
        Lorsqu’il est poursuivi par un Pokémon Oiseau,
        il projette une poudre noire qui paralyse tous ceux
        qu’elle touche.
      de: |-
        Wird es von einem fliegenden Pokémon angegriffen,
        verstreut es schwarzen Puder. Der giftige Puder löst
        bei Berührung Paralyse aus.
      es: |-
        Cuando recibe el ataque de un Pokémon pájaro,
        expulsa unas escamas negras que provocan parálisis
        si se entra en contacto con ellas.
      it: |-
        Se assalito da Pokémon uccello, si difende emettendo
        velenose scaglie nere che paralizzano al minimo
        contatto.
    'y':
      ja-Hrkt: |-
        からだを　おおう　こなが　たいおんを
        ちょうせつするので　どんな　きこうや
        ふうどの　ちいきでも　くらせる。
      ja: |-
        体を　覆う　粉が　体温を
        調節するので　どんな　気候や　風土の
        地域でも　暮らせる。
      ko: |-
        몸을 덮은 가루가 체온을
        조절하고 있어 어떤 기후나
        풍토의 지역에서도 살 수 있다.
      en: |-
        The powder that covers its body
        regulates its temperature, so it
        can live in any region or climate.
      fr: |-
        La poudre qui recouvre son corps l’aide à réguler
        sa température. Il peut s’adapter à tous les climats.
      de: |-
        Es reguliert seine Körpertemperatur mit dem Puder,
        das seinen Körper bedeckt, und kommt deswegen
        in jedem Klima und jeder Region zurecht.
      es: |-
        Gracias al polvo de escamas que lo recubre y regula
        su temperatura, puede vivir en cualquier región, sin
        importar las características del terreno o el clima.
      it: |-
        La sua temperatura corporea è regolata dalle scaglie
        che ne ricoprono il corpo. Grazie ad esse può adattarsi
        e sopravvivere in qualsiasi condizione climatica.
