    black-2:
      en: |-
        Rooting the tip of its snout
        into the ground, it searches for food.
        Sometimes it even digs up a hot spring.
    white-2:
      en: |-
        Rooting the tip of its snout
        into the ground, it searches for food.
        Sometimes it even digs up a hot spring.
    x:
      ja-Hrkt: |-
        エサを　さがすため　はなを
        こすりあわせ　じめんを　ほっている。
        たまに　おんせんを　ほりあてる。
      ja: |-
        エサを　探すため　鼻を
        こすり合わせ　地面を　掘っている。
        たまに　温泉を　掘り当てる。
      ko: |-
        먹이를 찾기 위해 코를
        바닥에 비벼 땅을 파고 있다.
        가끔 온천을 찾아낸다.
      en: |-
        It rubs its snout on the ground to find and dig up
        food. It sometimes discovers hot springs.
      fr: |-
        Il renifle le sol avec sa truffe pour y dénicher de
        la nourriture. Il trouve parfois des sources thermales.
      de: |-
        Auf Nahrungssuche schnüffelt es am Boden entlang.
        Es entdeckt dabei manchmal auch heiße Quellen.
      es: |-
        Frota su hocico contra el suelo para desenterrar
        comida. A veces descubre aguas termales.
      it: |-
        Sfrega il muso sul terreno per scovare del cibo.
        Talvolta scopre sorgenti d’acqua calda.
    'y':
      ja-Hrkt: |-
        いい　においを　かぎつけると
        あとさき　かんがえず　においの
        ほうこうへ　ダッシュしてしまう。
      ja: |-
        いい　においを　かぎつけると
        あとさき　考えずに　においの
        方向へ　ダッシュしてしまう。
      ko: |-
        좋은 냄새를 맡으면
        뒷일을 생각하지 않고 냄새 나는
        방향으로 대시해버린다.
      en: |-
        If it smells something enticing, it dashes off
        headlong to find the source of the aroma.
      fr: |-
        S’il sent une odeur attirante, il fonce tête baissée
        pour en trouver l’origine.
      de: |-
        Wenn es etwas Vielversprechendes erschnuppert,
        dann stürzt es in Windeseile darauf zu.
      es: |-
        Si percibe un aroma tentador, se tira de cabeza para
        encontrar el origen de dicho olor.
      it: |-
        Appena avverte un profumo invitante, cerca subito
        di capire la provenienza di quell’odore.
    omega-ruby:
      ja-Hrkt: |-
        じめんに　はなを　こすりつけて　エサを　さがす。
        かれくさの　したに　はえた　キノコが　こうぶつ。
        たまに　おんせんを　ほりあてる　ことが　あるよ。
      ja: |-
        地面に　鼻を　擦りつけて　エサを　探す。
        枯草の　下に　生えた　キノコが　好物。
        たまに　温泉を　掘り当てる　ことが　あるよ。
      ko: |-
        땅에 코를 비비며 먹이를 찾는다.
        마른 풀 밑에 난 버섯을 좋아한다.
        가끔 온천을 파내기도 한다.
      en: |-
        Swinub roots for food by rubbing its snout against the ground.
        Its favorite food is a mushroom that grows under the cover of
        dead grass. This Pokémon occasionally roots out hot springs.
      fr: |-
        Marcacrin cherche sa nourriture en frottant son groin par terre.
        Son plat préféré est un champignon qui pousse sous l’herbe
        fanée. Ce Pokémon découvre parfois des sources d’eau
        chaude.
      de: |-
        Auf Nahrungssuche schnüffelt Quiekel am Boden entlang.
        Seine Lieblingsspeise ist ein Pilz, der unter verwesendem
        Gras wächst. Manchmal spürt dieses Pokémon heiße
        Quellen auf.
      es: |-
        Swinub busca el alimento frotando el hocico contra el suelo.
        Su comida preferida es una seta que crece bajo la hierba
        marchita. A veces, al frotar, descubre fuentes termales.
      it: |-
        Swinub cerca il proprio nutrimento strofinando il muso
        sul terreno. È ghiotto dei funghi che crescono sotto
        la coltre di erba e fogliame rinsecchito.
        Talvolta scova qualche sorgente termale.
    alpha-sapphire:
      ja-Hrkt: |-
        じめんに　はなを　こすりつけて　エサを　さがす。
        かれくさの　したに　はえた　キノコが　こうぶつ。
        たまに　おんせんを　ほりあてる　ことが　あるよ。
      ja: |-
