        枯草の　下に　生えた　キノコが　好物。
        たまに　温泉を　掘り当てる　ことが　あるよ。
      ko: |-
        땅에 코를 비비며 먹이를 찾는다.
        마른 풀 밑에 난 버섯을 좋아한다.
        가끔 온천을 파내기도 한다.
      en: |-
        Swinub roots for food by rubbing its snout against the ground.
        Its favorite food is a mushroom that grows under the cover of
        dead grass. This Pokémon occasionally roots out hot springs.
      fr: |-
        Marcacrin cherche sa nourriture en frottant son groin par terre.
        Son plat préféré est un champignon qui pousse sous l’herbe
        fanée. Ce Pokémon découvre parfois des sources d’eau
        chaude.
      de: |-
        Auf Nahrungssuche schnüffelt Quiekel am Boden entlang.
        Seine Lieblingsspeise ist ein Pilz, der unter abgestorbenem
        Gras wächst. Manchmal spürt dieses Pokémon heiße Quellen
        auf.
      es: |-
        Swinub busca el alimento frotando el hocico contra el suelo.
        Su comida preferida es una seta que crece bajo la hierba
        marchita. A veces, al frotar, descubre fuentes termales.
      it: |-
        Swinub cerca il proprio nutrimento strofinando il muso
        sul terreno. È ghiotto dei funghi che crescono sotto
        la coltre di erba e fogliame rinsecchito.
        Talvolta scova qualche sorgente termale.
    sword:
      ja-Hrkt: |-
        エサを　さがすため　はなを
        こすりあわせ　じめんを　ほっている。
        たまに　おんせんを　ほりあてる。
      ja: |-
        エサを　探すため　鼻を
        こすり合わせ　地面を　掘っている。
        たまに　温泉を　掘り当てる。
      ko: |-
        먹이를 찾기 위해 코를
        바닥에 비벼 땅을 파고 있다.
        가끔 온천을 찾아낸다.
      zh-Hant: |-
        為了尋找食物，
        會用鼻子摩擦地面來挖掘。
        偶爾會挖到溫泉。
      zh-Hans: |-
        为了寻找食物，
        会用鼻子摩擦地面并进行挖掘。
        偶尔会挖到温泉。
      en: |-
        It rubs its snout on the ground to find and dig up
        food. It sometimes discovers hot springs.
      fr: |-
        Il creuse le sol avec son groin pour y dénicher
        de la nourriture. Il trouve parfois des sources
        d’eau chaude.
      de: |-
        Auf Nahrungssuche wühlt es sich mit der Nase
        durch den Erdboden. Manchmal entdeckt es
        dabei auch heiße Quellen.
      es: |-
        Frota el hocico contra el suelo para desenterrar
        comida. A veces descubre aguas termales.
      it: |-
        Scava con il muso nel terreno per scovare del
        cibo. Talvolta scopre sorgenti d’acqua calda.
    shield:
      ja-Hrkt: |-
        いい　においを　かぎつけると
        あとさき　かんがえず　においの
        ほうこうへ　ダッシュしてしまう。
      ja: |-
        いい　においを　かぎつけると
        あとさき　考えずに　においの
        方向へ　ダッシュしてしまう。
      ko: |-
        좋은 냄새를 맡으면
        뒷일을 생각하지 않고 냄새 나는
        방향으로 대시해버린다.
      zh-Hant: |-
        一聞到誘人的香味時，
        就會不顧一切地
        朝香味傳來的方向飛奔而去。
      zh-Hans: |-
        嗅到诱人的香味时，
        便会不顾一切地朝着
        气味的方向飞奔过去。
      en: |-
        If it smells something enticing, it dashes off
        headlong to find the source of the aroma.
      fr: |-
        S’il sent une odeur attrayante, il fonce la tête
        la première pour trouver d’où elle vient.
      de: |-
        Wenn es etwas Vielversprechendes erschnuppert,
        sprintet es Hals über Kopf darauf los, ohne
        nachzudenken.
      es: |-
        Si percibe un aroma tentador, se lanza de cabeza
        sin pensárselo dos veces para hallar su origen.
      it: |-
        Appena avverte un profumo invitante, si fionda
        nella direzione da cui proviene senza la minima
        esitazione.
    legends-arceus:
      en: |-
        Swinub excels at sniffing out mushrooms buried beneath grass or
        snow. Since ancient times, the people of Hisui have often relied
        upon this skill.
