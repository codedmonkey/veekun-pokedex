    sword:
      ja-Hrkt: |-
        じぶんより　つよくて　おおきな
        あいてにも　おそれずに　たちむかう
        ゆうかんで　たのもしい　せいかく。
      ja: |-
        自分より　強くて　大きな　相手にも
        恐れずに　立ち向かう
        勇敢で　頼もしい　性格。
      ko: |-
        자신보다 강하고 큰
        상대라도 겁 없이 맞서는
        용감하고 믿음직스런 성격이다.
      zh-Hant: |-
        能毫不畏懼地去對抗
        比自己更強更大的對手。
        性格非常勇敢可靠。
      zh-Hans: |-
        能毫无畏惧地去对抗
        比自己更强更大的对手。
        性格勇敢非常可靠。
      en: |-
        It has a brave and trustworthy nature. It fearlessly
        stands up to bigger and stronger foes.
      fr: |-
        Il est courageux et fiable. Il se dresse vaillamment
        devant ses ennemis même s’ils sont plus puissants.
      de: |-
        Es ist von Natur aus tapfer und vertrauenswürdig
        und scheut auch vor Gegnern nicht zurück, die
        größer und stärker sind als es selbst.
      es: |-
        De naturaleza valiente y honrada, se enfrenta sin
        miedo a enemigos más grandes y fuertes.
      it: |-
        Coraggioso e fedele, si oppone senza paura
        anche a nemici più grandi e forti di lui.
    shield:
      ja-Hrkt: |-
        ちゅうじつな　せいかくで　おやの
        トレーナーを　まもるため　ひっしに
        あいてに　ほえかかる。
      ja: |-
        忠実な　性格で　親の
        トレーナーを　守るため　必死に
        相手に　吠えかかる。
      ko: |-
        충직한 성격으로
        자신의 트레이너를 지키기 위해
        필사적으로 상대방에게 짖어댄다.
      zh-Hant: |-
        性格忠誠。
        為了保護自己的訓練家，
        會拼命地朝對手狂吠。
      zh-Hans: |-
        性格忠诚。
        为了保护自己的训练家，
        会拼命地朝对手狂吠。
      en: |-
        Extremely loyal, it will fearlessly bark at any
        opponent to protect its own Trainer from harm.
      fr: |-
        Très fidèle, il aboie de toutes ses forces pour
        protéger son Dresseur d’Origine quand un danger
        le guette.
      de: |-
        Es ist sehr loyal und bellt jeden Gegner furchtlos
        an, um seinen Trainer vor Schaden zu bewahren.
      es: |-
        Extremadamente fiel, ladrará furioso a cualquiera
        que suponga una amenaza para su Entrenador
        con tal de defenderlo.
      it: |-
        Di indole molto leale, abbaia furiosamente
        contro chiunque minacci di attaccare il suo
        Allenatore.
