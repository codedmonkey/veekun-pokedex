    x:
      ja-Hrkt: |-
        ひとなつこく　せいじつな　せいかく。
        てきには　ほえて　かみつき
        おいはらおう　とする。
      ja: |-
        人懐こく　誠実な　性格。
        敵には　ほえて　かみつき
        追い払おうとする。
      ko: |-
        사람을 잘 따르는 충실한 성격이다.
        적에게는 짖거나 물며
        쫓아내려고 한다.
      en: |-
        Very friendly and faithful to people. It will try to
        repel enemies by barking and biting.
      fr: |-
        Ce Pokémon est particulièrement affectueux et loyal.
        Il aboie et il mord pour se débarrasser de ses
        adversaires.
      de: |-
        Es ist sehr freundlich und bleibt den Menschen
        treu. Durch Bellen und Beißen versucht es,
        Gegner zu verscheuchen.
      es: |-
        Es muy agradable y leal. Para ahuyentar al enemigo,
        se pone a ladrar y a dar bocados.
      it: |-
        Molto amichevole e fedele verso le persone.
        Allontana i nemici abbaiando e mordendoli.
    'y':
      ja-Hrkt: |-
        じぶんより　つよくて　おおきな
        あいてにも　おそれずに　たちむかう
        ゆうかんで　たのもしい　せいかく。
      ja: |-
        自分より　強くて　大きな　相手にも
        恐れずに　立ち向かう
        勇敢で　頼もしい　性格。
      ko: |-
        자신보다 강하고 큰
        상대라도 겁 없이 맞서는
        용감하고 믿음직한 성격이다.
      en: |-
        It has a brave and trustworthy nature. It fearlessly
        stands up to bigger and stronger foes.
      fr: |-
        Il est courageux et fier. Il se dresse vaillamment
        devant ses ennemis même s’ils sont plus puissants.
      de: |-
        Es ist von Natur aus tapfer und vertrauenswürdig.
        Es scheut nicht vor starken Gegnern zurück.
      es: |-
        De naturaleza valiente y honrada, se enfrenta sin
        miedo a enemigos más grandes y fuertes.
      it: |-
        Coraggioso e fedele, si oppone senza timore anche
        a nemici più grandi e forti di lui.
    omega-ruby:
      ja-Hrkt: |-
        きゅうかくに　すぐれ　いちど　かいだ　においは
        なにが　あっても　ぜったいに　わすれない。
        あいての　きもちを　においで　さっちする。
      ja: |-
        嗅覚に　優れ　一度　嗅いだ　臭いは
        なにが　あっても　絶対に　忘れない。
        相手の　気持ちを　臭いで　察知する。
      ko: |-
        후각이 뛰어나서 한 번 맡은 냄새는
        무슨 일이 있어도 절대 잊지 않는다.
        상대의 기분을 냄새로 감지한다.
      en: |-
        Growlithe has a superb sense of smell. Once it smells anything,
        this Pokémon won’t forget the scent, no matter what. It uses
        its advanced olfactory sense to determine the emotions of
        other living things.
      fr: |-
        Caninos a un odorat très développé. Ce Pokémon n’oublie
        jamais un parfum, quel qu’il soit. Il utilise son puissant sens
        olfactif pour deviner les émotions des autres créatures
        vivantes.
      de: |-
        Fukano hat einen ausgezeichneten Geruchssinn. Wenn
        dieses Pokémon einmal einen Geruch wahrgenommen hat,
        vergisst es ihn nicht mehr. Es benutzt diese Fähigkeit dazu,
        die Gefühlslage von Lebewesen auszuloten.
      es: |-
        Growlithe tiene un sentido del olfato excepcional y una
        memoria sensitiva tremenda, nunca olvida una esencia. Este
        Pokémon saca provecho de este don para identificar las
        sensaciones que tienen otros seres vivos.
      it: |-
        Growlithe ha un senso dell’olfatto molto sviluppato:
        una volta annusato qualcosa non scorda più quell’odore.
        Sfrutta questa dote per determinare le emozioni delle
        altre creature.
    alpha-sapphire:
      ja-Hrkt: |-
