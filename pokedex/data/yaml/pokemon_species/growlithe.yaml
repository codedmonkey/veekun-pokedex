      es: |-
        Growlithe tiene un sentido del olfato excepcional y una
        memoria sensitiva tremenda, nunca olvida una esencia. Este
        Pokémon saca provecho de este don para identificar las
        sensaciones que tienen otros seres vivos.
      it: |-
        Growlithe ha un senso dell’olfatto molto sviluppato:
        una volta annusato qualcosa non scorda più quell’odore.
        Sfrutta questa dote per determinare le emozioni delle
        altre creature.
    sun:
      ja-Hrkt: |-
        りこうで　ちゅうじつ。　ただし
        みしらぬものや　なわばりを　おかす
        ものには　ほえたてて　いかく　するぞ。
      ja: |-
        利口で　忠実。　ただし
        見知らぬ者や　縄張りを　侵す
        者には　吠えたてて　いかく　するぞ。
      ko: |-
        똑똑하고 충실하다. 다만
        모르는 자나 영역을 침범하는
        자에게는 짖어대서 위협한다.
      zh-Hant: |-
        聰明而忠誠。但是遇到
        不認識或是侵犯領地的對手，
        會不停狂吠來威嚇。
      zh-Hans: |-
        机灵而忠诚。但是对于
        不认识的或是侵犯领地的，
        会狂吠不停并作出威吓。
      en: |-
        It’s both clever and loyal, but if a stranger tries
        to invade its territory, it barks threateningly.
      fr: |-
        Un Pokémon très intelligent et affectueux.
        Il aboie pour intimider les inconnus et ceux qui
        pénètrent sur son territoire.
      de: |-
        Es ist klug und loyal. Sein Revier verteidigt es
        jedoch mit lautem Bellen gegen Fremde und
        Eindringlinge.
      es: |-
        Es muy leal e inteligente por naturaleza. No
        obstante, si un extraño invade su territorio,
        le ladrará a modo de amenaza.
      it: |-
        È intelligente e fedele, ma abbaia minaccioso
        contro gli sconosciuti e contro chiunque invada
        il suo territorio.
    moon:
      ja-Hrkt: |-
        かわいいからと　いって　しらない
        トレーナーの　ガーディに　ちかづくと
        ほえかかられて　かみつかれるぞ。
      ja: |-
        可愛いからと　いって　知らない
        トレーナーの　ガーディに　近づくと
        吠えかかられて　噛みつかれるぞ。
      ko: |-
        귀엽다고 해서 모르는
        트레이너의 가디에게 다가가면
        짖거나 물리기도 한다.
      zh-Hant: |-
        雖說很可愛，但如果靠近
        不認識的訓練家的卡蒂狗，
        是會被狂吠撕咬的。
      zh-Hans: |-
        虽说很可爱，但如果靠近
        不认识的训练家的卡蒂狗，
        是会被狂吠撕咬的。
      en: |-
        It looks cute, but when you approach another
        Trainer’s Growlithe, it will bark at you and bite.
      fr: |-
        Même s’il a l’air adorable, mieux vaut ne pas
        s’approcher du Caninos d’un Dresseur inconnu.
        On risque de se faire mordre.
      de: |-
        Es mag zwar niedlich aussehen, doch nähert
        man sich dem Fukano eines fremden Trainers,
        bellt es laut und schnappt nach einem.
      es: |-
        Por muy adorable que parezca, si te acercas al
        Growlithe de otro Entrenador, lo más probable
        es que te ladre e intente morderte.
      it: |-
        Sembra tanto carino, ma se qualcuno si avvicina
        al suo Allenatore, reagisce abbaiando
        e mordendo.
    ultra-sun:
      ja-Hrkt: |-
        なれれば　ひとなつっこいのだが
        やせいでは　イワンコと　なわばりを
        めぐって　はげしく　あらそっている。
      ja: |-
        慣れれば　人懐っこいのだが
        野生では　イワンコと　縄張りを
        巡って　激しく　争っている。
      ko: |-
        익숙해지면 사람을 잘 따르지만,
        야생에서는 암멍이와
        영역을 두고 격렬히 다툰다.
      zh-Hant: |-
        與人熟悉之後會表現得很親近，
        但野生的卡蒂狗會為了爭奪地盤，
        與岩狗狗展開激烈的鬥爭。
      zh-Hans: |-
        熟悉后便会与人亲近，
        但野生的卡蒂狗会和岩狗狗
        就领地而展开激烈的争夺。
      en: |-
        While it’s quite friendly toward humans once it’s
        grown used to them, in the wild it must be quite
        fierce to defend its territory from Rockruff.
      fr: |-
        Il est très facile à apprivoiser, mais à l’état
        sauvage, il combat férocement les Rocabot
        pour le contrôle de son territoire.
      de: |-
        Hat es sich erst einmal an Menschen gewöhnt,
        wird es sehr zutraulich. In der Wildnis liefert es
        sich jedoch heftige Revierkämpfe mit Wuffels.
      es: |-
        Es muy afable con las personas una vez que ha
        cogido confianza, pero, en estado salvaje, libra
        violentas disputas territoriales con los Rockruff.
      it: |-
        È molto docile con gli esseri umani a cui
        si affeziona, ma in natura lotta furiosamente
        con i Rockruff per il controllo del territorio.
    ultra-moon:
      ja-Hrkt: |-
        おおむかしから　にんげんと　ともに
        せいかつ　してきた。　せっきじだいの
        いせきから　ホネが　しゅつどされた。
      ja: |-
        大昔から　人間と　ともに
        生活　してきた。　石器時代の
        遺跡から　骨が　出土された。
      ko: |-
        먼 옛날부터 인간과 함께
        생활해 왔다. 석기 시대
        유적에서 뼈가 출토되었다.
      zh-Hant: |-
        很久以前開始就和人類
        一起生活。從石器時代的
        遺跡中出土過牠的骨頭。
      zh-Hans: |-
        很久很久以前就和人类一起生活。
        从石器时代的遗迹中
        出土过它的骨头。
      en: |-
        It has lived alongside humans since ages ago.
        Its bones have been found in excavations of
        ruins from the Stone Age.
      fr: |-
        Cela fait des siècles qu’il vit avec les humains.
        Des ossements de Caninos ont été retrouvés
        sur des sites datant de l’âge de pierre.
      de: |-
        Von alters her lebt es Seite an Seite mit den
        Menschen. In Ausgrabungsstätten steinzeitlicher
        Ruinen wurden Überreste von Fukano gefunden.
      es: |-
        Restos óseos hallados en yacimientos fósiles
        muestran que su convivencia con los humanos
        se remonta a la Edad de Piedra.
      it: |-
        Vive con gli esseri umani da tempi antichissimi.
        Sono state ritrovate ossa di questo Pokémon
        in siti archeologici risalenti all’età della pietra.
    lets-go-pikachu:
      ja-Hrkt: |-
        ひとなつっこい　せいかくだが
        なわばりに　はいってきた　てきに
        たいしては　はげしく　ほえる。
      ja: |-
        人なつっこい　性格だが
        縄張りに　入ってきた　敵に
        対しては　激しく　吠える。
      ko: |-
        사람을 잘 따르는 성격이지만
        영역에 들어온 상대에게는
        격렬하게 짖는다.
      zh-Hant: |-
        雖然性情友善容易親近，
        但當敵人侵入自己的地盤時，
        會朝著敵人放聲大吼。
      zh-Hans: |-
        性格很容易和人亲近，
        但是会对进入自己
        领地的敌人狂吠。
      en: |-
        A Pokémon with a friendly nature.
        However, it will bark fiercely at
        anything invading its territory.
      fr: |-
        Ce Pokémon est de nature amicale,
        mais il devient hargneux quand son territoire
        est menacé.
      de: |-
        Es ist von Natur aus sehr zutraulich. Doch wenn
        jemand in sein Revier eindringt, wird dieser wild
        angebellt.
      es: |-
        Este Pokémon es muy amistoso. Aun así, ladra
        con fiereza a cualquiera que invada su territorio.
      it: |-
        È un Pokémon molto affettuoso, ma si mette
        ad abbaiare impetuosamente contro chiunque
        invada il suo habitat.
