    white-2:
      en: |-
        A highly intelligent Pokémon.
        By folding back its wings in flight,
        it can overtake jet planes.
    x:
      ja-Hrkt: |-
        たかい　ちのうを　もつ　ポケモン。
        うでを　おりたたんで　とべば
        ジェットきを　おいこす　スピードだ。
      ja: |-
        高い　知能を　持つ　ポケモン。
        腕を　折りたたんで　飛べば
        ジェット機を　追い越す　スピードだ。
      ko: |-
        높은 지능을 가진 포켓몬이다.
        팔을 접어 날면 제트기를
        추월할 만큼 빠르다.
      en: |-
        A highly intelligent Pokémon. By folding back its
        wings in flight, it can overtake jet planes.
      fr: |-
        Un Pokémon très intelligent. Il peut voler plus vite
        qu’un avion à réaction en repliant ses ailes.
      de: |-
        Ein hochintelligentes Pokémon. Wenn es im Flug
        seine Flügel nach hinten legt, ist es schneller als
        ein Jet.
      es: |-
        Es un Pokémon muy inteligente. Puede adelantar a
        aviones a reacción plegando las alas.
      it: |-
        Pokémon molto intelligente. Ripiegando indietro
        le ali, riesce a volare più veloce di un jet.
    'y':
      ja-Hrkt: |-
        たかい　ちのうを　もち　にんげんの
        ことばを　りかいする。あらそいを
        きらう　やさしい　ポケモンだ。
      ja: |-
        高い　知能を　持ち
        人間の　言葉を　理解する。
        争いを　嫌う　優しい　ポケモンだ。
      ko: |-
        높은 지능을 가졌기 때문에 인간의
        말을 이해한다. 다툼을
        싫어하는 상냥한 포켓몬이다.
      en: |-
        It understands human speech and is highly
        intelligent. It is a tender Pokémon that
        dislikes fighting.
      fr: |-
        Un Pokémon très intelligent qui comprend le langage
        humain. Il déteste se battre.
      de: |-
        Es ist hochintelligent und versteht sogar die
        menschliche Sprache. Es ist friedlich und
        meidet Konflikte.
      es: |-
        Es muy inteligente y entiende el lenguaje humano.
        Es un Pokémon muy dócil y no le gusta nada combatir.
      it: |-
        Dotato di grande intelligenza, capisce il linguaggio
        umano. Pacifico, non ama combattere.
    omega-ruby:
      ja-Hrkt: |-
        みた　ものや　かんがえた　イメージを　あいてに
        えいぞうとして　みせる　のうりょくを　もつ。
        にんげんの　ことばを　りかいすることが　できる。
      ja: |-
        見た　ものや　考えた　イメージを　相手に
        映像として　見せる　能力を　持つ。
        人間の　言葉を　理解することが　できる。
      ko: |-
        본 것이나 생각한 이미지를 상대에게
        영상으로 보여주는 능력을 지녔다.
        인간의 말을 이해할 수 있다.
      en: |-
        Latios has the ability to make others see an image of what it
        has seen or imagines in its head. This Pokémon is intelligent
        and understands human speech.
      fr: |-
        Latios a le pouvoir de faire voir à une personne une image
        provenant de son subconscient. Ce Pokémon est intelligent
        et comprend le langage humain.
      de: |-
        Latios kann seinem Gegenüber ein Bild von etwas, das es
        einmal gesehen hat, in den Kopf projizieren. Dieses Pokémon
        ist intelligent und es versteht die menschliche Sprache.
      es: |-
        Latios tiene la habilidad de hacer que los demás vean algo que
        él ha visto o imaginado. Este Pokémon es muy inteligente. Es
        capaz de entender el lenguaje humano.
      it: |-
        Latios ha l’abilità di far vedere agli altri l’immagine di ciò che
        ha visto o immaginato nella propria testa. Questo Pokémon
        è intelligente e capisce il linguaggio umano.
    alpha-sapphire:
      ja-Hrkt: |-
        やさしい　こころの　もちぬしにしか　なつかない。
        うでを　おりたたむと　くうきていこうが　へって
        ジェットき　よりも　はやく　そらを　とべるぞ。
      ja: |-
        優しい　心の　持ち主にしか　なつかない。
        腕を　折り畳むと　空気抵抗が　減って
        ジェット機　よりも　速く　空を　飛べるぞ。
      ko: |-
        상냥한 마음씨를 가진 자만을 따른다.
        팔을 접으면 공기저항이 줄어
        제트기보다 빠르게 하늘을 난다.
      en: |-
        Latios will only open its heart to a Trainer with a
        compassionate spirit. This Pokémon can fly faster than a
        jet plane by folding its forelegs to minimize air resistance.
      fr: |-
        Latios n’ouvrira son cœur qu’à un Dresseur doté d’un esprit
        compatissant. Ce Pokémon peut voler plus vite qu’un avion
        à réaction en repliant ses pattes avant pour améliorer
        son aérodynamisme.
      de: |-
        Latios schüttet nur seinem Trainer gegenüber sein Herz aus.
        Dieses Pokémon fliegt schneller als ein Flugzeug, indem es
        seine Vorderbeine einklappt, um den Luftwiderstand zu
        verringern.
      es: |-
        Latios solo le abre el corazón a los Entrenadores compasivos.
        A la hora de volar, este Pokémon pliega las patas delanteras
        para minimizar la resistencia al aire y supera en velocidad a un
        avión a reacción.
      it: |-
        Latios apre il proprio cuore ad Allenatori d’animo buono
        e generoso. Il Pokémon riesce a volare più veloce di un
        aereo a reazione, piegando le zampe anteriori per minimizzare
        l’attrito dell’aria.
