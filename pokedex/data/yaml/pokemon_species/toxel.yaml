toxel:
  base_happiness: 50
  capture_rate: 75
  color: purple
  egg_groups:
    - no-eggs
  evolution_chain: toxel
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        たいないの　どくぶくろに　ためた
        どくそを　ひふから　ぶんぴつ。
        さわると　ピリピリと　しびれる。
      ja: |-
        体内の　毒袋に　溜めた
        毒素を　皮膚から　分泌。
        触ると　ピリピリと　痺れる。
      ko: |-
        체내의 독주머니에 저장하고 있는
        독소를 피부를 통해 분비한다.
        건드리면 찌릿하고 마비된다.
      zh-Hant: |-
        會從皮膚把體內的毒囊裡
        儲存著的毒素分泌出來。
        一旦觸碰牠就會感到麻麻的。
      zh-Hans: |-
        会从皮肤把体内的毒囊里
        储存着的毒素分泌出来。
        一旦触碰它就会感到麻麻的。
      en: |-
        It stores poison in an internal poison sac and
        secretes that poison through its skin. If you touch
        this Pokémon, a tingling sensation follows.
      fr: |-
        Sa peau sécrète les toxines accumulées
        dans sa poche de poison interne.
        Quand on le touche, on se fait électrocuter.
      de: |-
        Das Gift aus dem Giftsack in seinem Körper
        sondert es über die Haut ab. Berührt man es,
        bekommt man einen lähmenden Schock verpasst.
      es: |-
        Secreta toxinas por la piel y las almacena
        en una bolsa de veneno interna. Tocarlo da
        calambre.
      it: |-
        Secerne dalla pelle le tossine contenute nella
        sua sacca di veleno interna. Provoca a chi lo
        tocca una sensazione di bruciore.
    shield:
      ja-Hrkt: |-
        どくそを　かがくへんか　させて
        でんきを　だす。　でんりょくは
        よわいが　ビリビリと　しびれる。
      ja: |-
        毒素を　化学変化　させて
        電気を　出す。　電力は
        弱いが　ビリビリと　痺れる。
      ko: |-
        독소를 화학 변화시켜
        전기를 만들어 낸다. 전력은
        약하지만 찌릿찌릿 마비된다.
      zh-Hant: |-
        透過讓自身的毒素產生
        化學反應來發電。電力
        雖然弱，卻能造成麻痺。
      zh-Hans: |-
        通过让自身的毒素产生
        化学反应来发电。电力
        虽然弱，却能造成麻痹。
      en: |-
        It manipulates the chemical makeup of its poison
        to produce electricity. The voltage is weak, but it
        can cause a tingling paralysis.
      fr: |-
        Par un procédé chimique, il change son poison
        en électricité. L’intensité du courant est faible,
        mais peut engourdir un ennemi.
      de: |-
        Es ändert sein Toxin auf chemischer Ebene,
        um Strom zu erzeugen. Dieser ist zwar schwach,
        kann aber einen lähmenden Schlag verursachen.
      es: |-
        Provoca una reacción química para generar
        energía eléctrica con sus toxinas. Aunque de
        bajo voltaje, puede causar entumecimiento.
      it: |-
        Produce elettricità grazie a una reazione chimica
        delle sue tossine. Il voltaggio è debole, ma può
        intorpidire il nemico.
