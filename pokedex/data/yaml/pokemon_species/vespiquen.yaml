vespiquen:
  base_happiness: 50
  capture_rate: 45
  color: yellow
  egg_groups:
    - bug
  evolution_chain: combee
  evolves_from: combee
  flavor_text:
    diamond:
      en: |-
        Its abdomen is a honeycomb for
        grubs. It raises its grubs on
        honey collected by COMBEE.
    pearl:
      en: |-
        When endangered, grubs from its
        six-cell honeycomb strike back.
        There is only one in a colony.
    platinum:
      en: |-
        It releases various pheromones
        to make the grubs in its body do
        its bidding while fighting foes.
    heartgold:
      en: |-
        It raises grubs in the holes in its
        body. It secretes pheromones to
        control COMBEE.
    soulsilver:
      en: |-
        It raises grubs in the holes in its
        body. It secretes pheromones to
        control COMBEE.
    black:
      en: |-
        It releases various pheromones
        to make the grubs in its body do
        its bidding while fighting foes.
      fr: |-
        Ce Pokémon utilise des phéromones
        pour donner des ordres de combat
        aux larves dans son abdomen.
    white:
      en: |-
        It releases various pheromones
        to make the grubs in its body do
        its bidding while fighting foes.
      fr: |-
        Ce Pokémon utilise des phéromones
        pour donner des ordres de combat
        aux larves dans son abdomen.
    black-2:
      en: |-
        It houses its colony in cells in its body
        and releases various pheromones to
        make those grubs do its bidding.
    white-2:
      en: |-
        It houses its colony in cells in its body
        and releases various pheromones to
        make those grubs do its bidding.
    x:
      ja-Hrkt: |-
        どうたいは　こどもたちの　すあな。
        いろんな　フェロモンを　だして
        こどもたちを　じゆうに　あやつる。
      ja: |-
        胴体は　子供たちの　巣穴。
        いろんな　フェロモンを　だして
        子供たちを　自由に　操る。
      ko: |-
        몸통은 아기들의 둥지다.
        여러 페로몬을 내어
        새끼들을 자유롭게 조종한다.
      en: |-
        It houses its colony in cells in its body and releases
        various pheromones to make those grubs do
        its bidding.
      fr: |-
        Son abdomen abrite ses petits. Ce Pokémon utilise
        des phéromones pour leur donner des ordres.
      de: |-
        Es beherbergt Jung-Pokémon in seinem Rumpf,
        die es mithilfe von verschiedenen Pheromonen
        frei herumkommandieren kann.
      es: |-
        Cría larvas en los panales de su cuerpo. Segrega
        diversas feromonas de su cuerpo con las cuales
        controla a sus crías.
      it: |-
        Nell’addome ospita la sua progenie, sulla quale
        esercita un controllo assoluto tramite i feromoni
        che rilascia.
    'y':
      ja-Hrkt: |-
        どうたいが　こどもたちの　すあなに
        なっている。ミツハニーの　あつめた
        ミツで　こどもたちを　そだてる。
      ja: |-
        胴体が　子供たちの　巣穴に
        なっている。ミツハニーの　集めた
        ミツで　子供たちを　育てる。
      ko: |-
        몸통이 새끼들의 둥지로
        되어 있다. 세꿀버리가 모은
        꿀로 새끼들을 키운다.
      en: |-
        Its abdomen is a honeycomb for grubs. It raises its
        grubs on honey collected by Combee.
      fr: |-
        Son abdomen est un rayon où vivent ses larves,
        élevées avec le nectar récolté par Apitrini.
      de: |-
        Sein Bauch ist die Wabe für die Larven. Es füttert
        seine Larven mit dem Honig, den Wadribie sammelt.
      es: |-
        Su abdomen es un panal de larvas que alimenta con
        la miel recogida por Combee.
      it: |-
        Il suo addome funge da rifugio per le larve, che
        nutre con il nettare raccolto da Combee.
    omega-ruby:
      ja-Hrkt: |-
        どうたいは　こどもたちの　すあな。
        いろんな　フェロモンを　だして
        こどもたちを　じゆうに　あやつる。
      ja: |-
        胴体は　子供たちの　巣穴。
        いろんな　フェロモンを　だして
        子供たちを　自由に　操る。
      ko: |-
        몸통은 새끼들의 둥지다.
        여러 페로몬을 내어
        새끼들을 자유롭게 조종한다.
      en: |-
        It houses its colony in cells in its body and releases
        various pheromones to make those grubs do its bidding.
      fr: |-
        Son abdomen abrite ses petits. Ce Pokémon utilise
        des phéromones pour leur donner des ordres.
      de: |-
        Es beherbergt Jung-Pokémon in seinem Rumpf, die es mithilfe
        von verschiedenen Pheromonen frei herumkommandieren kann.
      es: |-
        Cría larvas en los panales de su cuerpo. Segrega diversas
        feromonas de su cuerpo con las cuales controla a sus crías.
      it: |-
        Nell’addome ospita la sua progenie, sulla quale esercita
        un controllo assoluto tramite i feromoni che rilascia.
    alpha-sapphire:
      ja-Hrkt: |-
        どうたいが　こどもたちの　すあなに
        なっている。ミツハニーの　あつめた
        ミツで　こどもたちを　そだてる。
      ja: |-
        胴体が　子供たちの　巣穴に
        なっている。ミツハニーの　集めた
        ミツで　子供たちを　育てる。
      ko: |-
        몸통이 새끼들의 둥지로
        되어 있다. 세꿀버리가 모은
        꿀로 새끼들을 키운다.
      en: |-
        Its abdomen is a honeycomb for grubs. It raises its
        grubs on honey collected by Combee.
      fr: |-
        Son abdomen est un rayon où vivent ses larves, élevées avec
        le nectar récolté par Apitrini.
      de: |-
        Sein Bauch ist die Wabe für die Larven. Es füttert
        seine Larven mit dem Honig, den Wadribie sammelt.
      es: |-
        Su abdomen es un panal de larvas que alimenta con la miel
        recogida por Combee.
      it: |-
        Il suo addome funge da rifugio per le larve, che nutre con il
        nettare raccolto da Combee.
    sword:
      ja-Hrkt: |-
        こどもたちを　じざいに　あやつり
        てきと　たたかう。　こどもたちは
        ビークインのため　いのちを　かける。
      ja: |-
        子どもたちを　自在に　操り
        敵と　戦う。　子どもたちは
        ビークインのため　命を　かける。
      ko: |-
        새끼들을 자유자재로 조종하여
        상대와 싸운다. 새끼들은
        비퀸을 위해 목숨을 걸고 싸운다.
      zh-Hant: |-
        自由自在地指揮孩子們
        與敵人戰鬥。孩子們會
        為了蜂女王而拼上性命。
      zh-Hans: |-
        自由自在地指挥孩子们
        与敌人战斗。孩子们会
        为了蜂女王而拼上性命。
      en: |-
        It skillfully commands its grubs in battles with its
        enemies. The grubs are willing to risk their lives
        to defend Vespiquen.
      fr: |-
        Ce Pokémon se bat en dirigeant ses petits.
        Ces derniers sont prêts à se sacrifier pour
        leur Apireine.
      de: |-
        Es hat die Kontrolle über seine Nachkommen.
        Diese würden im Kampf ihr Leben aufs Spiel
        setzen, um es vor Feinden zu schützen.
      es: |-
        Combate dirigiendo a sus larvas, que obedecen
        a su reina sin rechistar y se sacrifican por ella si
        es necesario.
      it: |-
        Attacca il nemico controllando a piacimento
        la sua progenie, che per Vespiquen è pronta
        a sacrificare anche la propria vita.
    shield:
      ja-Hrkt: |-
        フェロモンを　はなつ　りょうが
        おおい　ビークインほど　おおくの
        ミツハニーを　したがえている。
      ja: |-
        フェロモンを　放つ　量が
        多い　ビークインほど　多くの
        ミツハニーを　従えている。
      ko: |-
        페로몬을 발산하는 양이
        많은 비퀸일수록 많은
        세꿀버리를 거느리고 있다.
      zh-Hant: |-
        能釋放越多費洛蒙的蜂女王，
        就能讓越多的三蜜蜂
        聽從自己的指揮。
      zh-Hans: |-
        能释放越多费洛蒙的蜂女王，
        就能让越多的三蜜蜂
        听从自己的指挥。
      en: |-
        Vespiquen that give off more pheromones
        have larger swarms of Combee attendants.
      fr: |-
        Plus la quantité de phéromones qu’il libère
        est élevée, plus le nombre d’Apitrini qu’il peut
        diriger est grand.
      de: |-
        Je mehr Pheromone ein Honweisel freisetzt,
        desto mehr Wadribie kann es kontrollieren.
      es: |-
        Cuanto mayor sea la cantidad de feromonas que
        segregue, mayor será el número de Combee que
        pueda controlar.
      it: |-
        Maggiore è la quantità di feromoni rilasciati
        da Vespiquen, maggiore è il numero di Combee
        sotto il suo controllo.
    legends-arceus:
      en: |-
        Commands its subjects to build its hive. It will dispatch any
        interlopers who dare sneak into its nest and use them as
        nourishment for itself.
