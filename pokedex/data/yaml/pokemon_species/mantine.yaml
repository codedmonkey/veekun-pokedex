mantine:
  base_happiness: 50
  capture_rate: 25
  color: purple
  egg_groups:
    - water1
  evolution_chain: mantine
  evolves_from: mantyke
  flavor_text:
    gold:
      en: |-
        As it majestically
        swims, it doesn't
        care if REMORAIDattach to it for
        scavenging its
        leftovers.
    silver:
      en: |-
        Swimming freely in
        open seas, it may
        fly out of thewater and over the
        waves if it builds
        up enough speed.
    crystal:
      en: |-
        It swims along
        freely, eating
        things that swiminto its mouth.
        Its whole body is
        very coarse.
    ruby:
      en: |-
        On sunny days, schools of MANTINE can
        be seen elegantly leaping over the
        sea’s waves.This POKéMON is not bothered by the
        REMORAID that hitches rides.
    sapphire:
      en: |-
        On sunny days, schools of MANTINE can
        be seen elegantly leaping over the
        sea’s waves.This POKéMON is not bothered by the
        REMORAID that hitches rides.
    emerald:
      en: |-
        On sunny days, schools of MANTINE can be
        seen elegantly leaping over the waves.
        It is not bothered by the REMORAID that
        hitches rides.
    firered:
      en: |-
        Swimming freely in open seas, it may fly
        out of the water and over the waves if it
        builds up enough speed.
    leafgreen:
      en: |-
        As it majestically swims, it doesn’t care
        if REMORAID attach to it to scavenge
        for its leftovers.
    diamond:
      en: |-
        When the waves are calm, one may
        encounter a swarm of MANTINE
        swimming as if they are in flight.
    pearl:
      en: |-
        It swims elegantly, mindless of
        REMORAID hitching on to its broad
        fins. It has a docile nature.
    platinum:
      en: |-
        While elegantly swimming in the sea,
        it ignores REMORAID that cling to
        its fins seeking food scraps.
    heartgold:
      en: |-
        As it majestically swims, it doesn’t
        care if REMORAID attach to it for
        scavenging its leftovers.
    soulsilver:
      en: |-
        Swimming freely in open seas, it may
        fly out of the water and over the
        waves if it builds up enough speed. 
    black:
      en: |-
        While elegantly swimming in the sea,
        it ignores Remoraid that cling to
        its fins seeking food scraps.
      fr: |-
        Il ignore royalement les Rémoraid
        qui s’accrochent à ses nageoires
        pour manger les restes qu’il sème.
    white:
      en: |-
        While elegantly swimming in the sea,
        it ignores Remoraid that cling to
        its fins seeking food scraps.
      fr: |-
        Il ignore royalement les Rémoraid
        qui s’accrochent à ses nageoires
        pour manger les restes qu’il sème.
    black-2:
      en: |-
        If it builds up enough speed swimming, it
        can fly over 300 feet out of the water
        from the surface of the ocean.
    white-2:
      en: |-
        If it builds up enough speed swimming, it
        can fly over 300 feet out of the water
        from the surface of the ocean.
    x:
      ja-Hrkt: |-
        およいで　スピードが　のってくると
        なみのうえに　とびだし　そのまま
        １００メートルも　かっくう　する。
      ja: |-
        泳いで　スピードが　のってくると
        波の上に　飛びだし　そのまま
        １００メートルも　滑空　する。
      ko: |-
        헤엄쳐서 스피드가 빨라지면
        파도 위에 뛰어올라 그대로
        100m나 활공한다.
      en: |-
        If it builds up enough speed swimming, it can fly
        over 300 feet out of the water from the surface of
        the ocean.
      fr: |-
        Il peut planer au-dessus des vagues sur plus de
        100 m en prenant son élan dans la mer.
      de: |-
        Schwimmt es schnell genug, kann es über die Wellen
        springen und bis zu 100 m durch die Lüfte gleiten.
      es: |-
        Acumula velocidad nadando y puede saltar fuera del
        agua, alcanzando 100 metros de altura, para
        descender luego planeando.
      it: |-
        Prende velocità nuotando e, quando è pronto, usa
        le onde come trampolini per saltare a volte anche
        fino a 100 m.
    'y':
      ja-Hrkt: |-
        ゆうぜんと　うみを　およぐうちに
        たべのこしを　ねらった　テッポウオが
        ヒレに　くっつくが　きにしていない。
      ja: |-
        悠然と　海を　泳ぐうちに
        食べ残しを　ねらった　テッポウオが
        ヒレに　くっつくが　気にしていない。
      ko: |-
        유연하게 바다를 헤엄칠 때
        먹다 남은 음식을 노린 총어가
        지느러미에 달라붙지만 신경 안 쓴다.
      en: |-
        While elegantly swimming in the sea, it ignores
        Remoraid that cling to its fins seeking food scraps.
      fr: |-
        Il ignore royalement les Rémoraid qui s’accrochent
        à ses nageoires pour manger les restes qu’il sème.
      de: |-
        Zieht elegant durch die Meere und ignoriert dabei
        Remoraid, die an seinen Flossen haften.
      es: |-
        Nada con gran elegancia e ignora a los Remoraid que
        se aferran a sus aletas buscando restos de comida.
      it: |-
        Nuota in mare con eleganza e ignora i Remoraid che
        gli si attaccano alle pinne in cerca di avanzi di cibo.
    omega-ruby:
      ja-Hrkt: |-
        はれた　ひには　うみの　うえを　ゆうがに　はねる
        マンタインの　むれを　みることが　できるよ。
        テッポウオが　くっついていても　きにしない。
      ja: |-
        晴れた　日には　海の　上を　優雅に　跳ねる
        マンタインの　群れを　見ることが　できるよ。
        テッポウオが　くっついていても　気にしない。
      ko: |-
        맑은 날에는 바다 위를 우아하게 뛰어오르는
        만타인 무리를 볼 수 있다.
        총어가 들러붙어 있어도 신경 쓰지 않는다.
      en: |-
        On sunny days, schools of Mantine can be seen elegantly
        leaping over the sea’s waves. This Pokémon is not bothered
        by the Remoraid that hitches rides.
      fr: |-
        Les jours de beau temps, on peut voir des bancs de Démanta
        sauter au-dessus des vagues. Le Rémoraid qui l’accompagne
        ne dérange pas ce Pokémon.
      de: |-
        An schönen Tagen sieht man Schwärme von Mantax elegant
        über die Wellen des Ozeans springen. Durch Remoraid, die
        an ihm haften und es begleiten, fühlt sich dieses Pokémon
        nicht belästigt.
      es: |-
        En los días que hace sol, es posible ver bancos de Mantine
        saltando con elegancia por entre las olas del mar. A estos
        Pokémon no les molestan los Remoraid que se les pegan.
      it: |-
        Nelle giornate soleggiate è possibile vedere banchi di Mantine
        nuotare con eleganza sulle onde marine. Talvolta offrono
        anche un comodo trasporto ai Remoraid.
    alpha-sapphire:
      ja-Hrkt: |-
        はれた　ひには　うみの　うえを　ゆうがに　はねる
        マンタインの　むれを　みることが　できるよ。
        テッポウオが　くっついていても　きにしない。
      ja: |-
        晴れた　日には　海の　上を　優雅に　跳ねる
        マンタインの　群れを　見ることが　できるよ。
        テッポウオが　くっついていても　気にしない。
      ko: |-
        맑은 날에는 바다 위를 우아하게 뛰어오르는
        만타인 무리를 볼 수 있다.
        총어가 들러붙어 있어도 신경 쓰지 않는다.
      en: |-
        On sunny days, schools of Mantine can be seen elegantly
        leaping over the sea’s waves. This Pokémon is not bothered
        by the Remoraid that hitches rides.
      fr: |-
        Les jours de beau temps, on peut voir des bancs de Démanta
        sauter au-dessus des vagues. Le Rémoraid qui l’accompagne
        ne dérange pas ce Pokémon.
      de: |-
        An schönen Tagen sieht man Scharen von Mantax elegant über
        die Wellen des Ozeans springen. Durch Remoraid, die an ihm
        haften und es begleiten, fühlt sich dieses Pokémon nicht
        belästigt.
      es: |-
        En los días que hace sol, es posible ver bancos de Mantine
        saltando con elegancia por entre las olas del mar. A estos
        Pokémon no les molestan los Remoraid que se les pegan.
      it: |-
        Nelle giornate soleggiate è possibile vedere banchi di Mantine
        nuotare con eleganza sulle onde marine. Talvolta offrono
        anche un comodo trasporto ai Remoraid.
    ultra-sun:
      ja-Hrkt: |-
        ゆうがに　なみの　うえを　とびはねる
        マンタインを　えがいた　えハガキや
        ポスターは　にんきのアローラみやげ。
      ja: |-
        優雅に　波の　上を　飛びはねる
        マンタインを　描いた　絵ハガキや
        ポスターは　人気のアローラ土産。
      ko: |-
        우아하게 파도 위를 튀어 오르는
        만타인을 그린 그림엽서나 포스터는
        인기 있는 알로라 특산품이다.
      zh-Hant: |-
        阿羅拉的熱門特產是畫了
        巨翅飛魚在海浪上優雅跳躍
        的手繪明信片和海報。
      zh-Hans: |-
        阿罗拉的人气特产是绘有巨翅飞鱼
        在海浪上优雅跳跃的明信片及海报。
      en: |-
        Postcards and posters featuring Mantine
        leaping elegantly above the waves are popular
        souvenirs of Alola.
      fr: |-
        Une carte postale ou un poster d’un Démanta
        planant gracieusement au-dessus des vagues
        est un souvenir typique d’Alola.
      de: |-
        Postkarten und Poster, auf denen Mantax
        elegant über die Wellen springt, sind beliebte
        Mitbringsel aus Alola.
      es: |-
        Un souvenir típico de Alola son las postales y
        pósteres con dibujos de Mantine saltando
        grácilmente sobre las olas del mar.
      it: |-
        Volteggia con grazia sulle onde ed è raffigurato
        in cartoline e poster di Alola molto apprezzati
        come souvenir.
    ultra-moon:
      ja-Hrkt: |-
        かれいに　およぐ　マンタインに
        あこがれ　サーフィンを　はじめたと
        いう　ひとも　おおいのだ。
      ja: |-
        華麗に　泳ぐ　マンタインに
        憧れ　サーフィンを　始めたと
        いう　人も　多いのだ。
      ko: |-
        화려하게 헤엄치는 만타인을
        동경하여 서핑을 시작했다는
        사람도 많이 있다.
      zh-Hant: |-
        也有許多人是因為嚮往
        巨翅飛魚的華麗泳姿
        才開始衝浪的。
      zh-Hans: |-
        也有很多人是因为向往
        巨翅飞鱼那华丽的泳姿
        才开始冲浪的。
      en: |-
        Many people have taken up surfing because
        they admire how magnificently Mantine swims.
      fr: |-
        Nombreux sont les surfeurs qui ont trouvé leur
        vocation après être tombés sous le charme
        de la nage majestueuse d’un Démanta.
      de: |-
        Es gibt viele Menschen, die mit dem Surfen
        angefangen haben, weil sie die wunderschön
        dahinschwimmenden Mantax so bewundern.
      es: |-
        Muchos surfistas se iniciaron en la disciplina
        inspirados por el grácil nado de los Mantine.
      it: |-
        Mantine nuota con un’eleganza tale che molti
        dicono di aver iniziato a praticare il surf
        per cercare di emularlo.
    sword:
      ja-Hrkt: |-
        およいで　スピードが　のってくると
        なみのうえに　とびだし　そのまま
        １００メートルも　かっくう　する。
      ja: |-
        泳いで　スピードが　のってくると
        波の上に　飛びだし　そのまま
        １００メートルも　滑空　する。
      ko: |-
        헤엄쳐서 스피드가 빨라지면
        파도 위로 뛰어올라
        그대로 100m나 활공한다.
      zh-Hant: |-
        游動時速度上來後，
        甚至會從波浪上飛起來，
        然後就這樣滑翔１００公尺。
      zh-Hans: |-
        游动时速度上来后，
        甚至会从波浪上起飞，
        然后就这样滑翔１００米。
      en: |-
        If it builds up enough speed swimming, it
        can jump out above the waves and glide
        for over 300 feet.
      fr: |-
        Il peut planer au-dessus des vagues sur plus
        de 100 m en prenant son élan dans la mer.
      de: |-
        Schwimmt es schnell genug, kann es über die
        Wellen springen und bis zu 100 m durch die
        Lüfte gleiten.
      es: |-
        Tras ganar velocidad nadando, aprovecha las olas
        para proyectarse y recorrer planeando hasta
        100 m de distancia.
      it: |-
        Prende velocità nuotando e, quando è pronto,
        usa le onde come trampolini per saltare,
        planando poi anche per 100 m.
    shield:
      ja-Hrkt: |-
        ゆうぜんと　うみを　およぐ。
        たべのこしを　ねらった　テッポウオが
        くっついていても　きにしていない。
      ja: |-
        悠然と　海を　泳ぐ。
        食べ残しを　狙った　テッポウオが
        くっついていても　気にしていない。
      ko: |-
        여유롭게 바다를 헤엄친다.
        먹다 남은 음식을 노린 총어가
        달라붙어 있어도 신경 쓰지 않는다.
      zh-Hant: |-
        悠然地暢游在大海中。
        就算有覬覦食物殘渣的鐵炮魚
        吸附在自己身上也毫不在意。
      zh-Hans: |-
        悠然地畅游在大海中。
        就算有觊觎食物残渣的铁炮鱼
        吸附在自己身上也毫不在意。
      en: |-
        As it majestically swims, it doesn’t care if
        Remoraid attach to it to scavenge for its leftovers.
      fr: |-
        Il nage paisiblement, sans se soucier des Rémoraid
        qui s’agrippent à lui pour lui voler ses restes.
      de: |-
        Es schwimmt erhaben durch die Meere und
        duldet dabei etwaige Remoraid, die sich in der
        Hoffnung auf Futterreste an es heften.
      es: |-
        Mientras nada plácidamente, no le importa que
        los Remoraid se aferren a él para comerse sus
        sobras.
      it: |-
        Nuota placidamente nel mare. Non si cura
        dei Remoraid che gli si attaccano addosso
        per cibarsi dei suoi avanzi.
