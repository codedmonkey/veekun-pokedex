    black-2:
      en: |-
        It suddenly falls out of the sky in
        the morning. Knowing it’s weak, it
        simply feeds until it evolves.
    white-2:
      en: |-
        It suddenly falls out of the sky in
        the morning. Knowing it’s weak, it
        simply feeds until it evolves.
    x:
      ja-Hrkt: |-
        あるあさ　とつぜん　ふってくる。
        オニスズメに　おそわれると　はっぱを
        はげしく　ふって　おいはらう。
      ja: |-
        ある朝　突然　降ってくる。
        オニスズメに　襲われると　葉っぱを
        激しく　振って　追い払う。
      ko: |-
        어느 날 아침 갑자기 떨어진다.
        깨비참에게 습격당하면 잎사귀를
        세차게 흔들어서 쫓아 버린다.
      en: |-
        It may plummet from the sky. If attacked by a
        Spearow, it will violently shake its leaves.
      fr: |-
        Il tombe du ciel soudainement. S’il est attaqué par
        un Piafabec, il secoue violemment ses feuilles.
      de: |-
        Manchmal fällt es plötzlich vom Himmel. Wird es
        von Habitak angegriffen, schüttelt es seine Blätter.
      es: |-
        Puede caer del cielo de repente. Si le ataca un
        Spearow, moverá violentamente sus hojas.
      it: |-
        Piomba dall’alto improvvisamente. Se è attaccato
        da uno Spearow, agita violentemente le foglie.
    'y':
      ja-Hrkt: |-
        はっぱの　うらがわに　たまった
        あさつゆ　だけを　のんで　くらす。
        ほかには　なにも　たべないという。
      ja: |-
        葉っぱの　裏側に　たまった
        朝露だけを　飲んで　暮らす。
        他には　なにも　食べないという。
      ko: |-
        나뭇잎의 뒷면에 모인
        이슬만을 먹고 산다. 그 밖에는
        아무것도 먹지 않는다고 한다.
      en: |-
        It lives by drinking only dewdrops from under the
        leaves of plants. It is said that it eats nothing else.
      fr: |-
        Il vit en buvant la rosée sur les feuilles. On dit qu’il ne
        peut rien avaler d’autre.
      de: |-
        Es ernährt sich ausschließlich von den Tautropfen,
        die von den Blättern über ihm hinabfallen.
      es: |-
        Se alimenta del rocío que hay sobre las hojas de las
        plantas. Dicen que no come nada más.
      it: |-
        Vive nutrendosi delle gocce di rugiada che cadono
        dalle foglie delle piante. Pare che non mangi altro.
    omega-ruby:
      ja-Hrkt: |-
        からだに　ためた　えいようは　しんかの　ときまで
        とっておくため　ほとんど　うごこうとしない。
        なにも　たべずに　あさつゆ　だけを　のんでいる。
      ja: |-
        体に　ためた　栄養は　進化の　ときまで
        取っておくため　ほとんど　動こうとしない。
        なにも　食べずに　朝露　だけを　飲んでいる。
      ko: |-
        몸에 모은 영양을 진화할 때까지
        간직하기 위해 거의 움직이려 하지 않는다.
        아무것도 먹지 않고 아침 이슬만 마시고 있다.
      en: |-
        Sunkern tries to move as little as it possibly can. It does so
        because it tries to conserve all the nutrients it has stored in its
        body for its evolution. It will not eat a thing, subsisting only on
        morning dew.
      fr: |-
        Tournegrin essaie de bouger le moins possible. C’est parce
        qu’il veut conserver tous les nutriments qu’il stocke dans son
        corps pour son évolution. Il ne mange pas, ne subsistant que
        grâce à la rosée matinale.
      de: |-
        Sonnkern versucht, sich so wenig wie möglich zu bewegen,
        um alle gespeicherten Nährstoffe für seine Entwicklung
        aufzusparen. Außer Morgentau nimmt es nichts weiter zu sich.
      es: |-
        Sunkern intenta moverse lo menos posible para conservar
        todos los nutrientes que ha guardado en su interior y poder
        evolucionar. Ni come siquiera; se alimenta solo del rocío de
        la mañana.
      it: |-
        Sunkern cerca di muoversi il meno possibile per preservare
        le sostanze nutritive che ha immagazzinato nel corpo
        per la sua evoluzione. Non mangia nulla, si nutre solo
        di rugiada mattutina.
    alpha-sapphire:
      ja-Hrkt: |-
        からだに　ためた　えいようは　しんかの　ときまで
        とっておくため　ほとんど　うごこうとしない。
        なにも　たべずに　あさつゆ　だけを　のんでいる。
      ja: |-
        体に　ためた　栄養は　進化の　ときまで
        取っておくため　ほとんど　動こうとしない。
        なにも　食べずに　朝露　だけを　飲んでいる。
      ko: |-
