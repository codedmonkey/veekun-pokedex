    heartgold:
      en: |-
        BELLOSSOM gather at times and seem
        to dance. They say that the dance
        is a ritual to summon the sun.
    soulsilver:
      en: |-
        Plentiful in the tropics. When it
        dances, its petals rub together and
        make a pleasant ringing sound.
    black:
      en: |-
        When the heavy rainfall season
        ends, it is drawn out by warm
        sunlight to dance in the open.
      fr: |-
        À la fin de la saison des pluies,
        il sort danser en plein air,
        attiré par la chaleur du soleil.
    white:
      en: |-
        When the heavy rainfall season
        ends, it is drawn out by warm
        sunlight to dance in the open.
      fr: |-
        À la fin de la saison des pluies,
        il sort danser en plein air,
        attiré par la chaleur du soleil.
    black-2:
      en: |-
        When the heavy rainfall season
        ends, it is drawn out by warm
        sunlight to dance in the open.
    white-2:
      en: |-
        When the heavy rainfall season
        ends, it is drawn out by warm
        sunlight to dance in the open.
    x:
      ja-Hrkt: |-
        ときおり　キレイハナが　あつまって
        おどるような　しぐさを　みせる。
        たいようをよぶ　ぎしき　といわれる。
      ja: |-
        ときおり　キレイハナが　集まって
        踊るような　仕草を　みせる。
        太陽を呼ぶ　儀式と　いわれる。
      ko: |-
        가끔 아르코가 모여서
        춤을 추는 듯한 동작을 보인다.
        태양을 부르는 의식이라 전해진다.
      en: |-
        Bellossom gather at times and seem to dance.
        They say that the dance is a ritual to summon
        the sun.
      fr: |-
        Les Joliflor se réunissent souvent pour danser.
        On pense que c’est un rituel pour appeler le soleil.
      de: |-
        Blubella kommen zusammen, um zu tanzen.
        Man sagt, dieser Tanz sei ein Ritual,
        um der Sonne zu huldigen.
      es: |-
        Los Bellossom suelen reunirse para bailar. Dicen que
        sus danzas son un ritual para invocar al sol.
      it: |-
        A volte gruppi di Bellossom sembrano danzare.
        Si dice che sia un rito per invocare il sole.
    'y':
      ja-Hrkt: |-
        おおあめの　きせつが　おわると
        あたたかい　ひざしに　さそわれた
        キレイハナが　おどりはじめる。
      ja: |-
        大雨の　季節が　終わると
        暖かい　日差しに　誘われた
        キレイハナが　踊りはじめる。
      ko: |-
        장마의 계절이 끝나면
        따뜻한 햇살에 이끌려나온
        아르코가 춤추기 시작한다.
      en: |-
        When the heavy rainfall season ends, it is drawn
        out by warm sunlight to dance in the open.
      fr: |-
        À la fin de la saison des pluies, il sort danser en plein
        air, attiré par la chaleur du soleil.
      de: |-
        Sobald die Regenzeit vorbei ist, wird es von der
        warmen Sonne nach draußen gezogen, wo es tanzt.
      es: |-
        Cuando acaba la estación de las lluvias, sale al sol e
        inicia una peculiar danza.
      it: |-
        Quando finisce la stagione delle piogge, lo si vede
        danzare sotto i caldi raggi del sole.
    omega-ruby:
      ja-Hrkt: |-
        たいようの　ひかりを　いっぱい　あびると
        からだの　はっぱが　くるくる　まわり　はじめる。
        キレイハナの　ダンスは　なんごくの　めいぶつだ。
      ja: |-
        太陽の　光を　いっぱい　浴びると
        体の　葉っぱが　くるくる　回り　始める。
        キレイハナの　ダンスは　南国の　名物だ。
      ko: |-
        태양의 빛을 잔뜩 받으면
        몸의 잎사귀가 빙글빙글 돌기 시작한다.
        아르코의 춤은 남쪽 나라의 명물이다.
      en: |-
        When Bellossom gets exposed to plenty of sunlight, the leaves
        ringing its body begin to spin around. This Pokémon’s dancing
        is renowned in the southern lands.
      fr: |-
        Lorsque Joliflor reste exposé à la lumière du soleil, les feuilles
        autour de son corps se mettent à tournoyer. La danse de ce
        Pokémon est très célèbre dans les régions du sud.
      de: |-
        Wenn Blubella starkem Sonnenlicht ausgesetzt ist, beginnen
        sich die Blätter an seinem Körper zu drehen. Der Tanz dieses
        Pokémon ist in südlichen Ländern sehr bekannt.
      es: |-
        Cuando Bellossom se expone a gran cantidad de luz solar, le
        empiezan a girar las hojas que le rodean. La danza de este
        Pokémon es famosa en las zonas del sur.
      it: |-
        Quando Bellossom si espone al sole, le foglie che circondano
        il suo corpo iniziano a girare vorticosamente.
        La danza di questo Pokémon è nota nelle regioni meridionali.
    alpha-sapphire:
      ja-Hrkt: |-
        より　くさい　クサイハナから　しんかした　ほうが
        きれいな　はなを　つけた　キレイハナに　なるよ。
        よるに　なると　はなびらを　つぼめて　ねむる。
      ja: |-
        より　臭い　クサイハナから　進化した　ほうが
        きれいな　花を　つけた　キレイハナに　なるよ。
        夜に　なると　花びらを　つぼめて　眠る。
      ko: |-
        좀 더 악취를 풍기는 냄새꼬 쪽이
        진화하면 아름다운 꽃을 피운 아르코가 된다.
        밤이 되면 꽃잎을 오므리고 잔다.
      en: |-
        A Bellossom grows flowers more beautifully if it has evolved
        from a smelly Gloom—the more stinky the better. At night, this
        Pokémon closes its petals and goes to sleep.
      fr: |-
        Les fleurs de Joliflor sont encore plus jolies s’il s’agit
        d’une évolution d’un Ortide qui sentait vraiment très mauvais.
        La nuit, ce Pokémon ferme ses pétales pour dormir.
      de: |-
        Blubella wachsen schönere Blumen, wenn es sich aus
        einem übel riechenden Duflor entwickelt hat – je stinkender,
        desto besser. Nachts schließt dieses Pokémon seine Blätter
        und schläft.
      es: |-
        La belleza de las flores que le crecen a Bellossom depende
        de lo mal que oliera el Gloom a partir del cual evolucionó.
        A mayor hedor, mayor belleza. Por la noche, este Pokémon
        cierra los pétalos y se echa a dormir.
      it: |-
        I fiori di Bellossom sono tanto più belli quanto più forte
        è il puzzo del Gloom da cui si evolve!
        Quando la sera chiude i petali significa che se ne va a dormire.
    ultra-sun:
      de: |-
        In Alola erstrahlt Blubella in einer besonders
        herrlichen Blütenpracht. Sein Tanz ist hier
        besonders graziös.
    ultra-moon:
      de: |-
        Es ist bekannt für seine Tänze. Je wärmer die
        Sonnenstrahlen, die auf seine Blumen fallen,
        desto kräftiger und strahlender ihre Farben.
    sword:
      ja-Hrkt: |-
        なんごくに　おおく　せいそくする。
        おどるとき　はなびらが　ふれあい
        ここちよい　おとが　なりひびく。
      ja: |-
        南国に　多く　生息する。
        踊るとき　花びらが　触れあい
        心地よい　音が　鳴り響く。
      ko: |-
        남국에 널리 분포하여 서식하고 있다.
        춤출 때 꽃잎끼리 서로 부딪혀서
        기분 좋은 소리가 울려 퍼진다.
      zh-Hant: |-
        在南國大量生活著。
        跳舞時花瓣會互相碰觸，
        發出悅耳的聲音。
      zh-Hans: |-
        在南国大量生活着。
        跳舞时花瓣会互相碰触，
        发出悦耳的声音。
      en: |-
        Plentiful in the tropics. When it dances, its petals
        rub together and make a pleasant ringing sound.
      fr: |-
        Ce Pokémon vit en nombre dans les tropiques.
        Quand il danse, ses pétales frottent les uns
        contre les autres et émettent un son mélodieux.
      de: |-
        Es lebt in den Tropen. Beim Tanzen reiben seine
        Blüten aneinander und erzeugen ein wohliges
        Geräusch.
      es: |-
        Abunda en los trópicos. Al bailar, sus pétalos se
        rozan y emiten un agradable sonido.
      it: |-
        Molto comune ai tropici. Quando danza, i petali
        sfregano uno contro l’altro producendo un
        piacevole suono.
    shield:
      ja-Hrkt: |-
        ときおり　キレイハナが　あつまって
        おどるような　しぐさを　みせる。
        たいようをよぶ　ぎしき　といわれる。
      ja: |-
        ときおり　キレイハナが　集まって
        踊るような　しぐさを　みせる。
        太陽を呼ぶ　儀式と　言われる。
      ko: |-
        가끔 아르코가 모여서
        춤을 추는 듯한 동작을 한다.
        태양을 부르는 의식이라 전해진다.
      zh-Hant: |-
        有時美麗花們會聚在一起，
        做出像是跳舞的動作。
        據說這是呼喚太陽的儀式。
      zh-Hans: |-
        有时能看到美丽花聚在一起
        做着像是跳舞一样的动作。
        据说这是呼唤太阳的仪式。
      en: |-
        Bellossom gather at times and appear to dance.
        They say that the dance is a ritual to summon
        the sun.
      fr: |-
        Les Joliflor se réunissent parfois pour danser.
        On pense que c’est un rituel pour invoquer
        le soleil.
      de: |-
        Von Zeit zu Zeit kommen Blubella zusammen,
        um zu tanzen. Man sagt, ihr Tanz sei ein Ritual,
        um die Sonne herbeizurufen.
      es: |-
        Los Bellossom se reúnen en ocasiones para
        ejecutar una especie de danza, considerada
        un ritual para invocar al sol.
      it: |-
        A volte i Bellossom si riuniscono ed eseguono
        una specie di danza. Si dice che sia un rito
        per invocare il sole.
