bellossom:
  base_happiness: 50
  capture_rate: 45
  color: green
  egg_groups:
    - plant
  evolution_chain: oddish
  evolves_from: gloom
  flavor_text:
    gold:
      en: |-
        BELLOSSOM gather
        at times and
        appear to dance.They say that the
        dance is a ritual
        to summon the sun.
    silver:
      en: |-
        Plentiful in the
        tropics. When it
        dances, its petalsrub together and
        make a pleasant
        ringing sound.
    crystal:
      en: |-
        When these dance
        together, their
        petals rub againsteach other,
        making pretty,
        relaxing sounds.
    ruby:
      en: |-
        When BELLOSSOM gets exposed to plenty
        of sunlight, the leaves ringing its body
        begin to spin around.This POKéMON’s dancing is renowned in
        the southern lands.
    sapphire:
      en: |-
        A BELLOSSOM grows flowers more
        beautifully if it has evolved from a
        smelly GLOOM - the stinkier the better.At night, this POKéMON closes its
        petals and goes to sleep.
    emerald:
      en: |-
        Its flower petals deepen in color through
        exposure to sunlight. When cloudy weather
        persists, it does a dance that is thought
        to be a ritual for summoning the sun.
    firered:
      en: |-
        Plentiful in the tropics. When it dances,
        its petals rub together and make a
        pleasant ringing sound.
    leafgreen:
      en: |-
        BELLOSSOM gather at times and appear to
        dance. They say that the dance is a
        ritual to summon the sun.
    diamond:
      en: |-
        When the heavy rainfall season
        ends, it is drawn out by warm
        sunlight to dance in the open.
    pearl:
      en: |-
        When the heavy rainfall season
        ends, it is drawn out by warm
        sunlight to dance in the open.
    platinum:
      en: |-
        When the heavy rainfall season
        ends, it is drawn out by warm
