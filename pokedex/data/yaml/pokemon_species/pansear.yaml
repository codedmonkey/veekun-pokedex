  flavor_text:
    black:
      en: |-
        When it is angered, the temperature
        of its head tuft reaches 600° F.
        It uses its tuft to roast berries.
      fr: |-
        Quand il s’énerve, la mèche sur sa
        tête chauffe à 300 °C. Il s’en sert
        pour griller des Baies et les manger.
    white:
      en: |-
        This Pokémon lives in caves
        in volcanoes. The fire within the
        tuft on its head can reach 600° F.
      fr: |-
        Il vit dans les cratères des volcans.
        L’intérieur de la mèche qu’il a sur la
        tête peut atteindre 300 °C.
    black-2:
      en: |-
        Very intelligent, it roasts
        berries before eating them.
        It likes to help people.
    white-2:
      en: |-
        Very intelligent, it roasts
        berries before eating them.
        It likes to help people.
    x:
      ja-Hrkt: |-
        ちのうが　たかく　きのみは
        やいてから　たべる　しゅうせい。
        ひとの　てつだいを　このんでいる。
      ja: |-
        知能が　高く　木の実は
        焼いてから　食べる　習性。
        人の　手伝いを　好んでいる。
      ko: |-
        지능이 높고 나무열매는
        구운 뒤 먹는 습성이 있다.
        사람 도와주기를 좋아한다.
      en: |-
        Very intelligent, it roasts berries before eating them.
        It likes to help people.
      fr: |-
        Un Pokémon très intelligent qui adore cuire ses Baies
        avant de les manger. Il aime aussi aider les humains.
      de: |-
        Ein kultiviertes Pokémon, das Beeren vor dem
        Verzehr stets anbrät. Es bietet den Menschen
        gerne seine Hilfe an.
      es: |-
        Pokémon muy inteligente que tiene la costumbre de
        tostar las bayas antes de comérselas. Ayuda mucho
        a los humanos.
      it: |-
        È molto intelligente e ha l’abitudine di arrostire le
        bacche prima di mangiarle. Adora aiutare gli esseri
        umani.
    'y':
      ja-Hrkt: |-
