    soulsilver:
      en: |-
        Using its dorsal fin as a suction
        pad, it clings to a MANTINE’s
        underside to scavenge for leftovers.
    black:
      en: |-
        It forcefully squirts water. The
        water jet never misses prey even
        if the Remoraid is deep in the sea.
      fr: |-
        Son puissant jet d’eau ne manque
        jamais sa cible, même quand il est
        au fond de l’eau.
    white:
      en: |-
        It forcefully squirts water. The
        water jet never misses prey even
        if the Remoraid is deep in the sea.
      fr: |-
        Son puissant jet d’eau ne manque
        jamais sa cible, même quand il est
        au fond de l’eau.
    black-2:
      en: |-
        The water they shoot from their mouths
        can hit moving prey from more than
        300 feet away.
    white-2:
      en: |-
        The water they shoot from their mouths
        can hit moving prey from more than
        300 feet away.
    x:
      ja-Hrkt: |-
        ねらいは　せいかく。ふきだす　みずは
        １００メートルさきで　うごく
        えものに　かならず　めいちゅうする。
      ja: |-
        ねらいは　正確。噴き出す　水は
        １００メートル先で　動く　獲物に
        かならず　命中する。
      ko: |-
        조준이 정확하다. 뿜어낸 물은
        100m 앞에서 움직이는
        먹이를 반드시 명중시킨다.
      en: |-
        It has superb accuracy. The water it shoots out can
        strike moving prey from more than 300 feet away.
      fr: |-
        Il est très précis quand il crache ses jets d’eau.
        Il peut toucher une cible mouvante à 100 m.
      de: |-
        Es ist äußerst präzise. Es kann mit seinem
        Wasserschuss Beute erlegen, die 100 m entfernt ist.
      es: |-
        Tiene muy buena puntería. Dispara agua a sus presas,
        hasta si se están moviendo, a más de 100 metros.
      it: |-
        La sua precisione è straordinaria. Può colpire una
        preda in movimento anche a più di 100 m.
    'y':
      ja-Hrkt: |-
        きゅうばんの　ように　へんかした
        せびれで　マンタインに　くっつき
        たべのこしを　わけてもらっている。
      ja: |-
        吸盤の　ように　変化した
        背びれで　マンタインに　くっつき
        食べ残しを　分けてもらっている。
      ko: |-
        빨판처럼 변화한
        등지느러미로 만타인에게 달라붙어
        먹다 남은 것을 얻어먹고 있다.
      en: |-
        Using its dorsal fin as a suction pad, it clings to a
        Mantine’s underside to scavenge for leftovers.
      fr: |-
        Se servant de sa nageoire dorsale, il s’accroche sous
        un Démanta pour récupérer ses restes.
      de: |-
        Mit seiner Rückenflosse saugt es sich an der
        Unterseite eines Mantax fest und lebt von
        Speiseresten.
      es: |-
        Usando su aleta dorsal para succionar, se une a un
        Mantine para buscar restos de comida.
      it: |-
        Usando la pinna dorsale come una ventosa, s’attacca
        alla pancia di un Mantine cibandosi dei suoi avanzi.
    omega-ruby:
      ja-Hrkt: |-
        のんだ　みずを　ふっきんを　つかい　いきおいよく
        ふきだして　そらを　とぶ　えものを　しとめる。
        しんかが　ちかづくと　かわを　くだっていく。
      ja: |-
        飲んだ　水を　腹筋を　使い　勢いよく
        吹き出して　空を　飛ぶ　獲物を　仕留める。
        進化が　近づくと　川を　下っていく。
      ko: |-
        복근을 이용하여 마신 물을 힘차게
        뿜어내서 하늘을 나는 먹이를 잡는다.
        진화가 가까워지면 강을 따라 내려간다.
      en: |-
        Remoraid sucks in water, then expels it at high velocity using
        its abdominal muscles to shoot down flying prey. When
        evolution draws near, this Pokémon travels downstream
        from rivers.
      fr: |-
        Rémoraid aspire de l’eau, puis la recrache à forte pression
        grâce à ses muscles abdominaux pour attaquer les proies
        volantes. Quand son évolution approche, ce Pokémon
        descend le courant des rivières.
      de: |-
        Remoraid saugt Wasser ein und spritzt es unter Einsatz seiner
        Bauchmuskeln mit Hochdruck wieder heraus. So schießt es
        fliegende Beute ab. Wenn seine Entwicklung näher rückt,
        wandert dieses Pokémon flussabwärts.
      es: |-
        Remoraid traga agua y usa los abdominales para lanzarla a
        gran velocidad contra una presa que esté en el aire. Cuando
        está a punto de evolucionar, este Pokémon nada en los ríos
        corriente abajo.
      it: |-
        Remoraid assorbe acqua che espelle ad alta pressione
        usando la potenza degli addominali per abbattere le prede
        in volo. Quando si avvicina il momento evolutivo si sposta
        a valle seguendo il fiume.
    alpha-sapphire:
      ja-Hrkt: |-
        のんだ　みずを　ふっきんを　つかい　いきおいよく
        ふきだして　そらを　とぶ　えものを　しとめる。
        しんかが　ちかづくと　かわを　くだっていく。
      ja: |-
        飲んだ　水を　腹筋を　使い　勢いよく
        吹き出して　空を　飛ぶ　獲物を　仕留める。
        進化が　近づくと　川を　下っていく。
      ko: |-
        복근을 이용하여 마신 물을 힘차게
        뿜어내서 하늘을 나는 먹이를 잡는다.
        진화가 가까워지면 강을 따라 내려간다.
      en: |-
        Remoraid sucks in water, then expels it at high velocity using
        its abdominal muscles to shoot down flying prey. When
        evolution draws near, this Pokémon travels downstream
        from rivers.
      fr: |-
        Rémoraid aspire de l’eau, puis la recrache à forte pression
        grâce à ses muscles abdominaux pour attaquer les proies
        volantes. Quand son évolution approche, ce Pokémon
        descend le courant des rivières.
      de: |-
        Remoraid saugt Wasser ein und spritzt es unter Einsatz seiner
        Bauchmuskeln mit Hochdruck wieder heraus. So schießt es
        fliegende Beute ab. Wenn seine Entwicklung näher rückt,
        wandert dieses Pokémon flussabwärts.
      es: |-
        Remoraid traga agua y usa los abdominales para lanzarla a
        gran velocidad contra una presa que esté en el aire. Cuando
        está a punto de evolucionar, este Pokémon nada en los ríos
        corriente abajo.
      it: |-
        Remoraid assorbe acqua che espelle ad alta pressione
        usando la potenza degli addominali per abbattere le prede
        in volo. Quando si avvicina il momento evolutivo si sposta
        a valle seguendo il fiume.
    ultra-sun:
      ja-Hrkt: |-
        マンタインに　はりつき　おこぼれに
        あずかる。　マンタインが　おそわれると
        いっしょに　なって　たたかうぞ。
      ja: |-
        マンタインに　張りつき　おこぼれに
        あずかる。　マンタインが　襲われると
        一緒に　なって　戦うぞ。
      ko: |-
        만타인에 달라붙어 남긴 음식을
        먹고 산다. 만타인이 습격당하면
        함께 싸운다.
      zh-Hant: |-
        會貼在巨翅飛魚身上，靠吃剩的
        食物殘渣過活。當巨翅飛魚遭到
        襲擊時會挺身一起戰鬥。
      zh-Hans: |-
        会粘在巨翅飞鱼身上，
        吃一点残羹剩饭。如果巨翅飞鱼
        受到袭击，它就会与其一同战斗。
      en: |-
        This Pokémon clings to Mantine and shares in
        its prosperity. When its Mantine is attacked,
        Remoraid will fight alongside it!
      fr: |-
        Il se colle à un Démanta et se nourrit de
        ses restes. Si le Démanta se fait attaquer,
        il l’accompagne au combat.
      de: |-
        Es heftet sich an Mantax und ernährt sich von
        dessen Essensresten. Wird Mantax angegriffen,
        kämpft es gemeinsam mit ihm.
      es: |-
        Se adhiere a los Mantine para alimentarse de
        las sobras de su comida. Si atacan a su
        anfitrión, luchará junto a él.
      it: |-
        Si attacca a Mantine e si ciba dei suoi avanzi.
        Quando Mantine viene attaccato, lotta insieme
        a lui.
    ultra-moon:
      ja-Hrkt: |-
        べつめい　うみの　スナイパー。
        みずでっぽうは　１００メートルさきの
        えものにも　かならず　めいちゅうする。
      ja: |-
        別名　海の　スナイパー。
        みずでっぽうは　１００メートル先の
        獲物にも　必ず　命中する。
      ko: |-
        일명 바다의 스나이퍼다.
        물대포는 100m 앞의 먹이도
        반드시 명중시킨다.
      zh-Hant: |-
        又被稱做海洋狙擊手。
        就算是１００公尺外的獵物，
        牠發射的水槍也一定能夠命中。
      zh-Hans: |-
        它又被称为海洋狙击手。
        即便是１００米开外的猎物，
        它射出的水枪也一定能够命中。
      en: |-
        Also known as the “sniper of the seas,”
        its water gun can hit prey without fail from
        over 300 feet away.
      fr: |-
        Surnommé « le tireur d’élite de la mer », il est
        capable de toucher à coup sûr une cible située
        à 100 m de distance grâce à son Pistolet à O.
      de: |-
        Es wird auch „Scharfschütze des Meeres“
        genannt. Mit seinem Wasserstrahl kann es
        Beute aus 100 m Entfernung treffen.
      es: |-
        Es capaz de alcanzar una presa a cien metros
        con su Pistola Agua, lo que le ha valido el
        sobrenombre de Francotirador del Mar.
      it: |-
        Detto anche “il cecchino del mare”, ha una
        precisione straordinaria. Può colpire la preda
        a più di 100 m di distanza con Pistolacqua.
    sword:
      ja-Hrkt: |-
        くちから　ふきだす　すいりゅうは
        １００メートルさきで　うごく
        えものに　だって　めいちゅうする。
      ja: |-
        口から　噴き出す　水流は
        １００メートル先で　動く
        獲物に　だって　命中する。
      ko: |-
        입에서 뿜어내는 수류는
        100m 앞에서 움직이는
        사냥감조차 명중시킨다.
      zh-Hant: |-
        從嘴裡噴出的水
        連１００公尺外的
        活動獵物都能命中。
      zh-Hans: |-
        从嘴里喷出的水
        连１００米外的
        活动猎物都能命中。
      en: |-
        The water they shoot from their mouths can hit
        moving prey from more than 300 feet away.
      fr: |-
        Son puissant jet d’eau ne manque jamais sa cible,
        même à 100 m de distance.
      de: |-
        Selbst aus 100 m Entfernung treffen die
        Wassersalven, die es mit seinem Maul abfeuert,
        ihr Ziel.
      es: |-
        Los chorros de agua que escupe pueden alcanzar
        a presas en movimiento a una distancia de hasta
        100 m.
      it: |-
        I getti d’acqua che spara dalla bocca riescono
        a colpire una preda in movimento anche
        a 100 m di distanza.
    shield:
      ja-Hrkt: |-
        きゅうばんの　ように　へんかした
        せびれで　マンタインに　くっつき
        たべのこしを　わけてもらっている。
      ja: |-
        吸盤の　ように　変化した
        背びれで　マンタインに　くっつき
        食べ残しを　わけてもらっている。
      ko: |-
        빨판처럼 변화한 등지느러미로
        만타인에게 달라붙어
        먹다 남은 것을 얻어먹고 있다.
      zh-Hant: |-
        會用變成吸盤狀的背鰭
        吸附在巨翅飛魚身上，
        吃牠平常吃剩下的東西。
      zh-Hans: |-
        会用变成吸盘状的背鳍
        吸附在巨翅飞鱼身上，
        让它分一点吃剩的东西给自己吃。
      en: |-
        Using its dorsal fin as a suction pad, it clings to a
        Mantine’s underside to scavenge for leftovers.
      fr: |-
        À l’aide de sa nageoire dorsale en forme
        de ventouse, il s’accroche sous un Démanta
        pour récupérer ses restes.
      de: |-
        Mit seiner Rückenflosse saugt es sich an der
        Unterseite eines Mantax’ fest und lebt von
        dessen Speiseresten.
      es: |-
        Usa su aleta dorsal a modo de ventosa para
        aferrarse a un Mantine en busca de restos de
        comida.
      it: |-
        Usando la pinna dorsale come una ventosa,
        s’attacca alla pancia di Mantine cibandosi
        dei suoi avanzi.
    legends-arceus:
      en: |-
        Spits water from its mouth with incredible accuracy. It captures
        Burmy by shooting them down off the branches from which
        they dangle.
