  evolution_chain: cufant
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        ５トンの　にもつを　もっても
        へいきな　ちからもち　ポケモン。
        はなを　つかって　つちを　ほる。
      ja: |-
        ５トンの　荷物を　もっても
        平気な　力持ち　ポケモン。
        鼻を　使って　土を　掘る。
      ko: |-
        5톤의 짐을 실어도 문제없는
        힘이 장사인 포켓몬.
        코를 이용해서 땅을 판다.
      zh-Hant: |-
        能輕鬆舉起重達５噸的
        貨物的大力士寶可夢。
        會用鼻子挖地。
      zh-Hans: |-
        能轻松举起重达５吨的
        货物的大力士宝可梦。
        会用鼻子挖地。
      en: |-
        It digs up the ground with its trunk. It’s also very
        strong, being able to carry loads of over
        five tons without any problem at all.
      fr: |-
        Ce Pokémon est assez costaud pour porter
        des charges de cinq tonnes sans problème.
        Il utilise sa trompe pour creuser le sol.
      de: |-
        Dieses Pokémon verfügt über eine Stärke, mit der
        es problemlos fünf Tonnen stemmen kann. Es
        nutzt seinen Rüssel, um in der Erde zu graben.
      es: |-
        Su constitución fornida le permite transportar
        sin inmutarse cargas de 5 toneladas. Utiliza la
        trompa para excavar la tierra.
      it: |-
        È un Pokémon molto forte, capace di trasportare
        facilmente carichi di cinque tonnellate. Usa la
        proboscide per scavare la terra.
    shield:
      ja-Hrkt: |-
        ちからしごとなら　おまかせ。
        どうの　からだは　あめで　さび
        あざやかな　みどりに　かわる。
      ja: |-
        力仕事なら　お任せ。
        銅の　体は　雨で　錆び
        鮮やかな　緑に　変わる。
      ko: |-
        힘쓰는 일에 강하다.
        동으로 된 몸체는 비에 녹슬어
        선명한 녹색으로 변한다.
      zh-Hant: |-
        擅長需要力氣的工作。
        銅質的身體會因雨水而生鏽，
        轉變成鮮豔的綠色。
      zh-Hans: |-
        擅长需要力气的工作。
        铜质的身体会因雨水而生锈，
        转变成鲜艳的绿色。
      en: |-
        If a job requires serious strength, this Pokémon
        will excel at it. Its copper body tarnishes in the
        rain, turning a vibrant green color.
      fr: |-
        Les travaux physiques, c’est son affaire.
        Son corps de cuivre rouille sous la pluie
        et prend une vive couleur verte.
      de: |-
        Harte Knochenarbeit kann man problemlos ihm
        überlassen. Sein Körper aus Kupfer rostet im
        Regen und nimmt eine leuchtend grüne Farbe an.
      es: |-
        Realiza tareas que requieren de esfuerzo físico,
        es su fuerte. Con la lluvia, su cuerpo de cobre se
        oxida y adquiere una tonalidad verde intensa.
      it: |-
        I lavori pesanti sono il suo pane quotidiano.
        Il suo corpo di rame si ossida con la pioggia
        colorandosi di un verde intenso.
