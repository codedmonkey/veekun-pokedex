carracosta:
  base_happiness: 50
  capture_rate: 45
  color: blue
  egg_groups:
    - water1
    - water3
  evolution_chain: tirtouga
  evolves_from: tirtouga
  flavor_text:
    black:
      en: |-
        They can live both in the ocean and on
        land. A slap from one of them is enough
        to open a hole in the bottom of a tanker.
      fr: |-
        Il vit sur terre et en mer.
        Ses bras surpuissants peuvent percer
        des trous dans la coque des paquebots.
    white:
      en: |-
        Incredible jaw strength enables them
        to chew up steel beams and rocks
        along with their prey.
      fr: |-
        Ses mâchoires sont très puissantes.
        Il dévore sans distinction ses proies,
        l’acier et les rochers.
    black-2:
      en: |-
        It could knock out a foe with a slap from
        one of its developed front appendages
        and chew it up, shell or bones and all.
    white-2:
      en: |-
        It could knock out a foe with a slap from
        one of its developed front appendages
        and chew it up, shell or bones and all.
    x:
      ja-Hrkt: |-
        うみと　りくちで　せいかつする。
        はりてで　タンカーの　ふなぞこに
        あなを　あける　パワーの　もちぬし。
      ja: |-
        海と　陸地で　生活する。
        張り手で　タンカーの　船底に
        穴を　開ける　パワーの　持ち主。
      ko: |-
        바다와 육지에서 생활한다.
        손바닥으로 쳐서 배 밑바닥에
        구멍을 내는 파워의 소유자다.
      en: |-
        They can live both in the ocean and on land. A slap
        from one of them is enough to open a hole in the
        bottom of a tanker.
      fr: |-
        Il vit sur terre et en mer. Ses bras surpuissants
        peuvent percer des trous dans la coque des
        paquebots.
      de: |-
        Es lebt im Meer und an Land. Es ist so stark,
        dass es mit einem einzigen Hieb ein Loch in
        ein Schiff reißen kann.
      es: |-
        Vive en el mar y en la superficie. Sus garras pueden
        abrir un agujero en el fondo de un petrolero.
      it: |-
        Vive nel mare e sulla terraferma. Ha una forza tale
        da sfondare con un solo colpo il fondo di una nave
        cisterna.
    'y':
      ja-Hrkt: |-
        はったつした　まえあしで　あいてを
        ひっぱたき　きぜつさせると　カラや
        ホネまで　まるごと　かみくだいた。
      ja: |-
        発達した　前足で　相手を
        ひっぱたき　気絶させると　殻や
        ホネまで　まるごと　かみくだいた。
      ko: |-
        발달한 앞다리로 상대를
        세게 쳐서 기절시켜 껍데기나
        뼈까지 통째로 깨물어 부쉈다.
      en: |-
        It could knock out a foe with a slap from one of its
        developed front appendages and chew it up, shell
        or bones and all.
      fr: |-
        Ses bras puissants serrent ses proies jusqu’à
        l’évanouissement. Il les dévore ensuite, carapace et
        os compris.
      de: |-
        Ein Schlag mit seinen ausgeprägten Vorderflossen
        brachte Gegner zu Fall und brach ihre Knochen
        oder Schale.
      es: |-
        Un golpe con sus desarrolladas aletas delanteras
        puede hacer perder a un rival el conocimiento o
        romperle los huesos.
      it: |-
        Un singolo colpo dei suoi arti anteriori può bastare
        a far perdere i sensi alla preda e romperne ossa e
        corazza.
    omega-ruby:
      ja-Hrkt: |-
        うみと　りくちで　せいかつする。
        はりてで　タンカーの　ふなぞこに
        あなを　あける　パワーの　もちぬし。
      ja: |-
        海と　陸地で　生活する。
        張り手で　タンカーの　船底に
        穴を　開ける　パワーの　持ち主。
      ko: |-
        바다와 육지에서 생활한다.
        손바닥으로 쳐서 배 밑바닥에
        구멍을 내는 파워의 소유자다.
      en: |-
        They can live both in the ocean and on land. A slap
        from one of them is enough to open a hole in the
        bottom of a tanker.
      fr: |-
        Il vit sur terre et en mer. Ses bras surpuissants peuvent percer
        des trous dans la coque des paquebots.
      de: |-
        Es lebt im Meer und an Land. Es ist so stark, dass es mit
        einem einzigen Hieb ein Loch in ein Schiff reißen kann.
      es: |-
        Vive en el mar y en la superficie. Sus garras pueden abrir un
        agujero en el fondo de un petrolero.
      it: |-
        Vive nel mare e sulla terraferma. Ha una forza tale da sfondare
        con un solo colpo il fondo di una nave cisterna.
    alpha-sapphire:
      ja-Hrkt: |-
        はったつした　まえあしで　あいてを
        ひっぱたき　きぜつさせると　カラや
        ホネまで　まるごと　かみくだいた。
      ja: |-
        発達した　前足で　相手を
        ひっぱたき　気絶させると　殻や
        ホネまで　まるごと　かみくだいた。
      ko: |-
        발달한 앞다리로 상대를
        세게 쳐서 기절시켜 껍데기나
        뼈까지 통째로 깨물어 부쉈다.
      en: |-
        It could knock out a foe with a slap from one of its
        developed front appendages and chew it up, shell
        or bones and all.
      fr: |-
        Ses bras puissants serrent ses proies jusqu’à
        l’évanouissement. Il les dévore ensuite, carapace et
        os compris.
      de: |-
        Ein Schlag mit seinen ausgeprägten Vorderflossen brachte
        Gegner zu Fall und brach ihre Knochen oder Schale.
      es: |-
        Un golpe con sus desarrolladas aletas delanteras puede hacer
        perder a un rival el conocimiento o romperle los huesos.
      it: |-
        Un singolo colpo dei suoi arti anteriori può bastare a far
        perdere i sensi alla preda e romperne ossa e corazza.
    sun:
      ja-Hrkt: |-
        じょうぶな　こうらを　つくるため
        えものの　かたいカラや　ホネも
        まるごと　かみくだいて　くっていた。
      ja: |-
        丈夫な　甲羅を　つくるため
        獲物の　硬い殻や　骨も
        丸ごと　噛み砕いて　喰っていた。
      ko: |-
        단단한 등껍질을 만들기 위해
        먹이의 딱딱한 껍데기나 뼈도
        통째로 깨물어 먹었다.
      zh-Hant: |-
        為了形成結實的甲殼，
        會把獵物的硬殼和骨頭
        整個嚼碎後吃下去。
      zh-Hans: |-
        为了形成结实的甲壳，
        会把猎物的硬壳和骨头
        都整个嚼碎了吃下去。
      en: |-
        It constructed its sturdy shell by crunching and
        swallowing the hard shells or bones of its prey.
      fr: |-
        Pour se constituer une carapace solide, il devait
        réduire en miettes les os et coquilles riches en
        minéraux de ses proies avant de les avaler.
      de: |-
        Um seinen harten Panzer zu erlangen, fraß es
        seine Beute im Ganzen und zerkaute deren harte
        Schale und Knochen.
      es: |-
        Trituraba los huesos y las duras conchas de
        sus presas para aprovechar bien los nutrientes
        y reforzar así su propio caparazón.
      it: |-
        Per rafforzare il proprio carapace, mangiava le
        prede intere, frantumandone corazza e ossa.
    moon:
      ja-Hrkt: |-
        うみと　りくちの　りょうほうで
        かつどうする。　りくの　えものは
        うみに　ひきずりこんで　しとめる。
      ja: |-
        海と　陸地の　両方で
        活動する。　陸の　獲物は
        海に　引きずり込んで　仕留める。
      ko: |-
        바다와 육지 양쪽에서
        활동한다. 육지의 먹이는
        바다로 끌고 들어가 처리한다.
      zh-Hant: |-
        在大海和陸地兩個地方活動。
        會將陸地的獵物拖入海中後殺死。
      zh-Hans: |-
        在大海和陆地两个地方活动。
        将陆地的猎物拖入海中后杀死。
      en: |-
        Active both on land and in the sea, this
        Pokémon drags its land-based prey into the
        water to finish it off.
      fr: |-
        Aussi à l’aise sur terre que dans l’eau,
        ce Pokémon chasse ses proies à la surface
        puis les entraîne sous la mer pour les noyer.
      de: |-
        Es ist sowohl im Meer als auch an Land
        unterwegs. Landlebende Beute schleift
        es ins Meer und erlegt sie dort.
      es: |-
        Vive tanto en el mar como en la superficie.
        En tierra firme, caza a sus presas y las arrastra
        hacia el mar, donde les da el golpe de gracia.
      it: |-
        Questo Pokémon è a suo agio sia in mare che
        sulla terraferma. Cattura le prede a terra e
        le trascina in mare per finirle.
    ultra-sun:
      ja-Hrkt: |-
        アゴの　ちからが　すさまじい。
        オムスターや　オムナイトの　カラも
        きにせず　まるごと　くっていた。
      ja: |-
        アゴの　力が　凄まじい。
        オムスターや　オムナイトの　カラも
        気にせず　丸ごと　食っていた。
      ko: |-
        턱의 힘이 무시무시하다.
        암스타나 암나이트의 껍질도
        아무렇지 않게 통째로 먹었다.
      zh-Hant: |-
        下巴的力量非常驚人，
        連多刺菊石獸和菊石獸的殼
        也能輕而易舉地整個吃掉。
      zh-Hans: |-
        颚部的力量非常惊人。
        连多刺菊石兽和菊石兽的壳
        也能轻轻松松地整个吃掉。
      en: |-
        Its jaws are terrifyingly powerful. It could eat
        Omastar and Omanyte whole and not be
        bothered in the slightest by their shells.
      fr: |-
        L’incroyable puissance de sa mâchoire lui
        permettait de broyer facilement les coquilles
        d’Amonistar ou d’Amonita pour les manger.
      de: |-
        Sein Kiefer wurde wegen dessen großer Kraft
        gefürchtet. Sogar Amoroso und Amonitas konnte
        es trotz ihrer Schalen problemlos verschlingen.
      es: |-
        La brutal presión que ejerce con su mandíbula
        es tal que las conchas de Omastar y Omanyte
        no son ninguna molestia cuando los devora.
      it: |-
        Con le sue mascelle terribilmente potenti poteva
        frantumare le dure corazze degli Omastar e
        degli Omanyte per mangiarseli senza problemi.
    ultra-moon:
      ja-Hrkt: |-
        かたい　こうらを　さらに　じょうぶに
        するために　とらえた　えものは
        カラやホネまで　のこさず　くうのだ。
      ja: |-
        硬い　甲羅を　更に　丈夫に
        するために　捕らえた　獲物は
        カラやホネまで　残さず　食うのだ。
      ko: |-
        단단한 등껍질을 더욱 튼튼하게
        만들기 위해 잡은 먹이는
        껍질이나 뼈까지 남기지 않고 먹는다.
      zh-Hant: |-
        為了讓堅硬的甲殼變得
        更加結實，會把捉到的獵物
        吃到連殼和骨頭都不剩。
      zh-Hans: |-
        为了让坚硬的甲壳更为结实，
        会把捕捉到的猎物吃到
        连壳和骨头都不剩。
      en: |-
        Carracosta eats every last bit of the prey it
        catches, even the shells and bones, to further
        strengthen its sturdy shell.
      fr: |-
        Afin de renforcer sa carapace, ce Pokémon
        va même jusqu’à manger la coquille et les os
        de ses proies.
      de: |-
        Um seinen harten Panzer noch weiter zu
        verstärken, fraß es seine Beute samt Schale
        und Knochen restlos auf.
      es: |-
        Para reforzar aún más su robusto caparazón,
        engulle incluso las conchas y los huesos de las
        presas que captura.
      it: |-
        Per rafforzare il suo carapace mangiava le
        prede intere senza scartare nulla, nemmeno
        le ossa e i gusci.
    sword:
      ja-Hrkt: |-
        えものの　カラやホネも　のこさず
        きれいに　たいらげるので　こうらは
        ぶあつく　かたく　せいちょうする。
      ja: |-
        獲物の　殻や骨も　残さず
        きれいに　たいらげるので　甲羅は
        ぶ厚く　硬く　成長する。
      ko: |-
        먹이의 껍질과 뼈까지 남김없이
        깨끗하게 먹어 치워서 등껍질은
        두껍고 단단하게 성장한다.
      zh-Hant: |-
        由於會將獵物的硬殼和骨頭
        也都吃得乾乾淨淨一點不剩，
        所以牠的甲殼長得又厚又堅硬。
      zh-Hans: |-
        连猎物的壳和骨头也都会
        干干净净地吃得一丝不剩，
        所以甲壳成长得又厚又坚硬。
      en: |-
        Carracosta completely devours its prey—bones,
        shells, and all. Because of this, Carracosta’s own
        shell grows thick and sturdy.
      fr: |-
        Il dévore les os et la coquille de ses proies,
        ce qui épaissit et renforce sa propre carapace.
      de: |-
        Karippas verschlingt seine Beute mitsamt Schale
        und Knochen, wodurch sein Panzer besonders
        dick und widerstandsfähig wird.
      es: |-
        Devora incluso los huesos y caparazones de sus
        presas, por lo que el suyo propio se vuelve duro
        y grueso.
      it: |-
        Consuma le sue prede senza lasciare nemmeno
        ossa e gusci, favorendo così la formazione di
        un carapace duro e spesso.
    shield:
      ja-Hrkt: |-
        みずのなかと　くらべて　うごきは
        にぶいが　えものを　さがしもとめ
        りくじょうでも　かつどうするぞ。
      ja: |-
        水の中と　くらべて　動きは
        鈍いが　獲物を　探し求め
        陸上でも　活動するぞ。
      ko: |-
        물속과 비교하면 움직임이
        둔하지만 먹이를 찾아
        육지에서도 활동한다.
      zh-Hant: |-
        雖然和水中相比動作會變得
        比較遲緩，但為了尋找獵物
        牠還是會在陸地上活動。
      zh-Hans: |-
        虽然和在水中相比动作
        会变得迟缓，但是为了寻找
        猎物也会登上陆地活动。
      en: |-
        This Pokémon emerges from the water in search
        of prey despite the fact that it moves more
        slowly on land.
      fr: |-
        Bien qu’il soit moins à l’aise sur terre que dans
        l’eau, il s’aventure sur le rivage pour se nourrir.
      de: |-
        Obwohl es sich außerhalb des Wassers langsamer
        fortbewegt, kommt es an Land, um nach Beute
        zu suchen.
      es: |-
        Aunque se mueva con mayor lentitud sobre la
        superficie terrestre que en el agua, emerge a
        tierra en busca de presas.
      it: |-
        Quando va in cerca di prede sale anche sulla
        terraferma, nonostante i suoi movimenti siano
        più impacciati rispetto a quando è in acqua.
