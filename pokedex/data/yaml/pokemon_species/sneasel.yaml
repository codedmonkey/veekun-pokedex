    pearl:
      en: |-
        It is extremely vicious and will not
        stop attacking until its foe is
        incapable of moving.
    platinum:
      en: |-
        A smart and sneaky Pokémon. A pair
        may work together to steal eggs by
        having one lure the parents away.
    heartgold:
      en: |-
        Its paws conceal sharp claws. If
        attacked, it suddenly extends the
        claws and startles its enemy.
    soulsilver:
      en: |-
        Vicious in nature, it drives PIDGEY
        from their nests and scavenges any
        leftovers it can find.
    black:
      en: |-
        A smart and sneaky Pokémon. A pair
        may work together to steal eggs by
        having one lure the parents away.
      fr: |-
        Ce Pokémon rusé agit parfois en
        équipe pour voler des œufs, l’un
        d’entre eux faisant diversion.
    white:
      en: |-
        A smart and sneaky Pokémon. A pair
        may work together to steal eggs by
        having one lure the parents away.
      fr: |-
        Ce Pokémon rusé agit parfois en
        équipe pour voler des œufs, l’un
        d’entre eux faisant diversion.
    black-2:
      en: |-
        A smart and sneaky Pokémon,
        it makes its opponents flinch by suddenly
        showing the claws hidden in its paws.
    white-2:
      en: |-
        A smart and sneaky Pokémon,
        it makes its opponents flinch by suddenly
        showing the claws hidden in its paws.
    x:
      ja-Hrkt: |-
        すみかから　タマゴを　かすめとり
        たべてしまう。するどい　カギヅメが
        あいての　きゅうしょを　きりさく。
      ja: |-
        住処から　タマゴを　かすめ取り
        食べてしまう。鋭い　カギヅメが
        相手の　急所を　切り裂く。
      ko: |-
        거처에서 알을 가로채어 먹어
        버린다. 날카로운 갈고리 손톱이
        상대의 급소를 베어 가른다.
      en: |-
        It feeds on eggs stolen from nests. Its sharply
        hooked claws rip vulnerable spots on prey.
      fr: |-
        Il se nourrit d’œufs volés dans des nids. Ses griffes
        crochues percent les défenses de l’ennemi.
      de: |-
        Es ernährt sich von Eiern, die es aus Nestern stiehlt.
        Beute greift es mit seinen scharfen Krallen an.
      es: |-
        Se alimenta de huevos robados en nidos. Clava sus
        afiladas garras en los puntos débiles de sus rivales.
      it: |-
        Mangia uova rubate dai nidi. Attacca i nemici nei
        punti deboli con i suoi artigli uncinati.
    'y':
      ja-Hrkt: |-
        するどいツメを　ゆびの　なかに
        かくしている。いきなり　のばして
        おそってきた　あいてを　ひるませる。
      ja: |-
        鋭いツメを　指の　中に
        隠している。いきなり　伸ばして
        襲ってきた　相手を　ひるませる。
      ko: |-
        예리한 손톱을 손가락 안에
        감추고 있다. 갑자기 뻗어서
        습격해온 상대를 풀죽게 만든다.
      en: |-
        Its paws conceal sharp claws. If attacked,
        it suddenly extends the claws and startles
        its enemy.
      fr: |-
        Ses griffes sont cachées dans ses pattes. S’il est
        attaqué, il les sort pour frapper ses ennemis.
      de: |-
        In seinen Pfoten stecken scharfe Krallen. Es fährt sie
        blitzschnell aus, um die Gegner zu überraschen.
      es: |-
        Sus ocultas garras son muy afiladas. Si le atacan,
        extiende sus garras y asusta al enemigo.
      it: |-
        Le zampe nascondono artigli affilati. Se è attaccato,
        allunga gli artigli spaventando i nemici.
    omega-ruby:
      ja-Hrkt: |-
        てあしの　カギヅメを　つきたてて　きを　のぼる。
        おやの　いない　すきを　ねらって　きの　うえに
        ある　す　から　タマゴを　ぬすんで　たべる。
      ja: |-
        手足の　カギヅメを　突き立てて　木を　登る。
        親の　いない　すきを　ねらって　木の　上に
        ある　巣　から　タマゴを　盗んで　食べる。
      ko: |-
        손발의 갈고리 손발톱을 꽂아 나무를 오른다.
        부모가 없는 틈을 노려 나무 위에
        있는 둥지에서 알을 훔쳐 먹는다.
      en: |-
        Sneasel scales trees by punching its hooked claws into the
        bark. This Pokémon seeks out unguarded nests and steals
        eggs for food while the parents are away.
      fr: |-
        Farfuret grimpe aux arbres en enfonçant ses griffes crochues
        dans l’écorce. Ce Pokémon cherche les nids qui ne sont pas
        surveillés et vole les œufs pour les manger pendant que
        les parents sont partis.
      de: |-
        Sniebel klettert an Bäumen hoch, indem es seine
        hakenförmigen Krallen in die Rinde schlägt. Dieses
        Pokémon sucht nach unbewachten Nestern und
        stiehlt die Eier. Davon ernährt es sich.
      es: |-
        Sneasel trepa por los árboles agarrándose a la corteza con las
        garras curvas que tiene. Este Pokémon busca nidos
        desprovistos de vigilancia paterna para robar los huevos y
        comérselos.
      it: |-
        Sneasel si arrampica sugli alberi conficcando i suoi artigli
        uncinati nella corteccia. È sempre alla ricerca di nidi incustoditi
        per rubare le uova e cibarsene mentre i genitori sono assenti.
    alpha-sapphire:
      ja-Hrkt: |-
        てあしの　カギヅメを　つきたてて　きを　のぼる。
        おやの　いない　すきを　ねらって　きの　うえに
        ある　す　から　タマゴを　ぬすんで　たべる。
      ja: |-
        手足の　カギヅメを　突き立てて　木を　登る。
        親の　いない　すきを　ねらって　木の　上に
        ある　巣　から　タマゴを　盗んで　食べる。
      ko: |-
        손발의 갈고리 손발톱을 꽂아 나무를 오른다.
        부모가 없는 틈을 노려 나무 위에
        있는 둥지에서 알을 훔쳐 먹는다.
      en: |-
        Sneasel scales trees by punching its hooked claws into the
        bark. This Pokémon seeks out unguarded nests and steals
        eggs for food while the parents are away.
      fr: |-
        Farfuret grimpe aux arbres en enfonçant ses griffes crochues
        dans l’écorce. Ce Pokémon cherche les nids qui ne sont pas
        surveillés et vole les œufs pour les manger pendant que
        les parents sont partis.
      de: |-
        Sniebel klettert an Bäumen hoch, indem es seine
        hakenförmigen Krallen in die Rinde schlägt. Dieses
        Pokémon sucht nach unbewachten Nestern und
        stiehlt die Eier. Davon ernährt es sich.
      es: |-
        Sneasel trepa por los árboles agarrándose a la corteza con las
        garras curvas que tiene. Este Pokémon busca nidos
        desprovistos de vigilancia paterna para robar los huevos y
        comérselos.
      it: |-
        Sneasel si arrampica sugli alberi conficcando i suoi artigli
        uncinati nella corteccia. È sempre alla ricerca di nidi incustoditi
        per rubare le uova e cibarsene mentre i genitori sono assenti.
    sun:
      ja-Hrkt: |-
        ずるがしこく　どうもうな　せいしつ。
        おやが　いない　スキに　すあなに
        しんにゅう。　タマゴを　ぬすみだす。
      ja: |-
        ずる賢く　獰猛な　性質。
        親が　いない　スキに　巣穴に
        侵入。　タマゴを　盗みだす。
      ko: |-
        교활하고 사나운 성질을 가졌다.
        부모가 없는 틈에 둥지에
        침입해서 알을 훔쳐낸다.
      zh-Hant: |-
        性格狡猾且兇猛。
        會趁著雙親不在時
        侵入巢穴把蛋盜走。
      zh-Hans: |-
        狡黠凶恶的性格。
        趁着双亲不在就侵入巢穴，
        将蛋盗出。
      en: |-
        It has a cunning yet savage disposition.
        It waits for parents to leave their nests,
        and then it sneaks in to steal their eggs.
      fr: |-
        Un Pokémon aussi roublard que fourbe.
        Il se glisse dans le nid des autres Pokémon
        en leur absence pour leur dérober leurs œufs.
      de: |-
        Dieses Pokémon hat ein durchtriebenes,
        grausames Wesen. Es sucht nach unbewachten
        Nestern und stiehlt die Eier.
      es: |-
        Es un Pokémon de naturaleza astuta y fiera.
        Se cuela en los nidos de otros Pokémon cuando
        no están y roba sus huevos.
      it: |-
        È furbo e subdolo. Si intrufola nei nidi
        incustoditi per rubare le uova mentre i genitori
        sono assenti.
    moon:
      ja-Hrkt: |-
        ツメで　タマゴに　あなを　あけて
        なかみを　すする。　ブリーダーに
        にくまれ　くじょ　されることもある。
      ja: |-
        ツメで　タマゴに　穴を　開けて
        中味を　すする。　ブリーダーに
        憎まれ　駆除　されることもある。
      ko: |-
        손톱으로 알에 구멍을 뚫어서
        내용물을 마신다. 브리더에게
        미움을 받아 제거될 때도 있다.
      zh-Hant: |-
        用爪子在蛋上開個孔，
        吸食中間的美味。
        有時會被培育家憎惡而遭到驅逐。
      zh-Hans: |-
        用爪子在蛋上开个孔，
        吸食里面的美味。
        也会被培育家憎恶而遭到驱逐。
      en: |-
        It uses its claws to poke holes in eggs so it can
        slurp out the insides. Breeders consider it a
        scourge and will drive it away or eradicate it.
      fr: |-
        Avec ses griffes, il perce un trou dans les œufs
        qu’il trouve pour en sucer le contenu. Bête noire
        des Éleveurs qui le traquent parfois.
      de: |-
        Es rammt seine Krallen in Eier und schlürft
        ihren Inhalt aus. Pokémon-Züchter können es
        aus diesem Grund nicht ausstehen.
      es: |-
        Abre un pequeño agujero en los huevos con sus
        garras y sorbe el interior. Los Criapokémon lo
        detestan e intentan tomar medidas contra él.
      it: |-
        Buca le uova con gli artigli per succhiarne
        il contenuto. Gli Allevapokémon lo considerano
        un flagello e cercano di tenerlo alla larga.
    ultra-sun:
      ja-Hrkt: |-
        チームプレイで　とりポケモンの
        すあなから　タマゴを　ぬすみだすが
        だれが　くうかで　ケンカになるのだ。
      ja: |-
        チームプレイで　とりポケモンの
        巣穴から　タマゴを　盗み出すが
        誰が　食うかで　ケンカになるのだ。
      ko: |-
        팀플레이로 새포켓몬의
        둥지에서 알을 훔쳐 내지만,
        누가 먹을까로 싸움이 난다.
      zh-Hant: |-
        靠著團隊合作從鳥寶可夢的
        巢穴中把蛋偷出來之後，
        卻會為了由誰來吃而爭吵。
      zh-Hans: |-
        依靠团队合作从鸟宝可梦的
        巢穴里将蛋偷出来后，
        却会为了由谁来吃而争吵不休。
      en: |-
        They will cooperate to steal eggs from the nests
        of bird Pokémon, but fights break out to
        determine which one gets to eat the eggs.
      fr: |-
        Il fait équipe avec ses congénères pour voler
        les œufs des Pokémon oiseaux, mais ils se font
        la guerre pour décider de qui les mangera.
      de: |-
        Sie bilden ein Team, um gemeinsam Eier aus den
        Nestern von Vogel-Pokémon zu klauen. Dann
        streiten sie sich darüber, wer sie fressen darf.
      es: |-
        Colabora con los suyos para saquear nidos de
        Pokémon pájaro, aunque luego se disputan
        fieramente quién se come los huevos.
      it: |-
        Questi Pokémon agiscono in squadra per rubare
        le Uova dai nidi dei Pokémon alati, ma poi
        litigano per stabilire chi le mangerà.
    ultra-moon:
      ja-Hrkt: |-
        やみよに　まぎれ　えものを　ねらう。
        サンドを　ねらい　ツメを　たてるが
        ひふが　かたく　おれてしまうことも。
      ja: |-
        闇夜に　まぎれ　獲物を　狙う。
        サンドを　狙い　ツメを　たてるが
        皮膚が　硬く　折れてしまうことも。
      ko: |-
        어둠 속에 숨어 먹이를 노린다.
        모래두지를 노리고 손톱을 세우지만
        피부가 단단해서 부러지는 경우도 있다.
      zh-Hant: |-
        會趁著黑夜襲擊獵物。
        遇上穿山鼠時會伸出爪子來獵捕，
        但對方堅硬的皮膚有時會讓爪子折斷。
      zh-Hans: |-
        会趁着夜色袭击猎物。
        伸出爪子袭击穿山鼠时，有时会因
        对方坚硬的皮肤而导致爪子折断。
      en: |-
        It blends into the dark of night to ambush its
        prey. Sneasel will attack Sandshrew, but its
        hard skin can cause Sneasel’s claws to snap off.
      fr: |-
        Ce chasseur nocturne profite de l’obscurité
        pour s’attaquer aux Sabelette, mais il se casse
        parfois les griffes sur leur peau très dure.
      de: |-
        Es lauert seiner Beute im Dunkeln auf. Wenn es
        Sandan mit seinen Krallen angreift, brechen
        diese manchmal an dessen robuster Haut ab.
      es: |-
        Acecha a sus presas en la oscuridad nocturna.
        En ocasiones, ataca a algún Sandshrew y acaba
        partiéndose las garras contra su dura piel.
      it: |-
        Si nasconde nell’oscurità puntando la preda.
        Quando attacca i Sandshrew, che hanno la pelle
        molto dura, a volte i suoi artigli si spezzano.
    sword:
      ja-Hrkt: |-
        するどいツメを　ゆびの　なかに
        かくしている。　いきなり　のばして
        おそってきた　あいてを　ひるませる。
      ja: |-
        鋭いツメを　指の　中に
        隠している。　いきなり　伸ばして
        襲ってきた　相手を　ひるませる。
      ko: |-
        예리한 손톱을 손가락 안에
        감추고 있다. 갑자기 뻗어서
        습격해온 상대를 풀죽게 만든다.
      zh-Hant: |-
        手指中藏有鋒利的爪子。
        會突然伸出利爪，
        讓襲擊自己的對手心生怯意。
      zh-Hans: |-
        手指中藏有锋利的爪子。
        会突然伸出那利爪，
        让袭击过来的对手心生怯意。
      en: |-
        Its paws conceal sharp claws. If attacked, it
        suddenly extends the claws and startles
        its enemy.
      fr: |-
        Ses griffes acérées sont cachées dans ses doigts.
        S’il se fait attaquer, il les sort pour effrayer
        son agresseur.
      de: |-
        In seinen Pfoten stecken scharfe Krallen. Es fährt
        sie blitzschnell aus, um Gegner zu überraschen.
      es: |-
        Sus patas ocultan garras sumamente afiladas,
        que extiende de repente para intimidar al
        enemigo en caso de amenaza.
      it: |-
        Intimidisce l’avversario sfoderando all’improvviso
        gli affilati artigli nascosti nelle sue zampe.
    shield:
      ja-Hrkt: |-
        ずるがしこく　どうもうな　せいしつ。
        おやが　いない　スキに　すあなに
        しんにゅう。　タマゴを　ぬすみだす。
      ja: |-
        ずる賢く　獰猛な　性質。
        親が　いない　隙に　巣穴に
        侵入。　タマゴを　盗みだす。
      ko: |-
        교활하고 사나운 성질을 가졌다.
        부모가 없는 틈에
        둥지로 침입해서 알을 훔친다.
      zh-Hant: |-
        性格狡猾且凶猛。
        會趁著雙親不在時
        侵入巢穴把蛋盜走。
      zh-Hans: |-
        狡黠凶恶的性格。
        趁着双亲不在就侵入巢穴，
        将蛋盗出。
      en: |-
        It has a cunning yet savage disposition.
        It waits for parents to leave their nests,
        and then it sneaks in to steal their eggs.
      fr: |-
        Un Pokémon aussi cruel que fourbe.
        Il se glisse dans le nid des autres Pokémon
        en leur absence pour dérober leurs Œufs.
      de: |-
        Dieses durchtriebene und gewissenlose Pokémon
        beobachtet Nester, bis die Eltern ausgeflogen
        sind, und stiehlt dann deren Eier.
      es: |-
        Es un Pokémon de naturaleza astuta y fiera. Se
        cuela en los nidos de otros Pokémon cuando no
        están y roba sus huevos.
      it: |-
        È furbo e feroce. Si intrufola nei nidi incustoditi
        per rubare le Uova mentre i genitori sono assenti.
    legends-arceus:
      en: |-
        Its sturdy, curved claws are ideal for traversing precipitous cliffs.
        From the tips of these claws drips a venom that infiltrates the
        nerves of any prey caught in Sneasel's grasp.
