        egg from breaking. However,
        it is extremely fast at running away.
    soulsilver:
      en: |-
        Being few in number and difficult to
        capture, it is said to bring happiness
        to the Trainer who catches it.
    black:
      en: |-
        A kindly Pokémon that lays highly
        nutritious eggs and shares them
        with injured Pokémon or people.
      fr: |-
        Ce Pokémon très serviable distribue
        ses œufs hautement nutritifs aux
        humains et Pokémon blessés.
    white:
      en: |-
        A kindly Pokémon that lays highly
        nutritious eggs and shares them
        with injured Pokémon or people.
      fr: |-
        Ce Pokémon très serviable distribue
        ses œufs hautement nutritifs aux
        humains et Pokémon blessés.
    black-2:
      en: |-
        A kindly Pokémon that lays highly
        nutritious eggs and shares them
        with injured Pokémon or people.
    white-2:
      en: |-
        A kindly Pokémon that lays highly
        nutritious eggs and shares them
        with injured Pokémon or people.
    x:
      ja-Hrkt: |-
        しあわせを　はこぶと　いわれている。
        きずついた　ひとに　タマゴを
        わけてあげる　やさしい　ポケモン。
      ja: |-
        幸せを　運ぶと　いわれている。
        傷ついた　人に　タマゴを
        分けてあげる　優しい　ポケモン。
      ko: |-
        행복을 가져다준다고 전해진다.
        상처 입은 사람에게 알을
        나눠주는 상냥한 포켓몬이다.
      en: |-
        It is said to deliver happiness.
        Being compassionate, it shares its eggs
        with injured people.
      fr: |-
        Il est censé apporter la joie. Ce Pokémon charitable
        offre ses œufs aux blessés.
      de: |-
        Man sagt, es bringe Glück. Es ist sehr mitfühlend
        und teilt seine Eier mit Verletzten.
      es: |-
        Se dice que reparte felicidad. Se caracteriza por su
        compasión y reparte sus huevos entre la gente herida.
      it: |-
        Si dice che porti felicità. È molto altruista e condivide
        le uova con chi è ferito.
    'y':
      ja-Hrkt: |-
        １にちに　いくつか　たまごを　うむ。
        その　たまごは　えいよう　まんてんで
        ものすごく　おいしい　らしい。
      ja: |-
        １日に　いくつか　タマゴを　産む。
        その　タマゴは　栄養満点で
        ものすごく　おいしいらしい。
      ko: |-
        하루에 몇 개의 알을 낳는다.
        그 알은 영양 만점으로
        굉장히 맛있다고 한다.
      en: |-
        It lays several eggs a day. The eggs are apparently
        rich in nutrients and extremely delicious.
      fr: |-
        Il peut pondre plusieurs œufs par jour. Ses œufs sont
        très riches en nutriments et vraiment délicieux.
      de: |-
        Es legt mehrere Eier am Tag. Sie sind sehr nahrhaft
        und außerordentlich schmackhaft.
      es: |-
        Pone varios huevos al día. Según parece son muy
        nutritivos y están riquísimos.
      it: |-
        Ogni giorno depone diverse uova, che sembrano
        essere deliziose e molto nutrienti.
    omega-ruby:
      ja-Hrkt: |-
        えいよう　まんてんの　タマゴを　まいにち　うむ。
        しょくよくを　なくした　ひとでも　ペロリと
        たべてしまうほど　おいしい　タマゴだ。
      ja: |-
        栄養　満点の　タマゴを　毎日　産む。
        食欲を　無くした　人でも　ペロリと
        食べてしまうほど　美味しい　タマゴだ。
      ko: |-
        영양 만점인 알을 매일 낳는다.
        식욕을 잃은 사람도 한 번에
        먹어치울 정도로 맛있는 알이다.
      en: |-
        Chansey lays nutritionally excellent eggs on an everyday basis.
        The eggs are so delicious, they are easily and eagerly
        devoured by even those people who have lost their appetite.
      fr: |-
        Leveinard pond tous les jours des œufs pleins de vitamines.
        Ces œufs sont tellement bons que les gens les mangent
        même quand ils n’ont pas faim.
      de: |-
        Chaneira legt täglich ausgesprochen nahrhafte Eier.
        Sie sind so köstlich, dass sie sogar von Menschen
        verspeist werden, die gar keinen Appetit haben.
      es: |-
        Chansey pone a diario huevos con un valor nutritivo altísimo.
        Están tan ricos que hasta quien no tenga hambre se los
        comerá en un abrir y cerrar de ojos.
      it: |-
        Ogni giorno Chansey depone uova molto nutrienti.
        Queste uova sono così buone da far tornare l’appetito
        a chi lo ha perso.
    alpha-sapphire:
      ja-Hrkt: |-
        えいよう　まんてんの　タマゴを　まいにち　うむ。
        しょくよくを　なくした　ひとでも　ペロリと
        たべてしまうほど　おいしい　タマゴだ。
      ja: |-
        栄養　満点の　タマゴを　毎日　産む。
        食欲を　無くした　人でも　ペロリと
        食べてしまうほど　美味しい　タマゴだ。
      ko: |-
        영양 만점인 알을 매일 낳는다.
        식욕을 잃은 사람도 한 번에
        먹어치울 정도로 맛있는 알이다.
      en: |-
        Chansey lays nutritionally excellent eggs on an everyday basis.
        The eggs are so delicious, they are easily and eagerly
        devoured by even those people who have lost their appetite.
      fr: |-
        Leveinard pond tous les jours des œufs pleins de vitamines.
        Ces œufs sont tellement bons que les gens les mangent
        même quand ils n’ont pas faim.
      de: |-
        Chaneira legt täglich ausgesprochen nahrhafte Eier.
        Sie sind so köstlich, dass sie sogar von Menschen
        verspeist werden, die gar keinen Appetit haben.
      es: |-
        Chansey pone a diario huevos con un valor nutritivo altísimo.
        Están tan ricos que hasta quien no tenga hambre se los
        comerá en un abrir y cerrar de ojos.
      it: |-
        Ogni giorno Chansey depone uova molto nutrienti.
        Queste uova sono così buone da far tornare l’appetito
        a chi lo ha perso.
    sun:
      ja-Hrkt: |-
        ラッキーの　うむ　タマゴは　えいようが
        たっぷり　つまっている。　おおくの
        ポケモンが　だいこうぶつだ。
      ja: |-
        ラッキーの　産む　タマゴは　栄養が
        たっぷり　つまっている。　多くの
        ポケモンが　大好物だ。
      ko: |-
        럭키가 낳는 알은 영양이
        듬뿍 들어있다. 많은
        포켓몬들이 아주 좋아한다.
      zh-Hant: |-
        吉利蛋生下的蛋飽含豐富的營養。
        是許多寶可夢非常愛吃的東西。
      zh-Hans: |-
        吉利蛋生下的蛋饱含丰富的营养。
        是许多宝可梦非常爱吃的东西。
      en: |-
        The eggs laid by Chansey are rich in nutrients
        and a favorite food of many Pokémon.
      fr: |-
        Les œufs pondus par Leveinard sont
        extrêmement nutritifs. C’est la nourriture
        favorite de beaucoup de Pokémon.
      de: |-
        Die Eier, die es legt, sind ausgesprochen
        nahrhaft. Sie sind die Leibspeise vieler
        Pokémon.
      es: |-
        Los huevos que pone Chansey tienen un valor
        nutritivo altísimo. Muchos Pokémon los
        consideran un manjar.
      it: |-
        Le uova di Chansey sono molto nutrienti
        e molti Pokémon ne vanno ghiotti.
    moon:
      ja-Hrkt: |-
        かずが　すくないうえに　にげあしの
        はやい　ポケモンなので
        みつけた　ひとは　うんが　いいぞ。
      ja: |-
        数が　少ないうえに　逃げ足の
        速い　ポケモンなので
        見つけた　人は　運が　いいぞ。
      ko: |-
        수가 적은 데다가 도주도
        빠른 포켓몬이라
        발견한 사람은 운이 좋은 것이다.
      zh-Hant: |-
        因為是數量稀少
        而且逃跑很快的寶可夢，
        所以能找到牠的人運氣相當不錯。
      zh-Hans: |-
        因为是数量稀少
        而且逃跑很快的宝可梦，
        所以能找到它的人运气相当不错。
      en: |-
        Not only are these Pokémon fast runners,
        they’re also few in number, so anyone who finds
        one must be lucky indeed.
      fr: |-
        C’est un Pokémon assez rare et qui prend la
        fuite très rapidement. Apercevoir ce Pokémon
        est un signe que la chance vous sourit.
      de: |-
        Es ist äußerst selten und kann zudem sehr
        schnell davonlaufen. Schafft man es trotzdem,
        eins zu fangen, bringt es angeblich Glück.
      es: |-
        Es un Pokémon poco común que escapa
        rápidamente, por lo que quienes se topen con
        uno pueden considerarse afortunados.
      it: |-
        Esistono pochi esemplari di questo Pokémon,
        che inoltre è anche velocissimo nella fuga.
        Solo chi ha la fortuna dalla sua riesce a trovarlo!
    ultra-sun:
      ja-Hrkt: |-
        おいしく　えいようもある　タマゴを
        ほかのポケモンに　ねらわれるうちに
        にげあしが　はやくなったらしい。
      ja: |-
        おいしく　栄養もある　タマゴを
        他のポケモンに　狙われるうちに
        逃げ足が　速くなったらしい。
      ko: |-
        맛있고 영양 많은 알을
        다른 포켓몬들이 자꾸 노려서
        도망치는 속도가 빨라진 듯하다.
      zh-Hant: |-
        因為其他寶可夢盯上了牠
        營養又美味的蛋，牠的腳程
        似乎在逃跑的過程中變快了。
      zh-Hans: |-
        其他宝可梦盯上了它那既美味
        又营养的蛋，在这追逐的过程中，
        它逃跑的速度好像变快了。
      en: |-
        It seems that other Pokémon’s efforts to take
        its delicious, nutritious egg away from it caused
        Chansey to get faster at fleeing.
      fr: |-
        À force de fuir les Pokémon qui en avaient après
        ses œufs, réputés pour leur goût et leur valeur
        nutritive, il a appris à courir plus vite.
      de: |-
        Es hat gelernt, rasch davonzulaufen, da es viele
        Pokémon auf die nahrhaften und köstlichen Eier
        abgesehen haben, die es legt.
      es: |-
        Ha desarrollado gran velocidad para huir de los
        Pokémon que quieren robarle sus huevos, que
        son exquisitos y poseen un gran valor nutritivo.
      it: |-
        Molti Pokémon cercano di rubare le sue uova
        gustose e nutrienti. Probabilmente per questo
        è diventato velocissimo nella fuga.
    ultra-moon:
      ja-Hrkt: |-
        おなかの　タマゴを　ねらい
        らんかく　されてきた　れきしから
        せいそくすうは　とても　すくない。
      ja: |-
        お腹の　タマゴを　狙い
        乱獲　されてきた　歴史から
        生息数は　とても　少ない。
      ko: |-
        배에 있는 알을 노리고
        마구잡이로 잡힌 역사에서
        개체 수는 매우 적다.
      zh-Hant: |-
        由於曾有過以奪取牠腹部的蛋
        為目的而加以濫捕的歷史，
        所以牠的數量非常稀少。
      zh-Hans: |-
        经历了一段以夺取它腹部的
        蛋为目标的滥捕历史后，
        它的数量已经变得非常稀少。
      en: |-
        Because the eggs on their bellies have been
        overharvested by people in the past, the
        Chansey population remains very small.
      fr: |-
        Pendant longtemps, ce Pokémon a été chassé
        à outrance pour ses œufs, ce qui explique
        sa population fort réduite.
      de: |-
        Einst wurde es exzessiv von Wilddieben gejagt,
        die es auf das Ei in seinem Beutel abgesehen
        hatten. Mittlerweile ist es daher sehr selten.
      es: |-
        Su número ha disminuido espectacularmente
        debido al constante hurto del que son objeto
        sus huevos.
      it: |-
        In passato è stato vittima di una caccia sfrenata
        per le sue uova. Per questo motivo non sono
        rimasti molti esemplari di questo Pokémon.
    lets-go-pikachu:
      ja-Hrkt: |-
        きずついた　ものを　みかけると
        えいようまんてんの　タマゴを
        わけあたえる　やさしい　ポケモン。
      ja: |-
        傷ついた　ものを　見かけると
        栄養満点の　タマゴを
        分け与える　優しい　ポケモン。
      ko: |-
        상처 입은 자를 발견하면
        영양 만점인 알을
        나눠주는 상냥한 포켓몬.
      zh-Hant: |-
        性情溫和善良的寶可夢。
        只要看到有誰受傷了，
        就會把營養豐富的蛋分給對方。
      zh-Hans: |-
        性格温柔的宝可梦，当它
        看到受伤的宝可梦时，会把
        营养丰富的蛋分给对方。
      en: |-
        A gentle and kindhearted Pokémon that shares
        its nutritious eggs if it sees an injured Pokémon.
      fr: |-
        D’un naturel gentil et aimable, il partage
        ses œufs nourrissants avec les blessés.
      de: |-
        Chaneira ist sehr warmherzig und freundlich. Es
        kümmert sich liebevoll um verletzte Lebewesen,
        indem es seine nahrhaften Eier mit ihnen teilt.
      es: |-
        Este amable Pokémon comparte sus nutritivos
        huevos con quien encuentre herido.
      it: |-
        Un Pokémon gentile e generoso, sempre pronto
        a condividere le sue uova nutrienti con chi si
        trova in difficoltà.
    lets-go-eevee:
      ja-Hrkt: |-
        きずついた　ものを　みかけると
        えいようまんてんの　タマゴを
        わけあたえる　やさしい　ポケモン。
      ja: |-
        傷ついた　ものを　見かけると
        栄養満点の　タマゴを
        分け与える　優しい　ポケモン。
      ko: |-
        상처 입은 자를 발견하면
        영양 만점인 알을
        나눠주는 상냥한 포켓몬.
      zh-Hant: |-
        性情溫和善良的寶可夢。
        只要看到有誰受傷了，
        就會把營養豐富的蛋分給對方。
      zh-Hans: |-
        性格温柔的宝可梦，当它
        看到受伤的宝可梦时，会把
        营养丰富的蛋分给对方。
      en: |-
        A gentle and kindhearted Pokémon that shares
        its nutritious eggs if it sees an injured Pokémon.
      fr: |-
        D’un naturel gentil et aimable, il partage
        ses œufs nourrissants avec les blessés.
      de: |-
        Chaneira ist sehr warmherzig und freundlich. Es
        kümmert sich liebevoll um verletzte Lebewesen,
        indem es seine nahrhaften Eier mit ihnen teilt.
      es: |-
        Este amable Pokémon comparte sus nutritivos
        huevos con quien encuentre herido.
      it: |-
        Un Pokémon gentile e generoso, sempre pronto
        a condividere le sue uova nutrienti con chi si
        trova in difficoltà.
    sword:
      ja-Hrkt: |-
        タマゴは　えいようまんてんで
        あじも　ばつぐん。　こうきゅうな
        しょくざいとして　あつかわれる。
      ja: |-
        タマゴは　栄養満点で　味も　抜群。
        高級な　食材として　扱われる。
      ko: |-
        알은 영양 만점에
        맛도 뛰어나다.
        고급 식재료로 취급된다.
      zh-Hant: |-
        牠的蛋不僅營養豐富，
        而且非常美味。因此
        被視為是高級的食材。
      zh-Hans: |-
        蛋不仅营养满分，
        还十分美味。
        被当做高级食材使用。
      en: |-
        The egg Chansey carries is not only delicious
        but also packed with nutrition. It’s used as a
        high-class cooking ingredient.
      fr: |-
        Ses œufs sont si délicieux et nutritifs qu’on
        les considère comme des ingrédients de luxe.
      de: |-
        Seine Eier sind äußerst nahrhaft und schmecken
        köstlich, weshalb sie als erlesene Kochzutat
        gelten.
      es: |-
        Los huevos que pone Chansey tienen un valor
        nutritivo altísimo y un sabor exquisito.
        Se consideran un manjar.
      it: |-
        Il suo uovo è molto nutriente ed estremamente
        saporito, tanto che viene considerato un
        ingrediente di lusso.
    shield:
      ja-Hrkt: |-
        もともとは　うごきが　にぶかった。
        タマゴを　ねらうものから　まもるため
        にげあしが　はやくなった。
      ja: |-
        もともとは　動きが　鈍かった。
        タマゴを　狙うものから　守るため
        逃げ足が　速くなった。
      ko: |-
        원래 움직임이 둔했지만
        알을 노리는 자들로부터
        지켜내기 위해 도주 속도가 빨라졌다.
      zh-Hant: |-
        原本動作遲緩。但為了從
        盯上蛋的傢伙們手裡保護蛋，
        逃跑的速度就變快了。
      zh-Hans: |-
        原本动作迟缓。
        为了保护蛋不被抢走，
        逃跑的速度才变快了。
      en: |-
        This species was once very slow. To protect their
        eggs from other creatures, these Pokémon
        became able to flee quickly.
      fr: |-
        Ce Pokémon lent à l’origine a appris à fuir
        plus vite pour protéger ses œufs des voleurs.
      de: |-
        Dieses ursprünglich eher träge Pokémon hat
        gelernt, schnell davonzulaufen, um seine Eier vor
        Räubern schützen zu können.
      es: |-
        Este Pokémon solía ser lento de reflejos, pero
        ha desarrollado una gran velocidad para evitar
        que le roben sus preciados huevos.
      it: |-
        Sarebbe lento per natura, ma è diventato svelto
        nella fuga per difendersi da chi vuole rubare
        il suo uovo.
    legends-arceus:
      en: 'This purehearted Pokémon shares its eggs with the injured.'
