cofagrigus:
  base_happiness: 50
  capture_rate: 90
  color: yellow
  egg_groups:
    - mineral
    - indeterminate
  evolution_chain: yamask
  evolves_from: yamask
  flavor_text:
    black:
      en: |-
        It has been said that they swallow those
        who get too close and turn them into
        mummies. They like to eat gold nuggets.
      fr: |-
        Il paraît qu’il avale les gens
        et les transforme en momies.
        Il adore manger des lingots d’or.
    white:
      en: |-
        They pretend to be elaborate coffins
        to teach lessons to grave robbers.
        Their bodies are covered in pure gold.
      fr: |-
        Il prend l’apparence d’un beau cercueil
        pour punir les pilleurs de tombes.
        Son corps est recouvert d’or pur.
    black-2:
      en: |-
        Grave robbers who mistake them
        for real coffins and get too close
        end up trapped inside their bodies.
    white-2:
      en: |-
        Grave robbers who mistake them
        for real coffins and get too close
        end up trapped inside their bodies.
    x:
      ja-Hrkt: |-
        ちかづいた　にんげんを　のみこんで
        ミイラに　してしまうという　うわさ。
        きんかいを　このんで　たべる。
      ja: |-
        近づいた　人間を　飲みこんで
        ミイラに　してしまうという　ウワサ。
        金塊を　好んで　食べる。
      ko: |-
        가까이 다가온 인간을 삼켜서
        미라로 만든다는 소문이 있다.
        금괴를 즐겨 먹는다.
      en: |-
        It has been said that they swallow those who get
        too close and turn them into mummies. They like to
        eat gold nuggets.
      fr: |-
        Il paraît qu’il avale les gens et les transforme en
        momies. Il adore manger des lingots d’or.
      de: |-
        Angeblich verschlingt es jeden, der sich ihm auch
        nur nähert. Besonders gern frisst es Klumpen aus
        reinem Gold.
      es: |-
        Se comenta que engulle a todo humano que se le
        acerca y lo momifica. Su comida favorita son las
        pepitas de oro.
      it: |-
        Si dice che inghiottisca le prede che gli si avvicinano
        e le trasformi in mummie. Gli piace mangiare le pepite
        d’oro.
    'y':
      ja-Hrkt: |-
        ほんものの　かんおけと　まちがえ
        ちかよってきた　はかドロボウを
        からだの　なかに　とじこめてしまう。
      ja: |-
        本物の　かんおけと　間違え
        近寄ってきた　墓ドロボウを
        体の　中に　閉じこめてしまう。
      ko: |-
        진짜 관과 착각해서
        다가온 도굴꾼을
        몸속에 가둬버린다.
      en: |-
        Grave robbers who mistake them for real coffins and
        get too close end up trapped inside their bodies.
      fr: |-
        Il prend l’apparence d’un beau cercueil. Les pilleurs
        de tombes imprudents finissent enfermés à l’intérieur.
      de: |-
        Grabräuber, die es mit einem echten Sarg verwechseln
        und ihm zu nahe kommen, hält es im Inneren seines
        Körpers gefangen.
      es: |-
        Atrapan en su interior a los ladrones de tumbas que
        los confunden con ataúdes de verdad.
      it: |-
        Imprigiona nel suo corpo i razziatori di tombe che gli
        vanno vicino pensando che si tratti di un sarcofago
        vero.
    omega-ruby:
      ja-Hrkt: |-
        ちかづいた　にんげんを　のみこんで
        ミイラに　してしまうという　うわさ。
        きんかいを　このんで　たべる。
      ja: |-
        近づいた　人間を　飲みこんで
        ミイラに　してしまうという　ウワサ。
        金塊を　好んで　食べる。
      ko: |-
        가까이 다가온 인간을 삼켜서
        미라로 만든다는 소문이 있다.
        금괴를 즐겨 먹는다.
      en: |-
        It has been said that they swallow those who get
        too close and turn them into mummies. They like to
        eat gold nuggets.
      fr: |-
        Il paraît qu’il avale les gens et les transforme en momies.
        Il adore manger des lingots d’or.
      de: |-
        Angeblich verschlingt es jeden, der sich ihm auch nur nähert.
        Besonders gern frisst es Klumpen aus reinem Gold.
      es: |-
        Se comenta que engulle a todo humano que se le acerca y lo
        momifica. Su comida favorita son las pepitas de oro.
      it: |-
        Si dice che inghiottisca le prede che gli si avvicinano e le
        trasformi in mummie. Gli piace mangiare le pepite d’oro.
    alpha-sapphire:
      ja-Hrkt: |-
        ほんものの　かんおけと　まちがえ
        ちかよってきた　はかドロボウを
        からだの　なかに　とじこめてしまう。
      ja: |-
        本物の　かんおけと　間違え
        近寄ってきた　墓ドロボウを
        体の　中に　閉じこめてしまう。
      ko: |-
        진짜 관과 착각해서
        다가온 도굴꾼을
        몸속에 가둬버린다.
      en: |-
        Grave robbers who mistake them for real coffins and
        get too close end up trapped inside their bodies.
      fr: |-
        Il prend l’apparence d’un beau cercueil. Les pilleurs de tombes
        imprudents finissent enfermés à l’intérieur.
      de: |-
        Grabräuber, die es mit einem echten Sarg verwechseln und ihm
        zu nahe kommen, hält es im Inneren seines Körpers gefangen.
      es: |-
        Atrapan en su interior a los ladrones de tumbas que los
        confunden con ataúdes de verdad.
      it: |-
        Imprigiona nel suo corpo i razziatori di tombe che gli vanno
        vicino pensando che si tratti di un sarcofago vero.
    sword:
      ja-Hrkt: |-
        ピカピカの　おうごんの　からだ。
        もはや　にんげんだった　ことは
        おもいだすことは　ないと　いう。
      ja: |-
        ピカピカの　黄金の　体。
        もはや　人間だった　ことは
        思い出すことは　ないと　いう。
      ko: |-
        황금으로 된 반짝거리는 몸.
        자신이 인간이었다는 사실을
        이제는 기억하지 못할 것이다.
      zh-Hant: |-
        擁有閃亮亮的黃金身軀。
        據說牠已再也無法記起
        自己曾經是人類。
      zh-Hans: |-
        拥有闪亮亮的黄金之躯。
        据说它已再也无法记起
        自己曾是人类。
      en: |-
        This Pokémon has a body of sparkling gold.
        People say it no longer remembers that it was
        once human.
      fr: |-
        Son corps en or brille de mille feux.
        On raconte qu’il ne se souvient désormais plus
        de l’époque où il était un être humain.
      de: |-
        Echnatoll haben einen Körper aus glitzerndem
        Gold. Man geht davon aus, dass sie sich nicht
        mehr an ihr Leben als Menschen erinnern können.
      es: |-
        Su cuerpo es de rutilante oro. Se dice que ya no
        recuerda nada de su pasado como humano.
      it: |-
        È ricoperto di oro scintillante. Si dice che ormai
        non ricordi più di essere stato un essere umano.
    shield:
      ja-Hrkt: |-
        ふるい　おはかの　かべに　おうさまの
        とみの　しょうちょう　として
        えがかれて　いることが　おおい。
      ja: |-
        古い　お墓の　壁に　王様の
        富の　象徴　として
        描かれて　いることが　多い。
      ko: |-
        오래된 묘지의 벽을 보면
        왕의 부를 드러내고자
        그려져 있는 경우가 많다.
      zh-Hant: |-
        死神棺象徵著國王的財富，
        因此許多古墓裡
        都有牠的壁畫。
      zh-Hans: |-
        迭失棺象征着国王的财富，
        因此许多古墓里
        都有它的壁画。
      en: |-
        There are many depictions of Cofagrigus
        decorating ancient tombs. They’re symbols
        of the wealth that kings of bygone eras had.
      fr: |-
        On le voit souvent représenté sur les murs
        des vieilles sépultures des rois en tant que
        symbole de leur richesse.
      de: |-
        Darstellungen von Echnatoll auf den Wänden
        alter Königsgräber sind ein Zeichen dafür, dass
        der dort begrabene Regent wohlhabend war.
      es: |-
        Aparece representado en los muros de antiguas
        sepulturas como símbolo de riqueza de reyes de
        antaño.
      it: |-
        Viene spesso raffigurato sulle pareti di antichi
        sepolcri come simbolo dell’opulenza dei re.
