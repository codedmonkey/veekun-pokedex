        襲われないように　岩の　下に
        こもって　じっとしている。
      ko: |-
        껍질 속에 열매가 비축되어 있다.
        공격받지 않도록 바위 밑에
        틀어박혀 꼼짝하지 않는다.
      zh-Hant: |-
        甲殼裡儲存著樹果。
        為了避免受到襲擊，
        會一動不動地躲在岩石下面。
      zh-Hans: |-
        甲壳里储存着树果。
        为了避免受到袭击，
        它会一动不动地躲在岩石下面。
      en: |-
