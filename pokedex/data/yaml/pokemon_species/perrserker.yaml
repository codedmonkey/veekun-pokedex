perrserker:
  base_happiness: 50
  capture_rate: 90
  color: brown
  egg_groups:
    - ground
  evolution_chain: meowth
  evolves_from: meowth
  flavor_text:
    sword:
      ja-Hrkt: |-
        あたまの　たいもうが　こうしつかして
        てつの　ヘルメットのように　なった。
        とても　こうせんてきな　せいしつ。
      ja: |-
        頭の　体毛が　硬質化して
        鉄の　ヘルメットのように　なった。
        とても　好戦的な　性質。
      ko: |-
        머리의 털이 단단해져서
        철로 된 헬멧처럼 되었다.
        매우 호전적인 성질을 가졌다.
      zh-Hant: |-
        有著十分好戰的性格。
        頭上像鐵頭盔一樣的東西
        其實是牠硬化後的體毛。
      zh-Hans: |-
        有着十分好战的性格。
        头上像铁头盔一样的东西
        其实是它硬化后的体毛。
      en: |-
        What appears to be an iron helmet is actually
        hardened hair. This Pokémon lives for the thrill
        of battle.
      fr: |-
        La fourrure sur sa tête s’est endurcie
        et a pris la forme d’un casque en fer.
        Il est de nature très bagarreuse.
      de: |-
        Die Haare auf seinem Kopf haben sich zu etwas
        verhärtet, das an einen eisernen Helm erinnert.
        Es ist von Natur aus kriegerisch veranlagt.
      es: |-
        El pelo de la cabeza se le ha endurecido hasta
        el punto de parecer un yelmo de hierro. Posee
        un temperamento muy combativo.
      it: |-
        La pelliccia sulla testa si è indurita ed è
        diventata simile a un elmetto di ferro.
        Ha una natura molto combattiva.
    shield:
      ja-Hrkt: |-
        たたかいに　あけくれて　しんかした
        けっか　のばすと　たんけんに　かわる
        ぶっそうな　ツメを　てにいれた。
      ja: |-
        戦いに　明け暮れて　進化した
        結果　伸ばすと　短剣に　変わる
        物騒な　ツメを　手に入れた。
      ko: |-
        싸움에 열중해 진화한 결과
        펴면 단검으로 변하는
        위험한 발톱을 얻었다.
      zh-Hant: |-
        在日復一日的戰鬥中得以進化。
        進化的結果是那危險的指甲，
        留長後能當作短劍來用。
      zh-Hans: |-
        在日复一日的战斗中得以进化。
        进化的结果是那危险的指甲，
        留长后能当作短剑来用。
      en: |-
        After many battles, it evolved dangerous
        claws that come together to form daggers
        when extended.
      fr: |-
        Il s’est tant adonné au combat qu’il a évolué :
        il est désormais doté de griffes redoutables
        qui prennent la forme de dagues en s’allongeant.
      de: |-
        Es entwickelte sich nach einer langen Zeit voller
        Kämpfe. Nun kann es seine Krallen ausfahren,
        um sie als Dolche zu nutzen.
      es: |-
        Su devoción por la lucha ha propiciado que
        evolucionara y le ha conferido unas peligrosas
        garras que se convierten en dagas al extenderse.
      it: |-
        Si è evoluto dopo aver passato giorni interi
        a lottare e ha sviluppato degli artigli che,
        una volta sfoderati, diventano temibili pugnali.
