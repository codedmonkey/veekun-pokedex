    x:
      ja-Hrkt: |-
        てっぱんも　かみちぎる　キバを　もち
        およぐ　そくどは　じそく１２０キロ。
        べつめいは　うみのギャング。
      ja: |-
        鉄板も　かみちぎる　キバを　持ち
        泳ぐ　速度は　時速１２０キロ。
        別名は　海のギャング。
      ko: |-
        철판도 물어 찢는 이빨을 가지며
        헤엄치는 속도는 시속 120km다.
        별명은 바다의 건달이다.
      en: |-
        Its fangs rip through sheet iron. It swims at 75 mph
        and is known as “The Bully of the Sea.”
      fr: |-
        Ses crocs lacèrent des feuilles d’acier. Il nage à
        120 km/h. On l’appelle « tyran des mers ».
      de: |-
        Seine Zähne durchdringen sogar Eisen.
        Es schwimmt mit 120 km/h und wird
        „Tyrann des Meeres“ genannt.
      es: |-
        Con sus colmillos puede atravesar el acero. Nada a
        120 km/h. Le llaman el Terror de los Mares.
      it: |-
        Con le sue zanne può spezzare il ferro. Nuota
        a 120 km/h. È noto come il “Tiranno del mare”.
    'y':
      ja-Hrkt: |-
        おしりから　かいすいを　ふんしゃして
        じそく　１２０キロの　スピードで
        およぎまわる　うみの　あばれんぼう。
      ja: |-
        お尻から　海水を　噴射して
        時速　１２０キロの　スピードで
        泳ぎ回る　海の　暴れん坊。
      ko: |-
        엉덩이에서 해수를 분사해
        시속 120km의 스피드로
        헤엄치는 바다의 난동꾼이다.
      en: |-
        It can swim at speeds of 75 mph by jetting
        seawater through its body. It is the bandit of
        the sea.
      fr: |-
        Ce petit voyou fend les mers en se propulsant à
        120 km/h grâce à son postérieur.
      de: |-
        Tohaido mag Radau und schwimmt bis zu
        120 km/h schnell, indem es Wasser aus
        seinem Hinterteil ausstößt.
      es: |-
        Propulsándose con sus aletas, nada a 120 km/h.
        Es el terror de los mares.
      it: |-
        Il “Tiranno del mare”! Nuota a 120 km/h espellendo
        acqua marina dal didietro a mo’ di propulsore.
    omega-ruby:
      ja-Hrkt: |-
        うみのギャングと　よばれ　おそれられている。
        おれても　すぐに　はえかわる　キバを　もち
        おおがたタンカーも　１ぴきで　バラバラに　する。
      ja: |-
        海のギャングと　呼ばれ　恐れられている。
        折れても　すぐに　生え変わる　キバを　持ち
        大型タンカーも　１匹で　バラバラに　する。
      ko: |-
        바다의 건달이라 불리는 두려움의 대상이다.
        부러져도 바로 다시 나는 이빨이 있어서
        한 마리가 대형 유조선을 엉망으로 만든다.
      en: |-
        Nicknamed “the bully of the sea,” Sharpedo is widely feared.
        Its cruel fangs grow back immediately if they snap off. Just one
        of these Pokémon can thoroughly tear apart a supertanker.
      fr: |-
        Surnommé le « tyran des mers », Sharpedo est craint
        de par le monde. Ses crocs menaçants repoussent
        lorsqu’ils se brisent. Un seul de ces Pokémon peut
        détruire un pétrolier gros porteur.
      de: |-
        Tohaido trägt den Spitznamen „Tyrann des Meeres“ und ist
        sehr gefürchtet. Seine grausamen Zähne wachsen sofort nach,
        wenn sie ausgebrochen sind. Es kann sogar einen Öltanker
        zerreißen.
      es: |-
        Conocido como el Terror de los Mares, Sharpedo es temido
        por todos. Si este Pokémon pierde los escalofriantes
        colmillos que tiene, los recupera en breve. Basta con un
        Sharpedo para destrozar un buque-cisterna.
      it: |-
        Soprannominato “Tiranno del mare”, Sharpedo è molto
        temuto. Se perde qualcuno dei suoi temibili denti, questo
        ricresce all’istante. Uno di questi Pokémon da solo
        riesce ad affondare una superpetroliera.
    alpha-sapphire:
      ja-Hrkt: |-
        かいすいを　おしりの　あなから　ふきだして
        じそく１２０キロで　およぐことが　できる。
        ながい　きょりを　およげないのが　じゃくてんだ。
      ja: |-
        海水を　お尻の　穴から　吹き出して
        時速１２０キロで　泳ぐことが　できる。
        長い　距離を　泳げないのが　弱点だ。
      ko: |-
        바닷물을 엉덩이의 구멍으로 뿜어내서
        시속 120km로 헤엄칠 수 있다.
        장거리를 헤엄칠 수 없는 것이 약점이다.
      en: |-
        Sharpedo can swim at speeds of up to 75 mph by jetting
        seawater out of its backside. This Pokémon’s drawback is its
        inability to swim long distances.
      fr: |-
        Sharpedo peut nager à plus de 120 km/h en propulsant de
        l’eau de mer par l’arrière de son corps. Ce Pokémon a un
        point faible : il ne peut pas parcourir de longues distances.
      de: |-
        Tohaido kann bis zu 120 km/h schnell schwimmen, indem
        es Meerwasser aus seinem Hinterteil herausschießt. Dieses
        Pokémon kann jedoch keine weiten Strecken zurücklegen.
      es: |-
        Sharpedo puede alcanzar nadando los 120 km/h agitando
        la aleta trasera y propulsándose por el agua. El punto flaco
        de este Pokémon es la imposibilidad que tiene de nadar
        largas distancias.
      it: |-
        Sharpedo riesce a nuotare fino alla velocità di 120 km/h,
        espellendo acqua di mare dalla parte posteriore del corpo
        come un propulsore. La sua unica debolezza è la mancanza
        di resistenza sulle lunghe distanze.
    sun:
      ja-Hrkt: |-
        じそく　１２０キロで　えものを　おい
        てつをも　くだく　キバで　しとめる。
        つうしょう　うみのギャング。
      ja: |-
        時速　１２０キロで　獲物を　追い
        鉄をも　砕く　キバで　仕留める。
        通称　海のギャング。
      ko: |-
        시속 120km로 먹이를 쫓아
        철도 부수는 어금니로 잡는다.
        통칭 바다의 건달.
      zh-Hant: |-
        以１２０公里的時速追逐獵物，
        再用連鐵都能咬碎的牙齒捕殺。
        人稱牠為大海惡霸。
      zh-Hans: |-
        以１２０公里的时速追击猎物，
        用连铁都能咬碎的牙齿捕杀。
        通常称之为大海恶霸。
      en: |-
        It pursues its prey at speeds of 75 mph and
        finishes them off with fangs that can crush iron.
        It is known as the bully of the sea.
      fr: |-
        Sa vitesse de pointe atteint les 120 km/h et
        ses dents acérées viennent même à bout de
        l’acier. On le surnomme le « tyran des mers ».
      de: |-
        Es jagt mit 120 km/h seine Beute und erlegt sie
        mithilfe seiner Zähne, die selbst Eisen durch-
        dringen. Sein Spitzname ist „Tyrann des Meeres“.
      es: |-
        Puede nadar a 120 km/h y abatir a su presa
        con sus colmillos, capaces de destrozar incluso
        el metal. Su apodo es el Terror de los Mares.
      it: |-
        Insegue le prede nuotando a 120 km/h e le
        afferra con le potenti zanne in grado di
        spezzare il ferro. È detto il “Tiranno del mare”.
    moon:
      ja-Hrkt: |-
        かつては　せビレが　しょくざいとして
        ちんちょうされ　らんかく　された
        かなしい　かこを　もっている。
      ja: |-
        かつては　背ビレが　食材として
        珍重され　乱獲　された
        悲しい　過去を　持っている。
      ko: |-
        한때 등지느러미가 귀한
        식재료로 여겨져 남획된
        슬픈 과거를 갖고 있다.
      zh-Hant: |-
        在過去，牠的背鰭被當作貴重的食材，
        因此有著被濫捕的悲慘歷史。
      zh-Hans: |-
        过去，它的背鳍被当做贵重的食材，
        因此有着被滥捕的悲惨历史。
      en: |-
        It has a sad history. In the past, its dorsal fin
        was a treasured foodstuff, so this Pokémon
        became a victim of overfishing.
      fr: |-
        Ce Pokémon a un bien triste passé : il était
        en effet impitoyablement chassé pour son
        aileron, fort apprécié des gourmets.
      de: |-
        Tohaido hat eine traurige Vergangenheit: Seine
        Rückenflosse gilt als Delikatesse, weshalb es
        lange Zeit gnadenlos überfischt wurde.
      es: |-
        Este Pokémon tiene un pasado triste, ya que
        antaño fue pescado en exceso por lo deliciosa
        que era su aleta dorsal.
      it: |-
        In un triste passato, la sua pinna dorsale era
        considerata una prelibatezza e questo l’ha
        reso vittima di una caccia indiscriminata.
    ultra-sun:
      ja-Hrkt: |-
        ぬけた　キバを　もっていると　うみで
        じこに　あわないと　しんじられており
        アクセサリーなどに　かこう　される。
      ja: |-
        抜けた　キバを　持っていると　海で
        事故に　遭わないと　信じられており
        アクセサリーなどに　加工　される。
      ko: |-
        빠진 이빨을 지니고 있으면 바다에서
        사고를 당하지 않는다고 믿어
        액세서리 등으로 가공된다.
      zh-Hant: |-
        人們相信只要帶著牠脫落的牙齒
        就不會在海上遭遇事故，
        因此會將牠的牙齒加工成飾品。
      zh-Hans: |-
        人们相信，如果带着它脱落的牙齿
        就不会在海上遭遇事故，
        因此会将牙齿加工为饰品等。
      en: |-
        People believe that carrying one of its
        discarded fangs will prevent mishaps at sea,
        so the fangs are made into accessories.
      fr: |-
        On fabrique des accessoires à partir de ses
        dents, car elles ont la réputation de protéger
        leurs porteurs des accidents en mer.
      de: |-
        Man glaubt, dass die ausgefallenen Zähne von
        Tohaido vor Unfällen auf dem Meer schützen.
        Deswegen werden sie zu Schmuck verarbeitet.
      es: |-
        Existe la creencia de que sus dientes traen
        buena suerte en la mar, por lo que se usan para
        la elaboración de amuletos y adornos.
      it: |-
        Si dice che i suoi denti siano dei portafortuna
        che proteggono dagli incidenti in mare. Con
        quelli che perde vengono fabbricati accessori.
    ultra-moon:
      ja-Hrkt: |-
        おしりの　あなから　のみこんだ
        かいすいを　ふきだし　およぐ。
        ちの　においには　とても　びんかん。
      ja: |-
        おしりの　穴から　飲み込んだ
        海水を　噴き出し　泳ぐ。
        血の　匂いには　とても　敏感。
      ko: |-
        엉덩이의 구멍으로 들이마신
        바닷물을 뿜어내서 헤엄친다.
        피 냄새에는 매우 민감하다.
      zh-Hant: |-
        會將吞下的海水從臀部的
        孔中噴出，藉此來游動。
        對血的氣味非常敏感。
      zh-Hans: |-
        会从臀部的孔里喷出
        喝入的海水来游泳。
        对血的气味十分敏感。
      en: |-
        It drinks in seawater and jets it from its rear to
        propel itself. It’s very sensitive to the scent
        of blood.
      fr: |-
        Ce Pokémon extrêmement sensible à l’odeur
        du sang se déplace en évacuant par son orifice
        postérieur l’eau de mer qu’il avale.
      de: |-
        Es schwimmt, indem es das Meerwasser, das es
        trinkt, aus seinem Hinterteil ausstößt. Für den
        Geruch von Blut ist es sehr empfänglich.
      es: |-
        Nada tragando agua marina, que le sirve de
        propulsión al expelerla por detrás. Su olfato es
        extremadamente sensible al olor de la sangre.
      it: |-
        Nuota espellendo dalla parte posteriore del
        corpo l’acqua di mare ingerita. È molto sensibile
        all’odore del sangue.
    sword:
      ja-Hrkt: |-
        えものの　においを　かぎとると
        おしりから　かいすいを　ふんしゃして
        じそく１２０キロで　しゅうげきする。
      ja: |-
        獲物の　匂いを　嗅ぎとると
        お尻から　海水を　噴射して
        時速１２０キロで　襲撃する。
      ko: |-
        먹이의 냄새를 맡으면
        엉덩이로 바닷물을 내뿜어서
        시속 120km의 속도로 습격한다.
      zh-Hant: |-
        當牠嗅到獵物的氣味，
        就會從臀部噴射出海水，
        發動時速１２０公里的襲擊。
      zh-Hans: |-
        嗅到猎物的味道后，
        会从臀部喷射海水，
        以１２０公里的时速发动袭击。
      en: |-
        As soon as it catches the scent of prey, Sharpedo
        will jet seawater from its backside, hurtling
        toward the target to attack at 75 mph.
      fr: |-
        Dès qu’il détecte l’odeur d’une proie, il fonce
        sur elle à une vitesse de 120 km/h en propulsant
        de l’eau de mer par son postérieur.
      de: |-
        Wittert es Beute, schießt es Wasser aus seinem
        Hinterteil und jagt ihr mit einer Geschwindigkeit
        von 120 km/h hinterher.
      es: |-
        En cuanto detecta el olor de una presa, expele
        agua marina para propulsarse hacia delante y
        atacar a una velocidad de 120 km/h.
      it: |-
        Se fiuta l’odore di una preda, la assale alla
        velocità di 120 km/h, che raggiunge espellendo
        acqua marina dalla parte posteriore del corpo.
    shield:
      ja-Hrkt: |-
        うみのギャングと　よばれ　せいそく
        かいいきに　はいりこんでしまった
        ふねは　もれなく　おそわれてしまう。
      ja: |-
        海のギャングと　呼ばれ　生息
        海域に　入りこんでしまった
        船は　もれなく　襲われてしまう。
      ko: |-
        바다의 건달로 불리며
        서식하는 해역에 들어간
        배는 모조리 공격당한다.
      zh-Hant: |-
        被稱為大海惡霸。船隻
        要是誤闖了牠的棲息海域，
        無一倖免地都會被襲擊。
      zh-Hans: |-
        被称为大海恶霸。
        进入它栖息海域的船只
        会无一例外地遭到袭击。
      en: |-
        This Pokémon is known as the Bully of the Sea.
        Any ship entering the waters Sharpedo calls
        home will be attacked—no exceptions.
      fr: |-
        Surnommé le « tyran des mers », ce Pokémon
        attaque sans exception tous les navires
        qui osent s’aventurer sur son territoire.
      de: |-
        Tohaido trägt den Spitznamen „Tyrann des
        Meeres“. Schiffe, die in sein Revier eindringen,
        greift es ausnahmslos an.
      es: |-
        Conocido como el Terror de los Mares, ataca sin
        excepción a todo barco que ose adentrarse en su
        territorio oceánico.
      it: |-
        Questo Pokémon, detto “Tiranno del mare”,
        assale qualsiasi nave si addentri nelle acque
        in cui dimora.
