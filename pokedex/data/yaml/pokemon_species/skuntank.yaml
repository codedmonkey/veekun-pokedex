    black-2:
      en: |-
        It attacks by spraying a horribly
        smelly fluid from the tip of its tail.
        Attacks from above confound it.
    white-2:
      en: |-
        It attacks by spraying a horribly
        smelly fluid from the tip of its tail.
        Attacks from above confound it.
    x:
      ja-Hrkt: |-
        しっぽの　さきから　ひどい　においの
        えきたいを　とばして　こうげきする。
        ひきょりは　５０メートルいじょう。
      ja: |-
        尻尾の　先から　ひどい　においの
        液体を　飛ばして　攻撃する。
        飛距離は　５０メートル以上。
      ko: |-
        꼬리 끝에서 심한 냄새가 나는
        액체를 뿌려 공격한다.
        사정거리는 50m 이상이다.
      en: |-
        It sprays a vile-smelling fluid from the tip of its tail
        to attack. Its range is over 160 feet.
      fr: |-
        Il attaque en projetant un liquide fétide du bout de
        sa queue. Il peut tirer à 50 m.
      de: |-
        Über seine Schweifspitze versprüht es eine
        übelriechende Substanz. Die Reichweite liegt
        bei über 50 m.
      es: |-
        Para atacar, emite un fluido maloliente por la punta de
        su cola que puede llegar a más de 50 m.
      it: |-
        Attacca spruzzando un fluido puzzolente dalla
        coda. Ha un raggio d’azione di oltre 50 m.
    'y':
      ja-Hrkt: |-
        しっぽから　くさい　しるを　とばす。
        おなかで　じゅくせいさせる　じかんが
        ながいほど　においが　ひどくなる。
      ja: |-
        尻尾から　くさい　汁を　飛ばす。
        お腹で　熟成させる　時間が
        長いほど　においが　ひどくなる。
      ko: |-
        꼬리에서 역한 분비액을 날린다.
        배에서 숙성된 시간이
        길수록 냄새가 심해진다.
      en: |-
        It sprays a stinky fluid from its tail. The fluid smells
        worse the longer it is allowed to fester.
      fr: |-
        Sa queue projette un fluide puant. Plus on le laisse
        s’écouler et plus son odeur est insoutenable.
      de: |-
        Es spritzt eine stinkende Substanz aus seinem Schweif.
        Hat sie lange gegärt, stinkt sie stärker.
      es: |-
        Emite un fluido apestoso por la cola. Cuanto más
        tiempo pasa, peor huele.
      it: |-
        Spruzza un fluido puzzolente dalla coda. Quest’odore
        diventa insopportabile se fatto suppurare.
    omega-ruby:
      ja-Hrkt: |-
        しっぽの　さきから　ひどい　においの
        えきたいを　とばして　こうげきする。
        ひきょりは　５０メートルいじょう。
      ja: |-
        尻尾の　先から　ひどい　においの
        液体を　飛ばして　攻撃する。
        飛距離は　５０メートル以上。
      ko: |-
        꼬리 끝에서 심한 냄새가 나는
        액체를 뿌려 공격한다.
        사정거리는 50m 이상이다.
      en: |-
        It sprays a vile-smelling fluid from the tip of its tail
        to attack. Its range is over 160 feet.
      fr: |-
        Il attaque en projetant un liquide fétide du bout de sa queue.
        Il peut tirer à 50 m.
      de: |-
        Über seine Schweifspitze versprüht es eine übelriechende
        Substanz. Die Reichweite liegt bei über 50 m.
      es: |-
        Para atacar, emite un fluido maloliente por la punta de su cola
        que puede llegar a más de 50 m.
      it: |-
        Attacca spruzzando un fluido puzzolente dalla coda. Ha un
        raggio d’azione di oltre 50 m.
    alpha-sapphire:
      ja-Hrkt: |-
        しっぽから　くさい　しるを　とばす。
        おなかで　じゅくせいさせる　じかんが
        ながいほど　においが　ひどくなる。
      ja: |-
        尻尾から　くさい　汁を　飛ばす。
        お腹で　熟成させる　時間が
        長いほど　においが　ひどくなる。
      ko: |-
        꼬리에서 역한 분비액을 날린다.
        배에서 숙성된 시간이
        길수록 냄새가 심해진다.
      en: |-
        It sprays a stinky fluid from its tail. The fluid smells
        worse the longer it is allowed to fester.
      fr: |-
        Sa queue projette un fluide puant. Plus on le laisse s’écouler
        et plus son odeur est insoutenable.
      de: |-
        Es spritzt eine stinkende Substanz aus seinem Schweif.
        Hat sie lange gegärt, stinkt sie stärker.
      es: |-
        Emite un fluido apestoso por la cola. Cuanto más tiempo lo
        tiene fermentando en las tripas, peor huele.
      it: |-
        Spruzza un fluido puzzolente dalla coda. Quest’odore diventa
        insopportabile se fatto suppurare.
    sword:
      ja-Hrkt: |-
        おなかに　ためこんだ　くさい　しるを
        しっぽから　とばして　たたかう。
        においは　たべたもので　かわるのだ。
      ja: |-
        お腹に　溜めこんだ　臭い　汁を
        尻尾から　飛ばして　戦う。
        においは　食べ物で　変わるのだ。
      ko: |-
        배 안에 모아둔 역한 분비액을
        꼬리에서 뿜어서 싸운다.
        냄새는 먹은 것에 따라 달라진다.
      zh-Hant: |-
        會在肚子裡囤滿臭液，
        從尾巴噴出臭液攻擊敵人。
        臭味會依吃下的東西而不同。
      zh-Hans: |-
        会在肚子里囤满臭液，
        从尾巴喷出臭液攻击敌人。
        臭味会因吃下的东西而不同。
      en: |-
        In its belly, it reserves stinky fluid that it shoots
        from its tail during battle. As this Pokémon’s diet
        varies, so does the stench of its fluid.
      fr: |-
        Il se bat en projetant avec sa queue un liquide
        nauséabond qu’il stocke dans son ventre.
        L’odeur varie selon ce qu’il mange.
      de: |-
        In seinem Magen speichert es eine stinkende
        Flüssigkeit, die es im Kampf aus seinem Schweif
        sprüht. Ihr Geruch hängt von seiner Nahrung ab.
      es: |-
        Ataca expulsando por la cola un fluido apestoso
        que almacena en el vientre y cuyo hedor es
        distinto en función de su dieta.
      it: |-
        Lotta spruzzando dalla coda il liquido puzzolente
        accumulato nel ventre. L’odore cambia a
        seconda del cibo di cui si è nutrito.
    shield:
      ja-Hrkt: |-
        しっぽの　さきから　とばす　しるの
        においは　きょうれつ。　じめんに
        あなを　ほって　すあなを　つくる。
      ja: |-
        尻尾の　先から　飛ばす　汁の
        においは　強烈。　地面に
        穴を　掘って　巣穴を　つくる。
      ko: |-
        꼬리 끝에서 날리는 분비액의
        냄새는 강렬하다.
        땅에 구멍을 파서 굴을 만든다.
      zh-Hant: |-
        從尾巴尖端噴出的液體
        帶有強烈的惡臭。
        會在地面上挖洞建造巢穴。
      zh-Hans: |-
        从尾巴尖端喷出的液体
        带有强烈的恶臭。
        会在地面上挖洞建造巢穴。
      en: |-
        It digs holes in the ground to make its nest.
        The stench of the fluid it lets fly from the tip
        of its tail is extremely potent.
      fr: |-
        Ce Pokémon, qui creuse son terrier dans le sol,
        peut projeter un liquide à l’odeur infecte avec
        le bout de sa queue.
      de: |-
        Die Flüssigkeit, die es aus seinem Schweif sprüht,
        hat einen sehr starken Geruch. Es errichtet seinen
        Bau, indem es Löcher in den Boden gräbt.
      es: |-
        El fluido que expulsa por la punta de la cola
        emana una hediondez insoportable. Construye
        sus madrigueras cavando hoyos en la tierra.
      it: |-
        Il fluido che spruzza dalla punta della coda
        ha un odore tremendo. Costruisce la tana
        scavando un buco nel terreno.
    legends-arceus:
      en: |-
        Sprays a poisonous fluid to take down prey. Sometimes, unable
        to stomach the stench of its own fluid, it leaves the bested
        prey uneaten.
