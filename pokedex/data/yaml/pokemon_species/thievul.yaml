thievul:
  base_happiness: 50
  capture_rate: 127
  color: brown
  egg_groups:
    - ground
  evolution_chain: nickit
  evolves_from: nickit
  flavor_text:
    sword:
      ja-Hrkt: |-
        ねらった　エモノは　こっそり
        マーキング。　においを　たどって
        ゆだん　したころ　ぬすみに　くるぞ。
      ja: |-
        狙った　獲物は　こっそり
        マーキング。　においを　辿って
        油断　したころ　盗みに　来るぞ。
      ko: |-
        목표로 한 먹잇감에 슬쩍 마킹을
        해둔다. 냄새를 따라가다 먹이의
        주인이 방심하고 있을 때 훔치려 든다.
      zh-Hant: |-
        會偷偷在看中的獵物身上
        留下標記，追蹤目標的氣味，
        在對方放鬆警戒時偷盜。
      zh-Hans: |-
        会偷偷在看中的猎物身上
        留下标记，追踪目标的气味，
        在对方放松警戒时偷盗。
      en: |-
        It secretly marks potential targets with a scent.
        By following the scent, it stalks its targets
        and steals from them when they least expect it.
      fr: |-
        Il marque sa victime pour la suivre à l’odeur.
        Sitôt qu’elle est distraite, il s’empresse de lui
        voler ses biens.
      de: |-
        Es markiert heimlich die Beute, auf die es ein
        Auge geworfen hat. Dann folgt es dem Geruch
        und stiehlt sie, wenn sich die Gelegenheit bietet.
      es: |-
        Marca a su presa sin ser advertido. Sigue el olor
        y, cuando el otro Pokémon baja la guardia,
        aprovecha para robarle.
      it: |-
        Marca di nascosto le prede interessanti, ne segue
        l’odore per rintracciarle e approfitta di una loro
        distrazione per rubare nelle loro tane.
    shield:
      ja-Hrkt: |-
        みがるな　からだと　するどい　ツメで
        エサや　タマゴを　ぬすんで　まわる。
        パルスワンが　てんてき。
      ja: |-
        身軽な　体と　鋭い　ツメで
        エサや　タマゴを　盗んで　まわる。
        パルスワンが　天敵。
      ko: |-
        가벼운 몸과 날카로운 발톱으로
        먹이나 알을 훔치며 돌아다닌다.
        펄스멍이 천적이다.
      zh-Hant: |-
        靠著輕盈的身體和銳利的
        爪子到處去偷食物和蛋。
        逐電犬是牠的天敵。
      zh-Hans: |-
        靠着轻盈的身体和锐利的
        爪子到处去偷食物和蛋。
        逐电犬是它的天敌。
      en: |-
        With a lithe body and sharp claws, it goes
        around stealing food and eggs. Boltund
        is its natural enemy.
      fr: |-
        Grâce à son corps leste et ses griffes acérées,
        il va et vient en dérobant Œufs et nourriture.
        Son ennemi juré est Fulgudog.
      de: |-
        Dank seines agilen Körpers und seiner scharfen
        Klauen ist es ihm ein Leichtes, überall Futter und
        Eier zu stehlen. Bellektro ist sein Erzfeind.
      es: |-
        Un Pokémon ágil y de afiladas garras que se
        alimenta de huevos y comida robados. Los
        Boltund son su enemigo natural.
      it: |-
        Se ne va in giro rubando Uova e cibo grazie
        al suo corpo agile e alle unghie affilate.
        Il suo nemico naturale è Boltund.
