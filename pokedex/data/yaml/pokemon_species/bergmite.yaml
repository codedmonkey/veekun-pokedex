bergmite:
  base_happiness: 50
  capture_rate: 190
  color: blue
  egg_groups:
    - monster
    - mineral
  evolution_chain: bergmite
  evolves_from: ~
  flavor_text:
    x:
      ja-Hrkt: |-
        からだを　おおう　こおりが　てきの
        こうげきを　ふせぐ。わられても
        れいきで　すぐに　こおりを　はる。
      ja: |-
        体を　覆う　氷が
        敵の　攻撃を　防ぐ。割られても
        冷気で　すぐに　氷を　張る。
      ko: |-
        몸을 둘러싼 얼음이 적의
        공격을 막는다. 깨져도
        냉기로 재빨리 얼음을 얼린다.
      en: |-
        It blocks opponents’ attacks with the
        ice that shields its body. It uses cold air
        to repair any cracks with new ice.
      fr: |-
        La glace qui couvre son corps bloque les attaques
        ennemies. Si elle se fissure, il la reconstitue
        immédiatement en soufflant de l’air glacé.
      de: |-
        Es wehrt gegnerische Angriffe mit seinem in Eis
        gehüllten Körper ab. Bruchstellen bessert es mit
        aus kalter Luft gewonnenem neuen Eis aus.
      es: |-
        Envuelve su cuerpo en una capa de hielo que le
        permite evitar los ataques del enemigo. Si se
        resquebraja, la recompone con aire gélido.
      it: |-
        Si difende dagli attacchi nemici grazie al ghiaccio
        che ricopre il suo corpo. Se viene danneggiato,
        rigenera lo strato protettivo, riparandolo.
    'y':
      ja-Hrkt: |-
        マイナス１００どの　れいきで　てきを
        こおりづけにする。まんねんゆきに
        おおわれた　やまで　むれを　つくる。
      ja: |-
        マイナス１００度の　冷気で　敵を
        氷漬けにする。万年雪に　覆われた
        山で　群れを　作る。
      ko: |-
        마이너스 100도의 냉기로 적을
        얼려버린다. 만년설로
        덮인 산에서 무리를 짓는다.
      en: |-
        Using air of -150 degrees Fahrenheit, they
        freeze opponents solid. They live in herds
        above the snow line on mountains.
      fr: |-
        Il gèle ses ennemis d’une bourrasque à -100 °C.
        Il vit en troupeau avec ses congénères, dans
        les neiges éternelles des hautes montagnes.
      de: |-
        Es friert seine Gegner mittels eines -100 °C kalten
        Luftstromes ein. Mit seinen Artgenossen lebt es
        herdenweise auf Bergen inmitten des ewigen Eises.
      es: |-
        Congela a sus enemigos sometiéndolos a un aire
        gélido de -100 °C. Forman grupos para habitar
        montañas cubiertas de una nieve sempiterna.
      it: |-
        Congela i nemici soffiando aria a -100 °C. Vive in
        gruppo nelle montagne ricoperte da nevi perenni.
