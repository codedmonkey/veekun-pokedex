    sword:
      ja-Hrkt: |-
        ひょうてんか　１００どの　れいきで
        くうきちゅうの　すいぶんを　こおらせ
        こおりの　そうこうで　みを　まもる。
      ja: |-
        氷点下　１００度の　冷気で
        空気中の　水分を　凍らせ
        氷の　装甲で　身を　守る。
      ko: |-
        영하 100도의 냉기로
        공기 중의 수분을 얼려서
        얼음 갑옷으로 몸을 지킨다.
      zh-Hant: |-
        用零下１００度的冷氣
        凍住空氣中的水分，
        用冰之裝甲保護自身。
      zh-Hans: |-
        用零下１００度的冷气
        冻住空气中的水分，
        用冰之装甲保护自身。
      en: |-
        They chill the air around them to −150 degrees
        Fahrenheit, freezing the water in the air into ice
        that they use as armor.
      fr: |-
        Grâce à son souffle glacé à - 100 °C, il peut
        geler l’humidité dans l’air et se façonner
        une carapace de glace.
      de: |-
        Mit -100 ºC kalter Luft lässt es Wassermoleküle
        um sich herum gefrieren und erschafft sich so
        einen schützenden Eispanzer.
      es: |-
        Congela la humedad del ambiente exhalando
        vaho a -100 °C para crear una coraza de hielo
        con la que protege su cuerpo.
      it: |-
        Cristallizza l’umidità presente nell’aria con un
        soffio ghiacciato a -100 ºC, creando una
        corazza con cui protegge il proprio corpo.
    shield:
      ja-Hrkt: |-
        ごっかんの　ちいきに　せいそくする。
        クレベースの　せなかと　じぶんの
        あしを　こおりつかせて　こていする。
      ja: |-
        極寒の　地域に　生息する。
        クレベースの　背中と　自分の
        足を　凍りつかせて　固定する。
      ko: |-
        혹한의 지역에 서식한다.
        크레베이스의 등에 자신의
        발을 얼어붙게 해 고정한다.
      zh-Hant: |-
        棲息在極其寒冷的地域。
        會把自己的腳凍在
        冰岩怪的背上固定起來。
      zh-Hans: |-
        栖息在极其寒冷的地域。
        会把自己的脚冻在
        冰岩怪的背上固定起来。
      en: |-
        This Pokémon lives in areas of frigid cold.
        It secures itself to the back of an Avalugg
        by freezing its feet in place.
      fr: |-
        Il vit dans les régions les plus froides, agrippé
        aux Séracrawl. Il gèle ses pattes sur leur dos
        pour se maintenir en place.
      de: |-
        Es lebt in extrem kalten Gebieten. Um sich an
        Arktilas zu befestigen, lässt es seine Beine an
        dessen Rücken festfrieren.
      es: |-
        Vive en regiones sumamente frías. Se aferra al
        lomo de los Avalugg congelando sus propias
        extremidades.
      it: |-
        Abita le regioni più fredde. Si ancora alla schiena
        di Avalugg congelando la base delle sue zampe.
