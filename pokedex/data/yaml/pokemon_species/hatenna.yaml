hatenna:
  base_happiness: 50
  capture_rate: 235
  color: pink
  egg_groups:
    - fairy
  evolution_chain: hatenna
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        あたまの　とっきで　せいぶつの
        きもちを　かんじとる。　おだやかな
        ものにしか　こころを　ひらかない。
      ja: |-
        頭の　突起で　生物の
        気持ちを　感じとる。　穏やかな
        ものにしか　心を　開かない。
      ko: |-
        머리의 돌기로 생물의
        기분을 감지한다. 온화한
        자에게만 마음을 연다.
      zh-Hant: |-
        透過頭部的突起物
        來感應生物的情感。
        只對溫和的人敞開心扉。
      zh-Hans: |-
        通过头部的突起物
        来感应生物的情感。
        只对温和的人敞开心扉。
      en: |-
        Via the protrusion on its head, it senses other
        creatures’ emotions. If you don’t have a calm
        disposition, it will never warm up to you.
      fr: |-
        La protubérance sur sa tête lui permet
        de percevoir les émotions des êtres vivants.
        Il n’accorde sa confiance qu’aux gens calmes.
      de: |-
        Mit dem Fortsatz an seinem Kopf kann es die
        Gefühle von Lebewesen wahrnehmen. Es öffnet
        nur geruhsam veranlagten Leuten sein Herz.
      es: |-
        Percibe los sentimientos de los seres vivos con la
        protuberancia de la cabeza. Solo abre su corazón
        a quienes muestren un carácter sosegado.
      it: |-
        Percepisce lo stato d’animo degli esseri viventi
        tramite la protuberanza sulla testa. Apre il suo
        cuore solo alle persone di indole pacifica.
    shield:
      ja-Hrkt: |-
        ひとけの　ない　ばしょが　すき。
        つよい　かんじょうを　かんじとると
        いちもくさんに　にげだしてしまう。
      ja: |-
        人気の　ない　場所が　好き。
        強い　感情を　感じとると
        一目散に　逃げ出してしまう。
      ko: |-
        인적이 드문 곳을 좋아한다.
        강한 감정이 느껴지면
        쏜살같이 도망쳐버린다.
      zh-Hant: |-
        喜歡沒有人煙的地方。
        一旦感覺到強烈的情感，
        就會一溜煙地逃走。
      zh-Hans: |-
        喜欢没有人烟的地方。
        一旦感觉到强烈的感情，
        就会一溜烟地逃走。
      en: |-
        If this Pokémon senses a strong emotion, it
        will run away as fast as it can. It prefers areas
        without people.
      fr: |-
        Il aime les lieux inhabités.
        S’il perçoit des émotions trop fortes,
        il s’enfuit aussi vite que possible.
      de: |-
        Es liebt Orte, wo sonst niemand ist. Nimmt es
        starke Emotionen wahr, macht es sich so schnell
        es kann aus dem Staub.
      es: |-
        Siente predilección por los lugares despoblados.
        Si percibe una emoción intensa, emprende la
        huida a toda prisa.
      it: |-
        Gli piacciono i luoghi disabitati. Se percepisce
        la presenza di emozioni forti, se la dà a gambe
        levate.
