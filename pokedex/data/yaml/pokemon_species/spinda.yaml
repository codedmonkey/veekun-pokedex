      fr: |-
        Les motifs sur leur fourrure sont
        propres à chaque Spinda. Son pas
        chancelant le rend difficile à viser.
    white:
      en: |-
        No two Spinda have the same
        pattern of spots. Its tottering
        step fouls the aim of foes.
      fr: |-
        Les motifs sur leur fourrure sont
        propres à chaque Spinda. Son pas
        chancelant le rend difficile à viser.
    black-2:
      en: |-
        No two Spinda have the same
        pattern of spots. Its tottering
        step fouls the aim of foes.
    white-2:
      en: |-
        No two Spinda have the same
        pattern of spots. Its tottering
        step fouls the aim of foes.
    x:
      ja-Hrkt: |-
        おなじ　ブチもようの　パッチールは
        いない。フラフラした　あしどりで
        あいての　ねらいを　はずす。
      ja: |-
        同じ　ブチ模様の　パッチールは
        いない。フラフラした　足取りで
        相手の　ねらいを　外す。
      ko: |-
        똑같은 얼룩무늬의 얼루기는
        없다. 휘청휘청거리는 걸음걸이로
        상대의 노림수를 피한다.
      en: |-
        No two Spinda have the same pattern of spots.
        Its tottering step fouls the aim of foes.
      fr: |-
        Les motifs sur leur fourrure sont propres à chaque
        Spinda. Son pas chancelant le rend difficile à viser.
      de: |-
        Das Muster eines Pandir ist wie ein Fingerabdruck.
        Sein Taumeln senkt die gegnerische Zielsicherheit.
      es: |-
        No hay dos Spinda que tengan idénticos pelajes.
        Su tambaleo al bailar confunde a los rivales.
      it: |-
        Non ci sono due Spinda con lo stesso motivo
        maculato. Il suo passo barcollante confonde i nemici.
    'y':
      ja-Hrkt: |-
        おなじ　ブチもようの　パッチールが
        ぐうぜんに　であう　かくりつは
        ４０おくぶんの１　いかだ。
      ja: |-
        同じ　ブチ模様の　パッチールが
        偶然に　出会う　確率は
        ４０億分の１　以下だ。
      ko: |-
        똑같은 얼룩무늬의 얼루기를
        우연히 만날 확률은
        40억분의 1 이하다.
      en: |-
        The chances of two Spinda having identical spot
        patterns is less than one in four billion.
      fr: |-
        La chance que deux Spinda avec les mêmes motifs se
        rencontrent est de moins d’une pour quatre milliards.
      de: |-
        Die Wahrscheinlichkeit, dass sich zwei gleich
        gemusterte Pandir begegnen, ist vier Milliarden
        zu eins.
      es: |-
        La probabilidad de que dos Spinda con dibujos
        idénticos en su pelaje se encuentren es casi
        inexistente.
      it: |-
        La probabilità che due Spinda con lo stesso disegno
        si incontrino è praticamente nulla.
    omega-ruby:
      ja-Hrkt: |-
        よのなかに　いる　パッチールは　みんな　ちがう
        ところに　ブチもようが　あると　いわれている。
        おぼつかない　あゆみが　おどりのように　みえる。
      ja: |-
        世の中に　いる　パッチールは　みんな　違う
        ところに　ブチ模様が　あると　いわれている。
        おぼつかない　歩みが　踊りのように　見える。
      ko: |-
        세상에 있는 모든 얼루기는 얼룩무늬의
        위치가 다르다고 전해진다.
        불안한 걸음걸이가 춤추는 것처럼 보인다.
      en: |-
        All the Spinda that exist in the world are said to have utterly
        unique spot patterns. The shaky, tottering steps of this
        Pokémon give it the appearance of dancing.
      fr: |-
        On raconte que chaque Spinda dispose d’un agencement
        de taches tout à fait unique. La démarche chancelante et
        titubante de ce Pokémon donne l’impression qu’il danse.
      de: |-
        Jedes Pandir auf der Welt soll ein einzigartiges
        Fleckenmuster haben. Der schwankende Gang dieses
        Pokémon erweckt den Eindruck, es würde tanzen.
      es: |-
        Dicen que no hay dos Spinda que tengan los mismos dibujos
        en el pelaje. Este Pokémon tiene una forma de andar
        inestable, va tambaleándose. Da la sensación de ir bailando.
      it: |-
        Pare che ogni Spinda esistente abbia un motivo maculato
        unico rispetto agli altri. Il suo passo barcollante e malsicuro
        dà l’impressione che stia ballando.
    alpha-sapphire:
      ja-Hrkt: |-
        おなじ　ブチもようは　ないと　いわれている。
        いつも　めを　まわしている　ような　フラフラした
        うごきには　てきを　まどわせる　こうかが　ある。
      ja: |-
        同じ　ブチ模様は　ないと　いわれている。
        いつも　目を　回している　ような　フラフラした
        動きには　敵を　惑わせる　効果が　ある。
      ko: |-
        똑같은 얼룩무늬는 없다고 전해진다.
        항상 어지러운 것처럼 비틀거리며 움직이는데
        이에는 상대를 혼란시키는 효과가 있다.
      en: |-
        No two Spinda are said to have identical spot patterns on their
        hides. This Pokémon moves in a curious manner as if it is
        stumbling in dizziness. Its lurching movements can cause the
        opponent to become confused.
      fr: |-
        On dit que chaque Spinda dispose d’un agencement de
        taches unique. Ce Pokémon se déplace bizarrement, comme
        s’il titubait. Ses mouvements hésitants décontenancent
        ses ennemis.
      de: |-
        Jedes Pandir trägt ein einzigartiges Fleckenmuster auf
        seiner Haut. Dieses Pokémon bewegt sich höchst seltsam.
        Es schwankt und stolpert, als wäre ihm schwindlig. Seine
        schlingernden Bewegungen verwirren seine Gegner.
      es: |-
        No hay dos Spinda con los mismos dibujos en el pelaje. Este
        Pokémon se mueve de forma muy curiosa. Da la impresión
        de estar mareado. Se tambalea y puede llegar a causar
        confusión a su enemigo.
      it: |-
        Pare che non esistano due Spinda dall’identico motivo
        maculato. Questo Pokémon si muove in modo curioso
        barcollando come in preda alle vertigini. Tale comportamento
        può confondere l’avversario.
    sun:
      ja-Hrkt: |-
        フラフラ　おぼつかない　あしどりだが
        パッチールじたいは　まっすぐに
        あるいている　つもりだよ。
      ja: |-
        フラフラ　おぼつかない　足取りだが
        パッチール自体は　真っ直ぐに
        歩いている　つもりだよ。
      ko: |-
        휘청휘청 불안한 걸음걸이지만
        얼루기 본인은 똑바로
        걷고 있다고 생각한다.
      zh-Hant: |-
        雖然走路總是搖搖晃晃歪七扭八的，
        但晃晃斑自己是打算要
        筆直走路的哦。
      zh-Hans: |-
        晃晃悠悠，步伐不稳健，
        但晃晃斑自己是打算要
        笔直走路的哦。
      en: |-
        Its steps are staggering and unsteady, but
        Spinda thinks it’s walking in a straight line.
      fr: |-
        Bien qu’il semble peu assuré sur ses pattes,
        Spinda est quant à lui persuadé d’avancer
        tout droit, faisant fi de ses embardées.
      de: |-
        Pandir hat einen unsicheren, schwankenden
        Gang, obwohl es sich große Mühe gibt,
        geradeaus zu gehen.
      es: |-
        Aunque Spinda pretende avanzar en línea recta,
        no puede evitar andar tambaleándose.
      it: |-
        Si muove con passo incerto e barcollante,
        cercando invano di camminare dritto.
    moon:
      ja-Hrkt: |-
        ブチもようは　１ぴき１ぴき　ちがう。
        わずかなブチの　いちの　ちがいを
        たのしむ　マニアも　いるという。
      ja: |-
        ブチ模様は　１匹１匹　違う。
        僅かなブチの　位置の　違いを
        楽しむ　マニアも　いるという。
      ko: |-
        얼룩무늬는 1마리 1마리 다르다.
        얼룩 위치의 근소한 차이를
        즐기는 마니아도 있다고 한다.
      zh-Hant: |-
        每一隻身上的斑點花紋都不同。
        聽說也有愛好者以這細微的
        斑點位置的不同為樂。
      zh-Hans: |-
        每一只身上的斑点花纹都不同。
        听说也有爱好者以这细微的
        斑点位置的不同为乐。
      en: |-
        Each and every Spinda has a slightly different
        configuration of spots. There are collectors who
        enjoy the tiny differences in their spot patterns.
      fr: |-
        Chaque Spinda possède un pelage unique.
        Chercher les différences d’un Spinda à l’autre
        serait même un passe-temps pour certains.
      de: |-
        Jedes Pandir hat ein einzigartiges Flecken-
        muster. Kleine, aber feine Unterschiede:
        eine wahre Freude für eingefleischte Fans.
      es: |-
        Cada Spinda tiene dibujos diferentes en su
        pelaje. Dicen que algunos estudiosos disfrutan
        analizando los distintos patrones.
      it: |-
        Ogni Spinda ha un motivo maculato unico.
        Alcuni appassionati si divertono a notare
        le differenze nella posizione delle macchie.
    ultra-sun:
      ja-Hrkt: |-
        フラフラ　おぼつかない　あしどり。
        ながい　あいだ　あるきつづけると
        きぶんが　わるくなってしまう。
      ja: |-
        フラフラ　おぼつかない　足取り。
        長い　間　歩き続けると
        気分が　悪くなってしまう。
      ko: |-
        걸음걸이가 비틀비틀 불안하다.
        긴 시간 계속 걸으면
        기분이 나빠진다.
      zh-Hant: |-
        總是搖搖晃晃，連走都走不穩。
        如果連續走了太長的時間，
        身體就會不舒服。
      zh-Hans: |-
        晃晃悠悠，步伐不稳健。
        如果长时间连续行走，
        就会变得状态很差。
      en: |-
        Its steps are shaky and stumbling. Walking for a
        long time makes it feel sick.
      fr: |-
        Il déambule d’un pas chancelant. S’il marche
        trop longtemps, il finit par avoir le tournis.
      de: |-
        Es hat einen unsicheren, schwankenden Gang.
        Wenn es längere Zeit läuft, wird ihm schlecht.
      es: |-
        Se mueve tambaleándose de un lado para otro
        y termina mareado si camina durante un largo
        período.
      it: |-
        Si muove con passo incerto e barcollante.
        Se cammina troppo finisce per sentirsi male.
    ultra-moon:
      ja-Hrkt: |-
        １ぴきずつ　ブチもようは　ことなる。
        フラフラした　うごきで　あいての
        こうげきを　ぜつみょうに　かわすぞ。
      ja: |-
        １匹ずつ　ブチ模様は　異なる。
        フラフラした　動きで　相手の
        攻撃を　絶妙に　かわすぞ。
      ko: |-
        개체마다 얼룩무늬가 다르다.
        비틀거리는 움직임으로
        상대의 공격을 절묘하게 피한다.
      zh-Hant: |-
        每一隻身上的斑點都不一樣。
        會用搖搖晃晃的動作
        巧妙地避開對手的攻擊。
      zh-Hans: |-
        每一只身上的斑点花纹都不同。
        会用晃晃悠悠的动作
        绝妙地躲避对手的攻击。
      en: |-
        Each Spinda’s spot pattern is different. With its
        stumbling movements, it evades opponents’
        attacks brilliantly!
      fr: |-
        Chaque Spinda possède un pelage unique.
        Ce Pokémon esquive les attaques de son
        adversaire grâce à d’imprévisibles oscillations.
      de: |-
        Jedes Pandir hat ein anderes Fleckenmuster.
        Mit seinem taumelnden Gang weicht es
        gegnerischen Angriffen souverän aus.
      es: |-
        Los dibujos en el pelaje de cada Spinda son
        diferentes. Esquiva de forma asombrosa los
        ataques de los rivales gracias a sus tambaleos.
      it: |-
        Ogni Spinda ha un motivo maculato unico.
        Grazie ai suoi movimenti incerti, riesce a
        schivare brillantemente gli attacchi nemici.
