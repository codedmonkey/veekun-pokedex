        wrong.
    emerald:
      en: |-
        A DITTO rearranges its cell structure to
        transform itself. However, if it tries to
        change based on its memory, it will get
        details wrong.
    firered:
      en: |-
        It can freely recombine its own cellular
        structure to transform into other life-
        forms.
    leafgreen:
      en: |-
        Capable of copying an opponent’s genetic
        code to instantly transform itself into a
        duplicate of the enemy.
    diamond:
      en: |-
        It has the ability to reconstitute
        its entire cellular structure to
        transform into whatever it sees.
    pearl:
      en: |-
        It has the ability to reconstitute
        its entire cellular structure to
        transform into whatever it sees.
    platinum:
      en: |-
        It has the ability to reconstitute
        its entire cellular structure to
        transform into whatever it sees.
    heartgold:
      en: |-
        It can transform into anything.
        When it sleeps, it changes into a
        stone to avoid being attacked.
    soulsilver:
      en: |-
        Its transformation ability is perfect.
        However, if made to laugh, it
        can’t maintain its disguise.
    black:
      en: |-
        It has the ability to reconstitute
        its entire cellular structure to
        transform into whatever it sees.
      fr: |-
        Il a la capacité de modifier sa
        structure cellulaire pour prendre
        l’apparence de ce qu’il voit.
    white:
      en: |-
        It has the ability to reconstitute
        its entire cellular structure to
        transform into whatever it sees.
      fr: |-
        Il a la capacité de modifier sa
        structure cellulaire pour prendre
        l’apparence de ce qu’il voit.
    black-2:
      en: |-
        It can reconstitute its entire cellular
        structure to change into what it sees,
        but it returns to normal when it relaxes.
    white-2:
      en: |-
        It can reconstitute its entire cellular
        structure to change into what it sees,
        but it returns to normal when it relaxes.
    x:
      ja-Hrkt: |-
        ぜんしんの　さいぼうを　くみかえて
        みたものの　かたち　そっくりに
        へんしんする　のうりょくを　もつ。
      ja: |-
        全身の　細胞を　組み替えて
        見たものの　形　そっくりに
        変身する　能力を　持つ。
      ko: |-
        전신의 세포를 재구성해서
        본 것의 모양과 똑 닮게
        변신하는 능력을 가지고 있다.
      en: |-
        It has the ability to reconstitute its entire cellular
        structure to transform into whatever it sees.
      fr: |-
        Il a la capacité de modifier sa structure cellulaire pour
        prendre l’apparence de ce qu’il voit.
      de: |-
        Es kann seine Zellstruktur so verändern, dass es
        sich in alles verwandeln kann, was es sieht.
      es: |-
        Puede alterar por completo su estructura celular para
        emular cualquier objeto que vea.
      it: |-
        Ha la capacità di modificare la sua struttura cellulare
        per trasformarsi in qualsiasi cosa veda.
    'y':
      ja-Hrkt: |-
        からだの　さいぼうの　つくりを
        じぶんで　くみかえて　ほかの
        せいめいたいに　へんしんする。
      ja: |-
        体の　細胞の　作りを
        自分で　組み替えて
        ほかの　生命体に　変身する。
      ko: |-
        몸의 세포 구성을
        스스로 바꿔서 다른
        생명체로 변신한다.
      en: |-
        It can freely recombine its own cellular structure to
        transform into other life-forms.
      fr: |-
        Métamorph peut modifier sa structure cellulaire à
        sa guise pour se transformer en n’importe quelle
        forme vivante.
      de: |-
        Es kann seine eigene Zellstruktur frei zusammensetzen
        und sich in jede andere Lebensform verwandeln.
      es: |-
        Tiene la capacidad de reorganizar su estructura celular
        para convertirse en otras formas de vida.
      it: |-
        Può ricombinare a piacere la propria struttura
        cellulare per trasformarsi in altri esseri viventi.
    omega-ruby:
      ja-Hrkt: |-
        からだの　さいぼうを　くみかえて　へんしんする。
        おもいだしながら　いぜん　みた　ものに　かわると
        ちょっと　ちがう　かたちに　なってしまうのだ。
      ja: |-
        体の　細胞を　組み替えて　変身する。
        思い出しながら　以前　見た　ものに　変わると
        ちょっと　違う　形に　なってしまうのだ。
      ko: |-
        몸의 세포를 재구성하여 변신한다.
        전에 봤던 것을 기억해내면서 바뀌면
        조금 다른 형태가 되어버린다.
      en: |-
        Ditto rearranges its cell structure to transform itself into other
        shapes. However, if it tries to transform itself into something
        by relying on its memory, this Pokémon manages to get
        details wrong.
      fr: |-
        Métamorph peut modifier sa structure moléculaire pour
        prendre d’autres formes. Lorsqu’il essaie de se transformer
        de mémoire, il lui arrive de se tromper sur certains détails.
      de: |-
        Ditto verändert seine Zellstruktur, um sich in eine andere Form
        zu verwandeln. Wenn es sich dabei jedoch auf sein Gedächtnis
        verlässt, unterlaufen diesem Pokémon schon mal Fehler.
      es: |-
        Ditto reorganiza la estructura de sus células para adoptar
        otras formas. Pero, como intente transformarse en algo
        guiándose por los datos que tenga almacenados en la
        memoria, habrá detalles que se le escapen.
      it: |-
        Ditto cambia la sua struttura cellulare per assumere molte
        altre forme. Tuttavia, quando si affida solo alla sua memoria,
        talvolta dimentica dettagli importanti.
    alpha-sapphire:
      ja-Hrkt: |-
        からだの　さいぼうを　くみかえて　へんしんする。
        おもいだしながら　いぜん　みた　ものに　かわると
        ちょっと　ちがう　かたちに　なってしまうのだ。
      ja: |-
        体の　細胞を　組み替えて　変身する。
        思い出しながら　以前　見た　ものに　変わると
        ちょっと　違う　形に　なってしまうのだ。
      ko: |-
        몸의 세포를 재구성하여 변신한다.
        전에 봤던 것을 기억해내면서 바뀌면
        조금 다른 형태가 되어버린다.
      en: |-
        Ditto rearranges its cell structure to transform itself into other
        shapes. However, if it tries to transform itself into something
        by relying on its memory, this Pokémon manages to get
        details wrong.
      fr: |-
        Métamorph peut modifier sa structure moléculaire pour
        prendre d’autres formes. Lorsqu’il essaie de se transformer
        de mémoire, il lui arrive de se tromper sur certains détails.
      de: |-
        Ditto verändert seine Zellstruktur, um sich in eine andere Form
        zu verwandeln. Wenn es sich dabei jedoch auf sein Gedächtnis
        verlässt, unterlaufen diesem Pokémon schon mal Fehler.
      es: |-
        Ditto reorganiza la estructura de sus células para adoptar
        otras formas. Pero, como intente transformarse en algo
        guiándose por los datos que tenga almacenados en la
        memoria, habrá detalles que se le escapen.
      it: |-
        Ditto cambia la sua struttura cellulare per assumere molte
        altre forme. Tuttavia, quando si affida solo alla sua memoria,
        talvolta dimentica dettagli importanti.
    sun:
      ja-Hrkt: |-
        さいぼうを　くみかえ　みた　あいて
        そっくりに　すがたを　へんかさせる。
        さいげんどは　こたいに　よる。
      ja: |-
        細胞を　組み替え　みた　相手
        そっくりに　姿を　変化させる。
        再現度は　個体に　よる。
      ko: |-
        세포를 재구성하여 본 상대와
        똑같이 모습을 변화시킨다.
        재현도는 개체에 따라 다르다.
      zh-Hant: |-
        利用細胞重組將自己的模樣變成
        和眼前的對手一模一樣。
        相似度會因個體而異。
      zh-Hans: |-
        通过重组细胞让自己样子变得
        和眼前的对手一模一样。
        相似度依个体而有所不同。
      en: |-
        It can reorganize its cells to make itself into a
        duplicate of anything it sees. The quality of the
        duplicate depends on the individual.
      fr: |-
        Il peut modifier sa structure moléculaire pour
        prendre l’apparence de son adversaire. Le degré
        de ressemblance dépend de chaque individu.
      de: |-
        Es verändert seine Zellstruktur, um die Gestalt
        anderer Lebewesen, die es sieht, anzunehmen.
        Wie gut das Ebenbild ist, variiert nach Exemplar.
      es: |-
        Ditto reorganiza la estructura de sus células
        para adoptar la forma de su oponente. La
        calidad de la copia varía de Ditto a Ditto.
      it: |-
        Cambia la sua struttura molecolare per
        assumere le sembianze del nemico. Il grado di
        riuscita varia a seconda del Pokémon.
    moon:
      ja-Hrkt: |-
        おどろきの　へんしんのうりょくで
        どんなものとも　なかまに　なれる。
        メタモンどうしは　なかが　わるい。
      ja: |-
        驚きの　変身能力で
        どんな者とも　仲間に　なれる。
        メタモン同士は　仲が　悪い。
      ko: |-
        놀라운 변신 능력으로
        누구와도 동료가 될 수 있다.
        메타몽끼리는 사이가 나쁘다.
      zh-Hant: |-
        因其驚人的變身能力，
        無論與誰都能成為夥伴。
        但是百變怪同類之間的關係惡劣。
      zh-Hans: |-
        因其惊人的变身能力，
        无论与谁都能成为伙伴。
        但是百变怪同类间关系恶劣。
      en: |-
        With its astonishing capacity for
        metamorphosis, it can get along with anything.
        It does not get along well with its fellow Ditto.
      fr: |-
        Grâce à son don de transformation, ce Pokémon
        peut devenir l’ami de tous les êtres vivants, sauf
        des autres Métamorph, qu’il déteste.
      de: |-
        Dank seiner Fähigkeiten als Gestaltwandler
        kann es sich mit allen Lebewesen anfreunden.
        Nur mit Artgenossen kommt es nicht zurecht.
      es: |-
        Ditto puede hacerse amigo de otros Pokémon
        gracias a su habilidad para transformarse. Sin
        embargo, los Ditto no se llevan bien entre sí.
      it: |-
        Grazie alle sue incredibili doti metamorfiche,
        può assumere le sembianze di qualunque essere
        vivente. I Ditto non vanno d’accordo fra di loro.
    ultra-sun:
      ja-Hrkt: |-
        どんなものにも　へんしん　できるが
        メタモンごとに　とくいな　ものと
        にがてな　ものが　あるらしい。
      ja: |-
        どんなものにも　変身　できるが
        メタモンごとに　得意な　ものと
        苦手な　ものが　あるらしい。
      ko: |-
        뭐든지 변신할 수 있지만
        메타몽마다 잘하는 변신과
        잘 못하는 변신이 있다고 한다.
      zh-Hant: |-
        能夠變身成任何東西，
        但每隻百變怪似乎各自有
        擅長和不擅長變形的對象。
      zh-Hans: |-
        可以变身成任何东西，
        但好像每只百变怪都有着自己
        擅长和不擅长变形的东西。
      en: |-
        While it can transform into anything, each Ditto
        apparently has its own strengths and
        weaknesses when it comes to transformations.
      fr: |-
        Il peut prendre l’apparence de n’importe quoi,
        mais chaque Métamorph a son propre domaine
        de prédilection et ses propres faiblesses.
      de: |-
        Ditto kann jede beliebige Gestalt annehmen,
        wobei aber jedes Exemplar individuelle
        Stärken und Schwächen aufweist.
      es: |-
        Los Ditto pueden adoptar cualquier aspecto,
        pero cada individuo tiene un objeto de imitación
        que se le da mejor que otros.
      it: |-
        Ditto è in grado di assumere le sembianze di
        qualsiasi cosa. Ogni esemplare riesce meglio
        in alcune trasformazioni piuttosto che in altre.
    ultra-moon:
      ja-Hrkt: |-
        みたものに　へんしん　する。　ただし
        めのまえに　いないものの　ときは
        きおくしだいなので　しっぱいもする。
      ja: |-
        見たものに　変身　する。　ただし
        目の前に　いないものの　ときは
        記憶次第なので　失敗もする。
      ko: |-
        본 적이 있는 것으로 변신한다.
        단 눈앞에 없는 것으로 변신할 때는
        기억에 따르기 때문에 실패하기도 한다.
      zh-Hant: |-
        能變身成自己看過的東西。
        但當對象不在眼前時，因為只能
        靠記憶來變身，所以有時會失敗。
      zh-Hans: |-
        会变身成它看到的东西。
        但对于不在眼前的东西，它只能靠
        记忆来变身，所以有时也会失败。
      en: |-
        It transforms into whatever it sees. If the thing
        it’s transforming into isn’t right in front of it,
        Ditto relies on its memory—so sometimes it fails.
      fr: |-
        Il prend la forme de ce qu’il voit. Lorsqu’il n’a
        pas de modèle sous les yeux, il doit se fier à sa
        mémoire et le résultat laisse parfois à désirer.
      de: |-
        Es kann sich in alles verwandeln, was es sieht.
        Muss es sich dabei aber auf sein Gedächtnis
        verlassen, macht es manchmal auch Fehler.
      es: |-
        Puede transformarse en cualquier cosa que vea,
        pero, si intenta hacerlo de memoria, habrá
        detalles que se le escapen.
      it: |-
        Si trasforma in qualsiasi cosa veda. Tuttavia,
        quando non ha di fronte il suo modello si affida
        alla memoria, e talvolta sbaglia.
    lets-go-pikachu:
      ja-Hrkt: |-
        あいてをみた　しゅんかん　からだが
        とけるように　へんかを　はじめる。
        ほぼ　おなじかたちに　へんしんする。
      ja: |-
        相手を見た　瞬間　体が
        溶けるように　変化を　始める。
        ほぼ　同じ形に　変身する。
      ko: |-
        상대를 본 순간 몸이
        녹는 것처럼 변화하기 시작한다.
        거의 똑같은 모습으로 변신한다.
      zh-Hant: |-
        在看見對手的瞬間，身體就會
        像融化般開始變化，最後變成
        與對手幾乎相同的模樣。
      zh-Hans: |-
        看到敌人的一瞬间身体便如同
        要融化一般开始转变，几乎能
        变身成和对方完全相同的样子。
      en: |-
        When it spots an enemy, its body transfigures
        into an almost-perfect copy of its opponent.
      fr: |-
        Quand il repère un ennemi, il adapte son corps
        pour en faire une copie presque parfaite de
        celui de son adversaire.
      de: |-
        Wenn es einen Gegner ausmacht, verwandelt es
        seinen Körper in eine nahezu perfekte Kopie
        seines Gegenübers.
      es: |-
        Cuando se fija en un enemigo, su cuerpo se
        transforma en una copia casi perfecta del
        mismo.
      it: |-
        Quando incontra un nemico è capace di
        trasformarsi in un baleno in una sua copia
        quasi perfetta.
    lets-go-eevee:
      ja-Hrkt: |-
        あいてをみた　しゅんかん　からだが
        とけるように　へんかを　はじめる。
        ほぼ　おなじかたちに　へんしんする。
      ja: |-
        相手を見た　瞬間　体が
        溶けるように　変化を　始める。
        ほぼ　同じ形に　変身する。
      ko: |-
        상대를 본 순간 몸이
        녹는 것처럼 변화하기 시작한다.
        거의 똑같은 모습으로 변신한다.
      zh-Hant: |-
        在看見對手的瞬間，身體就會
        像融化般開始變化，最後變成
        與對手幾乎相同的模樣。
      zh-Hans: |-
        看到敌人的一瞬间身体便如同
        要融化一般开始转变，几乎能
        变身成和对方完全相同的样子。
      en: |-
        When it spots an enemy, its body transfigures
        into an almost-perfect copy of its opponent.
      fr: |-
        Quand il repère un ennemi, il adapte son corps
        pour en faire une copie presque parfaite de
        celui de son adversaire.
      de: |-
        Wenn es einen Gegner ausmacht, verwandelt es
        seinen Körper in eine nahezu perfekte Kopie
        seines Gegenübers.
      es: |-
        Cuando se fija en un enemigo, su cuerpo se
        transforma en una copia casi perfecta del
        mismo.
      it: |-
        Quando incontra un nemico è capace di
        trasformarsi in un baleno in una sua copia
        quasi perfetta.
    sword:
      ja-Hrkt: |-
        ぜんしんの　さいぼうを　くみかえて
        みたもの　そっくりに　へんしんするが
        ちからが　ぬけると　もとにもどる。
      ja: |-
        全身の　細胞を　組み替えて
        見たもの　そっくりに　変身するが
        力が　抜けると　もとにもどる。
      ko: |-
        전신의 세포를 재구성해서
        본 것과 똑 닮게 변신하지만
        힘이 빠지면 원래대로 돌아간다.
      zh-Hant: |-
        能夠藉由重組全身的細胞，
        變得與看到的東西一模一樣，
        然而一旦放鬆就會變回原形。
      zh-Hans: |-
        能够通过重组全身的细胞，
        变得与看到的东西一模一样，
        然而一旦放松就会变回原形。
      en: |-
        It can reconstitute its entire cellular
        structure to change into what it sees,
        but it returns to normal when it relaxes.
      fr: |-
        Il modifie sa structure cellulaire pour copier
        l’apparence de ce qu’il voit, mais au repos,
        il reprend sa forme normale.
      de: |-
        Es modifiziert seine Zellstruktur, um sich in alles
        zu verwandeln, was es sieht. Im entspannten
        Zustand nimmt es wieder seine Ausgangsform an.
      es: |-
        Redistribuye las células de su cuerpo para cobrar
        la apariencia de lo que ve, pero vuelve a la
        normalidad al relajarse.
      it: |-
        Può modificare la sua struttura cellulare per
        assumere le sembianze di ciò che vede.
        Ritorna se stesso quando è stanco.
    shield:
      ja-Hrkt: |-
        メタモンどうし　であってしまうと
        あいてそっくりの　かたちに　なろうと
        いつもより　はげしく　うごく。
      ja: |-
        メタモン同士　出会ってしまうと
        相手そっくりの　形に　なろうと
        いつもより　激しく　動く。
      ko: |-
        메타몽끼리 만나게 되면
        상대와 똑같은 모습이 되기 위해
        평소보다 격렬하게 움직인다.
      zh-Hant: |-
        當兩隻百變怪相遇的時候，
        為了能變成和對方相同的樣子，
        牠們動起來會比平常更加劇烈。
      zh-Hans: |-
        当两只百变怪相遇的时候，
        为了能变成和对方相同的样子，
        它们动起来会比平常更加剧烈。
      en: |-
        When it encounters another Ditto, it will move
        faster than normal to duplicate that opponent exactly.
      fr: |-
        Quand il rencontre l’un de ses semblables,
        il s’agite avec plus de vivacité que d’habitude
        pour adopter exactement la même forme que lui.
      de: |-
        Trifft es auf ein anderes Ditto, bewegt es sich
        schneller als gewöhnlich, um es exakt
        nachzuahmen.
      es: |-
        Cuando se encuentra con otro Ditto, se mueve
        más rápido de lo normal para intentar adoptar
        su aspecto.
      it: |-
        Quando incontra un altro Ditto, si muove più
        velocemente del solito nel tentativo di assumere
        le sue sembianze.
