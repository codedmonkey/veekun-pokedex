dragapult:
  base_happiness: 50
  capture_rate: 45
  color: green
  egg_groups:
    - indeterminate
    - dragon
  evolution_chain: dreepy
  evolves_from: drakloak
  flavor_text:
    sword:
      ja-Hrkt: |-
        ツノの　あなに　ドラメシヤを　いれて
        くらす。　たたかいになると　マッハの
        スピードで　ドラメシヤを　とばす。
      ja: |-
        ツノの　穴に　ドラメシヤを　入れて
        暮らす。　戦いになると　マッハの
        スピードで　ドラメシヤを　飛ばす。
      ko: |-
        뿔에 있는 구멍에 드라꼰을 넣고
        지낸다. 싸움이 시작되면 마하의
        스피드로 드라꼰을 날린다.
      zh-Hant: |-
        讓多龍梅西亞住在自己角上的
        洞裡。戰鬥開始後會用音速
        將多龍梅西亞發射出去。
      zh-Hans: |-
        让多龙梅西亚住在自己角上的
        洞里。战斗开始后会用音速
        将多龙梅西亚发射出去。
      en: |-
        When it isn’t battling, it keeps Dreepy in the
        holes on its horns. Once a fight starts, it launches
        the Dreepy like supersonic missiles.
      fr: |-
        Il vit en compagnie de Fantyrm qui logent
        dans les trous de ses cornes. Quand il passe
        à l’attaque, il les propulse à la vitesse du son.
      de: |-
        Es transportiert Grolldra in den Löchern an
        seinen Hörnern. Kommt es zum Kampf, schießt
        es diese mit Mach-Geschwindigkeit ab.
      es: |-
        Vive en compañía de Dreepy, a los que hospeda
        en el interior de sus cuernos. Los dispara a
        velocidad supersónica en combate.
      it: |-
        Vive assieme ai Dreepy, che ospita all’interno
        dei buchi sulle sue corna. Quando lotta
        li espelle alla velocità del suono.
    shield:
      ja-Hrkt: |-
        ツノに　はいった　ドラメシヤは
        マッハの　スピードで　とばされるのを
        こころまちに　しているらしい。
      ja: |-
        ツノに　入った　ドラメシヤは
        マッハの　スピードで　飛ばされるのを
        心待ちに　しているらしい。
      ko: |-
        뿔에 들어간 드라꼰은
        마하의 속도로 날려지기를
        기대하고 있는 것 같다.
      zh-Hant: |-
        牠角裡的多龍梅西亞
        似乎滿心期待著能被
        以音速發射出去。
      zh-Hans: |-
        它角里的多龙梅西亚
        似乎满心期待着能被
        以音速发射出去。
      en: |-
        Apparently the Dreepy inside Dragapult’s
        horns eagerly look forward to being launched out
        at Mach speeds.
      fr: |-
        Il paraît que les Fantyrm installés dans ses cornes
        attendent impatiemment le moment où ils seront
        propulsés à la vitesse du son.
      de: |-
        Die Grolldra, die in seinen Hörnern sitzen,
        warten angeblich voller Spannung darauf, mit
        Mach-Geschwindigkeit abgefeuert zu werden.
      es: |-
        Al parecer, los Dreepy que residen en sus
        cuernos esperan con ilusión el momento de ser
        propulsados a velocidad supersónica.
      it: |-
        I Dreepy che vivono nelle sue corna attendono
        ansiosamente di essere sparati alla velocità
        del suono.
