decidueye:
  base_happiness: 50
  capture_rate: 45
  color: brown
  egg_groups:
    - flying
  evolution_chain: rowlet
  evolves_from: dartrix
  flavor_text:
    sun:
      ja-Hrkt: |-
        つばさに　しこまれた　やばねを
        つがえてはなつ。　１００メートルさきの
        こいしも　つらぬく　せいど。
      ja: |-
        翼に　仕込まれた　矢羽を
        番えて放つ。　１００メートル先の
        小石も　貫く　精度。
      ko: |-
        날개에 숨겨진 살깃을 시위에
        메겨서 날린다. 100m 앞의
        작은 돌도 관통하는 정밀함이다.
      zh-Hant: |-
        托弓拉弦射出藏在翅膀裡的箭羽。
        精準度高到連前方１００米遠的
        小石頭也能貫穿。
      zh-Hans: |-
        搭弦射出收藏在翅膀里的箭羽。
        有着连前方１００米的小石头
        也能穿透的精度。
      en: |-
        It fires arrow quills from its wings with such
        precision, they can pierce a pebble at distances
        over a hundred yards.
      fr: |-
        Les plumes de ses ailes lui servent de flèches.
        Sa précision au tir est si grande qu’il peut
        atteindre un gravillon à 100 m.
      de: |-
        Dieses Pokémon kann die Federn seiner Flügel
        wie Pfeile verschießen. Dabei ist es so präzise,
        dass es einen Kiesel auf 100 m durchbohrt.
      es: |-
        Las plumas de sus alas le sirven de flechas con
        las que puede acertar a un guijarro a 100 m.
      it: |-
        Scocca piume dalle sue ali come se fossero
        frecce. È preciso al punto da riuscire a centrare
        una piccola pietra a 100 m di distanza.
    moon:
      ja-Hrkt: |-
        きほんてきに　ようじんぶかく
        クールだが　ふいを　つかれると
        だいパニックに　おちいってしまう。
      ja: |-
        基本的に　用心深く
        クールだが　不意を　つかれると
        大パニックに　陥ってしまう。
      ko: |-
        기본적으로 신중하고
        쿨하지만 허를 찔리면
        크게 패닉에 빠져버린다.
      zh-Hant: |-
        基本上性格謹慎而冷靜，
        但如果受到突如其來的襲擊，
        就會陷入巨大的驚慌中。
      zh-Hans: |-
        基本上是十分谨慎且冷静的，
        但如果被冷不防地袭击了，
        就会陷入巨大的恐慌中。
      en: |-
        Although basically cool and cautious, when it’s
        caught by surprise, it’s seized by panic.
      fr: |-
        Malgré sa grande vigilance et son air posé,
        il a tendance à céder à la panique dès qu’il est
        pris de court.
      de: |-
        Im Grunde ein vorsichtiges und gelassenes
        Pokémon, das jedoch in wahnsinnige Panik
        verfällt, wenn es überrascht wird.
      es: |-
        Aunque es extremadamente cauteloso y
        calmado por naturaleza, si lo pillan por
        sorpresa, el pánico se apodera de él.
      it: |-
        In genere è molto cauto e misurato, ma nei rari
        casi in cui viene colto di sorpresa si lascia
        facilmente prendere dal panico.
    ultra-sun:
      ja-Hrkt: |-
        やばねを　つがえ　あいてに　はなつ。
        ぜったい　はずせないときは　あたまの
        ツルをひき　しゅうちゅう　するのだ。
      ja: |-
        矢羽を　つがえ　相手に　放つ。
        絶対　外せない時は　頭の
        ツルを引き　集中　するのだ。
      ko: |-
        살깃을 시위에 메겨서 상대에게 날린다.
        반드시 명중시켜야 할 때는
        머리의 시위를 당겨 집중한다.
      zh-Hant: |-
        會搭上箭羽朝對手射出。
        在絕對必須射中的時候，
        會拉緊頭上的藤蔓來集中精神。
      zh-Hans: |-
        会搭上箭羽射向对手。
        在绝对不想射偏时，
        会拉紧头上的藤蔓集中精神。
      en: |-
        It nocks its arrow quills and shoots them at
        opponents. When it simply can’t afford to miss,
        it tugs the vine on its head to improve its focus.
      fr: |-
        Les plumes de ses ailes lui servent de flèches.
        Quand il doit à tout prix toucher sa cible, il tire
        sur les lianes de son cou pour se concentrer.
      de: |-
        Es legt seine Federpfeile an, um sie auf Gegner
        zu schießen. Muss ein Schuss sitzen, zieht es
        zur Konzentration an einer seiner Kopfranken.
      es: |-
        Usa sus plumas como flechas para atacar a los
        rivales. Si no puede permitirse fallar, frunce su
        capucha para concentrarse mejor.
      it: |-
        Scocca piume come fossero frecce. Quando non
        deve mancare il bersaglio, tira le liane del
        cappuccio per ridurne l’apertura e mirare meglio.
    ultra-moon:
      ja-Hrkt: |-
        わずか　０．１びょうで　ハネを
        つがえて　てきを　うつ。　まばたきの
        あいだに　しょうぶが　ついている。
      ja: |-
        わずか　０．１秒で　ハネを
        番えて　敵を　撃つ。　瞬きの
        間に　勝負が　ついている。
      ko: |-
        불과 0.1초만에
        살깃을 시위에 메겨 적을 공격한다.
        눈 깜짝할 사이에 승부가 나 있다.
      zh-Hant: |-
        只需要０．１秒就能
        搭上羽毛向敵人射擊，
        在一瞬間決定勝負。
      zh-Hans: |-
        仅用０.１秒就能搭上羽毛，
        向敌人射击。
        在一瞬之间决出胜负。
      en: |-
        Decidueye can nock and fire an arrow at an
        enemy in a tenth of a second, so its battles are
        decided in the blink of an eye.
      fr: |-
        Il est capable de décocher ses plumes sur
        son ennemi en un dixième de seconde,
        s’assurant ainsi la victoire en un clin d’œil.
      de: |-
        Es braucht bloß 0,1 Sekunden, um eine Feder
        anzulegen und auf den Gegner zu schießen.
        Oft besiegt es einen, bevor man blinzeln kann.
      es: |-
        Tan solo le lleva una décima de segundo sacar
        una pluma y disparar al rival, y muchas veces
        gana el combate en un abrir y cerrar de ojos.
      it: |-
        È in grado di scoccare piume e colpire il nemico
        in un decimo di secondo, aggiudicandosi la
        vittoria in un batter d’occhio.
    sword:
      ja-Hrkt: |-
        つばさに　しこまれた　やばねを
        ゆみやのように　つがえて　はなつ。
        ねらった　まとは　はずさない。
      ja: |-
        翼に　仕込まれた　矢羽根を
        弓矢のように　つがえて　放つ。
        狙った　的は　外さない。
      ko: |-
        날개에 숨겨진 살깃을
        활과 화살처럼 이용해서 쏜다.
        노린 표적은 빗나가지 않는다.
      zh-Hant: |-
        會像射箭那樣射出
        藏在自己翅膀裡的箭羽。
        只要瞄準目標就絕不會射偏。
      zh-Hans: |-
        会像射箭那样射出
        藏在自己翅膀里的箭羽。
        只要瞄准目标就绝不会射偏。
      en: |-
        As if wielding a bow, it launches the arrow quills
        hidden among the feathers of its wings.
        Decidueye’s shots never miss.
      fr: |-
        Il décoche les plumes acérées de ses ailes
        comme des flèches. Il ne rate jamais sa cible.
      de: |-
        Dieses Pokémon kann die Federn seiner Flügel
        wie Pfeile abschießen. Hat es sein Ziel angepeilt,
        trifft es garantiert.
      es: |-
        Usa sus plumas como flechas para atacar a los
        rivales. Una vez que ha fijado el blanco, no falla
        jamás.
      it: |-
        Scocca piume dalle sue ali come fossero frecce
        lanciate da un arco. Una volta presa la mira,
        non manca mai il bersaglio.
    shield:
      ja-Hrkt: |-
        ０．１びょうで　やばねを　つばさの
        つるに　つがえて　はなつ。　あいてが
        きづくまえに　きゅうしょを　いぬく。
      ja: |-
        ０．１秒で　矢羽根を　翼の
        蔓に　つがえて　放つ。　相手が
        気づく前に　急所を　射貫く。
      ko: |-
        0.1초 만에 화살깃을 날개에 달린
        시위에 메겨 발사한다. 상대가
        알아차리기 전에 급소를 꿰뚫어버린다.
      zh-Hant: |-
        只要０.１秒就可以在翅膀的
        藤蔓上搭好箭羽、射向敵人，
        並在敵人發現前貫穿其要害。
      zh-Hans: |-
        只要０.１秒就可以在翅膀的
        藤蔓上搭好箭羽、射向敌人，
        并在敌人发现前贯穿其要害。
      en: |-
        In a tenth of a second, it can nock and fire an
        arrow quill, piercing an opponent’s weak point
        before they notice what’s happening.
      fr: |-
        Il décoche ses plumes acérées en un dixième
        de seconde. Sa victime n’a pas le temps de
        le voir agir qu’elle est déjà grièvement touchée.
      de: |-
        In 0,1 Sekunden spannt es eine Feder in seine
        Flügelranke und schießt sie wie einen Pfeil auf
        die Schwachstellen seines ahnungslosen Ziels.
      es: |-
        Tan solo le lleva una décima de segundo sacar
        una pluma y disparar al rival, a quien acierta en
        un punto vital antes de que pueda darse cuenta.
      it: |-
        Può preparare e scoccare una delle sue piume
        affilate in 0,1 secondi. Trafigge l’avversario
        nei suoi punti vitali prima che se ne accorga.
