zamazenta:
  base_happiness: 0
  capture_rate: 10
  color: red
  egg_groups:
    - no-eggs
  evolution_chain: zamazenta
  evolves_from: ~
  flavor_text:
    sword:
      ja-Hrkt: |-
        ひとのおうと　ちからを　あわせ
        ガラルを　すくった　ポケモン。
        きんぞくを　とりこみ　たたかう。
      ja: |-
        人の王と　力を　あわせ
        ガラルを　救った　ポケモン。
        金属を　取り込み　戦う。
      ko: |-
        인간의 왕과 힘을 합쳐
        가라르를 구한 포켓몬.
        금속을 흡수해서 싸운다.
      zh-Hant: |-
        與眾人之王協力
        拯救了伽勒爾的寶可夢。
        吸收金屬來進行戰鬥。
      zh-Hans: |-
        与众人之王协力
        拯救了伽勒尔的宝可梦。
        吸收金属来进行战斗。
      en: |-
        In times past, it worked together with a king of
        the people to save the Galar region. It absorbs
        metal that it then uses in battle.
      fr: |-
        Ce Pokémon sauva autrefois Galar en joignant
        ses forces à celles du roi des Hommes.
        Il absorbe du métal quand il passe au combat.
      de: |-
        Dieses Pokémon vereinte seine Kräfte mit einem
        Menschenkönig und rettete die Galar-Region.
        Es nimmt Metall in sich auf und kämpft damit.
      es: |-
        Este Pokémon se erigió en salvador de Galar,
        tras unir fuerzas con un rey de los hombres.
        Absorbe el metal para utilizarlo en combate.
      it: |-
        Ha salvato Galar unendo le forze con il re
        degli uomini. Assorbe il metallo e se ne serve
        per lottare.
    shield:
      ja-Hrkt: |-
        せきぞうの　ような　すがたで
        わすれさられるほどの　あいだ
        ねむりに　ついていた　ポケモン。
      ja: |-
        石像の　ような　姿で
        忘れ去られるほどの　あいだ
        眠りに　ついていた　ポケモン。
      ko: |-
        석상 같은 모습으로
        잊혀질 정도의 세월 동안
        잠들어 있던 포켓몬이다.
      zh-Hant: |-
        以石像般的姿態陷入
        長久沉眠的寶可夢。
        幾乎就要被人們所遺忘。
      zh-Hans: |-
        以石像般的姿态陷入
        长久沉眠的宝可梦。
        几乎就要被人们所遗忘。
      en: |-
        This Pokémon slept for aeons while in the form of
        a statue. It was asleep for so long, people forgot
        that it ever existed.
      fr: |-
        Ce Pokémon, changé en statue, est resté pétrifié
        si longtemps qu’il a failli tomber dans l’oubli.
      de: |-
        Dieses Pokémon fiel in Form einer Steinstatue
        in solch einen langen Schlaf, dass es in
        Vergessenheit geraten ist.
      es: |-
        Con la apariencia de una estatua de piedra, este
        Pokémon se sumió en un letargo tan profundo
        que acabó cayendo en el olvido.
      it: |-
        Questo Pokémon è rimasto addormentato sotto
        forma di statua così a lungo da venire
        completamente dimenticato.
