  evolution_chain: snover
  evolves_from: ~
  flavor_text:
    diamond:
      en: |-
        It lives on snowy mountains.
        Having had little contact with
        humans, it is boldly inquisitive.
    pearl:
      en: |-
        In the spring, it grows berries
        with the texture of frozen treats
        around its belly.
    platinum:
      en: |-
        Seemingly curious about people,
        they gather around footsteps they
        find on snowy mountains.
    heartgold:
      en: |-
        During cold seasons, it migrates to the
        mountain’s lower reaches. It returns to
        the snow-covered summit in the spring.
    soulsilver:
      en: |-
        During cold seasons, it migrates to the
        mountain’s lower reaches. It returns to
        the snow-covered summit in the spring.
    black:
      en: |-
        Seemingly curious about people,
        they gather around footsteps they
        find on snowy mountains.
      fr: |-
        Curieux de rencontrer des gens, ils
        se rassemblent autour des traces
        de pas trouvées dans la montagne.
    white:
      en: |-
        Seemingly curious about people,
        they gather around footsteps they
        find on snowy mountains.
      fr: |-
        Curieux de rencontrer des gens, ils
        se rassemblent autour des traces
        de pas trouvées dans la montagne.
    black-2:
      en: |-
        Seemingly curious about people,
        they gather around footsteps they
        find on snowy mountains.
    white-2:
      en: |-
        Seemingly curious about people,
        they gather around footsteps they
        find on snowy mountains.
    x:
      ja-Hrkt: |-
        さむい　きせつは　やまの　ふもとまで
        おりてくるが　はるに　なると　ゆきが
        のこる　さんちょうに　もどっていく。
      ja: |-
        寒い　季節は　山の　ふもとまで
        降りてくるが　春に　なると
        雪が　残る　山頂に　戻っていく。
      ko: |-
        추운 계절에는 산기슭까지
        내려오지만 봄이 되면 눈이
        남아 있는 산 정상으로 돌아간다.
      en: |-
        During cold seasons, it migrates to the mountain’s
        lower reaches. It returns to the snow-covered
        summit in the spring.
      fr: |-
        Il s’aventure jusqu’au pied des montagnes en hiver,
        mais se réfugie sur les pics neigeux au printemps.
      de: |-
        Im Winter steigt es bis zum Fuß der Berge herab.
        Im Frühjahr kehrt es auf den Gipfel zurück.
      es: |-
        En las estaciones frías baja al pie de la montaña, pero
        regresa a las cimas nevadas en primavera.
      it: |-
        In inverno scende a valle, ma in primavera se ne
        torna sulle cime montuose dove c’è ancora neve.
    'y':
      ja-Hrkt: |-
        はるになると　アイスキャンディーの
        ような　しょっかんの　きのみが
        おなかの　まわりに　なる。
      ja: |-
        春になると　アイスキャンディーの
        ような　触感の　木の実が
        お腹の　まわりに　生る。
      ko: |-
        봄이 되면 아이스캔디와
        같은 촉감의 나무열매가
        배의 주위에 열린다.
      en: |-
        In the spring, it grows berries with the texture of
        frozen treats around its belly.
      fr: |-
        Au printemps, il fait pousser des Baies pareilles à
        des crèmes glacées autour de son ventre.
      de: |-
        Im Frühjahr wachsen Beeren, die wie gefrorene
        Süßigkeiten aussehen, um seinen Bauch herum.
      es: |-
        En primavera, le crecen bayas con apariencia de
        helado alrededor de la panza.
      it: |-
        In primavera, attorno al ventre gli crescono delle
        bacche simili a dolci ghiaccioli.
    omega-ruby:
      ja-Hrkt: |-
        さむい　きせつは　やまの　ふもとまで
        おりてくるが　はるに　なると　ゆきが
        のこる　さんちょうに　もどっていく。
      ja: |-
        寒い　季節は　山の　ふもとまで
        降りてくるが　春に　なると
        雪が　残る　山頂に　戻っていく。
      ko: |-
        추운 계절에는 산기슭까지
        내려오지만 봄이 되면 눈이
        남아 있는 산 정상으로 돌아간다.
      en: |-
        During cold seasons, it migrates to the mountain’s
        lower reaches. It returns to the snow-covered
        summit in the spring.
      fr: |-
        Il s’aventure jusqu’au pied des montagnes en hiver,
        mais se réfugie sur les pics neigeux au printemps.
      de: |-
        Im Winter steigt es bis zum Fuß der Berge herab.
        Im Frühjahr kehrt es auf den Gipfel zurück.
      es: |-
        En las estaciones frías baja al pie de la montaña, pero regresa
        a las cimas nevadas en primavera.
      it: |-
        In inverno scende a valle, ma in primavera se ne torna sulle
        cime montuose dove c’è ancora neve.
    alpha-sapphire:
      ja-Hrkt: |-
        はるになると　アイスキャンディーの
        ような　しょっかんの　きのみが
        おなかの　まわりに　なる。
      ja: |-
        春になると　アイスキャンディーの
        ような　食感の　木の実が
        お腹の　まわりに　生る。
      ko: |-
        봄이 되면 아이스캔디와
        같은 촉감의 나무열매가
        배의 주위에 열린다.
      en: |-
        In the spring, it grows berries with the texture of
        frozen treats around its belly.
      fr: |-
        Au printemps, il fait pousser des Baies pareilles à des crèmes
        glacées autour de son ventre.
      de: |-
        Im Frühjahr wachsen Beeren, die wie gefrorene Süßigkeiten
        aussehen, um seinen Bauch herum.
      es: |-
        En primavera, le crecen bayas con apariencia de helado
        alrededor de la panza.
      it: |-
        In primavera, attorno al ventre gli crescono delle bacche
        simili a dolci ghiaccioli.
    sword:
      ja-Hrkt: |-
        ゆきぶかい　やまにくらす。　ゆきに
        あしを　つきさして　すいぶんと
        れいきを　きゅうしゅう　するぞ。
      ja: |-
        雪深い　山に暮らす。　雪に
        脚を　突き刺して　水分と
        冷気を　吸収　するぞ。
      ko: |-
        눈이 많이 쌓인 산에 산다.
        눈에 다리를 찔러 넣어
        수분과 냉기를 흡수한다.
      zh-Hant: |-
        生活在積雪深厚的山上。
        會透過把腳踩進積雪中
        來吸收水分和冷氣。
      zh-Hans: |-
        生活在积雪深厚的山上。
        会通过把脚踩进积雪中
        来吸收水分和冷气。
      en: |-
        It lives on snowy mountains. It sinks its legs into
        the snow to absorb water and keep its own
        temperature down.
      fr: |-
        Il plante ses pieds dans la neige des montagnes
        où il vit pour absorber l’air froid et l’humidité.
      de: |-
        Es lebt auf verschneiten Bergen und steckt seine
        Füße in den Schnee, um über sie Wasser und
        Kälte zu absorbieren.
      es: |-
        Viven en montañas perennemente nevadas.
        Hunden las piernas en la nieve y absorben tanto
        humedad como aire frío.
      it: |-
        Vive sulle montagne innevate. Infila i piedi
        nella neve e assorbe acqua e freddo a volontà.
    shield:
      ja-Hrkt: |-
        おなかに　みのる　アイス　みたいな
        きのみは　ガラルに　くらす
        ダルマッカたちの　だいこうぶつ。
      ja: |-
        お腹に　実る　アイス　みたいな
        木の実は　ガラルに　暮らす
        ダルマッカたちの　大好物。
      ko: |-
        배에 열리는 아이스크림 같은
        나무열매는 가라르에 사는
        달막화들이 매우 좋아한다.
      zh-Hant: |-
        雪笠怪肚子上結出來的
        樹果口感彷如冰棒，
        是伽勒爾的火紅不倒翁們的最愛。
      zh-Hans: |-
        雪笠怪肚子上结出来的
        口感好似冰棍的树果
        是伽勒尔的火红不倒翁们的最爱。
      en: |-
        The berries that grow around its belly are like
        ice pops. Galarian Darumaka absolutely love
        these berries.
      fr: |-
        Les Baies en forme de crèmes glacées qui
        poussent sur son ventre sont le mets favori
        des Darumarond vivant à Galar.
      de: |-
        Die an Speiseeis erinnernden Beeren, die an
        seinem Bauch wachsen, sind bei den Flampion
        Galars ein sehr beliebter Snack.
      es: |-
        Las bayas con aspecto de helado que le crecen
        alrededor de la barriga son la comida favorita
        de los Darumaka que habitan en Galar.
      it: |-
        Le bacche simili a ghiaccioli che gli crescono
        attorno al ventre sono il cibo preferito dei
        Darumaka che vivono a Galar.
    legends-arceus:
      en: |-
        One is likely to encounter this Pokémon while out in the snow.
        There are stories of Snover appearing in human settlements but
        doing no harm—rather, they bond with the children.
