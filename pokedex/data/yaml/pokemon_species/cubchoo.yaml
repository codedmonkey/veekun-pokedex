cubchoo:
  base_happiness: 50
  capture_rate: 120
  color: white
  egg_groups:
    - ground
  evolution_chain: cubchoo
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        When it is not feeling well, its mucus
        gets watery and the power of its
        Ice-type moves decreases.
      fr: |-
        Quand il est malade, sa goutte au nez
        dégèle et ses capacités de type Glace
        deviennent moins efficaces.
    white:
      en: |-
        Its nose is always running. It sniffs the
        snot back up because the mucus
        provides the raw material for its moves.
      fr: |-
        Il a toujours la goutte au nez. Il
        l’aspire pour déclencher ses capacités.
        La morve en est la matière première.
    black-2:
      en: |-
        Their snot is a barometer of health.
        When healthy, their snot is sticky and
        the power of their ice moves increases.
    white-2:
      en: |-
        Their snot is a barometer of health.
        When healthy, their snot is sticky and
        the power of their ice moves increases.
    x:
      ja-Hrkt: |-
        いつも　はなみずを　たらしている。
        はなみずを　すすって　わざを　だす。
        はなみずが　わざの　もと　なのだ。
      ja: |-
        いつも　鼻水を　垂らしている。
        鼻水を　すすって　技を　出す。
        鼻水が　技の　素　なのだ。
      ko: |-
        언제나 콧물을 달고 다닌다.
        콧물을 훌쩍거려 기술을 사용한다.
        콧물이 기술의 재료인 셈이다.
      en: |-
        Its nose is always running. It sniffs the snot back up
        because the mucus provides the raw material for
        its moves.
      fr: |-
        Il a toujours la goutte au nez. Il l’aspire pour
        déclencher ses capacités. La morve en est la matière
        première.
      de: |-
        Der Schleim, der stets aus seiner Nase hängt,
        treibt seine Attacken an. Zieht es ihn hoch,
        steht ein Angriff bevor.
      es: |-
        Siempre está con mucosidades colgando. Las aspira
        para hacer un movimiento, ya que son su materia prima
        para esto.
      it: |-
        Ha sempre il naso gocciolante e se ne serve per
        lanciare le sue mosse. Il muco è l’origine della sua
        forza.
    'y':
      ja-Hrkt: |-
        はなみずは　けんこうの　バロメータ。
        ちょうしが　いいと　ねばりづよくなり
        こおりの　わざの　いりょくも　ます。
      ja: |-
        鼻水は　健康の　バロメータ。
        調子が　いいと　粘り強くなり
        氷の　技の　威力も　増す。
      ko: |-
        콧물은 건강의 척도다.
        상태가 좋으면 점성이 높아지고
        얼음 기술의 위력도 증가한다.
      en: |-
        Their snot is a barometer of health. When healthy,
        their snot is sticky and the power of their ice
        moves increases.
      fr: |-
        Sa roupie indique sa santé. S’il est en forme,
        elle sera épaisse et la puissance de ses attaques
        glacées augmentera.
      de: |-
        Fühlt es sich wohl, wird der Schleim, der aus seiner
        Nase trieft, klebrig und die Stärke seiner Eis-Attacken
        nimmt zu.
      es: |-
        Sus mocos son su barómetro de salud. Si es buena,
        serán densos, y la fuerza de sus movimientos de tipo
        Hielo aumentará.
      it: |-
        La goccia del naso è il barometro della sua salute. Se
        sta bene è bella viscosa e potenzia le sue mosse
        di tipo Ghiaccio.
    omega-ruby:
      ja-Hrkt: |-
        いつも　はなみずを　たらしている。
        はなみずを　すすって　わざを　だす。
        はなみずが　わざの　もと　なのだ。
      ja: |-
        いつも　鼻水を　垂らしている。
        鼻水を　すすって　技を　出す。
        鼻水が　技の　素　なのだ。
      ko: |-
        언제나 콧물을 달고 다닌다.
        콧물을 훌쩍거려 기술을 사용한다.
        콧물이 기술의 재료인 셈이다.
      en: |-
        Its nose is always running. It sniffs the snot back up
        because the mucus provides the raw material for
        its moves.
      fr: |-
        Il a toujours la goutte au nez. Il l’aspire pour déclencher
        ses capacités. La morve en est la matière première.
      de: |-
        Der Schleim, der stets aus seiner Nase hängt, treibt seine
        Attacken an. Zieht es ihn hoch, steht ein Angriff bevor.
      es: |-
        Siempre está con mucosidades colgando. Las aspira para
        hacer un movimiento, ya que son su materia prima para esto.
      it: |-
        Ha sempre il naso gocciolante e se ne serve per lanciare
        le sue mosse. Il muco è l’origine della sua forza.
    alpha-sapphire:
      ja-Hrkt: |-
        はなみずは　けんこうの　バロメータ。
        ちょうしが　いいと　ねばりづよくなり
        こおりの　わざの　いりょくも　ます。
      ja: |-
        鼻水は　健康の　バロメータ。
        調子が　いいと　粘り強くなり
        氷の　技の　威力も　増す。
      ko: |-
        콧물은 건강의 척도다.
        상태가 좋으면 점성이 높아지고
        얼음 기술의 위력도 증가한다.
      en: |-
        Their snot is a barometer of health. When healthy,
        their snot is sticky and the power of their ice
        moves increases.
      fr: |-
        Sa roupie indique sa santé. S’il est en forme, elle sera épaisse
        et la puissance de ses attaques glacées augmentera.
      de: |-
        Fühlt es sich wohl, wird der Schleim, der aus seiner Nase
        trieft, klebrig und die Stärke seiner Eis-Attacken nimmt zu.
      es: |-
        Sus mocos son su barómetro de salud. Si es buena, serán
        densos, y la fuerza de sus movimientos de tipo Hielo
        aumentará.
      it: |-
        La goccia del naso è il barometro della sua salute. Se sta bene
        è bella viscosa e potenzia le sue mosse di tipo Ghiaccio.
    sword:
      ja-Hrkt: |-
        たいちょうが　いいと　はなみずの
        ねばりけが　ます。　いやな　あいてに
        はなみずを　ぺとりと　なすりつける。
      ja: |-
        体調が　いいと　鼻水の
        粘り気が　増す。　嫌な　相手に
        鼻水を　ぺとりと　なすりつける。
      ko: |-
        컨디션이 좋으면 콧물의 점성이
        더해진다. 싫어하는 상대에게는
        콧물을 슥 문지른다.
      zh-Hant: |-
        健康時鼻涕的黏度會變強。
        只要遇到自己討厭的對手，
        就會把鼻涕擦到對方身上。
      zh-Hans: |-
        健康时鼻涕的粘度会变强。
        只要遇到自己讨厌的对手，
        就会把鼻涕擦到对方身上。
      en: |-
        When this Pokémon is in good health, its snot
        becomes thicker and stickier. It will smear its snot
        on anyone it doesn’t like.
      fr: |-
        Quand il est en forme, sa goutte au nez devient
        encore plus visqueuse. Il n’hésite pas à s’essuyer
        le nez sur un adversaire qui lui déplaît.
      de: |-
        Fühlt es sich wohl, erhöht sich die Klebrigkeit
        seines Nasenschleims. Wer es verärgert, wird
        damit angeschmiert.
      es: |-
        La pegajosidad de sus mocos aumenta cuando
        disfruta de buena salud. Si alguien no le gusta,
        lo embadurna de mocos.
      it: |-
        Se è in buona salute, la viscosità della goccia
        che gli fuoriesce dal naso aumenta. Se qualcuno
        non gli va a genio, lo imbratta con il suo muco.
    shield:
      ja-Hrkt: |-
        わざを　だすまえに　はなを　すする。
        はなみずに　ふくまれる　つよい
        れいきが　こおりの　わざの　もとだ。
      ja: |-
        技を　出す前に　鼻を　すする。
        鼻水に　含まれる　強い
        冷気が　氷の　技の　もとだ。
      ko: |-
        기술을 사용하기 전에 코를 훌쩍인다.
        콧물에 포함된 강한 냉기가
        얼음 기술의 근원이다.
      zh-Hant: |-
        使出招式前會先倒吸鼻涕。
        鼻涕裡所含有的強烈冷氣
        是冰屬性招式的能量來源。
      zh-Hans: |-
        使出招式前会先倒吸鼻涕。
        鼻涕里所含有的强烈冷气
        是冰属性招式的能量来源。
      en: |-
        It sniffles before performing a move, using its
        frosty snot to provide an icy element to any
        move that needs it.
      fr: |-
        Il renifle avant d’utiliser une capacité.
        Le froid intense contenu dans sa morve
        lui permet de lancer les capacités de type Glace.
      de: |-
        Es zieht vor jeder Attacke die Nase hoch. Die
        extreme Kälte in seinem Nasenschleim liefert
        die Energie für seine Eis-Attacken.
      es: |-
        Antes de ejecutar un movimiento, se sorbe los
        mocos. El frío intenso de estos constituye la base
        de sus movimientos de tipo Hielo.
      it: |-
        Prima di sferrare una mossa, tira su con il naso.
        Il freddo intenso contenuto nel suo muco è alla
        base delle sue mosse di tipo Ghiaccio.
