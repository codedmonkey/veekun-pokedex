    x:
      ja-Hrkt: |-
        マイナンと　プラスルの　でんきは
        けつえきの　ながれを　よくして
        こりを　ほぐす　こうかが　ある。
      ja: |-
        マイナンと　プラスルの　電気は
        血液の　流れを　良くして
        こりを　ほぐす　効果が　ある。
      ko: |-
        마이농과 플러시의 전기는
        혈액의 흐름을 좋게 하여
        근육 결림을 푸는 효과가 있다.
      en: |-
        Exposure to electricity from Minun and Plusle
        promotes blood circulation and relaxes muscles.
      fr: |-
        L’électricité de Posipi et Négapi favorise la circulation
        sanguine et guérit les courbatures.
      de: |-
        Mit elektrischen Schlägen regen Plusle und Minun
        den Blutkreislauf an und lösen so Verspannungen.
      es: |-
        La electricidad de Minun y Plusle es buena para la
        circulación y para desentumecer músculos.
      it: |-
        L’elettricità tra un Plusle e un Minun favorisce la
        circolazione sanguigna e scioglie le tensioni.
    'y':
      ja-Hrkt: |-
        なかまを　おうえんする　しゅうせい。
        まけそうになると　からだから　だす
        ひばなの　かずが　どんどん　ふえる。
      ja: |-
        仲間を　応援する　習性。
        負けそうになると　体から　出す
        火花の　数が　どんどん　増える。
      ko: |-
        동료를 응원하는 습성이 있다.
        질 것 같아지면 몸에서 내는
        스파크의 수가 점점 늘어난다.
      en: |-
        It cheers on friends. If its friends are losing,
        its body lets off more and more sparks.
      fr: |-
        Il encourage ses amis. Son corps produit plus
        d’étincelles quand il est en mauvaise posture.
      de: |-
        Es feuert Freunde an. Sind diese im Begriff zu
        verlieren, gibt sein Körper immer mehr Funken ab.
      es: |-
        Le gusta animar a sus amigos. Si pierden, su cuerpo
        suelta cada vez más chispas.
      it: |-
        Incoraggia gli amici e, se questi perdono, il suo
        corpo emette una maggiore quantità di scintille.
    omega-ruby:
      ja-Hrkt: |-
        じぶんよりも　なかまの　おうえんが　だいじ。
        からだから　はっする　でんきを　ショートさせて
        はでに　ひばなを　だしながら　おうえんするぞ。
      ja: |-
        自分よりも　仲間の　応援が　大事。
        体から　発する　電気を　ショートさせて
        派手に　火花を　出しながら　応援するぞ。
      ko: |-
        자신보다 동료를 응원하는 것이 중요하다.
        몸에서 나오는 전기를 합선시켜
        화려한 불꽃을 내며 응원한다.
      en: |-
        Minun is more concerned about cheering on its partners than
        its own safety. It shorts out the electricity in its body to create
        brilliant showers of sparks to cheer on its teammates.
      fr: |-
        Négapi n’hésite pas à se mettre en danger pour soutenir
        ses partenaires. Il court-circuite son corps pour faire jaillir
        des gerbes d’étincelles et donner du cœur à l’ouvrage
        à ses équipiers.
      de: |-
        Minun kümmert sich mehr um das Anfeuern seiner Partner
        als um seine eigene Sicherheit. Es nutzt die Elektrizität in
        seinem Körper dazu, einen Funkenregen zu erzeugen und
        seine Teamkameraden anzufeuern.
      es: |-
        Minun se preocupa más por alentar a sus compañeros de
        equipo que por su propia seguridad. Para animar a los
        miembros de su grupo, crea un cortocircuito en su interior
        y libera un chisporroteo espectacular.
      it: |-
        Minun si impegna a tenere alto il morale dei suoi compagni
        di squadra, anche a rischio della sua stessa sicurezza.
        Crea vivaci cortocircuiti con l’elettricità del suo corpo per
        rallegrare tutta la squadra.
    alpha-sapphire:
      ja-Hrkt: |-
        なかまの　おうえんが　だいすきな　ポケモン。
        なかまが　まけそうに　なると　からだから　でる
        ひばなの　かずが　どんどん　ふえていくよ。
      ja: |-
        仲間の　応援が　大好きな　ポケモン。
        仲間が　負けそうに　なると　体から　出る
        火花の　数が　どんどん　増えていくよ。
      ko: |-
        동료를 응원하는 것을 매우 좋아하는 포켓몬이다.
        동료가 질 것 같으면 몸에서 나오는
        불꽃의 수가 점점 늘어난다.
      en: |-
        Minun loves to cheer on its partner in battle. It gives off sparks
        from its body while it is doing so. If its partner is in trouble,
        this Pokémon gives off increasing amounts of sparks.
      fr: |-
        Négapi adore encourager son partenaire pendant les combats.
        Des étincelles jaillissent alors de son corps. Lorsque son
        partenaire est en difficulté, le corps de ce Pokémon libère
        encore plus d’étincelles.
      de: |-
        Minun liebt es, seinen Partner im Kampf anzufeuern. Dabei
        sprüht es Funken aus seinem Körper. Wenn sein Partner in
        Schwierigkeiten gerät, sprüht es immer mehr Funken.
      es: |-
        Minun empieza a echar chispas cuando está animando a su
        compañero en pleno combate. Si su compañero está en
        peligro, el chisporroteo aumenta su intensidad por momentos.
      it: |-
        Minun ama tenere alto il morale della squadra nella lotta,
        emanando scintille da tutto il corpo. Se la sua squadra
        è in difficoltà, emette una maggiore quantità di scintille.
