joltik:
  base_happiness: 50
  capture_rate: 190
  color: yellow
  egg_groups:
    - bug
  evolution_chain: joltik
  evolves_from: ~
  flavor_text:
    black:
      en: |-
        Joltik that live in cities have learned
        a technique for sucking electricity
        from the outlets in houses.
      fr: |-
        Les Statitik qui vivent en ville ont
        appris à aspirer le courant depuis
        les prises électriques des maisons.
    white:
      en: |-
        They attach themselves to large-bodied
        Pokémon and absorb static electricity,
        which they store in an electric pouch.
      fr: |-
        Il s’accroche aux Pokémon plus grands
        et aspire leur électricité statique.
        Il la stocke dans ses poches-accus.
    black-2:
      en: |-
        Since it can’t generate its own
        electricity, it sticks onto large-bodied
        Pokémon and absorbs static electricity.
    white-2:
      en: |-
        Since it can’t generate its own
        electricity, it sticks onto large-bodied
        Pokémon and absorbs static electricity.
    x:
      ja-Hrkt: |-
        じぶんでは　でんきを　つくれないので
        ほかの　おおきな　ポケモンに
        とりつき　せいでんきを　すいとる。
      ja: |-
        自分では　電気を　つくれないので
        他の　大きな　ポケモンに
        とりつき　静電気を　吸いとる。
      ko: |-
        스스로 전기를 만들 수 없어
        다른 큰 포켓몬에
        달라붙어 정전기를 흡수한다.
      en: |-
        Since it can’t generate its own electricity, it sticks
        onto large-bodied Pokémon and absorbs
        static electricity.
      fr: |-
        Ne produisant pas lui-même d’électricité, il s’accroche
        aux Pokémon plus grands et aspire leur électricité
        statique.
      de: |-
        Da es selbst keinen Strom erzeugen kann,
        klettert es auf andere Pokémon, um ihnen
        elektrostatische Energie abzusaugen.
      es: |-
        No puede generar electricidad por sí mismo, así que se
        encarama a Pokémon grandes y absorbe su energía
        estática.
      it: |-
        Non può produrre elettricità da sé, per cui si attacca
        a Pokémon più grandi per succhiarne l’energia
        elettrostatica.
    'y':
      ja-Hrkt: |-
        からだの　おおきな　ポケモンに
        とりついて　せいでんきを　すいとり
        ちくでんぶくろに　でんきを　ためる。
      ja: |-
        体の　大きな　ポケモンに　とりついて
        静電気を　吸い取り
        蓄電袋に　電気を　ためる。
      ko: |-
        몸이 큰 포켓몬에게 매달려
        정전기를 빨아들인 후
        축전 주머니에 전기를 모은다.
      en: |-
        They attach themselves to large-bodied Pokémon
        and absorb static electricity, which they store in an
        electric pouch.
      fr: |-
        Il s’accroche aux Pokémon plus grands et aspire
        leur électricité statique. Il la stocke dans ses
        poches-accus.
      de: |-
        Es pflanzt sich an großen Pokémon fest und zapft
        ihnen elektrische Energie ab. Diese hortet es in
        seinen Ladetaschen.
      es: |-
        Se agarra a Pokémon de gran tamaño, absorbe su
        electricidad estática y la guarda en una bolsa interna.
      it: |-
        Si aggrappa ai Pokémon più grossi e ne assorbe
        l’energia statica che conserva in una sacca
        d’accumulo.
    omega-ruby:
      ja-Hrkt: |-
        じぶんでは　でんきを　つくれないので
        ほかの　おおきな　ポケモンに
        とりつき　せいでんきを　すいとる。
      ja: |-
        自分では　電気を　つくれないので
        他の　大きな　ポケモンに
        とりつき　静電気を　吸いとる。
      ko: |-
        스스로 전기를 만들 수 없어
        다른 큰 포켓몬에
        달라붙어 정전기를 흡수한다.
      en: |-
        Since it can’t generate its own electricity, it sticks
        onto large-bodied Pokémon and absorbs
        static electricity.
      fr: |-
        Ne produisant pas lui-même d’électricité, il s’accroche
        aux Pokémon plus grands et aspire leur électricité statique.
      de: |-
        Da es selbst keinen Strom erzeugen kann, klettert es auf
        andere Pokémon, um ihnen elektrostatische Energie
        abzusaugen.
      es: |-
        No puede generar electricidad por sí mismo, así que se
        encarama a Pokémon grandes y absorbe su energía estática.
      it: |-
        Non può produrre elettricità da sé, per cui si attacca a
        Pokémon più grandi per succhiarne l’energia elettrostatica.
    alpha-sapphire:
      ja-Hrkt: |-
        からだの　おおきな　ポケモンに
        とりついて　せいでんきを　すいとり
        ちくでんぶくろに　でんきを　ためる。
      ja: |-
        体の　大きな　ポケモンに　とりついて
        静電気を　吸い取り
        蓄電袋に　電気を　ためる。
      ko: |-
        몸이 큰 포켓몬에게 매달려
        정전기를 빨아들인 후
        축전 주머니에 전기를 모은다.
      en: |-
        They attach themselves to large-bodied Pokémon
        and absorb static electricity, which they store in an
        electric pouch.
      fr: |-
        Il s’accroche aux Pokémon plus grands et aspire leur
        électricité statique. Il la stocke dans ses poches-accus.
      de: |-
        Es pflanzt sich an großen Pokémon fest und zapft ihnen
        elektrische Energie ab. Diese hortet es in seinen Ladetaschen.
      es: |-
        Se agarra a Pokémon de gran tamaño, absorbe su electricidad
        estática y la guarda en una bolsa interna.
      it: |-
        Si aggrappa ai Pokémon più grossi e ne assorbe l’energia
        statica che conserva in una sacca d’accumulo.
    sword:
      ja-Hrkt: |-
        ポケモンの　からだに　くっついて
        せいでんきを　すいとる。　じぶんでは
        でんきを　つくることが　できない。
      ja: |-
        ポケモンの　体に　くっついて
        静電気を　吸い取る。　自分では
        電気を　つくることが　できない。
      ko: |-
        포켓몬의 몸에 들러붙어
        정전기를 흡수한다.
        스스로는 전기를 만들 수 없다.
      zh-Hant: |-
        會附在寶可夢的身上
        吸收靜電。自身並沒有
        製造電的能力。
      zh-Hans: |-
        会附在宝可梦的身上
        吸取静电。自身并没有
        制造电的能力。
      en: |-
        Joltik can be found clinging to other Pokémon.
        It’s soaking up static electricity because it can’t
        produce a charge on its own.
      fr: |-
        Il s’accroche au corps des autres Pokémon pour
        absorber leur électricité statique. Il est incapable
        d’en produire tout seul.
      de: |-
        Wattzapf heftet sich an andere Pokémon und
        saugt ihnen statische Elektrizität ab. Es selbst
        kann keinen Strom produzieren.
      es: |-
        No puede generar electricidad por sí mismo,
        así que se encarama a otros Pokémon y absorbe
        su energía estática.
      it: |-
        Si aggrappa al corpo di altri Pokémon e ne
        assorbe l’energia elettrostatica. Non può
        produrre elettricità da sé.
    shield:
      ja-Hrkt: |-
        ほかの　ポケモンに　とりついて
        せいでんきを　すいとる。　ワンパチの
        おしりに　よく　くっついている。
      ja: |-
        ほかの　ポケモンに　とりついて
        静電気を　吸い取る。　ワンパチの
        お尻に　よく　くっついている。
      ko: |-
        다른 포켓몬에게 달라붙어
        정전기를 빨아들인다. 멍파치의
        엉덩이에 자주 달라붙어 있다.
      zh-Hant: |-
        會附在其他寶可夢身上
        吸取靜電。經常會把自己
        貼在來電汪的屁股上。
      zh-Hans: |-
        会附在其他宝可梦身上
        吸取静电。经常会把自己
        贴在来电汪的屁股上。
      en: |-
        Joltik latch on to other Pokémon and suck out
        static electricity. They’re often found sticking to
        Yamper’s hindquarters.
      fr: |-
        Il s’accroche aux autres Pokémon pour aspirer
        leur électricité statique. On en trouve souvent
        collés au postérieur de Voltoutou.
      de: |-
        Es heftet sich an andere Pokémon und saugt
        ihnen statische Elektrizität aus. Häufig wird es
        an Hinterteilen von Voldi gesichtet.
      es: |-
        Se agarra a otros Pokémon para absorber su
        electricidad estática. Es muy común verlo
        aferrado a las posaderas de un Yamper.
      it: |-
        Si attacca ad altri Pokémon per assorbirne
        l’energia elettrostatica. Non è raro trovarne
        uno sul posteriore di Yamper.
